# =============================================================================
# PRD Benchmark Scaffold — Real Estate Auction Marketplace & Trustee Sale Bidding
# Difficulty band: Expert+ (see complexity_profile.difficulty_level)
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2436. Real Estate Auction Marketplace & Trustee Sale Bidding (online real estate auction
  platform): asset intake from servicers, banks and sellers with occupancy status and title
  condition disclosures, auction event scheduling with reserve prices, opening bids and
  extension rules on late bids, bidder registration with deposit holds, identity verification
  and eligibility exclusions, live trustee sale bidding integration with county sale
  postponements and cancellations, winning bid contract execution, deposit forfeiture terms
  and closing deadlines, buyer premium calculation and settlement with the seller,
  post-auction fallout, relisting and second-chance offers, title and eviction risk
  disclosure to bidders

domain_name: trustee-auction-marketplace

# All §1.5 paths below are absolute and complete; the prefix is the API root.
api_prefix: "/"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # graph: AuctionLot is a junction between AuctionEvent and AssetListing; DepositHold is a
  # junction between Bidder and AuctionLot; Bid is a junction between Bidder and AuctionLot;
  # SecondChanceOffer joins AuctionLot back to a losing Bidder. TrusteeSale bridges
  # AssetListing -> AuctionEvent, so the county-sale axis and the marketplace axis meet at
  # the lot. No strict ownership tree exists and no entity nests under a single parent.

  state_machine_shape: cyclic
  # AuctionEvent: SCHEDULED -> LIVE -> POSTPONED -> SCHEDULED -> LIVE (county postponement /
  # reschedule loop). Bidder: REGISTERED -> SUSPENDED -> REGISTERED (exclusion / lift loop).
  # AssetListing runs two independent axes (listing_status x title_clearance_status) and
  # loops DISCLOSURE_READY -> ... -> RELIST_PENDING -> DISCLOSURE_READY on relist.
  # AuctionEvent additionally auto-CLOSES as a compound function of its lots' states.

  relationship_patterns:
    - many_to_many        # AuctionLot(AuctionEvent x AssetListing), Bid/DepositHold(Bidder x AuctionLot)
    - one_to_many         # Seller -> AssetListing, AuctionLot -> Bid
    - cross_aggregate     # TrusteeSale (county aggregate) drives AuctionEvent + AuctionLot + DepositHold
    - polymorphic: false

  role_model: segregation_of_duties
  # The AuctionOps operator who closes a lot may not execute that lot's sale contract
  # (four-eyes rule keyed on X-User-ID); Trustee, TitleOfficer and ComplianceOfficer own
  # disjoint slices of the same asset, and Seller/Bidder are entity-backed principals.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: legal name of the servicer, bank or private seller
        constraints: "1..200 chars, non-blank"
      - name: seller_type
        type: enum
        source: input
        description: intake channel this seller represents
        constraints: "one of {SERVICER, BANK, PRIVATE_SELLER, GSE}"
      - name: contact_email
        type: string
        source: input
        description: settlement contact mailbox
        constraints: "must contain '@'"
      - name: settlement_account_ref
        type: string
        source: input
        description: opaque banking reference credited on settlement
      - name: default_commission_bps
        type: integer
        source: input
        description: seller commission in basis points applied by settlement_split
        default: 500
        constraints: "0..1500"
      - name: settled_net_cents
        type: integer
        source: computed
        description: >-
          running sum of SaleContract.seller_net_cents over SaleContracts whose
          settlement_status == POSTED and whose lot's AssetListing.seller_id == this Seller.id;
          starts at 0 and is incremented only by POST /sale-contracts/{id}/close
        default: 0

  - name: AssetListing
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller that submitted this asset for intake"
      - name: street_address
        type: string
        source: input
        description: street line of the subject property
      - name: city
        type: string
        source: input
        description: city of the subject property
      - name: county_code
        type: string
        source: input
        description: county recording jurisdiction, e.g. "CA-ALAMEDA"
        constraints: "uppercase, 3..32 chars"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code
        constraints: "exactly 2 uppercase letters"
      - name: estimated_value_cents
        type: integer
        source: input
        description: seller's estimate of fair market value, in cents
        constraints: "> 0"
      - name: occupancy_status
        type: enum
        source: input
        description: >-
          occupancy disclosure supplied by POST /asset-listings/{id}/disclosures; drives both
          buyer_premium occupancy surcharge and required_deposit multiplier
        default: UNKNOWN
        constraints: "one of {OWNER_OCCUPIED, TENANT_OCCUPIED, VACANT, UNKNOWN}"
      - name: title_condition
        type: enum
        source: input
        description: >-
          title condition of record; initially the seller's disclosure, overwritten with
          TitleOfficer's verified_title_condition by POST /asset-listings/{id}/title-clearance
        default: UNKNOWN
        constraints: "one of {CLEAR, JUNIOR_LIENS, CLOUDED, UNKNOWN}"
      - name: eviction_risk_tier
        type: enum
        source: computed
        description: bidder-facing eviction risk tier, see calculations.eviction_risk_tier
        default: HIGH
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: listing_status
        type: enum
        source: system
        description: marketplace lifecycle axis (independent of title_clearance_status)
        default: INTAKE
        constraints: >-
          one of {INTAKE, DISCLOSURE_READY, LISTED, SOLD_PENDING_CONTRACT, SOLD_CLOSED,
          UNSOLD, RELIST_PENDING}
      - name: title_clearance_status
        type: enum
        source: system
        description: title-work axis, evolves independently of listing_status
        default: PENDING
        constraints: "one of {PENDING, CLEARED, CLOUDED_DISCLOSED, DEFECTIVE}"
      - name: relist_count
        type: integer
        source: system
        description: number of times POST /asset-listings/{id}/relist has succeeded
        default: 0
      - name: second_chance_eligible
        type: boolean
        source: computed
        description: >-
          recomputed on POST /sale-contracts/{id}/fallout; true iff at least one Bid on the
          fallen-out lot satisfies the backup_bidder_selector candidate filter
        default: false
      - name: disclosure_ack_at
        type: datetime
        source: system
        description: logical-clock instant at which the seller acknowledged the disclosures

  - name: TrusteeSale
    parent: null
    common_fields: true
    fields:
      - name: asset_listing_id
        type: string
        source: input
        description: "FK -> AssetListing.id; the asset noticed for county trustee sale"
      - name: county_code
        type: string
        source: input
        description: county holding the sale; must equal the listing's county_code
      - name: sale_scheduled_at
        type: datetime
        source: input
        description: currently noticed county sale instant, rewritten on each postponement
        constraints: "must be strictly after the logical clock at write time"
      - name: statutory_max_postponements
        type: integer
        source: input
        description: county statutory cap on postponements for this notice
        default: 3
        constraints: "0..10"
      - name: postponement_count
        type: integer
        source: system
        description: number of successful postponements; feeds postponement carry pricing
        default: 0
      - name: status
        type: enum
        source: system
        description: county sale status
        default: PENDING
        constraints: "one of {PENDING, CONFIRMED, POSTPONED, CANCELLED, HELD}"
      - name: confirmation_reference
        type: string
        source: input
        description: trustee's confirmation docket reference, set by /confirm
      - name: cancellation_reason
        type: string
        source: input
        description: reason recorded by /cancel (e.g. reinstatement, bankruptcy stay)

  - name: AuctionEvent
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: operator-facing name of the auction session
      - name: county_code
        type: string
        source: input
        description: >-
          county calendar this event occupies; the county_slot_overlap rule treats
          (county_code, [starts_at, ends_at] +/- COUNTY_BUFFER_MINUTES) as the contended resource
      - name: trustee_sale_id
        type: string
        source: input
        description: >-
          FK -> TrusteeSale.id; nullable — null means a pure REO online event with no county
          sale linkage, in which case postponement carry pricing is skipped
      - name: starts_at
        type: datetime
        source: input
        description: inclusive start of the session window
      - name: ends_at
        type: datetime
        source: input
        description: inclusive end of the session window
        constraints: "must be strictly after starts_at"
      - name: event_status
        type: enum
        source: system
        description: session lifecycle; cycles SCHEDULED -> LIVE -> POSTPONED -> SCHEDULED
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LIVE, POSTPONED, CANCELLED, CLOSED}"
      - name: reschedule_count
        type: integer
        source: system
        description: number of POST /auction-events/{id}/reschedule calls that succeeded
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent SCHEDULED -> LIVE transition
      - name: lot_count
        type: integer
        source: computed
        description: count of AuctionLot rows with auction_event_id == this event
        default: 0

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - name: auction_event_id
        type: string
        source: input
        description: "FK -> AuctionEvent.id; session this lot is offered in"
      - name: asset_listing_id
        type: string
        source: input
        description: "FK -> AssetListing.id; asset offered as this lot"
      - name: lot_number
        type: integer
        source: input
        description: operator-assigned lot ordinal within the event
        constraints: "> 0; unique per auction_event_id"
      - name: lot_window_start_at
        type: datetime
        source: input
        description: >-
          start of this lot's bidding window; the lot_window_overlap rule treats
          (asset_listing_id, [lot_window_start_at, lot_window_end_at)) as the contended resource
      - name: lot_window_end_at
        type: datetime
        source: input
        description: exclusive end of this lot's bidding window
        constraints: "must be strictly after lot_window_start_at"
      - name: opening_bid_cents
        type: integer
        source: input
        description: minimum acceptable first bid, and the base of required_deposit_cents
        constraints: "> 0"
      - name: min_increment_cents
        type: integer
        source: input
        description: minimum raise over current_high_bid_cents for any non-first bid
        default: 500000
        constraints: "> 0"
      - name: reserve_price_cents
        type: integer
        source: input
        description: seller's confidential reserve; a lot closes NO_SALE below it
        constraints: ">= opening_bid_cents"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: per-bidder deposit hold amount, see calculations.required_deposit
      - name: bid_close_at
        type: datetime
        source: computed
        description: >-
          effective close instant; initialised to lot_window_end_at at creation and pushed
          forward by calculations.late_bid_extension
      - name: extension_count
        type: integer
        source: system
        description: number of late-bid extensions granted to this lot
        default: 0
      - name: current_high_bid_cents
        type: integer
        source: computed
        description: amount_cents of the Bid on this lot with bid_status == ACTIVE (at most one)
        default: 0
      - name: hammer_price_cents
        type: integer
        source: computed
        description: winning amount_cents fixed by POST /auction-lots/{id}/close, else 0
        default: 0
      - name: provisional_buyer_premium_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of calculations.buyer_premium, fixed at lot close
        default: 0
      - name: lot_status
        type: enum
        source: system
        description: lot lifecycle
        default: PENDING
        constraints: >-
          one of {PENDING, OPEN, EXTENDED, SUSPENDED, CLOSED_SOLD, CLOSED_NO_SALE, WITHDRAWN}
      - name: closed_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the AuctionOps operator that closed this lot; the
          segregation_of_duties check compares it against the contract executor
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of lot close

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: bidder's legal name as presented for identity verification
      - name: email
        type: string
        source: input
        description: bidder contact mailbox
        constraints: "must contain '@'"
      - name: mailing_address
        type: string
        source: input
        description: bidder mailing address of record
      - name: identity_verification_status
        type: enum
        source: system
        description: KYC outcome recorded by ComplianceOfficer
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, VERIFIED, REJECTED}"
      - name: identity_verified_at
        type: datetime
        source: system
        description: >-
          logical-clock instant at which identity_verification_status became VERIFIED; the
          AUDIT variant of bidder_risk_score reads this instead of the current status
      - name: registration_status
        type: enum
        source: system
        description: bidding eligibility axis; cycles REGISTERED -> SUSPENDED -> REGISTERED
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, REGISTERED, SUSPENDED, REJECTED, BARRED}"
      - name: deposit_funded_cents
        type: integer
        source: system
        description: lifetime sum of POST /bidders/{id}/deposits amount_cents
        default: 0
      - name: deposit_available_cents
        type: integer
        source: computed
        description: unencumbered deposit, see calculations.deposit_ledger
        default: 0
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        description: sum of DepositHold.amount_cents for this bidder with status == CAPTURED
        default: 0
      - name: fallout_count
        type: integer
        source: system
        description: number of SaleContracts of this bidder that reached FALLOUT
        default: 0
      - name: screen_risk_score
        type: integer
        source: computed
        description: >-
          SCREEN variant of calculations.bidder_risk_score evaluated with no lot context;
          recomputed on identity verification, exclusion create/lift, deposit funding and
          fallout
        default: 25

  - name: EligibilityExclusion
    parent: null
    common_fields: true
    fields:
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; the excluded bidder"
      - name: exclusion_type
        type: enum
        source: input
        description: >-
          basis for the exclusion; PRIOR_FALLOUT rows are system-created by the fallout
          cascade and are never accepted on POST
        constraints: "one of {SANCTIONS_LIST, TRUSTEE_AFFILIATE, STATE_INELIGIBLE, PRIOR_FALLOUT}"
      - name: county_code
        type: string
        source: input
        description: >-
          scope of the exclusion; the literal "ALL" means platform-wide (and suspends the
          bidder), any other value scopes the exclusion to AuctionEvents in that county only
        default: ALL
      - name: effective_at
        type: datetime
        source: input
        description: instant from which the exclusion bites; may be in the future
      - name: status
        type: enum
        source: system
        description: exclusion status
        default: ACTIVE
        constraints: "one of {ACTIVE, LIFTED}"
      - name: lifted_at
        type: datetime
        source: system
        description: >-
          logical-clock instant of POST /eligibility-exclusions/{id}/lift; the AUDIT variant
          of bidder_risk_score compares it against the event start
      - name: notes
        type: string
        source: input
        description: compliance analyst note

  - name: DepositHold
    parent: null
    common_fields: true
    fields:
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; bidder whose deposit is encumbered"
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; lot the hold secures"
      - name: amount_cents
        type: integer
        source: computed
        description: snapshot of AuctionLot.required_deposit_cents at hold creation
      - name: status
        type: enum
        source: system
        description: hold status
        default: HELD
        constraints: "one of {HELD, EXTENDED, RELEASED, CAPTURED}"
      - name: expires_at
        type: datetime
        source: computed
        description: >-
          created_at + HOLD_INITIAL_DAYS, pushed to clock + HOLD_EXTENSION_DAYS by the
          postponement cascade
      - name: extension_count
        type: integer
        source: system
        description: number of postponement-driven extensions applied to this hold
        default: 0
      - name: released_reason
        type: enum
        source: system
        description: why the hold left the encumbered states
        constraints: >-
          one of {OUTBID, NO_SALE, CONTRACT_CLOSED, EVENT_CANCELLED, EXTENSION_LIMIT,
          FORFEITED}

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; lot bid upon"
      - name: bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; bidder that placed this bid"
      - name: amount_cents
        type: integer
        source: input
        description: bid amount in cents
        constraints: "> 0"
      - name: placed_at
        type: datetime
        source: system
        description: logical-clock instant the bid was accepted
      - name: bid_status
        type: enum
        source: system
        description: bid standing
        default: ACTIVE
        constraints: "one of {ACTIVE, OUTBID, WINNING, WITHDRAWN}"
      - name: is_above_reserve
        type: boolean
        source: computed
        description: amount_cents >= AuctionLot.reserve_price_cents, fixed at bid acceptance
      - name: triggered_extension
        type: boolean
        source: computed
        description: true iff this bid caused a late_bid_extension
        default: false

  - name: SaleContract
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; the sold lot this contract executes"
      - name: winning_bidder_id
        type: string
        source: computed
        description: >-
          bidder_id of the Bid on auction_lot_id whose bid_status == WINNING (exactly one
          such Bid exists once the lot is CLOSED_SOLD)
      - name: contract_price_cents
        type: integer
        source: computed
        description: see calculations.contract_price (hammer plus postponement carry)
      - name: final_buyer_premium_cents
        type: integer
        source: computed
        description: FINAL variant of calculations.buyer_premium
      - name: doc_fee_cents
        type: integer
        source: computed
        description: see calculations.doc_fee_and_total_due (step 2)
      - name: total_due_cents
        type: integer
        source: computed
        description: see calculations.doc_fee_and_total_due (step 3)
      - name: closing_window_days
        type: integer
        source: input
        description: buyer's closing window in days from execution
        default: 21
        constraints: "1..90"
      - name: closing_deadline_at
        type: datetime
        source: computed
        description: execution_at + closing_window_days
      - name: contract_status
        type: enum
        source: system
        description: contract lifecycle; branches EXECUTED -> {CLOSED, FALLOUT}
        default: EXECUTED
        constraints: "one of {EXECUTED, CLOSED, FALLOUT}"
      - name: execution_at
        type: datetime
        source: system
        description: logical-clock instant of contract execution
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AuctionOps operator that executed the contract
      - name: settlement_status
        type: enum
        source: system
        description: seller settlement axis on the SALE numbers
        default: DRAFT
        constraints: "one of {DRAFT, POSTED, VOID}"
      - name: settlement_gross_cents
        type: integer
        source: computed
        description: contract_price_cents + final_buyer_premium_cents
      - name: seller_net_cents
        type: integer
        source: computed
        description: see calculations.settlement_split
      - name: platform_fee_cents
        type: integer
        source: computed
        description: see calculations.settlement_split
      - name: buyer_premium_cents
        type: integer
        source: computed
        description: premium retained by the platform, equal to final_buyer_premium_cents
      - name: forfeited_deposit_cents
        type: integer
        source: computed
        description: amount_cents of the CAPTURED DepositHold, 0 until fallout
        default: 0
      - name: forfeiture_seller_net_cents
        type: integer
        source: computed
        description: seller's share of the forfeited deposit, see calculations.forfeiture_split
        default: 0
      - name: forfeiture_platform_fee_cents
        type: integer
        source: computed
        description: platform's share of the forfeited deposit, see calculations.forfeiture_split
        default: 0
      - name: fallout_reason
        type: string
        source: input
        description: reason recorded by POST /sale-contracts/{id}/fallout
      - name: closing_reference
        type: string
        source: input
        description: escrow reference recorded by POST /sale-contracts/{id}/close
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of contract close
      - name: fallout_at
        type: datetime
        source: system
        description: logical-clock instant of fallout

  - name: SecondChanceOffer
    parent: null
    common_fields: true
    fields:
      - name: auction_lot_id
        type: string
        source: input
        description: "FK -> AuctionLot.id; lot whose sale fell out"
      - name: offered_bidder_id
        type: string
        source: computed
        description: >-
          FK -> Bidder.id; server-selected backup bidder, see
          calculations.backup_bidder_selector — never supplied by the client
      - name: offer_price_cents
        type: integer
        source: computed
        description: amount_cents of the selected backup Bid
      - name: expires_at
        type: datetime
        source: computed
        description: creation clock instant + OFFER_WINDOW_HOURS
      - name: status
        type: enum
        source: system
        description: offer status
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, ACCEPTED, DECLINED, EXPIRED}"
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant of the bidder's response

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AssetListing
    initial_state: INTAKE
    terminal_states: [SOLD_CLOSED]
    note: >-
      Two independent axes on one row. Axis A is listing_status (transitions below whose
      `axis: listing_status`); axis B is title_clearance_status (transitions whose
      `axis: title_clearance_status`). Neither axis gates the other's transitions; only
      cross-entity rules read both.
    transitions:
      - from: INTAKE
        to: DISCLOSURE_READY
        axis: listing_status
        trigger: "POST /asset-listings/{id}/disclosures"
        actor: Seller
        preconditions:
          - "listing_status == INTAKE"
          - "acting X-User-ID == AssetListing.seller_id"
        side_effects:
          - "occupancy_status and title_condition overwritten from the request body"
          - "eviction_risk_tier recomputed per calculations.eviction_risk_tier"
          - "disclosure_ack_at set to the logical clock"
      - from: DISCLOSURE_READY
        to: LISTED
        axis: listing_status
        trigger: "POST /auction-events/{id}/lots (cross-entity side effect of lot creation)"
        actor: AuctionOps
        preconditions:
          - "listing_status IN {DISCLOSURE_READY, LISTED}"
          - "title_clearance_status != DEFECTIVE"
        side_effects:
          - "listing_status set to LISTED (idempotent when already LISTED)"
      - from: LISTED
        to: SOLD_PENDING_CONTRACT
        axis: listing_status
        trigger: "POST /auction-lots/{id}/close resulting in CLOSED_SOLD"
        actor: AuctionOps
        preconditions:
          - "the closing lot's hammer_price_cents >= lot.reserve_price_cents"
        side_effects:
          - "listing_status set to SOLD_PENDING_CONTRACT"
      - from: LISTED
        to: UNSOLD
        axis: listing_status
        trigger: "POST /auction-lots/{id}/close resulting in CLOSED_NO_SALE"
        actor: AuctionOps
        preconditions:
          - "no Bid on the lot with bid_status == ACTIVE and is_above_reserve == true"
        side_effects:
          - "listing_status set to UNSOLD"
      - from: LISTED
        to: UNSOLD
        axis: listing_status
        trigger: "POST /trustee-sales/{id}/cancel (cross-entity cascade through the event and its lots)"
        actor: system
        preconditions:
          - "listing_status == LISTED"
          - "every lot of this asset on the cancelled sale's events reached WITHDRAWN in the same request"
        side_effects:
          - "listing_status set to UNSOLD, making the asset relistable"
      - from: SOLD_PENDING_CONTRACT
        to: SOLD_CLOSED
        axis: listing_status
        trigger: "POST /sale-contracts/{id}/close"
        actor: AuctionOps
        preconditions:
          - "SaleContract.contract_status == EXECUTED"
        side_effects:
          - "listing_status set to SOLD_CLOSED (terminal on axis A)"
      - from: SOLD_PENDING_CONTRACT
        to: RELIST_PENDING
        axis: listing_status
        trigger: "POST /sale-contracts/{id}/fallout (link 4 of fallout_cascade)"
        actor: AuctionOps
        preconditions:
          - "the fallout cascade has already CAPTURED the winning bidder's DepositHold"
        side_effects:
          - "listing_status set to RELIST_PENDING"
          - "second_chance_eligible recomputed against calculations.backup_bidder_selector"
      - from: RELIST_PENDING
        to: DISCLOSURE_READY
        axis: listing_status
        trigger: "POST /asset-listings/{id}/relist"
        actor: Seller
        preconditions:
          - "listing_status IN {RELIST_PENDING, UNSOLD}"
          - "title_clearance_status != DEFECTIVE"
          - "acting X-User-ID == AssetListing.seller_id"
        side_effects:
          - "relist_count incremented by 1"
          - "second_chance_eligible reset to false"
          - "title_clearance_status reset to PENDING (axis B loops)"
      - from: UNSOLD
        to: DISCLOSURE_READY
        axis: listing_status
        trigger: "POST /asset-listings/{id}/relist"
        actor: Seller
        preconditions:
          - "listing_status IN {RELIST_PENDING, UNSOLD}"
          - "title_clearance_status != DEFECTIVE"
        side_effects:
          - "relist_count incremented by 1"
          - "title_clearance_status reset to PENDING"
      - from: RELIST_PENDING
        to: SOLD_PENDING_CONTRACT
        axis: listing_status
        trigger: "POST /second-chance-offers/{id}/respond with decision == ACCEPTED"
        actor: Bidder
        preconditions:
          - "listing_status == RELIST_PENDING"
          - "the accepted SecondChanceOffer belongs to a lot of this AssetListing"
        side_effects:
          - "listing_status set to SOLD_PENDING_CONTRACT"
          - "second_chance_eligible set to false"
      - from: PENDING
        to: CLEARED
        axis: title_clearance_status
        trigger: "POST /asset-listings/{id}/title-clearance with clearance_outcome == CLEARED"
        actor: TitleOfficer
        preconditions:
          - "title_clearance_status == PENDING"
        side_effects:
          - "title_condition overwritten with verified_title_condition"
          - "eviction_risk_tier recomputed"
        note: >-
          Runs at any point on axis A — before listing, while LISTED, or after
          SOLD_PENDING_CONTRACT. Post-close clearance is what makes the FINAL buyer_premium
          variant diverge from the PROVISIONAL one.
      - from: PENDING
        to: CLOUDED_DISCLOSED
        axis: title_clearance_status
        trigger: "POST /asset-listings/{id}/title-clearance with clearance_outcome == CLOUDED_DISCLOSED"
        actor: TitleOfficer
        preconditions:
          - "title_clearance_status == PENDING"
        side_effects:
          - "title_condition overwritten with verified_title_condition"
          - "eviction_risk_tier recomputed"
      - from: PENDING
        to: DEFECTIVE
        axis: title_clearance_status
        trigger: "POST /asset-listings/{id}/title-clearance with clearance_outcome == DEFECTIVE"
        actor: TitleOfficer
        preconditions:
          - "title_clearance_status == PENDING"
        side_effects:
          - "title_condition overwritten with verified_title_condition"
          - "eviction_risk_tier recomputed"
          - "no automatic change on axis A; contract execution and relist are both blocked"

  - entity: TrusteeSale
    initial_state: PENDING
    terminal_states: [CANCELLED, HELD]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /trustee-sales/{id}/confirm"
        actor: Trustee
        preconditions:
          - "status IN {PENDING, POSTPONED}"
          - "sale_scheduled_at > logical clock"
        side_effects:
          - "confirmation_reference stored"
      - from: POSTPONED
        to: CONFIRMED
        trigger: "POST /trustee-sales/{id}/confirm"
        actor: Trustee
        preconditions:
          - "status IN {PENDING, POSTPONED}"
          - "sale_scheduled_at > logical clock"
        side_effects:
          - "confirmation_reference stored"
        note: "Re-confirmation after a postponement; the county-sale axis is cyclic."
      - from: CONFIRMED
        to: POSTPONED
        trigger: "POST /trustee-sales/{id}/postpone (link 1 of postponement_cascade)"
        actor: Trustee
        preconditions:
          - "status IN {PENDING, CONFIRMED}"
          - "postponement_count + 1 <= statutory_max_postponements"
          - "new_sale_at > logical clock"
        side_effects:
          - "postponement_count incremented by 1"
          - "sale_scheduled_at set to new_sale_at"
          - >-
            LINK 2 (caused by this row's status change): every AuctionEvent with
            trustee_sale_id == this sale and event_status IN {SCHEDULED, LIVE} transitions to
            POSTPONED
      - from: PENDING
        to: POSTPONED
        trigger: "POST /trustee-sales/{id}/postpone"
        actor: Trustee
        preconditions:
          - "status IN {PENDING, CONFIRMED}"
          - "postponement_count + 1 <= statutory_max_postponements"
        side_effects:
          - "postponement_count incremented by 1; sale_scheduled_at set to new_sale_at"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /trustee-sales/{id}/cancel"
        actor: Trustee
        preconditions:
          - "status IN {PENDING, CONFIRMED, POSTPONED}"
        side_effects:
          - "cancellation_reason stored"
          - >-
            every AuctionEvent with trustee_sale_id == this sale and event_status IN
            {SCHEDULED, LIVE, POSTPONED} transitions to CANCELLED
      - from: CONFIRMED
        to: HELD
        trigger: "POST /auction-lots/{id}/close resulting in CLOSED_SOLD (system bubble-up)"
        actor: system
        preconditions:
          - "status == CONFIRMED"
          - "the closing lot's event has trustee_sale_id == this sale"
        side_effects:
          - "status set to HELD (terminal); the county sale is deemed conducted"

  - entity: AuctionEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, CLOSED]
    note: "Cyclic: SCHEDULED -> LIVE -> POSTPONED -> SCHEDULED -> LIVE."
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /auction-events/{id}/open"
        actor: AuctionOps
        preconditions:
          - "event_status == SCHEDULED"
          - "lot_count >= 1"
          - "trustee_sale_id is null OR TrusteeSale.status == CONFIRMED"
          - "logical clock >= starts_at"
        side_effects:
          - "opened_at set to the logical clock"
          - "every AuctionLot of this event with lot_status IN {PENDING, SUSPENDED} -> OPEN"
      - from: LIVE
        to: POSTPONED
        trigger: "TrusteeSale POSTPONED (link 2 of postponement_cascade)"
        actor: system
        preconditions:
          - "event_status IN {SCHEDULED, LIVE}"
          - "trustee_sale_id == the postponed TrusteeSale.id"
        side_effects:
          - >-
            LINK 3 (caused by this event's status change): every AuctionLot of this event with
            lot_status IN {OPEN, EXTENDED} transitions to SUSPENDED
      - from: SCHEDULED
        to: POSTPONED
        trigger: "TrusteeSale POSTPONED (link 2 of postponement_cascade)"
        actor: system
        preconditions:
          - "event_status IN {SCHEDULED, LIVE}"
        side_effects:
          - "every AuctionLot of this event with lot_status == PENDING stays PENDING"
      - from: POSTPONED
        to: SCHEDULED
        trigger: "POST /auction-events/{id}/reschedule"
        actor: AuctionOps
        preconditions:
          - "event_status == POSTPONED"
          - "new_starts_at > logical clock"
          - "county_slot_overlap passes for the new window, excluding this event itself"
        side_effects:
          - "starts_at / ends_at overwritten with new_starts_at / new_ends_at"
          - "reschedule_count incremented by 1"
          - >-
            every AuctionLot of this event has lot_window_start_at / lot_window_end_at shifted
            by exactly (new_starts_at - old starts_at), and bid_close_at reset to the shifted
            lot_window_end_at with extension_count reset to 0
          - "SUSPENDED lots stay SUSPENDED (they are re-OPENed by the next POST /auction-events/{id}/open, which accepts lot_status IN {PENDING, SUSPENDED}); DepositHolds are left untouched by the reschedule itself"
      - from: LIVE
        to: CLOSED
        trigger: "POST /auction-lots/{id}/close closing the last non-terminal lot (bubble-up)"
        actor: system
        preconditions:
          - "event_status == LIVE"
          - >-
            after the triggering lot close, zero AuctionLots of this event have lot_status IN
            {PENDING, OPEN, EXTENDED, SUSPENDED}
        side_effects:
          - "event_status set to CLOSED (terminal)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "TrusteeSale CANCELLED (cross-entity cascade)"
        actor: system
        preconditions:
          - "event_status IN {SCHEDULED, LIVE, POSTPONED}"
        side_effects:
          - "every AuctionLot of this event with a non-terminal lot_status -> WITHDRAWN"
          - "every Bid on those lots with bid_status IN {ACTIVE, OUTBID} -> WITHDRAWN"
          - >-
            every DepositHold on those lots with status IN {HELD, EXTENDED} -> RELEASED with
            released_reason == EVENT_CANCELLED, then each affected Bidder's
            deposit_available_cents is recomputed
      - from: LIVE
        to: CANCELLED
        trigger: "TrusteeSale CANCELLED (cross-entity cascade)"
        actor: system
        preconditions:
          - "event_status IN {SCHEDULED, LIVE, POSTPONED}"
        side_effects:
          - "same three-hop release chain as the SCHEDULED -> CANCELLED row"
      - from: POSTPONED
        to: CANCELLED
        trigger: "TrusteeSale CANCELLED (cross-entity cascade)"
        actor: system
        preconditions:
          - "event_status IN {SCHEDULED, LIVE, POSTPONED}"
        side_effects:
          - "same three-hop release chain as the SCHEDULED -> CANCELLED row"

  - entity: AuctionLot
    initial_state: PENDING
    terminal_states: [CLOSED_SOLD, CLOSED_NO_SALE, WITHDRAWN]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /auction-events/{id}/open"
        actor: AuctionOps
        preconditions:
          - "lot_status IN {PENDING, SUSPENDED}"
          - "parent AuctionEvent transitions SCHEDULED -> LIVE in the same request"
        side_effects:
          - "no monetary effect; required_deposit_cents already fixed at lot creation"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /auction-events/{id}/open after a reschedule"
        actor: AuctionOps
        preconditions:
          - "lot_status IN {PENDING, SUSPENDED}"
        side_effects:
          - "bidding resumes against the shifted bid_close_at"
      - from: OPEN
        to: EXTENDED
        trigger: "POST /auction-lots/{id}/bids that satisfies calculations.late_bid_extension"
        actor: Bidder
        preconditions:
          - "lot_status IN {OPEN, EXTENDED}"
          - "(bid_close_at - logical clock) <= EXTENSION_TRIGGER_SECONDS"
          - "extension_count < MAX_EXTENSIONS_PER_LOT"
        side_effects:
          - "bid_close_at set to logical clock + EXTENSION_SECONDS"
          - "extension_count incremented by 1"
          - "the triggering Bid.triggered_extension set to true"
      - from: EXTENDED
        to: EXTENDED
        trigger: "a further late bid while extension_count < MAX_EXTENSIONS_PER_LOT"
        actor: Bidder
        preconditions:
          - "extension_count < MAX_EXTENSIONS_PER_LOT"
        side_effects:
          - "bid_close_at pushed again; extension_count incremented"
        note: "Self-loop; once extension_count == MAX_EXTENSIONS_PER_LOT further late bids are accepted without extending."
      - from: OPEN
        to: SUSPENDED
        trigger: "AuctionEvent POSTPONED (link 3 of postponement_cascade)"
        actor: system
        preconditions:
          - "lot_status IN {OPEN, EXTENDED}"
        side_effects:
          - >-
            LINK 4 (caused by this lot's suspension): every DepositHold on this lot with
            status IN {HELD, EXTENDED} has extension_count incremented; if the incremented
            value <= MAX_HOLD_EXTENSIONS the hold becomes EXTENDED with expires_at = logical
            clock + HOLD_EXTENSION_DAYS, otherwise the hold becomes RELEASED with
            released_reason == EXTENSION_LIMIT and that bidder's Bids on this lot with
            bid_status IN {ACTIVE, OUTBID} become WITHDRAWN
          - >-
            LINK 5 (caused by the hold status/amount changes): every affected Bidder's
            deposit_available_cents is recomputed per calculations.deposit_ledger
      - from: EXTENDED
        to: SUSPENDED
        trigger: "AuctionEvent POSTPONED (link 3 of postponement_cascade)"
        actor: system
        preconditions:
          - "lot_status IN {OPEN, EXTENDED}"
        side_effects:
          - "identical link 4 / link 5 chain as the OPEN -> SUSPENDED row"
      - from: OPEN
        to: CLOSED_SOLD
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionOps
        preconditions:
          - "lot_status IN {OPEN, EXTENDED}"
          - "parent AuctionEvent.event_status == LIVE"
          - "logical clock >= bid_close_at"
          - "a Bid exists on this lot with bid_status == ACTIVE and is_above_reserve == true"
        side_effects:
          - "the ACTIVE Bid becomes WINNING; hammer_price_cents set to its amount_cents"
          - "provisional_buyer_premium_cents set per buyer_premium variant PROVISIONAL"
          - "closed_by_user_id set to the acting X-User-ID; closed_at set to the logical clock"
          - "AssetListing.listing_status LISTED -> SOLD_PENDING_CONTRACT"
          - "the linked TrusteeSale (if any) transitions CONFIRMED -> HELD"
          - >-
            every DepositHold on this lot belonging to a bidder other than the winner with
            status IN {HELD, EXTENDED} -> RELEASED with released_reason == NO_SALE is NOT
            applied here; losing holds were already released on outbid, so only the winner's
            hold remains encumbered
          - "parent AuctionEvent auto-CLOSES if no non-terminal lots remain (bubble-up)"
      - from: EXTENDED
        to: CLOSED_SOLD
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionOps
        preconditions:
          - "same as the OPEN -> CLOSED_SOLD row"
        side_effects:
          - "same as the OPEN -> CLOSED_SOLD row"
      - from: OPEN
        to: CLOSED_NO_SALE
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionOps
        preconditions:
          - "lot_status IN {OPEN, EXTENDED}"
          - "parent AuctionEvent.event_status == LIVE"
          - "logical clock >= bid_close_at"
          - "no Bid on this lot has bid_status == ACTIVE and is_above_reserve == true"
        side_effects:
          - "hammer_price_cents stays 0; provisional_buyer_premium_cents stays 0"
          - "any ACTIVE Bid stays ACTIVE (it never became WINNING)"
          - >-
            every DepositHold on this lot with status IN {HELD, EXTENDED} -> RELEASED with
            released_reason == NO_SALE, then each affected Bidder's deposit_available_cents
            is recomputed
          - "AssetListing.listing_status LISTED -> UNSOLD"
          - "parent AuctionEvent auto-CLOSES if no non-terminal lots remain (bubble-up)"
      - from: EXTENDED
        to: CLOSED_NO_SALE
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionOps
        preconditions:
          - "same as the OPEN -> CLOSED_NO_SALE row"
        side_effects:
          - "same as the OPEN -> CLOSED_NO_SALE row"
      - from: OPEN
        to: WITHDRAWN
        trigger: "AuctionEvent CANCELLED"
        actor: system
        preconditions:
          - "lot_status IN {PENDING, OPEN, EXTENDED, SUSPENDED}"
        side_effects:
          - "Bids WITHDRAWN, holds RELEASED (EVENT_CANCELLED), bidder ledgers recomputed"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "AuctionEvent CANCELLED"
        actor: system
        preconditions:
          - "lot_status IN {PENDING, OPEN, EXTENDED, SUSPENDED}"
        side_effects:
          - "Bids WITHDRAWN, holds RELEASED (EVENT_CANCELLED), bidder ledgers recomputed"
      - from: PENDING
        to: WITHDRAWN
        trigger: "AuctionEvent CANCELLED"
        actor: system
        preconditions:
          - "lot_status IN {PENDING, OPEN, EXTENDED, SUSPENDED}"
        side_effects:
          - "no holds exist yet on a PENDING lot; only lot_status changes"

  - entity: Bidder
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, BARRED]
    note: "Cyclic on the registration axis: REGISTERED -> SUSPENDED -> REGISTERED."
    transitions:
      - from: PENDING_REVIEW
        to: REGISTERED
        trigger: "POST /bidders/{id}/identity-verification with decision == VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "identity_verification_status == UNVERIFIED"
        side_effects:
          - "identity_verification_status set to VERIFIED"
          - "identity_verified_at set to the logical clock"
          - "screen_risk_score recomputed (identity penalty drops out)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /bidders/{id}/identity-verification with decision == REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "identity_verification_status == UNVERIFIED"
        side_effects:
          - "identity_verification_status set to REJECTED; registration_status REJECTED (terminal)"
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /eligibility-exclusions with county_code == \"ALL\" and effective_at <= clock"
        actor: ComplianceOfficer
        preconditions:
          - "registration_status == REGISTERED"
          - "the new exclusion has county_code == \"ALL\" and effective_at <= logical clock"
        side_effects:
          - "registration_status set to SUSPENDED"
          - "screen_risk_score recomputed (+EXCLUSION_PENALTY)"
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /eligibility-exclusions/{id}/lift"
        actor: ComplianceOfficer
        preconditions:
          - "registration_status == SUSPENDED"
          - >-
            after this lift, zero EligibilityExclusions for this bidder have status == ACTIVE
            AND county_code == "ALL" AND effective_at <= logical clock
        side_effects:
          - "registration_status set back to REGISTERED"
          - "screen_risk_score recomputed"
      - from: REGISTERED
        to: BARRED
        trigger: "POST /sale-contracts/{id}/fallout raising fallout_count to BARRING_FALLOUT_THRESHOLD"
        actor: system
        preconditions:
          - "registration_status IN {REGISTERED, SUSPENDED}"
          - "fallout_count after increment >= BARRING_FALLOUT_THRESHOLD"
        side_effects:
          - "registration_status set to BARRED (terminal)"
          - >-
            a system EligibilityExclusion is created with exclusion_type == PRIOR_FALLOUT,
            county_code == "ALL", effective_at == the logical clock, status == ACTIVE
          - "screen_risk_score recomputed"
      - from: SUSPENDED
        to: BARRED
        trigger: "POST /sale-contracts/{id}/fallout raising fallout_count to BARRING_FALLOUT_THRESHOLD"
        actor: system
        preconditions:
          - "registration_status IN {REGISTERED, SUSPENDED}"
        side_effects:
          - "same as the REGISTERED -> BARRED row"

  - entity: SaleContract
    initial_state: EXECUTED
    terminal_states: [CLOSED, FALLOUT]
    note: >-
      Branching fork with divergent side-effect sets: EXECUTED -> CLOSED settles with the
      seller, EXECUTED -> FALLOUT forfeits the deposit and reopens the asset. A second
      independent axis (settlement_status) advances DRAFT -> POSTED on the CLOSED branch and
      DRAFT -> VOID on the FALLOUT branch.
    transitions:
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /sale-contracts/{id}/close"
        actor: AuctionOps
        preconditions:
          - "contract_status == EXECUTED"
          - "logical clock <= closing_deadline_at"
        side_effects:
          - "settlement_status DRAFT -> POSTED"
          - "Seller.settled_net_cents incremented by seller_net_cents"
          - >-
            the winning bidder's DepositHold on the lot with status IN {HELD, EXTENDED} ->
            RELEASED with released_reason == CONTRACT_CLOSED, then that Bidder's
            deposit_available_cents is recomputed
          - "AssetListing.listing_status SOLD_PENDING_CONTRACT -> SOLD_CLOSED"
          - "closed_at set to the logical clock"
      - from: EXECUTED
        to: FALLOUT
        trigger: "POST /sale-contracts/{id}/fallout (link 1 of fallout_cascade)"
        actor: AuctionOps
        preconditions:
          - "contract_status == EXECUTED"
        side_effects:
          - "settlement_status DRAFT -> VOID; the SALE numbers are retained unchanged"
          - "fallout_at set to the logical clock; fallout_reason stored"
          - >-
            LINK 2 (caused by this status change): the winning bidder's DepositHold on the lot
            with status IN {HELD, EXTENDED} -> CAPTURED with released_reason == FORFEITED;
            forfeited_deposit_cents set to that hold's amount_cents; the Bidder's
            deposit_forfeited_cents and deposit_available_cents recomputed and fallout_count
            incremented by 1 (which may cascade the Bidder to BARRED plus a PRIOR_FALLOUT
            exclusion)
          - >-
            LINK 3 (caused by the capture): forfeiture_seller_net_cents and
            forfeiture_platform_fee_cents computed per calculations.forfeiture_split over
            forfeited_deposit_cents
          - >-
            LINK 4 (caused by the forfeiture posting): AssetListing.listing_status
            SOLD_PENDING_CONTRACT -> RELIST_PENDING and second_chance_eligible recomputed

  - entity: SecondChanceOffer
    initial_state: OUTSTANDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OUTSTANDING
        to: ACCEPTED
        trigger: "POST /second-chance-offers/{id}/respond with decision == ACCEPTED"
        actor: Bidder
        preconditions:
          - "status == OUTSTANDING"
          - "logical clock <= expires_at"
          - "acting X-User-ID == offered_bidder_id"
          - "Bidder.registration_status == REGISTERED"
          - "Bidder.deposit_available_cents >= AuctionLot.required_deposit_cents"
        side_effects:
          - "responded_at set to the logical clock"
          - >-
            a new DepositHold is created for the accepting bidder on the lot with status HELD
            and amount_cents == AuctionLot.required_deposit_cents, then that Bidder's
            deposit_available_cents is recomputed
          - "the accepting bidder's Bid on the lot becomes WINNING and the previous WINNING Bid becomes OUTBID"
          - "AuctionLot.hammer_price_cents set to offer_price_cents and provisional_buyer_premium_cents recomputed"
          - "AssetListing.listing_status RELIST_PENDING -> SOLD_PENDING_CONTRACT"
      - from: OUTSTANDING
        to: DECLINED
        trigger: "POST /second-chance-offers/{id}/respond with decision == DECLINED"
        actor: Bidder
        preconditions:
          - "status == OUTSTANDING"
          - "logical clock <= expires_at"
          - "acting X-User-ID == offered_bidder_id"
        side_effects:
          - "responded_at set to the logical clock; the listing stays RELIST_PENDING"
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "POST /second-chance-offers/{id}/respond after expires_at (lazy expiry)"
        actor: Bidder
        preconditions:
          - "status == OUTSTANDING"
          - "logical clock > expires_at"
        side_effects:
          - "status set to EXPIRED before the request is rejected with ERR_OFFER_EXPIRED"
          - "responded_at stays null"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: lot-add-stale-event
    parent_entity: AuctionEvent
    write_endpoint: "POST /auction-events/{id}/lots"
    occ_field: "expected_auction_event_version"
    description: |
      Adding an AuctionLot to an AuctionEvent whose version has advanced since the client last
      read it is rejected. A second lot add is legitimate on its own terms (an event holds many
      lots), so the roster the client believes it is extending may already contain a lot whose
      window or asset changes the outcome; the stale expected_auction_event_version is what the
      server rejects.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: reserve-price-stale-lot
    parent_entity: AuctionLot
    write_endpoint: "PATCH /auction-lots/{id}/reserve-price"
    occ_field: "expected_auction_lot_version"
    description: |
      Rewriting an AuctionLot's reserve_price_cents from a stale view of the lot is rejected.
      Re-setting a reserve is legitimate on its own terms — the new value supersedes the prior
      one — so the only defence against a writer that has not observed the current reserve (or
      the current high bid) is the version check.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eviction_risk_tier
    trigger: >-
      on POST /asset-listings/{id}/disclosures and on POST /asset-listings/{id}/title-clearance
      (both list AssetListing.eviction_risk_tier in their side_effects)
    algorithm: threshold
    formula: |
      # Evaluated top-down; the FIRST matching clause wins (precedence is pinned).
      if occupancy_status == TENANT_OCCUPIED or title_condition in {CLOUDED, UNKNOWN}:
          eviction_risk_tier = HIGH
      elif occupancy_status == OWNER_OCCUPIED or title_condition == JUNIOR_LIENS:
          eviction_risk_tier = MEDIUM
      else:                      # occupancy_status in {VACANT, UNKNOWN} and title_condition == CLEAR
          eviction_risk_tier = LOW
      # Note: occupancy_status == UNKNOWN alone does not force HIGH; only the title axis does.
    input_set: "the single AssetListing row being mutated; no other entity is read"
    constants: {}
    precision: "enumerated value, no rounding"

  - name: required_deposit
    trigger: "on POST /auction-events/{id}/lots (fixes AuctionLot.required_deposit_cents once)"
    algorithm: threshold
    formula: |
      base = max(DEPOSIT_FLOOR_CENTS, round_half_up(opening_bid_cents * DEPOSIT_PCT))
      mult = OCCUPANCY_DEPOSIT_MULT[AssetListing.occupancy_status]   # read at lot-creation time
      required_deposit_cents = round_half_up(base * mult)
    input_set: >-
      opening_bid_cents from the request body and AssetListing.occupancy_status as of the lot
      creation request; later disclosure or clearance changes do NOT retro-adjust the lot
    constants:
      DEPOSIT_PCT: 0.05
      DEPOSIT_FLOOR_CENTS: 500000
      OCCUPANCY_DEPOSIT_MULT:
        OWNER_OCCUPIED: 1.50
        TENANT_OCCUPIED: 1.25
        UNKNOWN: 1.50
        VACANT: 1.00
    precision: "integer cents, round_half_up applied once after each multiplication"

  - name: deposit_ledger
    trigger: >-
      on every mutation that creates, extends, releases or captures a DepositHold, and on
      POST /bidders/{id}/deposits (all list Bidder.deposit_available_cents in their side_effects)
    algorithm: aggregation
    formula: |
      held_total       = sum(DepositHold.amount_cents
                             where bidder_id == B.id and status IN {HELD, EXTENDED})
      forfeited_total  = sum(DepositHold.amount_cents
                             where bidder_id == B.id and status == CAPTURED)
      B.deposit_forfeited_cents = forfeited_total
      B.deposit_available_cents = B.deposit_funded_cents - held_total - forfeited_total
      # CONSERVED QUANTITY (deposit pool):
      #   deposit_available_cents + held_total + forfeited_total == deposit_funded_cents
      # RELEASED holds contribute to none of the three terms.
    input_set: >-
      all DepositHold rows of bidder B regardless of lot or event, filtered by the explicit
      status sets above; no time window (the whole history participates)
    constants: {}
    precision: "integer cents, exact — no rounding anywhere in this aggregation"

  - name: hold_extension_policy
    trigger: >-
      on the AuctionLot OPEN|EXTENDED -> SUSPENDED transition (link 4 of postponement_cascade)
      and on POST /auction-lots/{id}/sale-contract for the winning hold
    algorithm: threshold
    formula: |
      # SUSPENSION PATH (postponement cascade):
      hold.extension_count = hold.extension_count + 1
      if hold.extension_count <= MAX_HOLD_EXTENSIONS:
          hold.status     = EXTENDED
          hold.expires_at = logical_clock + HOLD_EXTENSION_DAYS days
      else:
          hold.status          = RELEASED
          hold.released_reason = EXTENSION_LIMIT
          # and that bidder's Bids on the lot in {ACTIVE, OUTBID} become WITHDRAWN
      # CONTRACT PATH (execution): the winning hold becomes EXTENDED with
      # expires_at = SaleContract.closing_deadline_at and extension_count is NOT incremented,
      # because the closing window — not the postponement policy — sets that expiry.
    input_set: "the DepositHold rows of the affected lot with status IN {HELD, EXTENDED}"
    constants:
      MAX_HOLD_EXTENSIONS: 2
      HOLD_EXTENSION_DAYS: 30
    precision: "integer counter; expires_at stored to the millisecond"

  - name: late_bid_extension
    trigger: "on POST /auction-lots/{id}/bids, after all validations pass and before the Bid row is written"
    algorithm: threshold
    formula: |
      remaining_seconds = (AuctionLot.bid_close_at - logical_clock) total seconds, may be fractional
      if remaining_seconds <= EXTENSION_TRIGGER_SECONDS and extension_count < MAX_EXTENSIONS_PER_LOT:
          bid_close_at   = logical_clock + EXTENSION_SECONDS
          extension_count = extension_count + 1
          lot_status      = EXTENDED
          bid.triggered_extension = true
      else:
          bid_close_at unchanged; bid.triggered_extension = false
      # BOUNDARY: remaining_seconds == 60 extends (<=); remaining_seconds == 61 does not.
      # A bid arriving with remaining_seconds <= 0 never reaches here — it is rejected earlier
      # by validation priority 44 (ERR_BID_WINDOW_CLOSED).
    input_set: "the single AuctionLot row and the logical clock"
    constants:
      EXTENSION_TRIGGER_SECONDS: 60
      EXTENSION_SECONDS: 120
      MAX_EXTENSIONS_PER_LOT: 3
    precision: "whole seconds; bid_close_at stored with three fractional digits"

  - name: buyer_premium
    trigger: >-
      variant PROVISIONAL on POST /auction-lots/{id}/close (side effect
      AuctionLot.provisional_buyer_premium_cents); variant FINAL on
      POST /auction-lots/{id}/sale-contract (side effect SaleContract.final_buyer_premium_cents);
      both variants are also projected read-only by GET /auction-lots/{id}/settlement-preview
    algorithm: tiered_pricing
    formula: |
      # Three inputs interact non-linearly: a price-keyed tier rate, an occupancy surcharge and
      # a title surcharge, all clamped by a floor and a cap.
      def tier_rate(price_cents):
          if price_cents < PREMIUM_TIER_1_CEILING_CENTS:        return 0.10
          elif price_cents < PREMIUM_TIER_2_CEILING_CENTS:      return 0.08
          else:                                                 return 0.06
      rate = tier_rate(price_cents) \
             + OCCUPANCY_SURCHARGE_BPS[occupancy_status] / 10000 \
             + TITLE_SURCHARGE_BPS[title_condition] / 10000
      raw     = round_half_up(price_cents * rate)                # single rounding, after summing rates
      premium = max(MIN_PREMIUM_CENTS, min(MAX_PREMIUM_CENTS, raw))
    input_set: >-
      exactly one AuctionLot and its AssetListing; which price and which disclosure snapshot are
      read is what distinguishes the two variants below
    constants:
      PREMIUM_TIER_1_CEILING_CENTS: 10000000
      PREMIUM_TIER_2_CEILING_CENTS: 50000000
      OCCUPANCY_SURCHARGE_BPS:
        OWNER_OCCUPIED: 150
        TENANT_OCCUPIED: 100
        VACANT: 0
        UNKNOWN: 200
      TITLE_SURCHARGE_BPS:
        CLEAR: 0
        JUNIOR_LIENS: 75
        CLOUDED: 175
        UNKNOWN: 250
      MIN_PREMIUM_CENTS: 250000
      MAX_PREMIUM_CENTS: 6000000
    precision: "integer cents, round_half_up, applied exactly once to price_cents * rate"
    variants:
      - name: PROVISIONAL
        when: "at lot close, written to AuctionLot.provisional_buyer_premium_cents"
        difference: >-
          price_cents = AuctionLot.hammer_price_cents (no postponement carry), and
          occupancy_status / title_condition are read as they stand at the close request —
          typically with title_clearance_status still PENDING, i.e. the seller's own disclosure
      - name: FINAL
        when: "at contract execution, written to SaleContract.final_buyer_premium_cents"
        difference: >-
          price_cents = SaleContract.contract_price_cents (hammer plus postponement carry), and
          title_condition is re-read after the TitleOfficer has overwritten it with
          verified_title_condition, so the title surcharge bps may differ from the PROVISIONAL run

  - name: contract_price
    trigger: "on POST /auction-lots/{id}/sale-contract (side effect SaleContract.contract_price_cents)"
    algorithm: threshold
    formula: |
      if AuctionEvent.trustee_sale_id is null:
          postponement_count = 0
      else:
          postponement_count = TrusteeSale.postponement_count   # as of the execution request
      postponement_carry_cents = round_half_up(
          hammer_price_cents * POSTPONE_CARRY_BPS * postponement_count / 10000)
      contract_price_cents = hammer_price_cents + postponement_carry_cents
    input_set: >-
      the CLOSED_SOLD AuctionLot, its AuctionEvent, and that event's TrusteeSale if
      trustee_sale_id is non-null; postponements recorded after execution never reprice
    constants:
      POSTPONE_CARRY_BPS: 25
    precision: "integer cents, round_half_up applied once to the whole carry expression"

  - name: doc_fee_and_total_due
    trigger: >-
      on POST /auction-lots/{id}/sale-contract (side effects SaleContract.doc_fee_cents and
      SaleContract.total_due_cents)
    algorithm: constraint_propagation
    formula: |
      # doc_fee depends on a discount tier keyed on the total, and the total depends on doc_fee.
      # The cycle is broken by pinning a THREE-STEP evaluation order; no fixed-point iteration
      # is performed and the tier is NEVER re-keyed on the step-3 result.
      step1: provisional_total_cents = contract_price_cents + final_buyer_premium_cents \
                                       + BASE_DOC_FEE_CENTS
      step2: if   provisional_total_cents >= DOC_FEE_TIER_2_FLOOR_CENTS: discount = 0.40
             elif provisional_total_cents >= DOC_FEE_TIER_1_FLOOR_CENTS: discount = 0.25
             else:                                                       discount = 0.00
             doc_fee_cents = round_half_up(BASE_DOC_FEE_CENTS * (1 - discount))
      step3: total_due_cents = contract_price_cents + final_buyer_premium_cents + doc_fee_cents
      # Consequence to preserve: total_due_cents may fall BELOW the tier floor that granted the
      # discount. That is correct — the tier is keyed on provisional_total_cents only.
    input_set: "the SaleContract row under construction; contract_price and buyer_premium FINAL must already be resolved"
    constants:
      BASE_DOC_FEE_CENTS: 95000
      DOC_FEE_TIER_1_FLOOR_CENTS: 25000000
      DOC_FEE_TIER_2_FLOOR_CENTS: 50000000
    precision: "integer cents, round_half_up applied once in step 2"

  - name: settlement_split
    trigger: >-
      on POST /auction-lots/{id}/sale-contract (side effects SaleContract.seller_net_cents,
      platform_fee_cents, buyer_premium_cents, settlement_gross_cents)
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: each component is rounded to whole cents FIRST and the
      # rounded components are THEN summed. Summing the basis points and rounding once
      # (round_half_up(contract_price * (commission_bps + MARKETING_RECOVERY_BPS)/10000)) is a
      # DIFFERENT, incorrect result and may differ by one cent.
      c1 = round_half_up(contract_price_cents * Seller.default_commission_bps / 10000)
      c2 = round_half_up(contract_price_cents * MARKETING_RECOVERY_BPS / 10000)
      c3 = TITLE_SERVICE_FEE_CENTS if AssetListing.title_condition != CLEAR else 0
      platform_fee_cents      = c1 + c2 + c3
      seller_net_cents        = contract_price_cents - platform_fee_cents
      buyer_premium_cents     = final_buyer_premium_cents
      settlement_gross_cents  = contract_price_cents + final_buyer_premium_cents
      # CONSERVED QUANTITY (settlement gross):
      #   seller_net_cents + platform_fee_cents + buyer_premium_cents == settlement_gross_cents
      # This identity must still hold after the FALLOUT compensation voids the settlement.
    input_set: >-
      the SaleContract under construction, the Seller reached via
      AuctionLot.asset_listing_id -> AssetListing.seller_id, and that AssetListing's
      title_condition as of the execution request
    constants:
      MARKETING_RECOVERY_BPS: 35
      TITLE_SERVICE_FEE_CENTS: 45000
    precision: "integer cents, round_half_up per component, then exact integer addition"

  - name: forfeiture_split
    trigger: >-
      on POST /sale-contracts/{id}/fallout (side effects forfeiture_seller_net_cents and
      forfeiture_platform_fee_cents)
    algorithm: waterfall_allocation
    formula: |
      forfeited_deposit_cents       = the CAPTURED DepositHold.amount_cents
      forfeiture_seller_net_cents   = round_half_up(forfeited_deposit_cents * FORFEIT_SELLER_BPS / 10000)
      forfeiture_platform_fee_cents = forfeited_deposit_cents - forfeiture_seller_net_cents
      # CONSERVED QUANTITY: the rounding remainder is assigned to the platform bucket, so
      #   forfeiture_seller_net_cents + forfeiture_platform_fee_cents == forfeited_deposit_cents
      # holds exactly, for every input, with no drift.
    input_set: "the single CAPTURED DepositHold of the falling-out contract's winning bidder"
    constants:
      FORFEIT_SELLER_BPS: 6000
    precision: "integer cents, round_half_up on the seller bucket; platform bucket takes the remainder"

  - name: bidder_risk_score
    trigger: >-
      variant SCREEN on GET /bidders/{id}/eligibility-assessment with mode == SCREEN and on
      every mutation listing Bidder.screen_risk_score in its side_effects; variant AUDIT on
      GET /bidders/{id}/eligibility-assessment with mode == AUDIT
    algorithm: weighted_scoring
    formula: |
      score = 0
      if identity_penalty_applies:  score += IDENTITY_PENALTY
      score += EXCLUSION_PENALTY * counted_exclusion_count
      score += FALLOUT_PENALTY   * Bidder.fallout_count
      if deposit_penalty_applies:   score += DEPOSIT_PENALTY
      risk_score = min(RISK_SCORE_CAP, score)
      eligible   = risk_score < ELIGIBILITY_MAX_SCORE      # 39 -> eligible, 40 -> NOT eligible
      # deposit_penalty_applies is false whenever no auction_lot_id is supplied; otherwise it is
      #   Bidder.deposit_available_cents < AuctionLot.required_deposit_cents
    input_set: >-
      the Bidder row, its EligibilityExclusion rows, and (only when auction_lot_id is supplied)
      that AuctionLot plus its AuctionEvent; which exclusions are counted and how identity is
      judged is what distinguishes the two variants
    constants:
      IDENTITY_PENALTY: 25
      EXCLUSION_PENALTY: 20
      FALLOUT_PENALTY: 15
      DEPOSIT_PENALTY: 10
      RISK_SCORE_CAP: 100
      ELIGIBILITY_MAX_SCORE: 40
      BARRING_FALLOUT_THRESHOLD: 2
    precision: "integer score, no rounding; cap applied after summing"
    variants:
      - name: SCREEN
        when: >-
          forward-looking gate used at registration and refreshed into
          Bidder.screen_risk_score; the default mode of the assessment endpoint
        difference: >-
          identity_penalty_applies = (identity_verification_status != VERIFIED) evaluated on the
          CURRENT row; counted_exclusion_count = count of EligibilityExclusion with
          status == ACTIVE and (county_code == "ALL" or, when auction_lot_id is supplied,
          county_code == the lot's AuctionEvent.county_code) — future-dated exclusions
          (effective_at > logical clock) ARE counted because SCREEN is forward-looking. When
          Bidder.screen_risk_score is refreshed by a mutation there is no lot context, so only
          county_code == "ALL" exclusions are counted and DEPOSIT_PENALTY is never applied.
      - name: AUDIT
        when: >-
          chronological post-auction reconstruction; requires auction_lot_id and uses that
          lot's AuctionEvent.starts_at as the reference instant `ref`
        difference: >-
          identity_penalty_applies = (identity_verified_at is null OR identity_verified_at > ref);
          counted_exclusion_count = count of EligibilityExclusion with effective_at <= ref AND
          (status == ACTIVE OR (status == LIFTED AND lifted_at > ref)) AND scope matching
          "ALL" or the event's county_code — future-dated exclusions are EXCLUDED and
          since-lifted exclusions are RESURRECTED. DEPOSIT_PENALTY uses the bidder's CURRENT
          deposit_available_cents (the audit does not reconstruct the ledger).

  - name: winning_bid_selector
    trigger: "on POST /auction-lots/{id}/close"
    algorithm: chronological
    formula: |
      candidates = Bids where auction_lot_id == lot.id
                     and bid_status == ACTIVE
                     and is_above_reserve == true
      # At most one Bid per lot is ACTIVE by construction (each accepted bid demotes the prior
      # ACTIVE bid to OUTBID), so the ranking below can only ever choose between 0 or 1 rows.
      rank  = amount_cents DESC
      tie_break_1 = Bid.created_at ASC          # earliest accepted bid wins a tie
      tie_break_2 = Bid.placed_at ASC
      if candidates is empty: lot closes CLOSED_NO_SALE (no error; NO_SALE is a valid outcome)
      else:                   the top-ranked Bid becomes WINNING and fixes hammer_price_cents
    input_set: "Bids of the closing lot filtered by the explicit status/reserve predicate above"
    constants: {}
    precision: "integer cents, exact"

  - name: backup_bidder_selector
    trigger: >-
      on POST /sale-contracts/{id}/fallout (to recompute AssetListing.second_chance_eligible)
      and on POST /auction-lots/{id}/second-chance-offers (to pick offered_bidder_id and
      offer_price_cents)
    algorithm: chronological
    formula: |
      candidates = Bids where auction_lot_id == lot.id
                     and bid_status == OUTBID
                     and amount_cents >= AuctionLot.reserve_price_cents
                     and Bidder(bid.bidder_id).registration_status == REGISTERED
                     and Bidder(bid.bidder_id).identity_verification_status == VERIFIED
      rank        = amount_cents DESC
      tie_break_1 = Bid.created_at ASC
      tie_break_2 = Bidder.created_at ASC
      empty_pool  -> AssetListing.second_chance_eligible = false, and any
                     POST /auction-lots/{id}/second-chance-offers is rejected with
                     ERR_NO_BACKUP_BIDDER (409)
      non_empty   -> AssetListing.second_chance_eligible = true; the offer takes
                     offered_bidder_id = top.bidder_id and offer_price_cents = top.amount_cents
      # At most one Bid per (lot, bidder) can be OUTBID with the highest amount for that bidder;
      # when one bidder holds several OUTBID bids on the lot only that bidder's highest one can
      # ever rank first, so no bidder can be offered twice.
    input_set: >-
      OUTBID Bids of the fallen-out lot only; WITHDRAWN and WINNING bids are excluded, and bids
      strictly below reserve_price_cents are excluded
    constants: {}
    precision: "integer cents, exact"

  - name: county_slot_overlap
    trigger: >-
      on POST /auction-events and on POST /auction-events/{id}/reschedule (validation priority 47)
    algorithm: interval_merge
    formula: |
      # CLOSED interval, symmetric buffer, adjacency-hostile.
      buffer = COUNTY_BUFFER_MINUTES minutes
      others = AuctionEvents where county_code == candidate.county_code
                 and id != candidate.id
                 and event_status IN {SCHEDULED, LIVE, POSTPONED}
      conflict(other) := candidate.starts_at <= other.ends_at   + buffer
                     AND other.starts_at     <= candidate.ends_at + buffer
      # Both comparisons are INCLUSIVE: a candidate starting exactly at
      # other.ends_at + 30min CONFLICTS. Clearance therefore requires a strict gap of more
      # than COUNTY_BUFFER_MINUTES on whichever side is adjacent.
      if any conflict -> ERR_COUNTY_SLOT_CONFLICT (409)
    input_set: >-
      AuctionEvents of the same county_code with event_status IN {SCHEDULED, LIVE, POSTPONED};
      CANCELLED and CLOSED events never conflict
    constants:
      COUNTY_BUFFER_MINUTES: 30
    precision: "instants compared to the millisecond"

  - name: lot_window_overlap
    trigger: >-
      on POST /auction-events/{id}/lots and on POST /auction-events/{id}/reschedule for each
      shifted lot (validation priority 48)
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval [start, end), no buffer, adjacency-friendly — deliberately different
      # interval arithmetic from county_slot_overlap.
      others = AuctionLots where asset_listing_id == candidate.asset_listing_id
                 and id != candidate.id
                 and lot_status IN {PENDING, OPEN, EXTENDED, SUSPENDED}
      conflict(other) := candidate.lot_window_start_at <  other.lot_window_end_at
                     AND other.lot_window_start_at     <  candidate.lot_window_end_at
      # Both comparisons are STRICT: a candidate starting exactly at other.lot_window_end_at
      # does NOT conflict, so back-to-back windows for the same asset across two events are
      # legal. Terminal lots (CLOSED_SOLD / CLOSED_NO_SALE / WITHDRAWN) never conflict.
      if any conflict -> ERR_LOT_WINDOW_CONFLICT (409)
    input_set: >-
      AuctionLots of the same asset_listing_id across ALL events, filtered to non-terminal
      lot_status values
    constants: {}
    precision: "instants compared to the millisecond"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
# Band map:  1-2 auth · 3-12 existence · 13 ownership · 14-16 request shape ·
#            17-31 state · 32-33 OCC · 34-37 compliance/safety ·
#            38-43 referential · 44-53 temporal · 54-55 constraint · 56 fiscal
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present, and X-User-Role is a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "seller_id in path or body resolves to a Seller"
    error_id: ERR_SELLER_NOT_FOUND
    http_status: 404
    applies_to: "GET /sellers/{id}, GET /sellers/{id}/asset-listings, POST /asset-listings"
  - priority: 4
    category: existence
    check: "asset_listing_id in path or body resolves to an AssetListing"
    error_id: ERR_ASSET_LISTING_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /asset-listings/{id}, GET /asset-listings/{id}/trustee-sales,
      POST /asset-listings/{id}/disclosures, POST /asset-listings/{id}/title-clearance,
      POST /asset-listings/{id}/relist, POST /trustee-sales, POST /auction-events/{id}/lots
  - priority: 5
    category: existence
    check: "trustee_sale_id in path or body resolves to a TrusteeSale"
    error_id: ERR_TRUSTEE_SALE_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /trustee-sales/{id}, GET /trustee-sales/{id}/auction-events,
      POST /trustee-sales/{id}/confirm, POST /trustee-sales/{id}/postpone,
      POST /trustee-sales/{id}/cancel, POST /auction-events
  - priority: 6
    category: existence
    check: "auction event id in path resolves to an AuctionEvent"
    error_id: ERR_AUCTION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /auction-events/{id}, POST /auction-events/{id}/lots,
      POST /auction-events/{id}/open, POST /auction-events/{id}/reschedule
  - priority: 7
    category: existence
    check: "auction lot id in path resolves to an AuctionLot"
    error_id: ERR_AUCTION_LOT_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /auction-lots/{id}, GET /auction-lots/{id}/sale-contracts,
      GET /auction-lots/{id}/settlement-preview, PATCH /auction-lots/{id}/reserve-price,
      POST /auction-lots/{id}/bids, POST /auction-lots/{id}/close,
      POST /auction-lots/{id}/sale-contract, POST /auction-lots/{id}/second-chance-offers
  - priority: 8
    category: existence
    check: "bidder id in path or body resolves to a Bidder"
    error_id: ERR_BIDDER_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /bidders/{id}, GET /bidders/{id}/eligibility-exclusions,
      GET /bidders/{id}/eligibility-assessment, POST /bidders/{id}/identity-verification,
      POST /bidders/{id}/deposits, POST /eligibility-exclusions
  - priority: 9
    category: existence
    check: "exclusion id in path resolves to an EligibilityExclusion"
    error_id: ERR_EXCLUSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /eligibility-exclusions/{id}/lift"
  - priority: 10
    category: existence
    check: "sale contract id in path resolves to a SaleContract"
    error_id: ERR_SALE_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: >-
      GET /sale-contracts/{id}, POST /sale-contracts/{id}/close,
      POST /sale-contracts/{id}/fallout
  - priority: 11
    category: existence
    check: "offer id in path resolves to a SecondChanceOffer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /second-chance-offers/{id}, POST /second-chance-offers/{id}/respond"
  - priority: 12
    category: existence
    check: "bid id in path resolves to a Bid"
    error_id: ERR_BID_NOT_FOUND
    http_status: 404
    applies_to: "GET /bids/{id}"
  - priority: 13
    category: auth
    check: >-
      for entity_backed roles the acting X-User-ID owns the target: Seller acting on an
      AssetListing must equal AssetListing.seller_id (and the body's seller_id on create);
      Bidder acting on /bidders/{id}/deposits must equal that path id; Bidder acting on
      POST /auction-lots/{id}/bids must equal the body's bidder_id; Bidder responding to an
      offer must equal SecondChanceOffer.offered_bidder_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: >-
      POST /asset-listings, POST /asset-listings/{id}/disclosures,
      POST /asset-listings/{id}/relist, POST /bidders/{id}/deposits,
      POST /auction-lots/{id}/bids, POST /second-chance-offers/{id}/respond,
      GET /bidders/{id}/eligibility-assessment
  - priority: 14
    category: business_constraint
    check: >-
      request body conforms to the endpoint's input schema: required fields present, enum values
      members of the declared set, integers within declared ranges, amount_cents > 0,
      datetimes valid ISO 8601 UTC, ends_at > starts_at, limit within 1..100, offset >= 0
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 15
    category: business_constraint
    check: "lot_number is not already used by another AuctionLot of the same auction_event_id"
    error_id: ERR_DUPLICATE_LOT_NUMBER
    http_status: 409
    applies_to: "POST /auction-events/{id}/lots"
  - priority: 16
    category: business_constraint
    check: "mode == AUDIT requires auction_lot_id to be supplied (the audit needs a reference instant)"
    error_id: ERR_AUDIT_MODE_REQUIRES_LOT
    http_status: 422
    applies_to: "GET /bidders/{id}/eligibility-assessment"
  - priority: 17
    category: state
    check: "AssetListing.listing_status == INTAKE"
    error_id: ERR_LISTING_NOT_IN_INTAKE
    http_status: 409
    applies_to: "POST /asset-listings/{id}/disclosures"
  - priority: 18
    category: state
    check: "AssetListing.title_clearance_status == PENDING"
    error_id: ERR_TITLE_CLEARANCE_ALREADY_SET
    http_status: 409
    applies_to: "POST /asset-listings/{id}/title-clearance"
  - priority: 19
    category: state
    check: "AssetListing.listing_status IN {RELIST_PENDING, UNSOLD}"
    error_id: ERR_LISTING_NOT_RELISTABLE
    http_status: 409
    applies_to: "POST /asset-listings/{id}/relist"
  - priority: 20
    category: state
    check: >-
      AssetListing.listing_status IN {DISCLOSURE_READY, LISTED} when the listing is being added
      to an event as a lot
    error_id: ERR_LISTING_NOT_LISTABLE
    http_status: 409
    applies_to: "POST /auction-events/{id}/lots"
  - priority: 21
    category: state
    check: >-
      TrusteeSale.status IN {PENDING, POSTPONED} for /confirm; IN {PENDING, CONFIRMED} for
      /postpone; IN {PENDING, CONFIRMED, POSTPONED} for /cancel
    error_id: ERR_TRUSTEE_SALE_NOT_ACTIONABLE
    http_status: 409
    applies_to: >-
      POST /trustee-sales/{id}/confirm, POST /trustee-sales/{id}/postpone,
      POST /trustee-sales/{id}/cancel
  - priority: 22
    category: state
    check: "AuctionEvent.event_status == SCHEDULED"
    error_id: ERR_EVENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /auction-events/{id}/open, POST /auction-events/{id}/lots"
  - priority: 23
    category: state
    check: "AuctionEvent.event_status == POSTPONED"
    error_id: ERR_EVENT_NOT_POSTPONED
    http_status: 409
    applies_to: "POST /auction-events/{id}/reschedule"
  - priority: 24
    category: state
    check: "the lot's parent AuctionEvent.event_status == LIVE"
    error_id: ERR_EVENT_NOT_LIVE
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids, POST /auction-lots/{id}/close"
  - priority: 25
    category: state
    check: "AuctionEvent.lot_count >= 1"
    error_id: ERR_EVENT_HAS_NO_LOTS
    http_status: 409
    applies_to: "POST /auction-events/{id}/open"
  - priority: 26
    category: state
    check: "AuctionLot.lot_status IN {OPEN, EXTENDED}"
    error_id: ERR_LOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids, POST /auction-lots/{id}/close"
  - priority: 27
    category: state
    check: "AuctionLot.lot_status == CLOSED_SOLD"
    error_id: ERR_LOT_NOT_CLOSED_SOLD
    http_status: 409
    applies_to: "POST /auction-lots/{id}/sale-contract, POST /auction-lots/{id}/second-chance-offers"
  - priority: 28
    category: state
    check: "AuctionLot.current_high_bid_cents == 0 (a reserve may not be moved once a bid stands)"
    error_id: ERR_LOT_HAS_BIDS
    http_status: 409
    applies_to: "PATCH /auction-lots/{id}/reserve-price"
  - priority: 29
    category: state
    check: >-
      Bidder.identity_verification_status == UNVERIFIED for /identity-verification;
      Bidder.registration_status != SUSPENDED for bidding and for accepting an offer.
      This clause deliberately does NOT demand == REGISTERED: a PENDING_REVIEW or REJECTED
      bidder is caught one band later by priority 34 (ERR_IDENTITY_UNVERIFIED) and a BARRED
      bidder by priority 35 (ERR_BIDDER_BARRED), so all three errors stay reachable
    error_id: ERR_BIDDER_NOT_REGISTERED
    http_status: 409
    applies_to: >-
      POST /bidders/{id}/identity-verification, POST /auction-lots/{id}/bids,
      POST /second-chance-offers/{id}/respond
  - priority: 30
    category: state
    check: "SaleContract.contract_status == EXECUTED"
    error_id: ERR_CONTRACT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /sale-contracts/{id}/close, POST /sale-contracts/{id}/fallout"
  - priority: 31
    category: state
    check: "SecondChanceOffer.status == OUTSTANDING"
    error_id: ERR_OFFER_NOT_OUTSTANDING
    http_status: 409
    applies_to: "POST /second-chance-offers/{id}/respond"
  - priority: 32
    category: state
    check: "expected_auction_event_version equals the AuctionEvent's current version"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /auction-events/{id}/lots"
  - priority: 33
    category: state
    check: "expected_auction_lot_version equals the AuctionLot's current version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "PATCH /auction-lots/{id}/reserve-price"
  - priority: 34
    category: business_safety
    check: "Bidder.identity_verification_status == VERIFIED"
    error_id: ERR_IDENTITY_UNVERIFIED
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids, POST /second-chance-offers/{id}/respond"
  - priority: 35
    category: business_safety
    check: "Bidder.registration_status != BARRED"
    error_id: ERR_BIDDER_BARRED
    http_status: 403
    applies_to: "POST /auction-lots/{id}/bids, POST /bidders/{id}/deposits"
  - priority: 36
    category: business_safety
    check: >-
      no EligibilityExclusion of the bidder has status == ACTIVE and effective_at <= logical
      clock and (county_code == "ALL" or county_code == the lot's AuctionEvent.county_code)
    error_id: ERR_BIDDER_EXCLUDED
    http_status: 403
    applies_to: "POST /auction-lots/{id}/bids, POST /second-chance-offers/{id}/respond"
  - priority: 37
    category: business_safety
    check: "acting X-User-ID != AuctionLot.closed_by_user_id (four-eyes on contract execution)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /auction-lots/{id}/sale-contract"
  - priority: 38
    category: business_referential
    check: "body county_code equals the referenced AssetListing.county_code"
    error_id: ERR_COUNTY_MISMATCH
    http_status: 422
    applies_to: "POST /trustee-sales"
  - priority: 39
    category: business_referential
    check: "AuctionEvent.trustee_sale_id is null OR the linked TrusteeSale.status == CONFIRMED"
    error_id: ERR_TRUSTEE_SALE_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /auction-events/{id}/open"
  - priority: 40
    category: business_referential
    check: "the lot's AssetListing.title_clearance_status IN {CLEARED, CLOUDED_DISCLOSED}"
    error_id: ERR_TITLE_CLEARANCE_PENDING
    http_status: 409
    applies_to: "POST /auction-lots/{id}/sale-contract"
  - priority: 41
    category: business_referential
    check: "the AssetListing.title_clearance_status != DEFECTIVE"
    error_id: ERR_TITLE_DEFECTIVE
    http_status: 409
    applies_to: >-
      POST /auction-events/{id}/lots, POST /asset-listings/{id}/relist,
      POST /auction-lots/{id}/sale-contract
  - priority: 42
    category: business_referential
    check: "calculations.backup_bidder_selector yields a non-empty candidate set"
    error_id: ERR_NO_BACKUP_BIDDER
    http_status: 409
    applies_to: "POST /auction-lots/{id}/second-chance-offers"
  - priority: 43
    category: business_referential
    check: "no SecondChanceOffer for this lot already has status == OUTSTANDING"
    error_id: ERR_DUPLICATE_ACTIVE_OFFER
    http_status: 409
    applies_to: "POST /auction-lots/{id}/second-chance-offers"
  - priority: 44
    category: business_temporal
    check: "logical clock < AuctionLot.bid_close_at"
    error_id: ERR_BID_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 45
    category: business_temporal
    check: "logical clock >= AuctionLot.bid_close_at"
    error_id: ERR_LOT_WINDOW_STILL_OPEN
    http_status: 409
    applies_to: "POST /auction-lots/{id}/close"
  - priority: 46
    category: business_temporal
    check: "logical clock >= AuctionEvent.starts_at"
    error_id: ERR_EVENT_NOT_STARTED
    http_status: 409
    applies_to: "POST /auction-events/{id}/open"
  - priority: 47
    category: business_temporal
    check: "calculations.county_slot_overlap finds no conflicting AuctionEvent"
    error_id: ERR_COUNTY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /auction-events, POST /auction-events/{id}/reschedule"
  - priority: 48
    category: business_temporal
    check: "calculations.lot_window_overlap finds no conflicting AuctionLot for the same asset"
    error_id: ERR_LOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /auction-events/{id}/lots, POST /auction-events/{id}/reschedule"
  - priority: 49
    category: business_temporal
    check: >-
      lot_window_start_at >= AuctionEvent.starts_at and lot_window_end_at <= AuctionEvent.ends_at
    error_id: ERR_LOT_WINDOW_OUTSIDE_EVENT
    http_status: 422
    applies_to: "POST /auction-events/{id}/lots"
  - priority: 50
    category: business_temporal
    check: "sale_scheduled_at (create) / new_sale_at (postpone) is strictly after the logical clock"
    error_id: ERR_SALE_DATE_NOT_FUTURE
    http_status: 422
    applies_to: "POST /trustee-sales, POST /trustee-sales/{id}/postpone, POST /trustee-sales/{id}/confirm"
  - priority: 51
    category: business_temporal
    check: "postponement_count + 1 <= statutory_max_postponements"
    error_id: ERR_POSTPONEMENT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /trustee-sales/{id}/postpone"
  - priority: 52
    category: business_temporal
    check: "logical clock <= SaleContract.closing_deadline_at"
    error_id: ERR_CLOSING_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /sale-contracts/{id}/close"
  - priority: 53
    category: business_temporal
    check: >-
      logical clock <= SecondChanceOffer.expires_at; when it is not, the offer is first
      transitioned to EXPIRED and then the request is rejected
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /second-chance-offers/{id}/respond"
  - priority: 54
    category: business_constraint
    check: >-
      amount_cents >= opening_bid_cents when current_high_bid_cents == 0, otherwise
      amount_cents >= current_high_bid_cents + min_increment_cents
    error_id: ERR_BID_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /auction-lots/{id}/bids"
  - priority: 55
    category: business_constraint
    check: "reserve_price_cents >= opening_bid_cents"
    error_id: ERR_RESERVE_BELOW_OPENING
    http_status: 422
    applies_to: "POST /auction-events/{id}/lots, PATCH /auction-lots/{id}/reserve-price"
  - priority: 56
    category: business_fiscal
    check: >-
      Bidder.deposit_available_cents >= AuctionLot.required_deposit_cents, skipped when the
      bidder already holds a DepositHold on this lot with status IN {HELD, EXTENDED}
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /auction-lots/{id}/bids, POST /second-chance-offers/{id}/respond"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --------------------------------------------------------------- seller intake
  - method: POST
    path: "/sellers"
    description: "Onboard a servicer, bank, GSE or private seller as a settlement counterparty."
    roles: [PlatformAdmin]
    code: 201
    input: [org_name, seller_type, contact_email, settlement_account_ref, "default_commission_bps?"]
    output: Seller
    side_effects:
      - "default_commission_bps defaults to 500 when omitted"
      - "settled_net_cents initialised to 0"
  - method: POST
    path: "/asset-listings"
    description: "Seller submits an asset for auction intake. Starts in listing_status=INTAKE, title_clearance_status=PENDING."
    roles: [Seller]
    code: 201
    input: [seller_id, street_address, city, county_code, state_code, estimated_value_cents]
    output: AssetListing
    side_effects:
      - "listing_status set to INTAKE; title_clearance_status set to PENDING"
      - "occupancy_status and title_condition default to UNKNOWN"
      - "eviction_risk_tier computed by calculations.eviction_risk_tier (UNKNOWN/UNKNOWN -> HIGH)"
      - "relist_count set to 0; second_chance_eligible set to false"
  - method: POST
    path: "/asset-listings/{id}/disclosures"
    description: "Seller files the occupancy status and title condition disclosures required before the asset can be listed."
    roles: [Seller]
    code: 200
    input: [occupancy_status, title_condition]
    output: AssetListing
    side_effects:
      - "listing_status INTAKE -> DISCLOSURE_READY"
      - "disclosure_ack_at set to the logical clock"
      - "eviction_risk_tier recomputed by calculations.eviction_risk_tier"
      - "increments AssetListing.version by 1"
  - method: POST
    path: "/asset-listings/{id}/title-clearance"
    description: "Title officer records the outcome of the title search; drives the AssetListing title axis."
    roles: [TitleOfficer]
    code: 200
    input: [clearance_outcome, verified_title_condition, title_report_reference]
    output: AssetListing
    side_effects:
      - "title_clearance_status PENDING -> CLEARED | CLOUDED_DISCLOSED | DEFECTIVE per clearance_outcome"
      - "title_condition overwritten with verified_title_condition"
      - "eviction_risk_tier recomputed by calculations.eviction_risk_tier"
      - "any non-terminal AuctionLot of this asset has provisional_buyer_premium_cents recomputed (PROVISIONAL variant)"
      - "increments AssetListing.version by 1"
  - method: POST
    path: "/asset-listings/{id}/relist"
    description: "Seller returns an UNSOLD or RELIST_PENDING asset to the listable pool; the title axis is re-opened for a fresh search."
    roles: [Seller]
    code: 200
    input: []
    output: AssetListing
    side_effects:
      - "listing_status UNSOLD | RELIST_PENDING -> DISCLOSURE_READY"
      - "title_clearance_status reset to PENDING"
      - "relist_count incremented by 1"
      - "second_chance_eligible reset to false"
      - "increments AssetListing.version by 1"
  # ------------------------------------------------------------- trustee sale leg
  - method: POST
    path: "/trustee-sales"
    description: "Trustee records the statutory county sale for an asset."
    roles: [Trustee]
    code: 201
    input: [asset_listing_id, county_code, sale_scheduled_at, "statutory_max_postponements?"]
    output: TrusteeSale
    side_effects:
      - "status set to PENDING; postponement_count set to 0"
      - "statutory_max_postponements defaults to 3 when omitted"
  - method: POST
    path: "/trustee-sales/{id}/confirm"
    description: "Trustee confirms the sale will proceed on the scheduled date."
    roles: [Trustee]
    code: 200
    input: [confirmation_reference]
    output: TrusteeSale
    side_effects:
      - "status PENDING | POSTPONED -> CONFIRMED"
      - "confirmation_reference stored"
  - method: POST
    path: "/trustee-sales/{id}/postpone"
    description: "Trustee postpones the county sale to a new date; cascades to every linked auction event and its lots."
    roles: [Trustee]
    code: 200
    input: [new_sale_at, postponement_reason]
    output: TrusteeSale
    side_effects:
      - "status PENDING | CONFIRMED -> POSTPONED; sale_scheduled_at replaced by new_sale_at"
      - "postponement_count incremented by 1"
      - "LINK 2: every linked AuctionEvent in SCHEDULED | LIVE -> POSTPONED"
      - "LINK 3: every AuctionLot of those events in OPEN | EXTENDED -> SUSPENDED (PENDING lots stay PENDING)"
      - "LINK 4: every DepositHold on those lots in HELD | EXTENDED is re-aged by calculations.hold_extension_policy — EXTENDED with expires_at = logical clock + 30 days while within MAX_HOLD_EXTENSIONS, otherwise RELEASED with released_reason=EXTENSION_LIMIT and that bidder's ACTIVE | OUTBID Bids on the lot -> WITHDRAWN"
      - "LINK 5: deposit_available_cents recomputed for every affected Bidder (calculations.deposit_ledger)"
      - "AssetListing.listing_status is deliberately NOT changed — a postponement is not a failed auction, the asset stays LISTED"
  - method: POST
    path: "/trustee-sales/{id}/cancel"
    description: "Trustee cancels the county sale outright; same cascade as postponement but terminal for the events."
    roles: [Trustee]
    code: 200
    input: [cancellation_reason]
    output: TrusteeSale
    side_effects:
      - "status PENDING | CONFIRMED | POSTPONED -> CANCELLED"
      - "every linked AuctionEvent in SCHEDULED | LIVE | POSTPONED -> CANCELLED"
      - "every non-terminal AuctionLot of those events -> WITHDRAWN"
      - "every DepositHold on those lots in HELD | EXTENDED -> RELEASED with released_reason=EVENT_CANCELLED"
      - "deposit_available_cents recomputed for every affected Bidder"
      - "every AssetListing of those lots in LISTED -> UNSOLD (the asset may then be relisted)"
  # --------------------------------------------------------------- auction events
  - method: POST
    path: "/auction-events"
    description: "Auction ops schedules an auction event in a county, optionally bound to a trustee sale."
    roles: [AuctionOps]
    code: 201
    input: [title, county_code, starts_at, ends_at, "trustee_sale_id?"]
    output: AuctionEvent
    side_effects:
      - "event_status set to SCHEDULED; reschedule_count set to 0; lot_count set to 0"
      - "calculations.county_slot_overlap evaluated against existing events in the county"
  - method: POST
    path: "/auction-events/{id}/lots"
    description: "Adds an asset to a scheduled event as a lot. Optimistically concurrent on the parent event version."
    roles: [AuctionOps]
    code: 201
    input:
      - asset_listing_id
      - lot_number
      - lot_window_start_at
      - lot_window_end_at
      - opening_bid_cents
      - reserve_price_cents
      - expected_auction_event_version
      - "min_increment_cents?"
    output: AuctionLot
    side_effects:
      - "lot_status set to PENDING; extension_count set to 0; current_high_bid_cents set to 0"
      - "min_increment_cents defaults to 500000 when omitted"
      - "required_deposit_cents computed by calculations.required_deposit"
      - "bid_close_at initialised to lot_window_end_at"
      - "AssetListing.listing_status DISCLOSURE_READY -> LISTED"
      - "AuctionEvent.lot_count recomputed"
      - "increments AuctionEvent.version by 1"
  - method: PATCH
    path: "/auction-lots/{id}/reserve-price"
    description: "Revises the reserve price on a bid-free lot. Optimistically concurrent on the lot version."
    roles: [AuctionOps]
    code: 200
    input: [reserve_price_cents, expected_auction_lot_version]
    output: AuctionLot
    side_effects:
      - "reserve_price_cents replaced"
      - "increments AuctionLot.version by 1"
  - method: POST
    path: "/auction-events/{id}/open"
    description: "Takes a scheduled event live and opens every pending lot for bidding."
    roles: [AuctionOps]
    code: 200
    input: []
    output: AuctionEvent
    side_effects:
      - "event_status SCHEDULED -> LIVE; opened_at set to the logical clock"
      - "every AuctionLot of the event in PENDING | SUSPENDED -> OPEN"
  - method: POST
    path: "/auction-events/{id}/reschedule"
    description: "Moves a postponed event to a new window and returns it to SCHEDULED, re-checking county and lot-window conflicts."
    roles: [AuctionOps]
    code: 200
    input: [new_starts_at, new_ends_at]
    output: AuctionEvent
    side_effects:
      - "event_status POSTPONED -> SCHEDULED; starts_at/ends_at replaced; reschedule_count incremented by 1"
      - "every SUSPENDED AuctionLot of the event has lot_window_start_at/lot_window_end_at and bid_close_at shifted by the same offset, extension_count reset to 0, and lot_status set to PENDING"
      - "calculations.county_slot_overlap and calculations.lot_window_overlap re-evaluated"
  # --------------------------------------------------------- bidders & compliance
  - method: POST
    path: "/bidders"
    description: "Self-service bidder registration. Starts UNVERIFIED / PENDING_REVIEW."
    roles: [Anonymous]
    code: 201
    input: [legal_name, email, mailing_address]
    output: Bidder
    side_effects:
      - "identity_verification_status set to UNVERIFIED; registration_status set to PENDING_REVIEW"
      - "deposit_funded_cents / deposit_forfeited_cents set to 0; fallout_count set to 0"
      - "screen_risk_score computed by calculations.bidder_risk_score (SCREEN variant)"
  - method: POST
    path: "/bidders/{id}/identity-verification"
    description: "Compliance officer records the KYC decision for a bidder."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, document_reference]
    output: Bidder
    side_effects:
      - "identity_verification_status UNVERIFIED -> VERIFIED | REJECTED per decision"
      - "on VERIFIED: identity_verified_at set to the logical clock and registration_status PENDING_REVIEW -> REGISTERED"
      - "on REJECTED: registration_status PENDING_REVIEW -> REJECTED"
      - "screen_risk_score recomputed by calculations.bidder_risk_score (SCREEN variant)"
      - "increments Bidder.version by 1"
  - method: POST
    path: "/bidders/{id}/deposits"
    description: "Bidder funds the deposit wallet used to back deposit holds."
    roles: [Bidder]
    code: 200
    input: [amount_cents, funding_reference]
    output: Bidder
    side_effects:
      - "deposit_funded_cents increased by amount_cents"
      - "deposit_available_cents recomputed by calculations.deposit_ledger"
      - "screen_risk_score recomputed by calculations.bidder_risk_score (SCREEN variant)"
      - "increments Bidder.version by 1"
  - method: POST
    path: "/eligibility-exclusions"
    description: "Compliance officer records an eligibility exclusion (sanctions, affiliate, state ineligibility, prior fallout)."
    roles: [ComplianceOfficer]
    code: 201
    input: [bidder_id, exclusion_type, effective_at, "county_code?", "notes?"]
    output: EligibilityExclusion
    side_effects:
      - "status set to ACTIVE; county_code defaults to \"ALL\" when omitted"
      - "Bidder.registration_status REGISTERED -> SUSPENDED"
      - "Bidder.screen_risk_score recomputed by calculations.bidder_risk_score (SCREEN variant)"
  - method: POST
    path: "/eligibility-exclusions/{id}/lift"
    description: "Compliance officer lifts an exclusion; the bidder is reinstated when no ACTIVE exclusion remains."
    roles: [ComplianceOfficer]
    code: 200
    input: ["notes?"]
    output: EligibilityExclusion
    side_effects:
      - "status ACTIVE -> LIFTED; lifted_at set to the logical clock"
      - "Bidder.registration_status SUSPENDED -> REGISTERED when no ACTIVE exclusion remains and registration_status is not BARRED"
      - "Bidder.screen_risk_score recomputed by calculations.bidder_risk_score (SCREEN variant)"
  # ------------------------------------------------------------------ live bidding
  - method: POST
    path: "/auction-lots/{id}/bids"
    description: "Places a bid on an open lot; may extend the lot under the late-bid rule and rolls the deposit hold."
    roles: [Bidder]
    code: 201
    input: [bidder_id, amount_cents]
    output: Bid
    side_effects:
      - "previous WINNING Bid on the lot -> OUTBID; its DepositHold -> RELEASED with released_reason=OUTBID"
      - "new Bid created with bid_status=WINNING and placed_at = logical clock"
      - "is_above_reserve set to (amount_cents >= reserve_price_cents)"
      - "a DepositHold of required_deposit_cents created with status=HELD unless the bidder already holds one on this lot"
      - "deposit_available_cents recomputed for both bidders by calculations.deposit_ledger"
      - "AuctionLot.current_high_bid_cents set to amount_cents"
      - "calculations.late_bid_extension may set lot_status OPEN -> EXTENDED, push bid_close_at, increment extension_count and set Bid.triggered_extension"
      - "increments AuctionLot.version by 1"
  - method: POST
    path: "/auction-lots/{id}/close"
    description: "Auction ops hammers the lot down after its bid window has elapsed."
    roles: [AuctionOps]
    code: 200
    input: []
    output: AuctionLot
    side_effects:
      - "calculations.winning_bid_selector picks the winner; on a reserve-clearing winner lot_status -> CLOSED_SOLD, otherwise -> CLOSED_NO_SALE"
      - "hammer_price_cents and provisional_buyer_premium_cents set (calculations.buyer_premium, PROVISIONAL variant) on CLOSED_SOLD"
      - "closed_by_user_id set to the acting X-User-ID; closed_at set to the logical clock"
      - "on CLOSED_SOLD: AssetListing.listing_status LISTED -> SOLD_PENDING_CONTRACT and second_chance_eligible set from the backup pool"
      - "on CLOSED_NO_SALE: AssetListing.listing_status LISTED -> UNSOLD and every DepositHold on the lot RELEASED with released_reason=NO_SALE"
      - "AuctionEvent auto-transitions LIVE -> CLOSED when no non-terminal lot remains; a CONFIRMED TrusteeSale then -> HELD"
      - "deposit_available_cents recomputed for every affected Bidder"
      - "increments AuctionLot.version by 1"
  # ------------------------------------------------- contract, settlement, fallout
  - method: POST
    path: "/auction-lots/{id}/sale-contract"
    description: "Executes the purchase contract for a hammered lot and posts the settlement to the seller. Must be performed by a different operator than the one who closed the lot."
    roles: [AuctionOps]
    code: 201
    input: ["closing_window_days?"]
    output: SaleContract
    side_effects:
      - "closing_window_days defaults to 21 when omitted"
      - "contract_price_cents computed by calculations.contract_price (postponement carry applied)"
      - "final_buyer_premium_cents computed by calculations.buyer_premium (FINAL variant)"
      - "doc_fee_cents and total_due_cents computed by calculations.doc_fee_and_total_due"
      - "closing_deadline_at = closed_at + closing_window_days days; contract_status set to EXECUTED"
      - "execution_at and executed_by_user_id recorded"
      - "settlement_status set to POSTED with settlement_gross_cents / seller_net_cents / platform_fee_cents / buyer_premium_cents from calculations.settlement_split"
      - "Seller.settled_net_cents increased by seller_net_cents"
      - "winning DepositHold -> EXTENDED with expires_at = closing_deadline_at"
  - method: POST
    path: "/sale-contracts/{id}/close"
    description: "Records escrow closing within the closing window."
    roles: [AuctionOps]
    code: 200
    input: [closing_reference]
    output: SaleContract
    side_effects:
      - "contract_status EXECUTED -> CLOSED; closed_at set to the logical clock"
      - "DepositHold on the lot -> RELEASED with released_reason=CONTRACT_CLOSED"
      - "AssetListing.listing_status SOLD_PENDING_CONTRACT -> SOLD_CLOSED"
      - "winning Bidder deposit_available_cents recomputed"
  - method: POST
    path: "/sale-contracts/{id}/fallout"
    description: "Records post-auction fallout: the buyer's deposit is forfeited, the settlement is voided and the asset is queued for relisting."
    roles: [AuctionOps]
    code: 200
    input: [fallout_reason]
    output: SaleContract
    side_effects:
      - "contract_status EXECUTED -> FALLOUT; fallout_at set to the logical clock"
      - "settlement_status POSTED -> VOID; Seller.settled_net_cents reduced by seller_net_cents"
      - "LINK 2: DepositHold on the lot -> CAPTURED with released_reason=FORFEITED"
      - "LINK 3: forfeited_deposit_cents, forfeiture_seller_net_cents and forfeiture_platform_fee_cents set from calculations.forfeiture_split; Seller.settled_net_cents increased by forfeiture_seller_net_cents"
      - "LINK 4: Bidder.deposit_forfeited_cents increased and deposit_available_cents recomputed; fallout_count incremented; registration_status -> BARRED with an auto-created PRIOR_FALLOUT EligibilityExclusion once fallout_count >= 2"
      - "AssetListing.listing_status SOLD_PENDING_CONTRACT -> RELIST_PENDING"
      - "AuctionLot.hammer_price_cents retained for the second-chance offer price"
  - method: POST
    path: "/auction-lots/{id}/second-chance-offers"
    description: "Offers the lot to the highest reserve-clearing backup bidder after fallout or a declined contract."
    roles: [AuctionOps]
    code: 201
    input: ["expires_at?"]
    output: SecondChanceOffer
    side_effects:
      - "offered_bidder_id set by calculations.backup_bidder_selector"
      - "offer_price_cents set to the backup bidder's own highest ACTIVE/OUTBID bid amount"
      - "status set to OUTSTANDING; expires_at defaults to the logical clock + 3 days when omitted"
  - method: POST
    path: "/second-chance-offers/{id}/respond"
    description: "Backup bidder accepts or declines the second-chance offer."
    roles: [Bidder]
    code: 200
    input: [decision]
    output: SecondChanceOffer
    side_effects:
      - "status OUTSTANDING -> ACCEPTED | DECLINED per decision; responded_at set to the logical clock"
      - "on ACCEPTED: the Bid of the offered bidder -> WINNING, AuctionLot.hammer_price_cents set to offer_price_cents, provisional_buyer_premium_cents recomputed, a DepositHold of required_deposit_cents created with status=HELD and deposit_available_cents recomputed"
      - "on ACCEPTED: AssetListing.listing_status RELIST_PENDING -> SOLD_PENDING_CONTRACT so the lot can be re-contracted"
      - "on DECLINED: AssetListing.second_chance_eligible set to false"
      - "a stale OUTSTANDING offer is first transitioned to EXPIRED when the logical clock is past expires_at"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical UTC clock, which every deadline, window, expiry and *_at field reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock replaced; no entity is mutated and no lazy transition is fired by this call alone"
  # ------------------------------------------------------------------------ reads
  - method: GET
    path: "/sellers/{id}"
    description: "Fetch a seller with its running settled_net_cents."
    roles: [PlatformAdmin, AuctionOps, Seller]
    code: 200
