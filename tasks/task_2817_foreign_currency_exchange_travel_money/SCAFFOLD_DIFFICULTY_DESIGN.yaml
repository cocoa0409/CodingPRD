  - rule_id: non_linear_state_machine
    instances:
      - name: exchange_transaction_parallel_axes_settle_while_compliance_flagged
        grounds:
          - state_machines.ExchangeTransaction
          - entities.ExchangeTransaction.fields.settlement_status
          - entities.ExchangeTransaction.fields.compliance_status
          - endpoints."POST /exchange-transactions/{id}/compliance-decision"
          - endpoints."POST /exchange-transactions/{id}/settle"
        distinguishing_aspect: |
          ExchangeTransaction is the parallel-axis machine: settlement_status and
          compliance_status advance on two independent dimensions, so a FLAG on
          the compliance axis leaves the settlement axis free to move
          AUTHORIZED -> SETTLED, and the combined state (SETTLED, FLAGGED) is
          reachable and stable. A linear reading would either block the settle or
          reset compliance_status to PASSED.
        test_recipe:
          setup:
            - "BR-LHR with a 20,000,000-cent vault limit, EUR at sell_rate_micros 878600, one PUBLISHED rate card."
            - "EUR position of 10x2000 + 10x5000 + 20x10000 notes (270000 minor units)."
            - "One customer; a quote for 1x10000 + 1x5000 + 2x2000 (gross 21626 cents) is AUTHORIZED."
            - "A compliance officer then FLAGs the transaction on the compliance axis."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { branch_id: "${br_id}", currency_code: "EUR", wholesale_rate_id: "${wr_id}", buy_spread_bps: 550, sell_spread_bps: 450, board_display_label: "EUR Euro", disclosure_text_version: 3, effective_from: "2026-07-01T00:00:00Z", expected_branch_version: "${br_v0}" }
              as: TreasuryOfficer
              captures: { card_id: "$.data.id" }
            - call: "POST /rate-cards/${card_id}/publish"
              payload: {}
              as: TreasuryOfficer
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 2000, note_count: 10 }, { denomination_minor_units: 5000, note_count: 10 }, { denomination_minor_units: 10000, note_count: 20 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Dara Okafor", nationality_code: "NG", home_branch_id: "${br_id}" }
              as: BranchTeller
              captures: { cust_id: "$.data.id" }
            - call: "POST /exchange-transactions"
              payload: { branch_id: "${br_id}", customer_id: "${cust_id}", rate_card_id: "${card_id}", currency_code: "EUR", direction: "SELL_FX_TO_CUSTOMER", requested_denominations: [{ denomination_minor_units: 10000, note_count: 1 }, { denomination_minor_units: 5000, note_count: 1 }, { denomination_minor_units: 2000, note_count: 2 }] }
              as: BranchTeller
              captures: { txn_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions/${txn_id}/compliance-decision"
              payload: { decision: "FLAG", decision_note: "unusual denomination request" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /exchange-transactions/${txn_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
          assert:
            - "ExchangeTransaction.${txn_id}.settlement_status == SETTLED"
            - "ExchangeTransaction.${txn_id}.compliance_status == FLAGGED (the settle did not touch the compliance axis)"
            - "ExchangeTransaction.${txn_id}.settled_usd_gross_cents == 21626"
            - "ExchangeTransaction.${txn_id}.settled_at is the current logical clock value"
            - "InventoryPosition.${pos_id}.total_minor_units == 251000"
            - "a second POST /exchange-transactions/${txn_id}/compliance-decision with decision CLEAR moves compliance_status to CLEARED while settlement_status stays SETTLED"

      - name: inventory_plan_reject_resubmit_cycle_increments_revision_count
        grounds:
          - state_machines.InventoryPlan
          - entities.InventoryPlan.fields.revision_count
          - entities.InventoryPlan.fields.status
          - endpoints."POST /inventory-plans/{id}/review"
        distinguishing_aspect: |
          InventoryPlan is the cyclic machine on a different entity: SUBMITTED
          -> DRAFT on a REJECT decision is a backward edge, the only one in the
          scaffold, and traversing it bumps revision_count from 0 to 1 while
          clearing reviewed_by_user_id, after which the same plan can be
          re-submitted and APPROVED. The transition set is therefore not a DAG,
          unlike the parallel-axis ExchangeTransaction machine.
        test_recipe:
          setup:
            - "BR-LHR with a 5,000,000-cent vault limit; EUR (MAJOR) with a 920000-micro wholesale mid."
            - "One SUMMER corridor LHR-CMN 2026-06-01 to 2026-09-01, demand_index_bps 13500."
            - "A DRAFT plan with season_days 92 submitted by u-mgr-1 with a single EUR target line of 2000 baseline daily minor units."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 5000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /travel-corridors"
              payload: { code: "LHR-CMN-SUMMER", origin_country_code: "GB", destination_country_code: "MA", destination_currency_code: "EUR", season: "SUMMER", season_start_date: "2026-06-01", season_end_date: "2026-09-01", demand_index_bps: 13500 }
              as: TreasuryOfficer
              captures: { corr_id: "$.data.id" }
            - call: "POST /inventory-plans"
              payload: { branch_id: "${br_id}", travel_corridor_id: "${corr_id}", season_days: 92, target_lines: [{ currency_code: "EUR", baseline_daily_minor_units: 2000 }] }
              as: BranchManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /inventory-plans/${plan_id}/submit"
              payload: {}
              as: BranchManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /inventory-plans/${plan_id}/review"
              payload: { decision: "REJECT", review_note: "trim the EUR line" }
              as: TreasuryOfficer
              as_user_id: "u-treas-1"
            - call: "POST /inventory-plans/${plan_id}/submit"
              payload: { target_lines: [{ currency_code: "EUR", baseline_daily_minor_units: 2000 }] }
              as: BranchManager
              as_user_id: "u-mgr-1"
            - call: "POST /inventory-plans/${plan_id}/review"
              payload: { decision: "APPROVE" }
              as: TreasuryOfficer
              as_user_id: "u-treas-1"
          assert:
            - "after the REJECT: InventoryPlan.${plan_id}.status == DRAFT and revision_count == 1 and reviewed_by_user_id == null"
            - "after the second submit: InventoryPlan.${plan_id}.status == SUBMITTED and revision_count == 1 (re-submission does not bump it)"
            - "after the APPROVE: InventoryPlan.${plan_id}.status == APPROVED and revision_count == 1"
            - "InventoryPlan.${plan_id}.submitted_by_user_id == u-mgr-1 and reviewed_by_user_id == u-treas-1"
            - "InventoryPlan.${plan_id}.computed_targets[0].target_minor_units == 250000"

  - rule_id: transitive_cascade
    instances:
      - name: shipment_arrival_five_hop_cascade_to_auto_repatriation_manifest
        grounds:
          - state_machines.CashShipment.IN_TRANSIT_to_DELIVERED
          - calculations.position_usd_equivalent
          - calculations.branch_vault_utilization_and_posture
          - calculations.repatriation_surplus_manifest
          - entities.Branch.fields.vault_utilization_bps
          - entities.Branch.fields.posture
          - entities.Branch.fields.repatriation_pending
          - entities.CashShipment.fields.auto_generated
        distinguishing_aspect: |
          Depth-5 cascade fired by POST /cash-shipments/{id}/arrive:
          (1) the delivered notes are folded into InventoryPosition.denomination_mix,
          (2) total_minor_units and usd_equivalent_cents are recomputed,
          (3) the owning Branch's vault_usd_equivalent_cents and
          vault_utilization_bps are recomputed to 9239 bps,
          (4) posture crosses VAULT_RESTRICTED_MIN_BPS and flips OPEN -> RESTRICTED,
          (5) the RESTRICTED posture raises an auto_generated REPATRIATION
          CashShipment whose manifest is computed by the surplus waterfall and sets
          repatriation_pending. Nothing about the arriving shipment's own fields
          predicts hop 5.
        test_recipe:
          setup:
            - "BR-CDG in region SOUTH with a deliberately tight vault_limit_usd_cents of 400000."
            - "EUR profile with denominations 500/1000/2000/5000/10000 and a wholesale mid of 920000 micros effective 2026-07-01."
            - "An armored route RT-SOUTH-1 in region SOUTH with daily_capacity_usd_cents 200000."
            - "An EUR position opened with 30 x 10000 notes: 300000 minor units, 326087 USD cents, 8152 bps, posture OPEN."
            - "A REPLENISHMENT shipment of 4 x 10000 notes (40000 minor units, 43478 USD cents) SCHEDULED on RT-SOUTH-1 for 2026-08-05T09:00Z-10:00Z, then DISPATCHED with the clock at 2026-08-05T09:00Z."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-CDG", name: "Paris CDG", region_code: "SOUTH", vault_limit_usd_cents: 400000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v0: "$.data.version" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_id: "$.data.id" }
            - call: "POST /armored-routes"
              payload: { code: "RT-SOUTH-1", carrier_name: "SecurCash", region_code: "SOUTH", daily_capacity_usd_cents: 200000 }
              as: PlatformAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /inventory-positions"
              payload: { branch_id: "${br_id}", currency_code: "EUR", opening_denomination_mix: [{ denomination_minor_units: 10000, note_count: 30 }] }
              as: BranchManager
              captures: { pos_id: "$.data.id" }
            - call: "GET /branches/${br_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { bps_before: "$.data.vault_utilization_bps", posture_before: "$.data.posture" }
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: TreasuryOfficer
              captures: { ship_id: "$.data.id" }
            - call: "POST /cash-shipments/${ship_id}/schedule"
              payload: { armored_route_id: "${route_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T10:00:00Z" }
              as: TreasuryOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cash-shipments/${ship_id}/dispatch"
              payload: {}
              as: TreasuryOfficer
          trigger:
            - call: "POST /cash-shipments/${ship_id}/arrive"
              payload: { delivered_denominations: [{ denomination_minor_units: 10000, note_count: 4 }] }
              as: BranchManager
            - call: "GET /cash-shipments"
              payload: { branch_id: "${br_id}", auto_generated: true }
              as: TreasuryOfficer
              captures: { rep_ship_id: "$.data[0].id" }
          assert:
            - "hop 0: CashShipment.${ship_id}.status == DELIVERED and variance_minor_units == 0 and manifest_usd_equivalent_cents == 43478"
            - "hop 1: InventoryPosition.${pos_id}.denomination_mix entry for 10000 has available_note_count == 34"
            - "hop 2: InventoryPosition.${pos_id}.total_minor_units == 340000 and usd_equivalent_cents == 369565"
            - "hop 3: Branch.${br_id}.vault_usd_equivalent_cents == 369565 and vault_utilization_bps == 9239 (${bps_before} was 8152)"
            - "hop 4: Branch.${br_id}.posture == RESTRICTED (${posture_before} was OPEN)"
            - "hop 5: CashShipment.${rep_ship_id}.direction == REPATRIATION and status == REQUESTED and auto_generated == true"
            - "hop 5: CashShipment.${rep_ship_id}.manifest_denominations == [{ denomination_minor_units: 10000, note_count: 2 }] and manifest_minor_units == 20000 and manifest_usd_equivalent_cents == 21739"
            - "hop 5: Branch.${br_id}.repatriation_pending == true"

      - name: settlement_four_hop_cascade_to_structuring_report_and_customer_hold
        grounds:
          - state_machines.ExchangeTransaction.AUTHORIZED_to_SETTLED
          - calculations.customer_structuring_aggregates
          - calculations.customer_structuring_risk_score
          - state_machines.Customer.ELEVATED_to_HIGH
          - entities.ComplianceReport.fields.report_type
          - entities.Customer.fields.compliance_hold_active
        distinguishing_aspect: |
          Depth-4 cascade fired by a different transition, POST
          /exchange-transactions/{id}/settle, and running through the compliance
          entities rather than the cash entities:
          (1) the settlement updates the customer's rolling aggregates to 1821078
