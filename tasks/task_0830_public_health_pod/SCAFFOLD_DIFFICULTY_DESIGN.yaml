              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-05T08:00:00Z", end_time: "2026-03-05T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa1_id: $.data.id }
            - call: "POST /shift-assignments/${sa1_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-05T12:00:00Z", end_time: "2026-03-05T20:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa2_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${sa2_id}/confirm"
              payload: {}
