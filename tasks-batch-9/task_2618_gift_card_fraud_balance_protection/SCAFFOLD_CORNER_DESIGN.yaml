              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /draining-alerts"
              payload: { card_id: "${card_id}", detection_basis: "MANUAL_REVIEW", note: "shopper reported a suspicious rack" }
              as: FraudAnalyst
              as_user_id: "analyst-49"
              captures: { alert_id: $.data.id }
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "no draining pattern found", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-49"
              captures: { st_triaged: $.data.state }
            - call: "POST /draining-alerts/${alert_id}/resolve"
              payload: { resolution: "DISMISS", resolution_note: "single legitimate purchase" }
