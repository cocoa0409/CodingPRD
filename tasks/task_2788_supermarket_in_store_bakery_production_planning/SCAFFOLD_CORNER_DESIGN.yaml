      - name: ingredient_order_line_naming_another_departments_ingredient_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_43
          - errors.ERR_INGREDIENT_NOT_IN_DEPARTMENT
          - endpoints.POST_/bakery/ingredient-orders
        distinguishing_aspect: "The ingredient exists and resolves, so this is not a NOT_FOUND: the cross-entity check compares Ingredient.department_id against the order's department_id and returns ERR_INGREDIENT_NOT_IN_DEPARTMENT (422); the rejected write also leaves the department's version untouched, so the same expected_department_version still works on the retry."
        test_recipe:
          setup:
            - "Two departments; store 0041 owns Bread Flour, store 0088 owns Baker Sugar."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
