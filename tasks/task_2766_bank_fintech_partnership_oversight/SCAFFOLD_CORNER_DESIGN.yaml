            - "e_wd_elapse == ERR_WIND_DOWN_NOTICE_NOT_ELAPSED at a clock of 2026-08-01, even though the UNFUNDED batch also violates priority 44 — 69 is checked first"
            - "e_wd_batches == ERR_UNSETTLED_BATCHES_OUTSTANDING (409) once the clock reaches 2026-09-16, which is past created_at + notice_days == 2026-08-31 — MATCHED is not enough, funding_status must have left UNFUNDED"
            - "the plan is still APPROVED after both execute refusals and the partner is still WIND_DOWN"

      - name: the_logical_clock_boundaries_are_inclusive_for_stamps_and_effective_dates_and_for_cycle_elapse
        claim_type: Violation to Error
        grounds:
          - validations.priority_66
          - validations.priority_67
          - validations.priority_68
          - errors.ERR_TIMESTAMP_IN_FUTURE
          - errors.ERR_EFFECTIVE_DATE_IN_PAST
          - errors.ERR_CYCLE_PERIOD_NOT_ELAPSED
        distinguishing_aspect: "All three rules compare against the injected logical clock rather than wall time, and all three are inclusive at the boundary in the direction that permits the operation: received_at exactly equal to the clock is accepted, effective_date exactly equal to the clock is accepted, and a cycle whose period_end exactly equals the clock may be closed. One second either way flips each of them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A is a PROSPECT and gets an agreement only in the last probe. Cycle 2026-08 covers [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:01Z", narrative: "One second in the future relative to the logical clock.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_ts_future: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Exactly at the logical clock.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_now_id: $.data.id, cmp_now_status: $.data.status }
            - call: "POST /oversight/alerts"
              payload: { partner_id: "${pa_id}", alert_type: "VELOCITY_SPIKE", triggered_at: "2026-08-01T00:00:01Z", transaction_volume_cents: 100000, detection_note: "Triggered one second after the logical clock." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_alert_future: $.data.error_id }
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "Attempted before the period elapsed." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_cyc_elapse: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "One second before the period end." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_cyc_elapse2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { clk_now: $.data.current_utc }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${pa_id}", kyc_owner: "BANK", dispute_owner: "PARTNER", marketing_owner: "PARTNER", oversight_rights_level: "ENHANCED", audit_access_notice_days: 10, termination_triggers: ["VOLUNTARY"], monthly_growth_cap_pct: 50.00, concentration_cap_pct: 80.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-31T23:59:59Z", expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_eff_past: $.data.error_id }
            - call: "POST /oversight/cycles/${cyc_aug_id}/close"
              payload: { closing_note: "Clock now exactly equals period_end." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cyc_closed_status: $.data.status }
          assert:
            - "e_ts_future == ERR_TIMESTAMP_IN_FUTURE (422) — received_at <= clock is the test, so one second past it fails"
            - "cmp_now_status == RECEIVED — received_at exactly equal to the clock is accepted"
            - "e_alert_future == ERR_TIMESTAMP_IN_FUTURE — the same rule covers TransactionMonitoringAlert.triggered_at"
            - "e_cyc_elapse == ERR_CYCLE_PERIOD_NOT_ELAPSED (409) at a clock of 2026-08-01"
            - "e_cyc_elapse2 == ERR_CYCLE_PERIOD_NOT_ELAPSED at 2026-08-31T23:59:59Z — one second short of period_end"
            - "clk_now == 2026-09-01T00:00:00Z and cyc_closed_status == CLOSED — period_end <= clock is inclusive"
            - "e_eff_past == ERR_EFFECTIVE_DATE_IN_PAST (422) — the agreement's effective_date 2026-08-31T23:59:59Z is one second behind the clock; note this probe also proves the rule reads the CURRENT clock, since the same value would have been legal before the clock moved"

      - name: at_most_one_open_artefact_per_partner_is_enforced_for_reviews_agreements_and_plans
