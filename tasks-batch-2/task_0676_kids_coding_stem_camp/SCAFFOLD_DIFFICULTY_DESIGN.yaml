              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /showcases"
              payload: { center_id: "${c1}", program_id: "${prog}", min_belt_rank: 1, capacity: 10, starts_at: "2026-05-11T09:00:00Z", entry_deadline_at: "2026-05-10T12:00:00Z" }
              as: CenterAdmin
              captures: { sh1: $.data.id }
