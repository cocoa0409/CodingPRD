      - name: state_cascade_down_vendor_termination_cancels_reserved_windows
        claim_type: cascade_down
        grounds:
          - state_machines.VendorContract.SELECTED_to_TERMINATED
          - state_machines.ConversionWindow.RESERVED_to_CANCELLED
          - calculations.conversion_capacity_occupation
          - entities.VendorContract.fields.active_window_count
        distinguishing_aspect: >
          Terminating the parent contract cancels BOTH of its non-terminal ConversionWindows and
          recomputes active_window_count to 0 in the same request - the cascade reaches every
          RESERVED child, not just the most recent one.
        test_recipe:
          setup:
            - "One OrganizingGroup at stage ORGANIZING (so the after-opening termination bar does not apply)."
            - "One CORE_PROCESSING VendorContract in status SELECTED."
            - "Two RESERVED ConversionWindows on that contract:"
            - "[2026-09-01T08:00:00Z, 2026-09-02T08:00:00Z) and [2026-09-03T08:00:00Z, 2026-09-04T08:00:00Z),"
            - "so active_window_count is 2."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
