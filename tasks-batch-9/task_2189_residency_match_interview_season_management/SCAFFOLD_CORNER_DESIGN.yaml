      - name: assigning_an_interviewer_who_declared_a_conflict_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_CONFLICT_OF_INTEREST
          - validations.priority 7
        excluded_because:
          difficulty_instance: conflict_of_interest_precedes_interviewer_double_booking
          rationale: >
            The conflict rule is exercised - and shown to outrank the priority-9 overlap rule on a call that
            violates both - by the §1.8 priority-pair instance.

      - name: assigning_an_interviewer_onto_an_overlapping_slot_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_INTERVIEWER_DOUBLE_BOOKED
          - validations.priority 9
        excluded_because:
          difficulty_instance: interviewer_half_open_adjacency_allowed_but_one_hour_overlap_rejected
          rationale: >
            Both the rejected overlap and the admitted exact adjacency are asserted by the §1.8
            resource-overlap instance, which is where the half-open semantics live.

      - name: a_wave_inside_the_forty_eight_hour_buffer_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_WAVE_WINDOW_CONFLICT
          - validations.priority 9
        excluded_because:
          difficulty_instance: wave_closed_interval_requires_forty_eight_hour_buffer_both_directions
          rationale: >
            The 0-hour, 47-hour and exactly-48-hour cases on both sides of an existing window are walked by
            the §1.8 temporal-overlap instance.

      - name: activating_a_contract_with_an_unverified_mandatory_item_is_rejected
        claim_type: error_condition
        grounds:
          - errors.ERR_CREDENTIALS_INCOMPLETE
          - validations.priority 11
        excluded_because:
          difficulty_instance: contract_activation_gated_by_every_mandatory_credential_item
          rationale: >
            The aggregate credential gate, including the passing side once the last mandatory item is verified,
            is the §1.8 cross-entity instance's subject.


