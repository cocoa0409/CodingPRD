# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage index)
# HSA Investment & Administration Platform — EXPERT band.
# Walks references/claim-extraction-guide.md sections against SCAFFOLD §1.1-§1.7.
# Every error_id is triggerable; §1.8-covered corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_accountholder_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Accountholder, endpoints]
        distinguishing_aspect: "POST /hsa/accountholders with full_name+email+date_of_birth returns 201 and a server-minted id, created_at, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Pat Quy", email: "pat.quy@x.com", date_of_birth: "1980-01-01" }
              as: AccountAdmin
              captures: { h_id: $.data.id, v: $.data.version }
          assert:
            - "Response code == 201"
            - "Accountholder.${h_id}.full_name == 'Pat Quy' and version == 1"

      - name: create_accountholder_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Accountholder.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /hsa/accountholders omitting required email returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "No Email", date_of_birth: "1980-01-01" }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (422)"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.HsaAccount, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /hsa/accounts/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /hsa/accounts/00000000-0000-4000-8000-000000000000"
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND (404)"

      - name: account_computed_balances_initialized_zero_on_open
        claim_type: Computed Fields
        grounds:
          - entities.HsaAccount.fields.cash_balance_cents
          - entities.HsaAccount.fields.invested_balance_cents
          - entities.HsaAccount.fields.applicable_limit_cents
        distinguishing_aspect: "A freshly opened (PENDING_VERIFICATION) account reports cash_balance_cents==0, invested_balance_cents==0, contributions_ytd_cents==0, applicable_limit_cents==0; client-supplied balances are ignored (none accepted)."
        test_recipe:
          setup: ["One Accountholder."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ru Sun", email: "ru.sun@x.com", date_of_birth: "1980-02-02" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id }
          assert:
            - "HsaAccount.${acc_id}.cash_balance_cents == 0 and invested_balance_cents == 0"
            - "HsaAccount.${acc_id}.applicable_limit_cents == 0 and lifecycle_status == PENDING_VERIFICATION"

      - name: taxform_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TaxForm]
        distinguishing_aspect: "TaxForm has common_fields:false — its create response carries id and created_at but no version, and there is no update endpoint for it."
        test_recipe:
          setup: ["ACTIVE account, no distributions/contributions (5498 FMV 0)."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Te Uno", email: "te.uno@x.com", date_of_birth: "1980-03-03" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/tax-forms"
              payload: { form_type: "FORM_5498_SA", tax_year: 2026 }
              as: AccountAdmin
              captures: { tf_id: $.data.id }
          assert:
            - "Response code == 201; TaxForm.${tf_id}.form_type == FORM_5498_SA"
            - "TaxForm.${tf_id}.gross_amount_cents == 0 and fair_market_value_cents == 0 and nonqualified_amount_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: verify_already_active_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HsaAccount.PENDING_VERIFICATION_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-verifying an already-ACTIVE account (PENDING_VERIFICATION transition not defined from ACTIVE) returns ERR_INVALID_STATE; lifecycle stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE account."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Vi Wex", email: "vi.wex@x.com", date_of_birth: "1980-04-04" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE; HsaAccount.${acc_id}.lifecycle_status == ACTIVE"

      - name: verify_bad_token_returns_invalid_token
        claim_type: precondition_violation
        grounds: [state_machines.HsaAccount.PENDING_VERIFICATION_to_ACTIVE, "errors[ERR_INVALID_TOKEN]"]
        distinguishing_aspect: "Verifying with a wrong verification_token returns ERR_INVALID_TOKEN; account stays PENDING_VERIFICATION."
        test_recipe:
          setup: ["PENDING_VERIFICATION account with one ATTESTED coverage period."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Wu Xan", email: "wu.xan@x.com", date_of_birth: "1980-05-05" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "wrong-token" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_TOKEN; HsaAccount.${acc_id}.lifecycle_status == PENDING_VERIFICATION"

      - name: verify_without_coverage_returns_hdhp_required
        claim_type: precondition_violation
        grounds: [state_machines.HsaAccount.PENDING_VERIFICATION_to_ACTIVE, "validations[priority=8]", "errors[ERR_HDHP_REQUIRED]"]
        distinguishing_aspect: "Verifying an account with zero ATTESTED CoveragePeriods returns ERR_HDHP_REQUIRED (HDHP eligibility gate)."
        test_recipe:
          setup: ["PENDING_VERIFICATION account with NO coverage period."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Xi You", email: "xi.you@x.com", date_of_birth: "1980-06-06" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_HDHP_REQUIRED; lifecycle_status == PENDING_VERIFICATION"

      - name: close_with_open_distribution_returns_open_distribution
        claim_type: precondition_violation
        grounds: [state_machines.HsaAccount.ACTIVE_to_CLOSED, "errors[ERR_OPEN_DISTRIBUTION]"]
        distinguishing_aspect: "Closing an ACTIVE account that has a REQUESTED distribution returns ERR_OPEN_DISTRIBUTION; lifecycle stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE account with cash 50000 and one REQUESTED REIMBURSEMENT distribution for 20000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Yo Zed", email: "yo.zed@x.com", date_of_birth: "1980-07-07" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 50000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 20000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/close"
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_OPEN_DISTRIBUTION; HsaAccount.${acc_id}.lifecycle_status == ACTIVE"

      - name: account_close_cascades_active_cards_to_closed
        claim_type: side_effect
        grounds: [state_machines.HsaAccount.ACTIVE_to_CLOSED, state_machines.DebitCard, entities.DebitCard.fields.status]
        distinguishing_aspect: "Closing an account with an ACTIVE DebitCard cascades the card to CLOSED (cascade-down side effect)."
        test_recipe:
          setup: ["ACTIVE account with one ACTIVE DebitCard, no open distributions."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Al Bee", email: "al.bee@x.com", date_of_birth: "1980-08-08" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/cards"
              payload: { last_four: "9999" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { card_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/activate"
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/close"
              as: AccountAdmin
          assert:
            - "HsaAccount.${acc_id}.lifecycle_status == CLOSED"
            - "DebitCard.${card_id}.status == CLOSED (cascaded from account close)"

      - name: card_closed_terminal_lockdown_rejects_activate
        claim_type: terminal_lockdown
        grounds: [state_machines.DebitCard, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED DebitCard is terminal: activating it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE account with one DebitCard explicitly CLOSED via the card close endpoint."]
          setup_api_calls:
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Bo Cee", email: "bo.cee@x.com", date_of_birth: "1980-09-09" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/cards"
              payload: { last_four: "7777" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { card_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/close"
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/activate"
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE; DebitCard.${card_id}.status == CLOSED"

      - name: distribution_substantiate_twice_returns_already_substantiated
        claim_type: invalid_transition
        grounds: [state_machines.Distribution.CLEARED_to_CLEARED, "errors[ERR_ALREADY_SUBSTANTIATED]"]
        distinguishing_aspect: "Substantiating an already-substantiated CLEARED distribution a second time returns ERR_ALREADY_SUBSTANTIATED."
        test_recipe:
          setup: ["ACTIVE account, cash 80000; a 50000 REIMBURSEMENT distribution CLEARED by adminA and substantiated NONQUALIFIED by adminB (no receipt)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Cy Dee", email: "cy.dee@x.com", date_of_birth: "1980-10-10" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 80000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 50000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d_id}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d_id}/substantiate"
              payload: {}
              as: AccountAdmin
              as_user_id: "adminB"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d_id}/substantiate"
              payload: {}
              as: AccountAdmin
              as_user_id: "adminB"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_ALREADY_SUBSTANTIATED; Distribution.${d_id}.substantiation_status == NONQUALIFIED"

      - name: sweep_unwind_twice_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.InvestmentSweep.EXECUTED_to_UNWOUND, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An UNWOUND InvestmentSweep is terminal: a second unwind returns ERR_INVALID_STATE (the EXECUTED_to_UNWOUND transition is not defined from UNWOUND); balances stay at their post-first-unwind values."
        test_recipe:
          setup: ["ACTIVE account, cash 250000 posted, one EXECUTED sweep of 50000 already UNWOUND once (invested back to 0)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "De Eff", email: "de.eff@x.com", date_of_birth: "1980-11-11" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 250000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/sweeps"
              payload: { expected_account_version: "${acc_v}" }
              as: AccountAdmin
              captures: { sweep_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/sweeps/${sweep_id}/unwind"
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/sweeps/${sweep_id}/unwind"
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (sweep ${sweep_id} is already UNWOUND, a terminal state)"
            - "HsaAccount.${acc_id}.cash_balance_cents == 250000 and invested_balance_cents == 0 (unchanged by the rejected second unwind)"

      - name: account_initial_state_pending_verification
        claim_type: initial_state
        grounds: [state_machines.HsaAccount, entities.HsaAccount.fields.lifecycle_status]
        excluded_because:
          difficulty_instance: combinatorial_formula / contribution_accrual_pinned_eval_order
          rationale: "Account open->PENDING_VERIFICATION->ACTIVE lifecycle and posture derivation is exercised across multiple §1.8 setup chains; initial-state correctness is asserted by account_computed_balances_initialized_zero_on_open above."

  # ===========================================================================
  - section: calculations
    instances:
      - name: form_5498_totals_sum_posted_and_fmv_snapshot
        claim_type: Correct Result
        grounds: [calculations.form_5498_totals, entities.TaxForm.fields.gross_amount_cents, entities.TaxForm.fields.fair_market_value_cents]
        distinguishing_aspect: "With two POSTED contributions (200000 + 100000) and one EXECUTED sweep of 50000 (cash 250000 -> 200000, invested 50000), FORM_5498_SA reports gross_amount_cents==300000 and fair_market_value_cents==250000 (cash 200000 + invested 50000)."
        test_recipe:
          setup: ["ACTIVE account, contributions 200000 + 100000 posted (cash 300000), then sweep 50000 -> requested all investable above 200000 threshold (cash 250000? recompute below)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ef Gee", email: "ef.gee@x.com", date_of_birth: "1979-01-01" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 200000 }
              as: AccountAdmin
              captures: { c1: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c1}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 100000 }
              as: AccountAdmin
              captures: { c2: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c2}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/sweeps"
              payload: { requested_amount_cents: 50000, expected_account_version: "${acc_v}" }
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/tax-forms"
