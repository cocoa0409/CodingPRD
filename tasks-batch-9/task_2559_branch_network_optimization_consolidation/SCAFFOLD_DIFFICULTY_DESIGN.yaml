              payload: { consolidation_case_id: "${caseA_id}", wave_start_date: "2026-10-01", wave_end_date: "2026-10-11", inbound_household_count: 300, channel_mix: "LETTER_EMAIL" }
              as: ComplianceOfficer
              captures: { cp1_id: $.data.id }
            - call: "POST /distribution/transition-campaigns"
              payload: { consolidation_case_id: "${caseB_id}", wave_start_date: "2026-10-06", wave_end_date: "2026-10-16", inbound_household_count: 300, channel_mix: "LETTER_ONLY" }
              as: ComplianceOfficer
              captures: { cp2_id: $.data.id }
            - call: "POST /distribution/transition-campaigns"
              payload: { consolidation_case_id: "${caseC_id}", wave_start_date: "2026-10-08", wave_end_date: "2026-10-18", inbound_household_count: 10, channel_mix: "FULL_OMNI" }
              as: ComplianceOfficer
              captures: { err_capacity: $.data.error_id }
            - call: "POST /distribution/transition-campaigns"
              payload: { consolidation_case_id: "${caseC_id}", wave_start_date: "2026-10-16", wave_end_date: "2026-10-26", inbound_household_count: 600, channel_mix: "FULL_OMNI" }
              as: ComplianceOfficer
              captures: { cp4_id: $.data.id }
          assert:
            - "CustomerTransitionCampaign.${cp1_id}: wave_days == 10, daily_onboarding_load == 30, receiving_branch_id == ${b2_id}, status == PLANNED"
            - "CustomerTransitionCampaign.${cp2_id}: wave_days == 10, daily_onboarding_load == 30, created successfully even though 2026-10-06..2026-10-10 carries a summed load of exactly 60 == capacity"
            - "trigger 3 asks for only 1 household/day but pushes 2026-10-08..2026-10-10 to 61 and returns ${err_capacity} == ERR_ABSORPTION_CAPACITY_EXCEEDED with HTTP 409"
            - "CustomerTransitionCampaign.${cp4_id}: wave_days == 10, daily_onboarding_load == 60, created successfully because ${cp2_id}'s half-open interval excludes its end date 2026-10-16"
            - "GET /distribution/transition-campaigns?receiving_branch_id=${b2_id} returns exactly 3 rows (the rejected wave persisted nothing)"
            - "no campaign is LAUNCHED and no ConsolidationCase leaves DRAFT in this recipe"

  - rule_id: compensating_invariant
    instances:
      - name: unwind_closure_restores_market_deposit_ledger_exactly
        grounds:
          - calculations.deposit_conservation_invariant
          - state_machines.ConsolidationCase.CLOSURE_EXECUTED_to_UNWOUND
          - state_machines.Branch.CLOSED_to_ACTIVE
          - state_machines.PropertyDisposition.MARKETED_to_PENDING
          - entities.MarketArea.fields.cumulative_runoff_deposits_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY across a three-place ledger (closing branch, receiving
          branch, market runoff ledger) and the compensation is a system cascade fired by one endpoint
          that must reverse five separate side effects, including the derived savings chain and the
          governance flag counter. Deliberately NOT reversed: the COMPLETED transition communications
          artefacts, which the test pins so drift cannot be excused as compensation.
        test_recipe:
          setup:
            - "MarketArea 'Riverbend North' with RB-101 (closing, deposits 4800000000, fte_count 9) and RB-102 (receiving, deposits 9600000000); network deposits 14400000000 and cumulative_runoff_deposits_cents 0."
            - "The full core chain to a CLOSURE_EXECUTED case executed on 2026-11-02: DISTANCE_DECAY forecast (retained 4416000000, runoff 384000000), one LEASED PropertyDisposition, REGULATOR notice effective 2026-11-01, LAUNCHED campaign."
            - "No DepositObservation has been posted, so case.last_observed_month_index == 0 and the case is still inside the 30-day unwind window."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Riverbend North", region_code: "MW-04", population: 120000, median_household_income_cents: 8500000, deposit_market_total_cents: 240000000000, competitor_branch_count: 24, household_growth_pct_bps: 350, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3600, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 140000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 7200, digital_adoption_bps: 6800, annual_noninterest_expense_cents: 118000000, annual_revenue_cents: 305000000, fte_count: 14, atm_count: 3, opened_on: "1998-06-15", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-11-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "DISTANCE_DECAY", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v1}" }
              as: NetworkStrategist
            - call: "POST /distribution/property-dispositions"
              payload: { branch_id: "${b1_id}", consolidation_case_id: "${case_id}", atm_disposition: "RELOCATE", atm_monthly_cost_cents: 30000, atm_monthly_surcharge_revenue_cents: 80000, monthly_rent_cents: 250000, lease_end_date: "2027-06-30", buyout_offer_cents: 500000 }
              as: RealEstateManager
              captures: { pd_id: $.data.id }
            - call: "POST /distribution/consolidation-cases/${case_id}/submit"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "GET /distribution/consolidation-cases/${case_id}"
              payload: {}
              as: ConsolidationApprover
              captures: { case_v2: $.data.version }
            - call: "POST /distribution/consolidation-cases/${case_id}/decision"
              payload: { decision: "APPROVE", expected_case_version: "${case_v2}" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
            - call: "POST /distribution/consolidation-cases/${case_id}/impact-assessments"
              payload: { lmi_tract: false, distance_to_nearest_remaining_miles: 2.0, alternative_access_count: 3, senior_household_pct_bps: 1600, public_transit_access: true }
              as: ComplianceOfficer
              captures: { ia_id: $.data.id }
            - call: "POST /distribution/impact-assessments/${ia_id}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /distribution/closure-notices"
              payload: { consolidation_case_id: "${case_id}", notice_type: "REGULATOR", effective_closure_date: "2026-11-01" }
              as: ComplianceOfficer
              captures: { nt_id: $.data.id }
            - call: "POST /distribution/transition-campaigns"
              payload: { consolidation_case_id: "${case_id}", wave_start_date: "2026-10-01", wave_end_date: "2026-10-11", inbound_household_count: 300, channel_mix: "LETTER_EMAIL" }
              as: ComplianceOfficer
              captures: { cp_id: $.data.id }
            - call: "POST /distribution/transition-campaigns/${cp_id}/launch"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T00:00:00Z" }
              as: NetworkOpsAdmin
            - call: "POST /distribution/consolidation-cases/${case_id}/execute-closure"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /distribution/consolidation-cases/${case_id}/unwind-closure"
              payload: { rescission_reason_code: "REGULATOR_OBJECTION" }
              as: ComplianceOfficer
          assert:
            - "immediately before the trigger the ledger reads Branch.${b1_id}.deposit_balance_cents == 0, Branch.${b2_id}.deposit_balance_cents == 14016000000, MarketArea.${ma_id}.cumulative_runoff_deposits_cents == 384000000, sum 14400000000"
            - "after the trigger Branch.${b1_id}.deposit_balance_cents == 4800000000 and Branch.${b1_id}.pre_close_deposits_cents is null and Branch.${b1_id}.status == ACTIVE and Branch.${b1_id}.absorbing_branch_id is null"
            - "after the trigger Branch.${b2_id}.deposit_balance_cents == 9600000000 and Branch.${b2_id}.transferred_in_deposits_cents == 0"
            - "after the trigger MarketArea.${ma_id}.absorbed_deposits_cents == 0 and MarketArea.${ma_id}.cumulative_runoff_deposits_cents == 0; the invariant sum is still exactly 14400000000 with zero drift"
            - "Branch.${b1_id}.fte_count == 9 and pre_close_fte_count is null (headcount restored from the closure stamp)"
            - "PropertyDisposition.${pd_id}.status == PENDING, marketing_started_on is null, annual_carry_cents back to 3000000"
            - "ConsolidationCase.${case_id}: status == UNWOUND, gross_annual_savings_cents == 26360000, transition_incentive_cents == 11040000, net_annual_savings_cents == 15320000, governance_flag == NONE"
            - "MarketArea.${ma_id}.flagged_case_count == 0 (the SAVINGS_WATCH increment is reversed)"
            - "ClosureNotice.${nt_id}.status == WITHDRAWN"
            - "CustomerTransitionCampaign.${cp_id}.status == COMPLETED and is NOT reverted (the compensation covers the deposit ledger and the property/notice chain, never a completed communications wave)"
            - "every touched row's version is strictly greater than its pre-trigger value; compensation restores values, never version counters"

      - name: rescind_redeployment_restores_network_headcount_exactly
        grounds:
          - calculations.headcount_conservation_invariant
          - state_machines.StaffDisposition.PROPOSED_to_OFFER_ACCEPTED
          - state_machines.StaffDisposition.OFFER_ACCEPTED_to_PROPOSED
          - entities.ConsolidationCase.fields.redeployed_fte_count
          - entities.ConsolidationCase.fields.pending_disposition_count
        distinguishing_aspect: |
          The conserved quantity is HEADCOUNT (integers, no money and no rounding) and it is conserved
          across TWO independent sums at once: the branch-plus-severed total and the
          redeployed-plus-pending counter pair. The compensation here is an explicit operator action
          on the child row, not a system cascade, and the case's severance pool must stay untouched
          because the accept/rescind pair only moves a REDEPLOYMENT row.
        test_recipe:
          setup:
            - "MarketArea 'Harbor Point' with RB-501 (closing, fte_count 9) and RB-503 (receiving, fte_count 14)."
            - "An APPROVED case RB-501 -> RB-503 with two dispositions: one REDEPLOYMENT (EMP-9002) already NOTIFIED and one SEVERANCE (EMP-7741, tenure_months 150, annual_salary_cents 7800050) left PROPOSED."
            - "Baseline: closing 9 + receiving 14 + severed 0 == 23; redeployed_fte_count 0 + pending_disposition_count 2 == 2; severance_pool_cents 3720024."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Point", region_code: "NE-02", population: 140000, median_household_income_cents: 9100000, deposit_market_total_cents: 260000000000, competitor_branch_count: 26, household_growth_pct_bps: 300, digital_penetration_bps: 5600 }
              as: NetworkStrategist
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-501", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 3400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 138000000, fte_count: 9, atm_count: 2, opened_on: "2006-01-16" }
              as: NetworkStrategist
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-503", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 7200, digital_adoption_bps: 6800, annual_noninterest_expense_cents: 118000000, annual_revenue_cents: 305000000, fte_count: 14, atm_count: 3, opened_on: "1999-04-05", onboarding_capacity_households_per_day: 60 }
              as: NetworkStrategist
              captures: { b3_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b3_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_v1: $.data.version }
            - call: "POST /distribution/retention-forecasts"
              payload: { consolidation_case_id: "${case_id}", model_variant: "DISTANCE_DECAY", distance_miles: 3.4, retail_share_bps: 6000, small_business_share_bps: 2500, wealth_share_bps: 1500, expected_case_version: "${case_v1}" }
              as: NetworkStrategist
            - call: "POST /distribution/consolidation-cases/${case_id}/submit"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
            - call: "GET /distribution/consolidation-cases/${case_id}"
              payload: {}
              as: ConsolidationApprover
              captures: { case_v2: $.data.version }
            - call: "POST /distribution/consolidation-cases/${case_id}/decision"
              payload: { decision: "APPROVE", expected_case_version: "${case_v2}" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
            - call: "POST /distribution/staff-dispositions"
              payload: { consolidation_case_id: "${case_id}", employee_ref: "EMP-9002", role_title: "Personal Banker", tenure_months: 84, annual_salary_cents: 6240000, proposed_disposition: "REDEPLOYMENT", target_branch_id: "${b3_id}" }
              as: HRPartner
              captures: { sd_red_id: $.data.id }
            - call: "POST /distribution/staff-dispositions"
              payload: { consolidation_case_id: "${case_id}", employee_ref: "EMP-7741", role_title: "Branch Manager", tenure_months: 150, annual_salary_cents: 7800050, proposed_disposition: "SEVERANCE" }
              as: HRPartner
              captures: { sd_sev_id: $.data.id }
            - call: "POST /distribution/staff-dispositions/${sd_red_id}/notify"
              payload: {}
              as: HRPartner
          trigger:
            - call: "POST /distribution/staff-dispositions/${sd_red_id}/accept"
              payload: {}
              as: HRPartner
            - call: "POST /distribution/staff-dispositions/${sd_red_id}/rescind"
              payload: { rescind_reason_code: "EMPLOYEE_DECLINED" }
              as: HRPartner
          assert:
            - "after trigger 1: Branch.${b1_id}.fte_count == 8, Branch.${b3_id}.fte_count == 15, ConsolidationCase.${case_id}.redeployed_fte_count == 1, pending_disposition_count == 1, severed_fte_count == 0; network headcount 8 + 15 + 0 == 23"
            - "after trigger 2: Branch.${b1_id}.fte_count == 9, Branch.${b3_id}.fte_count == 14, redeployed_fte_count == 0, pending_disposition_count == 2, severed_fte_count == 0; network headcount 9 + 14 + 0 == 23 with zero drift"
            - "redeployed_fte_count + pending_disposition_count == 2 before trigger 1, after trigger 1 and after trigger 2"
            - "StaffDisposition.${sd_red_id}.disposition_state == PROPOSED after trigger 2 while notification_state stays NOTIFIED and notified_on is unchanged (the compensation touches only the disposition axis)"
            - "StaffDisposition.${sd_red_id}.severance_amount_cents == 0 both before and after (a REDEPLOYMENT row never accrues severance)"
            - "ConsolidationCase.${case_id}.severance_pool_cents == 3720024 before trigger 1, after trigger 1 and after trigger 2 (the untouched SEVERANCE row is the only contributor)"
            - "StaffDisposition.${sd_red_id}.version and both Branch versions are strictly greater after trigger 2 than before trigger 1"
