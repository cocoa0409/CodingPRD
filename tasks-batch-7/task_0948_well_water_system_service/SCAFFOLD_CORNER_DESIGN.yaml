            - "${err_state} == ERR_WATER_TEST_INVALID_STATE"
            - "${err_hold} == ERR_WATER_TEST_HOLD_TIME_EXCEEDED"
            - "TreatmentRecommendation.${rec_id}.expires_at == 2026-11-28T00:00:00.000Z"
            - "TreatmentRecommendation.${rec_id}.status_effective == EXPIRED"
            - "${err_exp} == ERR_TREATMENT_RECOMMENDATION_EXPIRED"
            - "TreatmentRecommendation.${rec_id}.status == PROPOSED"

