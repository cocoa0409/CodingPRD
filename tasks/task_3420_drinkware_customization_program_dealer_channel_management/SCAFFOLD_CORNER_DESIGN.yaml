          trigger:
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${c_dealer}", drop_id: "${drop_ca}", requested_units: 6 }
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { err_credit: $.data.error_id }
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${c_dealer}", drop_id: "${drop_cb}", requested_units: 5 }
