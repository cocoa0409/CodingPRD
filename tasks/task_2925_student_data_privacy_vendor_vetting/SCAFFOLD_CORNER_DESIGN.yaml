      - name: missing_identity_headers_are_401_before_any_row_lookup
        claim_type: Error Triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope
        distinguishing_aspect: |
          Priority 1 outranks the 404 at priority 4: a request with an empty X-User-Role on a
          path whose id does not exist must answer 401 ERR_UNAUTHENTICATED, never 404. An
          empty-string header is present-but-empty and must be treated as missing, so the
          same call with a valid role returns the 404 instead.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the database is empty apart from the clock."
            - "The probe id 00000000-0000-4000-8000-000000000000 was never issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
