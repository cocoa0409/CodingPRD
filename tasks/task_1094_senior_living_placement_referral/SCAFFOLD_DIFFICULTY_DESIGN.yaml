              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /matches"
              payload: { inquiry_id: "${q1_id}", community_id: "${c1_id}", care_level: "ASSISTED_LIVING" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /matches/${m1_id}/shortlist"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-05T15:00:00Z", scheduled_end: "2026-06-05T16:00:00Z", mode: "IN_PERSON" }
              as: Advisor
