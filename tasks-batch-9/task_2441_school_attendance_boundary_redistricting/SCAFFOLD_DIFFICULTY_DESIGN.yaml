- rule_id: combinatorial_formula
  instances:
  - name: transport_cost_nested_ceil_max_and_walk_branch
    grounds:
    - calculations.transportation_cost_annual
    - entities.BoundaryScenario.fields.transport_cost_annual_usd
    - entities.BoundaryScenario.fields.walk_eligible_pct
    - entities.PlanningArea.fields.travel_options
    distinguishing_aspect: 'MODE (a) - a single expression nesting a three-input conditional (walk_distance_miles <= WALK_LIMIT_MILES[level] AND has_safe_route) inside max(bus_minutes, MIN_BILLED_MINUTES) inside ceil(riders / BUS_CAPACITY): A-02 needs ceil(181/71) == 3 buses billed at max(9,15) == 15 minutes, while A-01 and A-03 fall down the walk branch and contribute exactly 0, giving 66285.00 - a value unreachable if any one of the three nestings is dropped.'
    test_recipe:
      setup:
      - The base study is DATA_LOCKED with no housing pipeline, so the COHORT_SURVIVAL run projects A-01 271, A-02 181, A-03 136 students (total 588).
      - Scenario A (DRAFT) assigns A-01 and A-02 to Cedar Elementary and A-03 to Birch Elementary.
      - A-01 -> Cedar travel option is walk 0.6 mi with a safe route (<= WALK_LIMIT_MILES_ELEMENTARY 1.0) so it is walk-eligible; A-03 -> Birch is walk 0.9 mi with a safe route, also walk-eligible.
