      - name: menu_board_kind_is_awarded_the_printer_and_touch_components_unconditionally
        claim_type: variant_selection
        grounds:
          - calculations.device_health_score.formula
          - entities.Device.fields.device_kind
        distinguishing_aspect: "The device_kind branch, not the flags, decides which components are charged: a MENU_BOARD reporting printer_ok false and touch_ok false still scores 100 and bands ONLINE, while a KIOSK in the very same store with identical flags scores 50 and bands DEGRADED."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001."
            - "Board B001 (MENU_BOARD) and kiosk K002 (KIOSK) are both registered at S001."
