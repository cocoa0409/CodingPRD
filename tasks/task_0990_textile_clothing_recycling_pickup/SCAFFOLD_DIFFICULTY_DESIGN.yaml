              captures: { k_status: $.data.status }
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 10.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
          assert:
            - "first attempt: 409 ${id} == ERR_BAGS_NOT_DELIVERED (kit DISPATCHED, not DELIVERED)"
            - "after deliver (${id} == DELIVERED): second attempt succeeds, ticket ${id} created"
            - "pickup is COLLECTED and kit K auto-transitioned DELIVERED -> RETIRED by the collection"

      - name: finalize_requires_active_sponsor_fund
        grounds:
          - state_machines.DiversionCredit.PROVISIONAL_to_FINALIZED
          - state_machines.SponsorFund
          - errors[ERR_FUND_NOT_ACTIVE]
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair DiversionCredit x SponsorFund (different pair from
          instance 1): finalize is gated on the zone having a SponsorFund in
          ACTIVE status; with no fund at all the finalize is rejected, and
          creating the fund afterwards unblocks it.
        test_recipe:
          setup:
            - "Zone Z with NO sponsor fund; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE; credit C PROVISIONAL (projected 1650)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CE2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Karl Kipp", email: "karl@x.com", address: "13 Magnolia Ave" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
              captures: { err: $.data.error_id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
              captures: { c_status: $.data.status, c_gross: $.data.gross_cents }
          assert:
            - "first finalize: 409 ${id} == ERR_FUND_NOT_ACTIVE (no ACTIVE fund in the zone)"
            - "after fund creation: finalize succeeds, ${id} == FINALIZED, gross_cents == 1650"
            - "credit fund_id == ${id}"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resources (resident schedule with
  # half-open+buffer geometry vs driver route-day aggregate capacity).
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: resident_window_thirty_minute_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_PICKUP_WINDOW_CONFLICT]
          - entities.PickupRequest.fields.window_start
        distinguishing_aspect: |
          Resource = Resident schedule; semantics = half-open intervals widened
          by a symmetric 30-minute buffer: a follow-on window starting exactly
          30 minutes after the previous window's end is admitted (gap == buffer
          passes), while 29 minutes is rejected as a conflict.
        test_recipe:
          setup:
            - "Zone Z; resident R (ACTIVE); existing pickup P1 SCHEDULED 2026-05-10T10:00:00Z..12:00:00Z"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone TO1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Lena Loh", email: "lena@x.com", address: "14 Poplar St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T12:30:00Z", window_end: "2026-05-10T14:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p2_id: $.data.id, p2_status: $.data.status }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T12:29:00Z", window_end: "2026-05-10T13:29:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "P2 at exactly +30 min gap is created (${id} == SCHEDULED): 12:30 < 12:00+30min is false, so no conflict"
            - "P3 at +29 min gap rejected: ${id} == ERR_PICKUP_WINDOW_CONFLICT (12:29 < 12:30 buffer edge)"
            - "conflict check applies only to same-resident SCHEDULED/ROUTED pickups (P1 only)"

      - name: driver_route_day_aggregate_capacity_partition
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_ROUTED
          - entities.PickupRequest.fields.service_date
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = (driver_id, service_date) vehicle-day; semantics =
          aggregate capacity per calendar day with no geometric interval test —
          a different interval semantics from instance 1: 780 kg already routed
          on 2026-05-10 does NOT constrain the same driver on 2026-05-11 (fresh
          daily pool), while +40 kg on the same day overflows (820 > 800).
        test_recipe:
          setup:
            - "Zone Z; resident R (ACTIVE); PA 195 bags (780 kg) window 2026-05-10; PB 100 bags (400 kg) window 2026-05-11; PC 10 bags (40 kg) window 2026-05-10T12:30:00Z..14:00:00Z"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone TO2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Mona Mew", email: "mona@x.com", address: "15 Walnut Way" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T10:00:00Z", bags_claimed: 195 }
              as: Resident
              as_user_id: "${id}"
              captures: { pa_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-11T10:00:00Z", window_end: "2026-05-11T12:00:00Z", bags_claimed: 100 }
              as: Resident
              as_user_id: "${id}"
              captures: { pb_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T12:30:00Z", window_end: "2026-05-10T14:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
              captures: { pa_status: $.data.status }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-11" }
              as: ZoneOperator
              captures: { pb_status: $.data.status }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
              captures: { err: $.data.error_id }
          assert:
            - "PA routed (${id} == ROUTED): 780.0 <= 800.0 on day 2026-05-10"
            - "PB routed (${id} == ROUTED): same driver but 2026-05-11 is a fresh aggregate pool (400.0 <= 800.0)"
            - "PC rejected: ${id} == ERR_ROUTE_CAPACITY_EXCEEDED (780.0 + 40.0 = 820.0 > 800.0 on 2026-05-10)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: two conserved quantities of DIFFERENT
  # types (money in the fund ledger vs kg capacity partition on a partner).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fund_finalize_void_available_restored
        grounds:
          - calculations.sponsor_fund_ledger
          - state_machines.DiversionCredit.FINALIZED_to_VOIDED
          - entities.SponsorFund.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity = money: held_cents + paid_cents + available_cents
          == funded_total_cents at every checkpoint, and the forward action
          finalize paired with its compensating void returns available_cents to
          the exact pre-finalize value (100000), zero drift.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE; fund F initial 100000; credit C PROVISIONAL (1650)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CI1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Nina Noll", email: "nina@x.com", address: "16 Cherry St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { held_a: $.data.held_cents, paid_a: $.data.paid_cents, avail_a: $.data.available_cents, total_a: $.data.funded_total_cents }
            - call: "POST /diversion-credits/${id}/void"
              payload: {}
              as: ZoneOperator
              captures: { c_status: $.data.status, c_hold: $.data.has_hold }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { held_b: $.data.held_cents, paid_b: $.data.paid_cents, avail_b: $.data.available_cents, total_b: $.data.funded_total_cents }
          assert:
            - "after finalize: held ${id} == 1650, paid ${id} == 0, available ${id} == 98350; invariant 1650+0+98350 == 100000 == ${id}"
            - "after void (compensation): credit ${id} == VOIDED, has_hold false; held ${id} == 0, available ${id} == 100000 exactly restored"
            - "invariant after compensation: 0 + 0 + 100000 == ${id} == 100000 — no drift"

      - name: partner_accept_complete_capacity_partition_invariant
        grounds:
          - state_machines.RoutingAssignment.PENDING_to_ACCEPTED
          - state_machines.RoutingAssignment.ACCEPTED_to_COMPLETED
          - entities.Partner.fields.remaining_kg
        distinguishing_aspect: |
          Conserved quantity = weight-capacity partition (different type from
          instance 1's money): committed_kg + completed_kg + remaining_kg ==
          capacity_kg before, between, and after the accept -> complete pair;
          accept moves 12.5 kg free->committed, complete moves it
          committed->completed, remaining_kg identical (987.5) at both ends.
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup collected, certified 12.5 kg RESALE (ticket T)"
            - "Partner PT (BRAND, [RESALE], capacity 1000) selected for T; assignment A PENDING"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone CI2" }
