  - rule_id: boundary_precision_check
    instances:
      - name: selection_band_boundary_at_exactly_85
        grounds:
          - calculations.selection_score
          - validations[priority=28]
          - entities.Application.fields.final_selection_score
        distinguishing_aspect: |
          The SELECT band boundary on the final_selection_score metric is inclusive: exactly 85.00 is
          accepted through POST /corps/applications/{id}/decision while 84.96 is refused, so the comparison is
          >= and not >.
        test_recipe:
          setup:
            - "One Region (TX)."
            - "Two Applicants with identical leadership_score 80.0, achievement_score 85.0 and campus_tier STANDARD, each with one reviewed application in ENGLISH."
            - "Applicant one's verified_gpa is 4.00 (final score exactly 85.00); applicant two's verified_gpa is 3.99 (final score 84.96)."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
