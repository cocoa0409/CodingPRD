      - name: per_line_rounding_order
        claim_type: precision
        grounds:
          - calculations.royalty_due_computation
        excluded_because:
          difficulty_instance: combinatorial_formula / royalty_rounding_pinned_per_line_then_summed
          rationale: "The named §1.8 instance contrasts round-per-line-then-sum against sum-then-round on lines chosen so the two answers differ."

      - name: tier_schedule_lookup
        claim_type: tiered_pricing
        grounds:
          - calculations.royalty_due_computation
          - entities.ProductCategory.fields.tier_schedule
        excluded_because:
          difficulty_instance: boundary_precision_check / tier_lower_bound_is_inclusive_lower_basis_higher_royalty
          rationale: "The named §1.8 instance files bases one cent either side of a tier boundary and pins both royalties."

      - name: club_pool_waterfall_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.central_pool_distribution
        excluded_because:
          difficulty_instance: compensating_invariant / central_pool_conserved_exactly_by_largest_remainder_split
          rationale: "The named §1.8 instance splits an indivisible pool across three clubs and asserts exact conservation plus the largest-remainder tie-break."

      - name: risk_index_quarterly_decay
        claim_type: decay_function
        grounds:
          - calculations.compliance_risk_index
        excluded_because:
          difficulty_instance: dual_variant_calc / risk_index_rolling_monitor_vs_strict_assessment
          rationale: "The named §1.8 instance reads the same factor set in both variants, which is exactly the decay-versus-no-decay contrast."

      - name: royalty_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.royalty_due_computation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / royalty_provisional_quarterly_vs_final_annual_true_up
          rationale: "The named §1.8 instance runs both royalty variants over identical sales and pins the divergent results."

      - name: shortfall_reconciliation_at_expiry
        claim_type: reconciliation
        grounds:
          - calculations.mg_shortfall_assessment
        excluded_because:
          difficulty_instance: dual_variant_calc / mg_shortfall_interim_pro_rata_vs_final_at_expiry
          rationale: "The named §1.8 instance reconciles the interim accrual against the final assessment on the same agreement."

  # ===========================================================================
  - section: validations
    instances:

      - name: filing_a_report_before_its_quarter_ends_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_40
          - errors.ERR_PERIOD_NOT_ENDED
          - state_machines.RoyaltyReport.DRAFT_to_FILED
        distinguishing_aspect: |
          A 2026Q3 report may be CREATED at any time inside the term (priority 25
          only bounds the period by the term), but it may not be FILED until the
          clock's UTC date reaches 2026-09-30. With the clock at 2026-08-01 the
          file call returns ERR_PERIOD_NOT_ENDED (422) and the row stays DRAFT
          with royalty_due_cents 0 — no money is computed for an unfinished
          quarter. An implementation that validates the period at creation time
          rejects the wrong call.
