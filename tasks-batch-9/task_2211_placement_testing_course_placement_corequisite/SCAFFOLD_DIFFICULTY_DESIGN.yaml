      - name: validity_tier_locked_to_base_score_not_recomputed_after_staleness
        grounds:
          - calculations.placement_validity_window
          - calculations.placement_base_confidence_score
          - entities.PlacementDetermination.fields.validity_days
          - entities.PlacementDetermination.fields.staleness_penalty
          - entities.PlacementDetermination.fields.expires_at
          - entities.Student.fields.transcript_recorded_at
        distinguishing_aspect: |
          Mode (c): a deliberately order-sensitive chain where an intermediate is
          consumed BEFORE it is superseded. validity_days is keyed on
          base_confidence_score (85.0 -> tier 730, INCLUSIVE), expires_at is
          derived from validity_days, and the staleness penalty is measured
          against that expires_at — after which confidence_score drops to 69.0.
          calculations.placement_validity_window pins that STEP 2 is never
          re-run: validity_days stays 730 and expires_at stays
          2028-07-31T00:00:00Z even though the stored confidence_score (69.0)
          would map to tier 180. An implementation that recomputes the tier from
          confidence_score, or that measures staleness from determined_at instead
          of expires_at, produces 180 / a different penalty.
