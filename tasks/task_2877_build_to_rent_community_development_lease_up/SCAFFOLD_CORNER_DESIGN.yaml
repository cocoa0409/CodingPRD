          - state_machines.Phase.construction.CONSTRUCTION_HALTED_to_SECTIONS_RELEASED
          - state_machines.Homesite.inventory.OFF_MARKET_to_AVAILABLE
        distinguishing_aspect: |
          The phase dimension is cyclic: halt records pre_halt_status and resume must restore exactly
          that status, not the generic UNDER_CONSTRUCTION. The compensation is asymmetric on purpose —
          delisted homesites return to AVAILABLE with off_market_reason cleared, but released_at is
          never rewritten, so released_unit_count is identical before, during and after the cycle while
          available_unit_count collapses to 0 and comes back to 2. halt_count is a monotone counter and
          must not be decremented by the resume.
