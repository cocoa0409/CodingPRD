        excluded_because:
          difficulty_instance: dual_variant_calc / claim_reserve_repair_cost_vs_diminution_variant_divergence
          rationale: "Variant selection by valuation_basis and the resulting divergence in reserved_amount_cents and the committed pool are the named §1.8 instance's subject."

