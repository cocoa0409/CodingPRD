scenario: |
  Municipal Rulemaking, Disclosure Portal & Dealer Compliance (Municipal Securities Rulemaking Board): rule development for dealers and advisors with comment periods and regulatory approval before effectiveness, disclosure portal operations receiving official statements, continuing disclosures and trade data with public free access, submission requirements for issuers and obligated persons with event notice categories and timing, trade reporting requirements for dealers with time limits and price transparency publication, professional qualification examinations and continuing education requirements for municipal professionals, market data products and subscriber licensing, enforcement referral to examining authorities with rule interpretation guidance, advisor fiduciary standard rules and their application to solicitation activity

domain_name: municipal-rulemaking-disclosure-dealer-compliance
api_prefix: /msrb

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, rate_threshold_triggers, scheduled_deferred_actions]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: org_code
        type: string
        source: input
        description: Unique registrar code for the organization (e.g. issuer CIK-like code or dealer CRD-like code). Unique across all organizations.
      - name: name
        type: string
        source: input
        description: Legal name of the organization.
      - name: org_type
        type: enum
        source: input
        description: Regulated-organization classification; gates which child workflows may reference this organization.
        constraints: "one of {ISSUER, OBLIGATED_PERSON, BROKER_DEALER, MUNICIPAL_ADVISOR}"
      - name: status
        type: enum
        source: system
        description: Registration standing of the organization.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspended_reason
        type: string
        source: system
        description: Reason recorded when the organization was suspended; null while ACTIVE.
      - name: late_report_count
        type: integer
        source: computed
        description: Count of this organization's late TradeReports inside the trailing 30-day window (see calculations.late_report_tally_and_posture). Recomputed on trade create, trade cancel, and every epoch pass.
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived posture gating DataSubscription lifecycle; WATCH when late_report_count >= 5.
        default: CLEAR
        constraints: "one of {CLEAR, WATCH}"
      - name: published_par_total
        type: integer
        source: computed
        description: Sum of published_par over this organization's TradeReports with status DISSEMINATED. Cancel removes the trade's published_par from the total.
        default: 0
      - name: active_professional_count
        type: integer
        source: computed
        description: Count of MunicipalProfessionals with employer_org_id == this organization AND standing == ACTIVE (any qualification_status).
        default: 0

  - name: RuleProposal
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: Public rule identifier (e.g. "G-42"). Unique across all RuleProposals; EnforcementReferrals cite rules by this code.
      - name: title
        type: string
        source: input
        description: Short title of the proposed rule change.
      - name: body
        type: string
        source: input
        description: Full rule text under development.
      - name: category
        type: enum
        source: input
        description: Subject area of the rule.
        constraints: "one of {DEALER_CONDUCT, ADVISOR_CONDUCT, DISCLOSURE, TRADE_REPORTING, MARKET_DATA, QUALIFICATION}"
      - name: supersedes_proposal_id
        type: string
        source: input
        description: "FK -> RuleProposal.id; optional. When this proposal reaches EFFECTIVE, the referenced proposal transitions to SUPERSEDED. Null when the proposal does not supersede an existing rule."
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the rulemaking.
        default: DRAFT
        constraints: "one of {DRAFT, OPEN_FOR_COMMENT, PENDING_APPROVAL, APPROVED, DISAPPROVED, EFFECTIVE, SUPERSEDED}"
      - name: expedited
        type: boolean
        source: input
        description: Set at open-comment-period time; selects the expedited effectiveness-delay variant (10 days instead of 30).
        default: false
      - name: comment_period_days
        type: integer
        source: system
        description: Length of the comment window in days, captured from open-comment-period input. Must be within [21, 90].
      - name: comment_window_start
        type: datetime
        source: system
        description: Logical time when the comment period opened; null until first open.
      - name: comment_window_end
        type: datetime
        source: system
        description: "comment_window_start + comment_period_days days. The window is half-open [start, end): comments are accepted only while now < end; submit-for-approval requires now >= end."
      - name: comment_round
        type: integer
        source: system
        description: Number of times a comment period has been opened on this proposal; 0 at create, set to 1 on the first open, and increments on every subsequent DRAFT -> OPEN_FOR_COMMENT transition.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RulemakingOfficer who submitted the proposal for approval. Segregation of duties — the deciding Regulator's X-User-ID must differ.
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the Regulator who decided the proposal.
      - name: decision_reason
        type: string
        source: system
        description: Reason recorded on DISAPPROVE decisions; null otherwise.
      - name: approval_at
        type: datetime
        source: system
        description: Logical timestamp of the APPROVE decision; null until approved.
      - name: effective_at
        type: datetime
        source: computed
        description: approval_at + 30 days (standard variant) or approval_at + 10 days (expedited variant). See calculations.rule_effectiveness_delay.
  - name: CommentLetter
    parent: RuleProposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> RuleProposal.id; supplied via the nested path /rule-proposals/{id}/comment-letters."
      - name: author_name
        type: string
        source: input
        description: Display name of the commenter.
      - name: body
        type: string
        source: input
        description: Comment text; must be non-empty.
      - name: sentiment
        type: enum
        source: input
        description: Commenter's stated position.
        constraints: "one of {SUPPORT, OPPOSE, NEUTRAL}"
      - name: status
        type: enum
        source: system
        description: Moderation state of the letter.
        default: RECEIVED
        constraints: "one of {RECEIVED, PUBLISHED, DISMISSED}"
      - name: moderation_reason
        type: string
        source: system
        description: Reason recorded when the letter is DISMISSED; null otherwise.
  - name: DisclosureSubmission
    parent: null
    common_fields: true
    fields:
      - name: issuer_org_id
        type: string
        source: input
        description: "FK -> Organization.id; the filing organization. Organization.org_type must be ISSUER or OBLIGATED_PERSON and Organization.status must be ACTIVE. The acting IssuerRep's X-User-ID must equal this value."
      - name: submission_type
        type: enum
        source: input
        description: Kind of disclosure document received by the portal.
        constraints: "one of {OFFICIAL_STATEMENT, ANNUAL_FINANCIAL, EVENT_NOTICE, VOLUNTARY}"
      - name: event_category
        type: enum
        source: input
        description: Event notice category; required iff submission_type == EVENT_NOTICE, forbidden otherwise.
        constraints: "one of {PAYMENT_DEFAULT, RATING_CHANGE, BOND_CALL, MERGER_ANNOUNCEMENT, MATERIAL_LITIGATION, OTHER} or null"
      - name: event_occurred_at
        type: datetime
        source: input
        description: When the reportable event occurred; required iff submission_type == EVENT_NOTICE. Must not be in the future.
      - name: period_start
        type: datetime
        source: input
        description: Coverage period start; required iff submission_type == ANNUAL_FINANCIAL. Must be strictly before period_end.
      - name: period_end
        type: datetime
        source: input
        description: Coverage period end; required iff submission_type == ANNUAL_FINANCIAL. Closed-interval overlap with sibling ANNUAL_FINANCIAL submissions of the same issuer is rejected (see validations).
      - name: document_uri
        type: string
        source: input
        description: Locator of the filed document.
      - name: cusip
        type: string
        source: input
        description: Related issue identifier; 9-character string.
        constraints: "exactly 9 characters"
      - name: status
        type: enum
        source: system
        description: Portal review state of the submission.
        default: RECEIVED
        constraints: "one of {RECEIVED, PUBLISHED, DEFICIENT}"
      - name: timeliness
        type: enum
        source: computed
        description: EVENT_NOTICE timeliness classification per calculations.event_notice_timeliness; NOT_APPLICABLE for other submission types.
        constraints: "one of {TIMELY, LATE, NOT_APPLICABLE}"
      - name: deficiency_reason
        type: string
        source: system
        description: Reason recorded when marked DEFICIENT; null otherwise.

  - name: MunicipalProfessional
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the municipal professional.
      - name: employer_org_id
        type: string
        source: input
        description: "FK -> Organization.id; employing firm. Organization.org_type must be BROKER_DEALER or MUNICIPAL_ADVISOR and Organization.status must be ACTIVE at registration."
      - name: professional_class
        type: enum
        source: input
        description: Registration class; determines the required exam series set (see calculations.exam_pass_result constants REQUIRED_SERIES).
        constraints: "one of {MUNICIPAL_DEALER_REP, MUNICIPAL_ADVISOR_REP, MUNICIPAL_PRINCIPAL}"
      - name: qualification_status
        type: enum
        source: system
        description: Qualification dimension of the professional's state (parallel to standing). Evolves UNQUALIFIED -> QUALIFIED -> CE_DUE -> QUALIFIED | LAPSED; LAPSED -> QUALIFIED by re-passing the required series set.
        default: UNQUALIFIED
        constraints: "one of {UNQUALIFIED, QUALIFIED, CE_DUE, LAPSED}"
      - name: standing
        type: enum
        source: system
        description: Standing dimension of the professional's state (parallel to qualification_status). Toggled ACTIVE <-> SUSPENDED by ComplianceOfficer; evolves independently of qualification_status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: qualified_at
        type: datetime
        source: system
        description: Logical timestamp when qualification_status last entered QUALIFIED; anchors the CE cycle. Null while never qualified.
      - name: ce_cycle_end
        type: datetime
        source: computed
        description: qualified_at + 365 days. Epoch pass transitions QUALIFIED -> CE_DUE when now >= ce_cycle_end.
      - name: ce_grace_end
        type: datetime
        source: computed
        description: ce_cycle_end + 60 days. Epoch pass transitions CE_DUE -> LAPSED when now >= ce_grace_end.
      - name: ce_credits_total
        type: number
        source: computed
        description: Sum of CE credits recorded against the open CE cycle; reset to 0 whenever qualification_status enters QUALIFIED.
        default: 0
      - name: ce_ethics_credits
        type: number
        source: computed
        description: Ethics sub-bucket of ce_credits_total for the open CE cycle; reset alongside ce_credits_total.
        default: 0
      - name: may_transact
        type: boolean
        source: computed
        description: "qualification_status == QUALIFIED AND standing == ACTIVE."
        default: false
  - name: ExamAttempt
    parent: null
    common_fields: false
    fields:
      - name: professional_id
        type: string
        source: input
        description: "FK -> MunicipalProfessional.id; the sitting professional."
      - name: series_code
        type: enum
        source: input
        description: Qualification examination series.
        constraints: "one of {MSRB_50, MSRB_52, MSRB_53, MSRB_54}"
      - name: score
        type: integer
        source: input
        description: Exam score; integer in [0, 100]. PASS iff score >= PASS_SCORES[series_code] (boundary inclusive).
        constraints: "0 <= score <= 100"
      - name: result
        type: enum
        source: computed
        description: PASS or FAIL per calculations.exam_pass_result.
        constraints: "one of {PASS, FAIL}"
  - name: TradeReport
    parent: null
    common_fields: true
    fields:
      - name: dealer_org_id
        type: string
        source: input
        description: "FK -> Organization.id; reporting dealer. Organization.org_type must be BROKER_DEALER and Organization.status must be ACTIVE. The acting DealerRep's X-User-ID must equal this value."
      - name: cusip
        type: string
        source: input
        description: Traded issue identifier; 9-character string.
        constraints: "exactly 9 characters"
      - name: trade_type
        type: enum
        source: input
        description: Counterparty structure of the trade.
        constraints: "one of {INTER_DEALER, CUSTOMER_BUY, CUSTOMER_SELL}"
      - name: par_amount
        type: integer
        source: input
        description: Par (face) amount of the trade in whole dollars; must be > 0.
      - name: price
        type: number
        source: input
        description: Execution price as a percentage of par (e.g. 101.25); must be > 0.
      - name: executed_at
        type: datetime
        source: input
        description: Execution timestamp; must be <= the current logical time (else ERR_TRADE_TIME_INVALID).
      - name: reported_at
        type: datetime
        source: system
        description: Logical time the report was received; equals created_at.
      - name: late_flag
        type: boolean
        source: computed
        description: "true iff (reported_at - executed_at) > 900 seconds; exactly 900 seconds is timely. See calculations.trade_timeliness."
      - name: seconds_late
        type: integer
        source: computed
        description: "max(0, (reported_at - executed_at) in whole seconds - 900)."
      - name: published_par
        type: integer
        source: computed
        description: "min(par_amount, 5000000). Price-transparency banding per calculations.disseminated_par_publication."
      - name: capped_flag
        type: boolean
        source: computed
        description: "true iff par_amount > 5000000 (CAPPED_SIZE variant)."
      - name: status
        type: enum
        source: system
        description: Dissemination lifecycle of the report.
        default: DISSEMINATED
        constraints: "one of {DISSEMINATED, CANCELLED}"

  - name: DataSubscription
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: enum
        source: input
        description: Market data product being licensed. Product fee schedules are constants of calculations.subscription_monthly_fee.
        constraints: "one of {TRADE_REALTIME, TRADE_HISTORICAL, DISCLOSURE_ARCHIVE}"
      - name: licensee_org_id
        type: string
        source: input
        description: "FK -> Organization.id; licensing organization. Organization.status must be ACTIVE at creation and at activation."
      - name: subscriber_principal
        type: string
        source: input
        description: Operator identifier of the subscribing principal. GET /data-feeds/{product_code} requires X-User-ID equal to this value on an ACTIVE subscription for that product.
      - name: license_scope
        type: enum
        source: input
        description: Redistribution scope of the license; drives the scope multiplier.
        constraints: "one of {INTERNAL, DISPLAY, REDISTRIBUTION}"
      - name: seats
        type: integer
        source: input
        description: Licensed seat count; must be >= 1.
      - name: status
        type: enum
        source: system
        description: License lifecycle state. PENDING -> ACTIVE -> TERMINATED; PENDING -> REJECTED only via the compliance-posture cascade (system).
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, TERMINATED, REJECTED}"
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: Monthly license fee per calculations.subscription_monthly_fee (round_half_up to whole cents once, at the end of the formula).
      - name: annual_invoice_cents
        type: integer
        source: computed
        description: "Annual invoice per calculations.subscription_annual_invoice: sum of the 12 individually rounded monthly lines (round-per-line then sum; NOT sum-then-round)."
  - name: EnforcementReferral
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: Rule code cited by the referral. Must match an existing RuleProposal.rule_code (else ERR_RULE_NOT_FOUND) whose status is EFFECTIVE (else ERR_RULE_NOT_EFFECTIVE).
      - name: subject_org_id
        type: string
        source: input
        description: "FK -> Organization.id; organization under referral. Exactly one of subject_org_id / subject_professional_id must be set. When set, Organization.org_type must be BROKER_DEALER or MUNICIPAL_ADVISOR."
      - name: subject_professional_id
        type: string
        source: input
        description: "FK -> MunicipalProfessional.id; professional under referral. Exactly one of subject_org_id / subject_professional_id must be set (else ERR_AMBIGUOUS_SUBJECT)."
      - name: violation_summary
        type: string
        source: input
        description: Free-text summary of the suspected rule violation.
      - name: examining_authority
        type: enum
        source: computed
        description: Examining authority selected per calculations.examining_authority_selection from the subject's type (org type, or employer org type for a professional subject).
        constraints: "one of {DEALER_EXAM_AUTHORITY, ADVISOR_EXAM_AUTHORITY}"
      - name: status
        type: enum
        source: system
        description: Referral lifecycle state. OPEN -> REFERRED -> CLOSED_ACTION_TAKEN | CLOSED_NO_ACTION.
        default: OPEN
        constraints: "one of {OPEN, REFERRED, CLOSED_ACTION_TAKEN, CLOSED_NO_ACTION}"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who opened the referral. Segregation of duties — a close transition requires a different X-User-ID.
      - name: referred_at
        type: datetime
        source: system
        description: Logical timestamp of the OPEN -> REFERRED transition; null until referred.
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who closed the referral; null until closed.
      - name: closure_notes
        type: string
        source: system
        description: Notes recorded at close; null until closed.
      - name: guidance_text
        type: string
        source: system
        description: Published rule-interpretation guidance. Required input on CLOSED_ACTION_TAKEN; this is the system's interpretation-guidance channel.
      - name: needs_rule_review
        type: boolean
        source: system
        description: Set true by the supersession cascade when the cited rule's proposal becomes SUPERSEDED while this referral is OPEN or REFERRED. Stays true until the referral closes.
        default: false
  - name: SolicitationRecord
    parent: null
    common_fields: false
    fields:
      - name: advisor_org_id
        type: string
        source: input
        description: "FK -> Organization.id; soliciting municipal-advisor firm. Organization.org_type must be MUNICIPAL_ADVISOR (fiduciary rules apply to advisors) and Organization.status must be ACTIVE. The acting DealerRep's X-User-ID must equal this value."
      - name: municipal_entity_name
        type: string
        source: input
        description: Name of the municipal entity being solicited.
      - name: compensation_type
        type: enum
        source: input
        description: Compensation structure of the solicitation arrangement.
        constraints: "one of {FIXED, HOURLY, CONTINGENT}"
      - name: compensation_cents
        type: integer
        source: input
        description: Compensation amount in cents; must be >= 0. CONTINGENT compensation above 2500000 cents violates the fiduciary fee cap (ERR_FEE_CAP_EXCEEDED).
      - name: disclosure_provided
        type: boolean
        source: input
        description: Whether the fiduciary compensation disclosure was delivered to the municipal entity. false -> ERR_DISCLOSURE_REQUIRED.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RuleProposal
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_COMMENT
        trigger: "POST /msrb/rule-proposals/{id}/open-comment-period"
        actor: RulemakingOfficer
        preconditions:
          - "comment_period_days in [21, 90] (else ERR_COMMENT_PERIOD_TOO_SHORT)"
        side_effects:
          - "sets comment_window_start = current logical time; comment_window_end = start + comment_period_days days"
          - "stores expedited flag from request (default false)"
          - "increments comment_round by 1 (first open: 1 -> 2 only if previously opened; initial value at create is 0 and first open sets it to 1)"
          - "increments RuleProposal.version by 1"
        note: "comment_round is 0 at create, 1 after the first open, and increments on each subsequent open after a revision cycle."
      - from: OPEN_FOR_COMMENT
        to: PENDING_APPROVAL
        trigger: "POST /msrb/rule-proposals/{id}/submit-for-approval"
        actor: RulemakingOfficer
        preconditions:
          - "now >= comment_window_end (else ERR_COMMENT_PERIOD_STILL_OPEN)"
          - "zero CommentLetters with proposal_id == this proposal AND status == RECEIVED (else ERR_UNRESOLVED_COMMENTS)"
        side_effects:
          - "sets submitted_by_user_id = acting X-User-ID"
          - "increments RuleProposal.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /msrb/rule-proposals/{id}/decide with decision == APPROVE"
        actor: Regulator
        preconditions:
          - "acting X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_user_id = acting X-User-ID; approval_at = current logical time"
          - "computes effective_at per calculations.rule_effectiveness_delay (STANDARD 30 days / EXPEDITED 10 days)"
          - "increments RuleProposal.version by 1"
      - from: PENDING_APPROVAL
        to: DISAPPROVED
        trigger: "POST /msrb/rule-proposals/{id}/decide with decision == DISAPPROVE"
        actor: Regulator
        preconditions:
          - "acting X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_user_id and decision_reason"
          - "increments RuleProposal.version by 1"
      - from: DISAPPROVED
        to: DRAFT
        trigger: "PATCH /msrb/rule-proposals/{id} (any successful revision of a DISAPPROVED proposal reopens it as a draft)"
        actor: RulemakingOfficer
        preconditions:
          - "OCC: expected_rule_proposal_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "applies title/body/category edits; clears decided_by_user_id, decision_reason, submitted_by_user_id"
          - "increments RuleProposal.version by 1"
        note: "This is the revision cycle: DISAPPROVED -> DRAFT -> OPEN_FOR_COMMENT again."
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system epoch pass (POST /_clock/set_current_utc) when now >= effective_at"
        actor: system
        preconditions:
          - "now >= effective_at"
        side_effects:
          - "epoch processes APPROVED proposals ordered by effective_at ASC, then created_at ASC"
          - "if supersedes_proposal_id is set and the referenced proposal has status EFFECTIVE: referenced proposal transitions EFFECTIVE -> SUPERSEDED (cascade link 2)"
          - "every EnforcementReferral citing the superseded proposal's rule_code with status in {OPEN, REFERRED} gets needs_rule_review = true (cascade link 3, caused by the SUPERSEDED transition)"
          - "increments RuleProposal.version by 1 (and the superseded proposal's version by 1)"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system cascade only — fired when a superseding proposal reaches EFFECTIVE"
        actor: system
        preconditions:
          - "a RuleProposal with supersedes_proposal_id == this proposal enters EFFECTIVE"
        side_effects:
          - "flags open referrals citing this proposal's rule_code (see APPROVED -> EFFECTIVE cascade)"
          - "increments RuleProposal.version by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /msrb/rule-proposals/{id}"
        actor: RulemakingOfficer
        preconditions:
          - "OCC: expected_rule_proposal_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "applies title/body/category edits"
          - "increments RuleProposal.version by 1"
        note: "PATCH is legal only in DRAFT and DISAPPROVED; PATCH in any other state -> ERR_INVALID_STATE."
  - entity: CommentLetter
    initial_state: RECEIVED
    terminal_states: [PUBLISHED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: PUBLISHED
        trigger: "POST /msrb/comment-letters/{id}/moderate with action == PUBLISH"
        actor: PortalOperator
        preconditions: []
        side_effects:
          - "increments CommentLetter.version by 1"
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /msrb/comment-letters/{id}/moderate with action == DISMISS"
        actor: PortalOperator
        preconditions:
          - "reason must be provided when action == DISMISS (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets moderation_reason"
          - "increments CommentLetter.version by 1"
  - entity: Organization
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /msrb/organizations/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets suspended_reason from input"
          - "does NOT cascade to professionals or subscriptions; suspension gates future operations (exam attempts, trade reports, disclosure submissions, subscription creation/activation) via ERR_ORG_SUSPENDED"
          - "increments Organization.version by 1"
    posture_transitions:
      - from: CLEAR
        to: WATCH
        trigger: "derived — late_report_count recomputed to >= 5 (on trade create, trade cancel, or epoch pass)"
        actor: system
        side_effects:
          - "every DataSubscription with licensee_org_id == this organization AND status == PENDING transitions to REJECTED"
      - from: WATCH
        to: CLEAR
        trigger: "derived — late_report_count recomputed to < 5"
        actor: system
        side_effects:
          - "no resurrection: subscriptions already REJECTED stay REJECTED"
  - entity: DisclosureSubmission
    initial_state: RECEIVED
    terminal_states: [PUBLISHED, DEFICIENT]
    transitions:
      - from: RECEIVED
        to: PUBLISHED
        trigger: "POST /msrb/disclosure-submissions/{id}/review-outcome with outcome == PUBLISH"
        actor: PortalOperator
        preconditions: []
        side_effects:
          - "increments DisclosureSubmission.version by 1"
      - from: RECEIVED
        to: DEFICIENT
        trigger: "POST /msrb/disclosure-submissions/{id}/review-outcome with outcome == DEFICIENT"
        actor: PortalOperator
        preconditions:
          - "deficiency_reason must be provided when outcome == DEFICIENT (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets deficiency_reason"
          - "increments DisclosureSubmission.version by 1"

  - entity: MunicipalProfessional
    dimension: qualification_status
    initial_state: UNQUALIFIED
    terminal_states: []
    transitions:
      - from: UNQUALIFIED
        to: QUALIFIED
        trigger: "POST /msrb/exam-attempts — automatic when the new PASS completes the REQUIRED_SERIES set for the professional's class"
        actor: system
        preconditions:
          - "all series in REQUIRED_SERIES[professional_class] have at least one PASS attempt by this professional"
        side_effects:
          - "sets qualified_at = current logical time; ce_cycle_end = qualified_at + 365 days; ce_grace_end = ce_cycle_end + 60 days"
          - "resets ce_credits_total = 0 and ce_ethics_credits = 0"
          - "recomputes may_transact"
          - "increments MunicipalProfessional.version by 1"
      - from: QUALIFIED
        to: CE_DUE
        trigger: "system epoch pass (POST /_clock/set_current_utc) when now >= ce_cycle_end"
        actor: system
        preconditions:
          - "now >= ce_cycle_end"
        side_effects:
          - "recomputes may_transact"
          - "increments MunicipalProfessional.version by 1"
      - from: CE_DUE
        to: QUALIFIED
        trigger: "POST /msrb/professionals/{id}/ce-credits — automatic when recorded credits satisfy calculations.ce_cycle_satisfaction"
        actor: system
        preconditions:
          - "ce_credits_total >= 12 AND ce_ethics_credits >= 2 after applying the recorded credits"
        side_effects:
          - "cycle anchors (qualified_at, ce_cycle_end, ce_grace_end) are unchanged; satisfaction cures the current cycle only"
          - "recomputes may_transact"
          - "increments MunicipalProfessional.version by 1"
      - from: CE_DUE
        to: LAPSED
        trigger: "system epoch pass (POST /_clock/set_current_utc) when now >= ce_grace_end"
        actor: system
        preconditions:
          - "now >= ce_grace_end"
        side_effects:
          - "recomputes may_transact"
          - "increments MunicipalProfessional.version by 1"
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /msrb/exam-attempts — automatic when a new PASS re-completes the REQUIRED_SERIES set (attempts recorded before the lapse do not count)"
        actor: system
        preconditions:
          - "after the lapse timestamp, all series in REQUIRED_SERIES[professional_class] have a PASS attempt"
        side_effects:
          - "sets qualified_at = current logical time and derives fresh ce_cycle_end / ce_grace_end"
          - "resets ce_credits_total = 0 and ce_ethics_credits = 0"
          - "recomputes may_transact"
          - "increments MunicipalProfessional.version by 1"
  - entity: MunicipalProfessional
    dimension: standing
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /msrb/professionals/{id}/standing with standing == SUSPENDED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes may_transact (false while SUSPENDED)"
          - "recomputes employer Organization.active_professional_count (-1)"
          - "increments MunicipalProfessional.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /msrb/professionals/{id}/standing with standing == ACTIVE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes may_transact"
          - "recomputes employer Organization.active_professional_count (+1)"
          - "increments MunicipalProfessional.version by 1"
  - entity: TradeReport
    initial_state: DISSEMINATED
    terminal_states: [CANCELLED]
    transitions:
      - from: DISSEMINATED
        to: CANCELLED
        trigger: "POST /msrb/trade-reports/{id}/cancel"
        actor: DealerRep
        preconditions:
          - "acting DealerRep's X-User-ID == trade.dealer_org_id (ownership; else ERR_UNAUTHORIZED)"
        side_effects:
          - "Organization.published_par_total -= published_par (compensates the publication)"
          - "recomputes Organization.late_report_count over the trailing 30-day window (a cancelled late trade leaves the window tally)"
          - "recomputes Organization.compliance_posture (may transition WATCH -> CLEAR; never resurrects REJECTED subscriptions)"
          - "increments TradeReport.version by 1"
  - entity: DataSubscription
    initial_state: PENDING
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /msrb/data-subscriptions/{id}/transition with to_state == ACTIVE"
        actor: LicensingOfficer
        preconditions:
          - "licensee Organization.status == ACTIVE (else ERR_ORG_SUSPENDED)"
        side_effects:
          - "increments DataSubscription.version by 1"
      - from: PENDING
        to: TERMINATED
        trigger: "POST /msrb/data-subscriptions/{id}/transition with to_state == TERMINATED"
        actor: LicensingOfficer
        preconditions: []
        side_effects:
          - "increments DataSubscription.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /msrb/data-subscriptions/{id}/transition with to_state == TERMINATED"
        actor: LicensingOfficer
        preconditions: []
        side_effects:
          - "increments DataSubscription.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "system cascade only — fired when the licensee Organization's compliance_posture transitions CLEAR -> WATCH"
        actor: system
        preconditions:
          - "licensee Organization.compliance_posture transitions CLEAR -> WATCH"
        side_effects:
          - "increments DataSubscription.version by 1"
        note: "REJECTED is terminal and never resurrects, even if posture later returns to CLEAR."
  - entity: EnforcementReferral
    initial_state: OPEN
    terminal_states: [CLOSED_ACTION_TAKEN, CLOSED_NO_ACTION]
    transitions:
      - from: OPEN
        to: REFERRED
        trigger: "POST /msrb/enforcement-referrals/{id}/advance with to_state == REFERRED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets referred_at = current logical time"
          - "increments EnforcementReferral.version by 1"
      - from: REFERRED
        to: CLOSED_ACTION_TAKEN
        trigger: "POST /msrb/enforcement-referrals/{id}/advance with to_state == CLOSED_ACTION_TAKEN"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != created_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "guidance_text must be provided and non-empty (else ERR_INVALID_REQUEST); it becomes the published rule-interpretation guidance"
        side_effects:
          - "sets closed_by_user_id, closure_notes, guidance_text"
          - "increments EnforcementReferral.version by 1"
      - from: REFERRED
        to: CLOSED_NO_ACTION
        trigger: "POST /msrb/enforcement-referrals/{id}/advance with to_state == CLOSED_NO_ACTION"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != created_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets closed_by_user_id, closure_notes"
          - "increments EnforcementReferral.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: proposal-draft-edit-stale-version
    parent_entity: RuleProposal
    write_endpoint: "PATCH /msrb/rule-proposals/{id}"
    occ_field: expected_rule_proposal_version
    description: |
      Revising a RuleProposal (in DRAFT, or revising a DISAPPROVED proposal back
      to DRAFT) requires the client to present the version it last observed via
      expected_rule_proposal_version. If the proposal's version has advanced
      beyond the presented value — for example because another edit, an
      open-comment-period, or a decide transition has since landed — the write
      is rejected as stale. Editing a draft twice is otherwise legitimate
      product behavior, so this is resolved by OCC on RuleProposal.version,
      not by a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rule_effectiveness_delay
    trigger: "RuleProposal PENDING_APPROVAL -> APPROVED (decide with decision == APPROVE)"
    algorithm: threshold
    formula: |
      effective_at = approval_at + DELAY_DAYS
      where DELAY_DAYS = EXPEDITED_DELAY_DAYS if proposal.expedited == true
                         else STANDARD_DELAY_DAYS
    input_set: "The single RuleProposal being approved."
    constants:
      STANDARD_DELAY_DAYS: 30
      EXPEDITED_DELAY_DAYS: 10
    precision: "datetime, exact day arithmetic on ISO8601 UTC"
    variants:
      - name: STANDARD
        when: "proposal.expedited == false"
        difference: "effective_at = approval_at + 30 days"
      - name: EXPEDITED
        when: "proposal.expedited == true"
        difference: "effective_at = approval_at + 10 days; for identical approval_at the two variants yield effective dates 20 days apart"
  - name: disseminated_par_publication
    trigger: "TradeReport creation (before the record is persisted)"
    algorithm: threshold
    formula: |
      published_par = min(par_amount, LARGE_TRADE_PAR_CAP)
      capped_flag   = par_amount > LARGE_TRADE_PAR_CAP
    input_set: "The single TradeReport being created."
    constants:
      LARGE_TRADE_PAR_CAP: 5000000
    precision: "integer dollars, no rounding"
    variants:
      - name: ACTUAL_SIZE
        when: "par_amount <= LARGE_TRADE_PAR_CAP"
        difference: "published_par == par_amount; capped_flag == false"
      - name: CAPPED_SIZE
        when: "par_amount > LARGE_TRADE_PAR_CAP"
        difference: "published_par == 5000000; capped_flag == true — public transparency banding suppresses the true size"
  - name: subscription_monthly_fee
    trigger: "DataSubscription creation"
    algorithm: tiered_pricing
    formula: |
      billable_seats   = max(seats - INCLUDED_SEATS[product_code], 0)
      unrounded_cents  = (BASE_CENTS[product_code] + billable_seats * PER_SEAT_CENTS[product_code])
                         * SCOPE_MULTIPLIER[license_scope]
                         * ORG_TYPE_DISCOUNT[Organization.org_type of licensee_org_id]
      monthly_fee_cents = round_half_up(unrounded_cents)   # exactly one rounding, at the end
    input_set: "The DataSubscription being created plus its licensee Organization (for org_type)."
    constants:
      BASE_CENTS: {TRADE_REALTIME: 250000, TRADE_HISTORICAL: 99999, DISCLOSURE_ARCHIVE: 150000}
      PER_SEAT_CENTS: {TRADE_REALTIME: 5000, TRADE_HISTORICAL: 2500, DISCLOSURE_ARCHIVE: 1000}
      INCLUDED_SEATS: {TRADE_REALTIME: 5, TRADE_HISTORICAL: 10, DISCLOSURE_ARCHIVE: 20}
      SCOPE_MULTIPLIER: {INTERNAL: 1.0, DISPLAY: 1.5, REDISTRIBUTION: 2.25}
      ORG_TYPE_DISCOUNT: {ISSUER: 1.0, OBLIGATED_PERSON: 1.0, BROKER_DEALER: 1.0, MUNICIPAL_ADVISOR: 0.9}
    precision: "integer cents, round_half_up applied once at the end of the formula"
  - name: subscription_annual_invoice
    trigger: "DataSubscription read (monthly_fee_cents is stored at creation; annual_invoice_cents derives from it)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each monthly line to whole cents first, then sum.
      # The monthly line is identical each month, so:
      annual_invoice_cents = 12 * round_half_up(monthly_unrounded_cents)
                           = 12 * monthly_fee_cents
      # NOT round_half_up(12 * monthly_unrounded_cents) — that order is forbidden
      # and diverges whenever monthly_unrounded_cents has a fractional cent.
    input_set: "The single DataSubscription."
    constants:
      MONTHS_PER_YEAR: 12
    precision: "integer cents; per-line round_half_up before summation"
  - name: exam_pass_result
    trigger: "ExamAttempt creation"
    algorithm: threshold
    formula: |
      result = PASS if score >= PASS_SCORES[series_code] else FAIL
      # Boundary is inclusive: score == PASS_SCORES[series_code] is a PASS.
      # Qualification: a professional enters QUALIFIED when every series in
      # REQUIRED_SERIES[professional_class] has >= 1 PASS (attempts after any
      # lapse only, when re-qualifying from LAPSED).
      # Retake exclusion window: an attempt on (professional, series) is rejected
      # with ERR_RETAKE_WINDOW_ACTIVE iff a prior attempt on the same pair has
      # created_at > now - RETAKE_WINDOW_DAYS days (half-open: exactly 30 days old is allowed).
    input_set: "The ExamAttempt being created; for qualification, all PASS attempts of the professional."
    constants:
      PASS_SCORES: {MSRB_50: 70, MSRB_52: 72, MSRB_53: 75, MSRB_54: 80}
      REQUIRED_SERIES: {MUNICIPAL_ADVISOR_REP: [MSRB_50], MUNICIPAL_DEALER_REP: [MSRB_52], MUNICIPAL_PRINCIPAL: [MSRB_53, MSRB_54]}
      RETAKE_WINDOW_DAYS: 30
    precision: "integer score points"
  - name: trade_timeliness
    trigger: "TradeReport creation"
    algorithm: threshold
    formula: |
      delta_seconds = (reported_at - executed_at) in whole seconds
      late_flag     = delta_seconds > REPORT_LIMIT_SECONDS   # exactly 900 s is TIMELY (strict >)
      seconds_late  = max(0, delta_seconds - REPORT_LIMIT_SECONDS)
      # executed_at > reported_at (== current logical time) is rejected with
      # ERR_TRADE_TIME_INVALID before this calculation runs.
    input_set: "The single TradeReport being created."
    constants:
      REPORT_LIMIT_SECONDS: 900
    precision: "whole seconds"
  - name: event_notice_timeliness
    trigger: "DisclosureSubmission creation when submission_type == EVENT_NOTICE"
    algorithm: threshold
    formula: |
      elapsed_days = (UTC calendar date of created_at) - (UTC calendar date of event_occurred_at), in whole days
      timeliness   = TIMELY if elapsed_days <= EVENT_NOTICE_LIMIT_DAYS else LATE
      # Boundary is inclusive: filing on exactly day 10 is TIMELY.
      # Non-EVENT_NOTICE submissions get timeliness = NOT_APPLICABLE.
    input_set: "The single DisclosureSubmission being created."
    constants:
      EVENT_NOTICE_LIMIT_DAYS: 10
    precision: "whole calendar days (UTC dates)"
  - name: late_report_tally_and_posture
    trigger: "TradeReport creation, TradeReport cancel, and every epoch pass"
    algorithm: aggregation
    formula: |
      window = (now - LATE_TRADE_WINDOW_DAYS days, now]   # half-open: a trade exactly 30 days old is EXCLUDED
      Organization.late_report_count =
        count of TradeReport where dealer_org_id == Organization.id
          AND late_flag == true
          AND status == DISSEMINATED
          AND reported_at in window
      Organization.compliance_posture =
        WATCH if late_report_count >= LATE_WATCH_THRESHOLD else CLEAR
      # On every recompute, if posture transitions CLEAR -> WATCH, reject all
      # PENDING DataSubscriptions of this licensee (see DataSubscription machine).
    input_set: "All TradeReports of one Organization."
    constants:
      LATE_TRADE_WINDOW_DAYS: 30
      LATE_WATCH_THRESHOLD: 5
    precision: "integer count; boundary >= is inclusive (the 5th late trade triggers WATCH)"
  - name: ce_cycle_satisfaction
    trigger: "POST /msrb/professionals/{id}/ce-credits and epoch pass"
    algorithm: threshold
    formula: |
      anchors: ce_cycle_end = qualified_at + CE_CYCLE_DAYS days
               ce_grace_end = ce_cycle_end + CE_GRACE_DAYS days
      epoch: QUALIFIED -> CE_DUE when now >= ce_cycle_end
      epoch: CE_DUE -> LAPSED when now >= ce_grace_end
      cure (while CE_DUE): ce_credits_total >= CE_TOTAL_REQUIRED
                           AND ce_ethics_credits >= CE_ETHICS_REQUIRED
                           -> QUALIFIED (anchors unchanged)
      # Sub-bucket rule: total alone is insufficient — ethics minimum binds independently.
    input_set: "The single MunicipalProfessional and its recorded CE credits for the open cycle."
    constants:
      CE_CYCLE_DAYS: 365
      CE_GRACE_DAYS: 60
      CE_TOTAL_REQUIRED: 12
      CE_ETHICS_REQUIRED: 2
    precision: "credits as decimal numbers; thresholds inclusive (>=)"
  - name: examining_authority_selection
    trigger: "EnforcementReferral creation"
    algorithm: constraint_propagation
    formula: |
      # Deterministic mapping — no ranking, no ties possible.
      if subject_org_id is set:
          org_type = Organization[subject_org_id].org_type
      else:
          org_type = Organization[MunicipalProfessional[subject_professional_id].employer_org_id].org_type
      examining_authority =
          DEALER_EXAM_AUTHORITY   if org_type == BROKER_DEALER
          ADVISOR_EXAM_AUTHORITY  if org_type == MUNICIPAL_ADVISOR
      # org_type ISSUER / OBLIGATED_PERSON as referral subject is rejected at
      # validation with ERR_ORG_TYPE_NOT_PERMITTED, so the mapping is total.
    input_set: "The EnforcementReferral being created plus the referenced subject."
    constants: {}
    precision: "exact enum mapping"
  - name: epoch_pass_ordering
    trigger: "POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      On every clock set, the system epoch pass runs in this pinned order:
        1. Effectuate APPROVED RuleProposals with effective_at <= now,
           ordered by effective_at ASC, then created_at ASC;
           each effectuation runs the supersession cascade (target EFFECTIVE ->
           SUPERSEDED; open referrals citing the target's rule_code flagged
           needs_rule_review = true).
        2. MunicipalProfessional CE transitions (QUALIFIED -> CE_DUE when
           now >= ce_cycle_end; CE_DUE -> LAPSED when now >= ce_grace_end),
           ordered by ce_cycle_end ASC, then created_at ASC.
        3. Per-Organization late_report_count + compliance_posture recompute
           (calculations.late_report_tally_and_posture), applying the
           CLEAR -> WATCH subscription rejection cascade; organizations ordered
           by created_at ASC.
      to_iso8601 must be >= current logical time; a backwards move is rejected
      with ERR_CLOCK_REGRESSION.
    input_set: "All APPROVED RuleProposals, all MunicipalProfessionals, all Organizations."
    constants:
      DEFAULT_CLOCK_START: "2026-09-01T00:00:00Z"
    precision: "datetimes compared exactly; ties broken by created_at ASC (never by id)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — first failing check wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles. For entity-backed roles, ownership: IssuerRep X-User-ID must equal the issuer_org_id being acted on; DealerRep X-User-ID must equal the dealer_org_id / advisor_org_id being acted on (for cancel, the trade's dealer_org_id). Scoped lists: IssuerRep sees only own-org submissions; PublicReader sees only PUBLISHED submissions / DISSEMINATED trades; a scoped single-GET miss is reported as not-found."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum values valid, unknown fields ignored, cusip exactly 9 characters, par_amount > 0, price > 0, seats >= 1, score in [0,100], compensation_cents >= 0, action/decision/outcome/to_state/standing values inside their input enums, EVENT_NOTICE carries event_category + event_occurred_at (ERR_EVENT_CATEGORY_REQUIRED when category missing), ANNUAL_FINANCIAL carries period_start < period_end, event_occurred_at not in the future, to_state == REJECTED is not accepted on the subscription transition endpoint"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 3.1
    category: business_constraint
    check: "submission_type == EVENT_NOTICE but event_category is absent"
    error_id: ERR_EVENT_CATEGORY_REQUIRED
    http_status: 422
    applies_to: "POST /msrb/disclosure-submissions"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right (organization, proposal, comment letter, submission, professional, trade, subscription, referral, product feed path param). A scoped resource outside the caller's ownership/visibility scope reports not-found."
    error_id: ERR_ORG_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with {id} path params (each uses its own *_NOT_FOUND id: ERR_ORG_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_COMMENT_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_PROFESSIONAL_NOT_FOUND, ERR_TRADE_NOT_FOUND, ERR_SUBSCRIPTION_NOT_FOUND, ERR_REFERRAL_NOT_FOUND)"
  - priority: 5
    category: existence
    check: "Body-referenced entities exist: employer_org_id, issuer_org_id, dealer_org_id, advisor_org_id, licensee_org_id, professional_id, subject_org_id, subject_professional_id, supersedes_proposal_id; rule_code must match an existing RuleProposal.rule_code (ERR_RULE_NOT_FOUND)"
    error_id: ERR_ORG_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints carrying FK fields"
  - priority: 6
    category: auth
    check: "Segregation of duties: Regulator deciding a proposal must not be the officer who submitted it (X-User-ID != submitted_by_user_id); ComplianceOfficer closing a referral must not be the officer who created it (X-User-ID != created_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /msrb/rule-proposals/{id}/decide; POST /msrb/enforcement-referrals/{id}/advance (close transitions only)"
  - priority: 7
    category: state
    check: "Generic state precondition of the endpoint's state machine (e.g. decide on a non-PENDING_APPROVAL proposal, moderate a terminal letter, cancel a CANCELLED trade, transition a TERMINATED/REJECTED subscription, PATCH a non-DRAFT/non-DISAPPROVED proposal, ce-credits while UNQUALIFIED/LAPSED, advance a CLOSED referral)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
  - priority: 8
    category: state
    check: "Comment letter creation requires the proposal's status == OPEN_FOR_COMMENT (fires regardless of whether the window has also ended)"
    error_id: ERR_PROPOSAL_NOT_OPEN_FOR_COMMENT
    http_status: 409
    applies_to: "POST /msrb/rule-proposals/{id}/comment-letters"
  - priority: 9
    category: state
    check: "submit-for-approval requires zero CommentLetters with status == RECEIVED on the proposal"
    error_id: ERR_UNRESOLVED_COMMENTS
    http_status: 409
    applies_to: "POST /msrb/rule-proposals/{id}/submit-for-approval"
  - priority: 10
    category: state
    check: "Organization-dependent operations require the referenced organization status == ACTIVE: disclosure submission create (issuer), trade report create (dealer), solicitation create (advisor), exam attempt create (professional's employer), subscription create + activation (licensee)"
    error_id: ERR_ORG_SUSPENDED
    http_status: 409
    applies_to: "POST /msrb/disclosure-submissions; POST /msrb/trade-reports; POST /msrb/solicitation-records; POST /msrb/exam-attempts; POST /msrb/data-subscriptions; POST /msrb/data-subscriptions/{id}/transition (to_state == ACTIVE)"
  - priority: 11
    category: state
    check: "Exam attempt requires the professional's standing == ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /msrb/exam-attempts"
  - priority: 12
    category: business_safety
    check: "Fiduciary disclosure: solicitation record with disclosure_provided == false is rejected"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: "POST /msrb/solicitation-records"
  - priority: 13
    category: business_temporal
    check: "Comment letter creation requires now < comment_window_end (half-open window; at exactly the end instant the window is closed)"
    error_id: ERR_COMMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /msrb/rule-proposals/{id}/comment-letters"
  - priority: 14
    category: business_temporal
    check: "open-comment-period requires comment_period_days within [21, 90]"
    error_id: ERR_COMMENT_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /msrb/rule-proposals/{id}/open-comment-period"
  - priority: 15
    category: business_temporal
    check: "submit-for-approval requires now >= comment_window_end"
    error_id: ERR_COMMENT_PERIOD_STILL_OPEN
    http_status: 422
    applies_to: "POST /msrb/rule-proposals/{id}/submit-for-approval"
  - priority: 16
    category: business_temporal
    check: "Exam retake exclusion: an attempt on (professional_id, series_code) is rejected while a prior attempt on the same pair has created_at > now - 30 days (half-open window; exactly 30 days old is allowed)"
    error_id: ERR_RETAKE_WINDOW_ACTIVE
    http_status: 422
    applies_to: "POST /msrb/exam-attempts"
  - priority: 17
    category: business_temporal
    check: "Trade report executed_at must be <= current logical time"
    error_id: ERR_TRADE_TIME_INVALID
    http_status: 422
    applies_to: "POST /msrb/trade-reports"
  - priority: 18
    category: business_temporal
    check: "Clock set requires to_iso8601 >= current logical time (monotonic logical clock)"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 19
    category: business_referential
    check: "Type-gated FKs: disclosure issuer must be ISSUER or OBLIGATED_PERSON; professional employer must be BROKER_DEALER or MUNICIPAL_ADVISOR; trade dealer must be BROKER_DEALER; solicitation advisor must be MUNICIPAL_ADVISOR; referral subject org must be BROKER_DEALER or MUNICIPAL_ADVISOR"
    error_id: ERR_ORG_TYPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /msrb/disclosure-submissions; POST /msrb/professionals; POST /msrb/trade-reports; POST /msrb/solicitation-records; POST /msrb/enforcement-referrals"
  - priority: 20
    category: business_referential
    check: "EnforcementReferral must set exactly one of subject_org_id / subject_professional_id (both or neither is rejected)"
    error_id: ERR_AMBIGUOUS_SUBJECT
    http_status: 422
    applies_to: "POST /msrb/enforcement-referrals"
  - priority: 21
    category: business_referential
    check: "Referral rule_code must resolve to a RuleProposal whose status == EFFECTIVE"
    error_id: ERR_RULE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /msrb/enforcement-referrals"
  - priority: 22
    category: business_constraint
    check: "Annual coverage overlap: a new ANNUAL_FINANCIAL submission's closed interval [period_start, period_end] must not intersect any sibling ANNUAL_FINANCIAL submission of the same issuer with status in {RECEIVED, PUBLISHED}. Overlap iff NOT (new.period_end < existing.period_start OR new.period_start > existing.period_end) — sharing a single day IS an overlap; perfect adjacency (new start = existing end + 1 day) is allowed"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /msrb/disclosure-submissions"
  - priority: 23
    category: business_fiscal
    check: "Fiduciary fee cap: CONTINGENT solicitation compensation must be <= 2500000 cents"
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /msrb/solicitation-records"
  - priority: 24
    category: business_fiscal
    check: "Data feed access: an ACTIVE DataSubscription exists for the path's product_code whose subscriber_principal == X-User-ID"
    error_id: ERR_PRODUCT_NOT_LICENSED
    http_status: 403
    applies_to: "GET /msrb/data-feeds/{product_code}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /msrb/organizations
    description: Register a regulated organization (issuer, obligated person, broker-dealer, or municipal advisor).
    roles: [PortalOperator]
    code: 201
    input: [org_code, name, org_type]
    output: Organization
    side_effects: ["initializes status ACTIVE, compliance_posture CLEAR, all derived counters to 0"]
  - method: GET
    path: /msrb/organizations/{id}
    description: Read one organization including derived fields (late_report_count, compliance_posture, published_par_total, active_professional_count).
    roles: [PortalOperator, ComplianceOfficer, ExamAdmin, LicensingOfficer]
    code: 200
    input: []
    output: Organization
    side_effects: []
  - method: POST
    path: /msrb/organizations/{id}/suspend
    description: Suspend an organization. Gates future disclosures, trades, solicitations, exam attempts, and subscription creation/activation for that organization. Does not cascade to professionals or subscriptions.
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Organization
    side_effects: ["Organization ACTIVE -> SUSPENDED; sets suspended_reason; increments Organization.version by 1"]
  - method: POST
    path: /msrb/rule-proposals
    description: Create a rule proposal in DRAFT. Optionally declares supersedes_proposal_id (when this proposal reaches EFFECTIVE, the target is superseded).
    roles: [RulemakingOfficer]
    code: 201
    input: [rule_code, title, body, category, "supersedes_proposal_id?"]
    output: RuleProposal
    side_effects: ["initializes status DRAFT, comment_round 0"]
  - method: GET
    path: /msrb/rule-proposals
    description: List rule proposals with optional filters.
    roles: [RulemakingOfficer, Regulator, PortalOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "category?", "supersedes_proposal_id?", "limit?", "offset?"]
    output: RuleProposal[]
    side_effects: []
  - method: GET
    path: /msrb/rule-proposals/{id}
    description: Read one rule proposal.
    roles: [RulemakingOfficer, Regulator, PortalOperator, ComplianceOfficer]
    code: 200
    input: []
    output: RuleProposal
    side_effects: []
  - method: PATCH
    path: /msrb/rule-proposals/{id}
    description: Edit a proposal. Legal only in DRAFT (stays DRAFT) or DISAPPROVED (reopens as DRAFT — the revision cycle). OCC-guarded by expected_rule_proposal_version.
    roles: [RulemakingOfficer]
    code: 200
    input: ["title?", "body?", "category?", expected_rule_proposal_version]
    output: RuleProposal
    side_effects: ["increments RuleProposal.version by 1", "DISAPPROVED -> DRAFT clears submitted_by_user_id, decided_by_user_id, decision_reason"]
  - method: POST
    path: /msrb/rule-proposals/{id}/open-comment-period
    description: Open a public comment window of comment_period_days days (21..90). Sets the half-open window [start, end) and the expedited flag.
    roles: [RulemakingOfficer]
    code: 200
    input: [comment_period_days, "expedited?"]
    output: RuleProposal
    side_effects: ["DRAFT -> OPEN_FOR_COMMENT; sets comment_window_start/end, comment_period_days, expedited; comment_round += 1; increments RuleProposal.version by 1"]
  - method: POST
    path: /msrb/rule-proposals/{id}/submit-for-approval
    description: Submit a proposal for regulatory approval. Requires the comment window to have ended and zero unmoderated (RECEIVED) comment letters.
    roles: [RulemakingOfficer]
    code: 200
    input: []
    output: RuleProposal
    side_effects: ["OPEN_FOR_COMMENT -> PENDING_APPROVAL; sets submitted_by_user_id; increments RuleProposal.version by 1"]
  - method: POST
    path: /msrb/rule-proposals/{id}/decide
    description: Regulatory decision on a submitted proposal. APPROVE computes effective_at per the effectiveness-delay variant; DISAPPROVE records the reason. Segregation of duties vs the submitter.
    roles: [Regulator]
    code: 200
    input: [decision, "reason?"]
    output: RuleProposal
    side_effects: ["PENDING_APPROVAL -> APPROVED | DISAPPROVED; on APPROVE sets approval_at and computes effective_at; increments RuleProposal.version by 1"]
  - method: POST
    path: /msrb/rule-proposals/{id}/comment-letters
    description: Submit a public comment letter. Requires status OPEN_FOR_COMMENT and now < comment_window_end.
    roles: [PublicReader]
    code: 201
    input: [author_name, body, sentiment]
    output: CommentLetter
    side_effects: ["creates CommentLetter in RECEIVED"]
  - method: GET
    path: /msrb/rule-proposals/{id}/comment-letters
    description: List comment letters of a proposal (moderation work queue).
    roles: [RulemakingOfficer, Regulator, PortalOperator, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommentLetter[]
    side_effects: []
  - method: POST
    path: /msrb/comment-letters/{id}/moderate
    description: Moderate a comment letter — PUBLISH or DISMISS (DISMISS requires reason).
    roles: [PortalOperator]
    code: 200
    input: [action, "reason?"]
    output: CommentLetter
    side_effects: ["RECEIVED -> PUBLISHED | DISMISSED; increments CommentLetter.version by 1"]
  - method: POST
    path: /msrb/disclosure-submissions
    description: File a disclosure (official statement, annual financial, event notice, or voluntary) for the caller's own issuer/obligated-person organization. Computes EVENT_NOTICE timeliness and enforces annual coverage overlap.
    roles: [IssuerRep]
    code: 201
    input: [issuer_org_id, submission_type, document_uri, cusip, "event_category?", "event_occurred_at?", "period_start?", "period_end?"]
    output: DisclosureSubmission
    side_effects: ["creates DisclosureSubmission in RECEIVED with computed timeliness"]
  - method: GET
    path: /msrb/disclosure-submissions
    description: "List disclosure submissions. Scoping: IssuerRep sees only own-org submissions; PublicReader sees only status == PUBLISHED (free public access); PortalOperator and ComplianceOfficer see all."
    roles: [PortalOperator, IssuerRep, PublicReader, ComplianceOfficer]
    code: 200
    input: ["issuer_org_id?", "status?", "submission_type?", "limit?", "offset?"]
    output: DisclosureSubmission[]
    side_effects: []
  - method: GET
    path: /msrb/disclosure-submissions/{id}
    description: "Read one disclosure submission. Same scoping as the list: out-of-scope reads report not-found."
    roles: [PortalOperator, IssuerRep, PublicReader, ComplianceOfficer]
    code: 200
    input: []
    output: DisclosureSubmission
    side_effects: []
  - method: POST
    path: /msrb/disclosure-submissions/{id}/review-outcome
    description: Portal review decision — PUBLISH or mark DEFICIENT (requires deficiency_reason).
    roles: [PortalOperator]
    code: 200
    input: [outcome, "deficiency_reason?"]
    output: DisclosureSubmission
    side_effects: ["RECEIVED -> PUBLISHED | DEFICIENT; increments DisclosureSubmission.version by 1"]

  - method: POST
    path: /msrb/professionals
    description: Register a municipal professional under an ACTIVE broker-dealer or municipal-advisor organization. Initializes UNQUALIFIED x ACTIVE.
    roles: [ExamAdmin]
    code: 201
    input: [full_name, employer_org_id, professional_class]
    output: MunicipalProfessional
    side_effects: ["employer Organization.active_professional_count += 1"]
  - method: GET
    path: /msrb/professionals
    description: List municipal professionals with optional filters.
    roles: [ExamAdmin, ComplianceOfficer]
    code: 200
    input: ["employer_org_id?", "qualification_status?", "limit?", "offset?"]
    output: MunicipalProfessional[]
    side_effects: []
  - method: GET
    path: /msrb/professionals/{id}
    description: Read one professional including qualification_status, standing, CE cycle anchors, CE credit buckets, and may_transact.
    roles: [ExamAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: MunicipalProfessional
    side_effects: []
  - method: POST
    path: /msrb/professionals/{id}/standing
    description: Set the standing dimension (ACTIVE or SUSPENDED). Independent of the qualification dimension.
    roles: [ComplianceOfficer]
    code: 200
    input: [standing, "reason?"]
    output: MunicipalProfessional
    side_effects: ["standing transition; recomputes may_transact; employer Organization.active_professional_count adjusted by +/-1; increments MunicipalProfessional.version by 1"]
  - method: POST
    path: /msrb/professionals/{id}/ce-credits
    description: Record continuing-education credits into the open CE cycle. Legal only while QUALIFIED or CE_DUE; satisfying 12 total + 2 ethics while CE_DUE cures back to QUALIFIED.
    roles: [ExamAdmin]
    code: 200
    input: [credits_total, ethics_credits]
    output: MunicipalProfessional
    side_effects: ["ce_credits_total += credits_total; ce_ethics_credits += ethics_credits; CE_DUE -> QUALIFIED when both thresholds satisfied; increments MunicipalProfessional.version by 1"]
  - method: POST
    path: /msrb/exam-attempts
    description: "Record a qualification exam attempt. Gates: employer org ACTIVE, professional standing ACTIVE, 30-day retake window per (professional, series), score in [0,100]. PASS on the required series set drives UNQUALIFIED/LAPSED -> QUALIFIED."
    roles: [ExamAdmin]
    code: 201
    input: [professional_id, series_code, score]
    output: ExamAttempt
    side_effects: ["computes result; on set completion transitions qualification_status to QUALIFIED with fresh CE anchors (see MunicipalProfessional machine)"]
  - method: GET
    path: /msrb/professionals/{id}/exam-attempts
    description: List a professional's exam attempts (append-only event log).
    roles: [ExamAdmin, ComplianceOfficer]
    code: 200
    input: ["series_code?", "limit?", "offset?"]
    output: ExamAttempt[]
    side_effects: []
  - method: POST
    path: /msrb/trade-reports
    description: Report a municipal securities trade for the caller's own ACTIVE broker-dealer. Computes timeliness (900-second limit) and dissemination banding (5,000,000 par cap), disseminates immediately, and rolls into the dealer's late-report tally/posture.
    roles: [DealerRep]
    code: 201
    input: [dealer_org_id, cusip, trade_type, par_amount, price, executed_at]
    output: TradeReport
    side_effects: ["creates TradeReport in DISSEMINATED with computed late_flag, seconds_late, published_par, capped_flag", "Organization.published_par_total += published_par", "recomputes Organization.late_report_count and compliance_posture; on CLEAR -> WATCH rejects the dealer's PENDING DataSubscriptions"]
  - method: GET
    path: /msrb/trade-reports
    description: "List trade reports. Scoping: DealerRep sees only own-org trades; PublicReader sees only status == DISSEMINATED (free public access); PortalOperator and ComplianceOfficer see all."
    roles: [DealerRep, PortalOperator, PublicReader, ComplianceOfficer]
    code: 200
    input: ["dealer_org_id?", "status?", "cusip?", "limit?", "offset?"]
    output: TradeReport[]
    side_effects: []
  - method: GET
    path: /msrb/trade-reports/{id}
    description: "Read one trade report. Same scoping as the list: out-of-scope reads report not-found."
    roles: [DealerRep, PortalOperator, PublicReader, ComplianceOfficer]
    code: 200
    input: []
    output: TradeReport
    side_effects: []
  - method: POST
    path: /msrb/trade-reports/{id}/cancel
    description: Cancel a disseminated trade (ownership-gated). Compensates published_par_total and the late tally.
    roles: [DealerRep]
    code: 200
    input: []
    output: TradeReport
    side_effects: ["DISSEMINATED -> CANCELLED; Organization.published_par_total -= published_par; recomputes late_report_count and compliance_posture; increments TradeReport.version by 1"]
  - method: POST
    path: /msrb/data-subscriptions
    description: Create a market-data license in PENDING with computed monthly and annual fees. Licensee organization must be ACTIVE.
    roles: [LicensingOfficer]
    code: 201
    input: [product_code, licensee_org_id, subscriber_principal, license_scope, seats]
    output: DataSubscription
    side_effects: ["computes monthly_fee_cents (subscription_monthly_fee) and annual_invoice_cents (subscription_annual_invoice)"]
  - method: GET
    path: /msrb/data-subscriptions
    description: List data subscriptions with optional filters.
    roles: [LicensingOfficer, ComplianceOfficer]
    code: 200
    input: ["licensee_org_id?", "product_code?", "status?", "limit?", "offset?"]
    output: DataSubscription[]
    side_effects: []
  - method: GET
    path: /msrb/data-subscriptions/{id}
    description: Read one data subscription.
    roles: [LicensingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: DataSubscription
    side_effects: []
  - method: POST
    path: /msrb/data-subscriptions/{id}/transition
    description: "Advance a subscription: to_state ACTIVE (PENDING only, licensee org must be ACTIVE) or TERMINATED (from PENDING or ACTIVE). to_state REJECTED is not accepted (system-only cascade target)."
    roles: [LicensingOfficer]
    code: 200
    input: [to_state]
    output: DataSubscription
    side_effects: ["PENDING -> ACTIVE | TERMINATED; ACTIVE -> TERMINATED; increments DataSubscription.version by 1"]
  - method: POST
    path: /msrb/enforcement-referrals
    description: Open an enforcement referral citing an EFFECTIVE rule by rule_code, against exactly one subject (organization or professional). Computes the examining authority from the subject's type.
    roles: [ComplianceOfficer]
    code: 201
    input: [rule_code, violation_summary, "subject_org_id?", "subject_professional_id?"]
    output: EnforcementReferral
    side_effects: ["creates EnforcementReferral in OPEN with computed examining_authority; sets created_by_user_id"]
  - method: GET
    path: /msrb/enforcement-referrals
    description: List enforcement referrals with optional filters.
    roles: [ComplianceOfficer, Regulator]
    code: 200
    input: ["subject_org_id?", "subject_professional_id?", "status?", "limit?", "offset?"]
    output: EnforcementReferral[]
    side_effects: []
  - method: GET
    path: /msrb/enforcement-referrals/{id}
    description: Read one enforcement referral (including needs_rule_review and published guidance_text).
    roles: [ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: EnforcementReferral
    side_effects: []
  - method: POST
    path: /msrb/enforcement-referrals/{id}/advance
    description: "Advance a referral: OPEN -> REFERRED, or REFERRED -> CLOSED_ACTION_TAKEN (requires guidance_text — the published interpretation) / CLOSED_NO_ACTION. Close transitions require a different officer than the creator (segregation of duties)."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_state, "guidance_text?", "closure_notes?"]
    output: EnforcementReferral
    side_effects: ["status transition; sets referred_at / closed_by_user_id / closure_notes / guidance_text; increments EnforcementReferral.version by 1"]
  - method: POST
    path: /msrb/solicitation-records
    description: Log an advisor solicitation of a municipal entity (fiduciary standard). Advisor org type gate, mandatory compensation disclosure, and the contingent-fee cap are enforced.
    roles: [DealerRep]
    code: 201
    input: [advisor_org_id, municipal_entity_name, compensation_type, compensation_cents, disclosure_provided]
    output: SolicitationRecord
    side_effects: ["append-only record; no state transitions"]
  - method: GET
    path: /msrb/organizations/{id}/solicitation-records
    description: "List solicitation records of an advisor organization. DealerRep may list only own-org records."
    roles: [ComplianceOfficer, PortalOperator, DealerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: SolicitationRecord[]
    side_effects: []
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock (test-driving endpoint, outside the api_prefix). Startup default before any call is exactly 2026-09-01T00:00:00Z — never the wall clock. Must move monotonically forward. Runs the epoch pass per calculations.epoch_pass_ordering: (1) proposal effectuation + supersession cascade, (2) CE cycle transitions, (3) late-tally/posture recompute + PENDING-subscription rejection cascade."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, epoch_effects: integer }"
    side_effects: ["runs the ordered epoch pass (see calculations.epoch_pass_ordering)"]
  - method: GET
    path: /msrb/data-feeds/{product_code}
    description: "Licensed market-data pull. Requires an ACTIVE DataSubscription for the path product_code whose subscriber_principal == X-User-ID. record_count = number of records in the product dataset: DISSEMINATED TradeReports for TRADE_REALTIME/TRADE_HISTORICAL, PUBLISHED DisclosureSubmissions for DISCLOSURE_ARCHIVE."
    roles: [MarketDataSubscriber]
    code: 200
    input: []
    output: "{ product_code: string, subscription_id: string, record_count: integer }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted on the endpoint, or entity-backed ownership mismatch (IssuerRep/DealerRep acting on another organization's resources; DealerRep cancelling another dealer's trade)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Regulator decides a proposal they themselves submitted (X-User-ID == submitted_by_user_id), or a ComplianceOfficer closes a referral they themselves created (X-User-ID == created_by_user_id)."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: missing required field, wrong type, invalid enum member, cusip not 9 characters, par_amount/price/seats/score/compensation out of domain, period_start >= period_end, future event_occurred_at, to_state == REJECTED requested via the subscription transition endpoint."
  - id: ERR_EVENT_CATEGORY_REQUIRED
    http: 422
    condition: "submission_type == EVENT_NOTICE without event_category (or with event_occurred_at missing)."
  - id: ERR_ORG_NOT_FOUND
    http: 404
    condition: "Referenced organization id does not exist (path or body)."
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "Referenced rule proposal id does not exist."
  - id: ERR_COMMENT_NOT_FOUND
    http: 404
    condition: "Referenced comment letter id does not exist."
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "Referenced disclosure submission id does not exist or is outside the caller's visibility scope."
  - id: ERR_PROFESSIONAL_NOT_FOUND
    http: 404
    condition: "Referenced professional id does not exist."
  - id: ERR_TRADE_NOT_FOUND
    http: 404
    condition: "Referenced trade report id does not exist or is outside the caller's visibility scope."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "Referenced data subscription id does not exist."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "Referenced enforcement referral id does not exist."
  - id: ERR_RULE_NOT_FOUND
    http: 404
    condition: "Referral rule_code matches no existing RuleProposal.rule_code."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state-machine precondition failure: transition attempted from a state where it is not defined (including terminal states), exam attempt while professional standing SUSPENDED, ce-credits while UNQUALIFIED or LAPSED, PATCH on a proposal not in DRAFT/DISAPPROVED."
  - id: ERR_PROPOSAL_NOT_OPEN_FOR_COMMENT
    http: 409
    condition: "Comment letter submitted while the proposal's status != OPEN_FOR_COMMENT (takes priority over the window-closed temporal check)."
  - id: ERR_UNRESOLVED_COMMENTS
    http: 409
    condition: "submit-for-approval attempted while CommentLetters with status RECEIVED remain on the proposal."
  - id: ERR_ORG_SUSPENDED
    http: 409
    condition: "Operation requires an ACTIVE organization but the referenced organization is SUSPENDED (disclosure create, trade create, solicitation create, exam attempt via employer, subscription create, subscription activation)."
  - id: ERR_DISCLOSURE_REQUIRED
    http: 422
    condition: "Solicitation record with disclosure_provided == false (fiduciary compensation disclosure is mandatory)."
  - id: ERR_COMMENT_WINDOW_CLOSED
    http: 422
    condition: "Comment letter submitted while status == OPEN_FOR_COMMENT but now >= comment_window_end (half-open window)."
  - id: ERR_COMMENT_PERIOD_TOO_SHORT
    http: 422
    condition: "open-comment-period with comment_period_days outside [21, 90]."
  - id: ERR_COMMENT_PERIOD_STILL_OPEN
    http: 422
    condition: "submit-for-approval attempted before comment_window_end."
  - id: ERR_RETAKE_WINDOW_ACTIVE
    http: 422
    condition: "Exam attempt on (professional, series) while a prior attempt on the same pair is strictly younger than 30 days."
  - id: ERR_TRADE_TIME_INVALID
    http: 422
    condition: "Trade report executed_at is after the current logical time."
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "Clock set to a time strictly before the current logical time."
  - id: ERR_ORG_TYPE_NOT_PERMITTED
    http: 422
    condition: "Type-gated reference: issuer not ISSUER/OBLIGATED_PERSON, employer not BROKER_DEALER/MUNICIPAL_ADVISOR, trade dealer not BROKER_DEALER, solicitation advisor not MUNICIPAL_ADVISOR, referral subject org not BROKER_DEALER/MUNICIPAL_ADVISOR."
  - id: ERR_AMBIGUOUS_SUBJECT
    http: 422
    condition: "EnforcementReferral sets both or neither of subject_org_id / subject_professional_id."
  - id: ERR_RULE_NOT_EFFECTIVE
    http: 422
    condition: "Referral cites a rule whose proposal exists but is not EFFECTIVE."
  - id: ERR_COVERAGE_PERIOD_OVERLAP
    http: 409
    condition: "ANNUAL_FINANCIAL coverage interval intersects a sibling ANNUAL_FINANCIAL submission of the same issuer in status RECEIVED or PUBLISHED (closed-interval comparison)."
  - id: ERR_FEE_CAP_EXCEEDED
    http: 422
    condition: "CONTINGENT solicitation compensation_cents > 2500000 (fiduciary fee cap)."
  - id: ERR_PRODUCT_NOT_LICENSED
    http: 403
    condition: "GET /msrb/data-feeds/{product_code} without an ACTIVE subscription for that product whose subscriber_principal == X-User-ID."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "PATCH /msrb/rule-proposals/{id} with expected_rule_proposal_version != the proposal's current version (OCC)."

