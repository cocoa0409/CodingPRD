      - name: certification_after_the_deadline_returns_deadline_passed
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATION_DEADLINE_PASSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / certify_member_batch_state_conflict_beats_deadline_conflict
          rationale: "The deadline-only control leg of the named difficulty instance certifies past 2026-05-01 and asserts ERR_CERTIFICATION_DEADLINE_PASSED at 422."

      - name: overlapping_invalidation_hours_return_range_overlap
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALIDATION_RANGE_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / invalidation_half_open_hours_allow_adjacency_reject_overlap
          rationale: "The one-hour overlap leg of the named difficulty instance asserts ERR_INVALIDATION_RANGE_OVERLAP at 409."

      - name: a_second_event_window_inside_the_buffer_returns_window_conflict
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EVENT_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / event_window_closed_interval_buffer_rejects_next_day_claim
          rationale: "The next-day claim leg of the named difficulty instance asserts ERR_EVENT_WINDOW_CONFLICT at 409."

