            - { call: "POST /api/visits/${vR3}/start", as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /api/visits/${vR3}/findings", payload: { severity: "MINOR", description: "log gap", remediation_deadline: "2026-09-01T00:00:00Z" }, as: FieldSupervisor, as_user_id: "sup-1", captures: { fndR3: $.data.id } }
            - { call: "POST /api/findings/${fndR3}/submit-remediation", payload: { remediation_notes: "done" }, as: ClientContact, as_user_id: "${cR3}" }
          trigger:
            - { call: "POST /api/findings/${fndR3}/verify", payload: { outcome: "CLOSED" }, as: FieldSupervisor, as_user_id: "sup-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/findings/${fndR3}/verify", payload: { outcome: "CLOSED" }, as: FieldSupervisor, as_user_id: "sup-2", captures: { stR3: $.data.status } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES_VERIFICATION (403) for the original inspector"
            - "stR3 == VERIFIED_CLOSED for a different supervisor"

