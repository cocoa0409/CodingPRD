  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_from_draft_state_error_masks_funding_floor_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.PartnershipAgreement.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the ACTIVATE request violates both
          priority 6 (agreement is DRAFT, ACTIVATE is only defined from PROPOSED) and
          priority 11 (pledge 100000 < floor 200000). The state error must win:
          ERR_INVALID_STATE (409), not ERR_FUNDING_BELOW_FLOOR.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory (district PARTNER) and school; partner1 ACTIVE."
            - "Program JA-ECO4 (session_count 5 -> funding floor 200000)."
            - "Agreement on JA-ECO4 with funding_pledged_cents == 100000, left in DRAFT (never PROPOSED)."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-ECO4", title: "Economics Essentials IV", grade_band_low: 4, grade_band_high: 5, session_count: 5, minutes_per_session: 90, capstone_required: false, capstone_facility: "NONE", min_students: 10, max_students: 30 }
              as: PlatformAdmin
              captures: { prog5_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${prog5_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 100000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
              captures: { err: $.data }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "the error is NOT ERR_FUNDING_BELOW_FLOOR even though the pledge (100000) is below the floor (200000) — priority 6 state beats priority 11 business_fiscal"
            - "PartnershipAgreement.${agr_id}.status remains DRAFT"

