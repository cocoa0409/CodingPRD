            - "after POST /osup/needs-assessments/${na27_id}/publish the assessment reads PUBLISHED with published_at 2027-01-05T00:00:00Z, and the 2026 assessment stays PUBLISHED because superseding is scoped to the same (use_area_id, assessment_year) pair"
            - "the identical screening of ${app1_id} now succeeds, routing_decision DIRECT, status DIRECT_AWARD_PENDING, and UseArea.${ua_id}.pending_service_days becomes 200"
            - "screening ${app2_id} still returns ERR_NO_PUBLIC_NEED after that, since BRW-02's finding is unchanged — the two areas' gates are independent"

      - name: fee_finalization_gated_by_sibling_report_states
        grounds:
          - validations.priority_7.ERR_USE_REPORTS_PENDING
          - state_machines.FeeAssessment.PROVISIONAL_to_FINAL
          - state_machines.TripUseReport
        distinguishing_aspect: |
          ENTITY PAIR: FeeAssessment depends on TripUseReport — the fourth distinct pair, and the
          only one where the dependency is a SET rather than a single row: finalization is blocked by
          the existence of any sibling report still in SUBMITTED for the same permit and season, not
          by the state of one identified parent. The blocking report contributes nothing to the money
          on the assessment while it is SUBMITTED, so a naive implementation sees a perfectly
          consistent assessment and finalizes it, quietly billing the season on an incomplete set.
        test_recipe:
          setup:
            - "logical clock at 2027-09-20T00:00:00Z"
            - "UseArea BRW-01 with season 2027-05-15 .. 2027-09-30"
            - "Outfitter Alpine holding one ISSUED permit for 200 service days, fee_schedule_code GRADUATED, one authorized LEAD/WFR guide giving capacity 8"
            - "report R1 for 2027-05-15..2027-06-14 with gross 1600050 and deductions 0, ACCEPTED — this creates the season's FeeAssessment in PROVISIONAL"
            - "report R2 for 2027-06-15..2027-07-15 with gross 1400000 and deductions 0, left in SUBMITTED"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
