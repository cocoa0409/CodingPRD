scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_requires_core_fields
        claim_type: required_fields
        grounds:
          - "entities.HealthPlanProgram"
        distinguishing_aspect: "POST /screening/programs missing required measure_year is rejected with ERR_VALIDATION; a complete payload returns 201 with system defaults population_size=0, attributed_count=0, adherent_count=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /screening/programs"
              payload: { program_code: "G-REQ", program_name: "GReq", outreach_mode: "PUSH" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /screening/programs"
              payload: { program_code: "G-REQ", program_name: "GReq", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          assert:
            - "first call error_id == ERR_VALIDATION (missing required measure_year)"
            - "second call 201; response.data.population_size == 0; attributed_count == 0; adherent_count == 0"

      - name: create_patient_duplicate_external_ref_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Patient"
          - "\"errors[ERR_DUPLICATE_PATIENT\"]"
        distinguishing_aspect: "Second POST /screening/patients with an already-used external_ref is rejected with ERR_DUPLICATE_PATIENT (409)."
        test_recipe:
          setup: ["one patient with external_ref p-dup exists"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-dup", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-dup", date_of_birth: "1971-01-01", risk_category: "ELEVATED" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_PATIENT"
            - "http status == 409"

      - name: patient_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.Patient.fields.contraindication_flags"
        distinguishing_aspect: "Omitting contraindication_flags and the advisory booleans yields empty flags and false booleans; status defaults to ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-def", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /screening/patients/${p_id}"
              as: ProgramAdmin
          assert:
            - "response.data.contraindication_flags == []"
            - "response.data.status == ACTIVE"
            - "response.data.recent_symptoms == false"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - "entities.HealthPlanProgram.fields.attributed_count"
        distinguishing_aspect: "Client-supplied adherent_count on program creation is ignored; the server-computed value 0 is returned."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /screening/programs"
              payload: { program_code: "G-CMP", program_name: "GCmp", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
          assert:
            - "response.data.adherent_count == 0 (server-computed; a client cannot seed counters)"
            - "response.data.population_size == 0"

      - name: order_get_not_found
        claim_type: not_found
        grounds:
          - "entities.ScreeningOrder"
          - "\"errors[ERR_NOT_FOUND\"]"
        distinguishing_aspect: "GET /screening/orders/{random-uuid} returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /screening/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: outreach_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.OutreachEvent"
        distinguishing_aspect: "OutreachEvent has common_fields: false and no PUT/PATCH/DELETE endpoint exists; the only reads are the sub-resource list under its cohort."
        test_recipe:
          setup:
            - "PUSH program with cohort; one outreach dispatched"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-IMM", program_name: "GImm", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-imm", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts/${c_id}/outreach"
              payload: { channel: "SMS", template_code: "T2" }
              as: ProgramAdmin
          trigger:
            - call: "GET /screening/programs/${g_id}/cohorts/${c_id}/outreach-events"
              as: ProgramAdmin
          assert:
            - "list contains exactly 1 event with channel == SMS"
            - "event row has id and created_at but no version field"

  # ===========================================================================
  # State machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_pending_eligibility
        claim_type: initial_state
        grounds:
          - "state_machines.ScreeningOrder"
        distinguishing_aspect: "A newly captured order starts in PENDING_ELIGIBILITY with quality_outcome UNRESOLVED and recollection_round 0."
        test_recipe:
          setup: ["patient + provider exist"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-init", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567810", display_name: "Dr P", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
          assert:
            - "response.data.status == PENDING_ELIGIBILITY"
            - "response.data.quality_outcome == UNRESOLVED"
            - "response.data.recollection_round == 0"
            - "response.data.version == 1"

      - name: ship_from_returned_kit_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ScreeningKit"
          - "\"errors[ERR_KIT_INVALID_STATE\"]"
        distinguishing_aspect: "POST /screening/kits/{id}/ship on an already-RETURNED kit is rejected with ERR_KIT_INVALID_STATE; no state change occurs."
        test_recipe:
          setup: ["order driven through ship and return; kit status RETURNED"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ship", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567811", display_name: "Dr Q", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_KIT_INVALID_STATE"
            - "ScreeningKit.${k_id}.status remains RETURNED"

      - name: cancel_from_terminal_resulted_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.ScreeningOrder"
          - "\"errors[ERR_ORDER_NOT_CANCELLABLE\"]"
        distinguishing_aspect: "Cancel on a RESULTED order is rejected with ERR_ORDER_NOT_CANCELLABLE; RESULTED is terminal."
        test_recipe:
          setup: ["order fully resulted NEGATIVE"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-term", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567812", display_name: "Dr R", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s_id: $.data.id }
            - call: "POST /screening/specimens/${s_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
            - call: "POST /screening/specimens/${s_id}/result"
              payload: { outcome: "NEGATIVE" }
              as: LabTechnician
          trigger:
            - call: "POST /screening/orders/${o_id}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "ScreeningOrder.${o_id}.status remains RESULTED"

      - name: return_before_due_skips_scheduled_reminders
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Reminder.SCHEDULED_to_SKIPPED"
        distinguishing_aspect: "Returning the kit before the first reminder date flips all three SCHEDULED reminders to SKIPPED; a later dispatch call returns an empty list."
        test_recipe:
          setup: ["kit shipped 2026-09-01; returned 2026-09-03 (before first reminder on 2026-09-08)"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-rem", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567813", display_name: "Dr S", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "GET /screening/orders/${o_id}/reminders"
              as: ProgramAdmin
          assert:
            - "all 3 reminders have status == SKIPPED"
            - "reminder scheduled_for values == 2026-09-08, 2026-09-15, 2026-09-29 (offsets 7/14/28 from ship date)"

      - name: eligibility_reject_terminal_state
        claim_type: valid_transition
        grounds:
          - "state_machines.ScreeningOrder.PENDING_ELIGIBILITY_to_REJECTED_INELIGIBLE"
        distinguishing_aspect: "Eligibility reject moves the order to terminal REJECTED_INELIGIBLE; a subsequent confirm is rejected."
        test_recipe:
          setup: ["order in PENDING_ELIGIBILITY"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-rej", date_of_birth: "1940-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567814", display_name: "Dr T", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id }
            - call: "POST /screening/orders/${o_id}/eligibility/reject"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "reject succeeded: order reached REJECTED_INELIGIBLE"
            - "confirm after reject: error_id == ERR_ORDER_INVALID_STATE"

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: adherence_rate_zero_denominator
        claim_type: correct_result
        grounds:
          - "calculations.quality_measure_attribution"
        distinguishing_aspect: "A program whose only cohort member is EXCLUDED has denominator 0 and the report returns adherence_rate 0.0000 (no division by zero)."
        test_recipe:
          setup: ["program with one cohort member; member excluded"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-ZERO", program_name: "GZ", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-zero", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts/${c_id}/exclude"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/programs/${g_id}/quality-measure-report"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.data.denominator == 0"
            - "response.data.numerator == 0"
            - "response.data.adherence_rate == 0"

      - name: risk_score_clinic_threshold_exact
        claim_type: constants_applied
        grounds:
          - "calculations.weighted_risk_screen_score"
        distinguishing_aspect: "Score exactly 6 (recent_symptoms 5 + family_history 2 = 7? no — recent_symptoms+family_history = 7; exact 6 unreachable with weights 5/3/2; use comorbidity+family_history = 5 -> HOME_KIT_OK and recent_symptoms+comorbidity = 8 -> CLINIC) — the threshold is >= 6, so 8 maps to CLINIC and 5 to HOME_KIT_OK."
        test_recipe:
          setup:
            - "patient A: comorbidity+family_history (score 5); patient B: recent_symptoms+comorbidity (score 8)"
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-thr-a", date_of_birth: "1970-01-01", risk_category: "AVERAGE", comorbidity: true, family_history: true }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-thr-b", date_of_birth: "1970-01-01", risk_category: "AVERAGE", recent_symptoms: true, comorbidity: true }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
          trigger:
            - call: "GET /screening/patients/${pa_id}/risk-score"
              as: ProgramAdmin
            - call: "GET /screening/patients/${pb_id}/risk-score"
              as: ProgramAdmin
          assert:
            - "patient A score == 5, recommended_channel == HOME_KIT_OK"
            - "patient B score == 8, recommended_channel == CLINIC"

      - name: reminder_cadence_partial_dispatch_chronological
        claim_type: input_set_filtering
        grounds:
          - "calculations.reminder_cadence_schedule"
        distinguishing_aspect: "Dispatching on 2026-09-10 sends only reminder 1 (scheduled 2026-09-08); reminders 2 and 3 remain SCHEDULED with future dates."
        test_recipe:
          setup: ["kit shipped 2026-09-01; clock at 2026-09-10; no return"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-cad", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567815", display_name: "Dr U", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/orders/${o_id}/reminders/dispatch"
              payload: {}
              as: ProgramAdmin
          assert:
            - "exactly 1 reminder returned with sequence_no == 1 and status == SENT"
            - "reminders 2 and 3 remain SCHEDULED with scheduled_for 2026-09-15 and 2026-09-29"

      - name: sla_precision_on_returned_order
        claim_type: precision
        grounds:
          - "calculations.kit_turnaround_sla_days"
        distinguishing_aspect: "For a returned order both variants agree: shipped 2026-09-01, returned 2026-09-06 -> 5 integer days."
        test_recipe:
          setup: ["order shipped 2026-09-01, returned 2026-09-06"]
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-sla2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567816", display_name: "Dr V", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "GET /screening/orders/${o_id}/sla"
              as: ProgramAdmin
          assert:
            - "response.data.provisional_days == 5"
            - "response.data.return_logistics_days == 5"

  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: high_risk_category_rejected_at_eligibility
        claim_type: violation_to_error
        grounds:
          - "\"validations[priority=8\"]"
          - "errors[ERR_RISK_CATEGORY_EXCLUDED]"
        distinguishing_aspect: "Patient with risk_category HIGH fails eligibility confirmation with ERR_RISK_CATEGORY_EXCLUDED; order stays PENDING_ELIGIBILITY."
        test_recipe:
          setup: ["order for HIGH-risk patient in PENDING_ELIGIBILITY"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-high", date_of_birth: "1970-01-01", risk_category: "HIGH" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567817", display_name: "Dr W", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id }
          trigger:
