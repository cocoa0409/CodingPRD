        excluded_because:
          difficulty_instance: transitive_cascade / credential_expiry_staffing_cascade_through_daily_readiness_run
          rationale: "The named §1.8 instance fires the sweep and asserts every entity it touches in one pass, which is the bulk-action claim."

  # ===========================================================================
  # 6. From Table 6 (Errors) — every catalogued error must be triggerable.
  #    Errors already triggered by §1.8 appear as stubs at the end.
  # ===========================================================================
  - section: errors
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 1].ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: |
          The authentication rule sits above every other rule: a request with no
          X-Role header at all is 401 ERR_UNAUTHENTICATED even when the path is a
          plain list read, and a request whose X-Role is a plausible but
          undeclared role name ("FacilityDirector") gets the same 401 rather than
          the 403 ERR_UNAUTHORIZED reserved for declared-but-unlisted roles.
        test_recipe:
          setup:
            - "Empty database; clock 2026-08-01T00:00:00Z (set by OperatorAdmin before the unauthenticated calls)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
          trigger:
            - call: "GET /client-contracts"
              payload: {}
              as: "<no X-Role header sent>"
              captures: { err_missing: $.data.error_id }
            - call: "GET /client-contracts"
              payload: {}
              as: "FacilityDirector"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "No X-Role header -> HTTP 401 AND data.error_id == \"ERR_UNAUTHENTICATED\""
            - "X-Role \"FacilityDirector\" (not one of the six declared roles) -> HTTP 401 AND data.error_id == \"ERR_UNAUTHENTICATED\", NOT 403 / ERR_UNAUTHORIZED"
            - "response_type == \"error\" AND data.message is a non-empty string AND meta.api_request_id is present on both responses"

      - name: site_code_conflict_on_duplicate_contract_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 35].ERR_SITE_CODE_CONFLICT
          - errors.ERR_SITE_CODE_CONFLICT
          - state_machines.ClientContract.DRAFT_to_WITHDRAWN.side_effects
        distinguishing_aspect: |
          site_code uniqueness is scoped to contracts that are not WITHDRAWN: a
          second contract reusing NWM-01 while the first is DRAFT is 409
          ERR_SITE_CODE_CONFLICT, and the identical request succeeds once the
          first contract has been withdrawn — the withdrawal explicitly releases
          the claim.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one DRAFT COST_PLUS contract on site_code NWM-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Logistics", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 4000000 }
              as: OperatorAdmin
              captures: { err_dup_site_code: $.data.error_id }
            - call: "POST /client-contracts/${c_id}/service-status"
              payload: { action: "TERMINATE", reason: "Replaced by a fresh paper" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Logistics", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 4000000 }
              as: OperatorAdmin
              captures: { c_retry_id: $.data.id }
          assert:
            - "Second contract on site_code NWM-01 while the first is DRAFT -> HTTP 409 AND data.error_id == \"ERR_SITE_CODE_CONFLICT\" (captured as ${err_dup_site_code})"
            - "TERMINATE on the DRAFT contract -> HTTP 200 AND ClientContract.${c_id}.status == \"WITHDRAWN\""
            - "Retry after withdrawal -> HTTP 201 AND ClientContract.${c_retry_id}.site_code == \"NWM-01\" AND status == \"DRAFT\""
            - "GET /client-contracts with status DRAFT -> total_count == 1"

      - name: asset_tag_conflict_scoped_to_one_contract_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 36].ERR_ASSET_TAG_CONFLICT
          - errors.ERR_ASSET_TAG_CONFLICT
          - entities.FacilityAsset.fields.asset_tag
        distinguishing_aspect: |
          asset_tag is unique PER CONTRACT, not globally: reusing AED-01 inside
          the same contract is 409 ERR_ASSET_TAG_CONFLICT, while the very same tag
          on a different contract's room is accepted with 201. Asset creation
          needs no ACTIVE contract, so both contracts can stay DRAFT.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two DRAFT contracts (NWM-01 COST_PLUS, AXL-01 MANAGEMENT_FEE), each with one room; the first already owns asset AED-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /client-contracts"
              payload: { client_name: "Axle Logistics", site_code: "AXL-01", fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 2.0, participation_target_pct: 30, term_start_on: "2026-07-01", term_end_on: "2027-06-30", management_fee_cents: 40000 }
              as: OperatorAdmin
              captures: { c_mf_id: $.data.id }
            - call: "POST /facility-rooms"
              payload: { contract_id: "${c_id}", room_name: "Studio A", room_type: "STUDIO", max_occupancy: 30 }
              as: OperatorAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /facility-rooms"
              payload: { contract_id: "${c_mf_id}", room_name: "Studio B", room_type: "STUDIO", max_occupancy: 20 }
              as: OperatorAdmin
              captures: { room_b_id: $.data.id }
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_id}", room_id: "${room_a_id}", asset_type: "AED", asset_tag: "AED-01", pad_expiry_on: "2027-03-31", battery_expiry_on: "2027-03-31", last_inspection_on: "2026-07-20" }
              as: OperatorAdmin
              captures: { aed_id: $.data.id }
          trigger:
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_id}", room_id: "${room_a_id}", asset_type: "STRENGTH", asset_tag: "AED-01" }
              as: OperatorAdmin
              captures: { err_tag: $.data.error_id }
            - call: "POST /facility-assets"
              payload: { contract_id: "${c_mf_id}", room_id: "${room_b_id}", asset_type: "AED", asset_tag: "AED-01", pad_expiry_on: "2027-03-31", battery_expiry_on: "2027-03-31", last_inspection_on: "2026-07-20" }
              as: OperatorAdmin
              captures: { aed_b_id: $.data.id }
          assert:
            - "Duplicate tag inside contract ${c_id} -> HTTP 409 AND data.error_id == \"ERR_ASSET_TAG_CONFLICT\""
            - "Same tag on contract ${c_mf_id} -> HTTP 201 AND FacilityAsset.${aed_b_id}.asset_tag == \"AED-01\" AND readiness_status == \"READY\""
            - "GET /facility-assets with contract_id ${c_id} -> total_count == 1 (only ${aed_id})"

      - name: duplicate_lead_assignment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 37].ERR_DUPLICATE_LEAD_ASSIGNMENT
          - errors.ERR_DUPLICATE_LEAD_ASSIGNMENT
