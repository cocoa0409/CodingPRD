      - name: a_single_unpriceable_parcel_rejects_the_whole_sweep
        claim_type: cascading_validation
        grounds:
          - validations[priority=42]  # ERR_RATE_ROW_MISSING
          - calculations.transportation_charge
          - calculations.invoice_sweep_selection
        distinguishing_aspect: |
          The rate-row check cascades from one shipment to the entire invoice: a contract whose
          rate_table stops at 20 lb prices the 7 lb parcel fine but cannot price the 58 lb one,
          so the preview of the heavy parcel and the whole-shipper sweep both return 422
          ERR_RATE_ROW_MISSING and no Invoice row is created at all.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 whose rate_table holds only one row: zone 2, 1-20 lb at 380 (divisor 139, min charge 1195). ServiceLevel EXPRESS exists."
