# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Net Lease Investment Acquisition & Due Diligence
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. §0.5 is authoritative.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two calculations on DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: noi_conservative_vs_market_variant_on_underwriting_domain
        grounds:
          - calculations.net_operating_income
          - entities.UnderwritingModel.fields.opex_allowance_variant
          - entities.UnderwritingModel.fields.noi_cents
        distinguishing_aspect: |
          Dual-variant calculation on the UNDERWRITING domain (UnderwritingModel):
          identical lease population produces noi_cents == 1700000 under the
          CONSERVATIVE opex variant and noi_cents == 1760000 under the MARKET
          variant — a 60000-cent divergence driven solely by the variant flag.
        test_recipe:
          setup:
            - "Deal with purchase_price_cents=25000000, earnest_money_cents=500000"
            - "Property with rentable_sqft=20000, year_built=2010"
            - "Two Tenants with credit APPROVED (T1 INVESTMENT_GRADE, T2 INVESTMENT_GRADE)"
            - "Lease A on property: annual_base_rent_cents=1200000, tenant T1, expiry 2036-08-01"
            - "Lease B on property: annual_base_rent_cents=800000, tenant T2, expiry 2032-06-01"
            - "Both leases VERIFIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "DualVariantDeal", deal_type: "MULTI_TENANT", target_close_date: "2026-10-01T00:00:00Z", earnest_money_cents: 500000, purchase_price_cents: 25000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties"
              payload: { address: "100 Main St", property_type: "RETAIL", rentable_sqft: 20000, year_built: 2010 }
              as: AcquisitionsAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Tenant One", credit_rating: "INVESTMENT_GRADE", credit_score: 800, annual_revenue_cents: 100000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Tenant Two", credit_rating: "INVESTMENT_GRADE", credit_score: 790, annual_revenue_cents: 90000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t2_id: $.data.id }
            - call: "POST /tenants/${t1_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t1_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t2_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t2_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t1_id}", lease_type: "NNN", annual_base_rent_cents: 1200000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2036-08-01T00:00:00Z", renewal_options_count: 1 }
              as: AcquisitionsAnalyst
              captures: { lease_a_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t2_id}", lease_type: "NN", annual_base_rent_cents: 800000, lease_commencement_date: "2021-01-01T00:00:00Z", lease_expiration_date: "2032-06-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_b_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_a_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_b_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { model_cons_id: $.data.id, noi_cons: $.data.noi_cents }
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models"
              payload: { opex_allowance_variant: "MARKET" }
              as: AcquisitionsAnalyst
              captures: { model_mkt_id: $.data.id, noi_mkt: $.data.noi_cents }
          trigger:
            - call: "GET /acquisition-deals/deals/${deal_id}/underwriting-models/${model_cons_id}"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "GET /acquisition-deals/deals/${deal_id}/underwriting-models/${model_mkt_id}"
              payload: {}
              as: AcquisitionsAnalyst
          assert:
            - "UnderwritingModel.${model_cons_id}.noi_cents == 1700000"
            - "UnderwritingModel.${model_mkt_id}.noi_cents == 1760000"
            - "UnderwritingModel.${model_cons_id}.noi_cents != UnderwritingModel.${model_mkt_id}.noi_cents (delta == 60000)"

      - name: annual_debt_service_interest_only_vs_amortizing_on_financing_domain
        grounds:
          - calculations.annual_debt_service
          - entities.FinancingApplication.fields.amortization_months
          - entities.FinancingApplication.fields.annual_debt_service_cents
        distinguishing_aspect: |
          Dual-variant calculation on the FINANCING domain (FinancingApplication):
          identical loan_amount_cents=15000000 and interest_rate_bps=600 produce
          annual_debt_service_cents == 900000 under the interest-only variant
          (amortization_months == 0) and 1159740 under the amortizing variant
          (amortization_months == 300) — a 259740-cent divergence driven solely
          by the amortization mode on a different entity than UnderwritingModel.
        test_recipe:
          setup:
            - "Deal created with purchase_price_cents=25000000 (LTV 65% cap = 16250000; 15000000 passes)"
            - "Two FinancingApplications on the deal, both DRAFT, identical loan terms except amortization"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "DebtServiceDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-11-01T00:00:00Z", earnest_money_cents: 500000, purchase_price_cents: 25000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/financing-applications"
              payload: { loan_type: "NEW_LOAN", loan_amount_cents: 15000000, interest_rate_bps: 600, amortization_months: 0 }
              as: CapitalMarketsOfficer
              captures: { io_app_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/financing-applications"
              payload: { loan_type: "NEW_LOAN", loan_amount_cents: 15000000, interest_rate_bps: 600, amortization_months: 300 }
              as: CapitalMarketsOfficer
              captures: { am_app_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/financing-applications/${io_app_id}/submit"
              payload: {}
              as: CapitalMarketsOfficer
              captures: { io_ds: $.data.annual_debt_service_cents }
            - call: "POST /acquisition-deals/deals/${deal_id}/financing-applications/${am_app_id}/submit"
              payload: {}
              as: CapitalMarketsOfficer
              captures: { am_ds: $.data.annual_debt_service_cents }
          trigger:
            - call: "GET /acquisition-deals/deals/${deal_id}/financing-applications/${io_app_id}"
              payload: {}
              as: CapitalMarketsOfficer
            - call: "GET /acquisition-deals/deals/${deal_id}/financing-applications/${am_app_id}"
              payload: {}
              as: CapitalMarketsOfficer
          assert:
            - "FinancingApplication.${io_app_id}.annual_debt_service_cents == 900000"
            - "FinancingApplication.${am_app_id}.annual_debt_service_cents == 1159740"
            - "FinancingApplication.${io_app_id}.annual_debt_service_cents != FinancingApplication.${am_app_id}.annual_debt_service_cents (delta == 259740)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (two instances in DIFFERENT modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: walt_weighted_scoring_mode_a_nonlinear_interaction
        grounds:
          - calculations.weighted_average_lease_term
          - entities.UnderwritingModel.fields.walt_months
          - entities.Lease.fields.remaining_term_months
        distinguishing_aspect: |
          Mode (a) combinatorial formula: WALT takes >= 3 inputs (per-lease rent
          weights, per-lease remaining terms, and the lease-status inclusion
          filter) with non-linear interaction (rent-weighted mean over a
          state-filtered set). With rents 1200000 (130 months) and 800000
          (70 months), WALT == 106 months; dropping lease B from the included
          set changes WALT to 130 — the filter is part of the combinatorics.
        test_recipe:
          setup:
            - "Deal with two properties' leases: lease A rent 1200000 expiry 2036-08-01 (rtm 120 -> use computed), lease B rent 800000 expiry 2032-06-01"
            - "Pin clock to 2026-08-01 so remaining_term_months: A = 120 months, B = 70 months"
            - "NOTE: rtm(2036-08-01 from 2026-08-01) = 120; rtm(2032-06-01) = (2032-2026)*12 + (6-8) = 70; day 1 >= 1 no decrement"
            - "WALT = round_half_up((1200000*120 + 800000*70)/2000000) = round_half_up((144000000+56000000)/2000000) = 100"
            - "Lease C added later stays DRAFT (excluded from input set) — asserting state-filter combinatorics"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "WaltDeal", deal_type: "MULTI_TENANT", target_close_date: "2026-12-01T00:00:00Z", earnest_money_cents: 500000, purchase_price_cents: 25000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties"
              payload: { address: "200 Oak Ave", property_type: "INDUSTRIAL", rentable_sqft: 50000, year_built: 2015 }
              as: AcquisitionsAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "WT1", credit_rating: "INVESTMENT_GRADE", credit_score: 810, annual_revenue_cents: 200000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "WT2", credit_rating: "INVESTMENT_GRADE", credit_score: 780, annual_revenue_cents: 150000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t2_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "WT3", credit_rating: "UNRATED", credit_score: 500, annual_revenue_cents: 10000000, is_guaranteed: false }
              as: AcquisitionsAnalyst
              captures: { t3_id: $.data.id }
            - call: "POST /tenants/${t1_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t1_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t2_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t2_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t1_id}", lease_type: "NNN", annual_base_rent_cents: 1200000, lease_commencement_date: "2019-01-01T00:00:00Z", lease_expiration_date: "2036-08-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_a_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t2_id}", lease_type: "NN", annual_base_rent_cents: 800000, lease_commencement_date: "2020-01-01T00:00:00Z", lease_expiration_date: "2032-06-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_b_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t3_id}", lease_type: "GROSS", annual_base_rent_cents: 500000, lease_commencement_date: "2022-01-01T00:00:00Z", lease_expiration_date: "2030-01-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_c_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_a_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_b_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { model_id: $.data.id }
          trigger:
            - call: "GET /acquisition-deals/deals/${deal_id}/underwriting-models/${model_id}"
              payload: {}
              as: AcquisitionsAnalyst
          assert:
            - "Lease.${lease_a_id}.remaining_term_months == 120"
            - "Lease.${lease_b_id}.remaining_term_months == 70"
            - "Lease.${lease_c_id}.status == DRAFT (excluded from WALT input set)"
            - "UnderwritingModel.${model_id}.walt_months == 100"

      - name: proration_nested_rounding_mode_b_round_per_line_then_sum
        grounds:
          - calculations.proration_line
          - calculations.total_prorations
          - entities.ClosingStatement.fields.total_prorations_cents
          - entities.Proration.fields.prorated_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula: nested rounding order is pinned —
          each Proration line is rounded half-up individually, THEN lines are
          summed. With annual tax 365000 and buyer_days=108, per-line
          prorated_cents == 108000 exactly; a hypothetical 'sum-then-round'
          order would compute 365000*108/365 = 108000 too, so we add a second
          INSURANCE line with annual 100001 cents and buyer_days=108 to split
          the orders: round-per-line yields 29600 (100001*108/365 = 29589.07 ->
          29589) vs sum-then-round which would combine fractional parts
          differently. The scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Deal closed through the full pipeline with one lease (rent 1200000), PSA price 25000000, earnest 500000, no financing"
            - "Clock pinned 2026-08-01; PSA executed 2026-08-01; dd_period_days=30, financing_contingency_days=0"
            - "Milestones all SATISFIED or WAIVED; title review CLEARED with no exceptions; EA CLEARED; PCA ACCEPTED; estoppel CERTIFIED; SNDA CERTIFIED"
            - "Deal certified CLEAR_TO_CLOSE; provisional ClosingStatement created in DRAFT"
            - "closing_date pinned to 2026-09-15"
            - "Proration lines issued: BASE_RENT annual 1200000 over [2026-09-01, 2026-10-01) buyer_days=16 -> 52603 BUYER_CREDIT; TAX annual 365000 over [2026-01-01, 2027-01-01) buyer_days=108 -> 108000 SELLER_CREDIT"
            - "Rounding-order discriminator line: INSURANCE annual 100001 over [2026-01-01, 2027-01-01) buyer_days=108 -> round_half_up(100001*108/365) = round_half_up(29589.0684...) = 29589 SELLER_CREDIT"
            - "total_prorations_cents = 52603 - 108000 - 29589 = -84986"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /acquisition-deals/deals"
              payload: { deal_name: "ProrationDeal", deal_type: "SINGLE_TENANT", target_close_date: "2026-09-20T00:00:00Z", earnest_money_cents: 500000, purchase_price_cents: 25000000 }
              as: AcquisitionsAnalyst
              captures: { deal_id: $.data.id, deal_v: $.data.version }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties"
              payload: { address: "300 Elm St", property_type: "OFFICE", rentable_sqft: 30000, year_built: 2005 }
              as: AcquisitionsAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "PT", credit_rating: "INVESTMENT_GRADE", credit_score: 820, annual_revenue_cents: 300000000, is_guaranteed: true }
              as: AcquisitionsAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /tenants/${t_id}/analyze-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /tenants/${t_id}/approve-credit"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases"
              payload: { tenant_id: "${t_id}", lease_type: "ABSOLUTE_NET", annual_base_rent_cents: 1200000, lease_commencement_date: "2018-06-01T00:00:00Z", lease_expiration_date: "2035-12-01T00:00:00Z" }
              as: AcquisitionsAnalyst
              captures: { lease_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/properties/${prop_id}/leases/${lease_id}/verify"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models"
              payload: { opex_allowance_variant: "CONSERVATIVE" }
              as: AcquisitionsAnalyst
              captures: { model_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models/${model_id}/submit"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/underwriting-models/${model_id}/approve"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/submit-for-psa"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/purchase-agreements"
              payload: { psa_price_cents: 25000000, earnest_money_cents: 500000, dd_period_days: 30, financing_contingency_days: 0 }
              as: AcquisitionsAnalyst
              captures: { psa_id: $.data.id }
            - call: "GET /acquisition-deals/deals/${deal_id}"
              payload: {}
              as: AcquisitionsAnalyst
              captures: { deal_v2: $.data.version }
            - call: "POST /acquisition-deals/deals/${deal_id}/purchase-agreements/${psa_id}/execute"
              payload: {}
              as: AcquisitionsAnalyst
            - call: "POST /acquisition-deals/deals/${deal_id}/title-reviews"
              payload: { title_company: "First Title", survey_type: "ALTA", received_at: "2026-08-02T00:00:00Z" }
              as: DueDiligenceOfficer
              captures: { tr_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/title-reviews/${tr_id}/begin-review"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/title-reviews/${tr_id}/clear"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/environmental-assessments"
              payload: { phase: "PHASE_I", recognized_environmental_condition: false, reliance_letter_received: true }
              as: DueDiligenceOfficer
              captures: { ea_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/environmental-assessments/${ea_id}/receive"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/environmental-assessments/${ea_id}/clear"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/property-condition-assessments"
              payload: { immediate_repair_cost_cents: 100000, capital_reserve_cents_per_sqft: 50, condition_rating: "GOOD" }
              as: DueDiligenceOfficer
              captures: { pca_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/property-condition-assessments/${pca_id}/receive"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/property-condition-assessments/${pca_id}/accept"
              payload: {}
              as: UnderwritingCommittee
            - call: "POST /acquisition-deals/deals/${deal_id}/estoppels"
              payload: { lease_id: "${lease_id}", tenant_id: "${t_id}", rent_confirmed_cents: 1200000, default_confirmed: true }
              as: DueDiligenceOfficer
              captures: { est_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/estoppels/${est_id}/receive"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/estoppels/${est_id}/certify"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/sndas"
              payload: { lease_id: "${lease_id}", lender_name: "BigBank", non_disturbance_confirmed: true }
              as: DueDiligenceOfficer
              captures: { snda_id: $.data.id }
            - call: "POST /acquisition-deals/deals/${deal_id}/sndas/${snda_id}/receive"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/sndas/${snda_id}/certify"
              payload: {}
              as: DueDiligenceOfficer
            - call: "GET /acquisition-deals/deals/${deal_id}/milestones?milestone_type=FINAL_WALKTHROUGH"
              payload: {}
              as: DueDiligenceOfficer
              captures: { walk_m: "$.data[0].id" }
            - call: "POST /acquisition-deals/deals/${deal_id}/milestones/${walk_m}/start"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/milestones/${walk_m}/complete"
              payload: {}
              as: DueDiligenceOfficer
            - call: "POST /acquisition-deals/deals/${deal_id}/certify-clear-to-close"
              payload: {}
              as: UnderwritingCommittee
            - call: "GET /acquisition-deals/deals/${deal_id}/closing-statements"
              payload: {}
              as: EscrowOfficer
              captures: { stmt_id: "$.data[0].id" }
          trigger:
            - call: "POST /acquisition-deals/deals/${deal_id}/closing-statements/${stmt_id}/issue"
              payload:
                closing_date: "2026-09-15T00:00:00Z"
                proration_inputs:
                  - { line_type: "BASE_RENT", lease_id: "${lease_id}", annual_amount_cents: 1200000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
                  - { line_type: "TAX", lease_id: "${lease_id}", annual_amount_cents: 365000, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
                  - { line_type: "INSURANCE", lease_id: "${lease_id}", annual_amount_cents: 100001, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: EscrowOfficer
          assert:
            - "ClosingStatement.${stmt_id}.status == ISSUED"
