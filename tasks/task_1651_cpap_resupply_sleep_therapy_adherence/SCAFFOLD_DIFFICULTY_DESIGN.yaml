            - "Patient.${pat11}.is_compliance_current == true   # >= boundary INCLUSIVE"
            - "Patient.${pat11}.patient_status == 'ACTIVE_THERAPY' (${pat11_status}) — no hold"

      - name: cadence_boundary_next_eligible_on_inclusive
        grounds:
          - calculations.cadence_eligibility_per_component
          - validations[priority=8]
        distinguishing_aspect: |
          Metric = calendar date vs plan.next_eligible_on. Endpoint = POST
          /sleep-therapy/resupply-orders. Boundary semantics INCLUSIVE:
