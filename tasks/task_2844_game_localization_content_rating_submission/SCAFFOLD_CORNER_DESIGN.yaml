              as: LocalizationProducer
              captures: { c_old: "$.data.id" }
            - call: "POST /talent-contracts/${c_old}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { old_committed: "$.data.committed_fee_cents" }
            - call: "GET /voice-talents/${talent_id}"
              payload: {}
              as: LocalizationProducer
              captures: { v2: "$.data.version" }
          trigger:
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_b}", territory_scope: ["JP"], media_scope: "ALL_MEDIA", buyout_fee_cents: 600000, per_line_rate_cents: 300, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${v2}" }
              as: LocalizationProducer
              captures: { c_other_title: "$.data.id" }
            - call: "GET /voice-talents/${talent_id}"
              payload: {}
              as: LocalizationProducer
              captures: { v3: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_a}", territory_scope: ["JP", "KR"], media_scope: "ALL_MEDIA", buyout_fee_cents: 700000, per_line_rate_cents: 320, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${v3}" }
              as: LocalizationProducer
              captures: { c_new: "$.data.id" }
          assert:
            - "after the NOVA-50 contract: TalentContract.${c_old}.status is still SIGNED - the pair (talent, title) differs, so no supersede fires"
            - "after the second NOVA-49 contract: TalentContract.${c_old}.status == TERMINATED and its version incremented by 1"
            - "TalentContract.${c_new}.status == DRAFT with committed_fee_cents == 0 - the replacement is not auto-signed"
            - "TalentContract.${c_old}.committed_fee_cents stays 500000 - supersede terminates the contract but never rewrites the money already committed"

      - name: rating_submission_appeal_loop_bounded_by_max_appeals
        claim_type: cyclic
        grounds:
          - state_machines.RatingSubmission[RATED -> UNDER_REVIEW]
          - complexity_profile.state_machine_shape
          - errors[ERR_MAX_APPEALS_EXCEEDED]
        excluded_because:
          difficulty_instance: rating_submission_appeal_cycle_terminates_at_max_appeals
          rationale: "That §1.8 instance already drives the RATED -> UNDER_REVIEW -> RATED cycle twice, asserts appeal_count 1 then 2, re-derives board_adjusted_risk_score on each re-entry, and asserts the third appeal fails with ERR_MAX_APPEALS_EXCEEDED - which is exactly the cyclic-shape termination-condition claim."

      - name: rejected_bug_is_locked_out_of_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LqaBug.terminal_states
          - errors[ERR_BUG_STATE_INVALID]
        excluded_because:
          difficulty_instance: lqa_bug_triage_fork_three_way_branch_with_terminal_lockdown
          rationale: "That §1.8 instance triages three sibling bugs into ACCEPT/REJECT/DUPLICATE, then asserts submit-fix, verify and a second triage all fail with ERR_BUG_STATE_INVALID on the REJECTED and DUPLICATE rows while the density recomputation excludes them."

  # =========================================================================
  # 3. Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: tm_band_boundaries_are_read_per_key_before_summing
        claim_type: tiered_pricing
        grounds:
          - calculations.market_text_effort_units
          - calculations.market_text_effort_units.constants
        distinguishing_aspect: "Six keys sit on both sides of all three TM band edges (95/94, 75/74, 50/49) with identical 100-character MENU bodies, so the only thing that moves the number is band selection plus the PINNED per-key rounding: the correct answer is 3.70 while the sum-then-round trap gives 3.50."
        test_recipe:
          setup:
            - "Title NOVA-51 with six 100-character MENU keys at tm_match_pct 95, 94, 75, 74, 50 and 49; strings locked; one JP TEXT_ONLY plan created before the lock."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-51", name: "Nova Drift 51", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.a95", source_text: "exact band sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 95 }
              as: LocalizationProducer
              captures: { k95: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.b94", source_text: "high fuzzy upper sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 94 }
              as: LocalizationProducer
              captures: { k94: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.c75", source_text: "high fuzzy lower sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 75 }
              as: LocalizationProducer
              captures: { k75: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.d74", source_text: "low fuzzy upper sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 74 }
              as: LocalizationProducer
              captures: { k74: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.e50", source_text: "low fuzzy lower sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 50 }
              as: LocalizationProducer
              captures: { k50: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "band.f49", source_text: "new band sample", source_char_count: 100, ui_surface: "MENU", display_char_limit: 400, tm_match_pct: 49 }
              as: LocalizationProducer
              captures: { k49: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { units: "$.data.text_effort_units", variant: "$.data.text_effort_variant", cost: "$.data.localization_cost_cents" }
          assert:
            - "per-key units are 0.1 (tm 95 -> 0.10 factor), 0.5 (tm 94 -> 0.45 rounded half-up), 0.5 (tm 75 -> 0.45), 0.8 (tm 74 -> 0.75), 0.8 (tm 50 -> 0.75) and 1.0 (tm 49 -> 1.00)"
            - "MarketPlan.${mp_jp}.text_effort_units == 3.70 exactly - NOT 3.50, which is what summing the unrounded 0.10+0.45+0.45+0.75+0.75+1.00 and rounding once would give"
            - "MarketPlan.${mp_jp}.text_effort_variant == SCOPE_ESTIMATE"
            - "MarketPlan.${mp_jp}.localization_cost_cents == 15540 (3.70 x 4200 x TEXT_ONLY 1.00) with overage_cents == 0"
            - "tm 95 lands in EXACT and tm 94 in HIGH_FUZZY: the band edges are >= comparisons, so 95 is the first exact key, not the last fuzzy one"

      - name: surface_uplift_multipliers_applied_per_key
        claim_type: constants_applied
        grounds:
          - calculations.market_text_effort_units.formula
          - calculations.market_localization_cost_cents.constants
        distinguishing_aspect: "Four keys share the same 200 characters and the same tm 60 (factor 0.75) and differ only in ui_surface, isolating SURFACE_UPLIFT: 2.3 / 1.8 / 1.7 / 1.5. The SUBTITLED scope multiplier 1.25 is then applied once to the money, never to the units."
        test_recipe:
          setup:
            - "Title NOVA-52 with one LEGAL, one SUBTITLE, one HUD and one MENU key, each 200 source characters at tm 60; the LEGAL key carries a context_note so the lock is allowed."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-52", name: "Nova Drift 52", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
