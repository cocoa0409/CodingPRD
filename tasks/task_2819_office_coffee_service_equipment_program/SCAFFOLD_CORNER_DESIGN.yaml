              captures: { p_crm_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { plc_id: "$.data.id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_a: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_a}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_a}/lines"
              payload: { product_id: "${p_crm_id}", requested_units: 10 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_a}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }, { product_id: "${p_crm_id}", delivered_units: 10 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_b: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_b}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_b}/lines"
              payload: { product_id: "${p_crm_id}", requested_units: 10 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_b}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
          trigger:
            - call: "POST /ocs/sites/${site_id}/evaluate-service-posture"
              payload: {}
              as: BillingSpecialist
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/sites/${site_id}/evaluate-service-posture"
              payload: {}
              as: BillingSpecialist
              captures: { esc_v: "$.data.version" }
            - call: "POST /ocs/sites/${site_id}/evaluate-service-posture"
              payload: {}
              as: BillingSpecialist
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: AccountManager
          assert:
            - "after visit B the CREAMER row is on_hand_units == 0 with cumulative_delivered_units == 10 (STOCKOUT, weight 20.0) and the COFFEE row is on_hand_units == 20 <= 26 (LOW, weight 7.5), so the completion cascade already stored escalation_score == 27.5 with service_posture ACTIVE"
            - "the first recompute (still 2026-08-10) is a no-op: escalation_score stays 27.5, service_posture stays ACTIVE and Site.version is unchanged"
            - "at 2026-11-03 the placed asset is overdue (last_descale_at 2026-08-03 + 90 days == 2026-11-01 <= current_utc), so overdue_descale_count == 1 adds 15.0"
            - "the second recompute is 200 with escalation_score == 42.5 (20.0 + 7.5 + 15.0) and service_posture == ESCALATED, and Site.version incremented by exactly 1 because the posture actually flipped"
            - "the third recompute re-derives the identical escalation_score == 42.5, keeps service_posture == ESCALATED and leaves version == ${esc_v} - a recompute that changes nothing must not bump version"
            - "Account.${acct_id}.escalated_site_count == 1 but program_posture is still ACTIVE, because AT_RISK requires escalated_site_count >= AT_RISK_SITE_THRESHOLD (2)"

      - name: corner_day_load_read_reports_booked_and_remaining_minutes_for_one_service_date
