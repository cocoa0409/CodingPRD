            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Ada Lin", birthdate: "2009-05-10", grade_level: 11 }
              as: LeagueAdmin
              captures: { st1_id: $.data.id, st1_v1: $.data.version }
            - call: "POST /students/${st1_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 3.200, term_credits: 6, expected_student_version: "${st1_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st1_v2: $.data.version }
          trigger:
            - call: "GET /teams/${tm1_id}"
              as: Coach
              as_user_id: "${c_id}"
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st1_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { sl1_id: $.data.id }
            - call: "POST /roster-slots/${sl1_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-0001", verified_birthdate: "2009-05-10" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /roster-slots/${sl1_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "GET /teams/${tm1_id}"
              as: Coach
              as_user_id: "${c_id}"
              captures: { tm1_v_mid: $.data.version }
            - call: "GET /students/${st1_id}"
              as: EligibilityOfficer
              as_user_id: "officer-c"
              captures: { st1_v3: $.data.version }
            - call: "POST /students/${st1_id}/academic-postings"
              payload: { term_label: "2026-FALL", term_gpa: 1.400, term_credits: 6, expected_student_version: "${st1_v3}" }
              as: EligibilityOfficer
              as_user_id: "officer-c"
            - call: "GET /roster-slots/${sl1_id}"
              as: EligibilityOfficer
              as_user_id: "officer-c"
            - call: "POST /roster-slots/${sl1_id}/release"
              payload: { release_note: "transferred out" }
              as: Coach
              as_user_id: "${c_id}"
            - call: "GET /teams/${tm1_id}"
              as: Coach
              as_user_id: "${c_id}"
          assert:
            - "trigger 1 (after create, before any source row): starter_slots_used == 0, starter_slots_available == 3, active_starter_count == 0"
            - "trigger 2 (source row appears): starter_slots_used == 1, starter_slots_available == 2, active_starter_count == 0 — a PROSPECTIVE starter consumes capacity but is not active"
            - "trigger 3 (source row changes on axis 1): participation_status is still PROSPECTIVE and active_starter_count is still 0 — one axis is not enough"
            - "trigger 4 (source row changes on axis 2): participation_status == ACTIVE, and the slot pins standing_at_verification == GOOD with effective_gpa_at_verification == 3.200"
            - "trigger 5: starter_slots_used == 1, starter_slots_available == 2 and active_starter_count == 1 — the roll-up reconciled without any call touching the Team directly"
            - "trigger 7 recomputes the live student fields: Student.${st1_id}.effective_gpa == 1.400 and academic_standing == INELIGIBLE"
            - "trigger 8 shows RosterSlot.${sl1_id}.academic_status still CLEARED, participation_status still ACTIVE, standing_at_verification still GOOD and effective_gpa_at_verification still 3.200 — the pinned snapshot is NOT rewritten by a later posting, and an already-cleared slot is not retroactively blocked"
            - "Team.${tm1_id}.active_starter_count is still 1 after trigger 7 — the live derived field on Student does not leak into the team roll-up"
            - "trigger 9 (source row leaves): participation_status == RELEASED with released_at == 2026-08-01T00:00:00.000Z"
            - "trigger 10: starter_slots_used == 0, starter_slots_available == 3 and active_starter_count == 0 — every roll-up returned exactly to its post-create value, with starter_slots_used + starter_slots_available == 3 at every single step above"

      - name: sanction_cascade_layer_runs_five_levels_deep_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.FairPlayCase.transitions[INVESTIGATING->SUSTAINED]
        distinguishing_aspect: |
          The deepest declared chain: case -> student -> slot -> team -> match, all inside
          one POST, with the fifth link also writing the season ledger.
        excluded_because:
          difficulty_instance: sustained_severe_case_cascades_five_links_case_student_slot_team_match
          rationale: |
            The §1.8 instance walks all five links end-to-end with the ordering made
            observable (the team can only suspend after the slot demotion drops
            active_starter_count below min_starters, and matches can only forfeit after
            the team suspends), and asserts every intermediate field. A breadth restatement
            would be a strictly weaker copy of the same request.

      - name: dual_variant_layer_is_probed_on_both_declared_variant_pairs
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations[seed_points]
          - calculations[academic_standing_evaluation]
        distinguishing_aspect: |
          The layer requires both variant pairs — the two academic-standing bases and the
          two seeding bases — to produce different results on identical data, with the
          delta on switching accounted for.
        excluded_because:
          difficulty_instance: seed_points_match_point_basis_vs_win_percentage_basis_rank_inversion
          rationale: |
            The §1.8 instance builds one result set that inverts the seed order between the
            two bases and asserts both orders plus the per-team seed_points delta, and its
            sibling instance does the same for the TERM_SNAPSHOT / ROLLING_CUMULATIVE pair
            on one shared posting history. Both variant pairs are therefore already probed
            at greater depth than a breadth instance could reach.

  - section: consistency_model
    instances:
      - name: a_sustain_decision_exposes_every_cascade_effect_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency
          - state_machines.FairPlayCase.transitions[INVESTIGATING->SUSTAINED]
          - calculations[team_integrity_score]
        distinguishing_aspect: |
          `immediate` means the write's own response already carries every value it
          computed, and the next read of every touched entity is already correct — no
          refresh endpoint, no second call to settle, no lag on a denormalised field.
          The probe reads all four cascade targets immediately after one POST and then
          repeats one of the reads to show the value did not change between reads (which
          an eventually-consistent implementation would betray).
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, an APPROVED title approval, one season, one DRAFT team and one student holding an ACTIVE STARTER slot"
            - "A fair-play case naming that student is INVESTIGATING"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
