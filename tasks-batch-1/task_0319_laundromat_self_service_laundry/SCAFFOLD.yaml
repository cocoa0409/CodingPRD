# =============================================================================
# task_0319 — Laundromat & Self-Service Laundry — SCAFFOLD (§1.0–§1.7)
# Difficulty tier: Expert (§0.4)
# =============================================================================

scenario: |
  Laundromat & Self-Service Laundry: machine inventory & real-time status,
  coin/card/app payment & vend price, wash-dry-fold drop-off by weight, loyalty
  & reload, machine fault/refund, attendant shift, cycle-time turn, lost-and-found

domain_name: laundromat-self-service-laundry
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.3) — Expert tier
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # vend quote (forward) vs charged amount (chronological/clocked)
    - cascading_side_effects          # vend -> machine RUNNING -> ledger debit -> shift drawer; fault -> refund -> wallet -> loyalty reversal
    - rate_threshold_triggers         # reload bonus tiers, loyalty-point thresholds, surge time-of-day pricing
    - derived_field_reconciliation    # member wallet/points, shift drawer expected totals, machine availability counters

  entity_topology: flat
  # Peer entities linked by foreign keys; no nested ownership tree. Machine,
  # Member, VendTransaction, WdfOrder, ReloadTransaction, Shift, RefundClaim,
  # LostFoundItem, LoyaltyLedgerEntry are peers joined by FKs.

  state_machine_shape: parallel
  # VendTransaction carries two independent dimensions (payment_status ×
  # cycle_status); Machine has a cyclic operational machine; WdfOrder has a
  # branching (fork) drop-off pipeline; RefundClaim branches approve/deny.

  relationship_patterns:
    - one_to_many        # Member -> ReloadTransaction, Member -> VendTransaction
    - flat               # FK references across peers
    - cross_aggregate    # VendTransaction references Machine, Member, Shift

  role_model: peer_roles
  # Member (entity_backed) self-serves vend/reload/WDF; Attendant (entity_backed)
  # runs shifts, processes WDF, declares faults, handles lost-and-found;
  # Manager (opaque) configures machines/pricing and adjudicates refunds.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  # PricingPlan — configuration: vend base prices, surge windows, WDF rates,
  # reload bonus tiers, loyalty accrual rate. One active plan per store epoch.
  # ---------------------------------------------------------------------------
  - name: PricingPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: label, type: string, source: input, description: "Human label for the plan, e.g. 'Summer 2026'" }
      - { name: wash_base_cents, type: integer, source: input, description: "Base vend price for a WASHER cycle, in cents", constraints: "> 0" }
      - { name: dry_base_cents_per_block, type: integer, source: input, description: "Vend price per dry time-block for a DRYER cycle, in cents", constraints: "> 0" }
      - { name: dry_block_minutes, type: integer, source: input, description: "Minutes of dryer run purchased per block", default: 8, constraints: "> 0" }
      - { name: surge_multiplier_bps, type: integer, source: input, description: "Surge multiplier in basis points (10000 = 1.0x) applied during surge windows", default: 10000, constraints: ">= 10000" }
      - { name: surge_start_hour_utc, type: integer, source: input, description: "Surge window start hour 0-23 inclusive (UTC)", default: 16, constraints: "0..23" }
      - { name: surge_end_hour_utc, type: integer, source: input, description: "Surge window end hour 0-23 exclusive (UTC); window is [start,end)", default: 20, constraints: "0..23" }
      - { name: wdf_rate_cents_per_lb, type: integer, source: input, description: "Wash-dry-fold rate per pound, in cents", constraints: "> 0" }
      - { name: wdf_minimum_cents, type: integer, source: input, description: "Minimum WDF charge floor regardless of weight, in cents", default: 1500, constraints: ">= 0" }
      - { name: reload_bonus_tier1_min_cents, type: integer, source: input, description: "Reload amount (cents) at/above which tier-1 bonus applies", default: 2000, constraints: ">= 0" }
      - { name: reload_bonus_tier1_bps, type: integer, source: input, description: "Tier-1 bonus rate in basis points of reload amount", default: 500, constraints: ">= 0" }
      - { name: reload_bonus_tier2_min_cents, type: integer, source: input, description: "Reload amount (cents) at/above which tier-2 bonus applies", default: 5000, constraints: ">= reload_bonus_tier1_min_cents" }
      - { name: reload_bonus_tier2_bps, type: integer, source: input, description: "Tier-2 bonus rate in basis points of reload amount", default: 1000, constraints: ">= reload_bonus_tier1_bps" }
      - { name: loyalty_cents_per_point, type: integer, source: input, description: "Cents of net app-wallet vend spend that accrue one loyalty point", default: 100, constraints: "> 0" }
      - { name: loyalty_redeem_threshold_points, type: integer, source: input, description: "Points required to redeem one free-wash credit", default: 50, constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT, constraints: "DRAFT,ACTIVE,RETIRED" }

  # ---------------------------------------------------------------------------
  # Machine — resource with cyclic operational state + parallel availability.
  # ---------------------------------------------------------------------------
  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: label, type: string, source: input, description: "Floor label, e.g. 'W12'" }
      - { name: machine_type, type: enum, source: input, description: "WASHER | DRYER", constraints: "WASHER,DRYER" }
      - { name: capacity_lb, type: integer, source: input, description: "Drum capacity in pounds", constraints: "> 0" }
      - { name: cycle_minutes, type: integer, source: input, description: "Nominal wash cycle length in minutes (WASHER only; DRYER computes from blocks)", default: 30, constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "IDLE | RUNNING | DONE | FAULT | OUT_OF_SERVICE — operational state machine", default: IDLE, constraints: "IDLE,RUNNING,DONE,FAULT,OUT_OF_SERVICE" }
      - { name: current_vend_id, type: string, source: computed, description: "FK -> VendTransaction.id; the vend currently occupying the machine, null when IDLE/FAULT" }
      - { name: cycle_ends_at, type: datetime, source: computed, description: "UTC timestamp at which the running cycle completes; null unless RUNNING" }
      - { name: lifetime_vend_count, type: integer, source: computed, description: "Count of VendTransaction with cycle_status COMPLETED on this machine", default: 0 }
      - { name: fault_count, type: integer, source: computed, description: "Count of times this machine entered FAULT", default: 0 }

  # ---------------------------------------------------------------------------
  # Member — loyalty account with prepaid app wallet + loyalty points.
  # ---------------------------------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: phone, type: string, source: input, description: "Member phone, unique among non-CLOSED members" }
      - { name: card_token, type: string, source: input, description: "Opaque app/card token used to authenticate vend & reload" }
      - { name: wallet_cents, type: integer, source: computed, description: "Prepaid app-wallet balance in cents; never negative", default: 0 }
      - { name: loyalty_points, type: integer, source: computed, description: "Accrued loyalty points; never negative", default: 0 }
      - { name: free_wash_credits, type: integer, source: computed, description: "Redeemable free-wash credits earned via loyalty redemption", default: 0 }
      - { name: lifetime_spend_cents, type: integer, source: computed, description: "Cumulative net wallet vend spend (excludes refunded vends)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: ACTIVE, constraints: "ACTIVE,SUSPENDED,CLOSED" }

  # ---------------------------------------------------------------------------
  # Shift — attendant cash-drawer session; reconciled on close.
  # ---------------------------------------------------------------------------
  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: attendant_id, type: string, source: input, description: "Opaque attendant operator id (equals the Attendant's X-User-ID); the staff member who owns this shift" }
      - { name: opening_float_cents, type: integer, source: input, description: "Cash float counted into the drawer at shift open", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | RECONCILING | CLOSED", default: OPEN, constraints: "OPEN,RECONCILING,CLOSED" }
      - { name: coin_collected_cents, type: integer, source: computed, description: "Sum of COIN vend amounts captured during this shift", default: 0 }
      - { name: cash_reload_cents, type: integer, source: computed, description: "Sum of CASH reload principal amounts taken during this shift", default: 0 }
      - { name: cash_refund_paid_cents, type: integer, source: computed, description: "Sum of CASH refund payouts disbursed during this shift", default: 0 }
      - { name: expected_drawer_cents, type: integer, source: computed, description: "Computed expected drawer total = opening_float + coin_collected + cash_reload - cash_refund_paid", default: 0 }
      - { name: counted_drawer_cents, type: integer, source: input, description: "Physically counted drawer total submitted at reconcile; null until RECONCILING" }
      - { name: variance_cents, type: integer, source: computed, description: "counted_drawer_cents - expected_drawer_cents; signed; null until reconciled" }

  # ---------------------------------------------------------------------------
  # VendTransaction — a single machine session purchase. PARALLEL state:
  # payment_status × cycle_status evolve independently.
  # ---------------------------------------------------------------------------
  - name: VendTransaction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the machine being vended" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; null for anonymous COIN/CARD vends" }
      - { name: shift_id, type: string, source: computed, description: "FK -> Shift.id; for a COIN vend captured by an Attendant, the OPEN Shift whose attendant_id == the acting Attendant's X-User-ID; null for non-COIN vends and for Member-captured vends" }
      - { name: payment_method, type: enum, source: input, description: "COIN | CARD | APP_WALLET", constraints: "COIN,CARD,APP_WALLET" }
      - { name: dry_blocks, type: integer, source: input, description: "Number of dryer blocks purchased (DRYER only; ignored/forced 0 for WASHER)", default: 0, constraints: ">= 0" }
      - { name: used_free_credit, type: boolean, source: input, description: "Whether to consume one free_wash_credit (APP_WALLET on a WASHER only)", default: false }
      - { name: quoted_amount_cents, type: integer, source: computed, description: "Vend quote computed at capture from PricingPlan + surge clock; the forward-looking variant", default: 0 }
      - { name: charged_amount_cents, type: integer, source: computed, description: "Amount actually charged to the chosen tender after free-credit/loyalty adjustments", default: 0 }
      - { name: surge_applied, type: boolean, source: computed, description: "True if the capture clock fell inside the plan surge window", default: false }
      - { name: loyalty_points_earned, type: integer, source: computed, description: "Loyalty points accrued by this vend (APP_WALLET net spend only)", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "CAPTURED | REFUNDED — payment dimension", default: CAPTURED, constraints: "CAPTURED,REFUNDED" }
      - { name: cycle_status, type: enum, source: system, description: "RUNNING | COMPLETED | ABORTED — machine-cycle dimension", default: RUNNING, constraints: "RUNNING,COMPLETED,ABORTED" }
      - { name: cycle_ends_at, type: datetime, source: computed, description: "UTC timestamp the purchased cycle completes" }

  # ---------------------------------------------------------------------------
  # ReloadTransaction — top-up of a Member wallet with tiered bonus.
  # ---------------------------------------------------------------------------
  - name: ReloadTransaction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; wallet being reloaded" }
      - { name: shift_id, type: string, source: computed, description: "FK -> Shift.id; for a CASH reload taken by an Attendant, the OPEN Shift whose attendant_id == the acting Attendant's X-User-ID; null for non-CASH tenders and Member-initiated reloads" }
      - { name: tender, type: enum, source: input, description: "CASH | CARD | APP", constraints: "CASH,CARD,APP" }
      - { name: principal_cents, type: integer, source: input, description: "Amount the member paid in, in cents", constraints: "> 0" }
      - { name: bonus_cents, type: integer, source: computed, description: "Bonus credited from the reload tier table", default: 0 }
      - { name: credited_cents, type: integer, source: computed, description: "principal_cents + bonus_cents credited to wallet", default: 0 }
      - { name: status, type: enum, source: system, description: "POSTED — a reload is immediately final; there is no void workflow in scope", default: POSTED, constraints: "POSTED" }

  # ---------------------------------------------------------------------------
  # WdfOrder — wash-dry-fold drop-off priced by weight. Branching pipeline.
  # ---------------------------------------------------------------------------
  - name: WdfOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member dropping off, null for walk-in (paid at pickup)" }
      - { name: intake_attendant_id, type: string, source: input, description: "Opaque attendant operator id (the Attendant's X-User-ID) who took the drop-off" }
      - { name: shift_id, type: string, source: computed, description: "FK -> Shift.id; OPEN shift active at intake" }
      - { name: weight_lb, type: integer, source: input, description: "Net weight in whole pounds at intake", constraints: "> 0" }
      - { name: rush, type: boolean, source: input, description: "Rush surcharge requested at intake", default: false }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Price quoted at intake from weight x rate, floored at minimum, +rush", default: 0 }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Amount settled at pickup; equals quoted_total_cents unless reweighed", default: 0 }
      - { name: pay_method, type: enum, source: input, description: "Tender used at pickup: APP_WALLET | CARD | CASH; null until PAID", constraints: "APP_WALLET,CARD,CASH" }
      - { name: status, type: enum, source: system, description: "DROPPED | WASHING | READY | PAID | CANCELLED", default: DROPPED, constraints: "DROPPED,WASHING,READY,PAID,CANCELLED" }

  # ---------------------------------------------------------------------------
  # RefundClaim — fault/refund adjudication tied to a VendTransaction.
  # Branching: SUBMITTED -> {APPROVED, DENIED}.
  # ---------------------------------------------------------------------------
  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: vend_id, type: string, source: input, description: "FK -> VendTransaction.id; the vend being claimed against" }
      - { name: reported_by_id, type: string, source: input, description: "Opaque actor id who filed the claim (a Member.id when filed by a member, or an Attendant operator id)" }
      - { name: reason, type: enum, source: input, description: "MACHINE_FAULT | NO_CYCLE | DOUBLE_CHARGE", constraints: "MACHINE_FAULT,NO_CYCLE,DOUBLE_CHARGE" }
      - { name: refund_destination, type: enum, source: input, description: "WALLET | CASH | ORIGINAL_TENDER; where an approved refund is paid", default: WALLET, constraints: "WALLET,CASH,ORIGINAL_TENDER" }
      - { name: requested_cents, type: integer, source: computed, description: "Refund amount derived from the vend's charged_amount_cents at submit", default: 0 }
      - { name: approved_cents, type: integer, source: computed, description: "Amount actually paid on approval; 0 if denied", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED", default: SUBMITTED, constraints: "SUBMITTED,APPROVED,DENIED" }

  # ---------------------------------------------------------------------------
  # LostFoundItem — append-ish log of found property; claim/dispose lifecycle.
  # ---------------------------------------------------------------------------
  - name: LostFoundItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; machine where the item was found, null if found on floor" }
      - { name: logged_by_id, type: string, source: input, description: "Opaque attendant operator id (the Attendant's X-User-ID) who logged the item" }
      - { name: description, type: string, source: input, description: "Free-text description of the found item" }
      - { name: found_at, type: datetime, source: computed, description: "UTC capture clock at which the item was logged" }
      - { name: claimed_by_id, type: string, source: input, description: "FK -> Member.id; member who claimed it, null until CLAIMED" }
      - { name: status, type: enum, source: system, description: "LOGGED | CLAIMED | DISPOSED", default: LOGGED, constraints: "LOGGED,CLAIMED,DISPOSED" }

  # ---------------------------------------------------------------------------
  # LoyaltyLedgerEntry — append-only audit of every loyalty-point movement.
  # ---------------------------------------------------------------------------
  - name: LoyaltyLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member whose points moved" }
      - { name: vend_id, type: string, source: input, description: "FK -> VendTransaction.id; the vend that caused accrual/reversal, null for redemptions" }
      - { name: entry_type, type: enum, source: system, description: "ACCRUAL | REVERSAL | REDEMPTION", constraints: "ACCRUAL,REVERSAL,REDEMPTION" }
      - { name: points_delta, type: integer, source: system, description: "Signed change in loyalty_points (positive accrual, negative reversal/redemption)" }
      - { name: balance_after, type: integer, source: system, description: "Member loyalty_points after applying this delta" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- PricingPlan: linear activation lifecycle -----------------------------
  - entity: PricingPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /pricing-plans/{plan_id}/activate"
        actor: Manager
        preconditions:
          - "Plan is DRAFT"
          - "surge_end_hour_utc > surge_start_hour_utc"
          - "reload_bonus_tier2_min_cents >= reload_bonus_tier1_min_cents"
        side_effects:
          - "Any other PricingPlan currently ACTIVE transitions to RETIRED (only one ACTIVE plan at a time)"
          - "All subsequent vend/reload/WDF pricing reads from this plan"
      - from: ACTIVE
        to: RETIRED
        trigger: "system (another plan activated) or POST /pricing-plans/{plan_id}/retire"
        actor: "Manager or system"
        preconditions:
          - "Plan is ACTIVE"
        side_effects:
          - "Plan no longer used for new pricing; historical transactions keep their captured amounts"

  # ---- Machine: CYCLIC operational state machine ----------------------------
  - entity: Machine
    initial_state: IDLE
    terminal_states: []
    note: "Cyclic: IDLE -> RUNNING -> DONE -> IDLE repeats; FAULT and OUT_OF_SERVICE branch off."
    transitions:
      - from: IDLE
        to: RUNNING
        trigger: "POST /machines/{machine_id}/vends (vend captured)"
        actor: "Member or Attendant"
        preconditions:
          - "Machine status is IDLE"
          - "Machine status is not OUT_OF_SERVICE or FAULT"
        side_effects:
          - "current_vend_id set to the new VendTransaction.id"
          - "cycle_ends_at set to capture_clock + purchased_minutes"
          - "Creates VendTransaction with cycle_status=RUNNING, payment_status=CAPTURED"
      - from: RUNNING
        to: DONE
        trigger: "POST /_clock/advance (capture_clock reaches cycle_ends_at) or POST /machines/{machine_id}/complete-cycle"
        actor: "system or Attendant"
        preconditions:
          - "Machine status is RUNNING"
          - "current capture_clock >= Machine.cycle_ends_at (for clock-driven completion)"
        side_effects:
          - "VendTransaction.cycle_status RUNNING -> COMPLETED"
          - "Machine.lifetime_vend_count increments by 1"
          - "current_vend_id retained until cleared"
      - from: DONE
        to: IDLE
        trigger: "POST /machines/{machine_id}/clear"
        actor: "Member or Attendant"
        preconditions:
          - "Machine status is DONE"
        side_effects:
          - "current_vend_id set to null"
          - "cycle_ends_at set to null"
      - from: [RUNNING, DONE]
        to: FAULT
        trigger: "POST /machines/{machine_id}/declare-fault"
        actor: Attendant
        preconditions:
          - "Machine status is RUNNING or DONE"
        side_effects:
          - "Machine.fault_count increments by 1"
          - "The occupying VendTransaction (current_vend_id) cycle_status -> ABORTED (if it was RUNNING)"
          - "current_vend_id retained on the machine for claim linkage until cleared"
      - from: FAULT
        to: IDLE
        trigger: "POST /machines/{machine_id}/clear"
        actor: Attendant
        preconditions:
          - "Machine status is FAULT"
          - "No RefundClaim against current_vend_id is still SUBMITTED"
        side_effects:
          - "current_vend_id set to null"
          - "cycle_ends_at set to null"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /machines/{machine_id}/take-offline"
        actor: Manager
        preconditions:
          - "Machine status is IDLE"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /machines/{machine_id}/return-to-service"
        actor: Manager
        preconditions:
          - "Machine status is OUT_OF_SERVICE"
        side_effects: []

  # ---- VendTransaction: PARALLEL state (payment_status × cycle_status) -------
  - entity: VendTransaction
    initial_state: "payment_status=CAPTURED, cycle_status=RUNNING"
    terminal_states: ["payment_status=REFUNDED", "cycle_status=COMPLETED", "cycle_status=ABORTED"]
    note: "Two independent dimensions. payment_status: CAPTURED -> REFUNDED. cycle_status: RUNNING -> COMPLETED | ABORTED. They evolve on separate triggers."
    transitions:
      - from: "cycle_status=RUNNING"
        to: "cycle_status=COMPLETED"
        trigger: "Machine RUNNING->DONE (clock advance or complete-cycle)"
        actor: "system or Attendant"
        preconditions:
          - "cycle_status is RUNNING"
        side_effects:
          - "Machine.lifetime_vend_count increments"
      - from: "cycle_status=RUNNING"
        to: "cycle_status=ABORTED"
        trigger: "Machine RUNNING->FAULT (declare-fault)"
        actor: Attendant
        preconditions:
          - "cycle_status is RUNNING"
        side_effects: []
      - from: "payment_status=CAPTURED"
        to: "payment_status=REFUNDED"
        trigger: "RefundClaim SUBMITTED->APPROVED (POST /refund-claims/{claim_id}/approve)"
        actor: Manager
        preconditions:
          - "payment_status is CAPTURED"
          - "A RefundClaim against this vend is being APPROVED"
        side_effects:
          - "If payment_method=APP_WALLET and refund_destination=WALLET: Member.wallet_cents credited approved_cents"
          - "Loyalty reversal: a LoyaltyLedgerEntry REVERSAL of -loyalty_points_earned, Member.loyalty_points decremented (floored at 0)"
          - "Member.lifetime_spend_cents reduced by charged_amount_cents (floored at 0)"
          - "If refund_destination=CASH and the referenced vend's shift_id points to an OPEN Shift: that Shift.cash_refund_paid_cents increments by approved_cents"

  # ---- WdfOrder: BRANCHING drop-off pipeline --------------------------------
  - entity: WdfOrder
    initial_state: DROPPED
    terminal_states: [PAID, CANCELLED]
    note: "Fork: from DROPPED either advance to WASHING/READY/PAID or branch to CANCELLED."
    transitions:
      - from: DROPPED
        to: WASHING
        trigger: "POST /wdf-orders/{order_id}/start"
        actor: Attendant
        preconditions:
          - "Order is DROPPED"
        side_effects: []
      - from: WASHING
        to: READY
        trigger: "POST /wdf-orders/{order_id}/ready"
        actor: Attendant
        preconditions:
          - "Order is WASHING"
        side_effects: []
      - from: READY
        to: PAID
        trigger: "POST /wdf-orders/{order_id}/pay"
        actor: "Member or Attendant"
        preconditions:
          - "Order is READY"
          - "If pay_method=APP_WALLET: Member.wallet_cents >= paid_amount_cents and member_id is not null"
          - "If pay_method=APP_WALLET: Member.status is ACTIVE"
        side_effects:
          - "If pay_method=APP_WALLET: Member.wallet_cents debited paid_amount_cents"
          - "If pay_method=CASH and a Shift is OPEN: no drawer field is affected (WDF cash is not coin-collected; recorded as paid only)"
      - from: [DROPPED, WASHING, READY]
        to: CANCELLED
        trigger: "POST /wdf-orders/{order_id}/cancel"
        actor: "Member or Attendant"
        preconditions:
          - "Order is DROPPED, WASHING, or READY (not PAID)"
        side_effects:
          - "Order terminal; no charge collected"

  # ---- RefundClaim: BRANCHING adjudication ----------------------------------
  - entity: RefundClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    note: "SUBMITTED forks to APPROVED or DENIED with divergent side-effect sets."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /refund-claims/{claim_id}/approve"
        actor: Manager
        preconditions:
          - "Claim is SUBMITTED"
          - "Referenced VendTransaction.payment_status is CAPTURED (not already REFUNDED)"
        side_effects:
          - "approved_cents set to requested_cents"
          - "VendTransaction.payment_status CAPTURED -> REFUNDED (cascade: wallet credit, loyalty reversal, lifetime_spend reduction, shift drawer if CASH)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /refund-claims/{claim_id}/deny"
        actor: Manager
        preconditions:
          - "Claim is SUBMITTED"
        side_effects:
          - "approved_cents stays 0; VendTransaction unchanged"

  # ---- Shift: linear reconcile lifecycle ------------------------------------
  - entity: Shift
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /shifts/{shift_id}/begin-reconcile"
        actor: Attendant
        preconditions:
          - "Shift is OPEN"
          - "Attendant acting is the shift owner (attendant_id == X-User-ID)"
        side_effects:
          - "Shift stops being the active shift for new COIN vends / CASH reloads"
          - "expected_drawer_cents recomputed and frozen"
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /shifts/{shift_id}/close"
        actor: Attendant
        preconditions:
          - "Shift is RECONCILING"
          - "counted_drawer_cents provided"
        side_effects:
          - "variance_cents = counted_drawer_cents - expected_drawer_cents"

  # ---- LostFoundItem: branching claim/dispose -------------------------------
  - entity: LostFoundItem
    initial_state: LOGGED
    terminal_states: [CLAIMED, DISPOSED]
    transitions:
      - from: LOGGED
        to: CLAIMED
        trigger: "POST /lost-found/{item_id}/claim"
        actor: Attendant
        preconditions:
          - "Item is LOGGED"
        side_effects:
          - "claimed_by_id set to the claiming Member.id"
      - from: LOGGED
        to: DISPOSED
        trigger: "POST /lost-found/{item_id}/dispose"
        actor: Attendant
        preconditions:
          - "Item is LOGGED"
          - "Item has been LOGGED for at least the disposal-hold window (capture_clock - found_at >= DISPOSAL_HOLD_HOURS)"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true races only, OCC on parent version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: vend-create-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /machines/{machine_id}/vends"
    occ_field: "expected_machine_version"
    description: |
      Capturing a vend against a Machine whose version has advanced since the
      client last observed it is rejected. The new vend legitimately occupies an
      IDLE machine and bumps the machine's version; a writer whose view of the
      machine predates a just-captured vend (or a just-applied status change) is
      stale and must re-read before vending.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: refund-approve-stale-claim
    parent_entity: RefundClaim
    write_endpoint: "POST /refund-claims/{claim_id}/approve"
    occ_field: "expected_claim_version"
    description: |
      Approving a RefundClaim whose version has advanced since the client last
      observed it is rejected. Adjudication legitimately mutates the claim (and
      cascades a refund); a manager acting on a stale view of the claim must
      re-read to avoid double-approving a claim another adjudication already moved.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- (1) vend quote — forward-looking variant (dual-variant #1, mode (a)) --
  - name: vend_quote_cents
    trigger: "POST /machines/{machine_id}/vends (capture) — computes quoted_amount_cents"
    algorithm: forward_looking
    formula: |
      # Forward-looking: priced from the PricingPlan and the surge clock as projected
      # at capture, BEFORE any free-credit/loyalty adjustment.
      plan = the ACTIVE PricingPlan
      if Machine.machine_type == WASHER:
          base = plan.wash_base_cents
      else:  # DRYER
          base = plan.dry_base_cents_per_block * dry_blocks   # dry_blocks >= 1 required
      hour = capture_clock.hour_utc
      in_surge = (plan.surge_start_hour_utc <= hour < plan.surge_end_hour_utc)
      surge_applied = in_surge
      mult_bps = plan.surge_multiplier_bps if in_surge else 10000
      quoted_amount_cents = round_half_up( base * mult_bps / 10000 )
    input_set: "Single ACTIVE PricingPlan; the target Machine's type; the vend's dry_blocks; the capture clock hour."
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up at the multiplier step"
    variants:
      - name: washer_quote
        when: "Machine.machine_type == WASHER"
        difference: "base = wash_base_cents; dry_blocks ignored/forced 0"
      - name: dryer_quote
        when: "Machine.machine_type == DRYER"
        difference: "base = dry_base_cents_per_block * dry_blocks; requires dry_blocks >= 1"

  # ---- (2) vend charged amount — chronological/applied variant (dual-variant #1, the divergent twin) ----
  - name: vend_charged_cents
    trigger: "POST /machines/{machine_id}/vends (capture) — computes charged_amount_cents and loyalty_points_earned"
    algorithm: chronological
    formula: |
      # Applied at capture, AFTER quote, in this PINNED order:
      #  1. Start from quoted_amount_cents.
      #  2. Free-wash credit: if used_free_credit AND payment_method==APP_WALLET AND
      #     Machine.machine_type==WASHER AND Member.free_wash_credits >= 1:
      #         charged_amount_cents = 0; consume one free_wash_credit.
      #     (Free credit only zeroes a WASHER vend; never applies to DRYER or non-APP tenders.)
      #  3. Else charged_amount_cents = quoted_amount_cents.
      #  4. Loyalty accrual (APP_WALLET only, and only on the net amount actually charged):
      #         loyalty_points_earned = floor(charged_amount_cents / plan.loyalty_cents_per_point)
      #     COIN/CARD vends and free-credit (charged=0) vends earn 0 points.
      #  5. Member.lifetime_spend_cents += charged_amount_cents (APP_WALLET only).
      input_set: "quoted_amount_cents from vend_quote_cents; the vend's tender; free-credit flag; member balances; ACTIVE plan."
    constants: {}
    precision: "integer cents; floor for loyalty points"
    variants:
      - name: charged_with_free_credit
        when: "used_free_credit applies on an APP_WALLET WASHER vend"
        difference: "charged_amount_cents forced to 0; loyalty_points_earned = 0; one free_wash_credit consumed"
      - name: charged_full
        when: "no free credit; quote charged in full"
        difference: "charged_amount_cents = quoted_amount_cents; loyalty accrues only for APP_WALLET"

  # ---- (3) reload bonus — tiered/threshold (combinatorial mode (a): tiered selection) ----
  - name: reload_bonus_cents
    trigger: "POST /members/{member_id}/reloads — computes bonus_cents and credited_cents"
    algorithm: tiered_pricing
    formula: |
      # Single-tier selection by principal threshold (NOT marginal/stacked).
      # The HIGHEST tier whose minimum is satisfied wins; tiers do not stack.
      plan = the ACTIVE PricingPlan
      if principal_cents >= plan.reload_bonus_tier2_min_cents:
          bonus_bps = plan.reload_bonus_tier2_bps
      elif principal_cents >= plan.reload_bonus_tier1_min_cents:
          bonus_bps = plan.reload_bonus_tier1_bps
      else:
          bonus_bps = 0
      bonus_cents = floor( principal_cents * bonus_bps / 10000 )
      credited_cents = principal_cents + bonus_cents
      # Side effect: Member.wallet_cents += credited_cents
    input_set: "principal_cents; ACTIVE plan tier thresholds and rates."
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, floor on bonus"

  # ---- (4) WDF total — weight pricing with floor + rush (combinatorial mode (b): rounding order) ----
  - name: wdf_total_cents
    trigger: "POST /wdf-orders (intake) — computes quoted_total_cents"
    algorithm: tiered_pricing
    formula: |
      # PINNED order of operations (rounding/flooring order matters here):
      #  1. raw = weight_lb * plan.wdf_rate_cents_per_lb            (exact integer)
      #  2. floored = max(raw, plan.wdf_minimum_cents)              (apply minimum BEFORE rush)
      #  3. if rush: total = floored + round_half_up(floored * RUSH_BPS / 10000)
      #     else:    total = floored
      #  quoted_total_cents = total
      #  NOTE: rush surcharge is computed on the floored subtotal, not on raw — so a
      #  light load that hits the minimum still pays rush on the minimum, not on raw.
    input_set: "weight_lb; rush flag; ACTIVE plan wdf_rate_cents_per_lb and wdf_minimum_cents."
    constants:
      RUSH_BPS: 2500
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up on the rush component only"

  # ---- (5) shift drawer reconciliation — aggregation (dual-variant #2 subject: Shift) ----
  - name: shift_expected_drawer_cents
    trigger: "POST /shifts/{shift_id}/begin-reconcile and any COIN vend / CASH reload / CASH refund during OPEN shift"
    algorithm: aggregation
    formula: |
      coin_collected_cents = sum( VendTransaction.charged_amount_cents
                                  WHERE shift_id == this shift
                                    AND payment_method == COIN
                                    AND payment_status == CAPTURED )
      cash_reload_cents     = sum( ReloadTransaction.principal_cents
                                  WHERE shift_id == this shift
                                    AND tender == CASH
                                    AND status == POSTED )
      cash_refund_paid_cents = sum( RefundClaim.approved_cents
                                  WHERE RefundClaim.status == APPROVED
                                    AND RefundClaim.refund_destination == CASH
                                    AND the claim's referenced VendTransaction.shift_id == this shift.id )
      expected_drawer_cents = opening_float_cents
                            + coin_collected_cents
                            + cash_reload_cents
                            - cash_refund_paid_cents
      # variance_cents (computed at close) = counted_drawer_cents - expected_drawer_cents
    input_set: "All COIN CAPTURED vends with shift_id == this shift, CASH POSTED reloads with shift_id == this shift, and APPROVED CASH-destination refunds whose referenced vend's shift_id == this shift."
    constants: {}
    precision: "integer cents; coin vends that later become REFUNDED are NOT removed from coin_collected (the cash was in the drawer); the CASH refund payout is subtracted separately."
    variants:
      - name: expected_drawer
        when: "computed on begin-reconcile and frozen"
        difference: "the system's forward computation of what SHOULD be in the drawer"
      - name: counted_drawer
        when: "submitted by attendant at close"
        difference: "the physically counted figure; variance = counted - expected can be non-zero (cash discrepancy)"

  # ---- (6) refund requested amount — derived from vend (dual-variant #2 risk/refund subject) ----
  - name: refund_requested_cents
    trigger: "POST /refund-claims (submit) — computes requested_cents"
    algorithm: aggregation
    formula: |
      # requested_cents reflects what the customer is out-of-pocket for THIS vend:
      vend = the referenced VendTransaction
      if vend.charged_amount_cents == 0:
          requested_cents = 0          # free-credit vend: nothing charged, nothing to refund
      else:
          requested_cents = vend.charged_amount_cents
      # On approval, approved_cents = requested_cents (full-refund policy; no partials).
    input_set: "The single referenced VendTransaction's charged_amount_cents."
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (machine, member, plan, vend, shift, order, claim, item), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers within declared constraints (weight_lb>0, principal_cents>0, dry_blocks>=0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_referential
    check: "Ownership: a Member (entity_backed) acting on a self-owned resource must have X-User-ID == the resource's member_id (own reload/redeem, own WDF pay/cancel); an Attendant (opaque) acting on a shift must have X-User-ID == Shift.attendant_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "member reload/redeem/WDF-pay/WDF-cancel (member-owned), shift begin-reconcile/close"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (machine status, vend payment/cycle status, order status, claim status, shift status, plan status, item status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_referential
    check: "OCC: expected_<parent>_version matches the parent's current version on vend-create and refund-approve"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /machines/{id}/vends, POST /refund-claims/{id}/approve"

  - priority: 8
    category: business_constraint
    check: "No ACTIVE PricingPlan exists when a vend/reload/WDF intake needs pricing"
    error_id: ERR_NO_ACTIVE_PLAN
    http_status: 409
    applies_to: "POST /machines/{id}/vends, POST /members/{id}/reloads, POST /wdf-orders"

  - priority: 9
    category: business_safety
    check: "Machine availability: vend rejected if machine not IDLE (RUNNING/DONE/FAULT/OUT_OF_SERVICE)"
    error_id: ERR_MACHINE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /machines/{id}/vends"

  - priority: 10
    category: business_constraint
    check: "DRYER vend requires dry_blocks >= 1; WASHER vend ignores dry_blocks"
    error_id: ERR_DRY_BLOCKS_REQUIRED
    http_status: 422
    applies_to: "POST /machines/{id}/vends"

  - priority: 11
    category: business_safety
    check: "Member is ACTIVE for APP_WALLET vend, reload, WDF APP_WALLET pay, and free-credit use (SUSPENDED/CLOSED rejected)"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /machines/{id}/vends (APP_WALLET), POST /members/{id}/reloads, WDF pay"

  - priority: 12
    category: business_constraint
    check: "Free-wash credit use requires APP_WALLET tender on a WASHER and Member.free_wash_credits >= 1"
    error_id: ERR_NO_FREE_CREDIT
    http_status: 409
    applies_to: "POST /machines/{id}/vends"

  - priority: 13
    category: business_fiscal
    check: "APP_WALLET vend / WDF APP_WALLET pay: Member.wallet_cents >= charged amount (insufficient balance rejected)"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 409
    applies_to: "POST /machines/{id}/vends (APP_WALLET), POST /wdf-orders/{id}/pay (APP_WALLET)"

  - priority: 14
    category: business_constraint
    check: "Loyalty redemption requires Member.loyalty_points >= plan.loyalty_redeem_threshold_points"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /members/{id}/redeem"

  - priority: 15
    category: business_referential
    check: "RefundClaim against a vend whose payment_status is already REFUNDED is rejected (no double refund)"
    error_id: ERR_ALREADY_REFUNDED
    http_status: 409
    applies_to: "POST /refund-claims, POST /refund-claims/{id}/approve"

  - priority: 16
    category: business_temporal
    check: "Disposing a LostFoundItem before the disposal-hold window elapses is rejected"
    error_id: ERR_DISPOSAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /lost-found/{id}/dispose"

  - priority: 17
    category: business_constraint
    check: "Only one OPEN shift per attendant; opening a second OPEN shift for the same attendant is rejected"
    error_id: ERR_SHIFT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /shifts"

  - priority: 18
    category: business_constraint
    check: "Member.phone unique among non-CLOSED members"
    error_id: ERR_DUPLICATE_PHONE
    http_status: 409
    applies_to: "POST /members"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- PricingPlan ----------------------------------------------------------
  - method: POST
    path: "/pricing-plans"
    description: "Create a DRAFT pricing plan"
    roles: [Manager]
    code: 201
    input: [label, wash_base_cents, dry_base_cents_per_block, "dry_block_minutes?", "surge_multiplier_bps?", "surge_start_hour_utc?", "surge_end_hour_utc?", wdf_rate_cents_per_lb, "wdf_minimum_cents?", "reload_bonus_tier1_min_cents?", "reload_bonus_tier1_bps?", "reload_bonus_tier2_min_cents?", "reload_bonus_tier2_bps?", "loyalty_cents_per_point?", "loyalty_redeem_threshold_points?"]
    output: PricingPlan
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/pricing-plans"
    description: "List pricing plans (filter by status)"
    roles: [Manager, Attendant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PricingPlan[]
    side_effects: []

  - method: GET
    path: "/pricing-plans/{plan_id}"
    description: "Get a pricing plan"
    roles: [Manager, Attendant]
    code: 200
    input: []
    output: PricingPlan
    side_effects: []

  - method: POST
    path: "/pricing-plans/{plan_id}/activate"
    description: "Activate a DRAFT plan; retires the prior ACTIVE plan"
    roles: [Manager]
    code: 200
    input: []
    output: PricingPlan
    side_effects: ["status DRAFT->ACTIVE", "prior ACTIVE plan -> RETIRED (cascade)"]

  - method: POST
    path: "/pricing-plans/{plan_id}/retire"
    description: "Retire an ACTIVE plan"
    roles: [Manager]
    code: 200
    input: []
    output: PricingPlan
    side_effects: ["status ACTIVE->RETIRED"]

  # ---- Machine --------------------------------------------------------------
  - method: POST
    path: "/machines"
    description: "Register a machine"
    roles: [Manager]
    code: 201
    input: [label, machine_type, capacity_lb, "cycle_minutes?"]
    output: Machine
    side_effects: ["status=IDLE, lifetime_vend_count=0, fault_count=0"]

  - method: GET
    path: "/machines"
    description: "List machines (filter by status/type/current_vend_id). current_vend_id filter is the reverse-reachability channel for Machine.current_vend_id -> VendTransaction."
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["status?", "machine_type?", "current_vend_id?", "limit?", "offset?"]
    output: Machine[]
    side_effects: []

  - method: GET
    path: "/machines/{machine_id}"
    description: "Get a machine (real-time status)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: Machine
    side_effects: []

  - method: GET
    path: "/machines/{machine_id}/vends"
    description: "List vend transactions for a machine (reverse-reachability for VendTransaction.machine_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: VendTransaction[]
    side_effects: []

  - method: GET
    path: "/vends/{vend_id}"
    description: "Get a single vend transaction"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: VendTransaction
    side_effects: []

  - method: GET
    path: "/vends"
    description: "List/filter vend transactions (reverse-reachability for VendTransaction.machine_id, .member_id, .shift_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["machine_id?", "member_id?", "shift_id?", "payment_status?", "cycle_status?", "limit?", "offset?"]
    output: VendTransaction[]
    side_effects: []

  - method: POST
    path: "/machines/{machine_id}/vends"
    description: "Capture a vend on an IDLE machine (starts cycle). OCC on machine version."
    roles: [Member, Attendant]
    code: 201
    input: [payment_method, expected_machine_version, "member_id?", "dry_blocks?", "used_free_credit?", "card_token?"]
    output: VendTransaction
    side_effects:
      - "Computes quoted_amount_cents (vend_quote_cents), charged_amount_cents + loyalty_points_earned (vend_charged_cents)"
      - "Machine IDLE->RUNNING; current_vend_id set; cycle_ends_at set; increments Machine.version by 1"
      - "If APP_WALLET: Member.wallet_cents debited charged_amount_cents; lifetime_spend_cents += charged_amount_cents; loyalty accrual (LoyaltyLedgerEntry ACCRUAL); free_wash_credits consumed if used_free_credit"
      - "If COIN and the acting Attendant has an OPEN Shift (Shift.attendant_id == X-User-ID): shift_id stamped; that Shift's coin_collected_cents recomputed"
      - "VendTransaction created with payment_status=CAPTURED, cycle_status=RUNNING"

  - method: POST
    path: "/machines/{machine_id}/complete-cycle"
    description: "Attendant marks a RUNNING machine's cycle complete"
    roles: [Attendant]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine RUNNING->DONE", "occupying VendTransaction cycle_status RUNNING->COMPLETED", "lifetime_vend_count++"]

  - method: POST
    path: "/machines/{machine_id}/clear"
    description: "Clear a DONE or FAULT machine back to IDLE"
    roles: [Member, Attendant]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine DONE/FAULT->IDLE", "current_vend_id=null", "cycle_ends_at=null"]

  - method: POST
    path: "/machines/{machine_id}/declare-fault"
    description: "Attendant declares a machine faulted"
    roles: [Attendant]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine RUNNING/DONE->FAULT", "fault_count++", "occupying RUNNING vend cycle_status->ABORTED"]

  - method: POST
    path: "/machines/{machine_id}/take-offline"
    description: "Take an IDLE machine OUT_OF_SERVICE"
    roles: [Manager]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine IDLE->OUT_OF_SERVICE"]

  - method: POST
    path: "/machines/{machine_id}/return-to-service"
    description: "Return an OUT_OF_SERVICE machine to IDLE"
    roles: [Manager]
    code: 200
    input: []
    output: Machine
    side_effects: ["Machine OUT_OF_SERVICE->IDLE"]

  # ---- Member ---------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [Manager, Attendant]
    code: 201
    input: [full_name, phone, card_token]
    output: Member
    side_effects: ["status=ACTIVE, wallet_cents=0, loyalty_points=0, free_wash_credits=0, lifetime_spend_cents=0"]

  - method: GET
    path: "/members"
    description: "List members (filter by status/phone)"
    roles: [Manager, Attendant]
    code: 200
    input: ["status?", "phone?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/members/{member_id}"
    description: "Get a member (wallet/points balances)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{member_id}/reloads"
    description: "Reload a member wallet with tiered bonus"
    roles: [Member, Attendant]
    code: 201
    input: [tender, principal_cents]
    output: ReloadTransaction
    side_effects:
      - "Computes bonus_cents + credited_cents (reload_bonus_cents)"
      - "Member.wallet_cents += credited_cents"
      - "If tender=CASH and taken by an Attendant with an OPEN Shift (Shift.attendant_id == X-User-ID): shift_id stamped; that Shift's cash_reload_cents recomputed"
      - "ReloadTransaction status=POSTED"

  - method: GET
    path: "/members/{member_id}/reloads"
    description: "List a member's reloads (reverse-reachability for ReloadTransaction.member_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: ReloadTransaction[]
    side_effects: []

  - method: GET
    path: "/reloads/{reload_id}"
    description: "Get a single reload transaction"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: ReloadTransaction
    side_effects: []

  - method: GET
    path: "/reloads"
    description: "List/filter reload transactions (reverse-reachability for ReloadTransaction.member_id, .shift_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["member_id?", "shift_id?", "tender?", "status?", "limit?", "offset?"]
    output: ReloadTransaction[]
    side_effects: []

  - method: GET
    path: "/members/{member_id}/vends"
    description: "List a member's vends (reverse-reachability for VendTransaction.member_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: VendTransaction[]
    side_effects: []

  - method: GET
    path: "/members/{member_id}/loyalty-ledger"
    description: "List a member's loyalty ledger (reverse-reachability for LoyaltyLedgerEntry.member_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/loyalty-ledger/{entry_id}"
    description: "Get a single loyalty ledger entry"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: LoyaltyLedgerEntry
    side_effects: []

  - method: GET
    path: "/loyalty-ledger"
    description: "List/filter loyalty ledger entries (reverse-reachability for LoyaltyLedgerEntry.member_id, .vend_id)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["member_id?", "vend_id?", "entry_type?", "limit?", "offset?"]
    output: LoyaltyLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/members/{member_id}/redeem"
    description: "Redeem loyalty points for a free-wash credit"
    roles: [Member, Attendant]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Member.loyalty_points -= plan.loyalty_redeem_threshold_points"
      - "Member.free_wash_credits += 1"
      - "LoyaltyLedgerEntry REDEMPTION (points_delta negative)"

  - method: PATCH
    path: "/members/{member_id}"
    description: "Update member status (suspend/reactivate/close)"
    roles: [Manager]
    code: 200
    input: ["status?", "full_name?", "phone?"]
    output: Member
    side_effects: ["status transitions ACTIVE/SUSPENDED/CLOSED"]

  # ---- Shift ----------------------------------------------------------------
  - method: POST
    path: "/shifts"
    description: "Open an attendant shift (cash drawer)"
    roles: [Attendant]
    code: 201
    input: [attendant_id, opening_float_cents]
    output: Shift
    side_effects: ["status=OPEN", "becomes the active shift for COIN vends / CASH reloads"]

  - method: GET
    path: "/shifts"
    description: "List shifts (filter by status/attendant)"
    roles: [Manager, Attendant]
    code: 200
    input: ["status?", "attendant_id?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []

  - method: GET
    path: "/shifts/{shift_id}"
    description: "Get a shift (drawer totals)"
    roles: [Manager, Attendant]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/shifts/{shift_id}/begin-reconcile"
    description: "Move an OPEN shift to RECONCILING and freeze expected drawer"
    roles: [Attendant]
    code: 200
    input: []
    output: Shift
    side_effects: ["status OPEN->RECONCILING", "expected_drawer_cents frozen (shift_expected_drawer_cents)"]

  - method: POST
    path: "/shifts/{shift_id}/close"
    description: "Close a RECONCILING shift with counted drawer; compute variance"
    roles: [Attendant]
    code: 200
    input: [counted_drawer_cents]
    output: Shift
    side_effects: ["status RECONCILING->CLOSED", "variance_cents = counted_drawer_cents - expected_drawer_cents"]

  # ---- WdfOrder -------------------------------------------------------------
  - method: POST
    path: "/wdf-orders"
    description: "Intake a wash-dry-fold drop-off priced by weight"
    roles: [Attendant]
    code: 201
    input: [intake_attendant_id, weight_lb, "member_id?", "rush?"]
    output: WdfOrder
    side_effects: ["Computes quoted_total_cents (wdf_total_cents)", "status=DROPPED", "shift_id stamped if OPEN shift"]

  - method: GET
    path: "/wdf-orders"
    description: "List WDF orders (filter by status/member)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["status?", "member_id?", "intake_attendant_id?", "shift_id?", "limit?", "offset?"]
    output: WdfOrder[]
    side_effects: []

  - method: GET
    path: "/wdf-orders/{order_id}"
    description: "Get a WDF order"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: WdfOrder
    side_effects: []

  - method: POST
    path: "/wdf-orders/{order_id}/start"
    description: "Begin washing a dropped order"
    roles: [Attendant]
    code: 200
    input: []
    output: WdfOrder
    side_effects: ["status DROPPED->WASHING"]

  - method: POST
    path: "/wdf-orders/{order_id}/ready"
    description: "Mark a washing order ready for pickup"
    roles: [Attendant]
    code: 200
    input: []
    output: WdfOrder
    side_effects: ["status WASHING->READY"]

  - method: POST
    path: "/wdf-orders/{order_id}/pay"
    description: "Settle a READY order at pickup"
    roles: [Member, Attendant]
    code: 200
    input: [pay_method]
    output: WdfOrder
    side_effects: ["status READY->PAID", "paid_amount_cents set", "If APP_WALLET: Member.wallet_cents debited"]

  - method: POST
    path: "/wdf-orders/{order_id}/cancel"
    description: "Cancel a non-paid order"
    roles: [Member, Attendant]
    code: 200
    input: []
    output: WdfOrder
    side_effects: ["status DROPPED/WASHING/READY->CANCELLED"]

  # ---- RefundClaim ----------------------------------------------------------
  - method: POST
    path: "/refund-claims"
    description: "File a refund claim against a vend"
    roles: [Member, Attendant]
    code: 201
    input: [vend_id, reported_by_id, reason, "refund_destination?"]
    output: RefundClaim
    side_effects: ["Computes requested_cents (refund_requested_cents)", "status=SUBMITTED"]

  - method: GET
    path: "/refund-claims"
    description: "List refund claims (filter by status/vend/reporter)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["status?", "vend_id?", "reported_by_id?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []

  - method: GET
    path: "/refund-claims/{claim_id}"
    description: "Get a refund claim"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: POST
    path: "/refund-claims/{claim_id}/approve"
    description: "Approve a refund claim (cascade refund). OCC on claim version."
    roles: [Manager]
    code: 200
    input: [expected_claim_version]
    output: RefundClaim
    side_effects:
      - "status SUBMITTED->APPROVED; approved_cents=requested_cents; increments RefundClaim.version by 1"
      - "VendTransaction.payment_status CAPTURED->REFUNDED (cascade)"
      - "If APP_WALLET & WALLET dest: Member.wallet_cents += approved_cents"
      - "Loyalty reversal: LoyaltyLedgerEntry REVERSAL; Member.loyalty_points -= loyalty_points_earned (floored at 0)"
      - "Member.lifetime_spend_cents -= charged_amount_cents (floored at 0)"
      - "If CASH dest & the referenced vend's shift_id is an OPEN Shift: that Shift.cash_refund_paid_cents += approved_cents"

  - method: POST
    path: "/refund-claims/{claim_id}/deny"
    description: "Deny a refund claim"
    roles: [Manager]
    code: 200
    input: []
    output: RefundClaim
    side_effects: ["status SUBMITTED->DENIED; approved_cents stays 0; vend unchanged"]

  # ---- LostFoundItem --------------------------------------------------------
  - method: POST
    path: "/lost-found"
    description: "Log a found item"
    roles: [Attendant]
    code: 201
    input: [logged_by_id, description, "machine_id?"]
    output: LostFoundItem
    side_effects: ["status=LOGGED", "found_at set to capture clock"]

  - method: GET
    path: "/lost-found"
    description: "List lost-and-found items (filter by status/machine)"
    roles: [Manager, Attendant, Member]
    code: 200
    input: ["status?", "machine_id?", "logged_by_id?", "claimed_by_id?", "limit?", "offset?"]
    output: LostFoundItem[]
    side_effects: []

  - method: GET
    path: "/lost-found/{item_id}"
    description: "Get a lost-and-found item"
    roles: [Manager, Attendant, Member]
    code: 200
    input: []
    output: LostFoundItem
    side_effects: []

  - method: POST
    path: "/lost-found/{item_id}/claim"
    description: "Mark an item claimed by a member"
    roles: [Attendant]
    code: 200
    input: [claimed_by_id]
    output: LostFoundItem
    side_effects: ["status LOGGED->CLAIMED", "claimed_by_id set"]

  - method: POST
    path: "/lost-found/{item_id}/dispose"
    description: "Dispose an item after the hold window"
    roles: [Attendant]
    code: 200
    input: []
    output: LostFoundItem
    side_effects: ["status LOGGED->DISPOSED"]

  # ---- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving: set the server capture clock to an absolute UTC instant; completes any RUNNING cycle whose cycle_ends_at <= the new clock"
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Server capture clock set to to_iso8601"
      - "Every Machine RUNNING with cycle_ends_at <= clock: Machine RUNNING->DONE; its vend cycle_status RUNNING->COMPLETED; lifetime_vend_count++"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed actor acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (machine, member, plan, vend, shift, order, claim, item) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, enum out of range, or integer violates a declared constraint" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_NO_ACTIVE_PLAN, http: 409, condition: "Pricing requested (vend/reload/WDF intake) but no PricingPlan is ACTIVE" }
  - { id: ERR_MACHINE_UNAVAILABLE, http: 409, condition: "Vend attempted on a machine that is not IDLE (RUNNING/DONE/FAULT/OUT_OF_SERVICE)" }
  - { id: ERR_DRY_BLOCKS_REQUIRED, http: 422, condition: "DRYER vend submitted with dry_blocks < 1" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member is SUSPENDED or CLOSED for an operation requiring ACTIVE (APP_WALLET vend, reload, WDF APP_WALLET pay, free-credit use, redeem)" }
  - { id: ERR_NO_FREE_CREDIT, http: 409, condition: "used_free_credit set but member has no free_wash_credits, or tender is not APP_WALLET on a WASHER" }
  - { id: ERR_INSUFFICIENT_WALLET, http: 409, condition: "APP_WALLET vend or WDF APP_WALLET pay where Member.wallet_cents < amount charged" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "Redeem attempted with Member.loyalty_points < plan.loyalty_redeem_threshold_points" }
  - { id: ERR_ALREADY_REFUNDED, http: 409, condition: "Refund claim/approval against a vend whose payment_status is already REFUNDED" }
  - { id: ERR_DISPOSAL_HOLD_ACTIVE, http: 409, condition: "Dispose attempted before the disposal-hold window elapsed" }
  - { id: ERR_SHIFT_ALREADY_OPEN, http: 409, condition: "Opening a shift for an attendant who already has an OPEN shift" }
  - { id: ERR_DUPLICATE_PHONE, http: 409, condition: "Member phone collides with an existing non-CLOSED member" }
  - { id: ERR_VALIDATION, http: 422, condition: "Pagination/query parameter out of range (limit<1 or limit>100, offset<0)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Store operator: configures machines and pricing plans, adjudicates refund claims, manages member status, takes machines offline, advances the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing-plans, POST /pricing-plans/{id}/activate, POST /pricing-plans/{id}/retire"
      - "POST /machines, POST /machines/{id}/take-offline, POST /machines/{id}/return-to-service"
      - "PATCH /members/{id}"
      - "POST /refund-claims/{id}/approve, POST /refund-claims/{id}/deny"
      - "POST /_clock/advance"
    shared_operations:
      - "GET on all collections and resources"
      - "POST /members (with Attendant)"

  - name: Attendant
    description: "On-floor staff operator: opens/reconciles their own cash-drawer shift, intakes & processes WDF orders, declares faults, completes/clears cycles, logs/claims/disposes lost-and-found, registers members, captures vends and reloads on behalf of walk-ins. opaque — X-User-ID is an operator handle, not a persisted entity; shift ownership compares X-User-ID to Shift.attendant_id (both opaque strings)."
    identity: "opaque"
    exclusive_operations:
      - "POST /shifts, POST /shifts/{id}/begin-reconcile, POST /shifts/{id}/close (own shift only)"
      - "POST /wdf-orders, POST /wdf-orders/{id}/start, POST /wdf-orders/{id}/ready"
      - "POST /machines/{id}/complete-cycle, POST /machines/{id}/declare-fault"
      - "POST /lost-found, POST /lost-found/{id}/claim, POST /lost-found/{id}/dispose"
    shared_operations:
      - "POST /members (with Manager)"
      - "POST /machines/{id}/vends, POST /machines/{id}/clear (with Member)"
      - "POST /members/{id}/reloads, POST /members/{id}/redeem (with Member)"
      - "POST /wdf-orders/{id}/pay, POST /wdf-orders/{id}/cancel (with Member)"
      - "POST /refund-claims (with Member)"
      - "GET on machines, members, plans, shifts, orders, claims, lost-found, ledgers"

  - name: Member
    description: "Self-service customer: captures vends, clears finished machines, reloads/redeems own wallet, pays/cancels own WDF orders, files refund claims. entity_backed — X-User-ID equals the Member.id; ownership checks compare X-User-ID to the resource's member_id."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /machines/{id}/vends, POST /machines/{id}/clear (with Attendant)"
      - "POST /members/{id}/reloads, POST /members/{id}/redeem (own wallet; with Attendant)"
      - "POST /wdf-orders/{id}/pay, POST /wdf-orders/{id}/cancel (own order; with Attendant)"
      - "POST /refund-claims (with Attendant)"
      - "GET on machines, own member record, own reloads/vends/ledger, plans, orders, claims, lost-found"
