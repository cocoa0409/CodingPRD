              captures: { run15_id: "$.data.id" }
            - call: "POST /processing-runs/${run15_id}/edit"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /processing-runs/${run15_id}/weight"
              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
              captures: { run15_projected: "$.data.projected_average_audience" }
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m15_id}", scope_edit_rule_set_id: "${rs15_id}", auditor_note: "Initial accreditation review of DMA-515" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-15"
              captures: { audit15a_id: "$.data.id" }
            - call: "POST /accreditation-audits/${audit15a_id}/finalize"
              payload: { outcome: "DENIED", limitation_disclosures: ["SMALL_CELL_SAMPLE"] }
              as: AccreditationAuditor
