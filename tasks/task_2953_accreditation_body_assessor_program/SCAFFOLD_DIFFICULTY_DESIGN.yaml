              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Aina Boundary", email: "aina.boundary@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { a_id: $.data.id }
            - call: "POST /accreditation/assessors/${a_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-06-01" }
              as: AssessmentManager
              captures: { a_q_id: $.data.id }
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Bo Underpoints", email: "bo.underpoints@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { b_id: $.data.id }
            - call: "POST /accreditation/assessors/${b_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-06-01" }
              as: AssessmentManager
              captures: { b_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${b_q_id}/verify-evidence"
              payload: { verified_years_experience: 6, verified_witness_days: 3, verified_training_modules: 1 }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Cai Underdays", email: "cai.underdays@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { c_id: $.data.id }
            - call: "POST /accreditation/assessors/${c_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 9, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-06-01" }
              as: AssessmentManager
              captures: { c_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${c_q_id}/verify-evidence"
              payload: { verified_years_experience: 9, verified_witness_days: 3, verified_training_modules: 1 }
              as: SchemeManager
          trigger:
            - call: "POST /accreditation/qualifications/${a_q_id}/verify-evidence"
              payload: { verified_years_experience: 6, verified_witness_days: 4, verified_training_modules: 1 }
              as: SchemeManager
          assert:
            - "AssessorQualification.${a_q_id}.verified_points == 60.00, exactly equal to qualification_points_required"
            - "AssessorQualification.${a_q_id}.status == GRANTED - the comparison is >= and not >"
            - "AssessorQualification.${a_q_id}.granted_on == 2026-08-10 and expires_on == 2030-08-09"
            - "Assessor.${a_id}.granted_qualification_count == 1"
            - "AssessorQualification.${b_q_id}.verified_points == 55.00 and status == PENDING with granted_on null - one witness day below the points boundary"
            - "AssessorQualification.${c_q_id}.verified_points == 67.00 and status == PENDING with granted_on null - above the points boundary but one day below the LEAD_ASSESSOR witness floor of 4"
            - "Assessor.${b_id}.granted_qualification_count == 0 and Assessor.${c_id}.granted_qualification_count == 0"

      - name: close_assessment_with_only_observation_findings_treats_blocking_set_as_empty
