            - "HTTP status == 409 and ${error_id} == ERR_DEVICE_QC_LOCKED"
            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == PT_UNSUCCESSFUL"
            - "TestResult.${tr1_id}.posting_status == PENDING_REVIEW (not HELD: the PT branch does not hold results)"
            - "TestResult.${tr1_id}.posted_value == null and TestResult.${tr1_id}.posted_by_user_id == null and TestResult.${tr1_id}.posted_at == null"
            - "ProficiencyEnrollment.${enr_id}.status == UNSUCCESSFUL_PARTICIPATION and ProficiencyEnrollment.${enr_id}.fail_count_last_three == 2"
            - "TestSite.${site_id}.pt_unsuccessful_count == 2 and TestSite.${site_id}.held_result_count == 0"
            - "TestSite.${site_id}.inspection_readiness_score == 94.00 (pt_penalty 6.00)"
            - "TestSite.${site_id}.oversight_posture == OPEN (a device lock alone is not a posture trigger)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: coverage_window_touching_endpoint_collides_then_next_day_is_accepted
        grounds:
          - calculations.certificate_coverage_overlap
          - validations[priority=67].ERR_COVERAGE_WINDOW_OVERLAP
          - endpoints[POST /poct/certificate-coverages]
        distinguishing_aspect: |
          A new coverage starting exactly on the existing coverage's
          coverage_end (2026-08-31) is rejected because the interval geometry
          is CLOSED-CLOSED, while starting one day later (2026-09-01) is
          accepted; the pair pins the inclusive-inclusive comparison that a
          half-open implementation would get wrong on the first call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One certificate of waiver effective 2026-01-01 and expiring 2027-12-31."
            - "One WAIVED site with an existing coverage of that certificate running 2026-01-01..2026-08-31."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243022", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Coverage Geometry POCT", department_code: "DEPT-300", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-08-31" }
              as: ProgramAdmin
              captures: { cov_a_id: $.data.id }
          trigger:
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-08-31", coverage_end: "2027-12-31" }
              as: ProgramAdmin
              captures: { error_id: $.data.error_id, message: $.data.message }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-09-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
              captures: { cov_b_id: $.data.id, cov_b_snapshot: $.data.permitted_complexity_snapshot, cov_b_start: $.data.coverage_start }
          assert:
            - "the touching request returns HTTP 409 with ${error_id} == ERR_COVERAGE_WINDOW_OVERLAP (2026-08-31 is shared by both closed intervals)"
            - "the day-after request returns HTTP 201 with ${cov_b_start} == 2026-09-01 and ${cov_b_snapshot} == WAIVED"
            - "CertificateCoverage.${cov_a_id}.coverage_end == 2026-08-31 (unchanged)"
            - "CliaCertificate.${cert_id}.covered_site_count == 2 (it counts CertificateCoverage rows, so the accepted second window increments it even for the same site; the rejected one does not)"
            - "TestSite.${site_id}.oversight_posture == OPEN"

      - name: competency_window_touching_endpoint_allowed_then_one_day_earlier_collides
          # half-open [effective_date, expires_at) geometry, the opposite of coverage geometry
        grounds:
          - calculations.competency_window_overlap
          - validations[priority=68].ERR_ASSESSMENT_WINDOW_OVERLAP
          - concurrency_rules.assessment-create-stale-operator
        distinguishing_aspect: |
          A new assessment window starting exactly on the approved window's
          expires_at (2026-09-15) is ACCEPTED because competency geometry is
          HALF-OPEN, while starting one day earlier (2026-09-14) collides -
          the mirror image of the closed-closed coverage rule, so a single
          shared interval helper cannot satisfy both instances.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage; op_dir (PHYSICIAN) is the assigned lab director, op_b is a trained assessor, op_a is the trained subject."
            - "op_a holds an APPROVED GlucoMeter-X assessment over [2026-08-01, 2026-09-15)."
            - "Each create refreshes the operator version with a GET immediately before, because approvals and submissions both bump Operator.version."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243023", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Competency Geometry POCT", department_code: "DEPT-310", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Dr Iris Vale", role_title: "PHYSICIAN", hire_date: "2026-01-15" }
              as: ProgramAdmin
              captures: { op_dir_id: $.data.id }
            - call: "POST /poct/operators/${op_dir_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "PATCH /poct/sites/${site_id}/director"
              payload: { lab_director_operator_id: "${op_dir_id}" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ben Osei", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_b_id: $.data.id }
            - call: "POST /poct/operators/${op_b_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_a_id: $.data.id }
            - call: "POST /poct/operators/${op_a_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
              captures: { op_a_v1: $.data.version }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-08-01", expires_at: "2026-09-15", expected_operator_version: "${op_a_v1}" }
              as: QualityCoordinator
              captures: { ca_a_id: $.data.id }
            - call: "POST /poct/competency-assessments/${ca_a_id}/decision"
              payload: { decision: "APPROVE", note: "All six elements observed" }
              as: LabDirector
              as_user_id: "${op_dir_id}"
              captures: { ca_a_status: $.data.status }
            - call: "GET /poct/operators/${op_a_id}"
              as: QualityCoordinator
              captures: { op_a_v2: $.data.version }
          trigger:
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "ANNUAL", methods_demonstrated: 6, effective_date: "2026-09-15", expires_at: "2027-09-15", expected_operator_version: "${op_a_v2}" }
              as: QualityCoordinator
              captures: { ca_b_id: $.data.id, ca_b_status: $.data.status, ca_b_effective: $.data.effective_date }
            - call: "GET /poct/operators/${op_a_id}"
              as: QualityCoordinator
              captures: { op_a_v3: $.data.version }
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${op_a_id}", assessor_operator_id: "${op_b_id}", device_model: "GlucoMeter-X", assessment_type: "ANNUAL", methods_demonstrated: 6, effective_date: "2026-09-14", expires_at: "2027-09-14", expected_operator_version: "${op_a_v3}" }
              as: QualityCoordinator
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "${ca_a_status} == APPROVED"
            - "the 2026-09-15 request returns HTTP 201 with ${ca_b_status} == SUBMITTED and ${ca_b_effective} == 2026-09-15 (adjacent half-open windows are both allowed)"
            - "${op_a_v3} == ${op_a_v2} + 1 (the accepted submission bumped the operator version)"
            - "the 2026-09-14 request returns HTTP 409 with ${error_id} == ERR_ASSESSMENT_WINDOW_OVERLAP"
            - "the collision is caused by the APPROVED window alone; CompetencyAssessment.${ca_b_id}.status == SUBMITTED and SUBMITTED rows never block"
            - "Operator.${op_a_id}.competency_status == COMPETENT and Operator.${op_a_id}.competency_expires_at == 2026-09-15"
            - "Operator.${op_a_id}.version == ${op_a_v3} after the rejected request"

      - name: expired_certificate_excluded_from_overlap_candidates_unlocks_moderate_scope
        grounds:
          - calculations.certificate_coverage_overlap
          - state_machines.CliaCertificate.ACTIVE_to_EXPIRED
          - validations[priority=62].ERR_COMPLEXITY_SCOPE_EXCEEDED
        distinguishing_aspect: |
          A replacement coverage whose window fully contains an existing
          coverage is accepted solely because that older coverage's certificate
          has status EXPIRED and is therefore excluded from the collision
          candidate set; the new MODERATE snapshot then lets a MODERATE device
          be created on the same site that would otherwise be rejected with
          ERR_COMPLEXITY_SCOPE_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-09-05T00:00:00Z."
            - "cert1 is a certificate of waiver 2026-01-01..2026-08-31 with a site coverage over exactly that window."
            - "An oversight run at 2026-09-05 moves cert1 to EXPIRED, so the site loses in-window ACTIVE coverage and its posture becomes SUSPENDED."
            - "cert2 is a certificate of compliance permitting MODERATE, effective 2026-01-01 and expiring 2027-12-31, with no coverage yet."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243024", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { cert1_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Scope Upgrade POCT", department_code: "DEPT-320", complexity_scope: "MODERATE" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert1_id}", coverage_start: "2026-01-01", coverage_end: "2026-08-31" }
              as: ProgramAdmin
              captures: { cov1_id: $.data.id, cov1_snapshot: $.data.permitted_complexity_snapshot }
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243025", certificate_type: "CERTIFICATE_OF_COMPLIANCE", permitted_complexity: "MODERATE", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert2_id: $.data.id }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/oversight-runs"
              payload: { note: "September epoch" }
              as: ProgramAdmin
              captures: { expired_count: $.data.certificates_expired, posture_changed: $.data.sites_posture_changed }
          trigger:
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert2_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
              captures: { cov2_id: $.data.id, cov2_snapshot: $.data.permitted_complexity_snapshot }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "ChemAnalyzer-M", serial_number: "SN-1101", analyte: "CHEMISTRY_PANEL", complexity_class: "MODERATE", connectivity_mode: "INTERFACED", qc_frequency_days: 7 }
              as: ProgramAdmin
              captures: { dev_status: $.data.status, dev_due: $.data.qc_next_due_at }
          assert:
            - "${cov1_snapshot} == WAIVED and ${expired_count} == 1 and ${posture_changed} == 1"
            - "CliaCertificate.${cert1_id}.status == EXPIRED"
            - "the replacement coverage returns HTTP 201 with ${cov2_snapshot} == MODERATE even though 2026-01-01..2027-12-31 fully contains 2026-01-01..2026-08-31"
            - "CertificateCoverage.${cov1_id}.coverage_end == 2026-08-31 (the expired row is retained for audit, merely ignored by the candidate set)"
            - "the MODERATE device create returns HTTP 201 with ${dev_status} == ACTIVE and ${dev_due} == 2026-09-05"
            - "TestSite.${site_id}.scope_creep_flag == false (the in-window coverage now permits MODERATE)"
            - "TestSite.${site_id}.oversight_posture == OPEN and TestSite.${site_id}.manual_entry_blocked == false"
            - "CliaCertificate.${cert2_id}.covered_site_count == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: held_result_count_and_posture_restored_exactly_by_qc_unlock
        grounds:
          - calculations.held_result_conservation
          - state_machines.Device.QC_LOCKED_to_ACTIVE
          - state_machines.TestResult.HELD_to_PENDING_REVIEW
          - entities.TestSite.fields.held_result_count
        distinguishing_aspect: |
          After the forward cascade holds exactly three results and restricts
          the site, the compensating qc-unlock returns held_result_count to its
          pre-lock value of 0 and the posture to OPEN with zero drift: the
          already POSTED result keeps posted_value 95.0 and is not touched,
          and the MANUAL_ENTRY device's manual_entry_suspended flag is cleared
          again.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "Device D1 (GlucoMeter-X, INTERFACED, qc_frequency_days 30) and device D2 (StripReader-Z, MANUAL_ENTRY, qc_frequency_days 30)."
            - "One VERIFIED lot for GlucoMeter-X with LEVEL_1 range 80.0..120.0 and LEVEL_2 range 250.0..350.0."
            - "Result r0 is captured and POSTED with posted_value 95.0; results r1, r2, r3 are captured and left PENDING_REVIEW."
            - "A LEVEL_1 run at 140.0 fails, so D1 locks with QC_FAILURE, r1..r3 move to HELD, held_result_count becomes 3 and the posture becomes RESTRICTED."
            - "A LEVEL_1 run at 100.0 then passes on the same VERIFIED lot and serves as the confirming run."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243026", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Conservation POCT", department_code: "DEPT-330", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-1201", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "StripReader-Z", serial_number: "SN-1202", analyte: "URINALYSIS", complexity_class: "WAIVED", connectivity_mode: "MANUAL_ENTRY", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev2_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-J1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot1_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-8000", analyte: "GLUCOSE", measured_value: 95.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { r0_id: $.data.id }
            - call: "POST /poct/test-results/${r0_id}/post"
              payload: { attestation: "Reviewed and released to the chart" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { r0_status: $.data.posting_status, r0_value: $.data.posted_value }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-8001", analyte: "GLUCOSE", measured_value: 91.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-8002", analyte: "GLUCOSE", measured_value: 108.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-8003", analyte: "GLUCOSE", measured_value: 117.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { r3_id: $.data.id }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { pre_held: $.data.held_result_count, pre_posture: $.data.oversight_posture }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 140.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { fail_result: $.data.result }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { mid_held: $.data.held_result_count, mid_posture: $.data.oversight_posture }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { confirm_qc_id: $.data.id, confirm_result: $.data.result }
          trigger:
            - call: "POST /poct/devices/${dev1_id}/qc-unlock"
              payload: { confirming_qc_run_id: "${confirm_qc_id}", note: "Repeat control in range, root cause corrected" }
              as: QualityCoordinator
              captures: { dev_status: $.data.status, dev_reason: $.data.qc_lock_reason }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { post_held: $.data.held_result_count, post_posture: $.data.oversight_posture, post_blocked: $.data.manual_entry_blocked }
          assert:
            - "${r0_status} == POSTED and ${r0_value} == 95.0"
            - "${pre_held} == 0 and ${pre_posture} == OPEN"
            - "${fail_result} == FAIL, ${mid_held} == 3 and ${mid_posture} == RESTRICTED"
            - "${confirm_result} == PASS"
            - "${dev_status} == ACTIVE and ${dev_reason} == null"
            - "${post_held} == 0 == ${pre_held} and ${post_posture} == OPEN == ${pre_posture} and ${post_blocked} == false"
            - "TestResult.${r1_id}.posting_status == PENDING_REVIEW, TestResult.${r2_id}.posting_status == PENDING_REVIEW, TestResult.${r3_id}.posting_status == PENDING_REVIEW"
            - "TestResult.${r1_id}.held_by_device_lock_at == null and TestResult.${r3_id}.held_by_device_lock_at == null"
            - "TestResult.${r0_id}.posting_status == POSTED and TestResult.${r0_id}.posted_value == 95.0 (the compensation does not touch posted rows)"
            - "Device.${dev2_id}.manual_entry_suspended == false (restored) and Device.${dev2_id}.status == ACTIVE"

      - name: open_deficiency_weight_ledger_restored_exactly_by_inspection_rescind
        grounds:
          - calculations.deficiency_weight_conservation
          - state_machines.Inspection.DEFICIENCIES_ISSUED_to_RESCINDED
          - state_machines.DeficiencyFinding.OPEN_to_VOIDED
          - entities.Inspection.fields.issued_weight_total
        distinguishing_aspect: |
          Rescinding inspection B returns the site ledger from 14.00 to exactly
          3.00 - the value it held before B was issued - while B's
          issued_weight_total stays 11.00 as an audit record and inspection A's
          finding is untouched; a naive "recompute from zero" or a
          "decrement everything" implementation drifts off 3.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and no operators or devices."
            - "Inspection A is issued with one STANDARD_LEVEL finding in category PERSONNEL_COMPETENCY (weight 3.00), so open_deficiency_weight == 3.00 and posture OPEN."
            - "Inspection B is issued with one CONDITION_LEVEL finding in category QUALITY_CONTROL (weight 8.00) and one STANDARD_LEVEL finding in category RESULT_REPORTING (weight 3.00), so issued_weight_total == 11.00 and open_deficiency_weight == 14.00 with posture RESTRICTED."
            - "No prior CLOSED finding exists in any category, so every repeat_multiplier is 1.0."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243027", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Ledger POCT", department_code: "DEPT-340", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "INTERNAL_READINESS", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_a_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_a_id}", category: "PERSONNEL_COMPETENCY", severity: "STANDARD_LEVEL", description: "Annual competency records incomplete", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_a_id: $.data.id }
            - call: "POST /poct/inspections/${insp_a_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { issued_a: $.data.issued_weight_total }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { pre_weight: $.data.open_deficiency_weight, pre_posture: $.data.oversight_posture }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_b_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_b_id}", category: "QUALITY_CONTROL", severity: "CONDITION_LEVEL", description: "No two-level QC before patient testing", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_b1_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_b_id}", category: "RESULT_REPORTING", severity: "STANDARD_LEVEL", description: "Manual results posted without review", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_b2_id: $.data.id }
            - call: "POST /poct/inspections/${insp_b_id}/issue"
              payload: { issued_on: "2026-08-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { issued_b: $.data.issued_weight_total, insp_b_status: $.data.status }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { mid_weight: $.data.open_deficiency_weight, mid_posture: $.data.oversight_posture }
          trigger:
            - call: "POST /poct/inspections/${insp_b_id}/rescind"
              payload: { reason: "Findings issued against the wrong department code" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { rescinded_status: $.data.status, rescinded_total: $.data.issued_weight_total }
            - call: "GET /poct/sites/${site_id}/readiness"
              as: Surveyor
              as_user_id: "surveyor-beta"
              captures: { post_weight: $.data.open_deficiency_weight, post_score: $.data.score, post_dp: $.data.deficiency_penalty }
          assert:
            - "${issued_a} == 3.00, ${pre_weight} == 3.00 and ${pre_posture} == OPEN"
            - "${issued_b} == 11.00, ${insp_b_status} == DEFICIENCIES_ISSUED, ${mid_weight} == 14.00 and ${mid_posture} == RESTRICTED"
            - "${rescinded_status} == RESCINDED and ${rescinded_total} == 11.00 (the audit record survives the compensation)"
            - "${post_weight} == 3.00 == ${pre_weight} (exact restoration, no drift)"
            - "${post_dp} == 7.50 and ${post_score} == 92.50"
            - "DeficiencyFinding.${def_b1_id}.status == VOIDED and DeficiencyFinding.${def_b2_id}.status == VOIDED"
            - "DeficiencyFinding.${def_b1_id}.weight == 8.00 and DeficiencyFinding.${def_b2_id}.weight == 3.00 (weights stay pinned; only the ledger membership changes)"
            - "DeficiencyFinding.${def_a_id}.status == OPEN and Inspection.${insp_a_id}.status == DEFICIENCIES_ISSUED (inspection A untouched)"
            - "TestSite.${site_id}.oversight_posture == OPEN == ${pre_posture} and TestSite.${site_id}.manual_entry_blocked == false"

      - name: excursion_release_restores_lots_but_devices_and_rejected_results_stay
        grounds:
          - state_machines.StorageUnit.EXCURSION_OPEN_to_IN_RANGE
          - state_machines.ReagentLot.QUARANTINED_to_VERIFIED
          - state_machines.Device.QC_LOCKED_to_ACTIVE
          - state_machines.TestResult.PENDING_REVIEW_to_REJECTED
        distinguishing_aspect: |
          The excursion resolution is a PARTIAL compensation: the lot returns to
          VERIFIED with quarantine_reason null and the unit's counters reset to
          zero, but the device stays QC_LOCKED with qc_lock_reason
          LOT_QUARANTINE and the REJECTED results stay REJECTED forever -
          asserting that the reversal stops exactly where the scaffold says it
          stops rather than undoing the whole cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "One INTERFACED device, one storage unit with range 2.0..8.0 C, one lot VERIFIED by a LEVEL_1 and a LEVEL_2 PASS, and two PENDING_REVIEW results against that lot."
            - "A 12.5 C reading opens an excursion: the lot is QUARANTINED, the device is QC_LOCKED with LOT_QUARANTINE and both results move to REJECTED."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243028", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Excursion Release POCT", department_code: "DEPT-350", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-1301", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-K1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot1_id}/verify"
              payload: { level_1_qc_run_id: "${qc1_id}", level_2_qc_run_id: "${qc2_id}" }
              as: QualityCoordinator
              captures: { lot_verified_at: $.data.verified_at }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-9001", analyte: "GLUCOSE", measured_value: 99.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { tr1_id: $.data.id }
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op1_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-9002", analyte: "GLUCOSE", measured_value: 112.0, entry_mode: "INTERFACED" }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { tr2_id: $.data.id }
            - call: "POST /poct/storage-units/${su1_id}/temperature-readings"
              payload: { reading_c: 12.5, recorded_at: "2026-08-01T00:00:00Z", recorded_by_user_id: "${op1_id}" }
              as: QualityCoordinator
              captures: { disp: $.data.disposition, triggered: $.data.triggered_excursion }
            - call: "GET /poct/storage-units/${su1_id}"
              as: QualityCoordinator
              captures: { mid_state: $.data.excursion_state, mid_quarantined: $.data.quarantined_lot_count, mid_opened: $.data.excursion_opened_at }
          trigger:
            - call: "POST /poct/storage-units/${su1_id}/excursion-resolution"
              payload: { assessment_note: "Door ajar for 20 minutes; manufacturer confirms stability", lot_disposition: "RELEASE" }
              as: QualityCoordinator
              captures: { post_state: $.data.excursion_state, post_quarantined: $.data.quarantined_lot_count, post_opened: $.data.excursion_opened_at }
          assert:
            - "${disp} == OUT_OF_RANGE and ${triggered} == true"
            - "${mid_state} == EXCURSION_OPEN, ${mid_quarantined} == 1 and ${mid_opened} == 2026-08-01T00:00:00Z"
            - "${post_state} == IN_RANGE, ${post_quarantined} == 0 and ${post_opened} == null"
            - "ReagentLot.${lot1_id}.verification_status == VERIFIED and ReagentLot.${lot1_id}.quarantine_reason == null"
            - "ReagentLot.${lot1_id}.verified_at == ${lot_verified_at} (the original verification instant is preserved, not re-stamped)"
            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == LOT_QUARANTINE (the release does NOT unlock the instrument)"
            - "TestResult.${tr1_id}.posting_status == REJECTED and TestResult.${tr2_id}.posting_status == REJECTED (REJECTED is terminal; the release does not revive them)"
            - "TestResult.${tr1_id}.posted_value == null"
            - "TestSite.${site_id}.held_result_count == 0 and TestSite.${site_id}.oversight_posture == OPEN"
            - "StorageUnit.${su1_id}.last_reading_c == 12.5 (the reading history is not rewritten by the resolution)"
