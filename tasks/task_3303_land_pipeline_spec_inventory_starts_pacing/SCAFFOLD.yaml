scenario: |
  Land Pipeline, Spec Inventory & Starts Pacing (D.R. Horton): land acquisition
  through option contracts with developers to limit balance sheet exposure and
  takedown schedules, community planning with product series positioned across
  price points in the same market, starts pacing decisions balancing sales
  absorption, cycle time and trade capacity, speculative inventory management
  where homes are started before a buyer is identified with completion-stage
  pricing, incentive deployment on standing inventory including price cuts,
  closing cost credits and rate buydowns, trade partner capacity commitments
  and scheduling across simultaneous communities, cycle time management from
  permit through certificate of occupancy, community close-out and final phase
  pricing.

domain_name: land-pipeline-spec-pacing
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - idempotency
    - scheduled_deferred_actions
  entity_topology: hierarchical
  state_machine_shape: posture_driven
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: LandParcel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Parcel name" }
      - { name: market_code, type: string, source: input, description: "Market identifier, e.g. DFW" }
      - { name: acres, type: number, source: input, description: "Gross acreage of the tract" }

  - name: OptionContract
    parent: null
    common_fields: true
    fields:
      - { name: land_parcel_id, type: string, source: input, description: "FK -> LandParcel.id; parcel under option" }
      - { name: option_fee_cents, type: integer, source: input, description: "Non-refundable option fee paid at execution" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit held against takedowns" }
      - { name: total_lots, type: integer, source: input, description: "Total lots contracted across all takedowns" }
      - { name: lot_base_price_cents, type: integer, source: input, description: "Per-lot base price before escalation" }
      - { name: state, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | EXHAUSTED", default: DRAFT }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp when contract was executed; null until then", constraints: "null until ACTIVE" }
      - { name: lots_taken_down, type: integer, source: computed, description: "Sum of lot_count over EXECUTED takedowns", default: 0 }
      - { name: cure_fee_cents, type: integer, source: computed, description: "round_half_up(option_fee_cents * 0.10); charged on cure" }

  - name: Takedown
    parent: OptionContract
    common_fields: true
    fields:
      - { name: option_contract_id, type: string, source: system, description: "FK -> OptionContract.id; set from path" }
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community receiving the released lots" }
      - { name: lot_count, type: integer, source: input, description: "Lots released by this takedown" }
      - { name: window_start, type: datetime, source: input, description: "Earliest execution instant (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Latest execution instant (inclusive, closed interval)" }
      - { name: state, type: enum, source: system, description: "SCHEDULED | EXECUTED | DEFAULTED", default: SCHEDULED }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock execution timestamp; null until EXECUTED" }
      - { name: escalated_lot_price_cents, type: integer, source: computed, description: "Per-lot price after quarterly escalation; null until EXECUTED" }
      - { name: credit_per_lot_cents, type: integer, source: computed, description: "Per-lot developer credit by cumulative-lot tier; null until EXECUTED" }
      - { name: net_due_per_lot_cents, type: integer, source: computed, description: "escalated_lot_price_cents - credit_per_lot_cents; null until EXECUTED" }
      - { name: total_net_due_cents, type: integer, source: computed, description: "net_due_per_lot_cents * lot_count; null until EXECUTED" }

  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community name" }
      - { name: market_code, type: string, source: input, description: "Market identifier" }
      - { name: absorption_target_per_month, type: number, source: input, description: "Planned sales pace per month" }
      - { name: months_supply_target, type: number, source: input, description: "Target months of standing spec supply" }
      - { name: phase, type: enum, source: system, description: "PLANNING | OPEN_FOR_SALES | SELLING_OUT | CLOSE_OUT | CLOSED", default: PLANNING }
      - { name: standing_spec_count, type: integer, source: computed, description: "Homes with sales_status == UNSOLD", default: 0 }
      - { name: starts_this_period, type: integer, source: computed, description: "Homes created within the period [period_start, period_end] of the community's current PUBLISHED pacing plan; 0 when no PUBLISHED plan exists; resets when a new plan supersedes", default: 0 }
      - { name: lifetime_closed_sales, type: integer, source: computed, description: "SalesContracts ever CLOSED in this community", default: 0 }
      - { name: trailing_absorption_rate, type: number, source: computed, description: "Closed sales in trailing 90-day window / 3.0" }
      - { name: forward_pace_rate, type: number, source: computed, description: "(Closed sales in trailing 90-day window + count of PENDING/APPROVED contracts) / 3.0" }
      - { name: months_of_supply, type: number, source: computed, description: "standing_spec_count / max(trailing_absorption_rate, 1.0)" }
      - { name: posture, type: enum, source: computed, description: "OVERHELD if months_of_supply >= 4.0; STARVED if < 1.5; else NORMAL" }
      - { name: max_starts_remaining, type: integer, source: computed, description: "min(capacity remaining, quota remaining, inventory allowance) per starts_authorization" }
      - { name: starts_halted, type: boolean, source: computed, description: "true when max_starts_remaining == 0", default: false }

  - name: ProductSeries
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; set from path" }
      - { name: series_code, type: enum, source: input, description: "EXPRESS | CLASSIC | VENTURE | FREEDOM" }
      - { name: min_price_cents, type: integer, source: input, description: "Lowest allowed gross price (inclusive)" }
      - { name: max_price_cents, type: integer, source: input, description: "Highest allowed gross price (inclusive)" }

  - name: Lot
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; copied from the executing takedown" }
      - { name: source_takedown_id, type: string, source: system, description: "ID of the Takedown execution that released this lot; informational provenance" }
      - { name: state, type: enum, source: system, description: "BANKED | CONSUMED", default: BANKED }

  - name: Home
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; set from path" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; homesite being started" }
      - { name: product_series_id, type: string, source: input, description: "FK -> ProductSeries.id; price-point series" }
      - { name: base_price_cents, type: integer, source: input, description: "Base list price before lot premium" }
      - { name: lot_premium_cents, type: integer, source: input, description: "Lot premium added to base price", default: 0 }
      - { name: build_stage, type: enum, source: system, description: "PERMITTED | FOUNDATION | FRAME | DRYWALL | COMPLETE | CLOSED", default: PERMITTED }
      - { name: sales_status, type: enum, source: system, description: "UNSOLD | RESERVED | SOLD | CLOSED_SALE", default: UNSOLD }
      - { name: gross_price_cents, type: integer, source: computed, description: "base_price_cents + lot_premium_cents" }
      - { name: adjusted_price_cents, type: integer, source: computed, description: "round_half_up(gross_price_cents * stage_multiplier)" }
      - { name: stacked_incentive_cents, type: integer, source: computed, description: "Capped stack of ACTIVE applicable incentives" }
      - { name: net_effective_price_cents, type: integer, source: computed, description: "adjusted_price_cents - stacked_incentive_cents" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time CO issued (build_stage -> COMPLETE); null until then" }
      - { name: cycle_time_days, type: integer, source: computed, description: "Whole days from created_at to completed_at; null until COMPLETE" }

  - name: SalesContract
    parent: Home
    common_fields: true
    fields:
      - { name: home_id, type: string, source: input, description: "FK -> Home.id; home under contract" }
      - { name: buyer_name, type: string, source: input, description: "Buyer legal name" }
      - { name: contract_price_cents, type: integer, source: input, description: "Negotiated contract price" }
      - { name: state, type: enum, source: system, description: "PENDING | APPROVED | CLOSED | TERMINATED", default: PENDING }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock approval time; null until APPROVED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock closing time; null until CLOSED" }
      - { name: renegotiation_count, type: integer, source: computed, description: "Number of APPROVED -> PENDING renegotiations", default: 0 }

  - name: Incentive
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; set from path" }
      - { name: type, type: enum, source: input, description: "PRICE_CUT | CLOSING_COST_CREDIT | RATE_BUYDOWN" }
      - { name: value_cents, type: integer, source: input, description: "Flat amount for PRICE_CUT / CLOSING_COST_CREDIT; null for RATE_BUYDOWN" }
      - { name: value_pct, type: number, source: input, description: "Fraction of adjusted price for RATE_BUYDOWN; null otherwise" }
      - { name: series_code, type: enum, source: input, description: "EXPRESS | CLASSIC | VENTURE | FREEDOM | null (null = all series)", default: null }
      - { name: window_start, type: datetime, source: input, description: "Incentive effective from (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Incentive effective until (inclusive, closed interval)" }
      - { name: auto_activate_on_overheld, type: boolean, source: input, description: "If true, treated as ACTIVE before window_start while community posture is OVERHELD", default: false }
      - { name: cancelled, type: boolean, source: system, description: "Set true by cancel endpoint", default: false }
      - { name: status, type: enum, source: computed, description: "CANCELLED if cancelled; else ACTIVE if window covers clock or auto-activate applies; else SCHEDULED if clock < window_start; else EXPIRED" }

  - name: TradePartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Trade partner company name" }
      - { name: trade, type: enum, source: input, description: "FRAMING | PLUMBING | ELECTRICAL | HVAC | MASONRY" }

  - name: CapacityCommitment
    parent: TradePartner
    common_fields: true
    fields:
      - { name: trade_partner_id, type: string, source: system, description: "FK -> TradePartner.id; set from path" }
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community served" }
      - { name: period_start, type: datetime, source: input, description: "Commitment period start (inclusive; half-open interval)" }
      - { name: period_end, type: datetime, source: input, description: "Commitment period end (exclusive; half-open interval)" }
      - { name: committed_units, type: integer, source: input, description: "Homes the partner commits to frame in the period" }
      - { name: allocated_units, type: integer, source: computed, description: "Units allocated to started, not-yet-COMPLETE homes", default: 0 }
      - { name: remaining_units, type: integer, source: computed, description: "committed_units - allocated_units" }

  - name: PacingPlan
    parent: Community
    common_fields: true
    fields:
      - { name: community_id, type: string, source: system, description: "FK -> Community.id; set from path" }
      - { name: period_start, type: datetime, source: input, description: "Plan period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Plan period end (inclusive, closed interval)" }
      - { name: max_starts, type: integer, source: input, description: "Maximum home starts authorized in the period" }
      - { name: state, type: enum, source: system, description: "PUBLISHED | SUPERSEDED", default: PUBLISHED }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: OptionContract
    initial_state: DRAFT
    terminal_states: [EXHAUSTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /option-contracts/{id}/execute
        actor: LAND_MANAGER
        preconditions:
          - "state == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "executed_at = current logical clock"
          - "state -> ACTIVE"
          - "increments OptionContract.version by 1"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (a takedown of this contract flips to DEFAULTED; applied lazily on reads of the contract or its takedowns)"
        actor: system
        preconditions:
          - "At least one Takedown with option_contract_id == this contract is in DEFAULTED"
        side_effects:
          - "state -> DEFAULTED"

      - from: DEFAULTED
        to: ACTIVE
        trigger: POST /option-contracts/{id}/cure
        actor: LAND_MANAGER
        preconditions:
          - "state == DEFAULTED (else ERR_INVALID_STATE)"
        side_effects:
          - "cure_fee_cents charged (round_half_up(option_fee_cents * 0.10))"
          - "state -> ACTIVE"
          - "increments OptionContract.version by 1"
        note: "Cure reactivates the contract even though some takedowns remain DEFAULTED."

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (takedown execution brings lots_taken_down == total_lots)"
        actor: system
        preconditions:
          - "lots_taken_down == total_lots after an execution"
        side_effects:
          - "state -> EXHAUSTED"

  - entity: Takedown
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, DEFAULTED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: POST /takedowns/{id}/execute
        actor: LAND_MANAGER
        preconditions:
          - "state == SCHEDULED (else ERR_INVALID_STATE)"
          - "Contract state == ACTIVE (ERR_CONTRACT_NOT_ACTIVE; business_referential, priority 7)"
          - "clock >= window_start (ERR_TAKEDOWN_WINDOW_NOT_OPEN; business_temporal, priority 8)"
          - "clock <= window_end, closed interval (else takedown flips to DEFAULTED and ERR_TAKEDOWN_WINDOW_EXPIRED)"
          - "contract.lots_taken_down + lot_count <= contract.total_lots (ERR_CONTRACT_EXHAUSTED; business_fiscal, priority 10)"
        side_effects:
          - "state -> EXECUTED; executed_at = clock"
          - "takedown_pricing calculation runs (escalation, tier credit, net due)"
          - "Creates lot_count Lot rows in community_id with state BANKED"
          - "Contract lots_taken_down += lot_count; contract.version += 1"
          - "If lots_taken_down == total_lots: contract -> EXHAUSTED"

      - from: SCHEDULED
        to: DEFAULTED
        trigger: "system (clock > window_end; applied lazily on GET reads of the takedown or its contract's takedown list, and on an execute attempt past window_end which returns ERR_TAKEDOWN_WINDOW_EXPIRED; NOT applied by clock-set itself)"
        actor: system
        preconditions:
          - "state == SCHEDULED and clock > window_end"
        side_effects:
          - "state -> DEFAULTED"
          - "Owning OptionContract -> DEFAULTED"

  - entity: Community
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: OPEN_FOR_SALES
        trigger: POST /communities/{id}/open
        actor: COMMUNITY_MANAGER
        preconditions:
          - "phase == PLANNING (else ERR_INVALID_STATE)"
        side_effects:
          - "phase -> OPEN_FOR_SALES"
          - "increments Community.version by 1"

      - from: OPEN_FOR_SALES
        to: SELLING_OUT
        trigger: POST /communities/{id}/advance-phase
        actor: DIVISION_PRESIDENT
        preconditions: []
        side_effects: ["phase -> SELLING_OUT", "increments Community.version by 1"]

      - from: SELLING_OUT
        to: CLOSE_OUT
        trigger: POST /communities/{id}/advance-phase
        actor: DIVISION_PRESIDENT
        preconditions: []
        side_effects:
          - "phase -> CLOSE_OUT"
          - "Final-phase pricing: incentive stacking cap rises from 0.06 to 0.10 of adjusted price"
          - "increments Community.version by 1"

      - from: CLOSE_OUT
        to: CLOSED
        trigger: POST /communities/{id}/advance-phase
        actor: DIVISION_PRESIDENT
        preconditions: []
        side_effects: ["phase -> CLOSED", "increments Community.version by 1"]

      - from: PLANNING
        to: CLOSED
        trigger: "forbidden"
        actor: system
        preconditions: []
        side_effects: []
        note: "advance-phase from CLOSED, or any skip, returns ERR_INVALID_PHASE_TRANSITION."

  - entity: Home
    initial_state: PERMITTED (build_stage), UNSOLD (sales_status)
    terminal_states: [CLOSED (build_stage), CLOSED_SALE (sales_status)]
    note: "Parallel state dimensions: build_stage and sales_status evolve independently on the same row."
    transitions:
      - from: PERMITTED
        to: FOUNDATION
        trigger: POST /homes/{id}/advance-stage
        actor: COMMUNITY_MANAGER
        preconditions: ["build_stage == PERMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["build_stage -> FOUNDATION; adjusted_price_cents recomputed (stage multiplier)"]

      - from: FOUNDATION
        to: FRAME
        trigger: POST /homes/{id}/advance-stage
        actor: COMMUNITY_MANAGER
        preconditions: ["build_stage == FOUNDATION"]
        side_effects: ["build_stage -> FRAME; pricing recomputed"]

      - from: FRAME
        to: DRYWALL
        trigger: POST /homes/{id}/advance-stage
        actor: COMMUNITY_MANAGER
        preconditions: ["build_stage == FRAME"]
        side_effects: ["build_stage -> DRYWALL; pricing recomputed"]

      - from: DRYWALL
        to: COMPLETE
        trigger: POST /homes/{id}/advance-stage
        actor: COMMUNITY_MANAGER
        preconditions: ["build_stage == DRYWALL"]
        side_effects:
          - "build_stage -> COMPLETE; completed_at = clock; cycle_time_days computed"
          - "FRAMING capacity allocation released: allocated_units -= 1, remaining_units += 1 (compensating release)"
          - "pricing recomputed"

      - from: UNSOLD
        to: RESERVED
        trigger: "POST /sales-contracts (creation on this home)"
        actor: SALES_AGENT
        preconditions: ["sales_status == UNSOLD (ERR_HOME_NOT_UNSOLD)"]
        side_effects:
          - "sales_status -> RESERVED"
          - "Community standing_spec_count -= 1; posture recomputed"

      - from: RESERVED
        to: SOLD
        trigger: POST /sales-contracts/{id}/approve
        actor: COMMUNITY_MANAGER
        preconditions: ["contract state == PENDING"]
        side_effects: ["sales_status -> SOLD"]

      - from: RESERVED
        to: UNSOLD
        trigger: POST /sales-contracts/{id}/terminate
        actor: SALES_AGENT
        preconditions: ["contract state == PENDING"]
        side_effects:
          - "sales_status -> UNSOLD"
          - "Community standing_spec_count += 1; posture recomputed (cascade link 1)"

      - from: SOLD
        to: UNSOLD
        trigger: POST /sales-contracts/{id}/terminate
        actor: SALES_AGENT
        preconditions: ["contract state == APPROVED"]
        side_effects:
          - "sales_status -> UNSOLD"
          - "Community standing_spec_count += 1; posture recomputed (cascade link 1)"
          - "If posture flips to OVERHELD: incentives with auto_activate_on_overheld become ACTIVE (cascade links 2-3)"

      - from: SOLD
        to: CLOSED_SALE
        trigger: POST /sales-contracts/{id}/close
        actor: COMMUNITY_MANAGER
        preconditions: ["contract state == APPROVED", "build_stage == COMPLETE (ERR_HOME_NOT_COMPLETE)"]
        side_effects:
          - "sales_status -> CLOSED_SALE; build_stage -> CLOSED"
          - "Community lifetime_closed_sales += 1; trailing/forward absorption recomputed"

  - entity: SalesContract
    initial_state: PENDING
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /sales-contracts/{id}/approve
        actor: COMMUNITY_MANAGER
        preconditions:
          - "state == PENDING (else ERR_INVALID_STATE)"
          - "contract_price_cents >= home.net_effective_price_cents at approval time (ERR_PRICE_BELOW_NET_FLOOR)"
        side_effects:
          - "state -> APPROVED; approved_at = clock"
          - "Home sales_status RESERVED -> SOLD"

      - from: APPROVED
        to: PENDING
        trigger: POST /sales-contracts/{id}/renegotiate
        actor: SALES_AGENT
        preconditions: ["state == APPROVED (else ERR_INVALID_STATE)"]
        side_effects:
          - "state -> PENDING; renegotiation_count += 1"
          - "Home sales_status SOLD -> RESERVED"
        note: "Renegotiation cycle: APPROVED -> PENDING -> APPROVED is allowed repeatedly."

      - from: PENDING
        to: TERMINATED
        trigger: POST /sales-contracts/{id}/terminate
        actor: SALES_AGENT
        preconditions: ["state == PENDING"]
        side_effects: ["state -> TERMINATED", "Home sales_status RESERVED -> UNSOLD; standing_spec_count += 1; posture recomputed"]

      - from: APPROVED
        to: TERMINATED
        trigger: POST /sales-contracts/{id}/terminate
        actor: SALES_AGENT
        preconditions: ["state == APPROVED"]
        side_effects: ["state -> TERMINATED", "Home sales_status SOLD -> UNSOLD; standing_spec_count += 1; posture recomputed; OVERHELD flip auto-activates flagged incentives"]

      - from: APPROVED
        to: CLOSED
        trigger: POST /sales-contracts/{id}/close
        actor: COMMUNITY_MANAGER
        preconditions:
          - "state == APPROVED (else ERR_INVALID_STATE)"
          - "home.build_stage == COMPLETE (ERR_HOME_NOT_COMPLETE)"
        side_effects:
          - "state -> CLOSED; closed_at = clock"
          - "Home sales_status SOLD -> CLOSED_SALE; build_stage -> CLOSED"
          - "Community lifetime_closed_sales += 1"

  - entity: PacingPlan
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (creation of a new PacingPlan for the same community)"
        actor: system
        preconditions: []
        side_effects: ["prior PUBLISHED plan -> SUPERSEDED; new plan is PUBLISHED"]

  - entity: Incentive
    initial_state: SCHEDULED
    terminal_states: [EXPIRED, CANCELLED]
    note: "status is clock-derived: CANCELLED if cancelled flag; ACTIVE if window covers clock or (auto_activate_on_overheld and community posture == OVERHELD and clock <= window_end); SCHEDULED if clock < window_start; else EXPIRED."
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (clock reaches window_start, or posture flips OVERHELD with auto_activate_on_overheld)"
        actor: system
        preconditions: []
        side_effects: ["Applicable homes' stacked_incentive_cents and net_effective_price_cents recomputed"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock passes window_end)"
        actor: system
        preconditions: []
        side_effects: ["Applicable homes' incentive stack recomputed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /incentives/{id}/cancel
        actor: COMMUNITY_MANAGER
        preconditions: ["status in {SCHEDULED, ACTIVE} (else ERR_INVALID_STATE)"]
        side_effects: ["cancelled = true"]
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /incentives/{id}/cancel
        actor: COMMUNITY_MANAGER
        preconditions: ["status in {SCHEDULED, ACTIVE}"]
        side_effects: ["cancelled = true; incentive stacks recomputed"]

  - entity: Lot
    initial_state: BANKED
    terminal_states: [CONSUMED]
    transitions:
      - from: BANKED
        to: CONSUMED
        trigger: "POST /communities/{id}/homes (start on this lot)"
        actor: COMMUNITY_MANAGER
        preconditions: ["state == BANKED (ERR_LOT_NOT_AVAILABLE)"]
        side_effects: ["state -> CONSUMED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: pacing-plan-create-stale-community
    parent_entity: Community
    write_endpoint: "POST /communities/{id}/pacing-plans"
    occ_field: expected_community_version
    description: |
      Creating a PacingPlan against a Community whose version has advanced since
      the client last observed it is rejected. The new plan legitimately
      supersedes the currently PUBLISHED plan, so a stale view of the community
      (whose counters may have changed the pacing inputs) must not silently
      create another plan.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: takedown-create-stale-contract
    parent_entity: OptionContract
    write_endpoint: "POST /option-contracts/{id}/takedowns"
    occ_field: expected_contract_version
    description: |
      Scheduling a Takedown against an OptionContract whose version has advanced
      since the client last observed it is rejected. Execution and prior
      scheduling advance lots_taken_down, so a stale view would oversubscribe
      the remaining lots.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: home_effective_pricing
    trigger: "home creation, advance-stage, incentive activation/expiry/cancel, community phase change to CLOSE_OUT"
    algorithm: tiered_pricing
    formula: |
      gross_price_cents = base_price_cents + lot_premium_cents
      stage_multiplier = STAGE_MULTIPLIERS[build_stage]
      adjusted_price_cents = round_half_up(gross_price_cents * stage_multiplier)   # 0 decimals, cents are integral
      stacked_incentive_cents = incentive_stacking(adjusted_price_cents, home)
      net_effective_price_cents = adjusted_price_cents - stacked_incentive_cents
    input_set: "The Home plus ACTIVE incentives of its community whose series_code is null or equals the home's ProductSeries.series_code"
    constants:
      STAGE_MULTIPLIERS: { PERMITTED: 1.00, FOUNDATION: 1.00, FRAME: 1.01, DRYWALL: 1.02, COMPLETE: 1.03, CLOSED: 1.03 }
    precision: "integer cents, round_half_up"
    variants:
      - name: list_price_variant
        when: "Gross-of-incentive view (adjusted_price_cents)"
        difference: "Ignores all incentives; equals round_half_up(gross * stage_multiplier)"
      - name: net_effective_variant
        when: "Net view used as the approval price floor (net_effective_price_cents)"
        difference: "Subtracts the capped incentive stack; differs from list variant whenever any applicable incentive is ACTIVE"

  - name: absorption_and_supply
    trigger: "sales contract close, contract create/approve/terminate, home create, clock advance"
    algorithm: chronological
    formula: |
      window = [clock - 90 days, clock]   # closed interval
      trailing_absorption_rate = count(SalesContract with state == CLOSED and closed_at in window) / 3.0
      forward_pace_rate = (count(same closed set) + count(SalesContract in {PENDING, APPROVED})) / 3.0
      effective_absorption = max(trailing_absorption_rate, ABSORPTION_FLOOR)
      months_of_supply = standing_spec_count / effective_absorption
      posture = OVERHELD if months_of_supply >= 4.0 else (STARVED if months_of_supply < 1.5 else NORMAL)
    input_set: "SalesContracts of homes in this community; CLOSED counted by closed_at in the trailing window"
    constants:
      ABSORPTION_FLOOR: 1.0
      OVERHELD_THRESHOLD: 4.0
      STARVED_THRESHOLD: 1.5
    precision: "rates kept exact (rational); months_of_supply compared exactly at thresholds"
    variants:
      - name: trailing_actual
        when: "Reported as trailing_absorption_rate and used for months_of_supply/posture"
        difference: "Chronological: only CLOSED contracts in the trailing 90-day window count"
      - name: forward_pace
        when: "Reported as forward_pace_rate in pacing-summary"
        difference: "Forward-looking: also counts currently PENDING/APPROVED contracts; diverges from trailing whenever open pipeline exists"

  - name: starts_authorization
    trigger: "POST /communities/{id}/homes and GET /communities/{id}/pacing-summary"
    algorithm: constraint_propagation
    formula: |
      capacity_remaining = remaining_units of the selected FRAMING commitment (selector below); 0 if none
      quota_remaining = max(0, published_plan.max_starts - starts_this_period); 0 if no PUBLISHED plan covers clock
      inventory_allowance = max(0, ceil(effective_absorption * months_supply_target) - standing_spec_count)
      if posture == STARVED: inventory_allowance = max(inventory_allowance, 1)
      if posture == OVERHELD: start is rejected outright (ERR_STARTS_BLOCKED_OVERHELD)
      max_starts_remaining = min(capacity_remaining, quota_remaining, inventory_allowance)
      starts_halted = (max_starts_remaining == 0)
    input_set: "Community counters, the PUBLISHED PacingPlan covering clock, FRAMING CapacityCommitments for this community"
    constants:
      STARVED_ALLOWANCE_FLOOR: 1
    precision: "integer units"
    note: |
      Selector for the capacity commitment: eligibility = CapacityCommitment with
      trade_partner.trade == FRAMING, community_id == this community,
      period_start <= clock < period_end (half-open), remaining_units > 0;
      ranking = period_start ASC; tie-break = created_at ASC; empty pool ->
      ERR_NO_CAPACITY_REMAINING on start.

  - name: incentive_stacking
    trigger: "home pricing computation (creation, stage advance, incentive activation/expiry/cancel, phase change to CLOSE_OUT)"
    algorithm: waterfall_allocation
    formula: |
      applicable = ACTIVE incentives of home's community with series_code null or == home series
      evaluation order: applicable sorted by created_at ASC (tie-break: none needed, created_at distinct per create call)
      for each incentive, component_cents computed and ROUNDED INDIVIDUALLY (round_half_up to integer cents):
        PRICE_CUT            -> value_cents
        CLOSING_COST_CREDIT  -> value_cents
        RATE_BUYDOWN         -> round_half_up(value_pct * adjusted_price_cents)
      raw_stack = sum(component_cents)              # sum of already-rounded components; do NOT round after summing
      cap = round_half_up(CAP_PCT[community.phase] * adjusted_price_cents)
      stacked_incentive_cents = min(raw_stack, cap)
    input_set: "ACTIVE incentives scoped to the home's community and series"
    constants:
      CAP_PCT: { PLANNING: 0.06, OPEN_FOR_SALES: 0.06, SELLING_OUT: 0.06, CLOSE_OUT: 0.10, CLOSED: 0.10 }
    precision: |
      Pinned order: round each component to integer cents first, then sum, then
      apply the (rounded) cap. Sum-then-round of unrounded components is the
      rejected alternative and can differ by cents when two RATE_BUYDOWN
      components are fractional.

  - name: takedown_pricing
    trigger: "POST /takedowns/{id}/execute"
    algorithm: tiered_pricing
    formula: |
      Pinned evaluation order (resolves the circular-looking tier dependency):
      1) full_quarters = floor(days(executed_at - contract.executed_at) / QUARTER_DAYS)
      2) escalated_lot_price_cents = lot_base_price_cents + round_half_up(lot_base_price_cents * ESCALATION_RATE * full_quarters)
      3) cumulative_lots = contract.lots_taken_down + this.lot_count   # INCLUDING this takedown
      4) credit_pct = 0.00 if cumulative_lots < 20; 0.02 if 20 <= cumulative_lots < 40; 0.03 if cumulative_lots >= 40
      5) credit_per_lot_cents = round_half_up(credit_pct * escalated_lot_price_cents)
      6) net_due_per_lot_cents = escalated_lot_price_cents - credit_per_lot_cents
      7) total_net_due_cents = net_due_per_lot_cents * lot_count
    input_set: "The executing Takedown and its OptionContract"
    constants:
      ESCALATION_RATE: 0.01
      QUARTER_DAYS: 91
    precision: "integer cents, round_half_up at each pinned step"

  - name: cycle_time
    trigger: "advance-stage reaching COMPLETE"
    algorithm: aggregation
    formula: |
      cycle_time_days = floor((completed_at - created_at) / 86400 seconds)
      community avg_cycle_time_days = mean of cycle_time_days over homes with build_stage in {COMPLETE, CLOSED}
    input_set: "Homes of the community that reached COMPLETE"
    precision: "integer days (floor); average rounded to 2 decimals round_half_up"

  - name: capacity_allocation
    trigger: "home start (allocate) and advance-stage to COMPLETE (release)"
    algorithm: bucket_transfer
    formula: |
      On start:  selected commitment.allocated_units += 1; remaining_units -= 1
      On COMPLETE: the same commitment.allocated_units -= 1; remaining_units += 1
      Invariant: committed_units == allocated_units + remaining_units at all times
    input_set: "CapacityCommitments allocated to homes of the community"
    precision: "integer units"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and valid", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: existence, check: "POST requests include Idempotency-Key header", error_id: ERR_MISSING_IDEMPOTENCY_KEY, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 3, category: existence, check: "Idempotency-Key reused with a different request body", error_id: ERR_IDEMPOTENCY_REPLAY_MISMATCH, http_status: 409, applies_to: "all POST endpoints" }
  - { priority: 4, category: existence, check: "Path resource ids exist (left to right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 5, category: auth, check: "Role permitted; TRADE_PARTNER may act only on own commitments (X-User-ID == trade_partner_id)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 6, category: state, check: "Target resource's own state/phase allows the operation (ERR_INVALID_STATE, ERR_COMMUNITY_NOT_OPEN, ERR_INVALID_PHASE_TRANSITION, ERR_HOME_NOT_COMPLETE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 7, category: business_referential, check: "Linked entities in required state: lot BANKED (ERR_LOT_NOT_AVAILABLE), home UNSOLD (ERR_HOME_NOT_UNSOLD), contract ACTIVE (ERR_CONTRACT_NOT_ACTIVE), PUBLISHED pacing plan covering clock exists (ERR_NO_PUBLISHED_PACING_PLAN)", error_id: "varies", http_status: 409, applies_to: "home starts, sales contract create, takedown execute" }
  - { priority: 8, category: business_temporal, check: "Windows: takedown window (ERR_TAKEDOWN_WINDOW_NOT_OPEN / ERR_TAKEDOWN_WINDOW_EXPIRED), incentive same-type+series 7-day buffer (ERR_INCENTIVE_WINDOW_CONFLICT), capacity half-open period overlap (ERR_CAPACITY_PERIOD_OVERLAP)", error_id: "varies", http_status: 409, applies_to: "takedown execute, incentive create, commitment create" }
  - { priority: 9, category: business_constraint, check: "Series band overlap (ERR_SERIES_BAND_OVERLAP), gross price within series band (ERR_PRICE_OUT_OF_SERIES_BAND)", error_id: "varies", http_status: 422, applies_to: "product-series create, home start" }
  - { priority: 10, category: business_fiscal, check: "Quotas/capacity/price floors: posture block (ERR_STARTS_BLOCKED_OVERHELD), pacing quota (ERR_STARTS_QUOTA_EXCEEDED), capacity (ERR_NO_CAPACITY_REMAINING), reduce below allocated (ERR_CAPACITY_BELOW_ALLOCATED), contract price floor (ERR_PRICE_BELOW_NET_FLOOR), lot exhaustion (ERR_CONTRACT_EXHAUSTED)", error_id: "varies", http_status: 409, applies_to: "home start, commitment reduce, contract approve, takedown create, takedown execute" }

