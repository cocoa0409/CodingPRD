              as: ProgramAdministrator
            - call: "POST /population-health/outreach-campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_v: $.data.0.version }
          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v}" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CAMPAIGN_WINDOW_VIOLATION"

      - name: provider_slot_capacity_aggregate_overlap
        grounds:
          - validations[priority=13]
          - entities.Appointment.fields.provider_capacity_per_slot
          - errors[ERR_PROVIDER_SLOT_FULL]
        distinguishing_aspect: |
          Aggregate-capacity semantics on Appointment/provider resource:
          multiple appointments may overlap up to provider_capacity_per_slot
          for the SAME provider_id; a (capacity+1)-th overlapping appointment
          is rejected. This is NOT a simple adjacency rule — it's an
          aggregate occupancy check over [slot_start_at, slot_end_at).
        test_recipe:
          setup:
            - "Two members with two distinct care gaps; two SCHEDULED appointments at provider_id=prov_A with overlapping slots; provider_capacity_per_slot on the existing rows is 2 (default would be 1)"
            - "A third member+care gap; attempt to book a third overlapping appointment exceeds capacity=2"
          setup_api_calls:
