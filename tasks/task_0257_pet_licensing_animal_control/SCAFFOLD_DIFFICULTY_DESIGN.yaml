# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pet Licensing & Animal Control — Expert tier.
# Nine §0.5 rules × 2 instances = 18 instances. Every grounds: ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain drives empty-DB → setup.
# All formula-derived asserts are pre-computed literals (see worklog math).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: license_fee_provisional_vs_final_diverge_on_designation
        grounds:
          - calculations.license_fee
          - state_machines.License.DRAFT_to_SUBMITTED
          - state_machines.License.UNDER_REVIEW_to_APPROVED
          - state_machines.DangerousDogCase.INVESTIGATING_to_DESIGNATED
          - entities.License.fields.provisional_fee_cents
          - entities.License.fields.final_fee_cents
        distinguishing_aspect: |
          On an INDIVIDUAL unaltered pet, provisional_fee_cents stamped at SUBMITTED is 4000 (no
          dangerous surcharge by definition), while final_fee_cents stamped at APPROVED is 9000
          because a BITE designation landed in between and the final variant adds the 5000 surcharge —
          identical license inputs, two variants, different cents; this is cost accounting on License/Pet.
        test_recipe:
          setup:
            - "Owner OA registered; unaltered DOG pet P; INDIVIDUAL license L created in DRAFT and submitted (provisional_fee_cents=4000)"
            - "L driven to UNDER_REVIEW with a valid RABIES proof attached"
            - "A DangerousDogCase on P reaches DESIGNATED (BITE) BEFORE L is approved, so P.is_dangerous=true at approval"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner A", email: "oa@x.com", address_zip: "10001" }
              as: LicensingClerk
              captures: { oa_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${oa_id}", name: "Rex", species: "DOG", breed: "Mix", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${oa_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${pet_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2027-06-01T00:00:00Z", vet_license_no: "VET-1" }
              as: Owner
              as_user_id: "${oa_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oa_id}", pet_id: "${pet_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${oa_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oa_id}"
            - call: "POST /licenses/${lic_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lic_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lic_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vr_id}" }
              as: Owner
              as_user_id: "${oa_id}"
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${pet_id}", incident_summary: "nipped a jogger", severity: "BITE" }
              as: AnimalControlOfficer
              captures: { case_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${case_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${case_id}/designate"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /licenses/${lic_id}/approve"
              payload: {}
              as: LicensingClerk
              captures: { final_fee: $.data.final_fee_cents, prov_fee: $.data.provisional_fee_cents }
          assert:
            - "License.${lic_id}.provisional_fee_cents == 4000"
            - "License.${lic_id}.final_fee_cents == 9000"
            - "License.${lic_id}.final_fee_cents - License.${lic_id}.provisional_fee_cents == 5000"

      - name: owner_outstanding_penalty_net_vs_gross
        grounds:
          - calculations.owner_outstanding_penalty
          - state_machines.License.GRACE_to_EXPIRED
          - state_machines.License.EXPIRED_to_ACTIVE
          - entities.Owner.fields.outstanding_penalty_cents
          - entities.License.fields.penalty_paid
        distinguishing_aspect: |
          With two EXPIRED licenses each carrying late_penalty_cents=2000, after one is settled via
          pay-penalty (penalty_paid=true while STILL EXPIRED) Owner.outstanding_penalty_cents is 2000
          under the pinned NET reading (excludes the settled-but-in-window license) whereas the
          rejected GROSS reading would still report 4000; identical data, two variants, different
          totals — this is balance accounting on Owner, a different entity domain from the License-fee
          dual-variant above.
        test_recipe:
          setup:
            - "Owner OB with two INDIVIDUAL licenses L1 (pet2 unaltered, final 4000) and L2 (pet1 altered, final 2000) issued ACTIVE then driven to EXPIRED via clock advance, each late_penalty_cents=2000 (days_late=10, neither capped)"
            - "L1's penalty settled via pay-penalty (penalty_paid=true, stays EXPIRED); L2 left EXPIRED unpaid"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner B", email: "ob@x.com", address_zip: "10002" }
              as: LicensingClerk
              captures: { ob_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${ob_id}", name: "Bo", species: "DOG", breed: "Lab", is_altered: true, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { pet1_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${ob_id}", name: "Cleo", species: "CAT", breed: "DSH", is_altered: false, birth_date: "2023-02-01T00:00:00Z" }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { pet2_id: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${pet1_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VET-2" }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { vr1_id: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${pet2_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VET-3" }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { vr2_id: $.data.id }
            # L1 — pet1, INDIVIDUAL, unaltered final fee 4000 (pet1 is altered → 2000; use pet2 to get 4000). Use pet2 for L1 to get final 4000.
            - call: "POST /licenses"
              payload: { owner_id: "${ob_id}", pet_id: "${pet2_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /licenses/${l1_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${ob_id}"
            - call: "POST /licenses/${l1_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l1_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l1_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vr2_id}" }
              as: Owner
              as_user_id: "${ob_id}"
            - call: "POST /licenses/${l1_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l1_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            # L2 — pet1 (altered) gives final 2000; we need 4000 to avoid cap on a 2000-penalty? penalty=2000<=4000 ok for pet2. For L2 use a second unaltered pet path: reuse pet2 would overlap. Make L2 on pet1 with final 2000; penalty days_late=10 -> 2000, cap min(2000,2000)=2000. Works.
            - call: "POST /licenses"
              payload: { owner_id: "${ob_id}", pet_id: "${pet1_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${ob_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /licenses/${l2_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${ob_id}"
            - call: "POST /licenses/${l2_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l2_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l2_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vr1_id}" }
              as: Owner
              as_user_id: "${ob_id}"
            - call: "POST /licenses/${l2_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${l2_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            # advance clock so both expire with days_late=10 (issued 2026-01-01, expires 2027-01-01, grace_end 2027-01-31, +10 days = 2027-02-10)
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/${l1_id}/pay-penalty"
              payload: { pay_penalty_cents: 2000 }
              as: Owner
              as_user_id: "${ob_id}"
            - call: "GET /owners/${ob_id}"
              payload: {}
              as: Owner
              as_user_id: "${ob_id}"
              captures: { outstanding: $.data.outstanding_penalty_cents }
          assert:
            - "License.${l1_id}.penalty_paid == true"
            - "License.${l1_id}.status == EXPIRED"
            - "License.${l2_id}.status == EXPIRED"
            - "License.${l2_id}.penalty_paid == false"
            - "Owner.${ob_id}.outstanding_penalty_cents == 2000"
            - "Owner.${ob_id}.status == DELINQUENT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: kennel_fee_nested_rounding_order_pinned
        grounds:
          - calculations.license_fee
          - state_machines.License.DRAFT_to_SUBMITTED
          - entities.License.fields.provisional_fee_cents
          - entities.Kennel.fields.occupied_slots
        distinguishing_aspect: |
          MODE (b) nested rounding: license_fee rounds AFTER base*alter_factor and rounds AGAIN
          after the kennel discount. For a KENNEL unaltered license attaching to a kennel with 3
          occupied slots, the pinned order yields provisional_fee_cents=10200 (12000 -> *0.85 ->
          10200); swapping to a single round at the end is excluded by the pinned two-step order.
        test_recipe:
          setup:
            - "Owner OC owns a Kennel K with slot_capacity=8 and 3 ACTIVE kennel licenses already attached (occupied_slots=3)"
            - "A 4th KENNEL license L4 for an unaltered pet is created and submitted; provisional fee uses occupied_slots=3"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner C", email: "oc@x.com", address_zip: "20001" }
              as: LicensingClerk
              captures: { oc_id: $.data.id }
            - call: "POST /kennels"
              payload: { owner_id: "${oc_id}", facility_name: "C Kennels", slot_capacity: 8 }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { k_id: $.data.id }
            # Build 3 ACTIVE kennel licenses to set occupied_slots=3. Each needs its own pet + rabies + full lifecycle.
            - call: "POST /pets"
              payload: { owner_id: "${oc_id}", name: "K1", species: "DOG", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kp1: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${kp1}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "V1" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kv1: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oc_id}", pet_id: "${kp1}", license_kind: "KENNEL", term_years: 1, kennel_id: "${k_id}" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kl1: $.data.id }
            - call: "POST /licenses/${kl1}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl1}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl1}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl1}/attach-vaccination"
              payload: { vaccination_record_id: "${kv1}" }
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl1}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl1}/issue-tag"
              payload: {}
              as: LicensingClerk
            - call: "POST /pets"
              payload: { owner_id: "${oc_id}", name: "K2", species: "DOG", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kp2: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${kp2}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "V2" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kv2: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oc_id}", pet_id: "${kp2}", license_kind: "KENNEL", term_years: 1, kennel_id: "${k_id}" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kl2: $.data.id }
            - call: "POST /licenses/${kl2}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl2}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl2}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl2}/attach-vaccination"
              payload: { vaccination_record_id: "${kv2}" }
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl2}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl2}/issue-tag"
              payload: {}
              as: LicensingClerk
            - call: "POST /pets"
              payload: { owner_id: "${oc_id}", name: "K3", species: "DOG", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kp3: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${kp3}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "V3" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kv3: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oc_id}", pet_id: "${kp3}", license_kind: "KENNEL", term_years: 1, kennel_id: "${k_id}" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kl3: $.data.id }
            - call: "POST /licenses/${kl3}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl3}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl3}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl3}/attach-vaccination"
              payload: { vaccination_record_id: "${kv3}" }
              as: Owner
              as_user_id: "${oc_id}"
            - call: "POST /licenses/${kl3}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${kl3}/issue-tag"
              payload: {}
              as: LicensingClerk
            # 4th pet + license, submit observes occupied_slots=3
            - call: "POST /pets"
              payload: { owner_id: "${oc_id}", name: "K4", species: "DOG", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kp4: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${oc_id}", pet_id: "${kp4}", license_kind: "KENNEL", term_years: 1, kennel_id: "${k_id}" }
              as: Owner
              as_user_id: "${oc_id}"
              captures: { kl4: $.data.id }
          trigger:
            - call: "POST /licenses/${kl4}/submit"
              payload: {}
              as: Owner
              as_user_id: "${oc_id}"
              captures: { prov4: $.data.provisional_fee_cents }
          assert:
            - "License.${kl4}.provisional_fee_cents == 10200"
            - "Kennel.${k_id}.occupied_slots == 3"

      - name: lost_found_match_multi_input_nonlinear_selection
        grounds:
          - calculations.lost_found_match
          - state_machines.LostFoundReport.OPEN_to_MATCHED
          - entities.LostFoundReport.fields.match_score
        distinguishing_aspect: |
          MODE (a) ≥3-input non-linear selection: lost_found_match scores each counterpart over
          species(10) + zip(20) + tag-exact(100) with a MATCH_MIN_SCORE=20 gate and argmax with a
          reported_at tie-break; given two FOUND candidates — one tag-exact (score 130) and one
          species+zip only (score 30) — the LOST report matches the tag-exact one and match_score==130,
          a non-linear winner-take-all that a purely additive linear sum would not single out.
        test_recipe:
          setup:
            - "One LOST report R (DOG, zip 30303, tag_serial_seen TAG-XYZ) OPEN"
            - "Two FOUND reports: F1 (DOG, zip 30303, tag_serial_seen TAG-XYZ) → score 130; F2 (DOG, zip 30303, no tag) → score 30; both OPEN"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "DOG", zip_seen: "30303", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { f2_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "DOG", zip_seen: "30303", reported_at: "2026-03-01T09:00:00Z", tag_serial_seen: "TAG-XYZ" }
              as: AnimalControlOfficer
              captures: { f1_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "LOST", species: "DOG", zip_seen: "30303", reported_at: "2026-03-01T07:00:00Z", tag_serial_seen: "TAG-XYZ" }
              as: AnimalControlOfficer
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /lost-found-reports/${r_id}/match"
              payload: {}
              as: AnimalControlOfficer
              captures: { r_match: $.data.matched_report_id, r_score: $.data.match_score }
          assert:
            - "LostFoundReport.${r_id}.matched_report_id == ${f1_id}"
            - "LostFoundReport.${r_id}.match_score == 130"
            - "LostFoundReport.${f1_id}.status == MATCHED"
            - "LostFoundReport.${f2_id}.status == OPEN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dangerous_dog_designation_appeal_cycle
        grounds:
          - state_machines.DangerousDogCase.DESIGNATED_to_APPEALED
          - state_machines.DangerousDogCase.APPEALED_to_DESIGNATED
          - state_machines.DangerousDogCase.INVESTIGATING_to_DESIGNATED
          - entities.DangerousDogCase.fields.status
        distinguishing_aspect: |
          DangerousDogCase exhibits a cycle DESIGNATED → APPEALED → DESIGNATED (uphold): the case
          returns to a previously-occupied state, which a linear pipeline cannot do; verified by
          status returning to DESIGNATED after appeal+uphold while Pet.is_dangerous stays true.
        test_recipe:
          setup:
            - "Pet P of owner OD has a DangerousDogCase that reached DESIGNATED"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /owners"
              payload: { full_name: "Owner D", email: "od@x.com", address_zip: "30001" }
              as: LicensingClerk
              captures: { od_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${od_id}", name: "Fang", species: "DOG", breed: "B", is_altered: false, birth_date: "2023-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${od_id}"
              captures: { pd_id: $.data.id }
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${pd_id}", incident_summary: "bit a child", severity: "ATTACK" }
              as: AnimalControlOfficer
              captures: { dc_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${dc_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${dc_id}/designate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${dc_id}/appeal"
              payload: {}
              as: Owner
              as_user_id: "${od_id}"
          trigger:
            - call: "POST /dangerous-dog-cases/${dc_id}/uphold"
              payload: {}
              as: AnimalControlOfficer
              captures: { dc_status: $.data.status }
          assert:
            - "DangerousDogCase.${dc_id}.status == DESIGNATED"
            - "Pet.${pd_id}.is_dangerous == true"

      - name: lost_found_match_unmatch_open_cycle
        grounds:
          - state_machines.LostFoundReport.OPEN_to_MATCHED
          - state_machines.LostFoundReport.MATCHED_to_OPEN
          - entities.LostFoundReport.fields.status
          - entities.LostFoundReport.fields.matched_report_id
        distinguishing_aspect: |
          LostFoundReport exhibits a cycle OPEN → MATCHED → OPEN (unmatch): the report returns to
          OPEN and is re-matchable, a loop a linear A→B→C pipeline cannot express; this is a different
          entity from the DangerousDogCase cycle above. Verified by status returning to OPEN and
          matched_report_id reset to null on both reports.
        test_recipe:
          setup:
            - "A LOST report R and a FOUND report F (same species+zip, score 30) are matched (both MATCHED, mutually linked)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "CAT", zip_seen: "40404", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { f_id: $.data.id }
            - call: "POST /lost-found-reports"
