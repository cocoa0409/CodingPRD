              as: ClaimsAdjuster
            # Now claim_count==1; Sitter still ACTIVE (the cascade-link-4 condition is claim_count crosses 2).
            # Set up the SECOND booking that's CONFIRMED for the future — this is the booking that will be
            # auto-cancelled by the suspension cascade once the second claim is paid.
