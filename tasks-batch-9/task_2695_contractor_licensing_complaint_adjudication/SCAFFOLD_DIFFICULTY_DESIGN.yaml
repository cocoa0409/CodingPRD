          A four-hop chain whose hops are all CREATIONS rather than status changes, and whose root is a
          different entity from the payout cascade: (1) the approval mints a License, (2) because a
          License now exists a RESPONSIBLE_MANAGING_EMPLOYEE QualifierAssignment is created, (3) because
          that designation is ACTIVE the qualifier's count rises 0 -> 1, (4) because the new licence has
          no verified bond its posture is stamped NON_COMPLIANT at birth.
