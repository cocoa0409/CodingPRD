# =============================================================================
# Task 0772 — Professional Organizer & Decluttering Service
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 — Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: billing_hourly_vs_project_labor_subtotal
        grounds:
          - calculations.invoice_billing_subtotal
          - entities.Invoice.fields.labor_subtotal_cents
          - entities.Project.fields.billing_mode
        distinguishing_aspect: |
          With identical 10-hour completed-session data, the HOURLY invoice's
          labor_subtotal_cents == 66000 (summed per-session labor) while the
          PROJECT invoice's labor_subtotal_cents == 50000 (flat_price_cents,
          actual hours ignored) — dual variants on the Project billing domain.
        test_recipe:
          setup:
            - "Two independent projects (different clients/organizers). Project H is HOURLY with one COMPLETED 10h weekday session (labor 66000). Project J is PROJECT-billed flat_price_cents=50000 with one COMPLETED 10h weekday session."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "H Client", email: "h@x.com", home_address: "1 H St" }, as: OperationsManager, captures: { ch: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OH", email: "oh@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { oh: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${ch}", lead_organizer_id: "${oh}", title: "H", billing_mode: "HOURLY", scope_rooms: ["Garage"] }, as: OperationsManager, captures: { ph: "$.data.id" } }
            - { call: "POST /projects/${ph}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${ph}", organizer_id: "${oh}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T19:00:00Z" }, as: Organizer, as_user_id: "${oh}", captures: { sh: "$.data.id" } }
            - { call: "PATCH /sessions/${sh}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${oh}" }
            - { call: "POST /sessions/${sh}/complete", payload: { logged_hours: 10 }, as: Organizer, as_user_id: "${oh}" }
            - { call: "POST /clients", payload: { full_name: "J Client", email: "j@x.com", home_address: "2 J St" }, as: OperationsManager, captures: { cj: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OJ", email: "oj@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { oj: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${cj}", lead_organizer_id: "${oj}", title: "J", billing_mode: "PROJECT", flat_price_cents: 50000, scope_rooms: ["Closet"] }, as: OperationsManager, captures: { pj: "$.data.id" } }
            - { call: "POST /projects/${pj}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${pj}", organizer_id: "${oj}", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T19:00:00Z" }, as: Organizer, as_user_id: "${oj}", captures: { sj: "$.data.id" } }
            - { call: "PATCH /sessions/${sj}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${oj}" }
            - { call: "POST /sessions/${sj}/complete", payload: { logged_hours: 10 }, as: Organizer, as_user_id: "${oj}" }
            - { call: "GET /projects/${ph}", payload: {}, as: BillingAdmin, captures: { pvh: "$.data.version" } }
            - { call: "GET /projects/${pj}", payload: {}, as: BillingAdmin, captures: { pvj: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${ph}", expected_project_version: "${pvh}" }, as: BillingAdmin, captures: { inv_h: "$.data.labor_subtotal_cents" } }
            - { call: "POST /invoices", payload: { project_id: "${pj}", expected_project_version: "${pvj}" }, as: BillingAdmin, captures: { inv_j: "$.data.labor_subtotal_cents" } }
          assert:
            - "Invoice(H).labor_subtotal_cents == 66000"
            - "Invoice(J).labor_subtotal_cents == 50000"
            - "Invoice(H).grand_total_cents == 71280"
            - "Invoice(J).grand_total_cents == 54000"

      - name: donation_provisional_vs_final_credit
        grounds:
          - calculations.inventory_donation_value
          - entities.InventoryItem.fields.final_value_cents
          - entities.Project.fields.donation_credit_cents
          - state_machines.InventoryItem.SCHEDULED_DONATION_to_DONATED
        distinguishing_aspect: |
          The provisional donation credit from estimated_value_cents=10000 is 1000,
          but the project ledger records only the FINAL credit from appraised
          final_value_cents=8000 == 800 after DONATED — a dual variant on the
          InventoryItem entity domain (distinct from the Project billing dual variant).
        test_recipe:
          setup:
            - "Active project with one DONATE inventory item, estimated_value_cents=10000, scheduled then confirmed DONATED at final_value_cents=8000."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "D Client", email: "d@x.com", home_address: "3 D St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OD", email: "od@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "D", billing_mode: "HOURLY", scope_rooms: ["Attic"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /inventory-items", payload: { project_id: "${p}", room_label: "Attic", description: "Old lamp", disposition: "DONATE", estimated_value_cents: 10000 }, as: Organizer, as_user_id: "${o}", captures: { it: "$.data.id" } }
            - { call: "POST /inventory-items/${it}/schedule", payload: {}, as: Organizer, as_user_id: "${o}", captures: { st_after_sched: "$.data.status" } }
          trigger:
            - { call: "POST /inventory-items/${it}/confirm", payload: { final_value_cents: 8000 }, as: Organizer, as_user_id: "${o}", captures: { fv: "$.data.final_value_cents" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { credit: "$.data.donation_credit_cents" } }
          assert:
            - "InventoryItem.status after schedule == SCHEDULED_DONATION"
            - "InventoryItem.final_value_cents == 8000"
            - "Project.donation_credit_cents == 800"
            - "InventoryItem.haul_fee_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: product_markup_rounding_order_mode_b
        grounds:
          - calculations.product_line_client_price
          - entities.ProductLine.fields.client_price_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: round per-unit marked price FIRST then multiply.
          wholesale=1099, markup=0.35, qty=3 -> round(1483.65)=1484 -> *3 = 4452,
          NOT round(1099*1.35*3)=4451. The pinned order yields client_price_cents==4452.
        test_recipe:
          setup:
            - "Active project; one product line wholesale_cost_cents=1099, markup_pct=0.35, quantity=3."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "P Client", email: "p@x.com", home_address: "4 P St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OP", email: "op@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Pantry"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /product-lines", payload: { project_id: "${p}", product_name: "Bin", category: "BIN", wholesale_cost_cents: 1099, quantity: 3, markup_pct: 0.35 }, as: Organizer, as_user_id: "${o}", captures: { price: "$.data.client_price_cents" } }
          assert:
            - "ProductLine.client_price_cents == 4452"

      - name: invoice_discount_tier_circular_mode_c
        grounds:
          - calculations.invoice_grand_total
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.grand_total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking: discount_pct is keyed on the subtotal tier and
          then folded back into the total. subtotal=336000 (>=200000) -> 5% discount
          16800 -> taxable 319200 -> tax 25536 -> grand_total_cents 344736 under the
          pinned subtotal->discount->tax order.
        test_recipe:
          setup:
            - "Active HOURLY project with one COMPLETED 40h weekday session at rate 6000 -> labor 336000."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "T Client", email: "t@x.com", home_address: "5 T St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OT", email: "ot@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "T", billing_mode: "HOURLY", scope_rooms: ["Basement"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T06:00:00Z", scheduled_end: "2026-03-02T22:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 40 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { disc: "$.data.discount_cents", gt: "$.data.grand_total_cents" } }
          assert:
            - "Invoice.subtotal_cents == 336000"
            - "Invoice.discount_cents == 16800"
            - "Invoice.tax_cents == 25536"
            - "Invoice.grand_total_cents == 344736"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_dispute_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          Invoice cycles ISSUED->DISPUTED->ISSUED and can then be paid — a genuine
          cycle on the Invoice entity (distinct from the InventoryItem branch below).
        test_recipe:
          setup:
            - "Active HOURLY project with a completed session; invoice ISSUED."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "C1", email: "c1@x.com", home_address: "6 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O1", email: "o1@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "C1", billing_mode: "HOURLY", scope_rooms: ["Office"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 3 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { inv: "$.data.id" } }
          trigger:
            - { call: "PATCH /invoices/${inv}", payload: { status: "DISPUTED" }, as: Client, as_user_id: "${c}", captures: { st1: "$.data.status" } }
            - { call: "PATCH /invoices/${inv}", payload: { status: "ISSUED" }, as: BillingAdmin, captures: { st2: "$.data.status" } }
          assert:
            - "Invoice.status after dispute == DISPUTED"
            - "Invoice.status after resolve == ISSUED"

      - name: inventory_disposition_branch_haul_vs_donate
        grounds:
          - state_machines.InventoryItem.LOGGED_to_SCHEDULED_HAUL
          - state_machines.InventoryItem.LOGGED_to_SCHEDULED_DONATION
          - calculations.inventory_haul_fee
        distinguishing_aspect: |
          From LOGGED the item forks by disposition into divergent side-effect sets:
          a HAUL item -> SCHEDULED_HAUL with haul_fee_cents==2500 booked to the
          project haul ledger; a DONATE item -> SCHEDULED_DONATION with
          haul_fee_cents==0. Branch on the InventoryItem entity (distinct entity
          from the Invoice cycle).
        test_recipe:
          setup:
            - "Active project with two LOGGED items: one HAUL, one DONATE."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "C2", email: "c2@x.com", home_address: "7 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O2", email: "o2@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "C2", billing_mode: "HOURLY", scope_rooms: ["Garage"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /inventory-items", payload: { project_id: "${p}", room_label: "Garage", description: "Broken chair", disposition: "HAUL" }, as: Organizer, as_user_id: "${o}", captures: { ih: "$.data.id" } }
            - { call: "POST /inventory-items", payload: { project_id: "${p}", room_label: "Garage", description: "Books", disposition: "DONATE", estimated_value_cents: 3000 }, as: Organizer, as_user_id: "${o}", captures: { id2: "$.data.id" } }
          trigger:
            - { call: "POST /inventory-items/${ih}/schedule", payload: {}, as: Organizer, as_user_id: "${o}", captures: { hst: "$.data.status", hfee: "$.data.haul_fee_cents" } }
            - { call: "POST /inventory-items/${id2}/schedule", payload: {}, as: Organizer, as_user_id: "${o}", captures: { dst: "$.data.status", dfee: "$.data.haul_fee_cents" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { haulcost: "$.data.projected_haul_cost_cents" } }
          assert:
            - "InventoryItem(HAUL).status == SCHEDULED_HAUL"
            - "InventoryItem(HAUL).haul_fee_cents == 2500"
            - "InventoryItem(DONATE).status == SCHEDULED_DONATION"
            - "InventoryItem(DONATE).haul_fee_cents == 0"
            - "Project.projected_haul_cost_cents == 2500"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_cascade_depth3
        grounds:
          - state_machines.Project.ACTIVE_to_CANCELLED
          - state_machines.ProductLine.QUOTED_to_CANCELLED
          - entities.Project.fields.projected_product_cost_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /projects/{id}/cancel: A Project->CANCELLED causes
          B ProductLine QUOTED->CANCELLED, which itself causes C the product-cost
          ledger to decrement to 0. Each link is caused by the previous.
        test_recipe:
          setup:
            - "Active project with one QUOTED product line (client_price 4452); projected_product_cost_cents=4452."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "C3", email: "c3@x.com", home_address: "8 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O3", email: "o3@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "C3", billing_mode: "HOURLY", scope_rooms: ["Den"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /product-lines", payload: { project_id: "${p}", product_name: "Bin", category: "BIN", wholesale_cost_cents: 1099, quantity: 3, markup_pct: 0.35 }, as: Organizer, as_user_id: "${o}", captures: { pl: "$.data.id" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { pc_before: "$.data.projected_product_cost_cents" } }
          trigger:
            - { call: "POST /projects/${p}/cancel", payload: {}, as: OperationsManager, captures: { pstat: "$.data.status", pc_after: "$.data.projected_product_cost_cents" } }
            - { call: "GET /product-lines/${pl}", payload: {}, as: OperationsManager, captures: { plstat: "$.data.status" } }
          assert:
            - "Project.projected_product_cost_cents before cancel == 4452"
            - "Project.status == CANCELLED"
            - "ProductLine.status == CANCELLED"
            - "Project.projected_product_cost_cents after cancel == 0"

      - name: invoice_pay_cascade_depth3
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Project.WRAP_UP_to_CLOSED
          - state_machines.MaintenancePlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from POST /invoices/{id}/pay (different trigger than cancel):
          A Invoice->PAID causes B Project WRAP_UP->CLOSED, which causes C the
          project's DRAFT MaintenancePlan to activate (DRAFT->ACTIVE).
        test_recipe:
          setup:
            - "Active HOURLY project with a completed session, a DRAFT maintenance plan, and an ISSUED invoice (project in WRAP_UP)."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "C4", email: "c4@x.com", home_address: "9 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O4", email: "o4@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "C4", billing_mode: "HOURLY", scope_rooms: ["Loft"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /maintenance-plans", payload: { project_id: "${p}", cadence: "QUARTERLY", monthly_fee_cents: 9900 }, as: OperationsManager, captures: { mp: "$.data.id" } }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T13:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 4 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { inv: "$.data.id" } }
          trigger:
            - { call: "POST /invoices/${inv}/pay", payload: {}, as: BillingAdmin, captures: { istat: "$.data.status" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { pstat: "$.data.status" } }
            - { call: "GET /maintenance-plans/${mp}", payload: {}, as: OperationsManager, captures: { mstat: "$.data.status" } }
          assert:
            - "Invoice.status == PAID"
            - "Project.status == CLOSED"
            - "MaintenancePlan.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_session_create
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PROJECT_TERMINAL]
          - errors[ERR_ORGANIZER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          A session create that targets a CANCELLED project (state, priority 6,
          ERR_PROJECT_TERMINAL) AND double-books the organizer (temporal, priority 8)
          returns ERR_PROJECT_TERMINAL — the state check outranks the temporal check.
          Category pair: state vs business_temporal.
        test_recipe:
          setup:
            - "Organizer O booked on ACTIVE project A (session Mon 09:00-19:00). Project B (different client, same organizer O) is CANCELLED."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CA", email: "ca@x.com", home_address: "10 St" }, as: OperationsManager, captures: { ca: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OO", email: "oo@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${ca}", lead_organizer_id: "${o}", title: "A", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { pa: "$.data.id" } }
            - { call: "POST /projects/${pa}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${pa}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T19:00:00Z" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /clients", payload: { full_name: "CB", email: "cb@x.com", home_address: "11 St" }, as: OperationsManager, captures: { cb: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${cb}", lead_organizer_id: "${o}", title: "B", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { pb: "$.data.id" } }
            - { call: "POST /projects/${pb}/cancel", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /sessions", payload: { project_id: "${pb}", organizer_id: "${o}", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PROJECT_TERMINAL"
            - "HTTP status == 409"

      - name: constraint_beats_fiscal_on_invoice_create
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_UNRESOLVED_SESSIONS]
          - errors[ERR_NO_BILLABLE_WORK]
        distinguishing_aspect: |
          An invoice create on an ACTIVE HOURLY project that has an IN_PROGRESS session
          (constraint, priority 10, ERR_UNRESOLVED_SESSIONS) AND zero COMPLETED
          sessions (fiscal, priority 11, ERR_NO_BILLABLE_WORK) returns
          ERR_UNRESOLVED_SESSIONS. Category pair: business_constraint vs business_fiscal.
        test_recipe:
          setup:
            - "Active HOURLY project with one IN_PROGRESS session and zero COMPLETED sessions."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CF", email: "cf@x.com", home_address: "12 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OF", email: "of@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "F", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNRESOLVED_SESSIONS"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: overtime_threshold_strict_at_8h
        grounds:
          - calculations.session_labor_cost
          - entities.Session.fields.is_overtime
        distinguishing_aspect: |
          logged_hours exactly 8.0 is NOT overtime (strict > OVERTIME_THRESHOLD_HOURS):
          is_overtime==false and labor_cost_cents==48000 (no 1.5x tier). Reached via
          POST /sessions/{id}/complete (numeric-threshold boundary).
        test_recipe:
          setup:
            - "Active HOURLY project, organizer rate 6000, one IN_PROGRESS weekday session."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CB8", email: "cb8@x.com", home_address: "13 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OB8", email: "ob8@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "B8", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T17:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
          trigger:
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 8.0 }, as: Organizer, as_user_id: "${o}", captures: { ot: "$.data.is_overtime", cost: "$.data.labor_cost_cents" } }
          assert:
            - "Session.is_overtime == false"
            - "Session.labor_cost_cents == 48000"

      - name: invoice_no_billable_empty_completed_set
        grounds:
          - validations[priority=11]
          - errors[ERR_NO_BILLABLE_WORK]
        distinguishing_aspect: |
          An empty-set boundary distinct from the overtime numeric threshold: a HOURLY
          project with zero COMPLETED sessions (the one session was CANCELLED) yields
          ERR_NO_BILLABLE_WORK at POST /invoices (a different endpoint than complete).
        test_recipe:
          setup:
            - "Active HOURLY project; one session created then CANCELLED (so no unresolved and no completed sessions)."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CE", email: "ce@x.com", home_address: "14 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OE", email: "oe@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "E", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "CANCELLED" }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NO_BILLABLE_WORK"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_start_requires_project_active
        grounds:
          - state_machines.Session.SCHEDULED_to_IN_PROGRESS
          - entities.Project.fields.status
          - errors[ERR_PROJECT_NOT_ACTIVE]
        distinguishing_aspect: |
          Session pair -> Project: a SCHEDULED session pre-created while the project is
          in SCOPING cannot start (PATCH status=IN_PROGRESS) -> ERR_PROJECT_NOT_ACTIVE;
          after the project is activated the same start succeeds.
        test_recipe:
          setup:
            - "Project in SCOPING (not yet activated) with a pre-scheduled SCHEDULED session."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CX", email: "cx@x.com", home_address: "15 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OX", email: "ox@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "X", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-09T09:00:00Z", scheduled_end: "2026-03-09T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
          trigger:
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}", captures: { st_ok: "$.data.status" } }
          assert:
            - "first PATCH response error_id == ERR_PROJECT_NOT_ACTIVE"
            - "Session.status after activate+start == IN_PROGRESS"

      - name: invoice_create_requires_sessions_terminal
        grounds:
          - validations[priority=10]
          - entities.Session.fields.status
          - errors[ERR_UNRESOLVED_SESSIONS]
        distinguishing_aspect: |
          Invoice pair -> Session (different pair than Session->Project): invoice
          creation is blocked while any Session is SCHEDULED/IN_PROGRESS
          (ERR_UNRESOLVED_SESSIONS); once the blocking session is COMPLETED the invoice
          issues. Demonstrated with a single SCHEDULED session (never started).
        test_recipe:
          setup:
            - "Active HOURLY project with one COMPLETED session (billable) and one still-SCHEDULED session."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CY", email: "cy@x.com", home_address: "16 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OY", email: "oy@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "Y", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s1: "$.data.id" } }
            - { call: "PATCH /sessions/${s1}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s1}/complete", payload: { logged_hours: 3 }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-10T09:00:00Z", scheduled_end: "2026-03-10T12:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s2: "$.data.id" } }
            - { call: "GET /projects/${p}", payload: {}, as: BillingAdmin, captures: { pv: "$.data.version" } }
          trigger:
            - { call: "POST /invoices", payload: { project_id: "${p}", expected_project_version: "${pv}" }, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNRESOLVED_SESSIONS"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: organizer_travel_buffer_overlap
        grounds:
          - validations[priority=8]
          - entities.Session.fields.organizer_id
          - errors[ERR_ORGANIZER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Organizer resource, buffered semantics: two sessions for the same organizer
          15 minutes apart (S1 ends 11:00, S2 starts 11:15) collide because the gap is
          under the 30-minute TRAVEL_BUFFER even though the half-open intervals do not
          overlap. Sessions are on different clients so client whole-day does not apply.
        test_recipe:
          setup:
            - "Organizer O on ACTIVE project A (client CA) with session 09:00-11:00 Mon; ACTIVE project B (client CB) exists for a second session."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CA2", email: "ca2@x.com", home_address: "17 St" }, as: OperationsManager, captures: { ca: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "CB2", email: "cb2@x.com", home_address: "18 St" }, as: OperationsManager, captures: { cb: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OBuf", email: "obuf@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${ca}", lead_organizer_id: "${o}", title: "A", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { pa: "$.data.id" } }
            - { call: "POST /projects/${pa}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${pa}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /projects", payload: { client_id: "${cb}", lead_organizer_id: "${o}", title: "B", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { pb: "$.data.id" } }
            - { call: "POST /projects/${pb}/activate", payload: {}, as: OperationsManager }
          trigger:
            - { call: "POST /sessions", payload: { project_id: "${pb}", organizer_id: "${o}", scheduled_start: "2026-03-02T11:15:00Z", scheduled_end: "2026-03-02T12:15:00Z" }, as: Organizer, as_user_id: "${o}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ORGANIZER_DOUBLE_BOOKED"
            - "HTTP status == 409"

      - name: client_home_whole_day_overlap
        grounds:
          - validations[priority=9]
          - entities.Client.fields.home_address
          - errors[ERR_CLIENT_HOME_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Client resource, whole-day semantics: two sessions for the same client on the
          same UTC calendar date (09:00-10:00 and 14:00-15:00) collide even though the
          times are 4 hours apart and use different organizers — the entire day is
          exclusive to one session per client home. Different interval geometry and
          different resource entity than the organizer buffer rule.
        test_recipe:
          setup:
            - "Client C with ACTIVE project P; two organizers O1, O2; one session already booked 09:00-10:00 Mon with O1."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CDay", email: "cday@x.com", home_address: "19 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O1d", email: "o1d@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o1: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "O2d", email: "o2d@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o2: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o1}", title: "P", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o1}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: Organizer, as_user_id: "${o1}" }
          trigger:
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o2}", scheduled_start: "2026-03-02T14:00:00Z", scheduled_end: "2026-03-02T15:00:00Z" }, as: Organizer, as_user_id: "${o2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CLIENT_HOME_DOUBLE_BOOKED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: labor_hours_conserved_on_session_void
        grounds:
          - state_machines.Session.COMPLETED_to_CANCELLED
          - calculations.project_labor_hours_ledger
          - entities.Project.fields.accrued_labor_hours
        distinguishing_aspect: |
          Conserved quantity = labor hours. Completing a 10h session sets
          accrued_labor_hours=10; voiding it (COMPLETED->CANCELLED) returns
          accrued_labor_hours to 0, exactly matching sum(logged_hours over COMPLETED).
        test_recipe:
          setup:
            - "Active HOURLY project with one COMPLETED 10h session; accrued_labor_hours=10."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CH", email: "ch2@x.com", home_address: "20 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OH2", email: "oh2@x.com", hourly_rate_cents: 6000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "H2", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /sessions", payload: { project_id: "${p}", organizer_id: "${o}", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T19:00:00Z" }, as: Organizer, as_user_id: "${o}", captures: { s: "$.data.id" } }
            - { call: "PATCH /sessions/${s}", payload: { status: "IN_PROGRESS" }, as: Organizer, as_user_id: "${o}" }
            - { call: "POST /sessions/${s}/complete", payload: { logged_hours: 10 }, as: Organizer, as_user_id: "${o}" }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { h_before: "$.data.accrued_labor_hours" } }
          trigger:
            - { call: "PATCH /sessions/${s}", payload: { status: "CANCELLED" }, as: Organizer, as_user_id: "${o}", captures: { sstat: "$.data.status" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { h_after: "$.data.accrued_labor_hours" } }
          assert:
            - "Project.accrued_labor_hours before void == 10"
            - "Session.status == CANCELLED"
            - "Project.accrued_labor_hours after void == 0"

      - name: product_cost_conserved_on_line_cancel
        grounds:
          - state_machines.ProductLine.QUOTED_to_CANCELLED
          - calculations.project_product_cost_ledger
          - entities.Project.fields.projected_product_cost_cents
        distinguishing_aspect: |
          Conserved quantity = money (product cost, distinct from labor hours). Adding a
          product line sets projected_product_cost_cents=4452; cancelling it returns the
          ledger to 0, matching sum(client_price_cents over non-cancelled lines).
        test_recipe:
          setup:
            - "Active HOURLY project with one QUOTED product line (client_price 4452)."
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "CP2", email: "cp2@x.com", home_address: "21 St" }, as: OperationsManager, captures: { c: "$.data.id" } }
            - { call: "POST /organizers", payload: { full_name: "OP2", email: "op2@x.com", hourly_rate_cents: 5000 }, as: OperationsManager, captures: { o: "$.data.id" } }
            - { call: "POST /projects", payload: { client_id: "${c}", lead_organizer_id: "${o}", title: "P2", billing_mode: "HOURLY", scope_rooms: ["Room"] }, as: OperationsManager, captures: { p: "$.data.id" } }
            - { call: "POST /projects/${p}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /product-lines", payload: { project_id: "${p}", product_name: "Bin", category: "BIN", wholesale_cost_cents: 1099, quantity: 3, markup_pct: 0.35 }, as: Organizer, as_user_id: "${o}", captures: { pl: "$.data.id" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { pc_before: "$.data.projected_product_cost_cents" } }
          trigger:
            - { call: "PATCH /product-lines/${pl}", payload: { status: "CANCELLED" }, as: Organizer, as_user_id: "${o}", captures: { plstat: "$.data.status" } }
            - { call: "GET /projects/${p}", payload: {}, as: OperationsManager, captures: { pc_after: "$.data.projected_product_cost_cents" } }
          assert:
            - "Project.projected_product_cost_cents before cancel == 4452"
            - "ProductLine.status == CANCELLED"
            - "Project.projected_product_cost_cents after cancel == 0"
