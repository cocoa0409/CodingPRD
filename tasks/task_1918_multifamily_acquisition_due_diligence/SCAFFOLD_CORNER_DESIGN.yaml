            - { call: "POST /acquisitions/proration-statements/${stmt}/lines", payload: { expected_statement_version: "${sv1}", line_type: "ADJUSTMENT", direction: "CREDIT_BUYER", amount_cents: 25000, memo: "stale replay" }, as: UnderwritingManager, as_user_id: "um-1", captures: { err: $.data.error_id } }
