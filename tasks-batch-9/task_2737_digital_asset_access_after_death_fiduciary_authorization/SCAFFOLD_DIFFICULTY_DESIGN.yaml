            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-G1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
