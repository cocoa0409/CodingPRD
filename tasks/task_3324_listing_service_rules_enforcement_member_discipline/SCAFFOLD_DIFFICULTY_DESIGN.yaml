  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reconcile_suspends_member_cascades_office_and_blocks_listing
        grounds:
          - state_machines.DuesPeriod.BILLED_to_RECONCILED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Office.ACTIVE_to_SUSPENDED
          - state_machines.Listing.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Depth-4 chain from reconcile: DuesPeriod RECONCILED -> Member SUSPENDED
          -> Office SUSPENDED (broker link) -> Listing activation rejected
          (ERR_MEMBER_SUSPENDED); each hop is caused by the previous hop's
          mutation, and the final observable is on a fourth entity that the
          original reconcile request never names.
        test_recipe:
          setup:
            - "Association A; member MB is broker of office O and listing agent of DRAFT listing L"
            - "DuesPeriod P (due 2027-01-31, grace 2027-03-02) billed while clock at 2027-01-15 (no late fee); MB's invoice left PENDING"
            - "Clock advanced to 2027-03-03 (past grace_end_date)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "TC1", name: "Cascade Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
