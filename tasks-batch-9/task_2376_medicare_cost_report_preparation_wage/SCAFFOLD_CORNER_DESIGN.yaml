              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2024-07-01", fiscal_year_end: "2025-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 0, total_charges_cents: 300000000, medicare_discharges: 400 }
              as: SystemAdmin
              captures: { prior_report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${prior_report_id}/appeal-cases"
              payload: { settlement_id: "${settlement_final_id}", kind: "REOPENING", issue_description: "Wage index occupational mix hours misclassified", amount_at_issue_cents: 2500000 }
              as: ReimbursementManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_SETTLEMENT_FOREIGN_TO_REPORT\""
            - "${err_id} is NOT \"ERR_SETTLEMENT_STAGE_INVALID\""
            - "${err_id} is NOT \"ERR_APPEAL_WINDOW_EXPIRED\""
            - "GET /cost-reports/${prior_report_id}/appeal-cases returns total_count == 0"
            - "CostReport.${prior_report_id}.status == DRAFT"

      - name: stepdown_run_with_an_unmapped_ledger_line_is_rejected
        claim_type: Triggerable
        grounds:
          - errors[ERR_UNMAPPED_TRIAL_BALANCE]
          - validations[priority=13]
          - calculations.trial_balance_mapping_rollup
        distinguishing_aspect: "Ledger line 6200 is loaded without mapped_cost_center_id, so unmapped_tb_total_cents is 200000000 and POST /cost-reports/{id}/stepdown-runs returns ERR_UNMAPPED_TRIAL_BALANCE (422) even though the GENERAL_SERVICE plus ROUTINE structure is complete."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport with cost centers 00100 (GENERAL_SERVICE) and 03000 (ROUTINE)"
            - "line 6000 for 100000000 cents mapped to 00100 and line 6200 for 200000000 cents left UNMAPPED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries awaiting mapping", amount_cents: 200000000 }
              as: ReimbursementAnalyst
              captures: { tb_unmapped_id: $.data.id }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "${err_id} == \"ERR_UNMAPPED_TRIAL_BALANCE\""
            - "${err_id} is NOT \"ERR_STEPDOWN_STRUCTURE_INCOMPLETE\""
            - "TrialBalanceLine.${tb_unmapped_id}.status == UNMAPPED"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 200000000"
            - "CostReport.${report_id}.total_direct_cost_cents == 100000000"
            - "CostReport.${report_id}.allocation_status == NOT_RUN"
            - "GET /cost-reports/${report_id}/stepdown-runs returns total_count == 0"

      - name: cost_center_foreign_to_report_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_COST_CENTER_FOREIGN_TO_REPORT]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / foreign_cost_center_leg_outranks_unbalanced_reclassification"
          rationale: "That depth instance already posts a reclassification whose leg names a cost center owned by a different CostReport and pins the response to ERR_COST_CENTER_FOREIGN_TO_REPORT, so the breadth probe would repeat the same trigger path verbatim."

      - name: filing_deadline_passed_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_FILING_DEADLINE_PASSED]
          - validations[priority=12]
          - calculations.filing_deadline_computation
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / filing_deadline_outranks_unmapped_trial_balance_on_file"
          rationale: "That depth instance advances the logical clock past the fiscal-year-end-plus-five-months deadline and files a report that also has unmapped ledger cost and a stale allocation, asserting ERR_FILING_DEADLINE_PASSED wins; a separate breadth instance would add no new coverage."

      - name: wage_submission_not_accepted_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_WAGE_SUBMISSION_NOT_ACCEPTED]
          - validations[priority=13]
          - state_machines.WageIndexSubmission
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cost_report_cannot_be_filed_until_wage_submission_is_accepted"
          rationale: "That depth instance files a report whose WageIndexSubmission is still UNDER_REVIEW and asserts ERR_WAGE_SUBMISSION_NOT_ACCEPTED, which is the only way to reach the code."

      - name: settlement_stage_invalid_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_SETTLEMENT_STAGE_INVALID]
          - validations[priority=13]
          - endpoints[POST /cost-reports/{id}/appeal-cases]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / appeal_case_cannot_be_opened_against_a_tentative_settlement"
          rationale: "That depth instance opens an appeal against the report's own TENTATIVE Settlement and pins ERR_SETTLEMENT_STAGE_INVALID while explicitly excluding ERR_SETTLEMENT_FOREIGN_TO_REPORT, so the stage branch is already isolated."

      - name: resident_daily_fte_exceeded_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_RESIDENT_DAILY_FTE_EXCEEDED]
          - validations[priority=12]
          - calculations.gme_fte_rolling_average
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / resident_daily_fte_capacity_over_half_open_rotation_intervals"
          rationale: "That depth instance overlaps two rotations on the same calendar day so the summed daily FTE passes RESIDENT_DAILY_FTE_CAP 1.0000 and asserts ERR_RESIDENT_DAILY_FTE_EXCEEDED; duplicating it here would only re-test the same interval arithmetic."

      - name: interim_period_overlap_error_is_triggerable
        claim_type: Triggerable
        grounds:
          - errors[ERR_INTERIM_PERIOD_OVERLAP]
          - validations[priority=12]
          - entities.InterimRateRequest
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / interim_rate_periods_need_a_thirty_day_gap_on_inclusive_bounds"
          rationale: "That depth instance submits a second InterimRateRequest whose inclusive effective window sits inside the required thirty-day gap of a live request and asserts ERR_INTERIM_PERIOD_OVERLAP."

  - section: rbac
    # Table 7 of the claim-extraction guide declares no claim_type rows; the two
    # bullets are used verbatim as claim types ("Can perform all exclusive_operations
    # and shared_operations" / "Cannot perform other roles' exclusive_operations"),
    # plus the role-model rows for segregation_of_duties and peer_roles.
    instances:

      - name: analyst_can_perform_every_preparation_operation_it_owns
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - rbac.roles[ReimbursementAnalyst]
          - endpoints[all ReimbursementAnalyst exclusive_operations]
          - rbac.role_model=segregation_of_duties
        distinguishing_aspect: "A single ReimbursementAnalyst walks all thirteen of its exclusive operations plus the two shared ones (POST /cost-reports/{id}/stepdown-runs and POST /ucc-data-sets/{id}/recompute) on one report and every call succeeds, so no preparation endpoint is accidentally gated behind the manager or auditor role."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 and one DRAFT CostReport FY 2025-07-01..2026-06-30 exist"
            - "no cost centers, ledger lines, wage data, residents or uncompensated care data yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "PATCH /cost-centers/${cc_routine}"
              payload: { statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000 }
              as: ReimbursementAnalyst
              captures: { tb_nursing_id: $.data.id }
            - call: "POST /trial-balance-lines/${tb_nursing_id}/map"
              payload: { cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/workpaper-entries"
              payload: { entry_type: "RECLASSIFICATION", code: "A-6-1", description: "Move nursing administration to routine", legs: [ { cost_center_id: "${cc_ag}", amount_cents: -5000000 }, { cost_center_id: "${cc_routine}", amount_cents: 5000000 } ] }
              as: ReimbursementAnalyst
              captures: { wp_id: $.data.id }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00, wage_related_costs_cents: 1000000000, contract_labor_cents: 200000000, contract_labor_hours: 80000.00, excluded_area_salaries_cents: 100000000, excluded_area_hours: 50000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
            - call: "PATCH /wage-index-submissions/${wis_id}"
              payload: { contract_labor_cents: 250000000 }
              as: ReimbursementAnalyst
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 1200000.00, reported_salaries_cents: 4200000000 }
              as: ReimbursementAnalyst
              captures: { occ_rn_id: $.data.id }
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Okafor MD", program: "Internal Medicine", irp_status: "WITHIN_IRP" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-07-01", end_date: "2025-08-01", fte_fraction: 1.00 }
              as: ReimbursementAnalyst
              captures: { rotation_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/ucc-data-sets"
              payload: { medicaid_non_medicare_days: 7495, total_inpatient_days: 100000, ssi_days: 7495, medicare_part_a_days: 100000, charity_care_charges_cents: 40000000, non_medicare_bad_debt_cents: 10000000 }
              as: ReimbursementAnalyst
              captures: { ucc_id: $.data.id }
            - call: "POST /ucc-data-sets/${ucc_id}/recompute"
              payload: {}
              as: ReimbursementAnalyst
            - call: "POST /rotation-assignments/${rotation_id}/void"
              payload: {}
              as: ReimbursementAnalyst
            - call: "POST /workpaper-entries/${wp_id}/reverse"
              payload: {}
              as: ReimbursementAnalyst
          assert:
            - "every call above returns 2xx and no response carries an error_id"
            - "CostCenter.${cc_ag}.direct_cost_cents == 100000000"
            - "CostCenter.${cc_routine}.statistics.SQUARE_FEET == 3000"
            - "StepdownRun.${run_id}.status == STALE"
            - "OccMixResponse.${occ_rn_id}.category_ahw_cents == 3500"
            - "RotationAssignment.${rotation_id}.status == VOID"
            - "RotationAssignment.${rotation_id}.fte_days == 0.0000"
            - "Resident.${resident_id}.assigned_fte_days == 0.0000"
            - "UccDataSet.${ucc_id}.uncompensated_care_cost_cents == 36500000"
            - "UccDataSet.${ucc_id}.ucc_payment_cents == 7300000"
            - "UccDataSet.${ucc_id}.recompute_required == false"
            - "CostReport.${report_id}.allocation_status == STALE"
            - "CostReport.${report_id}.status == DRAFT"

      - name: manager_cannot_create_a_cost_center
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.roles[ReimbursementManager].scope_rule
          - endpoints[POST /cost-reports/{id}/cost-centers]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /cost-reports/{id}/cost-centers lists ReimbursementAnalyst only, so the peer ReimbursementManager - who may file the very same report - is refused with ERR_FORBIDDEN_ROLE (403) and no CostCenter row is created."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport and no cost centers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${err_id} == \"ERR_FORBIDDEN_ROLE\""
            - "GET /cost-reports/${report_id}/cost-centers returns total_count == 0"
            - "CostReport.${report_id}.version == 1"

      - name: analyst_cannot_file_the_cost_report
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.roles[ReimbursementAnalyst].scope_rule
          - endpoints[POST /cost-reports/{id}/file]
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=2]
        distinguishing_aspect: "The preparer/attester split means the analyst who built the report cannot file it: the priority-2 role gate returns ERR_FORBIDDEN_ROLE (403) before any of the priority-12/13 filing-readiness rules are consulted, so an unfinished report still answers 403 and not ERR_UNMAPPED_TRIAL_BALANCE."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport that has no cost centers, no wage submission and no uncompensated care data"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/file"
              payload: {}
              as: ReimbursementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${err_id} == \"ERR_FORBIDDEN_ROLE\""
            - "${err_id} is NOT \"ERR_UNMAPPED_TRIAL_BALANCE\""
            - "${err_id} is NOT \"ERR_WAGE_SUBMISSION_NOT_ACCEPTED\""
            - "CostReport.${report_id}.status == DRAFT"
            - "CostReport.${report_id}.filed_at == null"

      - name: review_board_clerk_cannot_read_a_cost_report
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.roles[ReviewBoardClerk].scope_rule
          - endpoints[GET /cost-reports/{id}]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "ReviewBoardClerk is the one role excluded from the otherwise universal read surface: GET /cost-reports/{id} omits it from roles, so the clerk gets ERR_FORBIDDEN_ROLE (403) rather than the report body every other authenticated role receives."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with one DRAFT CostReport"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReviewBoardClerk
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "${err_id} == \"ERR_FORBIDDEN_ROLE\""
            - "${err_id} is NOT \"ERR_COST_REPORT_NOT_FOUND\""
            - "the response carries no data.status field for the cost report"

      - name: review_board_clerk_can_hear_a_prrb_appeal_and_read_its_settlement
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - rbac.roles[ReviewBoardClerk]
          - state_machines.AppealCase[REQUESTED->HEARD]
          - endpoints[POST /appeal-cases/{id}/decide]
        distinguishing_aspect: "The clerk's whole surface is exercised: HEAR on a PRRB_APPEAL against an APPEALED FINAL settlement succeeds and its two permitted reads (GET /appeal-cases/{id}, GET /settlements/{id}) return bodies, while the outcome sets decided_at to null - the one transition in the entity that deliberately leaves decided_at unset."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a FINAL_SETTLED CostReport with a FINAL Settlement flipped to APPEALED by a protested audit adjustment"
            - "a REQUESTED AppealCase of kind PRRB_APPEAL for 2500000 cents against that settlement"
          setup_api_calls:
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
