          trigger:
            - call: "POST /karting/seasons"
              payload: { name: "Forbidden Cup", year: 2026, points_scheme: [25, 22, 20] }
              as: Driver
              as_user_id: "${d_d}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403); no season created"

