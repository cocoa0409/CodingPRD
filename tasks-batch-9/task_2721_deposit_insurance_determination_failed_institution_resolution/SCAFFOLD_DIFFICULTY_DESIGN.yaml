              captures: { mira_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${instF_id}", primary_depositor_id: "${mira_id}", account_number: "M-0001", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { m1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${instF_id}", primary_depositor_id: "${mira_id}", account_number: "M-0002", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { m2_id: $.data.id }
            - call: "POST /institutions/${instF_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 29000001 }
              as: ClosingManager
              captures: { subF_id: $.data.id }
            - call: "POST /readiness-submissions/${subF_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${instF_id}/close"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${mira_id}"
              as: ClaimsAgent
              captures: { mira_v: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${mira_id}", expected_depositor_record_version: "${mira_v}" }
              as: ClaimsAgent
              captures: { mira_det_id: $.data.id }
            - call: "POST /insurance-determinations/${mira_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${mira_det_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${mira_det_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
          trigger:
            - call: "POST /deposit-accounts/${m1_id}/release-hold"
              payload: {}
              as: ClaimsCertifier
              captures: { ack_gate_error_id: "$.data.error_id", ack_gate_message: "$.data.message" }
            - call: "POST /depositor-records/${mira_id}/acknowledge-notice"
              payload: {}
              as: Depositor
              as_user_id: "${mira_id}"
            - call: "POST /deposit-accounts/${m1_id}/release-hold"
              payload: {}
              as: ClaimsCertifier
          assert:
            - "trigger[0] returns HTTP 409 with data.error_id == 'ERR_NOTICE_NOT_ACKNOWLEDGED' while DepositorRecord.${mira_id}.notice_status == SENT"
            - "trigger[0] leaves DepositAccount.${m1_id}.hold_status == HELD with held_amount_cents == 2758622 (unchanged) and the version not incremented"
            - "trigger[1] response data.notice_status == ACKNOWLEDGED and data.acknowledged_at == '2026-08-03T09:00:00Z'"
            - "trigger[2] response data.hold_status == RELEASED and data.held_amount_cents == 0 — the identical request now succeeds purely because the parent entity moved"
            - "DepositAccount.${m2_id}.hold_status == HELD with held_amount_cents == 1241379 — acknowledging the notice does not itself release any hold"
            - "the ReceivershipCertificate for ${mira_det_id} is still status ISSUED with face_amount_cents == 4000001"

  # ===================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: branch_window_half_open_adjacency_allowed_overlap_conflict
        grounds:
          - validations[priority=63]
          - errors[ERR_BRANCH_WINDOW_OVERLAP]
          - entities.BranchReopening.fields.reopen_window_start
          - endpoints[POST /institutions/{id}/branch-reopenings]
        distinguishing_aspect: |
          Resource entity: BranchReopening, scoped per (institution_id, branch_code). Interval semantics:
          HALF-OPEN [start, end) with NO buffer, so exact adjacency (new_start == existing_end) is
          ALLOWED. The test pins all three regimes on one resource: adjacency accepted, true overlap
          rejected, and an identical window on a different branch_code accepted (the resource key is the
          branch, not the institution).
        test_recipe:
          setup:
            - "Institution 34580 is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED deposit-free readiness package (200 records, 4 malformed, reported total 0 against 0 booked accounts)."
            - "No BranchReopening rows exist yet for this institution."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34580", legal_name: "Yakima Branch Network Bank", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { instG_id: $.data.id }
            - call: "POST /institutions/${instG_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 0 }
              as: ClosingManager
              captures: { subG_id: $.data.id }
            - call: "POST /readiness-submissions/${subG_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${instG_id}/close"
              payload: {}
              as: ClosingManager
          trigger:
            - call: "POST /institutions/${instG_id}/branch-reopenings"
              payload: { branch_code: "BR-01", reopen_window_start: "2026-08-10T09:00:00Z", reopen_window_end: "2026-08-10T17:00:00Z", staffing_headcount: 10 }
              as: ClosingManager
              captures: { brA_id: $.data.id }
            - call: "POST /institutions/${instG_id}/branch-reopenings"
              payload: { branch_code: "BR-01", reopen_window_start: "2026-08-10T17:00:00Z", reopen_window_end: "2026-08-11T01:00:00Z", staffing_headcount: 6 }
              as: ClosingManager
              captures: { brB_id: $.data.id }
            - call: "POST /institutions/${instG_id}/branch-reopenings"
              payload: { branch_code: "BR-01", reopen_window_start: "2026-08-10T16:00:00Z", reopen_window_end: "2026-08-10T18:00:00Z", staffing_headcount: 4 }
              as: ClosingManager
              captures: { overlap_error_id: "$.data.error_id", overlap_message: "$.data.message" }
            - call: "POST /institutions/${instG_id}/branch-reopenings"
              payload: { branch_code: "BR-02", reopen_window_start: "2026-08-10T09:00:00Z", reopen_window_end: "2026-08-10T17:00:00Z", staffing_headcount: 10 }
              as: ClosingManager
              captures: { brC_id: $.data.id }
          assert:
            - "trigger[0] returns HTTP 201 with data.status == PLANNED, data.branch_code == 'BR-01', data.reschedule_count == 0"
            - "trigger[1] returns HTTP 201 — new_start 2026-08-10T17:00:00Z == existing_end 2026-08-10T17:00:00Z is exact adjacency, and half-open intervals with no buffer permit it"
            - "trigger[2] returns HTTP 409 with data.error_id == 'ERR_BRANCH_WINDOW_OVERLAP' — [16:00, 18:00) straddles both existing windows (16:00 < 17:00 and 09:00 < 18:00)"
            - "trigger[2] creates no row: GET /institutions/${instG_id}/branch-reopenings with branch_code == 'BR-01' returns total_count == 2"
            - "trigger[3] returns HTTP 201 with data.branch_code == 'BR-02' — an identical window on a different branch_code is not a conflict, because the resource key is (institution_id, branch_code)"
            - "GET /institutions/${instG_id}/branch-reopenings returns total_count == 3, all with status == PLANNED"

      - name: data_room_closed_interval_requires_more_than_sixty_minute_buffer
        grounds:
          - validations[priority=65]
          - errors[ERR_DATA_ROOM_WINDOW_CONFLICT]
          - entities.Bid.fields.data_room_window_start
          - endpoints[POST /bids]
        distinguishing_aspect: |
          A DIFFERENT resource entity (the institution-wide data room carried on Bid rows, shared
          across ALL bidders) with DIFFERENT interval semantics: CLOSED intervals [start, end] plus a
          mandatory 60-minute separation. Exactly the opposite boundary verdict from the branch rule —
          a gap of exactly 60 minutes is REJECTED here, whereas a gap of zero is accepted there. A
          61-minute gap is accepted, and the conflict crosses bidder boundaries.
        test_recipe:
          setup:
            - "Institution 34581 is CLOSED_IN_RECEIVERSHIP with franchise_marketing_status OPEN and bid_deadline_at 2026-09-30T00:00:00Z (deposit-free estate)."
            - "Two QUALIFIED bidders exist: Wenatchee Federal and Kitsap Commerce."
            - "No Bid rows exist yet, so the data room is completely free."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34581", legal_name: "Wenatchee Data Room Bank", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { instH_id: $.data.id }
            - call: "POST /institutions/${instH_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 0 }
              as: ClosingManager
              captures: { subH_id: $.data.id }
            - call: "POST /readiness-submissions/${subH_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${instH_id}/close"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${instH_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-09-30T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Wenatchee Federal Savings", cert_number: "55001", tier1_capital_ratio_bps: 1500, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { bidderP_id: $.data.id }
            - call: "POST /bidders/${bidderP_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
            - call: "POST /bidders"
              payload: { legal_name: "Kitsap Commerce Bank", cert_number: "55002", tier1_capital_ratio_bps: 1450, camels_composite: 2 }
              as: ResolutionAnalyst
              captures: { bidderQ_id: $.data.id }
            - call: "POST /bidders/${bidderQ_id}/qualification"
              payload: { decision: "QUALIFY" }
              as: ResolutionAnalyst
          trigger:
            - call: "POST /bids"
              payload: { institution_id: "${instH_id}", bidder_id: "${bidderP_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 300, asset_discount_bps: 1000, data_room_window_start: "2026-09-01T09:00:00Z", data_room_window_end: "2026-09-01T12:00:00Z" }
              as: Bidder
              as_user_id: "${bidderP_id}"
              captures: { bidP_id: $.data.id }
            - call: "POST /bids"
              payload: { institution_id: "${instH_id}", bidder_id: "${bidderQ_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 320, asset_discount_bps: 1000, data_room_window_start: "2026-09-01T13:00:00Z", data_room_window_end: "2026-09-01T15:00:00Z" }
              as: Bidder
              as_user_id: "${bidderQ_id}"
              captures: { buffer_error_id: "$.data.error_id", buffer_message: "$.data.message" }
            - call: "POST /bids"
              payload: { institution_id: "${instH_id}", bidder_id: "${bidderQ_id}", structure: "WHOLE_BANK_PA", deposit_premium_bps: 320, asset_discount_bps: 1000, data_room_window_start: "2026-09-01T13:01:00Z", data_room_window_end: "2026-09-01T15:00:00Z" }
              as: Bidder
              as_user_id: "${bidderQ_id}"
              captures: { bidQ_id: $.data.id }
          assert:
            - "trigger[0] returns HTTP 201 with data.status == SUBMITTED, data.data_room_window_start == '2026-09-01T09:00:00Z', data.data_room_window_end == '2026-09-01T12:00:00Z'"
            - "trigger[1] returns HTTP 409 with data.error_id == 'ERR_DATA_ROOM_WINDOW_CONFLICT' — the gap 12:00 -> 13:00 is exactly 60 minutes, and the rule requires new_start > existing_end + 60min (the comparison is <=, so equality conflicts)"
            - "trigger[1] is rejected even though the two windows belong to DIFFERENT bidders — the data room is an institution-wide resource"
            - "trigger[1] creates no row: GET /bids with institution_id == ${instH_id} returns total_count == 1"
            - "trigger[2] returns HTTP 201 — a 61-minute gap (12:00 -> 13:01) clears the buffer"
            - "GET /bids with institution_id == ${instH_id} returns total_count == 2, both status == SUBMITTED"
            - "contrast with the branch rule: a zero-minute gap is legal for BranchReopening and illegal here, so the two interval semantics cannot share one implementation"

  # ===================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: supersede_determination_restores_insurance_conservation_identity
        grounds:
          - state_machines.InsuranceDetermination.CERTIFIED_to_SUPERSEDED
          - calculations.institution_aggregate_reconciliation
          - endpoints[GET /institutions/{id}/insurance-summary]
          - endpoints[POST /insurance-determinations]
        distinguishing_aspect: |
          Conserved quantity: the DEPOSIT-ATTRIBUTION / insurance identity exposed as
          conservation_delta_cents (certified insured + certified uninsured per depositor MINUS
          aggregate_insured_cents + aggregate_certificate_face_cents), together with
          total_deposit_balance_cents. The compensation cascade C1-C4 must unwind the certify cascade
          L1-L5 exactly: aggregates return to 0, the certificate is CANCELLED (never deleted), holds are
          RELEASED, the notice resets to PENDING — and the delta reads 0 both before and after, so no
          half-reversal can hide inside a non-zero balance.
        test_recipe:
          setup:
            - "Institution 34582 is CLOSED_IN_RECEIVERSHIP with a STANDARDIZED readiness package; depositor Nadia owns SINGLE accounts N-1 = 20000000 (created first) and N-2 = 9000001."
            - "Nadia's determination is CERTIFIED under AGGREGATE_BY_CATEGORY: insured 25000000, uninsured 4000001; both accounts are DETERMINED and HELD (2758622 / 1241379); one ReceivershipCertificate of face 4000001 is ISSUED with cumulative_dividends_cents 0; Nadia.notice_status == SENT with template PARTIALLY_UNINSURED."
            - "No dividend round has ever been declared, so the certificate is still eligible to be cancelled (ERR_CERTIFICATE_ALREADY_PAID does not apply)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "34582", legal_name: "Spokane Compensation Bank", charter_state: "WA", book_asset_value_cents: 25000000, estimated_liquidation_recovery_cents: 18000000 }
              as: ClosingManager
              captures: { instI_id: $.data.id }
            - call: "POST /institutions/${instI_id}/depositor-records"
              payload: { tin_hash: "TIN-NADIA-13", legal_name: "Nadia Farouk", depositor_type: "NATURAL_PERSON", contact_email: "nadia@example.com" }
              as: ClaimsAgent
              captures: { nadia_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${instI_id}", primary_depositor_id: "${nadia_id}", account_number: "N-1", ownership_category: "SINGLE", balance_cents: 20000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { na1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${instI_id}", primary_depositor_id: "${nadia_id}", account_number: "N-2", ownership_category: "SINGLE", balance_cents: 9000001, accrued_interest_cents: 0, opened_at: "2024-06-15T00:00:00Z" }
              as: ClaimsAgent
              captures: { na2_id: $.data.id }
            - call: "POST /institutions/${instI_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 200, malformed_record_count: 4, reported_deposit_total_cents: 29000001 }
              as: ClosingManager
              captures: { subI_id: $.data.id }
            - call: "POST /readiness-submissions/${subI_id}/standardize"
              payload: {}
              as: ClosingManager
            - call: "POST /institutions/${instI_id}/close"
              payload: {}
              as: ClosingManager
            - call: "GET /depositor-records/${nadia_id}"
              as: ClaimsAgent
              captures: { nadia_v1: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${nadia_id}", expected_depositor_record_version: "${nadia_v1}" }
              as: ClaimsAgent
              captures: { nadia_det1_id: $.data.id }
            - call: "POST /insurance-determinations/${nadia_det1_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${nadia_det1_id}/submit-review"
              payload: {}
              as: ClaimsAgent
              as_user_id: "agent-001"
            - call: "POST /insurance-determinations/${nadia_det1_id}/certify"
              payload: {}
              as: ClaimsCertifier
              as_user_id: "certifier-001"
            - call: "GET /receivership-certificates"
              payload: { insurance_determination_id: "${nadia_det1_id}" }
              as: ClaimsCertifier
              captures: { nadia_cert_id: "$.data[0].id" }
            - call: "GET /institutions/${instI_id}/insurance-summary"
              as: ClaimsCertifier
              captures: { pre_delta: $.data.conservation_delta_cents, pre_total_deposits: $.data.total_deposit_balance_cents }
          trigger:
            - call: "GET /depositor-records/${nadia_id}"
              as: ClaimsAgent
              captures: { nadia_v2: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${nadia_id}", expected_depositor_record_version: "${nadia_v2}", revision_reason: "Trust beneficiary documentation arrived after certification" }
              as: ClaimsAgent
              captures: { nadia_det2_id: $.data.id }
            - call: "GET /institutions/${instI_id}/insurance-summary"
              as: ClaimsAgent
          assert:
            - "pre-trigger: the setup's insurance-summary read shows conservation_delta_cents == 0, aggregate_insured_cents == 25000000, aggregate_certificate_face_cents == 4000001, uninsured_claim_count == 1, held_amount_total_cents == 4000001, total_deposit_balance_cents == 29000001"
            - "C1: InsuranceDetermination.${nadia_det1_id}.status == SUPERSEDED; DepositorRecord.${nadia_id}.certified_insured_cents == 0 and certified_uninsured_cents == 0"
            - "C2 (caused by C1): ReceivershipCertificate.${nadia_cert_id}.status == CANCELLED with face_amount_cents still 4000001 and cumulative_dividends_cents 0 — the row is cancelled, never deleted"
            - "C3 (caused by C2): DepositAccount.${na1_id}.hold_status == RELEASED with held_amount_cents == 0 and DepositAccount.${na2_id}.hold_status == RELEASED with held_amount_cents == 0"
            - "C4 (caused by C3): DepositorRecord.${nadia_id}.notice_status == PENDING with notice_template_code == null, notice_sent_at == null, acknowledged_at == null"
            - "trigger[1] response data.status == DRAFT and data.revision_round == 1 (prior_certified.revision_round 0 + 1) and data.insured_amount_cents == 0"
            - "trigger[2] response data.conservation_delta_cents == 0 — the identity holds after the compensation exactly as it held before"
            - "trigger[2] response data.aggregate_insured_cents == 0, aggregate_certificate_face_cents == 0, uninsured_claim_count == 0, held_amount_total_cents == 0"
            - "trigger[2] response data.total_deposit_balance_cents == 29000001 — the conserved deposit base is untouched by the reversal"
            - "insurance_status on both accounts remains DETERMINED: the compensation reverses holds, certificate and notice, and does NOT rewind the insurance dimension"

      - name: void_dividend_round_restores_receivership_cash_conservation
        grounds:
