              captures: { jid2: "$.data[0].id" }
          trigger:
            - call: "POST /api/jobs/${jid2}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-11" }
              as: Admin
          assert:
            - "Response is 409 ERR_CREW_DOUBLE_BOOKED (2026-06-11 is inside job1's span 06-10..06-11)"
            - "Job.jid2 status remains PENDING; install_date 2026-06-12 would have been free"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: crew_days_conserved_on_cancel
        grounds:
          - state_machines.Job.PENDING_to_SCHEDULED
          - state_machines.Job.SCHEDULED_to_CANCELED
          - calculations.crew_booked_days
          - entities.Crew.fields.booked_days
        distinguishing_aspect: |
          Conserved quantity = Crew.booked_days (install_days count): scheduling job1
          adds exactly install_days (2) and canceling it removes exactly install_days,
          so booked_days returns to 0 and equals SUM(install_days over SCHEDULED/IN_PROGRESS
          jobs) — a non-monetary resource-count invariant.
        test_recipe:
          setup:
            - "Certified crew C; job1 (install_days 2) SCHEDULED on 2026-06-10 (booked_days == 2)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
              as: Admin
              captures: { pid: "$.data.id" }
            - call: "POST /api/sales-reps"
              payload: { full_name: "Rep A", region: "NE" }
              as: Admin
              captures: { rep: "$.data.id" }
            - call: "POST /api/crews"
              payload: { name: "Crew C", region: "NE", is_certified_leaf_guard: true }
              as: Admin
              captures: { crew: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Homeowner 19", address: "19 Fir St", phone: "555-0119", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { lead: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${lead}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 210 }
              as: Admin
            - call: "GET /api/leads/${lead}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${lead}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 210, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid}" }
              as: Admin
              captures: { jid: "$.data[0].id" }
            - call: "POST /api/jobs/${jid}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: Admin
            - call: "GET /api/crews/${crew}"
              payload: {}
              as: Admin
              captures: { booked_before: "$.data.booked_days" }
          trigger:
            - call: "POST /api/jobs/${jid}/transition"
              payload: { to_status: "CANCELED" }
              as: Admin
            - call: "GET /api/crews/${crew}"
              payload: {}
              as: Admin
              captures: { booked_after: "$.data.booked_days" }
          assert:
            - "booked_before == 2 (job1 reservation of install_days=2)"
            - "booked_after == 0 (cancel releases exactly install_days; invariant Crew.booked_days == SUM over SCHEDULED/IN_PROGRESS holds at 0)"

      - name: referrer_credit_conserved_on_clawback
        grounds:
          - state_machines.Referral.PENDING_to_PAYABLE
          - state_machines.Referral.PAYABLE_to_CLAWED_BACK
          - state_machines.Job.SCHEDULED_to_CANCELED
          - calculations.referrer_credit
          - entities.Lead.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity = referrer Lead.credit_balance_cents (money): PAYABLE adds
          exactly payout_cents (17100) and the clawback on the referee Job CANCEL removes
          exactly payout_cents, so credit returns to 0 and equals SUM(payout over
          PAYABLE/PAID referrals) — a monetary invariant distinct from crew-days.
        test_recipe:
          setup:
            - "Referrer + referee leads; PENDING Referral; referee's accepted quote (total 570000) -> Referral PAYABLE, referrer credit 17100; referee's Job SCHEDULED"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { name: "MicroMesh", category: "LEAF_GUARD", base_rate_cents_per_foot: 3000, available_colors: ["WHITE","BRONZE","BLACK","COPPER"], premium_colors: ["COPPER"], color_surcharge_cents_per_foot: 500 }
