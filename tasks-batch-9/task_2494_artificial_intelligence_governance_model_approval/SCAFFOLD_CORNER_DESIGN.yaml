          setup: ["A PRODUCTION shadow discovered 2026-08-01T00:00:00Z gets BASE_GRACE_DAYS 7, so grace_deadline_at is 2026-08-08T00:00:00Z. The clock is moved to one second past it and no sweep is run."]
