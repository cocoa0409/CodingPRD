            - *k_consumer
            - *k_biz_large
            - *k_c1_file
          trigger:
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "Complaint.${c1_id}.status remains RECEIVED"

      - name: businessrep_cannot_publish_rating_snapshot
        claim_type: RBAC Denial
        grounds:
          - roles.BusinessRep
          - endpoints.POST_/businesses/{id}/rating-snapshots
        distinguishing_aspect: "Rating publication is BureauAdmin-exclusive: the rated business itself gets 403 ERR_UNAUTHORIZED — businesses cannot mint their own ratings."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; LARGE business."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_biz_large
          trigger:
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /businesses/${biz_id}/rating-snapshots returns 0 rows"

      - name: standards_reviewer_cannot_run_daily_close
        claim_type: RBAC Denial
        grounds:
          - roles.StandardsReviewer
          - endpoints.POST_/bureaus/{id}/run_daily_close
        distinguishing_aspect: "The operations sweep is BureauAdmin-exclusive: StandardsReviewer gets 403 ERR_UNAUTHORIZED (segregation between standards review and bureau operations)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: StandardsReviewer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "Bureau.${bureau_id}.ops_day_index remains 0 (observable via a BureauAdmin sweep returning ops_day_index == 1 afterwards)"

      - name: businessrep_cannot_post_refund_ledger_entry
        claim_type: RBAC Denial
        grounds:
          - roles.BureauAdmin
          - endpoints.POST_/dues-invoices/{id}/ledger-entries
        distinguishing_aspect: "Ledger-entry authorization is kind-scoped: the invoice-owning BusinessRep may PAY but a REFUND from the same role is 403 ERR_UNAUTHORIZED (refunds are BureauAdmin-only)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE fee 0; MICRO business founded 2020-01-01; invoice 40375 fully PAID."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Refund Role Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - *k_app_prepaid
            - *k_app_submit
            - *k_app_approve
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 40375 }
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "REFUND", amount_cents: 1000 }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "invoice refunded_cents remains 0 and status PAID"

      - name: businessrep_cannot_respond_to_other_business_complaint
        claim_type: RBAC Denial
        grounds:
          - roles.BusinessRep
          - validations[priority=3]
        distinguishing_aspect: "Ownership is enforced independently of role: a BusinessRep whose id is business B answering a complaint against business A gets 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE businesses A and B; complaint against A is FORWARDED."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_a
            - call: "POST /businesses"
              payload: { legal_name: "Interloper B LLC", home_state_code: "IA", employee_count: 250, founded_on: "2018-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_b_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_a_id}", category: "SERVICE", description: "against A" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "B pretending to be A" }
              as: BusinessRep
              as_user_id: "${biz_b_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_OWNERSHIP"
            - "Complaint.${c1_id}.responses remains empty and status FORWARDED"

      - name: consumer_cannot_rebut_other_consumers_complaint
        claim_type: RBAC Denial
        grounds:
          - roles.Consumer
          - validations[priority=3]
        distinguishing_aspect: "A Consumer may rebut only their own complaints: consumer 2 rebutting consumer 1's complaint gets 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumers 1 and 2; LARGE business; complaint by consumer 1 in RESPONSE_RECEIVED."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - call: "POST /consumers"
              payload: { full_name: "Second Consumer", email: "second@example.com", home_state_code: "IA" }
              as: BureauAdmin
              captures: { consumer2_id: $.data.id }
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - *k_c1_respond
          trigger:
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REBUTTAL", body: "not mine" }
              as: Consumer
              as_user_id: "${consumer2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_OWNERSHIP"
            - "Complaint.${c1_id}.rebuttal_count remains 0"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: run_daily_close_increments_ops_day_index_and_returns_bureau
        claim_type: Computed read
        grounds:
          - endpoints.POST_/bureaus/{id}/run_daily_close
          - entities.Bureau.fields.ops_day_index
        distinguishing_aspect: "Each sweep bumps ops_day_index by exactly 1 (0 -> 1 -> 2) and returns the Bureau resource carrying dues_collected_cents, making the operations epoch directly observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE, no businesses or complaints."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - *k_sweep
            - *k_sweep
          assert:
            - "first sweep response: ops_day_index == 1, dues_collected_cents == 0"
            - "second sweep response: ops_day_index == 2"
            - "an empty sweep is a no-op for all other state (no complaints, invoices, or businesses mutated)"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: rating_dispute_occ_stale_version_rejected_fresh_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rating-dispute-stale-business-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The OCC rule resolves the create-after-supersede conflict deterministically: a dispute carrying the pre-publish Business.version 1 is rejected 412 ERR_STALE_VERSION after publishing advanced the version to 2, while the same payload with version 2 succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; LARGE business (version 1 after creation); a PUBLISHED snapshot minted at version 1 bumps Business.version to 2."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_biz_large
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { snap_id: $.data.id }
          trigger:
            - call: "POST /businesses/${biz_id}/rating-disputes"
              payload: { snapshot_id: "${snap_id}", reason: "stale view", expected_business_version: "${biz_v}" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /businesses/${biz_id}"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { biz_v_fresh: $.data.version }
            - call: "POST /businesses/${biz_id}/rating-disputes"
              payload: { snapshot_id: "${snap_id}", reason: "fresh view", expected_business_version: "${biz_v_fresh}" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { disp_id: $.data.id }
          assert:
            - "dispute with expected_business_version == ${biz_v} (1, stale after publish bumped to 2) returns 412 ERR_STALE_VERSION"
            - "dispute with the fresh version succeeds: 201, RatingDispute.${disp_id}.status == UNDER_APPEAL_REVIEW (FILED is zero-duration)"
            - "filing itself advances Business.version by 1 (write-side OCC progression)"

      - name: logical_clock_defaults_to_pinned_start_without_any_set_call
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "With no set_current_utc call at all, every server-stamped timestamp reads the pinned startup default 2026-09-01T00:00:00Z — the clock never falls back to wall-clock time."
        test_recipe:
          setup:
            - "Fresh server; no clock call has ever been made."
          setup_api_calls:
            - *k_bureau
            - *k_consumer
            - *k_biz_large
          trigger:
            - *k_c1_file
          assert:
            - "Complaint.${c1_id}.filed_at == \"2026-09-01T00:00:00Z\""
            - "Business.${biz_id}.created_at == \"2026-09-01T00:00:00Z\""
            - "Bureau.${bureau_id}.created_at == \"2026-09-01T00:00:00Z\""

      - name: scam_report_aging_out_reconciles_derived_count_and_deduction
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Business.fields.published_scam_count_12m
          - calculations.rating_score
        distinguishing_aspect: "A report published 2026-09-01 leaves the trailing 365-day window when the clock reaches 2027-09-02: published_scam_count_12m reconciles to 0 and the next PROVISIONAL snapshot carries scam_deduction 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business; one scam report PUBLISHED at 2026-09-01 (count 1)."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - call: "POST /scam-reports"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", description: "old scam", incident_date: "2026-08-15T00:00:00Z" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /scam-reports/${sr_id}/publish"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PROVISIONAL" }
              as: BureauAdmin
              captures: { scam_ded: $.data.scam_deduction, score: $.data.score }
          assert:
            - "Business.${biz_id}.published_scam_count_12m == 0 (the 2026-09-01 publication is outside [2026-09-02, 2027-09-02])"
            - "snapshot.scam_deduction == 0 and score == 100 (grade A_PLUS)"
            - "GET /scam-patterns returns 0 rows for the business (window empty)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: full_payment_immediately_reflects_accreditation_everywhere
        claim_type: immediate
        grounds:
          - state_machines.DuesInvoice.ISSUED_to_PAID
          - state_machines.AccreditationApplication.APPROVED_PENDING_DUES_to_ACCREDITED
          - endpoints.POST_/dues-invoices/{id}/ledger-entries
        distinguishing_aspect: "Immediate consistency: the payment response itself shows PAID/balance 0, and the very next reads of the application and the business show ACCREDITED with no sweep or delay in between."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE fee 0; MICRO business founded 2020-01-01; application approved with invoice 40375."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Consistency Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - *k_app_prepaid
            - *k_app_submit
            - *k_app_approve
          trigger:
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 40375 }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { inv_status: $.data.status, inv_balance: $.data.balance_cents }
          assert:
            - "payment response: invoice status == PAID and balance_cents == 0 in the same response"
            - "GET /businesses/${biz_id}/accreditation-applications shows the application ACCREDITED immediately"
            - "GET /businesses/${biz_id} shows accreditation_status == ACCREDITED immediately (no run_daily_close needed)"

  # ===========================================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is a 401 ERR_UNAUTHORIZED-checked-first failure — ERR_UNAUTHENTICATED beats every other validation category."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE."
          setup_api_calls:
            - *k_clock
            - *k_bureau
          trigger:
            - call: "GET /businesses"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "when the test omits X-User-Role and X-User-ID, the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "the error envelope carries error_id and message and response_type == error"

      - name: business_get_unknown_id_returns_business_not_found
        claim_type: Violation → Error
        grounds:
          - errors.ERR_BUSINESS_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "An unallocated business id returns the entity-specific 404 ERR_BUSINESS_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /businesses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_BUSINESS_NOT_FOUND"

      - name: run_daily_close_on_unknown_bureau_returns_bureau_not_found
        claim_type: Violation → Error
        grounds:
          - errors.ERR_BUREAU_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "The sweep validates bureau existence before any mutation: an unknown bureau id is a 404 ERR_BUREAU_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /bureaus/00000000-0000-4000-8000-000000000000/run_daily_close"
              payload: {}
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_BUREAU_NOT_FOUND"

      - name: error_response_window_expired_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_RESPONSE_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: boundary_precision_check / response_deadline_inclusive_at_exact_instant
          rationale: "Asserted there at the exact deadline boundary (one second late)."

      - name: error_mediator_schedule_conflict_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_MEDIATOR_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / mediator_sessions_half_open_adjacency_allowed_overlap_rejected
          rationale: "Asserted there on the 10:30-11:30 overlap between two neighbors."

      - name: error_hearing_room_conflict_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_HEARING_ROOM_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hearing_room_requires_thirty_minute_buffer_adjacency_conflicts
          rationale: "Asserted there on the 15-minute gap inside the 30-minute buffer."

      - name: error_rebuttal_limit_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_REBUTTAL_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / complaint_rebuttal_cycle_loops_until_cap_three
          rationale: "Asserted there on the 4th rebuttal attempt."

      - name: error_complaint_invalid_state_for_mediation_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_COMPLAINT_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mediation_offer_requires_complaint_unresolved
          rationale: "Asserted there on the RESPONSE_RECEIVED mediation offer; also asserted as the winning error in priority_pair_validation_conflict / complaint_response_state_error_beats_window_expired."

      - name: error_advertising_review_adverse_covered_by_difficulty
        claim_type: Violation → Error
        grounds: [errors.ERR_ADVERTISING_REVIEW_ADVERSE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / application_approve_blocked_until_ad_review_clears
          rationale: "Asserted there as the blocking error; also the winner in priority_pair_validation_conflict / approve_adverse_ad_review_beats_outstanding_dues."
