      - name: valid_transition_station_planned_to_open_seeds_seal_stock
        claim_type: valid_transition
        grounds:
          - state_machines.InspectionStation.PLANNED_to_OPEN
          - entities.InspectionStation.fields.seal_stock_count
          - endpoints.POST_/inspection-stations/{id}/status
        distinguishing_aspect: "The declared PLANNED -> OPEN trigger moves status to OPEN and, because the status left PLANNED for the first time, seeds seal_stock_count from seal_stock_initial_count (3) while seals_in_circulation_count and seals_retired_count stay 0."
        test_recipe:
          setup:
            - "Station 'Polson Access' with seal_stock_initial_count 3 and one hours window, still PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", seal_stock_initial_count: 3, hot_water_capable: true, decon_bay_count: 1 }
              as: ProgramAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z" }
