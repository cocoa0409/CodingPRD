          - "errors[ERR_MONTH_ALREADY_CLOSED]"
          - "errors[ERR_MONTH_OUT_OF_ORDER]"
        distinguishing_aspect: "Month closes are strictly chronological and idempotent-free: re-closing the closed month yields ERR_MONTH_ALREADY_CLOSED; closing an earlier month yields ERR_MONTH_OUT_OF_ORDER; a month before measurement_start_date is likewise out of order."
        test_recipe:
          setup:
            - "Logical clock set; one COMMISSIONED vehicle for the customer; contract (committed 97.0, fee 2000000, ROUTE_DAY, start 2026-09-01) with no downtime events."
          setup_api_calls:
