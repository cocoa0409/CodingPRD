            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A with 6 samples, 4 of them peak-hour; ServicePlan.evidence_sample_total == 6."
            - "One CERTIFIED PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214."
