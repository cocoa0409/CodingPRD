  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_pay_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["validations[priority=16]", "errors[ERR_STALE_VERSION]", "state_machines.Order.UNPAID_to_PAID"]
        distinguishing_aspect: "Paying with a stale expected_order_version (one below current after a confirm bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A confirmed order; the client deliberately replays the pre-confirm version."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-OCC", name: "Bolt", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 300 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov1} - 1" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_VERSION (stale expected_order_version)"

      - name: occ_version_increments_on_each_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Order.fields.version, state_machines.Order.DRAFT_to_CONFIRMED]
        distinguishing_aspect: "Order.version starts at 1 on create and increments by exactly 1 on confirm (and each subsequent guarded mutation)."
        test_recipe:
          setup: ["A draft order with one line."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-VER", name: "Nut", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 300 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
          trigger:
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
          assert:
            - "${ov0} == 1 on create; Order.${oid}.version == 2 after confirm"

      - name: pay_on_account_order_lifts_credit_hold
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.ON_ACCOUNT_to_PAID, entities.Account.fields.status, entities.Account.fields.outstanding_balance_cents]
        distinguishing_aspect: "Paying an ON_ACCOUNT order whose account is in CREDIT_HOLD recomputes outstanding_balance downward and lifts the account back to ACTIVE."
        test_recipe:
          setup: ["B2B account credit_limit=5000; order #1 charged on-account for net 5000 → outstanding 5000, status CREDIT_HOLD."]
          setup_api_calls:
            - call: "POST /nurseries"
              payload: { name: "Greenleaf", site_hardiness_zone: 6 }
              as: PlatformAdmin
              captures: { nid: $.data.id }
            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "LANDSCAPER_B2B", display_name: "Acme Land", ship_to_hardiness_zone: 6, credit_limit_cents: 5000 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-CH", name: "Crate", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 5000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
            - call: "POST /orders/${oid}/charge-account"
              payload: { expected_order_version: "${ov1}" }
              as: SalesClerk
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/pay"
              payload: { expected_order_version: "${ov2}" }
              as: SalesClerk
          assert:
            - "Before pay: Account.${aid}.status == CREDIT_HOLD AND outstanding_balance_cents == 5000"
            - "After pay: Account.${aid}.outstanding_balance_cents == 0 AND status == ACTIVE"

