      - name: cyclic_challenge_information_request_loop
        claim_type: cyclic
        grounds:
          - state_machines.DataChallenge.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.DataChallenge.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / challenge_fourth_info_request_rejected_after_three_rounds
          rationale: "That instance walks the UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED loop three times and asserts the round cap on the fourth pass."

      - name: parallel_adjudication_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.CitationAdjudication.PENDING_to_REDUCED
          - state_machines.CitationAdjudication.NOT_APPLIED_to_APPLIED
        excluded_because:
          difficulty_instance: non_linear_state_machine / adjudication_court_and_record_dimensions_advance_independently
          rationale: "That instance asserts the court dimension moving without the record dimension and then the record dimension catching up."

      - name: compound_cap_fork_join_derives_pending_decision
        claim_type: compound
        grounds:
          - state_machines.CorrectiveActionPlan.IN_REVIEW_to_PENDING_DECISION
          - state_machines.CapActionItem.IMPLEMENTED_to_VERIFIED
        excluded_because:
          difficulty_instance: non_linear_state_machine / cap_fork_join_requires_both_branches_and_full_item_verification
          rationale: "That instance asserts the join firing only when both branches are CLEARED and completion_pct reaches 100.0."

      - name: compensation_withdraw_reverses_submit_side_effects
        claim_type: compensation
        grounds:
          - state_machines.DataChallenge.SUBMITTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / challenge_quota_and_certified_measure_restored_by_withdraw
          rationale: "That instance asserts quota and certified_measure returning to their exact pre-submit values with no drift."

      - name: cascade_down_wrong_carrier_acceptance_moves_the_whole_report
        claim_type: cascade_down
        grounds:
          - state_machines.DataChallenge.UNDER_REVIEW_to_RESOLVED_ACCEPTED
        excluded_because:
          difficulty_instance: transitive_cascade / wrong_carrier_acceptance_cascades_across_two_carriers
          rationale: "That instance follows the six-hop cascade from challenge acceptance to both carriers' screening bands."

      - name: guarded_cap_creation_requires_carrier_fitness_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=29]
          - state_machines.CorrectiveActionPlan.initial_state
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cap_creation_requires_conditional_or_unsatisfactory_fitness
          rationale: "That instance asserts the guard failing on UNRATED and passing after the fitness determination."

      - name: ledger_sync_coaching_waiver_on_adjudication_apply
        claim_type: ledger_sync
        grounds:
          - state_machines.CitationAdjudication.NOT_APPLIED_to_APPLIED
          - state_machines.CoachingAssignment.ASSIGNED_to_WAIVED
        excluded_because:
          difficulty_instance: transitive_cascade / adjudication_apply_cascades_to_coaching_waiver
          rationale: "That instance asserts the waiver and the open_coaching_count decrement that follow the record application."

  - section: calculations
    instances:
      - name: unscored_report_and_removed_violation_excluded_from_measure
        claim_type: input_set_filtering
        grounds:
          - calculations.basic_measure_recompute.input_set
          - state_machines.CitationAdjudication.NOT_APPLIED_to_APPLIED
          - entities.BasicScore.fields.included_violation_count
        distinguishing_aspect: |
          The numerator counts only ACTIVE/RECODED violations on SCORED reports: the VALIDATED report's
          violation never contributes (relevant_inspection_count stays 1 even though two reports
          exist), and once the dismissal is applied the REMOVED violation drops out too, taking the
          measure from 1.000 to 0.500 and the alert from ALERT to MONITOR.
