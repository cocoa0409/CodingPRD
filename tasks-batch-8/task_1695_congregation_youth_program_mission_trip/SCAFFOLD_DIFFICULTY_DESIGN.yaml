            - "after paying 32500: covered == 82500 >= 80000 + 2500 -> payment_status == PAID_IN_FULL (DELINQUENT cured, completing the in-dimension cycle)"
            - "Registration.${reg_id}.registration_status remained CONFIRMED through the entire payment cycle"

  - rule_id: transitive_cascade
    instances:
      - name: trip_cancel_depth3_registration_scholarship_program
        grounds:
          - state_machines.Trip.REGISTRATION_CLOSED_to_CANCELLED
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.ScholarshipApplication.APPROVED_to_RESCINDED
          - calculations.scholarship_fund_rollup
        distinguishing_aspect: |
          Depth-3 chain where each hop is CAUSED by the previous one: Trip cancel
          -> Registration CANCELLED -> its APPROVED ScholarshipApplication
          RESCINDED -> Program.scholarship_reserved_cents/available recomputed.
          Not a fan-out: the Program mutation is reachable only through the
          scholarship transition, never directly from the trip action.
        test_recipe:
          setup:
            - "Trip Alpha REGISTRATION_CLOSED; reg1 CONFIRMED (insurance INTERNATIONAL, deposit 50000 paid and POSTED); 1 CONFIRMED LEAD chaperone; lodging beds 30 cost 0; reg1 has one RECEIVED donation 10000 CASH and an APPROVED scholarship of 70000 (need 70 on provisional basis 200000: round_half_up(0.70*0.5*200000))"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 500000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-15", check_out_date: "2027-06-25", room_capacity: 30, cost_cents: 0}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "Lead", email: "ada@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap_id}/background-checks", payload: {}, as: ProgramDirector, captures: {bc_id: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip_id}", chaperone_id: "${chap_id}", role: "LEAD"}, as: ProgramDirector, captures: {asg_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg_id}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap_id}" }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_A", household_size: 5}, as: Guardian, as_user_id: "guardian-1", captures: {p1_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg_id}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg_id}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "GET /youth-ministry/registrations/${reg_id}/fundraising-account", as: Treasurer, captures: {acct_id: "$.data[0].id"} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct_id}/donations", payload: {donor_name: "D1", amount_cents: 10000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1", captures: {don_id: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg_id}", requested_cents: 100000}, as: Guardian, as_user_id: "guardian-1", captures: {app_id: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app_id}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /youth-ministry/registrations/${reg_id}/payments", payload: {amount_cents: 50000, method: "CHECK"}, as: Treasurer, as_user_id: "treasurer-1", captures: {pay_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/confirm", as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/trips/${trip_id}/close-registration", as: ProgramDirector }
            - { call: "GET /youth-ministry/programs/${prog_id}", as: ProgramDirector, captures: {reserved_pre: $.data.scholarship_reserved_cents, available_pre: $.data.scholarship_available_cents} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip_id}/cancel", payload: {reason: "host site withdrew"}, as: ProgramDirector, as_user_id: "director-1" }
          assert:
            - "pre-cancel captures: reserved_pre == 70000 and available_pre == 430000 (award = round_half_up(0.70 * 0.5 * 200000) = 70000; need 70 = 50+15+0+5 for the 10000 gross > 0 branch)"
            - "Trip.${trip_id}.status == CANCELLED"
            - "hop 1: Registration.${reg_id}.registration_status == CANCELLED"
            - "hop 2: ConsentForm ${cfa}/${cfb}/${cfc} all VOIDED; FundraisingAccount.${acct_id}.status == CLOSED; Payment.${pay_id}.status == REFUNDED and Registration.payment_status == REFUNDED"
            - "hop 2: ScholarshipApplication.${app_id}.status == RESCINDED (APPROVED at cancel time)"
            - "hop 3: Program.${prog_id}.scholarship_reserved_cents == 0 and scholarship_available_cents == 500000 — the fund mutation happens only THROUGH the rescind hop"
            - "Donation.${don_id}.status stays RECEIVED (account closure does not refund donations; they remain refundable)"

      - name: screening_flag_cascade_assignment_removal_ratio_flip
        grounds:
          - state_machines.BackgroundCheck.SCREENING_to_FLAGGED
          - state_machines.ChaperoneAssignment.CONFIRMED_to_REMOVED
          - calculations.chaperone_requirement
        distinguishing_aspect: |
          Different trigger than trip-cancel: advancing a BackgroundCheck to
          FLAGGED hop-1 REMOVES the chaperone's CONFIRMED assignment
          (removal_reason=AUTO_SCREENING), and that removal hop-2 recomputes the
          Trip's cleared_chaperone_count 2 -> 1, flipping ratio_compliant false
          (required 2 at ratio 1 with 2 confirmed youth) — a depth-2 chain into
          an aggregate posture flip.
        test_recipe:
          setup:
            - "Trip Gamma: chaperone_ratio 1, capacity 10, 2 CONFIRMED registrations, 2 chaperones each CONFIRMED-assigned with CLEARED checks; ratio_compliant true (2 >= ceil(2/1))"
