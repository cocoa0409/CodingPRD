# =============================================================================
# Scaffold: Kids' Consignment Pop-Up Sale (JBF style) — v1
# =============================================================================

scenario: |
  956. Kids' Consignment Pop-Up Sale (JBF style): consignor registration &
  tagging/pricing, drop-off & inspection, presale & volunteer-shift discount,
  sale-day POS & markdown days, split & payout, unsold pickup/donate, barcode
  inventory, settlement

domain_name: kids-consignment-popup
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation        # split/payout settlement with provisional vs final variants
  secondary_archetype: temporal_windowing          # intake/presale/sale/markdown windows, shifts, drop-off slots
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat                            # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: branching                   # Item branches + reverts; Settlement cycles; POSTransaction reverts
  relationship_patterns:
    - one_to_many
    - polymorphic                                   # PresalePass.holder_id -> Consignor | Volunteer
    - cross_aggregate
  role_model: segregation_of_duties                # Inspector (a Volunteer) may not inspect own consigned items
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: SaleEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable sale name" }
      - { name: intake_start, type: datetime, source: input, description: "Drop-off window opens (ISO8601 UTC)" }
      - { name: intake_end, type: datetime, source: input, description: "Drop-off window closes (exclusive)" }
      - { name: presale_start, type: datetime, source: input, description: "Presale window opens" }
      - { name: presale_end, type: datetime, source: input, description: "Presale window closes" }
      - { name: sale_start, type: datetime, source: input, description: "Public sale opens" }
      - { name: sale_end, type: datetime, source: input, description: "Public sale closes" }
      - { name: pickup_deadline, type: datetime, source: input, description: "Unsold-item pickup deadline" }
      - { name: phase, type: enum, source: system, description: "DRAFT | INTAKE_OPEN | INTAKE_CLOSED | PRESALE_DAY | SALE_ACTIVE | SETTLEMENT | CLOSED", constraints: "linear order; advanced only via advance-phase" }
      - { name: sold_gross_cents, type: integer, source: computed, description: "Sum of total_cents over COMPLETED POSTransactions of this event; equals sum of consignor sold_gross_cents", default: 0 }

  - name: MarkdownRule
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: effective_from, type: datetime, source: input, description: "Markdown window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Markdown window end (exclusive)" }
      - { name: discount_pct, type: integer, source: input, description: "Percent off tag price during window", constraints: "1..90" }

  - name: Consignor
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: full_name, type: string, source: input, description: "Consignor name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: consignor_code, type: string, source: system, description: "Per-event code 'C' + zero-padded 4-digit sequence assigned by created_at ASC registration order" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }
      - { name: sold_count, type: integer, source: computed, description: "Count of own Items in status SOLD", default: 0 }
      - { name: unsold_count, type: integer, source: computed, description: "Count of own Items in status UNSOLD", default: 0 }
      - { name: rejected_count, type: integer, source: computed, description: "Count of own Items in status REJECTED", default: 0 }
      - { name: sold_gross_cents, type: integer, source: computed, description: "Sum of final_line_cents over lines of own SOLD items in COMPLETED transactions", default: 0 }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: linked_consignor_id, type: string, source: input, description: "FK -> Consignor.id; nullable; set when the volunteer is also a consignor (drives segregation-of-duties and split bonus)", default: null }
      - { name: completed_hours, type: number, source: computed, description: "Sum of hours_credited over own signups in status COMPLETED", default: 0 }
      - { name: projected_hours, type: number, source: computed, description: "completed_hours plus shift durations of own signups in status CHECKED_IN", default: 0 }
      - { name: projected_discount_pct, type: integer, source: computed, description: "volunteer_discount_tier(projected_hours) — forward-looking variant", default: 5 }

  - name: DropOffSlot
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: start_time, type: datetime, source: input, description: "Slot window start" }
      - { name: end_time, type: datetime, source: input, description: "Slot window end (exclusive)" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent bookings (aggregate capacity, not pairwise)", constraints: ">= 1" }
      - { name: booked_count, type: integer, source: computed, description: "Count of bookings in status BOOKED or CHECKED_IN", default: 0 }

  - name: DropOffBooking
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> DropOffSlot.id" }
      - { name: consignor_id, type: string, source: input, description: "FK -> Consignor.id" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: consignor_id, type: string, source: input, description: "FK -> Consignor.id" }
      - { name: sale_event_id, type: string, source: system, description: "FK -> SaleEvent.id; copied from the consignor at creation" }
      - { name: title, type: string, source: input, description: "Tag description" }
      - { name: category, type: enum, source: input, description: "CLOTHING | TOYS | BOOKS | GEAR | MATERNITY | OTHER" }
      - { name: size, type: string, source: input, description: "Optional size label", default: null }
      - { name: price_cents, type: integer, source: input, description: "Tag price", constraints: ">= 200 and a multiple of 50" }
      - { name: discount_eligible, type: boolean, source: input, description: "Whether markdowns apply ('reduce' flag)", default: true }
      - { name: donate_flag, type: boolean, source: input, description: "Auto-donate at close if unsold", default: false }
      - { name: barcode, type: string, source: system, description: "consignor_code + '-' + zero-padded 4-digit per-consignor sequence (created_at ASC); unique per event" }
      - { name: status, type: enum, source: system, description: "TAGGED | DROPPED_OFF | ACCEPTED | REJECTED | ON_FLOOR | IN_CART | SOLD | UNSOLD | PICKED_UP | DONATED" }
      - { name: reject_reason, type: string, source: system, description: "Reason recorded on failed inspection", default: null }

  - name: InspectionRecord
    parent: null
    common_fields: false
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: inspector_id, type: string, source: system, description: "FK -> Volunteer.id; X-User-ID of the Inspector" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL" }
      - { name: reasons, type: string, source: input, description: "Rejection reasons (required when outcome=FAIL)", default: null }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: role_name, type: string, source: input, description: "Shift role (e.g., Inspector, Cashier, Floor)" }
      - { name: start_time, type: datetime, source: input, description: "Shift start" }
      - { name: end_time, type: datetime, source: input, description: "Shift end (exclusive)" }
      - { name: capacity, type: integer, source: input, description: "Max signups", constraints: ">= 1" }
      - { name: signed_up_count, type: integer, source: computed, description: "Signups in status SIGNED_UP or CHECKED_IN", default: 0 }

  - name: ShiftSignup
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> VolunteerShift.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: hours_credited, type: number, source: system, description: "(shift.end_time - shift.start_time)/3600, set at check-out", default: 0 }

  - name: PresalePass
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: system, description: "FK -> SaleEvent.id" }
      - { name: holder_type, type: enum, source: system, description: "CONSIGNOR | VOLUNTEER" }
      - { name: holder_id, type: string, source: system, description: "Polymorphic holder reference: Consignor.id when holder_type=CONSIGNOR, Volunteer.id when VOLUNTEER" }
      - { name: discount_pct, type: integer, source: system, description: "Pinned at issuance: 0 for consignors; volunteer_discount_tier(earned hours) for volunteers; later hour changes never alter an issued pass" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: POSTransaction
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: input, description: "FK -> SaleEvent.id" }
      - { name: cashier_id, type: string, source: system, description: "X-User-ID of the creating Cashier (opaque audit id)" }
      - { name: presale_pass_id, type: string, source: input, description: "FK -> PresalePass.id; nullable; mandatory while phase=PRESALE_DAY", default: null }
      - { name: pass_discount_pct, type: integer, source: system, description: "Snapshot of pass.discount_pct at transaction creation; 0 when no pass", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | VOIDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_price_cents over current lines", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "subtotal_cents - total_cents", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Sum of final_line_cents over current lines", default: 0 }
      - { name: tendered_cents, type: integer, source: system, description: "Amount tendered at checkout", default: null }
      - { name: change_cents, type: integer, source: computed, description: "tendered_cents - total_cents at checkout", default: null }

  - name: TransactionLine
    parent: null
    common_fields: false
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> POSTransaction.id" }
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; resolved from scanned barcode" }
      - { name: barcode, type: string, source: system, description: "Copy of Item.barcode at scan time" }
      - { name: tag_price_cents, type: integer, source: system, description: "Snapshot of Item.price_cents at scan" }
      - { name: markdown_pct_applied, type: integer, source: system, description: "Markdown pct in effect at scan time (0 if none or not discount_eligible)" }
      - { name: line_price_cents, type: integer, source: computed, description: "round_half_up(tag_price_cents * (100 - markdown_pct_applied) / 100)" }
      - { name: pass_discount_pct_applied, type: integer, source: system, description: "Snapshot of transaction.pass_discount_pct for this line" }
      - { name: final_line_cents, type: integer, source: computed, description: "round_half_up(line_price_cents * (100 - pass_discount_pct_applied) / 100); per-line rounding, then summed" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: sale_event_id, type: string, source: system, description: "FK -> SaleEvent.id" }
      - { name: consignor_id, type: string, source: system, description: "FK -> Consignor.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | DISPUTED | PAID" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "Forward-looking variant: actual sold gross plus 50% sell-through projection of ON_FLOOR items at current markdown", default: 0 }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "Payout pipeline evaluated on provisional_gross_cents with adjustment 0", default: 0 }
      - { name: sold_item_count, type: integer, source: computed, description: "Count of consignor's SOLD items in COMPLETED transactions", default: 0 }
      - { name: gross_cents, type: integer, source: computed, description: "Final variant at finalize: actual sold gross only", default: null }
      - { name: split_pct, type: integer, source: computed, description: "consignor_split_percentage(gross_cents) at finalize", default: null }
      - { name: commission_cents, type: integer, source: computed, description: "round_half_up(gross_cents * (100 - split_pct) / 100)", default: null }
      - { name: payout_before_fee_cents, type: integer, source: computed, description: "gross_cents - commission_cents", default: null }
      - { name: supply_fee_cents, type: integer, source: computed, description: "1000, waived (0) when payout_before_fee_cents >= 30000 or linked-volunteer bonus condition holds", default: null }
      - { name: rejected_fee_cents, type: integer, source: computed, description: "200 * consignor.rejected_count at finalize", default: null }
      - { name: adjustment_cents, type: integer, source: system, description: "Accumulated dispute-resolution adjustments (resolve adds its input)", default: 0 }
      - { name: payout_cents, type: integer, source: computed, description: "max(0, payout_before_fee_cents - supply_fee_cents - rejected_fee_cents + adjustment_cents)", default: null }
      - { name: dispute_reason, type: string, source: system, description: "Reason from the latest dispute", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SaleEvent
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: INTAKE_OPEN
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: INTAKE_OPEN}"
        actor: EventOrganizer
        preconditions: ["logical clock >= intake_start"]
        side_effects: ["increments SaleEvent.version by 1"]
      - from: INTAKE_OPEN
        to: INTAKE_CLOSED
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: INTAKE_CLOSED}"
        actor: EventOrganizer
        preconditions: ["logical clock >= intake_end"]
        side_effects:
          - "All DropOffBookings in BOOKED -> NO_SHOW; all in CHECKED_IN -> COMPLETED (cascade; each bumps booking.version)"
          - "increments SaleEvent.version by 1"
      - from: INTAKE_CLOSED
        to: PRESALE_DAY
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: PRESALE_DAY}"
        actor: EventOrganizer
        preconditions:
          - "logical clock >= presale_start"
          - "No Item of this event in status DROPPED_OFF (ERR_UNINSPECTED_ITEMS_REMAIN)"
        side_effects:
          - "All Items in ACCEPTED -> ON_FLOOR, processed in item.created_at ASC order (cascade hop 1)"
          - "Each ACCEPTED->ON_FLOOR item triggers recompute of its Consignor counters (cascade hop 2) and, if a DRAFT Settlement exists for that consignor, recompute of its provisional fields (cascade hop 3)"
          - "increments SaleEvent.version by 1"
      - from: PRESALE_DAY
        to: SALE_ACTIVE
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: SALE_ACTIVE}"
        actor: EventOrganizer
        preconditions: ["logical clock >= sale_start"]
        side_effects: ["increments SaleEvent.version by 1"]
      - from: SALE_ACTIVE
        to: SETTLEMENT
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: SETTLEMENT}"
        actor: EventOrganizer
        preconditions:
          - "logical clock >= sale_end"
          - "No POSTransaction of this event in status OPEN (ERR_OPEN_TRANSACTIONS_REMAIN)"
        side_effects:
          - "All Items in ON_FLOOR -> UNSOLD, in item.created_at ASC order (cascade hop 1)"
          - "Each ON_FLOOR->UNSOLD item triggers recompute of Consignor.unsold_count and provisional counters (cascade hop 2), which triggers recompute of that consignor's DRAFT Settlement provisional fields (cascade hop 3: floor projection removed)"
          - "increments SaleEvent.version by 1"
      - from: SETTLEMENT
        to: CLOSED
        trigger: "POST /sale-events/{id}/advance-phase {to_phase: CLOSED}"
        actor: EventOrganizer
        preconditions:
          - "All Items in terminal status SOLD | PICKED_UP | DONATED after auto-donation below"
          - "All Settlements of this event in status PAID"
        side_effects:
          - "First, all Items in UNSOLD with donate_flag=true -> DONATED (conditional cascade), and all Items in REJECTED not yet picked up -> DONATED"
          - "increments SaleEvent.version by 1"

  - entity: Consignor
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /consignors/{id}/withdraw"
        actor: EventOrganizer | Consignor (self)
        preconditions: ["Consignor owns zero Items (ERR_CONSIGNOR_HAS_ITEMS)"]
        side_effects: ["increments Consignor.version by 1"]

  - entity: DropOffBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /drop-off-bookings/{id}/check-in"
        actor: EventOrganizer
        preconditions: ["Event phase == INTAKE_OPEN"]
        side_effects: ["slot.booked_count unchanged (CHECKED_IN still counts)"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /drop-off-bookings/{id}/cancel"
        actor: EventOrganizer | Consignor (owner)
        preconditions: []
        side_effects: ["slot.booked_count decremented by 1 (compensation: frees aggregate capacity)"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (SaleEvent advance INTAKE_OPEN -> INTAKE_CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["slot.booked_count decremented by 1"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (SaleEvent advance INTAKE_OPEN -> INTAKE_CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["slot.booked_count decremented by 1"]

  - entity: Item
    initial_state: TAGGED
    terminal_states: [SOLD, PICKED_UP, DONATED]
    transitions:
      - from: TAGGED
        to: DROPPED_OFF
        trigger: "POST /items/{id}/drop-off"
        actor: Consignor (owner)
        preconditions:
          - "Event phase == INTAKE_OPEN (ERR_EVENT_PHASE_MISMATCH)"
          - "logical clock in [intake_start, intake_end) (ERR_INTAKE_WINDOW_CLOSED)"
          - "Consignor has a DropOffBooking in status CHECKED_IN for this event (ERR_NO_CHECKED_IN_BOOKING)"
        side_effects: ["Consignor counters recomputed"]
      - from: DROPPED_OFF
        to: ACCEPTED
        trigger: "POST /items/{id}/inspect {outcome: PASS}"
        actor: Inspector
        preconditions:
          - "Event phase in {INTAKE_OPEN, INTAKE_CLOSED}"
          - "Segregation of duties: Inspector's Volunteer.linked_consignor_id != item.consignor_id (ERR_INSPECTION_SELF_DEALING)"
          - "logical clock < presale_start (ERR_INSPECTION_DEADLINE_PASSED)"
        side_effects: ["Creates InspectionRecord(outcome=PASS, inspector_id=X-User-ID)"]
      - from: DROPPED_OFF
        to: REJECTED
        trigger: "POST /items/{id}/inspect {outcome: FAIL, reasons}"
        actor: Inspector
        preconditions: ["same as PASS transition"]
        side_effects:
          - "Creates InspectionRecord(outcome=FAIL)"
          - "Sets item.reject_reason; Consignor.rejected_count recomputed"
      - from: ACCEPTED
        to: ON_FLOOR
        trigger: "system (SaleEvent advance INTAKE_CLOSED -> PRESALE_DAY)"
        actor: system
        preconditions: []
        side_effects: ["Consignor counters and DRAFT Settlement provisional fields recomputed"]
      - from: ON_FLOOR
        to: IN_CART
        trigger: "POST /pos-transactions/{id}/lines (barcode scan)"
        actor: Cashier
        preconditions: ["Transaction OPEN", "Item ON_FLOOR (ERR_ITEM_NOT_ON_FLOOR)"]
        side_effects: ["TransactionLine created with scan-time prices"]
      - from: IN_CART
        to: ON_FLOOR
        trigger: "DELETE /pos-transactions/{id}/lines/{lineId} OR void of the OPEN transaction"
        actor: Cashier
        preconditions: []
        side_effects: ["Line row deleted; sellable-pipeline count conserved (scan + removal is a compensating pair)"]
      - from: IN_CART
        to: SOLD
        trigger: "POST /pos-transactions/{id}/checkout"
        actor: Cashier
        preconditions: []
        side_effects:
          - "Consignor.sold_count / sold_gross_cents recomputed (cascade hop 2)"
          - "Consignor's DRAFT Settlement provisional fields recomputed (cascade hop 3)"
          - "SaleEvent.sold_gross_cents recomputed"
      - from: SOLD
        to: ON_FLOOR
        trigger: "POST /pos-transactions/{id}/void on a COMPLETED transaction"
        actor: EventOrganizer
        preconditions: ["Event phase in {PRESALE_DAY, SALE_ACTIVE}"]
        side_effects:
          - "Compensation: Consignor.sold_count / sold_gross_cents decremented back, DRAFT Settlement provisional fields recomputed, SaleEvent.sold_gross_cents recomputed — checkout+void conserves event gross"
      - from: ON_FLOOR
        to: UNSOLD
        trigger: "system (SaleEvent advance SALE_ACTIVE -> SETTLEMENT)"
        actor: system
        preconditions: []
        side_effects: ["Consignor.unsold_count recomputed; DRAFT Settlement provisional fields recomputed"]
      - from: UNSOLD
        to: PICKED_UP
        trigger: "POST /items/{id}/pickup"
        actor: Consignor (owner)
        preconditions: ["Event phase == SETTLEMENT", "logical clock <= pickup_deadline (ERR_PICKUP_WINDOW_CLOSED)"]
        side_effects: ["Consignor.unsold_count recomputed"]
      - from: REJECTED
        to: PICKED_UP
        trigger: "POST /items/{id}/pickup"
        actor: Consignor (owner)
        preconditions: ["Event phase in {INTAKE_CLOSED, PRESALE_DAY, SALE_ACTIVE, SETTLEMENT}"]
        side_effects: ["Consignor.rejected_count recomputed"]
      - from: UNSOLD
        to: DONATED
        trigger: "system (SaleEvent advance SETTLEMENT -> CLOSED, item.donate_flag == true)"
        actor: system
        preconditions: []
        side_effects: ["Consignor.unsold_count recomputed"]
      - from: REJECTED
        to: DONATED
        trigger: "system (SaleEvent advance SETTLEMENT -> CLOSED, item never picked up)"
        actor: system
        preconditions: []
        side_effects: ["Consignor.rejected_count recomputed"]

  - entity: ShiftSignup
    initial_state: SIGNED_UP
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SIGNED_UP
        to: CHECKED_IN
        trigger: "POST /shift-signups/{id}/check-in"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["Volunteer.projected_hours / projected_discount_pct recomputed (CHECKED_IN counts toward projection)"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /shift-signups/{id}/check-out"
        actor: EventOrganizer
        preconditions: []
        side_effects:
          - "hours_credited = (shift.end_time - shift.start_time)/3600"
          - "Volunteer.completed_hours / projected_hours / projected_discount_pct recomputed"
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /shift-signups/{id}/cancel"
        actor: EventOrganizer | Volunteer (owner)
        preconditions: []
        side_effects: ["VolunteerShift.signed_up_count decremented (compensation frees capacity)"]
      - from: SIGNED_UP
        to: NO_SHOW
        trigger: "POST /shift-signups/{id}/mark-no-show"
        actor: EventOrganizer
        preconditions: ["logical clock > shift.end_time (ERR_NO_SHOW_TOO_EARLY)"]
        side_effects: ["VolunteerShift.signed_up_count decremented"]

  - entity: PresalePass
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /presale-passes/{id}/revoke"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["Pass can no longer attach to new transactions (ERR_PASS_NOT_ACTIVE)"]

  - entity: POSTransaction
    initial_state: OPEN
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /pos-transactions/{id}/checkout"
        actor: Cashier
        preconditions:
          - "At least one current line (ERR_EMPTY_TRANSACTION)"
          - "tendered_cents >= total_cents (ERR_INSUFFICIENT_TENDER)"
        side_effects:
          - "All line Items IN_CART -> SOLD (cascade hop 1), each triggering Consignor counters/gross (hop 2) and DRAFT Settlement provisional recompute (hop 3)"
          - "SaleEvent.sold_gross_cents recomputed"
      - from: OPEN
        to: VOIDED
        trigger: "POST /pos-transactions/{id}/void"
        actor: Cashier | EventOrganizer
        preconditions: []
        side_effects: ["All line Items IN_CART -> ON_FLOOR; line rows deleted"]
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /pos-transactions/{id}/void"
        actor: EventOrganizer
        preconditions: ["Event phase in {PRESALE_DAY, SALE_ACTIVE}"]
        side_effects:
          - "All line Items SOLD -> ON_FLOOR (compensation)"
          - "Consignor counters/gross, DRAFT Settlement provisional fields, SaleEvent.sold_gross_cents recomputed; lines retained for audit"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: EventOrganizer
        preconditions: ["Event phase == SETTLEMENT"]
        side_effects: ["Final-variant payout pipeline computed and frozen into gross_cents, split_pct, commission_cents, payout_before_fee_cents, supply_fee_cents, rejected_fee_cents, payout_cents"]
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /settlements/{id}/dispute {reason}"
        actor: Consignor (owner)
        preconditions: []
        side_effects: ["Sets dispute_reason"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /settlements/{id}/resolve {adjustment_cents}"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["adjustment_cents accumulates (+= input); cycle back to DRAFT for re-finalization with the adjustment included"]
      - from: FINALIZED
        to: PAID
        trigger: "POST /settlements/{id}/mark-paid"
        actor: EventOrganizer
        preconditions: ["All Items of the consignor in terminal status SOLD | PICKED_UP | DONATED (ERR_ITEMS_NOT_TERMINAL)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-regen-stale-event
    parent_entity: SaleEvent
    write_endpoint: "POST /sale-events/{id}/generate-settlements"
    occ_field: "expected_sale_event_version"
    description: |
      Regenerating settlements supersedes every existing DRAFT Settlement of the
      event and is legitimate to run repeatedly during SALE_ACTIVE/SETTLEMENT.
      A regeneration request carrying an expected_sale_event_version older than
      the event's current version is rejected: the client's view predates a
      prior regeneration (or another mutation) and would supersede drafts built
      from newer sales data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: consignor_code_assignment
    trigger: "POST /consignors"
    algorithm: aggregation
    formula: |
      consignor_code = "C" + zeroPad4(N) where N is the consignor's 1-based
      registration order within the event, ordered by created_at ASC.
    input_set: "All Consignors of the event, ordered by created_at ASC"
    precision: "integer sequence"

  - name: barcode_assignment
    trigger: "POST /items"
    algorithm: aggregation
    formula: |
      barcode = consignor.consignor_code + "-" + zeroPad4(M) where M is the
      item's 1-based creation order for that consignor, by created_at ASC.
    input_set: "Items of the consignor, ordered by created_at ASC"
    precision: "integer sequence"

  - name: markdown_price_at_scan
    trigger: "POST /pos-transactions/{id}/lines (barcode scan)"
    algorithm: threshold
    formula: |
      md_pct = discount_pct of the MarkdownRule R with R.sale_event_id == item.sale_event_id
               and R.effective_from <= scan_utc < R.effective_to (half-open; window
               non-overlap guarantees at most one match); 0 when no rule matches.
      If item.discount_eligible == false: md_pct = 0 regardless.
      line_price_cents = round_half_up(tag_price_cents * (100 - md_pct) / 100)
    input_set: "MarkdownRules of the item's event; single scanned Item"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"

  - name: transaction_totals
    trigger: "line scan (per line) and checkout (totals)"
    algorithm: aggregation
    formula: |
      At transaction creation: pass_pct = presale_pass.discount_pct if attached else 0.
      Per line at scan: final_line_cents = round_half_up(line_price_cents * (100 - pass_pct) / 100).
      At checkout:
        subtotal_cents = SUM(line_price_cents)
        total_cents    = SUM(final_line_cents)
        discount_cents = subtotal_cents - total_cents
        change_cents   = tendered_cents - total_cents
      ROUNDING ORDER PINNED: round each line to cents first, then sum. The
      alternative (sum raw line values, then round once) is forbidden.
    input_set: "Current (non-deleted) TransactionLines of the transaction"
    precision: "integer cents, round_half_up per line"

  - name: volunteer_discount_tier
    trigger: "signup check-in/check-out (recompute) and pass issuance (pin)"
    algorithm: threshold
    formula: |
      tier(h): h >= 12 -> 20; h >= 8 -> 15; h >= 4 -> 10; else 5.  Boundaries are >=.
      earned_hours   = SUM(hours_credited) over signups in status COMPLETED
      projected_hours = earned_hours + SUM(shift duration hours) over signups in status CHECKED_IN
    input_set: "ShiftSignups of the volunteer"
    constants:
      TIER_12H: 20
      TIER_8H: 15
      TIER_4H: 10
      BASE: 5
    precision: "hours to 2 decimal places; pct integer"
    variants:
      - name: projected
        when: "Volunteer.projected_discount_pct (read model, forward-looking)"
        difference: "Uses projected_hours (includes CHECKED_IN shifts not yet completed)"
      - name: earned
        when: "PresalePass.discount_pct at issuance"
        difference: "Uses earned_hours only (COMPLETED signups) and is pinned forever on the issued pass"

  - name: presale_pass_issuance
    trigger: "POST /sale-events/{id}/issue-presale-passes"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (explicit):
        CONSIGNOR pass: Consignor.status == ACTIVE AND count of own Items with
          status IN {ACCEPTED, ON_FLOOR, IN_CART, SOLD} >= 1. discount_pct = 0.
        VOLUNTEER pass: count of own ShiftSignups with status IN {CHECKED_IN, COMPLETED}
          >= 1. discount_pct = volunteer_discount_tier.earned(completed_hours).
      Idempotency: a holder with an existing ACTIVE pass for the event is skipped.
      Issued passes are pinned: later hour changes never alter them.
    input_set: "All Consignors and Volunteers of the event, processed by created_at ASC"
    precision: "pct integer"

  - name: consignor_split_percentage
    trigger: "settlement payout pipeline (provisional and final)"
    algorithm: tiered_pricing
    formula: |
      tier(g): g < 20000 -> 60; 20000 <= g < 50000 -> 65; g >= 50000 -> 70.
      bonus = 5 if exists Volunteer V with V.linked_consignor_id == consignor.id
              and V.completed_hours >= 4, else 0.
      split_pct = min(75, tier(gross_cents) + bonus)
      Three interacting inputs (gross tier, volunteer hours, cap) with nested min.
    input_set: "Single consignor; gross_cents from payout pipeline step 1"
    constants:
      TIER_LOW_MAX: 20000
      TIER_MID_MAX: 50000
      SPLIT_LOW: 60
      SPLIT_MID: 65
      SPLIT_HIGH: 70
      VOLUNTEER_BONUS_PCT: 5
      BONUS_HOURS_THRESHOLD: 4
      SPLIT_CAP_PCT: 75
    precision: "pct integer"

  - name: settlement_payout
    trigger: "generate-settlements and every recomputation trigger (provisional variant); POST /settlements/{id}/finalize (final variant)"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
      1. gross_cents = SUM(TransactionLine.final_line_cents) where the line's item
         belongs to the consignor and the line's transaction status == COMPLETED.
      2. split_pct = consignor_split_percentage(gross_cents).
      3. commission_cents = round_half_up(gross_cents * (100 - split_pct) / 100).
      4. payout_before_fee_cents = gross_cents - commission_cents.
      5. supply_fee_cents = 0 if payout_before_fee_cents >= 30000 OR the volunteer
         bonus condition of consignor_split_percentage holds; else 1000.
         NOTE: the waiver test reads payout_before_fee_cents (pre-fee), never the
         post-fee payout — evaluating fee first produces different results.
      6. rejected_fee_cents = 200 * consignor.rejected_count.
      7. payout_cents = max(0, payout_before_fee_cents - supply_fee_cents
                            - rejected_fee_cents + adjustment_cents).
    input_set: "COMPLETED transactions' lines for the consignor's items; consignor.rejected_count"
    constants:
      SUPPLY_FEE_CENTS: 1000
      FEE_WAIVER_PAYOUT_THRESHOLD_CENTS: 30000
      REJECTED_ITEM_FEE_CENTS: 200
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "While event phase in {SALE_ACTIVE, SETTLEMENT} and settlement is DRAFT; stored in provisional_gross_cents / provisional_payout_cents"
        difference: "estimated_gross = actual gross (step 1) + SUM over the consignor's ON_FLOOR items of round_half_up(line-price-at-current-markdown * 50 / 100), per-item rounded then summed; pipeline then runs on estimated_gross with adjustment_cents treated as 0"
      - name: final
        when: "POST /settlements/{id}/finalize"
        difference: "Steps 1-7 on actuals only; ON_FLOOR projection is excluded; results frozen onto the Settlement row"

  - name: consignor_counters
    trigger: "every Item status transition"
    algorithm: aggregation
    formula: |
      sold_count     = count of consignor's Items with status == SOLD
      unsold_count   = count with status == UNSOLD
      rejected_count = count with status == REJECTED
      sold_gross_cents = SUM(final_line_cents) over lines of consignor's items
                         whose transaction status == COMPLETED
    input_set: "All Items of the consignor"
    precision: "integers"

  - name: slot_capacity_check
    trigger: "POST /drop-off-bookings"
    algorithm: aggregation
    formula: |
      booked_count = count of DropOffBookings for the slot with status IN {BOOKED, CHECKED_IN}.
      Reject when booked_count >= capacity (boundary: booking that would make
      booked_count == capacity is allowed; the next one fails).
      Cancel/NO_SHOW/COMPLETED frees one unit (compensation).
    input_set: "DropOffBookings of the slot"
    precision: "integers"

  - name: shift_overlap_check
    trigger: "POST /shift-signups"
    algorithm: interval_merge
    formula: |
      Reject when the volunteer has an existing signup S with status IN
      {SIGNED_UP, CHECKED_IN} whose shift satisfies:
        S.shift.start_time < new_shift.end_time AND new_shift.start_time < S.shift.end_time
      Half-open [start, end) semantics: adjacency (end == start) is NOT a conflict.
    input_set: "ShiftSignups of the volunteer joined to their VolunteerShifts"
    precision: "datetimes to the second"

  - name: markdown_window_conflict
    trigger: "POST /markdown-rules"
    algorithm: interval_merge
    formula: |
      Reject when the event has an existing MarkdownRule R with:
        R.effective_from < new.effective_to AND new.effective_from < R.effective_to
      Half-open semantics: back-to-back windows (effective_to == effective_from) allowed.
      Also requires effective_from < effective_to and phase in {DRAFT, INTAKE_OPEN, INTAKE_CLOSED, PRESALE_DAY}.
    input_set: "MarkdownRules of the event"
    precision: "datetimes to the second"

  - name: event_gross_reconciliation
    trigger: "checkout; void of COMPLETED transaction"
    algorithm: aggregation
    formula: |
      INVARIANT (money): SaleEvent.sold_gross_cents
        == SUM(POSTransaction.total_cents where status == COMPLETED)
        == SUM(Consignor.sold_gross_cents over the event's consignors)
      checkout (+total) and void-of-completed (-total) form a compensating pair
      that leaves the conserved quantity unchanged.
    input_set: "POSTransactions of the event with status COMPLETED"
    precision: "integer cents"

  - name: sellable_inventory_invariant
    trigger: "line scan; line removal; checkout; transaction void"
    algorithm: aggregation
    formula: |
      INVARIANT (count): sellable_count = count of the event's Items with status
      IN {ON_FLOOR, IN_CART, SOLD}. Scan (ON_FLOOR->IN_CART) + line removal
      (IN_CART->ON_FLOOR) leave sellable_count unchanged; checkout (+SOLD) and
      void-of-completed (SOLD->ON_FLOOR) likewise. No Item transition creates or
      destroys rows: total item count per event is constant after creation.
    input_set: "Items of the event"
    precision: "integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; entity-backed ownership: Consignor may only act on own items/bookings/settlements (path or body consignor_id == X-User-ID), Volunteer only on own signups; Cashier may void only OPEN transactions"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body resource ids exist, validated left-to-right (ERR_SALE_EVENT_NOT_FOUND, ERR_CONSIGNOR_NOT_FOUND, ERR_ITEM_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_VOLUNTEER_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_SIGNUP_NOT_FOUND, ERR_PASS_NOT_FOUND, ERR_TRANSACTION_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_MARKDOWN_RULE_NOT_FOUND, ERR_INSPECTION_RECORD_NOT_FOUND, ERR_BARCODE_NOT_FOUND)"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: state
    check: "SaleEvent phase gate for the operation (item create: DRAFT/INTAKE_OPEN; booking create/check-in, drop-off: INTAKE_OPEN; inspect: INTAKE_OPEN/INTAKE_CLOSED; markdown create: up to PRESALE_DAY; POS open: PRESALE_DAY/SALE_ACTIVE; generate-settlements: SALE_ACTIVE/SETTLEMENT; finalize: SETTLEMENT; UNSOLD pickup: SETTLEMENT; void-completed: PRESALE_DAY/SALE_ACTIVE)"
    error_id: ERR_EVENT_PHASE_MISMATCH
    http_status: 409
    applies_to: "phase-gated endpoints"
  - priority: 5
    category: state
    check: "Target entity lifecycle state permits the operation (ERR_ITEM_WRONG_STATE, ERR_TRANSACTION_NOT_OPEN, ERR_BOOKING_WRONG_STATE, ERR_SIGNUP_WRONG_STATE, ERR_SETTLEMENT_WRONG_STATE, ERR_PASS_NOT_ACTIVE, ERR_SETTLEMENTS_LOCKED when any settlement of the event is FINALIZED/DISPUTED/PAID at generate-settlements)"
    error_id: ERR_*_WRONG_STATE family
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: Inspector's Volunteer.linked_consignor_id must differ from the inspected item's consignor_id"
    error_id: ERR_INSPECTION_SELF_DEALING
    http_status: 403
    applies_to: "POST /items/{id}/inspect"
  - priority: 7
    category: business_temporal
    check: "Clock windows and interval rules: drop-off within [intake_start, intake_end) (ERR_INTAKE_WINDOW_CLOSED); inspection before presale_start (ERR_INSPECTION_DEADLINE_PASSED); pickup at or before pickup_deadline (ERR_PICKUP_WINDOW_CLOSED); shift signup half-open overlap (ERR_SHIFT_OVERLAP); markdown window validity/overlap (ERR_INVALID_TIME_WINDOW, ERR_MARKDOWN_WINDOW_OVERLAP); no-show only after shift end (ERR_NO_SHOW_TOO_EARLY)"
    error_id: "ERR_INTAKE_WINDOW_CLOSED | ERR_INSPECTION_DEADLINE_PASSED | ERR_PICKUP_WINDOW_CLOSED | ERR_SHIFT_OVERLAP | ERR_INVALID_TIME_WINDOW | ERR_MARKDOWN_WINDOW_OVERLAP | ERR_NO_SHOW_TOO_EARLY"
    http_status: 409
    applies_to: "window/overlap-gated endpoints"
  - priority: 8
    category: business_constraint
    check: "Capacity/uniqueness/format/guards: slot and shift capacity (ERR_SLOT_FULL, ERR_SHIFT_FULL); one active booking per consignor (ERR_DUPLICATE_ACTIVE_BOOKING); price >= 200 and multiple of 50 (ERR_PRICE_BELOW_MINIMUM, ERR_PRICE_INCREMENT_VIOLATION); scanned item ON_FLOOR (ERR_ITEM_NOT_ON_FLOOR); pass required in presale (ERR_PRESALE_PASS_REQUIRED); checked-in booking required (ERR_NO_CHECKED_IN_BOOKING); uninspected items / open transactions / non-terminal items block advances and payment (ERR_UNINSPECTED_ITEMS_REMAIN, ERR_OPEN_TRANSACTIONS_REMAIN, ERR_ITEMS_NOT_TERMINAL); withdraw requires zero items (ERR_CONSIGNOR_HAS_ITEMS); checkout requires lines (ERR_EMPTY_TRANSACTION); OCC stale version (ERR_STALE_VERSION)"
    error_id: "ERR_SLOT_FULL | ERR_SHIFT_FULL | ERR_DUPLICATE_ACTIVE_BOOKING | ERR_PRICE_BELOW_MINIMUM | ERR_PRICE_INCREMENT_VIOLATION | ERR_ITEM_NOT_ON_FLOOR | ERR_PRESALE_PASS_REQUIRED | ERR_NO_CHECKED_IN_BOOKING | ERR_UNINSPECTED_ITEMS_REMAIN | ERR_OPEN_TRANSACTIONS_REMAIN | ERR_ITEMS_NOT_TERMINAL | ERR_CONSIGNOR_HAS_ITEMS | ERR_EMPTY_TRANSACTION | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "business endpoints (ERR_STALE_VERSION: 412)"
  - priority: 9
    category: business_fiscal
    check: "tendered_cents >= total_cents at checkout"
    error_id: ERR_INSUFFICIENT_TENDER
    http_status: 402
    applies_to: "POST /pos-transactions/{id}/checkout"

# =============================================================================
# §1.5 API Endpoint Table (54 endpoints)
# List endpoints sort by created_at ASC; all accept limit?/offset?.
# =============================================================================
endpoints:
  # --- SaleEvent ---
  - { method: POST, path: "/sale-events", description: "Create a sale event (phase DRAFT)", roles: [EventOrganizer], code: 201, input: [name, intake_start, intake_end, presale_start, presale_end, sale_start, sale_end, pickup_deadline], output: SaleEvent, side_effects: ["phase=DRAFT, sold_gross_cents=0"] }
  - { method: GET, path: "/sale-events", description: "List sale events", roles: [EventOrganizer, Consignor, Volunteer, Inspector, Cashier], code: 200, input: ["phase?", "limit?", "offset?"], output: "SaleEvent[]", side_effects: [] }
  - { method: GET, path: "/sale-events/{id}", description: "Get one sale event", roles: [EventOrganizer, Consignor, Volunteer, Inspector, Cashier], code: 200, input: [], output: SaleEvent, side_effects: [] }
  - { method: POST, path: "/sale-events/{id}/advance-phase", description: "Advance the event phase to the exact next phase named in to_phase", roles: [EventOrganizer], code: 200, input: [to_phase], output: SaleEvent, side_effects: ["per SaleEvent state machine; increments SaleEvent.version by 1"] }
  - { method: POST, path: "/sale-events/{id}/issue-presale-passes", description: "Issue pinned-discount presale passes to all eligible consignors and volunteers; requires phase in {INTAKE_CLOSED, PRESALE_DAY}; idempotent per holder", roles: [EventOrganizer], code: 200, input: [], output: "PresalePass[]", side_effects: ["creates PresalePass rows per presale_pass_issuance"] }
  - { method: POST, path: "/sale-events/{id}/generate-settlements", description: "Create/supersede DRAFT settlements for every consignor with >= 1 item ever DROPPED_OFF (item status != TAGGED); requires phase in {SALE_ACTIVE, SETTLEMENT}; OCC-guarded", roles: [EventOrganizer], code: 200, input: [expected_sale_event_version], output: "Settlement[]", side_effects: ["deletes prior DRAFT settlements, creates fresh DRAFTs with provisional fields; increments SaleEvent.version by 1; ERR_STALE_VERSION on version mismatch"] }

  # --- MarkdownRule ---
  - { method: POST, path: "/markdown-rules", description: "Create a markdown window; no half-open overlap per event; phase <= PRESALE_DAY", roles: [EventOrganizer], code: 201, input: [sale_event_id, effective_from, effective_to, discount_pct], output: MarkdownRule, side_effects: [] }
  - { method: GET, path: "/markdown-rules", description: "List markdown rules", roles: [EventOrganizer, Cashier], code: 200, input: ["sale_event_id?", "limit?", "offset?"], output: "MarkdownRule[]", side_effects: [] }
  - { method: GET, path: "/markdown-rules/{id}", description: "Get one markdown rule", roles: [EventOrganizer, Cashier], code: 200, input: [], output: MarkdownRule, side_effects: [] }

  # --- Consignor ---
  - { method: POST, path: "/consignors", description: "Self-register a consignor for an event; assigns consignor_code; event phase must be DRAFT or INTAKE_OPEN", roles: [Anonymous], code: 201, input: [sale_event_id, full_name, email], output: Consignor, side_effects: ["status=ACTIVE; consignor_code assigned"] }
  - { method: GET, path: "/consignors", description: "List consignors", roles: [EventOrganizer], code: 200, input: ["sale_event_id?", "status?", "limit?", "offset?"], output: "Consignor[]", side_effects: [] }
  - { method: GET, path: "/consignors/{id}", description: "Get one consignor (owner or organizer)", roles: [EventOrganizer, Consignor], code: 200, input: [], output: Consignor, side_effects: [] }
  - { method: POST, path: "/consignors/{id}/withdraw", description: "Withdraw a consignor; requires zero items", roles: [EventOrganizer, Consignor], code: 200, input: [], output: Consignor, side_effects: ["status -> WITHDRAWN"] }

  # --- Volunteer ---
  - { method: POST, path: "/volunteers", description: "Self-register a volunteer; optional linked_consignor_id when also a consignor", roles: [Anonymous], code: 201, input: [sale_event_id, full_name, email, "linked_consignor_id?"], output: Volunteer, side_effects: [] }
  - { method: GET, path: "/volunteers", description: "List volunteers", roles: [EventOrganizer], code: 200, input: ["sale_event_id?", "linked_consignor_id?", "limit?", "offset?"], output: "Volunteer[]", side_effects: [] }
  - { method: GET, path: "/volunteers/{id}", description: "Get one volunteer (self as Volunteer/Inspector or organizer)", roles: [EventOrganizer, Volunteer, Inspector], code: 200, input: [], output: Volunteer, side_effects: [] }

  # --- DropOffSlot / Booking ---
  - { method: POST, path: "/drop-off-slots", description: "Create a drop-off appointment slot; phase in {DRAFT, INTAKE_OPEN}", roles: [EventOrganizer], code: 201, input: [sale_event_id, start_time, end_time, capacity], output: DropOffSlot, side_effects: [] }
  - { method: GET, path: "/drop-off-slots", description: "List slots with booked_count", roles: [EventOrganizer, Consignor], code: 200, input: ["sale_event_id?", "limit?", "offset?"], output: "DropOffSlot[]", side_effects: [] }
  - { method: GET, path: "/drop-off-slots/{id}", description: "Get one slot", roles: [EventOrganizer, Consignor], code: 200, input: [], output: DropOffSlot, side_effects: [] }
  - { method: POST, path: "/drop-off-bookings", description: "Book a slot (aggregate capacity); one active booking per consignor; phase in {DRAFT, INTAKE_OPEN}", roles: [Consignor], code: 201, input: [slot_id, consignor_id], output: DropOffBooking, side_effects: ["slot.booked_count += 1"] }
  - { method: GET, path: "/drop-off-bookings", description: "List bookings", roles: [EventOrganizer, Consignor], code: 200, input: ["slot_id?", "consignor_id?", "status?", "limit?", "offset?"], output: "DropOffBooking[]", side_effects: [] }
  - { method: GET, path: "/drop-off-bookings/{id}", description: "Get one booking", roles: [EventOrganizer, Consignor], code: 200, input: [], output: DropOffBooking, side_effects: [] }
  - { method: POST, path: "/drop-off-bookings/{id}/cancel", description: "Cancel a BOOKED booking; frees capacity", roles: [EventOrganizer, Consignor], code: 200, input: [], output: DropOffBooking, side_effects: ["slot.booked_count -= 1"] }
  - { method: POST, path: "/drop-off-bookings/{id}/check-in", description: "Check in a booking at the venue", roles: [EventOrganizer], code: 200, input: [], output: DropOffBooking, side_effects: ["BOOKED -> CHECKED_IN"] }

  # --- Item ---
  - { method: POST, path: "/items", description: "Tag a new item; server assigns barcode; phase in {DRAFT, INTAKE_OPEN}; price >= 200 and multiple of 50", roles: [Consignor], code: 201, input: [consignor_id, title, category, price_cents, "size?", "discount_eligible?", "donate_flag?"], output: Item, side_effects: ["status=TAGGED; barcode assigned"] }
  - { method: GET, path: "/items", description: "List items with filters", roles: [EventOrganizer, Consignor, Cashier, Inspector], code: 200, input: ["sale_event_id?", "consignor_id?", "status?", "barcode?", "limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: GET, path: "/items/{id}", description: "Get one item", roles: [EventOrganizer, Consignor, Cashier, Inspector], code: 200, input: [], output: Item, side_effects: [] }
  - { method: POST, path: "/items/{id}/drop-off", description: "Drop off a TAGGED item during intake with a checked-in booking", roles: [Consignor], code: 200, input: [], output: Item, side_effects: ["TAGGED -> DROPPED_OFF"] }
  - { method: POST, path: "/items/{id}/inspect", description: "Inspect a DROPPED_OFF item; segregation of duties enforced; creates InspectionRecord", roles: [Inspector], code: 200, input: [outcome, "reasons?"], output: Item, side_effects: ["DROPPED_OFF -> ACCEPTED|REJECTED; InspectionRecord created"] }
  - { method: POST, path: "/items/{id}/pickup", description: "Pick up a REJECTED or UNSOLD item (window rules per state machine)", roles: [Consignor], code: 200, input: [], output: Item, side_effects: ["REJECTED|UNSOLD -> PICKED_UP"] }

  # --- InspectionRecord ---
  - { method: GET, path: "/inspection-records", description: "List inspection audit records", roles: [EventOrganizer, Inspector], code: 200, input: ["item_id?", "inspector_id?", "limit?", "offset?"], output: "InspectionRecord[]", side_effects: [] }
  - { method: GET, path: "/inspection-records/{id}", description: "Get one inspection record", roles: [EventOrganizer, Inspector], code: 200, input: [], output: InspectionRecord, side_effects: [] }

  # --- VolunteerShift / ShiftSignup ---
  - { method: POST, path: "/volunteer-shifts", description: "Create a volunteer shift; phase in {DRAFT, INTAKE_OPEN, INTAKE_CLOSED}", roles: [EventOrganizer], code: 201, input: [sale_event_id, role_name, start_time, end_time, capacity], output: VolunteerShift, side_effects: [] }
  - { method: GET, path: "/volunteer-shifts", description: "List shifts", roles: [EventOrganizer, Volunteer, Inspector], code: 200, input: ["sale_event_id?", "limit?", "offset?"], output: "VolunteerShift[]", side_effects: [] }
  - { method: GET, path: "/volunteer-shifts/{id}", description: "Get one shift", roles: [EventOrganizer, Volunteer, Inspector], code: 200, input: [], output: VolunteerShift, side_effects: [] }
  - { method: POST, path: "/shift-signups", description: "Sign up for a shift; half-open overlap and capacity enforced; phase not in {SETTLEMENT, CLOSED}", roles: [Volunteer], code: 201, input: [shift_id, volunteer_id], output: ShiftSignup, side_effects: ["shift.signed_up_count += 1"] }
  - { method: GET, path: "/shift-signups", description: "List signups", roles: [EventOrganizer, Volunteer, Inspector], code: 200, input: ["shift_id?", "volunteer_id?", "status?", "limit?", "offset?"], output: "ShiftSignup[]", side_effects: [] }
  - { method: GET, path: "/shift-signups/{id}", description: "Get one signup", roles: [EventOrganizer, Volunteer, Inspector], code: 200, input: [], output: ShiftSignup, side_effects: [] }
  - { method: POST, path: "/shift-signups/{id}/cancel", description: "Cancel a SIGNED_UP signup", roles: [EventOrganizer, Volunteer], code: 200, input: [], output: ShiftSignup, side_effects: ["shift.signed_up_count -= 1"] }
  - { method: POST, path: "/shift-signups/{id}/check-in", description: "Check in a signup", roles: [EventOrganizer], code: 200, input: [], output: ShiftSignup, side_effects: ["SIGNED_UP -> CHECKED_IN; volunteer projected fields recomputed"] }
  - { method: POST, path: "/shift-signups/{id}/check-out", description: "Complete a checked-in signup; credits hours", roles: [EventOrganizer], code: 200, input: [], output: ShiftSignup, side_effects: ["CHECKED_IN -> COMPLETED; hours_credited set; volunteer hours recomputed"] }
  - { method: POST, path: "/shift-signups/{id}/mark-no-show", description: "Mark a SIGNED_UP signup no-show after shift end", roles: [EventOrganizer], code: 200, input: [], output: ShiftSignup, side_effects: ["SIGNED_UP -> NO_SHOW; shift.signed_up_count -= 1"] }

  # --- PresalePass ---
  - { method: GET, path: "/presale-passes", description: "List presale passes", roles: [EventOrganizer, Consignor, Volunteer, Cashier], code: 200, input: ["sale_event_id?", "holder_id?", "status?", "limit?", "offset?"], output: "PresalePass[]", side_effects: [] }
  - { method: GET, path: "/presale-passes/{id}", description: "Get one presale pass", roles: [EventOrganizer, Consignor, Volunteer, Cashier], code: 200, input: [], output: PresalePass, side_effects: [] }
  - { method: POST, path: "/presale-passes/{id}/revoke", description: "Revoke a pass", roles: [EventOrganizer], code: 200, input: [], output: PresalePass, side_effects: ["ACTIVE -> REVOKED"] }

  # --- POS ---
  - { method: POST, path: "/pos-transactions", description: "Open a sale ticket; phase in {PRESALE_DAY, SALE_ACTIVE}; presale_pass_id mandatory during PRESALE_DAY and must be ACTIVE; pass discount snapshotted", roles: [Cashier], code: 201, input: [sale_event_id, "presale_pass_id?"], output: POSTransaction, side_effects: ["status=OPEN; pass_discount_pct snapshot"] }
  - { method: GET, path: "/pos-transactions", description: "List transactions", roles: [EventOrganizer, Cashier], code: 200, input: ["sale_event_id?", "presale_pass_id?", "status?", "limit?", "offset?"], output: "POSTransaction[]", side_effects: [] }
  - { method: GET, path: "/pos-transactions/{id}", description: "Get one transaction", roles: [EventOrganizer, Cashier], code: 200, input: [], output: POSTransaction, side_effects: [] }
  - { method: POST, path: "/pos-transactions/{id}/lines", description: "Scan a barcode into an OPEN transaction; computes scan-time prices; item ON_FLOOR -> IN_CART", roles: [Cashier], code: 201, input: [barcode], output: TransactionLine, side_effects: ["TransactionLine created; Item -> IN_CART; transaction totals recomputed"] }
  - { method: GET, path: "/transaction-lines", description: "List transaction lines", roles: [EventOrganizer, Cashier], code: 200, input: ["transaction_id?", "item_id?", "limit?", "offset?"], output: "TransactionLine[]", side_effects: [] }
  - { method: GET, path: "/transaction-lines/{id}", description: "Get one transaction line", roles: [EventOrganizer, Cashier], code: 200, input: [], output: TransactionLine, side_effects: [] }
  - { method: DELETE, path: "/pos-transactions/{id}/lines/{lineId}", description: "Remove a line from an OPEN transaction; item returns to ON_FLOOR", roles: [Cashier], code: 200, input: [], output: TransactionLine, side_effects: ["line deleted; Item IN_CART -> ON_FLOOR; totals recomputed"] }
  - { method: POST, path: "/pos-transactions/{id}/checkout", description: "Complete an OPEN transaction; per-line rounded totals; items IN_CART -> SOLD with full cascade", roles: [Cashier], code: 200, input: [tendered_cents], output: POSTransaction, side_effects: ["OPEN -> COMPLETED; items -> SOLD; consignor/settlement/event recompute cascade"] }
  - { method: POST, path: "/pos-transactions/{id}/void", description: "Void a transaction; Cashier only while OPEN, EventOrganizer also when COMPLETED (compensation)", roles: [Cashier, EventOrganizer], code: 200, input: [], output: POSTransaction, side_effects: ["-> VOIDED; compensating item/gross reversals per state machine"] }

  # --- Settlement ---
  - { method: GET, path: "/settlements", description: "List settlements", roles: [EventOrganizer, Consignor], code: 200, input: ["sale_event_id?", "consignor_id?", "status?", "limit?", "offset?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/settlements/{id}", description: "Get one settlement (owner or organizer)", roles: [EventOrganizer, Consignor], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/settlements/{id}/finalize", description: "Freeze the final-variant payout; requires phase SETTLEMENT and status DRAFT", roles: [EventOrganizer], code: 200, input: [], output: Settlement, side_effects: ["DRAFT -> FINALIZED; final fields computed"] }
  - { method: POST, path: "/settlements/{id}/dispute", description: "Consignor disputes a FINALIZED settlement", roles: [Consignor], code: 200, input: [reason], output: Settlement, side_effects: ["FINALIZED -> DISPUTED"] }
  - { method: POST, path: "/settlements/{id}/resolve", description: "Resolve a dispute; accumulates adjustment_cents and returns to DRAFT", roles: [EventOrganizer], code: 200, input: [adjustment_cents], output: Settlement, side_effects: ["DISPUTED -> DRAFT; adjustment_cents += input"] }
  - { method: POST, path: "/settlements/{id}/mark-paid", description: "Pay a FINALIZED settlement; all consignor items must be terminal", roles: [EventOrganizer], code: 200, input: [], output: Settlement, side_effects: ["FINALIZED -> PAID"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601 UTC). Startup default before any call is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [EventOrganizer], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock updated"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity-backed ownership check failed, or Cashier attempting to void a COMPLETED transaction" }
  - { id: ERR_SALE_EVENT_NOT_FOUND, http: 404, condition: "Sale event id does not exist" }
  - { id: ERR_CONSIGNOR_NOT_FOUND, http: 404, condition: "Consignor id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "Item id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "Drop-off slot id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Drop-off booking id does not exist" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "Volunteer id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "Volunteer shift id does not exist" }
  - { id: ERR_SIGNUP_NOT_FOUND, http: 404, condition: "Shift signup id does not exist" }
  - { id: ERR_PASS_NOT_FOUND, http: 404, condition: "Presale pass id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "POS transaction id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "Transaction line id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Settlement id does not exist" }
  - { id: ERR_MARKDOWN_RULE_NOT_FOUND, http: 404, condition: "Markdown rule id does not exist" }
  - { id: ERR_BARCODE_NOT_FOUND, http: 404, condition: "Scanned barcode matches no item of the transaction's event" }
  - { id: ERR_INSPECTION_RECORD_NOT_FOUND, http: 404, condition: "Inspection record id does not exist" }
  - { id: ERR_EVENT_PHASE_MISMATCH, http: 409, condition: "Operation not allowed in the event's current phase (including advance-phase skipping a phase)" }
  - { id: ERR_ITEM_WRONG_STATE, http: 409, condition: "Item not in the state required for the operation" }
  - { id: ERR_TRANSACTION_NOT_OPEN, http: 409, condition: "Transaction not OPEN for scan/line-remove/checkout/open-void" }
  - { id: ERR_BOOKING_WRONG_STATE, http: 409, condition: "Booking not in the state required (e.g., check-in requires BOOKED)" }
  - { id: ERR_SIGNUP_WRONG_STATE, http: 409, condition: "Signup not in the state required (e.g., check-out requires CHECKED_IN)" }
  - { id: ERR_SETTLEMENT_WRONG_STATE, http: 409, condition: "Settlement not in the state required (finalize requires DRAFT; dispute requires FINALIZED; resolve requires DISPUTED; mark-paid requires FINALIZED)" }
  - { id: ERR_SETTLEMENTS_LOCKED, http: 409, condition: "generate-settlements while any settlement of the event is FINALIZED, DISPUTED, or PAID" }
  - { id: ERR_PASS_NOT_ACTIVE, http: 409, condition: "Presale pass revoked or otherwise not ACTIVE" }
  - { id: ERR_INSPECTION_SELF_DEALING, http: 403, condition: "Inspector is linked to the consignor who owns the item (segregation of duties)" }
  - { id: ERR_INTAKE_WINDOW_CLOSED, http: 409, condition: "Drop-off outside [intake_start, intake_end)" }
  - { id: ERR_INSPECTION_DEADLINE_PASSED, http: 409, condition: "Inspection attempted at or after presale_start" }
  - { id: ERR_PICKUP_WINDOW_CLOSED, http: 409, condition: "Unsold pickup after pickup_deadline" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Volunteer already has a SIGNED_UP/CHECKED_IN signup whose shift overlaps (half-open) the requested shift" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 409, condition: "effective_from >= effective_to (or start_time >= end_time) on windowed resources" }
  - { id: ERR_MARKDOWN_WINDOW_OVERLAP, http: 409, condition: "Markdown window overlaps an existing rule for the same event (half-open)" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "mark-no-show before the shift's end_time" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "Drop-off slot booked_count == capacity" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Shift signed_up_count == capacity" }
  - { id: ERR_DUPLICATE_ACTIVE_BOOKING, http: 409, condition: "Consignor already has a booking in BOOKED or CHECKED_IN for this event" }
  - { id: ERR_PRICE_BELOW_MINIMUM, http: 400, condition: "price_cents < 200" }
  - { id: ERR_PRICE_INCREMENT_VIOLATION, http: 400, condition: "price_cents not a multiple of 50" }
  - { id: ERR_ITEM_NOT_ON_FLOOR, http: 409, condition: "Scanned item not in ON_FLOOR status" }
  - { id: ERR_PRESALE_PASS_REQUIRED, http: 403, condition: "Transaction created during PRESALE_DAY without a valid ACTIVE pass" }
  - { id: ERR_NO_CHECKED_IN_BOOKING, http: 409, condition: "Drop-off without a CHECKED_IN booking for the consignor" }
  - { id: ERR_UNINSPECTED_ITEMS_REMAIN, http: 409, condition: "Advance to PRESALE_DAY while items remain DROPPED_OFF" }
  - { id: ERR_OPEN_TRANSACTIONS_REMAIN, http: 409, condition: "Advance to SETTLEMENT while transactions are OPEN" }
  - { id: ERR_ITEMS_NOT_TERMINAL, http: 409, condition: "mark-paid (or advance to CLOSED) while consignor items are not in terminal status" }
  - { id: ERR_CONSIGNOR_HAS_ITEMS, http: 409, condition: "Withdraw requested for a consignor owning items" }
  - { id: ERR_EMPTY_TRANSACTION, http: 409, condition: "Checkout with zero current lines" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_sale_event_version does not match the event's current version at generate-settlements" }
  - { id: ERR_INSUFFICIENT_TENDER, http: 402, condition: "tendered_cents < total_cents at checkout" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registrant"
    identity: opaque
    exclusive_operations: ["POST /consignors", "POST /volunteers"]
    shared_operations: []
  - name: EventOrganizer
    description: "Runs the sale: event config, slots, shifts, inspection oversight, settlement lifecycle, completed-transaction voids"
    identity: opaque
    exclusive_operations: ["advance-phase", "issue-presale-passes", "generate-settlements", "markdown rule management", "drop-off slot creation", "booking check-in", "shift management and check-in/out/no-show", "pass revocation", "settlement finalize/resolve/mark-paid", "void of COMPLETED transactions"]
    shared_operations: ["read endpoints", "withdraw consignor", "cancel booking/signup", "void of OPEN transactions", "set the logical clock"]
  - name: Consignor
    description: "Seller; owns items, bookings, and settlements (X-User-ID == Consignor.id)"
    identity: "entity_backed:Consignor"
    exclusive_operations: ["tag items", "book/cancel own drop-off booking", "drop off own items", "pick up own items", "dispute own settlement"]
    shared_operations: ["read own consignor/items/settlements/passes/slots", "withdraw self"]
  - name: Volunteer
    description: "Shift worker; earns discount hours (X-User-ID == Volunteer.id)"
    identity: "entity_backed:Volunteer"
    exclusive_operations: ["sign up for shifts", "cancel own signup"]
    shared_operations: ["read own volunteer record, shifts, signups, passes"]
  - name: Inspector
    description: "A volunteer acting in the inspection capacity (X-User-ID == Volunteer.id); barred from inspecting items consigned by their linked consignor"
    identity: "entity_backed:Volunteer"
    exclusive_operations: ["POST /items/{id}/inspect"]
    shared_operations: ["read items, inspection records, shifts, own volunteer record"]
  - name: Cashier
    description: "POS operator"
    identity: opaque
    exclusive_operations: ["open transactions", "scan/remove lines", "checkout"]
    shared_operations: ["read items/markdowns/transactions/passes", "void of OPEN transactions"]
