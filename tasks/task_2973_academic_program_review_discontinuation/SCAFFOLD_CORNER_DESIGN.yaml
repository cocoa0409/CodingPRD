              captures: { prog_b: $.data.id }
            - call: "POST /provost/academic-programs/${prog_a}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_a: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_a}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_a}"
              captures: { ss_a: $.data.id }
            - call: "POST /provost/academic-programs/${prog_a}/faculty-appointments"
              payload: { faculty_number: "F-HIST-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
            - call: "POST /provost/self-studies/${ss_a}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_a}"
            - call: "POST /provost/self-studies/${ss_a}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_a: $.data.id }
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Ivo Marek", institution: "Northgate College", specialty_code: "PHIL" }
              as: ReviewCoordinator
              captures: { rev_b: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_a}", reviewer_id: "${rev_a}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_a}/complete"
              payload: {}
              as: ReviewCoordinator
          trigger:
            - call: "POST /provost/review-cycles/${cycle_a}/self-studies"
              payload: { narrative: "A neighbouring chair writes your self-study.", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_b}"
              captures: { e_create: $.data.error_id }
            - call: "PATCH /provost/self-studies/${ss_a}"
              payload: { narrative: "Edited by the wrong chair." }
              as: ProgramChair
              as_user_id: "${prog_b}"
              captures: { e_patch: $.data.error_id }
            - call: "GET /provost/academic-programs/${prog_a}/faculty-appointments"
              payload: { limit: 10, offset: 0 }
              as: ProgramChair
              as_user_id: "${prog_b}"
              captures: { e_read: $.data.error_id }
            - call: "GET /provost/review-cycles/${cycle_a}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_b}"
              captures: { e_cycle: $.data.error_id }
            - call: "POST /provost/reviewer-visits/${visit_a}/reports"
              payload: { recommendation: "CONTINUE", finding_codes: ["F-NONE"], narrative: "I was not there." }
              as: ExternalReviewer
