            - "${n_ok_inst} == ${inst_id} and ${n_ok_unit} == ${u1_id} - both live reads return HTTP 200"

      - name: the_offer_window_closes_one_second_after_it_expires
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OFFER_WINDOW_CLOSED]
          - validations[priority=21]
          - entities.WaitlistApplication.fields.offer_expires_at
          - endpoints.POST_/waitlist-applications/{id}/accept-offer
        distinguishing_aspect: "The window boundary is inclusive and is measured against the logical clock: one second past offer_expires_at the acceptance is refused, and with the clock standing exactly ON offer_expires_at the identical call succeeds - so an implementation using a strict comparison at the boundary, or wall time instead of the clock, is caught."
        test_recipe:
          setup:
            - "One installation with the declared defaults, so offer_response_hours is 72."
            - "One unit A-101, 2 bedrooms, TOWNHOME, JUNIOR_ENLISTED."
            - "One E5 sponsor with three full-time-custody dependents applied with pcs_orders_date 2026-08-25."
            - "The offer run at 2026-08-25T00:00:00Z offered A-101, so the application is OFFERED with offer_expires_at 2026-08-28T00:00:00Z."
            - "The logical clock stands at 2026-08-25T00:00:00Z and the offer has not been answered."
