  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: sweep_expires_offer_and_promotes_next_in_line
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - calculations.waitlist_promotion
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED_OFFER
        distinguishing_aspect: "Ops-run checkpoint: one sweep expires the lapsed OFFER AND immediately offers the next OPEN entry for the same work, both visible in the sweep response's expired_offer_ids and offered_entry_ids."
        test_recipe:
          setup:
            - "Work Wsw with one LENDABLE item; entries E1 (P-S1, OFFERED at T0, expires T0+48h) and E2 (P-S2, OPEN); clock advanced to T0+49h."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
