      - name: corner_request_shape_errors_have_their_own_codes
        claim_type: error_triggerable
        grounds:
          - validations[priority=17]
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_INVALID_INTERVAL]
          - errors[ERR_INVALID_FISCAL_QUARTER]
          - errors[ERR_ENROLLED_EXCEEDS_CONTACTED]
        distinguishing_aspect: "Three shape rules produce three distinct 422 codes: ends_at equal to starts_at on an outreach create gives ERR_INVALID_INTERVAL because the comparison is strictly greater, fiscal_quarter 2026Q5 gives ERR_INVALID_FISCAL_QUARTER, and a HOLD reporting 12 enrolled out of 10 contacted gives ERR_ENROLLED_EXCEEDS_CONTACTED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, advanced to 2026-08-05T12:00:00Z before the hold."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "One PLANNED OutreachEvent on 2026-08-05 from 09:00 to 11:00."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-641", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "JAIL_INREACH", location_name: "County Jail", starts_at: "2026-08-05T09:00:00.000Z", ends_at: "2026-08-05T11:00:00.000Z", underserved_flag: false }
              as: SystemAdmin
              captures: { ev: $.data.id }
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/outreach-events"
              payload: { assigned_representative_id: "${rep_a}", event_type: "RURAL_CLINIC", location_name: "Grange Hall", starts_at: "2026-08-20T09:00:00.000Z", ends_at: "2026-08-20T09:00:00.000Z", underserved_flag: false }
              as: SystemAdmin
              captures: { e_interval: $.data.error_id }
            - call: "POST /cvso/outcome-reports"
              payload: { fiscal_quarter: "2026Q5" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { e_quarter: $.data.error_id }
            - call: "POST /cvso/outreach-events/${ev}/status"
              payload: { action: "HOLD", veterans_contacted: 10, veterans_enrolled: 12 }
