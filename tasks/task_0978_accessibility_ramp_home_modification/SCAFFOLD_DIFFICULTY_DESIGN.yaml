            - call: "POST /cases/${case_id}/assessments"
              payload: { assessor_id: "caps-700", assessor_role: "CAPS", assessment_type: "INITIAL", scheduled_date: "2026-05-01T00:00:00Z", mobility_score: 60, hazard_count: 2 }
