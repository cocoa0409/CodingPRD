# =============================================================================
# task_0575_zipline_park — Aerial Adventure & Zipline Park (Expert)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  575. Aerial Adventure & Zipline Park: course/tour & time-slot capacity,
  weight/age/harness requirement & waiver, guide assignment & briefing, gear
  (harness/helmet) checkout, weather closure & rain-check, group/team-building,
  season pass, incident report

domain_name: zipline-park
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation          # finite time-slot seats competed for, held, released
  secondary_archetype: temporal_windowing      # guide/gear intervals with overlap + buffer semantics
  complexity_layers:
    - optimistic_concurrency                   # OCC on Participant.version for season-pass supersede
    - cascading_side_effects                   # weather close / group cancel propagate 3 levels
    - dual_variant_calculation                 # raincheck credit + season-pass usage
    - derived_field_reconciliation             # slot remaining_capacity, pass usage counters

  entity_topology: flat                        # peer collections joined by foreign keys, no deep URL nesting
  state_machine_shape: cyclic                  # TimeSlot OPEN<->CLOSED, GearItem AVAILABLE<->CHECKED_OUT; Booking branches
  relationship_patterns:
    - one_to_many                              # TimeSlot->Booking, Participant->SeasonPass, Group->Booking
    - many_to_many                             # Guide<->TimeSlot via GuideAssignment, GearItem<->Booking via GearCheckout
    - cross_aggregate                          # Booking preconditions read TimeSlot / Participant / SeasonPass state
  role_model: hierarchical_override            # Operator superset; Customer + Guide own distinct operations
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Course / tour name" }
      - { name: difficulty_level, type: integer, source: input, description: "1..5; minimum guide certification_level required to run it", constraints: "1<=x<=5" }
      - { name: min_weight_kg, type: number, source: input, description: "Inclusive minimum participant weight" }
      - { name: max_weight_kg, type: number, source: input, description: "Inclusive maximum participant weight" }
      - { name: min_age_years, type: integer, source: input, description: "Inclusive minimum participant age in whole years" }
      - { name: base_price_cents, type: integer, source: input, description: "Base per-participant price in cents" }
      - { name: duration_minutes, type: integer, source: input, description: "Tour duration; TimeSlot.end_at = start_at + duration_minutes" }
      - { name: default_capacity, type: integer, source: input, description: "Default seats per TimeSlot when capacity omitted" }
      - { name: max_participants_per_guide, type: integer, source: input, description: "Guide ratio; assigned_capacity = ASSIGNED guide count * this" }
      - { name: weekend_surcharge_pct, type: number, source: input, description: "Fraction added to base when slot start_at falls on Sat/Sun UTC (e.g. 0.15)" }

  - name: TimeSlot
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: start_at, type: datetime, source: input, description: "Scheduled UTC start instant" }
      - { name: end_at, type: datetime, source: computed, description: "start_at + Course.duration_minutes" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity; defaults to Course.default_capacity when omitted" }
      - { name: booked_count, type: integer, source: computed, description: "Count of Bookings on this slot in {CONFIRMED,CHECKED_IN,BRIEFED}" }
      - { name: remaining_capacity, type: integer, source: computed, description: "capacity - booked_count, never negative" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | COMPLETED", default: SCHEDULED, constraints: "SCHEDULED,OPEN,CLOSED,COMPLETED" }
      - { name: closure_reason, type: string, source: system, description: "Weather / operational reason recorded on close; null otherwise" }

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Guide full name" }
      - { name: certification_level, type: integer, source: input, description: "1..5; must be >= Course.difficulty_level to be assigned", constraints: "1<=x<=5" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: weight_kg, type: number, source: input, description: "Participant weight in kilograms" }
      - { name: birthdate, type: datetime, source: input, description: "Date of birth (UTC midnight)" }
      - { name: age_years, type: integer, source: computed, description: "Whole years between birthdate and current logical clock" }
      - { name: waiver_status, type: enum, source: computed, description: "NONE (never signed) | SIGNED (signed and clock<=waiver_expires_at) | EXPIRED (signed but clock>waiver_expires_at)", constraints: "NONE,SIGNED,EXPIRED" }
      - { name: waiver_signed_at, type: datetime, source: system, description: "Clock instant the waiver was signed; null if never" }
      - { name: waiver_expires_at, type: datetime, source: system, description: "waiver_signed_at + WAIVER_VALID_DAYS; null if never" }

  - name: SeasonPass
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PREMIUM", constraints: "STANDARD,PREMIUM" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive window start (UTC)" }
      - { name: valid_until, type: datetime, source: input, description: "Inclusive window end (UTC); must be > valid_from" }
      - { name: total_uses, type: integer, source: input, description: "Entitlement count (number of bookings the pass covers)" }
      - { name: uses_committed, type: integer, source: computed, description: "Count of Bookings with season_pass_id==id in {CONFIRMED,CHECKED_IN,BRIEFED} (provisional variant)" }
      - { name: uses_settled, type: integer, source: computed, description: "Count of Bookings with season_pass_id==id in {COMPLETED} (final variant)" }
      - { name: uses_remaining, type: integer, source: computed, description: "total_uses - uses_committed - uses_settled, never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: ACTIVE, constraints: "ACTIVE,SUPERSEDED" }

  - name: Group
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team-building group name" }
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id" }
      - { name: expected_size, type: integer, source: input, description: "Declared headcount; drives group_discount_pct tier uniformly for member bookings" }
      - { name: organizer_name, type: string, source: input, description: "Organizer contact name (informational, not an FK)" }
      - { name: organizer_participant_id, type: string, source: input, description: "Organizer Participant id (informational reference only, not an FK); may be null" }
      - { name: member_count, type: integer, source: computed, description: "Count of Bookings with group_id==id in {CONFIRMED,CHECKED_IN,BRIEFED,COMPLETED}" }
      - { name: insurance_total_cents, type: integer, source: computed, description: "Sum over active member Bookings of round_half_up(Course.base_price_cents*INSURANCE_RATE); round-per-member-then-sum" }
      - { name: status, type: enum, source: system, description: "OPEN | CANCELLED", default: OPEN, constraints: "OPEN,CANCELLED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: group_id, type: string, source: input, description: "FK -> Group.id; null for individual bookings" }
      - { name: season_pass_id, type: string, source: system, description: "FK -> SeasonPass.id; set when use_season_pass and a usable pass exists, else null" }
      - { name: use_season_pass, type: boolean, source: input, description: "Client intent to consume a season pass", default: false }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CHECKED_IN | BRIEFED | COMPLETED | CANCELLED | RAINCHECKED | NO_SHOW | REDEEMED", default: CONFIRMED, constraints: "CONFIRMED,CHECKED_IN,BRIEFED,COMPLETED,CANCELLED,RAINCHECKED,NO_SHOW,REDEEMED" }
      - { name: price_cents, type: integer, source: computed, description: "Charged price from booking_price calc at creation; 0 when a season pass covers it" }
      - { name: raincheck_credit_cents, type: integer, source: computed, description: "Credit stamped on exit via weather/voluntary paths per cancellation_credit calc; 0 otherwise", default: 0 }
      - { name: redeemed_from_booking_id, type: string, source: system, description: "Origin RAINCHECKED booking id when this booking was created by a redeem (informational, not an FK); null otherwise" }

  - name: GuideAssignment
    parent: null
    common_fields: true
    fields:
      - { name: guide_id, type: string, source: input, description: "FK -> Guide.id" }
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CANCELLED", default: ASSIGNED, constraints: "ASSIGNED,CANCELLED" }

  - name: GearItem
    parent: null
    common_fields: true
    fields:
      - { name: gear_type, type: enum, source: input, description: "HARNESS | HELMET", constraints: "HARNESS,HELMET" }
      - { name: size, type: enum, source: input, description: "S | M | L", constraints: "S,M,L" }
      - { name: status, type: enum, source: computed, description: "CHECKED_OUT while the item has >=1 GearCheckout in status OUT, else AVAILABLE", constraints: "AVAILABLE,CHECKED_OUT" }

  - name: GearCheckout
    parent: null
    common_fields: true
    fields:
      - { name: gear_item_id, type: string, source: input, description: "FK -> GearItem.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: window_start, type: datetime, source: computed, description: "TimeSlot.start_at of the booking's slot" }
      - { name: window_end, type: datetime, source: computed, description: "TimeSlot.end_at + CLEANING_BUFFER_MINUTES (CLEANING_BUFFER_MINUTES = 30) of the booking's slot" }
      - { name: checked_out_at, type: datetime, source: system, description: "Clock instant of checkout" }
      - { name: returned_at, type: datetime, source: system, description: "Clock instant of return; null while OUT" }
      - { name: status, type: enum, source: system, description: "OUT | RETURNED", default: OUT, constraints: "OUT,RETURNED" }

  - name: IncidentReport
    parent: Booking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE", constraints: "MINOR,MODERATE,SEVERE" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: reported_by_guide_id, type: string, source: input, description: "Guide id filing the report (informational, not an FK)" }
      - { name: occurred_at, type: datetime, source: system, description: "Clock instant recorded at filing" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TimeSlot
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /time-slots/{id}/open"
        actor: Operator
        preconditions:
          - "At least one GuideAssignment on this slot in status ASSIGNED (ERR_NO_GUIDE_ASSIGNED)"
        side_effects: []
      - from: CLOSED
        to: OPEN
        trigger: "POST /time-slots/{id}/open (reopen after weather clears)"
        actor: Operator
        preconditions:
          - "At least one GuideAssignment on this slot in status ASSIGNED (ERR_NO_GUIDE_ASSIGNED)"
        side_effects:
          - "closure_reason cleared to null"
        note: "CLOSED->OPEN is the cycle edge; already-rainchecked bookings stay RAINCHECKED"
      - from: [SCHEDULED, OPEN]
        to: CLOSED
        trigger: "POST /time-slots/{id}/close (weather closure)"
        actor: Operator
        preconditions: []
        side_effects:
          - "closure_reason set from input reason"
          - "CASCADE L1: every Booking on this slot in {CONFIRMED,CHECKED_IN,BRIEFED} -> RAINCHECKED"
          - "each RAINCHECKED booking: raincheck_credit_cents = price_cents (weather variant of cancellation_credit)"
          - "CASCADE L2: each such booking's GearCheckouts in OUT -> RETURNED (returned_at=clock)"
          - "CASCADE L3: each returned GearCheckout's GearItem -> AVAILABLE"
          - "seats released: booked_count / remaining_capacity recomputed"
          - "season pass release: rainchecked bookings leave uses_committed"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /time-slots/{id}/complete"
        actor: Operator
        preconditions: []
        side_effects:
          - "every Booking on this slot in {CONFIRMED,CHECKED_IN,BRIEFED} -> NO_SHOW"
          - "each NO_SHOW booking: GearCheckouts OUT -> RETURNED, GearItem -> AVAILABLE; raincheck_credit_cents stays 0"
          - "seats and season pass commitments released for NO_SHOW bookings"

  - entity: Booking
    field: status
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, REDEEMED]
    shape: branching
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{id}/check-in"
        actor: "Operator or Guide"
        preconditions:
          - "TimeSlot.status == OPEN (cross-entity Booking->TimeSlot; ERR_SLOT_NOT_OPEN)"
          - "Participant.waiver_status == SIGNED (cross-entity Booking->Participant; ERR_WAIVER_REQUIRED)"
        side_effects: []
      - from: CHECKED_IN
        to: BRIEFED
        trigger: "POST /bookings/{id}/brief"
        actor: "Operator or Guide"
        preconditions:
          - "TimeSlot has >=1 ASSIGNED GuideAssignment (ERR_NO_GUIDE_ASSIGNED)"
        side_effects: []
      - from: BRIEFED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: "Operator or Guide"
        preconditions:
          - "TimeSlot.status == OPEN (ERR_SLOT_NOT_OPEN)"
        side_effects:
          - "if season_pass_id set: booking leaves uses_committed and enters uses_settled"
          - "GearCheckouts OUT -> RETURNED, GearItem -> AVAILABLE"
      - from: [CONFIRMED, CHECKED_IN, BRIEFED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel (voluntary) or system (Group cancel)"
        actor: "Operator or Customer or system"
        preconditions: []
        side_effects:
          - "cancellation_credit (voluntary variant): raincheck_credit_cents = price_cents if (start_at - clock) >= VOLUNTARY_FULL_REFUND_HOURS else round_half_up(price_cents*VOLUNTARY_LATE_REFUND_PCT)"
          - "CASCADE: GearCheckouts OUT -> RETURNED -> GearItem AVAILABLE"
          - "seat released (booked_count recomputed); season pass commitment released"
      - from: [CONFIRMED, CHECKED_IN, BRIEFED]
        to: RAINCHECKED
        trigger: "system (TimeSlot close, weather)"
        actor: system
        preconditions: []
        side_effects:
          - "raincheck_credit_cents = price_cents (weather variant)"
          - "GearCheckouts OUT -> RETURNED -> GearItem AVAILABLE; seat + pass released"
      - from: [CONFIRMED, CHECKED_IN, BRIEFED]
        to: NO_SHOW
        trigger: "system (TimeSlot complete)"
        actor: system
        preconditions: []
        side_effects:
          - "raincheck_credit_cents stays 0; GearCheckouts returned; seat + pass released"
      - from: RAINCHECKED
        to: REDEEMED
        trigger: "POST /bookings/{id}/redeem"
        actor: "Operator or Customer"
        preconditions:
          - "target TimeSlot (input) is SCHEDULED or OPEN with remaining_capacity >= 1 (ERR_SLOT_FULL)"
          - "participant still eligible on target slot's course (weight/age)"
        side_effects:
          - "creates a NEW Booking in target slot, CONFIRMED, redeemed_from_booking_id = this booking id"
          - "new booking price_cents = max(0, booking_price(target) - this.raincheck_credit_cents)"

  - entity: GearCheckout
    field: status
    initial_state: OUT
    terminal_states: [RETURNED]
    shape: linear
    note: "GearItem.status is a derived reflection: CHECKED_OUT while any of its checkouts is OUT, else AVAILABLE. A GearItem may hold several OUT checkouts as long as their [window_start, window_end) windows are pairwise non-overlapping."
    transitions:
      - from: OUT
        to: RETURNED
        trigger: "POST /gear-checkouts/{id}/return, or system (booking cancel/raincheck/no-show/complete)"
        actor: "Operator or Guide or system"
        preconditions: []
        side_effects:
          - "returned_at = clock"
          - "GearItem.status recomputes to AVAILABLE once no OUT checkouts remain"

  - entity: SeasonPass
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer SeasonPass created for the same Participant supersedes prior ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Group
    field: status
    initial_state: OPEN
    terminal_states: [CANCELLED]
    shape: linear
    transitions:
      - from: OPEN
        to: CANCELLED
        trigger: "POST /groups/{id}/cancel"
        actor: "Operator or Customer"
        preconditions: []
        side_effects:
          - "CASCADE L1: every member Booking (group_id==id) in {CONFIRMED,CHECKED_IN,BRIEFED} -> CANCELLED"
          - "CASCADE L2: each cancelled booking's GearCheckouts OUT -> RETURNED"
          - "CASCADE L3: each returned GearCheckout's GearItem -> AVAILABLE"
          - "member cancellations apply cancellation_credit voluntary variant per booking; seats + pass released"

  - entity: GuideAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [CANCELLED]
    shape: linear
    transitions:
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /guide-assignments/{id}/cancel"
        actor: Operator
        preconditions:
          - "remaining assigned_capacity after removal (ASSIGNED-count-minus-one * Course.max_participants_per_guide) >= slot.booked_count (ERR_UNDERSTAFFED)"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: season-pass-create-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /participants/{id}/season-passes"
    occ_field: "expected_participant_version"
    description: |
      Creating a SeasonPass against a Participant whose version has advanced
      since the client last observed it is rejected. A newly created pass
      legitimately supersedes the participant's prior ACTIVE pass; if another
      writer has already created a pass (advancing the participant version and
      superseding the prior), the current writer's view is stale and the create
      is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: slot_remaining_capacity
    trigger: "Booking create/cancel/raincheck/no-show/complete; TimeSlot close/complete"
    algorithm: aggregation
    formula: |
      booked_count = count(Booking b where b.time_slot_id == slot.id
                           AND b.status IN {CONFIRMED, CHECKED_IN, BRIEFED})
      remaining_capacity = max(0, capacity - booked_count)
    input_set: "Bookings on the slot whose status is one of the three active states; COMPLETED/CANCELLED/RAINCHECKED/NO_SHOW/REDEEMED excluded"
    precision: "integer counts"

  - name: booking_price
    trigger: "POST /bookings (and recomputed for the new booking on redeem)"
    algorithm: tiered_pricing
    formula: |
      base       = Course.base_price_cents
      is_weekend = weekday(TimeSlot.start_at, UTC) in {Saturday, Sunday}
      weekend_amt= is_weekend ? base * Course.weekend_surcharge_pct : 0
      subtotal   = base + weekend_amt
      # group_discount_pct is a tier selection over Group.expected_size (0 when no group):
      #   size 1..3 -> 0.00 ; 4..7 -> 0.10 ; 8+ -> 0.20
      gpct       = group_id ? tier(Group.expected_size) : 0.00
      discounted = subtotal * (1 - gpct)
      if use_season_pass AND pass usable (ACTIVE, in window, uses_remaining>0):
        price_cents = 0        # pass covers; season_pass_id set
      else:
        price_cents = round_half_up(discounted)   # single final rounding
    input_set: "One Booking at creation; Group.expected_size if grouped; SeasonPass if use_season_pass"
    constants:
      GROUP_TIER_1: "1..3 -> 0.00"
      GROUP_TIER_2: "4..7 -> 0.10"
      GROUP_TIER_3: "8+ -> 0.20"
    precision: "round_half_up to whole cents, applied once at the end"
    variants:
      - name: weekday
        when: "slot start_at is Mon..Fri UTC"
        difference: "no weekend surcharge"
      - name: weekend
        when: "slot start_at is Sat/Sun UTC"
        difference: "adds base*weekend_surcharge_pct before discount"

  - name: group_insurance_total
    trigger: "read of Group; recomputed on member Booking create/cancel/raincheck/no-show"
    algorithm: aggregation
    formula: |
      per_member(b) = round_half_up(Course.base_price_cents * INSURANCE_RATE)
      insurance_total_cents = sum over member bookings b of per_member(b)
      # ORDER PINNED: round each member's fee to whole cents FIRST, then sum.
      # sum-then-round is explicitly NOT used and yields a different total.
    input_set: "Member Bookings with group_id==group.id in {CONFIRMED,CHECKED_IN,BRIEFED,COMPLETED}"
    constants:
      INSURANCE_RATE: 0.0745
    precision: "round_half_up per member, then integer sum (round-then-sum, not sum-then-round)"

  - name: cancellation_credit
    trigger: "Booking exit to RAINCHECKED (weather) or CANCELLED (voluntary)"
    algorithm: threshold
    formula: |
      lead_hours = (TimeSlot.start_at - clock) in hours
      WEATHER variant   (-> RAINCHECKED): credit = price_cents            # full, unconditional
      VOLUNTARY variant (-> CANCELLED):
        credit = price_cents                              if lead_hours >= VOLUNTARY_FULL_REFUND_HOURS
        credit = round_half_up(price_cents * VOLUNTARY_LATE_REFUND_PCT)   otherwise
      NO_SHOW: credit = 0
    input_set: "The single exiting Booking; its price_cents and slot start_at vs clock"
    constants:
      VOLUNTARY_FULL_REFUND_HOURS: 24
      VOLUNTARY_LATE_REFUND_PCT: 0.5
    precision: "round_half_up to whole cents"
    variants:
      - name: weather_full
        when: "exit caused by TimeSlot weather close"
        difference: "always 100% of price_cents regardless of lead time"
      - name: voluntary_late
        when: "customer cancel with lead_hours < 24"
        difference: "50% of price_cents"

  - name: season_pass_usage
    trigger: "Booking create/complete/cancel/raincheck/no-show referencing a pass"
    algorithm: aggregation
    formula: |
      uses_committed = count(Booking where season_pass_id==pass.id AND status IN {CONFIRMED,CHECKED_IN,BRIEFED})
      uses_settled   = count(Booking where season_pass_id==pass.id AND status == COMPLETED)
      uses_remaining = max(0, total_uses - uses_committed - uses_settled)
    input_set: "Bookings pinned to the pass; provisional variant counts active holds, final variant counts only COMPLETED"
    precision: "integer counts"
    variants:
      - name: provisional
        when: "gating a new booking (POST /bookings with use_season_pass)"
        difference: "uses_remaining subtracts uses_committed (active holds) as well as uses_settled"
      - name: settled
        when: "reporting actually-consumed entitlements"
        difference: "counts only COMPLETED bookings (uses_settled); active holds excluded"

  - name: guide_ratio_capacity
    trigger: "POST /bookings; POST /guide-assignments/{id}/cancel"
    algorithm: threshold
    formula: |
      assigned_capacity = count(ASSIGNED GuideAssignment on slot) * Course.max_participants_per_guide
      # booking gate: booked_count (after adding the new booking) must be <= min(slot.capacity, assigned_capacity)
      # assignment-cancel gate: (ASSIGNED_count - 1) * max_participants_per_guide >= slot.booked_count
    input_set: "ASSIGNED GuideAssignments on the slot and the slot's booked_count"
    constants: {}
    precision: "integer counts; boundary is inclusive (>=)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/FK resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric types, valid_until>valid_from"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: auth
    check: "Ownership: a Customer may only sign the waiver of / redeem / cancel a Booking of the Participant equal to X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /participants/{id}/waiver, POST /bookings/{id}/redeem, POST /bookings/{id}/cancel when acting as Customer"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the transition (includes slot OPEN gates and raincheck redeemability)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: state
    check: "TimeSlot.status must be OPEN for check-in / complete"
    error_id: ERR_SLOT_NOT_OPEN
    http_status: 409
    applies_to: "POST /bookings/{id}/check-in, POST /bookings/{id}/complete"

  - priority: 7
    category: business_safety
    check: "Participant weight within [Course.min_weight_kg, Course.max_weight_kg] inclusive"
    error_id: ERR_WEIGHT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/redeem"

  - priority: 7
    category: business_safety
    check: "Participant age_years >= Course.min_age_years"
    error_id: ERR_AGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /bookings, POST /bookings/{id}/redeem"

  - priority: 7
    category: business_safety
    check: "Participant.waiver_status == SIGNED for check-in"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{id}/check-in"

  - priority: 7
    category: business_safety
    check: "Guide.certification_level >= Course.difficulty_level to assign"
    error_id: ERR_GUIDE_UNCERTIFIED
    http_status: 422
    applies_to: "POST /guide-assignments"

  - priority: 8
    category: business_constraint
    check: "Guide not already ASSIGNED to another slot whose [start_at,end_at) overlaps (adjacency allowed)"
    error_id: ERR_GUIDE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /guide-assignments"

  - priority: 8
    category: business_constraint
    check: "No existing OUT GearCheckout of this item whose window [start,end+CLEANING_BUFFER_MINUTES) overlaps the new booking's window [start,end+CLEANING_BUFFER_MINUTES) (half-open; touching endpoints do not overlap)"
    error_id: ERR_GEAR_UNAVAILABLE
    http_status: 409
    applies_to: "POST /gear-checkouts"

  - priority: 8
    category: business_constraint
    check: "Briefing/open requires >=1 ASSIGNED GuideAssignment on the slot"
    error_id: ERR_NO_GUIDE_ASSIGNED
    http_status: 409
    applies_to: "POST /bookings/{id}/brief, POST /time-slots/{id}/open"

  - priority: 8
    category: business_constraint
    check: "Assignment cancel must not drop assigned_capacity below slot.booked_count"
    error_id: ERR_UNDERSTAFFED
    http_status: 409
    applies_to: "POST /guide-assignments/{id}/cancel"

  - priority: 8
    category: business_constraint
    check: "A grouped booking's group.time_slot_id must equal the booking's time_slot_id"
    error_id: ERR_GROUP_SLOT_MISMATCH
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 9
    category: business_fiscal
    check: "TimeSlot.remaining_capacity >= 1 and booked_count+1 <= min(capacity, assigned_capacity)"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/redeem"

  - priority: 9
    category: business_fiscal
    check: "SeasonPass usable: ACTIVE and valid_from<=clock<=valid_until"
    error_id: ERR_SEASON_PASS_INVALID
    http_status: 422
    applies_to: "POST /bookings when use_season_pass"

  - priority: 9
    category: business_fiscal
    check: "SeasonPass provisional uses_remaining >= 1"
    error_id: ERR_SEASON_PASS_EXHAUSTED
    http_status: 422
    applies_to: "POST /bookings when use_season_pass"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_participant_version matches Participant.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /participants/{id}/season-passes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Operator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601; recomputes age_years, waiver_status, pass validity on read"]

  # --- Course ---
  - method: POST
    path: "/courses"
    description: "Create a course/tour"
    roles: [Operator]
    code: 201
    input: [name, difficulty_level, min_weight_kg, max_weight_kg, min_age_years, base_price_cents, duration_minutes, default_capacity, max_participants_per_guide, weekend_surcharge_pct]
    output: Course
    side_effects: []
  - method: GET
    path: "/courses/{id}"
    description: "Get a course"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/courses/{id}/time-slots"
    description: "List time slots of a course (reverse-reach TimeSlot.course_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: TimeSlot[]
    side_effects: []

  # --- TimeSlot ---
  - method: POST
    path: "/time-slots"
    description: "Create a time slot for a course"
    roles: [Operator]
    code: 201
    input: [course_id, start_at, "capacity?"]
    output: TimeSlot
    side_effects: ["status=SCHEDULED; end_at=start_at+duration; capacity defaults to course.default_capacity"]
  - method: GET
    path: "/time-slots/{id}"
    description: "Get a time slot"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: TimeSlot
    side_effects: []
  - method: POST
    path: "/time-slots/{id}/open"
    description: "Open a slot (SCHEDULED->OPEN or reopen CLOSED->OPEN)"
    roles: [Operator]
    code: 200
    input: []
    output: TimeSlot
    side_effects: ["status->OPEN; requires >=1 ASSIGNED guide; clears closure_reason on reopen"]
  - method: POST
    path: "/time-slots/{id}/close"
    description: "Weather-close a slot; cascades raincheck of active bookings"
    roles: [Operator]
    code: 200
    input: ["reason?"]
    output: TimeSlot
    side_effects: ["status->CLOSED; active bookings->RAINCHECKED with full credit; gear returned; seats/pass released"]
  - method: POST
    path: "/time-slots/{id}/complete"
    description: "Complete a slot; leftover active bookings become NO_SHOW"
    roles: [Operator]
    code: 200
    input: []
    output: TimeSlot
    side_effects: ["status->COMPLETED; active bookings->NO_SHOW; gear returned; seats/pass released"]
  - method: GET
    path: "/time-slots/{id}/groups"
    description: "List groups on a slot (reverse-reach Group.time_slot_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Group[]
    side_effects: []

  # --- Guide ---
  - method: POST
    path: "/guides"
    description: "Create a guide"
    roles: [Operator]
    code: 201
    input: [name, certification_level]
    output: Guide
    side_effects: []
  - method: GET
    path: "/guides/{id}"
    description: "Get a guide"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Guide
    side_effects: []

  # --- GuideAssignment ---
  - method: POST
    path: "/guide-assignments"
    description: "Assign a guide to a slot (temporal-overlap + certification checked)"
    roles: [Operator]
    code: 201
    input: [guide_id, time_slot_id]
    output: GuideAssignment
    side_effects: ["status=ASSIGNED"]
  - method: GET
    path: "/guide-assignments/{id}"
    description: "Get a guide assignment"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: GuideAssignment
    side_effects: []
  - method: GET
    path: "/guide-assignments"
    description: "List guide assignments (reverse-reach GuideAssignment.guide_id and .time_slot_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: ["guide_id?", "time_slot_id?"]
    output: GuideAssignment[]
    side_effects: []
  - method: POST
    path: "/guide-assignments/{id}/cancel"
    description: "Cancel a guide assignment (blocked if it would understaff the slot)"
    roles: [Operator]
    code: 200
    input: []
    output: GuideAssignment
    side_effects: ["status->CANCELLED"]

  # --- Participant ---
  - method: POST
    path: "/participants"
    description: "Register a participant"
    roles: [Operator, Customer]
    code: 201
    input: [full_name, weight_kg, birthdate]
    output: Participant
    side_effects: ["waiver_status=NONE; version=1"]
  - method: GET
    path: "/participants/{id}"
    description: "Get a participant"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/participants/{id}/waiver"
    description: "Sign/refresh the participant waiver"
    roles: [Operator, Customer]
    code: 200
    input: [signature_name]
    output: Participant
    side_effects: ["waiver_signed_at=clock; waiver_expires_at=clock+WAIVER_VALID_DAYS (WAIVER_VALID_DAYS = 365); waiver_status=SIGNED; version incremented"]
  - method: POST
    path: "/participants/{id}/season-passes"
    description: "Issue a season pass to a participant (supersedes prior ACTIVE; OCC on participant version)"
    roles: [Operator]
    code: 201
    input: [tier, valid_from, valid_until, total_uses, expected_participant_version]
    output: SeasonPass
    side_effects: ["status=ACTIVE; prior ACTIVE pass->SUPERSEDED; increments Participant.version by 1"]
  - method: GET
    path: "/participants/{id}/season-passes"
    description: "List a participant's season passes (reverse-reach SeasonPass.participant_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: SeasonPass[]
    side_effects: []

  # --- GearItem ---
  - method: POST
    path: "/gear-items"
    description: "Register a gear item (harness/helmet)"
    roles: [Operator]
    code: 201
    input: [gear_type, size]
    output: GearItem
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/gear-items/{id}"
    description: "Get a gear item"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: GearItem
    side_effects: []

  # --- Group ---
  - method: POST
    path: "/groups"
    description: "Create a team-building group on a slot"
    roles: [Operator, Customer]
    code: 201
    input: [name, time_slot_id, expected_size, organizer_name, "organizer_participant_id?"]
    output: Group
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/groups/{id}"
    description: "Get a group (member_count, insurance_total_cents computed)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Group
    side_effects: []
  - method: POST
    path: "/groups/{id}/cancel"
    description: "Cancel a group; cascades cancel of member bookings"
    roles: [Operator, Customer]
    code: 200
    input: []
    output: Group
    side_effects: ["status->CANCELLED; member bookings->CANCELLED; gear returned; seats/pass released"]

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "Create a booking (holds a seat; price + eligibility computed)"
    roles: [Operator, Customer]
    code: 201
    input: [time_slot_id, participant_id, "group_id?", "use_season_pass?"]
    output: Booking
    side_effects: ["status=CONFIRMED; price_cents computed; season_pass_id set if pass consumed; seat held"]
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings (reverse-reach Booking.time_slot_id/participant_id/group_id/season_pass_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: ["time_slot_id?", "participant_id?", "group_id?", "season_pass_id?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Check a booking in (slot OPEN + waiver required)"
    roles: [Operator, Guide]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CHECKED_IN"]
  - method: POST
    path: "/bookings/{id}/brief"
    description: "Mark a booking briefed (requires assigned guide)"
    roles: [Operator, Guide]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->BRIEFED"]
  - method: POST
    path: "/bookings/{id}/complete"
    description: "Complete a booking (slot OPEN)"
    roles: [Operator, Guide]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->COMPLETED; pass committed->settled; gear returned"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Voluntarily cancel a booking (credit per lead time)"
    roles: [Operator, Customer]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CANCELLED; raincheck_credit_cents set; gear returned; seat/pass released"]
  - method: POST
    path: "/bookings/{id}/redeem"
    description: "Redeem a RAINCHECKED booking into a target slot"
    roles: [Operator, Customer]
    code: 201
    input: [time_slot_id]
    output: Booking
    side_effects: ["this booking->REDEEMED; creates new CONFIRMED booking with credit applied; returns the new booking"]
  - method: GET
    path: "/bookings/{id}/incident-reports"
    description: "List incident reports for a booking (reverse-reach IncidentReport.booking_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: IncidentReport[]
    side_effects: []

  # --- GearCheckout ---
  - method: POST
    path: "/gear-checkouts"
    description: "Check gear out to a booking (item AVAILABLE + no window overlap)"
    roles: [Operator, Guide]
    code: 201
    input: [gear_item_id, booking_id]
    output: GearCheckout
    side_effects: ["status=OUT; GearItem->CHECKED_OUT; window from booking slot + cleaning buffer"]
  - method: GET
    path: "/gear-checkouts/{id}"
    description: "Get a gear checkout"
    roles: [Operator, Customer, Guide]
    code: 200
    input: []
    output: GearCheckout
    side_effects: []
  - method: GET
    path: "/gear-checkouts"
    description: "List gear checkouts (reverse-reach GearCheckout.gear_item_id and .booking_id)"
    roles: [Operator, Customer, Guide]
    code: 200
    input: ["gear_item_id?", "booking_id?"]
    output: GearCheckout[]
    side_effects: []
  - method: POST
    path: "/gear-checkouts/{id}/return"
    description: "Return checked-out gear"
    roles: [Operator, Guide]
    code: 200
    input: []
    output: GearCheckout
    side_effects: ["status->RETURNED; returned_at=clock; GearItem->AVAILABLE"]

  # --- IncidentReport ---
  - method: POST
    path: "/incident-reports"
    description: "File an incident report against a booking"
    roles: [Operator, Guide]
    code: 201
    input: [booking_id, severity, description, reported_by_guide_id]
    output: IncidentReport
    side_effects: ["occurred_at=clock; append-only"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Customer acting on a Participant/Booking they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or FK resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum/type, or valid_until<=valid_from" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state (incl. redeem of non-RAINCHECKED)" }
  - { id: ERR_SLOT_NOT_OPEN, http: 409, condition: "Operation requires TimeSlot.status==OPEN (check-in / complete)" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "remaining_capacity==0 or booked_count+1 would exceed min(capacity, assigned_capacity)" }
  - { id: ERR_WEIGHT_OUT_OF_RANGE, http: 422, condition: "Participant weight outside [Course.min_weight_kg, Course.max_weight_kg]" }
  - { id: ERR_AGE_BELOW_MINIMUM, http: 422, condition: "Participant age_years < Course.min_age_years" }
  - { id: ERR_WAIVER_REQUIRED, http: 422, condition: "Participant waiver_status != SIGNED at check-in" }
  - { id: ERR_GUIDE_UNCERTIFIED, http: 422, condition: "Guide.certification_level < Course.difficulty_level on assignment" }
  - { id: ERR_GUIDE_DOUBLE_BOOKED, http: 409, condition: "Guide already ASSIGNED to a time-overlapping slot ([start,end) half-open; adjacency allowed)" }
  - { id: ERR_GEAR_UNAVAILABLE, http: 409, condition: "GearItem not AVAILABLE or its [start,end+buffer) window overlaps another OUT checkout" }
  - { id: ERR_NO_GUIDE_ASSIGNED, http: 409, condition: "Open/brief requires >=1 ASSIGNED GuideAssignment on the slot" }
  - { id: ERR_UNDERSTAFFED, http: 409, condition: "Cancelling the assignment would drop assigned_capacity below slot.booked_count" }
  - { id: ERR_GROUP_SLOT_MISMATCH, http: 422, condition: "Booking group_id's time_slot_id differs from the booking's time_slot_id" }
  - { id: ERR_SEASON_PASS_INVALID, http: 422, condition: "Pass not ACTIVE or clock outside [valid_from, valid_until]" }
  - { id: ERR_SEASON_PASS_EXHAUSTED, http: 422, condition: "Pass provisional uses_remaining < 1" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_participant_version != Participant.version on season-pass create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Park operator/admin; superset authority over configuration, scheduling, staffing, gear, passes, and the booking flow."
    identity: "opaque"
    exclusive_operations:
      - "POST /courses"
      - "POST /time-slots"
      - "POST /time-slots/{id}/open"
      - "POST /time-slots/{id}/close"
      - "POST /time-slots/{id}/complete"
      - "POST /guides"
      - "POST /guide-assignments"
      - "POST /guide-assignments/{id}/cancel"
      - "POST /participants/{id}/season-passes"
      - "POST /gear-items"
    shared_operations:
      - "POST /participants and /participants/{id}/waiver"
      - "POST /groups and /groups/{id}/cancel"
      - "POST /bookings, cancel, redeem"
      - "POST /bookings/{id}/check-in, brief, complete"
      - "POST /gear-checkouts and return"
      - "POST /incident-reports"
      - "all GET reads"

  - name: Customer
    description: "A registered visitor acting as a Participant; books, signs own waiver, redeems own rain-checks."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /participants, POST /participants/{id}/waiver (own; X-User-ID==participant id)"
      - "POST /groups, POST /groups/{id}/cancel"
      - "POST /bookings, POST /bookings/{id}/cancel (own), POST /bookings/{id}/redeem (own)"
      - "all GET reads"

  - name: Guide
    description: "Field staff who run tours; check participants in, brief, complete, handle gear, and file incidents."
    identity: "entity_backed:Guide"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings/{id}/check-in, brief, complete"
      - "POST /gear-checkouts, POST /gear-checkouts/{id}/return"
      - "POST /incident-reports"
      - "all GET reads"
