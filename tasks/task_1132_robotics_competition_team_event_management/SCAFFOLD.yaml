# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in endpoint.roles" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "FrcEvent id does not resolve" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "Team id does not resolve within event" }
  - { id: ERR_PERSON_NOT_FOUND, http: 404, condition: "Person id does not resolve" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "ScreeningRecord id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "PartOrder id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "RobotInspection id does not resolve" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "ComplianceViolation id does not resolve" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "Match id does not resolve" }
  - { id: ERR_ALLIANCE_NOT_FOUND, http: 404, condition: "Alliance id does not resolve" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "Award id does not resolve" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "InterviewSlot or QueueSlot id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "TravelBooking id does not resolve" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "BuildSeasonMilestone id does not resolve" }
  - { id: ERR_RESET_LOG_NOT_FOUND, http: 404, condition: "FieldResetLog id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request payload failed schema validation (missing required field, wrong type, invalid enum value)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in the from-state for the requested transition" }
  - { id: ERR_EVENT_WRONG_STATUS, http: 409, condition: "FrcEvent.status does not permit the operation" }
  - { id: ERR_EVENT_FROZEN, http: 409, condition: "FrcEvent.posture == FROZEN blocks the operation; or RESTRICTED where OPEN is required" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 403, condition: "Segregation-of-duties: same user attempted both create/own and approve/resolve/inspect" }
  - { id: ERR_RECORD_NOT_PENDING, http: 409, condition: "ScreeningRecord.decision != PENDING at decision time" }
  - { id: ERR_MENTOR_NOT_CLEARED, http: 422, condition: "Team lacks a CLEARED MENTOR when one is required" }
  - { id: ERR_INSPECTOR_NOT_CLEARED, http: 422, condition: "Inspector not CLEARED or wrong role_kind" }
  - { id: ERR_INSPECTOR_SELF, http: 422, condition: "Inspector is on the team being inspected" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Confirm would push registered_team_count above team_capacity" }
  - { id: ERR_TOO_FEW_TEAMS, http: 409, condition: "Fewer than 2 confirmed teams at open-build-season; or fewer than MIN_TEAMS_FOR_MATCHES at start-matches" }
  - { id: ERR_STOP_BUILD_PASSED, http: 422, condition: "PartOrder submit attempted after STOP_BUILD milestone" }
  - { id: ERR_NOT_BUILD_SEASON, http: 409, condition: "FrcEvent.status != BUILD_SEASON at part-order submit" }
  - { id: ERR_ROBOT_OVERWEIGHT, http: 422, condition: "RobotInspection.weight_kg > MAX_ROBOT_WEIGHT_KG (56.7)" }
  - { id: ERR_FRAME_TOO_LARGE, http: 422, condition: "frame_perimeter_cm > MAX_FRAME_PERIMETER_CM (304)" }
  - { id: ERR_BUMPERS_NONCOMPLIANT, http: 422, condition: "bumper_compliant == false at pass attempt" }
  - { id: ERR_INSPECTION_INCOMPLETE, http: 409, condition: "Not all CONFIRMED teams have robot_inspection_status IN {PASSED, WAIVED} at start-matches" }
  - { id: ERR_MILESTONE_MISSING, http: 409, condition: "Required BuildSeasonMilestone kind is missing" }
  - { id: ERR_MILESTONE_NOT_PASSED, http: 409, condition: "Required BuildSeasonMilestone is not in PASSED state" }
  - { id: ERR_MATCHES_OPEN, http: 409, condition: "open-alliance-selection called while QUALIFICATION matches remain non-final" }
  - { id: ERR_SELECTION_INCOMPLETE, http: 409, condition: "close-alliance-selection called while selection round not COMPLETE" }
  - { id: ERR_AWARDS_PENDING, http: 409, condition: "close-event called while awards not PRESENTED" }
  - { id: ERR_NO_GROUNDS, http: 409, condition: "Disqualify requires at least one open CRITICAL violation" }
  - { id: ERR_NO_REPLAY_GROUNDS, http: 409, condition: "Replay requires at least one MATCH_REVIEW violation" }
  - { id: ERR_NO_ELIGIBLE_TEAMS, http: 409, condition: "Award decide: no team satisfies the eligibility filter" }
  - { id: ERR_INTERVIEW_REQUIRED, http: 422, condition: "Award requires_interview but no COMPLETED interview slot" }
  - { id: ERR_PICK_INELIGIBLE, http: 422, condition: "Alliance pick target is captain/already picked/not CONFIRMED" }
  - { id: ERR_OUT_OF_TURN, http: 409, condition: "Captain acted out of turn (current_captain_team_id mismatch)" }
  - { id: ERR_INSUFFICIENT_CAPTAINS, http: 409, condition: "Fewer than ALLIANCE_COUNT eligible captains at seed time" }
  - { id: ERR_INCOMPLETE_QUEUE, http: 409, condition: "Match queue transition without all 6 QueueSlot rows" }
  - { id: ERR_TEAM_NOT_AT_FIELD, http: 409, condition: "Take-field attempted while any QueueSlot not AT_FIELD" }
  - { id: ERR_MATCH_NOT_QUEUED, http: 409, condition: "Mark-at-field attempted while Match not QUEUED" }
  - { id: ERR_FIELD_NOT_RESET, http: 409, condition: "Take-field on a field whose prior FieldResetLog is still IN_PROGRESS" }
  - { id: ERR_FIELD_INTERVAL_VIOLATION, http: 422, condition: "Match schedule would violate FIELD_RESET_MIN_SECONDS between consecutive matches on the same field" }
  - { id: ERR_JUDGE_DOUBLE_BOOKED, http: 409, condition: "InterviewSlot temporal overlap for the same judge" }
  - { id: ERR_SCORE_BREAKDOWN_MISSING, http: 409, condition: "Match score transition without both RED and BLUE breakdowns" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "PartOrder would push team beyond build-season budget cap" }
  - { id: ERR_REIMBURSEMENT_CAP_EXCEEDED, http: 422, condition: "TravelBooking cost exceeds mode cap (validation-time check; distinct from the calculation-time cap)" }
  - { id: ERR_NOT_QUALIFIED, http: 409, condition: "TravelBooking approve requires Team.qualified_for_championship == true" }
  - { id: ERR_DUPLICATE_TEAM_NUMBER, http: 409, condition: "team_number already registered for the event" }
  - { id: ERR_DUPLICATE_MATCH_NUMBER, http: 409, condition: "match_number already exists within (event_id, series)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is already in a terminal state" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: EventDirector
    description: "Owns lifecycle transitions on the FrcEvent; highest authority for the event"
    identity: opaque
    exclusive_operations:
      - "frc-event create, open-registration, lock-registration, open-build-season, open-inspection, start-matches, open-alliance-selection, close-alliance-selection, close-event"
      - "milestone create/mark-passed"
      - "award present"
      - "team disqualify"
      - "alliance manual create"
      - "_clock/set_current_utc"
    shared_operations:
      - "GET any entity"

  - name: RegistrationOfficer
    description: "Manages team registration and payment"
    identity: opaque
    exclusive_operations:
      - "team create, mark-payment-cleared, confirm"
    shared_operations:
      - "person create"
      - "GET entities"

  - name: ScreeningOfficer
    description: "Reviews background screening packages"
    identity: opaque
    exclusive_operations:
      - "screening-record create, approve, reject"
    shared_operations:
      - "GET person, screening-record"

  - name: TeamLead
    description: "Captain/lead of a specific Team; owns team-side actions"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "team submit-roster, withdraw"
      - "part-order create, submit, cancel, receive"
      - "travel-booking create"
      - "interview-slot confirm"
      - "alliance-selection pick (when current_captain_team_id)"
      - "violation ack"
    shared_operations:
      - "GET team-scoped entities"
      - "person create (own team)"

  - name: ProcurementOfficer
    description: "Approves part orders; segregated from TeamLead who submits"
    identity: opaque
    exclusive_operations:
      - "part-order approve, reject, place-with-vendor"
    shared_operations:
      - "GET part-order, milestone"

  - name: Inspector
    description: "Performs robot inspections; cannot inspect own team"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "robot-inspection create, submit"
    shared_operations:
      - "GET robot-inspection, team"

  - name: LeadInspector
    description: "Passes/fails submitted inspections"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "robot-inspection pass, fail"
    shared_operations:
      - "GET robot-inspection"

  - name: HeadReferee
    description: "Final authority on scoring, replays, violations"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "match finalize, replay"
      - "violation resolve, escalate"
    shared_operations:
      - "GET match, violation"

  - name: Scorekeeper
    description: "Enters match scores; cannot finalize own scores (segregation of duties)"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "match score"
      - "score-breakdown create"
    shared_operations:
      - "GET match"

  - name: QueueManager
    description: "Manages queueing and field flow"
    identity: opaque
    exclusive_operations:
      - "match queue, take-field"
      - "queue-slot create, mark-at-field"
    shared_operations:
      - "GET match, queue-slot"

  - name: FieldResetCrew
    description: "Resets fields between matches"
    identity: opaque
    exclusive_operations:
      - "field-reset-log complete, abort"
    shared_operations:
      - "GET field-reset-log, match"

  - name: JudgeAdvisor
    description: "Head of judging; opens awards and decides winners"
    identity: opaque
    exclusive_operations:
      - "award create, begin-judging, decide"
      - "interview-slot create, cancel"
    shared_operations:
      - "GET award, interview-slot, team, person"

  - name: Judge
    description: "Conducts interviews; cannot judge own team"
    identity: "entity_backed:Person"
    exclusive_operations:
      - "interview-slot complete, no-show"
    shared_operations:
      - "GET award, interview-slot"

  - name: TravelOfficer
    description: "Approves team travel reimbursements"
    identity: opaque
    exclusive_operations:
      - "travel-booking approve, mark-paid, deny"
    shared_operations:
      - "GET travel-booking"
