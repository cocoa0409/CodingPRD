            - { call: "POST /api/appointments", payload: { site_day_id: "${sd1}", patient_ref: "P-002", exam_type: "CT_HEAD", scheduled_start: "13:40", duration_minutes: 30, estimated_dose_msv: 1.0 }, as: FacilityCoordinator, as_user_id: "${fac_a}", captures: { ap2: $.data.id } }
