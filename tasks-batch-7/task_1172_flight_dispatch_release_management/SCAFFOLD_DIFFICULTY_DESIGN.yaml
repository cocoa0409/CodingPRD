            - { call: "POST /dispatch/legs", payload: { flight_no: "FD180", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
