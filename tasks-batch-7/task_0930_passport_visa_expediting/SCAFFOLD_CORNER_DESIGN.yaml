  # =====================================================================
  - section: validations
    instances:

      - name: corner_return_date_before_travel_date_returns_validation
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
          - entities.Order.fields.return_date
        distinguishing_aspect: "POST /expediting/orders with return_date 2026-08-01 earlier than travel_date 2026-09-01 responds 400 ERR_VALIDATION and creates no Order row."
        test_recipe:
          setup:
            - "One catalog item exists and no orders."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-08-01", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { val_err: $.data.error_id }
          assert:
            - "the trigger responds 400 with error_id ERR_VALIDATION"
            - "GET /expediting/orders returns 0 rows"

      - name: corner_invalid_service_level_enum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_ENUM]
          - entities.Order.fields.service_level
        distinguishing_aspect: "service_level is on rung 7's closed list, so POST /expediting/orders with service_level PRIORITY responds 422 ERR_INVALID_ENUM rather than 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One catalog item exists."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", service_level: "PRIORITY" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { enum_err: $.data.error_id }
          assert:
            - "the trigger responds 422 with error_id ERR_INVALID_ENUM"
            - "the trigger does NOT respond with ERR_VALIDATION"

      - name: corner_nationality_mismatch_rejected_on_applicant_create
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_NATIONALITY_MISMATCH]
          - entities.Applicant.fields.nationality_code
        distinguishing_aspect: "Adding an applicant whose nationality_code is CA to an order backed by a US catalog item responds 422 ERR_NATIONALITY_MISMATCH and leaves applicant_count at 0."
        test_recipe:
          setup:
            - "One order on a US/IN/TOURIST catalog item with no applicants."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Wrong Nationality", date_of_birth: "1990-03-04", nationality_code: "CA", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { nat_err: $.data.error_id }
          assert:
            - "the trigger responds 422 with error_id ERR_NATIONALITY_MISMATCH"
            - "Order.${ord_id}.applicant_count == 0"
            - "GET /expediting/orders/${ord_id}/applicants returns 0 rows"

      - name: corner_stream_override_above_government_quote_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_STREAM_ALLOCATION_INVALID]
          - calculations.payment_stream_allocation
          - calculations.money_conservation_invariant
        distinguishing_aspect: "Without stream_override the waterfall makes the per-stream ceiling unreachable; with stream_override GOVERNMENT a 20000-cent payment against a 16000-cent government quote responds 422 ERR_STREAM_ALLOCATION_INVALID and writes no LedgerEntry."
        test_recipe:
          setup:
            - "One STANDARD single-applicant order quoted at 26500 cents with government_fee_quoted_cents 16000 and nothing collected."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Stream Guard", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "POST /expediting/orders/${ord_id}/payments"
              payload: { amount_cents: 20000, stream_override: "GOVERNMENT" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { stream_err: $.data.error_id }
          assert:
            - "the trigger responds 422 with error_id ERR_STREAM_ALLOCATION_INVALID"
            - "Order.${ord_id}.collected_government_cents == 0"
            - "Order.${ord_id}.collected_cents == 0"
            - "Order.${ord_id}.payment_status == UNPAID"
            - "GET /expediting/orders/${ord_id}/ledger-entries returns 0 rows"

  # =====================================================================
  - section: endpoints
    instances:

      - name: corner_required_documents_read_applies_the_age_gate
        claim_type: computed_read
        grounds:
          - calculations.required_document_set
          - entities.DocumentRequirement.fields.applies_max_age_years
          - endpoints[GET /expediting/applicants/{id}/required-documents]
        distinguishing_aspect: "A PARENTAL_CONSENT line gated at applies_max_age_years 16 enters the derived set for a 15-year-old (required_doc_count 2) and is excluded for a 36-year-old (required_doc_count 1) on the same order."
        test_recipe:
          setup:
            - "A catalog item with PASSPORT_BOOK required at every age and PARENTAL_CONSENT required only below 16."
            - "One order with travel_date 2026-09-01 carrying a 15-year-old and a 36-year-old applicant."
          setup_api_calls:
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "PASSPORT_BOOK", is_required: true, validity_rule: "VALID_BEYOND_RETURN_MONTHS", validity_param: 6 }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items/${cat_id}/document-requirements"
              payload: { doc_type: "PARENTAL_CONSENT", is_required: true, validity_rule: "NONE", applies_max_age_years: 16 }
              as: PlatformAdmin
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Young One", date_of_birth: "2010-09-02", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_minor_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Older One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap_adult_id: $.data.id }
          trigger:
            - call: "GET /expediting/applicants/${ap_minor_id}/required-documents"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { minor_req: $.data.required_doc_count }
            - call: "GET /expediting/applicants/${ap_adult_id}/required-documents"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { adult_req: $.data.required_doc_count }
          assert:
            - "${minor_req} == 2"
            - "${adult_req} == 1"
            - "GET /expediting/applicants/${ap_minor_id}/documents returns exactly 2 MISSING slots"
            - "GET /expediting/applicants/${ap_adult_id}/documents returns exactly 1 MISSING slot"

      - name: corner_order_summary_reports_money_conservation_and_custody_cardinality
        claim_type: computed_read
        grounds:
          - calculations.money_conservation_invariant
          - calculations.custody_exclusivity_invariant
          - endpoints[GET /expediting/orders/{id}/summary]
        distinguishing_aspect: "After a single full payment on a 26500-cent order the summary reports collected_cents 26500, outstanding_cents 26500, conservation_ok true, open_custody_count 1 and open_custody_holder APPLICANT."
        test_recipe:
          setup:
            - "One STANDARD single-applicant order quoted at 26500 and paid in full, still in QUOTED."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Summary One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_id}/payments"
              payload: { amount_cents: 26500 }
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "GET /expediting/orders/${ord_id}/summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-audit"
              captures: { s_coll: $.data.collected_cents, s_out: $.data.outstanding_cents, s_ok: $.data.conservation_ok, s_cnt: $.data.open_custody_count, s_hold: $.data.open_custody_holder }
          assert:
            - "${s_coll} == 26500"
            - "${s_out} == 26500"
            - "${s_ok} == true"
            - "${s_cnt} == 1"
            - "${s_hold} == APPLICANT"

      - name: corner_filtered_appointment_list_by_slot_id
        claim_type: filtered_list
        grounds:
          - endpoints[GET /expediting/appointments]
          - entities.Appointment.fields.slot_id
        distinguishing_aspect: "GET /expediting/appointments filtered by slot_id returns only the bookings on that slot, which is the sole reverse-reachability channel from AppointmentSlot to Appointment."
        test_recipe:
          setup:
            - "A consulate covering CA with two slots, each capacity 2, and two applicants booked into different slots."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
