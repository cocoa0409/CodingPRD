            - "PayLine.${pay_line_id}.total_gross_cents is still 7004, because a PENDING correction is not money until it is applied"
            - "PayLine.${pay_line_id}.version == 4: 1 at compute, 2 at approve, 3 at the audit correction and 4 at the adjudication, while the dispute creation itself bumped only open_dispute_count"
            - "PayPeriod.${period_id}.total_correction_cents == 1500, the rollup counting the surviving PENDING correction and not the VOIDED one"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: declare_tips_on_voided_shift_with_excess_charged_tips_returns_state_error
        grounds:
          - validations.priority_9
          - validations.priority_50
          - errors.ERR_SHIFT_NOT_CLOSED
          - errors.ERR_DECLARED_CHARGED_TIPS_EXCEED_CHARGED_SALES
          - state_machines.Shift.time_status.OPEN_to_VOIDED
        distinguishing_aspect: >-
          Both rules are violated by the same single request, and they belong to different
          categories with different HTTP statuses: the state check at priority 9 returns 409 while
          the fiscal check at priority 50 returns 422. The declared 9000 cents of card tips exceed
          the shift's 5000 cents of card sales, which is the more eye-catching defect, but the
          shift is VOIDED and so the lifecycle objection must be raised first.
        test_recipe:
          setup:
            - "One Texas location, one SERVER employee with notice on file, and one shift created on 2026-08-04 with gross_sales_cents 8000 and charged_sales_cents 5000."
            - "That shift has been VOIDED straight from OPEN, so its time_status is VOIDED and its shift_tip_pool_id is null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
