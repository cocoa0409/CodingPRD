              captures: { c1_ver: $.data.version }
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/reissue"
              payload: { effective_date: "2026-08-25", replacement_prescription_ids: ["${rx1}", "${rx2}", "${rx3b}"], expected_cycle_version: "${c1_ver}" }
              as: PharmacyOperations
              captures: { c_new: $.data.id }
          assert:
            - "before the reissue FillCycle.${c1}.total_copay_cents == 4392 (Rx1 762 + Rx2 1658 + Rx3 986 + Rx4 986, each line 28 days)"
            - "used_days == 10 (2026-08-25 - 2026-08-15) and unused_days == 18 on each reissued line"
            - "gross credit == 2190 (490 + 1066 + 634, each line rounded before summing); Rx4 is not in replacement_prescription_ids so its 986 is untouched"
            - "tier_basis_cents == 4392 - 2190 == 2202, which is >= 2000 and < 5000, so reissue_fee_cents == 250 and the net CreditMemo amount_cents == 1940"
            - "after the reissue FillCycle.${c1}.total_copay_cents == 2202 (272 + 592 + 352 + 986) and FillCycle.${c1}.reissue_fee_cents == 250"
            - "CONSERVATION: 2202 (retained) + 1940 (credited to the patient) + 250 (fee retained by the pharmacy) == 4392 (originally billed) — exactly, with no cent invented or lost to rounding"
            - "per-line conservation: each reissued line's new copay_cents plus its line credit equals its original copay_cents (272 + 490 == 762, 592 + 1066 == 1658, 352 + 634 == 986)"
            - "Patient.credit_balance_cents == 1940 and exactly one CreditMemo exists with reason PARTIAL_REISSUE, status ISSUED, cycle_id == ${c1}"
            - "each reissued line is REISSUED with days_supply_filled == 10 and line_end_date == 2026-08-25; Rx4's line is still ADJUDICATED"
            - "the new cycle FillCycle.${c_new} is DRAFT / NOT_ADJUDICATED with is_partial_reissue true, cycle_start_date 2026-08-25, day_supply_days 18 and 3 PLANNED lines"

      - name: cold_chain_reversal_conserves_refill_units_and_dispensed_days
        grounds:
          - entities.Prescription.fields.refills_remaining
          - entities.Prescription.fields.refills_consumed
          - entities.Prescription.fields.days_dispensed_total
          - entities.Prescription.fields.prior_last_dispensed_date
          - endpoints.POST_/pharmacy/shipments/{id}/deliver
          - state_machines.Shipment
        distinguishing_aspect: |
          Conserved quantity: REFILL UNITS AND DISPENSED DAYS on the prescription — a
          non-monetary ledger. refills_remaining + refills_consumed must equal
          refills_authorized both before and after the excursion reversal, while
          days_dispensed_total and the last_dispensed_* pair must return to their exact
          pre-dispense values via the prior_last_dispensed_* shadow columns. This is an
          undo of a side effect stamped by a DIFFERENT endpoint (adjudicate) several steps
          earlier, so nothing may drift even though the reversal is triggered by delivery.
