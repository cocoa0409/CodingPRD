  - rule_id: compensating_invariant
    instances:

      - name: funding_conservation_invariant_holds_across_pay_then_reverse
        grounds:
          - calculations.funding_source_balance
          - state_machines.StipendDisbursement.SCHEDULED_to_PAID
          - state_machines.StipendDisbursement.PAID_to_REVERSED
          - entities.FundingSource.fields.available_amount_cents
          - entities.FundingAllocation.fields.disbursed_amount_cents
        distinguishing_aspect: |
          The ledger identity authorized == available + committed + expended must hold at every step of
          a pay-then-reverse pair on the SAME source: 5000000 == 3400000 + 1600000 + 0 after commitment,
          5000000 == 3400000 + 1300000 + 300000 after payment, and back to
          5000000 == 3400000 + 1600000 + 0 after reversal, with FundingAllocation.disbursed_amount_cents
          returning to exactly 0 and available_amount_cents never moving.
        test_recipe:
          setup:
            - "Term CONS2026 (2026-09-01..2026-12-31, CALENDAR_DAY) with four whole-month pay periods, opened, then moved to PAYROLL_LOCKED after the appointment reaches ACTIVE so every PayPeriod is LOCKED (a prerequisite for paying a disbursement)."
            - "StipendPolicy (RESEARCH, DOCTORAL): min_fte_monthly_stipend_cents 400000, per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, term_insurance_premium_cents 0."
            - "DOCTORAL student with enrolled_credit_hours 8, giving tuition_remission_cents exactly 400000 at the 100 percent band."
            - "One GRANT source authorized 5000000 (allows_tuition_remission true) funding the appointment at 100.00 percent."
            - "Appointment RESEARCH, effort_pct 75, 2026-09-01..2026-12-31, monthly_stipend_cents 300000, ACTIVE with payroll SCHEDULED: total_stipend_cents 1200000, tuition_remission_cents 400000, one COMMITTED allocation at allocated_stipend_cents 1200000 / allocated_remission_cents 400000 / disbursed_amount_cents 0, and four SCHEDULED disbursements of 300000 each."
            - "Source balances at that point: committed 1600000, expended 0, available 3400000."
