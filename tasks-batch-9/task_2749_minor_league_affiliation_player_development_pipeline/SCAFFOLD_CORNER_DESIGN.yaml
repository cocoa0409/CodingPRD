            - "Club B operating on club A's facility review returns 403 ERR_AFFILIATE_SCOPE_VIOLATION"
            - "Club B drafting an agreement under club A's collection URL returns 403 ERR_AFFILIATE_SCOPE_VIOLATION and no agreement row is created"
            - "A genuinely unknown agreement id returns 404 with error_id == ERR_AGREEMENT_NOT_FOUND — path existence at priority 10 still runs after the auth ladder when no resource can be scoped"
            - "Club A's own SUBMIT returns 200 with status == SUBMITTED and its own SUBMIT_REMEDIATION returns 200 with status == REMEDIATION_SUBMITTED"

