            - "SettlementStatement.${st_g_id}.net_due_cents == 1800 (round_half_up(2000 * 900 / 1000)) and its state is ISSUED before the trigger"
            - "The LoyaltyAccountant attempt returns HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED - dispute lists PartnerOperator only, and priority 20 fires before priority 21"
            - "The PartnerOperator attempt carrying ${agr_h_id} returns HTTP 403 with error_id == ERR_NOT_RESOURCE_OWNER - the role is right but the X-User-ID is not the statement's partner_agreement_id"
            - "GET /settlement-statements/${st_g_id} as PartnerOperator ${agr_h_id} likewise returns HTTP 403 with error_id == ERR_NOT_RESOURCE_OWNER - the ownership rule covers reads as well as the action"
            - "After the two refusals, SettlementStatement.${st_g_id}.state is STILL ISSUED with dispute_count 0 and dispute_reason null"
            - "The PartnerOperator attempt carrying ${agr_g_id} SUCCEEDS: state == DISPUTED, dispute_count == 1 and dispute_reason == 'Issued point volume does not match our feed.'"
            - "PartnerAgreement.${agr_g_id}.outstanding_settlement_cents is STILL 1800 - a dispute pauses collection without reversing the receivable"

  # ============================================================================
  # SECTION 6 of 9 - errors (5 instances)
  # Every code in the §1.6 catalogue must be triggerable. Codes already driven
  # by another §1.9 section or by SCAFFOLD_DIFFICULTY_DESIGN.yaml are noted in
  # each instance's distinguishing_aspect; the instances below cover the 401 /
  # 400 / 404 families, the one 409 code no other corner reaches, and the
  # uniform shape of the error envelope itself.
  # ============================================================================
  - section: errors
    instances:
      - name: errors_all_eleven_path_id_codes_return_their_own_not_found
        claim_type: Triggerable
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_STATE_EXPIRY_RULE_NOT_FOUND]
          - errors[ERR_COHORT_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_PERIOD_NOT_FOUND]
          - errors[ERR_PARTNER_AGREEMENT_NOT_FOUND]
          - errors[ERR_POINT_LOT_NOT_FOUND]
          - errors[ERR_REDEMPTION_EVENT_NOT_FOUND]
          - errors[ERR_BREAKAGE_ESTIMATE_NOT_FOUND]
          - errors[ERR_SETTLEMENT_STATEMENT_NOT_FOUND]
          - errors[ERR_CHANGE_ORDER_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: "Each of the eleven addressable entities has its OWN 404 code - the API never collapses them into a single generic ERR_NOT_FOUND - and every one is reachable through its detail read with the same unknown id."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. The system is empty apart from the clock; no fixture rows are needed because every call addresses a deliberately unknown id."
            - "The literal id ffffffff-ffff-ffff-ffff-ffffffffffff exists nowhere in the system."
            - "All eleven reads are made as LoyaltyAccountant, which is a declared role on every one of the endpoints below, so the priority-20 role gate cannot mask the 404."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /programs/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_program: $.data.error_id }
            - call: "GET /state-expiry-rules/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_rule: $.data.error_id }
            - call: "GET /cohorts/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_cohort: $.data.error_id }
            - call: "GET /members/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_member: $.data.error_id }
            - call: "GET /accounting-periods/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_period: $.data.error_id }
            - call: "GET /partner-agreements/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_agreement: $.data.error_id }
            - call: "GET /point-lots/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_lot: $.data.error_id }
            - call: "GET /redemption-events/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_event: $.data.error_id }
            - call: "GET /breakage-estimates/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_estimate: $.data.error_id }
            - call: "GET /settlement-statements/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_statement: $.data.error_id }
            - call: "GET /program-change-orders/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_order: $.data.error_id }
          assert:
            - "GET /programs/{unknown} returns HTTP 404 with error_id == ERR_PROGRAM_NOT_FOUND"
            - "GET /state-expiry-rules/{unknown} returns HTTP 404 with error_id == ERR_STATE_EXPIRY_RULE_NOT_FOUND"
            - "GET /cohorts/{unknown} returns HTTP 404 with error_id == ERR_COHORT_NOT_FOUND"
            - "GET /members/{unknown} returns HTTP 404 with error_id == ERR_MEMBER_NOT_FOUND"
            - "GET /accounting-periods/{unknown} returns HTTP 404 with error_id == ERR_PERIOD_NOT_FOUND"
            - "GET /partner-agreements/{unknown} returns HTTP 404 with error_id == ERR_PARTNER_AGREEMENT_NOT_FOUND"
            - "GET /point-lots/{unknown} returns HTTP 404 with error_id == ERR_POINT_LOT_NOT_FOUND"
            - "GET /redemption-events/{unknown} returns HTTP 404 with error_id == ERR_REDEMPTION_EVENT_NOT_FOUND"
            - "GET /breakage-estimates/{unknown} returns HTTP 404 with error_id == ERR_BREAKAGE_ESTIMATE_NOT_FOUND"
            - "GET /settlement-statements/{unknown} returns HTTP 404 with error_id == ERR_SETTLEMENT_STATEMENT_NOT_FOUND"
            - "GET /program-change-orders/{unknown} returns HTTP 404 with error_id == ERR_CHANGE_ORDER_NOT_FOUND"
            - "All eleven error_id values are DISTINCT - no two entities share a 404 code"

      - name: errors_missing_auth_headers_and_unknown_role_both_return_401
        claim_type: Triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=10]
          - validations[priority=11]
          - roles
        distinguishing_aspect: "The two 401 codes are distinct and both outrank everything else: an absent header pair reports ERR_MISSING_AUTH_HEADERS even when the addressed id is also unknown, and a syntactically present but undeclared role reports ERR_UNKNOWN_ROLE rather than the 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One DRAFT program 'Auth Core' exists so that a genuinely resolvable id is available."
            - "The literal id ffffffff-ffff-ffff-ffff-ffffffffffff exists nowhere in the system, and 'Auditor' is not one of the five declared roles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Auth Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: "(none - neither X-User-Role nor X-User-ID is sent)"
              captures: { err_no_headers: $.data.error_id }
            - call: "GET /programs/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: "(none - neither X-User-Role nor X-User-ID is sent)"
              captures: { err_no_headers_unknown_id: $.data.error_id }
            - call: "POST /programs"
              payload: { name: "" }
              as: "(none - neither X-User-Role nor X-User-ID is sent)"
              captures: { err_no_headers_bad_body: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Auditor
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: Auditor
              captures: { err_unknown_role_on_action: $.data.error_id }
          assert:
            - "The headerless read of a KNOWN program returns HTTP 401 with error_id == ERR_MISSING_AUTH_HEADERS"
            - "The headerless read of an UNKNOWN program also returns HTTP 401 with error_id == ERR_MISSING_AUTH_HEADERS, NOT 404 - priority 10 precedes the priority-40 path resolution"
            - "The headerless POST with a malformed body also returns HTTP 401 with error_id == ERR_MISSING_AUTH_HEADERS, NOT 400 - priority 10 precedes the priority-30 body check"
            - "Role 'Auditor' returns HTTP 401 with error_id == ERR_UNKNOWN_ROLE, NOT 403 ERR_ROLE_NOT_PERMITTED - an unrecognised role is an authentication failure, not an authorisation one"
            - "Role 'Auditor' on the activate action likewise returns HTTP 401 with error_id == ERR_UNKNOWN_ROLE"
            - "LoyaltyProgram.${prog_id}.status is STILL DRAFT and its version is unchanged - none of the five refused calls mutated anything"

      - name: errors_invalid_request_covers_missing_field_bad_enum_and_pagination
        claim_type: Triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=30]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The single 400 code spans three different malformations - an absent required input, a value outside its declared enum, and a pagination argument outside 1..100 or below zero - and it is checked before every business rule, so a body that is BOTH malformed and business-invalid still reports 400."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Bad Core' is DRAFT with one cohort C1 already created, so a duplicate cohort_code is available as a competing business violation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Bad Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
          trigger:
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C2", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", sample_size: 40000 }
              as: ProgramAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /programs"
              payload: { name: "Bad Enum", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "FIFO_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { err_enum: $.data.error_id }
            - call: "GET /programs?limit=101&offset=0"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /programs?limit=0&offset=0"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_limit_low: $.data.error_id }
            - call: "GET /programs?limit=10&offset=-1"
              payload: {}
              as: LoyaltyAccountant
              captures: { err_offset: $.data.error_id }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", sample_size: 40000 }
              as: ProgramAdmin
              captures: { err_both: $.data.error_id }
            - call: "GET /programs?limit=100&offset=0"
              payload: {}
              as: LoyaltyAccountant
          assert:
            - "The cohort body omitting the required observed_redemption_rate_bp returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "breakage_method 'FIFO_WEIGHTED' returns HTTP 400 with error_id == ERR_INVALID_REQUEST - only COHORT_WEIGHTED, SINGLE_COHORT and PROGRAM_HISTORICAL are declared"
            - "limit=101 returns HTTP 400 with error_id == ERR_INVALID_REQUEST and limit=0 does too - the accepted band is 1..100 inclusive"
            - "offset=-1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "The body that is BOTH missing observed_redemption_rate_bp AND carries the duplicate cohort_code 'C1' returns HTTP 400 with error_id == ERR_INVALID_REQUEST, NOT 409 ERR_DUPLICATE_CODE - priority 30 precedes priority 83"
            - "limit=100 SUCCEEDS with HTTP 200 and echoes limit == 100 - the upper bound is inclusive"
            - "GET /cohorts?program_id=${prog_id} returns total_count == 1 with its single row's id == ${coh1_id} - none of the refused bodies persisted"

      - name: errors_hard_closed_period_rejects_a_later_settlement_statement
        claim_type: Triggerable
        grounds:
          - errors[ERR_PERIOD_HARD_CLOSED]
          - validations[priority=64]
          - state_machines.AccountingPeriod.transitions[SOFT_CLOSED->HARD_CLOSED]
        distinguishing_aspect: "ERR_PERIOD_HARD_CLOSED is the one 409 code reachable only after a period reaches its terminal state: POST /settlement-statements is not covered by the priority-60 OPEN gate, so a hard-closed period is refused by its own dedicated code at priority 64."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Hardclose Core' ACTIVE (ssp 1200, cap 5000, COHORT_WEIGHTED, historical 7500), rule TX, ONE cohort C1 observed 8200, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "M1 holds one 1000-point lot (deferred 900). An estimate prepared by acct-1 with a non-empty memo_narrative is submitted and APPROVED by ctrl-1."
            - "The clock is advanced to 2026-09-01T00:00:00Z, per1 is soft-closed, and with no statements outstanding it is then hard-closed."
            - "Only afterwards is PartnerAgreement PG created, so the statement attempt below has a valid, ACTIVE counterparty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Hardclose Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
            - call: "POST /programs/${prog_id}/breakage-estimates"
              payload: { period_id: "${per1_id}", memo_narrative: "August estimate; single cohort, no program changes in the period.", sensitivity_low_bp: 7700, sensitivity_high_bp: 8700 }
              as: LoyaltyAccountant
              as_user_id: acct-1
              captures: { est1_id: $.data.id }
            - call: "POST /breakage-estimates/${est1_id}/submit"
              payload: {}
              as: LoyaltyAccountant
              as_user_id: acct-1
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v: $.data.version }
            - call: "POST /breakage-estimates/${est1_id}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: Controller
              as_user_id: ctrl-1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/soft-close"
              payload: {}
              as: Controller
            - call: "POST /accounting-periods/${per1_id}/hard-close"
              payload: {}
              as: Controller
            - call: "POST /partner-agreements"
              payload: { program_id: "${prog_id}", partner_code: "PG", relationship_type: "THIRD_PARTY", issuance_rate_millicents_per_point: 900, redemption_rate_millicents_per_point: 1100, settlement_lag_days: 30, net_settlement_enabled: false, min_invoice_cents: 1000, effective_start_date: "2026-08-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /settlement-statements"
              payload: { partner_agreement_id: "${agr_id}", period_id: "${per1_id}", expected_partner_agreement_version: "${agr_v}" }
              as: LoyaltyAccountant
              captures: { err_hard_closed: $.data.error_id }
          assert:
            - "AccountingPeriod.${per1_id}.state == HARD_CLOSED with closing_liability_cents == 984, catch_up_adjustment_cents == 84 and breakage_recognized_cents == -84 before the trigger"
            - "The statement attempt returns HTTP 409 with error_id == ERR_PERIOD_HARD_CLOSED"
            - "It is NOT ERR_PERIOD_NOT_OPEN: the priority-60 gate does not list POST /settlement-statements, so the dedicated priority-64 code is the only one that fires"
            - "It is NOT ERR_STALE_AGREEMENT_VERSION: ${agr_v} is the agreement's current version, and priority 51 would in any case precede 64 only if the version were wrong"
            - "PartnerAgreement.${agr_id}.status is ACTIVE and outstanding_settlement_cents == 0 - the priority-63 gate passed, isolating the period-state failure"
            - "GET /settlement-statements?period_id=${per1_id} returns total_count == 0 - no statement row was created"

      - name: errors_envelope_shape_is_identical_across_every_status_code
        claim_type: Triggerable
        grounds:
          - response_envelope.error
          - response_envelope.success
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_PROGRAM_CONFIG_INCOMPLETE]
        distinguishing_aspect: "Every failure - 400, 403, 404 and 409 alike - carries the same envelope: meta.api_request_id plus meta.api_request_timestamp alongside a data object holding exactly error_id and message, with no partial entity payload leaking through."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Shape Core' is DRAFT with NO StateExpiryRule and NO Cohort, so activating it violates the program-configuration rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Shape Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs?limit=101"
              payload: {}
              as: ProgramAdmin
              captures: { err_400: $.data.error_id, msg_400: $.data.message }
            - call: "POST /programs"
              payload: { name: "Shape Core Two", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: LoyaltyAccountant
              captures: { err_403: $.data.error_id, msg_403: $.data.message }
            - call: "GET /programs/ffffffff-ffff-ffff-ffff-ffffffffffff"
              payload: {}
              as: ProgramAdmin
              captures: { err_404: $.data.error_id, msg_404: $.data.message }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err_409: $.data.error_id, msg_409: $.data.message }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The 400 response carries error_id == ERR_INVALID_REQUEST with a non-empty message string"
            - "The 403 response carries error_id == ERR_ROLE_NOT_PERMITTED - POST /programs lists ProgramAdmin only"
            - "The 404 response carries error_id == ERR_PROGRAM_NOT_FOUND"
            - "The 409 response carries error_id == ERR_PROGRAM_CONFIG_INCOMPLETE - activation needs at least one StateExpiryRule and at least one Cohort"
            - "ALL FOUR error responses expose exactly two keys under data: error_id and message; none carries id, version, status or any other entity field"
            - "ALL FOUR error responses carry meta.api_request_id and meta.api_request_timestamp, the same meta block the success envelope uses"
            - "The successful GET /programs/${prog_id} carries the same meta block plus response_type and a full entity under data, confirming only the data payload differs between success and failure"
            - "LoyaltyProgram.${prog_id}.status is STILL DRAFT and GET /programs returns total_count == 1 - the four refused calls changed nothing"

  # ============================================================================
  # SECTION 7 of 9 - rbac (7 instances)
  # complexity_profile.role_model is segregation_of_duties, so the section
  # covers each role's exclusive_operations, the shared_operations, the two
  # entity_backed ownership rules, and the same-user prepare/approve ban.
  # Several denial probes deliberately address the unknown id
  # ffffffff-ffff-ffff-ffff-ffffffffffff, because the priority-20 role gate is
  # evaluated BEFORE the priority-40 path resolution.
  # ============================================================================
  - section: rbac
    instances:
      - name: rbac_program_admin_exclusive_configuration_denied_to_others
        claim_type: exclusive ops
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - validations[priority=20]
          - errors[ERR_ROLE_NOT_PERMITTED]
