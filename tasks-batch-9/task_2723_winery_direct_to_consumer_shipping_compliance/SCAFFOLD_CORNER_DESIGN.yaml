          rationale: "The named \u00a71.8 instance drives POST /dtc/shipments across the APPROVED -> SUSPENDED -> APPROVED cycle of the enrollment, asserting the refusal in the middle and the success on either side, which is the conditional-action claim for this endpoint."

  # =========================================================================
  - section: errors
    instances:
      - name: elevated_screening_tier_parks_orders_and_bars_new_club_subscriptions
        claim_type: triggerable
        grounds:
          - errors[ERR_ELEVATED_RISK_REVIEW_REQUIRED]
          - validations.priority_95
          - calculations.consumer_compliance_risk_score
          - entities.Consumer.fields.screening_tier
          - endpoints.POST_/dtc/club-subscriptions
        distinguishing_aspect: |
          ERR_ELEVATED_RISK_REVIEW_REQUIRED needs a consumer whose risk_score_screening reaches exactly the
          50-point threshold from three different factors at once, and it must reach it WITHOUT breaching the
          volume limit, or priority 80 would answer first. One returned shipment gives f1 = 10, two denied
          exceptions give f2 = 30, and a 1.500 L manual adjustment against the 4.500 L AZ limit gives
          f3 = floor(30 * 1.500 / 4.500) = 10, for 50 exactly. The rule then shows both of its faces: recorded as
          an overridable failure by screening, and raised as a hard 422 by POST /dtc/club-subscriptions.
        test_recipe:
          setup:
            - "The AZ rule allows DTC with a per_consumer_limit_liters of only 4.500 L over a rolling 12 months, 55 c/L excise and 825 bps tax, and requires a carrier program."
