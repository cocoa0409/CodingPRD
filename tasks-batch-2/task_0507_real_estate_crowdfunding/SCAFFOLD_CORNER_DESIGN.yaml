  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: settle_cascade_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Subscription.PENDING_ACH_to_SETTLED, calculations.fund_shares_outstanding]
        distinguishing_aspect: "The settle response (immediate consistency) reflects shares_allocated==1000 in the same request, and a subsequent fund read shows shares_outstanding==1000 — no lag."
        test_recipe:
          setup: ["Fund OPEN; approved investor; subscription funded 1000000 PENDING_ACH."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund IMC", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "imc@x.com", full_name: "IMC", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { sh: $.data.shares_allocated }
          assert:
            - "Subscription.${sub}.shares_allocated == 1000.0000"
            - "Fund.${fund_id}.shares_outstanding == 1000"

  # =========================================================================
  # Excluded stubs — corners already covered by §1.8 difficulty instances
  # =========================================================================
  - section: calculations
    instances:
      - name: subscription_final_nav_pricing_divergence_stub
        claim_type: Variant Divergence
        grounds: [calculations.subscription_shares]
        excluded_because:
          difficulty_instance: subscription_provisional_vs_final_nav_pricing
          rationale: "Provisional-vs-final NAV divergence and shares_allocated computation are asserted directly by the named §1.8 dual_variant_calc instance."
      - name: dividend_round_order_divergence_stub
        claim_type: Precision
        grounds: [calculations.dividend_allocation]
        excluded_because:
          difficulty_instance: dividend_round_per_holding_then_sum_mode_b
          rationale: "Round-per-holding-then-sum total_paid_cents==150 is the exact assertion of the named §1.8 combinatorial_formula instance."

  - section: state_machines
    instances:
      - name: redemption_cyclic_requeue_stub
        claim_type: Valid Transition
        grounds: [state_machines.RedemptionRequest.DEFERRED_to_QUEUED]
        excluded_because:
          difficulty_instance: redemption_cyclic_queued_deferred_queued
          rationale: "DEFERRED->QUEUED re-entry and subsequent fulfillment are exercised by the named §1.8 non_linear_state_machine instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: subscription_reverse_compensation_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Subscription.SETTLED_to_REVERSED]
        excluded_because:
          difficulty_instance: subscription_reverse_restores_capital_and_shares
          rationale: "Exact compensation of fund capital/shares on reverse is asserted by the named §1.8 compensating_invariant instance."
