        distinguishing_aspect: |
          The adjustment is approved AFTER the pool has already been certified,
          which is legal (priority 62 permits adjustment decisions in
          CALIBRATION_REVIEW and no rule re-opens a CALIBRATED pool), so the
          approval pushes an already-signed-off pool to 4,400,000 against 4,000,000
