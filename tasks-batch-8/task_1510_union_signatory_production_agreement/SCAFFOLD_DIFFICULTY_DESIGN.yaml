            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Sumac Ridge", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/force-majeure-events", payload: { production_id: "${prod_id}", event_type: "STRIKE", start_date: "2026-08-05", end_date: "2026-08-08" }, as: UnionRep, captures: { fm1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /union-compliance/force-majeure-events/${fm1_id}/lift", payload: {}, as: UnionRep }
            - { call: "POST /union-compliance/force-majeure-events", payload: { production_id: "${prod_id}", event_type: "NATURAL_DISASTER", start_date: "2026-08-08", end_date: "2026-08-10" }, as: UnionRep, captures: { fm2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /union-compliance/force-majeure-events/${fm2_id}/lift", payload: {}, as: UnionRep }
          trigger:
            - { call: "POST /union-compliance/force-majeure-events", payload: { production_id: "${prod_id}", event_type: "OTHER", start_date: "2026-08-09", end_date: "2026-08-12" }, as: UnionRep, captures: { err: $.data.error_id } }
          assert:
            - "ForceMajeureEvent.${fm2_id} was created (adjacency [2026-08-08, ...) after [..., 2026-08-08) allowed)"
            - "${err} == ERR_FM_OVERLAP"
            - "Production.${prod_id}.status == IN_PRODUCTION (restored after each lift)"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bond_post_release_ledger_conservation
        grounds:
          - state_machines.Bond.PENDING_to_POSTED
          - state_machines.Bond.POSTED_to_RELEASED
          - entities.Bond.fields.amount_held_cents
        distinguishing_aspect: |
          Conserved quantity: the bond cash ledger — amount_held_cents ==
          total_posted_cents - total_released_cents - total_forfeited_cents at every
          step. Posting 2500000 followed by a full release at production close returns
          held to exactly 0 with posted == released == 2500000 and forfeited == 0:
          forward action (post) + compensating action (release) leaves no drift.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production driven to CLOSED (bond posted; staffing met; started; all crew wrapped; production wrapped; closed with no reports/grievances/audits)"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Tamarack Bay LLC", fein: "17-0000006" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Tamarack Dock", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-CAM-1", department: "CAMERA", classification: "CAMERA_OPERATOR", daily_rate_cents: 100000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { cam_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-GRIP-1", department: "GRIP_ELECTRIC", classification: "GAFFER", daily_rate_cents: 90000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { grip_id: $.data.id } }
            - { call: "POST /union-compliance/crew-assignments", payload: { production_id: "${prod_id}", crew_member_ref: "W-SND-1", department: "SOUND", classification: "BOOM_OPERATOR", daily_rate_cents: 80000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { snd_id: $.data.id } }
            - { call: "POST /union-compliance/productions/${prod_id}/start-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "WRAPPED" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${grip_id}/transition", payload: { to_state: "WRAPPED" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/crew-assignments/${snd_id}/transition", payload: { to_state: "WRAPPED" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/wrap-production", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions/${prod_id}/close", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/bonds/${bond_id}/release", payload: {}, as: FundTrustee, as_user_id: "ft_1" }
          assert:
            - "Bond.${bond_id}.status == RELEASED"
            - "Bond.${bond_id}.amount_held_cents == 0"
            - "Bond.${bond_id}.total_posted_cents == 2500000"
            - "Bond.${bond_id}.total_released_cents == 2500000"
            - "Bond.${bond_id}.total_forfeited_cents == 0"
            - "conservation: total_posted_cents - total_released_cents - total_forfeited_cents == amount_held_cents (2500000 - 2500000 - 0 == 0)"

      - name: grievance_settlement_pay_refund_conservation
        grounds:
          - state_machines.Grievance.RESOLVED_to_CLOSED
          - entities.Grievance.fields.settlement_paid_cents
          - errors[ERR_OVERPAYMENT]
          - errors[ERR_REFUND_EXCEEDS_PAID]
        distinguishing_aspect: |
          Conserved quantity: the settlement cash balance (a different quantity from
          the bond ledger) — a payment of 50000 followed by its compensating refund of
          20000 leaves settlement_paid_cents at exactly 30000 (no drift), and a final
          payment of 40000 brings paid == agreed (70000) which auto-closes the
          grievance. Refunds are only possible because payments were made first.
        test_recipe:
          setup:
            - "SIGNATORY company; ULB production STAFFING; grievance RESOLVED with settlement_agreed_cents == 70000 (proposal by ur_2 accepted; intake by ur_1)"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Umber Cove LLC", fein: "18-0000007" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "NEW_MEDIA", estimated_slate_budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Umber Cut", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_id}", category: "PAY", incident_date: "2026-07-20", description: "Unpaid overtime" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_id: $.data.id } }
            - { call: "POST /union-compliance/grievances/${grv_id}/accept-intake", payload: {}, as: UnionRep, as_user_id: "ur_1", captures: { grv_v: $.data.version } }
            - { call: "POST /union-compliance/grievances/${grv_id}/propose-settlement", payload: { proposal_amount_cents: 70000, expected_grievance_version: "${grv_v}" }, as: UnionRep, as_user_id: "ur_2" }
            - { call: "POST /union-compliance/grievances/${grv_id}/respond-settlement", payload: { decision: "ACCEPT" }, as: ProducerRep, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /union-compliance/grievances/${grv_id}/payments", payload: { amount_cents: 50000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { paid1: $.data.settlement_paid_cents } }
            - { call: "POST /union-compliance/grievances/${grv_id}/refunds", payload: { amount_cents: 20000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { paid2: $.data.settlement_paid_cents } }
            - { call: "POST /union-compliance/grievances/${grv_id}/payments", payload: { amount_cents: 40000 }, as: ProducerRep, as_user_id: "${co_id}" }
          assert:
            - "${paid1} == 50000"
            - "${paid2} == 30000 (pay 50000 + compensating refund 20000 leaves 30000 net)"
            - "Grievance.${grv_id}.settlement_paid_cents == 70000"
            - "Grievance.${grv_id}.status == CLOSED (auto-close when paid reaches agreed)"
