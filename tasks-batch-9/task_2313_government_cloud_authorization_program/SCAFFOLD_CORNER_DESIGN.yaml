# §1.9 Scaffold Corner Design — task 2313 Government Cloud Authorization Program
# Breadth pass: one block per claim-extraction-guide section; every claim_type is
# taken from that guide's per-section tables. Corners already proven by a §1.8
# instance are recorded as excluded_because stubs instead of duplicate recipes.
scaffold_corner_design:
- section: entities
  instances:
  - name: agency_creation_returns_the_whole_row_inside_the_success_envelope
    claim_type: creation
    grounds:
    - entities.Agency
    - endpoints[POST /agencies]
    - response_envelope.success
    distinguishing_aspect: POST /agencies with every declared input returns 201 and echoes all seven business fields plus
      the four common fields inside data, wrapped in the success envelope with response_type 'object' — the counters start
      at 0 rather than being absent.
    test_recipe:
      setup:
      - Empty database; the logical clock has never been set, so it reads the startup default 2026-08-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          status: ACTIVE
          sponsorship_capacity: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_id: $.data.id
      - call: GET /agencies/${agency_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
      assert:
      - 'create: HTTP 201; response_type == ''object''; meta.api_request_id and meta.api_request_timestamp are present'
      - 'create: data.name == ''Department of Transportation'', data.agency_code == ''DOT'', data.status == ''ACTIVE'', data.sponsorship_capacity
        == 2'
      - 'create: data.sponsored_offering_count == 0, data.reuse_grant_count == 0, data.open_notice_count == 0'
      - 'create: data.id is a bare UUID with no type prefix; data.version == 1; data.created_at == data.updated_at == 2026-08-01T00:00:00Z'
      - 'read-back: HTTP 200 and every field equals the create response byte for byte'
      - Agency.${agency_id}.version is still 1 after the read (a GET is not a mutation)
  - name: offering_read_returns_the_stored_row_with_its_null_valued_optional_fields
    claim_type: retrieval
    grounds:
    - entities.CloudServiceOffering
    - endpoints[GET /offerings/{id}]
    distinguishing_aspect: GET /offerings/{id} returns the stored offering with authorization_path, sponsor_agency_id, baseline_id,
      preliminary_impact_level and final_impact_level all explicitly null — the pre-categorisation shape — and is readable
      by all four roles, not only the owner.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; DOT agency and a MODERATE baseline exist.
      - One CloudServiceOffering 'GovCloud Compute' created by csp-lead-1, still in DRAFT.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: &id001
          - family_code: AC
            required_control_count: 2
            priority_rank: 1
          - family_code: SC
            required_control_count: 1
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      trigger:
      - call: GET /offerings/${offering_id}
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
      - call: GET /offerings/${offering_id}
        as: AgencyAuthorizingOfficial
        as_user_id: ${agency_dot_id}
      assert:
      - HTTP 200 for both reads; response_type == 'object'
      - data.name == 'GovCloud Compute', data.provider_name == 'Aurora Cloud', data.service_model == 'IAAS', data.deployment_model
        == 'GOV_COMMUNITY'
      - data.assessment_budget_usd == 400000.00 and data.external_dependency_impact_level == 'LOW'
      - data.owner_user_id == 'csp-lead-1' and data.status == 'DRAFT'
      - data.authorization_path == null, data.sponsor_agency_id == null, data.baseline_id == null, data.preliminary_impact_level
        == null, data.final_impact_level == null
      - data.boundary_version == 1, data.included_service_count == 0, data.open_package_count == 0, data.superseded_package_count
        == 0
      - data.version == 1 and data.created_at == 2026-02-01T00:00:00Z
  - name: offering_list_pages_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - endpoints[GET /offerings]
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: GET /offerings with limit 2 over three rows returns a 2-row page with total_count 3 and has_more
      true, the second page returns 1 row with has_more false, and an omitted limit falls back to the declared default of
      10 — total_count counts the filtered set, not the page.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; DOT agency and a MODERATE baseline exist.
      - 'Three CloudServiceOffering rows exist, all in DRAFT: ''GovCloud Compute'', ''GovCloud Storage'', ''GovCloud Analytics''.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Storage
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_b_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Analytics
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_c_id: $.data.id
      trigger:
      - call: GET /offerings
        payload:
          limit: 2
          offset: 0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          page1_first_id: $.data[0].id
      - call: GET /offerings
        payload:
          limit: 2
          offset: 2
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          page2_first_id: $.data[0].id
      - call: GET /offerings
        payload:
          status: DRAFT
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: GET /offerings
        payload:
          status: AUTHORIZED
        as: ProgramBoardReviewer
        as_user_id: board-1
      assert:
      - 'page 1: HTTP 200, response_type == ''array'', len(data) == 2, limit == 2, offset == 0, total_count == 3, has_more
        == true'
      - 'page 2: len(data) == 1, limit == 2, offset == 2, total_count == 3, has_more == false'
      - ${page2_first_id} != ${page1_first_id} — the pages are disjoint
      - 'third call: limit defaults to 10, offset defaults to 0, len(data) == 3, total_count == 3, has_more == false'
      - 'fourth call: len(data) == 0, total_count == 0, has_more == false — an empty filtered page is still a 200 with response_type
        ''array'''
  - name: reads_of_unknown_ids_return_the_entity_specific_404
    claim_type: not_found
    grounds:
    - validations[priority=6]
    - errors[ERR_OFFERING_NOT_FOUND]
    - errors[ERR_AGENCY_NOT_FOUND]
    - errors[ERR_POAM_ITEM_NOT_FOUND]
    distinguishing_aspect: Each collection maps an unknown path id to its OWN error_id rather than a shared generic 404, and
      the error envelope carries response_type 'error' with no data.id.
    test_recipe:
      setup:
      - Empty database; the logical clock reads the startup default 2026-08-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - call: GET /offerings/11111111-1111-4111-8111-111111111111
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: &id002
          err: $.data.error_id
      - call: GET /agencies/22222222-2222-4222-8222-222222222222
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: GET /poam-items/33333333-3333-4333-8333-333333333333
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures: *id002
      assert:
      - 'first call: HTTP 404 with error_id ERR_OFFERING_NOT_FOUND'
      - 'second call: HTTP 404 with error_id ERR_AGENCY_NOT_FOUND'
      - 'third call: HTTP 404 with error_id ERR_POAM_ITEM_NOT_FOUND'
      - 'every response: response_type == ''error'', data.message is a non-empty string, data has no id key'
      - no row was created by any of the three calls
  - name: offering_creation_without_a_required_input_is_a_400
    claim_type: required_fields
    grounds:
    - validations[priority=5]
    - errors[ERR_INVALID_REQUEST]
    - endpoints[POST /offerings].input
    distinguishing_aspect: 'Each of the five inputs declared without a default (name, provider_name, service_model, deployment_model,
      assessment_budget_usd) is individually required: omitting exactly one returns ERR_INVALID_REQUEST 400, and no partial
      row is written.'
    test_recipe:
      setup:
      - Empty database; the logical clock reads the startup default 2026-08-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /agencies
        payload:
          agency_code: DOT
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: GET /offerings
        payload:
          limit: 10
          offset: 0
        as: CspComplianceLead
        as_user_id: csp-lead-1
      assert:
      - 'first call (no service_model): HTTP 400 with error_id ERR_INVALID_REQUEST'
      - 'second call (no assessment_budget_usd): HTTP 400 with error_id ERR_INVALID_REQUEST'
      - 'third call (no name on POST /agencies): HTTP 400 with error_id ERR_INVALID_REQUEST'
      - 'fourth call: total_count == 0 — none of the three refused writes left a row behind'
  - name: omitted_optional_inputs_fall_back_to_the_declared_defaults
    claim_type: defaults
    grounds:
    - entities.Agency.fields.status
    - entities.Agency.fields.sponsorship_capacity
    - entities.CloudServiceOffering.fields.external_dependency_impact_level
    - entities.ControlImplementation.fields.implementation_status
    - entities.ControlImplementation.fields.crm_documented
    distinguishing_aspect: Agency.status ACTIVE / sponsorship_capacity 3, offering external_dependency_impact_level LOW and
      ControlImplementation implementation_status PLANNED / crm_documented false all arrive from the §1.1 defaults; the PLANNED
      default is what keeps crm coverage at 0.00 even though a control row exists.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; MODERATE baseline (AC required 2, SC required 1) effective 2026-01-01T00:00:00Z.
      - Offering created without external_dependency_impact_level, one CONFIRMED MODERATE data category, so the offering is
        CATEGORIZED with baseline_id set.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      - call: POST /data-categories/${dc_pii_id}/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      trigger:
      - call: POST /agencies
        payload:
          name: Environmental Protection Agency
          agency_code: EPA
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_epa_id: $.data.id
      - call: POST /control-implementations
        payload:
          offering_id: ${offering_id}
          control_id: AC-2
          family_code: AC
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          ci_ac2_id: $.data.id
      - call: GET /offerings/${offering_id}/crm-coverage
        as: CspComplianceLead
        as_user_id: csp-lead-1
      assert:
      - Agency.${agency_epa_id}.status == 'ACTIVE' and sponsorship_capacity == 3 (defaults)
      - Agency.${agency_epa_id}.sponsored_offering_count == 0, reuse_grant_count == 0, open_notice_count == 0
      - ControlImplementation.${ci_ac2_id}.implementation_status == 'PLANNED', crm_documented == false, customer_responsibility_text
        == null, inherited_from_offering_id == null
      - CloudServiceOffering.${offering_id}.external_dependency_impact_level == 'LOW' and final_impact_level == 'MODERATE'
      - 'crm-coverage: overall_coverage_pct == 0.00 and weight_total == 3 — a PLANNED row is outside the input set'
      - 'crm-coverage: family_breakdown has 2 entries, AC first (priority_rank 1) then SC, each with family_pct 0.00'
  - name: control_baseline_total_required_controls_is_summed_from_the_families_array
    claim_type: computed_fields
    grounds:
    - entities.ControlBaseline.fields.total_required_controls
    - endpoints[POST /control-baselines]
    distinguishing_aspect: total_required_controls is derived from the families array at write time (2+1 = 3 and 4+2 = 6)
      and a zero-requirement family contributes 0 to the sum while still occupying a row in families — the field is never
      taken from the request body.
    test_recipe:
      setup:
      - Empty database; the logical clock reads the startup default 2026-08-01T00:00:00Z.
      setup_api_calls: []
      trigger:
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 2
            priority_rank: 1
          - family_code: SC
            required_control_count: 1
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: HIGH
          version_label: Rev5-HIGH
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 4
            priority_rank: 1
          - family_code: SC
            required_control_count: 2
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_high_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: LOW
          version_label: Rev5-LOW
          effective_from: '2026-01-01T00:00:00Z'
          families:
          - family_code: AC
            required_control_count: 1
            priority_rank: 1
          - family_code: CM
            required_control_count: 0
            priority_rank: 2
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_low_id: $.data.id
      assert:
      - ControlBaseline.${baseline_mod_id}.total_required_controls == 3 and retired == false (default)
      - ControlBaseline.${baseline_high_id}.total_required_controls == 6
      - ControlBaseline.${baseline_low_id}.total_required_controls == 1 — the CM family with required_control_count 0 adds
        nothing
      - ControlBaseline.${baseline_low_id}.families still has 2 elements in the submitted order
      - 'all three calls: HTTP 201 with response_type ''object'''
  - name: offering_system_fields_are_minted_by_the_server_from_the_headers_and_the_clock
    claim_type: system_fields
    grounds:
    - entities.CloudServiceOffering.fields.owner_user_id
    - entities.CloudServiceOffering.fields.status
    - endpoints[POST /_clock/set_current_utc]
    distinguishing_aspect: owner_user_id is copied from the X-User-ID header (not from the body), status/boundary_version/the
      four package counters come from the §1.1 defaults, and created_at follows the logical clock — the same POST run at two
      different clock settings differs only in the timestamps.
    test_recipe:
      setup:
      - Clock set to 2026-02-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      trigger:
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_a_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-04-15T09:30:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /offerings
        payload:
          name: GovCloud Storage
          provider_name: Aurora Cloud
          service_model: PAAS
          deployment_model: HYBRID
          assessment_budget_usd: 250000.0
        as: CspComplianceLead
        as_user_id: csp-lead-2
        captures:
          offering_b_id: $.data.id
      assert:
      - CloudServiceOffering.${offering_a_id}.owner_user_id == 'csp-lead-1' and created_at == updated_at == 2026-02-01T00:00:00Z
      - CloudServiceOffering.${offering_b_id}.owner_user_id == 'csp-lead-2' and created_at == updated_at == 2026-04-15T09:30:00Z
      - 'both rows: status == ''DRAFT'', boundary_version == 1, included_service_count == 0, open_package_count == 0, superseded_package_count
        == 0, version == 1'
      - 'both rows: id is a bare UUID and the two ids differ'
      - 'clock call: data.current_utc == 2026-04-15T09:30:00Z'
  - name: enum_membership_and_numeric_range_constraints_are_enforced_on_write
    claim_type: type_constraints
    grounds:
    - validations[priority=5]
    - entities.DataCategory.fields.confidentiality_impact
    - entities.CloudServiceOffering.fields.assessment_budget_usd
    - entities.DeviationRequest.fields.requested_extension_days
    distinguishing_aspect: An out-of-vocabulary enum member, a non-positive money amount and an out-of-range integer are all
      ERR_INVALID_REQUEST at priority 5 — ahead of every existence and business rule — while the legal variant of the same
      call succeeds.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; DOT agency, MODERATE baseline and a DRAFT offering exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
      - call: POST /agencies
        payload:
          name: Department of Transportation
          agency_code: DOT
          sponsorship_capacity: 3
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          agency_dot_id: $.data.id
      - call: POST /control-baselines
        payload:
          impact_level: MODERATE
          version_label: Rev5-MODERATE
          effective_from: '2026-01-01T00:00:00Z'
          families: *id001
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          baseline_mod_id: $.data.id
      - call: POST /offerings
        payload:
          name: GovCloud Compute
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 400000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          offering_id: $.data.id
      trigger:
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: CRITICAL
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /offerings
        payload:
          name: GovCloud Storage
          provider_name: Aurora Cloud
          service_model: IAAS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 0.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /offerings
        payload:
          name: GovCloud Storage
          provider_name: Aurora Cloud
          service_model: SERVERLESS
          deployment_model: GOV_COMMUNITY
          assessment_budget_usd: 100000.0
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: POST /offerings/${offering_id}/data-categories
        payload:
          category_code: PII
          confidentiality_impact: MODERATE
          integrity_impact: MODERATE
          availability_impact: LOW
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          dc_pii_id: $.data.id
      assert:
      - 'first call: HTTP 400 with error_id ERR_INVALID_REQUEST — CRITICAL is not in {LOW, MODERATE, HIGH}'
      - 'second call: HTTP 400 with error_id ERR_INVALID_REQUEST — assessment_budget_usd must be > 0'
      - 'third call: HTTP 400 with error_id ERR_INVALID_REQUEST — SERVERLESS is not in {IAAS, PAAS, SAAS}'
