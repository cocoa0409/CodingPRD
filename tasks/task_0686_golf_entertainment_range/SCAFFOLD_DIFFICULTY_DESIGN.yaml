              as: FrontDesk
              captures: { sess_id: $.data.id }
            - call: "POST /golf/sessions/${sess_id}/shots"
              payload: { points: 10 }
              as: FrontDesk
            - call: "POST /golf/sessions/${sess_id}/shots"
              payload: { points: 11 }
              as: FrontDesk
            - call: "POST /golf/sessions/${sess_id}/shots"
              payload: { points: 12 }
              as: FrontDesk
            - call: "POST /golf/sessions/${sess_id}/shots"
