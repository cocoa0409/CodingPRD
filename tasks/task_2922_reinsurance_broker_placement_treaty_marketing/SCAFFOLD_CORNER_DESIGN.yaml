          - state_machines.BrokerageDisclosure.transitions[DISCLOSED->REJECTED]
          - entities.Program.fields.disclosure_acknowledged
          - validations[priority=41]
          - errors.ERR_DISCLOSURE_NOT_ACKNOWLEDGED
