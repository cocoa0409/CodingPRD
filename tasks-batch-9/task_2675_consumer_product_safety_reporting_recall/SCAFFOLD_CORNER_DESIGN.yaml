            - "HazardPattern.${hp_id}.pattern_confirmed == false purely on MIN_INCIDENT_COUNT 3, even though MIN_CONCENTRATION 0.6 and MIN_RISK_INDEX 10.0 are both cleared"
            - "HazardPattern.${hp_id}.pattern_status remains ANALYZED and version is unchanged"

      - name: pattern_creation_clusters_qualifying_incidents_and_supersedes_the_prior_pattern
        claim_type: Side Effect Execution
        grounds:
          - state_machines[HazardPattern].transitions[null -> ANALYZED]
          - state_machines[Incident].transitions[CLASSIFIED -> CLUSTERED]
          - state_machines[HazardPattern].terminal_states
        distinguishing_aspect: |
          A single POST fires four side effects at once on three different
          entities: it computes the index, clusters CLASSIFIED incidents,
          RE-POINTS incidents that were already clustered under the previous
          pattern, and supersedes that previous pattern. Superseding without
          re-pointing (or re-pointing without superseding) leaves an incident
          attached to a terminal pattern, which this instance catches by asserting
          both halves of the swap on one row.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z"
            - "one ProductModel, three classified verified BURN incidents, and one hazard pattern already analysed over them"
          setup_api_calls:
