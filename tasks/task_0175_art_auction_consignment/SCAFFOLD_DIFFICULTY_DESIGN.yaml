  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_on_payment
        grounds:
          - validations[priority=7]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair: state (priority 7, ERR_INVALID_STATE) vs
          business_fiscal (priority 14, ERR_CREDIT_LIMIT_EXCEEDED). A payment
          on an already-PAID invoice with a zero-amount body violates BOTH the
          state precondition (not ISSUED) and the fiscal rule (amount<=0); the
          server returns the higher-priority ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Invoice fully PAID (status PAID); a second payment with amount_cents 0 is attempted."
          setup_api_calls:
            - call: "POST /premium-schedules"
              payload: { name: "Standard", tiers: [ { upper_bound_cents: 3000000, rate_bps: 2600 }, { upper_bound_cents: 60000000, rate_bps: 2000 }, { upper_bound_cents: null, rate_bps: 1450 } ] }
