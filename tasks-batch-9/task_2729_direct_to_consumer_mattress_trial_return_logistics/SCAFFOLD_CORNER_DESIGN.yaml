              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /comfort-exchanges/${ex_id}/approve"
              payload: { expected_trial_order_version: "${order_v0}" }
              as: TrialSupportAgent
            - call: "GET /trial-orders/${order_id}"
              payload: {}
