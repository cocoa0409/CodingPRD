scenario: "2291. Elevator Modernization Project Delivery (elevator modernization contractor): existing equipment survey with controller, machine and door equipment condition assessment, modernization scope options from controller-only to full replacement with code-triggered upgrades, code compliance triggers such as fire service, seismic and door protection requirements, building downtime planning with car-by-car outage sequencing in occupied buildings, long-lead controller and machine procurement with staging space, inspection and acceptance testing coordination with the jurisdiction, temporary service and tenant communication plans, warranty transition into a maintenance contract"
domain_name: elevator-modernization-delivery
api_prefix: ""   # flat topology: every entity is a top-level collection (/projects, /elevator-cars, /scope-options, ...); FKs travel in request bodies, never in URL nesting

complexity_profile:
  primary_archetype: temporal windowing
  secondary_archetype: pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential      # OutageWindow.predecessor_window_id -> OutageWindow.id (car-by-car outage sequencing chain)
    - cross_aggregate       # StagingReservation -> ProcurementOrder -> ScopeOption -> ElevatorCar -> ModernizationProject capacity pool
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  notes: |
    Density sources, in the order they bite:
      (1) ScopeOption pricing is a pinned evaluation order (code-upgrade surcharge rounded PER TRIGGER, then
          escalation keyed on procurement lead time, then a volume discount keyed on the POST-escalation
          subtotal) — reading the prose in the "obvious" order yields a different total.
      (2) EquipmentSurvey condition scoring has two bases (renormalize over observed components vs impute
          NOT_OBSERVED as FAILED) that disagree on both the score and the recommended scope tier, and the
          tier feeds a hard approval gate — so the wrong basis produces a wrongly-approvable scope option.
      (3) Two resources are occupied over intervals with DIFFERENT interval geometry: staging square footage
          (half-open, additive aggregate capacity, adjacency legal) and group outage windows (buffer-inflated,
          pairwise, adjacency illegal).
      (4) ElevatorCar carries two independent state dimensions (work_status x compliance_status) that advance
          on different triggers, and downtime_posture is a derived project-level gate computed from groups,
          outages and staging at once.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: authority-having-jurisdiction display name
      - name: code_edition_year
        type: integer
        source: input
        description: elevator safety code edition the AHJ enforces
        constraints: "2000..2030"
      - name: fire_service_required
        type: boolean
        source: input
        description: when true every ScopeOption created under this AHJ gets a FIRE_SERVICE_PHASE_I_II CodeTrigger
      - name: seismic_zone
        type: integer
        source: input
        description: seismic design category; zone >= 3 triggers SEISMIC_RESTRAINT on machine-touching tiers
        constraints: "0..4"
      - name: door_protection_required
        type: boolean
        source: input
        description: when true a degraded door assessment triggers DOOR_PROTECTION_REOPENING
      - name: inspection_lead_days
        type: integer
        source: input
        description: minimum whole days between the logical clock and a requested/rescheduled inspection date
        default: 10
        constraints: ">= 0"
      - name: witness_test_required
        type: boolean
        source: input
        description: when true an InspectionAppointment must be created with witness_requested true
        default: false
      - name: reinspection_extension_hours
        type: integer
        source: input
        description: hours added to a reopened OutageWindow.end_at when an inspection is recorded FAILED
        default: 24
        constraints: ">= 0"
      - name: permit_surcharge_pct
        type: number
        source: input
        description: permit surcharge applied to each priced CodeTrigger cost, rounded per trigger
        default: 0.0000
        constraints: "0.0000..0.2500, 4 decimal places"

  - name: ModernizationProject
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; AHJ whose code edition, lead days and surcharge govern this project"
      - name: building_name
        type: string
        source: input
        description: building the modernization is delivered in
      - name: occupancy_type
        type: enum
        source: input
        description: whether the building is occupied during the modernization
        constraints: "OCCUPIED | VACANT"
      - name: contract_value_cents
        type: integer
        source: input
        description: contracted ceiling; the sum of APPROVED ScopeOption totals may not exceed it
        constraints: ">= 0"
      - name: staging_area_sqft
        type: integer
        source: input
        description: on-site staging floor area available for long-lead equipment
        constraints: ">= 1"
      - name: max_concurrent_outages
        type: integer
        source: input
        description: ceiling on simultaneously ACTIVE OutageWindows across the project
        constraints: ">= 1"
      - name: outage_buffer_hours
        type: integer
        source: input
        description: separation required between two outage windows on cars in the same ElevatorGroup
        default: 4
        constraints: ">= 0"
      - name: tenant_notice_lead_hours
        type: integer
        source: input
        description: minimum advance-notice lead an OutageWindow must carry before it may be activated
        default: 72
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: project delivery phase, driven by child aggregates
        default: SURVEY
        constraints: "SURVEY | SCOPING | EXECUTION | CLOSEOUT | COMPLETED"
      - name: car_count
        type: integer
        source: computed
        description: count of ElevatorCar rows whose project_id equals this project id
        default: 0
      - name: approved_scope_value_cents
        type: integer
        source: computed
        description: "conserved ledger: SUM(ScopeOption.total_price_cents) over options with status == APPROVED whose car belongs to this project"
        default: 0
      - name: staging_committed_sqft
        type: integer
        source: computed
        description: "conserved ledger: SUM(StagingReservation.sqft) over reservations with status == HELD whose order chain resolves to this project (interval-independent by design)"
        default: 0
      - name: active_outage_count
        type: integer
        source: computed
        description: count of OutageWindow rows with status == ACTIVE whose car belongs to this project
        default: 0
      - name: downtime_posture
        type: enum
        source: computed
        description: derived gate over groups, outages and staging; FROZEN blocks outage activation, procurement, staging and testing
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"

  - name: ElevatorGroup
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ModernizationProject.id; the project this bank of cars belongs to"
      - name: group_label
        type: string
        source: input
        description: hoistway group label, e.g. "Low Rise A"
      - name: min_cars_in_service
        type: integer
        source: input
        description: service floor; the count of non-OUTAGE_ACTIVE cars in this group may not drop below it via an operator-initiated activation
        constraints: ">= 0"
      - name: car_count
        type: integer
        source: computed
        description: count of ElevatorCar rows whose group_id equals this group id
        default: 0
      - name: cars_in_service
        type: integer
        source: computed
        description: count of ElevatorCar rows in this group whose work_status != OUTAGE_ACTIVE (TESTING counts as in service)
        default: 0

  - name: ElevatorCar
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ModernizationProject.id; owning project"
      - name: group_id
        type: string
        source: input
        description: "FK -> ElevatorGroup.id; hoistway group used for outage buffering and the service floor"
      - name: car_designation
        type: string
        source: input
        description: car marking, e.g. "Car 3"
      - name: rated_load_lbs
        type: integer
        source: input
        description: rated capacity of the existing car
        constraints: ">= 500"
      - name: controller_type_legacy
        type: enum
        source: input
        description: existing controller technology found on site
        constraints: "RELAY | SOLID_STATE_ANALOG | MICROPROCESSOR"
      - name: machine_type
        type: enum
        source: input
        description: existing hoist machine type; GEARED machines trigger MACHINE_BRAKE_MONITOR on machine-touching tiers
        constraints: "GEARED | GEARLESS | MRL_GEARLESS"
      - name: duty_rank
        type: integer
        source: input
        description: operator-assigned sequencing rank within the group (lower goes out first); pure ordering input, never an identity
        constraints: ">= 1"
      - name: work_status
        type: enum
        source: system
        description: physical delivery dimension of the car; advances independently of compliance_status
        default: SURVEY_PENDING
        constraints: "SURVEY_PENDING | SURVEYED | SCOPED | PROCURING | OUTAGE_ACTIVE | TESTING | ACCEPTED | IN_WARRANTY | UNDER_CONTRACT"
      - name: compliance_status
        type: enum
        source: system
        description: code-compliance dimension of the car; advances independently of work_status
        default: NOT_EVALUATED
        constraints: "NOT_EVALUATED | TRIGGERS_OPEN | TRIGGERS_CLEARED | CODE_ACCEPTED"
      - name: condition_score
        type: number
        source: computed
        description: countersigned composite condition score (IMPUTED_FAILED basis), 2 decimal places; null until a survey is countersigned
        default: null
      - name: recommended_scope_tier
        type: enum
        source: computed
        description: tier recommended by the countersigned score; a ScopeOption may not be APPROVED below this tier's invasiveness rank
        default: null
        constraints: "CONTROLLER_ONLY | CONTROLLER_DOOR | CONTROLLER_MACHINE | FULL_REPLACEMENT | null"
      - name: approved_scope_option_id
        type: string
        source: computed
        description: denormalized pointer (NOT a declared FK) to the ScopeOption for this car whose status == APPROVED; null when none; discoverable via GET /scope-options with car_id filter
        default: null

  - name: EquipmentSurvey
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> ElevatorCar.id; car whose existing equipment was surveyed"
      - name: surveyed_by_user_id
        type: string
        source: system
        description: X-User-ID of the SurveyTechnician who submitted the survey
      - name: countersigned_by_user_id
        type: string
        source: system
        description: X-User-ID of the countersigning SurveyTechnician; must differ from surveyed_by_user_id
        default: null
      - name: controller_condition
        type: enum
        source: input
        description: controller assessment; weight 0.45
        constraints: "EXCELLENT | GOOD | FAIR | POOR | FAILED | NOT_OBSERVED"
      - name: machine_condition
        type: enum
        source: input
        description: hoist machine assessment; weight 0.30
        constraints: "EXCELLENT | GOOD | FAIR | POOR | FAILED | NOT_OBSERVED"
      - name: door_equipment_condition
        type: enum
        source: input
        description: door operator / protective device assessment; weight 0.25
        constraints: "EXCELLENT | GOOD | FAIR | POOR | FAILED | NOT_OBSERVED"
      - name: provisional_score
        type: number
        source: computed
        description: OBSERVED_ONLY composite computed at submit (weights renormalized over observed components), 2 decimal places
      - name: final_score
        type: number
        source: computed
        description: IMPUTED_FAILED composite computed at countersign (NOT_OBSERVED scores 0 against the full 1.00 denominator), 2 decimal places; null until countersigned
        default: null
      - name: recommended_scope_tier
        type: enum
        source: computed
        description: tier derived from final_score thresholds at countersign; copied onto ElevatorCar.recommended_scope_tier
        default: null
        constraints: "CONTROLLER_ONLY | CONTROLLER_DOOR | CONTROLLER_MACHINE | FULL_REPLACEMENT | null"
      - name: status
        type: enum
        source: system
        description: survey lifecycle
        default: SUBMITTED
        constraints: "SUBMITTED | COUNTERSIGNED | VOID"

  - name: ScopeOption
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> ElevatorCar.id; car this modernization scope prices"
      - name: tier
        type: enum
        source: input
        description: modernization depth; invasiveness ranks are CONTROLLER_ONLY 1, CONTROLLER_DOOR 2, CONTROLLER_MACHINE 3, FULL_REPLACEMENT 4
        constraints: "CONTROLLER_ONLY | CONTROLLER_DOOR | CONTROLLER_MACHINE | FULL_REPLACEMENT"
      - name: base_price_cents
        type: integer
        source: input
        description: contractor base price for the tier before code upgrades, escalation and discount
        constraints: ">= 0"
      - name: code_upgrade_cents
        type: integer
        source: computed
        description: sum over CodeTriggers with status == PRICED of round_half_up(cost_cents * (1 + jurisdiction.permit_surcharge_pct)), rounded PER TRIGGER then summed
        default: 0
      - name: max_lead_time_days
        type: integer
        source: computed
        description: MAX(ProcurementOrder.lead_time_days) over this option's orders with status != CANCELLED; 0 when that set is empty
        default: 0
      - name: escalation_pct
        type: number
        source: computed
        description: escalation rate selected by max_lead_time_days bucket, 4 decimal places
        default: 0.0000
      - name: escalation_fee_cents
        type: integer
        source: computed
        description: round_half_up((base_price_cents + code_upgrade_cents) * escalation_pct)
        default: 0
      - name: volume_discount_pct
        type: number
        source: computed
        description: discount rate selected by the POST-escalation subtotal tier, 4 decimal places
        default: 0.0000
      - name: volume_discount_cents
        type: integer
        source: computed
        description: round_half_up(pre_discount_subtotal_cents * volume_discount_pct)
        default: 0
      - name: total_price_cents
        type: integer
        source: computed
        description: base_price_cents + code_upgrade_cents + escalation_fee_cents - volume_discount_cents; frozen once status == APPROVED
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: number of REJECTED -> DRAFT revisions applied to this option
        default: 0
      - name: rejection_note
        type: string
        source: input
        description: note recorded by the building representative on rejection
        default: null
      - name: status
        type: enum
        source: system
        description: scope negotiation lifecycle; REJECTED -> DRAFT closes the revision loop
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED"

  - name: CodeTrigger
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: scope_option_id
        type: string
        source: input
        description: "FK -> ScopeOption.id; option whose tier and jurisdiction synthesized this trigger (created only as a cascade of POST /scope-options)"
      - name: trigger_type
        type: enum
        source: system
        description: code compliance upgrade forced by this modernization
        constraints: "FIRE_SERVICE_PHASE_I_II | SEISMIC_RESTRAINT | DOOR_PROTECTION_REOPENING | MACHINE_BRAKE_MONITOR"
      - name: source_rule
        type: string
        source: system
        description: literal predicate that synthesized the trigger, e.g. "jurisdiction.seismic_zone >= 3 AND tier IN {CONTROLLER_MACHINE, FULL_REPLACEMENT}"
      - name: status
        type: enum
        source: system
        description: trigger disposition; REQUIRED blocks scope approval
        default: REQUIRED
        constraints: "REQUIRED | PRICED | WAIVED | SATISFIED"
      - name: cost_cents
        type: integer
        source: input
        description: pre-surcharge cost quoted for the upgrade; null until priced
        default: null
        constraints: ">= 0"
      - name: waiver_reference
        type: string
        source: input
        description: AHJ waiver document reference; null unless status == WAIVED
        default: null

  - name: ProcurementOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: scope_option_id
        type: string
        source: input
        description: "FK -> ScopeOption.id; option this long-lead item is bought for"
      - name: item_type
        type: enum
        source: input
        description: long-lead equipment class
        constraints: "CONTROLLER | MACHINE | DOOR_OPERATOR | POWER_UNIT"
      - name: lead_time_days
        type: integer
        source: input
        description: quoted manufacturing lead time; feeds ScopeOption.max_lead_time_days
        constraints: ">= 0"
      - name: required_staging_sqft
        type: integer
        source: input
        description: staging floor area the delivered item occupies
        constraints: ">= 0"
      - name: ordered_at
        type: datetime
        source: system
        description: logical-clock instant the order was issued; null while DRAFT
        default: null
      - name: promised_delivery_date
        type: datetime
        source: computed
        description: ordered_at + lead_time_days whole days; null while DRAFT
        default: null
      - name: staging_reservation_id
        type: string
        source: computed
        description: denormalized pointer (NOT a declared FK) to the StagingReservation consumed at receive; null before receive
        default: null
      - name: status
        type: enum
        source: system
        description: procurement lifecycle
        default: DRAFT
        constraints: "DRAFT | ORDERED | STAGED | INSTALLED | CANCELLED"

  - name: StagingReservation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: procurement_order_id
        type: string
        source: input
        description: "FK -> ProcurementOrder.id; order whose delivered item occupies the staging area"
      - name: sqft
        type: integer
        source: input
        description: staging floor area held over the interval
        constraints: ">= 1"
      - name: hold_start
        type: datetime
        source: input
        description: inclusive start of the half-open occupation interval [hold_start, hold_end)
      - name: hold_end
        type: datetime
        source: input
        description: exclusive end of the half-open occupation interval; must be strictly after hold_start
      - name: status
        type: enum
        source: system
        description: reservation lifecycle; only HELD rows count toward project.staging_committed_sqft
        default: HELD
        constraints: "HELD | RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the hold was released
        default: null

  - name: OutageWindow
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> ElevatorCar.id; car taken out of service during the window"
      - name: predecessor_window_id
        type: string
        source: input
        description: "FK -> OutageWindow.id; self-referential sequencing link that must be COMPLETED before this window may be activated; null for the first car in the sequence"
        default: null
      - name: start_at
        type: datetime
        source: input
        description: planned start of the outage
      - name: end_at
        type: datetime
        source: input
        description: planned end of the outage; must be strictly after start_at
      - name: extension_hours
        type: integer
        source: computed
        description: cumulative hours added to end_at by reinspection reopens
        default: 0
      - name: temporary_service_plan
        type: enum
        source: input
        description: temporary vertical-transportation plan in force during the outage
        constraints: "STAIRS_ONLY | ADJACENT_CAR | ATTENDANT_SERVICE"
      - name: advance_notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant of the FIRST tenant notice; later notices do not move it
        default: null
      - name: notice_count
        type: integer
        source: computed
        description: number of tenant notices sent for this window
        default: 0
      - name: notice_lead_hours
        type: number
        source: computed
        description: (start_at - advance_notice_sent_at) in hours, 2 decimal places; null until the first notice
        default: null
      - name: status
        type: enum
        source: system
        description: outage lifecycle; a reinspection failure reopens COMPLETED -> ACTIVE
        default: PLANNED
        constraints: "PLANNED | ACTIVE | COMPLETED | CANCELLED"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent activation
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent completion
        default: null

  - name: InspectionAppointment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> ElevatorCar.id; car presented for inspection and acceptance testing"
      - name: requested_date
        type: datetime
        source: input
        description: date the contractor asks the AHJ for
      - name: witness_requested
        type: boolean
        source: input
        description: whether a witnessed acceptance test was requested
        default: false
      - name: scheduled_at
        type: datetime
        source: system
        description: instant the AHJ scheduled; null while REQUESTED
        default: null
      - name: recorded_by_jurisdiction_id
        type: string
        source: system
        description: X-User-ID of the AHJInspector that recorded the result (equals the governing Jurisdiction id)
        default: null
      - name: lead_days_at_request
        type: integer
        source: computed
        description: floor((requested_date - logical clock at creation) / 86400 seconds)
      - name: reschedule_count
        type: integer
        source: computed
        description: number of SCHEDULED -> SCHEDULED reschedules applied
        default: 0
      - name: punch_list_count
        type: integer
        source: input
        description: open punch-list items recorded with the result
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: appointment lifecycle; SCHEDULED forks into PASSED / CONDITIONAL / FAILED with divergent side-effect sets
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | PASSED | CONDITIONAL | FAILED | CANCELLED"

  - name: WarrantyTransition
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: car_id
        type: string
        source: input
        description: "FK -> ElevatorCar.id; accepted car entering warranty"
      - name: maintenance_contract_id
        type: string
        source: input
        description: "FK -> MaintenanceContract.id; contract the warranty rolls into; null until enrollment"
        default: null
      - name: warranty_months
        type: integer
        source: input
        description: warranty length in calendar months from warranty_start
        constraints: "12..60"
      - name: warranty_start
        type: datetime
        source: system
        description: logical-clock instant at creation
      - name: warranty_end
        type: datetime
        source: computed
        description: warranty_start plus warranty_months calendar months, clamped to the last day of the target month
      - name: provisional_credit_cents
        type: integer
        source: computed
        description: unexpired-warranty credit computed at enrollment on the THIRTY_360 basis
        default: null
      - name: final_credit_cents
        type: integer
        source: computed
        description: unexpired-warranty credit recomputed at contract activation on the ACTUAL_CALENDAR basis
        default: null
      - name: status
        type: enum
        source: system
        description: warranty rollover lifecycle
        default: PENDING
        constraints: "PENDING | ENROLLED | UNDER_CONTRACT | LAPSED"

  - name: MaintenanceContract
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> ModernizationProject.id; project whose modernized cars the contract covers"
      - name: monthly_base_cents
        type: integer
        source: input
        description: per-car monthly base rate before tier multiplier and group factor
        constraints: ">= 0"
      - name: coverage_start
        type: datetime
        source: input
        description: contract coverage anchor; also the credit proration anchor date
      - name: monthly_total_cents
        type: integer
        source: computed
        description: sum over covered cars of the per-car rate, each rounded before summing
        default: 0
      - name: cars_covered
        type: integer
        source: computed
        description: count of WarrantyTransitions on this contract with status == UNDER_CONTRACT
        default: 0
      - name: total_final_credit_cents
        type: integer
        source: computed
        description: sum of final_credit_cents over this contract's UNDER_CONTRACT transitions
        default: 0
      - name: status
        type: enum
        source: system
        description: contract lifecycle
        default: DRAFT
        constraints: "DRAFT | ACTIVE"

state_machines:
  - entity: ModernizationProject
    dimension: status
    initial_state: SURVEY
    terminal_states: [COMPLETED]
    shape: compound
    transitions:
      - from: SURVEY
        to: SCOPING
        trigger: "system, bubbled up from POST /equipment-surveys/{survey_id}/countersign"
        actor: system
        preconditions: ["project.status == SURVEY", "the countersigned survey's car belongs to this project"]
        side_effects: ["project.status = SCOPING", "project.updated_at refreshed", "project.version incremented"]
        note: fires on the FIRST countersigned survey of the project only
      - from: SCOPING
        to: EXECUTION
        trigger: "system, bubbled up from POST /scope-options/{scope_option_id}/approve"
        actor: system
        preconditions: ["project.status == SCOPING"]
        side_effects: ["project.status = EXECUTION", "project.version incremented"]
      - from: EXECUTION
        to: CLOSEOUT
        trigger: "system, bubbled up from POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED or CONDITIONAL"
        actor: system
        preconditions: ["project.car_count >= 1", "every ElevatorCar of the project has work_status IN {ACCEPTED, IN_WARRANTY, UNDER_CONTRACT}"]
        side_effects: ["project.status = CLOSEOUT", "project.version incremented"]
      - from: CLOSEOUT
        to: EXECUTION
        trigger: "system, bubbled up from POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED"
        actor: system
        preconditions: ["project.status == CLOSEOUT", "the failing appointment's car reverted to work_status OUTAGE_ACTIVE"]
        side_effects: ["project.status = EXECUTION", "project.version incremented"]
        note: revert leg; keeps the compound aggregate honest after a reinspection failure
      - from: CLOSEOUT
        to: COMPLETED
        trigger: "system, bubbled up from POST /maintenance-contracts/{maintenance_contract_id}/activate"
        actor: system
        preconditions: ["project.status == CLOSEOUT", "the activated contract's cars_covered == project.car_count"]
        side_effects: ["project.status = COMPLETED", "project.version incremented"]

  - entity: ElevatorCar
    dimension: work_status
    initial_state: SURVEY_PENDING
    terminal_states: [UNDER_CONTRACT]
    shape: parallel
    note: "first of two independent dimensions on ElevatorCar; work_status advances on physical delivery triggers and NEVER on code-compliance triggers"
    transitions:
      - from: SURVEY_PENDING
        to: SURVEYED
        trigger: "POST /equipment-surveys/{survey_id}/countersign"
        actor: SurveyTechnician
        preconditions: ["survey.status == SUBMITTED", "survey.car_id == car.id"]
        side_effects: ["car.condition_score = survey.final_score", "car.recommended_scope_tier = survey.recommended_scope_tier", "car.work_status = SURVEYED", "car.compliance_status UNCHANGED"]
      - from: SURVEYED
        to: SURVEY_PENDING
        trigger: "POST /equipment-surveys (a replacement survey for the same car)"
        actor: SurveyTechnician
        preconditions: ["car.work_status IN {SURVEY_PENDING, SURVEYED}"]
        side_effects: ["prior survey.status = VOID", "car.condition_score = null", "car.recommended_scope_tier = null", "car.work_status = SURVEY_PENDING"]
      - from: SURVEYED
        to: SCOPED
        trigger: "POST /scope-options/{scope_option_id}/submit"
        actor: ProjectManager
        preconditions: ["scope_option.status == DRAFT", "scope_option.car_id == car.id"]
        side_effects: ["car.work_status = SCOPED", "car.compliance_status UNCHANGED"]
      - from: SCOPED
        to: PROCURING
        trigger: "POST /scope-options/{scope_option_id}/approve"
        actor: BuildingRepresentative
        preconditions: ["scope_option.status == SUBMITTED", "no CodeTrigger of the option has status == REQUIRED", "rank(option.tier) >= rank(car.recommended_scope_tier)"]
        side_effects: ["car.approved_scope_option_id = scope_option.id", "car.work_status = PROCURING", "project.approved_scope_value_cents += option.total_price_cents"]
      - from: PROCURING
        to: SCOPED
        trigger: "POST /scope-options/{scope_option_id}/rescind (cascade link 5)"
        actor: system
        preconditions: ["the rescinded option was the car's approved_scope_option_id"]
        side_effects: ["car.approved_scope_option_id = null", "car.work_status = SCOPED", "car.compliance_status = NOT_EVALUATED"]
      - from: PROCURING
        to: OUTAGE_ACTIVE
        trigger: "POST /outage-windows/{outage_window_id}/activate"
        actor: ProjectManager
        preconditions: ["window.status == PLANNED", "window.car_id == car.id"]
        side_effects: ["car.work_status = OUTAGE_ACTIVE", "group.cars_in_service recomputed", "project.active_outage_count recomputed", "project.downtime_posture recomputed"]
      - from: OUTAGE_ACTIVE
        to: TESTING
        trigger: "POST /elevator-cars/{car_id}/begin-testing"
        actor: ProjectManager
        preconditions: ["car.work_status == OUTAGE_ACTIVE", "the car's latest OutageWindow by completed_at DESC, created_at ASC has status == COMPLETED", "the car's approved ScopeOption has >= 1 ProcurementOrder with status != CANCELLED and ALL such orders have status == INSTALLED", "project.downtime_posture != FROZEN"]
        side_effects: ["car.work_status = TESTING", "group.cars_in_service recomputed (TESTING counts as in service)", "project.downtime_posture recomputed"]
      - from: TESTING
        to: ACCEPTED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED or CONDITIONAL"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "appointment.car_id == car.id"]
        side_effects: ["car.work_status = ACCEPTED", "project.status bubble-up evaluated"]
      - from: TESTING
        to: OUTAGE_ACTIVE
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED (cascade link 2)"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "appointment.car_id == car.id"]
        side_effects: ["car.work_status = OUTAGE_ACTIVE", "car.compliance_status = TRIGGERS_OPEN", "the car's latest COMPLETED OutageWindow is reopened (cascade link 3)", "group.cars_in_service recomputed (cascade link 4)", "project.downtime_posture recomputed (cascade link 5)"]
      - from: ACCEPTED
        to: OUTAGE_ACTIVE
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED on a follow-up appointment"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.work_status == ACCEPTED"]
        side_effects: ["car.work_status = OUTAGE_ACTIVE", "car.compliance_status = TRIGGERS_OPEN", "reopen + group + posture cascade as above", "project.status CLOSEOUT -> EXECUTION when applicable"]
      - from: ACCEPTED
        to: IN_WARRANTY
        trigger: "POST /warranty-transitions"
        actor: ServiceManager
        preconditions: ["car.work_status == ACCEPTED", "car.compliance_status == CODE_ACCEPTED"]
        side_effects: ["car.work_status = IN_WARRANTY", "WarrantyTransition created in PENDING with warranty_start = logical clock"]
      - from: IN_WARRANTY
        to: UNDER_CONTRACT
        trigger: "POST /maintenance-contracts/{maintenance_contract_id}/activate"
        actor: ServiceManager
        preconditions: ["contract.status == DRAFT", "the car's WarrantyTransition.status == ENROLLED on this contract"]
        side_effects: ["car.work_status = UNDER_CONTRACT", "transition.status = UNDER_CONTRACT", "transition.final_credit_cents computed on ACTUAL_CALENDAR basis"]

  - entity: ElevatorCar
    dimension: compliance_status
    initial_state: NOT_EVALUATED
    terminal_states: []
    shape: cyclic
    note: "second independent dimension on the same row; advances on code-compliance triggers and NEVER on outage/procurement triggers"
    transitions:
      - from: NOT_EVALUATED
        to: TRIGGERS_OPEN
        trigger: "POST /scope-options (synthesized trigger set is non-empty)"
        actor: ProjectManager
        preconditions: ["at least one CodeTrigger was synthesized for the new option"]
        side_effects: ["car.compliance_status = TRIGGERS_OPEN", "car.work_status UNCHANGED"]
      - from: NOT_EVALUATED
        to: TRIGGERS_CLEARED
        trigger: "POST /scope-options (synthesized trigger set is empty)"
        actor: ProjectManager
        preconditions: ["zero CodeTriggers were synthesized for the new option"]
        side_effects: ["car.compliance_status = TRIGGERS_CLEARED", "car.work_status UNCHANGED"]
        note: empty-set path; a lenient AHJ plus CONTROLLER_ONLY tier clears compliance with no trigger rows at all
      - from: TRIGGERS_OPEN
        to: TRIGGERS_CLEARED
        trigger: "POST /code-triggers/{code_trigger_id}/price or POST /code-triggers/{code_trigger_id}/waive"
        actor: ProjectManager | AHJInspector
        preconditions: ["after this transition zero CodeTriggers of the car's live ScopeOption have status == REQUIRED"]
        side_effects: ["car.compliance_status = TRIGGERS_CLEARED", "car.work_status UNCHANGED"]
      - from: TRIGGERS_CLEARED
        to: TRIGGERS_OPEN
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED"]
        side_effects: ["car.compliance_status = TRIGGERS_OPEN", "every CodeTrigger of the car's live option with status == PRICED reverts to REQUIRED", "WAIVED triggers stay WAIVED"]
      - from: TRIGGERS_CLEARED
        to: CODE_ACCEPTED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.compliance_status == TRIGGERS_CLEARED"]
        side_effects: ["car.compliance_status = CODE_ACCEPTED", "every CodeTrigger of the car's live option with status IN {PRICED, WAIVED} becomes SATISFIED"]
        note: "result CONDITIONAL deliberately leaves compliance_status at TRIGGERS_CLEARED, which is what blocks POST /warranty-transitions"
      - from: CODE_ACCEPTED
        to: TRIGGERS_OPEN
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED on a follow-up appointment"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.work_status == ACCEPTED"]
        side_effects: ["car.compliance_status = TRIGGERS_OPEN", "SATISFIED triggers revert to REQUIRED"]
      - from: TRIGGERS_CLEARED
        to: NOT_EVALUATED
        trigger: "POST /scope-options/{scope_option_id}/rescind (cascade link 5)"
        actor: system
        preconditions: ["the car has no ScopeOption with status IN {DRAFT, SUBMITTED, APPROVED} after the rescind"]
        side_effects: ["car.compliance_status = NOT_EVALUATED"]
      - from: TRIGGERS_OPEN
        to: NOT_EVALUATED
        trigger: "POST /scope-options/{scope_option_id}/rescind (cascade link 5)"
        actor: system
        preconditions: ["the car has no ScopeOption with status IN {DRAFT, SUBMITTED, APPROVED} after the rescind"]
        side_effects: ["car.compliance_status = NOT_EVALUATED"]

  - entity: EquipmentSurvey
    initial_state: SUBMITTED
    terminal_states: [COUNTERSIGNED, VOID]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: COUNTERSIGNED
        trigger: "POST /equipment-surveys/{survey_id}/countersign"
        actor: SurveyTechnician
        preconditions: ["survey.status == SUBMITTED", "X-User-ID != survey.surveyed_by_user_id"]
        side_effects: ["survey.final_score computed on IMPUTED_FAILED basis", "survey.recommended_scope_tier computed", "survey.countersigned_by_user_id = X-User-ID", "car.work_status SURVEY_PENDING -> SURVEYED", "project.status SURVEY -> SCOPING on the project's first countersign"]
      - from: SUBMITTED
        to: VOID
        trigger: "POST /equipment-surveys (a replacement survey for the same car)"
        actor: SurveyTechnician
        preconditions: ["car.work_status IN {SURVEY_PENDING, SURVEYED}"]
        side_effects: ["prior survey.status = VOID", "car.condition_score = null"]
      - from: COUNTERSIGNED
        to: VOID
        trigger: "POST /equipment-surveys (a replacement survey for the same car)"
        actor: SurveyTechnician
        preconditions: ["car.work_status IN {SURVEY_PENDING, SURVEYED}"]
        side_effects: ["prior survey.status = VOID", "car.condition_score = null", "car.recommended_scope_tier = null", "car.work_status = SURVEY_PENDING"]

  - entity: ScopeOption
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: cyclic
    note: "DRAFT -> SUBMITTED -> REJECTED -> DRAFT is the negotiation loop; revision_count caps it at 3"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scope-options/{scope_option_id}/submit"
        actor: ProjectManager
        preconditions: ["option.status == DRAFT"]
        side_effects: ["option.status = SUBMITTED", "car.work_status SURVEYED -> SCOPED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /scope-options/{scope_option_id}/approve"
        actor: BuildingRepresentative
        preconditions: ["option.status == SUBMITTED", "X-User-ID == car.project_id", "zero CodeTriggers of the option have status == REQUIRED", "rank(option.tier) >= rank(car.recommended_scope_tier)", "project.approved_scope_value_cents + option.total_price_cents <= project.contract_value_cents"]
        side_effects: ["option.status = APPROVED", "option pricing frozen (later ProcurementOrder writes no longer recompute it)", "project.approved_scope_value_cents += option.total_price_cents", "project.version incremented", "car.work_status SCOPED -> PROCURING", "car.approved_scope_option_id = option.id", "project.status SCOPING -> EXECUTION on the project's first approval"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /scope-options/{scope_option_id}/reject"
        actor: BuildingRepresentative
        preconditions: ["option.status == SUBMITTED", "X-User-ID == car.project_id"]
        side_effects: ["option.status = REJECTED", "option.rejection_note stored", "car.work_status UNCHANGED"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /scope-options/{scope_option_id}/revise"
        actor: ProjectManager
        preconditions: ["option.status == REJECTED", "option.revision_count < 3"]
        side_effects: ["option.status = DRAFT", "option.revision_count += 1", "option.base_price_cents replaced when supplied", "pricing recomputed in full"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /scope-options/{scope_option_id}/rescind (cascade origin)"
        actor: ProjectManager
        preconditions: ["option.status == APPROVED"]
        side_effects: ["option.status = SUPERSEDED (link 1)", "project.approved_scope_value_cents -= option.total_price_cents (link 1)", "project.version incremented", "every ProcurementOrder of the option with status IN {DRAFT, ORDERED, STAGED} -> CANCELLED (link 2, caused by link 1)", "each cancelled order's HELD StagingReservation -> RELEASED and project.staging_committed_sqft -= sqft (link 3, caused by link 2)", "project.downtime_posture recomputed from the new staging_committed_sqft (link 4, caused by link 3)", "car.work_status PROCURING -> SCOPED and car.compliance_status -> NOT_EVALUATED (link 5, caused by link 1)", "every PLANNED OutageWindow of that car -> CANCELLED (link 6, caused by link 5)"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /scope-options (a newer option is created for the same car)"
        actor: ProjectManager
        preconditions: ["a newer ScopeOption row for the same car_id is being created"]
        side_effects: ["prior option.status = SUPERSEDED", "one live option per car invariant preserved"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /scope-options (a newer option is created for the same car)"
        actor: ProjectManager
        preconditions: ["a newer ScopeOption row for the same car_id is being created"]
        side_effects: ["prior option.status = SUPERSEDED"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /scope-options (a newer option legitimately supersedes the approved one)"
        actor: ProjectManager
        preconditions: ["a newer ScopeOption row for the same car_id is being created", "expected_project_version == project.version"]
        side_effects: ["prior option.status = SUPERSEDED", "project.approved_scope_value_cents -= prior option.total_price_cents", "car.work_status PROCURING -> SCOPED", "project.version incremented"]
        note: "this legitimate supersede is exactly why POST /scope-options is OCC-guarded (see concurrency_rules)"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "POST /scope-options (a newer option is created for the same car)"
        actor: ProjectManager
        preconditions: ["a newer ScopeOption row for the same car_id is being created"]
        side_effects: ["prior option.status = SUPERSEDED"]

  - entity: CodeTrigger
    initial_state: REQUIRED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: REQUIRED
        to: PRICED
        trigger: "POST /code-triggers/{code_trigger_id}/price"
        actor: ProjectManager
        preconditions: ["trigger.status == REQUIRED"]
        side_effects: ["trigger.cost_cents stored", "trigger.status = PRICED", "owning option's code_upgrade_cents and downstream pricing recomputed ONLY when option.status IN {DRAFT, SUBMITTED}", "car.compliance_status TRIGGERS_OPEN -> TRIGGERS_CLEARED when no REQUIRED trigger remains"]
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /code-triggers/{code_trigger_id}/waive"
        actor: AHJInspector
        preconditions: ["trigger.status IN {REQUIRED, PRICED}", "X-User-ID == car.project.jurisdiction_id"]
        side_effects: ["trigger.waiver_reference stored", "trigger.status = WAIVED", "trigger cost excluded from code_upgrade_cents", "pricing recomputed when option.status IN {DRAFT, SUBMITTED}", "car.compliance_status TRIGGERS_OPEN -> TRIGGERS_CLEARED when no REQUIRED trigger remains"]
      - from: PRICED
        to: WAIVED
        trigger: "POST /code-triggers/{code_trigger_id}/waive"
        actor: AHJInspector
        preconditions: ["trigger.status == PRICED", "X-User-ID == car.project.jurisdiction_id"]
        side_effects: ["trigger.status = WAIVED", "its surcharged cost drops out of code_upgrade_cents when the option is still DRAFT or SUBMITTED"]
      - from: PRICED
        to: SATISFIED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED"
        actor: AHJInspector
        preconditions: ["the trigger belongs to the car's live ScopeOption"]
        side_effects: ["trigger.status = SATISFIED"]
      - from: WAIVED
        to: SATISFIED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED"
        actor: AHJInspector
        preconditions: ["the trigger belongs to the car's live ScopeOption"]
        side_effects: ["trigger.status = SATISFIED"]
      - from: PRICED
        to: REQUIRED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED"
        actor: AHJInspector
        preconditions: ["the trigger belongs to the car's live ScopeOption"]
        side_effects: ["trigger.status = REQUIRED", "car.compliance_status -> TRIGGERS_OPEN"]
      - from: SATISFIED
        to: REQUIRED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED on a follow-up appointment"
        actor: AHJInspector
        preconditions: ["the trigger belongs to the car's live ScopeOption"]
        side_effects: ["trigger.status = REQUIRED", "car.compliance_status CODE_ACCEPTED -> TRIGGERS_OPEN"]

  - entity: ProcurementOrder
    initial_state: DRAFT
    terminal_states: [INSTALLED, CANCELLED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /procurement-orders/{procurement_order_id}/issue"
        actor: ProjectManager
        preconditions: ["order.status == DRAFT", "owning ScopeOption.status == APPROVED", "project.downtime_posture != FROZEN"]
        side_effects: ["order.ordered_at = logical clock", "order.promised_delivery_date = ordered_at + lead_time_days days", "order.status = ORDERED"]
      - from: ORDERED
        to: STAGED
        trigger: "POST /procurement-orders/{procurement_order_id}/receive"
        actor: ProjectManager
        preconditions: ["order.status == ORDERED", "the supplied StagingReservation.status == HELD", "reservation.procurement_order_id == order.id"]
        side_effects: ["order.staging_reservation_id set", "order.status = STAGED"]
      - from: STAGED
        to: INSTALLED
        trigger: "POST /procurement-orders/{procurement_order_id}/install"
        actor: ProjectManager
        preconditions: ["order.status == STAGED", "project.downtime_posture != FROZEN"]
        side_effects: ["order.status = INSTALLED", "the linked StagingReservation HELD -> RELEASED", "project.staging_committed_sqft -= reservation.sqft", "project.downtime_posture recomputed"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /procurement-orders/{procurement_order_id}/cancel, or cascade link 2 of a scope rescind"
        actor: ProjectManager | system
        preconditions: ["order.status IN {DRAFT, ORDERED, STAGED}"]
        side_effects: ["order.status = CANCELLED", "any HELD StagingReservation of the order -> RELEASED", "project.staging_committed_sqft -= sqft", "owning option's max_lead_time_days and pricing recomputed when option.status IN {DRAFT, SUBMITTED}"]
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /procurement-orders/{procurement_order_id}/cancel, or cascade link 2 of a scope rescind"
        actor: ProjectManager | system
        preconditions: ["order.status IN {DRAFT, ORDERED, STAGED}"]
        side_effects: ["order.status = CANCELLED", "any HELD StagingReservation of the order -> RELEASED", "project.staging_committed_sqft -= sqft"]
      - from: STAGED
        to: CANCELLED
        trigger: "POST /procurement-orders/{procurement_order_id}/cancel, or cascade link 2 of a scope rescind"
        actor: ProjectManager | system
        preconditions: ["order.status IN {DRAFT, ORDERED, STAGED}"]
        side_effects: ["order.status = CANCELLED", "the linked HELD StagingReservation -> RELEASED", "project.staging_committed_sqft -= sqft", "project.downtime_posture recomputed"]

  - entity: StagingReservation
    initial_state: HELD
    terminal_states: [RELEASED]
    shape: linear
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /staging-reservations/{staging_reservation_id}/release, or cascade from order install / order cancel"
        actor: ProjectManager | system
        preconditions: ["reservation.status == HELD"]
        side_effects: ["reservation.status = RELEASED", "reservation.released_at = logical clock", "project.staging_committed_sqft -= reservation.sqft", "project.downtime_posture recomputed", "project.version incremented"]
        note: "compensating action for POST /staging-reservations; the staging_committed_sqft ledger must return to its pre-hold value"

  - entity: OutageWindow
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    shape: cyclic
    note: "COMPLETED is re-enterable: a FAILED reinspection reopens COMPLETED -> ACTIVE"
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /outage-windows/{outage_window_id}/activate"
        actor: ProjectManager
        preconditions:
          - "window.status == PLANNED"
          - "logical clock < window.end_at"
          - "window.predecessor_window_id is null OR the predecessor window's status == COMPLETED"
          - "group.cars_in_service AFTER this activation >= group.min_cars_in_service"
          - "window.advance_notice_sent_at is not null AND window.notice_lead_hours >= project.tenant_notice_lead_hours"
          - "project.occupancy_type == VACANT OR NOT (project.downtime_posture == RESTRICTED AND window.temporary_service_plan == STAIRS_ONLY)"
          - "project.active_outage_count < project.max_concurrent_outages"
          - "project.downtime_posture != FROZEN"
        side_effects: ["window.status = ACTIVE", "window.activated_at = logical clock", "car.work_status PROCURING -> OUTAGE_ACTIVE", "group.cars_in_service recomputed", "project.active_outage_count recomputed", "project.downtime_posture recomputed", "project.version incremented"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /outage-windows/{outage_window_id}/complete"
        actor: ProjectManager
        preconditions: ["window.status == ACTIVE"]
        side_effects: ["window.status = COMPLETED", "window.completed_at = logical clock", "project.active_outage_count recomputed", "project.downtime_posture recomputed", "car.work_status UNCHANGED (stays OUTAGE_ACTIVE until begin-testing)"]
      - from: COMPLETED
        to: ACTIVE
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED (cascade link 3)"
        actor: system
        preconditions: ["this is the car's COMPLETED window with the greatest completed_at, tie-broken by created_at ASC", "the car reverted to work_status OUTAGE_ACTIVE in link 2"]
        side_effects: ["window.status = ACTIVE", "window.extension_hours += jurisdiction.reinspection_extension_hours", "window.end_at += jurisdiction.reinspection_extension_hours", "project.active_outage_count recomputed (cascade link 4)", "group.cars_in_service recomputed (cascade link 4)", "project.downtime_posture recomputed (cascade link 5)"]
        note: "fallback when the car has NO COMPLETED window: no window is reopened and the car still reverts to OUTAGE_ACTIVE"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /outage-windows/{outage_window_id}/cancel, or cascade link 6 of a scope rescind"
        actor: ProjectManager | system
        preconditions: ["window.status == PLANNED"]
        side_effects: ["window.status = CANCELLED", "the window stops participating in buffer-conflict detection"]

  - entity: InspectionAppointment
    initial_state: REQUESTED
    terminal_states: [PASSED, CANCELLED]
    shape: branching
    note: "SCHEDULED forks into three results with disjoint side-effect sets; SCHEDULED -> SCHEDULED is the reschedule self-loop"
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/schedule"
        actor: AHJInspector
        preconditions: ["appointment.status == REQUESTED", "X-User-ID == car.project.jurisdiction_id", "floor((scheduled_at - logical clock)/86400) >= jurisdiction.inspection_lead_days"]
        side_effects: ["appointment.scheduled_at set", "appointment.status = SCHEDULED"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/reschedule"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "appointment.reschedule_count < 2", "floor((scheduled_at - logical clock)/86400) >= jurisdiction.inspection_lead_days"]
        side_effects: ["appointment.scheduled_at replaced", "appointment.reschedule_count += 1"]
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result PASSED"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.work_status IN {TESTING, ACCEPTED}", "X-User-ID == car.project.jurisdiction_id"]
        side_effects: ["appointment.status = PASSED", "appointment.recorded_by_jurisdiction_id = X-User-ID", "car.work_status TESTING -> ACCEPTED (no-op when already ACCEPTED)", "car.compliance_status -> CODE_ACCEPTED", "live option's PRICED and WAIVED triggers -> SATISFIED", "project.status EXECUTION -> CLOSEOUT when every car is ACCEPTED or later"]
      - from: SCHEDULED
        to: CONDITIONAL
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result CONDITIONAL"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.work_status IN {TESTING, ACCEPTED}", "punch_list_count >= 1", "X-User-ID == car.project.jurisdiction_id"]
        side_effects: ["appointment.status = CONDITIONAL", "appointment.punch_list_count stored", "car.work_status TESTING -> ACCEPTED", "car.compliance_status UNCHANGED (stays TRIGGERS_CLEARED, which blocks POST /warranty-transitions)", "CodeTriggers UNCHANGED", "project.status EXECUTION -> CLOSEOUT when every car is ACCEPTED or later"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspection-appointments/{inspection_appointment_id}/record-result with result FAILED (cascade origin)"
        actor: AHJInspector
        preconditions: ["appointment.status == SCHEDULED", "car.work_status IN {TESTING, ACCEPTED}", "X-User-ID == car.project.jurisdiction_id"]
        side_effects: ["appointment.status = FAILED and punch_list_count stored (link 1)", "car.work_status -> OUTAGE_ACTIVE and car.compliance_status -> TRIGGERS_OPEN, PRICED/SATISFIED triggers -> REQUIRED (link 2, caused by link 1)", "the car's latest COMPLETED OutageWindow -> ACTIVE with end_at += jurisdiction.reinspection_extension_hours (link 3, caused by link 2)", "group.cars_in_service and project.active_outage_count recomputed (link 4, caused by link 3)", "project.downtime_posture recomputed, reaching FROZEN when any group falls below min_cars_in_service (link 5, caused by link 4)", "project.status CLOSEOUT -> EXECUTION when applicable (link 6, caused by link 2)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /scope-options/{scope_option_id}/rescind (cascade) or POST /inspection-appointments/{inspection_appointment_id}/reschedule is not applicable"
        actor: system
        preconditions: ["appointment.status == REQUESTED", "the car's approved ScopeOption was rescinded"]
        side_effects: ["appointment.status = CANCELLED"]

  - entity: WarrantyTransition
    initial_state: PENDING
    terminal_states: [UNDER_CONTRACT, LAPSED]
    shape: branching
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /warranty-transitions/{warranty_transition_id}/enroll"
        actor: ServiceManager
        preconditions: ["transition.status == PENDING", "contract.status == DRAFT", "contract.project_id == car.project_id"]
        side_effects: ["transition.maintenance_contract_id set", "transition.provisional_credit_cents computed on the THIRTY_360 basis", "transition.status = ENROLLED"]
      - from: PENDING
        to: LAPSED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past warranty_end"
        actor: system
        preconditions: ["transition.status == PENDING", "new logical clock > transition.warranty_end"]
        side_effects: ["transition.status = LAPSED", "the car can no longer be enrolled with a warranty credit"]
      - from: ENROLLED
        to: UNDER_CONTRACT
        trigger: "POST /maintenance-contracts/{maintenance_contract_id}/activate"
        actor: ServiceManager
        preconditions: ["transition.status == ENROLLED", "contract.status == DRAFT"]
        side_effects: ["transition.final_credit_cents computed on the ACTUAL_CALENDAR basis", "transition.status = UNDER_CONTRACT", "car.work_status IN_WARRANTY -> UNDER_CONTRACT"]

  - entity: MaintenanceContract
    initial_state: DRAFT
    terminal_states: [ACTIVE]
    shape: compound
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /maintenance-contracts/{maintenance_contract_id}/activate"
        actor: ServiceManager
        preconditions: ["contract.status == DRAFT", "at least one WarrantyTransition on this contract has status == ENROLLED"]
        side_effects: ["every ENROLLED transition -> UNDER_CONTRACT with final_credit_cents on the ACTUAL_CALENDAR basis", "each such car work_status IN_WARRANTY -> UNDER_CONTRACT", "contract.monthly_total_cents = sum of per-car rounded rates", "contract.cars_covered set", "contract.total_final_credit_cents set", "contract.status = ACTIVE", "project.status CLOSEOUT -> COMPLETED when cars_covered == project.car_count"]

concurrency_rules:
  - rule_id: scope-option-create-stale-project
    parent_entity: ModernizationProject
    write_endpoint: "POST /scope-options"
    occ_field: "expected_project_version"
    description: |
      Creating a ScopeOption against a ModernizationProject whose version has advanced since the
      client last observed it is rejected. A newly created option legitimately supersedes the car's
      APPROVED option and moves project.approved_scope_value_cents, so a writer holding a stale view
      of the project ledger would otherwise re-scope against numbers that no longer exist.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: staging-reservation-create-stale-project
    parent_entity: ModernizationProject
    write_endpoint: "POST /staging-reservations"
    occ_field: "expected_project_version"
    description: |
      Creating a StagingReservation against a ModernizationProject whose version has advanced since
      the client last observed it is rejected. Staging square footage is a finite pool whose
      committed total lives on the project row, so a writer holding a stale view would size its hold
      against capacity that has already been consumed or released.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: car_condition_score
    trigger: >
      Computed on POST /equipment-surveys (written to EquipmentSurvey.provisional_score using the
      OBSERVED_ONLY variant) and recomputed on POST /equipment-surveys/{survey_id}/countersign
      (written to EquipmentSurvey.final_score using the IMPUTED_FAILED variant, and copied to
      ElevatorCar.condition_score). Also computed read-only by
      GET /equipment-surveys/{survey_id}/score-preview for either basis.
    algorithm: weighted_scoring
    formula: |
      # Three assessed components, each graded on the same ordinal scale.
      points(grade):
        EXCELLENT   -> 100
        GOOD        ->  80
        FAIR        ->  55
        POOR        ->  25
        FAILED      ->   0
        NOT_OBSERVED-> variant-dependent (see variants)

      weights: controller_condition = W_CONTROLLER (0.45)
               machine_condition    = W_MACHINE    (0.30)
               door_equipment_condition = W_DOOR   (0.25)

      # Base (IMPUTED_FAILED) form:
      raw = points(controller)*0.45 + points(machine)*0.30 + points(door)*0.25
      score = round_half_up(raw, 2)

      # There is exactly ONE rounding step, applied to the weighted sum.
      # Rounding each weighted term before summing is NOT the rule and is
      # explicitly rejected.
    input_set: >
      Exactly the three condition grades recorded on the EquipmentSurvey row being scored. No
      other survey of the same car contributes, including surveys in status VOID. A car whose
      latest survey is VOID has no score: ElevatorCar.condition_score is reset to null.
    constants:
      W_CONTROLLER: 0.45
      W_MACHINE: 0.30
      W_DOOR: 0.25
      POINTS_EXCELLENT: 100
      POINTS_GOOD: 80
      POINTS_FAIR: 55
      POINTS_POOR: 25
      POINTS_FAILED: 0
    precision: "2 decimal places, round_half_up; single rounding step applied to the weighted sum"
    variants:
      - name: OBSERVED_ONLY
        when: >
          Provisional scoring at survey submission (EquipmentSurvey.provisional_score) and
          GET /equipment-surveys/{survey_id}/score-preview with basis=OBSERVED_ONLY.
        difference: >
          Components graded NOT_OBSERVED are dropped from BOTH the numerator and the denominator:
          score = round_half_up(sum(points(c)*w(c) for observed c) / sum(w(c) for observed c), 2).
          The observed weights are renormalised, so an unobserved machine cannot drag the score
          down. When every component is NOT_OBSERVED the denominator is zero and the score is
          exactly 0.00 (empty-set fallback, never an error and never null).
      - name: IMPUTED_FAILED
        when: >
          Final scoring at countersignature (EquipmentSurvey.final_score, copied to
          ElevatorCar.condition_score) and GET /equipment-surveys/{survey_id}/score-preview with
          basis=IMPUTED_FAILED.
        difference: >
          Components graded NOT_OBSERVED score 0 points and KEEP their weight in the denominator,
          which stays at the full 1.00. Anything the surveyor did not open is treated as failed
          for acceptance purposes. For identical grades the two bases return different numbers
          whenever at least one component is NOT_OBSERVED, and they can select different
          recommended tiers.

  - name: recommended_scope_tier
    trigger: >
      Derived from a condition score at the same moments car_condition_score runs; written to
      EquipmentSurvey.recommended_scope_tier and ElevatorCar.recommended_scope_tier, and returned
      by GET /equipment-surveys/{survey_id}/score-preview.
    algorithm: threshold
    formula: |
      if score >= 80.00 -> CONTROLLER_ONLY
      elif score >= 60.00 -> CONTROLLER_DOOR
      elif score >= 35.00 -> CONTROLLER_MACHINE
      else -> FULL_REPLACEMENT
      # Boundaries are inclusive at the lower edge (>=), so exactly 80.00 is
      # CONTROLLER_ONLY and 79.99 is CONTROLLER_DOOR.
    input_set: "The single score value produced by car_condition_score under the applicable variant."
    constants:
      TIER_CONTROLLER_ONLY_MIN: 80.00
      TIER_CONTROLLER_DOOR_MIN: 60.00
      TIER_CONTROLLER_MACHINE_MIN: 35.00
    precision: "Comparison performed on the already-rounded 2-decimal score; no further rounding"
    variants:
      - name: PROVISIONAL_RECOMMENDATION
        when: "Applied to the OBSERVED_ONLY score at survey submission."
        difference: "Advisory only; does not gate scope approval."
      - name: BINDING_RECOMMENDATION
        when: "Applied to the IMPUTED_FAILED score at countersignature."
        difference: >
          Binding: ERR_SCOPE_TIER_BELOW_RECOMMENDATION rejects approval of a ScopeOption whose
          tier ranks below ElevatorCar.recommended_scope_tier, where the tier ladder ranks
          CONTROLLER_ONLY(1) < CONTROLLER_DOOR(2) < CONTROLLER_MACHINE(3) < FULL_REPLACEMENT(4).

  - name: code_trigger_synthesis
    trigger: >
      Runs once, inside POST /scope-options, after the option row is inserted. Creates the option's
      CodeTrigger children in status REQUIRED. Never re-runs for that option (revise does not
      re-synthesize).
    algorithm: constraint_propagation
    formula: |
      J = the project's Jurisdiction; C = the car; T = the option's tier;
      S = the car's latest COUNTERSIGNED EquipmentSurvey.

      emit FIRE_SERVICE_PHASE_I_II
        when J.fire_service_required is true
        source_rule = "ASME A17.1 2.27.3 Phase I/II firefighters service"

      emit SEISMIC_RESTRAINT
        when J.seismic_zone >= 2 and T in {CONTROLLER_MACHINE, FULL_REPLACEMENT}
        source_rule = "ASME A17.1 8.4 seismic restraint of machine and counterweight"

      emit DOOR_PROTECTION_REOPENING
        when J.door_protection_required is true
             and S.door_equipment_condition in {FAIR, POOR, FAILED, NOT_OBSERVED}
        source_rule = "ASME A17.1 2.13.5 door reopening protective device"

      emit MACHINE_BRAKE_MONITOR
        when T == FULL_REPLACEMENT
             or (T == CONTROLLER_MACHINE and C.machine_type == GEARED)
        source_rule = "ASME A17.1 2.26.10 brake and rope monitoring"

      # Emission order is exactly the order listed above (deterministic
      # created_at ordering for the resulting CodeTrigger rows).
      # Every emitted trigger starts with status REQUIRED and cost_cents = 0.
    input_set: >
      The jurisdiction configuration, the option's declared tier, the car's machine_type, and the
      door_equipment_condition of the car's latest COUNTERSIGNED survey. Surveys in status
      SUBMITTED or VOID are excluded; if no COUNTERSIGNED survey exists the DOOR_PROTECTION
      predicate is false (the option cannot be created at all, see ERR_CAR_STATE_INVALID).
    constants:
      SEISMIC_ZONE_TRIGGER_MIN: 2
      DOOR_TRIGGER_CONDITIONS: "FAIR, POOR, FAILED, NOT_OBSERVED"
    precision: "Not applicable (set-valued result)"
    variants:
      - name: NON_EMPTY_SYNTHESIS
        when: "At least one predicate holds."
        difference: >
          The car's compliance_status moves NOT_EVALUATED -> TRIGGERS_OPEN and approval is blocked
          by ERR_CODE_TRIGGER_OPEN until every emitted trigger has left status REQUIRED.
      - name: EMPTY_SYNTHESIS
        when: >
          No predicate holds (e.g. fire_service_required false, seismic_zone 0,
          door_protection_required false, tier CONTROLLER_ONLY).
        difference: >
          Zero CodeTrigger rows are created and the car's compliance_status jumps straight to
          TRIGGERS_CLEARED. code_upgrade_cents is then 0 over an empty set, which is a legitimate
          zero and not a skipped calculation.

  - name: code_upgrade_cents
    trigger: >
      Recomputed on POST /code-triggers/{code_trigger_id}/price, POST
      /code-triggers/{code_trigger_id}/waive, POST /scope-options (initial value) and POST
      /scope-options/{scope_option_id}/revise; written to ScopeOption.code_upgrade_cents. Only
      recomputed while the option's status is DRAFT or SUBMITTED.
    algorithm: aggregation
    formula: |
      surcharge = jurisdiction.permit_surcharge_pct

      # PINNED ROUNDING ORDER: round each trigger line to whole cents FIRST,
      # then sum the rounded lines.
      code_upgrade_cents = SUM over t in priced_triggers of
                             round_half_up(t.cost_cents * (1 + surcharge))

      # The alternative order -- summing the un-rounded surcharged amounts and
      # rounding the single total -- is NOT the rule and can differ by 1 cent
      # per pair of half-cent residues. It is explicitly rejected.
    input_set: >
      CodeTrigger rows of this ScopeOption whose status is PRICED. Rows in status REQUIRED
      contribute nothing (they also block approval), rows in status WAIVED contribute nothing
      regardless of their cost_cents, and rows in status SATISFIED retain their last priced
      contribution. An option with no PRICED triggers has code_upgrade_cents = 0.
    constants:
      ROUNDING_ORDER: "per_line_then_sum"
    precision: "Whole cents, round_half_up, applied once per trigger line before summation"
    variants:
      - name: SURCHARGE_ZERO_JURISDICTION
        when: "jurisdiction.permit_surcharge_pct == 0.0000"
        difference: >
          The multiplication is the identity, so per-line and total rounding coincide and
          code_upgrade_cents equals the plain sum of PRICED cost_cents.
      - name: SURCHARGE_BEARING_JURISDICTION
        when: "jurisdiction.permit_surcharge_pct > 0.0000"
        difference: >
          Per-line rounding is observable: two lines whose surcharged amounts each end in a
          fractional residue below half a cent round down individually while their combined
          residue rounds up, so the pinned order returns a total 1 cent lower than the
          sum-then-round order.

  - name: scope_option_pricing
    trigger: >
      Runs on POST /scope-options, POST /code-triggers/{id}/price, POST /code-triggers/{id}/waive,
      POST /scope-options/{id}/revise, POST /procurement-orders and POST
      /procurement-orders/{id}/cancel. Writes ScopeOption.max_lead_time_days, escalation_pct,
      escalation_fee_cents, volume_discount_pct, volume_discount_cents and total_price_cents.
      Frozen once the option reaches APPROVED, REJECTED or SUPERSEDED: later procurement activity
      does not move an approved price.
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. Each step consumes the previous step's output.
      # 1. code upgrades (see calculation code_upgrade_cents)
      code_upgrade_cents = code_upgrade_cents(option)

      # 2. pre-escalation base
      pre_escalation_cents = base_price_cents + code_upgrade_cents

      # 3. longest lead time across the option's live procurement orders
      live_orders = orders of this option whose status != CANCELLED
      max_lead_time_days = MAX(o.lead_time_days for o in live_orders), or 0 when live_orders is empty
      escalation_pct = 0.0000 if max_lead_time_days <= 60
                       0.0300 if 61 <= max_lead_time_days <= 120
                       0.0650 if 121 <= max_lead_time_days <= 180
                       0.1100 if max_lead_time_days >= 181

      # 4. escalation fee, rounded to whole cents
      escalation_fee_cents = round_half_up(pre_escalation_cents * escalation_pct)

      # 5. subtotal AFTER escalation
      subtotal_cents = pre_escalation_cents + escalation_fee_cents

      # 6. volume discount tier is keyed on the POST-escalation subtotal, not on
      #    base_price_cents and not on pre_escalation_cents. This is the pinned
      #    order and it is observable whenever escalation carries the amount
      #    across a discount breakpoint.
      volume_discount_pct = 0.0000 if subtotal_cents <  15000000
                            0.0200 if subtotal_cents <  30000000
                            0.0450 if subtotal_cents <  60000000
                            0.0700 otherwise

      # 7. discount, rounded to whole cents
      volume_discount_cents = round_half_up(subtotal_cents * volume_discount_pct)

      # 8. total
      total_price_cents = subtotal_cents - volume_discount_cents
    input_set: >
      The option's own base_price_cents, its PRICED CodeTrigger children (via code_upgrade_cents),
      and its ProcurementOrder children whose status is not CANCELLED. Orders belonging to any
      other option of the same car are excluded. CANCELLED orders are excluded even when they were
      the longest-lead item, so cancelling the long-lead controller drops the escalation tier.
    constants:
      ESCALATION_TIER_1_MAX_DAYS: 60
      ESCALATION_TIER_2_MAX_DAYS: 120
      ESCALATION_TIER_3_MAX_DAYS: 180
      ESCALATION_PCT_TIER_1: 0.0000
      ESCALATION_PCT_TIER_2: 0.0300
      ESCALATION_PCT_TIER_3: 0.0650
      ESCALATION_PCT_TIER_4: 0.1100
      VOLUME_BREAK_1_CENTS: 15000000
      VOLUME_BREAK_2_CENTS: 30000000
      VOLUME_BREAK_3_CENTS: 60000000
      VOLUME_DISCOUNT_PCT_1: 0.0000
      VOLUME_DISCOUNT_PCT_2: 0.0200
      VOLUME_DISCOUNT_PCT_3: 0.0450
      VOLUME_DISCOUNT_PCT_4: 0.0700
    precision: >
      Whole cents throughout, round_half_up. Exactly two rounding steps: the escalation fee and
      the volume discount. Percentages are exact 4-decimal constants and are never rounded.
    variants:
      - name: NO_LIVE_ORDERS
        when: "Every ProcurementOrder of the option is CANCELLED, or none was ever created."
        difference: >
          max_lead_time_days is the empty-set fallback 0, hence escalation_pct 0.0000 and
          escalation_fee_cents 0; the discount tier is then keyed on base + code upgrades alone.
          This is a real priced option, not an unpriced one.
      - name: ESCALATION_CROSSES_DISCOUNT_BREAK
        when: >
          pre_escalation_cents sits below a VOLUME_BREAK constant while subtotal_cents sits at or
          above it.
        difference: >
          The pinned order awards the higher discount tier because the tier is keyed on the
          post-escalation subtotal; keying on pre_escalation_cents instead awards no discount (or
          a lower one) and produces a strictly larger total_price_cents.

  - name: project_downtime_posture
    trigger: >
      Recomputed after every write that can move a group's service level, the project's live
      outage count, or its committed staging: outage activate / complete / cancel, staging
      reservation create / release, procurement install / cancel, scope rescind, inspection
      record-result, PATCH /elevator-groups/{group_id} and POST /_clock/set_current_utc. Written
      to ModernizationProject.downtime_posture and returned by GET /projects/{project_id}/posture.
    algorithm: threshold
    formula: |
      # Evaluated as an ordered ladder; the FIRST matching clause wins and no
      # later clause can soften it.
      if EXISTS group g of this project with g.cars_in_service < g.min_cars_in_service:
          posture = FROZEN
      elif project.active_outage_count >= project.max_concurrent_outages
           or project.staging_committed_sqft * 100 > project.staging_area_sqft * STAGING_PRESSURE_PCT:
          posture = RESTRICTED
      else:
          posture = OPEN

      # where, for every group g:
      #   g.car_count       = COUNT(cars of g)
      #   g.cars_in_service = COUNT(cars of g whose work_status != OUTAGE_ACTIVE)
      # A car in TESTING counts as IN SERVICE: testing runs on a car that has
      # been returned to service for acceptance runs.
      #
      # The staging clause is expressed with integer cross-multiplication to
      # avoid float division: 85% of capacity is exceeded strictly, so a project
      # sitting exactly at 85% is RESTRICTED-free.
    input_set: >
      All ElevatorGroup rows of the project and their ElevatorCar children (all cars, in every
      work_status), plus the project's own active_outage_count and staging_committed_sqft
      counters. Cars of other projects are excluded. A project with zero groups can never be
      FROZEN by the first clause.
    constants:
      STAGING_PRESSURE_PCT: 85
    precision: "Integer comparison only; no rounding"
    variants:
      - name: SERVICE_FLOOR_BREACH
        when: "Any group has fewer cars in service than its declared floor."
        difference: >
          FROZEN wins even when the outage count and staging pressure are both comfortable, and
          FROZEN makes ERR_PROJECT_FROZEN reject every new outage activation and staging hold.
      - name: PRESSURE_ONLY
        when: "Every group meets its floor but the outage cap or the staging pressure line is hit."
        difference: >
          RESTRICTED is advisory for outage activation (the cap is enforced separately by
          ERR_CONCURRENCY_CAP_EXCEEDED) and does not by itself block staging holds.

  - name: staging_interval_capacity
    trigger: >
      Evaluated on POST /staging-reservations before the row is inserted; the accepted hold then
      increments ModernizationProject.staging_committed_sqft.
    algorithm: interval_merge
    formula: |
      # ADDITIVE, POINTWISE capacity over HALF-OPEN intervals [hold_start, hold_end).
      candidates = StagingReservation rows in status HELD whose project (via
                   procurement_order -> scope_option -> car -> project) is this project
      overlapping(a, b) := a.hold_start < b.hold_end and b.hold_start < a.hold_end

      # Because every interval is half-open, an existing hold that ends exactly
      # when the new hold starts does NOT overlap: adjacency is legal and
      # touching holds may reuse the same square footage.
      for each instant boundary produced by the candidate set and the new hold:
          concurrent_sqft = SUM(c.sqft for c in candidates overlapping the new hold at that instant)
      peak_sqft = MAX(concurrent_sqft over the new hold's own span)

      if peak_sqft + new.sqft > project.staging_area_sqft:
          reject with ERR_STAGING_CAPACITY_EXCEEDED
      # Equality is ALLOWED: a hold that fills the yard to exactly
      # staging_area_sqft succeeds; one square foot more fails.
    input_set: >
      Only HELD reservations of the same project. RELEASED reservations free their footage
      immediately and are excluded, as are holds belonging to any other project even in the same
      building. Reservations whose order was CANCELLED have already been RELEASED by cascade and
      so are excluded too.
    constants:
      INTERVAL_SEMANTICS: "half_open_[start,end)"
      AGGREGATION: "additive_pointwise_sum"
      BOUNDARY_COMPARISON: "reject only when the sum strictly exceeds capacity"
    precision: "Integer square feet; no rounding"
    variants:
      - name: SEQUENTIAL_HOLDS
        when: "The new hold's hold_start equals an existing hold's hold_end (or vice versa)."
        difference: >
          Zero overlap under half-open semantics, so the full yard is available to the new hold
          even if the two holds together far exceed staging_area_sqft.
      - name: NESTED_HOLDS
        when: "The new hold sits entirely inside a longer existing hold."
        difference: >
          The longer hold's footage counts for the whole span of the new hold, so the peak is the
          simple sum of the two; nesting is never cheaper than partial overlap.

  - name: outage_group_buffer
    trigger: >
      Evaluated on POST /outage-windows (against PLANNED and ACTIVE siblings) and again on
      POST /outage-windows/{outage_window_id}/activate (the set may have changed since planning).
    algorithm: interval_merge
    formula: |
      # PAIRWISE, BUFFER-INFLATED conflict over CLOSED intervals.
      buffer_h = project.outage_buffer_hours
      siblings = OutageWindow rows whose car belongs to the SAME ElevatorGroup as the new
                 window's car (the new window's own car included), with status in
                 {PLANNED, ACTIVE}
      conflict(new, other) :=
            new.start_at < other.end_at + buffer_h hours
        and other.start_at < new.end_at + buffer_h hours

      if ANY sibling conflicts: reject with ERR_OUTAGE_BUFFER_CONFLICT

      # Contrast with staging_interval_capacity on purpose:
      #  - this rule is PAIRWISE (one conflicting sibling is fatal); staging is ADDITIVE
      #  - this rule inflates BOTH ends by the buffer, so ADJACENCY IS ILLEGAL:
      #    back-to-back windows on the same group are rejected
      #  - this rule scopes to the ElevatorGroup; staging scopes to the project
      #  - COMPLETED and CANCELLED windows never conflict; RELEASED/HELD is the
      #    staging analogue and is a different filter
    input_set: >
      OutageWindow rows in status PLANNED or ACTIVE whose car shares the new window's group_id.
      COMPLETED and CANCELLED windows are excluded, so a finished outage never blocks the next
      car. Windows on cars of another group of the same project are excluded even when they
      overlap in time.
    constants:
      INTERVAL_SEMANTICS: "buffer_inflated_pairwise"
      ADJACENCY: "illegal (buffer applies to both ends)"
    precision: "Whole hours added to ISO-8601 timestamps; comparisons are exact"
    variants:
      - name: PREDECESSOR_CHAINED
        when: "The new window declares predecessor_window_id."
        difference: >
          The predecessor is additionally required to be in status COMPLETED
          (ERR_PREDECESSOR_NOT_COMPLETE) and the new window's start_at must be at or after the
          predecessor's end_at; the buffer check still runs against the rest of the group.
      - name: REOPENED_WINDOW
        when: "A COMPLETED window is reopened by a FAILED inspection cascade."
        difference: >
          The reopen extends end_at by jurisdiction.reinspection_extension_hours and bypasses the
          buffer check entirely — the cascade is a consequence of a code failure, not an operator
          request, and must never be blocked by a scheduling rule.

  - name: warranty_unexpired_credit
    trigger: >
      Computed on POST /warranty-transitions/{warranty_transition_id}/enroll (written to
      WarrantyTransition.provisional_credit_cents using THIRTY_360) and recomputed on POST
      /maintenance-contracts/{maintenance_contract_id}/activate (written to
      WarrantyTransition.final_credit_cents using ACTUAL_CALENDAR, and summed into
      MaintenanceContract.total_final_credit_cents). Also computed read-only by
      GET /warranty-transitions/{warranty_transition_id}/credit-preview.
    algorithm: decay_function
    formula: |
      anchor = maintenance_contract.coverage_start
      rate   = the car's per-car monthly rate from maintenance_monthly_total
               (round_half_up(monthly_base_cents * tier_multiplier * group_factor))

      if warranty_end <= anchor:
          credit = 0          # the warranty is fully consumed before coverage starts
      else:
          days   = day_count(anchor, warranty_end)   # variant-dependent
          credit = round_half_up(rate * days / DIVISOR)   # DIVISOR variant-dependent

      # The credit is the unexpired remainder of the modernization warranty that
      # the owner should not pay for twice once the maintenance contract starts.
    input_set: >
      The single WarrantyTransition being credited, its car's APPROVED ScopeOption tier, the car's
      group car_count, and the MaintenanceContract's monthly_base_cents and coverage_start.
      Transitions in status LAPSED are excluded from contract activation entirely and receive no
      final credit.
    constants:
      THIRTY_360_MONTH_DAYS: 30
      ACTUAL_CALENDAR_YEAR_DAYS: 365
      ACTUAL_CALENDAR_MONTHS_PER_YEAR: 12
    precision: "Whole cents, round_half_up, single rounding step applied to the final credit"
    variants:
      - name: THIRTY_360
        when: >
          Provisional credit at enrolment (WarrantyTransition.provisional_credit_cents) and
          GET /warranty-transitions/{id}/credit-preview with basis=THIRTY_360.
        difference: >
          days = 360*(y2-y1) + 30*(m2-m1) + (min(d2,30) - min(d1,30)) and
          credit = round_half_up(rate * days / 30). Every month is 30 days long, so the credit is
          insensitive to month lengths and to leap days.
      - name: ACTUAL_CALENDAR
        when: >
          Final credit at contract activation (WarrantyTransition.final_credit_cents, summed into
          MaintenanceContract.total_final_credit_cents) and
          GET /warranty-transitions/{id}/credit-preview with basis=ACTUAL_CALENDAR.
        difference: >
          days = the exact number of calendar days between anchor and warranty_end (leap days
          included) and credit = round_half_up(rate * days * 12 / 365). For identical inputs this
          diverges from THIRTY_360 whenever the span's real length differs from its 30/360 length,
          so the provisional and final credits are different numbers and the difference is a real
          reconciliation the contract must carry.

  - name: maintenance_monthly_total
    trigger: >
      Computed on POST /maintenance-contracts/{maintenance_contract_id}/activate; writes
      MaintenanceContract.monthly_total_cents and cars_covered. Also supplies the per-car rate
      consumed by warranty_unexpired_credit.
    algorithm: aggregation
    formula: |
      covered = WarrantyTransition rows of this contract in status ENROLLED
      for each t in covered:
          car   = t.car
          tier  = tier of the car's APPROVED ScopeOption
          g     = car's ElevatorGroup
          tier_multiplier = 1.00 if tier == CONTROLLER_ONLY
                            1.15 if tier == CONTROLLER_DOOR
                            1.30 if tier == CONTROLLER_MACHINE
                            1.45 if tier == FULL_REPLACEMENT
          group_factor    = 1.00 if g.car_count == 1
                            0.93 if 2 <= g.car_count <= 3
                            0.88 if g.car_count >= 4
          per_car_cents   = round_half_up(contract.monthly_base_cents
                                          * tier_multiplier * group_factor)

      # PINNED ROUNDING ORDER: round PER CAR, then sum the rounded per-car rates.
      monthly_total_cents = SUM(per_car_cents)
      cars_covered        = COUNT(covered)
      # Rounding the un-rounded product sum once is NOT the rule.
    input_set: >
      WarrantyTransition rows pointing at this contract whose status is ENROLLED. PENDING rows
      (never enrolled), LAPSED rows and rows already UNDER_CONTRACT from an earlier activation are
      excluded. Activating a contract with zero ENROLLED transitions is rejected by
      ERR_NO_ENROLLED_TRANSITIONS rather than producing a zero-car contract.
    constants:
      TIER_MULTIPLIER_CONTROLLER_ONLY: 1.00
      TIER_MULTIPLIER_CONTROLLER_DOOR: 1.15
      TIER_MULTIPLIER_CONTROLLER_MACHINE: 1.30
      TIER_MULTIPLIER_FULL_REPLACEMENT: 1.45
      GROUP_FACTOR_SINGLE: 1.00
      GROUP_FACTOR_SMALL: 0.93
      GROUP_FACTOR_LARGE: 0.88
      ROUNDING_ORDER: "per_car_then_sum"
    precision: "Whole cents, round_half_up, applied once per covered car before summation"
    variants:
      - name: SINGLE_CAR_CONTRACT
        when: "The car's group holds exactly one car."
        difference: "group_factor is 1.00, so the rate is the base times the tier multiplier alone."
      - name: MULTI_CAR_GROUP_CONTRACT
        when: "The car's group holds two or more cars."
        difference: >
          group_factor discounts every car in that group, and because the factor is keyed on the
          group's car_count rather than on cars_covered, adding a car to the group lowers the
          per-car rate of cars that were already covered on the next activation.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: >
      Both X-User-Role and X-User-ID request headers are present and non-empty, and X-User-Role is
      one of the six declared role names.
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: >
      The role carried by X-User-Role appears in the target endpoint's roles list. Checked before
      any path segment is resolved, so an unauthorised caller cannot probe which ids exist.
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >
      Every id in the request path resolves to an existing row, validated left to right. The
      generic ERR_NOT_FOUND is returned for any unresolvable path id.
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: >
      Every foreign key supplied in the request body resolves to an existing row, validated in the
      order the fields are listed in the endpoint's input.
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: >
      POST /projects, POST /elevator-groups, POST /elevator-cars, POST /equipment-surveys,
      POST /scope-options, POST /procurement-orders, POST /staging-reservations,
      POST /outage-windows, POST /inspection-appointments, POST /warranty-transitions,
      POST /maintenance-contracts

  - priority: 5
    category: auth
    check: >
      When X-User-Role is BuildingRepresentative, X-User-ID must equal the id of the
      ModernizationProject the target resource belongs to (resolved through
      car -> project, group -> project, scope_option -> car -> project, etc.). A representative of
      one building can never act on another building's rows even for endpoints their role permits.
    error_id: ERR_PROJECT_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include BuildingRepresentative"

  - priority: 6
    category: auth
    check: >
      When X-User-Role is AHJInspector, X-User-ID must equal the id of the Jurisdiction of the
      project the target resource belongs to. An inspector cannot schedule or rule on work outside
      their own jurisdiction.
    error_id: ERR_JURISDICTION_SCOPE_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include AHJInspector"

  - priority: 7
    category: auth
    check: >
      Segregation of duties on survey countersignature: X-User-ID must differ from the target
      EquipmentSurvey.surveyed_by_user_id. The technician who performed the survey may never
      countersign their own condition assessment, because the countersigned score is what binds
      the scope recommendation.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /equipment-surveys/{survey_id}/countersign"

  - priority: 8
    category: existence
    check: >
      Request shape: all required input fields present, no unknown fields, enum values drawn from
      the declared sets, integers non-negative, monetary amounts non-negative whole cents,
      timestamps valid ISO-8601 UTC, hold_end strictly after hold_start, end_at strictly after
      start_at, seismic_zone in 0..4, warranty_months in 12..60, and query parameter basis one of
      the declared variant names where required.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 9
    category: state
    check: >
      Optimistic concurrency: expected_project_version must equal the current
      ModernizationProject.version. Checked after the request is well formed but before any state
      precondition, so a stale writer is told to re-read rather than being told about a state they
      cannot see yet.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /scope-options, POST /staging-reservations"

  - priority: 10
    category: state
    check: >
      State preconditions on the target row and its ancestors, evaluated target-first: the row's
      own status must permit the requested transition, and where a transition depends on a parent
      the parent's status is checked in the same band. Distinct error ids preserve the operator's
      diagnosis where the domain distinguishes the failures (a PASSED appointment is not
      reschedulable; an option past DRAFT cannot be revised). The project row is an ancestor for
      this purpose: a COMPLETED ModernizationProject is closed to new work, so POST /elevator-cars,
      POST /scope-options and POST /outage-windows against it are refused with
      ERR_PROJECT_STATE_INVALID.
    error_id: ERR_SCOPE_OPTION_STATE_INVALID
    http_status: 409
    applies_to: >
      all state-transition endpoints plus POST /elevator-cars, POST /scope-options and
      POST /outage-windows for the COMPLETED-project gate; see the error catalog for the
      per-entity ids

  - priority: 11
    category: business_referential
    check: >
      Cross-row coherence of rows that already exist: an outage window's predecessor must belong
      to a car of the same ElevatorGroup, a staging reservation must belong to the procurement
      order named in the receive call, a warranty transition's car must belong to the contract's
      project, and a scope option must belong to the car named in a dependent call.
    error_id: ERR_CAR_GROUP_MISMATCH
    http_status: 409
    applies_to: >
      POST /outage-windows, POST /procurement-orders/{procurement_order_id}/receive,
      POST /warranty-transitions, POST /warranty-transitions/{warranty_transition_id}/enroll,
      POST /maintenance-contracts/{maintenance_contract_id}/activate

  - priority: 12
    category: business_safety
    check: >
      Code compliance and life-safety gates, which outrank every scheduling, capacity and money
      rule because an elevator that is not code compliant may not carry passengers: no open code
      trigger at scope approval (ERR_CODE_TRIGGER_OPEN); approved tier not below the countersigned
      recommendation (ERR_SCOPE_TIER_BELOW_RECOMMENDATION); the group service floor holds after an
      outage activation (ERR_GROUP_SERVICE_FLOOR); an occupied building's outage declares a
      temporary service plan other than STAIRS_ONLY (ERR_TEMP_SERVICE_PLAN_INADEQUATE); a
      CONDITIONAL result carries at least one punch-list item (ERR_PUNCH_LIST_REQUIRED); and a
      warranty transition is only opened for a car whose compliance_status is CODE_ACCEPTED
      (ERR_CAR_NOT_CODE_ACCEPTED).
    error_id: ERR_CODE_TRIGGER_OPEN
    http_status: 409
    applies_to: >
      POST /scope-options/{scope_option_id}/approve, POST /outage-windows,
      POST /outage-windows/{outage_window_id}/activate,
      POST /inspection-appointments/{inspection_appointment_id}/record-result,
      POST /warranty-transitions

  - priority: 13
    category: business_temporal
    check: >
      Time and sequencing rules, checked after safety and before countable constraints: the group
      buffer conflict (ERR_OUTAGE_BUFFER_CONFLICT); a declared predecessor window must be
      COMPLETED (ERR_PREDECESSOR_NOT_COMPLETE); tenant notice must have been sent at least
      project.tenant_notice_lead_hours before the window's start_at
      (ERR_TENANT_NOTICE_LEAD_UNMET); an inspection request date must be at least
      jurisdiction.inspection_lead_days ahead of the logical clock
      (ERR_INSPECTION_LEAD_UNMET); and a window whose end_at is at or before the logical clock can
      no longer be activated (ERR_WINDOW_EXPIRED).
    error_id: ERR_OUTAGE_BUFFER_CONFLICT
    http_status: 409
    applies_to: >
      POST /outage-windows, POST /outage-windows/{outage_window_id}/activate,
      POST /inspection-appointments, POST /inspection-appointments/{inspection_appointment_id}/reschedule

  - priority: 14
    category: business_constraint
    check: >
      Countable limits and posture locks: the project's concurrent outage cap
      (ERR_CONCURRENCY_CAP_EXCEEDED); a FROZEN project accepts no new outage activation or staging
      hold (ERR_PROJECT_FROZEN); at most RESCHEDULE_LIMIT reschedules per appointment
      (ERR_RESCHEDULE_LIMIT); at most REVISION_LIMIT revisions per option (ERR_REVISION_LIMIT);
      every live procurement order of the approved option must be INSTALLED before acceptance
      testing begins (ERR_PROCUREMENT_NOT_INSTALLED); and a contract activation needs at least one
      ENROLLED transition (ERR_NO_ENROLLED_TRANSITIONS).
    error_id: ERR_CONCURRENCY_CAP_EXCEEDED
    http_status: 409
    applies_to: >
      POST /outage-windows/{outage_window_id}/activate, POST /staging-reservations,
      POST /inspection-appointments/{inspection_appointment_id}/reschedule,
      POST /scope-options/{scope_option_id}/revise, POST /elevator-cars/{car_id}/begin-testing,
      POST /maintenance-contracts/{maintenance_contract_id}/activate

  - priority: 15
    category: business_fiscal
    check: >
      Money and physical-capacity ceilings, checked last: the staging yard's pointwise capacity
      over the requested hold interval (ERR_STAGING_CAPACITY_EXCEEDED) and the project's contract
      value ceiling on the sum of approved option totals (ERR_SCOPE_BUDGET_EXCEEDED).
    error_id: ERR_SCOPE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /staging-reservations, POST /scope-options/{scope_option_id}/approve"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (api_prefix is "", so every path below is absolute)
# ---------------------------------------------------------------------------
endpoints:
  # --- Jurisdiction (authority having jurisdiction / code configuration) ----
  - method: POST
    path: "/jurisdictions"
    description: "Register an authority having jurisdiction and its code configuration."
    roles: [SystemOperator]
    code: 201
    input: [name, code_edition_year, fire_service_required, seismic_zone, door_protection_required, "inspection_lead_days?", "witness_test_required?", "reinspection_extension_hours?", "permit_surcharge_pct?"]
    output: Jurisdiction
    side_effects: ["Applies declared defaults for any omitted optional configuration field"]

  - method: GET
    path: "/jurisdictions/{jurisdiction_id}"
    description: "Read one jurisdiction's code configuration."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["code_edition_year?"]
    output: Jurisdiction[]
    side_effects: []

  # --- ModernizationProject ------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Open a modernization project for one building under one jurisdiction."
    roles: [ProjectManager]
    code: 201
    input: [jurisdiction_id, building_name, occupancy_type, contract_value_cents, staging_area_sqft, max_concurrent_outages, "outage_buffer_hours?", "tenant_notice_lead_hours?"]
    output: ModernizationProject
    side_effects:
      - "status = SURVEY; downtime_posture = OPEN"
      - "car_count = 0; approved_scope_value_cents = 0; staging_committed_sqft = 0; active_outage_count = 0"

  - method: GET
    path: "/projects/{project_id}"
    description: >
      Read one project including its derived ledger counters and its current version, which is the
      value callers pass back as expected_project_version on the two OCC-guarded writes.
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: ModernizationProject
    side_effects: []

  - method: GET
    path: "/projects"
    description: "List projects, optionally narrowed to one jurisdiction."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["jurisdiction_id?", "status?"]
    output: ModernizationProject[]
    side_effects: []

  - method: GET
    path: "/projects/{project_id}/posture"
    description: >
      Computed read: re-evaluates project_downtime_posture and returns the posture together with
      the three inputs that decided it, without writing.
    roles: [ProjectManager, BuildingRepresentative, ServiceManager, SystemOperator]
    code: 200
    input: []
    output:
      downtime_posture: "OPEN | RESTRICTED | FROZEN"
      active_outage_count: "integer"
      staging_committed_sqft: "integer"
      groups_below_floor: "integer count of this project's groups whose cars_in_service < min_cars_in_service"
    side_effects: []

  - method: PATCH
    path: "/projects/{project_id}"
    description: "Adjust a project's downtime governance parameters mid-flight."
    roles: [ProjectManager]
    code: 200
    input: ["max_concurrent_outages?", "outage_buffer_hours?", "tenant_notice_lead_hours?", "contract_value_cents?"]
    output: ModernizationProject
    side_effects:
      - "Recomputes project_downtime_posture"
      - "Increments ModernizationProject.version by 1"

  # --- ElevatorGroup -------------------------------------------------------
  - method: POST
    path: "/elevator-groups"
    description: "Declare a hoistway group and the number of cars that must stay in service in it."
    roles: [ProjectManager]
    code: 201
    input: [project_id, group_label, min_cars_in_service]
    output: ElevatorGroup
    side_effects: ["car_count = 0; cars_in_service = 0"]

  - method: GET
    path: "/elevator-groups/{group_id}"
    description: "Read one group with its live service counters."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: ElevatorGroup
    side_effects: []

  - method: GET
    path: "/elevator-groups"
    description: "List groups, optionally narrowed to one project."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["project_id?"]
    output: ElevatorGroup[]
    side_effects: []

  - method: PATCH
    path: "/elevator-groups/{group_id}"
    description: >
      Raise or lower a group's in-service floor, e.g. when the building owner tightens the service
      commitment for a busy season.
    roles: [ProjectManager, BuildingRepresentative]
    code: 200
    input: [min_cars_in_service]
    output: ElevatorGroup
    side_effects:
      - "Recomputes project_downtime_posture, which may move the project to FROZEN with no outage change"
      - "Increments ModernizationProject.version by 1"

  # --- ElevatorCar ---------------------------------------------------------
  - method: POST
    path: "/elevator-cars"
    description: "Register an existing car in a group as a modernization unit."
    roles: [ProjectManager]
    code: 201
    input: [project_id, group_id, car_designation, rated_load_lbs, controller_type_legacy, machine_type, duty_rank]
    output: ElevatorCar
    side_effects:
      - "work_status = SURVEY_PENDING; compliance_status = NOT_EVALUATED; condition_score = null"
      - "Increments ElevatorGroup.car_count and ElevatorGroup.cars_in_service by 1"
      - "Increments ModernizationProject.car_count by 1 and ModernizationProject.version by 1"
      - "Recomputes project_downtime_posture"

  - method: GET
    path: "/elevator-cars/{car_id}"
    description: "Read one car with both of its status dimensions and its condition score."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: ElevatorCar
    side_effects: []

  - method: GET
    path: "/elevator-cars"
    description: "List cars, optionally narrowed by project, group or work status."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["project_id?", "group_id?", "work_status?", "compliance_status?"]
    output: ElevatorCar[]
    side_effects: []

  - method: POST
    path: "/elevator-cars/{car_id}/begin-testing"
    description: >
      Return a car from outage to acceptance testing. Requires every live procurement order of the
      car's approved option to be INSTALLED; an approved option with zero live orders is a
      failure, not a vacuous success.
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: []
    output: ElevatorCar
    side_effects:
      - "work_status OUTAGE_ACTIVE -> TESTING"
      - "Increments ElevatorGroup.cars_in_service by 1 (a car in TESTING counts as in service)"
      - "Decrements ModernizationProject.active_outage_count by 1 and increments version by 1"
      - "Recomputes project_downtime_posture"

  # --- EquipmentSurvey -----------------------------------------------------
  - method: POST
    path: "/equipment-surveys"
    description: >
      Record a condition survey of a car's controller, machine and door equipment. Creating a
      replacement survey voids the car's previous survey and resets the car to SURVEY_PENDING.
    roles: [SurveyTechnician]
    code: 201
    input: [car_id, controller_condition, machine_condition, door_equipment_condition]
    output: EquipmentSurvey
    side_effects:
      - "surveyed_by_user_id = X-User-ID; status = SUBMITTED; countersigned_by_user_id = null"
      - "Computes provisional_score via car_condition_score variant OBSERVED_ONLY and recommended_scope_tier"
      - "Any prior survey of the same car in status SUBMITTED or COUNTERSIGNED becomes VOID"
      - "ElevatorCar.work_status SURVEYED -> SURVEY_PENDING and ElevatorCar.condition_score = null when a prior survey was voided"

  - method: GET
    path: "/equipment-surveys/{survey_id}"
    description: "Read one survey with both of its scores."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: EquipmentSurvey
    side_effects: []

  - method: GET
    path: "/equipment-surveys"
    description: "List surveys, optionally narrowed to one car."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["car_id?", "status?"]
    output: EquipmentSurvey[]
    side_effects: []

  - method: GET
    path: "/equipment-surveys/{survey_id}/score-preview"
    description: >
      Computed read: scores the survey under an explicitly named basis without writing, so the two
      variants of car_condition_score can be compared on identical grades.
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, ServiceManager, SystemOperator]
    code: 200
    input: [basis]
    output:
      basis: "OBSERVED_ONLY | IMPUTED_FAILED"
      score: "decimal, 2 places"
      recommended_scope_tier: "CONTROLLER_ONLY | CONTROLLER_DOOR | CONTROLLER_MACHINE | FULL_REPLACEMENT"
      observed_weight_total: "decimal, sum of the weights that entered the denominator"
    side_effects: []

  - method: POST
    path: "/equipment-surveys/{survey_id}/countersign"
    description: >
      A second technician countersigns the survey, which converts the advisory score into the
      binding one. The surveyor of record may not countersign their own survey.
    roles: [SurveyTechnician, ProjectManager]
    code: 200
    input: []
    output: EquipmentSurvey
    side_effects:
      - "status SUBMITTED -> COUNTERSIGNED; countersigned_by_user_id = X-User-ID"
      - "Computes final_score via car_condition_score variant IMPUTED_FAILED and recommended_scope_tier"
      - "Copies final_score to ElevatorCar.condition_score and the tier to ElevatorCar.recommended_scope_tier"
      - "ElevatorCar.work_status SURVEY_PENDING -> SURVEYED"
      - "ModernizationProject.status SURVEY -> SCOPING on the project's first countersignature"
      - "Increments ModernizationProject.version by 1"

  # --- ScopeOption ---------------------------------------------------------
  - method: POST
    path: "/scope-options"
    description: >
      Price a modernization scope option for a surveyed car, from controller-only through full
      replacement. Synthesizes the option's code triggers from the jurisdiction, the tier and the
      countersigned survey, and supersedes any earlier live option for the same car. OCC-guarded
      because a new option moves the project's approved scope ledger.
    roles: [ProjectManager]
    code: 201
    input: [car_id, tier, base_price_cents, expected_project_version]
    output: ScopeOption
    side_effects:
      - "status = DRAFT; revision_count = 0; rejection_note = null"
      - "Runs code_trigger_synthesis, creating CodeTrigger children in status REQUIRED (discoverable via GET /code-triggers?scope_option_id=)"
      - "ElevatorCar.compliance_status NOT_EVALUATED -> TRIGGERS_OPEN when at least one trigger was created, or -> TRIGGERS_CLEARED when none was"
      - "Any earlier ScopeOption of the same car in DRAFT, SUBMITTED, REJECTED or APPROVED becomes SUPERSEDED"
      - "When a superseded option was APPROVED: its total_price_cents leaves ModernizationProject.approved_scope_value_cents, ElevatorCar.approved_scope_option_id is cleared, and ElevatorCar.work_status moves PROCURING -> SCOPED (the new option takes over the SCOPED slot directly, so no submit is needed to re-enter SCOPED)"
      - "Runs scope_option_pricing, writing max_lead_time_days, escalation_pct, escalation_fee_cents, volume_discount_pct, volume_discount_cents and total_price_cents"
      - "Increments ModernizationProject.version by 1"

  - method: GET
    path: "/scope-options/{scope_option_id}"
    description: "Read one scope option with its full pricing breakdown."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: ScopeOption
    side_effects: []

  - method: GET
    path: "/scope-options"
    description: "List scope options, optionally narrowed to one car."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["car_id?", "status?"]
    output: ScopeOption[]
    side_effects: []

  - method: POST
    path: "/scope-options/{scope_option_id}/submit"
    description: "Submit a priced option to the building owner for approval."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ScopeOption
    side_effects:
      - "status DRAFT -> SUBMITTED"
      - "ElevatorCar.work_status SURVEYED -> SCOPED"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/scope-options/{scope_option_id}/approve"
    description: >
      The building representative approves a submitted option. Blocked while any code trigger is
      still REQUIRED, while the tier ranks below the countersigned recommendation, and when the
      approved total would push the project's approved scope value past its contract value.
    roles: [BuildingRepresentative]
    code: 200
    input: []
    output: ScopeOption
    side_effects:
      - "status SUBMITTED -> APPROVED; the price is frozen from here on"
      - "Adds total_price_cents to ModernizationProject.approved_scope_value_cents"
      - "Sets ElevatorCar.approved_scope_option_id and moves work_status SCOPED -> PROCURING"
      - "ModernizationProject.status SCOPING -> EXECUTION on the project's first approval"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/scope-options/{scope_option_id}/reject"
    description: "The building representative rejects a submitted option with a reason."
    roles: [BuildingRepresentative]
    code: 200
    input: [rejection_note]
    output: ScopeOption
    side_effects:
      - "status SUBMITTED -> REJECTED; rejection_note stored"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/scope-options/{scope_option_id}/revise"
    description: >
      Reopen a rejected option for repricing. Capped at REVISION_LIMIT revisions, after which a
      fresh option must be created instead.
    roles: [ProjectManager]
    code: 200
    input: ["base_price_cents?"]
    output: ScopeOption
    side_effects:
      - "status REJECTED -> DRAFT; increments revision_count by 1; clears rejection_note"
      - "ElevatorCar.work_status SCOPED -> SURVEYED"
      - "Re-runs code_upgrade_cents and scope_option_pricing (the trigger set itself is NOT re-synthesized)"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/scope-options/{scope_option_id}/rescind"
    description: >
      Withdraw an approved option, e.g. when the owner defers the car to a later phase. Origin of
      the six-link procurement unwind cascade.
    roles: [ProjectManager]
    code: 200
    input: []
    output: ScopeOption
    side_effects:
      - "Cascade link 1: status APPROVED -> SUPERSEDED and total_price_cents leaves ModernizationProject.approved_scope_value_cents"
      - "Cascade link 2: every ProcurementOrder of this option in DRAFT, ORDERED or STAGED becomes CANCELLED (INSTALLED orders are untouched)"
      - "Cascade link 3: every StagingReservation of a cancelled order in status HELD becomes RELEASED and its sqft leaves ModernizationProject.staging_committed_sqft"
      - "Cascade link 4: project_downtime_posture is recomputed from the reduced staging commitment"
      - "Cascade link 5: ElevatorCar.work_status PROCURING -> SCOPED, approved_scope_option_id cleared, and compliance_status -> NOT_EVALUATED because no live option remains"
      - "Cascade link 6: every OutageWindow of that car in status PLANNED becomes CANCELLED"
      - "Increments ModernizationProject.version by 1"

  # --- CodeTrigger ---------------------------------------------------------
  - method: GET
    path: "/code-triggers/{code_trigger_id}"
    description: "Read one code compliance trigger."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: CodeTrigger
    side_effects: []

  - method: GET
    path: "/code-triggers"
    description: >
      List code triggers, optionally narrowed to one scope option. This is the only discovery
      channel for triggers, which are created by cascade and never returned by a creation response.
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["scope_option_id?", "status?", "trigger_type?"]
    output: CodeTrigger[]
    side_effects: []

  - method: POST
    path: "/code-triggers/{code_trigger_id}/price"
    description: "Attach the cost of satisfying a code trigger, which folds it into the option price."
    roles: [ProjectManager]
    code: 200
    input: [cost_cents]
    output: CodeTrigger
    side_effects:
      - "status REQUIRED -> PRICED; cost_cents stored"
      - "Re-runs code_upgrade_cents (per-line surcharge rounding) and scope_option_pricing on the parent option"
      - "ElevatorCar.compliance_status TRIGGERS_OPEN -> TRIGGERS_CLEARED when no REQUIRED trigger remains on the option"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/code-triggers/{code_trigger_id}/waive"
    description: >
      Record a jurisdiction waiver for a trigger. A waived trigger contributes nothing to the
      option price even if it had already been priced.
    roles: [AHJInspector]
    code: 200
    input: [waiver_reference]
    output: CodeTrigger
    side_effects:
      - "status REQUIRED or PRICED -> WAIVED; waiver_reference stored"
      - "Re-runs code_upgrade_cents and scope_option_pricing on the parent option"
      - "ElevatorCar.compliance_status TRIGGERS_OPEN -> TRIGGERS_CLEARED when no REQUIRED trigger remains on the option"
      - "Increments ModernizationProject.version by 1"

  # --- ProcurementOrder ----------------------------------------------------
  - method: POST
    path: "/procurement-orders"
    description: >
      Raise a long-lead equipment order against an approved or in-flight option. The order's lead
      time re-tiers the option's escalation while the option is still DRAFT or SUBMITTED.
    roles: [ProjectManager]
    code: 201
    input: [scope_option_id, item_type, lead_time_days, required_staging_sqft]
    output: ProcurementOrder
    side_effects:
      - "status = DRAFT; ordered_at = null; promised_delivery_date = null; staging_reservation_id = null"
      - "Re-runs scope_option_pricing when the option is DRAFT or SUBMITTED; an APPROVED option's price is unchanged"
      - "Increments ModernizationProject.version by 1"

  - method: GET
    path: "/procurement-orders/{procurement_order_id}"
    description: "Read one procurement order."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: []

  - method: GET
    path: "/procurement-orders"
    description: "List procurement orders, optionally narrowed to one scope option."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["scope_option_id?", "status?", "item_type?"]
    output: ProcurementOrder[]
    side_effects: []

  - method: POST
    path: "/procurement-orders/{procurement_order_id}/issue"
    description: >
      Issue the order to the factory. Stamps ordered_at from the logical clock and derives
      promised_delivery_date as ordered_at plus lead_time_days.
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects:
      - "status DRAFT -> ORDERED"
      - "ordered_at = current logical clock; promised_delivery_date = ordered_at + lead_time_days days"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/procurement-orders/{procurement_order_id}/receive"
    description: >
      Receive delivered equipment into a staging hold that already exists for this order. The
      reservation must belong to this order.
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: [staging_reservation_id]
    output: ProcurementOrder
    side_effects:
      - "status ORDERED -> STAGED; staging_reservation_id stored as a denormalized pointer"
      - "Increments ModernizationProject.version by 1"

  - method: POST
    path: "/procurement-orders/{procurement_order_id}/install"
    description: "Install staged equipment in the hoistway, which frees the staging footage."
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects:
      - "status STAGED -> INSTALLED"
      - "The order's HELD StagingReservation becomes RELEASED with released_at = current logical clock"
      - "Subtracts the released sqft from ModernizationProject.staging_committed_sqft"
      - "Recomputes project_downtime_posture; increments ModernizationProject.version by 1"

  - method: POST
    path: "/procurement-orders/{procurement_order_id}/cancel"
    description: "Cancel an order that has not yet been installed."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects:
      - "status DRAFT, ORDERED or STAGED -> CANCELLED"
      - "Any HELD StagingReservation of this order becomes RELEASED and its sqft leaves ModernizationProject.staging_committed_sqft"
      - "Re-runs scope_option_pricing when the parent option is DRAFT or SUBMITTED, which can drop the escalation tier"
      - "Recomputes project_downtime_posture; increments ModernizationProject.version by 1"

  # --- StagingReservation --------------------------------------------------
  - method: POST
    path: "/staging-reservations"
    description: >
      Reserve staging square footage for an order over a half-open interval. Rejected when the
      pointwise sum of overlapping HELD footage plus this hold would strictly exceed the yard.
      OCC-guarded because the yard is a finite shared pool recorded on the project.
    roles: [ProjectManager, ServiceManager]
    code: 201
    input: [procurement_order_id, sqft, hold_start, hold_end, expected_project_version]
    output: StagingReservation
    side_effects:
      - "status = HELD; released_at = null"
      - "Adds sqft to ModernizationProject.staging_committed_sqft"
      - "Recomputes project_downtime_posture; increments ModernizationProject.version by 1"

  - method: GET
    path: "/staging-reservations/{staging_reservation_id}"
    description: "Read one staging reservation."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: StagingReservation
    side_effects: []

  - method: GET
    path: "/staging-reservations"
    description: "List staging reservations, optionally narrowed to one procurement order."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["procurement_order_id?", "status?"]
    output: StagingReservation[]
    side_effects: []

  - method: POST
    path: "/staging-reservations/{staging_reservation_id}/release"
    description: "Release a staging hold early, returning its footage to the yard."
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: []
    output: StagingReservation
    side_effects:
      - "status HELD -> RELEASED; released_at = current logical clock"
      - "Subtracts sqft from ModernizationProject.staging_committed_sqft"
      - "Recomputes project_downtime_posture; increments ModernizationProject.version by 1"

  # --- OutageWindow --------------------------------------------------------
  - method: POST
    path: "/outage-windows"
    description: >
      Plan a car-by-car outage window. Conflicts with any PLANNED or ACTIVE window on the same
      group once both ends are inflated by the project buffer, so back-to-back outages in one group
      are rejected. In an occupied building the window must name a temporary service plan other
      than STAIRS_ONLY.
    roles: [ProjectManager]
    code: 201
    input: [car_id, start_at, end_at, temporary_service_plan, "predecessor_window_id?"]
    output: OutageWindow
    side_effects:
      - "status = PLANNED; extension_hours = 0; notice_count = 0; advance_notice_sent_at = null"
      - "notice_lead_hours snapshots ModernizationProject.tenant_notice_lead_hours at planning time"
      - "Evaluates outage_group_buffer against the group's PLANNED and ACTIVE windows"

  - method: GET
    path: "/outage-windows/{outage_window_id}"
    description: "Read one outage window."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: OutageWindow
    side_effects: []

  - method: GET
    path: "/outage-windows"
    description: >
      List outage windows, optionally narrowed to one car or to the successors of one window (the
      self-referential predecessor chain).
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["car_id?", "predecessor_window_id?", "status?"]
    output: OutageWindow[]
    side_effects: []

  - method: POST
    path: "/outage-windows/{outage_window_id}/send-notice"
    description: >
      Send the tenant communication for an upcoming outage and stamp when it went out. The stamp is
      what the notice-lead rule measures at activation time.
    roles: [ProjectManager, BuildingRepresentative]
    code: 200
    input: []
    output: OutageWindow
    side_effects:
      - "advance_notice_sent_at = current logical clock on the first notice; increments notice_count by 1"
      - "Later notices increment notice_count but never move advance_notice_sent_at"

  - method: POST
    path: "/outage-windows/{outage_window_id}/activate"
    description: >
      Take the car out of service and start the outage. Re-checks the group buffer, the tenant
      notice lead, the concurrency cap, the group service floor, the project posture and window
      expiry.
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: []
    output: OutageWindow
    side_effects:
      - "status PLANNED -> ACTIVE; activated_at = current logical clock"
      - "ElevatorCar.work_status PROCURING -> OUTAGE_ACTIVE"
      - "Decrements ElevatorGroup.cars_in_service by 1"
      - "Increments ModernizationProject.active_outage_count by 1 and version by 1"
      - "Recomputes project_downtime_posture"

  - method: POST
    path: "/outage-windows/{outage_window_id}/complete"
    description: "Close out an active outage window."
    roles: [ProjectManager, ServiceManager]
    code: 200
    input: []
    output: OutageWindow
    side_effects:
      - "status ACTIVE -> COMPLETED; completed_at = current logical clock"
      - "Does NOT change the car's work_status: the car leaves OUTAGE_ACTIVE only via begin-testing"

  - method: POST
    path: "/outage-windows/{outage_window_id}/cancel"
    description: "Cancel a planned window that will not be used."
    roles: [ProjectManager]
    code: 200
    input: []
    output: OutageWindow
    side_effects:
      - "status PLANNED -> CANCELLED"
      - "Frees the window's span for other cars in the group"

  # --- InspectionAppointment ----------------------------------------------
  - method: POST
    path: "/inspection-appointments"
    description: >
      Request an acceptance inspection from the jurisdiction. The requested date must be at least
      jurisdiction.inspection_lead_days ahead of the logical clock, and the lead actually available
      is snapshotted for audit.
    roles: [ProjectManager, ServiceManager]
    code: 201
    input: [car_id, requested_date, "witness_requested?"]
    output: InspectionAppointment
    side_effects:
      - "status = REQUESTED; scheduled_at = null; reschedule_count = 0; punch_list_count = 0"
      - "recorded_by_jurisdiction_id = the project's jurisdiction_id"
      - "lead_days_at_request = whole days between the logical clock and requested_date"
      - "witness_requested defaults to jurisdiction.witness_test_required when omitted"

  - method: GET
    path: "/inspection-appointments/{inspection_appointment_id}"
    description: "Read one inspection appointment."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: InspectionAppointment
    side_effects: []

  - method: GET
    path: "/inspection-appointments"
    description: "List inspection appointments, optionally narrowed to one car."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["car_id?", "status?"]
    output: InspectionAppointment[]
    side_effects: []

  - method: POST
    path: "/inspection-appointments/{inspection_appointment_id}/schedule"
    description: "The inspector fixes the appointment's date and time."
    roles: [AHJInspector]
    code: 200
    input: [scheduled_at]
    output: InspectionAppointment
    side_effects:
      - "status REQUESTED -> SCHEDULED; scheduled_at stored"

  - method: POST
    path: "/inspection-appointments/{inspection_appointment_id}/reschedule"
    description: >
      Move a scheduled appointment. Capped at RESCHEDULE_LIMIT moves, and the new date must still
      satisfy the jurisdiction's inspection lead. An appointment that has already been ruled on is
      not reschedulable at all.
    roles: [AHJInspector, ProjectManager]
    code: 200
    input: [scheduled_at]
    output: InspectionAppointment
    side_effects:
      - "status SCHEDULED -> SCHEDULED (self-loop); increments reschedule_count by 1"
      - "lead_days_at_request is recomputed against the new scheduled_at"

  - method: POST
    path: "/inspection-appointments/{inspection_appointment_id}/record-result"
    description: >
      The inspector rules on the acceptance test. PASSED accepts the car and satisfies its code
      triggers, CONDITIONAL accepts it with a punch list, and FAILED sends the car back into outage
      and is the origin of the reinspection cascade.
    roles: [AHJInspector]
    code: 200
    input: [result, "punch_list_count?"]
    output: InspectionAppointment
    side_effects:
      - "PASSED: status SCHEDULED -> PASSED; ElevatorCar.work_status TESTING -> ACCEPTED (a car already in ACCEPTED, e.g. after a CONDITIONAL ruling, stays ACCEPTED); compliance_status TRIGGERS_CLEARED -> CODE_ACCEPTED; every PRICED or WAIVED CodeTrigger of the car's approved option becomes SATISFIED"
      - "CONDITIONAL: status SCHEDULED -> CONDITIONAL; punch_list_count stored and required to be at least 1; ElevatorCar.work_status TESTING -> ACCEPTED; compliance_status is left unchanged so the car is not yet CODE_ACCEPTED"
      - "PASSED or CONDITIONAL: ModernizationProject.status EXECUTION -> CLOSEOUT once every car of the project is ACCEPTED, IN_WARRANTY or UNDER_CONTRACT"
      - "FAILED cascade link 1: status SCHEDULED -> FAILED; ElevatorCar.work_status TESTING or ACCEPTED -> OUTAGE_ACTIVE; compliance_status -> TRIGGERS_OPEN; every PRICED or SATISFIED CodeTrigger of the approved option reverts to REQUIRED while WAIVED triggers stay WAIVED"
      - "FAILED cascade link 2: the car's COMPLETED OutageWindow with the greatest completed_at (tie-break created_at ascending) reopens to ACTIVE with end_at extended by jurisdiction.reinspection_extension_hours and extension_hours increased by the same amount; if the car has no COMPLETED window nothing reopens and the car still reverts"
      - "FAILED cascade link 3: ElevatorGroup.cars_in_service decrements by 1 and ModernizationProject.active_outage_count increments by 1"
      - "FAILED cascade link 4: project_downtime_posture is recomputed and becomes FROZEN when the group falls below its floor"
      - "FAILED cascade link 5: ModernizationProject.status CLOSEOUT -> EXECUTION when the project had already reached CLOSEOUT"
      - "Increments ModernizationProject.version by 1 in every branch"

  # --- WarrantyTransition --------------------------------------------------
  - method: POST
    path: "/warranty-transitions"
    description: >
      Open the modernization warranty for an accepted, code-accepted car. This is the handover
      record that later folds into a maintenance contract.
    roles: [ServiceManager, ProjectManager]
    code: 201
    input: [car_id, warranty_months]
    output: WarrantyTransition
    side_effects:
      - "status = PENDING; maintenance_contract_id = null; provisional_credit_cents = 0; final_credit_cents = 0"
      - "warranty_start = current logical clock; warranty_end = warranty_start + warranty_months months"
      - "ElevatorCar.work_status ACCEPTED -> IN_WARRANTY"
      - "Increments ModernizationProject.version by 1"

  - method: GET
    path: "/warranty-transitions/{warranty_transition_id}"
    description: "Read one warranty transition with both of its credit figures."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: WarrantyTransition
    side_effects: []

  - method: GET
    path: "/warranty-transitions"
    description: "List warranty transitions, optionally narrowed to one car or one maintenance contract."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["car_id?", "maintenance_contract_id?", "status?"]
    output: WarrantyTransition[]
    side_effects: []

  - method: GET
    path: "/warranty-transitions/{warranty_transition_id}/credit-preview"
    description: >
      Computed read: values the unexpired warranty under an explicitly named day-count basis
      without writing, so the provisional and final bases can be compared on identical inputs.
    roles: [ProjectManager, BuildingRepresentative, ServiceManager, SystemOperator]
    code: 200
    input: [basis]
    output:
      basis: "THIRTY_360 | ACTUAL_CALENDAR"
      day_count: "integer days between the contract coverage_start and warranty_end under this basis"
      per_car_monthly_cents: "integer, the car's monthly maintenance rate"
      credit_cents: "integer cents"
    side_effects: []

  - method: POST
    path: "/warranty-transitions/{warranty_transition_id}/enroll"
    description: >
      Attach the warranty to a draft maintenance contract and value the unexpired remainder on the
      provisional 30/360 basis.
    roles: [ServiceManager]
    code: 200
    input: [maintenance_contract_id]
    output: WarrantyTransition
    side_effects:
      - "status PENDING -> ENROLLED; maintenance_contract_id stored"
      - "Computes provisional_credit_cents via warranty_unexpired_credit variant THIRTY_360"
      - "Increments ModernizationProject.version by 1"

  # --- MaintenanceContract -------------------------------------------------
  - method: POST
    path: "/maintenance-contracts"
    description: "Draft the ongoing maintenance contract that the modernization warranty rolls into."
    roles: [ServiceManager]
    code: 201
    input: [project_id, monthly_base_cents, coverage_start]
    output: MaintenanceContract
    side_effects:
      - "status = DRAFT; monthly_total_cents = 0; cars_covered = 0; total_final_credit_cents = 0"

  - method: GET
    path: "/maintenance-contracts/{maintenance_contract_id}"
    description: "Read one maintenance contract with its computed monthly total."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: []
    output: MaintenanceContract
    side_effects: []

  - method: GET
    path: "/maintenance-contracts"
    description: "List maintenance contracts, optionally narrowed to one project."
    roles: [ProjectManager, SurveyTechnician, BuildingRepresentative, AHJInspector, ServiceManager, SystemOperator]
    code: 200
    input: ["project_id?", "status?"]
    output: MaintenanceContract[]
    side_effects: []

  - method: POST
    path: "/maintenance-contracts/{maintenance_contract_id}/activate"
    description: >
      Activate the contract. Prices every enrolled car with per-car rounding, restates each
      warranty credit on the actual-calendar basis, and moves the covered cars under contract.
    roles: [ServiceManager]
    code: 200
    input: []
    output: MaintenanceContract
    side_effects:
      - "status DRAFT -> ACTIVE"
      - "Runs maintenance_monthly_total, writing monthly_total_cents and cars_covered"
      - "For every ENROLLED WarrantyTransition: recomputes final_credit_cents via warranty_unexpired_credit variant ACTUAL_CALENDAR and moves status ENROLLED -> UNDER_CONTRACT"
      - "total_final_credit_cents = sum of the recomputed final credits"
      - "Every covered ElevatorCar moves work_status IN_WARRANTY -> UNDER_CONTRACT"
      - "ModernizationProject.status CLOSEOUT -> COMPLETED when cars_covered equals ModernizationProject.car_count"
      - "Increments ModernizationProject.version by 1"

  # --- Test-driving surface (last resort per the §1.5 priority ladder) ------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Set the server's logical UTC clock, which is what every lead-time, expiry, stamping and
      day-count rule reads. Before any call to this endpoint the logical clock reads exactly
      2026-08-01T00:00:00Z and never falls back to wall-clock time.
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: "the new logical clock value, ISO-8601"
      lapsed_warranty_transition_count: "integer count of PENDING transitions moved to LAPSED by this call"
    side_effects:
      - "Every WarrantyTransition in status PENDING whose warranty_end is at or before the new clock moves to LAPSED"
      - "Recomputes project_downtime_posture for every project"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- auth / authorization (priority bands 1, 2, 5, 6, 7) -------------------
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header absent, empty, or not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles"
  - id: ERR_PROJECT_SCOPE_MISMATCH
    http: 403
    condition: "A BuildingRepresentative's X-User-ID is not the id of the project owning the target resource"
  - id: ERR_JURISDICTION_SCOPE_MISMATCH
    http: 403
    condition: "An AHJInspector's X-User-ID is not the id of the jurisdiction of the project owning the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The countersigning user is the same user recorded as EquipmentSurvey.surveyed_by_user_id"

  # -- existence and request shape (bands 3, 4, 8) --------------------------
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or a body foreign key does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: >
      Missing required field, unknown field, enum value outside the declared set, negative integer
      or money amount, malformed timestamp, hold_end not after hold_start, end_at not after
      start_at, seismic_zone outside 0..4, warranty_months outside 12..60, or a basis query
      parameter that is not a declared variant name

  # -- optimistic concurrency (band 9) --------------------------------------
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current ModernizationProject.version"

  # -- state preconditions (band 10) ----------------------------------------
  - id: ERR_PROJECT_STATE_INVALID
    http: 409
    condition: >
      The ModernizationProject's status does not permit the requested operation: a COMPLETED
      project is closed to new ElevatorCar, ScopeOption and OutageWindow rows
  - id: ERR_CAR_STATE_INVALID
    http: 409
    condition: >
      The ElevatorCar's work_status or compliance_status does not permit the requested operation
      (surveying a car past SURVEYED, scoping a car with no COUNTERSIGNED survey, beginning testing
      on a car that is not OUTAGE_ACTIVE, and so on)
  - id: ERR_SURVEY_STATE_INVALID
    http: 409
    condition: "Countersigning a survey whose status is not SUBMITTED (already COUNTERSIGNED, or VOID)"
  - id: ERR_SCOPE_OPTION_STATE_INVALID
    http: 409
    condition: >
      The ScopeOption's status does not permit the requested transition (submitting a non-DRAFT
      option, approving or rejecting a non-SUBMITTED option, revising a non-REJECTED option, or
      rescinding an option that is not APPROVED)
  - id: ERR_CODE_TRIGGER_STATE_INVALID
    http: 409
    condition: "Pricing a trigger that is not REQUIRED, or waiving a trigger that is already WAIVED or SATISFIED"
  - id: ERR_PROCUREMENT_STATE_INVALID
    http: 409
    condition: >
      The ProcurementOrder's status does not permit the requested transition (issuing a non-DRAFT
      order, receiving a non-ORDERED order, installing a non-STAGED order, or cancelling an
      INSTALLED order)
  - id: ERR_RESERVATION_STATE_INVALID
    http: 409
    condition: "Releasing a StagingReservation that is already RELEASED"
  - id: ERR_OUTAGE_STATE_INVALID
    http: 409
    condition: >
      The OutageWindow's status does not permit the requested transition (activating a window that
      is not PLANNED, completing a window that is not ACTIVE, or cancelling a window that is not
      PLANNED)
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "Scheduling an appointment that is not REQUESTED, or recording a result on an appointment that is not SCHEDULED"
  - id: ERR_INSPECTION_NOT_RESCHEDULABLE
    http: 409
    condition: >
      Rescheduling an appointment whose status is not SCHEDULED, i.e. one already ruled PASSED,
      CONDITIONAL, FAILED or CANCELLED. Distinct from ERR_INSPECTION_STATE_INVALID so the operator
      learns that the ruling, not the request shape, closed the appointment
  - id: ERR_SCOPE_OPTION_NOT_APPROVED
    http: 409
    condition: "Issuing a procurement order whose parent ScopeOption has not reached APPROVED"
  - id: ERR_WARRANTY_STATE_INVALID
    http: 409
    condition: "Enrolling a WarrantyTransition that is not PENDING (already ENROLLED, UNDER_CONTRACT, or LAPSED)"
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "Activating a MaintenanceContract that is already ACTIVE, or enrolling into a contract that is already ACTIVE"

  # -- business_referential (band 11) ---------------------------------------
  - id: ERR_CAR_GROUP_MISMATCH
    http: 409
    condition: "A declared predecessor OutageWindow belongs to a car outside the new window's ElevatorGroup"
  - id: ERR_RESERVATION_ORDER_MISMATCH
    http: 409
    condition: "The StagingReservation named in a receive call does not belong to the procurement order being received"
  - id: ERR_CONTRACT_PROJECT_MISMATCH
    http: 409
    condition: "A WarrantyTransition's car belongs to a project other than the MaintenanceContract's project"

  # -- business_safety (band 12) --------------------------------------------
  - id: ERR_CODE_TRIGGER_OPEN
    http: 409
    condition: "Approving a ScopeOption while at least one of its CodeTriggers is still in status REQUIRED"
  - id: ERR_SCOPE_TIER_BELOW_RECOMMENDATION
    http: 409
    condition: "Approving a ScopeOption whose tier ranks below the car's countersigned recommended_scope_tier"
  - id: ERR_GROUP_SERVICE_FLOOR
    http: 409
    condition: "Activating an outage would leave the car's ElevatorGroup with fewer cars in service than min_cars_in_service"
  - id: ERR_TEMP_SERVICE_PLAN_INADEQUATE
    http: 409
    condition: "Planning an outage in a project whose occupancy_type is OCCUPIED with temporary_service_plan STAIRS_ONLY"
  - id: ERR_PUNCH_LIST_REQUIRED
    http: 409
    condition: "Recording a CONDITIONAL inspection result with punch_list_count omitted or zero"
  - id: ERR_CAR_NOT_CODE_ACCEPTED
    http: 409
    condition: "Opening a WarrantyTransition for a car whose compliance_status is not CODE_ACCEPTED"

  # -- business_temporal (band 13) ------------------------------------------
  - id: ERR_OUTAGE_BUFFER_CONFLICT
    http: 409
    condition: >
      A PLANNED or ACTIVE outage window on the same ElevatorGroup conflicts once both ends are
      inflated by project.outage_buffer_hours (adjacency included)
  - id: ERR_PREDECESSOR_NOT_COMPLETE
    http: 409
    condition: "The declared predecessor OutageWindow is not in status COMPLETED, or the new window starts before the predecessor ends"
  - id: ERR_TENANT_NOTICE_LEAD_UNMET
    http: 409
    condition: >
      Activating an outage whose advance_notice_sent_at is null, or later than start_at minus
      notice_lead_hours
  - id: ERR_INSPECTION_LEAD_UNMET
    http: 409
    condition: >
      A requested or rescheduled inspection date is fewer than jurisdiction.inspection_lead_days
      whole days after the current logical clock
  - id: ERR_WINDOW_EXPIRED
    http: 409
    condition: "Activating an outage window whose end_at is at or before the current logical clock"

  # -- business_constraint (band 14) ----------------------------------------
  - id: ERR_CONCURRENCY_CAP_EXCEEDED
    http: 409
    condition: "Activating an outage when active_outage_count already equals max_concurrent_outages"
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "Activating an outage or creating a staging hold while the project's downtime_posture is FROZEN"
  - id: ERR_RESCHEDULE_LIMIT
    http: 409
    condition: "Rescheduling an appointment whose reschedule_count already equals RESCHEDULE_LIMIT (2)"
  - id: ERR_REVISION_LIMIT
    http: 409
    condition: "Revising a ScopeOption whose revision_count already equals REVISION_LIMIT (3)"
  - id: ERR_PROCUREMENT_NOT_INSTALLED
    http: 409
    condition: >
      Beginning acceptance testing while any non-CANCELLED ProcurementOrder of the car's approved
      option is not INSTALLED, or while the approved option has no procurement order at all
  - id: ERR_NO_ENROLLED_TRANSITIONS
    http: 409
    condition: "Activating a MaintenanceContract with zero WarrantyTransitions in status ENROLLED"

  # -- business_fiscal (band 15) --------------------------------------------
  - id: ERR_STAGING_CAPACITY_EXCEEDED
    http: 409
    condition: >
      The pointwise sum of overlapping HELD staging footage plus the requested sqft strictly
      exceeds project.staging_area_sqft at some instant inside [hold_start, hold_end)
  - id: ERR_SCOPE_BUDGET_EXCEEDED
    http: 409
    condition: >
      Approving a ScopeOption would push ModernizationProject.approved_scope_value_cents strictly
      above contract_value_cents

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: ProjectManager
    description: >
      The modernization contractor's project manager. Owns the project record, the scope options,
      procurement, staging and outage planning. Cannot approve their own scope options and cannot
      rule on an inspection.
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "PATCH /projects/{project_id}"
      - "POST /elevator-groups"
      - "POST /elevator-cars"
      - "POST /scope-options"
      - "POST /scope-options/{scope_option_id}/submit"
      - "POST /scope-options/{scope_option_id}/revise"
      - "POST /scope-options/{scope_option_id}/rescind"
      - "POST /code-triggers/{code_trigger_id}/price"
      - "POST /procurement-orders"
      - "POST /procurement-orders/{procurement_order_id}/issue"
      - "POST /procurement-orders/{procurement_order_id}/cancel"
      - "POST /outage-windows"
      - "POST /outage-windows/{outage_window_id}/cancel"
    shared_operations:
      - "POST /equipment-surveys/{survey_id}/countersign (shared with SurveyTechnician; never by the surveyor of record)"
      - "PATCH /elevator-groups/{group_id} (shared with BuildingRepresentative)"
      - "POST /elevator-cars/{car_id}/begin-testing (shared with ServiceManager)"
      - "POST /procurement-orders/{procurement_order_id}/receive and /install (shared with ServiceManager)"
      - "POST /staging-reservations and /staging-reservations/{staging_reservation_id}/release (shared with ServiceManager)"
      - "POST /outage-windows/{outage_window_id}/send-notice (shared with BuildingRepresentative)"
      - "POST /outage-windows/{outage_window_id}/activate and /complete (shared with ServiceManager)"
      - "POST /inspection-appointments (shared with ServiceManager)"
      - "POST /inspection-appointments/{inspection_appointment_id}/reschedule (shared with AHJInspector)"
      - "POST /warranty-transitions (shared with ServiceManager)"
      - "All GET endpoints"

  - name: SurveyTechnician
    description: >
      The field technician who assesses controller, machine and door equipment condition. Two
      distinct technician identities are required to submit and countersign a survey.
    identity: opaque
    exclusive_operations:
      - "POST /equipment-surveys"
    shared_operations:
      - "POST /equipment-surveys/{survey_id}/countersign (shared with ProjectManager; never by the surveyor of record)"
      - "All GET endpoints except GET /projects/{project_id}/posture, GET /equipment-surveys/{survey_id}/score-preview and GET /warranty-transitions/{warranty_transition_id}/credit-preview"

  - name: BuildingRepresentative
    description: >
      The building owner's representative. Approves or rejects scope options, tightens the group
      service floor and signs off tenant communications. X-User-ID is the id of the
      ModernizationProject they represent, so they can only act on their own building.
    identity: "entity_backed:ModernizationProject"
    exclusive_operations:
      - "POST /scope-options/{scope_option_id}/approve"
      - "POST /scope-options/{scope_option_id}/reject"
    shared_operations:
      - "PATCH /elevator-groups/{group_id} (shared with ProjectManager)"
      - "POST /outage-windows/{outage_window_id}/send-notice (shared with ProjectManager)"
      - "All GET endpoints, scoped to their own project"

  - name: AHJInspector
    description: >
      The authority having jurisdiction's inspector. Schedules and rules on acceptance inspections
      and issues code waivers. X-User-ID is the id of the Jurisdiction they inspect for, so they
      can only act on projects in that jurisdiction.
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /code-triggers/{code_trigger_id}/waive"
      - "POST /inspection-appointments/{inspection_appointment_id}/schedule"
      - "POST /inspection-appointments/{inspection_appointment_id}/record-result"
    shared_operations:
      - "POST /inspection-appointments/{inspection_appointment_id}/reschedule (shared with ProjectManager)"
      - "All GET endpoints except GET /projects/{project_id}/posture, GET /equipment-surveys/{survey_id}/score-preview and GET /warranty-transitions/{warranty_transition_id}/credit-preview, scoped to their own jurisdiction"

  - name: ServiceManager
    description: >
      The contractor's service organisation, which receives and installs equipment, runs the outage
      floor, and owns the warranty-to-maintenance handover. Cannot create or price scope options.
    identity: opaque
    exclusive_operations:
      - "POST /warranty-transitions/{warranty_transition_id}/enroll"
      - "POST /maintenance-contracts"
      - "POST /maintenance-contracts/{maintenance_contract_id}/activate"
    shared_operations:
      - "POST /elevator-cars/{car_id}/begin-testing (shared with ProjectManager)"
      - "POST /procurement-orders/{procurement_order_id}/receive and /install (shared with ProjectManager)"
      - "POST /staging-reservations and /staging-reservations/{staging_reservation_id}/release (shared with ProjectManager)"
      - "POST /outage-windows/{outage_window_id}/activate and /complete (shared with ProjectManager)"
      - "POST /inspection-appointments (shared with ProjectManager)"
      - "POST /warranty-transitions (shared with ProjectManager)"
      - "All GET endpoints"

  - name: SystemOperator
    description: >
      The platform operator. Registers jurisdictions and drives the logical clock. Holds no
      business authority over surveys, scope, procurement, outages, inspections or contracts.
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
