        claim_type: Priority Ordering
        grounds:
          - validations[priority=29]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: validation_priority_pair / enrollments_not_approved_beats_credentialing_lead_time_short
          rationale: "The named §1.8 instance builds a contract that fails both gates and asserts the priority 29 code, then repairs each gate in turn."

