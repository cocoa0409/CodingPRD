              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "GOLD" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 3999, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /program-change-orders"
              payload: { program_id: "${prog_id}", change_type: "SSP_CHANGE", new_ssp_millicents_per_point: 1500, behavior_elasticity_bp: -400, effective_at: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ord_id: $.data.id }
          assert:
            - "PointLot.${lot1_id}.points_issued == 4999 (round_half_up(3999 * 12500 / 10000) == round_half_up(4998.75)) and gross_ssp_cents == 5999 (round_half_up(5998.8))"
            - "ProgramChangeOrder.${ord_id}.baseline_redemption_rate_bp == 7500 (10000 - current_breakage_rate_bp 2500)"
            - "ProgramChangeOrder.${ord_id}.projected_redemption_rate_bp == 7100 (7500 + -400, inside [200, 9800])"
            - "ProgramChangeOrder.${ord_id}.baseline_outstanding_gross_ssp_cents == 5999 - the lot's own at-issue ssp 1200"
            - "ProgramChangeOrder.${ord_id}.projected_outstanding_gross_ssp_cents == 7499 - the SAME 4999 points at the proposed ssp 1500, round_half_up(7498.5) rounding UP"
            - "ProgramChangeOrder.${ord_id}.projected_liability_delta_cents == 825 - round_half_up(7499 * 7100 / 10000) == 5324 minus round_half_up(5999 * 7500 / 10000) == 4499, each leg rounded before the subtraction"
            - "ProgramChangeOrder.${ord_id}.state == MODELED and applied_at == null"
            - "LoyaltyProgram.${prog_id}.ssp_millicents_per_point is STILL 1200 and PointLot.${lot1_id}.ssp_millicents_per_point_at_issue is STILL 1200 - modelling mutates nothing"

