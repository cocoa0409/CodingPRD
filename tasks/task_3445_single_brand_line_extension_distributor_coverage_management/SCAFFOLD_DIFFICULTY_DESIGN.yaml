            - "Formulation.${form_id}.status remains COMPARTMENTALIZED (mfr1 and mfr2 coverage intact)"
            - "ContractManufacturer.${mfr3_id}.status remains QUALIFIED (for_cause=false fires no cascade)"
            - "Brand.${brand_id}.protection_posture remains NORMAL (no for-cause revocation occurred)"
