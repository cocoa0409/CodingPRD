              as: Underwriter
          assert:
            - "LoanOffer.${o_id}.preapproved_cents == 1250000"
            - "LoanOffer.${o_id}.preapproved_standard_cents == 1250000"
            - "LoanOffer.${o_id}.preapproved_conservative_cents == 1250000"
            - "LoanOffer.${o_id}.seasonality_index_at_generation == 0"

      - name: daily_holdback_per_day_rounding
        grounds:
          - calculations.daily_holdback
          - entities.SettlementSweep.fields.holdback_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding combinatorial formula: rounding order is
          pinned per-day-then-sum. Seven days at net 1,005 cents with 10%
          holdback round to 101 per day -> 707 total; the alternative
          weekly-sum-then-round interpretation would give 704. Asserts the
          pinned per-day order.
        test_recipe:
          setup:
            - "Flat merchant (TX) ELIGIBLE; offer issued; loan accepted for principal 500,000 @ 0.10 (total 555,000), guarantor ACTIVE, disclosure DELIVERED, loan ACTIVE at clock 2026-09-01"
          setup_api_calls:
            - call: "POST /lending/merchants"
