            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "INSUFFICIENT_INFO" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det: "$.data[0].id" } }
            - { call: "POST /um/determinations/${det}/appeals", payload: { appeal_reason: "Appeal" }, as: AppealsClerk, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /um/appeals/${ap}/decide", payload: { outcome: "UPHELD" }, as: UMAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS with http 403"

  # ------------------------------------------------- cross-cutting layers -----
  - section: cross_cutting_layers
    instances:
      - name: guideline_version_pinning_holds_across_supersede
        claim_type: version_pinning_on_approval
        grounds: [entities.PriorAuthRequest.fields.guideline_version_id, entities.Determination.fields.guideline_version_id]
        distinguishing_aspect: "A request pinned to v1 keeps v1 after v2 publishes and supersedes it: the determination issued later still carries guideline_version_id == v1 and the notice cites '...@1.0'."
        test_recipe:
          setup: ["Active criteria set; provider; request pinned to v1 (PENDED_REVIEW); v2 then published superseding v1"]
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv1: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv1}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "2000000033", name: "Pinned Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id, pinned: $.data.guideline_version_id } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "2.0", content: "c2", auto_approve_eligible: false, effective_from: "2026-09-01T00:00:00Z", supersedes_version_id: "${gv1}" }, as: ClinicalPolicyEditor, captures: { gv2: $.data.id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
            - { call: "POST /um/guideline-versions/${gv2}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det_gv: "$.data[0].guideline_version_id", notice: "$.data[0].notice_text" } }
          assert:
            - "pinned == gv1 (intake pinned the version covering received_at)"
            - "det_gv == gv1 (supersession by v2 did NOT re-pin the in-flight request)"
            - "notice contains segment 'CRITERIA:Spine Imaging Criteria@1.0'"

      - name: gold_card_threshold_cycle_corner
        claim_type: rate_threshold_triggers
        grounds: [calculations.gold_card_eligibility, state_machines.Provider]
        excluded_because:
          difficulty_instance: provider_gold_card_suspend_reinstate_cycle
          rationale: "The cumulative threshold crossing (grant at >= 0.90, auto-suspend below 0.90 with count >= 10, reinstatement after voids) is asserted hop-by-hop by the named §1.8 instance."

      - name: lifetime_stats_exclude_auto_lane
        claim_type: derived_field_reconciliation
        grounds: [calculations.provider_approval_stats, entities.Provider.fields.lifetime_determination_count]
        distinguishing_aspect: "Derived-field input-set filtering: after 2 SYSTEM_RULE auto-approvals and 1 reviewer approval, lifetime_determination_count == 1 (auto-lane rows never enter either stat variant)."
        test_recipe:
          setup: ["Active criteria set with auto_approve_eligible guideline; provider with 2 auto-approved requests and 1 reviewer-approved request"]
