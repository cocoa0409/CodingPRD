  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_buffer_overlap_on_amenity
        grounds:
          - validations[priority=10]
          - calculations.amenity_slot_occupancy
          - entities.Amenity.fields.buffer_minutes
          - errors[ERR_BOOKING_OVERLAP]
        distinguishing_aspect: |
          Amenity overlap uses pairwise half-open intervals expanded by buffer_minutes (30): a booking starting
          15 min after another ends still collides (gap < buffer) even though the raw intervals are disjoint.
        test_recipe:
          setup:
            - "GYM capacity 1, buffer 30 min; booking A 2026-06-05 10:00-11:00 CONFIRMED."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Elm", address: "8 Elm St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "801", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Nia", email: "nia@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 0, buffer_minutes: 30, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-05T10:00:00Z", end_at: "2026-06-05T11:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_a_id: $.data.id }
            - call: "GET /amenities/${amenity_id}"
              payload: {}
              as: PropertyManager
              captures: { amenity_v2: $.data.version }
          trigger:
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-05T11:15:00Z", end_at: "2026-06-05T12:00:00Z", expected_amenity_version: "${amenity_v2}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_OVERLAP"

      - name: guest_concurrency_capacity_on_property
        grounds:
          - validations[priority=10]
          - state_machines.GuestPass.CREATE_to_ISSUED
          - entities.Property.fields.guest_parking_capacity
          - errors[ERR_GUEST_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Guest overlap is an aggregate-capacity rule on the Property (count of concurrently active passes <=
          guest_parking_capacity 1), not a pairwise buffer: two passes whose [arrival, departure) windows intersect
          push concurrency to 2 and the second is rejected.
        test_recipe:
          setup:
            - "Property guest_parking_capacity 1, guest_window_hours 48; resident issues pass 1 for 2026-06-01 10:00-14:00."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Elm", address: "8 Elm St", guest_parking_capacity: 1, guest_window_hours: 48 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
