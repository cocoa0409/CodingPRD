            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Cash room open for the day" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 80000 }
              as: StoreManager
              captures: { session_id: $.data.id }
            - call: "POST /cash-ops/till-sessions/${session_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 200000 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 200000, pos_card_sales_cents: 0, pos_paid_out_cents: 0 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 10 }] }
              as: CashOfficeClerk
