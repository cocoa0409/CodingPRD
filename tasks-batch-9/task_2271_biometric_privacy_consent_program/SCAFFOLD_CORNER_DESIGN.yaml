              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v_stale: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v_stale}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
          trigger:
            - call: "POST /policies/${pol2_id}/publish"
              payload: { expected_program_version: "${prog_v_stale}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { err: $.data.error_id }
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v_fresh: $.data.version }
            - call: "POST /policies/${pol2_id}/publish"
              payload: { expected_program_version: "${prog_v_fresh}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { pol2_status: $.data.status }
          assert:
            - "First trigger: HTTP 412 with data.error_id == ERR_STALE_PROGRAM_VERSION; BiometricPolicy ${pol2_id} is still IN_REVIEW with published_at null"
            - "${prog_v_fresh} == ${prog_v_stale} + 1 — the first publication incremented ComplianceProgram.version"
            - "Third trigger: HTTP 200 with ${pol2_status} == PUBLISHED, BiometricPolicy ${pol1_id} becomes SUPERSEDED, and ComplianceProgram.version increments again"
            - "The refused attempt left no trace: ${pol2_id}.version advanced only once, on the successful publish"

      - name: exposure_assessment_create_with_a_stale_expected_jurisdiction_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[exposure-assessment-create-stale-jurisdiction]
          - errors[ERR_STALE_JURISDICTION_VERSION]
          - endpoints["PATCH /jurisdictions/{jurisdiction_id}"]
        distinguishing_aspect: "The second OCC rule guards a different parent with a different code: after the statutory parameters are amended, an assessment priced from the drafter's earlier read is refused with ERR_STALE_JURISDICTION_VERSION, and the successful retry itself bumps the jurisdiction version again."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL at version 1; no consents exist, so any accepted assessment prices at 0."
          setup_api_calls:
