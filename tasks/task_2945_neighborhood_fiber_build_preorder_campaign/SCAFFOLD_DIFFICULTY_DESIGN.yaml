            - call: "POST /install-appointments"
              payload: { preorder_id: "${p3}", crew_id: "${c3}", appointment_type: "DROP_BURY", window_start_at: "2026-10-05T13:00:00Z", window_end_at: "2026-10-05T14:00:00Z", expected_crew_version: "${cv3}" }
