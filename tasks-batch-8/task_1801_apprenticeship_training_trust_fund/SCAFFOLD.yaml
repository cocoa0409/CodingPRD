  # --- FundingAllocation ---
  - method: POST
    path: "/funding-allocations"
    description: "Propose a funding allocation"
    roles: [TrustAdmin]
    code: 201
    input: [trust_fund_id, category, fiscal_year, amount_cents]
    output: FundingAllocation
    side_effects: ["status=PROPOSED", "proposed_by_user_id stamped"]

  - method: GET
    path: "/funding-allocations/{id}"
    description: "Get a funding allocation"
    roles: [TrustAdmin, EmployerRep, CommitteeMember, Instructor]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []

  - method: GET
    path: "/funding-allocations"
    description: "List funding allocations with optional filters"
    roles: [TrustAdmin, EmployerRep, CommitteeMember, Instructor]
    code: 200
    input: ["trust_fund_id?", "category?", "status?", "limit?", "offset?"]
    output: "FundingAllocation[]"
    side_effects: []

  - method: POST
    path: "/funding-allocations/{id}/approve"
    description: "Committee approves a PROPOSED allocation (OCC on fund version; SoD; posture and fiscal gates)"
    roles: [CommitteeMember]
    code: 200
    input: [expected_trust_fund_version]
    output: FundingAllocation
    side_effects: ["status -> ACTIVE", "fund allocated_remaining_cents += amount_cents", "increments TrustFund.version by 1"]

  - method: POST
    path: "/funding-allocations/{id}/reject"
    description: "Committee rejects a PROPOSED allocation"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/funding-allocations/{id}/close"
    description: "Close an ACTIVE allocation, releasing its remaining balance to the fund"
    roles: [TrustAdmin]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: ["status -> CLOSED", "fund allocated_remaining_cents -= remaining_cents", "increments TrustFund.version by 1"]

  # --- EquipmentPurchase ---
  - method: POST
    path: "/equipment-purchases"
    description: "Request an equipment purchase against an ACTIVE allocation"
    roles: [TrustAdmin]
    code: 201
    input: [allocation_id, description, amount_cents]
    output: EquipmentPurchase
    side_effects: ["status=REQUESTED", "requested_by_user_id stamped"]

  - method: GET
    path: "/equipment-purchases/{id}"
    description: "Get an equipment purchase"
    roles: [TrustAdmin, EmployerRep, CommitteeMember, Instructor]
    code: 200
    input: []
    output: EquipmentPurchase
    side_effects: []

  - method: GET
    path: "/equipment-purchases"
    description: "List equipment purchases with optional filters"
    roles: [TrustAdmin, EmployerRep, CommitteeMember, Instructor]
    code: 200
    input: ["allocation_id?", "status?", "limit?", "offset?"]
    output: "EquipmentPurchase[]"
    side_effects: []

  - method: POST
    path: "/equipment-purchases/{id}/approve"
    description: "Committee approves a REQUESTED purchase (SoD; posture gate; encumbers allocation)"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: EquipmentPurchase
    side_effects: ["status -> APPROVED", "allocation encumbered_cents += amount_cents"]

  - method: POST
    path: "/equipment-purchases/{id}/deny"
    description: "Committee denies a REQUESTED purchase"
    roles: [CommitteeMember]
    code: 200
    input: ["reason?"]
    output: EquipmentPurchase
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/equipment-purchases/{id}/cancel"
    description: "Requester cancels a REQUESTED or APPROVED purchase, releasing any encumbrance"
    roles: [TrustAdmin]
    code: 200
    input: []
    output: EquipmentPurchase
    side_effects: ["status -> CANCELLED", "encumbrance released if was APPROVED"]

  - method: POST
    path: "/equipment-purchases/{id}/mark-purchased"
    description: "Mark an APPROVED purchase as executed: allocation spends, fund disburses"
    roles: [TrustAdmin]
    code: 200
    input: []
    output: EquipmentPurchase
    side_effects: ["status -> PURCHASED", "allocation encumbered -> spent", "fund disbursed_cents += amount_cents", "increments TrustFund.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-Role or X-User-ID header missing, or role not recognized"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not permitted on this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "EmployerRep acting on another employer's report, or Instructor claiming a class whose instructor_user_id differs from X-User-ID"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "Trust fund id does not exist"
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "Employer id does not exist"
  - id: ERR_APPRENTICE_NOT_FOUND
    http: 404
    condition: "Apprentice id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Contribution report id does not exist"
  - id: ERR_CLASS_NOT_FOUND
    http: 404
    condition: "Training class id does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Enrollment id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Pay claim id does not exist"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "Funding allocation id does not exist"
  - id: ERR_PURCHASE_NOT_FOUND
    http: 404
    condition: "Equipment purchase id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, empty lines array, or missing actual_minutes on ACTUAL claims"
  - id: ERR_INVALID_PERIOD
    http: 400
    condition: "period_month outside 1..12, or the period has not started yet relative to the logical clock"
  - id: ERR_INVALID_CLASS_WINDOW
    http: 400
    condition: "end_minute <= start_minute"
  - id: ERR_INVALID_REGISTRATION_OUTCOME
    http: 400
    condition: "outcome not in {REGISTERED, REJECTED, REVOKED}"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic transition mismatch (terminal lockdown, cancel/close guards, submit-registration from a terminal program state)"
  - id: ERR_APPRENTICE_NOT_INDENTURED
    http: 409
    condition: "Enrollment requires the apprentice's program_status to be INDENTURED"
  - id: ERR_REGISTRATION_REQUIRED
    http: 409
    condition: "Indenture or enrollment requires registration_status == REGISTERED"
  - id: ERR_REGISTRATION_NOT_SUBMITTED
    http: 409
    condition: "record-registration-decision requires registration_status == SUBMITTED"
  - id: ERR_REPORT_NOT_FLAGGABLE
    http: 409
    condition: "flag requires the report to be SUBMITTED"
  - id: ERR_REPORT_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmit requires the report to be FLAGGED"
  - id: ERR_REPORT_NOT_PAYABLE
    http: 409
    condition: "remit requires the report to be SUBMITTED or DELINQUENT"
  - id: ERR_CLASS_NOT_SCHEDULED
    http: 409
    condition: "complete or cancel requires the class to be SCHEDULED"
  - id: ERR_ENROLLMENT_NOT_OPEN
    http: 409
    condition: "drop requires the enrollment to be ENROLLED"
  - id: ERR_CLAIM_NOT_APPROVABLE
    http: 409
    condition: "approve or reject requires the claim to be SUBMITTED"
  - id: ERR_CLAIM_NOT_PAYABLE
    http: 409
    condition: "pay requires the claim to be APPROVED"
  - id: ERR_ALLOCATION_NOT_ACTIVABLE
    http: 409
    condition: "approve or reject requires the allocation to be PROPOSED"
  - id: ERR_ALLOCATION_NOT_ACTIVE
    http: 409
    condition: "purchase creation requires an ACTIVE allocation"
  - id: ERR_PURCHASE_NOT_REQUESTED
    http: 409
    condition: "approve or deny requires the purchase to be REQUESTED"
  - id: ERR_PURCHASE_NOT_APPROVED
    http: 409
    condition: "mark-purchased requires the purchase to be APPROVED"
  - id: ERR_FUND_ON_COMPLIANCE_HOLD
    http: 409
    condition: "Fund posture is COMPLIANCE_HOLD; new financial commitments (allocation/purchase/pay-claim approval) are blocked"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "Segregation of duties: approver's X-User-ID equals the proposer's/requester's user id"
  - id: ERR_CERTIFICATION_REQUIREMENTS_NOT_MET
    http: 409
    condition: "Journeyman certification requires 8000 OJT hours, 576 RTI credits, and REGISTERED registration"
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http: 409
    condition: "A report already exists for this employer and period (any status)"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "An ENROLLED enrollment already exists for this apprentice in this class"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "A pay claim for this class already exists in SUBMITTED or APPROVED status"
  - id: ERR_CLASS_FULL
    http: 409
    condition: "enrolled_count >= capacity at enrollment time"
  - id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "Same instructor has a SCHEDULED class within the 30-minute turnover buffer"
  - id: ERR_FACILITY_SCHEDULE_CONFLICT
    http: 409
    condition: "Same facility has an overlapping SCHEDULED class (half-open intervals; adjacency allowed)"
  - id: ERR_INVALID_ATTENDEE_LIST
    http: 400
    condition: "attended_enrollment_ids references an unknown enrollment, one from another class, or one not ENROLLED"
  - id: ERR_OVERTIME_CAP_EXCEEDED
    http: 422
    condition: "actual_minutes exceeds round_half_up(scheduled_minutes x 1.25)"
  - id: ERR_APPRENTICE_NOT_HOUR_ELIGIBLE
    http: 400
    condition: "A report line's apprentice is not in program_status INDENTURED or SUSPENDED"
  - id: ERR_LINE_EMPLOYER_MISMATCH
    http: 400
    condition: "A report line's apprentice belongs to a different employer than the report"
  - id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http: 400
    condition: "amount_tendered_cents != contribution_due_cents"
  - id: ERR_INSUFFICIENT_FUND_AVAILABLE
    http: 402
    condition: "Allocation amount exceeds the fund's available_cents at approval"
  - id: ERR_INSUFFICIENT_ALLOCATION_REMAINING
    http: 402
    condition: "Purchase amount exceeds the allocation's remaining_cents at approval"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_trust_fund_version does not match the fund's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TrustAdmin
    description: "JATC administrative staff: manages employers, apprentices, registrations, classes, enrollments, reports audit, allocations/purchases as proposer, payroll payment, ops runs, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /trust-funds, POST /trust-funds/{id}/run-ops, POST /_clock/set_current_utc"
      - "POST /employers, PATCH /employers/{id}"
      - "POST /apprentices and all /apprentices/{id}/* actions"
      - "POST /contribution-reports/{id}/flag"
      - "POST /classes and /classes/{id}/complete|cancel; POST /enrollments, POST /enrollments/{id}/drop"
      - "POST /pay-claims/{id}/pay"
      - "POST /funding-allocations, POST /funding-allocations/{id}/close"
      - "POST /equipment-purchases, POST /equipment-purchases/{id}/cancel, POST /equipment-purchases/{id}/mark-purchased"
    shared_operations:
      - "All GET endpoints"

  - name: EmployerRep
    description: "Signatory employer representative; X-User-ID equals the Employer's id; reports hours and remits contributions for their own employer only"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /contribution-reports"
      - "POST /contribution-reports/{id}/submit, /resubmit, /remit (own employer's reports only)"
    shared_operations:
      - "All GET endpoints"

  - name: CommitteeMember
    description: "JATC committee member: approves or rejects pay claims, funding allocations, and equipment purchases; segregation of duties forbids approving what the same user id proposed/requested"
    identity: "opaque"
    exclusive_operations:
      - "POST /pay-claims/{id}/approve, /reject"
      - "POST /funding-allocations/{id}/approve, /reject"
      - "POST /equipment-purchases/{id}/approve, /deny"
    shared_operations:
      - "All GET endpoints"

  - name: Instructor
    description: "Class instructor; X-User-ID equals the TrainingClass.instructor_user_id string on classes they teach; files pay claims for completed classes they taught"
    identity: "opaque"
    exclusive_operations:
      - "POST /pay-claims"
    shared_operations:
      - "All GET endpoints"
