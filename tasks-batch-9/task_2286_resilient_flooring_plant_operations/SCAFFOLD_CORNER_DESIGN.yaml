            - "${d_repl} == 84000 (40.00 * 2100) and ${d_labor} == 14000 (40.00 * 350, unlocked by installed_by_certified_installer)"
            - "${d_amount} == 98000 — the full replacement value plus labour, NOT the 60% step value 50400 + 14000 == 64400 that the recorded variant would otherwise have produced"

      - name: live_versus_pinned_standard_cost_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "sku_standard_cost_live_versus_pinned_material_basis"
          rationale: |
            Both variants of sku_standard_cost, their per-component divergence after a
            RawMaterial revaluation and the basis_delta_cents_per_sqm field of the
            cost-summary read are asserted side by side there with pre-computed literals.

      - name: reserved_versus_actual_ledger_reconciliation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: "license_volume_ledger_reserved_versus_actual_basis"
          rationale: |
            The reconciliation between the forward-looking reservation and the
            backward-looking actual settlement — including the deliberate absence of a
            cap re-check at completion — is that instance's entire subject.

      - name: spec_limit_threshold_boundaries
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "test_result_pass_at_spec_limit_versus_marginal_edge_versus_one_increment_beyond"
          rationale: |
            The threshold algorithm's three-way grading at the limit, at the derived
            marginal edge and one increment beyond it is walked in both directions
            (LOWER_IS_BETTER and HIGHER_IS_BETTER) there.

      - name: changeover_interval_merge_boundary
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "changeover_gap_exactly_required_versus_one_minute_short"
          rationale: |
            The interval_merge boundary itself — a gap exactly equal to
            required_gap_minutes admitted and one minute short rejected — is covered
            there; this section instead probes which runs enter that calculation's input
            set.

      - name: forward_looking_reservation_projection
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "license_reserved_entitlement_conserved_across_create_and_abort"
          rationale: |
            The forward-looking property of the reservation ledger (volume blocked before
            anything is physically produced, released exactly on abort) is asserted there
            as a conservation law.

      - name: weighted_scoring_approval_floor
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "formulation_score_exactly_sixty_and_indentation_class_floor"
          rationale: |
            The weighted-scoring calculation's decision boundaries — performance_score
            exactly 60.00 admitted and the independent indentation class floor — are
            covered there with recipes tuned to sit exactly on both edges.

  # ===========================================================================
  # Guide section 4 — Table 4 (Validations) + validation patterns
  # ===========================================================================
  - section: validations
    instances:

      - name: phr_above_material_ceiling_returns_phr_exceeds_material_max
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-4"
          - "errors.ERR_PHR_EXCEEDS_MATERIAL_MAX"
          - "entities.RawMaterial.fields.max_phr"
        distinguishing_aspect: |
          The per-material loading ceiling is deliberately NOT a shape constraint on
          FormulationComponent.phr, so a 61 phr plasticiser charge is a well-formed request
          that must be refused by V-CON-4 with a 422 ERR_PHR_EXCEEDS_MATERIAL_MAX rather
          than by V-REQ-1 with a 400.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmSoft
            - *fmin
            - *fminC1
          trigger:
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_soft_id}", phr: 61.00 }
              as: Formulator
              as_user_id: "form-001"
              captures: { phr_err: $.data.error_id }
          assert:
            - "${phr_err} == ERR_PHR_EXCEEDS_MATERIAL_MAX with HTTP 422, NOT ERR_INVALID_REQUEST with HTTP 400"
            - "the response body carries only error_id and message"
            - "GET /formulations/${f_min_id}/components still reports total_count 1 and the recipe's total_phr is unchanged at 100.00"

      - name: phr_exactly_at_material_ceiling_is_admitted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations.V-CON-4 (strict `>` comparison)"
          - "entities.FormulationComponent.fields.phr"
        distinguishing_aspect: |
          The satisfaction side of the same rule at its exact edge: 60.00 phr against a
          max_phr of 60.00 must be accepted because the condition is `phr > max_phr`, and
          the accepted component must actually move the derived blend metrics.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmSoft
            - *fmin
            - *fminC1
          trigger:
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_soft_id}", phr: 60.00 }
              as: Formulator
              as_user_id: "form-001"
              captures: { edge_comp_id: $.data.id, edge_comp_phr: $.data.phr }
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { edge_total: $.data.total_phr, edge_score: $.data.performance_score }
          assert:
            - "${edge_comp_phr} == 60.00 and ${edge_comp_id} is a fresh FormulationComponent"
            - "${edge_total} == 160.00 (resin 100.00 + plasticiser 60.00)"
            - "${edge_score} < 60.00 — the accepted charge drives plasticizer_ratio to 0.6000 and takes the full 12-point softness penalty, proving the component really entered the recipe"

      - name: restricted_raw_material_blocks_formulation_submit_cross_entity
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-2"
          - "errors.ERR_RAW_MATERIAL_NOT_ACTIVE"
          - "state_machines.RawMaterial ACTIVE -> RESTRICTED"
        distinguishing_aspect: |
          A CROSS-ENTITY validation: nothing about the Formulation changes, yet the same
          submit that would have succeeded a moment earlier now fails because a RawMaterial
          two hops away flipped to RESTRICTED. The rule must re-read the referenced rows at
          request time rather than trusting a snapshot taken when the component was added.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - call: "POST /raw-materials/${rm_stab_id}/status"
              payload: { to_status: RESTRICTED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { stab_status: $.data.status }
          trigger:
            - call: "POST /formulations/${f_min_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { submit_err: $.data.error_id }
          assert:
            - "${stab_status} == RESTRICTED"
            - "${submit_err} == ERR_RAW_MATERIAL_NOT_ACTIVE with HTTP 409 — not ERR_RESIN_PHR_NOT_NORMALIZED, because resin_phr is a valid 100.00 and V-CON-3 is satisfied"
            - "GET /formulations/${f_min_id} still reports status DRAFT and an unchanged version"

      - name: warranty_coverage_month_boundary_admits_239_and_rejects_240
        claim_type: violation_to_error
        grounds:
          - "validations.V-TEMP-6"
          - "errors.ERR_WARRANTY_EXPIRED"
          - "calculations.sku_warranty_terms (warranty_years 20 -> coverage_months 240)"
        distinguishing_aspect: |
          A TEMPORAL validation exercised on both sides of a boundary derived from another
          calculation: elapsed_months 239 settles at the bottom 20% step while exactly 240
          is refused, because the condition is `elapsed_months >= coverage_months`. The two
          claims are byte-identical apart from one calendar month in reported_on.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2046-08-05T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-239", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: LOCK_FAILURE, claimed_area_sqm: 25.50, installed_on: "2026-08-05T00:00:00Z", reported_on: "2046-07-05T00:00:00Z" }
              as: WarrantyAdjuster
