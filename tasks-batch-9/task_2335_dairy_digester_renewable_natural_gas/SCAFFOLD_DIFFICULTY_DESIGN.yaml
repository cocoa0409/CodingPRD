            - call: "POST /credit-batches"
              payload: { pathway_id: "${pathway_id}", facility_id: "${facility_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_pathway_version: "${pathway_v}" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { batch_id: "$.data.id" }
            - call: "POST /credit-batches/${batch_id}/claim"
              payload: { claim_note: "August 2026 LCFS claim" }
              as: ProgramAdministrator
              as_user_id: "u-program"
            - call: "POST /credit-batches/${batch_id}/verify"
              payload: { verifier_note: "Volumes traced to interconnect statements" }
              as: CreditVerifier
              as_user_id: "u-verifier"
            - call: "POST /credit-batches/${batch_id}/issue"
              payload: { issuance_reference: "LRT-2026-08-0001" }
              as: ProgramAdministrator
              as_user_id: "u-program"
            - call: "GET /credit-pathways/${pathway_id}/credit-ledger"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { issued_before: "$.data.credits_issued_total", outstanding_before: "$.data.credits_outstanding", residual_before: "$.data.credit_control_residual" }
          trigger:
            - call: "POST /credit-batches/${batch_id}/reverse"
              payload: { reversal_reason: "OPERATOR_WITHDRAWAL" }
              as: ProgramAdministrator
              as_user_id: "u-program"
          assert:
            - "issued_before == 36.111"
            - "outstanding_before == 36.111"
            - "residual_before == 0.000"
            - "CreditBatch.${batch_id}.status == REVERSED"
            - "CreditBatch.${batch_id}.reversal_reason == OPERATOR_WITHDRAWAL"
            - "CreditBatch.${batch_id}.credit_quantity_final == 36.111"
            - "CreditBatch.${batch_id}.credit_value_cents == 269027"
            - "CreditPathway.${pathway_id}.credits_issued_total == 36.111"
            - "CreditPathway.${pathway_id}.credits_reversed_total == 36.111"
            - "CreditPathway.${pathway_id}.credits_outstanding == 0.000"
            - "CreditPathway.${pathway_id}.credit_control_residual == 0.000"
