          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_APPROVAL_TIER_INSUFFICIENT]
          - errors[ERR_REVISION_NOT_HIGHER]
          - errors[ERR_APPROVAL_STATE_INVALID]
          - state_machines.DiscountApproval.REJECTED_to_PENDING
        distinguishing_aspect: "One 200.00 request walks the whole negotiation: a PracticePartner reusing the requester's X-User-ID gets the segregation error even though the tier error also applies (19 before 20), a clean PracticePartner then gets the tier error on an L2_FINANCE row, a lower revision is refused, a higher one reopens the row, and the finally APPROVED row rejects both decide and revise."
        test_recipe:
          setup:
            - "Clock 2026-08-03. NA group, CLOUD_ARCH skill, one QUALIFIED demand at standard 250.00 with min_proficiency_level 3 and no assignments."
            - "SalesLead user sl-1 creates a DiscountApproval at 200.00: discount_pct 20.00 puts it in L2_FINANCE, and the LEVEL_FLOOR margin round(100 * (200.00 - 80.00) / 200.00, 2) == 60.00 keeps tier_escalated false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: SalesLead
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-17", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "GET /demand-opportunities/${d1_id}"
              as: SalesLead
              captures: { d1_v: $.data.version }
            - call: "POST /discount-approvals"
              payload: { demand_opportunity_id: "${d1_id}", requested_rate_usd_per_hour: 200.00, expected_opportunity_version: "${d1_v}" }
              as: SalesLead
              as_user_id: "sl-1"
              captures: { ap_id: $.data.id, ap_tier: $.data.required_tier, ap_escalated: $.data.tier_escalated, ap_status: $.data.status }
          trigger:
            - call: "POST /discount-approvals/${ap_id}/decide"
              payload: { decision: "APPROVED", decision_note: "self approval attempt" }
              as: PracticePartner
              as_user_id: "sl-1"
              captures: { err_self: $.data.error_id }
            - call: "POST /discount-approvals/${ap_id}/decide"
              payload: { decision: "APPROVED", decision_note: "partner attempt on an L2 row" }
              as: PracticePartner
              as_user_id: "pp-1"
              captures: { err_tier: $.data.error_id }
            - call: "POST /discount-approvals/${ap_id}/decide"
              payload: { decision: "REJECTED", decision_note: "too deep" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { rej_status: $.data.status, rej_decider: $.data.decided_by_user_id }
            - call: "POST /discount-approvals/${ap_id}/revise"
              payload: { requested_rate_usd_per_hour: 190.00, decision_note: "sharpening the pencil the wrong way" }
              as: SalesLead
              as_user_id: "sl-2"
              captures: { err_revision: $.data.error_id }
            - call: "POST /discount-approvals/${ap_id}/revise"
              payload: { requested_rate_usd_per_hour: 210.00, decision_note: "giving ground on price" }
              as: SalesLead
              as_user_id: "sl-2"
              captures: { rev_status: $.data.status, rev_count: $.data.revision_count, rev_discount: $.data.discount_pct, rev_decider: $.data.decided_by_user_id }
            - call: "POST /discount-approvals/${ap_id}/decide"
              payload: { decision: "APPROVED", decision_note: "accepted at 210" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { app_status: $.data.status }
            - call: "POST /discount-approvals/${ap_id}/decide"
              payload: { decision: "REJECTED", decision_note: "second thoughts" }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { err_decide_again: $.data.error_id }
            - call: "POST /discount-approvals/${ap_id}/revise"
              payload: { requested_rate_usd_per_hour: 220.00 }
              as: SalesLead
              as_user_id: "sl-2"
              captures: { err_revise_terminal: $.data.error_id }
          assert:
            - "at creation ${ap_status} == \"PENDING\", ${ap_tier} == \"L2_FINANCE\" and ${ap_escalated} == false"
            - "${err_self} == ERR_SELF_APPROVAL_FORBIDDEN with HTTP 403 — X-User-ID sl-1 equals requested_by_user_id, and 19 wins even though the PracticePartner also fails the L2_FINANCE tier at 20"
            - "${err_tier} == ERR_APPROVAL_TIER_INSUFFICIENT with HTTP 403 — a different user, but L2_FINANCE admits FinanceController only, even though the endpoint's roles list contains PracticePartner"
            - "${rej_status} == \"REJECTED\" with ${rej_decider} == \"fc-1\"; DemandOpportunity.${d1_id}.approved_rate_usd_per_hour is still null"
            - "${err_revision} == ERR_REVISION_NOT_HIGHER with HTTP 422 — 190.00 is not strictly greater than the stored 200.00, and the row stays REJECTED"
            - "${rev_status} == \"PENDING\" with ${rev_count} == 1, ${rev_discount} == 16.00 (still L2_FINANCE) and ${rev_decider} == null — requested_by_user_id is now sl-2"
            - "${app_status} == \"APPROVED\"; DemandOpportunity.${d1_id}.approved_rate_usd_per_hour == 210.00, effective_rate_usd_per_hour == 210.00 and booked_realization_pct == 84.00"
            - "${err_decide_again} == ERR_APPROVAL_STATE_INVALID and ${err_revise_terminal} == ERR_APPROVAL_STATE_INVALID, both HTTP 409 — APPROVED is terminal for both verbs"

