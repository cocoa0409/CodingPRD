            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: ILLNESS, reported_batch_code: "A1B20260710", foreign_object_class: SOFT, medical_attention_sought: true, symptom_codes: [NAUSEA, CRAMPS] }, captures: { cp1: "$.data.id" } }
