      - name: critical_contamination_void_cascade
        grounds:
          - state_machines.WeightTicket.VALIDATED_to_VOIDED
          - calculations.diversion_rate
          - calculations.ticket_rebate_estimate
          - calculations.program_standing
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /contamination_events: a CRITICAL event
