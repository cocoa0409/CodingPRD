          rationale: "That instance already drives billing_status and class_status as independent dimensions through the full reclass-then-overturn arc and asserts the revert of class_status to DECLARED while billing_status stays BILLED; a separate parallel-state corner would duplicate it."

      - name: dispute_supplement_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds:
          - state_machines.correction_notice_lifecycle
          - state_machines.dispute_lifecycle
        excluded_because:
          difficulty_instance: dispute_supplement_cycle_bounded_by_max_rounds
          rationale: "The DISPUTED -> EVIDENCE_REQUESTED -> DISPUTED cycle, its per-lap deadline extension and the round cap are exercised end to end there; re-testing the cycle here would add no distinguishing observation."

      - name: capture_transition_cascade_covered_by_difficulty
        claim_type: Cascade down
        grounds:
          - state_machines.shipment_class_status
          - state_machines.correction_notice_lifecycle
        excluded_because:
          difficulty_instance: capture_cascade_terminal_line_shipment_notice
          rationale: "One capture cascading into terminal counters, line reclass, shipment class_status and automatic notice issuance is exactly that difficulty instance's subject."

      - name: overturn_compensating_transition_covered_by_difficulty
        claim_type: Compensation
        grounds:
          - state_machines.correction_notice_lifecycle.transitions[DISPUTED->OVERTURNED]
          - state_machines.credit_memo_lifecycle
        excluded_because:
          difficulty_instance: money_invariant_assessed_total_returns_to_pre_notice_value
          rationale: "The compensating path (overturn -> credit memo -> assessed_total restored to its pre-notice value) is asserted there as a money invariant, including the interest component that sits outside the restored balance."

