              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_ALREADY_COMPLETED (http 409) — the RETURNED school obligation freezes the loop"
            - "WithdrawalCase.${co}.status remains CALCULATED"

      - name: recalculate_blocked_by_accepted_offer_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.WithdrawalCase.CALCULATED_to_CALCULATED"
          - "errors[ERR_OFFER_ALREADY_ACCEPTED]"
        distinguishing_aspect: "Mirror lock on the PWD path: an ACCEPTED offer blocks recalculate while a second still-SENT offer keeps the case CALCULATED."
        test_recipe:
          setup:
            - "Charges 600000; PELL 200000 (100000 d + 100000 s); SUB 300000 (100000 d + 200000 s); UNSUB 100000 accepted (0 d + 100000 s) -> two loan offers (SUB 80000, UNSUB 60000)"
            - "Withdraw OFFICIAL 2026-10-25; calculate at clock 2026-10-26; student accepts the SUB offer (index 0); UNSUB offer remains SENT"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
