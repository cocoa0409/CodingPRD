            - "unstale_ok == FULFILLED after the fresh care log"

      - name: suspended_account_blocks_redemption_and_accrual_but_not_lookup
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ACCOUNT_SUSPENDED
        distinguishing_aspect: "A SUSPENDED account cannot post ledger entries or redeem at finalize (ERR_ACCOUNT_SUSPENDED) but receipt-free lookup still returns it — suspension gates writes, not reads."
        test_recipe:
          setup:
