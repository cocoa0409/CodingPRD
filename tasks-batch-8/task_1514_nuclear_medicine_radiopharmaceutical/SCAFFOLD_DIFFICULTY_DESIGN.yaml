            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T12:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord2: $.data.id } }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord1}", room_id: "${room}", start_at: "2026-08-01T07:00:00Z", end_at: "2026-08-01T07:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1" }
