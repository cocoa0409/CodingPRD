              as: ComplianceOfficer
              captures: { cv1: $.data.version }
            - call: "POST /tenants/${tid}/customers/${cid}/certificates"
              payload: { ship_to_state: "CA", form_type: "RESALE", exemption_reason_code: "RES", state_registration_number: "", signed_date: "2026-01-01", effective_date: "2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { cert: $.data.id }
            - call: "POST /tenants/${tid}/certificates/${cert}/versions"
              payload: { file_uri: "s3://c.pdf", form_type: "RESALE", signed_date: "2026-01-01", effective_date: "2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co1"
            - call: "POST /tenants/${tid}/certificates/${cert}/begin_review"
