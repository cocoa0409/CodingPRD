# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Season Pass & Blockout Administration. 9 rule_ids x 2 instances = 18 instances.
# Every number in an `assert:` line was computed against the §1.3 formulas and
# their `constants:` before being written down.
# Logical clock default when /_clock/set_current_utc is never called: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: upgrade_credit_paid_to_date_vs_prorated_diverge
        grounds:
          - calculations.upgrade_credit
          - calculations.upgrade_settlement_total
          - entities.UpgradeOrder.fields.credit_mode
          - entities.UpgradeOrder.fields.raw_credit_cents
          - endpoints[POST /upgrade-orders]
        distinguishing_aspect: |
          The two variants of calculations.upgrade_credit are driven by disjoint inputs — PAID_TO_DATE
          reads SeasonPass.paid_to_date_cents (8250) while PRORATED_VALUE reads the remaining ParkDay
          ratio against PassTier.base_price_cents (floor(12000 * 0.7500) = 9000) — so on one identical
          pass the same Bronze->Gold upgrade quotes raw_credit_cents 8250 vs 9000 and total_due_cents
          10750 vs 10000, a 750-cent divergence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Program 'Summit Ridge' 2026 in SALES_OPEN with PUBLISHED tiers BRONZE (rank 1, 12000) and GOLD (rank 3, 30000)."
            - "Four ParkDay rows: 2026-07-15 (past), 2026-08-10, 2026-08-20, 2026-09-05 — 3 of 4 are still in the future, all STANDARD (forecast 100 / capacity 1000)."
            - "Passholder A holds a processed ACTIVE BRONZE pass on a 4-installment plan (down 3000, installments 2625 each) with installments 1 and 2 SETTLED, so paid_to_date_cents == 8250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-07-15", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-10", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-20", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 3000, installment_count: 4, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id", inst_2: "$.data[1].id" }
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_2}/settle"
              payload: { amount_cents: 2625 }
              as: PassOfficeClerk
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_a}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { uo_paid: "$.data.id" }
          trigger:
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_a}", source_tier_id: "${bronze}", target_tier_id: "${gold}", credit_mode: "PRORATED_VALUE" }
              as: PassOfficeClerk
              captures: { uo_prorated: "$.data.id" }
          assert:
            - "trigger response data.credit_mode == 'PRORATED_VALUE' and data.gross_delta_cents == 18000"
            - "trigger response data.raw_credit_cents == 9000  (floor(12000 * 0.7500), 3 of 4 park days still future)"
            - "trigger response data.credit_cents == 9000 and data.net_delta_cents == 9000"
            - "trigger response data.admin_fee_cents == 1000 and data.total_due_cents == 10000"
            - "GET /upgrade-orders/${uo_paid} → data.raw_credit_cents == 8250 and data.credit_cents == 8250"
            - "GET /upgrade-orders/${uo_paid} → data.net_delta_cents == 9750, data.admin_fee_cents == 1000, data.total_due_cents == 10750"
            - "The two quotes differ: 10750 - 10000 == 750, and both remain status == 'QUOTED' (quoting is side-effect free)"
            - "GET /season-passes/${pass_a} → data.paid_to_date_cents == 8250 and data.tier_id == '${bronze}' (neither quote moved the pass)"

      - name: sharing_risk_gate_cluster_vs_rolling_window_diverge
        grounds:
          - calculations.pass_sharing_risk_score
          - entities.Passholder.fields.sharing_risk_score
          - entities.ParkDay.fields.day_class
          - entities.PassProgram.fields.sharing_case_auto_open_score
          - endpoints[POST /visits]
        distinguishing_aspect: |
          Two passholders with byte-identical visit histories (3 entries in the trailing 7 days, two of
          them on one date through NORTH and SOUTH, exactly one photo_match == MISMATCH) score 65 under
          GATE_CLUSTER (entering a PEAK day) and 35 under ROLLING_WINDOW (entering a STANDARD day), so
          only the PEAK entry crosses sharing_case_auto_open_score == 65 and auto-opens a SharingCase.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T23:00:00Z."
            - "Program in SEASON_ACTIVE with PUBLISHED GOLD tier (reservation_required_on_peak == false, so no peak reservation is demanded)."
            - "ParkDay 2026-08-18 STANDARD (100/1000), ParkDay 2026-08-19 STANDARD (100/1000), ParkDay 2026-08-20 PEAK (850/1000 → 0.8500)."
            - "Passholders A and B each hold a processed ACTIVE GOLD pass bought PAY_IN_FULL."
            - "Each pass already has two entries on 2026-08-18 — 09:00 through NORTH and 11:00 through SOUTH — the second one recorded with photo_match MISMATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T23:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-18", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_18: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-19", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_19: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-20", capacity_total: 1000, forecast_attendance: 850 }
              as: ProgramAdmin
              captures: { day_20: "$.data.id" }
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_b}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_b: "$.data.id" }
            - call: "POST /season-passes/${pass_b}/process"
              payload: { photo_hash: "sha256:bbb", government_id_last4: "5678" }
              as: PassOfficeClerk
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_18}", entry_at: "2026-08-18T09:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_18}", entry_at: "2026-08-18T11:00:00Z", gate_code: "SOUTH", photo_match: "MISMATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_b}", park_day_id: "${day_18}", entry_at: "2026-08-18T09:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_b}", park_day_id: "${day_18}", entry_at: "2026-08-18T11:00:00Z", gate_code: "SOUTH", photo_match: "MISMATCH" }
              as: GateAgent
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_b}", park_day_id: "${day_19}", entry_at: "2026-08-19T10:00:00Z", gate_code: "EAST", photo_match: "MATCH" }
              as: GateAgent
          trigger:
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_20}", entry_at: "2026-08-20T10:00:00Z", gate_code: "EAST", photo_match: "MATCH" }
              as: GateAgent
          assert:
            - "trigger response data.status == 'OPEN' — the crossing entry itself is admitted; only the NEXT entry is refused"
            - "GET /park-days/${day_20} → data.day_class == 'PEAK' so the GATE_CLUSTER variant applies to the trigger entry"
            - "GET /passholders/${holder_a} → data.sharing_risk_score == 65  (40 * (2 - 1) + 25 * 1)"
            - "GET /passholders/${holder_b} → data.sharing_risk_score == 35  (15 * max(0, 3 - 3) + 35 * 1) — same history, STANDARD day, ROLLING_WINDOW variant"
            - "GET /sharing-cases?season_pass_id=${pass_a} → data.total_count == 1, data[0].case_status == 'OPEN', data[0].risk_score_at_open == 65, data[0].opened_by_user_id == 'SYSTEM', data[0].opened_by_role == 'SYSTEM'"
            - "GET /sharing-cases?season_pass_id=${pass_b} → data.total_count == 0 (35 < 65, no case)"
            - "The two variants diverge by 30 points on identical input data"

  - rule_id: combinatorial_formula
    instances:
      - name: plan_amortization_residual_on_final_installment
        grounds:
          - calculations.payment_plan_amortization
          - entities.PaymentPlan.fields.financed_amount_cents
          - entities.PaymentPlan.fields.monthly_amount_cents
          - entities.PaymentPlan.fields.final_installment_cents
          - endpoints[POST /season-passes/{pass_id}/payment-plans]
        distinguishing_aspect: |
          Composition mode b (multi-stage chain): stage 1's financed principal (30000 - 6000 + 1500 =
          25500) is the input to stage 2's level payment (round_half_up(25500/7) = 3643), which is in
          turn the input to stage 3's residual (25500 - 6*3643 = 3642) — reordering the stages or
          dropping the setup fee out of stage 1 changes all seven installment amounts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Program in SALES_OPEN with PUBLISHED GOLD tier at 30000."
            - "Passholder holds a processed ACTIVE GOLD pass with payment_mode PAYMENT_PLAN, billing_status UNBILLED, outstanding_balance_cents == 30000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
          trigger:
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 6000, installment_count: 7, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
          assert:
            - "trigger response data.setup_fee_cents == 1500 and data.financed_amount_cents == 25500"
            - "trigger response data.monthly_amount_cents == 3643 and data.final_installment_cents == 3642"
            - "trigger response data.installment_count == 7, data.missed_count == 0, data.settled_count == 0, data.plan_status == 'ACTIVE'"
            - "GET /installments?payment_plan_id=${plan_a} → data.total_count == 7"
            - "GET /installments?payment_plan_id=${plan_a} → data[0].amount_cents == 3643, data[5].amount_cents == 3643, data[6].amount_cents == 3642"
            - "GET /installments?payment_plan_id=${plan_a} → data[0].due_date == '2026-09-01', data[6].due_date == '2027-03-01'"
            - "sum of the seven amount_cents == 25500 (6 * 3643 + 3642), i.e. the residual absorbs the rounding exactly"
            - "GET /season-passes/${pass_a} → data.billed_total_cents == 31500, data.paid_to_date_cents == 6000, data.outstanding_balance_cents == 25500, data.billing_status == 'PLAN_CURRENT'"

      - name: upgrade_settlement_order_credit_cap_then_fee_tier
        grounds:
          - calculations.upgrade_settlement_total
          - calculations.upgrade_credit
          - entities.UpgradeOrder.fields.admin_fee_cents
          - entities.UpgradeOrder.fields.quote_expires_at
          - endpoints[POST /upgrade-orders]
        distinguishing_aspect: |
          Composition mode c (pinned order of independent adjustments): the credit cap (step 3,
          min(24215, 25000) = 24215) must run before the net delta (step 4, 785) which keys the
          admin-fee band (step 5) — banding the GROSS delta of 25000 instead would charge 2500 rather
          than 0, so total_due_cents is 785, not 27500 or 3285.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Program in SALES_OPEN with PUBLISHED tiers GOLD (rank 3, 30000) and PLATINUM (rank 5, 55000)."
            - "Passholder holds a processed ACTIVE GOLD pass on a 7-installment plan (down 6000, 3643 x 6 + 3642) with installments 1-5 SETTLED, so paid_to_date_cents == 6000 + 5*3643 == 24215."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "PLATINUM", tier_rank: 5, base_price_cents: 55000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.20, reservation_required_on_peak: false, peak_reservation_quota: 9 }
              as: ProgramAdmin
              captures: { platinum: "$.data.id" }
            - call: "POST /pass-tiers/${platinum}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_a}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
              captures: { pass_a_v: "$.data.version" }
            - call: "POST /season-passes/${pass_a}/payment-plans"
              payload: { down_payment_cents: 6000, installment_count: 7, first_due_date: "2026-09-01", expected_season_pass_version: "${pass_a_v}" }
              as: PassOfficeClerk
              captures: { plan_a: "$.data.id" }
            - call: "GET /installments?payment_plan_id=${plan_a}"
              as: PassOfficeClerk
              captures: { inst_1: "$.data[0].id", inst_2: "$.data[1].id", inst_3: "$.data[2].id", inst_4: "$.data[3].id", inst_5: "$.data[4].id" }
            - call: "POST /installments/${inst_1}/settle"
              payload: { amount_cents: 3643 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_2}/settle"
              payload: { amount_cents: 3643 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_3}/settle"
              payload: { amount_cents: 3643 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_4}/settle"
              payload: { amount_cents: 3643 }
              as: PassOfficeClerk
            - call: "POST /installments/${inst_5}/settle"
              payload: { amount_cents: 3643 }
              as: PassOfficeClerk
          trigger:
            - call: "POST /upgrade-orders"
              payload: { season_pass_id: "${pass_a}", source_tier_id: "${gold}", target_tier_id: "${platinum}", credit_mode: "PAID_TO_DATE" }
              as: PassOfficeClerk
              captures: { uo: "$.data.id" }
          assert:
            - "GET /season-passes/${pass_a} → data.paid_to_date_cents == 24215 before the quote"
            - "trigger response data.gross_delta_cents == 25000"
            - "trigger response data.raw_credit_cents == 24215 and data.credit_cents == 24215 (min(24215, 25000) — the cap is a no-op here but runs before step 4)"
            - "trigger response data.net_delta_cents == 785"
            - "trigger response data.admin_fee_cents == 0 — the band is keyed on net 785 <= 5000, NOT on gross 25000 which would have charged 2500"
            - "trigger response data.total_due_cents == 785"
            - "trigger response data.status == 'QUOTED', data.quoted_at == '2026-08-01T00:00:00Z', data.quote_expires_at == '2026-08-15T00:00:00Z'"

  - rule_id: non_linear_state_machine
    instances:
      - name: season_pass_parallel_billing_and_access_dimensions
        grounds:
          - state_machines.SeasonPass.PLAN_CURRENT_to_DELINQUENT
          - state_machines.Installment.SCHEDULED_to_MISSED
          - entities.SeasonPass.fields.billing_status
          - entities.SeasonPass.fields.pass_status
          - endpoints[POST /pass-programs/{program_id}/billing-runs]
        distinguishing_aspect: |
          SeasonPass carries two parallel state dimensions on one row. A billing run that marks one
          installment MISSED moves the billing dimension PLAN_CURRENT -> DELINQUENT while the access
          dimension must stay ACTIVE (1 missed < delinquency_suspension_threshold 2), and a gate entry
          taken immediately afterwards still succeeds — the combined state (ACTIVE, DELINQUENT) is
          reachable and behaves as the conjunction of the two dimensions, not as a single status.
        test_recipe:
          setup:
            - "Program 'Summit Ridge' with PUBLISHED BRONZE tier (12000), advanced to SEASON_ACTIVE."
            - "ParkDay 2026-09-20 STANDARD (forecast 100 / capacity 1000)."
