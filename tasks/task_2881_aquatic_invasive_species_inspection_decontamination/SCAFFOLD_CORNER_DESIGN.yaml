          - endpoints.POST_/water-bodies
          - endpoints.POST_/inspection-stations
          - endpoints.POST_/reciprocity-agreements
        distinguishing_aspect: "Every operation listed as ProgramAdmin-exclusive actually succeeds for that role: the registry write, the station siting, the hours row, the status transition, the inspector enrollment, the drainage PATCH, the reciprocity agreement and the clock - eight distinct exclusive operations in one pass, none of them requiring an X-User-ID that resolves to an Inspector row because the role's identity is opaque."
        test_recipe:
          setup:
            - "Empty database. Every call below is made with X-User-Role ProgramAdmin and an arbitrary opaque X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "PATCH /water-bodies/${wb_id}"
              payload: { risk_tier: "MODERATE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, seal_stock_initial_count: 5 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
          trigger:
            - call: "POST /reciprocity-agreements"
              payload: { partner_state_code: "WY", accepted_seal_prefix: "WY-" }
