scenario: |
  Supply chain finance platform: core-enterprise confirmation of rights with core-enterprise onboarding and credit-line approval, payable-list upload, electronic-confirmation of debt by core enterprise, multi-tier supplier extension rules, and confirmation-revocation handling; accounts-receivable registration with invoice and contract upload, due-date and amount verification, receivable-uniqueness check (anti double-financing), receivable-status (registered/pledged/transferred/financed/settled) tracking, and central-registry filing where required; financing application with supplier-side application submission, financing-mode selection (factoring/reverse-factoring/dynamic-discounting/receivable-pledge), financing-amount and term proposal, supporting-document upload, and application-status tracking; risk-control review with KYC-and-AML check on supplier, core-enterprise credit-line consumption check, receivable-authenticity cross-verification, fraud-detection rules, multi-level credit-approval workflow, and risk-rating-based pricing; disbursement and repayment with funder-side fund-release instruction, disbursement to supplier account, repayment scheduling, on-due-date automatic deduction from core-enterprise account, partial-prepayment and early-settlement handling, and reconciliation with funder; overdue collection with overdue-identification and aging classification, soft-collection (reminder/notification) and hard-collection (legal action) routing, core-enterprise joint-liability enforcement, collection-record archiving, and bad-debt write-off workflow; trade-background verification with logistics-document (waybill/customs-declaration) cross-check, capital-flow vs goods-flow consistency, third-party data-source verification, on-site verification for high-amount cases, and verification-record retention; event-driven synchronization with banking, electronic-invoice authority, central registry, and core-enterprise ERP; audit logging for confirmation and disbursement records.

domain_name: supply-chain-finance
api_prefix: /scf

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - contagion_risk_propagation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: saga

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CoreEnterprise
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the anchor buyer.
      - name: unified_credit_code
        type: string
        source: input
        description: Unified Social Credit Code, uppercase alphanumeric, 18 chars.
        constraints: regex ^[0-9A-Z]{18}$; globally unique
      - name: onboarding_status
        type: enum
        source: computed
        description: Lifecycle status of the core enterprise account.
        constraints: one of {PENDING, APPROVED, REJECTED, SUSPENDED}
        default: PENDING
      - name: credit_line_total_cents
        type: integer
        source: computed
        description: Approved master credit limit in integer cents (set on APPROVE).
        default: 0
      - name: credit_line_reserved_cents
        type: integer
        source: computed
        description: Sum of CONFIRMED confirmation amounts not yet SETTLED.
        default: 0
      - name: credit_line_consumed_cents
        type: integer
        source: computed
        description: Sum of currently-DISBURSED financing amounts not yet SETTLED.
        default: 0
      - name: erp_endpoint_url
        type: string
        source: input
        description: ERP webhook URL for event synchronization.
      - name: joint_liability_flag
        type: boolean
        source: input
        description: Whether this core enterprise stands jointly liable for supplier defaults.
        default: true
      - name: risk_rating
        type: enum
        source: computed
        description: Internal credit rating band; drives pricing floor for related financings.
        constraints: one of {AAA, AA, A, BBB, BB}
        default: BBB

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the supplier.
      - name: unified_credit_code
        type: string
        source: input
        description: Unified Social Credit Code, globally unique.
        constraints: regex ^[0-9A-Z]{18}$
      - name: tier_to_core
        type: integer
        source: input
        description: Tier distance to a core enterprise (1 = direct supplier, 2 = supplier-of-supplier, etc.).
        constraints: 1 <= tier_to_core <= 4
      - name: parent_supplier_id
        type: string
        source: input
        description: For tier >= 2, the upstream Supplier.id whose extended credit unlocks this one. Null for tier 1.
        default: null
      - name: kyc_status
        type: enum
        source: computed
        description: Result of latest KYC/AML screening.
        constraints: one of {NOT_RUN, PASSED, FAILED, EXPIRED}
        default: NOT_RUN
      - name: kyc_completed_at
        type: datetime
        source: computed
        description: ISO8601 timestamp of the latest passed KYC; null if never passed.
        default: null
      - name: aml_risk_score
        type: number
        source: computed
        description: Continuous AML risk score in [0.00, 1.00], 2 decimals.
        default: 0.00
      - name: bank_account_number
        type: string
        source: input
        description: Settlement account for disbursement.
      - name: status
        type: enum
        source: computed
        description: Onboarding/operational status.
        constraints: one of {ACTIVE, SUSPENDED, BLACKLISTED}
        default: ACTIVE

  - name: PayableConfirmation
    parent: null
    common_fields: true
    fields:
      - name: core_enterprise_id
        type: string
        source: input
        description: FK to CoreEnterprise; the debtor.
      - name: supplier_id
        type: string
        source: input
        description: FK to Supplier; the creditor.
      - name: invoice_number
        type: string
        source: input
        description: Underlying invoice number (must match an existing electronic invoice).
      - name: contract_number
        type: string
        source: input
        description: Trade contract number that originated the payable.
      - name: amount_cents
        type: integer
        source: input
        description: Confirmed payable amount in integer cents.
        constraints: amount_cents > 0
      - name: due_date
        type: datetime
        source: input
        description: ISO8601 due date for payment (UTC midnight).
      - name: tier
        type: integer
        source: computed
        description: Copied from supplier.tier_to_core at upload time; pins tier for extension rules.
        constraints: 1 <= tier <= 4
      - name: status
        type: enum
        source: computed
        description: Confirmation lifecycle state.
        constraints: one of {DRAFT, PENDING_CONFIRM, CONFIRMED, REVOKED, SETTLED}
        default: DRAFT
      - name: confirmed_at
        type: datetime
        source: computed
        description: When core enterprise electronically confirmed the debt; null until CONFIRMED.
        default: null
      - name: revoke_reason
        type: string
        source: input
        description: Free-text reason captured when CONFIRMED → REVOKED.
        default: null

  - name: Receivable
    parent: null
    common_fields: true
    fields:
      - name: confirmation_id
        type: string
        source: input
        description: FK to a CONFIRMED PayableConfirmation; one receivable per confirmation.
        constraints: unique (anti double-financing)
      - name: supplier_id
        type: string
        source: computed
        description: Mirrored from confirmation.supplier_id at registration time.
      - name: core_enterprise_id
        type: string
        source: computed
        description: Mirrored from confirmation.core_enterprise_id at registration time.
      - name: amount_cents
        type: integer
        source: computed
        description: Mirrored from confirmation.amount_cents at registration time.
      - name: due_date
        type: datetime
        source: computed
        description: Mirrored from confirmation.due_date at registration time.
      - name: invoice_doc_id
        type: string
        source: input
        description: Document id (uploaded e-invoice PDF/XML reference).
      - name: contract_doc_id
        type: string
        source: input
        description: Document id (uploaded trade contract).
      - name: status
        type: enum
        source: computed
        description: Receivable lifecycle status.
        constraints: one of {REGISTERED, PLEDGED, TRANSFERRED, FINANCED, SETTLED, WRITTEN_OFF}
        default: REGISTERED
      - name: central_registry_required
        type: boolean
        source: computed
        description: True when amount_cents >= CENTRAL_REGISTRY_THRESHOLD_CENTS; pinned at registration.
      - name: central_registry_filing_no
        type: string
        source: computed
        description: Filing reference returned by central registry; null until filed.
        default: null

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - name: receivable_id
        type: string
        source: input
        description: FK to a Receivable in REGISTERED state.
      - name: supplier_id
        type: string
        source: computed
        description: Mirrored from receivable.supplier_id; must equal the requester.
      - name: mode
        type: enum
        source: input
        description: Financing mode.
        constraints: one of {FACTORING, REVERSE_FACTORING, DYNAMIC_DISCOUNTING, RECEIVABLE_PLEDGE}
      - name: requested_amount_cents
        type: integer
        source: input
        description: Supplier-proposed financing principal in integer cents.
      - name: term_days
        type: integer
        source: input
        description: Proposed financing term in days from disbursement to due_date.
        constraints: 1 <= term_days <= 365
      - name: supporting_doc_ids
        type: array
        source: input
        description: Array of additional uploaded document ids (logistics, customs, etc.).
      - name: pinned_core_enterprise_version
        type: integer
        source: computed
        description: CoreEnterprise.version captured at APPROVE; downstream re-validation pins on this.
        default: null
      - name: pinned_receivable_version
        type: integer
        source: computed
        description: Receivable.version captured at APPROVE.
        default: null
      - name: status
        type: enum
        source: computed
        description: Application lifecycle.
        constraints: one of {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_REVISION, APPROVED, REJECTED, DISBURSED, CANCELLED}
        default: DRAFT
      - name: risk_rating
        type: enum
        source: computed
        description: Risk grade assigned by review; drives pricing.
        constraints: one of {LOW, MEDIUM, HIGH, REJECT}
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Final principal approved by risk control (≤ requested_amount_cents).
        default: null
      - name: approved_apr_bps
        type: integer
        source: computed
        description: Approved annual percentage rate in basis points (1 bps = 0.01%).
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: Number of times this application has been returned and resubmitted; bounded by MAX_REVISION_ROUNDS.
        default: 0

  - name: Disbursement
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to FinancingApplication in APPROVED state.
        constraints: unique (at most one disbursement per application)
      - name: funder_account_id
        type: string
        source: input
        description: Funder's source account identifier.
      - name: principal_cents
        type: integer
        source: computed
        description: Mirror of application.approved_amount_cents at release time.
      - name: discount_cents
        type: integer
        source: computed
        description: For DYNAMIC_DISCOUNTING mode, prepaid discount withheld from supplier.
        default: 0
      - name: net_to_supplier_cents
        type: integer
        source: computed
        description: principal_cents - discount_cents - fees_cents.
      - name: fees_cents
        type: integer
        source: computed
        description: Platform fees withheld at disbursement.
        default: 0
      - name: released_at
        type: datetime
        source: computed
        description: ISO8601 timestamp of fund release instruction.
      - name: reconciled_at
        type: datetime
        source: computed
        description: ISO8601 timestamp when funder reconciliation confirmation received.
        default: null

  - name: RepaymentSchedule
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK to FinancingApplication.
        constraints: unique (one schedule per application)
      - name: scheduled_repayment_date
        type: datetime
        source: computed
        description: Set to receivable.due_date at disbursement time.
      - name: total_due_cents
        type: integer
        source: computed
        description: principal + interest + fees, computed per `financing_total_due` calculation.
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of successful repayment events.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Schedule lifecycle.
        constraints: one of {SCHEDULED, PARTIALLY_PAID, SETTLED, OVERDUE, WRITTEN_OFF}
        default: SCHEDULED
      - name: prepayment_count
        type: integer
        source: computed
        description: Count of accepted partial-prepayment events; capped by MAX_PARTIAL_PREPAYMENTS.
        default: 0

  - name: CollectionCase
    parent: null
    common_fields: true
    fields:
      - name: schedule_id
        type: string
        source: input
        description: FK to RepaymentSchedule in OVERDUE state.
        constraints: unique (one open case per schedule)
      - name: aging_bucket
        type: enum
        source: computed
        description: Days-past-due bucket pinned at case open; refreshed by sweep.
        constraints: one of {DPD_1_30, DPD_31_60, DPD_61_90, DPD_OVER_90}
      - name: stage
        type: enum
        source: computed
        description: Collection stage.
        constraints: one of {SOFT, HARD, JOINT_LIABILITY, LEGAL, WRITTEN_OFF, CLOSED}
        default: SOFT
      - name: reminder_count
        type: integer
        source: computed
        description: Number of soft-collection reminders dispatched.
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: total_due_cents - paid_cents at case open; recomputed on partial pay.

  - name: TradeBackgroundVerification
    parent: null
    common_fields: false
    fields:
      - name: receivable_id
        type: string
        source: input
        description: FK to Receivable being verified.
      - name: waybill_doc_id
        type: string
        source: input
        description: Logistics waybill document id.
        default: null
      - name: customs_declaration_doc_id
        type: string
        source: input
        description: Customs declaration document id (required for cross-border).
        default: null
      - name: capital_flow_match
        type: boolean
        source: computed
        description: True if recorded capital flow matches goods-flow amount within CAPITAL_GOODS_TOLERANCE_BPS.
      - name: third_party_score
        type: number
        source: input
        description: Score in [0.00, 1.00] returned by external trade data source.
      - name: on_site_required
        type: boolean
        source: computed
        description: True when receivable.amount_cents >= ON_SITE_THRESHOLD_CENTS.
      - name: on_site_completed
        type: boolean
        source: input
        description: Set true once on-site visit logged.
        default: false
      - name: outcome
        type: enum
        source: computed
        description: Verification outcome.
        constraints: one of {PASS, FAIL, INCONCLUSIVE}

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: entity_type
        type: enum
        source: system
        description: Which entity type was acted on.
        constraints: one of {CoreEnterprise, Supplier, PayableConfirmation, Receivable, FinancingApplication, Disbursement, RepaymentSchedule, CollectionCase}
      - name: entity_id
        type: string
        source: system
        description: Id of the affected entity.
      - name: action
        type: enum
        source: system
        description: Action performed.
        constraints: one of {CONFIRM, REVOKE, REGISTER, APPROVE, REJECT, DISBURSE, REPAY, WRITE_OFF, CENTRAL_REGISTRY_FILE, ERP_SYNC}
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor (system for sweeps).
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the actor.
      - name: amount_cents
        type: integer
        source: system
        description: Money amount captured at the event, when applicable.
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: Clock-driven ISO8601 timestamp when the event occurred.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CoreEnterprise
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /scf/core-enterprises/{id}/approve"
        actor: CreditOfficer
        preconditions:
          - "credit_line_total_cents in request body is integer > 0"
          - "onboarding_status == PENDING"
        side_effects:
          - "set credit_line_total_cents to requested limit"
          - "set credit_line_reserved_cents = 0, credit_line_consumed_cents = 0"
          - "append AuditLogEntry(action=APPROVE, entity_type=CoreEnterprise)"
          - "emit ERP_SYNC event to erp_endpoint_url"
      - from: PENDING
        to: REJECTED
        trigger: "POST /scf/core-enterprises/{id}/reject"
        actor: CreditOfficer
        preconditions:
          - "onboarding_status == PENDING"
        side_effects:
          - "append AuditLogEntry(action=REJECT)"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /scf/core-enterprises/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "onboarding_status == APPROVED"
        side_effects:
          - "block new PayableConfirmation uploads where core_enterprise_id == this.id"
          - "in-flight FinancingApplication in UNDER_REVIEW for this core enterprise cannot transition to APPROVED until SUSPENDED is cleared"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /scf/core-enterprises/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "onboarding_status == SUSPENDED"
        side_effects:
          - "unblock new uploads"

  - entity: PayableConfirmation
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: PENDING_CONFIRM
        trigger: "POST /scf/payable-confirmations (batch upload)"
        actor: CoreEnterpriseUser
        preconditions:
          - "CoreEnterprise.onboarding_status == APPROVED"
          - "supplier.status == ACTIVE"
          - "supplier.tier_to_core <= MAX_EXTENSION_TIER"
          - "tier 2+ requires parent_supplier_id resolvable and its prior confirmation is in CONFIRMED or SETTLED"
        side_effects:
          - "copy supplier.tier_to_core into PayableConfirmation.tier"
          - "append AuditLogEntry(action=REGISTER)"
      - from: PENDING_CONFIRM
        to: CONFIRMED
        trigger: "POST /scf/payable-confirmations/{id}/confirm"
        actor: CoreEnterpriseUser
        preconditions:
          - "credit_line_total - credit_line_reserved - credit_line_consumed >= amount_cents (else ERR_CREDIT_LINE_INSUFFICIENT)"
          - "tier >= 2: parent confirmation chain all CONFIRMED or SETTLED"
        side_effects:
          - "CoreEnterprise.credit_line_reserved_cents += amount_cents"
          - "set confirmed_at = now()"
          - "append AuditLogEntry(action=CONFIRM, amount_cents=amount)"
          - "emit ERP_SYNC event"
      - from: CONFIRMED
        to: REVOKED
        trigger: "POST /scf/payable-confirmations/{id}/revoke"
        actor: CoreEnterpriseUser
        preconditions:
          - "no Receivable already FINANCED references this confirmation (else ERR_CONFIRMATION_FROZEN_BY_FINANCING)"
          - "revoke_reason provided"
        side_effects:
          - "CoreEnterprise.credit_line_reserved_cents -= amount_cents (invariant: total reserved must not go negative)"
          - "if a Receivable referencing this confirmation exists with status == REGISTERED or PLEDGED or TRANSFERRED, cascade Receivable to WRITTEN_OFF"
          - "if the linked Receivable's WRITTEN_OFF cascade hits a DRAFT or UNDER_REVIEW FinancingApplication, cascade application to CANCELLED"
          - "append AuditLogEntry(action=REVOKE)"
      - from: CONFIRMED
        to: SETTLED
        trigger: "system: scheduled repayment fully discharged"
        actor: system
        preconditions:
          - "RepaymentSchedule.status == SETTLED for the related application"
        side_effects:
          - "CoreEnterprise.credit_line_reserved_cents -= amount_cents"
          - "CoreEnterprise.credit_line_consumed_cents -= principal_cents"
          - "Receivable.status -> SETTLED"
          - "append AuditLogEntry(action=REPAY)"

  - entity: Receivable
    initial_state: REGISTERED
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: REGISTERED
        to: PLEDGED
        trigger: "POST /scf/receivables/{id}/pledge"
        actor: SupplierUser
        preconditions:
          - "central_registry_required == false OR central_registry_filing_no IS NOT NULL"
          - "no other Receivable shares this confirmation_id (unique guard)"
        side_effects:
          - "AuditLogEntry(action=REGISTER, entity_type=Receivable)"
      - from: REGISTERED
        to: FINANCED
        trigger: "system: FinancingApplication transitions to DISBURSED"
        actor: system
        preconditions:
          - "associated FinancingApplication.status == DISBURSED"
        side_effects:
          - "(see Disbursement cascade)"
      - from: PLEDGED
        to: FINANCED
        trigger: "system: FinancingApplication transitions to DISBURSED"
        actor: system
        preconditions:
          - "associated FinancingApplication.status == DISBURSED"
        side_effects: []
      - from: FINANCED
        to: SETTLED
        trigger: "system: RepaymentSchedule transitions to SETTLED"
        actor: system
        preconditions:
          - "RepaymentSchedule.status == SETTLED"
        side_effects:
          - "release CoreEnterprise.credit_line_consumed_cents by principal_cents"
      - from: REGISTERED
        to: WRITTEN_OFF
        trigger: "cascade: linked PayableConfirmation revoked"
        actor: system
        preconditions:
          - "PayableConfirmation.status transitioned to REVOKED"
        side_effects: []
      - from: PLEDGED
        to: WRITTEN_OFF
        trigger: "cascade: linked PayableConfirmation revoked"
        actor: system
        preconditions:
          - "PayableConfirmation.status transitioned to REVOKED"
        side_effects: []
      - from: FINANCED
        to: WRITTEN_OFF
        trigger: "POST /scf/collection-cases/{id}/write-off"
        actor: CollectionManager
        preconditions:
          - "CollectionCase.stage == LEGAL"
          - "CollectionCase.aging_bucket == DPD_OVER_90"
        side_effects:
          - "RepaymentSchedule.status -> WRITTEN_OFF"
          - "CoreEnterprise.credit_line_consumed_cents -= principal_cents (joint liability still pursued separately)"
          - "AuditLogEntry(action=WRITE_OFF)"
      - from: REGISTERED
        to: TRANSFERRED
        trigger: "POST /scf/receivables/{id}/transfer"
        actor: SupplierUser
        preconditions:
          - "central_registry_required == false OR central_registry_filing_no IS NOT NULL"
          - "associated FinancingApplication does not exist or is in DRAFT"
        side_effects:
          - "supplier_id reassigned to the target SupplierUser"

  - entity: FinancingApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED, DISBURSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scf/financing-applications/{id}/submit"
        actor: SupplierUser
        preconditions:
          - "mode and term_days set; requested_amount_cents > 0"
          - "Receivable.status == REGISTERED or PLEDGED"
          - "Supplier.kyc_status == PASSED and kyc_completed_at within KYC_VALIDITY_DAYS"
        side_effects:
          - "AuditLogEntry(action=REGISTER, entity_type=FinancingApplication)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /scf/financing-applications/{id}/start-review"
        actor: RiskReviewer
        preconditions:
          - "trade_background_verification.outcome == PASS for this receivable"
        side_effects: []
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /scf/financing-applications/{id}/return"
        actor: RiskReviewer
        preconditions:
          - "revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "revision_round += 1"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /scf/financing-applications/{id}/submit"
        actor: SupplierUser
        preconditions:
          - "revision_round <= MAX_REVISION_ROUNDS"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /scf/financing-applications/{id}/approve"
        actor: CreditApprover
        preconditions:
          - "supplier KYC PASSED and unexpired"
          - "CoreEnterprise.onboarding_status == APPROVED"
          - "credit_line_total - credit_line_reserved - credit_line_consumed >= requested_amount_cents OR approved_amount_cents <= available"
          - "trade_background_verification.outcome == PASS"
          - "the approving actor MUST be a different user than the actor that performed SUBMITTED→UNDER_REVIEW (segregation of duties)"
        side_effects:
          - "pin pinned_core_enterprise_version = CoreEnterprise.version"
          - "pin pinned_receivable_version = Receivable.version"
          - "compute risk_rating and approved_apr_bps from `financing_apr_pricing` calc"
          - "AuditLogEntry(action=APPROVE)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /scf/financing-applications/{id}/reject"
        actor: CreditApprover
        preconditions:
          - "any of: KYC FAILED, fraud rule triggered, credit_line insufficient at decision time"
        side_effects:
          - "AuditLogEntry(action=REJECT)"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /scf/disbursements (release-instruction)"
        actor: Funder
        preconditions:
          - "CoreEnterprise.version == pinned_core_enterprise_version (stale-pin guard)"
          - "Receivable.version == pinned_receivable_version"
          - "CoreEnterprise.onboarding_status == APPROVED (not SUSPENDED at release time)"
        side_effects:
          - "create Disbursement; mirror principal_cents = approved_amount_cents"
          - "CoreEnterprise.credit_line_consumed_cents += approved_amount_cents"
          - "CoreEnterprise.credit_line_reserved_cents -= approved_amount_cents (release reservation; net effect: total committed unchanged)"
          - "Receivable.status -> FINANCED"
          - "create RepaymentSchedule with scheduled_repayment_date = receivable.due_date"
          - "AuditLogEntry(action=DISBURSE, amount_cents=principal_cents)"
      - from: DRAFT
        to: CANCELLED
        trigger: "cascade: linked confirmation REVOKED"
        actor: system
        preconditions:
          - "PayableConfirmation.status -> REVOKED"
        side_effects: []
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "cascade: linked confirmation REVOKED"
        actor: system
        preconditions:
          - "PayableConfirmation.status -> REVOKED"
        side_effects: []

  - entity: RepaymentSchedule
    initial_state: SCHEDULED
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: SCHEDULED
        to: PARTIALLY_PAID
        trigger: "POST /scf/repayment-schedules/{id}/repay (partial)"
        actor: system
        preconditions:
          - "0 < repay_amount_cents < total_due_cents - paid_cents"
          - "prepayment_count < MAX_PARTIAL_PREPAYMENTS"
        side_effects:
          - "paid_cents += repay_amount_cents"
          - "prepayment_count += 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /scf/repayment-schedules/{id}/repay (partial)"
        actor: system
        preconditions:
          - "0 < repay_amount_cents < total_due_cents - paid_cents"
          - "prepayment_count < MAX_PARTIAL_PREPAYMENTS"
        side_effects:
          - "paid_cents += repay_amount_cents"
          - "prepayment_count += 1"
      - from: SCHEDULED
        to: SETTLED
        trigger: "POST /scf/repayment-schedules/{id}/repay (full or early-settle)"
        actor: system
        preconditions:
          - "repay_amount_cents == total_due_cents - paid_cents (with early-settle rebate via calc `early_settle_rebate`)"
        side_effects:
          - "paid_cents = total_due_cents"
          - "cascade Receivable -> SETTLED"
          - "cascade PayableConfirmation -> SETTLED"
          - "release credit_line_consumed_cents and credit_line_reserved_cents by principal_cents"
      - from: PARTIALLY_PAID
        to: SETTLED
        trigger: "POST /scf/repayment-schedules/{id}/repay (full balance)"
        actor: system
        preconditions:
          - "repay_amount_cents == total_due_cents - paid_cents"
        side_effects:
          - "paid_cents = total_due_cents"
          - "cascade Receivable -> SETTLED, PayableConfirmation -> SETTLED"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system: clock-advance sweep detects now() > scheduled_repayment_date and paid_cents < total_due_cents"
        actor: system
        preconditions: []
        side_effects:
          - "open CollectionCase in SOFT stage"
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system: clock-advance sweep"
        actor: system
        preconditions: []
        side_effects:
          - "open CollectionCase in SOFT stage with outstanding_cents = total_due_cents - paid_cents"
      - from: OVERDUE
        to: SETTLED
        trigger: "POST /scf/repayment-schedules/{id}/repay (full balance after overdue)"
        actor: system
        preconditions:
          - "outstanding_cents == 0 after this payment"
        side_effects:
          - "close CollectionCase -> CLOSED"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "POST /scf/collection-cases/{id}/write-off"
        actor: CollectionManager
        preconditions:
          - "CollectionCase.stage == LEGAL and aging_bucket == DPD_OVER_90"
        side_effects:
          - "Receivable -> WRITTEN_OFF"

  - entity: CollectionCase
    initial_state: SOFT
    terminal_states: [CLOSED, WRITTEN_OFF]
    transitions:
      - from: SOFT
        to: HARD
        trigger: "POST /scf/collection-cases/{id}/escalate"
        actor: CollectionManager
        preconditions:
          - "reminder_count >= SOFT_TO_HARD_REMINDER_THRESHOLD"
          - "aging_bucket in {DPD_31_60, DPD_61_90, DPD_OVER_90}"
        side_effects: []
      - from: HARD
        to: JOINT_LIABILITY
        trigger: "POST /scf/collection-cases/{id}/invoke-joint-liability"
        actor: CollectionManager
        preconditions:
          - "CoreEnterprise.joint_liability_flag == true"
          - "aging_bucket in {DPD_61_90, DPD_OVER_90}"
        side_effects:
          - "ERP_SYNC event to core enterprise"
      - from: JOINT_LIABILITY
        to: LEGAL
        trigger: "POST /scf/collection-cases/{id}/legal"
        actor: CollectionManager
        preconditions:
          - "aging_bucket == DPD_OVER_90"
        side_effects: []
      - from: HARD
        to: LEGAL
        trigger: "POST /scf/collection-cases/{id}/legal"
        actor: CollectionManager
        preconditions:
          - "CoreEnterprise.joint_liability_flag == false"
          - "aging_bucket == DPD_OVER_90"
        side_effects: []
      - from: LEGAL
        to: WRITTEN_OFF
        trigger: "POST /scf/collection-cases/{id}/write-off"
        actor: CollectionManager
        preconditions:
          - "aging_bucket == DPD_OVER_90"
        side_effects:
          - "Receivable -> WRITTEN_OFF; RepaymentSchedule -> WRITTEN_OFF"
      - from: SOFT
        to: CLOSED
        trigger: "cascade: RepaymentSchedule -> SETTLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: HARD
        to: CLOSED
        trigger: "cascade: RepaymentSchedule -> SETTLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: JOINT_LIABILITY
        to: CLOSED
        trigger: "cascade: RepaymentSchedule -> SETTLED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeBackgroundVerification
    initial_state: INCONCLUSIVE
    terminal_states: [PASS, FAIL]
    transitions:
      - from: INCONCLUSIVE
        to: PASS
        trigger: "POST /scf/verifications/{id}/finalize"
        actor: RiskReviewer
        preconditions:
          - "capital_flow_match == true"
          - "third_party_score >= THIRD_PARTY_PASS_FLOOR"
          - "if on_site_required then on_site_completed == true"
        side_effects: []
      - from: INCONCLUSIVE
        to: FAIL
        trigger: "POST /scf/verifications/{id}/finalize"
        actor: RiskReviewer
        preconditions:
          - "any of: capital_flow_match == false; third_party_score < THIRD_PARTY_PASS_FLOOR; on_site_required and not on_site_completed"
        side_effects:
          - "Supplier.aml_risk_score += FRAUD_PENALTY (clamped to [0,1])"
          - "if Supplier.aml_risk_score >= AML_BLACKLIST_THRESHOLD then Supplier.status -> BLACKLISTED (cascade: all SUBMITTED/UNDER_REVIEW FinancingApplication for this supplier -> REJECTED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two confirmations on the same PayableConfirmation race to CONFIRMED"
    guarantee: "Exactly one transition succeeds; second loses with ERR_INVALID_STATE because confirmation already left PENDING_CONFIRM."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PayableConfirmation.status"
  - scenario: "Two FinancingApplications for the same receivable submitted simultaneously"
    guarantee: "At most one application enters SUBMITTED; the second is rejected because of the unique (receivable_id, active) index."
    error_id: ERR_RECEIVABLE_ALREADY_FINANCED
    http_status: 409
    serialization: "First-writer-wins on the (receivable_id, non-terminal status) unique guard"
  - scenario: "Two confirmations for tier-2 supplier exhaust core-enterprise credit line in parallel"
    guarantee: "Sum of credit_line_reserved_cents after both attempts never exceeds credit_line_total_cents; the second loses with ERR_CREDIT_LINE_INSUFFICIENT."
    error_id: ERR_CREDIT_LINE_INSUFFICIENT
    http_status: 409
    serialization: "Linearized debit on CoreEnterprise.credit_line_reserved_cents"
  - scenario: "Disbursement release fired while CoreEnterprise just got SUSPENDED"
    guarantee: "Exactly one of {release, suspend} succeeds; if suspend lands first, release is rejected ERR_CORE_ENTERPRISE_SUSPENDED; if release lands first, suspend still applies prospectively."
    error_id: ERR_CORE_ENTERPRISE_SUSPENDED
    http_status: 409
    serialization: "First-writer-wins on CoreEnterprise.onboarding_status read at release time"
  - scenario: "Revoke confirmation while a financing application is being APPROVED"
    guarantee: "Either approval succeeds first and revocation is rejected with ERR_CONFIRMATION_FROZEN_BY_FINANCING, or revocation succeeds first and the in-flight approval is rejected with ERR_PIN_STALE on attempted DISBURSED transition."
    error_id: ERR_CONFIRMATION_FROZEN_BY_FINANCING
    http_status: 409
    serialization: "First-writer-wins on PayableConfirmation.status; pinned versions used at DISBURSED"
  - scenario: "Two partial repayments for the same schedule cross the total_due boundary"
    guarantee: "Only one of them can push paid_cents to exactly total_due_cents; the other is rejected with ERR_OVERPAYMENT."
    error_id: ERR_OVERPAYMENT
    http_status: 422
    serialization: "Linearized increment on RepaymentSchedule.paid_cents"
  - scenario: "Approve action submitted by the same user that performed start-review"
    guarantee: "Approve is rejected with ERR_SEGREGATION_OF_DUTIES regardless of timing."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    serialization: "Compare X-User-ID to AuditLogEntry of start-review for this application"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: financing_apr_pricing
    trigger: "UNDER_REVIEW -> APPROVED on FinancingApplication (and re-evaluated whenever the application is APPROVED)"
    algorithm: tiered_pricing
    formula: |
      # All amounts are integer cents; rates are basis points (bps; 100 bps = 1.00%).
      # 1. Pick base rate by FinancingApplication.mode:
      base_bps = {
        FACTORING: 800,
        REVERSE_FACTORING: 600,
        DYNAMIC_DISCOUNTING: 500,
        RECEIVABLE_PLEDGE: 700,
      }[mode]

      # 2. Add core-enterprise risk-rating adjustment (drives floor):
      core_adj_bps = {
        AAA: -150, AA: -100, A: 0, BBB: 100, BB: 250,
      }[CoreEnterprise.risk_rating]

      # 3. Add supplier risk_rating tier (assigned during review):
      supplier_adj_bps = {LOW: 0, MEDIUM: 100, HIGH: 250}[FinancingApplication.risk_rating]

      # 4. Tier penalty for multi-tier suppliers:
      tier_adj_bps = (Supplier.tier_to_core - 1) * 50    # tier 1: 0, tier 2: 50, tier 3: 100, tier 4: 150

      # 5. Combine, then floor and ceiling:
      raw_bps = base_bps + core_adj_bps + supplier_adj_bps + tier_adj_bps
      approved_apr_bps = max(APR_FLOOR_BPS, min(APR_CEILING_BPS, raw_bps))
    input_set: "FinancingApplication.mode, Supplier.tier_to_core, Supplier.risk_rating (FinancingApplication.risk_rating field assigned during UNDER_REVIEW), CoreEnterprise.risk_rating"
    constants:
      APR_FLOOR_BPS: 300
      APR_CEILING_BPS: 2400
    precision: "integer basis points; no rounding required"
    variants:
      - name: dynamic_discount_variant
        when: "mode == DYNAMIC_DISCOUNTING"
        difference: "Final approved_apr_bps is multiplied by (term_days / 365) and stored as `effective_apr_bps`, AND a one-time prepaid discount is deducted from supplier net at disbursement. Other modes accrue interest until due."

  - name: financing_total_due
    trigger: "APPROVED -> DISBURSED on FinancingApplication (creates RepaymentSchedule)"
    algorithm: forward_looking
    formula: |
      # Two variants below produce different totals on the same inputs.
      # Base interest is computed by approved_apr_bps over term_days actually elapsed.

      # Variant A — Forward-looking (default, used at disbursement to publish RepaymentSchedule.total_due_cents):
      # interest is projected over scheduled term (full term_days), rounded once per line item.
      term_days = (receivable.due_date - released_at).days
      interest_cents_A = round_half_up(principal_cents * approved_apr_bps * term_days / (10000 * 365))
      fees_cents_A = round_half_up(principal_cents * PLATFORM_FEE_BPS / 10000)
      total_due_cents_A = principal_cents + interest_cents_A + fees_cents_A

      # Variant B — Chronological (used when actual repayment date != scheduled date, e.g., early settle):
      # interest accrues day-by-day; partial-prepayments reduce principal mid-stream.
      # Each daily slice: outstanding_after = outstanding_before - any_prepay_on_day
      # daily_interest = round_half_up(outstanding_after * approved_apr_bps / (10000 * 365))
      # total_interest = sum of daily_interest from released_at to actual_settle_date.
      # fees_cents_B equals fees_cents_A (flat at disbursement, not pro-rated).
      # total_due_cents_B = principal_cents - prepaid_principal + total_interest + fees_cents_B
    input_set: "FinancingApplication.approved_amount_cents (= principal_cents), approved_apr_bps, term_days, partial-prepayment ledger"
    constants:
      PLATFORM_FEE_BPS: 50
    precision: "integer cents; round_half_up at each rounding boundary indicated"
    variants:
      - name: forward_looking_at_disbursement
        when: "RepaymentSchedule.total_due_cents is first computed at DISBURSED"
        difference: "Uses Variant A: one rounding of interest over the full scheduled term."
      - name: chronological_on_early_settle
        when: "Supplier or core enterprise repays before due_date (early-settle) and an early-settle rebate is requested"
        difference: "Uses Variant B: day-by-day accrual yields a smaller interest figure than A pro-rated. The difference is paid as `early_settle_rebate`."

  - name: early_settle_rebate
    trigger: "POST /scf/repayment-schedules/{id}/repay with early_settle=true before scheduled_repayment_date"
    algorithm: chronological
    formula: |
      # rebate = max(0, total_due_cents_at_schedule - chronological_total_due_at_today)
      # Where chronological_total_due_at_today applies financing_total_due Variant B with
      # actual_settle_date = now() and all prior partial-prepayments folded in.
      forward_total = RepaymentSchedule.total_due_cents       # locked at DISBURSED via Variant A
      chrono_total  = financing_total_due.variant_B(today=now())
      rebate_cents  = max(0, forward_total - chrono_total)
      net_payment_required = forward_total - paid_cents - rebate_cents
    input_set: "RepaymentSchedule.total_due_cents, partial-prepayment events, now()"
    constants: {}
    precision: "integer cents; round_half_up on the chronological side ONLY at the per-day step (sum-then-round on the difference produces a different cent — order is pinned: round daily, then sum, then subtract from the forward total)."
    variants:
      - name: standard_rebate
        when: "early_settle=true and now() < scheduled_repayment_date"
        difference: "Applies the daily-rounded chronological model and pays out the positive delta."
      - name: zero_rebate_after_overdue
        when: "now() >= scheduled_repayment_date"
        difference: "rebate_cents pinned to 0; penalty interest accrues instead via overdue_penalty calc."

  - name: overdue_penalty_aging
    trigger: "system: clock-advance sweep on overdue RepaymentSchedule"
    algorithm: threshold
    formula: |
      # Aging bucket assignment (boundary precision: 1, 31, 61, 91 inclusive lower; days_past_due is integer):
      dpd = floor((now() - scheduled_repayment_date) / 1 day)        # integer days
      if dpd <= 0: bucket = null
      elif 1 <= dpd <= 30: bucket = DPD_1_30
      elif 31 <= dpd <= 60: bucket = DPD_31_60
      elif 61 <= dpd <= 90: bucket = DPD_61_90
      else: bucket = DPD_OVER_90

      # Penalty interest rate by bucket (bps annualized):
      penalty_bps = { DPD_1_30: 1200, DPD_31_60: 1800, DPD_61_90: 2400, DPD_OVER_90: 3000 }[bucket]
      outstanding = total_due_cents - paid_cents
      daily_penalty = round_half_up(outstanding * penalty_bps / (10000 * 365))    # per-day rounding
      total_penalty_cents = daily_penalty * 1   # accumulated by sweep across days
    input_set: "RepaymentSchedule.scheduled_repayment_date, total_due_cents, paid_cents, current clock"
    constants:
      DPD_BUCKET_BOUNDARIES: [1, 31, 61, 91]
    precision: "integer cents; per-day round_half_up, then summed (pin: round then sum)"
    variants:
      - name: standard_accrual
        when: "schedule in OVERDUE and CollectionCase.stage != WRITTEN_OFF"
        difference: "Per-day rounding, daily summation."
      - name: write_off_freeze
        when: "CollectionCase.stage == WRITTEN_OFF"
        difference: "Penalty accrual frozen; no further increments."

  - name: supplier_risk_rating_composite
    trigger: "SUBMITTED -> UNDER_REVIEW on FinancingApplication"
    algorithm: weighted_scoring
    formula: |
      # Composite score combines three factors; the order of normalization vs weighting matters
      # (pin: normalize each factor to [0,1] FIRST, then apply weights, then sum, then round once at end).
      kyc_factor = 1.0 if Supplier.kyc_status == PASSED else 0.0
      aml_factor = 1.0 - Supplier.aml_risk_score            # already in [0,1]
      tier_factor = max(0, 1.0 - (Supplier.tier_to_core - 1) * 0.20)   # tier 1 -> 1.0, tier 4 -> 0.4

      raw_score = (W_KYC * kyc_factor) + (W_AML * aml_factor) + (W_TIER * tier_factor)
      composite_score = round_half_up(raw_score, 2)        # 2 decimals; single rounding at end

      if composite_score >= 0.80: rating = LOW
      elif composite_score >= 0.60: rating = MEDIUM
      elif composite_score >= 0.40: rating = HIGH
      else: rating = REJECT                                 # auto-reject path
    input_set: "Supplier.kyc_status, Supplier.aml_risk_score, Supplier.tier_to_core"
    constants:
      W_KYC: 0.5
      W_AML: 0.3
      W_TIER: 0.2
    precision: "2 decimal places, round_half_up, ONE rounding at end of weighted sum"
    variants:
      - name: composite_for_factoring
        when: "FinancingApplication.mode in {FACTORING, RECEIVABLE_PLEDGE}"
        difference: "Standard formula applies; the assigned rating gates approve/reject and feeds into pricing."
      - name: composite_for_reverse_factoring
        when: "FinancingApplication.mode == REVERSE_FACTORING"
        difference: "kyc_factor is replaced by CoreEnterprise.risk_rating mapping (AAA=1.0, AA=0.9, A=0.8, BBB=0.7, BB=0.5), reflecting that reverse-factoring shifts risk onto the buyer. Weights and rounding rule unchanged."

  - name: capital_goods_consistency
    trigger: "POST /scf/verifications/{id}/finalize"
    algorithm: threshold
    formula: |
      # Capital flow (invoice + receivable amount) vs goods flow (logistics waybill stated amount).
      capital_cents = Receivable.amount_cents
      goods_cents = waybill.declared_value_cents      # supplied via uploaded waybill doc metadata
      if goods_cents == 0:
        capital_flow_match = false
      else:
        deviation_bps = round_half_up(abs(capital_cents - goods_cents) * 10000 / goods_cents)
        capital_flow_match = (deviation_bps <= CAPITAL_GOODS_TOLERANCE_BPS)
    input_set: "Receivable.amount_cents, waybill.declared_value_cents"
    constants:
      CAPITAL_GOODS_TOLERANCE_BPS: 500            # 5.00%
    precision: "integer basis points; round_half_up on the deviation ratio"
    variants:
      - name: domestic
        when: "Receivable does NOT have customs_declaration_doc_id"
        difference: "Only waybill required."
      - name: cross_border
        when: "Receivable has customs_declaration_doc_id"
        difference: "Both waybill AND customs declaration must each independently satisfy the tolerance; capital_flow_match = AND of the two checks."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  # ---- 1. Authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role header present"
    error_id: ERR_AUTH_HEADER_MISSING
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header present"
    error_id: ERR_AUTH_HEADER_MISSING
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "Role is one of {CoreEnterpriseUser, SupplierUser, CreditOfficer, ComplianceOfficer, RiskReviewer, CreditApprover, Funder, CollectionManager, PlatformAdmin}"
    error_id: ERR_AUTH_ROLE_UNKNOWN
    http_status: 401
    applies_to: all

  # ---- 2. Authorization ----
  - priority: 4
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: "Entity-backed roles: X-User-ID equals the owning entity (e.g., SupplierUser acting on a FinancingApplication must own the referenced Supplier)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: all
  - priority: 6
    category: auth
    check: "Segregation of duties: CreditApprover.X-User-ID must NOT equal the X-User-ID that started review for the same application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /scf/financing-applications/{id}/approve, POST /scf/financing-applications/{id}/reject"

  # ---- 3. Existence ----
  - priority: 10
    category: existence
    check: "Path resource exists (CoreEnterprise, Supplier, PayableConfirmation, Receivable, FinancingApplication, RepaymentSchedule, Disbursement, CollectionCase, TradeBackgroundVerification)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 11
    category: existence
    check: "Referenced foreign-key entities in the request body exist"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: all

  # ---- 4. State preconditions ----
  - priority: 20
    category: state
    check: "Target resource is in the correct state for this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
  - priority: 21
    category: state
    check: "CoreEnterprise.onboarding_status == APPROVED before any operation involving its credit line"
    error_id: ERR_CORE_ENTERPRISE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /scf/payable-confirmations, POST /scf/payable-confirmations/{id}/confirm, POST /scf/disbursements"
  - priority: 22
    category: state
    check: "CoreEnterprise.onboarding_status != SUSPENDED at the moment of disbursement release"
    error_id: ERR_CORE_ENTERPRISE_SUSPENDED
    http_status: 409
    applies_to: "POST /scf/disbursements"
  - priority: 23
    category: state
    check: "OCC: if version supplied, must equal current entity version; pinned versions on FinancingApplication must match at disbursement"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutating endpoints that accept version"
  - priority: 24
    category: state
    check: "Stale pin: at DISBURSED, FinancingApplication.pinned_core_enterprise_version must equal CoreEnterprise.version AND pinned_receivable_version must equal Receivable.version"
    error_id: ERR_PIN_STALE
    http_status: 409
    applies_to: "POST /scf/disbursements"

  # ---- 5. Business — compliance & safety ----
  - priority: 30
    category: business_safety
    check: "Supplier.kyc_status == PASSED and kyc_completed_at within KYC_VALIDITY_DAYS days of now() before SUBMITTED"
    error_id: ERR_KYC_EXPIRED_OR_FAILED
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/submit"
  - priority: 31
    category: business_safety
    check: "Supplier.status != BLACKLISTED"
    error_id: ERR_SUPPLIER_BLACKLISTED
    http_status: 422
    applies_to: "all SupplierUser mutating endpoints"
  - priority: 32
    category: business_safety
    check: "On-site verification: if Receivable.amount_cents >= ON_SITE_THRESHOLD_CENTS, on_site_completed must be true before TradeBackgroundVerification finalize PASS"
    error_id: ERR_ON_SITE_REQUIRED
    http_status: 422
    applies_to: "POST /scf/verifications/{id}/finalize"
  - priority: 33
    category: business_safety
    check: "Anti double-financing: Receivable.confirmation_id is globally unique; no two Receivables may share a confirmation_id"
    error_id: ERR_DOUBLE_FINANCING
    http_status: 409
    applies_to: "POST /scf/receivables"
  - priority: 34
    category: business_safety
    check: "Fraud detection: if Supplier.aml_risk_score >= FRAUD_RISK_THRESHOLD, financing must be REJECTED (not APPROVED)"
    error_id: ERR_FRAUD_RISK_THRESHOLD
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/approve"

  # ---- 6. Business — referential / constraint ----
  - priority: 40
    category: business_referential
    check: "Multi-tier extension: for tier >= 2, the upstream parent PayableConfirmation (resolved via Supplier.parent_supplier_id) must already be CONFIRMED or SETTLED"
    error_id: ERR_TIER_PARENT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /scf/payable-confirmations/{id}/confirm"
  - priority: 41
    category: business_constraint
    check: "Supplier.tier_to_core <= MAX_EXTENSION_TIER"
    error_id: ERR_TIER_TOO_DEEP
    http_status: 422
    applies_to: "POST /scf/payable-confirmations"
  - priority: 42
    category: business_constraint
    check: "Confirmation cannot be revoked if a linked Receivable.status == FINANCED"
    error_id: ERR_CONFIRMATION_FROZEN_BY_FINANCING
    http_status: 422
    applies_to: "POST /scf/payable-confirmations/{id}/revoke"
  - priority: 43
    category: business_referential
    check: "Central registry: Receivable with central_registry_required == true cannot be PLEDGED or TRANSFERRED until central_registry_filing_no is set"
    error_id: ERR_CENTRAL_REGISTRY_FILING_REQUIRED
    http_status: 422
    applies_to: "POST /scf/receivables/{id}/pledge, POST /scf/receivables/{id}/transfer"
  - priority: 44
    category: business_constraint
    check: "Revision rounds cap: FinancingApplication.revision_round must be < MAX_REVISION_ROUNDS before RETURNED_FOR_REVISION"
    error_id: ERR_MAX_REVISIONS_EXCEEDED
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/return"
  - priority: 45
    category: business_constraint
    check: "Partial prepayment cap: RepaymentSchedule.prepayment_count must be < MAX_PARTIAL_PREPAYMENTS"
    error_id: ERR_PREPAYMENT_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /scf/repayment-schedules/{id}/repay (partial=true)"

  # ---- 7. Business — fiscal / capacity ----
  - priority: 50
    category: business_fiscal
    check: "Confirmation amount_cents > 0"
    error_id: ERR_AMOUNT_NON_POSITIVE
    http_status: 422
    applies_to: "POST /scf/payable-confirmations"
  - priority: 51
    category: business_fiscal
    check: "Core-enterprise credit line: credit_line_total_cents - credit_line_reserved_cents - credit_line_consumed_cents >= incoming amount (at CONFIRMED step) or approved_amount_cents (at APPROVED→DISBURSED)"
    error_id: ERR_CREDIT_LINE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /scf/payable-confirmations/{id}/confirm, POST /scf/financing-applications/{id}/approve"
  - priority: 52
    category: business_fiscal
    check: "Requested financing principal: approved_amount_cents <= requested_amount_cents AND approved_amount_cents <= Receivable.amount_cents"
    error_id: ERR_APPROVED_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/approve"
  - priority: 53
    category: business_fiscal
    check: "Repay amount must satisfy 0 < repay_amount_cents <= outstanding (total_due_cents - paid_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /scf/repayment-schedules/{id}/repay"
  - priority: 54
    category: business_fiscal
    check: "APR clamp: approved_apr_bps is within [APR_FLOOR_BPS, APR_CEILING_BPS]"
    error_id: ERR_APR_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/approve"

  # ---- 8. Business — temporal ----
  - priority: 60
    category: business_temporal
    check: "PayableConfirmation.due_date must be > now() at confirmation time AND <= now() + MAX_DUE_DATE_DAYS"
    error_id: ERR_DUE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /scf/payable-confirmations"
  - priority: 61
    category: business_temporal
    check: "FinancingApplication.term_days must equal (Receivable.due_date - now()) in whole days, ±1 day tolerance"
    error_id: ERR_TERM_MISMATCH
    http_status: 422
    applies_to: "POST /scf/financing-applications/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Core Enterprises -----
  - method: POST
    path: "/scf/core-enterprises"
    description: "Onboard a new core enterprise; status starts at PENDING."
    roles: [CreditOfficer]
    code: 201
    input: [legal_name, unified_credit_code, erp_endpoint_url, "joint_liability_flag?", "risk_rating?"]
    output: CoreEnterprise
    side_effects: ["AuditLogEntry(action=REGISTER)"]
  - method: GET
    path: "/scf/core-enterprises/{id}"
    description: "Get a core enterprise."
    roles: [CreditOfficer, ComplianceOfficer, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: []
    output: CoreEnterprise
    side_effects: []
  - method: POST
    path: "/scf/core-enterprises/{id}/approve"
    description: "Approve onboarding and set master credit-line."
    roles: [CreditOfficer]
    code: 200
    input: [credit_line_total_cents, "version?"]
    output: CoreEnterprise
    side_effects: [credit-line initialized, ERP_SYNC]
  - method: POST
    path: "/scf/core-enterprises/{id}/reject"
    description: "Reject onboarding."
    roles: [CreditOfficer]
    code: 200
    input: ["version?"]
    output: CoreEnterprise
    side_effects: []
  - method: POST
    path: "/scf/core-enterprises/{id}/suspend"
    description: "Suspend an APPROVED core enterprise (blocks new uploads and disbursements)."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason, "version?"]
    output: CoreEnterprise
    side_effects: ["block uploads", "block disbursements"]
  - method: POST
    path: "/scf/core-enterprises/{id}/reinstate"
    description: "Lift suspension."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: CoreEnterprise
    side_effects: []

  # ----- Suppliers -----
  - method: POST
    path: "/scf/suppliers"
    description: "Onboard a supplier."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, unified_credit_code, tier_to_core, "parent_supplier_id?", bank_account_number]
    output: Supplier
    side_effects: []
  - method: POST
    path: "/scf/suppliers/{id}/kyc"
    description: "Record KYC/AML screening result."
    roles: [ComplianceOfficer]
    code: 200
    input: [kyc_status, aml_risk_score, "version?"]
    output: Supplier
    side_effects: ["if kyc_status==FAILED or aml_risk_score>=AML_BLACKLIST_THRESHOLD then Supplier.status -> BLACKLISTED; cascade reject open applications"]
  - method: GET
    path: "/scf/suppliers/{id}"
    description: "Get supplier."
    roles: [SupplierUser, ComplianceOfficer, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  # ----- Payable Confirmations -----
  - method: POST
    path: "/scf/payable-confirmations"
    description: "Upload payable-list rows (one PayableConfirmation per call; clients send batches by looping)."
    roles: [CoreEnterpriseUser]
    code: 201
    input: [core_enterprise_id, supplier_id, invoice_number, contract_number, amount_cents, due_date]
    output: PayableConfirmation
    side_effects: ["copy tier from supplier", "AuditLogEntry"]
  - method: POST
    path: "/scf/payable-confirmations/{id}/confirm"
    description: "Core enterprise electronically confirms debt."
    roles: [CoreEnterpriseUser]
    code: 200
    input: ["version?"]
    output: PayableConfirmation
    side_effects: ["credit_line_reserved_cents += amount_cents", "ERP_SYNC"]
  - method: POST
    path: "/scf/payable-confirmations/{id}/revoke"
    description: "Revoke a CONFIRMED confirmation."
    roles: [CoreEnterpriseUser]
    code: 200
    input: [revoke_reason, "version?"]
    output: PayableConfirmation
    side_effects: ["credit_line_reserved_cents -= amount_cents", "cascade Receivable -> WRITTEN_OFF if not FINANCED", "cascade FinancingApplication -> CANCELLED"]
  - method: GET
    path: "/scf/payable-confirmations"
    description: "List confirmations with filtering by core_enterprise_id, supplier_id, status, tier."
    roles: [CoreEnterpriseUser, SupplierUser, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: ["core_enterprise_id?", "supplier_id?", "status?", "tier?", "limit?", "offset?"]
    output: PayableConfirmation[]
    side_effects: []
  - method: GET
    path: "/scf/payable-confirmations/{id}"
    description: "Get one confirmation."
    roles: [CoreEnterpriseUser, SupplierUser, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: []
    output: PayableConfirmation
    side_effects: []

  # ----- Receivables -----
  - method: POST
    path: "/scf/receivables"
    description: "Register a receivable against a CONFIRMED PayableConfirmation; enforces uniqueness."
    roles: [SupplierUser]
    code: 201
    input: [confirmation_id, invoice_doc_id, contract_doc_id]
    output: Receivable
    side_effects: ["set central_registry_required by amount threshold"]
  - method: POST
    path: "/scf/receivables/{id}/central-registry-file"
    description: "File a central-registry record and store the returned filing number."
    roles: [PlatformAdmin]
    code: 200
    input: [central_registry_filing_no, "version?"]
    output: Receivable
    side_effects: ["AuditLogEntry(action=CENTRAL_REGISTRY_FILE)"]
  - method: POST
    path: "/scf/receivables/{id}/pledge"
    description: "Pledge a receivable (as collateral)."
    roles: [SupplierUser]
    code: 200
    input: ["version?"]
    output: Receivable
    side_effects: []
  - method: POST
    path: "/scf/receivables/{id}/transfer"
    description: "Transfer a receivable to a new supplier owner."
    roles: [SupplierUser]
    code: 200
    input: [new_supplier_id, "version?"]
    output: Receivable
    side_effects: []
  - method: GET
    path: "/scf/receivables/{id}"
    description: "Get a receivable."
    roles: [SupplierUser, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: []
    output: Receivable
    side_effects: []
  - method: GET
    path: "/scf/receivables"
    description: "List receivables with filtering."
    roles: [SupplierUser, RiskReviewer, CreditApprover, PlatformAdmin]
    code: 200
    input: ["supplier_id?", "status?", "central_registry_required?", "limit?", "offset?"]
    output: Receivable[]
    side_effects: []

  # ----- Trade Background Verification -----
  - method: POST
    path: "/scf/verifications"
    description: "Open a trade-background verification record for a receivable."
    roles: [RiskReviewer]
    code: 201
    input: [receivable_id, "waybill_doc_id?", "customs_declaration_doc_id?", third_party_score]
    output: TradeBackgroundVerification
    side_effects: ["compute capital_flow_match via `capital_goods_consistency`", "set on_site_required by threshold"]
  - method: POST
    path: "/scf/verifications/{id}/on-site"
    description: "Record on-site visit completion."
    roles: [RiskReviewer]
    code: 200
    input: []
    output: TradeBackgroundVerification
    side_effects: ["on_site_completed = true"]
  - method: POST
    path: "/scf/verifications/{id}/finalize"
    description: "Finalize verification (PASS or FAIL)."
    roles: [RiskReviewer]
    code: 200
    input: []
    output: TradeBackgroundVerification
    side_effects: ["on FAIL: Supplier.aml_risk_score += FRAUD_PENALTY; cascade blacklist if threshold crossed"]

  # ----- Financing Applications -----
  - method: POST
    path: "/scf/financing-applications"
    description: "Supplier-side draft application."
    roles: [SupplierUser]
    code: 201
    input: [receivable_id, mode, requested_amount_cents, term_days, supporting_doc_ids]
    output: FinancingApplication
    side_effects: []
  - method: POST
    path: "/scf/financing-applications/{id}/submit"
    description: "Submit for review."
    roles: [SupplierUser]
    code: 200
    input: ["version?"]
    output: FinancingApplication
    side_effects: ["compute supplier_risk_rating_composite"]
  - method: POST
    path: "/scf/financing-applications/{id}/start-review"
    description: "RiskReviewer begins review."
    roles: [RiskReviewer]
    code: 200
    input: ["version?"]
    output: FinancingApplication
    side_effects: ["AuditLogEntry stores reviewer X-User-ID for SoD check"]
  - method: POST
    path: "/scf/financing-applications/{id}/return"
    description: "Return for revision."
    roles: [RiskReviewer]
    code: 200
    input: [revision_notes, "version?"]
    output: FinancingApplication
    side_effects: ["revision_round += 1"]
  - method: POST
    path: "/scf/financing-applications/{id}/approve"
    description: "CreditApprover approves with final amount; runs pricing."
    roles: [CreditApprover]
    code: 200
    input: [approved_amount_cents, "version?"]
    output: FinancingApplication
    side_effects: ["compute approved_apr_bps via `financing_apr_pricing`", "pin core enterprise & receivable versions"]
  - method: POST
    path: "/scf/financing-applications/{id}/reject"
    description: "CreditApprover rejects."
    roles: [CreditApprover]
    code: 200
    input: [reject_reason, "version?"]
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/scf/financing-applications/{id}"
    description: "Get an application."
    roles: [SupplierUser, RiskReviewer, CreditApprover, Funder, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/scf/financing-applications"
    description: "List applications."
    roles: [SupplierUser, RiskReviewer, CreditApprover, Funder, PlatformAdmin]
    code: 200
    input: ["supplier_id?", "status?", "mode?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []

  # ----- Disbursement -----
  - method: POST
    path: "/scf/disbursements"
    description: "Funder releases funds for an APPROVED application; transitions it to DISBURSED."
    roles: [Funder]
    code: 201
    input: [application_id, funder_account_id]
    output: Disbursement
    side_effects: ["create RepaymentSchedule via `financing_total_due`", "Receivable -> FINANCED", "credit_line bookkeeping (reserved -> consumed)", "AuditLogEntry(DISBURSE)"]
  - method: POST
    path: "/scf/disbursements/{id}/reconcile"
    description: "Mark funder reconciliation complete."
    roles: [Funder]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["reconciled_at = now()"]
  - method: GET
    path: "/scf/disbursements/{id}"
    description: "Get a disbursement."
    roles: [Funder, CreditApprover, PlatformAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  # ----- Repayment Schedules -----
  - method: GET
    path: "/scf/repayment-schedules/{id}"
    description: "Get a repayment schedule."
    roles: [Funder, SupplierUser, CoreEnterpriseUser, CollectionManager, PlatformAdmin]
    code: 200
    input: []
    output: RepaymentSchedule
    side_effects: []
  - method: POST
    path: "/scf/repayment-schedules/{id}/repay"
    description: "Record a repayment (partial or full). early_settle=true requests rebate."
    roles: [CoreEnterpriseUser, SupplierUser, PlatformAdmin]
    code: 200
    input: [repay_amount_cents, "partial?", "early_settle?"]
    output: RepaymentSchedule
    side_effects: ["paid_cents += amount; cascade if SETTLED"]

  # ----- Collection -----
  - method: POST
    path: "/scf/collection-cases/{id}/remind"
    description: "Send a soft reminder."
    roles: [CollectionManager]
    code: 200
    input: []
    output: CollectionCase
    side_effects: ["reminder_count += 1"]
  - method: POST
    path: "/scf/collection-cases/{id}/escalate"
    description: "Move SOFT -> HARD."
    roles: [CollectionManager]
    code: 200
    input: []
    output: CollectionCase
    side_effects: []
  - method: POST
    path: "/scf/collection-cases/{id}/invoke-joint-liability"
    description: "Activate joint-liability against core enterprise."
    roles: [CollectionManager]
    code: 200
    input: []
    output: CollectionCase
    side_effects: ["ERP_SYNC"]
  - method: POST
    path: "/scf/collection-cases/{id}/legal"
    description: "Escalate to legal action."
    roles: [CollectionManager]
    code: 200
    input: []
    output: CollectionCase
    side_effects: []
  - method: POST
    path: "/scf/collection-cases/{id}/write-off"
    description: "Bad-debt write-off."
    roles: [CollectionManager]
    code: 200
    input: [write_off_reason]
    output: CollectionCase
    side_effects: ["RepaymentSchedule -> WRITTEN_OFF; Receivable -> WRITTEN_OFF; AuditLogEntry(WRITE_OFF)"]
  - method: GET
    path: "/scf/collection-cases/{id}"
    description: "Get a collection case."
    roles: [CollectionManager, PlatformAdmin]
    code: 200
    input: []
    output: CollectionCase
    side_effects: []

  # ----- Audit -----
  - method: GET
    path: "/scf/audit-logs"
    description: "Read audit log entries (filterable)."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["entity_type?", "entity_id?", "action?", "since?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

  # ----- Test-driving endpoints (clock + sweep + event emit) -----
  - method: POST
    path: "/scf/_clock/advance"
    description: "Advance the test clock to a specific ISO8601 instant. Triggers any time-gated transitions."
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: null
    side_effects: ["overdue sweep evaluated; aging buckets refreshed; OVERDUE transitions opened"]
  - method: POST
    path: "/scf/_sweep/run"
    description: "Run the overdue/aging sweep immediately (idempotent for the current clock)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["see overdue_penalty_aging; OVERDUE state opening"]
  - method: POST
    path: "/scf/_events/emit"
    description: "Inject an external event (bank/erp/registry) for synchronization testing."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type, payload]
    output: null
    side_effects: ["ERP_SYNC, REGISTRY_SYNC, BANK_RECONCILE may be invoked"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - id: ERR_AUTH_HEADER_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_AUTH_ROLE_UNKNOWN
    http: 401
    condition: "X-User-Role is not in the declared role set"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted to call this endpoint"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "Acting entity-backed role does not own the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver X-User-ID equals the start-review actor for the same application"

  # Existence
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id not found"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "Referenced foreign key id not found"

  # State / OCC
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state from which this transition is not permitted"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied version does not match current version (OCC)"
  - id: ERR_PIN_STALE
    http: 409
    condition: "pinned_core_enterprise_version or pinned_receivable_version on a FinancingApplication no longer matches"
  - id: ERR_CORE_ENTERPRISE_NOT_APPROVED
    http: 409
    condition: "Core enterprise onboarding_status is not APPROVED at the moment of the operation"
  - id: ERR_CORE_ENTERPRISE_SUSPENDED
    http: 409
    condition: "Core enterprise onboarding_status == SUSPENDED at disbursement release"
  - id: ERR_CONFIRMATION_FROZEN_BY_FINANCING
    http: 422
    condition: "Attempted to revoke a confirmation whose receivable is FINANCED"

  # Business — safety / compliance
  - id: ERR_KYC_EXPIRED_OR_FAILED
    http: 422
    condition: "Supplier KYC status is not PASSED or has expired beyond KYC_VALIDITY_DAYS"
  - id: ERR_SUPPLIER_BLACKLISTED
    http: 422
    condition: "Supplier.status == BLACKLISTED"
  - id: ERR_ON_SITE_REQUIRED
    http: 422
    condition: "Verification finalize attempted as PASS while on_site_required and on_site_completed == false"
  - id: ERR_DOUBLE_FINANCING
    http: 409
    condition: "Another Receivable already references this PayableConfirmation"
  - id: ERR_FRAUD_RISK_THRESHOLD
    http: 422
    condition: "Supplier.aml_risk_score >= FRAUD_RISK_THRESHOLD at approve time"

  # Business — referential / constraint
  - id: ERR_TIER_PARENT_NOT_CONFIRMED
    http: 422
    condition: "Tier >= 2 confirmation requires upstream parent confirmation in CONFIRMED or SETTLED"
  - id: ERR_TIER_TOO_DEEP
    http: 422
    condition: "Supplier.tier_to_core exceeds MAX_EXTENSION_TIER"
  - id: ERR_CENTRAL_REGISTRY_FILING_REQUIRED
    http: 422
    condition: "Receivable above threshold attempted to pledge/transfer without a central_registry_filing_no"
  - id: ERR_MAX_REVISIONS_EXCEEDED
    http: 422
    condition: "FinancingApplication.revision_round has reached MAX_REVISION_ROUNDS"
  - id: ERR_PREPAYMENT_LIMIT_REACHED
    http: 422
    condition: "RepaymentSchedule.prepayment_count has reached MAX_PARTIAL_PREPAYMENTS"
  - id: ERR_RECEIVABLE_ALREADY_FINANCED
    http: 409
    condition: "A non-terminal FinancingApplication already references the same receivable"

  # Business — fiscal
  - id: ERR_AMOUNT_NON_POSITIVE
    http: 422
    condition: "Amount field is not strictly positive"
  - id: ERR_CREDIT_LINE_INSUFFICIENT
    http: 409
    condition: "Core-enterprise available credit line less than required amount"
  - id: ERR_APPROVED_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "approved_amount_cents exceeds requested_amount_cents or Receivable.amount_cents"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Repay amount would push paid_cents beyond total_due_cents"
  - id: ERR_APR_OUT_OF_RANGE
    http: 422
    condition: "Computed approved_apr_bps falls outside [APR_FLOOR_BPS, APR_CEILING_BPS] after clamp logic"

  # Business — temporal
  - id: ERR_DUE_DATE_OUT_OF_RANGE
    http: 422
    condition: "PayableConfirmation.due_date is not strictly in the future or exceeds MAX_DUE_DATE_DAYS"
  - id: ERR_TERM_MISMATCH
    http: 422
    condition: "FinancingApplication.term_days does not match (Receivable.due_date - now()) within tolerance"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoreEnterpriseUser
    description: "Acts on behalf of a CoreEnterprise: uploads payable list, confirms, revokes."
    identity: "entity_backed:CoreEnterprise"
    exclusive_operations:
      - "POST /scf/payable-confirmations"
      - "POST /scf/payable-confirmations/{id}/confirm"
      - "POST /scf/payable-confirmations/{id}/revoke"
    shared_operations:
      - "GET /scf/payable-confirmations*"
      - "GET /scf/repayment-schedules/{id}"
      - "POST /scf/repayment-schedules/{id}/repay (on-due-date deduction from core enterprise account)"

  - name: SupplierUser
    description: "Acts on behalf of a Supplier: registers receivables, drafts/submits financing applications, pledges/transfers receivables."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /scf/receivables"
      - "POST /scf/receivables/{id}/pledge"
      - "POST /scf/receivables/{id}/transfer"
      - "POST /scf/financing-applications"
      - "POST /scf/financing-applications/{id}/submit"
    shared_operations:
      - "GET /scf/receivables*"
      - "GET /scf/financing-applications*"
      - "POST /scf/repayment-schedules/{id}/repay (early-settle, partial prepay)"

  - name: CreditOfficer
    description: "Onboards and approves CoreEnterprises and sets credit lines."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/core-enterprises"
      - "POST /scf/core-enterprises/{id}/approve"
      - "POST /scf/core-enterprises/{id}/reject"
    shared_operations:
      - "GET /scf/core-enterprises/{id}"

  - name: ComplianceOfficer
    description: "Runs KYC/AML on suppliers; suspends/reinstates core enterprises; reads audit logs."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/suppliers/{id}/kyc"
      - "POST /scf/core-enterprises/{id}/suspend"
      - "POST /scf/core-enterprises/{id}/reinstate"
    shared_operations:
      - "GET /scf/audit-logs"
      - "GET /scf/core-enterprises/{id}"

  - name: RiskReviewer
    description: "Reviews trade background and starts/returns review on financing applications. Cannot approve or reject."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/verifications"
      - "POST /scf/verifications/{id}/on-site"
      - "POST /scf/verifications/{id}/finalize"
      - "POST /scf/financing-applications/{id}/start-review"
      - "POST /scf/financing-applications/{id}/return"
    shared_operations:
      - "GET /scf/financing-applications*"
      - "GET /scf/receivables*"

  - name: CreditApprover
    description: "Approves or rejects financing applications after risk review; must NOT be the same user as the reviewer (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/financing-applications/{id}/approve"
      - "POST /scf/financing-applications/{id}/reject"
    shared_operations:
      - "GET /scf/financing-applications*"
      - "GET /scf/core-enterprises/{id}"

  - name: Funder
    description: "Releases funds and reconciles."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/disbursements"
      - "POST /scf/disbursements/{id}/reconcile"
    shared_operations:
      - "GET /scf/disbursements/{id}"
      - "GET /scf/repayment-schedules/{id}"
      - "GET /scf/financing-applications*"

  - name: CollectionManager
    description: "Handles overdue/aging cases: reminder, escalation, joint-liability invocation, legal, write-off."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/collection-cases/{id}/remind"
      - "POST /scf/collection-cases/{id}/escalate"
      - "POST /scf/collection-cases/{id}/invoke-joint-liability"
      - "POST /scf/collection-cases/{id}/legal"
      - "POST /scf/collection-cases/{id}/write-off"
    shared_operations:
      - "GET /scf/collection-cases/{id}"
      - "GET /scf/repayment-schedules/{id}"

  - name: PlatformAdmin
    description: "Operational super-role: supplier onboarding, central-registry filing, clock/sweep/event emission, audit-log read."
    identity: "opaque"
    exclusive_operations:
      - "POST /scf/suppliers"
      - "POST /scf/receivables/{id}/central-registry-file"
      - "POST /scf/_clock/advance"
      - "POST /scf/_sweep/run"
      - "POST /scf/_events/emit"
    shared_operations:
      - "GET /scf/audit-logs"
      - "GET on every resource (read-everywhere)"
