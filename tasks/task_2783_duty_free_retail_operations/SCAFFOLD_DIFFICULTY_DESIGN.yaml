        distinguishing_aspect: |
          Endpoint POST /products/{product_id}/list depends on the parent Brand's lifecycle rather
          than on the Product's own: the Product stays legitimately PENDING and passes every
          product-level check, yet listing is refused with 409 ERR_BRAND_SUSPENDED after the Brand
