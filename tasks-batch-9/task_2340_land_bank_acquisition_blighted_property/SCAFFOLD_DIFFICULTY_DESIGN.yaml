              captures: { app_w_id: $.data.id }
            - call: "POST /land-bank/disposition-applications/${app_w_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /land-bank/disposition-applications/${app_w_id}/screen"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/disposition-applications/${app_w_id}/recommend"
              payload: { recommendation_memo: "Meets RFP scoring; developer in good standing" }
              as: DispositionOfficer
              as_user_id: "disp-2"
            - call: "POST /land-bank/disposition-applications/${app_w_id}/board-decision"
              payload: { decision: "APPROVE", resolution_no: "R-2026-031" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/disposition-applications"
              payload: { property_id: "${px_id}", applicant_id: "${appl_b_id}", program: "DEVELOPER_RFP", proposed_use: "Six-unit infill townhomes", offer_price_cents: 3600000 }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { app_x_id: $.data.id }
            - call: "POST /land-bank/disposition-applications/${app_x_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_b_id}"
            - call: "POST /land-bank/disposition-applications/${app_x_id}/screen"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
            - call: "POST /land-bank/disposition-applications/${app_x_id}/recommend"
              payload: { recommendation_memo: "Meets RFP scoring; developer in good standing" }
              as: DispositionOfficer
              as_user_id: "disp-2"
            - call: "POST /land-bank/disposition-applications/${app_x_id}/board-decision"
              payload: { decision: "APPROVE", resolution_no: "R-2026-032" }
              as: BoardClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /land-bank/development-agreements"
              payload: { application_id: "${app_w_id}", performance_deadline: "2027-08-01T00:00:00Z", milestone_count: 3, reverter_clause_active: true, abatement_years: 5, discharge_mode: "STATUTORY", projected_improved_value_cents: 15000000 }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { agr_w_id: $.data.id }
            - call: "POST /land-bank/development-agreements"
              payload: { application_id: "${app_x_id}", performance_deadline: "2027-08-01T00:00:00Z", milestone_count: 3, reverter_clause_active: true, abatement_years: 5, discharge_mode: "NEGOTIATED", projected_improved_value_cents: 15000000 }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { agr_x_id: $.data.id }
          assert:
            - "DevelopmentAgreement.${agr_w_id}.sale_price_cents == 3600000 and DevelopmentAgreement.${agr_x_id}.sale_price_cents == 3600000"
            - "DevelopmentAgreement.${agr_w_id}.discharged_tax_cents == 2000000  # STATUTORY: the whole frozen pre-acquisition delinquency"
            - "DevelopmentAgreement.${agr_x_id}.discharged_tax_cents == 1440000  # NEGOTIATED: round_half_up(0.40 * 3600000)"
            - "DevelopmentAgreement.${agr_w_id}.abatement_annual_cents == 213000  # round_half_up(0.0142 * 15000000)"
            - "DevelopmentAgreement.${agr_x_id}.abatement_annual_cents == 56800   # round_half_up(0.0142 * 4000000)"
            - "DevelopmentAgreement.${agr_w_id}.abatement_total_cents == 1065000 and DevelopmentAgreement.${agr_x_id}.abatement_total_cents == 284000"
            - "Property.${pw_id}.pre_acquisition_delinquency_cents == 2000000 and Property.${px_id}.pre_acquisition_delinquency_cents == 2000000  # identical inputs, divergent variant outputs"
            - "Property.${pw_id}.custody_status == CONVEYED and Property.${px_id}.custody_status == CONVEYED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: demolition_estimate_two_stage_pinned_rounding
        grounds:
          - calculations.maintenance_order_estimate
          - entities.MaintenanceOrder.fields.estimated_cost_cents
          - entities.FundingSource.fields.committed_cents
          - validations[priority=98]
        distinguishing_aspect: |
          Mode (b) multi-stage rounding: the line items (per-sqft demolition and the 18% asbestos
          surcharge) are each rounded to whole cents BEFORE the 6.5% county overhead is applied to
          their sum and rounded again, so on a 7778 sqft grade-F parcel the estimate is exactly
          1799890 cents, one cent below the 1799891 that summing at full precision and rounding
          once at the end would produce.
        test_recipe:
          setup:
            - "One ACTIVE funding source with restriction ANY, authorized 5000000 cents (reserve floor 250000)."
            - "One parcel of exactly 7778 sqft, grade F (asbestos grade), structure present, acquired by donation with a zero title-search fee so the source has disbursed nothing."
            - "One non-debarred contractor whose specialties include DEMOLITION and whose licence runs to 2027-12-31."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Demolition Block Grant", source_type: "GRANT", authorized_cents: 5000000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-100020", address: "20 Cedar Rd", situs_ward: 4, lot_area_sqft: 7778, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "F", vacancy_months: 6 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 0, donor_name: "Cedar Road Estate" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-041" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4412-PG-10" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/contractors"
              payload: { name: "Ironclad Demolition", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["DEMOLITION", "SECURE"], debarred: false }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "DEMOLITION", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { mo_id: $.data.id, est: $.data.estimated_cost_cents }
          assert:
            - "MaintenanceOrder.${mo_id}.estimated_cost_cents == 1799890  # lines 950000 + 482236 + 257802 = subtotal 1690038; overhead round_half_up(0.065 * 1690038) = 109852"
            - "MaintenanceOrder.${mo_id}.estimated_cost_cents != 1799891  # the value a single final rounding would produce"
            - "MaintenanceOrder.${mo_id}.status == SCHEDULED"
            - "FundingSource.${fs_id}.committed_cents == 1799890"
            - "FundingSource.${fs_id}.available_cents == 3200110 and FundingSource.${fs_id}.status == ACTIVE"

      - name: demolition_run_admin_fee_circular_dependency_pinned
        grounds:
          - calculations.demolition_run_allocation
          - calculations.maintenance_order_estimate
          - entities.DemolitionRun.fields.provisional_cap_cents
          - entities.DemolitionRun.fields.admin_fee_cents
          - entities.DemolitionRun.fields.skipped_property_ids
        distinguishing_aspect: |
          Mode (c) circular dependency broken by a pinned evaluation order: the 7.5% administrative
          fee is a function of the committed subtotal, yet the subtotal must fit inside the budget
          net of that fee, so the run first floors the provisional cap at floor(5000000 / 1.075) =
          4651162, allocates against that cap in score order with skip-over, and only then computes
          admin_fee_cents = round_half_up(0.075 * 3759961) = 281997 - a different mode from the
          two-stage rounding instance, which has no self-referential term at all.
        test_recipe:
          setup:
            - "One ACQUISITION_ONLY source funds the three acquisitions; one separate DEMOLITION_ONLY source authorized 5000000 cents funds the run."
            - "Three ACQUIRED, CLEAR-title parcels with structures: P1 grade F 3000 sqft score 47.0 (demo estimate 1427611), P2 grade D 10000 sqft score 46.0 (estimate 1973019), P3 grade C 20000 sqft score 54.0 (estimate 2332350)."
            - "The logical clock stays at the default 2026-08-01T00:00:00Z, so every holding term is 0 and the scores above are exact."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Acquisition Line", source_type: "GENERAL_FUND", authorized_cents: 1000000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_acq_id: $.data.id }
            - call: "POST /land-bank/funding-sources"
