            - call: "POST /screening/specimens/${s_id}/process"
              payload: {}
              as: LabTechnician
            - call: "POST /screening/specimens/${s_id}/adequacy"
              payload: { adequacy: "ADEQUATE" }
              as: LabTechnician
          trigger:
            - call: "POST /screening/specimens/${s_id}/result"
              payload: { outcome: "NEGATIVE" }
              as: LabTechnician
          assert:
            - "ScreeningOrder.${o_id}.status == RESULTED (hop 1)"
            - "ScreeningOrder.${o_id}.quality_outcome == ADHERENT_NEGATIVE (hop 1 field)"
            - "MemberCohort.${c_id}.status == SCREENED (hop 2: caused by hop 1)"
            - "HealthPlanProgram.${g_id}.adherent_count == 1 (hop 3: caused by hop 2's SCREENED transition)"
            - "HealthPlanProgram.${g_id}.attributed_count == 1"

      - name: abandonment_cascade_depth2
        grounds:
          - state_machines.ScreeningOrder.KIT_SHIPPED_to_ABANDONED
          - state_machines.ScreeningKit.SHIPPED_to_EXPIRED_STABILIZATION
          - state_machines.Reminder.SCHEDULED_to_SKIPPED
        distinguishing_aspect: |
          Depth-2 chain originating from a different trigger (the logical-clock
          auto-transition, not a lab POST): the order's KIT_SHIPPED->ABANDONED
          mutation itself flips the active kit to EXPIRED_STABILIZATION and
          flips every still-SCHEDULED Reminder of that order to SKIPPED — two
          second-hop mutations caused by the order transition, each verifiable
          on its own entity.
        test_recipe:
          setup:
            - "Order shipped on 2026-09-01 with 3 SCHEDULED reminders; never returned"
            - "Clock advanced to 2026-10-16 (== shipped + 45 days == abandonment_due_at)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ab-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567896", display_name: "Dr G", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
          assert:
            - "ScreeningOrder.${o_id}.status == ABANDONED (hop 0 trigger fired at date == abandonment_due_at)"
            - "ScreeningKit.${k_id}.status == EXPIRED_STABILIZATION (hop 1 caused by order abandonment)"
            - "all 3 Reminder rows for order ${o_id} have status == SKIPPED (hop 1 caused by order abandonment)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_eligibility_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_PATIENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair: state (priority 4) vs business_safety (priority 6). An order
          already in ELIGIBLE state AND whose patient has since OPTED_OUT
          violates both rules; the state error wins because priority 4 <
          priority 6.
        test_recipe:
          setup:
            - "Order O confirmed ELIGIBLE while patient ACTIVE; patient then opted out (status OPTED_OUT)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-pri-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567897", display_name: "Dr H", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/patients/${p_id}/opt-out"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_INVALID_STATE (not ERR_PATIENT_NOT_ACTIVE)"
            - "http status == 409"

      - name: business_temporal_vs_business_constraint_on_process
        grounds:
          - validations[priority=13]
          - validations[priority=15]
          - errors[ERR_STABILIZATION_EXPIRED]
          - errors[ERR_RECOLLECTION_LIMIT_REACHED]
        distinguishing_aspect: |
          Pair: business_temporal (priority 13, stabilization window) vs
          business_constraint (priority 15, recollection limit) on a different
          endpoint than instance 1. A specimen whose kit's stabilization window
          has expired on an order that has ALSO exhausted recollections still
          reports ERR_STABILIZATION_EXPIRED first when processing is attempted,
          because temporal (13) precedes constraint (15).
        test_recipe:
          setup:
            - "Order O exhausted both recollections (recollection_round == 2) and was re-kitted via recollection path is impossible; instead: order with recollection_round == 2 must reach IN_LAB again — not permitted, so this instance uses a kit returned with clock pushed past returned_at + 72h on an order whose recollection_round is already 2 via two prior INADEQUATE cycles followed by a third kit created when round was 1"
            - "Concretely: round 1 inadequate, replacement kit, round 2 inadequate at ACCESSIONED stage, replacement kit created while round == 2 is NOT allowed — replacement allowed only when round < 2 at inadequacy time; so setup uses: 1 inadequate cycle (round=1), replacement kit shipped+returned, clock pushed +73h past return, then process attempt"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-pri-2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567898", display_name: "Dr I", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k1_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /screening/specimens/${s1_id}/adequacy"
              payload: { adequacy: "INADEQUATE" }
              as: LabTechnician
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
              captures: { o_v2: $.data.version }
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v2}" }
              as: FulfillmentAgent
              captures: { k2_id: $.data.id }
            - call: "POST /screening/kits/${k2_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k2_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s2_id: $.data.id }
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:01:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/specimens/${s2_id}/process"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STABILIZATION_EXPIRED (temporal check precedes any adequacy/constraint evaluation)"
            - "http status == 422"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: stabilization_strict_less_than_at_exact_expiry
        grounds:
          - calculations.stabilization_window_check
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: stabilization hours on the process endpoint. The window is
          strict less-than: a processing start at exactly
          returned_at + 72h is REJECTED, while one second before is accepted.
        test_recipe:
          setup:
            - "Order O1: kit returned 2026-09-01T00:00:00Z; clock at exactly 2026-09-04T00:00:00Z (expiry instant)"
            - "Order O2 (second patient): kit returned 2026-09-01T00:00:00Z; clock at 2026-09-03T23:59:59Z (one second before expiry)"
