          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE PRINT_DIGITAL plan (intro 999 for cycle 1, standard 1899 from cycle 2, print_component_cents 900, 4 deliveries per cycle, SUN delivery) and an ACTIVE subscription with the cycle-1 invoice of 999 PAID."
            - "One SCHEDULED VACATION_DELIVERY hold over the closed interval 2026-09-06..2026-09-30 (25 days, four Sunday deliveries -> credit 900), so vacation_days_used_365 == 25."
