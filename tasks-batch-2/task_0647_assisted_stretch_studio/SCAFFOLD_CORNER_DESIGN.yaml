            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "50m", kind: "ASSISTED_STRETCH", duration_minutes: 50, credit_cost: 2, list_price_cents: 6000 }
              as: StudioManager
              captures: { svc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Im2m", email: "im2m@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 10, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T08:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T08:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-20T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { bk: $.data.id }
            - call: "GET /credit-packs/${pack}"
              payload: {}
              as: FrontDesk
              captures: { held: $.data.held_credits, avail: $.data.available_credits }
          assert:
            - "CreditPack.${pack}.held_credits == 2"
            - "CreditPack.${pack}.available_credits == 8"
