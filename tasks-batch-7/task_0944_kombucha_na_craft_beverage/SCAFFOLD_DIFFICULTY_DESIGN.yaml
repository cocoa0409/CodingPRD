  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: vessel_occupancy_is_half_open_so_a_backdated_overlap_fails_but_an_abutting_pitch_passes
        grounds:
          - validations[priority=61]
          - state_machines.Vessel.occupy_on_pitch
          - state_machines.Vessel.free_on_transfer
          - entities.Vessel.fields.occupancy_end_at
          - errors[ERR_VESSEL_UNAVAILABLE]
        distinguishing_aspect: |
          Interval semantics: the Vessel's occupancy is a HALF-OPEN interval
          [pitched_at, occupancy_end_at). A back-dated pitch at 2026-05-08 that
          lands strictly inside the retained [2026-05-01, 2026-05-10) is
          refused, while a pitch whose pitched_at is exactly 2026-05-10 — the
          retained exclusive end — is accepted.
        test_recipe:
          setup:
            - "A 500 L vessel that carried batch B-14001 over the retained interval [2026-05-01, 2026-05-10), was freed at 2026-05-09 by complete-f2, and was then re-sanitised."
            - "Clock at 2026-05-09 for the first trigger and 2026-05-10 for the second."
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC", f2_added_sugar_g_per_l: 4, pasteurization_required: false }
