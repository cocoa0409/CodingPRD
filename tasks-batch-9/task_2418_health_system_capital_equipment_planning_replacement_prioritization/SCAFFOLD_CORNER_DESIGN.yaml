            - "Trigger step 2: R2 reads safety_driver 75.00 (adjusted 0.00, no corrective events), growth_driver 100.00, regulatory_driver 100.00 (2027-06-01 <= 2028-01-01), eos_driver 100.00 (2026-12-01 <= 2027-01-01), composite_score 91.25 and expedited true; R1 is 39.69 and not expedited"
            - "Trigger step 3: HTTP 200 with R2 status WITHDRAWN"
            - "Trigger step 4: the cycle reads scored_count 1 and expedited_count 0 — the withdrawal re-derived BOTH counters — and ${cv_after_withdraw} is one greater than the version returned by the score"
            - "Trigger step 5: HTTP 200 with status ALLOCATED, allocation_count 1, distributable_cents 500000000, unallocated_cents 0, exhausted_allocation_count 0; the single allocation row is NRH with allocated_cents 500000000"
            - "Trigger step 6: exactly 1 row (R1) — a WITHDRAWN request is not eligible capital demand"

      - name: the_derate_floor_is_crossed_cumulatively_and_reset_by_a_life_correction
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.asset_ruls_score
          - endpoints[POST /capital/assets/{id}/service-events]
          - endpoints[PATCH /capital/assets/{id}]
        distinguishing_aspect: >-
          The 15.00 derate floor is a CUMULATIVE threshold with an inclusive bar: three correctives plus
          one hour of downtime land at 15.50 and the asset stays IN_SERVICE, a PM event contributing only
          downtime pushes it to exactly 15.00 and flips it to DERATED, and correcting the expected life
          lifts the same asset back out of derate — the curve is recomputed, not latched.
        test_recipe:
          setup:
            - "Asset AC at NRH/DEPT-A1: install 2020-08-02, expected_life_years 8, oem 2029-06-01, clock 2026-08-01 -> age 6.00, nominal 25.00, adjusted 25.00, IN_SERVICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
          trigger:
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-07-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-07-05T00:00:00Z", category: "CORRECTIVE", downtime_hours: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-07-10T00:00:00Z", category: "CORRECTIVE", downtime_hours: 1.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/assets/${asset_ac_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_ac_id}/service-events"
              payload: { event_date: "2026-07-15T00:00:00Z", category: "PM", downtime_hours: 1.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/assets?department_id=${dept_a1_id}&status=DERATED"
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "PATCH /capital/assets/${asset_ac_id}"
              payload: { expected_life_years: 10 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/assets?department_id=${dept_a1_id}&status=DERATED"
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "Trigger step 1: the asset reads corrective_count_24m 1, downtime_hours_24m 0.00, service_penalty_points 3.00, adjusted_ruls_score 22.00, status IN_SERVICE"
            - "Trigger step 2: corrective_count_24m 2, service_penalty_points 6.00, adjusted_ruls_score 19.00, status IN_SERVICE"
            - "Trigger step 3: corrective_count_24m 3, downtime_hours_24m 1.00, service_penalty_points 9.50, adjusted_ruls_score 15.50, status IN_SERVICE — 0.50 above the floor"
            - "Trigger step 4: nominal_ruls_score is still 25.00 while adjusted is 15.50 — the penalties never touch the nominal variant"
            - "Trigger step 5: the PM event adds downtime but no corrective: corrective_count_24m stays 3, downtime_hours_24m 2.00, service_penalty_points 10.00, adjusted_ruls_score exactly 15.00, status DERATED (the bar is <=)"
            - "Trigger step 6: exactly 1 row — the derated asset"
            - "Trigger step 7: HTTP 200 with expected_life_years 10, age_years 6.00, nominal_ruls_score 40.00, service_penalty_points still 10.00 and adjusted_ruls_score 30.00, status back to IN_SERVICE"
            - "Trigger step 8: 0 rows — the derate flag is re-derived on every write, never latched"

      - name: dual_variant_nominal_and_adjusted_ruls
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: asset_nominal_vs_adjusted_ruls_diverge_on_same_asset
          rationale: "The named §1.8 instance stores both variants for one asset and asserts the delta and which variant each downstream reader uses."

      - name: dual_variant_budgetary_and_negotiated_tco
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: tco_budgetary_vs_negotiated_diverge_on_funded_request
          rationale: "The named §1.8 instance computes both TCO variants on one request and asserts the reconciliation when the negotiated variant becomes authoritative."

      - name: dual_variant_pro_rata_and_rank_ordered_allocation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: allocation_pro_rata_vs_rank_ordered_diverge_on_same_score_set
          rationale: "The named §1.8 instance runs both allocation variants over one score set and asserts the per-facility divergence."

      - name: cascading_side_effects_four_levels_deep_on_fund
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: fund_request_cascades_allocation_cycle_and_sibling_deferral
          rationale: "The named §1.8 instance walks the depth-4 chain request -> allocation posture -> cycle status -> sibling deferral in one call."

      - name: cascading_side_effects_from_a_service_event_append
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: service_event_cascades_asset_derate_and_request_rescore
          rationale: "The named §1.8 instance asserts the asset derate and the dependent request re-score triggered by one appended event."

      - name: optimistic_concurrency_on_the_request_version_at_vote
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[vote-create-stale-request]
        excluded_because:
          difficulty_instance: existence_beats_stale_version_on_vote
          rationale: "The named §1.8 instance covers the second concurrency_rules entry: 412 on a stale expected_request_version, success on the current one."

      - name: rate_threshold_expedite_bar_at_eighty_five
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: expedite_flag_at_exactly_eighty_five_on_score
          rationale: "The named §1.8 instance pins the composite at 85.00 and 84.99 across the inclusive expedite bar."

      - name: rate_threshold_eligibility_bar_at_thirty
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: ruls_eligibility_at_exactly_thirty_on_submit
          rationale: "The named §1.8 instance pins adjusted RULS at 30.00 and 30.01 across the inclusive eligibility bar."

      - name: compensation_reverses_every_side_effect_of_fund
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: fund_then_withdraw_funding_conserves_allocation_capital
          rationale: "The named §1.8 instance asserts the round-trip conservation of allocation capital and the reversal of each cascade hop."

  # =========================================================================
  # 9. From Consistency Model — declared: immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: the_fund_response_is_already_the_post_cascade_state_for_every_touched_row
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /capital/requests/{id}/fund]
        distinguishing_aspect: >-
          Nothing is deferred to a background pass: the fund RESPONSE itself must already carry status
          FUNDED and funded_amount_cents 100000000 (not the pre-write APPROVED / 0), and the three other
          rows the call touches read post-cascade on the very next request with no retry, no sleep and no
          re-read loop. Equally, the parts of the cascade whose condition is unmet must NOT fire: capital
          remains, so the posture stays ACTIVE and no sibling is deferred.
        test_recipe:
          setup:
            - "Fixture F1: F0 driven to APPROVED by a single CHAIR member of weight 3 over an ALLOCATED cycle of 500000000 allocated entirely to NRH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "CT replacement, ageing detector array.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500 }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /capital/requests/${r_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "POST /capital/requests/${r_id}/screen"
              payload: { decision: "ACCEPT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c_id}/score"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { cv_scored: $.data.version }
            - call: "POST /capital/cycles/${c_id}/allocate"
              payload: { allocation_method: "RANK_ORDERED", expected_cycle_version: "${cv_scored}" }
              as: CapitalPlanner
              as_user_id: "planner-alloc"
            - call: "POST /capital/committee-members"
              payload: { full_name: "Dana Okafor", seat: "CHAIR", voting_weight: 3 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { m_chair_id: $.data.id }
            - call: "GET /capital/requests/${r_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { rv_scored: $.data.version }
            - call: "POST /capital/requests/${r_id}/votes"
              payload: { vote: "APPROVE", expected_request_version: "${rv_scored}" }
              as: CommitteeMember
              as_user_id: "${m_chair_id}"
            - call: "POST /capital/requests/${r_id}/committee-decision"
              payload: {}
              as: CommitteeMember
              as_user_id: "${m_chair_id}"
          trigger:
            - call: "POST /capital/requests/${r_id}/fund"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-fund"
            - call: "GET /capital/requests/${r_id}"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /capital/allocations?cycle_id=${c_id}"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /capital/cycles/${c_id}"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /capital/assets/${asset_ac_id}"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "Trigger step 1: the fund response body already reads status FUNDED and funded_amount_cents 100000000 — the pre-write APPROVED / 0 is never observable"
            - "Trigger step 2: the same values on an independent read by a different role, with no intervening write"
            - "Trigger step 3: 1 ACTIVE FacilityAllocation with allocated_cents 500000000, committed_cents 100000000, available_cents 400000000 and posture ACTIVE at version 2 — the posture does NOT flip to EXHAUSTED because capital remains"
            - "Trigger step 4: the cycle is still ALLOCATED with exhausted_allocation_count 0 and allocation_count 1 — the depth-3 and depth-4 hops correctly do not fire"
            - "Trigger step 5: asset AC is REPLACEMENT_PENDING at version 2 with adjusted_ruls_score still 25.00 — the cascade changed the status without re-running the score"

      - name: no_denormalised_field_lags_behind_the_write_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: service_event_cascades_asset_derate_and_request_rescore
          rationale: "The named §1.8 instance reads the derived asset fields and the dependent request's composite immediately after the append, with no eventual-consistency allowance."
