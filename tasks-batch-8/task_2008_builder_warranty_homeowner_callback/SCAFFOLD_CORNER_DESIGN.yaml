              as: WarrantyManager
              captures: { home_id: $.data.id }
          trigger:
            - call: "GET /homes/${home_id}"
              as: WarrantyManager
            - call: "GET /homes/00000000-0000-0000-0000-000000000000"
              as: WarrantyManager
              captures: { err: $.data.error_id }
          assert:
            - "success body: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.id == ${home_id}"
            - "error body: response_type == error, data.error_id == ERR_HOME_NOT_FOUND, data.message present, HTTP 404"

