              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id ERR_EVALUATION_WINDOW_NOT_ENDED"
            - "the response is NOT 422 ERR_NO_INSPECTIONS_IN_WINDOW, even though that rule is also violated"
            - "EducationCampaign.${cp_id}.status == RUNNING and version == ${cp_v_running}"
            - "control: advancing the clock to exactly 2026-08-31T00:00:00Z makes the identical call return 422 ERR_NO_INSPECTIONS_IN_WINDOW, because priority 33 is satisfied at exactly end_at"

      - name: priority_ordering_type_check_precedes_foreign_key_existence
        claim_type: priority_ordering
        grounds:
          - validations.priority_6
          - validations.priority_8
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A record creation that both omits the required arrived_at and names a station_id that does not exist violates priority 6 and priority 8 together; the 400 ERR_INVALID_REQUEST wins, so a well-formed body is required before any foreign key is looked up."
        test_recipe:
