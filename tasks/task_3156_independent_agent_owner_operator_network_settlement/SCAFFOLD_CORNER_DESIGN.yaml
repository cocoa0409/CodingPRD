            - "marginal_fee_cents == 0 and cumulative_fee_cents == 0, because there is nothing to multiply"
            - "effective_per_load_fee_cents == 5000, the base rate reported when the divisor would otherwise be zero"
            - "month_start is the first instant of 2026-09 and month_end is the first instant of 2026-10, the window being half-open"

  # ===========================================================================
  - section: errors
    instances:

      - name: list_loads_without_user_context_header_returns_401
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - validations[priority=1]
        distinguishing_aspect: "The authentication gate is evaluated before anything else, so a list read with an undeclared role header returns 401 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER rather than an empty array or a 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with one posted load."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C30", legal_name: "Corner C30 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C30", shipper_name: "Corner C30 Shipping", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-C30", origin_state: "TX", destination_state: "OK", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
          trigger:
            - call: "GET /network/loads"
              payload: {  }
              as: Anonymous
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response status is 401 and err_auth == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type is error and no rows are returned"
            - "err_auth != ERR_INSUFFICIENT_PERMISSIONS, because the header itself was unusable"

      - name: agent_create_by_freight_agent_cannot_succeed
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - validations[priority=2]
          - roles[FreightAgent]
        distinguishing_aspect: "The authorization gate follows authentication, so an authenticated freight agent attempting an enrollment returns 403 ERR_INSUFFICIENT_PERMISSIONS and no Agent row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
          trigger:
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C30-X", legal_name: "Unauthorized Enrollment", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX"] }
              as: FreightAgent
              captures: { err_role: $.data.error_id }
          assert:
            - "the response status is 403 and err_role == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /network/agents returns 0 rows"
            - "err_role != ERR_UNAUTHORIZED, because the role was recognized but not permitted"

      - name: escrow_release_below_zero_is_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_ESCROW_BALANCE_INSUFFICIENT
          - validations[priority=10]
        distinguishing_aspect: "The fiscal gate refuses any ledger mutation that would drive the escrow balance below zero, so a release larger than the balance returns 402 ERR_ESCROW_BALANCE_INSUFFICIENT and leaves the balance untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO carrying a 250000 escrow deposit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C32", legal_name: "Corner C32 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
          trigger:
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_RELEASE", amount_cents: 300000, effective_at: "2026-09-01T01:00:00Z" }
              as: SettlementOperator
              captures: { err_escrow: $.data.error_id }
          assert:
            - "the response status is 402 and err_escrow == ERR_ESCROW_BALANCE_INSUFFICIENT"
            - "GET /network/capacity-owners/${bco_id} still reports escrow_balance_cents == 250000"
            - "GET /network/capacity-owners/${bco_id}/escrow-transactions returns exactly 1 row, the rejected release having created none"

      - name: duplicate_agent_code_is_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DUPLICATE_AGENT_CODE
          - entities.Agent.fields.agent_code
        distinguishing_aspect: "agent_code uniqueness is network-wide rather than tenant-scoped, so a second enrollment carrying an already-used code returns 409 ERR_DUPLICATE_AGENT_CODE even when every other attribute differs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One agent already enrolled under code AG-C33."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C33", legal_name: "Corner C33 Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v0: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {  }
              as: NetworkAdministrator
          trigger:
            - call: "POST /network/agents"
              payload: { agent_code: "AG-C33", legal_name: "Impostor Freight Agency", home_state: "OK", commission_rate_pct: 0.30, territory_codes: ["OK"] }
              as: NetworkAdministrator
              captures: { err_dup: $.data.error_id }
          assert:
            - "the response status is 409 and err_dup == ERR_DUPLICATE_AGENT_CODE"
            - "GET /network/agents returns exactly 1 row"
            - "the surviving row's commission_rate_pct is still 0.12, so the rejected call wrote nothing"

      - name: escrow_double_reverse_is_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_ESCROW_ALREADY_MATCHED
          - entities.EscrowTransaction.fields.status
        distinguishing_aspect: "The compensating pair may be applied only once: a second reversal of the same ledger entry returns 402 ERR_ESCROW_ALREADY_MATCHED and cannot inflate the balance past its starting value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO with a 250000 deposit that has already been reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-C34", legal_name: "Corner C34 Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /network/escrow-transactions/${dep_id}/reverse"
              payload: { effective_at: "2026-09-01T01:00:00Z" }
              as: SettlementOperator
