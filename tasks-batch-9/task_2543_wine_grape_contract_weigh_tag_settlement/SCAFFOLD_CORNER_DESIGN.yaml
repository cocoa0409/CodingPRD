      - name: acknowledging_exactly_at_the_ack_deadline_is_refused_409
        claim_type: Violation → Error
        grounds:
          - validations.priority_38
          - errors[ERR_ACK_WINDOW_CLOSED]
          - state_machines.PickCall.ISSUED_to_EXPIRED
        distinguishing_aspect: |
          ERR_ACK_WINDOW_CLOSED is reachable on exactly ONE instant: acknowledgement needs
          now STRICTLY BEFORE ack_deadline_at while auto-expiry needs now STRICTLY AFTER it,
          so at now == ack_deadline_at the call is still ISSUED yet no longer acknowledgeable.
          An implementation that uses <= on either side collapses the instant and returns
          either 200 or ERR_PICK_CALL_STATE_INVALID instead.
