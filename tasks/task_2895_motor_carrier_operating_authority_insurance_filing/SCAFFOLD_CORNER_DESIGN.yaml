# ============================================================================
# 1.9 Scaffold Corner Design — breadth probe for
#     tasks/task_2895_motor_carrier_operating_authority_insurance_filing
#
# Taxonomy: references/claim-extraction-guide.md. Sections and claim_type values
# are drawn verbatim from that guide's nine tables; no category is invented.
# Depth (the nine §0.5 reasoning rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corners already asserted there appear here as excluded_because stubs.
#
# Every chain below starts from an empty database, pins the logical clock with
# POST /_clock/set_current_utc (default 2026-08-01T00:00:00Z), and uses only
# endpoints declared in §1.5 of SCAFFOLD.yaml.
# ============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: carrier_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints[POST /carriers]
          - roles.RegistryAdmin
        distinguishing_aspect: "POST /carriers with all six required inputs returns 201 and a body carrying every §1.1 Carrier field, including the server-minted usdot_number and the four zeroed fee aggregates."
        test_recipe:
          setup:
            - "empty database, logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Llano Estacado Transport LLC", dba_name: "Llano Freight", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c20_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "Carrier.${c20_id}.legal_name == 'Llano Estacado Transport LLC' and dba_name == 'Llano Freight' and domicile_state == 'TX'"
            - "Carrier.${c20_id}.self_reported_vehicle_count == 25, self_reported_driver_count == 30, self_reported_oos_rate_pct == 8.0"
            - "Carrier.${c20_id}.usdot_number matches the regex ^USDOT-[0-9]{7}$"
            - "Carrier.${c20_id}.fee_balance_cents == 0, fees_assessed_total_cents == 0, fees_reversed_total_cents == 0, fees_paid_total_cents == 0"
            - "Carrier.${c20_id}.biennial_update_due_at == '2028-07-31T00:00:00.000Z' (created_at + 730 days)"
            - "the response body also carries id, created_at, updated_at and version == 1"

      - name: carrier_retrieval_returns_the_stored_record
        claim_type: retrieval
        grounds:
          - endpoints[GET /carriers/{id}]
          - entities.Carrier
        distinguishing_aspect: "GET /carriers/{id} returns byte-identical business field values to those the create call returned, with no recomputation of the fee aggregates."
        test_recipe:
          setup:
            - "one carrier created at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Guadalupe Valley Haulers LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c21_id: $.data.id, c21_usdot: $.data.usdot_number }
          trigger:
            - call: "GET /carriers/${c21_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
          assert:
            - "HTTP 200 and the returned id == ${c21_id}"
            - "the returned usdot_number == ${c21_usdot} — the number is stable, not re-minted per read"
            - "legal_name == 'Guadalupe Valley Haulers LLC', domicile_state == 'TX', unified_registration_status == 'NOT_REGISTERED', entrant_status == 'NEW_ENTRANT'"
            - "compliance_risk_score is null and compliance_risk_variant == 'NONE' — no authority has been activated yet"

      - name: authority_application_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /authority-applications]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three applications on one carrier, limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "one carrier with three DRAFT applications created in a known order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Brazos Bend Logistics LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c22_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c22_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c22_id}"
              captures: { app22a_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c22_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c22_id}"
              captures: { app22b_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c22_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c22_id}"
              captures: { app22c_id: $.data.id }
          trigger:
            - call: "GET /authority-applications"
              payload: { carrier_id: "${c22_id}", limit: 2, offset: 0 }
              as: RegistryAdmin
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /authority-applications"
              payload: { carrier_id: "${c22_id}", limit: 2, offset: 2 }
              as: RegistryAdmin
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "the first call returns HTTP 200, response_type == 'array', exactly 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "${page1_first_id} == ${app22a_id} — the list is ordered created_at ASC"
            - "the second call returns exactly 1 row, total_count == 3, offset == 2, has_more == false"
            - "${page2_first_id} == ${app22c_id}"

      - name: carrier_read_with_an_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_CARRIER_NOT_FOUND]
          - validations[priority=3]
          - endpoints[GET /carriers/{id}]
        distinguishing_aspect: "GET /carriers/{id} for an id no Carrier row carries returns ERR_CARRIER_NOT_FOUND at HTTP 404, in the declared error envelope."
        test_recipe:
          setup:
            - "one unrelated carrier exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Colorado River Cartage LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c23_id: $.data.id }
          trigger:
            - call: "GET /carriers/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: RegistryAdmin
              captures: { nf_error: $.data.error_id, nf_message: $.data.message }
          assert:
            - "HTTP 404 with response_type == 'error'"
            - "${nf_error} == 'ERR_CARRIER_NOT_FOUND' and ${nf_message} is a non-empty string"
            - "Carrier.${c23_id} is untouched: version == 1"

      - name: application_missing_a_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=7]
          - endpoints[POST /authority-applications]
        distinguishing_aspect: "Omitting transportation_type — a required input with no declared default — returns ERR_INVALID_REQUEST at HTTP 400 and creates no AuthorityApplication row."
        test_recipe:
          setup:
            - "one carrier with no applications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Pecos Divide Trucking LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c24_id: $.data.id }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c24_id}", application_kind: "NEW", requested_operating_states: ["TX"] }
              as: CarrierRep
              as_user_id: "${c24_id}"
              captures: { missing_field_error: $.data.error_id }
          assert:
            - "${missing_field_error} == 'ERR_INVALID_REQUEST' with HTTP 400"
            - "GET /authority-applications?carrier_id=${c24_id} returns total_count == 0"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Carrier.fields.dba_name
          - entities.AuthorityApplication.fields.hazmat_endorsement_requested
          - entities.ProcessAgent.fields.blanket_agent
          - entities.Shipment.fields.hazmat
        distinguishing_aspect: "Every field with a declared default takes exactly that default when omitted: dba_name null, hazmat_endorsement_requested false, hazmat_bulk_capable false, blanket_agent false, predecessor_authority_id null, passenger_seating_capacity null."
        test_recipe:
          setup:
            - "empty database, logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Devils River Freight LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c25_id: $.data.id }
            - call: "POST /process-agents"
              payload: { company_name: "Rio Grande Process Agents", coverage_states: ["TX", "OK", "NM"] }
              as: RegistryAdmin
              captures: { agent25_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c25_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"] }
              as: CarrierRep
              as_user_id: "${c25_id}"
              captures: { app25_id: $.data.id }
          assert:
            - "Carrier.${c25_id}.dba_name is null, unified_registration_status == 'NOT_REGISTERED', entrant_status == 'NEW_ENTRANT', biennial_delinquent == false, active_authority_count == 0"
            - "ProcessAgent.${agent25_id}.blanket_agent == false — the default must be false, or ERR_PROCESS_AGENT_STATE_NOT_COVERED would be unreachable"
            - "AuthorityApplication.${app25_id}.hazmat_endorsement_requested == false and hazmat_bulk_capable == false"
            - "AuthorityApplication.${app25_id}.predecessor_authority_id is null, passenger_seating_capacity is null, proposed_legal_name is null"
            - "AuthorityApplication.${app25_id}.status == 'DRAFT', submission_count == 0, filing_fee_cents == 0, filing_fee_breakdown is null"

      - name: application_required_limit_fields_are_computed_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.required_insurance_minimums
          - entities.AuthorityApplication.fields.required_bipd_limit_cents
          - entities.AuthorityApplication.fields.required_bond_limit_cents
        distinguishing_aspect: "A PROPERTY_BROKER application carries required_bipd_limit_cents == 0 and required_bond_limit_cents == 7500000 the moment it is created — the client supplies none of the three limit fields, they are derived from transportation_type."
        test_recipe:
          setup:
            - "one carrier with no applications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Trinity Bay Brokerage LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c26_id: $.data.id }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c26_id}", application_kind: "NEW", transportation_type: "PROPERTY_BROKER", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c26_id}"
              captures: { app26_id: $.data.id }
          assert:
            - "AuthorityApplication.${app26_id}.required_bipd_limit_cents == 0 — the PROPERTY_BROKER branch sets base 0 and the multistate uplift is applied only when base > 0"
            - "AuthorityApplication.${app26_id}.required_cargo_limit_cents == 0"
            - "AuthorityApplication.${app26_id}.required_bond_limit_cents == 7500000"
            - "the three limit fields are absent from POST /authority-applications' input schema, so no client value could have produced them"

      - name: system_minted_identifiers_follow_the_declared_format_and_creation_order
        claim_type: system_fields
        grounds:
          - entities.Carrier.fields.usdot_number
          - entities.OperatingAuthority.fields.docket_number
        distinguishing_aspect: "usdot_number and docket_number are server-minted, unique, format-conformant and monotonically increasing in creation order; neither appears in any §1.5 input schema."
        test_recipe:
          setup:
            - "two carriers created in a known order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Angelina Pines Transport LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c27a_id: $.data.id, c27a_usdot: $.data.usdot_number }
            - call: "POST /carriers"
              payload: { legal_name: "Neches Bottom Carriers LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c27b_id: $.data.id, c27b_usdot: $.data.usdot_number }
          assert:
            - "both ${c27a_usdot} and ${c27b_usdot} match ^USDOT-[0-9]{7}$"
            - "${c27a_usdot} != ${c27b_usdot}, and the 7-digit suffix of ${c27b_usdot} is numerically greater than that of ${c27a_usdot} (assigned in creation order)"
            - "${c27a_id} != ${c27b_id} and neither id was supplied by the client"
            - "both carriers carry version == 1 and created_at == '2026-08-01T00:00:00.000Z' from the logical clock, not wall-clock time"

      - name: invalid_enum_and_out_of_range_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=7]
          - entities.Carrier.fields.domicile_state
          - entities.Carrier.fields.self_reported_vehicle_count
        distinguishing_aspect: "An out-of-set state code, a vehicle count below the declared minimum of 1, and an out-of-range percentage each return ERR_INVALID_REQUEST at HTTP 400, and no Carrier row is written by any of them."
        test_recipe:
          setup:
            - "empty database, logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /carriers"
              payload: { legal_name: "Bad Enum Freight LLC", domicile_state: "ZZ", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { bad_enum_error: $.data.error_id }
            - call: "POST /carriers"
              payload: { legal_name: "Zero Fleet Freight LLC", domicile_state: "TX", self_reported_vehicle_count: 0, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { bad_range_error: $.data.error_id }
            - call: "POST /carriers"
              payload: { legal_name: "Over Rate Freight LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 150.0 }
              as: RegistryAdmin
              captures: { bad_pct_error: $.data.error_id }
          assert:
            - "${bad_enum_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — 'ZZ' is outside the declared 51-code set"
            - "${bad_range_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — self_reported_vehicle_count declares >= 1"
            - "${bad_pct_error} == 'ERR_INVALID_REQUEST' with HTTP 400 — self_reported_oos_rate_pct declares 0.0..100.0"
            - "no Carrier row exists with legal_name 'Bad Enum Freight LLC', 'Zero Fleet Freight LLC' or 'Over Rate Freight LLC'"

      - name: process_agent_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.ProcessAgent
          - entities.FeeLedgerEntry
          - endpoints[POST /process-agents]
        distinguishing_aspect: "ProcessAgent and FeeLedgerEntry declare common_fields false: their response bodies carry no version and no updated_at, and §1.5 declares no endpoint that mutates either, so no OCC guard can ever apply to them."
        test_recipe:
          setup:
            - "empty database, logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /process-agents"
              payload: { company_name: "Sabine Basin Process Agents", coverage_states: ["TX", "LA"], blanket_agent: false }
              as: RegistryAdmin
              captures: { agent28_id: $.data.id }
          assert:
            - "HTTP 201 and the response body carries id and created_at"
            - "the response body carries NO version key and NO updated_at key — ProcessAgent declares common_fields false"
            - "ProcessAgent.${agent28_id}.coverage_states == ['TX', 'LA'] exactly as submitted"
            - "no §1.5 endpoint targets /process-agents/{id} with any method, so the row can never be updated or deleted"

      - name: designation_write_against_an_unknown_authority_returns_404
        claim_type: parent_relationships
        grounds:
          - errors[ERR_AUTHORITY_NOT_FOUND]
          - validations[priority=3]
          - endpoints[POST /operating-authorities/{id}/process-agent-designations]
        distinguishing_aspect: "The path-addressed parent is resolved before any body validation: a designation write under an id no OperatingAuthority carries returns ERR_AUTHORITY_NOT_FOUND at 404, even though the body is entirely well formed."
        test_recipe:
          setup:
            - "one process agent covering TX/OK/NM and no OperatingAuthority rows at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Lavaca Bay Motor Lines LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c29_id: $.data.id }
            - call: "POST /process-agents"
              payload: { company_name: "Gulf Coast Process Agents", coverage_states: ["TX", "OK", "NM"], blanket_agent: false }
              as: RegistryAdmin
              captures: { agent29_id: $.data.id }
          trigger:
            - call: "POST /operating-authorities/00000000-0000-4000-8000-000000000777/process-agent-designations"
              payload: { process_agent_id: "${agent29_id}", state_codes: ["TX"], effective_from: "2026-08-01T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${c29_id}"
              captures: { parent_nf_error: $.data.error_id }
          assert:
            - "${parent_nf_error} == 'ERR_AUTHORITY_NOT_FOUND' with HTTP 404"
            - "GET /process-agent-designations?process_agent_id=${agent29_id} returns total_count == 0"

      - name: body_foreign_key_to_an_unknown_predecessor_is_rejected
        claim_type: flat
        grounds:
          - errors[ERR_REFERENCE_NOT_FOUND]
          - validations[priority=6]
          - entities.AuthorityApplication.fields.predecessor_authority_id
        distinguishing_aspect: "The flat topology's cross-reference integrity is enforced on body foreign keys: a NAME_CHANGE application naming a predecessor_authority_id with no matching OperatingAuthority returns ERR_REFERENCE_NOT_FOUND at 404 — not the path-scoped ERR_AUTHORITY_NOT_FOUND."
        test_recipe:
          setup:
            - "one carrier and no OperatingAuthority rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Matagorda Freight Systems LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c30_id: $.data.id }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c30_id}", application_kind: "NAME_CHANGE", transportation_type: "FOR_HIRE_PROPERTY", predecessor_authority_id: "00000000-0000-4000-8000-000000000888", requested_operating_states: ["TX"], proposed_legal_name: "Matagorda Freight Group LLC" }
              as: CarrierRep
              as_user_id: "${c30_id}"
              captures: { body_fk_error: $.data.error_id }
          assert:
            - "${body_fk_error} == 'ERR_REFERENCE_NOT_FOUND' with HTTP 404 — priority 6 owns body foreign keys, priority 3 owns path segments"
            - "GET /authority-applications?carrier_id=${c30_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: application_starts_in_draft_with_a_zero_fee
        claim_type: initial_state
        grounds:
          - state_machines.AuthorityApplication.initial_state
          - entities.AuthorityApplication.fields.status
        distinguishing_aspect: "A newly created AuthorityApplication is DRAFT with submission_count 0 and filing_fee_cents 0 — the fee is assessed by the submit transition, not by creation."
        test_recipe:
          setup:
            - "one carrier with no applications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "San Bernard Motor Freight LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c31_id: $.data.id }
          trigger:
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c31_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c31_id}"
              captures: { app31_id: $.data.id }
          assert:
            - "AuthorityApplication.${app31_id}.status == 'DRAFT' and submission_count == 0"
            - "AuthorityApplication.${app31_id}.filing_fee_cents == 0 and filing_fee_breakdown is null"
