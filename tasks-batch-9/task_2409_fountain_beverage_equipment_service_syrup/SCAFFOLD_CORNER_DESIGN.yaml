          - calculations.maintenance_due_evaluation
        distinguishing_aspect: "The same task evaluates to no breach at the 2026-08-01 clock and to OVERDUE once the clock is moved to 2026-08-09, proving the clock endpoint feeds the due-date rule and mutates no entity itself."
        test_recipe:
          setup:
            - "One SCHEDULED PREVENTIVE task with due_at 2026-08-05T00:00:00Z, evaluated once at the 2026-08-01 clock."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
