      - name: rfi_overdue_marking_is_inclusive_at_the_risk_compressed_due_at_instant
        grounds:
          - calculations.rfi_response_sla
          - validations[priority=40]
          - state_machines.InformationRequest.DRAFT_to_SENT
          - state_machines.InformationRequest.SENT_to_OVERDUE
          - calculations.unresponsive_strike_ledger
        distinguishing_aspect: |
          A different metric on a different endpoint from the monetary boundary: the temporal
          due_at comparison on POST .../overdue-marking. The SLA is 168 base hours for MEDIUM
          compressed once by RISK_COMPRESSION 0.5 because the respondent is HIGH-rated (and not
          twice - unresponsive_strikes is 0, so STRIKE_COMPRESSION does not apply, and the
          SLA_FLOOR_HOURS 12 floor is inert at 84), putting due_at at 2026-08-04T12:00:00Z. One
          second before that instant MARK_OVERDUE must be refused with ERR_RFI_NOT_YET_OVERDUE and
          write no strike; at exactly that instant it must succeed, because the comparison is
          clock >= due_at.
        test_recipe:
          setup: >
            JurisdictionProfile PA (basel_aml_index 8.0, sanctions_status PERMITTED, fatf_listing
            CALL_FOR_ACTION, secrecy_flag true, corridor_risk_weight 1.50,
            max_permitted_risk_rating HIGH) so jurisdiction_risk_points = round(8.0*2.0 + 0 + 12 + 3,
            2) = 31.00. One respondent home PA, expected_monthly_volume_usd 50000000.00,
            expected_monthly_count 400, nested_activity_permitted false, licensed
            ACTIVE/GOOD_STANDING, with a single VERIFIED natural-person owner at 80.00% resident in
            PA whose is_pep is true. All eight ControlAssessment rows carry self_rating 1, so
            control_score is round(1.0*20.0, 2) = 20.00 and control_credit is 0.0000 (the credit
            formula yields 0 at or below 20.00); inherent_risk_score is 31.00 + min(24, 10) + 0 +
            min(16, 10) = 51.00 and residual_risk_score is round(round(51.00*1.0000,2)+0.00,2) =
            51.00, which is >= 50.00 so risk_rating is HIGH - exactly the rating that arms
            RISK_COMPRESSION. The committee approves at clock 2026-08-01T00:00:00Z, then one
            InformationRequest with request_topic ACTIVITY_EXPLANATION and severity MEDIUM is raised
            and dispatched at that same instant, leaving it SENT with sla_hours 84 and due_at
            2026-08-04T12:00:00Z and the respondent's unresponsive_strikes at 0.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "PA", name: "Panama", basel_aml_index: 8.0, corridor_risk_weight: 1.50, sanctions_status: "PERMITTED", fatf_listing: "CALL_FOR_ACTION", secrecy_flag: true, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Banco Istmo Central SA", swift_bic: "ISTMPAPAXXX", home_jurisdiction_code: "PA", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 50000000.00, expected_monthly_count: 400, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { g_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${g_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "SBP" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${g_id}/beneficial-owners", payload: { owner_name: "Ricardo Ayala", owner_type: "NATURAL_PERSON", ownership_pct: 80.00, country_of_residence: "PA", is_pep: true }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { g_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${g_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${g_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { gv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${g_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${gv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${g_id}", captures: { gq_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 1 }, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${g_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${gq_id}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${g_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${g_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
            - { call: "POST /correspondent-banking/respondents/${g_id}/information-requests", payload: { request_topic: "ACTIVITY_EXPLANATION", severity: "MEDIUM" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { rfi_g: $.data.id } }
            - { call: "POST /correspondent-banking/information-requests/${rfi_g}/dispatch", payload: {}, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-04T11:59:59Z" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/information-requests/${rfi_g}/overdue-marking", payload: { action: "MARK_OVERDUE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-04T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/information-requests/${rfi_g}/overdue-marking", payload: { action: "MARK_OVERDUE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          assert:
            - "RespondentBank.${g_id}.inherent_risk_score == 51.00 and RespondentBank.${g_id}.control_score == 20.00 and RespondentBank.${g_id}.control_credit == 0.0000"
            - "RespondentBank.${g_id}.residual_risk_score == 51.00 and RespondentBank.${g_id}.risk_rating == HIGH   # 51.00 >= 50.00 and < 70.00"
            - "InformationRequest.${rfi_g}.sla_hours == 84   # 168 * 0.5 once, ceil(84.0) = 84, floor 12 inert; a double compression would give 42 and no compression 168"
            - "InformationRequest.${rfi_g}.due_at == \"2026-08-04T12:00:00Z\" and InformationRequest.${rfi_g}.dispatched_at == \"2026-08-01T00:00:00Z\""
            - "trigger call 2 HTTP status == 422 and data.error_id == ERR_RFI_NOT_YET_OVERDUE   # clock 2026-08-04T11:59:59Z is one second short"
            - "InformationRequest.${rfi_g}.state == SENT after trigger call 2 and RespondentBank.${g_id}.unresponsive_strikes == 0   # a refused marking writes no strike"
            - "trigger call 4 HTTP status == 200"
            - "InformationRequest.${rfi_g}.state == OVERDUE after trigger call 4   # clock exactly equal to due_at is overdue"
            - "RespondentBank.${g_id}.unresponsive_strikes == 1   # exactly one strike, from the successful marking only"
            - "RespondentBank.${g_id}.dd_state == APPROVED   # 1 < RESTRICTION_AT 3, so no restriction cascade"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: refresh_completion_needs_a_refresh_final_assessment_timestamped_at_or_after_started_at
        grounds:
          - state_machines.PeriodicRefresh.IN_PROGRESS_to_COMPLETED
          - state_machines.RespondentBank.dd_state.UNDER_REFRESH_to_APPROVED
          - entities.RespondentBank.fields.last_risk_assessed_at
          - calculations.control_score
          - calculations.refresh_due_date
          - validations[priority=33]
        distinguishing_aspect: |
          The PeriodicRefresh transition is gated on state that lives on a different entity - the
          RespondentBank's risk_assessment_variant and last_risk_assessed_at - and the gate is a
          timestamp comparison, not a mere flag. A REFRESH_FINAL assessment already exists here, but
          it was taken BEFORE the cycle started, so an implementation that only checks
          risk_assessment_variant == REFRESH_FINAL (or only checks that a fresh ASSESSED
          questionnaire exists, which it does) completes the cycle instead of returning
          ERR_REFRESH_NOT_REASSESSED. The re-assessment then changes the numbers, so the completion
          snapshot proves which assessment was in force.
        test_recipe:
          setup: >
            JurisdictionProfile DE (basel_aml_index 4.0, PERMITTED, fatf_listing NONE, secrecy_flag
            false, corridor_risk_weight 1.00, max_permitted_risk_rating HIGH) so
            jurisdiction_risk_points = 8.00. Respondent H home DE with expected_monthly_volume_usd
            2000000.00, expected_monthly_count 100, nested_activity_permitted false, licensed
            ACTIVE/GOOD_STANDING, one VERIFIED natural-person owner at 100.00% resident in DE
            (not a PEP), so ownership_points 0 and nesting_points 0 and activity_points 6:
            inherent_risk_score 14.00. Onboarding questionnaire v1 carries self_rating 3 in all
            eight domains and is ASSESSED under ONBOARDING_PROVISIONAL, giving control_score 60.00,
            control_credit round(40/80*0.45, 4) = 0.2250 and residual round(14.00*0.7750, 2) =
            10.85 -> LOW; the committee approves at clock 2026-08-01T00:00:00Z. A CADENCE
            PeriodicRefresh is then scheduled over [2026-08-10T00:00:00Z, 2026-11-08T00:00:00Z),
            which puts the respondent in REFRESH_DUE. At clock 2026-08-10T00:00:00Z the analyst
            runs the REFRESH_FINAL assessment TOO EARLY - before starting the cycle - which rewrites
            control_score to 20.00 (no ControlAssessment row carries an assessed_rating yet, so
            REFRESH_FINAL credits 1 everywhere), control_credit to 0.0000 and residual to 14.00.
            The cycle is started at clock 2026-08-12T00:00:00Z, and at clock 2026-08-13T00:00:00Z a
            refresh questionnaire v2 is opened with self_rating 2 everywhere, submitted, overlaid
            with assessed_rating on ALL eight domains (GOVERNANCE, KYC_ONBOARDING,
            TRANSACTION_MONITORING, SANCTIONS_SCREENING, PEP_HANDLING at 4; TRAINING, AUDIT,
            NESTED_CONTROLS at 1 - all eight are required by priority 33) and ASSESSED under
            REFRESH_FINAL: 0.80*4 + 0.20*1 = 3.40, so computed_control_score = 68.00 with no gap
            cap. The respondent now has a fresh ASSESSED questionnaire but a stale
            last_risk_assessed_at of 2026-08-10T00:00:00Z.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Hansa Nordbank AG", swift_bic: "HANSDEF0XXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 2000000.00, expected_monthly_count: 100, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { h_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${h_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${h_id}/beneficial-owners", payload: { owner_name: "Hansa Holding Stiftung", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { h_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${h_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${h_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { hv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${h_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${hv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${h_id}", captures: { hq1: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${hq1}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 3 }, as: RespondentContact, as_user_id: "${h_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${hq1}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 3 }, as: RespondentContact, as_user_id: "${h_id}" }
