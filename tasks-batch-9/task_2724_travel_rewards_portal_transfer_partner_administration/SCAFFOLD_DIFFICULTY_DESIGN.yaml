              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/fraud-cases"
              payload: { account_id: "${a_id}", case_type: "ACCOUNT_TAKEOVER", signals: ["DEVICE_CHANGE", "NEW_PAYEE"], device_fingerprint_changed: true }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { fc_id: $.data.id }
            - call: "POST /rewards/fraud-cases/${fc_id}/review"
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "POST /rewards/fraud-cases/${fc_id}/confirm"
              payload: { resolution_note: "Takeover confirmed; account frozen." }
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
              as_user_id: "${a_id}"
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /rewards/transfer-requests"
              payload: { account_id: "${a_id}", partner_agreement_id: "${pa_id}", points_out: 1000, expected_account_version: "${a_v}" }
              as: Cardholder
              as_user_id: "${a_id}"
          assert:
            - "the response status is 409"
            - "the response error_id is ERR_ACCOUNT_POSTURE_LOCKED and NOT ERR_BELOW_MIN_TRANSFER"
            - "Account.${a_id}.fraud_posture == LOCKED"
            - "Account.${a_id}.points_balance == 20000"
            - "Account.${a_id}.points_pending_redemption == 0"
            - "no TransferRequest row exists with account_id ${a_id}"

      - name: priority_out_of_parity_outranks_insufficient_points
        grounds:
          - validations[priority=50]
          - validations[priority=70]
          - errors.ERR_OFFER_OUT_OF_PARITY
          - errors.ERR_INSUFFICIENT_POINTS
          - calculations.redemption_points_price_and_parity
        distinguishing_aspect: |
          A different category pair from the other instance: `business_safety` (priority 50,
          ERR_OFFER_OUT_OF_PARITY, 409) versus `business_fiscal` (priority 70,
          ERR_INSUFFICIENT_POINTS, 402) on POST /rewards/inventory-offers/{id}/book. The offer
          prices at 56000 cents against a 50000-cent ceiling and the account holds zero points, so
          both checks fail; the safety check must answer.
        test_recipe:
          setup:
            - "One CORE account with no transactions at all, so points_balance and available_points are 0."
            - "One ACTIVE agency with contracted_markup_bps 4000 and parity_tolerance_bps 0."
            - "One OPEN offer with net_rate_cents 40000, agency_public_price_cents 50000, agency_public_seats 3, portal_seats 2, tax_cents 0: portal_price_cents is 56000, the ceiling is 50000, so parity_status is OUT_OF_PARITY and points_debited would be 56000."
