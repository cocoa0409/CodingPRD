            - "${e_school} == ERR_SCHOOL_PARTNER_NOT_FOUND"
            - "${e_artist} == ERR_TEACHING_ARTIST_NOT_FOUND"
            - "${e_residency} == ERR_RESIDENCY_NOT_FOUND"
            - "${e_plan} == ERR_LESSON_PLAN_NOT_FOUND"
            - "${e_session} == ERR_SESSION_NOT_FOUND"
            - "${e_voucher} == ERR_VOUCHER_NOT_FOUND"
            - "${e_report} == ERR_FUNDER_REPORT_NOT_FOUND"
