    output: Vehicle[]
    side_effects: []
  - method: GET
    path: "/glean/vehicles/{id}"
    description: "Fetch one vehicle"
    roles: [ProgramCoordinator, CrewLeader]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/glean/events"
    description: "Create a GleanEvent against an OFFERED offer (offer -> SCHEDULED); enforces window containment, vehicle refrigeration match, vehicle schedule overlap"
    roles: [ProgramCoordinator]
    code: 201
    input: ["surplus_offer_id", "scheduled_start", "scheduled_end", "crew_leader_volunteer_id", "assigned_vehicle_id", "crew_capacity"]
    output: GleanEvent
    side_effects: ["SurplusOffer OFFERED -> SCHEDULED; SurplusOffer.version += 1"]
  - method: GET
    path: "/glean/events"
    description: "List events; optional surplus_offer_id and status filters"
    roles: [ProgramCoordinator, CrewLeader, FoodSafetyOfficer, GrantReviewer]
    code: 200
    input: ["limit?", "offset?", "surplus_offer_id?", "status?", "crew_leader_volunteer_id?", "assigned_vehicle_id?"]
    output: GleanEvent[]
    side_effects: []
  - method: GET
    path: "/glean/events/{id}"
    description: "Fetch one event"
    roles: [ProgramCoordinator, CrewLeader, FoodSafetyOfficer, GrantReviewer]
    code: 200
    input: []
    output: GleanEvent
    side_effects: []
  - method: POST
    path: "/glean/events/{id}/publish"
    description: "DRAFT -> OPEN; assigns vehicle; enforces vehicle schedule overlap"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: GleanEvent
    side_effects: ["Vehicle AVAILABLE -> ASSIGNED", "GleanEvent.version += 1"]
  - method: POST
    path: "/glean/events/{id}/cancel"
    description: "Cancel DRAFT or OPEN event; declines pending/confirmed assignments; releases vehicle"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: GleanEvent
    side_effects: ["cascade to CrewAssignments", "Vehicle ASSIGNED -> AVAILABLE"]
  - method: POST
    path: "/glean/events/{id}/start"
    description: "OPEN or FULL -> IN_PROGRESS; only the assigned crew leader; time-gated by [scheduled_start, scheduled_end)"
    roles: [CrewLeader]
    code: 200
    input: []
    output: GleanEvent
    side_effects: ["GleanEvent.version += 1"]
  - method: POST
    path: "/glean/events/{id}/finish"
    description: "IN_PROGRESS -> HARVESTED; requires >= 1 VERIFIED lot; sweeps every CONFIRMED assignment to COMPLETED and every PENDING assignment to NO_SHOW (cascade bumps Volunteer.no_show_count, possibly flipping Volunteer to SUSPENDED)"
    roles: [CrewLeader]
    code: 200
    input: []
    output: GleanEvent
    side_effects: ["cascade assignment outcomes", "recompute totals", "offer GLEANED re-evaluation"]
  - method: POST
    path: "/glean/events/{id}/reconcile"
    description: "HARVESTED -> RECONCILED; requires all distributions terminal, all lots terminal, all incidents resolved; releases containers and vehicle"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: GleanEvent
    side_effects: ["Container IN_USE -> AVAILABLE for verified lots", "Vehicle ASSIGNED -> AVAILABLE", "recompute undistributed_lbs"]
  - method: POST
    path: "/glean/assignments"
    description: "Invite a volunteer to an event (creates PENDING assignment)"
    roles: [ProgramCoordinator, CrewLeader]
    code: 201
    input: ["glean_event_id", "volunteer_id"]
    output: CrewAssignment
    side_effects: []
  - method: GET
    path: "/glean/assignments"
    description: "List assignments; optional glean_event_id and volunteer_id filters"
    roles: [ProgramCoordinator, CrewLeader]
    code: 200
    input: ["limit?", "offset?", "glean_event_id?", "volunteer_id?"]
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/glean/assignments/{id}"
    description: "Fetch one assignment"
    roles: [ProgramCoordinator, CrewLeader]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/glean/assignments/{id}/confirm"
    description: "PENDING -> CONFIRMED; requires waiver, ACTIVE volunteer, capacity headroom, no double-booking"
    roles: [Volunteer]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["crew_confirmed_count += 1", "possible OPEN -> FULL"]
  - method: POST
    path: "/glean/assignments/{id}/decline"
    description: "PENDING or CONFIRMED -> DECLINED; may trigger FULL -> OPEN"
    roles: [Volunteer]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["possible FULL -> OPEN"]
  - method: POST
    path: "/glean/assignments/{id}/complete"
    description: "Record hours for a CONFIRMED assignment on an IN_PROGRESS event (keeps status CONFIRMED until finish sweeps to COMPLETED); stores hours_worked"
    roles: [Volunteer]
    code: 200
    input: ["hours_worked"]
    output: CrewAssignment
    side_effects: ["hours_worked stored"]
  - method: POST
    path: "/glean/lots"
    description: "Record a HarvestLot in PENDING; validates cull <= gross - tare; container must be AVAILABLE or already IN_USE by this event"
    roles: [CrewLeader]
    code: 201
    input: ["glean_event_id", "container_id", "gross_lbs", "tare_lbs?", "cull_lbs", "recorded_by_volunteer_id"]
    output: HarvestLot
    side_effects: []
  - method: GET
    path: "/glean/lots"
    description: "List lots; optional glean_event_id and container_id filters"
    roles: [ProgramCoordinator, CrewLeader, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "glean_event_id?", "container_id?", "recorded_by_volunteer_id?", "verified_by_coordinator_id?"]
    output: HarvestLot[]
    side_effects: []
  - method: GET
    path: "/glean/lots/{id}"
    description: "Fetch one lot"
    roles: [ProgramCoordinator, CrewLeader, FoodSafetyOfficer]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []
  - method: POST
    path: "/glean/lots/{id}/verify"
    description: "PENDING -> VERIFIED; segregation of duties; vehicle payload check; container -> IN_USE; recompute totals"
    roles: [ProgramCoordinator]
    code: 200
    input: ["verified_by_coordinator_id"]
    output: HarvestLot
    side_effects: ["Container -> IN_USE", "recompute total_harvested_lbs"]
  - method: POST
    path: "/glean/lots/{id}/reject"
    description: "PENDING -> REJECTED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []
  - method: POST
    path: "/glean/distributions"
    description: "Allocate pounds from a HARVESTED event to an agency; OCC on event version; enforces agency capacity, allocation feasibility, refrigeration capability"
    roles: [ProgramCoordinator]
    code: 201
    input: ["glean_event_id", "agency_id", "planned_lbs", "delivery_date", "expected_event_version"]
    output: Distribution
    side_effects:
      - "increments GleanEvent.version by 1"
      - "Agency.current_week_committed_lbs recomputed"
      - "GleanEvent.total_distributed_lbs recomputed"
  - method: GET
    path: "/glean/distributions"
    description: "List distributions; optional glean_event_id, agency_id, status filters"
    roles: [ProgramCoordinator, GrantReviewer, CrewLeader]
    code: 200
    input: ["limit?", "offset?", "glean_event_id?", "agency_id?", "status?"]
    output: Distribution[]
    side_effects: []
  - method: GET
    path: "/glean/distributions/{id}"
    description: "Fetch one distribution"
    roles: [ProgramCoordinator, GrantReviewer, CrewLeader]
    code: 200
    input: []
    output: Distribution
    side_effects: []
  - method: POST
    path: "/glean/distributions/{id}/deliver"
    description: "SCHEDULED -> DELIVERED (delivered_lbs == planned_lbs) or SHORTFALL (0 < delivered_lbs < planned_lbs); cold-chain gate for refrigerated loads"
    roles: [CrewLeader]
    code: 200
    input: ["delivered_lbs"]
    output: Distribution
    side_effects: ["Agency.current_week_committed_lbs recomputed", "event totals recomputed"]
  - method: POST
    path: "/glean/distributions/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Distribution
    side_effects: ["Agency.current_week_committed_lbs recomputed"]
  - method: POST
    path: "/glean/templogs"
    description: "Append a temperature reading; computes breach_flag; on breach flips cold_chain_intact on SCHEDULED distributions of the event"
    roles: [CrewLeader, FoodSafetyOfficer]
    code: 201
    input: ["glean_event_id", "recorded_at", "temp_f"]
    output: TempLog
    side_effects: ["cold_chain_intact recompute on SCHEDULED distributions"]
  - method: GET
    path: "/glean/templogs"
    description: "List temp logs; optional glean_event_id filter"
    roles: [ProgramCoordinator, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "glean_event_id?"]
    output: TempLog[]
    side_effects: []
  - method: GET
    path: "/glean/templogs/{id}"
    description: "Fetch one temp log"
    roles: [ProgramCoordinator, FoodSafetyOfficer]
    code: 200
    input: []
    output: TempLog
    side_effects: []
  - method: POST
    path: "/glean/incidents"
    description: "Open a food-safety incident against an event"
    roles: [CrewLeader, FoodSafetyOfficer]
    code: 201
    input: ["glean_event_id", "severity", "condemned_lbs", "reported_by_volunteer_id"]
    output: FoodSafetyIncident
    side_effects: []
  - method: GET
    path: "/glean/incidents"
    description: "List incidents; optional glean_event_id filter"
    roles: [ProgramCoordinator, FoodSafetyOfficer, GrantReviewer]
    code: 200
    input: ["limit?", "offset?", "glean_event_id?", "reported_by_volunteer_id?"]
    output: FoodSafetyIncident[]
    side_effects: []
  - method: GET
    path: "/glean/incidents/{id}"
    description: "Fetch one incident"
    roles: [ProgramCoordinator, FoodSafetyOfficer, GrantReviewer]
    code: 200
    input: []
    output: FoodSafetyIncident
    side_effects: []
  - method: POST
    path: "/glean/incidents/{id}/resolve"
    description: "OPEN -> RESOLVED_COMPOST | RESOLVED_ANIMAL_FEED | RESOLVED_LANDFILL; FoodSafetyOfficer only"
    roles: [FoodSafetyOfficer]
    code: 200
    input: ["disposition"]
    output: FoodSafetyIncident
    side_effects: ["undistributed_lbs recomputed"]
  - method: POST
    path: "/glean/reports"
    description: "Create a GrantReport in DRAFT for a county and period"
    roles: [ProgramCoordinator]
    code: 201
    input: ["county_code", "period_start", "period_end"]
    output: GrantReport
    side_effects: []
  - method: GET
    path: "/glean/reports"
    description: "List grant reports; optional county_code and status filters"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: ["limit?", "offset?", "county_code?", "status?"]
    output: GrantReport[]
    side_effects: []
  - method: GET
    path: "/glean/reports/{id}"
    description: "Fetch one report"
    roles: [ProgramCoordinator, GrantReviewer]
    code: 200
    input: []
    output: GrantReport
    side_effects: []
  - method: POST
    path: "/glean/reports/{id}/submit"
    description: "DRAFT or RETURNED -> SUBMITTED; snapshots impact metrics per calculations.impact_metrics"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: GrantReport
    side_effects: ["metrics snapshot frozen"]
  - method: POST
    path: "/glean/reports/{id}/accept"
    description: "SUBMITTED -> ACCEPTED"
    roles: [GrantReviewer]
    code: 200
    input: []
    output: GrantReport
    side_effects: []
  - method: POST
    path: "/glean/reports/{id}/return"
    description: "SUBMITTED -> RETURNED"
    roles: [GrantReviewer]
    code: 200
    input: []
    output: GrantReport
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock); drives offer expiry, event start gating, ISO-week assignment."
    roles: [ProgramCoordinator]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["system re-evaluates OFFERED -> EXPIRED for offers whose window_end <= now"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.7 (incl. Volunteer acting on another volunteer's assignment, or CrewLeader not the event's designated leader)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or enum value not in declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target resource is in a terminal state; all further transitions rejected" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: volunteer email, container label, vehicle plate, or second receipt for one offer" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version does not match GleanEvent.version at distribution creation" }
  - { id: ERR_STALE_OFFER_VERSION, http: 412, condition: "expected_offer_version does not match SurplusOffer.version at close" }
  - { id: ERR_COLD_CHAIN_BREACH, http: 422, condition: "Deliver attempted for a refrigeration-required offer whose event has a breaching TempLog" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Verifier equals recorder on lot verify, or waiver witness equals signer" }
  - { id: ERR_EVENT_WINDOW_OUTSIDE_OFFER, http: 422, condition: "Event [scheduled_start, scheduled_end) not contained in offer [window_start, window_end), or start >= end" }
  - { id: ERR_OFFER_WINDOW_OVERLAP, http: 422, condition: "Same farm, same crop_code, non-terminal offer with overlapping [window_start, window_end) (adjacency permitted)" }
  - { id: ERR_VOLUNTEER_DOUBLE_BOOKED, http: 422, condition: "Confirming would give the volunteer CONFIRMED assignments on two overlapping events (adjacency permitted)" }
  - { id: ERR_VEHICLE_SCHEDULE_CONFLICT, http: 422, condition: "Vehicle already assigned to a non-terminal event overlapping [scheduled_start, scheduled_end) (adjacency permitted)" }
  - { id: ERR_WAIVER_MISSING, http: 422, condition: "No Waiver for (volunteer, event) pair signed by a distinct witness" }
  - { id: ERR_CREW_FULL, http: 422, condition: "Confirming would exceed GleanEvent.crew_capacity" }
  - { id: ERR_VEHICLE_REFRIGERATION_MISMATCH, http: 422, condition: "offer.requires_refrigeration != vehicle.refrigerated at event creation, or agency not refrigeration_capable for refrigerated load" }
  - { id: ERR_ALLOCATION_EXCEEDS_HARVEST, http: 422, condition: "planned_lbs exceeds available_lbs per event_allocation_feasibility" }
  - { id: ERR_CULL_EXCEEDS_NET, http: 422, condition: "cull_lbs > gross_lbs - tare_lbs at lot creation" }
  - { id: ERR_VEHICLE_PAYLOAD_EXCEEDED, http: 422, condition: "Verifying lot would push projected payload above vehicle.payload_capacity_lbs" }
  - { id: ERR_AGENCY_CAPACITY_EXCEEDED, http: 422, condition: "Weekly committed + planned_lbs > agency.weekly_capacity_lbs (strictly greater; equality allowed)" }
  - { id: ERR_VOLUNTEER_SUSPENDED, http: 422, condition: "SUSPENDED volunteer attempted to confirm an assignment" }
  - { id: ERR_FARM_INACTIVE, http: 422, condition: "Offer creation against a farm with active_flag == false" }
  - { id: ERR_AGENCY_INACTIVE, http: 422, condition: "Distribution creation against an agency with active_flag == false" }
  - { id: ERR_INCIDENT_OPEN, http: 422, condition: "Close or reconcile attempted while an incident on the offer's events remains OPEN" }
  - { id: ERR_EVENT_NOT_STARTED, http: 422, condition: "Start attempted outside [scheduled_start, scheduled_end)" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramCoordinator
    description: "Program staff; owns farms, offers, events, agencies, logistics, lot verification, distribution planning, grant reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /glean/farms, /glean/agencies, /glean/containers, /glean/vehicles, /glean/offers, /glean/events, /glean/reports, /glean/distributions"
      - "POST /glean/offers/{id}/cancel, /glean/offers/{id}/close"
      - "POST /glean/events/{id}/publish, /glean/events/{id}/cancel, /glean/events/{id}/reconcile"
      - "POST /glean/lots/{id}/verify, /glean/lots/{id}/reject"
      - "POST /glean/distributions/{id}/cancel"
      - "POST /glean/volunteers/{id}/reinstate"
      - "POST /glean/reports/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /glean/volunteers"
      - "POST /glean/assignments"
  - name: CrewLeader
    description: "Certified volunteer leading a glean crew; drives event execution, lot recording, delivery, temperature logging"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /glean/events/{id}/start, /glean/events/{id}/finish"
      - "POST /glean/distributions/{id}/deliver"
      - "POST /glean/lots"
    shared_operations:
      - "GET events, offers, containers, vehicles, waivers of own events"
      - "POST /glean/assignments"
      - "POST /glean/templogs"
      - "POST /glean/incidents"
  - name: Volunteer
    description: "Crew member; signs waivers and confirms/declines own assignments, reports hours"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /glean/waivers"
      - "POST /glean/assignments/{id}/confirm, /glean/assignments/{id}/decline, /glean/assignments/{id}/complete (own assignments only)"
    shared_operations: []
  - name: FoodSafetyOfficer
    description: "Independent food-safety authority; resolves incidents; cannot verify lots or plan distributions (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /glean/incidents/{id}/resolve"
    shared_operations:
      - "GET farms, offers, events, lots, incidents, templogs"
      - "POST /glean/templogs"
      - "POST /glean/incidents"
  - name: GrantReviewer
    description: "External grant officer; read-only on operational data; accepts or returns submitted reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /glean/reports/{id}/accept, /glean/reports/{id}/return"
    shared_operations:
      - "GET farms, offers, agencies, events, distributions, reports, incidents, receipts"
