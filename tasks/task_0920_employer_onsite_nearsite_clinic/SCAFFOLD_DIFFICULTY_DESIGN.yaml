              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-2101", member_external_id: "M-2101", tier: "EMPLOYEE", effective_date: "2026-01-01", termination_date: "2026-06-08" }
              as: EmployerBenefitsAdmin
