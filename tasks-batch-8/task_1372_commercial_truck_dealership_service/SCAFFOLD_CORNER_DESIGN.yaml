            - { call: "POST /dealership/ops/run-daily-sweep", payload: {}, as: DealershipAdmin, captures: { posted2: $.data.interest_entries_posted } }
            - { call: "POST /dealership/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: DealershipAdmin }
