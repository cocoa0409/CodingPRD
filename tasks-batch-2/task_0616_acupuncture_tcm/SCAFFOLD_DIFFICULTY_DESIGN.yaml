              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "cold", tongue_finding: "PALE", tongue_coating: "THIN_WHITE", pulse_finding: "DEEP", tcm_pattern: "YANG_DEFICIENCY" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["CV4"], planned_sessions: 4 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /treatment-plans/${pl_id}/hold"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { plvHeld: $.data.version }
          trigger:
            - call: "POST /dispenses"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", herbal_formula_id: "${f_id}", doses: 1, expected_treatment_plan_version: "${plvHeld}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
