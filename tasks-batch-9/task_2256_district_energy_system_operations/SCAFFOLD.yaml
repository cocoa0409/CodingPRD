    side_effects: ["runs calculations.invoice_billing_determinants under the requested variant", "stores billed_energy_mwh, billed_demand_kw, load_factor_pct, energy_charge, demand_charge, fixed_charge, total_amount, minimum_bill_applied and variant_applied", "creates the invoice with invoice_state DRAFT", "increments ConnectionAgreement.version by 1"]
  - method: GET
    path: "/district-energy/invoices/{invoice_id}"
    description: "Read one invoice including every billing determinant."
    roles: [SystemController, BillingAnalyst, CustomerAccount]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/district-energy/invoices"
    description: "List invoices, filterable by agreement, lifecycle state and variant."
    roles: [SystemController, BillingAnalyst]
    code: 200
    input: ["agreement_id?", "invoice_state?", "variant_applied?", "limit?", "offset?"]
    output: Invoice[]
