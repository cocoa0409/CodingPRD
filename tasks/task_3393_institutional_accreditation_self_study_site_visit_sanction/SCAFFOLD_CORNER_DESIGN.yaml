# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3393_institutional_accreditation_self_study_site_visit_sanction
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance appear as `excluded_because:` stubs.
# YAML anchors for the canonical accreditation pipeline are defined at first
# use (document order) and aliased by later instances in THIS file only.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: institution_create_applies_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Institution
          - endpoints.POST_/accreditation/institutions
          - calculations.annual_dues_assessment
        distinguishing_aspect: "A private nonprofit with fte 800 and levels [ASSOCIATE, BACCALAUREATE] is created 201 with accreditation_status PROSPECTIVE, sanction_status NONE, version 1, dues 312400 fully prepaid at onboarding, and all monitoring fields null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - &k_inst
              call: "POST /accreditation/institutions"
              payload: { legal_name: "Prairie Private College", legal_status: "PRIVATE_NONPROFIT", state_code: "IA", fte_enrollment: 800, degree_levels_offered: ["ASSOCIATE", "BACCALAUREATE"] }
              as: CommissionAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
          assert:
            - "status 201; Institution.${inst_id}.accreditation_status == PROSPECTIVE and sanction_status == NONE"
            - "Institution.${inst_id}.version == 1 and id / created_at / updated_at are system-stamped"
            - "current_annual_dues_cents == 312400 (250000 + 800*33 + 800*45), dues_paid_cents == 312400, outstanding_dues_cents == 0"
            - "distance_delivery_approved == false, locations_count == 1, candidacy_pathway is null, latest_cfi_value is null, latest_cfi_band is null"

      - name: reviewer_create_and_get_roundtrip
        claim_type: Retrieval
        grounds:
          - entities.Reviewer
          - endpoints.GET_/accreditation/reviewers/{id}
        distinguishing_aspect: "Every reviewer attribute round-trips through GET exactly as posted, including the empty declared-conflict list, null affiliation and the computed zero load."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Roundtrip Reviewer", specialty_criteria: ["CRIT_MISSION", "CRIT_INTEGRITY"], quality_rating: 4.25, prior_chair_count: 1 }
              as: CommissionStaff
              captures: { rev_rt_id: $.data.id }
          trigger:
            - call: "GET /accreditation/reviewers/${rev_rt_id}"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rev_rt_id}"
          assert:
            - "GET returns full_name == 'Roundtrip Reviewer', specialty_criteria == [CRIT_MISSION, CRIT_INTEGRITY], quality_rating == 4.25, prior_chair_count == 1"
            - "affiliation_institution_id is null, declared_conflict_institution_ids == [], is_active == true, current_assignment_count == 0"

      - name: institutions_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/accreditation/institutions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three institutions on file, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; three institutions created."
          setup_api_calls:
            - *k_clock
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Alpha College", legal_status: "PRIVATE_NONPROFIT", state_code: "IA", fte_enrollment: 100, degree_levels_offered: ["ASSOCIATE"] }
              as: CommissionAdmin
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Beta University", legal_status: "PUBLIC", state_code: "MN", fte_enrollment: 200, degree_levels_offered: ["BACCALAUREATE"] }
              as: CommissionAdmin
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Gamma Institute", legal_status: "PRIVATE_FORPROFIT", state_code: "MO", fte_enrollment: 300, degree_levels_offered: ["DOCTORAL"] }
              as: CommissionAdmin
          trigger:
            - call: "GET /accreditation/institutions"
              payload: { limit: 2, offset: 0 }
              as: CommissionStaff
            - call: "GET /accreditation/institutions"
              payload: { limit: 2, offset: 2 }
              as: CommissionStaff
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false, offset == 2"

      - name: institution_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - endpoints.GET_/accreditation/institutions/{id}
        distinguishing_aspect: "A GET against a well-formed but absent institution id returns 404 with the resource-specific ERR_INSTITUTION_NOT_FOUND, not a generic error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /accreditation/institutions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CommissionStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "status 404 with data.error_id == ERR_INSTITUTION_NOT_FOUND and response_type == error"

      - name: eligibility_create_missing_required_pathway_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.EligibilityApplication.fields.pathway
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required pathway field on eligibility creation fails ERR_VALIDATION (400) before any state transition — no application row is persisted."
        test_recipe:
          setup:
            - "PROSPECTIVE institution."
          setup_api_calls:
            - *k_clock
            - *k_inst
          trigger:
            - call: "POST /accreditation/institutions/${inst_id}/eligibility-applications"
              payload: { statement_of_intent: "Missing the pathway field." }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "status 400 with data.error_id == ERR_VALIDATION"
            - "GET /accreditation/institutions/${inst_id}/eligibility-applications afterwards returns an empty array"

      - name: institution_create_input_ignored_for_system_fields
        claim_type: System Fields
        grounds:
          - entities.Institution.fields.accreditation_status
          - entities.Institution.fields.latest_cfi_value
        distinguishing_aspect: "Client-supplied system fields (accreditation_status, version, latest_cfi_value) in the create payload are ignored — the row still starts PROSPECTIVE at version 1 with null CFI."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Smuggle State College", legal_status: "PUBLIC", state_code: "WI", fte_enrollment: 100, degree_levels_offered: ["ASSOCIATE"], accreditation_status: "ACCREDITED", version: 99, latest_cfi_value: 9.99 }
              as: CommissionAdmin
              captures: { smug_id: $.data.id, smug_status: $.data.accreditation_status, smug_v: $.data.version }
          assert:
            - "status 201 (extra fields ignored, not rejected)"
            - "smug_status == PROSPECTIVE and smug_v == 1"
            - "Institution.${smug_id}.latest_cfi_value is null and sanction_status == NONE"

      - name: eligibility_approval_stamps_candidacy_window
        claim_type: Computed Fields
        grounds:
          - state_machines.Institution.PROSPECTIVE_to_CANDIDATE
          - entities.Institution.fields.candidacy_expires_at
        distinguishing_aspect: "Approving a STANDARD application at 2026-09-01T00:00:00Z stamps candidacy_expires_at exactly 4 years later (2030-09-01T00:00:00Z); an ACCELERATED application stamps exactly 2 years (2028-09-01T00:00:00Z)."
        test_recipe:
          setup:
            - "Two PROSPECTIVE institutions, each with a FILED eligibility application (STANDARD for the first, ACCELERATED for the second)."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - &k_elig_new
              call: "POST /accreditation/institutions/${inst_id}/eligibility-applications"
              payload: { pathway: "STANDARD", statement_of_intent: "We meet the eligibility requirements." }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { elig_id: $.data.id }
            - &k_elig_file
              call: "POST /accreditation/eligibility-applications/${elig_id}/file"
              payload: {}
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - call: "POST /accreditation/institutions"
              payload: { legal_name: "Accelerated Academy", legal_status: "PRIVATE_FORPROFIT", state_code: "MO", fte_enrollment: 250, degree_levels_offered: ["ASSOCIATE"] }
              as: CommissionAdmin
              captures: { inst_acc_id: $.data.id }
            - call: "POST /accreditation/institutions/${inst_acc_id}/eligibility-applications"
              payload: { pathway: "ACCELERATED", statement_of_intent: "Accelerated candidacy sought." }
              as: InstitutionLiaison
              as_user_id: "${inst_acc_id}"
              captures: { elig_acc_id: $.data.id }
            - call: "POST /accreditation/eligibility-applications/${elig_acc_id}/file"
              payload: {}
              as: InstitutionLiaison
              as_user_id: "${inst_acc_id}"
          trigger:
            - &k_elig_ok
              call: "POST /accreditation/eligibility-applications/${elig_id}/adjudicate"
              payload: { decision: "APPROVE", adjudication_notes: "Eligibility granted on the standard pathway." }
              as: CommissionStaff
            - call: "POST /accreditation/eligibility-applications/${elig_acc_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: CommissionStaff
            - call: "GET /accreditation/institutions/${inst_id}"
              payload: {}
              as: CommissionStaff
              captures: { inst1_acc_status: $.data.accreditation_status, inst1_exp: $.data.candidacy_expires_at }
            - call: "GET /accreditation/institutions/${inst_acc_id}"
              payload: {}
              as: CommissionStaff
              captures: { inst2_exp: $.data.candidacy_expires_at }
          assert:
            - "inst1_acc_status == CANDIDATE, candidacy_pathway == STANDARD, candidacy_started_at == 2026-09-01T00:00:00Z"
            - "inst1_exp == 2030-09-01T00:00:00Z (STANDARD 4-year pathway)"
            - "inst2_exp == 2028-09-01T00:00:00Z (ACCELERATED 2-year pathway)"

      - name: evidence_item_invalid_enum_criterion_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EvidenceItem.fields.criterion_code
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "An evidence item whose criterion_code is outside the five-criterion enum is rejected ERR_VALIDATION; the same call with a valid enum member succeeds."
        test_recipe:
          setup:
            - "CANDIDATE institution; cycle MATERIALS_OPEN; DRAFT assurance argument."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - &k_cyc_new
              call: "POST /accreditation/institutions/${inst_id}/review-cycles"
              payload: { cycle_type: "INITIAL_ACCREDITATION" }
              as: CommissionStaff
              captures: { cyc_id: $.data.id }
            - &k_cyc_adv1
              call: "POST /accreditation/review-cycles/${cyc_id}/advance"
              payload: {}
              as: CommissionStaff
            - &k_arg_new
              call: "POST /accreditation/review-cycles/${cyc_id}/assurance-arguments"
              payload: { narrative_text: "Self-study assurance argument addressing all five criteria." }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { arg_id: $.data.id }
          trigger:
            - call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_VIBES", evidence_type: "POLICY_DOCUMENT", title: "Bad enum", document_uri: "s3://ev/bad.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_MISSION", evidence_type: "POLICY_DOCUMENT", title: "Good enum", document_uri: "s3://ev/good.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { good_ev: $.data.id }
          assert:
            - "invalid enum member fails with err_id == ERR_VALIDATION (HTTP 400)"
            - "valid member succeeds 201 and EvidenceItem.${good_ev}.verified == false by default"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_accreditation_happy_path_reaches_accredited
        claim_type: Valid Transition
        grounds:
          - state_machines.Institution.CANDIDATE_to_ACCREDITED
          - state_machines.ReviewCycle
          - state_machines.ReviewTeam
          - state_machines.DecisionPanel.CONVENED_to_CLOSED
        distinguishing_aspect: "The full lifecycle DRAFT->...->CLOSED is reachable purely through declared endpoints: eligibility approval, cycle stepping, argument submit/lock, team assembly/confirm, visit, report, panel, votes GRANT x5, close, disclosure, effectuation — ending ACCREDITED with accredited_since stamped at the visit-end clock."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; PROSPECTIVE private institution; STANDARD pathway approved; initial cycle with a 15-item argument (exactly MIN_EVIDENCE_PER_CRITERION per criterion)."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
            - *k_elig_file
            - *k_elig_ok
            - *k_cyc_new
            - *k_cyc_adv1
            - *k_arg_new
            - &k_ev_m1
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_MISSION", evidence_type: "POLICY_DOCUMENT", title: "Mission statement", document_uri: "s3://ev/m1.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
              captures: { ev_m1: $.data.id }
            - &k_ev_m2
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_MISSION", evidence_type: "INSTITUTIONAL_DATA", title: "Mission KPI dashboard", document_uri: "s3://ev/m2.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_m3
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_MISSION", evidence_type: "ASSESSMENT_RESULT", title: "Mission review minutes", document_uri: "s3://ev/m3.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_i1
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_INTEGRITY", evidence_type: "POLICY_DOCUMENT", title: "Academic integrity policy", document_uri: "s3://ev/i1.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_i2
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_INTEGRITY", evidence_type: "INSTITUTIONAL_DATA", title: "Integrity incident log", document_uri: "s3://ev/i2.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_i3
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_INTEGRITY", evidence_type: "POLICY_DOCUMENT", title: "Ethics committee charter", document_uri: "s3://ev/i3.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_tq1
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_QUALITY", evidence_type: "ASSESSMENT_RESULT", title: "Program review report", document_uri: "s3://ev/tq1.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_tq2
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_QUALITY", evidence_type: "INSTITUTIONAL_DATA", title: "Faculty qualification table", document_uri: "s3://ev/tq2.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_tq3
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_QUALITY", evidence_type: "POLICY_DOCUMENT", title: "Teaching excellence framework", document_uri: "s3://ev/tq3.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_te1
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_EVALUATION", evidence_type: "ASSESSMENT_RESULT", title: "Assessment of learning outcomes", document_uri: "s3://ev/te1.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_te2
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_EVALUATION", evidence_type: "INSTITUTIONAL_DATA", title: "Retention dashboard", document_uri: "s3://ev/te2.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_te3
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_TEACHING_EVALUATION", evidence_type: "ASSESSMENT_RESULT", title: "Program improvement log", document_uri: "s3://ev/te3.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_rp1
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_RESOURCES_PLANNING", evidence_type: "FINANCIAL_INDICATOR", title: "Audited financial statements", document_uri: "s3://ev/rp1.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_rp2
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_RESOURCES_PLANNING", evidence_type: "POLICY_DOCUMENT", title: "Strategic plan", document_uri: "s3://ev/rp2.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_ev_rp3
              call: "POST /accreditation/assurance-arguments/${arg_id}/evidence-items"
              payload: { criterion_code: "CRIT_RESOURCES_PLANNING", evidence_type: "INSTITUTIONAL_DATA", title: "Facilities inventory", document_uri: "s3://ev/rp3.pdf" }
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_arg_sub
              call: "POST /accreditation/assurance-arguments/${arg_id}/submit"
              payload: {}
              as: InstitutionLiaison
              as_user_id: "${inst_id}"
            - &k_cyc_adv2
              call: "POST /accreditation/review-cycles/${cyc_id}/advance"
              payload: {}
              as: CommissionStaff
              captures: { cyc_v: $.data.version }
            - &k_rev_chair
              call: "POST /accreditation/reviewers"
              payload: { full_name: "Ada Chair", specialty_criteria: ["CRIT_MISSION", "CRIT_INTEGRITY", "CRIT_TEACHING_QUALITY", "CRIT_TEACHING_EVALUATION", "CRIT_RESOURCES_PLANNING"], quality_rating: 4.50, prior_chair_count: 3 }
              as: CommissionStaff
              captures: { rev_chair_id: $.data.id }
            - &k_rev_m2
              call: "POST /accreditation/reviewers"
              payload: { full_name: "Ben Member", specialty_criteria: ["CRIT_MISSION", "CRIT_INTEGRITY", "CRIT_TEACHING_QUALITY", "CRIT_RESOURCES_PLANNING"], quality_rating: 4.00, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { rev_m2_id: $.data.id }
            - &k_rev_m3
              call: "POST /accreditation/reviewers"
              payload: { full_name: "Cara Member", specialty_criteria: ["CRIT_MISSION", "CRIT_INTEGRITY", "CRIT_TEACHING_QUALITY"], quality_rating: 3.50, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { rev_m3_id: $.data.id }
            - &k_rev_m4
              call: "POST /accreditation/reviewers"
              payload: { full_name: "Dan Member", specialty_criteria: ["CRIT_MISSION", "CRIT_INTEGRITY"], quality_rating: 3.00, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { rev_m4_id: $.data.id }
            - &k_team_new
              call: "POST /accreditation/review-cycles/${cyc_id}/review-teams"
              payload: { visit_modality: "ON_SITE", expected_review_cycle_version: "${cyc_v}" }
              as: CommissionStaff
              captures: { team_id: $.data.id, team_chair: $.data.chair_reviewer_id }
            - &k_asg_chair
              call: "GET /accreditation/reviewers/${rev_chair_id}/assignments"
              payload: {}
              as: CommissionStaff
              captures: { asg_chair: "$.data[0].id" }
            - &k_asg_m2
              call: "GET /accreditation/reviewers/${rev_m2_id}/assignments"
              payload: {}
              as: CommissionStaff
              captures: { asg_m2: "$.data[0].id" }
            - &k_asg_m3
              call: "GET /accreditation/reviewers/${rev_m3_id}/assignments"
              payload: {}
              as: CommissionStaff
              captures: { asg_m3: "$.data[0].id" }
            - &k_asg_m4
              call: "GET /accreditation/reviewers/${rev_m4_id}/assignments"
              payload: {}
              as: CommissionStaff
              captures: { asg_m4: "$.data[0].id" }
            - &k_acc_chair
              call: "POST /accreditation/team-assignments/${asg_chair}/respond"
              payload: { response: "ACCEPT" }
              as: PeerReviewer
              as_user_id: "${rev_chair_id}"
            - &k_acc_m2
              call: "POST /accreditation/team-assignments/${asg_m2}/respond"
              payload: { response: "ACCEPT" }
              as: PeerReviewer
              as_user_id: "${rev_m2_id}"
            - &k_acc_m3
              call: "POST /accreditation/team-assignments/${asg_m3}/respond"
              payload: { response: "ACCEPT" }
              as: PeerReviewer
              as_user_id: "${rev_m3_id}"
            - &k_acc_m4
              call: "POST /accreditation/team-assignments/${asg_m4}/respond"
              payload: { response: "ACCEPT" }
              as: PeerReviewer
              as_user_id: "${rev_m4_id}"
            - &k_confirm
              call: "POST /accreditation/review-teams/${team_id}/confirm"
              payload: {}
              as: CommissionStaff
            - &k_lock
              call: "POST /accreditation/assurance-arguments/${arg_id}/lock"
              payload: {}
              as: CommissionStaff
            - &k_sched
              call: "POST /accreditation/review-teams/${team_id}/schedule-visit"
              payload: { visit_start_at: "2027-03-10T09:00:00Z", visit_end_at: "2027-03-12T17:00:00Z" }
              as: PeerReviewer
              as_user_id: "${rev_chair_id}"
            - &k_clock_visit_end
              call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-12T18:00:00Z" }
              as: CommissionAdmin
            - &k_file_report
              call: "POST /accreditation/review-teams/${team_id}/file-report"
              payload:
                criterion_ratings:
                  - { criterion_code: "CRIT_MISSION", rating: "MET" }
                  - { criterion_code: "CRIT_INTEGRITY", rating: "MET" }
                  - { criterion_code: "CRIT_TEACHING_QUALITY", rating: "MET" }
