scaffold_difficulty_design:
  # Rule 1 — dual-variant calculations across different entity domains
  - rule_id: dual_variant_calc
    instances:
      - name: filing_fee_standard_vs_electronic
        grounds:
          - calculations.filing_fee
          - entities.FilingPackage.fields.filing_fee_cents
        distinguishing_aspect: |
          Identical claim inputs on a FilingPackage (court-fiscal domain) price differently
          solely by variant selection: STANDARD (efiled=false) adds 750, ELECTRONIC
          (efiled=true) subtracts 1000 — a 1750-cent divergence. The sibling instance
          exercises the storage-charge domain, not court fees.
        test_recipe:
          setup:
            - "One landlord with two CA units, each with an ACTIVE tenancy and an EvictionCase (NONPAYMENT) whose PAY_OR_QUIT notice (served 2026-05-02, CA cure 3 days, deadline 2026-05-05T23:59:59Z) has been expired by an ops run"
            - "Both cases in NOTICE_EXPIRED"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { ua: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "B" }, as: Landlord, as_user_id: "${ll}", captures: { ub: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${ua}", tenant_full_name: "T A", monthly_rent_cents: 200000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { ta: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${ub}", tenant_full_name: "T B", monthly_rent_cents: 200000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { tb: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${ta}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { ca: $.data.id, cva: $.data.version } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${tb}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { cb: $.data.id, cvb: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${ca}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 200000, expected_case_version: "${cva}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/cases/${cb}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 200000, expected_case_version: "${cvb}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk, captures: { sweep: $.data.notices_expired } }
          trigger:
            - { call: "POST /api/cases/${ca}/filing-packages", payload: { claimed_amount_cents: 200000, defendant_names: ["Dee One", "Dee Two"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { pa: $.data.id, fee_a: $.data.filing_fee_cents } }
            - { call: "POST /api/cases/${cb}/filing-packages", payload: { claimed_amount_cents: 200000, defendant_names: ["Dee One", "Dee Two"], jury_demanded: false, efiled: true }, as: Landlord, as_user_id: "${ll}", captures: { pb: $.data.id, fee_b: $.data.filing_fee_cents } }
          assert:
            - "sweep == 2 (both notices expired by one ops run)"
            - "fee_a == 29750  (CA base 24000 + 2*2500 defendants + STANDARD 750)"
            - "fee_b == 28000  (CA base 24000 + 2*2500 defendants - ELECTRONIC 1000)"
            - "fee_a - fee_b == 1750 (variant selection alone diverges the price)"

      - name: storage_charge_calendar_vs_elapsed_24h
        grounds:
          - calculations.storage_charge
          - entities.PropertyStorageRecord.fields.billing_mode
        distinguishing_aspect: |
          Identical stored_at and reclaim instants produce different charges purely from the
          jurisdiction-selected variant on PropertyStorageRecord (storage domain, not court
          fees): CA CALENDAR_INCLUSIVE counts 2 days (3000), TX ELAPSED_24H counts 1 (1000).
        test_recipe:
          setup:
            - "One landlord with a CA unit and a TX unit, each driven through the full pipeline to an EXECUTED writ with a STORED storage record (stored_at 2026-08-01T09:00:00Z in both)"
            - "CA daily fee 1500 (CALENDAR_INCLUSIVE); TX daily fee 1000 (ELAPSED_24H)"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { uca: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "TX", street_address: "9 B St", unit_label: "B" }, as: Landlord, as_user_id: "${ll}", captures: { utx: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${uca}", tenant_full_name: "T CA", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { tca: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${utx}", tenant_full_name: "T TX", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { ttx: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${tca}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { cca: $.data.id, cvca: $.data.version } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${ttx}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { ctx: $.data.id, cvtx: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${cca}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 100000, expected_case_version: "${cvca}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/cases/${ctx}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 100000, expected_case_version: "${cvtx}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk }
            - { call: "POST /api/cases/${cca}/filing-packages", payload: { claimed_amount_cents: 100000, defendant_names: ["Dee A"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { pca: $.data.id } }
            - { call: "POST /api/cases/${ctx}/filing-packages", payload: { claimed_amount_cents: 100000, defendant_names: ["Dee B"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { ptx: $.data.id } }
            - { call: "POST /api/filing-packages/${pca}/fee-payments", payload: { amount_cents: 27250 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/filing-packages/${ptx}/fee-payments", payload: { amount_cents: 21750 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/filing-packages/${pca}/review", payload: { decision: "ACCEPT" }, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/filing-packages/${ptx}/review", payload: { decision: "ACCEPT" }, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${cca}/service-attempts", payload: { defendant_name: "Dee A", method: "PERSONAL", result: "SERVED", served_at: "2026-06-01T10:00:00Z" }, as: ProcessServer, as_user_id: "ps-1" }
            - { call: "POST /api/cases/${ctx}/service-attempts", payload: { defendant_name: "Dee B", method: "PERSONAL", result: "SERVED", served_at: "2026-06-01T10:00:00Z" }, as: ProcessServer, as_user_id: "ps-1" }
            - { call: "POST /api/cases/${cca}/hearings", payload: { courtroom: "CR-1", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T10:30:00Z" }, as: CourtClerk, as_user_id: "clerk-a", captures: { hca: $.data.id } }
            - { call: "POST /api/cases/${ctx}/hearings", payload: { courtroom: "CR-2", start_at: "2026-06-12T10:00:00Z", end_at: "2026-06-12T10:30:00Z" }, as: CourtClerk, as_user_id: "clerk-a", captures: { htx: $.data.id } }
            - { call: "POST /api/hearings/${hca}/conclude", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/hearings/${htx}/conclude", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${cca}/judgment", payload: { possession_granted: true, rent_awarded_cents: 50000, damages_cents: 0, late_fee_cents: 0, court_costs_cents: 0, oldest_unpaid_due_date: "2026-06-20" }, as: CourtClerk, as_user_id: "clerk-b", captures: { jca: $.data.id } }
            - { call: "POST /api/cases/${ctx}/judgment", payload: { possession_granted: true, rent_awarded_cents: 50000, damages_cents: 0, late_fee_cents: 0, court_costs_cents: 0, oldest_unpaid_due_date: "2026-06-20" }, as: CourtClerk, as_user_id: "clerk-b", captures: { jtx: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-25T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk, captures: { fin: $.data.judgments_finalized } }
            - { call: "POST /api/judgments/${jca}/writs", payload: { writ_fee_paid_cents: 4000 }, as: Landlord, as_user_id: "${ll}", captures: { wca: $.data.id } }
            - { call: "POST /api/judgments/${jtx}/writs", payload: { writ_fee_paid_cents: 3500 }, as: Landlord, as_user_id: "${ll}", captures: { wtx: $.data.id } }
            - { call: "POST /api/writs/${wca}/issue", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/writs/${wtx}/issue", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/writs/${wca}/schedule-lockout", payload: { deputy_id: "dep-1", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: SheriffDeputy, as_user_id: "dep-1" }
            - { call: "POST /api/writs/${wtx}/schedule-lockout", payload: { deputy_id: "dep-2", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: SheriffDeputy, as_user_id: "dep-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/writs/${wca}/execute", payload: { items_summary: "boxes" }, as: SheriffDeputy, as_user_id: "dep-1" }
            - { call: "POST /api/writs/${wtx}/execute", payload: { items_summary: "boxes" }, as: SheriffDeputy, as_user_id: "dep-2" }
            - { call: "GET /api/writs/${wca}/storage-records", payload: {}, as: CourtClerk, captures: { srca: "$.data[0].id" } }
            - { call: "GET /api/writs/${wtx}/storage-records", payload: {}, as: CourtClerk, captures: { srtx: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/storage-records/${srca}", payload: {}, as: SheriffDeputy, as_user_id: "dep-1", captures: { acc_ca: $.data.accrued_charge_cents } }
            - { call: "GET /api/storage-records/${srtx}", payload: {}, as: SheriffDeputy, as_user_id: "dep-2", captures: { acc_tx: $.data.accrued_charge_cents } }
            - { call: "POST /api/storage-records/${srca}/reclaim", payload: { charge_paid_cents: 3000 }, as: SheriffDeputy, as_user_id: "dep-1", captures: { fin_ca: $.data.final_charge_cents } }
            - { call: "POST /api/storage-records/${srtx}/reclaim", payload: { charge_paid_cents: 1000 }, as: SheriffDeputy, as_user_id: "dep-2", captures: { fin_tx: $.data.final_charge_cents } }
          assert:
            - "fin == 2 (both judgments finalized at exactly appeal_deadline)"
            - "acc_ca == 3000  (CALENDAR_INCLUSIVE: (2026-08-02 - 2026-08-01) + 1 = 2 days x 1500)"
            - "acc_tx == 1000  (ELAPSED_24H: ceil(23h / 24h) = 1 day x 1000)"
            - "fin_ca == 3000 and fin_tx == 1000 (same instants, different variant, different money)"
            - "both records status == RECLAIMED after reclaim"

  # Rule 2 — combinatorial formulas across different modes
  - rule_id: combinatorial_formula
    instances:
      - name: filing_fee_tier_boundary_and_surcharges
        grounds:
          - calculations.filing_fee
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the jurisdiction tier branch
          (claim 250000 uses <= and prices 24000; 250001 jumps to 32000) composes with a
          per-defendant surcharge, a conditional jury fee, and the variant adjustment.
          The sibling instance is mode (b) (rounding order), not another tiered formula.
        test_recipe:
          setup:
            - "One landlord, two CA units/tenancies/cases (NONPAYMENT) with notices expired to NOTICE_EXPIRED"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { ua: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "B" }, as: Landlord, as_user_id: "${ll}", captures: { ub: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${ua}", tenant_full_name: "T A", monthly_rent_cents: 300000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { ta: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${ub}", tenant_full_name: "T B", monthly_rent_cents: 300000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { tb: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${ta}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { ca: $.data.id, cva: $.data.version } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${tb}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { cb: $.data.id, cvb: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${ca}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 250000, expected_case_version: "${cva}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/cases/${cb}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 250001, expected_case_version: "${cvb}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk }
          trigger:
            - { call: "POST /api/cases/${ca}/filing-packages", payload: { claimed_amount_cents: 250000, defendant_names: ["Dee One"], jury_demanded: true, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { fee_a: $.data.filing_fee_cents } }
            - { call: "POST /api/cases/${cb}/filing-packages", payload: { claimed_amount_cents: 250001, defendant_names: ["Dee One"], jury_demanded: true, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { fee_b: $.data.filing_fee_cents } }
          assert:
            - "fee_a == 42250  (tier ceiling uses <=: 24000 + 2500 + 15000 jury + 750 STANDARD)"
            - "fee_b == 50250  (one cent over the ceiling: 32000 + 2500 + 15000 + 750)"

      - name: judgment_interest_per_diem_rounding
        grounds:
          - calculations.judgment_money
          - entities.Judgment.fields.interest_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the per-diem amount is rounded
          (round_half_up) FIRST, then multiplied by days. Rounding only at the end would
          give 274; the pinned order gives 270. The sibling instance is mode (a), not rounding.
        test_recipe:
          setup:
            - "One CA case driven to HEARING_CONCLUDED; logical clock at 2026-06-20T12:00:00Z for judgment entry"
            - "CA annual rate 0.10; principal 100034 cents; 10 days overdue"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { u: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${u}", tenant_full_name: "T A", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { t: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${t}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { c: $.data.id, cv: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/notices", payload: { notice_type: "PAY_OR_QUIT", served_on: "2026-05-02", claimed_rent_owed_cents: 100034, expected_case_version: "${cv}" }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /api/ops/runs", payload: {}, as: CourtClerk }
            - { call: "POST /api/cases/${c}/filing-packages", payload: { claimed_amount_cents: 100034, defendant_names: ["Dee A"], jury_demanded: false, efiled: false }, as: Landlord, as_user_id: "${ll}", captures: { p: $.data.id } }
            - { call: "POST /api/filing-packages/${p}/fee-payments", payload: { amount_cents: 27250 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/filing-packages/${p}/review", payload: { decision: "ACCEPT" }, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T11:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/cases/${c}/service-attempts", payload: { defendant_name: "Dee A", method: "PERSONAL", result: "SERVED", served_at: "2026-06-01T10:00:00Z" }, as: ProcessServer, as_user_id: "ps-1" }
            - { call: "POST /api/cases/${c}/hearings", payload: { courtroom: "CR-1", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T10:30:00Z" }, as: CourtClerk, as_user_id: "clerk-a", captures: { h: $.data.id } }
            - { call: "POST /api/hearings/${h}/conclude", payload: {}, as: CourtClerk, as_user_id: "clerk-a" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/cases/${c}/judgment", payload: { possession_granted: true, rent_awarded_cents: 100033, damages_cents: 1, late_fee_cents: 0, court_costs_cents: 0, oldest_unpaid_due_date: "2026-06-10" }, as: CourtClerk, as_user_id: "clerk-b", captures: { j: $.data.id, interest: $.data.interest_cents, total: $.data.total_awarded_cents } }
          assert:
            - "interest == 270  (daily = round_half_up(100034 * 0.10 / 365) = round_half_up(27.4068) = 27; 27 x 10 days = 270; multiply-then-round would give 274)"
            - "total == 100304  (100033 + 1 + 0 + 0 + 270, summed in pinned order)"
            - "Judgment.${j}.outstanding_balance_cents == 100304"
            - "Judgment.${j}.appeal_deadline == 2026-06-25T12:00:00Z (entered + CA 5 days)"

  # Rule 3 — non-linear state-machine shape on different entities
  - rule_id: non_linear_state_machine
    instances:
      - name: case_mediation_cycle
        grounds:
          - state_machines.EvictionCase.ANSWERED_to_MEDIATION_PENDING
          - state_machines.EvictionCase.MEDIATION_PENDING_to_HEARING_SCHEDULED
          - state_machines.Hearing.SCHEDULED_to_STAYED
        distinguishing_aspect: |
          EvictionCase cycles HEARING_SCHEDULED -> ANSWERED -> MEDIATION_PENDING ->
          HEARING_SCHEDULED on failed mediation (a loop, not a pipeline). The sibling
          instance's cycle lives on the Writ entity (ISSUED -> EXPIRED -> re-request).
        test_recipe:
          setup:
            - "One CA case in HEARING_SCHEDULED (hearing CR-1 2026-06-15 10:00-10:30); answer with mediation_requested filed; referral PENDING; hearing auto-STAYED"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
            - { call: "POST /api/units", payload: { landlord_id: "${ll}", jurisdiction_code: "CA", street_address: "1 A St", unit_label: "A" }, as: Landlord, as_user_id: "${ll}", captures: { u: $.data.id } }
            - { call: "POST /api/tenancies", payload: { unit_id: "${u}", tenant_full_name: "T A", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { t: $.data.id } }
            - { call: "POST /api/cases", payload: { tenancy_id: "${t}", case_reason: "NONPAYMENT" }, as: Landlord, as_user_id: "${ll}", captures: { c: $.data.id, cv: $.data.version } }
