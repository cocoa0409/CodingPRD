          Cascade C2, depth 3, triggered by a different transition (compliance
          review, not unit return): the distributor mutation (ACTIVE -> PROBATION)
          itself reverts every SPEC_REVIEW lease to DRAFT, and each lease revert
          itself voids that lease's VALUED appraisals — lease version reaches 3
          (create 1, submit 2, cascade revert 3) without any direct lease API call.
        test_recipe:
          setup:
