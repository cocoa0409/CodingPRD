            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /royalty-statements"
              payload: { title_id: "${ti}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { st: $.data.id }
            - call: "POST /royalty-statements/${st}/finalize"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements/${st}/finalize"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STATEMENT_NOT_PROVISIONAL"

  # =================================================================
  # Validations
  # =================================================================
  - section: validations
    instances:
      - name: listing_on_unpublished_title_returns_not_published
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_TITLE_NOT_PUBLISHED]"]
        distinguishing_aspect: "Creating a DistributionListing for a title still in DRAFT returns ERR_TITLE_NOT_PUBLISHED (409)."
        test_recipe:
          setup:
            - "A DRAFT title and a channel supporting US."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AV1", email: "av1@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
