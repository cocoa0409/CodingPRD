            - "immediately after q2 is issued: PayoffQuote.${q1}.status == SUPERSEDED and PayoffQuote.${q2}.status == ISSUED"
            - "GET /loans/${loan}/payoff-quotes?status=ISSUED returns total_count == 1 at that point"
            - "the cancellation quoting ${q1} returns HTTP 409 with error_id ERR_PAYOFF_QUOTE_NOT_ISSUED"
            - "the cancellation quoting ${q2} at exactly 2026-08-11T00:00:00Z returns HTTP 409 with error_id ERR_PAYOFF_QUOTE_EXPIRED"
            - "after both rejections InstallmentLoan.${loan}.status == ACTIVE and closure_reason == null"
            - "PayoffQuote.${q3}.issued_at == 2026-08-11T00:00:00Z and expires_at == 2026-08-18T00:00:00Z and total_payoff_cents == 36659"
            - "issuing q3 moves PayoffQuote.${q2}.status to SUPERSEDED"
            - "the cancellation quoting ${q3} at exactly its own issued_at returns HTTP 200"
            - "PayoffQuote.${q3}.status == CONSUMED with consumed_at == 2026-08-11T00:00:00Z"
            - "InstallmentLoan.${loan}.status == PAID_OFF with closure_reason PROGRAM_CANCELLATION"
            - "DeviceUnit.${dev}.unlock_status == UNLOCKED and CarrierAccount.${carr}.activation_state == PORT_ELIGIBLE"
            - "GET /loans/${loan}/payoff-quotes returns total_count == 3 with statuses SUPERSEDED, SUPERSEDED, CONSUMED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_loan_obligation_balance
        grounds:
          - calculations.payment_waterfall_allocation
          - state_machines.Installment.PAID_to_SCHEDULED
          - validations.priority_53_ERR_POSTING_ALREADY_REVERSED
          - entities.InstallmentLoan.fields.obligation_balance_cents
          - entities.PaymentPosting.fields.obligation_balance_after_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. The loan-level identity
          obligation_balance_cents + paid_principal_cents + paid_premium_cents ==
          principal_cents + premium_total_cents == 113876 must hold before the posting
          (56936 + 44952 + 11988), and the REVERSAL must restore every one of the three terms
          to its exact pre-posting value (113876 + 0 + 0) with zero drift — not merely
          re-derive the total. The drift trap is the pro-rata split: 44952 principal and 11988
          premium were produced by twelve independent round_half_up operations, so an
          implementation that reverses by recomputing 56940 * ratio instead of subtracting the
          stored per-installment allocations lands a cent or two off and breaks the identity.
          The second reversal attempt guards the other half of conservation: money may not be
          given back twice.
        test_recipe:
          setup:
            - "PRIME customer with an ACTIVE Handset B loan originated at the default clock 2026-08-01 (principal 89900, premium_total 23976, obligation 113876) and one PAYMENT of 56940 posted, which drives installments 1-12 to PAID."
            - "The clock never moves, so all 24 due dates remain in the future and no daily-run ever runs."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Xenia Duarte", email: "xenia.duarte@example.com", mobile_number: "+15550100024" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643827" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 56940 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "REVERSAL", amount_cents: 56940, reverses_posting_id: "${p1}" }
              as: CollectionsOfficer
              as_user_id: "u-coll-1"
              captures: { rev: "$.data.id" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "REVERSAL", amount_cents: 56940, reverses_posting_id: "${p1}" }
              as: CollectionsOfficer
              as_user_id: "u-coll-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "before the reversal: PaymentPosting.${p1}.allocated_principal_cents == 44952, allocated_premium_cents == 11988, allocated_late_fee_cents == 0, installments_satisfied_count == 12, overpayment_cents == 0, obligation_balance_after_cents == 56936"
            - "before the reversal: InstallmentLoan.${loan}.obligation_balance_cents == 56936, paid_principal_cents == 44952, paid_premium_cents == 11988, paid_installment_count == 12 (56936 + 44952 + 11988 == 113876)"
            - "the reversal returns HTTP 201"
            - "PaymentPosting.${rev}.posting_type == REVERSAL with reverses_posting_id == ${p1} and amount_cents == 56940"
            - "PaymentPosting.${rev}.allocated_principal_cents == 44952 and allocated_premium_cents == 11988 and allocated_late_fee_cents == 0"
            - "PaymentPosting.${rev}.installments_satisfied_count == 0 and overpayment_cents == 0"
            - "PaymentPosting.${rev}.obligation_balance_after_cents == 113876"
            - "after the reversal: InstallmentLoan.${loan}.paid_principal_cents == 0, paid_premium_cents == 0, paid_installment_count == 0, outstanding_late_fee_cents == 0"
            - "after the reversal: InstallmentLoan.${loan}.obligation_balance_cents == 113876 (113876 + 0 + 0 == 113876, zero drift)"
            - "after the reversal: InstallmentLoan.${loan}.status == ACTIVE, delinquency_state == CURRENT, days_past_due == 0"
            - "Installment(loan_id=${loan}, installment_number=1).status == SCHEDULED with paid_amount_cents 0, paid_principal_cents 0, paid_premium_cents 0, paid_at null"
            - "Installment(loan_id=${loan}, installment_number=12).status == SCHEDULED with paid_amount_cents 0 and paid_at null"
            - "GET /loans/${loan}/installments?status=SCHEDULED returns total_count == 24"
            - "Customer.${cust}.outstanding_principal_cents == 89900 and open_loan_count == 1"
            - "the second reversal returns HTTP 409 with error_id ERR_POSTING_ALREADY_REVERSED"
            - "after the refused second reversal InstallmentLoan.${loan}.obligation_balance_cents is still 113876 and GET /payment-postings?loan_id=${loan} returns total_count == 2"
            - "GET /payment-postings?reverses_posting_id=${p1} returns total_count == 1"

      - name: upgrade_window_expiry_restores_model_reserved_slot_count_and_loan_hold
        grounds:
          - calculations.model_reservation_capacity
          - state_machines.UpgradeRequest.TRADE_IN_DECLARED_to_EXPIRED
          - state_machines.DeviceUnit.possession_status.RETURN_PENDING_to_WITH_CUSTOMER
          - entities.DeviceModel.fields.reserved_slot_count
          - entities.InstallmentLoan.fields.upgrade_hold_flag
          - endpoints.POST_/servicing/daily-run
        distinguishing_aspect: |
          A different type of conserved quantity: not money but RESOURCE OCCUPANCY — the
          integer DeviceModel.reserved_slot_count together with the boolean
          InstallmentLoan.upgrade_hold_flag and the handset's possession_status, all of which
          must be handed back when a reservation dies of old age rather than of settlement.
          Conservation is proved constructively rather than by reading the counter: the target
          model has concurrent_reservation_capacity 1, so after the window
          [2027-06-27, 2027-07-04) elapses at exactly 2027-07-04 the very same loan must be
          able to reserve [2027-07-04, 2027-07-11) again; a leaked slot makes the second
          request fail with ERR_MODEL_CAPACITY_EXHAUSTED, and a leaked possession_status makes
          the re-declared trade-in impossible. The half-open window is load-bearing again:
          2027-07-04 is simultaneously the first instant the old reservation is expired and a
          legal start for the new one.
        test_recipe:
          setup:
            - "Handset A published with concurrent_reservation_capacity 1; PRIME customer with an ACTIVE Handset B loan originated 2026-08-01, handset ACTIVATED, 12 installments PAID (PAYMENT 56940)."
            - "At clock 2027-06-27 the customer opens an UpgradeRequest on Handset A for [2027-06-27, 2027-07-04) and declares the trade-in, so reserved_slot_count is 1, upgrade_hold_flag is true, the TradeIn is DECLARED and the handset's possession_status is RETURN_PENDING."
            - "No receipt is ever recorded, and the clock is then moved to exactly the window end 2027-07-04."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027, concurrent_reservation_capacity: 1 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Yusuf Karim", email: "yusuf.karim@example.com", mobile_number: "+15550100025" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643828" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /device-units"
              payload: { loan_id: "${loan}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { dev: "$.data[0].id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "ATT", account_number: "ACC-2810-0025" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /device-units/${dev}/activation"
              payload: { carrier_account_id: "${carr}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 56940 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-27T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /loans/${loan}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
