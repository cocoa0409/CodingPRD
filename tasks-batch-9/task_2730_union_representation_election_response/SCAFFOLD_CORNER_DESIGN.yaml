      - name: polling_action_endpoints_enforce_their_own_preconditions
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_election_rounds_id_open_polls
          - endpoints.POST_poll_sessions_id_close
          - errors.ERR_POLLS_NOT_YET_OPEN
          - errors.ERR_ROUND_STATUS_INVALID
          - errors.ERR_POLL_SESSION_STATUS_INVALID
        distinguishing_aspect: |
          Every action endpoint on the polling arc must refuse a premature or repeated call while leaving its
          counters untouched: open-polls one second before polls_open_at is ERR_POLLS_NOT_YET_OPEN (409), a
          second open-polls is ERR_ROUND_STATUS_INVALID (409), and closing an already CLOSED session is
          ERR_POLL_SESSION_STATUS_INVALID (409) rather than a silent re-write of votes_for_count. The
          scheduled/closed session counters must move by exactly one per successful close.
