scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: nqdc_accrual_versus_pbo_posture_divergence
        grounds:
          - calculations.nqdc_liability_valuation
          - entities.NqdcPlan.fields.funding_posture
          - entities.NqdcPlan.fields.funded_ratio_bps
          - entities.NqdcParticipantLiability.fields.discounted_benefit_usd
          - endpoints[GET /nqdc-plans/{id}/funding-summary]
        distinguishing_aspect: |
          The two variants of nqdc_liability_valuation are read off the SAME two participant
          liabilities and disagree on the plan's posture: the ACCRUAL basis sums undiscounted
          accrued_to_date_usd to 1100000.00 and reports UNDERFUNDED at 9091 bps, while the PBO
          basis sums per-participant discounted projected benefits to 1776294.83 and reports
          CRITICAL at 5630 bps.
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
            - "Carrier Northbridge AUTHORIZED with an APPROVED 2026 diligence review."
            - "One GENERAL NON_MEC product on that carrier."
            - "Employee Reyes with an EXECUTED consent covering 2026-08-01..2027-07-31."
            - "One IN_FORCE policy for Reyes with single_premium_usd 1000000.00 and cash_surrender_value_usd 1000000.00."
            - "NqdcPlan 'Executive SERP 2026' with discount_rate_bps 500 and two ACTIVE participant liabilities: Reyes accrued 600000.00 / projected 2000000.00 over 10 years matched to the policy, and Alvarez accrued 500000.00 / projected 700000.00 over 5 years unmatched."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
              captures: { cap_2026_id: $.data.id }
            - call: "POST /carriers"
              payload: { legal_name: "Northbridge Life Assurance", naic_code: "61111", am_best_rating: "A_PLUS", statutory_surplus_usd: 400000000.00, domicile_state: "NY" }
              as: PlatformAdmin
              captures: { carrier_nb_id: $.data.id }
            - call: "POST /product-types"
              payload: { carrier_id: "${carrier_nb_id}", product_name: "Northbridge General Account BOLI", account_type: "GENERAL", mec_status: "NON_MEC", disclosed_me_charge_bps: 20, guaranteed_min_crediting_bps: 100 }
              as: PlatformAdmin
              captures: { prod_nb_ga_id: $.data.id }
            - call: "POST /diligence-reviews"
              payload: { carrier_id: "${carrier_nb_id}", review_year: 2026 }
              as: BenefitsAnalyst
              captures: { rev_nb_2026_id: $.data.id }
            - call: "POST /diligence-reviews/${rev_nb_2026_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /diligence-reviews/${rev_nb_2026_id}/approve"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", employee_number: "E-1001", annual_salary_usd: 2000000.00, officer_flag: true }
              as: BenefitsAnalyst
              captures: { emp_reyes_id: $.data.id }
            - call: "POST /consent-records"
              payload: { employee_id: "${emp_reyes_id}", coverage_start_date: "2026-08-01T00:00:00Z", coverage_end_date: "2027-07-31T00:00:00Z", consent_form_reference: "CF-1001", notice_and_consent_version: "NC-2026.1" }
              as: BenefitsAnalyst
              captures: { consent_reyes_id: $.data.id }
            - call: "POST /consent-records/${consent_reyes_id}/execute"
              payload: {}
              as: BenefitsAnalyst
            - call: "POST /purchase-requests"
              payload: { carrier_id: "${carrier_nb_id}", product_type_id: "${prod_nb_ga_id}", employee_id: "${emp_reyes_id}", single_premium_usd: 1000000.00, face_amount_usd: 5000000.00, requested_effective_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { pr_reyes_id: $.data.id }
            - call: "POST /purchase-requests/${pr_reyes_id}/submit"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /purchase-requests/${pr_reyes_id}/clear-diligence"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "GET /carriers/${carrier_nb_id}"
              payload: {}
              as: TreasuryController
              captures: { carrier_nb_v_reserve: $.data.version }
            - call: "POST /purchase-requests/${pr_reyes_id}/reserve-capacity"
              payload: { expected_carrier_version: "${carrier_nb_v_reserve}" }
              as: TreasuryController
              as_user_id: "treasury-1"
            - call: "POST /purchase-requests/${pr_reyes_id}/request-concurrence"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /purchase-requests/${pr_reyes_id}/approve"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /policies"
              payload: { purchase_request_id: "${pr_reyes_id}", policy_number: "NB-0001", issue_date: "2026-08-15T00:00:00Z" }
              as: BenefitsAnalyst
              captures: { policy_reyes_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Kim Alvarez", employee_number: "E-1002", annual_salary_usd: 400000.00 }
              as: BenefitsAnalyst
              captures: { emp_alvarez_id: $.data.id }
            - call: "POST /nqdc-plans"
              payload: { plan_name: "Executive SERP 2026", plan_type: "SERP", discount_rate_bps: 500 }
              as: TreasuryController
              captures: { plan_serp_id: $.data.id }
            - call: "POST /nqdc-liabilities"
              payload: { nqdc_plan_id: "${plan_serp_id}", employee_id: "${emp_reyes_id}", matched_policy_id: "${policy_reyes_id}", accrued_to_date_usd: 600000.00, projected_benefit_usd: 2000000.00, years_to_payout: 10 }
              as: TreasuryController
              captures: { liab_reyes_id: $.data.id }
            - call: "POST /nqdc-liabilities"
              payload: { nqdc_plan_id: "${plan_serp_id}", employee_id: "${emp_alvarez_id}", accrued_to_date_usd: 500000.00, projected_benefit_usd: 700000.00, years_to_payout: 5 }
              as: TreasuryController
              captures: { liab_alvarez_id: $.data.id }
          trigger:
            - call: "GET /nqdc-plans/${plan_serp_id}/funding-summary"
              payload: {}
              as: TreasuryController
            - call: "GET /nqdc-plans/${plan_serp_id}/funding-summary"
              payload: { basis: "PBO" }
              as: TreasuryController
          assert:
            - "NqdcParticipantLiability.${liab_reyes_id}.discounted_benefit_usd == 1227826.51"
            - "NqdcParticipantLiability.${liab_alvarez_id}.discounted_benefit_usd == 548468.32"
            - "NqdcPlan.${plan_serp_id}.accrual_liability_usd == 1100000.00"
            - "NqdcPlan.${plan_serp_id}.pbo_liability_usd == 1776294.83"
            - "NqdcPlan.${plan_serp_id}.matched_cash_value_usd == 1000000.00"
            - "first trigger response data.basis == ACCRUAL"
            - "first trigger response data.basis_liability_usd == 1100000.00"
            - "first trigger response data.funded_ratio_bps == 9091"
            - "first trigger response data.funding_posture == UNDERFUNDED"
            - "second trigger response data.basis == PBO"
            - "second trigger response data.basis_liability_usd == 1776294.83"
            - "second trigger response data.funded_ratio_bps == 5630"
            - "second trigger response data.funding_posture == CRITICAL"
            - "NqdcPlan.${plan_serp_id}.funding_posture == UNDERFUNDED after the PBO read (the PBO variant is read-only and never overwrites the persisted ACCRUAL posture)"
            - "NqdcPlan.${plan_serp_id}.funded_ratio_bps == 9091"

      - name: mec_versus_non_mec_partial_surrender_cost_recovery
        grounds:
          - calculations.policy_taxable_gain
          - entities.ProductType.fields.mec_status
          - entities.ExchangeSurrenderAnalysis.fields.cost_recovery_method
          - entities.ExchangeSurrenderAnalysis.fields.taxable_gain_usd
          - endpoints[POST /exchange-analyses]
        distinguishing_aspect: |
          Two policies with byte-identical cost_basis_usd 1200000.00, cash_surrender_value_usd
          1500000.00 and policy_year 1 take a 500000.00 partial withdrawal; the NON_MEC product
          selects FIFO_BASIS_FIRST and yields taxable_gain_usd 0.00 with net_proceeds_usd
          470000.00, while the MEC product selects LIFO_INCOME_FIRST and yields taxable_gain_usd
          300000.00 with net_proceeds_usd 389000.00 — the only differing input is mec_status.
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
            - "Carrier Harborview AUTHORIZED with an APPROVED 2026 diligence review."
            - "Two GENERAL products on that carrier, both with disclosed_me_charge_bps 50: one NON_MEC and one MEC."
            - "Employee Vargas with an EXECUTED consent covering 2026-08-01..2027-07-31."
            - "Two IN_FORCE policies for Vargas, one per product, each with single_premium_usd 1200000.00, cost_basis_usd 1200000.00 and policy_year 1."
            - "One posted statement period per policy raising cash_surrender_value_usd to exactly 1500000.00 with me_drift_bps 0 and net_yield_bps 2500, so neither product leaves OPEN."
          setup_api_calls:
            - call: "POST /capital-positions"
              payload: { as_of_date: "2026-06-30T00:00:00Z", tier1_capital_usd: 1000000000.00, total_assets_usd: 12000000000.00 }
              as: TreasuryController
