              payload: { reason: "Post-payment review reopened the June claim for revision." }
              as: StateAgencyReviewer
          assert:
            - "Before the trigger: Sponsor.${sp_id}.advance_outstanding_cents == 55000, AdvancePayment.${adv_a}.recovered_amount_cents == 0 and status == DISBURSED, AdvancePayment.${adv_b}.recovered_amount_cents == 0 and status == DISBURSED"
            - "After pay: MealClaim.${cl_id}.status == PAID and final_reimbursement_cents == 26536"
            - "After pay: MealClaim.${cl_id}.advance_offset_cents == 26536 and net_payable_cents == 0"
            - "After pay: AdvancePayment.${adv_a}.recovered_amount_cents == 26536 and status == PARTIALLY_RECOVERED (30000 - 26536 == 3464 outstanding)"
            - "After pay: AdvancePayment.${adv_b}.recovered_amount_cents == 0 and status == DISBURSED (the 2026-06 advance fills first)"
            - "After pay: Sponsor.${sp_id}.advance_outstanding_cents == 28464 == (30000 - 26536) + (25000 - 0)"
            - "After open-revision: MealClaim.${cl_id}.status == REVISION_OPENED, revision_round == 1, advance_offset_cents == 0, net_payable_cents == 0, final_reimbursement_cents == 0"
            - "After open-revision: AdvancePayment.${adv_a}.recovered_amount_cents == 0 and status == DISBURSED; AdvancePayment.${adv_b}.recovered_amount_cents == 0 and status == DISBURSED"
            - "After open-revision: Sponsor.${sp_id}.advance_outstanding_cents == 55000 exactly (no drift), and the invariant advance_outstanding_cents == SUM(approved_amount_cents - recovered_amount_cents) holds at every checkpoint"

      - name: meal_count_reversal_conserves_day_counted_totals
        grounds:
          - calculations.point_of_service_meal_classification
          - entities.MealCountEntry.fields.entry_kind
          - entities.MealCountEntry.fields.reversal_of_entry_id
          - entities.MealServiceDay.fields.counted_first_meals
        distinguishing_aspect: |
          A different conserved quantity from the advance ledger: MealServiceDay.counted_first_meals must
          always equal the signed sum of its MealCountEntry rows' reimbursable_first_meals, so a REVERSAL
          entry mirroring an ORIGINAL entry of 47 returns the day total to 0 by appending a -47 row rather
          than mutating or deleting the original.
        test_recipe:
          setup:
            - "Sponsor APPROVED; one rural SELF_PREP site APPROVED and OPERATING approved for LUNCH."
            - "MealServiceDay 2026-06-08 OPEN with production_counts { LUNCH: 150 } and food_received_at 2026-06-08T10:30:00Z."
            - "One ORIGINAL MealCountEntry recording 47 LUNCH first meals, 0 second meals, 0 adult meals."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/area-eligibility-records"
              payload: { area_code: "CT-0031", data_source: "SCHOOL_DATA", free_reduced_pct: 62.50, determination_date: "2026-03-15", valid_through_date: "2031-06-30" }
              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Riverbend Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
            - call: "POST /sfsp/sites/${site_id}/eligibility-determination"
              payload: {}
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/meal-service-days"
              payload: { site_id: "${site_id}", service_date: "2026-06-08", meal_services: [{ meal_type: "LUNCH", planned_meals: 150, service_start: "11:30", service_end: "12:30" }] }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /sfsp/meal-service-days/${d1_id}/open"
              payload: { production_counts: { LUNCH: 150 }, food_received_at: "2026-06-08T10:30:00Z" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
            - call: "POST /sfsp/meal-service-days/${d1_id}/meal-counts"
              payload: { meal_type: "LUNCH", first_meals: 47, second_meals: 0, adult_meals: 0 }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { mc_orig: $.data.id }
          trigger:
            - call: "POST /sfsp/meal-service-days/${d1_id}/meal-counts"
              payload: { meal_type: "LUNCH", first_meals: 47, second_meals: 0, adult_meals: 0, reversal_of_entry_id: "${mc_orig}" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { mc_rev: $.data.id }
          assert:
            - "Before the trigger: MealCountEntry.${mc_orig}.entry_kind == ORIGINAL and reimbursable_first_meals == 47 and MealServiceDay.${d1_id}.counted_first_meals == 47"
            - "HTTP status == 201"
            - "MealCountEntry.${mc_rev}.entry_kind == REVERSAL and reversal_of_entry_id == ${mc_orig}"
            - "MealCountEntry.${mc_rev}.reimbursable_first_meals == -47 and reimbursable_second_meals == 0 and non_reimbursable_meals == 0"
            - "MealServiceDay.${d1_id}.counted_first_meals == 0 and counted_second_meals == 0"
            - "MealCountEntry.${mc_orig}.reimbursable_first_meals == 47 still (the original row was not mutated)"
            - "GET /sfsp/meal-count-entries?meal_service_day_id=${d1_id} returns total_count == 2, and MealServiceDay.counted_first_meals equals the signed sum of their reimbursable_first_meals"
