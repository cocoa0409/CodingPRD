            - "the cycle roll advanced Subscriber.${sub_id}.version past ${sub_v_stale}"
            - "the response status is 412 and err == ERR_STALE_VERSION"
            - "err != ERR_PORT_IN_FLIGHT, because no port was submitted"
            - "Subscriber.${sub_id}.subscriber_status is still ACTIVE and its term still ACTIVE"
            - "cancelling with the subscriber's current version succeeds and reports CHURNED"
            - "the two calls were strictly sequential, so the version check alone produced the rejection"

      - name: cancel_on_an_already_cancelled_port_is_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PORT_ALREADY_TERMINAL
          - validations[priority=7]
          - state_machines.Activation.SUBMITTED_to_CANCELLED
        distinguishing_aspect: "A second port cancellation on a row already CANCELLED is refused with 409 ERR_PORT_ALREADY_TERMINAL rather than re-running the release side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3 with a submitted port that is then cancelled."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_submit_port2
              call: "POST /carriers/activations/${act_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "6001" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_cancel_port2
              call: "POST /carriers/activations/${act_id}/cancel-port"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/activations/${act_id}/cancel-port"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first cancel succeeded and the activation reports port_status == CANCELLED with held_data_mb == 0"
            - "the response status is 409 and err == ERR_PORT_ALREADY_TERMINAL"
            - "err != ERR_INVALID_STATE, because the terminal-state rule names this case specifically"
            - "the agreement's allocated_data_mb is still 3000 and did not move on the refused call"
            - "rejecting the same cancelled port also fails with ERR_PORT_ALREADY_TERMINAL"

      - name: retail_channel_mismatch_is_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=24]
          - errors.ERR_RETAIL_CHANNEL_MISMATCH
          - entities.Activation.fields.retail_partner_id
        distinguishing_aspect: "retail_partner_id must be present exactly when the channel is RETAIL_PARTNER, so supplying it for a DIGITAL activation is refused with 422 ERR_RETAIL_CHANNEL_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3, one CA subscriber with a purchased term, and one CA-authorized partner."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - &c_partner_ca2
              call: "POST /carriers/retail-partners"
              payload: { partner_name: "Corner Wireless Retail", partner_state_codes: ["CA"] }
              as: CapacityPlanner
              captures: { partner_id: $.data.id }
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_id}", prepaid_term_id: "${term_id}", activation_channel: "DIGITAL", retail_partner_id: "${partner_id}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_RETAIL_CHANNEL_MISMATCH"
            - "omitting retail_partner_id for a RETAIL_PARTNER activation is also refused with ERR_RETAIL_CHANNEL_MISMATCH"
            - "a DIGITAL activation with no partner id is accepted"
            - "a RETAIL_PARTNER activation naming an ACTIVE CA partner is accepted"
            - "err != ERR_PARTNER_NOT_FOUND, because the supplied partner exists and only the pairing is wrong"

      - name: fulfillment_lookup_of_an_unknown_shipment_shape_returns_not_found
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SIM_INVENTORY_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "Each sub-resource carries its own not-found code, so an unknown inventory id and an unknown case id produce different error_ids rather than a shared generic one."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /carriers/sim-inventories/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FulfillmentOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_SIM_INVENTORY_NOT_FOUND"
            - "GET /carriers/support-cases/00000000-0000-4000-8000-000000000000 returns ERR_CASE_NOT_FOUND"
            - "GET /carriers/cycles/00000000-0000-4000-8000-000000000000 returns ERR_CYCLE_NOT_FOUND"
            - "GET /carriers/add-ons/00000000-0000-4000-8000-000000000000 returns ERR_ADDON_NOT_FOUND"
            - "every code is distinct, so no single generic not-found is acceptable"
            - "the same fingerprint on a POST body foreign key resolves left to right and reports the first missing one"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: activation_provision_reserves_exactly_one_unit_and_stamps_the_number
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/carriers/activations/{id}/provision
          - state_machines.SimInventory.AVAILABLE_to_RESERVED_PREPAID
        distinguishing_aspect: "A single provision call reserves exactly one unit, stamps provisioned_msisdn and, on the retail channel, copies the partner's SLA onto the block, all in one request."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3, a 4-unit CA eSIM block, a CA-authorized partner with shipment_sla_days 3, and two CA subscribers with purchased terms."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_partner_ca2
            - &c_inv_four
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 4 }
              as: CapacityPlanner
              captures: { inv_four_id: $.data.id }
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - &c_sub_digital
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550081", full_name: "Retail Rider", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_retail_id: $.data.id }
            - &c_term_digital
              call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_retail_id}", plan_id: "${plan_id}", expected_CapacityAgreement_version: "${ag_v0}" }
              as: Subscriber
              as_user_id: "${sub_retail_id}"
              captures: { term_retail_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_retail_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_retail_id}"
            - &c_act_retail
              call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_retail_id}", prepaid_term_id: "${term_retail_id}", activation_channel: "RETAIL_PARTNER", retail_partner_id: "${partner_id}" }
              as: Subscriber
              as_user_id: "${sub_retail_id}"
              captures: { act_retail_id: $.data.id }
          trigger:
            - call: "POST /carriers/activations/${act_retail_id}/provision"
