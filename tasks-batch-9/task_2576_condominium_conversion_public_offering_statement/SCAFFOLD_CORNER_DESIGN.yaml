        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-unit]
          - errors[ERR_STALE_UNIT_VERSION]
          - validations[priority 17]
          - validations[priority 25]
          - endpoints[POST /units/{id}/purchase-agreements]
          - entities.Unit.fields.version
        distinguishing_aspect: "The OCC guard on expected_unit_version sits at priority 17 and therefore
          fires BEFORE the priority-25 POS-effectiveness gate: on a project with no EFFECTIVE statement at
          all, a stale expected_unit_version must still yield 412 ERR_STALE_UNIT_VERSION, and only after
          the version is corrected does the same request fall through to 409 ERR_POS_NOT_EFFECTIVE. An
          implementation that checks business preconditions first would report ERR_POS_NOT_EFFECTIVE for
          both calls and never expose the stale-version path; one that swallows the OCC field would return
          409 for the first call too. Neither attempt may create a PurchaseAgreement or move
          Unit.sale_status off UNSOLD."
        test_recipe:
          setup:
            - "A project with a DRAFT DeclarationPackage holding one INCLUDED Unit at 10000 bp and no
              PublicOfferingStatement, whose unit version is read once (1) before the writes."
          setup_api_calls:
