            - call: "POST /novice-teachers"
              payload: { site_id: "${site_closed_id}", cohort_id: "${cohort_id}", full_name: "Ira Vance", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
          assert:
            - "the first call returns HTTP 201 with data.program_status == \"ENROLLED\" and data.site_id == \"${site_open_id}\""
            - "the second call returns HTTP 422 with data.error_id == \"ERR_SITE_CLOSED\""
