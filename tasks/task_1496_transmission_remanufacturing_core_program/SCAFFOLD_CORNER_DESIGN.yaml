scaffold_corner_design:
  # ===========================================================================
  # Section: entities (creation, defaults, not-found, enum, computed fields)
  # ===========================================================================
  - section: entities
    instances:
      - name: model_create_missing_required_model_code_rejected
        claim_type: required_fields
        grounds: [entities.TransmissionModel.fields.model_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/transmission-models without model_code is rejected 400 ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/transmission-models"
              payload: { year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: model_create_applies_defaults
        claim_type: defaults
        grounds: [entities.TransmissionModel.fields.warranty_days, entities.TransmissionModel.fields.spec_version]
        distinguishing_aspect: "Omitting optional warranty_days applies the declared default 365; system field spec_version initializes to 1 and any client-supplied value is ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          assert:
            - "TransmissionModel.${m_id}.warranty_days == 365"
            - "TransmissionModel.${m_id}.spec_version == 1"
            - "TransmissionModel.${m_id}.version == 1"

      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]", "endpoints[GET /api/reman-orders/{id}]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_ORDER_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/reman-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 404 and error_id == ERR_ORDER_NOT_FOUND"

      - name: order_create_applies_system_defaults
        claim_type: system_fields
        grounds: [entities.RemanOrder.fields.status, entities.RemanOrder.fields.cal_status, entities.RemanOrder.fields.core_settlement_status]
        distinguishing_aspect: "A freshly created order starts in QUEUED with cal_status NONE, core_settlement_status PENDING, dyno_attempts_used 0, empty reserved_parts, and the model's spec pinned."
        test_recipe:
          setup: ["one MIN transmission model exists"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
          assert:
            - "RemanOrder.${o_id}.status == QUEUED"
            - "RemanOrder.${o_id}.cal_status == NONE and cal_generation == 0"
            - "RemanOrder.${o_id}.core_settlement_status == PENDING"
            - "RemanOrder.${o_id}.dyno_attempts_used == 0 and reserved_parts == []"
            - "RemanOrder.${o_id}.model_spec_version_pin == 1"
            - "RemanOrder.${o_id}.version == 1"

      - name: interchange_invalid_tier_enum_rejected
        claim_type: type_constraints
        grounds: [entities.InterchangeMapping.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "tier value outside {DIRECT, ADAPTED} is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one model and one hard part exist"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p_id}", transmission_model_id: "${m_id}", tier: "SIDEWAYS" }
              as: InventoryPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: computed_availability_reflects_reservations
        claim_type: computed_fields
        grounds: [entities.HardPart.fields.availability, calculations.parts_reservation_allocation]
        distinguishing_aspect: "The computed availability field (qty_on_hand - qty_reserved) reflects a reservation immediately: on_hand 5, reserved 2 -> availability 3."
        test_recipe:
          setup: ["model FULL requires 2x PUMP; P1 DIRECT on_hand 5; order kitted into ASSEMBLY"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
          trigger:
            - call: "GET /api/hard-parts/${p1_id}"
              as: Any
          assert:
            - "HardPart.${p1_id}.qty_on_hand == 5"
            - "HardPart.${p1_id}.qty_reserved == 2"
            - "HardPart.${p1_id}.availability == 3"

      - name: interchange_duplicate_pair_rejected
        claim_type: violation_to_error
        grounds: [entities.InterchangeMapping.fields.tier, "errors[ERR_DUPLICATE_INTERCHANGE]", "validations[priority=9]"]
        distinguishing_aspect: "A second mapping for the same (hard_part_id, transmission_model_id) pair is rejected 409 ERR_DUPLICATE_INTERCHANGE regardless of tier."
        test_recipe:
          setup: ["one model, one part, one DIRECT mapping between them"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
          trigger:
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p_id}", transmission_model_id: "${m_id}", tier: "ADAPTED" }
              as: InventoryPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_DUPLICATE_INTERCHANGE"

  # ===========================================================================
  # Section: state_machines (invalid transitions, terminal lockdown, side fx)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_assembly_from_queued_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RemanOrder.transitions.ASSEMBLY_to_CALIBRATION, "errors[ERR_ORDER_NOT_READY_FOR_ASSEMBLY]"]
        distinguishing_aspect: "complete-assembly on a QUEUED order (kit never reserved) is rejected 409; the trigger from ASSEMBLY only."
        test_recipe:
          setup: ["one MIN model; one order in QUEUED"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_ORDER_NOT_READY_FOR_ASSEMBLY"
            - "RemanOrder.${o_id}.status == QUEUED (unchanged)"

      - name: cancel_shipped_order_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.RemanOrder.transitions.DYNO_PASSED_to_SHIPPED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "SHIPPED is terminal for the build lifecycle: cancel is rejected 409 ERR_ORDER_NOT_CANCELLABLE and no side effects fire."
        test_recipe:
          setup: ["one MIN order driven to SHIPPED"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
          trigger:
            - call: "POST /api/reman-orders/${o_id}/cancel"
              as: RemanPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "RemanOrder.${o_id}.status == SHIPPED (unchanged)"

      - name: verify_without_draft_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RemanOrder.transitions.CALIBRATION_to_DYNO_QUEUE, "errors[ERR_CAL_NOT_DRAFT]"]
        distinguishing_aspect: "verify-calibration while cal_status == NONE (no draft ever written) is rejected 409 ERR_CAL_NOT_DRAFT even though the order is in CALIBRATION."
        test_recipe:
          setup: ["one MIN order in CALIBRATION; no calibration draft written"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
          trigger:
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_CAL_NOT_DRAFT"
            - "RemanOrder.${o_id}.status == CALIBRATION (unchanged)"

      - name: ship_consumes_reserved_parts
        claim_type: side_effect_execution
        grounds: [state_machines.RemanOrder.transitions.DYNO_PASSED_to_SHIPPED, entities.HardPart.fields.qty_on_hand]
        distinguishing_aspect: "Shipping consumes reservations: HardPart qty_on_hand drops 5 -> 3 and qty_reserved drops 2 -> 0; availability is unchanged by consumption (3 before ship, 3 after)."
        test_recipe:
          setup: ["model FULL requires 2x PUMP; P1 DIRECT on_hand 5; order kitted (reserved 2) and driven to DYNO_PASSED"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
          trigger:
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/hard-parts/${p1_id}"
              as: Any
          assert:
            - "RemanOrder.${o_id}.status == SHIPPED and shipped_at == 2026-08-01T00:00:00Z (logical clock)"
            - "HardPart.${p1_id}.qty_on_hand == 3 and qty_reserved == 0"
            - "HardPart.${p1_id}.availability == 3 (unchanged by consumption)"

      - name: marginal_verdict_keeps_state_and_calibration
        claim_type: conditional_cascade
        grounds: [state_machines.RemanOrder.transitions.DYNO_QUEUE_to_DYNO_QUEUE, entities.DynoTestRun.fields.verdict]
        distinguishing_aspect: "A MARGINAL verdict (score 80.0) does NOT supersede the calibration and does NOT change status - only the attempt counter and last score move."
        test_recipe:
          setup: ["one MIN order in DYNO_QUEUE with covering booking"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
          trigger:
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [190, 220, 240, 260] }
              as: DynoOperator
              captures: { r_id: "$.data.id" }
          assert:
            - "DynoTestRun.${r_id}.shift_quality_score == 80.0 and verdict == MARGINAL"
            - "RemanOrder.${o_id}.status == DYNO_QUEUE"
            - "RemanOrder.${o_id}.cal_status == VERIFIED (not superseded)"
            - "RemanOrder.${o_id}.dyno_attempts_used == 1"

      - name: dispute_from_open_invoice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CoreDepositInvoice.transitions.SETTLED_PARTIAL_to_DISPUTED, "errors[ERR_INVOICE_NOT_DISPUTABLE]"]
        distinguishing_aspect: "Dispute is only legal from SETTLED_PARTIAL or FORFEITED; an OPEN invoice (core not yet returned) rejects with 409 ERR_INVOICE_NOT_DISPUTABLE."
        test_recipe:
          setup: ["one MIN order SHIPPED; invoice OPEN with no core registered"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o_id}/ship"
              as: RemanPlanner
            - call: "GET /api/core-deposit-invoices?reman_order_id=${o_id}"
              as: Any
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/core-deposit-invoices/${inv_id}/dispute"
              as: CoreIntakeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_INVOICE_NOT_DISPUTABLE"
            - "CoreDepositInvoice.${inv_id}.status == OPEN (unchanged)"

  # ===========================================================================
  # Section: calculations (boundaries, tiers, constants)
  # ===========================================================================
  - section: calculations
    instances:
      - name: inspection_grade_boundary_30_vs_35
        claim_type: correct_result
        grounds: [calculations.core_grade_and_credit]
