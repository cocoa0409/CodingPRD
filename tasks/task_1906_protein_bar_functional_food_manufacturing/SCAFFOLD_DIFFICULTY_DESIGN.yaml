            - { call: "POST /mfg/revisions/${rs}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rs}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rs}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/shelf-life-studies", payload: { revision_id: "${rs}", chamber_id: "CH1", shelf_position: "P1", start_utc: "2026-08-01T00:00:00Z", expiry_utc: "2026-10-30T00:00:00Z", hardness_limit_n: 200.0, pull_interval_days: 7 }, as: LabTechnician, captures: { st1: "$.data.id" } }
