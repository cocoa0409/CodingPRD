      - name: specification_correction_cycle_returns_to_submitted
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.MeasurementSpec.status.CORRECTION_REQUESTED_to_SUBMITTED
          - state_machines.MeasurementSpec.status.SUBMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / spec_correction_loop_returns_to_submitted
          rationale: "That instance runs the SUBMITTED -> CORRECTION_REQUESTED -> SUBMITTED loop to the MAX_CORRECTION_ROUNDS termination condition and asserts the revision_round and vendor-debit trail of every lap."

      - name: listing_and_readiness_axes_change_independently
        claim_type: parallel_independent_dimensions
        grounds:
          - state_machines.CatalogItem.listing_status
          - state_machines.CatalogItem.fit_readiness
        excluded_because:
          difficulty_instance: non_linear_state_machine / item_listing_and_fit_readiness_axes_advance_independently
          rationale: "That instance advances each axis while pinning the other unchanged, including a full fit_readiness cycle on a DRAFT item and a listing move on an UNVERIFIED item."

      - name: chronic_flip_side_effects_reach_specification_and_vendor
        claim_type: side_effect_execution
        grounds:
          - state_machines.CatalogItem.listing_status.LISTED_to_SUSPENDED
          - state_machines.MeasurementSpec.status.VERIFIED_to_CORRECTION_REQUESTED
        excluded_because:
          difficulty_instance: transitive_cascade / chronic_flip_cascade_suspends_listing_reopens_spec_and_debits_vendor
          rationale: "That instance asserts the full four-level cascade fired by one resolve: score recompute, listing suspension, specification reopening and the vendor debit with the re-derived reliability score."

      - name: chart_retirement_supersedes_mapping_and_unpublishes_item
        claim_type: valid_transition
        grounds:
          - state_machines.SizeChart.status.STANDARDIZED_to_RETIRED
          - state_machines.CatalogItem.fit_readiness.GUIDANCE_READY_to_UNVERIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / chart_retirement_cascade_defunds_intervention
          rationale: "That instance retires a STANDARDIZED chart and asserts the mapping supersession with CHART_RETIRED, the fit_readiness demotion, the deployment termination with MAPPING_SUPERSEDED and the intervention funding_posture recompute."

      - name: resolve_precondition_blocked_purchaser_lands_on_denied
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReturnCase.status.FIT_REVIEW_to_RESOLVED_DENIED
          - calculations.customer_abuse_and_policy_class
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / resolve_denies_refund_when_purchaser_blocked
          rationale: "That instance drives the purchaser to BLOCKED between classify and resolve and asserts the guarded fork onto RESOLVED_DENIED with a two-row ledger and a KEPT order line."

  - section: calculations
    instances:
      - name: chronic_score_with_zero_units_sold_stays_normal
        claim_type: input_set_filtering
        grounds:
          - calculations.item_chronic_return_score
          - entities.CatalogItem.fields.chronic_return_score_bp
          - entities.CatalogItem.fields.fit_watch_state
        distinguishing_aspect: |
          With units == 0 the two rate steps short-circuit to 0 instead of dividing by zero, so a
          never-sold item reads fit_return_rate_bp 0, expectation_return_rate_bp 0,
          chronic_return_score_bp 0 and fit_watch_state NORMAL - the WATCH branch is not entered
          even though its minimum-fit-returns guard is also unmet.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item and no OrderLine and no ReturnCase anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
          trigger:
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures:
                units: $.data.units_sold_count
                fit_rate: $.data.fit_return_rate_bp
                exp_rate: $.data.expectation_return_rate_bp
                score: $.data.chronic_return_score_bp
                watch: $.data.fit_watch_state
          assert:
            - "${units} == 0"
            - "${fit_rate} == 0"
            - "${exp_rate} == 0"
            - "${score} == 0"
            - "${watch} == \"NORMAL\""
            - "CatalogItem.${item_id}.fit_return_count == 0"
            - "CatalogItem.${item_id}.expectation_return_count == 0"
            - "CatalogItem.${item_id}.total_return_count == 0"
            - "CatalogItem.${item_id}.listing_status == \"LISTED\""

      - name: effective_window_days_floors_at_seven_for_restricted_customer
        claim_type: constants_applied
        grounds:
          - calculations.customer_abuse_and_policy_class
