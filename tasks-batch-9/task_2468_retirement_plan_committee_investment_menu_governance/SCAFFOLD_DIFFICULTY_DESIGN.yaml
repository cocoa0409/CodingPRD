  - rule_id: compensating_invariant
    instances:
      - name: rescind_approval_restores_capacity_triple_exactly
        grounds:
          - calculations.menu_slot_capacity
          - calculations.menu_posture
          - state_machines.FundReplacementProposal.UNDER_REVIEW_to_APPROVED
          - state_machines.FundReplacementProposal.APPROVED_to_UNDER_REVIEW
          - state_machines.AssetClassSlot.ACTIVE_to_PENDING_REPLACEMENT
          - validations[priority=80]
          - validations[priority=46]
          - entities.Plan.fields.occupied_menu_slots
          - entities.Plan.fields.reserved_menu_slots
          - entities.Plan.fields.available_menu_slots
        distinguishing_aspect: |
          Approving a proposal moves one unit from available to reserved without touching occupied, so
          the last free slot disappears and a seat-fund elsewhere fails with ERR_MENU_CAPACITY_EXHAUSTED;
          rescind-approval restores the triple to bit-identical pre-approve values (4/0/1) and re-frees
          that slot, and the same seat-fund then succeeds.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; Plan.menu_slot_capacity 5, charter ADOPTED, IPS-2026-T ADOPTED, two ACTIVE trained members."
            - "Four ACTIVE slots seating four CLEAR funds (US_LARGE_CAP, CORE_BOND, INTL_DEVELOPED, EMERGING_MKTS) plus one EMPTY TIPS slot; capacity triple is occupied 4 / reserved 0 / available 1."
            - "Two extra CANDIDATE funds: TVLG2 (US_LARGE_CAP, the incoming replacement) and TVTIP (TIPS, for the empty slot)."
            - "One FundReplacementProposal on the US_LARGE_CAP slot in status UNDER_REVIEW, authorised by a CARRIED FUND_REPLACEMENT motion whose meeting is MINUTES_APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
