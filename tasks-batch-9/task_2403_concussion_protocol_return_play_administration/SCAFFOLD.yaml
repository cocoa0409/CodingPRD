  # ---- ProtocolAudit --------------------------------------------------------
  - method: POST
    path: /concussion-program/protocol-audits
    roles: [LeagueAuditor]
    input: [club_id, "case_id?", "sideline_evaluation_id?"]
    output: ProtocolAudit
    status: 201
    side_effects:
      - "sets status = OPEN, auto_opened = false, opened_by_user_id = X-User-ID, disposition = PENDING, assessed_fine_cents = 0, response_round_count = 0, violation_codes = []"
      - "increments Club.open_violation_count by 1 and Club.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CLUB_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_EVALUATION_NOT_FOUND]

  - method: POST
    path: /concussion-program/protocol-audits/{id}/findings
    roles: [LeagueAuditor]
    input: [violation_codes, exposure_days]
    output: ProtocolAudit
    status: 200
    side_effects:
      - "PINNED ORDER: stamps escalation_tier_at_issuance from the tier band of the club's compliance_score recomputed with THIS audit excluded, stores violation_codes and exposure_days, computes assessed_fine_cents, sets status = FINDINGS_ISSUED with findings_issued_at = now and findings_issued_by_user_id = X-User-ID, then runs club_posture_propagation"
      - "club_posture_propagation may drop compliance_score, raise escalation_tier, move Club.status to PROBATION or SANCTIONED, set heightened_review_required on the club's open cases and freeze RTP_IN_PROGRESS / PENDING_INC_CLEARANCE cases into STAGE_FROZEN"
      - "increments ProtocolAudit.version, Club.version and the version of every frozen ConcussionCase by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_AUDIT_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES, ERR_CLUB_FINE_CAP_EXCEEDED]

  - method: POST
    path: /concussion-program/protocol-audits/{id}/respond
    roles: [ClubComplianceOfficer]
    input: [response_note]
    output: ProtocolAudit
    status: 200
    side_effects:
      - "sets status = CLUB_RESPONDED, club_response_note, response_round_count += 1; compliance figures are unchanged"
      - "increments ProtocolAudit.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_CLUB_SCOPE_VIOLATION, ERR_AUDIT_STATE_INVALID, ERR_AUDIT_RESPONSE_ROUNDS_EXHAUSTED]

  - method: POST
    path: /concussion-program/protocol-audits/{id}/close
    roles: [LeagueAuditor]
    input: [disposition, "closing_note?"]
    output: ProtocolAudit
    status: 200
    side_effects:
      - "UPHELD -> status = CLOSED_UPHELD; compliance_score and outstanding_fine_cents are unchanged while adjudicated_compliance_score drops"
      - "DISMISSED -> status = CLOSED_DISMISSED with assessed_fine_cents reset to 0; club_posture_propagation restores compliance_score, outstanding_fine_cents, escalation_tier and Club.status and unfreezes every case to its frozen_from_status"
      - "increments ProtocolAudit.version, Club.version and the version of every restored ConcussionCase by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_AUDIT_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

  - method: GET
    path: /concussion-program/protocol-audits/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: []
    output: ProtocolAudit
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /concussion-program/protocol-audits
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
    input: ["club_id?", "case_id?", "sideline_evaluation_id?", "status?", "auto_opened?", "limit?", "offset?"]
    output: ProtocolAudit[]
    status: 200
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # ---- InjuryReportEntry ----------------------------------------------------
  - method: POST
    path: /concussion-program/injury-report-entries
    roles: [ClubComplianceOfficer]
    input: [game_id, player_id, practice_participation, designation]
    output: InjuryReportEntry
    status: 201
    side_effects:
      - "stamps club_id from the player, filed_at = now and required_designation from public_designation_resolution"
      - "sets status = FILED inside the window, or LATE_FILED from kickoff_at - 90min onwards"
      - "on LATE_FILED: opens an auto ProtocolAudit with violation_codes = [LATE_INJURY_REPORT], advances it to FINDINGS_ISSUED and runs club_posture_propagation"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_GAME_NOT_FOUND, ERR_PLAYER_NOT_FOUND, ERR_CLUB_SCOPE_VIOLATION, ERR_PLAYER_CLUB_MISMATCH, ERR_REPORT_WINDOW_NOT_OPEN, ERR_REPORT_WINDOW_CLOSED, ERR_INJURY_DESIGNATION_MISMATCH, ERR_DUPLICATE_INJURY_REPORT]

  - method: POST
    path: /concussion-program/injury-report-entries/{id}/amend
    roles: [ClubComplianceOfficer]
    input: [practice_participation, designation]
    output: InjuryReportEntry
    status: 200
    side_effects:
      - "sets status = AMENDED, amended_at = now, amended_from_designation = the previous designation, and re-stamps required_designation"
      - "increments InjuryReportEntry.version by 1; an already-issued late-filing audit is NOT withdrawn"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_CLUB_SCOPE_VIOLATION, ERR_RESOURCE_STATE_INVALID, ERR_REPORT_WINDOW_CLOSED, ERR_INJURY_DESIGNATION_MISMATCH]

  - method: GET
    path: /concussion-program/injury-report-entries/{id}
    roles: [LeagueAdmin, LeagueAuditor, ClubPhysician, ClubComplianceOfficer, IndependentConsultant, UnaffiliatedObserver]
