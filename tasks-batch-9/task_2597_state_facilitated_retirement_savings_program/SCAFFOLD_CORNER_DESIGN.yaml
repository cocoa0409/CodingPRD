            - "the first trigger call does not return data.error_id == ERR_PENALTY_NOT_FOUND"
            - "the second trigger call returns status == 404 with data.error_id == ERR_PENALTY_NOT_FOUND"

      - name: permissible_withdrawal_requested_after_the_window_is_rejected
