            - call: "POST /housing/hotel-blocks/${block_id}/terms"
              payload: { negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20, expected_hotel_block_version: "${block_v1}" }
              as: BureauCoordinator
              captures: { block_v2: $.data.version }
            - call: "POST /housing/hotel-blocks/${block_id}/contract"
              payload: { confirmation_number: "CN-SUM26-048" }
              as: HotelManager
              as_user_id: "${hotel_id}"
