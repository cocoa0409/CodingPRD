  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: promotion_confirmation_cascade
        grounds:
          - state_machines.PromotionEvent
          - state_machines.CapacityPlan
          - state_machines.PurchaseOrder
        distinguishing_aspect: |
          Depth-3 cascade from POST promotions/{id}/confirm: PromotionEvent → CONFIRMED
          triggers SupplyCenter.posture = SURGE_MODE AND Center.surge_capacity_multiplier
          update, which triggers CapacityPlan.surge_units recompute for affected weeks,
          which (via available_units) gates subsequent PO confirmations. Each link is
          caused by the previous one, not fan-out from the original call.
        test_recipe:
          setup:
            - "Center ACTIVE, baseline=1000. One CapacityPlan OPEN for week 2026-09-07 with allocated=900, available=100."
            - "One PromotionEvent FORECASTED with surge_multiplier=2.0 affecting that week."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-CAS", display_name: "Cascade Center", base_weekly_capacity_units: 1000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "PROMO-ITEM", name: "Promo Item", category: "FOOD_INGREDIENT", base_cost_cents_per_unit: 500, is_promotion_eligible: true }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/capacity-plans"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: SupplyChainAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/promotions"
              payload: { promotion_code: "SUMMER26", start_date: "2026-09-07T00:00:00Z", end_date: "2026-09-14T00:00:00Z", surge_multiplier: 2.0, affected_product_ids: ["${prod_id}"] }
              as: SupplyChainAdmin
              captures: { promo_id: $.data.id, promo_v: $.data.version }
          trigger:
            - call: "POST /supply-centers/${center_id}/promotions/${promo_id}/confirm"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "PromotionEvent.${promo_id}.status == CONFIRMED"
            - "SupplyCenter.${center_id}.posture == SURGE_MODE"
            - "SupplyCenter.${center_id}.surge_capacity_multiplier == 2.0"
            - "CapacityPlan.${plan_id}.surge_units == 1000"
            - "CapacityPlan.${plan_id}.available_units == 1100"

      - name: store_suspension_cascade_to_pos
        grounds:
          - state_machines.Store
          - state_machines.PurchaseOrder
          - state_machines.OrderLine
        distinguishing_aspect: |
          Depth-2 cascade from POST stores/{id}/suspend: Store → SUSPENDED triggers
          PurchaseOrder (DRAFT and SUBMITTED only) → CANCELLED, which in turn triggers
          OrderLine → CANCELLED for each line of those POs. Cascade passes through
          two entity boundaries: Store→PO and PO→OrderLine.
        test_recipe:
          setup:
            - "Center ACTIVE. One Store ACTIVE with: one DRAFT PO with 2 lines, one SUBMITTED PO with 1 line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-C", display_name: "Cascade2", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P1", name: "P1", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.1, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-S", operator_name: "S Corp", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_draft: $.data.id, po_draft_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_draft}/lines"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_sub: $.data.id, po_sub_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_sub}/lines"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_sub}/submit"
              payload: { expected_store_version: "${store_v_fresh}" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/suspend"
              payload: { reason: "cascade test" }
              as: SupplyChainAdmin
          assert:
            - "Store.${store_id}.status == SUSPENDED"
            - "PurchaseOrder.${po_draft}.status == CANCELLED"
            - "PurchaseOrder.${po_sub}.status == CANCELLED"
            - "All OrderLines of both POs are CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_fiscal_on_po_submit
        grounds:
          - validations.priority_5_state
          - validations.priority_10_business_fiscal
          - errors.ERR_STORE_NOT_ACTIVE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: |
          PO submit violating BOTH Store-not-ACTIVE (priority 5, state category)
          AND credit-limit (priority 10, business_fiscal category) must return the
          higher-priority state error (ERR_STORE_NOT_ACTIVE), not the fiscal error.
          This is a state vs business_fiscal category conflict.
        test_recipe:
          setup:
            - "Center ACTIVE. One Store SUSPENDED with credit_limit=1c (would fail BOTH checks)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-P", display_name: "Priority Center", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-P", operator_name: "P Corp", credit_limit_cents: 1 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/suspend"
              payload: { reason: "test" }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STORE_NOT_ACTIVE"
            - "err != ERR_CREDIT_LIMIT_EXCEEDED"
            - "response status is 409"

      - name: referential_vs_temporal_on_promotion_confirm
        grounds:
