            - call: "POST /care/time-entries"
              payload: { client_id: "${cli_y}", care_manager_id: "${cm_dana}", service_type: "CRISIS_RESPONSE", crisis_episode_id: "${ep_z}", start_at: "2026-08-19T09:00:00Z", end_at: "2026-08-19T10:00:00Z", service_location_id: "HOSPITAL_A" }
