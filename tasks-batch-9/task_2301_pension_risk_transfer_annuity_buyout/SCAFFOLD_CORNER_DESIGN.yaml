            - call: "GET /prt/plans/${plan_id}/strategies"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { after_state: "$.data[0].strategy_status", after_version: "$.data[0].version" }
          assert:
            - "the first submission returned 200 with strategy_status == UNDER_EVALUATION, submitted_by_user_id == actuary-01 and version == 2"
            - "the second submission returns 409 ERR_STRATEGY_STATE_INVALID"
            - "DeRiskingStrategy.${strategy_id}.version is still 2 and revision_count is still 0 — the rejected retry wrote nothing"
            - "strategy_status is still UNDER_EVALUATION"

      - name: window_opening_before_opens_at_is_refused_then_succeeds_at_opens_at
