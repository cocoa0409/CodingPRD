      - "Per action_type, spawns next-tier ArrearsAction or transitions Shareholder to TERMINATED (with Resolution prerequisite for TERMINATION_NOTICE)"

  - method: POST
    path: "/cooperatives/{cid}/arrears-actions/{aid}/withdraw"
    description: "Withdraw an issued arrears action"
    roles: [BoardOfficer]
    code: 200
    input: []
    output: ArrearsAction
    side_effects: ["action_status = WITHDRAWN"]

  # --- Purchase applications ---
