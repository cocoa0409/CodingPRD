      - call: GET /rtw/transitional-jobs/${job_id}
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          s1: $.data.filled_seats
      assert:
      - ${s0} == 0
      - ${ps} == ACTIVE
      - ${s1} == 1
      - Placement.${pl_id}.suspension_reason == null
