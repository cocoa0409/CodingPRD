            - "after trigger 1: SupportActivity.${act1_id}.status is still PLANNED with delivered_at == null, and SubsidyPeriod.${sp_oct_id}.mission_cost_cents == 0"
            - "trigger 3 responds HTTP 200: SupportActivity.${act1_id}.status == DELIVERED with delivered_at == 2026-10-05T00:00:00Z and delivered_by_user_id == coach-1"
            - "GET /cost-entries?source_activity_id=${act1_id} returns exactly one row with category == COACHING, classification == MISSION, amount_cents == 6000, subsidy_period_id == ${sp_oct_id}"
