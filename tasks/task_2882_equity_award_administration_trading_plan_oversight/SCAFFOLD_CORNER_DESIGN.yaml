  # ===========================================================================
  - section: errors
    instances:

      - name: error_unauthenticated_missing_x_user_id_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          An empty X-User-ID and an X-Role outside the six declared roles are both
          ERR_UNAUTHENTICATED (401) rather than 403, and the check fires before existence: the
          same empty-identity request against a non-existent plan id still returns 401, never
          404.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; one ACTIVE plan exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Corner Plan Uniform Two", total_authorized_shares: 1000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /equity-plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: ""
              captures: { err_empty: $.data.error_id }
            - call: "GET /equity-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: ""
              captures: { err_empty_missing: $.data.error_id }
          assert:
            - "the first call returns HTTP 401 with error_id ERR_UNAUTHENTICATED (X-User-ID is the empty string, sent as \"\" and never as whitespace)"
            - "the second call also returns HTTP 401 with ERR_UNAUTHENTICATED, not 404 ERR_PLAN_NOT_FOUND"
            - "the response envelope is the declared error shape with meta.api_request_id present and response_type \"error\""

      - name: error_not_found_codes_are_entity_specific
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_AUTHORITY_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_TRANCHE_NOT_FOUND]
          - errors[ERR_VESTING_EVENT_NOT_FOUND]
          - errors[ERR_TAX_ALLOCATION_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_PRECLEARANCE_NOT_FOUND]
          - errors[ERR_TRADING_PLAN_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
        distinguishing_aspect: |
          The same unknown UUID 00000000-0000-0000-0000-0000000000ff produces a different
          error_id per resource family - ERR_PLAN_NOT_FOUND, ERR_AUTHORITY_NOT_FOUND,
          ERR_ASSIGNMENT_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_VESTING_EVENT_NOT_FOUND,
          ERR_TAX_ALLOCATION_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_PRECLEARANCE_NOT_FOUND,
          ERR_TRADING_PLAN_NOT_FOUND and ERR_REPORT_NOT_FOUND - so a single generic 404 code
          would fail this instance.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; no row of any entity carries the id 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /equity-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_plan: $.data.error_id }
            - call: "GET /approval-authorities/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_auth: $.data.error_id }
            - call: "GET /mobility-assignments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_assign: $.data.error_id }
            - call: "GET /vesting-tranches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_tranche: $.data.error_id }
            - call: "GET /vesting-events/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_event: $.data.error_id }
            - call: "GET /tax-allocations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_alloc: $.data.error_id }
            - call: "GET /trading-windows/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_window: $.data.error_id }
            - call: "GET /preclearance-requests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_pr: $.data.error_id }
            - call: "GET /trading-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_tp: $.data.error_id }
            - call: "GET /transaction-reports/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { err_rep: $.data.error_id }
          assert:
            - "every call returns HTTP 404"
            - "the error_ids are, in order, ERR_PLAN_NOT_FOUND, ERR_AUTHORITY_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_VESTING_EVENT_NOT_FOUND, ERR_TAX_ALLOCATION_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_PRECLEARANCE_NOT_FOUND, ERR_TRADING_PLAN_NOT_FOUND, ERR_REPORT_NOT_FOUND"
            - "each response carries a non-empty message and the error envelope shape"

      - name: error_tranche_and_event_invalid_state_on_repeated_triggers
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_TRANCHE_INVALID_STATE]
          - errors[ERR_VESTING_EVENT_INVALID_STATE]
          - state_machines.VestingTranche.UNVESTED_to_VESTED
          - state_machines.VestingEvent.PENDING_ALLOCATION_to_ALLOCATED
        distinguishing_aspect: |
          Replaying a completed trigger names the entity whose state machine refused it: a
          second vest of a VESTED tranche is ERR_TRANCHE_INVALID_STATE while a second
          allocate-taxes on an already ALLOCATED event is ERR_VESTING_EVENT_INVALID_STATE, and
          neither replay creates a duplicate VestingEvent or TaxAllocation row.
