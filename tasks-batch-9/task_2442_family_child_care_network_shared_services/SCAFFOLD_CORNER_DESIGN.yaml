        excluded_because:
          difficulty_instance: combinatorial_formula / group_purchase_order_per_line_rounding_then_sum_mode_b
          rationale: "The named §1.8 instance pins the 27306-vs-27307 divergence that only per-line ROUND_HALF_UP produces."

      - name: threshold_margin_classification_boundary
        claim_type: threshold
        grounds:
          - calculations.provider_revenue_projection
        excluded_because:
          difficulty_instance: boundary_precision_check / revenue_margin_sustainable_at_exact_fifteen_percent_boundary
          rationale: "The named §1.8 instance tests margin_pct at the threshold and one step below it."

      - name: tiered_pricing_substitute_fee_tier_boundaries
        claim_type: tiered_pricing
        grounds:
