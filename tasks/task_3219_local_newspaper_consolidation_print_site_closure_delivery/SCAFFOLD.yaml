    side_effects: ["status becomes archived; archive_handoff_checksum stamped"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- request and identity --------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "the request body is missing a required field, carries an unknown field, or a field's type or enum member is not one the endpoint declares"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID is absent, X-User-Role names no role in §1.7, or an entity_backed role's X-User-ID resolves to no row"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or the operation is exclusive to another role"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting operator is the same operator that created the NewsroomChange now being approved; approval must come from a different operator"

  # --- existence -------------------------------------------------------------
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an id in the request path resolves to no row, or a nested child does not belong to the parent it was requested under; the leftmost unresolved path segment is reported"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "an id supplied in the request body as a foreign key resolves to no row"

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's status is not the from-state of the transition the request names, or an action names a transition that does not exist from the current status"
  - id: ERR_MARKET_NOT_WITHDRAWABLE
    http: 409
    condition: "withdrawal requested on a market whose delivery_boycott_active is false"
  - id: ERR_CONTRACTOR_TERMINAL
    http: 409
    condition: "reinstate or route creation requested against a delivery contractor whose status is terminated"
  - id: ERR_STOP_NOT_ACTIVE
    http: 409
    condition: "pause requested on a delivery stop whose status is paused or terminated"
  - id: ERR_SUBSCRIBER_TERMINAL
    http: 409
    condition: "cancel, refund or migration requested against a subscriber contract whose status is churned"
  - id: ERR_RETENTION_ALREADY_SETTLED
    http: 409
    condition: "acceptance requested against a retention action whose status is already accepted, expired or cancelled"
  - id: ERR_NOTICES_NOT_DISPATCHED
    http: 409
    condition: "frequency apply requested while the market's frequency_change_status is not notices_dispatched, or renewals_accepted_count is 0"

  # --- business_safety -------------------------------------------------------
  - id: ERR_LEGAL_NOTICE_HOLD
    http: 422
    condition: "the owning RegionHub.legal_notice_block is true and the operation is frequency notices, title closure publication or a subscriber migration notice"
  - id: ERR_PRESS_POSTURE_LOCKED
    http: 422
    condition: "the owning RegionHub.press_posture is SUSPENDED, or the targeted PrintSite.status is closed"
  - id: ERR_PRESS_CAPACITY_EXCEEDED
    http: 422
    condition: "the issuing site's press load after the run would exceed its installed hourly capacity"

  # --- business_referential --------------------------------------------------
  - id: ERR_BACKED_OUT_REFERENCE
    http: 422
    condition: "the request references a row that an earlier reverse action in the same region has already terminated"
  - id: ERR_NO_ROUTE_IN_TIME
    http: 422
    condition: "select_transfer_route finds no eligible direct hop whose dispatch + make-ready + press run + transit + buffer clears the market's publication deadline"

  # --- business_constraint ---------------------------------------------------
  - id: ERR_DUPLICATE_HUB_CODE
    http: 409
    condition: "Region.name, PrintSite.code, DeliveryContractor.name, DeliveryRoute.route_code or TitleClosure.title_code is already taken within the hub; or DeliveryStop.stop_code is already taken within its route"
  - id: ERR_STOP_CAPACITY_EXCEEDED
    http: 422
    condition: "adding the stop would push the route's non-terminated stop count above its stop_capacity"
  - id: ERR_OVERLAP_PAUSE_WINDOW
    http: 422
    condition: "the pause window is malformed: only one of pause_start_date / pause_end_date supplied, or pause_end_date earlier than pause_start_date"
  - id: ERR_DOCK_SLOT_CONFLICT
    http: 409
    condition: "the new route's half-open [dispatch_cutoff_utc, dispatch_cutoff_utc + loading_slot_minutes) window overlaps an existing departure at the same print site, or the site's max_concurrent_departures would be exceeded"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the submitted expected_hub_version does not equal the hub's current version"

  # --- business_temporal -----------------------------------------------------
  - id: ERR_EFFECTIVE_DATE_NOT_FUTURE
    http: 422
    condition: "a newsroom change's effective_date is at or before the logical clock's current date"
  - id: ERR_PAUSE_WINDOW_NOT_OPEN
    http: 422
    condition: "the logical clock's current date is outside the delivery stop's declared [pause_start_date, pause_end_date] pause window"
  - id: ERR_PAUSE_WINDOW_STILL_OPEN
    http: 422
    condition: "a resume is requested while the logical clock's current date is still inside the pause window"
  - id: ERR_COOLOFF_EXPIRED
    http: 409
    condition: "a retention action is accepted at or after its cooling_off_expires_utc"
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "a frequency reduction is applied less than 14 calendar days after its notices were dispatched"
  - id: ERR_REFUND_WINDOW_CLOSED
    http: 409
    condition: "a subscriber refund is requested after paid_through_utc"
  - id: ERR_COST_RUN_REGRESSION
    http: 409
    condition: "a route cost run is submitted with a run_date that is not strictly later than the route's last_cost_run_date"
  - id: ERR_RUN_NOT_COSTED
    http: 409
    condition: "a route cost run is submitted while an edition exists in the route's market that has not itself been costed"

  # --- business_fiscal -------------------------------------------------------
  - id: ERR_SITE_NOT_RECEIVING
    http: 422
    condition: "the receiving print site is not in status active, or is already committed to another market's in-flight transfer"
  - id: ERR_NO_PRINT_CAPACITY
    http: 422
    condition: "the receiving print site's capacity_remaining_copies is below the market's latest edition requested_print_run_copies"
  - id: ERR_FLOOR_COPIES_EXCEED_CAPACITY
    http: 422
    condition: "the market's guaranteed_floor_copies exceeds the assigned print site's capacity_remaining_copies, so no allocation can satisfy the guarantee"
  - id: ERR_TRANSFER_COST_CEILING_EXCEEDED
    http: 422
    condition: "the market's projected print_site_transfer_cost_cents would exceed the hub's transfer_cost_ceiling_cents"
  - id: ERR_ROUTE_COST_CEILING_EXCEEDED
    http: 422
    condition: "the market's summed route_night_cost would exceed the market's daily_route_cost_ceiling_cents"
  - id: ERR_PRINT_BUDGET_EXCEEDED
    http: 402
    condition: "the hub's aggregate print tonnage charge for the period would exceed max_print_tonnage_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Platform operator who provisions hubs and drives the logical clock; no business decisions"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /region-hubs — create a hub"
    shared_operations:
      - "GET /region-hubs, GET /region-hubs/{id} — read hubs"

  - name: PrintOperationsDirector
    description: "Owns print site consolidation, market transfers, publication deadlines, edition dispatch and title closure"
    identity: opaque
    exclusive_operations:
      - "POST /region-hubs/{id}/regions — create a region"
      - "POST /region-hubs/{id}/print-sites — create a print site"
      - "POST /print-sites/{id}/plan-closure, /begin-consolidating, /close — print site lifecycle"
      - "POST /print-sites/{id}/routes — create a print route"
      - "POST /_print-volume/records — record a contract-day charge"
      - "POST /regions/{id}/print-markets — create a print market"
      - "POST /print-markets/{id}/plan-transfer, /redispatch, /withdraw — market transfer cycle"
      - "POST /print-markets/{id}/frequency-change, /frequency-notices, /frequency-apply, /frequency-reject — frequency reduction"
      - "POST /print-markets/{id}/editions — create an edition"
      - "POST /editions/{id}/dispatch, /revert-to-digital, /deliver, /correct — edition lifecycle"
      - "POST /region-hubs/{id}/title-closures and POST /title-closures/{id}/publish-notice, /suspend, /resume, /merge, /archive — title closure"
    shared_operations:
      - "GET /print-markets, GET /print-markets/{id}, GET /editions/{id} — read print state"

  - name: DeliveryNetworkManager
    description: "Owns contractor networks, route economics and delivery stops"
    identity: opaque
    exclusive_operations:
      - "POST /region-hubs/{id}/delivery-contractors — register a contractor"
      - "POST /delivery-contractors/{id}/suspend, /terminate, /reinstate — contractor sanctions"
      - "POST /delivery-contractors/{id}/routes — create a route"
      - "POST /delivery-routes/{id}/stops — add a stop"
      - "POST /delivery-stops/{id}/pause, /resume, /terminate — stop lifecycle"
    shared_operations:
      - "GET /delivery-routes, GET /delivery-routes/{id}, GET /delivery-stops/{id} — read delivery state"

  - name: NewsroomOperationsManager
    description: "Owns newsroom headcount allocation between regions and editing hubs"
    identity: opaque
    exclusive_operations:
      - "POST /regions/{id}/newsroom-positions — create a position"
      - "POST /newsroom-changes — propose a headcount movement"
      - "POST /newsroom-changes/{id}/apply, /reject, /reopen — settle a movement"
    shared_operations:
      - "POST /newsroom-changes/{id}/approve — approve a movement proposed by another operator"
      - "GET /newsroom-changes, GET /newsroom-positions/{id} — read newsroom state"

  - name: CustomerService
    description: "Owns subscriber notification, migration, retention offers and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /delivery-stops/{id}/subscribers — create a subscriber contract"
      - "POST /subscribers/{id}/accept-retention-offer — accept a retention offer"
      - "POST /subscribers/{id}/refund — refund remaining print issues"
      - "POST /subscribers/{id}/retention-actions — offer a retention action"
      - "POST /retention-actions/{id}/accept — accept a retention action"
    shared_operations:
      - "POST /subscribers/{id}/cancel, POST /subscribers/{id}/migrate-digital — shared with Subscriber"
      - "GET /subscribers, GET /subscribers/{id} — read subscriber state"

  - name: Subscriber
    description: "A subscriber acting on their own contract; X-User-ID is the SubscriberContract row id"
    identity: entity_backed:SubscriberContract
    exclusive_operations: []
    shared_operations:
      - "GET /subscribers/{id} — read their own contract"
      - "POST /subscribers/{id}/cancel — exit their own contract"
      - "POST /subscribers/{id}/migrate-digital — migrate their own contract"

  - name: Auditor
    description: "Read-only oversight across print, delivery and compliance surfaces"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint in §1.5"
      - "GET /region-hubs/{id}/compliance — read the legal-notice ratio verdict"