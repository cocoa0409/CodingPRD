scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: expenditure_report_method_a_vs_method_b_divergence
        grounds:
          - calculations.reportable_expenditure_total
          - entities.ExpenditureReport.fields.basis
          - entities.ExpenditureReport.fields.method_a_total_cents
          - entities.ExpenditureReport.fields.method_b_total_cents
          - entities.ExpenditureReport.fields.filed_total_cents
          - state_machines.ExpenditureReport.OPEN_to_SUPERSEDED
        distinguishing_aspect: |
          This dual variant lives in the lobbying-disclosure accounting domain on ExpenditureReport: over the
          identical two-activity inclusion set, METHOD_A files 700000 cents (out-of-pocket only) while METHOD_B
          files 751001 cents (out-of-pocket plus per-activity staff cost), so filed_total_cents differs by 51001.
        test_recipe:
          setup:
            - "Three member companies seated on one FEDERAL committee (weights 3 + 2 + 1 = 6), one position ADOPTED."
            - "One FEDERAL LobbyingRegistration in status ACTIVE covering 2026-01-01..2026-12-31, amendment_round 0."
            - "Two LOGGED activities inside 2026Q3: expenditure 400000 with 3.333 hours and expenditure 300000 with 2.667 hours; ytd_reportable_cents 700000 stays under the FEDERAL threshold 1400000."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Beta Foundry Co", membership_tier: "FULL", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 15, status: "ACTIVE", advocacy_optout: false, engagement_score: 70 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m2_id: $.data.id }
            - call: "POST /advocacy/members"
              payload: { legal_name: "Gamma Tooling Co", membership_tier: "ASSOCIATE", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 5, status: "ACTIVE", advocacy_optout: false, engagement_score: 50 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m3_id: $.data.id }
            - call: "POST /advocacy/committees"
              payload: { name: "Federal Tax Policy Committee", jurisdiction_scope: "FEDERAL", quorum_threshold_pct: 60.00, consensus_threshold_pct: 66.67 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { comm_id: $.data.id }
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m1_id}", seat_role: "CHAIR" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m2_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${comm_id}/seats"
              payload: { member_id: "${m3_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions"
              payload: { committee_id: "${comm_id}", title: "Support the Manufacturing Credit", jurisdiction_code: "FEDERAL", summary: "The association supports extension of the manufacturing investment credit." }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { pos_id: $.data.id }
            - call: "POST /advocacy/policy-positions/${pos_id}/open-ballot"
              payload: { ballot_deadline_date: "2026-08-20" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m2_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "OPPOSE" }
              as: MemberDelegate
              as_user_id: "${m3_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/tally"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/adopt"
              payload: {}
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Manufacturers Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /advocacy/lobbying-activities"
              payload: { registration_id: "${reg_id}", position_id: "${pos_id}", activity_kind: "DIRECT_LOBBYING", activity_date: "2026-07-05", hours: 3.333, expenditure_cents: 400000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/lobbying-activities"
              payload: { registration_id: "${reg_id}", position_id: "${pos_id}", activity_kind: "DIRECT_LOBBYING", activity_date: "2026-07-06", hours: 2.667, expenditure_cents: 300000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
          trigger:
            - call: "GET /advocacy/lobbying-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_v1: $.data.version }
            - call: "POST /advocacy/expenditure-reports"
              payload: { registration_id: "${reg_id}", period_code: "2026Q3", basis: "METHOD_A", expected_registration_version: "${reg_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_a_id: $.data.id, rep_a_total: $.data.filed_total_cents }
            - call: "GET /advocacy/lobbying-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_v2: $.data.version }
            - call: "POST /advocacy/expenditure-reports"
              payload: { registration_id: "${reg_id}", period_code: "2026Q3", basis: "METHOD_B", expected_registration_version: "${reg_v2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_b_id: $.data.id }
          assert:
            - "ExpenditureReport.${rep_a_id}.method_a_total_cents == 700000"
            - "ExpenditureReport.${rep_a_id}.method_b_total_cents == 751001"
            - "ExpenditureReport.${rep_a_id}.filed_total_cents == 700000"
            - "ExpenditureReport.${rep_a_id}.status == SUPERSEDED"
            - "ExpenditureReport.${rep_b_id}.filed_total_cents == 751001"
            - "ExpenditureReport.${rep_b_id}.included_activity_count == 2"
            - "ExpenditureReport.${rep_b_id}.period_start_date == 2026-07-01 and period_end_date == 2026-09-30 and due_date == 2026-10-20"
            - "ExpenditureReport.${rep_b_id}.filed_total_cents - ExpenditureReport.${rep_a_id}.filed_total_cents == 51001"
      - name: dues_deductibility_ratio_vs_flat_floor_divergence
        grounds:
          - calculations.dues_deductibility_notice
          - entities.Member.fields.notice_method
          - entities.Member.fields.annual_dues_cents
          - endpoints["GET /advocacy/members/{id}/deductibility-notice"]
          - state_machines.ExpenditureReport.OPEN_to_CERTIFIED
        distinguishing_aspect: |
          This second dual variant lives in the membership/dues domain on Member, not in report accounting: with the
          identical association ratio 20.00 and identical dues of 400000 cents, the RATIO member (FEDERAL) owes
          80000 cents nondeductible while the FLAT_FLOOR member (STATE_CA) owes 93750 cents, because FLAT_FLOOR
          floors the percentage at 25.00 and applies it to dues minus a 25000-cent exempt base.
        test_recipe:
          setup:
            - "Two members with identical annual_dues_cents 400000 and dues_year 2026: one FEDERAL (notice_method RATIO) and one STATE_CA (notice_method FLAT_FLOOR)."
            - "One CERTIFIED ExpenditureReport for period 2026Q3 with filed_total_cents 24000000, so the association lobbying ratio is 20.00 percent of the 120000000-cent budget."
            - "Logical clock at 2026-10-01, i.e. after period_end_date 2026-09-30 and before due_date 2026-10-20."
          setup_api_calls:
            - call: "POST /advocacy/members"
              payload: { legal_name: "Alpha Steel Co", membership_tier: "PREMIER", home_jurisdiction_code: "FEDERAL", home_district_code: "CA-12", annual_dues_cents: 400000, dues_year: 2026, restricted_class_size: 25, status: "ACTIVE", advocacy_optout: false, engagement_score: 90 }
              as: AssociationAdmin
              as_user_id: "admin-1"
