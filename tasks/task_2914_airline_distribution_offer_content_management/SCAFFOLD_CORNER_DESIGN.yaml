# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — task_2914_airline_distribution_offer_content_management
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md.
# Every `section:` value and every `claim_type:` value below comes from that
# guide; nothing is invented. Corners already asserted by §1.8 are emitted as
# `excluded_because:` stubs naming the §1.8 instance.
#
# Shared corner fixture (anchored on first use, aliased afterwards):
#   Channel CORNER_NDC : NDC_AGGREGATOR, STANDARD (rank 2), markup 0.035,
#                        incentive_multiplier 1.25, monthly_platform_fee 400000,
#                        per_message 12, per_segment 40, disclosures
#                        ["DOT-FARE-INCL"], and NO surcharge rules, so an
#                        offer's total_cents equals its subtotal_cents.
#   FareFiling YCORN01 : FRA-JFK ECONOMY, base 45010, sale window
#                        [2026-07-01, 2026-10-01), travel [2026-09-01, 2026-12-31]
#   Logical clock      : left at its 2026-08-01T00:00:00.000Z startup default
#                        unless the instance moves it.
#   CORNER offer       : fare-only, subtotal 46585, surcharge 0, total 46585,
#                        item_count 1; after CAPTURE the agreement accrues 582
#                        and the channel reports flat 400000 / activity 634.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:

      - name: corner_fare_filing_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.FareFiling
          - endpoints.POST_fare_filings
        distinguishing_aspect: "POST /fare-filings with every required field returns 201 and a body carrying each §1.1 FareFiling field, with the system fields seeded to their declared start values (DRAFT, revision 0, base_filing_id null)."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00.000Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YCORN01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { new_filing_id: $.data.id }
          assert:
            - "the call returns HTTP 201 and response_type == object"
            - "FareFiling.${new_filing_id}.fare_basis_code == YCORN01"
            - "FareFiling.${new_filing_id}.base_amount_cents == 45010"
            - "FareFiling.${new_filing_id}.status == DRAFT"
            - "FareFiling.${new_filing_id}.revision_number == 0"
            - "FareFiling.${new_filing_id}.base_filing_id == null"
            - "FareFiling.${new_filing_id}.filed_by_user_id == pa-001"
            - "FareFiling.${new_filing_id}.version == 1"

      - name: corner_get_channel_returns_the_stored_channel_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_channels_id
          - entities.Channel
        distinguishing_aspect: "GET /channels/{id} returns exactly the configuration stored by POST /channels, including the computed content_tier_rank and the zeroed cost ledger."
        test_recipe:
          setup:
            - "Channel CORNER_NDC registered with STANDARD tier and the full cost model."
          setup_api_calls:
            - &c_ch
              call: "POST /channels"
              payload: { channel_code: "CORNER_NDC", channel_kind: "NDC_AGGREGATOR", content_tier: "STANDARD", content_markup_pct: 0.035, incentive_multiplier: 1.25, monthly_platform_fee_cents: 400000, per_message_cost_cents: 12, per_segment_fee_cents: 40, servicing_parity_change: true, servicing_parity_refund: true, required_disclosure_codes: ["DOT-FARE-INCL"] }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_c_id: $.data.id, channel_c_v: $.data.version }
          trigger:
            - call: "GET /channels/${channel_c_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
          assert:
            - "the call returns HTTP 200 and response_type == object"
            - "Channel.${channel_c_id}.channel_code == CORNER_NDC"
            - "Channel.${channel_c_id}.channel_kind == NDC_AGGREGATOR"
            - "Channel.${channel_c_id}.content_tier == STANDARD"
            - "Channel.${channel_c_id}.content_tier_rank == 2"
            - "Channel.${channel_c_id}.booking_count == 0"
            - "Channel.${channel_c_id}.activity_cost_cents == 0"
            - "Channel.${channel_c_id}.cost_per_booking_flat_cents == 0"
            - "Channel.${channel_c_id}.cost_per_booking_activity_cents == 0"

      - name: corner_fare_filing_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_fare_filings
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /fare-filings?limit=2&offset=0 over three filings returns two rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three DRAFT fare filings with distinct fare_basis_codes on the same market."
          setup_api_calls:
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YPAGE01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 30000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { page_f1_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YPAGE02", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 31000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { page_f2_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YPAGE03", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 32000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { page_f3_id: $.data.id }
          trigger:
            - call: "GET /fare-filings?status=DRAFT&limit=2&offset=0"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { page_first_id: "$.data[0].id" }
          assert:
            - "the call returns HTTP 200 and response_type == array"
            - "meta pagination reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "exactly 2 rows are returned and ${page_first_id} is one of ${page_f1_id} / ${page_f2_id} / ${page_f3_id}"
            - "GET /fare-filings?status=DRAFT&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /fare-filings?status=ACTIVE returns total_count == 0"

      - name: corner_unknown_path_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_CHANNEL_NOT_FOUND
          - errors.ERR_PARTNER_NOT_FOUND
          - errors.ERR_FARE_FILING_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_OFFER_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_SERVICE_REQUEST_NOT_FOUND
          - errors.ERR_CERTIFICATION_NOT_FOUND
          - errors.ERR_CONNECTIVITY_TEST_NOT_FOUND
        distinguishing_aspect: "Every path parameter resolves against its own entity: the same syntactically valid but unknown UUID produces a DIFFERENT 404 error_id per collection, never a generic not-found."
        test_recipe:
          setup:
            - "Empty database. 00000000-0000-4000-8000-000000000000 is a well-formed UUID that matches no row in any collection."
          setup_api_calls: []
          trigger:
            - call: "GET /channels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { nf_channel_error: $.data.error_id }
            - call: "GET /distribution-partners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { nf_partner_error: $.data.error_id }
            - call: "GET /fare-filings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { nf_filing_error: $.data.error_id }
            - call: "GET /agency-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { nf_agreement_error: $.data.error_id }
            - call: "GET /corporate-contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { nf_contract_error: $.data.error_id }
            - call: "GET /offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { nf_offer_error: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { nf_order_error: $.data.error_id }
            - call: "POST /service-requests/00000000-0000-4000-8000-000000000000/review"
              payload: { action: "START_REVIEW" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { nf_service_request_error: $.data.error_id }
            - call: "GET /partner-certifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { nf_certification_error: $.data.error_id }
            - call: "POST /connectivity-tests/00000000-0000-4000-8000-000000000000/outcome"
              payload: { outcome: "CANCELLED" }
              as: TechnologyPartner
              as_user_id: "tp-unknown"
              captures: { nf_test_error: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "${nf_channel_error} == ERR_CHANNEL_NOT_FOUND"
            - "${nf_partner_error} == ERR_PARTNER_NOT_FOUND"
            - "${nf_filing_error} == ERR_FARE_FILING_NOT_FOUND"
            - "${nf_agreement_error} == ERR_AGREEMENT_NOT_FOUND"
            - "${nf_contract_error} == ERR_CONTRACT_NOT_FOUND"
            - "${nf_offer_error} == ERR_OFFER_NOT_FOUND"
            - "${nf_order_error} == ERR_ORDER_NOT_FOUND"
            - "${nf_service_request_error} == ERR_SERVICE_REQUEST_NOT_FOUND"
            - "${nf_certification_error} == ERR_CERTIFICATION_NOT_FOUND"
            - "${nf_test_error} == ERR_CONNECTIVITY_TEST_NOT_FOUND"

      - name: corner_channel_creation_without_channel_kind_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_channels
        distinguishing_aspect: "channel_kind has source: input and no default, so omitting it is a 400 ERR_INVALID_REQUEST — it is not silently defaulted and no Channel row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /channels"
              payload: { channel_code: "NO_KIND" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { req_error: $.data.error_id }
          assert:
            - "the call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Channel row is created: a subsequent POST /channels with channel_code NO_KIND and channel_kind DIRECT returns HTTP 201, not ERR_DUPLICATE_CHANNEL_CODE"

      - name: corner_channel_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Channel.fields.content_tier
          - entities.Channel.fields.content_markup_pct
          - entities.Channel.fields.incentive_multiplier
          - entities.Channel.fields.servicing_parity_change
          - entities.Channel.fields.required_disclosure_codes
        distinguishing_aspect: "A POST /channels carrying only the two required fields applies every declared default: content_tier STANDARD (rank 2), markup 0, multiplier 1.0, all three cost fields 0, both parity flags true and required_disclosure_codes []."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /channels"
              payload: { channel_code: "BARE_MIN", channel_kind: "DIRECT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { bare_channel_id: $.data.id }
          assert:
            - "Channel.${bare_channel_id}.content_tier == STANDARD"
            - "Channel.${bare_channel_id}.content_tier_rank == 2"
            - "Channel.${bare_channel_id}.content_markup_pct == 0"
            - "Channel.${bare_channel_id}.incentive_multiplier == 1.0"
            - "Channel.${bare_channel_id}.monthly_platform_fee_cents == 0"
            - "Channel.${bare_channel_id}.per_message_cost_cents == 0"
            - "Channel.${bare_channel_id}.per_segment_fee_cents == 0"
            - "Channel.${bare_channel_id}.servicing_parity_change == true"
            - "Channel.${bare_channel_id}.servicing_parity_refund == true"
            - "Channel.${bare_channel_id}.required_disclosure_codes == []"

      - name: corner_content_tier_rank_is_computed_from_content_tier
        claim_type: computed_fields
        grounds:
          - entities.Channel.fields.content_tier_rank
          - endpoints.POST_channels
          - endpoints.PATCH_channels_id_content_policy
        distinguishing_aspect: "content_tier_rank has source: computed and is derived from content_tier alone (FULL=3, STANDARD=2, RESTRICTED=1); patching the tier re-derives it in the same response."
        test_recipe:
          setup:
            - "Two channels registered, one FULL and one RESTRICTED."
          setup_api_calls:
            - call: "POST /channels"
              payload: { channel_code: "TIER_FULL", channel_kind: "DIRECT", content_tier: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { tier_full_id: $.data.id }
            - call: "POST /channels"
              payload: { channel_code: "TIER_RESTR", channel_kind: "GDS_LEGACY", content_tier: "RESTRICTED" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { tier_restr_id: $.data.id }
          trigger:
            - call: "PATCH /channels/${tier_restr_id}/content-policy"
              payload: { content_tier: "FULL" }
              as: DistributionManager
              as_user_id: "dm-001"
          assert:
            - "Channel.${tier_full_id}.content_tier_rank == 3"
            - "before the patch Channel.${tier_restr_id}.content_tier_rank == 1"
            - "the PATCH response already reports Channel.${tier_restr_id}.content_tier == FULL and content_tier_rank == 3"
            - "Channel.${tier_restr_id}.version == 2"

      - name: corner_order_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Order.fields.payment_status
          - entities.Order.fields.channel_id
          - entities.Order.fields.partner_id
          - entities.Order.fields.net_revenue_cents
        distinguishing_aspect: "id / created_at / updated_at / version and the copied channel_id / partner_id / net_revenue_cents are all server-minted on POST /orders: id is a bare UUID with no type prefix, version starts at 1, and the money field is frozen from the offer rather than taken from the request."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, travel agency Alpha with a SIGNED agreement, FareFiling YCORN01 ACTIVE and a PUBLISHED fare-only offer (total_cents 46585)."
          setup_api_calls:
            - *c_ch
            - &c_agy
              call: "POST /distribution-partners"
              payload: { partner_name: "Alpha Corner Travel", partner_type: "TRAVEL_AGENCY", iata_code: "55555550", home_country: "DE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_agy_id: $.data.id, partner_agy_v: $.data.version }
            - &c_filing
              call: "POST /fare-filings"
              payload: { fare_basis_code: "YCORN01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_c_id: $.data.id, filing_c_v: $.data.version }
            - &c_filed
              call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &c_active
              call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &c_agreement
              call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { agreement_c_id: $.data.id }
            - &c_accept
              call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - &c_offer
              call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_c_id: $.data.id }
            - &c_publish
              call: "POST /offers/${offer_c_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
          trigger:
            - &c_order
              call: "POST /orders"
              payload: { offer_id: "${offer_c_id}", disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { order_c_id: $.data.id }
          assert:
            - "Order.${order_c_id}.id is a bare 36-character UUID with no type prefix"
            - "Order.${order_c_id}.version == 1"
            - "Order.${order_c_id}.created_at and updated_at are ISO 8601 UTC instants with exactly three fractional digits"
            - "Order.${order_c_id}.channel_id == ${channel_c_id} and Order.${order_c_id}.partner_id == ${partner_agy_id}"
            - "Order.${order_c_id}.agency_agreement_id == ${agreement_c_id}"
            - "Order.${order_c_id}.net_revenue_cents == 46585"
            - "Order.${order_c_id}.message_count == 1 and Order.${order_c_id}.segment_count == 1"
            - "Order.${order_c_id}.paid_amount_cents == 0 and Order.${order_c_id}.refunded_amount_cents == 0"

      - name: corner_fare_filing_with_unknown_cabin_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.FareFiling.fields.cabin
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cabin is an enum constrained to ECONOMY | PREMIUM | BUSINESS, so FIRST is rejected with 400 ERR_INVALID_REQUEST; the same request also proves sale_from >= sale_to is rejected."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YBADCAB", origin: "FRA", destination: "JFK", cabin: "FIRST", base_amount_cents: 30000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { enum_error: $.data.error_id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YBADWIN", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 30000, sale_from: "2026-10-01T00:00:00.000Z", sale_to: "2026-07-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { window_error: $.data.error_id }
          assert:
            - "${enum_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "${window_error} == ERR_INVALID_REQUEST with HTTP 400 because sale_to is not strictly after sale_from"
            - "GET /fare-filings?status=DRAFT returns total_count == 0"

      - name: corner_offer_items_are_immutable_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.OfferItem
          - endpoints.GET_offers_id_items
        distinguishing_aspect: "OfferItem is declared common_fields: false, so its rows expose only id and created_at — no version, no updated_at — and §1.5 offers no endpoint that mutates or deletes a line; the only access path is the ordered listing."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE and a constructed fare-only offer."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
          trigger:
            - call: "GET /offers/${offer_c_id}/items"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
              captures: { item_first_id: "$.data[0].id" }
          assert:
            - "the call returns HTTP 200 with response_type == array and total_count == 1"
            - "the single row has sequence == 1, item_type == FARE, item_code == YCORN01"
            - "that row's list_amount_cents == 45010 and net_amount_cents == 46585 and refundable == true"
            - "the row exposes id (${item_first_id}) and created_at but no version and no updated_at field"
            - "§1.5 declares no PATCH / PUT / DELETE endpoint under /offers/{id}/items"

      - name: corner_surcharge_rule_under_unknown_channel_returns_channel_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SurchargeRule.parent
          - validations[priority=4]
          - errors.ERR_CHANNEL_NOT_FOUND
        distinguishing_aspect: "SurchargeRule declares parent: Channel and is addressed only as a sub-resource, so a well-formed rule body under an unknown channel id is refused at the path-resolution rung (404) before any body validation runs."
        test_recipe:
          setup:
            - "Channel CORNER_NDC exists, but the request targets a different, unknown channel id."
          setup_api_calls:
            - *c_ch
          trigger:
            - call: "POST /channels/00000000-0000-4000-8000-000000000000/surcharge-rules"
              payload: { surcharge_code: "ORPHAN", item_scope: "ALL", rate_pct: 0.02, threshold_cents: 0, min_cents: 0, max_cents: 1000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { orphan_error: $.data.error_id }
          assert:
            - "the call returns HTTP 404 with data.error_id == ERR_CHANNEL_NOT_FOUND"
            - "GET /channels/${channel_c_id}/surcharge-rules returns total_count == 0"

      - name: corner_body_foreign_keys_are_validated_before_business_rules
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_BUNDLE_NOT_FOUND
          - errors.ERR_ANCILLARY_NOT_FOUND
          - errors.ERR_PARTNER_NOT_FOUND
          - errors.ERR_OFFER_NOT_FOUND
        distinguishing_aspect: "entity_topology is flat, so cross-entity integrity lives entirely in body foreign keys: bundle_id, each ancillary_codes entry, partner_id and offer_id each resolve to their own 404 error_id at priority 5, ahead of every state and fiscal rule."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha and FareFiling YCORN01 ACTIVE; no bundles and no ancillary products have been published."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", bundle_id: "00000000-0000-4000-8000-000000000000", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { fk_bundle_error: $.data.error_id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", ancillary_codes: ["NO_SUCH_ANC"], trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { fk_anc_error: $.data.error_id }
            - call: "POST /orders"
              payload: { offer_id: "00000000-0000-4000-8000-000000000000", disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { fk_offer_error: $.data.error_id }
          assert:
            - "${fk_bundle_error} == ERR_BUNDLE_NOT_FOUND with HTTP 404"
            - "${fk_anc_error} == ERR_ANCILLARY_NOT_FOUND with HTTP 404"
            - "${fk_offer_error} == ERR_OFFER_NOT_FOUND with HTTP 404"
            - "GET /offers?channel_id=${channel_c_id} returns total_count == 0"

  # ===========================================================================
  # SECTION 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_fare_filing_walks_draft_to_filed_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.FareFiling.transitions[DRAFT->FILED]
          - state_machines.FareFiling.transitions[FILED->ACTIVE]
          - endpoints.POST_fare_filings_id_state
        distinguishing_aspect: "Each declared edge is accepted from its declared source state and bumps FareFiling.version by exactly 1, so the filing reaches ACTIVE at version 3 after two state calls."
        test_recipe:
          setup:
            - "FareFiling YCORN01 exists in DRAFT at version 1; no other ACTIVE filing shares its market."
          setup_api_calls:
            - *c_filing
          trigger:
            - call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "ACTIVE", reason: "sale open" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          assert:
            - "the first call returns HTTP 200 with FareFiling.${filing_c_id}.status == FILED and version == 2"
            - "the second call returns HTTP 200 with FareFiling.${filing_c_id}.status == ACTIVE and version == 3"
            - "FareFiling.${filing_c_id}.revision_number is still 0 and base_filing_id is still null"

      - name: corner_passed_outcome_without_score_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConnectivityTest.transitions[SCHEDULED->PASSED].preconditions
          - errors.ERR_INVALID_REQUEST
          - calculations.certification_readiness_score
        distinguishing_aspect: "The SCHEDULED -> PASSED edge carries a precondition that score is present; without it the transition is refused with 400 and the certification's reserved_test_minutes and both readiness variants are left exactly as they were."
        test_recipe:
          setup:
            - "Tech provider Tango under certification on CORNER_NDC with one SCHEDULED 60-minute mandatory test."
          setup_api_calls:
            - *c_ch
            - &c_tech
              call: "POST /distribution-partners"
              payload: { partner_name: "Tango Corner Systems", partner_type: "TECH_PROVIDER", iata_code: "55555551", home_country: "DE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_tech_id: $.data.id }
            - &c_cert
              call: "POST /partner-certifications"
              payload: { partner_id: "${partner_tech_id}", channel_id: "${channel_c_id}", env_code: "CORNER_ENV" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { cert_c_id: $.data.id }
            - &c_test_mand
              call: "POST /partner-certifications/${cert_c_id}/connectivity-tests"
              payload: { test_code: "SHOP_SEARCH", is_mandatory: true, scheduled_start: "2026-08-03T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { test_mand_id: $.data.id }
          trigger:
            - call: "POST /connectivity-tests/${test_mand_id}/outcome"
              payload: { outcome: "PASSED" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { no_score_error: $.data.error_id }
          assert:
            - "the call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the test is still SCHEDULED and its score is still null"
            - "PartnerCertification.${cert_c_id}.reserved_test_minutes == 60"
            - "PartnerCertification.${cert_c_id}.readiness_score_strict == 0 and readiness_score_provisional == 0"
            - "PartnerCertification.${cert_c_id}.version == 2 (create + one scheduled test), unchanged by the refused outcome"

      - name: corner_filing_suspension_withdraws_its_published_offer
        claim_type: side_effect_execution
        grounds:
          - state_machines.FareFiling.transitions[ACTIVE->SUSPENDED].side_effects
          - state_machines.Offer.transitions[PUBLISHED->WITHDRAWN]
        distinguishing_aspect: "Suspending the filing is what withdraws the dependent offer: the PUBLISHED offer moves to WITHDRAWN and its version is bumped by the cascade even though no request touched the offer, while its immutable OfferItem rows survive."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE, one PUBLISHED fare-only offer at version 2."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - *c_publish
          trigger:
            - call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "SUSPENDED", reason: "market pulled" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          assert:
            - "the call returns HTTP 200 with FareFiling.${filing_c_id}.status == SUSPENDED and version == 4"
            - "Offer.${offer_c_id}.status == WITHDRAWN and Offer.${offer_c_id}.version == 3"
            - "GET /offers/${offer_c_id}/items still returns total_count == 1 with net_amount_cents == 46585"
            - "a POST /orders on ${offer_c_id} now returns HTTP 422 with data.error_id == ERR_OFFER_NOT_PUBLISHED"

      - name: corner_new_certification_and_test_start_in_their_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.PartnerCertification.initial_state
          - state_machines.ConnectivityTest.initial_state
          - entities.DistributionPartner.fields.certification_status
        distinguishing_aspect: "PartnerCertification is born TESTING and ConnectivityTest is born SCHEDULED — neither creation endpoint accepts a status input — and the partner's own certification_status is driven to IN_CERTIFICATION by the certification's creation."
        test_recipe:
          setup:
            - "Channel CORNER_NDC and tech provider Tango registered; Tango's certification_status starts UNCERTIFIED."
          setup_api_calls:
            - *c_ch
            - *c_tech
          trigger:
            - *c_cert
            - *c_test_mand
          assert:
            - "PartnerCertification.${cert_c_id}.status == TESTING and certified_variant == null"
            - "PartnerCertification.${cert_c_id}.mandatory_failed_count == 0 and reserved_test_minutes == 60"
            - "ConnectivityTest.${test_mand_id}.status == SCHEDULED and score == null"
            - "ConnectivityTest.${test_mand_id}.scheduled_end == 2026-08-03T10:00:00.000Z"
            - "DistributionPartner.${partner_tech_id}.certification_status == IN_CERTIFICATION and version == 2"

      - name: corner_second_capture_on_a_paid_order_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Order.transitions[AUTHORIZED->PAID]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "CAPTURE is declared only from payment_status AUTHORIZED, so a second CAPTURE on a PAID order is refused with 422 and none of its downstream side effects re-run: the channel booking_count and the agreement ledger stay at their single-booking values."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with a SIGNED agreement, and one order captured for exactly 46585."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
            - &c_capture
              call: "POST /orders/${order_c_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 46585 }
              as: Agency
              as_user_id: "${partner_agy_id}"
          trigger:
            - call: "POST /orders/${order_c_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 46585 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { recapture_error: $.data.error_id }
          assert:
            - "the second CAPTURE returns HTTP 422 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Order.${order_c_id}.payment_status == PAID and paid_amount_cents == 46585 and version == 2"
            - "Channel.${channel_c_id}.booking_count == 1"
            - "AgencyAgreement.${agreement_c_id}.cumulative_net_revenue_cents == 46585"
            - "AgencyAgreement.${agreement_c_id}.incentive_accrued_cents == 582"

      - name: corner_withdrawn_agreement_refuses_every_further_round
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AgencyAgreement.terminal_states
          - validations[priority=10]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "WITHDRAWN is terminal for AgencyAgreement: no negotiation action — not ACCEPT, not COUNTER, not another WITHDRAW — is accepted afterwards, and the agreement's version stops advancing."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, one PROPOSED agreement that is then withdrawn."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_agreement
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "WITHDRAW", note: "partner exited the program" }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
              captures: { locked_accept_error: $.data.error_id }
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.03 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { locked_counter_error: $.data.error_id }
          assert:
            - "${locked_accept_error} == ERR_INVALID_STATE_TRANSITION with HTTP 422"
            - "${locked_counter_error} == ERR_INVALID_STATE_TRANSITION with HTTP 422"
            - "AgencyAgreement.${agreement_c_id}.status == WITHDRAWN and agreed_incentive_pct == null and version == 2"

      - name: corner_publishing_an_already_published_offer_is_not_a_silent_noop
        claim_type: idempotency
        grounds:
          - state_machines.Offer.transitions[CONSTRUCTED->PUBLISHED]
          - validations[priority=10]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "PUBLISHED -> PUBLISHED is not a declared edge, so a repeated publish is rejected with 422 rather than silently re-acknowledged; the second call cannot overwrite acknowledged_disclosure_codes and cannot bump the version."
        test_recipe:
          setup:
            - "Channel CORNER_NDC requiring DOT-FARE-INCL, and one offer already published with that acknowledgement."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - *c_publish
          trigger:
            - call: "POST /offers/${offer_c_id}/publish"
              payload: { disclosure_ack_codes: [] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { republish_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "the rejection outranks the disclosure check: the error is not ERR_DISCLOSURE_INCOMPLETE even though the second call acknowledged nothing"
            - "Offer.${offer_c_id}.acknowledged_disclosure_codes == [\"DOT-FARE-INCL\"] and disclosure_complete == true"
            - "Offer.${offer_c_id}.status == PUBLISHED and version == 2"

      - excluded_because:
          difficulty_instance: order_payment_and_fulfillment_dimensions_advance_independently
          rationale: >-
            The parallel-shape claim for the Order machine (two independent
            status dimensions that advance without dragging each other) is
            already asserted end to end by the §1.8 Rule 3 instance, which
            walks payment AUTHORIZED -> PAID while fulfillment walks
            RESERVED -> TICKETED -> CANCELLED and checks that neither
            dimension is coupled. Re-asserting it here would duplicate it.
        name: corner_order_parallel_status_dimensions_are_independent
        claim_type: valid_transition
        grounds:
          - state_machines.Order.initial_state
          - complexity_profile.state_machine_shape

      - excluded_because:
          difficulty_instance: agreement_counter_propose_cycle_reaches_signed_on_round_two
          rationale: >-
            The cyclic-shape claim for AgencyAgreement (PROPOSED -> COUNTERED
            -> PROPOSED traversed repeatedly, with negotiation_round
            monotonically increasing and the cycle exiting to SIGNED) is fully
            asserted by the §1.8 Rule 3 instance.
        name: corner_agreement_negotiation_cycle_is_traversable_twice
        claim_type: valid_transition
        grounds:
          - state_machines.AgencyAgreement.transitions[PROPOSED->COUNTERED]
          - state_machines.AgencyAgreement.transitions[COUNTERED->PROPOSED]

      - excluded_because:
          difficulty_instance: refund_apply_cascades_four_hops_order_channel_agreement_cost
          rationale: >-
            The cascading-side-effect pattern on the REFUND apply edge (order
            -> channel booking ledger -> agreement accrual -> channel cost
            recomputation, each hop caused by the previous one) is asserted
            hop by hop by the §1.8 Rule 4 instance.
        name: corner_refund_apply_side_effects_reach_every_dependent_entity
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceRequest.transitions[APPROVED->APPLIED].side_effects

      - excluded_because:
          difficulty_instance: schedule_then_cancel_restores_reserved_test_minutes
          rationale: >-
            The compensating side-effect claim on the SCHEDULED -> CANCELLED
            edge (reserved_test_minutes returns to its pre-scheduling value
            and both readiness variants are untouched) is asserted by the
            §1.8 Rule 9 instance.
        name: corner_cancelled_test_compensates_its_own_reservation
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConnectivityTest.transitions[SCHEDULED->CANCELLED].side_effects

  # ===========================================================================
  # SECTION 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: corner_bundle_line_discount_is_applied_before_the_channel_markup
        claim_type: correct_result
        grounds:
          - calculations.offer_line_pricing
          - entities.BundleDefinition
          - entities.OfferItem
        distinguishing_aspect: "offer_line_pricing composes the two factors in a fixed order per BUNDLE_ANCILLARY line — bundle discount first, channel markup second — so BAG20 at 7010 becomes 6530 (7010 x 0.90 x 1.035) and not 6534 (7010 x 1.035 x 0.90 would be 6529.815 as well, but applying the markup to the undiscounted list and then discounting the rounded result gives 6529); the FARE line receives no discount at all."
        test_recipe:
          setup:
            - "Channel CORNER_NDC (markup 0.035, no surcharge rules), FareFiling YCORN01 ACTIVE at 45010, ancillaries BAG20 (7010) and SEAT_STD (3010), and bundle FLEX_CORNER discounting 10%."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - &c_anc_bag
              call: "POST /ancillary-products"
              payload: { ancillary_code: "BAG20", name: "Checked bag 20kg", list_amount_cents: 7010, min_content_tier_rank: 1, refundable: true }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &c_anc_seat
              call: "POST /ancillary-products"
              payload: { ancillary_code: "SEAT_STD", name: "Standard seat", list_amount_cents: 3010, min_content_tier_rank: 1, refundable: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &c_bundle
              call: "POST /bundle-definitions"
              payload: { bundle_code: "FLEX_CORNER", ancillary_codes: ["BAG20", "SEAT_STD"], bundle_discount_pct: 0.10, min_content_tier_rank: 1 }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { bundle_c_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", bundle_id: "${bundle_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_bundle_id: $.data.id }
          assert:
            - "the call returns HTTP 201 with Offer.${offer_bundle_id}.item_count == 3"
            - "GET /offers/${offer_bundle_id}/items returns sequence 1 = FARE YCORN01 with list_amount_cents 45010 and net_amount_cents 46585"
            - "sequence 2 = BUNDLE_ANCILLARY BAG20 with list_amount_cents 7010 and net_amount_cents 6530"
            - "sequence 3 = BUNDLE_ANCILLARY SEAT_STD with list_amount_cents 3010 and net_amount_cents 2804"
            - "Offer.${offer_bundle_id}.subtotal_cents == 55919 and surcharge_cents == 0 and total_cents == 55919"
            - "Offer.${offer_bundle_id}.bundle_id == ${bundle_c_id} and the BAG20 line's refundable == true while the SEAT_STD line's refundable == false"

      - name: corner_surcharge_fires_at_the_threshold_and_stays_silent_one_cent_below
        claim_type: correct_result
        grounds:
          - calculations.surcharge_amount
          - entities.SurchargeRule
          - entities.Offer.fields.item_count
        distinguishing_aspect: "The threshold comparison is scope_base >= threshold_cents (inclusive) against the ALREADY ROUNDED fare line: a fare line of exactly 46585 emits a SURCHARGE line (raw 932, total 47517) while a fare line of 46584 emits nothing at all, so item_count itself differs between the two offers."
        test_recipe:
          setup:
            - "Channel CORNER_SUR (markup 0.035) carrying one FARE-scoped rule with threshold_cents 46585 and rate 0.02; two ACTIVE filings, YSURC01 at 45010 and YSURC02 at 45009."
          setup_api_calls:
            - &c_ch_sur
              call: "POST /channels"
              payload: { channel_code: "CORNER_SUR", channel_kind: "NDC_AGGREGATOR", content_tier: "STANDARD", content_markup_pct: 0.035 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_sur_id: $.data.id }
            - call: "POST /channels/${channel_sur_id}/surcharge-rules"
              payload: { surcharge_code: "YQ_HIGH", item_scope: "FARE", rate_pct: 0.02, threshold_cents: 46585, min_cents: 0, max_cents: 999999 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - *c_agy
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YSURC01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_sur_on_id: $.data.id }
            - call: "POST /fare-filings/${filing_sur_on_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_sur_on_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YSURC02", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45009, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_sur_off_id: $.data.id }
            - call: "POST /fare-filings/${filing_sur_off_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_sur_off_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_sur_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_sur_on_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_sur_on_id: $.data.id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_sur_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_sur_off_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_sur_off_id: $.data.id }
          assert:
            - "Offer.${offer_sur_on_id}.subtotal_cents == 46585, surcharge_cents == 932, total_cents == 47517 and item_count == 2"
            - "the SURCHARGE line of ${offer_sur_on_id} has sequence 2, item_code YQ_HIGH, list_amount_cents 932 and net_amount_cents 932"
            - "Offer.${offer_sur_off_id}.subtotal_cents == 46584, surcharge_cents == 0, total_cents == 46584 and item_count == 1"
            - "GET /offers/${offer_sur_off_id}/items returns total_count == 1 and contains no SURCHARGE row"

      - name: corner_surcharge_clamps_below_min_and_above_max
        claim_type: correct_result
        grounds:
          - calculations.surcharge_amount
          - entities.SurchargeRule.fields.min_cents
          - entities.SurchargeRule.fields.max_cents
        distinguishing_aspect: "The clamp is applied AFTER rounding and is recorded separately from the raw figure: a rule whose raw value is 47 is lifted to min_cents 500 and a rule whose raw value is 4659 is cut to max_cents 4000, with each SURCHARGE line keeping the unclamped raw in list_amount_cents and the clamped value in net_amount_cents."
        test_recipe:
          setup:
            - "Channel CORNER_CLAMP (markup 0.035) carrying two FARE-scoped rules: TINY (threshold 0, rate 0.001, min 500, max 4000) and HUGE (threshold 1000, rate 0.10, min 0, max 4000); FareFiling YCLMP01 ACTIVE at 45010."
          setup_api_calls:
            - call: "POST /channels"
              payload: { channel_code: "CORNER_CLAMP", channel_kind: "NDC_AGGREGATOR", content_tier: "STANDARD", content_markup_pct: 0.035 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_clamp_id: $.data.id }
            - call: "POST /channels/${channel_clamp_id}/surcharge-rules"
              payload: { surcharge_code: "TINY", item_scope: "FARE", rate_pct: 0.001, threshold_cents: 0, min_cents: 500, max_cents: 4000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /channels/${channel_clamp_id}/surcharge-rules"
              payload: { surcharge_code: "HUGE", item_scope: "FARE", rate_pct: 0.10, threshold_cents: 1000, min_cents: 0, max_cents: 4000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - *c_agy
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YCLMP01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_clamp_id: $.data.id }
            - call: "POST /fare-filings/${filing_clamp_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_clamp_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_clamp_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_clamp_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_clamp_id: $.data.id }
          assert:
            - "Offer.${offer_clamp_id}.subtotal_cents == 46585 and item_count == 3"
            - "the TINY line is emitted with sequence 2, list_amount_cents 47 and net_amount_cents 500 (lifted to min_cents)"
            - "the HUGE line is emitted with sequence 3, list_amount_cents 4659 and net_amount_cents 4000 (cut to max_cents)"
            - "the SURCHARGE lines are ordered by threshold_cents ASC, so TINY (threshold 0) precedes HUGE (threshold 1000)"
            - "Offer.${offer_clamp_id}.surcharge_cents == 4500 and total_cents == 51085"

      - name: corner_voided_order_never_enters_the_revenue_or_booking_base
        claim_type: input_set_filtering
        grounds:
          - calculations.agency_incentive_accrual.input_set
          - calculations.distribution_cost_per_booking.input_set
          - state_machines.Order.transitions[AUTHORIZED->VOIDED]
        distinguishing_aspect: "Both aggregates read only payment_status == PAID orders: with one captured order and one voided order on the same channel and agreement, booking_count stays 1, cumulative_net_revenue_cents stays 46585 and neither per-booking figure is halved by the voided order."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with a SIGNED agreement, FareFiling YCORN01 ACTIVE, two published offers of 46585 each."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
            - *c_capture
            - &c_offer_two
              call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-20T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_two_id: $.data.id }
            - call: "POST /offers/${offer_two_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /orders"
              payload: { offer_id: "${offer_two_id}", disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { order_two_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_two_id}/payment"
              payload: { action: "VOID" }
              as: Agency
              as_user_id: "${partner_agy_id}"
          assert:
            - "Order.${order_two_id}.payment_status == VOIDED and fulfillment_status == CANCELLED and net_revenue_cents is still 46585"
            - "Channel.${channel_c_id}.booking_count == 1"
            - "AgencyAgreement.${agreement_c_id}.cumulative_net_revenue_cents == 46585 and incentive_accrued_cents == 582 and incentive_tier == TIER_1"
            - "Channel.${channel_c_id}.cost_per_booking_flat_cents == 400000"
            - "Channel.${channel_c_id}.activity_cost_cents == 634 and cost_per_booking_activity_cents == 634"
            - "GET /orders?channel_id=${channel_c_id}&payment_status=PAID returns total_count == 1"

      - name: corner_refund_fee_uses_the_low_tier_constant_below_the_mid_floor
        claim_type: constants_applied
        grounds:
          - calculations.refund_settlement.constants
          - state_machines.ServiceRequest.transitions[UNDER_REVIEW->APPROVED]
        distinguishing_aspect: "A refundable base of 46585 is strictly below REFUND_FEE_MID_FLOOR_CENTS (50000), so the flat REFUND_FEE_LOW_CENTS of 2500 is charged — not the mid 7500 and not the 5% high-tier rate — and the audit-only clawback uses the TIER_1 rate stored on the agreement at approval time."
        test_recipe:
          setup:
            - "Channel CORNER_NDC with refund parity enabled, agency Alpha with a SIGNED agreement at TIER_1, one PAID order of 46585 whose single FARE line is refundable."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
            - *c_capture
            - &c_sr_refund
              call: "POST /orders/${order_c_id}/service-requests"
              payload: { request_type: "REFUND", requested_change_note: "customer cancelled" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { sr_refund_id: $.data.id }
            - &c_sr_review
              call: "POST /service-requests/${sr_refund_id}/review"
              payload: { action: "START_REVIEW" }
              as: DistributionManager
              as_user_id: "dm-002"
          trigger:
            - call: "POST /service-requests/${sr_refund_id}/review"
              payload: { action: "APPROVE" }
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "ServiceRequest.${sr_refund_id}.status == APPROVED"
            - "ServiceRequest.${sr_refund_id}.refundable_base_cents == 46585"
            - "ServiceRequest.${sr_refund_id}.cancellation_fee_cents == 2500"
            - "ServiceRequest.${sr_refund_id}.refund_total_cents == 44085"
            - "ServiceRequest.${sr_refund_id}.incentive_clawback_cents == 441"
            - "the Order is NOT mutated by the approval: Order.${order_c_id}.payment_status == PAID and refunded_amount_cents == 0"
            - "AgencyAgreement.${agreement_c_id}.incentive_accrued_cents is still 582 — the clawback is recorded, never subtracted"

      - name: corner_line_markup_rounds_half_up_away_from_the_even_neighbour
        claim_type: precision
        grounds:
          - calculations.offer_line_pricing.precision
        distinguishing_aspect: "A fare line of 4010 at a 0.05 markup lands exactly on 4210.50, and round_half_up takes it to 4211; a banker's-rounding or truncating implementation would report 4210."
        test_recipe:
          setup:
            - "Channel CORNER_PREC (markup 0.05, no surcharge rules) and FareFiling YPREC01 ACTIVE at 4010."
          setup_api_calls:
            - call: "POST /channels"
              payload: { channel_code: "CORNER_PREC", channel_kind: "DIRECT", content_tier: "FULL", content_markup_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_prec_id: $.data.id }
            - *c_agy
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YPREC01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 4010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_prec_id: $.data.id }
            - call: "POST /fare-filings/${filing_prec_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_prec_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_prec_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_prec_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_prec_id: $.data.id }
          assert:
            - "the FARE line of ${offer_prec_id} has net_amount_cents == 4211"
            - "that value is NOT 4210 (banker's rounding) and NOT 4210 (truncation)"
            - "Offer.${offer_prec_id}.subtotal_cents == 4211 and total_cents == 4211"

      - name: corner_readiness_weighted_mean_rounds_a_tie_upward
        claim_type: precision
        grounds:
          - calculations.certification_readiness_score.precision
          - calculations.certification_readiness_score.constants
        distinguishing_aspect: "One PASSED mandatory test scoring 90 (weight 3) and one PASSED optional test scoring 68 (weight 1) give the exact weighted mean 338/4 = 84.5, which round_half_up stores as 85 on BOTH variants; a banker's-rounding implementation would store 84 and fall below CERT_MIN_READINESS."
        test_recipe:
          setup:
            - "Tech provider Tango under certification on CORNER_NDC in env CORNER_ENV with one mandatory and one optional test, both scheduled without overlap."
          setup_api_calls:
            - *c_ch
            - *c_tech
            - *c_cert
            - *c_test_mand
            - &c_test_opt
              call: "POST /partner-certifications/${cert_c_id}/connectivity-tests"
              payload: { test_code: "ORDER_CREATE", is_mandatory: false, scheduled_start: "2026-08-03T13:00:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { test_opt_id: $.data.id }
          trigger:
            - call: "POST /connectivity-tests/${test_mand_id}/outcome"
              payload: { outcome: "PASSED", score: 90 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
            - call: "POST /connectivity-tests/${test_opt_id}/outcome"
              payload: { outcome: "PASSED", score: 68 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
          assert:
            - "PartnerCertification.${cert_c_id}.readiness_score_strict == 85"
            - "PartnerCertification.${cert_c_id}.readiness_score_provisional == 85"
            - "neither score is 84, so the tie was not resolved downward or to the even neighbour"
            - "PartnerCertification.${cert_c_id}.mandatory_failed_count == 0 and reserved_test_minutes == 0"
            - "after the first outcome only, readiness_score_strict == 90 — the optional test is absent from the mean until it reaches a terminal state"

      - excluded_because:
          difficulty_instance: offer_subtotal_rounds_per_line_before_summing
          rationale: >-
            The pinned rounding order of offer_line_pricing (round each line at
            Step 3, then sum the already rounded lines, which differs from
            rounding a single exact sum) is asserted with a fixture built to
            diverge by the §1.8 Rule 2 instance. The corner bundle instance
            above uses amounts where both orders agree, so it deliberately does
            not restate this claim.
        name: corner_subtotal_is_a_sum_of_rounded_lines
        claim_type: precision
        grounds:
          - calculations.offer_line_pricing.formula

      - excluded_because:
          difficulty_instance: incentive_tier_two_entry_is_inclusive_at_tier_one_ceiling
          rationale: >-
            The tiered_pricing boundary row for agency_incentive_accrual (R ==
            TIER_1_CEILING_CENTS already labels TIER_2 with an empty t2 band,
            while R one cent lower stays TIER_1) is asserted as an adjacent
            pair by the §1.8 Rule 6 instance.
        name: corner_incentive_tier_boundary_is_inclusive
        claim_type: correct_result
        grounds:
          - calculations.agency_incentive_accrual.formula

      - excluded_because:
          difficulty_instance: refund_settlement_pinned_step_order_fee_then_total_then_clawback
          rationale: >-
            The waterfall_allocation ordering claim (the fee tier is keyed on
            the Step-1 base, the total on Steps 1-2, the clawback on the Step-3
            total and on the tier stored before the cascade) is asserted step
            by step by the §1.8 Rule 2 instance.
        name: corner_refund_settlement_steps_are_evaluated_in_order
        claim_type: correct_result
        grounds:
          - calculations.refund_settlement.formula

      - excluded_because:
          difficulty_instance: connectivity_test_teardown_buffer_gap_of_exactly_fifteen_conflicts
          rationale: >-
            The interval_merge boundary row (a gap of exactly
            TEST_TEARDOWN_BUFFER_MINUTES conflicts because both intervals are
            closed, while a strictly larger gap does not) is asserted as an
            adjacent pair by the §1.8 Rule 8 instance.
        name: corner_teardown_buffer_boundary_is_inclusive
        claim_type: correct_result
        grounds:
          - calculations.connectivity_slot_occupation.formula

      - excluded_because:
          difficulty_instance: empty_required_disclosure_codes_publish_succeeds_with_omitted_ack
          rationale: >-
            The empty-input boundary of the disclosure_completeness aggregation
            (required == [] makes missing == [] for any acked value, including
            an omitted array) is asserted by the §1.8 Rule 6 instance.
        name: corner_disclosure_completeness_on_an_empty_requirement_set
        claim_type: input_set_filtering
        grounds:
          - calculations.disclosure_completeness.formula

      - excluded_because:
          difficulty_instance: channel_cost_variants_diverge_on_identical_paid_order_population
          rationale: >-
            The dual-variant divergence claim for distribution_cost_per_booking
            (CHANNEL_AVERAGE and ACTIVITY_BASED reading the identical PAID
            order population yet reporting different per-booking figures) is
            asserted by the §1.8 Rule 1 instance, which also proves neither
            figure can be derived from the other.
        name: corner_cost_variants_disagree_on_the_same_bookings
        claim_type: variant_divergence
        grounds:
          - calculations.distribution_cost_per_booking.variants

      - excluded_because:
          difficulty_instance: certification_readiness_strict_zeroes_while_provisional_clears_minimum
          rationale: >-
            The variant-selection claim (readiness_variant on the CERTIFY
            decision picks which stored score is compared to
            CERT_MIN_READINESS, so STRICT is refused with
            ERR_READINESS_BELOW_MINIMUM while PROVISIONAL certifies the same
            test population) is asserted by the §1.8 Rule 1 instance.
        name: corner_readiness_variant_selects_the_gating_score
        claim_type: variant_selection
        grounds:
          - calculations.certification_readiness_score.variants
          - endpoints.POST_partner_certifications_id_decision

      - excluded_because:
          difficulty_instance: channel_cost_variants_diverge_on_identical_paid_order_population
          rationale: >-
            The reconciliation claim (both cost variants are stored side by side
            on the Channel row and are readable in the same response, so no
            caller has to recompute one from the other) is covered by the same
            §1.8 Rule 1 instance, which reads both fields from one
            GET /channels/{id}.
        name: corner_both_cost_variants_are_reported_together
        claim_type: reconciliation
        grounds:
          - entities.Channel.fields.cost_per_booking_flat_cents
          - entities.Channel.fields.cost_per_booking_activity_cents

  # ===========================================================================
  # SECTION 4 — validations
  # ===========================================================================
  - section: validations
    instances:

      - name: corner_capture_one_cent_short_of_the_offer_total_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
          - state_machines.Order.transitions[AUTHORIZED->PAID].preconditions
        distinguishing_aspect: "CAPTURE demands payment_amount_cents exactly equal to the source offer's total_cents: 46584 against a 46585 offer is refused with 422 and every downstream effect is skipped — the order stays AUTHORIZED, booking_count stays 0 and the agreement ledger stays empty."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with a SIGNED agreement, one AUTHORIZED order whose offer total is 46585."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
          trigger:
            - call: "POST /orders/${order_c_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 46584 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { mismatch_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "Order.${order_c_id}.payment_status == AUTHORIZED, paid_amount_cents == 0 and version == 1"
            - "Channel.${channel_c_id}.booking_count == 0 and cost_per_booking_flat_cents == 0"
            - "AgencyAgreement.${agreement_c_id}.cumulative_net_revenue_cents == 0 and incentive_accrued_cents == 0"

      - name: corner_offer_construction_at_the_sale_window_end_instant_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_FARE_SALE_WINDOW_CLOSED
          - state_machines.Offer.transitions[null->CONSTRUCTED].preconditions
        distinguishing_aspect: "The sale window is half-open [sale_from, sale_to), so with the logical clock moved to exactly sale_to (2026-10-01T00:00:00.000Z) construction is refused with ERR_FARE_SALE_WINDOW_CLOSED even though the filing is still ACTIVE — the error is not ERR_FARE_FILING_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE with sale window ending 2026-10-01T00:00:00.000Z."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-11-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { window_closed_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_FARE_SALE_WINDOW_CLOSED"
            - "FareFiling.${filing_c_id}.status is still ACTIVE"
            - "GET /offers?channel_id=${channel_c_id} returns total_count == 0"
            - "with the clock one millisecond earlier (2026-09-30T23:59:59.999Z) the same request would be inside the window"

      - name: corner_departure_outside_the_travel_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_TRAVEL_DATE_OUT_OF_WINDOW
        distinguishing_aspect: "The travel window is CLOSED [travel_from, travel_to], so a departure_date of 2027-01-01 (one day past travel_to) is refused while travel_to itself would be accepted; the check is on departure_date, not on the clock."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE with travel window 2026-09-01 .. 2026-12-31."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2027-01-01T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { travel_window_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_TRAVEL_DATE_OUT_OF_WINDOW"
            - "a second POST /offers identical except departure_date == 2026-12-31T00:00:00.000Z returns HTTP 201, proving the upper bound is inclusive"

      - name: corner_tracking_ref_with_the_wrong_prefix_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors.ERR_CORPORATE_TRACKING_REF_INVALID
          - entities.CorporateContract.fields.tracking_ref_prefix
        distinguishing_aspect: "A present-but-wrong corporate_tracking_ref is a distinct failure from a missing one: with tracking_ref_prefix ACME- a ref of GLOBEX-778 returns ERR_CORPORATE_TRACKING_REF_INVALID (priority 19), not ERR_CORPORATE_TRACKING_REF_MISSING (priority 18)."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, corporate partner Acme, FareFiling YCORN01 ACTIVE, an IN_EFFECT contract requiring traceability with prefix ACME-, and a PUBLISHED offer priced under that contract."
          setup_api_calls:
            - *c_ch
            - &c_corp
              call: "POST /distribution-partners"
              payload: { partner_name: "Acme Corner Industries", partner_type: "CORPORATE", iata_code: "55555552", home_country: "DE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_corp_id: $.data.id }
            - *c_filing
            - *c_filed
            - *c_active
            - &c_contract
              call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-DE", max_offer_total_cents: 1000000, traceability_required: true, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-31T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_c_id: $.data.id }
            - &c_offer_corp
              call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${filing_c_id}", corporate_contract_id: "${contract_c_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { offer_corp_id: $.data.id }
            - &c_publish_corp
              call: "POST /offers/${offer_corp_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /orders"
              payload: { offer_id: "${offer_corp_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], corporate_tracking_ref: "GLOBEX-778" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { bad_prefix_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_CORPORATE_TRACKING_REF_INVALID"
            - "CorporateContract.${contract_c_id}.validity_state == IN_EFFECT"
            - "Offer.${offer_corp_id}.status is still PUBLISHED and no Order row exists for it"

      - name: corner_contract_without_traceability_accepts_an_order_with_no_ref
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=18]
          - entities.CorporateContract.fields.traceability_required
          - state_machines.Order.transitions[null->AUTHORIZED_RESERVED].preconditions
        distinguishing_aspect: "The traceability gate is conditional on the contract flag, not unconditional: with traceability_required false an order carrying no corporate_tracking_ref at all is accepted, and the ordering CORPORATE partner needs no AgencyAgreement because the SIGNED-agreement rule applies only to TRAVEL_AGENCY partners."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, corporate partner Acme, FareFiling YCORN01 ACTIVE, an IN_EFFECT contract with traceability_required false, and a PUBLISHED offer priced under it."
          setup_api_calls:
            - *c_ch
            - *c_corp
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-OPEN", max_offer_total_cents: 1000000, traceability_required: false, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-31T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_open_id: $.data.id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${filing_c_id}", corporate_contract_id: "${contract_open_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { offer_open_id: $.data.id }
            - call: "POST /offers/${offer_open_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /orders"
              payload: { offer_id: "${offer_open_id}", disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { order_open_id: $.data.id }
          assert:
            - "the call returns HTTP 201 with Order.${order_open_id}.payment_status == AUTHORIZED and fulfillment_status == RESERVED"
            - "Order.${order_open_id}.corporate_tracking_ref == null"
            - "Order.${order_open_id}.agency_agreement_id == null because the partner_type is CORPORATE"
            - "Order.${order_open_id}.net_revenue_cents == 46585 and Offer.${offer_open_id}.status == ORDERED"

      - name: corner_auth_and_shape_rungs_outrank_lookup_and_business_rungs
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=28]
        distinguishing_aspect: "The first three rungs are checked in order against requests that violate several rules at once: a missing X-User-ID on a duplicate-code channel create returns ERR_UNAUTHENTICATED (1), the same duplicate create by a PricingAnalyst returns ERR_UNAUTHORIZED (2), and an unknown-filing state call carrying an invalid to_state returns ERR_INVALID_REQUEST (3) rather than ERR_FARE_FILING_NOT_FOUND (4)."
        test_recipe:
          setup:
            - "Channel CORNER_NDC already registered, so CORNER_NDC is a duplicate channel_code."
          setup_api_calls:
            - *c_ch
          trigger:
            - call: "POST /channels"
              payload: { channel_code: "CORNER_NDC", channel_kind: "DIRECT" }
              as: PlatformAdmin
              as_user_id: ""
              captures: { rung_one_error: $.data.error_id }
            - call: "POST /channels"
              payload: { channel_code: "CORNER_NDC", channel_kind: "DIRECT" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { rung_two_error: $.data.error_id }
            - call: "POST /fare-filings/00000000-0000-4000-8000-000000000000/state"
              payload: { to_state: "NOT_A_STATE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { rung_three_error: $.data.error_id }
          assert:
            - "${rung_one_error} == ERR_UNAUTHENTICATED with HTTP 401 — the empty X-User-ID is caught before the role check and before the duplicate-code check"
            - "${rung_two_error} == ERR_UNAUTHORIZED with HTTP 403 — not ERR_DUPLICATE_CHANNEL_CODE, even though the code really is a duplicate"
            - "${rung_three_error} == ERR_INVALID_REQUEST with HTTP 400 — not ERR_FARE_FILING_NOT_FOUND, even though the path id resolves to nothing"
            - "GET /channels/${channel_c_id} still reports channel_kind == NDC_AGGREGATOR, so none of the three refused calls mutated anything"

      - excluded_because:
          difficulty_instance: fare_filing_not_active_outranks_contract_cap_exceeded
          rationale: >-
            This priority-ordering pair (a state-gate error at priority 8
            beating a fiscal-cap error at priority 31 on a request that
            violates both, then the same request with the state fixed
            surfacing the cap error) is asserted by the §1.8 Rule 5 instance.
        name: corner_state_gate_outranks_the_fiscal_cap
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=31]

      - excluded_because:
          difficulty_instance: disclosure_incomplete_outranks_corporate_tracking_ref_missing
          rationale: >-
            This second priority-ordering pair — deliberately drawn from a
            different error category than the first, pitting a regulatory
            disclosure error at priority 15 against a traceability error at
            priority 18 — is asserted by the §1.8 Rule 5 instance.
        name: corner_disclosure_gate_outranks_the_traceability_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=18]

      - excluded_because:
          difficulty_instance: order_creation_requires_agreement_in_signed_state
          rationale: >-
            The cross-entity state validation pattern (an order is admissible
            only while a SIGNED AgencyAgreement exists for its
            (partner_id, channel_id), and the very same request flips from
            ERR_AGREEMENT_NOT_SIGNED to 201 when the agreement is signed) is
            asserted by the §1.8 Rule 7 instance.
        name: corner_order_requires_a_signed_agreement
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_AGREEMENT_NOT_SIGNED

      - excluded_because:
          difficulty_instance: refund_apply_requires_channel_refund_parity_state
          rationale: >-
            The second cross-entity state validation (applying a REFUND depends
            on the CHANNEL's servicing_parity_refund flag, an entity pair
            different from the order/agreement pair above) is asserted by the
            §1.8 Rule 7 instance.
        name: corner_refund_apply_requires_channel_refund_parity
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL

      - excluded_because:
          difficulty_instance: fare_sale_window_adjacency_allowed_but_strict_overlap_rejected
          rationale: >-
            The temporal-window validation pattern for fare filings (two ACTIVE
            filings on the same market may touch at a half-open boundary but
            may not strictly overlap) is asserted as an adjacent pair by the
            §1.8 Rule 8 instance.
        name: corner_active_filings_may_touch_but_not_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_FARE_SALE_WINDOW_OVERLAP

      - excluded_because:
          difficulty_instance: connectivity_test_teardown_buffer_gap_of_exactly_fifteen_conflicts
          rationale: >-
            The aggregate/threshold validation pattern on connectivity slots
            (the pairwise teardown-buffer rule and the env-wide concurrency
            capacity rule, which are scoped differently and cannot mask each
            other) is asserted by the §1.8 Rule 8 instance.
        name: corner_connectivity_slot_rules_are_independently_scoped
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - validations[priority=26]

  # ===========================================================================
  # SECTION 5 — endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_offer_list_filters_compose_on_channel_and_status
        claim_type: standard_crud
        grounds:
          - endpoints.GET_offers
          - endpoints.POST_offers
          - endpoints.GET_offers_id
        distinguishing_aspect: "GET /offers applies its optional filters conjunctively: with two offers on the same channel in different statuses, status=PUBLISHED returns exactly one row, an unrelated channel_id returns none, and each row is individually retrievable by id."
        test_recipe:
          setup:
            - "Channel CORNER_NDC and channel CORNER_SUR, agency Alpha, FareFiling YCORN01 ACTIVE, two offers on CORNER_NDC of which one is published."
          setup_api_calls:
            - *c_ch
            - *c_ch_sur
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - *c_publish
            - *c_offer_two
          trigger:
            - call: "GET /offers?channel_id=${channel_c_id}&status=PUBLISHED"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { listed_published_id: "$.data[0].id" }
          assert:
            - "the call returns HTTP 200 with response_type == array and total_count == 1"
            - "${listed_published_id} == ${offer_c_id}"
            - "GET /offers?channel_id=${channel_c_id} returns total_count == 2"
            - "GET /offers?channel_id=${channel_c_id}&status=CONSTRUCTED returns total_count == 1 and that row is ${offer_two_id}"
            - "GET /offers?channel_id=${channel_sur_id} returns total_count == 0"
            - "GET /offers/${offer_two_id} returns HTTP 200 with status == CONSTRUCTED"

      - name: corner_ticketing_before_capture_is_refused_by_the_action_endpoint
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_orders_id_fulfillment
          - validations[priority=11]
          - errors.ERR_ORDER_NOT_PAID
        distinguishing_aspect: "The fulfillment action endpoint reads the OTHER status dimension as a precondition: TICKET on an AUTHORIZED order returns ERR_ORDER_NOT_PAID, and the same call succeeds unchanged once the payment dimension reaches PAID."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with a SIGNED agreement, one AUTHORIZED order of 46585."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
          trigger:
            - call: "POST /orders/${order_c_id}/fulfillment"
              payload: { action: "TICKET" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { not_paid_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_ORDER_NOT_PAID"
            - "Order.${order_c_id}.fulfillment_status is still RESERVED and version == 1"
            - "after POST /orders/${order_c_id}/payment with action CAPTURE and payment_amount_cents 46585, the identical TICKET call returns HTTP 200 with fulfillment_status == TICKETED"

      - name: corner_one_suspension_call_withdraws_every_dependent_offer
        claim_type: bulk_action
        grounds:
          - endpoints.POST_fare_filings_id_state
          - state_machines.FareFiling.transitions[ACTIVE->SUSPENDED].side_effects
        distinguishing_aspect: "A single state call fans out over an unbounded row set: both offers built on the filing — one PUBLISHED and one CONSTRUCTED — are withdrawn by the same request, while an offer built on a different filing on the same channel is left alone."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE with two offers (one published, one constructed), plus FareFiling YOTHER1 ACTIVE with one constructed offer on the same channel."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - *c_publish
            - *c_offer_two
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YOTHER1", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_other_id: $.data.id }
            - call: "POST /fare-filings/${filing_other_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_other_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_other_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-25T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_other_id: $.data.id }
          trigger:
            - call: "POST /fare-filings/${filing_c_id}/state"
              payload: { to_state: "SUSPENDED", reason: "bulk pull" }
              as: DistributionManager
              as_user_id: "dm-001"
          assert:
            - "the call returns HTTP 200 with FareFiling.${filing_c_id}.status == SUSPENDED"
            - "Offer.${offer_c_id}.status == WITHDRAWN (it was PUBLISHED)"
            - "Offer.${offer_two_id}.status == WITHDRAWN (it was CONSTRUCTED)"
            - "Offer.${offer_other_id}.status is still CONSTRUCTED"
            - "GET /offers?channel_id=${channel_c_id}&status=WITHDRAWN returns total_count == 2"

      - name: corner_offer_pins_the_channel_version_it_was_priced_against
        claim_type: cross_reference_link
        grounds:
          - entities.Offer.fields.priced_channel_version
          - endpoints.PATCH_channels_id_content_policy
        distinguishing_aspect: "priced_channel_version is a snapshot link, not a live pointer: patching the channel's content policy after construction advances Channel.version to 2 while the offer keeps priced_channel_version 1 and its already-priced lines."
        test_recipe:
          setup:
            - "Channel CORNER_NDC at version 1, agency Alpha, FareFiling YCORN01 ACTIVE, one CONSTRUCTED offer priced at 46585."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
          trigger:
            - call: "PATCH /channels/${channel_c_id}/content-policy"
              payload: { content_tier: "FULL", required_disclosure_codes: ["DOT-FARE-INCL", "EU-261"] }
              as: DistributionManager
              as_user_id: "dm-001"
          assert:
            - "the call returns HTTP 200 with Channel.${channel_c_id}.version == 2 and content_tier_rank == 3"
            - "Offer.${offer_c_id}.priced_channel_version == 1"
            - "Offer.${offer_c_id}.subtotal_cents is still 46585 — the patch does not reprice existing offers"
            - "publishing ${offer_c_id} now requires both DOT-FARE-INCL and EU-261, so the channel's NEW policy governs the publish call"

      - name: corner_contract_validity_state_is_recomputed_from_the_clock
        claim_type: computed_read
        grounds:
          - entities.CorporateContract.fields.validity_state
          - endpoints.GET_corporate_contracts_id
          - endpoints.POST_clock_set_current_utc
        distinguishing_aspect: "validity_state is derived on read from the half-open window [effective_from, effective_to): the same contract row reads PENDING before the window, IN_EFFECT at exactly effective_from, and EXPIRED at exactly effective_to, without any state-changing request."
        test_recipe:
          setup:
            - "Corporate partner Acme and an ACTIVE filing; one contract with window [2026-09-01, 2026-10-01) created while the clock is at 2026-08-01."
          setup_api_calls:
            - *c_corp
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-WIN", max_offer_total_cents: 1000000, traceability_required: false, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-09-01T00:00:00.000Z", effective_to: "2026-10-01T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_win_id: $.data.id }
          trigger:
            - call: "GET /corporate-contracts/${contract_win_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /corporate-contracts/${contract_win_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /corporate-contracts/${contract_win_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
          assert:
            - "the first read reports CorporateContract.${contract_win_id}.validity_state == PENDING"
            - "the second read reports validity_state == IN_EFFECT — effective_from is inclusive"
            - "the third read reports validity_state == EXPIRED — effective_to is exclusive"
            - "CorporateContract.${contract_win_id}.version stays 1 across all three reads; validity_state is never written"
            - "GET /corporate-contracts?validity_state=IN_EFFECT returns total_count == 0 at the third clock position"

      - name: corner_certify_is_conditional_on_no_outstanding_scheduled_test
        claim_type: conditional_action
        grounds:
          - endpoints.POST_partner_certifications_id_decision
          - state_machines.PartnerCertification.transitions[TESTING->CERTIFIED].preconditions
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "CERTIFY has two ordered preconditions: while any ConnectivityTest is still SCHEDULED the decision is refused with ERR_INVALID_STATE_TRANSITION (priority 10) rather than judged on the readiness score, and only after every test reaches a terminal state is the score compared to CERT_MIN_READINESS."
        test_recipe:
          setup:
            - "Tech provider Tango under certification on CORNER_NDC with a mandatory test PASSED at 90 and an optional test still SCHEDULED."
          setup_api_calls:
            - *c_ch
            - *c_tech
            - *c_cert
            - *c_test_mand
            - *c_test_opt
            - call: "POST /connectivity-tests/${test_mand_id}/outcome"
              payload: { outcome: "PASSED", score: 90 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
          trigger:
            - call: "POST /partner-certifications/${cert_c_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "STRICT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { pending_test_error: $.data.error_id }
            - call: "POST /connectivity-tests/${test_opt_id}/outcome"
              payload: { outcome: "PASSED", score: 68 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
            - call: "POST /partner-certifications/${cert_c_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "STRICT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "${pending_test_error} == ERR_INVALID_STATE_TRANSITION with HTTP 422, even though readiness_score_strict was already 90 at that moment"
            - "the refused decision leaves PartnerCertification.${cert_c_id}.status == TESTING and certified_variant == null"
            - "the second decision returns HTTP 200 with status == CERTIFIED and certified_variant == STRICT"
            - "PartnerCertification.${cert_c_id}.readiness_score_strict == 85 and reserved_test_minutes == 0"
            - "DistributionPartner.${partner_tech_id}.certification_status == CERTIFIED"

  # ===========================================================================
  # SECTION 6 — errors
  # ===========================================================================
  - section: errors
    instances:

      - name: corner_error_duplicate_channel_code_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_CHANNEL_CODE
          - validations[priority=28]
        distinguishing_aspect: "channel_code is globally unique, so registering CORNER_NDC a second time — even with a different channel_kind and by the authorised PlatformAdmin — returns 422 ERR_DUPLICATE_CHANNEL_CODE and leaves the first row untouched."
        test_recipe:
          setup:
            - "Channel CORNER_NDC already registered."
          setup_api_calls:
            - *c_ch
          trigger:
            - call: "POST /channels"
              payload: { channel_code: "CORNER_NDC", channel_kind: "GDS_LEGACY", content_tier: "RESTRICTED" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { duplicate_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_DUPLICATE_CHANNEL_CODE"
            - "Channel.${channel_c_id}.channel_kind is still NDC_AGGREGATOR and content_tier is still STANDARD and version == 1"

      - name: corner_error_offer_expired_at_exactly_the_ttl_instant
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OFFER_EXPIRED
          - validations[priority=7]
          - state_machines.Offer.transitions[CONSTRUCTED->EXPIRED]
        distinguishing_aspect: "expires_at is created_at + OFFER_TTL_MINUTES and the expiry comparison is clock >= expires_at, so with the clock moved to exactly 2026-08-01T00:30:00.000Z the publish attempt is refused with ERR_OFFER_EXPIRED and the lazy transition has already flipped the offer to EXPIRED."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, FareFiling YCORN01 ACTIVE, one CONSTRUCTED offer created at the 2026-08-01T00:00:00.000Z clock default."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /offers/${offer_c_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { expired_error: $.data.error_id }
          assert:
            - "Offer.${offer_c_id}.expires_at == 2026-08-01T00:30:00.000Z"
            - "the call returns HTTP 422 with data.error_id == ERR_OFFER_EXPIRED"
            - "GET /offers/${offer_c_id} reports status == EXPIRED and disclosure_complete == false"
            - "a POST /orders on ${offer_c_id} also returns ERR_OFFER_EXPIRED, not ERR_OFFER_NOT_PUBLISHED, because priority 7 outranks priority 9"

      - name: corner_error_offer_not_published_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OFFER_NOT_PUBLISHED
          - validations[priority=9]
        distinguishing_aspect: "Ordering a CONSTRUCTED offer inside its TTL returns ERR_OFFER_NOT_PUBLISHED — priority 9 — and specifically NOT ERR_AGREEMENT_NOT_SIGNED at priority 12, even though the ordering agency also has no signed agreement."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with NO agreement, FareFiling YCORN01 ACTIVE, one CONSTRUCTED offer well inside its TTL."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
          trigger:
            - call: "POST /orders"
              payload: { offer_id: "${offer_c_id}", disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { not_published_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_OFFER_NOT_PUBLISHED"
            - "GET /agency-agreements?partner_id=${partner_agy_id} returns total_count == 0, confirming the lower-priority agreement gate was genuinely violated too"
            - "Offer.${offer_c_id}.status is still CONSTRUCTED"

      - name: corner_error_certification_already_open_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CERTIFICATION_ALREADY_OPEN
          - validations[priority=13]
          - state_machines.PartnerCertification.transitions[null->TESTING].preconditions
        distinguishing_aspect: "At most one live certification may exist per (partner_id, channel_id): a second POST /partner-certifications while the first is TESTING is refused with 422, and a different env_code does not open a second slot."
        test_recipe:
          setup:
            - "Channel CORNER_NDC and tech provider Tango with one TESTING certification in env CORNER_ENV."
          setup_api_calls:
            - *c_ch
            - *c_tech
            - *c_cert
          trigger:
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_tech_id}", channel_id: "${channel_c_id}", env_code: "OTHER_ENV" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { already_open_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_CERTIFICATION_ALREADY_OPEN"
            - "GET /partner-certifications?partner_id=${partner_tech_id} returns total_count == 1"
            - "DistributionPartner.${partner_tech_id}.version == 2 — the refused call did not bump it again"

      - name: corner_error_partner_type_not_eligible_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PARTNER_TYPE_NOT_ELIGIBLE
          - validations[priority=20]
          - state_machines.PartnerCertification.transitions[null->TESTING].preconditions
        distinguishing_aspect: "Only TECH_PROVIDER and TRAVEL_AGENCY partners may enter connectivity certification, so a CORPORATE partner is refused with ERR_PARTNER_TYPE_NOT_ELIGIBLE while the identical request for the TECH_PROVIDER succeeds."
        test_recipe:
          setup:
            - "Channel CORNER_NDC with corporate partner Acme and tech provider Tango both registered."
          setup_api_calls:
            - *c_ch
            - *c_corp
            - *c_tech
          trigger:
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_corp_id}", channel_id: "${channel_c_id}", env_code: "CORNER_ENV" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { not_eligible_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_PARTNER_TYPE_NOT_ELIGIBLE"
            - "DistributionPartner.${partner_corp_id}.certification_status is still UNCERTIFIED and version == 1"
            - "the same request for ${partner_tech_id} returns HTTP 201 with status == TESTING"

      - name: corner_error_private_fare_requires_contract_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PRIVATE_FARE_REQUIRES_CONTRACT
          - validations[priority=17]
        distinguishing_aspect: "A filing with is_private true cannot be sold as public content: an offer omitting corporate_contract_id is refused with ERR_PRIVATE_FARE_REQUIRES_CONTRACT at priority 17, ahead of the contract-validity and cap rungs which cannot even be evaluated."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, and a PRIVATE filing YPRIV01 ACTIVE at 45010."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YPRIV01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: true }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_priv_id: $.data.id }
            - call: "POST /fare-filings/${filing_priv_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_priv_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_priv_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { private_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_PRIVATE_FARE_REQUIRES_CONTRACT"
            - "FareFiling.${filing_priv_id}.is_private == true and status == ACTIVE"
            - "GET /offers?fare_filing_id=${filing_priv_id} returns total_count == 0"

      - name: corner_error_contract_not_in_effect_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CONTRACT_NOT_IN_EFFECT
          - validations[priority=21]
          - entities.CorporateContract.fields.validity_state
        distinguishing_aspect: "A PENDING contract cannot price an offer: with the clock at 2026-08-01 and a window opening 2026-09-01 the request is refused with ERR_CONTRACT_NOT_IN_EFFECT at priority 21, which is reached only because the public filing keeps priority 17 silent."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, corporate partner Acme, public FareFiling YCORN01 ACTIVE, and a contract whose window has not opened yet."
          setup_api_calls:
            - *c_ch
            - *c_corp
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-LATE", max_offer_total_cents: 1000000, traceability_required: false, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-09-01T00:00:00.000Z", effective_to: "2026-10-01T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_late_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${filing_c_id}", corporate_contract_id: "${contract_late_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { not_in_effect_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 with data.error_id == ERR_CONTRACT_NOT_IN_EFFECT"
            - "CorporateContract.${contract_late_id}.validity_state == PENDING"
            - "the error is not ERR_CONTRACT_CAP_EXCEEDED — the 1000000 cap was never in question"

      - name: corner_error_contract_cap_exceeded_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CONTRACT_CAP_EXCEEDED
          - validations[priority=31]
        distinguishing_aspect: "The fiscal cap is compared against the computed total_cents AFTER pricing: an IN_EFFECT contract capped at 46584 refuses an offer that prices to exactly 46585, one cent over, and the cap comparison is therefore strict (a cap of exactly 46585 admits the same offer)."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, corporate partner Acme, public FareFiling YCORN01 ACTIVE, and an IN_EFFECT contract capped at 46584."
          setup_api_calls:
            - *c_ch
            - *c_corp
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-CAP", max_offer_total_cents: 46584, traceability_required: false, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-31T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_cap_id: $.data.id }
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${filing_c_id}", account_code: "ACME-EXACT", max_offer_total_cents: 46585, traceability_required: false, tracking_ref_prefix: "ACME-", min_content_tier_rank: 1, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-31T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_exact_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${filing_c_id}", corporate_contract_id: "${contract_cap_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { cap_error: $.data.error_id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_c_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${filing_c_id}", corporate_contract_id: "${contract_exact_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { at_cap_offer_id: $.data.id }
          assert:
            - "the first call returns HTTP 422 with data.error_id == ERR_CONTRACT_CAP_EXCEEDED"
            - "the second call returns HTTP 201 with Offer.${at_cap_offer_id}.total_cents == 46585, so the cap is inclusive at equality"
            - "GET /offers?corporate_contract_id=${contract_cap_id} returns total_count == 0"

      - name: corner_error_content_tier_insufficient_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CONTENT_TIER_INSUFFICIENT
          - validations[priority=27]
          - entities.Channel.fields.content_tier_rank
        distinguishing_aspect: "Content access is gated by rank comparison: a RESTRICTED channel (rank 1) cannot distribute a filing whose min_content_tier_rank is 3, and the SAME filing on a FULL channel (rank 3) prices normally because the comparison is >= rather than >."
        test_recipe:
          setup:
            - "Channel CORNER_LEGACY (RESTRICTED, rank 1) and channel CORNER_FULL (FULL, rank 3), agency Alpha, and a filing YTIER01 ACTIVE requiring rank 3."
          setup_api_calls:
            - call: "POST /channels"
              payload: { channel_code: "CORNER_LEGACY", channel_kind: "GDS_LEGACY", content_tier: "RESTRICTED" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_legacy_id: $.data.id }
            - call: "POST /channels"
              payload: { channel_code: "CORNER_FULL", channel_kind: "DIRECT", content_tier: "FULL" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_full_id: $.data.id }
            - *c_agy
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YTIER01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 3 }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_tier_id: $.data.id }
            - call: "POST /fare-filings/${filing_tier_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${filing_tier_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_legacy_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_tier_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { tier_error: $.data.error_id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_full_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing_tier_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { tier_ok_offer_id: $.data.id }
          assert:
            - "the first call returns HTTP 422 with data.error_id == ERR_CONTENT_TIER_INSUFFICIENT"
            - "the second call returns HTTP 201 with Offer.${tier_ok_offer_id}.subtotal_cents == 45010 (CORNER_FULL applies no markup)"
            - "GET /offers?channel_id=${channel_legacy_id} returns total_count == 0"

      - name: corner_error_negotiation_round_limit_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NEGOTIATION_ROUND_LIMIT
          - validations[priority=29]
          - calculations.agency_incentive_accrual.constants
        distinguishing_aspect: "MAX_NEGOTIATION_ROUNDS caps the agency's COUNTER moves at 3: the third COUNTER is accepted and leaves negotiation_round at 3, and the fourth is refused with ERR_NEGOTIATION_ROUND_LIMIT even though the airline's intervening PROPOSE calls are unlimited."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, one PROPOSED agreement walked through three full COUNTER / PROPOSE cycles."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_agreement
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.030 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "PROPOSE", proposed_incentive_pct: 0.026 }
              as: DistributionManager
              as_user_id: "dm-001"
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.029 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "PROPOSE", proposed_incentive_pct: 0.027 }
              as: DistributionManager
              as_user_id: "dm-001"
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.028 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "PROPOSE", proposed_incentive_pct: 0.0275 }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.0279 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { round_limit_error: $.data.error_id }
          assert:
            - "before the trigger AgencyAgreement.${agreement_c_id}.negotiation_round == 3 and status == PROPOSED"
            - "the trigger returns HTTP 422 with data.error_id == ERR_NEGOTIATION_ROUND_LIMIT"
            - "AgencyAgreement.${agreement_c_id}.negotiation_round is still 3 and proposed_incentive_pct is still 0.0275"
            - "an ACCEPT by dm-002 still succeeds afterwards, freezing agreed_incentive_pct at 0.0275"

      - excluded_because:
          difficulty_instance: certification_readiness_strict_zeroes_while_provisional_clears_minimum
          rationale: >-
            ERR_READINESS_BELOW_MINIMUM is triggered directly by the §1.8
            Rule 1 instance, which refuses the STRICT CERTIFY decision on a
            certification whose strict score is 0 and then certifies the same
            population under PROVISIONAL.
        name: corner_error_readiness_below_minimum_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_READINESS_BELOW_MINIMUM

      - excluded_because:
          difficulty_instance: connectivity_test_teardown_buffer_gap_of_exactly_fifteen_conflicts
          rationale: >-
            Both ERR_TEST_SLOT_CONFLICT and ERR_TEST_ENV_CAPACITY_EXCEEDED are
            triggered directly by the §1.8 Rule 8 instance, which schedules
            the buffer-adjacent same-test slot and the third overlapping slot
            on the same env_code.
        name: corner_error_connectivity_slot_conflicts_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TEST_SLOT_CONFLICT
          - errors.ERR_TEST_ENV_CAPACITY_EXCEEDED

      - excluded_because:
          difficulty_instance: disclosure_incomplete_outranks_corporate_tracking_ref_missing
          rationale: >-
            ERR_DISCLOSURE_INCOMPLETE and ERR_CORPORATE_TRACKING_REF_MISSING
            are both returned by the §1.8 Rule 5 instance — the first as the
            winning error and the second once the disclosure violation is
            repaired.
        name: corner_error_disclosure_and_missing_ref_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DISCLOSURE_INCOMPLETE
          - errors.ERR_CORPORATE_TRACKING_REF_MISSING

      - excluded_because:
          difficulty_instance: fare_filing_not_active_outranks_contract_cap_exceeded
          rationale: >-
            ERR_FARE_FILING_NOT_ACTIVE is returned by the §1.8 Rule 5
            instance, which constructs an offer against a SUSPENDED filing
            under an over-cap contract.
        name: corner_error_fare_filing_not_active_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FARE_FILING_NOT_ACTIVE

      - excluded_because:
          difficulty_instance: order_creation_requires_agreement_in_signed_state
          rationale: >-
            ERR_AGREEMENT_NOT_SIGNED is returned by the §1.8 Rule 7 instance,
            which orders a published offer while the agency's agreement is
            still PROPOSED.
        name: corner_error_agreement_not_signed_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGREEMENT_NOT_SIGNED

      - excluded_because:
          difficulty_instance: refund_apply_requires_channel_refund_parity_state
          rationale: >-
            ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL is returned by the §1.8
            Rule 7 instance, which applies an APPROVED refund on a channel
            whose servicing_parity_refund is false.
        name: corner_error_servicing_not_supported_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL

      - excluded_because:
          difficulty_instance: fare_sale_window_adjacency_allowed_but_strict_overlap_rejected
          rationale: >-
            ERR_FARE_SALE_WINDOW_OVERLAP is returned by the §1.8 Rule 8
            instance, which activates a second filing whose sale window
            strictly overlaps an ACTIVE filing on the same market.
        name: corner_error_fare_sale_window_overlap_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FARE_SALE_WINDOW_OVERLAP

  # ===========================================================================
  # SECTION 7 — rbac
  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_each_role_performs_its_own_declared_operations
        claim_type: allowed_operations
        grounds:
          - roles.PlatformAdmin
          - roles.PricingAnalyst
          - roles.DistributionManager
          - roles.ComplianceAuditor
          - roles.Agency
          - roles.TechnologyPartner
        distinguishing_aspect: "One walk exercises the exclusive write of every role in turn — admin registers the channel and partner, the analyst files and activates the fare, the manager proposes the agreement, the agency counters and orders, the tech partner schedules a connectivity test, and the auditor reads — and each call is accepted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_tech
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_cert
          trigger:
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.030 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /partner-certifications/${cert_c_id}/connectivity-tests"
              payload: { test_code: "SHOP_SEARCH", is_mandatory: true, scheduled_start: "2026-08-03T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { rbac_test_id: $.data.id }
            - call: "GET /agency-agreements/${agreement_c_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
          assert:
            - "every setup call and every trigger call returns a 2xx status"
            - "AgencyAgreement.${agreement_c_id}.status == COUNTERED with negotiation_round == 1 and proposed_incentive_pct == 0.030"
            - "ConnectivityTest.${rbac_test_id}.status == SCHEDULED and PartnerCertification.${cert_c_id}.reserved_test_minutes == 60"
            - "the ComplianceAuditor read returns HTTP 200, confirming the read-only role can see every aggregate"

      - name: corner_roles_are_denied_the_operations_that_belong_to_other_roles
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - roles.ComplianceAuditor
          - roles.TechnologyPartner
        distinguishing_aspect: "Each write endpoint admits only its declared roles: the PricingAnalyst cannot propose an agreement, the DistributionManager cannot file a fare, the ComplianceAuditor cannot patch a content policy, the Agency cannot register a channel and the TechnologyPartner cannot decide its own certification — all five are 403 with nothing written."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, tech provider Tango with a TESTING certification."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_tech
            - *c_cert
          trigger:
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { denied_analyst_error: $.data.error_id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YDENY01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { denied_manager_error: $.data.error_id }
            - call: "PATCH /channels/${channel_c_id}/content-policy"
              payload: { content_tier: "FULL" }
              as: ComplianceAuditor
              as_user_id: "aud-001"
              captures: { denied_auditor_error: $.data.error_id }
            - call: "POST /channels"
              payload: { channel_code: "AGENCY_MADE", channel_kind: "DIRECT" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { denied_agency_error: $.data.error_id }
            - call: "POST /partner-certifications/${cert_c_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "PROVISIONAL" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { denied_partner_error: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "${denied_analyst_error} == ERR_UNAUTHORIZED — the 403 outranks the OCC and eligibility rungs of that endpoint"
            - "${denied_manager_error} == ERR_UNAUTHORIZED and ${denied_auditor_error} == ERR_UNAUTHORIZED and ${denied_agency_error} == ERR_UNAUTHORIZED"
            - "${denied_partner_error} == ERR_UNAUTHORIZED — a TechnologyPartner may run tests but never award its own certification"
            - "GET /agency-agreements?partner_id=${partner_agy_id} returns total_count == 0 and Channel.${channel_c_id}.content_tier is still STANDARD and version == 1"
            - "PartnerCertification.${cert_c_id}.status is still TESTING"

      - name: corner_agency_cannot_act_on_another_partners_agreement
        claim_type: unauthorized_denial
        grounds:
          - roles.Agency.entity_backed
          - state_machines.AgencyAgreement.transitions[PROPOSED->COUNTERED].preconditions
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The Agency role is entity-backed by DistributionPartner, so authorisation is per-row: agency Beta holds the Agency role yet is refused with ERR_UNAUTHORIZED on Alpha's agreement, while Alpha's own COUNTER on the same agreement is accepted."
        test_recipe:
          setup:
            - "Channel CORNER_NDC with agencies Alpha and Beta registered; one PROPOSED agreement belonging to Alpha."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - call: "POST /distribution-partners"
              payload: { partner_name: "Beta Corner Travel", partner_type: "TRAVEL_AGENCY", iata_code: "55555553", home_country: "FR" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_beta_id: $.data.id }
            - *c_agreement
          trigger:
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.040 }
              as: Agency
              as_user_id: "${partner_beta_id}"
              captures: { foreign_agency_error: $.data.error_id }
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.030 }
              as: Agency
              as_user_id: "${partner_agy_id}"
          assert:
            - "the first call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "after the first call AgencyAgreement.${agreement_c_id}.status is still PROPOSED with negotiation_round == 0 and version == 1"
            - "the second call returns HTTP 200 with status == COUNTERED, negotiation_round == 1 and proposed_incentive_pct == 0.030"

      - name: corner_same_manager_cannot_propose_and_accept_one_agreement
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=14]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "ACCEPT is the only operation guarded by segregation of duties, and the comparison is against the agreement's stored proposed_by_user_id: dm-001 (who proposed) is refused with 422 while dm-002 accepts the identical request."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha, one PROPOSED agreement whose proposed_by_user_id is dm-001."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_agreement
          trigger:
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { sod_error: $.data.error_id }
            - call: "POST /agency-agreements/${agreement_c_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "AgencyAgreement.${agreement_c_id}.proposed_by_user_id == dm-001"
            - "the first call returns HTTP 422 with data.error_id == ERR_SEGREGATION_OF_DUTIES — a 422, not a 403, because both users hold the DistributionManager role"
            - "after the first call the agreement is still PROPOSED with agreed_incentive_pct == null and version == 1"
            - "the second call returns HTTP 200 with status == SIGNED, agreed_incentive_pct == 0.025 and signed_by_user_id == dm-002"

  # ===========================================================================
  # SECTION 8 — cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_stale_partner_version_blocks_the_agreement_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.agreement-create-stale-partner
          - errors.ERR_STALE_PARTNER_VERSION
          - validations[priority=6]
        distinguishing_aspect: "A version observed before the partner entered certification is stale: opening the certification bumps DistributionPartner.version to 2, so POST /agency-agreements carrying expected_partner_version 1 is refused with 412 and the same request re-read at version 2 is accepted."
        test_recipe:
          setup:
            - "Channel CORNER_NDC and agency Alpha at version 1; the client's cached view of Alpha is version 1."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", env_code: "CORNER_ENV" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { cert_agy_id: $.data.id }
          trigger:
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { stale_partner_error: $.data.error_id }
            - call: "GET /distribution-partners/${partner_agy_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { partner_agy_v2: $.data.version }
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v2}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { retried_agreement_id: $.data.id }
          assert:
            - "${stale_partner_error} == ERR_STALE_PARTNER_VERSION with HTTP 412"
            - "the refused call created no AgencyAgreement: at that point GET /agency-agreements?partner_id=${partner_agy_id} returns total_count == 0"
            - "${partner_agy_v2} == 2 and DistributionPartner.${partner_agy_id}.certification_status == IN_CERTIFICATION"
            - "the retry returns HTTP 201 with AgencyAgreement.${retried_agreement_id}.status == PROPOSED"
            - "PartnerCertification.${cert_agy_id}.status == TESTING throughout"

      - name: corner_stale_filing_version_blocks_the_revision_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.filing-revision-stale-base
          - errors.ERR_STALE_FARE_FILING_VERSION
          - state_machines.FareFiling.transitions[ACTIVE->SUPERSEDED]
        distinguishing_aspect: "The second OCC rule guards a different parent entity with a different field name: two state calls advance FareFiling.version from 1 to 3, so a revision quoting expected_fare_filing_version 1 is refused with 412, and the retry at version 3 supersedes the base filing and mints the DRAFT revision."
        test_recipe:
          setup:
            - "FareFiling YCORN01 created at version 1, then FILED and ACTIVE; the client's cached view is version 1."
          setup_api_calls:
            - *c_filing
            - *c_filed
            - *c_active
          trigger:
            - call: "POST /fare-filings/${filing_c_id}/revisions"
              payload: { base_amount_cents: 46010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", expected_fare_filing_version: "${filing_c_v}" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { stale_filing_error: $.data.error_id }
            - call: "GET /fare-filings/${filing_c_id}"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing_c_v3: $.data.version }
            - call: "POST /fare-filings/${filing_c_id}/revisions"
              payload: { base_amount_cents: 46010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", expected_fare_filing_version: "${filing_c_v3}" }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { revision_filing_id: $.data.id }
          assert:
            - "${stale_filing_error} == ERR_STALE_FARE_FILING_VERSION with HTTP 412"
            - "${filing_c_v3} == 3 and after the refused call FareFiling.${filing_c_id}.status is still ACTIVE"
            - "the retry returns HTTP 201; FareFiling.${revision_filing_id}.status == DRAFT, revision_number == 1, base_filing_id == ${filing_c_id} and base_amount_cents == 46010"
            - "the base filing becomes SUPERSEDED at version 4"
            - "GET /fare-filings?base_filing_id=${filing_c_id} returns total_count == 1"

      - name: corner_certification_suspension_and_reinstatement_cascade_both_ways
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PartnerCertification.transitions[CERTIFIED->SUSPENDED].side_effects
          - state_machines.PartnerCertification.transitions[SUSPENDED->CERTIFIED].side_effects
          - state_machines.AgencyAgreement.transitions[SIGNED->SUSPENDED]
        distinguishing_aspect: "SUSPEND drives a three-entity cascade — partner back to IN_CERTIFICATION, SIGNED agreement to SUSPENDED, its PUBLISHED offer to WITHDRAWN — and REINSTATE walks the agreement back to SIGNED with its accrual ledger intact while the withdrawn offer is deliberately NOT resurrected."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha CERTIFIED on that channel with a SIGNED agreement and one PUBLISHED offer."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", env_code: "CORNER_ENV" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { cert_susp_id: $.data.id }
            - call: "POST /partner-certifications/${cert_susp_id}/connectivity-tests"
              payload: { test_code: "SHOP_SEARCH", is_mandatory: true, scheduled_start: "2026-08-03T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_agy_id}"
              captures: { test_susp_id: $.data.id }
            - call: "POST /connectivity-tests/${test_susp_id}/outcome"
              payload: { outcome: "PASSED", score: 90 }
              as: TechnologyPartner
              as_user_id: "${partner_agy_id}"
            - call: "POST /partner-certifications/${cert_susp_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "STRICT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /distribution-partners/${partner_agy_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { partner_agy_v3: $.data.version }
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v3}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { agreement_susp_id: $.data.id }
            - call: "POST /agency-agreements/${agreement_susp_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - *c_filing
            - *c_filed
            - *c_active
            - *c_offer
            - *c_publish
          trigger:
            - call: "POST /partner-certifications/${cert_susp_id}/decision"
              payload: { decision: "SUSPEND" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /partner-certifications/${cert_susp_id}/decision"
              payload: { decision: "REINSTATE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "immediately after SUSPEND: PartnerCertification.${cert_susp_id}.status == SUSPENDED and DistributionPartner.${partner_agy_id}.certification_status == IN_CERTIFICATION"
            - "immediately after SUSPEND: AgencyAgreement.${agreement_susp_id}.status == SUSPENDED and Offer.${offer_c_id}.status == WITHDRAWN"
            - "after REINSTATE: PartnerCertification.${cert_susp_id}.status == CERTIFIED and the partner is CERTIFIED again"
            - "after REINSTATE: AgencyAgreement.${agreement_susp_id}.status == SIGNED with agreed_incentive_pct == 0.025, cumulative_net_revenue_cents == 0 and tier_downgrade_count == 0"
            - "Offer.${offer_c_id}.status is still WITHDRAWN — reinstatement never resurrects a withdrawn offer"
            - "each decision bumps DistributionPartner.${partner_agy_id}.version by exactly 1"

      - name: corner_incentive_accrual_is_clamped_by_the_agreement_cap
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.agency_incentive_accrual.formula
          - entities.AgencyAgreement.fields.incentive_cap_cents
          - state_machines.Order.transitions[AUTHORIZED->PAID].side_effects
        distinguishing_aspect: "The cap is applied to the exact scaled value BEFORE the single rounding step, so an agreement capped at 400 reports exactly 400 where the uncapped computation would have produced 582 — and the tier label, which is derived from revenue rather than from the capped payout, still reads TIER_1."
        test_recipe:
          setup:
            - "Channel CORNER_NDC (incentive_multiplier 1.25), agency Alpha, and a SIGNED agreement whose incentive_cap_cents is 400."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_c_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 400, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { agreement_cap_id: $.data.id }
            - call: "POST /agency-agreements/${agreement_cap_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - *c_offer
            - *c_publish
            - *c_order
          trigger:
            - call: "POST /orders/${order_c_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 46585 }
              as: Agency
              as_user_id: "${partner_agy_id}"
          assert:
            - "AgencyAgreement.${agreement_cap_id}.cumulative_net_revenue_cents == 46585"
            - "AgencyAgreement.${agreement_cap_id}.incentive_accrued_cents == 400, exactly the cap and not 582"
            - "AgencyAgreement.${agreement_cap_id}.incentive_tier == TIER_1 and tier_downgrade_count == 0"
            - "Channel.${channel_c_id}.activity_cost_cents == 452 (12 + 40 + the capped 400) and cost_per_booking_activity_cents == 452"
            - "Channel.${channel_c_id}.cost_per_booking_flat_cents == 400000"

      - excluded_because:
          difficulty_instance: channel_cost_variants_diverge_on_identical_paid_order_population
          rationale: >-
            The dual_variant_calculation layer is asserted by the §1.8 Rule 1
            instance for distribution_cost_per_booking and by its sibling for
            certification_readiness_score; both show the two variants reading
            one input population and reporting figures that cannot be derived
            from each other.
        name: corner_layer_dual_variant_calculation_is_exercised
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
          - calculations.distribution_cost_per_booking.variants

      - excluded_because:
          difficulty_instance: refund_apply_cascades_four_hops_order_channel_agreement_cost
          rationale: >-
            The deepest chain of the cascading_side_effects layer — four hops
            from a single apply call, each one caused by the previous hop's
            write — is asserted by the §1.8 Rule 4 instance; the suspension
            cascade above covers the certification-driven chain instead.
        name: corner_layer_cascading_side_effects_reach_four_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_complexity_layers

      - excluded_because:
          difficulty_instance: incentive_tier_two_entry_is_inclusive_at_tier_one_ceiling
          rationale: >-
            The rate_threshold_triggers layer's boundary behaviour (crossing
            TIER_1_CEILING_CENTS switches the marginal band and the tier label
            at an inclusive boundary) is asserted by the §1.8 Rule 6 instance;
            the cap clamp above covers the other end of the same layer.
        name: corner_layer_rate_threshold_boundary_is_exercised
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
          - calculations.agency_incentive_accrual.constants

  # ===========================================================================
  # SECTION 9 — consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: corner_capture_effects_are_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Order.transitions[AUTHORIZED->PAID].side_effects
        distinguishing_aspect: "consistency_model is immediate: the CAPTURE response body already carries payment_status PAID, and the next requests — issued by a different role with no waiting, retrying or polling — already see booking_count 1, cumulative_net_revenue_cents 46585, incentive_accrued_cents 582 and both recomputed cost figures."
        test_recipe:
          setup:
            - "Channel CORNER_NDC, agency Alpha with a SIGNED agreement, one AUTHORIZED order of 46585."
          setup_api_calls:
            - *c_ch
            - *c_agy
            - *c_filing
            - *c_filed
            - *c_active
            - *c_agreement
            - *c_accept
            - *c_offer
            - *c_publish
            - *c_order
          trigger:
            - *c_capture
            - call: "GET /channels/${channel_c_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
            - call: "GET /agency-agreements/${agreement_c_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
            - call: "GET /orders/${order_c_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-001"
          assert:
            - "the CAPTURE response itself reports payment_status == PAID and paid_amount_cents == 46585"
            - "the immediately following channel read reports booking_count == 1, activity_cost_cents == 634, cost_per_booking_flat_cents == 400000 and cost_per_booking_activity_cents == 634"
            - "the immediately following agreement read reports cumulative_net_revenue_cents == 46585, incentive_accrued_cents == 582 and incentive_tier == TIER_1"
            - "the order read reports the same values as the CAPTURE response, with version == 2"
            - "no retry or delay is required anywhere: the first read after the write is already authoritative"
