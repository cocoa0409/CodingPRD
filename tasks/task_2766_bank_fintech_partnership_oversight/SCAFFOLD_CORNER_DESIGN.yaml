            - "LedgerEntry.${led_res1_id}.sequence_no == 1 and LedgerEntry.${led_res2_id}.sequence_no == 2"
            - "neither LedgerEntry response carries a version field nor an updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE on /oversight/ledger-entries or /oversight/ledger-entries/{id} — the collection is append-only"
            - "CustodyAccount.${res_a_id}.balance_cents == 412500 and CustodyAccount.${res_a_id}.version == 3"
            - "GET /oversight/ledger-entries?custody_account_id=${res_a_id} returns exactly 2 rows ordered by sequence_no ASC"

      - name: diligence_review_create_with_an_unknown_body_partner_id_returns_partner_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.DiligenceReview.fields.partner_id
          - validations.priority_10
          - errors.ERR_PARTNER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts parentage in the request body, so an unknown body partner_id is caught by the priority-10 body-FK sweep with 404 ERR_PARTNER_NOT_FOUND — and it outranks the priority-28 OCC check, so a request that is ALSO carrying a nonsense expected_partner_version still reports the not-found error, never ERR_STALE_PARTNER_VERSION."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A registered, but the request cites a different, unallocated partner id."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "00000000-0000-4000-8000-0000000000ff", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 90, complaint_history_score: 85, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_fk: $.data.error_id }
          assert:
            - "the response status is 404 and err_fk == ERR_PARTNER_NOT_FOUND"
            - "err_fk != ERR_STALE_PARTNER_VERSION"
            - "GET /oversight/diligence-reviews returns 0 rows"
            - "Partner.${pa_id}.version is still 1 — the rejected create bumped nothing"

      - name: partner_create_with_a_self_referential_parent_chain_cycle_returns_group_cycle
        claim_type: Parent Relationships
        grounds:
          - entities.Partner.fields.parent_partner_id
          - validations.priority_20
          - errors.ERR_PARTNER_GROUP_CYCLE
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "parent_partner_id is a self-reference, so priority 20 walks the supplied parent's chain upward: naming a parent whose own ancestry already reaches the partner being created is 422 ERR_PARTNER_GROUP_CYCLE, distinct from the 404 ERR_PARTNER_NOT_FOUND an unknown parent would raise."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A is a group root; Partner B has parent_partner_id A."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Lending LLC", business_model: "LENDING", funding_stage: "SERIES_A", months_runway: 18, disclosed_complaints_per_10k: 30.00, end_user_account_count: 5000, parent_partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pb_cyc_id: $.data.id }
          trigger:
            - call: "POST /oversight/partners"
              payload: { legal_name: "Northbeam Holdings Inc", business_model: "CARD_ISSUING", funding_stage: "PUBLIC", months_runway: 60, disclosed_complaints_per_10k: 1.00, end_user_account_count: 0, parent_partner_id: "00000000-0000-4000-8000-0000000000fe" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_parent_missing: $.data.error_id }
          assert:
            - "the response status is 404 and err_parent_missing == ERR_PARTNER_NOT_FOUND — priority 10 runs before priority 20"
            - "err_parent_missing != ERR_PARTNER_GROUP_CYCLE"
            - "GET /oversight/partners?parent_partner_id=${pa_id} still returns exactly 1 row, Partner.${pb_cyc_id}"
            - "GET /oversight/partners returns exactly 2 rows with total_count == 2"

  - section: state_machines
    instances:

      - name: every_state_machine_starts_at_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Partner.initial_state
          - state_machines.DiligenceReview.initial_state
          - state_machines.ProgramAgreement.initial_state
          - state_machines.MarketingReview.initial_state
          - state_machines.Complaint.initial_state
          - state_machines.TransactionMonitoringAlert.initial_state
          - state_machines.OversightCycle.initial_state
          - state_machines.WindDownPlan.initial_state
        distinguishing_aspect: "Six of the eight machines start at a name that is NOT 'DRAFT': Partner starts PROSPECT, MarketingReview starts already at SUBMITTED (there is no marketing DRAFT state and no marketing submit endpoint), Complaint starts RECEIVED, TransactionMonitoringAlert starts OPEN in the disposition dimension, OversightCycle starts OPEN. Only DiligenceReview, ProgramAgreement and WindDownPlan start DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Only creates, no transitions."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "CFPB_PORTAL", category: "UNAUTHORIZED_TRANSACTION", severity: "HIGH", received_at: "2026-08-01T00:00:00Z", narrative: "Cardholder reports three unauthorized debits totalling 240.00 USD.", is_reg_e_dispute: true }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_init_id: $.data.id, cmp_init_status: $.data.status }
            - call: "POST /oversight/alerts"
              payload: { partner_id: "${pa_id}", alert_type: "SANCTIONS_HIT", triggered_at: "2026-08-01T00:00:00Z", transaction_volume_cents: 250000, detection_note: "Beneficiary name matched an OFAC SDN entry at 92 percent confidence." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { alr_init_id: $.data.id, alr_init_disp: $.data.disposition }
          assert:
            - "Partner.${pa_id}.status == PROSPECT and Partner.${pa_id}.oversight_posture == OPEN and Partner.${pa_id}.capability_tier == UNRATED and Partner.${pa_id}.version == 1 at creation"
            - "DiligenceReview.${dr_a_id}.status == DRAFT and revision_round == 0 and composite_score == 0.0 and tier == UNRATED"
            - "cmp_init_status == RECEIVED"
            - "alr_init_disp == OPEN"
            - "OversightCycle.${cyc_aug_id}.status == OPEN"

      - name: diligence_submit_advances_the_review_and_cascades_the_partner_into_in_diligence
        claim_type: Valid Transition
        grounds:
          - state_machines.DiligenceReview.transitions.DRAFT_to_SUBMITTED
          - state_machines.Partner.transitions.PROSPECT_to_IN_DILIGENCE
          - endpoints.POST_/oversight/diligence-reviews/{id}/submit
        distinguishing_aspect: "The Partner has no status endpoint of its own: PROSPECT -> IN_DILIGENCE happens only as a side effect of the review's DRAFT -> SUBMITTED edge, and the same call also stamps submitted_by_user_id and sets revision_round from 0 to 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A PROSPECT with one DRAFT review."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Initial underwrite package complete." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_sub_status: $.data.status, dr_sub_round: $.data.revision_round, dr_sub_by: $.data.submitted_by_user_id }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_after_submit_status: $.data.status, pa_after_submit_v: $.data.version }
          assert:
            - "dr_sub_status == SUBMITTED and dr_sub_round == 1 and dr_sub_by == po-alice"
            - "pa_after_submit_status == IN_DILIGENCE"
            - "pa_after_submit_v == 3 — version 1 at create, 2 from the diligence-review create side effect, 3 from this submit"
            - "Partner.${pa_id}.capability_tier is still UNRATED — tier is written only by the PASSED decision"

      - name: go_live_with_a_nonzero_reserve_shortfall_returns_program_not_ready_for_launch
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Partner.transitions.CONTRACTED_to_LIVE.preconditions
          - errors.ERR_PROGRAM_NOT_READY_FOR_LAUNCH
          - calculations.required_reserve_cents
        distinguishing_aspect: "Immediately after EXECUTE the reserve balance is 0 while required_reserve_cents is the 250000 floor, so reserve_shortfall_cents is 250000 and go-live is refused — the CONTRACTED -> LIVE gate reads CustodyAccount and derived Partner fields, not any client input, so no payload can bypass it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A CONTRACTED, both custody accounts ACTIVE at balance 0, reserve un-funded."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
          trigger:
            - call: "POST /oversight/partners/${pa_id}/go-live"
              payload: { attestation_note: "Launch readiness attested." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_launch: $.data.error_id }
          assert:
            - "the response status is 409 and err_launch == ERR_PROGRAM_NOT_READY_FOR_LAUNCH"
            - "Partner.${pa_id}.status is still CONTRACTED"
            - "Partner.${pa_id}.required_reserve_cents == 250000 and reserve_shortfall_cents == 250000 and oversight_posture == HEIGHTENED"
            - "after POST /oversight/ledger-entries RESERVE_FUND 312500 the same go-live call returns 200 with status == LIVE"

      - name: deciding_a_draft_review_and_submitting_a_passed_review_both_return_their_own_wrong_state_error
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DiligenceReview.transitions
          - errors.ERR_REVIEW_NOT_SUBMITTED
          - errors.ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED
        distinguishing_aspect: "The two diligence action endpoints have disjoint legal source-state sets, and each reports its own error: decide from DRAFT is ERR_REVIEW_NOT_SUBMITTED while submit from PASSED is ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED — the pair is not collapsed into one generic wrong-state code."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One DRAFT review, then a second review driven to PASSED."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Attempting to decide a review that was never submitted." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_not_submitted: $.data.error_id }
            - *q_dr_a_submit
            - *q_dr_a_pass
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Attempting to resubmit a terminal review." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_not_draft: $.data.error_id }
          assert:
            - "the first trigger returns 409 with err_not_submitted == ERR_REVIEW_NOT_SUBMITTED"
            - "the last trigger returns 409 with err_not_draft == ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED"
            - "DiligenceReview.${dr_a_id}.status == PASSED and revision_round == 1 — neither rejected call mutated the row"
            - "Partner.${pa_id}.status == DILIGENCE_PASSED"

      - name: a_diligence_failed_partner_is_terminal_and_refuses_every_downstream_create
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Partner.terminal_states
          - state_machines.Partner.transitions.IN_DILIGENCE_to_DILIGENCE_FAILED.note
          - errors.ERR_PARTNER_TERMINAL
        distinguishing_aspect: "DILIGENCE_FAILED is a Partner terminal state that locks four different child collections at once — DiligenceReview, ProgramAgreement, Complaint and LedgerEntry all return ERR_PARTNER_TERMINAL — and the FAILED decision still writes latest_composite_score while forcing capability_tier back to UNRATED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A driven to DILIGENCE_FAILED by a FAILED decision."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "FAILED", decision_note: "Board declined the program on concentration grounds." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { dr_failed_status: $.data.status }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_failed_status: $.data.status, pa_failed_tier: $.data.capability_tier, pa_failed_score: $.data.latest_composite_score, pa_failed_v: $.data.version }
          trigger:
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "RENEWAL", business_model_score: 90, funding_score: 90, compliance_capability_score: 90, complaint_history_score: 90, expected_partner_version: "${pa_failed_v}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_term_review: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Consumer disputes a 5.00 USD monthly maintenance fee.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { err_term_complaint: $.data.error_id }
          assert:
            - "dr_failed_status == FAILED and pa_failed_status == DILIGENCE_FAILED"
            - "pa_failed_tier == UNRATED and pa_failed_score == 84.5"
            - "both triggers return 409 with error_id == ERR_PARTNER_TERMINAL"
            - "err_term_review == ERR_PARTNER_TERMINAL and err_term_complaint == ERR_PARTNER_TERMINAL"

      - name: submitting_the_same_diligence_review_twice_fails_on_the_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.DiligenceReview.transitions.DRAFT_to_SUBMITTED.preconditions
          - errors.ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED
          - state_machines.Partner.transitions.PROSPECT_to_IN_DILIGENCE
        distinguishing_aspect: "Action endpoints are not idempotent: the second submit is rejected outright rather than silently re-applied, which also proves the Partner version was bumped exactly once — a replay-tolerant implementation would push Partner.version to 4."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A with one review already SUBMITTED."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Duplicate submit from a retried client." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { err_dup_submit: $.data.error_id }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_dup_v: $.data.version }
          assert:
            - "the response status is 409 and err_dup_submit == ERR_REVIEW_NOT_DRAFT_OR_INFO_REQUESTED"
            - "pa_dup_v == 3, not 4"
            - "DiligenceReview.${dr_a_id}.revision_round == 1, not 2"

      - name: agreement_execute_creates_both_custody_accounts_and_runs_the_reserve_posture_chain
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ProgramAgreement.transitions.PENDING_RISK_APPROVAL_to_EXECUTED.side_effects
          - state_machines.Partner.transitions.DILIGENCE_PASSED_to_CONTRACTED.side_effects
          - endpoints.GET_/oversight/custody-accounts
        distinguishing_aspect: "One call must apply five side effects in order: stamp executed_at/decided_by_user_id, create BOTH CustodyAccount rows at balance 0, advance the Partner to CONTRACTED, then run required_reserve_cents and partner_oversight_posture — and because the accounts are created inside this same request the freshly computed required_reserve_cents is 250000 (the absolute floor) rather than 0, which is what a partner with no agreement would show."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A DILIGENCE_PASSED with a PENDING_RISK_APPROVAL agreement."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
          trigger:
            - call: "POST /oversight/agreements/${agr_a_id}/risk-decision"
              payload: { decision: "EXECUTE", decision_note: "Approved with standard caps." }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { agr_exec_status: $.data.status, agr_exec_at: $.data.executed_at, agr_exec_by: $.data.decided_by_user_id }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cust_total: $.total_count }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_contracted_status: $.data.status, pa_req: $.data.required_reserve_cents, pa_short: $.data.reserve_shortfall_cents, pa_posture: $.data.oversight_posture }
          assert:
            - "agr_exec_status == EXECUTED, agr_exec_at == 2026-08-01T00:00:00Z, agr_exec_by == rc-dana"
            - "cust_total == 2 — exactly one FBO_END_USER and one RESERVE row, both status ACTIVE with balance_cents == 0 and version == 1"
            - "pa_contracted_status == CONTRACTED"
            - "pa_req == 250000 — base = max(floor(0*500/10000), floor(0*150/10000), 250000) and the OPEN multiplier is 1.00"
            - "pa_short == 250000 and pa_posture == HEIGHTENED"

      - name: risk_reject_returns_the_agreement_to_draft_without_any_execute_side_effect
        claim_type: Cyclic
        grounds:
          - state_machines.ProgramAgreement.transitions.PENDING_RISK_APPROVAL_to_DRAFT
          - complexity_profile.state_machine_shape
          - endpoints.POST_/oversight/agreements/{id}/risk-decision
        distinguishing_aspect: "REJECT and EXECUTE share one endpoint but have disjoint side-effect sets: REJECT bumps revision_round 1 -> 2, leaves Partner.status at DILIGENCE_PASSED, creates NO custody accounts and leaves executed_at null — and the agreement can then be resubmitted and executed, proving the DRAFT loop is re-enterable rather than a dead end."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A DILIGENCE_PASSED with a PENDING_RISK_APPROVAL agreement."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
          trigger:
            - call: "POST /oversight/agreements/${agr_a_id}/risk-decision"
              payload: { decision: "REJECT", decision_note: "Reserve requirement too thin for this business model." }
              as: RiskCommittee
              as_user_id: "rc-dana"
              captures: { agr_rej_status: $.data.status, agr_rej_round: $.data.revision_round, agr_rej_exec: $.data.executed_at }
            - call: "GET /oversight/custody-accounts"
              payload: { partner_id: "${pa_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cust_total_rej: $.total_count }
            - *q_agr_a_submit
            - *q_agr_a_execute
            - call: "GET /oversight/agreements/${agr_a_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { agr_final_status: $.data.status, agr_final_round: $.data.revision_round }
          assert:
