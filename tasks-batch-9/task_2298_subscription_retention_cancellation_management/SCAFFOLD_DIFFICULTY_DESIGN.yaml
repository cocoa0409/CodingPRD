  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_windows_reject_overlap_but_allow_adjacency
        grounds:
          - validations[priority=29]
          - errors[ERR_PAUSE_WINDOW_OVERLAP]
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.SubscriptionModification.fields.pause_start_at
          - entities.SubscriptionModification.fields.pause_end_at
        distinguishing_aspect: |
          Pause windows on one Subscription are half-open [start, end): a second window starting
          2026-02-01 inside the applied [2026-01-10, 2026-02-07) window is rejected with
          ERR_PAUSE_WINDOW_OVERLAP, while a window starting exactly at 2026-02-07 — the excluded
          upper bound — is accepted and settles as SCHEDULED.
        test_recipe:
          setup:
            - "CORE exists with max_pause_cycles 3 and 4-week cadence, so one cycle is 28 days."
            - "Subscriber P subscribed to CORE on 2026-01-10 and an APPLIED PAUSE covers [2026-01-10, 2026-02-07), leaving lifecycle_state PAUSED and pause_cycles_used 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { core_p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "p@dtc.test", acquisition_channel: "REFERRAL" }
              as: PlatformAdmin
              captures: { sub_p_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_p_id}", card_last4: "1515", exp_month: 11, exp_year: 2033, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_p_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_p_id}", plan_id: "${core_p_id}", payment_method_id: "${pm_p_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_p_id: $.data.id, v_p0: $.data.version }
            - call: "POST /subscriptions/${s_p_id}/modifications"
              payload: { mod_type: "PAUSE", expected_subscription_version: "${v_p0}", pause_start_at: "2026-01-10T00:00:00Z", pause_end_at: "2026-02-07T00:00:00Z", effective_at: "2026-01-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_p_id}"
              captures: { mod_p1_id: $.data.id }
            - call: "GET /subscriptions/${s_p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_p1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_p_id}/modifications"
              payload: { mod_type: "PAUSE", expected_subscription_version: "${v_p1}", pause_start_at: "2026-02-01T00:00:00Z", pause_end_at: "2026-02-28T00:00:00Z", effective_at: "2026-02-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_p_id}"
            - call: "POST /subscriptions/${s_p_id}/modifications"
              payload: { mod_type: "PAUSE", expected_subscription_version: "${v_p1}", pause_start_at: "2026-02-07T00:00:00Z", pause_end_at: "2026-03-07T00:00:00Z", effective_at: "2026-02-07T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_p_id}"
              captures: { mod_p2_id: $.data.id }
          assert:
            - "SubscriptionModification.${mod_p1_id}.state == APPLIED"
            - "The overlapping request returns 409 with error_id ERR_PAUSE_WINDOW_OVERLAP"
            - "The adjacent request returns 201 and SubscriptionModification.${mod_p2_id}.state == SCHEDULED"
            - "SubscriptionModification.${mod_p2_id}.pause_start_at == 2026-02-07T00:00:00Z"
            - "SubscriptionModification.${mod_p2_id}.delta_price_cents == 0"
            - "Subscription.${s_p_id}.lifecycle_state == PAUSED"
            - "Subscription.${s_p_id}.paused_until == 2026-02-07T00:00:00Z"
            - "Subscription.${s_p_id}.pause_cycles_used == 1"
            - "The rejected overlapping request left Subscription.${s_p_id}.version unchanged, so the adjacent request could reuse ${v_p1}"

