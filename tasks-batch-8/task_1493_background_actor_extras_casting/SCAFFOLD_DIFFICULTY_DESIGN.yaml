            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
          trigger:
            - { call: "POST /central-casting/bookings/${bk}/accept", payload: {}, as: BackgroundActor, as_user_id: "${act}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CALL_NOT_ACCEPTING (booking OFFERED but parent call LOCKED; cross-entity gate fires)"
            - "Booking.${bk}.status remains OFFERED"
