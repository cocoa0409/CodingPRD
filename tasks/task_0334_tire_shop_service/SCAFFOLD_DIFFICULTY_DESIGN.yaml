              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-C", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/authorize-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /appointments"
              payload: { work_order_id: "${wo_id}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-04T09:00:00.000Z", scheduled_end: "2026-07-04T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Technician
            - call: "POST /work-orders/${wo_id}/start-service"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Technician
          assert:
            - "WorkOrder.${wo_id}.fulfillment_status == COMPLETED"
            - "WorkOrder.${wo_id}.payment_status == PAID"
            - "InstallAppointment.${appt_id}.status == COMPLETED"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fitment_referential_beats_stock_constraint_on_approve
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - state_machines.WorkOrder.DRAFT_to_APPROVED
        distinguishing_aspect: |
          Pair business_referential (P8 ERR_FITMENT_NOT_APPROVED) vs business_constraint
          (P13 ERR_INSUFFICIENT_STOCK). An approve where the TIRE line both lacks an approved
          FitmentRule AND lacks stock returns ERR_FITMENT_NOT_APPROVED (P8 < P13), not the stock error.
        test_recipe:
          setup:
            - "DRAFT WorkOrder with a TIRE line whose tire model has stock 0 AND no approved FitmentRule for the vehicle (a NOT_RECOMMENDED rule exists)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "C Nine", phone: "555-0009" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "VW", model: "GOLF", model_year: 2020, oe_tire_size: "225/45R17", rim_diameter_in: 17, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "HANKOOK", model_name: "VENTUS", size_token: "225/45R17", load_index: 94, speed_rating: "W", unit_price_cents: 11000, mileage_warranty_miles: 45000, original_tread_32nds: 9, stock_qty: 0 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "NOT_RECOMMENDED" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_FITMENT_NOT_APPROVED"

      - name: bay_state_beats_temporal_overlap_on_appointment
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - state_machines.ServiceBay.OPEN_to_OUT_OF_SERVICE
        distinguishing_aspect: |
          Pair state (P10 ERR_BAY_OUT_OF_SERVICE) vs business_temporal (P12 ERR_BAY_TIME_CONFLICT).
          When booking into an OUT_OF_SERVICE bay whose interval also overlaps a prior appointment,
          the state error wins (P10 < P12): ERR_BAY_OUT_OF_SERVICE, not ERR_BAY_TIME_CONFLICT.
        test_recipe:
          setup:
            - "A bay with a SCHEDULED appointment occupying 09:00-10:00; the bay is then closed (OUT_OF_SERVICE) after that appointment's order is cancelled to satisfy the close precondition; a new order ready to book the same overlapping slot."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c10@x.com", full_name: "C Ten", phone: "555-0010" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TESLA", model: "M3", model_year: 2023, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "MXM4", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 16000, mileage_warranty_miles: 45000, original_tread_32nds: 10, stock_qty: 12 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-D", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            # first order + appointment occupying 09:00-10:00
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo1: $.data.id, wo1_v0: $.data.version }
            - call: "POST /work-orders/${wo1}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo1_v0}" }
              as: ServiceAdvisor
              captures: { wo1_v1: $.data.version }
            - call: "POST /work-orders/${wo1}/approve"
              payload: { expected_work_order_version: "${wo1_v1}" }
              as: ServiceAdvisor
              captures: { wo1_v2: $.data.version }
            - call: "POST /appointments"
              payload: { work_order_id: "${wo1}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-05T09:00:00.000Z", scheduled_end: "2026-07-05T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { appt1: $.data.id, bay_v1: $.data.version }
            # cancel that order so its appointment cancels, freeing the bay so close precondition holds
            - call: "POST /work-orders/${wo1}/cancel"
              payload: { expected_work_order_version: "${wo1_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-bays/${bay_id}/close"
              payload: { expected_service_bay_version: "${bay_v1}" }
              as: InventoryManager
              captures: { bay_v2: $.data.version }
            # second order ready to book overlapping slot into a now-closed bay
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo2: $.data.id, wo2_v0: $.data.version }
            - call: "POST /work-orders/${wo2}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo2_v0}" }
              as: ServiceAdvisor
              captures: { wo2_v1: $.data.version }
            - call: "POST /work-orders/${wo2}/approve"
              payload: { expected_work_order_version: "${wo2_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /appointments"
              payload: { work_order_id: "${wo2}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-05T09:30:00.000Z", scheduled_end: "2026-07-05T10:30:00.000Z", expected_service_bay_version: "${bay_v2}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BAY_OUT_OF_SERVICE"

  # =====================================================================
