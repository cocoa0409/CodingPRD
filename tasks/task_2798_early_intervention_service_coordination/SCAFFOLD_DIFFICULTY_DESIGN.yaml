  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_visit_document
        grounds:
          - validations[priority 24 -> ERR_VISIT_NOT_SCHEDULED]
          - validations[priority 60 -> ERR_ACTUAL_UNITS_EXCEED_SCHEDULED]
          - endpoints[POST /ei/service-visits/{visitId}/document]
        distinguishing_aspect: |
          This pair puts a STATE check (priority 24) against a FISCAL check (priority 60) on the same
          endpoint, and the two are separated by 36 priority steps and two different HTTP statuses
          (409 vs 422). The same request body is submitted twice against two different rows: on the
          already-DELIVERED visit only ERR_VISIT_NOT_SCHEDULED may come back, and on a fresh SCHEDULED
          visit the identical body must produce ERR_ACTUAL_UNITS_EXCEED_SCHEDULED - so the test
          cannot pass by hard-coding either error. The other priority_pair instance pairs a
          business_safety rule against a business_constraint rule on a create endpoint.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES case with an ACTIVE plan carrying one HOME SPEECH_THERAPY line and an ACTIVE 24-unit authorization over 2026-03-21..2026-04-30."
            - "Visit 1 is a 30-minute HOME session (scheduled_units 2) on 2026-03-23 that has ALREADY been documented as DELIVERED for 2 units."
            - "Visit 2 is a 30-minute HOME session (scheduled_units 2) on 2026-03-24 that is still SCHEDULED."
            - "Logical clock at 2026-03-24T12:00:00Z, so both visits are past their scheduled_start and priority 57 is satisfied."
            - "actual_units 5 exceeds each visit's scheduled_units of 2 but stays under the authorization's 22 remaining units, so priority 59 is never reached."
