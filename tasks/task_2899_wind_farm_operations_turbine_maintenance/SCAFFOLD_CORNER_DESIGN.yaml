scaffold_corner_design:
  - section: entities
    instances:
      - name: turbine_creation_returns_every_declared_field_with_its_system_defaults_at_201
        claim_type: creation
        grounds:
          - endpoints.POST_/wind-ops/farms/{id}/turbines
          - entities.Turbine
          - calculations.scheduled_service_due
        distinguishing_aspect: |
          A turbine created with only the five required inputs must come back at 201 carrying all
          eighteen system and computed fields at their declared openings - both state dimensions
          at ONLINE / UNCONSTRAINED, every telemetry counter at 0, service_due_operating_hours
          derived from the model's 4000 hour interval, and effective_power_limit_kw already at the
          model's nameplate rating rather than null.
        test_recipe:
          setup:
            - "one farm and one turbine model with service_interval_hours 4000 and rated_power_kw 4200"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-07", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          assert:
            - "the response is HTTP 201 with response_type object and data carrying id, created_at, updated_at and version 1"
            - "Turbine.${t_id}.wind_farm_id == ${farm_id} taken from the path segment and turbine_model_id == ${model_id} from the body"
            - "availability_state == ONLINE and curtailment_state == UNCONSTRAINED, the two independent dimensions at their initial states"
            - "operating_hours == 0, last_service_operating_hours == 0, service_due_operating_hours == 4000, service_due_flag == false and service_interval_breached == false"
            - "active_fault_code == null, remote_reset_count_24h == 0 and reset_window_start_utc == null"
            - "active_curtailment_count == 0 and effective_power_limit_kw == 4200, the model's rated_power_kw and NOT null"
            - "period_actual_energy_kwh == 0, period_potential_energy_kwh == 0, counted_downtime_hours_period == 0 and cumulative_lost_energy_kwh == 0"
            - "WindFarm.${farm_id}.turbine_count == 1 and installed_capacity_kw == 4200 immediately, so the parent's computed fields are refreshed in the same request"
      - name: farm_and_turbine_reads_return_exactly_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_/wind-ops/farms/{id}
          - endpoints.GET_/wind-ops/turbines/{id}
          - response_envelope.success
        distinguishing_aspect: |
          A GET must return the persisted row unchanged and wrapped in the success envelope, with
          meta.api_request_id and meta.api_request_timestamp present and response_type object -
          not a bare entity body.
        test_recipe:
          setup:
            - "one farm with non-default levy percentages and one turbine on it"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 3.25, community_levy_pct: 0.75, landowner_budget_cap_cents: 250000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-07", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "GET /wind-ops/turbines/${t_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
          assert:
            - "the farm read is HTTP 200 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "WindFarm.${farm_id}.road_levy_pct == 3.25 and community_levy_pct == 0.75, the supplied values and not the 2.5 / 1.5 defaults"
            - "WindFarm.${farm_id}.landowner_budget_cap_cents == 250000000, turbine_count == 1 and installed_capacity_kw == 4200"
            - "the turbine read is HTTP 200 and Turbine.${t_id}.asset_tag == T-07 with expected_kwh_per_hour == 2000 and version == 1"
      - name: turbine_listing_defaults_to_ten_rows_then_honours_limit_offset_and_state_filters
        claim_type: listing
        grounds:
          - endpoints.GET_/wind-ops/turbines
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint must report total_count over the FILTERED set and has_more relative to
          offset plus limit, not relative to the page size alone: three turbines with limit 2 give
          has_more true on the first page and false on the second, and a curtailment_state filter
          that matches nothing returns an empty array with total_count 0 and has_more false rather
          than a 404.
        test_recipe:
          setup:
            - "one farm carrying exactly three ONLINE, UNCONSTRAINED turbines"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-03", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /wind-ops/turbines"
              payload: { wind_farm_id: "${farm_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/turbines"
              payload: { wind_farm_id: "${farm_id}", limit: 2, offset: 0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/turbines"
              payload: { wind_farm_id: "${farm_id}", limit: 2, offset: 2 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/turbines"
              payload: { wind_farm_id: "${farm_id}", curtailment_state: "FORCED_STOP" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "the unpaged list is HTTP 200 with response_type array, 3 rows, total_count == 3 and has_more == false, since the default limit of 10 already covers the set"
            - "limit 2 offset 0 returns 2 rows with total_count == 3 and has_more == true"
            - "limit 2 offset 2 returns 1 row with total_count == 3 and has_more == false"
            - "the curtailment_state FORCED_STOP filter returns HTTP 200 with 0 rows, total_count == 0 and has_more == false, not a 404"
      - name: turbine_get_with_an_unknown_uuid_returns_turbine_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/wind-ops/turbines/{id}
          - validations[priority=32]
          - errors[ERR_TURBINE_NOT_FOUND]
        distinguishing_aspect: |
          The /turbines/{id} path segment has its own error code, so an unknown turbine must NOT
          fall back to the generic ERR_PATH_RESOURCE_NOT_FOUND.
        test_recipe:
          setup:
            - "an empty database except for the logical clock"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /wind-ops/turbines/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response is HTTP 404 with response_type error and ${err_id} == ERR_TURBINE_NOT_FOUND"
            - "${err_msg} is a non-empty human-readable string and the envelope carries no data fields beyond error_id and message"
      - name: crew_create_missing_required_certifications_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/wind-ops/crews
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          certifications has source input with no default, so omitting it is a 400 and not an
          implicit empty list that would later fail the certification check with a different code.
        test_recipe:
          setup:
            - "one farm to own the crew"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/crews"
              payload: { wind_farm_id: "${farm_id}", crew_code: "C-DELTA", technician_count: 3, max_work_wind_speed_ms: 14.0, daily_hours_capacity: 24, hourly_rate_cents: 90000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 400 with ${err_id} == ERR_INVALID_REQUEST"
            - "GET /wind-ops/crews filtered by wind_farm_id ${farm_id} returns total_count 0, so the refused create persisted nothing"
      - name: farm_levies_and_turbine_hour_counters_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.WindFarm.fields.road_levy_pct
          - entities.WindFarm.fields.community_levy_pct
          - entities.Turbine.fields.operating_hours
          - entities.Turbine.fields.last_service_operating_hours
          - entities.Crew.fields.status
        distinguishing_aspect: |
          Three different defaults on three entities: the farm's two optional levy percentages fall
          back to 2.5 and 1.5, the turbine's two optional opening hour readings fall back to 0, and
          the crew's optional status falls back to AVAILABLE - and the turbine's derived
          service_due_operating_hours is computed from the defaulted reading, not skipped.
        test_recipe:
          setup:
            - "one turbine model with service_interval_hours 4000"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/crews"
              payload: { wind_farm_id: "${farm_id}", crew_code: "C-DELTA", technician_count: 3, certifications: ["GWO_BASIC"], max_work_wind_speed_ms: 14.0, daily_hours_capacity: 24, hourly_rate_cents: 90000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
          assert:
            - "WindFarm.${farm_id}.road_levy_pct == 2.5 and community_levy_pct == 1.5 from the declared defaults"
            - "Turbine.${t_id}.operating_hours == 0 and last_service_operating_hours == 0"
            - "Turbine.${t_id}.service_due_operating_hours == 4000, derived from the defaulted 0 reading plus the model interval"
            - "Crew.${crew_id}.status == AVAILABLE"
      - name: farm_turbine_count_and_installed_capacity_are_computed_from_the_live_turbine_set
        claim_type: computed_fields
        grounds:
          - entities.WindFarm.fields.turbine_count
          - entities.WindFarm.fields.installed_capacity_kw
          - endpoints.POST_/wind-ops/turbines/{id}/decommission
        distinguishing_aspect: |
          Both farm rollups exclude DECOMMISSIONED turbines and are re-derived on the decommission
          write, so the pair moves from 2 / 7000 to 1 / 4200 with no separate refresh call - and the
          capacity figure comes from the two DIFFERENT models' rated_power_kw, not from a count
          times one rating.
        test_recipe:
          setup:
            - "one farm with two turbines on two models rated 4200 kW and 2800 kW"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_a_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V112-2.8", rated_power_kw: 2800, hub_height_m: 94, rotor_diameter_m: 112, service_interval_hours: 3500, service_interval_tolerance_hours: 200, gearbox_lead_time_days: 180, blade_lead_time_days: 130, generator_lead_time_days: 110 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_b_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_a_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_b_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 1400 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t2_id}/decommission"
              payload: { decommission_reason: "gearbox beyond economic repair" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: SiteAdmin
              as_user_id: "admin-1"
          assert:
            - "before the decommission WindFarm.${farm_id}.turbine_count == 2 and installed_capacity_kw == 7000, the sum of 4200 and 2800"
            - "Turbine.${t2_id}.availability_state == DECOMMISSIONED after the write"
            - "after the decommission turbine_count == 1 and installed_capacity_kw == 4200, so both rollups exclude the decommissioned row"
            - "Turbine.${t1_id} is untouched with availability_state ONLINE"
      - name: farm_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.WindFarm
          - endpoints.POST_/wind-ops/farms
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted; a create that supplies all four
          plus a system ledger field must ignore every one of them, mint a fresh unprefixed UUID and
          open version at 1 with the ledger at 0.
        test_recipe:
          setup:
            - "an empty database except for the logical clock"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", landowner_budget_cap_cents: 500000000, id: "99999999-8888-7777-6666-555555555555", created_at: "2000-01-01T00:00:00.000Z", version: 47, opex_accrued_cents: 123456 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
          assert:
            - "the response is HTTP 201 and ${farm_id} != 99999999-8888-7777-6666-555555555555"
            - "${farm_id} is a bare UUID with no type prefix such as farm_"
            - "WindFarm.${farm_id}.version == 1 and created_at is the server's ISO-8601 instant with three fractional digits, not 2000-01-01T00:00:00.000Z"
            - "WindFarm.${farm_id}.opex_accrued_cents == 0 and every other ledger bucket is 0, so the supplied system value was discarded"
      - name: weather_window_create_rejects_a_non_strict_interval_and_an_undeclared_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=30]
          - endpoints.POST_/wind-ops/weather-windows
          - endpoints.POST_/wind-ops/turbines/{id}/curtailment-orders
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Interval strictness and enum membership are both priority-30 shape rules, so they fire
          BEFORE any business rule: an equal-bound window is refused even though nothing overlaps
          it, and an undeclared curtailment reason is refused before the turbine version is even
          compared, leaving Turbine.version untouched.
        test_recipe:
          setup:
            - "one farm and one ONLINE turbine, with no weather windows and no curtailment orders yet"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "GET /wind-ops/turbines/${t_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t_v1: $.data.version }
          trigger:
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-08-10T06:00:00Z", end_utc: "2026-08-10T06:00:00Z", forecast_wind_speed_ms: 8.0, forecast_gust_ms: 11.0, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_interval: $.data.error_id }
            - call: "POST /wind-ops/turbines/${t_id}/curtailment-orders"
              payload: { reason: "MAINTENANCE", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-01T06:00:00Z", power_limit_kw: 1500, deemed_kwh_per_hour: 500, expected_turbine_version: "${t_v1}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_enum: $.data.error_id }
          assert:
            - "the equal-bound window returns HTTP 400 with ${err_interval} == ERR_INVALID_REQUEST, because end_utc must be strictly after start_utc"
            - "the MAINTENANCE reason returns HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST; only GRID, NOISE, ICING and WILDLIFE are declared"
            - "Turbine.${t_id}.version is still ${t_v1} after the enum refusal, so shape validation ran before the OCC comparison and before any write"
            - "GET /wind-ops/weather-windows for the farm returns total_count 0 and GET /wind-ops/curtailment-orders filtered by turbine_id returns total_count 0"
      - name: turbine_create_under_an_unknown_farm_returns_farm_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints.POST_/wind-ops/farms/{id}/turbines
          - validations[priority=32]
          - errors[ERR_FARM_NOT_FOUND]
        distinguishing_aspect: |
          Path identifiers resolve left to right and each named collection has its own code, so an
          unknown /farms/{id} segment yields ERR_FARM_NOT_FOUND even though the body's
          turbine_model_id is perfectly valid.
        test_recipe:
          setup:
            - "one valid turbine model and no farms"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/farms/11111111-2222-3333-4444-555555555555/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 404 with ${err_id} == ERR_FARM_NOT_FOUND, not ERR_PATH_RESOURCE_NOT_FOUND and not ERR_REFERENCE_NOT_FOUND"
            - "GET /wind-ops/turbines returns total_count 0"
      - name: work_order_create_with_an_unknown_body_turbine_id_returns_reference_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=34]
          - endpoints.POST_/wind-ops/work-orders
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: |
          A dangling foreign key in the BODY is a different failure from a dangling path segment:
          the same unknown UUID yields ERR_REFERENCE_NOT_FOUND here and ERR_TURBINE_NOT_FOUND when
          it sits in /turbines/{id}, and both fire before the work-order state machine is consulted.
        test_recipe:
          setup:
            - "an empty database except for the logical clock, so no turbine exists at all"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "11111111-2222-3333-4444-555555555555", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response is HTTP 404 with ${err_id} == ERR_REFERENCE_NOT_FOUND"
            - "GET /wind-ops/work-orders returns total_count 0"
      - name: component_replacement_junction_resolves_all_three_of_its_foreign_keys
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - complexity_profile.relationship_patterns
          - entities.ComponentReplacement
          - endpoints.GET_/wind-ops/component-replacements
          - endpoints.GET_/wind-ops/work-orders
        distinguishing_aspect: |
          The topology is a graph, and ComponentReplacement is its junction row: it points at a
          WorkOrder, a SparePart and (after reservation) a CraneMobilization, and every one of those
          three must be reachable in reverse through its own list filter. The self-referential
          parent_work_order_id link is exercised in the same recipe, and the parent's own pointer must
          stay null rather than pointing at itself.
        test_recipe:
          setup:
            - "one turbine, one gearbox stock line, a parent and a child work order, and one crane"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "GEARBOX", part_number: "GB-4200-A", quantity_on_hand: 2, lead_time_days: 210, reorder_point: 1, unit_cost_cents: 48000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { sp_id: $.data.id }
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 20 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_parent: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-08-09T00:00:00Z", demobilization_end_utc: "2026-08-12T00:00:00Z", day_rate_cents: 3800000, mobilization_fee_cents: 12000000, max_lift_wind_speed_ms: 9.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t_id}", work_type: "BLADE_REPAIR", required_certification: "GWO_BASIC", estimated_hours: 6, parent_work_order_id: "${wo_parent}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_child: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_parent}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 8.0, uptower_labor_hours: 0.0 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { cr_id: $.data.id }
            - call: "POST /wind-ops/component-replacements/${cr_id}/reserve-crane"
              payload: { crane_mobilization_id: "${cm_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_parent}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/component-replacements"
              payload: { spare_part_id: "${sp_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/component-replacements"
              payload: { crane_mobilization_id: "${cm_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "GET /wind-ops/work-orders"
              payload: { parent_work_order_id: "${wo_parent}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
          assert:
            - "ComponentReplacement.${cr_id} carries work_order_id ${wo_parent}, spare_part_id ${sp_id} and crane_mobilization_id ${cm_id} after the reservation"
            - "each of the three component-replacement filters returns exactly 1 row with total_count == 1, so every leg of the junction is reachable in reverse"
            - "WorkOrder.${wo_child}.parent_work_order_id == ${wo_parent} and WorkOrder.${wo_parent}.parent_work_order_id == null"
            - "the parent_work_order_id filter returns exactly 1 row, the child, and does not include the parent itself"
            - "SparePart.${sp_id}.quantity_on_hand == 1, quantity_reserved == 1 and total_units_accounted == 2, so the junction row holds a real reservation"
  - section: state_machines
    instances:
      - name: work_order_walks_draft_submitted_scheduled_in_progress_completed_end_to_end
        claim_type: valid_transition
        grounds:
          - state_machines.WorkOrder
          - endpoints.POST_/wind-ops/work-orders/{id}/submit
          - endpoints.POST_/wind-ops/work-orders/{id}/schedule
          - endpoints.POST_/wind-ops/work-orders/{id}/start
          - endpoints.POST_/wind-ops/work-orders/{id}/complete
        distinguishing_aspect: |
          The whole declared forward path, one hop per request, with the turbine's availability
          dimension riding along: ONLINE -> DOWN_MAJOR on start and back to ONLINE on complete,
          while the crew moves AVAILABLE -> ON_SHIFT -> AVAILABLE and the labour cost posts to the
          farm ledger from actual_hours, not from estimated_hours.
        test_recipe:
          setup:
            - "one farm, one ONLINE turbine, one crane-certified crew and one CONFIRMED weather window"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/crews"
              payload: { wind_farm_id: "${farm_id}", crew_code: "C-ALPHA", technician_count: 4, certifications: ["GWO_BASIC", "CRANE_BANKSMAN"], max_work_wind_speed_ms: 14.0, daily_hours_capacity: 24, hourly_rate_cents: 90000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /wind-ops/weather-windows"
              payload: { wind_farm_id: "${farm_id}", start_utc: "2026-08-10T06:00:00Z", end_utc: "2026-08-10T18:00:00Z", forecast_wind_speed_ms: 8.0, forecast_gust_ms: 11.0, icing_risk: false }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { win_id: $.data.id }
            - call: "POST /wind-ops/weather-windows/${win_id}/confirm"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", weather_window_id: "${win_id}", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T16:00:00Z" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "GET /wind-ops/turbines/${t_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/work-orders/${wo_id}/complete"
              payload: { actual_hours: 9 }
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "after submit WorkOrder.${wo_id}.state == SUBMITTED with submitted_by_user_id == planner-1 and a non-null priority_score"
            - "after schedule state == SCHEDULED with crew_id ${crew_id}, weather_window_id ${win_id} and WeatherWindow.${win_id}.active_work_order_count == 1 while the window is still CONFIRMED"
            - "after start state == IN_PROGRESS, Crew.${crew_id}.status == ON_SHIFT, WeatherWindow.${win_id}.state == CONSUMED and the interleaved turbine read shows availability_state == DOWN_MAJOR with curtailment_state still UNCONSTRAINED"
            - "after complete state == COMPLETED, Turbine.${t_id}.availability_state == ONLINE and Crew.${crew_id}.status == AVAILABLE"
            - "WorkOrder.${wo_id}.labor_cost_cents == 810000, that is 9 actual hours times 90000 cents and NOT the 8 estimated hours"
            - "WindFarm.${farm_id}.maintenance_spend_cents == 810000 and opex_accrued_cents == 810000"
            - "WeatherWindow.${win_id}.active_work_order_count == 0 and state == EXPIRED, since the last order left the window"
      - name: fault_raise_and_work_order_submit_are_rejected_on_a_decommissioned_turbine
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=42]
          - state_machines.Turbine
          - state_machines.WorkOrder
          - errors[ERR_TURBINE_DECOMMISSIONED]
        distinguishing_aspect: |
          DECOMMISSIONED is the availability dimension's only terminal state, and it locks the
          turbine out of BOTH the child-creation endpoints hung off /turbines/{id} and the work-order
          submit precondition - the create of a work order against it still succeeds, so the refusal
          lands on submit and not earlier.
        test_recipe:
          setup:
            - "one farm with one turbine that is decommissioned after a DRAFT work order already exists for it"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-3001", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 8 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t_id}/decommission"
              payload: { decommission_reason: "tower foundation condemned" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T01:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_fault: $.data.error_id }
            - call: "POST /wind-ops/turbines/${t_id}/blade-damages"
              payload: { inspection_method: "DRONE", blade_position: "A", inspected_at: "2026-08-01T02:00:00Z", damage_category: 2, damage_type: "LEADING_EDGE_EROSION", chord_position_pct: 30.0, damage_length_mm: 400, exposed_area_cm2: 90.0 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { err_blade: $.data.error_id }
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_submit: $.data.error_id }
          assert:
            - "Turbine.${t_id}.availability_state == DECOMMISSIONED, the terminal state of the availability dimension"
            - "the fault raise returns HTTP 409 with ${err_fault} == ERR_TURBINE_DECOMMISSIONED and no FaultEvent row exists for the turbine"
            - "the blade damage record returns HTTP 409 with ${err_blade} == ERR_TURBINE_DECOMMISSIONED"
            - "the submit returns HTTP 409 with ${err_submit} == ERR_TURBINE_DECOMMISSIONED, not ERR_WORK_ORDER_INVALID_STATE, because the order genuinely was in DRAFT"
            - "WorkOrder.${wo_id}.state is still DRAFT and submitted_by_user_id is still null"
      - name: each_machine_rejects_an_undeclared_trigger_from_its_current_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority=40]
