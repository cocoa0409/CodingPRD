  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: hold_create_stale_event_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[hold-create-stale-event]", entities.Event.fields.version]
        distinguishing_aspect: "After hold A advances Event.version, a second hold create still carrying the pre-A expected_event_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Event ONSALE with 2 seats; buyer admitted; event version observed as ${ev_v1} before any hold."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { err: $.data.error_id } }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: refund_create_stale_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[refund-create-stale-order]", entities.Order.fields.version]
        distinguishing_aspect: "After refund request A advances Order.version, a second refund-request create still carrying the pre-A expected_order_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Paid 2-seat order; order version observed as ${ov} before any refund request."]
          setup_api_calls:
            - { call: "POST /buyers", payload: { name: "B", email: "b@x.com" }, as: BoxOffice, captures: { b: $.data.id } }
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "1" }, as: BoxOffice, captures: { s1: $.data.id } }
            - { call: "POST /events/${ev}/seats", payload: { price_level_id: "${pl}", section: "A", row: "1", seat_number: "2" }, as: BoxOffice, captures: { s2: $.data.id } }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1" }
            - { call: "POST /events/${ev}/status", payload: { target_status: "ONSALE" }, as: Promoter, as_user_id: "prm_1", captures: { ev_v1: $.data.version } }
            - { call: "POST /events/${ev}/queue-tokens", payload: { buyer_id: "${b}" }, as: Buyer, as_user_id: "${b}", captures: { tk: $.data.id } }
            - { call: "POST /queue-tokens/${tk}/admit", payload: {}, as: BoxOffice }
            - { call: "POST /events/${ev}/holds", payload: { seat_ids: ["${s1}", "${s2}"], buyer_id: "${b}", expected_event_version: "${ev_v1}" }, as: Buyer, as_user_id: "${b}", captures: { h: $.data.id } }
            - { call: "POST /orders", payload: { hold_id: "${h}", delivery_method: "MOBILE" }, as: Buyer, as_user_id: "${b}", captures: { o: $.data.id } }
            - { call: "POST /orders/${o}/pay", payload: {}, as: Buyer, as_user_id: "${b}" }
            - { call: "GET /tickets?order_id=${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { t1: "$.data[0].id", t2: "$.data[1].id" } }
            - { call: "GET /orders/${o}", payload: {}, as: Buyer, as_user_id: "${b}", captures: { ov: $.data.version } }
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ov}", ticket_ids: ["${t1}"] }, as: Buyer, as_user_id: "${b}", captures: { rr1: $.data.id } }
          trigger:
            - { call: "POST /orders/${o}/refund-requests", payload: { reason: "CUSTOMER_REQUEST", refund_destination: "ORIGINAL", expected_order_version: "${ov}", ticket_ids: ["${t2}"] }, as: Buyer, as_user_id: "${b}", captures: { err: $.data.error_id } }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION"

      - name: event_version_increments_on_status_transition
        claim_type: optimistic_concurrency
        grounds: [entities.Event.fields.version, state_machines.Event.transitions.DRAFT_to_ANNOUNCED]
        distinguishing_aspect: "Event.version starts at 1 on create and increments to 2 after a single ANNOUNCED status transition."
        test_recipe:
          setup: ["Event created (version 1) with a price level so it can be announced."]
          setup_api_calls:
            - { call: "POST /events", payload: { promoter_id: "prm_1", name: "E", venue_name: "H", event_datetime: "2026-08-01T19:00:00Z", hold_ttl_minutes: 15, purchase_window_minutes: 30 }, as: Promoter, as_user_id: "prm_1", captures: { ev: $.data.id, v1: $.data.version } }
            - { call: "POST /events/${ev}/price-levels", payload: { name: "GA", base_face_value_cents: 9990, is_platinum: false, service_fee_pct: 0.15, service_fee_flat_cents: 500, dynamic_pricing_enabled: false }, as: Promoter, as_user_id: "prm_1", captures: { pl: $.data.id } }
          trigger:
            - { call: "POST /events/${ev}/status", payload: { target_status: "ANNOUNCED" }, as: Promoter, as_user_id: "prm_1", captures: { v2: $.data.version } }
          assert:
            - "create: Event.${ev}.version == 1"
            - "after ANNOUNCED: Event.${ev}.version == 2"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: pay_response_reflects_sold_seats_immediately
        claim_type: immediate
        grounds: [state_machines.Order.transitions.PENDING_to_PAID, entities.Event.fields.seats_sold]
        distinguishing_aspect: "immediate consistency: the GET /events/{id} right after pay already reports seats_sold==1 and seats_held==0 within the same synchronous flow (no lag)."
        test_recipe:
          setup: ["Event ONSALE, 1 seat, PENDING order paid."]
