      - "POST /api/v1/orders/{order_id}/breakdowns"
      - "GET /api/v1/orders/{order_id}/trip-logs"
      - "GET /api/v1/orders/{order_id}/incidents"
      - "GET /api/v1/orders/{order_id}/breakdowns"
      - "GET /api/v1/breakdowns/{id}"
      - "GET /api/v1/insurance-certificates"
