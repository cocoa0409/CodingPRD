      - name: pickup_before_ready_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PICKUP_NOT_READY]", state_machines.Order]
        distinguishing_aspect: "fulfillment-transition to PICKED_UP from PICKUP_PENDING skips READY_FOR_PICKUP and rejects; the two-step order is enforced."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0; variant M stocked 25; ONLINE CARD order created (PICKUP_PENDING)"]
          setup_api_calls:
