            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "MOAT", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 69000, ivt_impressions: 2100 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id, maxc: $.data.make_good_max_credit_cents } }
          trigger:
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 1550 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_ok: $.data.id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 1551 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { err: $.data.error_id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "BONUS_IMPRESSIONS", bonus_impressions: 5000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_bonus: $.data.id, bonus_kind: $.data.kind } }
          assert:
