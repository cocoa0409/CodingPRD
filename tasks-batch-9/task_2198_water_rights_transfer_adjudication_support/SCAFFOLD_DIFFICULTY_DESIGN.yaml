            (certified_hcu_af 195.00, transferable_af 195.00) and create a DRAFT
            CHANGE_OF_USE application for 500.00 af — over-scoped applications
            are legal to draft, the budget is only enforced at submit. Then have
            the adjudicator PATCH claimant A's standing to DELINQUENT.
