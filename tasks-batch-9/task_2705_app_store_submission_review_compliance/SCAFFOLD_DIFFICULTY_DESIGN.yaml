            - { call: "POST /signing-credentials/${cert_a_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_a_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_a_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_a_v2}", publisher_account_id: "${acct_a_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_a_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_a_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_a_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_a_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_a_id: "$.data.id" } }
            - { call: "GET /app-records/${app_a_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_a_v: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_a_v}", app_record_id: "${app_a_id}", signing_credential_id: "${prof_a_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_a_id: "$.data.id" } }
            - { call: "POST /publisher-accounts", payload: { legal_name: "Eastgate Reader BV", contact_email: "ops@eastgate.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_b_id: "$.data.id", acct_b_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_b_v1}", publisher_account_id: "${acct_b_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-2", captures: { cert_b_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_b_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-2" }
            - { call: "GET /publisher-accounts/${acct_b_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-2", captures: { acct_b_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_b_v2}", publisher_account_id: "${acct_b_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_b_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-2", captures: { prof_b_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_b_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-2" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_b_id}", bundle_id: "com.eastgate.reader", platform: "IOS", display_name: "Eastgate Reader", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-2", captures: { app_b_id: "$.data.id" } }
            - { call: "GET /app-records/${app_b_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-2", captures: { app_b_v: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_b_v}", app_record_id: "${app_b_id}", signing_credential_id: "${prof_b_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-2", captures: { sub_b_id: "$.data.id" } }
          trigger:
            - { call: "POST /submissions/00000000-0000-4000-8000-000000000000/queue", payload: {}, as: StoreSuperAdmin, as_user_id: "u-ghost-1", note: "X-User-Role carries the name StoreSuperAdmin, which is absent from §1.7; X-Publisher-Account-Id is omitted entirely" }
            - { call: "POST /submissions/00000000-0000-4000-8000-000000000000/queue", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1", note: "X-Publisher-Account-Id is account A (${acct_a_id}); ComplianceOfficer is not among this endpoint's authorized_roles" }
            - { call: "POST /submissions/00000000-0000-4000-8000-000000000000/queue", payload: { unknown_field: 1 }, as: ReleaseManager, as_user_id: "u-release-1", note: "X-Publisher-Account-Id is account A (${acct_a_id}); the body carries one field the §1.5 input does not declare" }
            - { call: "POST /submissions/${sub_b_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", note: "X-Publisher-Account-Id is account A (${acct_a_id}) while ${sub_b_id} resolves to account B — account A reaching account B's build" }
            - { call: "POST /submissions/${sub_a_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", note: "X-Publisher-Account-Id is account A (${acct_a_id}), matching ${sub_a_id}'s owner; only the DRAFT state remains to reject" }
          assert:
            - "unknown-role call -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 10; never 403 and never 404)"
            - "ComplianceOfficer on the bogus id -> 403 ERR_ROLE_NOT_PERMITTED (priority 15 beats 25; existence must not leak)"
            - "ReleaseManager on the bogus id with an unknown body field -> 404 ERR_SUBMISSION_NOT_FOUND (priority 25 beats 28; never 422 ERR_VALIDATION)"
            - "ReleaseManager of account A on ${sub_b_id} -> 403 ERR_CROSS_ACCOUNT_ACCESS_DENIED (priority 20; never 404 and never 409)"
            - "ReleaseManager of account A on its own DRAFT ${sub_a_id} -> 409 ERR_INVALID_SUBMISSION_STATE (priority 35; the ladder bottoms out only here)"
            - "Submission.${sub_a_id}.state == DRAFT and Submission.${sub_b_id}.state == DRAFT (no call mutated anything)"
            - "ReviewCapacityWindow rows: none exist, proving no queue call reached the capacity allocation step"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: posture_index_exactly_at_floor_not_restricted
        grounds:
          - calculations.feature_compliance_index
          - calculations.compliance_posture
          - constants.POSTURE_INDEX_FLOOR
          - validations[priority=40]
          - entities.AppRecord.fields.feature_compliance_index
          - entities.AppRecord.fields.posture_reason_codes
          - endpoints[POST /expedite-requests]
          - errors.ERR_APP_COMPLIANCE_RESTRICTED
        distinguishing_aspect: |
          A weighted index of exactly 90.00 (earned 9 of total 10: SAFETY 5 PASSED + PRIVACY 4 PASSED
          + DESIGN 1 NOT_STARTED) must NOT restrict, because R3 uses strict < POSTURE_INDEX_FLOOR;
          adding one more DESIGN NOT_STARTED mapping moves the same numerator to 9/11 = 81.8181...
          which must round_half_up to 81.82 and flip the posture to RESTRICTED.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE with standing_score_rolling_365 100.00 and expedite_credits_remaining 2"
            - "AppRecord IOS with an ACTIVE DISTRIBUTION_CERT (so R2 cannot fire) and no ImpactAssessment (so R4 cannot fire)"
            - "Three EFFECTIVE guidelines: SAFETY 1.4.1 (weight 5), PRIVACY 5.1.1 (weight 4), DESIGN 4.2 (weight 1)"
            - "FeatureMappings: SAFETY PASSED, PRIVACY PASSED, DESIGN NOT_STARTED -> feature_compliance_index exactly 90.00, posture OPEN"
            - "One Submission build 10 in state DRAFT to hang the expedite request on"
            - "Clock at its 2026-08-01T00:00:00Z default"
