  - section: endpoints
    instances:
      - name: worksite_get_returns_the_stored_row_with_zeroed_counters
        claim_type: Standard CRUD
        grounds:
          - endpoints["GET /wbl/worksites/{worksiteId}"]
          - entities.Worksite
        distinguishing_aspect: |
          The read-back must return exactly what was stored plus the server-owned compliance columns in
          their initial state: safety_status UNREVIEWED, safety_review_expires_on null,
          corrective_actions_due_on null, slots_committed 0 and version 1.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z"
            - "one partner with one freshly created worksite"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Harborview Marina", naics_code: "713930", industry_sector: "RETAIL", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10181", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
