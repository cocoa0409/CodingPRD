          assert:
            - "wish_v1 == 1 and the first team create succeeded (wish advanced to 2)"
            - "the stale retry with expected_wish_version == 1 fails: err == ERR_STALE_VERSION (412)"
            - "the fresh retry succeeds: WishTeam.${team2_id}.status == ACTIVE, WishTeam.${team1_id}.status == DISBANDED, wish_v_fresh == 2 before the retry"

