  - method: GET
    path: "/consumers/{consumerId}/inquiries"
    description: "List inquiries resolved to this consumer"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "QuoteInquiry[]"
