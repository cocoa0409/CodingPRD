            - { call: "POST /central-casting/actors/${u2}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 16", union_slots: 2, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${u1}" }, as: CastingAssociate }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc}", actor_id: "${u2}" }, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector, captures: { pc: $.data.projected_compliant, puc: $.data.projected_union_count, rus: $.data.required_union_slots, st: $.data.status } }
          assert:
            - "projected_union_count == 2 and required_union_slots == 2 (exactly at boundary)"
            - "projected_compliant == true and status == LOCKED (>= passes; > would be wrong operator)"
      - name: empty_standby_pool_expires_case
        grounds:
          - calculations.standby_selection
