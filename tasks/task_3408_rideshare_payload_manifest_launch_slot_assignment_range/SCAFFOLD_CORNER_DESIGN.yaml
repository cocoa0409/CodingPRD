              as: MissionOps
              captures: { p_b: $.data.id }
            - call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-C", stack_position: 2, max_mass_kg: 100, supported_interface_classes: ["RING_24", "CUBESAT"] }
