        claim_type: listing
        grounds: [endpoints.GET /advancement/agreements]
        distinguishing_aspect: "The filtered list form returns exactly the agreements of the given prospect via the prospect_id query parameter."
        test_recipe:
          setup: ["prospect with one EXECUTED agreement"]
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
