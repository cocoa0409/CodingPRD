  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: lifts_required_ceiling_variants
        claim_type: correct_result
        grounds:
          - calculations.lifts_required
          - entities.PipeSegment.fields.lifts_required
        distinguishing_aspect: "Ceiling arithmetic over the trench-depth formula: (8.0 + 12/12 + 0.5) = 9.5 -> 10 lifts for a CLASS_B 12-inch segment, while (1.0 + 6/12 + 0.25) = 1.75 -> 2 lifts for a CLASS_D 6-inch segment."
        test_recipe:
          setup: ["Project P ACTIVE; owner O"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-LFT", contract_ref: "C-300", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
