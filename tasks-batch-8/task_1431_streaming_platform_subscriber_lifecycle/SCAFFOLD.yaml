scenario: |
  Streaming Platform Subscriber Lifecycle & Churn (Netflix/Hulu style service):
  plan/tier & trial conversion tracking, billing retry & involuntary churn
  recovery (dunning), pause/downgrade offers & save flows, content-driven
  signup attribution & cohort retention, household/profile limits & password
  sharing enforcement, price change notice & grandfathering, win-back campaign
  eligibility, partner-billed subscription reconciliation.

domain_name: streaming-platform-subscriber-lifecycle
api_prefix: /v1

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Unique plan identifier (UUID)" }
      - { name: plan_code, type: string, source: input, description: "Stable business code (e.g. STD, PREMIUM); unique per active plan" }
      - { name: display_name, type: string, source: input, description: "Human-readable plan name" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM; ordinal drives upgrade/downgrade direction" }
      - { name: monthly_price_cents, type: integer, source: input, description: "Current monthly price in cents" }
      - { name: trial_days, type: integer, source: input, description: "Length of free trial in days; 0 means no trial" }
      - { name: max_profiles, type: integer, source: input, description: "Max simultaneous profiles on an account subscribing to this plan" }
      - { name: max_households, type: integer, source: input, description: "Max distinct households allowed to stream (password-sharing rule)" }
      - { name: is_archived, type: boolean, source: system, description: "Archived plans cannot be subscribed to, but existing subs grandfathered" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "Unique account identifier (UUID)" }
      - { name: email, type: string, source: input, description: "Account email; globally unique" }
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2 country" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: created_via_partner_id, type: string, source: input, description: "FK -> PartnerBillingRecord.id; null when direct-billed; identifies the partner billing relationship that originated this account" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of unsettled CHARGE_FAILED amounts minus recovered amounts" }
      - { name: active_subscription_id, type: string, source: system, description: "FK -> Subscription.id; null when no live subscription" }

  - name: Profile
    parent: Account
    common_fields: true
    fields:
      - { name: profile_id, type: string, source: system, description: "Unique profile identifier (UUID)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: display_name, type: string, source: input, description: "Profile name shown in UI" }
      - { name: is_kids, type: boolean, source: input, description: "Kids-flag; restricts content rating" }
      - { name: household_id, type: string, source: input, description: "Logical household identifier (e.g. stable network/device fingerprint); multiple profiles may share a household" }
      - { name: profile_status, type: enum, source: system, description: "ACTIVE | DEACTIVATED" }

  - name: Subscription
    parent: Account
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "Unique subscription identifier (UUID)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; current plan" }
      - { name: subscription_status, type: enum, source: system, description: "TRIALING | ACTIVE | PAST_DUE | PAUSED | CANCELLED | EXPIRED" }
      - { name: billing_state, type: enum, source: system, description: "CURRENT | DUNNING | RECOVERED; parallel axis tracking payment retry" }
      - { name: cancel_reason, type: enum, source: input, description: "USER_REQUESTED | PAYMENT_FAILED | PRICE_REFUSAL | WINBACK_EXPIRED | ADMIN; set when subscription transitions to CANCELLED" }
      - { name: period_start_utc, type: datetime, source: system, description: "Start of current paid period" }
      - { name: period_end_utc, type: datetime, source: system, description: "End of current paid period (exclusive)" }
      - { name: trial_end_utc, type: datetime, source: system, description: "Trial expiry; null when no trial" }
      - { name: paused_until_utc, type: datetime, source: system, description: "Scheduled resume instant when PAUSED; null otherwise" }
      - { name: pending_plan_id, type: string, source: system, description: "FK -> Plan.id; scheduled downgrade target; takes effect at next period boundary" }
      - { name: grandfathered_price_cents, type: integer, source: system, description: "Locked-in monthly price; null when subscriber pays plan list price" }
      - { name: save_offer_id, type: string, source: system, description: "FK -> SaveOffer.id; most recent save offer presented on the latest cancel attempt, null if none" }
      - { name: signup_attribution_id, type: string, source: system, description: "FK -> SignupAttribution.id; attribution row created at signup" }
      - { name: dunning_attempt_count, type: integer, source: system, description: "Number of failed billing attempts in current dunning cycle" }
      - { name: price_change_notice_id, type: string, source: system, description: "FK -> PriceChangeNotice.id; latest notice applicable to this subscription, null when none" }

  - name: BillingEvent
    parent: Account
    common_fields: false
    fields:
      - { name: billing_event_id, type: string, source: system, description: "Unique billing event identifier (UUID)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: event_type, type: enum, source: system, description: "TRIAL_START | CHARGE | CHARGE_FAILED | REFUND | PRORATION_CREDIT | PRICE_CHANGE_APPLIED | RECOVERY" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents; negative for refund/credit" }
      - { name: occurred_at_utc, type: datetime, source: system, description: "Logical clock time when event recorded" }
      - { name: external_reference, type: string, source: input, description: "Payment-processor reference; required for partner-reported events" }
      - { name: notes, type: string, source: input, description: "Operator-supplied annotation" }

  - name: SaveOffer
    parent: Account
    common_fields: true
    fields:
      - { name: save_offer_id, type: string, source: system, description: "Unique save offer identifier (UUID)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id this offer targets" }
      - { name: offer_type, type: enum, source: input, description: "PAUSE_1M | PAUSE_3M | DOWNGRADE | DISCOUNT_50_3M" }
      - { name: offer_status, type: enum, source: system, description: "PRESENTED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED" }
      - { name: discount_pct, type: integer, source: input, description: "Discount percent (0-100); 0 unless offer_type=DISCOUNT_50_3M" }
      - { name: discount_duration_months, type: integer, source: input, description: "Number of months the discount applies; 0 unless DISCOUNT_50_3M" }
      - { name: target_plan_id, type: string, source: input, description: "FK -> Plan.id; downgrade target when offer_type=DOWNGRADE; null otherwise" }
      - { name: presented_at_utc, type: datetime, source: system, description: "When the offer was presented" }
      - { name: expires_at_utc, type: datetime, source: system, description: "Offer expiry instant; 72h after presentation" }

  - name: PriceChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: price_change_notice_id, type: string, source: system, description: "Unique notice identifier (UUID)" }
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id the price change applies to" }
      - { name: old_price_cents, type: integer, source: input, description: "Price in cents before change" }
      - { name: new_price_cents, type: integer, source: input, description: "Price in cents after change" }
      - { name: announced_at_utc, type: datetime, source: system, description: "Announcement timestamp" }
      - { name: effective_at_utc, type: datetime, source: input, description: "Effective timestamp; must be at least 30 days after announcement" }
      - { name: notice_status, type: enum, source: system, description: "ANNOUNCED | EFFECTIVE | CANCELLED" }
      - { name: grandfather_period_months, type: integer, source: input, description: "Months existing subscribers keep old price; 0 = no grandfathering" }

  - name: WinbackCampaign
    parent: null
    common_fields: true
    fields:
      - { name: winback_campaign_id, type: string, source: system, description: "Unique campaign identifier (UUID)" }
      - { name: campaign_code, type: string, source: input, description: "Stable campaign code; unique among ACTIVE/DRAFT campaigns" }
      - { name: discount_pct, type: integer, source: input, description: "Win-back discount percent" }
      - { name: duration_months, type: integer, source: input, description: "Months discount applies after reactivation" }
      - { name: min_days_since_cancel, type: integer, source: input, description: "Minimum days since cancellation required for eligibility" }
      - { name: max_days_since_cancel, type: integer, source: input, description: "Maximum days since cancellation for eligibility" }
      - { name: eligible_cancel_reasons, type: array, source: input, description: "Array of Subscription.cancel_reason values eligible for the campaign" }
      - { name: campaign_status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED" }

  - name: PartnerBillingRecord
    parent: null
    common_fields: true
    fields:
      - { name: partner_billing_record_id, type: string, source: system, description: "Unique partner billing record identifier (UUID)" }
      - { name: partner_code, type: string, source: input, description: "Partner identifier (e.g. APPLE, GOOGLE, ROKU)" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account billed through this partner" }
      - { name: partner_subscription_ref, type: string, source: input, description: "Partner-side subscription reference" }
      - { name: report_status, type: enum, source: system, description: "EXPECTED | RECEIVED | RECONCILED | DISCREPANCY | WRITE_OFF" }
      - { name: expected_amount_cents, type: integer, source: input, description: "Amount expected from partner this cycle" }
      - { name: received_amount_cents, type: integer, source: system, description: "Amount actually received from partner" }
      - { name: period_start_utc, type: datetime, source: input, description: "Cycle start" }
      - { name: period_end_utc, type: datetime, source: input, description: "Cycle end" }

  - name: SignupAttribution
    parent: null
    common_fields: true
    fields:
      - { name: signup_attribution_id, type: string, source: system, description: "Unique attribution identifier (UUID)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id" }
      - { name: content_id, type: string, source: input, description: "Content asset that drove the signup; empty string when organic" }
      - { name: channel, type: enum, source: input, description: "ORGANIC | SEARCH | SOCIAL | AD | EMAIL | REFERRAL" }
      - { name: cohort_month, type: string, source: system, description: "YYYY-MM of signup; derived from created_at on the attribution row" }
      - { name: retained_at_day_30, type: boolean, source: system, description: "True iff subscription still in {TRIALING, ACTIVE, PAST_DUE, PAUSED} at day+30" }
      - { name: retained_at_day_90, type: boolean, source: system, description: "True iff subscription still in {TRIALING, ACTIVE, PAST_DUE, PAUSED} at day+90" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (dunning exhausted → involuntary churn) or POST /v1/accounts/{id}/suspend"
        actor: "PlatformAdmin or system"
        preconditions:
          - "Auto: linked subscription transitioned ACTIVE→EXPIRED with cancel_reason=PAYMENT_FAILED"
          - "Manual: no precondition"
        side_effects:
          - "All profiles of the account become DEACTIVATED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/accounts/{id}/unsuspend"
        actor: "PlatformAdmin or SupportAgent"
        preconditions:
          - "outstanding_balance_cents == 0"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /v1/accounts/{id}/close"
        actor: "PlatformAdmin or SupportAgent"
        preconditions:
          - "No subscription in {TRIALING, ACTIVE, PAST_DUE, PAUSED}"
          - "outstanding_balance_cents == 0"
        side_effects:
          - "All profiles DEACTIVATED"

  - entity: Profile
    field: profile_status
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /v1/profiles/{id}/deactivate OR cascaded from Account SUSPENDED/CLOSED"
        actor: "Subscriber, SupportAgent, PlatformAdmin, system"
        preconditions: []
        side_effects: []
      - from: DEACTIVATED
        to: ACTIVE
        trigger: "POST /v1/profiles/{id}/reactivate"
        actor: "Subscriber, SupportAgent, PlatformAdmin"
        preconditions:
          - "Owning Account is ACTIVE"
          - "Owning Subscription in {TRIALING, ACTIVE, PAST_DUE} (PAUSED blocks reactivation)"
          - "Profile count active on Account < plan.max_profiles"

  - entity: Subscription
    field: subscription_status
    initial_state: TRIALING
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: TRIALING
        to: ACTIVE
        trigger: "system (trial_end_utc reached AND first renewal charge succeeds)"
        actor: system
        preconditions:
          - "Now >= trial_end_utc"
          - "Billing charge success"
        side_effects:
          - "Emit BillingEvent TRIAL_START at signup, CHARGE at conversion"
          - "Update account.active_subscription_id"
      - from: TRIALING
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel OR system (trial ends and first charge fails after dunning)"
        actor: "Subscriber, SupportAgent, system"
        preconditions: []
        side_effects:
          - "cancel_reason := USER_REQUESTED (user) or PAYMENT_FAILED (system)"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (renewal charge fails)"
        actor: system
        preconditions:
          - "billing_state was CURRENT"
        side_effects:
          - "billing_state → DUNNING"
          - "dunning_attempt_count := 1"
          - "Emit BillingEvent CHARGE_FAILED"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (retry charge succeeds) OR POST /v1/subscriptions/{id}/recover"
        actor: "system or Subscriber"
        preconditions:
          - "Billing retry success OR subscriber supplies valid replacement payment method"
        side_effects:
          - "billing_state → RECOVERED (then auto to CURRENT at next successful period boundary)"
          - "Emit BillingEvent RECOVERY"
          - "dunning_attempt_count := 0"
      - from: PAST_DUE
        to: EXPIRED
        trigger: "system (dunning exhausted: dunning_attempt_count >= 5)"
        actor: system
        preconditions:
          - "dunning_attempt_count >= 5"
        side_effects:
          - "cancel_reason := PAYMENT_FAILED"
          - "Account.outstanding_balance_cents increased by unpaid amount"
          - "Account status → SUSPENDED"
      - from: ACTIVE
        to: PAUSED
        trigger: "system (SaveOffer PAUSE_1M/PAUSE_3M accepted) OR POST /v1/subscriptions/{id}/pause"
        actor: "system or Subscriber"
        preconditions:
          - "If via SaveOffer: offer in PRESENTED state and not expired"
          - "Direct pause: allowed only if Account has not paused in last 12 months"
        side_effects:
          - "paused_until_utc := now + pause duration"
          - "Emit BillingEvent PRORATION_CREDIT for unused days of current period"
      - from: PAUSED
        to: ACTIVE
        trigger: "system (paused_until_utc reached) OR POST /v1/subscriptions/{id}/resume"
        actor: "system or Subscriber"
        preconditions: []
        side_effects:
          - "paused_until_utc := null"
          - "Emit BillingEvent CHARGE for prorated remaining period"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: "Subscriber or SupportAgent"
        preconditions: []
        side_effects:
          - "cancel_reason := USER_REQUESTED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: "Subscriber or SupportAgent"
        preconditions: []
        side_effects:
          - "cancel_reason := USER_REQUESTED (or ADMIN when SupportAgent-initiated without save offer flow)"
          - "Any PRESENTED SaveOffer on this subscription → SUPERSEDED"
          - "pending_plan_id cleared"
      - from: TRIALING
        to: EXPIRED
        trigger: "system (trial ends, no payment method on file)"
        actor: system
        preconditions:
          - "Now >= trial_end_utc"
          - "No valid payment method on file"
        side_effects:
          - "cancel_reason := PAYMENT_FAILED"

  - entity: Subscription
    field: billing_state
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: DUNNING
        trigger: "system (renewal charge fails)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit BillingEvent CHARGE_FAILED"
          - "dunning_attempt_count incremented"
      - from: DUNNING
        to: RECOVERED
        trigger: "system (retry succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit BillingEvent RECOVERY"
      - from: RECOVERED
        to: CURRENT
        trigger: "system (next period boundary crossing with successful charge)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOVERED
        to: DUNNING
        trigger: "system (next renewal charge fails again)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit BillingEvent CHARGE_FAILED"

  - entity: SaveOffer
    field: offer_status
    initial_state: PRESENTED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /v1/save-offers/{id}/accept"
        actor: Subscriber
        preconditions:
          - "Now < expires_at_utc"
          - "Subscription in {ACTIVE, TRIALING}"
        side_effects:
          - "PAUSE_*: Subscription → PAUSED with paused_until_utc"
          - "DOWNGRADE: Subscription.pending_plan_id := target_plan_id (effective next period)"
          - "DISCOUNT_50_3M: Subscription.grandfathered_price_cents := 50% of current price for discount_duration_months"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /v1/save-offers/{id}/decline"
        actor: Subscriber
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: EXPIRED
        trigger: "system (now >= expires_at_utc)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system (subscription cancelled or a new save offer presented on same subscription)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PriceChangeNotice
    field: notice_status
    initial_state: ANNOUNCED
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "system (now >= effective_at_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "Plan.monthly_price_cents := new_price_cents"
          - "For every ACTIVE/TRIALING/PAST_DUE Subscription on this plan: if subscription has grandfathered_price_cents and notice.grandfather_period_months > 0 AND months-since-notice-announced < grandfather_period_months → keep grandfathered price; else clear grandfathered_price_cents and apply new price"
          - "Emit BillingEvent PRICE_CHANGE_APPLIED for affected subscriptions"
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /v1/price-change-notices/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "Now < effective_at_utc"
        side_effects: []

  - entity: WinbackCampaign
    field: campaign_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/winback-campaigns/{id}/activate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/winback-campaigns/{id}/close"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: PartnerBillingRecord
    field: report_status
    initial_state: EXPECTED
    terminal_states: [RECONCILED, WRITE_OFF]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /v1/partner-billing-records/{id}/report-receipt"
        actor: PartnerBillingOps
        preconditions: []
        side_effects:
          - "received_amount_cents := payload amount"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /v1/partner-billing-records/{id}/reconcile"
        actor: PartnerBillingOps
        preconditions:
          - "abs(received_amount_cents - expected_amount_cents) <= 500"
        side_effects:
          - "Emit BillingEvent CHARGE with amount=received on linked subscription"
      - from: RECEIVED
        to: DISCREPANCY
        trigger: "system (on reconcile call when delta > 500)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISCREPANCY
        to: RECONCILED
        trigger: "POST /v1/partner-billing-records/{id}/reconcile with override=true"
        actor: PlatformAdmin
        preconditions:
          - "payload.override == true"
        side_effects:
          - "Emit BillingEvent CHARGE with amount=received; difference logged in notes"
      - from: DISCREPANCY
        to: WRITE_OFF
        trigger: "POST /v1/partner-billing-records/{id}/write-off"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: SignupAttribution
    field: null
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only; retained_at_day_30/90 are recomputed by the day-N retention sweep."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-plan-change-occ
    parent_entity: Subscription
    write_endpoint: "POST /v1/subscriptions/{id}/change-plan"
    occ_field: expected_subscription_version
    description: |
      Changing the plan of a Subscription whose version has advanced since the
      caller last observed it is rejected. This captures the case where a price
      change notice, scheduled downgrade, or save-offer-driven downgrade has
      mutated the subscription between the caller's read and write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: partner-reconcile-occ
    parent_entity: PartnerBillingRecord
    write_endpoint: "POST /v1/partner-billing-records/{id}/reconcile"
    occ_field: expected_partner_billing_record_version
    description: |
      Reconciling a PartnerBillingRecord whose version has advanced since the
      caller last observed it is rejected. This captures the case where a
      report-receipt call has updated received_amount_cents between the
      caller's read and reconcile attempt.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: proration_on_upgrade
    trigger: "POST /v1/subscriptions/{id}/change-plan with direction=UPGRADE"
    algorithm: chronological
    formula: |
      days_remaining = (period_end_utc - now) in whole days, floor
      days_in_period = (period_end_utc - period_start_utc) in whole days
      current_price = subscription.grandfathered_price_cents if not null else plan.monthly_price_cents
      target_price = target_plan.monthly_price_cents
      unused_credit_cents = round_half_up(current_price * days_remaining / days_in_period)
      prorated_charge_cents = round_half_up(target_price * days_remaining / days_in_period)
      net_charge_cents = prorated_charge_cents - unused_credit_cents
      # Pin rounding order: per-component rounding BEFORE net subtraction.
    precision: "0 decimal places (cents); round_half_up per component, then subtract"
    constants:
      DAYS_PER_PERIOD_NOMINAL: 30
    variants:
      - name: optimistic_estimate
        when: "GET /v1/subscriptions/{id}/proration-preview — estimate only, not posted"
        difference: "Uses now == request time; never persisted"
      - name: final_posting
        when: "POST /v1/subscriptions/{id}/change-plan — actually applies"
        difference: "Persisted as BillingEvent CHARGE minus PRORATION_CREDIT pair; grandfathered_price_cents cleared on plan change"

  - name: proration_on_pause_credit
    trigger: "Subscription ACTIVE → PAUSED"
    algorithm: chronological
    formula: |
      days_remaining = (period_end_utc - now) in whole days, floor
      days_in_period = (period_end_utc - period_start_utc) in whole days
      current_price = subscription.grandfathered_price_cents if not null else plan.monthly_price_cents
      credit_cents = round_half_up(current_price * days_remaining / days_in_period)
      # Credit is posted as a single negative BillingEvent of type PRORATION_CREDIT.
    precision: "0 decimal places (cents); round_half_up"
    variants:
      - name: provisional_credit
        when: "Pause initiated"
        difference: "Credit computed from current price and remaining days; posted immediately"
      - name: final_clawback
        when: "Resume before period_end_utc"
        difference: "Recomputed using actual paused duration; delta between provisional and final posted as a correcting BillingEvent"

  - name: save_offer_discount_price
    trigger: "SaveOffer DISCOUNT_50_3M accepted"
    algorithm: tiered_pricing
    formula: |
      base = subscription.grandfathered_price_cents if not null else plan.monthly_price_cents
      if offer.discount_pct >= 100: discounted = 0
      elif offer.discount_pct <= 0: discounted = base
      else: discounted = round_half_up(base * (100 - offer.discount_pct) / 100)
      # Boundary: discount_pct == 100 is fully-free; discount_pct == 0 keeps base.
      # Mode (a) combinatorial: depends on plan, grandfathered_price (may be null), and discount_pct
      # with non-linear branch behaviour at 0 and 100.
    precision: "0 decimal places (cents); round_half_up"

  - name: dunning_backoff_schedule
    trigger: "system on each CHARGE_FAILED"
    algorithm: threshold
    formula: |
      # Retry at fixed offsets measured in hours since first failure.
      offsets_hours = [24, 72, 120, 168, 240]
      if dunning_attempt_count < 5: next_retry_at = first_failure_at + offsets_hours[dunning_attempt_count]
      else: subscription transitions to EXPIRED (involuntary churn)
      # Boundary precision: a retry whose scheduled time equals `now` exactly fires (>=, not >).
    constants:
      MAX_ATTEMPTS: 5
      RETRY_OFFSETS_HOURS: [24, 72, 120, 168, 240]

  - name: household_sharing_violation_count
    trigger: "Profile create / reactivate / stream-start; nightly reconciliation"
    algorithm: aggregation
    formula: |
      # Count distinct household_id values across the account's ACTIVE profiles.
      distinct_households = count(distinct profile.household_id where profile.account_id == account.id and profile.profile_status == ACTIVE)
      violation = distinct_households > plan.max_households
      # Boundary: equality is NOT a violation (strictly greater).
      # Mode (b): distinct-count aggregation over a filtered set; empty-set edge (no profiles) yields 0.
    precision: "integer count"

  - name: signup_cohort_retention
    trigger: "system day+30 and day+90 sweeps"
    algorithm: aggregation
    formula: |
      # For each SignupAttribution row:
      retained_at_day_N = true iff linked subscription.subscription_status IN {TRIALING, ACTIVE, PAST_DUE, PAUSED} at (attribution.created_at + N days)
      # Cancelled or Expired at day N → retained_at_day_N = false.
      # Equality (status evaluated exactly at the boundary instant) counts as retained if still live at that instant.
    precision: "boolean"

  - name: partner_reconciliation_delta
    trigger: "POST /v1/partner-billing-records/{id}/reconcile"
    algorithm: threshold
    formula: |
      delta_cents = received_amount_cents - expected_amount_cents
      if abs(delta_cents) <= 500: status → RECONCILED
      else: status → DISCREPANCY
      # Boundary: |delta| == 500 exactly reconciles; |delta| == 501 opens discrepancy.
    constants:
      AUTO_RECONCILE_TOLERANCE_CENTS: 500

  - name: winback_eligibility
    trigger: "GET /v1/accounts/{id}/winback-eligibility"
    algorithm: forward_looking
    formula: |
      days_since_cancel = floor((now - most_recent_cancelled_or_expired_subscription.updated_at) / 86400)
      eligible_campaigns = [c for c in WinbackCampaign where c.campaign_status == ACTIVE
                            and c.min_days_since_cancel <= days_since_cancel <= c.max_days_since_cancel
                            and most_recent_subscription.cancel_reason IN c.eligible_cancel_reasons]
      # Selector determinism: order by created_at ASC of campaign; never use id.
      # Boundary: inclusive both ends.
    precision: "integer days"

  - name: grandfathered_price_carryover
    trigger: "PriceChangeNotice EFFECTIVE transition"
    algorithm: constraint_propagation
    formula: |
      # For each subscription on the plan at notice effective time:
      months_since_announce = floor((effective_at_utc - announced_at_utc) / (30*86400))
      if subscription.grandfathered_price_cents is null:
          # No existing lock: if notice.grandfather_period_months > 0, lock old price for that many months
          new_grandfathered = notice.old_price_cents if notice.grandfather_period_months > 0 else null
      else:
          # Existing lock: keep it if months_since_announce < notice.grandfather_period_months, else clear
          new_grandfathered = subscription.grandfathered_price_cents if months_since_announce < notice.grandfather_period_months else null
      # Circular-looking dependency resolution order:
      # 1) snapshot old_price_cents; 2) evaluate months_since_announce;
      # 3) decide new_grandfathered; 4) write; 5) emit event.
      # Mode (c): evaluation order pinned so the value is well-defined.
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke the target endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path parameters identify existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints (cancel, pause, resume, recover, accept, decline, reconcile, etc.)"
  - priority: 5
    category: business_safety
    check: "Account status permits the action (CLOSED blocks all; SUSPENDED blocks value-extending)"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "subscriber-facing mutations"
  - priority: 6
    category: business_temporal
    check: "Save offer not expired; price-change notice not yet effective; pause duration valid"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /v1/save-offers/{id}/accept, POST /v1/price-change-notices/{id}/cancel, POST /v1/subscriptions/{id}/pause"
  - priority: 7
    category: business_referential
    check: "Referenced Plan, Account, Subscription, SaveOffer, Campaign exist and are mutually consistent (e.g., SaveOffer.subscription_id == path subscription)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "all endpoints with body FK references"
  - priority: 8
    category: business_constraint
    check: "Plan tier rules (downgrade target tier < current tier; upgrade reverse); plan not archived; profile/household limits"
    error_id: ERR_PLAN_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /v1/subscriptions, POST /v1/subscriptions/{id}/change-plan, POST /v1/profiles"
  - priority: 9
    category: business_constraint
    check: "Household count does not exceed plan.max_households; profile count < plan.max_profiles"
    error_id: ERR_HOUSEHOLD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/profiles, POST /v1/profiles/{id}/reactivate"
  - priority: 10
    category: business_fiscal
    check: "Sufficient funds / valid payment method; reconcile delta within tolerance (unless override)"
    error_id: ERR_PAYMENT_FAILED
    http_status: 402
    applies_to: "POST /v1/subscriptions/{id}/recover, POST /v1/subscriptions (first charge), POST /v1/partner-billing-records/{id}/reconcile"
  - priority: 11
    category: business_fiscal
    check: "Outstanding balance does not block the operation (unsuspend requires zero balance)"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /v1/accounts/{id}/unsuspend"
  - priority: 12
    category: business_temporal
    check: "Winback window: min_days_since_cancel <= days_since_cancel <= max_days_since_cancel"
    error_id: ERR_WINBACK_INELIGIBLE
    http_status: 422
    applies_to: "POST /v1/accounts/{id}/winback-enroll"
  - priority: 13
    category: business_constraint
    check: "Price change effective date at least 30 days after announcement"
    error_id: ERR_PRICE_CHANGE_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /v1/price-change-notices"
  - priority: 14
    category: business_constraint
    check: "Pause allowed only if no other pause in trailing 12 months"
    error_id: ERR_PAUSE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /v1/subscriptions/{id}/pause"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. Server default time at startup is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_utc: string }
    side_effects: []

  # --- Plans ---
  - method: POST
    path: "/v1/plans"
    description: "Create a plan"
    roles: [PlatformAdmin]
    code: 201
    input: [plan_code, display_name, tier, monthly_price_cents, trial_days, max_profiles, max_households]
    output: Plan
    side_effects: ["is_archived=false"]
  - method: GET
    path: "/v1/plans"
    description: "List plans"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: ["tier?", "is_archived?"]
    output: Plan[]
    side_effects: []
  - method: GET
    path: "/v1/plans/{id}"
    description: "Get plan by id"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/archive"
    description: "Archive a plan (existing subscriptions grandfathered)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["is_archived=true; new subscriptions rejected"]

  # --- Accounts ---
  - method: POST
    path: "/v1/accounts"
    description: "Open a new subscriber account"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, country_code, "created_via_partner_id?"]
    output: Account
    side_effects: ["account_status=ACTIVE"]
  - method: GET
    path: "/v1/accounts"
    description: "List accounts"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps]
    code: 200
    input: ["account_status?", "email?", "created_via_partner_id?", "active_subscription_id?"]
    output: Account[]
    side_effects: []
  - method: GET
    path: "/v1/accounts/{id}"
    description: "Get account by id"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/v1/accounts/{id}/suspend"
    description: "Manually suspend an account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["account_status=SUSPENDED; profiles DEACTIVATED"]
  - method: POST
    path: "/v1/accounts/{id}/unsuspend"
    description: "Unsuspend an account; requires zero outstanding balance"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Account
    side_effects: ["account_status=ACTIVE"]
  - method: POST
    path: "/v1/accounts/{id}/close"
    description: "Close an account (terminal)"
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Account
    side_effects: ["account_status=CLOSED; profiles DEACTIVATED"]
  - method: GET
    path: "/v1/accounts/{id}/winback-eligibility"
    description: "Computed read of win-back eligibility for an account"
    roles: [PlatformAdmin, SupportAgent, Subscriber]
    code: 200
    input: []
    output: { eligible_campaign_ids: array, days_since_cancel: integer }
    side_effects: []
  - method: POST
    path: "/v1/accounts/{id}/winback-enroll"
    description: "Enroll an account into a win-back campaign (reactivates most recent cancelled/expired subscription)"
    roles: [PlatformAdmin, SupportAgent, Subscriber]
    code: 200
    input: [winback_campaign_id, expected_subscription_version]
    output: Subscription
    side_effects:
      - "Subscription status → ACTIVE (from CANCELLED/EXPIRED)"
      - "cancel_reason unchanged; grandfathered_price_cents := round_half_up(plan.monthly_price_cents * (100 - campaign.discount_pct) / 100) for campaign.duration_months"
      - "increments Subscription.version by 1"
      - "Emit BillingEvent CHARGE for first discounted month"

  # --- Profiles ---
  - method: POST
    path: "/v1/profiles"
    description: "Create a profile on an account"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 201
    input: [account_id, display_name, is_kids, household_id]
    output: Profile
    side_effects: ["profile_status=ACTIVE"]
  - method: GET
    path: "/v1/profiles"
    description: "List profiles (filterable)"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: ["account_id?", "profile_status?", "household_id?"]
    output: Profile[]
    side_effects: []
  - method: GET
    path: "/v1/profiles/{id}"
    description: "Get profile"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: []
    output: Profile
    side_effects: []
  - method: POST
    path: "/v1/profiles/{id}/deactivate"
    description: "Deactivate a profile"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Profile
    side_effects: ["profile_status=DEACTIVATED"]
  - method: POST
    path: "/v1/profiles/{id}/reactivate"
    description: "Reactivate a profile; enforces plan limits"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Profile
    side_effects: ["profile_status=ACTIVE"]

  # --- Subscriptions ---
  - method: POST
    path: "/v1/subscriptions"
    description: "Create a new subscription on an account"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 201
    input: [account_id, plan_id, "content_id?", "channel?"]
    output: Subscription
    side_effects:
      - "subscription_status=TRIALING when plan.trial_days > 0 else ACTIVE"
      - "billing_state=CURRENT"
      - "Creates SignupAttribution row keyed to new subscription (cohort_month derived from created_at)"
      - "Sets account.active_subscription_id"
  - method: GET
    path: "/v1/subscriptions"
    description: "List subscriptions"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: ["account_id?", "subscription_status?", "plan_id?", "billing_state?", "pending_plan_id?", "save_offer_id?", "signup_attribution_id?", "price_change_notice_id?"]
    output: Subscription[]
    side_effects: []
  - method: GET
    path: "/v1/subscriptions/{id}"
    description: "Get subscription"
    roles: [PlatformAdmin, SupportAgent, PartnerBillingOps, Subscriber]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/v1/subscriptions/{id}/cancel"
    description: "Cancel a subscription (user or support initiated)"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: [cancel_reason]
    output: Subscription
    side_effects: ["subscription_status=CANCELLED; presented save offers → SUPERSEDED"]
  - method: POST
    path: "/v1/subscriptions/{id}/pause"
    description: "Direct pause (no save offer) — subject to 12-month cooldown"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: [duration_months]
    output: Subscription
    side_effects: ["subscription_status=PAUSED; paused_until_utc set; PRORATION_CREDIT event posted"]
  - method: POST
    path: "/v1/subscriptions/{id}/resume"
    description: "Resume a paused subscription"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: Subscription
    side_effects: ["subscription_status=ACTIVE; prorated CHARGE event posted"]
  - method: POST
    path: "/v1/subscriptions/{id}/recover"
    description: "Recover from dunning with a replacement payment method"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: [payment_method_token]
    output: Subscription
    side_effects: ["subscription_status PAST_DUE→ACTIVE; billing_state DUNNING→RECOVERED; dunning_attempt_count=0; RECOVERY event"]
  - method: POST
    path: "/v1/subscriptions/{id}/change-plan"
    description: "Change plan (upgrade applies immediately with proration; downgrade scheduled)"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: [target_plan_id, expected_subscription_version]
    output: Subscription
    side_effects:
      - "UPGRADE: plan_id := target_plan_id; proration_on_upgrade computed; grandfathered_price_cents cleared"
      - "DOWNGRADE: pending_plan_id := target_plan_id (effective at next period boundary)"
      - "increments Subscription.version by 1"
  - method: GET
    path: "/v1/subscriptions/{id}/proration-preview"
    description: "Compute optimistic proration preview for a hypothetical plan change"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 200
    input: [target_plan_id]
    output: { net_charge_cents: integer, unused_credit_cents: integer, prorated_charge_cents: integer }
    side_effects: []

  # --- Save offers ---
  - method: POST
    path: "/v1/save-offers"
    description: "Present a save offer to a subscriber (typically triggered by cancel intent)"
    roles: [Subscriber, PlatformAdmin, SupportAgent]
    code: 201
    input: [subscription_id, offer_type, "discount_pct?", "discount_duration_months?", "target_plan_id?"]
    output: SaveOffer
    side_effects: ["offer_status=PRESENTED; expires_at_utc = presented_at_utc + 72h"]
  - method: GET
    path: "/v1/save-offers"
    description: "List save offers"
    roles: [PlatformAdmin, SupportAgent, Subscriber]
    code: 200
    input: ["subscription_id?", "offer_status?", "offer_type?", "account_id?", "target_plan_id?"]
    output: SaveOffer[]
    side_effects: []
  - method: GET
    path: "/v1/save-offers/{id}"
    description: "Get save offer"
    roles: [PlatformAdmin, SupportAgent, Subscriber]
    code: 200
    input: []
    output: SaveOffer
    side_effects: []
  - method: POST
    path: "/v1/save-offers/{id}/accept"
    description: "Accept a save offer"
    roles: [Subscriber]
    code: 200
    input: []
    output: SaveOffer
    side_effects: ["offer_status=ACCEPTED; side effects per offer_type on Subscription"]
  - method: POST
    path: "/v1/save-offers/{id}/decline"
    description: "Decline a save offer"
    roles: [Subscriber]
    code: 200
    input: []
    output: SaveOffer
    side_effects: ["offer_status=DECLINED"]

  # --- Billing events ---
