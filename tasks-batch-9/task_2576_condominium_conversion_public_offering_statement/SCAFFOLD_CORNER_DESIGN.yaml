              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { mc_id: "$.data.id" }
            - call: "POST /engineering-reports/${er_id}/submit"
              payload: {}
              as: LicensedEngineer
              as_user_id: "eng-1"
            - call: "POST /major-components/${mc_id}/verification"
