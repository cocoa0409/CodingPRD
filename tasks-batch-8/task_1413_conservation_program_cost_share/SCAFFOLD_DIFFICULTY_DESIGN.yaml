  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: pool_exact_fit_obligation_boundary
        grounds:
          - calculations.pool_available
          - validations[priority=11]
          - errors[ERR_POOL_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Metric = pool available cents, exercised on TWO fund-committing
          endpoints: obligate (360000 == available succeeds) and modification
          approve ADD_PRACTICE (150000 == 150000 succeeds; 300 > 0 fails with
          ERR_POOL_INSUFFICIENT_FUNDS). Fit predicate pinned as <=; a failed
          approval leaves the contract MODIFICATION_PENDING.
        test_recipe:
          setup:
            - "Program A: pool exactly 360000, HU applicant, FENCE 1000 item scheduled exactly 360000. Program B: pool 359999, same item economics (one-cent shortfall)."
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "PA", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { proga: $.data.id } }
            - { call: "POST /eqip/programs/${proga}/pools", payload: { pool_type: "HU_LIMITED_RESOURCE", allocated_cents: 360000 }, as: ProgramAdmin, captures: { poola: $.data.id } }
            - { call: "POST /eqip/programs/${proga}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${proga}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${proga}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "H U", hu_category: "LIMITED_RESOURCE", parcel_ids: ["P-200", "P-201"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${proga}", applicant_id: "${a1}", parcel_id: "P-200", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { appa: $.data.id } }
            - { call: "POST /eqip/applications/${appa}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appa}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${proga}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${proga}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appa}" }, as: ConservationPlanner, captures: { cona: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner }
            - { call: "POST /eqip/programs", payload: { program_name: "PB", fiscal_year: 2026, state_code: "NE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { progb: $.data.id } }
            - { call: "POST /eqip/programs/${progb}/pools", payload: { pool_type: "GENERAL", allocated_cents: 450000 }, as: ProgramAdmin, captures: { poolb: $.data.id } }
            - { call: "POST /eqip/programs/${progb}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${progb}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${progb}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${progb}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applications", payload: { program_id: "${progb}", applicant_id: "${a1}", parcel_id: "P-201", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 30 } }, as: Applicant, as_user_id: "${a1}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${progb}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${progb}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appb}" }, as: ConservationPlanner, captures: { conb: $.data.id } }
            - { call: "POST /eqip/contracts/${conb}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner }
          trigger:
            - { call: "POST /eqip/contracts/${cona}/obligate", payload: {}, as: ProgramAdmin, captures: { sta: $.data.status } }
            - { call: "GET /eqip/pools/${poola}", payload: {}, as: ProgramAdmin, captures: { availa: $.data.available_cents, obliga: $.data.obligated_cents } }
            - { call: "POST /eqip/contracts/${conb}/obligate", payload: {}, as: ProgramAdmin, captures: { stb: $.data.status } }
            - { call: "POST /eqip/contracts/${conb}/modifications", payload: { kind: "ADD_PRACTICE", new_practice_code: "COVER_CROP", new_quantity: 10, new_deadline: "2027-03-01T00:00:00Z" }, as: Applicant, as_user_id: "${a1}", captures: { modb1: $.data.id } }
            - { call: "GET /eqip/contracts/${conb}", payload: {}, as: ProgramAdmin, captures: { vb1: $.data.version } }
            - { call: "POST /eqip/modifications/${modb1}/approve", payload: { expected_contract_version: "${vb1}" }, as: ProgramAdmin, captures: { modb1_st: $.data.status } }
            - { call: "GET /eqip/pools/${poolb}", payload: {}, as: ProgramAdmin, captures: { availb1: $.data.available_cents } }
            - { call: "POST /eqip/contracts/${conb}/modifications", payload: { kind: "ADD_PRACTICE", new_practice_code: "FENCE", new_quantity: 1, new_deadline: "2027-03-01T00:00:00Z" }, as: Applicant, as_user_id: "${a1}", captures: { modb2: $.data.id } }
            - { call: "GET /eqip/contracts/${conb}", payload: {}, as: ProgramAdmin, captures: { vb2: $.data.version } }
            - { call: "POST /eqip/modifications/${modb2}/approve", payload: { expected_contract_version: "${vb2}" }, as: ProgramAdmin, captures: { errb: $.data.error_id } }
          assert:
            - "exact fit succeeds at obligate: sta == OBLIGATED; obliga == 360000; availa == 0 (360000 <= 360000 passes — predicate is <=)"
            - "program B: stb == OBLIGATED (300000 against pool 450000, avail 150000)"
            - "ADD_PRACTICE exact fit succeeds: modb1_st == APPROVED (COVER_CROP 10 ac = 150000 <= 150000); availb1 == 0"
            - "over by the smallest quantum fails: errb == ERR_POOL_INSUFFICIENT_FUNDS (FENCE 1 ft = 300 > 0 available)"
            - "failed approve is atomic: contract ${conb} remains MODIFICATION_PENDING and modb2 remains REQUESTED (no partial pool mutation)"
      - name: advance_cap_exact_50pct_boundary
        grounds:
          - calculations.advance_cap
          - errors[ERR_ADVANCE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric = advance amount as percent of scheduled (round_half_up(0.5 x
          360000) = 180000); endpoint = POST /eqip/contracts/{id}/advance-payments
          (distinct from obligate above). Exactly 180000 succeeds; 180001 fails.
        test_recipe:
          setup:
            - "Two HU contracts (same LIMITED_RESOURCE applicant, parcels P-200/P-201) each with FENCE 1000 item, scheduled 360000, OBLIGATED; HU pool 1000000"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", advance_cap_pct: 0.5 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "HU_LIMITED_RESOURCE", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "H U", hu_category: "LIMITED_RESOURCE", parcel_ids: ["P-200", "P-201"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-200", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 30 } }, as: Applicant, as_user_id: "${a1}", captures: { appa: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-201", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 20 } }, as: Applicant, as_user_id: "${a1}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications/${appa}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appa}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30 } }, as: ConservationPlanner }
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 20 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appa}" }, as: ConservationPlanner, captures: { cona: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { ita: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appb}" }, as: ConservationPlanner, captures: { conb: $.data.id } }
            - { call: "POST /eqip/contracts/${conb}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { itb: $.data.id } }
            - { call: "POST /eqip/contracts/${conb}/obligate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/contracts/${cona}/advance-payments", payload: { practice_item_id: "${ita}", issued_cents: 180000 }, as: PaymentOfficer, captures: { adva: $.data.id, adva_due: $.data.expenditure_due_date, adva_st: $.data.status } }
            - { call: "POST /eqip/contracts/${conb}/advance-payments", payload: { practice_item_id: "${itb}", issued_cents: 180001 }, as: PaymentOfficer, captures: { errb: $.data.error_id } }
          assert:
            - "exact cap succeeds: adva_st == ISSUED; pool paid_cents == 180000 after issuance"
            - "cap + 1 cent fails: errb == ERR_ADVANCE_CAP_EXCEEDED (180001 > round_half_up(0.5*360000) = 180000)"
            - "adva_due == 2026-10-30T00:00:00Z (no clock-set in chain -> issued at default 2026-08-01T00:00:00Z + 90 days)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_request_requires_item_certified
        grounds:
          - state_machines.PaymentRequest
          - errors[ERR_ITEM_NOT_CERTIFIED]
        distinguishing_aspect: |
          Entity pair = PaymentRequest -> ContractPracticeItem. Creating a
          payment request while the item is merely INSTALLED fails with
          ERR_ITEM_NOT_CERTIFIED; after certification the same payload succeeds.
        test_recipe:
          setup:
            - "Contract OBLIGATED; FENCE item (1000 ft, scheduled 300000) INSTALLED but not certified"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
