      - "CareAssignment rows are re-pointed in place (status stays ACTIVE, shift_assignment_id and staff_id change)"
      - "LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH for encounters left short"
    side_effects: ["calc care_assignment_unit_debit re-price on every moved row, calc staff_capacity_units, calc unit_posture_derivation, calc cesarean_readiness_derivation; increments both shift versions, each moved assignment, each affected encounter and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_SHIFT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_RELIEVING_SHIFT_INELIGIBLE, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_STAFF_ACUITY_CAPACITY_EXCEEDED]

