# =============================================================================
# Task 2137 — Spare Parts Planning & Aftermarket Support (OEM aftermarket division)
# Scaffold seed tables §1.0–§1.7
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2137. Spare Parts Planning & Aftermarket Support
  (OEM aftermarket division): installed-base registry & part applicability, criticality
  classification & stocking policy, obsolescence & last-time-buy decision, price uplift &
  aftermarket margin rules, emergency air-freight vs stock decision, dealer/distributor
  allocation, return & restocking fee, forecast from service work orders

domain_name: spare-parts-aftermarket
api_prefix: /aftermarket

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # PartApplicability is a true many-to-many junction between Part and EquipmentModel
  # carrying its own build-revision interval; Part.superseded_by_part_id is a
  # self-referential edge forming a supersession chain that must stay acyclic.

  state_machine_shape: branching
  # Individual machines are deliberately heterogeneous:
  #   Part                  -> branching with revert (PHASE_OUT -> ACTIVE) and a SUPERSEDED side-branch
  #   LastTimeBuyCampaign   -> cyclic (SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED, revision_index++)
  #   ReplenishmentOrder    -> parallel dimensions (approval_status x logistics_status)
  #   ReturnAuthorization   -> branching fork with divergent side-effect sets (CREDITED vs SCRAPPED)
  #   ServiceWorkOrder      -> cyclic (OPEN -> PARTS_PENDING -> OPEN)
  #   WorkOrderPartLine     -> branching with a BACKORDERED -> RESERVED revert edge
  #   AllocationRequest     -> branching (GRANTED / PARTIALLY_GRANTED / DENIED / WITHDRAWN)

  relationship_patterns:
    - one_to_many
    - many_to_many        # PartApplicability junction (Part x EquipmentModel)
    - self_referential    # Part.superseded_by_part_id
    - cross_aggregate     # WorkOrderPartLine -> Part stock ledger; AllocationRequest -> Dealer installed base

  role_model: segregation_of_duties
  # An InventoryController who submitted an LTB campaign may not approve it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 63 endpoints / 45 errors / 7 calculations / 7 state machines.
  # Density, not volume, is the point: every one of the eight named subsystems reads
  # state written by at least two of the others.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "OEM part number; unique across Part", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Human readable part description" }
      - { name: lifecycle_state, type: enum, source: system, default: ACTIVE, description: "Obsolescence lifecycle position", constraints: "ACTIVE | PHASE_OUT | LTB_OPEN | LTB_CLOSED | OBSOLETE | SUPERSEDED" }
      - { name: superseded_by_part_id, type: string, source: system, default: null, description: "FK -> Part.id; self-referential successor edge, non-null only while lifecycle_state == SUPERSEDED" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed acquisition cost of one unit, in cents", constraints: ">= 1" }
      - { name: lead_time_days, type: integer, source: input, description: "Standard (non-air) replenishment lead time in whole days", constraints: ">= 0" }
      - { name: weight_kg, type: number, source: input, description: "Shipping weight of one unit in kilograms", constraints: "> 0" }
      - { name: hazmat, type: boolean, source: input, default: false, description: "True when the part is classified dangerous goods and may not move by air" }
      - { name: max_stock_units, type: integer, source: input, default: 0, description: "Target maximum on-hand position used by STOCK_TO_MAX / MIN_MAX auto-replenishment", constraints: ">= 0" }
      - { name: criticality_score, type: number, source: computed, default: 0, description: "Output of calculations.part_criticality_and_stocking_policy, 2 decimal places" }
      - { name: criticality_class, type: enum, source: computed, default: DESIRABLE, description: "Criticality band derived from criticality_score", constraints: "VITAL | ESSENTIAL | DESIRABLE" }
      - { name: stocking_policy, type: enum, source: computed, default: MAKE_TO_ORDER, description: "Stocking rule derived from criticality_class and the CURRENT 12-month forecast", constraints: "STOCK_TO_MAX | MIN_MAX | MAKE_TO_ORDER | NO_STOCK" }
      - { name: safety_stock_units, type: integer, source: computed, default: 0, description: "Buffer stock target, recomputed by POST /aftermarket/parts/{id}/classify" }
      - { name: reorder_point_units, type: integer, source: computed, default: 0, description: "available_units at or below which auto-replenishment fires" }
      - { name: on_hand_units, type: integer, source: system, default: 0, description: "Physical sellable units in the aftermarket warehouse" }
      - { name: allocated_units, type: integer, source: system, default: 0, description: "Units reserved against WorkOrderPartLine rows in line_status == RESERVED" }
      - { name: quarantine_units, type: integer, source: system, default: 0, description: "Units physically received back from dealers but not yet inspected" }
      - { name: in_transit_units, type: integer, source: system, default: 0, description: "Units on approved ReplenishmentOrder rows whose logistics_status == IN_TRANSIT" }
      - { name: available_units, type: integer, source: computed, description: "= on_hand_units - allocated_units" }
      - { name: replenishment_status, type: enum, source: computed, default: NORMAL, description: "Evaluated in this pinned order after every stock or classification change: (1) ON_ORDER when at least one ReplenishmentOrder on this part has approval_status != REJECTED AND logistics_status != RECEIVED; (2) otherwise BELOW_REORDER_POINT when reorder_point_units > 0 AND available_units <= reorder_point_units; (3) otherwise NORMAL. An unclassified part has reorder_point_units 0 and therefore reads NORMAL.", constraints: "NORMAL | BELOW_REORDER_POINT | ON_ORDER" }
      - { name: current_list_unit_price_cents, type: integer, source: computed, default: 0, description: "LIST variant of calculations.aftermarket_price_uplift for one unit at the part's current lifecycle_state and criticality_class" }
      - { name: current_effective_uplift_pct, type: number, source: computed, default: 0, description: "effective_uplift_pct used to derive current_list_unit_price_cents, 4 decimal places" }

  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "OEM model code", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Marketing name of the machine model" }
      - { name: production_end_date, type: datetime, source: input, description: "ISO 8601 UTC instant at which serial production stopped" }
      - { name: support_end_date, type: datetime, source: input, description: "ISO 8601 UTC instant at which contractual aftermarket support ends" }

  - name: InstalledUnit
    parent: EquipmentModel
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> EquipmentModel.id" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; the dealer holding the service contract for this machine" }
      - { name: serial_number, type: string, source: input, description: "Machine serial number", constraints: "unique" }
      - { name: build_revision, type: integer, source: input, description: "Engineering build revision stamped at assembly; drives part applicability", constraints: ">= 0" }
      - { name: commission_date, type: datetime, source: input, description: "ISO 8601 UTC instant the machine entered service" }
      - { name: region, type: enum, source: input, description: "Service region", constraints: "NA | EU | APAC | LATAM" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE machines count toward installed-base forecasting; DECOMMISSIONED ones do not", constraints: "ACTIVE | DECOMMISSIONED" }

  - name: PartApplicability
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: model_id, type: string, source: input, description: "FK -> EquipmentModel.id" }
      - { name: effective_from_build_revision, type: integer, source: input, description: "Lowest build_revision this part fits, inclusive", constraints: ">= 0" }
      - { name: effective_to_build_revision, type: integer, source: input, default: null, description: "Highest build_revision this part fits, inclusive; null means unbounded (+infinity)" }
      - { name: qty_per_unit, type: integer, source: input, description: "Quantity of this part installed on one machine of this model", constraints: ">= 1" }
      - { name: applicability_status, type: enum, source: system, default: ACTIVE, description: "WITHDRAWN rows are ignored by the overlap check, by applicability validation, and by installed-base forecasting", constraints: "ACTIVE | WITHDRAWN" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Distributor code", constraints: "unique" }
      - { name: tier, type: enum, source: input, description: "Commercial tier driving allocation priority", constraints: "PLATINUM | GOLD | SILVER" }
      - { name: region, type: enum, source: input, description: "Primary service region", constraints: "NA | EU | APAC | LATAM" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted outstanding_balance_cents before a credit hold applies", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: system, default: 0, description: "Open aftermarket receivable; may go negative when credits exceed charges" }
      - { name: lifetime_restocking_fee_cents, type: integer, source: system, default: 0, description: "Cumulative restocking fees retained from this dealer's returns" }
      - { name: lifetime_rebate_cents, type: integer, source: system, default: 0, description: "Cumulative loyalty rebates granted back to this dealer on returns" }
      - { name: credit_hold, type: boolean, source: computed, default: false, description: "= outstanding_balance_cents > credit_limit_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "SUSPENDED dealers are excluded from the LTB allocation candidate set", constraints: "ACTIVE | SUSPENDED" }

  - name: ServiceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: installed_unit_id, type: string, source: input, description: "FK -> InstalledUnit.id" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; copied from InstalledUnit.dealer_id at creation" }
      - { name: work_type, type: enum, source: input, description: "Nature of the job", constraints: "SCHEDULED_MAINTENANCE | BREAKDOWN | CAMPAIGN" }
      - { name: downtime_priority, type: enum, source: input, description: "Machine impact class used by the air-freight decision and by criticality scoring", constraints: "MACHINE_DOWN | DEGRADED | PLANNED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Work order lifecycle", constraints: "OPEN | PARTS_PENDING | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock instant at creation" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at close; drives the forecast lookback window" }

  - name: WorkOrderPartLine
    parent: ServiceWorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> ServiceWorkOrder.id" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: qty_requested, type: integer, source: input, description: "Units requested for the job", constraints: ">= 1" }
      - { name: qty_consumed, type: integer, source: system, default: 0, description: "Units actually fitted; set at consume" }
      - { name: line_status, type: enum, source: system, default: REQUESTED, description: "Line lifecycle", constraints: "REQUESTED | RESERVED | BACKORDERED | CONSUMED | CANCELLED" }
      - { name: fulfillment_mode, type: enum, source: computed, description: "Output of calculations.emergency_air_freight_decision", constraints: "STOCK | AIR_FREIGHT | BACKORDER" }
      - { name: decision_net_benefit_cents, type: integer, source: computed, default: 0, description: "downtime_cost_cents - air_freight_cost_cents at line creation" }
      - { name: freight_cost_cents, type: integer, source: computed, default: 0, description: "air_freight_cost_cents when fulfillment_mode == AIR_FREIGHT, else 0" }
      - { name: effective_uplift_pct, type: number, source: computed, description: "Uplift used for this line, 4 decimal places" }
      - { name: list_unit_price_cents, type: integer, source: computed, description: "LIST variant: per-unit price rounded once, then multiplied by qty_requested" }
      - { name: list_line_total_cents, type: integer, source: computed, description: "= list_unit_price_cents * qty_requested" }
      - { name: quoted_line_total_cents, type: integer, source: computed, description: "QUOTE variant: extended cost multiplied by the uplift, rounded once at line level" }
      - { name: variant_delta_cents, type: integer, source: computed, description: "= list_line_total_cents - quoted_line_total_cents; the dual-variant divergence" }
      - { name: margin_pct, type: number, source: computed, description: "= (quoted_line_total_cents - unit_cost_cents * qty_requested) / quoted_line_total_cents, 4 decimal places" }
      - { name: charged_amount_cents, type: integer, source: system, default: 0, description: "Amount actually posted to Dealer.outstanding_balance_cents at consume" }
      - { name: consumed_at, type: datetime, source: system, default: null, description: "Logical-clock instant at consume; return-window age is measured from here" }

  - name: DemandForecast
    parent: Part
    common_fields: true
    fields:
      - { name: part_id, type: string, source: system, description: "FK -> Part.id" }
      - { name: horizon_months, type: integer, source: input, description: "Forecast horizon; 12 is the horizon consumed by criticality classification and LTB sizing", constraints: "one of 12 | 24 | 60" }
      - { name: lookback_days, type: integer, source: input, default: 365, description: "Width of the closed-work-order history window", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "Forecast algorithm variant", constraints: "WORK_ORDER_HISTORY | INSTALLED_BASE_RATE | BLENDED" }
      - { name: wo_history_units, type: integer, source: computed, description: "Sum of qty_consumed over qualifying CONSUMED lines in the lookback window" }
      - { name: annualized_wo_units, type: number, source: computed, description: "= wo_history_units * 365 / lookback_days, 2 decimal places" }
      - { name: installed_base_units, type: integer, source: computed, description: "Count of ACTIVE InstalledUnit rows covered by an ACTIVE PartApplicability for this part" }
      - { name: ib_rate_units, type: number, source: computed, description: "= installed_base_units * qty_per_unit * ANNUAL_REPLACEMENT_RATE, 2 decimal places" }
      - { name: forecast_units, type: integer, source: computed, description: "Final annualized unit demand for the selected method, ceiling-rounded" }
      - { name: forecast_status, type: enum, source: system, default: CURRENT, description: "Creating a forecast supersedes the prior CURRENT forecast of the same part and horizon_months", constraints: "CURRENT | SUPERSEDED" }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock instant at computation" }

  - name: LastTimeBuyCampaign
    parent: Part
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: method, type: enum, source: input, description: "Lifetime-buy sizing variant", constraints: "DEMAND_DECAY | FLAT_RATE" }
      - { name: coverage_years, type: integer, source: input, description: "Number of years of post-obsolescence demand the buy must cover", constraints: ">= 1 and <= 15" }
      - { name: ltb_window_start, type: datetime, source: input, description: "Inclusive start of the supplier buy window (ISO 8601 UTC)" }
      - { name: ltb_window_end, type: datetime, source: input, description: "Exclusive end of the supplier buy window (ISO 8601 UTC)" }
      - { name: annual_demand_units, type: integer, source: computed, description: "forecast_units of the part's CURRENT 12-month DemandForecast, snapshotted at creation" }
      - { name: proposed_qty, type: integer, source: computed, description: "Output of calculations.ltb_lifetime_buy_quantity under the selected method" }
      - { name: approved_qty, type: integer, source: system, default: 0, description: "Quantity the InventoryController actually authorised" }
      - { name: remaining_qty, type: integer, source: system, default: 0, description: "Unallocated part of approved_qty" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Campaign lifecycle", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | ALLOCATING | CLOSED | CANCELLED" }
      - { name: revision_index, type: integer, source: system, default: 0, description: "Increments on every REJECTED -> DRAFT revise cycle" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the submitter; segregation of duties compares it to the approver" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the approver" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Free text captured at reject" }

  - name: AllocationRequest
    parent: LastTimeBuyCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> LastTimeBuyCampaign.id" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: requested_units, type: integer, source: input, description: "Units the dealer asks to reserve out of approved_qty", constraints: ">= 1" }
      - { name: granted_units, type: integer, source: system, default: 0, description: "Units actually awarded by the allocation run" }
      - { name: priority_score, type: integer, source: computed, default: 0, description: "Ranking value from calculations.dealer_allocation_waterfall, snapshotted at allocation time" }
      - { name: dealer_installed_units, type: integer, source: computed, default: 0, description: "Count of this dealer's ACTIVE InstalledUnit rows covered by an ACTIVE PartApplicability for the campaign's part, snapshotted at allocation time" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Request lifecycle", constraints: "PENDING | GRANTED | PARTIALLY_GRANTED | DENIED | WITHDRAWN" }

  - name: ReplenishmentOrder
    parent: Part
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: order_type, type: enum, source: input, description: "STOCK is the routine sea/ground buy; EMERGENCY_AIR is the expedited buy", constraints: "STOCK | EMERGENCY_AIR" }
      - { name: qty, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Part.unit_cost_cents snapshotted at creation" }
      - { name: freight_cost_cents, type: integer, source: computed, description: "0 for STOCK; air_freight_cost_cents from calculations.emergency_air_freight_decision for EMERGENCY_AIR" }
      - { name: total_landed_cost_cents, type: integer, source: computed, description: "= unit_cost_cents * qty + freight_cost_cents" }
      - { name: approval_status, type: enum, source: system, default: PENDING, description: "Approval dimension, independent of logistics_status", constraints: "PENDING | APPROVED | REJECTED" }
      - { name: logistics_status, type: enum, source: system, default: NOT_STARTED, description: "Physical movement dimension, independent of approval_status", constraints: "NOT_STARTED | IN_TRANSIT | RECEIVED" }
      - { name: auto_generated, type: boolean, source: system, default: false, description: "True when created by the reorder-point cascade rather than by an operator" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: work_order_part_line_id, type: string, source: input, description: "FK -> WorkOrderPartLine.id; the consumed line being returned against" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; copied from the line" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; copied from the line's work order" }
      - { name: qty_returned, type: integer, source: input, description: "Units being returned", constraints: ">= 1" }
      - { name: return_reason, type: enum, source: input, description: "Drives the base restocking fee percentage", constraints: "WRONG_PART | UNUSED_SURPLUS | DEFECTIVE | CORE_RETURN" }
      - { name: age_days, type: integer, source: computed, description: "Whole days from the line's consumed_at to the logical clock at RMA creation, floored" }
      - { name: gross_credit_cents, type: integer, source: computed, description: "Pro-rated share of the line's charged_amount_cents for qty_returned" }
      - { name: fee_pct, type: number, source: computed, description: "Total restocking fee percentage after cap, 4 decimal places" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "= round_half_up(gross_credit_cents * fee_pct)" }
      - { name: net_before_rebate_cents, type: integer, source: computed, description: "= gross_credit_cents - restocking_fee_cents, floored at 0" }
      - { name: rebate_pct, type: number, source: computed, description: "Loyalty rebate percentage keyed on net_before_rebate_cents, 4 decimal places" }
      - { name: loyalty_rebate_cents, type: integer, source: computed, description: "= round_half_up(net_before_rebate_cents * rebate_pct)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "= net_before_rebate_cents + loyalty_rebate_cents; posted to the dealer only at CREDITED" }
      - { name: credit_posted_cents, type: integer, source: system, default: 0, description: "Amount actually deducted from Dealer.outstanding_balance_cents at CREDITED/SCRAPPED; equals final_credit_cents on the RESTOCK branch and on the SCRAP branch only when return_reason == DEFECTIVE, otherwise 0" }
      - { name: disposition, type: enum, source: system, default: null, description: "Inspection outcome", constraints: "RESTOCK | SCRAP" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "RMA lifecycle", constraints: "REQUESTED | APPROVED | REJECTED | RECEIVED | CREDITED | SCRAPPED" }

  - name: AftermarketPriceRule
    parent: null
    common_fields: true
    fields:
      - { name: criticality_class, type: enum, source: input, description: "Criticality band this rule prices; at most one ACTIVE rule per class", constraints: "VITAL | ESSENTIAL | DESIRABLE" }
      - { name: base_uplift_pct, type: number, source: input, description: "Uplift over unit_cost_cents before lifecycle scarcity, 4 decimal places", constraints: ">= 0" }
      - { name: max_uplift_pct, type: number, source: input, description: "Hard ceiling applied after scarcity uplift is added", constraints: ">= base_uplift_pct" }
      - { name: min_margin_pct, type: number, source: input, description: "Minimum acceptable line margin; a quote below this is rejected", constraints: ">= 0 and < 1" }
      - { name: rule_status, type: enum, source: system, default: ACTIVE, description: "Only ACTIVE rules are selected when pricing", constraints: "ACTIVE | RETIRED" }

  - name: StockLedgerEntry
    parent: Part
    common_fields: false
    fields:
      - { name: part_id, type: string, source: system, description: "FK -> Part.id" }
      - { name: entry_type, type: enum, source: system, description: "Movement class", constraints: "RECEIPT | ISSUE | RETURN_RECEIPT | SCRAP" }
      - { name: delta_units, type: integer, source: system, description: "Signed change to (on_hand_units + quarantine_units); positive for RECEIPT and RETURN_RECEIPT, negative for ISSUE and SCRAP" }
      - { name: balance_after_units, type: integer, source: system, description: "Part.on_hand_units + Part.quarantine_units immediately after this entry" }
      - { name: source_ref_type, type: enum, source: system, description: "Polymorphic origin discriminator - not a declared foreign key", constraints: "REPLENISHMENT_ORDER | WORK_ORDER_PART_LINE | RETURN_AUTHORIZATION" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic id of the originating row, interpreted per source_ref_type; not a declared foreign key" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock instant of the movement" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Part -----
  - entity: Part
    initial_state: ACTIVE
    terminal_states: [OBSOLETE, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: PHASE_OUT
        trigger: "POST /aftermarket/parts/{id}/phase-out"
        actor: AftermarketPlanner
        preconditions:
          - "Part.lifecycle_state == ACTIVE"
        side_effects:
          - "recompute Part.current_effective_uplift_pct and Part.current_list_unit_price_cents via calculations.aftermarket_price_uplift with SCARCITY_UPLIFT_PCT[PHASE_OUT]"
          - "re-quote every WorkOrderPartLine on this part whose line_status IN {REQUESTED, RESERVED, BACKORDERED}: effective_uplift_pct, list_unit_price_cents, list_line_total_cents, quoted_line_total_cents, variant_delta_cents, margin_pct"
          - "increments Part.version by 1"

      - from: PHASE_OUT
        to: ACTIVE
        trigger: "POST /aftermarket/parts/{id}/reinstate"
        actor: AftermarketPlanner
        preconditions:
          - "Part.lifecycle_state == PHASE_OUT"
          - "no LastTimeBuyCampaign with campaign.part_id == Part.id and campaign.status IN {SUBMITTED, APPROVED, ALLOCATING} exists"
        side_effects:
          - "recompute Part.current_effective_uplift_pct and Part.current_list_unit_price_cents with SCARCITY_UPLIFT_PCT[ACTIVE] = 0"
          - "re-quote every WorkOrderPartLine on this part whose line_status IN {REQUESTED, RESERVED, BACKORDERED}"
          - "increments Part.version by 1"
        note: "Revert edge — makes the Part machine branching-with-revert rather than linear."

      - from: PHASE_OUT
        to: LTB_OPEN
        trigger: "system — cascade hop 2 of LastTimeBuyCampaign SUBMITTED -> APPROVED"
        actor: system
        preconditions:
          - "Part.lifecycle_state == PHASE_OUT"
        side_effects:
          - "recompute Part.current_effective_uplift_pct and Part.current_list_unit_price_cents with SCARCITY_UPLIFT_PCT[LTB_OPEN] = 0.08 (cascade hop 3, caused by this state change)"
          - "re-quote every WorkOrderPartLine on this part whose line_status IN {REQUESTED, RESERVED, BACKORDERED} (cascade hop 4, caused by hop 3)"
          - "increments Part.version by 1"

      - from: LTB_OPEN
        to: LTB_CLOSED
        trigger: "system — cascade of LastTimeBuyCampaign ALLOCATING -> CLOSED"
        actor: system
        preconditions:
          - "Part.lifecycle_state == LTB_OPEN"
        side_effects:
          - "recompute Part.current_effective_uplift_pct and Part.current_list_unit_price_cents with SCARCITY_UPLIFT_PCT[LTB_CLOSED] = 0.15"
          - "re-quote every WorkOrderPartLine on this part whose line_status IN {REQUESTED, RESERVED, BACKORDERED}"
          - "increments Part.version by 1"

      - from: LTB_CLOSED
        to: OBSOLETE
        trigger: "POST /aftermarket/parts/{id}/obsolete"
        actor: AftermarketPlanner
        preconditions:
          - "Part.lifecycle_state == LTB_CLOSED"
        side_effects:
          - "Part.stocking_policy = NO_STOCK; Part.safety_stock_units = 0; Part.reorder_point_units = 0"
          - "every ReplenishmentOrder on this part with approval_status == PENDING moves to approval_status REJECTED"
          - "recompute Part.current_list_unit_price_cents with SCARCITY_UPLIFT_PCT[OBSOLETE] = 0.15"
          - "increments Part.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /aftermarket/parts/{id}/supersede"
        actor: AftermarketPlanner
        preconditions:
          - "Part.lifecycle_state IN {ACTIVE, PHASE_OUT}"
          - "successor Part exists and successor.lifecycle_state != OBSOLETE (a successor that is itself SUPERSEDED is legal — supersession chains A -> B -> C are normal catalogue practice, which is what makes the acyclicity check below non-vacuous)"
          - "walking successor.superseded_by_part_id transitively never reaches Part.id (acyclic supersession chain)"
        side_effects:
          - "Part.superseded_by_part_id = successor_part_id"
          - "Part.stocking_policy = NO_STOCK"
          - "every WorkOrderPartLine on this part with line_status IN {REQUESTED, BACKORDERED} moves to CANCELLED; every line with line_status == RESERVED moves to CANCELLED and releases Part.allocated_units by that line's qty_requested"
          - "increments Part.version by 1"

      - from: PHASE_OUT
        to: SUPERSEDED
        trigger: "POST /aftermarket/parts/{id}/supersede"
        actor: AftermarketPlanner
        preconditions:
          - "Part.lifecycle_state IN {ACTIVE, PHASE_OUT}"
          - "successor Part exists and successor.lifecycle_state != OBSOLETE (a successor that is itself SUPERSEDED is legal — supersession chains A -> B -> C are normal catalogue practice, which is what makes the acyclicity check below non-vacuous)"
          - "walking successor.superseded_by_part_id transitively never reaches Part.id"
        side_effects:
          - "same side-effect set as the ACTIVE -> SUPERSEDED edge"
          - "increments Part.version by 1"

  # ----------------------------------------------- LastTimeBuyCampaign -------
  - entity: LastTimeBuyCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CANCELLED
        trigger: "system — a newer DRAFT campaign is created on the same Part via POST /aftermarket/last-time-buy-campaigns"
        actor: system
        preconditions:
          - "LastTimeBuyCampaign.status == DRAFT"
          - "the newly created campaign has the same part_id"
        side_effects:
          - "the superseded campaign's remaining_qty and approved_qty stay 0 (a DRAFT never held allocation)"
        note: "This supersede semantics is exactly why the create endpoint carries OCC on Part.version — see §1.2.1."

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/submit"
        actor: AftermarketPlanner | InventoryController
        preconditions:
          - "LastTimeBuyCampaign.status == DRAFT"
          - "Part.lifecycle_state == PHASE_OUT"
          - "no other LastTimeBuyCampaign on the same part with status IN {SUBMITTED, APPROVED, ALLOCATING} whose [ltb_window_start, ltb_window_end) interval collides under validations priority 16 / 17"
        side_effects:
          - "LastTimeBuyCampaign.submitted_by_user_id = X-User-ID of the caller"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/approve"
        actor: InventoryController
        preconditions:
          - "LastTimeBuyCampaign.status == SUBMITTED"
          - "X-User-ID != LastTimeBuyCampaign.submitted_by_user_id (segregation of duties)"
          - "approved_qty >= 1"
        side_effects:
          - "cascade hop 1: LastTimeBuyCampaign.approved_qty = approved_qty; remaining_qty = approved_qty; approved_by_user_id = X-User-ID"
          - "cascade hop 2 (caused by hop 1): Part.lifecycle_state PHASE_OUT -> LTB_OPEN"
          - "cascade hop 3 (caused by hop 2): Part.current_effective_uplift_pct and Part.current_list_unit_price_cents recomputed at SCARCITY_UPLIFT_PCT[LTB_OPEN] = 0.08"
          - "cascade hop 4 (caused by hop 3): every WorkOrderPartLine on that part with line_status IN {REQUESTED, RESERVED, BACKORDERED} is re-quoted — effective_uplift_pct, list_unit_price_cents, list_line_total_cents, quoted_line_total_cents, variant_delta_cents and margin_pct all change"
          - "increments Part.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/reject"
        actor: InventoryController
        preconditions:
          - "LastTimeBuyCampaign.status == SUBMITTED"
          - "X-User-ID != LastTimeBuyCampaign.submitted_by_user_id"
        side_effects:
          - "LastTimeBuyCampaign.rejection_reason = rejection_reason from the request body"
          - "Part.lifecycle_state is left unchanged at PHASE_OUT"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/revise"
        actor: AftermarketPlanner
        preconditions:
          - "LastTimeBuyCampaign.status == REJECTED"
        side_effects:
          - "LastTimeBuyCampaign.revision_index += 1"
          - "submitted_by_user_id = null; rejection_reason = null"
          - "annual_demand_units re-snapshotted from the part's CURRENT 12-month DemandForecast and proposed_qty recomputed via calculations.ltb_lifetime_buy_quantity"
        note: "Cycle edge: DRAFT -> SUBMITTED -> REJECTED -> DRAFT. Makes this machine cyclic."

      - from: APPROVED
        to: ALLOCATING
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/allocate"
        actor: InventoryController
        preconditions:
          - "LastTimeBuyCampaign.status == APPROVED"
          - "at least one AllocationRequest with campaign_id == this campaign, status == PENDING, and whose Dealer.status == ACTIVE exists"
        side_effects:
          - "calculations.dealer_allocation_waterfall runs; each eligible AllocationRequest receives granted_units, priority_score and dealer_installed_units"
          - "each eligible AllocationRequest moves PENDING -> GRANTED (granted_units == requested_units), PENDING -> PARTIALLY_GRANTED (0 < granted_units < requested_units) or PENDING -> DENIED (granted_units == 0)"
          - "every AllocationRequest on this campaign whose Dealer.status == SUSPENDED moves PENDING -> DENIED with granted_units 0"
          - "LastTimeBuyCampaign.remaining_qty = approved_qty - sum of granted_units over requests now in {GRANTED, PARTIALLY_GRANTED}"
          - "increments LastTimeBuyCampaign.version by 1"

      - from: ALLOCATING
        to: CLOSED
        trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/close"
        actor: InventoryController
        preconditions:
          - "LastTimeBuyCampaign.status == ALLOCATING"
        side_effects:
          - "every AllocationRequest on this campaign with status == PENDING moves to DENIED"
          - "Part.lifecycle_state LTB_OPEN -> LTB_CLOSED, which itself recomputes the part price and re-quotes open lines"
          - "increments Part.version by 1"

  # ------------------------------------------------- AllocationRequest -------
  - entity: AllocationRequest
    initial_state: PENDING
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "system — allocation run of POST /aftermarket/last-time-buy-campaigns/{id}/allocate"
        actor: system
        preconditions:
          - "granted_units computed by the waterfall equals requested_units"
        side_effects:
          - "AllocationRequest.granted_units, priority_score and dealer_installed_units are stamped"

      - from: PENDING
        to: PARTIALLY_GRANTED
        trigger: "system — allocation run"
        actor: system
        preconditions:
          - "0 < granted_units < requested_units"
        side_effects:
          - "AllocationRequest.granted_units, priority_score and dealer_installed_units are stamped"

      - from: PENDING
        to: DENIED
        trigger: "system — allocation run, or campaign ALLOCATING -> CLOSED"
        actor: system
        preconditions:
          - "granted_units == 0 after the waterfall, or Dealer.status == SUSPENDED, or the campaign closed while the request was still PENDING"
        side_effects:
          - "AllocationRequest.granted_units stays 0"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /aftermarket/allocation-requests/{id}/withdraw, or system supersede when the same dealer creates a newer AllocationRequest on the same campaign"
        actor: DealerUser | AftermarketPlanner | system
        preconditions:
          - "AllocationRequest.status == PENDING"
        side_effects:
          - "no change to LastTimeBuyCampaign.remaining_qty (granted_units was 0)"

      - from: GRANTED
        to: WITHDRAWN
        trigger: "POST /aftermarket/allocation-requests/{id}/withdraw"
        actor: DealerUser | AftermarketPlanner
        preconditions:
          - "AllocationRequest.status IN {GRANTED, PARTIALLY_GRANTED}"
          - "LastTimeBuyCampaign.status == ALLOCATING"
        side_effects:
          - "LastTimeBuyCampaign.remaining_qty += AllocationRequest.granted_units"
          - "AllocationRequest.granted_units = 0"
          - "increments LastTimeBuyCampaign.version by 1"
        note: "Compensating edge for the allocation waterfall — conserves the campaign entitlement quantity."

      - from: PARTIALLY_GRANTED
        to: WITHDRAWN
        trigger: "POST /aftermarket/allocation-requests/{id}/withdraw"
        actor: DealerUser | AftermarketPlanner
        preconditions:
          - "AllocationRequest.status IN {GRANTED, PARTIALLY_GRANTED}"
          - "LastTimeBuyCampaign.status == ALLOCATING"
        side_effects:
          - "LastTimeBuyCampaign.remaining_qty += AllocationRequest.granted_units"
          - "AllocationRequest.granted_units = 0"
          - "increments LastTimeBuyCampaign.version by 1"

  # ------------------------------------------------ ReplenishmentOrder -------
  # Parallel state dimensions on one row: approval_status evolves independently
  # of logistics_status; only the NOT_STARTED -> IN_TRANSIT edge is guarded by
  # the other dimension.
  - entity: ReplenishmentOrder
    initial_state: "approval_status=PENDING, logistics_status=NOT_STARTED"
    terminal_states: ["approval_status=REJECTED", "logistics_status=RECEIVED"]
    transitions:
      - from: "approval_status=PENDING"
        to: "approval_status=APPROVED"
        trigger: "POST /aftermarket/replenishment-orders/{id}/approve"
        actor: InventoryController
        preconditions:
          - "ReplenishmentOrder.approval_status == PENDING"
          - "Part.lifecycle_state != OBSOLETE"
        side_effects:
          - "logistics_status is untouched and stays NOT_STARTED"

      - from: "approval_status=PENDING"
        to: "approval_status=REJECTED"
        trigger: "POST /aftermarket/replenishment-orders/{id}/reject"
        actor: InventoryController
        preconditions:
          - "ReplenishmentOrder.approval_status == PENDING"
          - "ReplenishmentOrder.logistics_status == NOT_STARTED"
        side_effects:
          - "Part.replenishment_status recomputed; if available_units <= reorder_point_units and no other non-rejected ReplenishmentOrder exists it returns to BELOW_REORDER_POINT"

      - from: "logistics_status=NOT_STARTED"
        to: "logistics_status=IN_TRANSIT"
        trigger: "POST /aftermarket/replenishment-orders/{id}/ship"
        actor: InventoryController
        preconditions:
          - "ReplenishmentOrder.logistics_status == NOT_STARTED"
          - "ReplenishmentOrder.approval_status == APPROVED (cross-dimension guard)"
        side_effects:
          - "Part.in_transit_units += ReplenishmentOrder.qty"
          - "Part.replenishment_status = ON_ORDER"
          - "increments Part.version by 1"

      - from: "logistics_status=IN_TRANSIT"
        to: "logistics_status=RECEIVED"
        trigger: "POST /aftermarket/replenishment-orders/{id}/receive"
        actor: InventoryController
        preconditions:
          - "ReplenishmentOrder.logistics_status == IN_TRANSIT"
          - "Part.lifecycle_state != OBSOLETE"
        side_effects:
          - "Part.in_transit_units -= ReplenishmentOrder.qty; Part.on_hand_units += ReplenishmentOrder.qty"
          - "one StockLedgerEntry appended: entry_type RECEIPT, delta_units = +qty, balance_after_units = Part.on_hand_units + Part.quarantine_units, source_ref_type REPLENISHMENT_ORDER"
          - "Part.available_units recomputed; Part.replenishment_status recomputed"
          - "promotion sweep: BACKORDERED WorkOrderPartLine rows on this part are walked once in the order defined by calculations.backorder_promotion_order; a line is promoted to RESERVED only when Part.available_units >= line.qty_requested at the moment it is considered, otherwise it is skipped and the sweep continues; each promotion raises Part.allocated_units by that line's qty_requested"
          - "any ServiceWorkOrder that no longer has a BACKORDERED line moves PARTS_PENDING -> OPEN"
          - "increments Part.version by 1"

  # -------------------------------------------------- ServiceWorkOrder -------
  - entity: ServiceWorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PARTS_PENDING
        trigger: "system — POST /aftermarket/work-orders/{id}/part-lines creates a line whose fulfillment_mode IN {AIR_FREIGHT, BACKORDER}"
        actor: system
        preconditions:
          - "ServiceWorkOrder.status == OPEN"
        side_effects:
          - "the new WorkOrderPartLine enters line_status BACKORDERED"

      - from: PARTS_PENDING
        to: OPEN
        trigger: "system — the last WorkOrderPartLine on this work order in line_status BACKORDERED leaves that status (promoted to RESERVED, or CANCELLED)"
        actor: system
        preconditions:
          - "ServiceWorkOrder.status == PARTS_PENDING"
          - "count of WorkOrderPartLine rows on this work order with line_status == BACKORDERED becomes 0"
        side_effects: []
        note: "Cycle edge: OPEN -> PARTS_PENDING -> OPEN. Makes this machine cyclic."

      - from: OPEN
        to: CLOSED
        trigger: "POST /aftermarket/work-orders/{id}/close"
        actor: DealerUser
        preconditions:
          - "ServiceWorkOrder.status == OPEN"
          - "no WorkOrderPartLine on this work order has line_status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "ServiceWorkOrder.closed_at = the logical clock instant"
          - "the work order's CONSUMED lines become eligible inputs to calculations.forecast_from_work_orders"

  # ------------------------------------------------- WorkOrderPartLine -------
  - entity: WorkOrderPartLine
    initial_state: REQUESTED
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "system — evaluated inside POST /aftermarket/work-orders/{id}/part-lines when calculations.emergency_air_freight_decision yields STOCK"
        actor: system
        preconditions:
          - "Part.available_units >= qty_requested"
        side_effects:
          - "Part.allocated_units += qty_requested; Part.available_units recomputed"
          - "increments Part.version by 1"

      - from: REQUESTED
        to: BACKORDERED
        trigger: "system — evaluated inside POST /aftermarket/work-orders/{id}/part-lines when the decision yields AIR_FREIGHT or BACKORDER"
        actor: system
        preconditions:
          - "Part.available_units < qty_requested"
        side_effects:
          - "ServiceWorkOrder.status OPEN -> PARTS_PENDING"
          - "when fulfillment_mode == AIR_FREIGHT, one ReplenishmentOrder is auto-created with order_type EMERGENCY_AIR, qty = qty_requested, auto_generated = true, approval_status PENDING, logistics_status NOT_STARTED, freight_cost_cents = the line's freight_cost_cents"

      - from: BACKORDERED
        to: RESERVED
        trigger: "system — promotion sweep after ReplenishmentOrder logistics_status IN_TRANSIT -> RECEIVED"
        actor: system
        preconditions:
          - "Part.available_units >= qty_requested at the moment this line is considered by calculations.backorder_promotion_order"
        side_effects:
          - "Part.allocated_units += qty_requested"
          - "ServiceWorkOrder may move PARTS_PENDING -> OPEN when no BACKORDERED line remains"
        note: "Revert edge back into the reserved branch — the line machine is not a linear pipeline."

      - from: RESERVED
        to: CONSUMED
        trigger: "POST /aftermarket/work-order-part-lines/{id}/consume"
        actor: DealerUser
        preconditions:
          - "WorkOrderPartLine.line_status == RESERVED"
          - "1 <= qty_consumed <= qty_requested"
          - "ServiceWorkOrder.status == OPEN"
          - "Dealer.credit_hold == false"
        side_effects:
          - "cascade hop 1: qty_consumed stored; consumed_at = logical clock; Part.allocated_units -= qty_requested; Part.on_hand_units -= qty_consumed; one StockLedgerEntry appended with entry_type ISSUE, delta_units = -qty_consumed"
          - "charged_amount_cents = round_half_up(Part.unit_cost_cents * qty_consumed * (1 + effective_uplift_pct)); Dealer.outstanding_balance_cents += charged_amount_cents; Dealer.credit_hold recomputed"
          - "cascade hop 2 (caused by hop 1): Part.available_units recomputed; when it falls to or below Part.reorder_point_units, Part.replenishment_status NORMAL -> BELOW_REORDER_POINT"
          - "cascade hop 3 (caused by hop 2): when Part.stocking_policy IN {STOCK_TO_MAX, MIN_MAX} and Part.replenishment_status == BELOW_REORDER_POINT, one ReplenishmentOrder is auto-created with order_type STOCK, auto_generated = true, qty = max(1, Part.max_stock_units - Part.available_units - Part.in_transit_units), approval_status PENDING, logistics_status NOT_STARTED — and Part.replenishment_status then reads ON_ORDER"
          - "increments Part.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /aftermarket/work-order-part-lines/{id}/cancel"
        actor: DealerUser
        preconditions:
          - "WorkOrderPartLine.line_status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects: []

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /aftermarket/work-order-part-lines/{id}/cancel"
        actor: DealerUser
        preconditions:
          - "WorkOrderPartLine.line_status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "Part.allocated_units -= qty_requested; Part.available_units recomputed"
          - "increments Part.version by 1"

      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /aftermarket/work-order-part-lines/{id}/cancel"
        actor: DealerUser
        preconditions:
          - "WorkOrderPartLine.line_status IN {REQUESTED, RESERVED, BACKORDERED}"
        side_effects:
          - "ServiceWorkOrder moves PARTS_PENDING -> OPEN when no BACKORDERED line remains"

  # ----------------------------------------------- ReturnAuthorization -------
  # Branching fork at RECEIVED with two divergent side-effect sets.
  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDITED, SCRAPPED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /aftermarket/return-authorizations/{id}/approve"
        actor: AftermarketPlanner
        preconditions:
          - "ReturnAuthorization.status == REQUESTED"
        side_effects: []

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /aftermarket/return-authorizations/{id}/reject"
        actor: AftermarketPlanner
        preconditions:
          - "ReturnAuthorization.status == REQUESTED"
        side_effects:
          - "no stock movement, no ledger entry, Dealer.outstanding_balance_cents unchanged"

      - from: APPROVED
        to: RECEIVED
        trigger: "POST /aftermarket/return-authorizations/{id}/receive"
        actor: AftermarketPlanner
        preconditions:
          - "ReturnAuthorization.status == APPROVED"
        side_effects:
          - "Part.quarantine_units += qty_returned"
          - "one StockLedgerEntry appended: entry_type RETURN_RECEIPT, delta_units = +qty_returned, source_ref_type RETURN_AUTHORIZATION"
          - "increments Part.version by 1"

      - from: RECEIVED
        to: CREDITED
        trigger: "POST /aftermarket/return-authorizations/{id}/inspect with disposition RESTOCK"
        actor: AftermarketPlanner
        preconditions:
          - "ReturnAuthorization.status == RECEIVED"
          - "Part.lifecycle_state != OBSOLETE"
        side_effects:
          - "ReturnAuthorization.disposition = RESTOCK"
          - "Part.quarantine_units -= qty_returned; Part.on_hand_units += qty_returned; NO StockLedgerEntry is appended (on_hand + quarantine is unchanged by this move)"
          - "ReturnAuthorization.credit_posted_cents = final_credit_cents; Dealer.outstanding_balance_cents -= final_credit_cents; Dealer.lifetime_restocking_fee_cents += restocking_fee_cents; Dealer.lifetime_rebate_cents += loyalty_rebate_cents; Dealer.credit_hold recomputed"
          - "Part.available_units and Part.replenishment_status recomputed"
          - "increments Part.version by 1"

      - from: RECEIVED
        to: SCRAPPED
        trigger: "POST /aftermarket/return-authorizations/{id}/inspect with disposition SCRAP"
        actor: AftermarketPlanner
        preconditions:
          - "ReturnAuthorization.status == RECEIVED"
        side_effects:
          - "ReturnAuthorization.disposition = SCRAP"
          - "Part.quarantine_units -= qty_returned; Part.on_hand_units is NOT increased"
          - "one StockLedgerEntry appended: entry_type SCRAP, delta_units = -qty_returned, source_ref_type RETURN_AUTHORIZATION"
          - "conditional credit: when return_reason == DEFECTIVE the dealer is still made whole — credit_posted_cents = final_credit_cents and Dealer.outstanding_balance_cents / lifetime_restocking_fee_cents / lifetime_rebate_cents are updated exactly as on the RESTOCK branch; for every other return_reason credit_posted_cents = 0 and no dealer field changes"
          - "increments Part.version by 1"
        note: "Divergent branch: RESTOCK writes stock and always credits and emits no ledger row; SCRAP writes a negative ledger row, never restores on_hand, and credits only for DEFECTIVE."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: ltb-campaign-create-stale-part
    parent_entity: Part
    write_endpoint: "POST /aftermarket/last-time-buy-campaigns"
    occ_field: "expected_part_version"
    description: |
      Creating a LastTimeBuyCampaign against a Part whose version has advanced since
      the client last read it is rejected with a stale-version conflict. The check is
      needed because a successful create legitimately supersedes any existing DRAFT
      campaign on the same part (moving it to CANCELLED), so a client working from an
      out-of-date view of the part would silently destroy a draft it never saw.
    error_id: ERR_STALE_PART_VERSION
    http_status: 412

  - rule_id: allocation-request-create-stale-campaign
    parent_entity: LastTimeBuyCampaign
    write_endpoint: "POST /aftermarket/allocation-requests"
    occ_field: "expected_campaign_version"
    description: |
      Creating an AllocationRequest against a LastTimeBuyCampaign whose version has
      advanced since the client last read it is rejected with a stale-version conflict.
      A successful create legitimately supersedes the same dealer's prior PENDING
      request on that campaign (moving it to WITHDRAWN), and the campaign's version also
      advances whenever the allocation waterfall runs or a grant is withdrawn, so an
      out-of-date view of the campaign must not be allowed to write.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------- C1 ------
  - name: forecast_from_work_orders
    trigger: "POST /aftermarket/parts/{id}/forecasts"
    algorithm: weighted_scoring
    formula: |
      # ---- work-order history leg -------------------------------------------
      # Input set (all three filters are mandatory):
      #   WorkOrderPartLine rows with part_id == Part.id AND line_status == CONSUMED,
      #   whose parent ServiceWorkOrder.status == CLOSED,
      #   whose parent ServiceWorkOrder.closed_at falls in the HALF-OPEN window
      #     ( now - lookback_days , now ]   i.e. closed_at > now - lookback_days
      #                                      AND closed_at <= now
      #   where `now` is the logical clock at the moment of the request.
      #   A work order closed EXACTLY at (now - lookback_days) is EXCLUDED.
      wo_history_units = sum of qty_consumed over that input set        # integer
      annualized_wo_units = round_half_up(wo_history_units * 365 / lookback_days, 2)

      # ---- installed-base leg -----------------------------------------------
      # Input set: InstalledUnit rows with status == ACTIVE whose model_id is covered
      # by a PartApplicability row with part_id == Part.id, applicability_status == ACTIVE,
      # and effective_from_build_revision <= InstalledUnit.build_revision
      # and (effective_to_build_revision IS NULL OR InstalledUnit.build_revision <= effective_to_build_revision).
      installed_base_units = count of that input set
      # qty_per_unit is taken from the single covering ACTIVE PartApplicability row.
      # When two ACTIVE rows could cover the same unit the create-time overlap check
      # (validations priority 15) has already made that impossible.
      ib_rate_units = round_half_up(installed_base_units * qty_per_unit * ANNUAL_REPLACEMENT_RATE, 2)

      # ---- method selection --------------------------------------------------
      if method == "WORK_ORDER_HISTORY":  raw = annualized_wo_units
      if method == "INSTALLED_BASE_RATE": raw = ib_rate_units
      if method == "BLENDED":             raw = round_half_up(BLEND_WEIGHT_WO * annualized_wo_units
                                                              + (1 - BLEND_WEIGHT_WO) * ib_rate_units, 2)
      forecast_units = ceil(raw)          # single ceiling, applied last
    input_set: "CONSUMED lines on CLOSED work orders inside the half-open lookback window; ACTIVE installed units covered by an ACTIVE applicability row"
    constants:
      ANNUAL_REPLACEMENT_RATE: 0.20
      BLEND_WEIGHT_WO: 0.60
      DEFAULT_LOOKBACK_DAYS: 365
    precision: "annualized_wo_units / ib_rate_units / raw: 2 decimal places, round_half_up. forecast_units: ceiling of raw, applied exactly once."
    variants:
      - name: WORK_ORDER_HISTORY
        when: "method == WORK_ORDER_HISTORY"
        difference: "Ignores the installed base entirely; a part with heavy field consumption but a small fleet forecasts high."
      - name: INSTALLED_BASE_RATE
        when: "method == INSTALLED_BASE_RATE"
        difference: "Ignores consumption history entirely; a newly launched part with zero closed work orders still forecasts non-zero."
      - name: BLENDED
        when: "method == BLENDED"
        difference: "60/40 weighting of the two legs; for identical data it lands strictly between the other two variants."
    note: |
      Creating a forecast marks the prior DemandForecast for the same (part_id, horizon_months)
      pair as forecast_status SUPERSEDED, so exactly one CURRENT row exists per pair.
      When method == WORK_ORDER_HISTORY and the input set is empty, the request is rejected
      with ERR_FORECAST_INPUT_EMPTY rather than producing a zero forecast.

  # ---------------------------------------------------------------- C2 ------
  - name: part_criticality_and_stocking_policy
    trigger: "POST /aftermarket/parts/{id}/classify"
    algorithm: weighted_scoring
    formula: |
      # F = the part's CURRENT DemandForecast with horizon_months == 12.
      # If no such row exists the request is rejected with ERR_FORECAST_INPUT_EMPTY.
      demand_score = min(DEMAND_SCORE_CAP, F.forecast_units * DEMAND_UNITS_MULTIPLIER)

      # Downtime input set: WorkOrderPartLine rows with part_id == Part.id and
      # line_status == CONSUMED whose parent ServiceWorkOrder.status == CLOSED and whose
      # closed_at falls in the SAME half-open window ( now - F.lookback_days , now ].
      # The ratio counts LINES, not units.
      total_lines = count of that input set
      down_lines  = count of that input set whose parent ServiceWorkOrder.downtime_priority == "MACHINE_DOWN"
      downtime_score = 0 if total_lines == 0 else round_half_up(DOWNTIME_SCORE_MAX * down_lines / total_lines, 2)

      lead_time_score = 20 if Part.lead_time_days >= LEAD_TIME_LONG_DAYS
                        else 12 if Part.lead_time_days >= LEAD_TIME_MED_DAYS
                        else 5
      coverage_score  = 10 if F.installed_base_units >= COVERAGE_HIGH_UNITS
                        else 6 if F.installed_base_units >= COVERAGE_MED_UNITS
                        else 2

      criticality_score = round_half_up(demand_score + downtime_score + lead_time_score + coverage_score, 2)

      criticality_class = "VITAL"      if criticality_score >= VITAL_THRESHOLD
                          else "ESSENTIAL" if criticality_score >= ESSENTIAL_THRESHOLD
                          else "DESIRABLE"

      stocking_policy = "NO_STOCK"      if F.forecast_units == 0
                        else "STOCK_TO_MAX" if criticality_class == "VITAL"
                        else "MIN_MAX"      if criticality_class == "ESSENTIAL"
                        else "MAKE_TO_ORDER"

      # Rounding order is PINNED: daily_demand is NEVER rounded; each ceil is applied
      # exactly once, at the very end of its own expression.
      daily_demand = F.forecast_units / 365                       # unrounded rational
      service_factor = SERVICE_FACTOR[criticality_class]
      safety_stock_units  = ceil(daily_demand * Part.lead_time_days * service_factor)
      reorder_point_units = safety_stock_units + ceil(daily_demand * Part.lead_time_days)
      # NOTE: reorder_point is safety_stock + ceil(cycle demand); it is NOT
      # ceil(daily_demand * lead_time_days * (service_factor + 1)).
    input_set: "the single CURRENT 12-month DemandForecast plus CONSUMED lines on CLOSED work orders in that forecast's lookback window"
    constants:
      DEMAND_SCORE_CAP: 40
      DEMAND_UNITS_MULTIPLIER: 2
      DOWNTIME_SCORE_MAX: 30
      LEAD_TIME_LONG_DAYS: 60
      LEAD_TIME_MED_DAYS: 30
      COVERAGE_HIGH_UNITS: 4
      COVERAGE_MED_UNITS: 2
      VITAL_THRESHOLD: 70
      ESSENTIAL_THRESHOLD: 40
      SERVICE_FACTOR: { VITAL: 1.65, ESSENTIAL: 1.28, DESIRABLE: 0.84 }
    precision: "criticality_score and downtime_score: 2 decimal places, round_half_up. Class thresholds use >= (a score of exactly 70.00 is VITAL; 69.99 is ESSENTIAL)."

  # ---------------------------------------------------------------- C3 ------
  - name: aftermarket_price_uplift
    trigger: "POST /aftermarket/work-orders/{id}/part-lines; GET /aftermarket/parts/{id}/price-quote; every re-quote side effect of a Part lifecycle_state change; PATCH /aftermarket/parts/{id}; POST /aftermarket/parts/{id}/classify"
    algorithm: tiered_pricing
    formula: |
      # R = the single AftermarketPriceRule with rule_status == ACTIVE and
      #     criticality_class == Part.criticality_class.
      #     If none exists the request is rejected with ERR_PRICE_RULE_NOT_FOUND.
      scarcity = SCARCITY_UPLIFT_PCT[Part.lifecycle_state]
      effective_uplift_pct = round_half_up(min(R.max_uplift_pct, R.base_uplift_pct + scarcity), 4)

      # ---- VARIANT "LIST": round per unit, THEN multiply -----------------------
      list_unit_price_cents = round_half_up(Part.unit_cost_cents * (1 + effective_uplift_pct))
      list_line_total_cents = list_unit_price_cents * qty

      # ---- VARIANT "QUOTE": multiply the extended cost, THEN round once --------
      quoted_line_total_cents = round_half_up(Part.unit_cost_cents * qty * (1 + effective_uplift_pct))

      variant_delta_cents = list_line_total_cents - quoted_line_total_cents
      # The rounding ORDER is pinned per consumer and the two orders DO diverge:
      #   the money a dealer is charged is ALWAYS the QUOTE variant;
      #   the catalogue price shown per unit is ALWAYS the LIST variant.

      margin_pct = round_half_up((quoted_line_total_cents - Part.unit_cost_cents * qty)
                                 / quoted_line_total_cents, 4)
      # Rejected with ERR_MARGIN_FLOOR_BREACH when margin_pct < R.min_margin_pct.

      # Part-level catalogue fields use qty = 1:
      Part.current_effective_uplift_pct = effective_uplift_pct
      Part.current_list_unit_price_cents = round_half_up(Part.unit_cost_cents * (1 + effective_uplift_pct))
    input_set: "the one ACTIVE AftermarketPriceRule matching Part.criticality_class, plus Part.lifecycle_state and Part.unit_cost_cents"
    constants:
      SCARCITY_UPLIFT_PCT:
        ACTIVE: 0.00
        PHASE_OUT: 0.04
        LTB_OPEN: 0.08
        LTB_CLOSED: 0.15
        OBSOLETE: 0.15
        SUPERSEDED: 0.00
    precision: "effective_uplift_pct and margin_pct: 4 decimal places, round_half_up. All cents values: integers, round_half_up."
    note: "When no ACTIVE AftermarketPriceRule matches the part's criticality_class, a CASCADED re-price (triggered by a lifecycle_state change rather than by a client request) is a no-op: current_effective_uplift_pct and current_list_unit_price_cents keep their existing values and no error is raised. ERR_PRICE_RULE_NOT_FOUND is raised only on the client-facing endpoints listed in validations priority 14."
    variants:
      - name: LIST
        when: "catalogue display and Part.current_list_unit_price_cents"
        difference: "Rounds to whole cents at the UNIT level first, then multiplies by qty. For unit_cost 1333, uplift 0.35, qty 7 this yields 1800 * 7 = 12600."
      - name: QUOTE
        when: "WorkOrderPartLine.quoted_line_total_cents and every amount actually posted to a dealer"
        difference: "Multiplies the extended cost by the uplift and rounds ONCE at line level. Same inputs yield 12597 — a 3-cent divergence from LIST, and the sign of the divergence flips with the uplift (at uplift 0.43 LIST is 13342 and QUOTE is 13343)."

  # ---------------------------------------------------------------- C4 ------
  - name: emergency_air_freight_decision
    trigger: "POST /aftermarket/work-orders/{id}/part-lines; POST /aftermarket/replenishment-orders when order_type == EMERGENCY_AIR"
    algorithm: threshold
    formula: |
      # Four inputs interact non-linearly: stock position, downtime class, part weight
      # and dealer tier. Evaluation order is pinned top to bottom; the FIRST matching
      # branch wins and later branches are not evaluated.
      expected_wait_days = 0 if Part.available_units >= qty
                           else Part.lead_time_days

      downtime_cost_cents = DOWNTIME_RATE_CENTS_PER_DAY[ServiceWorkOrder.downtime_priority]
                            * expected_wait_days

      billable_kg = ceil(Part.weight_kg * qty)          # ceiling to whole kilograms
      raw_air_cents = billable_kg * AIR_RATE_CENTS_PER_KG + AIR_HANDLING_FEE_CENTS
      if Part.hazmat: raw_air_cents = raw_air_cents + HAZMAT_SURCHARGE_CENTS
      air_freight_cost_cents = max(AIR_MIN_CHARGE_CENTS, raw_air_cents)

      decision_net_benefit_cents = downtime_cost_cents - air_freight_cost_cents

      # branch 1 — stock on the shelf always wins
      if Part.available_units >= qty:                       fulfillment_mode = "STOCK"
      # branch 2 — an obsolete part is never expedited, whatever the arithmetic says
      elif Part.lifecycle_state == "OBSOLETE":              fulfillment_mode = "BACKORDER"
      # branch 3 — contractual override, independent of decision_net_benefit_cents
      elif Dealer.tier == "PLATINUM"
           and ServiceWorkOrder.downtime_priority == "MACHINE_DOWN":
                                                            fulfillment_mode = "AIR_FREIGHT"
      # branch 4 — STRICTLY greater than the threshold; exactly equal does NOT expedite
      elif decision_net_benefit_cents > AIR_APPROVAL_THRESHOLD_CENTS:
                                                            fulfillment_mode = "AIR_FREIGHT"
      else:                                                 fulfillment_mode = "BACKORDER"

      freight_cost_cents = air_freight_cost_cents if fulfillment_mode == "AIR_FREIGHT" else 0
    input_set: "Part.available_units / weight_kg / hazmat / lead_time_days / lifecycle_state, the parent ServiceWorkOrder.downtime_priority, and the owning Dealer.tier"
    constants:
      DOWNTIME_RATE_CENTS_PER_DAY: { MACHINE_DOWN: 250000, DEGRADED: 60000, PLANNED: 0 }
      AIR_RATE_CENTS_PER_KG: 2000
      AIR_HANDLING_FEE_CENTS: 10000
      AIR_MIN_CHARGE_CENTS: 45000
      HAZMAT_SURCHARGE_CENTS: 30000
      AIR_APPROVAL_THRESHOLD_CENTS: 100000
    precision: "All cents values are integers. billable_kg uses ceil, applied once. The threshold comparison is strict >, so a net benefit of exactly 100000 does NOT expedite."
    note: "When fulfillment_mode resolves to AIR_FREIGHT and Part.hazmat is true, the request is rejected with ERR_HAZMAT_AIR_PROHIBITED — the surcharge is still added first, because it can be what pushes the decision below the threshold."

  # ---------------------------------------------------------------- C5 ------
  - name: ltb_lifetime_buy_quantity
    trigger: "POST /aftermarket/last-time-buy-campaigns; POST /aftermarket/last-time-buy-campaigns/{id}/revise"
    algorithm: forward_looking
    formula: |
      # annual_demand_units is snapshotted from the part's CURRENT 12-month DemandForecast.
      # If no such forecast exists the request is rejected with ERR_FORECAST_INPUT_EMPTY.
      annual_demand_units = F12.forecast_units
      cover = Part.on_hand_units + Part.in_transit_units      # what the shelf already covers

      # ---- VARIANT "DEMAND_DECAY" -------------------------------------------
      # Per-year demand decays; each YEAR is rounded to whole units BEFORE summing.
      decay_total = sum over y in 1..coverage_years of
                        round_half_up(annual_demand_units * (DECAY_FACTOR ** (y - 1)))
      proposed_qty = max(0, decay_total - cover)

      # ---- VARIANT "FLAT_RATE" ----------------------------------------------
      proposed_qty = max(0, annual_demand_units * coverage_years - cover)
    input_set: "the part's single CURRENT 12-month DemandForecast plus Part.on_hand_units and Part.in_transit_units at campaign creation / revise time"
    constants:
      DECAY_FACTOR: 0.85
      MAX_COVERAGE_YEARS: 15
    precision: "Each per-year decayed demand is rounded to a whole unit with round_half_up BEFORE the sum; the sum is never re-rounded. Floor of 0."
    variants:
      - name: DEMAND_DECAY
        when: "LastTimeBuyCampaign.method == DEMAND_DECAY"
        difference: "Assumes the fleet retires. annual_demand 10, coverage 5, cover 20 gives 10+9+7+6+5 = 37, proposed_qty 17."
      - name: FLAT_RATE
        when: "LastTimeBuyCampaign.method == FLAT_RATE"
        difference: "Assumes flat demand. Identical inputs give 10*5 - 20 = 30 — a 13-unit divergence from DEMAND_DECAY on the very same campaign row."

  # ---------------------------------------------------------------- C6 ------
  - name: dealer_allocation_waterfall
    trigger: "POST /aftermarket/last-time-buy-campaigns/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # ---- eligibility filter (explicit, no adjectives) ------------------------
      # candidates = AllocationRequest rows with campaign_id == campaign.id
      #              AND status == "PENDING"
      #              AND Dealer.status == "ACTIVE"
      # Requests whose Dealer.status == "SUSPENDED" are moved straight to DENIED and
      # are NOT candidates. If candidates is empty the run is rejected with
      # ERR_NO_ELIGIBLE_ALLOCATION_REQUESTS and the campaign stays in APPROVED.

      # ---- ranking expression --------------------------------------------------
      # dealer_installed_units = count of InstalledUnit rows with
      #     dealer_id == request.dealer_id AND status == "ACTIVE"
      #     AND covered by an ACTIVE PartApplicability for campaign's part
      #         (same coverage predicate as forecast_from_work_orders)
      tier_weight = TIER_WEIGHT[Dealer.tier]
      installed_weight = min(INSTALLED_WEIGHT_CAP, floor(dealer_installed_units / 2) * 3)
      credit_penalty = CREDIT_PENALTY if Dealer.credit_hold == true else 0
      priority_score = max(0, tier_weight + installed_weight - credit_penalty)   # integer

      # ---- sort key + tie-break (never uses id) --------------------------------
      # ORDER BY priority_score DESC, requested_units DESC, created_at ASC
      ordered = candidates sorted by that key

      # ---- pass 1: floored equal fair share ------------------------------------
      fair_share = floor(campaign.approved_qty * FAIR_SHARE_PCT / count(candidates))
      for each c in candidates: granted[c] = min(c.requested_units, fair_share)
      remaining = campaign.approved_qty - sum(granted)

      # ---- pass 2: strict waterfall down the sort order ------------------------
      for each c in ordered:
          take = min(c.requested_units - granted[c], remaining)
          granted[c] += take
          remaining  -= take

      # ---- outcome -------------------------------------------------------------
      # granted[c] == c.requested_units  -> GRANTED
      # 0 < granted[c] < requested_units -> PARTIALLY_GRANTED
      # granted[c] == 0                  -> DENIED
      campaign.remaining_qty = remaining
      # INVARIANT: campaign.approved_qty == campaign.remaining_qty
      #            + sum(granted_units over requests now in {GRANTED, PARTIALLY_GRANTED})
    input_set: "PENDING AllocationRequest rows on the campaign whose Dealer.status == ACTIVE"
    constants:
      TIER_WEIGHT: { PLATINUM: 50, GOLD: 30, SILVER: 10 }
      INSTALLED_WEIGHT_CAP: 30
      CREDIT_PENALTY: 20
      FAIR_SHARE_PCT: 0.50
    precision: "fair_share uses floor. priority_score is an integer floored at 0. Any units still unallocated after pass 2 stay in campaign.remaining_qty."

  # ---------------------------------------------------------------- C7 ------
  - name: return_restocking_fee_and_credit
    trigger: "POST /aftermarket/return-authorizations"
    algorithm: constraint_propagation
    formula: |
      # L = the WorkOrderPartLine named by work_order_part_line_id (line_status == CONSUMED).
      # STEP 1 — pro-rated gross credit off the amount actually charged.
      gross_credit_cents = round_half_up(L.charged_amount_cents * qty_returned / L.qty_consumed)

      # STEP 2 — age of the return, floored to whole days.
      age_days = floor((now - L.consumed_at) / 1 day)      # `now` is the logical clock

      # STEP 3 — fee percentage. Computed from the GROSS amount, before any rebate.
      base_fee_pct = BASE_FEE_PCT[return_reason]
      age_surcharge_pct = 0.00 if age_days <= AGE_TIER_1_DAYS
                          else 0.10 if age_days <= AGE_TIER_2_DAYS
                          else 0.25
      obsolete_surcharge_pct = 0.20 if Part.lifecycle_state IN {LTB_CLOSED, OBSOLETE} else 0.00
      fee_pct = round_half_up(min(RESTOCK_FEE_CAP_PCT,
                                  base_fee_pct + age_surcharge_pct + obsolete_surcharge_pct), 4)
      restocking_fee_cents = round_half_up(gross_credit_cents * fee_pct)

      # STEP 4 — net before rebate.
      net_before_rebate_cents = max(0, gross_credit_cents - restocking_fee_cents)

      # STEP 5 — loyalty rebate. This is the circular-looking hop: the rebate TIER is
      # keyed on net_before_rebate_cents (the STEP-4 value), NOT on the final credit that
      # the rebate itself produces. The evaluation order 1->2->3->4->5 is PINNED and the
      # tier is never re-opened after the rebate is added, even when the final credit
      # crosses into a higher tier.
      rebate_pct = 0.05 if net_before_rebate_cents >= REBATE_TIER_HIGH_CENTS
                   else 0.02 if net_before_rebate_cents >= REBATE_TIER_MID_CENTS
                   else 0.00
      loyalty_rebate_cents = round_half_up(net_before_rebate_cents * rebate_pct)
      final_credit_cents = net_before_rebate_cents + loyalty_rebate_cents
    input_set: "one CONSUMED WorkOrderPartLine, its Part.lifecycle_state at RMA creation time, and the logical clock"
    constants:
      BASE_FEE_PCT: { WRONG_PART: 0.00, UNUSED_SURPLUS: 0.15, DEFECTIVE: 0.00, CORE_RETURN: 0.00 }
      AGE_TIER_1_DAYS: 30
      AGE_TIER_2_DAYS: 90
      RETURN_WINDOW_DAYS: 180
      RESTOCK_FEE_CAP_PCT: 0.50
      REBATE_TIER_MID_CENTS: 200000
      REBATE_TIER_HIGH_CENTS: 500000
    precision: "fee_pct and rebate_pct: 4 decimal places, round_half_up. All cents values are integers, round_half_up, computed strictly in the pinned step order."
    note: |
      Money conservation for a consume + full-quantity RESTOCK return pair:
        Dealer.outstanding_balance_cents
          - Dealer.lifetime_restocking_fee_cents
          + Dealer.lifetime_rebate_cents
        returns to its pre-consume value exactly.

  # ---------------------------------------------------------------- C8 ------
  - name: backorder_promotion_order
    trigger: "system — after a ReplenishmentOrder moves logistics_status IN_TRANSIT -> RECEIVED"
    algorithm: chronological
    formula: |
      # Candidate set: WorkOrderPartLine rows with part_id == received order's part_id
      #                AND line_status == "BACKORDERED".
      # Sort key (all fields, no id anywhere):
      #   1. DOWNTIME_RANK[parent ServiceWorkOrder.downtime_priority] ASC
      #        (MACHINE_DOWN = 0, DEGRADED = 1, PLANNED = 2)
      #   2. WorkOrderPartLine.qty_requested ASC   (small jobs clear first)
      #   3. WorkOrderPartLine.created_at ASC      (final tie-break)
      # Greedy sweep, NOT best-fit: walk the sorted list once and promote a line only
      # when Part.available_units >= line.qty_requested at that moment; a line that does
      # not fit is SKIPPED and the sweep continues to the next line.
      for line in sorted(candidates):
          if Part.available_units >= line.qty_requested:
              line.line_status = "RESERVED"
              Part.allocated_units += line.qty_requested
      # Empty candidate set is a no-op, not an error.
    input_set: "BACKORDERED WorkOrderPartLine rows on the received part"
    constants:
      DOWNTIME_RANK: { MACHINE_DOWN: 0, DEGRADED: 1, PLANNED: 2 }
    precision: "Integer unit arithmetic only. The sweep is single-pass and order-sensitive: a larger MACHINE_DOWN line can be skipped while a smaller DEGRADED line behind it is promoted."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when X-User-Role == DealerUser, X-User-ID equals the dealer_id reachable from the target resource (ServiceWorkOrder.dealer_id, WorkOrderPartLine -> ServiceWorkOrder.dealer_id, AllocationRequest.dealer_id, ReturnAuthorization.dealer_id, or the dealer_id in the request body)"
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /aftermarket/work-orders, POST /aftermarket/work-orders/{id}/part-lines, POST /aftermarket/work-orders/{id}/close, POST /aftermarket/work-order-part-lines/{id}/consume, POST /aftermarket/work-order-part-lines/{id}/cancel, POST /aftermarket/allocation-requests, POST /aftermarket/allocation-requests/{id}/withdraw, POST /aftermarket/return-authorizations"

  - priority: 4
    category: auth
    check: "the approver / rejecter of a LastTimeBuyCampaign has an X-User-ID different from LastTimeBuyCampaign.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /aftermarket/last-time-buy-campaigns/{id}/approve, POST /aftermarket/last-time-buy-campaigns/{id}/reject"

  - priority: 5
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_PART_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_INSTALLED_UNIT_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_PART_LINE_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_ALLOCATION_REQUEST_NOT_FOUND | ERR_REPLENISHMENT_ORDER_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_APPLICABILITY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PART_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_DEALER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_INSTALLED_UNIT_NOT_FOUND | ERR_PART_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key"

  - priority: 7
    category: business_constraint
    check: "request body satisfies the endpoint's input schema — required fields present, enum members valid, integers within their declared constraints (qty >= 1, coverage_years between 1 and MAX_COVERAGE_YEARS, horizon_months in {12,24,60}, limit between 1 and 100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 8
    category: state
    check: "expected_part_version equals Part.version / expected_campaign_version equals LastTimeBuyCampaign.version (§1.2.1 OCC)"
    error_id: "ERR_STALE_PART_VERSION | ERR_STALE_CAMPAIGN_VERSION"
    http_status: 412
    applies_to: "POST /aftermarket/last-time-buy-campaigns, POST /aftermarket/allocation-requests"

  - priority: 9
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2, including the cross-dimension guard on ReplenishmentOrder ship and the cross-entity guards (campaign submit requires Part.lifecycle_state == PHASE_OUT; allocation-request create requires campaign.status == APPROVED; RMA create requires the line's line_status == CONSUMED; replenishment approve/receive require Part.lifecycle_state != OBSOLETE; RMA inspect with disposition RESTOCK requires Part.lifecycle_state != OBSOLETE)"
    error_id: "ERR_PART_LIFECYCLE_INVALID | ERR_CAMPAIGN_STATE_INVALID | ERR_ALLOCATION_STATE_INVALID | ERR_LINE_STATE_INVALID | ERR_WORK_ORDER_STATE_INVALID | ERR_REPLENISHMENT_STATE_INVALID | ERR_RETURN_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: business_safety
    check: "the requested part is applicable to the machine being worked on: an ACTIVE PartApplicability exists with part_id == body part_id, model_id == InstalledUnit.model_id, and effective_from_build_revision <= InstalledUnit.build_revision <= (effective_to_build_revision or +infinity)"
    error_id: ERR_PART_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines"

  - priority: 11
    category: business_safety
    check: "calculations.emergency_air_freight_decision did not resolve to AIR_FREIGHT for a part with hazmat == true"
    error_id: ERR_HAZMAT_AIR_PROHIBITED
    http_status: 422
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines, POST /aftermarket/replenishment-orders"

  - priority: 12
    category: business_referential
    check: "the requested part is not in lifecycle_state SUPERSEDED; a superseded part must be ordered through its superseded_by_part_id successor"
    error_id: ERR_PART_SUPERSEDED
    http_status: 422
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines, POST /aftermarket/replenishment-orders, POST /aftermarket/last-time-buy-campaigns"

  - priority: 13
    category: business_referential
    check: "walking successor_part_id.superseded_by_part_id transitively never reaches the part being superseded"
    error_id: ERR_SUPERSESSION_CYCLE
    http_status: 409
    applies_to: "POST /aftermarket/parts/{id}/supersede"

  - priority: 14
    category: business_referential
    check: "exactly one AftermarketPriceRule with rule_status == ACTIVE exists for Part.criticality_class"
    error_id: ERR_PRICE_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines, GET /aftermarket/parts/{id}/price-quote, POST /aftermarket/parts/{id}/classify"

  - priority: 15
    category: business_temporal
    check: "INTEGER CLOSED-INTERVAL overlap on build revisions: the new [effective_from_build_revision, effective_to_build_revision] range (null upper bound means +infinity) must not intersect any existing ACTIVE PartApplicability range for the same (part_id, model_id) pair. Adjacency IS allowed — a new range starting at existing_to + 1 is accepted; a new range starting at existing_to is rejected. WITHDRAWN rows are excluded from the check."
    error_id: ERR_APPLICABILITY_REVISION_OVERLAP
    http_status: 409
    applies_to: "POST /aftermarket/part-applicabilities"

  - priority: 16
    category: business_temporal
    check: "DATETIME HALF-OPEN interval overlap: the new [ltb_window_start, ltb_window_end) must not intersect the window of any other LastTimeBuyCampaign on the same part whose status IN {SUBMITTED, APPROVED, ALLOCATING}. Two windows that merely touch (new_start == other_end) do NOT intersect at this priority."
    error_id: ERR_LTB_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /aftermarket/last-time-buy-campaigns, POST /aftermarket/last-time-buy-campaigns/{id}/submit"

  - priority: 17
    category: business_temporal
    check: "SYMMETRIC BUFFER on the same non-intersecting windows: after priority 16 passes, the new window must additionally satisfy new_start >= other_end + LTB_COOLDOWN_DAYS (30 days) OR new_end + LTB_COOLDOWN_DAYS <= other_start. Adjacency is therefore NOT allowed here, in contrast with priority 15's integer geometry."
    error_id: ERR_LTB_COOLDOWN_VIOLATION
    http_status: 409
    applies_to: "POST /aftermarket/last-time-buy-campaigns, POST /aftermarket/last-time-buy-campaigns/{id}/submit"

  - priority: 18
    category: business_temporal
    check: "age_days <= RETURN_WINDOW_DAYS (180) measured from the line's consumed_at to the logical clock"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /aftermarket/return-authorizations"

  - priority: 19
    category: business_temporal
    check: "the requested logical clock instant is greater than or equal to the current logical clock instant"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  - priority: 20
    category: business_constraint
    check: "a part in lifecycle_state OBSOLETE with available_units == 0 cannot be put on a work order line"
    error_id: ERR_PART_OBSOLETE_NO_SUPPLY
    http_status: 422
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines"

  - priority: 21
    category: business_constraint
    check: "qty_returned plus the qty_returned of every non-REJECTED ReturnAuthorization already raised against the same line is <= WorkOrderPartLine.qty_consumed"
    error_id: ERR_RETURN_QTY_EXCEEDS_CONSUMED
    http_status: 422
    applies_to: "POST /aftermarket/return-authorizations"

  - priority: 22
    category: business_constraint
    check: "requested_units <= LastTimeBuyCampaign.remaining_qty at the moment the request is created"
    error_id: ERR_ALLOCATION_EXCEEDS_REMAINING
    http_status: 409
    applies_to: "POST /aftermarket/allocation-requests"

  - priority: 23
    category: business_constraint
    check: "at least one AllocationRequest with status == PENDING and Dealer.status == ACTIVE exists on the campaign"
    error_id: ERR_NO_ELIGIBLE_ALLOCATION_REQUESTS
    http_status: 422
    applies_to: "POST /aftermarket/last-time-buy-campaigns/{id}/allocate"

  - priority: 24
    category: business_constraint
    check: "the calculation has non-empty input: for POST /aftermarket/parts/{id}/forecasts with method WORK_ORDER_HISTORY the CONSUMED-line input set is non-empty; for POST /aftermarket/parts/{id}/classify and POST /aftermarket/last-time-buy-campaigns a CURRENT 12-month DemandForecast exists for the part"
    error_id: ERR_FORECAST_INPUT_EMPTY
    http_status: 422
    applies_to: "POST /aftermarket/parts/{id}/forecasts, POST /aftermarket/parts/{id}/classify, POST /aftermarket/last-time-buy-campaigns, POST /aftermarket/last-time-buy-campaigns/{id}/revise"

  - priority: 25
    category: business_constraint
    check: "no WorkOrderPartLine on the work order has line_status IN {REQUESTED, RESERVED, BACKORDERED}"
    error_id: ERR_OPEN_LINES_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /aftermarket/work-orders/{id}/close"

  - priority: 26
    category: business_fiscal
    check: "base_uplift_pct <= max_uplift_pct on the rule being created"
    error_id: ERR_UPLIFT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /aftermarket/price-rules"

  - priority: 27
    category: business_fiscal
    check: "margin_pct produced by calculations.aftermarket_price_uplift is >= the matched rule's min_margin_pct"
    error_id: ERR_MARGIN_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines, GET /aftermarket/parts/{id}/price-quote"

  - priority: 28
    category: business_fiscal
    check: "an operator-created ReplenishmentOrder with order_type == EMERGENCY_AIR is only accepted when Part.replenishment_status == BELOW_REORDER_POINT"
    error_id: ERR_AIR_FREIGHT_NOT_JUSTIFIED
    http_status: 422
    applies_to: "POST /aftermarket/replenishment-orders"

  - priority: 29
    category: business_fiscal
    check: "the acting or referenced Dealer has credit_hold == false"
    error_id: ERR_DEALER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /aftermarket/work-orders/{id}/part-lines, POST /aftermarket/work-order-part-lines/{id}/consume, POST /aftermarket/allocation-requests"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------- logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Moving the clock backwards is rejected."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "every subsequent opened_at / closed_at / consumed_at / occurred_at / computed_at stamp and every age or window computation reads this instant"

  # --------------------------------------------------------------- Part -----
  - method: POST
    path: "/aftermarket/parts"
    description: "Register a spare part in the aftermarket catalogue"
    roles: [AftermarketPlanner]
    code: 201
    input: [part_number, description, unit_cost_cents, lead_time_days, weight_kg, "hazmat?", "max_stock_units?"]
    output: Part
    side_effects:
      - "lifecycle_state = ACTIVE, criticality_class = DESIRABLE, criticality_score = 0, stocking_policy = MAKE_TO_ORDER"
      - "on_hand_units = allocated_units = quarantine_units = in_transit_units = 0, available_units = 0, replenishment_status = NORMAL"
      - "current_effective_uplift_pct and current_list_unit_price_cents computed via calculations.aftermarket_price_uplift when an ACTIVE DESIRABLE rule exists, otherwise both stay 0"

  - method: GET
    path: "/aftermarket/parts/{id}"
    description: "Read one part with its live stock, criticality and catalogue-price fields"
    roles: [AftermarketPlanner, InventoryController, PricingAnalyst, DealerUser, PlatformAdmin]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: GET
    path: "/aftermarket/parts"
    description: "List parts; superseded_by_part_id filters to the predecessors of one successor part (self-referential reverse lookup)"
    roles: [AftermarketPlanner, InventoryController, PricingAnalyst, DealerUser, PlatformAdmin]
    code: 200
    input: ["lifecycle_state?", "criticality_class?", "superseded_by_part_id?", "limit?", "offset?"]
    output: Part[]
    side_effects: []

  - method: PATCH
    path: "/aftermarket/parts/{id}"
    description: "Amend the mutable master data of a part"
    roles: [AftermarketPlanner]
    code: 200
    input: ["description?", "unit_cost_cents?", "lead_time_days?", "weight_kg?", "hazmat?", "max_stock_units?"]
    output: Part
    side_effects:
      - "current_effective_uplift_pct and current_list_unit_price_cents recomputed"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/parts/{id}/classify"
    description: "Run calculations.part_criticality_and_stocking_policy against the part's CURRENT 12-month forecast"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: Part
    side_effects:
      - "criticality_score, criticality_class, stocking_policy, safety_stock_units and reorder_point_units are rewritten"
      - "current_effective_uplift_pct and current_list_unit_price_cents recomputed against the ACTIVE rule for the NEW criticality_class"
      - "replenishment_status recomputed against the new reorder_point_units"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/parts/{id}/phase-out"
    description: "Move a part ACTIVE -> PHASE_OUT, opening the obsolescence workflow"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: Part
    side_effects:
      - "re-price the part and re-quote every open WorkOrderPartLine on it"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/parts/{id}/reinstate"
    description: "Revert a part PHASE_OUT -> ACTIVE when no campaign has been submitted"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: Part
    side_effects:
      - "re-price the part and re-quote every open WorkOrderPartLine on it"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/parts/{id}/supersede"
    description: "Point a part at its successor and retire it"
    roles: [AftermarketPlanner]
    code: 200
    input: [successor_part_id]
    output: Part
    side_effects:
      - "superseded_by_part_id set, lifecycle_state -> SUPERSEDED, stocking_policy -> NO_STOCK"
      - "open lines on the part are CANCELLED and their reservations released"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/parts/{id}/obsolete"
    description: "Move a part LTB_CLOSED -> OBSOLETE once the last-time buy is fully allocated"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: Part
    side_effects:
      - "stocking_policy -> NO_STOCK, safety_stock_units and reorder_point_units zeroed"
      - "PENDING ReplenishmentOrder rows on the part move to approval_status REJECTED"
      - "increments Part.version by 1"

  - method: GET
    path: "/aftermarket/parts/{id}/ledger-entries"
    description: "Append-only stock ledger for one part, oldest first by occurred_at then created_at"
    roles: [AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: StockLedgerEntry[]
    side_effects: []

  # ----------------------------------------------------- EquipmentModel -----
  - method: POST
    path: "/aftermarket/equipment-models"
    description: "Register a machine model"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, name, production_end_date, support_end_date]
    output: EquipmentModel
    side_effects: []

  - method: GET
    path: "/aftermarket/equipment-models/{id}"
    description: "Read one machine model"
    roles: [PlatformAdmin, AftermarketPlanner, InventoryController, DealerUser, PricingAnalyst]
    code: 200
    input: []
    output: EquipmentModel
    side_effects: []

  # ------------------------------------------------------- InstalledUnit ----
  - method: POST
    path: "/aftermarket/installed-units"
    description: "Register a machine in the installed-base registry"
    roles: [PlatformAdmin]
    code: 201
    input: [model_id, dealer_id, serial_number, build_revision, commission_date, region]
    output: InstalledUnit
    side_effects:
      - "status = ACTIVE; the unit immediately enters the installed-base leg of every future forecast"

  - method: GET
    path: "/aftermarket/installed-units/{id}"
    description: "Read one installed machine"
    roles: [PlatformAdmin, AftermarketPlanner, InventoryController, DealerUser]
    code: 200
    input: []
    output: InstalledUnit
    side_effects: []

  - method: GET
    path: "/aftermarket/installed-units"
    description: "List installed machines filtered by model, dealer or status"
    roles: [PlatformAdmin, AftermarketPlanner, InventoryController, DealerUser]
    code: 200
    input: ["model_id?", "dealer_id?", "status?", "limit?", "offset?"]
    output: InstalledUnit[]
    side_effects: []

  - method: POST
    path: "/aftermarket/installed-units/{id}/decommission"
    description: "Retire a machine from the installed base"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: InstalledUnit
    side_effects:
      - "status -> DECOMMISSIONED; the unit stops counting toward installed_base_units and toward dealer_installed_units in the allocation waterfall"
      - "increments InstalledUnit.version by 1"

  # --------------------------------------------------- PartApplicability ----
  - method: POST
    path: "/aftermarket/part-applicabilities"
    description: "Declare that a part fits a build-revision range of a model"
    roles: [AftermarketPlanner]
    code: 201
    input: [part_id, model_id, effective_from_build_revision, "effective_to_build_revision?", qty_per_unit]
    output: PartApplicability
    side_effects:
      - "applicability_status = ACTIVE"

  - method: GET
    path: "/aftermarket/part-applicabilities/{id}"
    description: "Read one applicability row"
    roles: [AftermarketPlanner, InventoryController, DealerUser, PlatformAdmin]
    code: 200
    input: []
    output: PartApplicability
    side_effects: []

  - method: GET
    path: "/aftermarket/part-applicabilities"
    description: "List applicability rows filtered by part, model or status"
    roles: [AftermarketPlanner, InventoryController, DealerUser, PlatformAdmin]
    code: 200
    input: ["part_id?", "model_id?", "applicability_status?", "limit?", "offset?"]
    output: PartApplicability[]
    side_effects: []

  - method: POST
    path: "/aftermarket/part-applicabilities/{id}/withdraw"
    description: "Withdraw an applicability row so it stops gating work-order lines and stops feeding the installed-base forecast"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: PartApplicability
    side_effects:
      - "applicability_status -> WITHDRAWN; the row leaves the priority-15 overlap candidate set"
      - "increments PartApplicability.version by 1"

  # -------------------------------------------------------------- Dealer ----
  - method: POST
    path: "/aftermarket/dealers"
    description: "Register a dealer / distributor"
    roles: [PlatformAdmin]
    code: 201
    input: [dealer_code, tier, region, credit_limit_cents]
    output: Dealer
    side_effects:
      - "outstanding_balance_cents = 0, lifetime_restocking_fee_cents = 0, lifetime_rebate_cents = 0, credit_hold = false, status = ACTIVE"

  - method: GET
    path: "/aftermarket/dealers/{id}"
    description: "Read one dealer with its live receivable and credit-hold posture"
    roles: [PlatformAdmin, AftermarketPlanner, InventoryController, DealerUser]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/aftermarket/dealers/{id}/balance-adjustments"
    description: "Post a manual debit (positive) or credit (negative) to a dealer's aftermarket receivable"
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Dealer
    side_effects:
      - "outstanding_balance_cents += amount_cents; credit_hold recomputed as outstanding_balance_cents > credit_limit_cents"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/aftermarket/dealers/{id}/suspend"
    description: "Suspend a dealer, removing it from the LTB allocation candidate set"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects:
      - "status -> SUSPENDED"
      - "increments Dealer.version by 1"

  # ---------------------------------------------------- ServiceWorkOrder ----
  - method: POST
    path: "/aftermarket/work-orders"
    description: "Open a service work order against an installed machine"
    roles: [DealerUser]
    code: 201
    input: [installed_unit_id, work_type, downtime_priority]
    output: ServiceWorkOrder
    side_effects:
      - "dealer_id copied from InstalledUnit.dealer_id; status = OPEN; opened_at = logical clock"

  - method: GET
    path: "/aftermarket/work-orders/{id}"
    description: "Read one work order"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: []
    output: ServiceWorkOrder
    side_effects: []

  - method: GET
    path: "/aftermarket/work-orders"
    description: "List work orders filtered by installed unit, dealer or status"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: ["installed_unit_id?", "dealer_id?", "status?", "limit?", "offset?"]
    output: ServiceWorkOrder[]
    side_effects: []

  - method: POST
    path: "/aftermarket/work-orders/{id}/part-lines"
    description: "Add a part line to a work order. Runs the applicability gate, the air-freight-vs-stock decision and both pricing variants in one request."
    roles: [DealerUser]
    code: 201
    input: [part_id, qty_requested]
    output: WorkOrderPartLine
    side_effects:
      - "calculations.emergency_air_freight_decision sets fulfillment_mode, decision_net_benefit_cents and freight_cost_cents"
      - "calculations.aftermarket_price_uplift sets effective_uplift_pct, list_unit_price_cents, list_line_total_cents, quoted_line_total_cents, variant_delta_cents and margin_pct"
      - "line_status = RESERVED and Part.allocated_units += qty_requested when fulfillment_mode == STOCK; otherwise line_status = BACKORDERED and ServiceWorkOrder.status OPEN -> PARTS_PENDING"
      - "when fulfillment_mode == AIR_FREIGHT one ReplenishmentOrder is auto-created with order_type EMERGENCY_AIR, auto_generated = true, qty = qty_requested"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/work-orders/{id}/close"
    description: "Close a work order, making its consumed lines eligible for the forecast lookback window"
    roles: [DealerUser]
    code: 200
    input: []
    output: ServiceWorkOrder
    side_effects:
      - "status -> CLOSED; closed_at = logical clock"
      - "increments ServiceWorkOrder.version by 1"

  # --------------------------------------------------- WorkOrderPartLine ----
  - method: GET
    path: "/aftermarket/work-order-part-lines/{id}"
    description: "Read one part line with both pricing variants and the freight decision"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PricingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrderPartLine
    side_effects: []

  - method: GET
    path: "/aftermarket/work-order-part-lines"
    description: "List part lines filtered by work order, part or status"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PricingAnalyst, PlatformAdmin]
    code: 200
    input: ["work_order_id?", "part_id?", "line_status?", "limit?", "offset?"]
    output: WorkOrderPartLine[]
    side_effects: []

  - method: POST
    path: "/aftermarket/work-order-part-lines/{id}/consume"
    description: "Fit the reserved units to the machine and bill the dealer"
    roles: [DealerUser]
    code: 200
    input: [qty_consumed]
    output: WorkOrderPartLine
    side_effects:
      - "line_status -> CONSUMED; consumed_at = logical clock; charged_amount_cents posted to Dealer.outstanding_balance_cents"
      - "Part.allocated_units -= qty_requested; Part.on_hand_units -= qty_consumed; one ISSUE StockLedgerEntry appended"
      - "Part.available_units and Part.replenishment_status recomputed; an auto ReplenishmentOrder may be created (cascade hop 3)"
      - "increments Part.version by 1"

  - method: POST
    path: "/aftermarket/work-order-part-lines/{id}/cancel"
    description: "Cancel an unfitted part line and release any reservation"
    roles: [DealerUser]
    code: 200
    input: []
    output: WorkOrderPartLine
    side_effects:
      - "line_status -> CANCELLED; Part.allocated_units released when the line was RESERVED"
      - "ServiceWorkOrder may move PARTS_PENDING -> OPEN"
      - "increments Part.version by 1"

  # -------------------------------------------------------- DemandForecast --
  - method: POST
    path: "/aftermarket/parts/{id}/forecasts"
    description: "Compute a demand forecast for a part from closed service work orders and the installed base"
    roles: [AftermarketPlanner]
    code: 201
    input: [horizon_months, method, "lookback_days?"]
    output: DemandForecast
    side_effects:
      - "any prior DemandForecast for the same (part_id, horizon_months) moves to forecast_status SUPERSEDED"
      - "computed_at = logical clock"

  - method: GET
    path: "/aftermarket/parts/{id}/forecasts"
    description: "List the forecasts computed for one part, newest first by computed_at then created_at"
    roles: [AftermarketPlanner, InventoryController, PricingAnalyst, PlatformAdmin]
    code: 200
    input: ["horizon_months?", "forecast_status?", "limit?", "offset?"]
    output: DemandForecast[]
    side_effects: []

  # -------------------------------------------------- LastTimeBuyCampaign ---
  - method: POST
    path: "/aftermarket/last-time-buy-campaigns"
    description: "Draft a last-time-buy campaign for a phasing-out part. Carries OCC on the part's version because a successful create supersedes any existing DRAFT campaign on that part."
    roles: [AftermarketPlanner]
    code: 201
    input: [part_id, method, coverage_years, ltb_window_start, ltb_window_end, expected_part_version]
    output: LastTimeBuyCampaign
    side_effects:
      - "annual_demand_units snapshotted from the part's CURRENT 12-month DemandForecast; proposed_qty computed via calculations.ltb_lifetime_buy_quantity"
      - "status = DRAFT, revision_index = 0, approved_qty = 0, remaining_qty = 0"
      - "any existing DRAFT campaign on the same part moves to CANCELLED"
      - "increments Part.version by 1"

  - method: GET
    path: "/aftermarket/last-time-buy-campaigns/{id}"
    description: "Read one campaign"
    roles: [AftermarketPlanner, InventoryController, DealerUser, PlatformAdmin]
    code: 200
    input: []
    output: LastTimeBuyCampaign
    side_effects: []

  - method: GET
    path: "/aftermarket/last-time-buy-campaigns"
    description: "List campaigns filtered by part or status"
    roles: [AftermarketPlanner, InventoryController, DealerUser, PlatformAdmin]
    code: 200
    input: ["part_id?", "status?", "limit?", "offset?"]
    output: LastTimeBuyCampaign[]
    side_effects: []

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/submit"
    description: "Submit a draft campaign for approval"
    roles: [AftermarketPlanner, InventoryController]
    code: 200
    input: []
    output: LastTimeBuyCampaign
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_by_user_id = X-User-ID"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/approve"
    description: "Authorise the lifetime buy. The approver must not be the submitter."
    roles: [InventoryController]
    code: 200
    input: [approved_qty]
    output: LastTimeBuyCampaign
    side_effects:
      - "status -> APPROVED; approved_qty and remaining_qty set; approved_by_user_id = X-User-ID"
      - "cascade: Part PHASE_OUT -> LTB_OPEN -> part re-priced -> every open WorkOrderPartLine on the part re-quoted"
      - "increments Part.version by 1"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/reject"
    description: "Reject a submitted campaign. The rejecter must not be the submitter."
    roles: [InventoryController]
    code: 200
    input: [rejection_reason]
    output: LastTimeBuyCampaign
    side_effects:
      - "status -> REJECTED; rejection_reason stored; the Part stays in PHASE_OUT"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/revise"
    description: "Send a rejected campaign back to DRAFT for another round"
    roles: [AftermarketPlanner]
    code: 200
    input: ["method?", "coverage_years?"]
    output: LastTimeBuyCampaign
    side_effects:
      - "status REJECTED -> DRAFT; revision_index += 1; submitted_by_user_id and rejection_reason cleared"
      - "annual_demand_units re-snapshotted and proposed_qty recomputed"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/allocate"
    description: "Run the dealer allocation waterfall over the campaign's pending requests"
    roles: [InventoryController]
    code: 200
    input: []
    output: LastTimeBuyCampaign
    side_effects:
      - "status APPROVED -> ALLOCATING; every eligible AllocationRequest is stamped with priority_score, dealer_installed_units and granted_units and moves to GRANTED / PARTIALLY_GRANTED / DENIED"
      - "remaining_qty recomputed"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: POST
    path: "/aftermarket/last-time-buy-campaigns/{id}/close"
    description: "Close the campaign, deny any leftovers and move the part to LTB_CLOSED"
    roles: [InventoryController]
    code: 200
    input: []
    output: LastTimeBuyCampaign
    side_effects:
      - "status ALLOCATING -> CLOSED; PENDING requests -> DENIED"
      - "Part LTB_OPEN -> LTB_CLOSED, part re-priced, open lines re-quoted"
      - "increments Part.version by 1"
      - "increments LastTimeBuyCampaign.version by 1"

  # ----------------------------------------------------- AllocationRequest --
  - method: POST
    path: "/aftermarket/allocation-requests"
    description: "A dealer asks for a share of an approved last-time buy. Carries OCC on the campaign's version because a successful create supersedes the same dealer's prior PENDING request."
    roles: [DealerUser]
    code: 201
    input: [campaign_id, dealer_id, requested_units, expected_campaign_version]
    output: AllocationRequest
    side_effects:
      - "status = PENDING, granted_units = 0, priority_score = 0, dealer_installed_units = 0"
      - "the same dealer's prior PENDING request on this campaign moves to WITHDRAWN"
      - "increments LastTimeBuyCampaign.version by 1"

  - method: GET
    path: "/aftermarket/allocation-requests/{id}"
    description: "Read one allocation request"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: []
    output: AllocationRequest
    side_effects: []

  - method: GET
    path: "/aftermarket/allocation-requests"
    description: "List allocation requests filtered by campaign, dealer or status"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: ["campaign_id?", "dealer_id?", "status?", "limit?", "offset?"]
    output: AllocationRequest[]
    side_effects: []

  - method: POST
    path: "/aftermarket/allocation-requests/{id}/withdraw"
    description: "Withdraw a request; a granted request returns its units to the campaign"
    roles: [DealerUser, AftermarketPlanner]
    code: 200
    input: []
    output: AllocationRequest
    side_effects:
      - "status -> WITHDRAWN; LastTimeBuyCampaign.remaining_qty += granted_units; granted_units = 0"
      - "increments LastTimeBuyCampaign.version by 1"

  # ------------------------------------------------- AftermarketPriceRule ---
  - method: POST
    path: "/aftermarket/price-rules"
    description: "Publish the uplift and margin rule for one criticality band"
    roles: [PricingAnalyst]
    code: 201
    input: [criticality_class, base_uplift_pct, max_uplift_pct, min_margin_pct]
    output: AftermarketPriceRule
    side_effects:
      - "rule_status = ACTIVE; any prior ACTIVE rule for the same criticality_class moves to RETIRED"

  - method: GET
    path: "/aftermarket/price-rules"
    description: "List price rules"
    roles: [PricingAnalyst, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: ["criticality_class?", "rule_status?", "limit?", "offset?"]
    output: AftermarketPriceRule[]
    side_effects: []

  - method: GET
    path: "/aftermarket/parts/{id}/price-quote"
    description: "Computed read returning both pricing variants side by side for a hypothetical quantity"
    roles: [PricingAnalyst, AftermarketPlanner, DealerUser]
    code: 200
    input: [qty]
    output: "{ effective_uplift_pct: number, list_unit_price_cents: integer, list_line_total_cents: integer, quoted_line_total_cents: integer, variant_delta_cents: integer, margin_pct: number }"
    side_effects: []

  # ------------------------------------------------- ReplenishmentOrder -----
  - method: POST
    path: "/aftermarket/replenishment-orders"
    description: "Raise a stock or emergency-air replenishment order"
    roles: [InventoryController]
    code: 201
    input: [part_id, order_type, qty]
    output: ReplenishmentOrder
    side_effects:
      - "unit_cost_cents snapshotted from the part; freight_cost_cents 0 for STOCK, air_freight_cost_cents for EMERGENCY_AIR; total_landed_cost_cents computed"
      - "approval_status = PENDING, logistics_status = NOT_STARTED, auto_generated = false"

  - method: GET
    path: "/aftermarket/replenishment-orders/{id}"
    description: "Read one replenishment order with both of its independent status dimensions"
    roles: [InventoryController, AftermarketPlanner, PlatformAdmin]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects: []

  - method: GET
    path: "/aftermarket/replenishment-orders"
    description: "List replenishment orders filtered by part or by either status dimension"
    roles: [InventoryController, AftermarketPlanner, PlatformAdmin]
    code: 200
    input: ["part_id?", "order_type?", "approval_status?", "logistics_status?", "auto_generated?", "limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []

  - method: POST
    path: "/aftermarket/replenishment-orders/{id}/approve"
    description: "Approve the spend dimension of a replenishment order"
    roles: [InventoryController]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "approval_status PENDING -> APPROVED; logistics_status untouched"
      - "increments ReplenishmentOrder.version by 1"

  - method: POST
    path: "/aftermarket/replenishment-orders/{id}/reject"
    description: "Reject the spend dimension of a replenishment order"
    roles: [InventoryController]
    code: 200
    input: ["rejection_reason?"]
    output: ReplenishmentOrder
    side_effects:
      - "approval_status PENDING -> REJECTED; Part.replenishment_status recomputed"
      - "increments ReplenishmentOrder.version by 1"

  - method: POST
    path: "/aftermarket/replenishment-orders/{id}/ship"
    description: "Move the logistics dimension to IN_TRANSIT; guarded by the approval dimension"
    roles: [InventoryController]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "logistics_status NOT_STARTED -> IN_TRANSIT; Part.in_transit_units += qty; Part.replenishment_status = ON_ORDER"
      - "increments Part.version by 1"
      - "increments ReplenishmentOrder.version by 1"

  - method: POST
    path: "/aftermarket/replenishment-orders/{id}/receive"
    description: "Book the goods in, append a RECEIPT ledger entry and run the backorder promotion sweep"
    roles: [InventoryController]
    code: 200
    input: []
    output: ReplenishmentOrder
    side_effects:
      - "logistics_status IN_TRANSIT -> RECEIVED; Part.in_transit_units -= qty; Part.on_hand_units += qty; RECEIPT StockLedgerEntry appended"
      - "calculations.backorder_promotion_order sweeps BACKORDERED lines on the part into RESERVED"
      - "work orders with no remaining BACKORDERED line move PARTS_PENDING -> OPEN"
      - "increments Part.version by 1"
      - "increments ReplenishmentOrder.version by 1"

  # ------------------------------------------------- ReturnAuthorization ----
  - method: POST
    path: "/aftermarket/return-authorizations"
    description: "Raise an RMA against a consumed part line; the restocking fee and credit are computed at creation"
    roles: [DealerUser]
    code: 201
    input: [work_order_part_line_id, qty_returned, return_reason]
    output: ReturnAuthorization
    side_effects:
      - "part_id and dealer_id copied from the line; status = REQUESTED"
      - "calculations.return_restocking_fee_and_credit sets age_days, gross_credit_cents, fee_pct, restocking_fee_cents, net_before_rebate_cents, rebate_pct, loyalty_rebate_cents and final_credit_cents"
      - "no stock or money moves yet — credit_posted_cents stays 0 until the inspection branch"

  - method: GET
    path: "/aftermarket/return-authorizations/{id}"
    description: "Read one RMA with its fee breakdown"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

  - method: GET
    path: "/aftermarket/return-authorizations"
    description: "List RMAs filtered by part, dealer, source line or status"
    roles: [DealerUser, AftermarketPlanner, InventoryController, PlatformAdmin]
    code: 200
    input: ["part_id?", "dealer_id?", "work_order_part_line_id?", "status?", "limit?", "offset?"]
    output: ReturnAuthorization[]
    side_effects: []

  - method: POST
    path: "/aftermarket/return-authorizations/{id}/approve"
    description: "Authorise the physical return"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects:
      - "status REQUESTED -> APPROVED"
      - "increments ReturnAuthorization.version by 1"

  - method: POST
    path: "/aftermarket/return-authorizations/{id}/reject"
    description: "Refuse the return; nothing moves"
    roles: [AftermarketPlanner]
    code: 200
    input: ["rejection_reason?"]
    output: ReturnAuthorization
    side_effects:
      - "status REQUESTED -> REJECTED; no stock movement, no ledger entry, no dealer credit"
      - "increments ReturnAuthorization.version by 1"

  - method: POST
    path: "/aftermarket/return-authorizations/{id}/receive"
    description: "Book the returned units into quarantine"
    roles: [AftermarketPlanner]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects:
      - "status APPROVED -> RECEIVED; Part.quarantine_units += qty_returned; RETURN_RECEIPT StockLedgerEntry appended"
      - "increments Part.version by 1"
      - "increments ReturnAuthorization.version by 1"

  - method: POST
    path: "/aftermarket/return-authorizations/{id}/inspect"
    description: "Fork the RMA: RESTOCK puts the units back on the shelf and credits the dealer; SCRAP writes them off and credits only DEFECTIVE returns"
    roles: [AftermarketPlanner]
    code: 200
    input: [disposition]
    output: ReturnAuthorization
    side_effects:
      - "RESTOCK branch: status -> CREDITED; quarantine_units -> on_hand_units; NO ledger entry; credit_posted_cents = final_credit_cents; dealer receivable, lifetime_restocking_fee_cents and lifetime_rebate_cents updated"
      - "SCRAP branch: status -> SCRAPPED; quarantine_units decremented with no on_hand increase; SCRAP StockLedgerEntry appended; dealer credited only when return_reason == DEFECTIVE"
      - "increments Part.version by 1"
      - "increments ReturnAuthorization.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---
  - { id: ERR_UNAUTHENTICATED,             http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED,                http: 403, condition: "the caller's role is not listed in the endpoint's §1.5 roles" }
  - { id: ERR_DEALER_SCOPE_VIOLATION,      http: 403, condition: "a DealerUser acts on a work order, part line, allocation request or RMA belonging to a different dealer_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES,       http: 403, condition: "the X-User-ID approving or rejecting a LastTimeBuyCampaign equals its submitted_by_user_id" }

  # --- existence ---
  - { id: ERR_PART_NOT_FOUND,              http: 404, condition: "part id in the path or body does not resolve" }
  - { id: ERR_MODEL_NOT_FOUND,             http: 404, condition: "equipment model id does not resolve" }
  - { id: ERR_INSTALLED_UNIT_NOT_FOUND,    http: 404, condition: "installed unit id does not resolve" }
  - { id: ERR_DEALER_NOT_FOUND,            http: 404, condition: "dealer id does not resolve" }
  - { id: ERR_WORK_ORDER_NOT_FOUND,        http: 404, condition: "service work order id does not resolve" }
  - { id: ERR_PART_LINE_NOT_FOUND,         http: 404, condition: "work order part line id does not resolve" }
  - { id: ERR_CAMPAIGN_NOT_FOUND,          http: 404, condition: "last-time-buy campaign id does not resolve" }
  - { id: ERR_ALLOCATION_REQUEST_NOT_FOUND, http: 404, condition: "allocation request id does not resolve" }
  - { id: ERR_REPLENISHMENT_ORDER_NOT_FOUND, http: 404, condition: "replenishment order id does not resolve" }
  - { id: ERR_RETURN_NOT_FOUND,            http: 404, condition: "return authorization id does not resolve" }
  - { id: ERR_APPLICABILITY_NOT_FOUND,     http: 404, condition: "part applicability id does not resolve" }
  - { id: ERR_PRICE_RULE_NOT_FOUND,        http: 404, condition: "no AftermarketPriceRule with rule_status ACTIVE exists for the part's criticality_class" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST,             http: 400, condition: "missing required field, unknown enum member, or a numeric value outside its declared constraint" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_PART_VERSION,          http: 412, condition: "expected_part_version does not equal the current Part.version on POST /aftermarket/last-time-buy-campaigns" }
  - { id: ERR_STALE_CAMPAIGN_VERSION,      http: 412, condition: "expected_campaign_version does not equal the current LastTimeBuyCampaign.version on POST /aftermarket/allocation-requests" }

  # --- state preconditions ---
  - { id: ERR_PART_LIFECYCLE_INVALID,      http: 409, condition: "the part's lifecycle_state does not permit this transition or operation (phase-out from a non-ACTIVE part, reinstate from a non-PHASE_OUT part, obsolete from a non-LTB_CLOSED part, supersede from a terminal part, replenishment approve/receive or RMA RESTOCK on an OBSOLETE part, campaign submit while the part is not PHASE_OUT)" }
  - { id: ERR_CAMPAIGN_STATE_INVALID,      http: 409, condition: "the campaign is not in the state this transition requires (submit from non-DRAFT, approve/reject from non-SUBMITTED, revise from non-REJECTED, allocate from non-APPROVED, close from non-ALLOCATING, allocation-request create against a campaign not in APPROVED)" }
  - { id: ERR_ALLOCATION_STATE_INVALID,    http: 409, condition: "withdraw on an allocation request already in DENIED or WITHDRAWN, or withdraw of a granted request while the campaign is not ALLOCATING" }
  - { id: ERR_LINE_STATE_INVALID,          http: 409, condition: "consume on a line whose line_status is not RESERVED, cancel on a CONSUMED or CANCELLED line, or RMA creation against a line whose line_status is not CONSUMED" }
  - { id: ERR_WORK_ORDER_STATE_INVALID,    http: 409, condition: "adding a part line to, or closing, a work order whose status is not OPEN" }
  - { id: ERR_REPLENISHMENT_STATE_INVALID, http: 409, condition: "approve/reject on a non-PENDING approval dimension, ship without approval_status APPROVED or from a non-NOT_STARTED logistics dimension, receive from a non-IN_TRANSIT logistics dimension" }
  - { id: ERR_RETURN_STATE_INVALID,        http: 409, condition: "approve/reject on a non-REQUESTED RMA, receive on a non-APPROVED RMA, inspect on a non-RECEIVED RMA" }

  # --- safety ---
  - { id: ERR_PART_NOT_APPLICABLE,         http: 422, condition: "no ACTIVE PartApplicability covers the installed unit's model_id and build_revision for the requested part" }
  - { id: ERR_HAZMAT_AIR_PROHIBITED,       http: 422, condition: "the air-freight decision resolved to AIR_FREIGHT for a part with hazmat == true" }

  # --- referential integrity ---
  - { id: ERR_PART_SUPERSEDED,             http: 422, condition: "the requested part is in lifecycle_state SUPERSEDED and must be ordered through its successor" }
  - { id: ERR_SUPERSESSION_CYCLE,          http: 409, condition: "the successor's supersession chain leads back to the part being superseded" }

  # --- temporal geometry ---
  - { id: ERR_APPLICABILITY_REVISION_OVERLAP, http: 409, condition: "the new build-revision closed interval intersects an existing ACTIVE applicability interval for the same part and model" }
  - { id: ERR_LTB_WINDOW_OVERLAP,          http: 409, condition: "the new half-open buy window intersects the window of another SUBMITTED / APPROVED / ALLOCATING campaign on the same part" }
  - { id: ERR_LTB_COOLDOWN_VIOLATION,      http: 409, condition: "the new buy window does not intersect another campaign's window but sits inside the 30-day symmetric cooldown buffer around it" }
  - { id: ERR_RETURN_WINDOW_EXPIRED,       http: 422, condition: "age_days from the line's consumed_at exceeds RETURN_WINDOW_DAYS (180)" }
  - { id: ERR_CLOCK_NOT_MONOTONIC,         http: 409, condition: "the requested logical clock instant is earlier than the current logical clock instant" }

  # --- business constraints ---
  - { id: ERR_PART_OBSOLETE_NO_SUPPLY,     http: 422, condition: "a part line is requested for an OBSOLETE part with available_units == 0" }
  - { id: ERR_RETURN_QTY_EXCEEDS_CONSUMED, http: 422, condition: "qty_returned plus already-open returns on the same line exceeds the line's qty_consumed" }
  - { id: ERR_ALLOCATION_EXCEEDS_REMAINING, http: 409, condition: "requested_units exceeds the campaign's remaining_qty" }
  - { id: ERR_NO_ELIGIBLE_ALLOCATION_REQUESTS, http: 422, condition: "an allocation run finds no PENDING request whose dealer status is ACTIVE" }
  - { id: ERR_FORECAST_INPUT_EMPTY,        http: 422, condition: "a WORK_ORDER_HISTORY forecast finds no qualifying consumed lines, or classification / LTB sizing finds no CURRENT 12-month forecast for the part" }
  - { id: ERR_OPEN_LINES_BLOCK_CLOSE,      http: 409, condition: "the work order still carries a line in REQUESTED, RESERVED or BACKORDERED" }

  # --- fiscal ---
  - { id: ERR_UPLIFT_CAP_EXCEEDED,         http: 422, condition: "base_uplift_pct is greater than max_uplift_pct on the price rule being created" }
  - { id: ERR_MARGIN_FLOOR_BREACH,         http: 422, condition: "the quoted line margin_pct is below the matched rule's min_margin_pct" }
  - { id: ERR_AIR_FREIGHT_NOT_JUSTIFIED,   http: 422, condition: "an operator raised an EMERGENCY_AIR replenishment order while the part's replenishment_status is not BELOW_REORDER_POINT" }
  - { id: ERR_DEALER_CREDIT_HOLD,          http: 402, condition: "the acting or referenced dealer has credit_hold == true" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AftermarketPlanner
    description: "Owns the part catalogue, the installed-base applicability map, forecasting, criticality classification, the obsolescence lifecycle and the returns desk."
    identity: "opaque"
    exclusive_operations:
      - "POST /aftermarket/parts"
      - "PATCH /aftermarket/parts/{id}"
      - "POST /aftermarket/parts/{id}/classify"
      - "POST /aftermarket/parts/{id}/phase-out"
      - "POST /aftermarket/parts/{id}/reinstate"
      - "POST /aftermarket/parts/{id}/supersede"
      - "POST /aftermarket/parts/{id}/obsolete"
      - "POST /aftermarket/parts/{id}/forecasts"
      - "POST /aftermarket/part-applicabilities"
      - "POST /aftermarket/part-applicabilities/{id}/withdraw"
      - "POST /aftermarket/last-time-buy-campaigns"
      - "POST /aftermarket/last-time-buy-campaigns/{id}/revise"
      - "POST /aftermarket/return-authorizations/{id}/approve"
      - "POST /aftermarket/return-authorizations/{id}/reject"
      - "POST /aftermarket/return-authorizations/{id}/receive"
      - "POST /aftermarket/return-authorizations/{id}/inspect"
    shared_operations:
      - "POST /aftermarket/last-time-buy-campaigns/{id}/submit (shared with InventoryController — this is exactly what makes segregation of duties bite)"
      - "POST /aftermarket/allocation-requests/{id}/withdraw (shared with DealerUser)"
      - "all GET reads except the stock ledger, which it also shares with InventoryController and PlatformAdmin"

  - name: InventoryController
    description: "Owns the money and the goods flow: approves the lifetime buy, runs dealer allocation, and drives replenishment orders through both status dimensions."
    identity: "opaque"
    exclusive_operations:
      - "POST /aftermarket/last-time-buy-campaigns/{id}/approve"
      - "POST /aftermarket/last-time-buy-campaigns/{id}/reject"
      - "POST /aftermarket/last-time-buy-campaigns/{id}/allocate"
      - "POST /aftermarket/last-time-buy-campaigns/{id}/close"
      - "POST /aftermarket/replenishment-orders"
      - "POST /aftermarket/replenishment-orders/{id}/approve"
      - "POST /aftermarket/replenishment-orders/{id}/reject"
      - "POST /aftermarket/replenishment-orders/{id}/ship"
      - "POST /aftermarket/replenishment-orders/{id}/receive"
    shared_operations:
      - "POST /aftermarket/last-time-buy-campaigns/{id}/submit (shared with AftermarketPlanner)"
      - "GET reads across parts, campaigns, allocation requests, work orders, lines, RMAs, replenishment orders and the stock ledger"
    note: "Segregation of duties: an InventoryController who used the shared submit operation on a campaign is barred from approving or rejecting that same campaign."

  - name: DealerUser
    description: "A dealer / distributor acting on its own machines: opens work orders, requests and consumes parts, competes for last-time-buy allocation and raises returns."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /aftermarket/work-orders"
      - "POST /aftermarket/work-orders/{id}/part-lines"
      - "POST /aftermarket/work-orders/{id}/close"
      - "POST /aftermarket/work-order-part-lines/{id}/consume"
      - "POST /aftermarket/work-order-part-lines/{id}/cancel"
      - "POST /aftermarket/allocation-requests"
      - "POST /aftermarket/return-authorizations"
    shared_operations:
      - "POST /aftermarket/allocation-requests/{id}/withdraw (shared with AftermarketPlanner)"
      - "GET /aftermarket/parts/{id}/price-quote (shared with PricingAnalyst and AftermarketPlanner)"
      - "read access to parts, applicabilities, installed units, its own work orders, lines, allocation requests and RMAs"
    note: "X-User-ID MUST equal a Dealer.id. Validation priority 3 compares it to the dealer_id reachable from the target resource."

  - name: PricingAnalyst
    description: "Owns the aftermarket uplift and margin policy."
    identity: "opaque"
    exclusive_operations:
      - "POST /aftermarket/price-rules"
    shared_operations:
      - "GET /aftermarket/price-rules"
      - "GET /aftermarket/parts/{id}/price-quote (shared with AftermarketPlanner and DealerUser)"
      - "read access to parts and work order part lines"

  - name: PlatformAdmin
    description: "Operational administrator for the registry side of the system: machine models, installed units, dealer master data and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /aftermarket/equipment-models"
      - "POST /aftermarket/installed-units"
      - "POST /aftermarket/installed-units/{id}/decommission"
      - "POST /aftermarket/dealers"
      - "POST /aftermarket/dealers/{id}/balance-adjustments"
      - "POST /aftermarket/dealers/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read access to every collection, including the stock ledger"
