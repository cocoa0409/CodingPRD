          assert:
            - "First NON_PROVISIONAL create fails with ERR_TITLE_NOT_ELECTED (report was only DRAFT-absent)"
            - "PROVISIONAL create succeeds without any election report (gate is type-conditional)"
            - "After ELECTION_OF_TITLE reaches SUBMITTED, NON_PROVISIONAL create succeeds (201)"
