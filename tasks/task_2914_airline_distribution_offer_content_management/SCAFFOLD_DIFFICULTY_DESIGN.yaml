# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — task_2914_airline_distribution_offer_content_management
#
# Nine rule_ids × 2 instances = 18 instances. Every instance grounds only in
# elements declared in SCAFFOLD.yaml §1.1–§1.7.
#
# Shared fixture (anchored on first use, aliased afterwards):
#   Channel NDC_AGG   : NDC_AGGREGATOR, STANDARD (rank 2), markup 0.035,
#                       incentive_multiplier 1.25, monthly_platform_fee 400000,
#                       per_message 12, per_segment 40, disclosures
#                       ["DOT-FARE-INCL"], two surcharge rules
#                       (ANC_DISTR: ANCILLARY 0.05 thr 10000 clamp [0,400];
#                        DISTR_FEE: ALL 0.02 thr 50000 clamp [500,1200])
#   FareFiling YNDC01 : FRA-JFK ECONOMY, base 45010, sale window
#                       [2026-07-01, 2026-10-01), travel [2026-09-01, 2026-12-31]
#   Logical clock     : left at its 2026-08-01T00:00:00.000Z startup default
#                       unless an instance moves it, so YNDC01 is on sale.
#   OFFER_A (a la carte BAG20+SEAT_STD+WIFI_FULL) : subtotal 58000,
#                       surcharge 1560, total 59560, item_count 6
#   OFFER_B (bundle BND_FLEX)                     : subtotal 55919,
#                       surcharge 1118, total 57037, item_count 4
#   OFFER_C (fare 5000000, no ancillaries)        : subtotal 5175000,
#                       surcharge 1200, total 5176200, item_count 2
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: channel_cost_variants_diverge_on_identical_paid_order_population
        grounds:
          - calculations.distribution_cost_per_booking
          - entities.Channel.fields.cost_per_booking_flat_cents
          - entities.Channel.fields.cost_per_booking_activity_cents
          - entities.Channel.fields.activity_cost_cents
          - entities.Channel.fields.booking_count
          - state_machines.Order.AUTHORIZED_to_PAID
        distinguishing_aspect: |
          This dual variant lives in the COST-ACCOUNTING domain on Channel: CHANNEL_AVERAGE spreads
          monthly_platform_fee_cents over booking_count (200000 per booking) while ACTIVITY_BASED
          charges per message, per segment and signed-agreement incentive (865 per booking) over the
          exact same two PAID orders, so the two stored fields differ by 199135 cents.
        test_recipe:
          setup:
            - "Channel NDC_AGG with monthly_platform_fee_cents 400000, per_message_cost_cents 12, per_segment_fee_cents 40, incentive_multiplier 1.25 and both surcharge rules."
            - "Travel agency Alpha with a SIGNED AgencyAgreement on NDC_AGG at agreed_incentive_pct 0.025 and incentive_cap_cents 1000000."
            - "FareFiling YNDC01 ACTIVE; ancillaries BAG20 / SEAT_STD / WIFI_FULL and bundle BND_FLEX published."
            - "OFFER_A (a la carte, total 59560) ordered with message_count 4 / segment_count 2 and already CAPTUREd."
            - "OFFER_B (bundle, total 57037) ordered with message_count 2 / segment_count 3 and still AUTHORIZED."
          setup_api_calls:
            - &k_ch_ndc
              call: "POST /channels"
              payload: { channel_code: "NDC_AGG", channel_kind: "NDC_AGGREGATOR", content_tier: "STANDARD", content_markup_pct: 0.035, incentive_multiplier: 1.25, monthly_platform_fee_cents: 400000, per_message_cost_cents: 12, per_segment_fee_cents: 40, servicing_parity_change: true, servicing_parity_refund: true, required_disclosure_codes: ["DOT-FARE-INCL"] }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { channel_ndc_id: $.data.id }
            - &k_sr_anc
              call: "POST /channels/${channel_ndc_id}/surcharge-rules"
              payload: { surcharge_code: "ANC_DISTR", item_scope: "ANCILLARY", rate_pct: 0.05, threshold_cents: 10000, min_cents: 0, max_cents: 400 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - &k_sr_all
              call: "POST /channels/${channel_ndc_id}/surcharge-rules"
              payload: { surcharge_code: "DISTR_FEE", item_scope: "ALL", rate_pct: 0.02, threshold_cents: 50000, min_cents: 500, max_cents: 1200 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - &k_agy_partner
              call: "POST /distribution-partners"
              payload: { partner_name: "Alpha Travel GmbH", partner_type: "TRAVEL_AGENCY", iata_code: "12345675", home_country: "DE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_agy_id: $.data.id, partner_agy_v: $.data.version }
            - &k_anc_bag
              call: "POST /ancillary-products"
              payload: { ancillary_code: "BAG20", name: "Checked bag 20kg", list_amount_cents: 7010, min_content_tier_rank: 1, refundable: true }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_anc_seat
              call: "POST /ancillary-products"
              payload: { ancillary_code: "SEAT_STD", name: "Standard seat", list_amount_cents: 3010, min_content_tier_rank: 1, refundable: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_anc_wifi
              call: "POST /ancillary-products"
              payload: { ancillary_code: "WIFI_FULL", name: "Full-flight wifi", list_amount_cents: 1010, min_content_tier_rank: 1, refundable: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_bundle_flex
              call: "POST /bundle-definitions"
              payload: { bundle_code: "BND_FLEX", ancillary_codes: ["BAG20", "SEAT_STD"], bundle_discount_pct: 0.10, min_content_tier_rank: 1 }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { bundle_flex_id: $.data.id }
            - &k_filing01
              call: "POST /fare-filings"
              payload: { fare_basis_code: "YNDC01", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing01_id: $.data.id }
            - &k_filing01_filed
              call: "POST /fare-filings/${filing01_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_filing01_active
              call: "POST /fare-filings/${filing01_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_agreement
              call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_ndc_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { agreement_id: $.data.id }
            - &k_agreement_accept
              call: "POST /agency-agreements/${agreement_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - &k_offer_a
              call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing01_id}", ancillary_codes: ["BAG20", "SEAT_STD", "WIFI_FULL"], trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_a_id: $.data.id }
            - &k_publish_a
              call: "POST /offers/${offer_a_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - &k_order_a
              call: "POST /orders"
              payload: { offer_id: "${offer_a_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], message_count: 4, segment_count: 2 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { order_a_id: $.data.id }
            - &k_capture_a
              call: "POST /orders/${order_a_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 59560 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - &k_offer_b
              call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing01_id}", bundle_id: "${bundle_flex_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_b_id: $.data.id }
            - &k_publish_b
              call: "POST /offers/${offer_b_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - &k_order_b
              call: "POST /orders"
              payload: { offer_id: "${offer_b_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], message_count: 2, segment_count: 3 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { order_b_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_b_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 57037 }
              as: Agency
              as_user_id: "${partner_agy_id}"
          assert:
            - "Order.${order_a_id}.net_revenue_cents == 59560"
            - "Order.${order_b_id}.net_revenue_cents == 57037"
            - "Channel.${channel_ndc_id}.booking_count == 2"
            - "AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 116597"
            - "AgencyAgreement.${agreement_id}.incentive_accrued_cents == 1457"
            - "Channel.${channel_ndc_id}.cost_per_booking_flat_cents == 200000"
            - "Channel.${channel_ndc_id}.activity_cost_cents == 1729"
            - "Channel.${channel_ndc_id}.cost_per_booking_activity_cents == 865"
            - "the two variants disagree on identical input data: cost_per_booking_flat_cents - cost_per_booking_activity_cents == 199135"

      - name: certification_readiness_strict_zeroes_while_provisional_clears_minimum
        grounds:
          - calculations.certification_readiness_score
          - entities.PartnerCertification.fields.readiness_score_strict
          - entities.PartnerCertification.fields.readiness_score_provisional
          - entities.PartnerCertification.fields.mandatory_failed_count
          - state_machines.PartnerCertification.TESTING_to_CERTIFIED
          - validations[priority=30]
        distinguishing_aspect: |
          This dual variant lives in the CERTIFICATION-QUALITY domain on PartnerCertification, not in
          cost accounting: on the same three-test population STRICT stores 0 (one FAILED mandatory
          test zeroes it) while PROVISIONAL stores 93 by dropping that test from numerator AND
          denominator, so CERTIFY with readiness_variant=PROVISIONAL succeeds where STRICT is refused
          with ERR_READINESS_BELOW_MINIMUM.
        test_recipe:
          setup:
            - "Channel NDC_AGG registered."
            - "Technology provider Nexus registered and a PartnerCertification opened on NDC_AGG in CERT_ENV_A."
            - "Three connectivity tests, all resolved (none SCHEDULED): AUTH_HANDSHAKE mandatory PASSED score 95, ORDER_FLOW mandatory FAILED score 40, SHOP_FLOW optional PASSED score 88."
          setup_api_calls:
            - *k_ch_ndc
            - &k_tech_partner
              call: "POST /distribution-partners"
              payload: { partner_name: "Nexus Connect Ltd", partner_type: "TECH_PROVIDER", iata_code: "TP-0001", home_country: "IE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_tech_id: $.data.id }
            - &k_cert
              call: "POST /partner-certifications"
              payload: { partner_id: "${partner_tech_id}", channel_id: "${channel_ndc_id}", env_code: "CERT_ENV_A" }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: true, scheduled_start: "2026-08-10T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { test_auth_id: $.data.id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "ORDER_FLOW", is_mandatory: true, scheduled_start: "2026-08-10T11:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { test_order_id: $.data.id }
            - call: "POST /partner-certifications/${cert_id}/connectivity-tests"
              payload: { test_code: "SHOP_FLOW", is_mandatory: false, scheduled_start: "2026-08-10T13:00:00.000Z", duration_minutes: 30 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
              captures: { test_shop_id: $.data.id }
            - call: "POST /connectivity-tests/${test_auth_id}/outcome"
              payload: { outcome: "PASSED", score: 95 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
            - call: "POST /connectivity-tests/${test_shop_id}/outcome"
              payload: { outcome: "PASSED", score: 88 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
          trigger:
            - call: "POST /connectivity-tests/${test_order_id}/outcome"
              payload: { outcome: "FAILED", score: 40 }
              as: TechnologyPartner
              as_user_id: "${partner_tech_id}"
            - call: "POST /partner-certifications/${cert_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "STRICT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { strict_error: $.data.error_id }
            - call: "POST /partner-certifications/${cert_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "PROVISIONAL" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "PartnerCertification.${cert_id}.mandatory_failed_count == 1"
            - "PartnerCertification.${cert_id}.readiness_score_strict == 0"
            - "PartnerCertification.${cert_id}.readiness_score_provisional == 93"
            - "the STRICT decision call returns 422 with data.error_id == ERR_READINESS_BELOW_MINIMUM"
            - "the PROVISIONAL decision call returns 200 and PartnerCertification.${cert_id}.status == CERTIFIED"
            - "PartnerCertification.${cert_id}.certified_variant == PROVISIONAL"
            - "DistributionPartner.${partner_tech_id}.certification_status == CERTIFIED"
            - "PartnerCertification.${cert_id}.reserved_test_minutes == 0"

  # ===========================================================================
  # RULE 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: offer_subtotal_rounds_per_line_before_summing
        grounds:
          - calculations.offer_line_pricing
          - calculations.surcharge_amount
          - entities.OfferItem.fields.net_amount_cents
          - entities.Offer.fields.subtotal_cents
          - entities.Offer.fields.surcharge_cents
          - state_machines.Offer.null_to_CONSTRUCTED
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER changes the cents: the four non-surcharge lines each
          carry an exact .35 remainder, so rounding per line then summing yields subtotal_cents 58000
          while summing the exact rationals and rounding once would yield 58001; the scaffold pins the
          per-line order, and the surcharge stage then reads the pinned 58000 as its ALL scope base.
        test_recipe:
          setup:
            - "Channel NDC_AGG with content_markup_pct 0.035 and both surcharge rules (ANC_DISTR clamps at max_cents 400, DISTR_FEE clamps inside [500,1200])."
            - "FareFiling YNDC01 ACTIVE with base_amount_cents 45010; ancillaries BAG20 7010, SEAT_STD 3010, WIFI_FULL 1010 published."
            - "Travel agency Alpha registered; no agreement is needed because the offer is only constructed, never ordered."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing01_id}", ancillary_codes: ["BAG20", "SEAT_STD", "WIFI_FULL"], trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_round_id: $.data.id }
          assert:
            - "Offer.${offer_round_id}.subtotal_cents == 58000"
            - "Offer.${offer_round_id}.subtotal_cents != 58001"
            - "Offer.${offer_round_id}.surcharge_cents == 1560"
            - "Offer.${offer_round_id}.total_cents == 59560"
            - "Offer.${offer_round_id}.item_count == 6"
            - "GET /offers/${offer_round_id}/items returns sequence 1 FARE YNDC01 net_amount_cents == 46585"
            - "GET /offers/${offer_round_id}/items returns sequence 2 ANCILLARY BAG20 net_amount_cents == 7255"
            - "GET /offers/${offer_round_id}/items returns sequence 3 ANCILLARY SEAT_STD net_amount_cents == 3115"
            - "GET /offers/${offer_round_id}/items returns sequence 4 ANCILLARY WIFI_FULL net_amount_cents == 1045"
            - "GET /offers/${offer_round_id}/items returns sequence 5 SURCHARGE ANC_DISTR list_amount_cents == 571 and net_amount_cents == 400"
            - "GET /offers/${offer_round_id}/items returns sequence 6 SURCHARGE DISTR_FEE list_amount_cents == 1160 and net_amount_cents == 1160"

      - name: refund_settlement_pinned_step_order_fee_then_total_then_clawback
        grounds:
          - calculations.refund_settlement
          - entities.ServiceRequest.fields.refundable_base_cents
          - entities.ServiceRequest.fields.cancellation_fee_cents
          - entities.ServiceRequest.fields.refund_total_cents
          - entities.ServiceRequest.fields.incentive_clawback_cents
          - state_machines.ServiceRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a pinned evaluation order: the fee tier is keyed
          on the Step-1 refundable base (53840 -> the 50000..200000 band -> flat 7500, NOT the 5% high
          tier), the total is keyed on Steps 1-2 (46340) and the clawback is keyed on Step 3 plus the
          tier stored at approval time (TIER_1 -> 463), while the refund's own effect on the tier is
          deliberately excluded from Step 4.
        test_recipe:
          setup:
            - "OFFER_A ordered and CAPTUREd on NDC_AGG, so Order.net_revenue_cents == 59560 and the agreement's cumulative_net_revenue_cents == 59560 (incentive_tier TIER_1)."
            - "Only the FARE (46585, refundable) and BAG20 (7255, refundable) lines are refundable: SEAT_STD, WIFI_FULL and both SURCHARGE lines carry refundable == false."
            - "A REFUND ServiceRequest on that order has been moved to UNDER_REVIEW."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_agreement
            - *k_agreement_accept
            - *k_offer_a
            - *k_publish_a
            - *k_order_a
            - *k_capture_a
            - &k_sr_refund_a
              call: "POST /orders/${order_a_id}/service-requests"
              payload: { request_type: "REFUND" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { svc_refund_id: $.data.id }
            - &k_sr_refund_a_review
              call: "POST /service-requests/${svc_refund_id}/review"
              payload: { action: "START_REVIEW" }
              as: DistributionManager
              as_user_id: "dm-002"
          trigger:
            - call: "POST /service-requests/${svc_refund_id}/review"
              payload: { action: "APPROVE" }
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "ServiceRequest.${svc_refund_id}.status == APPROVED"
            - "ServiceRequest.${svc_refund_id}.refundable_base_cents == 53840"
            - "ServiceRequest.${svc_refund_id}.cancellation_fee_cents == 7500"
            - "ServiceRequest.${svc_refund_id}.refund_total_cents == 46340"
            - "ServiceRequest.${svc_refund_id}.incentive_clawback_cents == 463"
            - "Order.${order_a_id}.payment_status == PAID"
            - "Order.${order_a_id}.refunded_amount_cents == 0"
            - "AgencyAgreement.${agreement_id}.incentive_accrued_cents == 745"
            - "AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 59560"

  # ===========================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_counter_propose_cycle_reaches_signed_on_round_two
        grounds:
          - state_machines.AgencyAgreement.PROPOSED_to_COUNTERED
          - state_machines.AgencyAgreement.COUNTERED_to_PROPOSED
          - state_machines.AgencyAgreement.PROPOSED_to_SIGNED
          - entities.AgencyAgreement.fields.negotiation_round
          - entities.AgencyAgreement.fields.agreed_incentive_pct
          - validations[priority=14]
        distinguishing_aspect: |
          CYCLE on AgencyAgreement: PROPOSED -> COUNTERED -> PROPOSED is traversed twice on the same
          row before ACCEPT, so negotiation_round lands on 2 and agreed_incentive_pct freezes the LAST
          proposed value 0.025 rather than the original 0.02 — a shape no linear pipeline can produce.
        test_recipe:
          setup:
            - "Channel NDC_AGG and travel agency Alpha registered."
            - "An AgencyAgreement created by dm-001 at proposed_incentive_pct 0.02 (status PROPOSED, negotiation_round 0)."
            - "The agency counters at 0.05, the airline re-proposes 0.03, the agency counters at 0.04 and the airline re-proposes 0.025."
          setup_api_calls:
            - *k_ch_ndc
            - *k_agy_partner
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_ndc_id}", proposed_incentive_pct: 0.02, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { cyc_agreement_id: $.data.id }
            - call: "POST /agency-agreements/${cyc_agreement_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.05, note: "first counter" }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /agency-agreements/${cyc_agreement_id}/negotiation-rounds"
              payload: { action: "PROPOSE", proposed_incentive_pct: 0.03, note: "airline re-proposal" }
              as: DistributionManager
              as_user_id: "dm-001"
            - call: "POST /agency-agreements/${cyc_agreement_id}/negotiation-rounds"
              payload: { action: "COUNTER", proposed_incentive_pct: 0.04, note: "second counter" }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /agency-agreements/${cyc_agreement_id}/negotiation-rounds"
              payload: { action: "PROPOSE", proposed_incentive_pct: 0.025, note: "final airline proposal" }
              as: DistributionManager
              as_user_id: "dm-001"
          trigger:
            - call: "POST /agency-agreements/${cyc_agreement_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "AgencyAgreement.${cyc_agreement_id}.status == SIGNED"
            - "AgencyAgreement.${cyc_agreement_id}.negotiation_round == 2"
            - "AgencyAgreement.${cyc_agreement_id}.agreed_incentive_pct == 0.025"
            - "AgencyAgreement.${cyc_agreement_id}.proposed_incentive_pct == 0.025"
            - "AgencyAgreement.${cyc_agreement_id}.proposed_by_user_id == dm-001"
            - "AgencyAgreement.${cyc_agreement_id}.signed_by_user_id == dm-002"
            - "AgencyAgreement.${cyc_agreement_id}.cumulative_net_revenue_cents == 0"
            - "AgencyAgreement.${cyc_agreement_id}.incentive_tier == TIER_1"

      - name: order_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.Order.AUTHORIZED_to_PAID
          - state_machines.Order.RESERVED_to_TICKETED
          - state_machines.Order.TICKETED_to_FLOWN
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - validations[priority=11]
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on Order (a different entity from the cyclic AgencyAgreement): CAPTURE
          moves payment_status AUTHORIZED -> PAID while fulfillment_status stays RESERVED, and the two
          fulfillment actions then move RESERVED -> TICKETED -> FLOWN while payment_status remains
          exactly PAID — neither endpoint touches the other dimension.
        test_recipe:
          setup:
            - "OFFER_A published on NDC_AGG under a SIGNED agreement for travel agency Alpha."
            - "An Order created from OFFER_A, initially payment_status AUTHORIZED × fulfillment_status RESERVED."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_agreement
            - *k_agreement_accept
            - *k_offer_a
            - *k_publish_a
            - *k_order_a
          trigger:
            - call: "POST /orders/${order_a_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 59560 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /orders/${order_a_id}/fulfillment"
              payload: { action: "TICKET" }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - call: "POST /orders/${order_a_id}/fulfillment"
              payload: { action: "FLY" }
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "immediately after CAPTURE: Order.${order_a_id}.payment_status == PAID and Order.${order_a_id}.fulfillment_status == RESERVED"
            - "immediately after TICKET: Order.${order_a_id}.fulfillment_status == TICKETED and Order.${order_a_id}.payment_status == PAID"
            - "after FLY: Order.${order_a_id}.fulfillment_status == FLOWN and Order.${order_a_id}.payment_status == PAID"
            - "Order.${order_a_id}.paid_amount_cents == 59560"
            - "Order.${order_a_id}.refunded_amount_cents == 0"
            - "Channel.${channel_ndc_id}.booking_count == 1"

  # ===========================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: refund_apply_cascades_four_hops_order_channel_agreement_cost
        grounds:
          - state_machines.ServiceRequest.APPROVED_to_APPLIED
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.agency_incentive_accrual
          - calculations.distribution_cost_per_booking
          - entities.AgencyAgreement.fields.tier_downgrade_count
          - entities.Channel.fields.booking_count
        distinguishing_aspect: |
          Depth-4 chain originating from POST /service-requests/{id}/apply on a REFUND: hop 1 refunds
          the Order, hop 2 is caused by the order leaving the PAID revenue base (booking_count 1 -> 0,
          cumulative 5176200 -> 0), hop 3 is caused by that revenue decrement (incentive 68006 -> 0 and
          TIER_2 -> TIER_1 with tier_downgrade_count 0 -> 1) and hop 4 is caused by the accrual change
          (channel cost fields 400000/68122 -> 0/0). Each hop is caused by the previous one, not by the
          apply call itself.
        test_recipe:
          setup:
            - "Channel NDC_AGG with both surcharge rules; travel agency Alpha with a SIGNED agreement (agreed_incentive_pct 0.025, cap 1000000)."
            - "FareFiling YNDC02 ACTIVE with base_amount_cents 5000000, giving OFFER_C total_cents 5176200."
            - "One Order from OFFER_C with message_count 3 / segment_count 2, CAPTUREd, so cumulative_net_revenue_cents == 5176200, incentive_accrued_cents == 68006 and incentive_tier == TIER_2."
            - "A REFUND ServiceRequest on that order already APPROVED (refund_total_cents 4916250, incentive_clawback_cents 122906)."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - &k_filing02
              call: "POST /fare-filings"
              payload: { fare_basis_code: "YNDC02", origin: "FRA", destination: "JFK", cabin: "BUSINESS", base_amount_cents: 5000000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { filing02_id: $.data.id }
            - &k_filing02_filed
              call: "POST /fare-filings/${filing02_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - &k_filing02_active
              call: "POST /fare-filings/${filing02_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - *k_agreement
            - *k_agreement_accept
            - &k_offer_c
              call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_agy_id}", fare_filing_id: "${filing02_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "BUSINESS" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { offer_c_id: $.data.id }
            - &k_publish_c
              call: "POST /offers/${offer_c_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - &k_order_c
              call: "POST /orders"
              payload: { offer_id: "${offer_c_id}", disclosure_ack_codes: ["DOT-FARE-INCL"], message_count: 3, segment_count: 2 }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { order_c_id: $.data.id }
            - &k_capture_c
              call: "POST /orders/${order_c_id}/payment"
              payload: { action: "CAPTURE", payment_amount_cents: 5176200 }
              as: Agency
              as_user_id: "${partner_agy_id}"
            - &k_sr_refund_c
              call: "POST /orders/${order_c_id}/service-requests"
              payload: { request_type: "REFUND" }
              as: Agency
              as_user_id: "${partner_agy_id}"
              captures: { svc_refund_c_id: $.data.id }
            - &k_sr_refund_c_review
              call: "POST /service-requests/${svc_refund_c_id}/review"
              payload: { action: "START_REVIEW" }
              as: DistributionManager
              as_user_id: "dm-002"
            - &k_sr_refund_c_approve
              call: "POST /service-requests/${svc_refund_c_id}/review"
              payload: { action: "APPROVE" }
              as: DistributionManager
              as_user_id: "dm-002"
          trigger:
            - call: "POST /service-requests/${svc_refund_c_id}/apply"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-002"
          assert:
            - "ServiceRequest.${svc_refund_c_id}.status == APPLIED"
            - "ServiceRequest.${svc_refund_c_id}.refundable_base_cents == 5175000"
            - "ServiceRequest.${svc_refund_c_id}.cancellation_fee_cents == 258750"
            - "ServiceRequest.${svc_refund_c_id}.refund_total_cents == 4916250"
            - "ServiceRequest.${svc_refund_c_id}.incentive_clawback_cents == 122906"
            - "hop 1: Order.${order_c_id}.payment_status == REFUNDED and Order.${order_c_id}.fulfillment_status == CANCELLED and Order.${order_c_id}.refunded_amount_cents == 4916250"
            - "hop 2: Channel.${channel_ndc_id}.booking_count == 0 and AgencyAgreement.${agreement_id}.cumulative_net_revenue_cents == 0"
            - "hop 3: AgencyAgreement.${agreement_id}.incentive_accrued_cents == 0 and AgencyAgreement.${agreement_id}.incentive_tier == TIER_1 and AgencyAgreement.${agreement_id}.tier_downgrade_count == 1"
            - "hop 4: Channel.${channel_ndc_id}.activity_cost_cents == 0 and Channel.${channel_ndc_id}.cost_per_booking_flat_cents == 0 and Channel.${channel_ndc_id}.cost_per_booking_activity_cents == 0"
            - "incentive_accrued_cents is NOT reduced by incentive_clawback_cents: 0, not -122906"

      - name: certification_revoke_cascades_partner_agreement_offer
        grounds:
          - state_machines.PartnerCertification.CERTIFIED_to_REVOKED
          - state_machines.AgencyAgreement.SIGNED_to_SUSPENDED
          - state_machines.Offer.PUBLISHED_to_WITHDRAWN
          - entities.DistributionPartner.fields.certification_status
          - entities.PartnerCertification.fields.reserved_test_minutes
        distinguishing_aspect: |
          A cascade from a DIFFERENT trigger — POST /partner-certifications/{id}/decision with
          decision=REVOKE — propagates certification -> partner.certification_status -> the pair's
          SIGNED agreement -> that pair's PUBLISHED offer (depth 4), whereas the other instance
          originates from a service-request apply and propagates through money ledgers.
        test_recipe:
          setup:
            - "Channel NDC_AGG; travel agency Alpha registered."
            - "A PartnerCertification for (Alpha, NDC_AGG) on CERT_ENV_A, one mandatory test PASSED with score 90, decision CERTIFY with readiness_variant STRICT applied, so the certification is CERTIFIED and Alpha is CERTIFIED."
            - "A SIGNED AgencyAgreement for (Alpha, NDC_AGG) and one PUBLISHED offer built from FareFiling YNDC01."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_agy_partner
            - call: "POST /partner-certifications"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_ndc_id}", env_code: "CERT_ENV_A" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { cert_agy_id: $.data.id }
            - call: "POST /partner-certifications/${cert_agy_id}/connectivity-tests"
              payload: { test_code: "AUTH_HANDSHAKE", is_mandatory: true, scheduled_start: "2026-08-10T09:00:00.000Z", duration_minutes: 60 }
              as: TechnologyPartner
              as_user_id: "${partner_agy_id}"
              captures: { cert_test_id: $.data.id }
            - call: "POST /connectivity-tests/${cert_test_id}/outcome"
              payload: { outcome: "PASSED", score: 90 }
              as: TechnologyPartner
              as_user_id: "${partner_agy_id}"
            - call: "POST /partner-certifications/${cert_agy_id}/decision"
              payload: { decision: "CERTIFY", readiness_variant: "STRICT" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "GET /distribution-partners/${partner_agy_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_agy_v_after_cert: $.data.version }
            - call: "POST /agency-agreements"
              payload: { partner_id: "${partner_agy_id}", channel_id: "${channel_ndc_id}", proposed_incentive_pct: 0.025, incentive_cap_cents: 1000000, target_net_revenue_cents: 5000000, expected_partner_version: "${partner_agy_v_after_cert}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { rev_agreement_id: $.data.id }
            - call: "POST /agency-agreements/${rev_agreement_id}/negotiation-rounds"
              payload: { action: "ACCEPT" }
              as: DistributionManager
              as_user_id: "dm-002"
            - *k_anc_bag
            - *k_anc_seat
            - *k_anc_wifi
            - *k_filing01
            - *k_filing01_filed
            - *k_filing01_active
            - *k_offer_a
            - *k_publish_a
          trigger:
            - call: "POST /partner-certifications/${cert_agy_id}/decision"
              payload: { decision: "REVOKE" }
              as: PlatformAdmin
              as_user_id: "admin-001"
          assert:
            - "hop 1: PartnerCertification.${cert_agy_id}.status == REVOKED and PartnerCertification.${cert_agy_id}.reserved_test_minutes == 0"
            - "hop 2: DistributionPartner.${partner_agy_id}.certification_status == UNCERTIFIED"
            - "hop 3: AgencyAgreement.${rev_agreement_id}.status == SUSPENDED"
            - "hop 4: Offer.${offer_a_id}.status == WITHDRAWN"
            - "PartnerCertification.${cert_agy_id}.readiness_score_strict == 90"
            - "PartnerCertification.${cert_agy_id}.certified_variant == STRICT"

  # ===========================================================================
  # RULE 5 — priority-pair validation conflicts on different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: fare_filing_not_active_outranks_contract_cap_exceeded
        grounds:
          - validations[priority=8]
          - validations[priority=31]
          - errors.ERR_FARE_FILING_NOT_ACTIVE
          - errors.ERR_CONTRACT_CAP_EXCEEDED
          - entities.CorporateContract.fields.max_offer_total_cents
        distinguishing_aspect: |
          Category pair `state` (priority 8) versus `business_fiscal` (priority 31): the same
          POST /offers call violates BOTH — the private filing is still DRAFT and the offer it would
          price (9316200) is 93x the contract's max_offer_total_cents (100000) — and the response must
          carry ERR_FARE_FILING_NOT_ACTIVE with HTTP 409, never the fiscal 422.
        test_recipe:
          setup:
            - "Channel NDC_AGG registered (content_tier STANDARD, rank 2)."
            - "Corporate partner Zenith registered."
            - "Private FareFiling PRIV01 filed with base_amount_cents 9000000 and LEFT IN DRAFT (never FILED, never ACTIVE)."
            - "CorporateContract on PRIV01 with max_offer_total_cents 100000, min_content_tier_rank 2, effective window [2026-07-01, 2026-12-01) so validity_state is IN_EFFECT at the 2026-08-01 startup clock."
            - "Every other precondition of POST /offers is satisfied: the sale window is open, departure_date is inside the travel window, the channel's rank clears every min_content_tier_rank, and the private-fare linkage is correct."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - &k_corp_partner
              call: "POST /distribution-partners"
              payload: { partner_name: "Zenith Industries AG", partner_type: "CORPORATE", iata_code: "CORP-0001", home_country: "CH" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_corp_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "PRIV01", origin: "FRA", destination: "JFK", cabin: "BUSINESS", base_amount_cents: 9000000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 2, refundable: true, is_private: true }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { priv01_id: $.data.id }
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${priv01_id}", account_code: "ZEN-CAP", max_offer_total_cents: 100000, traceability_required: true, tracking_ref_prefix: "CORP-", min_content_tier_rank: 2, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-01T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_cap_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${priv01_id}", corporate_contract_id: "${contract_cap_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "BUSINESS" }
              as: Agency
              as_user_id: "${partner_corp_id}"
              captures: { pair1_error: $.data.error_id }
          assert:
            - "the call returns HTTP 409 and data.error_id == ERR_FARE_FILING_NOT_ACTIVE"
            - "data.error_id != ERR_CONTRACT_CAP_EXCEEDED even though the priced total 9316200 exceeds max_offer_total_cents 100000"
            - "no Offer row is created: GET /offers?partner_id=${partner_corp_id} has total_count == 0"
            - "FareFiling.${priv01_id}.status is still DRAFT"

      - name: disclosure_incomplete_outranks_corporate_tracking_ref_missing
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - errors.ERR_DISCLOSURE_INCOMPLETE
          - errors.ERR_CORPORATE_TRACKING_REF_MISSING
          - calculations.disclosure_completeness
          - entities.CorporateContract.fields.traceability_required
        distinguishing_aspect: |
          A DIFFERENT category pair — `business_safety` (priority 15) versus `business_referential`
          (priority 18) — evaluated on POST /orders rather than POST /offers: the request omits
          corporate_tracking_ref AND submits an empty disclosure_ack_codes against a channel that
          requires DOT-FARE-INCL, and the regulatory-display error must win over the traceability one.
        test_recipe:
          setup:
            - "Channel NDC_AGG with required_disclosure_codes [\"DOT-FARE-INCL\"]."
            - "Corporate partner Zenith with a CorporateContract on private filing PRIV02 (traceability_required true, tracking_ref_prefix CORP-, max_offer_total_cents 200000)."
            - "PRIV02 driven DRAFT -> FILED -> ACTIVE with base_amount_cents 45010, so the offer prices to total_cents 46585 (below the cap, and below the DISTR_FEE threshold so no surcharge line is emitted)."
            - "The offer is constructed and PUBLISHED with disclosure_ack_codes [\"DOT-FARE-INCL\"]; the ordering partner is CORPORATE, so the agency-agreement gate at priority 12 does not apply."
          setup_api_calls:
            - *k_ch_ndc
            - *k_sr_anc
            - *k_sr_all
            - *k_corp_partner
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "PRIV02", origin: "FRA", destination: "JFK", cabin: "ECONOMY", base_amount_cents: 45010, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 2, refundable: true, is_private: true }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { priv02_id: $.data.id }
            - call: "POST /fare-filings/${priv02_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${priv02_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /corporate-contracts"
              payload: { corporate_partner_id: "${partner_corp_id}", negotiated_fare_filing_id: "${priv02_id}", account_code: "ZEN-TRACE", max_offer_total_cents: 200000, traceability_required: true, tracking_ref_prefix: "CORP-", min_content_tier_rank: 2, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2026-12-01T00:00:00.000Z" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { contract_trace_id: $.data.id }
            - call: "POST /offers"
              payload: { channel_id: "${channel_ndc_id}", partner_id: "${partner_corp_id}", fare_filing_id: "${priv02_id}", corporate_contract_id: "${contract_trace_id}", trip_origin: "FRA", trip_destination: "JFK", departure_date: "2026-09-15T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_corp_id}"
              captures: { offer_corp_id: $.data.id }
            - call: "POST /offers/${offer_corp_id}/publish"
              payload: { disclosure_ack_codes: ["DOT-FARE-INCL"] }
              as: Agency
              as_user_id: "${partner_corp_id}"
          trigger:
            - call: "POST /orders"
              payload: { offer_id: "${offer_corp_id}", disclosure_ack_codes: [] }
              as: Agency
              as_user_id: "${partner_corp_id}"
              captures: { pair2_error: $.data.error_id }
          assert:
            - "the call returns HTTP 422 and data.error_id == ERR_DISCLOSURE_INCOMPLETE"
            - "data.error_id != ERR_CORPORATE_TRACKING_REF_MISSING even though corporate_tracking_ref was omitted for a traceability_required contract"
            - "Offer.${offer_corp_id}.status is still PUBLISHED — the failed order did not consume the offer"
            - "Offer.${offer_corp_id}.total_cents == 46585"
            - "GET /orders?offer_id=${offer_corp_id} has total_count == 0"

  # ===========================================================================
  # RULE 6 — boundary / precision checks on different boundary kinds
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: incentive_tier_two_entry_is_inclusive_at_tier_one_ceiling
        grounds:
          - calculations.agency_incentive_accrual
          - entities.AgencyAgreement.fields.incentive_tier
          - entities.AgencyAgreement.fields.incentive_accrued_cents
          - entities.Channel.fields.cost_per_booking_flat_cents
          - state_machines.Order.AUTHORIZED_to_PAID
        distinguishing_aspect: |
          INCLUSIVE NUMERIC THRESHOLD at exactly TIER_1_CEILING_CENTS: two agreements accrue the
          identical rounded amount 50000 (R = 5000000 gives 5000000 * 0.010 = 50000 exactly, and
          R = 4999999 gives 49999.99 which round_half_up lifts to 50000), yet the tier label differs —
          5000000 is already TIER_2 while 4999999 is still TIER_1. Equal money, different tier: only
          the inclusive boundary distinguishes them.
        test_recipe:
          setup:
            - "Channel DIRECT_WEB: DIRECT, content_tier FULL, content_markup_pct 0, incentive_multiplier 1.0, monthly_platform_fee_cents 1000000, per_message_cost_cents 5, per_segment_fee_cents 0, required_disclosure_codes [\"DOT-FARE-INCL\", \"EU-TAX-BRKDN\"], and NO surcharge rules, so every offer's total_cents equals the filed base amount."
            - "Travel agencies Beta and Gamma, each with its own SIGNED agreement on DIRECT_WEB at agreed_incentive_pct 0.025 and incentive_cap_cents 1000000."
            - "FareFiling YBOUND1 ACTIVE at base_amount_cents 5000000 and FareFiling YBOUND2 ACTIVE at base_amount_cents 4999999 (different fare_basis_codes, so the sale-window overlap rule does not apply)."
            - "Beta orders YBOUND1 and Gamma orders YBOUND2; both orders acknowledge both disclosure codes."
          setup_api_calls:
            - call: "POST /channels"
