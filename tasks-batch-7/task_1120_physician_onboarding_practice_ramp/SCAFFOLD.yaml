scenario: |
  generate task hard than expert level! 1120. Physician Onboarding & Practice Ramp (health system provider onboarding): offer/contract execution & start-date dependencies, licensure/DEA & payer enrollment critical path, EHR training & template building, panel opening & schedule template build, referral marketing & community introduction, income guarantee & ramp milestone tracking, mentorship & first-year check-ins, retention risk monitoring
domain_name: physician-onboarding-practice-ramp
api_prefix: /onboarding

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician legal full name" }
      - { name: specialty, type: enum, source: input, description: "Primary specialty; constrains mentor matching and required weekly clinic minutes", constraints: "one of FAMILY_MEDICINE, INTERNAL_MEDICINE, CARDIOLOGY, ORTHOPEDICS, PEDIATRICS" }
      - { name: email, type: string, source: input, description: "Contact email; unique per physician" }
      - { name: hire_type, type: enum, source: input, description: "Hire classification driving required training modules and template quotas", constraints: "one of NEW_GRAD, EXPERIENCED, LEADERSHIP" }
      - { name: status, type: enum, source: system, description: "Lifecycle: PROSPECT at creation, ONBOARDING once an OnboardingCase exists, ACTIVE once the panel opens, SEPARATED via separation action", default: PROSPECT, constraints: "one of PROSPECT, ONBOARDING, ACTIVE, SEPARATED" }

  - name: OnboardingCase
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; exactly one OnboardingCase per Physician" }
      - { name: target_start_date, type: string, source: input, description: "Desired start date (ISO date) recorded at case creation; informational only" }
      - { name: actual_start_date, type: string, source: computed, description: "Locked start date copied from the EXECUTED offer's proposed_start_date; null until an offer executes" }
      - { name: case_status, type: enum, source: system, description: "IN_PROGRESS at creation; HIRED when the panel opens; SEPARATED when the physician separates", default: IN_PROGRESS, constraints: "one of IN_PROGRESS, HIRED, SEPARATED" }
      - { name: credential_status, type: enum, source: computed, description: "Parallel dimension: NOT_STARTED (no items), IN_PROGRESS, COMPLETE (every required item type has an APPROVED item and no item is BLOCKED/EXPIRED/LAPSED), BLOCKED (any item BLOCKED/EXPIRED/LAPSED). Precedence BLOCKED > COMPLETE > IN_PROGRESS > NOT_STARTED", default: NOT_STARTED, constraints: "one of NOT_STARTED, IN_PROGRESS, COMPLETE, BLOCKED" }
      - { name: training_status, type: enum, source: computed, description: "Parallel dimension mirroring the TrainingPlan: NOT_STARTED (no plan), IN_PROGRESS (plan PLANNED/IN_PROGRESS/AWAITING_SIGNOFF), COMPLETE (plan COMPLETE)", default: NOT_STARTED, constraints: "one of NOT_STARTED, IN_PROGRESS, COMPLETE" }
      - { name: practice_status, type: enum, source: computed, description: "Parallel dimension: PLANNING (no ACTIVE ScheduleTemplate), BUILDING (some ACTIVE but weekly_active_minutes < required), READY (weekly_active_minutes >= required for specialty)", default: PLANNING, constraints: "one of PLANNING, BUILDING, READY" }
      - { name: posture, type: enum, source: computed, description: "Derived gate: PRE_CONTRACT (no EXECUTED offer), CREDENTIALING (offer EXECUTED and credential_status != COMPLETE), RAMP_PREP (credential COMPLETE but training or practice not done), GO_LIVE_READY (credential COMPLETE AND training COMPLETE AND practice READY), LIVE (panel OPEN; a FROZEN panel recomputes posture from the components)", default: PRE_CONTRACT, constraints: "one of PRE_CONTRACT, CREDENTIALING, RAMP_PREP, GO_LIVE_READY, LIVE" }
      - { name: weekly_active_minutes, type: integer, source: computed, description: "Sum over ACTIVE ScheduleTemplates of (end_minute - start_minute) for block_type in {CLINIC, PROCEDURE, OR}; ADMIN excluded", default: 0 }
      - { name: attained_milestone_count, type: integer, source: computed, description: "Count of RampMilestones ATTESTED with attained == true", default: 0 }
      - { name: missed_milestone_count, type: integer, source: computed, description: "Count of RampMilestones ATTESTED with attained == false plus LAPSED", default: 0 }
      - { name: latest_risk_score, type: number, source: computed, description: "Score of the most recently created RetentionRiskSnapshot; null until one exists" }
      - { name: latest_risk_band, type: enum, source: computed, description: "Band of the most recent snapshot; null until one exists", constraints: "null or one of LOW, MODERATE, HIGH, CRITICAL" }
      - { name: at_risk, type: boolean, source: computed, description: "true when latest_risk_band in {HIGH, CRITICAL}; also forced true immediately when a CRISIS check-in is recorded", default: false }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id" }
      - { name: base_salary_cents, type: integer, source: input, description: "Annual base salary in cents" }
      - { name: signing_bonus_cents, type: integer, source: input, description: "One-time signing bonus in cents" }
      - { name: guarantee_monthly_cents, type: integer, source: input, description: "Monthly income guarantee amount in cents" }
      - { name: guarantee_term_months, type: integer, source: input, description: "Number of guarantee months; drives RampMilestone generation count", constraints: "1..24" }
      - { name: panel_capacity, type: integer, source: input, description: "Panel size capacity that the executed offer provisions", constraints: ">= 1" }
      - { name: proposed_start_date, type: string, source: input, description: "ISO date; validated at execute time against the credential critical path plus buffer" }
      - { name: expires_at, type: string, source: input, description: "ISO datetime after which a non-accepted offer lapses (EXPIRED via epoch sweep; accept/counter also refuse past this instant)" }
      - { name: negotiation_round, type: integer, source: system, description: "Number of physician counter-offers recorded; incremented on each counter; hard limit MAX_NEGOTIATION_ROUNDS = 5", default: 0 }
      - { name: status, type: enum, source: system, description: "Negotiation lifecycle with a cyclic EXTENDED <-> COUNTERED loop", default: DRAFT, constraints: "one of DRAFT, EXTENDED, COUNTERED, ACCEPTED, EXECUTED, SUPERSEDED, WITHDRAWN, DECLINED, EXPIRED" }

  - name: CredentialItem
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id" }
      - { name: item_type, type: enum, source: input, description: "Credential category; STATE_LICENSE, DEA_REGISTRATION, PAYER_ENROLLMENT_MEDICARE are required types for credential completeness", constraints: "one of STATE_LICENSE, DEA_REGISTRATION, BOARD_CERTIFICATION, PAYER_ENROLLMENT_MEDICARE, PAYER_ENROLLMENT_COMMERCIAL, HOSPITAL_PRIVILEGES" }
      - { name: payer_code, type: string, source: input, description: "Payer identifier; required iff item_type is PAYER_ENROLLMENT_MEDICARE or PAYER_ENROLLMENT_COMMERCIAL" }
      - { name: depends_on_item_ids, type: array, source: input, description: "FK -> CredentialItem.id; array of prerequisite CredentialItem ids forming an acyclic dependency DAG (deps must pre-exist, so cycles are impossible by construction)", default: [] }
      - { name: document_ref, type: string, source: input, description: "Document reference supplied at creation or refreshed on submit-docs" }
      - { name: expires_on, type: string, source: input, description: "ISO date the underlying credential lapses; required for STATE_LICENSE and DEA_REGISTRATION; epoch sweep flips items to EXPIRED when expires_on < current date" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID recorded on the latest submit-docs; segregation-of-duties anchor" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID recorded on verify; must differ from submitted_by_user_id" }
      - { name: blocked_from_status, type: enum, source: system, description: "Status the item held when dependency failure blocked it; restored when all dependencies return to APPROVED", constraints: "null or one of PENDING, DOCS_SUBMITTED, VERIFIED, FILED" }
      - { name: status, type: enum, source: system, description: "Credential pipeline state with REJECTED -> DOCS_SUBMITTED resubmission loop", default: PENDING, constraints: "one of PENDING, DOCS_SUBMITTED, VERIFIED, FILED, APPROVED, REJECTED, BLOCKED, EXPIRED, LAPSED" }

  - name: TrainingPlan
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id; exactly one plan per case, auto-created at offer execution" }
      - { name: required_module_count, type: integer, source: system, description: "3 required modules (EHR_FUNDAMENTALS, ORDER_ENTRY, NOTE_TEMPLATES); 4 when hire_type == NEW_GRAD (adds BILLING)", default: 0 }
      - { name: templates_required, type: integer, source: system, description: "EHR note templates the physician must build inside NOTE_TEMPLATES: 5 for NEW_GRAD, else 3", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED at creation; IN_PROGRESS when the first module is scheduled; AWAITING_SIGNOFF when every required module is COMPLETED; COMPLETE after practice-manager signoff", default: PLANNED, constraints: "one of PLANNED, IN_PROGRESS, AWAITING_SIGNOFF, COMPLETE" }

  - name: TrainingModule
    parent: null
    common_fields: true
    fields:
      - { name: training_plan_id, type: string, source: input, description: "FK -> TrainingPlan.id" }
      - { name: module_code, type: enum, source: input, description: "Module identity; unique within a plan", constraints: "one of EHR_FUNDAMENTALS, ORDER_ENTRY, NOTE_TEMPLATES, BILLING" }
      - { name: required, type: boolean, source: input, description: "Required modules gate plan signoff; electives do not", default: false }
      - { name: scheduled_on, type: string, source: input, description: "ISO date the session is scheduled for; set by schedule action" }
      - { name: score, type: integer, source: input, description: "Assessment score 0..100 recorded at completion; PASS_SCORE = 80 (>= passes, exactly 80 passes)" }
      - { name: templates_built_count, type: integer, source: input, description: "Note templates built; required only for NOTE_TEMPLATES completion" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED -> SCHEDULED -> COMPLETED | FAILED; FAILED may be re-scheduled (retake cycle)", default: NOT_STARTED, constraints: "one of NOT_STARTED, SCHEDULED, COMPLETED, FAILED" }

  - name: ScheduleTemplate
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id" }
      - { name: weekday, type: integer, source: input, description: "Day of week 1 (Mon) .. 7 (Sun)", constraints: "1..7" }
      - { name: start_minute, type: integer, source: input, description: "Minutes from midnight, inclusive lower bound of the half-open block", constraints: "0..1439, < end_minute" }
      - { name: end_minute, type: integer, source: input, description: "Minutes from midnight, exclusive upper bound (half-open interval)", constraints: "1..1440" }
      - { name: block_type, type: enum, source: input, description: "Block category; CLINIC, PROCEDURE and OR count toward weekly_active_minutes; ADMIN does not", constraints: "one of CLINIC, PROCEDURE, OR, ADMIN" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED", default: DRAFT, constraints: "one of DRAFT, ACTIVE, RETIRED" }

  - name: Panel
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id; exactly one panel per case, auto-created at offer execution with capacity from the offer" }
      - { name: capacity, type: integer, source: system, description: "Maximum empanelled patients; copied from the executing offer's panel_capacity" }
      - { name: current_size, type: integer, source: computed, description: "Empanelled census; equals the sum of all applied census-adjustment deltas plus referrals from HELD campaign events", default: 0 }
      - { name: opened_at, type: string, source: system, description: "ISO datetime the panel first opened; null until open" }
      - { name: status, type: enum, source: system, description: "NOT_OPEN -> OPEN -> FROZEN <-> OPEN; CLOSED terminal via physician separation cascade", default: NOT_OPEN, constraints: "one of NOT_OPEN, OPEN, FROZEN, CLOSED" }

  - name: ReferralCampaign
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: budget_cents, type: integer, source: input, description: "Total marketing budget in cents", constraints: ">= 0" }
      - { name: spent_cents, type: integer, source: computed, description: "Invariant: equals the sum of cost_cents over the campaign's CampaignEvents with status in {PLANNED, HELD}; debited at event creation, refunded at cancel", default: 0 }
      - { name: referrals_attributed, type: integer, source: computed, description: "Sum of referrals_generated over HELD CampaignEvents", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> COMPLETED", default: DRAFT, constraints: "one of DRAFT, ACTIVE, COMPLETED" }

  - name: CampaignEvent
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> ReferralCampaign.id" }
      - { name: event_type, type: enum, source: input, description: "Community introduction or referral marketing activity type", constraints: "one of COMMUNITY_TALK, REFERRAL_DINNER, MEDIA, OPEN_HOUSE" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive lower bound of the closed event window", constraints: "<= end_date" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive upper bound; two non-CANCELLED events of one campaign may not share any date (closed-interval overlap, adjacency conflicts)", constraints: ">= start_date" }
      - { name: cost_cents, type: integer, source: input, description: "Event cost debited from the campaign budget at creation", constraints: ">= 0" }
      - { name: venue, type: string, source: input, description: "Event venue" }
      - { name: referrals_generated, type: integer, source: input, description: "Attributed referrals recorded when the event is held", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED -> HELD | CANCELLED; CANCELLED refunds cost_cents to the campaign", default: PLANNED, constraints: "one of PLANNED, HELD, CANCELLED" }

  - name: IncomeGuarantee
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id; exactly one guarantee per case, auto-created at offer execution" }
      - { name: monthly_guarantee_cents, type: integer, source: system, description: "Copied from the executing offer's guarantee_monthly_cents" }
      - { name: term_months, type: integer, source: system, description: "Copied from the executing offer's guarantee_term_months" }
      - { name: start_month, type: string, source: system, description: "YYYY-MM of actual_start_date; RampMilestone month_offset 1 maps to this month" }
      - { name: months_reconciled, type: integer, source: computed, description: "Count of term months whose milestone is ATTESTED or LAPSED", default: 0 }
      - { name: total_advanced_cents, type: integer, source: computed, description: "ACTUAL variant total: sum of monthly draws over ATTESTED/LAPSED months only, in month_offset order", default: 0 }
      - { name: projected_total_draw_cents, type: integer, source: computed, description: "PROJECTED variant total: actual draws so far plus monthly_guarantee_cents for every unreconciled term month (assumes zero future collections)", default: 0 }
      - { name: forgiveness_accrued_cents, type: integer, source: computed, description: "FORGIVENESS_PER_ATTAINED_MONTH_CENTS (100000) times the number of ATTESTED months with attained == true", default: 0 }
      - { name: total_repaid_cents, type: integer, source: computed, description: "Sum of all posted repayments", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "max(0, total_advanced_cents - total_repaid_cents - forgiveness_accrued_cents), evaluated in that pinned order", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT at creation; ACTIVE after activation (gate for milestone attestation); SETTLED when every term month is ATTESTED/LAPSED or the physician separates", default: DRAFT, constraints: "one of DRAFT, ACTIVE, SETTLED" }

  - name: RampMilestone
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id; one row per term month, auto-created at offer execution" }
      - { name: month_offset, type: integer, source: system, description: "1-based month of the ramp term; unique within a case; reporting window closes on the 15th of the following month (REPORT_GRACE_DAYS = 15)" }
      - { name: target_wrvu, type: integer, source: system, description: "Target from WRVU_TARGET_CURVE[month_offset] = [100,150,200,250,300,350,400,420,440,460,480,500]" }
      - { name: actual_wrvu, type: integer, source: input, description: "Reported production wRVUs for the month" }
      - { name: collections_cents, type: integer, source: input, description: "Reported collections for the month in cents" }
      - { name: attained, type: boolean, source: computed, description: "Computed at attestation: actual_wrvu >= target_wrvu (exact equality attains)" }
      - { name: status, type: enum, source: system, description: "PENDING -> REPORTED -> ATTESTED; PENDING past its reporting window flips to LAPSED via epoch sweep", default: PENDING, constraints: "one of PENDING, REPORTED, ATTESTED, LAPSED" }

  - name: MentorshipAssignment
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id; at most one ACTIVE assignment per case (a new ACTIVE assignment supersedes the previous one)" }
      - { name: mentor_physician_id, type: string, source: input, description: "FK -> Physician.id; must be an ACTIVE physician, same specialty as the mentee, and not the mentee" }
      - { name: checkins_recorded, type: integer, source: computed, description: "Count of CheckIn rows recorded for this assignment", default: 0 }
      - { name: escalated, type: boolean, source: computed, description: "Set true when a CRISIS check-in is recorded", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE at creation; SUPERSEDED when a replacement assignment is created; COMPLETED after all five check-ins", default: ACTIVE, constraints: "one of ACTIVE, SUPERSEDED, COMPLETED" }

  - name: CheckIn
    parent: null
    common_fields: false
    fields:
      - { name: mentorship_id, type: string, source: input, description: "FK -> MentorshipAssignment.id" }
      - { name: day_marker, type: enum, source: input, description: "First-year check-in marker; must be recorded strictly in ascending order and at most once each", constraints: "one of D30, D90, D180, D270, D365" }
      - { name: sentiment, type: enum, source: input, description: "Mentor-reported sentiment feeding the retention risk score", constraints: "one of POSITIVE, NEUTRAL, CONCERN, CRISIS" }
      - { name: occurred_on, type: string, source: system, description: "ISO date taken from the logical clock at recording time" }
      - { name: notes, type: string, source: input, description: "Free-form mentor notes" }

  - name: RetentionRiskSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: onboarding_case_id, type: string, source: input, description: "FK -> OnboardingCase.id" }
      - { name: variant, type: enum, source: input, description: "TRAILING uses only attested history; LEADING additionally counts unreported elapsed months as missed and projects next-month panel expectations", constraints: "one of TRAILING, LEADING" }
      - { name: milestone_risk, type: number, source: computed, description: "Component 0..100, weight 0.35" }
      - { name: panel_risk, type: number, source: computed, description: "Component 0..100, weight 0.25" }
      - { name: sentiment_risk, type: number, source: computed, description: "Component 0..100, weight 0.25" }
      - { name: schedule_risk, type: number, source: computed, description: "Component 0..100, weight 0.15" }
      - { name: score, type: number, source: computed, description: "Weighted sum with per-component rounding pinned (round each weighted term to 2dp HALF_UP, then sum)" }
      - { name: risk_band, type: enum, source: computed, description: "score >= 75 CRITICAL; >= 50 HIGH; >= 25 MODERATE; else LOW (lower bounds inclusive)", constraints: "one of LOW, MODERATE, HIGH, CRITICAL" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Physician
    initial_state: PROSPECT
    terminal_states: [SEPARATED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "POST /onboarding/onboarding-cases (cascade when the case is created)"
        actor: system
        preconditions: ["Physician.status == PROSPECT"]
        side_effects: ["Physician.status := ONBOARDING", "Physician.version += 1"]
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /onboarding/panels/{id}/open (cascade when the panel opens)"
        actor: system
        preconditions: ["Panel open succeeds"]
        side_effects: ["Physician.status := ACTIVE", "OnboardingCase.case_status := HIRED", "Physician.version += 1"]
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /onboarding/physicians/{id}/mark-active"
        actor: OnboardingDirector
        preconditions: ["Physician.status == PROSPECT (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Physician.status := ACTIVE", "Physician.version += 1"]
        note: "Marks a pre-existing staff physician (not in onboarding) as active so it can serve as a mentor"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /onboarding/physicians/{id}/separate"
        actor: OnboardingDirector
        preconditions: ["Physician.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Panel of the physician's case: OPEN or FROZEN -> CLOSED (if not NOT_OPEN/CLOSED)"
          - "MentorshipAssignment ACTIVE -> COMPLETED for the case"
          - "IncomeGuarantee ACTIVE -> SETTLED for the case (outstanding balance becomes final)"
          - "ReferralCampaign ACTIVE -> COMPLETED for the case"
          - "OnboardingCase.case_status := SEPARATED; OnboardingCase.version += 1"

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [EXECUTED, SUPERSEDED, WITHDRAWN, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: EXTENDED
        trigger: "POST /onboarding/offers/{id}/extend"
        actor: Recruiter
        preconditions: ["Offer.status == DRAFT (ERR_OFFER_NOT_EXTENDABLE otherwise)"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: COUNTERED
        to: EXTENDED
        trigger: "POST /onboarding/offers/{id}/extend (re-extension with revised terms)"
        actor: Recruiter
        preconditions: ["Offer.status == COUNTERED (ERR_OFFER_NOT_EXTENDABLE otherwise)"]
        side_effects: ["Optional term fields overwrite prior terms", "Offer.version += 1", "OnboardingCase.version += 1"]
        note: "This backward hop COUNTERED -> EXTENDED makes the machine cyclic: EXTENDED -> COUNTERED -> EXTENDED negotiation rounds"
      - from: EXTENDED
        to: COUNTERED
        trigger: "POST /onboarding/offers/{id}/counter"
        actor: Physician
        preconditions:
          - "Offer.status == EXTENDED (ERR_NEGOTIATION_NOT_OPEN otherwise)"
          - "logical clock < Offer.expires_at (ERR_OFFER_EXPIRED)"
          - "Offer.negotiation_round < MAX_NEGOTIATION_ROUNDS (5) (ERR_NEGOTIATION_ROUND_LIMIT); the 5th counter (round 4 -> 5) succeeds, the 6th fails"
          - "X-User-ID == physician of the offer's case (ERR_FORBIDDEN)"
        side_effects: ["Offer.negotiation_round += 1", "Offer.version += 1", "OnboardingCase.version += 1"]
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /onboarding/offers/{id}/accept"
        actor: Physician
        preconditions:
          - "Offer.status in {EXTENDED, COUNTERED} (ERR_NEGOTIATION_NOT_OPEN otherwise)"
          - "logical clock < Offer.expires_at (ERR_OFFER_EXPIRED)"
          - "X-User-ID == physician of the offer's case (ERR_FORBIDDEN)"
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /onboarding/offers/{id}/accept"
        actor: Physician
        preconditions: ["same as EXTENDED -> ACCEPTED"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /onboarding/offers/{id}/execute"
        actor: ContractAdministrator
        preconditions:
          - "Offer.status == ACCEPTED (ERR_OFFER_NOT_ACCEPTED otherwise)"
          - "proposed_start_date >= current logical date + credential critical path remaining days + START_DATE_BUFFER_DAYS (14) (ERR_START_DATE_BEFORE_CREDENTIAL_ETA)"
        side_effects:
          - "If another EXECUTED offer exists on the case (amendment): that offer -> SUPERSEDED; the DRAFT IncomeGuarantee's monthly_guarantee_cents/term_months are overwritten; Panel.capacity overwritten"
          - "Else create: IncomeGuarantee (DRAFT, terms from offer, start_month = month of proposed_start_date); TrainingPlan (PLANNED) with auto-created required TrainingModules; Panel (NOT_OPEN, capacity from offer); guarantee_term_months RampMilestones (PENDING, month_offset 1..N, target from WRVU_TARGET_CURVE)"
          - "OnboardingCase.actual_start_date := proposed_start_date; posture recomputed (becomes CREDENTIALING unless credential_status already COMPLETE)"
          - "Offer.version += 1; OnboardingCase.version += 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /onboarding/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: ["Offer.status in {DRAFT, EXTENDED, COUNTERED, ACCEPTED} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: EXTENDED
        to: WITHDRAWN
        trigger: "POST /onboarding/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /onboarding/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /onboarding/offers/{id}/withdraw"
        actor: Recruiter
        preconditions: ["same as DRAFT -> WITHDRAWN"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /onboarding/offers/{id}/decline"
        actor: Physician
        preconditions: ["Offer.status in {EXTENDED, COUNTERED} (ERR_NEGOTIATION_NOT_OPEN otherwise)", "X-User-ID == physician of the case (ERR_FORBIDDEN)"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /onboarding/offers/{id}/decline"
        actor: Physician
        preconditions: ["same as EXTENDED -> DECLINED"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep: expires_at < logical clock)"
        actor: system
        preconditions: ["Offer.expires_at < current logical clock"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep)"
        actor: system
        preconditions: ["Offer.expires_at < current logical clock"]
        side_effects: ["Offer.version += 1", "OnboardingCase.version += 1"]
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "POST /onboarding/offers/{id}/execute on the amendment offer (cascade onto the prior executed offer)"
        actor: system
        preconditions: ["An amendment offer executes while this offer is EXECUTED"]
        side_effects: ["Offer.version += 1"]

  - entity: CredentialItem
    initial_state: PENDING
    terminal_states: [APPROVED, EXPIRED, LAPSED]
    transitions:
      - from: PENDING
        to: DOCS_SUBMITTED
        trigger: "POST /onboarding/credential-items/{id}/submit-docs"
        actor: CredentialingSpecialist
        preconditions: ["CredentialItem.status in {PENDING, REJECTED} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["submitted_by_user_id := X-User-ID", "document_ref refreshed if supplied", "CredentialItem.version += 1", "OnboardingCase.version += 1"]
      - from: REJECTED
        to: DOCS_SUBMITTED
        trigger: "POST /onboarding/credential-items/{id}/submit-docs (resubmission loop)"
        actor: CredentialingSpecialist
        preconditions: ["same as PENDING -> DOCS_SUBMITTED"]
        side_effects: ["same as PENDING -> DOCS_SUBMITTED"]
      - from: DOCS_SUBMITTED
        to: VERIFIED
        trigger: "POST /onboarding/credential-items/{id}/verify"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == DOCS_SUBMITTED (ERR_ITEM_NOT_SUBMITTED otherwise; checked before segregation)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES; checked after the state precondition)"
        side_effects: ["verified_by_user_id := X-User-ID", "CredentialItem.version += 1", "OnboardingCase.version += 1"]
      - from: VERIFIED
        to: FILED
        trigger: "POST /onboarding/credential-items/{id}/file"
        actor: CredentialingSpecialist
        preconditions:
          - "CredentialItem.status == VERIFIED (ERR_ITEM_NOT_VERIFIED otherwise)"
          - "Every item in depends_on_item_ids has status == APPROVED (ERR_ITEM_DEPENDENCY_NOT_APPROVED)"
        side_effects: ["CredentialItem.version += 1", "OnboardingCase.version += 1"]
      - from: FILED
        to: APPROVED
        trigger: "POST /onboarding/credential-items/{id}/approve"
        actor: OnboardingDirector
        preconditions: ["CredentialItem.status == FILED (ERR_ITEM_NOT_FILED otherwise)"]
        side_effects:
          - "Restore: every dependent item in BLOCKED whose depends_on set is now fully APPROVED returns to its blocked_from_status (blocked_from_status cleared)"
          - "OnboardingCase.credential_status recomputed; posture recomputed"
          - "CredentialItem.version += 1; OnboardingCase.version += 1"
      - from: DOCS_SUBMITTED
        to: REJECTED
        trigger: "POST /onboarding/credential-items/{id}/reject"
        actor: OnboardingDirector
        preconditions: ["CredentialItem.status in {DOCS_SUBMITTED, VERIFIED, FILED} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "Cascade: dependent items in {PENDING, DOCS_SUBMITTED, VERIFIED, FILED} record blocked_from_status and become BLOCKED; dependent items in APPROVED become LAPSED (transitively through their own dependents)"
          - "OnboardingCase.credential_status recomputed; posture recomputed"
          - "CredentialItem.version += 1; OnboardingCase.version += 1"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /onboarding/credential-items/{id}/reject"
        actor: OnboardingDirector
        preconditions: ["same as DOCS_SUBMITTED -> REJECTED"]
        side_effects: ["same as DOCS_SUBMITTED -> REJECTED"]
      - from: FILED
        to: REJECTED
        trigger: "POST /onboarding/credential-items/{id}/reject"
        actor: OnboardingDirector
        preconditions: ["same as DOCS_SUBMITTED -> REJECTED"]
        side_effects: ["same as DOCS_SUBMITTED -> REJECTED"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep: expires_on < current logical date)"
        actor: system
        preconditions: ["CredentialItem.status in {PENDING, DOCS_SUBMITTED, VERIFIED, FILED, APPROVED} and expires_on < current date"]
        side_effects: ["same expiry cascade as APPROVED -> EXPIRED"]
      - from: DOCS_SUBMITTED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep)"
        actor: system
        preconditions: ["same as PENDING -> EXPIRED"]
        side_effects: ["same expiry cascade as APPROVED -> EXPIRED"]
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep)"
        actor: system
        preconditions: ["same as PENDING -> EXPIRED"]
        side_effects: ["same expiry cascade as APPROVED -> EXPIRED"]
      - from: FILED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep)"
        actor: system
        preconditions: ["same as PENDING -> EXPIRED"]
        side_effects: ["same expiry cascade as APPROVED -> EXPIRED"]
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_ops/run_epoch (sweep)"
        actor: system
        preconditions: ["CredentialItem.status == APPROVED and expires_on < current date"]
        side_effects:
          - "Cascade hop 1: each direct dependent in {PENDING, DOCS_SUBMITTED, VERIFIED, FILED} records blocked_from_status and becomes BLOCKED; each direct dependent in APPROVED becomes LAPSED"
          - "Cascade hop 2: a dependent flipped to BLOCKED/LAPSED by hop 1 itself triggers the same rule on ITS dependents (transitive, until fixpoint)"
          - "Cascade hop 3: OnboardingCase.credential_status recomputed (becomes BLOCKED if any item is BLOCKED/EXPIRED/LAPSED); posture recomputed"
          - "Cascade hop 4: if the case panel is OPEN and posture falls below GO_LIVE_READY, Panel OPEN -> FROZEN"
          - "CredentialItem.version += 1; OnboardingCase.version += 1"
      - from: APPROVED
        to: LAPSED
        trigger: "cascade from a dependency becoming EXPIRED or REJECTED"
        actor: system
        preconditions: ["A transitive dependency left APPROVED status via EXPIRED or REJECTED"]
        side_effects: ["OnboardingCase.credential_status recomputed", "CredentialItem.version += 1"]
      - from: BLOCKED
        to: PENDING
        trigger: "cascade restore when all dependencies return to APPROVED"
        actor: system
        preconditions: ["Every item in depends_on_item_ids is APPROVED; blocked_from_status == PENDING"]
        side_effects: ["status := blocked_from_status; blocked_from_status cleared", "CredentialItem.version += 1"]
      - from: BLOCKED
        to: DOCS_SUBMITTED
        trigger: "cascade restore when all dependencies return to APPROVED"
        actor: system
        preconditions: ["blocked_from_status == DOCS_SUBMITTED"]
        side_effects: ["same as BLOCKED -> PENDING"]
      - from: BLOCKED
        to: VERIFIED
        trigger: "cascade restore when all dependencies return to APPROVED"
        actor: system
        preconditions: ["blocked_from_status == VERIFIED"]
        side_effects: ["same as BLOCKED -> PENDING"]
      - from: BLOCKED
        to: FILED
        trigger: "cascade restore when all dependencies return to APPROVED"
        actor: system
        preconditions: ["blocked_from_status == FILED"]
        side_effects: ["same as BLOCKED -> PENDING"]

  - entity: TrainingPlan
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /onboarding/training-modules/{id}/schedule (bubble-up on first module scheduled)"
        actor: system
        preconditions: ["Any module of the plan moves NOT_STARTED|FAILED -> SCHEDULED"]
        side_effects: ["OnboardingCase.training_status := IN_PROGRESS", "TrainingPlan.version += 1", "OnboardingCase.version += 1"]
      - from: IN_PROGRESS
        to: AWAITING_SIGNOFF
        trigger: "POST /onboarding/training-modules/{id}/complete (bubble-up: every required module COMPLETED)"
        actor: system
        preconditions: ["All modules with required == true have status COMPLETED"]
        side_effects: ["TrainingPlan.version += 1", "OnboardingCase.version += 1"]
      - from: AWAITING_SIGNOFF
        to: COMPLETE
        trigger: "POST /onboarding/training-plans/{id}/signoff"
        actor: PracticeManager
        preconditions: ["TrainingPlan.status == AWAITING_SIGNOFF (ERR_PLAN_NOT_AWAITING_SIGNOFF otherwise)"]
        side_effects: ["OnboardingCase.training_status := COMPLETE; posture recomputed", "TrainingPlan.version += 1", "OnboardingCase.version += 1"]

  - entity: TrainingModule
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: SCHEDULED
        trigger: "POST /onboarding/training-modules/{id}/schedule"
        actor: PracticeManager
        preconditions: ["TrainingModule.status in {NOT_STARTED, FAILED} (ERR_MODULE_NOT_SCHEDULED ... ERR_INVALID_STATE otherwise)"]
        side_effects: ["scheduled_on set", "TrainingPlan PLANNED -> IN_PROGRESS if first", "TrainingModule.version += 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /onboarding/training-modules/{id}/schedule (retake cycle)"
        actor: PracticeManager
        preconditions: ["same as NOT_STARTED -> SCHEDULED"]
        side_effects: ["same as NOT_STARTED -> SCHEDULED"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /onboarding/training-modules/{id}/complete"
        actor: Physician
        preconditions:
          - "TrainingModule.status == SCHEDULED (ERR_MODULE_NOT_SCHEDULED otherwise)"
          - "X-User-ID == physician of the plan's case (ERR_FORBIDDEN)"
          - "score >= PASS_SCORE (80); score 79 or below transitions to FAILED instead of erroring"
          - "module_code == NOTE_TEMPLATES requires templates_built_count >= plan.templates_required (ERR_TEMPLATES_INSUFFICIENT, 422, no transition)"
        side_effects: ["score and templates_built_count recorded", "TrainingPlan IN_PROGRESS -> AWAITING_SIGNOFF when all required modules COMPLETED", "TrainingModule.version += 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /onboarding/training-modules/{id}/complete with score < 80"
        actor: Physician
        preconditions: ["same as SCHEDULED -> COMPLETED except score < 80"]
        side_effects: ["score recorded", "TrainingModule.version += 1"]

  - entity: ScheduleTemplate
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /onboarding/schedule-templates/{id}/activate"
        actor: PracticeManager
        preconditions:
          - "ScheduleTemplate.status == DRAFT (ERR_TEMPLATE_NOT_DRAFT otherwise)"
          - "No overlap with any ACTIVE template of the same case and weekday under half-open semantics: overlap iff start_minute < other.end_minute AND other.start_minute < end_minute; touching boundaries (end == other.start) are allowed (ERR_TEMPLATE_OVERLAP)"
        side_effects: ["OnboardingCase.weekly_active_minutes recomputed; practice_status recomputed (BUILDING/READY); posture recomputed", "ScheduleTemplate.version += 1", "OnboardingCase.version += 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /onboarding/schedule-templates/{id}/retire"
        actor: PracticeManager
        preconditions: ["ScheduleTemplate.status == ACTIVE (ERR_TEMPLATE_NOT_ACTIVE otherwise)"]
        side_effects:
          - "OnboardingCase.weekly_active_minutes recomputed; if it falls below the specialty requirement, practice_status READY -> BUILDING"
          - "Cascade: posture recomputed; if the case panel is OPEN and practice_status dropped from READY, Panel OPEN -> FROZEN and posture leaves LIVE"
          - "ScheduleTemplate.version += 1; OnboardingCase.version += 1"

  - entity: Panel
    initial_state: NOT_OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_OPEN
        to: OPEN
        trigger: "POST /onboarding/panels/{id}/open"
        actor: PracticeManager
        preconditions:
          - "Panel.status == NOT_OPEN (ERR_PANEL_NOT_OPEN otherwise)"
          - "OnboardingCase.posture == GO_LIVE_READY (ERR_POSTURE_NOT_READY)"
          - "logical clock date >= OnboardingCase.actual_start_date (ERR_START_DATE_NOT_REACHED)"
        side_effects: ["opened_at := logical clock", "posture := LIVE", "Physician ONBOARDING -> ACTIVE", "OnboardingCase.case_status := HIRED", "Panel.version += 1", "OnboardingCase.version += 1", "Physician.version += 1"]
      - from: OPEN
        to: FROZEN
        trigger: "POST /onboarding/panels/{id}/freeze (manual) or cascade from credential expiry / template retirement"
        actor: PracticeManager
        preconditions: ["Panel.status == OPEN (ERR_PANEL_NOT_OPEN otherwise)"]
        side_effects: ["posture recomputed (LIVE -> RAMP_PREP or CREDENTIALING)", "Panel.version += 1", "OnboardingCase.version += 1"]
      - from: FROZEN
        to: OPEN
        trigger: "POST /onboarding/panels/{id}/unfreeze"
        actor: PracticeManager
        preconditions:
          - "Panel.status == FROZEN (ERR_PANEL_NOT_FROZEN otherwise)"
          - "Component readiness holds: credential_status == COMPLETE AND training_status == COMPLETE AND practice_status == READY AND logical clock date >= actual_start_date (ERR_POSTURE_NOT_READY otherwise)"
        side_effects: ["posture := LIVE", "Panel.version += 1", "OnboardingCase.version += 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /onboarding/physicians/{id}/separate (cascade)"
        actor: system
        preconditions: ["Physician separation executed"]
        side_effects: ["Panel.version += 1"]
      - from: FROZEN
        to: CLOSED
        trigger: "POST /onboarding/physicians/{id}/separate (cascade)"
        actor: system
        preconditions: ["Physician separation executed"]
        side_effects: ["Panel.version += 1"]

  - entity: ReferralCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /onboarding/referral-campaigns/{id}/activate"
        actor: PracticeManager
        preconditions: ["ReferralCampaign.status == DRAFT (ERR_CAMPAIGN_NOT_ACTIVE ... ERR_INVALID_STATE otherwise)"]
        side_effects: ["ReferralCampaign.version += 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /onboarding/referral-campaigns/{id}/complete (manual) or physician separation cascade"
        actor: PracticeManager
        preconditions: ["ReferralCampaign.status == ACTIVE (ERR_INVALID_STATE otherwise)"]
        side_effects: ["ReferralCampaign.version += 1"]

  - entity: CampaignEvent
    initial_state: PLANNED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: PLANNED
        to: HELD
        trigger: "POST /onboarding/campaign-events/{id}/hold"
        actor: PracticeManager
        preconditions:
          - "CampaignEvent.status == PLANNED (ERR_EVENT_NOT_PLANNED otherwise)"
          - "Panel of the case (if OPEN) capacity check: current_size + referrals_generated <= capacity (ERR_PANEL_CAPACITY_EXCEEDED)"
        side_effects: ["referrals_generated recorded", "campaign.referrals_attributed += referrals_generated", "if the case Panel is OPEN: Panel.current_size += referrals_generated", "CampaignEvent.version += 1", "ReferralCampaign.version += 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /onboarding/campaign-events/{id}/cancel"
        actor: PracticeManager
        preconditions: ["CampaignEvent.status == PLANNED (ERR_EVENT_NOT_PLANNED otherwise)"]
        side_effects: ["campaign.spent_cents -= cost_cents (compensation restoring the budget invariant)", "CampaignEvent.version += 1", "ReferralCampaign.version += 1"]

  - entity: IncomeGuarantee
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /onboarding/income-guarantees/{id}/activate"
        actor: FinanceAnalyst
        preconditions:
          - "IncomeGuarantee.status == DRAFT (ERR_GUARANTEE_NOT_DRAFT otherwise)"
          - "logical clock date >= first day of start_month (ERR_START_DATE_NOT_REACHED)"
        side_effects: ["IncomeGuarantee.version += 1"]
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /onboarding/income-guarantees/{id}/reconcile when every term month is ATTESTED/LAPSED, or physician separation cascade"
        actor: FinanceAnalyst
        preconditions: ["months_reconciled == term_months after recompute"]
        side_effects: ["outstanding_balance_cents final", "IncomeGuarantee.version += 1"]

  - entity: RampMilestone
    initial_state: PENDING
    terminal_states: [ATTESTED, LAPSED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /onboarding/ramp-milestones/{id}/report"
        actor: PracticeManager
        preconditions:
          - "RampMilestone.status == PENDING (ERR_MILESTONE_NOT_PENDING otherwise)"
          - "logical clock date <= month end + REPORT_GRACE_DAYS (15) (ERR_REPORTING_WINDOW_CLOSED)"
        side_effects: ["actual_wrvu and collections_cents recorded", "RampMilestone.version += 1"]
      - from: REPORTED
        to: ATTESTED
        trigger: "POST /onboarding/ramp-milestones/{id}/attest"
        actor: FinanceAnalyst
        preconditions:
          - "RampMilestone.status == REPORTED (ERR_MILESTONE_NOT_REPORTED otherwise)"
          - "IncomeGuarantee of the case has status == ACTIVE (ERR_GUARANTEE_NOT_ACTIVE)"
        side_effects:
          - "attained := (actual_wrvu >= target_wrvu)"
          - "Cascade hop 1: income_guarantee_draw recomputed chronologically; guarantee.total_advanced_cents updated"
          - "Cascade hop 2: forgiveness_accrued_cents and outstanding_balance_cents recomputed in pinned order"
          - "Cascade hop 3: OnboardingCase.attained_milestone_count / missed_milestone_count updated"
          - "RampMilestone.version += 1; IncomeGuarantee.version += 1; OnboardingCase.version += 1"
      - from: PENDING
        to: LAPSED
        trigger: "POST /_ops/run_epoch (sweep: reporting window closed)"
        actor: system
        preconditions: ["logical clock date > month end + 15 days"]
        side_effects: ["LAPSED months count as a full monthly draw with no forgiveness at next recompute", "OnboardingCase.missed_milestone_count += 1", "RampMilestone.version += 1", "OnboardingCase.version += 1"]

  - entity: MentorshipAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /onboarding/mentorship-assignments (cascade: a new assignment for the same case supersedes this one)"
        actor: system
        preconditions: ["New assignment creation succeeds for the same case"]
        side_effects: ["MentorshipAssignment.version += 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /onboarding/mentorship-assignments/{id}/complete or physician separation cascade"
        actor: OnboardingDirector
        preconditions: ["MentorshipAssignment.status == ACTIVE (ERR_MENTORSHIP_NOT_ACTIVE otherwise)", "checkins_recorded == 5 (all of D30..D365) (ERR_CHECKINS_INCOMPLETE)"]
        side_effects: ["MentorshipAssignment.version += 1"]

  - entity: OnboardingCase
    initial_state: IN_PROGRESS
    terminal_states: [SEPARATED]
    note: "Parallel state dimensions: credential_status x training_status x practice_status evolve independently; posture is a derived gate over all three plus panel state"
    transitions:
      - from: IN_PROGRESS
        to: HIRED
        trigger: "POST /onboarding/panels/{id}/open (cascade)"
        actor: system
        preconditions: ["Panel open succeeds"]
        side_effects: ["posture := LIVE", "OnboardingCase.version += 1"]
      - from: HIRED
        to: SEPARATED
        trigger: "POST /onboarding/physicians/{id}/separate (cascade)"
        actor: system
        preconditions: ["Physician separation executed"]
        side_effects: ["OnboardingCase.version += 1"]
      - from: IN_PROGRESS
        to: SEPARATED
        trigger: "POST /onboarding/physicians/{id}/separate is rejected; IN_PROGRESS cases cannot separate (physician must be ACTIVE)"
        actor: system
        preconditions: ["never taken; documented for completeness"]
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-case
    parent_entity: OnboardingCase
    write_endpoint: "POST /onboarding/offers"
    occ_field: "expected_onboarding_case_version"
    description: |
      Creating an Offer against an OnboardingCase whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just executed an amendment (which legitimately
      supersedes the prior EXECUTED offer under the amendment rule) and the
      current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: mentorship-create-stale-case
    parent_entity: OnboardingCase
    write_endpoint: "POST /onboarding/mentorship-assignments"
    occ_field: "expected_onboarding_case_version"
    description: |
      Creating a MentorshipAssignment against an OnboardingCase whose version
      has advanced since the client last observed it is rejected. Creating an
      assignment legitimately supersedes the currently ACTIVE one, so a stale
      reader would silently displace a mentor it never saw; the stale expected
      version is rejected instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: credential_critical_path
    description: "Longest remaining-dependency-chain length over the case's credential DAG; gates the earliest legal start date"
    trigger: "Offer execute (validation); also recomputed whenever a CredentialItem changes status"
    algorithm: topological
    formula: |
      remaining(item) = 0 if item.status == APPROVED else SLA_DAYS[item.item_type]
      critical_path_days = max over all items of (sum of remaining() along the
        longest dependency chain ending at that item, following depends_on_item_ids)
      earliest_start_date = current logical date + critical_path_days + START_DATE_BUFFER_DAYS
      Empty item set -> critical_path_days = 0 -> earliest = current date + 14 days.
    input_set: "All CredentialItems of the case regardless of status; APPROVED contributes 0, every other status contributes the full SLA (EXPIRED/LAPSED must be reworked)"
    constants:
      SLA_STATE_LICENSE_DAYS: 90
      SLA_DEA_REGISTRATION_DAYS: 45
      SLA_BOARD_CERTIFICATION_DAYS: 30
      SLA_PAYER_ENROLLMENT_MEDICARE_DAYS: 60
      SLA_PAYER_ENROLLMENT_COMMERCIAL_DAYS: 75
      SLA_HOSPITAL_PRIVILEGES_DAYS: 50
      START_DATE_BUFFER_DAYS: 14
    precision: "whole days; date arithmetic on ISO dates"

  - name: weekly_capacity_minutes
    description: "Weekly clinically-usable minutes backing practice readiness"
    trigger: "ScheduleTemplate activate or retire"
    algorithm: aggregation
    formula: |
      weekly_active_minutes = sum over ScheduleTemplates of the case with
        status == ACTIVE and block_type in {CLINIC, PROCEDURE, OR}
        of (end_minute - start_minute)   # half-open interval length
      practice_status = READY if weekly_active_minutes >= REQUIRED_WEEKLY_CLINIC_MINUTES[specialty]
                        else BUILDING if any ACTIVE template exists else PLANNING
      Exactly meeting the requirement passes (>=).
    input_set: "ScheduleTemplates of the case with status == ACTIVE only; DRAFT and RETIRED excluded"
    constants:
      REQUIRED_WEEKLY_CLINIC_MINUTES_FAMILY_MEDICINE: 1200
      REQUIRED_WEEKLY_CLINIC_MINUTES_INTERNAL_MEDICINE: 1200
      REQUIRED_WEEKLY_CLINIC_MINUTES_PEDIATRICS: 1100
      REQUIRED_WEEKLY_CLINIC_MINUTES_CARDIOLOGY: 1000
      REQUIRED_WEEKLY_CLINIC_MINUTES_ORTHOPEDICS: 900
    precision: "whole minutes"

  - name: income_guarantee_draw
    description: "Monthly guarantee draw with collection credit, missed-milestone penalty, and attainment forgiveness; ACTUAL and PROJECTED variants diverge"
    trigger: "RampMilestone attestation; RampMilestone lapse (epoch); POST /income-guarantees/{id}/reconcile; read of guarantee fields"
    algorithm: chronological
    formula: |
      For each term month m = 1..term_months in ascending month_offset order:
        if milestone[m].status == ATTESTED:
          base_credit = min(milestone[m].collections_cents, COLLECTION_CREDIT_CAP_CENTS)
          credit_m = base_credit if milestone[m].attained
                     else round(base_credit * (1 - MISSED_PENALTY_PCT))   # conditional branch
          draw_m = max(0, monthly_guarantee_cents - credit_m)              # nested min/max
        elif milestone[m].status == LAPSED:
          draw_m = monthly_guarantee_cents                                 # no credit, no forgiveness
        else:  # PENDING or REPORTED -> unreconciled
          draw_m is excluded from ACTUAL total
      total_advanced_cents        = sum(draw_m over reconciled months)                    # ACTUAL
      projected_total_draw_cents  = total_advanced_cents
                                    + monthly_guarantee_cents * (count of unreconciled term months)   # PROJECTED
      attained_count = count of ATTESTED months with attained == true
      forgiveness_accrued_cents = FORGIVENESS_PER_ATTAINED_MONTH_CENTS * attained_count
      outstanding_balance_cents = max(0, total_advanced_cents - total_repaid_cents - forgiveness_accrued_cents)
      Pinned evaluation order (circular-looking dependency resolved):
        (1) chronological draws -> total_advanced_cents;
        (2) forgiveness from attained_count;
        (3) outstanding from (advanced, repaid, forgiveness);
        (4) a repayment is validated against the outstanding computed BEFORE that repayment is applied.
    input_set: "RampMilestones of the case with month_offset <= term_months; ATTESTED and LAPSED months are reconciled, PENDING/REPORTED are not"
    constants:
      COLLECTION_CREDIT_CAP_CENTS: 1800000
      MISSED_PENALTY_PCT: 0.10
      FORGIVENESS_PER_ATTAINED_MONTH_CENTS: 100000
    precision: "integer cents; the penalty multiplication rounds HALF_UP to whole cents"
    variants:
      - name: ACTUAL
        when: "Ledger fields total_advanced_cents / outstanding_balance_cents; repayment validation"
        difference: "Only ATTESTED/LAPSED months contribute"
      - name: PROJECTED
        when: "Forward-looking field projected_total_draw_cents"
        difference: "Adds monthly_guarantee_cents per unreconciled term month (assumes zero future collections), so identical data yields a strictly larger total whenever any month is unreconciled"

  - name: milestone_attainment
    description: "Threshold test for a reported ramp month"
    trigger: "RampMilestone attestation"
    algorithm: threshold
    formula: "attained = (actual_wrvu >= target_wrvu); exact equality attains"
    input_set: "The milestone being attested"
    constants:
      WRVU_TARGET_CURVE: [100, 150, 200, 250, 300, 350, 400, 420, 440, 460, 480, 500]
    precision: "integer wRVU comparison"

  - name: retention_risk_score
    description: "Four-component weighted risk score; per-component rounding order pinned; TRAILING and LEADING variants diverge"
    trigger: "POST /onboarding/retention-snapshots"
    algorithm: weighted_scoring
    formula: |
      months_due = term months whose reporting window has closed by the logical clock
      TRAILING milestone_risk = (ATTESTED months with attained == false) / (ATTESTED months) * 100
                                 (0 when no month is ATTESTED)
      LEADING  milestone_risk = (missed ATTESTED + unreconciled months_due) / months_due * 100
                                 (0 when months_due == 0)
      current_month_offset = months elapsed since start_month (min 1)
      expected_fill = Panel.capacity * RAMP_FILL_CURVE[current_month_offset]      # TRAILING
      expected_fill = Panel.capacity * RAMP_FILL_CURVE[current_month_offset + 1]  # LEADING (next month)
      panel_risk = max(0, expected_fill - Panel.current_size) / expected_fill * 100  (0 when expected_fill == 0)
      sentiment_risk = mean over ALL CheckIns recorded on every MentorshipAssignment of the case
                       (any assignment status) of {POSITIVE: 0, NEUTRAL: 40, CONCERN: 70, CRISIS: 100};
                       50 when none recorded
      schedule_risk = max(0, REQUIRED_WEEKLY_CLINIC_MINUTES - weekly_active_minutes)
                      / REQUIRED_WEEKLY_CLINIC_MINUTES * 100
      Component values are rounded to 2 decimal places HALF_UP BEFORE weighting.
      score = round2_half_up(0.35*milestone_risk) + round2_half_up(0.25*panel_risk)
              + round2_half_up(0.25*sentiment_risk) + round2_half_up(0.15*schedule_risk)
      Rounding order is pinned: round each weighted term, then sum. Summing raw terms
      and rounding once at the end is explicitly NOT the contract.
      risk_band: score >= 75 CRITICAL; >= 50 HIGH; >= 25 MODERATE; else LOW.
    input_set: "RampMilestones, Panel, CheckIns and ScheduleTemplate-derived weekly minutes of the case"
    constants:
      RAMP_FILL_CURVE: [0.10, 0.18, 0.26, 0.34, 0.42, 0.50, 0.58, 0.65, 0.71, 0.77, 0.82, 0.85]
      WEIGHT_MILESTONE: 0.35
      WEIGHT_PANEL: 0.25
      WEIGHT_SENTIMENT: 0.25
      WEIGHT_SCHEDULE: 0.15
      BAND_CRITICAL_MIN: 75
      BAND_HIGH_MIN: 50
      BAND_MODERATE_MIN: 25
    precision: "2 decimal places, round_half_up, per-term rounding before summation"
    variants:
      - name: TRAILING
        when: "Backward-looking reviews"
        difference: "Only attested history and current-month fill expectations"
      - name: LEADING
        when: "Forward-looking reviews"
        difference: "Unreconciled elapsed months count as missed and panel expectation uses next month's curve point, producing a different score for identical data"

  - name: campaign_spend
    description: "Campaign budget ledger with compensating cancel"
    trigger: "CampaignEvent create (debit) and cancel (refund)"
    algorithm: aggregation
    formula: |
      spent_cents = sum over the campaign's CampaignEvents with status in {PLANNED, HELD} of cost_cents
      Invariant: create(+cost) followed by cancel of the same event leaves spent_cents unchanged.
      Budget gate at creation: spent_cents + cost_cents <= budget_cents (ERR_CAMPAIGN_BUDGET_EXCEEDED).
    input_set: "CampaignEvents of the campaign excluding CANCELLED"
    constants: {}
    precision: "integer cents"

  - name: panel_census
    description: "Panel headcount ledger with signed adjustments and referral inflows"
    trigger: "POST /panels/{id}/census-adjustments; CampaignEvent hold while panel OPEN"
    algorithm: aggregation
    formula: |
      current_size = sum of all applied census-adjustment deltas + sum of referrals_generated
                     from HELD CampaignEvents while the panel was OPEN
      Bounds: 0 <= current_size <= capacity; +delta taking the size to exactly capacity succeeds,
      capacity + 1 fails (ERR_PANEL_CAPACITY_EXCEEDED); a result below 0 fails (ERR_NEGATIVE_CENSUS).
      Invariant: an adjustment +x followed by -x leaves current_size unchanged.
    input_set: "Panel of the case"
    constants: {}
    precision: "integer patients"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed on the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: Physician callers act only on their own case chain (offer counter/accept/decline, module complete); MentorPhysician callers act only on assignments where mentor_physician_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /onboarding/offers/{id}/counter, POST /onboarding/offers/{id}/accept, POST /onboarding/offers/{id}/decline, POST /onboarding/training-modules/{id}/complete, POST /onboarding/mentorship-assignments/{id}/check-ins" }
  - { priority: 4, category: existence, check: "Path and body ids resolve, validated left-to-right (physician -> case -> child)", error_id: ERR_PHYSICIAN_NOT_FOUND, http_status: 404, applies_to: "all (resource-specific variant: ERR_CASE_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_CREDENTIAL_ITEM_NOT_FOUND, ERR_TRAINING_PLAN_NOT_FOUND, ERR_TRAINING_MODULE_NOT_FOUND, ERR_SCHEDULE_TEMPLATE_NOT_FOUND, ERR_PANEL_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_CAMPAIGN_EVENT_NOT_FOUND, ERR_GUARANTEE_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_MENTORSHIP_NOT_FOUND, ERR_SNAPSHOT_NOT_FOUND)" }
  - { priority: 5, category: existence, check: "Request body schema: required fields present, enum members valid, dates parse, start_minute < end_minute, start_date <= end_date", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource state permits the transition (offer extendable / negotiation open / item submitted / item verified / item filed / module scheduled / template draft / template active / panel open / panel frozen / campaign active / event planned / guarantee draft / guarantee active / milestone pending / milestone reported / mentorship active)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints (resource-specific variants: ERR_OFFER_NOT_EXTENDABLE, ERR_NEGOTIATION_NOT_OPEN, ERR_OFFER_NOT_ACCEPTED, ERR_ITEM_NOT_SUBMITTED, ERR_ITEM_NOT_VERIFIED, ERR_ITEM_NOT_FILED, ERR_MODULE_NOT_SCHEDULED, ERR_TEMPLATE_NOT_DRAFT, ERR_TEMPLATE_NOT_ACTIVE, ERR_PANEL_NOT_OPEN, ERR_PANEL_NOT_FROZEN, ERR_CAMPAIGN_NOT_ACTIVE, ERR_EVENT_NOT_PLANNED, ERR_GUARANTEE_NOT_DRAFT, ERR_GUARANTEE_NOT_ACTIVE, ERR_MILESTONE_NOT_PENDING, ERR_MILESTONE_NOT_REPORTED, ERR_MENTORSHIP_NOT_ACTIVE)" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: credential verifier must differ from the submitter of record", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /onboarding/credential-items/{id}/verify" }
  - { priority: 8, category: business_referential, check: "Linked-entity state gates: campaign ACTIVE for event creation; guarantee ACTIVE for milestone attestation; case posture GO_LIVE_READY for panel open and component readiness for unfreeze; mentor rules pinned in order: mentor != mentee (ERR_MENTOR_IS_MENTEE), then mentor is an ACTIVE physician (ERR_MENTOR_NOT_ACTIVE_PHYSICIAN), then specialty match (ERR_MENTOR_SPECIALTY_MISMATCH)", error_id: ERR_POSTURE_NOT_READY, http_status: 409, applies_to: "POST /onboarding/campaign-events, POST /onboarding/ramp-milestones/{id}/attest, POST /onboarding/panels/{id}/open, POST /onboarding/panels/{id}/unfreeze, POST /onboarding/mentorship-assignments (variants: ERR_CAMPAIGN_NOT_ACTIVE, ERR_GUARANTEE_NOT_ACTIVE, ERR_MENTOR_NOT_ACTIVE_PHYSICIAN, ERR_MENTOR_SPECIALTY_MISMATCH, ERR_MENTOR_IS_MENTEE)" }
  - { priority: 9, category: business_temporal, check: "Time rules: proposed_start_date >= current date + credential critical path + 14d; offer not past expires_at; clock >= start date for panel open / guarantee activate; milestone reporting window open; template half-open overlap; event closed-interval overlap", error_id: ERR_START_DATE_BEFORE_CREDENTIAL_ETA, http_status: 422, applies_to: "offer execute/accept/counter, guarantee activate, panel open, milestone report, template activate, event create (variants: ERR_OFFER_EXPIRED, ERR_START_DATE_NOT_REACHED, ERR_REPORTING_WINDOW_CLOSED, ERR_TEMPLATE_OVERLAP, ERR_EVENT_WINDOW_OVERLAP)" }
  - { priority: 10, category: business_constraint, check: "Structural rules: one case per physician; one non-terminal offer per case; amendment allowed only while guarantee DRAFT and all milestones PENDING; dependency items APPROVED before filing; negotiation rounds < 5; check-ins unique-then-ordered: an already-recorded day_marker yields ERR_CHECKIN_ALREADY_RECORDED (checked first), a non-recorded marker that is not the immediate next yields ERR_CHECKIN_OUT_OF_ORDER; five check-ins before mentorship completion", error_id: ERR_DUPLICATE_CASE, http_status: 409, applies_to: "creation and ordering rules (variants: ERR_ACTIVE_OFFER_EXISTS, ERR_AMENDMENT_WINDOW_CLOSED, ERR_ITEM_DEPENDENCY_NOT_APPROVED, ERR_NEGOTIATION_ROUND_LIMIT, ERR_CHECKIN_OUT_OF_ORDER, ERR_CHECKIN_ALREADY_RECORDED, ERR_CHECKINS_INCOMPLETE)" }
  - { priority: 11, category: business_fiscal, check: "Money and capacity rules, checked last: campaign budget, panel capacity, census floor, repayment ceiling", error_id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /onboarding/campaign-events, POST /onboarding/campaign-events/{id}/hold, POST /onboarding/panels/{id}/census-adjustments, POST /onboarding/income-guarantees/{id}/repayments (variants: ERR_PANEL_CAPACITY_EXCEEDED, ERR_NEGATIVE_CENSUS, ERR_REPAYMENT_EXCEEDS_OUTSTANDING)" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Physicians ---
  - { method: POST, path: "/onboarding/physicians", description: "Register a physician prospect", roles: [Recruiter], code: 201, input: ["full_name", "specialty", "email", "hire_type"], output: Physician, side_effects: ["status := PROSPECT"] }
  - { method: GET, path: "/onboarding/physicians/{id}", description: "Fetch one physician", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: Physician, side_effects: [] }
  - { method: GET, path: "/onboarding/physicians", description: "List physicians, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["specialty?", "status?", "limit?", "offset?"], output: "Physician[]", side_effects: [] }
  - { method: POST, path: "/onboarding/physicians/{id}/separate", description: "Separate an ACTIVE physician; cascades close the panel, complete mentorship/campaign, settle the guarantee", roles: [OnboardingDirector], code: 200, input: ["separation_reason?"], output: Physician, side_effects: ["Physician ACTIVE -> SEPARATED", "Panel OPEN/FROZEN -> CLOSED", "MentorshipAssignment ACTIVE -> COMPLETED", "IncomeGuarantee ACTIVE -> SETTLED", "ReferralCampaign ACTIVE -> COMPLETED", "OnboardingCase.case_status := SEPARATED"] }
  - { method: POST, path: "/onboarding/physicians/{id}/mark-active", description: "Mark a pre-existing staff physician (PROSPECT, no onboarding case) as ACTIVE so it can serve as a mentor", roles: [OnboardingDirector], code: 200, input: [], output: Physician, side_effects: ["Physician PROSPECT -> ACTIVE"] }

  # --- Onboarding cases ---
  - { method: POST, path: "/onboarding/onboarding-cases", description: "Open an onboarding case for a physician (one per physician)", roles: [Recruiter], code: 201, input: ["physician_id", "target_start_date"], output: OnboardingCase, side_effects: ["Physician PROSPECT -> ONBOARDING", "case posture := PRE_CONTRACT"] }
  - { method: GET, path: "/onboarding/onboarding-cases/{id}", description: "Fetch one case with computed posture fields", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: OnboardingCase, side_effects: [] }
  - { method: GET, path: "/onboarding/onboarding-cases", description: "List cases, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["physician_id?", "posture?", "case_status?", "limit?", "offset?"], output: "OnboardingCase[]", side_effects: [] }

  # --- Offers / contract ---
  - { method: POST, path: "/onboarding/offers", description: "Draft an offer (OCC on the case version; a create while an EXECUTED offer exists is an amendment and requires guarantee DRAFT + all milestones PENDING)", roles: [Recruiter], code: 201, input: ["onboarding_case_id", "expected_onboarding_case_version", "base_salary_cents", "signing_bonus_cents", "guarantee_monthly_cents", "guarantee_term_months", "panel_capacity", "proposed_start_date", "expires_at"], output: Offer, side_effects: ["increments OnboardingCase.version by 1", "ERR_ACTIVE_OFFER_EXISTS if a non-terminal offer exists", "ERR_AMENDMENT_WINDOW_CLOSED if an EXECUTED offer exists and (guarantee not DRAFT or any milestone not PENDING)"] }
  - { method: GET, path: "/onboarding/offers/{id}", description: "Fetch one offer", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: Offer, side_effects: [] }
  - { method: GET, path: "/onboarding/offers", description: "List offers, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "limit?", "offset?"], output: "Offer[]", side_effects: [] }
  - { method: POST, path: "/onboarding/offers/{id}/extend", description: "Extend a DRAFT offer or re-extend a COUNTERED offer with revised terms (negotiation cycle hop)", roles: [Recruiter], code: 200, input: ["base_salary_cents?", "signing_bonus_cents?", "guarantee_monthly_cents?", "guarantee_term_months?", "panel_capacity?", "proposed_start_date?", "expires_at?"], output: Offer, side_effects: ["DRAFT|COUNTERED -> EXTENDED", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/offers/{id}/counter", description: "Physician counters an EXTENDED offer; the 5th counter succeeds, the 6th is rejected", roles: [Physician], code: 200, input: ["physician_note?"], output: Offer, side_effects: ["EXTENDED -> COUNTERED", "negotiation_round += 1", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/offers/{id}/accept", description: "Physician accepts the current terms", roles: [Physician], code: 200, input: [], output: Offer, side_effects: ["EXTENDED|COUNTERED -> ACCEPTED", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/offers/{id}/execute", description: "Contract administrator executes an ACCEPTED offer; validates the start date against the credential critical path and provisions guarantee, training plan, panel, and ramp milestones", roles: [ContractAdministrator], code: 200, input: [], output: Offer, side_effects: ["ACCEPTED -> EXECUTED", "amendment: prior EXECUTED offer -> SUPERSEDED and DRAFT guarantee terms overwritten", "creates IncomeGuarantee DRAFT, TrainingPlan PLANNED with required modules, Panel NOT_OPEN, guarantee_term_months RampMilestones PENDING", "OnboardingCase.actual_start_date set; posture recomputed", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/offers/{id}/withdraw", description: "Recruiter withdraws a non-terminal offer", roles: [Recruiter], code: 200, input: ["reason?"], output: Offer, side_effects: ["DRAFT|EXTENDED|COUNTERED|ACCEPTED -> WITHDRAWN", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/offers/{id}/decline", description: "Physician declines an extended offer", roles: [Physician], code: 200, input: ["physician_note?"], output: Offer, side_effects: ["EXTENDED|COUNTERED -> DECLINED", "increments OnboardingCase.version by 1"] }

  # --- Credential items ---
  - { method: POST, path: "/onboarding/credential-items", description: "Register a credential item (licensure, DEA, payer enrollment, etc.) with optional dependency DAG edges", roles: [CredentialingSpecialist], code: 201, input: ["onboarding_case_id", "item_type", "payer_code?", "depends_on_item_ids?", "expires_on?", "document_ref"], output: CredentialItem, side_effects: ["status := PENDING", "case credential_status NOT_STARTED -> IN_PROGRESS if first", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/credential-items/{id}", description: "Fetch one credential item", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: CredentialItem, side_effects: [] }
  - { method: GET, path: "/onboarding/credential-items", description: "List credential items, ordered by created_at ASC; depends_on_item_ids filter returns items whose dependency array contains the given id", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "item_type?", "status?", "depends_on_item_ids?", "limit?", "offset?"], output: "CredentialItem[]", side_effects: [] }
  - { method: POST, path: "/onboarding/credential-items/{id}/submit-docs", description: "Submit credential documents; records X-User-ID as submitted_by_user_id (segregation anchor); allowed from PENDING and REJECTED", roles: [CredentialingSpecialist], code: 200, input: ["document_ref?"], output: CredentialItem, side_effects: ["PENDING|REJECTED -> DOCS_SUBMITTED", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/credential-items/{id}/verify", description: "Verify submitted documents; the verifier must differ from the submitter (segregation of duties, checked after the state precondition)", roles: [CredentialingSpecialist], code: 200, input: ["verification_note?"], output: CredentialItem, side_effects: ["DOCS_SUBMITTED -> VERIFIED", "verified_by_user_id := X-User-ID", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/credential-items/{id}/file", description: "File the verified item with the authority/payer; all dependency items must be APPROVED", roles: [CredentialingSpecialist], code: 200, input: ["filing_ref?"], output: CredentialItem, side_effects: ["VERIFIED -> FILED", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/credential-items/{id}/approve", description: "Approve a filed item; restores dependents whose dependencies are now fully APPROVED; recomputes credential_status and posture", roles: [OnboardingDirector], code: 200, input: [], output: CredentialItem, side_effects: ["FILED -> APPROVED", "BLOCKED dependents with all deps APPROVED restore to blocked_from_status", "case credential_status/posture recomputed", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/credential-items/{id}/reject", description: "Reject an item in flight; dependents block (non-terminal) or lapse (APPROVED)", roles: [OnboardingDirector], code: 200, input: ["reason"], output: CredentialItem, side_effects: ["DOCS_SUBMITTED|VERIFIED|FILED -> REJECTED", "dependent cascade: non-terminal -> BLOCKED (blocked_from_status recorded), APPROVED -> LAPSED, transitive", "case credential_status/posture recomputed", "increments OnboardingCase.version by 1"] }

  # --- Training ---
  - { method: GET, path: "/onboarding/training-plans/{id}", description: "Fetch one training plan", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: TrainingPlan, side_effects: [] }
  - { method: GET, path: "/onboarding/training-plans", description: "List training plans, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "limit?", "offset?"], output: "TrainingPlan[]", side_effects: [] }
  - { method: POST, path: "/onboarding/training-plans/{id}/signoff", description: "Practice manager signs off an AWAITING_SIGNOFF plan", roles: [PracticeManager], code: 200, input: [], output: TrainingPlan, side_effects: ["AWAITING_SIGNOFF -> COMPLETE", "case training_status := COMPLETE; posture recomputed", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/training-modules", description: "Add an elective module to a plan (required modules are auto-created at offer execution)", roles: [PracticeManager], code: 201, input: ["training_plan_id", "module_code", "required"], output: TrainingModule, side_effects: ["status := NOT_STARTED"] }
  - { method: GET, path: "/onboarding/training-modules/{id}", description: "Fetch one module", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: TrainingModule, side_effects: [] }
  - { method: GET, path: "/onboarding/training-modules", description: "List modules of a plan, ordered by module_code ASC (deterministic for indexed access)", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["training_plan_id?", "status?", "module_code?", "limit?", "offset?"], output: "TrainingModule[]", side_effects: [] }
  - { method: POST, path: "/onboarding/training-modules/{id}/schedule", description: "Schedule a NOT_STARTED or FAILED module (FAILED -> SCHEDULED is the retake cycle)", roles: [PracticeManager], code: 200, input: ["scheduled_on?"], output: TrainingModule, side_effects: ["NOT_STARTED|FAILED -> SCHEDULED", "plan PLANNED -> IN_PROGRESS if first", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/training-modules/{id}/complete", description: "Physician completes a scheduled module; score >= 80 completes, below fails (retake allowed); NOTE_TEMPLATES additionally requires templates_built_count >= plan.templates_required", roles: [Physician], code: 200, input: ["score", "templates_built_count?"], output: TrainingModule, side_effects: ["SCHEDULED -> COMPLETED|FAILED", "plan -> AWAITING_SIGNOFF when all required modules COMPLETED", "increments OnboardingCase.version by 1"] }

  # --- Schedule templates ---
  - { method: POST, path: "/onboarding/schedule-templates", description: "Draft a weekly schedule block (half-open [start_minute, end_minute))", roles: [PracticeManager], code: 201, input: ["onboarding_case_id", "weekday", "start_minute", "end_minute", "block_type"], output: ScheduleTemplate, side_effects: ["status := DRAFT", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/schedule-templates/{id}", description: "Fetch one template", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: ScheduleTemplate, side_effects: [] }
  - { method: GET, path: "/onboarding/schedule-templates", description: "List templates, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "weekday?", "status?", "limit?", "offset?"], output: "ScheduleTemplate[]", side_effects: [] }
  - { method: POST, path: "/onboarding/schedule-templates/{id}/activate", description: "Activate a draft; half-open overlap against ACTIVE templates of the same case+weekday (touching boundaries allowed); recomputes weekly minutes and practice_status", roles: [PracticeManager], code: 200, input: [], output: ScheduleTemplate, side_effects: ["DRAFT -> ACTIVE", "weekly_active_minutes/practice_status/posture recomputed", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/schedule-templates/{id}/retire", description: "Retire an active template; if minutes fall below requirement, practice_status drops and an OPEN panel freezes", roles: [PracticeManager], code: 200, input: [], output: ScheduleTemplate, side_effects: ["ACTIVE -> RETIRED", "weekly_active_minutes/practice_status/posture recomputed", "Panel OPEN -> FROZEN cascade if practice dropped from READY", "increments OnboardingCase.version by 1"] }

  # --- Panel ---
  - { method: GET, path: "/onboarding/panels/{id}", description: "Fetch one panel", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: Panel, side_effects: [] }
  - { method: GET, path: "/onboarding/panels", description: "List panels, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "limit?", "offset?"], output: "Panel[]", side_effects: [] }
  - { method: POST, path: "/onboarding/panels/{id}/open", description: "Open the panel; requires posture GO_LIVE_READY and the start date reached; flips physician ACTIVE and case HIRED/LIVE", roles: [PracticeManager], code: 200, input: [], output: Panel, side_effects: ["NOT_OPEN -> OPEN", "Physician ONBOARDING -> ACTIVE", "case case_status := HIRED; posture := LIVE", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/panels/{id}/freeze", description: "Freeze an open panel", roles: [PracticeManager], code: 200, input: [], output: Panel, side_effects: ["OPEN -> FROZEN", "posture recomputed", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/panels/{id}/unfreeze", description: "Unfreeze when component readiness holds again", roles: [PracticeManager], code: 200, input: [], output: Panel, side_effects: ["FROZEN -> OPEN", "posture := LIVE", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/onboarding/panels/{id}/census-adjustments", description: "Apply a signed census delta while OPEN; result must stay within [0, capacity] (exactly capacity succeeds)", roles: [PracticeManager], code: 200, input: ["delta"], output: Panel, side_effects: ["current_size += delta", "Panel.version += 1"] }

  # --- Referral marketing ---
  - { method: POST, path: "/onboarding/referral-campaigns", description: "Create a referral marketing / community introduction campaign", roles: [PracticeManager], code: 201, input: ["onboarding_case_id", "name", "budget_cents"], output: ReferralCampaign, side_effects: ["status := DRAFT", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/referral-campaigns/{id}", description: "Fetch one campaign", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: ReferralCampaign, side_effects: [] }
  - { method: GET, path: "/onboarding/referral-campaigns", description: "List campaigns, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "limit?", "offset?"], output: "ReferralCampaign[]", side_effects: [] }
  - { method: POST, path: "/onboarding/referral-campaigns/{id}/activate", description: "Activate a draft campaign", roles: [PracticeManager], code: 200, input: [], output: ReferralCampaign, side_effects: ["DRAFT -> ACTIVE"] }
  - { method: POST, path: "/onboarding/referral-campaigns/{id}/complete", description: "Complete an active campaign", roles: [PracticeManager], code: 200, input: [], output: ReferralCampaign, side_effects: ["ACTIVE -> COMPLETED"] }
  - { method: POST, path: "/onboarding/campaign-events", description: "Plan a campaign event; closed-interval date overlap with any non-CANCELLED sibling event is rejected (adjacency conflicts); budget checked after the overlap check", roles: [PracticeManager], code: 201, input: ["campaign_id", "event_type", "start_date", "end_date", "cost_cents", "venue"], output: CampaignEvent, side_effects: ["status := PLANNED", "campaign.spent_cents += cost_cents", "ReferralCampaign.version += 1"] }
  - { method: GET, path: "/onboarding/campaign-events/{id}", description: "Fetch one event", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: CampaignEvent, side_effects: [] }
  - { method: GET, path: "/onboarding/campaign-events", description: "List events, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["campaign_id?", "status?", "event_type?", "limit?", "offset?"], output: "CampaignEvent[]", side_effects: [] }
  - { method: POST, path: "/onboarding/campaign-events/{id}/hold", description: "Mark the event held and record attributed referrals; referrals flow into the OPEN panel census", roles: [PracticeManager], code: 200, input: ["referrals_generated"], output: CampaignEvent, side_effects: ["PLANNED -> HELD", "campaign.referrals_attributed += referrals_generated", "Panel.current_size += referrals_generated when the panel is OPEN"] }
  - { method: POST, path: "/onboarding/campaign-events/{id}/cancel", description: "Cancel a planned event; refunds cost_cents to the campaign (compensating action)", roles: [PracticeManager], code: 200, input: [], output: CampaignEvent, side_effects: ["PLANNED -> CANCELLED", "campaign.spent_cents -= cost_cents"] }

  # --- Income guarantee ---
  - { method: GET, path: "/onboarding/income-guarantees/{id}", description: "Fetch one guarantee with ACTUAL/PROJECTED draw fields", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: IncomeGuarantee, side_effects: [] }
  - { method: GET, path: "/onboarding/income-guarantees", description: "List guarantees, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "limit?", "offset?"], output: "IncomeGuarantee[]", side_effects: [] }
  - { method: POST, path: "/onboarding/income-guarantees/{id}/activate", description: "Activate the guarantee on or after the first day of start_month", roles: [FinanceAnalyst], code: 200, input: [], output: IncomeGuarantee, side_effects: ["DRAFT -> ACTIVE"] }
  - { method: POST, path: "/onboarding/income-guarantees/{id}/reconcile", description: "Recompute draws from reconciled months in chronological order; SETTLED when every term month is ATTESTED/LAPSED", roles: [FinanceAnalyst], code: 200, input: [], output: IncomeGuarantee, side_effects: ["income_guarantee_draw recomputed", "ACTIVE -> SETTLED when months_reconciled == term_months"] }
  - { method: POST, path: "/onboarding/income-guarantees/{id}/repayments", description: "Post a repayment against the outstanding balance (validated against the outstanding computed before this repayment)", roles: [FinanceAnalyst], code: 201, input: ["amount_cents"], output: IncomeGuarantee, side_effects: ["total_repaid_cents += amount_cents", "outstanding_balance_cents recomputed"] }

  # --- Ramp milestones ---
  - { method: GET, path: "/onboarding/ramp-milestones/{id}", description: "Fetch one milestone", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: RampMilestone, side_effects: [] }
  - { method: GET, path: "/onboarding/ramp-milestones", description: "List milestones, ordered by month_offset ASC (deterministic for indexed access)", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "status?", "month_offset?", "limit?", "offset?"], output: "RampMilestone[]", side_effects: [] }
  - { method: POST, path: "/onboarding/ramp-milestones/{id}/report", description: "Report actual production for a PENDING milestone inside its reporting window", roles: [PracticeManager], code: 200, input: ["actual_wrvu", "collections_cents"], output: RampMilestone, side_effects: ["PENDING -> REPORTED"] }
  - { method: POST, path: "/onboarding/ramp-milestones/{id}/attest", description: "Attest a REPORTED milestone; requires the guarantee ACTIVE; computes attainment and cascades the guarantee draw recompute", roles: [FinanceAnalyst], code: 200, input: [], output: RampMilestone, side_effects: ["REPORTED -> ATTESTED", "attained computed (actual_wrvu >= target_wrvu)", "guarantee draws/forgiveness/outstanding recomputed", "case attained/missed counts updated"] }

  # --- Mentorship & check-ins ---
  - { method: POST, path: "/onboarding/mentorship-assignments", description: "Assign a mentor (OCC on the case version); supersedes any currently ACTIVE assignment of the case", roles: [OnboardingDirector], code: 201, input: ["onboarding_case_id", "mentor_physician_id", "expected_onboarding_case_version"], output: MentorshipAssignment, side_effects: ["status := ACTIVE", "prior ACTIVE assignment -> SUPERSEDED", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/mentorship-assignments/{id}", description: "Fetch one assignment", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: MentorshipAssignment, side_effects: [] }
  - { method: GET, path: "/onboarding/mentorship-assignments", description: "List assignments, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "mentor_physician_id?", "status?", "limit?", "offset?"], output: "MentorshipAssignment[]", side_effects: [] }
  - { method: POST, path: "/onboarding/mentorship-assignments/{id}/complete", description: "Complete an ACTIVE assignment after all five first-year check-ins", roles: [OnboardingDirector], code: 200, input: [], output: MentorshipAssignment, side_effects: ["ACTIVE -> COMPLETED"] }
  - { method: POST, path: "/onboarding/mentorship-assignments/{id}/check-ins", description: "Mentor records the next first-year check-in; day_markers ascend D30..D365, each at most once; CRISIS escalates and flags the case at risk", roles: [MentorPhysician], code: 201, input: ["day_marker", "sentiment", "notes?"], output: CheckIn, side_effects: ["assignment.checkins_recorded += 1", "CRISIS: assignment.escalated := true and case.at_risk := true", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/mentorship-assignments/{id}/check-ins", description: "List check-ins of an assignment in day_marker order (D30..D365)", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["limit?", "offset?"], output: "CheckIn[]", side_effects: [] }

  # --- Retention risk ---
  - { method: POST, path: "/onboarding/retention-snapshots", description: "Compute and persist a retention risk snapshot (TRAILING or LEADING variant); requires the case to have an EXECUTED offer (panel and milestones exist), otherwise ERR_INVALID_STATE (409)", roles: [OnboardingDirector], code: 201, input: ["onboarding_case_id", "variant"], output: RetentionRiskSnapshot, side_effects: ["case.latest_risk_score/latest_risk_band updated", "case.at_risk := (band in {HIGH, CRITICAL})", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/onboarding/retention-snapshots/{id}", description: "Fetch one snapshot", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: [], output: RetentionRiskSnapshot, side_effects: [] }
  - { method: GET, path: "/onboarding/retention-snapshots", description: "List snapshots, ordered by created_at ASC", roles: [Recruiter, ContractAdministrator, CredentialingSpecialist, PracticeManager, FinanceAnalyst, OnboardingDirector, Physician, MentorPhysician, SystemOperator], code: 200, input: ["onboarding_case_id?", "variant?", "limit?", "offset?"], output: "RetentionRiskSnapshot[]", side_effects: [] }

  # --- Test-driving endpoints ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the clock never falls back to wall-clock time; all date/datetime comparisons in the domain read this clock", roles: [SystemOperator], code: 200, input: ["to_iso8601"], output: "{ current_utc: datetime }", side_effects: ["logical clock advanced"] }
  - { method: POST, path: "/_ops/run_epoch", description: "Run the daily sweep in pinned order: (1) expire CredentialItems whose expires_on < current date with the full dependency cascade; (2) expire EXTENDED/COUNTERED offers past expires_at; (3) lapse PENDING milestones whose reporting window has closed", roles: [SystemOperator], code: 200, input: [], output: "{ expired_credential_ids: array, expired_offer_ids: array, lapsed_milestone_ids: array }", side_effects: ["credential expiry cascade (BLOCKED/LAPSED dependents, posture recompute, panel freeze)", "offer expiry", "milestone lapse"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or entity-backed ownership check failed (physician on another physician's case chain; mentor on another mentor's assignment)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum member, unparseable date, start_minute >= end_minute, start_date > end_date, negative amounts" }
  - { id: ERR_PHYSICIAN_NOT_FOUND, http: 404, condition: "Physician id does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "OnboardingCase id does not resolve" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "Offer id does not resolve" }
  - { id: ERR_CREDENTIAL_ITEM_NOT_FOUND, http: 404, condition: "CredentialItem id does not resolve" }
  - { id: ERR_TRAINING_PLAN_NOT_FOUND, http: 404, condition: "TrainingPlan id does not resolve" }
  - { id: ERR_TRAINING_MODULE_NOT_FOUND, http: 404, condition: "TrainingModule id does not resolve" }
  - { id: ERR_SCHEDULE_TEMPLATE_NOT_FOUND, http: 404, condition: "ScheduleTemplate id does not resolve" }
  - { id: ERR_PANEL_NOT_FOUND, http: 404, condition: "Panel id does not resolve" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "ReferralCampaign id does not resolve" }
  - { id: ERR_CAMPAIGN_EVENT_NOT_FOUND, http: 404, condition: "CampaignEvent id does not resolve" }
  - { id: ERR_GUARANTEE_NOT_FOUND, http: 404, condition: "IncomeGuarantee id does not resolve" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "RampMilestone id does not resolve" }
  - { id: ERR_MENTORSHIP_NOT_FOUND, http: 404, condition: "MentorshipAssignment id does not resolve" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "RetentionRiskSnapshot id does not resolve" }
  - { id: ERR_DUPLICATE_CASE, http: 409, condition: "An OnboardingCase already exists for the physician" }
  - { id: ERR_ACTIVE_OFFER_EXISTS, http: 409, condition: "A non-terminal offer already exists on the case and the case has no EXECUTED offer to amend" }
  - { id: ERR_AMENDMENT_WINDOW_CLOSED, http: 409, condition: "An EXECUTED offer exists and amendment is blocked because the guarantee is not DRAFT or some milestone is not PENDING" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_onboarding_case_version does not match the case's current version (OCC)" }
  - { id: ERR_OFFER_NOT_EXTENDABLE, http: 409, condition: "extend called on an offer not in DRAFT or COUNTERED" }
  - { id: ERR_NEGOTIATION_NOT_OPEN, http: 409, condition: "counter/accept/decline called on an offer not in EXTENDED (counter) or EXTENDED/COUNTERED (accept, decline)" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 422, condition: "counter called when negotiation_round == MAX_NEGOTIATION_ROUNDS (5); the 5th counter succeeds" }
  - { id: ERR_OFFER_NOT_ACCEPTED, http: 409, condition: "execute called on an offer not in ACCEPTED" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "counter/accept called when the logical clock is at or past expires_at" }
  - { id: ERR_START_DATE_BEFORE_CREDENTIAL_ETA, http: 422, condition: "proposed_start_date earlier than current date + credential critical path remaining days + 14-day buffer" }
  - { id: ERR_ITEM_NOT_SUBMITTED, http: 409, condition: "verify called on an item not in DOCS_SUBMITTED" }
  - { id: ERR_ITEM_NOT_VERIFIED, http: 409, condition: "file called on an item not in VERIFIED" }
  - { id: ERR_ITEM_NOT_FILED, http: 409, condition: "approve called on an item not in FILED" }
  - { id: ERR_ITEM_DEPENDENCY_NOT_APPROVED, http: 422, condition: "file called while a depends_on item is not APPROVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "verifier X-User-ID equals the item's submitted_by_user_id" }
  - { id: ERR_MODULE_NOT_SCHEDULED, http: 409, condition: "complete called on a module not in SCHEDULED" }
  - { id: ERR_TEMPLATES_INSUFFICIENT, http: 422, condition: "NOTE_TEMPLATES completion with templates_built_count below the plan's templates_required" }
  - { id: ERR_PLAN_NOT_AWAITING_SIGNOFF, http: 409, condition: "signoff called on a plan not in AWAITING_SIGNOFF" }
  - { id: ERR_TEMPLATE_NOT_DRAFT, http: 409, condition: "activate called on a template not in DRAFT" }
  - { id: ERR_TEMPLATE_NOT_ACTIVE, http: 409, condition: "retire called on a template not in ACTIVE" }
  - { id: ERR_TEMPLATE_OVERLAP, http: 422, condition: "activating template overlaps an ACTIVE template of the same case and weekday under half-open interval semantics" }
  - { id: ERR_POSTURE_NOT_READY, http: 409, condition: "panel open/unfreeze called while the readiness components are not all satisfied" }
  - { id: ERR_START_DATE_NOT_REACHED, http: 422, condition: "panel open or guarantee activate called before the actual start date / start month" }
  - { id: ERR_PANEL_NOT_OPEN, http: 409, condition: "census adjustment or freeze called on a panel not in OPEN" }
  - { id: ERR_PANEL_NOT_FROZEN, http: 409, condition: "unfreeze called on a panel not in FROZEN" }
  - { id: ERR_PANEL_CAPACITY_EXCEEDED, http: 422, condition: "census adjustment or event hold would push current_size above capacity" }
  - { id: ERR_NEGATIVE_CENSUS, http: 422, condition: "census adjustment would push current_size below zero" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "event create called on a campaign not in ACTIVE" }
  - { id: ERR_CAMPAIGN_BUDGET_EXCEEDED, http: 422, condition: "event create would push spent_cents above budget_cents" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 422, condition: "event create whose closed [start_date, end_date] window shares any date with a non-CANCELLED sibling event of the same campaign (adjacent dates conflict)" }
  - { id: ERR_EVENT_NOT_PLANNED, http: 409, condition: "hold/cancel called on an event not in PLANNED" }
  - { id: ERR_GUARANTEE_NOT_DRAFT, http: 409, condition: "activate called on a guarantee not in DRAFT" }
  - { id: ERR_GUARANTEE_NOT_ACTIVE, http: 409, condition: "attest or reconcile called while the guarantee is not ACTIVE" }
  - { id: ERR_REPAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "repayment amount_cents exceeds the outstanding balance computed before the repayment" }
  - { id: ERR_MILESTONE_NOT_PENDING, http: 409, condition: "report called on a milestone not in PENDING" }
  - { id: ERR_REPORTING_WINDOW_CLOSED, http: 422, condition: "report called after month end + 15 days" }
  - { id: ERR_MILESTONE_NOT_REPORTED, http: 409, condition: "attest called on a milestone not in REPORTED" }
  - { id: ERR_MENTOR_NOT_ACTIVE_PHYSICIAN, http: 422, condition: "mentor_physician_id does not reference an ACTIVE physician" }
  - { id: ERR_MENTOR_SPECIALTY_MISMATCH, http: 422, condition: "mentor specialty differs from the mentee's specialty" }
  - { id: ERR_MENTOR_IS_MENTEE, http: 422, condition: "mentor_physician_id equals the case's physician" }
  - { id: ERR_MENTORSHIP_NOT_ACTIVE, http: 409, condition: "check-in or complete called on an assignment not in ACTIVE" }
  - { id: ERR_CHECKINS_INCOMPLETE, http: 422, condition: "complete called before all five day_markers are recorded" }
  - { id: ERR_CHECKIN_OUT_OF_ORDER, http: 422, condition: "check-in day_marker not the immediate next marker in D30..D365 order" }
  - { id: ERR_CHECKIN_ALREADY_RECORDED, http: 409, condition: "check-in with a day_marker already present on the assignment" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition fallback for transitions without a more specific error (e.g., reject from PENDING, withdraw of an EXECUTED offer, separate of a non-ACTIVE physician, campaign activate/complete from the wrong state, submit-docs from an item not in PENDING/REJECTED)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Recruiter
    description: "Physician recruiter; owns physician registration, case opening, and offer drafting/negotiation"
    identity: opaque
    exclusive_operations: ["POST /onboarding/physicians", "POST /onboarding/onboarding-cases", "POST /onboarding/offers", "POST /onboarding/offers/{id}/extend", "POST /onboarding/offers/{id}/withdraw"]
    shared_operations: ["GET read endpoints"]
  - name: ContractAdministrator
    description: "Contract administration; executes accepted offers (segregated from the recruiting step)"
    identity: opaque
    exclusive_operations: ["POST /onboarding/offers/{id}/execute"]
    shared_operations: ["GET read endpoints"]
  - name: CredentialingSpecialist
    description: "Credentialing analyst; registers items, submits documents, verifies, and files (verify segregated from submit per user)"
    identity: opaque
    exclusive_operations: ["POST /onboarding/credential-items", "POST /onboarding/credential-items/{id}/submit-docs", "POST /onboarding/credential-items/{id}/verify", "POST /onboarding/credential-items/{id}/file"]
    shared_operations: ["GET read endpoints"]
  - name: PracticeManager
    description: "Practice operations manager; owns training scheduling/signoff, schedule templates, panel operations, and marketing campaigns"
    identity: opaque
    exclusive_operations: ["POST /onboarding/training-modules", "POST /onboarding/training-modules/{id}/schedule", "POST /onboarding/training-plans/{id}/signoff", "POST /onboarding/schedule-templates", "POST /onboarding/schedule-templates/{id}/activate", "POST /onboarding/schedule-templates/{id}/retire", "POST /onboarding/panels/{id}/open", "POST /onboarding/panels/{id}/freeze", "POST /onboarding/panels/{id}/unfreeze", "POST /onboarding/panels/{id}/census-adjustments", "POST /onboarding/referral-campaigns", "POST /onboarding/referral-campaigns/{id}/activate", "POST /onboarding/referral-campaigns/{id}/complete", "POST /onboarding/campaign-events", "POST /onboarding/campaign-events/{id}/hold", "POST /onboarding/campaign-events/{id}/cancel", "POST /onboarding/ramp-milestones/{id}/report"]
    shared_operations: ["GET read endpoints"]
  - name: FinanceAnalyst
