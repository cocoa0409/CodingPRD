            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "POST /contract-versions/${v1_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000 }, as: ConfigurationAnalyst, captures: { e1_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${e1_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${v1_id}/simulation-batches", payload: { label: "BI" }, as: ConfigurationAnalyst, captures: { bt_id: $.data.id } }
            - { call: "POST /simulation-batches/${bt_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-15", billed_cents: 15000, expected_allowed_cents: 10000 }, as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-16", billed_cents: 15000, expected_allowed_cents: 10000 }, as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${bt_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-17", billed_cents: 15000, expected_allowed_cents: 9999 }, as: ConfigurationAnalyst }
          trigger:
            - { call: "GET /simulation-batches/${bt_id}", as: PlanAdmin, captures: { pre_t: $.data.total_claims, pre_p: $.data.pending_claims, pre_m: $.data.matched_claims } }
            - { call: "POST /simulation-batches/${bt_id}/price", as: ConfigurationAnalyst, captures: { mid_t: $.data.total_claims, mid_m: $.data.matched_claims, mid_mm: $.data.mismatched_claims, mid_p: $.data.pending_claims } }
            - { call: "POST /simulation-batches/${bt_id}/score", as: ConfigurationAnalyst, captures: { sc: $.data.batch_status } }
            - { call: "POST /simulation-batches/${bt_id}/reopen", as: ConfigurationAnalyst, captures: { post_t: $.data.total_claims, post_m: $.data.matched_claims, post_mm: $.data.mismatched_claims, post_x: $.data.excluded_claims, post_p: $.data.pending_claims, post_tp: $.data.total_priced_cents } }
          assert:
            - "Before price: pre_t == 3 and pre_p == 3 and pre_m == 0 (partition holds at creation)"
            - "After price: mid_t == 3 and mid_m == 2 and mid_mm == 1 and mid_p == 0 and 3 == 2 + 1 + 0 + 0 (partition holds after pricing)"
