scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_section_returns_201_with_computed_counts_zero
        claim_type: Creation
        grounds: [entities.Section, "endpoints[POST /sections]"]
        distinguishing_aspect: "POST /sections with name/tier/base_price_cents -> 201; total_seats==0 and available_seats==0 on a fresh section."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sections"
              payload: { name: "Lower 300", tier: "PREMIUM", base_price_cents: 250000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
          assert:
            - "response status == 201"
            - "Section.${sec_id}.total_seats == 0"
            - "Section.${sec_id}.available_seats == 0"
            - "Section.${sec_id}.version == 1"

      - name: get_section_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints[GET /sections/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /sections/{id} with an unknown UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_seat_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Seat.fields.section_id, "endpoints[POST /seats]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /seats omitting required season_end_date -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a section exists"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 310", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_account_default_points_and_tier_applied
        claim_type: Defaults
        grounds: [entities.Account.fields.priority_points, entities.Account.fields.loyalty_tier, "endpoints[POST /accounts]"]
        distinguishing_aspect: "Omitting consecutive_seasons defaults it to 0; a new account starts priority_points==0, loyalty_tier==BRONZE, status==ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { full_name: "Default Acc", email: "defacc@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
          assert:
            - "Account.${acc_id}.priority_points == 0"
            - "Account.${acc_id}.loyalty_tier == BRONZE"
            - "Account.${acc_id}.consecutive_seasons == 0"
            - "Account.${acc_id}.status == ACTIVE"

      - name: create_subscription_invalid_plan_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.SeasonPlan.fields.plan_type, "endpoints[POST /season-plans]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /season-plans with plan_type=BOGUS (not in {FULL,PARTIAL}) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /season-plans"
              payload: { name: "Bad", plan_type: "BOGUS", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_subscription_unknown_account_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Subscription.fields.account_id, "endpoints[POST /subscriptions]", "errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /subscriptions referencing a nonexistent account_id -> 404 ERR_REFERENCED_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["a season plan exists"]
          setup_api_calls:
            - call: "POST /season-plans"
              payload: { name: "Full FK", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { account_id: "00000000-0000-4000-8000-000000000000", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

      - name: system_fields_generated_input_ignored_on_seat
        claim_type: System Fields
        grounds: [entities.Seat.fields.status, "endpoints[POST /seats]"]
        distinguishing_aspect: "Seat.status is system-sourced: a new seat is AVAILABLE regardless of any client attempt; id/created_at/version are server-minted."
        test_recipe:
          setup: ["a section exists"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 320", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
          trigger:
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
          assert:
            - "Seat.${seat_id}.status == AVAILABLE"
            - "Seat.${seat_id}.version == 1"

      - name: section_available_seats_recomputed_on_seat_add
        claim_type: Computed Fields
        grounds: [entities.Section.fields.available_seats, entities.Section.fields.total_seats]
        distinguishing_aspect: "Adding two seats to a section drives total_seats==2 and available_seats==2 (derived-field reconciliation on Seat create)."
        test_recipe:
          setup: ["a section with no seats"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 330", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
          trigger:
            - call: "GET /sections/${sec_id}"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Section.${sec_id}.total_seats == 2"
            - "Section.${sec_id}.available_seats == 2"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_subscription_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE subscription (re-trigger) -> 409 ERR_INVALID_STATE; idempotency is not allowed."
        test_recipe:
          setup: ["an ACTIVE subscription (one ASSIGNED seat, already activated)"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 340", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full SM", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "SM Holder", email: "sm@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: activate_subscription_with_no_assigned_seats_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a PENDING subscription with zero ASSIGNED seat assignments violates the 'at least one ASSIGNED seat' precondition -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a PENDING subscription with NO seat assignments"]
          setup_api_calls:
            - call: "POST /season-plans"
              payload: { name: "Full Empty", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Empty Holder", email: "empty@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_subscription_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_VALIDATION_FROM_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel -> 409 ERR_VALIDATION_FROM_TERMINAL; no further side effects fire."
        test_recipe:
          setup: ["a CANCELLED subscription (was ACTIVE with one seat, then cancelled)"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 350", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Term", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Term Holder", email: "term@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_VALIDATION_FROM_TERMINAL"

      - name: relocate_confirm_from_active_without_begin_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.RELOCATING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "relocate/confirm requires status==RELOCATING; calling it on an ACTIVE subscription (no begin) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["an ACTIVE subscription (never sent relocate begin) and an AVAILABLE target seat in the same section/window"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 360", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full RC", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "RC Holder", email: "rc@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat1_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/relocate/confirm"
              payload: { target_seat_ids: ["${seat2_id}"] }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: complete_sale_before_list_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TicketTransfer.LISTED_to_SOLD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete-sale requires status==LISTED; calling it on a PENDING resale -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["a PENDING RESALE transfer that was never listed; a buyer account exists"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 370", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full CS", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Seller CS", email: "sellercs@x.com" }
              as: BoxOfficeAgent
              captures: { seller_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Buyer CS", email: "buyercs@x.com" }
              as: BoxOfficeAgent
              captures: { buyer_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${seller_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
              captures: { sa_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /ticket-transfers"
              payload: { seat_assignment_id: "${sa_id}", transfer_type: "RESALE", listing_price_cents: 20000 }
              as: AccountHolder
              as_user_id: "${seller_id}"
              captures: { tt_id: $.data.id }
          trigger:
            - call: "POST /ticket-transfers/${tt_id}/complete-sale"
              payload: { recipient_account_id: "${buyer_id}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: pay_installment_records_payment_and_closes_plan
        claim_type: Side Effect Execution
        grounds: [state_machines.PaymentPlan.ACTIVE_to_PAID_IN_FULL, entities.PaymentPlan.fields.amount_paid_cents]
        distinguishing_aspect: "Paying all four installments of a 200000 FULL-subscription plan ([50000,50000,50000,50000]) drives amount_paid_cents to 200000 and plan status to PAID_IN_FULL after the last."
        test_recipe:
          setup: ["ACTIVE subscription locked_price_cents=200000 financed by a 4-installment plan with installments [50000,50000,50000,50000]"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 380", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Pay", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Pay Holder", email: "pay@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /payment-plans"
              payload: { subscription_id: "${sub_id}", installment_count: 4 }
              as: FinanceClerk
              captures: { pp_id: $.data.id }
            - call: "POST /payment-plans/${pp_id}/installments/1/pay"
              payload: {}
              as: FinanceClerk
            - call: "POST /payment-plans/${pp_id}/installments/2/pay"
              payload: {}
              as: FinanceClerk
            - call: "POST /payment-plans/${pp_id}/installments/3/pay"
              payload: {}
              as: FinanceClerk
          trigger:
            - call: "POST /payment-plans/${pp_id}/installments/4/pay"
              payload: {}
              as: FinanceClerk
          assert:
            - "PaymentPlan.${pp_id}.amount_paid_cents == 200000"
            - "PaymentPlan.${pp_id}.status == PAID_IN_FULL"

      - name: error_relocate_stale_version_already_covered
        claim_type: Precondition Enforcement
        grounds: [concurrency_rules.relocate-begin-stale-subscription]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / relocate_state_vs_occ_fiscal_state_wins
          rationale: "OCC stale-version on relocate is exercised as part of the state-vs-fiscal priority conflict §1.8 instance; the positive OCC happy-path is covered by the dedicated cross-cutting corner below."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: payment_plan_waterfall_remainder_on_last_installment
        claim_type: Correct Result
        grounds: [calculations.payment_plan_installments, entities.Installment.fields.amount_cents]
        distinguishing_aspect: "For total=200000, installment_count=3: down=50000, remaining=150000, per_rest=floor(150000/2)=75000, remainder=0 -> installments [50000,75000,75000] with the highest sequence carrying any remainder."
        test_recipe:
          setup: ["ACTIVE subscription with locked_price_cents=200000; create a 3-installment payment plan"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 390", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full WF", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "WF Holder", email: "wf@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /payment-plans"
              payload: { subscription_id: "${sub_id}", installment_count: 3 }
              as: FinanceClerk
              captures: { pp_id: $.data.id }
          assert:
            - "PaymentPlan.${pp_id}.total_cents == 200000"
            - "the Installment with sequence==1 under PaymentPlan.${pp_id} has amount_cents == 50000"
            - "the Installment with sequence==2 under PaymentPlan.${pp_id} has amount_cents == 75000"
            - "the Installment with sequence==3 under PaymentPlan.${pp_id} has amount_cents == 75000"

      - name: cancellation_refund_partial_paid_minus_fee
        claim_type: Correct Result
        grounds: [calculations.cancellation_refund, state_machines.Subscription.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "With one installment paid (50000) on a 200000 plan, cancel computes fee=round_half_up(200000*1000/10000)=20000, refund=max(50000-20000,0)=30000 recorded on the cancelled plan."
        test_recipe:
          setup: ["ACTIVE subscription locked_price_cents=200000 with a 4-installment plan; installment 1 (50000) PAID, then cancel"]
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 400", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
