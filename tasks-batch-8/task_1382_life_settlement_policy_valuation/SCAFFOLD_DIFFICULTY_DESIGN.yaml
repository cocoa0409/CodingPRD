    instances:
      - name: snapshot_window_overlap_rejected_but_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.ValuationSnapshot.fields.period_start
          - state_machines.ValuationSnapshot.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Half-open semantics on ValuationSnapshot windows over the Portfolio
          resource: [2026-12-01, 2027-03-01) touching FINALIZED [2026-09-01,
          2026-12-01) at the shared endpoint is ALLOWED, while [2026-11-15,
          2027-02-01) overlapping its interior is rejected ERR_SNAPSHOT_PERIOD_OVERLAP.
