# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Apparel Boutique & Fitting-Room Retail — Expert band
# Breadth probe over §1.1–§1.7; §1.8-covered corners are excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_style_returns_201_with_defaults_applied
        claim_type: Creation
        grounds: ["entities.Style", "endpoints"]
        distinguishing_aspect: "POST /styles with all required fields returns 201; current_price_cents defaults to list_price_cents, clearance=false, total_available=0."
        test_recipe:
          setup: ["A boutique exists."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq1", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
          trigger:
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-1", name: "Tee", category: "TOPS", season: "SPRING", list_price_cents: 4000 }
              as: Merchandiser
              captures: { st: $.data.id, cp: $.data.current_price_cents }
          assert:
            - "Style.${st}.current_price_cents == 4000"
            - "Style.${st}.clearance == false"
            - "Style.${st}.total_available == 0"
            - "Style.${st}.version == 1"

      - name: create_style_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Style", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /styles omitting list_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A boutique exists."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq2", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
          trigger:
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-2", name: "Tee", category: "TOPS", season: "SPRING" }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Customer", "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No customer with this id exists."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq3", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: duplicate_style_code_in_boutique_returns_duplicate_key
        claim_type: Type Constraints
        grounds: ["entities.Style.fields.style_code", "validations[priority=16]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Creating a second Style with an already-used style_code in the same boutique returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["A boutique with a style style_code=DUP."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq4", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "DUP", name: "A", category: "TOPS", season: "SPRING", list_price_cents: 1000 }
              as: Merchandiser
          trigger:
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "DUP", name: "B", category: "TOPS", season: "SPRING", list_price_cents: 2000 }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_KEY"
            - "response.status == 409"

      - name: sku_variant_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: ["entities.SkuVariant.fields.available", "entities.SkuVariant.fields.reserved"]
        distinguishing_aspect: "POST /styles/{id}/sku-variants sets available=on_hand and reserved=0 from the server; available is computed, not client-set."
        test_recipe:
          setup: ["A style exists."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq5", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-5", name: "Top", category: "TOPS", season: "SPRING", list_price_cents: 1000 }
              as: Merchandiser
              captures: { st: $.data.id }
          trigger:
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Red", on_hand: 7 }
              as: Merchandiser
              captures: { sv: $.data.id, av: $.data.available }
          assert:
            - "SkuVariant.${sv}.available == 7"
            - "SkuVariant.${sv}.reserved == 0"
            - "SkuVariant.${sv}.on_hand == 7"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: capture_unauthorized_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SalesOrder.AUTHORIZED_to_CAPTURED", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /sales-orders/{id}/capture on an order still UNPAID (never authorized) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An order with one line, not authorized."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq6", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "C", email: "c6@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-6", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: cancel_captured_order_rejected_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SalesOrder.OPEN_to_CANCELLED", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /sales-orders/{id}/cancel after payment_status==CAPTURED is rejected with ERR_INVALID_STATE (409) — cancel requires payment in {UNPAID, AUTHORIZED}."
        test_recipe:
          setup: ["A captured order (still fulfillment OPEN)."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq7", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "C", email: "c7@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-7", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/cancel"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: terminal_lockdown_release_converted_hold_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.FittingRoomHold.ACTIVE_to_CONVERTED", "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing a hold already in terminal CONVERTED returns ERR_INVALID_STATE (409); no transition leaves a terminal state."
        test_recipe:
          setup: ["A hold converted to a sale; release attempted afterward."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq8", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "C", email: "c8@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-8", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /fitting-rooms"
              payload: { boutique_id: "${bq}", label: "R1" }
              as: StoreAssociate
              captures: { fr: $.data.id }
            - call: "POST /fitting-room-holds"
              payload: { fitting_room_id: "${fr}", customer_id: "${cu}", sku_variant_id: "${sv}", start_minute: 600, end_minute: 660 }
              as: StoreAssociate
              captures: { hold: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
            - call: "POST /fitting-room-holds/${hold}/convert"
              payload: { sales_order_id: "${so}" }
              as: StoreAssociate
          trigger:
            - call: "POST /fitting-room-holds/${hold}/release"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: markdown_revert_scheduled_to_draft_clears_projection
        claim_type: Valid Transition
        grounds: ["state_machines.MarkdownSchedule.SCHEDULED_to_DRAFT", "entities.MarkdownSchedule.fields.projected_price_cents"]
        distinguishing_aspect: "POST /markdown-schedules/{id}/unschedule moves SCHEDULED->DRAFT and resets projected_price_cents to null (branching-with-revert)."
        test_recipe:
          setup: ["A SCHEDULED markdown with projected price set."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq9", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-9", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 8000 }
              as: Merchandiser
              captures: { st: $.data.id, v0: $.data.version }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 25, effective_date: 0, expected_style_version: "${v0}" }
              as: Merchandiser
              captures: { md: $.data.id }
            - call: "POST /markdown-schedules/${md}/schedule"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules/${md}/unschedule"
              payload: {}
              as: Merchandiser
              captures: { stt: $.data.status }
          assert:
            - "MarkdownSchedule.${md}.status == DRAFT"
            - "MarkdownSchedule.${md}.projected_price_cents == null"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: seasonal_markdown_correct_result_on_activate
        claim_type: Correct Result
        grounds: ["calculations.markdown_pricing", "state_machines.MarkdownSchedule.SCHEDULED_to_ACTIVE", "entities.Style.fields.current_price_cents"]
        distinguishing_aspect: "Activating a SEASONAL 25%-off schedule on a list_price 8000 style writes Style.current_price_cents = round_half_up(8000*0.75) = 6000."
        test_recipe:
          setup: ["Style list 8000; SEASONAL 25% schedule scheduled at effective_date 0."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq10", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-10", name: "X", category: "DRESSES", season: "SUMMER", list_price_cents: 8000 }
              as: Merchandiser
              captures: { st: $.data.id, v0: $.data.version }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 25, effective_date: 0, expected_style_version: "${v0}" }
              as: Merchandiser
              captures: { md: $.data.id }
            - call: "POST /markdown-schedules/${md}/schedule"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules/${md}/activate"
              payload: {}
              as: Merchandiser
              captures: { ap: $.data.applied_price_cents }
          assert:
            - "MarkdownSchedule.${md}.applied_price_cents == 6000"
            - "Style.${st}.current_price_cents == 6000"

      - name: silver_loyalty_discount_applied_at_authorize
        claim_type: Constants Applied
        grounds: ["calculations.order_pricing", "entities.SalesOrder.fields.loyalty_discount_cents", "entities.Customer.fields.loyalty_tier"]
        distinguishing_aspect: "A SILVER customer (captured_spend 50000) gets TIER_DISCOUNT_BPS[SILVER]=500 applied: a 10000 subtotal order yields loyalty_discount_cents=500 and total 9500 at tax 0."
        test_recipe:
          setup: ["Customer pushed to SILVER by one captured 50000 order; new 10000 order authorized."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq11", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "S", email: "s11@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-50", name: "Big", category: "OUTERWEAR", season: "WINTER", list_price_cents: 50000 }
              as: Merchandiser
              captures: { stb: $.data.id }
            - call: "POST /styles/${stb}/sku-variants"
              payload: { size: "M", color: "Black", on_hand: 5 }
              as: Merchandiser
              captures: { svb: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so1: $.data.id }
            - call: "POST /sales-orders/${so1}/lines"
              payload: { sku_variant_id: "${svb}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so1}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so1}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-10b", name: "Mid", category: "TOPS", season: "SPRING", list_price_cents: 10000 }
              as: Merchandiser
              captures: { stm: $.data.id }
            - call: "POST /styles/${stm}/sku-variants"
              payload: { size: "M", color: "White", on_hand: 5 }
              as: Merchandiser
              captures: { svm: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so2: $.data.id }
            - call: "POST /sales-orders/${so2}/lines"
              payload: { sku_variant_id: "${svm}", qty: 1 }
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so2}/authorize"
              payload: {}
              as: StoreAssociate
              captures: { disc: $.data.loyalty_discount_cents, tot: $.data.total_cents }
          assert:
            - "Customer.${cu}.loyalty_tier == SILVER"
            - "SalesOrder.${so2}.loyalty_discount_cents == 500"
            - "SalesOrder.${so2}.total_cents == 9500"

      - name: tier_threshold_exact_boundary_silver
        claim_type: Correct Result
        grounds: ["calculations.loyalty_tier_eval", "entities.Customer.fields.loyalty_tier", "entities.Customer.fields.captured_spend_cents"]
        distinguishing_aspect: "captured_spend_cents exactly 50000 yields loyalty_tier SILVER (>= boundary), confirming the inclusive threshold."
        test_recipe:
          setup: ["Customer captures exactly 50000 net cash via one order."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq12", state_code: "OR", tax_rate_bps: 0 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "T", email: "t12@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-50c", name: "Coat", category: "OUTERWEAR", season: "WINTER", list_price_cents: 50000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Gray", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
              captures: { tier: $.data.payment_status }
          assert:
            - "Customer.${cu}.captured_spend_cents == 50000"
            - "Customer.${cu}.loyalty_tier == SILVER"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: markdown_activate_before_effective_date_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_MARKDOWN_NOT_EFFECTIVE]"]
        distinguishing_aspect: "Activating a SCHEDULED markdown whose effective_date (5) is past the boutique's current_business_date (0) returns ERR_MARKDOWN_NOT_EFFECTIVE (409)."
        test_recipe:
          setup: ["Markdown scheduled with effective_date 5; clock at 0."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq13", state_code: "CA", tax_rate_bps: 875 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-13", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 8000 }
              as: Merchandiser
              captures: { st: $.data.id, v0: $.data.version }
            - call: "POST /markdown-schedules"
              payload: { style_id: "${st}", phase: "SEASONAL", markdown_pct: 20, effective_date: 5, expected_style_version: "${v0}" }
              as: Merchandiser
              captures: { md: $.data.id }
            - call: "POST /markdown-schedules/${md}/schedule"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /markdown-schedules/${md}/activate"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MARKDOWN_NOT_EFFECTIVE"
            - "response.status == 409"

      - name: exchange_return_missing_variant_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=17]", "errors[ERR_EXCHANGE_UNAVAILABLE]"]
        distinguishing_aspect: "Approving an EXCHANGE return whose exchange variant has available 0 returns ERR_EXCHANGE_UNAVAILABLE (409)."
        test_recipe:
          setup: ["Completed order line; an EXCHANGE return targeting a variant with available 0 (DISCONTINUED-equivalent: on_hand 0)."]
          setup_api_calls:
            - call: "POST /boutiques"
              payload: { name: "Bq14", state_code: "OR", tax_rate_bps: 0, return_window_days: 30 }
              as: StoreManager
              captures: { bq: $.data.id }
            - call: "POST /customers"
              payload: { boutique_id: "${bq}", full_name: "E", email: "e14@x.com" }
              as: StoreAssociate
              captures: { cu: $.data.id }
            - call: "POST /styles"
              payload: { boutique_id: "${bq}", style_code: "ST-14", name: "X", category: "TOPS", season: "SPRING", list_price_cents: 5000 }
              as: Merchandiser
              captures: { st: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "M", color: "Blue", on_hand: 5 }
              as: Merchandiser
              captures: { sv: $.data.id }
            - call: "POST /styles/${st}/sku-variants"
              payload: { size: "L", color: "Blue", on_hand: 0 }
              as: Merchandiser
              captures: { sv0: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cu}" }
              as: StoreAssociate
              captures: { so: $.data.id }
            - call: "POST /sales-orders/${so}/lines"
              payload: { sku_variant_id: "${sv}", qty: 1 }
              as: StoreAssociate
              captures: { ol: $.data.id }
            - call: "POST /sales-orders/${so}/authorize"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /sales-orders/${so}/complete"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { sales_order_id: "${so}", order_line_id: "${ol}", resolution: "EXCHANGE", exchange_sku_variant_id: "${sv0}" }
              as: StoreAssociate
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /returns/${rr}/approve"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_EXCHANGE_UNAVAILABLE"
            - "response.status == 409"

      - name: insufficient_store_credit_on_capture
        claim_type: Violation → Error
