            - "the second approve returns 200: StaffAssignment.${chaperone_shift_id}.status == APPROVED, approved_by_user_id == tm-quinn, Volunteer.${chaperone_id}.assignment_count == 1"
            - "the second confirm returns 200: TourStop.${stop_id}.status == CONFIRMED"
