              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_a}/price"
              payload: {}
              as: ShopStaff
              captures: { va: $.data.version }
            - call: "POST /orders/${order_a}/confirm"
              payload: { expected_order_version: "${va}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_level: "STANDARD", due_date: "2026-07-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { catalog_product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "POST /order-lines/${line_b}/proofs"
              payload: { proof_kind: "TEXT", content_ref: "B" }
              as: ShopStaff
              captures: { pb: $.data.id }
            - call: "POST /order-lines/${line_b}/proofs/${pb}/send"
              payload: {}
              as: ShopStaff
            - call: "POST /order-lines/${line_b}/proofs/${pb}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_b}/price"
              payload: {}
              as: ShopStaff
              captures: { vb: $.data.version }
          trigger:
