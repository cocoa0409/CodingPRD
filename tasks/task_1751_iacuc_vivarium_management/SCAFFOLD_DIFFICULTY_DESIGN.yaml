              payload: { animal_tag: "BR-M", cage_id: "${br_cage}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-01-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "BR-F", cage_id: "${br_cage}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-01-01T00:00:00Z", sex: "F" }
              as: AnimalCareStaff
            - call: "POST /iacuc/litters"
              payload: { cage_id: "${br_cage}", protocol_id: "${proto_id}", born_on: "2026-08-01T00:00:00Z", pup_count: 4 }
              as: AnimalCareStaff
