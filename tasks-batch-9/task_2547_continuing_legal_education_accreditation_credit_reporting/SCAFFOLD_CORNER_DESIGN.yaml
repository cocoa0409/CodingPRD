          assert:
            - "Trigger -> HTTP 200: ReciprocityClaim.${clm_id}.status == 'APPROVED' with converted_minutes == 0"
            - "ComplianceCycle.${cyc_id}.credit_status == 'DEFICIENT' and comity_claim_id == ${clm_id}"
            - "ComplianceCycle.${cyc_id}.certified_at is null (the deficient comity branch does not certify)"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 240 (NOT lifted to 1800) with earned_bias_minutes == 0 and deficiency_bias_minutes == 120"
            - "Attorney.${att_id}.open_deficiency_count == 1"
            - "GET /cle/credit-records?cycle_id=${cyc_id} returns total_count == 1"

      - name: sweep_suspension_cascades_into_the_attorney_and_denies_the_submitted_claim
        claim_type: cross_entity
        grounds:
          - state_machines.ComplianceCycle.DELINQUENT_to_ADMIN_SUSPENDED
          - state_machines.ReciprocityClaim.SUBMITTED_to_DENIED
          - domain_constants.DELINQUENCY_TO_SUSPENSION_DAYS
          - domain_constants.REINSTATEMENT_FEE_CENTS
          - calculations.late_fee_assessment
        distinguishing_aspect: "One sweep call reaches three entities the attorney never touched: the cycle moves DELINQUENT -> ADMIN_SUSPENDED, the Attorney row flips ACTIVE -> ADMIN_SUSPENDED, and every SUBMITTED ReciprocityClaim of that attorney is denied with determination_reason 'ATTORNEY_ADMIN_SUSPENDED' — while a second REINSTATEMENT assessment of 50000 stacks on the capped 100000 late fee for a 150000 balance."
        test_recipe:
          setup:
            - "Attorney with a 2024-2026 cycle (GROUP_1 deadline 2026-02-01), zero credit, and one SUBMITTED California reciprocity claim."
            - "First sweep at the default clock 2026-08-01 makes the cycle DELINQUENT; the clock then moves to exactly delinquent_since + 60 days."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2040", full_name: "Yusuf Adeyemi", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "GET /cle/attorneys/${att_id}"
              as: BoardAdmin
              captures: { att_v: $.data.version }
            - call: "POST /cle/reciprocity-claims"
              payload: { attorney_id: "${att_id}", basis: "RECIPROCITY", origin_jurisdiction: "CA", origin_course_title: "California trial advocacy", origin_credit_hours: 2.0, origin_category: "GENERAL", completion_date: "2025-05-05T00:00:00Z", expected_attorney_version: "${att_v}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { clm_id: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep2_id: $.data.id }
          assert:
            - "After the first sweep: ComplianceCycle.${cyc_id}.administrative_status == 'DELINQUENT', delinquent_since == '2026-08-01T00:00:00Z', ReportingSweep.${sweep1_id}.delinquencies_issued == 1 and late_fees_assessed_cents == 100000 (deficiency 2160 minutes -> 36 hours -> 60000 + 2500*20 = 110000, capped at 100000)"
            - "After the first sweep: Attorney.${att_id}.outstanding_fee_cents == 100000 and status == 'ACTIVE'"
            - "Trigger -> ReportingSweep.${sweep2_id}.suspensions_issued == 1, delinquencies_issued == 0, late_fees_assessed_cents == 50000"
            - "ComplianceCycle.${cyc_id}.administrative_status == 'ADMIN_SUSPENDED' while credit_status is still 'OPEN' (the two dimensions are independent)"
            - "Attorney.${att_id}.status == 'ADMIN_SUSPENDED' and outstanding_fee_cents == 150000"
            - "ReciprocityClaim.${clm_id}.status == 'DENIED' with determination_reason == 'ATTORNEY_ADMIN_SUSPENDED'"
            - "GET /cle/fee-assessments?attorney_id=${att_id} returns total_count == 2 with one LATE_COMPLIANCE of 100000 and one REINSTATEMENT of 50000, both ASSESSED and both carrying assessed_by_sweep_id"

      - name: the_two_cycle_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ComplianceCycle.parallel_dimensions
        excluded_because:
          difficulty_instance: compliance_cycle_administrative_dimension_advances_twice_while_credit_dimension_stays_open
          rationale: "The §1.8 instance already drives the administrative dimension GOOD_STANDING -> DELINQUENT -> ADMIN_SUSPENDED across two sweeps while asserting that credit_status never leaves OPEN, and then shows the credit dimension moving on its own; a second parallel-dimension probe would restate it."

      - name: the_review_loops_are_bounded_and_a_remand_refills_the_budget
        claim_type: cyclic
        grounds:
          - state_machines.CourseApplication.SUBMITTED_to_INFO_REQUESTED
          - state_machines.CourseApplication.APPEALED_to_SUBMITTED
        excluded_because:
          difficulty_instance: course_application_info_request_loop_then_remand_refills_the_budget
          rationale: "Both cycles (info-request loop bounded by MAX_INFO_REQUEST_ROUNDS and the remand loop bounded by MAX_REMANDS, including the info_request_round reset on REMAND) are exercised end-to-end by that §1.8 instance."

      - name: promotion_out_of_probation_is_gated_on_a_cleared_audit
        claim_type: guarded_transitions
        grounds:
          - state_machines.Provider.PROBATIONARY_to_ACCREDITED
          - errors[ERR_NO_CLEARED_AUDIT]
        excluded_because:
          difficulty_instance: provider_cannot_leave_probation_until_one_of_its_audits_reaches_cleared
          rationale: "That §1.8 instance is exactly the cross-entity guard: GRANT_FULL refused with ERR_NO_CLEARED_AUDIT while the provider's only audit is open, then accepted once an audit reaches CLEARED."

      - name: a_substantiated_course_complaint_cascades_four_levels_deep
        claim_type: cross_entity
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Course.APPROVED_to_REVOKED
          - state_machines.CreditRecord.VERIFIED_to_VOIDED
          - state_machines.ComplianceCycle.SATISFIED_to_OPEN
        excluded_because:
          difficulty_instance: substantiated_course_complaint_unwinds_a_satisfied_cycle_and_the_successor_carryover
          rationale: "The full complaint -> course revocation -> record voiding -> cycle reversion -> successor carryover rewrite chain is the subject of that §1.8 instance."

      - name: the_outstanding_balance_ledger_stays_reconciled
        claim_type: ledger_sync
        grounds:
          - entities.Attorney.fields.outstanding_fee_cents
          - state_machines.FeeAssessment.ASSESSED_to_PAID
          - state_machines.FeeAssessment.ASSESSED_to_VOIDED
        excluded_because:
          difficulty_instance: outstanding_fee_cents_always_equals_the_sum_of_assessed_assessments
          rationale: "That §1.8 invariant instance walks the balance through assessment, payment, waiver and grace-window voiding and reconciles it against the assessment list at every step."

  # ===========================================================================
  # §1.9.3  CALCULATIONS — one probe per calculation rule and per named
  #         constant table, minus the arithmetic §1.8 already owns.
  # ===========================================================================
  - section: calculations
    instances:

      - name: a_full_length_cycle_takes_the_flat_requirement_and_its_group_filing_deadline
        claim_type: constants_applied
        grounds:
          - calculations.cycle_requirement_derivation
          - domain_constants.TOTAL_REQUIRED_MINUTES
          - domain_constants.DEADLINE_OFFSET_DAYS
          - endpoints[POST /cle/attorneys/{id}/compliance-cycles]
        distinguishing_aspect: "An attorney admitted long before the period gets the unprorated 1800 / 180 / 60 / 120 requirement, and the filing deadline is period_end plus a group-specific day offset (31 / 61 / 91) — three attorneys sharing one identical period end up with three different filing_deadline values, and the offsets are day arithmetic across a leap February, not month arithmetic."
        test_recipe:
          setup:
            - "Three attorneys admitted 2004-01-01, one in each compliance group, each with the same 2026-01-01 -> 2028-01-01 period."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2100", full_name: "Group One Filer", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a1: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2101", full_name: "Group Two Filer", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a2: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2102", full_name: "Group Three Filer", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /cle/attorneys/${a1}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { c1: $.data.id }
            - call: "POST /cle/attorneys/${a2}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { c2: $.data.id }
            - call: "POST /cle/attorneys/${a3}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { c3: $.data.id }
          assert:
            - "All three cycles: required_total_minutes == 1800, required_ethics_minutes == 180, required_technology_minutes == 60, required_bias_minutes == 120, prorated == false"
            - "ComplianceCycle.${c1}.filing_deadline == '2028-02-01T00:00:00Z' (period_end + 31 days)"
            - "ComplianceCycle.${c2}.filing_deadline == '2028-03-02T00:00:00Z' (period_end + 61 days, crossing the 29-day February of 2028)"
            - "ComplianceCycle.${c3}.filing_deadline == '2028-04-01T00:00:00Z' (period_end + 91 days)"
            - "All three cycles: credit_status == 'OPEN', administrative_status == 'GOOD_STANDING', earned_countable_minutes == 0, carryover_in_general_minutes == 0, carryover_in_ethics_minutes == 0"

      - name: a_newly_admitted_attorney_is_prorated_from_the_month_after_admission
        claim_type: correct_result
        grounds:
          - calculations.cycle_requirement_derivation
          - domain_constants.CYCLE_MONTHS
          - domain_constants.PRORATED_ETHICS_REQUIRED_MINUTES
        distinguishing_aspect: "Proration counts whole months from the first day of the month AFTER admission, not from the admission date itself: admission 2027-03-15 anchors at 2027-04-01, leaving 9 months, so required_total_minutes is ceil(1800 * 9 / 24 / 60) * 60 = 720 (the raw 675 rounded UP to a whole credit hour) and the specialty minimums drop to the prorated 90 / 60 / 60 because 9 is under the 12-month threshold."
        test_recipe:
          setup:
            - "One attorney admitted 2027-03-15, i.e. inside the 2026-01-01 -> 2028-01-01 period."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2110", full_name: "Nadia Okonjo", admission_date: "2027-03-15T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          assert:
            - "Trigger -> HTTP 201 with prorated == true"
            - "ComplianceCycle.${cyc_id}.required_total_minutes == 720 (NOT 675 and NOT 690: the raw 1800*9/24 = 675 minutes is rounded up to the next whole 60)"
            - "ComplianceCycle.${cyc_id}.required_ethics_minutes == 90, required_technology_minutes == 60, required_bias_minutes == 60"
            - "ComplianceCycle.${cyc_id}.filing_deadline == '2028-02-01T00:00:00Z' (proration never moves the deadline)"

      - name: the_proration_specialty_threshold_is_inclusive_at_exactly_twelve_months
        claim_type: threshold
        grounds:
          - calculations.cycle_requirement_derivation
          - domain_constants.PRORATION_SPECIALTY_THRESHOLD_MONTHS
        distinguishing_aspect: "PRORATION_SPECIALTY_THRESHOLD_MONTHS is an inclusive >= boundary evaluated on the anchored month count: 12 months remaining keeps the FULL 180 / 60 / 120 specialty minimums while 11 months drops to 90 / 60 / 60, and the two prorated totals differ as well (900 versus 840). Admission dates one month apart therefore land on opposite sides of the branch."
        test_recipe:
          setup:
            - "Attorney X admitted 2026-12-05 (anchor 2027-01-01 -> exactly 12 months remaining)."
            - "Attorney Y admitted 2027-01-01 (anchor 2027-02-01 -> 11 months remaining)."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2120", full_name: "Twelve Month Admittee", admission_date: "2026-12-05T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { ax: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2121", full_name: "Eleven Month Admittee", admission_date: "2027-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { ay: $.data.id }
          trigger:
            - call: "POST /cle/attorneys/${ax}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cx: $.data.id }
            - call: "POST /cle/attorneys/${ay}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cy: $.data.id }
          assert:
            - "ComplianceCycle.${cx}.prorated == true, required_total_minutes == 900 (ceil(1800*12/24/60)*60), required_ethics_minutes == 180, required_technology_minutes == 60, required_bias_minutes == 120"
            - "ComplianceCycle.${cy}.prorated == true, required_total_minutes == 840 (ceil(1800*11/24/60) = ceil(13.75) = 14 hours), required_ethics_minutes == 90, required_technology_minutes == 60, required_bias_minutes == 60"

      - name: an_exempt_attorney_gets_a_zero_requirement_that_is_never_re_derived
        claim_type: input_set_filtering
        grounds:
          - calculations.cycle_requirement_derivation
          - entities.Attorney.fields.status
          - endpoints[POST /cle/attorneys/{id}/status-changes]
        distinguishing_aspect: "The exemption branch is read from the Attorney exactly once, at cycle creation: an EXEMPT attorney's cycle carries required_total_minutes 0 with prorated false (the proration branch is never reached), and restoring the attorney to ACTIVE afterwards leaves the stored requirement at 0 — the rule is explicitly never re-derived, so a cycle opened later for the same attorney does carry 1800."
        test_recipe:
          setup:
            - "One attorney moved to EXEMPT before any cycle exists, admitted inside the first period so that a naive implementation would prorate."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2130", full_name: "Judicial Officer", admission_date: "2026-06-15T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/status-changes"
              payload: { status: "EXEMPT", reason: "Appointed to the bench" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
