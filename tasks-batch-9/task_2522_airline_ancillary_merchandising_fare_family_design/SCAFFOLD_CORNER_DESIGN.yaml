              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC554", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "CHECKIN_OPEN" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "BOARDING" }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /flights/${fl_id}/phase-advance"
              payload: { target_phase: "DEPARTED" }
              as: OperationsController
              as_user_id: "oc-001"
          trigger:
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 20, row_end: 20, seat_letters: ["A"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err_segment: $.data.error_id }
            - call: "POST /bookings"
              payload: { record_locator: "DEPRT1", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
