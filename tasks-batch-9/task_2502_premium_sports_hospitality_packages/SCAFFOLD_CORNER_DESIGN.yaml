            ${d3} == "2027-01-02T15:00:00.000Z" (event_date - 30 days), i.e.
            strictly increasing.
            Booking 2 at exactly 30 days out (the `>=` boundary): still 3 rows
            with ${b2_a1} == 4366 and ${b2_a3} == 4365, but the floors bite —
