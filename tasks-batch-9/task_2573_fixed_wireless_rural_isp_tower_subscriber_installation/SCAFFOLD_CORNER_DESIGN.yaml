              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_v1: $.data.version }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Occ One", premise_latitude: 41.2610, premise_longitude: -104.7610, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_a: $.data.id }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Occ Two", premise_latitude: 41.2620, premise_longitude: -104.7620, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_b: $.data.id }
          trigger:
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_a}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold_a: $.data.id }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_b}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { err_stale: $.data.error_id }
            - call: "GET /sectors/${sector_id}"
              as: CapacityPlanner
              captures: { sector_v2: $.data.version, posture_mid: $.data.capacity_posture, committed_mid: $.data.committed_mbps }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_b}", expected_sector_version: "${sector_v2}" }
              as: SalesAgent
              captures: { hold_b: $.data.id }
            - call: "GET /sectors/${sector_id}"
              as: CapacityPlanner
              captures: { sector_v3: $.data.version, committed_end: $.data.committed_mbps }
          assert:
            - "The first reservation returns HTTP 201 and lifts Sector.version from ${sector_v1} to ${sector_v2} == ${sector_v1} + 1"
            - "${err_stale} == \"ERR_STALE_SECTOR_VERSION\" with HTTP 412 on the second call, even though ${committed_mid} == 50 and 150 Mbps of allowance remain - the concurrency check precedes the capacity check"
            - "The refused call creates no CapacityHold: ${committed_mid} == 50 and ${posture_mid} == \"OPEN\" (ratio 2.000 is below r_watch 4.0) are unchanged by it, and Sector.version is still ${sector_v2}"
            - "Re-reading and retrying the identical body with ${sector_v2} returns HTTP 201, ${committed_end} == 100 and ${sector_v3} == ${sector_v2} + 1"
            - "GET /capacity-holds?status=HELD returns total_count 2 - exactly one row per accepted reservation"

      - name: plan_change_requires_a_current_account_version_and_bumps_both_rows
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.plan-change-stale-subscriber
          - errors.ERR_STALE_SUBSCRIBER_VERSION
          - endpoints[POST /subscribers/{id}/plan-changes]
          - calculations.sector_capacity_posture
        distinguishing_aspect: |
          Here the guarded row is the account itself, and the write it is protecting against is its own
          previous plan change: after upgrading 50 -> 150 the client's remembered version is one behind,
          so replaying with it is 412 - crucially without undoing the upgrade, so Sector.sold_mbps stays
          at 150 rather than silently sliding back. The upgrade also has to land exactly on the allowance
          boundary (floor(25 * 8.0) - 50 == 150 remaining for a 150 Mbps plan) to prove the OCC check and
          the capacity check are independent gates.
        test_recipe:
