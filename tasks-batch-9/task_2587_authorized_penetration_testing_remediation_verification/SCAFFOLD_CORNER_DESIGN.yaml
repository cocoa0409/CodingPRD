          - errors[ERR_BELOW_RISK_THRESHOLD]
          - entities.ScopeItem.fields.below_threshold_flag
        distinguishing_aspect: "With risk_appetite_score 0 the admission_threshold is 100, so the 89.80 candidate carries below_threshold_flag true: APPROVE without override_note is 422 ERR_BELOW_RISK_THRESHOLD, and the same call with an override_note succeeds and records that note as the decision_note."
        test_recipe:
