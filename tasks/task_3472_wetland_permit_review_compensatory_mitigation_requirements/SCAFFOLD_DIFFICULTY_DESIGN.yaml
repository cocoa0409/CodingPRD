  - rule_id: non_linear_state_machine
    instances:
      - name: alternatives_analysis_revision_cycle
        grounds:
          - state_machines.AlternativesAnalysis.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.AlternativesAnalysis.REVISION_REQUESTED_to_SUBMITTED
          - entities.AlternativesAnalysis.fields.revision_count
        distinguishing_aspect: |
          Cyclic machine on AlternativesAnalysis: SUBMITTED -> REVISION_REQUESTED ->
          SUBMITTED -> ACCEPTED, with revision_count incrementing only on the PATCH-driven
          return edge. A purely linear pipeline could not express the review-revise loop.
        test_recipe:
          setup:
            - "Individual application in ALTERNATIVES_REVIEW"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations", payload: { site_id: "${site_id}", jd_type: "APPROVED", determination: "JURISDICTIONAL", rationale: "Jurisdictional" }, as: Reviewer, as_user_id: "rev-1", captures: { jd_id: "$.data.id" } }
            - { call: "POST /wetland-permits/jurisdictional-determinations/${jd_id}/issue", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/applications", payload: { site_id: "${site_id}", jd_id: "${jd_id}", pathway: "INDIVIDUAL", impacts: [ { resource_type: "FORESTED_WETLAND", impact_acres: 2.0 } ], project_purpose: "Stormwater facility", estimated_cost_dollars: 750000 }, as: Applicant, as_user_id: "${ap_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /wetland-permits/applications/${app_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "BEGIN" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/applications/${app_id}/screening", payload: { action: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /wetland-permits/alternatives-analyses", payload: { application_id: "${app_id}", avoidance_demonstrated: true, avoidance_narrative: "Initial narrative", minimization_steps: ["Only one step"], ledpa_conclusion: "UNDETERMINED", offsite_alternatives_considered: 1 }, as: Applicant, as_user_id: "${ap_id}", captures: { aa_id: "$.data.id", st0: "$.data.status" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "REQUEST_REVISION", revision_notes: "LEDPA conclusion unsupported" }, as: Reviewer, as_user_id: "rev-1", captures: { st1: "$.data.status" } }
            - { call: "PATCH /wetland-permits/alternatives-analyses/${aa_id}", payload: { minimization_steps: ["Relocated outfall", "Reduced footprint by 40 percent"], ledpa_conclusion: "PROPOSED_IS_LEDPA" }, as: Applicant, as_user_id: "${ap_id}", captures: { st2: "$.data.status", rev_count: "$.data.revision_count" } }
            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1", captures: { st3: "$.data.status" } }
          assert:
            - "st0 == SUBMITTED (initial state)"
            - "st1 == REVISION_REQUESTED"
            - "st2 == SUBMITTED (cycle edge) and rev_count == 1"
            - "st3 == ACCEPTED after the revised analysis satisfies the LEDPA gate"

      - name: enforcement_case_parallel_dimensions_with_defaulted_loop
        grounds:
          - state_machines.EnforcementCase.RESOLUTION_PENDING_to_DEFAULTED
          - state_machines.EnforcementCase.DEFAULTED_to_RESOLUTION_PENDING
          - state_machines.EnforcementCase.RESOLUTION_PENDING_to_CLOSED
          - calculations.enforcement_penalty_accrual
        distinguishing_aspect: |
          Two independent state dimensions on EnforcementCase: case_status loops
          RESOLUTION_PENDING -> DEFAULTED -> RESOLUTION_PENDING -> CLOSED while
          resolution_track stays RESTORATION throughout; the deadline arithmetic (90 days,
          then a one-time 60-day extension) lives on the case_status dimension only.
        test_recipe:
          setup:
            - "EnforcementCase opened by officer eo-1, confirmed by officer eo-2 at 2026-09-01, RESTORATION track with deadline 2026-11-30"
          setup_api_calls:
            - { call: "POST /wetland-permits/applicants", payload: { legal_name: "Acme Dredging LLC", organization_type: "CORPORATION", contact_email: "permits@acme.example" }, as: SystemAdmin, captures: { ap_id: "$.data.id" } }
            - { call: "POST /wetland-permits/sites", payload: { applicant_id: "${ap_id}", site_name: "Piney Branch Tract", state_code: "VA", watershed_code: "18020101", total_acres: 40.0, resource_types_present: ["FORESTED_WETLAND", "STREAM"] }, as: SystemAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /wetland-permits/enforcement-cases", payload: { site_id: "${site_id}", responsible_applicant_id: "${ap_id}", unauthorized_fill_acres: 2.0, description: "Unpermitted fill in forested wetland" }, as: EnforcementOfficer, as_user_id: "eo-1", captures: { case_id: "$.data.id" } }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/confirm-violation", payload: {}, as: EnforcementOfficer, as_user_id: "eo-2" }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/set-resolution", payload: { track: "RESTORATION" }, as: EnforcementOfficer, as_user_id: "eo-2", captures: { dl1: "$.data.restoration_deadline", track1: "$.data.resolution_track" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/verify-restoration", payload: {}, as: EnforcementOfficer, as_user_id: "eo-2", captures: { err_verify: "$.data.error_id" } }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/grant-extension", payload: {}, as: DistrictEngineer, as_user_id: "de-1", captures: { st_ext: "$.data.case_status", dl2: "$.data.restoration_deadline", ext_used: "$.data.extension_used" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /wetland-permits/enforcement-cases/${case_id}/verify-restoration", payload: {}, as: EnforcementOfficer, as_user_id: "eo-2", captures: { st_final: "$.data.case_status", penalty_final: "$.data.penalty_final_dollars", track_final: "$.data.resolution_track" } }
          assert:
            - "track1 == RESTORATION and dl1 == 2026-11-30T00:00:00Z (confirmed 2026-09-01 + 90 days)"
            - "After clock 2026-12-01 the case auto-flipped to DEFAULTED, so the first verify-restoration is rejected: err_verify == ERR_CASE_INVALID_STATE"
            - "st_ext == RESOLUTION_PENDING, ext_used == true, dl2 == 2027-01-30T00:00:00Z (extension +60 days from 2026-12-01)"
            - "st_final == CLOSED and penalty_final == 34000.00 (2.0 acres * 250.0 * 136 days = 68000.00, good-faith offset halves it)"
            - "track_final == RESTORATION (the resolution dimension never moved while case_status looped)"

  - rule_id: transitive_cascade
    instances:
      - name: appeal_sustain_cascades_jd_application_credits
        grounds:
          - state_machines.Appeal.FILED_to_SUSTAINED
          - state_machines.JurisdictionalDetermination.ISSUED_to_REVERSED
          - state_machines.PermitApplication.ALTERNATIVES_REVIEW_to_SUSPENDED_PENDING_JD
          - state_machines.CreditTransaction.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the appeal decision: Appeal SUSTAINED mutates the
          JD to REVERSED; the JD reversal itself suspends every non-terminal application
          on that JD; each suspension itself releases the application's RESERVED credit
          transactions. Three caused links, origin = POST /appeals/{id}/decide.
        test_recipe:
          setup:
            - "Application in ALTERNATIVES_REVIEW (AA ACCEPTED); BANK_CREDITS plan APPROVED; 7.0 credits RESERVED (not purchased) at an OPERATIONAL in-basin bank with capacity 20"
