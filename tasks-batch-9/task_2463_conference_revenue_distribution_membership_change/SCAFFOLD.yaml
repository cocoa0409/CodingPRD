    path: /championship-events/{id}/host
    description: "Confirm that the event was hosted, which is required before it can be settled. A HOST_AT_RISK event may still be confirmed, recording that the host's compliance had lapsed."
    roles: [Commissioner, ScheduleCoordinator]
    input: []
    output: ChampionshipEvent
    side_effects:
      - "sets status HOSTED"
