            - "the Route is SCOPE_LOCKED with scope_locked_at 2026-08-10T00:00:00Z, planned_complexity_index 1000, total_preliminary_cost_cents 1971469 and total_bid_ready_cost_cents 1971475"
            - "a SECOND FieldWalkout (a re-walk) on the same segment carries one PoleObservation and is SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
