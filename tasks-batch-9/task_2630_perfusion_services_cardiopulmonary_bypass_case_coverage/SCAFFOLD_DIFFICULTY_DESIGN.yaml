            - "the supersede returns HTTP 200 with BypassCase.${case1}.bypass_status still STAFFED and assigned_perfusionist_id == ${p2}; the contract is unchanged at accrued_case_count == 2 and accrued_case_fee_cents == 800000, because the outgoing 400000 was withdrawn before the recomputed 400000 was added and the count never moved"
