            - { call: "POST /slot-assignments/${news_slot_id}/confirm", as: ProgramDirector }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { opening_minutes: "$.data.total_assigned_minutes", opening_pct: "$.data.public_affairs_minutes_pct" } }
            - { call: "POST /compliance-incidents", payload: { category: "POLITICAL_CONTENT", severity: "CRITICAL", occurred_at: "2026-07-28T20:30:00Z", complainant_note: "Unbalanced candidate advocacy through a whole hour.", program_id: "${music_program_id}" }, as: ComplianceOfficer, as_user_id: "officer-adjudicator", captures: { incident_id: "$.data.id" } }
          trigger:
            - { call: "POST /compliance-incidents/${incident_id}/adjudicate", payload: { finding: "SUBSTANTIATED" }, as: ComplianceOfficer, as_user_id: "officer-adjudicator" }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { stripped_minutes: "$.data.total_assigned_minutes", stripped_pct: "$.data.public_affairs_minutes_pct" } }
            - { call: "POST /compliance-incidents/${incident_id}/remediate", payload: { remediation_note: "Balancing hour aired and the host retrained on political content." }, as: ComplianceOfficer, as_user_id: "officer-adjudicator" }
            - { call: "POST /slot-assignments/${music_slot_id}/reinstate", as: ProgramDirector, captures: { restored_status: "$.data.status" } }
          assert:
            - "Before adjudication GET /schedule-grids/${grid_id} shows total_assigned_minutes == 150 and public_affairs_minutes_pct == 20.00"
            - "The adjudication returns 200 and GET /programs/${music_program_id} shows compliance_penalty_points == 6 and compliance_standing == RESTRICTED"
            - "Immediately after adjudication GET /schedule-grids/${grid_id} shows total_assigned_minutes == 30 and public_affairs_minutes_pct == 100.00, and GET /slot-assignments/${music_slot_id} shows status == PREEMPTED"
            - "The remediate returns 200 and GET /programs/${music_program_id} shows compliance_penalty_points == 0 and compliance_standing == CLEAR, while GET /slot-assignments/${music_slot_id} is STILL PREEMPTED - remediation alone restores nothing"
            - "The reinstate returns 200 with SlotAssignment.status == CONFIRMED and preempted_by_program_id == null"
            - "GET /schedule-grids/${grid_id} shows total_assigned_minutes == 150 and public_affairs_minutes_pct == 20.00 again - the aggregates are conserved across the preempt-and-reinstate pair"
            - "GET /schedule-grids/${grid_id} shows a version strictly greater than ${grid_v2}, because the conserved aggregates do not roll the monotonic version counter back"
            - "GET /slot-assignments?grid_id=${grid_id}&status=CONFIRMED returns total_count == 2 and GET /slot-assignments?grid_id=${grid_id}&status=PREEMPTED returns total_count == 0"
