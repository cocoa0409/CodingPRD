            - "Lease.${lease_id}.status == ACTIVE"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_pool_locked_on_post
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_POOL_LOCKED]
        distinguishing_aspect: |
          Category pair state (priority 8, ERR_INVALID_STATE) vs business_referential
          (priority 11, ERR_POOL_LOCKED): posting a reconciliation that is still
          DRAFT against a pool that is also LOCKED fails with ERR_INVALID_STATE
          (the lower-priority-number state check wins).
        test_recipe:
          setup:
            - "Pool LOCKED by a first posted reconciliation; a second reconciliation against the same pool left in DRAFT (never submitted)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PConf", total_rentable_sqft: 10000, gross_up_occupancy_pct: 0.95 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Anchor4", contact_email: "a4@x.com" }
              as: PropertyManager
              captures: { ten_anchor_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Subj4", contact_email: "s4@x.com" }
              as: PropertyManager
              captures: { ten_subj_id: $.data.id }
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_anchor_id}", leased_sqft: 7000, base_rent_cents_annual: 0 }
              as: PropertyManager
              captures: { lease_anchor_id: $.data.id }
            - call: "POST /leases/${lease_anchor_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /leases"
              payload: { property_id: "${prop_id}", tenant_id: "${ten_subj_id}", leased_sqft: 2500, base_rent_cents_annual: 0, estimated_cam_cents_monthly: 15000 }
              as: PropertyManager
              captures: { lease_subj_id: $.data.id }
            - call: "POST /leases/${lease_subj_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, pro_rata_denominator: "TOTAL_RENTABLE", admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: true }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_anchor_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_a_id: $.data.id }
            - call: "POST /reconciliations/${recon_a_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "pm-001"
            - call: "GET /reconciliations/${recon_a_id}"
              payload: {}
              as: Accountant
              captures: { recon_a_v: $.data.version }
            - call: "POST /reconciliations/${recon_a_id}/post"
              payload: { expected_reconciliation_version: "${recon_a_v}" }
              as: Accountant
              as_user_id: "acct-001"
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_subj_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              captures: { recon_b_id: $.data.id }
            - call: "GET /reconciliations/${recon_b_id}"
              payload: {}
              as: Accountant
              captures: { recon_b_v: $.data.version }
          trigger:
            - call: "POST /reconciliations/${recon_b_id}/post"
              payload: { expected_reconciliation_version: "${recon_b_v}" }
              as: Accountant
              as_user_id: "acct-002"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Reconciliation.${recon_b_id}.status == DRAFT"

      - name: segregation_beats_invalid_state_on_post
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair auth (priority 4, ERR_SEGREGATION_OF_DUTIES) vs state
          (priority 8, ERR_INVALID_STATE): a DRAFT (not IN_REVIEW) reconciliation
          is posted by the same X-User-ID that created/submitted it; the
          lower-priority-number segregation-of-duties auth check wins over the
          state check, returning ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "A reconciliation left in DRAFT (never submitted); the Accountant posting it carries the same X-User-ID as the PropertyManager that submitted/owns it — pin pm and acct to the SAME id to provoke segregation."
            - "Both checks fail on this single request: status is DRAFT (not IN_REVIEW) AND submitter==poster; the lower-priority-number auth check is the one returned."
          setup_api_calls:
