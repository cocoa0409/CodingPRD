        distinguishing_aspect: "Within priority 4 the cycle-posture check precedes the case-state check: intake on a NONRESPONSE case after close-fielding fails with ERR_CYCLE_NOT_FIELDING (not ERR_CASE_NOT_IN_FIELD, which also holds)."
