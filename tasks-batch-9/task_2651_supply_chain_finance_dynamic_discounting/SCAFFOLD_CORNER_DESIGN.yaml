              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { offer_a: "$.data.id" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_b}", session_id: "${session_id}", offered_apr_bps: 900, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${version_b}" }
              as: Supplier
