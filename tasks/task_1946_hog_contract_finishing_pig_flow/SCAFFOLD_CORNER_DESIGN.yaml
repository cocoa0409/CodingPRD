            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-05", mortality_count: 2, cull_count: 0, reason_code: "OTHER" }, as: FieldTech, captures: { err1: $.data.error_id } }
            - { call: "POST /pig-groups/${group_id}/close-out", payload: {}, as: FieldTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T12:00:00Z" }, as: IntegratorAdmin }
