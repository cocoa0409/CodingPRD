# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Ambient Air Monitoring Network Operations - 9 rule_ids x 2 instances = 18
# Every literal in an `assert:` line below was computed by executing the
# corresponding §1.3 formula with its declared constants.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: design_value_variant_divergence_flips_site_attainment
        grounds:
          - calculations.design_value_computation
          - entities.DesignValue.fields.annual_statistics
          - entities.DesignValue.fields.attainment_status
          - entities.MonitoringSite.fields.current_attainment_status
        distinguishing_aspect: |
          This variant pair lives on the DesignValue/MonitoringSite regulatory-determination domain: WITH_EVENT_DATA and
          EXCLUDING_CONCURRED_EVENTS read the same twelve validated quarters yet return design_value 9.1 / NONATTAINMENT
          and 9.0 / ATTAINMENT respectively, because only the second substitutes quarterly_mean_concentration_event_adjusted
          on the quarter carrying an EFFECTIVE EventExclusion.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z, after every reported quarter has ended"
            - "PM25 pollutant with ANNUAL_MEAN standard form, standard level 9.0, completeness threshold 75.0 pct and 1 rounding decimal"
            - "one operating POPULATION_ORIENTED site with no siting violations, carrying one QC-current primary monitor"
            - "twelve validated, fully complete quarters for 2023, 2024 and 2025 on that monitor; 2024 Q3 also reports an event-adjusted mean of 7.9"
            - "a CONCURRED wildfire demonstration whose EFFECTIVE exclusion removes hours 1008..1199 of the 2024 Q3 quarter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: $.data.id }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: $.data.id }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: $.data.id }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: $.data.id }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: $.data.id }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /data-batches/bulk-ingest"
              payload:
                monitor_id: "${mon_id}"
                batches:
                  - { year: 2023, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.2 }
                  - { year: 2023, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.4 }
                  - { year: 2023, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.3 }
                  - { year: 2023, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.1 }
                  - { year: 2024, quarter: 1, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.0 }
                  - { year: 2024, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.1 }
                  - { year: 2024, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.2, quarterly_mean_concentration_event_adjusted: 7.9 }
                  - { year: 2024, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 8.9 }
                  - { year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 8.9 }
                  - { year: 2025, quarter: 2, scheduled_hour_count: 2184, quarterly_mean_concentration: 9.0 }
                  - { year: 2025, quarter: 3, scheduled_hour_count: 2208, quarterly_mean_concentration: 9.1 }
                  - { year: 2025, quarter: 4, scheduled_hour_count: 2208, quarterly_mean_concentration: 8.8 }
              as: QaOfficer
              captures: { b_2024q3_id: "$.data[6].id" }
            - call: "POST /data-batches/bulk-validate"
              payload: { monitor_id: "${mon_id}" }
              as: QaOfficer
              as_user_id: "qa-1"
            - call: "POST /exceptional-event-demonstrations"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", event_type: "WILDFIRE", event_start_date: "2024-08-12T00:00:00Z", event_end_date: "2024-08-19T00:00:00Z", narrative: "Regional wildfire smoke plume over the metropolitan area", clear_causal_relationship: true }
              as: ProgramManager
              captures: { eed_id: $.data.id }
            - call: "POST /exceptional-event-demonstrations/${eed_id}/exclusions"
              payload: { data_batch_id: "${b_2024q3_id}", start_hour_index: 1008, end_hour_index: 1200 }
              as: ProgramManager
              captures: { excl_id: $.data.id }
            - call: "POST /exceptional-event-demonstrations/${eed_id}/submit"
              payload: {}
              as: ProgramManager
            - call: "POST /exceptional-event-demonstrations/${eed_id}/determination"
              payload: { determination: "CONCUR" }
              as: EpaRegionalReviewer
            - call: "GET /monitoring-sites/${site_a_id}"
              payload: {}
              as: ProgramManager
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /design-values"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", period_end_year: 2025, variant: "WITH_EVENT_DATA", expected_monitoring_site_version: "${site_v1}" }
              as: ProgramManager
              captures: { dv_with_id: $.data.id }
            - call: "GET /monitoring-sites/${site_a_id}"
              payload: {}
              as: ProgramManager
              captures: { site_v2: $.data.version }
            - call: "POST /design-values"
              payload: { site_id: "${site_a_id}", pollutant_id: "${pm25_id}", period_end_year: 2025, variant: "EXCLUDING_CONCURRED_EVENTS", expected_monitoring_site_version: "${site_v2}" }
              as: ProgramManager
              captures: { dv_excl_id: $.data.id }
          assert:
            - "DesignValue.${dv_with_id}.annual_statistics == [9.3, 9.1, 9.0]"
            - "DesignValue.${dv_with_id}.design_value == 9.1"
            - "DesignValue.${dv_with_id}.attainment_status == NONATTAINMENT"
            - "DesignValue.${dv_excl_id}.annual_statistics == [9.3, 8.7, 9.0]"
            - "DesignValue.${dv_excl_id}.design_value == 9.0"
            - "DesignValue.${dv_excl_id}.attainment_status == ATTAINMENT"
            - "DesignValue.${dv_with_id}.complete_year_count == 3 and DesignValue.${dv_excl_id}.complete_year_count == 3"
            - "DesignValue.${dv_with_id}.primary_monitor_id == ${mon_id} and DesignValue.${dv_excl_id}.primary_monitor_id == ${mon_id}"
            - "DataBatch.${b_2024q3_id}.event_excluded_hour_count == 192"
            - "DataBatch.${b_2024q3_id}.adjusted_scheduled_hour_count == 2016 and DataBatch.${b_2024q3_id}.completeness_pct == 100.0"
            - "DesignValue.${dv_with_id}.design_value - DesignValue.${dv_excl_id}.design_value == 0.1"

      - name: monitor_qc_posture_variant_divergence_on_instrument_delinquency
        grounds:
          - calculations.monitor_qc_posture
          - entities.Monitor.fields.qc_posture
          - entities.Monitor.fields.qc_posture_in_service
          - entities.Monitor.fields.out_of_service_day_count
          - entities.MonitoringNetwork.fields.delinquent_monitor_count
        distinguishing_aspect: |
          This variant pair lives on the Monitor instrument-QC domain, a different entity domain from the DesignValue
          determination pair: at one and the same clock instant CALENDAR_ELAPSED yields qc_posture QC_DELINQUENT (35 elapsed
          days > 14 + 7) while IN_SERVICE_ELAPSED yields qc_posture_in_service QC_DUE (35 - 20 forgiven days = 15), and only
          the CALENDAR_ELAPSED value feeds MonitoringNetwork.delinquent_monitor_count.
        test_recipe:
          setup:
            - "logical clock starts at 2025-12-01T00:00:00Z"
            - "one operating site with one commissioned monitor whose only passing span check is at 2025-12-01T00:00:00Z"
            - "the monitor is taken out of service on 2025-12-05 and returned to service on 2025-12-25, accruing exactly 20 out-of-service days"
            - "the clock is then advanced to 2026-01-05T00:00:00Z, 35 calendar days after the span check"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2025-12-01T00:00:00Z", span_drift_pct: 1.0 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitors/${mon_id}/service-status"
              payload: { new_status: "OUT_OF_SERVICE", reason: "Analyser sent for factory repair" }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-25T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitors/${mon_id}/service-status"
              payload: { new_status: "OPERATING", reason: "Analyser reinstalled" }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /monitors/${mon_id}"
              payload: {}
              as: ProgramManager
            - call: "GET /monitoring-networks/${net_id}"
              payload: {}
              as: ProgramManager
          assert:
            - "Monitor.${mon_id}.out_of_service_day_count == 20"
            - "Monitor.${mon_id}.out_of_service_since == null"
            - "Monitor.${mon_id}.monitor_status == OPERATING"
            - "Monitor.${mon_id}.qc_posture == QC_DELINQUENT"
            - "Monitor.${mon_id}.qc_posture_in_service == QC_DUE"
            - "MonitoringNetwork.${net_id}.delinquent_monitor_count == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: network_adequacy_nested_min_credits_and_capped_penalty_factors
        grounds:
          - calculations.network_adequacy_score
          - entities.NetworkAssessment.fields.required_population_site_count
          - entities.NetworkAssessment.fields.coverage_ratio
          - entities.NetworkAssessment.fields.adequacy_score
          - entities.MonitoringNetwork.fields.waiver_required_site_count
          - entities.MonitoringNetwork.fields.delinquent_monitor_count
        distinguishing_aspect: |
          Mode (a): a five-input non-linear formula - population tier selection, three per-class credits each capped by its
          own requirement via nested min, and two independently capped multiplicative degradation factors. Three operating
          POPULATION_ORIENTED sites credit only 2 against a tier requirement of 2, so coverage_ratio is 0.75 rather than the
          1.0 an uncapped sum would produce, and 100 * 0.75 * 0.9 * 0.95 lands on 64.1.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "network for a 600000-person metropolitan area, so the population tier requires 2 population-oriented sites"
            - "three operating POPULATION_ORIENTED sites with clean siting geometry"
            - "one operating SOURCE_ORIENTED site 800 m from its target source, so it fails SOURCE_DISTANCE and is operating under a waiver"
            - "no operating BACKGROUND site"
            - "one commissioned monitor whose last span check never happened and whose installed_at is 2025-01-01, so its qc_posture is QC_DELINQUENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "Mid-size Metro Network", agency_code: "AQ02", metropolitan_population: 600000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "P-001", site_type: "POPULATION_ORIENTED", latitude: 39.70, longitude: -104.90, population_served: 200000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monitoring-sites/${p1_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${p1_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "P-002", site_type: "POPULATION_ORIENTED", latitude: 39.71, longitude: -104.91, population_served: 150000, probe_height_m: 4.0, distance_to_roadway_m: 30.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /monitoring-sites/${p2_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${p2_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "P-003", site_type: "POPULATION_ORIENTED", latitude: 39.72, longitude: -104.92, population_served: 120000, probe_height_m: 4.0, distance_to_roadway_m: 40.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { p3_id: "$.data.id" }
            - call: "POST /monitoring-sites/${p3_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${p3_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "X-001", site_type: "SOURCE_ORIENTED", latitude: 39.60, longitude: -104.80, population_served: 5000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 800.0 }
              as: NetworkAdmin
              captures: { x1_id: "$.data.id" }
            - call: "POST /monitoring-sites/${x1_id}/siting-approval"
              payload: { waiver_granted: true, approval_note: "Nearest accessible parcel; source-distance waiver granted" }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${x1_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${p1_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2025-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /network-assessments"
              payload: { network_id: "${net_id}", cycle_year: 2026 }
              as: ProgramManager
              captures: { assess_id: "$.data.id" }
          assert:
            - "MonitoringSite.${x1_id}.siting_violation_codes == [SOURCE_DISTANCE]"
            - "MonitoringNetwork.${net_id}.operating_site_count == 4"
            - "MonitoringNetwork.${net_id}.waiver_required_site_count == 1"
            - "MonitoringNetwork.${net_id}.delinquent_monitor_count == 1"
            - "NetworkAssessment.${assess_id}.required_population_site_count == 2"
            - "NetworkAssessment.${assess_id}.coverage_ratio == 0.75"
            - "NetworkAssessment.${assess_id}.adequacy_score == 64.1"
            - "NetworkAssessment.${assess_id}.adequacy_tier == INADEQUATE"
            - "NetworkAssessment.${assess_id}.status == DRAFT"

      - name: design_value_step_rounding_order_decides_attainment
        grounds:
          - calculations.design_value_computation
          - entities.DesignValue.fields.annual_statistics
          - entities.DesignValue.fields.design_value
          - entities.Pollutant.fields.rounding_decimals
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is outcome-bearing and pinned. STEP-1 rounds each year's quarterly mean to
          1 decimal (9.25 -> 9.3, 9.05 -> 9.1, 8.95 -> 9.0) and STEP-2 truncates the mean of those rounded statistics,
          giving 9.1 / NONATTAINMENT; the forbidden "average the twelve unrounded quarterly means, then truncate" order
          gives 9.0 / ATTAINMENT from the identical inputs. This is a rounding-order axis, not the tiered-input axis of
          network_adequacy_nested_min_credits_and_capped_penalty_factors.
        test_recipe:
          setup:
            - "logical clock at 2026-01-05T00:00:00Z"
            - "PM25 with rounding_decimals 1, design_value_years 3 and standard level 9.0"
            - "twelve validated complete quarters whose per-year raw means are exactly 9.25, 9.05 and 8.95"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
