      - name: rejected_execute_leaves_no_partial_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
          - validations.priority_44
          - errors.ERR_STIPEND_POOL_EXCEEDED
          - calculations.production_stipend_rollup
          - calculations.post_obligation_fee_allocation
        distinguishing_aspect: |
          Atomicity claim on the four-link execute cascade. Both agreements clear the
          send-time provisional guard (nothing is committed yet), and executing the first
          runs the whole cascade — final stipend 1,075,000, rollup, posture recompute and two
          auto-created PostObligation rows. The second execute is refused by the FINAL-variant
          pool guard, and NOTHING of its cascade survives: status stays SENT,
          total_stipend_commitment_cents stays 0, executed_at and executed_by_user_id stay
          null, the agreement's version is unchanged, its applicant is still CLEARED rather
          than CAST, it owns no PostObligation rows, and the production's committed total is
          still exactly the first agreement's. A build that wrote the stipend before checking
          the guard, or that created obligations first, leaks at least one of these.
        test_recipe:
          setup:
            - "One production with a 1,500,000 pool and episode_order 1; two CLEARED adult applicants; two SENT agreements whose FINAL totals (1,075,000 and 950,000) sum past the pool while each provisional alone fits."
