            - "After detect-faults: Meter.${mte1_id}.missing_minutes_last_scan == 1090 and .health_status == SUSPECT and .install_status == INSTALLED and .fault_count == 0"
            - "After detect-faults: Household.${he1_id}.status == ACTIVE - a SUSPECT meter does not hold a household"
            - "${health_after_fault} == FAULTED and ${install_after_fault} == INSTALLED"
            - "After the fault report: Meter.${mte1_id}.fault_count == 1 and .last_fault_code == NO_SIGNAL"
            - "After the fault report: Household.${he1_id}.status == FAULT_HOLD and QuotaCell.${cell_f_id}.intab_count == 0"
            - "${health_after_repair} == HEALTHY and ${install_after_repair} == INSTALLED"
            - "After the repair: Meter.${mte1_id}.missing_minutes_last_scan == 0 and .fault_count == 1 - the lifetime counter is not decremented"
            - "After the repair: Household.${he1_id}.status == ACTIVE and QuotaCell.${cell_f_id}.intab_count == 1 and .quota_status == FILLED"

      - name: methodology_change_revision_cycle_returns_to_draft
        grounds:
          - state_machines.MethodologyChange.DRAFT_to_IMPACT_ASSESSED
          - state_machines.MethodologyChange.IMPACT_ASSESSED_to_NOTIFIED
          - state_machines.MethodologyChange.NOTIFIED_to_DRAFT
          - state_machines.ClientNotification.SENT_to_CANCELLED
          - calculations.methodology_impact_delta
          - entities.MethodologyChange.fields.revision_count
          - concurrency_rules[impact-analysis-stale-change]
        distinguishing_aspect: |
          MethodologyChange is a different entity from Meter and its non-linearity is a true cycle,
          not parallel dimensions: DRAFT -> IMPACT_ASSESSED -> NOTIFIED -> DRAFT -> IMPACT_ASSESSED,
          where the loop back cancels the SENT notification and zeroes both notification counters, and
          revision_count lands on exactly 1 because only request-revision owns that counter.
