          window both exceeds the selected link's due date AND overlaps order A
          violates p8.5 and p10.5; ERR_TRACEABILITY_CHAIN_BROKEN must win.
        test_recipe:
          setup:
            - "program P (capacity 480); service S; link L calibrated 2026-06-01, due 2026-10-06T00:00:00Z"
            - "customer C; order A scheduled [2026-10-05T09:00, 2026-10-05T11:00); order B unscheduled"
          setup_api_calls:
