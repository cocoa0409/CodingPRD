          A different trigger from the acceptance cascade - a Tenant status change - propagates
          Tenant -> ShoppingCenter.open_anchor_count (1 -> 0) -> because the count fell short the
          clause flips SATISFIED -> VIOLATED and opens a CoTenancyEvent -> because that event was
          opened, Lease.co_tenancy_status flips COMPLIANT -> VIOLATION_OPEN, while Lease.status
          stays ACTIVE.
        test_recipe:
          setup:
            - "One center of 400,000 sqft with one OPERATING ANCHOR tenant (120,000 sqft)."
            - "One ACTIVE 4,000 sqft lease carrying a CoTenancyClause with required_open_anchor_count 1, required_occupancy_bps 0 and cure_period_days 30; the clause is SATISFIED and the lease is COMPLIANT."
