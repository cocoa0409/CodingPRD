        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / enrollment_submit_requires_certified_acreage_report
          rationale: "Existence ERR_NOT_FOUND is exercised by get_nonexistent_farm_returns_not_found and child_creation_requires_existing_parent; cross-entity ERR_ACREAGE_NOT_CERTIFIED exercised by the §1.8 instance."
      - name: error_invalid_state_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_temporal_on_late_certify
          rationale: "ERR_INVALID_STATE is the asserted outcome of the §1.8 priority instance and of terminal_enrollment_void_lockdown."
      - name: error_stale_farm_version_occ
        claim_type: occ_stale_version
        grounds: ["errors[ERR_STALE_FARM_VERSION]", "concurrency_rules[election-supersede-stale-farm]"]
        distinguishing_aspect: "A second election create carrying an old expected_farm_version after a prior supersede is rejected with 412 ERR_STALE_FARM_VERSION (OCC layer)."
        test_recipe:
          setup: ["Farm F; one election already created (advancing Farm.version)"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F22", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}", captures: { farm_v1: "$.data.version" } }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "SOYBN", election_code: "ARC_CO", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Second create carries stale expected_farm_version (${farm_v0}) after the first bumped it to ${farm_v1}"
            - "err == ERR_STALE_FARM_VERSION"

      - name: error_election_window_closed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELECTION_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / election_window_closed_boundary
          rationale: "Asserted as the outcome of the §1.8 temporal-boundary instance."
      - name: error_agi_ineligible_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGI_INELIGIBLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_vs_business_fiscal_on_payment
          rationale: "Asserted as the higher-priority error in the §1.8 safety-vs-fiscal instance and in enrollment_ced_approve_requires_verified_agi."
      - name: error_conservation_not_certified
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONSERVATION_NOT_CERTIFIED]"]
        distinguishing_aspect: "CED approval with producer conservation_status PENDING (not CERTIFIED/EXEMPT) returns ERR_CONSERVATION_NOT_CERTIFIED — the safety gate not covered by §1.8's AGI-focused instance."
        test_recipe:
          setup: ["Enrollment SUBMITTED; producer AGI VERIFIED but conservation_status still PENDING (certification never filed)"]
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F23", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "P", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 50.00, cropland_acres: 50.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 50.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 50.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_id}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_id}" }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "conservation_status is PENDING (never CERTIFIED)"
            - "err == ERR_CONSERVATION_NOT_CERTIFIED"

  # ===========================================================================
  # Section: rbac — coverage beyond endpoint-denial cases
  # ===========================================================================
  - section: rbac
    instances:
      - name: county_committee_cannot_create_farm
        claim_type: rbac_denied
        grounds: ["roles[CountyCommittee]"]
        distinguishing_aspect: "CountyCommittee calling a CountySpecialist-only farm creation is rejected with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/farms", payload: { farm_number: "F24", county_code: "019", program_year: 2026 }, as: CountyCommittee, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: missing_auth_headers_unauthenticated
        claim_type: rbac_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID returns 401 ERR_UNAUTHENTICATED (priority 1, before everything)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fsa/farms/00000000-0000-0000-0000-000000000000", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED"

  # ===========================================================================
  # Section: complexity_layers — OCC correct-version success path
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reconstitution-stale-farm]"]
        distinguishing_aspect: "A reconstitution carrying the current expected_farm_version succeeds and increments Farm.version; the stale-twin case is asserted in error_stale_farm_version_occ."
        test_recipe:
          setup: ["Farm F ACTIVE with one tract"]
          setup_api_calls:
            - { call: "POST /fsa/farms", payload: { farm_number: "F25", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/reconstitutions", payload: { method: "DIVIDE", source_tract_ids: ["${tract_id}"], product_specs: [{tract_number: "T1A", base_acres: 100.00, cropland_acres: 100.00}], expected_farm_version: "${farm_v0}" }, as: CountySpecialist, captures: { farm_v1: "$.data.version" } }
          assert:
            - "OCC check passes (version matched)"
            - "farm_v1 == ${farm_v0} + 1"

      - name: pagination_limit_offset_consistency
        claim_type: pagination_with_filtering
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset paginate deterministically; has_more true until the last page."
        test_recipe:
          setup: ["three producers"]
          setup_api_calls:
            - { call: "POST /fsa/producers", payload: { producer_name: "A", tax_id_last4: "1", entity_type: "INDIVIDUAL" }, as: CountySpecialist }
            - { call: "POST /fsa/producers", payload: { producer_name: "B", tax_id_last4: "2", entity_type: "INDIVIDUAL" }, as: CountySpecialist }
            - { call: "POST /fsa/producers", payload: { producer_name: "C", tax_id_last4: "3", entity_type: "INDIVIDUAL" }, as: CountySpecialist }
          trigger:
            - { call: "GET /fsa/producers?limit=2&offset=0", payload: {}, as: CountySpecialist }
            - { call: "GET /fsa/producers?limit=2&offset=2", payload: {}, as: CountySpecialist }
          assert:
            - "page1 total_count>=3 and has_more==true"
            - "page2 has_more==false"

  # ===========================================================================
  # Section: consistency_model — immediate consistency on computed reads
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: computed_fields_visible_in_same_response
