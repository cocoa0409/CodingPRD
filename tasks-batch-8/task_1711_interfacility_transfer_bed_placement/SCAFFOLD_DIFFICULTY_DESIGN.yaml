            - "TransferCase.${case_id}.active_bed_hold_id == ${hold2} and version advanced past ${case_v}"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bed_hold_half_open_interval_adjacency_allowed
        grounds:
          - calculations.hold_expiry_minutes
          - state_machines.BedHold.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Resource Bed with HALF-OPEN occupation [hold_started_at, hold_expires_at):
          a new hold on the same bed at clock == 00:59 (inside the prior window)
          is rejected ERR_BED_NOT_AVAILABLE, but at clock == hold_expires_at
          exactly the adjacency is allowed and the new hold succeeds.
        test_recipe:
          setup:
            - "CRITICAL ICU EMTALA_APPLIES case ACCEPTED at RCV at 2026-08-01T00:00:00Z; auto-hold on ICU-01 expires 01:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { bed1: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-ADJ-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
              captures: { hold1: $.data.active_bed_hold_id }
            - call: "GET /transfer-cases/${case_id}"
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:59:00Z" }
              as: TransferCoordinator
          trigger:
            - call: "POST /transfer-cases/${case_id}/bed-holds"
              payload: { bed_id: "${bed1}", expected_transfer_case_version: "${case_v1}" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: TransferCoordinator
            - call: "GET /transfer-cases/${case_id}"
              as: Any
              captures: { case_v2: $.data.version, case_hold: $.data.active_bed_hold_id }
            - call: "POST /transfer-cases/${case_id}/bed-holds"
              payload: { bed_id: "${bed1}", expected_transfer_case_version: "${case_v2}" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { hold2: $.data.id, hold2_start: $.data.hold_started_at, hold2_exp: $.data.hold_expires_at }
            - call: "GET /bed-holds/${hold1}"
              as: Any
              captures: { hold1_status: $.data.status, hold1_reason: $.data.release_reason }
          assert:
            - "at 00:59 (inside [00:00, 01:00)): new hold on ICU-01 -> error_id == ERR_BED_NOT_AVAILABLE"
            - "at 01:00 == hold_expires_at: the case GET lazily flips hold1 EXPIRED (active_bed_hold_id == null, version bumped)"
            - "same-instant adjacency allowed: new hold created 201 with hold_started_at == 2026-08-01T01:00:00Z and hold_expires_at == 2026-08-01T02:00:00Z (CRITICAL 60min)"
            - "BedHold.${hold1}.status == EXPIRED with release_reason == EXPIRED; ICU-01 is HELD again under ${hold2}"

      - name: diversion_closed_interval_touching_rejected
        grounds:
          - validations[priority=7]
          - entities.DiversionEvent.fields.effective_status
        distinguishing_aspect: |
          Resource Facility with CLOSED-interval diversion windows — the OPPOSITE
          adjacency semantics from bed holds: a new window whose starts_at equals
          an existing window's ends_at is an overlap (ERR_DIVERSION_OVERLAP); only
          a strictly positive gap (starts one second later) is accepted.
        test_recipe:
          setup:
            - "Facility RCV with an existing diversion D1 [2026-08-10T10:00:00Z, 2026-08-10T12:00:00Z] (SCHEDULED relative to the 2026-08-01 clock)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/diversion-events"
              payload: { scope: "ALL_UNITS", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", reason: "Planned generator maintenance" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { div1: $.data.id, div1_eff: $.data.effective_status }
          trigger:
            - call: "POST /facilities/${fac_r}/diversion-events"
              payload: { scope: "ALL_UNITS", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T14:00:00Z", reason: "Extended maintenance window attempt" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /facilities/${fac_r}/diversion-events"
              payload: { scope: "ALL_UNITS", starts_at: "2026-08-10T12:00:01Z", ends_at: "2026-08-10T14:00:00Z", reason: "Follow-on maintenance window" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { div2: $.data.id, div2_eff: $.data.effective_status }
          assert:
            - "D1 effective_status == SCHEDULED (clock 2026-08-01 precedes window)"
            - "touching window [12:00:00, 14:00:00] -> error_id == ERR_DIVERSION_OVERLAP with http 409 (closed intervals: shared endpoint counts as overlap)"
            - "one-second gap [12:00:01, 14:00:00] -> 201 success, effective_status == SCHEDULED"
            - "exactly two diversion events exist for the facility afterwards"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: hold_create_release_parity_invariant
        grounds:
          - state_machines.BedHold.ACTIVE_to_RELEASED
          - state_machines.Bed.AVAILABLE_to_HELD
          - calculations.facility_occupancy
        distinguishing_aspect: |
          Conserved quantity = facility bed-allocation parity: count(Bed HELD)
          must equal count(BedHold ACTIVE) at every checkpoint; the forward action
          (accept creates hold) paired with its compensation (manual release)
          returns unavailable_bed_count to the baseline 0 — zero drift.
        test_recipe:
          setup:
            - "RCV with 2 AVAILABLE ICU beds; baseline: unavailable_bed_count == 0, zero ACTIVE holds"
            - "CRITICAL ICU EMTALA_APPLIES case AWAITING_ACCEPTANCE at RCV"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Receiving Trauma Center", facility_code: "RCV", trauma_level: "LEVEL_1", capabilities: ["CARDIAC_CATH"] }
              as: TransferCoordinator
              captures: { fac_r: $.data.id }
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-01", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /facilities/${fac_r}/beds"
              payload: { bed_code: "ICU-02", unit_type: "ICU" }
              as: BedManager
              as_user_id: "${fac_r}"
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Recv", facility_id: "${fac_r}", specialty: "INTENSIVIST" }
              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-PAR-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/request-acceptance"
              payload: { receiving_facility_id: "${fac_r}", receiving_physician_id: "${phys_r}", contact_method: "PHONE" }
              as: TransferCoordinator
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { base_unavail: $.data.unavailable_bed_count }
          trigger:
            - call: "POST /transfer-cases/${case_id}/accept"
              payload: {}
              as: ReceivingPhysician
              as_user_id: "${phys_r}"
              captures: { hold1: $.data.active_bed_hold_id }
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { mid_unavail: $.data.unavailable_bed_count, mid_occ: $.data.occupancy_pct }
            - call: "POST /bed-holds/${hold1}/release"
              payload: {}
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { rel_status: $.data.status, rel_reason: $.data.release_reason }
            - call: "GET /facilities/${fac_r}"
              as: Any
              captures: { end_unavail: $.data.unavailable_bed_count, end_occ: $.data.occupancy_pct }
            - call: "GET /bed-holds?transfer_case_id=${case_id}&status=ACTIVE"
              as: Any
          assert:
            - "baseline: unavailable_bed_count == 0 (0 HELD beds == 0 ACTIVE holds)"
            - "after accept: unavailable_bed_count == 1 and occupancy_pct == 50.0 (1 HELD == 1 ACTIVE hold ${hold1})"
            - "after release: BedHold.${hold1}.status == RELEASED, release_reason == MANUAL"
            - "after release: unavailable_bed_count == 0 and occupancy_pct == 0.0 — forward + compensating action restores baseline exactly"
            - "after release: GET /bed-holds?transfer_case_id&status=ACTIVE returns an empty array (parity count 0 == 0)"

      - name: screening_amendment_singleton_invariant
        grounds:
          - state_machines.EmtalaScreening.CERTIFIED_to_AMENDED
          - state_machines.EmtalaScreening.AMENDED_to_CERTIFIED
          - entities.EmtalaScreening.fields.amendment_count
        distinguishing_aspect: |
          Conserved quantity = screening cardinality per case (a document-count
          invariant, a different quantity type than bed-allocation parity): the
          certify -> amend -> certify cycle must leave exactly ONE EmtalaScreening
          row for the case, with amendment_count == 1 recording the loop.
        test_recipe:
          setup:
            - "Case with certified screening (EMTALA_APPLIES); the case's screening list contains exactly 1 row"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sending General", facility_code: "SND", trauma_level: "LEVEL_3", capabilities: ["TRAUMA"] }
              as: TransferCoordinator
              captures: { fac_s: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Send", facility_id: "${fac_s}", specialty: "EMERGENCY" }
              as: TransferCoordinator
              captures: { phys_s: $.data.id }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-SINGLE-1", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "EMERGENT", required_unit_type: "ICU", requires_isolation: false, required_capability: "TRAUMA" }
              as: TransferCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening"
              payload: { has_emergency_medical_condition: true, is_stabilized: true }
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { scr_id: $.data.id }
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
          trigger:
            - call: "POST /transfer-cases/${case_id}/emtala-screening/amend"
              payload: { physician_certification: "Amended certification: repeat evaluation confirms stable EMC for transfer." }
              as: SendingPhysician
              as_user_id: "${phys_s}"
            - call: "POST /transfer-cases/${case_id}/emtala-screening/certify"
              payload: {}
              as: SendingPhysician
              as_user_id: "${phys_s}"
              captures: { scr_status: $.data.status, scr_amend: $.data.amendment_count }
            - call: "GET /transfer-cases/${case_id}/emtala-screening"
              as: Any
              captures: { scr_same_id: "$.data[0].id", scr_det: "$.data[0].determination" }
          assert:
            - "after amend + re-certify the case's screening list still contains exactly ONE row (cardinality conserved)"
            - "the surviving row id == ${scr_id} (amendment revises in place, never inserts)"
            - "EmtalaScreening.amendment_count == 1 and status == CERTIFIED"
            - "determination == EMTALA_APPLIES (amended values unchanged in this loop) and case status back to EMTALA_DETERMINED"
