        distinguishing_aspect: "Model.version increments by 1 on every mutation (change-request create, change-request decide) — observable as a monotone counter."
        test_recipe:
          setup:
            - "Model M registered (version 1); two change requests created and one decided"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "VerMon M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, v0: $.data.version }
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "cr1", expected_model_version: "${v0}" }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { v1: $.data.version }
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "cr2", expected_model_version: "${v1}" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { cr2: $.data.id }
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /mrm/models/${m_id}/change-requests/${cr2}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { v3: $.data.version }
          assert:
            - "captured ${v0} == 1"
            - "captured ${v1} == 2 (create incremented)"
            - "captured ${v2} == 3 (second create incremented)"
            - "captured ${v3} == 4 (decide incremented)"

      - name: clock_sweep_overdue_boundary_exactness
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Finding.OPEN_to_OVERDUE
          - calculations.finding_deadline_days
        distinguishing_aspect: "The overdue sweep is strict: at exactly remediation_due_at the finding stays OPEN; one second past it flips to OVERDUE. Same strictness at the escalation boundary (due + 7 days)."
        test_recipe:
          setup:
            - "Model M (HIGH/SINGLE_DESK/100 → 70, TIER_1); CRITICAL finding created at clock 2026-08-01 → remediation_due_at = 2026-08-01 + round(14 * 1.0[TIER_1]) = 2026-08-15; escalation at now > 2026-08-22"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Sweep M", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
