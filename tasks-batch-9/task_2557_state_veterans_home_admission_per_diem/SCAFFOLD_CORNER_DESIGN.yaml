        grounds:
          - errors.ERR_TRANSACTION_ALREADY_REVERSED
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=60,ERR_TRANSACTION_ALREADY_REVERSED]
          - validations[priority=65,ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The same call answers two different errors depending on the target's state, and the ordering is
          fixed: while the deposit is un-reversed, the recorder's own reversal attempt fails at the
          segregation rung (65) with 403; once a different operator has reversed it, the recorder's second
          attempt fails at the state rung (60) with 409 - the earlier rung wins even though the
          segregation violation is still present. Reversing the REVERSAL row itself is also 409.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home, with trust_fund_balance_cents 0 and no census run yet."
