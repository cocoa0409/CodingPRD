  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_vs_state_on_dmr_approve
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Error-category pair (auth, state): the second approve attempt fails BOTH segregation-of-duties
          (caller is the DMR author) AND state (DMR no longer DRAFT); priority 6 auth wins over
          priority 7 state, so the response is 403 ERR_SEGREGATION_OF_DUTIES, not 409.
        test_recipe:
          setup:
            - "DMR DEV-R rev A created by qe-alice and already APPROVED by qm-bob"
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-R", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id" } }
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
          trigger:
            - { call: "POST /api/device-master-records/${dmr_id}/approve", payload: {}, as: QualityManager, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
          assert:
            - "second approve by the author returns 403 with error_id == ERR_SEGREGATION_OF_DUTIES (auth priority 6 beats state priority 7, although ERR_INVALID_STATE_TRANSITION also holds)"
            - "DeviceMasterRecord.${dmr_id}.status remains APPROVED"

      - name: temporal_vs_referential_on_scn_create
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_CHANGE_NOTICE_WINDOW_BREACHED]
          - errors[ERR_PART_NOT_OF_SUPPLIER]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_referential): the SCN breaches the 90-day
          notice window AND references another supplier's part; temporal priority 10 beats referential
          priority 11, so the response is ERR_CHANGE_NOTICE_WINDOW_BREACHED, not ERR_PART_NOT_OF_SUPPLIER.
        test_recipe:
          setup:
            - "supplier SUP-T1 QUALIFIED with ACTIVE agreement (change_notice_days 90); supplier SUP-T2 QUALIFIED with part PN-T2"
            - "clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-T1", name: "Temp One" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup1_id: "$.data.id", sup1_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup1_id}/quality-agreements", payload: { agreement_code: "QA-T1", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup1_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr1_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr1_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup1_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-T2", name: "Temp Two" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup2_id: "$.data.id" } }
            - { call: "POST /api/suppliers/${sup2_id}/parts", payload: { part_number: "PN-T2", description: "lens", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part2_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/suppliers/${sup1_id}/change-notifications", payload: { supplier_part_id: "${part2_id}", change_description: "resin change", impact_class: "MINOR", proposed_effective_date: "2026-08-15T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CHANGE_NOTICE_WINDOW_BREACHED (14 days < 90; temporal priority 10 beats referential priority 11 although the part belongs to SUP-T2)"
            - "no SupplierChangeNotification is created for SUP-T1 (list filtered by supplier_id stays empty)"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: supplier_score_exactly_50_not_suspended
        grounds:
          - calculations.supplier_quality_score
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Metric quality_score, endpoint NCR disposition: penalties 30+15+5 land exactly on 50 and the
          auto-suspend rule is strict < 50, so the supplier stays QUALIFIED; a 2-point audit finding
          later tips it to 48 and suspends. Boundary precision: 50.0 is safe, 49.99 is not.
        test_recipe:
          setup:
            - "supplier SUP-B QUALIFIED, part PN-B received; three NCRs (CRITICAL, MAJOR, MINOR) CONTAINED on PN-B"
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-B", name: "Boundary Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /api/suppliers/${sup_id}/quality-agreements", payload: { agreement_code: "QA-B", audit_rights_granted: true, audit_notice_days: 30, change_notice_days: 90, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_supplier_version: "${sup_v}" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { agr_id: "$.data.id" } }
            - { call: "POST /api/quality-agreements/${agr_id}/activate", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/qualify", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-B", description: "seal", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports", payload: { ncr_code: "NCR-B1", description: "c1", severity: "CRITICAL", supplier_part_id: "${part_id}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ncr1: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports/${ncr1}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports/${ncr1}/disposition", payload: { disposition: "RETURN_TO_SUPPLIER", fault: "SUPPLIER" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports", payload: { ncr_code: "NCR-B2", description: "c2", severity: "MAJOR", supplier_part_id: "${part_id}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ncr2: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports/${ncr2}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports/${ncr2}/disposition", payload: { disposition: "RETURN_TO_SUPPLIER", fault: "SUPPLIER" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/nonconformance-reports", payload: { ncr_code: "NCR-B3", description: "c3", severity: "MINOR", supplier_part_id: "${part_id}" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ncr3: "$.data.id" } }
            - { call: "POST /api/nonconformance-reports/${ncr3}/contain", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
          trigger:
            - { call: "POST /api/nonconformance-reports/${ncr3}/disposition", payload: { disposition: "RETURN_TO_SUPPLIER", fault: "SUPPLIER" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score50: "$.data.quality_score", status50: "$.data.status" } }
            - { call: "POST /api/suppliers/${sup_id}/audits", payload: { scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-11T00:00:00Z" }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { aud_id: "$.data.id" } }
            - { call: "POST /api/supplier-audits/${aud_id}/complete", payload: { findings_count: 1, major_findings_count: 0 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "GET /api/suppliers/${sup_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { score48: "$.data.quality_score", status48: "$.data.status" } }
          assert:
            - "after 30+15+5: Supplier.${sup_id}.quality_score == 50 exactly"
            - "at exactly 50: Supplier.${sup_id}.status == QUALIFIED (auto-suspend is strict < 50)"
            - "after audit penalty 2: quality_score == 48 and status == SUSPENDED"

      - name: complaint_rate_exactly_5_sets_flag
        grounds:
          - calculations.complaint_rate_per_100k
          - entities.DeviceMasterRecord.fields.field_action_review_required
        distinguishing_aspect: |
          Metric complaint_rate_per_100k, endpoint complaint complete-investigation: 1 confirmed
          complaint over exactly 20000 releasable units yields exactly 5.0000 and the flag rule is
          inclusive >= 5.0, so the flag flips true — versus the rate-0 baseline before confirmation.
        test_recipe:
          setup:
            - "DMR DEV-R5 APPROVED; protocol VP-R5 VALIDATED; supplier SUP-R5 QUALIFIED, part PN-R5 received 30000"
            - "three priming lots released; lot LT-R4 (qty 20125, releasable 20000) RELEASED"
