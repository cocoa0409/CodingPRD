        claim_type: invalid_transition
        grounds: [state_machines.VerificationCase.SUBMITTED_to_APPROVED, "errors[ERR_CASE_NOT_SUBMITTED]"]
        distinguishing_aspect: "Reviewing a case that is already APPROVED fails with ERR_CASE_NOT_SUBMITTED."
