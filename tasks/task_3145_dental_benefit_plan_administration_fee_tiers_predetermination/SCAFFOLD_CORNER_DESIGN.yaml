        distinguishing_aspect: "attachment_kind \"XRAY\" is not one of RADIOGRAPH | NARRATIVE | PERIO_CHART | PHOTO — rejected 400 ERR_INVALID_ATTACHMENT."
        test_recipe:
          setup:
            - "Standard stack with D2740 requires_attachment=true; claim pended PENDED_ATTACHMENTS."
          setup_api_calls:
            - *c_clock
            - *c_plan
