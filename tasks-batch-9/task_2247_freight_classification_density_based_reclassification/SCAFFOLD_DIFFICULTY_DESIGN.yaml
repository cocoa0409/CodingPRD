      - name: dispute_blocked_by_education_hold_until_education_completes
        grounds:
          - validations[priority=10]
          - state_machines.Customer.NONE_to_REQUIRED
          - state_machines.Customer.REQUIRED_to_COMPLETED
          - errors.ERR_EDUCATION_HOLD
          - entities.Customer.fields.education_threshold_strikes
        distinguishing_aspect: |
          Filing a dispute depends on the state of the Customer, not the notice: issuing the notice
          pushes offender_strike_count to the education_threshold_strikes of 1, flipping
          education_status to REQUIRED, so the filing is refused with ERR_EDUCATION_HOLD; the very
          same filing succeeds after POST /ltl/customers/{id}/education/complete, which also raises
          education_threshold_strikes to 2. Note the orthogonality: the strike count is 1 while
          liability_index_rolling is still 0.00 (no notice has been RESOLVED yet).
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer REPEAT created with education_strike_interval = 1 on an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PROC101 (single 400 lb class 70 line, 4 pieces 48.0x40.0x48.0) billed at 12500 and captured at 520 lb, leaving one DRAFT BOTH notice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
