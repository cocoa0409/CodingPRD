              as: Agent
              as_user_id: "${sa_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /units"
              payload: { coverage_election_id: "${elec_id}", unit_number: "0001-0001", acres: 100, share: 1 }
              as: Agent
              as_user_id: "${sa_id}"
              captures: { unit_id: $.data.id, unit_v0: $.data.version }
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-10T00:00:00Z", expected_unit_version: "${unit_v0}" }
              as: Agent
              as_user_id: "${sa_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
