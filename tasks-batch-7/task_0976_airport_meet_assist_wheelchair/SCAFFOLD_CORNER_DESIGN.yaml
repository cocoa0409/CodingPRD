# =============================================================================
# task_0976_airport_meet_assist_wheelchair — SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# Breadth probe: enumerates corner claims NOT already covered by §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_airport_with_required_fields_returns_201
        claim_type: creation
        grounds: [entities.Airport, "endpoints[POST /maa/airports]"]
        distinguishing_aspect: "POST with all required fields yields 201 and a server-minted id."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /maa/airports"
              payload: { iata_code: "JFK", tz_offset_minutes: -240, meet_buffer_minutes: 30 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Airport.${ap_id}.posture == NORMAL"
            - "Airport.${ap_id}.ops_epoch == 0"

      - name: create_airport_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Airport, "errors[ERR_BAD_REQUEST]"]
        distinguishing_aspect: "Missing required field (iata_code) rejected with ERR_BAD_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /maa/airports"
              payload: { tz_offset_minutes: 0, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BAD_REQUEST"

      - name: passenger_class_computed_from_dob
        claim_type: computed_field
        grounds: [entities.Passenger.fields.passenger_class]
        distinguishing_aspect: |
          passenger_class is computed at creation from dob and the server logical clock:
          dob making the passenger 8 years old → UMNR; 70 years old → SENIOR; 40 years old → ADULT.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /maa/passengers"
              payload: { full_name: "Kid", dob: "2018-06-01", mobility_code: "WCHR" }
              as: Requester
              captures: { kid_id: $.data.id, kid_class: $.data.passenger_class }
            - call: "POST /maa/passengers"
              payload: { full_name: "Elder", dob: "1956-06-01", mobility_code: "WCHR" }
              as: Requester
              captures: { elder_id: $.data.id, elder_class: $.data.passenger_class }
            - call: "POST /maa/passengers"
              payload: { full_name: "Mid", dob: "1986-06-01", mobility_code: "WCHR" }
              as: Requester
              captures: { mid_id: $.data.id, mid_class: $.data.passenger_class }
          assert:
            - "Passenger.${kid_id}.passenger_class == UMNR"
            - "Passenger.${elder_id}.passenger_class == SENIOR"
            - "Passenger.${mid_id}.passenger_class == ADULT"

      - name: service_leg_requires_flags_computed
        claim_type: computed_field
        grounds: [entities.ServiceLeg.fields.requires_wheelchair, entities.ServiceLeg.fields.requires_ummr_agent, entities.ServiceLeg.fields.requires_tsa_escort]
        distinguishing_aspect: "Leg creation derives requires_* flags from passenger mobility_code and terminal.requires_secure_escort."
        test_recipe:
          setup:
            - "Airport, terminal (requires_secure_escort=true), DEPARTURE segment, UMNR passenger with WCHC"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "TPA", tz_offset_minutes: -240, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "E", requires_secure_escort: true }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "BA1", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-06-20T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "UM P", dob: "2018-01-01", mobility_code: "WCHC", airline_pnr: "TP1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
          assert:
            - "ServiceLeg.${leg_id}.requires_wheelchair == true"
            - "ServiceLeg.${leg_id}.requires_wchc_chair == true"
            - "ServiceLeg.${leg_id}.requires_ummr_agent == true"
            - "ServiceLeg.${leg_id}.requires_tsa_escort == true"
            - "ServiceLeg.${leg_id}.requires_senior_agent == false"

      - name: get_nonexistent_airport_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /maa/airports/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: immutable_tracking_event_has_no_version
        claim_type: immutability
        grounds: [entities.TrackingEvent]
        distinguishing_aspect: "TrackingEvent uses common_fields=false — has id+created_at only, no version, no updated_at."
        test_recipe:
          setup:
            - "Create airport, terminal, segment, passenger, request, leg, agent, dispatch, ARRIVE_PICKUP"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "FLL", tz_offset_minutes: -240, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "1", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "NK1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P FLL", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "FLL1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "FLL Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-FLL-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
              captures: { asg_id: $.data.id, asg_token: $.data.tracking_token }
          trigger:
            - call: "POST /maa/tracking"
              payload: { tracking_token: "${asg_token}", event_kind: "LOCATION_PING", lat: 26.1, lon: -80.1, occurred_at_utc: "2026-06-16T09:30:00Z" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { te_id: $.data.id }
          assert:
            - "TrackingEvent.${te_id} response does NOT contain a 'version' field"
            - "TrackingEvent.${te_id} response does NOT contain an 'updated_at' field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_complete_before_dispatch_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Assignment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETE on a non-existent assignment never gets created; the corner is on ServiceLeg: ARRIVE_PICKUP on a PLANNED (undispatched) leg fails."
        test_recipe:
          setup:
            - "Airport MCO, request SUBMITTED with one PLANNED leg, no dispatch yet"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "MCO", tz_offset_minutes: -240, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "A", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "MCO1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P MCO", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "MCO1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
          trigger:
            # attempt to transition the leg DISPATCHED→AT_PICKUP via a non-existent assignment
            - call: "POST /maa/assignments/00000000-0000-0000-0000-000000000000/events"
              payload: { event_type: "ARRIVE_PICKUP" }
              as: Agent
              as_user_id: "someone"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: cancel_in_service_request_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssistRequest.SUBMITTED_to_CANCELLED, "errors[ERR_ALREADY_IN_SERVICE]"]
        distinguishing_aspect: "CANCEL a SUBMITTED request whose assignment is already AT_PICKUP → ERR_ALREADY_IN_SERVICE."
        test_recipe:
          setup:
            - "Request submitted, dispatched, ARRIVE_PICKUP called"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "RDU", tz_offset_minutes: -240, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "2", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "RDU1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P RDU", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "RDU1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "RDU Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-RDU-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /maa/assignments/${asg_id}/events"
              payload: { event_type: "ARRIVE_PICKUP" }
              as: Agent
              as_user_id: "${ag_id}"
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v3: $.data.version }
          trigger:
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "CANCEL", expected_assist_request_version: "${req_v3}" }
              as: Requester
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_IN_SERVICE"
            - "AssistRequest.${req_id}.request_status == IN_SERVICE"

      - name: retire_chair_in_use_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WheelchairAsset, "errors[ERR_CHAIR_IN_USE]"]
        distinguishing_aspect: "RETIRE on a chair referenced by an in-flight assignment → ERR_CHAIR_IN_USE."
        test_recipe:
          setup:
            - "Airport SMF, dispatch a leg, chair CHECKED_OUT"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "SMF", tz_offset_minutes: -420, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "A", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "SMF1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P SMF", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "SMF1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "SMF Ag", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-SMF-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
              captures: { wc_id: $.data.id }
            - call: "POST /maa/wheelchairs/${wc_id}/events"
              payload: { event_type: "SCHEDULE_MAINTENANCE" }
              as: OpsManager
            - call: "POST /maa/wheelchairs/${wc_id}/events"
              payload: { event_type: "COMPLETE_MAINTENANCE" }
              as: OpsManager
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v2: $.data.version }
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v2}" }
              as: Dispatcher
          trigger:
            - call: "POST /maa/wheelchairs/${wc_id}/events"
              payload: { event_type: "RETIRE" }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CHAIR_IN_USE"
            - "WheelchairAsset.${wc_id}.status == CHECKED_OUT"

  # ===========================================================================
  - section: calculations
    instances:
      - name: provisional_charge_with_zero_companion_and_no_equipment
        claim_type: correct_result
        grounds: [calculations.provisional_leg_charge]
        distinguishing_aspect: "Baseline formula: pure base * tier * posture with no fee adders."
        test_recipe:
          setup:
            - "Airport, segment, adult WCHR-free passenger (mobility_code=WCHR still adds WCHR_FEE — use a passenger with mobility_code WCHR but the leg is DEPARTURE_ESCORT with no extra flags); actually for TRUE baseline: choose passenger with mobility_code=WCHR (adds 800) — that's the minimum wheel-chair-required case. For TRUE zero-equipment baseline, mobility_code=WCHR is the minimum; we cannot test 'no wheelchair' because mobility_code is always one of WCHR/WCHS/WCHC and each adds a fee. So baseline = WCHR only, no UMNR, no senior, no TSA, companion_count=0."
            - "Compute: base 6000 (MEET_ARRIVAL) + 0 + 800 + 0 + 0 + 0 = 6800, tier STANDARD=1.0, posture NORMAL=1.0 → 6800"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "PIT", tz_offset_minutes: -240, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "M", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "PIT1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P PIT", dob: "1990-01-01", mobility_code: "WCHR", airline_pnr: "PIT1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "MEET_ARRIVAL", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
          trigger:
            - call: "POST /maa/assist-requests/${req_id}/events"
