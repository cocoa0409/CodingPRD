            - "${p_available} == 104365000"

  # =========================================================================
  # Rule 3 — non-linear state machines (revision loop, parallel dimensions, fork)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gate_changes_requested_revision_cycle
        grounds:
          - state_machines.PreProductionGate.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.PreProductionGate.CHANGES_REQUESTED_to_IN_REVIEW
          - entities.PreProductionGate.fields.revision_count
          - state_machines.Production.PRE_PRODUCTION_to_PRODUCTION_ACTIVE
        distinguishing_aspect: |
          The gate loops backwards: IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW is a cycle whose only
          visible residue is revision_count, and the second pass through the same submit endpoint has a
          different legal source state than the first.
        test_recipe:
          setup:
            - "Production AD01 was created with the single gate type SCRIPT, so its only gate is the last gate"
            - "the SCRIPT gate has been submitted once and bounced with decision CHANGES_REQUESTED"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "CHANGES_REQUESTED", note: "Act two needs a rewrite." }
              as: Director
              as_user_id: "u-dir-01"
              captures: { g_status_1: "$.data.status", g_rev_1: "$.data.revision_count" }
          trigger:
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v2.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { g_status_2: "$.data.status", g_rev_2: "$.data.revision_count", g_url_2: "$.data.package_url" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
              captures: { g_status_3: "$.data.status" }
            - call: "GET /studio/pre-production-gates/${gate_script_id}"
              as: ProductionManager
              captures: { g_status_4: "$.data.status" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_phase: "$.data.phase" }
          assert:
            - "${g_status_1} == CHANGES_REQUESTED and ${g_rev_1} == 1"
            - "${g_status_2} == IN_REVIEW and ${g_rev_2} == 1 (re-submission does not bump the counter again)"
            - "${g_url_2} == s3://ad01/script/v2.pdf"
            - "${g_status_3} == APPROVED as returned by the decision call itself"
            - "${g_status_4} == LOCKED because the production bubbled to PRODUCTION_ACTIVE in the same request"
            - "${p_phase} == PRODUCTION_ACTIVE"
            - "a third POST /studio/pre-production-gates/${gate_script_id}/submit returns 409 with error_id ERR_GATE_STATE_INVALID"
      - name: asset_build_and_library_dimensions_advance_independently
        grounds:
          - state_machines.Asset.build_status
          - state_machines.Asset.library_status
          - entities.Asset.fields.library_decided_by_user_id
          - validations[priority=7]
        distinguishing_aspect: |
          Asset carries two independent state dimensions on one row: the four-step build ladder and the
          library-publication ladder. Driving library_status from PRIVATE to LIBRARY_APPROVED must leave
          build_status pinned at PUBLISHED, and the library decision is barred to the submitting artist.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE"
            - "asset AD01_CHAR_HERO exists at build_status BRIEFED and library_status PRIVATE with 200 base complexity points"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_CHAR_HERO", asset_type: "CHARACTER_MODEL", base_complexity_points: 200.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { asset_id: "$.data.id", a_build_0: "$.data.build_status", a_lib_0: "$.data.library_status", a_eff_0: "$.data.effective_complexity_points" }
          trigger:
            - call: "POST /studio/assets/${asset_id}/advance-build"
              payload: { to_build_status: "MODELING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_id}/advance-build"
              payload: { to_build_status: "RIGGING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_id}/advance-build"
              payload: { to_build_status: "SURFACING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${asset_id}/advance-build"
              payload: { to_build_status: "PUBLISHED" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_build_1: "$.data.build_status", a_lib_1: "$.data.library_status" }
            - call: "POST /studio/assets/${asset_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_build_2: "$.data.build_status", a_lib_2: "$.data.library_status" }
            - call: "POST /studio/assets/${asset_id}/library-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { a_build_3: "$.data.build_status", a_lib_3: "$.data.library_status", a_decider: "$.data.library_decided_by_user_id" }
          assert:
            - "${a_build_0} == BRIEFED and ${a_lib_0} == PRIVATE and ${a_eff_0} == 200.00"
            - "${a_build_1} == PUBLISHED and ${a_lib_1} == PRIVATE (the build ladder never touches the library dimension)"
            - "${a_build_2} == PUBLISHED and ${a_lib_2} == LIBRARY_CANDIDATE"
            - "${a_build_3} == PUBLISHED and ${a_lib_3} == LIBRARY_APPROVED and ${a_decider} == u-sup-01"
            - "skipping a build rung, e.g. POST /studio/assets/{id}/advance-build with to_build_status SURFACING while at MODELING, returns 409 with error_id ERR_ASSET_BUILD_STATE_INVALID"
            - "the same library-decision call issued as Supervisor with as_user_id u-artist-01 returns 403 with error_id ERR_SELF_APPROVAL_FORBIDDEN"
      - name: package_qc_fork_produces_divergent_side_effects
        grounds:
          - state_machines.OutsourcePackage.DELIVERED_to_QC_PASSED
          - state_machines.OutsourcePackage.DELIVERED_to_QC_FAILED
          - state_machines.ShotStageTask.APPROVED_to_RETAKE
