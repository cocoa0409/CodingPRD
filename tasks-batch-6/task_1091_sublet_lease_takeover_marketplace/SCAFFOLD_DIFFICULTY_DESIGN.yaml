            - { call: "POST /leases/${lease_id}/submit-verification", payload: {}, as: Landlord, as_user_id: "${ll_id}" }
            - { call: "POST /leases/${lease_id}/verify", payload: { decision: "VERIFIED" }, as: ComplianceOfficer }
            - { call: "POST /listings", payload: { lease_id: "${lease_id}", listing_type: "SUBLET", asking_rent_cents: 300000, available_from: "2026-06-01", available_to: "2026-08-31", min_term_months: 1, screening_policy: "STANDARD" }, as: Leaseholder, as_user_id: "${lh_id}", captures: { listing_id: $.data.id } }
