  - section: cross_cutting_complexity
    instances:
      - name: oa_amend_stale_version_rejected_then_rebased_succeeds
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[oa-amend-stale-version]", "endpoints[POST /leasing/occupancy-agreements/{id}/amend]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC layer: amend carrying the pre-activation version (expected_oa_version == current - 1) is rejected 412 ERR_STALE_VERSION; rebasing to the current version succeeds, bumps version by exactly 1, grows assigned_sf by delta_sf, and debits the owned building's available_sf."
        test_recipe:
          setup: ["owned building 50,000 sf; OA ACTIVE over 20,000 sf (version captured right after activation)"]
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-390", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 20000, start_date: "2026-11-01", end_date: "2036-10-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
