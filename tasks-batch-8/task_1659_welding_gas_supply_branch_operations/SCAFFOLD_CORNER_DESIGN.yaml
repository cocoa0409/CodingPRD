              as: CounterRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (HTTP 403)"

      - name: invalid_enum_order_type_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "order_type outside {RETAIL, EXCHANGE, SPECIAL_MIX} fails shape validation with ERR_VALIDATION 400."
        test_recipe:
          setup: ["CASH customer; product stock 1"]
          setup_api_calls:
