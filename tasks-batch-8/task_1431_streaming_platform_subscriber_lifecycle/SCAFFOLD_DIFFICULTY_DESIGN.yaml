  # ==========================================================================
  # Rule 6 — boundary_precision_check: at least two exact-precision
  # boundaries on DIFFERENT metrics, reachable through DISTINCT endpoints.
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reconcile_delta_at_exactly_500
        grounds:
          - calculations.partner_reconciliation_delta
          - validations[priority=10]
        distinguishing_aspect: |
          Numeric threshold boundary on the partner reconciliation delta
          metric. abs(delta) == 500 reconciles (<=), abs(delta) == 501 opens
          discrepancy (>). Reachable through POST
          /v1/partner-billing-records/{id}/reconcile.
        test_recipe:
          setup:
            - "Account A12; PartnerBillingRecord R12 with expected_amount_cents=10000"
            - "R12 has been report-receipt'ed with received_amount_cents=10500 (delta=+500)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/accounts"
              payload: { email: "a12@x.com", full_name: "A Twelve", country_code: "US" }
              as: PlatformAdmin
              captures: { acc12_id: $.data.account_id }
            - call: "POST /v1/partner-billing-records"
              payload: { partner_code: "APPLE", account_id: "${acc12_id}", partner_subscription_ref: "ref12", expected_amount_cents: 10000, period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-08-31T00:00:00Z" }
              as: PartnerBillingOps
              captures: { pbr12_id: $.data.partner_billing_record_id, pbr12_v: $.data.version }
            - call: "POST /v1/partner-billing-records/${pbr12_id}/report-receipt"
              payload: { received_amount_cents: 10500 }
              as: PartnerBillingOps
            - call: "GET /v1/partner-billing-records/${pbr12_id}"
              payload: {}
              as: PartnerBillingOps
              captures: { pbr12_v_now: $.data.version }
          trigger:
            - call: "POST /v1/partner-billing-records/${pbr12_id}/reconcile"
              payload: { expected_partner_billing_record_version: "${pbr12_v_now}" }
              as: PartnerBillingOps
          assert:
            - "PartnerBillingRecord.${pbr12_id}.report_status == RECONCILED (delta == 500 boundary inclusive)"

      - name: household_count_at_exactly_max
        grounds:
          - calculations.household_sharing_violation_count
          - validations[priority=9]
        distinguishing_aspect: |
          Empty-set/equality boundary on the household count metric. A profile
          create that would bring the distinct-household count to exactly
          plan.max_households succeeds (not >); a further profile on a NEW
          household that pushes the count to max_households + 1 fails with
          ERR_HOUSEHOLD_LIMIT_EXCEEDED. Reachable through POST /v1/profiles.
        test_recipe:
          setup:
            - "Plan BASIC: max_profiles=5, max_households=1"
            - "Account A13 with Subscription S13 on BASIC ACTIVE; no profiles yet"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 5, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a13@x.com", full_name: "A Thirteen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc13_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc13_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub13_id: $.data.subscription_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc13_id}", display_name: "P13a", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc13_id}", display_name: "P13b", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc13_id}", display_name: "P13c", is_kids: false, household_id: "hh-2" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "Second profile on same household hh-1 succeeds (distinct_households == 1 == max_households, not >)"
            - "Third profile on new household hh-2 fails with err_id == ERR_HOUSEHOLD_LIMIT_EXCEEDED (distinct_households would become 2 > 1)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency: at least two cross-entity state
  # dependencies across DIFFERENT entity pairs.
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: profile_reactivation_depends_on_subscription_state
        grounds:
          - state_machines.Profile.DEACTIVATED_to_ACTIVE
          - entities.Profile.fields.account_id
          - entities.Subscription.fields.subscription_status
        distinguishing_aspect: |
          Profile → Subscription pair: a DEACTIVATED profile can be
          reactivated only when the linked Subscription is in {TRIALING,
          ACTIVE, PAST_DUE}; when subscription is PAUSED, reactivation is
          rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Plan BASIC; Account A14 with Subscription S14 ACTIVE; Profile P14 DEACTIVATED"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a14@x.com", full_name: "A Fourteen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc14_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc14_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub14_id: $.data.subscription_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc14_id}", display_name: "P14", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { prof14_id: $.data.profile_id }
            - call: "POST /v1/profiles/${prof14_id}/deactivate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub14_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/profiles/${prof14_id}/reactivate"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (Profile reactivation blocked while Subscription is PAUSED)"

      - name: save_offer_accept_depends_on_price_change_notice
        grounds:
          - state_machines.SaveOffer.PRESENTED_to_ACCEPTED
          - state_machines.PriceChangeNotice.ANNOUNCED_to_EFFECTIVE
        distinguishing_aspect: |
          SaveOffer → PriceChangeNotice pair: an accept on a PRESENTED
          SaveOffer whose target plan has an EFFECTIVE price-change notice
          must recompute grandfathered_price_cents using the new price, not
          the old — the SaveOffer's valid transition behaviour depends on the
          state of a separate PriceChangeNotice entity.
        test_recipe:
          setup:
            - "Plan BASIC 3000c; PriceChangeNotice for BASIC EFFECTIVE at 3000→4000"
            - "Subscription S15 ACTIVE with grandfathered_price_cents=3000 (locked pre-change)"
            - "SaveOffer O15 DISCOUNT_50_3M PRESENTED on S15"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a15@x.com", full_name: "A Fifteen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc15_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc15_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub15_id: $.data.subscription_id }
            - call: "POST /v1/price-change-notices"
              payload: { plan_id: "${plan_basic_id}", old_price_cents: 3000, new_price_cents: 4000, effective_at_utc: "2026-09-01T00:00:00Z", grandfather_period_months: 6 }
              as: PlatformAdmin
            - call: "POST /v1/save-offers"
              payload: { subscription_id: "${sub15_id}", offer_type: "DISCOUNT_50_3M", discount_pct: 50, discount_duration_months: 3 }
              as: PlatformAdmin
              captures: { offer15_id: $.data.save_offer_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/save-offers/${offer15_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${acc15_id}"
          assert:
            - "SaveOffer.${offer15_id}.offer_status == ACCEPTED"
            - "Subscription.${sub15_id}.grandfathered_price_cents == 1500 (base is plan list 3000 since S15 had no prior lock; 50% off → 1500)"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap: at least two overlap rules with
  # DIFFERENT interval semantics on DIFFERENT resources.
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: price_change_notice_no_overlapping_open_notices_per_plan
        grounds:
          - entities.PriceChangeNotice.fields.effective_at_utc
          - state_machines.PriceChangeNotice
        distinguishing_aspect: |
          Half-open interval [announced_at, effective_at) semantics on the
          PriceChangeNotice resource. A second notice on the same plan whose
          [announced_at, effective_at) interval overlaps with an existing
          ANNOUNCED notice's interval is rejected with ERR_INVALID_REQUEST;
          adjacent notices (one's effective_at == the other's announced_at)
          are permitted.
        test_recipe:
          setup:
            - "Plan BASIC"
            - "Notice N16a on BASIC: announced 2026-08-01, effective 2026-09-01, ANNOUNCED"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/price-change-notices"
              payload: { plan_id: "${plan_basic_id}", old_price_cents: 3000, new_price_cents: 3500, effective_at_utc: "2026-09-01T00:00:00Z", grandfather_period_months: 0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/price-change-notices"
              payload: { plan_id: "${plan_basic_id}", old_price_cents: 3500, new_price_cents: 4000, effective_at_utc: "2026-10-01T00:00:00Z", grandfather_period_months: 0 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST (overlapping ANNOUNCED notice on the same plan)"

      - name: pause_cooldown_12_month_rolling_window
        grounds:
          - calculations.proration_on_pause_credit
          - validations[priority=14]
        distinguishing_aspect: |
          Rolling-window aggregate-capacity semantics on the Subscription
          resource. A second pause attempt is rejected when the trailing
          12-month window contains any prior pause — even when the prior
          pause's [pause_start, paused_until) interval does NOT overlap the
          new request's interval (different interval semantics from rule
          instance 1: aggregate-over-window rather than geometric overlap).
        test_recipe:
          setup:
            - "Plan BASIC; Subscription S17 ACTIVE"
            - "S17 paused 2026-01-15..2026-02-15 (more than 6 months ago, less than 12)"
            - "Logical clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a17@x.com", full_name: "A Seventeen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc17_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc17_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub17_id: $.data.subscription_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub17_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-02-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub17_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_PAUSE_NOT_ALLOWED (trailing 12-month rolling window contains prior pause; geometric intervals do not overlap)"

  # ==========================================================================
  # Rule 9 — compensating_invariant: at least two invariants where forward +
  # compensating action leave a named global quantity unchanged.
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_account_active_subscription_invariant
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.Account.fields.active_subscription_id
        distinguishing_aspect: |
          Conserved quantity: count of subscriptions in {TRIALING, ACTIVE,
          PAST_DUE, PAUSED} linked to an Account. Subscription create (+1)
          paired with cancel (-1) leaves the count unchanged. Pinned formula:
          count(Subscription where account_id=A and subscription_status IN
          {TRIALING, ACTIVE, PAST_DUE, PAUSED}).
        test_recipe:
          setup:
            - "Plan BASIC; Account A18 (no subscriptions)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a18@x.com", full_name: "A Eighteen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc18_id: $.data.account_id }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc18_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub18_id: $.data.subscription_id }
            - call: "POST /v1/subscriptions/${sub18_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          assert:
            - "Account.${acc18_id}.active_subscription_id is null after cancel (conserved quantity returned to initial value)"

      - name: save_offer_accept_then_decline_leaves_subscription_unchanged
        grounds:
          - state_machines.SaveOffer.PRESENTED_to_ACCEPTED
          - state_machines.SaveOffer.PRESENTED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity: Subscription.monthly_billing_amount as derived
          from (plan.monthly_price_cents, grandfathered_price_cents). A
          DISCOUNT save offer that is presented (no mutation) then DECLINED
          must leave the subscription's effective billing amount unchanged.
          Pinned formula: effective_price = COALESCE(grandfathered_price_cents,
          plan.monthly_price_cents).
        test_recipe:
          setup:
            - "Plan BASIC 3000c; Subscription S19 ACTIVE; effective_price == 3000"
            - "SaveOffer O19 DISCOUNT_50_3M PRESENTED on S19"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a19@x.com", full_name: "A Nineteen", country_code: "US" }
              as: PlatformAdmin
              captures: { acc19_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc19_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub19_id: $.data.subscription_id }
            - call: "POST /v1/save-offers"
              payload: { subscription_id: "${sub19_id}", offer_type: "DISCOUNT_50_3M", discount_pct: 50, discount_duration_months: 3 }
              as: PlatformAdmin
              captures: { offer19_id: $.data.save_offer_id }
          trigger:
            - call: "POST /v1/save-offers/${offer19_id}/decline"
              payload: {}
              as: Subscriber
              as_user_id: "${acc19_id}"
          assert:
            - "SaveOffer.${offer19_id}.offer_status == DECLINED"
            - "Subscription.${sub19_id}.grandfathered_price_cents is null (unchanged)"
            - "Effective price (plan list) remains 3000"
