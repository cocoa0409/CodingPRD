      - name: discharge_daily_cap_strict_greater_than_at_exactly_cap
        grounds:
          - calculations.permit_daily_bucket_usage
          - errors[ERR_DISCHARGE_DAILY_CAP_EXCEEDED]
          - entities.PermitAllotment.fields.daily_cap_kg
          - entities.PermitAllotment.fields.consumed_kg
        distinguishing_aspect: |
          The daily-cap comparison is STRICTLY greater-than at 3-decimal precision: two POSTED
          events of 300.0 and 200.0 in the same UTC bucket sum to exactly the 500.0 cap and are
          both accepted, while a third event of only 0.001 kg makes the bucket 500.001 and is
          rejected, so equality passes and the smallest representable excess fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-20T00:00:00.000Z, one campus, one HYDROMET NICKEL_RICH line, one SCHEDULED campaign and one OPEN lot L-1 to attribute discharges to."
            - "One ACTIVE WATER PermitAllotment, permit_no NV-W-118, valid_from 2026-08-01T00:00:00.000Z, valid_to 2026-08-31T23:59:59.999Z, daily_cap_kg 500.0, consumed_kg 0.0."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-25T00:00:00.000Z", window_end: "2026-09-30T00:00:00.000Z", planned_input_kg: 5000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "L-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "WATER", permit_no: "NV-W-118", valid_from: "2026-08-01T00:00:00.000Z", valid_to: "2026-08-31T23:59:59.999Z", daily_cap_kg: 500.0 }
              as: ComplianceOfficer
              captures: { allot_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T06:00:00.000Z", mass_kg: 300.0, analyte: "FLUORIDE" }
              as: ComplianceOfficer
              captures: { ev1_id: "$.data.id" }
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T18:00:00.000Z", mass_kg: 200.0, analyte: "FLUORIDE" }
              as: ComplianceOfficer
              captures: { ev2_id: "$.data.id" }
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${allot_id}", event_date: "2026-08-20T23:00:00.000Z", mass_kg: 0.001, analyte: "FLUORIDE" }
              as: ComplianceOfficer
          assert:
            - "The first two events return HTTP 201 with DischargeEvent.status == POSTED"
            - "After the second event, PermitAllotment.${allot_id}.consumed_kg == 500.0"
            - "The third event returns HTTP 422 with error.error_id == ERR_DISCHARGE_DAILY_CAP_EXCEEDED"
            - "PermitAllotment.${allot_id}.consumed_kg == 500.0 after the rejected third event"
            - "DischargeEvent.${ev1_id}.mass_kg == 300.0 and DischargeEvent.${ev2_id}.mass_kg == 200.0"
            - "PermitAllotment.${allot_id}.status == ACTIVE"

      - name: zero_contained_metal_skips_index_lookup_and_books_zero_line
        grounds:
          - calculations.feedstock_payable_value
          - errors[ERR_INDEX_PRICE_UNAVAILABLE]
          - entities.SupplierSettlement.fields.line_breakdown
          - validations[priority=13]
        distinguishing_aspect: |
          The zero boundary of contained_kg * recovery_factor short-circuits the index lookup: an
          LFP intake declares NI 5.0 and CO 3.0 (contained 10.000 and 6.000 kg) but the LFP
          NOMINAL_RECOVERY for NI and CO is 0.00, so both lines book line_cents 0 with NO quote
