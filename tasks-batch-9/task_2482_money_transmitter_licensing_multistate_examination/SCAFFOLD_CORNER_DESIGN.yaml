      - name: control_determination_boundary_at_two_thousand_five_hundred_bps
        claim_type: threshold
        grounds:
          - calculations.control_person_ownership_attribution.constants.CONTROL_THRESHOLD_BPS
          - entities.ControlPerson.fields.control_determination
          - entities.ControlPerson.fields.background_check_status
        distinguishing_aspect: "The control test is >= 2500: a root holder at exactly 2500 bps is CONTROL with background_check_status PENDING, while 2499 bps is NON_CONTROL with NOT_REQUIRED — and only the first one drives the licensee to PENDING_CHECKS."
        test_recipe:
          setup: ["One licensee, no licenses yet."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Dana Whitfield", role_title: "ENTITY_HOLDER", direct_ownership_bps: 2500 }
              as: LicensingManager
              captures: { cp_at: "$.data.id", det_at: "$.data.control_determination", bg_at: "$.data.background_check_status" }
            - call: "POST /control-persons"
              payload: { licensee_id: "${lic_id}", full_name: "Ravi Menon", role_title: "ENTITY_HOLDER", direct_ownership_bps: 2499 }
              as: LicensingManager
              captures: { cp_below: "$.data.id", det_below: "$.data.control_determination", bg_below: "$.data.background_check_status" }
          assert:
            - "${det_at} == CONTROL and ${bg_at} == PENDING; ControlPerson.${cp_at}.attributed_ownership_bps == 2500 and effective_ownership_bps == 2500"
            - "${det_below} == NON_CONTROL and ${bg_below} == NOT_REQUIRED; ControlPerson.${cp_below}.attributed_ownership_bps == 2499"
            - "both rows: change_of_control_status == NOT_REQUIRED and required_approval_count == 0 (active_license_count is 0)"
            - "Licensee.${lic_id}.control_chain_status == PENDING_CHECKS (driven solely by the 2500 bps row)"

      - name: officer_title_forces_control_at_zero_ownership
        claim_type: Constants Applied
        grounds:
          - calculations.control_person_ownership_attribution.constants.OFFICER_TITLES
          - entities.ControlPerson.fields.control_determination
        distinguishing_aspect: "OFFICER_TITLES is an independent disjunct: a CFO holding 0 bps is CONTROL with a PENDING background check even though both ownership variants read 0."
        test_recipe:
          setup: ["One licensee, no licenses yet."]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
          trigger:
