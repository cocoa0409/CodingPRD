  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_stale_case_version_rejected
        claim_type: OCC stale-version conflict
        grounds: ["concurrency_rules[plan-create-stale-case]", entities.Case.fields.version]
        distinguishing_aspect: "Creating a payment plan with expected_case_version equal to the case's pre-obligation version (now stale after an obligation bumped it) returns ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["Case created (version 1), then an obligation added which advanced Case.version"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-OCC", defendant_name: "Yan Ros" }
              as: CollectionsClerk
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv0}" }
              as: CollectionsClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_CASE_VERSION"
            - "HTTP status == 412"

      - name: case_version_increments_on_obligation_add
        claim_type: OCC version increment
        grounds: [entities.Case.fields.version]
        distinguishing_aspect: "Case.version starts at 1 and is greater than 1 after an obligation is added (aggregate recompute mutates the case)."
        test_recipe:
          setup: ["Case created then one obligation added"]
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-VERBUMP", defendant_name: "Zoe Ott" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
          trigger:
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
          assert:
            - "Case.${case_id}.version >= 2"

