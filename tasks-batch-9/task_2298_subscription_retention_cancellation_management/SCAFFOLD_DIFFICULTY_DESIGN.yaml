scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ltv_realized_versus_projected_on_same_subscriber
        grounds:
          - calculations.subscriber_lifetime_value
          - entities.Subscriber.fields.realized_ltv_cents
          - entities.Subscriber.fields.projected_ltv_cents
          - entities.Subscriber.fields.tenure_bucket
          - calculations.cohort_retention_metrics
          - entities.RetentionCohortSnapshot.fields.ltv_variant
        distinguishing_aspect: |
          The two lifetime-value variants are computed over one Subscriber entity from the same
          invoice set and diverge by exactly 29424 cents (REALIZED 3678 counts only the settled
          invoice, PROJECTED 33102 adds the current cycle margin times the 8 expected remaining
          cycles derived from PAID_SOCIAL x tenure bucket M2_3), and RetentionCohortSnapshot.ltv_variant
          is the field that selects which one a cohort report averages.
        test_recipe:
          setup:
            - "Plans LITE and CORE exist; CORE is 4999 cents at 2100 cents COGS with a MUG addon at 1299/520."
            - "Subscriber A on PAID_SOCIAL subscribed to CORE with one MUG addon on 2026-01-10 at 4-week cadence."
            - "Signup invoice (6298 cents, 2620 COGS) was charged once and settled SUCCEEDED, so it is PAID."
            - "Logical clock advanced to 2026-03-26, putting A at 75 days tenure (bucket M2_3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "LITE", name: "Lite Box", monthly_price_cents: 2999, unit_cogs_cents: 1400, margin_floor_pct: 0.4000, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { lite_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }, { code: "TUMBLER", unit_price_cents: 899, unit_cogs_cents: 360 }], downgrade_target_plan_id: "${lite_plan_id}" }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "PAID_SOCIAL" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: PlatformAdmin
              captures: { inv_a1_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_a1_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_a1_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-26T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /subscribers/${sub_a_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /retention-cohort-snapshots"
              payload: { cohort_month: "2026-01", ltv_variant: "REALIZED" }
              as: RetentionSpecialist
              captures: { snap_realized_id: $.data.id }
            - call: "POST /retention-cohort-snapshots"
              payload: { cohort_month: "2026-01", ltv_variant: "PROJECTED" }
              as: RetentionSpecialist
              captures: { snap_projected_id: $.data.id }
          assert:
            - "Subscriber.${sub_a_id}.tenure_days == 75"
            - "Subscriber.${sub_a_id}.tenure_bucket == M2_3"
            - "Subscriber.${sub_a_id}.realized_ltv_cents == 3678"
            - "Subscriber.${sub_a_id}.projected_ltv_cents == 33102"
            - "Subscriber.${sub_a_id}.projected_ltv_cents - Subscriber.${sub_a_id}.realized_ltv_cents == 29424"
            - "RetentionCohortSnapshot.${snap_realized_id}.member_count == 1"
            - "RetentionCohortSnapshot.${snap_realized_id}.retained_count == 1"
            - "RetentionCohortSnapshot.${snap_realized_id}.retention_rate == 1.0000"
            - "RetentionCohortSnapshot.${snap_realized_id}.mean_ltv_cents == 3678"
            - "RetentionCohortSnapshot.${snap_projected_id}.mean_ltv_cents == 33102"
            - "RetentionCohortSnapshot.${snap_projected_id}.churned_voluntary_count == 0"

      - name: save_offer_margin_per_cycle_versus_blended_term_guardrail
        grounds:
          - calculations.save_offer_margin_pct
          - entities.SaveOfferGrant.fields.per_cycle_margin_pct
          - entities.SaveOfferGrant.fields.blended_term_margin_pct
          - entities.SaveOfferGrant.fields.margin_exception_required
          - entities.Plan.fields.margin_floor_pct
        distinguishing_aspect: |
          The two margin variants are computed over one SaveOfferGrant entity and straddle CORE's
          0.4200 floor in opposite directions — PER_CYCLE reads 0.3536 (would demand an exception)
          while BLENDED_TERM reads 0.5115 (clears the floor) — and the scaffold binds the guardrail
          to BLENDED_TERM, so margin_exception_required is false and margin_exception_state is NOT_REQUIRED.
        test_recipe:
          setup:
            - "Plans LITE and CORE exist as above; template DISC35 is a 35% discount for 2 cycles at priority_rank 30, min_tenure_days 60, eligible for reason PRICE."
            - "Subscriber L subscribed to CORE on 2026-01-10 at 4-week cadence with no addons."
            - "Logical clock advanced to 2026-03-11, putting L at exactly 60 days tenure."
            - "An open cancellation session on L's subscription has reason_code PRICE captured (step_count 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "LITE", name: "Lite Box", monthly_price_cents: 2999, unit_cogs_cents: 1400, margin_floor_pct: 0.4000, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { lite2_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }], downgrade_target_plan_id: "${lite2_plan_id}" }
              as: PlatformAdmin
              captures: { core2_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "DISC35", name: "35% off two cycles", offer_type: "DISCOUNT", priority_rank: 30, discount_pct: 0.3500, discount_cycles: 2, min_tenure_days: 60, eligible_reason_codes: ["PRICE"], max_per_subscriber_per_365d: 1, expires_after_hours: 48 }
              as: PlatformAdmin
              captures: { tpl_disc35_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "l@dtc.test", acquisition_channel: "SEARCH" }
              as: PlatformAdmin
              captures: { sub_l_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_l_id}", card_last4: "1111", exp_month: 11, exp_year: 2029, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_l_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_l_id}", plan_id: "${core2_plan_id}", payment_method_id: "${pm_l_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_l_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_l_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_l_id}"
              captures: { cs_l_id: $.data.id }
            - call: "POST /cancellation-sessions/${cs_l_id}/reason"
              payload: { reason_code: "PRICE", reason_detail: "too expensive" }
              as: Subscriber
              as_user_id: "${sub_l_id}"
          trigger:
            - call: "POST /cancellation-sessions/${cs_l_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_1"
              captures: { grant_l_id: $.data.id }
          assert:
            - "SaveOfferGrant.${grant_l_id}.save_offer_template_id == ${tpl_disc35_id}"
            - "SaveOfferGrant.${grant_l_id}.per_cycle_margin_pct == 0.3536"
            - "SaveOfferGrant.${grant_l_id}.blended_term_margin_pct == 0.5115"
            - "SaveOfferGrant.${grant_l_id}.retention_value_cents == 10995"
            - "SaveOfferGrant.${grant_l_id}.margin_exception_required == false"
            - "SaveOfferGrant.${grant_l_id}.margin_exception_state == NOT_REQUIRED"
            - "SaveOfferGrant.${grant_l_id}.state == PRESENTED"
            - "SaveOfferGrant.${grant_l_id}.expires_at == 2026-03-13T00:00:00Z"
            - "CancellationSession.${cs_l_id}.state == OFFERS_PRESENTED"
            - "CancellationSession.${cs_l_id}.presented_by_user_id == rs_1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_per_line_rounding_before_summation_under_discount
        grounds:
          - calculations.invoice_amount_cents
          - calculations.committed_price_cents
          - entities.Invoice.fields.line_items
          - entities.SubscriptionModification.fields.delta_price_cents
        distinguishing_aspect: |
          Rounding each line to whole cents before summation yields 3249 + 844 = 4093 while the
          forbidden sum-then-round order yields 4094, so the pinned order is observable in
          Subscription.committed_price_cents, in the renewal Invoice.amount_cents and in the
          accepted modification's delta_price_cents (-2205 rather than -2204).
        test_recipe:
          setup:
            - "CORE (4999/2100, MUG addon 1299/520) and template DISC35 exist as in the margin instance."
            - "Subscriber M2 subscribed to CORE with one MUG addon on 2026-01-10 at 4-week cadence, so the signup invoice is 6298 cents and next_renewal_at is 2026-02-07."
            - "The auto-scheduled RENEWAL_REMINDER for cycle 1 was sent on 2026-01-28, the first instant of its legal window."
            - "Logical clock advanced to 2026-03-11 (tenure 60), a cancellation session captured reason PRICE, and the DISC35 offer was presented and accepted, setting active_discount_pct 0.3500 for 2 cycles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "LITE", name: "Lite Box", monthly_price_cents: 2999, unit_cogs_cents: 1400, margin_floor_pct: 0.4000, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { lite3_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }], downgrade_target_plan_id: "${lite3_plan_id}" }
              as: PlatformAdmin
              captures: { core3_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "DISC35", name: "35% off two cycles", offer_type: "DISCOUNT", priority_rank: 30, discount_pct: 0.3500, discount_cycles: 2, min_tenure_days: 60, eligible_reason_codes: ["PRICE"], max_per_subscriber_per_365d: 1, expires_after_hours: 48 }
              as: PlatformAdmin
              captures: { tpl_d35_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "m2@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_m2_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_m2_id}", card_last4: "2222", exp_month: 10, exp_year: 2031, network: "MASTERCARD" }
              as: PlatformAdmin
              captures: { pm_m2_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_m2_id}", plan_id: "${core3_plan_id}", payment_method_id: "${pm_m2_id}", frequency_weeks: 4, disclosure_acknowledged: true, addons: [{ code: "MUG", qty: 1 }] }
              as: PlatformAdmin
              captures: { s_m2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${s_m2_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER" }
              as: PlatformAdmin
              captures: { cn_m2_id: "$.data[0].id" }
            - call: "POST /compliance-notices/${cn_m2_id}/send"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_m2_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_m2_id}"
              captures: { cs_m2_id: $.data.id }
            - call: "POST /cancellation-sessions/${cs_m2_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_m2_id}"
            - call: "POST /cancellation-sessions/${cs_m2_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_1"
              captures: { grant_m2_id: $.data.id }
          trigger:
            - call: "POST /save-offer-grants/${grant_m2_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_m2_id}"
            - call: "POST /subscriptions/${s_m2_id}/renewals"
              payload: {}
              as: BillingOperator
            - call: "GET /invoices"
              payload: { subscription_id: "${s_m2_id}" }
              as: PlatformAdmin
              captures: { inv_m2_cycle0_id: "$.data[0].id", inv_m2_cycle1_id: "$.data[1].id" }
            - call: "GET /subscription-modifications"
              payload: { subscription_id: "${s_m2_id}" }
              as: PlatformAdmin
              captures: { mod_m2_id: "$.data[0].id" }
          assert:
            - "Subscription.${s_m2_id}.active_discount_pct == 0.3500"
            - "Subscription.${s_m2_id}.discount_remaining_cycles == 1"
            - "Subscription.${s_m2_id}.committed_price_cents == 4093"
            - "SubscriptionModification.${mod_m2_id}.mod_type == DISCOUNT_APPLY"
            - "SubscriptionModification.${mod_m2_id}.delta_price_cents == -2205"
            - "Invoice.${inv_m2_cycle0_id}.amount_cents == 6298"
            - "Invoice.${inv_m2_cycle0_id}.cogs_cents == 2620"
            - "Invoice.${inv_m2_cycle1_id}.cycle_index == 1"
            - "Invoice.${inv_m2_cycle1_id}.amount_cents == 4093"
            - "Invoice.${inv_m2_cycle1_id}.cogs_cents == 2620"
            - "Invoice.${inv_m2_cycle1_id}.line_items[0].line_cents == 3249"
            - "Invoice.${inv_m2_cycle1_id}.line_items[1].line_cents == 844"
            - "Invoice.${inv_m2_cycle1_id}.proration_factor == 1.0000"

      - name: dunning_schedule_pinned_step_order_extension_then_clamp
        grounds:
          - calculations.dunning_retry_schedule
          - entities.DunningAttempt.fields.scheduled_at
          - entities.DunningAttempt.fields.grace_clamped
          - entities.DunningAttempt.fields.is_final
          - entities.Subscription.fields.grace_end_at
          - state_machines.Subscription.PAST_DUE_to_GRACE
        distinguishing_aspect: |
          The seven pinned steps are order-sensitive: the card-updater PENDING state observed at
          step 2 widens grace_end_at to 2026-02-14 before step 5 compares the raw retry instant,
          and once the updater reports UNAVAILABLE the recomputation shrinks grace_end_at back to
          2026-02-10, which clamps attempt 3 from its raw 2026-02-13 to 2026-02-10 and marks it final.
        test_recipe:
          setup:
            - "CORE exists (4999/2100, negative option, 10-day reminder lead)."
            - "Subscriber D subscribed to CORE on 2026-01-10 at 4-week cadence with no addons; the 4999-cent signup invoice was charged and settled SUCCEEDED."
            - "The cycle-1 RENEWAL_REMINDER was sent on 2026-01-28."
            - "On 2026-02-07 the renewal run issued invoice cycle_index 1 for 4999 cents."
            - "Attempt 1 on that invoice was settled SOFT_DECLINE / EXPIRED_CARD, so first_failed_at is 2026-02-07, tenure bucket M0_1 gives a 3-day base grace ending 2026-02-10, and the card updater is PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { core4_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "d@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_d_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_d_id}", card_last4: "3333", exp_month: 1, exp_year: 2026, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_d_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_d_id}", plan_id: "${core4_plan_id}", payment_method_id: "${pm_d_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_d_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_d_id}" }
              as: PlatformAdmin
              captures: { inv_d1_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_d1_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_d1_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${s_d_id}/compliance-notices"
              payload: { notice_type: "RENEWAL_REMINDER" }
              as: PlatformAdmin
              captures: { cn_d_id: "$.data[0].id" }
            - call: "POST /compliance-notices/${cn_d_id}/send"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${s_d_id}/renewals"
              payload: {}
              as: BillingOperator
            - call: "GET /invoices"
              payload: { subscription_id: "${s_d_id}", status: "OPEN" }
              as: PlatformAdmin
              captures: { inv_d2_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_d2_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att_d1_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_d2_id}", outcome: "SOFT_DECLINE", decline_code: "EXPIRED_CARD" }
              as: BillingOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /invoices/${inv_d2_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att_d2_id: $.data.id }
            - call: "POST /payment-methods/${pm_d_id}/updater-result"
              payload: { outcome: "UNAVAILABLE" }
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_d2_id}", outcome: "SOFT_DECLINE", decline_code: "EXPIRED_CARD" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /invoices/${inv_d2_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att_d3_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_d2_id}", outcome: "SOFT_DECLINE", decline_code: "EXPIRED_CARD" }
              as: BillingOperator
          assert:
            - "DunningAttempt.${att_d1_id}.attempt_number == 1"
            - "DunningAttempt.${att_d1_id}.scheduled_at == 2026-02-07T00:00:00Z"
            - "DunningAttempt.${att_d1_id}.backoff_days_applied == 0"
            - "DunningAttempt.${att_d1_id}.previous_attempt_id == null"
            - "DunningAttempt.${att_d2_id}.attempt_number == 2"
            - "DunningAttempt.${att_d2_id}.previous_attempt_id == ${att_d1_id}"
            - "DunningAttempt.${att_d2_id}.backoff_days_applied == 2"
            - "DunningAttempt.${att_d2_id}.scheduled_at == 2026-02-09T00:00:00Z"
            - "DunningAttempt.${att_d2_id}.grace_clamped == false"
            - "DunningAttempt.${att_d2_id}.is_final == false"
            - "PaymentMethod.${pm_d_id}.status == EXPIRED"
            - "PaymentMethod.${pm_d_id}.updater_status == UNAVAILABLE"
            - "DunningAttempt.${att_d3_id}.attempt_number == 3"
            - "DunningAttempt.${att_d3_id}.backoff_days_applied == 4"
