              as: PayrollProcessor
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_a}", referral_id: "${ref_a}", case_type: "RESUME_FARM" }
              as: TalentAdmin
              as_user_id: "ta-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /erp/abuse-cases/${case_id}/confirm"
              payload: { resolution_note: "confirmed farm" }
              as: ComplianceOfficer
              as_user_id: "co-9"
            - call: "GET /erp/payroll-batches/${batch_id}"
              as: PayrollProcessor
              captures: { btot: $.data.total_gross_cents, bcnt: $.data.milestone_count, bver: $.data.version }
            - call: "GET /erp/employees/${emp_a}"
              as: ComplianceOfficer
              captures: { strikes: $.data.fraud_strikes, risk: $.data.risk_score }
          assert:
            - "AbuseCase.${case_id}.status == CONFIRMED"
            - "Referral.${ref_a}.status == FORFEITED with last_decision_reason == ABUSE_CONFIRMED (link 1)"
            - "BonusMilestone.${ms_hire}.status == FORFEITED and payroll_batch_id == null (link 2)"
            - "PayrollBatch.total_gross_cents == 0 and milestone_count == 0 (link 3)"
            - "PayrollBatch.version == 3 (create=1, add=2, cascade detach=3)"
            - "Employee.fraud_strikes == 1 and risk_score == 50 (RESUME_FARM weight, no decay at t0)"
            - "RETENTION milestone (PENDING) also FORFEITED"
  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referential_on_submit
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_REQUISITION_NOT_OPEN]
          - errors[ERR_CANDIDATE_IN_COOLDOWN]
        distinguishing_aspect: |
          Category pair (state vs business_referential): one request violates
          both the requisition-OPEN state rule and the candidate-cooldown
          referential rule; the state-category error
          (ERR_REQUISITION_NOT_OPEN) must win because priority 8 < 13.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible referrer"
            - "Candidate with prior_application_at 2026-03-01T00:00:00Z (cooldown_until 2026-09-01, in cooldown at default clock)"
            - "Requisition OPEN then PAUSED"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/candidates"
              payload: { full_name: "Cool Cand", email: "cool@x.com", prior_application_at: "2026-03-01T00:00:00Z" }
              as: TalentAdmin
              captures: { cand_id: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/job-requisitions/${req_id}/pause"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_id: "${cand_id}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REQUISITION_NOT_OPEN (state priority 8 beats business_referential priority 13)"
            - "No referral row is created (GET /erp/referrals?candidate_id=${cand_id} returns empty list)"

      - name: safety_beats_constraint_on_submit
        grounds:
          - validations[priority=11]
          - validations[priority=16]
          - errors[ERR_REFERRER_SUSPENDED]
          - errors[ERR_REFERRER_INELIGIBLE_TENURE]
        distinguishing_aspect: |
          Category pair (business_safety vs business_constraint): the referrer
          is both abuse-suspended (risk 105 >= 100) and tenure-ineligible
          (31 days < 90); the safety error (ERR_REFERRER_SUSPENDED) must win
          because priority 11 < 16.
        test_recipe:
          setup:
            - "Default policy ACTIVE; OPEN IC requisition"
            - "Referrer hired 2026-07-01 (tenure 31 < 90) with three CONFIRMED abuse cases (RESUME_FARM 50 + DUPLICATE_RING 35 + MANUAL 20 = risk 105 >= 100 -> suspended)"
            - "Fresh candidate email"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E102", full_name: "Shady S", email: "shady@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_s: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_s}", case_type: "RESUME_FARM" }
              as: TalentAdmin
              as_user_id: "ta-1"
              captures: { case_1: $.data.id }
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_s}", case_type: "DUPLICATE_RING" }
              as: TalentAdmin
              as_user_id: "ta-1"
              captures: { case_2: $.data.id }
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_s}", case_type: "MANUAL" }
              as: TalentAdmin
              as_user_id: "ta-1"
              captures: { case_3: $.data.id }
            - call: "POST /erp/abuse-cases/${case_1}/confirm"
              as: ComplianceOfficer
              as_user_id: "co-9"
            - call: "POST /erp/abuse-cases/${case_2}/confirm"
              as: ComplianceOfficer
              as_user_id: "co-9"
            - call: "POST /erp/abuse-cases/${case_3}/confirm"
              as: ComplianceOfficer
              as_user_id: "co-9"
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_s}", job_requisition_id: "${req_id}", candidate_email: "fresh@x.com", candidate_full_name: "Fresh F" }
              as: Employee
              as_user_id: "${emp_s}"
              captures: { err: $.data.error_id }
          assert:
            - "Employee.${emp_s}.risk_score == 105 and referral_suspended == true"
            - "error_id == ERR_REFERRER_SUSPENDED (business_safety priority 11 beats business_constraint priority 16)"
            - "No referral row is created"
  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tenure_exactly_min_days
        grounds:
          - calculations.tenure_days
          - validations[priority=16]
        distinguishing_aspect: |
          Metric: tenure in whole days at POST /erp/referrals. Hire date
          2026-05-03 yields tenure exactly 90 at the default clock (>= passes);
          2026-05-04 yields 89 (fails). One calendar day flips the outcome.
        test_recipe:
          setup:
            - "Default policy ACTIVE (min_tenure_days 90); OPEN IC requisition"
            - "Employee E90 hired 2026-05-03T00:00:00Z; employee E89 hired 2026-05-04T00:00:00Z"
            - "Logical clock at the startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E190", full_name: "Nine Ty", email: "e90@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_90: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E189", full_name: "Eight Nine", email: "e89@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-05-04T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_89: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC", openings: 5 }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_90}", job_requisition_id: "${req_id}", candidate_email: "c90@x.com", candidate_full_name: "C Ninety" }
              as: Employee
              as_user_id: "${emp_90}"
              captures: { ref_ok: $.data.id, st: $.data.status }
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_89}", job_requisition_id: "${req_id}", candidate_email: "c89@x.com", candidate_full_name: "C EightyNine" }
              as: Employee
              as_user_id: "${emp_89}"
              captures: { err: $.data.error_id }
          assert:
            - "Employee.${emp_90}.tenure_days == 90 (boundary, >= passes) and referral status == SUBMITTED"
            - "Employee.${emp_89}.tenure_days == 89 and submission rejected with ERR_REFERRER_INELIGIBLE_TENURE"

      - name: campaign_budget_floor_exact_fit
        grounds:
          - calculations.campaign_settlement
          - validations[priority=24]
          - concurrency_rules[campaign-patch-stale-version]
        distinguishing_aspect: |
          Metric: budget cents at PATCH /erp/campaigns/{id} (distinct endpoint
          and metric from tenure days). New budget exactly equal to
          reserved+spent (200000) is allowed (>= comparison); one cent less
          (199999) is rejected with ERR_CAMPAIGN_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Default policy ACTIVE; SENIOR requisition with ACTIVE campaign (multiplier 15000, flat 50000, budget 500000)"
            - "One referral submitted reserving the full 200000 uplift (spent 0)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "floor test", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "PATCH /erp/campaigns/${camp_id}"
              payload: { expected_campaign_version: "${camp_v1}", budget_cents: 200000 }
              as: TalentAdmin
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { camp_v2: $.data.version, budget_now: $.data.budget_cents }
            - call: "PATCH /erp/campaigns/${camp_id}"
              payload: { expected_campaign_version: "${camp_v2}", budget_cents: 199999 }
              as: TalentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "budget_cents == 200000 accepted: exactly reserved_cents (200000) + spent_cents (0) — >= boundary inclusive"
            - "budget_cents == 199999 rejected with ERR_CAMPAIGN_BUDGET_EXCEEDED (one cent below the floor)"
            - "Campaign reserved_cents remains 200000 throughout"

      - name: cooldown_boundary_exact_months
        grounds:
          - calculations.candidate_cooldown
          - validations[priority=13]
        distinguishing_aspect: |
          Metric: calendar-month cooldown window at POST /erp/referrals
          (distinct from tenure days and budget cents). A prior outcome exactly
          6 months before the default clock (2026-02-01 -> 2026-08-01) is NOT
          blocked (strict now < cooldown_until); one second earlier is blocked.
        test_recipe:
          setup:
            - "Default policy ACTIVE (duplicate_cooldown_months 6); eligible referrer; OPEN IC requisition"
            - "Candidate with prior_application_at 2026-02-01T00:00:00Z -> cooldown_until 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/candidates"
              payload: { full_name: "Cool Cand", email: "cool@x.com", prior_application_at: "2026-02-01T00:00:00Z" }
              as: TalentAdmin
              captures: { cand_id: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_id: "${cand_id}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_ok: $.data.id, st: $.data.status }
            - call: "POST /erp/referrals/${ref_ok}/withdraw"
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /erp/candidates"
              payload: { full_name: "Cool Cand 2", email: "cool2@x.com", prior_application_at: "2026-02-01T00:00:00Z" }
              as: TalentAdmin
              captures: { cand_2: $.data.id }
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_id: "${cand_2}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
          assert:
            - "At now == cooldown_until (2026-08-01T00:00:00Z) the referral is accepted (strict inequality: now < cooldown_until blocks)"
            - "At now == 2026-07-31T23:59:59Z (one second before cooldown_until) the referral is rejected with ERR_CANDIDATE_IN_COOLDOWN"
  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: referral_submit_gated_by_requisition_state
        grounds:
          - state_machines.JobRequisition.OPEN_to_PAUSED
          - validations[priority=8]
        distinguishing_aspect: |
          Pair Referral -> JobRequisition: the Referral creation transition
          exists only while the linked JobRequisition is OPEN; DRAFT and
          PAUSED requisitions reject with ERR_REQUISITION_NOT_OPEN and resume
          re-enables creation.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible referrer; requisition left in DRAFT, and a second opened then paused"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-D-1", title: "Draft role", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_draft: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-P-1", title: "Paused role", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_paused: $.data.id }
            - call: "POST /erp/job-requisitions/${req_paused}/open"
              as: TalentAdmin
            - call: "POST /erp/job-requisitions/${req_paused}/pause"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_draft}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err1: $.data.error_id }
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_paused}", candidate_email: "c2@x.com", candidate_full_name: "C Two" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err2: $.data.error_id }
            - call: "POST /erp/job-requisitions/${req_paused}/resume"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_paused}", candidate_email: "c2@x.com", candidate_full_name: "C Two" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_ok: $.data.id, st: $.data.status }
          assert:
            - "DRAFT requisition: ERR_REQUISITION_NOT_OPEN"
            - "PAUSED requisition: ERR_REQUISITION_NOT_OPEN"
            - "After resume: submission succeeds, Referral status == SUBMITTED"

      - name: milestone_approve_gated_by_tax_profile_state
        grounds:
          - state_machines.TaxProfile.SUBMITTED_to_VERIFIED
          - validations[priority=26]
          - state_machines.BonusMilestone.EARNED_to_APPROVED
        distinguishing_aspect: |
          Pair BonusMilestone -> TaxProfile (distinct from Referral ->
          JobRequisition): the EARNED -> APPROVED transition is gated on a
          different entity's state — the referrer's TaxProfile must be
          VERIFIED; missing profile and merely SUBMITTED profile both reject.
        test_recipe:
          setup:
            - "Default policy ACTIVE; IC referral hired; HIRE milestone 45000 EARNED; referrer has NO tax profile yet"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_a}", kind: "HIRE" }
              as: PayrollProcessor
              captures: { ms_hire: "$.data[0].id" }
          trigger:
            - call: "POST /erp/milestones/${ms_hire}/approve"
              as: PayrollProcessor
              captures: { err1: $.data.error_id }
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/milestones/${ms_hire}/approve"
              as: PayrollProcessor
              captures: { err2: $.data.error_id }
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/milestones/${ms_hire}/approve"
              as: PayrollProcessor
              captures: { ms_status: $.data.status, wh: $.data.withholding_cents }
          assert:
            - "Missing profile: ERR_TAX_PROFILE_NOT_VERIFIED"
            - "SUBMITTED (unverified) profile: ERR_TAX_PROFILE_NOT_VERIFIED again"
            - "After verify: approve succeeds, status == APPROVED, withholding_cents == 9900 (FLAT on 45000)"

      - name: campaign_activation_gated_by_policy_state
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - validations[priority=19]
          - errors[ERR_NO_ACTIVE_POLICY]
        distinguishing_aspect: |
          Pair Campaign -> PolicyVersion (distinct from both other instances):
          Campaign DRAFT -> ACTIVE requires some PolicyVersion to be ACTIVE;
          with no active policy the activation fails, and it succeeds once a
          policy is activated.
        test_recipe:
          setup:
            - "No policy versions exist at all; one DRAFT campaign on an OPEN requisition"
          setup_api_calls:
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "gated", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
              captures: { err: $.data.error_id }
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
              captures: { cstatus: $.data.status }
          assert:
            - "Without an ACTIVE policy: ERR_NO_ACTIVE_POLICY (422)"
            - "After policy activation: campaign status == ACTIVE"
  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: campaign_window_closed_interval_touch_conflicts
        grounds:
          - validations[priority=21]
          - entities.Campaign.fields.window_start
        distinguishing_aspect: |
          CLOSED interval semantics on the Campaign resource: an existing
          window [2026-08-01, 2026-08-31] conflicts with a touching successor
          [2026-08-31, 2026-09-30] because both endpoints are inclusive; a
          strictly later window [2026-09-01, ...] is accepted.
        test_recipe:
          setup:
            - "OPEN SENIOR requisition; campaign C1 on it with window [2026-08-01, 2026-08-31] (DRAFT state still blocks overlap)"
          setup_api_calls:
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "C1", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_1: $.data.id }
          trigger:
            - call: "POST /erp/campaigns"
              payload: { name: "C2 touching", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-08-31T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { err: $.data.error_id }
            - call: "POST /erp/campaigns"
              payload: { name: "C3 disjoint", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_3: $.data.id, st: $.data.status }
          assert:
            - "Touching window [2026-08-31, 2026-09-30] rejected with ERR_CAMPAIGN_WINDOW_CONFLICT (closed intervals share the endpoint 2026-08-31)"
            - "Disjoint window [2026-09-01, 2026-09-30] accepted with status DRAFT"
            - "Different-requisition windows never conflict (checked implicitly: C1/C3 share the requisition)"

      - name: policy_window_halfopen_touch_allowed
        grounds:
          - validations[priority=20]
          - entities.PolicyVersion.fields.effective_from
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the PolicyVersion resource (different
          resource and different adjacency rule than campaigns):
          [2026-01-01, 2026-08-01) and [2026-08-01, inf) touch but do NOT
          overlap; an interior-starting window (2026-07-31) does overlap and
          is rejected.
        test_recipe:
          setup:
            - "Policy P1 created with [2026-01-01, 2026-08-01) — DRAFT policies still block overlap"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_1: $.data.id }
          trigger:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_2: $.data.id, st: $.data.status }
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-07-31T00:00:00Z" }
              as: TalentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "P2 starting exactly at P1's effective_to is accepted (half-open: 2026-08-01 not in P1's window), status DRAFT"
            - "P3 starting 2026-07-31 rejected with ERR_POLICY_WINDOW_CONFLICT (overlaps P1's window interior)"
  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: campaign_budget_conservation_through_lifecycle
        grounds:
          - calculations.campaign_settlement
          - entities.Campaign.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity: campaign budget cents. Across the full
          forward+compensating cycle (reserve -> hire conversion -> retention
          conversion -> abuse forfeiture release) the invariant
          reserved + spent + remaining == budget (200000) holds at every
          checkpoint, ending fully restored (0/0/200000) after forfeiture.
        test_recipe:
          setup:
            - "Default policy ACTIVE; SENIOR requisition with ACTIVE campaign (multiplier 15000, flat 50000, budget 200000)"
            - "Referral submitted (reserve), hired (hire share converted), retention earned via sweep (full spend -> EXHAUSTED), then abuse-confirmed (forfeiture releases everything)"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "conserve", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2027-06-30T00:00:00Z", budget_cents: 200000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { r1: $.data.reserved_cents, s1: $.data.spent_cents, m1: $.data.remaining_cents }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_a}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { r2: $.data.reserved_cents, s2: $.data.spent_cents, m2: $.data.remaining_cents }
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { r3: $.data.reserved_cents, s3: $.data.spent_cents, m3: $.data.remaining_cents, st3: $.data.status }
          trigger:
            - call: "POST /erp/abuse-cases"
              payload: { employee_id: "${emp_a}", referral_id: "${ref_a}", case_type: "MANUAL" }
              as: TalentAdmin
              as_user_id: "ta-1"
