  # EXCLUDED — corners already covered by §1.8 difficulty instances (stubs)
  # =========================================================================
  - section: calculations
    instances:
      - name: entry_provisional_vs_final_variant_divergence_stub
        claim_type: Variant Divergence
        grounds:
          - calculations.compute_entry_charges
          - entities.CustomsEntry.fields.provisional_total_cents
          - entities.CustomsEntry.fields.final_total_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / entry_provisional_vs_final_charges_diverge_on_unverified_usmca
          rationale: "Provisional 520 vs final 69735 divergence on a CN USMCA-unverified entry is the core assertion of the named §1.8 dual-variant instance."

      - name: duty_round_per_line_then_sum_precision_stub
        claim_type: Precision
        grounds:
          - calculations.compute_line_duty
          - calculations.compute_entry_charges
          - entities.EntryLine.fields.line_duty_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / duty_round_per_line_then_sum_order_pinned
          rationale: "Round-per-line-then-sum precision (132024 vs 132023) is pinned by the named §1.8 combinatorial instance."

      - name: psc_adjustment_zero_when_preference_verified_stub
