  - section: errors
    instances:
      - name: error_envelope_shape_on_domain_error
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors[ERR_DUPLICATE_PLAN_YEAR_LABEL]
        distinguishing_aspect: "Every failure returns the SAME envelope: a data object carrying exactly error_id and a non-empty human message, with the catalogued HTTP status on the response. There is no partially-populated entity body and no top-level error string alongside the envelope."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; one PlanYear labelled PY2027."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "response HTTP status == 409 with ${err} == \"ERR_DUPLICATE_PLAN_YEAR_LABEL\" and ${msg} a non-empty string"
            - "the response data object carries no id, no plan_year_label and no version field"

      - name: missing_x_user_id_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked before everything else, including on read endpoints: an empty X-User-ID returns 401 ERR_UNAUTHENTICATED rather than 403 ERR_FORBIDDEN_ROLE (priority 2) even when the X-Role header is valid, and rather than 400 for an otherwise malformed request."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; one PlanYear labelled PY2027."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          trigger:
            - call: "GET /compliance/plan-years/${py}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: ""
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 401 and ${err} == \"ERR_UNAUTHENTICATED\""
            - "the same GET with a non-empty X-User-ID returns HTTP 200 with data.plan_year_label == \"PY2027\""

      - name: unknown_plan_year_on_action_endpoint_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_PLAN_YEAR_NOT_FOUND]
        distinguishing_aspect: "Path existence (priority 3) is resolved before any business precondition: activating a non-existent plan year returns 404 ERR_PLAN_YEAR_NOT_FOUND, not the 409 ERR_TPA_CONTRACT_REQUIRED that the same endpoint raises at priority 18 when the row does exist without a TPA contract."
        test_recipe:
          setup:
            - "Clock at 2027-01-02T09:00:00Z; no plan years."
