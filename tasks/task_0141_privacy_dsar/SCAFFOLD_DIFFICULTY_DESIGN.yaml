              as: FulfillmentWorker
              captures: { item_state: $.data.state }
          assert:
            - "FulfillmentItem.${item_id}.state == COMPLETED"
            - "ConsentRecord.${consent_id}.state == WITHDRAWN"
            - "ConsentRecord.${consent_id}.withdrawn_at != null"

      - name: clock_advance_expires_request_decrements_open_count
        grounds:
          - state_machines.DsarRequest.DISCOVERY_to_CLOSED_EXPIRED
          - entities.Controller.fields.open_request_count
          - entities.DsarRequest.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (clock advance, not item dispatch): advancing
          SystemClock past deadline_at flips the DsarRequest to CLOSED_EXPIRED (hop 1) which recomputes
          the owning Controller.open_request_count downward (hop 2).
        test_recipe:
          setup:
            - "A GDPR request in DISCOVERY with deadline_at 2026-02-04T09:00:00Z; controller open_request_count is 1."
          setup_api_calls:
            - call: "POST /controllers"
