            - "GET /liability-assessments/${la_id} reports review_status == \"REQUESTED\" and collection_status == \"NOT_YET_DUE\"."
            - "One second later the second filing returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_REVIEW_REQUEST\", because the first request already occupies the review dimension; the window check at priority 11 is reached only when no request exists."
            - "Repeating the same experiment on a second assessment whose only request attempt happens at 2026-10-30T00:00:01Z returns HTTP 409 with data.error_id == \"ERR_REVIEW_WINDOW_CLOSED\"."

      - name: registering_a_second_employer_with_a_duplicate_ein_is_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_DUPLICATE_EIN]"
          - "entities.Employer.fields.ein"
        distinguishing_aspect: |
          EIN uniqueness is global rather than plan-scoped, which is the deliberately
          counter-intuitive half: a controlled-group member that contributes to two funds
          is still one legal entity with one EIN. A server that scopes the index to
          plan_id accepts the second registration.
        test_recipe:
          setup:
            - "Two plans, one controlled group and one employer with EIN 410000101 registered under the first plan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /plans"
              payload: { name: "Bakery Workers Retirement Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan2_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
          trigger:
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors of Ohio LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan2_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err_cross_plan: "$.data.error_id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Rebar Services LLC", ein: "410000102", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp2_id: "$.data.id", emp2_v1: "$.data.version" }
          assert:
            - "Same EIN under the same plan: HTTP 409 with data.error_id == \"ERR_DUPLICATE_EIN\"."
            - "Same EIN under a DIFFERENT plan: HTTP 409 with data.error_id == \"ERR_DUPLICATE_EIN\" as well - the constraint is global."
            - "A distinct EIN: HTTP 201 with data.version == 1, data.status == \"CONTRIBUTING\" and data.outstanding_liability_cents == 0."
            - "GET /employers?plan_id=${plan_id} returns total_count == 2 and GET /plans/${plan_id} reports employer_count == 2."

      - name: an_interest_rate_challenge_without_a_proposed_rate_is_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.ReviewRequest.fields.proposed_interest_rate_bps"
        distinguishing_aspect: |
          The rule is 'present exactly when', so it must fire in BOTH directions: a rate
          challenge with no proposed rate, and a non-rate challenge that carries one
          anyway. An implementation that only checks the missing direction lets a mortality
          challenge smuggle in an interest rate that later drives a regeneration.
        test_recipe:
          setup:
            - "The baseline assessment issued at 2026-08-01, inside the review window."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
