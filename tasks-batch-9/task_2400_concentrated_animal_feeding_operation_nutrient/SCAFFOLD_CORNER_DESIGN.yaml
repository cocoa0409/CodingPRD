        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors.ERR_NO_FIELD_BUDGETS
        excluded_because:
          difficulty_instance: certify_with_zero_field_budgets_is_rejected
          rationale: "That §1.8 boundary instance isolates priority 39 on an operation with sufficient storage days, so the zero-budget edge is already pinned."

  # =====================================================================
  # Endpoints (§1.5)
  # =====================================================================
  - section: endpoints
    instances:
      - name: patching_the_herd_profile_repropagates_storage_days_to_every_structure
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /cafo/operations/{id}
          - calculations.operation_manure_production
          - calculations.storage_days_of_capacity
          - endpoints.GET /cafo/manure-storages
        distinguishing_aspect: |
          The PATCH declares four side effects, and the third one reaches outside the patched row:
          switching to DRY handling with no open lot drops daily production to 7397.26 gal, which
          must rewrite both Operation.design_storage_days and the ManureStorage's own
          days_of_storage_available in the same request.
        test_recipe:
          setup:
            - "Willow Creek Dairy with one empty Lagoon 1 (operating_capacity_gallons 4488300.00, design_storage_days 485 at 9244.65 gal/day)"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
          trigger:
            - call: "PATCH /cafo/operations/${op_id}"
              payload: { county: "Benton", manure_handling: "DRY", open_lot_area_sqft: 0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { patched_days: $.data.design_storage_days }
            - call: "GET /cafo/manure-storages"
              payload: { operation_id: "${op_id}" }
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { listed_days: "$.data[0].days_of_storage_available" }
          assert:
            - "status is 200 and Operation.${op_id}.county == Benton with manure_handling == DRY and open_lot_area_sqft == 0"
            - "Operation.${op_id}.animal_units == 420.00 and size_class == MEDIUM, unchanged because the AU factor does not depend on manure handling"
            - "Operation.${op_id}.design_annual_manure_gallons == 2700000.00 and daily_production_gallons == 7397.26, with the 1.15 dilution factor and the open-lot term both gone"
            - "${patched_days} == 606, recomputed from the unchanged 4488300.00 operating capacity over the new daily volume"
            - "${listed_days} == 606 as well, so the AVAILABLE_BASIS recompute reached the structure row in the same request"
            - "ManureStorage.${st_id}.design_capacity_gallons == 5385960.00 and operating_capacity_gallons == 4488300.00 are untouched by the herd patch"
            - "Operation.${op_id}.version == 2 and the ManureStorage version is still 1"
