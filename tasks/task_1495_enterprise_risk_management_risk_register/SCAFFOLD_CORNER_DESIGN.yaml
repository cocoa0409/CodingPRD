# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enterprise Risk Management & Risk Register
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: category_creation_with_defaults
        claim_type: creation_defaults
        grounds: ["entities.TaxonomyCategory"]
        distinguishing_aspect: "Omitting weight_factor and parent_category_id applies defaults 1.0 and null; response carries system id/created_at/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "RootCat" }, as: RiskManager, captures: { c_id: $.data.id, c_w: $.data.weight_factor } }
          trigger:
            - { call: "GET /categories/${c_id}", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "captured c_w == 1.0"
            - "TaxonomyCategory.${c_id}.parent_category_id is null and version == 1 and current_tolerance_score is null"

      - name: category_parent_not_found_rejected
        claim_type: fk_integrity
        grounds: ["entities.TaxonomyCategory.fields.parent_category_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a category with a non-existent parent_category_id fails with 404 (body FK existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /categories", payload: { name: "Orphan", parent_category_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: RiskManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND, HTTP 404"

      - name: risk_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Risk", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /risks without required title fails with 400 before any state change."
        test_recipe:
          setup: ["one category exists"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "RC" }, as: RiskManager, captures: { cat_id: $.data.id } }
          trigger:
            - { call: "POST /risks", payload: { category_id: "${cat_id}", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST, HTTP 400"

      - name: risk_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Risk"]
        distinguishing_aspect: "Client-supplied id/version/status in the create body are ignored; server mints id, sets version 1, status DRAFT."
        test_recipe:
          setup: ["one category exists"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "SF" }, as: RiskManager, captures: { cat_id: $.data.id } }
          trigger:
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "T", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { rid: $.data.id, rstat: $.data.status, rver: $.data.version } }
          assert:
            - "captured rstat == DRAFT and rver == 1"
            - "Risk.${rid}.residual_score is null and reserved_treatment_cents == 0 and available_treatment_cents == 0"

      - name: control_creation_defaults_max_mapped
        claim_type: creation_defaults
        grounds: ["entities.Control"]
        distinguishing_aspect: "Omitting max_mapped_risks applies default 10; mapped_active_count starts 0; status PROPOSED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /controls", payload: { name: "C-default", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { cid: $.data.id, cmax: $.data.max_mapped_risks, ccount: $.data.mapped_active_count } }
          assert:
            - "captured cmax == 10 and ccount == 0"
            - "Control.${cid}.status == PROPOSED"

      - name: get_risk_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /risks/{id} with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /risks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: InternalAuditor, as_user_id: "user_aud_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND, HTTP 404"

      - name: risk_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /risks with limit=1 returns meta/response_type/data plus pagination fields; has_more true while a second page exists."
        test_recipe:
          setup: ["category with two risks"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "PG" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "P1", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "P2", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "GET /risks?category_id=${cat_id}&limit=1&offset=0", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "response envelope has meta.api_request_id, response_type == array, data length == 1"
            - "total_count == 2 and has_more == true"

      - name: assessment_event_immutability_shape
        claim_type: immutability
        grounds: ["entities.RiskAssessment"]
        distinguishing_aspect: "RiskAssessment has common_fields false: response exposes id and created_at but no version field; no update endpoint exists."
        test_recipe:
          setup: ["category; risk submitted (IDENTIFIED)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "IM" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "IR", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { aid: $.data.id } }
            - { call: "GET /risks/${risk_id}/assessments", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "RiskAssessment.${aid} exposes id and created_at and no version / updated_at fields"
            - "list contains exactly 1 assessment with kind == INHERENT and inherent_score == 6"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: risk_submit_from_identified_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Risk.DRAFT_to_IDENTIFIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-IDENTIFIED risk is rejected; no version increment, no side effects."
        test_recipe:
          setup: ["category; risk IDENTIFIED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "IV" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v_pre: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "captured err == ERR_INVALID_STATE, HTTP 409"
            - "Risk.${risk_id}.version still == captured v_pre"

      - name: residual_assessment_in_identified_returns_kind_not_allowed
        claim_type: precondition_enforcement
        grounds: ["state_machines.Risk", "errors[ERR_ASSESSMENT_KIND_NOT_ALLOWED]"]
        distinguishing_aspect: "RESIDUAL assessment requires an inherent base; on an IDENTIFIED risk it fails with ERR_ASSESSMENT_KIND_NOT_ALLOWED (state-category error distinct from ERR_INVALID_STATE)."
        test_recipe:
          setup: ["category; risk IDENTIFIED (no INHERENT yet)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "KA" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ASSESSMENT_KIND_NOT_ALLOWED, HTTP 409"

      - name: control_retired_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Control"]
        distinguishing_aspect: "From RETIRED, activate/review/attest are all rejected; the machine is terminally locked."
        test_recipe:
          setup: ["control ACTIVE then RETIRED"]
          setup_api_calls:
            - { call: "POST /controls", payload: { name: "TC", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl_id: $.data.id } }
            - { call: "POST /controls/${ctl_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /controls/${ctl_id}/retire", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
          trigger:
            - { call: "POST /controls/${ctl_id}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE, HTTP 409"
            - "Control.${ctl_id}.status remains RETIRED"

      - name: plan_overdue_sweep_and_extend_cycle
        claim_type: valid_transition
        grounds: ["state_machines.TreatmentPlan.IN_PROGRESS_to_OVERDUE", "state_machines.TreatmentPlan.OVERDUE_to_IN_PROGRESS"]
        distinguishing_aspect: "Clock advance past due_date flips IN_PROGRESS -> OVERDUE (system transition observable on read); extend with a future date returns it to IN_PROGRESS and increments extension_count — the overdue loop."
        test_recipe:
          setup:
            - "category; risk ASSESSED with residual assessed; plan approved and started (IN_PROGRESS) with due_date 2026-08-10"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "OD" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 100000, due_date: "2026-08-10T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/start", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /treatment-plans/${plan_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { st1: $.data.status } }
            - { call: "POST /treatment-plans/${plan_id}/extend", payload: { new_due_date: "2026-09-30T00:00:00Z" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /treatment-plans/${plan_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "captured st1 == OVERDUE (clock sweep applied)"
            - "After extend: TreatmentPlan.${plan_id}.status == IN_PROGRESS and extension_count == 1 and due_date == 2026-09-30T00:00:00Z"

      - name: plan_extension_limit_fourth_extension_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.TreatmentPlan.OVERDUE_to_IN_PROGRESS", "errors[ERR_PLAN_EXTENSION_LIMIT]"]
        distinguishing_aspect: "extension_count caps at 3; the fourth overdue cycle's extend attempt fails with ERR_PLAN_EXTENSION_LIMIT."
        test_recipe:
          setup:
            - "IN_PROGRESS plan with due 2026-08-05; clock advanced to trigger overdue; extended three times already (each time due pushed a few days, clock advanced past it again)"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "EL" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 50000, due_date: "2026-08-05T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/start", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/extend", payload: { new_due_date: "2026-08-10T00:00:00Z" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/extend", payload: { new_due_date: "2026-08-15T00:00:00Z" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/extend", payload: { new_due_date: "2026-08-20T00:00:00Z" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /treatment-plans/${plan_id}/extend", payload: { new_due_date: "2026-09-01T00:00:00Z" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_PLAN_EXTENSION_LIMIT, HTTP 409"
            - "TreatmentPlan.${plan_id}.extension_count == 3 and status == OVERDUE"

      - name: breach_accepted_reopens_after_review_by
        claim_type: valid_transition
        grounds: ["state_machines.ToleranceBreach.ACCEPTED_to_OPEN"]
        distinguishing_aspect: "ACCEPTED is time-boxed: advancing the logical clock to review_by sweeps the breach back to OPEN (cyclic escalation loop)."
        test_recipe:
          setup:
            - "category with APPROVED appetite tolerance 5 cap 20; risk inherent 20, no controls, RESIDUAL assessed -> residual 20 >= 5 -> breach OPEN; breach acknowledged then accepted with review_by 2026-08-20"
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "BR" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 5, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskOwner, as_user_id: "user_owner_1", captures: { bid: "$.data[0].id" } }
            - { call: "POST /tolerance-breaches/${bid}/acknowledge", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /tolerance-breaches/${bid}/accept", payload: { rationale: "board waiver", review_by: "2026-08-20T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /tolerance-breaches/${bid}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "ToleranceBreach.${bid}.status == OPEN (clock == review_by triggers re-open: inclusive)"

      - name: emerging_promote_creates_linked_risk
        claim_type: side_effect_execution
        grounds: ["state_machines.EmergingRisk.VALIDATED_to_PROMOTED"]
        distinguishing_aspect: "Promotion's cascade creates a DRAFT Risk with source_emerging_risk_id set; the new risk is discoverable only via GET /emerging-risks/{id}/risks."
        test_recipe:
          setup: ["category; emerging risk VALIDATED with scenario 4x3 stress 1.0 (score 12)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "EM" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /emerging-risks", payload: { category_id: "${cat_id}", title: "AI regulation shock", scenario_severity: 4, scenario_probability: 3 }, as: RiskManager, as_user_id: "user_rm_1", captures: { er_id: $.data.id, er_score: $.data.scenario_score } }
            - { call: "POST /emerging-risks/${er_id}/validate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /emerging-risks/${er_id}/promote", payload: { owner_user_id: "user_owner_1" }, as: RiskManager, as_user_id: "user_rm_1", captures: { new_risk_id: $.data.id, new_risk_status: $.data.status } }
            - { call: "GET /emerging-risks/${er_id}/risks", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "captured er_score == 12"
            - "captured new_risk_status == DRAFT"
            - "GET /emerging-risks/${er_id}/risks returns exactly 1 risk whose id == ${new_risk_id} and source_emerging_risk_id == ${er_id}"

      - name: report_draft_superseded_by_new_overlapping_draft
        claim_type: side_effect_execution
        grounds: ["state_machines.RiskReport.DRAFT_to_CANCELLED"]
        distinguishing_aspect: "Creating a second DRAFT whose closed period overlaps an existing DRAFT auto-cancels the older DRAFT; both reports remain readable."
        test_recipe:
          setup: ["one DRAFT report for [2026-08-01, 2026-08-31]"]
          setup_api_calls:
            - { call: "POST /reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", variant: "PROVISIONAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep_old: $.data.id } }
          trigger:
            - { call: "POST /reports", payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep_new: $.data.id } }
            - { call: "GET /reports/${rep_old}", as: BoardReporter, as_user_id: "user_br_1", captures: { old_status: $.data.status } }
          assert:
            - "captured old_status == CANCELLED"
            - "RiskReport.${rep_new}.status == DRAFT"

      - name: risk_close_blocked_by_active_plan
        claim_type: precondition_enforcement
        grounds: ["state_machines.Risk.ASSESSED_to_CLOSED", "errors[ERR_ACTIVE_PLAN_BLOCKING]"]
        distinguishing_aspect: "Close is rejected while a PROPOSED plan exists on the risk, even though the risk's own state (ASSESSED) otherwise allows closing."
        test_recipe:
          setup: ["category; risk ASSESSED with a PROPOSED plan"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CB" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 10000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /risks/${risk_id}/close", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ACTIVE_PLAN_BLOCKING, HTTP 409"
            - "Risk.${risk_id}.status remains ASSESSED"

      - name: mapping_approve_bumps_risk_version
        claim_type: side_effect_execution
        grounds: ["state_machines.RiskControlMapping.PROPOSED_to_ACTIVE"]
        distinguishing_aspect: "The approve cascade mutates the parent Risk (residual recompute): Risk.version increments by exactly 1 even though the call targeted the mapping."
        test_recipe:
          setup: ["category; risk ASSESSED; control ACTIVE; mapping PROPOSED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "MV" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
            - { call: "POST /controls/${ctl}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mid: $.data.id } }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v_pre: $.data.version } }
          trigger:
            - { call: "POST /control-mappings/${mid}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "Risk.${risk_id}.version == (captured v_pre) + 1"
            - "RiskControlMapping.${mid}.status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: inherent_band_edges_low_medium_high_critical
        claim_type: correct_result
        grounds: ["calculations.inherent_scoring"]
        distinguishing_aspect: "Band edges are inclusive ranges: scores 4/5 (LOW/MEDIUM edge), 9/10 (MEDIUM/HIGH), 15/16 (HIGH/CRITICAL) fall on the pinned side."
        test_recipe:
          setup: ["category; four IDENTIFIED risks"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "Bands" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R45", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r45: $.data.id } }
            - { call: "POST /risks/${r45}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r45}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v45: $.data.version } }
            - { call: "POST /risks/${r45}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v45}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R910", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r910: $.data.id } }
            - { call: "POST /risks/${r910}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r910}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v910: $.data.version } }
            - { call: "POST /risks/${r910}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v910}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R1516", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r1516: $.data.id } }
            - { call: "POST /risks/${r1516}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r1516}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1516: $.data.version } }
            - { call: "POST /risks/${r1516}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 4, expected_risk_version: "${v1516}" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "GET /risks/${r45}", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /risks/${r910}", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /risks/${r1516}", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "Risk.${r45}.inherent_score == 4 and inherent_band == LOW (4 is still LOW)"
            - "Risk.${r910}.inherent_score == 9 and inherent_band == MEDIUM (9 is still MEDIUM)"
            - "Risk.${r1516}.inherent_score == 16 and inherent_band == CRITICAL (16 is CRITICAL)"

      - name: kri_below_direction_evaluation
        claim_type: correct_result
        grounds: ["calculations.kri_breach_evaluation"]
        distinguishing_aspect: "BELOW direction inverts the ladder: value 39 < amber 40 yields AMBER_BREACH; 20 == red 20 is NOT a breach (strict <); 19 < 20 yields RED_BREACH."
        test_recipe:
          setup: ["category; BELOW KRI amber 40 red 20 min interval 0, ACTIVE"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "BLW" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Coverage ratio", direction: "BELOW", amber_threshold: 40, red_threshold: 20, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 39, observed_at: "2026-08-01T01:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { b39: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 20, observed_at: "2026-08-01T02:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { b20: $.data.resulting_breach_status } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 19, observed_at: "2026-08-01T03:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { b19: $.data.resulting_breach_status } }
          assert:
            - "captured b39 == AMBER_BREACH"
            - "captured b20 == NORMAL (equality with red_threshold is not a breach under strict <)"
            - "captured b19 == RED_BREACH"

      - name: treatment_progress_rollup_two_of_three
        claim_type: correct_result
        grounds: ["calculations.treatment_progress_rollup"]
        distinguishing_aspect: "progress_pct = round_half_up(100*done/total, 2): 2 DONE of 3 actions gives exactly 66.67, and 0 actions gives 0.00."
        test_recipe:
          setup: ["category; risk ASSESSED with residual; plan APPROVED then IN_PROGRESS; three actions created"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "TP" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 100000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id, p0: $.data.progress_pct } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/start", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { a1: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a2" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { a2: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a3" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-actions/${a1}/done", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-actions/${a2}/done", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "GET /treatment-plans/${plan_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "captured p0 == 0.00 (no actions at creation)"
            - "TreatmentPlan.${plan_id}.progress_pct == 66.67"

      - name: emerging_scenario_score_with_stress_multiplier
        claim_type: correct_result
        grounds: ["calculations.emerging_scenario_scoring"]
        distinguishing_aspect: "scenario_score = round_half_up(severity*probability*stress_factor, 0): 4*3*1.0 = 12 and 4*3*1.5 = 18; the multiplier lifts the score above the promotion threshold."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "ES" }, as: RiskManager, captures: { cat_id: $.data.id } }
          trigger:
            - { call: "POST /emerging-risks", payload: { category_id: "${cat_id}", title: "E1", scenario_severity: 4, scenario_probability: 3 }, as: RiskManager, as_user_id: "user_rm_1", captures: { s1: $.data.scenario_score } }
            - { call: "POST /emerging-risks", payload: { category_id: "${cat_id}", title: "E2", scenario_severity: 4, scenario_probability: 3, stress_factor: 1.5 }, as: RiskManager, as_user_id: "user_rm_1", captures: { s2: $.data.scenario_score } }
          assert:
            - "captured s1 == 12 (default stress_factor 1.0 applied)"
            - "captured s2 == 18"

      - name: report_empty_register_aggregation_zero
        claim_type: input_set_filtering
        grounds: ["calculations.board_report_aggregation"]
        distinguishing_aspect: "Risks in DRAFT/IDENTIFIED/CLOSED are excluded from the input set: a register whose only risk is DRAFT yields heat_score_total 0.00 and an empty category_breakdown."
        test_recipe:
          setup: ["category with one DRAFT risk only"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "ER0" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "DraftOnly", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", variant: "FINAL" }, as: BoardReporter, as_user_id: "user_br_1", captures: { rep0: $.data.id, h0: $.data.heat_score_total } }
          assert:
            - "captured h0 == 0.0"
            - "RiskReport.${rep0}.category_breakdown is empty and band_counts are all 0"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role is rejected 401 before any other check (auth is priority 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /categories", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED, HTTP 401"
        note: "trigger omits the as: header deliberately; test harness sends no X-User-Role."

      - name: riskowner_cannot_create_category_forbidden
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /categories is exclusive to RiskManager; RiskOwner gets ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /categories", payload: { name: "Nope" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN, HTTP 403"

      - name: assessment_by_non_owner_returns_owner_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_OWNER_MISMATCH]"]
        distinguishing_aspect: "A RiskOwner whose X-User-ID differs from risk.owner_user_id cannot assess the risk (ownership layer, distinct from role denial)."
        test_recipe:
          setup: ["category; risk owned by user_owner_1, IDENTIFIED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "OM" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_2", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_OWNER_MISMATCH, HTTP 403"

      - name: sod_plan_self_approve_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The proposer cannot approve their own plan: approver X-User-ID == proposer_user_id fails segregation of duties even when the role is correct."
        test_recipe:
          setup: ["category; risk ASSESSED; plan created by RiskManager user_rm_1 acting... plan create requires RiskOwner role, so proposer is a RiskOwner; SoD scenario uses a RiskManager who is ALSO the proposer — modeled by making the proposer_user_id equal the approver's X-User-ID via plan creation by RiskOwner with owner user_rm_1? No: proposer_user_id is the creator's X-User-ID. We create the plan as RiskOwner with X-User-ID user_dual (a person holding both duties), then approve as RiskManager with the same X-User-ID user_dual."]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "SOD" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_dual", treatment_budget_cents: 500000 }, as: RiskOwner, as_user_id: "user_dual", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_dual" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_dual", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_dual" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_dual", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "Self plan", budget_cents: 100000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_dual", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_dual", captures: { plan_id: $.data.id } }
          trigger:
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_dual", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_SOD_VIOLATION, HTTP 422 (approver X-User-ID equals proposer_user_id)"

      - name: sod_appetite_creator_cannot_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Same SoD rule on a different endpoint: the RiskManager who created an appetite statement cannot approve it; a second RiskManager can."
        test_recipe:
          setup: ["category; appetite statement created by user_rm_1 (DRAFT)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "SODA" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
          assert:
            - "First approve: captured err == ERR_SOD_VIOLATION, HTTP 422"
            - "Second approve (different user) succeeds: AppetiteStatement.${app_id}.status == APPROVED"

      - name: duplicate_mapping_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_MAPPING_EXISTS]"]
        distinguishing_aspect: "A second PROPOSED/ACTIVE mapping for the same (risk, control) pair is rejected; only after retiring the ACTIVE one may a new mapping be proposed."
        test_recipe:
          setup: ["category; risk ASSESSED; control ACTIVE; one ACTIVE mapping for the pair"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "DM" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
            - { call: "POST /controls/${ctl}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m1: $.data.id } }
            - { call: "POST /control-mappings/${m1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.3 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_MAPPING_EXISTS, HTTP 409"

      - name: control_capacity_exceeded_on_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CONTROL_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "max_mapped_risks 1: approving a second mapping fails with ERR_CONTROL_CAPACITY_EXCEEDED (fiscal/capacity is priority 12, after the control-ACTIVE referential check passes)."
        test_recipe:
          setup: ["category; two ASSESSED risks; control ACTIVE with max_mapped_risks 1; mapping for risk1 ACTIVE; mapping for risk2 PROPOSED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "CAP" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R1", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r1: $.data.id } }
            - { call: "POST /risks/${r1}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r1}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${r1}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R2", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { r2: $.data.id } }
            - { call: "POST /risks/${r2}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${r2}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${r2}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 3, expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C1", effectiveness_pct: 0.5, max_mapped_risks: 1 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
            - { call: "POST /controls/${ctl}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${r1}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m1: $.data.id } }
            - { call: "POST /control-mappings/${m1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /risks/${r2}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.4 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /control-mappings/${m2}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CONTROL_CAPACITY_EXCEEDED, HTTP 422"
            - "RiskControlMapping.${m2}.status remains PROPOSED"

      - name: appetite_retire_without_coverage_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_NO_APPETITE_COVERAGE]"]
        distinguishing_aspect: "Retiring the only APPROVED appetite effective now leaves the category uncovered -> ERR_NO_APPETITE_COVERAGE; with a successor APPROVED and effective, retire succeeds."
        test_recipe:
          setup: ["category with APPROVED appetite A1 [2026-01-01, 2027-01-01); successor A2 [2027-01-01, 2028-01-01) APPROVED only in second scenario branch"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "NAC" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 10, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { a1: $.data.id } }
            - { call: "POST /appetite-statements/${a1}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
          trigger:
            - { call: "POST /appetite-statements/${a1}/retire", payload: {}, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 12, acceptance_cap_score: 22, effective_from: "2026-08-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err2: $.data.error_id } }
          assert:
            - "First retire: captured err == ERR_NO_APPETITE_COVERAGE, HTTP 409"
            - "Follow-up create with window overlapping A1's APPROVED window also fails: captured err2 == ERR_WINDOW_OVERLAP (succession requires retiring first, which requires coverage — the two rules interlock)"

      - name: emerging_promote_below_threshold_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_EMERGING_SCORE_BELOW_THRESHOLD]"]
        distinguishing_aspect: "scenario_score 6 (< 10) without force fails; with force=true and rationale it succeeds."
        test_recipe:
          setup: ["category; emerging risk VALIDATED with severity 2 probability 3 stress 1.0 (score 6)"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "EBT" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /emerging-risks", payload: { category_id: "${cat_id}", title: "Minor trend", scenario_severity: 2, scenario_probability: 3 }, as: RiskManager, as_user_id: "user_rm_1", captures: { er: $.data.id, er_score: $.data.scenario_score } }
            - { call: "POST /emerging-risks/${er}/validate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /emerging-risks/${er}/promote", payload: { owner_user_id: "user_owner_1" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /emerging-risks/${er}/promote", payload: { owner_user_id: "user_owner_1", force: true, rationale: "board directive" }, as: RiskManager, as_user_id: "user_rm_1", captures: { new_risk: $.data.id } }
          assert:
            - "captured er_score == 6"
            - "First promote: captured err == ERR_EMERGING_SCORE_BELOW_THRESHOLD, HTTP 422"
            - "Forced promote succeeds and creates Risk.${new_risk} with status DRAFT"

      - name: kri_observation_gap_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_OBSERVATION_TOO_SOON]"]
        distinguishing_aspect: "Gap rule is inclusive: exactly min_observation_interval_days (7) after the last observation passes; 6 days fails with ERR_OBSERVATION_TOO_SOON."
        test_recipe:
          setup: ["category; ACTIVE KRI min interval 7; first observation at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "GAP" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "Weekly KRI", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 7 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 11, observed_at: "2026-08-07T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 11, observed_at: "2026-08-08T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { ok: $.data.id } }
          assert:
            - "6-day gap: captured err == ERR_OBSERVATION_TOO_SOON, HTTP 409"
            - "exactly-7-day gap: captured ok is a new observation id (gap >= 7 passes)"

      - name: observation_in_future_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_OBSERVATION_IN_FUTURE]"]
        distinguishing_aspect: "observed_at after the current logical clock (default 2026-08-01T00:00:00Z) is rejected 422."
        test_recipe:
          setup: ["category; ACTIVE KRI min interval 0; clock still at default"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "FUT" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "F", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
          trigger:
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-02T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_OBSERVATION_IN_FUTURE, HTTP 422"

      - name: existence_priority_beats_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=7]"]
        distinguishing_aspect: "A transition call on a non-existent risk returns 404 ERR_NOT_FOUND even though the operation would also be an invalid transition — existence (4) beats state (7)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /risks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND, HTTP 404"

      - name: kri_threshold_order_invalid_for_direction
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_THRESHOLD_ORDER_INVALID]"]
        distinguishing_aspect: "ABOVE with amber 80 > red 75 violates the direction-specific ordering; the mirrored BELOW rule (amber must exceed red) is also enforced."
        test_recipe:
          setup: ["category exists"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "THO" }, as: RiskManager, captures: { cat_id: $.data.id } }
          trigger:
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "BadKRI", direction: "ABOVE", amber_threshold: 80, red_threshold: 75 }, as: RiskManager, as_user_id: "user_rm_1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_THRESHOLD_ORDER_INVALID, HTTP 422"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_error_shape
        claim_type: response_envelope
        grounds: ["response_envelope", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Error responses carry meta + response_type=error + data.error_id/message; success responses carry meta + response_type + data."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /categories", payload: {}, as: RiskManager, captures: { err: $.data.error_id } }
          assert:
            - "error envelope: response_type == error, data.error_id == ERR_INVALID_REQUEST, data.message non-empty, meta.api_request_id present"
            - "HTTP 400"

      - name: fk_reverse_reachability_nested_lists
        claim_type: cross_reference_link
        grounds: ["entities.RiskAssessment.fields.risk_id", "entities.RiskControlMapping.fields.control_id", "entities.KRIObservation.fields.kri_id", "entities.TreatmentAction.fields.plan_id"]
        distinguishing_aspect: "Every append-only/junction child is discoverable from its parent: assessments under /risks, mappings under both /risks and /controls, observations under /kris, actions under /treatment-plans."
        test_recipe:
          setup: ["category; risk ASSESSED; control ACTIVE with one ACTIVE mapping; one KRI ACTIVE with one observation; one plan IN_PROGRESS with one action"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "FK" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 2, impact: 2, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /controls", payload: { name: "C", effectiveness_pct: 0.5 }, as: ControlOwner, as_user_id: "user_co_1", captures: { ctl: $.data.id } }
            - { call: "POST /controls/${ctl}/activate", payload: {}, as: ControlOwner, as_user_id: "user_co_1" }
            - { call: "POST /risks/${risk_id}/control-mappings", payload: { control_id: "${ctl}", coverage_weight: 0.5 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { mid: $.data.id } }
            - { call: "POST /control-mappings/${mid}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /kris", payload: { category_id: "${cat_id}", name: "K", direction: "ABOVE", amber_threshold: 50, red_threshold: 75, min_observation_interval_days: 0 }, as: RiskManager, as_user_id: "user_rm_1", captures: { kri_id: $.data.id } }
            - { call: "POST /kris/${kri_id}/activate", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /kris/${kri_id}/observations", payload: { observed_value: 10, observed_at: "2026-08-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 50000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/start", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a1" }, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "GET /risks/${risk_id}/assessments", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /risks/${risk_id}/control-mappings", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /controls/${ctl}/control-mappings", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /kris/${kri_id}/observations", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /treatment-plans/${plan_id}/actions", as: InternalAuditor, as_user_id: "user_aud_1" }
            - { call: "GET /categories/${cat_id}/risks", as: InternalAuditor, as_user_id: "user_aud_1" }
          assert:
            - "assessments list length 2 (INHERENT + RESIDUAL); control-mappings lists under both parents length 1 with same id ${mid}; observations length 1; actions length 1; category risks list contains ${risk_id}"

      - name: plan_complete_requires_all_actions_done
        claim_type: conditional_action
        grounds: ["state_machines.TreatmentPlan.IN_PROGRESS_to_COMPLETED", "errors[ERR_INCOMPLETE_ACTIONS]"]
        distinguishing_aspect: "Completion is conditional on child state: with 1 of 2 actions DONE the complete call fails; after the second done it succeeds and releases the budget reservation."
        test_recipe:
          setup: ["category; risk ASSESSED with residual; plan APPROVED -> IN_PROGRESS; two actions, first DONE"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "PC" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1", treatment_budget_cents: 100000 }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 3, impact: 3, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v3: $.data.version } }
            - { call: "POST /risks/${risk_id}/treatment-plans", payload: { title: "P", budget_cents: 40000, due_date: "2026-12-31T00:00:00Z", owner_user_id: "user_owner_1", expected_risk_version: "${v3}" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { plan_id: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_1" }
            - { call: "POST /treatment-plans/${plan_id}/start", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { a1: $.data.id } }
            - { call: "POST /treatment-plans/${plan_id}/actions", payload: { title: "a2" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { a2: $.data.id } }
            - { call: "POST /treatment-actions/${a1}/done", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /treatment-plans/${plan_id}/complete", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
            - { call: "POST /treatment-actions/${a2}/done", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "POST /treatment-plans/${plan_id}/complete", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1" }
          assert:
            - "First complete: captured err == ERR_INCOMPLETE_ACTIONS, HTTP 409"
            - "After second action done: complete succeeds, TreatmentPlan.${plan_id}.status == COMPLETED"
            - "Risk.${risk_id}.reserved_treatment_cents == 0 (reservation released on completion)"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_open_breach_blocking_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_BREACH_BLOCKING]"]
        excluded_because:
          difficulty_instance: risk_monitor_requires_no_open_breach
          rationale: "Asserted twice (OPEN and ACKNOWLEDGED) inside the named §1.8 instance."

      - name: error_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: appetite_half_open_window_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_report_period_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: report_closed_period_shared_boundary_overlap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_budget_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: plan_approve_state_beats_business_fiscal
          rationale: "The masked fiscal failure is asserted there; a direct budget-only failure is covered by the same instance family. Direct trigger: approve a PROPOSED plan whose budget exceeds available budget (see test-recipe in the §1.8 instance, minus the reject step)."

      - name: error_control_not_active_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTROL_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: mapping_approve_requires_control_active
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: breach_resolution_premature_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_BREACH_RESOLUTION_PREMATURE]"]
        distinguishing_aspect: "Resolve is rejected while residual_score (20) is still >= tolerance (5); only after a control mapping drops residual below tolerance does resolve succeed."
        test_recipe:
          setup: ["category with APPROVED appetite tolerance 5 cap 20; risk inherent 20 residual 20 (no mappings); breach OPEN -> ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /categories", payload: { name: "BPR" }, as: RiskManager, captures: { cat_id: $.data.id } }
            - { call: "POST /appetite-statements", payload: { category_id: "${cat_id}", tolerance_score: 5, acceptance_cap_score: 20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: RiskManager, as_user_id: "user_rm_1", captures: { app_id: $.data.id } }
            - { call: "POST /appetite-statements/${app_id}/approve", payload: {}, as: RiskManager, as_user_id: "user_rm_2" }
            - { call: "POST /risks", payload: { category_id: "${cat_id}", title: "R", owner_user_id: "user_owner_1" }, as: RiskOwner, as_user_id: "user_owner_1", captures: { risk_id: $.data.id } }
            - { call: "POST /risks/${risk_id}/submit", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v1: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "INHERENT", likelihood: 4, impact: 5, expected_risk_version: "${v1}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}", as: RiskOwner, as_user_id: "user_owner_1", captures: { v2: $.data.version } }
            - { call: "POST /risks/${risk_id}/assessments", payload: { kind: "RESIDUAL", expected_risk_version: "${v2}" }, as: RiskOwner, as_user_id: "user_owner_1" }
            - { call: "GET /risks/${risk_id}/tolerance-breaches", as: RiskOwner, as_user_id: "user_owner_1", captures: { bid: "$.data[0].id" } }
            - { call: "POST /tolerance-breaches/${bid}/acknowledge", payload: {}, as: RiskOwner, as_user_id: "user_owner_1" }
          trigger:
            - { call: "POST /tolerance-breaches/${bid}/resolve", payload: {}, as: RiskOwner, as_user_id: "user_owner_1", captures: { err: $.data.error_id } }
          assert:
