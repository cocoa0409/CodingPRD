              captures: { assess_1: $.data.id, lw_1: $.data.liability_warning_version, pinned_1: $.data.pinned_manual_revision_id }
            - call: "POST /repair-program/parts-orders"
              payload: { assessment_id: "${assess_1}", region_code: "US-CA", buyer_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { order_id: $.data.id, ov1: $.data.version, order_rev_no: $.data.pinned_manual_revision_number }
            - call: "POST /repair-program/parts-orders/${order_id}/lines"
              payload: { part_id: "${part_id}", quantity: 1, expected_order_version: "${ov1}" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
          trigger:
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { mv2: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-C3-A"], safety_warning_count: 5, expected_model_version: "${mv2}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { rev_2: $.data.id, rev_2_no: $.data.revision_number }
            - call: "POST /repair-program/manual-revisions/${rev_2}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${rev_2}/review-decision"
              payload: { decision: "APPROVE", review_note: "revised warnings" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${rev_2}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "GET /repair-program/manual-revisions/${rev_1}"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { rev_1_state: $.data.status }
            - call: "POST /repair-program/parts-orders/${order_id}/request-disclosure"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { doc_fee: $.data.documentation_fee_cents, pinned_after: $.data.pinned_manual_revision_number }
            - call: "POST /repair-program/parts-orders/${order_id}/acknowledgments"
              payload: { warranty_impact_class_ack: "WARRANTY_PRESERVED_WITH_LOG", liability_warning_version: "LW-CRX-C3-R2", acknowledged_scope: "FULL_SELF_REPAIR" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/parts-orders/${order_id}/acknowledgments"
              payload: { warranty_impact_class_ack: "WARRANTY_PRESERVED_WITH_LOG", liability_warning_version: "LW-CRX-C3-R1", acknowledged_scope: "FULL_SELF_REPAIR" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { ack_id: $.data.id, ack_rev_no: $.data.manual_revision_number }
            - call: "POST /repair-program/parts-orders/${order_id}/confirm"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { state: $.data.fulfillment_status, pinned_final: $.data.pinned_manual_revision_number }
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-CA", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_9"
              captures: { lw_2: $.data.liability_warning_version, pinned_2: $.data.pinned_manual_revision_id }
          assert:
            - "${lw_1} == LW-CRX-C3-R1, ${pinned_1} == ${rev_1} and ${order_rev_no} == 1"
            - "${rev_2_no} == 2 and ${rev_1_state} == SUPERSEDED"
            - "${doc_fee} == 740 — 500 + 120 * 2 warnings, read from the guide the order is pinned to, not from revision 2's five warnings"
            - "${pinned_after} == 1 — request-disclosure never re-pins"
            - "${e1} == ERR_LIABILITY_WARNING_STALE with HTTP 409 — quoting the newly published R2 does not match the pinned R1"
            - "${ack_id} is created with ${ack_rev_no} == 1"
            - "${state} == CONFIRMED and ${pinned_final} == 1 even though the model's published_disassembly_revision_number is now 2"
            - "${lw_2} == LW-CRX-C3-R2 and ${pinned_2} == ${rev_2} — a fresh assessment pins the current revision"

      - name: safety_restriction_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / part_restriction_cascades_to_compatibility_assessment_and_order_hold"
          rationale: |
            The four-hop chain from POST /part-catalog-items/{part_id}/restrict down
            to the compatibility flag, the REVOKED_BY_SAFETY assessment and the
            BLOCKED_SAFETY_HOLD order is asserted hop by hop there, including the
            conditional hop that spares an already-acknowledged order.

      - name: guide_publication_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / guide_publication_cascades_through_supersession_posture_and_obligation_recovery"
          rationale: |
            Ordering sensitivity of the publication chain — supersession, then
            documentation_posture, then obligation status, then the model rollup —
            is exactly what that instance walks, including the recovery direction.

      - name: core_credit_variants_produce_the_expected_pair_of_results
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / core_credit_provisional_hold_vs_final_settlement_diverge"
          rationale: |
            Both variants of core_return_credit_settlement are computed over one
            data set there and the delta applied to the part ledger on the switch is
            asserted explicitly.

      - name: provider_score_variants_are_selected_by_context
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / provider_compliance_score_rolling_attested_vs_live_recompute_split_bands"
          rationale: |
            Variant selection (the stamped ROLLING_ATTESTED score versus the
            LIVE_RECOMPUTE read) and the resulting access-tier band split are
            asserted there against identical underlying data.

  - section: consistency_model
    instances:
      - name: order_money_fields_are_current_in_the_same_response_that_appends_the_line
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.parts_order_pricing.formula
          - endpoints[POST /repair-program/parts-orders/{order_id}/lines]
        distinguishing_aspect: |
          The whole-order repricing that the append triggers must be observable
          without any intervening call — no deferred job, no recompute-on-read — and
          the documentation fee has to be present before disclosure is ever
          requested.
        test_recipe:
          setup:
            - "Profile US-CA (max_documentation_fee_cents 2000, requires_public_manual false); model CRX-C8 (TIER_A); PUBLISHED part SKU-C8-A at list 1000 with an in-window compatibility row; PUBLISHED guide with 2 safety warnings; consumer order with no lines yet."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-C8", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-C8-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 10 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-C8-A"], safety_warning_count: 2, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { rev_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-CA", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { assessment_id: $.data.id }
            - call: "POST /repair-program/parts-orders"
              payload: { assessment_id: "${assessment_id}", region_code: "US-CA", buyer_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { order_id: $.data.id, ov1: $.data.version, subtotal_0: $.data.parts_subtotal_cents, total_0: $.data.total_due_cents }
          trigger:
            - call: "POST /repair-program/parts-orders/${order_id}/lines"
              payload: { part_id: "${part_id}", quantity: 3, expected_order_version: "${ov1}" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { unit: $.data.unit_price_cents, line_total: $.data.line_total_cents }
            - call: "GET /repair-program/parts-orders/${order_id}"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { subtotal_1: $.data.parts_subtotal_cents, fee_1: $.data.documentation_fee_cents, total_1: $.data.total_due_cents, ov2: $.data.version }
            - call: "GET /repair-program/parts-orders/${order_id}"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { subtotal_2: $.data.parts_subtotal_cents, total_2: $.data.total_due_cents, ov3: $.data.version }
            - call: "POST /repair-program/parts-orders/${order_id}/request-disclosure"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { subtotal_3: $.data.parts_subtotal_cents, total_3: $.data.total_due_cents }
          assert:
            - "${subtotal_0} == 0 and ${total_0} == 0 — an order with no lines carries no money"
            - "${unit} == 1000 and ${line_total} == 3000 in the append's own response"
            - "${subtotal_1} == 3000, ${fee_1} == 740 (500 + 120 * 2) and ${total_1} == 3740 on the very next read"
            - "${subtotal_2} == ${subtotal_1} and ${total_2} == ${total_1} with ${ov3} == ${ov2} — reads are stable and do not mutate"
            - "${subtotal_3} == 3740 - 740 == 3000 and ${total_3} == 3740 — request-disclosure freezes the figures that were already correct"

      - name: parent_rollups_are_current_in_the_same_response_as_the_child_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.model_compliance_posture_rollup.formula
          - entities.ProductModel.fields.open_obligation_count
          - endpoints[POST /repair-program/compliance-obligations]
        distinguishing_aspect: |
          The parent's rollup must already reflect the child that was just created —
          no sweep, no second call — so an implementation that only recomputes
          compliance_posture inside POST /compliance-sweeps fails this on the very
          first read.
        test_recipe:
          setup:
            - "Profiles US-CA and EU-DE; model CRX-C9 with no published parts at all, so any obligation immediately evaluates to BREACHED_PARTS."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "EU-DE", min_parts_availability_years: 10, min_documentation_years: 10, requires_public_manual: true, max_documentation_fee_cents: 0, allows_pairing_restriction: false, self_service_mandate_tier: "MANDATE_FULL" }
              as: ComplianceOfficer
              as_user_id: "u_co_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-C9", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_B_GUIDED" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id, posture_0: $.data.compliance_posture, open_0: $.data.open_obligation_count }
          trigger:
            - call: "POST /repair-program/compliance-obligations"
              payload: { model_id: "${model_id}", region_code: "US-CA" }
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { ob_1: $.data.id, status_1: $.data.status, breach_1: $.data.breach_count }
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { posture_1: $.data.compliance_posture, open_1: $.data.open_obligation_count }
            - call: "POST /repair-program/compliance-obligations"
              payload: { model_id: "${model_id}", region_code: "EU-DE" }
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { ob_2: $.data.id, status_2: $.data.status }
            - call: "GET /repair-program/product-models/${model_id}/compliance-obligations"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { n_obs: $.total_count }
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { posture_2: $.data.compliance_posture, open_2: $.data.open_obligation_count }
          assert:
            - "${posture_0} == OPEN and ${open_0} == 0 for a childless model"
            - "${status_1} == BREACHED_PARTS with ${breach_1} == 1 in the create response itself"
            - "${posture_1} == ORDER_RESTRICTED and ${open_1} == 0 on the immediately following read, with no sweep in between"
            - "${status_2} == BREACHED_PARTS and ${n_obs} == 2 — both children are visible at once"
            - "${posture_2} == ORDER_RESTRICTED and ${open_2} == 0 — neither obligation counts as open"
