              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /storage-bins"
              payload: { bin_code: "B-01", warehouse_zone: "A" }
              as: BillingAdmin
              captures: { bin_id: $.data.id }
            - call: "POST /storage-records"
              payload: { contract_id: "${contract_id}", storage_bin_id: "${bin_id}", stored_from: "2026-01-15T00:00:00Z", stored_until: "2026-10-15T00:00:00Z" }
              as: BillingAdmin
              captures: { sr_id: $.data.id }
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /storage-records/${sr_id}/retrieve"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "StorageRecord.${sr_id}.status == STORED"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_window_halfopen_overlap_rejected
        grounds:
          - validations[priority=11]
          - entities.RouteAssignment.fields.window_start
          - entities.RouteAssignment.fields.window_end
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the RouteDay resource: an adjacent booking [11:00,12:00)
          touching [09:00,11:00) at the endpoint SUCCEEDS (end==start allowed, no buffer), but a genuinely
          overlapping [10:00,12:00) is rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "A route day (max_stops 5) with assignment A at [09:00,11:00) and an adjacent assignment B at [11:00,12:00) both booked; a third bookable job C."
          setup_api_calls:
