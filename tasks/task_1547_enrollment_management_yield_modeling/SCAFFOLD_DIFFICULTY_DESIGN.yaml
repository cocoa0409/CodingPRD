          trigger:
            - call: "POST /enrollment/interventions"
              payload: { application_id: "${app_id}", advisor_id: "advisor-M", intervention_type: "OUTREACH_CALL", window_start_at: "2027-04-10T09:30:00Z", window_end_at: "2027-04-10T10:00:00Z" }
              as: EnrollmentManager
              captures: { err: $.data.error_id }
            - call: "POST /enrollment/interventions"
              payload: { application_id: "${app_id}", advisor_id: "advisor-M", intervention_type: "OUTREACH_CALL", window_start_at: "2027-04-10T09:45:00Z", window_end_at: "2027-04-10T10:15:00Z" }
              as: EnrollmentManager
              captures: { iv2: $.data.id }
          assert:
            - "[09:30, 10:00) rejected with ERR_INTERVENTION_WINDOW_CONFLICT — starts inside the 15-minute post-buffer of the 09:30-ending call"
            - "[09:45, 10:15) accepted (201) — exactly end+15min satisfies the buffer"
            - "advisor-M holds exactly 2 SCHEDULED interventions"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: seat_ledger_deposit_refund_round_trip
        grounds:
          - entities.Program.fields.seats_open
          - state_machines.Application.ADMITTED_to_DEPOSITED
          - state_machines.Application.DEPOSITED_to_WITHDRAWN
          - state_machines.Deposit.PAID_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity = program seat accounting: capacity_seats ==
          deposited_count + enrolled_count + seats_open holds before, during,
          and after a deposit-then-withdraw round trip (deposit +1/-1 seats_open,
          compensating refund restores it exactly); the deposit lands REFUNDED
          with full refund_amount_cents because the withdrawal is at/before the
          deposit deadline.
        test_recipe:
          setup:
            - "Program capacity 2, target 2, deposit 50000; cycle DECISIONS_RELEASED; clock 2027-04-15 (<= deposit_deadline 2027-05-01)"
            - "One ADMITTED application"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "PHI", capacity_seats: 2, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "R T", email: "rt@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1: $.data.id }
            - { call: "POST /enrollment/reviews/${r1}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2: $.data.id }
            - { call: "POST /enrollment/reviews/${r2}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: EnrollmentManager
              captures: { seats_before: $.data.seats_open, dep_before: $.data.deposited_count }
          trigger:
            - call: "POST /enrollment/deposits"
              payload: { application_id: "${app_id}", amount_cents: 50000 }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { dep_id: $.data.id }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: EnrollmentManager
              captures: { seats_mid: $.data.seats_open, dep_mid: $.data.deposited_count }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "WITHDRAWN" }, as: Applicant, as_user_id: "${ap_id}" }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: EnrollmentManager
              captures: { seats_after: $.data.seats_open, dep_after: $.data.deposited_count }
            - call: "GET /enrollment/deposits/${dep_id}"
              payload: {}
              as: EnrollmentManager
              captures: { dep_status: $.data.status, refund_amt: $.data.refund_amount_cents }
          assert:
            - "Before: deposited_count == 0, enrolled_count == 0, seats_open == 2 (0+0+2 == capacity 2)"
            - "Mid: deposited_count == 1, seats_open == 1 (1+0+1 == 2 — invariant holds mid-flight)"
            - "After compensating withdraw: deposited_count == 0, seats_open == 2 — exactly the initial values (${seats_before} == ${seats_after}, ${dep_before} == ${dep_after})"
            - "Deposit ${dep_id}.status == REFUNDED with refund_amount_cents == 50000 (withdrawal at 2027-04-15 <= deadline 2027-05-01)"

      - name: scholarship_ledger_offer_revoke_round_trip
        grounds:
          - entities.Program.fields.scholarship_available_cents
          - entities.Program.fields.scholarship_committed_cents
          - state_machines.AidOffer.OFFERED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = scholarship money (a different conserved
          quantity than seats): scholarship_budget_cents ==
          scholarship_committed_cents + scholarship_available_cents across an
          offer-create / revoke round trip; committed and available return to
          exactly their initial values with zero drift.
        test_recipe:
          setup:
            - "Cycle OPEN; program tuition 5000000, budget 3000000, capacity 5, target 3"
            - "One ADMITTED application (score 96)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "ECO", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 3000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "S L", email: "sl@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 96, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1: $.data.id }
            - { call: "POST /enrollment/reviews/${r1}/submit", payload: { score_academic: 96, score_fit: 96, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2: $.data.id }
            - { call: "POST /enrollment/reviews/${r2}/submit", payload: { score_academic: 96, score_fit: 96, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_v: $.data.version }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { committed_before: $.data.scholarship_committed_cents, available_before: $.data.scholarship_available_cents }
          trigger:
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_id}", fund_type: "MERIT", expected_application_version: "${app_v}" }
              as: FinancialAidOfficer
              captures: { offer_id: $.data.id }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { committed_mid: $.data.scholarship_committed_cents, available_mid: $.data.scholarship_available_cents }
            - { call: "POST /enrollment/aid-offers/${offer_id}/transition", payload: { to_status: "REVOKED" }, as: FinancialAidOfficer }
            - call: "GET /enrollment/programs/${p_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { committed_after: $.data.scholarship_committed_cents, available_after: $.data.scholarship_available_cents }
          assert:
            - "Before: committed == 0, available == 3000000 (0 + 3000000 == budget)"
            - "Mid: committed == 2500000, available == 500000 (2500000 + 500000 == 3000000 — invariant holds mid-flight)"
            - "After revoke: committed == 0, available == 3000000 — exactly initial (${committed_before} == ${committed_after}, ${available_before} == ${available_after})"
            - "AidOffer ${offer_id}.status == REVOKED"
