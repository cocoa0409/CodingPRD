- section: state_machines
  instances:
  - name: recoupment_hold_blocks_pay_until_settled
    claim_type: precondition_enforcement
    grounds:
    - state_machines.ProviderAccount.ACTIVE_to_RECOUPMENT_HOLD
    - state_machines.ProviderAccount.RECOUPMENT_HOLD_to_ACTIVE
    - errors[ERR_PROVIDER_RECOUPMENT_HOLD]
    - errors[ERR_PROVIDER_NOT_ON_HOLD]
    distinguishing_aspect: 'Posture gating: a negative retro delta flips the provider to RECOUPMENT_HOLD, blocking pay on its other approved claim;
      settle-recoupment zeroes the balance and restores ACTIVE (pay then succeeds); settling an ACTIVE account fails ERR_PROVIDER_NOT_ON_HOLD.'
    test_recipe:
      setup:
      - Drug rate 500 from 2026-01-01, policy C50; provider; auth approved 100 mg max 4 (start 2026-07-01)
      - 'Claim A: 2 units 2026-07-15, PAID at 1060; claim B: 2 units 2026-07-15, APPROVED_FOR_PAYMENT (unpaid)'
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J8300
          drug_name: HoldDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
