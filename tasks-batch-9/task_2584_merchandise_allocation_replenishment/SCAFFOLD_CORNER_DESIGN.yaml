            - "Proposing the SKU-2001 run returns 409 ERR_ZERO_NETWORK_NEED, a different code AND a different status: 0103 survives the filter, so rung 30 passes and rung 31 is reached"
            - "The zero-need rejection is arithmetic, not structural: target 5 x 4 = 20 equals pipeline 20 + 0 + 0, so max(0, 20 - 20) = 0 and the network total need is 0"
            - "PATCH weekly_forecast_units 5 -> 8 on ${p3_id} lifts the target to 32 and the need to 12, and the SAME run then proposes successfully with one line of 12 units"
            - "The re-proposed line has size_breakdown == [{S:2},{M:4},{L:4},{XL:2}] and capacity_capped_units == 0 (headroom 48 - 20 = 28 comfortably covers 12)"
            - "AllocationRun.${run1_id} is still DRAFT with units_proposed 0 and no AllocationLine after its rejection - a failed propose creates nothing and does not cancel the run"
            - "All three receipts remain STAGED with units_unallocated equal to units_received - a rejected propose books nothing against the pool"
      - name: receipt_pool_ceiling_fires_from_the_commit_side_and_the_recount_side
        claim_type: error_triggerable
        grounds:
          - validations[priority:35]
          - errors.ERR_RECEIPT_UNITS_EXCEEDED
          - endpoints.POST /allocation/receipts/{receiptId}/adjust
          - calculations.receipt_unit_ledger_invariant
        distinguishing_aspect: |
          The pool ceiling is a single invariant with two attack surfaces, and both must answer the same
          code. Coming from the commit side, a run proposed while the receipt still had 4 spare units is
          committed AFTER a recount removed them, so 4 > 0 and the commit is refused. Coming from the recount
          side, the same rule is read backwards: lowering units_received to 30 when 36 units are already
          booked by a COMMITTED run would make units_unallocated negative, so the adjust is refused. The
          interesting part is what is still allowed - a recount from 60 down to 40 with 36 committed is fine,
          and so is the recount back up - and that a rejected commit leaves the run PROPOSED so the operator
          can fix the receipt and commit the very same run seconds later.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE; store 0101 (capacity 48, presentation minimum 6) needs 26 units and store 0102 (capacity 24, presentation minimum 2) needs 10 - both minima are low enough that the small second commit clears them, so the pool ceiling is the only rule left to fire"
            - "Position 0101 holds 6 units with on_order 4 and forecast 9; position 0102 holds 2 units with forecast 3"
            - "Receipt ASN-R401 arrives with 60 units (S 12 / M 21 / L 18 / XL 9), well above the 36-unit network need"
            - "Run 1 is proposed and committed, booking 26 + 10 = 36 units and leaving units_unallocated 24 with the receipt still ALLOCATING"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 2 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "M", units: 4 }, { size_code: "L", units: 2 }], on_order_units: 4, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "M", units: 1 }, { size_code: "L", units: 1 }], min_units: 8, max_units: 24, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-R401", units_received: 60, size_received: [{ size_code: "S", units: 12 }, { size_code: "M", units: 21 }, { size_code: "L", units: 18 }, { size_code: "XL", units: 9 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
          trigger:
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "POST /allocation/receipts/${rcpt_id}/adjust"
              payload: { units_received: 30, size_received: [{ size_code: "S", units: 6 }, { size_code: "M", units: 11 }, { size_code: "L", units: 9 }, { size_code: "XL", units: 4 }], adjustment_reason: "vendor short-ship recount" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { ex1: $.data.error_id }
            - call: "POST /allocation/receipts/${rcpt_id}/adjust"
              payload: { units_received: 40, size_received: [{ size_code: "S", units: 8 }, { size_code: "M", units: 14 }, { size_code: "L", units: 12 }, { size_code: "XL", units: 6 }], adjustment_reason: "carton recount to 40" }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
              captures: { rcpt_v2: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run2_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run2_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/receipts/${rcpt_id}/adjust"
              payload: { units_received: 36, size_received: [{ size_code: "S", units: 7 }, { size_code: "M", units: 13 }, { size_code: "L", units: 11 }, { size_code: "XL", units: 5 }], adjustment_reason: "second recount to 36" }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run2_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
              captures: { ex2: $.data.error_id }
            - call: "POST /allocation/receipts/${rcpt_id}/adjust"
              payload: { units_received: 40, size_received: [{ size_code: "S", units: 8 }, { size_code: "M", units: 14 }, { size_code: "L", units: 12 }, { size_code: "XL", units: 6 }], adjustment_reason: "final recount back to 40" }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run2_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/programs/${prog_id}"
              payload: {}
              as: PlanningAdmin
          assert:
            - "Run 1 proposes 36 of the 60 units: both lines are need-capped, so unallocated_remainder_units == 24 and after the commit Receipt.units_committed == 36 with units_unallocated == 24"
            - "Recounting the receipt DOWN to 30 returns 409 ERR_RECEIPT_UNITS_EXCEEDED because 36 units are already committed - the recount side of the same rule"
            - "Recounting to 40 succeeds (40 >= 36) and leaves units_committed 36 with units_unallocated 4, so a recount that stays above the booked total is legal"
            - "Run 2, created against the post-recount receipt version, proposes exactly 4 units - the pool, not the need, is the binding constraint (need is still 26 + 10)"
            - "A second recount to 36 succeeds and drives units_unallocated to 0 while run 2 is still PROPOSED with 4 units in hand"
            - "Committing run 2 now returns 409 ERR_RECEIPT_UNITS_EXCEEDED: sum(units_proposed) 4 > units_unallocated 0 - the commit side of the same rule and the same code"
            - "The refused commit is not fatal: AllocationRun.${run2_id} is still PROPOSED with units_proposed 4 and units_allocated 0 on its line"
            - "Recounting back up to 40 restores units_unallocated to 4 and the identical commit then returns 200, taking the receipt to units_committed 40, units_unallocated 0 and status ALLOCATED"
            - "The ledger never drifted through the four recounts and two commit attempts: AllocationProgram.total_units_received == 40, total_units_committed == 40 and open_reserve_units == 0"
      - name: every_forbidden_transition_answers_the_state_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_STATE_TRANSITION
          - validations[priority:8]
        excluded_because:
          difficulty_instance: item_lifecycle_cycles_active_broken_consolidation_pending_active
          rationale: "The item, run, receipt, transfer, promo and action machines are each driven into a forbidden from-state there and in its siblings, with the 409 code asserted per attempt and the entity version proven unchanged afterwards."
      - name: locked_and_closed_programs_answer_the_program_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROGRAM_LOCKED
          - errors.ERR_LINE_ALREADY_SHIPPED
          - validations[priority:9]
        excluded_because:
          difficulty_instance: locked_program_blocks_decisions_but_not_line_ship_or_confirm_receipt
          rationale: "All twelve decision endpoints are refused with ERR_PROGRAM_LOCKED there while ship and confirm-receipt succeed, and the same instance triggers ERR_LINE_ALREADY_SHIPPED on the recall of a run whose first line has already left the DC."
      - name: a_frozen_item_cannot_be_remedied_twice
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ITEM_LIFECYCLE_BLOCKED
          - validations[priority:10]
        excluded_because:
          difficulty_instance: assortment_action_execute_gated_by_the_shared_items_lifecycle_state
          rationale: "Execute is refused there for both frozen lifecycle states - MARKDOWN and CONSOLIDATION_PENDING - on actions that are individually perfectly valid, which is the only interesting way to reach the code."
      - name: the_two_shelf_codes_are_raised_by_the_same_commit
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PRESENTATION_MIN_NOT_MET
          - errors.ERR_FIXTURE_CAPACITY_EXCEEDED
          - validations[priority:13]
          - validations[priority:14]
        excluded_because:
          difficulty_instance: presentation_minimum_safety_beats_fixture_capacity_constraint
          rationale: "A single commit violates both rungs there and must answer the presentation code, after which the capacity code is reached by repairing only the first violation - both codes are triggered, in their declared order."
      - name: store_status_blocks_transfers_at_create_and_dispatch
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STORE_NOT_ELIGIBLE
          - validations[priority:26]
        excluded_because:
          difficulty_instance: transfer_dispatch_and_create_gated_by_the_other_stores_status
          rationale: "Both arms are covered there: a CLOSING store refused as receiver at create time and a receiver that fell out of ACTIVE between approve and dispatch, with the donation direction shown to remain legal."
      - name: a_store_with_stock_on_the_floor_cannot_close
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STORE_HAS_INVENTORY
          - validations[priority:27]
        excluded_because:
          difficulty_instance: store_closed_cascades_position_exit_then_item_lifecycle
          rationale: "The refusal is triggered there on a store holding one unit, and the same instance then empties the position and re-runs the close so the EXITED cascade can be observed - splitting that into two instances would break the before/after pairing."
      - name: fixture_plan_intervals_raise_two_distinct_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FIXTURE_PLAN_OVERLAP
          - errors.ERR_NO_FIXTURE_PLAN_IN_EFFECT
          - validations[priority:22]
          - validations[priority:25]
        excluded_because:
          difficulty_instance: fixture_plan_half_open_intervals_adjacency_versus_intersection
          rationale: "The write-side overlap code and the read-side missing-plan code are both triggered there off one interval algebra dataset, including the adjacency case that must NOT raise the overlap code."
      - name: promo_windows_conflict_only_inside_one_scope_target_and_class
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROMO_WINDOW_CONFLICT
          - validations[priority:23]
        excluded_because:
          difficulty_instance: promo_event_buffered_closed_windows_per_scope_target_and_class
          rationale: "The code is triggered there at the +1 buffer day boundary and deliberately NOT triggered for the same window under a different scope, target store or item_class, which is the whole content of the rule."
      - name: expiry_and_donor_sufficiency_are_separate_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TRANSFER_EXPIRED
          - errors.ERR_INSUFFICIENT_DONOR_UNITS
          - validations[priority:24]
          - validations[priority:33]
        excluded_because:
          difficulty_instance: transfer_expiry_temporal_beats_insufficient_donor_units_fiscal
          rationale: "One approve violates both rules there and must answer the temporal code, and the fiscal code is then reached alone once the clock is rewound - both are triggered, in order, on one dataset."
      - name: the_freight_gate_code_is_reachable_only_at_approve
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BENEFIT_RATIO_BELOW_THRESHOLD
          - validations[priority:34]
        excluded_because:
          difficulty_instance: benefit_ratio_threshold_equality_passes_one_bp_below_fails
          rationale: "The code is triggered there one basis point below the program bar and withheld at exact equality, on a recommendation whose creation was allowed - which is where the create/approve split becomes visible."
  # section 1.6 rbac: four roles, one entity-backed, segregation of duties
  - section: rbac
    instances:
      - name: each_role_cannot_reach_another_roles_exclusive_operation_and_unauthenticated_outranks_forbidden
        claim_type: exclusive_operations
        grounds:
          - roles.PlanningAdmin.exclusive_operations
          - roles.Allocator.exclusive_operations
          - roles.AllocationManager.exclusive_operations
          - roles.StoreOperator.exclusive_operations
          - validations[priority:1]
          - validations[priority:2]
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The four roles partition this surface into four disjoint sets of exclusive operations, and the
          interesting direction is the one an implementation gets wrong: not 'can the owner do it' but 'is
          every OTHER role refused'. The setup role is the trap - PlanningAdmin builds the entire season, so
          a naive implementation that treats it as an administrator will let it propose, lock and commit.
          The same trap runs the other way for AllocationManager, which authorises everything yet may not
          create a single entity, and for Allocator, which may propose a spread it can never commit and may
          create a transfer it can never approve. Every refusal must be 403 ERR_FORBIDDEN_ROLE at rung 2 and
          must mutate nothing, and the two auth rungs must be ordered correctly: a call with NO headers, and
          a call whose X-User-Role is a plausible-but-undeclared 'Auditor', are both 401 ERR_UNAUTHENTICATED
          at rung 1 even though the same call would also fail rung 2. The tail of the test replays three of
          the refused calls under their rightful roles to prove the endpoints themselves work.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with stores 0101 (capacity 48, presentation minimum 6) and 0102 (capacity 24, presentation minimum 2)"
            - "SKU-1001 SEASONAL on TOP-4SZ; position 0101 holds 6 units (M 4 / L 2) with min 12 / max 48 / forecast 9 -> need 9 x 4 - 6 = 30; position 0102 holds 30 units of all four sizes -> need 0"
            - "Receipt ASN-R101 carries 30 units and a DEMAND_DRIVEN / FORWARD_LOOKING run was proposed by Allocator u-alloc-1, producing one line of 30 units for store 0101"
            - "The four roles are PlanningAdmin, Allocator, AllocationManager and StoreOperator; StoreOperator's X-User-ID is a Store id"
            - "The logical clock is 2026-08-01T00:00:00Z"
