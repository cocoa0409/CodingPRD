          - entities.ExitRecord.fields.final_months_posted
        distinguishing_aspect: |
          CH-A is a 4-link chain rooted in ExitRecord: (1) the IP signature
          auto-closes the exit record, (2) the closure completes the appointment,
          (3) the completion posts 12 rank months, decrements the mentor load and
          releases 90780.00 of encumbrance, (4) the absence of any remaining
