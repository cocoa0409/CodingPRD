            - "the alert-settings patch returns 409 with ${e_settings} == ERR_RESIDENT_DEACTIVATED"
            - "the second data control returns 409 with ${e_control} == ERR_RESIDENT_DEACTIVATED"
            - "the read returns 200 with ${r_status} == DEACTIVATED and ${r_optout} == true"
            - "exactly one DataControlAction row exists for ${r1_id} and its id is ${act_id}"

