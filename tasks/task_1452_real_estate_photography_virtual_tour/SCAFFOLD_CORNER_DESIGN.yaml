            - "Second reschedule with the stale captured version: err == ERR_STALE_VERSION, HTTP 412"
            - "ShootBooking.${bk}.scheduled_start_utc == 2026-08-12T14:00:00Z (loser's move not applied) and reschedule_count == 1"

