              as: FrontDesk
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/confirm"
              payload: {}
              as: FrontDesk
          trigger:
            # clock is 2026-04-11T08:30Z, well before session_start 04-25
            - call: "POST /bookings/${bk}/complete"
              payload: {}
              as: Flexologist
              as_user_id: "${flex}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk}.schedule_status == CONFIRMED"

