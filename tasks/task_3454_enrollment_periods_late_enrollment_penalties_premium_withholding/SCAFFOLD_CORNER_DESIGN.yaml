  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_endpoint_pagination_envelope_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, response_envelope.pagination_fields]
        distinguishing_aspect: "A list call with no query params returns the fixed envelope: response_type array, limit 10, offset 0, exact total_count, has_more false."
        test_recipe:
          setup: ["beneficiary DOB 1961-12-14 with PART_B and PART_D enrollments (clock 2026-10-10, IEP)"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Page Nate", date_of_birth: "1961-12-14" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_D" }
              as: Beneficiary
              as_user_id: "${b_id}"
          trigger:
            - call: "GET /medicare/beneficiaries/${b_id}/enrollments"
              as: Beneficiary
              as_user_id: "${b_id}"
          assert:
            - "response_type == \"array\"; data has exactly 2 enrollments"
            - "pagination block: limit == 10 (default), offset == 0, total_count == 2, has_more == false"
            - "meta.api_request_id present and non-empty"
      - name: error_response_envelope_shape
        claim_type: violation_to_error
        grounds: [response_envelope.error]
        distinguishing_aspect: "Every error body has the fixed shape: response_type error, data.error_id + data.message, meta.api_request_id."
        test_recipe:
          setup: ["beneficiary exists"]
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Err Shape", date_of_birth: "1961-12-14" }
              as: FieldOfficer
          trigger:
            - call: "GET /medicare/enrollments/00000000-0000-0000-0000-000000000000"
              as: FieldOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "http 404; body.response_type == \"error\""
            - "body.data.error_id == ERR_ENROLLMENT_NOT_FOUND and body.data.message is a non-empty string"
            - "body.meta.api_request_id present"

