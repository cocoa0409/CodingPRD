      - name: reopening_a_terminated_existing_unit_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_STATUS_TRANSITION_INVALID]
          - validations[priority=20]
          - state_machines.ExistingUnit.status
        distinguishing_aspect: "TERMINATED is a genuine terminal state for a unit, so the OPERATING target that is legal from SUSPENDED is refused from TERMINATED with ERR_UNIT_STATUS_TRANSITION_INVALID, and the unit keeps the terminated_at stamp it already carries."
