  - section: validations
    instances:
      - name: missing_x_user_role_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 1 runs before every other gate: a request with no X-User-Role header against a
          tower id that does not exist returns 401 ERR_UNAUTHENTICATED, not the 404 that the same
          path would produce for an authenticated caller.
        test_recipe:
          setup:
            - "One tower exists; the request under test targets an id that does not exist."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Header Hill", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { hh_t_id: $.data.id }
          trigger:
            - call: "GET /tower-colo/towers/tower-does-not-exist"
              payload: {}
              as: "(no X-User-Role header sent)"
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.response_type == error"
            - "GET /tower-colo/towers/${hh_t_id} as PortfolioAdmin still returns 200"

      - name: unknown_role_value_in_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - rbac.roles
        distinguishing_aspect: |
          A syntactically present but unrecognised role string (SiteTechnician) fails priority 1 with
          401 ERR_UNAUTHENTICATED rather than priority 2's 403 ERR_ROLE_NOT_PERMITTED — the role must
          be a member of the declared five-role set before permission is even considered.
        test_recipe:
          setup:
            - "One tower exists."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Unknown Role Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { ur_t_id: $.data.id }
          trigger:
            - call: "GET /tower-colo/towers/${ur_t_id}"
              payload: {}
              as: "SiteTechnician (not a declared role)"
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: tenant_cannot_create_tower_returns_403
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - validations.priority_3
          - endpoints.POST_/tower-colo/towers
        distinguishing_aspect: |
          The body is also malformed (structure_type and ground_space_total_sqft are absent), yet the
          response is 403 ERR_ROLE_NOT_PERMITTED — priority 2 outranks priority 3, so an unauthorised
          caller learns nothing about body validity.
        test_recipe:
          setup:
            - "One tenant exists so the Tenant identity resolves at priority 7."
          setup_api_calls:
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Role Fence Wireless", carrier_code: "RFW" }
              as: PortfolioAdmin
              captures: { rf_ten_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Trespass Tower", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300 }
              as: Tenant
              as_user_id: "${rf_ten_id}"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /tower-colo/towers as PortfolioAdmin returns total_count == 0"

      - name: pagination_limit_zero_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: |
          limit is bounded 1..100 inclusive: limit 0 and limit 101 both return 400
          ERR_INVALID_PAGINATION while limit 1 and limit 100 succeed, and a negative offset is
          rejected by the same rule rather than clamped to 0.
        test_recipe:
          setup:
            - "One tower exists so the list has a row to return on the accepted calls."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Page Bound Peak", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
          trigger:
            - call: "GET /tower-colo/towers"
              payload: { limit: 0 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { limit: 101 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { offset: -1 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { limit: 1, offset: 0 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { limit: 100 }
              as: PortfolioAdmin
          assert:
            - "trigger calls 1, 2 and 3 each return 400 with error_id == ERR_INVALID_PAGINATION"
            - "trigger call 4 returns 200 with total_count == 1 and has_more == false"
            - "trigger call 5 returns 200 with total_count == 1"

      - name: unknown_tenant_identity_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - errors.ERR_IDENTITY_NOT_FOUND
        distinguishing_aspect: |
          Both body foreign keys resolve, so priority 6 passes; the failure is priority 7 —
          X-User-ID "ten-does-not-exist" matches no Tenant row, giving 403 ERR_IDENTITY_NOT_FOUND
          rather than a 404 or the priority 8 scope violation that a real other tenant would get.
        test_recipe:
          setup:
            - "Tower IDN and tenant IDN exist, and tenant IDN holds one ACTIVE master lease."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Identity Notch", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { id_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Identity Notch Networks", carrier_code: "IDN" }
              as: PortfolioAdmin
              captures: { id_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${id_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { id_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${id_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${id_t_id}", master_lease_agreement_id: "${id_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 300 }
              as: Tenant
              as_user_id: "ten-does-not-exist"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_IDENTITY_NOT_FOUND"
            - "GET /tower-colo/colocation-applications as PortfolioAdmin returns total_count == 0"

      - name: tenant_cannot_submit_another_tenants_application
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_TENANT_SCOPE_VIOLATION
        distinguishing_aspect: |
          Ownership is resolved through MasterLeaseAgreement.tenant_id, not through the acting
          header alone: tenant SCB is a real Tenant row (priority 7 passes) but submitting tenant
          SCA's application returns 403 ERR_TENANT_SCOPE_VIOLATION, and the application stays DRAFT.
        test_recipe:
          setup:
            - "Tower SCP exists; tenants SCA and SCB each hold an ACTIVE master lease; SCA owns a DRAFT application with one equipment line."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Scope Pass Peak", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { sc_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Scope Alpha", carrier_code: "SCA" }
              as: PortfolioAdmin
              captures: { sc_a_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Scope Bravo", carrier_code: "SCB" }
              as: PortfolioAdmin
              captures: { sc_b_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${sc_a_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { sc_mla_a_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${sc_mla_a_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${sc_t_id}", master_lease_agreement_id: "${sc_mla_a_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 300 }
              as: Tenant
              as_user_id: "${sc_a_id}"
              captures: { sc_app_id: $.data.id }
            - call: "POST /tower-colo/colocation-applications/${sc_app_id}/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "SC-100", quantity: 5, unit_weight_lbs: 100, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${sc_a_id}"
          trigger:
            - call: "POST /tower-colo/colocation-applications/${sc_app_id}/submit"
              payload: {}
              as: Tenant
              as_user_id: "${sc_b_id}"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_TENANT_SCOPE_VIOLATION"
            - "ColocationApplication.${sc_app_id}.status == DRAFT"
            - "ColocationApplication.${sc_app_id}.submitted_at == null"
            - "POST /tower-colo/colocation-applications/${sc_app_id}/submit as Tenant ${sc_a_id} then returns 200 with status == UNDER_STRUCTURAL_REVIEW"

      - name: landlord_cannot_list_another_landlords_ground_leases_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_LANDLORD_SCOPE_VIOLATION
        distinguishing_aspect: |
          The Landlord scope rule is enforced on the list endpoint by comparing the requested
          landlord_id filter with X-User-ID: landlord LLB asking for LLA's leases gets 403
          ERR_LANDLORD_SCOPE_VIOLATION rather than an empty page, while LLA sees its one lease.
        test_recipe:
          setup:
