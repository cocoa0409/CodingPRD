        distinguishing_aspect: "Numeric >= boundary on the diversion metric: a period rate of exactly 50.00 against a floor of 50 produces diversion_penalty_cents == 0 (meeting the floor exactly is compliant; reachable via POST /invoices/{id}/issue)."
        test_recipe:
          setup:
            - "RESIDENTIAL account diversion_floor_pct 50; one COMPLETED TRASH pickup net 250 (not diverted) and one COMPLETED RECYCLE pickup net 250 (diverted) -> rate exactly 50.00; FINALIZED DiversionPeriod over the invoice window; ACTIVE TRASH plan base 0."
          setup_api_calls:
            - call: "POST /accounts"
