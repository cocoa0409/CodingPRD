# =============================================================================
# task_1069 — Home-Equity Investment (Point/Hometap style) seed tables
# Difficulty: Expert
# =============================================================================

scenario: |
  Home-Equity Investment (Point/Hometap style): application & AVM/appraisal,
  investment offer & option term, lien & title, no-monthly-payment structure,
  settlement (sale/buyout) & appreciation-share calc, servicing & maintenance
  covenant, dispute, exit

domain_name: home-equity-investment
api_prefix: /hei

complexity_profile:
  primary_archetype: pricing_engine          # appreciation-share settlement calc
  secondary_archetype: multi_party_negotiation  # application → offer → counter → accept
  complexity_layers:
    - optimistic_concurrency        # OCC on Agreement.version at settlement propose
    - dual_variant_calculation      # SALE vs BUYOUT appreciation share; provisional vs final offer max
    - cascading_side_effects        # finalize → agreement → lien → inspections
    - derived_field_reconciliation  # Fund.committed_capital, Application.combined_ltv

  entity_topology: flat             # peer entities linked by FK; no deep URL nesting
  state_machine_shape: cyclic       # Offer counter/represent loop; Agreement dispute loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # ComplianceOfficer resolver != settlement proposer
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Investor fund display name" }
      - { name: total_capital_cents, type: integer, source: input, description: "Total capital the fund can commit, in cents" }
      - { name: committed_capital_cents, type: integer, source: computed, description: "= sum(Offer.investment_amount_cents WHERE status==PRESENTED) + sum(Agreement.investment_amount_cents WHERE status IN {FUNDED,ACTIVE,EXIT_INITIATED,SETTLEMENT_PROPOSED,DISPUTED}); recomputed on every offer/agreement mutation" }
      - { name: available_capital_cents, type: integer, source: computed, description: "= total_capital_cents - committed_capital_cents" }

  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Homeowner email (login identity)" }
      - { name: full_name, type: string, source: input, description: "Homeowner full name" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; must equal X-User-ID of the acting Homeowner" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; the fund this application is submitted to" }
      - { name: property_address, type: string, source: input, description: "Subject property street address" }
      - { name: property_type, type: enum, source: input, description: "Property type", constraints: "one of SINGLE_FAMILY|CONDO|TOWNHOUSE|MULTI_UNIT" }
      - { name: homeowner_estimated_value_cents, type: integer, source: input, description: "Homeowner's self-estimated property value, in cents" }
      - { name: existing_mortgage_balance_cents, type: integer, source: input, description: "Outstanding senior mortgage balance, in cents" }
      - { name: requested_investment_cents, type: integer, source: input, description: "Requested investment amount, in cents" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of DRAFT|UNDER_REVIEW|APPROVED|OFFERED|FUNDED|DECLINED|WITHDRAWN; initial DRAFT" }
      - { name: combined_ltv, type: number, source: computed, description: "= (requested_investment_cents + existing_mortgage_balance_cents) / basis_valuation.valued_amount_cents; set at APPROVE decision using the COMPLETED valuation with the latest created_at; null before that" }
      - { name: risk_band, type: enum, source: computed, description: "From combined_ltv: LOW if <=0.50, MODERATE if <=0.65, ELEVATED if <=0.75; null before APPROVE", constraints: "one of LOW|MODERATE|ELEVATED" }

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: method, type: enum, source: input, description: "Valuation method", constraints: "one of AVM|APPRAISAL" }
      - { name: valued_amount_cents, type: integer, source: input, description: "Property value in cents; required in request for AVM (status COMPLETED at creation); set by appraisal-appointment completion for APPRAISAL (0 while PENDING)" }
      - { name: confidence_score, type: number, source: input, description: "AVM confidence in [0,1]; optional, default null; ignored for APPRAISAL", default: null }
      - { name: source_appointment_id, type: string, source: system, description: "FK -> AppraisalAppointment.id; the appointment whose completion set this appraisal value; null for AVM", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of PENDING|COMPLETED|SUPERSEDED; AVM initial COMPLETED, APPRAISAL initial PENDING" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Appraiser full name (login identity)" }
      - { name: region_code, type: string, source: input, description: "Region the appraiser services, e.g. CA-BAY" }

  - name: AppraisalAppointment
    parent: null
    common_fields: true
    fields:
      - { name: appraiser_id, type: string, source: input, description: "FK -> Appraiser.id" }
      - { name: valuation_id, type: string, source: input, description: "FK -> Valuation.id; must reference a PENDING APPRAISAL valuation" }
      - { name: region_code, type: string, source: input, description: "Region of the subject property; must equal the appraiser's region_code" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Appointment end (ISO8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of SCHEDULED|COMPLETED|CANCELLED; initial SCHEDULED" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id (from path)" }
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id; copied from the application's fund_id" }
      - { name: valuation_id, type: string, source: input, description: "FK -> Valuation.id; the COMPLETED valuation used as the offer basis" }
      - { name: investment_amount_cents, type: integer, source: input, description: "Investment amount offered, in cents" }
      - { name: option_percentage, type: number, source: input, description: "Investor's share of appreciation, in [0,1]" }
      - { name: risk_adjustment_pct, type: number, source: input, description: "Downward risk adjustment applied to valued_amount to derive the starting value, in [0,1]" }
      - { name: term_months, type: integer, source: input, description: "Option term length in months" }
      - { name: capped_annual_rate, type: number, source: input, description: "Annual cap rate bounding the investor's SALE appreciation share" }
      - { name: expires_at, type: datetime, source: input, description: "Offer expiry (ISO8601 UTC); accept after this instant is rejected" }
      - { name: adjusted_start_value_cents, type: integer, source: computed, description: "= round_half_up(basis_valuation.valued_amount_cents * (1 - risk_adjustment_pct))" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of PRESENTED|ACCEPTED|DECLINED|COUNTERED|WITHDRAWN; initial PRESENTED" }
      - { name: counter_notes, type: string, source: input, description: "Homeowner's counter rationale; set on COUNTER, else null", default: null }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; the accepted offer" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id" }
      - { name: investment_amount_cents, type: integer, source: system, description: "Copied from the accepted offer" }
      - { name: option_percentage, type: number, source: system, description: "Copied from the accepted offer" }
      - { name: adjusted_start_value_cents, type: integer, source: system, description: "Copied from the accepted offer" }
      - { name: term_months, type: integer, source: system, description: "Copied from the accepted offer" }
      - { name: capped_annual_rate, type: number, source: system, description: "Copied from the accepted offer" }
      - { name: funded_at, type: datetime, source: system, description: "Logical-clock instant at which the offer was accepted / agreement created" }
      - { name: maturity_at, type: datetime, source: system, description: "= funded_at plus term_months calendar months" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of FUNDED|ACTIVE|EXIT_INITIATED|SETTLEMENT_PROPOSED|DISPUTED|SETTLED|DEFAULTED; initial FUNDED" }
      - { name: covenant_status, type: enum, source: system, description: "Maintenance-covenant dimension (independent of status)", constraints: "one of COMPLIANT|BREACH_NOTICED|CURED; initial COMPLIANT" }

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id; created PENDING when the agreement is funded" }
      - { name: title_status, type: enum, source: system, description: "Title status; PENDING at creation, set to CLEAR or CLOUDED by the record action", constraints: "one of PENDING|CLEAR|CLOUDED" }
      - { name: lien_position, type: integer, source: input, description: "Recorded lien priority position (e.g. 2 for a second lien); set by the record action", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of PENDING|RECORDED|RELEASED; initial PENDING" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector full name (login identity)" }
      - { name: region_code, type: string, source: input, description: "Region the inspector services" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id (from path)" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id" }
      - { name: scheduled_date, type: string, source: input, description: "Inspection calendar date, YYYY-MM-DD (no time-of-day)" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of SCHEDULED|PASSED|FAILED|CANCELLED; initial SCHEDULED" }
      - { name: condition_score, type: number, source: system, description: "Property condition score in [0,100], set by completion; null while SCHEDULED", default: null }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> Agreement.id (from path)" }
      - { name: settlement_type, type: enum, source: input, description: "Exit path", constraints: "one of SALE|BUYOUT" }
      - { name: sale_price_cents, type: integer, source: input, description: "Arms-length sale price, in cents; required for SALE, ignored for BUYOUT", default: null }
      - { name: current_appraised_value_cents, type: integer, source: input, description: "Current appraised value, in cents; required for BUYOUT, ignored for SALE", default: null }
      - { name: mortgage_payoff_cents, type: integer, source: input, description: "Senior mortgage payoff at settlement, in cents" }
      - { name: ending_value_cents, type: integer, source: computed, description: "= sale_price_cents for SALE, current_appraised_value_cents for BUYOUT" }
      - { name: elapsed_months, type: integer, source: computed, description: "Whole calendar months from agreement.funded_at to the settlement clock instant" }
      - { name: appreciation_share_cents, type: integer, source: computed, description: "Investor appreciation share; SALE variant is APR-capped, BUYOUT variant is uncapped (see calculations.appreciation_share)" }
      - { name: settlement_fee_cents, type: integer, source: computed, description: "Round-per-component-then-sum HEI fee (see calculations.settlement_fee)" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "= ending_value_cents - mortgage_payoff_cents - settlement_fee_cents" }
      - { name: homeowner_payout_cents, type: integer, source: computed, description: "= net_proceeds_cents - investment_amount_cents - appreciation_share_cents (agreement.investment_amount_cents)" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of PROPOSED|DISPUTED|FINALIZED|VOID; initial PROPOSED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who proposed this settlement (for SoD)" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id (from path); the disputed settlement" }
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id; copied from the disputed settlement" }
      - { name: reason, type: string, source: input, description: "Homeowner's dispute rationale" }
      - { name: disputed_value_cents, type: integer, source: input, description: "Homeowner's claimed property value, in cents" }
      - { name: resolved_value_cents, type: integer, source: input, description: "Adjusted value set by the resolving ComplianceOfficer; null until RESOLVED", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of OPEN|RESOLVED|REJECTED; initial OPEN" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who resolved/rejected (SoD: must differ from settlement.proposed_by_user_id)", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [FUNDED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /hei/applications/{id}/submit"
        actor: Homeowner
        preconditions:
          - "At least one COMPLETED Valuation exists for this application (ERR_NO_COMPLETED_VALUATION)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /hei/applications/{id}/decision (decision=APPROVE)"
        actor: InvestmentAnalyst
        preconditions:
          - "combined_ltv computed from the latest COMPLETED valuation is <= MAX_COMBINED_LTV (else ERR_LTV_EXCEEDED)"
        side_effects:
          - "Set combined_ltv and risk_band (calculations.combined_ltv, calculations.risk_band)"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /hei/applications/{id}/decision (decision=DECLINE)"
        actor: InvestmentAnalyst
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: OFFERED
        trigger: "system: first Offer presented for this application (POST /hei/applications/{id}/offers)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: FUNDED
        trigger: "system: an Offer for this application is ACCEPTED (POST /hei/offers/{id}/accept)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link (cascade offer_accept_chain, depth 2): once Application is FUNDED, every sibling Offer of this application still in PRESENTED is transitioned to DECLINED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /hei/applications/{id}/withdraw"
        actor: Homeowner
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /hei/applications/{id}/withdraw"
        actor: Homeowner
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /hei/applications/{id}/withdraw"
        actor: Homeowner
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /hei/applications/{id}/withdraw"
        actor: Homeowner
        preconditions:
          - "No Offer of this application is ACCEPTED"
        side_effects:
          - "Every sibling Offer still in PRESENTED is transitioned to WITHDRAWN (releases their committed capital)"

  - entity: Valuation
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /hei/appraisal-appointments/{id}/complete (APPRAISAL valuation) OR system at creation for AVM"
        actor: Appraiser
        preconditions:
          - "For APPRAISAL: the linked AppraisalAppointment is SCHEDULED and being completed"
        side_effects:
          - "Set valued_amount_cents from the completion input; set source_appointment_id"
          - "Cascade: any prior COMPLETED Valuation of the SAME method for the same application is transitioned to SUPERSEDED (an AVM and an APPRAISAL valuation coexist; only a same-method newer one supersedes)"
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: a newer COMPLETED Valuation of the same method supersedes a prior COMPLETED Valuation of that same method for the same application"
        actor: system
        preconditions: []
        side_effects: []
    note: "AVM valuations are created directly in COMPLETED (see endpoints POST /hei/applications/{id}/valuations)."

  - entity: AppraisalAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /hei/appraisal-appointments/{id}/complete"
        actor: Appraiser
        preconditions:
          - "Linked Valuation is PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "Cross-entity: linked Valuation PENDING -> COMPLETED with valued_amount_cents = completion input"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hei/appraisal-appointments/{id}/cancel"
        actor: InvestmentAnalyst
        preconditions: []
        side_effects: []

  - entity: Offer
    initial_state: PRESENTED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN]
    transitions:
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /hei/offers/{id}/accept"
        actor: Homeowner
        preconditions:
          - "current clock instant < expires_at (ERR_OFFER_EXPIRED)"
          - "Application status is OFFERED (cross-entity)"
        side_effects:
          - "Cascade offer_accept_chain (depth 2): Offer->ACCEPTED then Application OFFERED->FUNDED then sibling PRESENTED Offers -> DECLINED"
          - "Create Agreement (status FUNDED) copying offer terms; funded_at = current clock; maturity_at = funded_at + term_months months"
          - "Create Lien (status PENDING, title_status PENDING) for the new agreement"
          - "Recompute Fund.committed_capital_cents / available_capital_cents"
      - from: PRESENTED
        to: DECLINED
        trigger: "POST /hei/offers/{id}/decline"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "Compensating (invariant fund_capital_conserved): investment_amount_cents leaves Fund.committed_capital_cents; available rises by the same amount"
      - from: PRESENTED
        to: COUNTERED
        trigger: "POST /hei/offers/{id}/counter"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "Set counter_notes; investment_amount_cents leaves Fund.committed_capital_cents (a COUNTERED offer holds no capital)"
      - from: COUNTERED
        to: PRESENTED
        trigger: "POST /hei/offers/{id}/represent"
        actor: InvestmentAnalyst
        preconditions:
          - "Revised investment_amount_cents <= Fund.available_capital_cents (ERR_INSUFFICIENT_FUND_CAPITAL)"
        side_effects:
          - "Overwrite revised terms; recompute adjusted_start_value_cents; investment_amount_cents re-enters Fund.committed_capital_cents (cycle)"
      - from: PRESENTED
        to: WITHDRAWN
        trigger: "POST /hei/offers/{id}/withdraw"
        actor: InvestmentAnalyst
        preconditions: []
        side_effects:
          - "Compensating (invariant fund_capital_conserved): investment_amount_cents leaves Fund.committed_capital_cents"

  - entity: Agreement
    initial_state: FUNDED
    terminal_states: [SETTLED, DEFAULTED]
    transitions:
      - from: FUNDED
        to: ACTIVE
        trigger: "POST /hei/agreements/{id}/activate"
        actor: ClosingAgent
        preconditions:
          - "The agreement's Lien is RECORDED (cross-entity dependency; else ERR_LIEN_NOT_RECORDED)"
        side_effects: []
      - from: ACTIVE
        to: EXIT_INITIATED
        trigger: "POST /hei/agreements/{id}/initiate-exit"
        actor: Homeowner
        preconditions:
          - "covenant_status != BREACH_NOTICED (ERR_COVENANT_BREACH_OPEN)"
        side_effects: []
      - from: EXIT_INITIATED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /hei/agreements/{id}/settlements (first proposal)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Create Settlement (PROPOSED); compute appreciation_share_cents / settlement_fee_cents / homeowner_payout_cents; increments Agreement.version by 1"
      - from: SETTLEMENT_PROPOSED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /hei/agreements/{id}/settlements (re-proposal / supersede)"
        actor: ComplianceOfficer
        preconditions:
          - "expected_agreement_version matches Agreement.version (OCC; else ERR_STALE_AGREEMENT_VERSION)"
        side_effects:
          - "Prior PROPOSED Settlement -> VOID; create replacement Settlement (PROPOSED); increments Agreement.version by 1"
      - from: SETTLEMENT_PROPOSED
        to: SETTLED
        trigger: "POST /hei/settlements/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "Settlement is PROPOSED"
          - "net_proceeds_cents >= 0 (ERR_PROCEEDS_INSUFFICIENT)"
          - "SoD: finalizing officer may equal proposer (SoD applies only to dispute resolution)"
        side_effects:
          - "Cascade settlement_finalize_chain (depth 3): Settlement->FINALIZED then Agreement SETTLEMENT_PROPOSED->SETTLED then Lien RECORDED->RELEASED then every SCHEDULED Inspection -> CANCELLED"
          - "Agreement leaves Fund.committed_capital_cents"
      - from: SETTLEMENT_PROPOSED
        to: DISPUTED
        trigger: "POST /hei/settlements/{id}/dispute"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "Create Dispute (OPEN); current PROPOSED Settlement -> DISPUTED"
      - from: DISPUTED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /hei/disputes/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: resolving X-User-ID != disputed Settlement.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Disputed Settlement -> VOID; create replacement Settlement (PROPOSED) whose ending_value uses the dispute's resolved_value_cents; increments Agreement.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /hei/agreements/{id}/default"
        actor: ComplianceOfficer
        preconditions:
          - "covenant_status == BREACH_NOTICED (ERR_NO_OPEN_BREACH)"
        side_effects:
          - "Agreement leaves Fund.committed_capital_cents"

  - entity: Agreement_covenant
    initial_state: COMPLIANT
    terminal_states: []
    note: "Parallel covenant_status dimension on Agreement, independent of the status lifecycle above."
    transitions:
      - from: COMPLIANT
        to: BREACH_NOTICED
        trigger: "system: an Inspection for this agreement completes FAILED"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACH_NOTICED
        to: CURED
        trigger: "system: a later Inspection for this agreement completes PASSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURED
        to: BREACH_NOTICED
        trigger: "system: a subsequent Inspection completes FAILED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lien
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: RECORDED
        trigger: "POST /hei/liens/{id}/record"
        actor: ClosingAgent
        preconditions:
          - "Recorded title_status resolves to CLEAR (if CLOUDED -> ERR_TITLE_NOT_CLEAR)"
        side_effects:
          - "Set title_status and lien_position from input"
      - from: RECORDED
        to: RELEASED
        trigger: "system: the agreement's settlement is FINALIZED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /hei/inspections/{id}/complete (result=PASSED)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "Set condition_score; if agreement.covenant_status == BREACH_NOTICED then Agreement covenant_status -> CURED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /hei/inspections/{id}/complete (result=FAILED)"
        actor: Inspector
        preconditions: []
        side_effects:
          - "Set condition_score; Agreement covenant_status COMPLIANT|CURED -> BREACH_NOTICED (cross-entity)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hei/inspections/{id}/cancel OR system on settlement finalize"
        actor: InvestmentAnalyst
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: PROPOSED
    terminal_states: [FINALIZED, VOID]
    transitions:
      - from: PROPOSED
        to: FINALIZED
        trigger: "POST /hei/settlements/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "Parent Agreement is SETTLEMENT_PROPOSED"
          - "net_proceeds_cents >= 0 (ERR_PROCEEDS_INSUFFICIENT)"
        side_effects:
          - "Drives Agreement settlement_finalize_chain cascade (see Agreement SM)"
      - from: PROPOSED
        to: DISPUTED
        trigger: "POST /hei/settlements/{id}/dispute"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "Create Dispute (OPEN)"
      - from: PROPOSED
        to: VOID
        trigger: "system: a replacement Settlement is proposed on the same agreement (re-proposal / OCC supersede)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: VOID
        trigger: "system: the Dispute is RESOLVED (a replacement Settlement is created)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /hei/disputes/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: resolving X-User-ID != disputed Settlement.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set resolved_value_cents, resolved_by_user_id; disputed Settlement -> VOID; Agreement DISPUTED -> SETTLEMENT_PROPOSED with a new replacement Settlement using resolved_value_cents"
      - from: OPEN
        to: REJECTED
        trigger: "POST /hei/disputes/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "SoD: rejecting X-User-ID != disputed Settlement.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set resolved_by_user_id; disputed Settlement DISPUTED -> PROPOSED (reinstated); Agreement DISPUTED -> SETTLEMENT_PROPOSED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-propose-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /hei/agreements/{id}/settlements"
    occ_field: "expected_agreement_version"
    description: |
      Proposing a Settlement against an Agreement whose version has advanced
      since the ComplianceOfficer last observed it is rejected. A re-proposal
      legitimately supersedes a prior PROPOSED settlement (§Settlement SM
      PROPOSED->VOID), so a second proposal carrying a stale
      expected_agreement_version is rejected with 412 rather than silently
      voiding a settlement the client never saw.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: combined_ltv
    trigger: "Application UNDER_REVIEW -> APPROVED decision (POST /hei/applications/{id}/decision, decision=APPROVE)"
    algorithm: threshold
    formula: |
      basis = the COMPLETED Valuation of this application with the latest created_at
              (tie-break: none needed — created_at is unique per row)
      combined_ltv = (requested_investment_cents + existing_mortgage_balance_cents)
                     / basis.valued_amount_cents          # exact rational, NOT rounded
      APPROVE allowed iff combined_ltv <= MAX_COMBINED_LTV     # inclusive boundary
      else reject with ERR_LTV_EXCEEDED
    input_set: "Only COMPLETED valuations (PENDING and SUPERSEDED excluded); most recent by created_at"
    constants:
      MAX_COMBINED_LTV: 0.75
    precision: "combined_ltv stored as a number with full ratio precision; comparison is exact (<=)"

  - name: risk_band
    trigger: "same APPROVE decision that computes combined_ltv"
    algorithm: threshold
    formula: |
      if combined_ltv <= 0.50: risk_band = LOW
      elif combined_ltv <= 0.65: risk_band = MODERATE
      else (<= 0.75): risk_band = ELEVATED     # > 0.75 never reaches here (ERR_LTV_EXCEEDED)
    input_set: "combined_ltv of this application"
    constants:
      LOW_MAX: 0.50
      MODERATE_MAX: 0.65

  - name: adjusted_start_value
    trigger: "Offer creation (POST /hei/applications/{id}/offers) and Offer represent (POST /hei/offers/{id}/represent)"
    algorithm: derived
    formula: |
      adjusted_start_value_cents = round_half_up(
          basis_valuation.valued_amount_cents * (1 - risk_adjustment_pct) )
    input_set: "The offer's basis Valuation (valuation_id) and the offer's risk_adjustment_pct"
    precision: "whole cents, round_half_up"

  - name: offer_max_investment
    trigger: "Offer creation and Offer represent; gates investment_amount_cents"
    algorithm: threshold
    formula: |
      max_investment_cents = floor(INVESTMENT_LTV_CAP * basis_valuation.valued_amount_cents)
      require investment_amount_cents <= max_investment_cents
        else ERR_INVESTMENT_EXCEEDS_LTV_CAP
    input_set: "The offer's basis Valuation.valued_amount_cents"
    constants:
      INVESTMENT_LTV_CAP: 0.30
    precision: "max_investment_cents floored to whole cents"
    variants:
      - name: provisional_avm_basis
        when: "basis Valuation.method == AVM (early, before an in-person appraisal exists)"
        difference: "max is computed from the AVM's valued_amount_cents"
      - name: final_appraisal_basis
        when: "basis Valuation.method == APPRAISAL (COMPLETED appraisal)"
        difference: "max is computed from the appraisal's valued_amount_cents; a different valued_amount yields a different cap for the identical investment_amount_cents, so an amount valid on one basis can be rejected on the other"

  - name: appreciation_share
    trigger: "Settlement proposal (POST /hei/agreements/{id}/settlements) and every re-proposal"
    algorithm: threshold
    formula: |
      ending_value_cents = (settlement_type == SALE) ? sale_price_cents
                                                      : current_appraised_value_cents
      elapsed_months = whole calendar months from agreement.funded_at to current clock instant
      raw_share_cents = round_half_up(
          agreement.option_percentage * max(0, ending_value_cents - agreement.adjusted_start_value_cents) )
      cap_cents = round_half_up(
          agreement.investment_amount_cents * agreement.capped_annual_rate * elapsed_months / 12 )
      # SALE variant is APR-capped; BUYOUT variant is NOT capped
      appreciation_share_cents = (settlement_type == SALE) ? min(raw_share_cents, cap_cents)
                                                           : raw_share_cents
    input_set: "The parent Agreement's option_percentage, adjusted_start_value_cents, investment_amount_cents, capped_annual_rate, funded_at"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "raw_share_cents and cap_cents each round_half_up to whole cents BEFORE the min()"
    variants:
      - name: sale_apr_capped
        when: "settlement_type == SALE"
        difference: "share = min(raw_share, cap_cents) — the APR cap can bind and lower the share"
      - name: buyout_uncapped
        when: "settlement_type == BUYOUT"
        difference: "share = raw_share (no cap); for an identical ending value the BUYOUT share can exceed the SALE share whenever the cap binds"

  - name: settlement_fee
    trigger: "Settlement proposal (POST /hei/agreements/{id}/settlements) and every re-proposal"
    algorithm: aggregation
    formula: |
      # ROUND-PER-COMPONENT-THEN-SUM (pinned order; sum-then-round is WRONG)
      origination_cents = round_half_up(ORIGINATION_FEE_PCT * agreement.investment_amount_cents)
      servicing_cents   = round_half_up(SERVICING_FEE_PCT   * ending_value_cents)
      settlement_fee_cents = origination_cents + servicing_cents + ADMIN_FLAT_CENTS
    input_set: "agreement.investment_amount_cents and this settlement's ending_value_cents"
    constants:
      ORIGINATION_FEE_PCT: 0.03
      SERVICING_FEE_PCT: 0.01
      ADMIN_FLAT_CENTS: 50000
    precision: "each percentage component round_half_up to whole cents individually, THEN sum (round-then-sum, not sum-then-round)"

  - name: settlement_waterfall
    trigger: "Settlement proposal and re-proposal (same call as appreciation_share)"
    algorithm: waterfall_allocation
    formula: |
      net_proceeds_cents = ending_value_cents - mortgage_payoff_cents - settlement_fee_cents
      homeowner_payout_cents = net_proceeds_cents
                               - agreement.investment_amount_cents
                               - appreciation_share_cents
      # Conserved-quantity invariant settlement_proceeds_conserved:
      #   mortgage_payoff_cents + settlement_fee_cents + agreement.investment_amount_cents
      #     + appreciation_share_cents + homeowner_payout_cents == ending_value_cents
    input_set: "Ordered buckets: senior mortgage payoff, HEI fee, investor principal+share, homeowner remainder"
    precision: "all whole cents; homeowner_payout_cents is the balancing remainder"

  - name: fund_committed_capital
    trigger: "Any Offer or Agreement mutation (present, counter, represent, decline, withdraw, accept, finalize, default)"
    algorithm: aggregation
    formula: |
      committed_capital_cents =
          sum(Offer.investment_amount_cents WHERE Offer.status == PRESENTED and Offer.fund_id == this.id)
        + sum(Agreement.investment_amount_cents
              WHERE Agreement.fund_id == this.id
              and Agreement.status IN {FUNDED, ACTIVE, EXIT_INITIATED, SETTLEMENT_PROPOSED, DISPUTED})
      available_capital_cents = total_capital_cents - committed_capital_cents
      # Conserved-quantity invariant fund_capital_conserved:
      #   committed_capital_cents + available_capital_cents == total_capital_cents   (always)
    input_set: "PRESENTED offers and non-terminal FUNDED..DISPUTED agreements of this fund; COUNTERED/DECLINED/WITHDRAWN offers and SETTLED/DEFAULTED agreements excluded"
    precision: "whole cents; exact integer arithmetic"

# no random fields participate in any selection, ordering, or tie-break: the only
# tie-break used (latest COMPLETED valuation) is by created_at, never by id.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists (validated left-to-right); returns the resource-specific NOT_FOUND"
    error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (resource-specific *_NOT_FOUND variant used)"

  - priority: 4
    category: auth
    check: "For entity_backed Homeowner actions, X-User-ID equals the owning Homeowner (Application.homeowner_id / Offer.application.homeowner_id / Agreement.application.homeowner_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Homeowner-owned mutations: submit/withdraw application, accept/decline/counter offer, initiate-exit, dispute settlement"

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys exist (fund_id, homeowner_id, valuation_id, appraiser_id, inspector_id)"
    error_id: ERR_FUND_NOT_FOUND
    http_status: 404
    applies_to: "creates that carry FK fields in the body"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_agreement_version equals Agreement.version on settlement proposal"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /hei/agreements/{id}/settlements"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: dispute resolver/rejecter X-User-ID must differ from the disputed settlement's proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hei/disputes/{id}/resolve, POST /hei/disputes/{id}/reject"

  - priority: 9
    category: business_referential
    check: "Cross-entity state prerequisites: offer basis Valuation is COMPLETED; agreement Lien is RECORDED before activate; appraiser region_code equals appointment region_code"
    error_id: ERR_VALUATION_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /hei/applications/{id}/offers, POST /hei/agreements/{id}/activate, POST /hei/appraisal-appointments"

  - priority: 10
    category: business_temporal
    check: "Resource temporal-overlap: appraiser has no other SCHEDULED appointment within APPRAISER_BUFFER_MINUTES (=60 minutes) of the requested window; inspector has no other non-CANCELLED inspection on the same scheduled_date"
    error_id: ERR_APPRAISER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /hei/appraisal-appointments, POST /hei/agreements/{id}/inspections"

  - priority: 11
    category: business_constraint
    check: "Constraint gates: offer not expired at accept; recorded title resolves to CLEAR; scheduled_end strictly after scheduled_start; SALE carries sale_price_cents / BUYOUT carries current_appraised_value_cents"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /hei/offers/{id}/accept, POST /hei/liens/{id}/record, POST /hei/appraisal-appointments, POST /hei/agreements/{id}/settlements"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates (checked last): combined_ltv <= MAX_COMBINED_LTV; investment_amount_cents <= offer_max_investment; investment_amount_cents <= Fund.available_capital_cents; net_proceeds_cents >= 0"
    error_id: ERR_LTV_EXCEEDED
    http_status: 422
    applies_to: "POST /hei/applications/{id}/decision, POST /hei/applications/{id}/offers, POST /hei/offers/{id}/represent, POST /hei/settlements/{id}/finalize"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default start 2026-07-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call the clock reads exactly 2026-07-01T00:00:00Z (never real wall-clock)."
    roles: [InvestmentAnalyst, ClosingAgent, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- Fund ---
  - method: POST
    path: "/hei/funds"
    description: "Create an investor Fund"
    roles: [InvestmentAnalyst]
    code: 201
    input: [name, total_capital_cents]
    output: Fund
    side_effects: ["committed_capital_cents=0, available_capital_cents=total_capital_cents"]
  - method: GET
    path: "/hei/funds/{id}"
    description: "Get a Fund"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Fund
    side_effects: []

  # --- Homeowner ---
  - method: POST
    path: "/hei/homeowners"
    description: "Onboard a Homeowner"
    roles: [InvestmentAnalyst]
    code: 201
    input: [email, full_name]
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/hei/homeowners/{id}"
    description: "Get a Homeowner"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/hei/applications"
    description: "Homeowner submits a draft application (homeowner_id must equal X-User-ID)"
    roles: [Homeowner]
    code: 201
    input: [homeowner_id, fund_id, property_address, property_type, homeowner_estimated_value_cents, existing_mortgage_balance_cents, requested_investment_cents]
    output: Application
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/hei/applications/{id}"
    description: "Get an Application"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/hei/applications"
    description: "List/filter Applications (reverse-reachability for homeowner_id, fund_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["homeowner_id?", "fund_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/hei/applications/{id}/submit"
    description: "DRAFT -> UNDER_REVIEW"
    roles: [Homeowner]
    code: 200
    input: []
    output: Application
    side_effects: ["Application DRAFT->UNDER_REVIEW"]
  - method: POST
    path: "/hei/applications/{id}/decision"
    description: "Analyst approves or declines (UNDER_REVIEW -> APPROVED/DECLINED)"
    roles: [InvestmentAnalyst]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["On APPROVE: compute combined_ltv & risk_band; enforce ERR_LTV_EXCEEDED"]
  - method: POST
    path: "/hei/applications/{id}/withdraw"
    description: "Homeowner withdraws (DRAFT/UNDER_REVIEW/APPROVED/OFFERED -> WITHDRAWN)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Application
    side_effects: ["From OFFERED: sibling PRESENTED offers -> WITHDRAWN, release committed capital"]

  # --- Valuation ---
  - method: POST
    path: "/hei/applications/{id}/valuations"
    description: "Create a Valuation. AVM: valued_amount_cents required, created COMPLETED. APPRAISAL: created PENDING (value set by appointment completion)."
    roles: [InvestmentAnalyst]
    code: 201
    input: [method, "valued_amount_cents?", "confidence_score?"]
    output: Valuation
    side_effects: ["AVM -> status COMPLETED (supersedes any prior COMPLETED AVM valuation of the same application); APPRAISAL -> status PENDING"]
  - method: GET
    path: "/hei/valuations/{id}"
    description: "Get a Valuation"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Valuation
    side_effects: []
  - method: GET
    path: "/hei/valuations"
    description: "List/filter Valuations (reverse-reachability for application_id, source_appointment_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["application_id?", "source_appointment_id?", "method?", "status?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  # --- Appraiser ---
  - method: POST
    path: "/hei/appraisers"
    description: "Register an Appraiser"
    roles: [InvestmentAnalyst]
    code: 201
    input: [full_name, region_code]
    output: Appraiser
    side_effects: []
  - method: GET
    path: "/hei/appraisers/{id}"
    description: "Get an Appraiser"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Appraiser
    side_effects: []

  # --- AppraisalAppointment ---
  - method: POST
    path: "/hei/appraisal-appointments"
    description: "Schedule an appraisal appointment on an appraiser for a PENDING APPRAISAL valuation"
    roles: [InvestmentAnalyst]
    code: 201
    input: [appraiser_id, valuation_id, region_code, scheduled_start, scheduled_end]
    output: AppraisalAppointment
    side_effects: ["status=SCHEDULED; region + buffer-overlap checks"]
  - method: GET
    path: "/hei/appraisal-appointments/{id}"
    description: "Get an appointment"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: AppraisalAppointment
    side_effects: []
  - method: GET
    path: "/hei/appraisal-appointments"
    description: "List/filter appointments (reverse-reachability for appraiser_id, valuation_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["appraiser_id?", "valuation_id?", "status?", "limit?", "offset?"]
    output: AppraisalAppointment[]
    side_effects: []
  - method: POST
    path: "/hei/appraisal-appointments/{id}/complete"
    description: "Appraiser completes the appointment and records the appraised value"
    roles: [Appraiser]
    code: 200
    input: [valued_amount_cents]
    output: AppraisalAppointment
    side_effects: ["appointment SCHEDULED->COMPLETED; linked Valuation PENDING->COMPLETED with valued_amount_cents; supersede prior COMPLETED APPRAISAL valuation of the same application (same-method only)"]
  - method: POST
    path: "/hei/appraisal-appointments/{id}/cancel"
    description: "Cancel a scheduled appointment"
    roles: [InvestmentAnalyst]
    code: 200
    input: []
    output: AppraisalAppointment
    side_effects: ["appointment SCHEDULED->CANCELLED"]

  # --- Offer ---
  - method: POST
    path: "/hei/applications/{id}/offers"
    description: "Analyst presents an offer (created PRESENTED); reserves fund capital. Allowed while Application is APPROVED or OFFERED (multiple concurrent PRESENTED offers per application are permitted)."
    roles: [InvestmentAnalyst]
    code: 201
    input: [valuation_id, investment_amount_cents, option_percentage, risk_adjustment_pct, term_months, capped_annual_rate, expires_at]
    output: Offer
    side_effects: ["status=PRESENTED; compute adjusted_start_value_cents; Application APPROVED->OFFERED on the first offer (stays OFFERED for subsequent offers); committed capital += investment_amount_cents"]
  - method: GET
    path: "/hei/offers/{id}"
    description: "Get an Offer"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/hei/offers"
    description: "List/filter Offers (reverse-reachability for application_id, fund_id, valuation_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["application_id?", "fund_id?", "valuation_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: "/hei/offers/{id}/accept"
    description: "Homeowner accepts (PRESENTED -> ACCEPTED); triggers funding cascade"
    roles: [Homeowner]
    code: 200
    input: []
    output: Offer
    side_effects: ["cascade offer_accept_chain: create Agreement (FUNDED) + Lien (PENDING); Application OFFERED->FUNDED; sibling PRESENTED offers->DECLINED; recompute committed capital"]
  - method: POST
    path: "/hei/offers/{id}/decline"
    description: "Homeowner declines (PRESENTED -> DECLINED)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Offer
    side_effects: ["release committed capital"]
  - method: POST
    path: "/hei/offers/{id}/counter"
    description: "Homeowner counters (PRESENTED -> COUNTERED)"
    roles: [Homeowner]
    code: 200
    input: [counter_notes]
    output: Offer
    side_effects: ["set counter_notes; release committed capital"]
  - method: POST
    path: "/hei/offers/{id}/represent"
    description: "Analyst re-presents revised terms (COUNTERED -> PRESENTED, cycle)"
    roles: [InvestmentAnalyst]
    code: 200
    input: ["investment_amount_cents?", "option_percentage?", "risk_adjustment_pct?", "term_months?", "capped_annual_rate?", "expires_at?"]
    output: Offer
    side_effects: ["overwrite revised terms; recompute adjusted_start_value_cents; re-reserve committed capital"]
  - method: POST
    path: "/hei/offers/{id}/withdraw"
    description: "Analyst withdraws (PRESENTED -> WITHDRAWN)"
    roles: [InvestmentAnalyst]
    code: 200
    input: []
    output: Offer
    side_effects: ["release committed capital"]

  # --- Agreement ---
  - method: GET
    path: "/hei/agreements/{id}"
    description: "Get an Agreement"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Agreement
    side_effects: []
  - method: GET
    path: "/hei/agreements"
    description: "List/filter Agreements (reverse-reachability for offer_id, application_id, fund_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["offer_id?", "application_id?", "fund_id?", "status?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []
  - method: POST
    path: "/hei/agreements/{id}/activate"
    description: "Closing agent activates a funded agreement (FUNDED -> ACTIVE); requires Lien RECORDED"
    roles: [ClosingAgent]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement FUNDED->ACTIVE"]
  - method: POST
    path: "/hei/agreements/{id}/initiate-exit"
    description: "Homeowner initiates exit (ACTIVE -> EXIT_INITIATED)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement ACTIVE->EXIT_INITIATED"]
  - method: POST
    path: "/hei/agreements/{id}/default"
    description: "Compliance declares default on an uncured covenant breach (ACTIVE -> DEFAULTED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Agreement
    side_effects: ["Agreement ACTIVE->DEFAULTED; release committed capital"]

  # --- Lien ---
  - method: GET
    path: "/hei/liens/{id}"
    description: "Get a Lien"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Lien
    side_effects: []
  - method: GET
    path: "/hei/liens"
    description: "List/filter Liens (reverse-reachability for agreement_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []
  - method: POST
    path: "/hei/liens/{id}/record"
    description: "Closing agent records the lien and title result (PENDING -> RECORDED)"
    roles: [ClosingAgent]
    code: 200
    input: [title_status, lien_position]
    output: Lien
    side_effects: ["set title_status & lien_position; CLOUDED title -> ERR_TITLE_NOT_CLEAR"]

  # --- Inspector ---
  - method: POST
    path: "/hei/inspectors"
    description: "Register an Inspector"
    roles: [InvestmentAnalyst]
    code: 201
    input: [full_name, region_code]
    output: Inspector
    side_effects: []
  - method: GET
    path: "/hei/inspectors/{id}"
    description: "Get an Inspector"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  # --- Inspection ---
  - method: POST
    path: "/hei/agreements/{id}/inspections"
    description: "Schedule a maintenance-covenant inspection (one per inspector per calendar day)"
    roles: [InvestmentAnalyst, ClosingAgent]
    code: 201
    input: [inspector_id, scheduled_date]
    output: Inspection
    side_effects: ["status=SCHEDULED; inspector same-day-overlap check"]
  - method: GET
    path: "/hei/inspections/{id}"
    description: "Get an Inspection"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/hei/inspections"
    description: "List/filter Inspections (reverse-reachability for agreement_id, inspector_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/hei/inspections/{id}/complete"
    description: "Inspector records the result (SCHEDULED -> PASSED/FAILED)"
    roles: [Inspector]
    code: 200
    input: [result, condition_score]
    output: Inspection
    side_effects: ["FAILED -> Agreement covenant_status COMPLIANT|CURED -> BREACH_NOTICED; PASSED after breach -> CURED"]
  - method: POST
    path: "/hei/inspections/{id}/cancel"
    description: "Cancel a scheduled inspection"
    roles: [InvestmentAnalyst]
    code: 200
    input: []
    output: Inspection
    side_effects: ["SCHEDULED -> CANCELLED"]

  # --- Settlement ---
  - method: POST
    path: "/hei/agreements/{id}/settlements"
    description: "Compliance proposes a settlement (SALE or BUYOUT); OCC on Agreement.version; re-proposal supersedes prior PROPOSED"
    roles: [ComplianceOfficer]
    code: 201
    input: [settlement_type, "sale_price_cents?", "current_appraised_value_cents?", mortgage_payoff_cents, expected_agreement_version]
    output: Settlement
    side_effects: ["compute appreciation_share_cents/settlement_fee_cents/homeowner_payout_cents; Agreement EXIT_INITIATED|SETTLEMENT_PROPOSED->SETTLEMENT_PROPOSED; increments Agreement.version by 1; prior PROPOSED settlement -> VOID"]
  - method: GET
    path: "/hei/settlements/{id}"
    description: "Get a Settlement"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/hei/settlements"
    description: "List/filter Settlements (reverse-reachability for agreement_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/hei/settlements/{id}/finalize"
    description: "Compliance finalizes (PROPOSED -> FINALIZED); drives the depth-3 cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["cascade settlement_finalize_chain: Agreement->SETTLED, Lien->RELEASED, SCHEDULED Inspections->CANCELLED; release committed capital"]
  - method: POST
    path: "/hei/settlements/{id}/dispute"
    description: "Homeowner disputes a proposed settlement (creates an OPEN Dispute; Settlement PROPOSED -> DISPUTED)"
    roles: [Homeowner]
    code: 201
    input: [reason, disputed_value_cents]
    output: Dispute
    side_effects: ["Settlement PROPOSED->DISPUTED; Agreement SETTLEMENT_PROPOSED->DISPUTED"]

  # --- Dispute ---
  - method: GET
    path: "/hei/disputes/{id}"
    description: "Get a Dispute"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/hei/disputes"
    description: "List/filter Disputes (reverse-reachability for settlement_id, agreement_id)"
    roles: [Homeowner, InvestmentAnalyst, Appraiser, ClosingAgent, Inspector, ComplianceOfficer]
    code: 200
    input: ["settlement_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/hei/disputes/{id}/resolve"
    description: "Compliance resolves (OPEN -> RESOLVED); SoD resolver != proposer; re-proposes settlement at resolved_value_cents"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolved_value_cents]
    output: Dispute
    side_effects: ["disputed Settlement->VOID; new Settlement PROPOSED using resolved_value_cents; Agreement DISPUTED->SETTLEMENT_PROPOSED; increments Agreement.version by 1"]
  - method: POST
    path: "/hei/disputes/{id}/reject"
    description: "Compliance rejects (OPEN -> REJECTED); SoD rejecter != proposer; reinstates prior settlement"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Dispute
    side_effects: ["disputed Settlement DISPUTED->PROPOSED; Agreement DISPUTED->SETTLEMENT_PROPOSED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Homeowner X-User-ID does not own the target resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, or missing settlement_type-specific value (SALE without sale_price_cents / BUYOUT without current_appraised_value_cents)" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "Appointment scheduled_end is not strictly after scheduled_start" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "fund_id does not resolve" }
  - { id: ERR_HOMEOWNER_NOT_FOUND, http: 404, condition: "homeowner_id does not resolve" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id does not resolve" }
  - { id: ERR_VALUATION_NOT_FOUND, http: 404, condition: "valuation id does not resolve" }
  - { id: ERR_APPRAISER_NOT_FOUND, http: 404, condition: "appraiser_id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appraisal-appointment id does not resolve" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "offer id does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id does not resolve" }
  - { id: ERR_LIEN_NOT_FOUND, http: 404, condition: "lien id does not resolve" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "inspector_id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection id does not resolve" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match Agreement.version on settlement proposal" }
  - { id: ERR_NO_COMPLETED_VALUATION, http: 409, condition: "Application submit with no COMPLETED valuation" }
  - { id: ERR_VALUATION_NOT_COMPLETED, http: 409, condition: "Offer basis valuation is not COMPLETED" }
  - { id: ERR_LIEN_NOT_RECORDED, http: 409, condition: "Agreement activate before its Lien is RECORDED" }
  - { id: ERR_TITLE_NOT_CLEAR, http: 409, condition: "Lien record with title_status CLOUDED" }
  - { id: ERR_APPRAISER_REGION_MISMATCH, http: 409, condition: "Appointment region_code does not equal appraiser.region_code" }
  - { id: ERR_APPRAISER_DOUBLE_BOOKED, http: 409, condition: "Appraiser has a SCHEDULED appointment within APPRAISER_BUFFER_MINUTES (=60 minutes) of the requested window" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "Inspector already has a non-CANCELLED inspection on the requested scheduled_date" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accept attempted at or after offer.expires_at" }
  - { id: ERR_COVENANT_BREACH_OPEN, http: 409, condition: "initiate-exit while agreement.covenant_status == BREACH_NOTICED" }
  - { id: ERR_NO_OPEN_BREACH, http: 409, condition: "default while agreement.covenant_status != BREACH_NOTICED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Dispute resolver/rejecter X-User-ID equals the disputed settlement's proposed_by_user_id" }
  - { id: ERR_LTV_EXCEEDED, http: 422, condition: "combined_ltv > MAX_COMBINED_LTV at APPROVE" }
  - { id: ERR_INVESTMENT_EXCEEDS_LTV_CAP, http: 422, condition: "investment_amount_cents > floor(INVESTMENT_LTV_CAP * basis valued_amount_cents)" }
  - { id: ERR_INSUFFICIENT_FUND_CAPITAL, http: 422, condition: "investment_amount_cents > Fund.available_capital_cents at present/represent" }
  - { id: ERR_PROCEEDS_INSUFFICIENT, http: 422, condition: "net_proceeds_cents < 0 at finalize" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "Property owner seeking a home-equity investment"
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /hei/applications — create own application (homeowner_id == X-User-ID)"
      - "POST /hei/applications/{id}/submit"
      - "POST /hei/applications/{id}/withdraw"
      - "POST /hei/offers/{id}/accept"
      - "POST /hei/offers/{id}/decline"
      - "POST /hei/offers/{id}/counter"
      - "POST /hei/agreements/{id}/initiate-exit"
      - "POST /hei/settlements/{id}/dispute"
    shared_operations:
      - "All GET reads"

  - name: InvestmentAnalyst
    description: "Underwrites applications, orders valuations, presents offers, schedules appraisals/inspections"
    identity: "opaque"
    exclusive_operations:
      - "POST /hei/funds"
      - "POST /hei/homeowners"
      - "POST /hei/applications/{id}/decision"
      - "POST /hei/applications/{id}/valuations"
      - "POST /hei/appraisers"
      - "POST /hei/appraisal-appointments"
      - "POST /hei/appraisal-appointments/{id}/cancel"
      - "POST /hei/applications/{id}/offers"
      - "POST /hei/offers/{id}/represent"
      - "POST /hei/offers/{id}/withdraw"
      - "POST /hei/inspectors"
      - "POST /hei/inspections/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /hei/agreements/{id}/inspections (with ClosingAgent)"
      - "All GET reads"

  - name: Appraiser
    description: "Completes in-person appraisals"
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /hei/appraisal-appointments/{id}/complete"
    shared_operations:
      - "All GET reads"

  - name: ClosingAgent
    description: "Records liens/title and activates funded agreements"
    identity: "opaque"
    exclusive_operations:
      - "POST /hei/liens/{id}/record"
      - "POST /hei/agreements/{id}/activate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /hei/agreements/{id}/inspections (with InvestmentAnalyst)"
      - "All GET reads"

  - name: Inspector
    description: "Completes maintenance-covenant inspections"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /hei/inspections/{id}/complete"
    shared_operations:
      - "All GET reads"

  - name: ComplianceOfficer
    description: "Proposes/finalizes settlements, resolves disputes, declares default; SoD applies"
    identity: "opaque"
    exclusive_operations:
      - "POST /hei/agreements/{id}/settlements"
      - "POST /hei/agreements/{id}/default"
      - "POST /hei/settlements/{id}/finalize"
      - "POST /hei/disputes/{id}/resolve"
      - "POST /hei/disputes/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"

