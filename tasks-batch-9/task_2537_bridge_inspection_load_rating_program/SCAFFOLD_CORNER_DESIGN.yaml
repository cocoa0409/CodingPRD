      - name: inspection_accept_publishes_ratings_and_seeds_candidate
        excluded_because:
          difficulty_instance: inspection_accept_cascade_bridge_interval_candidate_cycle
          rationale: "The IN_QA -> ACCEPTED edge and its five-hop publish cascade (Bridge ratings, interval and due date, auto candidate, cycle counters) are asserted end-to-end by that transitive_cascade instance; repeating the edge here would duplicate the same trigger and the same post-state."

      - name: critical_finding_status_dimensions_move_independently
        excluded_because:
          difficulty_instance: critical_finding_independent_status_dimensions
          rationale: "The three-dimension CriticalFinding machine (finding_status, notification_status, restriction_action) is exercised dimension-by-dimension by that non_linear_state_machine instance, including the resolve precondition on the notification chain."

      - name: inspection_return_revision_loop_second_pass
        excluded_because:
          difficulty_instance: inspection_qa_return_revision_cycle_second_pass
          rationale: "The IN_QA -> DRAFT return edge, the returned_count increment and the qa_escalation_required flip on the second return are the whole subject of that non_linear_state_machine instance."

      - name: permit_application_revoked_when_route_bridge_closes
        excluded_because:
          difficulty_instance: finding_closure_cascade_posture_permit_analysis_revocation
          rationale: "The system-event edges APPROVED -> REVOKED and APPROVED_WITH_CONDITIONS -> REVOKED fire only from the closure cascade that instance drives, and it already asserts the analysis flip, the recommended_decision recomputation and revoked_at."

  # ===========================================================================
  - section: calculations
    instances:
      - name: bridge_health_index_rounds_each_element_before_averaging
        claim_type: correct_result
        grounds:
          - calculations.element_health_index
          - calculations.bridge_health_index
          - calculations.nbi_component_rating
          - calculations.bridge_deficiency_pct
        distinguishing_aspect: "The canonical four-element report pins the whole condition chain in one submit: element indices 82.00 / 40.00 / 50.00 / 95.00, group indices 82.00 / 42.86 / 95.00, NBI ratings 7 / 3 / 8, min_nbi_rating 3, bridge_health_index 65.47 from re-normalised weights over the ROUNDED element indices, and deficiency_pct 30.73 over mixed units."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z for the field work, advanced to 2026-09-02T12:00:00Z before submit."
            - "Ivy Inspector leads a ROUTINE inspection of Cedar Creek Bridge with four element rows: DECK 1000 (600/200/150/50), GIRDER 300 (0/100/100/100), BEARING 4 (0/2/1/1), ABUTMENT 4 (3/1/0/0). Weight sum is 0.30 + 0.25 + 0.10 + 0.10 = 0.75, so no element is silently scored zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 3, defect_notes: "Frozen rocker bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { bhi: $.data.bridge_health_index }
          assert:
            - "HTTP 200; Inspection.${ins_id}.status == SUBMITTED with submitted_at == 2026-09-02T12:00:00Z"
            - "The four ElementCondition rows report element_health_index 82.00 (DECK), 40.00 (GIRDER), 50.00 (BEARING) and 95.00 (ABUTMENT)"
            - "Inspection.${ins_id}.deck_group_ehi == 82.00, superstructure_group_ehi == 42.86 ((0.25*40.00 + 0.10*50.00)/0.35 = 42.857142... rounded), substructure_group_ehi == 95.00"
            - "Inspection.${ins_id}.computed_deck_rating == 7, computed_superstructure_rating == 3, computed_substructure_rating == 8 from the descending >= ladder"
            - "Inspection.${ins_id}.bridge_health_index == 65.47 (score_sum 49.10 / weight_sum 0.75 = 65.4666...); averaging the UNROUNDED element indices and rounding once at the end is the wrong order and is not what the value shows"
            - "Inspection.${ins_id}.reported_quantity_total == 1308, deficient_quantity_total == 402, quantity_balanced == true"
            - "Inspection.${ins_id} deficiency reported on the bridge after acceptance is 30.73 (100*402/1308 = 30.7339...), summing SQM, M and EA as bare numbers per the declared convention"

