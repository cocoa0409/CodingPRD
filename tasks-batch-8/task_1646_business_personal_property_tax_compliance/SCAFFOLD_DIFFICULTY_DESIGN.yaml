        grounds:
          - state_machines.Rendition.FILED_to_AMENDMENT_OPEN
          - state_machines.Rendition.AMENDMENT_OPEN_to_FILED
        distinguishing_aspect: |
          The Rendition machine is cyclic (FILED -> AMENDMENT_OPEN -> FILED via
          re-file), not a linear pipeline: after the cycle the rendition is
