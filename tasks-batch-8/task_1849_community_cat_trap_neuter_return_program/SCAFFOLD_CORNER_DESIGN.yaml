scaffold_corner_design:
- section: entities
  instances:
  - name: caretaker_creation_defaults_and_response
    claim_type: creation
    grounds:
    - entities.Caretaker
    distinguishing_aspect: POST /tnr/caretakers with required fields returns 201, status defaults to ACTIVE, certified_tnr defaults to false, and system fields (id/created_at/updated_at/version=1) are present.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /tnr/caretakers
        payload:
          full_name: New Carer
          phone: 555-100
          email: new@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      assert:
      - Caretaker.${ct}.status == ACTIVE
      - Caretaker.${ct}.certified_tnr == false
      - Caretaker.${ct}.version == 1
  - name: caretaker_missing_email_rejected
    claim_type: required_fields
    grounds:
    - entities.Caretaker.fields.email
    distinguishing_aspect: Omitting the required email field on caretaker creation is rejected with a request-level 400/422 error.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /tnr/caretakers
        payload:
          full_name: No Mail
          phone: 555-101
        as: ProgramCoordinator
      assert:
      - response is an error envelope with http status in {400, 422}
  - name: cat_is_kitten_computed_from_age
    claim_type: computed_fields
    grounds:
    - entities.Cat.fields.is_kitten
    distinguishing_aspect: 'is_kitten is computed from approximate_age_months < 6: a cat created with 5 months shows is_kitten true, one with 6 months shows false (boundary).'
    test_recipe:
      setup:
      - caretaker and colony exist
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Kit Comp
          phone: 555-102
          email: kit2@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Comp Col
          address: 1 Comp
          caretaker_id: ${ct}
          estimated_population: 2
        as: ProgramCoordinator
        captures:
          col: $.data.id
      trigger:
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: K5
          sex: MALE
          approximate_age_months: 5
        as: ProgramCoordinator
        captures:
          k5: $.data.id
          k5_kit: $.data.is_kitten
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: K6
          sex: FEMALE
          approximate_age_months: 6
        as: ProgramCoordinator
        captures:
          k6: $.data.id
          k6_kit: $.data.is_kitten
      assert:
      - Cat.${k5}.is_kitten == true
      - Cat.${k6}.is_kitten == false (6 is NOT < 6)
  - name: colony_not_found
    claim_type: not_found
    grounds:
    - entities.Colony
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /tnr/colonies/{random-uuid} returns 404 ERR_NOT_FOUND in the error envelope.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /tnr/colonies/00000000-0000-0000-0000-000000000000
        payload: {}
        as: ProgramCoordinator
      assert:
      - response error_id == ERR_NOT_FOUND with http 404
  - name: colonies_list_pagination_envelope
    claim_type: listing
    grounds:
    - entities.Colony
    - response_envelope
    distinguishing_aspect: GET /tnr/colonies?limit=1 returns the pagination fields limit/offset/total_count/has_more with has_more true when 2 colonies exist.
    test_recipe:
      setup:
      - two colonies exist
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Page Ner
          phone: 555-103
          email: page@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: P Col 1
          address: 1 P
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
      - call: POST /tnr/colonies
        payload:
          name: P Col 2
          address: 2 P
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
      trigger:
      - call: GET /tnr/colonies
        payload:
          limit: 1
          offset: 0
        as: ProgramCoordinator
      assert:
      - response contains limit/offset/total_count/has_more
      - total_count == 2 and has_more == true
  - name: population_survey_immutable_no_version
    claim_type: immutability
    grounds:
    - entities.PopulationSurvey
    distinguishing_aspect: 'PopulationSurvey has common_fields: false — response carries id and created_at but no version/updated_at, and no update endpoint exists.'
    test_recipe:
      setup:
      - colony exists
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Imm Ut
          phone: 555-104
          email: imm@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Imm Col
          address: 1 Imm
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      trigger:
      - call: POST /tnr/colonies/${col}/population-surveys
        payload:
          surveyed_on: '2026-08-01T00:00:00Z'
          observed_count: 5
          eartipped_count: 2
        as: ProgramCoordinator
        captures:
          sv: $.data.id
      assert:
      - PopulationSurvey.${sv} has id and created_at but no version field
  - name: complaint_severity_derived_from_category
    claim_type: computed_fields
    grounds:
    - entities.Complaint.fields.severity
    distinguishing_aspect: 'Complaint severity is derived: PROPERTY_DAMAGE yields HIGH while NOISE yields STANDARD, regardless of any client-supplied severity.'
    test_recipe:
      setup:
      - colony exists
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Sev Erity
          phone: 555-105
          email: sev@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: Sev Col
          address: 2 Sev
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      trigger:
      - call: POST /tnr/colonies/${col}/complaints
        payload:
          complainant_name: N1
          category: PROPERTY_DAMAGE
        as: AnimalControlOfficer
        captures:
          c_high: $.data.id
      - call: POST /tnr/colonies/${col}/complaints
        payload:
          complainant_name: N2
          category: NOISE
        as: AnimalControlOfficer
        captures:
          c_std: $.data.id
      assert:
      - Complaint.${c_high}.severity == HIGH
      - Complaint.${c_std}.severity == STANDARD
  - name: cat_intake_tag_unique_per_colony
    claim_type: type_constraints
    grounds:
    - entities.Cat.fields.intake_tag
    - errors[ERR_UNIQUENESS_VIOLATION]
    distinguishing_aspect: Duplicate intake_tag within the same colony is rejected with 409 ERR_UNIQUENESS_VIOLATION; the same tag in a DIFFERENT colony is accepted.
    test_recipe:
      setup:
      - one caretaker with two colonies
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Tag Ger
          phone: 555-106
          email: tag@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: T Col 1
          address: 1 T
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col1: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: T Col 2
          address: 2 T
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col2: $.data.id
      - call: POST /tnr/colonies/${col1}/cats
        payload:
          intake_tag: DUP
          sex: MALE
          approximate_age_months: 12
        as: ProgramCoordinator
      trigger:
      - call: POST /tnr/colonies/${col1}/cats
        payload:
          intake_tag: DUP
          sex: FEMALE
          approximate_age_months: 12
        as: ProgramCoordinator
      - call: POST /tnr/colonies/${col2}/cats
        payload:
          intake_tag: DUP
          sex: FEMALE
          approximate_age_months: 12
        as: ProgramCoordinator
        captures:
          ok_cat: $.data.id
      assert:
      - first trigger call returns ERR_UNIQUENESS_VIOLATION 409
      - second trigger call succeeds (201) — uniqueness is scoped per colony
  - name: fk_reverse_reachability_slots_and_cats
    claim_type: parent_relationships
    grounds:
    - entities.ClinicSlot.fields.clinic_day_id
    - entities.Cat.fields.colony_id
    distinguishing_aspect: 'Every FK has a reverse GET: clinic day''s slots list and colony''s cats list return the children created under them.'
    test_recipe:
      setup:
      - clinic day with auto-created slots; colony with one cat
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Rev Reach
          phone: 555-107
          email: rev@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: R Col
          address: 1 R
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: R1
          sex: MALE
          approximate_age_months: 12
        as: ProgramCoordinator
        captures:
          cat: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: RevVet
          voucher_reimbursement_cents: 5000
        as: ProgramCoordinator
        captures:
          clin: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin}
          service_date: '2026-08-30T00:00:00Z'
          base_capacity: 3
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day: $.data.id
      trigger:
      - call: GET /tnr/colonies/${col}/cats
        payload: {}
        as: ProgramCoordinator
      - call: GET /tnr/clinic-days/${day}/slots
        payload: {}
        as: ClinicStaff
      assert:
      - colony cats list contains Cat.${cat}
      - clinic day slots list has length 3 with slot_index 1,2,3, all status OPEN
- section: state_machines
  instances:
  - name: cat_initial_state_at_large
    claim_type: initial_state
    grounds:
    - state_machines.Cat
    distinguishing_aspect: A newly created cat starts in AT_LARGE with ear_tipped=false, vaccinated_rabies=false, pathway=null.
    test_recipe:
      setup:
      - colony exists
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Ini Tial
          phone: 555-108
          email: ini@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: I Col
          address: 1 I
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      trigger:
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: I1
          sex: UNKNOWN
          approximate_age_months: 12
        as: ProgramCoordinator
        captures:
          cat: $.data.id
      assert:
      - Cat.${cat}.status == AT_LARGE
      - Cat.${cat}.ear_tipped == false and vaccinated_rabies == false and pathway == null
  - name: cancel_completed_appointment_invalid
    claim_type: invalid_transition
    grounds:
    - state_machines.TrappingAppointment
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Cancelling a COMPLETED appointment (terminal) fails with ERR_INVALID_STATE; no slot or voucher side effects fire.
    test_recipe:
      setup:
      - appointment driven through to COMPLETED via surgery
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Term Inal
          phone: 555-109
          email: term@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: T Col
          address: 1 T
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: TC1
          sex: MALE
          approximate_age_months: 24
        as: ProgramCoordinator
        captures:
          cat: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: TermVet
          voucher_reimbursement_cents: 5000
        as: ProgramCoordinator
        captures:
          clin: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin}
          service_date: '2026-08-14T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day: $.data.id
      - call: GET /tnr/clinic-days/${day}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot: $.data[0].id
      - call: GET /tnr/clinic-days/${day}
        payload: {}
        as: ClinicStaff
        captures:
          day_v0: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat}
          clinic_slot_id: ${slot}
          trap_date: '2026-08-13T00:00:00Z'
          expected_clinic_day_version: ${day_v0}
        as: Caretaker
        as_user_id: ${ct}
        captures:
          appt: $.data.id
      - call: POST /tnr/appointments/${appt}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct}
      - call: POST /tnr/appointments/${appt}/check-in
        payload: {}
        as: ClinicStaff
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      trigger:
      - call: POST /tnr/appointments/${appt}/cancel
        payload: {}
        as: Caretaker
        as_user_id: ${ct}
      assert:
      - response error_id == ERR_INVALID_STATE with http 409
      - ClinicSlot.${slot}.status remains USED
  - name: escalate_standard_complaint_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Complaint.OPEN_to_ESCALATED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Escalation requires severity == HIGH; escalating a STANDARD (NOISE) complaint is rejected.
    test_recipe:
      setup:
      - colony with a NOISE complaint
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Esc Alate
          phone: 555-110
          email: esc@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: E Col
          address: 1 E
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/complaints
        payload:
          complainant_name: N
          category: NOISE
        as: AnimalControlOfficer
        captures:
          cmp: $.data.id
      trigger:
      - call: POST /tnr/complaints/${cmp}/escalate
        payload: {}
        as: AnimalControlOfficer
      assert:
      - response is an error (ERR_INVALID_STATE 409) — STANDARD severity cannot escalate
  - name: escalated_complaint_officer_cannot_resolve
    claim_type: guarded_transitions
    grounds:
    - state_machines.Complaint.ESCALATED_to_RESOLVED
    distinguishing_aspect: An ESCALATED complaint can only be resolved by ProgramCoordinator; AnimalControlOfficer resolving an ESCALATED complaint is rejected even though officers resolve IN_MEDIATION
      ones.
    test_recipe:
      setup:
      - colony with an ESCALATED complaint
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Esc Two
          phone: 555-111
          email: esc2@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: E2 Col
          address: 2 E
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/complaints
        payload:
          complainant_name: N
          category: WILDLIFE_CONFLICT
        as: AnimalControlOfficer
        captures:
          cmp: $.data.id
      - call: POST /tnr/complaints/${cmp}/escalate
        payload: {}
        as: AnimalControlOfficer
      trigger:
      - call: POST /tnr/complaints/${cmp}/resolve
        payload: {}
        as: AnimalControlOfficer
      assert:
      - response is an error (ERR_INVALID_STATE 409) — officer resolve only valid from IN_MEDIATION
  - name: adoption_fallthrough_returns_to_decision_point
    claim_type: valid_transition
    grounds:
    - state_machines.Cat.ADOPTION_PIPELINE_to_POST_SURGERY
    distinguishing_aspect: An adult in ADOPTION_PIPELINE can be sent back to POST_SURGERY (adoption fall-through) via decide-pathway with RETURN_TO_FIELD; a subsequent RETURN_TO_FIELD decision from POST_SURGERY
      then lands in RETURNED.
    test_recipe:
      setup:
      - adult cat in ADOPTION_PIPELINE
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Fall Through
          phone: 555-112
          email: fall@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: F Col
          address: 1 F
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: F1
          sex: MALE
          approximate_age_months: 30
        as: ProgramCoordinator
        captures:
          cat: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: FallVet
          voucher_reimbursement_cents: 5000
        as: ProgramCoordinator
        captures:
          clin: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin}
          service_date: '2026-08-16T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day: $.data.id
      - call: GET /tnr/clinic-days/${day}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot: $.data[0].id
      - call: GET /tnr/clinic-days/${day}
        payload: {}
        as: ClinicStaff
        captures:
          day_v1: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat}
          clinic_slot_id: ${slot}
          trap_date: '2026-08-15T00:00:00Z'
          expected_clinic_day_version: ${day_v1}
        as: Caretaker
        as_user_id: ${ct}
        captures:
          appt: $.data.id
      - call: POST /tnr/appointments/${appt}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct}
      - call: POST /tnr/appointments/${appt}/check-in
        payload: {}
        as: ClinicStaff
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      - call: GET /tnr/cats/${cat}
        payload: {}
        as: ProgramCoordinator
        captures:
          cat_v: $.data.version
      - call: POST /tnr/cats/${cat}/decide-pathway
        payload:
          pathway: ADOPTION
          expected_cat_version: ${cat_v}
        as: ProgramCoordinator
      trigger:
      - call: GET /tnr/cats/${cat}
        payload: {}
        as: ProgramCoordinator
        captures:
          cat_v2: $.data.version
      - call: POST /tnr/cats/${cat}/decide-pathway
        payload:
          pathway: RETURN_TO_FIELD
          expected_cat_version: ${cat_v2}
        as: ProgramCoordinator
        captures:
          st: $.data.status
      - call: GET /tnr/cats/${cat}
        payload: {}
        as: ProgramCoordinator
        captures:
          cat_v3: $.data.version
      - call: POST /tnr/cats/${cat}/decide-pathway
        payload:
          pathway: RETURN_TO_FIELD
          expected_cat_version: ${cat_v3}
        as: ProgramCoordinator
        captures:
          st2: $.data.status
      assert:
      - first decide-pathway lands cat in POST_SURGERY (fall-through)
      - second decide-pathway lands cat in RETURNED with pathway == RETURN_TO_FIELD
  - name: confirm_long_term_requires_qualifying_survey
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Cat.RETURNED_to_COLONY_STERILIZED
    distinguishing_aspect: confirm-long-term fails when no PopulationSurvey exists for the colony; succeeds after a survey with eartipped_count >= 1.
    test_recipe:
      setup:
      - cat in RETURNED
      setup_api_calls:
      - call: POST /tnr/caretakers
        payload:
          full_name: Conf Irm
          phone: 555-113
          email: conf@x.com
        as: ProgramCoordinator
        captures:
          ct: $.data.id
      - call: POST /tnr/colonies
        payload:
          name: C Col
          address: 1 C
          caretaker_id: ${ct}
          estimated_population: 1
        as: ProgramCoordinator
        captures:
          col: $.data.id
      - call: POST /tnr/colonies/${col}/cats
        payload:
          intake_tag: C1
          sex: MALE
          approximate_age_months: 24
        as: ProgramCoordinator
        captures:
          cat: $.data.id
      - call: POST /tnr/partner-clinics
        payload:
          name: ConfVet
          voucher_reimbursement_cents: 5000
        as: ProgramCoordinator
        captures:
          clin: $.data.id
      - call: POST /tnr/clinic-days
        payload:
          clinic_id: ${clin}
          service_date: '2026-08-17T00:00:00Z'
          base_capacity: 1
          surge_capacity: 0
        as: ClinicStaff
        captures:
          day: $.data.id
      - call: GET /tnr/clinic-days/${day}/slots
        payload: {}
        as: ClinicStaff
        captures:
          slot: $.data[0].id
      - call: GET /tnr/clinic-days/${day}
        payload: {}
        as: ClinicStaff
        captures:
          day_v2: $.data.version
      - call: POST /tnr/appointments
        payload:
          cat_id: ${cat}
          clinic_slot_id: ${slot}
          trap_date: '2026-08-16T00:00:00Z'
          expected_clinic_day_version: ${day_v2}
        as: Caretaker
        as_user_id: ${ct}
        captures:
          appt: $.data.id
      - call: POST /tnr/appointments/${appt}/mark-trapped
        payload: {}
        as: Caretaker
        as_user_id: ${ct}
      - call: POST /tnr/appointments/${appt}/check-in
        payload: {}
        as: ClinicStaff
      - call: POST /tnr/surgery-records
        payload:
          appointment_id: ${appt}
          surgeon_initials: DR
          ear_tipped: true
          rabies_vaccinated: true
          outcome: STERILIZED
        as: ClinicStaff
      - call: GET /tnr/cats/${cat}
        payload: {}
        as: ProgramCoordinator
        captures:
          cv: $.data.version
      - call: POST /tnr/cats/${cat}/decide-pathway
        payload:
          pathway: RETURN_TO_FIELD
          expected_cat_version: ${cv}
