              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_RESOURCE_NOT_FOUND"
            - "${err} is not ERR_REFERENCED_ENTITY_NOT_FOUND and not ERR_STALE_ROUTE_VERSION (existence outranks both)"
