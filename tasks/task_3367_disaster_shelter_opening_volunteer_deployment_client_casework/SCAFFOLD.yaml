    input: [client_id, "requested_bed_code?", occupied_from_at, "occupied_until_at?", functional_needs_flag, "reunification_reference?"]
    output: ShelterRegistration
    side_effects: ["dormitory_bed_assignment selects dormitory_bed_code when requested_bed_code is omitted", "status=REGISTERED, reunification_status=PENDING when reunification_reference is present else NOT_REQUESTED", "shelter_occupancy_counts recomputed", "ShelterOperation.posture re-evaluated against capacity and staffing_sufficiency", "increments ShelterOperation.version by 1"]
  - method: POST
    path: "/api/v1/shelter-registrations/{id}/check-out"
