            - "first close: HTTP 200 with status == COMPLETED, outcome == CONTACTED, units_reserved still 2 (consumed, not released), Provider.${n2_id}.open_task_count == 0, remaining budget still 36"
            - "second close: HTTP 409 with data.error_id == ERR_TASK_INVALID_STATE and status still COMPLETED"

