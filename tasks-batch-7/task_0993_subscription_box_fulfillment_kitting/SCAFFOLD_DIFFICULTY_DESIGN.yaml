            - { call: "POST /import-batches/${tc1_ib}/commit", as: ClientOps, as_user_id: "${tc1_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${tc1_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { tc1_rn: $.data.id }
            - { call: "POST /assembly-runs/${tc1_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${tc1_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${tc1_rn}/complete-kitting", payload: { actual_kitted_count: 2 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${tc1_rn}/shipments"
