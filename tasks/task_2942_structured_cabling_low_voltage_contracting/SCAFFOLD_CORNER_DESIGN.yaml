      - name: recording_gap_is_reported_before_the_segregation_of_duties_bar
        claim_type: priority_conflict
        grounds: ["validations[priority=56]", "validations[priority=70]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / link_not_recorded_rejects_before_segregation_of_duties
          rationale: "The 56-before-70 pair, both violated on one certify call, is asserted by the named §1.8 instance."

      - name: plenum_rating_is_reported_before_the_fill_overflow
        claim_type: priority_conflict
        grounds: ["validations[priority=80]", "validations[priority=185]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / plenum_rating_rejects_before_pathway_fill_overflow
          rationale: "The 80-before-185 pair on a single route request is asserted by the named §1.8 instance."

      - name: room_window_conflict_is_reported_before_the_mac_budget
        claim_type: priority_conflict
        grounds: ["validations[priority=170]", "validations[priority=200]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / room_window_conflict_rejects_before_mac_budget_exhaustion
          rationale: "The 170-before-200 pair on a single schedule request, and the ERR_MAC_BUDGET_EXCEEDED satisfaction path, are asserted by the named §1.8 instance."

      - name: termination_requires_a_compliant_room_grounding_status
        claim_type: cross_entity_validation
        grounds: ["validations[priority=90]", "errors[ERR_ROOM_NOT_GROUNDED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / link_termination_depends_on_telecom_room_grounding_status
          rationale: "Both the refused and the admitted branch of the grounding dependency are asserted by the named §1.8 instance."

      - name: mac_tickets_require_an_occupied_project
        claim_type: cross_entity_validation
        grounds: ["validations[priority=125]", "errors[ERR_PROJECT_NOT_OCCUPIED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mac_ticket_creation_depends_on_project_occupancy_status
          rationale: "The pre-occupancy refusal and the post-occupancy acceptance are asserted by the named §1.8 instance."

      - name: buffered_room_windows_refuse_the_third_overlapping_crew
        claim_type: temporal_validation
