    side_effects: []

  - method: GET
    path: "/employers/{employerId}/ownership-changes"
    description: "List ownership changes for an employer"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OwnershipChange[]"
    side_effects: []

  - method: GET
    path: "/employers/{employerId}/assigned-risk-enrollments"
    description: "List assigned risk enrollments for an employer"
