            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/suspend", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/incidents", payload: { severity: "MINOR", kind: "EQUIPMENT", description: "Retrieval winch inspection flag" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { inc: "$.data.id" } }
            - { call: "POST /rescue-ops/incidents/${inc}/triage", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}" }
            - { call: "POST /rescue-ops/incidents/${inc}/resolve", payload: { resolution_notes: "Winch re-inspected, no defect" }, as: SafetyOfficer, as_user_id: "${so_id}" }
            - { call: "POST /rescue-ops/incidents/${inc}/reopen", payload: { reason: "Second defect found on re-test" }, as: SafetyOfficer, as_user_id: "${so_id}" }
            - { call: "POST /rescue-ops/incidents/${inc}/triage", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}", captures: { inc_status: "$.data.status" } }
          assert:
            - "Incident.${inc}.status == TRIAGED after traversing REPORTED -> TRIAGED -> RESOLVED -> REOPENED -> TRIAGED"
            - "Incident.${inc}.escalation_level == 0 (escalate was never invoked)"
            - "Incident.${inc}.resolved_by == ${so_id} and reported_by == ${sup_id} (segregation held during the loop)"
            - "EntryPermit.${per}.status == SUSPENDED (incident on an already-suspended permit fires no cascade)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: alarm_reading_three_hop_cascade
        grounds:
          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
          - state_machines.RosterEntry.ON_DUTY_to_EVACUATED
          - state_machines.StandbyAssignment.ON_STANDBY_to_DEPLOYED
          - "endpoints[POST /rescue-ops/entry-permits/{permitId}/atmospheric-readings]"
        distinguishing_aspect: |
          Trigger = out-of-limits CONTINUOUS reading. Depth 3: reading mutates the
          permit (ACTIVE->SUSPENDED); the permit's suspension mutates each ON_DUTY
          RosterEntry (->EVACUATED); each evacuation mutates the permit's ON_STANDBY
          StandbyAssignment (->DEPLOYED). Each hop is caused by the previous hop, not
          by the reading directly. A sibling Incident (ATMOSPHERE/CRITICAL since
          h2s 20 >= 20) is auto-created by the alarm.
        test_recipe:
          setup:
            - "ACTIVE permit (planned 05:00-20:00), attendant att1 and entrant ent1 both ON_DUTY (checked in 05:30), rescuer r1 ON_STANDBY (window 05:00-20:00)"
            - "Continuous monitoring flag irrelevant to this trigger; space max_entrants 2, no isolation required"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent One", role_qualifications: [] }, as: OperationsManager, captures: { ent_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Cascade Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-A", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Alarm job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${att_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_att: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_ent: "$.data.id" } }
            - { call: "POST /rescue-ops/roster-entries/${ro_att}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/roster-entries/${ro_ent}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 21.0, lel_pct: 5, h2s_ppm: 20, co_ppm: 10 }, as: Attendant, as_user_id: "${att_id}", captures: { reading_within: "$.data.within_limits" } }
            - { call: "GET /rescue-ops/entry-permits/${per}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per_after: "$.data.status" } }
            - { call: "GET /rescue-ops/roster-entries/${ro_ent}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ent_after: "$.data.status" } }
            - { call: "GET /rescue-ops/standby-assignments/${sa}", as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_after: "$.data.status" } }
            - { call: "GET /rescue-ops/incidents?permit_id=${per}", as: OperationsManager, captures: { inc_kind: "$.data[0].kind", inc_sev: "$.data[0].severity" } }
          assert:
            - "AtmosphericReading.within_limits == false (h2s 20 > 10)"
            - "Hop 1: EntryPermit.${per}.status == SUSPENDED and suspension_count == 1"
            - "Hop 2: RosterEntry.${ro_ent}.status == EVACUATED with checked_out_at == reading timestamp; RosterEntry.${ro_att} also EVACUATED"
            - "Hop 3: StandbyAssignment.${sa}.status == DEPLOYED with deployed_at set (caused by the evacuation, not by the reading directly)"
            - "Auto-created Incident exists with kind == ATMOSPHERE, severity == CRITICAL (h2s 20 >= 20), status == REPORTED, reported_by == ${att_id}"

      - name: incident_escalation_two_hop_cascade
        grounds:
          - state_machines.Incident.TRIAGED_to_ESCALATED
          - state_machines.EntryPermit.SUSPENDED_to_CANCELLED
          - state_machines.IsolationVerification.VERIFIED_to_VOIDED
        distinguishing_aspect: |
          Trigger = incident escalation (DIFFERENT trigger from the alarm reading).
          Depth 2: escalate mutates the permit (SUSPENDED->CANCELLED, close_reason
          INCIDENT); the permit's cancellation then mutates its children — SCHEDULED
          roster entry -> CANCELLED, SCHEDULED standby -> CANCELLED, ON_STANDBY
          standby -> DEPLOYED, VERIFIED isolation -> VOIDED. CRITICAL severity also
          flips the space to OUT_OF_SERVICE.
        test_recipe:
          setup:
            - "Permit manually SUSPENDED at 10:00 (nobody ON_DUTY), one SCHEDULED roster entry (11:00-19:00), one ON_STANDBY assignment (r1, 05:00-20:00), one SCHEDULED assignment (r2, 11:00-20:00), one VERIFIED VENTILATION isolation"
            - "Incident (severity CRITICAL, kind ENTRAPMENT) reported on the suspended permit and triaged"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent One", role_qualifications: [] }, as: OperationsManager, captures: { ent_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer Two", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Escalation Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-X", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: true, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Escalation job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/isolation-verifications", payload: { isolation_type: "VENTILATION", evidence_ref: "vent-photo-9" }, as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso: "$.data.id" } }
            - { call: "POST /rescue-ops/isolation-verifications/${iso}/verify", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa1: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa1}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r2_id}", standby_start_at: "2026-08-03T11:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T11:00:00Z", scheduled_end_at: "2026-08-03T19:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_ent: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per}/suspend", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/incidents", payload: { severity: "CRITICAL", kind: "ENTRAPMENT", description: "Ladder collapse at entry hatch" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { inc: "$.data.id" } }
            - { call: "POST /rescue-ops/incidents/${inc}/triage", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}" }
          trigger:
            - { call: "POST /rescue-ops/incidents/${inc}/escalate", payload: {}, as: SafetyOfficer, as_user_id: "${so_id}", captures: { inc_after: "$.data.status", inc_level: "$.data.escalation_level" } }
            - { call: "GET /rescue-ops/entry-permits/${per}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per_after: "$.data.status", per_reason: "$.data.close_reason" } }
            - { call: "GET /rescue-ops/roster-entries/${ro_ent}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_after: "$.data.status" } }
            - { call: "GET /rescue-ops/standby-assignments/${sa1}", as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa1_after: "$.data.status" } }
            - { call: "GET /rescue-ops/standby-assignments/${sa2}", as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa2_after: "$.data.status" } }
            - { call: "GET /rescue-ops/isolation-verifications/${iso}", as: SafetyOfficer, as_user_id: "${so_id}", captures: { iso_after: "$.data.status" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_after: "$.data.status" } }
          assert:
            - "Incident.${inc}.status == ESCALATED and escalation_level == 1"
            - "Hop 1: EntryPermit.${per}.status == CANCELLED with close_reason == INCIDENT"
            - "Hop 2: RosterEntry.${ro_ent}.status == CANCELLED (SCHEDULED child cancelled by the permit's cancellation)"
            - "Hop 2: StandbyAssignment.${sa2}.status == CANCELLED (SCHEDULED)"
            - "Hop 2: StandbyAssignment.${sa1}.status == DEPLOYED (ON_STANDBY escalates to DEPLOYED on the incident path)"
            - "Hop 2: IsolationVerification.${iso}.status == VOIDED"
            - "CRITICAL severity side effect: ConfinedSpace.${sp}.status == OUT_OF_SERVICE"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_error_precedes_safety_error
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.EntryPermit.ISSUED_to_ACTIVE
        distinguishing_aspect: |
          Error-category pair = state (priority 7) vs business_safety (priority 9).
          A DRAFT permit (state failure: ERR_PERMIT_INVALID_STATE) that ALSO lacks an
          APPROVED rescue plan (safety failure: ERR_RESCUE_PLAN_NOT_APPROVED) must
          fail with the state error, because state preconditions are evaluated first.
        test_recipe:
          setup:
            - "Account + space (no rescue plan at all) + permit left in DRAFT (issue never called)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Prio Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-P", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Prio job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PERMIT_INVALID_STATE (state category, priority 7)"
            - "error_id != ERR_RESCUE_PLAN_NOT_APPROVED even though no rescue plan exists (safety, priority 9 — evaluated later)"
            - "EntryPermit.${per}.status remains DRAFT"

      - name: roster_rest_gap_precedes_qualification_error
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - calculations.duty_window_rules
        distinguishing_aspect: |
          Error-category pair = business_temporal (priority 12) vs
          business_referential (priority 13) — DIFFERENT pair from
          activate_state_error_precedes_safety_error. A roster create that violates
          the 8h rest gap AND targets personnel lacking the ATTENDANT qualification
          must fail with ERR_INSUFFICIENT_REST, because temporal checks precede
          referential/qualification checks.
        test_recipe:
          setup:
            - "ISSUED permit (roster scheduling allowed in ISSUED)"
            - "Personnel p1 with role_qualifications [] (no ATTENDANT) already holding roster entry shift1 2026-08-03T06:00:00Z-12:00:00Z (ENTRANT)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Worker One", role_qualifications: [] }, as: OperationsManager, captures: { p1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Rest Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-R2", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 3, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Rest job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-04T20:00:00Z", expected_space_version: "${sp_v}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${p1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { shift1: "$.data.id" } }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${p1_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T15:00:00Z", scheduled_end_at: "2026-08-03T23:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INSUFFICIENT_REST (temporal, priority 12: 15:00 < 12:00 + 8h = 20:00)"
            - "error_id != ERR_PERSONNEL_NOT_QUALIFIED even though ${p1_id} lacks ATTENDANT qualification (referential, priority 13 — evaluated later)"
            - "No second RosterEntry is created for ${p1_id}"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: o2_inclusive_lower_boundary_alarm_flip
        grounds:
          - entities.AtmosphericReading.fields.within_limits
          - calculations.monitoring_gap_suspension
          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Metric = oxygen concentration (percent) on POST /atmospheric-readings.
          The acceptable band is INCLUSIVE: o2 19.5 is within limits (19.5 <= o2
          boundary satisfied) while o2 19.49 is out of limits and fires the alarm
          cascade. One 0.01 step flips both within_limits and the permit state.
        test_recipe:
          setup:
            - "ACTIVE permit (no roster, no standby needed beyond activation coverage), planned window 06:00-20:00"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Boundary Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-O2", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "O2 job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 19.5, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}", captures: { r1_within: "$.data.within_limits" } }
            - { call: "GET /rescue-ops/entry-permits/${per}", as: OperationsManager, captures: { per_mid: "$.data.status" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 19.49, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}", captures: { r2_within: "$.data.within_limits" } }
            - { call: "GET /rescue-ops/entry-permits/${per}", as: OperationsManager, captures: { per_final: "$.data.status" } }
          assert:
            - "Reading with o2_pct == 19.5 has within_limits == true (inclusive lower bound)"
            - "EntryPermit.${per}.status == ACTIVE after the 19.5 reading (no cascade)"
            - "Reading with o2_pct == 19.49 has within_limits == false"
            - "EntryPermit.${per}.status == SUSPENDED after the 19.49 reading (alarm cascade fired)"

      - name: max_entrants_inclusive_capacity_boundary
        grounds:
          - entities.ConfinedSpace.fields.max_entrants
          - validations[priority=11]
          - "endpoints[POST /rescue-ops/roster-entries/{id}/check-in]"
        distinguishing_aspect: |
          Metric = ON_DUTY entrant count (a cardinality, not a concentration) on
          POST /roster-entries/{id}/check-in — a DIFFERENT metric and endpoint from
          o2_inclusive_lower_boundary_alarm_flip. With max_entrants == 2 the second
          entrant check-in succeeds (count 1 < 2 before adding) and the third is
          rejected (count 2 >= 2).
        test_recipe:
          setup:
            - "ACTIVE permit on a space with max_entrants 2; attendant att1 ON_DUTY; three entrant roster entries (ent1, ent2, ent3) SCHEDULED 05:00-17:00"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent One", role_qualifications: [] }, as: OperationsManager, captures: { ent1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent Two", role_qualifications: [] }, as: OperationsManager, captures: { ent2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent Three", role_qualifications: [] }, as: OperationsManager, captures: { ent3_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Capacity Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-C2", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Capacity job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${att_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_att: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_e1: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent2_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_e2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${ent3_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_e3: "$.data.id" } }
            - { call: "POST /rescue-ops/roster-entries/${ro_att}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
