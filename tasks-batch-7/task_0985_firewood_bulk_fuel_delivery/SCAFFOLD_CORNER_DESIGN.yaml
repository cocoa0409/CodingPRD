              as: OperationsManager
              captures: { p_br_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { customer_id: "${cu_br_id}", delivery_street_address: "1 St", delivery_postal_code: "01010", requested_delivery_date: "2026-08-15", stacking_addon: true, lines: [{ product_id: "${p_br_id}", quantity: 2.0 }] }
              as: CustomerService
