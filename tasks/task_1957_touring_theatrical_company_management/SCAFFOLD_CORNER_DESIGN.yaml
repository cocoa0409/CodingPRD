  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_and_filtering
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /stops]"]
        distinguishing_aspect: "GET /stops honors limit/offset with total_count and has_more: 3 stops under one tour paginate 2+1; the tour_id filter isolates them from other tours' stops."
        test_recipe:
          setup: ["Tour with three TENTATIVE stops (non-overlapping weeks); a second tour with its own stop"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /tours"
              payload: { name: "Tour B", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_b: $.data.id, tour_bv: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { tour_v2: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-15", play_week_end: "2026-09-20", load_in_date: "2026-09-14", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v2}" }
              as: TourManager
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { tour_v3: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-22", play_week_end: "2026-09-27", load_in_date: "2026-09-21", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v3}" }
              as: TourManager
            - call: "POST /tours/${tour_b}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_bv}" }
              as: TourManager
          trigger:
            - call: "GET /stops"
              payload: { tour_id: "${tour_id}", status: TENTATIVE, limit: 2, offset: 0 }
              as: Producer
            - call: "GET /stops"
              payload: { tour_id: "${tour_id}", status: TENTATIVE, limit: 2, offset: 2 }
              as: Producer
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "Tour B's stop never appears under the tour_id filter"

      - name: envelope_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Success responses carry meta.api_request_id + response_type object; error responses carry response_type error and data.error_id/data.message."
        test_recipe:
          setup: ["One tour exists"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id }
          trigger:
            - call: "GET /tours/${tour_id}"
              as: Producer
            - call: "GET /stops/00000000-0000-0000-0000-000000000000"
              as: Producer
              captures: { eid: $.data.error_id }
          assert:
            - "Success: meta.api_request_id present, response_type == object, data is the Tour"
            - "Error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

      - name: fk_reverse_lists
        claim_type: parent_relationships
        grounds: ["endpoints[GET /tours/{id}/cast]", "endpoints[GET /tracks/{id}/coverages]", "endpoints[GET /cast/{id}/injuries]", "endpoints[GET /stops/{id}/settlement]"]
        distinguishing_aspect: "Every FK has a working reverse GET: cast by tour, coverages by track and by member, injuries by member; the 1:1 settlement sub-resource returns an empty array before the stop closes."
        test_recipe:
          setup: ["READY stop (no performances); principal P injured with understudy U ACTIVATED"]
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: $.data.id, tour_v: $.data.version }
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 1000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk: $.data.id }
            - call: "PUT /tech-checks/${chk}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "P", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { p: $.data.id }
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u: $.data.id }
            - call: "PUT /cast/${p}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${u}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Lead", required_covers: 1, principal_member_id: "${p}" }
              as: CompanyManager
              captures: { t: $.data.id }
            - call: "POST /tracks/${t}/coverages"
              payload: { cast_member_id: "${u}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
            - call: "POST /cast/${p}/injuries"
              payload: { notes: "ankle" }
              as: CompanyManager
          trigger:
            - call: "GET /tours/${tour_id}/cast"
              as: Producer
            - call: "GET /tracks/${t}/coverages"
              as: Producer
              captures: { cov_st: "$.data[0].status" }
            - call: "GET /cast/${p}/injuries"
              as: Producer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
          assert:
            - "GET /tours/{id}/cast returns 2 members"
            - "GET /tracks/{id}/coverages returns 1 coverage with status ACTIVATED"
            - "GET /cast/{p}/injuries returns 1 injury"
            - "GET /stops/{id}/settlement returns an empty array before close (0-1 cardinality)"

      - name: clock_set_endpoint_roundtrip
        claim_type: conditional_action
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The logical clock starts at the pinned default 2026-08-01T00:00:00Z (evidenced by cancellation tiers computed without any clock call in cancellation_penalty_tier_boundaries) and set_current_utc returns the new value."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: Producer
              captures: { now: $.data.current_utc }
          assert:
            - "Response current_utc == 2026-08-01T12:00:00Z"

      - name: venue_create_and_get
        claim_type: retrieval
        grounds: [entities.Venue, "endpoints[GET /venues/{venue_id}]"]
        distinguishing_aspect: "Venue tech specs persist verbatim and are readable."
        test_recipe:
          setup: ["empty DB"]
