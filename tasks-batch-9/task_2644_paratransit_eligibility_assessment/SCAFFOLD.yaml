scenario: |
  Generate task harder than expert level!

  2644. Paratransit Eligibility Assessment (transit agency accessibility office): application intake with
  functional ability questions and professional verification, in-person functional assessment scheduling with
  transportation provided, eligibility determination categories including unconditional, conditional and
  temporary with trip-by-trip conditions, determination timeline with presumptive eligibility on delay, appeal
  process with an independent reviewer and continued service during appeal, recertification cycles and condition
  changes, no-show and late-cancellation policy with suspension procedures and due process, visitor eligibility
  for out-of-area riders, coordination with travel training and fixed-route accessibility

domain_name: paratransit-eligibility-assessment
api_prefix: ""           # flat top-level collections, e.g.: /applicants, /applications, /determinations

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_deferred_actions        # logical clock + POST /_ops/day-close epoch advance
    - rate_threshold_triggers           # no-show points / ratio / 21-day statutory window boundaries
    - cascading_side_effects            # appeal remedy chain (depth 4), expiry chain (depth 3)
    - derived_field_reconciliation      # Applicant eligibility/service/conduct mirrors
    - optimistic_concurrency            # OCC on Application.version and Applicant.version

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; no entity is
  # addressed through a nested ownership path deeper than one sub-resource segment.

  state_machine_shape: parallel
  # FunctionalAssessment carries two independent state dimensions (attendance_status x
  # scoring_status); Application is cyclic (RETURNED_INCOMPLETE -> SUBMITTED, ASSESSMENT_SCHEDULED
  # -> ASSESSMENT_REQUIRED); Appeal and SuspensionProceeding are branching fork-joins.

  relationship_patterns:
    - one_to_many          # Applicant -> Application/TripEvent/SuspensionProceeding/VisitorEligibility
    - cross_aggregate      # Determination gates TravelTrainingReferral and VisitorEligibility
    - self_referential     # FunctionalAssessment.rescheduled_from_assessment_id -> FunctionalAssessment.id

  role_model: segregation_of_duties
  # The specialist who determines cannot review the appeal (ERR_REVIEWER_NOT_INDEPENDENT); the
  # evaluator who scores cannot sign off (ERR_SIGNOFF_NOT_INDEPENDENT); the officer who proposes a
  # suspension cannot decide it (ERR_DECIDER_NOT_INDEPENDENT).

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 57 endpoints / 13 calculations / 10 state-machine dimensions / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the person seeking paratransit eligibility.
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 calendar date (YYYY-MM-DD).
      - name: residence_zone
        type: enum
        source: input
        description: Whether the residence is inside the agency's ADA complementary service area.
        constraints: "IN_SERVICE_AREA | OUT_OF_SERVICE_AREA"
      - name: mobility_aid
        type: enum
        source: input
        default: NONE
        description: Primary mobility aid used outdoors; drives wheelchair-position safety checks.
        constraints: "NONE | CANE | WALKER | MANUAL_WHEELCHAIR | POWER_WHEELCHAIR | SCOOTER"
      - name: primary_language
        type: string
        source: input
        default: "EN"
        description: Notice language code.
      - name: home_agency_name
        type: string
        source: input
        default: null
        description: Certifying transit agency for out-of-area riders; null for local applicants.
      - name: current_eligibility_status
        type: enum
        source: computed
        default: NONE
        description: |
          Denormalized eligibility mirror maintained by side effects per calculations.applicant_eligibility_state.
        constraints: "NONE | PRESUMPTIVE | ELIGIBLE | INELIGIBLE | EXPIRED | VISITOR"
      - name: eligibility_category
        type: enum
        source: computed
        default: null
        description: Category of the governing Determination; null when current_eligibility_status is NONE/PRESUMPTIVE/EXPIRED.
        constraints: "UNCONDITIONAL | CONDITIONAL | TEMPORARY | INELIGIBLE | null"
      - name: active_determination_id
        type: string
        source: computed
        default: null
        description: |
          Denormalized pointer (NOT a declared FK): id of the Determination whose status == ISSUED for this
          applicant. The authoritative child->parent link is Determination.applicant_id; discover via
          GET /determinations?applicant_id=<id>&status=ISSUED.
      - name: service_status
        type: enum
        source: computed
        default: ACTIVE
        description: SUSPENDED while some SuspensionProceeding for this applicant has status == ACTIVE; else ACTIVE.
        constraints: "ACTIVE | SUSPENDED"
      - name: no_show_points_event_basis
        type: number
        source: computed
        default: 0
        description: Governing conduct points per calculations.no_show_points_balance variant event_date_basis.
      - name: no_show_points_report_basis
        type: number
        source: computed
        default: 0
        description: Reporting-only conduct points per calculations.no_show_points_balance variant report_date_basis.
      - name: chargeable_miss_count_90d
        type: integer
        source: computed
        default: 0
        description: Count of unexcused NO_SHOW + LATE_CANCEL TripEvents inside the event-basis conduct window.
      - name: scheduled_trip_count_90d
        type: integer
        source: computed
        default: 0
        description: Count of all TripEvents inside the event-basis conduct window (denominator of no_show_ratio_pct).
      - name: no_show_ratio_pct
        type: number
        source: computed
        default: 0.0
        description: Pooled miss percentage per calculations.no_show_ratio_pct; 0.0 when scheduled_trip_count_90d == 0.
      - name: prior_upheld_suspension_count
        type: integer
        source: computed
        default: 0
        description: Count of this applicant's SuspensionProceedings with decision == UPHELD and status IN {UPHELD_PENDING, ACTIVE, SERVED, VOID}.
      - name: suspension_days_ledger_total
        type: integer
        source: computed
        default: 0
        description: Conserved quantity per calculations.suspension_day_ledger — sum of days_served + days_forgiven over all this applicant's proceedings.
      - name: fixed_route_competency_confirmed
        type: boolean
        source: computed
        default: false
        description: true once a TravelTrainingReferral for this applicant reached COMPLETED with fixed_route_competency_score >= 80.
      - name: continued_service_during_appeal
        type: boolean
        source: computed
        default: false
        description: true while an Appeal for this applicant has status IN {FILED, REVIEWER_ASSIGNED, HEARING_SCHEDULED, HEARD}.

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the person the intake packet belongs to."
      - name: application_type
        type: enum
        source: input
        description: NEW for first-time certification, RECERTIFICATION for an expiring or expired determination.
        constraints: "NEW | RECERTIFICATION"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Intake workflow state per state_machines.Application.
        constraints: "DRAFT | SUBMITTED | RETURNED_INCOMPLETE | PENDING_VERIFICATION | ASSESSMENT_REQUIRED | ASSESSMENT_SCHEDULED | ASSESSMENT_COMPLETE | DETERMINED"
      - name: functional_answers
        type: object
        source: input
        description: |
          Functional ability questionnaire. Complete iff ALL five keys are present and non-null:
          can_board_bus_steps (boolean), can_navigate_unfamiliar_route (boolean),
          max_walk_distance_meters (integer >= 0), uses_mobility_aid_outdoors (boolean),
          has_cognitive_impairment (boolean).
      - name: claimed_conditions
        type: array
        source: input
        default: []
        description: Free-text condition labels the applicant claims; the verifying professional attests a subset.
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of the most recent successful submit.
      - name: completeness_established_at
        type: datetime
        source: computed
        default: null
        description: |
          Start of the statutory determination window. Set to submitted_at on every submit that passes the
          five-key completeness check; reset to null on return-incomplete; re-set (NOT preserved) on resubmit.
      - name: missing_items
        type: array
        source: computed
        default: []
        description: Item labels recorded by the most recent return-incomplete; cleared on the next submit.
      - name: resubmission_count
        type: integer
        source: computed
        default: 0
        description: Number of RETURNED_INCOMPLETE -> SUBMITTED cycles completed.
      - name: verification_excluded_days
        type: integer
        source: computed
        default: 0
        description: Cumulative whole days spent waiting on professional verification; excluded only by the net_agency variant.
      - name: applicant_delay_days
        type: integer
        source: computed
        default: 0
        description: Cumulative whole days between a NO_SHOW assessment's slot start and its replacement slot start; excluded only by the net_agency variant.
      - name: days_pending_statutory
        type: integer
        source: computed
        default: 0
        description: Governing elapsed-day count per calculations.application_pending_days variant statutory.
      - name: days_pending_net_agency
        type: integer
        source: computed
        default: 0
        description: Internal performance day count per calculations.application_pending_days variant net_agency.
      - name: determination_due_date
        type: string
        source: computed
        default: null
        description: completeness_established_at date + 21 days; null while completeness_established_at is null.
      - name: presumptive_granted_at
        type: datetime
        source: computed
        default: null
        description: Instant POST /_ops/day-close granted presumptive eligibility for this application.
      - name: attests_permanent
        type: boolean
        source: computed
        default: null
        description: Copied from the ProfessionalVerification whose status became RECEIVED; null until then.

  - name: ProfessionalVerification
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the intake packet this verification supports."
      - name: provider_name
        type: string
        source: input
        description: Name of the licensed professional asked to verify functional limitations.
      - name: provider_type
        type: enum
        source: input
        description: Discipline of the verifying professional.
        constraints: "PHYSICIAN | PHYSICAL_THERAPIST | OCCUPATIONAL_THERAPIST | PSYCHOLOGIST | SOCIAL_WORKER | OTHER"
      - name: provider_license_number
        type: string
        source: input
        description: License identifier recorded for audit.
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: Verification state per state_machines.ProfessionalVerification.
        constraints: "REQUESTED | RECEIVED | INSUFFICIENT"
      - name: requested_at
        type: datetime
        source: computed
        description: Logical-clock instant the request was recorded.
      - name: received_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the response was recorded (either outcome).
      - name: attests_conditions
        type: array
        source: input
        default: null
        description: Subset of Application.claimed_conditions the professional attests; required when outcome == ACCEPTED.
      - name: attests_permanent
        type: boolean
        source: input
        default: null
        description: Whether the attested limitation is permanent; required when outcome == ACCEPTED.
      - name: insufficiency_reason
        type: string
        source: input
        default: null
        description: Required when outcome == INSUFFICIENT.
      - name: wait_days
        type: integer
        source: computed
        default: 0
        description: floor whole days between requested_at and received_at; 0 while status == REQUESTED.

  - name: AssessmentSlot
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: Assessment center label.
      - name: site_is_wheelchair_accessible
        type: boolean
        source: input
        default: true
        description: false blocks scheduling applicants whose mobility_aid requires a wheelchair position.
      - name: evaluator_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the Evaluator who staffs this slot; never compared to any entity id.
      - name: starts_at
        type: datetime
        source: input
        description: Slot start instant (UTC).
      - name: ends_at
        type: datetime
        source: input
        description: Slot end instant (UTC); must be strictly after starts_at.
      - name: capacity
        type: integer
        source: input
        description: Maximum FunctionalAssessments bookable in this slot.
        constraints: ">= 1"
      - name: booked_count
        type: integer
        source: computed
        default: 0
        description: Count of FunctionalAssessments on this slot with attendance_status IN {SCHEDULED, ATTENDED}.
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: FULL iff booked_count == capacity, else OPEN.
        constraints: "OPEN | FULL"

  - name: FunctionalAssessment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the intake packet being assessed."
      - name: slot_id
        type: string
        source: input
        description: "FK -> AssessmentSlot.id; the in-person slot reserved for this assessment."
      - name: rescheduled_from_assessment_id
        type: string
        source: input
        default: null
        description: "FK -> FunctionalAssessment.id; null unless this assessment replaces a prior NO_SHOW or CANCELLED_BY_AGENCY assessment."
      - name: requires_wheelchair_position
        type: boolean
        source: input
        default: false
        description: Whether the rider needs a securement position on the provided ride and an accessible site.
      - name: attendance_status
        type: enum
        source: computed
        default: SCHEDULED
        description: Attendance dimension per state_machines.FunctionalAssessment (state_field attendance_status).
        constraints: "SCHEDULED | ATTENDED | NO_SHOW | CANCELLED_BY_AGENCY"
      - name: scoring_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: Scoring dimension per state_machines.FunctionalAssessment (state_field scoring_status).
        constraints: "NOT_STARTED | SCORED | SIGNED_OFF"
      - name: board_alight_score
        type: integer
        source: input
        default: null
        description: Observed ability to board/alight a fixed-route vehicle; 0 = unable, 4 = independent.
        constraints: "0..4"
      - name: wayfinding_score
        type: integer
        source: input
        default: null
        description: Observed ability to navigate an unfamiliar route; 0 = unable, 4 = independent.
        constraints: "0..4"
      - name: distance_meters_walked
        type: integer
        source: input
        default: null
        description: Distance walked unaided during the assessment, in whole meters.
        constraints: ">= 0"
      - name: heat_sensitivity_flag
        type: boolean
        source: input
        default: null
        description: Evaluator observation that heat materially degrades function.
      - name: evaluator_notes
        type: string
        source: input
        default: null
        description: Free-text observations.
      - name: recommended_category
        type: enum
        source: computed
        default: null
        description: Output of calculations.recommended_eligibility_category, written when scoring_status becomes SCORED.
        constraints: "UNCONDITIONAL | CONDITIONAL | TEMPORARY | INELIGIBLE | null"
      - name: recommended_term_days
        type: integer
        source: computed
        default: null
        description: Term length implied by recommended_category per calculations.determination_term_and_expiry.
      - name: scored_by_user_id
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the Evaluator who recorded scores.
      - name: signed_off_by_user_id
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the EligibilitySpecialist who signed off; must differ from scored_by_user_id.
      - name: attendance_recorded_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant attendance was recorded.

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vehicle_number
        type: string
        source: input
        description: Fleet number of the accessible vehicle used for assessment rides.
      - name: wheelchair_positions
        type: integer
        source: input
        default: 0
        description: Securement positions on board.
        constraints: ">= 0"
      - name: ambulatory_seats
        type: integer
        source: input
        default: 0
        description: Non-securement seats on board.
        constraints: ">= 0"
      - name: open_wheelchair_reservations
        type: integer
        source: computed
        default: 0
        description: Conserved quantity — count of TransportationBookings on this vehicle with status == RESERVED and requires_wheelchair_position == true.
      - name: open_ambulatory_reservations
        type: integer
        source: computed
        default: 0
        description: Count of TransportationBookings on this vehicle with status == RESERVED and requires_wheelchair_position == false.
      - name: status
        type: enum
        source: input
        default: IN_SERVICE
        description: OUT_OF_SERVICE vehicles reject new bookings.
        constraints: "IN_SERVICE | OUT_OF_SERVICE"

  - name: TransportationBooking
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> FunctionalAssessment.id; the assessment this agency-provided ride serves."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the accessible vehicle reserved."
      - name: pickup_window_start
        type: datetime
        source: input
        description: Inclusive start of the pickup window (UTC).
      - name: pickup_window_end
        type: datetime
        source: input
        description: Exclusive end of the pickup window (UTC); must be strictly after pickup_window_start.
      - name: requires_wheelchair_position
        type: boolean
        source: input
        default: false
        description: Whether this ride consumes a securement position rather than an ambulatory seat.
      - name: status
        type: enum
        source: computed
        default: RESERVED
        description: Booking state per state_machines.TransportationBooking.
        constraints: "RESERVED | COMPLETED | CANCELLED | NO_SHOW_CLOSED"
      - name: cancelled_reason
        type: string
        source: input
        default: null
        description: Reason recorded on cancel; null otherwise.

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the packet this determination resolves."
      - name: applicant_id
        type: string
        source: computed
        description: "FK -> Applicant.id; copied from the parent Application at draft time."
      - name: category
        type: enum
        source: input
        description: Eligibility category granted.
        constraints: "UNCONDITIONAL | CONDITIONAL | TEMPORARY | INELIGIBLE"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Determination state per state_machines.Determination.
        constraints: "DRAFT | ISSUED | SUPERSEDED | VACATED | EXPIRED"
      - name: effective_date
        type: string
        source: input
        description: ISO calendar date the grant takes effect.
      - name: term_days
        type: integer
        source: computed
        description: Term implied by category per calculations.determination_term_and_expiry (1825 / 1095 / 180 / 0).
      - name: expires_at
        type: string
        source: computed
        default: null
        description: effective_date + term_days as an ISO date; null when category == INELIGIBLE.
      - name: rationale
        type: string
        source: input
        description: Written basis for the category, required for the audit record.
      - name: determined_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the EligibilitySpecialist who created the draft; the appeal reviewer must differ from this value.
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the draft was issued.
      - name: under_appeal
        type: boolean
        source: computed
        default: false
        description: true while some Appeal on this determination has status IN {FILED, REVIEWER_ASSIGNED, HEARING_SCHEDULED, HEARD}.
      - name: origin
        type: enum
        source: computed
        default: SPECIALIST_DETERMINATION
        description: APPEAL_REMEDY for successor determinations synthesized by an OVERTURNED or MODIFIED appeal decision.
        constraints: "SPECIALIST_DETERMINATION | APPEAL_REMEDY"
      - name: trip_condition_count
        type: integer
        source: computed
        default: 0
        description: Count of TripConditions attached to this determination.
      - name: fixed_route_competency_confirmed
        type: boolean
        source: computed
        default: false
        description: Mirror of Applicant.fixed_route_competency_confirmed at evaluation time; suppresses COGNITIVE_UNFAMILIAR_ROUTE conditions in trip-by-trip checks.

  - name: TripCondition
    parent: null
    common_fields: false
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> Determination.id; the conditional/temporary grant this trip condition qualifies."
      - name: condition_type
        type: enum
        source: input
        description: Environmental or functional trigger under which paratransit service applies.
        constraints: "HEAT_INDEX_ABOVE | COLD_BELOW | PRECIPITATION | PATH_OF_TRAVEL_BARRIER | DISTANCE_OVER_METERS | COGNITIVE_UNFAMILIAR_ROUTE | NIGHT_TRAVEL"
      - name: comparator
        type: enum
        source: input
        description: Comparison applied to threshold_value; IS_TRUE for boolean condition types.
        constraints: "GTE | GT | LTE | LT | IS_TRUE"
      - name: threshold_value
        type: number
        source: input
        default: null
        description: Numeric threshold; required when comparator != IS_TRUE, must be null when comparator == IS_TRUE.
      - name: note
        type: string
        source: input
        default: null
        description: Plain-language wording printed on the rider's eligibility letter.

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: determination_id
        type: string
        source: input
        description: "FK -> Determination.id; the determination being contested."
      - name: grounds
        type: string
        source: input
        description: Rider's written grounds for appeal.
      - name: request_hearing
        type: boolean
        source: input
        default: false
        description: true routes the appeal through an in-person hearing before decision; false routes straight to paper review.
      - name: filed_at
        type: datetime
        source: computed
        description: Logical-clock instant the appeal was filed.
      - name: filing_deadline_date
        type: string
        source: computed
        description: Determination.effective_date + 60 days per calculations.appeal_deadlines.
      - name: status
        type: enum
        source: computed
        default: FILED
        description: Appeal state per state_machines.Appeal.
        constraints: "FILED | REVIEWER_ASSIGNED | HEARING_SCHEDULED | HEARD | DECIDED"
      - name: reviewer_user_id
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the assigned IndependentReviewer; must differ from Determination.determined_by_user_id.
      - name: hearing_at
        type: datetime
        source: computed
        default: null
        description: Scheduled hearing instant; null on the paper-review branch.
      - name: heard_at
        type: datetime
        source: computed
        default: null
        description: Instant the record closed (hearing held, or paper review opened).
      - name: decision_due_date
        type: string
        source: computed
        default: null
        description: heard_at date + 30 days per calculations.appeal_deadlines.
      - name: outcome
        type: enum
        source: input
        default: null
        description: Reviewer's disposition, supplied on decision.
        constraints: "UPHELD | OVERTURNED | MODIFIED | null"
      - name: granted_category
        type: enum
        source: input
        default: null
        description: Category granted by the remedy; required when outcome IN {OVERTURNED, MODIFIED}, must be null when outcome == UPHELD.
        constraints: "UNCONDITIONAL | CONDITIONAL | TEMPORARY | null"
      - name: decided_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant of decision.
      - name: decision_note
        type: string
        source: input
        default: null
        description: Reviewer's written reasoning.
      - name: continued_service_extended
        type: boolean
        source: computed
        default: false
        description: Set true by POST /_ops/day-close when a HEARD appeal passes decision_due_date undecided.

  - name: TripEvent
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the rider whose trip this event records."
      - name: trip_date
        type: string
        source: input
        description: ISO calendar date the trip was scheduled for; governs conduct-window membership on the event basis.
      - name: event_type
        type: enum
        source: input
        description: Disposition of the scheduled trip.
        constraints: "COMPLETED | NO_SHOW | LATE_CANCEL | CANCEL_IN_ADVANCE | AGENCY_FAULT_NO_SHOW"
      - name: recorded_at
        type: datetime
        source: computed
        description: Logical-clock instant of ingestion; governs conduct-window membership on the report basis.
      - name: excused
        type: boolean
        source: computed
        default: false
        description: true once excused for reasons beyond the rider's control; excused events score 0 points.
      - name: excuse_reason
        type: string
        source: input
        default: null
        description: Reason recorded when excusing; null while excused == false.
      - name: points_assessed
        type: number
        source: computed
        default: 0
        description: 2 for unexcused NO_SHOW, 1 for unexcused LATE_CANCEL, 0 otherwise (per calculations.no_show_points_balance).

  - name: SuspensionProceeding
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the rider whose pattern of missed trips is under review."
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Due-process state per state_machines.SuspensionProceeding.
        constraints: "PROPOSED | NOTICE_SENT | RIDER_RESPONDED | RESPONSE_LAPSED | UPHELD_PENDING | ACTIVE | SERVED | RESCINDED | VOID"
      - name: origin
        type: enum
        source: computed
        default: MANUAL
        description: AUTO_THRESHOLD when synthesized by the conduct cascade on TripEvent ingestion; MANUAL when proposed by a ConductOfficer.
        constraints: "AUTO_THRESHOLD | MANUAL"
      - name: proposed_by_user_id
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the proposing ConductOfficer; null when origin == AUTO_THRESHOLD. The decider must differ from this value.
      - name: grounds_note
        type: string
        source: input
        default: null
        description: Narrative recorded on the proposal.
      - name: review_window_end_date
        type: string
        source: input
        description: Last calendar date of the 90-day conduct window evaluated by this proceeding.
      - name: points_at_proposal
        type: number
        source: computed
        description: Applicant.no_show_points_event_basis snapshot at proposal time.
      - name: notice_sent_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant the written notice went out.
      - name: response_deadline_date
        type: string
        source: computed
        default: null
        description: notice_sent_at date + 14 days; the due-process response window.
      - name: rider_response_at
        type: datetime
        source: computed
        default: null
        description: Instant the rider's written response was recorded.
      - name: rider_response_note
        type: string
        source: input
        default: null
        description: Rider's written response text.
      - name: decided_by_user_id
        type: string
        source: computed
        default: null
        description: Opaque X-User-ID of the deciding ConductOfficer.
      - name: decision
        type: enum
        source: input
        default: null
        description: Disposition recorded at decision time.
        constraints: "UPHELD | RESCINDED | null"
      - name: duration_days
        type: integer
        source: computed
        default: 0
        description: Suspension length from calculations.suspension_duration_ladder; 0 unless decision == UPHELD.
      - name: suspension_start_date
        type: string
        source: input
        default: null
        description: First suspended calendar date; required when decision == UPHELD, must be null when decision == RESCINDED.
      - name: suspension_end_date
        type: string
        source: computed
        default: null
        description: suspension_start_date + duration_days - 1 (inclusive last suspended date).
      - name: days_served
        type: integer
        source: computed
        default: 0
        description: Conserved quantity component per calculations.suspension_day_ledger.
      - name: days_forgiven
        type: integer
        source: computed
        default: 0
        description: Conserved quantity component per calculations.suspension_day_ledger; days_served + days_forgiven == duration_days always.

  - name: TravelTrainingReferral
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the rider referred to fixed-route travel training."
      - name: determination_id
        type: string
        source: input
        default: null
        description: "FK -> Determination.id; the conditional/temporary grant that motivated the referral; null for pre-determination referrals."
      - name: referral_reason
        type: enum
        source: input
        description: Why the referral exists.
        constraints: "CONDITIONAL_ELIGIBILITY_AUTO | STAFF_REFERRAL | RIDER_REQUEST"
      - name: status
        type: enum
        source: computed
        default: REFERRED
        description: Referral state per state_machines.TravelTrainingReferral.
        constraints: "REFERRED | ENROLLED | DECLINED | COMPLETED | WITHDRAWN"
      - name: referral_response_deadline_date
        type: string
        source: computed
        description: date(created_at) + 14 days; the last date the rider may enroll or decline.
      - name: fixed_route_competency_score
        type: integer
        source: input
        default: null
        description: Post-training competency score 0..100; >= 80 confirms fixed-route competency.
        constraints: "0..100"
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant training completion was recorded.
      - name: withdrawal_reason
        type: enum
        source: computed
        default: null
        description: Reason the referral was withdrawn by cascade.
        constraints: "ELIGIBILITY_LAPSED | null"

  - name: VisitorEligibility
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the out-of-area rider visiting the service area."
      - name: home_agency_name
        type: string
        source: input
        description: Certifying agency in the rider's home jurisdiction.
      - name: home_agency_certification_provided
        type: boolean
        source: input
        description: Whether documentation of home-agency ADA paratransit eligibility was presented.
      - name: visit_start_date
        type: string
        source: input
        description: First calendar date of the visit.
      - name: service_dates
        type: array
        source: computed
        default: []
        description: Distinct ISO dates on which visitor service was granted, appended by POST /visitor-eligibilities/{id}/service-days.
      - name: days_used_365
        type: integer
        source: computed
        default: 0
        description: Count of service_dates inside the rolling 365-day window per calculations.visitor_days_accounting.
      - name: days_remaining_365
        type: integer
        source: computed
        default: 21
        description: 21 - days_used_365, floored at 0.
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: Visitor record state per state_machines.VisitorEligibility.
        constraints: "ACTIVE | EXHAUSTED | SUPERSEDED_BY_LOCAL"

state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [DETERMINED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant | IntakeClerk
        preconditions:
          - "functional_answers contains all five required keys, each non-null"
          - "no other Application for this applicant has status IN {SUBMITTED, RETURNED_INCOMPLETE, PENDING_VERIFICATION, ASSESSMENT_REQUIRED, ASSESSMENT_SCHEDULED, ASSESSMENT_COMPLETE}"
        side_effects:
          - "submitted_at = logical clock now"
          - "completeness_established_at = submitted_at (starts the 21-day statutory window)"
          - "determination_due_date = date(completeness_established_at) + 21 days"
          - "missing_items = []"
      - from: SUBMITTED
        to: RETURNED_INCOMPLETE
        trigger: "POST /applications/{id}/return-incomplete"
        actor: IntakeClerk
        preconditions:
          - "missing_items input is a non-empty array of strings"
        side_effects:
          - "missing_items = request.missing_items"
          - "completeness_established_at = null (statutory window stops)"
          - "determination_due_date = null"
          - "days_pending_statutory freezes at its value as of this transition"
      - from: RETURNED_INCOMPLETE
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant | IntakeClerk
        preconditions:
          - "functional_answers (existing, or replaced by this request) contains all five required keys, each non-null"
        side_effects:
          - "functional_answers replaced when supplied in the request body"
          - "submitted_at = logical clock now"
          - "completeness_established_at = submitted_at — RESET, not resumed; the statutory clock restarts from zero"
          - "determination_due_date = date(submitted_at) + 21 days"
          - "resubmission_count += 1"
          - "missing_items = []"
        note: "Cycle edge: RETURNED_INCOMPLETE -> SUBMITTED shares its trigger with DRAFT -> SUBMITTED but resets the statutory clock."
      - from: SUBMITTED
        to: PENDING_VERIFICATION
        trigger: "POST /applications/{id}/verifications"
        actor: IntakeClerk
        preconditions:
          - "no ProfessionalVerification for this application has status == REQUESTED"
        side_effects:
          - "ProfessionalVerification created with status REQUESTED and requested_at = clock now"
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "POST /applications/{id}/verifications/{verification_id}/receive with outcome INSUFFICIENT"
        actor: IntakeClerk
        preconditions:
          - "the named ProfessionalVerification has status == REQUESTED"
          - "insufficiency_reason is present"
        side_effects:
          - "ProfessionalVerification.status = INSUFFICIENT, received_at = clock now, wait_days computed"
          - "Application.verification_excluded_days += that verification's wait_days"
          - "Application remains PENDING_VERIFICATION so a further verification may be requested"
        note: "Self-loop: an insufficient attestation does not advance the packet and does not stop the statutory clock."
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "POST /applications/{id}/verifications (re-request after an INSUFFICIENT response)"
        actor: IntakeClerk
        preconditions:
          - "no ProfessionalVerification for this application has status == REQUESTED"
          - "at least one ProfessionalVerification for this application has status == INSUFFICIENT"
        side_effects:
          - "new ProfessionalVerification created with status REQUESTED and requested_at = clock now"
          - "Application.status stays PENDING_VERIFICATION; completeness_established_at untouched"
        note: "Second self-loop edge; together with the INSUFFICIENT receive edge it forms the verification revision cycle."
      - from: PENDING_VERIFICATION
        to: ASSESSMENT_REQUIRED
        trigger: "POST /applications/{id}/verifications/{verification_id}/receive with outcome ACCEPTED"
        actor: IntakeClerk
        preconditions:
          - "the named ProfessionalVerification has status == REQUESTED"
          - "attests_conditions is a non-empty array and attests_permanent is non-null"
        side_effects:
          - "ProfessionalVerification.status = RECEIVED, received_at = clock now, wait_days computed"
          - "Application.verification_excluded_days += that verification's wait_days"
          - "Application.attests_permanent = verification.attests_permanent"
      - from: ASSESSMENT_REQUIRED
        to: ASSESSMENT_SCHEDULED
        trigger: "POST /applications/{id}/assessments"
        actor: IntakeClerk
        preconditions:
          - "target AssessmentSlot.status == OPEN"
          - "target AssessmentSlot.starts_at > logical clock now"
          - "AssessmentSlot.site_is_wheelchair_accessible == true when requires_wheelchair_position == true"
        side_effects:
          - "FunctionalAssessment created (attendance_status SCHEDULED, scoring_status NOT_STARTED)"
          - "AssessmentSlot.booked_count += 1; AssessmentSlot.status = FULL when booked_count == capacity"
          - "when rescheduled_from_assessment_id is supplied: Application.applicant_delay_days += floor whole days between the prior assessment's slot starts_at and this slot's starts_at"
      - from: ASSESSMENT_SCHEDULED
        to: ASSESSMENT_REQUIRED
        trigger: "POST /assessments/{id}/attendance with attendance_status NO_SHOW"
        actor: Evaluator
        preconditions:
          - "FunctionalAssessment.attendance_status == SCHEDULED"
        side_effects:
          - "FunctionalAssessment.attendance_status = NO_SHOW, attendance_recorded_at = clock now"
          - "AssessmentSlot.booked_count -= 1; status FULL -> OPEN when booked_count < capacity"
          - "each TransportationBooking on this assessment with status == RESERVED -> NO_SHOW_CLOSED; that booking's release decrements Vehicle.open_wheelchair_reservations or Vehicle.open_ambulatory_reservations"
          - "Application returns to ASSESSMENT_REQUIRED so a replacement assessment can be booked"
        note: "Cycle edge: the assessment dimension can be re-entered without leaving the intake workflow."
      - from: ASSESSMENT_SCHEDULED
        to: ASSESSMENT_REQUIRED
        trigger: "POST /assessments/{id}/attendance with attendance_status CANCELLED_BY_AGENCY"
        actor: Evaluator | AccessibilityOfficeAdmin
        preconditions:
          - "FunctionalAssessment.attendance_status == SCHEDULED"
        side_effects:
          - "FunctionalAssessment.attendance_status = CANCELLED_BY_AGENCY, attendance_recorded_at = clock now"
          - "AssessmentSlot.booked_count -= 1; status FULL -> OPEN when booked_count < capacity"
          - "each TransportationBooking on this assessment with status == RESERVED -> CANCELLED; capacity mirrors released"
          - "Application.applicant_delay_days unchanged (agency fault is never charged to the applicant)"
      - from: ASSESSMENT_SCHEDULED
        to: ASSESSMENT_COMPLETE
        trigger: "system: FunctionalAssessment.scoring_status becomes SIGNED_OFF (POST /assessments/{id}/sign-off)"
        actor: system
        preconditions:
          - "FunctionalAssessment.attendance_status == ATTENDED"
          - "FunctionalAssessment.scoring_status == SCORED"
        side_effects:
          - "Application.status = ASSESSMENT_COMPLETE (bubble-up from the child assessment's scoring dimension)"
      - from: ASSESSMENT_COMPLETE
        to: DETERMINED
        trigger: "system: POST /determinations/{id}/issue on a Determination whose application_id is this application"
        actor: system
        preconditions:
          - "the Determination being issued has status == DRAFT"
        side_effects:
          - "Application.status = DETERMINED (terminal)"
          - "Application.days_pending_statutory and days_pending_net_agency freeze at their values as of issuance"

  - entity: ProfessionalVerification
    initial_state: REQUESTED
    terminal_states: [RECEIVED, INSUFFICIENT]
    shape: branching
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /applications/{id}/verifications/{verification_id}/receive with outcome ACCEPTED"
        actor: IntakeClerk
        preconditions:
          - "attests_conditions non-empty; attests_permanent non-null"
        side_effects:
          - "received_at = clock now; wait_days = floor whole days between requested_at and received_at"
          - "parent Application advances PENDING_VERIFICATION -> ASSESSMENT_REQUIRED"
      - from: REQUESTED
        to: INSUFFICIENT
        trigger: "POST /applications/{id}/verifications/{verification_id}/receive with outcome INSUFFICIENT"
        actor: IntakeClerk
        preconditions:
          - "insufficiency_reason present"
        side_effects:
          - "received_at = clock now; wait_days computed"
          - "parent Application stays PENDING_VERIFICATION"

  - entity: FunctionalAssessment
    state_field: attendance_status
    initial_state: SCHEDULED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED_BY_AGENCY]
    shape: parallel
    note: "Dimension 1 of 2. Evolves independently of scoring_status; scoring is guarded on ATTENDED but attendance never reads scoring_status."
    transitions:
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /assessments/{id}/attendance with attendance_status ATTENDED"
        actor: Evaluator
        preconditions:
          - "logical clock now >= AssessmentSlot.starts_at"
        side_effects:
          - "attendance_recorded_at = clock now"
          - "each TransportationBooking on this assessment with status == RESERVED -> COMPLETED; that booking's completion decrements Vehicle.open_wheelchair_reservations or Vehicle.open_ambulatory_reservations"
          - "AssessmentSlot.booked_count unchanged (ATTENDED still occupies the slot)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /assessments/{id}/attendance with attendance_status NO_SHOW"
        actor: Evaluator
        preconditions:
          - "logical clock now >= AssessmentSlot.starts_at"
        side_effects:
          - "see state_machines.Application ASSESSMENT_SCHEDULED -> ASSESSMENT_REQUIRED for the full chain"
      - from: SCHEDULED
        to: CANCELLED_BY_AGENCY
        trigger: "POST /assessments/{id}/attendance with attendance_status CANCELLED_BY_AGENCY"
        actor: Evaluator | AccessibilityOfficeAdmin
        preconditions:
          - "attendance_status == SCHEDULED"
        side_effects:
          - "bookings cancelled and slot released as documented on the Application edge"

  - entity: FunctionalAssessment
    state_field: scoring_status
    initial_state: NOT_STARTED
    terminal_states: [SIGNED_OFF]
    shape: parallel
    note: "Dimension 2 of 2. NOT_STARTED -> SCORED requires attendance_status == ATTENDED; SCORED -> SIGNED_OFF requires a different user than scored_by_user_id."
    transitions:
      - from: NOT_STARTED
        to: SCORED
        trigger: "POST /assessments/{id}/scores"
        actor: Evaluator
        preconditions:
          - "attendance_status == ATTENDED"
          - "board_alight_score and wayfinding_score in 0..4; distance_meters_walked >= 0; heat_sensitivity_flag non-null"
        side_effects:
          - "scored_by_user_id = acting X-User-ID"
          - "recommended_category = calculations.recommended_eligibility_category output"
          - "recommended_term_days = term implied by recommended_category"
      - from: SCORED
        to: SCORED
        trigger: "POST /assessments/{id}/scores (re-score before sign-off)"
        actor: Evaluator
        preconditions:
          - "scoring_status == SCORED"
        side_effects:
          - "scores overwritten; recommended_category and recommended_term_days recomputed; scored_by_user_id = acting X-User-ID"
      - from: SCORED
        to: SIGNED_OFF
        trigger: "POST /assessments/{id}/sign-off"
        actor: EligibilitySpecialist
        preconditions:
          - "acting X-User-ID != scored_by_user_id"
        side_effects:
          - "signed_off_by_user_id = acting X-User-ID"
          - "parent Application advances ASSESSMENT_SCHEDULED -> ASSESSMENT_COMPLETE"

  - entity: TransportationBooking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW_CLOSED]
    shape: branching
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /transportation-bookings/{id}/cancel"
        actor: IntakeClerk | AccessibilityOfficeAdmin
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "cancelled_reason recorded"
          - "Vehicle.open_wheelchair_reservations -= 1 when requires_wheelchair_position == true, else Vehicle.open_ambulatory_reservations -= 1"
      - from: RESERVED
        to: COMPLETED
        trigger: "system: assessment attendance recorded as ATTENDED"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "vehicle occupancy mirror released as on cancel"
      - from: RESERVED
        to: NO_SHOW_CLOSED
        trigger: "system: assessment attendance recorded as NO_SHOW"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "vehicle occupancy mirror released as on cancel"

  - entity: Determination
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VACATED, EXPIRED]
    shape: branching
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /determinations/{id}/issue"
        actor: EligibilitySpecialist
        preconditions:
          - "parent Application.status == ASSESSMENT_COMPLETE"
          - "the FunctionalAssessment for that application with attendance_status == ATTENDED has scoring_status == SIGNED_OFF (cross-entity guard)"
          - "category == CONDITIONAL requires trip_condition_count >= 1"
          - "category IN {UNCONDITIONAL, INELIGIBLE} requires trip_condition_count == 0"
        side_effects:
          - "issued_at = clock now; term_days and expires_at computed per calculations.determination_term_and_expiry"
          - "every other Determination for this applicant with status == ISSUED -> SUPERSEDED"
          - "Applicant.current_eligibility_status = ELIGIBLE (or INELIGIBLE when category == INELIGIBLE); Applicant.eligibility_category = category; Applicant.active_determination_id = this id"
          - "Applicant.current_eligibility_status leaving PRESUMPTIVE clears Application.presumptive_granted_at semantics for reporting (field retained for audit)"
          - "parent Application.status = DETERMINED"
          - "when category == CONDITIONAL: a TravelTrainingReferral is created for the applicant with referral_reason CONDITIONAL_ELIGIBILITY_AUTO, determination_id = this id, status REFERRED"
          - "every VisitorEligibility for this applicant with status == ACTIVE -> SUPERSEDED_BY_LOCAL"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a newer Determination for the same applicant is issued"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "under_appeal frozen at its current value; no further appeals may be filed against this determination"
      - from: ISSUED
        to: VACATED
        trigger: "system: POST /appeals/{id}/decision with outcome OVERTURNED or MODIFIED"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "the deciding Appeal.determination_id == this id"
        side_effects:
          - "under_appeal = false"
          - "a successor Determination is created and issued in the same request with origin APPEAL_REMEDY (see the Appeal HEARD -> DECIDED cascade)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /_ops/day-close step 3, when expires_at <= date(logical clock now)"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "expires_at is non-null"
        side_effects:
          - "CASCADE hop 1 of 3: this Determination.status = EXPIRED"
          - "CASCADE hop 2 of 3 (caused by hop 1): Applicant.current_eligibility_status = EXPIRED, Applicant.eligibility_category = null, Applicant.active_determination_id = null"
          - "CASCADE hop 3 of 3 (caused by hop 2 — the applicant is no longer eligible): every TravelTrainingReferral for that applicant with status IN {REFERRED, ENROLLED} -> WITHDRAWN with withdrawal_reason ELIGIBILITY_LAPSED"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED]
    shape: branching
    note: "Fork at REVIEWER_ASSIGNED: the hearing branch (request_hearing == true) and the paper branch (request_hearing == false) join at HEARD with different side-effect sets."
    transitions:
      - from: FILED
        to: REVIEWER_ASSIGNED
        trigger: "POST /appeals/{id}/assign-reviewer"
        actor: AccessibilityOfficeAdmin
        preconditions:
          - "reviewer_user_id != the appealed Determination.determined_by_user_id (segregation of duties)"
        side_effects:
          - "reviewer_user_id recorded"
      - from: REVIEWER_ASSIGNED
        to: HEARING_SCHEDULED
        trigger: "POST /appeals/{id}/hearing"
        actor: IndependentReviewer
        preconditions:
          - "request_hearing == true"
          - "acting X-User-ID == reviewer_user_id"
          - "hearing_at > logical clock now"
        side_effects:
          - "hearing_at recorded"
      - from: HEARING_SCHEDULED
        to: HEARD
        trigger: "system: POST /_ops/day-close step 1, when hearing_at <= logical clock now"
        actor: system
        preconditions:
          - "hearing_at is non-null"
        side_effects:
          - "heard_at = logical clock now; decision_due_date = date(heard_at) + 30 days"
      - from: REVIEWER_ASSIGNED
        to: HEARD
        trigger: "POST /appeals/{id}/hearing with hearing_at omitted (paper-review branch)"
        actor: IndependentReviewer
        preconditions:
          - "request_hearing == false"
          - "acting X-User-ID == reviewer_user_id"
        side_effects:
          - "heard_at = logical clock now; hearing_at stays null; decision_due_date = date(heard_at) + 30 days"
        note: "Join edge: the paper branch reaches HEARD synchronously; the hearing branch reaches it only through day-close."
      - from: HEARD
        to: DECIDED
        trigger: "POST /appeals/{id}/decision with outcome UPHELD"
        actor: IndependentReviewer
        preconditions:
          - "acting X-User-ID == reviewer_user_id"
          - "granted_category is null"
        side_effects:
          - "outcome = UPHELD; decided_at = clock now"
          - "appealed Determination.under_appeal = false; its status is unchanged"
          - "Applicant.continued_service_during_appeal = false; when the appealed category == INELIGIBLE the applicant's current_eligibility_status returns to INELIGIBLE"
      - from: HEARD
        to: DECIDED
        trigger: "POST /appeals/{id}/decision with outcome OVERTURNED or MODIFIED"
        actor: IndependentReviewer
        preconditions:
          - "acting X-User-ID == reviewer_user_id"
          - "granted_category is non-null"
        side_effects:
          - "CASCADE hop 1 of 4: this Appeal.status = DECIDED, outcome = request.outcome, decided_at = clock now"
          - "CASCADE hop 2 of 4 (caused by hop 1): the appealed Determination.status ISSUED -> VACATED, and a successor Determination is created with status ISSUED, origin APPEAL_REMEDY, category = granted_category, effective_date = date(decided_at), term_days/expires_at per calculations.determination_term_and_expiry, application_id and applicant_id copied from the vacated determination, determined_by_user_id = the appeal's reviewer_user_id"
          - "CASCADE hop 3 of 4 (caused by hop 2 — a new ISSUED determination exists): Applicant.current_eligibility_status = ELIGIBLE, eligibility_category = granted_category, active_determination_id = successor determination id, continued_service_during_appeal = false"
          - "CASCADE hop 4 of 4 (caused by hop 3 — the applicant now holds CONDITIONAL eligibility): when eligibility_category == CONDITIONAL a TravelTrainingReferral is created for the applicant with referral_reason CONDITIONAL_ELIGIBILITY_AUTO, determination_id = successor determination id, status REFERRED"
          - "TripConditions are NOT copied from the vacated determination; the successor carries trip_condition_count 0 and, when granted_category == CONDITIONAL, the reviewer's decision_note stands as the written condition basis until a new determination is drafted"

  - entity: SuspensionProceeding
    initial_state: PROPOSED
    terminal_states: [SERVED, RESCINDED, VOID]
    shape: branching
    note: "Fork at NOTICE_SENT: the rider-response branch and the lapsed-window branch join at the decide edge; both carry the same decision options but different due-process evidence."
    transitions:
      - from: PROPOSED
        to: NOTICE_SENT
        trigger: "POST /suspension-proceedings/{id}/send-notice"
        actor: ConductOfficer
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "notice_sent_at = clock now; response_deadline_date = date(notice_sent_at) + 14 days"
      - from: NOTICE_SENT
        to: RIDER_RESPONDED
        trigger: "POST /suspension-proceedings/{id}/respond"
        actor: Applicant
        preconditions:
          - "status == NOTICE_SENT"
          - "date(logical clock now) <= response_deadline_date"
          - "acting X-User-ID == applicant_id"
        side_effects:
          - "rider_response_at = clock now; rider_response_note recorded"
      - from: NOTICE_SENT
        to: RESPONSE_LAPSED
        trigger: "system: POST /_ops/day-close step 2, when response_deadline_date < date(logical clock now)"
        actor: system
        preconditions:
          - "status == NOTICE_SENT"
        side_effects:
          - "no field beyond status and updated_at changes; the lapse itself is the due-process evidence"
      - from: RIDER_RESPONDED
        to: UPHELD_PENDING
        trigger: "POST /suspension-proceedings/{id}/decide with decision UPHELD"
        actor: ConductOfficer
        preconditions:
          - "acting X-User-ID != proposed_by_user_id (segregation of duties; always satisfied when origin == AUTO_THRESHOLD)"
          - "Applicant.no_show_points_event_basis >= 6 AND Applicant.chargeable_miss_count_90d >= 3 AND Applicant.no_show_ratio_pct > 10.0 evaluated at decision time"
          - "suspension_start_date is non-null and >= date(logical clock now)"
        side_effects:
          - "decision = UPHELD; decided_by_user_id recorded"
          - "duration_days = calculations.suspension_duration_ladder output"
          - "suspension_end_date = suspension_start_date + duration_days - 1"
          - "Applicant.prior_upheld_suspension_count += 1; Applicant.suspension_days_ledger_total += duration_days (days_served 0 + days_forgiven 0 at this instant is reconciled when the proceeding leaves UPHELD_PENDING)"
      - from: RESPONSE_LAPSED
        to: UPHELD_PENDING
        trigger: "POST /suspension-proceedings/{id}/decide with decision UPHELD"
        actor: ConductOfficer
        preconditions:
          - "same preconditions as the RIDER_RESPONDED -> UPHELD_PENDING edge"
        side_effects:
          - "same side effects as the RIDER_RESPONDED -> UPHELD_PENDING edge"
      - from: RIDER_RESPONDED
        to: RESCINDED
        trigger: "POST /suspension-proceedings/{id}/decide with decision RESCINDED"
        actor: ConductOfficer
        preconditions:
          - "acting X-User-ID != proposed_by_user_id"
          - "suspension_start_date is null"
        side_effects:
          - "decision = RESCINDED; duration_days = 0; days_served = 0; days_forgiven = 0"
      - from: RESPONSE_LAPSED
        to: RESCINDED
        trigger: "POST /suspension-proceedings/{id}/decide with decision RESCINDED"
        actor: ConductOfficer
        preconditions:
          - "same preconditions as the RIDER_RESPONDED -> RESCINDED edge"
        side_effects:
          - "same side effects as the RIDER_RESPONDED -> RESCINDED edge"
      - from: UPHELD_PENDING
        to: ACTIVE
        trigger: "system: POST /_ops/day-close step 2, when suspension_start_date <= date(logical clock now)"
        actor: system
        preconditions:
          - "status == UPHELD_PENDING"
        side_effects:
          - "Applicant.service_status = SUSPENDED"
      - from: ACTIVE
        to: SERVED
        trigger: "system: POST /_ops/day-close step 2, when suspension_end_date < date(logical clock now)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "days_served = duration_days; days_forgiven = 0"
          - "Applicant.service_status = ACTIVE"
      - from: ACTIVE
        to: VOID
        trigger: "POST /suspension-proceedings/{id}/rescind"
        actor: ConductOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "days_served = min(duration_days, (date(clock now) - suspension_start_date).days + 1)"
          - "days_forgiven = duration_days - days_served (conservation: days_served + days_forgiven == duration_days)"
          - "Applicant.service_status = ACTIVE; Applicant.suspension_days_ledger_total unchanged"
      - from: PROPOSED
        to: VOID
        trigger: "system: a newer SuspensionProceeding is created for the same applicant"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "duration_days stays 0; days_served 0; days_forgiven 0"
        note: "Create-with-supersede: the newer conduct review consolidates the earlier proposal. This is the true race guarded by concurrency_rules.proceeding-propose-stale-applicant."

  - entity: TravelTrainingReferral
    initial_state: REFERRED
    terminal_states: [DECLINED, COMPLETED, WITHDRAWN]
    shape: branching
    transitions:
      - from: REFERRED
        to: ENROLLED
        trigger: "POST /travel-training-referrals/{id}/response with decision ENROLLED"
        actor: TravelTrainer
        preconditions:
          - "the applicant's Determination with status == ISSUED has category IN {CONDITIONAL, TEMPORARY} (cross-entity guard)"
        side_effects:
          - "status = ENROLLED"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /travel-training-referrals/{id}/response with decision DECLINED"
        actor: TravelTrainer
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "status = DECLINED (terminal)"
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /travel-training-referrals/{id}/complete"
        actor: TravelTrainer
        preconditions:
          - "status == ENROLLED"
          - "fixed_route_competency_score in 0..100"
        side_effects:
          - "completed_at = clock now"
          - "when fixed_route_competency_score >= 80: Applicant.fixed_route_competency_confirmed = true"
          - "when fixed_route_competency_score >= 80 (caused by the applicant flag flipping): the applicant's Determination with status == ISSUED has fixed_route_competency_confirmed = true, which suppresses COGNITIVE_UNFAMILIAR_ROUTE trip conditions in calculations.trip_by_trip_eligibility_evaluation"
      - from: REFERRED
        to: WITHDRAWN
        trigger: "system: the applicant's governing Determination expires during POST /_ops/day-close"
        actor: system
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "withdrawal_reason = ELIGIBILITY_LAPSED"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "system: the applicant's governing Determination expires during POST /_ops/day-close"
        actor: system
        preconditions:
          - "status == ENROLLED"
        side_effects:
          - "withdrawal_reason = ELIGIBILITY_LAPSED"

  - entity: VisitorEligibility
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, SUPERSEDED_BY_LOCAL]
    shape: branching
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: POST /visitor-eligibilities/{id}/service-days brings days_used_365 to 21"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "days_used_365 == 21 after the requested service_date is appended"
        side_effects:
          - "days_remaining_365 = 0; no further service days may be recorded"
      - from: ACTIVE
        to: SUPERSEDED_BY_LOCAL
        trigger: "system: a Determination for this applicant is issued (POST /determinations/{id}/issue)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "the local determination governs from its effective_date; visitor service days stop accruing"

concurrency_rules:
  - rule_id: determination-draft-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{id}/determinations"
    occ_field: "expected_application_version"
    description: |
      Drafting a Determination against an Application whose version has advanced since the client last
      observed it is rejected. This captures the case where another specialist has already drafted a
      determination on the same packet (which legitimately supersedes the prior draft under the issue
      edge's supersede rule), so the current writer's view of the packet — including its status,
      completeness_established_at, and existing drafts — is stale.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: proceeding-propose-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /applicants/{id}/suspension-proceedings"
    occ_field: "expected_applicant_version"
    description: |
      Proposing a SuspensionProceeding against an Applicant whose version has advanced since the client
      last observed it is rejected. A newer proposal legitimately supersedes an earlier PROPOSED one
      (PROPOSED -> VOID create-with-supersede edge), so a proposal written from a stale view of the
      rider's conduct mirrors — points, ratio, prior_upheld_suspension_count — would consolidate the
      wrong review window.
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412

calculations:
  - name: application_pending_days
    trigger: "Recomputed on every read of an Application and on every Application mutation; consumed by POST /_ops/day-close step 4."
    algorithm: dual_variant_elapsed
    formula: |
      # variant `statutory` (GOVERNING for presumptive eligibility)
      if application.completeness_established_at is null:
          days_pending_statutory = 0
      else:
          days_pending_statutory = floor(
              (logical_clock_now - application.completeness_established_at).total_seconds() / 86400 )

      # variant `net_agency` (REPORTING ONLY — never gates presumptive eligibility)
      days_pending_net_agency = max(0,
          days_pending_statutory
          - application.verification_excluded_days
          - application.applicant_delay_days )

      # verification_excluded_days accrues on every verification response:
      #   += floor((verification.received_at - verification.requested_at).total_seconds() / 86400)
      # applicant_delay_days accrues when a replacement assessment is booked:
      #   += floor((replacement_slot.starts_at - missed_slot.starts_at).total_seconds() / 86400)
    input_set: |
      Only the CURRENT submission cycle. completeness_established_at is reset (not resumed) by
      RETURNED_INCOMPLETE -> SUBMITTED, so days elapsed before a return-incomplete never enter either
      variant. verification_excluded_days and applicant_delay_days are cumulative across cycles and are
      NOT reset by resubmission, so net_agency can be strictly smaller than statutory even in a fresh cycle.
    constants:
      DETERMINATION_WINDOW_DAYS: 21
    precision: "whole days, floor; both variants persisted on Application"
    variants:
      - name: statutory
        when: "POST /_ops/day-close step 4 (presumptive eligibility) and Application.determination_due_date"
        difference: "Counts every calendar day since completeness_established_at, including days the agency spent waiting on a professional verification and days lost to an applicant no-show."
      - name: net_agency
        when: "Application.days_pending_net_agency, reported to management as agency-controlled processing time"
        difference: "Subtracts verification_excluded_days and applicant_delay_days, so the same Application on the same clock yields a strictly smaller number whenever either exclusion is non-zero."

  - name: no_show_points_balance
    trigger: "Recomputed on POST /trip-events, POST /trip-events/{id}/excuse, and on every read of an Applicant."
    algorithm: chronological
    formula: |
      window_end   = date(logical_clock_now)
      window_start = window_end - 89 days          # 90 calendar days, BOTH ends inclusive

      POINTS = { NO_SHOW: 2, LATE_CANCEL: 1, COMPLETED: 0,
                 CANCEL_IN_ADVANCE: 0, AGENCY_FAULT_NO_SHOW: 0 }

      def in_window(e, basis):
          d = e.trip_date if basis == "event_date_basis" else date(e.recorded_at)
          return window_start <= d <= window_end

      # events processed chronologically by (trip_date ASC, created_at ASC) for audit reproducibility
      points(basis) = sum( POINTS[e.event_type]
                           for e in TripEvent where e.applicant_id == applicant.id
                           and in_window(e, basis) and e.excused == false )

      no_show_points_event_basis  = points("event_date_basis")     # GOVERNING
      no_show_points_report_basis = points("report_date_basis")    # REPORTING ONLY
    input_set: |
      TripEvents of the one applicant, restricted to the rolling window and to excused == false.
      AGENCY_FAULT_NO_SHOW, CANCEL_IN_ADVANCE and COMPLETED contribute 0 points but DO enter the
      scheduled_trip_count_90d denominator of no_show_ratio_pct.
    constants:
      CONDUCT_WINDOW_DAYS: 90
      POINTS_NO_SHOW: 2
      POINTS_LATE_CANCEL: 1
    precision: "integer points; no rounding"
    variants:
      - name: event_date_basis
        when: "suspension threshold evaluation (auto-proposal cascade and the decide-edge precondition) and Applicant.no_show_points_event_basis"
        difference: "Window membership tested against TripEvent.trip_date, so a late-ingested miss counts in the period it happened."
      - name: report_date_basis
        when: "Applicant.no_show_points_report_basis, published in the monthly conduct report"
        difference: "Window membership tested against date(TripEvent.recorded_at), so a trip that happened before the window but was ingested inside it counts here and not on the event basis — identical data, different totals."

  - name: no_show_ratio_pct
    trigger: "Recomputed with no_show_points_balance; gates the auto-proposal cascade and the suspension decide edge."
    algorithm: aggregation
    formula: |
      window_end   = date(logical_clock_now)
      window_start = window_end - 89 days          # inclusive both ends, event_date_basis only

      W = [ e for e in TripEvent
            where e.applicant_id == applicant.id and window_start <= e.trip_date <= window_end ]

      scheduled_trip_count_90d  = len(W)                                   # ALL event types
      chargeable_miss_count_90d = len([ e for e in W
                                        if e.excused == false
                                        and e.event_type in ("NO_SHOW", "LATE_CANCEL") ])

      # PINNED ROUNDING ORDER: pool the entire window, divide ONCE, round ONCE.
      if scheduled_trip_count_90d == 0:
          no_show_ratio_pct = 0.0
      else:
          no_show_ratio_pct = round_half_up(
              chargeable_miss_count_90d * 100 / scheduled_trip_count_90d, 1 )

      # FORBIDDEN alternative order (produces different cents-level results): computing a
      # per-calendar-month ratio, rounding each to 1 decimal, then averaging the monthly
      # percentages. Example: 1 miss / 2 trips in May (50.0) and 0 misses / 1 trip in July (0.0)
      # -> monthly average 25.0, pooled 1/3 = 33.3. The pooled value 33.3 is authoritative.
    input_set: |
      TripEvents of the one applicant with trip_date inside the inclusive 90-day window. Excused events
      remain in the denominator and leave the numerator. Events outside the window are excluded from both.
    constants:
      SUSPENSION_RATIO_THRESHOLD_PCT: 10.0
      EMPTY_WINDOW_RATIO: 0.0
    precision: "1 decimal place, round_half_up; percent units"

  - name: recommended_eligibility_category
    trigger: "POST /assessments/{id}/scores (scoring_status NOT_STARTED|SCORED -> SCORED)"
    algorithm: threshold
    formula: |
      b = board_alight_score            # 0..4
      w = wayfinding_score              # 0..4
      d = distance_meters_walked        # whole meters
      h = heat_sensitivity_flag         # boolean
      p = parent Application.attests_permanent   # boolean, from the RECEIVED verification

      # FIRST MATCHING BRANCH WINS — branch order is part of the contract.
      if p == false:                                  recommended_category = TEMPORARY
      elif min(b, w) <= 1:                            recommended_category = UNCONDITIONAL
      elif d < DISTANCE_FLOOR_M and max(b, w) >= 3:   recommended_category = CONDITIONAL
      elif b + w <= 4:                                recommended_category = UNCONDITIONAL
      elif d >= DISTANCE_CEILING_M and h == false:    recommended_category = INELIGIBLE
      else:                                           recommended_category = CONDITIONAL

      recommended_term_days = TERM_DAYS[recommended_category]   # see determination_term_and_expiry
    input_set: |
      The one assessment's four score inputs plus the parent Application's attests_permanent. No other
      assessment, no prior determination, and no conduct data participate.
    constants:
      DISTANCE_FLOOR_M: 400
      DISTANCE_CEILING_M: 800
    precision: "exact enum output; no rounding"
    note: |
      Non-linear interaction: nested min()/max() over two scores, a conditional branch on another
      entity's field (p), and a distance ceiling that is only reachable when neither min-score nor
      sum-score branch fired. Evaluating d >= 800 before min(b, w) <= 1 flips b=0,w=4,d=900,h=false
      from UNCONDITIONAL to INELIGIBLE.

  - name: trip_by_trip_eligibility_evaluation
    trigger: "POST /determinations/{id}/trip-eligibility-check"
    algorithm: constraint_propagation
    formula: |
      # Step 0 — category gate
      if determination.status != ISSUED:      return { eligible: false, denial_reason: DETERMINATION_NOT_ACTIVE }
      if determination.category == INELIGIBLE: return { eligible: false, denial_reason: CATEGORY_INELIGIBLE }
      if determination.category == UNCONDITIONAL:
          return { eligible: true, applied_condition_ids: [], denial_reason: null }
      if determination.expires_at is not null and trip_date > determination.expires_at:
          return { eligible: false, denial_reason: TERM_EXPIRED }

      # Step 1 — evaluate each TripCondition of the determination, ordered by created_at ASC
      def satisfied(c):
          if c.condition_type == HEAT_INDEX_ABOVE:
              return cmp(request.forecast_heat_index_f, c.comparator, c.threshold_value)
          if c.condition_type == COLD_BELOW:
              return cmp(request.forecast_heat_index_f, c.comparator, c.threshold_value)
          if c.condition_type == DISTANCE_OVER_METERS:
              return cmp(request.origin_distance_to_stop_meters, c.comparator, c.threshold_value)
          if c.condition_type == PRECIPITATION:            return request.precipitation_flag == true
          if c.condition_type == PATH_OF_TRAVEL_BARRIER:   return request.path_barrier_flag == true
          if c.condition_type == NIGHT_TRAVEL:             return request.is_night_trip == true
          if c.condition_type == COGNITIVE_UNFAMILIAR_ROUTE:
              return request.route_familiarity == "UNFAMILIAR" \
                     and determination.fixed_route_competency_confirmed == false

      # cmp(): GTE -> value >= t, GT -> value > t, LTE -> value <= t, LT -> value < t,
      #        IS_TRUE -> not applicable to numeric condition types (rejected at draft time)

      applied_condition_ids = [ c.id for c in conditions_ordered if satisfied(c) ]
      eligible      = len(applied_condition_ids) >= 1
      denial_reason = null if eligible else "NO_CONDITION_MET"
    input_set: |
      Every TripCondition whose determination_id == this determination, ordered by created_at ASC (never
      by id). Conditions on superseded/vacated determinations are never consulted, because step 0 rejects
      any determination whose status != ISSUED.
    constants:
      ROUTE_FAMILIARITY_VALUES: "FAMILIAR | UNFAMILIAR"
    precision: "boolean output plus the ordered list of satisfied condition ids"

  - name: determination_term_and_expiry
    trigger: "POST /determinations/{id}/issue, and when an appeal remedy synthesizes a successor determination"
    algorithm: threshold
    formula: |
      TERM_DAYS = { UNCONDITIONAL: 1825, CONDITIONAL: 1095, TEMPORARY: 180, INELIGIBLE: 0 }
      term_days  = TERM_DAYS[category]
      expires_at = null if category == INELIGIBLE else (effective_date + term_days days)
      # expiry boundary (POST /_ops/day-close step 3): EXPIRED iff expires_at <= date(logical_clock_now)
    input_set: "The one determination's category and effective_date."
    constants:
      TERM_DAYS_UNCONDITIONAL: 1825
      TERM_DAYS_CONDITIONAL: 1095
      TERM_DAYS_TEMPORARY: 180
    precision: "whole calendar days; ISO dates"

  - name: appeal_deadlines
    trigger: "POST /appeals (filing window), POST /appeals/{id}/hearing (decision window), POST /_ops/day-close steps 1 and 5"
    algorithm: threshold
    formula: |
      filing_deadline_date = determination.effective_date + 60 days
      filing accepted iff date(appeal.filed_at) <= filing_deadline_date        # inclusive
      decision_due_date    = date(appeal.heard_at) + 30 days
      overdue iff appeal.status == HEARD and decision_due_date < date(logical_clock_now)   # strict
    input_set: "The appealed determination's effective_date; the appeal's heard_at."
    constants:
      APPEAL_FILING_WINDOW_DAYS: 60
      APPEAL_DECISION_WINDOW_DAYS: 30
    precision: "whole calendar days; ISO dates"

  - name: suspension_duration_ladder
    trigger: "POST /suspension-proceedings/{id}/decide with decision UPHELD"
    algorithm: tiered_pricing
    formula: |
      LADDER = [7, 14, 21, 30]      # index by prior upheld suspensions
      n = applicant.prior_upheld_suspension_count evaluated BEFORE this decision increments it
      duration_days = LADDER[min(n, 3)]
      suspension_end_date = suspension_start_date + duration_days - 1     # inclusive last suspended date
    input_set: |
      prior_upheld_suspension_count counts this applicant's SuspensionProceedings with decision == UPHELD
      and status IN {UPHELD_PENDING, ACTIVE, SERVED, VOID}. Proceedings with decision == RESCINDED and
      proceedings voided from PROPOSED never count, so a rescinded first offence does not escalate the second.
    constants:
      SUSPENSION_LADDER_DAYS: [7, 14, 21, 30]
      SUSPENSION_POINT_THRESHOLD: 6
      SUSPENSION_MIN_MISS_COUNT: 3
    precision: "whole days"

  - name: suspension_day_ledger
    trigger: "Recomputed on every SuspensionProceeding transition and on every read of an Applicant."
    algorithm: aggregation
    formula: |
      # per proceeding, by status:
      #   PROPOSED | NOTICE_SENT | RIDER_RESPONDED | RESPONSE_LAPSED : duration_days = 0, served = 0, forgiven = 0
      #   UPHELD_PENDING : served = 0
      #   ACTIVE         : served = min(duration_days, (date(now) - suspension_start_date).days + 1)
      #   SERVED         : served = duration_days
      #   VOID (rescinded from ACTIVE) : served frozen at the value computed at rescind time
      #   RESCINDED | VOID (superseded from PROPOSED) : duration_days = 0, served = 0
      days_forgiven = duration_days - days_served          # holds for EVERY status
      # INVARIANT A (per proceeding):  days_served + days_forgiven == duration_days
      # INVARIANT B (per applicant):
      applicant.suspension_days_ledger_total =
          sum( p.days_served + p.days_forgiven for p in SuspensionProceeding
               where p.applicant_id == applicant.id )
          == sum( p.duration_days for p in the same set )
    input_set: |
      Every SuspensionProceeding of the applicant regardless of status; proceedings that never reached a
      decision contribute 0 to all three quantities.
    constants: {}
    precision: "whole days; no rounding"

  - name: visitor_days_accounting
    trigger: "POST /visitor-eligibilities/{id}/service-days"
    algorithm: interval_merge
    formula: |
      # PINNED EVALUATION ORDER — the window depends only on the requested date, never on the outcome.
      # 1. window_end   = request.service_date            (the date being requested)
      #    window_start = window_end - 364 days           # 365 days, both ends inclusive
      # 2. used_before  = count of DISTINCT d in visitor_eligibility.service_dates
      #                   with window_start <= d <= window_end
      #                   (the requested date itself is NOT yet in service_dates)
      # 3. grant iff used_before < VISITOR_DAYS_ALLOWED  -> else ERR_VISITOR_DAYS_EXHAUSTED
      # 4. only after granting: append request.service_date to service_dates (idempotent on duplicates —
      #    a date already present is not appended twice and does not consume a day)
      # 5. days_used_365     = count of distinct service_dates inside the window from step 1
      #    days_remaining_365 = max(0, VISITOR_DAYS_ALLOWED - days_used_365)
      #    status = EXHAUSTED when days_used_365 == VISITOR_DAYS_ALLOWED
    input_set: |
      Only the service_dates array of this VisitorEligibility record, restricted to the rolling 365-day
      window ending on the requested service_date. Records with status SUPERSEDED_BY_LOCAL are frozen and
      reject new service days.
    constants:
      VISITOR_DAYS_ALLOWED: 21
      VISITOR_WINDOW_DAYS: 365
    precision: "whole days; distinct dates only"
    note: |
      Circular-looking dependency resolved by the pinned order: days_remaining depends on days_used, which
      depends on the window, which would depend on the last granted day if the window end were taken from
      the grant outcome. Step 1 fixes the window from the REQUEST, so the value is well-defined.

  - name: vehicle_window_occupancy
    trigger: "POST /transportation-bookings; recomputed on cancel/complete/no-show-close"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals: [pickup_window_start, pickup_window_end)
      overlaps(a, b) = a.pickup_window_start < b.pickup_window_end \
                       and b.pickup_window_start < a.pickup_window_end
      # adjacency (a.end == b.start) is NOT an overlap and is always allowed

      lane      = "wheelchair" if new.requires_wheelchair_position else "ambulatory"
      capacity  = vehicle.wheelchair_positions if lane == "wheelchair" else vehicle.ambulatory_seats
      concurrent = [ b for b in TransportationBooking
                     where b.vehicle_id == vehicle.id and b.status == RESERVED
                     and b.requires_wheelchair_position == new.requires_wheelchair_position
                     and overlaps(new, b) ]
      reject with ERR_VEHICLE_WINDOW_CONFLICT iff len(concurrent) + 1 > capacity

      # mirrors, maintained as conserved quantities:
      vehicle.open_wheelchair_reservations = count(b : b.vehicle_id == v and b.status == RESERVED
                                                      and b.requires_wheelchair_position == true)
      vehicle.open_ambulatory_reservations = count(b : b.vehicle_id == v and b.status == RESERVED
                                                      and b.requires_wheelchair_position == false)
    input_set: "TransportationBookings on the one vehicle with status == RESERVED; CANCELLED, COMPLETED and NO_SHOW_CLOSED bookings never occupy a lane."
    constants: {}
    precision: "integer counts; instant comparisons at second resolution"

  - name: evaluator_slot_conflict
    trigger: "POST /assessment-slots"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals expanded by a mandatory turnaround BUFFER on both sides.
      conflict(new, existing) =
          new.starts_at      < existing.ends_at + EVALUATOR_BUFFER_MINUTES minutes
          and existing.starts_at < new.ends_at  + EVALUATOR_BUFFER_MINUTES minutes
      reject with ERR_EVALUATOR_SLOT_CONFLICT iff any AssessmentSlot with the same
      evaluator_user_id conflicts with the new slot.
      # Back-to-back slots (gap == 0) CONFLICT here, unlike vehicle_window_occupancy where
      # adjacency is free; a gap of exactly EVALUATOR_BUFFER_MINUTES is the first accepted gap.
    input_set: "All AssessmentSlots sharing evaluator_user_id, regardless of status (OPEN or FULL)."
    constants:
      EVALUATOR_BUFFER_MINUTES: 15
    precision: "minute resolution; comparisons on UTC instants"

  - name: applicant_eligibility_state
    trigger: "POST /_ops/day-close (five ordered steps) and every mutation that issues, supersedes, vacates or expires a Determination"
    algorithm: projection
    formula: |
      # POST /_ops/day-close executes EXACTLY these steps in EXACTLY this order. Each step may write
      # applicant.current_eligibility_status; the LAST writer in step order wins (no precedence table).
      #
      # step 1  Appeal   HEARING_SCHEDULED -> HEARD           when hearing_at <= now
      # step 2  SuspensionProceeding:
      #            NOTICE_SENT    -> RESPONSE_LAPSED          when response_deadline_date < date(now)
      #            UPHELD_PENDING -> ACTIVE                   when suspension_start_date <= date(now)
      #                                                        (also sets applicant.service_status = SUSPENDED)
      #            ACTIVE         -> SERVED                   when suspension_end_date < date(now)
      #                                                        (also sets applicant.service_status = ACTIVE)
      # step 3  Determination ISSUED -> EXPIRED               when expires_at <= date(now)
      #            + cascade: applicant.current_eligibility_status = EXPIRED, eligibility_category = null,
      #              active_determination_id = null; then every TravelTrainingReferral of that applicant
      #              with status IN {REFERRED, ENROLLED} -> WITHDRAWN (withdrawal_reason ELIGIBILITY_LAPSED)
      # step 4  Application presumptive grant, for each application ordered by created_at ASC, when ALL hold:
      #            days_pending_statutory >= 21
      #            status NOT IN {DRAFT, RETURNED_INCOMPLETE, DETERMINED}
      #            presumptive_granted_at is null
      #            the applicant has NO Determination with status == ISSUED at this moment
      #          -> presumptive_granted_at = now; applicant.current_eligibility_status = PRESUMPTIVE
      # step 5  Appeal HEARD with decision_due_date < date(now) and outcome is null
      #          -> continued_service_extended = true; applicant.current_eligibility_status = PRESUMPTIVE
      #
      # ORDER SENSITIVITY (contractual): step 3 runs BEFORE step 4, so a rider whose determination expires
      # in this same sweep while a recertification application has been pending >= 21 days ends the sweep
      # PRESUMPTIVE, not EXPIRED. Running step 4 first would leave the rider EXPIRED, because step 4's
      # "no ISSUED determination" guard would still see the not-yet-expired determination.
      #
      # Outside day-close the mirror is written directly:
      #   determination issued            -> ELIGIBLE (or INELIGIBLE when category == INELIGIBLE)
      #   appeal filed on an ISSUED determination -> continued_service_during_appeal = true (status unchanged)
      #   appeal OVERTURNED / MODIFIED    -> ELIGIBLE with the granted category
      #   visitor record created          -> VISITOR (only when the applicant holds no ISSUED determination)
    input_set: |
      Every Applicant reachable from the entities touched by the five steps. Applicants with no matching
      appeal, proceeding, determination or application are left untouched by the sweep.
    constants:
      DETERMINATION_WINDOW_DAYS: 21
    precision: "enum output; ordered, idempotent within a single sweep (a second sweep at the same clock changes nothing)"

validations:
  # ---- 1-4 authentication / authorization / ownership -------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when the acting role is Applicant, X-User-ID equals the Applicant.id that owns the addressed resource (Application.applicant_id, Determination.applicant_id, Appeal.applicant_id, SuspensionProceeding.applicant_id, VisitorEligibility.applicant_id, or the applicant_id of the addressed assessment's application)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /applicants/{id}, GET /applications/{id}, GET /applications, GET /determinations/{id}, GET /determinations, GET /determinations/{id}/trip-conditions, GET /determinations/{id}/appeals, GET /applicants/{id}/trip-events, GET /applicants/{id}/suspension-proceedings, GET /applicants/{id}/visitor-eligibilities, POST /applications, POST /applications/{id}/submit, POST /appeals, POST /suspension-proceedings/{id}/respond, POST /travel-training-referrals/{id}/response"
  - priority: 4
    category: auth
    check: "for Determination.determined_by_user_id / Appeal.reviewer_user_id / FunctionalAssessment.signed_off_by_user_id / SuspensionProceeding.decided_by_user_id, the acting X-User-ID differs from the user id recorded on the earlier segregated step (see the three independence rules at priorities 44-46; this rule only asserts the headers are usable for the comparison)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /assessments/{id}/sign-off, POST /determinations/{id}/issue, POST /appeals/{id}/assign-reviewer, POST /appeals/{id}/decision, POST /suspension-proceedings/{id}/decide"

  # ---- 10-12 existence (path resources left-to-right, then body FKs) ----------------------------
  - priority: 10
    category: existence
    check: "every id in the request path resolves to a stored entity, validated left-to-right"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_VERIFICATION_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_TRIP_EVENT_NOT_FOUND | ERR_PROCEEDING_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_VISITOR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 11
    category: existence
    check: "every foreign key in the request body resolves to a stored entity (applicant_id, application_id, slot_id, vehicle_id, assessment_id, determination_id)"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /applications, POST /applications/{id}/assessments, POST /transportation-bookings, POST /appeals, POST /trip-events, POST /applicants/{id}/travel-training-referrals"
  - priority: 12
    category: existence
    check: "a nested path child belongs to its declared parent (verification_id belongs to the application in the path)"
    error_id: ERR_VERIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /applications/{id}/verifications/{verification_id}/receive"

  # ---- 20-22 request shape ----------------------------------------------------------------------
  - priority: 20
    category: business_referential
    check: "all required input fields present; enum fields carry a declared value; numeric fields are within their declared range (scores 0-4, distance_meters_walked >= 0, threshold_value >= 0); instants are ISO-8601 UTC; interval fields satisfy start < end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 22
    category: business_referential
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /applications, GET /assessments, GET /transportation-bookings, GET /determinations, GET /travel-training-referrals"

  # ---- 30-34 state preconditions ---------------------------------------------------------------
  - priority: 30
    category: state
    check: "the addressed Application is in a status from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /applications/{id}/return-incomplete, POST /applications/{id}/verifications, POST /applications/{id}/assessments, POST /applications/{id}/determinations"
  - priority: 30
    category: state
    check: "the addressed ProfessionalVerification has status == REQUESTED"
    error_id: ERR_VERIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/verifications/{verification_id}/receive"
  - priority: 31
    category: state
    check: "the addressed FunctionalAssessment is in the attendance_status / scoring_status pair the transition requires (attendance SCHEDULED for attendance; attendance ATTENDED for scores; scoring SCORED for sign-off)"
    error_id: ERR_INVALID_ASSESSMENT_STATE
    http_status: 409
    applies_to: "POST /assessments/{id}/attendance, POST /assessments/{id}/scores, POST /assessments/{id}/sign-off"
  - priority: 31
    category: state
    check: "the addressed Determination has status == DRAFT when issuing, and no other Determination of the same Application already has status == ISSUED"
    error_id: ERR_DETERMINATION_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /determinations/{id}/issue"
  - priority: 32
    category: state
    check: "the appealed Determination has status == ISSUED (a VACATED, SUPERSEDED, EXPIRED or DRAFT determination is not appealable)"
    error_id: ERR_DETERMINATION_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 32
    category: state
    check: "the addressed Appeal is in the status the transition requires (FILED for assign-reviewer, REVIEWER_ASSIGNED for hearing, HEARD for decision)"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /appeals/{id}/assign-reviewer, POST /appeals/{id}/hearing, POST /appeals/{id}/decision"
  - priority: 33
    category: state
    check: "the addressed SuspensionProceeding is in the status the transition requires (PROPOSED for send-notice; NOTICE_SENT for respond; RIDER_RESPONDED or RESPONSE_LAPSED for decide; UPHELD_PENDING or ACTIVE for rescind)"
    error_id: ERR_PROCEEDING_STATE_INVALID
    http_status: 409
    applies_to: "POST /suspension-proceedings/{id}/send-notice, POST /suspension-proceedings/{id}/respond, POST /suspension-proceedings/{id}/decide, POST /suspension-proceedings/{id}/rescind"
  - priority: 33
    category: state
    check: "the addressed TravelTrainingReferral is in the status the transition requires (REFERRED for response, ENROLLED for complete)"
    error_id: ERR_REFERRAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /travel-training-referrals/{id}/response, POST /travel-training-referrals/{id}/complete"
  - priority: 34
    category: state
    check: "the addressed TransportationBooking has status == RESERVED"
    error_id: ERR_BOOKING_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /transportation-bookings/{id}/cancel"
  - priority: 34
    category: state
    check: "the addressed VisitorEligibility has status == ACTIVE (EXHAUSTED and SUPERSEDED_BY_LOCAL records are frozen)"
    error_id: ERR_VISITOR_RECORD_INACTIVE
    http_status: 409
    applies_to: "POST /visitor-eligibilities/{id}/service-days"

  # ---- 35 optimistic concurrency ---------------------------------------------------------------
  - priority: 35
    category: state
    check: "expected_application_version equals the addressed Application's current version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /applications/{id}/determinations"
  - priority: 35
    category: state
    check: "expected_applicant_version equals the addressed Applicant's current version"
    error_id: ERR_STALE_APPLICANT_VERSION
    http_status: 412
    applies_to: "POST /applicants/{id}/suspension-proceedings"

  # ---- 40-46 safety / accessibility / compliance / segregation of duties ------------------------
  - priority: 40
    category: business_safety
    check: "when the booking's requires_wheelchair_position is true, the chosen Vehicle has wheelchair_positions >= 1"
    error_id: ERR_VEHICLE_NOT_ACCESSIBLE
    http_status: 422
    applies_to: "POST /transportation-bookings"
  - priority: 41
    category: business_safety
    check: "when the requested assessment has requires_wheelchair_position == true, the chosen AssessmentSlot must have site_is_wheelchair_accessible == true"
    error_id: ERR_SITE_NOT_ACCESSIBLE
    http_status: 422
    applies_to: "POST /applications/{id}/assessments"
  - priority: 44
    category: business_safety
    check: "the signing X-User-ID differs from FunctionalAssessment.scored_by_user_id (the evaluator who scored may not sign off on their own scores)"
    error_id: ERR_SIGNOFF_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST /assessments/{id}/sign-off"
  - priority: 45
    category: business_safety
    check: "the assigned reviewer_user_id differs from the contested Determination.determined_by_user_id and from the scoring FunctionalAssessment.scored_by_user_id"
    error_id: ERR_REVIEWER_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST /appeals/{id}/assign-reviewer"
  - priority: 46
    category: business_safety
    check: "the deciding X-User-ID differs from SuspensionProceeding.proposed_by_user_id (the officer who proposed a suspension may not decide it)"
    error_id: ERR_DECIDER_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST /suspension-proceedings/{id}/decide"
  - priority: 47
    category: business_safety
    check: "a suspension may only be upheld after due process is complete: the proceeding has notice_sent_at set and its status is RIDER_RESPONDED or RESPONSE_LAPSED"
    error_id: ERR_DUE_PROCESS_INCOMPLETE
    http_status: 422
    applies_to: "POST /suspension-proceedings/{id}/decide"
  - priority: 48
    category: business_safety
    check: "a suspension may only be upheld while the conduct record still supports it: no_show_points_event_basis >= 6 AND chargeable_miss_count_90d >= 3 AND no_show_ratio_pct > 10.0, all recomputed at decision time"
    error_id: ERR_SUSPENSION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /suspension-proceedings/{id}/decide"

  # ---- 50-55 cross-entity referential business rules --------------------------------------------
  - priority: 50
    category: business_referential
    check: "a Determination draft requires the Application to own exactly one FunctionalAssessment with attendance_status == ATTENDED whose scoring_status == SIGNED_OFF"
    error_id: ERR_ASSESSMENT_NOT_SIGNED_OFF
    http_status: 422
    applies_to: "POST /applications/{id}/determinations"
  - priority: 51
    category: business_referential
    check: "category == CONDITIONAL requires at least one trip_conditions entry in the draft payload"
    error_id: ERR_CONDITIONAL_REQUIRES_CONDITIONS
    http_status: 422
    applies_to: "POST /applications/{id}/determinations"
  - priority: 51
    category: business_referential
    check: "category IN {UNCONDITIONAL, INELIGIBLE} requires the trip_conditions payload to be absent or empty"
    error_id: ERR_UNCONDITIONAL_FORBIDS_CONDITIONS
    http_status: 422
    applies_to: "POST /applications/{id}/determinations"
  - priority: 52
    category: business_referential
    check: "a travel-training referral requires the applicant to hold a Determination with status == ISSUED whose category is CONDITIONAL or TEMPORARY"
    error_id: ERR_CATEGORY_NOT_TRAINABLE
    http_status: 422
    applies_to: "POST /applicants/{id}/travel-training-referrals"
  - priority: 53
    category: business_referential
    check: "visitor eligibility requires Applicant.residence_zone == OUT_OF_SERVICE_AREA and home_agency_certification_provided == true"
    error_id: ERR_NOT_OUT_OF_AREA
    http_status: 422
    applies_to: "POST /applicants/{id}/visitor-eligibilities"
  - priority: 54
    category: business_referential
    check: "visitor eligibility is refused when the applicant already holds a Determination with status == ISSUED and category != INELIGIBLE"
    error_id: ERR_LOCAL_ELIGIBILITY_EXISTS
    http_status: 422
    applies_to: "POST /applicants/{id}/visitor-eligibilities"
  - priority: 55
    category: business_referential
    check: "a trip-by-trip eligibility check requires the Determination to be ISSUED and its category to be CONDITIONAL, UNCONDITIONAL or TEMPORARY (the endpoint returns a structured denial rather than an error for INELIGIBLE)"
    error_id: ERR_DETERMINATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /determinations/{id}/trip-eligibility-check"

  # ---- 56-61 constraint satisfaction: uniqueness, capacity, interval conflicts -------------------
  - priority: 56
    category: business_constraint
    check: "the applicant has no other Application whose status is not DETERMINED (one open application per rider)"
    error_id: ERR_DUPLICATE_OPEN_APPLICATION
    http_status: 409
    applies_to: "POST /applications"
  - priority: 57
    category: business_constraint
    check: "no ProfessionalVerification of this Application has status == REQUESTED when a new one is requested"
    error_id: ERR_VERIFICATION_PENDING
    http_status: 409
    applies_to: "POST /applications/{id}/verifications"
  - priority: 58
    category: business_constraint
    check: "the evaluator has no AssessmentSlot conflicting with the new slot under evaluator_slot_conflict (closed intervals expanded by a 15-minute buffer on both sides; back-to-back slots conflict)"
    error_id: ERR_EVALUATOR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /assessment-slots"
  - priority: 59
    category: business_constraint
    check: "the chosen AssessmentSlot has booked_count < capacity"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /applications/{id}/assessments"
  - priority: 60
    category: business_constraint
    check: "the chosen Vehicle has a free lane over the requested half-open pickup window under vehicle_window_occupancy (adjacent windows do not conflict; the aggregate of RESERVED bookings in the same lane must stay within capacity)"
    error_id: ERR_VEHICLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /transportation-bookings"
  - priority: 61
    category: business_constraint
    check: "the VisitorEligibility record has days_used_365 < 21 for the rolling 365-day window ending on the requested service_date"
    error_id: ERR_VISITOR_DAYS_EXHAUSTED
    http_status: 409
    applies_to: "POST /visitor-eligibilities/{id}/service-days"

  # ---- 62-68 temporal windows -------------------------------------------------------------------
  - priority: 62
    category: business_temporal
    check: "date(filed_at) <= Determination.effective_date + 60 days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 63
    category: business_temporal
    check: "an AssessmentSlot must start strictly after the logical clock now"
    error_id: ERR_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /assessment-slots, POST /applications/{id}/assessments"
  - priority: 64
    category: business_temporal
    check: "the booking's pickup_window_end must be at or before the assessment slot's starts_at"
    error_id: ERR_PICKUP_WINDOW_LATE
    http_status: 422
    applies_to: "POST /transportation-bookings"
  - priority: 65
    category: business_temporal
    check: "TripEvent.trip_date must not be later than date(logical clock now)"
    error_id: ERR_TRIP_DATE_FUTURE
    http_status: 422
    applies_to: "POST /trip-events"
  - priority: 66
    category: business_temporal
    check: "a rider response to a suspension notice must arrive on or before response_deadline_date (notice_sent_at + 14 days)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /suspension-proceedings/{id}/respond"
  - priority: 67
    category: business_temporal
    check: "a referral response must arrive on or before referral_response_deadline_date (date(created_at) + 14 days)"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /travel-training-referrals/{id}/response"
  - priority: 68
    category: business_temporal
    check: "a visitor service_date must be on or after VisitorEligibility.visit_start_date and not later than date(logical clock now) + 90 days"
    error_id: ERR_SERVICE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /visitor-eligibilities/{id}/service-days"

  - priority: 5
    category: auth
    check: "for appeal hearing and decision endpoints the acting X-User-ID equals Appeal.reviewer_user_id (only the assigned independent reviewer may act)"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /appeals/{id}/hearing, POST /appeals/{id}/decision"
  - priority: 39
    category: business_safety
    check: "the chosen Vehicle has status == IN_SERVICE"
    error_id: ERR_VEHICLE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /transportation-bookings"
  - priority: 42
    category: business_referential
    check: "hearing_at must be supplied when Appeal.request_hearing == true"
    error_id: ERR_HEARING_REQUIRED
    http_status: 422
    applies_to: "POST /appeals/{id}/hearing"
  - priority: 43
    category: business_referential
    check: "hearing_at must be omitted when Appeal.request_hearing == false (the paper-review branch has no hearing)"
    error_id: ERR_HEARING_NOT_REQUESTED
    http_status: 422
    applies_to: "POST /appeals/{id}/hearing"
  - priority: 49
    category: business_referential
    check: "outcome IN {OVERTURNED, MODIFIED} requires granted_category non-null; outcome == UPHELD requires granted_category null"
    error_id: ERR_GRANTED_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /appeals/{id}/decision"
  - priority: 69
    category: business_temporal
    check: "suspension_start_date must be on or after date(logical clock now) when decision == UPHELD"
    error_id: ERR_SUSPENSION_START_IN_PAST
    http_status: 422
    applies_to: "POST /suspension-proceedings/{id}/decide"

endpoints:
  # ---------------- reads -------------------------------------------------------------------------
  - method: GET
    path: "/applicants/{id}"
    description: "Fetch one applicant with every derived eligibility, conduct and service mirror."
    roles: [Applicant, IntakeClerk, Evaluator, EligibilitySpecialist, IndependentReviewer, ConductOfficer, TravelTrainer, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applications/{id}"
    description: "Fetch one application with both pending-day variants and the statutory due date."
    roles: [Applicant, IntakeClerk, EligibilitySpecialist, IndependentReviewer, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List applications, optionally filtered by applicant or workflow status."
    roles: [Applicant, IntakeClerk, EligibilitySpecialist, AccessibilityOfficeAdmin]
    code: 200
    input: ["applicant_id?", "status?", "application_type?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications/{id}/verifications"
    description: "List the professional verifications requested for one application, ordered by created_at ASC."
    roles: [IntakeClerk, EligibilitySpecialist, IndependentReviewer, AccessibilityOfficeAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProfessionalVerification[]
    side_effects: []
  - method: GET
    path: "/assessment-slots/{id}"
    description: "Fetch one assessment slot with its booked_count and OPEN/FULL status."
    roles: [IntakeClerk, Evaluator, EligibilitySpecialist, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: AssessmentSlot
    side_effects: []
  - method: GET
    path: "/assessments/{id}"
    description: "Fetch one functional assessment with both state dimensions and the scoring recommendation."
    roles: [Applicant, IntakeClerk, Evaluator, EligibilitySpecialist, IndependentReviewer, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: FunctionalAssessment
    side_effects: []
  - method: GET
    path: "/assessments"
    description: "List functional assessments; the reschedule filter walks the self-referential chain."
    roles: [IntakeClerk, Evaluator, EligibilitySpecialist, AccessibilityOfficeAdmin]
    code: 200
    input: ["application_id?", "slot_id?", "rescheduled_from_assessment_id?", "attendance_status?", "limit?", "offset?"]
    output: FunctionalAssessment[]
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch one vehicle with its two conserved open-reservation counters."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/transportation-bookings/{id}"
    description: "Fetch one agency-provided ride reservation."
    roles: [Applicant, IntakeClerk, AccessibilityOfficeAdmin]
    code: 200
    input: []
    output: TransportationBooking
    side_effects: []
  - method: GET
    path: "/transportation-bookings"
    description: "List ride reservations by assessment, vehicle or status."
    roles: [IntakeClerk, AccessibilityOfficeAdmin]
