          Depth-3 cascade triggered by add-on apply: bump remaining SCHEDULED lines (link 1) -> that
          raises Lease.financed_amount_cents by added_cost (link 2) -> which recomputes
          Lessee.committed_credit_cents and available_credit_cents (link 3) -> which recomputes
          Lessor.portfolio_value_cents (link 4). Each link is caused by the prior, not the apply directly.
