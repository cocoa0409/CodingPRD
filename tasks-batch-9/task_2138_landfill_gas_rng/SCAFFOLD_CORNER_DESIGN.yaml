  - section: validations
    instances:
      - name: request_missing_x_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 10 fires before everything else: a GET /sites/{id} sent with neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED even though the site id is perfectly valid."
        test_recipe:
          setup: ["One LandfillSite exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The request carries no X-User-Role and no X-User-ID header"
            - "HTTP status is 401"
            - "data.error_id == 'ERR_UNAUTHENTICATED'"

      - name: role_check_beats_path_existence_returns_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=20]", "validations[priority=30]", "errors[ERR_ROLE_NOT_PERMITTED]", "errors[ERR_ROYALTY_STATEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Category pair auth (priority 20) versus existence (priority 30): a WellfieldTechnician asking for a royalty statement id that does not exist gets 403 ERR_ROLE_NOT_PERMITTED, never 404 - the authorization gate runs before the lookup."
        test_recipe:
          setup: ["One LandfillSite exists; no RoyaltyStatement has the probed id."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /royalty-statements/00000000-0000-4000-8000-000000000000"
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403"
            - "data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "data.error_id != 'ERR_ROYALTY_STATEMENT_NOT_FOUND'"

      - name: body_schema_check_beats_body_foreign_key_existence_returns_invalid_request
        claim_type: priority_ordering
        grounds: ["validations[priority=40]", "validations[priority=50]", "errors[ERR_VALIDATION]", "errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "Category pair business_constraint (priority 40 schema) versus existence (priority 50 body FK): a POST /wells that both omits target_flow_scfm and names an unknown site_id returns 400 ERR_VALIDATION, not 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the logical clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
          trigger:
            - call: "POST /wells"
              payload: { site_id: "00000000-0000-4000-8000-000000000000", well_code: "W-09" }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == 'ERR_VALIDATION'"
            - "data.error_id != 'ERR_SITE_NOT_FOUND'"

      - name: gas_composition_summing_over_one_hundred_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=55]", "errors[ERR_GAS_COMPOSITION_INVALID]"]
        distinguishing_aspect: "methane 90.0 + oxygen 8.0 + nitrogen 10.0 = 108.0 exceeds 100, so the reading is refused with 422 ERR_GAS_COMPOSITION_INVALID at priority 55 - before the classification ladder or any well transition runs, so the well stays ONLINE despite the alarm-level oxygen."
        test_recipe:
          setup: ["One LandfillSite and one GasWell W-01 in ONLINE with no readings."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 90.0, oxygen_pct: 8.0, nitrogen_pct: 10.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "data.error_id == 'ERR_GAS_COMPOSITION_INVALID'"
            - "GasWell.${w1_id}.operating_state == ONLINE"
            - "GasWell.${w1_id}.last_quality_class == NONE"
            - "GET /wells/${w1_id}/readings?limit=10&offset=0 returns total_count == 0"

