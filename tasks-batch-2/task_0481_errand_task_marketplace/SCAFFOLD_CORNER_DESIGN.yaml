# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index (breadth probe)
# Errand & Task Marketplace. Walks claim-extraction-guide sections against
# §1.1–§1.7. excluded_because stubs cite §1.8 instances by name.
# Logical clock default: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_tasker_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Tasker"
          - "endpoints"
        distinguishing_aspect: "POST /taskers with full_name+hourly_rate_cents -> 201; status=ACTIVE, trust_score=100, version=1, avg_rating=0.0."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-01-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /taskers"
              payload: { full_name: "Fresh Tasker", hourly_rate_cents: 4500 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
          assert:
            - "response code 201"
            - "Tasker.${tk_id}.status == ACTIVE"
            - "Tasker.${tk_id}.trust_score == 100"
            - "Tasker.${tk_id}.avg_rating == 0.0"
            - "Tasker.${tk_id}.version == 1"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Booking"
          - "errors[ERR_BOOKING_NOT_FOUND]"
        distinguishing_aspect: "GET /bookings/{unknown-uuid} -> 404 ERR_BOOKING_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response code 404"
            - "response error_id == ERR_BOOKING_NOT_FOUND"

      - name: create_category_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.TaskCategory"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /task-categories without pricing_model -> 422 ERR_INVALID_REQUEST (required field absent)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /task-categories"
              payload: { name: "No Model", default_duration_minutes: 60 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response code 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_booking_default_tip_zero
        claim_type: Defaults
        grounds:
          - "entities.Booking.fields.tip_cents"
        distinguishing_aspect: "POST /bookings omitting tip_cents -> Booking.tip_cents defaults to 0."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; HOURLY category exists; client exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Def Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Def Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-26T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.tip_cents == 0"
            - "Booking.${bk_id}.status == DRAFT"

      - name: review_rating_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Review.fields.rating_value"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /reviews with rating_value=6 -> 422 ERR_INVALID_REQUEST (outside 1..5)."
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; a COMPLETED HOURLY booking exists for client cl on tasker tk; no review yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Rev Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Rev Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Rev Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 1.0 }
              as: Tasker
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /reviews"
              payload: { booking_id: "${bk_id}", rating_value: 6 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: chat_message_immutable_append_only_no_version
        claim_type: Immutability
        grounds:
          - "entities.ChatMessage"
        distinguishing_aspect: "ChatMessage uses common_fields:false — it carries id+created_at only, has no PUT/version, and listing returns it in created_at ASC order."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; a CLAIMED booking with client and assigned tasker."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Chat Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Chat Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Chat Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
          trigger:
            - call: "POST /bookings/${bk_id}/messages"
              payload: { body: "On my way" }
              as: Tasker
              as_user_id: "${tk_id}"
              captures: { msg_id: $.data.id }
            - call: "GET /bookings/${bk_id}/messages"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "ChatMessage.${msg_id}.sender_role == TASKER"
            - "GET messages returns the message with created_at populated"
            - "ChatMessage response carries no version field (common_fields:false)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_already_claimed_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.transitions.OFFERED_to_CLAIMED"
          - "errors[ERR_BOOKING_INVALID_STATE]"
        distinguishing_aspect: "Claiming an already-CLAIMED booking (not OFFERED) -> 409 ERR_BOOKING_INVALID_STATE; no second tasker assigned."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; booking CLAIMED onto tasker A; a second tasker B exists, ACTIVE, with overlapping window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Claim2 Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Tasker A", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tka: $.data.id, tka_v0: $.data.version }
            - call: "POST /taskers"
              payload: { full_name: "Tasker B", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tkb: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Claim Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tka}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tkb}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tka}", expected_tasker_version: "${tka_v0}" }
              as: Dispatcher
            - call: "GET /taskers/${tkb}"
              payload: {}
              as: Dispatcher
              captures: { tkb_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tkb}", expected_tasker_version: "${tkb_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_BOOKING_INVALID_STATE"
            - "Booking.${bk_id}.tasker_id == ${tka} (unchanged)"

      - name: complete_terminal_completed_booking_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Booking.transitions.IN_PROGRESS_to_COMPLETED"
          - "errors[ERR_BOOKING_INVALID_STATE]"
        distinguishing_aspect: "Calling complete on a COMPLETED (terminal) booking -> 409 ERR_BOOKING_INVALID_STATE; no second Settlement created."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; a COMPLETED booking already settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Term Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Term Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Term Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 1.0 }
              as: Tasker
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 1.0 }
              as: Tasker
              as_user_id: "${tk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_BOOKING_INVALID_STATE"

      - name: cancel_in_progress_booking_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Booking.transitions.CLAIMED_to_CANCELLED"
          - "errors[ERR_BOOKING_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an IN_PROGRESS booking -> 409 ERR_BOOKING_INVALID_STATE (IN_PROGRESS is not in the cancel from-set); booking stays IN_PROGRESS."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; booking IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "InProg Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "InProg Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "InProg Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancelled_by: "CLIENT" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_BOOKING_INVALID_STATE"
            - "Booking.${bk_id}.status == IN_PROGRESS (unchanged)"

      - name: offered_booking_expires_when_clock_passes_start
        claim_type: Valid Transition
        grounds:
          - "state_machines.Booking.transitions.OFFERED_to_EXPIRED"
          - "endpoints"
        distinguishing_aspect: "An OFFERED booking, when the clock is advanced past its scheduled_start, lazily becomes EXPIRED on the next GET; no Settlement/Cancellation."
        test_recipe:
          setup: ["Clock 2026-06-25T08:00:00Z; OFFERED booking scheduled 2026-06-25T10:00:00Z (SAME_DAY)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "Expire Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Expire Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SAME_DAY", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T10:30:00Z" }
              as: Dispatcher
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "Booking.${bk_id}.status == EXPIRED"

      - name: vet_rejected_skill_returns_skill_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.TaskerSkill.transitions.PENDING_to_REJECTED"
          - "errors[ERR_SKILL_INVALID_STATE]"
        distinguishing_aspect: "Vetting a REJECTED skill -> 409 ERR_SKILL_INVALID_STATE (REJECTED is terminal)."
        test_recipe:
          setup: ["A TaskerSkill exists in REJECTED state."]
          setup_api_calls:
            - call: "POST /task-categories"
              payload: { name: "Skill Cat", pricing_model: "FIXED", fixed_price_cents: 5000, default_duration_minutes: 90, requires_vetting: true }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Skill Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id }
            - call: "POST /tasker-skills"
              payload: { tasker_id: "${tk_id}", category_id: "${cat_id}" }
              as: Dispatcher
              captures: { sk_id: $.data.id }
            - call: "POST /tasker-skills/${sk_id}/reject"
              payload: {}
              as: TrustSafetyOfficer
          trigger:
            - call: "POST /tasker-skills/${sk_id}/vet"
              payload: {}
              as: TrustSafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_SKILL_INVALID_STATE"

      - name: review_hide_then_restore_cycle_recomputes_avg
        claim_type: cyclic
        grounds:
          - "state_machines.Review.transitions.PUBLISHED_to_HIDDEN"
          - "state_machines.Review.transitions.HIDDEN_to_PUBLISHED"
          - "calculations.avg_rating"
        distinguishing_aspect: "Hiding the sole 5-star review drops tasker avg_rating to 0.0 (rating_count 0); restoring it returns avg_rating to 5.0 — the moderation cycle re-derives avg_rating each way."
        test_recipe:
          setup:
            - "Clock 2026-06-25T08:00:00Z; a COMPLETED booking reviewed 5 stars (tasker avg_rating=5.0, rating_count=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T08:00:00Z" }
              as: Dispatcher
            - call: "POST /task-categories"
              payload: { name: "AvgCyc Cat", pricing_model: "HOURLY", default_hourly_rate_cents: 4000, default_duration_minutes: 60, requires_vetting: false }
              as: Dispatcher
              captures: { cat_id: $.data.id }
            - call: "POST /taskers"
              payload: { full_name: "Avg Tasker", hourly_rate_cents: 4000 }
              as: Dispatcher
              captures: { tk_id: $.data.id, tk_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Avg Client" }
              as: Dispatcher
              captures: { cl_id: $.data.id }
            - call: "POST /availability-windows"
              payload: { tasker_id: "${tk_id}", window_start: "2026-06-25T09:00:00Z", window_end: "2026-06-25T14:00:00Z" }
              as: Dispatcher
            - call: "POST /bookings"
              payload: { client_id: "${cl_id}", category_id: "${cat_id}", dispatch_mode: "SCHEDULED", scheduled_start: "2026-06-25T10:00:00Z", estimated_hours: 1.0 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/offer"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /bookings/${bk_id}/claim"
              payload: { tasker_id: "${tk_id}", expected_tasker_version: "${tk_v0}" }
              as: Dispatcher
            - call: "POST /bookings/${bk_id}/depart"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/start"
              payload: {}
              as: Tasker
              as_user_id: "${tk_id}"
            - call: "POST /bookings/${bk_id}/complete"
              payload: { actual_hours: 1.0 }
              as: Tasker
