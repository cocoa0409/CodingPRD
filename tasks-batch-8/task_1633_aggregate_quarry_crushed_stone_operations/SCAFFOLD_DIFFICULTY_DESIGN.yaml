            - "reconcile 990.0 (1.0% off <= 2%): reconciliation_status == RECONCILED; production_status still COMPLETED"
            - "run_hours == 0.00 for a start+complete at the same logical timestamp"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: citation_overdue_posture_bench_shotplan_cascade
        grounds:
          - state_machines.QuarrySite.posture
          - state_machines.Bench.RELEASED_to_ON_HOLD
          - state_machines.ShotPlan.{APPROVED,DRILLING,DRILLED,LOADED}_to_ON_HOLD
          - calculations.posture_derivation
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /msha-citations: citation (ISSUED,
          S&S, overdue) -> QuarrySite.posture SUSPENDED (link 1) -> bench
          RELEASED -> ON_HOLD with hold_reason MSHA_SUSPENSION (link 2) ->
          shot plan APPROVED -> ON_HOLD with hold_return_state APPROVED (link 3).
          Abatement reverses the whole chain via the resume cascade.
        test_recipe:
          setup:
            - "Site OPERATING (bond 100000 posted); bench RELEASED; shot plan APPROVED; open MSHA inspection; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /msha-inspections", payload: { site_id: "${site}", inspection_type: "REGULAR" }, as: SafetyOfficer, as_user_id: "so-1", captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /msha-citations", payload: { msha_inspection_id: "${insp}", citation_code: "56.14100", s_and_s: true, abatement_due_on: "2026-07-15" }, as: SafetyOfficer, as_user_id: "so-1", captures: { cit: $.data.id } }
            - { call: "GET /sites/${site}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /benches/${bench}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /shot-plans/${plan}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /msha-citations/${cit}/abate", payload: { abated_on: "2026-08-01" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /shot-plans/${plan}", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { plan_after: $.data.status } }
          assert:
            - "after citation: QuarrySite.${site}.posture == SUSPENDED (link 1)"
            - "Bench.${bench}.status == ON_HOLD and hold_reason == MSHA_SUSPENSION (link 2)"
            - "ShotPlan.${plan}.status == ON_HOLD and hold_return_state == APPROVED (link 3)"
            - "after abate: QuarrySite.${site}.posture == OPERATING, Bench.${bench}.status == RELEASED (hold_reason null), ShotPlan.${plan}.status == APPROVED (hold_return_state null)"

      - name: plant_run_credit_backorder_sweep_cascade
        grounds:
          - state_machines.PlantRun
          - state_machines.SalesOrder.BACKORDERED_to_CONFIRMED
          - calculations.stockpile_availability
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /plant-runs/{id}/complete):
          run completion credits stockpile on_hand_tons (link 1) and that credit
          itself triggers the FIFO allocation sweep promoting the BACKORDERED
          order to CONFIRMED with reserved_tons += 30 (link 2).
        test_recipe:
          setup:
