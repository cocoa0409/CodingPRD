  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_reprice_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-reprice-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Order.version: reprice with the version observed at quote (2) succeeds and bumps to 3; replaying the same expected_order_version 2 is deterministically rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["depot cap 10; mini book ACTIVE; customer; WILL_CALL order QUOTED (version 2 after quote)"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot X52", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "mini"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "X52", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", depot_id: "${depot_id}", channel: WILL_CALL, event_date: "2026-05-10", window_start: "10:00", window_end: "12:00", lines: [{ product_form: BLOCK, packaging: PALLET, quantity_units: 1 }] }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, v_create: $.data.version }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { q_ver: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/reprice"
              payload: { expected_order_version: "${q_ver}" }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { v_after: $.data.version }
            - call: "POST /orders/${order_id}/reprice"
              payload: { expected_order_version: "${q_ver}" }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "v_create == 1 and q_ver == 2 (quote bumped the version)"
            - "v_after == 3 (fresh expected version succeeds)"
            - "err == ERR_STALE_VERSION with HTTP 412 (replayed stale version 2)"

      - name: occ_route_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[route-standing-order-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on RecurringRoute.version: patching standing lines with the created version 1 succeeds (version 2); replaying expected_route_version 1 fails 412."
        test_recipe:
          setup: ["depot; customer; route MON ACTIVE version 1"]
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot X53", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /customers"
              payload: { account_name: "X53", kind: BAR_RESTAURANT, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /recurring-routes"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                weekday: MON
                window_start: "08:00"
                window_end: "10:00"
                standing_lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 1 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { route_id: $.data.id, r_ver: $.data.version }
          trigger:
            - call: "PATCH /recurring-routes/${route_id}/standing-order"
              payload:
                expected_route_version: "${r_ver}"
                standing_lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 3 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { v_after: $.data.version }
            - call: "PATCH /recurring-routes/${route_id}/standing-order"
              payload:
                expected_route_version: "${r_ver}"
                standing_lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 5 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "r_ver == 1 and v_after == 2 (fresh patch succeeds)"
            - "err == ERR_STALE_VERSION with HTTP 412 (stale replay rejected)"

      - name: immediate_consistency_confirm_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        excluded_because:
          difficulty_instance: discount_then_surcharge_evaluation_order
          rationale: "The named §1.8 instance asserts FINAL component fields directly on the confirm trigger response (immediate visibility in the same envelope)."

