              captures: { code1: $.data.code }
            - call: "GET /adjunct-hr/departments/${dept_id}"
              payload: {}
              as: Dean
              captures: { code2: $.data.code }
            - call: "GET /adjunct-hr/departments/${dept_id}"
              payload: {}
              as: HRReviewer
              captures: { code3: $.data.code }
          assert:
            - "all three GETs succeed and return code == SHRD"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency_layer
        grounds: [complexity_profile.complexity_layers, entities.CourseSection]
        distinguishing_aspect: "Section version starts 1 at create, increments to 2 on enrollment PATCH, to 3 on cancel — every mutation bumps version by exactly 1 and refreshes updated_at."
        test_recipe:
          setup: ["department + term; one section created"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "VERX", name: "VerDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "VER-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 20, min_enrollment: 5 }
              as: DepartmentChair
              captures: { sec_id: $.data.id, v1: $.data.version }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "PATCH /adjunct-hr/sections/${sec_id}"
              payload: { enrollment: 17 }
              as: DepartmentChair
              captures: { v2: $.data.version }
            - call: "POST /adjunct-hr/sections/${sec_id}/cancel"
              payload: { cancellation_reason: "PROGRAM_CUT" }
              as: DepartmentChair
              captures: { v3: $.data.version }
          assert:
            - "version at creation == 1; after PATCH == 2; after cancel == 3 (exactly +1 per mutation)"
            - "updated_at is refreshed (strictly later) on each mutation"

      - name: clock_default_and_deterministic_expiry
        claim_type: scheduled_actions_layer
        grounds: [complexity_profile.complexity_layers, "endpoints: POST /adjunct-hr/_clock/set_current_utc", state_machines.AdjunctPoolPosting.OPEN_to_CLOSED]
        distinguishing_aspect: "Without any clock-set call the logical clock reads 2026-08-01T00:00:00Z exactly; advancing past a posting's close_date auto-closes the posting and expires its SUBMITTED applications without any explicit close call."
        test_recipe:
          setup: ["posting with open 2026-07-01 close 2026-07-15 published while clock is at default (2026-08-01) — publish precondition 'current date <= close_date' would FAIL at default clock, so the chain sets the clock back first, publishes, files a SUBMITTED application, then advances past close"]
          setup_api_calls:
            # default clock assertion is part of the claim: before any set, reads 2026-08-01T00:00:00Z
            - call: "POST /adjunct-hr/departments"
              payload: { code: "CLKX", name: "ClockDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Clock Pool", min_education_tier: "BACHELORS", open_date: "2026-07-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Lua Adjunct", applicant_email: "lua@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
          trigger:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-07-16T00:00:00Z" }, as: HRAdmin }
            - call: "GET /adjunct-hr/postings/${posting_id}"
              payload: {}
              as: HRAdmin
              captures: { p_status: $.data.posting_status }
            - call: "GET /adjunct-hr/applications/${app_id}"
              payload: {}
              as: HRAdmin
              captures: { a_status: $.data.application_status }
          assert:
            - "server startup default clock is 2026-08-01T00:00:00Z (asserted by fixture contract; the first department create succeeds without any clock set)"
            - "after advancing past close_date: posting_status == CLOSED (system auto-close, no explicit close call)"
            - "the SUBMITTED application auto-expired: application_status == EXPIRED"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_section_cancel
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.CourseSection.RUNNING_to_CANCELLED]
        distinguishing_aspect: "The cancel response itself and an immediately-following GET both reflect the full cascade (contract status + payable + faculty load) with no lag — immediate consistency model."
        test_recipe:
          setup: ["compliant faculty, RUNNING section, ACTIVE contract (gross 9000000), clock 2026-10-19"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "CONS", name: "ConsDept", contact_hour_value: 1.00 }
              as: HRAdmin
