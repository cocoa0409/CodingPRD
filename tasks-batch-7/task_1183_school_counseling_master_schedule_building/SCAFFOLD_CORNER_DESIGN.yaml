              captures: { sod_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == reviewed_by_counselor_id ${c_sod}"
      - name: credit_ceiling_blocks_add
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_CREDIT_CEILING_EXCEEDED]"
        distinguishing_aspect: "An ADD that would push planned_credit_load above 8.0 fails ERR_CREDIT_CEILING_EXCEEDED at execute."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW; student s_max enrolled in 8.0 credits; APPROVED ADD request cr_max for a 1.0-credit section"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Max", max_caseload: 50 }
              as: Administrator
              captures: { c_max: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2057-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_max: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW with s_max
            # enrolled in 8 x 1.0-credit sections; ADD created+claimed+approved
            # while the check would pass only if... pinned so approval happened
            # before the 8th enrollment (or approval quota path allows it) and
            # execute re-validates against the now-full 8.0 load.
            - call: "POST /scheduling/students"
              payload: { external_ref: "MAX", full_name: "Max Stu", grade_level: 12, counselor_id: "${c_max}", earned_credits: 20.0 }
              as: Administrator
              captures: { s_max: "$.data.id" }
          trigger:
            - call: "POST /scheduling/change-requests/${cr_max}/execute"
              payload: {}
              as: Administrator
              captures: { ceil_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CREDIT_CEILING_EXCEEDED (422): 8.0 + 1.0 > 8.0"
      - name: singleton_cap_boundary
        claim_type: boundary_edge
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_SINGLETON_CAP_EXCEEDED]"
        distinguishing_aspect: "With singleton_section_cap == 2, a student holding 2 singleton enrollments may not add a 3rd; a student holding 1 may add a 2nd (boundary at equality)."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW singleton_section_cap=2; s_sg2 holds 2 singleton enrollments + APPROVED ADD cr_sg2 for a 3rd singleton; s_sg1 holds 1 + APPROVED ADD cr_sg1 for a 2nd"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Sg2", max_caseload: 50 }
              as: Administrator
              captures: { c_sg2: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2058-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2 }
              as: Administrator
              captures: { t_sg2: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW with three
            # singleton courses, s_sg2 enrolled in two of them and s_sg1 in
            # one; APPROVED ADDs pinned for each student into the remaining
            # singleton section(s).
          trigger:
            - call: "POST /scheduling/change-requests/${cr_sg2}/execute"
              payload: {}
              as: Administrator
              captures: { sg2_err: "$.data.error_id" }
            - call: "POST /scheduling/change-requests/${cr_sg1}/execute"
              payload: {}
              as: Administrator
              captures: { sg1_state: "$.data.state" }
          assert:
            - "s_sg2's execute fails ERR_SINGLETON_CAP_EXCEEDED (2 -> 3 would exceed cap 2)"
            - "s_sg1's execute succeeds (1 -> 2 reaches but does not exceed cap 2)"

