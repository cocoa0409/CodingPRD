scenario: |
  Generate task harder than expert level!

  2481. Consulting Engagement Scoping & Change Control (management consulting firm): opportunity
  qualification with client decision process, budget and conflict checks, scope definition with
  deliverables, assumptions, exclusions and client responsibilities, pricing model selection across
  fixed fee, time and materials and outcome-based with risk assessment, statement of work drafting
  with acceptance criteria and dependency assumptions, change request identification when client
  requests exceed scope with impact analysis and approval, engagement economics tracking on hours
  burned versus deliverable completion, quality review checkpoints and risk escalation to firm
  leadership, client satisfaction assessment and follow-on opportunity development

domain_name: consulting-engagement-scoping-change-control
api_prefix: "/consulting"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  secondary_state_machine_shapes: [parallel, branching]
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Flat topology: every entity is a peer collection under /consulting with FK references in the
    body; no entity ids are nested in another entity's path. Cyclic negotiation loop lives on Sow
    (CLIENT_REVIEW -> REVISION_REQUESTED -> DRAFT -> INTERNAL_REVIEW -> CLIENT_REVIEW) and on
    Opportunity (SOW_ISSUED -> SCOPING -> SCOPE_BASELINED -> SOW_ISSUED). Engagement carries two
    independent state dimensions (delivery_state x economics_state). ChangeRequest is a fork-join
    branch (IMPACT_ASSESSED -> {PENDING_LEADERSHIP_APPROVAL, PENDING_CLIENT_APPROVAL}) whose branch
    is selected by a computed threshold, with divergent side-effect sets per branch.

entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: client organisation legal name
        constraints: 1..200 chars, required
      - name: client_code
        type: string
        source: input
        description: short firm-wide code used by conflict screening
        constraints: "^[A-Z0-9]{2,10}$, unique across all Client rows (ERR_CLIENT_CODE_TAKEN)"
      - name: industry_code
        type: string
        source: input
        description: industry classification used for reporting and conflict adjacency
        constraints: "one of RETAIL, INDUSTRIAL, FINSVC, PUBLIC, HEALTH"
      - name: decision_process
        type: enum
        source: input
        description: how this client approves professional-services purchases; drives qualification and risk scores
        constraints: "SINGLE_APPROVER | COMMITTEE | PROCUREMENT_LED"
      - name: adverse_party_codes
        type: array
        source: input
        description: client_code values of parties this client considers adverse to itself
        default: []
        constraints: array of 0..10 uppercase codes
      - name: stated_budget_authority_cents
        type: integer
        source: input
        description: annual professional-services budget authority the client claims to hold
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: commercial standing of the client; gates signature of any Sow
        default: ACTIVE
        constraints: "ACTIVE | CREDIT_HOLD | INACTIVE (written only by POST /consulting/clients/{id}/status)"
      - name: completed_engagement_count
        type: integer
        source: computed
        description: number of Engagement rows for this client with delivery_state == CLOSED; feeds the relationship term of qualification_score
        default: 0
      - name: at_risk_engagement_count
        type: integer
        source: computed
        description: number of Engagement rows for this client that currently hold at least one RiskEscalation with severity IN {HIGH, CRITICAL} and status in {OPEN, ACKNOWLEDGED, DELIVERY_HELD}
        default: 0

  - name: Consultant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: consultant full name
        constraints: 1..120 chars, required
      - name: grade
        type: enum
        source: input
        description: billing grade; selects the hourly billing rate constant used by every fee formula
        constraints: "PARTNER | MANAGER | CONSULTANT | ANALYST"
      - name: practice_code
        type: string
        source: input
        description: practice the consultant is staffed in; must match the opportunity's requested_practice_code to lead a deliverable
        constraints: "one of OPS, STRATEGY, DIGITAL, RISK"
      - name: cost_rate_cents_per_hour
        type: integer
        source: input
        description: internal cost rate applied to approved timesheet lines
        constraints: "> 0"
      - name: quality_reviewer_certified
        type: boolean
        source: input
        description: true when this consultant may be named as a QualityReview reviewer
        default: false
      - name: active_lead_deliverable_count
        type: integer
        source: computed
        description: number of Deliverable rows whose lead_consultant_id is this consultant and whose status is not ACCEPTED
        default: 0

  - name: Opportunity
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the prospective buyer"
      - name: owner_partner_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from X-User-ID of the EngagementPartner that created the row; the only partner allowed to act on it"
      - name: scoping_manager_consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; the only EngagementManager allowed to shape scope on this opportunity"
      - name: origin_engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; set only for follow-on development, null for net-new pursuits"
        default: null
      - name: requested_practice_code
        type: string
        source: input
        description: practice the client is buying; every deliverable lead must share this code
        constraints: "one of OPS, STRATEGY, DIGITAL, RISK"
      - name: estimated_value_cents
        type: integer
        source: input
        description: firm's own estimate of the pursuit's contract value; denominator of the budget-coverage term
        constraints: "> 0"
      - name: stated_budget_cents
        type: integer
        source: input
        description: budget the client verbally states at intake; input of the intake_screen qualification variant
        constraints: ">= 0"
      - name: verified_budget_cents
        type: integer
        source: system
        description: budget evidenced in writing; written only by POST /consulting/opportunities/{id}/verify-budget; input of the verified_requalification variant
        default: null
      - name: decision_maker_identified
        type: boolean
        source: input
        description: true when an economic buyer with signature authority has been named
      - name: target_start_date
        type: string
        source: input
        description: requested delivery start (YYYY-MM-DD); becomes Engagement.planned_start_date on signature
        constraints: "must be >= current logical clock date at creation (ERR_TARGET_DATE_IN_PAST)"
      - name: target_end_date
        type: string
        source: input
        description: requested delivery end (YYYY-MM-DD); becomes Engagement.planned_end_date on signature
        constraints: "must be > target_start_date (ERR_INVALID_DATE_RANGE)"
      - name: objective_summary
        type: string
        source: input
        description: one-paragraph statement of the client's objective
        default: null
      - name: assumptions
        type: array
        source: input
        description: scope assumptions the fee depends on; count feeds the scope-density risk term
        default: []
      - name: exclusions
        type: array
        source: input
        description: explicit out-of-scope statements; count feeds the scope-density risk term
        default: []
      - name: client_responsibilities
        type: array
        source: input
        description: obligations the client must discharge for the plan to hold; count feeds the obligation risk term
        default: []
      - name: status
        type: enum
        source: system
        description: pursuit lifecycle state
        default: SCREENING
        constraints: "SCREENING | QUALIFIED | SCOPING | SCOPE_BASELINED | SOW_ISSUED | WON | LOST | DISQUALIFIED"
      - name: conflict_status
        type: enum
        source: system
        description: conflict-of-interest screening outcome
        default: NOT_CHECKED
        constraints: "NOT_CHECKED | CLEAR | WAIVER_REQUIRED | CLEARED_WITH_WAIVER | BLOCKED"
      - name: screened_adverse_party_codes
        type: array
        source: system
        description: adverse party codes submitted on the most recent conflict check
        default: []
      - name: qualification_score_intake
        type: number
        source: computed
        description: qualification_score computed with the intake_screen variant at creation (2 dp)
        default: null
      - name: qualification_score_verified
        type: number
        source: computed
        description: qualification_score computed with the verified_requalification variant at POST /qualify (2 dp)
        default: null
      - name: total_estimated_hours
        type: number
        source: computed
        description: sum of effort_hours_estimate over this opportunity's deliverables, frozen at baseline (2 dp)
        default: null
      - name: scope_discount_pct
        type: number
        source: computed
        description: volume discount rate selected by total_estimated_hours at baseline; pinned into every downstream fee
        default: null
      - name: baseline_effort_cost_cents
        type: integer
        source: computed
        description: sum of the per-deliverable rounded line costs at baseline (round-per-line-then-sum)
        default: null
      - name: longest_dependency_chain
        type: integer
        source: computed
        description: node count of the longest depends_on_deliverable_id chain inside this opportunity, computed at baseline
        default: null
      - name: baselined_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful baseline-scope
        default: null

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: "FK -> Opportunity.id; the scope this deliverable belongs to"
      - name: lead_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; written only by POST /consulting/deliverables/{id}/assign-lead"
        default: null
      - name: depends_on_deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; predecessor that must reach ACCEPTED before this one may start; must belong to the same opportunity"
        default: null
      - name: name
        type: string
        source: input
        description: deliverable title
        constraints: 1..160 chars, required
      - name: primary_grade
        type: enum
        source: input
        description: grade whose billing rate prices this deliverable's estimated effort
        constraints: "PARTNER | MANAGER | CONSULTANT | ANALYST"
      - name: effort_hours_estimate
        type: number
        source: input
        description: estimated effort in hours, 2 dp
        constraints: "> 0, <= 5000.00"
      - name: completion_weight_pct
        type: number
        source: input
        description: share of engagement completion this deliverable represents, 2 dp; the opportunity's weights must sum to 100.00 at baseline
        constraints: "> 0, <= 100.00"
      - name: acceptance_criteria
        type: string
        source: input
        description: objective statement the client accepts against; must be non-empty at baseline
        default: null
      - name: planned_start_date
        type: string
        source: input
        description: planned start (YYYY-MM-DD); left edge of the half-open staffing interval
      - name: planned_end_date
        type: string
        source: input
        description: planned end (YYYY-MM-DD); right edge, exclusive, of the half-open staffing interval
        constraints: "must be > planned_start_date (ERR_INVALID_DATE_RANGE)"
      - name: status
        type: enum
        source: system
        description: delivery state of the deliverable
        default: PLANNED
        constraints: "PLANNED | IN_PROGRESS | SUBMITTED | REWORK | SUSPENDED | ACCEPTED"
      - name: prior_status
        type: enum
        source: system
        description: status held immediately before a SUSPENDED transition, restored when delivery resumes
        default: null
      - name: line_cost_cents
        type: integer
        source: computed
        description: rounded line cost at baseline = round_half_up(effort_hours_estimate * grade rate * (1 - opportunity.scope_discount_pct))
        default: null
      - name: hours_consumed
        type: number
        source: computed
        description: sum of hours over TimeEntry rows for this deliverable with status == APPROVED (2 dp)
        default: 0

  - name: Sow
    parent: null
    common_fields: true
    fields:
      - name: opportunity_id
        type: string
        source: input
        description: "FK -> Opportunity.id; the baselined scope this statement of work prices"
      - name: supersedes_sow_id
        type: string
        source: system
        description: "FK -> Sow.id; the non-terminal Sow this row replaced at creation, null for the first Sow of an opportunity"
        default: null
      - name: pricing_model
        type: enum
        source: input
        description: commercial construct selected for this statement of work
        constraints: "FIXED_FEE | TIME_AND_MATERIALS | OUTCOME_BASED"
      - name: target_bonus_cents
        type: integer
        source: input
        description: outcome bonus the client is willing to put at risk; required for OUTCOME_BASED and forbidden otherwise
        default: null
      - name: acceptance_summary
        type: string
        source: input
        description: acceptance-criteria and dependency-assumption summary carried into the contract
        constraints: 1..2000 chars, required
      - name: status
        type: enum
        source: system
        description: drafting and negotiation state
        default: DRAFT
        constraints: "DRAFT | INTERNAL_REVIEW | CLIENT_REVIEW | REVISION_REQUESTED | SIGNED | DECLINED | SUPERSEDED"
      - name: revision_round
        type: integer
        source: system
        description: number of completed client revision loops; a fourth loop is refused
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: 0..100 delivery-risk score computed at creation from pricing model, client decision process, scope density, dependency depth and client-responsibility count
        default: null
      - name: risk_premium_pct
        type: number
        source: computed
        description: premium tier selected by risk_score (0.05 / 0.12 / 0.20), pinned for the life of the contract
        default: null
      - name: pinned_scope_discount_pct
        type: number
        source: computed
        description: copy of opportunity.scope_discount_pct at creation; every change-request price reuses this pinned rate
        default: null
      - name: baseline_effort_cost_cents
        type: integer
        source: computed
        description: copy of opportunity.baseline_effort_cost_cents at creation
        default: null
      - name: quoted_fee_cents
        type: integer
        source: computed
        description: headline contract value for the selected pricing model
        default: null
      - name: fixed_component_cents
        type: integer
        source: computed
        description: guaranteed portion of the fee; equals quoted_fee_cents for FIXED_FEE and TIME_AND_MATERIALS
        default: null
      - name: at_risk_component_cents
        type: integer
        source: computed
        description: outcome-contingent portion after the cap is applied; 0 for FIXED_FEE and TIME_AND_MATERIALS
        default: 0
      - name: not_to_exceed_cents
        type: integer
        source: computed
        description: billing ceiling for TIME_AND_MATERIALS; null for the other two models
        default: null
      - name: signature_name
        type: string
        source: input
        description: name of the client signatory captured on the SIGN decision
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: logical-clock instant of signature
        default: null

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: sow_id
        type: string
        source: system
        description: "FK -> Sow.id; the signed statement of work that created this engagement"
      - name: opportunity_id
        type: string
        source: system
        description: "FK -> Opportunity.id; the won pursuit"
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; copied from the opportunity at signature"
      - name: lead_partner_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; copied from opportunity.owner_partner_consultant_id at signature"
      - name: engagement_manager_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; written only by POST /consulting/engagements/{id}/mobilize"
        default: null
      - name: delivery_state
        type: enum
        source: system
        description: first independent state dimension - where delivery stands
        default: MOBILIZING
        constraints: "MOBILIZING | ACTIVE | ON_HOLD | CLOSING | CLOSED"
      - name: economics_state
        type: enum
        source: system
        description: second independent state dimension - recomputed after every economics-bearing mutation
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | OVERRUN"
      - name: pricing_model
        type: enum
        source: system
        description: copied from the signed Sow
        constraints: "FIXED_FEE | TIME_AND_MATERIALS | OUTCOME_BASED"
      - name: original_fee_cents
        type: integer
        source: system
        description: sow.quoted_fee_cents at signature; immutable denominator of cumulative_change_pct
      - name: contracted_fee_cents
        type: integer
        source: computed
        description: original_fee_cents plus the fee_delta_cents of every ChangeRequest with status == APPROVED
      - name: contracted_hours
        type: number
        source: computed
        description: opportunity.total_estimated_hours plus the added_hours of every ChangeRequest with status == APPROVED (2 dp)
      - name: not_to_exceed_cents
        type: integer
        source: computed
        description: TIME_AND_MATERIALS billing ceiling, raised by approved change requests; null for other models
        default: null
      - name: pinned_scope_discount_pct
        type: number
        source: system
        description: copy of sow.pinned_scope_discount_pct; reused by every change-request price
      - name: pinned_risk_premium_pct
        type: number
        source: system
        description: copy of sow.risk_premium_pct; reused by every change-request price
      - name: approved_hours_burned
        type: number
        source: computed
        description: sum of hours over TimeEntry rows of this engagement with status == APPROVED (2 dp)
        default: 0
      - name: burned_cost_cents
        type: integer
        source: computed
        description: sum of the per-line rounded internal cost of every TimeEntry with status == APPROVED
        default: 0
      - name: cumulative_change_pct
        type: number
        source: computed
        description: 100 * (sum of fee_delta_cents over APPROVED change requests) / original_fee_cents (2 dp)
        default: 0
      - name: suspended_deliverable_count
        type: integer
        source: computed
        description: number of this engagement's deliverables with status == SUSPENDED
        default: 0
      - name: schedule_relief_days
        type: integer
        source: computed
        description: cumulative calendar days of schedule relief granted by approved change requests
        default: 0
      - name: planned_start_date
        type: string
        source: system
        description: copied from opportunity.target_start_date at signature (YYYY-MM-DD)
      - name: planned_end_date
        type: string
        source: computed
        description: opportunity.target_end_date plus schedule_relief_days (YYYY-MM-DD)
      - name: leadership_review_required
        type: boolean
        source: computed
        description: true while at least one RiskEscalation of severity HIGH on this engagement is not RESOLVED
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of CLOSED
        default: null

  - name: ChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement whose contract this request would move"
      - name: requested_by_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from X-User-ID of the EngagementPartner that raised the request"
      - name: leadership_approver_consultant_id
        type: string
        source: system
        description: "FK -> Consultant.id; set from X-User-ID of the FirmLeadership actor that decided the leadership step"
        default: null
      - name: supersedes_change_request_id
        type: string
        source: input
        description: "FK -> ChangeRequest.id; prior request on the same engagement this one replaces"
        default: null
      - name: origin
        type: enum
        source: input
        description: who identified the out-of-scope work
        constraints: "CLIENT_REQUEST | DELIVERY_TEAM"
      - name: summary
        type: string
        source: input
        description: description of the requested work that exceeds the baselined scope
        constraints: 1..1000 chars, required
      - name: added_hours
        type: number
        source: input
        description: additional effort hours requested, 2 dp
        constraints: "> 0, <= 5000.00"
      - name: added_grade
        type: enum
        source: input
        description: grade that would perform the additional effort; selects the billing rate
        constraints: "PARTNER | MANAGER | CONSULTANT | ANALYST"
      - name: requested_schedule_days
        type: integer
        source: input
        description: calendar days of schedule relief requested
        constraints: ">= 0, <= 180"
      - name: status
        type: enum
        source: system
        description: change-control state
        default: DRAFT
        constraints: "DRAFT | IMPACT_ASSESSED | PENDING_LEADERSHIP_APPROVAL | PENDING_CLIENT_APPROVAL | APPROVED | REJECTED | RESCINDED"
      - name: routing
        type: enum
        source: computed
        description: approval path selected by cumulative_change_pct_at_assessment at impact assessment
        default: null
        constraints: "CLIENT_ONLY | LEADERSHIP_THEN_CLIENT"
      - name: gross_delta_cents
        type: integer
        source: computed
        description: rounded billing value of the added effort at the pinned discount, before risk premium
        default: null
      - name: fee_delta_cents
        type: integer
        source: computed
        description: contract fee movement for the engagement's pricing model
        default: null
      - name: cumulative_change_pct_at_assessment
        type: number
        source: computed
        description: cumulative change percentage including this request, frozen at impact assessment (2 dp)
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of client approval
        default: null
      - name: rescinded_at
        type: datetime
        source: system
        description: logical-clock instant of rescission
        default: null

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement the effort is charged to"
      - name: deliverable_id
        type: string
        source: input
        description: "FK -> Deliverable.id; must belong to the engagement's opportunity"
      - name: consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; whose hours these are"
      - name: week_ending_date
        type: string
        source: input
        description: Saturday-ending week of the timesheet line (YYYY-MM-DD)
        constraints: "unique per (engagement_id, deliverable_id, consultant_id, week_ending_date)"
      - name: hours
        type: number
        source: input
        description: hours charged on the line, 2 dp
        constraints: "> 0, <= 60.00 (ERR_TIMESHEET_HOURS_OUT_OF_RANGE)"
      - name: billable
        type: boolean
        source: input
        description: false for write-off lines, which still consume internal cost but never bill
        default: true
      - name: status
        type: enum
        source: system
        description: timesheet line state
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REJECTED | REVERSED"
      - name: cost_cents
        type: integer
        source: computed
        description: round_half_up(hours * consultant.cost_rate_cents_per_hour), written on approval
        default: null
      - name: billed_value_cents
        type: integer
        source: computed
        description: round_half_up(hours * grade rate * (1 - engagement.pinned_scope_discount_pct)) when billable, else 0; written on approval
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: free-text reason captured on reversal
        default: null

  - name: QualityReview
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement under review"
      - name: reviewer_consultant_id
        type: string
        source: input
        description: "FK -> Consultant.id; certified reviewer, who must be independent of this engagement"
      - name: checkpoint_type
        type: enum
        source: input
        description: which quality gate this review discharges
        constraints: "SCOPE_GATE | MIDPOINT | PRE_DELIVERY"
      - name: window_start_date
        type: string
        source: input
        description: first day of the review window (YYYY-MM-DD), inclusive
      - name: window_end_date
        type: string
        source: input
        description: last day of the review window (YYYY-MM-DD), inclusive
        constraints: "must be >= window_start_date (ERR_INVALID_DATE_RANGE)"
      - name: status
        type: enum
        source: system
        description: review state
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | CONDITIONAL | FAILED"
      - name: findings_severity
        type: enum
        source: input
        description: severity recorded with the outcome; drives escalation severity
        default: null
        constraints: "NONE | LOW | MEDIUM | HIGH | CRITICAL"
      - name: note
        type: string
        source: input
        description: reviewer note
        default: null

  - name: RiskEscalation
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; engagement the escalation belongs to"
      - name: source_quality_review_id
        type: string
        source: system
        description: "FK -> QualityReview.id; set when source == QUALITY, null otherwise"
        default: null
      - name: source
        type: enum
        source: system
        description: which mechanism raised the escalation
        constraints: "QUALITY | ECONOMICS"
      - name: severity
        type: enum
        source: system
        description: severity carried from the raising mechanism
        constraints: "LOW | MEDIUM | HIGH | CRITICAL"
      - name: opened_reason
        type: string
        source: system
        description: machine-written reason string naming the triggering rule
      - name: status
        type: enum
        source: system
        description: leadership handling state
        default: OPEN
        constraints: "OPEN | ACKNOWLEDGED | DELIVERY_HELD | RESOLVED"
      - name: leadership_response
        type: enum
        source: input
        description: most recent leadership response recorded on this escalation
        default: null
        constraints: "ACKNOWLEDGE | HOLD_DELIVERY | RESOLVE"
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of RESOLVED
        default: null

  - name: SatisfactionAssessment
    parent: null
    common_fields: false
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement being assessed"
      - name: delivery_score
        type: integer
        source: input
        description: client score for delivery quality
        constraints: "1..10"
      - name: value_score
        type: integer
        source: input
        description: client score for value for money
        constraints: "1..10"
      - name: communication_score
        type: integer
        source: input
        description: client score for communication
        constraints: "1..10"
      - name: would_refer
        type: boolean
        source: input
        description: referenceability flag worth a fixed bonus in the composite
      - name: comments
        type: string
        source: input
        description: free-text client comments
        default: null
      - name: csat_score
        type: number
        source: computed
        description: weighted composite capped at 10.00 (2 dp); gates follow-on opportunity creation

state_machines:
  - entity: Opportunity
    state_field: status
    initial_state: SCREENING
    terminal_states: [WON, LOST, DISQUALIFIED]
    transitions:
      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /consulting/opportunities/{id}/qualify"
        actor: EngagementPartner
        preconditions:
          - "X-User-ID == opportunity.owner_partner_consultant_id"
          - "opportunity.verified_budget_cents is not null (else ERR_BUDGET_NOT_VERIFIED)"
          - "opportunity.conflict_status != BLOCKED (else ERR_CONFLICT_BLOCKED)"
          - "qualification_score (verified_requalification variant) >= 60.00"
        side_effects:
          - "writes qualification_score_verified with the verified_requalification variant result"
          - "increments Opportunity.version by 1"
      - from: SCREENING
        to: DISQUALIFIED
        trigger: "POST /consulting/opportunities/{id}/qualify"
        actor: EngagementPartner
        preconditions:
          - "same as SCREENING->QUALIFIED except qualification_score (verified_requalification variant) < 60.00"
        side_effects:
          - "writes qualification_score_verified with the verified_requalification variant result"
          - "increments Opportunity.version by 1"
        note: "Branch selected purely by the recomputed score; the intake score recorded at creation is never re-used here."
      - from: QUALIFIED
        to: SCOPING
        trigger: "PATCH /consulting/opportunities/{id}/scope"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == opportunity.scoping_manager_consultant_id (else ERR_NOT_ASSIGNED_TO_ENGAGEMENT)"
          - "opportunity.status == QUALIFIED"
        side_effects:
          - "writes the submitted objective_summary, assumptions, exclusions and client_responsibilities"
          - "increments Opportunity.version by 1"
        note: "Deliverables may only be added while status == SCOPING, so the scope narrative is always opened before any deliverable exists; a baseline attempted on a SCOPING opportunity that still has zero deliverables is the empty-collection case."
      - from: SCOPING
        to: SCOPE_BASELINED
        trigger: "POST /consulting/opportunities/{id}/baseline-scope"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == opportunity.scoping_manager_consultant_id"
          - "count of Deliverable rows with opportunity_id == this id is >= 1 (else ERR_SCOPE_HAS_NO_DELIVERABLES)"
          - "len(assumptions) >= 1 and len(exclusions) >= 1 and len(client_responsibilities) >= 1 (else ERR_ASSUMPTIONS_REQUIRED)"
          - "every deliverable has non-empty acceptance_criteria (else ERR_ACCEPTANCE_CRITERIA_MISSING)"
          - "sum of completion_weight_pct over the deliverables == 100.00 exactly (else ERR_COMPLETION_WEIGHT_SUM_INVALID)"
          - "the depends_on_deliverable_id graph over the deliverables contains no cycle (else ERR_DEPENDENCY_CYCLE)"
        side_effects:
          - "runs calculations.scope_baseline_cost: writes total_estimated_hours, scope_discount_pct, longest_dependency_chain, per-deliverable Deliverable.line_cost_cents, baseline_effort_cost_cents"
          - "writes baselined_at = current logical clock"
          - "freezes scope: PATCH /consulting/deliverables/{id} and PATCH /consulting/opportunities/{id}/scope now return ERR_SCOPE_FROZEN"
          - "increments Opportunity.version by 1"
      - from: SCOPE_BASELINED
        to: SOW_ISSUED
        trigger: "system: POST /consulting/sows creating a Sow for this opportunity, or POST /consulting/sows/{id}/revise"
        actor: system
        preconditions: ["opportunity.status == SCOPE_BASELINED"]
        side_effects: ["increments Opportunity.version by 1"]
        note: "A further POST /consulting/sows against an already-SOW_ISSUED opportunity is accepted while its current Sow is still DRAFT (that row is written to SUPERSEDED): status stays SOW_ISSUED but Opportunity.version still advances, which is exactly what the sow-create-stale-opportunity OCC rule observes."
      - from: SOW_ISSUED
        to: SCOPING
        trigger: "system: POST /consulting/sows/{id}/client-decision with decision REQUEST_REVISION"
        actor: system
        preconditions: ["the Sow being revised has opportunity_id == this id and status == CLIENT_REVIEW"]
        side_effects:
          - "unfreezes scope: PATCH deliverable and PATCH scope are accepted again"
          - "clears total_estimated_hours, scope_discount_pct, baseline_effort_cost_cents, longest_dependency_chain and baselined_at back to null; clears every Deliverable.line_cost_cents to null"
          - "increments Opportunity.version by 1"
        note: "Second leg of the negotiation cycle SCOPE_BASELINED -> SOW_ISSUED -> SCOPING -> SCOPE_BASELINED -> SOW_ISSUED."
      - from: SOW_ISSUED
        to: WON
        trigger: "system: POST /consulting/sows/{id}/client-decision with decision SIGN"
        actor: system
        preconditions: ["the signed Sow has opportunity_id == this id"]
        side_effects:
          - "creates the Engagement row (see Engagement delivery_state MOBILIZING initial state)"
          - "increments Opportunity.version by 1"
      - from: SOW_ISSUED
        to: LOST
        trigger: "system: POST /consulting/sows/{id}/client-decision with decision DECLINE"
        actor: system
        preconditions: ["the declined Sow has opportunity_id == this id"]
        side_effects: ["increments Opportunity.version by 1"]

  - entity: Sow
    state_field: status
    initial_state: DRAFT
    terminal_states: [SIGNED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: INTERNAL_REVIEW
        trigger: "POST /consulting/sows/{id}/submit-internal"
        actor: EngagementPartner
        preconditions:
          - "X-User-ID == opportunity.owner_partner_consultant_id"
          - "sow.status == DRAFT"
          - "opportunity.conflict_status IN {CLEAR, CLEARED_WITH_WAIVER} (else ERR_CONFLICT_NOT_CLEARED)"
        side_effects: ["increments Sow.version by 1"]
      - from: INTERNAL_REVIEW
        to: CLIENT_REVIEW
        trigger: "POST /consulting/sows/{id}/internal-decision with decision APPROVE"
        actor: FirmLeadership
        preconditions:
          - "sow.status == INTERNAL_REVIEW"
          - "X-User-ID != opportunity.owner_partner_consultant_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "opportunity.conflict_status IN {CLEAR, CLEARED_WITH_WAIVER} (else ERR_CONFLICT_NOT_CLEARED)"
        side_effects: ["increments Sow.version by 1"]
      - from: INTERNAL_REVIEW
        to: DRAFT
        trigger: "POST /consulting/sows/{id}/internal-decision with decision RETURN"
        actor: FirmLeadership
        preconditions: ["sow.status == INTERNAL_REVIEW", "X-User-ID != opportunity.owner_partner_consultant_id"]
        side_effects: ["increments Sow.version by 1"]
      - from: CLIENT_REVIEW
        to: SIGNED
        trigger: "POST /consulting/sows/{id}/client-decision with decision SIGN"
        actor: ClientContact
        preconditions:
          - "sow.status == CLIENT_REVIEW"
          - "X-User-ID == opportunity.client_id (else ERR_CLIENT_SCOPE_VIOLATION)"
          - "signature_name present (else ERR_INVALID_REQUEST)"
          - "Client.status == ACTIVE (else ERR_CLIENT_NOT_ELIGIBLE_FOR_SIGNATURE)"
          - "opportunity.conflict_status IN {CLEAR, CLEARED_WITH_WAIVER} (else ERR_CONFLICT_NOT_CLEARED)"
        side_effects:
          - "writes signed_at = current logical clock and signature_name"
          - "creates one Engagement with delivery_state MOBILIZING, economics_state ON_TRACK, sow_id/opportunity_id/client_id/lead_partner_consultant_id copied, pricing_model copied, original_fee_cents = contracted_fee_cents = sow.quoted_fee_cents, contracted_hours = opportunity.total_estimated_hours, not_to_exceed_cents = sow.not_to_exceed_cents, pinned_scope_discount_pct = sow.pinned_scope_discount_pct, pinned_risk_premium_pct = sow.risk_premium_pct, planned_start_date = opportunity.target_start_date, planned_end_date = opportunity.target_end_date"
          - "transitions Opportunity SOW_ISSUED -> WON"
          - "increments Sow.version by 1"
      - from: CLIENT_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /consulting/sows/{id}/client-decision with decision REQUEST_REVISION"
        actor: ClientContact
        preconditions:
          - "sow.status == CLIENT_REVIEW"
          - "X-User-ID == opportunity.client_id"
          - "sow.revision_round < 3 (else ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "transitions Opportunity SOW_ISSUED -> SCOPING (scope unfrozen, baseline fields cleared)"
          - "increments Sow.version by 1"
      - from: CLIENT_REVIEW
        to: DECLINED
        trigger: "POST /consulting/sows/{id}/client-decision with decision DECLINE"
        actor: ClientContact
        preconditions: ["sow.status == CLIENT_REVIEW", "X-User-ID == opportunity.client_id"]
        side_effects: ["transitions Opportunity SOW_ISSUED -> LOST", "increments Sow.version by 1"]
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /consulting/sows/{id}/revise"
        actor: EngagementPartner
        preconditions:
          - "sow.status == REVISION_REQUESTED"
          - "X-User-ID == opportunity.owner_partner_consultant_id"
          - "opportunity.status == SCOPE_BASELINED, i.e. the manager has re-baselined the reworked scope (else ERR_OPPORTUNITY_STATE_INVALID)"
        side_effects:
          - "increments sow.revision_round by 1"
          - "re-runs calculations.sow_quoted_fee against the NEW baseline: rewrites risk_score, risk_premium_pct, pinned_scope_discount_pct, baseline_effort_cost_cents, quoted_fee_cents, fixed_component_cents, at_risk_component_cents, not_to_exceed_cents"
          - "transitions Opportunity SCOPE_BASELINED -> SOW_ISSUED"
          - "increments Sow.version by 1"
        note: "Closes the negotiation cycle CLIENT_REVIEW -> REVISION_REQUESTED -> DRAFT -> INTERNAL_REVIEW -> CLIENT_REVIEW on one row."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /consulting/sows creates a replacement Sow for the same opportunity"
        actor: system
        preconditions: ["sow.status IN {DRAFT, INTERNAL_REVIEW, CLIENT_REVIEW, REVISION_REQUESTED}"]
        side_effects:
          - "the new Sow's supersedes_sow_id is set to this row's id"
          - "increments Sow.version by 1"
        note: "Applies identically from INTERNAL_REVIEW, CLIENT_REVIEW and REVISION_REQUESTED; this row is the create-with-supersede pattern guarded by OCC on Opportunity.version (see concurrency_rules.sow-create-stale-opportunity)."

  - entity: Engagement
    state_field: delivery_state
    initial_state: MOBILIZING
    terminal_states: [CLOSED]
    transitions:
      - from: MOBILIZING
        to: ACTIVE
        trigger: "POST /consulting/engagements/{id}/mobilize"
        actor: EngagementPartner
        preconditions:
          - "X-User-ID == engagement.lead_partner_consultant_id (else ERR_NOT_ASSIGNED_TO_ENGAGEMENT)"
          - "engagement.delivery_state == MOBILIZING"
          - "the named Consultant exists (else ERR_CONSULTANT_NOT_FOUND) and its practice_code == opportunity.requested_practice_code (else ERR_CONSULTANT_PRACTICE_MISMATCH)"
        side_effects:
          - "writes engagement_manager_consultant_id"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "system: a RiskEscalation on this engagement reaches DELIVERY_HELD"
        actor: system
        preconditions: ["engagement.delivery_state == ACTIVE"]
        side_effects:
          - "cascade hop 2: every Deliverable of engagement.opportunity_id with status IN {PLANNED, IN_PROGRESS, REWORK} is written to SUSPENDED with prior_status = its previous status"
          - "cascade hop 3: because those deliverables changed, suspended_deliverable_count is recomputed as the count of SUSPENDED deliverables of this opportunity"
          - "increments Engagement.version by 1, and Deliverable.version by 1 on every suspended row"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "system: the last RiskEscalation of this engagement with status == DELIVERY_HELD reaches RESOLVED"
        actor: system
        preconditions: ["engagement.delivery_state == ON_HOLD", "no remaining RiskEscalation of this engagement has status == DELIVERY_HELD"]
        side_effects:
          - "every Deliverable with status == SUSPENDED is restored to its prior_status and prior_status is cleared to null"
          - "suspended_deliverable_count recomputed to 0"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /consulting/engagements/{id}/begin-closing"
        actor: EngagementPartner
        preconditions:
          - "X-User-ID == engagement.lead_partner_consultant_id"
          - "engagement.delivery_state == ACTIVE"
          - "every Deliverable of engagement.opportunity_id has status == ACCEPTED (else ERR_DELIVERABLES_NOT_ACCEPTED)"
          - "no ChangeRequest of this engagement has status IN {DRAFT, IMPACT_ASSESSED, PENDING_LEADERSHIP_APPROVAL, PENDING_CLIENT_APPROVAL} (else ERR_OPEN_CHANGE_REQUEST_BLOCKS_CLOSING)"
          - "no QualityReview of this engagement has status == SCHEDULED (else ERR_QUALITY_GATE_PENDING)"
          - "no QualityReview of this engagement has status == FAILED whose linked RiskEscalation.status != RESOLVED (else ERR_QUALITY_GATE_FAILED)"
        side_effects: ["increments Engagement.version by 1"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /consulting/engagements/{id}/close"
        actor: FirmLeadership
        preconditions:
          - "engagement.delivery_state == CLOSING"
          - "no RiskEscalation of this engagement has status IN {OPEN, ACKNOWLEDGED, DELIVERY_HELD} (else ERR_OPEN_ESCALATION_BLOCKS_CLOSE)"
        side_effects:
          - "writes closed_at = current logical clock"
          - "increments Client.completed_engagement_count by 1 and Client.version by 1"
          - "increments Engagement.version by 1"

  - entity: Engagement
    state_field: economics_state
    initial_state: ON_TRACK
    terminal_states: []
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system: calculations.engagement_economics recompute after POST /consulting/time-entries/{id}/decision (APPROVE), POST /consulting/time-entries/{id}/reverse, POST /consulting/deliverables/{id}/status (ACCEPTED), POST /consulting/change-requests/{id}/client-decision (APPROVE) or POST /consulting/change-requests/{id}/rescind"
        actor: system
        preconditions:
          - "recomputed classification is AT_RISK: NOT (progress_variance_pct >= 30.00 OR projected_margin_pct < 0.00) AND (progress_variance_pct >= 15.00 OR projected_margin_pct < 15.00)"
        side_effects: ["increments Engagement.version by 1"]
      - from: AT_RISK
        to: OVERRUN
        trigger: "system: same recompute trigger set as ON_TRACK->AT_RISK"
        actor: system
        preconditions:
          - "recomputed classification is OVERRUN: progress_variance_pct >= 30.00 OR projected_margin_pct < 0.00"
        side_effects:
          - "cascade hop 3: because economics_state entered OVERRUN from a non-OVERRUN state, one RiskEscalation is created with source ECONOMICS, severity HIGH, status OPEN, engagement_id = this engagement, opened_reason naming the breached threshold"
          - "cascade hop 4: because that HIGH escalation now exists, engagement.leadership_review_required is written true and Client.at_risk_engagement_count is incremented by 1 (Client.version += 1) when this engagement's unresolved-HIGH count moves 0 -> 1"
          - "increments Engagement.version by 1"
        note: "ON_TRACK -> OVERRUN in a single recompute fires the identical hop-3 and hop-4 side effects."
      - from: ON_TRACK
        to: OVERRUN
        trigger: "system: same recompute trigger set as ON_TRACK->AT_RISK"
        actor: system
        preconditions: ["recomputed classification is OVERRUN"]
        side_effects:
          - "identical to AT_RISK->OVERRUN: creates the ECONOMICS/HIGH RiskEscalation, then sets leadership_review_required and increments Client.at_risk_engagement_count"
          - "increments Engagement.version by 1"
      - from: OVERRUN
        to: AT_RISK
        trigger: "system: same recompute trigger set as ON_TRACK->AT_RISK"
        actor: system
        preconditions: ["recomputed classification is AT_RISK"]
        side_effects:
          - "no escalation is created and no existing escalation is auto-resolved; leaving OVERRUN never rescinds the escalation raised on entry"
          - "increments Engagement.version by 1"
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system: same recompute trigger set as ON_TRACK->AT_RISK"
        actor: system
        preconditions:
          - "recomputed classification is ON_TRACK: progress_variance_pct < 15.00 AND projected_margin_pct >= 15.00"
        side_effects: ["increments Engagement.version by 1"]
      - from: OVERRUN
        to: ON_TRACK
        trigger: "system: same recompute trigger set as ON_TRACK->AT_RISK"
        actor: system
        preconditions: ["recomputed classification is ON_TRACK"]
        side_effects: ["increments Engagement.version by 1"]
    note: "delivery_state and economics_state are independent dimensions on the same row: a MOBILIZING engagement can already be AT_RISK, and an ON_HOLD engagement keeps recomputing economics."

  - entity: Deliverable
    state_field: status
    initial_state: PLANNED
    terminal_states: [ACCEPTED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /consulting/deliverables/{id}/status with target_status IN_PROGRESS"
        actor: EngagementManager
        preconditions:
          - "an Engagement exists for this deliverable's opportunity (opportunity.status == WON) and X-User-ID == engagement.engagement_manager_consultant_id"
          - "engagement.delivery_state == ACTIVE (else ERR_ENGAGEMENT_STATE_INVALID)"
          - "deliverable.lead_consultant_id is not null (else ERR_DELIVERABLE_LEAD_UNASSIGNED)"
          - "if depends_on_deliverable_id is not null, that predecessor's status == ACCEPTED (else ERR_DEPENDENCY_NOT_ACCEPTED)"
        side_effects: ["increments Deliverable.version by 1"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /consulting/deliverables/{id}/status with target_status SUBMITTED"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == engagement.engagement_manager_consultant_id"
          - "engagement.delivery_state == ACTIVE"
        side_effects: ["increments Deliverable.version by 1"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /consulting/deliverables/{id}/status with target_status ACCEPTED"
        actor: ClientContact
        preconditions:
          - "X-User-ID == opportunity.client_id (else ERR_CLIENT_SCOPE_VIOLATION)"
          - "engagement.delivery_state == ACTIVE"
        side_effects:
          - "recomputes calculations.engagement_economics (completion_pct rises), which may transition Engagement.economics_state"
          - "increments Deliverable.version by 1"
      - from: SUBMITTED
        to: REWORK
        trigger: "POST /consulting/deliverables/{id}/status with target_status REWORK"
        actor: ClientContact
        preconditions: ["X-User-ID == opportunity.client_id", "engagement.delivery_state == ACTIVE"]
        side_effects: ["increments Deliverable.version by 1"]
      - from: REWORK
        to: IN_PROGRESS
        trigger: "POST /consulting/deliverables/{id}/status with target_status IN_PROGRESS"
        actor: EngagementManager
        preconditions: ["X-User-ID == engagement.engagement_manager_consultant_id", "engagement.delivery_state == ACTIVE"]
        side_effects: ["increments Deliverable.version by 1"]
        note: "SUBMITTED -> REWORK -> IN_PROGRESS -> SUBMITTED is a second cycle, independent of the Sow negotiation cycle."
      - from: PLANNED
        to: SUSPENDED
        trigger: "system: engagement delivery_state ACTIVE -> ON_HOLD"
        actor: system
        preconditions: ["deliverable.status IN {PLANNED, IN_PROGRESS, REWORK}"]
        side_effects: ["writes prior_status = the status held before this transition", "increments Deliverable.version by 1"]
        note: "Applies identically from IN_PROGRESS and REWORK."
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "system: engagement delivery_state ON_HOLD -> ACTIVE"
        actor: system
        preconditions: ["deliverable.status == SUSPENDED"]
        side_effects: ["restores status = prior_status (PLANNED, IN_PROGRESS or REWORK) and clears prior_status to null", "increments Deliverable.version by 1"]
        note: "The restored state is whatever prior_status holds; this row shows the IN_PROGRESS case."

  - entity: ChangeRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: DRAFT
        to: IMPACT_ASSESSED
        trigger: "POST /consulting/change-requests/{id}/assess-impact"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == engagement.engagement_manager_consultant_id (else ERR_NOT_ASSIGNED_TO_ENGAGEMENT)"
          - "change_request.status == DRAFT (else ERR_CHANGE_REQUEST_STATE_INVALID)"
          - "engagement.delivery_state IN {MOBILIZING, ACTIVE} (else ERR_ENGAGEMENT_STATE_INVALID)"
          - "calculations.change_request_impact cumulative_change_pct_at_assessment <= 40.00 (else ERR_CHANGE_EXCEEDS_MATERIALITY)"
        side_effects:
          - "writes gross_delta_cents, fee_delta_cents, cumulative_change_pct_at_assessment from calculations.change_request_impact"
          - "writes routing = LEADERSHIP_THEN_CLIENT when cumulative_change_pct_at_assessment >= 20.00, else CLIENT_ONLY"
          - "increments ChangeRequest.version by 1"
      - from: IMPACT_ASSESSED
        to: PENDING_LEADERSHIP_APPROVAL
        trigger: "POST /consulting/change-requests/{id}/assess-impact (same call, branch taken when routing == LEADERSHIP_THEN_CLIENT)"
        actor: EngagementManager
        preconditions: ["routing resolved to LEADERSHIP_THEN_CLIENT"]
        side_effects: ["status is written straight to PENDING_LEADERSHIP_APPROVAL in the same response as the impact fields"]
        note: "IMPACT_ASSESSED is the branch point: the assess-impact response already carries the routed status, so status never rests at IMPACT_ASSESSED."
      - from: IMPACT_ASSESSED
        to: PENDING_CLIENT_APPROVAL
        trigger: "POST /consulting/change-requests/{id}/assess-impact (same call, branch taken when routing == CLIENT_ONLY)"
        actor: EngagementManager
        preconditions: ["routing resolved to CLIENT_ONLY"]
        side_effects: ["status is written straight to PENDING_CLIENT_APPROVAL in the same response as the impact fields"]
      - from: PENDING_LEADERSHIP_APPROVAL
        to: PENDING_CLIENT_APPROVAL
        trigger: "POST /consulting/change-requests/{id}/leadership-decision with decision APPROVE"
        actor: FirmLeadership
        preconditions:
          - "change_request.status == PENDING_LEADERSHIP_APPROVAL"
          - "X-User-ID != change_request.requested_by_consultant_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes leadership_approver_consultant_id = X-User-ID"
          - "increments ChangeRequest.version by 1"
      - from: PENDING_LEADERSHIP_APPROVAL
        to: REJECTED
        trigger: "POST /consulting/change-requests/{id}/leadership-decision with decision REJECT"
        actor: FirmLeadership
        preconditions:
          - "change_request.status == PENDING_LEADERSHIP_APPROVAL"
          - "X-User-ID != change_request.requested_by_consultant_id"
        side_effects:
          - "writes leadership_approver_consultant_id = X-User-ID; no engagement field changes"
          - "increments ChangeRequest.version by 1"
      - from: PENDING_CLIENT_APPROVAL
        to: APPROVED
        trigger: "POST /consulting/change-requests/{id}/client-decision with decision APPROVE"
        actor: ClientContact
        preconditions:
          - "X-User-ID == engagement.client_id (else ERR_CLIENT_SCOPE_VIOLATION)"
          - "change_request.status == PENDING_CLIENT_APPROVAL"
          - "engagement.pricing_model != TIME_AND_MATERIALS OR engagement.burned_cost_cents-based projection stays within not_to_exceed_cents (else ERR_NOT_TO_EXCEED_BREACHED)"
        side_effects:
          - "writes approved_at = current logical clock"
          - "cascade hop 1: engagement.contracted_fee_cents += fee_delta_cents, engagement.contracted_hours += added_hours, engagement.planned_end_date += requested_schedule_days, engagement.schedule_relief_days += requested_schedule_days, engagement.cumulative_change_pct = cumulative_change_pct_at_assessment (Engagement.version += 1)"
          - "cascade hop 2: calculations.engagement_economics is recomputed on the new contracted_fee_cents / contracted_hours"
          - "cascade hops 3-4: the recompute may drive economics_state to OVERRUN, which creates the ECONOMICS RiskEscalation and then sets leadership_review_required and bumps Client.at_risk_engagement_count"
          - "increments ChangeRequest.version by 1"
      - from: PENDING_CLIENT_APPROVAL
        to: REJECTED
        trigger: "POST /consulting/change-requests/{id}/client-decision with decision REJECT"
        actor: ClientContact
        preconditions: ["X-User-ID == engagement.client_id", "change_request.status == PENDING_CLIENT_APPROVAL"]
        side_effects: ["no engagement field changes", "increments ChangeRequest.version by 1"]
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /consulting/change-requests/{id}/rescind"
        actor: FirmLeadership
        preconditions:
          - "change_request.status == APPROVED"
          - "engagement.delivery_state != CLOSED (else ERR_ENGAGEMENT_STATE_INVALID)"
        side_effects:
          - "compensation: engagement.contracted_fee_cents is recomputed as original_fee_cents + sum of fee_delta_cents over this engagement's ChangeRequests with status == APPROVED after this row leaves APPROVED; contracted_hours and planned_end_date are recomputed the same way from added_hours / requested_schedule_days; cumulative_change_pct is recomputed from the surviving APPROVED set"
          - "writes rescinded_at = current logical clock"
          - "recomputes calculations.engagement_economics, which may move economics_state in either direction"
          - "increments ChangeRequest.version by 1 and Engagement.version by 1"
      - from: DRAFT
        to: RESCINDED
        trigger: "POST /consulting/change-requests/{id}/rescind"
        actor: EngagementManager
        preconditions: ["change_request.status == DRAFT", "X-User-ID == change_request.requested_by_consultant_id"]
        side_effects:
          - "writes rescinded_at; no engagement field changes because no impact was ever applied"
          - "increments ChangeRequest.version by 1"

  - entity: TimeEntry
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /consulting/time-entries/{id}/decision with decision APPROVE"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == engagement.engagement_manager_consultant_id (else ERR_NOT_ASSIGNED_TO_ENGAGEMENT)"
          - "X-User-ID != time_entry.consultant_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "time_entry.status == SUBMITTED (else ERR_TIME_ENTRY_STATE_INVALID)"
          - "engagement.delivery_state IN {ACTIVE, CLOSING} (else ERR_ENGAGEMENT_STATE_INVALID)"
        side_effects:
          - "ledger sync: engagement.approved_hours_burned += hours, engagement.burned_cost_cents += cost_cents, deliverable.hours_consumed += hours"
          - "recomputes calculations.engagement_economics, which may transition Engagement.economics_state"
          - "increments TimeEntry.version by 1, Engagement.version by 1, Deliverable.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /consulting/time-entries/{id}/decision with decision REJECT"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == engagement.engagement_manager_consultant_id"
          - "X-User-ID != time_entry.consultant_id"
          - "time_entry.status == SUBMITTED"
        side_effects: ["no ledger change", "increments TimeEntry.version by 1"]
      - from: APPROVED
        to: REVERSED
        trigger: "POST /consulting/time-entries/{id}/reverse"
        actor: EngagementManager
        preconditions:
          - "X-User-ID == engagement.engagement_manager_consultant_id"
          - "time_entry.status == APPROVED (else ERR_TIME_ENTRY_STATE_INVALID)"
          - "engagement.delivery_state != CLOSED"
        side_effects:
          - "compensation: engagement.approved_hours_burned -= hours, engagement.burned_cost_cents -= cost_cents, deliverable.hours_consumed -= hours, restoring the exact pre-approval ledger values"
          - "writes reversal_reason from the request body"
          - "recomputes calculations.engagement_economics"
          - "increments TimeEntry.version by 1, Engagement.version by 1, Deliverable.version by 1"

  - entity: QualityReview
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, CONDITIONAL, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /consulting/quality-reviews/{id}/record-outcome with outcome PASSED"
        actor: QualityReviewer
        preconditions:
          - "X-User-ID == quality_review.reviewer_consultant_id (else ERR_NOT_ASSIGNED_TO_ENGAGEMENT, per the priority-12 assignment rule)"
          - "quality_review.status == SCHEDULED (else ERR_QUALITY_REVIEW_STATE_INVALID)"
          - "current logical clock date is within [window_start_date, window_end_date] (else ERR_REVIEW_WINDOW_NOT_OPEN)"
          - "findings_severity == NONE (else ERR_FINDINGS_SEVERITY_INCONSISTENT)"
        side_effects: ["writes findings_severity and note", "increments QualityReview.version by 1"]
      - from: SCHEDULED
        to: CONDITIONAL
        trigger: "POST /consulting/quality-reviews/{id}/record-outcome with outcome CONDITIONAL"
        actor: QualityReviewer
        preconditions:
          - "X-User-ID == quality_review.reviewer_consultant_id"
          - "quality_review.status == SCHEDULED"
          - "current logical clock date is within [window_start_date, window_end_date]"
          - "findings_severity IN {LOW, MEDIUM} (else ERR_FINDINGS_SEVERITY_INCONSISTENT)"
        side_effects: ["writes findings_severity and note; no escalation is opened", "increments QualityReview.version by 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /consulting/quality-reviews/{id}/record-outcome with outcome FAILED"
        actor: QualityReviewer
        preconditions:
          - "X-User-ID == quality_review.reviewer_consultant_id"
          - "quality_review.status == SCHEDULED"
          - "current logical clock date is within [window_start_date, window_end_date]"
          - "findings_severity IN {HIGH, CRITICAL} (else ERR_FINDINGS_SEVERITY_INCONSISTENT)"
        side_effects:
          - "cascade hop 1: creates one RiskEscalation with source QUALITY, source_quality_review_id = this review, severity = findings_severity, status OPEN, opened_reason naming the checkpoint_type"
          - "cascade hop 2: when findings_severity == CRITICAL the new escalation is created directly in DELIVERY_HELD instead of OPEN, which drives Engagement delivery_state ACTIVE -> ON_HOLD and its deliverable suspension cascade"
          - "cascade hop 3: engagement.leadership_review_required is written true and Client.at_risk_engagement_count is incremented when the engagement's unresolved HIGH-or-CRITICAL escalation count moves 0 -> 1"
          - "increments QualityReview.version by 1, Engagement.version by 1"

  - entity: RiskEscalation
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response ACKNOWLEDGE"
        actor: FirmLeadership
        preconditions: ["risk_escalation.status == OPEN (else ERR_RISK_ESCALATION_STATE_INVALID)"]
        side_effects: ["writes leadership_response", "increments RiskEscalation.version by 1"]
      - from: ACKNOWLEDGED
        to: DELIVERY_HELD
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response HOLD_DELIVERY"
        actor: FirmLeadership
        preconditions:
          - "risk_escalation.status == ACKNOWLEDGED"
          - "engagement.delivery_state == ACTIVE (else ERR_ENGAGEMENT_STATE_INVALID)"
        side_effects:
          - "cascade hop 1: drives Engagement delivery_state ACTIVE -> ON_HOLD"
          - "cascade hops 2-3: that transition suspends every PLANNED / IN_PROGRESS / REWORK Deliverable of the engagement's opportunity (recording prior_status) and recomputes engagement.suspended_deliverable_count"
          - "increments RiskEscalation.version by 1, Engagement.version by 1, and Deliverable.version by 1 per suspended row"
      - from: OPEN
        to: DELIVERY_HELD
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response HOLD_DELIVERY"
        actor: FirmLeadership
        preconditions: ["risk_escalation.status == OPEN", "engagement.delivery_state == ACTIVE"]
        side_effects: ["identical cascade to ACKNOWLEDGED -> DELIVERY_HELD; acknowledgement is not a required intermediate step"]
      - from: DELIVERY_HELD
        to: RESOLVED
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response RESOLVE"
        actor: FirmLeadership
        preconditions:
          - "risk_escalation.status == DELIVERY_HELD"
          - "if source == QUALITY, a later QualityReview on the same engagement with the same checkpoint_type has status IN {PASSED, CONDITIONAL} (else ERR_QUALITY_GATE_PENDING)"
        side_effects:
          - "writes resolved_at and leadership_response"
          - "when no other RiskEscalation of this engagement remains in DELIVERY_HELD, drives Engagement delivery_state ON_HOLD -> ACTIVE, restoring each SUSPENDED deliverable to prior_status and zeroing suspended_deliverable_count"
          - "when the engagement's unresolved HIGH-or-CRITICAL escalation count reaches 0, engagement.leadership_review_required is written false and Client.at_risk_engagement_count is decremented by 1 (Client.version += 1)"
          - "increments RiskEscalation.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response RESOLVE"
        actor: FirmLeadership
        preconditions:
          - "risk_escalation.status == ACKNOWLEDGED"
          - "if source == QUALITY, a later QualityReview on the same engagement with the same checkpoint_type has status IN {PASSED, CONDITIONAL}"
        side_effects:
          - "writes resolved_at and leadership_response; delivery_state is untouched because no hold was ever placed"
          - "the leadership_review_required / Client.at_risk_engagement_count reconciliation runs identically"
          - "increments RiskEscalation.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /consulting/risk-escalations/{id}/leadership-response with response RESOLVE"
        actor: FirmLeadership
        preconditions:
          - "risk_escalation.status == OPEN"
          - "if source == QUALITY, a later QualityReview on the same engagement with the same checkpoint_type has status IN {PASSED, CONDITIONAL}"
        side_effects: ["same as ACKNOWLEDGED -> RESOLVED"]

concurrency_rules:
  - rule_id: sow-create-stale-opportunity
    parent_entity: Opportunity
    write_endpoint: "POST /consulting/sows"
    occ_field: "expected_opportunity_version"
    description: |
      Creating a Sow against an Opportunity whose version has advanced since the
      client last observed it is rejected. A new Sow legitimately supersedes any
      prior non-terminal Sow of the same Opportunity (that row is written to
      SUPERSEDED) and the Opportunity simply stays SOW_ISSUED, so an Opportunity
      that already carries a Sow does not block a second create on state grounds; the stale-version check is what tells a
      writer that the scope baseline or the Sow set it priced against has moved
      underneath it.
    error_id: ERR_STALE_OPPORTUNITY_VERSION
    http_status: 412

  - rule_id: change-request-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /consulting/change-requests"
    occ_field: "expected_engagement_version"
    description: |
      Creating a ChangeRequest against an Engagement whose version has advanced
      since the client last observed it is rejected. A ChangeRequest may carry
      supersedes_change_request_id and legitimately replace an earlier DRAFT
      request, and an Engagement accepts any number of change requests, so no
      state precondition rejects the second create; the stale-version check is
      what tells a writer that the contracted fee, contracted hours or
      cumulative_change_pct its impact would be assessed against has moved.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

calculations:
  - name: qualification_score
    trigger: "computed on POST /consulting/opportunities (intake variant, writes qualification_score_intake), recomputed on POST /consulting/opportunities/{id}/verify-budget (verified variant, writes qualification_score_verified), and read as the gate by POST /consulting/opportunities/{id}/qualify"
    algorithm: weighted_scoring
    formula: |
      decision_process_factor =
        1.0  if client.decision_process == SINGLE_APPROVER
        0.8  if client.decision_process == COMMITTEE
        0.6  if client.decision_process == PROCUREMENT_LED

      budget_ratio = min(1, budget_basis_cents / opportunity.estimated_value_cents)
      sponsor_factor = 1 if opportunity.decision_maker_identified else 0
      history_factor = min(1, client.completed_engagement_count / 3)

      score_raw = 30 * decision_process_factor
                + 40 * budget_ratio
                + 20 * sponsor_factor
                + 10 * history_factor

      qualification_score = round_half_up(score_raw, 2)          # 0.00 .. 100.00
      qualified = qualification_score >= QUALIFICATION_THRESHOLD  # >= is inclusive
    input_set: "the Opportunity being scored plus its Client row; client.completed_engagement_count counts only Engagements that reached delivery_state CLOSED"
    constants:
      QUALIFICATION_THRESHOLD: 60.00
      DECISION_PROCESS_FACTOR_SINGLE_APPROVER: 1.0
      DECISION_PROCESS_FACTOR_COMMITTEE: 0.8
      DECISION_PROCESS_FACTOR_PROCUREMENT_LED: 0.6
      HISTORY_FACTOR_DIVISOR: 3
    precision: "2 decimal places, round_half_up; budget_ratio and history_factor are NOT pre-rounded, only the final score is"
    variants:
      - name: intake
        when: "at POST /consulting/opportunities, before any budget verification"
        difference: "budget_basis_cents = opportunity.stated_budget_cents (the client's self-reported number); result is stored in qualification_score_intake and verified_budget_cents stays null"
      - name: verified_requalification
        when: "at POST /consulting/opportunities/{id}/verify-budget, once the partner has confirmed the funded amount"
        difference: "budget_basis_cents = opportunity.verified_budget_cents (the confirmed number, which may be lower or higher than stated); result is stored in qualification_score_verified. POST /consulting/opportunities/{id}/qualify gates on qualification_score_verified only, so an Opportunity whose intake score cleared 60.00 can still be DISQUALIFIED once the verified figure lands, and vice versa."
    note: "The two variants read the same Client and the same estimated_value_cents and differ only in which budget field feeds budget_ratio, so identical intake data yields two different stored scores whenever verified_budget_cents != stated_budget_cents."

  - name: scope_baseline_cost
    trigger: "computed on POST /consulting/opportunities/{id}/baseline-scope; the resulting scope_discount_pct and baseline_effort_cost_cents are frozen on the Opportunity and re-read (never recomputed) by every later Sow pricing call"
    algorithm: tiered_pricing
    formula: |
      total_estimated_hours = sum(d.effort_hours_estimate for d in deliverables)   # 2 dp

      scope_discount_pct =                                    # volume tier, lower bound inclusive
        0.00  if total_estimated_hours < 200
        0.05  if 200 <= total_estimated_hours < 500
        0.10  if total_estimated_hours >= 500

      # per-line rounding, then sum -- NOT sum-then-round
      for each d in deliverables ordered by d.created_at ascending:
          line_raw_cents  = d.effort_hours_estimate
                          * GRADE_BILLING_RATE_CENTS_PER_HOUR[d.primary_grade]
                          * (1 - scope_discount_pct)
          d.line_cost_cents = round_half_up(line_raw_cents, 0)

      baseline_effort_cost_cents = sum(d.line_cost_cents for d in deliverables)

      longest_dependency_chain = the number of Deliverables on the longest path
        of the depends_on_deliverable_id DAG within this Opportunity
        (a deliverable with no predecessor and no successor counts as 1)
    input_set: "every Deliverable whose opportunity_id == this Opportunity, regardless of Deliverable.status; the scope is frozen by this call so the set cannot change afterwards"
    constants:
      GRADE_BILLING_RATE_CENTS_PER_HOUR_PARTNER: 92500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_MANAGER: 57500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_CONSULTANT: 36500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_ANALYST: 21500
      DISCOUNT_TIER_1_MIN_HOURS: 200
      DISCOUNT_TIER_2_MIN_HOURS: 500
      DISCOUNT_TIER_1_PCT: 0.05
      DISCOUNT_TIER_2_PCT: 0.10
    precision: |
      line_cost_cents is an integer produced by round_half_up at 0 decimal places on each line
      independently; baseline_effort_cost_cents is the integer sum of those rounded lines.
      Summing the raw line amounts and rounding once at the end is WRONG and diverges by
      whole cents (worked example: 120.25h CONSULTANT -> raw 4169668.75 -> 4169669, and
      80.50h MANAGER -> raw 4397312.50 -> 4397313 (half-up, not half-even), giving
      baseline 8566982; sum-then-round yields 8566981, a 1-cent divergence).
    note: "total_estimated_hours sits at 200.75 in the canonical fixture, 0.75 above the tier-1 boundary; 199.99 total hours takes the 0.00 discount and 200.00 exactly takes 0.05."

  - name: engagement_risk_score
    trigger: "computed on POST /consulting/sows (writes Sow.risk_score and Sow.risk_premium_pct) and recomputed on POST /consulting/sows/{id}/revise"
    algorithm: aggregation
    formula: |
      pricing_component =
        25 if pricing_model == FIXED_FEE
        10 if pricing_model == TIME_AND_MATERIALS
        40 if pricing_model == OUTCOME_BASED

      decision_component =
         5 if client.decision_process == SINGLE_APPROVER
        15 if client.decision_process == COMMITTEE
        20 if client.decision_process == PROCUREMENT_LED

      # unstated assumptions are the risk: every declared assumption or exclusion retires 4 points
      specification_component = max(0, 20 - 4 * (len(opportunity.assumptions) + len(opportunity.exclusions)))

      dependency_component = min(15, 5 * opportunity.longest_dependency_chain)
      obligation_component = min(15, 3 * len(opportunity.client_responsibilities))

      risk_score = min(100, pricing_component + decision_component
                          + specification_component + dependency_component
                          + obligation_component)                       # integer 0..100

      risk_tier =                                    # lower bound inclusive
        LOW     if risk_score < 30
        MEDIUM  if 30 <= risk_score < 60
        HIGH    if risk_score >= 60

      risk_premium_pct = 0.05 if LOW, 0.12 if MEDIUM, 0.20 if HIGH
    input_set: "the Sow's requested pricing_model, its Opportunity's frozen scope fields (assumptions, exclusions, client_responsibilities, longest_dependency_chain) and the Client's decision_process"
    constants:
      RISK_TIER_MEDIUM_MIN: 30
      RISK_TIER_HIGH_MIN: 60
      RISK_PREMIUM_PCT_LOW: 0.05
      RISK_PREMIUM_PCT_MEDIUM: 0.12
      RISK_PREMIUM_PCT_HIGH: 0.20
      SPECIFICATION_BASE_POINTS: 20
      SPECIFICATION_POINTS_PER_STATEMENT: 4
      DEPENDENCY_POINTS_PER_LINK: 5
      DEPENDENCY_POINTS_CAP: 15
      OBLIGATION_POINTS_PER_RESPONSIBILITY: 3
      OBLIGATION_POINTS_CAP: 15
    precision: "integer points; risk_premium_pct is an exact 2-decimal constant, never interpolated between tiers"
    note: "Pricing model is the single largest lever, so the same frozen scope lands in a different risk tier per model: the canonical scope scores 46 (MEDIUM) as TIME_AND_MATERIALS, 61 (HIGH) as FIXED_FEE and 76 (HIGH) as OUTCOME_BASED."

  - name: sow_quoted_fee
    trigger: "computed on POST /consulting/sows and recomputed on POST /consulting/sows/{id}/revise; the resulting quoted_fee_cents becomes Engagement.original_fee_cents and contracted_fee_cents when the Sow is signed"
    algorithm: threshold
    formula: |
      B  = opportunity.baseline_effort_cost_cents      # frozen by scope_baseline_cost
      rp = sow.risk_premium_pct                        # from engagement_risk_score
      risk_loaded_cents = round_half_up(B * (1 + rp), 0)

      if pricing_model == FIXED_FEE:
          fixed_component_cents = risk_loaded_cents
          at_risk_component_cents = 0
          not_to_exceed_cents = null
          quoted_fee_cents = fixed_component_cents

      elif pricing_model == TIME_AND_MATERIALS:
          nte_multiplier = 1.05 if risk_tier == LOW
                           1.10 if risk_tier == MEDIUM
                           1.15 if risk_tier == HIGH
          # the risk premium is NOT loaded into a T&M fee -- risk is passed through
          # to the client hour by hour; the risk tier only widens the ceiling.
          not_to_exceed_cents = round_half_up(B * nte_multiplier, 0)
          fixed_component_cents = 0
          at_risk_component_cents = 0
          quoted_fee_cents = not_to_exceed_cents

      elif pricing_model == OUTCOME_BASED:
          fixed_component_cents = round_half_up(B * OUTCOME_FIXED_SHARE, 0)   # no risk premium on the fixed share
          at_risk_uncapped_cents = risk_loaded_cents - fixed_component_cents
          risk_loaded_cap_cents  = round_half_up(risk_loaded_cents * OUTCOME_FEE_CAP_PCT, 0)
          benefit_share_cap_cents = round_half_up(sow.target_bonus_cents * OUTCOME_BENEFIT_SHARE_PCT, 0)
          at_risk_component_cents = min(at_risk_uncapped_cents, risk_loaded_cap_cents, benefit_share_cap_cents)
          not_to_exceed_cents = null
          quoted_fee_cents = fixed_component_cents + at_risk_component_cents
    input_set: "the Sow row under construction plus its Opportunity's frozen baseline_effort_cost_cents and scope_discount_pct (copied onto the Sow as pinned_scope_discount_pct and baseline_effort_cost_cents so a later re-baseline cannot retroactively move a signed price)"
    constants:
      OUTCOME_FIXED_SHARE: 0.70
      OUTCOME_FEE_CAP_PCT: 0.35
      OUTCOME_BENEFIT_SHARE_PCT: 0.20
      T_AND_M_NTE_MULTIPLIER_LOW: 1.05
      T_AND_M_NTE_MULTIPLIER_MEDIUM: 1.10
      T_AND_M_NTE_MULTIPLIER_HIGH: 1.15
    precision: |
      Every intermediate that becomes a stored field is rounded half-up to whole cents before it
      is used again: at_risk_uncapped_cents is computed from the ALREADY-ROUNDED risk_loaded_cents
      and fixed_component_cents, and the OUTCOME cap is evaluated against risk_loaded_cents (the
      risk-loaded total), not against the unloaded baseline.
      Worked from B = 8566982: FIXED_FEE at rp 0.20 -> risk_loaded 10280378 -> quoted 10280378.
      TIME_AND_MATERIALS at MEDIUM -> 8566982 * 1.10 = 9423680.20 -> nte and quoted 9423680.
      OUTCOME_BASED at rp 0.20 with target_bonus_cents 30000000 -> fixed 5996887,
      at_risk_uncapped 4283491, risk_loaded_cap 3598132, benefit_share_cap 6000000 ->
      at_risk 3598132 (the risk-loaded cap binds) -> quoted 9595019.
    variants:
      - name: fixed_fee
        when: "pricing_model == FIXED_FEE"
        difference: "risk premium is fully loaded into a single fixed component; there is no ceiling field and no at-risk component"
      - name: time_and_materials
        when: "pricing_model == TIME_AND_MATERIALS"
        difference: "the risk premium is discarded from the fee entirely and the risk tier instead selects the not-to-exceed multiplier; quoted_fee_cents is a ceiling, not a commitment"
      - name: outcome_based
        when: "pricing_model == OUTCOME_BASED"
        difference: "fee splits into an unloaded 70% fixed share plus an at-risk share that is the risk-loaded remainder clamped by two independent caps, so the quoted fee is below the FIXED_FEE quote on identical scope"
    note: "Three pricing models x three risk tiers gives nine distinct formula paths over one frozen scope; the OUTCOME_BASED path additionally branches on which of its three cap candidates is smallest."

  - name: time_entry_costing
    trigger: "computed on POST /consulting/time-entries (writes cost_cents and billed_value_cents on the row; both are inert until the entry reaches APPROVED)"
    algorithm: aggregation
    formula: |
      cost_cents = round_half_up(hours * consultant.cost_rate_cents_per_hour, 0)

      if billable:
          billed_value_cents = round_half_up(
              hours
              * GRADE_BILLING_RATE_CENTS_PER_HOUR[consultant.grade]
              * (1 - engagement.pinned_scope_discount_pct), 0)
      else:
          billed_value_cents = 0
    input_set: "the single TimeEntry being created, its Consultant (cost rate and grade) and its Engagement (pinned_scope_discount_pct, copied from the signed Sow)"
    constants:
      GRADE_BILLING_RATE_CENTS_PER_HOUR_PARTNER: 92500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_MANAGER: 57500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_CONSULTANT: 36500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_ANALYST: 21500
    precision: "hours carries 2 decimals; cost_cents and billed_value_cents are whole cents via round_half_up per entry, never re-derived from an aggregate of hours"
    note: "cost_cents drives the internal burn ledger while billed_value_cents drives the T&M not-to-exceed check, so a single entry feeds two different thresholds through two different rates. Worked: 60.00h at cost_rate 62000 -> 3720000 cost, and PARTNER billable at 0.05 discount -> 60.00 * 92500 * 0.95 = 5272500."

  - name: engagement_economics
    trigger: "recomputed on POST /consulting/time-entries/{id}/decision (APPROVE), POST /consulting/time-entries/{id}/reverse, POST /consulting/deliverables/{id}/status when the target status is ACCEPTED, POST /consulting/change-requests/{id}/client-decision (APPROVE) and POST /consulting/change-requests/{id}/rescind; also served read-only by GET /consulting/engagements/{id}/economics"
    algorithm: forward_looking
    formula: |
      hours_burn_pct = round_half_up(100 * engagement.approved_hours_burned
                                        / engagement.contracted_hours, 2)

      completion_pct = round_half_up(sum(d.completion_weight_pct
                                         for d in deliverables of this engagement's opportunity
                                         if d.status == ACCEPTED), 2)

      progress_variance_pct = round_half_up(hours_burn_pct - completion_pct, 2)

      remaining_hours = max(0, engagement.contracted_hours - engagement.approved_hours_burned)
      projected_cost_cents = engagement.burned_cost_cents
                           + round_half_up(remaining_hours
                                           * BLENDED_FORECAST_COST_RATE_CENTS_PER_HOUR, 0)

      projected_margin_pct = round_half_up(100 * (engagement.contracted_fee_cents - projected_cost_cents)
                                               / engagement.contracted_fee_cents, 2)

      economics_state =                                  # first matching band wins
        OVERRUN  if progress_variance_pct >= 30.00 or projected_margin_pct < 0.00
        AT_RISK  if progress_variance_pct >= 15.00 or projected_margin_pct < 15.00
        ON_TRACK otherwise
    input_set: |
      TimeEntry rows with status == APPROVED only (SUBMITTED entries are excluded, REJECTED and
      REVERSED entries are excluded, and a reversal removes the entry's contribution rather than
      adding a negative row); Deliverables with status == ACCEPTED only (SUBMITTED and REWORK
      contribute nothing, and a SUSPENDED deliverable that was ACCEPTED cannot exist because
      ACCEPTED is terminal); contracted_fee_cents and contracted_hours reflect all APPROVED
      ChangeRequests applied so far.
    constants:
      BLENDED_FORECAST_COST_RATE_CENTS_PER_HOUR: 34000
      OVERRUN_VARIANCE_PCT: 30.00
      OVERRUN_MARGIN_PCT: 0.00
      AT_RISK_VARIANCE_PCT: 15.00
      AT_RISK_MARGIN_PCT: 15.00
    precision: |
      Percentages are 2 decimals, round_half_up, computed from the stored integer/2-decimal ledger
      fields rather than re-summed from TimeEntry rows. projected_cost_cents rounds the forecast
      leg once, then adds the already-integral burned_cost_cents.
      Worked: contracted_hours 200.75, approved_hours_burned 100.00 -> burn 49.81;
      one ACCEPTED deliverable at weight 40.00 -> completion 40.00 -> variance 9.81;
      remaining 100.75h * 34000 = 3425500 + burned 6200000 -> projected 9625500;
      contracted_fee 10280378 -> margin 6.37 -> AT_RISK (margin below 15.00, variance below 15.00).
    note: |
      The forecast is deliberately forward-looking: it charges every UNBURNED contracted hour at a
      blended rate, so approving a ChangeRequest that adds hours can push margin negative even
      though the same request also raises the fee. Worked continuation: a 160.00h ANALYST change
      request lifts the fee to 14201978 and hours to 360.75 -> projected 15065500 ->
      margin -6.08 -> OVERRUN.

  - name: change_request_impact
    trigger: "computed on POST /consulting/change-requests/{id}/assess-impact; the stored fee_delta_cents is applied to the Engagement only when the client approves"
    algorithm: threshold
    formula: |
      gross_delta_cents = round_half_up(
          change_request.added_hours
          * GRADE_BILLING_RATE_CENTS_PER_HOUR[change_request.added_grade]
          * (1 - engagement.pinned_scope_discount_pct), 0)

      fee_delta_cents = round_half_up(gross_delta_cents * (1 + engagement.pinned_risk_premium_pct), 0)

      approved_delta_sum = sum(cr.fee_delta_cents
                               for cr in this engagement's ChangeRequests
                               if cr.status == APPROVED)

      cumulative_change_pct = round_half_up(
          100 * (approved_delta_sum + fee_delta_cents) / engagement.original_fee_cents, 2)

      routing = LEADERSHIP_THEN_CLIENT if cumulative_change_pct >= LEADERSHIP_ROUTING_PCT
                else CLIENT_ONLY

      if cumulative_change_pct > MATERIALITY_CEILING_PCT:
          reject with ERR_CHANGE_EXCEEDS_MATERIALITY      # strictly greater than, so 40.00 passes
    input_set: "the ChangeRequest being assessed plus every sibling ChangeRequest of the same Engagement whose status == APPROVED; DRAFT, IMPACT_ASSESSED, PENDING_*, REJECTED and RESCINDED siblings contribute nothing, so rescinding an approved request lowers the denominator-relative cumulative figure for later requests"
    constants:
      LEADERSHIP_ROUTING_PCT: 20.00
      MATERIALITY_CEILING_PCT: 40.00
      GRADE_BILLING_RATE_CENTS_PER_HOUR_PARTNER: 92500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_MANAGER: 57500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_CONSULTANT: 36500
      GRADE_BILLING_RATE_CENTS_PER_HOUR_ANALYST: 21500
    precision: |
      Both money legs round half-up to whole cents in sequence (the risk premium is applied to the
      ALREADY-ROUNDED gross_delta_cents), and cumulative_change_pct is measured against
      original_fee_cents (the signed price), never against the current contracted_fee_cents.
      Worked: 160.00h ANALYST at 0.05 discount -> 3268000 gross -> 3921600 fee delta ->
      100 * 3921600 / 10280378 = 38.1465... -> 38.15 -> routing LEADERSHIP_THEN_CLIENT.
      Boundary: added_hours 167.76 -> fee delta 4111798 -> exactly 40.00 -> accepted;
      added_hours 167.80 -> fee delta 4112778 -> 40.01 -> ERR_CHANGE_EXCEEDS_MATERIALITY.
    note: "Because the percentage is measured against the frozen original fee, a second change request is assessed against the sum of itself and every already-approved sibling, so the materiality ceiling is a cumulative gate rather than a per-request one."

  - name: satisfaction_csat
    trigger: "computed on POST /consulting/satisfaction-assessments; the stored csat_score gates POST /consulting/opportunities with a non-null origin_engagement_id (follow-on development)"
    algorithm: weighted_scoring
    formula: |
      referral_bonus = REFERRAL_BONUS_POINTS if would_refer else 0.00

      csat_raw = 0.40 * delivery_score
               + 0.35 * value_score
               + 0.25 * communication_score
               + referral_bonus

      csat_score = round_half_up(min(CSAT_MAX, csat_raw), 2)     # 0.00 .. 10.00

      follow_on_eligible = csat_score >= FOLLOW_ON_MIN_CSAT      # >= is inclusive
    input_set: "the three 1..10 integer scores and the would_refer boolean on the SatisfactionAssessment being created; the Engagement must be CLOSED, and exactly one assessment may exist per Engagement"
    constants:
      DELIVERY_WEIGHT: 0.40
      VALUE_WEIGHT: 0.35
      COMMUNICATION_WEIGHT: 0.25
      REFERRAL_BONUS_POINTS: 0.25
      CSAT_MAX: 10.00
      FOLLOW_ON_MIN_CSAT: 7.50
    precision: "2 decimal places, round_half_up, clamped at 10.00 after weighting so a 10/10/10 referral does not exceed the ceiling"
    note: |
      The three weights sum to 1.00 and the referral bonus sits outside that sum, so would_refer is
      worth a quarter point of headroom that can carry a borderline engagement over the follow-on
      gate. Worked: (8, 7, 9, true) -> 8.15; (7, 7, 9, false) -> exactly 7.50 -> eligible;
      (7, 7, 8, false) -> 7.25 -> ERR_FOLLOW_ON_NOT_ELIGIBLE.

  - name: consultant_lead_load
    trigger: "evaluated on POST /consulting/deliverables/{id}/assign-lead before the assignment is written; also maintained as Consultant.active_lead_deliverable_count"
    algorithm: interval_merge
    formula: |
      candidate = [planned_start_date, planned_end_date)          # HALF-OPEN: end date excluded

      overlapping = [ d for d in Deliverables
                        where d.lead_consultant_id == target_consultant_id
                          and d.id != this deliverable
                          and d.status != ACCEPTED
                          and d.planned_start_date < candidate.end
                          and candidate.start < d.planned_end_date ]

      if len(overlapping) >= MAX_CONCURRENT_LEAD_DELIVERABLES:
          reject with ERR_CONSULTANT_CAPACITY_CONFLICT

      active_lead_deliverable_count = count of Deliverables where
          lead_consultant_id == consultant and status != ACCEPTED
    input_set: "Deliverables across ALL Opportunities and Clients whose lead_consultant_id is the target consultant and whose status is not ACCEPTED; this is a firm-wide capacity check, not a per-engagement one"
    constants:
      MAX_CONCURRENT_LEAD_DELIVERABLES: 2
    precision: "whole days; intervals are half-open so a deliverable ending 2026-10-01 does not overlap one starting 2026-10-01, and the check is an aggregate count rather than a pairwise veto"
    note: "Two overlapping lead assignments are allowed and the third overlapping one is rejected, so the rule is only observable by stacking three windows over a shared day."

validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the X-User-ID value resolves to a known actor: a Consultant id for firm roles, a Client id for ClientContact, or the fixed PracticeAdmin token"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 10
    category: auth
    check: "the resolved actor holds a role listed in the endpoint's roles: set"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 11
    category: auth
    check: "a ClientContact actor may only touch rows reachable from its own Client: opportunity.client_id, engagement.client_id, or the client of a deliverable's opportunity must equal X-User-ID"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /consulting/deliverables/{id}/status, POST /consulting/sows/{id}/client-decision, POST /consulting/change-requests/{id}/client-decision, POST /consulting/satisfaction-assessments, all GET endpoints"

  - priority: 12
    category: auth
    check: "a firm actor must be the assigned individual for the operation: opportunity.owner_partner_consultant_id for partner scoping operations, opportunity.scoping_manager_consultant_id for scope editing, engagement.lead_partner_consultant_id for engagement partner operations, engagement.engagement_manager_consultant_id for delivery operations, quality_review.reviewer_consultant_id for outcome recording"
    error_id: ERR_NOT_ASSIGNED_TO_ENGAGEMENT
    http_status: 403
    applies_to: "POST /consulting/opportunities/{id}/verify-budget, POST /consulting/opportunities/{id}/qualify, PATCH /consulting/opportunities/{id}/scope, POST /consulting/opportunities/{id}/baseline-scope, POST /consulting/deliverables/{id}/assign-lead, POST /consulting/deliverables/{id}/status, POST /consulting/engagements/{id}/mobilize, POST /consulting/engagements/{id}/begin-closing, POST /consulting/time-entries/{id}/decision, POST /consulting/time-entries/{id}/reverse, POST /consulting/change-requests/{id}/assess-impact, POST /consulting/quality-reviews/{id}/record-outcome"

  - priority: 13
    category: auth
    check: "segregation of duties: the internal Sow decision maker must not be opportunity.owner_partner_consultant_id, the leadership decision maker on a ChangeRequest must not be its requested_by_consultant_id, a TimeEntry decision maker must not be the entry's consultant_id, and a QualityReview reviewer must not be the engagement's lead partner or engagement manager"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /consulting/sows/{id}/internal-decision, POST /consulting/change-requests/{id}/leadership-decision, POST /consulting/time-entries/{id}/decision, POST /consulting/quality-reviews"

  - priority: 20
    category: business_constraint
    check: "request body shape: required fields present, enums within their declared value sets, money fields non-negative integers, hours fields 2-decimal numbers, dates ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 21
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 22
    category: business_temporal
    check: "any submitted date range has start <= end: opportunity target_start_date <= target_end_date, deliverable planned_start_date <= planned_end_date, quality review window_start_date <= window_end_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /consulting/opportunities, POST /consulting/deliverables, PATCH /consulting/deliverables/{id}, POST /consulting/quality-reviews"

  - priority: 30
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 31
    category: existence
    check: "every foreign key in the request body references an existing row: client_id, owner_partner_consultant_id, scoping_manager_consultant_id, origin_engagement_id, opportunity_id, lead_consultant_id, depends_on_deliverable_id, supersedes_sow_id, engagement_id, deliverable_id, consultant_id, reviewer_consultant_id, supersedes_change_request_id"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST and PATCH endpoints that accept a foreign key"

  - priority: 35
    category: state
    check: "expected_opportunity_version equals the Opportunity's current version on Sow creation, and expected_engagement_version equals the Engagement's current version on ChangeRequest creation"
    error_id: "ERR_STALE_OPPORTUNITY_VERSION | ERR_STALE_ENGAGEMENT_VERSION"
    http_status: 412
    applies_to: "POST /consulting/sows, POST /consulting/change-requests"

  - priority: 40
    category: state
    check: "the target row is in a state that permits the operation, per the §1.2 transition table for its own entity"
    error_id: "ERR_<ENTITY>_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 41
    category: state
    check: "the governing parent row is in a permitted state: an Opportunity must be SCOPE_BASELINED or SOW_ISSUED to receive a Sow (a replacement Sow supersedes any prior non-terminal one), an Engagement must be ACTIVE for deliverable status changes and MOBILIZING or ACTIVE for change-request assessment, and no operation other than a GET is accepted on a CLOSED Engagement"
    error_id: ERR_ENGAGEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /consulting/sows, POST /consulting/deliverables/{id}/status, POST /consulting/time-entries, POST /consulting/change-requests/{id}/assess-impact, POST /consulting/change-requests/{id}/rescind, POST /consulting/quality-reviews"

  - priority: 42
    category: state
    check: "the Opportunity scope is not frozen: PATCH /scope, deliverable creation and deliverable PATCH are refused once opportunity.status has advanced past SCOPING; lead assignment stays open because delivery staffing continues after the win"
    error_id: ERR_SCOPE_FROZEN
    http_status: 409
    applies_to: "PATCH /consulting/opportunities/{id}/scope, POST /consulting/deliverables, PATCH /consulting/deliverables/{id}"

  - priority: 50
    category: business_safety
    check: "the Opportunity's conflict_status is not BLOCKED: a screened adverse-party overlap with the client's adverse_party_codes permanently blocks the pursuit"
    error_id: ERR_CONFLICT_BLOCKED
    http_status: 422
    applies_to: "POST /consulting/opportunities/{id}/qualify, POST /consulting/opportunities/{id}/baseline-scope, POST /consulting/sows"

  - priority: 51
    category: business_safety
    check: "the Opportunity's conflict_status is CLEAR or CLEARED_WITH_WAIVER before qualification: NOT_CHECKED and WAIVER_REQUIRED both block"
    error_id: ERR_CONFLICT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /consulting/opportunities/{id}/qualify, POST /consulting/sows"

  - priority: 52
    category: business_safety
    check: "no QualityReview of the engagement has status FAILED with an unresolved linked RiskEscalation"
    error_id: ERR_QUALITY_GATE_FAILED
    http_status: 409
    applies_to: "POST /consulting/engagements/{id}/begin-closing, POST /consulting/deliverables/{id}/status"

  - priority: 53
    category: business_safety
    check: "no QualityReview of the engagement is still SCHEDULED when closing begins, and a QUALITY escalation may only be resolved once a later review of the same checkpoint_type has PASSED or is CONDITIONAL"
    error_id: ERR_QUALITY_GATE_PENDING
    http_status: 409
    applies_to: "POST /consulting/engagements/{id}/begin-closing, POST /consulting/risk-escalations/{id}/leadership-response"

  - priority: 54
    category: business_referential
    check: "the named Consultant's practice_code matches opportunity.requested_practice_code when assigning a deliverable lead or an engagement manager"
    error_id: ERR_CONSULTANT_PRACTICE_MISMATCH
    http_status: 422
    applies_to: "POST /consulting/deliverables/{id}/assign-lead, POST /consulting/engagements/{id}/mobilize"

  - priority: 55
    category: business_referential
    check: "a QualityReview reviewer has quality_reviewer_certified == true"
    error_id: ERR_REVIEWER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /consulting/quality-reviews"

  - priority: 56
    category: business_referential
    check: "a TimeEntry's deliverable_id belongs to the same Engagement's Opportunity, and a ChangeRequest's supersedes_change_request_id belongs to the same Engagement"
    error_id: ERR_DELIVERABLE_NOT_IN_ENGAGEMENT_SCOPE
    http_status: 422
    applies_to: "POST /consulting/time-entries, POST /consulting/change-requests"

  - priority: 57
    category: business_referential
    check: "depends_on_deliverable_id names a Deliverable of the same Opportunity and does not close a cycle in the dependency graph, including the self-reference case"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /consulting/deliverables, PATCH /consulting/deliverables/{id}"

  - priority: 58
    category: business_referential
    check: "a Deliverable may only leave PLANNED once its predecessor, if any, has status ACCEPTED"
    error_id: ERR_DEPENDENCY_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /consulting/deliverables/{id}/status"

  - priority: 59
    category: business_referential
    check: "a Deliverable may only leave PLANNED once lead_consultant_id is non-null"
    error_id: ERR_DELIVERABLE_LEAD_UNASSIGNED
    http_status: 409
    applies_to: "POST /consulting/deliverables/{id}/status"

  - priority: 60
    category: business_constraint
    check: "client_code is unique across Clients"
    error_id: ERR_CLIENT_CODE_TAKEN
    http_status: 409
    applies_to: "POST /consulting/clients"

  - priority: 61
    category: business_constraint
    check: "the Opportunity has at least one Deliverable when its scope is baselined"
    error_id: ERR_SCOPE_HAS_NO_DELIVERABLES
    http_status: 422
    applies_to: "POST /consulting/opportunities/{id}/baseline-scope"

  - priority: 62
    category: business_constraint
    check: "the Opportunity declares at least one assumption and at least one exclusion when its scope is baselined"
    error_id: ERR_ASSUMPTIONS_REQUIRED
    http_status: 422
    applies_to: "POST /consulting/opportunities/{id}/baseline-scope"

  - priority: 63
    category: business_constraint
    check: "every Deliverable of the Opportunity has non-empty acceptance_criteria when its scope is baselined"
    error_id: ERR_ACCEPTANCE_CRITERIA_MISSING
    http_status: 422
    applies_to: "POST /consulting/opportunities/{id}/baseline-scope"

  - priority: 64
    category: business_constraint
    check: "the Deliverables' completion_weight_pct values sum to exactly 100.00 when the scope is baselined"
    error_id: ERR_COMPLETION_WEIGHT_SUM_INVALID
    http_status: 422
    applies_to: "POST /consulting/opportunities/{id}/baseline-scope"

  - priority: 65
    category: business_constraint
    check: "target_bonus_cents is present and positive for an OUTCOME_BASED Sow"
    error_id: ERR_OUTCOME_TARGET_BONUS_REQUIRED
    http_status: 422
    applies_to: "POST /consulting/sows"

  - priority: 66
    category: business_constraint
    check: "target_bonus_cents is absent for a FIXED_FEE or TIME_AND_MATERIALS Sow"
    error_id: ERR_TARGET_BONUS_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /consulting/sows"

  - priority: 67
    category: business_constraint
    check: "a Sow's revision_round does not exceed the negotiation limit of 3 completed revisions"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /consulting/sows/{id}/revise"

  - priority: 68
    category: business_constraint
    check: "no APPROVED or SUBMITTED TimeEntry already exists for the same engagement_id, deliverable_id, consultant_id and week_ending_date"
    error_id: ERR_DUPLICATE_TIMESHEET_LINE
    http_status: 409
    applies_to: "POST /consulting/time-entries"

  - priority: 69
    category: business_constraint
    check: "the recorded findings_severity is consistent with the outcome: NONE for PASSED, LOW or MEDIUM for CONDITIONAL, HIGH or CRITICAL for FAILED"
    error_id: ERR_FINDINGS_SEVERITY_INCONSISTENT
    http_status: 422
    applies_to: "POST /consulting/quality-reviews/{id}/record-outcome"

  - priority: 70
    category: business_constraint
    check: "every Deliverable of the engagement's Opportunity has status ACCEPTED before closing begins"
    error_id: ERR_DELIVERABLES_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /consulting/engagements/{id}/begin-closing"

  - priority: 71
    category: business_constraint
    check: "no ChangeRequest of the engagement is in DRAFT, IMPACT_ASSESSED, PENDING_LEADERSHIP_APPROVAL or PENDING_CLIENT_APPROVAL before closing begins"
    error_id: ERR_OPEN_CHANGE_REQUEST_BLOCKS_CLOSING
    http_status: 409
    applies_to: "POST /consulting/engagements/{id}/begin-closing"

  - priority: 72
    category: business_constraint
    check: "no RiskEscalation of the engagement is in OPEN, ACKNOWLEDGED or DELIVERY_HELD when the engagement is closed"
    error_id: ERR_OPEN_ESCALATION_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /consulting/engagements/{id}/close"

  - priority: 73
    category: business_constraint
    check: "the signing Client's status is ACTIVE: a CREDIT_HOLD or INACTIVE client cannot sign a Sow"
    error_id: ERR_CLIENT_NOT_ELIGIBLE_FOR_SIGNATURE
    http_status: 409
    applies_to: "POST /consulting/sows/{id}/client-decision"

  - priority: 80
    category: business_temporal
    check: "a target consultant has fewer than 2 non-ACCEPTED lead Deliverables whose [planned_start_date, planned_end_date) window overlaps the candidate window"
    error_id: ERR_CONSULTANT_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /consulting/deliverables/{id}/assign-lead"

  - priority: 81
    category: business_temporal
    check: "a new QualityReview's [window_start_date, window_end_date] closed interval keeps a gap of at least 3 days from every other non-terminal QualityReview window on the same Engagement"
    error_id: ERR_REVIEW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /consulting/quality-reviews"

  - priority: 82
    category: business_temporal
    check: "the current logical clock date falls inside the review's closed [window_start_date, window_end_date] interval when its outcome is recorded"
    error_id: ERR_REVIEW_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /consulting/quality-reviews/{id}/record-outcome"

  - priority: 83
    category: business_temporal
    check: "a TimeEntry's week_ending_date falls within [engagement.planned_start_date, engagement.planned_end_date]"
    error_id: ERR_TIME_ENTRY_OUTSIDE_ENGAGEMENT_WINDOW
    http_status: 422
    applies_to: "POST /consulting/time-entries"

  - priority: 84
    category: business_temporal
    check: "a TimeEntry's week_ending_date is not after the current logical clock date"
    error_id: ERR_FUTURE_TIMESHEET_LINE
    http_status: 422
    applies_to: "POST /consulting/time-entries"

  - priority: 85
    category: business_temporal
    check: "an Opportunity's target_start_date is not before the current logical clock date"
    error_id: ERR_TARGET_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /consulting/opportunities"

  - priority: 86
    category: business_temporal
    check: "the submitted clock value is not earlier than the current logical clock value"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /consulting/_clock/set_current_utc"

  - priority: 90
    category: business_fiscal
    check: "verified_budget_cents is non-null before an Opportunity may be qualified"
    error_id: ERR_BUDGET_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /consulting/opportunities/{id}/qualify"

  - priority: 91
    category: business_fiscal
    check: "hours on a TimeEntry are greater than 0.00 and at most 60.00"
    error_id: ERR_TIMESHEET_HOURS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /consulting/time-entries"

  - priority: 92
    category: business_fiscal
    check: "cumulative_change_pct computed by calculations.change_request_impact does not exceed 40.00"
    error_id: ERR_CHANGE_EXCEEDS_MATERIALITY
    http_status: 422
    applies_to: "POST /consulting/change-requests/{id}/assess-impact"

  - priority: 93
    category: business_fiscal
    check: "on a TIME_AND_MATERIALS engagement, the sum of billed_value_cents over APPROVED TimeEntries plus the entry being approved does not exceed engagement.not_to_exceed_cents; on change-request approval the same ceiling is applied to the post-change forecast"
    error_id: ERR_NOT_TO_EXCEED_BREACHED
    http_status: 422
    applies_to: "POST /consulting/time-entries/{id}/decision, POST /consulting/change-requests/{id}/client-decision"

  - priority: 94
    category: business_fiscal
    check: "a follow-on Opportunity (non-null origin_engagement_id) requires the origin Engagement's SatisfactionAssessment to exist with csat_score >= 7.50"
    error_id: ERR_FOLLOW_ON_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /consulting/opportunities"

endpoints:
  - method: POST
    path: "/consulting/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical UTC clock, which every deadline, review window and timesheet check reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Forward-only."
    roles: [PracticeAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["all subsequent temporal checks read the new value", "rejects a value earlier than the current clock with ERR_CLOCK_REWIND_FORBIDDEN"]

  - method: POST
    path: "/consulting/clients"
    description: "Register a client organisation with its decision process and adverse-party list."
    roles: [PracticeAdmin]
    code: 201
    input: [name, client_code, industry_code, decision_process, stated_budget_authority_cents, "adverse_party_codes?"]
    output: Client
    side_effects: ["status defaults to ACTIVE", "completed_engagement_count and at_risk_engagement_count default to 0", "rejects a duplicate client_code with ERR_CLIENT_CODE_TAKEN"]

  - method: GET
    path: "/consulting/clients/{id}"
    description: "Read one client."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/consulting/clients"
    description: "List clients, filterable by code and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["client_code?", "status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/consulting/clients/{id}/status"
    description: "Move a client between ACTIVE, CREDIT_HOLD and INACTIVE; CREDIT_HOLD blocks Sow signature."
    roles: [PracticeAdmin]
    code: 200
    input: [status]
    output: Client
    side_effects: ["increments Client.version by 1"]

  - method: POST
    path: "/consulting/consultants"
    description: "Register a consultant with grade, practice and internal cost rate."
    roles: [PracticeAdmin]
    code: 201
    input: [name, grade, practice_code, cost_rate_cents_per_hour, "quality_reviewer_certified?"]
    output: Consultant
    side_effects: ["quality_reviewer_certified defaults to false", "active_lead_deliverable_count defaults to 0"]

  - method: GET
    path: "/consulting/consultants/{id}"
    description: "Read one consultant."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Consultant
    side_effects: []

  - method: GET
    path: "/consulting/consultants"
    description: "List consultants, filterable by practice and grade."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["practice_code?", "grade?", "quality_reviewer_certified?", "limit?", "offset?"]
    output: Consultant[]
    side_effects: []

  - method: POST
    path: "/consulting/opportunities"
    description: "Open a pursuit in SCREENING and score it with the intake qualification variant. A non-null origin_engagement_id marks it as follow-on development and requires a satisfied origin engagement."
    roles: [EngagementPartner]
    code: 201
    input: [client_id, owner_partner_consultant_id, scoping_manager_consultant_id, requested_practice_code, estimated_value_cents, stated_budget_cents, decision_maker_identified, target_start_date, target_end_date, objective_summary, "origin_engagement_id?"]
    output: Opportunity
    side_effects:
      - "runs calculations.qualification_score (intake variant) and writes qualification_score_intake"
      - "status defaults to SCREENING, conflict_status defaults to NOT_CHECKED"
      - "rejects target_start_date before the logical clock with ERR_TARGET_DATE_IN_PAST"
      - "rejects a follow-on whose origin engagement lacks a SatisfactionAssessment with csat_score >= 7.50 with ERR_FOLLOW_ON_NOT_ELIGIBLE"

  - method: GET
    path: "/consulting/opportunities/{id}"
    description: "Read one opportunity with its scope, scores and frozen baseline."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Opportunity
    side_effects: []

  - method: GET
    path: "/consulting/opportunities"
    description: "List opportunities, filterable by client, owning partner, scoping manager, origin engagement and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["client_id?", "owner_partner_consultant_id?", "scoping_manager_consultant_id?", "origin_engagement_id?", "status?", "limit?", "offset?"]
    output: Opportunity[]
    side_effects: []

  - method: POST
    path: "/consulting/opportunities/{id}/conflict-check"
    description: "Record the adverse parties screened for this pursuit and resolve conflict_status."
    roles: [EngagementPartner]
    code: 200
    input: [screened_adverse_party_codes, "waiver_obtained?"]
    output: Opportunity
    side_effects:
      - "writes screened_adverse_party_codes and conflict_status: BLOCKED when the overlap with client.adverse_party_codes has 2 or more codes, WAIVER_REQUIRED on a 1-code overlap with waiver_obtained false or absent, CLEARED_WITH_WAIVER on a 1-code overlap with waiver_obtained true, CLEAR on no overlap"
      - "increments Opportunity.version by 1"

  - method: POST
    path: "/consulting/opportunities/{id}/verify-budget"
    description: "Record the partner-confirmed funded amount and re-score with the verified_requalification variant."
    roles: [EngagementPartner]
    code: 200
    input: [verified_budget_cents]
    output: Opportunity
    side_effects: ["writes verified_budget_cents and qualification_score_verified", "increments Opportunity.version by 1"]

  - method: POST
    path: "/consulting/opportunities/{id}/qualify"
    description: "Gate the pursuit on the verified qualification score: QUALIFIED at 60.00 or above, DISQUALIFIED below."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["drives Opportunity.status to QUALIFIED or DISQUALIFIED", "increments Opportunity.version by 1"]

  - method: PATCH
    path: "/consulting/opportunities/{id}/scope"
    description: "Edit the scope narrative: objective, assumptions, exclusions and client responsibilities. The first call on a QUALIFIED pursuit opens SCOPING. Refused once the scope is frozen."
    roles: [EngagementManager]
    code: 200
    input: ["objective_summary?", "assumptions?", "exclusions?", "client_responsibilities?"]
    output: Opportunity
    side_effects: ["drives Opportunity.status QUALIFIED -> SCOPING on the first call", "increments Opportunity.version by 1", "rejects a frozen scope with ERR_SCOPE_FROZEN"]

  - method: POST
    path: "/consulting/opportunities/{id}/baseline-scope"
    description: "Freeze the scope and price the effort: runs calculations.scope_baseline_cost over every deliverable."
    roles: [EngagementManager]
    code: 200
    input: []
    output: Opportunity
    side_effects:
      - "writes total_estimated_hours, scope_discount_pct, longest_dependency_chain, baseline_effort_cost_cents, baselined_at and each Deliverable.line_cost_cents"
      - "drives Opportunity.status SCOPING -> SCOPE_BASELINED"
      - "increments Opportunity.version by 1"

  - method: POST
    path: "/consulting/deliverables"
    description: "Add a deliverable to an opportunity's scope, optionally depending on a sibling deliverable."
    roles: [EngagementManager]
    code: 201
    input: [opportunity_id, name, primary_grade, effort_hours_estimate, completion_weight_pct, acceptance_criteria, planned_start_date, planned_end_date, "depends_on_deliverable_id?"]
    output: Deliverable
    side_effects:
      - "status defaults to PLANNED, hours_consumed defaults to 0.00"
      - "requires opportunity.status == SCOPING (else ERR_OPPORTUNITY_STATE_INVALID); the scope-narrative PATCH is what opens SCOPING"
      - "rejects a dependency cycle or a cross-opportunity dependency with ERR_DEPENDENCY_CYCLE"

  - method: GET
    path: "/consulting/deliverables/{id}"
    description: "Read one deliverable."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Deliverable
    side_effects: []

  - method: GET
    path: "/consulting/deliverables"
    description: "List deliverables, filterable by opportunity, lead consultant, predecessor and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["opportunity_id?", "lead_consultant_id?", "depends_on_deliverable_id?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []

  - method: PATCH
    path: "/consulting/deliverables/{id}"
    description: "Edit an unfrozen deliverable's effort, weight, acceptance criteria, window or dependency."
    roles: [EngagementManager]
    code: 200
    input: ["name?", "primary_grade?", "effort_hours_estimate?", "completion_weight_pct?", "acceptance_criteria?", "planned_start_date?", "planned_end_date?", "depends_on_deliverable_id?"]
    output: Deliverable
    side_effects: ["increments Deliverable.version by 1", "rejects a frozen scope with ERR_SCOPE_FROZEN"]

  - method: POST
    path: "/consulting/deliverables/{id}/assign-lead"
    description: "Assign the lead consultant, subject to practice match and the firm-wide 2-concurrent-lead capacity rule."
    roles: [EngagementManager]
    code: 200
    input: [lead_consultant_id]
    output: Deliverable
    side_effects:
      - "writes lead_consultant_id and increments Consultant.active_lead_deliverable_count (Consultant.version += 1)"
      - "rejects a practice mismatch with ERR_CONSULTANT_PRACTICE_MISMATCH and a third overlapping lead window with ERR_CONSULTANT_CAPACITY_CONFLICT"
      - "increments Deliverable.version by 1"

  - method: POST
    path: "/consulting/deliverables/{id}/status"
    description: "Drive a deliverable through IN_PROGRESS, SUBMITTED, REWORK and ACCEPTED. The firm moves it to IN_PROGRESS and SUBMITTED; the client accepts or returns it for rework."
    roles: [EngagementManager, ClientContact]
    code: 200
    input: [target_status]
    output: Deliverable
    side_effects:
      - "ACCEPTED recomputes calculations.engagement_economics and may transition Engagement.economics_state"
      - "increments Deliverable.version by 1"

  - method: POST
    path: "/consulting/sows"
    description: "Draft a statement of work against a baselined opportunity (accepted again while the opportunity is SOW_ISSUED, in which case the prior non-terminal Sow is superseded): selects the pricing model, scores engagement risk and quotes the fee. Requires expected_opportunity_version because a new Sow supersedes any prior DRAFT Sow of the same opportunity."
    roles: [EngagementPartner]
    code: 201
    input: [opportunity_id, pricing_model, acceptance_summary, expected_opportunity_version, "target_bonus_cents?"]
    output: Sow
    side_effects:
      - "runs calculations.engagement_risk_score and calculations.sow_quoted_fee; pins scope_discount_pct and baseline_effort_cost_cents onto the Sow"
      - "writes any prior non-terminal Sow of the same opportunity (DRAFT, INTERNAL_REVIEW, CLIENT_REVIEW or REVISION_REQUESTED) to SUPERSEDED and sets the new row's supersedes_sow_id to it"
      - "drives Opportunity.status SCOPE_BASELINED -> SOW_ISSUED and increments Opportunity.version by 1"
      - "rejects a stale expected_opportunity_version with ERR_STALE_OPPORTUNITY_VERSION"

  - method: GET
    path: "/consulting/sows/{id}"
    description: "Read one statement of work with its risk score and priced components."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Sow
    side_effects: []

  - method: GET
    path: "/consulting/sows"
    description: "List statements of work, filterable by opportunity, superseded predecessor and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["opportunity_id?", "supersedes_sow_id?", "status?", "pricing_model?", "limit?", "offset?"]
    output: Sow[]
    side_effects: []

  - method: POST
    path: "/consulting/sows/{id}/submit-internal"
    description: "Send a DRAFT statement of work into internal review."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Sow
    side_effects: ["increments Sow.version by 1"]

  - method: POST
    path: "/consulting/sows/{id}/internal-decision"
    description: "Firm-side review decision: APPROVE releases the document to the client, RETURN sends it back to DRAFT. The reviewer must not be the owning partner."
    roles: [FirmLeadership]
    code: 200
    input: [decision, "note?"]
    output: Sow
    side_effects: ["increments Sow.version by 1", "rejects the owning partner with ERR_SEGREGATION_OF_DUTIES"]

  - method: POST
    path: "/consulting/sows/{id}/client-decision"
    description: "Client decision on a released statement of work: SIGN, REQUEST_REVISION or DECLINE."
    roles: [ClientContact]
    code: 200
    input: [decision, "signature_name?", "note?"]
    output: Sow
    side_effects:
      - "SIGN creates the Engagement (pinning fee, hours, discount, risk premium and ceiling), drives Opportunity.status to WON and requires client.status == ACTIVE"
      - "REQUEST_REVISION drives Opportunity.status SOW_ISSUED -> SCOPING and clears the frozen baseline fields"
      - "DECLINE drives Opportunity.status to LOST"
      - "increments Sow.version and Opportunity.version by 1"

  - method: POST
    path: "/consulting/sows/{id}/revise"
    description: "Re-open a client-rejected statement of work as DRAFT and re-price it against the re-baselined scope; capped at 3 revisions."
    roles: [EngagementPartner]
    code: 200
    input: ["pricing_model?", "target_bonus_cents?", "acceptance_summary?"]
    output: Sow
    side_effects:
      - "increments revision_round, re-runs calculations.engagement_risk_score and calculations.sow_quoted_fee against the new baseline"
      - "drives Opportunity.status SCOPE_BASELINED -> SOW_ISSUED"
      - "rejects a 4th revision with ERR_REVISION_LIMIT_REACHED and an unbaselined opportunity with ERR_OPPORTUNITY_STATE_INVALID"
      - "increments Sow.version and Opportunity.version by 1"

  - method: GET
    path: "/consulting/engagements/{id}"
    description: "Read one engagement with its contracted economics and both state dimensions."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/consulting/engagements"
    description: "List engagements, filterable by signed sow, opportunity, client, lead partner, engagement manager and either state dimension. The only discovery channel for an Engagement created by a Sow signature."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["sow_id?", "opportunity_id?", "client_id?", "lead_partner_consultant_id?", "engagement_manager_consultant_id?", "delivery_state?", "economics_state?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: POST
    path: "/consulting/engagements/{id}/mobilize"
    description: "Staff the engagement manager and move delivery from MOBILIZING to ACTIVE."
    roles: [EngagementPartner]
    code: 200
    input: [engagement_manager_consultant_id]
    output: Engagement
    side_effects: ["writes engagement_manager_consultant_id", "rejects a practice mismatch with ERR_CONSULTANT_PRACTICE_MISMATCH", "increments Engagement.version by 1"]

  - method: GET
    path: "/consulting/engagements/{id}/economics"
    description: "Computed read of calculations.engagement_economics: burn against completion and the forward-looking margin."
    roles: [EngagementPartner, EngagementManager, FirmLeadership, PracticeAdmin]
    code: 200
    input: []
    output: { hours_burn_pct: number, completion_pct: number, progress_variance_pct: number, projected_cost_cents: integer, projected_margin_pct: number, economics_state: string }
    side_effects: []

  - method: POST
    path: "/consulting/engagements/{id}/begin-closing"
    description: "Move delivery to CLOSING once every deliverable is accepted, no change request is open and every quality checkpoint has cleared."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: Engagement
    side_effects: ["increments Engagement.version by 1"]

  - method: POST
    path: "/consulting/engagements/{id}/close"
    description: "Close the engagement; blocked while any risk escalation is unresolved."
    roles: [FirmLeadership]
    code: 200
    input: []
    output: Engagement
    side_effects: ["writes closed_at", "increments Client.completed_engagement_count and Client.version by 1", "increments Engagement.version by 1"]

  - method: POST
    path: "/consulting/time-entries"
    description: "Log a weekly timesheet line against a deliverable; costs and billable value are priced at creation but only count once approved."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership]
    code: 201
    input: [engagement_id, deliverable_id, consultant_id, week_ending_date, hours, billable]
    output: TimeEntry
    side_effects:
      - "runs calculations.time_entry_costing and writes cost_cents and billed_value_cents"
      - "status defaults to SUBMITTED; the ledger is untouched until approval"
      - "rejects hours outside (0.00, 60.00] with ERR_TIMESHEET_HOURS_OUT_OF_RANGE and a duplicate line with ERR_DUPLICATE_TIMESHEET_LINE"

  - method: GET
    path: "/consulting/time-entries/{id}"
    description: "Read one timesheet line."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/consulting/time-entries"
    description: "List timesheet lines, filterable by engagement, deliverable, consultant, week and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["engagement_id?", "deliverable_id?", "consultant_id?", "week_ending_date?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/consulting/time-entries/{id}/decision"
    description: "Approve or reject a timesheet line. Approval posts hours and cost to the engagement burn ledger. The approver must not be the entry's own consultant."
    roles: [EngagementManager]
    code: 200
    input: [decision]
    output: TimeEntry
    side_effects:
      - "APPROVE adds hours and cost_cents to engagement.approved_hours_burned / burned_cost_cents and deliverable.hours_consumed, then recomputes calculations.engagement_economics"
      - "rejects self-approval with ERR_SEGREGATION_OF_DUTIES and a T&M ceiling breach with ERR_NOT_TO_EXCEED_BREACHED"
      - "increments TimeEntry.version, Engagement.version and Deliverable.version by 1"

  - method: POST
    path: "/consulting/time-entries/{id}/reverse"
    description: "Reverse an approved timesheet line, removing its exact contribution from the burn ledger."
    roles: [EngagementManager]
    code: 200
    input: [reversal_reason]
    output: TimeEntry
    side_effects:
      - "subtracts hours and cost_cents from engagement.approved_hours_burned / burned_cost_cents and deliverable.hours_consumed, restoring the pre-approval values exactly"
      - "recomputes calculations.engagement_economics"
      - "increments TimeEntry.version, Engagement.version and Deliverable.version by 1"

  - method: POST
    path: "/consulting/change-requests"
    description: "Raise a change request when a client ask exceeds the signed scope. Requires expected_engagement_version because a change request may supersede an earlier DRAFT and is priced against contracted figures that other writers move."
    roles: [EngagementManager]
    code: 201
    input: [engagement_id, origin, summary, added_hours, added_grade, requested_schedule_days, expected_engagement_version, "supersedes_change_request_id?"]
    output: ChangeRequest
    side_effects:
      - "writes requested_by_consultant_id from X-User-ID; status defaults to DRAFT"
      - "increments Engagement.version by 1"
      - "rejects a stale expected_engagement_version with ERR_STALE_ENGAGEMENT_VERSION"

  - method: GET
    path: "/consulting/change-requests/{id}"
    description: "Read one change request with its assessed impact."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []

  - method: GET
    path: "/consulting/change-requests"
    description: "List change requests, filterable by engagement, requester, leadership approver, superseded predecessor and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["engagement_id?", "requested_by_consultant_id?", "leadership_approver_consultant_id?", "supersedes_change_request_id?", "status?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []

  - method: POST
    path: "/consulting/change-requests/{id}/assess-impact"
    description: "Price the change, measure it against the signed fee and route it: 20.00% cumulative or more needs firm leadership before the client."
    roles: [EngagementManager]
    code: 200
    input: []
    output: ChangeRequest
    side_effects:
      - "runs calculations.change_request_impact and writes gross_delta_cents, fee_delta_cents, cumulative_change_pct_at_assessment and routing"
      - "drives status to PENDING_LEADERSHIP_APPROVAL or PENDING_CLIENT_APPROVAL"
      - "rejects a cumulative change above 40.00% with ERR_CHANGE_EXCEEDS_MATERIALITY"
      - "increments ChangeRequest.version by 1"

  - method: POST
    path: "/consulting/change-requests/{id}/leadership-decision"
    description: "Firm leadership decision on a material change request; the approver must not be the requester."
    roles: [FirmLeadership]
    code: 200
    input: [decision, "note?"]
    output: ChangeRequest
    side_effects: ["writes leadership_approver_consultant_id", "APPROVE forwards the request to the client", "increments ChangeRequest.version by 1"]

  - method: POST
    path: "/consulting/change-requests/{id}/client-decision"
    description: "Client decision on a change request. Approval applies the fee, hours and schedule delta to the engagement and re-forecasts its economics."
    roles: [ClientContact]
    code: 200
    input: [decision, "note?"]
    output: ChangeRequest
    side_effects:
      - "APPROVE adds fee_delta_cents, added_hours and requested_schedule_days to the engagement and rewrites cumulative_change_pct"
      - "recomputes calculations.engagement_economics, which may drive economics_state to OVERRUN and raise an ECONOMICS RiskEscalation"
      - "increments ChangeRequest.version and Engagement.version by 1"

  - method: POST
    path: "/consulting/change-requests/{id}/rescind"
    description: "Withdraw a change request. Rescinding an approved one reverses its entire contracted impact."
    roles: [FirmLeadership, EngagementManager]
    code: 200
    input: ["note?"]
    output: ChangeRequest
    side_effects:
      - "recomputes engagement.contracted_fee_cents, contracted_hours, planned_end_date and cumulative_change_pct from original_fee_cents plus the surviving APPROVED change requests"
      - "recomputes calculations.engagement_economics"
      - "increments ChangeRequest.version and Engagement.version by 1"

  - method: POST
    path: "/consulting/quality-reviews"
    description: "Schedule a quality checkpoint with an independent certified reviewer inside a date window that keeps a 3-day gap from other checkpoints."
    roles: [EngagementManager, FirmLeadership]
    code: 201
    input: [engagement_id, reviewer_consultant_id, checkpoint_type, window_start_date, window_end_date]
    output: QualityReview
    side_effects:
      - "status defaults to SCHEDULED, findings_severity defaults to NONE"
      - "rejects an uncertified reviewer with ERR_REVIEWER_NOT_CERTIFIED, the lead partner or engagement manager with ERR_SEGREGATION_OF_DUTIES, and a window within 3 days of another with ERR_REVIEW_WINDOW_CONFLICT"

  - method: GET
    path: "/consulting/quality-reviews/{id}"
    description: "Read one quality checkpoint."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: QualityReview
    side_effects: []

  - method: GET
    path: "/consulting/quality-reviews"
    description: "List quality checkpoints, filterable by engagement, reviewer, checkpoint type and status."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["engagement_id?", "reviewer_consultant_id?", "checkpoint_type?", "status?", "limit?", "offset?"]
    output: QualityReview[]
    side_effects: []

  - method: POST
    path: "/consulting/quality-reviews/{id}/record-outcome"
    description: "Record the checkpoint outcome inside its open window. A FAILED outcome escalates to firm leadership, and a CRITICAL finding holds delivery outright."
    roles: [QualityReviewer]
    code: 200
    input: [outcome, findings_severity, "note?"]
    output: QualityReview
    side_effects:
      - "FAILED creates a QUALITY RiskEscalation (in DELIVERY_HELD when findings_severity is CRITICAL, otherwise OPEN) and sets engagement.leadership_review_required"
      - "rejects an outcome recorded outside the window with ERR_REVIEW_WINDOW_NOT_OPEN and a severity inconsistent with the outcome with ERR_FINDINGS_SEVERITY_INCONSISTENT"
      - "increments QualityReview.version by 1"

  - method: GET
    path: "/consulting/risk-escalations/{id}"
    description: "Read one risk escalation."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin]
    code: 200
    input: []
    output: RiskEscalation
    side_effects: []

  - method: GET
    path: "/consulting/risk-escalations"
    description: "List risk escalations, filterable by engagement, originating quality review, source, severity and status. The only discovery channel for a system-raised escalation."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin]
    code: 200
    input: ["engagement_id?", "source_quality_review_id?", "source?", "severity?", "status?", "limit?", "offset?"]
    output: RiskEscalation[]
    side_effects: []

  - method: POST
    path: "/consulting/risk-escalations/{id}/leadership-response"
    description: "Firm leadership response to an escalation: ACKNOWLEDGE, HOLD_DELIVERY (which suspends the engagement's open deliverables) or RESOLVE."
    roles: [FirmLeadership]
    code: 200
    input: [response, "leadership_response?"]
    output: RiskEscalation
    side_effects:
      - "HOLD_DELIVERY drives Engagement delivery_state ACTIVE -> ON_HOLD, suspends every PLANNED / IN_PROGRESS / REWORK deliverable and recomputes suspended_deliverable_count"
      - "RESOLVE writes resolved_at, releases the hold when no other escalation holds delivery, and reconciles leadership_review_required and Client.at_risk_engagement_count"
      - "increments RiskEscalation.version by 1"

  - method: POST
    path: "/consulting/satisfaction-assessments"
    description: "Client satisfaction assessment on a closed engagement; the resulting csat_score gates follow-on pursuit development. Immutable once created."
    roles: [ClientContact]
    code: 201
    input: [engagement_id, delivery_score, value_score, communication_score, would_refer, "comments?"]
    output: SatisfactionAssessment
    side_effects: ["runs calculations.satisfaction_csat and writes csat_score", "rejects an engagement that is not CLOSED with ERR_ENGAGEMENT_STATE_INVALID and a second assessment with ERR_ENGAGEMENT_STATE_INVALID"]

  - method: GET
    path: "/consulting/satisfaction-assessments/{id}"
    description: "Read one satisfaction assessment."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: []
    output: SatisfactionAssessment
    side_effects: []

  - method: GET
    path: "/consulting/satisfaction-assessments"
    description: "List satisfaction assessments, filterable by engagement."
    roles: [EngagementPartner, EngagementManager, QualityReviewer, FirmLeadership, PracticeAdmin, ClientContact]
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: SatisfactionAssessment[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or not resolvable to a Consultant, a Client or the PracticeAdmin operator token"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles set"
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "a ClientContact acts on a row whose client is not X-User-ID"
  - id: ERR_NOT_ASSIGNED_TO_ENGAGEMENT
    http: 403
    condition: "a firm actor is not the assigned owning partner, scoping manager, lead partner, engagement manager or reviewer for the operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the actor would review, approve or assure their own work: owning partner approving their own Sow internally, requester approving their own change request, consultant approving their own timesheet line, or lead partner / engagement manager acting as quality reviewer"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown enum member, malformed date, negative money amount, or hours with more than 2 decimals"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or negative offset on a list endpoint"
  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "a submitted range has start after end (opportunity target dates, deliverable planned window, quality review window)"

  - id: ERR_STALE_OPPORTUNITY_VERSION
    http: 412
    condition: "expected_opportunity_version on POST /consulting/sows does not equal the Opportunity's current version"
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version on POST /consulting/change-requests does not equal the Engagement's current version"

  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client id in a path or body does not exist"
  - id: ERR_CONSULTANT_NOT_FOUND
    http: 404
    condition: "consultant id in a path or body does not exist"
  - id: ERR_OPPORTUNITY_NOT_FOUND
    http: 404
    condition: "opportunity id in a path or body does not exist"
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "deliverable id in a path or body does not exist"
  - id: ERR_SOW_NOT_FOUND
    http: 404
    condition: "statement-of-work id in a path or body does not exist"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement id in a path or body does not exist"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "change request id in a path or body does not exist"
  - id: ERR_TIME_ENTRY_NOT_FOUND
    http: 404
    condition: "timesheet line id in a path does not exist"
  - id: ERR_QUALITY_REVIEW_NOT_FOUND
    http: 404
    condition: "quality review id in a path or body does not exist"
  - id: ERR_RISK_ESCALATION_NOT_FOUND
    http: 404
    condition: "risk escalation id in a path does not exist"
  - id: ERR_SATISFACTION_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "satisfaction assessment id in a path does not exist"

  - id: ERR_OPPORTUNITY_STATE_INVALID
    http: 409
    condition: "the Opportunity's status does not permit the operation (qualifying a non-SCREENING pursuit, adding a deliverable outside SCOPING, baselining outside SCOPING, or drafting a Sow against a pursuit that is neither SCOPE_BASELINED nor SOW_ISSUED)"
  - id: ERR_DELIVERABLE_STATE_INVALID
    http: 409
    condition: "the requested target_status is not reachable from the Deliverable's current status, including any transition out of terminal ACCEPTED"
  - id: ERR_SOW_STATE_INVALID
    http: 409
    condition: "the Sow's status does not permit the operation (submitting a non-DRAFT document, deciding on one not under review, revising one that is not REVISION_REQUESTED, or any transition out of SIGNED, DECLINED or SUPERSEDED)"
  - id: ERR_ENGAGEMENT_STATE_INVALID
    http: 409
    condition: "the Engagement's delivery_state does not permit the operation (mobilizing twice, logging or deciding time on a CLOSED engagement, assessing a change on a closing engagement, assessing satisfaction before CLOSED, or a second satisfaction assessment)"
  - id: ERR_CHANGE_REQUEST_STATE_INVALID
    http: 409
    condition: "the ChangeRequest's status does not permit the operation (assessing a non-DRAFT request, a leadership decision on one not pending leadership, a client decision on one not pending client, or rescinding a REJECTED or already RESCINDED request)"
  - id: ERR_TIME_ENTRY_STATE_INVALID
    http: 409
    condition: "the TimeEntry's status does not permit the operation (deciding on a line that is not SUBMITTED, or reversing one that is not APPROVED)"
  - id: ERR_QUALITY_REVIEW_STATE_INVALID
    http: 409
    condition: "recording an outcome on a QualityReview that has already reached PASSED, CONDITIONAL or FAILED"
  - id: ERR_RISK_ESCALATION_STATE_INVALID
    http: 409
    condition: "the leadership response is not reachable from the escalation's current status, including any response after RESOLVED"

  - id: ERR_CONFLICT_BLOCKED
    http: 422
    condition: "the pursuit's conflict_status is BLOCKED because two or more screened adverse parties match the client's adverse_party_codes"
  - id: ERR_CONFLICT_NOT_CLEARED
    http: 409
    condition: "the pursuit's conflict_status is NOT_CHECKED or WAIVER_REQUIRED when qualification or Sow drafting is attempted"
  - id: ERR_QUALITY_GATE_FAILED
    http: 409
    condition: "a QualityReview of the engagement is FAILED with an unresolved linked risk escalation"
  - id: ERR_QUALITY_GATE_PENDING
    http: 409
    condition: "a QualityReview of the engagement is still SCHEDULED when closing begins, or a QUALITY escalation is resolved before a later review of the same checkpoint_type has PASSED or gone CONDITIONAL"
  - id: ERR_CLIENT_NOT_ELIGIBLE_FOR_SIGNATURE
    http: 409
    condition: "the signing client's status is CREDIT_HOLD or INACTIVE"

  - id: ERR_CONSULTANT_PRACTICE_MISMATCH
    http: 422
    condition: "the named consultant's practice_code differs from the opportunity's requested_practice_code"
  - id: ERR_REVIEWER_NOT_CERTIFIED
    http: 422
    condition: "the named reviewer has quality_reviewer_certified false"
  - id: ERR_DELIVERABLE_NOT_IN_ENGAGEMENT_SCOPE
    http: 422
    condition: "a timesheet line names a deliverable outside the engagement's opportunity, or a change request supersedes one from another engagement"
  - id: ERR_DEPENDENCY_CYCLE
    http: 422
    condition: "depends_on_deliverable_id is a self-reference, names a deliverable of another opportunity, or closes a cycle in the dependency graph"
  - id: ERR_DEPENDENCY_NOT_ACCEPTED
    http: 409
    condition: "a deliverable is started while its predecessor is not ACCEPTED"
  - id: ERR_DELIVERABLE_LEAD_UNASSIGNED
    http: 409
    condition: "a deliverable is started with lead_consultant_id null"

  - id: ERR_CLIENT_CODE_TAKEN
    http: 409
    condition: "client_code already exists"
  - id: ERR_SCOPE_FROZEN
    http: 409
    condition: "the scope narrative or a deliverable is edited, or a deliverable is added, after the scope has been baselined"
  - id: ERR_SCOPE_HAS_NO_DELIVERABLES
    http: 422
    condition: "the scope is baselined with zero deliverables"
  - id: ERR_ASSUMPTIONS_REQUIRED
    http: 422
    condition: "the scope is baselined with an empty assumptions, exclusions or client_responsibilities list"
  - id: ERR_ACCEPTANCE_CRITERIA_MISSING
    http: 422
    condition: "the scope is baselined while some deliverable has empty acceptance_criteria"
  - id: ERR_COMPLETION_WEIGHT_SUM_INVALID
    http: 422
    condition: "the deliverables' completion_weight_pct values do not sum to exactly 100.00 at baseline"
  - id: ERR_OUTCOME_TARGET_BONUS_REQUIRED
    http: 422
    condition: "an OUTCOME_BASED Sow omits target_bonus_cents or supplies a non-positive value"
  - id: ERR_TARGET_BONUS_NOT_APPLICABLE
    http: 422
    condition: "a FIXED_FEE or TIME_AND_MATERIALS Sow supplies target_bonus_cents"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a 4th revision of the same Sow is attempted"
  - id: ERR_DUPLICATE_TIMESHEET_LINE
    http: 409
    condition: "a SUBMITTED or APPROVED line already exists for the same engagement, deliverable, consultant and week_ending_date"
  - id: ERR_FINDINGS_SEVERITY_INCONSISTENT
    http: 422
    condition: "findings_severity does not match the recorded outcome (NONE for PASSED, LOW or MEDIUM for CONDITIONAL, HIGH or CRITICAL for FAILED)"
  - id: ERR_DELIVERABLES_NOT_ACCEPTED
    http: 409
    condition: "closing begins while some deliverable of the engagement's opportunity is not ACCEPTED"
  - id: ERR_OPEN_CHANGE_REQUEST_BLOCKS_CLOSING
    http: 409
    condition: "closing begins while a change request is DRAFT, IMPACT_ASSESSED or pending a decision"
  - id: ERR_OPEN_ESCALATION_BLOCKS_CLOSE
    http: 409
    condition: "the engagement is closed while a risk escalation is OPEN, ACKNOWLEDGED or DELIVERY_HELD"

  - id: ERR_CONSULTANT_CAPACITY_CONFLICT
    http: 409
    condition: "the target consultant already leads 2 non-ACCEPTED deliverables whose half-open planned windows overlap the candidate window"
  - id: ERR_REVIEW_WINDOW_CONFLICT
    http: 409
    condition: "the new quality review window is within 3 days of another non-terminal review window on the same engagement"
  - id: ERR_REVIEW_WINDOW_NOT_OPEN
    http: 409
    condition: "an outcome is recorded while the logical clock date lies outside the review's closed window"
  - id: ERR_TIME_ENTRY_OUTSIDE_ENGAGEMENT_WINDOW
    http: 422
    condition: "week_ending_date falls outside the engagement's planned delivery window"
  - id: ERR_FUTURE_TIMESHEET_LINE
    http: 422
    condition: "week_ending_date is after the current logical clock date"
  - id: ERR_TARGET_DATE_IN_PAST
    http: 422
    condition: "an opportunity's target_start_date precedes the current logical clock date"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "the submitted clock value precedes the current logical clock value"

  - id: ERR_BUDGET_NOT_VERIFIED
    http: 409
    condition: "qualification is attempted while verified_budget_cents is null"
  - id: ERR_TIMESHEET_HOURS_OUT_OF_RANGE
    http: 422
    condition: "hours is not greater than 0.00 or exceeds 60.00"
  - id: ERR_CHANGE_EXCEEDS_MATERIALITY
    http: 422
    condition: "the assessed cumulative_change_pct exceeds 40.00 of the signed fee"
  - id: ERR_NOT_TO_EXCEED_BREACHED
    http: 422
    condition: "approving a timesheet line or a change request would push a TIME_AND_MATERIALS engagement past not_to_exceed_cents"
  - id: ERR_FOLLOW_ON_NOT_ELIGIBLE
    http: 422
    condition: "a follow-on opportunity names an origin engagement without a satisfaction assessment, or one whose csat_score is below 7.50"

roles:
  - name: EngagementPartner
    description: "Owns the pursuit and the client relationship: qualifies opportunities, prices statements of work, mobilises and begins closing engagements."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /consulting/opportunities"
      - "POST /consulting/opportunities/{id}/conflict-check"
      - "POST /consulting/opportunities/{id}/verify-budget"
      - "POST /consulting/opportunities/{id}/qualify"
      - "POST /consulting/sows"
      - "POST /consulting/sows/{id}/submit-internal"
      - "POST /consulting/sows/{id}/revise"
      - "POST /consulting/engagements/{id}/mobilize"
      - "POST /consulting/engagements/{id}/begin-closing"
    shared_operations:
      - "POST /consulting/time-entries"
      - "all GET reads except satisfaction comments"
    note: "Every operation additionally requires X-User-ID to equal opportunity.owner_partner_consultant_id or engagement.lead_partner_consultant_id; a partner on another pursuit gets ERR_NOT_ASSIGNED_TO_ENGAGEMENT."

  - name: EngagementManager
    description: "Runs scoping and delivery: edits the scope narrative, builds and staffs deliverables, baselines the scope, approves timesheets and raises change requests."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "PATCH /consulting/opportunities/{id}/scope"
      - "POST /consulting/opportunities/{id}/baseline-scope"
      - "POST /consulting/deliverables"
      - "PATCH /consulting/deliverables/{id}"
      - "POST /consulting/deliverables/{id}/assign-lead"
      - "POST /consulting/time-entries/{id}/decision"
      - "POST /consulting/time-entries/{id}/reverse"
      - "POST /consulting/change-requests"
      - "POST /consulting/change-requests/{id}/assess-impact"
    shared_operations:
      - "POST /consulting/deliverables/{id}/status (firm-side transitions only)"
      - "POST /consulting/quality-reviews"
      - "POST /consulting/change-requests/{id}/rescind"
      - "POST /consulting/time-entries"
      - "all GET reads"
    note: "Bound to opportunity.scoping_manager_consultant_id or engagement.engagement_manager_consultant_id. Cannot approve their own timesheet lines and cannot take the leadership decision on a change request they raised."

  - name: QualityReviewer
    description: "Independent certified reviewer who records checkpoint outcomes and thereby triggers quality escalations."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /consulting/quality-reviews/{id}/record-outcome"
    shared_operations:
      - "POST /consulting/time-entries"
      - "all GET reads"
    note: "Must be the review's reviewer_consultant_id, must have quality_reviewer_certified true, and must not be the engagement's lead partner or engagement manager."

  - name: FirmLeadership
    description: "Firm leadership: internal Sow approval, leadership approval of material change requests, escalation response and engagement closure."
    identity: "entity_backed:Consultant"
    exclusive_operations:
      - "POST /consulting/sows/{id}/internal-decision"
      - "POST /consulting/change-requests/{id}/leadership-decision"
      - "POST /consulting/risk-escalations/{id}/leadership-response"
      - "POST /consulting/engagements/{id}/close"
    shared_operations:
      - "POST /consulting/quality-reviews"
      - "POST /consulting/change-requests/{id}/rescind"
      - "POST /consulting/time-entries"
      - "all GET reads"
    note: "Cannot internally approve a Sow they own as partner, and cannot take the leadership decision on a change request they raised."

  - name: ClientContact
    description: "The client's authorised contact: accepts or returns deliverables, decides on statements of work and change requests, and files the satisfaction assessment."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /consulting/sows/{id}/client-decision"
      - "POST /consulting/change-requests/{id}/client-decision"
      - "POST /consulting/satisfaction-assessments"
    shared_operations:
      - "POST /consulting/deliverables/{id}/status (ACCEPTED and REWORK only)"
      - "GET reads scoped to their own client"
    note: "X-User-ID is the Client id; any row belonging to another client returns ERR_CLIENT_SCOPE_VIOLATION."

  - name: PracticeAdmin
    description: "Back-office operator: maintains client and consultant master data and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /consulting/clients"
      - "POST /consulting/clients/{id}/status"
      - "POST /consulting/consultants"
      - "POST /consulting/_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
    note: "Holds no engagement assignment and therefore cannot approve, price, review or decide anything on a pursuit or engagement."
