        excluded_because:
          difficulty_instance: combinatorial_formula / assisted_attribution_rounds_each_snapshot_before_summing
          rationale: "The pinned round-then-sum order and the whole-cent delta against the sum-then-round order are the named §1.8 instance's subject."

      - name: slot_commit_tier_pinned_to_pre_commit_utilization_is_covered_by_the_difficulty_design
