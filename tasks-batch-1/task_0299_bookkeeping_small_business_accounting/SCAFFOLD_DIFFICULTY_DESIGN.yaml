              as_user_id: "u_acct"
            - call: "POST /ledger/invoice-payments"
              payload: { company_id: "${co}", invoice_id: "${inv}", deposit_bank_account_id: "${bank}", amount_cents: 60000 }
              as: Bookkeeper
              as_user_id: "u_book"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /ledger/invoice-payments/${pay}/reverse"
              payload: {}
              as: Accountant
              as_user_id: "u_acct"
              captures: { st: $.data.status }
          assert:
            - "InvoicePayment.${pay}.status == REVERSED"
            - "Invoice.${inv}.amount_paid_cents == 0"
            - "Invoice.${inv}.balance_due_cents == 100000"
            - "Invoice.${inv}.payment_status == UNPAID"
