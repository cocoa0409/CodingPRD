              as: Coach
              as_user_id: "${c_id}"
              captures: { tm_a_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se1_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_id}", name: "North Bravo" }
