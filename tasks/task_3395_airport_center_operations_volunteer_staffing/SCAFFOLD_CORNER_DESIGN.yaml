            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 900, utilities_included: true, access_terms: "escort", security_level: 3, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
