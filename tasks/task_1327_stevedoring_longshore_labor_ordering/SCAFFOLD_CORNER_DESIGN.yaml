              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 0 }
