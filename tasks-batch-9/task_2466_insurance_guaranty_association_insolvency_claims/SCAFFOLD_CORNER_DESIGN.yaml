          - errors[ERR_COVERAGE_PROFILE_MISSING]
        distinguishing_aspect: "The triggering event needs a CoverageProfile for every line it must price: with only a PERSONAL_AUTO profile registered and a HOMEOWNERS policy imported, the trigger returns ERR_COVERAGE_PROFILE_MISSING (422) and the insolvency stays DECLARED with the policy still IMPORTED."
