scenario: |
  1829. Engine Remanufacturing Plant (Jasper Engines style remanufacturer): core acceptance grading & credit, disassembly & machining route (bore/deck/crank), component reuse standard & interchange, build spec by application & emissions, dyno test & sealed unit record, core deposit accounting & returns aging, distributor allocation, warranty claim & failure teardown

domain_name: engine-remanufacturing
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: distributor_code, type: string, source: input, description: "Unique distributor code", constraints: "unique across all distributors" }
      - { name: name, type: string, source: input, description: "Distributor business name" }
      - { name: emissions_requirement, type: enum, source: input, description: "Market emissions requirement: FEDERAL | CALIFORNIA" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD", default: ACTIVE }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed open core-deposit exposure", constraints: ">= 0" }
      - { name: volume_discount_pct, type: number, source: input, description: "Fractional volume discount, e.g. 0.15 = 15%", constraints: "0 <= x <= 0.5" }
      - { name: deposits_held_cents, type: integer, source: computed, description: "Sum of amount_cents over this distributor's CoreDeposit rows with status HELD" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Unapplied credit memos: sum of CoreReturn final_credit_cents deltas plus deposit refunds posted, minus warranty credit reversals" }

  - name: CoreReturn
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; returning distributor (must equal caller for Distributor role)" }
      - { name: build_spec_id, type: string, source: input, description: "FK -> BuildSpec.id; spec family this core will be rebuilt under" }
      - { name: core_deposit_id, type: string, source: input, description: "FK -> CoreDeposit.id; optional deposit this return closes; null means unlinked core buy", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "RECEIVED | GRADED | DISPUTED | CLOSED", default: RECEIVED }
      - { name: grade, type: enum, source: system, description: "GRADE_A | GRADE_B | GRADE_C | REJECT; null until graded", constraints: "nullable" }
      - { name: missing_components, type: array, source: system, description: "Array of part_type strings recorded at grading; empty until graded" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Optimistic estimate at receipt: build spec core_base_credit_cents x 1.00 (assumes GRADE_A, no missing components)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Final credit per core_credit_calculation at grading; null until graded", constraints: "nullable" }
      - { name: graded_at, type: datetime, source: system, description: "Logical-clock timestamp of latest grading; null until graded", constraints: "nullable" }
      - { name: dispute_count, type: integer, source: system, description: "Number of GRADED->DISPUTED cycles", default: 0 }

  - name: CoreDeposit
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; buyer charged the deposit" }
      - { name: reman_engine_id, type: string, source: system, description: "FK -> RemanEngine.id; engine sale that created this deposit" }
      - { name: amount_cents, type: integer, source: system, description: "Deposit amount copied from BuildSpec.core_deposit_cents at sale time" }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of the sale" }
      - { name: status, type: enum, source: system, description: "HELD | CLOSED_REFUNDED | FORFEITED", default: HELD }
      - { name: refunded_cents, type: integer, source: system, description: "Amount refunded at close per deposit_refund_calculation; 0 while HELD" }
      - { name: forfeited_cents, type: integer, source: system, description: "amount_cents - refunded_cents at close; full amount when FORFEITED; 0 while HELD" }
      - { name: age_days_at_close, type: integer, source: computed, description: "floor((closed_at - sold_at)/86400); null while HELD", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close; null while HELD", constraints: "nullable" }

  - name: BuildSpec
    parent: null
    common_fields: true
    fields:
      - { name: engine_family, type: string, source: input, description: "Engine family, e.g. 'SBC-350'" }
      - { name: application_code, type: string, source: input, description: "Vehicle/application code, e.g. 'C1500-1996'" }
      - { name: emissions_tier, type: enum, source: input, description: "FEDERAL | CALIFORNIA" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }
      - { name: list_price_cents, type: integer, source: input, description: "List price of one remanufactured engine under this spec" }
      - { name: core_deposit_cents, type: integer, source: input, description: "Core deposit charged per engine sale under this spec" }
      - { name: core_base_credit_cents, type: integer, source: input, description: "Base core credit for this family at GRADE_A with no missing components" }
      - { name: allowed_reuse_grades, type: array, source: input, description: "Component reuse grades consumable under this spec; subset of [REUSE_OK, REWORK]" }
      - { name: allowed_interchange_groups, type: array, source: input, description: "Interchange group codes whose components fit this application" }
      - { name: dyno_min_horsepower, type: integer, source: input, description: "Dyno pass threshold: horsepower must be >= this" }
      - { name: dyno_min_oil_pressure_psi, type: number, source: input, description: "Dyno pass threshold: oil_pressure_psi must be >= this" }
      - { name: dyno_max_coolant_temp_f, type: integer, source: input, description: "Dyno pass threshold: coolant_temp_f must be <= this" }
      - { name: required_op_sequence, type: array, source: input, description: "Ordered op_type list (BORE | DECK | CRANK_GRIND) defining the machining route; ops must complete in this order" }

  - name: RemanWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: core_return_id, type: string, source: input, description: "FK -> CoreReturn.id; source core being remanufactured" }
      - { name: build_spec_id, type: string, source: system, description: "FK -> BuildSpec.id; copied from the core return at creation" }
      - { name: status, type: enum, source: system, description: "QUEUED | TEARDOWN | MACHINING | ASSEMBLY | DYNO_TEST | CLOSED | CANCELLED", default: QUEUED }
      - { name: reman_engine_id, type: string, source: system, description: "FK -> RemanEngine.id; engine created on first entry into ASSEMBLY; null until then", constraints: "nullable" }
      - { name: rework_count, type: integer, source: system, description: "Number of DYNO_TEST -> MACHINING rework loops", default: 0 }

  - name: MachineOperation
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> RemanWorkOrder.id" }
      - { name: op_type, type: enum, source: input, description: "BORE | DECK | CRANK_GRIND" }
      - { name: sequence, type: integer, source: input, description: "Order within the route; must match position of op_type in the spec required_op_sequence (1-based)", constraints: ">= 1" }
      - { name: station_code, type: string, source: system, description: "Machine station occupied; null until performed", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: system, description: "Occupation window start recorded at perform; null until performed", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: system, description: "Occupation window end recorded at perform; null until performed", constraints: "nullable" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL recorded at perform; null until performed", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | FAILED", default: PENDING }
      - { name: attempt_count, type: integer, source: system, description: "Number of perform calls on this operation", default: 0 }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> RemanWorkOrder.id; teardown that salvaged this component" }
      - { name: part_type, type: enum, source: input, description: "CRANKSHAFT | CYLINDER_HEAD | ENGINE_BLOCK | CAMSHAFT" }
      - { name: interchange_group, type: string, source: input, description: "Interchange group code, e.g. 'CRANK-SBC-3.48'" }
      - { name: reuse_grade, type: enum, source: system, description: "REUSE_OK | REWORK | SCRAP; null until inspected", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | CONSUMED | SCRAPPED", default: AVAILABLE }
      - { name: consumed_by_work_order_id, type: string, source: system, description: "FK -> RemanWorkOrder.id; work order that consumed this component; null until consumed", constraints: "nullable" }

  - name: RemanEngine
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> RemanWorkOrder.id; producing work order" }
      - { name: build_spec_id, type: string, source: system, description: "FK -> BuildSpec.id; copied from the work order" }
      - { name: serial_number, type: string, source: system, description: "Sealed unit serial, minted at creation: 'RMN-' + 6-digit zero-padded sequence in creation order", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "BUILT | DYNO_PASSED | SEALED | SOLD | RETURNED | SCRAPPED", default: BUILT }
      - { name: latest_dyno_result, type: enum, source: computed, description: "PASS | FAIL of the most recent DynoTest by created_at; null if none", constraints: "nullable" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock timestamp of sealing; null until sealed", constraints: "nullable" }
      - { name: sealed_by, type: string, source: system, description: "X-User-ID of the QualityInspector who sealed; null until sealed", constraints: "nullable" }
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; buyer; null until sold", constraints: "nullable" }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of sale; null until sold", constraints: "nullable" }
      - { name: sale_price_cents, type: integer, source: computed, description: "Final sale price per engine_sale_pricing; null until sold", constraints: "nullable" }

  - name: DynoTest
    parent: null
    common_fields: false
    fields:
      - { name: reman_engine_id, type: string, source: input, description: "FK -> RemanEngine.id (path)" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the ShopTechnician who recorded the test" }
      - { name: dyno_cell_code, type: string, source: input, description: "Dyno cell occupied by this test" }
      - { name: started_at, type: datetime, source: input, description: "Test window start" }
      - { name: ended_at, type: datetime, source: input, description: "Test window end; must be after started_at" }
      - { name: horsepower, type: integer, source: input, description: "Measured horsepower" }
      - { name: oil_pressure_psi, type: number, source: input, description: "Measured oil pressure" }
      - { name: coolant_temp_f, type: integer, source: input, description: "Measured coolant temperature" }
      - { name: result, type: enum, source: computed, description: "PASS iff horsepower >= spec.dyno_min_horsepower AND oil_pressure_psi >= spec.dyno_min_oil_pressure_psi AND coolant_temp_f <= spec.dyno_max_coolant_temp_f; else FAIL" }
      - { name: attempt, type: integer, source: system, description: "1-based count of dyno tests recorded on this engine" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: reman_engine_id, type: string, source: input, description: "FK -> RemanEngine.id; failed engine (must be SOLD to the filing distributor)" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; filing distributor (must equal caller for Distributor role)" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description" }
      - { name: status, type: enum, source: system, description: "OPEN | TEARDOWN_COMPLETE | APPROVED_CREDIT | APPROVED_REPLACEMENT | DENIED", default: OPEN }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of filing" }
      - { name: months_in_service, type: integer, source: computed, description: "floor((filed_at - engine.sold_at) days / 30)" }
      - { name: teardown_findings, type: string, source: system, description: "Findings recorded at teardown; null until teardown", constraints: "nullable" }
      - { name: teardown_by, type: string, source: system, description: "X-User-ID of the ShopTechnician who performed teardown; null until teardown", constraints: "nullable" }
      - { name: settled_credit_cents, type: integer, source: computed, description: "Credit granted per warranty_settlement_calculation; null until adjudicated", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Distributor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "PATCH /distributors/{id} with status=CREDIT_HOLD"
        actor: PlantAdmin
        preconditions: ["Distributor exists"]
        side_effects: ["Increments Distributor.version by 1"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "PATCH /distributors/{id} with status=ACTIVE"
        actor: PlantAdmin
        preconditions: ["Distributor exists"]
        side_effects: ["Increments Distributor.version by 1"]

  - entity: CoreReturn
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: GRADED
        trigger: "POST /core-returns/{id}/grade"
        actor: CoreInspector
        preconditions:
          - "grade input is one of GRADE_A | GRADE_B | GRADE_C | REJECT"
        side_effects:
          - "Sets grade, missing_components, graded_at (logical clock)"
          - "Runs core_credit_calculation final variant -> sets final_credit_cents"
          - "CREDIT CHAIN link 1: Distributor.credit_balance_cents += final_credit_cents (and += delta vs prior final_credit_cents on re-grade; see DISPUTED->GRADED)"
          - "DEPOSIT CHAIN link 1 (only if core_deposit_id is non-null): linked CoreDeposit HELD -> CLOSED_REFUNDED (bracket pct > 0) or FORFEITED (bracket pct == 0); runs deposit_refund_calculation -> sets refunded_cents, forfeited_cents, age_days_at_close, closed_at"
          - "DEPOSIT CHAIN link 2 (caused by the deposit close): Distributor.deposits_held_cents -= deposit.amount_cents; Distributor.credit_balance_cents += deposit.refunded_cents"
      - from: GRADED
        to: DISPUTED
        trigger: "POST /core-returns/{id}/respond with action=DISPUTE"
        actor: Distributor
        preconditions:
          - "Caller is the CoreReturn.distributor_id owner"
        side_effects:
          - "Increments dispute_count by 1"
          - "CREDIT CHAIN compensation: Distributor.credit_balance_cents -= final_credit_cents (credit placed back in suspense while disputed)"
      - from: DISPUTED
        to: GRADED
        trigger: "POST /core-returns/{id}/grade (re-grade after dispute)"
        actor: CoreInspector
        preconditions:
          - "grade input is one of GRADE_A | GRADE_B | GRADE_C | REJECT"
        side_effects:
          - "Recomputes final_credit_cents via core_credit_calculation final variant; sets grade, missing_components, graded_at"
          - "CREDIT CHAIN: Distributor.credit_balance_cents += new final_credit_cents (dispute suspense already removed the prior credit, so the net effect is the delta between old and new final_credit_cents)"
          - "Deposit is already closed; no deposit side effects on re-grade"
      - from: GRADED
        to: CLOSED
        trigger: "POST /core-returns/{id}/respond with action=ACCEPT"
        actor: Distributor
        preconditions:
          - "Caller is the CoreReturn.distributor_id owner"
        side_effects: []

  - entity: CoreDeposit
    initial_state: HELD
    terminal_states: [CLOSED_REFUNDED, FORFEITED]
    transitions:
      - from: HELD
        to: CLOSED_REFUNDED
        trigger: "POST /core-returns/{id}/grade on the CoreReturn carrying this core_deposit_id, when deposit_refund_calculation bracket pct > 0"
        actor: system
        preconditions: ["Linked CoreReturn transitions to GRADED"]
        side_effects:
          - "Runs deposit_refund_calculation -> refunded_cents = amount_cents x bracket_pct; forfeited_cents = amount_cents - refunded_cents; age_days_at_close; closed_at"
          - "Cascades to Distributor: deposits_held_cents -= amount_cents; credit_balance_cents += refunded_cents"
      - from: HELD
        to: FORFEITED
        trigger: "POST /aging-runs (system sweep) when floor((now - sold_at)/86400) > 90, OR POST /core-returns/{id}/grade when the linked return is graded with floor((now - sold_at)/86400) > 90 (bracket pct == 0)"
        actor: system
        preconditions: ["Deposit status == HELD", "floor((current logical clock - sold_at)/86400) > 90"]
        side_effects:
          - "refunded_cents = 0; forfeited_cents = amount_cents; age_days_at_close; closed_at"
          - "Cascades to Distributor: deposits_held_cents -= amount_cents (no credit posted)"

  - entity: BuildSpec
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /build-specs/{id}/activate"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "Sets activated_at"
          - "SUPERSEDE: every other BuildSpec with the same (engine_family, application_code, emissions_tier) currently ACTIVE transitions ACTIVE -> RETIRED with retired_at set"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /build-specs/{id}/retire, or supersede cascade from a sibling activation"
        actor: PlantAdmin
        preconditions:
          - "retire endpoint: no RemanWorkOrder with this build_spec_id in status QUEUED | TEARDOWN | MACHINING | ASSEMBLY | DYNO_TEST"
        side_effects: ["Sets retired_at"]

  - entity: RemanWorkOrder
    initial_state: QUEUED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUEUED
        to: TEARDOWN
        trigger: "POST /work-orders/{id}/advance with target=TEARDOWN"
        actor: ShopTechnician
        preconditions: []
        side_effects: ["Increments version by 1"]
      - from: TEARDOWN
        to: MACHINING
        trigger: "POST /work-orders/{id}/advance with target=MACHINING"
        actor: ShopTechnician
        preconditions:
          - "At least one MachineOperation exists for this work order (the route plan must be declared before machining)"
        side_effects: ["Increments version by 1"]
      - from: MACHINING
        to: ASSEMBLY
        trigger: "POST /work-orders/{id}/advance with target=ASSEMBLY"
        actor: ShopTechnician
        preconditions:
          - "Every MachineOperation of this work order has status == COMPLETED"
        side_effects:
          - "If reman_engine_id is null: creates RemanEngine (status BUILT, build_spec_id copied, serial_number minted) and sets reman_engine_id"
          - "Increments version by 1"
      - from: ASSEMBLY
        to: DYNO_TEST
        trigger: "POST /work-orders/{id}/advance with target=DYNO_TEST"
        actor: ShopTechnician
        preconditions: []
        side_effects: ["Increments version by 1"]
      - from: DYNO_TEST
        to: MACHINING
        trigger: "POST /work-orders/{id}/advance with target=MACHINING (rework loop)"
        actor: ShopTechnician
        preconditions:
          - "RemanEngine referenced by reman_engine_id has latest_dyno_result == FAIL"
        side_effects:
          - "Increments rework_count by 1"
          - "Every MachineOperation of this work order with status FAILED transitions FAILED -> PENDING (window fields cleared)"
          - "Increments version by 1"
      - from: DYNO_TEST
        to: CLOSED
        trigger: "system (bubble-up when the RemanEngine referenced by reman_engine_id is sealed)"
        actor: system
        preconditions: ["RemanEngine transitions DYNO_PASSED -> SEALED"]
        side_effects: ["Increments version by 1"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "COMPONENT RELEASE: every Component with consumed_by_work_order_id == this work order transitions CONSUMED -> AVAILABLE (consumed_by_work_order_id cleared)"
          - "Increments version by 1"
      - from: TEARDOWN
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "COMPONENT RELEASE: every Component with consumed_by_work_order_id == this work order transitions CONSUMED -> AVAILABLE (consumed_by_work_order_id cleared)"
          - "Increments version by 1"
      - from: MACHINING
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "COMPONENT RELEASE: every Component with consumed_by_work_order_id == this work order transitions CONSUMED -> AVAILABLE (consumed_by_work_order_id cleared)"
          - "Increments version by 1"
      - from: ASSEMBLY
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlantAdmin
        preconditions: []
        side_effects:
          - "COMPONENT RELEASE: every Component with consumed_by_work_order_id == this work order transitions CONSUMED -> AVAILABLE (consumed_by_work_order_id cleared)"
          - "If reman_engine_id is non-null: the referenced RemanEngine transitions BUILT -> SCRAPPED"
          - "Increments version by 1"

  - entity: MachineOperation
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /operations/{id}/perform with result=PASS"
        actor: ShopTechnician
        preconditions:
          - "Parent RemanWorkOrder.status == MACHINING"
          - "Every MachineOperation of the same work order with smaller sequence has status == COMPLETED (route order enforced)"
          - "No other MachineOperation (any status, excluding this one) with the same station_code has a stored window overlapping [scheduled_start, scheduled_end) — half-open semantics: adjacency (existing.scheduled_end == new.scheduled_start or new.scheduled_end == existing.scheduled_start) is allowed"
        side_effects: ["Sets station_code, scheduled_start, scheduled_end, result=PASS; attempt_count += 1"]
      - from: PENDING
        to: FAILED
        trigger: "POST /operations/{id}/perform with result=FAIL"
        actor: ShopTechnician
        preconditions:
          - "Parent RemanWorkOrder.status == MACHINING"
          - "Every MachineOperation of the same work order with smaller sequence has status == COMPLETED"
          - "Station overlap check identical to the PENDING -> COMPLETED transition"
        side_effects: ["Sets station_code, scheduled_start, scheduled_end, result=FAIL; attempt_count += 1"]
      - from: FAILED
        to: COMPLETED
        trigger: "POST /operations/{id}/perform with result=PASS (re-perform after rework)"
        actor: ShopTechnician
        preconditions:
          - "Parent RemanWorkOrder.status == MACHINING"
          - "Every MachineOperation of the same work order with smaller sequence has status == COMPLETED"
          - "Station overlap check identical to PENDING -> COMPLETED, excluding this operation's own previously stored window (re-perform replaces it)"
        side_effects: ["Replaces station_code, scheduled_start, scheduled_end; result=PASS; attempt_count += 1"]
      - from: FAILED
        to: FAILED
        trigger: "POST /operations/{id}/perform with result=FAIL (re-perform fails again)"
        actor: ShopTechnician
        preconditions:
          - "Same as FAILED -> COMPLETED"
        side_effects: ["Replaces station_code, scheduled_start, scheduled_end; result=FAIL; attempt_count += 1"]

  - entity: Component
    initial_state: AVAILABLE
    terminal_states: [SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /components/{id}/inspect with quarantine=true"
        actor: QualityInspector
        preconditions: []
        side_effects: ["Sets reuse_grade to the inspected grade (may be null-grade only when quarantined without grade — grade input still required)"]
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /components/{id}/inspect with quarantine=false"
        actor: QualityInspector
        preconditions: []
        side_effects: ["Sets reuse_grade to the inspected grade"]
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /components/{id}/inspect with quarantine=false (grade set/re-set)"
        actor: QualityInspector
        preconditions: []
        side_effects: ["Sets reuse_grade"]
      - from: AVAILABLE
        to: SCRAPPED
        trigger: "POST /components/{id}/inspect with reuse_grade=SCRAP"
        actor: QualityInspector
        preconditions: []
        side_effects: ["Sets reuse_grade=SCRAP"]
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /components/{id}/inspect with reuse_grade=SCRAP"
        actor: QualityInspector
        preconditions: []
        side_effects: ["Sets reuse_grade=SCRAP"]
      - from: AVAILABLE
        to: CONSUMED
        trigger: "POST /work-orders/{id}/consume with component_id"
        actor: ShopTechnician
        preconditions:
          - "Work order status == ASSEMBLY"
          - "Component.status == AVAILABLE (QUARANTINED rejected as ERR_COMPONENT_QUARANTINED; CONSUMED/SCRAPPED rejected as ERR_INVALID_STATE)"
          - "Component.reuse_grade is non-null and is a member of the work order spec's allowed_reuse_grades"
          - "Component.interchange_group is a member of the work order spec's allowed_interchange_groups"
        side_effects: ["Sets consumed_by_work_order_id to the consuming work order"]
      - from: CONSUMED
        to: AVAILABLE
        trigger: "system (compensation cascade from POST /work-orders/{id}/cancel)"
        actor: system
        preconditions: ["Consuming work order is cancelled"]
        side_effects: ["Clears consumed_by_work_order_id"]

  - entity: RemanEngine
    initial_state: BUILT
    terminal_states: [SCRAPPED]
    transitions:
      - from: BUILT
        to: SCRAPPED
        trigger: "system (cascade from POST /work-orders/{id}/cancel on the producing work order while in ASSEMBLY)"
        actor: system
        preconditions: ["Parent RemanWorkOrder transitions ASSEMBLY -> CANCELLED"]
        side_effects: []
      - from: BUILT
        to: DYNO_PASSED
        trigger: "POST /reman-engines/{id}/dyno-tests where the computed result == PASS"
        actor: ShopTechnician
        preconditions:
          - "Dyno cell overlap check passes (see DynoTest creation rules)"
        side_effects:
          - "Sets latest_dyno_result=PASS"
      - from: BUILT
        to: BUILT
        trigger: "POST /reman-engines/{id}/dyno-tests where the computed result == FAIL"
        actor: ShopTechnician
        preconditions: []
        side_effects: ["Sets latest_dyno_result=FAIL (engine remains BUILT; work order becomes eligible for rework)"]
      - from: DYNO_PASSED
        to: SEALED
        trigger: "POST /reman-engines/{id}/seal"
        actor: QualityInspector
        preconditions:
          - "latest_dyno_result == PASS"
          - "segregation of duties: caller X-User-ID != recorded_by of the most recent DynoTest"
        side_effects:
          - "Sets sealed_at (logical clock) and sealed_by"
          - "BUBBLE UP: parent RemanWorkOrder (work_order_id) transitions DYNO_TEST -> CLOSED"
      - from: SEALED
        to: SOLD
        trigger: "POST /reman-engines/sell (server-side allocation selector picks this engine)"
        actor: Distributor
        preconditions:
          - "Buyer Distributor.status == ACTIVE"
          - "Emissions gate: if Distributor.emissions_requirement == CALIFORNIA then spec.emissions_tier must == CALIFORNIA; FEDERAL requirement accepts either tier"
          - "Fiscal gate: Distributor.deposits_held_cents + spec.core_deposit_cents <= Distributor.credit_limit_cents"
        side_effects:
          - "Sets distributor_id, sold_at (logical clock), sale_price_cents per engine_sale_pricing"
          - "SALE CHAIN link 1: creates CoreDeposit (status HELD, amount_cents = spec.core_deposit_cents, sold_at = sale clock)"
          - "SALE CHAIN link 2 (caused by deposit creation): Distributor.deposits_held_cents += amount_cents; Distributor.version += 1"
      - from: SOLD
        to: RETURNED
        trigger: "POST /warranty-claims/{id}/teardown on a claim referencing this engine"
        actor: ShopTechnician
        preconditions: ["Claim status == OPEN"]
        side_effects: ["Engine leaves sellable inventory"]
      - from: RETURNED
        to: SCRAPPED
        trigger: "POST /warranty-claims/{id}/adjudicate with any outcome (failed unit is torn down and scrapped regardless of outcome)"
        actor: WarrantyAdjuster
        preconditions: ["Claim status == TEARDOWN_COMPLETE"]
        side_effects: []
      - from: SEALED
        to: SOLD
        trigger: "POST /warranty-claims/{id}/adjudicate with outcome=APPROVED_REPLACEMENT (replacement selector picks this engine)"
        actor: WarrantyAdjuster
        preconditions: ["Engine matches the claim's spec and is SEALED"]
        side_effects:
          - "Sets distributor_id to claimant, sold_at (logical clock), sale_price_cents = 0 (warranty replacement)"
          - "REPLACEMENT CHAIN link 1: creates CoreDeposit (status HELD, amount_cents = spec.core_deposit_cents, sold_at = adjudication clock)"
          - "REPLACEMENT CHAIN link 2 (caused by deposit creation): Distributor.deposits_held_cents += amount_cents; Distributor.version += 1"

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [APPROVED_CREDIT, APPROVED_REPLACEMENT, DENIED]
    transitions:
      - from: OPEN
        to: TEARDOWN_COMPLETE
        trigger: "POST /warranty-claims/{id}/teardown"
        actor: ShopTechnician
        preconditions: ["Claim status == OPEN"]
        side_effects:
          - "Sets teardown_findings, teardown_by (caller X-User-ID)"
          - "CROSS-ENTITY: the referenced RemanEngine transitions SOLD -> RETURNED"
      - from: TEARDOWN_COMPLETE
        to: APPROVED_CREDIT
        trigger: "POST /warranty-claims/{id}/adjudicate with outcome=APPROVED_CREDIT"
        actor: WarrantyAdjuster
        preconditions:
          - "segregation of duties: caller X-User-ID != teardown_by"
        side_effects:
          - "Runs warranty_settlement_calculation credit variant -> settled_credit_cents"
          - "Distributor.credit_balance_cents += settled_credit_cents"
          - "Referenced RemanEngine transitions RETURNED -> SCRAPPED"
      - from: TEARDOWN_COMPLETE
        to: APPROVED_REPLACEMENT
        trigger: "POST /warranty-claims/{id}/adjudicate with outcome=APPROVED_REPLACEMENT"
        actor: WarrantyAdjuster
        preconditions:
          - "segregation of duties: caller X-User-ID != teardown_by"
          - "Replacement pool non-empty: at least one RemanEngine with status SEALED and build_spec_id == claim engine's build_spec_id (selector: sealed_at ASC, tie-break created_at ASC)"
        side_effects:
          - "settled_credit_cents = 0 (replacement variant grants no cash credit)"
          - "REPLACEMENT CHAIN link 1: selected RemanEngine transitions SEALED -> SOLD to claimant with sale_price_cents = 0"
          - "REPLACEMENT CHAIN link 2 (caused by the replacement sale): new CoreDeposit created HELD for the claimant"
          - "REPLACEMENT CHAIN link 3 (caused by deposit creation): Distributor.deposits_held_cents += deposit.amount_cents; Distributor.version += 1"
          - "Referenced failed RemanEngine transitions RETURNED -> SCRAPPED"
      - from: TEARDOWN_COMPLETE
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudicate with outcome=DENIED"
        actor: WarrantyAdjuster
        preconditions:
          - "segregation of duties: caller X-User-ID != teardown_by"
        side_effects:
          - "settled_credit_cents = 0"
          - "Referenced RemanEngine transitions RETURNED -> SCRAPPED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: engine-sell-stale-distributor
    parent_entity: Distributor
    write_endpoint: "POST /reman-engines/sell"
    occ_field: "expected_distributor_version"
    description: |
      Selling an engine to a Distributor whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just completed a sale or deposit event against the same
      distributor (which legitimately succeeds under the product semantics) and
      the current writer's credit-limit view of the distributor is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: operation-create-stale-work-order
    parent_entity: RemanWorkOrder
    write_endpoint: "POST /work-orders/{id}/operations"
    occ_field: "expected_work_order_version"
    description: |
      Adding a MachineOperation to a RemanWorkOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just added an operation (a legitimate route-plan
      extension) and the current writer's view of the route plan is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: core_credit_calculation
    trigger: "CoreReturn creation (provisional variant) and POST /core-returns/{id}/grade (final variant)"
    algorithm: tiered_pricing
    formula: |
      # FINAL variant (at grading):
      base_component = round_half_up(spec.core_base_credit_cents * GRADE_MULT[grade])
      for each part in missing_components (processed in the order listed in the request):
          deduction_line[part] = round_half_up(COMPONENT_DEDUCTION_CENTS[part] * GRADE_MULT[grade])
      # PINNED ROUNDING ORDER: each deduction line is rounded to whole cents
      # (round_half_up) BEFORE summing; sum the rounded lines. Never multiply
      # the unrounded aggregate and round once at the end.
      total_deductions = sum(deduction_line[part])
      final_credit_cents = max(0, base_component - total_deductions)
      # PROVISIONAL variant (at receipt):
      provisional_credit_cents = round_half_up(spec.core_base_credit_cents * PROVISIONAL_MULT)
      # = base credit assuming GRADE_A with no missing components.
    input_set: "The CoreReturn being graded; its BuildSpec (core_base_credit_cents); grade and missing_components from the grade request. Only the grading request's own data participates — other returns are irrelevant."
    constants:
      GRADE_MULT_GRADE_A: 1.00
      GRADE_MULT_GRADE_B: 0.60
      GRADE_MULT_GRADE_C: 0.30
      GRADE_MULT_REJECT: 0.00
      PROVISIONAL_MULT: 1.00
      COMPONENT_DEDUCTION_CRANKSHAFT: 40000
      COMPONENT_DEDUCTION_CYLINDER_HEAD: 25005
      COMPONENT_DEDUCTION_ENGINE_BLOCK: 50000
      COMPONENT_DEDUCTION_CAMSHAFT: 33335
    precision: "integer cents; round_half_up applied per deduction line BEFORE summing, and once on the base component"
    variants:
      - name: provisional
        when: "CoreReturn creation (status RECEIVED)"
        difference: "Uses PROVISIONAL_MULT=1.00 with zero deductions — assumes a perfect GRADE_A core; ignores actual grade/condition because inspection has not happened"
      - name: final
        when: "POST /core-returns/{id}/grade"
        difference: "Uses the actual grade multiplier and per-line rounded deductions for missing components; produces a different value than provisional whenever grade != GRADE_A or missing_components is non-empty"

  - name: deposit_refund_calculation
    trigger: "Linked CoreReturn grading close, or POST /aging-runs sweep"
    algorithm: threshold
    formula: |
      age_days = floor((close_clock - CoreDeposit.sold_at) / 86400)   # whole days, both timestamps UTC
      if age_days <= 30:  bracket_pct = 1.00
      elif age_days <= 60: bracket_pct = 0.80
      elif age_days <= 90: bracket_pct = 0.50
      else:                bracket_pct = 0.00   # deposit FORFEITED
      refunded_cents  = round_half_up(CoreDeposit.amount_cents * bracket_pct)
      forfeited_cents = CoreDeposit.amount_cents - refunded_cents
      # Boundary semantics are INCLUSIVE upper bounds: exactly 30 days -> 100%;
      # exactly 60 -> 80%; exactly 90 -> 50%; 91+ -> 0% and status FORFEITED.
    input_set: "The single CoreDeposit being closed. The aging sweep (POST /aging-runs) selects exactly the CoreDeposit rows with status == HELD and floor((now - sold_at)/86400) > 90, processed in sold_at ASC order (tie-break: created_at ASC)."
    constants:
      BRACKET_1_MAX_DAYS: 30
      BRACKET_1_PCT: 1.00
      BRACKET_2_MAX_DAYS: 60
      BRACKET_2_PCT: 0.80
      BRACKET_3_MAX_DAYS: 90
      BRACKET_3_PCT: 0.50
    precision: "integer cents, round_half_up"

  - name: warranty_settlement_calculation
    trigger: "POST /warranty-claims/{id}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      # CREDIT variant (outcome == APPROVED_CREDIT):
      months_used = WarrantyClaim.months_in_service   # floor((filed_at - sold_at) days / 30)
      remaining_ratio = max(0, (WARRANTY_MONTHS - months_used) / WARRANTY_MONTHS)
      prorated = round_half_up(engine.sale_price_cents * remaining_ratio)
      settled_credit_cents = max(0, prorated - teardown_fee_cents)
      # Evaluation order is pinned: compute months_used first (from timestamps),
      # then the prorated amount, then subtract the fee, then floor at 0.
      # REPLACEMENT variant (outcome == APPROVED_REPLACEMENT):
      settled_credit_cents = 0   # no cash credit; a replacement unit is allocated instead
      # DENIED: settled_credit_cents = 0
    input_set: "The WarrantyClaim being adjudicated, its referenced RemanEngine (sale_price_cents, sold_at), and the teardown_fee_cents input on the adjudicate call. Claims on other engines are irrelevant."
    constants:
      WARRANTY_MONTHS: 12
      DAYS_PER_MONTH: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: credit
        when: "outcome == APPROVED_CREDIT"
        difference: "Prorated cash credit to Distributor.credit_balance_cents: sale_price_cents x remaining ratio minus teardown_fee_cents, floored at 0"
      - name: replacement
        when: "outcome == APPROVED_REPLACEMENT"
        difference: "Zero cash credit; instead a SEALED engine of the same build spec is allocated to the claimant at sale_price_cents = 0 — the two variants settle the identical claim with different economic results"

  - name: engine_sale_pricing
    trigger: "POST /reman-engines/sell"
    algorithm: tiered_pricing
    formula: |
      # Single-unit pricing with pinned rounding:
      sale_price_cents = round_half_up(spec.list_price_cents * (1 - Distributor.volume_discount_pct))
      # The deposit is NOT part of the price: a CoreDeposit of
      # spec.core_deposit_cents is created separately in HELD status.
      # Warranty replacement sales bypass this rule: sale_price_cents = 0.
    input_set: "The selected RemanEngine's BuildSpec (list_price_cents) and the buyer Distributor (volume_discount_pct)."
    constants: {}
    precision: "integer cents, round_half_up applied once after the discount multiplication"

  - name: distributor_ledger_reconciliation
    trigger: "Recomputed on every mutation that touches a distributor's ledger: sale, deposit close, grading credit, dispute, re-grade, adjudication"
    algorithm: aggregation
    formula: |
      Distributor.deposits_held_cents = sum(d.amount_cents for d in CoreDeposit
          where d.distributor_id == Distributor.id and d.status == HELD)
      Distributor.credit_balance_cents is an append-only signed accumulator:
          +CoreReturn.final_credit_cents        on grading (RECEIVED->GRADED)
          -old_final + new_final                on re-grade (DISPUTED->GRADED nets to the delta)
          -CoreReturn.final_credit_cents        on dispute (GRADED->DISPUTED)
          +CoreDeposit.refunded_cents           on deposit close with refund
          +WarrantyClaim.settled_credit_cents   on APPROVED_CREDIT adjudication
      # Both fields are recomputed/derived so that they always equal the sums
      # above over the full history — no drift after cascades or compensations.
    input_set: "All CoreDeposit rows of the distributor with status HELD (deposits_held); all ledger-impacting events listed above (credit_balance). Closed/forfeited deposits are excluded from deposits_held."
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body is well-formed: all required fields present, no undeclared fields, enums in declared sets, types correct, numeric ranges respected, scheduled_end strictly after scheduled_start, ended_at strictly after started_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-template ids exist, validated left-to-right; then body-referenced ids exist (component_id, build_spec_id, core_deposit_id, reman_engine_id, distributor_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Ownership: a Distributor-role caller may act only on its own resources (CoreReturn.distributor_id == caller; WarrantyClaim.distributor_id == caller; POST /reman-engines/sell acts on the caller's own ledger)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /core-returns, POST /core-returns/{id}/respond, POST /warranty-claims, POST /reman-engines/sell"
  - priority: 6
    category: state
    check: "Target entity is in the required from-state for the requested transition (per §1.2); also terminal-state lockdown"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Distributor.status must be ACTIVE (not CREDIT_HOLD) to buy an engine"
    error_id: ERR_DISTRIBUTOR_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /reman-engines/sell"
  - priority: 8
    category: state
    check: "BuildSpec must be ACTIVE at work-order creation"
    error_id: ERR_SPEC_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 9
    category: state
    check: "Source CoreReturn must be GRADED or CLOSED with grade != REJECT at work-order creation"
    error_id: ERR_CORE_RETURN_NOT_GRADED
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 10
    category: business_referential
    check: "Linked core_deposit_id refers to a HELD deposit owned by the returning distributor"
    error_id: ERR_DEPOSIT_NOT_LINKABLE
    http_status: 422
    applies_to: "POST /core-returns"
  - priority: 11
    category: business_safety
    check: "Component quarantine gate: consuming a Component with status QUARANTINED is forbidden (distinct from other non-AVAILABLE statuses, which are ERR_INVALID_STATE at priority 6)"
    error_id: ERR_COMPONENT_QUARANTINED
    http_status: 422
    applies_to: "POST /work-orders/{id}/consume"
  - priority: 12
    category: business_safety
    check: "Emissions compliance gate: a Distributor with emissions_requirement == CALIFORNIA may only be sold engines whose BuildSpec.emissions_tier == CALIFORNIA"
    error_id: ERR_EMISSIONS_TIER_MISMATCH
    http_status: 422
    applies_to: "POST /reman-engines/sell"
  - priority: 13
    category: business_safety
    check: "Seal quality gate (doubles as the seal state gate): RemanEngine.latest_dyno_result must == PASS, equivalently engine status == DYNO_PASSED; any seal attempt otherwise yields ERR_DYNO_NOT_PASSED"
    error_id: ERR_DYNO_NOT_PASSED
    http_status: 422
    applies_to: "POST /reman-engines/{id}/seal"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: the QualityInspector sealing an engine must not be the ShopTechnician (by X-User-ID) who recorded its most recent DynoTest"
    error_id: ERR_SEALER_IS_TESTER
    http_status: 403
    applies_to: "POST /reman-engines/{id}/seal"
  - priority: 15
    category: business_safety
    check: "Segregation of duties: the WarrantyAdjuster adjudicating a claim must not be the ShopTechnician (by X-User-ID) who performed its teardown"
    error_id: ERR_ADJUDICATOR_IS_TEARDOWN_TECH
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/adjudicate"
  - priority: 16
    category: business_temporal
    check: "Warranty window: a claim may be filed only while floor((now - engine.sold_at)/86400) < 360 days (12 months x 30 days)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 17
    category: business_temporal
    check: "Station occupation overlap (half-open intervals, adjacency allowed): no other MachineOperation on the same station_code may hold a stored window overlapping [scheduled_start, scheduled_end)"
    error_id: ERR_STATION_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /operations/{id}/perform"
  - priority: 18
    category: business_temporal
    check: "Dyno cell overlap with cooldown buffer: each DynoTest occupies [started_at, ended_at + 30 minutes); a new test on the same dyno_cell_code conflicts when the buffer-extended intervals intersect (a new test starting exactly at a prior test's ended_at still conflicts)"
    error_id: ERR_DYNO_CELL_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /reman-engines/{id}/dyno-tests"
  - priority: 19
    category: business_constraint
    check: "Route order: an operation may be performed only when every same-work-order operation with smaller sequence is COMPLETED; advancing to ASSEMBLY requires all operations COMPLETED"
    error_id: ERR_ROUTE_SEQUENCE_VIOLATION
    http_status: 422
    applies_to: "POST /operations/{id}/perform"
  - priority: 20
    category: business_constraint
    check: "Advancing a work order to ASSEMBLY requires every MachineOperation COMPLETED"
    error_id: ERR_OPERATIONS_INCOMPLETE
    http_status: 422
    applies_to: "POST /work-orders/{id}/advance"
  - priority: 21
    category: business_constraint
    check: "Selector pool non-empty: at least one RemanEngine with status SEALED and the requested build_spec_id (sell), or matching the claim's build_spec_id (replacement)"
    error_id: ERR_NO_ELIGIBLE_ENGINE
    http_status: 422
    applies_to: "POST /reman-engines/sell, POST /warranty-claims/{id}/adjudicate"
  - priority: 22
    category: business_referential
    check: "Component reuse gate: Component.reuse_grade is non-null and a member of the spec's allowed_reuse_grades"
    error_id: ERR_REUSE_GRADE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /work-orders/{id}/consume"
  - priority: 23
    category: business_referential
    check: "Component interchange gate: Component.interchange_group is a member of the spec's allowed_interchange_groups"
    error_id: ERR_INTERCHANGE_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /work-orders/{id}/consume"
  - priority: 24
    category: business_fiscal
    check: "Credit-limit gate: Distributor.deposits_held_cents + spec.core_deposit_cents <= Distributor.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /reman-engines/sell"
  - priority: 25
    category: state
    check: "Optimistic concurrency: expected_distributor_version / expected_work_order_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reman-engines/sell, POST /work-orders/{id}/operations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Distributors ----
  - method: POST
    path: "/distributors"
    description: "Register a distributor account"
    roles: [PlantAdmin]
    code: 201
    input: [distributor_code, name, emissions_requirement, credit_limit_cents, volume_discount_pct]
    output: Distributor
    side_effects: ["Distributor created with status ACTIVE, deposits_held_cents=0, credit_balance_cents=0, version=1"]
  - method: GET
    path: "/distributors/{id}"
    description: "Read one distributor including computed ledger fields"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: PATCH
    path: "/distributors/{id}"
    description: "Update credit_limit_cents, volume_discount_pct, and/or status (ACTIVE <-> CREDIT_HOLD)"
    roles: [PlantAdmin]
    code: 200
    input: ["credit_limit_cents?", "volume_discount_pct?", "status?"]
    output: Distributor
    side_effects: ["Increments Distributor.version by 1"]
  # ---- Core returns & deposits ----
  - method: POST
    path: "/core-returns"
    description: "Register a returned core; computes provisional_credit_cents (provisional variant of core_credit_calculation)"
    roles: [Distributor]
    code: 201
    input: [distributor_id, build_spec_id, "core_deposit_id?"]
    output: CoreReturn
    side_effects: ["Sets provisional_credit_cents from the referenced BuildSpec.core_base_credit_cents"]
  - method: GET
    path: "/core-returns"
    description: "List core returns with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["distributor_id?", "build_spec_id?", "core_deposit_id?", "status?", "limit?", "offset?"]
    output: CoreReturn[]
    side_effects: []
  - method: GET
    path: "/core-returns/{id}"
    description: "Read one core return"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: CoreReturn
    side_effects: []
  - method: POST
    path: "/core-returns/{id}/grade"
    description: "Grade a received (or disputed) core; computes final credit and closes any linked deposit with the aging-bracket refund"
    roles: [CoreInspector]
    code: 200
    input: [grade, missing_components]
    output: CoreReturn
    side_effects:
      - "CoreReturn RECEIVED->GRADED or DISPUTED->GRADED; sets grade, missing_components, graded_at, final_credit_cents"
      - "Distributor.credit_balance_cents updated per distributor_ledger_reconciliation"
      - "If core_deposit_id non-null: linked CoreDeposit HELD->CLOSED_REFUNDED or FORFEITED per deposit_refund_calculation; Distributor.deposits_held_cents -= amount_cents; credit_balance_cents += refunded_cents"
  - method: POST
    path: "/core-returns/{id}/respond"
    description: "Distributor accepts (GRADED->CLOSED) or disputes (GRADED->DISPUTED) the grading"
    roles: [Distributor]
    code: 200
    input: [action]
    output: CoreReturn
    side_effects: ["action=ACCEPT: GRADED->CLOSED; action=DISPUTE: GRADED->DISPUTED, dispute_count += 1, credit_balance_cents -= final_credit_cents"]
  - method: GET
    path: "/core-deposits"
    description: "List core deposits with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["distributor_id?", "reman_engine_id?", "status?", "limit?", "offset?"]
    output: CoreDeposit[]
    side_effects: []
  - method: GET
    path: "/core-deposits/{id}"
    description: "Read one core deposit"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: CoreDeposit
    side_effects: []
  # ---- Build specs ----
  - method: POST
    path: "/build-specs"
    description: "Create a build specification (status DRAFT)"
    roles: [PlantAdmin]
    code: 201
    input: [engine_family, application_code, emissions_tier, list_price_cents, core_deposit_cents, core_base_credit_cents, allowed_reuse_grades, allowed_interchange_groups, dyno_min_horsepower, dyno_min_oil_pressure_psi, dyno_max_coolant_temp_f, required_op_sequence]
    output: BuildSpec
    side_effects: []
  - method: GET
    path: "/build-specs"
    description: "List build specs with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["engine_family?", "application_code?", "emissions_tier?", "status?", "limit?", "offset?"]
    output: BuildSpec[]
    side_effects: []
  - method: GET
    path: "/build-specs/{id}"
    description: "Read one build spec"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: BuildSpec
    side_effects: []
  - method: POST
    path: "/build-specs/{id}/activate"
    description: "Activate a DRAFT spec; retires any other ACTIVE spec with the same (engine_family, application_code, emissions_tier)"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: BuildSpec
    side_effects: ["DRAFT->ACTIVE; supersede cascade retires sibling ACTIVE specs with the same key"]
  - method: POST
    path: "/build-specs/{id}/retire"
    description: "Retire an ACTIVE spec; blocked while open work orders reference it"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: BuildSpec
    side_effects: ["ACTIVE->RETIRED"]
  # ---- Work orders, route, components ----
  - method: POST
    path: "/work-orders"
    description: "Open a remanufacturing work order from a graded, rebuildable core return; build_spec_id is copied from the return"
    roles: [PlantAdmin]
    code: 201
    input: [core_return_id]
    output: RemanWorkOrder
    side_effects: ["RemanWorkOrder created QUEUED; build_spec_id copied from the CoreReturn"]
  - method: GET
    path: "/work-orders"
    description: "List work orders with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["core_return_id?", "build_spec_id?", "reman_engine_id?", "status?", "limit?", "offset?"]
    output: RemanWorkOrder[]
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Read one work order"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: RemanWorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/advance"
    description: "Advance the pipeline to the named target state; target=MACHINING from DYNO_TEST is the rework loop (requires latest dyno FAIL)"
    roles: [ShopTechnician]
    code: 200
    input: [target]
    output: RemanWorkOrder
    side_effects:
      - "Per §1.2: forward moves QUEUED->TEARDOWN->MACHINING->ASSEMBLY->DYNO_TEST; ASSEMBLY entry creates the RemanEngine once (status BUILT, serial minted)"
      - "Rework DYNO_TEST->MACHINING: rework_count += 1; FAILED MachineOperations reset to PENDING with windows cleared"
      - "Increments version by 1"
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a work order from QUEUED, TEARDOWN, or MACHINING; releases consumed components back to AVAILABLE"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: RemanWorkOrder
    side_effects: ["Components with consumed_by_work_order_id == this id transition CONSUMED->AVAILABLE; version += 1"]
  - method: POST
    path: "/work-orders/{id}/operations"
    description: "Declare a machining operation on the route (OCC-guarded on the work order version). Allowed only while the work order is QUEUED, TEARDOWN, or MACHINING (else ERR_INVALID_STATE). sequence must equal the 1-based position of op_type in the spec's required_op_sequence (else ERR_VALIDATION)"
    roles: [ShopTechnician]
    code: 201
    input: [op_type, sequence, expected_work_order_version]
    output: MachineOperation
    side_effects: ["MachineOperation created PENDING; increments RemanWorkOrder.version by 1"]
  - method: GET
    path: "/work-orders/{id}/operations"
    description: "List the work order's machining operations"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MachineOperation[]
    side_effects: []
  - method: POST
    path: "/operations/{id}/perform"
    description: "Perform (or re-perform after FAIL) a machining operation: records station window and result; enforces route order and station overlap"
    roles: [ShopTechnician]
    code: 200
    input: [station_code, scheduled_start, scheduled_end, result]
    output: MachineOperation
    side_effects: ["PENDING->COMPLETED/FAILED or FAILED->COMPLETED/FAILED; stores station window; attempt_count += 1"]
  - method: POST
    path: "/work-orders/{id}/components"
    description: "Salvage a component from teardown (work order must be in TEARDOWN)"
    roles: [ShopTechnician]
    code: 201
    input: [part_type, interchange_group]
    output: Component
    side_effects: ["Component created AVAILABLE with reuse_grade null"]
  - method: GET
    path: "/work-orders/{id}/components"
    description: "List components salvaged by a work order's teardown"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["status?", "part_type?", "limit?", "offset?"]
    output: Component[]
    side_effects: []
  - method: GET
    path: "/components/{id}"
    description: "Read one component"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: Component
    side_effects: []
  - method: POST
    path: "/components/{id}/inspect"
    description: "Inspect a component: set reuse_grade; quarantine flag moves AVAILABLE<->QUARANTINED; reuse_grade=SCRAP scraps the component"
    roles: [QualityInspector]
    code: 200
    input: [reuse_grade, quarantine]
    output: Component
    side_effects: ["Per §1.2 Component transitions: AVAILABLE->QUARANTINED / QUARANTINED->AVAILABLE / grade set / ->SCRAPPED"]
  - method: POST
    path: "/work-orders/{id}/consume"
    description: "Consume a reusable component into the assembly (work order must be in ASSEMBLY)"
    roles: [ShopTechnician]
    code: 200
    input: [component_id]
    output: Component
    side_effects: ["Component AVAILABLE->CONSUMED with consumed_by_work_order_id set"]
  # ---- Engines, dyno, seal, sale ----
  - method: GET
    path: "/reman-engines"
    description: "List remanufactured engines with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["work_order_id?", "build_spec_id?", "distributor_id?", "status?", "limit?", "offset?"]
    output: RemanEngine[]
    side_effects: []
  - method: GET
    path: "/reman-engines/{id}"
    description: "Read one engine (sealed unit record)"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: RemanEngine
    side_effects: []
  - method: POST
    path: "/reman-engines/{id}/dyno-tests"
    description: "Record a dyno test; result computed from the build spec thresholds; enforces dyno-cell buffer overlap. Requires engine status BUILT and the parent work order in DYNO_TEST (else ERR_INVALID_STATE)"
    roles: [ShopTechnician]
    code: 201
    input: [dyno_cell_code, started_at, ended_at, horsepower, oil_pressure_psi, coolant_temp_f]
    output: DynoTest
    side_effects: ["Sets engine latest_dyno_result; PASS moves engine BUILT->DYNO_PASSED; FAIL leaves engine BUILT"]
  - method: GET
    path: "/reman-engines/{id}/dyno-tests"
    description: "List an engine's dyno tests (immutable records)"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["limit?", "offset?"]
    output: DynoTest[]
    side_effects: []
  - method: POST
    path: "/reman-engines/{id}/seal"
    description: "Quality seal of a dyno-passed engine; sealer must differ from the latest dyno recorder; seals the unit record and closes the work order. State gate: engine status must be DYNO_PASSED — because DYNO_PASSED is reachable only via a PASS dyno, any seal attempt on a non-DYNO_PASSED engine (BUILT, no test, or latest FAIL) is reported as ERR_DYNO_NOT_PASSED (not ERR_INVALID_STATE)"
    roles: [QualityInspector]
    code: 200
    input: []
    output: RemanEngine
    side_effects: ["Engine DYNO_PASSED->SEALED with sealed_at/sealed_by; parent RemanWorkOrder DYNO_TEST->CLOSED"]
  - method: POST
    path: "/reman-engines/sell"
    description: "Distributor purchase with server-side allocation: selects the oldest-sealed SEALED engine of the requested spec (sealed_at ASC, tie-break created_at ASC); OCC-guarded on the distributor version"
    roles: [Distributor]
    code: 200
    input: [build_spec_id, expected_distributor_version]
    output: RemanEngine
    side_effects:
      - "Engine SEALED->SOLD: distributor_id, sold_at, sale_price_cents per engine_sale_pricing"
      - "Creates CoreDeposit HELD (amount = spec.core_deposit_cents)"
      - "Distributor.deposits_held_cents += amount_cents; Distributor.version += 1"
  # ---- Warranty ----
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim on an engine SOLD to the filing distributor, inside the 360-day warranty window"
    roles: [Distributor]
    code: 201
    input: [reman_engine_id, distributor_id, failure_description]
    output: WarrantyClaim
    side_effects: ["Claim created OPEN with filed_at from the logical clock; months_in_service computed"]
  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims with filters and pagination"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: ["distributor_id?", "reman_engine_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read one warranty claim"
    roles: [PlantAdmin, CoreInspector, ShopTechnician, QualityInspector, WarrantyAdjuster, Distributor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/teardown"
    description: "Record failure-teardown findings; flips the engine SOLD->RETURNED"
    roles: [ShopTechnician]
    code: 200
    input: [teardown_findings]
    output: WarrantyClaim
    side_effects: ["Claim OPEN->TEARDOWN_COMPLETE with teardown_by; engine SOLD->RETURNED"]
  - method: POST
    path: "/warranty-claims/{id}/adjudicate"
    description: "Adjudicate after teardown; SoD vs teardown technician; APPROVED_REPLACEMENT allocates a sealed replacement engine and creates a new core deposit"
    roles: [WarrantyAdjuster]
    code: 200
    input: [outcome, teardown_fee_cents]
    output: WarrantyClaim
    side_effects:
      - "APPROVED_CREDIT: settled_credit_cents per warranty_settlement_calculation; Distributor.credit_balance_cents += settled_credit_cents; failed engine RETURNED->SCRAPPED"
      - "APPROVED_REPLACEMENT: settled_credit_cents=0; selected SEALED engine -> SOLD to claimant at sale_price_cents=0; new CoreDeposit HELD created; Distributor.deposits_held_cents += amount_cents and version += 1; failed engine RETURNED->SCRAPPED"
      - "DENIED: settled_credit_cents=0; failed engine RETURNED->SCRAPPED"
  # ---- Ops run & clock ----
  - method: POST
    path: "/aging-runs"
    description: "Ops-run checkpoint: sweeps every HELD CoreDeposit older than 90 days into FORFEITED (sold_at ASC, tie-break created_at ASC) and updates distributor ledgers"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: "{ forfeited_count: integer, forfeited_deposit_ids: string[] }"
    side_effects: ["Each swept deposit HELD->FORFEITED; Distributor.deposits_held_cents -= amount_cents per deposit"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Before any call, the server clock reads exactly 2026-08-01T00:00:00Z (startup default; never falls back to wall-clock). This call sets the current logical time; all graded_at/sold_at/filed_at/sealed_at stamps and aging math read this clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Sets the logical clock used by all timestamp stamps and aging calculations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers, or undeclared role value" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown enum value, type/range violation, or end timestamp not strictly after start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist (path validated left-to-right)" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Distributor-role caller references a distributor_id / resource owned by a different distributor" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a from-state allowed for the requested transition, or transition from a terminal state" }
  - { id: ERR_DISTRIBUTOR_CREDIT_HOLD, http: 409, condition: "Sell attempted while the buyer Distributor.status == CREDIT_HOLD" }
  - { id: ERR_SPEC_NOT_ACTIVE, http: 409, condition: "Work-order creation references a BuildSpec whose status != ACTIVE" }
  - { id: ERR_CORE_RETURN_NOT_GRADED, http: 409, condition: "Work-order creation references a CoreReturn that is not yet GRADED/CLOSED, or was graded REJECT" }
  - { id: ERR_DEPOSIT_NOT_LINKABLE, http: 422, condition: "core_deposit_id is not a HELD deposit owned by the returning distributor" }
  - { id: ERR_COMPONENT_QUARANTINED, http: 422, condition: "Consume attempted on a Component with status QUARANTINED" }
  - { id: ERR_EMISSIONS_TIER_MISMATCH, http: 422, condition: "CALIFORNIA-requirement distributor attempted to buy a FEDERAL-tier engine" }
  - { id: ERR_DYNO_NOT_PASSED, http: 422, condition: "Seal attempted while latest_dyno_result != PASS" }
  - { id: ERR_SEALER_IS_TESTER, http: 403, condition: "Sealing QualityInspector's X-User-ID equals the most recent DynoTest recorded_by" }
  - { id: ERR_ADJUDICATOR_IS_TEARDOWN_TECH, http: 403, condition: "Adjudicating WarrantyAdjuster's X-User-ID equals the claim's teardown_by" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim filed at or after 360 days (12 x 30-day months) since engine sold_at" }
  - { id: ERR_STATION_SCHEDULE_OVERLAP, http: 409, condition: "Half-open window overlap with another MachineOperation on the same station_code" }
  - { id: ERR_DYNO_CELL_SCHEDULE_OVERLAP, http: 409, condition: "Buffer-extended ([start, end+30min)) overlap with another DynoTest on the same dyno_cell_code" }
  - { id: ERR_ROUTE_SEQUENCE_VIOLATION, http: 422, condition: "Performing an operation while a smaller-sequence operation of the same work order is not COMPLETED" }
  - { id: ERR_OPERATIONS_INCOMPLETE, http: 422, condition: "Advancing to ASSEMBLY while any MachineOperation is not COMPLETED" }
  - { id: ERR_NO_ELIGIBLE_ENGINE, http: 422, condition: "Selector pool empty: no SEALED RemanEngine of the requested build_spec_id (sell) or claim spec (replacement)" }
  - { id: ERR_REUSE_GRADE_INSUFFICIENT, http: 422, condition: "Component.reuse_grade null or not in the spec's allowed_reuse_grades" }
  - { id: ERR_INTERCHANGE_INCOMPATIBLE, http: 422, condition: "Component.interchange_group not in the spec's allowed_interchange_groups" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "deposits_held_cents + new deposit would exceed Distributor.credit_limit_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator: configures distributors, build specs, pricing; runs aging sweeps; controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /distributors"
      - "PATCH /distributors/{id}"
      - "POST /build-specs, POST /build-specs/{id}/activate, POST /build-specs/{id}/retire"
      - "POST /work-orders, POST /work-orders/{id}/cancel"
      - "POST /aging-runs"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: CoreInspector
    description: "Core receiving inspector: grades returned cores"
    identity: opaque
    exclusive_operations:
      - "POST /core-returns/{id}/grade"
    shared_operations: ["All GET endpoints"]
  - name: ShopTechnician
    description: "Shop floor technician: advances work orders, declares and performs machining operations, salvages and consumes components, records dyno tests, performs warranty teardowns"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/advance"
      - "POST /work-orders/{id}/operations"
      - "POST /operations/{id}/perform"
      - "POST /work-orders/{id}/components"
      - "POST /work-orders/{id}/consume"
      - "POST /reman-engines/{id}/dyno-tests"
      - "POST /warranty-claims/{id}/teardown"
    shared_operations: ["All GET endpoints"]
  - name: QualityInspector
    description: "Quality inspector: inspects/quarantines components and seals dyno-passed engines (segregated from dyno recording)"
    identity: opaque
    exclusive_operations:
      - "POST /components/{id}/inspect"
      - "POST /reman-engines/{id}/seal"
    shared_operations: ["All GET endpoints"]
  - name: Distributor
    description: "External distributor account: returns cores, responds to grading, buys engines, files warranty claims"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /core-returns"
      - "POST /core-returns/{id}/respond"
      - "POST /reman-engines/sell"
      - "POST /warranty-claims"
    shared_operations: ["All GET endpoints"]
  - name: WarrantyAdjuster
    description: "Warranty adjuster: adjudicates torn-down claims (segregated from teardown)"
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims/{id}/adjudicate"
    shared_operations: ["All GET endpoints"]



