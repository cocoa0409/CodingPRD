# =============================================================================
# Task 0104 — Scaffold Difficulty Design (Test Targeting Index, §1.8)
# Every instance grounds in §1.1–§1.7 of SCAFFOLD.yaml; ≥2 instances per rule_id.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains (≥ 2)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: usda_reimbursement_provisional_vs_final_on_claim
        grounds:
          - calculations.usda_reimbursement_provisional
          - calculations.usda_reimbursement_final
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_FINALIZED
          - state_machines.MealServingRecord.(none)_to_SERVED
        distinguishing_aspect: |
          Operates on the UsdaReimbursementClaim domain. Provisional reimbursement is stamped row-by-row at SERVED
          time using MealServingRecord.tier_at_serving; final reimbursement is recomputed chronologically at
          FINALIZED time using Student.eligibility_tier AT finalize time, producing a different total whenever
          a student's tier changed between SERVED and FINALIZED.
        test_recipe:
          setup:
            - "Create District D and ParentAccount P (PAID by default)"
            - "Create Student S linked to P (eligibility_tier=PAID, no application)"
            - "Create MenuItem M with reimbursable=true, full_price_cents=350, contains_allergens=[]"
            - "Top up P by 2000 cents so S can be served PAID"
          trigger:
            - "POST /meal-servings (S,M) on 3 consecutive days using POST /_clock/advance between each (each row tier_at_serving=PAID, provisional=50)"
            - "Parent submits & DistrictReviewer approves an FrlApplication for S with household_size=4 and income=2,000,000 cents → decided_tier=FREE; S.eligibility_tier flips to FREE"
            - "AuditOfficer POST /usda-claims (period covering all 3 servings) → DRAFT, POST /submit, POST /finalize"
          assert:
            - "UsdaReimbursementClaim.provisional_total_cents == 150"
            - "UsdaReimbursementClaim.final_reimbursement_cents == 1440"
            - "UsdaReimbursementClaim.provisional_total_cents != UsdaReimbursementClaim.final_reimbursement_cents"

      - name: parent_account_top_up_balance_two_orderings
        grounds:
          - calculations.parent_balance_waterfall
          - entities.PaidLedgerEntry.fields.occurred_at
          - entities.PaidLedgerEntry.fields.type
          - state_machines.MealServingRecord.(none)_to_SERVED
        distinguishing_aspect: |
          Operates on the ParentAccount domain (different entity from Rule 1's first instance which is on
          UsdaReimbursementClaim). Two reading algorithms — naive sum-by-type vs ordered-replay by occurred_at
          ASC with id tie-break — produce different balances when entries are inserted out of natural order
          (e.g., a REFUND inserted before its CHARGE in a replay window). The scaffold pins the ordered-replay
          variant; the naive variant would accept a CHARGE that the ordered variant rejects.
        test_recipe:
          setup:
            - "Create District D, ParentAccount P with prepaid_balance_cents=0"
            - "Create Student S (PAID), MenuItem M1 full_price=400 and MenuItem M2 full_price=700"
          trigger:
            - "POST /parent-accounts/{P}/top-up amount_cents=500"
            - "POST /parent-accounts/{P}/top-up amount_cents=300"
            - "POST /meal-servings (S, M1)  — charges 400"
            - "Naive-sum variant would compute balance=800 and allow a second 700-cent serving; ordered-replay variant computes 500+300-400=400 and rejects the 700-cent serving"
            - "POST /meal-servings (S, M2)  — attempt; expect rejection"
          assert:
            - "ParentAccount.prepaid_balance_cents == 400 after the first CHARGE"
            - "Second POST /meal-servings returns 409 ERR_PREPAID_BALANCE_INSUFFICIENT"
            - "ParentAccount.prepaid_balance_cents == 400 (unchanged by failed serving)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (≥ 2, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: frl_tier_threshold_with_nested_branches
        grounds:
          - calculations.frl_tier_classification
          - state_machines.FrlApplication.SUBMITTED_to_APPROVED
          - entities.FrlApplication.fields.household_size
          - entities.FrlApplication.fields.declared_annual_income_cents
        distinguishing_aspect: |
          Mode (a) — three inputs (declared_annual_income_cents, household_size, FEDERAL_POVERTY_GUIDELINE_BY_SIZE
          lookup) with non-linear interaction: a tiered-rate selection nested inside a per-household-size table.
          The output enum (FREE / REDUCED / DENIED_PAID) is not a linear function of any single input.
        test_recipe:
          setup:
            - "Create District D and ParentAccount P; create Student S"
            - "Parent creates FrlApplication A1 (S, household_size=4, declared_annual_income_cents=2_000_000)"
            - "Parent creates FrlApplication A2 (S, household_size=4, declared_annual_income_cents=5_000_000)"
          trigger:
            - "POST /frl-applications/{A1}/submit then DistrictReviewer POST /approve"
            - "POST /frl-applications/{A2}/submit then DistrictReviewer POST /approve"
          assert:
            - "A1.decided_tier == 'FREE' (ratio 2_000_000/3_090_000 = 0.647 <= 1.30)"
            - "A2.decided_tier == 'REDUCED' (ratio 1.618 in (1.30, 1.85])"

      - name: usda_reimbursement_final_chronological_order_pinning
        grounds:
          - calculations.usda_reimbursement_final
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_FINALIZED
          - entities.UsdaReimbursementClaim.fields.serving_record_ids
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation order. final_reimbursement_cents
          depends on a sort of serving_record_ids by (created_at ASC, id ASC), with per-row re-resolution of
          tier_at_finalize from Student.eligibility_tier. Two equally valid prose readings ("sum then snapshot"
          vs "snapshot per row then sum") yield different totals; the scaffold pins the per-row snapshot path.
          This is structurally distinct from instance 1 (mode (a) tiered branches), satisfying the
          different-modes clause.
        test_recipe:
          setup:
            - "Create District D, ParentAccount P, Student S (PAID)"
            - "Create MenuItem M (reimbursable=true, full_price=350, no allergens)"
            - "Top up P by 2000"
          trigger:
            - "POST /meal-servings (S,M) at clock T1 (provisional=50)"
            - "Approve FrlApplication moving S→REDUCED"
            - "POST /meal-servings (S,M) at clock T2 (provisional=420)"
            - "Approve a NEW FrlApplication that overrides to FREE"
            - "POST /meal-servings (S,M) at clock T3 (provisional=480)"
            - "AuditOfficer creates claim covering all 3 days, submit, finalize"
          assert:
            - "Provisional sum == 50 + 420 + 480 == 950"
            - "Final sum == 480 + 480 + 480 == 1440 (because eligibility_tier at FINALIZE is FREE for all rows)"
            - "claim.serving_record_ids ordered by created_at ASC matches T1, T2, T3 insertion order"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities (≥ 2)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: frl_application_cycle_submitted_info_requested_submitted
        grounds:
          - state_machines.FrlApplication.SUBMITTED_to_INFO_REQUESTED
          - state_machines.FrlApplication.INFO_REQUESTED_to_SUBMITTED
          - state_machines.FrlApplication.SUBMITTED_to_APPROVED
          - state_machines.FrlApplication.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          FrlApplication has a cycle SUBMITTED→INFO_REQUESTED→SUBMITTED (revision loop where the reviewer
          can request more info and the parent resubmits) AND a branching fork at SUBMITTED (approve OR
          deny). This is the FrlApplication entity (different from Rule 3 instance 2's entity).
        test_recipe:
          setup:
            - "Create District D, Parent, Student, FrlApplication A in DRAFT"
          trigger:
            - "POST /frl-applications/{A}/submit (DRAFT→SUBMITTED)"
            - "DistrictReviewer POST /request-info with review_note='need W-2'"
            - "Parent POST /resubmit with documents_attached_count=2"
            - "DistrictReviewer POST /approve"
          assert:
            - "After request-info: A.status == 'INFO_REQUESTED'"
            - "After resubmit: A.status == 'SUBMITTED'"
            - "After approve: A.status == 'APPROVED'"
            - "A.documents_attached_count == 2 (mutated during resubmit)"

      - name: usda_claim_branching_finalize_or_reject
        grounds:
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_FINALIZED
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          UsdaReimbursementClaim has a branching fork at SUBMITTED: an AuditOfficer can either FINALIZE (mints
          final_reimbursement_cents and credits the District) or REJECT (no cents minted). The two branches
          have divergent side effects (only one path mutates District.usda_reimbursement_total_cents). Different
          entity from instance 1 (UsdaReimbursementClaim vs FrlApplication).
        test_recipe:
          setup:
            - "Create District D, two claims C1 and C2 with non-overlapping periods, both submitted"
          trigger:
            - "POST /usda-claims/{C1}/finalize"
            - "POST /usda-claims/{C2}/reject"
          assert:
            - "C1.status == 'FINALIZED' and District.usda_reimbursement_total_cents > 0"
            - "C2.status == 'REJECTED' and District.usda_reimbursement_total_cents is unchanged by C2"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers (≥ 2; depths 3 & ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_application_cascades_through_eligibility_to_serving_to_claim
        grounds:
          - state_machines.FrlApplication.SUBMITTED_to_APPROVED
          - state_machines.MealServingRecord.(none)_to_SERVED
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_FINALIZED
          - calculations.usda_reimbursement_final
          - entities.Student.fields.eligibility_tier
        distinguishing_aspect: |
          Depth-3 chain originating at FrlApplication approval:
          (1) POST /approve mutates FrlApplication.status=APPROVED;
          (2) that mutation itself mutates Student.eligibility_tier (a different entity);
          (3) that mutation itself mutates a later POST /usda-claims/{C}/finalize's final_reimbursement_cents
              via usda_reimbursement_final's re-resolution against current Student.eligibility_tier.
          Each link is caused by the previous link, not by the original action — finalize is a separate API
          call whose computed output depends on the eligibility_tier that (2) wrote.
        test_recipe:
          setup:
            - "Setup as instance dual_variant_calc.usda_reimbursement_provisional_vs_final_on_claim above"
          trigger:
            - "Serve 3 meals while tier=PAID, then approve an FRL application moving S to FREE, then finalize a claim covering all 3"
          assert:
            - "FrlApplication.status == 'APPROVED' (link 1)"
            - "Student.eligibility_tier == 'FREE' (link 2, caused by link 1)"
            - "UsdaReimbursementClaim.final_reimbursement_cents == 1440, not 150 (link 3, caused by link 2)"

      - name: void_serving_cascades_refund_then_district_total_unaffected_after_finalize
        grounds:
          - state_machines.MealServingRecord.SERVED_to_VOIDED
          - calculations.parent_balance_waterfall
          - entities.PaidLedgerEntry.fields.type
          - entities.ParentAccount.fields.prepaid_balance_cents
        distinguishing_aspect: |
          Depth-2 chain originating at meal serving void (different trigger from instance 1, which originates
          at FRL approval):
          (1) POST /void mutates MealServingRecord.status=VOIDED;
          (2) that mutation itself causes a new PaidLedgerEntry(type=REFUND) row to be appended, which itself
              mutates ParentAccount.prepaid_balance_cents via parent_balance_waterfall replay.
          Link 2 is caused by link 1's state change, not by the void API call directly (the void endpoint
          does not write prepaid_balance_cents; the ledger appends do).
        test_recipe:
          setup:
            - "Create District, ParentAccount P (top up 1000), Student S (PAID), MenuItem M (full_price=350)"
            - "POST /meal-servings (S,M) — appends CHARGE 350; P.prepaid_balance_cents==650"
          trigger:
            - "POST /meal-servings/{R}/void"
          assert:
            - "MealServingRecord.status == 'VOIDED' (link 1)"
            - "A new PaidLedgerEntry exists with type='REFUND', amount_cents=350, serving_record_id=R (link 2 row created)"
            - "ParentAccount.prepaid_balance_cents == 1000 (link 2 effect: waterfall replay restores balance)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥ 2)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_invalid_state_wins_over_allergen
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.MealServingRecord.(none)_to_SERVED
        distinguishing_aspect: |
          Error-category pair: state vs business_safety. When a Student has an ACTIVE allergy that matches
          MenuItem.contains_allergens AND the MenuItem is in status=RETIRED (not ACTIVE — preconditions
          for SERVED require MenuItem.status=ACTIVE, so the state precondition fails), the state check
          (priority 4) MUST fire before the allergy check (priority 5). The test forces both failures and
          asserts ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Create District, Student S with ACTIVE allergy entry allergen=PEANUT"
            - "Create MenuItem M with contains_allergens=[PEANUT], status=ACTIVE"
            - "POST /menu-items/{M}/retire → M.status=RETIRED"
          trigger:
            - "POST /meal-servings (S, M)"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE' (NOT 'ERR_ALLERGEN_BLOCK')"

      - name: business_safety_vs_business_fiscal_allergen_wins_over_balance
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.MealServingRecord.(none)_to_SERVED
        distinguishing_aspect: |
          Different error-category pair from instance 1 (business_safety vs business_fiscal here, vs state
          vs business_safety there). A PAID-tier Student with insufficient prepaid balance AND an active
          allergy matching the menu item: priority 5 (ERR_ALLERGEN_BLOCK) wins over priority 11
          (ERR_PREPAID_BALANCE_INSUFFICIENT).
        test_recipe:
          setup:
            - "Create District, ParentAccount P (prepaid_balance_cents=0), Student S (PAID)"
            - "Create AllergyProfileEntry for S with allergen=DAIRY, severity=MODERATE, doctor_note_attached=false"
            - "Create MenuItem M with contains_allergens=[DAIRY], full_price_cents=350, status=ACTIVE"
          trigger:
            - "POST /meal-servings (S, M)"
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_ALLERGEN_BLOCK' (NOT 'ERR_PREPAID_BALANCE_INSUFFICIENT')"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥ 2)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: frl_tier_ratio_exactly_at_free_threshold
        grounds:
          - calculations.frl_tier_classification
          - state_machines.FrlApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Numeric threshold boundary on the FRL classification ratio (FREE band uses `<=` not `<`).
          With household_size=4 and FEDERAL_POVERTY_GUIDELINE_BY_SIZE[4]=3,090,000, declared_annual_income_cents
          = 4,017,000 gives ratio = exactly 1.30 → FREE; 4,017,001 → REDUCED. The endpoint is
          POST /frl-applications/{id}/approve.
        test_recipe:
          setup:
            - "Create District D, Parent, Student S"
            - "Create FrlApplication A1 with household_size=4 and declared_annual_income_cents=4,017,000"
            - "Create FrlApplication A2 with household_size=4 and declared_annual_income_cents=4,017,001 (different student S2 to avoid overlap)"
          trigger:
            - "POST /frl-applications/{A1}/submit, then DistrictReviewer POST /approve"
            - "POST /frl-applications/{A2}/submit, then DistrictReviewer POST /approve"
          assert:
            - "A1.decided_tier == 'FREE'"
            - "A2.decided_tier == 'REDUCED'"

      - name: high_sodium_flag_exactly_at_threshold_on_menu_item
        grounds:
          - calculations.meal_nutrition_label
          - endpoints[GET /districts/{district_id}/menu-items/{id}/nutrition-label]
        distinguishing_aspect: |
          Different metric (sodium_mg, an integer milligram count) and different endpoint
          (GET /menu-items/{id}/nutrition-label) from instance 1 (income ratio on /approve). The flag
          uses `>=` 600 — exactly 600 sets high_sodium_flag=true; 599 sets it false.
        test_recipe:
          setup:
            - "Create District D, MenuItem M1 with sodium_mg=600"
            - "Create MenuItem M2 with sodium_mg=599"
          trigger:
            - "GET /districts/{D}/menu-items/{M1}/nutrition-label"
            - "GET /districts/{D}/menu-items/{M2}/nutrition-label"
          assert:
            - "M1 response: high_sodium_flag == true"
            - "M2 response: high_sodium_flag == false"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥ 2)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: meal_serving_requires_menu_item_active_and_student_eligibility_state
        grounds:
          - state_machines.MealServingRecord.(none)_to_SERVED
          - entities.MenuItem.fields.status
          - entities.Student.fields.eligibility_tier
          - state_machines.MenuItem.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Entity pair: MealServingRecord vs MenuItem. MealServingRecord's (none)→SERVED transition is gated
          by MenuItem.status==ACTIVE — a state field on a different entity. Retiring the MenuItem makes
          subsequent SERVED transitions invalid even though MealServingRecord itself has no prior state.
        test_recipe:
          setup:
            - "Create District, Student S (FREE so balance is irrelevant), MenuItem M (status=ACTIVE)"
          trigger:
            - "POST /menu-items/{M}/retire → M.status='RETIRED'"
            - "POST /meal-servings (S, M)"
          assert:
            - "Final POST /meal-servings returns 409 ERR_INVALID_STATE"

      - name: usda_claim_finalize_requires_no_concurrent_overlapping_submitted
        grounds:
          - state_machines.UsdaReimbursementClaim.DRAFT_to_SUBMITTED
          - state_machines.UsdaReimbursementClaim.SUBMITTED_to_FINALIZED
          - validations[priority=9]
        distinguishing_aspect: |
          Different entity pair from instance 1 (UsdaReimbursementClaim vs UsdaReimbursementClaim — the
          claim's submission depends on the state of OTHER UsdaReimbursementClaim rows). A claim cannot
          enter SUBMITTED if another claim with overlapping period is already in {SUBMITTED, FINALIZED};
          this is a cross-row state dependency within the same entity type, structurally different from
          instance 1's MenuItem→MealServingRecord cross-entity dependency.
        test_recipe:
          setup:
            - "Create District D; submit claim C1 [2026-01-01..2026-01-31]"
          trigger:
            - "Create claim C2 [2026-01-15..2026-02-15] in DRAFT"
            - "POST /usda-claims/{C2}/submit"
          assert:
            - "C2 submit returns 409 ERR_CLAIM_PERIOD_OVERLAP"
            - "C1.status == 'SUBMITTED' (unchanged)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥ 2)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: usda_claim_period_overlap_closed_closed_inclusive_endpoints
        grounds:
          - validations[priority=9]
          - state_machines.UsdaReimbursementClaim.DRAFT_to_SUBMITTED
          - entities.UsdaReimbursementClaim.fields.period_start
          - entities.UsdaReimbursementClaim.fields.period_end
        distinguishing_aspect: |
          Interval semantics: CLOSED-CLOSED. Two claims whose endpoints exactly coincide (existing.period_end
          == new.period_start) overlap and the new one is rejected. Resource: UsdaReimbursementClaim
          (district-scoped).
        test_recipe:
          setup:
            - "Create District D"
            - "Create claim C1 period_start=2026-01-01, period_end=2026-01-15 and submit it"
            - "Create claim C2 period_start=2026-01-15, period_end=2026-01-31 in DRAFT"
          trigger:
            - "POST /usda-claims/{C2}/submit"
          assert:
            - "C2 submit returns 409 ERR_CLAIM_PERIOD_OVERLAP"

      - name: student_serving_per_day_uniqueness_point_in_time
        grounds:
          - validations[priority=8]
          - state_machines.MealServingRecord.(none)_to_SERVED
          - concurrency_rules[meal_serving]
          - entities.MealServingRecord.fields.serving_date
        distinguishing_aspect: |
          Different interval semantics: POINT-IN-TIME uniqueness on serving_date (a date, not a closed
          range). At most one SERVED MealServingRecord per (student_id, serving_date) — the "interval" is
          a single UTC date and the geometric treatment is exact equality of dates rather than range
          overlap. Different resource entity (MealServingRecord, student-scoped) from instance 1
          (UsdaReimbursementClaim, district-scoped).
        test_recipe:
          setup:
            - "Create District, Student S (FREE), MenuItem M1 and M2"
            - "POST /_clock/advance to 2026-03-10T12:00:00Z"
          trigger:
            - "POST /meal-servings (S, M1) (first SERVED on 2026-03-10)"
            - "POST /meal-servings (S, M2) (second attempt same date)"
          assert:
            - "First POST returns 201"
            - "Second POST returns 409 ERR_MEAL_ALREADY_SERVED_TODAY"
            - "Student.meals_served_today_count == 1"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥ 2)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_meal_preserves_parent_prepaid_balance
        grounds:
          - state_machines.MealServingRecord.(none)_to_SERVED
          - state_machines.MealServingRecord.SERVED_to_VOIDED
          - calculations.parent_balance_waterfall
          - entities.PaidLedgerEntry.fields.type
        distinguishing_aspect: |
          Conserved quantity: ParentAccount.prepaid_balance_cents. A PAID meal serving (CHARGE) followed
          by its VOID (REFUND) MUST leave ParentAccount.prepaid_balance_cents identical to its value
          before the serving:
              balance_after_void == balance_before_serving
              (sum of TOP_UP - sum of CHARGE + sum of REFUND, ordered replay)
        test_recipe:
          setup:
            - "Create District, ParentAccount P, top up 1000, Student S (PAID), MenuItem M (full_price=350)"
            - "Record initial balance b0 = 1000"
          trigger:
            - "POST /meal-servings (S, M) (CHARGE 350; balance becomes 650)"
            - "POST /meal-servings/{R}/void  (REFUND 350; balance returns)"
          assert:
            - "ParentAccount.prepaid_balance_cents after void == 1000"
            - "ParentAccount.prepaid_balance_cents after void == b0 (invariant preserved)"

      - name: void_meal_zeros_provisional_reimbursement_preserves_district_total
        grounds:
          - state_machines.MealServingRecord.SERVED_to_VOIDED
          - calculations.usda_reimbursement_provisional
          - calculations.usda_reimbursement_final
          - entities.District.fields.usda_reimbursement_total_cents
          - entities.MealServingRecord.fields.provisional_reimbursement_cents
        distinguishing_aspect: |
          Different conserved quantity from instance 1 (USDA reimbursement totals here, prepaid balance
          there). When a SERVED row is voided BEFORE any claim contains it, the invariant is:
              SUM(MealServingRecord.provisional_reimbursement_cents WHERE status=SERVED) is unchanged by the
              serve+void pair (because the void sets the voided row's provisional to 0 and the row is no
              longer counted), AND District.usda_reimbursement_total_cents (which is incremented only on
              FINALIZED claims) MUST equal the same value before serve and after void.
        test_recipe:
          setup:
            - "Create District D (usda_reimbursement_total_cents=0), ParentAccount, Student S (FREE), MenuItem M (reimbursable=true)"
            - "Record d0 = District.usda_reimbursement_total_cents = 0"
          trigger:
            - "POST /meal-servings (S, M) — SERVED, provisional_reimbursement_cents=480"
            - "POST /meal-servings/{R}/void — VOIDED, provisional_reimbursement_cents:=0"
          assert:
            - "MealServingRecord.provisional_reimbursement_cents == 0 after void"
            - "District.usda_reimbursement_total_cents == 0 (== d0, unchanged because no claim was finalized)"
            - "Sum over status=SERVED rows of provisional_reimbursement_cents == 0 (the voided row is excluded)"
