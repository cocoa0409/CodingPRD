  - rule_id: priority_pair_validation_conflict
    instances:
      - name: escheated_state_p11_beats_payout_minimum_p39
        grounds:
          - validations[priority 11]
          - validations[priority 39]
          - errors.ERR_CONSIGNOR_ESCHEATED
          - errors.ERR_PAYOUT_BELOW_MINIMUM
          - calculations.escheatment_dormancy
          - calculations.shrinkage_write_off
        conflicting_rules:
          higher: "priority 11, category state, ERR_CONSIGNOR_ESCHEATED, 409 - the consignor's escheat_state must not be ESCHEATED"
          lower: "priority 39, category business_fiscal, ERR_PAYOUT_BELOW_MINIMUM, 409 - unclaimed_balance_cents must be at least MIN_PAYOUT_CENTS (2000)"
        expected_error: ERR_CONSIGNOR_ESCHEATED
        distinguishing_aspect: |
          The category pair is state vs business_fiscal, and both guards sit on the same
          endpoint with the same 409 status, so the only way to tell a correct
          implementation from one that checks fiscal rules first is the error id. The
          fixture drives the balance to 701, which is simultaneously above zero (so the
          priority-38 ERR_INSUFFICIENT_BALANCE guard is satisfied and does not muddy the
          pair) and below 2000.
