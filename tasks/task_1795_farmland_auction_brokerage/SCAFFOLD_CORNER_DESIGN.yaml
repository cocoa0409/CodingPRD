      - name: increment_tier_boundary_crossing_500k
        claim_type: boundary_edge
        grounds:
          - "calculations.bid_increment_schedule"
        distinguishing_aspect: "Tier boundaries: high 499999.99 sits in the 2500 tier so exactly 502499.99 is accepted; once the high is 502499.99 (>= 500000) the increment becomes 5000 and 507499.98 is rejected — the tier is selected by the CURRENT high, straddling 500000."
        test_recipe:
          setup: ["WHOLE listing (T1 min 400000, reserve 770000; C1-only comps give provisional 900000, floor 765000 passes), ONLINE auction OPEN, buyers B1/B2 qualified"]
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
