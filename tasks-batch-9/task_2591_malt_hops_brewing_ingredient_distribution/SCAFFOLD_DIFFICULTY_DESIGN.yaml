            - "Order AT_MOQ with two 1000 lb malt lines, summing to exactly 2000 chargeable pounds."
            - "Order BELOW_MOQ with a 999 lb and a 1000 lb malt line, summing to 1999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
