  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (two different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: plan_lifetime_no_overlap_per_student
        grounds:
          - validations[priority=13]
          - errors[ERR_STUDENT_PLAN_ALREADY_OPEN]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN plan lifetime [creation, terminal-state).
          A second plan for the same student collides with an existing open plan
          (any status in {DRAFT, PENDING_PARENT_CONSENT, PENDING_TEACHER_ACK,
          ACTIVE, UNDER_ANNUAL_REVIEW}). Adjacency is permitted only when the
          first plan has reached a terminal state (TERMINATED/EXITED_TO_IEP).
          Resource: Student. Distinct interval semantics from the review-overlap
          instance below (which uses capacity-count semantics, not interval
          geometry).
