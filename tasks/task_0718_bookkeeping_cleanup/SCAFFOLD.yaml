# =============================================================================
# Bookkeeping Cleanup & Catch-Up — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Bookkeeping Cleanup & Catch-Up Project: scope & period/transaction-volume
  estimate, ledger reconstruction & categorization, bank/credit reconciliation,
  fixed-price/phase billing, books-to-tax handoff, ongoing-service conversion,
  exception/missing-doc tracking, completion report

domain_name: bookkeeping-cleanup
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # cash vs accrual taxable income; forward vs actual volume
    - cascading_side_effects          # finalize-recon -> account -> engagement readiness -> phase billable
    - derived_field_reconciliation    # engagement.readiness_score, recon_status derived from children
    - optimistic_concurrency          # OCC on Engagement.version for scope-baseline supersede

  entity_topology: flat
  # Peer entities linked by FK references (engagement_id, account_id, ...);
  # no deep nesting in URL paths beyond /engagements/{id}/<child-collection>.

  state_machine_shape: parallel
  # Engagement carries two independent dimensions: workflow_status (lifecycle)
  # × billing_status (fixed-price phase billing). Exception machine is cyclic
  # (OPEN -> WAITING_DOCS -> OPEN). Reconciliation machine is branching.

  relationship_patterns:
    - one_to_many        # Engagement -> LedgerAccount, LedgerEntry, Phase, Exception
    - cross_aggregate    # LedgerEntry references both LedgerAccount and ReconciliationItem
    - self_referential   # LedgerEntry.reversed_entry_id -> LedgerEntry.id (reversing entries)

  role_model: segregation_of_duties
  # The Bookkeeper who categorizes ledger entries cannot be the Reviewer who
  # signs off reconciliation; tax handoff requires a distinct TaxPreparer.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Client legal entity name" }
      - { name: entity_type, type: enum, source: input, description: "SOLE_PROP | PARTNERSHIP | S_CORP | C_CORP | LLC" }
      - { name: accounting_basis, type: enum, source: input, default: "ACCRUAL", description: "CASH | ACCRUAL — drives books-to-tax taxable-income variant" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED" }

  - name: CleanupEngagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: title, type: string, source: input, description: "Engagement title" }
      - { name: period_start, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive first day of cleanup period" }
      - { name: period_end, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive last day of cleanup period" }
      - { name: complexity_tier, type: enum, source: input, default: "MEDIUM", description: "LOW | MEDIUM | HIGH — multiplies the volume estimate" }
      - { name: workflow_status, type: enum, source: system, default: "DRAFT", description: "Lifecycle dimension: DRAFT | SCOPING | RECONSTRUCTION | RECONCILIATION | TAX_HANDOFF | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "Parallel billing dimension: UNBILLED | QUOTED | PHASED | SETTLED" }
      - { name: scope_locked, type: boolean, source: system, default: false, description: "True once a ScopeEstimate is accepted; gates phase creation" }
      - { name: estimated_txn_volume, type: integer, source: computed, description: "Copied from the accepted ScopeEstimate.txn_volume_estimate; 0 until scope accepted" }
      - { name: reconciled_account_count, type: integer, source: computed, description: "Count of child LedgerAccount in state RECONCILED" }
      - { name: total_account_count, type: integer, source: computed, description: "Count of child LedgerAccount not in state EXCLUDED" }
      - { name: open_blocking_exception_count, type: integer, source: computed, description: "Count of child Exception with severity BLOCKING and status not in {RESOLVED, WAIVED}" }
      - { name: readiness_score, type: integer, source: computed, description: "0..100 books-to-tax readiness; see calculations.readiness_score" }
      - { name: recon_status, type: enum, source: computed, description: "PENDING | IN_BALANCE | OUT_OF_BALANCE. OUT_OF_BALANCE if any BankStatement is in RECONCILING with a recorded out-of-balance UNRECONCILED_DIFF exception OPEN; PENDING if any is_bank_account LedgerAccount (status != EXCLUDED) has no RECONCILED BankStatement; otherwise IN_BALANCE (vacuously IN_BALANCE when there are no non-EXCLUDED bank accounts)" }

  - name: ScopeEstimate
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: monthly_txn_rate, type: integer, source: input, description: "Operator-declared average transactions per month for the period" }
      - { name: period_month_count, type: integer, source: computed, description: "Inclusive whole-month span between engagement.period_start and period_end" }
      - { name: txn_volume_estimate, type: integer, source: computed, description: "Forward-looking volume estimate; see calculations.scope_volume_estimate" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | ACCEPTED | SUPERSEDED" }

  - name: LedgerAccount
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: account_code, type: string, source: input, description: "Chart-of-accounts code, unique per engagement among non-EXCLUDED accounts" }
      - { name: name, type: string, source: input, description: "Account display name" }
      - { name: account_type, type: enum, source: input, description: "ASSET | LIABILITY | EQUITY | INCOME | EXPENSE" }
      - { name: normal_side, type: enum, source: computed, description: "DEBIT | CREDIT — derived from account_type (ASSET/EXPENSE=DEBIT, others=CREDIT)" }
      - { name: is_bank_account, type: boolean, source: input, default: false, description: "True for bank/credit-card accounts that require statement reconciliation" }
      - { name: book_balance_cents, type: integer, source: computed, description: "Signed running balance from POSTED LedgerEntry rows on this account" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CATEGORIZED | RECONCILED | EXCLUDED" }

  - name: LedgerEntry
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: account_id, type: string, source: input, description: "FK -> LedgerAccount.id" }
      - { name: txn_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), must fall within engagement period" }
      - { name: side, type: enum, source: input, description: "DEBIT | CREDIT" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude in cents" }
      - { name: memo, type: string, source: input, default: "", description: "Free-text description" }
      - { name: cash_settled, type: boolean, source: system, default: false, description: "True once linked via a ReconciliationItem matched to a bank statement line" }
      - { name: reconciliation_item_id, type: string, source: system, description: "FK -> ReconciliationItem.id; set when matched" }
      - { name: reversed_entry_id, type: string, source: input, description: "FK -> LedgerEntry.id; set on a reversing entry to point at the original" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | POSTED | REVERSED" }

  - name: BankStatement
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: account_id, type: string, source: input, description: "FK -> LedgerAccount.id; must be a bank account" }
      - { name: statement_start, type: string, source: input, description: "ISO date (YYYY-MM-DD) inclusive" }
      - { name: statement_end, type: string, source: input, description: "ISO date (YYYY-MM-DD) inclusive; must be >= statement_start" }
      - { name: ending_balance_cents, type: integer, source: input, description: "Signed bank-reported ending balance" }
      - { name: deposits_in_transit_cents, type: integer, source: input, default: 0, description: "Outstanding deposits not yet on the statement" }
      - { name: outstanding_checks_cents, type: integer, source: input, default: 0, description: "Outstanding checks not yet cleared" }
      - { name: status, type: enum, source: system, default: "IMPORTED", description: "IMPORTED | RECONCILING | RECONCILED" }

  - name: ReconciliationItem
    parent: BankStatement
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> BankStatement.id" }
      - { name: engagement_id, type: string, source: system, description: "FK -> CleanupEngagement.id" }
      - { name: ledger_entry_id, type: string, source: input, description: "FK -> LedgerEntry.id; the book entry being matched" }
      - { name: statement_line_amount_cents, type: integer, source: input, description: "Signed amount as shown on the bank statement line" }
      - { name: match_kind, type: enum, source: input, default: "EXACT", description: "EXACT | TOLERANCE — EXACT requires equal magnitudes; TOLERANCE allows up to MATCH_TOLERANCE_CENTS" }
      - { name: status, type: enum, source: system, default: "MATCHED", description: "MATCHED | DISPUTED | UNMATCHED" }

  - name: Phase
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: phase_index, type: integer, source: input, description: "1-based ordinal; unique per engagement; phases bill in ascending order" }
      - { name: label, type: string, source: input, description: "Phase label, e.g. Reconstruction" }
      - { name: weight_bp, type: integer, source: input, description: "Share of the fixed price in basis points; engagement phases must sum to 10000" }
      - { name: amount_cents, type: integer, source: computed, description: "Phase share of the fixed price; see calculations.phase_billing_split" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | BILLABLE | INVOICED | PAID" }

  - name: PhaseInvoice
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: phase_id, type: string, source: input, description: "FK -> Phase.id" }
      - { name: amount_cents, type: integer, source: computed, description: "Snapshot of Phase.amount_cents at issue time" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | PAID | VOID" }

  - name: TaxPackage
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: basis, type: enum, source: computed, description: "CASH | ACCRUAL — copied from Client.accounting_basis at build time" }
      - { name: net_book_income_cents, type: integer, source: computed, description: "Taxable book income under the chosen basis; see calculations.taxable_income" }
      - { name: status, type: enum, source: system, default: "BUILT", description: "BUILT | HANDED_OFF | AMENDED" }

  - name: ServicePlan
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly bookkeeping fee" }
      - { name: conversion_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the ongoing service starts" }
      - { name: first_month_prorated_cents, type: integer, source: computed, description: "Prorated first-month fee; see calculations.service_proration" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | CANCELLED" }

  - name: Exception
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: account_id, type: string, source: input, description: "FK -> LedgerAccount.id; the account the exception concerns" }
      - { name: kind, type: enum, source: input, description: "MISSING_DOC | UNCATEGORIZED | UNRECONCILED_DIFF | DUPLICATE" }
      - { name: severity, type: enum, source: input, default: "NORMAL", description: "NORMAL | BLOCKING — BLOCKING exceptions suppress readiness and tax handoff" }
      - { name: doc_due_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) a requested document is expected; required when kind=MISSING_DOC" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | WAITING_DOCS | RESOLVED | WAIVED" }

  - name: CompletionReport
    parent: CleanupEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> CleanupEngagement.id" }
      - { name: final_readiness_score, type: integer, source: computed, description: "Snapshot of engagement.readiness_score at completion" }
      - { name: reconciled_account_count, type: integer, source: computed, description: "Snapshot of engagement.reconciled_account_count" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of PhaseInvoice.amount_cents where status != VOID at completion" }
      - { name: status, type: enum, source: system, default: "FINAL", description: "FINAL — completion reports are immutable once created" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Engagement lifecycle dimension (workflow_status) ----
  - entity: CleanupEngagement
    dimension: workflow_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPING
        trigger: "POST /engagements/{id}/start-scoping"
        actor: EngagementManager
        preconditions: []
        side_effects: []

      - from: SCOPING
        to: RECONSTRUCTION
        trigger: "POST /engagements/{id}/scope-estimates/{eid}/accept"
        actor: EngagementManager
        preconditions:
          - "ScopeEstimate.status == PROPOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "ScopeEstimate.status -> ACCEPTED; any other ACCEPTED estimate -> SUPERSEDED"
          - "engagement.scope_locked = true"
          - "engagement.estimated_txn_volume = ScopeEstimate.txn_volume_estimate (calculations.scope_volume_estimate)"
          - "engagement.version += 1"

      - from: RECONSTRUCTION
        to: RECONCILIATION
        trigger: "POST /engagements/{id}/advance-to-reconciliation"
        actor: EngagementManager
        preconditions:
          - "engagement has at least one LedgerAccount in CATEGORIZED or RECONCILED (else ERR_NO_CATEGORIZED_ACCOUNTS)"
          - "no LedgerEntry on this engagement remains in DRAFT (else ERR_UNPOSTED_ENTRIES)"
        side_effects: []

      - from: RECONCILIATION
        to: TAX_HANDOFF
        trigger: "POST /engagements/{id}/tax-packages (build)"
        actor: TaxPreparer
        preconditions:
          - "engagement.recon_status == IN_BALANCE (else ERR_RECON_NOT_IN_BALANCE)"
          - "engagement.open_blocking_exception_count == 0 (else ERR_BLOCKING_EXCEPTIONS_OPEN)"
        side_effects:
          - "create TaxPackage in BUILT with net_book_income_cents (calculations.taxable_income)"
          - "snapshot CompletionReport inputs become available"

      - from: TAX_HANDOFF
        to: COMPLETED
        trigger: "POST /engagements/{id}/complete"
        actor: EngagementManager
        preconditions:
          - "engagement.billing_status == SETTLED (else ERR_BILLING_NOT_SETTLED)"
          - "a TaxPackage exists in HANDED_OFF (else ERR_TAX_NOT_HANDED_OFF)"
        side_effects:
          - "create immutable CompletionReport (snapshots readiness, accounts, total_billed)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []

      - from: SCOPING
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []

      - from: RECONSTRUCTION
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: EngagementManager
        preconditions:
          - "no PhaseInvoice on this engagement in status PAID (else ERR_PAID_INVOICES_EXIST)"
        side_effects:
          - "all Phase in PLANNED/BILLABLE -> remain but engagement billing frozen"

  # ---- Engagement billing dimension (billing_status) — parallel to workflow ----
  - entity: CleanupEngagement
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: QUOTED
        trigger: "POST /engagements/{id}/quote"
        actor: EngagementManager
        preconditions:
          - "engagement.scope_locked == true (else ERR_SCOPE_NOT_LOCKED)"
        side_effects:
          - "compute and store the fixed price from estimated_txn_volume (calculations.fixed_price_quote)"

      - from: QUOTED
        to: PHASED
        trigger: "POST /engagements/{id}/phases/generate"
        actor: EngagementManager
        preconditions:
          - "engagement has Phase rows whose weight_bp sum to exactly 10000 (else ERR_PHASE_WEIGHTS_INVALID)"
        side_effects:
          - "each Phase.amount_cents set via calculations.phase_billing_split"
          - "each Phase.status PLANNED -> BILLABLE"

      - from: PHASED
        to: SETTLED
        trigger: "system (automatic when every Phase is PAID)"
        actor: system
        preconditions:
          - "every Phase on the engagement is in status PAID"
        side_effects: []

  # ---- LedgerAccount ----
  - entity: LedgerAccount
    initial_state: DRAFT
    terminal_states: [EXCLUDED]
    transitions:
      - from: DRAFT
        to: CATEGORIZED
        trigger: "POST /engagements/{id}/accounts/{aid}/categorize"
        actor: Bookkeeper
        preconditions:
          - "engagement.workflow_status == RECONSTRUCTION (else ERR_INVALID_STATE)"
          - "account has at least one POSTED LedgerEntry (else ERR_NO_POSTED_ENTRIES)"
        side_effects:
          - "recompute book_balance_cents from POSTED entries"

      - from: CATEGORIZED
        to: RECONCILED
        trigger: "POST /engagements/{id}/accounts/{aid}/mark-reconciled"
        actor: Reviewer
        preconditions:
          - "if is_bank_account: a BankStatement on this account is RECONCILED (else ERR_BANK_NOT_RECONCILED)"
          - "no open UNRECONCILED_DIFF Exception on this account (else ERR_OPEN_DIFF_EXCEPTION)"
        side_effects:
          - "engagement.reconciled_account_count += 1 (derived recompute)"
          - "recompute engagement.readiness_score (calculations.readiness_score)"
          - "recompute engagement.recon_status"

      - from: DRAFT
        to: EXCLUDED
        trigger: "POST /engagements/{id}/accounts/{aid}/exclude"
        actor: Bookkeeper
        preconditions: []
        side_effects:
          - "recompute engagement.total_account_count"

      - from: CATEGORIZED
        to: EXCLUDED
        trigger: "POST /engagements/{id}/accounts/{aid}/exclude"
        actor: Bookkeeper
        preconditions:
          - "account is not is_bank_account with a RECONCILING/RECONCILED statement (else ERR_BANK_NOT_RECONCILED)"
        side_effects:
          - "recompute engagement.total_account_count"

  # ---- LedgerEntry (self-referential reversal) ----
  - entity: LedgerEntry
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /engagements/{id}/entries/{eid}/post"
        actor: Bookkeeper
        preconditions:
          - "txn_date within engagement.period_start..period_end inclusive (else ERR_ENTRY_OUT_OF_PERIOD)"
          - "account.status != EXCLUDED (else ERR_ACCOUNT_EXCLUDED)"
        side_effects:
          - "recompute account.book_balance_cents"

      - from: POSTED
        to: REVERSED
        trigger: "POST /engagements/{id}/entries/{eid}/reverse"
        actor: Bookkeeper
        preconditions:
          - "entry.cash_settled == false (else ERR_ENTRY_SETTLED)"
          - "account.status != RECONCILED (else ERR_ACCOUNT_RECONCILED)"
        side_effects:
          - "create a new POSTED LedgerEntry with opposite side, same amount, reversed_entry_id = this.id"
          - "recompute account.book_balance_cents"

  # ---- BankStatement (branching) ----
  - entity: BankStatement
    initial_state: IMPORTED
    terminal_states: [RECONCILED]
    transitions:
      - from: IMPORTED
        to: RECONCILING
        trigger: "POST /engagements/{id}/statements/{sid}/reconciliation-items (first item created)"
        actor: Reviewer
        preconditions:
          - "statement.account is a bank account (else ERR_NOT_BANK_ACCOUNT)"
        side_effects: []

      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /engagements/{id}/statements/{sid}/finalize"
        actor: Reviewer
        preconditions:
          - "no ReconciliationItem on this statement in status UNMATCHED or DISPUTED (else ERR_OPEN_RECON_ITEMS)"
          - "computed recon difference within tolerance (else creates UNRECONCILED_DIFF Exception, ERR_RECON_OUT_OF_BALANCE)"
        side_effects:
          - "mark each linked LedgerEntry.cash_settled = true"
          - "recompute engagement.recon_status"

  # ---- Phase ----
  - entity: Phase
    initial_state: PLANNED
    terminal_states: [PAID]
    transitions:
      - from: PLANNED
        to: BILLABLE
        trigger: "system (on POST /engagements/{id}/phases/generate)"
        actor: system
        preconditions: []
        side_effects: ["amount_cents computed (calculations.phase_billing_split)"]

      - from: BILLABLE
        to: INVOICED
        trigger: "POST /engagements/{id}/phases/{pid}/invoice"
        actor: EngagementManager
        preconditions:
          - "all lower phase_index Phases on this engagement are INVOICED or PAID (else ERR_PHASE_ORDER)"
        side_effects:
          - "create PhaseInvoice (ISSUED) snapshotting amount_cents"

      - from: INVOICED
        to: PAID
        trigger: "POST /engagements/{id}/invoices/{iid}/pay"
        actor: EngagementManager
        preconditions: []
        side_effects:
          - "PhaseInvoice.status -> PAID"
          - "if every Phase now PAID: engagement.billing_status PHASED -> SETTLED (bubble-up)"

  # ---- Exception (cyclic OPEN <-> WAITING_DOCS) ----
  - entity: Exception
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: WAITING_DOCS
        trigger: "POST /engagements/{id}/exceptions/{xid}/request-docs"
        actor: Bookkeeper
        preconditions:
          - "kind == MISSING_DOC (else ERR_INVALID_STATE)"
        side_effects: []

      - from: WAITING_DOCS
        to: OPEN
        trigger: "POST /engagements/{id}/exceptions/{xid}/docs-received"
        actor: Bookkeeper
        preconditions: []
        side_effects: []

      - from: OPEN
        to: RESOLVED
        trigger: "POST /engagements/{id}/exceptions/{xid}/resolve"
        actor: Bookkeeper
        preconditions: []
        side_effects:
          - "if severity BLOCKING: recompute engagement.open_blocking_exception_count and readiness_score"

      - from: WAITING_DOCS
        to: RESOLVED
        trigger: "POST /engagements/{id}/exceptions/{xid}/resolve"
        actor: Bookkeeper
        preconditions: []
        side_effects:
          - "if severity BLOCKING: recompute engagement.open_blocking_exception_count and readiness_score"

      - from: OPEN
        to: WAIVED
        trigger: "POST /engagements/{id}/exceptions/{xid}/waive"
        actor: Reviewer
        preconditions:
          - "kind != UNRECONCILED_DIFF (else ERR_CANNOT_WAIVE_DIFF)"
        side_effects:
          - "if severity BLOCKING: recompute engagement.open_blocking_exception_count and readiness_score"

  # ---- TaxPackage ----
  - entity: TaxPackage
    initial_state: BUILT
    terminal_states: [AMENDED]
    transitions:
      - from: BUILT
        to: HANDED_OFF
        trigger: "POST /engagements/{id}/tax-packages/{tid}/handoff"
        actor: TaxPreparer
        preconditions:
          - "engagement.open_blocking_exception_count == 0 (else ERR_BLOCKING_EXCEPTIONS_OPEN)"
        side_effects: []

      - from: HANDED_OFF
        to: AMENDED
        trigger: "POST /engagements/{id}/tax-packages/{tid}/amend"
        actor: TaxPreparer
        preconditions: []
        side_effects:
          - "recompute net_book_income_cents (calculations.taxable_income)"

  # ---- ServicePlan ----
  - entity: ServicePlan
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /engagements/{id}/service-plans/{spid}/activate"
        actor: EngagementManager
        preconditions:
          - "engagement.workflow_status in {TAX_HANDOFF, COMPLETED} (else ERR_INVALID_STATE)"
        side_effects:
          - "first_month_prorated_cents computed (calculations.service_proration)"

      - from: PENDING
        to: CANCELLED
        trigger: "POST /engagements/{id}/service-plans/{spid}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /engagements/{id}/service-plans/{spid}/cancel"
        actor: EngagementManager
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: scope-accept-stale-engagement
    parent_entity: CleanupEngagement
    write_endpoint: "POST /engagements/{id}/scope-estimates/{eid}/accept"
    occ_field: "expected_engagement_version"
    description: |
      Accepting a ScopeEstimate against a CleanupEngagement whose version has
      advanced since the client last observed it is rejected. A prior accept of
      a competing ScopeEstimate legitimately supersedes the earlier baseline and
      bumps engagement.version, so the current acceptor's view of the engagement
      is stale and its scope baseline would clobber the accepted one.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: scope_volume_estimate
    trigger: "ScopeEstimate creation; re-read on accept"
    algorithm: forward_looking
    formula: |
      period_month_count = inclusive whole-month span between engagement.period_start
        and engagement.period_end:
          months = (end.year - start.year) * 12 + (end.month - start.month) + 1
      complexity_bp = COMPLEXITY_BP[engagement.complexity_tier]
      raw = period_month_count * monthly_txn_rate * complexity_bp
      txn_volume_estimate = floor(raw / 10000)   # integer floor; basis-point math avoids float drift
    input_set: "Uses engagement.period_start/period_end and complexity_tier plus this estimate's monthly_txn_rate"
    constants:
      COMPLEXITY_BP: { LOW: 10000, MEDIUM: 11500, HIGH: 13000 }
    precision: "integer transactions, floor"
    variants:
      - name: forward_estimate
        when: "at scoping, before reconstruction"
        difference: "projected from monthly_txn_rate * months * tier multiplier — a forecast"
      - name: actual_reconstructed
        when: "after reconstruction: GET /engagements/{id}/volume-actuals"
        difference: "counts POSTED non-REVERSED LedgerEntry rows whose txn_date is in period; ignores estimate inputs entirely — a different domain (LedgerEntry) and a chronologically-derived count, not a forecast"

  - name: taxable_income
    trigger: "TaxPackage build (RECONCILIATION->TAX_HANDOFF); TaxPackage amend"
    algorithm: aggregation
    formula: |
      Consider POSTED, non-REVERSED LedgerEntry rows whose txn_date is in
      [engagement.period_start, engagement.period_end] inclusive, on accounts whose
      status != EXCLUDED.
      income  = sum(amount_cents where account.account_type == INCOME  and side == CREDIT and include(e))
      expense = sum(amount_cents where account.account_type == EXPENSE and side == DEBIT  and include(e))
      net_book_income_cents = income - expense
      where include(e):
        ACCRUAL basis: include(e) = true for every qualifying entry
        CASH    basis: include(e) = (e.cash_settled == true)   # only bank/credit-reconciled entries
    input_set: "POSTED non-REVERSED entries in period on non-EXCLUDED accounts; basis = Client.accounting_basis"
    constants: {}
    precision: "integer cents"
    variants:
      - name: accrual_basis
        when: "Client.accounting_basis == ACCRUAL"
        difference: "every qualifying POSTED entry counts regardless of cash settlement"
      - name: cash_basis
        when: "Client.accounting_basis == CASH"
        difference: "only entries with cash_settled == true count; unsettled invoiced income and accrued expense are excluded, producing a different net than accrual on identical entries"

  - name: fixed_price_quote
    trigger: "POST /engagements/{id}/quote (UNBILLED->QUOTED)"
    algorithm: tiered_pricing
    formula: |
      vol = engagement.estimated_txn_volume
      if vol <= TIER1_MAX:                         price = BASE_CENTS
      elif vol <= TIER2_MAX:                       price = BASE_CENTS + (vol - TIER1_MAX) * RATE1_CENTS
      else:                                        price = BASE_CENTS + (TIER2_MAX - TIER1_MAX) * RATE1_CENTS
                                                           + (vol - TIER2_MAX) * RATE2_CENTS
      engagement fixed price (cents) = price   # marginal/tiered, NOT average-rate
    input_set: "engagement.estimated_txn_volume only"
    constants:
      TIER1_MAX: 500
      TIER2_MAX: 1500
      BASE_CENTS: 50000
      RATE1_CENTS: 40
      RATE2_CENTS: 30
    precision: "integer cents"

  - name: phase_billing_split
    trigger: "POST /engagements/{id}/phases/generate (QUOTED->PHASED)"
    algorithm: waterfall_allocation
    formula: |
      fixed_price = calculations.fixed_price_quote(engagement)
      Order phases by phase_index ASC.
      For every phase EXCEPT the last (highest phase_index):
        amount_cents = round_half_up(fixed_price * weight_bp / 10000)
      Last phase (highest phase_index):
        amount_cents = fixed_price - sum(amount_cents of all earlier phases)   # residual carries rounding remainder
      Invariant: sum(Phase.amount_cents) == fixed_price exactly.
    input_set: "All Phase rows on the engagement; weight_bp must sum to 10000"
    constants: {}
    precision: "round_half_up to whole cents per non-last phase; residual to last phase by phase_index ASC"

  - name: readiness_score
    trigger: "account mark-reconciled; exception resolve/waive; statement finalize"
    algorithm: weighted_scoring
    formula: |
      if total_account_count == 0: base = 0
      else: base = floor(100 * reconciled_account_count / total_account_count)
      score = base - (open_blocking_exception_count * BLOCKING_PENALTY)
      readiness_score = max(0, min(100, score))
    input_set: "engagement.reconciled_account_count, total_account_count, open_blocking_exception_count"
    constants:
      BLOCKING_PENALTY: 8
    precision: "integer 0..100, floor on the ratio before penalty"

  - name: recon_difference
    trigger: "BankStatement finalize (RECONCILING->RECONCILED)"
    algorithm: aggregation
    formula: |
      reconciled_bank_cents = statement.ending_balance_cents
                            + statement.deposits_in_transit_cents
                            - statement.outstanding_checks_cents
      book_balance_cents    = account.book_balance_cents
      recon_difference_cents = reconciled_bank_cents - book_balance_cents
      if abs(recon_difference_cents) <= MATCH_TOLERANCE_CENTS: statement -> RECONCILED
      else: reject finalize, create BLOCKING UNRECONCILED_DIFF Exception on the account (ERR_RECON_OUT_OF_BALANCE)
    input_set: "One BankStatement and its account's book_balance_cents"
    constants:
      MATCH_TOLERANCE_CENTS: 100
    precision: "integer cents; boundary is inclusive (abs == 100 still reconciles)"

  - name: service_proration
    trigger: "ServicePlan activate (PENDING->ACTIVE)"
    algorithm: aggregation
    formula: |
      day = day-of-month of conversion_date (1..days_in_month)
      days_in_month = number of days in conversion_date's month
      remaining_days = days_in_month - day + 1   # inclusive of conversion day
      first_month_prorated_cents = round_half_up(monthly_fee_cents * remaining_days / days_in_month)
    input_set: "ServicePlan.monthly_fee_cents and conversion_date"
    constants: {}
    precision: "round_half_up to whole cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: "Segregation of duties: the Reviewer who marks an account RECONCILED must not be the Bookkeeper (same X-User-ID) who categorized it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engagements/{id}/accounts/{aid}/mark-reconciled"

  - priority: 4
    category: existence
    check: "Referenced resources exist, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body well-formed; required fields present; enums valid; amount_cents/weight_bp positive"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource in correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_temporal
    check: "LedgerEntry.txn_date must fall within engagement.period_start..period_end inclusive on post"
    error_id: ERR_ENTRY_OUT_OF_PERIOD
    http_status: 409
    applies_to: "POST /engagements/{id}/entries/{eid}/post"

  - priority: 8
    category: business_referential
    check: "Reconstruction advance requires all LedgerEntry POSTED (no DRAFT) before reconciliation"
    error_id: ERR_UNPOSTED_ENTRIES
    http_status: 409
    applies_to: "POST /engagements/{id}/advance-to-reconciliation"

  - priority: 9
    category: business_safety
    check: "Tax handoff blocked while any BLOCKING exception is unresolved (precedes balance check)"
    error_id: ERR_BLOCKING_EXCEPTIONS_OPEN
    http_status: 409
    applies_to: "POST /engagements/{id}/tax-packages; POST /engagements/{id}/tax-packages/{tid}/handoff"

  - priority: 10
    category: business_constraint
    check: "Tax package build requires engagement.recon_status == IN_BALANCE"
    error_id: ERR_RECON_NOT_IN_BALANCE
    http_status: 409
    applies_to: "POST /engagements/{id}/tax-packages"

  - priority: 11
    category: business_constraint
    check: "Phase weights must sum to exactly 10000 basis points before generating amounts"
    error_id: ERR_PHASE_WEIGHTS_INVALID
    http_status: 409
    applies_to: "POST /engagements/{id}/phases/generate"

  - priority: 12
    category: business_constraint
    check: "A phase can be invoiced only after all lower phase_index phases are INVOICED or PAID"
    error_id: ERR_PHASE_ORDER
    http_status: 409
    applies_to: "POST /engagements/{id}/phases/{pid}/invoice"

  - priority: 13
    category: business_fiscal
    check: "Completion requires billing_status == SETTLED"
    error_id: ERR_BILLING_NOT_SETTLED
    http_status: 409
    applies_to: "POST /engagements/{id}/complete"

  - priority: 14
    category: business_referential
    check: "account_code unique per engagement among non-EXCLUDED LedgerAccount rows"
    error_id: ERR_DUPLICATE_ACCOUNT_CODE
    http_status: 409
    applies_to: "POST /engagements/{id}/accounts"

  - priority: 15
    category: concurrency
    check: "expected_engagement_version must match current engagement.version on scope accept"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /engagements/{id}/scope-estimates/{eid}/accept"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a Client"
    roles: [EngagementManager]
    code: 201
    input: ["legal_name", "entity_type", "accounting_basis?"]
    output: Client
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/clients/{clientId}"
    description: "Get a Client"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements; filter by client_id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["client_id?", "workflow_status?", "limit?", "offset?"]
    output: "CleanupEngagement[]"
    side_effects: []

  # ---- Engagement ----
  - method: POST
    path: "/engagements"
    description: "Create a CleanupEngagement"
    roles: [EngagementManager]
    code: 201
    input: ["client_id", "title", "period_start", "period_end", "complexity_tier?"]
    output: CleanupEngagement
    side_effects: ["workflow_status=DRAFT, billing_status=UNBILLED, scope_locked=false"]

  - method: GET
    path: "/engagements/{id}"
    description: "Get a CleanupEngagement with computed fields"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: []

  - method: GET
    path: "/engagements/{id}/volume-actuals"
    description: "Computed read: actual reconstructed transaction volume (actual_reconstructed variant)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: "{ actual_txn_volume: integer, estimated_txn_volume: integer, variance: integer }"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/start-scoping"
    description: "Move engagement DRAFT -> SCOPING"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["workflow_status -> SCOPING"]

  - method: POST
    path: "/engagements/{id}/advance-to-reconciliation"
    description: "Move engagement RECONSTRUCTION -> RECONCILIATION"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["workflow_status -> RECONCILIATION"]

  - method: POST
    path: "/engagements/{id}/quote"
    description: "Compute fixed price and move billing UNBILLED -> QUOTED"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["billing_status -> QUOTED, fixed price stored (calculations.fixed_price_quote)"]

  - method: POST
    path: "/engagements/{id}/complete"
    description: "Move engagement TAX_HANDOFF -> COMPLETED and emit CompletionReport"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["workflow_status -> COMPLETED", "create immutable CompletionReport"]

  - method: POST
    path: "/engagements/{id}/cancel"
    description: "Cancel an engagement (DRAFT/SCOPING/RECONSTRUCTION -> CANCELLED)"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["workflow_status -> CANCELLED"]

  # ---- ScopeEstimate ----
  - method: POST
    path: "/engagements/{id}/scope-estimates"
    description: "Create a ScopeEstimate (computes txn_volume_estimate)"
    roles: [EngagementManager]
    code: 201
    input: [monthly_txn_rate]
    output: ScopeEstimate
    side_effects: ["status=PROPOSED, txn_volume_estimate and period_month_count computed"]

  - method: GET
    path: "/engagements/{id}/scope-estimates"
    description: "List ScopeEstimates for an engagement"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?"]
    output: "ScopeEstimate[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/scope-estimates/{eid}/accept"
    description: "Accept a ScopeEstimate; locks scope and advances SCOPING -> RECONSTRUCTION"
    roles: [EngagementManager]
    code: 200
    input: [expected_engagement_version]
    output: ScopeEstimate
    side_effects:
      - "status -> ACCEPTED; prior ACCEPTED estimate -> SUPERSEDED"
      - "engagement.scope_locked=true, estimated_txn_volume set, workflow_status -> RECONSTRUCTION"
      - "increments CleanupEngagement.version by 1"

  # ---- LedgerAccount ----
  - method: POST
    path: "/engagements/{id}/accounts"
    description: "Create a LedgerAccount"
    roles: [Bookkeeper, EngagementManager]
    code: 201
    input: ["account_code", "name", "account_type", "is_bank_account?"]
    output: LedgerAccount
    side_effects: ["status=DRAFT, normal_side derived"]

  - method: GET
    path: "/engagements/{id}/accounts"
    description: "List LedgerAccounts for an engagement; filter by status"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?", "account_type?"]
    output: "LedgerAccount[]"
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get a LedgerAccount"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: []

  - method: POST
    path: "/engagements/{id}/accounts/{aid}/categorize"
    description: "Categorize a LedgerAccount (DRAFT -> CATEGORIZED)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: ["status -> CATEGORIZED, book_balance_cents recomputed"]

  - method: POST
    path: "/engagements/{id}/accounts/{aid}/mark-reconciled"
    description: "Mark a LedgerAccount RECONCILED (Reviewer; segregation of duties enforced)"
    roles: [Reviewer]
    code: 200
    input: []
    output: LedgerAccount
    side_effects:
      - "status -> RECONCILED"
      - "recompute engagement.reconciled_account_count, readiness_score, recon_status"

  - method: POST
    path: "/engagements/{id}/accounts/{aid}/exclude"
    description: "Exclude a LedgerAccount (-> EXCLUDED)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: ["status -> EXCLUDED, engagement.total_account_count recomputed"]

  # ---- LedgerEntry ----
  - method: POST
    path: "/engagements/{id}/entries"
    description: "Create a draft LedgerEntry"
    roles: [Bookkeeper]
    code: 201
    input: ["account_id", "txn_date", "side", "amount_cents", "memo?"]
    output: LedgerEntry
    side_effects: ["status=DRAFT, cash_settled=false"]

  - method: GET
    path: "/engagements/{id}/entries"
    description: "List LedgerEntries for an engagement; filter by account_id/status"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "status?", "reversed_entry_id?", "reconciliation_item_id?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/entries/{eid}/post"
    description: "Post a LedgerEntry (DRAFT -> POSTED)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: ["status -> POSTED, account.book_balance_cents recomputed"]

  - method: POST
    path: "/engagements/{id}/entries/{eid}/reverse"
    description: "Reverse a POSTED LedgerEntry (creates an opposite-side reversing entry)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: LedgerEntry
    side_effects:
      - "this entry status -> REVERSED"
      - "create a POSTED reversing LedgerEntry (opposite side, reversed_entry_id set)"
      - "account.book_balance_cents recomputed"

  # ---- BankStatement ----
  - method: POST
    path: "/engagements/{id}/statements"
    description: "Import a BankStatement for a bank account"
    roles: [Bookkeeper, Reviewer]
    code: 201
    input: ["account_id", "statement_start", "statement_end", "ending_balance_cents", "deposits_in_transit_cents?", "outstanding_checks_cents?"]
    output: BankStatement
    side_effects: ["status=IMPORTED"]

  - method: GET
    path: "/engagements/{id}/statements"
    description: "List BankStatements; filter by account_id/status"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "status?"]
    output: "BankStatement[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/statements/{sid}/finalize"
    description: "Finalize reconciliation (RECONCILING -> RECONCILED) — runs recon_difference"
    roles: [Reviewer]
    code: 200
    input: []
    output: BankStatement
    side_effects:
      - "status -> RECONCILED (if within tolerance)"
      - "mark linked LedgerEntry.cash_settled=true"
      - "recompute engagement.recon_status"
      - "on out-of-balance: create BLOCKING UNRECONCILED_DIFF Exception, reject with ERR_RECON_OUT_OF_BALANCE"

  # ---- ReconciliationItem ----
  - method: POST
    path: "/engagements/{id}/statements/{sid}/reconciliation-items"
    description: "Match a LedgerEntry to a bank statement line (IMPORTED -> RECONCILING on first)"
    roles: [Reviewer]
    code: 201
    input: ["ledger_entry_id", "statement_line_amount_cents", "match_kind?"]
    output: ReconciliationItem
    side_effects: ["status=MATCHED (or UNMATCHED if magnitudes differ beyond match_kind tolerance)", "statement IMPORTED -> RECONCILING"]

  - method: GET
    path: "/engagements/{id}/statements/{sid}/reconciliation-items"
    description: "List ReconciliationItems for a statement"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?"]
    output: "ReconciliationItem[]"
    side_effects: []

  - method: GET
    path: "/reconciliation-items"
    description: "List ReconciliationItems; filter by ledger_entry_id or statement_id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["ledger_entry_id?", "statement_id?", "status?"]
    output: "ReconciliationItem[]"
    side_effects: []

  # ---- Phase / billing ----
  - method: POST
    path: "/engagements/{id}/phases"
    description: "Create a Phase (planning); weight_bp share of fixed price"
    roles: [EngagementManager]
    code: 201
    input: [phase_index, label, weight_bp]
    output: Phase
    side_effects: ["status=PLANNED"]

  - method: GET
    path: "/engagements/{id}/phases"
    description: "List Phases for an engagement"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?"]
    output: "Phase[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/phases/generate"
    description: "Compute phase amounts and move billing QUOTED -> PHASED"
    roles: [EngagementManager]
    code: 200
    input: []
    output: CleanupEngagement
    side_effects: ["each Phase.amount_cents set (phase_billing_split), Phase PLANNED -> BILLABLE, billing_status -> PHASED"]

  - method: POST
    path: "/engagements/{id}/phases/{pid}/invoice"
    description: "Invoice a BILLABLE Phase (creates PhaseInvoice)"
    roles: [EngagementManager]
    code: 201
    input: []
    output: PhaseInvoice
    side_effects: ["Phase status -> INVOICED, create PhaseInvoice (ISSUED) snapshotting amount_cents"]

  - method: POST
    path: "/engagements/{id}/invoices/{iid}/pay"
    description: "Mark a PhaseInvoice PAID (advances Phase -> PAID; may settle billing)"
    roles: [EngagementManager]
    code: 200
    input: []
    output: PhaseInvoice
    side_effects: ["PhaseInvoice -> PAID, Phase -> PAID", "if all phases PAID: billing_status PHASED -> SETTLED"]

  - method: GET
    path: "/engagements/{id}/invoices"
    description: "List PhaseInvoices; filter by phase_id/status"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["phase_id?", "status?"]
    output: "PhaseInvoice[]"
    side_effects: []

  # ---- TaxPackage ----
  - method: POST
    path: "/engagements/{id}/tax-packages"
    description: "Build a TaxPackage (RECONCILIATION -> TAX_HANDOFF); computes net_book_income_cents"
    roles: [TaxPreparer]
    code: 201
    input: []
    output: TaxPackage
    side_effects: ["status=BUILT, net_book_income_cents computed, engagement.workflow_status -> TAX_HANDOFF"]

  - method: GET
    path: "/engagements/{id}/tax-packages"
    description: "List TaxPackages for an engagement"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?"]
    output: "TaxPackage[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/tax-packages/{tid}/handoff"
    description: "Hand off a TaxPackage (BUILT -> HANDED_OFF)"
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxPackage
    side_effects: ["status -> HANDED_OFF"]

  - method: POST
    path: "/engagements/{id}/tax-packages/{tid}/amend"
    description: "Amend a handed-off TaxPackage (HANDED_OFF -> AMENDED); recompute income"
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxPackage
    side_effects: ["status -> AMENDED, net_book_income_cents recomputed"]

  # ---- ServicePlan ----
  - method: POST
    path: "/engagements/{id}/service-plans"
    description: "Create an ongoing-service ServicePlan (conversion)"
    roles: [EngagementManager]
    code: 201
    input: [monthly_fee_cents, conversion_date]
    output: ServicePlan
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/engagements/{id}/service-plans"
    description: "List ServicePlans for an engagement"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["status?"]
    output: "ServicePlan[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/service-plans/{spid}/activate"
    description: "Activate a ServicePlan (PENDING -> ACTIVE); compute first-month proration"
    roles: [EngagementManager]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status -> ACTIVE, first_month_prorated_cents computed"]

  - method: POST
    path: "/engagements/{id}/service-plans/{spid}/cancel"
    description: "Cancel a ServicePlan (-> CANCELLED)"
    roles: [EngagementManager]
    code: 200
    input: []
    output: ServicePlan
    side_effects: ["status -> CANCELLED"]

  # ---- Exception ----
  - method: POST
    path: "/engagements/{id}/exceptions"
    description: "Open an Exception (missing-doc / categorization / diff tracking)"
    roles: [Bookkeeper, Reviewer]
    code: 201
    input: ["account_id", "kind", "severity?", "doc_due_date?"]
    output: Exception
    side_effects: ["status=OPEN", "if severity BLOCKING: recompute engagement.open_blocking_exception_count, readiness_score"]

  - method: GET
    path: "/engagements/{id}/exceptions"
    description: "List Exceptions; filter by account_id/kind/status/severity"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "kind?", "status?", "severity?"]
    output: "Exception[]"
    side_effects: []

  - method: POST
    path: "/engagements/{id}/exceptions/{xid}/request-docs"
    description: "Move a MISSING_DOC Exception OPEN -> WAITING_DOCS"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: Exception
    side_effects: ["status -> WAITING_DOCS"]

  - method: POST
    path: "/engagements/{id}/exceptions/{xid}/docs-received"
    description: "Move an Exception WAITING_DOCS -> OPEN (docs arrived)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: Exception
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/engagements/{id}/exceptions/{xid}/resolve"
    description: "Resolve an Exception (-> RESOLVED)"
    roles: [Bookkeeper]
    code: 200
    input: []
    output: Exception
    side_effects: ["status -> RESOLVED", "if BLOCKING: recompute open_blocking_exception_count, readiness_score"]

  - method: POST
    path: "/engagements/{id}/exceptions/{xid}/waive"
    description: "Waive an Exception (Reviewer; -> WAIVED)"
    roles: [Reviewer]
    code: 200
    input: []
    output: Exception
    side_effects: ["status -> WAIVED", "if BLOCKING: recompute open_blocking_exception_count, readiness_score"]

  # ---- Flat-reference reads (FK reverse-reachability + single-resource gets) ----
  - method: GET
    path: "/entries/{entryId}"
    description: "Get a LedgerEntry by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/entries"
    description: "Flat list LedgerEntries; filter by account_id, reconciliation_item_id, or reversed_entry_id (FK reverse-reachability)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "reconciliation_item_id?", "reversed_entry_id?", "status?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/statements/{statementId}"
    description: "Get a BankStatement by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: BankStatement
    side_effects: []

  - method: GET
    path: "/statements"
    description: "Flat list BankStatements; filter by account_id (FK reverse-reachability)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "status?"]
    output: "BankStatement[]"
    side_effects: []

  - method: GET
    path: "/reconciliation-items/{itemId}"
    description: "Get a ReconciliationItem by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: ReconciliationItem
    side_effects: []

  - method: GET
    path: "/phases/{phaseId}"
    description: "Get a Phase by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: Phase
    side_effects: []

  - method: GET
    path: "/phase-invoices/{invoiceId}"
    description: "Get a PhaseInvoice by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: PhaseInvoice
    side_effects: []

  - method: GET
    path: "/phase-invoices"
    description: "Flat list PhaseInvoices; filter by phase_id (FK reverse-reachability)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["phase_id?", "engagement_id?", "status?"]
    output: "PhaseInvoice[]"
    side_effects: []

  - method: GET
    path: "/exceptions/{exceptionId}"
    description: "Get an Exception by id"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: Exception
    side_effects: []

  - method: GET
    path: "/exceptions"
    description: "Flat list Exceptions; filter by account_id (FK reverse-reachability)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: ["account_id?", "engagement_id?", "kind?", "status?", "severity?"]
    output: "Exception[]"
    side_effects: []

  # ---- CompletionReport ----
  - method: GET
    path: "/engagements/{id}/completion-report"
    description: "Get the engagement's CompletionReport (404 until completed)"
    roles: [EngagementManager, Bookkeeper, Reviewer, TaxPreparer]
    code: 200
    input: []
    output: "CompletionReport[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this endpoint"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Reviewer marking an account RECONCILED is the same user who categorized it"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum, non-positive amount/weight"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in a state where the requested transition is not allowed"

  - id: ERR_ENTRY_OUT_OF_PERIOD
    http: 409
    condition: "LedgerEntry.txn_date is outside engagement.period_start..period_end on post"

  - id: ERR_ACCOUNT_EXCLUDED
    http: 409
    condition: "Cannot post an entry to an EXCLUDED account"

  - id: ERR_ENTRY_SETTLED
    http: 409
    condition: "Cannot reverse a LedgerEntry whose cash_settled is true"

  - id: ERR_ACCOUNT_RECONCILED
    http: 409
    condition: "Cannot reverse an entry on an account already RECONCILED"

  - id: ERR_NO_POSTED_ENTRIES
    http: 409
    condition: "Cannot categorize an account with no POSTED entries"

  - id: ERR_NO_CATEGORIZED_ACCOUNTS
    http: 409
    condition: "Cannot advance to reconciliation with no CATEGORIZED/RECONCILED accounts"

  - id: ERR_UNPOSTED_ENTRIES
    http: 409
    condition: "Cannot advance to reconciliation while DRAFT LedgerEntries remain"

  - id: ERR_NOT_BANK_ACCOUNT
    http: 409
    condition: "Statement/reconciliation operation targets a non-bank account"

  - id: ERR_OPEN_RECON_ITEMS
    http: 409
    condition: "Cannot finalize a statement with UNMATCHED or DISPUTED reconciliation items"

  - id: ERR_RECON_OUT_OF_BALANCE
    http: 409
    condition: "Statement recon difference exceeds tolerance; a BLOCKING UNRECONCILED_DIFF exception is created"

  - id: ERR_BANK_NOT_RECONCILED
    http: 409
    condition: "Bank account cannot be marked RECONCILED until its statement is RECONCILED"

  - id: ERR_OPEN_DIFF_EXCEPTION
    http: 409
    condition: "Account has an open UNRECONCILED_DIFF exception blocking reconciliation"

  - id: ERR_RECON_NOT_IN_BALANCE
    http: 409
    condition: "Tax package build requires engagement.recon_status == IN_BALANCE"

  - id: ERR_BLOCKING_EXCEPTIONS_OPEN
    http: 409
    condition: "Tax build/handoff blocked while a BLOCKING exception is unresolved"

  - id: ERR_PHASE_WEIGHTS_INVALID
    http: 409
    condition: "Phase weight_bp values do not sum to exactly 10000"

  - id: ERR_PHASE_ORDER
    http: 409
    condition: "A phase cannot be invoiced before all lower phase_index phases are INVOICED/PAID"

  - id: ERR_SCOPE_NOT_LOCKED
    http: 409
    condition: "Quote/phase generation requires an accepted scope (scope_locked)"

  - id: ERR_BILLING_NOT_SETTLED
    http: 409
    condition: "Completion requires billing_status == SETTLED"

  - id: ERR_TAX_NOT_HANDED_OFF
    http: 409
    condition: "Completion requires a TaxPackage in HANDED_OFF"

  - id: ERR_PAID_INVOICES_EXIST
    http: 409
    condition: "Cannot cancel an engagement that has PAID phase invoices"

  - id: ERR_CANNOT_WAIVE_DIFF
    http: 409
    condition: "UNRECONCILED_DIFF exceptions cannot be waived; they must be resolved"

  - id: ERR_DUPLICATE_ACCOUNT_CODE
    http: 409
    condition: "account_code already used by a non-EXCLUDED account in this engagement"

  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not match current CleanupEngagement.version on scope accept"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: EngagementManager
    description: "Owns engagement lifecycle, scoping, billing/phases, completion, client and service-plan management"
    identity: opaque
    exclusive_operations:
      - "POST /clients — Create client"
      - "POST /engagements — Create engagement"
      - "POST /engagements/{id}/start-scoping"
      - "POST /engagements/{id}/scope-estimates — Create scope estimate"
      - "POST /engagements/{id}/scope-estimates/{eid}/accept"
      - "POST /engagements/{id}/advance-to-reconciliation"
      - "POST /engagements/{id}/quote"
      - "POST /engagements/{id}/phases — Create phase"
      - "POST /engagements/{id}/phases/generate"
      - "POST /engagements/{id}/phases/{pid}/invoice"
      - "POST /engagements/{id}/invoices/{iid}/pay"
      - "POST /engagements/{id}/complete"
      - "POST /engagements/{id}/cancel"
      - "POST /engagements/{id}/service-plans — Create service plan"
      - "POST /engagements/{id}/service-plans/{spid}/activate"
      - "POST /engagements/{id}/service-plans/{spid}/cancel"
    shared_operations:
      - "POST /engagements/{id}/accounts — shared with Bookkeeper"
      - "GET endpoints — shared read"

  - name: Bookkeeper
    description: "Reconstructs and categorizes the ledger; posts/reverses entries; opens exceptions and requests docs"
    identity: opaque
    exclusive_operations:
      - "POST /engagements/{id}/accounts/{aid}/categorize"
      - "POST /engagements/{id}/accounts/{aid}/exclude"
      - "POST /engagements/{id}/entries — Create entry"
      - "POST /engagements/{id}/entries/{eid}/post"
      - "POST /engagements/{id}/entries/{eid}/reverse"
      - "POST /engagements/{id}/exceptions/{xid}/request-docs"
      - "POST /engagements/{id}/exceptions/{xid}/docs-received"
      - "POST /engagements/{id}/exceptions/{xid}/resolve"
    shared_operations:
      - "POST /engagements/{id}/accounts — shared with EngagementManager"
      - "POST /engagements/{id}/statements — shared with Reviewer"
      - "POST /engagements/{id}/exceptions — shared with Reviewer"
      - "GET endpoints — shared read"

  - name: Reviewer
    description: "Independent reviewer: reconciles bank statements and signs off accounts; waives exceptions. Cannot also be the categorizing Bookkeeper (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /engagements/{id}/accounts/{aid}/mark-reconciled"
      - "POST /engagements/{id}/statements/{sid}/finalize"
      - "POST /engagements/{id}/statements/{sid}/reconciliation-items"
      - "POST /engagements/{id}/exceptions/{xid}/waive"
    shared_operations:
      - "POST /engagements/{id}/statements — shared with Bookkeeper"
      - "POST /engagements/{id}/exceptions — shared with Bookkeeper"
      - "GET endpoints — shared read"

  - name: TaxPreparer
    description: "Builds and hands off the tax package; amends after handoff"
    identity: opaque
    exclusive_operations:
      - "POST /engagements/{id}/tax-packages — Build tax package"
      - "POST /engagements/{id}/tax-packages/{tid}/handoff"
      - "POST /engagements/{id}/tax-packages/{tid}/amend"
    shared_operations:
      - "GET endpoints — shared read"
