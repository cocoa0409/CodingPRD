      - name: commissioning_agent_and_witness_authority_surfaces_are_disjoint
        claim_type: unauthorized_denial
        grounds:
          - "roles[CommissioningAgent].exclusive_operations = [POST /commissioning-packages, approve-script, execute-script, POST /load-bank-tests, start, complete, abort, POST /release-packets, submit]"
          - "roles[WitnessAuthority].exclusive_operations = [POST /commissioning-packages/{package_id}/witness] only"
          - "validations[2] ERR_UNAUTHORIZED 403, evaluated before existence (priority 5) and before optimistic concurrency (priorities 13-14)"
        distinguishing_aspect: "The witness holds exactly ONE operation and cannot open, script or execute anything, while the agent who runs the whole commissioning programme cannot sign the witness statement — that mutual exclusion is what makes the certification independent. The denials are also proven to outrank both existence and the expected_*_version pre-condition checks: a WitnessAuthority package creation carrying a stale hall version still answers 403, not 412."
        test_recipe:
          setup: "Hall CX83 in PLANNING with tenant TN83 and cage CG-1. The hall's current version and the cage's current version are read so that the denied and permitted creation calls carry structurally valid payloads."
