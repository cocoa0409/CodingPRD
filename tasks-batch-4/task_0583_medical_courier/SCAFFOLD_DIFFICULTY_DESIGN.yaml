  - rule_id: boundary_precision_check
    instances:
      - name: temp_reading_equals_max_is_inclusive
        grounds:
          - calculations.temperature_excursion_eval
          - entities.ScanEvent.fields.is_excursion
          - entities.Specimen.fields.integrity_status
        distinguishing_aspect: "Numeric boundary on temperature via the scan endpoint: a reading of exactly 8.0 on a [2,8] band is IN band (inclusive <=), so is_excursion == false and integrity stays INTACT; 8.01 would breach."
        test_recipe:
          setup:
            - "Dispatched route; REFRIGERATED [2,8] specimen; pickup scanned at exactly 8.0"
          setup_api_calls:
            - { call: "POST /med-courier/rate-cards", payload: { name: "RC", per_stop_fee_cents: 500, per_mile_rate_cents: 133, stat_surcharge_pct: 0.30, stat_surcharge_cap_cents: 10000, temp_handling_fee_cents: 800 }, as: Dispatcher, captures: { rc: $.data.id } }
