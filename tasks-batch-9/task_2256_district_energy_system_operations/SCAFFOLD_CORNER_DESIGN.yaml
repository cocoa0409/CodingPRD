      - name: commit_refuses_a_storage_order_larger_than_the_live_state_of_charge
        claim_type: Violation → Error
        grounds:
          - validations[priority 16 ERR_STORAGE_ENERGY_INSUFFICIENT]
          - calculations.merit_order_dispatch
          - state_machines.DispatchPlan.APPROVED_to_COMMITTED
        distinguishing_aspect: "Planning and settlement read different storage fields: optimize sizes the tank from storage_capacity_kwh (3200.0 over four hours caps the 200.0 kW rating, so the order asks for 800.00 kWh) while commit checks the live state_of_charge_kwh of 500.0 — the plan therefore passes review at 95.77 percent reserve and 0.5081 concentration and only fails at commit, leaving the charge ledger untouched at 500.0."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-D with D_STO (thermal storage, rated 200.0, capacity 3200.0 kWh, charge 500.0 kWh), D_CHP (gas 380.0), D_BIO (biomass 1200.0) and D_OIL (oil 900.0)."
