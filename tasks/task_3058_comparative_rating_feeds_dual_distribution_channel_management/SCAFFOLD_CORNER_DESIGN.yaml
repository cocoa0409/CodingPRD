# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3058 — comparative rating feeds & dual distribution channel management
# Breadth probe over §1.1–§1.7; corners already exercised by §1.8 appear as
# excluded_because stubs. Anchors define canonical setup fragments reused
# across instances (each instance is executed against a fresh empty DB).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: product_create_applies_defaults_and_starts_draft
        claim_type: Creation
        grounds:
          - entities.CarrierProduct
          - endpoints.POST_/products
        distinguishing_aspect: "A product created without the optional factor fields comes back 201 in DRAFT with version 1 and the declared defaults: direct_discount_pct 0, agent_load_pct 0, bundle_credit_pct 0, direct_channel_max_premium_cents null, bundle_eligible false."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - &k_product_auto
              call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000, STANDARD: 70000 }, COLLISION: { STANDARD: 90000, PLUS: 120000 } }, direct_discount_pct: 0.10, agent_load_pct: 0.15, bundle_credit_pct: 0.05, min_premium_cents: 40000 }
              as: RatingManager
              captures: { p_auto: $.data.id }
          assert:
            - "the response status is 201 and CarrierProduct.${p_auto}.status == DRAFT"
            - "CarrierProduct.${p_auto}.version == 1 with non-null id, created_at, updated_at"
            - "direct_channel_max_premium_cents is null and bundle_eligible == false (defaults applied, not null-vs-false confusion)"

      - name: agent_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Agent
          - endpoints.GET_/agents/{id}
        distinguishing_aspect: "Every stored Agent field round-trips through GET exactly as posted; status is APPLICANT until the appoint transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. One agent created."
          setup_api_calls:
            - *k_clock
            - &k_agent
              call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id, agent_v: $.data.version }
          trigger:
            - call: "GET /agents/${agent_a}"
              payload: {}
              as: UnderwritingReviewer
          assert:
            - "the response status is 200"
            - "Agent.${agent_a}.agency_name == \"Hill Country Insurance\" and principal_name == \"A. Reyes\" and resident_state_code == \"TX\""
            - "Agent.${agent_a}.status == APPLICANT and terminated_reason is null"

      - name: quotes_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/quotes
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three quotes on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with three DIRECT draft quotes."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - &k_product_auto_activate
              call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - &k_consumer
              call: "POST /consumers"
              payload: { email: "corner-list@example.com", full_name: "List Tester", date_of_birth: "1990-01-01", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "GET /quotes"
              payload: { consumer_id: "${cons_id}", limit: 2, offset: 0 }
              as: CarrierAdmin
          assert:
            - "the response status is 200 and response_type is array with exactly 2 rows, total_count == 3, has_more == true"
            - "GET /quotes with consumer_id == ${cons_id}, limit 2, offset 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /quotes with no params returns 3 rows under the default limit 10 / offset 0"

      - name: quote_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/quotes/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_5_existence
        distinguishing_aspect: "A syntactically valid but unallocated quote id yields 404 ERR_NOT_FOUND through the standard error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /quotes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: quote_create_missing_required_coverages_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Quote.fields.coverages
          - validations.priority_4_existence
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "coverages is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check, which fires BEFORE any state or business rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. One consumer."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
          trigger:
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /quotes?consumer_id=${cons_id} returns 0 rows (nothing persisted)"

      - name: quote_create_unknown_premium_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Quote.fields.quoted_premium_cents
          - validations.priority_4_existence
        distinguishing_aspect: "quoted_premium_cents is computed-only: a client-supplied value is ignored (unknown fields are ignored per §1.4 priority 4), the quote is still created in DRAFT, and quoted_premium_cents stays null until submit computes it."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. One consumer."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
          trigger:
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], quoted_premium_cents: 999999 }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
          assert:
            - "the response status is 201 and Quote.${q_id}.status == DRAFT"
            - "Quote.${q_id}.quoted_premium_cents is null — the client-supplied 999999 was ignored, not stored"

      - name: consumer_system_fields_generated_by_server
        claim_type: System Fields
        grounds:
          - entities.Consumer
          - endpoints.POST_/consumers
        distinguishing_aspect: "id is a server-minted UUID without type prefix; created_at/updated_at carry ISO8601 UTC with three fractional digits; version starts at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - *k_consumer
          assert:
            - "the response status is 201; Consumer.${cons_id}.id matches the bare-UUID shape (no 'cons_' prefix)"
            - "created_at == updated_at == \"2026-01-01T00:00:00.000Z\" (logical clock, three fractional digits)"
            - "version == 1"

      - name: quote_create_with_invalid_enum_channel_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Quote.fields.channel
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "channel is an enum {DIRECT, AGENT}; the value BOTH is rejected with 400 ERR_INVALID_REQUEST from the request-shape check."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. One consumer."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
          trigger:
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "BOTH", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: claim_create_on_unknown_policy_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Claim.fields.policy_id
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Claim creation resolves the policy FK first: an unallocated policy id yields 404 ERR_NOT_FOUND before any claim-field validation."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /policies/00000000-0000-4000-8000-000000000000/claims"
              payload: { claim_type: "COLLISION", incurred_amount_cents: 1000 }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: quote_starts_draft_and_submit_computes_premium
        claim_type: valid_transition
        grounds:
          - state_machines.Quote.DRAFT_to_QUOTED
          - endpoints.POST_/quotes/{id}/submit
        distinguishing_aspect: "A created quote holds status DRAFT with null quoted_premium_cents; submit moves it to QUOTED, stamps quoted_at/expires_at (quoted_at + 30 days) and computes the premium."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one DIRECT draft quote [LIABILITY/BASIC]."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - &k_quote_draft
              call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "before submit: Quote.${q_id}.status == DRAFT and quoted_premium_cents is null"
            - "after submit: status == QUOTED, quoted_premium_cents == 45000 (50000 * 0.90)"
            - "quoted_at == \"2026-01-01T00:00:00.000Z\" and expires_at == \"2026-01-31T00:00:00.000Z\" and rate_stale == false"

      - name: bind_on_draft_quote_rejected_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Quote.DRAFT
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "bind is defined only from QUOTED and AGENT_QUOTED; from DRAFT it fails with 409 ERR_INVALID_STATE_TRANSITION and creates no Policy."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one DIRECT DRAFT quote."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - *k_quote_draft
          trigger:
            - call: "POST /quotes/${q_id}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /policies?quote_id=${q_id} returns 0 rows"

      - name: withdrawn_quote_is_terminal_for_all_actions
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Quote.QUOTED_to_WITHDRAWN
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "WITHDRAWN is terminal: submit, re-rate, refer-to-agent, bind and a second withdraw all fail with ERR_INVALID_STATE_TRANSITION; the quote stays WITHDRAWN."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one QUOTED DIRECT quote, then withdrawn."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - *k_quote_draft
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q_id}/withdraw"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /quotes/${q_id}/withdraw"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "submit on WITHDRAWN fails 409 ERR_INVALID_STATE_TRANSITION"
            - "second withdraw on WITHDRAWN fails 409 ERR_INVALID_STATE_TRANSITION"
            - "Quote.${q_id}.status remains WITHDRAWN"

      - name: terminated_agent_is_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Agent
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "TERMINATED is terminal for Agent: suspend, reinstate, appoint and a second terminate all fail with 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent APPOINTED with one ACTIVE appointment, then terminated."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - &k_appt_tx
              call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { appt_id: $.data.id }
            - &k_appoint
              call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/terminate"
              payload: { reason: "non-performance" }
              as: UnderwritingReviewer
          trigger:
            - call: "POST /agents/${agent_a}/suspend"
              payload: {}
              as: UnderwritingReviewer
              captures: { err1: $.data.error_id }
            - call: "POST /agents/${agent_a}/terminate"
              payload: {}
              as: UnderwritingReviewer
              captures: { err2: $.data.error_id }
          assert:
            - "suspend on TERMINATED fails 409 ERR_INVALID_STATE_TRANSITION"
            - "second terminate on TERMINATED fails 409 ERR_INVALID_STATE_TRANSITION"
            - "Agent.${agent_a}.status remains TERMINATED"

      - name: submit_twice_second_call_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Quote.DRAFT_to_QUOTED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "submit is not idempotent: the second submit from QUOTED fails with 409 and the premium computed by the first submit is unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one QUOTED DIRECT quote."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - *k_quote_draft
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second submit fails 409 ERR_INVALID_STATE_TRANSITION"
            - "Quote.${q_id}.status remains QUOTED with quoted_premium_cents == 45000"

      - name: appointment_reads_expired_after_clock_passes_end
        claim_type: valid_transition
        grounds:
          - state_machines.AgentAppointment.ACTIVE_to_EXPIRED
        distinguishing_aspect: "EXPIRED is derived lazily: an appointment with effective_end 2026-02-01 reads ACTIVE at 2026-01-31 and EXPIRED at 2026-02-01, with no write in between; an EXPIRED appointment no longer satisfies the appoint precondition."
        test_recipe:
          setup:
            - "Logical clock starts 2026-01-01T00:00:00Z. Agent with appointment [2026-01-01, 2026-02-01)."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-02-01T00:00:00Z" }
              as: UnderwritingReviewer
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
          trigger:
            - call: "GET /appointments/${appt_id}"
              payload: {}
              as: CarrierAdmin
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
              captures: { err: $.data.error_id }
          assert:
            - "AgentAppointment.${appt_id}.status reads EXPIRED (effective_end <= now, half-open)"
            - "appoint now fails 409 ERR_AGENT_NOT_APPOINTED_IN_STATE (no ACTIVE appointment remains)"

      - name: bind_creates_policy_and_telematics_enrollment_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.Quote.QUOTED_to_BOUND
          - state_machines.TelematicsEnrollment
        distinguishing_aspect: "A DIRECT bind with telematics_opt_in creates exactly one Policy (IN_FORCE, term 365) and exactly one TelematicsEnrollment (ENROLLED, upfront 15%); without opt-in no enrollment exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with one QUOTED DIRECT quote [LIABILITY/BASIC] telematics_opt_in true (premium 45000)."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /quotes/${q_id}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol_id: $.data.id }
            - call: "GET /policies/${pol_id}/telematics-enrollments"
              payload: {}
              as: System
          assert:
            - "Policy.${pol_id}.status == IN_FORCE, term_days == 365, inception_at == \"2026-01-01T00:00:00.000Z\""
            - "Policy.${pol_id}.written_premium_cents == 38250 (45000 - 6750 up-front)"
            - "exactly one enrollment exists: status ENROLLED, channel DIRECT, upfront_discount_cents == 6750"
            - "Quote.${q_id}.status == BOUND"

      - name: policy_cancel_forces_enrollment_opted_out_conditional_cascade
        claim_type: conditional_cascade
        grounds:
          - state_machines.Policy.IN_FORCE_to_CANCELLED
          - state_machines.TelematicsEnrollment.PARTICIPATING_to_OPTED_OUT
        distinguishing_aspect: "Cancelling a policy force-opts-out only a NON-terminal enrollment (ENROLLED/PARTICIPATING); a SCORED enrollment keeps its realized discount — the cascade is conditional on the child's current state."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Consumer with two bound DIRECT telematics policies P1 (enrollment left ENROLLED) and P2 (enrollment SCORED with 95)."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol1: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q2}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol2: $.data.id }
            - call: "GET /policies/${pol2}/telematics-enrollments"
              payload: {}
              as: System
              captures: { enr2: "$.data[0].id" }
            - call: "POST /telematics-enrollments/${enr2}/activate-device"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /telematics-enrollments/${enr2}/score"
              payload: { driving_score: 95 }
              as: System
          trigger:
            - call: "POST /policies/${pol1}/cancel"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /policies/${pol2}/cancel"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /policies/${pol1}/telematics-enrollments"
              payload: {}
              as: System
            - call: "GET /policies/${pol2}/telematics-enrollments"
              payload: {}
              as: System
          assert:
            - "Policy.${pol1} enrollment: status == OPTED_OUT (forced), adjustment_cents remains null (forced cancel does NOT debit the up-front discount)"
            - "Policy.${pol2} enrollment: status remains SCORED with adjustment_cents == -9000 (final 36000 vs written 38250) — terminal enrollment untouched"
            - "both policies read status CANCELLED"

      - name: feed_publish_from_recall_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RateFeedPublication
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "RECALLED is terminal for publications: publishing a recalled publication fails 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE. Rater with a DRAFT publication which is then recalled."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - &k_rater
              call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "x" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/recall"
              payload: {}
              as: RatingManager
          trigger:
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "RateFeedPublication.${feed_id}.status remains RECALLED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: premium_per_line_rounding_order_pinned
        claim_type: precision
        grounds:
          - calculations.channel_quote_premium
        distinguishing_aspect: "Per-line rounding first: two lines at 33333 * 0.90 = 29999.7 each round to 30000 then sum to 60000; the rejected sum-then-round order gives 59999."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-ODD ACTIVE (DIRECT; ODD STD 33333; direct_discount 0.10; min 0). Consumer."
          setup_api_calls:
            - *k_clock
            - call: "POST /products"
              payload: { product_code: "P-ODD", line_of_business: "AUTO", state_code: "TX", channel_availability: "DIRECT", coverage_rates: { ODD: { STD: 33333 } }, direct_discount_pct: 0.10, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_odd: $.data.id }
            - call: "POST /products/${p_odd}/activate"
              payload: {}
              as: RatingManager
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_odd}", channel: "DIRECT", coverages: [{ coverage_code: "ODD", tier: "STD" }, { coverage_code: "ODD", tier: "STD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "Quote.${q_id}.quoted_premium_cents == 60000 (30000 + 30000 per-line rounded)"
            - "Quote.${q_id}.quoted_premium_cents != 59999 (the rejected sum-then-round order)"

      - name: premium_floor_applied_after_sum
        claim_type: constants_applied
        grounds:
          - calculations.channel_quote_premium
          - entities.CarrierProduct.fields.min_premium_cents
        distinguishing_aspect: "min_premium is a POST-SUM floor: a single 10000 line at 0.90 computes 9000 but floors to 40000; the floor never applies per line."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-MIN ACTIVE (DIRECT; TINY STD 10000; direct_discount 0.10; min_premium 40000). Consumer."
          setup_api_calls:
            - *k_clock
            - call: "POST /products"
              payload: { product_code: "P-MIN", line_of_business: "AUTO", state_code: "TX", channel_availability: "DIRECT", coverage_rates: { TINY: { STD: 10000 } }, direct_discount_pct: 0.10, min_premium_cents: 40000 }
              as: RatingManager
              captures: { p_min: $.data.id }
            - call: "POST /products/${p_min}/activate"
              payload: {}
              as: RatingManager
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_min}", channel: "DIRECT", coverages: [{ coverage_code: "TINY", tier: "STD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          assert:
            - "Quote.${q_id}.quoted_premium_cents == 40000 (floor), not 9000 (raw line sum)"

      - name: commission_statement_includes_only_policies_bound_in_half_open_period
        claim_type: input_set_filtering
        grounds:
          - calculations.commission_earned
          - entities.CommissionStatement.fields.line_items
        distinguishing_aspect: "The statement window is half-open [period_start, period_end) over Policy.created_at: a policy bound exactly AT period_start is included; one bound exactly AT period_end is excluded (it belongs to the next window)."
        test_recipe:
          setup:
            - "P-FLAT ACTIVE (BOTH; TIER_C 99995; factors 0). Feed published. Agent A APPOINTED with flat 10% schedule."
            - "Clock 2026-01-01T00:00:00Z: policy P-IN bound. Clock 2026-02-01T00:00:00Z: policy P-OUT bound."
          setup_api_calls:
            - *k_clock
            - &k_product_flat
              call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_C: 99995 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_flat: $.data.id }
            - call: "POST /products/${p_flat}/activate"
              payload: {}
              as: RatingManager
            - *k_rater
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_flat}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_flat: $.data.id }
            - call: "POST /rate-feed-publications/${feed_flat}/publish"
              payload: {}
              as: RatingManager
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - call: "POST /agents/${agent_a}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.10 }], contingent_bonus_eligible: false, expected_agent_version: "${agent_v} + 1" }
              as: CarrierAdmin
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_C" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_in: $.data.id }
            - call: "POST /quotes/${q_in}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q_in}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol_in: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_C" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_out: $.data.id }
            - call: "POST /quotes/${q_out}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q_out}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol_out: $.data.id }
          trigger:
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { stmt_id: $.data.id }
          assert:
            - "CommissionStatement.${stmt_id}.line_items contains exactly one row, for Policy.${pol_in}"
            - "Policy.${pol_out} (bound exactly at period_end) is NOT in line_items — half-open window"
            - "written_premium_cents == 99995 and commission_cents == 10000"

      - name: loss_ratio_with_zero_earned_premium_defined_as_zero
        claim_type: correct_result
        grounds:
          - calculations.trailing_loss_ratio
          - entities.PortfolioReview.fields.trailing_loss_ratio
        distinguishing_aspect: "Empty-book rule: an agent with no policies yields trailing_loss_ratio exactly 0.0000 and earned_premium_trailing_cents 0 — defined behavior, not a division error."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent APPOINTED (TX, AUTO), no policies."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_appt_tx
            - *k_appoint
          trigger:
            - call: "POST /agents/${agent_a}/portfolio-reviews"
              payload: { reason: "scheduled review" }
              as: UnderwritingReviewer
              as_user_id: "ur-1"
              captures: { rev_id: $.data.id }
          assert:
            - "PortfolioReview.${rev_id}.trailing_loss_ratio == 0.0000"
            - "PortfolioReview.${rev_id}.earned_premium_trailing_cents == 0"
            - "PortfolioReview.${rev_id}.status == OPEN and opened_by_user_id == \"ur-1\""

      - name: telematics_score_tier_boundary_89_vs_90
        claim_type: threshold
        grounds:
          - calculations.telematics_discount_realization
        distinguishing_aspect: "Score tiers are >= based: score 90 earns 0.20 (final 36000, adjustment -9000 on a 45000 DIRECT premium written at 38250) while 89 earns 0.10 (final 40500, adjustment +2250 — a debit back of the excess up-front discount). The two adjacent scores realize OPPOSITE-signed adjustments."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE (LIABILITY BASIC 50000; direct_discount 0.10; min 0). Consumer with two bound DIRECT telematics policies, both enrollments PARTICIPATING."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol1: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q2}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol2: $.data.id }
            - call: "GET /policies/${pol1}/telematics-enrollments"
              payload: {}
              as: System
              captures: { enr1: "$.data[0].id" }
            - call: "GET /policies/${pol2}/telematics-enrollments"
              payload: {}
              as: System
              captures: { enr2: "$.data[0].id" }
            - call: "POST /telematics-enrollments/${enr1}/activate-device"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /telematics-enrollments/${enr2}/activate-device"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /telematics-enrollments/${enr1}/score"
              payload: { driving_score: 90 }
              as: System
            - call: "POST /telematics-enrollments/${enr2}/score"
              payload: { driving_score: 89 }
              as: System
          assert:
            - "TelematicsEnrollment.${enr1}: discount_pct_applied == 0.20, adjustment_cents == -9000 (final 36000 vs written 38250)"
            - "TelematicsEnrollment.${enr2}: discount_pct_applied == 0.10, adjustment_cents == 2250 (final 40500 vs written 38250 — a DEBIT back of the excess up-front discount)"
            - "the >= boundary: 90 qualifies for the high tier, 89 does not"

      - name: leakage_window_is_half_open_on_period_end
        claim_type: input_set_filtering
        grounds:
          - calculations.leakage_rate_by_channel
        distinguishing_aspect: "The leakage cohort window is half-open [period_start, period_end): a quote quoted at exactly period_end is NOT in the cohort, even though it is still unbound."
        test_recipe:
          setup:
            - "P-AUTO ACTIVE (LIABILITY BASIC 50000; direct_discount 0.10; min 0). Consumer."
            - "Clock 2026-03-01T00:00:00Z: quote Q-IN submitted (45000). Clock 2026-04-01T00:00:00Z: quote Q-OUT submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CarrierAdmin
            - *k_product_auto
            - *k_product_auto_activate
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_in: $.data.id }
            - call: "POST /quotes/${q_in}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_out: $.data.id }
            - call: "POST /quotes/${q_out}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "GET /leakage-reports/quote-to-bind"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "COUNT", channel: "DIRECT" }
              as: RatingManager
          assert:
            - "channels[DIRECT].cohort_count == 1 (only ${q_in}; ${q_out} quoted exactly at period_end is excluded)"
            - "channels[DIRECT].leaked_count == 1 and leakage == 1.0000 (the single cohort member never bound before period_end)"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role or existence checks."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /agents"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "a header-less request is rejected at priority 1 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and status 400"

      - name: wrong_role_and_unknown_id_returns_forbidden_before_not_found
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_auth
          - validations.priority_5_existence
        distinguishing_aspect: "A Consumer calling POST /products/{unknown}/activate violates role (priority 2) and existence (priority 5); the role error wins — 403 ERR_FORBIDDEN_FOR_ROLE, never 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. One consumer registered; the product id does not exist."
          setup_api_calls:
            - *k_clock
            - *k_consumer
          trigger:
            - call: "POST /products/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE (authorization precedes existence)"

      - name: agent_quote_without_state_appointment_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_7_business_safety
          - errors.ERR_AGENT_NOT_APPOINTED_IN_STATE
          - state_machines.Quote.REFERRED_TO_AGENT_to_AGENT_QUOTED
        distinguishing_aspect: "The agent holds an ACTIVE appointment for (OK, AUTO) but the referred quote's product is filed in TX: agent-quote fails ERR_AGENT_NOT_APPOINTED_IN_STATE — the appointment must match the product's (state_code, line_of_business), not just any appointment."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE (state TX). Agent APPOINTED with appointment (OK, AUTO) only. Consumer with QUOTED DIRECT quote referred to the agent."
          setup_api_calls:
            - *k_clock
            - *k_product_auto
            - *k_product_auto_activate
            - *k_agent
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "OK", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - *k_appoint
            - *k_consumer
            - *k_quote_draft
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "POST /quotes/${q_id}/refer-to-agent"
              payload: { agent_id: "${agent_a}" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
          assert:
            - "refer-to-agent fails 409 ERR_AGENT_NOT_APPOINTED_IN_STATE (the OK appointment does not cover the TX product)"
            - "Quote.${q_id} remains QUOTED with agent_id null"

      - name: premium_cap_exceeded_on_direct_submit
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_business_fiscal
          - errors.ERR_PREMIUM_CAP_EXCEEDED
        distinguishing_aspect: "DIRECT premium 126000 exceeds the product's direct_channel_max_premium_cents 100000: submit fails ERR_PREMIUM_CAP_EXCEEDED; the cap does not apply to the AGENT channel."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-CAP ACTIVE (BOTH; LIABILITY BASIC 50000; COLLISION STANDARD 90000; direct_discount 0.10; agent_load 0.15; min 0; direct cap 100000). Feed published. Agent APPOINTED (TX, AUTO). Consumer."
          setup_api_calls:
            - *k_clock
            - call: "POST /products"
              payload: { product_code: "P-CAP", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000 }, COLLISION: { STANDARD: 90000 } }, direct_discount_pct: 0.10, agent_load_pct: 0.15, min_premium_cents: 0, direct_channel_max_premium_cents: 100000 }
              as: RatingManager
              captures: { p_cap: $.data.id }
            - call: "POST /products/${p_cap}/activate"
              payload: {}
              as: RatingManager
            - *k_rater
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_cap}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "c" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_cap: $.data.id }
            - call: "POST /rate-feed-publications/${feed_cap}/publish"
              payload: {}
              as: RatingManager
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - *k_consumer
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_cap}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_d: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_cap}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_a: $.data.id }
          trigger:
            - call: "POST /quotes/${q_d}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { err: $.data.error_id }
            - call: "POST /quotes/${q_a}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
          assert:
            - "DIRECT submit fails 409 ERR_PREMIUM_CAP_EXCEEDED (126000 > 100000) — the anti-conflict cap"
            - "AGENT submit of identical coverages succeeds with quoted_premium_cents == 161000 (cap is DIRECT-only)"

      - name: statement_period_overlapping_finalized_statement_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_STATEMENT_PERIOD_OVERLAP
        distinguishing_aspect: "A new statement window overlapping a FINALIZED statement of the same agent fails ERR_STATEMENT_PERIOD_OVERLAP; overlapping a mere DRAFT statement is allowed."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Agent APPOINTED (TX, AUTO). Statement S1 for January generated and FINALIZED (zero-net is fine for finalize)."
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_appt_tx
            - *k_appoint
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { stmt1: $.data.id }
            - call: "POST /commission-statements/${stmt1}/finalize"
              payload: {}
              as: CarrierAdmin
          trigger:
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z" }
              as: CarrierAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_STATEMENT_PERIOD_OVERLAP"
            - "GET /agents/${agent_a}/commission-statements still returns exactly 1 row"

      - name: bundle_placement_on_non_eligible_product_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_9_business_referential
          - errors.ERR_BUNDLE_NOT_ELIGIBLE
