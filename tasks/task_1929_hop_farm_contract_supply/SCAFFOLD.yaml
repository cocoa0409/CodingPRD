# =============================================================================
# Task 1929 — Hop Farm & Contract Supply (Yakima Valley hop grower)
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design (§1.9) lives in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1929. Hop Farm & Contract Supply (Yakima Valley hop grower): acreage/variety
  planting plan & multi-year contract, harvest scheduling & kiln drying,
  alpha-acid testing & contract price adjustment, pelletizing & cold storage
  lot management, contract shortfall & pro-rata allocation, spot market sales
  & inventory carry, brewery sample & selection process, crop insurance &
  yield risk

domain_name: hop-farm-contract-supply
api_prefix: /api

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite pellet inventory allocated pro-rata across multi-year contracts
  secondary_archetype: pricing_engine        # alpha-acid adjusted contract pricing
  complexity_layers:
    - optimistic_concurrency                 # OCC on Contract.version for amendments
    - dual_variant_calculation               # provisional-vs-final alpha pricing; projected-vs-actual indemnity
    - cascading_side_effects                 # lab finalize regrades lot -> blend -> allocation; shortfall defaults contract
    - rate_threshold_triggers                # consecutive-shortfall counter flips contract to DEFAULTED at 2
  entity_topology: flat                      # peer entities joined by FK references; flat /api/<resource> paths
  state_machine_shape: cyclic                # kiln redry loop, contract suspend/reinstate loop, sample resend loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # claim filer (FarmManager user id) cannot review/decide/pay own claim
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Field/block name" }
      - { name: acreage, type: integer, source: input, description: "Total plantable acres; must be > 0" }

  - name: Kiln
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Kiln identifier (physical drying kiln resource)" }

  - name: PlantingPlan
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id" }
      - { name: crop_year, type: integer, source: input, description: "Crop year this plan covers (e.g. 2026)" }
      - { name: variety, type: enum, source: input, description: "CASCADE | CENTENNIAL | CTZ | CITRA | MOSAIC" }
      - { name: planned_acreage, type: integer, source: input, description: "Acres planted under this plan; must be >= 1 and <= field.acreage" }
      - { name: projected_yield_lbs, type: integer, source: computed, description: "planned_acreage x variety base yield (calculation projected_yield)" }
      - { name: actual_yield_lbs, type: integer, source: computed, description: "Sum of dried_lbs of linked HarvestLots in {DRIED, CONSUMED}; null until COMPLETE", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | GROWING | HARVESTING | COMPLETE | CANCELLED", default: DRAFT }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: brewery_name, type: string, source: input, description: "Counterparty brewery" }
      - { name: variety, type: enum, source: input, description: "CASCADE | CENTENNIAL | CTZ | CITRA | MOSAIC" }
      - { name: term_start_year, type: integer, source: input, description: "First crop year covered (inclusive)" }
      - { name: term_end_year, type: integer, source: input, description: "Last crop year covered (inclusive); must be >= term_start_year" }
      - { name: annual_volume_lbs, type: integer, source: input, description: "Contracted pellets lbs per crop year; must be > 0" }
      - { name: base_price_cents_per_lb, type: integer, source: input, description: "Base price per lb before alpha adjustment; must be > 0" }
      - { name: alpha_floor_pct, type: number, source: input, description: "Contract alpha-acid floor in percent (e.g. 12.0); must be > 0" }
      - { name: alpha_premium_cents_per_point, type: integer, source: input, description: "Cents added per 1.0 percentage point of alpha above the floor; must be >= 0" }
      - { name: alpha_discount_cents_per_point, type: integer, source: input, description: "Cents subtracted per 1.0 percentage point of alpha below the floor; must be >= 0" }
      - { name: consecutive_shortfall_years, type: integer, source: computed, description: "Consecutive settled crop years with shortfall; resets to 0 on a fully-delivered settled year; reaching 2 auto-defaults the contract", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | COMPLETED | DEFAULTED | TERMINATED", default: DRAFT }

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - { name: planting_plan_id, type: string, source: input, description: "FK -> PlantingPlan.id" }
      - { name: kiln_id, type: string, source: system, description: "FK -> Kiln.id; null until load-kiln", default: null }
      - { name: variety, type: enum, source: system, description: "Copied from the planting plan at creation (denormalized for filtering)" }
      - { name: crop_year, type: integer, source: system, description: "Copied from the planting plan at creation" }
      - { name: wet_lbs, type: integer, source: input, description: "Green (wet) weight at harvest; must be > 0" }
      - { name: dried_lbs, type: integer, source: system, description: "Kiln-dried weight recorded at finish-drying; null until then", default: null }
      - { name: moisture_pct, type: number, source: computed, description: "Computed by kiln_moisture at finish-drying/redry; null until first finish-drying", default: null }
      - { name: alpha_pct_provisional, type: number, source: computed, description: "Alpha from the most recently posted PROVISIONAL LabTest; null until one posts", default: null }
      - { name: alpha_pct_final, type: number, source: computed, description: "Alpha from the FINAL LabTest; null until one posts; at most one FINAL per lot", default: null }
      - { name: kiln_window_start, type: datetime, source: system, description: "Occupation window start recorded at load-kiln/redry; null until loaded", default: null }
      - { name: kiln_window_end, type: datetime, source: system, description: "Occupation window end; null until loaded", default: null }
      - { name: status, type: enum, source: system, description: "HARVESTED | IN_KILN | MOISTURE_CHECK | DRIED | CONSUMED", default: HARVESTED }

  - name: LabTest
    parent: null
    common_fields: false
    fields:
      - { name: harvest_lot_id, type: string, source: input, description: "FK -> HarvestLot.id" }
      - { name: test_type, type: enum, source: input, description: "PROVISIONAL | FINAL" }
      - { name: alpha_pct, type: number, source: input, description: "Measured alpha-acid percent (e.g. 12.5); must be > 0 and <= 25" }

  - name: PelletLot
    parent: null
    common_fields: true
    fields:
      - { name: source_lot_ids, type: array, source: input, description: "FK -> HarvestLot.id (array of source lots consumed by pelletizing); min 1 item" }
      - { name: variety, type: enum, source: system, description: "Copied from source lots (all must match)" }
      - { name: crop_year, type: integer, source: system, description: "Copied from source lots (all must match)" }
      - { name: qty_lbs, type: integer, source: computed, description: "Pelletized quantity after 8% processing loss (calculation pellet_blend; aggregate-then-round order)" }
      - { name: blended_alpha_pct, type: number, source: computed, description: "Weight-weighted alpha of source lots (alpha_pct_final if set else alpha_pct_provisional); recomputed on regrade and on carryover decay" }
      - { name: storage_room, type: string, source: input, description: "Cold storage room identifier" }
      - { name: entered_storage_at, type: datetime, source: system, description: "Logical-clock timestamp at pelletize time" }
      - { name: inventory_status, type: enum, source: system, description: "AVAILABLE | RESERVED | SOLD | DELIVERED (independent of age_class)", default: AVAILABLE }
      - { name: age_class, type: enum, source: system, description: "CURRENT | CARRYOVER (independent of inventory_status)", default: CURRENT }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; set by the allocation run" }
      - { name: crop_year, type: integer, source: system, description: "Crop year of the run that created this allocation" }
      - { name: variety, type: enum, source: system, description: "Copied from the contract" }
      - { name: allocated_lbs, type: integer, source: computed, description: "Pro-rata allocated lbs (calculation pro_rata_allocation)" }
      - { name: shortfall_lbs, type: integer, source: computed, description: "contract.annual_volume_lbs - allocated_lbs, set at run time" }
      - { name: reserved_lot_ids, type: array, source: system, description: "FK -> PelletLot.id (array; FIFO reservation made at confirm)", default: [] }
      - { name: delivered_lbs, type: integer, source: system, description: "Sum of reserved lot qty_lbs at delivery; 0 until deliver", default: 0 }
      - { name: delivered_lot_ids, type: array, source: system, description: "FK -> PelletLot.id (array; set at deliver)", default: [] }
      - { name: delivered_alpha_pct, type: number, source: computed, description: "qty-weighted blended_alpha_pct over delivered lots; recomputed on regrade cascade; null until deliver", default: null }
      - { name: estimated_unit_price_cents, type: integer, source: computed, description: "Provisional-variant alpha-adjusted price at deliver/regrade time; null until deliver", default: null }
      - { name: delivery_shortfall_lbs, type: integer, source: system, description: "allocated_lbs - delivered_lbs, set at settle; null until settle", default: null }
      - { name: unit_price_cents, type: integer, source: computed, description: "Final-variant alpha-adjusted price, set at settle; null until settle", default: null }
      - { name: settlement_total_cents, type: integer, source: computed, description: "delivered_lbs x unit_price_cents, set at settle; null until settle", default: null }
      - { name: status, type: enum, source: system, description: "PROJECTED | CONFIRMED | DELIVERED | SETTLED | CANCELLED", default: PROJECTED }

  - name: SpotSale
    parent: null
    common_fields: true
    fields:
      - { name: pellet_lot_id, type: string, source: input, description: "FK -> PelletLot.id" }
      - { name: buyer_name, type: string, source: input, description: "Spot buyer (brewery)" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Negotiated spot price; must be > 0" }
      - { name: buyer_credit_limit_cents, type: integer, source: input, description: "Buyer-declared credit limit enforced at confirm; must be >= 0" }
      - { name: qty_lbs, type: integer, source: system, description: "Whole-lot quantity snapshot taken at draft time" }
      - { name: sale_total_cents, type: integer, source: computed, description: "qty_lbs x price_cents_per_lb, set at confirm; null until confirm", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | CANCELLED", default: DRAFT }

  - name: BrewerySample
    parent: null
    common_fields: true
    fields:
      - { name: pellet_lot_id, type: string, source: input, description: "FK -> PelletLot.id" }
      - { name: brewery_name, type: string, source: input, description: "Evaluating brewery" }
      - { name: sample_round, type: integer, source: system, description: "1 + count of all prior samples for the same (pellet_lot_id, brewery_name) pair" }
      - { name: status, type: enum, source: system, description: "SENT | SELECTED | REJECTED", default: SENT }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: planting_plan_id, type: string, source: input, description: "FK -> PlantingPlan.id" }
      - { name: price_election_cents_per_lb, type: integer, source: input, description: "Insured price election; must be > 0" }
      - { name: coverage_pct, type: number, source: input, description: "Coverage share of the guarantee yield (0 < coverage_pct <= 1)", default: 0.75 }
      - { name: guarantee_lbs, type: integer, source: computed, description: "round_half_up(planned_acreage x variety base yield x coverage_pct) at filing" }
      - { name: indemnity_estimate_cents, type: integer, source: computed, description: "Preliminary variant: max(0, guarantee_lbs - projected_yield_lbs) x price_election, fixed at filing" }
      - { name: filed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the filer; segregation-of-duties anchor" }
      - { name: indemnity_final_cents, type: integer, source: computed, description: "Final variant: max(0, guarantee_lbs - actual_yield_lbs) x price_election, set at pay; null until pay", default: null }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | PAID", default: FILED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlantingPlan
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: GROWING
        trigger: "POST /api/planting-plans/{id}/approve"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: GROWING
        to: DRAFT
        trigger: "POST /api/planting-plans/{id}/revise"
        actor: FarmManager
        preconditions:
          - "No linked HarvestLot exists (any status)"
        side_effects: []
        note: "branching-with-revert: plan can be sent back to DRAFT for revision before any harvest lot exists"
      - from: GROWING
        to: HARVESTING
        trigger: "POST /api/planting-plans/{id}/open-harvest"
        actor: FarmManager
        preconditions: []
        side_effects: []
      - from: HARVESTING
        to: COMPLETE
        trigger: "POST /api/planting-plans/{id}/complete"
        actor: FarmManager
        preconditions:
          - "No linked HarvestLot in {HARVESTED, IN_KILN, MOISTURE_CHECK} (kiln pipeline must be empty; DRIED and CONSUMED lots are allowed)"
        side_effects:
          - "actual_yield_lbs = sum of dried_lbs over linked HarvestLots with status in {DRIED, CONSUMED}"
          - "For each linked InsuranceClaim with status in {FILED, UNDER_REVIEW, APPROVED}: no field mutation (indemnity_estimate_cents stays the preliminary filing-time value; the final variant is computed at pay)"
      - from: [DRAFT, GROWING]
        to: CANCELLED
        trigger: "POST /api/planting-plans/{id}/cancel"
        actor: FarmManager
        preconditions:
          - "No linked HarvestLot exists (any status)"
        side_effects: []

  - entity: Contract
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, DEFAULTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/activate"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/contracts/{id}/suspend"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "Non-destructive gate only: no allocation state changes; confirm/deliver on this contract's allocations are rejected with ERR_CONTRACT_NOT_ACTIVE while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/reinstate"
        actor: ContractManager
        preconditions: []
        side_effects: []
        note: "cyclic: ACTIVE <-> SUSPENDED loop is allowed repeatedly"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (allocation settle raises consecutive_shortfall_years to 2)"
        actor: system
        preconditions:
          - "consecutive_shortfall_years reaches 2 after a settle"
        side_effects:
          - "All of this contract's Allocations with status in {PROJECTED, CONFIRMED} -> CANCELLED"
          - "For each such CONFIRMED allocation: its reserved PelletLots (reserved_lot_ids) with inventory_status RESERVED -> AVAILABLE"
      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "All of this contract's Allocations with status in {PROJECTED, CONFIRMED, DELIVERED} -> CANCELLED (DELIVERED allocations keep delivered_lbs/delivered_lot_ids as a historical record and do NOT release their lots)"
          - "For each such CONFIRMED allocation: its reserved PelletLots with inventory_status RESERVED -> AVAILABLE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (POST /api/ops/crop-year-rollover when term_end_year < clock year)"
        actor: system
        preconditions:
          - "Logical clock year > contract.term_end_year"
        side_effects:
          - "All of this contract's Allocations with status in {PROJECTED, CONFIRMED} -> CANCELLED; CONFIRMED allocations release their reserved PelletLots RESERVED -> AVAILABLE"

  - entity: HarvestLot
    field: status
    initial_state: HARVESTED
    terminal_states: [CONSUMED]
    transitions:
      - from: HARVESTED
        to: IN_KILN
        trigger: "POST /api/harvest-lots/{id}/load-kiln"
        actor: FarmManager
        preconditions:
          - "kiln window [kiln_window_start, kiln_window_end) does not violate the 30-minute buffer rule against any other HarvestLot with the same kiln_id and status in {IN_KILN, MOISTURE_CHECK} (calculation kiln_window_conflict)"
        side_effects:
          - "Sets kiln_id, kiln_window_start, kiln_window_end"
      - from: IN_KILN
        to: MOISTURE_CHECK
        trigger: "POST /api/harvest-lots/{id}/finish-drying"
        actor: FarmManager
        preconditions:
          - "dried_lbs satisfies ceil(0.24 x wet_lbs) <= dried_lbs <= wet_lbs (else ERR_WEIGHT_IMPOSSIBLE)"
        side_effects:
          - "Sets dried_lbs; computes moisture_pct (calculation kiln_moisture)"
      - from: MOISTURE_CHECK
        to: IN_KILN
        trigger: "POST /api/harvest-lots/{id}/redry"
        actor: FarmManager
        preconditions:
          - "moisture_pct > 10.0 (a lot already at or below the release threshold cannot redry; use release instead)"
          - "New kiln window satisfies the same 30-minute buffer rule as load-kiln"
        side_effects:
          - "Updates kiln_window_start, kiln_window_end to the new window"
        note: "cyclic redry loop: IN_KILN -> MOISTURE_CHECK -> IN_KILN may repeat"
      - from: MOISTURE_CHECK
        to: DRIED
        trigger: "POST /api/harvest-lots/{id}/release"
        actor: FarmManager
        preconditions:
          - "moisture_pct <= 10.0 (else ERR_MOISTURE_UNSAFE)"
        side_effects:
          - "Lot stops occupying the kiln (its window no longer participates in the buffer rule)"
      - from: DRIED
        to: CONSUMED
        trigger: "system (POST /api/pellet-lots lists this lot in source_lot_ids)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot feeds pellet_blend; its alpha fields remain for downstream regrade"

  - entity: PelletLot
    field: inventory_status
    initial_state: AVAILABLE
    terminal_states: [SOLD, DELIVERED]
    note: "parallel state dimensions: inventory_status (AVAILABLE|RESERVED|SOLD|DELIVERED) evolves independently of age_class (CURRENT|CARRYOVER)"
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /api/spot-sales (draft) or POST /api/allocations/{id}/confirm (FIFO reservation)"
        actor: "ContractManager or system"
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /api/spot-sales/{id}/cancel, POST /api/allocations/{id}/cancel, or system (contract terminate/default/complete cascade)"
        actor: "ContractManager or system"
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: SOLD
        trigger: "POST /api/spot-sales/{id}/confirm"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: DELIVERED
        trigger: "POST /api/allocations/{id}/deliver (lot was in the allocation's reserved_lot_ids)"
        actor: ContractManager
        preconditions: []
        side_effects: []

  - entity: PelletLotAgeClass
    field: age_class
    initial_state: CURRENT
    terminal_states: [CARRYOVER]
    note: "second (parallel) dimension of PelletLot; CARRYOVER is absorbing"
    transitions:
      - from: CURRENT
        to: CARRYOVER
        trigger: "system (POST /api/ops/crop-year-rollover when lot.crop_year < logical clock year)"
        actor: system
        preconditions:
          - "inventory_status in {AVAILABLE, RESERVED} (SOLD and DELIVERED lots have left the warehouse)"
        side_effects:
          - "blended_alpha_pct = carryover_decay(blended_alpha_pct, months between entered_storage_at and the logical clock)"

  - entity: Allocation
    field: status
    initial_state: PROJECTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PROJECTED
        to: CONFIRMED
        trigger: "POST /api/allocations/{id}/confirm"
        actor: ContractManager
        preconditions:
          - "Contract.status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "FIFO reservation: walk PelletLots with variety == contract.variety AND inventory_status == AVAILABLE, ordered by entered_storage_at ASC with tie-break created_at ASC; reserve a lot iff cumulative reserved lbs + lot.qty_lbs <= allocated_lbs; stop when cumulative == allocated_lbs or the pool is exhausted; reserved lots -> RESERVED and are recorded in reserved_lot_ids"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /api/allocations/{id}/deliver"
        actor: ContractManager
        preconditions:
          - "reserved_lot_ids is non-empty (else ERR_EMPTY_DELIVERY)"
        side_effects:
          - "delivered_lot_ids = reserved_lot_ids; delivered_lbs = sum(qty_lbs of reserved lots)"
          - "Each reserved PelletLot -> DELIVERED"
          - "delivered_alpha_pct = qty-weighted blended_alpha_pct over delivered lots (2 dp, round_half_up)"
          - "estimated_unit_price_cents = alpha_price_adjustment provisional variant over delivered_alpha_pct"
      - from: DELIVERED
        to: SETTLED
        trigger: "POST /api/allocations/{id}/settle"
        actor: ContractManager
        preconditions:
          - "Every source HarvestLot of every delivered PelletLot has alpha_pct_final set (else ERR_FINAL_TEST_REQUIRED)"
        side_effects:
          - "delivery_shortfall_lbs = allocated_lbs - delivered_lbs"
          - "unit_price_cents = alpha_price_adjustment final variant over delivered_alpha_pct"
          - "settlement_total_cents = delivered_lbs x unit_price_cents"
          - "Contract.consecutive_shortfall_years: +1 if (shortfall_lbs + delivery_shortfall_lbs) > 0, else reset to 0; if it reaches 2 the contract auto-transitions ACTIVE -> DEFAULTED (see Contract machine)"
      - from: [PROJECTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /api/allocations/{id}/cancel or system (contract terminate/default/complete, allocation-run supersede)"
        actor: "ContractManager or system"
        preconditions: []
        side_effects:
          - "If CONFIRMED: reserved PelletLots with inventory_status RESERVED -> AVAILABLE; reserved_lot_ids cleared"

  - entity: SpotSale
    field: status
    initial_state: DRAFT
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/spot-sales/{id}/confirm"
        actor: ContractManager
        preconditions:
          - "A BrewerySample with pellet_lot_id == sale.pellet_lot_id AND brewery_name == sale.buyer_name AND status == SELECTED exists (else ERR_SAMPLE_NOT_SELECTED)"
          - "qty_lbs x price_cents_per_lb <= buyer_credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "sale_total_cents = qty_lbs x price_cents_per_lb"
          - "PelletLot -> SOLD"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/spot-sales/{id}/cancel"
        actor: ContractManager
        preconditions: []
        side_effects:
          - "PelletLot RESERVED -> AVAILABLE"

  - entity: BrewerySample
    field: status
    initial_state: SENT
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: SENT
        to: SELECTED
        trigger: "POST /api/samples/{id}/decide with outcome=SELECTED"
        actor: ContractManager
        preconditions: []
        side_effects: []
      - from: SENT
        to: REJECTED
        trigger: "POST /api/samples/{id}/decide with outcome=REJECTED"
        actor: ContractManager
        preconditions: []
        side_effects: []
        note: "cyclic at the (lot, brewery) pair level: a REJECTED sample permits a new sample row with sample_round incremented"

  - entity: InsuranceClaim
    field: status
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/insurance-claims/{id}/begin-review"
        actor: InsuranceAdjuster
        preconditions:
          - "X-User-ID != claim.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/insurance-claims/{id}/decide with outcome=APPROVED"
        actor: InsuranceAdjuster
        preconditions:
          - "X-User-ID != claim.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/insurance-claims/{id}/decide with outcome=DENIED"
        actor: InsuranceAdjuster
        preconditions:
          - "X-User-ID != claim.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /api/insurance-claims/{id}/pay"
        actor: InsuranceAdjuster
        preconditions:
          - "X-User-ID != claim.filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Linked PlantingPlan.status == COMPLETE (else ERR_PLAN_NOT_COMPLETE)"
        side_effects:
          - "indemnity_final_cents = max(0, guarantee_lbs - plan.actual_yield_lbs) x price_election_cents_per_lb (final variant)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: Contract
    write_endpoint: "POST /api/contracts/{contract_id}/amendments"
    occ_field: expected_contract_version
    description: |
      Amending a Contract whose version has advanced beyond the client's last
      observed version is rejected. A contract may legitimately be amended
      repeatedly (volume/price renegotiation), so a writer working from a
      stale read would silently clobber an intervening amendment; the
      expected_contract_version check reduces this to a deterministic
      stale-version rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: projected_yield
    trigger: "planting-plan create"
    algorithm: forward_looking
    formula: |
      projected_yield_lbs = planned_acreage * VARIETY_BASE_YIELD_LBS_PER_ACRE[variety]
    input_set: "the PlantingPlan being created (variety, planned_acreage)"
    constants:
      VARIETY_BASE_YIELD_LBS_PER_ACRE: { CASCADE: 1800, CENTENNIAL: 2000, CTZ: 2200, CITRA: 1900, MOSAIC: 1700 }
    precision: "integer lbs (exact product, no rounding)"
    variants:
      - name: projected
        when: "at plan create/approve (no harvest data yet)"
        difference: "uses planned_acreage x base yield"
      - name: actual
        when: "at plan complete"
        difference: "actual_yield_lbs = sum of dried_lbs over linked HarvestLots with status in {DRIED, CONSUMED}; generally different from projected"

  - name: kiln_moisture
    trigger: "harvest-lot finish-drying (and each redry cycle's finish-drying)"
    algorithm: threshold
    formula: |
      moisture_pct = round_half_up((dried_lbs - BONE_DRY_FLOOR_FRACTION * wet_lbs) / dried_lbs * 100, 1)
      Release gate: moisture_pct <= MOISTURE_RELEASE_MAX_PCT (10.0) else ERR_MOISTURE_UNSAFE on release;
      redry gate: moisture_pct > MOISTURE_RELEASE_MAX_PCT else redry rejected with ERR_INVALID_STATE.
      Feasibility: ceil(BONE_DRY_FLOOR_FRACTION * wet_lbs) <= dried_lbs <= wet_lbs else ERR_WEIGHT_IMPOSSIBLE.
    input_set: "the HarvestLot being finished (wet_lbs, input dried_lbs)"
    constants:
      INITIAL_WATER_FRACTION: 0.76
      BONE_DRY_FLOOR_FRACTION: 0.24
      MOISTURE_RELEASE_MAX_PCT: 10.0
    precision: "1 decimal place, round_half_up"

  - name: pellet_blend
    trigger: "POST /api/pellet-lots; also recomputed (blended_alpha_pct only) when a source lot's FINAL lab test posts (regrade) and when carryover_decay fires at rollover"
    algorithm: aggregation
    formula: |
      alpha_eff(lot) = lot.alpha_pct_final if set else lot.alpha_pct_provisional
      PINNED ROUNDING ORDER (aggregate-then-round; NOT per-lot-then-sum):
        qty_lbs = round_half_up(sum(dried_lbs over source lots) * (1 - PROCESSING_LOSS_PCT), 0)
        blended_alpha_pct = round_half_up(sum(dried_i * alpha_eff_i) / sum(dried_i), 2)
      Per-lot rounding (sum(round_half_up(dried_i * 0.92, 0))) is a different, forbidden order:
      e.g. dried 104 + 104 -> per-lot 96 + 96 = 192 but pinned order yields
      round_half_up(208 * 0.92, 0) = round_half_up(191.36) = 191.
    input_set: "source HarvestLots listed in source_lot_ids (all DRIED, same variety, same crop_year)"
    constants:
      PROCESSING_LOSS_PCT: 0.08
    precision: "qty_lbs integer (round_half_up at 0 dp); blended_alpha_pct 2 decimal places, round_half_up, applied once after aggregation"

  - name: alpha_price_adjustment
    trigger: "allocation deliver (provisional variant -> estimated_unit_price_cents), lab-test FINAL regrade (recompute estimated_unit_price_cents on pre-SETTLED delivered allocations), allocation settle (final variant -> unit_price_cents)"
    algorithm: tiered_pricing
    formula: |
      points = alpha - contract.alpha_floor_pct        (alpha in percent, e.g. 12.75)
      if alpha >= contract.alpha_floor_pct:
        unit_price_cents = base_price_cents_per_lb + points * alpha_premium_cents_per_point
      else:
        unit_price_cents = max(MIN_PRICE_CENTS_PER_LB,
                               base_price_cents_per_lb - (contract.alpha_floor_pct - alpha) * alpha_discount_cents_per_point)
      Round once at the end to integer cents, round_half_up.
      Boundary: alpha == floor exactly -> unit_price_cents == base_price_cents_per_lb (no premium, no discount).
    input_set: "the Allocation's delivered_alpha_pct and its Contract's pricing fields"
    constants:
      MIN_PRICE_CENTS_PER_LB: 100
    precision: "integer cents, round_half_up applied once at the end"
    variants:
      - name: provisional
        when: "at deliver and on regrade (allocation not yet SETTLED)"
        difference: "uses delivered_alpha_pct computed from alpha_eff (final alpha where posted, provisional otherwise); a pending final test can still move the number"
      - name: final
        when: "at settle"
        difference: "requires every source lot's alpha_pct_final to be set (ERR_FINAL_TEST_REQUIRED otherwise); same formula over delivered_alpha_pct, but the alpha inputs are now purely final, so the result diverges from the provisional estimate whenever a final alpha differed from the provisional"

  - name: pro_rata_allocation
    trigger: "POST /api/allocation-runs"
    algorithm: waterfall_allocation
    formula: |
      contracted_total_lbs = sum(annual_volume_lbs) over eligible contracts
      available_lbs = sum(qty_lbs) over eligible PelletLots
      If available_lbs >= contracted_total_lbs: every contract allocated_lbs = annual_volume_lbs (shortfall_lbs = 0).
      Else per contract i:
        exact_i = available_lbs * volume_i / contracted_total_lbs
        allocated_i = floor(exact_i)
        remainder = available_lbs - sum(allocated_i)
        Distribute remainder one lb at a time to contracts ordered by
        fractional part (exact_i - floor(exact_i)) DESC, tie-break contract.created_at ASC,
        until remainder is exhausted.
      shortfall_i = volume_i - allocated_i.
      Invariants: allocated_i + shortfall_i == volume_i for every i;
      sum(allocated_i) == min(available_lbs, contracted_total_lbs).
    input_set: "contracts with status == ACTIVE AND variety == run.variety AND term_start_year <= run.crop_year <= term_end_year AND no existing non-terminal (PROJECTED|CONFIRMED|DELIVERED) allocation for (contract, crop_year); PelletLots with variety == run.variety AND inventory_status == AVAILABLE (any age_class, any crop_year)"
    precision: "integer lbs; floor for base shares; remainder distribution order pinned above"

  - name: allocation_run_supersede
    trigger: "POST /api/allocation-runs for a (crop_year, variety) pair that already has PROJECTED allocations"
    algorithm: constraint_propagation
    formula: |
      Before creating new allocations: existing PROJECTED allocations for (crop_year, variety) -> CANCELLED.
      Allocations in {CONFIRMED, DELIVERED, SETTLED} are untouched, and their contracts are excluded
      from the new run's input set (they already hold a live allocation for the year).
    input_set: "existing allocations for the run's (crop_year, variety)"

  - name: indemnity_payment
    trigger: "insurance-claim create (preliminary variant) and pay (final variant)"
    algorithm: threshold
    formula: |
      guarantee_lbs = round_half_up(plan.planned_acreage * VARIETY_BASE_YIELD_LBS_PER_ACRE[plan.variety] * coverage_pct, 0)
      indemnity_cents = max(0, guarantee_lbs - production_lbs) * price_election_cents_per_lb
    input_set: "the claim's linked PlantingPlan"
    constants:
      VARIETY_BASE_YIELD_LBS_PER_ACRE: { CASCADE: 1800, CENTENNIAL: 2000, CTZ: 2200, CITRA: 1900, MOSAIC: 1700 }
    precision: "guarantee_lbs integer (round_half_up at 0 dp); indemnity integer cents (exact product)"
    variants:
      - name: preliminary
        when: "at filing; production_lbs := plan.projected_yield_lbs"
        difference: "uses the projected (forward-looking) yield; stored as indemnity_estimate_cents and NOT recomputed later"
      - name: final
        when: "at pay; production_lbs := plan.actual_yield_lbs (plan must be COMPLETE)"
        difference: "uses actual kiln-dried production; diverges from preliminary whenever actual != projected"

  - name: carryover_decay
    trigger: "POST /api/ops/crop-year-rollover"
    algorithm: decay_function
    formula: |
      months_stored = full calendar months between lot.entered_storage_at and the logical clock
      decay_months = max(0, months_stored - STORAGE_GRACE_MONTHS)
      blended_alpha_pct = round_half_up(blended_alpha_pct * (1 - MONTHLY_DECAY_RATE)^decay_months, 2)
      Applied once, at the CURRENT -> CARRYOVER flip; already-CARRYOVER lots are not decayed again.
    input_set: "PelletLots with age_class == CURRENT AND crop_year < clock year AND inventory_status in {AVAILABLE, RESERVED}"
    constants:
      STORAGE_GRACE_MONTHS: 6
      MONTHLY_DECAY_RATE: 0.01
    precision: "2 decimal places, round_half_up"

  - name: kiln_window_conflict
    trigger: "harvest-lot load-kiln and redry"
    algorithm: interval_merge
    formula: |
      New half-open window [s, e) on kiln K conflicts with an occupying window [s2, e2) iff
      NOT (s >= e2 + KILN_BUFFER_MINUTES minutes OR e <= s2 - KILN_BUFFER_MINUTES minutes).
      Occupying set: HarvestLots with kiln_id == K AND status in {IN_KILN, MOISTURE_CHECK}.
      Adjacency with exactly KILN_BUFFER_MINUTES gap is allowed on both sides.
    input_set: "the lot being loaded/redried and all occupying lots on the same kiln"
    constants:
      KILN_BUFFER_MINUTES: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's allowed roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: request_shape
    check: "Required body fields present; enum values valid; integer/number ranges respected (acreage > 0, wet_lbs > 0, prices > 0, alpha_pct in (0, 25], term_end_year >= term_start_year, coverage_pct in (0, 1], kiln_window_end > kiln_window_start, source_lot_ids min 1 item); unknown body fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: auth
    check: "Segregation of duties: X-User-ID != claim.filed_by_user_id on review/decide/pay"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/insurance-claims/{id}/begin-review, /decide, /pay"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: concurrency
    check: "expected_contract_version == contract.version on amendments"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/contracts/{id}/amendments"
  - priority: 8
    category: business_temporal
    check: "No second non-CANCELLED PlantingPlan for the same (field_id, crop_year) season slot"
    error_id: ERR_FIELD_SEASON_CONFLICT
    http_status: 409
    applies_to: "POST /api/planting-plans"
  - priority: 9
    category: business_temporal
    check: "Kiln window does not violate the 30-minute buffer rule against occupying lots on the same kiln (calculation kiln_window_conflict)"
    error_id: ERR_KILN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/harvest-lots/{id}/load-kiln, /redry"
  - priority: 10
    category: business_safety
    check: "moisture_pct <= 10.0 before releasing a lot from the kiln"
    error_id: ERR_MOISTURE_UNSAFE
    http_status: 422
    applies_to: "POST /api/harvest-lots/{id}/release"
  - priority: 11
    category: business_referential
    check: "Linked entities are in a usable state: plan HARVESTING for lot creation; source lots DRIED for pelletize; SELECTED sample for spot confirm; contract ACTIVE for allocation confirm; prior PROVISIONAL test before a FINAL; all source finals set before settle; plan COMPLETE before claim pay"
    error_id: "ERR_INVALID_STATE | ERR_LOT_NOT_DRIED | ERR_SAMPLE_NOT_SELECTED | ERR_CONTRACT_NOT_ACTIVE | ERR_PROVISIONAL_REQUIRED | ERR_FINAL_TEST_REQUIRED | ERR_PLAN_NOT_COMPLETE"
    http_status: "422 (ERR_INVALID_STATE and ERR_CONTRACT_NOT_ACTIVE return 409 per the error catalog)" 
    applies_to: "POST /api/harvest-lots, /api/pellet-lots, /api/spot-sales/{id}/confirm, /api/allocations/{id}/confirm, /api/lab-tests, /api/allocations/{id}/settle, /api/insurance-claims/{id}/pay"
  - priority: 12
    category: business_constraint
    check: "Aggregate/uniqueness constraints: planned_acreage <= field.acreage; dried_lbs within feasible range; source lots share variety and crop_year; at most one FINAL test per lot; at most one open (FILED|UNDER_REVIEW|APPROVED) claim per plan"
    error_id: "ERR_ACREAGE_EXCEEDED | ERR_WEIGHT_IMPOSSIBLE | ERR_MIXED_VARIETY | ERR_MIXED_CROP_YEAR | ERR_DUPLICATE_FINAL_TEST | ERR_DUPLICATE_CLAIM"
    http_status: 422
    applies_to: "POST /api/planting-plans, /api/harvest-lots/{id}/finish-drying, /api/pellet-lots, /api/lab-tests, /api/insurance-claims"
  - priority: 13
    category: business_fiscal
    check: "qty_lbs x price_cents_per_lb <= buyer_credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /api/spot-sales/{id}/confirm"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Fields ---
  - { method: POST, path: "/api/fields", description: "Create a field", roles: [FarmManager], code: 201, input: [name, acreage], output: Field, side_effects: [] }
  - { method: GET, path: "/api/fields/{field_id}", description: "Get a field", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: Field, side_effects: [] }

  # --- Kilns ---
  - { method: POST, path: "/api/kilns", description: "Create a kiln", roles: [FarmManager], code: 201, input: [name], output: Kiln, side_effects: [] }
  - { method: GET, path: "/api/kilns/{kiln_id}", description: "Get a kiln", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: Kiln, side_effects: [] }

  # --- Planting plans ---
  - { method: POST, path: "/api/planting-plans", description: "Create a planting plan (status DRAFT; computes projected_yield_lbs)", roles: [FarmManager], code: 201, input: [field_id, crop_year, variety, planned_acreage], output: PlantingPlan, side_effects: ["computes projected_yield_lbs"] }
  - { method: GET, path: "/api/planting-plans/{plan_id}", description: "Get a planting plan", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: PlantingPlan, side_effects: [] }
  - { method: GET, path: "/api/planting-plans", description: "List planting plans with pagination (filtered-list reverse reachability for field_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["field_id?", "crop_year?", "status?", "limit?", "offset?"], output: "PlantingPlan[]", side_effects: [] }
  - { method: POST, path: "/api/planting-plans/{plan_id}/approve", description: "DRAFT -> GROWING", roles: [FarmManager], code: 200, input: [], output: PlantingPlan, side_effects: [] }
  - { method: POST, path: "/api/planting-plans/{plan_id}/revise", description: "GROWING -> DRAFT (requires no linked HarvestLot)", roles: [FarmManager], code: 200, input: [], output: PlantingPlan, side_effects: [] }
  - { method: POST, path: "/api/planting-plans/{plan_id}/open-harvest", description: "GROWING -> HARVESTING", roles: [FarmManager], code: 200, input: [], output: PlantingPlan, side_effects: [] }
  - { method: POST, path: "/api/planting-plans/{plan_id}/complete", description: "HARVESTING -> COMPLETE; computes actual_yield_lbs", roles: [FarmManager], code: 200, input: [], output: PlantingPlan, side_effects: ["actual_yield_lbs = sum dried_lbs of linked lots in {DRIED, CONSUMED}"] }
  - { method: POST, path: "/api/planting-plans/{plan_id}/cancel", description: "DRAFT|GROWING -> CANCELLED (requires no linked HarvestLot)", roles: [FarmManager], code: 200, input: [], output: PlantingPlan, side_effects: [] }

  # --- Contracts ---
  - { method: POST, path: "/api/contracts", description: "Create a multi-year supply contract (status DRAFT)", roles: [ContractManager], code: 201, input: [brewery_name, variety, term_start_year, term_end_year, annual_volume_lbs, base_price_cents_per_lb, alpha_floor_pct, alpha_premium_cents_per_point, alpha_discount_cents_per_point], output: Contract, side_effects: ["consecutive_shortfall_years = 0"] }
  - { method: GET, path: "/api/contracts/{contract_id}", description: "Get a contract", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{contract_id}/activate", description: "DRAFT -> ACTIVE", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{contract_id}/suspend", description: "ACTIVE -> SUSPENDED (non-destructive gate)", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{contract_id}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{contract_id}/amendments", description: "Amend contract terms (OCC-guarded; allowed from DRAFT|ACTIVE|SUSPENDED)", roles: [ContractManager], code: 200, input: [expected_contract_version, "annual_volume_lbs?", "base_price_cents_per_lb?", "alpha_floor_pct?", "alpha_premium_cents_per_point?", "alpha_discount_cents_per_point?"], output: Contract, side_effects: ["increments Contract.version by 1", "applies supplied term changes"] }
  - { method: POST, path: "/api/contracts/{contract_id}/terminate", description: "DRAFT|ACTIVE|SUSPENDED -> TERMINATED; cancels non-terminal allocations and releases their reserved lots", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["allocations in {PROJECTED, CONFIRMED, DELIVERED} -> CANCELLED", "reserved PelletLots of CONFIRMED allocations -> AVAILABLE"] }

  # --- Harvest lots ---
  - { method: POST, path: "/api/harvest-lots", description: "Create a harvest lot (status HARVESTED; plan must be HARVESTING; variety/crop_year copied from plan)", roles: [FarmManager], code: 201, input: [planting_plan_id, wet_lbs], output: HarvestLot, side_effects: [] }
  - { method: GET, path: "/api/harvest-lots/{lot_id}", description: "Get a harvest lot", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: HarvestLot, side_effects: [] }
  - { method: GET, path: "/api/harvest-lots", description: "List harvest lots (filtered-list reverse reachability for planting_plan_id and kiln_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["planting_plan_id?", "kiln_id?", "status?", "limit?", "offset?"], output: "HarvestLot[]", side_effects: [] }
  - { method: POST, path: "/api/harvest-lots/{lot_id}/load-kiln", description: "HARVESTED -> IN_KILN; sets kiln + window; 30-minute buffer rule", roles: [FarmManager], code: 200, input: [kiln_id, kiln_window_start, kiln_window_end], output: HarvestLot, side_effects: ["sets kiln_id, kiln_window_start, kiln_window_end"] }
  - { method: POST, path: "/api/harvest-lots/{lot_id}/finish-drying", description: "IN_KILN -> MOISTURE_CHECK; records dried_lbs and computes moisture_pct", roles: [FarmManager], code: 200, input: [dried_lbs], output: HarvestLot, side_effects: ["sets dried_lbs", "computes moisture_pct"] }
  - { method: POST, path: "/api/harvest-lots/{lot_id}/redry", description: "MOISTURE_CHECK -> IN_KILN with a new window (requires moisture_pct > 10.0)", roles: [FarmManager], code: 200, input: [kiln_window_start, kiln_window_end], output: HarvestLot, side_effects: ["updates kiln window"] }
  - { method: POST, path: "/api/harvest-lots/{lot_id}/release", description: "MOISTURE_CHECK -> DRIED (requires moisture_pct <= 10.0); frees the kiln window", roles: [FarmManager], code: 200, input: [], output: HarvestLot, side_effects: ["lot stops occupying the kiln"] }

  # --- Lab tests ---
  - { method: POST, path: "/api/lab-tests", description: "Post an alpha-acid test; lot must be DRIED; FINAL requires a prior PROVISIONAL; a FINAL posts alpha_pct_final and fires the regrade cascade", roles: [LabTechnician], code: 201, input: [harvest_lot_id, test_type, alpha_pct], output: LabTest, side_effects: ["PROVISIONAL: sets lot.alpha_pct_provisional (latest posted wins)", "FINAL: sets lot.alpha_pct_final; recomputes blended_alpha_pct of PelletLots containing the lot; recomputes delivered_alpha_pct and estimated_unit_price_cents of pre-SETTLED delivered Allocations containing such PelletLots"] }
  - { method: GET, path: "/api/lab-tests/{test_id}", description: "Get a lab test (immutable: no version/updated_at fields)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: LabTest, side_effects: [] }
  - { method: GET, path: "/api/lab-tests", description: "List lab tests (filtered-list reverse reachability for harvest_lot_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["harvest_lot_id?", "limit?", "offset?"], output: "LabTest[]", side_effects: [] }

  # --- Pellet lots ---
  - { method: POST, path: "/api/pellet-lots", description: "Pelletize DRIED harvest lots into a cold-storage pellet lot (AVAILABLE/CURRENT)", roles: [FarmManager], code: 201, input: [source_lot_ids, storage_room], output: PelletLot, side_effects: ["source HarvestLots DRIED -> CONSUMED", "computes qty_lbs and blended_alpha_pct (calculation pellet_blend)", "entered_storage_at = logical clock"] }
  - { method: GET, path: "/api/pellet-lots/{lot_id}", description: "Get a pellet lot", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: PelletLot, side_effects: [] }
  - { method: GET, path: "/api/pellet-lots", description: "List pellet lots with pagination (filtered-list reverse reachability for source_lot_ids)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["variety?", "inventory_status?", "age_class?", "source_lot_ids?", "limit?", "offset?"], output: "PelletLot[]", side_effects: [] }

  # --- Allocation runs & allocations ---
  - { method: POST, path: "/api/allocation-runs", description: "Run pro-rata allocation for a (crop_year, variety); supersedes PROJECTED allocations of that pair", roles: [ContractManager], code: 201, input: [crop_year, variety], output: "{ available_lbs: integer, contracted_total_lbs: integer, created_allocation_ids: string[] }", side_effects: ["supersede: existing PROJECTED allocations for (crop_year, variety) -> CANCELLED", "creates one PROJECTED Allocation per eligible ACTIVE contract (calculation pro_rata_allocation)"] }
  - { method: GET, path: "/api/allocations/{allocation_id}", description: "Get an allocation", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/api/allocations", description: "List allocations (filtered-list reverse reachability for contract_id, reserved_lot_ids, delivered_lot_ids)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["contract_id?", "crop_year?", "status?", "reserved_lot_ids?", "delivered_lot_ids?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/api/allocations/{allocation_id}/confirm", description: "PROJECTED -> CONFIRMED; FIFO-reserves AVAILABLE lots of the contract variety", roles: [ContractManager], code: 200, input: [], output: Allocation, side_effects: ["reserves PelletLots FIFO (entered_storage_at ASC, tie-break created_at ASC) while cumulative + lot.qty_lbs <= allocated_lbs", "reserved lots -> RESERVED, recorded in reserved_lot_ids"] }
  - { method: POST, path: "/api/allocations/{allocation_id}/cancel", description: "PROJECTED|CONFIRMED -> CANCELLED; releases reserved lots", roles: [ContractManager], code: 200, input: [], output: Allocation, side_effects: ["reserved PelletLots -> AVAILABLE; reserved_lot_ids cleared"] }
  - { method: POST, path: "/api/allocations/{allocation_id}/deliver", description: "CONFIRMED -> DELIVERED; consumes the reserved lots", roles: [ContractManager], code: 200, input: [], output: Allocation, side_effects: ["delivered_lot_ids = reserved_lot_ids; delivered_lbs = sum(qty_lbs)", "reserved PelletLots -> DELIVERED", "computes delivered_alpha_pct and estimated_unit_price_cents (provisional variant)"] }
  - { method: POST, path: "/api/allocations/{allocation_id}/settle", description: "DELIVERED -> SETTLED; computes final price and settlement; shortfall accrual may default the contract", roles: [ContractManager], code: 200, input: [], output: Allocation, side_effects: ["delivery_shortfall_lbs = allocated_lbs - delivered_lbs", "unit_price_cents = alpha_price_adjustment final variant", "settlement_total_cents = delivered_lbs x unit_price_cents", "Contract.consecutive_shortfall_years +1 or reset; reaching 2 -> contract DEFAULTED cascade"] }

  # --- Spot sales ---
  - { method: POST, path: "/api/spot-sales", description: "Create a whole-lot spot sale draft; lot AVAILABLE -> RESERVED", roles: [ContractManager], code: 201, input: [pellet_lot_id, buyer_name, price_cents_per_lb, buyer_credit_limit_cents], output: SpotSale, side_effects: ["qty_lbs = lot.qty_lbs snapshot", "PelletLot -> RESERVED"] }
  - { method: GET, path: "/api/spot-sales/{sale_id}", description: "Get a spot sale", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: SpotSale, side_effects: [] }
  - { method: GET, path: "/api/spot-sales", description: "List spot sales (filtered-list reverse reachability for pellet_lot_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["pellet_lot_id?", "status?", "limit?", "offset?"], output: "SpotSale[]", side_effects: [] }
  - { method: POST, path: "/api/spot-sales/{sale_id}/confirm", description: "DRAFT -> CONFIRMED (requires SELECTED sample; credit-limit check); lot -> SOLD", roles: [ContractManager], code: 200, input: [], output: SpotSale, side_effects: ["sale_total_cents = qty_lbs x price_cents_per_lb", "PelletLot -> SOLD"] }
  - { method: POST, path: "/api/spot-sales/{sale_id}/cancel", description: "DRAFT -> CANCELLED; lot RESERVED -> AVAILABLE", roles: [ContractManager], code: 200, input: [], output: SpotSale, side_effects: ["PelletLot -> AVAILABLE"] }

  # --- Brewery samples ---
  - { method: POST, path: "/api/samples", description: "Send a brewery sample (lot must be AVAILABLE or RESERVED); sample_round = prior samples for (lot, brewery) + 1", roles: [ContractManager], code: 201, input: [pellet_lot_id, brewery_name], output: BrewerySample, side_effects: [] }
  - { method: GET, path: "/api/samples/{sample_id}", description: "Get a brewery sample", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: BrewerySample, side_effects: [] }
  - { method: GET, path: "/api/samples", description: "List brewery samples (filtered-list reverse reachability for pellet_lot_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["pellet_lot_id?", "brewery_name?", "status?", "limit?", "offset?"], output: "BrewerySample[]", side_effects: [] }
  - { method: POST, path: "/api/samples/{sample_id}/decide", description: "SENT -> SELECTED | REJECTED", roles: [ContractManager], code: 200, input: [outcome], output: BrewerySample, side_effects: [] }

  # --- Insurance claims ---
  - { method: POST, path: "/api/insurance-claims", description: "File a crop insurance claim (plan must be GROWING|HARVESTING|COMPLETE); computes guarantee_lbs and preliminary indemnity_estimate_cents; records filed_by_user_id from X-User-ID", roles: [FarmManager], code: 201, input: [planting_plan_id, price_election_cents_per_lb, "coverage_pct?"], output: InsuranceClaim, side_effects: ["guarantee_lbs and indemnity_estimate_cents computed (preliminary variant)", "filed_by_user_id = X-User-ID"] }
  - { method: GET, path: "/api/insurance-claims/{claim_id}", description: "Get an insurance claim", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [], output: InsuranceClaim, side_effects: [] }
  - { method: GET, path: "/api/insurance-claims", description: "List insurance claims (filtered-list reverse reachability for planting_plan_id)", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: ["planting_plan_id?", "status?", "limit?", "offset?"], output: "InsuranceClaim[]", side_effects: [] }
  - { method: POST, path: "/api/insurance-claims/{claim_id}/begin-review", description: "FILED -> UNDER_REVIEW (segregation of duties)", roles: [InsuranceAdjuster], code: 200, input: [], output: InsuranceClaim, side_effects: [] }
  - { method: POST, path: "/api/insurance-claims/{claim_id}/decide", description: "UNDER_REVIEW -> APPROVED | DENIED (segregation of duties)", roles: [InsuranceAdjuster], code: 200, input: [outcome], output: InsuranceClaim, side_effects: [] }
  - { method: POST, path: "/api/insurance-claims/{claim_id}/pay", description: "APPROVED -> PAID (requires plan COMPLETE); computes indemnity_final_cents", roles: [InsuranceAdjuster], code: 200, input: [], output: InsuranceClaim, side_effects: ["indemnity_final_cents = max(0, guarantee_lbs - actual_yield_lbs) x price_election (final variant)"] }

  # --- Ops & clock ---
  - { method: POST, path: "/api/ops/crop-year-rollover", description: "Ops run: flips CURRENT PelletLots with crop_year < clock year to CARRYOVER with carryover_decay; completes ACTIVE contracts whose term_end_year < clock year (cancelling their non-terminal allocations and releasing reserved lots)", roles: [FarmManager], code: 200, input: [], output: "{ carried_over_lot_ids: string[], completed_contract_ids: string[] }", side_effects: ["PelletLot CURRENT -> CARRYOVER + alpha decay (inventory_status in {AVAILABLE, RESERVED} only)", "Contract ACTIVE with term_end_year < clock year -> COMPLETED + allocation cancellation cascade"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [FarmManager, LabTechnician, ContractManager, InsuranceAdjuster], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets logical clock used by entered_storage_at, carryover_decay, rollover, and contract completion"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role/X-User-ID headers or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not in the endpoint's allowed roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range value, malformed datetime, empty source_lot_ids, kiln_window_end <= kiln_window_start, or unknown body field" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim review/decide/pay attempted by X-User-ID equal to filed_by_user_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists; also: harvest-lot create when plan is not HARVESTING; sample create when lot is SOLD or DELIVERED; claim create when plan is DRAFT or CANCELLED; redry when moisture_pct <= 10.0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version != contract.version on amendments" }
  - { id: ERR_FIELD_SEASON_CONFLICT, http: 409, condition: "A non-CANCELLED PlantingPlan already exists for the same (field_id, crop_year)" }
  - { id: ERR_KILN_WINDOW_OVERLAP, http: 409, condition: "Kiln window violates the 30-minute buffer rule against an occupying lot on the same kiln" }
  - { id: ERR_MOISTURE_UNSAFE, http: 422, condition: "Release attempted with moisture_pct > 10.0" }
  - { id: ERR_WEIGHT_IMPOSSIBLE, http: 422, condition: "dried_lbs outside [ceil(0.24 x wet_lbs), wet_lbs]" }
  - { id: ERR_LOT_NOT_DRIED, http: 422, condition: "A source lot in source_lot_ids is not DRIED" }
  - { id: ERR_MIXED_VARIETY, http: 422, condition: "Source lots do not all share one variety" }
  - { id: ERR_MIXED_CROP_YEAR, http: 422, condition: "Source lots do not all share one crop_year" }
  - { id: ERR_DUPLICATE_FINAL_TEST, http: 422, condition: "A FINAL LabTest already exists for the harvest lot" }
  - { id: ERR_PROVISIONAL_REQUIRED, http: 422, condition: "FINAL test posted without any prior PROVISIONAL test on the lot" }
  - { id: ERR_FINAL_TEST_REQUIRED, http: 422, condition: "Settle attempted while some source HarvestLot of a delivered PelletLot lacks alpha_pct_final" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Allocation confirm attempted while the contract is not ACTIVE" }
  - { id: ERR_SAMPLE_NOT_SELECTED, http: 422, condition: "Spot-sale confirm without a SELECTED sample for (pellet_lot_id, buyer_name)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "qty_lbs x price_cents_per_lb exceeds buyer_credit_limit_cents at spot-sale confirm" }
  - { id: ERR_EMPTY_DELIVERY, http: 422, condition: "Deliver attempted with an empty reserved_lot_ids set" }
  - { id: ERR_ACREAGE_EXCEEDED, http: 422, condition: "planned_acreage exceeds field.acreage" }
  - { id: ERR_DUPLICATE_CLAIM, http: 422, condition: "An open (FILED|UNDER_REVIEW|APPROVED) claim already exists for the plan" }
  - { id: ERR_PLAN_NOT_COMPLETE, http: 422, condition: "Claim pay attempted while the linked plan is not COMPLETE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Grower-side operations: fields, kilns, planting plans, harvest lots, pelletizing, ops rollover, clock; files insurance claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/fields, /api/kilns, /api/planting-plans (+approve/revise/open-harvest/complete/cancel)"
      - "POST /api/harvest-lots (+load-kiln/finish-drying/redry/release)"
      - "POST /api/pellet-lots"
      - "POST /api/ops/crop-year-rollover"
      - "POST /api/insurance-claims (files the claim; cannot review/decide/pay it with the same X-User-ID)"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: LabTechnician
    description: "Quality-control lab: posts alpha-acid tests"
    identity: opaque
    exclusive_operations:
      - "POST /api/lab-tests"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ContractManager
    description: "Sales/contracts desk: contracts and amendments, allocation runs and allocation lifecycle, spot sales, brewery samples"
    identity: opaque
    exclusive_operations:
      - "POST /api/contracts (+activate/suspend/reinstate/amendments/terminate)"
      - "POST /api/allocation-runs"
      - "POST /api/allocations/{id}/confirm|cancel|deliver|settle"
      - "POST /api/spot-sales (+confirm/cancel)"
      - "POST /api/samples (+decide)"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: InsuranceAdjuster
    description: "External adjuster: reviews, decides, and pays insurance claims; barred from acting on a claim filed by the same X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /api/insurance-claims/{id}/begin-review|decide|pay"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
