  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_write_is_readable_and_every_derived_counter_moves_before_the_response_returns
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - endpoints.POST_/items/{id}/response-batches
          - endpoints.GET_/items/{id}
          - endpoints.GET_/programs/{id}
          - state_machines.Item.PRETEST_to_OPERATIONAL
          - calculations.blueprint_posture
          - endpoints.POST_/forms
          - endpoints.POST_/forms/{id}/adopt-cut-score
          - concurrency_rules.adopt-cut-score-stale-form
        distinguishing_aspect: |
          The system is synchronous with no deferred work: the response to the batch ingest
          already carries p_value 0.6000 and status OPERATIONAL, the very next read of a
          DIFFERENT entity already shows the cascaded operational_item_count 1 and
          blueprint_posture COMPLETE, the promoted item is immediately admissible in a form
          built by the following request, and the version echoed by a write is immediately valid
          as the OCC token for the next write. Any eventual-consistency implementation — a
          queued statistics recompute, a lazily refreshed counter, or a 202 response — fails at
          least one of these asserts.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, domain_specs [{D1, 100, min_operational_items 1}], psychometric_stat_basis POOLED, min_panelists 1, panel_trim_count 0) whose operational_item_count is 0, deficient_domain_codes is [D1] and blueprint_posture is DEFICIENT."
            - "One APPROVED item ${item_id} in domain D1 with p_value null, discrimination_index null and all response accumulators at zero."
            - "The logical clock is at its default 2026-08-01T00:00:00Z. No other item, form or registration exists."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX operational item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          trigger:
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { item_v: "$.data.version" }
            - call: "GET /items/${item_id}"
              payload: {}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
              as_user_id: "pan-1"
              captures: { form_v: "$.data.version" }
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "single-panelist adoption"}
              as: Psychometrician
              as_user_id: "psy-1"
          assert:
            - "trigger[0] responds 200 and its OWN response body already carries p_value == 0.6000, discrimination_index == 0.6000, stat_basis_applied == POOLED, flag_reason == null and status == OPERATIONAL"
            - "trigger[1] returns exactly the same p_value, discrimination_index, status and version == ${item_v} as trigger[0] — the read adds nothing the write had not already committed"
            - "trigger[2] returns CertificationProgram.${prog_id}.operational_item_count == 1, deficient_domain_codes == [] and blueprint_posture == COMPLETE on the request immediately after the promotion"
            - "trigger[3] responds 201 with ExamForm.${form_id}.status == ASSEMBLED, scored_item_count == 1 and no ERR_ITEM_NOT_OPERATIONAL — the promotion is already visible to another entity's validation"
            - "trigger[4] responds 200 with ExamForm.${form_id}.panel_status == RATINGS_COMPLETE and returns version == ${form_v} in the same response"
            - "trigger[5] responds 200 with status == CUT_SCORE_SET and panel_status == ADOPTED using ${form_v} straight from trigger[4]'s body — no ERR_STALE_VERSION, so the echoed version was already current"
            - "no call in the chain responds 202 and no assert above requires a retry, a delay or a second read to become true"
