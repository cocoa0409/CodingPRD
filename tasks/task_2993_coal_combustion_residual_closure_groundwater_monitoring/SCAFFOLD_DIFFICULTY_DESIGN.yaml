        grounds:
          - state_machines.MonitoringProgram.DETECTION_to_ASSESSMENT
          - state_machines.MonitoringProgram.ASSESSMENT_to_DETECTION
          - state_machines.StatisticalEvaluation.ASD_UNDER_REVIEW_to_ASD_ACCEPTED
          - calculations.next_sampling_due_date
          - entities.MonitoringProgram.fields.assessment_entered_on
        distinguishing_aspect: |
          The program returns to a state it has already occupied: DETECTION -> ASSESSMENT -> DETECTION.
          The second DETECTION visit is not the initial state — assessment_entered_on has been set and
          cleared again, sampling_frequency has gone SEMIANNUAL -> QUARTERLY -> SEMIANNUAL, the unit's
