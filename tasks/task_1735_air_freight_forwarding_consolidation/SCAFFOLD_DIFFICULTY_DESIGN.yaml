            - "captured ${err} == ERR_SHIPPER_NOT_KNOWN (business_safety, priority 6) and NOT ERR_CAPACITY_EXCEEDED (business_fiscal, priority 11)"
            - "HouseWaybill.${hwy}.status == CLEARED unchanged; FlightBooking.${bk1}.consumed_weight_kg == 0.0"

  - rule_id: boundary_precision_check
    instances:
      - name: capacity_exact_fill_allowed_overfill_rejected
        grounds:
          - validations[priority=11]
          - calculations.chargeable_weight
        distinguishing_aspect: |
          Weight-capacity boundary (metric: booked kg, endpoint: consolidate):
          consuming exactly 100% of booked weight is allowed (<=), while one
          more 0.5 kg step (the chargeable-weight rounding quantum) is rejected
          with ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; booking UA838 exactly 500.0 kg / 50.0 m3 OPEN; MAWB open"
            - "HWB-A gross 80.0 / 0.60 m3 (chargeable 100.0), HWB-B gross 400.0 / 1.0 m3 (chargeable 400.0), HWB-C gross 0.4 / 0.003 m3 (chargeable 0.5); all CLEARED"
