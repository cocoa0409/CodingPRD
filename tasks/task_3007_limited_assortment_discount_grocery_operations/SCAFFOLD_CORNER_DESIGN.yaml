        distinguishing_aspect: "POST /v1/labor-windows/{id}/confirm moves PLANNED -> CONFIRMED; confirming a CANCELLED window is rejected."
        test_recipe:
          setup: ["store with one PLANNED window"]
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/stores/${store}/labor-windows"
              payload: { aisle_zone: "Z1", role: "STOCKER", starts_at: "2026-09-07T06:00:00Z", ends_at: "2026-09-07T08:00:00Z" }
              as: StoreManager
              as_user_id: ${store}
              captures: { win: $.data.id }
          trigger:
            - call: "POST /v1/labor-windows/${win}/confirm"
              as: StoreManager
              as_user_id: ${store}
              captures: { st: $.data.status }
            - call: "POST /v1/labor-windows/${win}/cancel"
              as: StoreManager
              as_user_id: ${store}
            - call: "POST /v1/labor-windows/${win}/confirm"
              as: StoreManager
              as_user_id: ${store}
              captures: { err: $.data.error_id }
          assert:
            - "first confirm: status == CONFIRMED"
            - "confirm after cancel rejected: error_id == ERR_INVALID_STATE, HTTP 409"
      - name: cart_reconciliation_computed_read
        claim_type: computed_read
        grounds: [calculations.cart_coin_reconciliation]
        excluded_because:
          difficulty_instance: cart_insert_return_conserve_liability
          rationale: "Computed read asserted with literal aggregates in the named 1.8 instance and in cart_reconciliation_input_set_all_events."
      - name: conditional_action_clearance_only_with_stock
        claim_type: conditional_action
        grounds: [state_machines.FindsAllocation.ON_SALE_to_CLEARANCE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Clearance on a SOLD_OUT allocation (remaining 0) is rejected with ERR_INVALID_STATE; the conditional gate is remaining_quantity > 0."
        test_recipe:
          setup: ["ACTIVE FINDS product; store; buy of 1 allocated, ON_SALE, fully sold; clock inside window"]
          setup_api_calls:
            - call: "POST /v1/categories"
              payload: { code: "C1", name: "Cat One", sku_cap: 2 }
              as: CategoryManager
              captures: { cat: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", contact_email: "a@x.com" }
              as: ProcurementLead
              captures: { sup_a: $.data.id }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", contact_email: "b@x.com" }
              as: ProcurementLead
              captures: { sup_b: $.data.id }
            - call: "POST /v1/products"
              payload: { category_id: "${cat}", sku_code: "SKU-F1", name: "Find One", kind: "FINDS", shelf_ready_packaging: true, barcode_count: 3, unit_cost_cents: 100, price_cents: 199 }
              as: CategoryManager
              captures: { prod: $.data.id }
            - call: "POST /v1/tenders"
              payload: { product_id: "${prod}", bid_ceiling_cents: 1000 }
              as: ProcurementLead
              captures: { tend: $.data.id }
            - call: "POST /v1/tenders/${tend}/open"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_a}", unit_cost_cents: 700 }
              as: SupplierRep
              as_user_id: ${sup_a}
              captures: { bid_a: $.data.id }
            - call: "POST /v1/tenders/${tend}/bids"
              payload: { supplier_id: "${sup_b}", unit_cost_cents: 800 }
              as: SupplierRep
              as_user_id: ${sup_b}
              captures: { bid_b: $.data.id }
            - call: "POST /v1/bids/${bid_a}/panels"
              payload: { sample_code: "BLIND-A1" }
              as: QualityAssuranceLead
              captures: { pan_a: $.data.id }
            - call: "POST /v1/panels/${pan_a}/score"
              payload: { score: 80 }
              as: QualityAssuranceLead
            - call: "POST /v1/bids/${bid_b}/panels"
              payload: { sample_code: "BLIND-B1" }
              as: QualityAssuranceLead
              captures: { pan_b: $.data.id }
            - call: "POST /v1/panels/${pan_b}/score"
              payload: { score: 70 }
              as: QualityAssuranceLead
            - call: "POST /v1/tenders/${tend}/close"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/evaluate"
              as: ProcurementLead
            - call: "POST /v1/tenders/${tend}/award"
              payload: { primary_bid_id: "${bid_a}", secondary_bid_id: "${bid_b}" }
              as: ProcurementLead
            - call: "POST /v1/stores"
              payload: { code: "S1", name: "Store One", tier: "STANDARD", weekly_labor_budget_cents: 100000 }
              as: OperationsAdmin
              captures: { store: $.data.id }
            - call: "POST /v1/finds-buys"
              payload: { product_id: "${prod}", week_start_date: "2026-09-07", week_end_date: "2026-09-13", total_quantity: 1 }
              as: CategoryManager
              captures: { buy: $.data.id, buy_v: $.data.version }
            - call: "POST /v1/finds-buys/${buy}/allocations"
              payload: { expected_finds_buy_version: "${buy_v}" }
              as: CategoryManager
            - call: "POST /v1/finds-buys/${buy}/activate"
              as: CategoryManager
            - call: "GET /v1/finds-buys/${buy}/allocations"
              as: CategoryManager
              captures: { alloc: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: OperationsAdmin
            - call: "POST /v1/allocations/${alloc}/sell"
              payload: { quantity: 1 }
              as: StoreManager
              as_user_id: ${store}
          trigger:
            - call: "POST /v1/allocations/${alloc}/clearance"
              payload: { clearance_markdown_pct: 0.30, clearance_start_date: "2026-09-14", clearance_end_date: "2026-09-20" }
