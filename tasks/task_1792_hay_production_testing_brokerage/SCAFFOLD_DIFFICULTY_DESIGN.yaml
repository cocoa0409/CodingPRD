# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Hay Production, Testing & Brokerage
# All fixture arithmetic pre-computed from SCAFFOLD.yaml §1.3 formulas/constants.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: locked_vs_spot_quote_pricing
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.pinned_market_index_id
          - state_machines.Quote.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Pricing-domain dual variant: an ISSUED quote keeps its LOCKED pinned-index total while a
          later SPOT quote with identical inputs reprices off a newer DROUGHT index — the two variants
          of quote_pricing produce different totals for the same hay (439170 vs 499338 cents).
        test_recipe:
          setup:
            - "MarketIndex idx1: OR-WILLAMETTE/ALFALFA effective 2026-05-01 @ 20000 (STABLE, no prior)"
            - "FreightLane OR-WILLAMETTE->CA-NORTH 420mi @ 350c/mi min 90000"
            - "Buyer with credit_limit_cents 10000000"
            - "Quote q1 PREMIUM 12.0t created and ISSUED while idx1 is latest (LOCKED at 20000)"
            - "MarketIndex idx2: same region/forage effective 2026-06-15 @ 23200 (+16% >= 15% -> DROUGHT)"
            - "Quote q2, identical inputs, created after idx2 (SPOT sees 23200)"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin, captures: { idx1_id: "$.data.id" } }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer One", region_code: "CA-NORTH", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { b1_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b1_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-09-01" }, as: Buyer, as_user_id: "${b1_id}", captures: { q1_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q1_id}/issue", payload: {}, as: Buyer, as_user_id: "${b1_id}" }
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-06-15", price_per_ton_cents: 23200 }, as: PlatformAdmin, captures: { idx2_regime: "$.data.drought_regime" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b1_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-09-01" }, as: Buyer, as_user_id: "${b1_id}", captures: { q2_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/quotes/${q1_id}", payload: {}, as: Buyer, as_user_id: "${b1_id}", captures: { q1_total: "$.data.total_cents", q1_unit: "$.data.unit_price_cents", q1_pin: "$.data.pinned_market_index_id" } }
            - { call: "GET /api/quotes/${q2_id}", payload: {}, as: Buyer, as_user_id: "${b1_id}", captures: { q2_total: "$.data.total_cents", q2_unit: "$.data.unit_price_cents" } }
          assert:
            - "Quote.${q1_id}.pinned_market_index_id == ${idx1_id}"
            - "Quote.${q1_id}.unit_price_cents == 23000"
            - "Quote.${q1_id}.total_cents == 439170"
            - "MarketIndex regime of second posting == DROUGHT"
            - "Quote.${q2_id}.unit_price_cents == 28014"
            - "Quote.${q2_id}.total_cents == 499338"
            - "Quote.${q1_id}.total_cents != Quote.${q2_id}.total_cents despite identical quote inputs"
      - name: simple_vs_compound_shrink_tonnage
        grounds:
          - calculations.shrink_tonnage
          - entities.BaleLot.fields.allocatable_tonnage
          - entities.BaleLot.fields.physical_tonnage
        distinguishing_aspect: |
          Inventory-domain dual variant (different entity domain from quote pricing): the same BaleLot
          reports allocatable_tonnage 95.50 under the simple (straight-line) ACCOUNTING variant and
          physical_tonnage 95.57 under the compound PHYSICAL variant after 3 stored months.
        test_recipe:
          setup:
            - "Grower (OR-WILLAMETTE) -> Field -> Cutting (window 2026-05-25..2026-06-05) opened by 3 dry reports and CUT on 2026-06-01"
            - "Standard (non moisture-controlled) StorageSite capacity 1000.0"
            - "BaleLot 100.0t harvested 2026-06-01; logical clock advanced to 2026-09-15 (3 full months)"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower One", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g1_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g1_id}", name: "North 40", acres: 120.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g1_id}", captures: { f1_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f1_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-05-25", planned_window_end: "2026-06-05" }, as: Grower, as_user_id: "${g1_id}", captures: { c1_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-05-30", precipitation_mm: 0.5, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-05-31", precipitation_mm: 1.0, drying_index: 68 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-01", precipitation_mm: 0.0, drying_index: 72 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c1_id}/mark-cut", payload: { actual_cut_date: "2026-06-01" }, as: Grower, as_user_id: "${g1_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn A", region_code: "OR-WILLAMETTE", capacity_tons: 1000.0 }, as: PlatformAdmin, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c1_id}", storage_site_id: "${s1_id}", bale_type: "LARGE_SQUARE", bale_count: 200, harvested_tonnage: 100.0, harvested_date: "2026-06-01" }, as: BrokerOps, captures: { lot1_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/bale-lots/${lot1_id}", payload: {}, as: BrokerOps, captures: { alloc_t: "$.data.allocatable_tonnage", phys_t: "$.data.physical_tonnage" } }
          assert:
            - "BaleLot.${lot1_id}.allocatable_tonnage == 95.5"
            - "BaleLot.${lot1_id}.physical_tonnage == 95.57"
            - "BaleLot.${lot1_id}.allocatable_tonnage != BaleLot.${lot1_id}.physical_tonnage"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quality_tier_moisture_cap_interaction
        grounds:
          - calculations.quality_tier_assignment
          - state_machines.ForageTest.RESULTED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear conditional interaction: rfv 190.0 normally yields
          SUPREME, but moisture 16.5 (> 16.0 cap) forces FAIR, while the same rfv with moisture exactly
          16.0 stays SUPREME; protein is carried but does not lift the cap.
        test_recipe:
          setup:
            - "Grower/Field/Cutting CUT on 2026-07-31 (window 2026-07-25..2026-08-10, dry reports 07-29..07-31)"
            - "StorageSite capacity 2000.0; two lots (L1, L2) of 10.0t harvested 2026-08-01"
            - "Test on L1 recorded rfv 190.0 / protein 21.5 / moisture 16.5 and certified by a second technician"
            - "Test on L2 recorded rfv 190.0 / protein 21.5 / moisture 16.0 and certified likewise"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Two", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g2_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g2_id}", name: "River Field", acres: 80.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g2_id}", captures: { f2_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f2_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g2_id}", captures: { c2_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c2_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g2_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn B", region_code: "OR-WILLAMETTE", capacity_tons: 2000.0 }, as: PlatformAdmin, captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c2_id}", storage_site_id: "${s2_id}", bale_type: "SMALL_SQUARE", bale_count: 100, harvested_tonnage: 10.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c2_id}", storage_site_id: "${s2_id}", bale_type: "SMALL_SQUARE", bale_count: 100, harvested_tonnage: 10.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotB_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotA_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tA_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tA_id}/submit", payload: { lab_reference: "LAB-A" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tA_id}/record-result", payload: { rfv: 190.0, protein_pct: 21.5, moisture_pct: 16.5 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tA_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotB_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tB_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tB_id}/submit", payload: { lab_reference: "LAB-B" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tB_id}/record-result", payload: { rfv: 190.0, protein_pct: 21.5, moisture_pct: 16.0 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tB_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
          trigger:
            - { call: "GET /api/bale-lots/${lotA_id}", payload: {}, as: BrokerOps, captures: { tierA: "$.data.quality_tier" } }
            - { call: "GET /api/bale-lots/${lotB_id}", payload: {}, as: BrokerOps, captures: { tierB: "$.data.quality_tier" } }
          assert:
            - "BaleLot.${lotA_id}.quality_tier == FAIR"
            - "BaleLot.${lotB_id}.quality_tier == SUPREME"
            - "BaleLot.${lotB_id}.certified_protein_pct == 21.5"
      - name: quote_unit_rounding_order_pinned
        grounds:
          - calculations.quote_pricing
          - calculations.freight_charge
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: unit price is rounded to whole cents BEFORE tonnage
          multiplication. idx 20050 x 1.15 = 23057.5 -> round 23058 then x 10 = 230580; the unpinned
          sum-then-round order would give round(230575.0) = 230575, so asserting 230580 proves the order.
        test_recipe:
          setup:
            - "MarketIndex OR-WILLAMETTE/ALFALFA effective 2026-05-01 @ 20050 (STABLE — no prior index)"
            - "FreightLane OR-WILLAMETTE->CA-NORTH 80mi @ 350c/mi min 90000 (base floors at min; 0% fuel tier)"
            - "Buyer credit 5000000; DRAFT quote PREMIUM 10.0t"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20050 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 80, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer Two", region_code: "CA-NORTH", credit_limit_cents: 5000000 }, as: PlatformAdmin, captures: { b2_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/quotes", payload: { buyer_id: "${b2_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 10.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b2_id}", captures: { q3_id: "$.data.id", q3_unit: "$.data.unit_price_cents", q3_comm: "$.data.commodity_cents", q3_fr: "$.data.freight_cents", q3_tot: "$.data.total_cents" } }
          assert:
            - "Quote.${q3_id}.unit_price_cents == 23058"
            - "Quote.${q3_id}.commodity_cents == 230580"
            - "Quote.${q3_id}.freight_cents == 90000"
            - "Quote.${q3_id}.total_cents == 320580"
      - name: grower_settlement_evaluation_order
        grounds:
          - calculations.grower_settlement
          - state_machines.DeliveryLoad.OPEN_to_SETTLED
          - entities.Grower.fields.settled_tons_ytd
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned: commission is taken on GROSS (never net), and the
          volume tier reads settled_tons_ytd BEFORE each allocation in created_at ASC order. Two identical
          10t allocations on one settle pay 8000 then 6000 cents commission because the first crosses the
          500t tier boundary — processing order changes the numbers.
        test_recipe:
          setup:
            - "WA-YAKIMA index @ 10000 (2026-05-01); lane WA-YAKIMA->NV-NORTH 80mi min 90000 (freight 90000)"
            - "Buyer credit 20000000; Grower with field; Cutting CUT 2026-07-31; site cap 2000.0"
            - "Lot1 500.0t GOOD-certified (rfv 160.0, protein 19.0, moisture 14.0) harvested 2026-08-01"
            - "Contract C0 (GOOD 490t, total 4990000) accepted, allocated 490t from lot1, delivered, settled -> grower YTD 490.0"
            - "Lot2 30.0t GOOD-certified (rfv 155.0, protein 18.0, moisture 15.0) same cutting"
            - "Contract C1 (GOOD 20t, total 290000) accepted; Load L2 capacity 100 with allocations A1 (C1,lot1,10.0, created first) and A2 (C1,lot2,10.0), delivered"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "WA-YAKIMA", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 10000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "WA-YAKIMA", dest_region_code: "NV-NORTH", distance_miles: 80, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer Three", region_code: "NV-NORTH", credit_limit_cents: 20000000 }, as: PlatformAdmin, captures: { b3_id: "$.data.id" } }
            - { call: "POST /api/growers", payload: { name: "Grower Three", region_code: "WA-YAKIMA" }, as: PlatformAdmin, captures: { g3_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g3_id}", name: "Pivot 7", acres: 300.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g3_id}", captures: { f3_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f3_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g3_id}", captures: { c3_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "WA-YAKIMA", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 75 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "WA-YAKIMA", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 75 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "WA-YAKIMA", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 75 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c3_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g3_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn C", region_code: "WA-YAKIMA", capacity_tons: 2000.0 }, as: PlatformAdmin, captures: { s3_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c3_id}", storage_site_id: "${s3_id}", bale_type: "LARGE_SQUARE", bale_count: 500, harvested_tonnage: 500.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotC1_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotC1_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tC1_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tC1_id}/submit", payload: { lab_reference: "LAB-C1" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tC1_id}/record-result", payload: { rfv: 160.0, protein_pct: 19.0, moisture_pct: 14.0 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tC1_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b3_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 490.0, origin_region_code: "WA-YAKIMA", dest_region_code: "NV-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b3_id}", captures: { qC0_id: "$.data.id" } }
            - { call: "POST /api/quotes/${qC0_id}/issue", payload: {}, as: Buyer, as_user_id: "${b3_id}", captures: { qC0_v: "$.data.version" } }
            - { call: "POST /api/quotes/${qC0_id}/accept", payload: { expected_quote_version: "${qC0_v}" }, as: Buyer, as_user_id: "${b3_id}" }
            - { call: "GET /api/contracts?quote_id=${qC0_id}", payload: {}, as: BrokerOps, captures: { ct0_id: "$.data[0].id" } }
            - { call: "POST /api/delivery-loads", payload: { carrier_name: "CARRIER-X", capacity_tons: 600.0, planned_ship_date: "2026-08-05" }, as: BrokerOps, captures: { l1_id: "$.data.id", l1_v: "$.data.version" } }
            - { call: "POST /api/load-allocations", payload: { delivery_load_id: "${l1_id}", contract_id: "${ct0_id}", bale_lot_id: "${lotC1_id}", tons: 490.0, expected_delivery_load_version: "${l1_v}" }, as: BrokerOps, captures: { a0_id: "$.data.id" } }
            - { call: "POST /api/delivery-loads/${l1_id}/start-loading", payload: {}, as: BrokerOps }
            - { call: "POST /api/delivery-loads/${l1_id}/depart", payload: {}, as: BrokerOps }
            - { call: "POST /api/delivery-loads/${l1_id}/deliver", payload: {}, as: BrokerOps }
            - { call: "POST /api/delivery-loads/${l1_id}/settle", payload: {}, as: BrokerOps }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c3_id}", storage_site_id: "${s3_id}", bale_type: "LARGE_SQUARE", bale_count: 30, harvested_tonnage: 30.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotC2_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotC2_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tC2_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tC2_id}/submit", payload: { lab_reference: "LAB-C2" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tC2_id}/record-result", payload: { rfv: 155.0, protein_pct: 18.0, moisture_pct: 15.0 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tC2_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b3_id}", forage_type: "ALFALFA", quality_tier: "GOOD", tons: 20.0, origin_region_code: "WA-YAKIMA", dest_region_code: "NV-NORTH", requested_delivery_by: "2026-08-25" }, as: Buyer, as_user_id: "${b3_id}", captures: { qC1_id: "$.data.id" } }
            - { call: "POST /api/quotes/${qC1_id}/issue", payload: {}, as: Buyer, as_user_id: "${b3_id}", captures: { qC1_v: "$.data.version" } }
            - { call: "POST /api/quotes/${qC1_id}/accept", payload: { expected_quote_version: "${qC1_v}" }, as: Buyer, as_user_id: "${b3_id}" }
            - { call: "GET /api/contracts?quote_id=${qC1_id}", payload: {}, as: BrokerOps, captures: { ct1_id: "$.data[0].id" } }
