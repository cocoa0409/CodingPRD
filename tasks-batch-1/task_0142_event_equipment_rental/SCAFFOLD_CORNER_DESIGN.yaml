              payload: { expected_order_version: "${o50_v}" }
              as: Customer
              as_user_id: "${c50_id}"
              captures: { gt: $.data.grand_total_cents }
          assert:
            - "RentalOrder.${o50_id}.rental_subtotal_cents == 1000"
            - "RentalOrder.${o50_id}.deposit_total_cents == 500"
            - "RentalOrder.${o50_id}.grand_total_cents == 1000"
