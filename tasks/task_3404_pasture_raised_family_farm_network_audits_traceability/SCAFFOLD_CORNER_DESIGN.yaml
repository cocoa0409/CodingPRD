scaffold_corner_design:
  - section: entities
    instances:
      - name: farm_create_assigns_defaults_and_computed_fields
        claim_type: creation
        grounds: ["entities.Farm", "calculations.effective_bird_capacity"]
        distinguishing_aspect: "POST /farms returns 201 with system defaults: status ONBOARDING, certification_status CERTIFICATION_PENDING, version 1, and effective_bird_capacity == min(floor(21600/108.0), floor(180/1.2), 30*5) == 150."
        test_recipe:
          setup: ["empty database; logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { name: "Default Check Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
          assert:
            - "http status == 201 and response data.id is a server-minted UUID"
            - "Farm.${f_id}.status == ONBOARDING and certification_status == CERTIFICATION_PENDING"
            - "Farm.${f_id}.effective_bird_capacity == 150 (barn constraint binds: min(200, 150, 150))"
            - "Farm.${f_id}.version == 1 and last_passed_audit_at is null"

      - name: farm_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["entities.Farm.fields.pasture_sqft", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required pasture_sqft yields 400 ERR_INVALID_REQUEST; no Farm row is created."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { name: "Missing Pasture Farm", region: "IA", barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: farm_system_field_input_ignored
        claim_type: system_fields
        grounds: ["entities.Farm"]
        distinguishing_aspect: "Client-supplied id and version in the create body are ignored: the server mints its own id and starts version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /farm-network/farms"
              payload: { id: "00000000-0000-0000-0000-000000000000", version: 99, name: "Forged Fields Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
          assert:
            - "http status == 201"
            - "Farm.${f_id}.id != 00000000-0000-0000-0000-000000000000 and Farm.${f_id}.version == 1"

      - name: carton_is_immutable_without_version_field
        claim_type: immutability
        grounds: ["entities.Carton"]
        distinguishing_aspect: "Carton declares common_fields false: its read payload carries id and created_at but no version and no updated_at, and no endpoint mutates a carton after packing."
        test_recipe:
          setup: ["ACTIVE farm with one graded lot (A) and 2 packed cartons"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Immutable Carton Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r_id}/stops/1/collect"
              payload: { collected_cases: 2, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { lot_id: $.data.id }
            - call: "POST /farm-network/lots/${lot_id}/grade"
              payload: { quality_score: 90 }
              as: QualityManager
            - call: "POST /farm-network/lots/${lot_id}/cartons"
              payload: { carton_count: 2, pack_size: "LARGE" }
              as: PlantOperator
              captures: { c_code: "$.data[0].carton_code" }
          trigger:
            - call: "GET /farm-network/cartons/${c_code}"
              as: NetworkManager
          assert:
            - "http status == 200 and data.carton_code == ${c_code}"
            - "response data has no version key and no updated_at key (common_fields false)"
            - "data.dozens == 1 and data.lot_id == ${lot_id}"

      - name: forecast_duplicate_farm_week_rejected
        claim_type: type_constraints
        grounds: ["entities.ProductionForecast", "errors[ERR_FORECAST_EXISTS]"]
        distinguishing_aspect: "ProductionForecast is unique per (farm_id, week_start): the second POST for the same pair returns 409 ERR_FORECAST_EXISTS."
        test_recipe:
          setup: ["ACTIVE farm F (base chain)"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Forecast Dup Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/forecasts"
              payload: { week_start: "2026-09-07", season: "AUTUMN", weather_severity: "NONE" }
              as: NetworkManager
          trigger:
            - call: "POST /farm-network/farms/${f_id}/forecasts"
              payload: { week_start: "2026-09-07", season: "WINTER", weather_severity: "SEVERE" }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_FORECAST_EXISTS (the different season/severity do not make it a new forecast)"

      - name: retailer_creation_supports_entity_backed_identity
        claim_type: creation
        grounds: ["entities.RetailerAccount", "roles.RetailerBuyer"]
        distinguishing_aspect: "A RetailerBuyer whose X-User-ID equals the created RetailerAccount.id can read its (empty) commitment list with retailer_id scoped to itself; entity_backed identity is exercised end to end."
        test_recipe:
          setup: ["retailer R created by PlatformAdmin"]
          setup_api_calls:
            - call: "POST /farm-network/retailers"
              payload: { name: "Ozark Fresh Markets", banner: "Ozark Fresh", terms_net_days: 45 }
              as: PlatformAdmin
              captures: { r_tailer_id: $.data.id }
          trigger:
            - call: "GET /farm-network/commitments"
              payload: { retailer_id: "${r_tailer_id}" }
              as: RetailerBuyer
              as_user_id: "${r_tailer_id}"
          assert:
            - "http status == 200 and data == [] (total_count 0, has_more false)"

      - name: lot_and_carton_codes_use_deterministic_sequences
        claim_type: system_fields
        grounds: ["entities.EggLot.fields.lot_code", "entities.Carton.fields.carton_code"]
        distinguishing_aspect: "The first collected lot of a fresh server is LOT-000001 and its first two cartons are LOT-000001-C001 and LOT-000001-C002 — minting is sequential, not random."
        test_recipe:
          setup: ["ACTIVE farm with a stop planned; collected at 2026-09-08"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Sequence Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r_id}/stops/1/collect"
              payload: { collected_cases: 2, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { lot_id: $.data.id, lot_code: $.data.lot_code }
            - call: "POST /farm-network/lots/${lot_id}/grade"
              payload: { quality_score: 90 }
              as: QualityManager
          trigger:
            - call: "POST /farm-network/lots/${lot_id}/cartons"
              payload: { carton_count: 2, pack_size: "MEDIUM" }
              as: PlantOperator
              captures: { c1: "$.data[0].carton_code", c2: "$.data[1].carton_code" }
          assert:
            - "lot_code == LOT-000001 (first lot on a fresh server)"
            - "c1 == LOT-000001-C001 and c2 == LOT-000001-C002"

  - section: state_machines
    instances:
      - name: farm_activate_twice_second_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Farm", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activate is a one-way ONBOARDING -> ACTIVE gate; replaying it on an ACTIVE farm returns 409 ERR_INVALID_STATE (idempotency via rejection)."
        test_recipe:
          setup: ["ACTIVE farm F (full base chain)"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Double Activate Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
          trigger:
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE"

      - name: farm_removed_is_terminal_for_mutations
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Farm", "errors[ERR_FARM_TERMINAL]"]
        distinguishing_aspect: "REMOVED is terminal: both PATCH and activate on a removed farm return 409 ERR_FARM_TERMINAL while reads still succeed."
        test_recipe:
          setup: ["farm F removed via POST /remove (from ONBOARDING)"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Doomed Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/remove"
              payload: { reason: "withdrew from program" }
              as: NetworkManager
          trigger:
            - call: "PATCH /farm-network/farms/${f_id}"
              payload: { declared_bird_count: 100 }
              as: NetworkManager
              captures: { err1: $.data.error_id }
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
              captures: { err2: $.data.error_id }
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
          assert:
            - "PATCH on REMOVED farm: error_id == ERR_FARM_TERMINAL (409)"
            - "activate on REMOVED farm: error_id == ERR_FARM_TERMINAL (409)"
            - "GET still returns 200 with status == REMOVED and certification_status == DECERTIFIED"

      - name: farm_patch_while_active_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Farm", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Spec amendments are only legal while ONBOARDING or PROBATION; PATCH on an ACTIVE farm is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE farm F (full base chain)"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Patch Lock Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
          trigger:
            - call: "PATCH /farm-network/farms/${f_id}"
              payload: { pasture_sqft: 30000 }
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409 and error_id == ERR_INVALID_STATE"

      - name: audit_complete_too_early_returns_window_missed
        claim_type: precondition_enforcement
        grounds: ["state_machines.Audit", "errors[ERR_AUDIT_WINDOW_MISSED]"]
        distinguishing_aspect: "The completion window opens 3 days before scheduled_for: completing at 2026-09-05 for an audit scheduled 2026-09-10 fails with ERR_AUDIT_WINDOW_MISSED (the early side of the window; the late side is unreachable because audits auto-expire)."
        test_recipe:
          setup: ["farm F with INITIAL audit scheduled_for 2026-09-10T00:00:00Z; clock at 2026-09-05T00:00:00Z"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Early Bird Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-10T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422 and error_id == ERR_AUDIT_WINDOW_MISSED"
            - "Audit.${a_id}.status remains SCHEDULED"

      - name: audit_expires_when_window_passes
        claim_type: valid_transition
        grounds: ["state_machines.Audit.SCHEDULED_to_EXPIRED"]
        distinguishing_aspect: "A SCHEDULED audit auto-transitions to EXPIRED when the clock advances strictly past scheduled_for + 7 days — an automatic system transition with no direct endpoint."
        test_recipe:
          setup: ["farm F with INITIAL audit scheduled_for 2026-09-03T00:00:00Z, never completed"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Expiry Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /farm-network/audits/${a_id}"
              as: NetworkManager
          assert:
            - "Audit.${a_id}.status == EXPIRED after the clock passes 2026-09-10T00:00:00Z (scheduled_for + 7 days)"
            - "at exactly 2026-09-10T00:00:00Z the audit would still have been SCHEDULED (strictly-greater expiry)"

      - name: corrective_action_reject_rework_cycle
        claim_type: valid_transition
        grounds: ["state_machines.CorrectiveAction"]
        distinguishing_aspect: "The SUBMITTED -> OPEN rejection loop keeps due_at unchanged: a rejected CA returns to OPEN with its original deadline, making the rework cycle observable."
        test_recipe:
          setup: ["farm F with audit completed CORRECTIVE_ACTION_REQUIRED (one MAJOR finding) at 2026-09-03T09:00:00Z; CA due 2026-10-03T09:00:00Z"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Rework Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "CORRECTIVE_ACTION_REQUIRED", findings: [{ severity: "MAJOR", description: "insufficient nest pad depth" }] }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/audits/${a_id}/corrective-actions"
              as: NetworkManager
              captures: { ca_id: "$.data[0].id", ca_due: "$.data[0].due_at" }
            - call: "POST /farm-network/corrective-actions/${ca_id}/submit"
              payload: { evidence_notes: "added shavings" }
              as: NetworkManager
          trigger:
            - call: "POST /farm-network/corrective-actions/${ca_id}/verify"
              payload: { decision: "REJECT", notes: "photos show depth still short" }
              as: Auditor
              as_user_id: "auditor-b"
            - call: "GET /farm-network/audits/${a_id}/corrective-actions"
              as: NetworkManager
          assert:
            - "after REJECT the corrective action is back to status OPEN (rework loop)"
            - "due_at is unchanged (== ${ca_due}); rejection does not extend the deadline"
            - "verified_by_user_id remains null"

      - name: ca_verify_by_same_auditor_returns_sod_violation
        claim_type: invalid_transition
        grounds: ["state_machines.CorrectiveAction", "validations[priority=4]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the auditor whose X-User-ID completed the parent audit cannot verify its corrective action — 403 ERR_SOD_VIOLATION even though the role is correct."
        test_recipe:
          setup: ["farm F; audit completed by auditor-x with one MINOR finding; CA submitted"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "SoD Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
