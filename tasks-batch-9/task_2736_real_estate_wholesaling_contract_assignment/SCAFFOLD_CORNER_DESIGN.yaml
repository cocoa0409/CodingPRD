# =============================================================================
# §1.9 Scaffold Corner Design — Real Estate Wholesaling & Contract Assignment
#
# Breadth probe over the §1.1–§1.7 surface of SCAFFOLD.yaml, walked section by
# section against references/claim-extraction-guide.md. Every instance is
# reachable from an empty database using only endpoints declared in §1.5, with a
# logical clock parked by POST /_clock/set_current_utc so no wall-clock waits are
# needed. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because stubs rather than duplicated tests.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: wholesaler_creation_persists_declared_fields_and_returns_201
        claim_type: creation
        grounds:
          - endpoints[POST /wholesalers]
          - entities.Wholesaler
        distinguishing_aspect: "POST /wholesalers with every input field supplied returns 201 and echoes legal_name, state_code, licensure_status, disclosure_template_version and funding_window_capacity alongside system-generated id, created_at, updated_at and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesalers"
              payload: { legal_name: "Brazos Bend Acquisitions LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1", licensure_status: "LICENSED_BROKER", funding_window_capacity: 2 }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
          assert:
            - "Response status is 201 and response_type is object"
            - "Wholesaler.${w_id}.legal_name == Brazos Bend Acquisitions LLC, state_code == TX, disclosure_template_version == DISC-2026.1"
            - "Wholesaler.${w_id}.licensure_status == LICENSED_BROKER and funding_window_capacity == 2 (both supplied inputs override their defaults)"
            - "Wholesaler.${w_id}.adverse_finding_count == 0, compliance_hold == false, executed_assignment_count == 0"
            - "Wholesaler.${w_id}.version == 1, created_at == 2026-08-01T00:00:00Z, updated_at == 2026-08-01T00:00:00Z, and id is a non-empty server-minted string"

      - name: seller_lead_retrieval_returns_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /seller-leads/{seller_lead_id}]
          - entities.SellerLead
        distinguishing_aspect: "GET /seller-leads/{seller_lead_id} returns exactly the row written by POST /seller-leads, including the input money fields and the pre-screen computed defaults status PROSPECT and lead_gen_blocked false."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler and one freshly created, not-yet-screened seller lead carrying two distress flags."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000, junior_lien_cents: 1500000, delinquent_property_tax_cents: 400000, distress_flags: ["FORECLOSURE_NOTICE", "PROBATE"] }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: "$.data.id" }
          trigger:
            - call: "GET /seller-leads/${sl_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Response status is 200 and response_type is object"
            - "SellerLead.${sl_id}.wholesaler_id == ${w_id}, owner_name == Dana Ruiz, property_address == 118 Cedar St, Austin TX, state_code == TX"
            - "SellerLead.${sl_id}.estimated_market_value_cents == 30000000, recorded_senior_lien_cents == 10000000, junior_lien_cents == 1500000, delinquent_property_tax_cents == 400000"
            - "SellerLead.${sl_id}.distress_flags == [FORECLOSURE_NOTICE, PROBATE] and marketing_campaign_id is null"
            - "SellerLead.${sl_id}.status == PROSPECT, lead_gen_blocked == false, screening_variant is null, protection_tier is null, net_equity_cents is null, equity_pct is null, screened_at is null"
            - "SellerLead.${sl_id}.version == 1"

      - name: seller_lead_listing_filters_by_status_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /seller-leads]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /seller-leads with status=SCREENED, limit=1 and offset=1 returns exactly one of the two screened leads, total_count 2 and has_more false, while the unscreened third lead is filtered out entirely."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler with three leads; the first two are STATUTORY-screened, the third is left PROSPECT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl1_id: "$.data.id" }
            - call: "POST /seller-leads/${sl1_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Omar Beck", property_address: "220 Birch Ln, Austin TX", state_code: "TX", estimated_market_value_cents: 28000000, recorded_senior_lien_cents: 9000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl2_id: "$.data.id" }
            - call: "POST /seller-leads/${sl2_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Priya Nandan", property_address: "77 Willow Ct, Austin TX", state_code: "TX", estimated_market_value_cents: 26000000, recorded_senior_lien_cents: 8000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl3_id: "$.data.id" }
          trigger:
            - call: "GET /seller-leads"
              payload: { wholesaler_id: "${w_id}", status: "SCREENED", limit: 1, offset: 1 }
              as: Wholesaler
              as_user_id: "${w_id}"
          assert:
            - "Response status is 200 and response_type is array"
            - "total_count == 2 (only the two SCREENED leads match the filter; SellerLead.${sl3_id} is excluded)"
            - "The returned data array has exactly 1 element and limit == 1, offset == 1 are echoed"
            - "has_more == false because offset 1 plus limit 1 reaches total_count 2"
            - "The returned element is one of SellerLead.${sl1_id} or SellerLead.${sl2_id} and its status == SCREENED"

      - name: purchase_contract_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /purchase-contracts/{purchase_contract_id}]
          - errors[ERR_PURCHASE_CONTRACT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A templated path segment that resolves to no row returns 404 ERR_PURCHASE_CONTRACT_NOT_FOUND rather than an empty object or a 200 with null data."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler exists so the caller has a valid identity; no purchase contract exists at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "GET /purchase-contracts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 404 and response_type is error"
            - "${err} == ERR_PURCHASE_CONTRACT_NOT_FOUND and data.message is a non-empty string"
            - "No PurchaseContract row was created as a side effect of the failed read"

      - name: seller_lead_create_missing_required_property_address_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /seller-leads]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field property_address on POST /seller-leads returns 400 ERR_INVALID_REQUEST and creates no SellerLead row, even though every other required field is present and valid."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler and no seller leads."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /seller-leads filtered by wholesaler_id ${w_id} returns total_count == 0"
            - "Wholesaler.${w_id}.version is unchanged at 1"

      - name: wholesaler_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Wholesaler.fields.licensure_status
          - entities.Wholesaler.fields.funding_window_capacity
          - entities.Wholesaler.fields.compliance_hold
        distinguishing_aspect: "Omitting licensure_status and funding_window_capacity yields the declared defaults UNLICENSED and 1, and the computed posture fields start at adverse_finding_count 0, compliance_hold false, executed_assignment_count 0."
        test_recipe:
          setup:
            - "Empty database with the logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id", w_licensure: "$.data.licensure_status", w_cap: "$.data.funding_window_capacity" }
          assert:
            - "Response status is 201"
            - "${w_licensure} == UNLICENSED (declared default, not null and not an empty string)"
            - "${w_cap} == 1 (declared default)"
            - "Wholesaler.${w_id}.adverse_finding_count == 0, compliance_hold == false, executed_assignment_count == 0"

      - name: cash_buyer_computed_capital_fields_initialised_by_system
        claim_type: computed_fields
        grounds:
          - endpoints[POST /cash-buyers]
          - calculations.buyer_committed_capital
          - entities.CashBuyer.fields.buyer_tier
        distinguishing_aspect: "A newly created CashBuyer has verified_funds_cents 0, committed_deposit_cents 0, available_funds_cents 0, active_offer_count 0 and buyer_tier SUSPENDED — all computed by the server with no proof of funds on file, not accepted from the request body."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler and no cash buyers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /cash-buyers"
              payload: { wholesaler_id: "${w_id}", legal_name: "Ridgeline Capital LLC", contact_email: "bids@ridgeline.example" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { cb_id: "$.data.id", cb_tier: "$.data.buyer_tier" }
          assert:
            - "Response status is 201"
            - "CashBuyer.${cb_id}.verified_funds_cents == 0, committed_deposit_cents == 0, available_funds_cents == 0, active_offer_count == 0"
            - "${cb_tier} == SUSPENDED because verified_funds_cents == 0"
            - "CashBuyer.${cb_id}.wholesaler_id == ${w_id}, legal_name == Ridgeline Capital LLC, contact_email == bids@ridgeline.example, version == 1"

      - name: disclosure_acknowledgement_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - endpoints[POST /disclosure-acknowledgements]
          - entities.DisclosureAcknowledgement.fields.acknowledged_at
          - entities.DisclosureAcknowledgement.fields.created_at
        distinguishing_aspect: "The acknowledgement's id, created_at and acknowledged_at are stamped by the server from the logical clock at 2026-08-05T00:00:00Z; the request body supplies none of them."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-05T00:00:00Z."
            - "One wholesaler, one STATUTORY-screened lead, one FINALIZED analysis and one DRAFT purchase contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: "$.data.id" }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: "$.data.version" }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.20, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.30, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1000000, high_cents: 1200000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: "$.data.id" }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 18000000
                earnest_money_cents: 500000
                inspection_period_days: 7
                option_start_at: "2026-08-05T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
              captures: { ack_id: "$.data.id", ack_at: "$.data.acknowledged_at" }
          assert:
            - "Response status is 201 and ${ack_id} is a non-empty server-minted string that was not supplied in the request"
            - "${ack_at} == 2026-08-05T00:00:00Z, taken from the logical clock"
            - "DisclosureAcknowledgement.${ack_id}.created_at == 2026-08-05T00:00:00Z"
            - "DisclosureAcknowledgement.${ack_id}.purchase_contract_id == ${pc_id}, acknowledged_intent_to_assign == true, acknowledged_unlicensed_status == true, signature_ref == esig-dana-001"

      - name: marketing_campaign_create_with_invalid_enum_channel_rejected
        claim_type: type_constraints
        grounds:
          - entities.MarketingCampaign.fields.channel
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A channel value of POSTCARD is outside the declared set {DIRECT_MAIL, SMS, COLD_CALL, BANDIT_SIGN, ONLINE_AD} and is rejected with 400 ERR_INVALID_REQUEST; no MarketingCampaign row is created."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler with no campaigns."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /marketing-campaigns"
              payload: { wholesaler_id: "${w_id}", channel: "POSTCARD", headline: "We buy houses fast", target_state_code: "TX", discloses_intent_to_assign: true, discloses_unlicensed_status: true }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /marketing-campaigns filtered by wholesaler_id ${w_id} returns total_count == 0"

      - name: disclosure_acknowledgement_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.DisclosureAcknowledgement
          - endpoints[GET /disclosure-acknowledgements/{disclosure_acknowledgement_id}]
        distinguishing_aspect: "DisclosureAcknowledgement is declared common_fields false: its representation carries id, created_at and acknowledged_at but no version and no updated_at, and §1.5 declares no endpoint that mutates or deletes it."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-05T00:00:00Z."
            - "One wholesaler, one STATUTORY-screened lead, one FINALIZED analysis, one DRAFT contract and one recorded disclosure acknowledgement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: "$.data.id" }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: "$.data.version" }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.20, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.30, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1000000, high_cents: 1200000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: "$.data.id" }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 18000000
                earnest_money_cents: 500000
                inspection_period_days: 7
                option_start_at: "2026-08-05T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: "$.data.id" }
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
              captures: { ack_id: "$.data.id" }
          trigger:
            - call: "GET /disclosure-acknowledgements/${ack_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Response status is 200 and the returned object exposes exactly id, purchase_contract_id, disclosure_template_version, acknowledged_intent_to_assign, acknowledged_unlicensed_status, signature_ref, acknowledged_at and created_at"
            - "The returned object has no version field and no updated_at field"
            - "Signing the contract and then re-reading the acknowledgement returns byte-identical field values, because no declared endpoint mutates it"

      - name: earnest_money_deposit_parent_link_resolves_to_purchase_contract
        claim_type: parent_relationships
        grounds:
          - entities.EarnestMoneyDeposit
          - endpoints[GET /earnest-money-deposits]
          - state_machines.PurchaseContract.contract_status.DRAFT_to_SIGNED
        distinguishing_aspect: "The deposit created by the signing cascade is discoverable only through its parent link: GET /earnest-money-deposits filtered by purchase_contract_id returns exactly one row whose purchase_contract_id matches and whose amount_cents equals the contract's earnest_money_cents."
        test_recipe:
          setup:
