      - name: reagent_lot_distribution_axis_cycles_between_available_and_blocked
        claim_type: Valid Transition
        grounds:
          - state_machines.ReagentLot.transitions.AVAILABLE_to_BLOCKED
          - state_machines.ReagentLot.transitions.BLOCKED_to_AVAILABLE
        excluded_because:
          difficulty_instance: reagent_lot_disposition_and_distribution_dimensions_move_independently
          rationale: "That §1.8 instance already drives the distribution axis through AVAILABLE -> BLOCKED -> AVAILABLE with POST /reagent-lots/{id}/distribution-status while the disposition axis stays RELEASED, and asserts the combined state after each hop plus the version bump per write. Repeating the cycle here would add no distinguishing observation."

      - name: reagent_lot_recall_cascade_from_a_field_action
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReagentLot.transitions.RELEASED_to_RECALLED
          - state_machines.Allocation.transitions.RESERVED_to_QUARANTINED
          - state_machines.ProductSpecification.transitions.CLEARED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: complaint_removal_recall_cascades_through_lot_allocation_order_and_material
          rationale: "That §1.8 transitive_cascade instance walks the full REMOVAL cascade end to end — complaint field action, lot RECALLED plus BLOCKED, Allocation rows QUARANTINED with quarantine_reason RECALL, parent order dropping to PARTIALLY_ALLOCATED, critical MaterialLot QUARANTINED via hop 3b, and the product moving CLEARED -> WITHDRAWN because the recalled lot was its only RELEASED lot. Every hop of this claim is asserted there."

      - name: fill_run_abort_reverts_the_lot_and_returns_its_components
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReagentLot.transitions.IN_PROCESS_to_PLANNED
          - state_machines.FillRun.transitions.RUNNING_to_ABORTED
        excluded_because:
          difficulty_instance: fill_run_abort_restores_material_quantity_conservation_over_two_cycles
          rationale: "That §1.8 compensating_invariant instance already exercises all four abort hops — run ABORTED with abort_reason, lot back to PLANNED, LotComponent rows CONSUMED -> RETURNED, and each MaterialLot's consumed/available quantities restored exactly — and it does so twice to prove no drift accumulates."

      - name: material_lot_cycles_through_oos_investigation_and_back_under_test
        claim_type: Valid Transition
        grounds:
          - state_machines.MaterialLot.transitions.UNDER_TEST_to_OOS_INVESTIGATION
          - state_machines.MaterialLot.transitions.OOS_INVESTIGATION_to_UNDER_TEST
        excluded_because:
          difficulty_instance: material_lot_oos_investigation_cycles_back_to_under_test
          rationale: "That §1.8 non_linear_state_machine instance drives the full cycle: a FAIL result stamping first_oos_at, the INVESTIGATE disposition, the is_retest result returning the lot to UNDER_TEST with retest_count incremented, and the retest-window and max-retests guards on the back edge."

  # ===========================================================================
  - section: calculations
    instances:

      - name: test_result_outcome_passes_exactly_on_every_inclusive_specification_bound
        claim_type: Correct Result
        grounds:
          - calculations.test_result_outcome
          - errors.ERR_TEST_CODE_NOT_IN_SPEC
        distinguishing_aspect: "The rule declares four differently-shaped MATERIAL_LOT comparisons — a two-sided window (POTENCY), a lower bound (PURITY), an upper bound (ENDOTOXIN) and a constant-driven lower bound (IDENTITY at IDENTITY_PASS_MIN 1.0) — and every one of them is inclusive. Probing all four exactly AT the bound plus one step outside catches the classic strict-inequality slip in whichever direction each bound points."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z."
            - "One MaterialSpecification AB-CA-1 with potency 90.0-110.0, purity_min_pct 95.0, endotoxin_max_eu_per_ml 2.0, required_test_codes [POTENCY, PURITY, ENDOTOXIN, IDENTITY] and acceptance_mode ALL_PASS."
            - "One MaterialLot of that specification in qualification_status RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-CA-1", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY", "ENDOTOXIN", "IDENTITY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-CA-1", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
          trigger:
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 90.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_pot_low: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 110.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_pot_high: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "PURITY", measured_value: 95.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_pur: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "ENDOTOXIN", measured_value: 2.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_end: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "IDENTITY", measured_value: 1.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_id: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "ENDOTOXIN", measured_value: 2.01 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { o_end_out: $.data.outcome }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "STERILITY", measured_value: 0.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { err_code: $.data.error_id }
            - call: "GET /material-lots/${ml_id}"
              payload: {}
              as: QAReleaser
              captures: { first_oos: $.data.first_oos_at, score: $.data.acceptance_score }
          assert:
            - "POTENCY 90.0 -> PASS and POTENCY 110.0 -> PASS: both ends of the two-sided window are inclusive"
            - "PURITY 95.0 -> PASS: the lower bound is inclusive"
            - "ENDOTOXIN 2.0 -> PASS: the upper bound is inclusive"
            - "IDENTITY 1.0 -> PASS: the bound is the declared constant IDENTITY_PASS_MIN 1.0, inclusive"
            - "ENDOTOXIN 2.01 -> FAIL, and this first FAIL stamps first_oos_at to 2026-08-20T00:00:00.000Z"
            - "test_code STERILITY returns HTTP 422 ERR_TEST_CODE_NOT_IN_SPEC because it is not a member of required_test_codes"
            - "acceptance_score stays null throughout, because acceptance_mode is ALL_PASS and the score is only computed under WEIGHTED_SCORE"

      - name: stability_last_conforming_month_breaks_at_the_first_gap_in_the_planned_prefix
        claim_type: Input Set Filtering
        grounds:
          - calculations.stability_shelf_life
          - entities.StabilityStudy.fields.last_conforming_month
        distinguishing_aspect: "last_conforming_month is a CONFORMING PREFIX, not a maximum: recording months 0, 3 and 9 while skipping 6 must yield 3, and back-filling month 6 later must jump the value straight to 9. An implementation that takes max(month_index) reports 9 from the start, and one that only looks at the newest record reports 9 then 6."
