              captures: { track_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "b6m@x.com", full_name: "B6M", home_box_member: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${m_id}", benchmark_name: "FRAN", metric_kind: "TIME_SECONDS", value: 190, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /box/program-tracks/${track_id}/leaderboard"
              payload: { benchmark_name: "FRAN" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response_type == array AND data length == 0"
            - "meta.total_count == 0 AND has_more == false"

