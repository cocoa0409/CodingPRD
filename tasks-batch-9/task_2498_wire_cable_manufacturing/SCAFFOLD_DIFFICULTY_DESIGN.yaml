  - rule_id: resource_temporal_overlap
    instances:
      - name: extrusion_line_buffered_closed_interval
        resource: "ProductionLot.line_code (an extrusion line, shared by every lot scheduled on it)"
        interval_semantics: "closed interval [scheduled_start_at, scheduled_end_at] widened by CHANGEOVER_BUFFER_MINUTES (30) at BOTH ends: reject when new_start < other_end + 30min AND other_start < new_end + 30min"
        grounds:
          - validations.priority_60_ERR_LINE_SCHEDULE_CONFLICT
          - entities.ProductionLot.fields.line_code
          - endpoints.POST_/production-lots
        distinguishing_aspect: |
          A buffered CLOSED interval on a machine resource. Two lots that merely
          touch still conflict, because the compound must be purged and the die
          changed: the forbidden zone extends 30 minutes past each end. Both edges
          are exercised, and the same window on a different line_code is accepted,
          proving the conflict is scoped per resource and not global.
