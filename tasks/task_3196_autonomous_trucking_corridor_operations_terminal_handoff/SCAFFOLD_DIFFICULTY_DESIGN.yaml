  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: run_plan_branching_fork_join_from_dispatch_ready
        grounds:
          - state_machines.RunPlan.transitions.DISPATCH_READY_to_IN_TRANSIT
          - state_machines.RunPlan.transitions.DISPATCH_READY_to_READINESS_PENDING
          - state_machines.RunPlan.transitions.DISPATCH_READY_to_ABORTED
          - state_machines.RunPlan.transitions.IN_TRANSIT_to_READINESS_PENDING
        distinguishing_aspect: "RunPlan is a fork-join machine rather than a pipeline: from DISPATCH_READY three divergent transitions fire mutually exclusive side-effect sets — IN_TRANSIT moves approved apron windows to IN_SERVICE, READINESS_PENDING reverts them to REQUESTED, and ABORTED cancels them — and the IN_TRANSIT branch can rejoin the pre-dispatch branch through a safe stop that itself expires a monitoring window, so the machine has both a forward fork and a backward edge."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
            - "Corridor Sun Belt I-10 is ACTIVE and OPEN with weather_risk_score 20."
            - "Carrier AURORA is ACTIVE; commitment Rio Grande has 5 slots with one run plan holding a slot."
            - "A run plan is DISPATCH_READY with one approved apron window and a monitoring window in MONITORING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ledger-checkpoints"
              payload: { checkpoint_code: "EPOCH-SEP", epoch_start_at: "2026-09-01T00:00:00Z", epoch_end_at: "2026-10-01T00:00:00Z", hours_per_epoch: 24 }
              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /api/ledger-checkpoints/${ck_id}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
