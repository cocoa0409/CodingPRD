              as: MethodologyStatistician
              captures: { rs21_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs21_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m21_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m21_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m21_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${c1_id}", population_households: 100000, population_persons: 250000 }, { quota_cell_id: "${c2_id}", population_households: 30000, population_persons: 70000 }, { quota_cell_id: "${c3_id}", population_households: 80000, population_persons: 180000 }, { quota_cell_id: "${c4_id}", population_households: 1100000, population_persons: 2400000 }], expected_market_version: "${m21_v_before_universe}" }
