        distinguishing_aspect: "On a DRAFT service the two triggers that require PUBLISHED split across two different error codes: release-run yields ERR_SERVICE_NOT_PUBLISHED and hold-sweep with close_service yields ERR_SERVICE_INVALID_STATE, matching their distinct validation rows."
