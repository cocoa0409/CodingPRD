    roles: [Trustee, Court]
    code: 200
    input: []
    output: AuctionSale
    side_effects: ["asset IN_AUCTION -> MARKED_FOR_SALE"]

  # --- AvoidanceAction ---
  - method: POST
    path: "/trustee/cases/{id}/avoidance_actions"
    description: "Register a preference/fraudulent-transfer action; computes lookback window and avoidable flag"
    roles: [Trustee]
    code: 201
    input: [transferee_creditor_id, transfer_date, transfer_amount_cents, action_type, demand_amount_cents]
    output: AvoidanceAction
    side_effects: ["lookback_window_days computed", "avoidable computed"]

  - method: GET
    path: "/trustee/cases/{id}/avoidance_actions"
    description: "List avoidance actions of a case"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?", "transferee_creditor_id?"]
    output: "AvoidanceAction[]"
    side_effects: []

  - method: GET
    path: "/trustee/avoidance_actions/{id}"
    description: "Get an avoidance action"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: []

  - method: GET
    path: "/trustee/avoidance_actions/{id}/recovery_deposits"
    description: "List recovery deposits posted against an avoidance action"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "RecoveryDeposit[]"
    side_effects: []

  - method: POST
    path: "/trustee/avoidance_actions/{id}/analyze"
    description: "IDENTIFIED -> ANALYZED (requires avoidable)"
    roles: [Trustee]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: []

  - method: POST
    path: "/trustee/avoidance_actions/{id}/demand"
    description: "ANALYZED -> DEMANDED"
    roles: [Trustee]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: []

  - method: POST
    path: "/trustee/avoidance_actions/{id}/settle"
    description: "DEMANDED -> SETTLED; posts recovery deposit; creates compensating GENERAL_UNSECURED claim for the shortfall"
    roles: [Trustee]
    code: 200
    input: [settled_amount_cents]
    output: AvoidanceAction
    side_effects:
      - "RecoveryDeposit POSTED for settled_amount_cents"
      - "case.estate_cash_on_hand_cents += settled_amount_cents"
      - "compensating claim created for transferee if transfer_amount_cents - settled_amount_cents > 0"
      - "case.version += 1"

  - method: POST
    path: "/trustee/avoidance_actions/{id}/enter_judgment"
    description: "DEMANDED -> JUDGMENT; posts full recovery deposit"
    roles: [Court]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: ["RecoveryDeposit POSTED for demand_amount_cents", "case.estate_cash_on_hand_cents += demand_amount_cents", "case.version += 1"]

  - method: POST
    path: "/trustee/avoidance_actions/{id}/rescind"
    description: "JUDGMENT -> RESCINDED; voids the deposit and debits estate cash (compensating entry)"
    roles: [Court]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: ["RecoveryDeposit -> VOIDED", "recovered_amount_cents = 0", "case.estate_cash_on_hand_cents -= demand_amount_cents", "case.version += 1"]

  - method: POST
    path: "/trustee/avoidance_actions/{id}/abandon"
    description: "IDENTIFIED/ANALYZED -> ABANDONED"
    roles: [Trustee]
    code: 200
    input: []
    output: AvoidanceAction
    side_effects: []

