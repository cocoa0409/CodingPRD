            - "Hop 1: EnrollmentContract.${conA}.status == ENROLLED and paid_cents == 300000 (payment exactly equals deposit_amount_cents)"
            - "Hop 2: Application.${appA}.status == ENROLLED"
            - "Hop 3: Student.${st_new} exists with source == ADMISSION, status == ACTIVE, family_id == fam-a, current_grade_section_id == ${sec}"
            - "GradeSection.${sec}.seats_held == 1 (enrollment keeps the seat held; no double count)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_precondition_beats_deadline
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_APPLICATION_NOT_DRAFT]
          - errors[ERR_ROUND_DEADLINE_PASSED]
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: resubmitting an already
          SUBMITTED application after the EARLY deadline violates both p4
          (ERR_APPLICATION_NOT_DRAFT) and p5 (ERR_ROUND_DEADLINE_PASSED); the p4 state
          error MUST win because state preconditions precede temporal business rules.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section; fam-a EARLY application already SUBMITTED at the default clock (2026-08-01, before the 2026-11-01 early deadline)"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a", captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_APPLICATION_NOT_DRAFT (HTTP 409), NOT ERR_ROUND_DEADLINE_PASSED (HTTP 422) — the state precondition at p4 fires before the temporal rule at p5 even though both are violated"
            - "Application.${app}.status remains SUBMITTED (no side effects)"

      - name: award_accept_stale_verification_beats_pacing
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_AWARD_STALE_VERIFICATION]
          - errors[ERR_AID_PACING_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_fiscal} (distinct from the
          {state, business_temporal} pair of the sibling instance): accepting an award
          whose income was resubmitted (verification stale) while the pacing cap is also
          full MUST return ERR_AWARD_STALE_VERIFICATION (p7), not ERR_AID_PACING_CAP_EXCEEDED (p8).
        test_recipe:
          setup:
            - "OPEN cycle budget 18,050,000 -> OPEN pacing cap 7,220,000"
            - "fam-1 and fam-2 awards of 2,700,000 each ACCEPTED (income == allowance 5,500,000 hh4 -> EFC 0 -> cap-bound award); fam-3 award 1,820,000 ACCEPTED -> committed exactly 7,220,000 == cap"
            - "fam-x: verified 5,500,000 hh4, finalized -> final 2,700,000, award OFFERED; then family resubmits income -> verification SUBMITTED, award stays OFFERED (stale)"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-1", first_name: "A1", last_name: "One", date_of_birth: "2013-01-01" }, as: Parent, as_user_id: "fam-1", captures: { apl1: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl1}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-1", captures: { app1: $.data.id } }
            - { call: "POST /admissions/applications/${app1}/submit", payload: {}, as: Parent, as_user_id: "fam-1" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app1}", reported_annual_income_cents: 5500000, household_size: 4 }, as: Parent, as_user_id: "fam-1", captures: { aid1: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid1}/verify", payload: { verified_annual_income_cents: 5500000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid1}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
