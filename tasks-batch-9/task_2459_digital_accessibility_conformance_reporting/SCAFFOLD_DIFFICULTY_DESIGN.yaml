  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: component_assessment_and_design_review_dimensions_are_independent
        grounds:
          - state_machines.ProductComponent.NOT_REVIEWED_to_REVIEWED_BLOCKED
          - state_machines.ProductComponent.REVIEWED_BLOCKED_to_REVIEWED_PASS
          - entities.ProductComponent.fields.assessment_state
          - entities.ProductComponent.fields.design_review_state
        distinguishing_aspect: |
          Non-linearity instance 1 of 3, on ProductComponent: two parallel state dimensions on one
          row — design_review_state cycles NOT_REVIEWED -> REVIEWED_BLOCKED -> REVIEWED_PASS while
          assessment_state stays COMPLETE and coverage_pct stays 45.00, proving the dimensions
          advance independently rather than as one pipeline.
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40"
            - "One COMPLETED MANUAL SCREEN_READER run exercising 40 criteria, so coverage_pct is 45.00 and assessment_state is COMPLETE"
            - "design_review_state is still NOT_REVIEWED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccessibilityLead
            - call: "POST /standards"
              payload: { code: "WCAG_2_2", title: "WCAG 2.2", surface_scope: "WEB", max_target_level: "AAA" }
              as: AccessibilityLead
              captures: { std_id: $.data.id }
