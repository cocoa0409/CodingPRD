              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          trigger:
            - call: "POST /in-bond/compliance-sweeps"
              payload: { note: "boundary sweep at the deadline instant" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { sw_at: $.data.overdue_marked_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:01Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/compliance-sweeps"
              payload: { note: "boundary sweep one second past the deadline" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { sw_after: $.data.overdue_marked_count }
          assert:
            - "the first sweep reported overdue_marked_count == 0 (captured as ${sw_at})"
            - "after the first sweep InBondMovement.${m1}.transit_status == IN_TRANSIT and overdue_days == 0"
            - "the second sweep reported overdue_marked_count == 1 (captured as ${sw_after})"
            - "after the second sweep InBondMovement.${m1}.transit_status == OVERDUE and overdue_days == 1"
            - "BondedCarrier.${c1}.overdue_movement_count == 1"
            - "BondedCarrier.${c1}.sanction_points == 0.0 (an overdue movement alone is not a claim)"
            - "CustomsBond.${b1}.obligated_amount == 41.75"

      - name: sanction_throttle_halves_the_transit_window_of_the_next_filing
        claim_type: threshold
        grounds:
          - calculations.transit_allowance_and_deadline.constants.SANCTION_THROTTLE_THRESHOLD
          - calculations.carrier_sanction_points
