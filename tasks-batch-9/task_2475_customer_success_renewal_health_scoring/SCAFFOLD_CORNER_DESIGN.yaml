  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_account_version_on_coverage_assignment_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[coverage-assignment-create-stale-account]
          - validations[priority=9]
          - errors.ERR_STALE_ACCOUNT_VERSION
        distinguishing_aspect: "The version observed at account creation goes stale once a signal and a segmentation write to the account, so replaying it in expected_account_version returns ERR_STALE_ACCOUNT_VERSION (412); the freshly read version admits the same assignment with load_units 17."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
