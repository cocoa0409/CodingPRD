    side_effects: ["accuracy_pct, result computed", "CustomerMeter.last_test_accuracy_pct updated", "conditional cross-entity cascade to FLAGGED_FOR_REPLACEMENT", "AuditEvent appended"]
  - method: POST
    path: "/nrw/meter-accuracy-tests/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [MeterTechnician]
    code: 200
    input: []
    output: MeterAccuracyTest
    side_effects: ["AuditEvent appended"]

  # --- UnauthorizedConsumptionCase ---
  - method: POST
    path: "/nrw/unauthorized-consumption-cases"
    description: "Open an investigation (OPEN x NONE)"
    roles: [Investigator]
    code: 201
    input: [dma_id, service_location_ref, opened_at]
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/nrw/unauthorized-consumption-cases/{id}"
    description: "Fetch one case (both state dimensions)"
    roles: [ProgramDirector, Investigator]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: []
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/begin-evidence"
    description: "OPEN -> EVIDENCE_GATHERING"
    roles: [Investigator]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/substantiate"
    description: "EVIDENCE_GATHERING -> SUBSTANTIATED with estimated_loss_m3"
    roles: [Investigator]
    code: 200
    input: [estimated_loss_m3]
    output: UnauthorizedConsumptionCase
    side_effects: ["substantiated_by_user_id stamped", "AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/close-unfounded"
    description: "EVIDENCE_GATHERING -> UNFOUNDED"
    roles: [Investigator]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/close"
    description: "UNFOUNDED|SUBSTANTIATED -> CLOSED with billing-dimension guard"
    roles: [Investigator]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/propose-adjustment"
    description: "billing NONE -> PROPOSED (gated on SUBSTANTIATED)"
    roles: [Investigator]
    code: 200
    input: [proposed_adjustment_amount]
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/approve-adjustment"
    description: "billing PROPOSED -> APPROVED; actor must differ from substantiated_by_user_id"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/reject-adjustment"
    description: "billing PROPOSED -> REJECTED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/unauthorized-consumption-cases/{id}/post-adjustment"
    description: "billing APPROVED -> POSTED; posted_adjustment_amount := proposed_adjustment_amount"
    roles: [Investigator]
    code: 200
    input: []
    output: UnauthorizedConsumptionCase
    side_effects: ["AuditEvent appended"]

  # --- PressureProject ---
  - method: POST
    path: "/nrw/pressure-projects"
    description: "Create a pressure management project (PROPOSED)"
    roles: [UtilityAnalyst]
    code: 201
    input: [dma_id, name, planned_start, planned_end, baseline_pressure_m, target_pressure_m]
    output: PressureProject
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/nrw/pressure-projects/{id}"
    description: "Fetch one project"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: []
    output: PressureProject
    side_effects: []
  - method: POST
    path: "/nrw/pressure-projects/{id}/approve"
    description: "PROPOSED -> APPROVED (requires DMA posture OPEN)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PressureProject
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/pressure-projects/{id}/reject"
    description: "PROPOSED|APPROVED -> REJECTED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PressureProject
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/pressure-projects/{id}/activate"
    description: "APPROVED -> ACTIVE (clock >= planned_start); DMA posture -> RESTRICTED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PressureProject
    side_effects: ["DistrictMeteredArea.posture recomputed", "AuditEvent appended"]
  - method: POST
    path: "/nrw/pressure-projects/{id}/commission"
    description: "ACTIVE -> COMMISSIONED with measured_pressure_m"
    roles: [ProgramDirector]
    code: 200
    input: [measured_pressure_m]
    output: PressureProject
    side_effects: ["pressure_reduction_pct and estimated_leak_reduction_m3_per_year computed", "DistrictMeteredArea.posture recomputed", "AuditEvent appended"]

  # --- InterventionProposal ---
  - method: POST
    path: "/nrw/intervention-proposals"
    description: "Draft an intervention proposal (DRAFT); BCR computed PROVISIONAL"
    roles: [UtilityAnalyst]
    code: 201
    input: [dma_id, kind, capital_cost, annual_om_cost, expected_volume_saved_m3_per_year]
    output: InterventionProposal
    side_effects: ["benefit_cost_ratio and payback_years computed (PROVISIONAL)", "AuditEvent appended"]
  - method: GET
    path: "/nrw/intervention-proposals/{id}"
    description: "Fetch one proposal"
    roles: [ProgramDirector, UtilityAnalyst]
    code: 200
    input: []
    output: InterventionProposal
    side_effects: []
  - method: POST
    path: "/nrw/intervention-proposals/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [UtilityAnalyst]
    code: 200
    input: []
    output: InterventionProposal
    side_effects: ["benefit_cost_ratio recomputed (PROVISIONAL)", "AuditEvent appended"]
  - method: POST
    path: "/nrw/intervention-proposals/{id}/approve"
    description: "SUBMITTED -> APPROVED; BCR gate; recomputes BANKABLE; archives superseded same-kind siblings"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: InterventionProposal
    side_effects: ["benefit_cost_ratio recomputed (BANKABLE)", "supersede cascade to ARCHIVED on prior APPROVED same-kind proposals for the DMA", "AuditEvent appended"]
  - method: POST
    path: "/nrw/intervention-proposals/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: InterventionProposal
    side_effects: ["AuditEvent appended"]

  # --- BenchmarkReport ---
  - method: POST
    path: "/nrw/benchmark-reports"
    description: "Create a benchmark report draft over a set of DMAs"
    roles: [RegulatorLiaison]
    code: 201
    input: [reporting_year, reporting_period_start, reporting_period_end, dma_ids]
    output: BenchmarkReport
    side_effects: ["AuditEvent appended"]
  - method: GET
    path: "/nrw/benchmark-reports"
    description: "List benchmark reports"
    roles: [ProgramDirector, UtilityAnalyst, RegulatorLiaison]
    code: 200
    input: ["status?", "reporting_year?", "dma_ids?", "limit?", "offset?"]
    output: BenchmarkReport[]
    side_effects: []
  - method: GET
    path: "/nrw/benchmark-reports/{id}"
    description: "Fetch one report including frozen per_dma_breakdown"
    roles: [ProgramDirector, UtilityAnalyst, RegulatorLiaison]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects: []
  - method: POST
    path: "/nrw/benchmark-reports/{id}/submit"
    description: "DRAFT|RETURNED -> SUBMITTED with OCC on the report; freezes snapshot; freezes DMA postures"
    roles: [RegulatorLiaison]
    code: 200
    input: [expected_report_version]
    output: BenchmarkReport
    side_effects:
      - "utility_nrw_pct, utility_ili, per_dma_breakdown computed/frozen (calculations.benchmark_nrw_aggregation)"
      - "cascade: DMA posture -> FROZEN for every listed DMA"
      - "increments BenchmarkReport.version by 1"
      - "AuditEvent appended"
  - method: POST
    path: "/nrw/benchmark-reports/{id}/accept"
    description: "SUBMITTED -> ACCEPTED"
    roles: [RegulatorLiaison]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects: ["AuditEvent appended"]
  - method: POST
    path: "/nrw/benchmark-reports/{id}/return"
    description: "SUBMITTED -> RETURNED; compensates DMA freeze"
    roles: [RegulatorLiaison]
    code: 200
    input: []
    output: BenchmarkReport
    side_effects: ["compensation: DMA posture FROZEN -> OPEN when ungated", "AuditEvent appended"]

  # --- AuditEvent ---
  - method: GET
    path: "/nrw/audit-events"
    description: "List audit events with filters"
    roles: [ProgramDirector, RegulatorLiaison]
    code: 200
    input: ["entity_type?", "entity_id?", "actor_user_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or role not recognized"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role is authenticated but not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body FK does not resolve to an existing row"
  - id: ERR_DUPLICATE
    http: 409
    condition: "unique constraint violated (DMA code, meter serial_number including replacement serial)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "state-machine from-state does not allow the invoked transition; terminal states reject all transitions"
  - id: ERR_DMA_FROZEN
    http: 409
    condition: "parent DMA posture forbids the operation (FROZEN blocks child mutation; pressure approve requires OPEN)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "acting user's X-User-ID equals the anchor user the transition must be segregated from (creator/finalizer, reporter/verifier, substantiator/approver)"
  - id: ERR_WINDOW_CONFLICT
    http: 409
    condition: "interval invalid or overlapping: bad ordering, duration out of bounds, half-open overlap violation, or night-flow 1-hour buffer violation"
  - id: ERR_VALIDATION
    http: 422
    condition: "scalar constraint violated (range, enum membership, required-field missing, cross-field ordering like target_pressure_m < baseline_pressure_m)"
  - id: ERR_MISSING_PREREQUISITE
    http: 422
    condition: "cross-entity content prerequisite absent (no qualifying FINALIZED balance for benchmark submit; missing estimated_loss_m3 / actual_repair_cost / measured_pressure_m)"
  - id: ERR_BCR_BELOW_THRESHOLD
    http: 422
    condition: "InterventionProposal approve attempted with benefit_cost_ratio < 1.00"
  - id: ERR_BALANCE_INCONSISTENT
    http: 422
    condition: "water balance submit where billed + unbilled + apparent losses exceed system input (real_loss_raw < 0)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version (OCC)"
  - id: ERR_CHILDREN_OPEN
    http: 409
    condition: "LeakSurvey cancel blocked by non-terminal child Leaks"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Utility program director; administers DMAs, approves pressure projects and interventions, approves billing adjustments, sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/dmas"
      - "POST /nrw/_clock/set_current_utc"
      - "POST /nrw/pressure-projects/{id}/approve"
      - "POST /nrw/pressure-projects/{id}/reject"
      - "POST /nrw/pressure-projects/{id}/activate"
      - "POST /nrw/pressure-projects/{id}/commission"
      - "POST /nrw/intervention-proposals/{id}/approve"
      - "POST /nrw/intervention-proposals/{id}/reject"
      - "POST /nrw/unauthorized-consumption-cases/{id}/approve-adjustment"
      - "POST /nrw/unauthorized-consumption-cases/{id}/reject-adjustment"
    shared_operations:
      - "GET reads across all resources"
      - "GET /nrw/audit-events"
  - name: UtilityAnalyst
    description: "NRW analyst; owns water balances, night-flow assessments, pressure project drafting, intervention proposals"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/water-balance-periods"
      - "POST /nrw/water-balance-periods/{id}/submit"
      - "POST /nrw/water-balance-periods/{id}/finalize"
      - "POST /nrw/night-flow-assessments"
      - "POST /nrw/night-flow-assessments/{id}/analyze"
      - "POST /nrw/night-flow-assessments/{id}/void"
      - "POST /nrw/pressure-projects"
      - "POST /nrw/intervention-proposals"
      - "POST /nrw/intervention-proposals/{id}/submit"
    shared_operations:
      - "GET reads on dmas, balances, assessments, surveys, leaks, meters, pressure projects, proposals, benchmark reports"
  - name: FieldSupervisor
    description: "Leak detection crew lead; owns surveys and leak lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/leak-surveys"
      - "POST /nrw/leak-surveys/{id}/start"
      - "POST /nrw/leak-surveys/{id}/complete"
      - "POST /nrw/leak-surveys/{id}/cancel"
      - "POST /nrw/leaks"
      - "POST /nrw/leaks/{id}/verify"
      - "POST /nrw/leaks/{id}/schedule-repair"
      - "POST /nrw/leaks/{id}/complete-repair"
      - "POST /nrw/leaks/{id}/verify-repair"
      - "POST /nrw/leaks/{id}/reopen"
      - "POST /nrw/leaks/{id}/withdraw"
    shared_operations:
      - "GET reads on dmas, surveys, leaks"
  - name: MeterTechnician
    description: "Meter shop technician; owns meter registry and accuracy testing"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/customer-meters"
      - "POST /nrw/customer-meters/{id}/flag-replacement"
      - "POST /nrw/customer-meters/{id}/replace"
      - "POST /nrw/customer-meters/{id}/retire"
      - "POST /nrw/meter-accuracy-tests"
      - "POST /nrw/meter-accuracy-tests/{id}/complete"
      - "POST /nrw/meter-accuracy-tests/{id}/cancel"
    shared_operations:
      - "GET reads on dmas, meters, accuracy tests"
  - name: Investigator
    description: "Revenue-protection investigator; owns unauthorized-consumption cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/unauthorized-consumption-cases"
      - "POST /nrw/unauthorized-consumption-cases/{id}/begin-evidence"
      - "POST /nrw/unauthorized-consumption-cases/{id}/substantiate"
      - "POST /nrw/unauthorized-consumption-cases/{id}/close-unfounded"
      - "POST /nrw/unauthorized-consumption-cases/{id}/close"
      - "POST /nrw/unauthorized-consumption-cases/{id}/propose-adjustment"
      - "POST /nrw/unauthorized-consumption-cases/{id}/post-adjustment"
    shared_operations:
      - "GET reads on dmas and cases"
  - name: RegulatorLiaison
    description: "State reporting liaison; owns benchmark report lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /nrw/benchmark-reports"
      - "POST /nrw/benchmark-reports/{id}/submit"
      - "POST /nrw/benchmark-reports/{id}/accept"
      - "POST /nrw/benchmark-reports/{id}/return"
    shared_operations:
      - "GET reads on dmas, balances, benchmark reports"
      - "GET /nrw/audit-events"
