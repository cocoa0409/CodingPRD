      - name: scoped_compliance_sweep_touches_only_the_named_models_obligations
        claim_type: bulk_action
        grounds:
          - endpoints[POST /repair-program/compliance-sweeps]
          - calculations.obligation_status_evaluation.formula
          - calculations.model_compliance_posture_rollup.formula
        distinguishing_aspect: |
          The same bulk endpoint is a per-model operation when model_id is present
          and a whole-population operation when it is absent, and breach_count
