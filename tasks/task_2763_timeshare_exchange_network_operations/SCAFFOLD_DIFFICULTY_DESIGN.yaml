            - "hop 1 — GET /exchange-network/deposits/${dep}: deposit_status == \"EXPIRED\", expires_at == \"2028-10-31T00:00:00Z\", awarded_power == 27, rental_status == \"NOT_LISTED\""
            - "hop 1 — GET /exchange-network/members/${m1}: trading_power_balance == 0, and GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DEPOSIT_EXPIRY_FORFEIT has total_count == 1 with power_delta == -27"
            - "hop 2 — GET /exchange-network/resorts/${resort_c}: deposits_committed_count == 0 and committed_nights == 0"
            - "hop 2 — GET /exchange-network/resorts/${resort_c}/compliance: counted_by_stay_year == 0 and shortfall_by_stay_year == 1 and obligation_units == 1"
            - "hop 3 — GET /exchange-network/resorts/${resort_c}: affiliation_status == \"PROBATION\""
            - "hop 3 — GET /exchange-network/matching-runs/${run1}: expired_deposit_count == 1, probation_resort_count == 1, getaway_listed_count == 0, lapsed_member_count == 0"
            - "GET /exchange-network/matching-runs/${run2} — expired_deposit_count == 0 and probation_resort_count == 0 (step 6 evaluates only resorts touched by step 1 of the same run)"
            - "GET /exchange-network/resorts/${resort_c} — affiliation_status is still \"PROBATION\" after run2 and run_sequence values are 1 then 2"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    rule_summary: >-
      A single request that violates two validations from different categories,
      where only the lower-priority-number error_id may be returned and the
      other rule must be demonstrably live.
    instances:

      - name: lapsed_member_state_beats_wallet_fiscal_on_exchange_request
        conflicting_pair:
          - { priority: 12, category: state, error_id: ERR_MEMBER_NOT_ACTIVE, http_status: 409 }
          - { priority: 32, category: business_fiscal, error_id: ERR_INSUFFICIENT_WALLET_CREDIT, http_status: 402 }
        expected_error: ERR_MEMBER_NOT_ACTIVE
        why_hard: >-
          M2 has lapsed AND has a wallet of exactly 0 against a 55000-cent REQUEST_FIRST charge, so
          both rules fire on the same call. The state category outranks the fiscal category, so the
          answer is 409 ERR_MEMBER_NOT_ACTIVE. An implementation that checks affordability first —
          the natural order, because the charge is computed before anything else is written —
          returns 402 and fails. The second half of the test reinstates the member and shows the
          fiscal rule was live all along.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with a GOLD band 04-01..06-30, affiliated at the default clock.
            Member M2 on PLUS pays dues of exactly 19900 with paid_through_date 2026-08-31, so
            wallet_credit_cents is 0 and dues_paid_through is 2026-08-31. The clock moves to
            2026-10-01 and a matching run sweeps M2 from ACTIVE to LAPSED. A REQUEST_FIRST request
            (no funding deposit) over 2027-06-01..2027-06-30 for a ONE_BR would be quoted 55000
            cents: estimate 82, budget 0, gap 82, shortfall 28700, subtotal 52100, no deposit-first
            credit, processing fee 2900.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 19900, paid_through_date: "2026-08-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "dues lapse sweep" }
              captures: { run1: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30" }
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /exchange-network/matching-runs/${run1} — lapsed_member_count == 1"
            - "GET /exchange-network/members/${m2} — enrollment_status == \"LAPSED\", wallet_credit_cents == 0, dues_paid_through == \"2026-08-31\""
            - "trigger response — HTTP 409 with error_id ERR_MEMBER_NOT_ACTIVE, NOT 402 ERR_INSUFFICIENT_WALLET_CREDIT"
            - "GET /exchange-network/exchange-requests?member_id=${m2} — total_count == 0 (the rejected call wrote nothing)"
            - "GET /exchange-network/members/${m2} — active_request_count == 0 and wallet_credit_cents == 0 (no partial debit)"
            - "control: after the operator moves M2 back to ACTIVE with a dues payment of 19900 and paid_through_date 2030-12-31 (wallet still 0), the identical request returns HTTP 402 with error_id ERR_INSUFFICIENT_WALLET_CREDIT, proving the fiscal rule was live and merely outranked"

      - name: suspended_resort_safety_beats_missing_season_band_referential_on_deposit
        conflicting_pair:
          - { priority: 15, category: business_safety, error_id: ERR_RESORT_NOT_AFFILIATED, http_status: 409 }
          - { priority: 21, category: business_referential, error_id: ERR_NO_SEASON_BAND_FOR_DATE, http_status: 422 }
        expected_error: ERR_RESORT_NOT_AFFILIATED
        why_hard: >-
          The deposit names a SUSPENDED resort AND a check-in date that no season band of that resort
          covers. Resolving the season band is the natural first step, because the band is needed to
          value the week at all, so the tempting implementation answers 422. The declared order puts
          business_safety ahead of business_referential, so the answer is 409. Reactivating the
          resort and repeating the identical call proves the referential rule is live.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with exactly one GOLD band 04-01..06-30 — nothing covers January —
            affiliated at the default clock and then moved to SUSPENDED by the operator. Member M1 on
            PLUS, dues-paid. The candidate deposit is a ONE_BR week checking in 2027-01-20, which is
            far enough ahead to clear the 60-day banking window but is covered by no band.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "SUSPENDED", reason: "unresolved maintenance findings" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-01-20" }
              captures: { err: "$.data.error_id" }
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "ACTIVE", reason: "findings closed" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-01-20" }
