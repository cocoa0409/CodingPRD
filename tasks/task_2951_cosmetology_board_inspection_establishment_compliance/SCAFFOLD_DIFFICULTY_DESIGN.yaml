              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-02", discipline: "DISINFECTION", school_id: "${school_id}" }
