# =============================================================================
# SCAFFOLD — Harbor Pilot Association Dispatch
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Harbor Pilot Association Dispatch (state harbor pilots association): pilot
  rotation board & fatigue rules, vessel order intake & ETA updates,
  boarding/launch scheduling & pilot boat crew, tariff calculation by
  draft/tonnage & extras (detention/delay), license & endorsement currency by
  tonnage, incident review & investigation, apprentice program & progression,
  association revenue distribution

domain_name: harbor-pilot-dispatch
api_prefix: /pilotage

complexity_profile:
  primary_archetype: temporal_windowing        # pilot + boat intervals with distinct adjacency/buffer semantics
  secondary_archetype: pricing_engine          # draft/tonnage tariff with provisional-vs-final dual variant
  complexity_layers:
    - selector_policy                          # rotation board pilot pick + boat pick, pinned rank/tie-break/empty-pool
    - dual_variant_calculation                 # provisional average-rate vs final marginal-rate tariff
    - cascading_side_effects                   # incident substantiation -> suspension -> off-board -> recall
    - optimistic_concurrency                   # OCC on VesselOrder.version and Pilot.version
  entity_topology: flat                        # peer entities with FK references; no URL nesting
  state_machine_shape: parallel                # Assignment.service_status x Assignment.billing_status (+ branching Incident)
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs declared on children)
# =============================================================================
entities:
  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Pilot legal name; required" }
      - { name: license_number, type: string, source: input, description: "State pilot license number; required, unique" }
      - { name: share_units, type: integer, source: input, description: "Revenue-distribution weight (cooperative shares); required, >= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED only via incident substantiation", constraints: "enum {ACTIVE, SUSPENDED}" }
      - { name: rest_until, type: datetime, source: computed, description: "Earliest instant the pilot may start a new assignment; null until first completion", constraints: "nullable" }
      - { name: duty_minutes_rolling_7d, type: integer, source: computed, description: "Sum of (actual_end - actual_start) minutes over own COMPLETED assignments with actual_end >= now - 7 days (boundary inclusive)" }

  - name: LicenseEndorsement
    parent: null
    common_fields: true
    fields:
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id; owning pilot" }
      - { name: endorsement_class, type: enum, source: input, description: "Endorsement class; required", constraints: "enum {HARBOR, COASTAL, UNLIMITED}" }
      - { name: tonnage_cap_gt, type: integer, source: input, description: "Maximum vessel gross tonnage this endorsement covers; required, > 0" }
      - { name: expires_at, type: datetime, source: input, description: "Currency expiry; endorsement current only while expires_at > logical clock" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUPERSEDED; SUPERSEDED when a new same-class endorsement is created for the same pilot", constraints: "enum {CURRENT, SUPERSEDED}" }

  - name: RotationEntry
    parent: null
    common_fields: true
    fields:
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id; exactly one entry per pilot" }
      - { name: position, type: integer, source: system, description: "Board order; unique among all entries; new pilots get max(position)+1; dispatched pilot moves to max(position)+1" }
      - { name: previous_position, type: integer, source: system, description: "Position held immediately before the last dispatch selection; null until first dispatch; restored on assignment cancel", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: IN_ROTATION, description: "IN_ROTATION | OFF_BOARD; OFF_BOARD when pilot suspended", constraints: "enum {IN_ROTATION, OFF_BOARD}" }

  - name: VesselOrder
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "Opaque vessel-agent operator id captured from X-User-ID at creation; ownership check on PATCH/cancel" }
      - { name: vessel_name, type: string, source: input, description: "Vessel name; required" }
      - { name: gt, type: integer, source: input, description: "Gross tonnage; required, > 0" }
      - { name: draft_dm, type: integer, source: input, description: "Draft in decimeters; required, > 0" }
      - { name: order_type, type: enum, source: input, description: "Movement type; required", constraints: "enum {ARRIVAL, DEPARTURE, SHIFT}" }
      - { name: eta, type: datetime, source: input, description: "Estimated time of arrival/startup; required; must be strictly after the logical clock at intake/amendment" }
      - { name: tariff_schedule_id, type: string, source: system, description: "FK -> TariffSchedule.id; ACTIVE schedule pinned at creation (and re-pinned on PATCH)" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Provisional tariff (average-rate variant) over declared gt/draft; recomputed on PATCH when gt/draft change" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | DISPATCHED | IN_SERVICE | COMPLETED | CANCELLED", constraints: "enum {BOOKED, DISPATCHED, IN_SERVICE, COMPLETED, CANCELLED}" }

  - name: PilotBoat
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Boat name; required, unique" }
      - { name: capacity_persons, type: integer, source: input, description: "Crew+passenger capacity; required, >= 1" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | ON_RUN; ON_RUN while any referencing assignment has service_status in {EN_ROUTE, ABOARD}, else AVAILABLE", constraints: "enum {AVAILABLE, ON_RUN}" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> VesselOrder.id; the dispatched order" }
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id; chosen by rotation selector at dispatch, or validated explicit pilot_id on reassign" }
      - { name: boat_id, type: string, source: system, description: "FK -> PilotBoat.id; explicit boat_id or boat selector at dispatch; reassign may switch" }
      - { name: apprentice_id, type: string, source: system, description: "FK -> Apprentice.id; optional training rider; must reference an ENROLLED apprentice", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned service window start; required at dispatch" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned service window end; required at dispatch; must be > scheduled_start" }
      - { name: actual_start, type: datetime, source: system, description: "Logical clock at /start; null until started", constraints: "nullable" }
      - { name: actual_end, type: datetime, source: system, description: "Logical clock at /complete; null until completed", constraints: "nullable" }
      - { name: detention_minutes, type: integer, source: input, description: "Detention minutes claimed at completion; required at /complete, >= 0" }
      - { name: delay_minutes, type: integer, source: input, description: "Delay minutes claimed at completion; required at /complete, >= 0" }
      - { name: service_status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | EN_ROUTE | ABOARD | COMPLETED | RECALLED | CANCELLED", constraints: "enum {ASSIGNED, EN_ROUTE, ABOARD, COMPLETED, RECALLED, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED | SETTLED; independent dimension from service_status", constraints: "enum {UNBILLED, INVOICED, SETTLED}" }
      - { name: recall_count, type: integer, source: system, default: 0, description: "Number of times this assignment has been recalled" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; exactly one invoice per assignment, minted at completion" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Final marginal-rate tariff base over order gt/draft" }
      - { name: detention_fee_cents, type: integer, source: computed, description: "max(0, detention_minutes - free_minutes) * detention rate" }
      - { name: delay_fee_cents, type: integer, source: computed, description: "delay_minutes * delay rate" }
      - { name: total_cents, type: integer, source: computed, description: "base + detention + delay (per-component rounding, then sum)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | FINALIZED | DISTRIBUTED", constraints: "enum {ISSUED, FINALIZED, DISTRIBUTED}" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical clock at finalize; distribution window membership key", constraints: "nullable" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; incident subject; required" }
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id; derived from the assignment's pilot" }
      - { name: incident_type, type: enum, source: input, description: "Incident category; required", constraints: "enum {GROUNDING, COLLISION, NEAR_MISS, EQUIPMENT, CONDUCT}" }
      - { name: description, type: string, source: input, description: "Free-text report; required" }
      - { name: corrective_note, type: string, source: input, description: "Required at /close; null until then", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | UNDER_REVIEW | DISMISSED | SUBSTANTIATED | CLOSED", constraints: "enum {REPORTED, UNDER_REVIEW, DISMISSED, SUBSTANTIATED, CLOSED}" }

  - name: Apprentice
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Apprentice name; required" }
      - { name: track, type: enum, source: input, description: "Progression track selecting the readiness variant; required", constraints: "enum {STANDARD, ACCELERATED}" }
      - { name: trips_completed, type: integer, source: system, default: 0, description: "Training trips logged (record-progress delta and +1 per completed riding assignment)" }
      - { name: evaluations_count, type: integer, source: system, default: 0, description: "Number of evaluation scores recorded" }
      - { name: evaluation_avg, type: number, source: computed, default: 0, description: "Running average of recorded evaluation scores; 0 when none" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | QUALIFIED | CERTIFIED", constraints: "enum {ENROLLED, QUALIFIED, CERTIFIED}" }

  - name: TariffSchedule
    parent: null
    common_fields: true
    fields:
      - { name: effective_from, type: datetime, source: input, description: "When this schedule starts governing; required" }
      - { name: tiers, type: array, source: input, description: "Ordered tonnage tiers [{min_gt_exclusive, max_gt_inclusive|null, rate_cents_per_gt}]; required, non-empty" }
      - { name: draft_surcharge_threshold_dm, type: integer, source: input, description: "Draft strictly greater than this triggers the surcharge; required" }
      - { name: draft_surcharge_pct, type: number, source: input, description: "Multiplier applied to base when surcharge triggers (e.g. 0.15); required" }
      - { name: detention_free_minutes, type: integer, source: input, description: "Free detention allowance per assignment; required, >= 0" }
      - { name: detention_rate_cents_per_minute, type: integer, source: input, description: "Detention charge per minute beyond allowance; required, >= 0" }
      - { name: delay_rate_cents_per_minute, type: integer, source: input, description: "Delay charge per minute (no allowance); required, >= 0" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | ACTIVE | SUPERSEDED; ACTIVE = greatest effective_from <= clock; SCHEDULED = effective_from > clock; SUPERSEDED = any other", constraints: "enum {SCHEDULED, ACTIVE, SUPERSEDED}" }

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Window start (inclusive); required" }
      - { name: period_end, type: datetime, source: input, description: "Window end (exclusive); required, > period_start" }
      - { name: gross_pool_cents, type: integer, source: computed, description: "Sum of total_cents over FINALIZED invoices with finalized_at in [period_start, period_end)" }
      - { name: levy_cents, type: integer, source: computed, description: "Association levy; tier keyed on gross_pool_cents BEFORE deduction" }
      - { name: net_pool_cents, type: integer, source: computed, description: "gross_pool_cents - levy_cents" }
      - { name: shares, type: array, source: computed, description: "[{pilot_id, share_units, share_cents}] over eligible pilots; remainder reconciled one cent per pass" }
      - { name: invoice_ids, type: array, source: system, description: "Snapshot of invoice ids swept into this run" }
      - { name: status, type: enum, source: system, default: COMPUTED, description: "COMPUTED | SETTLED | VOID", constraints: "enum {COMPUTED, SETTLED, VOID}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VesselOrder
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DISPATCHED
        trigger: "POST /pilotage/vessel-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "order.status == BOOKED"
          - "rotation selector pool non-empty (else ERR_NO_ELIGIBLE_PILOT)"
          - "boat pool non-empty (else ERR_NO_ELIGIBLE_BOAT)"
        side_effects:
          - "creates Assignment(service_status=ASSIGNED, billing_status=UNBILLED) with selected pilot/boat"
          - "selected pilot's RotationEntry: previous_position := position; position := max(position over all entries)+1"
      - from: DISPATCHED
        to: IN_SERVICE
        trigger: "POST /pilotage/assignments/{id}/start on the order's non-terminal assignment"
        actor: Pilot
        preconditions: ["assignment.service_status == ASSIGNED"]
        side_effects: ["order.updated_at refreshed"]
      - from: IN_SERVICE
        to: COMPLETED
        trigger: "POST /pilotage/assignments/{id}/complete"
        actor: Pilot
        preconditions: ["assignment.service_status == ABOARD"]
        side_effects: ["order.updated_at refreshed"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /pilotage/vessel-orders/{id}/cancel"
        actor: VesselAgent
        preconditions: ["requester X-User-ID == order.agent_id"]
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /pilotage/vessel-orders/{id}/cancel"
        actor: VesselAgent
        preconditions: ["requester X-User-ID == order.agent_id"]
        side_effects:
          - "cascade hop 1: the order's non-terminal Assignment -> CANCELLED (service_status)"
          - "cascade hop 2 (caused by the assignment cancellation): pilot's RotationEntry.position := previous_position (compensation) and the boat's booked interval is released"

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Two parallel state dimensions on one row: service_status (below) x billing_status (UNBILLED -> INVOICED -> SETTLED). billing_status transitions: UNBILLED -> INVOICED on /complete side effect; INVOICED -> SETTLED on distribution-run settle side effect; CANCELLED assignments keep billing_status UNBILLED forever."
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /pilotage/assignments/{id}/start"
        actor: Pilot
        preconditions:
          - "requester X-User-ID == assignment.pilot_id"
          - "assignment.service_status == ASSIGNED"
        side_effects:
          - "actual_start := logical clock"
          - "VesselOrder(order_id): DISPATCHED -> IN_SERVICE"
          - "PilotBoat(boat_id): AVAILABLE -> ON_RUN"
      - from: EN_ROUTE
        to: ABOARD
        trigger: "POST /pilotage/assignments/{id}/board"
        actor: Pilot
        preconditions: ["requester X-User-ID == assignment.pilot_id"]
        side_effects: []
      - from: ABOARD
        to: COMPLETED
        trigger: "POST /pilotage/assignments/{id}/complete"
        actor: Pilot
        preconditions: ["requester X-User-ID == assignment.pilot_id"]
        side_effects:
          - "actual_end := logical clock; duration_minutes := actual_end - actual_start"
          - "Pilot.rest_until := actual_end + (960 min if duration_minutes >= 480 else 600 min)"
          - "creates Invoice(status=ISSUED) via invoice_final_composition (billing side effect: this assignment's billing_status UNBILLED -> INVOICED)"
          - "VesselOrder(order_id): IN_SERVICE -> COMPLETED"
          - "PilotBoat(boat_id): ON_RUN -> AVAILABLE"
          - "if apprentice_id set: Apprentice.trips_completed += 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /pilotage/assignments/{id}/cancel or cascade from POST /pilotage/vessel-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "pilot's RotationEntry.position := previous_position, previous_position := null (compensation for the dispatch demotion)"
          - "boat interval released (booking removed; PilotBoat stays AVAILABLE)"
          - "if trigger was the direct assignment-cancel endpoint AND VesselOrder(order_id).status == DISPATCHED: order -> BOOKED (revert so it can be re-dispatched); when cascaded from order cancel, order proceeds to CANCELLED instead"
      - from: RECALLED
        to: CANCELLED
        trigger: "POST /pilotage/assignments/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["boat interval released"]
      - from: ASSIGNED
        to: RECALLED
        trigger: "POST /pilotage/assignments/{id}/recall or cascade from POST /pilotage/incidents/{id}/substantiate"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "recall_count += 1"
          - "recalled pilot's RotationEntry is NOT restored (turn consumed); boat interval released"
          - "VesselOrder(order_id) stays DISPATCHED awaiting reassignment"
      - from: RECALLED
        to: ASSIGNED
        trigger: "POST /pilotage/assignments/{id}/reassign"
        actor: Dispatcher
        preconditions:
          - "if payload pilot_id present: pilot passes license-currency, tonnage-cap, rest, duty-limit and closed-interval checks (explicit validation path)"
          - "if payload pilot_id absent: rotation selector must return a pilot (else ERR_NO_ELIGIBLE_PILOT)"
          - "if payload boat_id present: boat passes half-open+buffer interval check (else ERR_BOAT_TIME_CONFLICT)"
        side_effects:
          - "pilot_id / boat_id / scheduled window updated per payload"
          - "new pilot's RotationEntry: previous_position := position; position := max(position)+1"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [DISMISSED, CLOSED]
    note: "Branching fork: UNDER_REVIEW -> DISMISSED (terminal, no side effects) or UNDER_REVIEW -> SUBSTANTIATED (suspension cascade) -> CLOSED. Divergent side-effect sets per branch."
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /pilotage/incidents/{id}/open-review"
        actor: Investigator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /pilotage/incidents/{id}/dismiss"
        actor: Investigator
        preconditions: []
        side_effects: ["none — pilot, rotation entry, and assignments untouched (diverges from SUBSTANTIATED branch)"]
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /pilotage/incidents/{id}/substantiate"
        actor: Investigator
        preconditions: []
        side_effects:
          - "cascade hop 1: Pilot(pilot_id).status ACTIVE -> SUSPENDED"
          - "cascade hop 2 (caused by hop 1 suspension): pilot's RotationEntry.status -> OFF_BOARD"
          - "cascade hop 3 (caused by hop 2 board removal): every Assignment with pilot_id == this pilot AND service_status == ASSIGNED -> RECALLED (recall_count += 1, boat intervals released)"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /pilotage/incidents/{id}/close"
        actor: Investigator
        preconditions: ["payload corrective_note present and non-empty"]
        side_effects: ["corrective_note persisted"]

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: ISSUED
        to: FINALIZED
        trigger: "POST /pilotage/invoices/{id}/finalize"
        actor: FinanceOfficer
        preconditions:
          - "no Incident with assignment_id == invoice.assignment_id has status in {REPORTED, UNDER_REVIEW} (else ERR_INCIDENT_HOLD_ACTIVE)"
        side_effects: ["finalized_at := logical clock"]
      - from: FINALIZED
        to: DISTRIBUTED
        trigger: "POST /pilotage/distribution-runs/{id}/settle (side effect on swept invoices)"
        actor: system
        preconditions: ["invoice id present in the run's invoice_ids snapshot"]
        side_effects: ["Assignment(assignment_id).billing_status: INVOICED -> SETTLED"]

  - entity: Pilot
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pilotage/incidents/{id}/substantiate (cascade hop 1)"
        actor: Investigator
        preconditions: []
        side_effects: ["RotationEntry -> OFF_BOARD; ASSIGNED assignments -> RECALLED (see Incident machine)"]

  - entity: RotationEntry
    initial_state: IN_ROTATION
    terminal_states: []
    transitions:
      - from: IN_ROTATION
        to: OFF_BOARD
        trigger: "cascade hop 2 of incident substantiation (pilot suspension)"
        actor: system
        preconditions: []
        side_effects: ["hop 3: pilot's ASSIGNED assignments -> RECALLED"]
      - from: IN_ROTATION
        to: IN_ROTATION
        trigger: "position renumbering on dispatch selection / cancel compensation (position changes, status unchanged)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Apprentice
    initial_state: ENROLLED
    terminal_states: [CERTIFIED]
    transitions:
      - from: ENROLLED
        to: QUALIFIED
        trigger: "POST /pilotage/apprentices/{id}/advance"
        actor: AssociationAdmin
        preconditions: ["apprentice_readiness(track) == true (else ERR_READINESS_NOT_MET)"]
        side_effects: []
      - from: QUALIFIED
        to: CERTIFIED
        trigger: "POST /pilotage/apprentices/{id}/advance"
        actor: AssociationAdmin
        preconditions: ["payload exam_result == PASS (else ERR_EXAM_NOT_PASSED)"]
        side_effects: []

  - entity: PilotBoat
    initial_state: AVAILABLE
    terminal_states: []
    note: "status is computed, not stored: ON_RUN while any referencing assignment has service_status in {EN_ROUTE, ABOARD}; AVAILABLE otherwise."
    transitions:
      - from: AVAILABLE
        to: ON_RUN
        trigger: "side effect of POST /pilotage/assignments/{id}/start"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_RUN
        to: AVAILABLE
        trigger: "side effect of POST /pilotage/assignments/{id}/complete"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LicenseEndorsement
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "side effect of POST /pilotage/pilots/{id}/endorsements creating a same-class endorsement"
        actor: AssociationAdmin
        preconditions: []
        side_effects: []

  - entity: TariffSchedule
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED]
    note: "status is computed from the logical clock and the population of schedules; see tariff_schedule_resolution."
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system — logical clock reaching effective_from while this schedule holds the greatest effective_from <= clock"
        actor: system
        preconditions: []
        side_effects: ["previously ACTIVE schedule -> SUPERSEDED"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — another schedule becoming ACTIVE"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system — a newer schedule with effective_from <= clock but greater than this one's supersedes it before it ever activated"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DistributionRun
    initial_state: COMPUTED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /pilotage/distribution-runs/{id}/settle"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "every invoice in invoice_ids: FINALIZED -> DISTRIBUTED"
          - "each such invoice's Assignment: billing_status INVOICED -> SETTLED"
      - from: COMPUTED
        to: VOID
        trigger: "POST /pilotage/distribution-runs/{id}/void"
        actor: FinanceOfficer
        preconditions: []
        side_effects: ["no invoice or assignment mutation — swept invoices remain FINALIZED (compensation: run creation's reservation is released)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: order-amend-stale-version
    parent_entity: VesselOrder
    write_endpoint: "PATCH /pilotage/vessel-orders/{id}"
    occ_field: "expected_order_version"
    description: |
      Amending a VesselOrder whose version has advanced since the client last
      observed it is rejected. ETA and draft/tonnage amendments from a stale
      view would silently overwrite a newer amendment that the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: endorsement-create-stale-pilot
    parent_entity: Pilot
    write_endpoint: "POST /pilotage/pilots/{id}/endorsements"
    occ_field: "expected_pilot_version"
    description: |
      Creating an endorsement against a Pilot whose version has advanced since
      the client last observed it is rejected. A same-class endorsement created
      by another writer legitimately supersedes the CURRENT one, so the current
      writer's view of which endorsement is CURRENT is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tariff_base_fee
    trigger: "VesselOrder creation and PATCH (provisional variant); Assignment completion (final variant)"
    algorithm: tiered_pricing
    formula: |
      schedule := VesselOrder.tariff_schedule_id pinned schedule
      # variants select the rate model over the same declared inputs:
      #   provisional_average: r := rate of the single tier (min_gt_exclusive, max_gt_inclusive] containing gt
      #                        base := gt * r
      #   final_marginal:      base := SUM over tiers of max(0, min(gt, tier.max) - tier.min) * tier.rate
      if draft_dm > schedule.draft_surcharge_threshold_dm:
        base := round_half_up(base * (1 + schedule.draft_surcharge_pct))   # integer cents
      fee_cents := base
    input_set: "The VesselOrder's gt and draft_dm (declared values at intake; amended values at completion if PATCHed), and the pinned TariffSchedule row"
    constants:
      SAMPLE_TIERS: "[[0,5000,20],[5000,20000,15],[20000,null,10]]"
      DRAFT_THRESHOLD_DM: 100
      DRAFT_SURCHARGE_PCT: 0.15
    precision: "integer cents, round_half_up applied exactly once (after the optional surcharge)"
    variants:
      - name: provisional_average
        when: "computed at POST /vessel-orders and recomputed at PATCH; stored as VesselOrder.provisional_fee_cents"
        difference: "average-rate model: the single tier containing gt prices the ENTIRE tonnage; excludes detention/delay; uses declared gt/draft"
      - name: final_marginal
        when: "computed at Assignment completion; stored as Invoice.base_fee_cents"
        difference: "marginal model: each tier prices only the tonnage inside it; uses the order's current (possibly amended) gt/draft"

  - name: invoice_final_composition
    trigger: "POST /pilotage/assignments/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents      := tariff_base_fee(final_marginal)                 # integer cents
      detention_fee_cents := max(0, detention_minutes - schedule.detention_free_minutes)
                             * schedule.detention_rate_cents_per_minute      # integer cents
      delay_fee_cents     := delay_minutes * schedule.delay_rate_cents_per_minute
      total_cents         := base_fee_cents + detention_fee_cents + delay_fee_cents
      # PINNED ROUNDING ORDER: each component is rounded to integer cents FIRST
      # (round_half_up), THEN components are summed. Sum-then-round is forbidden.
    input_set: "The completing Assignment (detention_minutes, delay_minutes) and its order's gt/draft_dm + pinned TariffSchedule"
    constants:
      DETENTION_FREE_MINUTES: 30
      DETENTION_RATE_CENTS: 200
      DELAY_RATE_CENTS: 150
    precision: "integer cents; per-component round_half_up then sum (pinned order)"

  - name: fatigue_rolling_duty
    trigger: "dispatch selector eligibility and reassign explicit-pilot validation; pilot detail read"
    algorithm: aggregation
    formula: |
      window_start := now - 7 days
      duty_minutes_rolling_7d := SUM over Assignment a of (a.actual_end - a.actual_start in minutes)
        WHERE a.pilot_id == pilot AND a.service_status == COMPLETED
          AND a.actual_end >= window_start            # boundary INCLUSIVE
      projected := duty_minutes_rolling_7d + (scheduled_end - scheduled_start in minutes)
      eligible  := projected <= MAX_DUTY_MINUTES_7D   # boundary: equality PASSES; only strictly-greater fails
    input_set: "Assignments of the pilot with service_status == COMPLETED and actual_end >= now - 7 days (inclusive); CANCELLED/RECALLED/in-progress rows excluded"
    constants:
      MAX_DUTY_MINUTES_7D: 4320
      DUTY_WINDOW_DAYS: 7
    precision: "whole minutes"

  - name: rest_requirement
    trigger: "Assignment completion (writes Pilot.rest_until); dispatch/reassign eligibility reads it"
    algorithm: threshold
    formula: |
      duration_minutes := actual_end - actual_start
      rest_minutes := LONG_REST_MINUTES if duration_minutes >= LONG_DUTY_THRESHOLD_MINUTES else SHORT_REST_MINUTES
      rest_until := actual_end + rest_minutes
      # boundary: duration exactly 480 -> LONG rest (>= is inclusive)
      # eligibility: pilot available iff rest_until is null OR rest_until <= now
    input_set: "The completing assignment's actual_start/actual_end"
    constants:
      LONG_DUTY_THRESHOLD_MINUTES: 480
      LONG_REST_MINUTES: 960
      SHORT_REST_MINUTES: 600
    precision: "whole minutes"

  - name: rotation_pilot_selection
    trigger: "POST /pilotage/vessel-orders/{id}/dispatch and POST /pilotage/assignments/{id}/reassign when payload pilot_id is absent"
    algorithm: aggregation
    formula: |
      candidates := pilots P where
        P.status == ACTIVE
        AND RotationEntry(P).status == IN_ROTATION
        AND exists LicenseEndorsement e of P with e.status == CURRENT
            AND e.expires_at > now AND e.tonnage_cap_gt >= order.gt
        AND (P.rest_until is null OR P.rest_until <= now)
        AND fatigue_rolling_duty(P) + estimated_minutes <= MAX_DUTY_MINUTES_7D
        AND pilot_interval_overlap(P, [scheduled_start, scheduled_end]) == false
      rank: RotationEntry.position ASC; tie-break: RotationEntry.created_at ASC
      empty pool -> ERR_NO_ELIGIBLE_PILOT (order stays BOOKED; no partial write)
    input_set: "All pilots joined to their RotationEntry and LicenseEndorsements"
    constants: {}
    precision: "n/a"

  - name: pilot_boat_selection
    trigger: "dispatch / reassign when payload boat_id is absent"
    algorithm: aggregation
    formula: |
      candidates := boats B where boat_interval_overlap(B, [scheduled_start, scheduled_end]) == false
      rank: B.created_at ASC; tie-break: B.name ASC
      empty pool -> ERR_NO_ELIGIBLE_BOAT
    input_set: "All PilotBoat rows and their open assignment intervals"
    constants: {}
    precision: "n/a"

  - name: pilot_interval_overlap
    trigger: "rotation_pilot_selection eligibility and reassign explicit-pilot validation"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals, NO buffer. Existing set: the pilot's assignments with
      # service_status in {ASSIGNED, EN_ROUTE, ABOARD}.
      conflict := exists existing [s1, e1] with NOT (new_end < s1 OR new_start > e1)
      # i.e. touching endpoints COLLIDE: new_start == e1 is a conflict.
    input_set: "Pilot's assignments in {ASSIGNED, EN_ROUTE, ABOARD}; the assignment undergoing reassign is excluded from its own conflict set"
    constants: {}
    precision: "minute granularity"

  - name: boat_interval_overlap
    trigger: "pilot_boat_selection eligibility and reassign explicit-boat validation"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals WITH end-side turnaround buffer.
      # Existing occupation: [s1, e1 + BUFFER). New request occupies [new_start, new_end + BUFFER).
      conflict := exists existing [s1, e1] with NOT (new_end + BUFFER <= s1 OR new_start >= e1 + BUFFER)
      # i.e. new_start == e1 + BUFFER is ALLOWED (adjacent at buffer edge).
    input_set: "Boat's assignments in {ASSIGNED, EN_ROUTE, ABOARD}; the assignment undergoing reassign is excluded from its own conflict set"
    constants:
      BOAT_TURNAROUND_BUFFER_MINUTES: 45
    precision: "minute granularity"

  - name: apprentice_readiness
    trigger: "POST /pilotage/apprentices/{id}/advance from ENROLLED"
    algorithm: threshold
    formula: |
      if track == STANDARD:    ready := trips_completed >= STANDARD_TRIPS_REQUIRED
      if track == ACCELERATED: ready := trips_completed >= ACCEL_TRIPS_REQUIRED
                                        AND evaluation_avg >= ACCEL_EVAL_AVG_REQUIRED
    input_set: "The apprentice row"
    constants:
      STANDARD_TRIPS_REQUIRED: 50
      ACCEL_TRIPS_REQUIRED: 40
      ACCEL_EVAL_AVG_REQUIRED: 85
    precision: "evaluation_avg carried at 2 decimal places, round_half_up per record-progress"
    variants:
      - name: standard_trips_only
        when: "track == STANDARD"
        difference: "trip count alone decides; evaluation_avg ignored"
      - name: accelerated_blended
        when: "track == ACCELERATED"
        difference: "lower trip bar PLUS evaluation floor; identical trips_completed/evaluation_avg data yields a different verdict than standard_trips_only"

  - name: revenue_distribution
    trigger: "POST /pilotage/distribution-runs"
    algorithm: waterfall_allocation
    formula: |
      invoices := Invoice where status == FINALIZED
                  AND finalized_at >= period_start AND finalized_at < period_end   # half-open
      if invoices empty -> ERR_EMPTY_DISTRIBUTION_POOL
      gross_pool_cents := SUM(invoice.total_cents)
      # PINNED EVALUATION ORDER (anti-circular): the levy tier is keyed on
      # gross_pool_cents BEFORE any deduction; levy is computed; net = gross - levy.
      levy_pct := LEVY_HIGH_PCT if gross_pool_cents >= LEVY_TIER_THRESHOLD_CENTS else LEVY_LOW_PCT
      levy_cents := round_half_up(gross_pool_cents * levy_pct)
      net_pool_cents := gross_pool_cents - levy_cents
      eligible := distinct pilots of `invoices` (pilot_id via assignment)
      total_units := SUM(P.share_units) over eligible
      # PINNED ROUNDING ORDER: per-share round_half_up FIRST, then reconcile remainder.
      raw_p := net_pool_cents * P.share_units / total_units
      share_p := round_half_up(raw_p)
      remainder := net_pool_cents - SUM(share_p)
      # remainder > 0: add 1 cent per pass, pilots ordered by created_at ASC
      # remainder < 0: remove 1 cent per pass, pilots ordered by created_at DESC
      # invariant: gross_pool_cents == levy_cents + SUM(share_p) exactly
    input_set: "FINALIZED invoices with finalized_at in [period_start, period_end); their assignments' pilots"
    constants:
      LEVY_TIER_THRESHOLD_CENTS: 10000000
      LEVY_LOW_PCT: 0.08
      LEVY_HIGH_PCT: 0.10
    precision: "integer cents, round_half_up; remainder reconciliation pinned above"

  - name: tariff_schedule_resolution
    trigger: "VesselOrder creation/PATCH (pin) and TariffSchedule reads (status)"
    algorithm: chronological
    formula: |
      ACTIVE := schedule with the greatest effective_from <= now
                (tie-break on equal effective_from: created_at ASC)
      SCHEDULED := effective_from > now
      SUPERSEDED := all remaining rows
    input_set: "All TariffSchedule rows"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared §1.7 role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted on this endpoint per §1.5 roles; ownership checks: VesselAgent may PATCH/cancel only orders with agent_id == X-User-ID; Pilot may start/board/complete only assignments with pilot_id == X-User-ID; Pilot may report incidents only on own assignments", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path and body referenced ids exist (order, assignment, pilot, boat, invoice, incident, apprentice, run, endorsement), validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /pilotage/vessel-orders/{id}", "POST /pilotage/pilots/{id}/endorsements"] }
  - { priority: 5, category: state, check: "Generic state-machine from-state guards (e.g. complete from ASSIGNED, dismiss from REPORTED, settle from VOID)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "PATCH allowed only while order.status == BOOKED", error_id: ERR_ORDER_LOCKED, http_status: 409, applies_to: ["PATCH /pilotage/vessel-orders/{id}"] }
  - { priority: 7, category: state, check: "Dispatch allowed only while order.status == BOOKED", error_id: ERR_ORDER_NOT_DISPATCHABLE, http_status: 409, applies_to: ["POST /pilotage/vessel-orders/{id}/dispatch"] }
  - { priority: 8, category: business_safety, check: "Explicit reassign pilot holds a CURRENT endorsement with expires_at > now", error_id: ERR_LICENSE_NOT_CURRENT, http_status: 422, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 9, category: business_safety, check: "Explicit reassign pilot endorsement tonnage_cap_gt >= order.gt", error_id: ERR_TONNAGE_EXCEEDS_ENDORSEMENT, http_status: 422, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 10, category: business_safety, check: "Explicit reassign pilot rest_until is null or <= now", error_id: ERR_FATIGUE_REST_ACTIVE, http_status: 422, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 11, category: business_safety, check: "Explicit reassign pilot rolling duty + estimated minutes <= 4320 (equality passes)", error_id: ERR_FATIGUE_DUTY_LIMIT, http_status: 422, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 12, category: business_safety, check: "Invoice finalize blocked while any incident on the assignment is REPORTED or UNDER_REVIEW", error_id: ERR_INCIDENT_HOLD_ACTIVE, http_status: 422, applies_to: ["POST /pilotage/invoices/{id}/finalize"] }
  - { priority: 13, category: business_constraint, check: "Dispatch/reassign selector pools non-empty", error_id: ERR_NO_ELIGIBLE_PILOT, http_status: 422, applies_to: ["POST /pilotage/vessel-orders/{id}/dispatch", "POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 14, category: business_constraint, check: "Boat selector pool non-empty at dispatch", error_id: ERR_NO_ELIGIBLE_BOAT, http_status: 422, applies_to: ["POST /pilotage/vessel-orders/{id}/dispatch"] }
  - { priority: 15, category: business_constraint, check: "Apprentice advance ENROLLED->QUALIFIED requires apprentice_readiness true", error_id: ERR_READINESS_NOT_MET, http_status: 422, applies_to: ["POST /pilotage/apprentices/{id}/advance"] }
  - { priority: 16, category: business_constraint, check: "Apprentice advance QUALIFIED->CERTIFIED requires exam_result == PASS", error_id: ERR_EXAM_NOT_PASSED, http_status: 422, applies_to: ["POST /pilotage/apprentices/{id}/advance"] }
  - { priority: 17, category: business_referential, check: "Dispatch apprentice_id (when present) references an apprentice with status == ENROLLED", error_id: ERR_APPRENTICE_NOT_ENROLLED, http_status: 422, applies_to: ["POST /pilotage/vessel-orders/{id}/dispatch"] }
  - { priority: 18, category: business_temporal, check: "eta strictly after logical clock at order create/PATCH (eta == now fails)", error_id: ERR_ETA_IN_PAST, http_status: 422, applies_to: ["POST /pilotage/vessel-orders", "PATCH /pilotage/vessel-orders/{id}"] }
  - { priority: 19, category: business_temporal, check: "Explicit reassign pilot: closed-interval overlap with pilot's open assignments", error_id: ERR_PILOT_TIME_CONFLICT, http_status: 409, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 20, category: business_temporal, check: "Explicit reassign boat: half-open+buffer overlap with boat's open assignments", error_id: ERR_BOAT_TIME_CONFLICT, http_status: 409, applies_to: ["POST /pilotage/assignments/{id}/reassign"] }
  - { priority: 21, category: business_temporal, check: "Distribution window [period_start, period_end) must not overlap any existing run in {COMPUTED, SETTLED}; adjacency (period_start == existing period_end) allowed", error_id: ERR_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /pilotage/distribution-runs"] }
  - { priority: 22, category: business_fiscal, check: "Distribution pool non-empty (at least one FINALIZED invoice in window)", error_id: ERR_EMPTY_DISTRIBUTION_POOL, http_status: 422, applies_to: ["POST /pilotage/distribution-runs"] }
  - { priority: 23, category: business_constraint, check: "Required fields present, types valid, enums in range, integers positive where constrained", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Pilots / endorsements / rotation board ----
  - { method: POST, path: "/pilotage/pilots", description: "Register a pilot member; auto-creates RotationEntry at position max+1 (IN_ROTATION)", roles: [AssociationAdmin], code: 201, input: [full_name, license_number, share_units], output: Pilot, side_effects: ["RotationEntry created (position := max(position)+1, previous_position := null, status IN_ROTATION)"] }
  - { method: GET, path: "/pilotage/pilots/{id}", description: "Pilot detail incl. computed rest_until and duty_minutes_rolling_7d", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: Pilot, side_effects: [] }
  - { method: POST, path: "/pilotage/pilots/{id}/endorsements", description: "Issue endorsement; same-class CURRENT endorsement becomes SUPERSEDED; OCC on Pilot.version", roles: [AssociationAdmin], code: 201, input: [endorsement_class, tonnage_cap_gt, expires_at, expected_pilot_version], output: LicenseEndorsement, side_effects: ["same-class CURRENT endorsement -> SUPERSEDED", "increments Pilot.version by 1"] }
  - { method: GET, path: "/pilotage/pilots/{id}/endorsements", description: "List a pilot's endorsements (FK reverse reachability)", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['limit?', 'offset?'], output: "LicenseEndorsement[]", side_effects: [] }
  - { method: GET, path: "/pilotage/pilots/{id}/rotation-entries", description: "The pilot's rotation entry (array of 0-1; FK reverse reachability)", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['limit?', 'offset?'], output: "RotationEntry[]", side_effects: [] }
  - { method: GET, path: "/pilotage/rotation-entries", description: "Rotation board listing ordered by position ASC", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['status?', 'limit?', 'offset?'], output: "RotationEntry[]", side_effects: [] }

  # ---- Vessel orders ----
  - { method: POST, path: "/pilotage/vessel-orders", description: "Order intake; pins ACTIVE tariff schedule, computes provisional_fee_cents, captures agent_id from X-User-ID", roles: [VesselAgent], code: 201, input: [vessel_name, gt, draft_dm, order_type, eta], output: VesselOrder, side_effects: ["tariff_schedule_resolution pin", "tariff_base_fee(provisional_average)"] }
  - { method: GET, path: "/pilotage/vessel-orders", description: "List orders; tariff_schedule_id filter provides FK reverse reachability", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['status?', 'tariff_schedule_id?', 'limit?', 'offset?'], output: "VesselOrder[]", side_effects: [] }
  - { method: GET, path: "/pilotage/vessel-orders/{id}", description: "Order detail", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: VesselOrder, side_effects: [] }
  - { method: PATCH, path: "/pilotage/vessel-orders/{id}", description: "ETA update / draft-tonnage amendment while BOOKED; OCC on VesselOrder.version; recomputes provisional fee when gt/draft change", roles: [VesselAgent], code: 200, input: ['eta?', 'gt?', 'draft_dm?', expected_order_version], output: VesselOrder, side_effects: ["increments VesselOrder.version by 1", "tariff_base_fee(provisional_average) recompute when gt/draft supplied", "tariff_schedule_resolution re-pin"] }
  - { method: POST, path: "/pilotage/vessel-orders/{id}/cancel", description: "Agent cancels own BOOKED or DISPATCHED order; from DISPATCHED cascades to assignment cancel + rotation compensation + boat release", roles: [VesselAgent], code: 200, input: [], output: VesselOrder, side_effects: ["Assignment -> CANCELLED (when DISPATCHED)", "RotationEntry.position := previous_position (compensation)", "boat interval released"] }
  - { method: POST, path: "/pilotage/vessel-orders/{id}/dispatch", description: "Dispatcher dispatches order: rotation selector picks pilot (fatigue/license/rotation-gated), boat selector picks boat unless boat_id given", roles: [Dispatcher], code: 201, input: [scheduled_start, scheduled_end, 'boat_id?', 'apprentice_id?'], output: Assignment, side_effects: ["order BOOKED -> DISPATCHED", "Assignment created (ASSIGNED / UNBILLED)", "selected pilot RotationEntry demoted to bottom (previous_position recorded)"] }

  # ---- Assignments ----
  - { method: GET, path: "/pilotage/assignments", description: "List assignments; FK reverse reachability for order/pilot/boat/apprentice", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['order_id?', 'pilot_id?', 'boat_id?', 'apprentice_id?', 'service_status?', 'billing_status?', 'limit?', 'offset?'], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/pilotage/assignments/{id}", description: "Assignment detail", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/pilotage/assignments/{id}/start", description: "Pilot (own) launches: ASSIGNED -> EN_ROUTE; order -> IN_SERVICE; boat -> ON_RUN; actual_start := clock", roles: [Pilot], code: 200, input: [], output: Assignment, side_effects: ["VesselOrder DISPATCHED -> IN_SERVICE", "PilotBoat AVAILABLE -> ON_RUN", "actual_start := logical clock"] }
  - { method: POST, path: "/pilotage/assignments/{id}/board", description: "Pilot (own) boards vessel: EN_ROUTE -> ABOARD", roles: [Pilot], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/pilotage/assignments/{id}/complete", description: "Pilot (own) completes: ABOARD -> COMPLETED; mints ISSUED invoice (final marginal tariff + extras); fatigue rest; rotation demotion; apprentice trip credit", roles: [Pilot], code: 200, input: [detention_minutes, delay_minutes], output: Assignment, side_effects: ["actual_end := logical clock", "rest_requirement writes Pilot.rest_until", "invoice_final_composition creates Invoice(ISSUED)", "billing_status UNBILLED -> INVOICED", "VesselOrder IN_SERVICE -> COMPLETED", "PilotBoat ON_RUN -> AVAILABLE", "Apprentice.trips_completed += 1 when apprentice_id set"] }
  - { method: POST, path: "/pilotage/assignments/{id}/cancel", description: "Dispatcher cancels ASSIGNED/RECALLED assignment; rotation position restored; BOOKED revert when order still DISPATCHED", roles: [Dispatcher], code: 200, input: [], output: Assignment, side_effects: ["RotationEntry.position := previous_position; previous_position := null", "boat interval released", "order DISPATCHED -> BOOKED when directly cancelled"] }
  - { method: POST, path: "/pilotage/assignments/{id}/recall", description: "Dispatcher recalls ASSIGNED assignment (pilot pulled before launch): ASSIGNED -> RECALLED", roles: [Dispatcher], code: 200, input: [], output: Assignment, side_effects: ["recall_count += 1", "boat interval released"] }
  - { method: POST, path: "/pilotage/assignments/{id}/reassign", description: "Dispatcher reassigns RECALLED assignment; explicit pilot_id runs license/tonnage/rest/duty/closed-interval validation, absent pilot_id runs rotation selector; explicit boat_id runs buffer-overlap validation", roles: [Dispatcher], code: 200, input: ['pilot_id?', 'boat_id?', 'scheduled_start?', 'scheduled_end?'], output: Assignment, side_effects: ["RECALLED -> ASSIGNED", "new pilot RotationEntry demoted to bottom (previous_position recorded)"] }

  # ---- Pilot boats ----
  - { method: POST, path: "/pilotage/pilot-boats", description: "Register a pilot boat", roles: [AssociationAdmin], code: 201, input: [name, capacity_persons], output: PilotBoat, side_effects: [] }
  - { method: GET, path: "/pilotage/pilot-boats", description: "List boats; status filter on computed AVAILABLE/ON_RUN", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['status?', 'limit?', 'offset?'], output: "PilotBoat[]", side_effects: [] }

  # ---- Tariff schedules ----
  - { method: POST, path: "/pilotage/tariff-schedules", description: "Publish a tariff schedule (effective-dated); status computed by tariff_schedule_resolution", roles: [AssociationAdmin], code: 201, input: [effective_from, tiers, draft_surcharge_threshold_dm, draft_surcharge_pct, detention_free_minutes, detention_rate_cents_per_minute, delay_rate_cents_per_minute], output: TariffSchedule, side_effects: ["tariff_schedule_resolution recompute of statuses"] }
  - { method: GET, path: "/pilotage/tariff-schedules", description: "List schedules with computed status", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['status?', 'limit?', 'offset?'], output: "TariffSchedule[]", side_effects: [] }

  # ---- Invoices ----
  - { method: GET, path: "/pilotage/invoices", description: "List invoices; assignment_id filter provides FK reverse reachability", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['assignment_id?', 'status?', 'limit?', 'offset?'], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/pilotage/invoices/{id}", description: "Invoice detail", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/pilotage/invoices/{id}/finalize", description: "Finance officer finalizes ISSUED invoice; blocked while any incident on the assignment is REPORTED/UNDER_REVIEW; stamps finalized_at", roles: [FinanceOfficer], code: 200, input: [], output: Invoice, side_effects: ["finalized_at := logical clock"] }

  # ---- Incidents ----
  - { method: POST, path: "/pilotage/incidents", description: "Report an incident on an assignment (pilot on own assignment, or dispatcher); pilot_id derived from assignment", roles: [Pilot, Dispatcher], code: 201, input: [assignment_id, incident_type, description], output: Incident, side_effects: ["pilot_id := assignment.pilot_id"] }
  - { method: GET, path: "/pilotage/incidents", description: "List incidents; FK reverse reachability for assignment/pilot", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['assignment_id?', 'pilot_id?', 'status?', 'limit?', 'offset?'], output: "Incident[]", side_effects: [] }
  - { method: GET, path: "/pilotage/incidents/{id}", description: "Incident detail", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST, path: "/pilotage/incidents/{id}/open-review", description: "REPORTED -> UNDER_REVIEW", roles: [Investigator], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST, path: "/pilotage/incidents/{id}/dismiss", description: "UNDER_REVIEW -> DISMISSED (terminal; no cascade)", roles: [Investigator], code: 200, input: [], output: Incident, side_effects: [] }
  - { method: POST, path: "/pilotage/incidents/{id}/substantiate", description: "UNDER_REVIEW -> SUBSTANTIATED; cascade: pilot SUSPENDED -> rotation entry OFF_BOARD -> pilot's ASSIGNED assignments RECALLED", roles: [Investigator], code: 200, input: [], output: Incident, side_effects: ["Pilot -> SUSPENDED", "RotationEntry -> OFF_BOARD", "pilot's ASSIGNED assignments -> RECALLED (recall_count += 1, boat intervals released)"] }
  - { method: POST, path: "/pilotage/incidents/{id}/close", description: "SUBSTANTIATED -> CLOSED with mandatory corrective_note", roles: [Investigator], code: 200, input: [corrective_note], output: Incident, side_effects: ["corrective_note persisted"] }

  # ---- Apprentices ----
  - { method: POST, path: "/pilotage/apprentices", description: "Enroll an apprentice", roles: [AssociationAdmin], code: 201, input: [full_name, track], output: Apprentice, side_effects: [] }
  - { method: GET, path: "/pilotage/apprentices", description: "List apprentices", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: ['track?', 'status?', 'limit?', 'offset?'], output: "Apprentice[]", side_effects: [] }
  - { method: POST, path: "/pilotage/apprentices/{id}/record-progress", description: "Log training trips and an evaluation score; updates trips_completed, evaluations_count, evaluation_avg", roles: [AssociationAdmin], code: 200, input: [trips_delta, evaluation_score], output: Apprentice, side_effects: ["trips_completed += trips_delta", "evaluation_avg := round_half_up((evaluation_avg * evaluations_count + evaluation_score) / (evaluations_count + 1), 2dp); evaluations_count += 1"] }
  - { method: POST, path: "/pilotage/apprentices/{id}/advance", description: "ENROLLED -> QUALIFIED (readiness variant by track); QUALIFIED -> CERTIFIED (exam_result == PASS)", roles: [AssociationAdmin], code: 200, input: ['exam_result?'], output: Apprentice, side_effects: [] }

  # ---- Revenue distribution ----
  - { method: POST, path: "/pilotage/distribution-runs", description: "Compute a distribution run over FINALIZED invoices in [period_start, period_end); levy tier keyed on gross before deduction; per-share rounding with remainder reconciliation", roles: [FinanceOfficer], code: 201, input: [period_start, period_end], output: DistributionRun, side_effects: ["revenue_distribution computes pool/levy/shares; invoice_ids snapshot"] }
  - { method: GET, path: "/pilotage/distribution-runs/{id}", description: "Run detail incl. shares array", roles: [AssociationAdmin, Dispatcher, Pilot, VesselAgent, FinanceOfficer, Investigator], code: 200, input: [], output: DistributionRun, side_effects: [] }
  - { method: POST, path: "/pilotage/distribution-runs/{id}/settle", description: "COMPUTED -> SETTLED; swept invoices FINALIZED -> DISTRIBUTED; assignments billing INVOICED -> SETTLED", roles: [FinanceOfficer], code: 200, input: [], output: DistributionRun, side_effects: ["Invoice FINALIZED -> DISTRIBUTED", "Assignment billing_status INVOICED -> SETTLED"] }
  - { method: POST, path: "/pilotage/distribution-runs/{id}/void", description: "COMPUTED -> VOID; compensation: no invoice mutation, invoices remain FINALIZED", roles: [FinanceOfficer], code: 200, input: [], output: DistributionRun, side_effects: [] }

  # ---- Logical clock (test-driving endpoint) ----
  - { method: POST, path: "/pilotage/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any set): 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time", roles: [AssociationAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced; TariffSchedule statuses re-resolve"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or ownership mismatch (agent vs order.agent_id; pilot vs assignment.pilot_id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, non-positive quantity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version differs from current parent version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine transition not allowed from the entity's current state" }
  - { id: ERR_ORDER_LOCKED, http: 409, condition: "PATCH attempted while order status is not BOOKED" }
  - { id: ERR_ORDER_NOT_DISPATCHABLE, http: 409, condition: "Dispatch attempted while order status is not BOOKED" }
  - { id: ERR_NO_ELIGIBLE_PILOT, http: 422, condition: "Rotation selector pool empty after license/fatigue/rest/interval filters" }
  - { id: ERR_NO_ELIGIBLE_BOAT, http: 422, condition: "Boat selector pool empty after interval+buffer filter" }
  - { id: ERR_LICENSE_NOT_CURRENT, http: 422, condition: "Explicit reassign pilot lacks a CURRENT endorsement with expires_at > now" }
  - { id: ERR_TONNAGE_EXCEEDS_ENDORSEMENT, http: 422, condition: "Explicit reassign pilot's endorsement cap below order gt" }
  - { id: ERR_FATIGUE_REST_ACTIVE, http: 422, condition: "Explicit reassign pilot rest_until > now" }
  - { id: ERR_FATIGUE_DUTY_LIMIT, http: 422, condition: "Explicit reassign pilot rolling duty + estimated minutes > 4320 (equality passes)" }
  - { id: ERR_PILOT_TIME_CONFLICT, http: 409, condition: "Explicit reassign pilot has a closed-interval overlap with an open assignment" }
  - { id: ERR_BOAT_TIME_CONFLICT, http: 409, condition: "Explicit reassign boat has a half-open+buffer interval overlap" }
  - { id: ERR_ETA_IN_PAST, http: 422, condition: "eta not strictly after the logical clock at intake/amendment" }
  - { id: ERR_INCIDENT_HOLD_ACTIVE, http: 422, condition: "Invoice finalize blocked by REPORTED/UNDER_REVIEW incident on the assignment" }
  - { id: ERR_READINESS_NOT_MET, http: 422, condition: "Apprentice readiness variant false for the apprentice's track" }
  - { id: ERR_EXAM_NOT_PASSED, http: 422, condition: "QUALIFIED->CERTIFIED advance without exam_result == PASS" }
  - { id: ERR_APPRENTICE_NOT_ENROLLED, http: 422, condition: "Dispatch apprentice_id references an apprentice whose status is not ENROLLED" }
  - { id: ERR_EMPTY_DISTRIBUTION_POOL, http: 422, condition: "No FINALIZED invoices with finalized_at in the requested window" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Distribution window overlaps an existing COMPUTED/SETTLED run window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationAdmin
    description: "Association office administrator; manages members, boats, tariffs, apprentices, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /pilotage/pilots", "POST /pilotage/pilots/{id}/endorsements", "POST /pilotage/pilot-boats", "POST /pilotage/tariff-schedules", "POST /pilotage/apprentices", "POST /pilotage/apprentices/{id}/record-progress", "POST /pilotage/apprentices/{id}/advance", "POST /pilotage/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: Dispatcher
    description: "Dispatch operator; runs the board: dispatch, cancel/recall/reassign assignments, reports incidents"
    identity: opaque
    exclusive_operations: ["POST /pilotage/vessel-orders/{id}/dispatch", "POST /pilotage/assignments/{id}/cancel", "POST /pilotage/assignments/{id}/recall", "POST /pilotage/assignments/{id}/reassign"]
    shared_operations: ["POST /pilotage/incidents", "all GET endpoints"]
  - name: Pilot
    description: "Licensed pilot member; executes own assignments and reports incidents on them"
    identity: "entity_backed:Pilot"
    exclusive_operations: ["POST /pilotage/assignments/{id}/start", "POST /pilotage/assignments/{id}/board", "POST /pilotage/assignments/{id}/complete"]
    shared_operations: ["POST /pilotage/incidents", "all GET endpoints"]
  - name: VesselAgent
    description: "Vessel agent (opaque operator id); places and manages own vessel orders"
    identity: opaque
    exclusive_operations: ["POST /pilotage/vessel-orders", "PATCH /pilotage/vessel-orders/{id}", "POST /pilotage/vessel-orders/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "Association finance officer; finalizes invoices and runs revenue distribution"
    identity: opaque
    exclusive_operations: ["POST /pilotage/invoices/{id}/finalize", "POST /pilotage/distribution-runs", "POST /pilotage/distribution-runs/{id}/settle", "POST /pilotage/distribution-runs/{id}/void"]
    shared_operations: ["all GET endpoints"]
  - name: Investigator
    description: "Casualty investigator; reviews incidents and substantiates/dismisses/closes them"
    identity: opaque
    exclusive_operations: ["POST /pilotage/incidents/{id}/open-review", "POST /pilotage/incidents/{id}/dismiss", "POST /pilotage/incidents/{id}/substantiate", "POST /pilotage/incidents/{id}/close"]
    shared_operations: ["all GET endpoints"]
