      - name: committee_decide_cascades_case_and_student
        grounds:
          - state_machines.CommitteeReview.VOTING_to_DECIDED
          - state_machines.GiftedCase.AWAITING_COMMITTEE_to_IDENTIFIED
          - entities.Student.fields.gifted_status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (a committee vote, not a re-evaluation
          conclude): the second QUALIFY vote mutates the review (VOTING -> DECIDED); that
          mutation flips the case (AWAITING_COMMITTEE -> IDENTIFIED); that flip itself sets
          Student.gifted_status := IDENTIFIED. Vote -> review -> case -> student.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student; cycle P_BAND published, in REVIEW"
            - "case scored 99/90/88 -> composite 94 -> AWAITING_COMMITTEE; BAND_REVIEW opened (VOTING)"
          setup_api_calls:
