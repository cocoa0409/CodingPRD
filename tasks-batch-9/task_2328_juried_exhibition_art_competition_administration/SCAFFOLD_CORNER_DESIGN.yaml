            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_id: $.data.id } }
            - { call: "POST /artworks/${aw_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "ef01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}" }
          trigger:
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}", captures: { e_entry: $.data.error_id } }
            - { call: "POST /artworks/${aw_id}/install", payload: {}, as: Registrar, captures: { e_artwork: $.data.error_id } }
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 3713 }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "JURYING" }, as: CallManager }
            - { call: "POST /jurors", payload: { display_name: "Iris Vega", email: "iris@example.org", expertise_categories: ["PAINTING"], honorarium_cents: 50000 }, as: JuryChair, captures: { j1_id: $.data.id } }
            - { call: "POST /jurors/${j1_id}/confirm", payload: {}, as: Juror, as_user_id: "${j1_id}" }
            - { call: "POST /jury-rounds", payload: { exhibition_id: "${ex_id}", round_number: 1, round_type: "BLIND_SCORING", opens_at: "2026-10-05T00:00:00Z", closes_at: "2026-10-12T00:00:00Z", quorum_required: 1 }, as: JuryChair, captures: { r1_id: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j1_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v1}" }, as: JuryChair, captures: { asg_id: $.data.id } }
            - { call: "POST /jury-rounds/${r1_id}/status", payload: { target_status: "OPEN" }, as: JuryChair }
            - { call: "POST /jury-rounds/${r1_id}/status", payload: { target_status: "OPEN" }, as: JuryChair, captures: { e_round: $.data.error_id } }
            - { call: "POST /juror-assignments/${asg_id}/cancel", payload: {}, as: JuryChair }
            - { call: "POST /juror-assignments/${asg_id}/cancel", payload: {}, as: JuryChair, captures: { e_asg: $.data.error_id } }
          assert:
            - "the second POST /entries/${e1_id}/submit returns 409 ERR_ENTRY_STATE_INVALID (entry is PENDING_FEE, not DRAFT)"
            - "POST /artworks/${aw_id}/install returns 409 ERR_ARTWORK_STATE_INVALID (placement_status is UNPLACED, not PLANNED)"
            - "the second OPEN request returns 409 ERR_JURY_ROUND_STATE_INVALID and the round stays OPEN with reopen_count == 0"
            - "the second cancel returns 409 ERR_ASSIGNMENT_STATE_INVALID and JurorAssignment.${asg_id}.status stays CANCELLED"
            - "no version field advances on any of the four rejected calls"

      - name: call_window_boundary_errors_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CALL_WINDOW_NOT_CLOSED]
          - errors[ERR_CALL_WINDOW_CLOSED]
          - state_machines.Exhibition[axis=status].OPEN_FOR_ENTRIES_to_JURYING
        distinguishing_aspect: "The same instant call_closes_at is the boundary for two opposite codes: before it JURYING is refused, and at it (inclusive) submission is refused — so an implementation using a strict comparison on the wrong side leaves a one-instant hole where both are allowed."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES with call_closes_at 2026-10-01T00:00:00Z; one DRAFT entry with an imaged work; clock at 2026-09-20T00:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_id: $.data.id } }
            - { call: "POST /artworks/${aw_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "f001" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: CallManager }
          trigger:
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "JURYING" }, as: CallManager, captures: { e_early: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: CallManager }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}", captures: { e_late: $.data.error_id } }
          assert:
            - "the JURYING request at 2026-09-20 returns 409 ERR_CALL_WINDOW_NOT_CLOSED and Exhibition.status stays OPEN_FOR_ENTRIES"
            - "the submit exactly at 2026-10-01T00:00:00Z returns 409 ERR_CALL_WINDOW_CLOSED — the boundary instant is closed, not open"
            - "Entry.${e1_id}.status stays DRAFT with submitted_at == null and entry_fee_cents unfrozen"
            - "a JURYING advance repeated at 2026-10-01T00:00:00Z now succeeds, proving the same instant satisfies now >= call_closes_at"

      - name: artwork_attachment_constraint_errors_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MEDIA_CATEGORY_NOT_ALLOWED]
          - errors[ERR_SIZE_LIMIT_EXCEEDED]
          - errors[ERR_MAX_WORKS_EXCEEDED]
          - errors[ERR_ENTRY_LIMIT_EXCEEDED]
          - errors[ERR_IMAGE_METADATA_INCOMPLETE]
          - errors[ERR_ELIGIBILITY_NOT_MET]
        distinguishing_aspect: "Call-for-entries limits are per-exhibition configuration, not global constants: SCULPTURE is a valid enum member yet not allowed here, 210 cm is legal elsewhere but over this max_dimension_cm, and the residency check fires at submit rather than at artist creation."
