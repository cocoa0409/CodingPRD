  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_assignment_half_open_back_to_back
        grounds:
          - validations[priority=10]
          - errors[ERR_ASSIGNMENT_OVERLAP]
          - entities.CrewAssignment.fields.start_at
        distinguishing_aspect: |
          Resource Worker with half-open interval semantics [start_at, end_at):
          back-to-back assignments (new.start_at == existing.end_at) are
          ALLOWED, while any strict interior overlap is rejected — contrast
          with the relocation-unit instance, where adjacency is forbidden by a
          cleaning buffer.
        test_recipe:
          setup:
            - "Project P ASSESSED; Worker W HANDLER (expiries 2027); existing SCHEDULED assignment A1 [2026-08-11, 2026-08-20)"
          setup_api_calls:
            - { call: "POST /abatement/projects", payload: { name: "P-OV1", site_address: "16 Ash St", work_type: "RENOVATION", hazard_class: "ASBESTOS", planned_start: "2026-08-11T00:00:00Z", base_abatement_cost_cents: 1000000 }, as: ContractorAdmin, captures: { p_id: "$.data.id" } }
