            - call: "POST /warranty/policies"
              payload: { builder_id: "${b1}", initial_owner_id: "${h1}", street_address: "118 Cedar Ridge Ct", state_code: "TX", purchase_price_cents: 44500000, closing_date: "2026-08-15" }
              as: BuilderPrincipal
              as_user_id: "${b1}"
              captures: { p1: $.data.id }
            - call: "POST /warranty/policies/${p1}/premium-invoice"
              payload: {}
              as: UnderwritingOfficer
