            - { call: "POST /spd/trays/${tm}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${tm}/decontamination/complete", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/trays/${tm}/assembly/start", as: SpdTechnician, as_user_id: "${ta}" }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-A1", max_cycles: 50, usage_cycles: 0, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { ia: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-A2", max_cycles: 5, usage_cycles: 5, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { ib: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-A3", max_cycles: 50, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { ic: "$.data.id" } }
            - { call: "POST /spd/instruments/${ic}/flag-for-repair", as: SpdTechnician, as_user_id: "${ta}" }
          trigger:
            - { call: "POST /spd/instruments/${ia}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { a1: "$.data.assigned_tray_id" } }
            - { call: "POST /spd/instruments/${ia}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { e1: "$.data.error_id" } }
            - { call: "POST /spd/instruments/${ib}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { e2: "$.data.error_id" } }
            - { call: "POST /spd/instruments/${ic}/assign", payload: { tray_id: "${tm}" }, as: SpdTechnician, as_user_id: "${ta}", captures: { e3: "$.data.error_id" } }
            - { call: "POST /spd/instruments/${ic}/flag-for-repair", as: SpdTechnician, as_user_id: "${ta}", captures: { e4: "$.data.error_id" } }
          assert:
            - "First assign: a1 == ${tm}"
            - "e1 == ERR_INSTRUMENT_ALREADY_ASSIGNED (assign twice)"
            - "e2 == ERR_INSTRUMENT_CYCLE_LIMIT (usage_cycles 5 == max_cycles 5; equality blocks)"
