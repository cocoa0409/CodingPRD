              payload: { call_sign: "KCRW", licensee_name: "Santa Monica Licensee", state_code: "CA", dma_market_rank: 2, dma_households: 5200000, coverage_population: 10000000, full_time_staff_count: 20, newsroom_staff_count: 10, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_WEST" }
              as: PlatformAdmin
              captures: { st_q_id: $.data.id, st_q_ver: $.data.version }
