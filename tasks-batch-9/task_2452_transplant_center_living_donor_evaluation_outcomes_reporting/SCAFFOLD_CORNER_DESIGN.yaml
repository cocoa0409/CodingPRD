    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers.dual_variant_calculation
    - calculations.cold_ischemia_time
    - errors[ERR_CIT_LIMIT_EXCEEDED]
    - validations[priority=22]
    distinguishing_aspect: One 1036-minute clamp-to-reperfusion span fails the planned variant (1036 +
      45 = 1081 > 1080) and passes the actual variant (1036, no hold added) - the same numbers, opposite
      verdicts, decided only by which variant is selected.
    test_recipe:
