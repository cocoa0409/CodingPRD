              as: TrialCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /variety-trials/${t_id}/plant"
              payload: {}
              as: TrialCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_TRIAL_DATE_NOT_REACHED"
            - "VarietyTrial.${t_id}.status == PLANNED and version == 1"
            - "Variety.${v_id}.lifecycle_state == CANDIDATE and TrialSite.${s_id}.occupied_plot_count == 0"
            - "After POST /_clock/set_current_utc with 2026-08-05T00:00:00Z the same plant call succeeds (inclusive at exactly plant_date), giving status PLANTED, Variety.lifecycle_state IN_TRIAL and TrialSite.occupied_plot_count == 10"

      - name: brand_register_applies_every_declared_side_effect
