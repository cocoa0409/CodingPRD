  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispense_session_parallel_fill_and_billing_axes_advance_independently
        grounds:
          - state_machines.DispenseSession
          - entities.DispenseSession.fields.fill_status
          - entities.DispenseSession.fields.billing_status
          - entities.DispenseSession.fields.abort_reason
          - entities.DispenseSession.fields.void_reason
          - endpoints.POST_/dispense-sessions/{id}/void-meter
        distinguishing_aspect: |
          Non-linearity is PARALLEL DIMENSIONS on the DispenseSession entity: fill_status walks
          PRECOOLING -> FUELING -> COMPLETED on the physical axis while billing_status walks
          PENDING -> METERED -> VOIDED on the settlement axis. The two settlement transitions leave
          fill_status pinned at COMPLETED, and VOIDED billing never sets abort_reason, proving the
          axes are independent rather than a single flattened status column.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Station STN-E, nozzle_count 4, offload_bay_count 1, storage_capacity_kg 900.000, reserve_floor_kg 100.000, max_pressure_class H70."
            - "Vessels HIGH 600 L at 950.00 bar, MEDIUM 1000 L at 700.00 bar, LOW 5000 L at 300.00 bar; onsite_inventory_kg 221.600, high_bank_deliverable_kg 36.000, safety_posture OPEN."
            - "Two current EMERGENCY_RESPONSE responder certifications."
            - "One H35 session planned 80.000 kg at ambient_temp_c 0.0, fuelled at -20.0 C and completed with metered_kg 79.850 at avg_dispense_pressure_bar 700.00, giving corrected_kg 80.489."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E-1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E", name: "Parallel Axis E", nozzle_count: 4, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "MEDIUM", water_volume_l: 1000.0, mawp_bar: 1000.00, min_residual_bar: 150.00, initial_pressure_bar: 700.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_med: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-E-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 80.000, ambient_temp_c: 0.0, expected_station_version: "${st_v}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { sess_id: "$.data.id", fs_created: "$.data.fill_status", bs_created: "$.data.billing_status" }
            - call: "POST /dispense-sessions/${sess_id}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { fs_fuelling: "$.data.fill_status", bs_fuelling: "$.data.billing_status" }
            - call: "POST /dispense-sessions/${sess_id}/complete"
              payload: { metered_kg: 79.850, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { fs_completed: "$.data.fill_status", bs_completed: "$.data.billing_status" }
          trigger:
            - call: "POST /dispense-sessions/${sess_id}/meter-settlement"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { fs_metered: "$.data.fill_status", bs_metered: "$.data.billing_status" }
            - call: "POST /dispense-sessions/${sess_id}/void-meter"
              payload: { void_reason: "BILLING_DISPUTE" }
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { fs_voided: "$.data.fill_status", bs_voided: "$.data.billing_status" }
          assert:
            - "${fs_created} == PRECOOLING and ${bs_created} == PENDING"
            - "${fs_fuelling} == FUELING and ${bs_fuelling} == PENDING"
            - "${fs_completed} == COMPLETED and ${bs_completed} == PENDING"
            - "${fs_metered} == COMPLETED and ${bs_metered} == METERED"
            - "${fs_voided} == COMPLETED and ${bs_voided} == VOIDED"
            - "DispenseSession.${sess_id}.abort_reason is null (the billing axis never touches the fill axis)"
            - "DispenseSession.${sess_id}.void_reason == BILLING_DISPUTE"
            - "DispenseSession.${sess_id}.corrected_kg == 80.489"
            - "Station.${st_id}.onsite_inventory_kg == 141.750"
            - "Station.${st_id}.corrected_kg_mtd == 0.000 (the VOIDED row leaves the rollup input set)"

      - name: incentive_claim_revision_cycle_auto_denies_on_third_request
        grounds:
          - state_machines.IncentiveClaim
          - entities.IncentiveClaim.fields.revision_round
          - entities.IncentiveClaim.fields.revision_note
          - calculations.operational_thresholds.MAX_REVISION_ROUNDS
          - endpoints.POST_/incentive-claims/{id}/request-revision
          - endpoints.POST_/incentive-claims/{id}/resubmit
        distinguishing_aspect: |
          Non-linearity is a CYCLE on a different entity: IncentiveClaim loops
          SUBMITTED -> REVISION_REQUESTED -> SUBMITTED and the loop is bounded by an outcome change,
          not by an error. The third request-revision leaves the cycle for the DENIED terminal state
          with revision_round 3, so the same trigger produces two different target states depending
          only on the accumulated loop count.
