            - "Position B survives: status OPEN (equity 10000.00 >= maintenance of B 4400.00 after A closed)"
            - "MarginAccount.status == FUNDED AND cash_balance == 14000.00"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: marketing_plan_suspend_resume_cycle
        grounds:
          - state_machines.MarketingPlan.ACTIVE_to_SUSPENDED
          - state_machines.MarketingPlan.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Entity = MarketingPlan, shape = cycle (ACTIVE -> SUSPENDED -> ACTIVE),
          unlike the sibling instance's independent-dimensions shape on
          SalesContract. The loop is traversable twice and gates contract creation
          differently in each phase.
        test_recipe:
          setup:
            - "ACTIVE plan (expected 20000, AGGRESSIVE cap 20000), APPROVED buyer"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Cycle Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Ethanol Plant", buyer_type: ETHANOL, credit_rating: B }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/marketing-plans/${plan_id}/suspend", as: CommodityAdvisor, captures: { st1: $.data.status } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/resume", as: CommodityAdvisor, captures: { st2: $.data.status } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/suspend", as: ComplianceOfficer, captures: { st3: $.data.status } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/resume", as: CommodityAdvisor, captures: { st4: $.data.status } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_ok: $.data.id } }
          assert:
            - "Cycle traversed twice: statuses ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> ACTIVE"
            - "Contract create during SUSPENDED rejected with ERR_INVALID_STATE"
            - "Identical contract create after second resume succeeds (201) — cycle does not degrade the plan"
      - name: sales_contract_independent_pricing_fulfillment_dimensions
        grounds:
          - state_machines.SalesContract.UNPRICED_to_PRICED
          - state_machines.SalesContract.OPEN_to_PARTIALLY_DELIVERED
        distinguishing_aspect: |
          Entity = SalesContract, shape = two independent state dimensions
          (pricing_status x fulfillment_status) on one row — structurally distinct
          from the sibling's MarketingPlan cycle. Pricing can advance while
          fulfillment stays OPEN, then fulfillment advances while pricing stays put.
        test_recipe:
          setup:
            - "ACTIVE plan (AGGRESSIVE, expected 20000), APPROVED buyer, HTA contract 8000 bu (UNPRICED, OPEN), window [2026-10-01, 2026-11-01)"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Dims Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Elevator 9", buyer_type: ELEVATOR, credit_rating: C }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: HTA, bushels: 8000, contract_month: "2026-12", delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_id: $.data.id, ps0: $.data.pricing_status, fs0: $.data.fulfillment_status } }
          trigger:
            - { call: "POST /advisory/sales-contracts/${c_id}/fix-price", payload: { fixation_price: 4.65 }, as: CommodityAdvisor, captures: { ps1: $.data.pricing_status, fs1: $.data.fulfillment_status, ep1: $.data.effective_price } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c_id}", delivery_date: "2026-10-15", gross_bushels: 3000, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { t_id: $.data.id } }
            - { call: "POST /advisory/delivery-tickets/${t_id}/confirm", as: CommodityAdvisor }
            - { call: "GET /advisory/sales-contracts/${c_id}", as: CommodityAdvisor, captures: { ps2: $.data.pricing_status, fs2: $.data.fulfillment_status, del2: $.data.delivered_bushels } }
          assert:
            - "At creation: pricing_status == UNPRICED, fulfillment_status == OPEN (HTA starts UNPRICED)"
            - "After fix-price: pricing_status == PRICED with effective_price == 4.65 while fulfillment_status still == OPEN — pricing dimension moved alone"
            - "After partial confirm: fulfillment_status == PARTIALLY_DELIVERED with delivered_bushels == 3000 while pricing_status still == PRICED — fulfillment dimension moved alone"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: market_tick_cascade_target_recommendation_plan
        grounds:
          - state_machines.PriceTarget.PENDING_to_TRIGGERED
          - state_machines.PriceTarget.PENDING_to_TRIGGERED.side_effects
          - calculations.hedge_coverage_cap
        distinguishing_aspect: |
          Trigger = POST /advisory/market-ticks. Depth 3 chain: tick -> PriceTarget
          PENDING->TRIGGERED (hop 1) -> the target's TRIGGERED mutation mints a
          PROPOSED HedgeRecommendation sized by coverage headroom (hop 2) -> each
          minted recommendation increments MarketingPlan.pending_recommendation_count
          (hop 3). Ordering (target_price ASC, created_at ASC) decides which targets
          consume the 20000-bu headroom: T1 and T3 fire, T2 lapses on zero headroom.
        test_recipe:
          setup:
            - "BALANCED operation expected 200000, ACTIVE plan max_priced_pct 0.10 (cap 20000); targets: T1 4.50/10000 (created first), T3 4.50/10000 (created second), T2 4.60/10000 — all contract_month 2026-12"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Cascade Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.10 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.50, increment_bushels: 10000 }, as: CommodityAdvisor, captures: { t1: $.data.id } }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.50, increment_bushels: 10000 }, as: CommodityAdvisor, captures: { t3: $.data.id } }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.60, increment_bushels: 10000 }, as: CommodityAdvisor, captures: { t2: $.data.id } }
          trigger:
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.60, kind: SETTLEMENT, price_date: "2026-07-01" }, as: PlatformAdmin }
            - { call: "GET /advisory/price-targets/${t1}", as: CommodityAdvisor, captures: { t1_st: $.data.status, t1_rec: $.data.recommendation_id } }
            - { call: "GET /advisory/price-targets/${t3}", as: CommodityAdvisor, captures: { t3_st: $.data.status, t3_rec: $.data.recommendation_id } }
            - { call: "GET /advisory/price-targets/${t2}", as: CommodityAdvisor, captures: { t2_st: $.data.status } }
            - { call: "GET /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", status: PROPOSED }, as: CommodityAdvisor, captures: { recs: $.data } }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { pend: $.data.pending_recommendation_count, hedged: $.data.hedged_bushels } }
          assert:
            - "T1 TRIGGERED with recommendation_id set (4.50 <= 4.60, earliest created_at at its price)"
            - "T3 TRIGGERED with recommendation_id set (same price as T1, later created_at, headroom 10000 remained)"
            - "T2 LAPSED with no recommendation (headroom exhausted: 20000 cap - 20000 minted = 0)"
            - "Exactly 2 PROPOSED HedgeRecommendations exist for the plan, each bushels == 10000"
            - "Plan.pending_recommendation_count == 2 (hop 3 landed on the plan)"
      - name: delivery_confirm_cascade_to_plan_auto_close
        grounds:
          - state_machines.DeliveryTicket.RECORDED_to_CONFIRMED
          - state_machines.SalesContract.OPEN_to_DELIVERED
          - state_machines.MarketingPlan.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Trigger = POST /advisory/delivery-tickets/{id}/confirm (different trigger
          from the sibling's market tick). Depth 3 chain: confirm -> contract
          delivered_bushels/fulfillment DELIVERED (hop 1) -> the DELIVERED transition
          recomputes MarketingPlan committed/uncommitted (hop 2) -> the recompute
          finding uncommitted == 0 with all contracts DELIVERED auto-closes the plan
          and cancels its PENDING targets (hop 3).
        test_recipe:
          setup:
            - "AGGRESSIVE operation expected 20000, ACTIVE plan max 1.00, one PENDING price target, APPROVED buyer, FLAT contracts C1 12000 @4.50 and C2 8000 @4.60 (total == expected)"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Close Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/price-targets", payload: { plan_id: "${plan_id}", contract_month: "2026-12", target_price: 4.90, increment_bushels: 5000 }, as: CommodityAdvisor, captures: { tgt: $.data.id } }
            - { call: "POST /advisory/buyers", payload: { name: "Buyer X", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 12000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 8000, fixed_price: 4.60, delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c1}", delivery_date: "2026-10-05", gross_bushels: 12000, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { tk1: $.data.id } }
            - { call: "POST /advisory/delivery-tickets/${tk1}/confirm", as: CommodityAdvisor }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { st_mid: $.data.status } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c2}", delivery_date: "2026-11-05", gross_bushels: 8000, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { tk2: $.data.id } }
          trigger:
            - { call: "POST /advisory/delivery-tickets/${tk2}/confirm", as: CommodityAdvisor }
            - { call: "GET /advisory/sales-contracts/${c2}", as: CommodityAdvisor, captures: { c2_fs: $.data.fulfillment_status } }
            - { call: "GET /advisory/marketing-plans/${plan_id}", as: CommodityAdvisor, captures: { st_end: $.data.status, uncom: $.data.uncommitted_bushels } }
            - { call: "GET /advisory/price-targets/${tgt}", as: CommodityAdvisor, captures: { tgt_st: $.data.status } }
          assert:
            - "After first confirm: plan still ACTIVE (C2 not delivered) — cascade does not over-fire"
            - "After second confirm: C2.fulfillment_status == DELIVERED (hop 1)"
            - "Plan.status == CLOSED (hop 3: auto-close once uncommitted == 0 and all contracts DELIVERED)"
            - "PriceTarget.status == CANCELLED (hop 3 side effect on plan close)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_proposed_rec_state_error_beats_margin_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.HedgeRecommendation.ACCEPTED_to_EXECUTED
        distinguishing_aspect: |
          Error-category pair = state (priority 6) vs business_fiscal (priority 11).
          Executing a PROPOSED (never accepted) recommendation against a margin
          account too small to fund the position violates both; the state error
          ERR_INVALID_STATE wins over ERR_INSUFFICIENT_MARGIN_EQUITY.
        test_recipe:
          setup:
            - "BALANCED operation expected 200000, ACTIVE plan, margin account funded only 100.00, recommendation 50000 bu still PROPOSED"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Prio Farm 1", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/margin-accounts", payload: { operation_id: "${op_id}", initial_funding: 100 }, as: CommodityAdvisor }
            - { call: "POST /advisory/market-ticks", payload: { commodity: CORN, contract_month: "2026-12", price: 4.50, kind: SETTLEMENT, price_date: "2026-06-01" }, as: PlatformAdmin }
            - { call: "POST /advisory/hedge-recommendations", payload: { plan_id: "${plan_id}", instrument: FUTURES_SHORT, contract_month: "2026-12", bushels: 50000 }, as: CommodityAdvisor, captures: { rec_id: $.data.id } }
          trigger:
            - { call: "POST /advisory/hedge-recommendations/${rec_id}/execute", as: CommodityAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "Execute rejected with ERR_INVALID_STATE (state, priority 6) — not ERR_INSUFFICIENT_MARGIN_EQUITY (fiscal, priority 11), though both hold"
            - "Recommendation remains PROPOSED; no BrokeragePosition minted"
      - name: contract_create_disclosure_stale_beats_buyer_suspended
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.AdvisoryAgreement.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 7) vs business_referential
          (priority 8) — different pair from the sibling's state-vs-fiscal. Creating
          a contract after an agreement amendment stale the acknowledgment while the
          buyer is SUSPENDED returns ERR_DISCLOSURE_STALE, not
          ERR_BUYER_NOT_APPROVED.
        test_recipe:
          setup:
            - "ACTIVE plan whose governing agreement was amended after acknowledgment (disclosure_status STALE); buyer APPROVED then SUSPENDED"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Prio Farm 2", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: PER_BUSHEL, rate_per_bushel: 0.02 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Suspended Buyer", buyer_type: ELEVATOR, credit_rating: C }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "PUT /advisory/advisory-agreements/${ag_id}", payload: { rate_per_bushel: 0.03 }, as: CommodityAdvisor }
            - { call: "POST /advisory/buyers/${buyer_id}/suspend", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "GET /advisory/advisory-agreements/${ag_id}", as: CommodityAdvisor, captures: { disc_st: $.data.disclosure_status } }
          assert:
            - "Rejected with ERR_DISCLOSURE_STALE (business_safety, priority 7) — not ERR_BUYER_NOT_APPROVED (business_referential, priority 8), though both hold"
            - "Captured disclosure_status == STALE after the amendment"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: over_delivery_tolerance_equality_vs_excess
        grounds:
          - calculations.contract_settlement_value
          - state_machines.DeliveryTicket.RECORDED_to_CONFIRMED
        distinguishing_aspect: |
          Metric = delivered bushels vs the 2 percent over-delivery tolerance, via
          POST /advisory/delivery-tickets/{id}/confirm. Delivered == floor(bushels *
          1.02) == 10200 confirms cleanly (tolerance is inclusive); 10201 — one
          bushel over — is rejected with ERR_OVER_DELIVERY_EXCEEDED.
        test_recipe:
          setup:
            - "AGGRESSIVE operation expected 20000, ACTIVE plan max 1.00, APPROVED buyer, two FLAT contracts of 10000 bu @4.50 in disjoint windows (Oct and Nov)"
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Tol Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: AGGRESSIVE, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 100, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "Tol Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 10000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 10000, fixed_price: 4.50, delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c1}", delivery_date: "2026-10-10", gross_bushels: 10200, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { tk_ok: $.data.id, net_ok: $.data.net_bushels } }
            - { call: "POST /advisory/delivery-tickets", payload: { contract_id: "${c2}", delivery_date: "2026-11-10", gross_bushels: 10201, moisture_pct: 15.0 }, as: Grower, as_user_id: "${op_id}", captures: { tk_over: $.data.id } }
          trigger:
