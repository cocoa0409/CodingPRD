            - "after second trigger: WarrantyClaim.${wc_ok}.accrued_charge_cents == 0"
            - "after second trigger: WarrantyClaim.${wc_ok}.reopen_count == 0"
            - "after fourth trigger: http status == 409"
            - "after fourth trigger: ${err_warranty} == \"ERR_WARRANTY_PERIOD_EXPIRED\""
            - "after fifth trigger: http status == 201"
            - "after fifth trigger: WarrantyClaim.${wc_struct}.warranty_expires_at == \"2031-07-06T00:00:00Z\""
            - "after fifth trigger: WarrantyClaim.${wc_struct}.status == SUBMITTED"
            - "after fifth trigger: GET /conversion-projects/${proj_id}/warranty-claims returns total_count == 2"
      - name: identity_mismatch_on_a_rofr_response_filed_for_another_household
        claim_type: error_triggerable
        grounds:
          - validations[priority 3]
          - errors[ERR_IDENTITY_MISMATCH]
          - endpoints[POST /tenant-households/{id}/rofr-responses]
        excluded_because:
          difficulty_instance: rofr_window_expired_beats_rofr_unit_not_linked
          rationale: "That §1.8 instance already drives the ROFR endpoint through its full priority ladder
            (identity check, then ERR_ROFR_WINDOW_EXPIRED ahead of ERR_ROFR_UNIT_NOT_LINKED) with the
            TenantOccupant caller bound to a household it does not occupy, so a separate breadth recipe for
            ERR_IDENTITY_MISMATCH would only re-run its setup."
      - name: rofr_response_after_the_offer_window_closes_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 34]
          - errors[ERR_ROFR_WINDOW_EXPIRED]
          - entities.TenantHousehold.fields.rofr_expires_at
        excluded_because:
          difficulty_instance: rofr_window_expired_beats_rofr_unit_not_linked
          rationale: "The §1.8 instance triggers ERR_ROFR_WINDOW_EXPIRED at the exact strict boundary and
            proves it outranks the linkage guard; repeating it here would duplicate the same trigger."
      - name: rofr_exercise_without_a_linked_unit_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 41]
          - errors[ERR_ROFR_UNIT_NOT_LINKED]
          - entities.TenantHousehold.fields.occupied_unit_id
        excluded_because:
          difficulty_instance: rofr_window_expired_beats_rofr_unit_not_linked
          rationale: "ERR_ROFR_UNIT_NOT_LINKED is the losing side of that §1.8 priority pair and is
            triggered there in the second half of the instance, once the window is reopened."
      - name: hardening_without_a_delivered_pos_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 28]
          - errors[ERR_POS_NOT_DELIVERED]
          - endpoints[POST /purchase-agreements/{id}/hardening]
        excluded_because:
          difficulty_instance: pos_not_delivered_beats_escrow_not_funded_on_hardening
          rationale: "That §1.8 instance hardens an agreement that is neither delivered nor funded and pins
            ERR_POS_NOT_DELIVERED as the winner, so the breadth probe adds nothing."
      - name: hardening_without_funded_escrow_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 48]
          - errors[ERR_ESCROW_NOT_FUNDED]
          - entities.PurchaseAgreement.fields.escrow_status
        excluded_because:
          difficulty_instance: pos_not_delivered_beats_escrow_not_funded_on_hardening
          rationale: "ERR_ESCROW_NOT_FUNDED is the masked side of that §1.8 pair and surfaces there as soon
            as the POS delivery is recorded, which is exactly what a standalone recipe would do."
      - name: hardening_before_the_rescission_window_closes_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 35]
          - errors[ERR_RESCISSION_PERIOD_OPEN]
          - entities.PurchaseAgreement.fields.rescission_deadline_at
        excluded_because:
          difficulty_instance: pos_not_delivered_beats_escrow_not_funded_on_hardening
          rationale: "The third rung of that §1.8 ladder is ERR_RESCISSION_PERIOD_OPEN, reached after the
            delivery and the deposit are in place but before the clock passes the deadline."
      - name: rescission_after_the_deadline_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 36]
          - errors[ERR_RESCISSION_PERIOD_CLOSED]
          - endpoints[POST /purchase-agreements/{id}/rescission]
        excluded_because:
          difficulty_instance: rescission_deadline_strict_vs_inclusive_at_same_instant
          rationale: "That §1.8 instance rescinds at the exact deadline instant (allowed) and one second
            later (ERR_RESCISSION_PERIOD_CLOSED) on two sibling agreements, which is a strictly stronger
            probe than a single late rescission."
      - name: closing_an_agreement_in_an_unreleased_batch_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 24]
          - errors[ERR_BATCH_NOT_RELEASED]
          - endpoints[POST /purchase-agreements/{id}/closing]
        excluded_because:
          difficulty_instance: closing_blocked_until_assigned_batch_is_released
          rationale: "The §1.8 instance closes the same agreement before and after the batch release, so it
            already triggers ERR_BATCH_NOT_RELEASED and then clears it."
      - name: pos_effectiveness_before_the_declaration_is_recorded_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 26]
          - errors[ERR_DECLARATION_NOT_RECORDED]
          - endpoints[POST /public-offering-statements/{id}/effectiveness]
        excluded_because:
          difficulty_instance: pos_effectiveness_blocked_until_declaration_recorded
          rationale: "That §1.8 instance asks for effectiveness while the package is only PLAT_CERTIFIED and
            pins ERR_DECLARATION_NOT_RECORDED, then records and succeeds."
      - name: pos_effectiveness_with_an_unattested_section_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 32]
          - errors[ERR_POS_SECTIONS_INCOMPLETE]
          - entities.POSSection.fields.content_status
        excluded_because:
          difficulty_instance: pos_effectiveness_blocked_until_declaration_recorded
          rationale: "ERR_POS_SECTIONS_INCOMPLETE is the second rung of that same §1.8 ladder, triggered
            after the recording clears priority 26 but while one section is still DRAFTED."
      - name: presale_threshold_shortfall_blocks_the_batch_release
        claim_type: error_triggerable
        grounds:
          - validations[priority 50]
          - errors[ERR_PRESALE_THRESHOLD_NOT_MET]
          - calculations.presale_threshold_evaluation
        excluded_because:
          difficulty_instance: presale_pct_inclusive_at_exact_threshold_equality
          rationale: "That §1.8 instance sits one qualifying agreement below the threshold (release refused
            with ERR_PRESALE_THRESHOLD_NOT_MET) and then exactly at it (release allowed), covering both
            sides of the comparison."
      - name: overlapping_closing_batch_windows_are_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 38]
          - errors[ERR_BATCH_WINDOW_OVERLAP]
          - endpoints[POST /conversion-projects/{id}/closing-batches]
        excluded_because:
          difficulty_instance: closing_batch_half_open_window_adjacency_allowed
          rationale: "The §1.8 instance creates an abutting batch (accepted, half-open semantics) and a
            one-second-earlier one (ERR_BATCH_WINDOW_OVERLAP), which is the sharpest form of this trigger."
      - name: remediation_window_inside_the_cooldown_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 39]
          - errors[ERR_REMEDIATION_WINDOW_OVERLAP]
          - calculations.warranty_charge_and_window.constants.COOLDOWN_SECONDS
        excluded_because:
          difficulty_instance: remediation_closed_interval_cooldown_and_depth_cap
          rationale: "That §1.8 instance schedules at exactly end + 259200 s (refused) and at end + 259201 s
            (accepted) on the same component, so the cooldown boundary is already pinned."
      - name: a_third_concurrent_remediation_exceeds_project_capacity
        claim_type: error_triggerable
        grounds:
          - validations[priority 40]
          - errors[ERR_REMEDIATION_CAPACITY_EXCEEDED]
          - entities.ConversionProject.fields.max_overlapping_remediations
        excluded_because:
          difficulty_instance: remediation_closed_interval_cooldown_and_depth_cap
          rationale: "The aggregate depth cap is the second half of that §1.8 instance, which stacks two
            windows on different components and then asks for a third overlapping one."
      - name: reopening_a_claim_a_third_time_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 46]
          - errors[ERR_CLAIM_REOPEN_LIMIT_REACHED]
          - calculations.warranty_charge_and_window.constants.MAX_CLAIM_REOPENS
        excluded_because:
          difficulty_instance: warranty_claim_triage_fork_and_bounded_reopen_cycle
          rationale: "That §1.8 instance walks the whole reopen cycle twice and asserts the third attempt
            fails with ERR_CLAIM_REOPEN_LIMIT_REACHED while reopen_count stays at 2."
      - name: escrow_deposit_that_does_not_match_the_agreement_deposit_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 47]
          - errors[ERR_ESCROW_AMOUNT_MISMATCH]
          - endpoints[POST /purchase-agreements/{id}/escrow-deposits]
        excluded_because:
          difficulty_instance: escrow_cash_conserved_across_fund_then_rescind
          rationale: "The §1.8 conservation instance first submits a wrong amount_cents to establish
