scenario: |
  2961. Hotel Franchise Agreement & Brand Conversion (hotel franchisor development team): application
  review with owner financial capacity, market impact study and existing brand encroachment analysis,
  license agreement terms including royalty, marketing fund contribution and term length with liquidated
  damages, property improvement plan scoping at conversion with cost estimates and completion deadlines,
  brand standard compliance timelines with extension requests and default triggers, franchisee training,
  systems onboarding and reservation channel connection, quality assurance inspection scoring with cure
  periods and termination for repeated failure, transfer, refinancing and change-of-ownership consent,
  termination, de-identification requirements and post-termination obligations

domain_name: hotel-franchise-conversion
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # flat: ten peer entities linked purely by foreign-key fields. No entity is nested inside another
  # in a URL path for identity purposes; action endpoints hang off the resource that owns the action
  # (POST /pips/{id}/items) but every child is addressable and filterable from its own collection.

  state_machine_shape: parallel
  # LicenseAgreement carries four independent state axes that advance separately (status,
  # compliance_status, the onboarding triple training_status/systems_status/channel_status, and
  # de_identification_status). Application carries a cyclic primary axis (UNDER_REVIEW ->
  # REVISION_REQUESTED -> UNDER_REVIEW) crossed with two independent review axes
  # (financial_review_status, impact_study_status). PipItem is cyclic (PENDING -> SUBMITTED ->
  # PENDING on rejection; OVERDUE -> PENDING on a granted extension). EncroachmentClaim,
  # QaInspection and TransferRequest are branching with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # Brand -> ExistingUnit, Application -> EncroachmentClaim, PIP -> PipItem
    - cross_aggregate    # EncroachmentClaim references both an Application and an ExistingUnit;
                         # TransferRequest references both a LicenseAgreement and a prospective Owner
    - polymorphic: false

  role_model: segregation_of_duties
  # The FranchiseDevelopmentManager X-User-ID that recorded an Application's financial review may not
  # be the X-User-ID that issues its decision; the QaInspector X-User-ID that scored an inspection may
  # not be the X-User-ID that reviews its cure. Beyond that the three franchisor roles are peer roles
  # over disjoint resource surfaces, and Owner is entity-backed and may only act on its own resources.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 10 entities / 53 endpoints / 59 error codes / 9 calculations (3 of which carry variants) /
  # 17 declared state axes across 8 entities / 2 OCC rules. Density over volume: the entity count
  # sits at the low end of the expert band while the calculation, cascade and state-axis counts sit
  # at the high end.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Franchisor brand code used on signage and in reservation channel records."
        constraints: "3-12 characters, uppercase A-Z and digits 0-9 only; unique across all Brand rows."
      - name: name
        type: string
        source: input
        description: "Consumer-facing brand name."
        constraints: "1-120 characters."
      - name: tier
        type: enum
        source: input
        description: "Chain-scale tier the brand competes in."
        constraints: "One of {ECONOMY, MIDSCALE, UPSCALE, LUXURY}."
      - name: base_royalty_rate_pct
        type: number
        source: input
        description: "Published continuing-fee royalty rate before conversion and capacity adjustments."
        constraints: "0.00-10.00, exactly 2 decimal places."
      - name: marketing_fund_rate_pct
        type: number
        source: input
        description: "Published brand marketing fund contribution rate before the impact surcharge."
        constraints: "0.00-5.00, exactly 2 decimal places."
      - name: protected_radius_miles
        type: number
        source: input
        description: "Radius of the area of protection granted to each operating unit of this brand."
        constraints: "0.01-50.00, exactly 2 decimal places."
      - name: min_room_count
        type: integer
        source: input
        description: "Minimum key count a converting property must have to fly this brand."
        constraints: ">= 1."
      - name: standard_term_years
        type: integer
        source: input
        description: "Standard license term length in years; the ceiling of the granted term."
        constraints: "5-30."
      - name: operating_unit_count
        type: integer
        source: computed
        description: "Count of ExistingUnit rows whose brand_id equals this Brand.id AND whose status == OPERATING. Recomputed on every ExistingUnit create and every ExistingUnit status change."
        default: 0
      - name: open_application_count
        type: integer
        source: computed
        description: "Count of Application rows whose brand_id equals this Brand.id AND whose status IN {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED}. Recomputed on every Application create and every Application status change."
        default: 0

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the ownership entity applying for or holding a license."
        constraints: "1-160 characters."
      - name: contact_email
        type: string
        source: input
        description: "Primary development contact email."
        constraints: "Must contain exactly one '@' and at least one '.' after it; 5-160 characters."
      - name: liquid_assets_amount
        type: number
        source: input
        description: "Verified unencumbered liquid assets in USD."
        constraints: ">= 0.00, exactly 2 decimal places."
      - name: net_worth_amount
        type: number
        source: input
        description: "Verified net worth in USD."
        constraints: ">= 0.00, exactly 2 decimal places."
      - name: credit_score
        type: integer
        source: input
        description: "Guarantor credit score."
        constraints: "300-850."
      - name: existing_units_count
        type: integer
        source: input
        description: "Number of hotels the ownership entity already operates under any brand. Drives the portfolio reserve deduction and the experience bonus in capacity scoring."
        constraints: ">= 0."
      - name: capacity_score_standalone
        type: number
        source: computed
        description: "owner_capacity_score under variant STANDALONE (see calculations.owner_capacity_score). Recomputed on Owner create and on every POST /owners/{id}/financial-profile."
        constraints: "0.00-100.00, 2 decimal places."
      - name: capacity_score_portfolio_adjusted
        type: number
        source: computed
        description: "owner_capacity_score under variant PORTFOLIO_ADJUSTED. Recomputed at the same moments as capacity_score_standalone."
        constraints: "0.00-100.00, 2 decimal places."
      - name: capacity_band_standalone
        type: enum
        source: computed
        description: "Band derived from capacity_score_standalone by the CAPACITY_BAND thresholds."
        constraints: "One of {STRONG, ADEQUATE, INSUFFICIENT}."
      - name: capacity_band_portfolio_adjusted
        type: enum
        source: computed
        description: "Band derived from capacity_score_portfolio_adjusted by the CAPACITY_BAND thresholds."
        constraints: "One of {STRONG, ADEQUATE, INSUFFICIENT}."
      - name: financial_profile_revision
        type: integer
        source: system
        description: "Increments by 1 on every successful POST /owners/{id}/financial-profile. 0 at create."
        default: 0
      - name: status
        type: enum
        source: system
        description: "PROSPECT until the first LicenseAgreement of an Application owned by this Owner reaches EXECUTED, at which point the transition sets ACTIVE."
        default: PROSPECT
        constraints: "One of {PROSPECT, ACTIVE}."

  - name: ExistingUnit
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand this already-operating hotel flies."
      - name: unit_name
        type: string
        source: input
        description: "Operating hotel name."
        constraints: "1-120 characters."
      - name: market_code
        type: string
        source: input
        description: "Franchisor market identifier."
        constraints: "3-8 characters, uppercase A-Z and digits 0-9 only."
      - name: x_miles
        type: number
        source: input
        description: "Planar east coordinate of the unit in miles on the franchisor's market grid."
        constraints: "-500.00 to 500.00, exactly 2 decimal places."
      - name: y_miles
        type: number
        source: input
        description: "Planar north coordinate of the unit in miles on the franchisor's market grid."
        constraints: "-500.00 to 500.00, exactly 2 decimal places."
      - name: room_count
        type: integer
        source: input
        description: "Key count of the operating unit; the denominator share in impact scoring."
        constraints: ">= 1."
      - name: adr_amount
        type: number
        source: input
        description: "Trailing average daily rate in USD."
        constraints: ">= 0.00, exactly 2 decimal places."
      - name: occupancy_pct
        type: number
        source: input
        description: "Trailing occupancy percentage."
        constraints: "0.00-100.00, exactly 2 decimal places."
      - name: territory_start_date
        type: string
        source: input
        description: "First calendar day of this unit's area-of-protection term (date, YYYY-MM-DD)."
      - name: territory_end_date
        type: string
        source: input
        description: "Last calendar day of this unit's area-of-protection term (date, YYYY-MM-DD). Must be >= territory_start_date. Both endpoints are INCLUSIVE for territory-term overlap detection."
      - name: status
        type: enum
        source: system
        description: "OPERATING at create. POST /existing-units/{id}/status moves it to SUSPENDED or TERMINATED, and SUSPENDED back to OPERATING."
        default: OPERATING
        constraints: "One of {OPERATING, SUSPENDED, TERMINATED}."
      - name: status_reason
        type: string
        source: system
        description: "Reason text recorded by the most recent POST /existing-units/{id}/status call; null before the first such call."

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the ownership entity applying to convert the property."
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand applied for."
      - name: property_name
        type: string
        source: input
        description: "Name of the property proposed for conversion."
        constraints: "1-120 characters."
      - name: market_code
        type: string
        source: input
        description: "Franchisor market identifier of the property."
        constraints: "3-8 characters, uppercase A-Z and digits 0-9 only."
      - name: property_x_miles
        type: number
        source: input
        description: "Planar east coordinate of the property in miles on the franchisor's market grid."
        constraints: "-500.00 to 500.00, exactly 2 decimal places."
      - name: property_y_miles
        type: number
        source: input
        description: "Planar north coordinate of the property in miles on the franchisor's market grid."
        constraints: "-500.00 to 500.00, exactly 2 decimal places."
      - name: room_count
        type: integer
        source: input
        description: "Key count of the converting property; denominator input to PIP cost-per-room and to impact share."
        constraints: ">= 1."
      - name: current_affiliation
        type: enum
        source: input
        description: "What the property flies today; drives the conversion adjustment in royalty derivation."
        constraints: "One of {INDEPENDENT, COMPETITOR, OUR_BRAND}."
      - name: building_age_years
        type: integer
        source: input
        description: "Age of the building in years at application."
        constraints: "0-150."
      - name: requested_term_years
        type: integer
        source: input
        description: "Term length in years the applicant asks for; clamped by license_terms_derivation."
        constraints: "5-30."
      - name: requested_conversion_date
        type: string
        source: input
        description: "Requested first day of brand operation (date, YYYY-MM-DD). Start of the requested term interval used by the territory-term overlap rule."
      - name: status
        type: enum
        source: system
        description: "Primary review axis. SUBMITTED at create; cycles UNDER_REVIEW <-> REVISION_REQUESTED; terminal APPROVED or DECLINED."
        default: SUBMITTED
        constraints: "One of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, DECLINED}."
      - name: revision_round
        type: integer
        source: system
        description: "Increments by 1 on every POST /applications/{id}/resubmit. 0 at create."
        default: 0
      - name: financial_review_status
        type: enum
        source: system
        description: "Independent review axis. NOT_STARTED at create; POST /applications/{id}/financial-review sets PASSED or FAILED from the owner's capacity band; a POST /owners/{id}/financial-profile on the owner flips PASSED to STALE; POST /applications/{id}/resubmit resets it to NOT_STARTED."
        default: NOT_STARTED
        constraints: "One of {NOT_STARTED, PASSED, FAILED, STALE}."
      - name: capacity_basis
        type: enum
        source: system
        description: "Which owner_capacity_score variant the financial review was taken on. Null until the first financial review."
        constraints: "One of {STANDALONE, PORTFOLIO_ADJUSTED} or null."
      - name: capacity_score_at_review
        type: number
        source: computed
        description: "Snapshot of the owner's capacity score under capacity_basis at the moment of financial review. Null until the first financial review."
      - name: capacity_band_at_review
        type: enum
        source: computed
        description: "Snapshot of the band derived from capacity_score_at_review."
        constraints: "One of {STRONG, ADEQUATE, INSUFFICIENT} or null."
      - name: financial_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the FranchiseDevelopmentManager that recorded the most recent financial review. Compared against the decision actor by the segregation-of-duties rule."
      - name: impact_study_status
        type: enum
        source: system
        description: "Independent review axis. NOT_STARTED at create; POST /applications/{id}/impact-analysis sets PRELIMINARY; POST /applications/{id}/finalize-impact sets FINAL; a SUSTAINED encroachment claim knocks FINAL back to PRELIMINARY; POST /applications/{id}/resubmit resets it to NOT_STARTED."
        default: NOT_STARTED
        constraints: "One of {NOT_STARTED, PRELIMINARY, FINAL}."
      - name: preliminary_impact_score
        type: number
        source: computed
        description: "market_impact_score under variant PRELIMINARY. Null until the first impact analysis."
        constraints: "0.00-100.00, 2 decimal places."
      - name: impact_unit_count_preliminary
        type: integer
        source: computed
        description: "Number of ExistingUnit rows that entered the PRELIMINARY input set (same brand, status == OPERATING, distance_miles <= brand.protected_radius_miles). Null until the first impact analysis."
      - name: base_impact_score
        type: number
        source: computed
        description: "market_impact_score under variant FINAL before the sustained-claim penalty is added. Null until finalize-impact has run at least once."
      - name: final_impact_score
        type: number
        source: computed
        description: "min(100.00, base_impact_score + CLAIM_PENALTY_POINTS * sustained_claim_count). Null while impact_study_status != FINAL."
      - name: impact_unit_count_final
        type: integer
        source: computed
        description: "Number of ExistingUnit rows that entered the FINAL input set (same brand, status IN {OPERATING, SUSPENDED}, distance_miles <= brand.protected_radius_miles)."
      - name: sustained_claim_count
        type: integer
        source: computed
        description: "Count of EncroachmentClaim rows whose application_id equals this Application.id AND whose status == SUSTAINED."
        default: 0
      - name: encroachment_verdict
        type: enum
        source: computed
        description: "Threshold verdict on final_impact_score. Null while impact_study_status != FINAL."
        constraints: "One of {CLEAR, MITIGATION_REQUIRED, ENCROACHMENT_CONFIRMED} or null."
      - name: claim_window_closes_at
        type: datetime
        source: computed
        description: "Instant after which no new EncroachmentClaim may be filed on this Application. Set by impact-analysis to logical_now + CLAIM_WINDOW_DAYS."
      - name: encroachment_waiver_granted
        type: boolean
        source: system
        description: "Set from the decision call's encroachment_waiver_granted input; permits approval when encroachment_verdict == ENCROACHMENT_CONFIRMED."
        default: false
      - name: decision_outcome
        type: enum
        source: system
        description: "Outcome recorded by POST /applications/{id}/decision."
        constraints: "One of {APPROVE, DECLINE} or null."
      - name: decision_user_id
        type: string
        source: system
        description: "X-User-ID of the FranchiseDevelopmentManager that issued the decision."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision."
      - name: decision_notes
        type: string
        source: system
        description: "Notes supplied with the decision."
      - name: revision_notes
        type: string
        source: system
        description: "Notes supplied with the most recent revision request."
      - name: revision_response
        type: string
        source: system
        description: "Applicant text supplied with the most recent resubmit."

  - name: EncroachmentClaim
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the pending conversion the claim protests."
      - name: existing_unit_id
        type: string
        source: input
        description: "FK -> ExistingUnit.id; the operating unit asserting the encroachment."
      - name: claimed_revenue_loss_pct
        type: number
        source: input
        description: "Revenue loss the claimant asserts, in percent."
        constraints: "0.00-100.00, exactly 2 decimal places."
      - name: narrative
        type: string
        source: input
        description: "Claimant narrative."
        constraints: "1-2000 characters."
      - name: distance_miles
        type: number
        source: computed
        description: "Straight-line distance from the claiming unit to the applicant property, round(sqrt(dx^2 + dy^2), 2)."
      - name: status
        type: enum
        source: system
        description: "FILED at create; POST /encroachment-claims/{id}/resolve branches to SUSTAINED or OVERRULED with divergent side-effect sets."
        default: FILED
        constraints: "One of {FILED, SUSTAINED, OVERRULED}."
      - name: penalty_points_applied
        type: number
        source: computed
        description: "CLAIM_PENALTY_POINTS when status == SUSTAINED, 0.00 otherwise."
        default: 0.00
      - name: resolution_notes
        type: string
        source: system
        description: "Resolution text recorded at resolve time."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution."
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BrandStandardsDirector that docketed the claim."

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the approved application this license was drafted from."
      - name: brand_code
        type: string
        source: system
        description: "Snapshot of Brand.code taken at draft time; the de-identification obligation is scoped to this code."
      - name: royalty_rate_pct
        type: number
        source: computed
        description: "Tier-1 continuing royalty rate from license_terms_derivation, frozen at draft."
      - name: marketing_fund_rate_pct
        type: number
        source: computed
        description: "Marketing fund contribution rate from license_terms_derivation, frozen at draft."
      - name: term_years
        type: integer
        source: computed
        description: "Granted term length in years from license_terms_derivation, frozen at draft."
      - name: effective_date
        type: string
        source: input
        description: "First day of the license term (date, YYYY-MM-DD)."
      - name: expiry_date
        type: string
        source: computed
        description: "effective_date advanced by term_years calendar years, same month and day (date, YYYY-MM-DD)."
      - name: liquidated_damages_cap_months
        type: integer
        source: system
        description: "Snapshot of LD_CAP_MONTHS at draft time; caps both liquidated-damages formulas."
        default: 36
      - name: status
        type: enum
        source: system
        description: "Primary axis. DRAFT at create; EXECUTED on execute; OPEN on open; TERMINATION_PENDING then TERMINATED on terminate/close-out; VOIDED when a SUSTAINED claim invalidates the parent application's finalized impact study while this agreement is still DRAFT."
        default: DRAFT
        constraints: "One of {DRAFT, EXECUTED, OPEN, TERMINATION_PENDING, TERMINATED, VOIDED}."
      - name: compliance_status
        type: enum
        source: system
        description: "Independent brand-standard axis. COMPLIANT at create; a CONDITIONAL or FAIL inspection moves it to CURE_PERIOD; a failed cure or a defaulted PIP moves it to DEFAULT_NOTICE; the QA_FAILURE_TERMINATION_THRESHOLD-th consecutive failed cure moves it to TERMINATION_ELIGIBLE; a passed cure returns it to COMPLIANT."
        default: COMPLIANT
        constraints: "One of {COMPLIANT, CURE_PERIOD, DEFAULT_NOTICE, TERMINATION_ELIGIBLE}."
      - name: training_status
        type: enum
        source: system
        description: "Onboarding axis 1. NOT_STARTED at create; POST /agreements/{id}/onboarding-milestone with track TRAINING and to_status COMPLETED advances it."
        default: NOT_STARTED
        constraints: "One of {NOT_STARTED, COMPLETED}."
      - name: systems_status
        type: enum
        source: system
        description: "Onboarding axis 2. Ordered ladder NOT_STARTED -> PROVISIONED -> VALIDATED; each onboarding-milestone call with track SYSTEMS must name the immediate next rung."
        default: NOT_STARTED
        constraints: "One of {NOT_STARTED, PROVISIONED, VALIDATED}."
      - name: channel_status
        type: enum
        source: system
        description: "Onboarding axis 3, the reservation channel connection. Ordered ladder NOT_CONNECTED -> TESTING -> CONNECTED; CONNECTED is knocked to SUSPENDED by the failed-cure cascade and restored to CONNECTED by a passed cure."
        default: NOT_CONNECTED
        constraints: "One of {NOT_CONNECTED, TESTING, CONNECTED, SUSPENDED}."
      - name: de_identification_status
        type: enum
        source: system
        description: "Post-termination axis. NOT_REQUIRED until terminate sets PENDING; POST /agreements/{id}/de-identification sets SUBMITTED when filed at or before de_identification_deadline and BREACHED when filed after it; close-out sets VERIFIED."
        default: NOT_REQUIRED
        constraints: "One of {NOT_REQUIRED, PENDING, SUBMITTED, VERIFIED, BREACHED}."
      - name: de_identification_deadline
        type: datetime
        source: computed
        description: "terminated_at advanced by DE_IDENTIFICATION_DAYS. Null while de_identification_status == NOT_REQUIRED."
      - name: de_identification_items_completed
        type: array
        source: system
        description: "The de-identification item codes submitted by the most recent POST /agreements/{id}/de-identification call; each element is one of {SIGNAGE, INTERIOR_BRANDING, DIGITAL_LISTINGS, LINENS_AND_COLLATERAL, RESERVATION_CODES}."
        default: []
      - name: de_identification_breach_penalty
        type: number
        source: computed
        description: "DE_IDENTIFICATION_BREACH_PENALTY when de_identification_status == BREACHED, 0.00 otherwise."
        default: 0.00
      - name: consecutive_qa_failure_count
        type: integer
        source: computed
        description: "Number of consecutive failed cure reviews on this agreement. Incremented by a CURE_FAILED review, reset to 0 by a CURE_PASSED review."
        default: 0
      - name: revenue_periods
        type: array
        source: computed
        description: "Append-only ledger of objects {period_month, gross_room_revenue, royalty_fee, marketing_fee, reservation_fee, period_total_fee, superseded}. Ordered by created_at ASC. A correction appends a new entry for the same period_month and flips the prior entry's superseded to true; superseded entries never enter any sum."
        default: []
      - name: royalty_fee_to_date
        type: number
        source: computed
        description: "Sum of royalty_fee over revenue_periods entries whose superseded == false."
        default: 0.00
      - name: marketing_fund_contributed_total
        type: number
        source: computed
        description: "Sum of marketing_fee over revenue_periods entries whose superseded == false. Each period's marketing_fee is rounded before this sum is taken (see calculations.monthly_fee_assessment precision)."
        default: 0.00
      - name: reservation_fee_to_date
        type: number
        source: computed
        description: "Sum of reservation_fee over revenue_periods entries whose superseded == false."
        default: 0.00
      - name: total_fees_assessed
        type: number
        source: computed
        description: "Sum of period_total_fee over revenue_periods entries whose superseded == false. Invariant: equals royalty_fee_to_date + marketing_fund_contributed_total + reservation_fee_to_date."
        default: 0.00
      - name: reported_period_count
        type: integer
        source: computed
        description: "Count of revenue_periods entries whose superseded == false."
        default: 0
      - name: default_notice_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant compliance_status most recently became DEFAULT_NOTICE."
      - name: pip_cure_deadline
        type: datetime
        source: computed
        description: "default_notice_issued_at advanced by PIP_DEFAULT_CURE_DAYS when the DEFAULT_NOTICE was raised by a defaulted PIP; null otherwise."
      - name: transfer_consent_blocked
        type: boolean
        source: computed
        description: "true while compliance_status IN {DEFAULT_NOTICE, TERMINATION_ELIGIBLE}; false while compliance_status IN {COMPLIANT, CURE_PERIOD}."
        default: false
      - name: transfer_consent_count
        type: integer
        source: computed
        description: "Count of TransferRequest rows on this agreement whose status == CONSENTED."
        default: 0
      - name: termination_cause
        type: enum
        source: system
        description: "Cause recorded by POST /agreements/{id}/terminate; also selects the liquidated-damages variant."
        constraints: "One of {FOR_CAUSE_QA, FOR_CAUSE_PIP, MUTUAL} or null."
      - name: liquidated_damages_formula
        type: enum
        source: computed
        description: "CONTRACTUAL_MULTIPLE for causes FOR_CAUSE_QA and FOR_CAUSE_PIP; DISCOUNTED_PV for cause MUTUAL."
        constraints: "One of {CONTRACTUAL_MULTIPLE, DISCOUNTED_PV} or null."
      - name: liquidated_damages_amount
        type: number
        source: computed
        description: "Output of calculations.liquidated_damages under liquidated_damages_formula, frozen at terminate time."
      - name: liquidated_damages_paid_amount
        type: number
        source: system
        description: "Settlement amount recorded at close-out."
        default: 0.00
      - name: remaining_term_months_at_termination
        type: integer
        source: computed
        description: "Whole calendar months from the termination month to the expiry month, (expiry_year*12 + expiry_month) - (termination_year*12 + termination_month), floored at 0."
      - name: trailing_avg_monthly_fee
        type: number
        source: computed
        description: "Basis of both liquidated-damages formulas; see calculations.liquidated_damages."
      - name: post_termination_status
        type: enum
        source: system
        description: "NOT_APPLICABLE until terminate sets OPEN; close-out sets CLOSED."
        default: NOT_APPLICABLE
        constraints: "One of {NOT_APPLICABLE, OPEN, CLOSED}."
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution."
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the hotel opened under the brand."
      - name: last_inspection_at
        type: datetime
        source: computed
        description: "inspection_at of the most recent QaInspection on this agreement, by inspection_at DESC then created_at DESC. Null while no inspection exists."
      - name: terminated_at
        type: datetime
        source: system
        description: "Logical-clock instant of termination."
      - name: closed_out_at
        type: datetime
        source: system
        description: "Logical-clock instant of close-out."

  - name: PropertyImprovementPlan
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the license whose conversion scope this plan carries."
      - name: scope_notes
        type: string
        source: input
        description: "Narrative scope summary produced at the conversion site visit."
        constraints: "1-2000 characters."
      - name: status
        type: enum
        source: system
        description: "SCOPED at create; ACCEPTED on accept; IN_PROGRESS on the first item completion; COMPLETED when every item reaches VERIFIED; DEFAULTED when a compliance sweep finds an OVERDUE item of priority CRITICAL or category LIFE_SAFETY; SUSPENDED when the agreement enters TERMINATION_PENDING."
        default: SCOPED
        constraints: "One of {SCOPED, ACCEPTED, IN_PROGRESS, COMPLETED, DEFAULTED, SUSPENDED}."
      - name: items_total_count
        type: integer
        source: computed
        description: "Count of PipItem rows whose pip_id equals this plan's id."
        default: 0
      - name: items_pending_count
        type: integer
        source: computed
        description: "Count of this plan's PipItem rows whose status == PENDING."
        default: 0
      - name: items_submitted_count
        type: integer
        source: computed
        description: "Count of this plan's PipItem rows whose status == SUBMITTED."
        default: 0
      - name: items_verified_count
        type: integer
        source: computed
        description: "Count of this plan's PipItem rows whose status == VERIFIED."
        default: 0
      - name: items_overdue_count
        type: integer
        source: computed
        description: "Count of this plan's PipItem rows whose status == OVERDUE. Invariant: items_pending_count + items_submitted_count + items_verified_count + items_overdue_count == items_total_count."
        default: 0
      - name: total_estimated_cost
        type: number
        source: computed
        description: "round(sum of estimated_cost over every PipItem row of this plan, 2). Recomputed on every item create."
        default: 0.00
      - name: cost_per_room
        type: number
        source: computed
        description: "round(total_estimated_cost / Application.room_count, 2) using the GROSS total, evaluated at accept time."
      - name: key_money_pct
        type: number
        source: computed
        description: "Franchisor key-money percentage selected from the cost_per_room band, evaluated at accept time."
      - name: franchisor_key_money
        type: number
        source: computed
        description: "min(KEY_MONEY_CAP, round(total_estimated_cost * key_money_pct / 100, 2)), evaluated at accept time."
      - name: owner_net_cost
        type: number
        source: computed
        description: "total_estimated_cost - franchisor_key_money. Invariant: total_estimated_cost == owner_net_cost + franchisor_key_money."
      - name: owner_net_cost_per_room
        type: number
        source: computed
        description: "round(owner_net_cost / Application.room_count, 2), evaluated at accept time."
      - name: escalation_required
        type: boolean
        source: computed
        description: "true when owner_net_cost_per_room > COST_PER_ROOM_CEILING, false otherwise."
        default: false
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant the franchisee accepted the scope; the anchor for every item due_date."
      - name: overall_deadline
        type: datetime
        source: computed
        description: "The maximum due_date over this plan's PipItem rows, recomputed on accept and on every granted extension."
      - name: extension_granted_days_total
        type: integer
        source: computed
        description: "Sum of extension_granted_days_total over this plan's PipItem rows; capped by PIP_EXTENSION_POOL_DAYS."
        default: 0
      - name: acknowledgement
        type: string
        source: system
        description: "Acknowledgement text supplied at accept."

  - name: PipItem
    parent: null
    common_fields: true
    fields:
      - name: pip_id
        type: string
        source: input
        description: "FK -> PropertyImprovementPlan.id; the plan this scope line belongs to."
      - name: category
        type: enum
        source: input
        description: "Scope category; contributes the category deadline allowance and the life-safety gate."
        constraints: "One of {GUESTROOM, EXTERIOR, FOOD_BEVERAGE, LIFE_SAFETY, TECHNOLOGY}."
      - name: priority
        type: enum
        source: input
        description: "Scope priority; contributes the priority deadline allowance and the opening gate."
        constraints: "One of {CRITICAL, MAJOR, MINOR}."
      - name: description
        type: string
        source: input
        description: "Scope line description."
        constraints: "1-500 characters."
      - name: estimated_cost
        type: number
        source: input
        description: "Estimated cost of this scope line in USD."
        constraints: ">= 0.00, exactly 2 decimal places."
      - name: status
        type: enum
        source: system
        description: "PENDING at create; complete moves PENDING -> SUBMITTED; verify branches SUBMITTED -> VERIFIED or SUBMITTED -> PENDING; a compliance sweep moves PENDING or SUBMITTED past due_date to OVERDUE; a granted extension moves OVERDUE back to PENDING."
        default: PENDING
        constraints: "One of {PENDING, SUBMITTED, VERIFIED, OVERDUE}."
      - name: base_due_date
        type: datetime
        source: computed
        description: "pip.accepted_at advanced by min(PRIORITY_DAYS[priority], CATEGORY_DAYS[category]) days. Null before the plan is accepted."
      - name: due_date
        type: datetime
        source: computed
        description: "base_due_date advanced by extension_granted_days_total days. Null before the plan is accepted."
      - name: extension_status
        type: enum
        source: system
        description: "NONE at create; extension-request sets PENDING; extension-decision sets GRANTED or DENIED."
        default: NONE
        constraints: "One of {NONE, PENDING, GRANTED, DENIED}."
      - name: extension_requested_days
        type: integer
        source: system
        description: "Days asked for by the most recent extension request; 0 before the first request."
        default: 0
      - name: extension_granted_days_total
        type: integer
        source: computed
        description: "Cumulative days granted on this item across all decisions; capped by MAX_EXTENSION_DAYS_PER_ITEM and by the plan's remaining pool."
        default: 0
      - name: extension_request_count
        type: integer
        source: computed
        description: "Number of extension requests filed on this item; capped by MAX_EXTENSION_REQUESTS_PER_ITEM."
        default: 0
      - name: extension_reason
        type: string
        source: system
        description: "Reason text of the most recent extension request."
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times a verify call rejected this item back to PENDING."
        default: 0
      - name: completion_evidence
        type: string
        source: system
        description: "Evidence text supplied by the most recent complete call."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent complete call."
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant the item reached VERIFIED."
      - name: overdue_at
        type: datetime
        source: system
        description: "Logical-clock instant the compliance sweep marked the item OVERDUE."

  - name: QaInspection
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the open hotel inspected."
      - name: inspection_at
        type: datetime
        source: computed
        description: "Logical-clock instant the inspection was recorded; the anchor of the cure deadline and of the MIN_INSPECTION_GAP_DAYS spacing rule."
      - name: cleanliness_score
        type: integer
        source: input
        description: "Cleanliness section score."
        constraints: "0-100."
      - name: condition_score
        type: integer
        source: input
        description: "Physical condition section score."
        constraints: "0-100."
      - name: brand_standard_score
        type: integer
        source: input
        description: "Brand standard conformance section score."
        constraints: "0-100."
      - name: guest_experience_score
        type: integer
        source: input
        description: "Guest experience section score."
        constraints: "0-100."
      - name: critical_defect_count
        type: integer
        source: input
        description: "Number of critical defects observed; each costs CRITICAL_DEFECT_PENALTY_POINTS."
        constraints: "0-20."
      - name: life_safety_defect
        type: boolean
        source: input
        description: "Whether a life-safety defect was observed; forces grade FAIL regardless of score."
      - name: weighted_score
        type: number
        source: computed
        description: "The weighted section total before the critical-defect penalty."
      - name: total_score
        type: number
        source: computed
        description: "round(max(0.00, weighted_score - CRITICAL_DEFECT_PENALTY_POINTS * critical_defect_count), 2)."
      - name: grade
        type: enum
        source: computed
        description: "FAIL when life_safety_defect == true; otherwise PASS when total_score >= QA_PASS_THRESHOLD, CONDITIONAL when total_score >= QA_CONDITIONAL_THRESHOLD, FAIL below that."
        constraints: "One of {PASS, CONDITIONAL, FAIL}."
      - name: cure_period_days
        type: integer
        source: computed
        description: "null for grade PASS, CURE_DAYS_CONDITIONAL for CONDITIONAL, CURE_DAYS_FAIL for FAIL."
      - name: cure_deadline
        type: datetime
        source: computed
        description: "inspection_at advanced by cure_period_days days; null for grade PASS. A cure submitted at exactly this instant is inside the window."
      - name: status
        type: enum
        source: system
        description: "CLOSED at create for grade PASS; CURE_PENDING at create for grades CONDITIONAL and FAIL; cure-submission moves CURE_PENDING -> CURE_SUBMITTED; cure-review branches CURE_SUBMITTED -> CURE_PASSED or CURE_SUBMITTED -> CURE_FAILED."
        constraints: "One of {CLOSED, CURE_PENDING, CURE_SUBMITTED, CURE_PASSED, CURE_FAILED}."
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the QaInspector that scored the inspection. Compared against the cure reviewer by the segregation-of-duties rule."
      - name: cure_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the QaInspector that reviewed the cure."
      - name: cure_evidence
        type: string
        source: system
        description: "Evidence text supplied with the cure submission."
      - name: cure_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the cure submission."
      - name: cure_reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the cure review."
      - name: review_notes
        type: string
        source: system
        description: "Notes recorded with the cure review."

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the license the consent is sought under."
      - name: proposed_owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the prospective transferee. Required for request_type IN {TRANSFER, CHANGE_OF_CONTROL} and must be omitted for REFINANCE."
      - name: request_type
        type: enum
        source: input
        description: "Which consent is sought."
        constraints: "One of {TRANSFER, CHANGE_OF_CONTROL, REFINANCE}."
      - name: lender_name
        type: string
        source: input
        description: "Lender of record. Required for request_type REFINANCE and must be omitted otherwise."
        constraints: "1-160 characters when present."
      - name: transfer_fee
        type: number
        source: computed
        description: "Base consent fee from calculations.transfer_consent_fee, excluding the non-compliance surcharge."
      - name: non_compliance_surcharge
        type: number
        source: computed
        description: "NON_COMPLIANCE_SURCHARGE when the agreement's compliance_status != COMPLIANT at submission, 0.00 otherwise."
        default: 0.00
      - name: total_consent_fee
        type: number
        source: computed
        description: "transfer_fee + non_compliance_surcharge."
      - name: proposed_owner_capacity_band
        type: enum
        source: computed
        description: "Snapshot of the proposed owner's capacity_band_standalone at submission; null for REFINANCE."
        constraints: "One of {STRONG, ADEQUATE, INSUFFICIENT} or null."
      - name: status
        type: enum
        source: system
        description: "SUBMITTED at create; decide branches to CONSENTED or REFUSED; the DEFAULT_NOTICE cascade also moves SUBMITTED -> REFUSED."
        default: SUBMITTED
        constraints: "One of {SUBMITTED, CONSENTED, REFUSED}."
      - name: refusal_reason
        type: enum
        source: system
        description: "Why consent was refused."
        constraints: "One of {DEFAULT_NOTICE, CAPACITY, DISCRETION} or null."
      - name: decision_user_id
        type: string
        source: system
        description: "X-User-ID of the FranchiseDevelopmentManager that decided the request; null when the DEFAULT_NOTICE cascade refused it."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision."
      - name: decision_notes
        type: string
        source: system
        description: "Notes recorded with the decision."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Owner that filed the request."

# =============================================================================
# 1.2 State Machine Table
# Parallel axes on the same entity are declared as separate entries carrying a
# `dimension:` key naming the field that axis governs.
# =============================================================================
state_machines:
  - entity: Application
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/start-review"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "no change to Brand.open_application_count (SUBMITTED and UNDER_REVIEW are both counted)"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /applications/{id}/request-revision"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "sets Application.revision_notes from the request body"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/resubmit"
        actor: Owner
        preconditions:
          - "application.status == REVISION_REQUESTED"
          - "X-User-ID == application.owner_id"
        side_effects:
          - "increments Application.revision_round by 1"
          - "sets Application.revision_response from the request body"
          - "resets Application.financial_review_status to NOT_STARTED and nulls capacity_basis, capacity_score_at_review, capacity_band_at_review, financial_reviewer_user_id"
          - "resets Application.impact_study_status to NOT_STARTED and nulls preliminary_impact_score, impact_unit_count_preliminary, base_impact_score, final_impact_score, impact_unit_count_final, encroachment_verdict, claim_window_closes_at"
        note: "The cycle is unbounded; revision_round is the observable loop counter."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/decision with outcome == APPROVE"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.financial_review_status == PASSED"
          - "application.impact_study_status == FINAL"
          - "zero EncroachmentClaim rows on this application with status == FILED"
          - "application.room_count >= brand.min_room_count"
          - "application.encroachment_verdict != ENCROACHMENT_CONFIRMED, unless the request body sets encroachment_waiver_granted == true"
          - "no ExistingUnit of the same brand inside the protected radius whose inclusive territory term overlaps the requested license term (see validations.territory-term overlap)"
          - "X-User-ID != application.financial_reviewer_user_id"
        side_effects:
          - "sets decision_outcome APPROVE, decision_user_id, decided_at, decision_notes, encroachment_waiver_granted"
          - "decrements Brand.open_application_count by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /applications/{id}/decision with outcome == DECLINE"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "X-User-ID != application.financial_reviewer_user_id"
        side_effects:
          - "sets decision_outcome DECLINE, decision_user_id, decided_at, decision_notes"
          - "decrements Brand.open_application_count by 1"
        note: "A decline needs neither a passed financial review nor a final impact study."

  - entity: Application
    dimension: financial_review_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: PASSED
        trigger: "POST /applications/{id}/financial-review with a capacity_basis whose band != INSUFFICIENT"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "snapshots capacity_basis, capacity_score_at_review, capacity_band_at_review from the owner"
          - "sets financial_reviewer_user_id to the acting X-User-ID"
      - from: NOT_STARTED
        to: FAILED
        trigger: "POST /applications/{id}/financial-review with a capacity_basis whose band == INSUFFICIENT"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "snapshots capacity_basis, capacity_score_at_review, capacity_band_at_review == INSUFFICIENT"
          - "sets financial_reviewer_user_id to the acting X-User-ID"
      - from: FAILED
        to: PASSED
        trigger: "POST /applications/{id}/financial-review after the owner's financial profile improved"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "re-snapshots the capacity fields and overwrites financial_reviewer_user_id"
      - from: PASSED
        to: STALE
        trigger: "POST /owners/{id}/financial-profile on application.owner_id (cross-entity cascade)"
        actor: system
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.financial_review_status == PASSED"
        side_effects:
          - "capacity_score_at_review and capacity_band_at_review keep their stale snapshot values so the divergence is observable"
      - from: STALE
        to: PASSED
        trigger: "POST /applications/{id}/financial-review re-run on the updated profile with a band != INSUFFICIENT"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "re-snapshots the capacity fields"
      - from: STALE
        to: FAILED
        trigger: "POST /applications/{id}/financial-review re-run on the updated profile with a band == INSUFFICIENT"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "re-snapshots the capacity fields"

  - entity: Application
    dimension: impact_study_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: PRELIMINARY
        trigger: "POST /applications/{id}/impact-analysis"
        actor: BrandStandardsDirector
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "computes preliminary_impact_score and impact_unit_count_preliminary under variant PRELIMINARY"
          - "sets claim_window_closes_at to logical_now + CLAIM_WINDOW_DAYS days"
      - from: PRELIMINARY
        to: PRELIMINARY
        trigger: "POST /applications/{id}/impact-analysis re-run"
        actor: BrandStandardsDirector
        preconditions:
          - "application.status == UNDER_REVIEW"
        side_effects:
          - "recomputes preliminary_impact_score and impact_unit_count_preliminary against the current unit population"
          - "moves claim_window_closes_at forward to logical_now + CLAIM_WINDOW_DAYS days"
      - from: PRELIMINARY
        to: FINAL
        trigger: "POST /applications/{id}/finalize-impact"
        actor: BrandStandardsDirector
        preconditions:
          - "application.status == UNDER_REVIEW"
          - "application.impact_study_status == PRELIMINARY"
        side_effects:
          - "computes base_impact_score and impact_unit_count_final under variant FINAL"
          - "computes final_impact_score = min(100.00, base_impact_score + CLAIM_PENALTY_POINTS * sustained_claim_count)"
          - "sets encroachment_verdict from the ENCROACHMENT thresholds"
      - from: FINAL
        to: PRELIMINARY
        trigger: "POST /encroachment-claims/{id}/resolve with outcome == SUSTAIN (cross-entity cascade)"
        actor: system
        preconditions:
          - "the resolved claim's application_id == this application's id"
          - "application.impact_study_status == FINAL"
        side_effects:
          - "nulls base_impact_score, final_impact_score, impact_unit_count_final and encroachment_verdict; the study must be finalized again"
        note: "This is step 2 of the sustained-claim cascade; step 3 voids the application's DRAFT agreements."

  - entity: EncroachmentClaim
    dimension: status
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /encroachment-claims/{id}/resolve with outcome == SUSTAIN"
        actor: BrandStandardsDirector
        preconditions:
          - "claim.status == FILED"
        side_effects:
          - "sets penalty_points_applied to CLAIM_PENALTY_POINTS"
          - "increments Application.sustained_claim_count by 1"
          - "if the application's impact_study_status == FINAL, knocks it back to PRELIMINARY and nulls its final scores and verdict"
          - "every LicenseAgreement whose application_id == the claim's application_id and whose status == DRAFT becomes VOIDED"
      - from: FILED
        to: OVERRULED
        trigger: "POST /encroachment-claims/{id}/resolve with outcome == OVERRULE"
        actor: BrandStandardsDirector
        preconditions:
          - "claim.status == FILED"
        side_effects:
          - "penalty_points_applied stays 0.00"
          - "no change to the application's scores, verdict or study status"
          - "no agreement is voided"
        note: "The two branches share a trigger endpoint and diverge in every side effect."

  - entity: LicenseAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, VOIDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /agreements/{id}/execute"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == DRAFT"
          - "application.status == APPROVED"
          - "application.financial_review_status == PASSED"
          - "the Owner's LIVE capacity band under application.capacity_basis (capacity_band_standalone when the basis is STANDALONE, capacity_band_portfolio_adjusted when it is PORTFOLIO_ADJUSTED) != INSUFFICIENT; execution re-reads the owner's current band rather than the frozen capacity_band_at_review snapshot, so a profile that decayed after approval blocks execution"
          - "the request body's expected_application_version equals the current Application.version"
        side_effects:
          - "sets executed_at to logical_now"
          - "increments Application.version by 1"
          - "sets Owner.status to ACTIVE when it was PROSPECT"
      - from: EXECUTED
        to: OPEN
        trigger: "POST /agreements/{id}/open"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == EXECUTED"
          - "a PropertyImprovementPlan exists on this agreement and its status IN {ACCEPTED, IN_PROGRESS, COMPLETED}"
          - "every PipItem of that plan whose category == LIFE_SAFETY has status VERIFIED"
          - "every PipItem of that plan whose priority == CRITICAL has status VERIFIED"
          - "agreement.training_status == COMPLETED"
          - "agreement.systems_status == VALIDATED"
          - "agreement.channel_status == CONNECTED"
        side_effects:
          - "sets opened_at to logical_now"
      - from: OPEN
        to: TERMINATION_PENDING
        trigger: "POST /agreements/{id}/terminate"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == OPEN"
          - "if cause IN {FOR_CAUSE_QA, FOR_CAUSE_PIP} then compliance_status IN {DEFAULT_NOTICE, TERMINATION_ELIGIBLE}"
          - "if cause == FOR_CAUSE_QA then compliance_status == TERMINATION_ELIGIBLE"
        side_effects:
          - "sets termination_cause, terminated_at, liquidated_damages_formula"
          - "computes trailing_avg_monthly_fee, remaining_term_months_at_termination and liquidated_damages_amount"
          - "sets de_identification_status to PENDING and de_identification_deadline to terminated_at + DE_IDENTIFICATION_DAYS days"
          - "sets post_termination_status to OPEN"
          - "sets channel_status to SUSPENDED when it was CONNECTED"
          - "sets the agreement's PropertyImprovementPlan status to SUSPENDED when that plan's status IN {ACCEPTED, IN_PROGRESS, DEFAULTED}"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "POST /agreements/{id}/close-out"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == TERMINATION_PENDING"
          - "de_identification_status IN {SUBMITTED, BREACHED}"
          - "the request body's de_identification_verified == true"
          - "the request body's liquidated_damages_settlement_amount >= liquidated_damages_amount + de_identification_breach_penalty"
        side_effects:
          - "sets de_identification_status to VERIFIED"
          - "sets post_termination_status to CLOSED"
          - "sets liquidated_damages_paid_amount and closed_out_at"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /encroachment-claims/{id}/resolve with outcome == SUSTAIN on the parent application (cross-entity cascade)"
        actor: system
        preconditions:
          - "agreement.status == DRAFT"
          - "the resolved claim's application_id == agreement.application_id"
        side_effects:
          - "the agreement can never be executed; a fresh draft must be created after the impact study is finalized again"
        note: "Conditional cascade: EXECUTED, OPEN and TERMINATED agreements are untouched by a sustained claim."

  - entity: LicenseAgreement
    dimension: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: CURE_PERIOD
        trigger: "POST /agreements/{id}/qa-inspections producing grade IN {CONDITIONAL, FAIL}"
        actor: system
        preconditions:
          - "agreement.status == OPEN"
        side_effects:
          - "the inspection is created with status CURE_PENDING and a cure_deadline"
      - from: CURE_PERIOD
        to: COMPLIANT
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == PASS"
        actor: QaInspector
        preconditions:
          - "inspection.status == CURE_SUBMITTED"
        side_effects:
          - "resets consecutive_qa_failure_count to 0"
          - "restores channel_status to CONNECTED when it was SUSPENDED"
        note: "Compensation: the passed cure reverses every side effect the failed cure applied."
      - from: CURE_PERIOD
        to: DEFAULT_NOTICE
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == FAIL, leaving consecutive_qa_failure_count < QA_FAILURE_TERMINATION_THRESHOLD"
        actor: QaInspector
        preconditions:
          - "inspection.status == CURE_SUBMITTED"
        side_effects:
          - "increments consecutive_qa_failure_count by 1"
          - "sets default_notice_issued_at to logical_now and leaves pip_cure_deadline null"
          - "sets transfer_consent_blocked to true"
          - "sets channel_status to SUSPENDED when it was CONNECTED"
      - from: CURE_PERIOD
        to: TERMINATION_ELIGIBLE
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == FAIL, bringing consecutive_qa_failure_count to QA_FAILURE_TERMINATION_THRESHOLD"
        actor: QaInspector
        preconditions:
          - "inspection.status == CURE_SUBMITTED"
        side_effects:
          - "increments consecutive_qa_failure_count to QA_FAILURE_TERMINATION_THRESHOLD"
          - "sets transfer_consent_blocked to true"
          - "sets channel_status to SUSPENDED when it was CONNECTED"
          - "unlocks POST /agreements/{id}/terminate with cause FOR_CAUSE_QA"
      - from: DEFAULT_NOTICE
        to: CURE_PERIOD
        trigger: "POST /agreements/{id}/qa-inspections producing grade IN {CONDITIONAL, FAIL}"
        actor: system
        preconditions:
          - "agreement.status == OPEN"
        side_effects:
          - "the new inspection opens a fresh cure window; consecutive_qa_failure_count is unchanged"
      - from: COMPLIANT
        to: DEFAULT_NOTICE
        trigger: "POST /pips/{id}/compliance-sweep that defaults the plan"
        actor: system
        preconditions:
          - "the swept plan's agreement_id == this agreement's id"
          - "the sweep moved at least one PipItem of priority CRITICAL or category LIFE_SAFETY to OVERDUE"
        side_effects:
          - "sets default_notice_issued_at to logical_now and pip_cure_deadline to default_notice_issued_at + PIP_DEFAULT_CURE_DAYS days"
          - "sets transfer_consent_blocked to true"
          - "every TransferRequest on this agreement whose status == SUBMITTED becomes REFUSED with refusal_reason DEFAULT_NOTICE"
      - from: CURE_PERIOD
        to: DEFAULT_NOTICE
        trigger: "POST /pips/{id}/compliance-sweep that defaults the plan"
        actor: system
        preconditions:
          - "the swept plan's agreement_id == this agreement's id"
          - "the sweep moved at least one PipItem of priority CRITICAL or category LIFE_SAFETY to OVERDUE"
        side_effects:
          - "sets default_notice_issued_at and pip_cure_deadline"
          - "sets transfer_consent_blocked to true"
          - "every TransferRequest on this agreement whose status == SUBMITTED becomes REFUSED with refusal_reason DEFAULT_NOTICE"

  - entity: LicenseAgreement
    dimension: training_status
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: COMPLETED
        trigger: "POST /agreements/{id}/onboarding-milestone with track == TRAINING and to_status == COMPLETED"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == EXECUTED"
        side_effects:
          - "unblocks the SYSTEMS track's first rung"

  - entity: LicenseAgreement
    dimension: systems_status
    initial_state: NOT_STARTED
    terminal_states: [VALIDATED]
    transitions:
      - from: NOT_STARTED
        to: PROVISIONED
        trigger: "POST /agreements/{id}/onboarding-milestone with track == SYSTEMS and to_status == PROVISIONED"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.training_status == COMPLETED"
        side_effects: []
      - from: PROVISIONED
        to: VALIDATED
        trigger: "POST /agreements/{id}/onboarding-milestone with track == SYSTEMS and to_status == VALIDATED"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.systems_status == PROVISIONED"
        side_effects: []
        note: "Skipping a rung (NOT_STARTED -> VALIDATED) is rejected with ERR_ONBOARDING_SEQUENCE_INVALID."

  - entity: LicenseAgreement
    dimension: channel_status
    initial_state: NOT_CONNECTED
    terminal_states: []
    transitions:
      - from: NOT_CONNECTED
        to: TESTING
        trigger: "POST /agreements/{id}/onboarding-milestone with track == CHANNEL and to_status == TESTING"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.systems_status == VALIDATED"
        side_effects: []
      - from: TESTING
        to: CONNECTED
        trigger: "POST /agreements/{id}/onboarding-milestone with track == CHANNEL and to_status == CONNECTED"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "agreement.status == EXECUTED"
          - "agreement.channel_status == TESTING"
        side_effects: []
      - from: CONNECTED
        to: SUSPENDED
        trigger: "a failed cure review, or POST /agreements/{id}/terminate (cross-entity cascade)"
        actor: system
        preconditions:
          - "agreement.channel_status == CONNECTED"
        side_effects:
          - "the hotel stops receiving brand-channel reservations"
      - from: SUSPENDED
        to: CONNECTED
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == PASS"
        actor: system
        preconditions:
          - "agreement.channel_status == SUSPENDED"
          - "agreement.status == OPEN"
        side_effects: []
        note: "The suspend/restore pair is the compensation axis of the QA cascade."

  - entity: LicenseAgreement
    dimension: de_identification_status
    initial_state: NOT_REQUIRED
    terminal_states: [VERIFIED]
    transitions:
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "POST /agreements/{id}/terminate"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == OPEN"
        side_effects:
          - "sets de_identification_deadline to terminated_at + DE_IDENTIFICATION_DAYS days"
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /agreements/{id}/de-identification filed at or before de_identification_deadline with every required item"
        actor: Owner
        preconditions:
          - "agreement.status == TERMINATION_PENDING"
          - "the items_completed array contains all five of {SIGNAGE, INTERIOR_BRANDING, DIGITAL_LISTINGS, LINENS_AND_COLLATERAL, RESERVATION_CODES}"
          - "logical_now <= de_identification_deadline"
        side_effects:
          - "stores de_identification_items_completed"
          - "de_identification_breach_penalty stays 0.00"
      - from: PENDING
        to: BREACHED
        trigger: "POST /agreements/{id}/de-identification filed after de_identification_deadline with every required item"
        actor: Owner
        preconditions:
          - "agreement.status == TERMINATION_PENDING"
          - "the items_completed array contains all five required item codes"
          - "logical_now > de_identification_deadline"
        side_effects:
          - "stores de_identification_items_completed"
          - "sets de_identification_breach_penalty to DE_IDENTIFICATION_BREACH_PENALTY, which raises the close-out settlement floor"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /agreements/{id}/close-out"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == TERMINATION_PENDING"
          - "the settlement amount clears liquidated_damages_amount + de_identification_breach_penalty"
        side_effects:
          - "sets post_termination_status to CLOSED"
      - from: BREACHED
        to: VERIFIED
        trigger: "POST /agreements/{id}/close-out"
        actor: BrandStandardsDirector
        preconditions:
          - "agreement.status == TERMINATION_PENDING"
          - "the settlement amount clears liquidated_damages_amount + DE_IDENTIFICATION_BREACH_PENALTY"
        side_effects:
          - "sets post_termination_status to CLOSED"

  - entity: PropertyImprovementPlan
    dimension: status
    initial_state: SCOPED
    terminal_states: [COMPLETED, SUSPENDED]
    transitions:
      - from: SCOPED
        to: ACCEPTED
        trigger: "POST /pips/{id}/accept"
        actor: Owner
        preconditions:
          - "pip.status == SCOPED"
          - "pip.items_total_count >= 1"
          - "agreement.status == EXECUTED"
          - "X-User-ID == the Owner.id of the agreement's application"
        side_effects:
          - "sets accepted_at to logical_now"
          - "computes base_due_date and due_date on every PipItem of the plan"
          - "computes cost_per_room, key_money_pct, franchisor_key_money, owner_net_cost, owner_net_cost_per_room, escalation_required"
          - "sets overall_deadline to the maximum item due_date"
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /pip-items/{id}/complete on the plan's first item"
        actor: Owner
        preconditions:
          - "pip.status == ACCEPTED"
        side_effects:
          - "items_pending_count decreases by 1 and items_submitted_count increases by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pip-items/{id}/verify with outcome == VERIFY on the plan's last unverified item"
        actor: BrandStandardsDirector
        preconditions:
          - "pip.status == IN_PROGRESS"
          - "after this verification items_verified_count == items_total_count"
        side_effects:
          - "bubble-up: the plan auto-transitions without its own endpoint call"
      - from: ACCEPTED
        to: DEFAULTED
        trigger: "POST /pips/{id}/compliance-sweep"
        actor: BrandStandardsDirector
        preconditions:
          - "pip.status == ACCEPTED"
          - "the sweep moved at least one PipItem of priority CRITICAL or category LIFE_SAFETY to OVERDUE"
        side_effects:
          - "raises DEFAULT_NOTICE on the agreement's compliance_status"
      - from: IN_PROGRESS
        to: DEFAULTED
        trigger: "POST /pips/{id}/compliance-sweep"
        actor: BrandStandardsDirector
        preconditions:
          - "pip.status == IN_PROGRESS"
          - "the sweep moved at least one PipItem of priority CRITICAL or category LIFE_SAFETY to OVERDUE"
        side_effects:
          - "raises DEFAULT_NOTICE on the agreement's compliance_status"
      - from: DEFAULTED
        to: IN_PROGRESS
        trigger: "POST /pip-items/{id}/extension-decision with outcome == GRANT that clears the last blocking overdue item"
        actor: BrandStandardsDirector
        preconditions:
          - "pip.status == DEFAULTED"
          - "after the grant, zero PipItem rows of this plan with priority CRITICAL or category LIFE_SAFETY have status OVERDUE"
        side_effects:
          - "the agreement's compliance_status is unchanged; the DEFAULT_NOTICE is cleared only by a QA cure or never"
        note: "Cyclic: a plan can default and recover more than once."
      - from: ACCEPTED
        to: SUSPENDED
        trigger: "POST /agreements/{id}/terminate"
        actor: system
        preconditions:
          - "the agreement's id == pip.agreement_id"
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /agreements/{id}/terminate"
        actor: system
        preconditions:
          - "the agreement's id == pip.agreement_id"
        side_effects: []
      - from: DEFAULTED
        to: SUSPENDED
        trigger: "POST /agreements/{id}/terminate"
        actor: system
        preconditions:
          - "the agreement's id == pip.agreement_id"
        side_effects: []

  - entity: PipItem
    dimension: status
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /pip-items/{id}/complete"
        actor: Owner
        preconditions:
          - "item.status == PENDING"
          - "pip.status IN {ACCEPTED, IN_PROGRESS}"
          - "logical_now <= item.due_date"
        side_effects:
          - "sets completion_evidence and completed_at"
          - "items_pending_count -= 1 and items_submitted_count += 1 on the plan"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /pip-items/{id}/verify with outcome == VERIFY"
        actor: BrandStandardsDirector
        preconditions:
          - "item.status == SUBMITTED"
        side_effects:
          - "sets verified_at"
          - "items_submitted_count -= 1 and items_verified_count += 1 on the plan"
          - "bubble-up: the plan becomes COMPLETED when items_verified_count == items_total_count"
      - from: SUBMITTED
        to: PENDING
        trigger: "POST /pip-items/{id}/verify with outcome == REJECT"
        actor: BrandStandardsDirector
        preconditions:
          - "item.status == SUBMITTED"
        side_effects:
          - "increments rejection_count by 1"
          - "items_submitted_count -= 1 and items_pending_count += 1 on the plan"
        note: "Compensating pair with the complete transition: the four status counters sum back to items_total_count."
      - from: PENDING
        to: OVERDUE
        trigger: "POST /pips/{id}/compliance-sweep"
        actor: BrandStandardsDirector
        preconditions:
          - "item.status == PENDING"
          - "logical_now > item.due_date"
        side_effects:
          - "sets overdue_at"
          - "items_pending_count -= 1 and items_overdue_count += 1 on the plan"
      - from: SUBMITTED
        to: OVERDUE
        trigger: "POST /pips/{id}/compliance-sweep"
        actor: BrandStandardsDirector
        preconditions:
          - "item.status == SUBMITTED"
          - "logical_now > item.due_date"
        side_effects:
          - "sets overdue_at"
          - "items_submitted_count -= 1 and items_overdue_count += 1 on the plan"
      - from: OVERDUE
        to: PENDING
        trigger: "POST /pip-items/{id}/extension-decision with outcome == GRANT"
        actor: BrandStandardsDirector
        preconditions:
          - "item.status == OVERDUE"
          - "item.extension_status == PENDING"
          - "the recomputed due_date after the grant is >= logical_now"
        side_effects:
          - "items_overdue_count -= 1 and items_pending_count += 1 on the plan"
          - "recomputes due_date and the plan's overall_deadline"
        note: "Cyclic: the same item can go overdue again after the extended due_date passes."

  - entity: PipItem
    dimension: extension_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /pip-items/{id}/extension-request"
        actor: Owner
        preconditions:
          - "item.status IN {PENDING, SUBMITTED, OVERDUE}"
          - "item.category != LIFE_SAFETY"
          - "item.extension_request_count < MAX_EXTENSION_REQUESTS_PER_ITEM"
          - "item.status != OVERDUE OR the plan's status == DEFAULTED"
        side_effects:
          - "increments extension_request_count by 1 and stores extension_requested_days and extension_reason"
      - from: PENDING
        to: GRANTED
        trigger: "POST /pip-items/{id}/extension-decision with outcome == GRANT"
        actor: BrandStandardsDirector
        preconditions:
          - "item.extension_status == PENDING"
        side_effects:
          - "adds the granted day count to extension_granted_days_total, subject to the per-item and plan-pool caps"
          - "recomputes due_date and the plan's overall_deadline and extension_granted_days_total"
      - from: PENDING
        to: DENIED
        trigger: "POST /pip-items/{id}/extension-decision with outcome == DENY"
        actor: BrandStandardsDirector
        preconditions:
          - "item.extension_status == PENDING"
        side_effects:
          - "due_date is unchanged"
      - from: GRANTED
        to: PENDING
        trigger: "POST /pip-items/{id}/extension-request filed a second time"
        actor: Owner
        preconditions:
          - "item.extension_request_count < MAX_EXTENSION_REQUESTS_PER_ITEM"
        side_effects:
          - "increments extension_request_count by 1"
      - from: DENIED
        to: PENDING
        trigger: "POST /pip-items/{id}/extension-request filed a second time"
        actor: Owner
        preconditions:
          - "item.extension_request_count < MAX_EXTENSION_REQUESTS_PER_ITEM"
        side_effects:
          - "increments extension_request_count by 1"

  - entity: QaInspection
    dimension: status
    initial_state: CURE_PENDING
    terminal_states: [CLOSED, CURE_PASSED, CURE_FAILED]
    transitions:
      - from: CURE_PENDING
        to: CURE_SUBMITTED
        trigger: "POST /qa-inspections/{id}/cure-submission"
        actor: Owner
        preconditions:
          - "inspection.status == CURE_PENDING"
          - "logical_now <= inspection.cure_deadline"
        side_effects:
          - "sets cure_evidence and cure_submitted_at"
      - from: CURE_SUBMITTED
        to: CURE_PASSED
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == PASS"
        actor: QaInspector
        preconditions:
          - "inspection.status == CURE_SUBMITTED"
          - "X-User-ID != inspection.inspector_user_id"
        side_effects:
          - "agreement.compliance_status returns to COMPLIANT and consecutive_qa_failure_count resets to 0"
          - "agreement.channel_status returns to CONNECTED when it was SUSPENDED"
      - from: CURE_SUBMITTED
        to: CURE_FAILED
        trigger: "POST /qa-inspections/{id}/cure-review with outcome == FAIL"
        actor: QaInspector
        preconditions:
          - "inspection.status == CURE_SUBMITTED"
          - "X-User-ID != inspection.inspector_user_id"
        side_effects:
          - "increments agreement.consecutive_qa_failure_count by 1"
          - "agreement.compliance_status becomes DEFAULT_NOTICE, or TERMINATION_ELIGIBLE at the QA_FAILURE_TERMINATION_THRESHOLD-th consecutive failure"
          - "agreement.channel_status becomes SUSPENDED when it was CONNECTED"
          - "agreement.transfer_consent_blocked becomes true"
    note: "An inspection graded PASS is created directly in the terminal state CLOSED with a null cure_deadline; grades CONDITIONAL and FAIL are created in CURE_PENDING."

  - entity: TransferRequest
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [CONSENTED, REFUSED]
    transitions:
      - from: SUBMITTED
        to: CONSENTED
        trigger: "POST /transfer-requests/{id}/decide with outcome == CONSENT"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "request.status == SUBMITTED"
          - "agreement.transfer_consent_blocked == false"
          - "request.request_type == REFINANCE OR request.proposed_owner_capacity_band != INSUFFICIENT"
          - "the request body's expected_agreement_version equals the current LicenseAgreement.version"
        side_effects:
          - "increments LicenseAgreement.version by 1"
          - "increments LicenseAgreement.transfer_consent_count by 1"
          - "sets decision_user_id, decided_at, decision_notes"
      - from: SUBMITTED
        to: REFUSED
        trigger: "POST /transfer-requests/{id}/decide with outcome == REFUSE"
        actor: FranchiseDevelopmentManager
        preconditions:
          - "request.status == SUBMITTED"
          - "the request body's expected_agreement_version equals the current LicenseAgreement.version"
        side_effects:
          - "increments LicenseAgreement.version by 1"
          - "sets refusal_reason to DISCRETION, plus decision_user_id, decided_at, decision_notes"
      - from: SUBMITTED
        to: REFUSED
        trigger: "POST /pips/{id}/compliance-sweep that raises DEFAULT_NOTICE on the agreement (cross-entity cascade)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
          - "request.agreement_id == the defaulted plan's agreement_id"
        side_effects:
          - "sets refusal_reason to DEFAULT_NOTICE and decided_at to logical_now; decision_user_id stays null"

  - entity: ExistingUnit
    dimension: status
    initial_state: OPERATING
    terminal_states: [TERMINATED]
    transitions:
      - from: OPERATING
        to: SUSPENDED
        trigger: "POST /existing-units/{id}/status with to_status == SUSPENDED"
        actor: BrandStandardsDirector
        preconditions:
          - "unit.status == OPERATING"
        side_effects:
          - "decrements Brand.operating_unit_count by 1"
          - "the unit leaves the PRELIMINARY impact input set but stays in the FINAL input set"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /existing-units/{id}/status with to_status == OPERATING"
        actor: BrandStandardsDirector
        preconditions:
          - "unit.status == SUSPENDED"
        side_effects:
          - "increments Brand.operating_unit_count by 1"
      - from: OPERATING
        to: TERMINATED
        trigger: "POST /existing-units/{id}/status with to_status == TERMINATED"
        actor: BrandStandardsDirector
        preconditions:
          - "unit.status == OPERATING"
        side_effects:
          - "decrements Brand.operating_unit_count by 1"
          - "the unit leaves both impact input sets and can no longer file an encroachment claim"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /existing-units/{id}/status with to_status == TERMINATED"
        actor: BrandStandardsDirector
        preconditions:
          - "unit.status == SUSPENDED"
        side_effects:
          - "the unit leaves both impact input sets"

  - entity: Owner
    dimension: status
    initial_state: PROSPECT
    terminal_states: [ACTIVE]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /agreements/{id}/execute on an agreement whose application.owner_id == this owner (cross-entity cascade)"
        actor: system
        preconditions:
          - "owner.status == PROSPECT"
        side_effects:
          - "the owner is now a franchisee of record"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-execute-stale-application
    parent_entity: Application
    write_endpoint: "POST /agreements/{id}/execute"
    occ_field: "expected_application_version"
    description: |
      Executing a LicenseAgreement whose parent Application has advanced past the version the
      client last read is rejected. Several agreements may legitimately be drafted from one
      approved application and any of them may legitimately be the one that gets executed, so a
      writer holding a stale view of the application must be turned away rather than allowed to
      execute against a superseded understanding of the approval, the capacity snapshot or the
      derived license terms.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: transfer-decide-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /transfer-requests/{id}/decide"
    occ_field: "expected_agreement_version"
    description: |
      Deciding a TransferRequest against a LicenseAgreement whose version has advanced since the
      client last read it is rejected. An agreement may legitimately carry several open consent
      requests of different types and consenting to one changes the ownership picture the others
      were assessed against, so a decision carrying a stale agreement version is refused.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# Every money and score value is a Decimal. Every `round(x, n)` below means
# ROUND_HALF_UP to n decimal places. Where a formula pins an evaluation or
# accumulation order, that order is normative and observable.
# =============================================================================
calculations:
  - name: owner_capacity_score
    trigger: "On POST /owners (both variants computed at create), on every POST /owners/{id}/financial-profile, and read as a snapshot by POST /applications/{id}/financial-review and POST /agreements/{id}/transfer-requests."
    algorithm: weighted_scoring
    formula: |
      # --- component 1: liquidity, the only component that differs between variants
      liquid_effective =
          STANDALONE          -> owner.liquid_assets_amount
          PORTFOLIO_ADJUSTED  -> max(0.00, owner.liquid_assets_amount
                                            - EXISTING_UNIT_RESERVE * owner.existing_units_count)
      liquidity_component = min(100.00, round(liquid_effective / LIQUIDITY_BENCHMARK * 100, 2))

      # --- component 2: balance sheet
      net_worth_component = min(100.00, round(owner.net_worth_amount / NET_WORTH_BENCHMARK * 100, 2))

      # --- component 3: credit
      credit_component = min(100.00, max(0.00,
                             round((owner.credit_score - CREDIT_FLOOR) / CREDIT_SPAN * 100, 2)))

      # --- weighted roll-up: each component is rounded to 2dp FIRST, then weighted, then the
      #     weighted sum is rounded once. This order is normative.
      weighted_subtotal = round(  liquidity_component  * W_LIQUIDITY
                                + net_worth_component  * W_NET_WORTH
                                + credit_component     * W_CREDIT , 2)

      experience_bonus =
          STANDALONE          -> 0.00
          PORTFOLIO_ADJUSTED  -> round(PORTFOLIO_EXPERIENCE_POINTS
                                        * min(owner.existing_units_count, EXPERIENCE_CAP_UNITS), 2)

      capacity_score = min(100.00, round(weighted_subtotal + experience_bonus, 2))

      capacity_band = STRONG      if capacity_score >= CAPACITY_BAND_STRONG
                      ADEQUATE    if capacity_score >= CAPACITY_BAND_ADEQUATE
                      INSUFFICIENT otherwise
    input_set: "A single Owner row. No other entity participates; the score is a pure function of the owner's five financial input fields and the variant."
    constants:
      LIQUIDITY_BENCHMARK: 5000000.00
      NET_WORTH_BENCHMARK: 15000000.00
      CREDIT_FLOOR: 500
      CREDIT_SPAN: 300
      EXISTING_UNIT_RESERVE: 250000.00
      PORTFOLIO_EXPERIENCE_POINTS: 1.5
      EXPERIENCE_CAP_UNITS: 5
      W_LIQUIDITY: 0.45
      W_NET_WORTH: 0.30
      W_CREDIT: 0.25
      CAPACITY_BAND_STRONG: 75.00
      CAPACITY_BAND_ADEQUATE: 55.00
    precision: "2 decimal places, round_half_up; components rounded before weighting, weighted sum rounded once, bonus added after."
    variants:
      - name: STANDALONE
        when: "The application's financial review was taken with capacity_basis == STANDALONE, and always for TransferRequest transferee screening."
        difference: "Liquidity is measured on gross liquid assets and no portfolio experience bonus is granted."
      - name: PORTFOLIO_ADJUSTED
        when: "The application's financial review was taken with capacity_basis == PORTFOLIO_ADJUSTED."
        difference: "Liquidity is reduced by EXISTING_UNIT_RESERVE for every hotel the owner already operates, and a capped experience bonus of PORTFOLIO_EXPERIENCE_POINTS per existing unit is added after the weighted roll-up. For a multi-unit owner with thin liquidity the reserve deduction dominates and the adjusted score is LOWER; for a liquid multi-unit owner the bonus dominates and the adjusted score is HIGHER. The two variants therefore diverge in both directions on the same row."

  - name: market_impact_score
    trigger: "POST /applications/{id}/impact-analysis computes the PRELIMINARY variant; POST /applications/{id}/finalize-impact computes the FINAL variant and the sustained-claim penalty on top of it."
    algorithm: threshold
    formula: |
      distance_miles(unit) = round(sqrt( (unit.x_miles - application.property_x_miles)^2
                                       + (unit.y_miles - application.property_y_miles)^2 ), 2)

      # a unit is IN the input set when distance_miles <= brand.protected_radius_miles
      # (the comparison is inclusive: a unit sitting exactly on the radius is inside the set
      #  and contributes exactly 0.00 points)
      proximity_factor(unit) = round((brand.protected_radius_miles - distance_miles(unit))
                                      / brand.protected_radius_miles, 4)
      room_share(unit)       = round(application.room_count
                                      / (application.room_count + unit.room_count), 4)
      contribution(unit)     = round(IMPACT_SCALE_POINTS * proximity_factor(unit) * room_share(unit), 2)

      # contributions are rounded per unit and then summed, in ascending unit created_at order
      raw_score = round(sum of contribution(unit) over the input set, 2)
      score     = min(100.00, raw_score)

      # PRELIMINARY stops here and stores score into preliminary_impact_score.
      # FINAL stores score into base_impact_score and then applies the claim penalty:
      final_impact_score = min(100.00, round(base_impact_score
                                 + CLAIM_PENALTY_POINTS * application.sustained_claim_count, 2))

      encroachment_verdict = ENCROACHMENT_CONFIRMED if final_impact_score >= ENCROACHMENT_CONFIRMED_THRESHOLD
                             MITIGATION_REQUIRED    if final_impact_score >= MITIGATION_THRESHOLD
                             CLEAR                  otherwise
    input_set: "ExistingUnit rows whose brand_id == application.brand_id and whose distance_miles <= brand.protected_radius_miles, filtered by status: the PRELIMINARY variant admits only status == OPERATING; the FINAL variant admits status IN {OPERATING, SUSPENDED}. status == TERMINATED units are in neither set. An empty input set yields score 0.00 and unit count 0, never null."
    constants:
      IMPACT_SCALE_POINTS: 100.00
      CLAIM_PENALTY_POINTS: 7.50
      ENCROACHMENT_CONFIRMED_THRESHOLD: 25.00
      MITIGATION_THRESHOLD: 12.00
      CLAIM_WINDOW_DAYS: 21
    precision: "distance and score to 2 decimal places, round_half_up; proximity_factor and room_share to 4 decimal places, round_half_up; contributions rounded per unit before summation."
    variants:
      - name: PRELIMINARY
        when: "POST /applications/{id}/impact-analysis, while impact_study_status is NOT_STARTED or PRELIMINARY."
        difference: "Only OPERATING units are counted, on the theory that a suspended hotel is not currently taking share. The score is systematically lower and the unit count smaller than under FINAL."
      - name: FINAL
        when: "POST /applications/{id}/finalize-impact, moving impact_study_status to FINAL."
        difference: "SUSPENDED units re-enter the input set, on the theory that a suspended hotel may reopen inside the term, and the sustained-claim penalty is added afterwards. Identical unit population therefore yields a strictly greater-or-equal score than PRELIMINARY, and only the FINAL score feeds the verdict and the marketing-fund surcharge."

  - name: license_terms_derivation
    trigger: "POST /applications/{id}/agreements, once, at draft time. The three derived terms are then frozen on the LicenseAgreement for its whole life."
    algorithm: threshold
    formula: |
      conversion_adjustment_pct = CONVERSION_ADJUSTMENT[application.current_affiliation]

      capacity_discount_pct =
          CAPACITY_DISCOUNT_DEEP  if application.capacity_band_at_review == STRONG
                                     AND owner.existing_units_count >= PORTFOLIO_DISCOUNT_UNITS
          CAPACITY_DISCOUNT_BASE  if application.capacity_band_at_review == STRONG
          0.00                    otherwise

      # nested min/max clamp over three independent inputs: brand rate card, conversion origin,
      # and owner strength. Evaluate the inner max first, then the outer min.
      royalty_rate_pct = round( min( BRAND_MAX_ROYALTY,
                                     max( BRAND_MIN_ROYALTY,
                                          brand.base_royalty_rate_pct
                                          + conversion_adjustment_pct
                                          - capacity_discount_pct ) ), 2)

      impact_surcharge_pct = MARKETING_IMPACT_SURCHARGE
                               if application.final_impact_score >= MITIGATION_THRESHOLD
                             else 0.00
      marketing_fund_rate_pct = round( min( MARKETING_FUND_CEILING,
                                            brand.marketing_fund_rate_pct + impact_surcharge_pct ), 2)

      term_years = min( brand.standard_term_years,
                        max( TERM_FLOOR_YEARS, application.requested_term_years ) )

      expiry_date = effective_date advanced by term_years calendar years, keeping month and day
    input_set: "One Application (its current_affiliation, capacity_band_at_review, final_impact_score, requested_term_years), the Brand it names (rate card, standard term), and the Owner it names (existing_units_count)."
    constants:
      CONVERSION_ADJUSTMENT: { COMPETITOR: 0.75, INDEPENDENT: 0.25, OUR_BRAND: 0.00 }
      CAPACITY_DISCOUNT_DEEP: 0.50
      CAPACITY_DISCOUNT_BASE: 0.25
      PORTFOLIO_DISCOUNT_UNITS: 3
      BRAND_MAX_ROYALTY: 7.00
      BRAND_MIN_ROYALTY: 3.50
      MARKETING_IMPACT_SURCHARGE: 0.50
      MARKETING_FUND_CEILING: 3.00
      MITIGATION_THRESHOLD: 12.00
      TERM_FLOOR_YEARS: 15
    precision: "rates to 2 decimal places, round_half_up; term_years is an integer with no rounding."

  - name: monthly_fee_assessment
    trigger: "POST /agreements/{id}/revenue-reports, once per reported period. A correction supersedes the prior entry for the same period_month and re-derives every ledger total from the surviving entries."
    algorithm: tiered_pricing
    formula: |
      r = agreement.royalty_rate_pct
      m = agreement.marketing_fund_rate_pct
      g = gross_room_revenue

      tier1_base = min(g, TIER1_CAP)
      tier2_base = max(0.00, min(g, TIER2_CAP) - TIER1_CAP)
      tier3_base = max(0.00, g - TIER2_CAP)

      # PINNED ORDER: each tier slice is rounded to 2dp on its own, and the rounded slice
      # amounts are then added. Computing one rate against the whole revenue, or summing the
      # unrounded slice products and rounding once, are both wrong.
      royalty_fee = round(tier1_base * r / 100, 2)
                  + round(tier2_base * (r + TIER2_PREMIUM_PCT) / 100, 2)
                  + round(tier3_base * (r + TIER3_PREMIUM_PCT) / 100, 2)

      marketing_fee   = round(g * m / 100, 2)
      reservation_fee = round(g * RESERVATION_FEE_RATE_PCT / 100, 2)
      period_total_fee = royalty_fee + marketing_fee + reservation_fee

      # PINNED ACCUMULATION ORDER across periods: every ledger total is the sum of the
      # already-rounded per-period amounts, in ascending revenue_periods order, over entries
      # whose superseded == false. Re-deriving a total from unrounded period products and
      # rounding once at the end produces a different (wrong) marketing_fund_contributed_total.
      royalty_fee_to_date             = sum of royalty_fee     over surviving entries
      marketing_fund_contributed_total = sum of marketing_fee  over surviving entries
      reservation_fee_to_date         = sum of reservation_fee over surviving entries
      total_fees_assessed             = sum of period_total_fee over surviving entries
    input_set: "The LicenseAgreement's revenue_periods entries whose superseded == false, in ascending order of their position in the array."
    constants:
      TIER1_CAP: 200000.00
      TIER2_CAP: 500000.00
      TIER2_PREMIUM_PCT: 0.50
      TIER3_PREMIUM_PCT: 1.00
      RESERVATION_FEE_RATE_PCT: 1.75
    precision: "2 decimal places, round_half_up, applied per tier slice and per fee component; ledger totals are exact sums of already-rounded components and are never re-rounded."

  - name: liquidated_damages
    trigger: "POST /agreements/{id}/terminate, once, freezing liquidated_damages_amount on the agreement."
    algorithm: aggregation
    formula: |
      # basis: continuing fees only. Reservation channel fees are excluded from the basis.
      basis_sum = sum over surviving revenue_periods entries of (royalty_fee + marketing_fee)
      trailing_avg_monthly_fee = 0.00                                   if reported_period_count == 0
                                 round(basis_sum / reported_period_count, 2) otherwise

      remaining_term_months = max(0, (expiry_year * 12 + expiry_month)
                                    - (termination_year * 12 + termination_month))
      capped_months = min(remaining_term_months, agreement.liquidated_damages_cap_months)

      CONTRACTUAL_MULTIPLE:
        liquidated_damages_amount = round(trailing_avg_monthly_fee * capped_months, 2)

      DISCOUNTED_PV:
        liquidated_damages_amount =
            sum for k = 1 .. capped_months of
                round(trailing_avg_monthly_fee / (1 + DISCOUNT_RATE_MONTHLY)^k, 2)
        # each discounted month is rounded to 2dp before it enters the sum, in ascending k order
    input_set: "The terminating LicenseAgreement's surviving revenue_periods entries, its expiry_date, its liquidated_damages_cap_months, and the logical clock at termination."
    constants:
      DISCOUNT_RATE_MONTHLY: 0.0050
      LD_CAP_MONTHS: 36
    precision: "2 decimal places, round_half_up; the discounted variant rounds every monthly term before summation, in ascending k order."
    variants:
      - name: CONTRACTUAL_MULTIPLE
        when: "termination_cause IN {FOR_CAUSE_QA, FOR_CAUSE_PIP} — the franchisee's own default."
        difference: "The capped remaining months are charged at full face value with no time discount, which is strictly the larger of the two amounts for any positive month count."
      - name: DISCOUNTED_PV
        when: "termination_cause == MUTUAL — a negotiated exit."
        difference: "Each capped remaining month is discounted to present value at DISCOUNT_RATE_MONTHLY and rounded before summation, producing a materially smaller amount from identical fee history and identical remaining term."

  - name: qa_inspection_score
    trigger: "POST /agreements/{id}/qa-inspections, once per inspection."
    algorithm: weighted_scoring
    formula: |
      weighted_score = round(  cleanliness_score      * W_CLEANLINESS
                             + condition_score        * W_CONDITION
                             + brand_standard_score   * W_BRAND_STANDARD
                             + guest_experience_score * W_GUEST_EXPERIENCE , 2)

      total_score = round(max(0.00, weighted_score
                                    - CRITICAL_DEFECT_PENALTY_POINTS * critical_defect_count), 2)

      # the life-safety override outranks the score bands entirely
      grade = FAIL        if life_safety_defect == true
              PASS        if total_score >= QA_PASS_THRESHOLD
              CONDITIONAL if total_score >= QA_CONDITIONAL_THRESHOLD
              FAIL        otherwise

      cure_period_days = null                  if grade == PASS
                         CURE_DAYS_CONDITIONAL if grade == CONDITIONAL
                         CURE_DAYS_FAIL        if grade == FAIL
      cure_deadline = null if grade == PASS else inspection_at + cure_period_days days
    input_set: "The four section scores, the critical defect count and the life-safety flag of a single inspection. No other entity participates."
    constants:
      W_CLEANLINESS: 0.30
      W_CONDITION: 0.25
      W_BRAND_STANDARD: 0.30
      W_GUEST_EXPERIENCE: 0.15
      CRITICAL_DEFECT_PENALTY_POINTS: 5.00
      QA_PASS_THRESHOLD: 85.00
      QA_CONDITIONAL_THRESHOLD: 70.00
      CURE_DAYS_CONDITIONAL: 60
      CURE_DAYS_FAIL: 30
      QA_FAILURE_TERMINATION_THRESHOLD: 3
      MIN_INSPECTION_GAP_DAYS: 90
    precision: "2 decimal places, round_half_up; the weighted sum is rounded once before the critical-defect penalty is applied, and the penalised total is rounded again."

  - name: pip_cost_allocation
    trigger: "POST /pips/{id}/accept, once, freezing every cost field on the plan."
    algorithm: threshold
    formula: |
      total_estimated_cost = round(sum of estimated_cost over every PipItem of this plan, 2)

      # PINNED EVALUATION ORDER (this is the crux of the rule):
      #   1. cost_per_room is measured on the GROSS total.
      #   2. the key-money band is selected from that GROSS cost_per_room.
      #   3. key money is computed and capped.
      #   4. only then is the NET figure derived, and the escalation test is applied to the NET
      #      per-room figure.
      # Selecting the band from the NET per-room figure is circular and yields a different,
      # wrong band for exactly the inputs where the gross figure sits just above a band edge.
      cost_per_room = round(total_estimated_cost / application.room_count, 2)

      key_money_pct = KEY_MONEY_PCT_HIGH if cost_per_room >= KEY_MONEY_BAND_HIGH
                      KEY_MONEY_PCT_MID  if cost_per_room >= KEY_MONEY_BAND_MID
                      0                  otherwise

      franchisor_key_money = min(KEY_MONEY_CAP,
                                 round(total_estimated_cost * key_money_pct / 100, 2))

      owner_net_cost          = total_estimated_cost - franchisor_key_money
      owner_net_cost_per_room = round(owner_net_cost / application.room_count, 2)
      escalation_required     = owner_net_cost_per_room > COST_PER_ROOM_CEILING
    input_set: "Every PipItem row of the plan regardless of status, plus the room_count of the Application behind the plan's agreement."
    constants:
      KEY_MONEY_BAND_HIGH: 25000.00
      KEY_MONEY_BAND_MID: 12000.00
      KEY_MONEY_PCT_HIGH: 10
      KEY_MONEY_PCT_MID: 6
      KEY_MONEY_CAP: 250000.00
      COST_PER_ROOM_CEILING: 20000.00
    precision: "2 decimal places, round_half_up; the cap is applied after rounding the uncapped key-money product. Invariant: total_estimated_cost == owner_net_cost + franchisor_key_money exactly, with no rounding drift."

  - name: pip_item_deadline
    trigger: "POST /pips/{id}/accept sets every item's base_due_date and due_date; POST /pip-items/{id}/extension-decision with outcome GRANT recomputes due_date and the plan's overall_deadline."
    algorithm: threshold
    formula: |
      allowance_days = min(PRIORITY_DAYS[item.priority], CATEGORY_DAYS[item.category])
      base_due_date  = pip.accepted_at + allowance_days days
      due_date       = base_due_date + item.extension_granted_days_total days

      # a grant is clamped by three independent ceilings, evaluated as a nested min
      granted_days = max(0, min( requested_days,
                                 MAX_EXTENSION_DAYS_PER_ITEM - item.extension_granted_days_total,
                                 PIP_EXTENSION_POOL_DAYS - pip.extension_granted_days_total ))

      pip.overall_deadline = the maximum due_date over the plan's items
    input_set: "One PipItem, its plan's accepted_at and pooled granted days."
    constants:
      PRIORITY_DAYS: { CRITICAL: 90, MAJOR: 180, MINOR: 270 }
      CATEGORY_DAYS: { LIFE_SAFETY: 45, TECHNOLOGY: 120, FOOD_BEVERAGE: 180, GUESTROOM: 210, EXTERIOR: 240 }
      MAX_EXTENSION_DAYS_PER_ITEM: 60
      MAX_EXTENSION_REQUESTS_PER_ITEM: 2
      PIP_EXTENSION_POOL_DAYS: 120
      PIP_DEFAULT_CURE_DAYS: 30
      DE_IDENTIFICATION_DAYS: 30
      DE_IDENTIFICATION_BREACH_PENALTY: 50000.00
    precision: "whole days added to an ISO-8601 instant; the time-of-day of accepted_at is preserved exactly."

  - name: transfer_consent_fee
    trigger: "POST /agreements/{id}/transfer-requests, once, at submission."
    algorithm: tiered_pricing
    formula: |
      per_room_fee = round(application.room_count * TRANSFER_FEE_PER_ROOM, 2)
      base_fee     = max(TRANSFER_FEE_MIN, per_room_fee)

      transfer_fee = base_fee                                              if request_type == TRANSFER
                     round(base_fee * CHANGE_OF_CONTROL_FACTOR, 2)         if request_type == CHANGE_OF_CONTROL
                     REFINANCE_CONSENT_FEE                                 if request_type == REFINANCE

      non_compliance_surcharge = NON_COMPLIANCE_SURCHARGE
                                   if agreement.compliance_status != COMPLIANT else 0.00
      total_consent_fee = transfer_fee + non_compliance_surcharge
    input_set: "The request_type, the room_count of the Application behind the agreement, and the agreement's compliance_status at submission."
    constants:
      TRANSFER_FEE_MIN: 75000.00
      TRANSFER_FEE_PER_ROOM: 750.00
      CHANGE_OF_CONTROL_FACTOR: 0.50
      REFINANCE_CONSENT_FEE: 15000.00
      NON_COMPLIANCE_SURCHARGE: 25000.00
    precision: "2 decimal places, round_half_up."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of {FranchiseDevelopmentManager, BrandStandardsDirector, QaInspector, Owner}."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Every resource named in the path exists, validated left to right."
    error_id: ERR_BRAND_NOT_FOUND | ERR_OWNER_NOT_FOUND | ERR_EXISTING_UNIT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PIP_NOT_FOUND | ERR_PIP_ITEM_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_TRANSFER_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body names an existing row: owner_id and brand_id on application create, brand_id on unit create, existing_unit_id on claim create, proposed_owner_id on transfer create."
    error_id: ERR_OWNER_NOT_FOUND | ERR_BRAND_NOT_FOUND | ERR_EXISTING_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /applications, POST /existing-units, POST /applications/{id}/encroachment-claims, POST /agreements/{id}/transfer-requests"
  - priority: 6
    category: auth
    check: "When X-User-Role == Owner, X-User-ID equals the Owner.id that owns the addressed resource: application.owner_id for application actions, the owner behind agreement.application_id for agreement, PIP, PIP-item, inspection-cure and transfer actions."
    error_id: ERR_FORBIDDEN_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Owner and that addresses an existing resource"
  - priority: 7
    category: business_constraint
    check: "Request body shape: every required field present; every field of the declared JSON type; every enum value inside its declared set; every number inside its declared range and decimal width; every date and datetime a valid ISO-8601 value; unknown fields ignored. Pagination limit is an integer in 1..100 and offset an integer >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 8
    category: state
    check: "POST /applications/{id}/start-review requires status == SUBMITTED; financial-review, impact-analysis, finalize-impact, request-revision, decision and encroachment-claim filing require status == UNDER_REVIEW (claim filing also accepts APPROVED while the claim window is open); resubmit requires status == REVISION_REQUESTED; agreement drafting requires status == APPROVED."
    error_id: ERR_APPLICATION_STAGE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/* and POST /applications/{id}/agreements"
  - priority: 9
    category: state
    check: "POST /applications/{id}/finalize-impact requires impact_study_status == PRELIMINARY."
    error_id: ERR_IMPACT_STUDY_STAGE_INVALID
    http_status: 409
    applies_to: "POST /applications/{id}/finalize-impact"
  - priority: 10
    category: state
    check: "POST /agreements/{id}/execute requires agreement.status == DRAFT."
    error_id: ERR_AGREEMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /agreements/{id}/execute"
  - priority: 11
    category: state
    check: "POST /agreements/{id}/pips, POST /agreements/{id}/onboarding-milestone and POST /agreements/{id}/open require agreement.status == EXECUTED."
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /agreements/{id}/pips, POST /agreements/{id}/onboarding-milestone, POST /agreements/{id}/open"
  - priority: 12
    category: state
    check: "POST /agreements/{id}/revenue-reports, POST /agreements/{id}/qa-inspections and POST /agreements/{id}/terminate require agreement.status == OPEN; POST /agreements/{id}/transfer-requests requires agreement.status IN {EXECUTED, OPEN}, because an owner may seek consent to a refinancing or a change of control while the conversion is still under construction."
    error_id: ERR_AGREEMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/revenue-reports, POST /agreements/{id}/qa-inspections, POST /agreements/{id}/transfer-requests, POST /agreements/{id}/terminate"
  - priority: 13
    category: state
    check: "POST /agreements/{id}/de-identification and POST /agreements/{id}/close-out require agreement.status == TERMINATION_PENDING."
    error_id: ERR_AGREEMENT_NOT_TERMINATION_PENDING
    http_status: 409
    applies_to: "POST /agreements/{id}/de-identification, POST /agreements/{id}/close-out"
  - priority: 14
    category: state
    check: "POST /pips/{id}/items and POST /pips/{id}/accept require pip.status == SCOPED; POST /pips/{id}/compliance-sweep requires pip.status IN {ACCEPTED, IN_PROGRESS, DEFAULTED}."
    error_id: ERR_PIP_NOT_SCOPED
    http_status: 409
    applies_to: "POST /pips/{id}/items, POST /pips/{id}/accept, POST /pips/{id}/compliance-sweep"
  - priority: 15
    category: state
    check: "POST /pip-items/{id}/complete requires item.status == PENDING; POST /pip-items/{id}/verify requires item.status == SUBMITTED; POST /pip-items/{id}/extension-request requires item.status IN {PENDING, SUBMITTED, OVERDUE}."
    error_id: ERR_PIP_ITEM_STAGE_INVALID
    http_status: 409
    applies_to: "POST /pip-items/{id}/complete, POST /pip-items/{id}/verify, POST /pip-items/{id}/extension-request"
  - priority: 16
    category: state
    check: "POST /pip-items/{id}/extension-decision requires item.extension_status == PENDING."
    error_id: ERR_EXTENSION_NOT_PENDING
    http_status: 409
    applies_to: "POST /pip-items/{id}/extension-decision"
  - priority: 17
    category: state
    check: "POST /encroachment-claims/{id}/resolve requires claim.status == FILED."
    error_id: ERR_CLAIM_NOT_FILED
    http_status: 409
    applies_to: "POST /encroachment-claims/{id}/resolve"
  - priority: 18
    category: state
    check: "POST /qa-inspections/{id}/cure-submission requires inspection.status == CURE_PENDING; POST /qa-inspections/{id}/cure-review requires inspection.status == CURE_SUBMITTED."
    error_id: ERR_INSPECTION_STAGE_INVALID
    http_status: 409
    applies_to: "POST /qa-inspections/{id}/cure-submission, POST /qa-inspections/{id}/cure-review"
  - priority: 19
    category: state
    check: "POST /transfer-requests/{id}/decide requires request.status == SUBMITTED."
    error_id: ERR_TRANSFER_REQUEST_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/decide"
  - priority: 20
    category: state
    check: "POST /existing-units/{id}/status names a transition declared for the unit's current status: OPERATING -> {SUSPENDED, TERMINATED}, SUSPENDED -> {OPERATING, TERMINATED}, and nothing from TERMINATED."
    error_id: ERR_UNIT_STATUS_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /existing-units/{id}/status"
  - priority: 21
    category: state
    check: "The expected_<parent>_version supplied on an OCC-guarded write equals the current version of the parent entity named by the matching §1.2.1 concurrency rule."
    error_id: ERR_STALE_APPLICATION_VERSION | ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /agreements/{id}/execute, POST /transfer-requests/{id}/decide"
  - priority: 22
    category: business_safety
    check: "POST /agreements/{id}/open requires every PipItem of the agreement's plan whose category == LIFE_SAFETY to have status VERIFIED."
    error_id: ERR_LIFE_SAFETY_ITEM_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/open"
  - priority: 23
    category: business_safety
    check: "POST /agreements/{id}/open requires every PipItem of the agreement's plan whose priority == CRITICAL to have status VERIFIED."
    error_id: ERR_CRITICAL_PIP_ITEMS_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/open"
  - priority: 24
    category: business_safety
    check: "POST /pip-items/{id}/extension-request is refused on an item whose category == LIFE_SAFETY; a life-safety deadline is never extendable."
    error_id: ERR_LIFE_SAFETY_NOT_EXTENDABLE
    http_status: 422
    applies_to: "POST /pip-items/{id}/extension-request"
  - priority: 25
    category: business_safety
    check: "Segregation of duties: on POST /applications/{id}/decision, X-User-ID must differ from application.financial_reviewer_user_id; on POST /qa-inspections/{id}/cure-review, X-User-ID must differ from inspection.inspector_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/decision, POST /qa-inspections/{id}/cure-review"
  - priority: 26
    category: business_constraint
    check: "POST /agreements/{id}/transfer-requests is refused while agreement.transfer_consent_blocked == true, i.e. while compliance_status IN {DEFAULT_NOTICE, TERMINATION_ELIGIBLE}."
    error_id: ERR_TRANSFER_BLOCKED_BY_DEFAULT
    http_status: 409
    applies_to: "POST /agreements/{id}/transfer-requests, POST /transfer-requests/{id}/decide"
  - priority: 27
    category: business_constraint
    check: "POST /applications/{id}/decision with outcome APPROVE is refused when some ExistingUnit of the same brand lies within brand.protected_radius_miles of the property AND its inclusive territory interval [territory_start_date, territory_end_date] intersects the requested license interval [requested_conversion_date, requested_conversion_date + requested_term_years years]. Both intervals are closed, so intervals that merely touch at one endpoint do conflict."
    error_id: ERR_TERRITORY_TERM_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/decision"
  - priority: 28
    category: business_constraint
    check: "POST /applications/{id}/decision with outcome APPROVE is refused while any EncroachmentClaim on the application has status FILED."
    error_id: ERR_OPEN_ENCROACHMENT_CLAIMS
    http_status: 409
    applies_to: "POST /applications/{id}/decision"
  - priority: 29
    category: business_constraint
    check: "POST /agreements/{id}/revenue-reports with correction omitted or false is refused when a surviving revenue_periods entry already exists for that period_month; a correction == true call is refused when no surviving entry exists for that period_month."
    error_id: ERR_DUPLICATE_REVENUE_PERIOD
    http_status: 409
    applies_to: "POST /agreements/{id}/revenue-reports"
  - priority: 30
    category: business_constraint
    check: "POST /brands is refused when another Brand already carries the submitted code."
    error_id: ERR_BRAND_CODE_TAKEN
    http_status: 409
    applies_to: "POST /brands"
  - priority: 31
    category: business_constraint
    check: "POST /pip-items/{id}/extension-request is refused when item.extension_request_count is already MAX_EXTENSION_REQUESTS_PER_ITEM."
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /pip-items/{id}/extension-request"
  - priority: 32
    category: business_constraint
    check: "POST /agreements/{id}/de-identification requires items_completed to contain all five of {SIGNAGE, INTERIOR_BRANDING, DIGITAL_LISTINGS, LINENS_AND_COLLATERAL, RESERVATION_CODES}."
    error_id: ERR_DEIDENTIFICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /agreements/{id}/de-identification"
  - priority: 33
    category: business_constraint
    check: "POST /applications/{id}/decision with outcome APPROVE is refused when application.room_count < brand.min_room_count."
    error_id: ERR_ROOM_COUNT_BELOW_BRAND_MINIMUM
    http_status: 422
    applies_to: "POST /applications/{id}/decision"
  - priority: 34
    category: business_referential
    check: "POST /agreements/{id}/onboarding-milestone names the immediate next rung of the addressed track and satisfies that rung's cross-track prerequisite: TRAINING COMPLETED needs nothing, SYSTEMS PROVISIONED needs training_status == COMPLETED, SYSTEMS VALIDATED needs systems_status == PROVISIONED, CHANNEL TESTING needs systems_status == VALIDATED, CHANNEL CONNECTED needs channel_status == TESTING."
    error_id: ERR_ONBOARDING_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /agreements/{id}/onboarding-milestone"
  - priority: 35
    category: business_referential
    check: "POST /agreements/{id}/open requires training_status == COMPLETED and systems_status == VALIDATED."
    error_id: ERR_ONBOARDING_INCOMPLETE
    http_status: 409
    applies_to: "POST /agreements/{id}/open"
  - priority: 36
    category: business_referential
    check: "POST /agreements/{id}/open requires channel_status == CONNECTED."
    error_id: ERR_CHANNEL_NOT_CONNECTED
    http_status: 409
    applies_to: "POST /agreements/{id}/open"
  - priority: 37
    category: business_referential
    check: "POST /agreements/{id}/open requires a PropertyImprovementPlan on the agreement whose status IN {ACCEPTED, IN_PROGRESS, COMPLETED}."
    error_id: ERR_PIP_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /agreements/{id}/open"
  - priority: 38
    category: business_referential
    check: "POST /applications/{id}/decision with outcome APPROVE, POST /applications/{id}/agreements and POST /agreements/{id}/execute all require the application's financial_review_status == PASSED; a STALE, FAILED or NOT_STARTED review blocks all three. This is the error a decision taken on an unreviewed or failed application returns."
    error_id: ERR_FINANCIAL_REVIEW_NOT_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/decision, POST /applications/{id}/agreements, POST /agreements/{id}/execute"
  - priority: 39
    category: business_referential
    check: "POST /applications/{id}/decision with outcome APPROVE requires impact_study_status == FINAL, and requires encroachment_verdict != ENCROACHMENT_CONFIRMED unless the body sets encroachment_waiver_granted == true."
    error_id: ERR_IMPACT_STUDY_NOT_FINAL | ERR_ENCROACHMENT_CONFIRMED
    http_status: 409
    applies_to: "POST /applications/{id}/decision"
  - priority: 40
    category: business_referential
    check: "POST /applications/{id}/encroachment-claims requires the named ExistingUnit's status == OPERATING and its brand_id == application.brand_id."
    error_id: ERR_UNIT_NOT_OPERATING
    http_status: 422
    applies_to: "POST /applications/{id}/encroachment-claims"
  - priority: 41
    category: business_referential
    check: "POST /agreements/{id}/terminate with cause FOR_CAUSE_QA requires compliance_status == TERMINATION_ELIGIBLE; with cause FOR_CAUSE_PIP requires compliance_status IN {DEFAULT_NOTICE, TERMINATION_ELIGIBLE}; cause MUTUAL has no compliance precondition."
    error_id: ERR_TERMINATION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /agreements/{id}/terminate"
  - priority: 42
    category: business_temporal
    check: "POST /applications/{id}/encroachment-claims requires the logical clock to be at or before application.claim_window_closes_at."
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /applications/{id}/encroachment-claims"
  - priority: 43
    category: business_temporal
    check: "POST /qa-inspections/{id}/cure-submission requires the logical clock to be at or before inspection.cure_deadline; a submission at exactly the deadline instant is inside the window."
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /qa-inspections/{id}/cure-submission"
  - priority: 44
    category: business_temporal
    check: "POST /agreements/{id}/qa-inspections requires the logical clock to be at or after agreement.last_inspection_at + MIN_INSPECTION_GAP_DAYS days. The blocked window is half-open: exactly at the boundary is allowed, one instant before is refused. The first inspection on an agreement is unconstrained."
    error_id: ERR_INSPECTION_TOO_SOON
    http_status: 409
    applies_to: "POST /agreements/{id}/qa-inspections"
  - priority: 45
    category: business_temporal
    check: "POST /pip-items/{id}/complete requires the logical clock to be at or before item.due_date."
    error_id: ERR_PIP_ITEM_PAST_DUE
    http_status: 422
    applies_to: "POST /pip-items/{id}/complete"
  - priority: 46
    category: business_temporal
    check: "POST /pip-items/{id}/extension-request on an item whose status == OVERDUE is only accepted while the item's plan status == DEFAULTED; an overdue item on a non-defaulted plan has missed its extension window."
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /pip-items/{id}/extension-request"
  - priority: 47
    category: business_fiscal
    check: "POST /agreements/{id}/execute requires the Owner's LIVE capacity band under application.capacity_basis to be != INSUFFICIENT: capacity_band_standalone when capacity_basis == STANDALONE, capacity_band_portfolio_adjusted when it == PORTFOLIO_ADJUSTED. The check reads the owner's current band, not the frozen capacity_band_at_review snapshot, so a financial profile that decayed between approval and execution blocks execution even though financial_review_status is still PASSED."
    error_id: ERR_OWNER_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /agreements/{id}/execute"
  - priority: 48
    category: business_fiscal
    check: "POST /agreements/{id}/transfer-requests with request_type IN {TRANSFER, CHANGE_OF_CONTROL} requires the proposed owner's capacity_band_standalone != INSUFFICIENT."
    error_id: ERR_PROPOSED_OWNER_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /agreements/{id}/transfer-requests"
  - priority: 49
    category: business_fiscal
    check: "POST /agreements/{id}/close-out requires liquidated_damages_settlement_amount >= liquidated_damages_amount + de_identification_breach_penalty and de_identification_verified == true."
    error_id: ERR_POST_TERMINATION_OBLIGATIONS_OPEN
    http_status: 422
    applies_to: "POST /agreements/{id}/close-out"

# =============================================================================
# 1.5 API Endpoint Table
# Paths are top-level (api_prefix is "/"). Optional inputs carry a trailing "?".
# =============================================================================
endpoints:
  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which is the only source of 'now' for every deadline, window and timestamp in this API. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, QaInspector, Owner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock to the supplied instant; no entity is mutated and no deadline is re-evaluated by this call alone"

  # --- brands ----------------------------------------------------------------
  - method: POST
    path: "/brands"
    description: "Registers a franchisor brand with its rate card, protected radius and standard term."
    roles: [BrandStandardsDirector]
    code: 201
    input: [code, name, tier, base_royalty_rate_pct, marketing_fund_rate_pct, protected_radius_miles, min_room_count, standard_term_years]
    output: Brand
    side_effects:
      - "sets operating_unit_count and open_application_count to 0"
  - method: GET
    path: "/brands/{id}"
    description: "Reads one brand, including its two derived counts."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, QaInspector, Owner]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: GET
    path: "/brands/{id}/existing-units"
    description: "Lists the already-operating hotels flying this brand; the reverse-reachability channel for ExistingUnit.brand_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExistingUnit[]
    side_effects: []

  # --- owners ----------------------------------------------------------------
  - method: POST
    path: "/owners"
    description: "Registers a prospective or existing ownership entity with its verified financial profile."
    roles: [FranchiseDevelopmentManager]
    code: 201
    input: [legal_name, contact_email, liquid_assets_amount, net_worth_amount, credit_score, existing_units_count]
    output: Owner
    side_effects:
      - "computes capacity_score_standalone, capacity_band_standalone, capacity_score_portfolio_adjusted and capacity_band_portfolio_adjusted"
      - "sets status to PROSPECT and financial_profile_revision to 0"
  - method: GET
    path: "/owners/{id}"
    description: "Reads one ownership entity with both capacity variants side by side."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: POST
    path: "/owners/{id}/financial-profile"
    description: "Records a re-verified financial profile for the owner, replacing all four financial inputs."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [liquid_assets_amount, net_worth_amount, credit_score, existing_units_count]
    output: Owner
    side_effects:
      - "recomputes both capacity scores and both capacity bands"
      - "increments Owner.financial_profile_revision by 1"
      - "every Application of this owner whose status == UNDER_REVIEW and whose financial_review_status == PASSED becomes STALE, keeping its stale capacity snapshot"

  # --- existing units --------------------------------------------------------
  - method: POST
    path: "/existing-units"
    description: "Registers an already-operating hotel of a brand, with the grid coordinates and inclusive territory term that drive encroachment and territory-conflict analysis."
    roles: [BrandStandardsDirector]
    code: 201
    input: [brand_id, unit_name, market_code, x_miles, y_miles, room_count, adr_amount, occupancy_pct, territory_start_date, territory_end_date]
    output: ExistingUnit
    side_effects:
      - "sets status to OPERATING"
      - "increments Brand.operating_unit_count by 1"
  - method: POST
    path: "/existing-units/{id}/status"
    description: "Moves an operating hotel between OPERATING, SUSPENDED and TERMINATED, which changes which impact-score input set it belongs to."
    roles: [BrandStandardsDirector]
    code: 200
    input: [to_status, "reason?"]
    output: ExistingUnit
    side_effects:
      - "recomputes Brand.operating_unit_count"
      - "stores status_reason"

  # --- applications ----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Files a conversion application for one property against one brand on behalf of one owner."
    roles: [FranchiseDevelopmentManager]
    code: 201
    input: [owner_id, brand_id, property_name, market_code, property_x_miles, property_y_miles, room_count, current_affiliation, building_age_years, requested_term_years, requested_conversion_date]
    output: Application
    side_effects:
      - "sets status to SUBMITTED, financial_review_status to NOT_STARTED, impact_study_status to NOT_STARTED, revision_round to 0, sustained_claim_count to 0"
      - "increments Brand.open_application_count by 1"
  - method: GET
    path: "/applications/{id}"
    description: "Reads one application with all three of its state axes, both impact variants and the capacity snapshot."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "Lists applications with optional owner, brand and status filters; the reverse-reachability channel for Application.owner_id and Application.brand_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector]
    code: 200
    input: ["owner_id?", "brand_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/start-review"
    description: "Opens the review file on a submitted application."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: []
    output: Application
    side_effects:
      - "sets status to UNDER_REVIEW"
  - method: POST
    path: "/applications/{id}/financial-review"
    description: "Records the owner financial capacity review on the chosen capacity basis; the outcome is derived from the owner's capacity band, never supplied by the caller."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [capacity_basis, "reviewer_notes?"]
    output: Application
    side_effects:
      - "snapshots capacity_basis, capacity_score_at_review and capacity_band_at_review from the owner's matching capacity variant"
      - "sets financial_review_status to PASSED when the snapshot band != INSUFFICIENT and to FAILED when it == INSUFFICIENT"
      - "sets financial_reviewer_user_id to the acting X-User-ID, arming the segregation-of-duties check on the decision"
  - method: POST
    path: "/applications/{id}/impact-analysis"
    description: "Runs the preliminary market impact study over the brand's operating units inside the protected radius and opens the encroachment claim window."
    roles: [BrandStandardsDirector]
    code: 200
    input: ["analyst_notes?"]
    output: Application
    side_effects:
      - "computes preliminary_impact_score and impact_unit_count_preliminary under variant PRELIMINARY"
      - "sets impact_study_status to PRELIMINARY"
      - "sets claim_window_closes_at to the logical clock plus CLAIM_WINDOW_DAYS days"
  - method: POST
    path: "/applications/{id}/encroachment-claims"
    description: "Dockets an encroachment claim from a nearby operating unit of the same brand against this application."
    roles: [BrandStandardsDirector]
    code: 201
    input: [existing_unit_id, claimed_revenue_loss_pct, narrative]
    output: EncroachmentClaim
    side_effects:
      - "computes distance_miles from the unit to the applicant property"
      - "sets status to FILED, penalty_points_applied to 0.00 and filed_by_user_id to the acting X-User-ID"
  - method: GET
    path: "/encroachment-claims/{id}"
    description: "Reads one encroachment claim."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector]
    code: 200
    input: []
    output: EncroachmentClaim
    side_effects: []
  - method: GET
    path: "/encroachment-claims"
    description: "Lists encroachment claims with optional application, unit and status filters; the reverse-reachability channel for EncroachmentClaim.application_id and EncroachmentClaim.existing_unit_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector]
    code: 200
    input: ["application_id?", "existing_unit_id?", "status?", "limit?", "offset?"]
    output: EncroachmentClaim[]
    side_effects: []
  - method: POST
    path: "/encroachment-claims/{id}/resolve"
    description: "Sustains or overrules a docketed claim. Sustaining runs a three-level cascade into the application's impact study and its draft agreements; overruling changes nothing but the claim."
    roles: [BrandStandardsDirector]
    code: 200
    input: [outcome, resolution_notes]
    output: EncroachmentClaim
    side_effects:
      - "sets status to SUSTAINED or OVERRULED, plus resolution_notes and resolved_at"
      - "on SUSTAIN: sets penalty_points_applied to CLAIM_PENALTY_POINTS and increments Application.sustained_claim_count by 1"
      - "on SUSTAIN: if the application's impact_study_status == FINAL it drops to PRELIMINARY and base_impact_score, final_impact_score, impact_unit_count_final and encroachment_verdict are nulled"
      - "on SUSTAIN: every LicenseAgreement of that application whose status == DRAFT becomes VOIDED"
      - "on OVERRULE: no field of the application or of any agreement changes"
  - method: POST
    path: "/applications/{id}/finalize-impact"
    description: "Finalizes the market impact study, admitting suspended units, applying the sustained-claim penalty and setting the encroachment verdict."
    roles: [BrandStandardsDirector]
    code: 200
    input: ["analyst_notes?"]
    output: Application
    side_effects:
      - "computes base_impact_score and impact_unit_count_final under variant FINAL"
      - "computes final_impact_score including the sustained-claim penalty and sets encroachment_verdict"
      - "sets impact_study_status to FINAL"
  - method: POST
    path: "/applications/{id}/request-revision"
    description: "Sends the application back to the applicant for revision."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [revision_notes]
    output: Application
    side_effects:
      - "sets status to REVISION_REQUESTED and stores revision_notes"
  - method: POST
    path: "/applications/{id}/resubmit"
    description: "Applicant resubmits a revised application, reopening review and discarding both completed review axes."
    roles: [Owner]
    code: 200
    input: [revision_response]
    output: Application
    side_effects:
      - "sets status to UNDER_REVIEW and increments revision_round by 1"
      - "resets financial_review_status to NOT_STARTED and nulls capacity_basis, capacity_score_at_review, capacity_band_at_review and financial_reviewer_user_id"
      - "resets impact_study_status to NOT_STARTED and nulls preliminary_impact_score, impact_unit_count_preliminary, base_impact_score, final_impact_score, impact_unit_count_final, encroachment_verdict and claim_window_closes_at"
  - method: POST
    path: "/applications/{id}/decision"
    description: "Approves or declines the application. Approval is the gate that runs the territory-term overlap check, the open-claim check, the brand key-count minimum and the segregation-of-duties check."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [outcome, decision_notes, "encroachment_waiver_granted?"]
    output: Application
    side_effects:
      - "sets status to APPROVED or DECLINED, decision_outcome, decision_user_id, decided_at, decision_notes and encroachment_waiver_granted"
      - "decrements Brand.open_application_count by 1"

  # --- license agreements ----------------------------------------------------
  - method: POST
    path: "/applications/{id}/agreements"
    description: "Drafts a license agreement from an approved application, deriving and freezing the royalty rate, the marketing fund rate, the term length and the expiry date."
    roles: [FranchiseDevelopmentManager]
    code: 201
    input: [effective_date]
    output: LicenseAgreement
    side_effects:
      - "computes royalty_rate_pct, marketing_fund_rate_pct, term_years and expiry_date via license_terms_derivation"
      - "snapshots brand_code and liquidated_damages_cap_months"
      - "sets status DRAFT, compliance_status COMPLIANT, training_status NOT_STARTED, systems_status NOT_STARTED, channel_status NOT_CONNECTED, de_identification_status NOT_REQUIRED, post_termination_status NOT_APPLICABLE and every ledger total to 0.00"
  - method: GET
    path: "/applications/{id}/agreements"
    description: "Lists the license agreements drafted from one application; the reverse-reachability channel for LicenseAgreement.application_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []
  - method: GET
    path: "/agreements/{id}"
    description: "Reads one license agreement with all four state axes, the frozen terms, the fee ledger and the termination fields."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, QaInspector, Owner]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: POST
    path: "/agreements/{id}/execute"
    description: "Executes a drafted license against the application version the client last observed."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [expected_application_version]
    output: LicenseAgreement
    side_effects:
      - "sets status to EXECUTED and executed_at to the logical clock"
      - "increments Application.version by 1"
      - "sets the Owner's status to ACTIVE when it was PROSPECT"
  - method: POST
    path: "/agreements/{id}/pips"
    description: "Opens the conversion property improvement plan for an executed license."
    roles: [BrandStandardsDirector]
    code: 201
    input: [scope_notes]
    output: PropertyImprovementPlan
    side_effects:
      - "sets status to SCOPED and every item counter and cost total to 0"
  - method: GET
    path: "/agreements/{id}/pips"
    description: "Lists the property improvement plans of one agreement; the reverse-reachability channel for PropertyImprovementPlan.agreement_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PropertyImprovementPlan[]
    side_effects: []
  - method: GET
    path: "/pips/{id}"
    description: "Reads one property improvement plan with its four status counters, its frozen cost allocation and its overall deadline."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: []
    output: PropertyImprovementPlan
    side_effects: []
  - method: POST
    path: "/pips/{id}/items"
    description: "Adds one scope line with its category, priority and cost estimate to a scoped plan."
    roles: [BrandStandardsDirector]
    code: 201
    input: [category, priority, description, estimated_cost]
    output: PipItem
    side_effects:
      - "sets status to PENDING and extension_status to NONE"
      - "increments the plan's items_total_count and items_pending_count by 1 and recomputes total_estimated_cost"
  - method: GET
    path: "/pips/{id}/items"
    description: "Lists the scope lines of one plan; the reverse-reachability channel for PipItem.pip_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PipItem[]
    side_effects: []
  - method: POST
    path: "/pips/{id}/accept"
    description: "Franchisee accepts the scope, which freezes the cost allocation and stamps a due date on every scope line."
    roles: [Owner]
    code: 200
    input: [acknowledgement]
    output: PropertyImprovementPlan
    side_effects:
      - "sets status to ACCEPTED and accepted_at to the logical clock"
      - "computes cost_per_room, key_money_pct, franchisor_key_money, owner_net_cost, owner_net_cost_per_room and escalation_required via pip_cost_allocation"
      - "computes base_due_date and due_date on every PipItem of the plan and sets overall_deadline to their maximum"
  - method: POST
    path: "/pips/{id}/compliance-sweep"
    description: "Re-evaluates every scope line against the logical clock, flags the overdue ones and, when a critical or life-safety line is overdue, drives the plan into default and the license into a default notice."
    roles: [BrandStandardsDirector]
    code: 200
    input: []
    output: PropertyImprovementPlan
    side_effects:
      - "every PipItem with status IN {PENDING, SUBMITTED} whose due_date is before the logical clock becomes OVERDUE with overdue_at set"
      - "recomputes the plan's four status counters"
      - "when at least one newly OVERDUE item has priority CRITICAL or category LIFE_SAFETY: the plan becomes DEFAULTED"
      - "when the plan becomes DEFAULTED: the agreement's compliance_status becomes DEFAULT_NOTICE, default_notice_issued_at is set to the logical clock, pip_cure_deadline is set to that instant plus PIP_DEFAULT_CURE_DAYS days and transfer_consent_blocked becomes true"
      - "when the agreement's compliance_status becomes DEFAULT_NOTICE: every TransferRequest on that agreement whose status == SUBMITTED becomes REFUSED with refusal_reason DEFAULT_NOTICE and decided_at set to the logical clock"
  - method: POST
    path: "/pip-items/{id}/complete"
    description: "Franchisee reports a scope line finished and submits it for verification."
    roles: [Owner]
    code: 200
    input: [completion_evidence]
    output: PipItem
    side_effects:
      - "sets status to SUBMITTED, completion_evidence and completed_at"
      - "decrements the plan's items_pending_count and increments items_submitted_count"
      - "moves the plan from ACCEPTED to IN_PROGRESS on the first such call"
  - method: POST
    path: "/pip-items/{id}/verify"
    description: "Brand standards verifies or rejects a submitted scope line. Rejection is the exact compensating move for completion and restores the plan's counter partition."
    roles: [BrandStandardsDirector]
    code: 200
    input: [outcome, verification_notes]
    output: PipItem
    side_effects:
      - "on VERIFY: sets status to VERIFIED and verified_at, decrements items_submitted_count and increments items_verified_count"
      - "on VERIFY: the plan becomes COMPLETED when items_verified_count reaches items_total_count"
      - "on REJECT: sets status back to PENDING and increments rejection_count, decrements items_submitted_count and increments items_pending_count"
  - method: POST
    path: "/pip-items/{id}/extension-request"
    description: "Franchisee asks for more time on a scope line."
    roles: [Owner]
    code: 200
    input: [requested_days, reason]
    output: PipItem
    side_effects:
      - "sets extension_status to PENDING, stores extension_requested_days and extension_reason and increments extension_request_count by 1"
  - method: POST
    path: "/pip-items/{id}/extension-decision"
    description: "Brand standards grants or denies an extension request, clamping the granted days by the per-item ceiling and the plan-wide pool."
    roles: [BrandStandardsDirector]
    code: 200
    input: [outcome, "decision_notes?"]
    output: PipItem
    side_effects:
      - "on GRANT: sets extension_status to GRANTED, adds the clamped day count to extension_granted_days_total and recomputes due_date"
      - "on GRANT: recomputes the plan's extension_granted_days_total and overall_deadline"
      - "on GRANT of an OVERDUE item whose recomputed due_date is at or after the logical clock: the item returns to PENDING and the plan's counters move accordingly"
      - "on GRANT that leaves no OVERDUE critical or life-safety item: a DEFAULTED plan returns to IN_PROGRESS"
      - "on DENY: sets extension_status to DENIED and leaves due_date unchanged"

  # --- onboarding, opening and fees -----------------------------------------
  - method: POST
    path: "/agreements/{id}/onboarding-milestone"
    description: "Advances one of the three onboarding tracks by exactly one rung: franchisee training, systems provisioning and validation, and reservation channel connection."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [track, to_status]
    output: LicenseAgreement
    side_effects:
      - "sets training_status, systems_status or channel_status to the named rung"
  - method: POST
    path: "/agreements/{id}/open"
    description: "Opens the hotel under the brand once the critical and life-safety scope is verified and all three onboarding tracks are complete."
    roles: [BrandStandardsDirector]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "sets status to OPEN and opened_at to the logical clock"
  - method: POST
    path: "/agreements/{id}/revenue-reports"
    description: "Reports one month of gross room revenue and assesses the tiered royalty, the marketing fund contribution and the reservation channel fee against it. A correction supersedes the surviving entry for the same month and re-derives every ledger total. period_month is a YYYY-MM month string (exactly 7 characters, a four-digit year, a hyphen and a two-digit month in 01..12); gross_room_revenue is >= 0.00 with exactly 2 decimal places; correction defaults to false."
    roles: [Owner]
    code: 200
    input: [period_month, gross_room_revenue, "correction?"]
    output: LicenseAgreement
    side_effects:
      - "appends a revenue_periods entry carrying period_month, gross_room_revenue, royalty_fee, marketing_fee, reservation_fee, period_total_fee and superseded == false"
      - "when correction == true: flips the prior surviving entry for that period_month to superseded == true"
      - "recomputes royalty_fee_to_date, marketing_fund_contributed_total, reservation_fee_to_date, total_fees_assessed and reported_period_count from the surviving entries only"
  - method: GET
    path: "/agreements/{id}/fee-summary"
    description: "Computed read of the agreement's fee ledger, showing the frozen rates alongside the four running totals and the surviving period count."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, Owner]
    code: 200
    input: []
    output: "{ agreement_id: string, royalty_rate_pct: number, marketing_fund_rate_pct: number, reported_period_count: integer, royalty_fee_to_date: number, marketing_fund_contributed_total: number, reservation_fee_to_date: number, total_fees_assessed: number }"
    side_effects: []

  # --- quality assurance -----------------------------------------------------
  - method: POST
    path: "/agreements/{id}/qa-inspections"
    description: "Records a quality assurance inspection, grading it from the four weighted sections with a critical-defect penalty and a life-safety override, and opening a cure window when the grade is not PASS."
    roles: [QaInspector]
    code: 201
    input: [cleanliness_score, condition_score, brand_standard_score, guest_experience_score, critical_defect_count, life_safety_defect]
    output: QaInspection
    side_effects:
      - "sets inspection_at to the logical clock and inspector_user_id to the acting X-User-ID"
      - "computes weighted_score, total_score, grade, cure_period_days and cure_deadline via qa_inspection_score"
      - "sets status to CLOSED for grade PASS and to CURE_PENDING for grades CONDITIONAL and FAIL"
      - "sets the agreement's last_inspection_at to this inspection_at"
      - "for grades CONDITIONAL and FAIL: the agreement's compliance_status becomes CURE_PERIOD"
  - method: GET
    path: "/agreements/{id}/qa-inspections"
    description: "Lists the inspections of one agreement; the reverse-reachability channel for QaInspection.agreement_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector, QaInspector, Owner]
    code: 200
    input: ["grade?", "limit?", "offset?"]
    output: QaInspection[]
    side_effects: []
  - method: POST
    path: "/qa-inspections/{id}/cure-submission"
    description: "Franchisee submits its cure evidence inside the cure window."
    roles: [Owner]
    code: 200
    input: [cure_evidence]
    output: QaInspection
    side_effects:
      - "sets status to CURE_SUBMITTED, cure_evidence and cure_submitted_at"
  - method: POST
    path: "/qa-inspections/{id}/cure-review"
    description: "A different inspector passes or fails the submitted cure. Failing runs a three-level cascade into the license's compliance status and its reservation channel; passing reverses it."
    roles: [QaInspector]
    code: 200
    input: [outcome, review_notes]
    output: QaInspection
    side_effects:
      - "sets status to CURE_PASSED or CURE_FAILED, cure_reviewer_user_id, cure_reviewed_at and review_notes"
      - "on PASS: the agreement's compliance_status returns to COMPLIANT, consecutive_qa_failure_count resets to 0, transfer_consent_blocked becomes false and channel_status returns to CONNECTED when it was SUSPENDED"
      - "on FAIL: the agreement's consecutive_qa_failure_count increments by 1"
      - "on FAIL: the agreement's compliance_status becomes DEFAULT_NOTICE, or TERMINATION_ELIGIBLE once consecutive_qa_failure_count reaches QA_FAILURE_TERMINATION_THRESHOLD, and transfer_consent_blocked becomes true"
      - "on FAIL: the agreement's channel_status becomes SUSPENDED when it was CONNECTED"

  # --- transfer, refinancing and change of control --------------------------
  - method: POST
    path: "/agreements/{id}/transfer-requests"
    description: "Franchisee seeks franchisor consent to a transfer, a change of control or a refinancing, pricing the consent fee and screening the proposed transferee's capacity."
    roles: [Owner]
    code: 201
    input: [request_type, "proposed_owner_id?", "lender_name?"]
    output: TransferRequest
    side_effects:
      - "computes transfer_fee, non_compliance_surcharge and total_consent_fee via transfer_consent_fee"
      - "snapshots proposed_owner_capacity_band from the proposed owner's capacity_band_standalone for TRANSFER and CHANGE_OF_CONTROL"
      - "sets status to SUBMITTED and submitted_by_user_id to the acting X-User-ID"
  - method: GET
    path: "/transfer-requests/{id}"
    description: "Reads one consent request with its priced fee and its capacity snapshot."
    roles: [FranchiseDevelopmentManager, Owner]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: GET
    path: "/transfer-requests"
    description: "Lists consent requests with optional agreement, proposed-owner and status filters; the reverse-reachability channel for TransferRequest.agreement_id and TransferRequest.proposed_owner_id."
    roles: [FranchiseDevelopmentManager, BrandStandardsDirector]
    code: 200
    input: ["agreement_id?", "proposed_owner_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/decide"
    description: "Grants or refuses consent against the agreement version the client last observed."
    roles: [FranchiseDevelopmentManager]
    code: 200
    input: [outcome, expected_agreement_version, "decision_notes?"]
    output: TransferRequest
    side_effects:
      - "sets status to CONSENTED or REFUSED, decision_user_id, decided_at and decision_notes"
      - "on REFUSE: sets refusal_reason to DISCRETION"
      - "increments LicenseAgreement.version by 1"
      - "on CONSENT: increments LicenseAgreement.transfer_consent_count by 1"

  # --- termination and post-termination -------------------------------------
  - method: POST
    path: "/agreements/{id}/terminate"
    description: "Terminates an open license for franchisee default or by mutual agreement, freezing the liquidated damages under the variant the cause selects and starting the de-identification clock."
    roles: [BrandStandardsDirector]
    code: 200
    input: [cause, termination_notes]
    output: LicenseAgreement
    side_effects:
      - "sets status to TERMINATION_PENDING, termination_cause, terminated_at and liquidated_damages_formula"
      - "computes trailing_avg_monthly_fee, remaining_term_months_at_termination and liquidated_damages_amount via liquidated_damages"
      - "sets de_identification_status to PENDING and de_identification_deadline to terminated_at plus DE_IDENTIFICATION_DAYS days"
      - "sets post_termination_status to OPEN"
      - "sets channel_status to SUSPENDED when it was CONNECTED"
      - "sets the agreement's PropertyImprovementPlan to SUSPENDED when its status IN {ACCEPTED, IN_PROGRESS, DEFAULTED}"
  - method: POST
    path: "/agreements/{id}/de-identification"
    description: "Franchisee certifies the brand has been removed from the property. Filed after the deadline the certification still lands, but the license is marked breached and a penalty is added to the post-termination settlement floor."
    roles: [Owner]
    code: 200
    input: [items_completed]
    output: LicenseAgreement
    side_effects:
      - "stores de_identification_items_completed"
      - "sets de_identification_status to SUBMITTED when the logical clock is at or before de_identification_deadline, and to BREACHED when it is after"
      - "sets de_identification_breach_penalty to DE_IDENTIFICATION_BREACH_PENALTY on the BREACHED path and leaves it 0.00 on the SUBMITTED path"
  - method: POST
    path: "/agreements/{id}/close-out"
    description: "Closes the post-termination file once de-identification is certified and the liquidated damages plus any breach penalty are settled."
    roles: [BrandStandardsDirector]
    code: 200
    input: [liquidated_damages_settlement_amount, de_identification_verified]
    output: LicenseAgreement
    side_effects:
      - "sets status to TERMINATED, de_identification_status to VERIFIED, post_termination_status to CLOSED"
      - "sets liquidated_damages_paid_amount to the settled amount and closed_out_at to the logical clock"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication, authorization and request shape ----------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role absent or empty."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the four declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the requested endpoint."
  - id: ERR_FORBIDDEN_RESOURCE_OWNER
    http: 403
    condition: "An Owner acts on an application, agreement, plan, scope line, inspection cure or consent request belonging to a different Owner."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, enum value outside its set, number outside its range or decimal width, malformed ISO-8601 date or datetime, pagination limit outside 1..100 or negative offset."
  # --- existence -------------------------------------------------------------
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "No Brand carries the referenced id."
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "No Owner carries the referenced id."
  - id: ERR_EXISTING_UNIT_NOT_FOUND
    http: 404
    condition: "No ExistingUnit carries the referenced id."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No Application carries the referenced id."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No EncroachmentClaim carries the referenced id."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No LicenseAgreement carries the referenced id."
  - id: ERR_PIP_NOT_FOUND
    http: 404
    condition: "No PropertyImprovementPlan carries the referenced id."
  - id: ERR_PIP_ITEM_NOT_FOUND
    http: 404
    condition: "No PipItem carries the referenced id."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No QaInspection carries the referenced id."
  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http: 404
    condition: "No TransferRequest carries the referenced id."
  # --- state preconditions ---------------------------------------------------
  - id: ERR_APPLICATION_STAGE_INVALID
    http: 409
    condition: "The application's status does not admit the requested review step: start-review off SUBMITTED, a review or decision step off UNDER_REVIEW, resubmit off REVISION_REQUESTED, or agreement drafting off APPROVED."
  - id: ERR_IMPACT_STUDY_STAGE_INVALID
    http: 409
    condition: "finalize-impact called while impact_study_status is NOT_STARTED or already FINAL."
  - id: ERR_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "execute called on an agreement whose status is not DRAFT."
  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "A plan, an onboarding milestone or open called on an agreement whose status is not EXECUTED."
  - id: ERR_AGREEMENT_NOT_OPEN
    http: 409
    condition: "A revenue report, an inspection or a termination called on an agreement whose status is not OPEN, or a consent request called on an agreement whose status is not one of EXECUTED, OPEN."
  - id: ERR_AGREEMENT_NOT_TERMINATION_PENDING
    http: 409
    condition: "De-identification or close-out called on an agreement whose status is not TERMINATION_PENDING."
  - id: ERR_PIP_NOT_SCOPED
    http: 409
    condition: "A scope line added to or acceptance filed on a plan whose status is not SCOPED, or a compliance sweep run on a plan whose status is not one of ACCEPTED, IN_PROGRESS, DEFAULTED."
  - id: ERR_PIP_ITEM_STAGE_INVALID
    http: 409
    condition: "complete called on a line that is not PENDING, verify called on a line that is not SUBMITTED, or an extension requested on a line that is already VERIFIED."
  - id: ERR_EXTENSION_NOT_PENDING
    http: 409
    condition: "An extension decision filed on a line whose extension_status is not PENDING."
  - id: ERR_CLAIM_NOT_FILED
    http: 409
    condition: "resolve called on a claim that is already SUSTAINED or OVERRULED."
  - id: ERR_INSPECTION_STAGE_INVALID
    http: 409
    condition: "A cure submitted on an inspection that is not CURE_PENDING, or a cure reviewed on an inspection that is not CURE_SUBMITTED."
  - id: ERR_TRANSFER_REQUEST_NOT_SUBMITTED
    http: 409
    condition: "decide called on a consent request that is already CONSENTED or REFUSED."
  - id: ERR_UNIT_STATUS_TRANSITION_INVALID
    http: 409
    condition: "A unit status transition that is not declared for the unit's current status, including any transition out of TERMINATED."
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version on execute does not equal the Application's current version."
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version on a consent decision does not equal the LicenseAgreement's current version."
  # --- business rules -------------------------------------------------------
  - id: ERR_LIFE_SAFETY_ITEM_OPEN
    http: 409
    condition: "open called while a LIFE_SAFETY scope line of the agreement's plan is not VERIFIED."
  - id: ERR_CRITICAL_PIP_ITEMS_OPEN
    http: 409
    condition: "open called while a CRITICAL scope line of the agreement's plan is not VERIFIED."
  - id: ERR_LIFE_SAFETY_NOT_EXTENDABLE
    http: 422
    condition: "An extension requested on a scope line whose category is LIFE_SAFETY."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the incompatible earlier step: the financial reviewer issuing the decision, or the scoring inspector reviewing the cure."
  - id: ERR_TRANSFER_BLOCKED_BY_DEFAULT
    http: 409
    condition: "A consent request filed or decided while the agreement's transfer_consent_blocked is true."
  - id: ERR_TERRITORY_TERM_CONFLICT
    http: 409
    condition: "Approval attempted while an in-radius unit of the same brand holds an inclusive territory term that intersects the requested license term."
  - id: ERR_OPEN_ENCROACHMENT_CLAIMS
    http: 409
    condition: "Approval attempted while an encroachment claim on the application is still FILED."
  - id: ERR_ENCROACHMENT_CONFIRMED
    http: 409
    condition: "Approval attempted with encroachment_verdict == ENCROACHMENT_CONFIRMED and no waiver in the request body."
  - id: ERR_DUPLICATE_REVENUE_PERIOD
    http: 409
    condition: "A non-corrective revenue report for a month that already has a surviving entry, or a corrective report for a month that has none."
  - id: ERR_BRAND_CODE_TAKEN
    http: 409
    condition: "A brand created with a code another brand already carries."
  - id: ERR_EXTENSION_LIMIT_EXCEEDED
    http: 422
    condition: "A third extension requested on the same scope line."
  - id: ERR_DEIDENTIFICATION_INCOMPLETE
    http: 422
    condition: "A de-identification certification missing at least one of the five required item codes."
  - id: ERR_ROOM_COUNT_BELOW_BRAND_MINIMUM
    http: 422
    condition: "Approval attempted for a property whose room_count is below the brand's min_room_count."
  - id: ERR_ONBOARDING_SEQUENCE_INVALID
    http: 409
    condition: "An onboarding milestone that skips a rung of its own track or whose cross-track prerequisite is unmet."
  - id: ERR_ONBOARDING_INCOMPLETE
    http: 409
    condition: "open called while training_status is not COMPLETED or systems_status is not VALIDATED."
  - id: ERR_CHANNEL_NOT_CONNECTED
    http: 409
    condition: "open called while channel_status is not CONNECTED."
  - id: ERR_PIP_NOT_ACCEPTED
    http: 409
    condition: "open called with no plan on the agreement, or with a plan whose status is not one of ACCEPTED, IN_PROGRESS, COMPLETED."
  - id: ERR_FINANCIAL_REVIEW_NOT_PASSED
    http: 409
    condition: "Approval, agreement drafting or execution attempted while the application's financial_review_status is NOT_STARTED, FAILED or STALE."
  - id: ERR_IMPACT_STUDY_NOT_FINAL
    http: 409
    condition: "Approval attempted while impact_study_status is not FINAL."
  - id: ERR_UNIT_NOT_OPERATING
    http: 422
    condition: "An encroachment claim filed by a unit whose status is not OPERATING, or by a unit of a different brand than the application."
  - id: ERR_TERMINATION_NOT_ELIGIBLE
    http: 409
    condition: "Termination for cause attempted while the agreement's compliance_status does not support that cause."
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "An encroachment claim filed after the application's claim_window_closes_at."
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 422
    condition: "A cure submitted after the inspection's cure_deadline."
  - id: ERR_INSPECTION_TOO_SOON
    http: 409
    condition: "An inspection recorded fewer than MIN_INSPECTION_GAP_DAYS days after the agreement's last inspection."
  - id: ERR_PIP_ITEM_PAST_DUE
    http: 422
    condition: "A scope line reported complete after its due_date."
  - id: ERR_EXTENSION_WINDOW_CLOSED
    http: 422
    condition: "An extension requested on an OVERDUE scope line whose plan is not DEFAULTED."
  - id: ERR_OWNER_CAPACITY_INSUFFICIENT
    http: 422
    condition: "Execution attempted while the Owner's live capacity band under the application's recorded capacity_basis is INSUFFICIENT."
  - id: ERR_PROPOSED_OWNER_CAPACITY_INSUFFICIENT
    http: 422
    condition: "A transfer or change-of-control consent request whose proposed owner's capacity_band_standalone is INSUFFICIENT."
  - id: ERR_POST_TERMINATION_OBLIGATIONS_OPEN
    http: 422
    condition: "Close-out attempted with de_identification_verified false, or with a settlement below liquidated_damages_amount plus de_identification_breach_penalty."

