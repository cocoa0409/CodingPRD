      - name: settle_accepts_dispute_from_the_partner_but_reserves_payment_for_the_accountant
        claim_type: conditional_action
        grounds:
          - endpoints[POST /ill/invoices/{id}/settle]
          - state_machines.PartnerInvoice.ISSUED_to_DISPUTED
          - state_machines.PartnerInvoice.DISPUTED_to_ISSUED
          - roles.ConsortiumAccountant
          - roles.PartnerAgent
        distinguishing_aspect: "One endpoint carries three actions with different authority: the PartnerAgent may DISPUTE and REINSTATE its own invoice but is refused on PAY with ERR_UNAUTHORIZED, and the REINSTATE clears dispute_reason while leaving issued_at as originally stamped — only after that does the accountants PAY succeed."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-01T00:00:00Z, then to 2026-09-05T00:00:00Z for the settlement."
            - "Partner EASTV with one OPEN LendingCharge of 2000 cents incurred 2026-08-05 and no ReciprocityAgreement."
            - "A 2026-08 invoice has been drafted and issued, so its status is ISSUED with issued_at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "EASTV", name: "East Valley College Library", consortium_code: "EASTERN", base_lending_fee_cents: 1750, avg_turnaround_days: 6, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Bound volume 7", service_type: "LOAN", charge_cents: 2000, incurred_at: "2026-08-05T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { pv: $.data.version }
            - call: "POST /ill/partners/${partner_id}/invoices"
              payload: { expected_partner_version: "${pv}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id }
            - call: "POST /ill/invoices/${inv_id}/issue"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { issued_at_0: $.data.issued_at, status_0: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /ill/invoices/${inv_id}/settle"
              payload: { action: "PAY" }
              as: PartnerAgent
              as_user_id: "${partner_id}"
              captures: { err_pay: $.data.error_id }
            - call: "POST /ill/invoices/${inv_id}/settle"
              payload: { action: "DISPUTE", dispute_reason: "Volume 7 was returned undamaged" }
              as: PartnerAgent
              as_user_id: "${partner_id}"
              captures: { status_1: $.data.status, reason_1: $.data.dispute_reason, settled_1: $.data.settled_at }
            - call: "POST /ill/invoices/${inv_id}/settle"
              payload: { action: "REINSTATE" }
              as: PartnerAgent
              as_user_id: "${partner_id}"
              captures: { status_2: $.data.status, reason_2: $.data.dispute_reason, issued_at_2: $.data.issued_at }
            - call: "POST /ill/invoices/${inv_id}/settle"
              payload: { action: "PAY" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { status_3: $.data.status, settled_3: $.data.settled_at }
          assert:
            - "${status_0} == ISSUED with ${issued_at_0} == 2026-09-01T00:00:00Z"
            - "${err_pay} == ERR_UNAUTHORIZED with HTTP 403 — the role is on the endpoint's list but PAY is reserved to ConsortiumAccountant, so the authority is action-dependent"
            - "GET /ill/invoices/${inv_id} immediately after the refusal still reports status ISSUED with settled_at null"
            - "${status_1} == DISPUTED with ${reason_1} == 'Volume 7 was returned undamaged' and ${settled_1} == null"
            - "${status_2} == ISSUED, ${reason_2} == null and ${issued_at_2} == 2026-09-01T00:00:00Z — REINSTATE, which §1.7 grants to PartnerAgent, clears the reason and does not restamp issued_at"
            - "${status_3} == PAID with ${settled_3} == 2026-09-05T00:00:00Z"
            - "A further POST /ill/invoices/${inv_id}/settle with action DISPUTE returns ERR_INVOICE_INVALID_STATE with HTTP 409 — PAID is terminal"

  # ===========================================================================
  - section: errors
    instances:

      - name: the_auth_rungs_return_unauthenticated_then_non_owner_then_malformed_input
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=10]
          - validations[priority=25]
          - validations[priority=35]
        distinguishing_aspect: "The same GET is walked down three rungs of one ladder: with no auth headers it is 401, with valid headers for the wrong patron it is 403 ERR_NOT_RESOURCE_OWNER (not ERR_UNAUTHORIZED, since Patron is on the endpoint's role list), and with the owning patron it succeeds — while a list call with limit 101 fails the priority-35 body check."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Two patrons, OWNER and STRANGER, each ACTIVE with default caps."
            - "Partner NORTHU on a single-entry LOAN rota and one BibItem with local_holding_status NONE."
            - "One request taken in for OWNER, so IllRequest.patron_id is OWNER's id."
            - "The first trigger call is issued with both the X-User-ID and the X-User-Role header omitted entirely; the as/as_user_id shown for it are the identity it would otherwise have used."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-OWNER", full_name: "Owen Owner", email: "owen@u.edu", patron_type: "GRAD", department: "LING" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { owner_id: $.data.id }
            - call: "POST /ill/patrons"
              payload: { external_id: "P-STRANGER", full_name: "Stan Stranger", email: "stan@u.edu", patron_type: "GRAD", department: "LING" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { stranger_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Phonology Handbook", item_type: "BOOK", publication_year: 2015, isbn: "978-0-000-00061-5", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${owner_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: Patron
              as_user_id: "${owner_id}"
              captures: { err_noauth: $.data.error_id }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: Patron
              as_user_id: "${stranger_id}"
              captures: { err_owner: $.data.error_id }
            - call: "GET /ill/requests/${req_id}"
              payload: {}
              as: Patron
              as_user_id: "${owner_id}"
              captures: { ok_patron: $.data.patron_id }
            - call: "GET /ill/requests"
              payload: { patron_id: "${owner_id}", limit: 101 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_limit: $.data.error_id }
          assert:
            - "${err_noauth} == ERR_UNAUTHENTICATED with HTTP 401 — priority 10 runs before any role or ownership logic"
            - "${err_owner} == ERR_NOT_RESOURCE_OWNER with HTTP 403, and specifically not ERR_UNAUTHORIZED, because Patron is a permitted role on this endpoint"
            - "${ok_patron} == ${owner_id} — the owning patron reads its own request"
            - "${err_limit} == ERR_INVALID_REQUEST with HTTP 400 — limit must be inside 1..100"
            - "The same list call with limit 100 succeeds and returns total_count == 1"
            - "Every error response carries meta.api_request_id, meta.api_request_timestamp and data.error_id with data.message, and no entity payload"

