# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Grounds reference SCAFFOLD.yaml §1.1–§1.6 elements only.
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: shrink_provisional_vs_settlement_divergence
        grounds: ["calculations.provisional_shrink", "calculations.settlement_shrink", "entities.GrainLot.fields.provisional_shrink_bu", "entities.LoadOut.fields.ticket_shrink_bu"]
        distinguishing_aspect: |
          GrainLot-domain dual variant: PROVISIONAL computes 27.00 bu shrink once on the whole lot at fill
          moisture (17.0%), while SETTLEMENT computes 16.20 bu across per-ticket delivery moisture (16.5%) —
          same physical grain, different shrink totals, and the book remainder 189.20 proves the divergence.
        test_recipe:
          setup: ["bin BIN-A corn cap 5000", "lot 1000.00 bu @17.0% filled 2026-08-01 (provisional shrink 27.00, current 973.00)", "corn contract 2000 bu", "loadout planned 800.00 dispatched"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-A", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_a: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_a}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_a: $.data.id, lot_a_prov: $.data.provisional_shrink_bu } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_a: $.data.id, con_a_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_a}", bin_id: "${bin_a}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 800.00, expected_contract_version: "${con_a_v}" }, as: SiteManager, captures: { lo_a: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_a}/dispatch", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_a}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 400.00, moisture_pct: 16.5 }, { ticket_no: "T2", gross_bu: 400.00, moisture_pct: 16.5 } ] }, as: SiteManager, captures: { lo_shrink: $.data.ticket_shrink_bu, lo_net: $.data.settled_net_bu } }
            - { call: "POST /grain/loadouts/${lo_a}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/lots/${lot_a}", payload: {}, as: SiteManager, captures: { lot_a_cur: $.data.current_bu } }
          assert:
            - "GrainLot.${lot_a}.provisional_shrink_bu == 27.00 (PROVISIONAL variant)"
            - "LoadOut.${lo_a}.ticket_shrink_bu == 16.20 and settled_net_bu == 783.80 (SETTLEMENT variant)"
            - "LoadOut.${lo_a}.ticket_shrink_bu != GrainLot.${lot_a}.provisional_shrink_bu (16.20 != 27.00)"
            - "GrainLot.${lot_a}.current_bu == 189.20 after waterfall (973.00 - 783.80)"
      - name: indemnity_spot_vs_contract_avg_divergence
        grounds: ["calculations.indemnity", "entities.InsurancePolicy.fields.valuation_clause", "entities.InsuranceClaim.fields.indemnity_cents"]
        distinguishing_aspect: |
          InsuranceClaim-domain dual variant (different entity domain than GrainLot shrink): identical 100.00 bu
          loss values at 420.00 cents under SPOT (indemnity 37000) but at the contracted-bushel-weighted average
          456.67 cents under CONTRACT_AVG (indemnity 40667).
        test_recipe:
          setup: ["two corn bins each with a CONFIRMED_LOSS alert of 100.00 bu closed 2026-08-05T12:00:00Z", "SPOT policy limit 1000000 deductible 5000", "CONTRACT_AVG policy same terms", "two OPEN corn contracts: 430c x 10000 bu and 470c x 20000 bu, windows covering 2026-08-05"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-S", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_s: $.data.id } }
            - { call: "POST /grain/bins", payload: { name: "BIN-C", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_c: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_s}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [85.0, 90.0, 88.0], insect_activity: false }, as: SiteManager }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_c}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [85.0, 90.0, 88.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_s}" }, as: SiteManager, captures: { alert_s: "$.data[0].id" } }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_c}" }, as: SiteManager, captures: { alert_c: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T12:00:00Z" }, as: SiteManager }
            - { call: "POST /grain/spoilage-alerts/${alert_s}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 100.00 }, as: SiteManager }
            - { call: "POST /grain/spoilage-alerts/${alert_c}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 100.00 }, as: SiteManager }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: FarmOwner, captures: { pol_s: $.data.id } }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "CONTRACT_AVG", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: FarmOwner, captures: { pol_c: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 10000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 20000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: 10, futures_ref_cents_per_bu: 460 }, as: FarmOwner }
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_s}", spoilage_alert_id: "${alert_s}" }, as: SiteManager, captures: { claim_s: $.data.id } }
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_c}", spoilage_alert_id: "${alert_c}" }, as: SiteManager, captures: { claim_c: $.data.id } }
          trigger:
            - { call: "POST /grain/claims/${claim_s}/approve", payload: { spot_price_cents_per_bu: 420 }, as: FarmOwner }
            - { call: "POST /grain/claims/${claim_c}/approve", payload: {}, as: FarmOwner }
            - { call: "GET /grain/claims/${claim_s}", payload: {}, as: FarmOwner, captures: { cs_ind: $.data.indemnity_cents, cs_unit: $.data.unit_value_cents } }
            - { call: "GET /grain/claims/${claim_c}", payload: {}, as: FarmOwner, captures: { cc_ind: $.data.indemnity_cents, cc_unit: $.data.unit_value_cents } }
          assert:
            - "InsuranceClaim.${claim_s}.loss_bu == InsuranceClaim.${claim_c}.loss_bu == 100.00 (identical loss)"
            - "SPOT: unit_value_cents == 420.00, gross_indemnity_cents == 42000, indemnity_cents == 37000"
            - "CONTRACT_AVG: unit_value_cents == 456.67, gross_indemnity_cents == 45667, indemnity_cents == 40667"
            - "indemnity_cents differ: 37000 != 40667 for identical loss_bu and identical policy terms"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_multi_input_threshold
        grounds: ["calculations.spoilage_risk_score", "calculations.posture_derivation", "entities.TemperatureReading.fields.score_after"]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear clamp terms plus a crop-conditional moisture threshold: with
          moisture 17.0 vs corn std 15.0 (12.5), 15 days staleness (7.5), insect flag (10), T_max 86.0/ambient 60.0
          lands exactly on 70.00 -> ALERT (>= boundary), while T_max 85.9 lands 69.75 -> WATCH; neither trips the
          independent hotspot rule (delta < 30), so posture is score-driven only.
        test_recipe:
          setup: ["two corn bins each with a 1000.00 bu lot @17.0% filled 2026-08-01", "readings recorded 2026-08-16 with insect_activity=true, ambient 60.0"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-H", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_h: $.data.id } }
            - { call: "POST /grain/bins", payload: { name: "BIN-L", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_l: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_h}", crop: "CORN", grade: "GRADE_2", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_l}", crop: "CORN", grade: "GRADE_2", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
          trigger:
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_h}", recorded_at: "2026-08-16T00:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [70.0, 86.0, 80.0], insect_activity: true }, as: SiteManager, captures: { score_h: $.data.score_after, hot_h: $.data.hotspot_triggered } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_l}", recorded_at: "2026-08-16T00:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [70.0, 85.9, 80.0], insect_activity: true }, as: SiteManager, captures: { score_l: $.data.score_after, hot_l: $.data.hotspot_triggered } }
            - { call: "GET /grain/bins/${bin_h}", payload: {}, as: SiteManager, captures: { post_h: $.data.posture } }
            - { call: "GET /grain/bins/${bin_l}", payload: {}, as: SiteManager, captures: { post_l: $.data.posture } }
          assert:
            - "TemperatureReading(score_h) == 70.00 and hotspot_triggered == false"
            - "TemperatureReading(score_l) == 69.75 and hotspot_triggered == false"
            - "Bin.${bin_h}.posture == ALERT (score >= 70.00 inclusive)"
            - "Bin.${bin_l}.posture == WATCH (69.75 < 70.00)"
            - "GET /grain/spoilage-alerts?bin_id=${bin_h} total_count == 0 (score-driven ALERT raises no alert entity)"
      - name: shrink_per_ticket_rounding_order
        grounds: ["calculations.settlement_shrink", "entities.LoadOut.fields.settled_net_bu"]
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode than risk_score's mode (a)): shrink is rounded per
          ticket (2.025 -> 2.03 each) THEN summed (4.06 / net 195.94); the forbidden sum-then-round order would
          give 4.05 / 195.95. The assert pins 195.94, which only the pinned order produces.
        test_recipe:
          setup: ["corn bin with lot 500.00 bu @15.0% (no provisional shrink, current 500.00)", "corn contract 2000 bu", "loadout planned 195.94, dispatched"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-R", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_r: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_r}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_r: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_r: $.data.id, con_r_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_r}", bin_id: "${bin_r}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 195.94, expected_contract_version: "${con_r_v}" }, as: SiteManager, captures: { lo_r: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_r}/dispatch", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_r}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 16.5 }, { ticket_no: "T2", gross_bu: 100.00, moisture_pct: 16.5 } ] }, as: SiteManager, captures: { lo_r_shrink: $.data.ticket_shrink_bu, lo_r_net: $.data.settled_net_bu } }
          assert:
            - "LoadOut.${lo_r}.ticket_shrink_bu == 4.06 (per-ticket 2.03 + 2.03)"
            - "LoadOut.${lo_r}.settled_net_bu == 195.94, NOT 195.95 (sum-then-round is forbidden)"
            - "LoadOut.${lo_r}.gross_bu == 200.00"
      - name: settlement_fee_tier_evaluation_order
        grounds: ["calculations.settlement_charges", "entities.LoadOut.fields.service_fee_cents", "entities.StorageContract.fields.contract_unit_price_cents"]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the fee tier is keyed on the
          PRE-FEE grain value (500200 >= 500000 -> 75bps -> fee 3752), even though the post-fee net 496448 falls
          below the 500000 tier floor; an implementation keying the tier on the net would charge 5002.
        test_recipe:
          setup: ["corn bin with lot 1500.00 bu @15.0%", "corn contract 5000 bu, futures 500 basis 0 (unit price 500c), no early bonus (early_cutoff null, bonus 0)", "loadout planned 1000.40, dispatched, delivered net 1000.40"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-F", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_f: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_f}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 5000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: 0, futures_ref_cents_per_bu: 500, early_bonus_cents_per_bu: 0 }, as: FarmOwner, captures: { con_f: $.data.id, con_f_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_f}", bin_id: "${bin_f}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 1000.40, expected_contract_version: "${con_f_v}" }, as: SiteManager, captures: { lo_f: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_f}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_f}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 1000.40, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_f}/confirm-settlement", payload: {}, as: SiteManager, captures: { gv: $.data.grain_value_cents, fee: $.data.service_fee_cents, net: $.data.settlement_net_cents } }
          assert:
            - "LoadOut.${lo_f}.grain_value_cents == 500200 (1000.40 x 500)"
            - "LoadOut.${lo_f}.service_fee_cents == 3752 (75bps tier chosen on PRE-FEE value 500200; post-fee net is below the tier floor)"
            - "LoadOut.${lo_f}.early_bonus_cents == 0"
            - "LoadOut.${lo_f}.settlement_net_cents == 496448"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: loadout_parallel_dimensions_hold_cycle
        grounds: ["state_machines.LoadOut", "state_machines.LoadOut.SCHEDULED_to_HELD", "state_machines.LoadOut.HELD_to_SCHEDULED", "state_machines.Bin"]
        distinguishing_aspect: |
          Parallel state dimensions on LoadOut: transport cycles SCHEDULED -> HELD -> SCHEDULED via posture while
          settlement_status stays UNSETTLED, then moves DELIVERED (transport) independently of UNSETTLED ->
          SETTLED (settlement) — two dimensions evolving on one entity.
        test_recipe:
          setup: ["corn bin, lot 1000.00 @15.0% filled 2026-08-01", "corn contract 2000 bu", "loadout planned 400.00 SCHEDULED/UNSETTLED"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-P", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_p: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_p}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_p: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_p: $.data.id, con_p_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_p}", bin_id: "${bin_p}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 400.00, expected_contract_version: "${con_p_v}" }, as: SiteManager, captures: { lo_p: $.data.id } }
          trigger:
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_p}", recorded_at: "2026-08-02T00:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/loadouts/${lo_p}", payload: {}, as: SiteManager, captures: { lo_p_tr1: $.data.transport_status, lo_p_se1: $.data.settlement_status } }
            - { call: "GET /grain/lots/${lot_p}", payload: {}, as: SiteManager, captures: { lot_p_st1: $.data.status } }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_p}" }, as: SiteManager, captures: { al_p: "$.data[0].id" } }
            - { call: "POST /grain/spoilage-alerts/${al_p}/close", payload: { outcome: "RESOLVED" }, as: SiteManager }
            - { call: "GET /grain/loadouts/${lo_p}", payload: {}, as: SiteManager, captures: { lo_p_tr2: $.data.transport_status, lo_p_se2: $.data.settlement_status } }
            - { call: "GET /grain/lots/${lot_p}", payload: {}, as: SiteManager, captures: { lot_p_st2: $.data.status } }
            - { call: "POST /grain/loadouts/${lo_p}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_p}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 400.00, moisture_pct: 15.0 } ] }, as: SiteManager, captures: { lo_p_tr3: $.data.transport_status, lo_p_se3: $.data.settlement_status } }
          assert:
            - "after hotspot reading: transport_status == HELD and settlement_status == UNSETTLED and lot status == SUSPENDED (score 50.50 < 70; alert drives ALERT)"
            - "after alert close: transport_status == SCHEDULED (release cycle) and settlement_status == UNSETTLED and lot status == STORED; bin posture == WATCH (50.50 in [40,70))"
            - "after deliver: transport_status == DELIVERED while settlement_status == UNSETTLED (dimensions independent)"
      - name: contract_fulfilled_reverts_to_delivering
        grounds: ["state_machines.StorageContract", "state_machines.LoadOut.SETTLED_to_VOIDED"]
        distinguishing_aspect: |
          Cyclic revert on StorageContract (different entity than LoadOut): confirm-settlement drives
          DELIVERING -> FULFILLED at exactly the tolerance, void-settlement reverts FULFILLED -> DELIVERING, and
          a second settle completes the cycle back to FULFILLED.
        test_recipe:
          setup: ["corn bin, lot 1000.00 @15.0%", "corn contract 1000 bu (tolerance floor 980.00)", "loadout L1 planned 980.00 settled net 980.00 -> FULFILLED"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-CY", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_cy: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_cy}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_cy: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 1000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_cy: $.data.id, con_cy_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_cy}", bin_id: "${bin_cy}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 980.00, expected_contract_version: "${con_cy_v}" }, as: SiteManager, captures: { lo_cy1: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_cy1}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_cy1}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 980.00, moisture_pct: 15.0 } ] }, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_cy1}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/contracts/${con_cy}", payload: {}, as: SiteManager, captures: { con_cy_st1: $.data.status, con_cy_v2: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts/${lo_cy1}/void-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/contracts/${con_cy}", payload: {}, as: SiteManager, captures: { con_cy_st2: $.data.status, con_cy_v3: $.data.version, con_cy_dlv: $.data.delivered_bu } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_cy}", bin_id: "${bin_cy}", scheduled_start: "2026-08-11T08:00:00Z", scheduled_end: "2026-08-11T12:00:00Z", planned_bu: 980.00, expected_contract_version: "${con_cy_v3}" }, as: SiteManager, captures: { lo_cy2: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_cy2}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_cy2}/deliver", payload: { delivered_at: "2026-08-11T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 980.00, moisture_pct: 15.0 } ] }, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_cy2}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/contracts/${con_cy}", payload: {}, as: SiteManager, captures: { con_cy_st3: $.data.status } }
            - { call: "GET /grain/lots/${lot_cy}", payload: {}, as: SiteManager, captures: { lot_cy_cur: $.data.current_bu, lot_cy_st: $.data.status } }
          assert:
            - "after first confirm: contract status == FULFILLED (980.00 >= 980.00)"
            - "after void-settlement: contract status == DELIVERING and delivered_bu == 0.00 (revert transition)"
            - "after second settle cycle: contract status == FULFILLED again"
            - "GrainLot.${lot_cy}.current_bu == 0.00 and status == DEPLETED (void restored bushels, second settle re-drew them)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: hotspot_cascade_depth4
        grounds: ["state_machines.Bin", "state_machines.LoadOut.SCHEDULED_to_HELD", "state_machines.GrainLot", "calculations.posture_derivation", "entities.StorageContract.fields.committed_bu"]
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /grain/temperature-readings: hotspot reading -> creates OPEN
          SpoilageAlert (1) -> Bin.posture ALERT (2) -> SCHEDULED LoadOut HELD (3) -> contract.committed_bu
          debited 400.00 -> 0.00 (4, caused by the HELD transition, not by the reading directly); lot SUSPENDED
          rides link 3.
        test_recipe:
          setup: ["corn bin with lot 800.00 @15.0%", "corn contract 2000 bu", "loadout planned 400.00 SCHEDULED, contract.committed_bu == 400.00"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-X", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_x: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_x}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_x: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_x: $.data.id, con_x_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_x}", bin_id: "${bin_x}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 400.00, expected_contract_version: "${con_x_v}" }, as: SiteManager, captures: { lo_x: $.data.id } }
          trigger:
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_x}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [85.0, 90.0, 88.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_x}" }, as: SiteManager, captures: { al_x: "$.data[0].id", al_x_st: "$.data[0].status" } }
            - { call: "GET /grain/bins/${bin_x}", payload: {}, as: SiteManager, captures: { bin_x_post: $.data.posture } }
            - { call: "GET /grain/loadouts/${lo_x}", payload: {}, as: SiteManager, captures: { lo_x_tr: $.data.transport_status, lo_x_hr: $.data.held_reason } }
            - { call: "GET /grain/contracts/${con_x}", payload: {}, as: SiteManager, captures: { con_x_com: $.data.committed_bu } }
            - { call: "GET /grain/lots/${lot_x}", payload: {}, as: SiteManager, captures: { lot_x_st: $.data.status } }
          assert:
            - "link 1: SpoilageAlert.${al_x}.status == OPEN (hotspot delta 30.0 >= 30.0)"
            - "link 2: Bin.${bin_x}.posture == ALERT"
            - "link 3: LoadOut.${lo_x}.transport_status == HELD and held_reason == POSTURE; GrainLot.${lot_x}.status == SUSPENDED"
            - "link 4: StorageContract.${con_x}.committed_bu == 0.00 (was 400.00; HELD loadouts exit the committed set)"
      - name: settlement_cascade_depth3
        grounds: ["state_machines.LoadOut.UNSETTLED_to_SETTLED", "state_machines.GrainLot", "calculations.allocation_waterfall", "entities.Bin.fields.current_inventory_bu"]
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (confirm-settlement, not a reading): waterfall debit -> lot A
          reaches 0.00 and auto-DEPLETES (2) -> bin.current_inventory_bu recomputed over the reduced lot set (3);
          contract accumulation + FULFILLED ride the same trigger's parallel branch.
        test_recipe:
          setup: ["corn bin with lot A 500.00 @15.0% filled 2026-08-01 and lot B 800.00 @15.0% filled 2026-08-03", "corn contract 2000 bu", "loadout planned 650.00, delivered net 650.00"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-Y", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_y: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_y}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_ya: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_y}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-03T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_yb: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_y: $.data.id, con_y_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_y}", bin_id: "${bin_y}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 650.00, expected_contract_version: "${con_y_v}" }, as: SiteManager, captures: { lo_y: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_y}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_y}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 650.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_y}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/lots/${lot_ya}", payload: {}, as: SiteManager, captures: { ya_cur: $.data.current_bu, ya_st: $.data.status } }
            - { call: "GET /grain/lots/${lot_yb}", payload: {}, as: SiteManager, captures: { yb_cur: $.data.current_bu, yb_st: $.data.status } }
            - { call: "GET /grain/bins/${bin_y}", payload: {}, as: SiteManager, captures: { bin_y_inv: $.data.current_inventory_bu } }
            - { call: "GET /grain/contracts/${con_y}", payload: {}, as: SiteManager, captures: { con_y_dlv: $.data.delivered_bu } }
          assert:
            - "link 1-2: lot A current_bu == 0.00 and status == DEPLETED (FIFO: fill_date 08-01 drawn first)"
            - "link 1: lot B current_bu == 650.00 and status == PARTIALLY_DRAWN (drawn 150.00)"
            - "link 3: Bin.${bin_y}.current_inventory_bu == 650.00"
            - "StorageContract.${con_y}.delivered_bu == 650.00"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_dispatch
        grounds: ["validations[priority=13]", "validations[priority=15]", "errors[ERR_LOADOUT_STATE]", "errors[ERR_BIN_POSTURE_BLOCKED]"]
        distinguishing_aspect: |
          Category pair state vs business_safety: dispatching a HELD loadout on an ALERT bin violates both
          ERR_LOADOUT_STATE (p13) and ERR_BIN_POSTURE_BLOCKED (p15); the state error must win.
        test_recipe:
          setup: ["corn bin with lot 800.00 @15.0%", "contract 2000, loadout planned 400.00 SCHEDULED", "hotspot reading flips bin ALERT and the loadout HELD"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-D", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_d: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_d}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_d: $.data.id, con_d_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_d}", bin_id: "${bin_d}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 400.00, expected_contract_version: "${con_d_v}" }, as: SiteManager, captures: { lo_d: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_d}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_d}/dispatch", payload: {}, as: SiteManager, captures: { err_d: $.data.error_id } }
          assert:
            - "error_id == ERR_LOADOUT_STATE (state, priority 13), NOT ERR_BIN_POSTURE_BLOCKED (safety, priority 15)"
            - "HTTP status == 409"
      - name: safety_beats_fiscal_on_loadout_create
        grounds: ["validations[priority=15]", "validations[priority=31]", "errors[ERR_BIN_POSTURE_BLOCKED]", "errors[ERR_CONTRACT_REMAINING_EXCEEDED]"]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (different pair than state/safety above): creating a
          loadout on a FUMIGATION_LOCKOUT bin with planned_bu 5000.00 > remaining 100.00 violates both
          ERR_BIN_POSTURE_BLOCKED (p15) and ERR_CONTRACT_REMAINING_EXCEEDED (p31); safety must win.
        test_recipe:
          setup: ["corn bin under active PHOSPHINE fumigation starting 2026-08-01 (posture FUMIGATION_LOCKOUT)", "corn contract 100 bu (remaining 100.00)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-G", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_g: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice Applicator", license_no: "LIC-1", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_g: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_g}", applicator_id: "${app_g}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_g}" }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 100.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_g: $.data.id, con_g_v: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_g}", bin_id: "${bin_g}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 5000.00, expected_contract_version: "${con_g_v}" }, as: SiteManager, captures: { err_g: $.data.error_id } }
          assert:
            - "error_id == ERR_BIN_POSTURE_BLOCKED (safety, priority 15), NOT ERR_CONTRACT_REMAINING_EXCEEDED (fiscal, priority 31)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: rei_boundary_exact_72h
        grounds: ["calculations.posture_derivation", "state_machines.FumigationRecord", "validations[priority=17]", "errors[ERR_REI_NOT_ELAPSED]"]
        distinguishing_aspect: |
          Metric: elapsed time. PHOSPHINE REI = 72h: clear at lockout_until - 1s fails ERR_REI_NOT_ELAPSED; clear
          at exactly application_start + 72h succeeds (>= boundary). Endpoint: POST /grain/fumigations/{id}/clear.
        test_recipe:
          setup: ["corn bin", "applicators A (applies) and B (clears — segregation)", "PHOSPHINE fumigation application_start 2026-08-01T00:00:00Z, lockout_until 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-T", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_t: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_a: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Bob B", license_no: "LIC-B", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_b: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_t}", applicator_id: "${app_a}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_a}", captures: { fum_t: $.data.id, fum_lu: $.data.lockout_until } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:59:59Z" }, as: SiteManager }
            - { call: "POST /grain/fumigations/${fum_t}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_b}", captures: { err_t: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: SiteManager }
            - { call: "POST /grain/fumigations/${fum_t}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_b}", captures: { fum_st: $.data.status, fum_ca: $.data.cleared_at } }
            - { call: "GET /grain/bins/${bin_t}", payload: {}, as: SiteManager, captures: { bin_t_post: $.data.posture } }
          assert:
            - "at 2026-08-03T23:59:59Z: error_id == ERR_REI_NOT_ELAPSED (one second early)"
            - "FumigationRecord.lockout_until == 2026-08-04T00:00:00Z (PHOSPHINE 72h)"
            - "at exactly 2026-08-04T00:00:00Z: clear succeeds, status == CLEARED, cleared_at == 2026-08-04T00:00:00Z"
            - "Bin.${bin_t}.posture == SOUND after clear (lockout lifted, no alerts, no lots)"
      - name: fulfillment_ratio_boundary_98pct
        grounds: ["calculations.contract_fulfillment", "state_machines.StorageContract", "entities.StorageContract.fields.fulfillment_ratio"]
        distinguishing_aspect: |
          Metric: bushels ratio (different metric than REI time; different endpoint: confirm-settlement). The
          comparison is pinned on bushels (delivered >= contracted x 0.98): delivering exactly 9800.00 of 10000.00
          FULFILLS, while 9799.99 does NOT — even though both display fulfillment_ratio 0.9800 at 4dp.
        test_recipe:
          setup: ["corn bin cap 30000 with lotA 9800.00 @15.0% and lotB 9799.99 @15.0%", "contract A 10000 bu, contract B 10000 bu", "loadout A delivers net 9800.00; loadout B (next day window) delivers net 9799.99"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-98", capacity_bu: 30000, crop: "CORN" }, as: SiteManager, captures: { bin_98: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_98}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 9800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_98a: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_98}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 9799.99, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_98b: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 10000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_98a: $.data.id, con_98a_v: $.data.version } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 10000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_98b: $.data.id, con_98b_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_98a}", bin_id: "${bin_98}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 9800.00, expected_contract_version: "${con_98a_v}" }, as: SiteManager, captures: { lo_98a: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_98a}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_98a}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 9800.00, moisture_pct: 15.0 } ] }, as: SiteManager }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_98b}", bin_id: "${bin_98}", scheduled_start: "2026-08-11T08:00:00Z", scheduled_end: "2026-08-11T12:00:00Z", planned_bu: 9799.99, expected_contract_version: "${con_98b_v}" }, as: SiteManager, captures: { lo_98b: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_98b}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_98b}/deliver", payload: { delivered_at: "2026-08-11T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 9799.99, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_98a}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_98b}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/contracts/${con_98a}", payload: {}, as: SiteManager, captures: { c98a_st: $.data.status, c98a_ra: $.data.fulfillment_ratio } }
            - { call: "GET /grain/contracts/${con_98b}", payload: {}, as: SiteManager, captures: { c98b_st: $.data.status, c98b_ra: $.data.fulfillment_ratio } }
          assert:
            - "Contract A: delivered_bu == 9800.00 >= 9800.00 -> status == FULFILLED"
            - "Contract B: delivered_bu == 9799.99 < 9800.00 -> status == DELIVERING"
            - "B.fulfillment_ratio == 0.9800 at 4dp display — identical display to A, opposite status (bushel comparison is authoritative)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loadout_create_gated_by_bin_posture
        grounds: ["validations[priority=15]", "state_machines.Bin", "entities.LoadOut.fields.bin_id"]
        distinguishing_aspect: |
          Entity pair (LoadOut, Bin): loadout creation requires the referenced Bin's posture in {SOUND, WATCH};
          with the bin ALERT (hotspot-driven) the create is rejected ERR_BIN_POSTURE_BLOCKED.
        test_recipe:
          setup: ["corn bin with lot 800.00 @15.0%, ALERT via hotspot reading", "corn contract 2000 bu OPEN"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-G1", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_g1: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_g1}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_g1}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_g1: $.data.id, con_g1_v: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_g1}", bin_id: "${bin_g1}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 400.00, expected_contract_version: "${con_g1_v}" }, as: SiteManager, captures: { err_g1: $.data.error_id } }
          assert:
            - "Bin.${bin_g1}.posture == ALERT (precondition state)"
            - "error_id == ERR_BIN_POSTURE_BLOCKED, HTTP 409 — LoadOut creation depends on Bin state"
      - name: permit_approve_gated_by_fumigation
        grounds: ["validations[priority=16]", "state_machines.FumigationRecord", "entities.BinEntryPermit.fields.bin_id"]
        distinguishing_aspect: |
          Entity pair (BinEntryPermit, FumigationRecord) — different pair than (LoadOut, Bin): approving a permit
          whose bin has an ACTIVE fumigation with application_start <= now is rejected
          ERR_ACTIVE_FUMIGATION_EXISTS even though the permit itself is REQUESTED and atmosphere/LOTO pass.
        test_recipe:
          setup: ["corn bin under ACTIVE PHOSPHINE fumigation (start 2026-08-01T00:00:00Z, default clock)", "permit REQUESTED with atmosphere_test_passed=true, loto_confirmed=true"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-G2", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_g2: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_g2: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_g2}", applicator_id: "${app_g2}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_g2}" }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_g2}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_g2: $.data.id } }
          trigger:
            - { call: "POST /grain/entry-permits/${per_g2}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1", captures: { err_g2: $.data.error_id } }
          assert:
            - "error_id == ERR_ACTIVE_FUMIGATION_EXISTS, HTTP 409 — permit approval depends on FumigationRecord state"
      - name: claim_submit_gated_by_alert
        grounds: ["validations[priority=27]", "state_machines.SpoilageAlert", "entities.InsuranceClaim.fields.spoilage_alert_id"]
        distinguishing_aspect: |
          Entity pair (InsuranceClaim, SpoilageAlert) — third distinct pair: submitting a claim against an alert
          still OPEN is rejected ERR_ALERT_LOSS_NOT_CONFIRMED; the claim's validity depends on the alert's state.
        test_recipe:
          setup: ["corn bin with hotspot reading -> alert OPEN (never closed)", "ACTIVE corn policy covering the period"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-G3", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_g3: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_g3}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_g3}" }, as: SiteManager, captures: { al_g3: "$.data[0].id" } }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: FarmOwner, captures: { pol_g3: $.data.id } }
          trigger:
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_g3}", spoilage_alert_id: "${al_g3}" }, as: SiteManager, captures: { err_g3: $.data.error_id } }
          assert:
            - "SpoilageAlert.${al_g3}.status == OPEN (precondition state)"
            - "error_id == ERR_ALERT_LOSS_NOT_CONFIRMED, HTTP 409"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: loadout_window_half_open_adjacency
        grounds: ["validations[priority=21]", "entities.LoadOut.fields.scheduled_start", "entities.LoadOut.fields.scheduled_end"]
        distinguishing_aspect: |
          Resource Bin, HALF-OPEN semantics: a loadout starting exactly at another's end (12:00:00 == 12:00:00)
          is ACCEPTED, while one minute of overlap (11:59:59) is rejected ERR_WINDOW_OVERLAP.
        test_recipe:
          setup: ["corn bin with lot 5000.00 @15.0%", "corn contract 2000 bu OPEN; L1 [08-10 08:00, 12:00) planned 100 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-O", capacity_bu: 8000, crop: "CORN" }, as: SiteManager, captures: { bin_o: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_o}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 5000.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_o: $.data.id, con_o_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_o}", bin_id: "${bin_o}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_o_v}" }, as: SiteManager, captures: { lo_o1: $.data.id } }
            - { call: "GET /grain/contracts/${con_o}", payload: {}, as: SiteManager, captures: { con_o_v2: $.data.version } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_o}", bin_id: "${bin_o}", scheduled_start: "2026-08-10T12:00:00Z", scheduled_end: "2026-08-10T16:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_o_v2}" }, as: SiteManager, captures: { lo_o2: $.data.id } }
            - { call: "GET /grain/contracts/${con_o}", payload: {}, as: SiteManager, captures: { con_o_v3: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_o}", bin_id: "${bin_o}", scheduled_start: "2026-08-10T11:59:59Z", scheduled_end: "2026-08-10T13:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_o_v3}" }, as: SiteManager, captures: { err_o: $.data.error_id } }
          assert:
            - "adjacent [12:00:00,16:00:00) after [08:00:00,12:00:00) -> created (touching endpoints allowed, half-open)"
            - "overlapping [11:59:59,13:00:00) -> error_id == ERR_WINDOW_OVERLAP, HTTP 409"
      - name: applicator_interval_closed_touching
        grounds: ["validations[priority=22]", "entities.FumigationRecord.fields.application_start", "entities.FumigationRecord.fields.application_end"]
        distinguishing_aspect: |
          Resource Applicator (different entity than Bin), CLOSED semantics (different geometry than half-open):
          a fumigation starting exactly when the applicator's previous one ends (12:00:00 == 12:00:00) CONFLICTS
          (touching endpoints conflict), while starting one second later is accepted.
        test_recipe:
          setup: ["two corn bins", "applicator Alice with fumigation F1 on BIN-Q1 occupying [2026-08-01T08:00:00Z, 2026-08-01T12:00:00Z]"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-Q1", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_q1: $.data.id } }
            - { call: "POST /grain/bins", payload: { name: "BIN-Q2", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_q2: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_q: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_q1}", applicator_id: "${app_q}", product: "PHOSPHINE", application_start: "2026-08-01T08:00:00Z", application_end: "2026-08-01T12:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_q}", captures: { fum_q1: $.data.id } }
          trigger:
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_q2}", applicator_id: "${app_q}", product: "PHOSPHINE", application_start: "2026-08-01T12:00:00Z", application_end: "2026-08-01T14:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_q}", captures: { err_q: $.data.error_id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_q2}", applicator_id: "${app_q}", product: "PHOSPHINE", application_start: "2026-08-01T12:00:01Z", application_end: "2026-08-01T14:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_q}", captures: { fum_q2: $.data.id } }
          assert:
            - "touching [12:00:00,14:00:00] after [08:00:00,12:00:00] -> error_id == ERR_APPLICATOR_DOUBLE_BOOKED (closed intervals: touching conflicts)"
            - "[12:00:01,14:00:00] -> created (HTTP 201)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: bushel_conservation_settle_void
        grounds: ["calculations.allocation_waterfall", "calculations.provisional_shrink", "state_machines.LoadOut.UNSETTLED_to_SETTLED", "state_machines.LoadOut.SETTLED_to_VOIDED", "entities.GrainLot.fields.current_bu"]
        distinguishing_aspect: |
          Conserved quantity: BUSHELS. Per bin, sum(original_bu) == sum(current_bu) + sum(settled_net_bu of
          SETTLED loadouts) + sum(ShrinkEvent shrink_bu): 973.00 current + 476.65 settled + 27.00 shrink ==
          1000.00 original after confirm; void-settlement restores 973.00 + 0 + 27.00 == 1000.00.
        test_recipe:
          setup: ["corn bin with lot 1000.00 @17.0% (provisional shrink 27.00, current 973.00)", "corn contract 2000 bu", "loadout planned 476.65 dispatched"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-I", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_i: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_i}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 17.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_i: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_i: $.data.id, con_i_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_i}", bin_id: "${bin_i}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 476.65, expected_contract_version: "${con_i_v}" }, as: SiteManager, captures: { lo_i: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_i}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_i}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 486.50, moisture_pct: 16.5 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_i}/confirm-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/lots/${lot_i}", payload: {}, as: SiteManager, captures: { lot_i_c1: $.data.current_bu } }
            - { call: "GET /grain/lots/${lot_i}/shrink-events", payload: {}, as: SiteManager, captures: { se_i0: "$.data[0].shrink_bu" } }
            - { call: "POST /grain/loadouts/${lo_i}/void-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/lots/${lot_i}", payload: {}, as: SiteManager, captures: { lot_i_c2: $.data.current_bu } }
          assert:
            - "after confirm: current_bu 496.35 + settled_net_bu 476.65 + shrink events 27.00 == 1000.00 original (identity holds forward)"
            - "shrink-events list: total_count == 1, $.data[0].kind == PROVISIONAL, shrink_bu == 27.00"
            - "after void: current_bu == 973.00; 973.00 + 0 (no SETTLED loadouts) + 27.00 == 1000.00 (compensation restores the invariant exactly)"
      - name: money_conservation_settle_void
        grounds: ["calculations.settlement_charges", "state_machines.LoadOut.SETTLED_to_VOIDED", "entities.StorageContract.fields.settled_value_cents"]
        distinguishing_aspect: |
          Conserved quantity: DOLLARS (different quantity than bushels). contract.settled_value_cents tracks the
          sum of settlement_net_cents over SETTLED loadouts: confirm sets it to 4231395 (value 4214000 - fee
          31605 + bonus 49000); void-settlement returns it to exactly 0 with no drift.
        test_recipe:
          setup: ["corn bin with lot 9800.00 @15.0%", "corn contract 10000 bu, futures 450 basis -20 (unit 430), early bonus 5c before 2026-09-01", "loadout planned 9800.00 delivered net 9800.00 at 2026-08-10T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-M", capacity_bu: 12000, crop: "CORN" }, as: SiteManager, captures: { bin_m: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_m}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 9800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 10000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450, early_bonus_cents_per_bu: 5, early_cutoff: "2026-09-01T00:00:00Z" }, as: FarmOwner, captures: { con_m: $.data.id, con_m_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_m}", bin_id: "${bin_m}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 9800.00, expected_contract_version: "${con_m_v}" }, as: SiteManager, captures: { lo_m: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_m}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_m}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 9800.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_m}/confirm-settlement", payload: {}, as: SiteManager, captures: { lo_m_net: $.data.settlement_net_cents } }
            - { call: "GET /grain/contracts/${con_m}", payload: {}, as: SiteManager, captures: { con_m_sv1: $.data.settled_value_cents, con_m_st1: $.data.status } }
            - { call: "POST /grain/loadouts/${lo_m}/void-settlement", payload: {}, as: SiteManager }
            - { call: "GET /grain/contracts/${con_m}", payload: {}, as: SiteManager, captures: { con_m_sv2: $.data.settled_value_cents, con_m_st2: $.data.status } }
          assert:
            - "after confirm: LoadOut.settlement_net_cents == 4231395 and contract.settled_value_cents == 4231395, status FULFILLED (9800.00 >= 10000.00 x 0.98)"
            - "after void: contract.settled_value_cents == 0 exactly and delivered_bu == 0.00 and status == DELIVERING (no monetary drift)"
