            - "CxProject.${p}.verified_prefunctional_units == 10"
            - "Issue.${i1}.retainage_hold_cents == 24000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: failed_functional_test_cascades_to_certification_credit_withdrawal
        grounds:
          - state_machines.FunctionalTest.IN_PROGRESS_to_FAILED
          - state_machines.EquipmentUnit.verification_status.PREFUNCTIONAL_VERIFIED_to_UNVERIFIED
          - state_machines.CertificationCredit.SUBMITTED_to_WITHDRAWN
          - calculations.credit_evidence_freshness
          - calculations.credit_documentation_score
          - calculations.issue_retainage_hold
          - entities.CxProject.fields.withdrawn_credit_count
        distinguishing_aspect: |
          Four hops, each caused by the previous one: recording a FAILED result
          opens a blocking S1 issue, that issue demotes the equipment to
          UNVERIFIED, that demotion stales the EQUIPMENT_VERIFICATION evidence
          row, and that staling drops the credit's final_tier to NONE which
          withdraws the already SUBMITTED credit; the originating transition is
          FunctionalTest IN_PROGRESS -> FAILED, distinct from the
          Issue IN_REVIEW -> VERIFIED_CLOSED origin of the other cascade.
