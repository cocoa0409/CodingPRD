      - name: fmv_opinion_with_narrative_method_rejected
        claim_type: Violation → Error
        grounds:
          - errors[ERR_OPINION_METHOD_MISMATCH]
          - validations[priority=23]
          - validations[priority=22]
        distinguishing_aspect: |
          opinion_type and method must agree: FMV admits only INCOME_APPROACH or
          MARKET_APPROACH, and a NARRATIVE FMV is refused with
