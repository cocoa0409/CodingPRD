          setup:
            - "Firm 'Weald Chandler LLP' with engagement partner Ines Vale, QC director Quinn Cade and managing partner Marek Doyle (the plan owner, so acceptance and verification by Quinn Cade never breach segregation of duties)."
            - "Engagement 'Harrow Textiles' (AUDIT, period_end 2026-06-30, is_public_interest false, so eqr_required is false) is driven all the way to REPORT_RELEASED."
            - "InternalInspection 2026 selects that engagement by partner coverage and is moved to IN_PROGRESS."
            - "One DEFICIENCY finding is raised, root-caused with FISHBONE and 3 contributing factors (depth_score 9.00), and remediated by a plan with action_specificity_score 10.00 and action_count 2, so raw_completeness is 0.40*9.00 + 0.35*10.00 = 7.10, tier STANDARD, no lateness, acceptance_score 7.10 >= 7.00."
