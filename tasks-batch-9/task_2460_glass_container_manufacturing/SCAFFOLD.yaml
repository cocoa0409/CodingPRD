scenario: |
  Generate task harder than expert level!

  2460. Glass Container Manufacturing (O-I Glass plant): furnace campaign management with pull rate, refractory life and rebuild scheduling, batch house raw material and cullet ratio control with color change planning, forming machine job changes with mold set inventory and changeover downtime, inspection line rejection by defect class with pack-to-melt yield tracking, customer mold ownership, design approval and lead times for new bottle designs, lightweighting programs balancing material savings against breakage risk, warehouse aging, palletization standards and shipment to filling lines, complaint investigation on line breakage at the customer with lot traceability
domain_name: glass-container-manufacturing
api_prefix: /glass-plant

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: expert_plus
  rationale: |
    The finite pool is furnace melt capacity (design pull tons over a campaign window) and refractory
    life units, both reserved by scheduled production jobs and released on cancellation — a quota /
    allocation core. Layered on it is temporal windowing: forming-machine job windows are half-open
    with a changeover buffer, while batch-house color-change windows are closed intervals aggregated
    over a rolling 30 days on the furnace. Pack-to-melt yield is a dual-variant calculation
    (provisional at pack time vs final after inspection and transition-loss attribution), refractory
    posture and lot disposition are rate/threshold triggers, and complaint investigation cascades
    from lot traceability into customer standing and lightweighting-program suspension.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Furnace
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: plant furnace identifier
        constraints: unique, 1-32 chars
      - name: design_pull_tpd
        type: number
        source: input
        description: nameplate design pull in tons per day
        constraints: "> 0, <= 600, 2 decimal places"
      - name: current_color
        type: enum
        source: computed
        description: glass color currently being melted; advanced by COMPLETED ColorChange
        constraints: "FLINT | AMBER | GREEN"
        default: FLINT
      - name: refractory_life_total_units
        type: number
        source: input
        description: total refractory life budget for the current campaign in wear units
        constraints: "> 0, 2 decimal places"
      - name: refractory_consumed_units
        type: number
        source: computed
        description: cumulative refractory wear charged by closed production jobs
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: refractory_remaining_pct
        type: number
        source: computed
        description: "100 * (1 - refractory_consumed_units / refractory_life_total_units), round_half_up to 2dp"
        default: 100.00
        constraints: clamped to [0.00, 100.00]
      - name: posture
        type: enum
        source: computed
        description: gating posture derived from refractory_remaining_pct and campaign state
        constraints: "OPERATING | RESTRICTED | REBUILD_DUE | COLD"
        default: OPERATING
      - name: reserved_pull_tons
        type: number
        source: computed
        description: melt tons reserved by SCHEDULED and RUNNING production jobs
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: campaign_count
        type: integer
        source: computed
        description: number of Campaign rows created against this furnace
        default: 0
        constraints: ">= 0"

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: furnace_id
        type: string
        source: input
        description: FK -> Furnace.id
      - name: code
        type: string
        source: input
        description: campaign identifier
        constraints: unique, 1-32 chars
      - name: target_pull_tpd
        type: number
        source: input
        description: planned average pull for this campaign in tons per day
        constraints: "> 0, 2 decimal places"
      - name: window_start_at
        type: datetime
        source: input
        description: campaign start instant
      - name: window_end_at
        type: datetime
        source: input
        description: campaign end instant
        constraints: strictly after window_start_at
      - name: status
        type: enum
        source: computed
        description: campaign lifecycle state
        constraints: "PLANNED | ACTIVE | WIND_DOWN | REBUILD_SCHEDULED | CLOSED"
        default: PLANNED
      - name: melt_tons_charged
        type: number
        source: computed
        description: "cumulative melt tons charged to this campaign: reserved_melt_tons of every closed or aborted job plus transition_loss_tons of every completed colour change on the furnace while this campaign is ACTIVE or WIND_DOWN"
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: packed_tons
        type: number
        source: computed
        description: cumulative net packed tons from released pack lots
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: transition_loss_tons
        type: number
        source: computed
        description: melt tons attributed to color transitions charged to this campaign
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: reject_loss_tons
        type: number
        source: computed
        description: melt tons lost to inspection rejects on this campaign's lots
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: unaccounted_loss_tons
        type: number
        source: computed
        description: "melt_tons_charged - packed_tons - transition_loss_tons - reject_loss_tons"
        default: 0
        constraints: 2 decimal places, may be 0
      - name: projected_refractory_units_nominal
        type: number
        source: computed
        description: nominal-variant refractory projection for the campaign window
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: rebuild_window_start_at
        type: datetime
        source: computed
        description: scheduled cold-repair start; null until REBUILD_SCHEDULED
        default: null
      - name: rebuild_window_end_at
        type: datetime
        source: computed
        description: scheduled cold-repair end; null until REBUILD_SCHEDULED
        default: null

  - name: BatchRecipe
    parent: null
    common_fields: true
    fields:
      - name: furnace_id
        type: string
        source: input
        description: FK -> Furnace.id
      - name: code
        type: string
        source: input
        description: recipe identifier
        constraints: unique, 1-32 chars
      - name: color
        type: enum
        source: input
        description: glass color this recipe melts
        constraints: "FLINT | AMBER | GREEN"
      - name: cullet_ratio_pct
        type: number
        source: input
        description: external plus internal cullet share of the batch; the 95.00 ceiling is the type range, while the tighter colour-purity ceiling per colour is enforced by the business rule at priority 24
        constraints: ">= 0.00, <= 95.00, 2 decimal places"
      - name: soda_ash_kg_per_ton
        type: number
        source: input
        description: soda ash charge per melted ton
        constraints: "> 0, 2 decimal places"
      - name: colorant_kg_per_ton
        type: number
        source: input
        description: colorant charge per melted ton
        constraints: ">= 0, 2 decimal places"
      - name: approved
        type: boolean
        source: computed
        description: whether the batch house has approved this recipe for production
        default: false
      - name: cullet_stress_factor
        type: number
        source: computed
        description: "max(0, cullet_ratio_pct - 45.00) / 100, round_half_up to 4dp"
        default: 0
        constraints: ">= 0.0000"

  - name: ColorChange
    parent: null
    common_fields: true
    fields:
      - name: furnace_id
        type: string
        source: input
        description: FK -> Furnace.id
      - name: from_color
        type: enum
        source: computed
        description: color melted before the change; snapshot of Furnace.current_color at scheduling
        constraints: "FLINT | AMBER | GREEN"
      - name: to_color
        type: enum
        source: input
        description: target color after the change
        constraints: "FLINT | AMBER | GREEN, must differ from from_color"
      - name: window_start_at
        type: datetime
        source: input
        description: transition window start (closed interval)
      - name: window_end_at
        type: datetime
        source: input
        description: transition window end (closed interval)
        constraints: strictly after window_start_at
      - name: transition_loss_tons
        type: number
        source: input
        description: melt tons expected to be off-spec during the transition
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: color change lifecycle state
        constraints: "SCHEDULED | COMPLETED | ABORTED"
        default: SCHEDULED

  - name: FormingMachine
    parent: null
    common_fields: true
    fields:
      - name: furnace_id
        type: string
        source: input
        description: FK -> Furnace.id
      - name: code
        type: string
        source: input
        description: forming machine identifier
        constraints: unique, 1-32 chars
      - name: section_count
        type: integer
        source: input
        description: number of IS-machine sections
        constraints: ">= 4, <= 20"
      - name: max_cavities
        type: integer
        source: input
        description: total cavity slots available across all sections
        constraints: ">= 4, <= 80"
      - name: mounted_cavities
        type: integer
        source: computed
        description: cavities occupied by currently MOUNTED mold sets
        default: 0
        constraints: ">= 0, <= max_cavities"
      - name: primary_mold_family
        type: enum
        source: input
        description: mold family the machine is tooled for; a foreign family costs extra swap time
        constraints: "NNPB | BLOW_BLOW | PRESS_BLOW"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: mandatory idle buffer appended after each job window
        default: 45
        constraints: ">= 0, <= 240"
      - name: status
        type: enum
        source: computed
        description: machine availability state
        constraints: "IDLE | RUNNING"
        default: IDLE

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: filler / brand owner name
        constraints: 1-120 chars
      - name: account_code
        type: string
        source: input
        description: customer account identifier
        constraints: unique, 1-32 chars
      - name: palletization_standard
        type: enum
        source: input
        description: pallet pattern the customer's filling lines accept
        constraints: "EURO_1200x800 | GMA_1200x1000"
      - name: complaint_ppm_threshold
        type: number
        source: input
        description: contractual breakage ppm threshold used for quality standing
        constraints: "> 0, <= 20000, 2 decimal places"
      - name: quality_standing
        type: enum
        source: computed
        description: standing derived from weighted breakage ppm across credited complaints
        constraints: "GOOD | WATCH | CRITICAL"
        default: GOOD
      - name: weighted_breakage_ppm
        type: number
        source: computed
        description: units-weighted mean breakage ppm over CREDIT_ISSUED complaints, round_half_up to 2dp
        default: 0
        constraints: ">= 0"
      - name: credit_issued_usd
        type: number
        source: computed
        description: cumulative complaint credit granted to this customer
        default: 0
        constraints: ">= 0, 2 decimal places"

  - name: BottleDesign
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: supersedes_design_id
        type: string
        source: input
        description: FK -> BottleDesign.id; self-referential predecessor design, null for an original design
        default: null
      - name: code
        type: string
        source: input
        description: design identifier
        constraints: unique, 1-32 chars
      - name: color
        type: enum
        source: input
        description: glass color the design requires
        constraints: "FLINT | AMBER | GREEN"
      - name: capacity_ml
        type: number
        source: input
        description: filled capacity in millilitres
        constraints: ">= 50, <= 3000, 2 decimal places"
      - name: nominal_weight_g
        type: number
        source: input
        description: nominal container weight in grams
        constraints: "> 0, <= 1500, 2 decimal places"
      - name: min_wall_thickness_mm
        type: number
        source: input
        description: minimum design wall thickness
        constraints: ">= 0.80, <= 6.00, 2 decimal places"
      - name: cavity_count
        type: integer
        source: input
        description: cavities required by the mold set for this design
        constraints: ">= 1, <= 20"
      - name: target_line_speed_bpm
        type: number
        source: input
        description: customer filling-line speed in bottles per minute
        constraints: "> 0, <= 900, 2 decimal places"
      - name: container_price_usd
        type: number
        source: input
        description: contracted price per container, used as the complaint credit basis
        constraints: "> 0, <= 5, 4 decimal places"
      - name: mold_owner
        type: enum
        source: input
        description: who owns the mold equipment for this design
        constraints: "CUSTOMER | PLANT"
      - name: status
        type: enum
        source: computed
        description: design approval lifecycle state
        constraints: "DRAFT | SUBMITTED | CHANGES_REQUESTED | RISK_SIGNED | APPROVED | OBSOLETE"
        default: DRAFT
      - name: revision_count
        type: integer
        source: computed
        description: number of resubmissions after a CHANGES_REQUESTED cycle
        default: 0
        constraints: ">= 0"
      - name: breakage_risk_index
        type: number
        source: computed
        description: composite breakage risk score for the design, round_half_up to 2dp
        default: 0
        constraints: "0.00 to 100.00"
      - name: lead_time_days
        type: integer
        source: computed
        description: promised lead time from approval to first production availability
        default: 0
        constraints: ">= 30"
      - name: risk_signed_by_user_id
        type: string
        source: computed
        description: X-User-ID that recorded the risk sign-off; null until RISK_SIGNED
        default: null
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID that approved the design; null until APPROVED
        default: null

  - name: LightweightingProgram
    parent: null
    common_fields: true
    fields:
      - name: baseline_design_id
        type: string
        source: input
        description: FK -> BottleDesign.id
      - name: code
        type: string
        source: input
        description: program identifier
        constraints: unique, 1-32 chars
      - name: target_weight_g
        type: number
        source: input
        description: proposed lightweighted container weight
        constraints: "> 0, must be < baseline design nominal_weight_g, 2 decimal places"
      - name: annual_volume_units
        type: integer
        source: input
        description: forecast annual volume the savings apply to
        constraints: ">= 1000, <= 500000000"
      - name: resin_free_glass_price_per_kg
        type: number
        source: input
        description: glass cost basis used for material savings
        constraints: "> 0, <= 10, 4 decimal places"
      - name: status
        type: enum
        source: computed
        description: program lifecycle state
        constraints: "DRAFT | RISK_ASSESSED | PILOT | ADOPTED | SUSPENDED | REJECTED | SUPERSEDED"
        default: DRAFT
      - name: weight_saved_g
        type: number
        source: computed
        description: baseline nominal_weight_g minus target_weight_g, 2dp
        default: 0
        constraints: "> 0 once computed"
      - name: gross_savings_usd
        type: number
        source: computed
        description: annual gross material savings before risk reserve, 2dp
        default: 0
      - name: savings_tier
        type: enum
        source: computed
        description: tier keyed on gross_savings_usd
        constraints: "TIER_A | TIER_B | TIER_C"
        default: TIER_A
      - name: breakage_risk_delta
        type: number
        source: computed
        description: risk index delta between target weight and baseline weight, 2dp
        default: 0
      - name: risk_reserve_usd
        type: number
        source: computed
        description: reserve withheld against breakage exposure, 2dp
        default: 0
      - name: net_savings_usd
        type: number
        source: computed
        description: gross_savings_usd minus risk_reserve_usd, 2dp
        default: 0
      - name: customer_rebate_usd
        type: number
        source: computed
        description: rebate owed to the customer out of net savings, 2dp
        default: 0
      - name: pilot_decided_by_user_id
        type: string
        source: computed
        description: X-User-ID that recorded the customer pilot decision
        default: null

  - name: ProductionJob
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id
      - name: furnace_id
        type: string
        source: input
        description: FK -> Furnace.id
      - name: forming_machine_id
        type: string
        source: input
        description: FK -> FormingMachine.id
      - name: batch_recipe_id
        type: string
        source: input
        description: FK -> BatchRecipe.id
      - name: bottle_design_id
        type: string
        source: input
        description: FK -> BottleDesign.id
      - name: mold_set_id
        type: string
        source: input
        description: FK -> MoldSet.id
        default: null
      - name: code
        type: string
        source: input
        description: job identifier
        constraints: unique, 1-32 chars
      - name: window_start_at
        type: datetime
        source: input
        description: job window start (half-open, inclusive)
      - name: window_end_at
        type: datetime
        source: input
        description: job window end (half-open, exclusive)
        constraints: strictly after window_start_at
      - name: planned_pull_tpd
        type: number
        source: input
        description: pull rate requested for this job in tons per day
        constraints: "> 0, 2 decimal places"
      - name: reserved_melt_tons
        type: number
        source: computed
        description: "planned_pull_tpd * window duration in days, round_half_up to 2dp"
        default: 0
      - name: projected_refractory_units_nominal
        type: number
        source: computed
        description: refractory_wear nominal variant for this job's window, computed at create, 2dp
        default: 0
      - name: projected_refractory_units_stress_adjusted
        type: number
        source: computed
        description: refractory_wear stress_adjusted variant for this job's window, computed at create, 2dp
        default: 0
      - name: changeover_minutes
        type: integer
        source: computed
        description: downtime charged for mounting this job's mold set
        default: 0
        constraints: ">= 0, <= 240"
      - name: refractory_wear_units
        type: number
        source: computed
        description: refractory wear charged at close, stress_adjusted variant, 2dp
        default: 0
      - name: produced_units
        type: integer
        source: input
        description: containers formed and packed at close
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: job lifecycle state
        constraints: "SCHEDULED | RUNNING | COMPLETED | ABORTED | CANCELLED"
        default: SCHEDULED
      - name: outcome_note
        type: string
        source: input
        description: free-text close note
        default: null
        constraints: 0-400 chars

  - name: MoldSet
    parent: null
    common_fields: true
    fields:
      - name: bottle_design_id
        type: string
        source: input
        description: FK -> BottleDesign.id
      - name: forming_machine_id
        type: string
        source: input
        description: FK -> FormingMachine.id; machine the set is currently mounted on, null when not mounted
        default: null
      - name: code
        type: string
        source: input
        description: mold set identifier
        constraints: unique, 1-32 chars
      - name: cavity_count
        type: integer
        source: input
        description: cavities in this mold set
        constraints: ">= 1, <= 20"
      - name: mold_family
        type: enum
        source: input
        description: mold body family determining swap effort
        constraints: "NNPB | BLOW_BLOW | PRESS_BLOW"
      - name: owner
        type: enum
        source: input
        description: equipment ownership
        constraints: "CUSTOMER | PLANT"
      - name: condition_score
        type: integer
        source: input
        description: mold condition on a 0-100 scale, 100 is new
        constraints: ">= 0, <= 100"
      - name: status
        type: enum
        source: computed
        description: mold set inventory state
        constraints: "AVAILABLE | MOUNTED | IN_REPAIR | SCRAPPED"
        default: AVAILABLE
      - name: mount_count
        type: integer
        source: computed
        description: number of times this set has been mounted
        default: 0
        constraints: ">= 0"

  - name: PackLot
    parent: null
    common_fields: true
    fields:
      - name: production_job_id
        type: string
        source: computed
        description: FK -> ProductionJob.id
      - name: campaign_id
        type: string
        source: computed
        description: FK -> Campaign.id
      - name: bottle_design_id
        type: string
        source: computed
        description: FK -> BottleDesign.id
      - name: customer_id
        type: string
        source: computed
        description: FK -> Customer.id
      - name: lot_code
        type: string
        source: computed
        description: "traceable lot identifier printed on the pallet label, derived as <job code>-L1"
        constraints: unique, 1-40 chars
      - name: packed_units
        type: integer
        source: computed
        description: containers packed into the lot, copied from the job's produced_units
        default: 0
        constraints: ">= 0"
      - name: unit_weight_g
        type: number
        source: computed
        description: container weight used for tonnage conversion, 2dp
        default: 0
      - name: reject_units
        type: integer
        source: computed
        description: total rejected units across inspection results
        default: 0
        constraints: ">= 0"
      - name: net_packed_units
        type: integer
        source: computed
        description: packed_units minus reject_units
        default: 0
        constraints: ">= 0"
      - name: major_ppm
        type: number
        source: computed
        description: major-class defect parts per million, round_half_up to 1dp
        default: 0
      - name: minor_ppm
        type: number
        source: computed
        description: minor-class defect parts per million, round_half_up to 1dp
        default: 0
      - name: provisional_yield_pct
        type: number
        source: computed
        description: provisional pack-to-melt yield at pack time, 2dp
        default: 0
      - name: final_yield_pct
        type: number
        source: computed
        description: final pack-to-melt yield after inspection and transition attribution, 2dp
        default: 0
      - name: palletization_standard
        type: enum
        source: computed
        description: pallet pattern snapshot from the customer at pack time
        constraints: "EURO_1200x800 | GMA_1200x1000"
      - name: pallet_count
        type: integer
        source: computed
        description: pallets required for net_packed_units under the palletization standard
        default: 0
        constraints: ">= 0"
      - name: aged_until_at
        type: datetime
        source: computed
        description: instant before which the lot may not be palletized
        default: null
      - name: quality_status
        type: enum
        source: computed
        description: quality dimension of the lot's parallel state
        constraints: "PENDING_INSPECTION | RELEASED | QUARANTINED | SCRAPPED"
        default: PENDING_INSPECTION
      - name: logistics_status
        type: enum
        source: computed
        description: logistics dimension of the lot's parallel state
        constraints: "IN_AGING | PALLETIZED | SHIPPED | RETURNED"
        default: IN_AGING
      - name: shipped_at
        type: datetime
        source: computed
        description: instant the lot left for the filling line
        default: null

  - name: InspectionResult
    parent: null
    common_fields: false
    fields:
      - name: pack_lot_id
        type: string
        source: input
        description: FK -> PackLot.id
      - name: defect_class
        type: enum
        source: input
        description: inspection defect classification
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: defect_code
        type: enum
        source: input
        description: specific defect observed on the inspection line
        constraints: "CHECK_CRACK | BIRDSWING | THIN_WALL | STONE | BLISTER | OVERPRESS | SPLIT_FINISH"
      - name: rejected_units
        type: integer
        source: input
        description: units rejected under this defect class and code
        constraints: ">= 1"
      - name: inspected_at
        type: datetime
        source: input
        description: instant the inspection reading was taken
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the quality engineer who recorded the reading

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id
      - name: pack_lot_id
        type: string
        source: input
        description: FK -> PackLot.id
      - name: code
        type: string
        source: input
        description: complaint identifier
        constraints: unique, 1-32 chars
      - name: reported_at
        type: datetime
        source: input
        description: instant the filling line reported line breakage
      - name: affected_units
        type: integer
        source: input
        description: units the customer reports as broken or unusable
        constraints: ">= 1"
      - name: filling_line_speed_bpm
        type: number
        source: input
        description: line speed observed during the breakage event
        constraints: "> 0, <= 900, 2 decimal places"
      - name: breakage_ppm
        type: number
        source: computed
        description: "1000000 * affected_units / lot net_packed_units, round_half_up to 1dp"
        default: 0
      - name: attribution
        type: enum
        source: computed
        description: investigation conclusion on root cause
        constraints: "UNDETERMINED | PLANT | CUSTOMER | SHARED"
        default: UNDETERMINED
      - name: status
        type: enum
        source: computed
        description: complaint lifecycle state
        constraints: "OPEN | INVESTIGATING | CREDIT_ISSUED | REJECTED"
        default: OPEN
      - name: credit_usd
        type: number
        source: computed
        description: credit granted for the complaint, 2dp
        default: 0
      - name: affected_pallets
        type: integer
        source: computed
        description: "ceil(affected_units / units_per_pallet) for the lot's palletization standard"
        default: 0
      - name: investigated_by_user_id
        type: string
        source: computed
        description: X-User-ID that ran the investigation
        default: null

state_machines:
  - entity: Campaign
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /glass-plant/campaigns/{campaign_id}/activate"
        actor: PlantManager
        preconditions:
          - "campaign.status == PLANNED"
          - "furnace.posture != COLD"
          - "no other campaign on the same furnace is in ACTIVE or WIND_DOWN"
        side_effects:
          - "sets Furnace.posture per furnace_posture_derivation"
          - "sets Campaign.projected_refractory_units_nominal via refractory_wear nominal variant over the campaign window"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: WIND_DOWN
        trigger: "POST /glass-plant/campaigns/{campaign_id}/wind-down"
        actor: PlantManager
        preconditions:
          - "campaign.status == ACTIVE"
          - "no ProductionJob on this campaign is in RUNNING"
        side_effects:
          - "cascades CANCELLED to every ProductionJob on this campaign still in SCHEDULED whose window_start_at is on or after the logical clock at the wind-down instant; a SCHEDULED job whose window has already opened is left untouched for the plant to close or cancel by hand"
          - "releases each cancelled job's reserved_melt_tons from Furnace.reserved_pull_tons"
          - "increments Campaign.version by 1"
        note: "auto-triggered as a side effect when a job close drives Furnace.refractory_remaining_pct to <= 5.00; a SCHEDULED job already inside its window survives the cascade and therefore still blocks schedule-rebuild via ERR_OPEN_JOBS_PRESENT"
      - from: WIND_DOWN
        to: REBUILD_SCHEDULED
        trigger: "POST /glass-plant/campaigns/{campaign_id}/schedule-rebuild"
        actor: PlantManager
        preconditions:
          - "campaign.status == WIND_DOWN"
          - "every ProductionJob on this campaign is in COMPLETED, ABORTED or CANCELLED"
          - "rebuild_window_start_at is strictly after campaign.window_end_at"
        side_effects:
          - "sets Campaign.rebuild_window_start_at and rebuild_window_end_at"
          - "sets Furnace.posture to COLD"
          - "cascades ABORTED to every ColorChange on this furnace still in SCHEDULED whose window_start_at is on or after rebuild_window_start_at"
          - "increments Campaign.version by 1"
      - from: REBUILD_SCHEDULED
        to: CLOSED
        trigger: "POST /glass-plant/campaigns/{campaign_id}/close"
        actor: PlantManager
        preconditions:
          - "campaign.status == REBUILD_SCHEDULED"
          - "every PackLot on this campaign has quality_status in RELEASED, QUARANTINED or SCRAPPED"
        side_effects:
          - "recomputes Campaign.unaccounted_loss_tons from the campaign melt ledger"
          - "resets Furnace.refractory_consumed_units to 0 and refractory_remaining_pct to 100.00"
          - "sets Furnace.posture to OPERATING"
          - "increments Campaign.version by 1"

  - entity: ColorChange
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /glass-plant/color-changes/{color_change_id}/complete"
        actor: BatchHouseTech
        preconditions:
          - "color_change.status == SCHEDULED"
          - "current logical clock is on or after color_change.window_end_at"
          - "no ProductionJob in RUNNING overlaps the color-change window"
        side_effects:
          - "sets Furnace.current_color to color_change.to_color"
          - "adds color_change.transition_loss_tons to Campaign.melt_tons_charged of the furnace's ACTIVE or WIND_DOWN campaign, if any, and recomputes that campaign's unaccounted_loss_tons"
          - "increments ColorChange.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /glass-plant/color-changes/{color_change_id}/abort"
        actor: BatchHouseTech
        preconditions:
          - "color_change.status == SCHEDULED"
        side_effects:
          - "leaves Furnace.current_color unchanged"
          - "increments ColorChange.version by 1"
        note: "also reached as a cascade side effect of Campaign schedule-rebuild"

  - entity: BottleDesign
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /glass-plant/bottle-designs/{bottle_design_id}/submit"
        actor: MoldEngineer
        preconditions:
          - "bottle_design.status == DRAFT"
        side_effects:
          - "computes BottleDesign.breakage_risk_index via breakage_risk_index"
          - "computes BottleDesign.lead_time_days via design_lead_time_days"
          - "increments BottleDesign.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /glass-plant/bottle-designs/{bottle_design_id}/request-changes"
        actor: QualityEngineer
        preconditions:
          - "bottle_design.status == SUBMITTED"
        side_effects:
          - "increments BottleDesign.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /glass-plant/bottle-designs/{bottle_design_id}/submit"
        actor: MoldEngineer
        preconditions:
          - "bottle_design.status == CHANGES_REQUESTED"
        side_effects:
          - "increments BottleDesign.revision_count by 1"
          - "recomputes breakage_risk_index and lead_time_days with the new revision_count"
          - "increments BottleDesign.version by 1"
        note: "cyclic: each resubmission lengthens lead time by 7 days per revision"
      - from: SUBMITTED
        to: RISK_SIGNED
        trigger: "POST /glass-plant/bottle-designs/{bottle_design_id}/risk-signoff"
        actor: QualityEngineer
        preconditions:
          - "bottle_design.status == SUBMITTED"
          - "bottle_design.breakage_risk_index <= 55.00"
        side_effects:
          - "records BottleDesign.risk_signed_by_user_id from X-User-ID"
          - "increments BottleDesign.version by 1"
      - from: RISK_SIGNED
        to: APPROVED
        trigger: "POST /glass-plant/bottle-designs/{bottle_design_id}/approve"
        actor: QualityEngineer
        preconditions:
          - "bottle_design.status == RISK_SIGNED"
          - "X-User-ID differs from bottle_design.risk_signed_by_user_id"
        side_effects:
          - "records BottleDesign.approved_by_user_id from X-User-ID"
          - "sets the predecessor design referenced by supersedes_design_id to OBSOLETE when that predecessor is in APPROVED"
          - "increments BottleDesign.version by 1"
      - from: APPROVED
        to: OBSOLETE
        trigger: "system: a successor design carrying supersedes_design_id = this design is approved"
        actor: system
        preconditions:
          - "this design's status == APPROVED"
        side_effects:
          - "increments BottleDesign.version by 1"

  - entity: LightweightingProgram
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: RISK_ASSESSED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/assess-risk"
        actor: QualityEngineer
        preconditions:
          - "program.status == DRAFT"
          - "baseline design status == APPROVED"
        side_effects:
          - "computes weight_saved_g, gross_savings_usd, savings_tier, breakage_risk_delta, risk_reserve_usd, net_savings_usd, customer_rebate_usd via lightweighting_economics"
          - "increments LightweightingProgram.version by 1"
      - from: RISK_ASSESSED
        to: PILOT
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/customer-decision with decision=PILOT"
        actor: CustomerRep
        preconditions:
          - "program.status == RISK_ASSESSED"
          - "program.breakage_risk_delta <= 30.00"
          - "customer.quality_standing != CRITICAL"
        side_effects:
          - "records pilot_decided_by_user_id from X-User-ID"
          - "increments LightweightingProgram.version by 1"
      - from: RISK_ASSESSED
        to: REJECTED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/customer-decision with decision=REJECT"
        actor: CustomerRep
        preconditions:
          - "program.status == RISK_ASSESSED"
        side_effects:
          - "increments LightweightingProgram.version by 1"
      - from: PILOT
        to: ADOPTED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/adopt"
        actor: PlantManager
        preconditions:
          - "program.status == PILOT"
          - "customer.quality_standing == GOOD"
        side_effects:
          - "extends warehouse aging for future lots of the baseline design by 3 days"
          - "increments LightweightingProgram.version by 1"
      - from: PILOT
        to: SUSPENDED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/suspend"
        actor: QualityEngineer
        preconditions:
          - "program.status == PILOT"
        side_effects:
          - "increments LightweightingProgram.version by 1"
      - from: ADOPTED
        to: SUSPENDED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/suspend"
        actor: QualityEngineer
        preconditions:
          - "program.status == ADOPTED"
        side_effects:
          - "increments LightweightingProgram.version by 1"
        note: "also reached as a cascade when a PLANT-attributed complaint drives the customer to CRITICAL"
      - from: SUSPENDED
        to: RISK_ASSESSED
        trigger: "POST /glass-plant/lightweighting-programs/{program_id}/assess-risk"
        actor: QualityEngineer
        preconditions:
          - "program.status == SUSPENDED"
        side_effects:
          - "recomputes the full lightweighting_economics chain using the current baseline design breakage_risk_index"
          - "increments LightweightingProgram.version by 1"
        note: "cyclic: suspension returns the program to assessment with a re-derived risk reserve"
      - from: RISK_ASSESSED
        to: SUPERSEDED
        trigger: "system: a new LightweightingProgram is created on the same baseline_design_id"
        actor: system
        preconditions:
          - "program.status in DRAFT, RISK_ASSESSED, PILOT, ADOPTED or SUSPENDED"
        side_effects:
          - "increments LightweightingProgram.version by 1"
      - from: PILOT
        to: SUPERSEDED
        trigger: "system: a new LightweightingProgram is created on the same baseline_design_id"
        actor: system
        preconditions:
          - "program.status in DRAFT, RISK_ASSESSED, PILOT, ADOPTED or SUSPENDED"
        side_effects:
          - "increments LightweightingProgram.version by 1"

  - entity: MoldSet
    initial_state: AVAILABLE
    terminal_states: [SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: MOUNTED
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/start"
        actor: PlantScheduler
        preconditions:
          - "mold_set.status == AVAILABLE"
          - "mold_set.cavity_count + machine.mounted_cavities <= machine.max_cavities"
        side_effects:
          - "sets MoldSet.forming_machine_id to the job's forming_machine_id"
          - "increments MoldSet.mount_count by 1"
          - "adds mold_set.cavity_count to FormingMachine.mounted_cavities"
          - "increments MoldSet.version by 1"
      - from: MOUNTED
        to: AVAILABLE
        trigger: "POST /glass-plant/mold-sets/{mold_set_id}/unmount"
        actor: MoldEngineer
        preconditions:
          - "mold_set.status == MOUNTED"
          - "no ProductionJob referencing this mold set is in RUNNING"
        side_effects:
          - "clears MoldSet.forming_machine_id"
          - "subtracts mold_set.cavity_count from FormingMachine.mounted_cavities"
          - "increments MoldSet.version by 1"
      - from: AVAILABLE
        to: IN_REPAIR
        trigger: "POST /glass-plant/mold-sets/{mold_set_id}/send-to-repair"
        actor: MoldEngineer
        preconditions:
          - "mold_set.status == AVAILABLE"
        side_effects:
          - "increments MoldSet.version by 1"
      - from: IN_REPAIR
        to: AVAILABLE
        trigger: "POST /glass-plant/mold-sets/{mold_set_id}/return-from-repair with condition_score >= 40"
        actor: MoldEngineer
        preconditions:
          - "mold_set.status == IN_REPAIR"
          - "submitted condition_score >= 40"
        side_effects:
          - "sets MoldSet.condition_score to the submitted value"
          - "increments MoldSet.version by 1"
      - from: IN_REPAIR
        to: SCRAPPED
        trigger: "POST /glass-plant/mold-sets/{mold_set_id}/return-from-repair with condition_score < 40"
        actor: MoldEngineer
        preconditions:
          - "mold_set.status == IN_REPAIR"
          - "submitted condition_score < 40"
        side_effects:
          - "sets MoldSet.condition_score to the submitted value"
          - "increments MoldSet.version by 1"

  - entity: FormingMachine
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: RUNNING
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/start"
        actor: PlantScheduler
        preconditions:
          - "machine.status == IDLE"
        side_effects:
          - "increments FormingMachine.version by 1"
      - from: RUNNING
        to: IDLE
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/close"
        actor: PlantScheduler
        preconditions:
          - "machine.status == RUNNING"
        side_effects:
          - "increments FormingMachine.version by 1"

  - entity: ProductionJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/start"
        actor: PlantScheduler
        preconditions:
          - "job.status == SCHEDULED"
          - "campaign.status == ACTIVE"
          - "batch_recipe.approved == true"
          - "bottle_design.status == APPROVED"
          - "mold_set_id is not null and mold_set.status == AVAILABLE"
          - "furnace.posture in OPERATING or RESTRICTED"
        side_effects:
          - "computes ProductionJob.changeover_minutes via changeover_minutes"
          - "moves the mold set to MOUNTED and the forming machine to RUNNING"
          - "increments ProductionJob.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/close with outcome=COMPLETED"
        actor: PlantScheduler
        preconditions:
          - "job.status == RUNNING"
          - "produced_units >= 1"
        side_effects:
          - "computes ProductionJob.refractory_wear_units via refractory_wear stress_adjusted variant"
          - "adds refractory_wear_units to Furnace.refractory_consumed_units and recomputes refractory_remaining_pct and posture"
          - "adds job.reserved_melt_tons to Campaign.melt_tons_charged and releases it from Furnace.reserved_pull_tons"
          - "creates a PackLot in quality_status PENDING_INSPECTION and logistics_status IN_AGING with provisional_yield_pct and aged_until_at set"
          - "moves the forming machine to IDLE"
          - "auto-triggers Campaign WIND_DOWN when Furnace.refractory_remaining_pct <= 5.00"
          - "increments ProductionJob.version by 1"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/close with outcome=ABORTED"
        actor: PlantScheduler
        preconditions:
          - "job.status == RUNNING"
        side_effects:
          - "computes ProductionJob.refractory_wear_units via refractory_wear stress_adjusted variant and charges it to the furnace"
          - "adds job.reserved_melt_tons to Campaign.melt_tons_charged and releases it from Furnace.reserved_pull_tons"
          - "creates no PackLot"
          - "moves the forming machine to IDLE"
          - "increments ProductionJob.version by 1"
        note: "branching: close forks on the outcome field into COMPLETED or ABORTED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /glass-plant/production-jobs/{production_job_id}/cancel"
        actor: PlantScheduler
        preconditions:
          - "job.status == SCHEDULED"
        side_effects:
          - "subtracts job.reserved_melt_tons from Furnace.reserved_pull_tons"
          - "increments ProductionJob.version by 1"
        note: "also reached as a cascade when the campaign enters WIND_DOWN"

  - entity: PackLot
    initial_state: PENDING_INSPECTION
    terminal_states: [SCRAPPED]
    transitions:
      - from: PENDING_INSPECTION
        to: RELEASED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/release"
        actor: QualityEngineer
        preconditions:
          - "lot.quality_status == PENDING_INSPECTION"
          - "at least one InspectionResult exists for the lot"
          - "lot_quality_disposition yields RELEASED"
        side_effects:
          - "computes final_yield_pct via pack_to_melt_yield final variant"
          - "adds the lot's net packed tons to Campaign.packed_tons and its reject tons to Campaign.reject_loss_tons"
          - "charges the attributed color-transition tons to Campaign.transition_loss_tons"
          - "increments PackLot.version by 1"
      - from: PENDING_INSPECTION
        to: QUARANTINED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/release"
        actor: QualityEngineer
        preconditions:
          - "lot.quality_status == PENDING_INSPECTION"
          - "at least one InspectionResult exists for the lot"
          - "lot_quality_disposition yields QUARANTINED"
        side_effects:
          - "computes final_yield_pct via pack_to_melt_yield final variant"
          - "adds the lot's reject tons to Campaign.reject_loss_tons"
          - "increments PackLot.version by 1"
        note: "branching: one endpoint, three quality outcomes selected by lot_quality_disposition"
      - from: PENDING_INSPECTION
        to: SCRAPPED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/release"
        actor: QualityEngineer
        preconditions:
          - "lot.quality_status == PENDING_INSPECTION"
          - "at least one InspectionResult exists for the lot"
          - "lot_quality_disposition yields SCRAPPED"
        side_effects:
          - "adds the entire lot tonnage to Campaign.reject_loss_tons"
          - "increments PackLot.version by 1"
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/rework-release"
        actor: QualityEngineer
        preconditions:
          - "lot.quality_status == QUARANTINED"
          - "X-User-ID differs from every recorded_by_user_id on the lot's inspection results"
        side_effects:
          - "adds the lot's net packed tons to Campaign.packed_tons"
          - "increments PackLot.version by 1"
      - from: IN_AGING
        to: PALLETIZED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/palletize"
        actor: WarehouseOperator
        preconditions:
          - "lot.logistics_status == IN_AGING"
          - "current logical clock is on or after lot.aged_until_at"
        side_effects:
          - "sets PackLot.pallet_count via warehouse_aging_and_palletization"
          - "increments PackLot.version by 1"
        note: "logistics dimension advances independently of the quality dimension"
      - from: PALLETIZED
        to: SHIPPED
        trigger: "POST /glass-plant/pack-lots/{pack_lot_id}/ship"
        actor: WarehouseOperator
        preconditions:
          - "lot.logistics_status == PALLETIZED"
          - "lot.quality_status == RELEASED"
          - "lot.palletization_standard equals the customer's current palletization_standard"
        side_effects:
          - "sets PackLot.shipped_at to the current logical clock"
          - "increments PackLot.version by 1"
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /glass-plant/complaints/{complaint_id}/investigate with attribution=PLANT"
        actor: QualityEngineer
        preconditions:
          - "lot.logistics_status == SHIPPED"
        side_effects:
          - "sets PackLot.quality_status to QUARANTINED when it is RELEASED"
          - "increments PackLot.version by 1"

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [CREDIT_ISSUED, REJECTED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /glass-plant/complaints/{complaint_id}/investigate"
        actor: QualityEngineer
        preconditions:
          - "complaint.status == OPEN"
          - "lot.logistics_status == SHIPPED"
        side_effects:
          - "sets Complaint.attribution from the submitted value"
          - "records investigated_by_user_id from X-User-ID"
          - "on attribution PLANT or SHARED moves the lot's logistics_status to RETURNED and quarantines a RELEASED lot"
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: CREDIT_ISSUED
        trigger: "POST /glass-plant/complaints/{complaint_id}/settle with settlement=CREDIT"
        actor: CustomerRep
        preconditions:
          - "complaint.status == INVESTIGATING"
          - "complaint.attribution in PLANT or SHARED"
          - "X-User-ID differs from complaint.investigated_by_user_id"
        side_effects:
          - "computes Complaint.affected_pallets and credit_usd via complaint_credit_usd"
          - "adds credit_usd to Customer.credit_issued_usd"
          - "recomputes Customer.weighted_breakage_ppm and quality_standing via customer_quality_standing"
          - "suspends every LightweightingProgram in PILOT or ADOPTED on the customer's designs when quality_standing becomes CRITICAL"
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: REJECTED
        trigger: "POST /glass-plant/complaints/{complaint_id}/settle with settlement=REJECT"
        actor: CustomerRep
        preconditions:
          - "complaint.status == INVESTIGATING"
        side_effects:
          - "leaves Customer.credit_issued_usd and quality_standing unchanged"
          - "increments Complaint.version by 1"

concurrency_rules:
  - rule_id: job-create-stale-furnace
    parent_entity: Furnace
    write_endpoint: "POST /glass-plant/production-jobs"
    occ_field: "expected_furnace_version"
    description: |
      Creating a ProductionJob against a Furnace whose version has advanced since the client last
      observed it is rejected. Scheduling a job reserves melt tons out of the furnace's finite pull
      pool and bumps the furnace version; a writer holding an earlier version computed its capacity
      headroom from a pull pool that no longer reflects committed reservations, so the create is
      refused rather than silently over-subscribing the furnace.
    error_id: ERR_STALE_FURNACE_VERSION
    http_status: 412
  - rule_id: program-create-stale-design
    parent_entity: BottleDesign
    write_endpoint: "POST /glass-plant/lightweighting-programs"
    occ_field: "expected_design_version"
    description: |
      Creating a LightweightingProgram against a BottleDesign whose version has advanced since the
      client last observed it is rejected. A new program legitimately supersedes any non-terminal
      program on the same baseline design, so a writer whose view of the design is stale would
      supersede a program it never saw; the create is refused on the stale version instead.
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412

calculations:
  - name: pack_to_melt_yield
    trigger: "provisional variant on ProductionJob close (lot creation); final variant on PackLot release / rework-release"
    algorithm: aggregation
    formula: |
      packed_tons        = round_half_up(lot.packed_units * lot.unit_weight_g / 1000000, 2)
      net_packed_tons    = round_half_up(lot.net_packed_units * lot.unit_weight_g / 1000000, 2)
      attributed_transition_tons = transition_loss_tons of the attributed ColorChange (see input_set), else 0
      provisional_yield_pct = round_half_up(100 * packed_tons / job.reserved_melt_tons, 2)
      final_yield_pct       = round_half_up(100 * net_packed_tons
                                / (job.reserved_melt_tons + attributed_transition_tons), 2)
    input_set: |
      packed_units is the job's produced_units at close; net_packed_units subtracts the sum of
      rejected_units over ALL InspectionResult rows on the lot regardless of defect class.
      unit_weight_g is the snapshot of the bottle design's nominal_weight_g at close.
      Transition attribution: among ColorChange rows on the job's furnace with status COMPLETED and
      window_end_at <= job.window_start_at and (job.window_start_at - window_end_at) <= 7 days, take
      the one with the greatest window_end_at (tie-break created_at ASC); it is attributed to this job
      only if this job is the earliest ProductionJob on the campaign (by window_start_at, tie-break
      created_at ASC) whose window_start_at >= that window_end_at. Otherwise attribution is 0 tons.
    constants:
      GRAMS_PER_TON: 1000000
      TRANSITION_LOOKBACK_DAYS: 7
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed at lot creation, before any inspection reading exists"
        difference: "uses gross packed_units and charges only the job's reserved melt tons"
      - name: final
        when: "computed when the lot leaves PENDING_INSPECTION"
        difference: "uses net_packed_units and adds the attributed color-transition tons to the denominator, so it is always <= provisional for the same lot"

  - name: refractory_wear
    trigger: "nominal variant on campaign activate and on GET production-jobs/{id}/refractory-projection; stress_adjusted variant on ProductionJob close"
    algorithm: threshold
    formula: |
      window_days   = (window_end_at - window_start_at) / 86400 seconds        # fractional allowed
      color_factor  = COLOR_WEAR_FACTOR[recipe.color]
      base_units    = pull_tpd * window_days * color_factor
      over_pull     = max(0, (job.planned_pull_tpd - furnace.design_pull_tpd) / furnace.design_pull_tpd)
      stress_mult   = 1 + OVER_PULL_WEIGHT * over_pull + CULLET_STRESS_WEIGHT * recipe.cullet_stress_factor
      nominal_units         = round_half_up(base_units, 2)
      stress_adjusted_units = round_half_up(base_units * stress_mult, 2)
      # applied at close:
      furnace.refractory_consumed_units = round_half_up(prior_consumed + stress_adjusted_units, 2)
      furnace.refractory_remaining_pct  = clamp(round_half_up(100 * (1 -
          furnace.refractory_consumed_units / furnace.refractory_life_total_units), 2), 0.00, 100.00)
    input_set: |
      nominal variant on campaign activate uses pull_tpd = campaign.target_pull_tpd, the campaign
      window, and the color factor of the furnace's current_color. Both variants on a job use
      pull_tpd = job.planned_pull_tpd, the job window, and the job's batch recipe color.
    constants:
      COLOR_WEAR_FACTOR: { FLINT: 1.00, AMBER: 1.15, GREEN: 1.30 }
      OVER_PULL_WEIGHT: 2.0
      CULLET_STRESS_WEIGHT: 0.8
      CULLET_STRESS_FLOOR_PCT: 45.00
    precision: "2 decimal places, round_half_up; no intermediate rounding of stress_mult"
    variants:
      - name: nominal
        when: "planning: campaign projection and the job refractory-projection read"
        difference: "ignores over-pull and cullet stress entirely (stress_mult treated as 1)"
      - name: stress_adjusted
        when: "actual wear charged to the furnace at job close"
        difference: "multiplies base wear by the over-pull and cullet-stress multiplier, so it exceeds nominal whenever planned pull is above design pull or cullet ratio is above 45.00%"

  - name: changeover_minutes
    trigger: "ProductionJob start"
    algorithm: weighted_scoring
    formula: |
      family_factor   = FOREIGN_FAMILY_FACTOR if mold_set.mold_family != machine.primary_mold_family else 1.0
      swap_minutes    = SWAP_BASE_MINUTES * family_factor
      cavity_delta    = abs(mold_set.cavity_count - bottle_design.cavity_count)
      cavity_tier     = 0  if cavity_delta == 0
                        15 if 1 <= cavity_delta <= 2
                        35 if 3 <= cavity_delta <= 5
                        60 if cavity_delta > 5
      condition_pen   = 0  if mold_set.condition_score >= 85
                        10 if 71 <= mold_set.condition_score <= 84
                        25 if mold_set.condition_score <= 70
      changeover_minutes = min(CHANGEOVER_CAP_MINUTES,
                               round_half_up(swap_minutes + max(cavity_tier, condition_pen), 0))
    input_set: "the mold set named on the job, the job's forming machine, and the job's bottle design"
    constants:
      SWAP_BASE_MINUTES: 60
      FOREIGN_FAMILY_FACTOR: 1.5
      CHANGEOVER_CAP_MINUTES: 240
    precision: "integer minutes, round_half_up"

  - name: complaint_credit_usd
    trigger: "Complaint settle with settlement=CREDIT"
    algorithm: tiered_pricing
    formula: |
      units_per_pallet = UNITS_PER_PALLET[lot.palletization_standard]
      affected_pallets = ceil(complaint.affected_units / units_per_pallet)
      severity_share   = min(1.0000, round_half_up(complaint.breakage_ppm
                                                  / customer.complaint_ppm_threshold, 4))
      per_pallet_usd   = round_half_up(units_per_pallet * design.container_price_usd
                                       * severity_share * CREDIT_FACTOR, 2)
      credit_usd       = round_half_up(per_pallet_usd * affected_pallets, 2)
    input_set: |
      the complaint's lot supplies palletization_standard and net_packed_units (via breakage_ppm),
      the lot's bottle design supplies container_price_usd, the customer supplies the ppm threshold.
      Rounding order is normative: the per-pallet amount is rounded to cents FIRST and the rounded
      per-pallet amount is then multiplied by affected_pallets. Summing unrounded per-pallet amounts
      and rounding once at the end is incorrect.
    constants:
      UNITS_PER_PALLET: { EURO_1200x800: 1800, GMA_1200x1000: 2100 }
      CREDIT_FACTOR: 0.5
    precision: "2 decimal places, round_half_up; affected_pallets is a ceiling to whole pallets"

  - name: lightweighting_economics
    trigger: "LightweightingProgram assess-risk (from DRAFT or from SUSPENDED)"
    algorithm: tiered_pricing
    formula: |
      1. weight_saved_g       = round_half_up(baseline.nominal_weight_g - program.target_weight_g, 2)
      2. saved_kg             = weight_saved_g * program.annual_volume_units / 1000
      3. gross_savings_usd    = round_half_up(saved_kg * program.resin_free_glass_price_per_kg, 2)
      4. savings_tier         = TIER_A if gross_savings_usd <  TIER_B_FLOOR
                                TIER_B if TIER_B_FLOOR <= gross_savings_usd < TIER_C_FLOOR
                                TIER_C if gross_savings_usd >= TIER_C_FLOOR
                                # keyed on GROSS savings, never on net
      5. breakage_risk_delta  = round_half_up(breakage_risk_index(target_weight_g)
                                              - baseline.breakage_risk_index, 2)
      6. reserve_rate         = round_half_up(TIER_RESERVE_RATE[savings_tier]
                                              + RISK_RATE_PER_POINT * breakage_risk_delta, 5)
      7. risk_reserve_usd     = round_half_up(gross_savings_usd * reserve_rate, 2)
         net_savings_usd      = round_half_up(gross_savings_usd - risk_reserve_usd, 2)
      8. customer_rebate_usd  = round_half_up(net_savings_usd * TIER_REBATE_RATE[savings_tier], 2)
    input_set: |
      breakage_risk_index(target_weight_g) re-evaluates the breakage_risk_index rule with the
      program's target weight substituted for nominal_weight_g, holding the baseline design's
      capacity_ml, min_wall_thickness_mm, target_line_speed_bpm and the customer's current
      quality_standing history factor fixed.
    constants:
      TIER_B_FLOOR: 100000.00
      TIER_C_FLOOR: 500000.00
      TIER_RESERVE_RATE: { TIER_A: 0.05, TIER_B: 0.09, TIER_C: 0.14 }
      TIER_REBATE_RATE: { TIER_A: 0.20, TIER_B: 0.30, TIER_C: 0.40 }
      RISK_RATE_PER_POINT: 0.0009
    precision: "money 2 decimal places round_half_up; reserve_rate 5 decimal places round_half_up"

  - name: breakage_risk_index
    trigger: "BottleDesign submit / resubmit; re-evaluated inside lightweighting_economics"
    algorithm: weighted_scoring
    formula: |
      thinness      = max(0, THINNESS_REF - nominal_weight_g / capacity_ml) * 100
      speed_factor  = target_line_speed_bpm / SPEED_DIVISOR
      history_factor = 0 if customer.quality_standing == GOOD
                       1 if customer.quality_standing == WATCH
                       2 if customer.quality_standing == CRITICAL
      wall_penalty  = THIN_WALL_PENALTY if min_wall_thickness_mm < THIN_WALL_MM else 0
      raw           = THINNESS_WEIGHT * thinness + SPEED_WEIGHT * speed_factor
                      + HISTORY_WEIGHT * history_factor + wall_penalty
      breakage_risk_index = min(100.00, round_half_up(raw, 2))
    input_set: "the design's own geometry plus the owning customer's current quality_standing"
    constants:
      THINNESS_REF: 0.36
      THINNESS_WEIGHT: 8
      SPEED_DIVISOR: 250
      SPEED_WEIGHT: 12
      HISTORY_WEIGHT: 6
      THIN_WALL_MM: 1.60
      THIN_WALL_PENALTY: 8
      RISK_SIGNOFF_CAP: 55.00
    precision: "2 decimal places, round_half_up; no intermediate rounding of thinness, speed_factor or raw"

  - name: design_lead_time_days
    trigger: "BottleDesign submit / resubmit"
    algorithm: threshold
    formula: |
      cavity_term  = CAVITY_STEP_DAYS * ceil(cavity_count / CAVITIES_PER_STEP)
      revision_term = REVISION_DAYS * revision_count
      risk_term    = 0  if breakage_risk_index <= 30.00
                     10 if 30.00 < breakage_risk_index <= 45.00
                     25 if breakage_risk_index > 45.00
      supersede_credit = SUPERSEDE_CREDIT_DAYS if supersedes_design_id is not null else 0
      lead_time_days = max(LEAD_TIME_FLOOR_DAYS,
                           BASE_DAYS + cavity_term + revision_term + risk_term - supersede_credit)
    input_set: "the design's own fields; breakage_risk_index is the value computed in the same submit"
    constants:
      BASE_DAYS: 45
      CAVITY_STEP_DAYS: 5
      CAVITIES_PER_STEP: 4
      REVISION_DAYS: 7
      SUPERSEDE_CREDIT_DAYS: 10
      LEAD_TIME_FLOOR_DAYS: 30
    precision: "whole days, integer"

  - name: furnace_pull_availability
    trigger: "ProductionJob create"
    algorithm: waterfall_allocation
    formula: |
      campaign_days   = (campaign.window_end_at - campaign.window_start_at) / 86400 seconds
      pool_tons       = round_half_up(campaign.target_pull_tpd * campaign_days, 2)
      available_tons  = round_half_up(pool_tons - campaign.melt_tons_charged
                                      - furnace.reserved_pull_tons, 2)
      job_days            = (job.window_end_at - job.window_start_at) / 86400 seconds
      reserved_melt_tons  = round_half_up(job.planned_pull_tpd * job_days, 2)
      # create succeeds only when reserved_melt_tons <= available_tons
    input_set: |
      furnace.reserved_pull_tons is the sum of reserved_melt_tons over ProductionJob rows on the
      furnace in SCHEDULED or RUNNING; melt tons of COMPLETED and ABORTED jobs have already moved
      into campaign.melt_tons_charged and are not counted twice; CANCELLED jobs release their
      reservation and contribute to neither term.
    constants:
      SECONDS_PER_DAY: 86400
    precision: "2 decimal places, round_half_up"

  - name: lot_quality_disposition
    trigger: "PackLot release"
    algorithm: threshold
    formula: |
      reject_units     = sum(rejected_units over all InspectionResult on the lot)
      net_packed_units = lot.packed_units - reject_units
      major_ppm = round_half_up(1000000 * sum(rejected_units where defect_class == MAJOR)
                                / lot.packed_units, 1)
      minor_ppm = round_half_up(1000000 * sum(rejected_units where defect_class == MINOR)
                                / lot.packed_units, 1)
      disposition = SCRAPPED    if any InspectionResult on the lot has defect_class == CRITICAL
                    QUARANTINED if major_ppm >= MAJOR_PPM_LIMIT
                    QUARANTINED if (major_ppm + minor_ppm) >= COMBINED_PPM_LIMIT
                    RELEASED    otherwise
    input_set: "all InspectionResult rows on the lot; ppm denominators use gross packed_units"
    constants:
      MAJOR_PPM_LIMIT: 2500.0
      COMBINED_PPM_LIMIT: 9000.0
    precision: "ppm to 1 decimal place, round_half_up; comparisons are inclusive (>=)"

  - name: warehouse_aging_and_palletization
    trigger: "aged_until_at on lot creation; pallet_count on PackLot palletize"
    algorithm: threshold
    formula: |
      aging_days = BASE_AGING_DAYS
                   + THIN_WALL_AGING_DAYS if design.min_wall_thickness_mm < 1.60 else 0
                   + ADOPTED_PROGRAM_AGING_DAYS if any LightweightingProgram on the lot's design
                     is in ADOPTED else 0
      aged_until_at = lot.created_at + aging_days days
      units_per_pallet = UNITS_PER_PALLET[lot.palletization_standard]
      pallet_count     = ceil(lot.net_packed_units / units_per_pallet)
    input_set: |
      the lot's bottle design and any lightweighting programs on that design. net_packed_units at
      palletize time equals packed_units minus whatever rejects have been recorded so far; when a
      later inspection reading changes net_packed_units while the lot is already PALLETIZED,
      pallet_count is recomputed from the new net_packed_units.
    constants:
      BASE_AGING_DAYS: 3
      THIN_WALL_AGING_DAYS: 2
      ADOPTED_PROGRAM_AGING_DAYS: 3
      UNITS_PER_PALLET: { EURO_1200x800: 1800, GMA_1200x1000: 2100 }
    precision: "whole days; pallet_count is a ceiling to whole pallets"

  - name: customer_quality_standing
    trigger: "Complaint settle with settlement=CREDIT"
    algorithm: weighted_scoring
    formula: |
      credited = Complaint rows on the customer with status == CREDIT_ISSUED, processed in
                 created_at ASC order
      weighted_breakage_ppm = round_half_up(
          sum(c.breakage_ppm * c.affected_units for c in credited)
          / sum(c.affected_units for c in credited), 2)      # 0 when credited is empty
      quality_standing = CRITICAL if weighted_breakage_ppm >  customer.complaint_ppm_threshold
                         WATCH    if weighted_breakage_ppm >  WATCH_FRACTION * threshold
                         GOOD     otherwise
    input_set: "only CREDIT_ISSUED complaints; OPEN, INVESTIGATING and REJECTED complaints are excluded"
    constants:
      WATCH_FRACTION: 0.5
    precision: "2 decimal places, round_half_up; comparisons are strict (>)"

  - name: furnace_posture_derivation
    trigger: "campaign activate, campaign schedule-rebuild, campaign close, ProductionJob close"
    algorithm: threshold
    formula: |
      posture = COLD        if any Campaign on the furnace is in REBUILD_SCHEDULED
                REBUILD_DUE if furnace.refractory_remaining_pct <= REBUILD_DUE_PCT
                RESTRICTED  if furnace.refractory_remaining_pct <= RESTRICTED_PCT
                OPERATING   otherwise
    input_set: "the furnace's own refractory_remaining_pct plus the states of its campaigns"
    constants:
      REBUILD_DUE_PCT: 5.00
      RESTRICTED_PCT: 15.00
    precision: "comparisons on a 2-decimal percentage, inclusive (<=)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the caller's role is permitted for this operation per the §1.7 matrix"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "request body and query parameters satisfy the declared types, enums, ranges and required fields; this rule only inspects each field in isolation - cross-field ordering, containment and cross-entity comparisons are owned by the business_temporal, business_referential and business_safety rules below and surface as 422, not 400"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes and all list reads"
  - priority: 5
    category: existence
    check: "each path id resolves to an existing resource, validated left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "each foreign key in the request body resolves to an existing resource, validated in declared field order"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all creates and all endpoints taking FK fields"
  - priority: 7
    category: auth
    check: "a CustomerRep's X-User-ID must equal the customer the resource belongs to: the baseline design's customer_id for a program, and the complaint's customer_id for a complaint (on create, the body customer_id)"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /glass-plant/lightweighting-programs/{program_id}/customer-decision, POST /glass-plant/complaints, POST /glass-plant/complaints/{complaint_id}/settle"
  - priority: 8
    category: state
    check: "campaign is in the state the requested transition allows"
    error_id: ERR_CAMPAIGN_STATE_INVALID
    http_status: 409
    applies_to: "campaign activate / wind-down / schedule-rebuild / close"
  - priority: 9
    category: state
    check: "creating or starting a ProductionJob requires its campaign to be in ACTIVE"
    error_id: ERR_CAMPAIGN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /glass-plant/production-jobs, POST /glass-plant/production-jobs/{production_job_id}/start"
  - priority: 10
    category: state
    check: "production job is in the state the requested transition allows"
    error_id: ERR_JOB_STATE_INVALID
    http_status: 409
    applies_to: "job start / close / cancel"
  - priority: 11
    category: state
    check: "mold set is in the state the requested transition allows"
    error_id: ERR_MOLD_SET_STATE_INVALID
    http_status: 409
    applies_to: "job start, mold set unmount / send-to-repair / return-from-repair"
  - priority: 12
    category: state
    check: "bottle design is in the state the requested transition allows"
    error_id: ERR_DESIGN_STATE_INVALID
    http_status: 409
    applies_to: "design submit / request-changes / risk-signoff / approve"
  - priority: 13
    category: state
    check: "a ProductionJob may only be started against a bottle design in APPROVED and a batch recipe with approved == true"
    error_id: "ERR_DESIGN_NOT_APPROVED | ERR_RECIPE_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /glass-plant/production-jobs/{production_job_id}/start"
  - priority: 14
    category: state
    check: "lightweighting program is in the state the requested transition allows"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "program assess-risk / customer-decision / adopt / suspend"
  - priority: 15
    category: state
    check: "pack lot quality_status permits the requested quality transition, logistics_status permits the requested logistics transition, and a complaint may only be filed against a lot whose logistics_status is SHIPPED"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "lot release / rework-release / palletize / ship, POST /glass-plant/complaints"
  - priority: 16
    category: state
    check: "complaint is in the state the requested transition allows"
    error_id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    applies_to: "complaint investigate / settle"
  - priority: 17
    category: state
    check: "color change is in SCHEDULED for complete or abort"
    error_id: ERR_COLOR_CHANGE_STATE_INVALID
    http_status: 409
    applies_to: "color change complete / abort"
  - priority: 18
    category: state
    check: "activating a campaign requires furnace.posture != COLD; starting a job requires furnace.posture in OPERATING or RESTRICTED"
    error_id: ERR_FURNACE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /glass-plant/campaigns/{campaign_id}/activate, POST /glass-plant/production-jobs/{production_job_id}/start"
  - priority: 19
    category: state
    check: "a furnace may not have two campaigns in ACTIVE or WIND_DOWN at once"
    error_id: ERR_FURNACE_CAMPAIGN_CONFLICT
    http_status: 409
    applies_to: "POST /glass-plant/campaigns/{campaign_id}/activate"
  - priority: 20
    category: state
    check: "a campaign may not wind down while any of its jobs is RUNNING, and a colour change may not complete while a RUNNING job overlaps its window"
    error_id: ERR_RUNNING_JOB_PRESENT
    http_status: 409
    applies_to: "POST /glass-plant/campaigns/{campaign_id}/wind-down, POST /glass-plant/color-changes/{color_change_id}/complete, POST /glass-plant/mold-sets/{mold_set_id}/unmount"
  - priority: 21
    category: state
    check: "a rebuild may not be scheduled while any job on the campaign is still SCHEDULED or RUNNING"
    error_id: ERR_OPEN_JOBS_PRESENT
    http_status: 409
    applies_to: "POST /glass-plant/campaigns/{campaign_id}/schedule-rebuild"
  - priority: 22
    category: state
    check: "a campaign may not close while any of its lots is still PENDING_INSPECTION"
    error_id: ERR_OPEN_LOTS_PRESENT
    http_status: 409
    applies_to: "POST /glass-plant/campaigns/{campaign_id}/close"
  - priority: 23
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_FURNACE_VERSION | ERR_STALE_DESIGN_VERSION"
    http_status: 412
    applies_to: "POST /glass-plant/production-jobs, POST /glass-plant/lightweighting-programs"
  - priority: 24
    category: business_safety
    check: "batch recipe cullet_ratio_pct must not exceed 90.00 for FLINT recipes (colour purity limit)"
    error_id: ERR_CULLET_RATIO_UNSAFE
    http_status: 422
    applies_to: "POST /glass-plant/batch-recipes, POST /glass-plant/batch-recipes/{batch_recipe_id}/approve"
  - priority: 25
    category: business_safety
    check: "a ProductionJob's batch recipe color and bottle design color must both equal the furnace's current_color"
    error_id: ERR_COLOR_MISMATCH
    http_status: 422
    applies_to: "POST /glass-plant/production-jobs"
  - priority: 26
    category: business_safety
    check: "job planned_pull_tpd must not exceed 1.15 x furnace.design_pull_tpd, and must not exceed design_pull_tpd at all while furnace.posture == RESTRICTED"
    error_id: ERR_OVER_PULL_LIMIT
    http_status: 422
    applies_to: "POST /glass-plant/production-jobs"
  - priority: 27
    category: business_safety
    check: "a design whose breakage_risk_index exceeds 55.00 cannot receive risk sign-off"
    error_id: ERR_RISK_INDEX_ABOVE_CAP
    http_status: 422
    applies_to: "POST /glass-plant/bottle-designs/{bottle_design_id}/risk-signoff"
  - priority: 28
    category: business_safety
    check: "a lightweighting program whose breakage_risk_delta exceeds 30.00 cannot enter PILOT"
    error_id: ERR_RISK_DELTA_ABOVE_CAP
    http_status: 422
    applies_to: "POST /glass-plant/lightweighting-programs/{program_id}/customer-decision"
  - priority: 29
    category: business_referential
    check: "the job's forming machine, batch recipe and color changes must all belong to the job's furnace, and the job's furnace must be the campaign's furnace"
    error_id: ERR_FURNACE_MISMATCH
    http_status: 422
    applies_to: "POST /glass-plant/production-jobs, POST /glass-plant/color-changes"
  - priority: 30
    category: business_referential
    check: "the mold set named on a job must belong to the job's bottle design"
    error_id: ERR_MOLD_SET_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /glass-plant/production-jobs"
  - priority: 31
    category: business_referential
    check: "a lightweighting program's target_weight_g must be strictly less than the baseline design's nominal_weight_g"
    error_id: ERR_TARGET_WEIGHT_NOT_LIGHTER
    http_status: 422
    applies_to: "POST /glass-plant/lightweighting-programs"
  - priority: 32
    category: business_referential
    check: "a complaint's pack lot must belong to the complaint's customer, and a lot's design must belong to that customer"
    error_id: ERR_LOT_CUSTOMER_MISMATCH
    http_status: 422
    applies_to: "POST /glass-plant/complaints"
  - priority: 33
    category: business_temporal
    check: "window_end_at must be strictly after window_start_at on campaigns, color changes and jobs; rebuild_window_start_at must be strictly after the campaign window_end_at"
    error_id: ERR_WINDOW_ORDER_INVALID
    http_status: 422
    applies_to: "campaign / color-change / job creates, campaign schedule-rebuild"
  - priority: 34
    category: business_temporal
    check: "a job window must be contained within its campaign window (inclusive of both campaign endpoints)"
    error_id: ERR_JOB_WINDOW_OUTSIDE_CAMPAIGN
    http_status: 422
    applies_to: "POST /glass-plant/production-jobs"
  - priority: 35
    category: business_temporal
    check: "job windows on one forming machine are half-open [start, end) and must not overlap once the machine's changeover_buffer_minutes is appended to the earlier job's end; only SCHEDULED and RUNNING jobs are considered"
    error_id: ERR_MACHINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /glass-plant/production-jobs"
  - priority: 36
    category: business_temporal
    check: "color-change windows on one furnace are closed [start, end] intervals and must not overlap another SCHEDULED or COMPLETED color change, and no SCHEDULED or RUNNING job window may overlap a SCHEDULED color-change window"
    error_id: ERR_COLOR_CHANGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /glass-plant/color-changes, POST /glass-plant/production-jobs"
  - priority: 37
    category: business_temporal
    check: "at most 4 color changes may be scheduled on one furnace within any rolling 30-day window measured from the new change's window_start_at"
    error_id: ERR_COLOR_CHANGE_RATE_EXCEEDED
    http_status: 409
    applies_to: "POST /glass-plant/color-changes"
  - priority: 38
    category: business_temporal
    check: "a color change may only be completed once the logical clock has reached its window_end_at; a lot may only be palletized once the clock has reached aged_until_at"
    error_id: ERR_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /glass-plant/color-changes/{color_change_id}/complete, POST /glass-plant/pack-lots/{pack_lot_id}/palletize"
  - priority: 39
    category: business_constraint
    check: "code / account_code / lot_code uniqueness across the entity's collection"
    error_id: ERR_CODE_NOT_UNIQUE
    http_status: 409
    applies_to: "all creates carrying a code, account_code or lot_code"
  - priority: 40
    category: business_constraint
    check: "mounting a mold set must not push machine.mounted_cavities above machine.max_cavities"
    error_id: ERR_CAVITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /glass-plant/production-jobs/{production_job_id}/start"
  - priority: 41
    category: business_constraint
    check: "a lot may not be released before at least one InspectionResult exists for it"
    error_id: ERR_NO_INSPECTION_RECORDS
    http_status: 409
    applies_to: "POST /glass-plant/pack-lots/{pack_lot_id}/release"
  - priority: 42
    category: business_constraint
    check: "cumulative rejected_units across a lot's inspection results must not exceed the lot's packed_units"
    error_id: ERR_REJECTS_EXCEED_PACKED
    http_status: 422
    applies_to: "POST /glass-plant/pack-lots/{pack_lot_id}/inspection-results"
  - priority: 43
    category: business_constraint
    check: "a complaint's affected_units must not exceed the lot's net_packed_units"
    error_id: ERR_AFFECTED_UNITS_EXCEED_LOT
    http_status: 422
    applies_to: "POST /glass-plant/complaints"
  - priority: 44
    category: business_constraint
    check: "the second actor in a two-person control must differ from the first: design approve vs risk-signoff, complaint settle vs investigate, lot rework-release vs the inspectors who recorded the lot's readings"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "design approve, complaint settle, lot rework-release"
  - priority: 45
    category: business_constraint
    check: "a lot may only ship when its palletization_standard still matches the customer's current palletization_standard"
    error_id: ERR_PALLET_STANDARD_MISMATCH
    http_status: 409
    applies_to: "POST /glass-plant/pack-lots/{pack_lot_id}/ship"
  - priority: 46
    category: business_fiscal
    check: "campaign target_pull_tpd must not exceed the furnace's design_pull_tpd"
    error_id: ERR_TARGET_PULL_EXCEEDS_DESIGN
    http_status: 422
    applies_to: "POST /glass-plant/campaigns"
  - priority: 47
    category: business_fiscal
    check: "the job's reserved_melt_tons must fit inside the campaign's remaining pull pool per furnace_pull_availability"
    error_id: ERR_PULL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /glass-plant/production-jobs"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock every window, aging and elapsed-time rule reads"]

  - method: POST
    path: "/glass-plant/furnaces"
    description: "Register a furnace with its nameplate pull and refractory life budget"
    roles: [PlantManager]
    code: 201
    input: [code, design_pull_tpd, refractory_life_total_units]
    output: Furnace
    side_effects: ["initialises current_color FLINT, posture OPERATING, refractory_remaining_pct 100.00"]
  - method: GET
    path: "/glass-plant/furnaces"
    description: "List furnaces"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, MoldEngineer, QualityEngineer, WarehouseOperator]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Furnace[]
    side_effects: []
  - method: GET
    path: "/glass-plant/furnaces/{furnace_id}"
    description: "Read one furnace including derived refractory posture and reserved pull"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, MoldEngineer, QualityEngineer, WarehouseOperator]
    code: 200
    input: []
    output: Furnace
    side_effects: []
  - method: GET
    path: "/glass-plant/furnaces/{id}/campaigns"
    description: "List the campaigns run on a furnace"
    roles: [PlantManager, PlantScheduler, QualityEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: GET
    path: "/glass-plant/furnaces/{id}/batch-recipes"
    description: "List the batch recipes registered for a furnace"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, QualityEngineer]
    code: 200
    input: ["color?", "approved?", "limit?", "offset?"]
    output: BatchRecipe[]
    side_effects: []
  - method: GET
    path: "/glass-plant/furnaces/{id}/color-changes"
    description: "List the colour changes planned on a furnace"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, QualityEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ColorChange[]
    side_effects: []
  - method: GET
    path: "/glass-plant/furnaces/{id}/forming-machines"
    description: "List the forming machines fed by a furnace"
    roles: [PlantManager, PlantScheduler, MoldEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FormingMachine[]
    side_effects: []

  - method: POST
    path: "/glass-plant/campaigns"
    description: "Plan a furnace campaign with a target pull and a window"
    roles: [PlantManager]
    code: 201
    input: [furnace_id, code, target_pull_tpd, window_start_at, window_end_at]
    output: Campaign
    side_effects: ["increments Furnace.campaign_count by 1", "increments Furnace.version by 1"]
  - method: GET
    path: "/glass-plant/campaigns/{campaign_id}"
    description: "Read one campaign including the melt ledger and the reconciled unaccounted loss"
    roles: [PlantManager, PlantScheduler, BatchHouseTech, QualityEngineer]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/glass-plant/campaigns/{campaign_id}/activate"
    description: "Activate a planned campaign and record its nominal refractory projection"
    roles: [PlantManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["computes projected_refractory_units_nominal via refractory_wear nominal variant", "re-derives Furnace.posture"]
  - method: POST
    path: "/glass-plant/campaigns/{campaign_id}/wind-down"
    description: "Wind a campaign down, cancelling everything still scheduled on it"
    roles: [PlantManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["cancels every SCHEDULED ProductionJob on the campaign whose window_start_at is on or after the logical clock, leaving a SCHEDULED job already inside its window open", "releases the cancelled jobs' reserved_melt_tons from Furnace.reserved_pull_tons"]
  - method: POST
    path: "/glass-plant/campaigns/{campaign_id}/schedule-rebuild"
    description: "Book the cold-repair window for a wound-down campaign"
    roles: [PlantManager]
    code: 200
    input: [rebuild_window_start_at, rebuild_window_end_at]
    output: Campaign
    side_effects: ["sets Furnace.posture to COLD", "aborts SCHEDULED colour changes that start inside or after the rebuild window"]
  - method: POST
    path: "/glass-plant/campaigns/{campaign_id}/close"
    description: "Close a campaign after the rebuild and reset the furnace refractory budget"
    roles: [PlantManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recomputes unaccounted_loss_tons", "resets Furnace.refractory_consumed_units to 0 and refractory_remaining_pct to 100.00", "sets Furnace.posture to OPERATING"]

  - method: POST
    path: "/glass-plant/batch-recipes"
