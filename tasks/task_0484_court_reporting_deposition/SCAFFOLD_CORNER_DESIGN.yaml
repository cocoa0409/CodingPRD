scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Case, "endpoints[\"POST /cases\"]"]
        distinguishing_aspect: "POST /cases with caption, docket_number, jurisdiction, noticing_attorney_id returns 201 and echoes all four fields plus server-minted id/created_at/version=1."
        test_recipe:
          setup: ["An attorney exists to own the case."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C One", firm_name: "C1 LLP", bar_state: "CA", email: "c1@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { caption: "Alpha v Beta", docket_number: "C-2001", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Case.${case_id}.jurisdiction == STATE_CA"
            - "Case.${case_id}.version == 1"

      - name: get_job_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Job, "endpoints[\"GET /jobs/{id}\"]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /jobs/{random-uuid} returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_docket_number_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Case.fields.docket_number, "validations[priority=20]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases omitting the required docket_number field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An attorney exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Two", firm_name: "C2 LLP", bar_state: "CA", email: "c2@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { caption: "No Docket", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: job_requires_videographer_defaults_false
        claim_type: Defaults
        grounds: [entities.Job.fields.requires_videographer, "endpoints[\"POST /jobs\"]"]
        distinguishing_aspect: "Omitting requires_videographer on POST /jobs applies default false; the job confirms with only a reporter."
        test_recipe:
          setup: ["A case exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Three", firm_name: "C3 LLP", bar_state: "CA", email: "c3@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Def v Geh", docket_number: "C-2003", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-01T09:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Job.${job_id}.requires_videographer == false"

      - name: job_staffing_posture_is_computed_unstaffed_at_create
        claim_type: Computed Fields
        grounds: [entities.Job.fields.staffing_posture, calculations.compute_staffing_posture]
        distinguishing_aspect: "A newly created job with no assignments has computed staffing_posture==UNSTAFFED even if a client-supplied value is sent."
        test_recipe:
          setup: ["A case exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Four", firm_name: "C4 LLP", bar_state: "CA", email: "c4@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Hij v Klm", docket_number: "C-2004", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id }
          assert:
            - "Job.${job_id}.staffing_posture == UNSTAFFED"

      - name: create_resource_invalid_kind_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Resource.fields.kind, "validations[priority=20]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /resources with kind=STENOGRAPHER (not in {REPORTER,VIDEOGRAPHER,INTERPRETER}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /resources"
              payload: { full_name: "Bad Kind", kind: "STENOGRAPHER", hourly_appearance_cents: 5000 }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_duplicate_docket_number_returns_duplicate_key
        claim_type: Type Constraints
        grounds: [entities.Case.fields.docket_number, "validations[priority=21]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "A second POST /cases reusing an existing docket_number returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["A case with docket_number C-2005 already exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Five", firm_name: "C5 LLP", bar_state: "CA", email: "c5@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "First", docket_number: "C-2005", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
          trigger:
            - call: "POST /cases"
              payload: { caption: "Second", docket_number: "C-2005", jurisdiction: "STATE_NY", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_KEY"

      - name: create_job_wrong_case_id_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Job.fields.case_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /jobs referencing a non-existent case_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no cases)."]
          setup_api_calls: []
          trigger:
            - call: "POST /jobs"
              payload: { case_id: "11111111-1111-4111-8111-111111111111", deponent_name: "W", scheduled_start: "2026-07-03T09:00:00Z", scheduled_end: "2026-07-03T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_jobs_pagination_envelope_fields
        claim_type: Listing
        grounds: [entities.Job, "endpoints[\"GET /jobs\"]"]
        distinguishing_aspect: "GET /jobs returns an array envelope with total_count and has_more pagination fields honoring limit/offset."
        test_recipe:
          setup: ["A case with two jobs exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Six", firm_name: "C6 LLP", bar_state: "CA", email: "c6@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "List Case", docket_number: "C-2006", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W1", scheduled_start: "2026-07-04T09:00:00Z", scheduled_end: "2026-07-04T11:00:00Z" }
              as: ScheduleCoordinator
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W2", scheduled_start: "2026-07-05T09:00:00Z", scheduled_end: "2026-07-05T11:00:00Z" }
              as: ScheduleCoordinator
          trigger:
            - call: "GET /jobs?case_id=${case_id}&limit=1&offset=0"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "response.data.total_count == 2"
            - "response.data.has_more == true"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_job_from_unstaffed_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Job.NOTICED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a NOTICED job whose staffing_posture is not READY (no reporter assigned) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A NOTICED job with zero assignments (posture UNSTAFFED)."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Seven", firm_name: "C7 LLP", bar_state: "CA", email: "c7@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Unstaffed", docket_number: "C-2007", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-06T09:00:00Z", scheduled_end: "2026-07-06T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_job_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Job.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED job returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A NOTICED job already CANCELLED once."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Eight", firm_name: "C8 LLP", bar_state: "CA", email: "c8@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Dbl Cancel", docket_number: "C-2008", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-07T09:00:00Z", scheduled_end: "2026-07-07T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/cancel"
              payload: { expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: start_job_before_scheduled_start_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Job.CONFIRMED_to_IN_SESSION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Starting a CONFIRMED job while the logical clock is before scheduled_start (clock at default 2026-01-01) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CONFIRMED job scheduled for 2026-07-08; the logical clock remains at the 2026-01-01 default."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Nine", firm_name: "C9 LLP", bar_state: "CA", email: "c9@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Early Start", docket_number: "C-2009", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep K1", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-08T09:00:00Z", scheduled_end: "2026-07-08T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
          trigger:
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: newly_created_transcript_order_initial_state_ordered
        claim_type: Initial State
        grounds: [state_machines.TranscriptOrder, entities.TranscriptOrder.fields.status]
        distinguishing_aspect: "A transcript order created against an adjourned job starts in status ORDERED with errata_round 0."
        test_recipe:
          setup: ["An adjourned job exists."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Ten", firm_name: "C10 LLP", bar_state: "CA", email: "c10@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Initial TO", docket_number: "C-2010", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep K2", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-09T09:00:00Z", scheduled_end: "2026-07-09T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
          trigger:
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 30 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
          assert:
            - "TranscriptOrder.${to_id}.status == ORDERED"
            - "TranscriptOrder.${to_id}.errata_round == 0"

      - name: pay_paid_invoice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a PAID invoice (terminal) returns ERR_INVALID_STATE (409); void is only defined from DRAFT/ISSUED."
        test_recipe:
          setup: ["A delivered transcript invoice issued and PAID (NY 40 pages STANDARD certified, reporter 2h @10000)."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Eleven", firm_name: "C11 LLP", bar_state: "NY", email: "c11@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Paid Lock", docket_number: "C-2011", jurisdiction: "STATE_NY", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep K3", kind: "REPORTER", certifications: ["RPR"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-10T09:00:00Z", scheduled_end: "2026-07-10T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 40 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
            - call: "POST /transcript-orders/${to_id}/deliver-rough"
              payload: {}
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/certify"
              payload: { final_pages: 40 }
              as: Reporter
              as_user_id: "${rep_id}"
            - call: "POST /transcript-orders/${to_id}/sign"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /transcript-orders/${to_id}/deliver"
              payload: {}
              as: ScheduleCoordinator
            - call: "POST /invoices"
              payload: { job_id: "${job_id}", transcript_order_id: "${to_id}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: finalize_deadline_auto_waives_signature_to_signed
        claim_type: Valid Transition
        grounds: [state_machines.TranscriptOrder.CERTIFIED_to_SIGNED, "endpoints[\"POST /transcript-orders/{id}/finalize-deadline\"]"]
        distinguishing_aspect: "After the clock passes read_sign_deadline, finalize-deadline transitions a CERTIFIED transcript to SIGNED (signature auto-waived) without any errata."
        test_recipe:
          setup: ["A CERTIFIED transcript (read_sign_deadline = certify-time + 30 days) with the clock advanced past the deadline."]
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "C Twelve", firm_name: "C12 LLP", bar_state: "CA", email: "c12@x.com" }
              as: ScheduleCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /cases"
              payload: { caption: "Waive Sign", docket_number: "C-2012", jurisdiction: "STATE_CA", noticing_attorney_id: "${att_id}" }
              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep K4", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "W", scheduled_start: "2026-07-11T09:00:00Z", scheduled_end: "2026-07-11T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
              captures: { job_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
