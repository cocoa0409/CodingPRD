              as_user_id: "ca-1"
            - call: "POST /duty-statements"
              payload: { position_id: "${pos_id}", duty_code: "D-3", description: "Runs the line", claimed_time_pct: 40.0, is_exempt_duty: false }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { ds3_id: $.data.id }
          assert:
            - "the 45.0 attempt returns 409 with error_id ERR_DUTY_TIME_OVERALLOCATED and creates nothing"
            - "the 40.0 attempt returns 201 because the sum lands on exactly 100.0"
            - "GET /positions/${pos_id}/duty-statements returns exactly 2 rows (${ds1_id} and ${ds3_id})"
            - "Position.${pos_id}.self_reported_exempt_pct == 60.0 (only the exempt row counts)"

      - name: abc_jurisdiction_demands_the_three_prongs_while_economic_reality_does_not
        claim_type: conditional_validation
        grounds: ["validations[priority=13]", "errors[ERR_IC_TEST_INPUTS_MISSING]", "calculations.contractor_classification"]
        distinguishing_aspect: "Which inputs are mandatory depends entirely on the jurisdiction's ic_test, which the client never sends. The very same payload - economic-reality factors supplied, independent_trade omitted - must be refused for a CA engagement under ABC and accepted for a TX engagement under ECONOMIC_REALITY, where it scores 5 and yields CONTRACTOR."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA with ic_test ABC and StateRule TX with ic_test ECONOMIC_REALITY."
            - "One AuditProject in PLANNING with posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "TX", min_weekly_salary_cents: 60000, duties_test_variant: "FEDERAL", ic_test: "ECONOMIC_REALITY", reclass_notice_days: 14 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /contractor-reviews"
              payload: { audit_project_id: "${proj_id}", vendor_name: "Northline Logistics", engagement_state_code: "CA", free_from_control: true, outside_usual_course: true, economic_reality_factors: { control_by_worker: true, opportunity_for_profit_or_loss: true, worker_investment: true, relationship_is_project_based: true, skill_and_initiative: true, not_integral_to_business: false } }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "POST /contractor-reviews"
              payload: { audit_project_id: "${proj_id}", vendor_name: "Northline Logistics", engagement_state_code: "TX", free_from_control: true, outside_usual_course: true, economic_reality_factors: { control_by_worker: true, opportunity_for_profit_or_loss: true, worker_investment: true, relationship_is_project_based: true, skill_and_initiative: true, not_integral_to_business: false } }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
              captures: { cr_tx_id: $.data.id }
          assert:
            - "the CA attempt returns 409 with error_id ERR_IC_TEST_INPUTS_MISSING because independent_trade is absent under ABC"
            - "the TX attempt returns 201 with applied_ic_test ECONOMIC_REALITY"
            - "ContractorReview.${cr_tx_id}.ic_score == 5 and outcome == CONTRACTOR and status == DRAFT"
            - "GET /audit-projects/${proj_id}/contractor-reviews returns exactly 1 row"
            - "AuditProject.${proj_id}.remediation_posture == OPEN"

      - name: role_check_runs_before_the_family_lookup_so_an_auditor_is_rejected
        claim_type: cascading_validation
        grounds: ["validations[priority=2]", "validations[priority=5]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "Two checks are violated by one request: the caller is a read-only Auditor (priority 2) and the referenced job_family_id does not exist (priority 5). The lower priority must win, so the response is 403 ERR_ROLE_NOT_PERMITTED and never 404 ERR_JOB_FAMILY_NOT_FOUND - an implementation that resolves the FK before authorizing leaks existence information."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject in PLANNING with one JobFamily that is NOT the id used in the request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "00000000-0000-4000-8000-000000000abc", title: "Ghost Supervisor", job_code: "GH-000", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 45 }
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "response status is 403 with error_id ERR_ROLE_NOT_PERMITTED (not 404)"
            - "GET /job-families/${fam_id}/positions returns 0 rows"

      - name: corner_priority_ordering_between_two_violated_rules
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_stage_gate_outranks_interviewer_double_booking_and_returns_stage_error
          rationale: "That instance violates a lower-priority and a higher-priority rule in one request and asserts the lower priority's error, which is the priority-ordering claim."

      - name: corner_cross_entity_validation_reads_another_entitys_state
        claim_type: cross_entity_validation
