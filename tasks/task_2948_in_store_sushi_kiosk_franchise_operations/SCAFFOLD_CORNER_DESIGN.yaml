        claim_type: violation_to_error
        grounds:
          - "errors[ERR_KIOSK_POSTURE_LOCKDOWN]"
          - "endpoints[POST /kiosk-ops/production-plans]"
          - "entities.Kiosk.fields.sanitation_posture"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_creation_blocked_by_lockdown_posture_rejected
          rationale: "Reaching LOCKDOWN requires a CRITICAL finding on a submitted audit, which that §1.8 cross-entity instance stages before asserting ERR_KIOSK_POSTURE_LOCKDOWN on the plan create"
