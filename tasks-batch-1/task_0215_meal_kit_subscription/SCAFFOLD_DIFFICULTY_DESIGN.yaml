# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Meal Kit Subscription — 9 rules x 2 instances = 18 instances
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every formula-derived assert literal is pre-computed.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: weekly_box_provisional_vs_final_charge_diverge
        grounds:
          - calculations.weekly_box_charge
          - state_machines.WeeklyBox.OPEN_to_LOCKED
          - state_machines.WeeklyBox.PENDING_to_CHARGED
          - entities.WeeklyBox.fields.provisional_charge_cents
          - entities.WeeklyBox.fields.final_charge_cents
        distinguishing_aspect: |
          PROVISIONAL reads credit_balance_cents at lock (0) and does NOT deduct credit, giving
          provisional_charge_cents=8491; between lock and cutoff a referral the subject M1 made settles,
          raising M1's live credit to 1500, so FINAL re-reads live credit and deducts, giving
          final_charge_cents=6991. Same WeeklyBox, two divergent stored values.
        test_recipe:
          setup:
            - "Plan COUPLE_4 (servings_per_meal=2, meals_per_week=4 -> 8 servings, 999 tier) and ZONE_B (surcharge 499, cutoff Friday=5) exist"
            - "Subject M1 in ZONE_B referred a referee E; M1's STANDARD box has 4 standard recipes and is LOCKED at clock 2026-07-01 while M1.credit_balance_cents=0 (provisional=8491)"
            - "Clock advanced to 2026-07-11 (past cutoff 2026-07-10T23:59:59Z); E's first box is charged then shipped, settling M1's referral and crediting M1 by 1500 (live credit now 1500)"
            - "M1's box is then charged (FINAL): after_loyalty 8491, credit_applied 1500 -> final=6991"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "COUPLE_4", servings_per_meal: 2, meals_per_week: 4 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "SOLO_2", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { plan2_id: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_B", cold_pack_surcharge_cents: 499, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zone_b_id: $.data.id }
            - call: "POST /recipes"
              payload: { title: "Std A" }
              as: PlatformAdmin
              captures: { r_a: $.data.id }
            - call: "POST /recipes"
              payload: { title: "Std B" }
              as: PlatformAdmin
              captures: { r_b: $.data.id }
            - call: "POST /recipes"
              payload: { title: "Std C" }
              as: PlatformAdmin
              captures: { r_c: $.data.id }
            - call: "POST /recipes"
              payload: { title: "Std D" }
              as: PlatformAdmin
              captures: { r_d: $.data.id }
            # subject M1 (referrer) and referee E
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", shipping_zone_id: "${zone_b_id}" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "e1@x.com", full_name: "E One", shipping_zone_id: "${zone_b_id}", referred_by_member_id: "${m1_id}" }
              as: Anonymous
              captures: { e1_id: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${m1_id}", referee_member_id: "${e1_id}" }
              as: PlatformAdmin
              captures: { ref_id: $.data.id }
            # M1's own box: lock with credit 0 -> provisional 8491
            - call: "POST /subscriptions"
              payload: { member_id: "${m1_id}", plan_id: "${plan_id}", diet_preference: "STANDARD", monthly_addon_fee_cents: 0, billing_cycle_day: 1 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${s1_id}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { box_id: $.data.id }
            - call: "POST /weekly-boxes/${box_id}/recipes"
              payload: { recipe_id: "${r_a}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /weekly-boxes/${box_id}/recipes"
              payload: { recipe_id: "${r_b}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /weekly-boxes/${box_id}/recipes"
              payload: { recipe_id: "${r_c}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /weekly-boxes/${box_id}/recipes"
              payload: { recipe_id: "${r_d}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /weekly-boxes/${box_id}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { prov: $.data.provisional_charge_cents }
            # E's box: lock, then (after cutoff) charge + ship -> settles M1's referral -> M1 credit 1500
            - call: "POST /subscriptions"
              payload: { member_id: "${e1_id}", plan_id: "${plan2_id}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${e1_id}"
              captures: { es_id: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${es_id}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${e1_id}"
              captures: { ebox_id: $.data.id }
            - call: "POST /weekly-boxes/${ebox_id}/recipes"
              payload: { recipe_id: "${r_a}" }
              as: Member
              as_user_id: "${e1_id}"
            - call: "POST /weekly-boxes/${ebox_id}/recipes"
              payload: { recipe_id: "${r_b}" }
              as: Member
              as_user_id: "${e1_id}"
            - call: "POST /weekly-boxes/${ebox_id}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${e1_id}"
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-11T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /weekly-boxes/${ebox_id}/charge"
              payload: {}
              as: PlatformOps
            - call: "POST /weekly-boxes/${ebox_id}/ship"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /weekly-boxes/${box_id}/charge"
              payload: {}
              as: PlatformOps
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "WeeklyBox.${box_id}.provisional_charge_cents == 8491"
            - "WeeklyBox.${box_id}.final_charge_cents == 6991"
            - "WeeklyBox.${box_id}.selection_status == LOCKED and WeeklyBox.${box_id}.fulfillment_status == CHARGED"

      - name: referral_reward_forward_estimate_vs_settled_diverge
        grounds:
          - calculations.referral_reward
          - state_machines.Referral.PENDING_to_SETTLED
          - entities.Member.fields.credit_balance_cents
          - entities.Referral.fields.reward_cents
        distinguishing_aspect: |
          FORWARD_ESTIMATE projects 1500 * pending_count (uncapped, uncredited) on the Member domain;
          SETTLED credits at most MAX_REFERRAL_REWARDS_PER_CYCLE=3 in created_at order — a referrer with
          4 pending referees shows forward_estimate_cents=6000 but settled_total_cents caps at 4500.
        test_recipe:
          setup:
            - "Referrer R has 4 PENDING referrals (forward estimate 4*1500=6000)"
            - "All 4 referees get their first box shipped in created_at order; the 4th settlement exceeds the cap and VOIDs"
            - "Referrer credit_balance_cents rises by 3*1500=4500"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "SINGLE_2", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /recipes"
              payload: { title: "R1" }
              as: PlatformAdmin
              captures: { rc1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "R2" }
              as: PlatformAdmin
              captures: { rc2: $.data.id }
            - call: "POST /members"
              payload: { email: "ref@x.com", full_name: "Referrer", shipping_zone_id: "${zone_a_id}" }
              as: Anonymous
              captures: { ref_id: $.data.id }
            # referee 1
            - call: "POST /members"
              payload: { email: "e1@x.com", full_name: "E1", shipping_zone_id: "${zone_a_id}" }
              as: Anonymous
              captures: { e1: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${ref_id}", referee_member_id: "${e1}" }
              as: PlatformAdmin
            # referee 2..4 created the same way (omitted intermediate captures we don't reuse)
            - call: "POST /members"
              payload: { email: "e2@x.com", full_name: "E2", shipping_zone_id: "${zone_a_id}" }
              as: Anonymous
              captures: { e2: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${ref_id}", referee_member_id: "${e2}" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "e3@x.com", full_name: "E3", shipping_zone_id: "${zone_a_id}" }
              as: Anonymous
              captures: { e3: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${ref_id}", referee_member_id: "${e3}" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "e4@x.com", full_name: "E4", shipping_zone_id: "${zone_a_id}" }
              as: Anonymous
              captures: { e4: $.data.id }
            - call: "POST /referrals"
              payload: { referrer_member_id: "${ref_id}", referee_member_id: "${e4}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /members/${ref_id}/referral-summary"
              payload: {}
              as: Member
              as_user_id: "${ref_id}"
              captures: { fwd: $.data.forward_estimate_cents }
          assert:
            - "Member.${ref_id} referral-summary forward_estimate_cents == 6000"
            - "Member.${ref_id} referral-summary pending_count == 4"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weekly_box_charge_nested_min_with_tier_branch
        grounds:
          - calculations.weekly_box_charge
          - entities.Member.fields.credit_balance_cents
          - entities.Member.fields.lifetime_box_count
        distinguishing_aspect: |
          Mode (a): >=4 inputs (servings tier, diet premium, premium upcharge, zone surcharge) with a
          tiered-rate branch AND a nested min(credit, cap, after_loyalty); for a fresh member
          (lifetime 0 -> 0%, credit 0) a 16-serving LOW_CARB box with 1 premium recipe in ZONE_C yields
          provisional_charge_cents == 18983 = (899+200)*16 + 400 + 999, with credit_applied = min(0,2000,18983) = 0.
        test_recipe:
          setup:
            - "Plan FAMILY_4 (servings_per_meal=4, meals_per_week=4 -> 16 servings, 899 tier)"
            - "ZONE_C surcharge 999; Subscription LOW_CARB (+200/serving); one premium recipe (+400)"
            - "Fresh member: lifetime_box_count 0 (loyalty 0%), credit_balance_cents 0; box locked"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "FAMILY_4", servings_per_meal: 4, meals_per_week: 4 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_C", cold_pack_surcharge_cents: 999, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zc: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LC1", diet_tags: ["LOW_CARB"] }
              as: PlatformAdmin
              captures: { x1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LC2", diet_tags: ["LOW_CARB"] }
              as: PlatformAdmin
              captures: { x2: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LC3", diet_tags: ["LOW_CARB"] }
              as: PlatformAdmin
              captures: { x3: $.data.id }
            - call: "POST /recipes"
              payload: { title: "LC4 Premium", is_premium: true, diet_tags: ["LOW_CARB"] }
              as: PlatformAdmin
              captures: { x4: $.data.id }
            - call: "POST /members"
              payload: { email: "gold@x.com", full_name: "Gold", shipping_zone_id: "${zc}" }
              as: Anonymous
              captures: { gm: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${gm}", plan_id: "${plan_id}", diet_preference: "LOW_CARB", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${gm}"
              captures: { gs: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${gs}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${gm}"
              captures: { gbox: $.data.id }
            - call: "POST /weekly-boxes/${gbox}/recipes"
              payload: { recipe_id: "${x1}" }
              as: Member
              as_user_id: "${gm}"
            - call: "POST /weekly-boxes/${gbox}/recipes"
              payload: { recipe_id: "${x2}" }
              as: Member
              as_user_id: "${gm}"
            - call: "POST /weekly-boxes/${gbox}/recipes"
              payload: { recipe_id: "${x3}" }
              as: Member
              as_user_id: "${gm}"
            - call: "POST /weekly-boxes/${gbox}/recipes"
              payload: { recipe_id: "${x4}" }
              as: Member
              as_user_id: "${gm}"
          trigger:
            - call: "POST /weekly-boxes/${gbox}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${gm}"
              captures: { prov: $.data.provisional_charge_cents }
          assert:
            - "WeeklyBox.${gbox}.provisional_charge_cents == 18983"

      - name: pause_proration_multiply_then_round_order
        grounds:
          - calculations.pause_proration_credit
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Member.fields.credit_balance_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters — round_half_up(1099*17/30)=623 (multiply-then-round), NOT
          round(1099/30)=37 then *17=629 (per-day-then-round). The scaffold pins multiply-then-round.
        test_recipe:
          setup:
            - "Member m credit_balance_cents starts at 0"
            - "Subscription monthly_addon_fee_cents=1099, billing_cycle_day=30; clock 2026-07-13 (anchor 2026-06-30, 13 days elapsed, 17 unused)"
            - "Member pauses until 2026-08-15; proration credit 623 lands in credit_balance_cents"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-13T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_PRO", servings_per_meal: 2, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { pp: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { za: $.data.id }
            - call: "POST /members"
              payload: { email: "pro@x.com", full_name: "Pro", shipping_zone_id: "${za}" }
              as: Anonymous
              captures: { pm: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${pm}", plan_id: "${pp}", monthly_addon_fee_cents: 1099, billing_cycle_day: 30 }
              as: Member
              as_user_id: "${pm}"
              captures: { ps: $.data.id, ps_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${ps}/pause"
              payload: { resume_date: "2026-08-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${pm}"
          trigger_note: "after pause, read the member to observe credited proration"
          assert:
            - "Member.${pm}.credit_balance_cents == 623"
            - "Subscription.${ps}.status == PAUSED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_active_paused_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Cyclic shape on Subscription: ACTIVE->PAUSED->ACTIVE returns to the prior state (a true cycle),
          with version monotonically incrementing each hop (1->2->3).
        test_recipe:
          setup:
            - "Subscription s ACTIVE (version 1)"
            - "Pause to a future date then resume"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CYC", servings_per_meal: 2, meals_per_week: 3 }
              as: PlatformAdmin
              captures: { pl: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /members"
              payload: { email: "cyc@x.com", full_name: "Cyc", shipping_zone_id: "${z}" }
              as: Anonymous
              captures: { mm: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${mm}", plan_id: "${pl}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${mm}"
              captures: { ss: $.data.id }
            - call: "POST /subscriptions/${ss}/pause"
              payload: { resume_date: "2026-08-01T00:00:00.000Z" }
              as: Member
              as_user_id: "${mm}"
          trigger:
            - call: "POST /subscriptions/${ss}/resume"
              payload: {}
              as: Member
              as_user_id: "${mm}"
              captures: { v_after: $.data.version }
          assert:
            - "Subscription.${ss}.status == ACTIVE"
            - "Subscription.${ss}.version == 3"
            - "Subscription.${ss}.scheduled_resume_date == null"

      - name: weekly_box_parallel_selection_x_fulfillment
        grounds:
          - state_machines.WeeklyBox.OPEN_to_LOCKED
          - state_machines.WeeklyBox.PENDING_to_CHARGED
          - entities.WeeklyBox.fields.selection_status
          - entities.WeeklyBox.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel dimensions on WeeklyBox: selection_status (OPEN->LOCKED) and fulfillment_status
          (PENDING->CHARGED) advance on independent axes — after charge the box reads selection_status=LOCKED
          AND fulfillment_status=CHARGED, two coordinates that changed via different triggers.
        test_recipe:
          setup:
            - "Box locked (selection LOCKED, fulfillment still PENDING)"
            - "Clock advanced past cutoff and box charged (fulfillment CHARGED, selection still LOCKED)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_PAR", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { plp: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zp: $.data.id }
            - call: "POST /recipes"
              payload: { title: "PR1" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "PR2" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /members"
              payload: { email: "par@x.com", full_name: "Par", shipping_zone_id: "${zp}" }
              as: Anonymous
              captures: { pmm: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${pmm}", plan_id: "${plp}", billing_cycle_day: 1 }
              as: Member
              as_user_id: "${pmm}"
              captures: { pss: $.data.id }
            - call: "POST /weekly-boxes"
              payload: { subscription_id: "${pss}", delivery_date: "2026-07-15T00:00:00.000Z" }
              as: Member
              as_user_id: "${pmm}"
              captures: { pbox: $.data.id }
            - call: "POST /weekly-boxes/${pbox}/recipes"
              payload: { recipe_id: "${p1}" }
              as: Member
              as_user_id: "${pmm}"
            - call: "POST /weekly-boxes/${pbox}/recipes"
              payload: { recipe_id: "${p2}" }
              as: Member
              as_user_id: "${pmm}"
            - call: "POST /weekly-boxes/${pbox}/lock-selection"
              payload: {}
              as: Member
              as_user_id: "${pmm}"
          trigger:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-11T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /weekly-boxes/${pbox}/charge"
              payload: {}
              as: PlatformOps
              captures: { ss_dim: $.data.selection_status, ff_dim: $.data.fulfillment_status }
          assert:
            - "WeeklyBox.${pbox}.selection_status == LOCKED"
            - "WeeklyBox.${pbox}.fulfillment_status == CHARGED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ship_settles_referral_credits_referrer_depth3
        grounds:
          - state_machines.WeeklyBox.CHARGED_to_SHIPPED
          - state_machines.Referral.PENDING_to_SETTLED
          - entities.Member.fields.credit_balance_cents
          - entities.Member.fields.lifetime_box_count
        distinguishing_aspect: |
          Depth-3 chain from CHARGED->SHIPPED: (A) box.fulfillment_status->SHIPPED bumps referee
          Member.lifetime_box_count; (B) that first-ship triggers the referee's PENDING Referral
          PENDING->SETTLED; (C) the Referral settlement itself credits the referrer Member by 1500.
          Each link is caused by the previous one, not the original ship.
        test_recipe:
          setup:
            - "Referrer R credit 0; referee E referred by R (PENDING referral)"
            - "E has a LOCKED box charged; this is E's first box"
            - "Shipping the box settles the referral and credits R by 1500"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "P_CAS", servings_per_meal: 2, meals_per_week: 2 }
              as: PlatformAdmin
              captures: { pc: $.data.id }
            - call: "POST /shipping-zones"
              payload: { zone_code: "ZONE_A", cold_pack_surcharge_cents: 0, cutoff_weekday: 5 }
              as: PlatformAdmin
              captures: { zc2: $.data.id }
            - call: "POST /recipes"
              payload: { title: "C1" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /recipes"
              payload: { title: "C2" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /members"
