            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Partial Pat", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Partial Quinn", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m2}", account_type: "PRIMARY", initial_deposit_cents: 50000 }, as: MembershipOfficer, captures: { acct2: "$.data.id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m2}", account_type: "SUPPLEMENTAL", initial_deposit_cents: 60000 }, as: MembershipOfficer, captures: { acct3: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id", pool: "$.data.declared_pool_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/share-accounts/${acct3}/close", as: MembershipOfficer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations/${decl1}/pay", as: OperationsOfficer, captures: { st: "$.data.status", paid_total: "$.data.paid_total_cents" } }
            - { call: "GET /credit-union/dividend-declarations/${decl1}/payments", as: OperationsOfficer, captures: { s0: "$.data[0].status", c0: "$.data[0].credited_amount_cents", s1: "$.data[1].status", c1: "$.data[1].credited_amount_cents", s2: "$.data[2].status", a2: "$.data[2].accrued_amount_cents" } }
            - { call: "GET /credit-union/share-accounts/${acct1}", as: OperationsOfficer, captures: { bal1: "$.data.balance_cents" } }
          assert:
            - "pool == 1071 (510 + 255 + 306 accrued while all three accounts were OPEN)"
            - "st == PAID; rows in account created_at order: s0 == CREDITED, c0 == 510; s1 == CREDITED, c1 == 255; s2 == VOIDED with a2 == 306 (accrued but never credited)"
            - "paid_total == 765 (510 + 255; the VOIDED row contributes nothing)"
            - "bal1 == 100510 (DIVIDEND_CREDIT posted on payable_date)"

      - name: scheduled_grace_closure_cancelled_by_late_cure
        claim_type: scheduled_actions
        grounds: [state_machines.Member.GRACE_PERIOD_to_CLOSED_INELIGIBLE, state_machines.Member.GRACE_PERIOD_to_ACTIVE]
        distinguishing_aspect: "The scheduled sweep closure is cancellable: a cure before grace_end_date clears grace_end_date, and sweeping past the original date then leaves the member ACTIVE."
        test_recipe:
          setup: ["member in GRACE_PERIOD with grace_end_date 2026-10-30; late cure (fresh review by co-1, cured by co-2) on 2026-10-15"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Grace Gus", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev1: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev2: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev2}/cure", payload: { resolution_note: "eligibility re-established" }, as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "GET /credit-union/members/${m1}", as: ComplianceOfficer, captures: { st_mid: "$.data.status", grace_mid: "$.data.grace_end_date" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/members/${m1}", as: ComplianceOfficer, captures: { st_end: "$.data.status" } }
          assert:
            - "st_mid == ACTIVE and grace_mid == null after the late cure"
            - "st_end == ACTIVE after sweeping past the original grace_end_date (the scheduled closure was cancelled)"

      - name: derived_running_balance_after_backdated_insert
        claim_type: derived_field_reconciliation
        grounds: [calculations.share_balance_replay, entities.ShareAccount.fields.balance_cents]
        distinguishing_aspect: "A backdated deposit rewrites the derived running balances of later rows: opening 100,000 (08-01) and withdrawal 20,000 (08-03) exist; inserting a 50,000 deposit posted 08-02 yields running balances 100,000 / 150,000 / 130,000."
        test_recipe:
          setup: ["PRIMARY opened 2026-08-01 with 100,000; withdrawal 20,000 posted 2026-08-03 (created first)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Replay Ray", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 20000, posted_date: "2026-08-03" }, as: OperationsOfficer }
          trigger:
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 50000, posted_date: "2026-08-02" }, as: OperationsOfficer, captures: { rb_new: "$.data.running_balance_cents" } }
            - { call: "GET /credit-union/share-accounts/${acct1}/transactions", as: OperationsOfficer, captures: { r0: "$.data[0].running_balance_cents", r1: "$.data[1].running_balance_cents", r2: "$.data[2].running_balance_cents" } }
            - { call: "GET /credit-union/share-accounts/${acct1}", as: OperationsOfficer, captures: { bal: "$.data.balance_cents" } }
          assert:
            - "replay order is posted_date ASC: r0 == 100000 (08-01 opening), rb_new == 150000 (backdated 08-02 deposit), r1 == 150000, r2 == 130000 (08-03 withdrawal rewritten)"
            - "bal == 130000 (derived field reconciled after the backdated insert)"

