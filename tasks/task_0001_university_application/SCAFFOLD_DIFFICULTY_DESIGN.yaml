            - "Application.${app_ee1_id}.status == 'ENROLLED' (unchanged — open-ended occupation continues)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: submit_withdraw_preserves_applicant_submission_count
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
          - entities.Applicant.fields.submitted_application_count
        distinguishing_aspect: |
          Conserved quantity: Applicant.submitted_application_count. The
          formula `submitted_application_count_after = submitted_application_count_before`
          MUST hold across the round-trip SUBMIT(+1) → WITHDRAW(−1) on the same
          Application. Forward action: DRAFT→SUBMITTED. Compensation:
          SUBMITTED→WITHDRAWN.
        test_recipe:
          setup:
            - "Applicant A has Applicant.submitted_application_count == 0 (no prior submits), and a DRAFT Application app_inv1 that is fully eligible to submit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /schools"
              payload: { name: "U Inv1", state_code: "NM", admission_track: "REGULAR", deadline_iso: "2026-12-01T00:00:00Z", decision_release_iso: "2027-03-15T00:00:00Z", target_class_size: 100, assumed_yield_rate: 0.50, in_state_tuition_cents: 5000000, out_of_state_tuition_cents: 9000000, international_tuition_cents: 12000000 }
              as: PlatformAdmin
              captures: { s_inv1_id: $.data.id }
            - call: "POST /applicants"
              payload: { email: "inv1@u.edu", full_name: "Inv1 A", gpa_unweighted: 3.50, sat_total: 1300, residency: "IN_STATE" }
              as: Anonymous
              captures: { a_inv1_id: $.data.id, count_before: $.data.submitted_application_count }
            - call: "POST /financial-aid-profiles"
              payload: { applicant_id: "${a_inv1_id}", profile_type: "FAFSA", household_income_cents: 8000000, household_size: 4 }
              as: Applicant
              as_user_id: "${a_inv1_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${a_inv1_id}", school_id: "${s_inv1_id}" }
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { app_inv1_id: $.data.id }
            - call: "POST /essays"
              payload: { application_id: "${app_inv1_id}", prompt_code: "P1", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_inv1_id}"
            - call: "POST /essays"
              payload: { application_id: "${app_inv1_id}", prompt_code: "P2", word_count: 500, text: "essay.", completed: true }
              as: Applicant
              as_user_id: "${a_inv1_id}"
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_inv1_id}", school_id: "${s_inv1_id}", recommender_email: "rinv1a@x.edu" }
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { rec_inv1a: $.data.id }
            - call: "POST /recommendation-requests"
              payload: { applicant_id: "${a_inv1_id}", school_id: "${s_inv1_id}", recommender_email: "rinv1b@x.edu" }
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { rec_inv1b: $.data.id }
            - call: "POST /recommendation-requests/${rec_inv1a}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
            - call: "POST /recommendation-requests/${rec_inv1b}/submit"
              payload: { rating: 4 }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_inv1_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { count_mid: null }
            - call: "GET /applicants/${a_inv1_id}"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { count_after_submit: $.data.submitted_application_count }
            - call: "POST /applications/${app_inv1_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv1_id}"
            - call: "GET /applicants/${a_inv1_id}"
              payload: {}
              as: Applicant
              as_user_id: "${a_inv1_id}"
              captures: { count_after_withdraw: $.data.submitted_application_count }
          assert:
            - "Applicant.${a_inv1_id}.submitted_application_count == 0 after the full round-trip (compensation invariant: submit +1 then withdraw -1 nets to 0)"
            - "Intermediate observation: count_after_submit == 1, count_after_withdraw == 0"
            - "Application.${app_inv1_id}.status == 'WITHDRAWN'"

      - name: admit_decline_preserves_school_decision_volume
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
          - state_machines.Application.ADMITTED_to_DECLINED
          - entities.School.fields.admitted_count
          - entities.School.fields.declined_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1: the per-school decision
          volume `admitted_count + declined_count + enrolled_count + denied_count`
          (total terminal-or-admitted decisions). Across the round-trip
          ADMIT(+1 to admitted) → DECLINE(−1 from admitted, +1 to declined),
          this quantity is preserved (net zero). Forward: UNDER_REVIEW→ADMITTED.
          Compensation: ADMITTED→DECLINED (with FINALIZED-aid cascade).
