      - name: abn_state_beats_superseded_on_signing_voided_notice_rejected
        grounds:
          - validations[priority=23]
          - validations[priority=49]
          - errors[ERR_INVALID_ABN_STATE]
          - errors[ERR_ABN_SUPERSEDED]
          - state_machines.AbnNotice.ISSUED_to_VOIDED
          - state_machines.DispenseEncounter.ABN_ISSUED_to_ABN_ISSUED
        distinguishing_aspect: |
          Category pair (state, business_constraint): priority 23
          ERR_INVALID_ABN_STATE and priority 49 ERR_ABN_SUPERSEDED are both
          violated by signing notice_seq 1 after a corrected notice_seq 2 was
          issued -- notice 1 is VOIDED (not ISSUED) AND it no longer holds the
          greatest notice_seq -- and the response is 409 ERR_INVALID_ABN_STATE.
          The (state, ...) pairing here is against business_constraint, not the
          business_safety of the first instance.
        test_recipe:
          setup:
            - "one accredited clinic, one group physician, one patient, one SPINE product priced at 11765 cash"
            - "one documented encounter whose coverage verification came back NOT covered, so financial_status is NON_COVERED"
            - "an advance beneficiary notice is issued (notice_seq 1), then re-issued with a corrected reason (notice_seq 2), which voids notice 1"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
