              as: SystemAdmin
            - call: "GET /training-assignments/${ta_id}"
              payload: {}
              as: SystemAdmin
          assert:
            - "before the trigger the assignment reads status ASSIGNED with assigned_on == 2026-08-01T00:00:00Z"
            - "after the trigger the same row reads status EXPIRED with completed_on == null and waived_on == null"
            - "the assignment's version equals the captured ta_ver — no write occurred"
            - "Investigator.${inv_id}.training_compliant == false (an institution-wide EXPIRED assignment breaks compliance)"

