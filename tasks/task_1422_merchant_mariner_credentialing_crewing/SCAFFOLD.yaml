    side_effects: ["status -> VALID", "recompute Mariner.readiness_posture"]
  - method: POST
    path: "/mariners/{id}/credentials/{credentialId}/revoke"
    description: "VALID -> REVOKED; dependents -> SUSPENDED_PREREQ; posture cascade"
    roles: [CredentialingOfficer]
    code: 200
    input: [reason]
    output: Credential
    side_effects: ["status -> REVOKED", "dependent credentials VALID|RENEWAL_PENDING -> SUSPENDED_PREREQ", "recompute Mariner.readiness_posture", "if BLOCKED: future CONFIRMED assignments -> SUSPENDED"]
  - method: POST
    path: "/mariners/{id}/credentials/{credentialId}/reinstate"
    description: "SUSPENDED_PREREQ -> VALID manual reinstate when prerequisite already VALID (audited override)"
    roles: [CredentialingOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: ["status -> VALID (requires prerequisite VALID else ERR_ENDORSEMENT_PREREQUISITE_INVALID)", "recompute Mariner.readiness_posture"]

