# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Corners already exercised by a §1.8 instance are emitted as excluded_because
# stubs. Names are unique across both design files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_create_applies_defaults
        claim_type: defaults
        grounds: ["entities.Agency"]
        distinguishing_aspect: "POST /agencies with only required fields returns posture NORMAL, period_index 0, books_closed_through_period_index null, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency D", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id, posture: $.data.posture, pidx: $.data.period_index, books: $.data.books_closed_through_period_index, ver: $.data.version } }
          trigger: []
          assert:
            - "${posture} == NORMAL and ${pidx} == 0 and ${books} == null and ${ver} == 1"
            - "response contains id as a bare UUID and ISO8601 created_at with three fractional digits"

      - name: query_create_computes_triage_score_ignores_nothing
        claim_type: computed_fields
        grounds: ["entities.QueryLetter.fields.triage_score", "calculations.slush_triage_score"]
        distinguishing_aspect: "FICTION (40) + word_count 90000 in [70000, 120000] (40) + author PROSPECT (10) yields triage_score 90 computed server-side at intake."
        test_recipe:
          setup: ["agency, agent, PROSPECT author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency TS", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
          trigger:
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id, score: $.data.triage_score, st: $.data.status } }
          assert:
            - "${score} == 90"
            - "${st} == RECEIVED   # initial state"
            - "QueryLetter.${q1}.assigned_agent_id == null"

      - name: query_create_with_computed_field_in_payload_invalid_request
        claim_type: computed_fields
        grounds: ["entities.QueryLetter.fields.triage_score", "validations[priority=3]"]
        distinguishing_aspect: "Passing the server-computed triage_score in the create payload is an undeclared field and must be rejected ERR_INVALID_REQUEST, not silently accepted."
        test_recipe:
          setup: ["agency, agent, author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency CF", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
          trigger:
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000, triage_score: 1 }, as: Agent, as_user_id: "${agent1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST   # http 400; computed field must not be client-settable"

      - name: author_create_defaults_prospect
        claim_type: defaults
        grounds: ["entities.Author.fields.status"]
        distinguishing_aspect: "Author created without any status input starts PROSPECT and version 1."
        test_recipe:
          setup: ["agency"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency AU", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "New Author", email: "na@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { st: $.data.status, ver: $.data.version } }
          assert:
            - "${st} == PROSPECT and ${ver} == 1"

      - name: get_nonexistent_deal_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /deals/{random-uuid} returns 404 ERR_NOT_FOUND envelope with error_id and message keys."
        test_recipe:
          setup: ["agency exists"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency NF", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /deals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND   # http 404"

      - name: agency_create_missing_name_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /agencies without required field name returns 400 ERR_INVALID_REQUEST before any existence or state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /agencies", payload: { commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST   # http 400"

      - name: query_create_invalid_genre_enum_invalid_request
        claim_type: type_constraints
        grounds: ["entities.QueryLetter.fields.genre", "validations[priority=3]"]
        distinguishing_aspect: "genre 'ROMANCE' is outside {FICTION, NONFICTION, YA, MEMOIR} and is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["agency, agent, author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency EN", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
          trigger:
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "ROMANCE", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST   # http 400"

      - name: authors_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints: GET /authors"]
        distinguishing_aspect: "With 3 authors and limit 2: page 1 returns 2 items with total_count 3 and has_more true; page 2 (offset 2) returns 1 item with has_more false."
        test_recipe:
          setup: ["agency with exactly 3 authors"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency PG", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "A1", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1" }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "A2", email: "a2@x.com" }, as: AgencyAdmin, as_user_id: "admin-1" }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "A3", email: "a3@x.com" }, as: AgencyAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /authors", payload: { agency_id: "${ag}", limit: 2, offset: 0 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { page1: $.data } }
            - { call: "GET /authors", payload: { agency_id: "${ag}", limit: 2, offset: 2 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { page2: $.data } }
          assert:
            - "page 1: len(data) == 2, meta/pagination shows total_count == 3 and has_more == true"
            - "page 2: len(data) == 1 and has_more == false"

      - name: agent_version_increments_on_toggle
        claim_type: system_fields
        grounds: ["entities.Agent.fields.status", "state_machines.Agent"]
        distinguishing_aspect: "Agent created at version 1; deactivate bumps version to 2 and status INACTIVE; activate bumps to 3 and status ACTIVE."
        test_recipe:
          setup: ["agency with one agent"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency VS", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /agents/${agent1}/deactivate", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { v2: $.data.version, st2: $.data.status } }
            - { call: "POST /agents/${agent1}/activate", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { v3: $.data.version, st3: $.data.status } }
          assert:
            - "${v1} == 1 and ${v2} == 2 and ${st2} == INACTIVE and ${v3} == 3 and ${st3} == ACTIVE"

      - name: cross_agency_author_reference_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", "entities.QueryLetter.fields.author_id"]
        distinguishing_aspect: "An Agent of agency A creating a query for an author of agency B gets ERR_NOT_FOUND — the author does not exist within the acting agent's agency scope (tenant isolation)."
        test_recipe:
          setup: ["agencies A and B; agent in A; author in B"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agA: $.data.id } }
            - { call: "POST /agencies", payload: { name: "Agency B", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agB: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${agA}", display_name: "Agent A", email: "aa@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agentA: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${agB}", display_name: "Author B", email: "ab@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { authorB: $.data.id } }
          trigger:
            - { call: "POST /query-letters", payload: { author_id: "${authorB}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agentA}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND   # 404: cross-tenant reference is invisible, not merely forbidden"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: query_initial_state_received
        claim_type: initial_state
        grounds: ["state_machines.QueryLetter"]
        distinguishing_aspect: "A freshly intaken query is RECEIVED; excluded triage coverage is separate."
        test_recipe:
          setup: ["agency, agent, author"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency IS", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
          trigger:
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 60000 }, as: Agent, as_user_id: "${agent1}", captures: { st: $.data.status } }
          assert:
            - "${st} == RECEIVED"

      - name: reject_from_requested_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.QueryLetter", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reject is only defined from RECEIVED or IN_REVIEW; from REQUESTED it fails ERR_INVALID_STATE and the query stays REQUESTED."
        test_recipe:
          setup: ["query assigned and manuscript requested (status REQUESTED)"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency IV", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /query-letters/${q1}/reject", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE   # http 409"
            - "QueryLetter.${q1}.status == REQUESTED"

      - name: terminal_lockdown_pass_on_passed_submission
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Submission"]
        distinguishing_aspect: "PASSED is terminal: a second pass on the same submission fails ERR_INVALID_STATE; likewise withdraw on PASSED fails."
        test_recipe:
          setup: ["signed pipeline; round open; submission s1 sent then passed (PASSED)"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency TL", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/pass", payload: {}, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /submissions/${s1}/pass", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { err1: $.data.error_id } }
            - { call: "POST /submissions/${s1}/withdraw", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_STATE and ${err2} == ERR_INVALID_STATE"
            - "Submission.${s1}.status == PASSED"

      - name: request_manuscript_spawns_manuscript_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.QueryLetter.IN_REVIEW_to_REQUESTED", "entities.Manuscript"]
        distinguishing_aspect: "request-manuscript returns the created Manuscript (SUBMITTED, reader_agent_id = assigned agent, author_id copied) and the manuscript is discoverable via GET /manuscripts?query_letter_id."
        test_recipe:
          setup: ["query assigned (IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency SE", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Spawned" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id, mst: $.data.status, mra: $.data.reader_agent_id, mau: $.data.author_id } }
            - { call: "GET /manuscripts", payload: { query_letter_id: "${q1}" }, as: Agent, as_user_id: "${agent1}", captures: { found: $.data } }
          assert:
            - "${mst} == SUBMITTED and ${mra} == ${agent1} and ${mau} == ${author1}"
            - "GET /manuscripts?query_letter_id=${q1} returns exactly 1 row with id ${ms1}"
            - "QueryLetter.${q1}.status == REQUESTED and requested_period_index == 0"

      - name: deal_terminate_waives_scheduled_installments
        claim_type: cross_entity
        grounds: ["state_machines.Deal.EXECUTED_to_TERMINATED", "state_machines.AdvanceInstallment"]
        distinguishing_aspect: "Terminating an EXECUTED deal cascades: SCHEDULED installments (ON_DELIVERY, ON_PUBLICATION) become WAIVED while an already-PAID ON_SIGNING stays PAID."
        test_recipe:
          setup:
            - "Executed deal (advance 1000000) at period 0; ON_SIGNING marked PAID (deal -> ACTIVE); ON_DELIVERY and ON_PUBLICATION still SCHEDULED"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency DT", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { edA: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "T" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements", payload: { author_id: "${author1}", manuscript_id: "${ms1}", agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}", captures: { agr1: $.data.id } }
            - { call: "POST /client-agreements/${agr1}/offer", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /client-agreements/${agr1}/sign", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submission-rounds", payload: { manuscript_id: "${ms1}", agent_id: "${agent1}", max_editors: 5 }, as: Agent, as_user_id: "${agent1}", captures: { r1: $.data.id, rv1: $.data.version } }
            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edA}" }, as: Agent, as_user_id: "${agent1}", captures: { s1: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /submissions/${s1}/send", payload: {}, as: Agent, as_user_id: "${agent1}" }
