        grounds:
          - entities.CareTeam
          - endpoints."PUT /enrollments/{enrollmentId}/care-team"
        distinguishing_aspect: "PUT /enrollments/{id}/care-team with primary_np_id, social_worker_id, and behavioral_clinician_id all set yields composition_complete == true."
        test_recipe:
          setup: ["Enrollment E in CONSENTED with CareTeam DRAFT; NP, SW, BH clinicians exist."]
