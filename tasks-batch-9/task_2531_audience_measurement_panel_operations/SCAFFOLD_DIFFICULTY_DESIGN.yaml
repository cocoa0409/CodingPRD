  - rule_id: compensating_invariant
    instances:

      - name: accrual_reversal_conserves_incentive_ledger
        grounds:
          - calculations.incentive_accrual_cents
          - endpoints[POST /households/{household_id}/accrue-incentive]
          - endpoints[POST /households/{household_id}/reverse-accrual]
          - entities.Household.fields.incentive_accrued_cents
          - entities.Household.fields.accrual_periods
          - entities.Market.fields.incentive_budget_committed_cents
          - validations[priority=65]
        distinguishing_aspect: |
          Conserved quantity: committed incentive money (Household.incentive_accrued_cents and its
          market roll-up incentive_budget_committed_cents). A reversal returns both to exactly their
          pre-accrual value 0 while the accrual_periods entry keeps accrued_cents 3632 for audit, and
          re-accruing the freed period_label reproduces 3632 to the cent.
        test_recipe:
          setup:
            - "Market DMA-519 with incentive_budget_cents 1000000 and one quota cell (target 1, base incentive 3000)."
            - "One household recruited at the startup clock 2026-08-01T00:00:00Z with an installed TV_TUNER and an installed PORTABLE_OOH meter, enumerated COMPLIANT, so it is ACTIVE, its cell is FILLED and effective_incentive_multiplier is back to 1.00 with incentive_budget_reserved_cents 0."
            - "At clock 2026-02-14 + 6 months, i.e. 2027-02-14T00:00:00Z, a 350-minute tuner interval is ingested for 2027-02-13, which snapshots compliance_rate_rolling_30 at 1.0000 (one reported day, 350 >= 30 minutes)."
            - "The clock is then moved to 2027-02-15T00:00:00Z: the household's tenure is floor(198 days / 30) == 6 months, so the tenure multiplier is 1.075."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Tau", market_code: "DMA-519", dma_rank: 19, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
