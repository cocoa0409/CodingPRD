            - "Order.${ord_id}.fulfillment_status == AWAITING_PAYMENT"
            - "Order.${ord_id}.payment_status == UNPAID"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auction_close_instant_boundary_inclusive   # interval: bid accepted strictly before effective_end_at; == close is rejected
        grounds:
          - "validations[priority=7]"
          - state_machines.Listing.ACTIVE_to_ENDED_NO_BIDS
          - entities.Listing.fields.effective_end_at
          - "errors[ERR_AUCTION_CLOSED]"
        distinguishing_aspect: |
          Interval semantics #1 — half-open [start, end): a bid is accepted only while current_clock < effective_end_at;
          a bid AT exactly effective_end_at falls outside the open interval and is rejected ERR_AUCTION_CLOSED.
          With end 2026-06-10T00:00:00Z and clock advanced to exactly 2026-06-10T00:00:00Z, the bid is rejected.
        test_recipe:
          setup:
            - "Seller S publishes AUCTION start 10000 ending 2026-06-10T00:00:00Z; clock advanced to exactly the close instant (auction closes ENDED_NO_BIDS)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s15@x.com", display_name: "S15", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "a15@x.com", display_name: "A15", roles: ["BUYER"] }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Auc P", format: "AUCTION", start_price_cents: 10000, scheduled_end_at: "2026-06-10T00:00:00Z" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /listings/${lst_id}/bids"
              payload: { bidder_account_id: "${a_id}", max_proxy_cents: 12000 }
              as: Buyer
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AUCTION_CLOSED"
            - "Listing.${lst_id}.status == ENDED_NO_BIDS"

      - name: return_window_buffered_interval_exclusive   # interval: complete-return allowed within [delivered, delivered+window]; past window rejected
        grounds:
          - "validations[priority=8]"
          - state_machines.Order.DELIVERED_to_RETURNED
          - entities.Order.fields.fulfillment_status
          - "errors[ERR_WINDOW_EXPIRED]"
        distinguishing_aspect: |
          Interval semantics #2 on a DIFFERENT resource (Order, not Listing) — a buffered closed window
          [delivered_at, delivered_at + RETURN_WINDOW_SECONDS]: a complete-return is allowed up to and including
          the buffer end but rejected strictly after. Delivered at 2026-06-02T00:00:00Z, window 14d ends
          2026-06-16T00:00:00Z; at clock 2026-06-17T00:00:00Z (past buffer) the return is rejected ERR_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Seller S, Buyer B; BUY_NOW 20000 bought, paid, shipped, delivered at 2026-06-02T00:00:00Z; clock advanced to 2026-06-17 (past 14d return window)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s16@x.com", display_name: "S16", roles: ["SELLER"] }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "b16@x.com", display_name: "B16", roles: ["BUYER"] }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { seller_account_id: "${s_id}", title: "Ret Q", format: "BUY_NOW", buy_now_price_cents: 20000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /listings/${lst_id}/buy-now"
              payload: { buyer_account_id: "${b_id}", shipping_cents: 0 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/pay"
              payload: { expected_order_version: "${ord_v}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /orders/${ord_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
