              captures: { ord_k: $.data.id, ord_k_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_k}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_k}"
              captures: { ord_k_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_k}/dispatch"
              payload: { broker_id: "${brk_k}", expected_order_version: "${ord_k_v2}" }
              as: DispatchCoordinator
            - call: "POST /bpo/valuation-orders/${ord_k}/accept"
              payload: {}
