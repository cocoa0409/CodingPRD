            - "the 16:01-17:01 candidate returns 409 ERR_RECOVERY_BAY_UNAVAILABLE against the just-accepted case: [17:01, 18:31] touches [15:31, 17:01] at 17:01, proving the check reads live bookings"
            - "the 16:02-17:02 candidate returns 201, so the room ends the day with exactly three SCHEDULED procedures despite recovery_bay_count 1"
