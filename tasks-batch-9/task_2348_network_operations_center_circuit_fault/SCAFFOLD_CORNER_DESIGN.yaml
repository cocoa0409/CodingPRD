              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-19T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
