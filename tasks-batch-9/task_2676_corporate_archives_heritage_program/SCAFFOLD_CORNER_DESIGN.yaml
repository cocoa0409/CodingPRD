          assert:
            - "HTTP status is 200"
            - "PreservationPlan.${plan_id}.status == ACTIVE"
            - "PreservationPlan.${plan_id}.at_risk_unit_count == 13"
            - "ArchivalItem.${tape_loaned_id}.status == ON_LOAN"
            - "ArchivalItem.${paper_a_id}.status == UNPROCESSED"
            - "ArchivalItem.${tape_a_id}.digital_surrogate_available == false"

      - name: access_service_fee_tier_zero_at_99_pages_external_researcher
        claim_type: correct_result
        grounds:
          - calculations.access_service_fee
          - calculations.access_service_fee.constants.PAGES_PER_UNIT
