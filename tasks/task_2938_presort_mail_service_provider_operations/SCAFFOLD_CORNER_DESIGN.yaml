      - name: terminal_state_lockdown_accepted_statement_refuses_void_and_findings
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PostageStatement.terminal_states
          - validations[priority=13]
          - errors.ERR_INVALID_STATEMENT_STATE
        distinguishing_aspect: "ACCEPTED_CLEAN is declared terminal, so no edge leaves it — not void (which would try to return an already-consumed reservation) and not a new finding (which would try to re-price a closed statement). Both must be refused with 409 ERR_INVALID_STATEMENT_STATE while the permit ledger stays exactly where acceptance left it."
        test_recipe:
          setup:
            - "The canonical batch is sorted and its statement submitted by pm-001 against the house permit funded with 200000 c."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { accepted_status: $.data.status }
            - call: "POST /postage-statements/${stmt_id}/void"
              payload: { reason: "too late" }
              as: PostageManager
              as_user_id: "pm-001"
              captures: { err_void: $.data.error_id }
            - call: "POST /postage-statements/${stmt_id}/findings"
              payload: { finding_type: "SHORT_PAID", affected_piece_count: 100 }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { err_finding: $.data.error_id }
          assert:
            - "${accepted_status} == ACCEPTED_CLEAN, a declared terminal state, with verified_postage_cents == 79152"
            - "Void attempt: HTTP 409 with ${err_void} == ERR_INVALID_STATEMENT_STATE and void_reason still null"
            - "Finding attempt: HTTP 409 with ${err_finding} == ERR_INVALID_STATEMENT_STATE, verification_error_count still 0 and adjustment_cents still 0"
            - "The ledger is unmoved by both refusals: PermitAccount.${pa_h_id}.balance_cents == 120848 and reserved_cents == 0, and CommingleBatch.${batch_id}.status == DOCUMENTED"

      - name: idempotency_second_cancel_of_a_cancelled_shipment_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.DropShipment.SCHEDULED_to_CANCELLED
          - validations[priority=14]
          - errors.ERR_INVALID_SHIPMENT_STATE
          - calculations.dock_capacity_occupancy
        distinguishing_aspect: "Repeating a completed transition is an error, not a silent success: the second cancel must return 409 ERR_INVALID_SHIPMENT_STATE and must not overwrite cancel_reason or bump version again. The cancelled shipment must also drop out of dock occupancy, which the follow-up booking of the full dock proves."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00.000Z; facility DDU-021 has dock_capacity_pallets_per_slot 4 and two empty OPEN batches exist."
            - "Batch 1 holds a SCHEDULED 4-pallet shipment for [2026-08-12T10:00:00.000Z, 14:00:00.000Z), filling the dock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: BureauAdmin
            - call: "POST /entry-facilities"
              payload: { facility_code: "DDU-021", facility_type: "DDU", zip3: "021", dock_capacity_pallets_per_slot: 4, drop_ship_discount_bp: 500, served_zip3_list: ["021"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_1_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_2_id: $.data.id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_1_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T10:00:00.000Z", window_end_utc: "2026-08-12T14:00:00.000Z", pallet_count: 4 }
              as: PresortOperator
              captures: { ship_1_id: $.data.id }
          trigger:
            - call: "POST /drop-shipments/${ship_1_id}/cancel"
              payload: { reason: "truck breakdown" }
              as: PresortOperator
              captures: { s1: $.data.status, v1: $.data.version }
            - call: "POST /drop-shipments/${ship_1_id}/cancel"
              payload: { reason: "second thoughts" }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /drop-shipments"
              payload: { commingle_batch_id: "${batch_2_id}", entry_facility_id: "${fac_id}", window_start_utc: "2026-08-12T10:00:00.000Z", window_end_utc: "2026-08-12T14:00:00.000Z", pallet_count: 4 }
              as: PresortOperator
              captures: { ship_2_id: $.data.id }
          assert:
            - "First cancel: HTTP 200 with ${s1} == CANCELLED, cancel_reason == 'truck breakdown' and ${v1} == 2"
            - "Second cancel: HTTP 409 with ${err_id} == ERR_INVALID_SHIPMENT_STATE; cancel_reason is still 'truck breakdown' (not 'second thoughts') and version is still 2"
            - "Re-booking the identical window for the other batch succeeds: DropShipment.${ship_2_id}.status == SCHEDULED with pallet_count 4, proving the CANCELLED shipment no longer occupies the dock"

      - name: ledger_sync_client_unbilled_postage_after_clean_acceptance
        claim_type: ledger_sync
        grounds:
          - state_machines.PostageStatement.SUBMITTED_to_ACCEPTED_CLEAN
          - entities.Client.fields.unbilled_postage_cents
          - entities.MailJob.fields.postage_due_cents
        distinguishing_aspect: "Acceptance is where money stops being the bureau's and becomes each client's receivable: every member job's postage_due_cents is written from its BatchMember allocation and then ADDED to that job's Client.unbilled_postage_cents. The two ledgers must agree with the batch pool (31660 + 47492 == 79152) and the house account that funded the statement must gain nothing, since it owns no member job."
        test_recipe:
          setup:
            - "The canonical batch is sorted and its statement submitted by pm-001; both clients still have unbilled_postage_cents == 0 and both jobs postage_due_cents == 0."
          setup_api_calls: *corner_chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "GET /clients/${cl_a_id}"
              payload: {}
              as: PostageManager
              captures: { unbilled_a: $.data.unbilled_postage_cents }
            - call: "GET /clients/${cl_b_id}"
              payload: {}
              as: PostageManager
              captures: { unbilled_b: $.data.unbilled_postage_cents }
            - call: "GET /clients/${cl_h_id}"
              payload: {}
              as: PostageManager
              captures: { unbilled_h: $.data.unbilled_postage_cents }
          assert:
            - "MailJob.${job_a_id}.postage_due_cents == 31660 and MailJob.${job_b_id}.postage_due_cents == 47492, each equal to its BatchMember allocated_postage_cents"
            - "${unbilled_a} == 31660 and ${unbilled_b} == 47492, and 31660 + 47492 == 79152 == the batch pool — the client ledgers reconcile with the statement"
            - "${unbilled_h} == 0: the house account funded the postage but owns no member job, so nothing is receivable from it"
            - "Both jobs stay PRESORTED and every BatchMember.allocated_adjustment_cents == 0 on the clean branch"

      - name: side_effect_execution_deposit_closes_batch_and_opens_records
        claim_type: side_effect_execution
        grounds:
          - state_machines.CommingleBatch.DOCUMENTED_to_CLOSED
          - state_machines.SortContainer.DOCUMENTED_to_DEPOSITED
        excluded_because:
          difficulty_instance: transitive_cascade / deposit_cascade_depth_three
          rationale: "Every side effect of the deposit transition — batch closure, container deposit, ServiceLevelRecord creation with zone/committed_days/piece_count, job MAILED with mailed_at_utc, and the client lifetime_pieces_mailed ledger — is asserted there with literal values."

      - name: compensation_void_reverses_the_submit_reservation
        claim_type: compensation
        grounds:
          - state_machines.PostageStatement.SUBMITTED_to_VOID
          - state_machines.CommingleBatch.DOCUMENTED_to_SORTED
        excluded_because:
          difficulty_instance: compensating_invariant / permit_funds_conservation_on_submit_then_void
          rationale: "That instance asserts the full undo — reserved funds returned with zero drift, batch compensated DOCUMENTED -> SORTED, and the sortation's allocations deliberately left intact."

      - name: cascade_down_statement_return_unwinds_members_and_containers
        claim_type: cascade_down
        grounds:
          - state_machines.CommingleBatch.DOCUMENTED_to_REWORK
          - state_machines.MailJob.PRESORTED_to_REWORK
        excluded_because:
          difficulty_instance: transitive_cascade / statement_return_cascade_depth_four
          rationale: "The four-link downward cascade (statement -> batch -> members/jobs/containers -> client suspension) is asserted link by link there, including the fact that only non-terminal children are touched."

  # ===========================================================================
  # Section 3 — Calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: correct_result_zone_and_committed_days_from_facility_and_zip3
        claim_type: correct_result
        grounds:
          - calculations.zone_and_service_commitment
          - entities.SortContainer.fields.zone
          - entities.SortContainer.fields.committed_days
        distinguishing_aspect: "Two containers on the SAME batch and facility must get different zones purely from served_zip3_list membership: 021 is served by DDU-021 so zone 1 / base 1, while 941 is not served at all so it falls to zone 8 / base 5. Membership is exact string matching with no prefix logic, and with FIRST_CLASS the adder is 0, so committed_days are 1 and 5 — a implementation that defaulted unserved destinations to the facility's own zone would report 1 and 1."
        test_recipe:
          setup:
            - "One OPEN EntryFacility DDU-021 of type DDU, zip3 021, served_zip3_list exactly ['021']."
            - "One OPEN FIRST_CLASS/LETTERS CommingleBatch entered at that facility."
          setup_api_calls:
            - call: "POST /entry-facilities"
              payload: { facility_code: "DDU-021", facility_type: "DDU", zip3: "021", dock_capacity_pallets_per_slot: 6, drop_ship_discount_bp: 500, served_zip3_list: ["021"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "FIRST_CLASS", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "021", sort_level: "FIVE_DIGIT", piece_count: 200 }
              as: PresortOperator
              captures: { zone_served: $.data.zone, days_served: $.data.committed_days }
            - call: "POST /commingle-batches/${batch_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "941", sort_level: "THREE_DIGIT", piece_count: 200 }
              as: PresortOperator
              captures: { zone_unserved: $.data.zone, days_unserved: $.data.committed_days }
          assert:
            - "Served destination: ${zone_served} == 1 and ${days_served} == 1 (DDU base 1 + CLASS_DAY_ADDER.FIRST_CLASS 0)"
            - "Unserved destination: ${zone_unserved} == 8 and ${days_unserved} == 5 (unserved base 5 + 0), not the facility's own zone 1"
            - "Both containers are STAGED and qualifying: TRAY at FIVE_DIGIT needs 150 pieces and TRAY at THREE_DIGIT needs 150, and 200 clears both"

      - name: constants_applied_class_day_adder_across_three_mail_classes
        claim_type: constants_applied
        grounds:
          - calculations.zone_and_service_commitment.constants.CLASS_DAY_ADDER
          - entities.CommingleBatch.fields.mail_class
        distinguishing_aspect: "The three CLASS_DAY_ADDER entries are not interchangeable and the adder comes from the BATCH's mail_class, not from the container. Three batches at the identical SCF facility with the identical container therefore commit to 2, 3 and 4 days (base 2 plus 0 / 1 / 2) while all three sit in zone 2 — a hard-coded adder would flatten all three to the same number."
        test_recipe:
          setup:
            - "One OPEN EntryFacility SCF-021 of type SCF serving ['021','022']."
            - "Three OPEN batches at that facility, one per mail class: FIRST_CLASS, PERIODICALS and MARKETING_MAIL, all LETTERS."
          setup_api_calls:
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "FIRST_CLASS", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_fc_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "PERIODICALS", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_pe_id: $.data.id }
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_mm_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_fc_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "022", sort_level: "FIVE_DIGIT", piece_count: 300 }
              as: PresortOperator
              captures: { days_fc: $.data.committed_days, zone_fc: $.data.zone }
            - call: "POST /commingle-batches/${batch_pe_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "022", sort_level: "FIVE_DIGIT", piece_count: 300 }
              as: PresortOperator
              captures: { days_pe: $.data.committed_days, zone_pe: $.data.zone }
            - call: "POST /commingle-batches/${batch_mm_id}/containers"
              payload: { container_type: "TRAY", destination_zip3: "022", sort_level: "FIVE_DIGIT", piece_count: 300 }
              as: PresortOperator
              captures: { days_mm: $.data.committed_days, zone_mm: $.data.zone }
          assert:
            - "${days_fc} == 2 (SCF base 2 + FIRST_CLASS 0)"
            - "${days_pe} == 3 (SCF base 2 + PERIODICALS 1)"
            - "${days_mm} == 4 (SCF base 2 + MARKETING_MAIL 2)"
            - "${zone_fc} == ${zone_pe} == ${zone_mm} == 2: the mail class moves only the day adder, never the zone"

      - name: threshold_batch_tier_at_499_2999_and_3000_pieces
        claim_type: threshold
        grounds:
          - calculations.presort_tier_qualification
          - calculations.presort_tier_qualification.constants.TIER_MIN_PIECES
          - entities.CommingleBatch.fields.achieved_tier
        distinguishing_aspect: "The tier ladder is re-evaluated on every member add and its comparisons are inclusive, so the batch must walk NONE (499 pieces, one short of BASIC) -> BASIC (2999, one short of THREE_DIGIT) -> THREE_DIGIT (exactly 3000). Exclusive `>` comparisons would leave the batch at BASIC on the third add, and a tier computed only at sortation would report NONE throughout."
        test_recipe:
          setup:
            - "Client TIERS is ACTIVE with commingle_opt_in true and an ACTIVE permit account."
            - "Three hygiene-cleared MARKETING_MAIL/LETTERS jobs with accepted_piece_count 499, 2500 and 1 (accepted = submitted - undeliverable)."
            - "One OPEN MARKETING_MAIL/LETTERS batch at an OPEN SCF facility."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Tiered Mail Works", client_code: "TIERS", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-500500", payment_method: "PERMIT_IMPRINT", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /entry-facilities"
              payload: { facility_code: "SCF-021", facility_type: "SCF", zip3: "021", dock_capacity_pallets_per_slot: 12, drop_ship_discount_bp: 300, served_zip3_list: ["021", "022"] }
              as: BureauAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 500, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_1_id: $.data.id }
            - call: "POST /mail-jobs/${job_1_id}/hygiene-runs"
              payload: { submitted_piece_count: 500, cass_matched_count: 500, ncoa_move_updated_count: 10, undeliverable_removed_count: 1, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 2500, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_2_id: $.data.id }
            - call: "POST /mail-jobs/${job_2_id}/hygiene-runs"
              payload: { submitted_piece_count: 2500, cass_matched_count: 2480, ncoa_move_updated_count: 60, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1, declared_weight_oz_per_piece: 1.0 }
              as: PresortOperator
              captures: { job_3_id: $.data.id }
            - call: "POST /mail-jobs/${job_3_id}/hygiene-runs"
              payload: { submitted_piece_count: 1, cass_matched_count: 1, ncoa_move_updated_count: 0, undeliverable_removed_count: 0, move_update_age_days: 10 }
              as: PresortOperator
            - call: "POST /commingle-batches"
              payload: { mail_class: "MARKETING_MAIL", processing_category: "LETTERS", entry_facility_id: "${fac_id}" }
              as: PresortOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_1_id}" }
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PresortOperator
              captures: { pieces_1: $.data.total_piece_count, tier_1: $.data.achieved_tier }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_2_id}" }
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PresortOperator
              captures: { pieces_2: $.data.total_piece_count, tier_2: $.data.achieved_tier }
            - call: "POST /commingle-batches/${batch_id}/members"
              payload: { mail_job_id: "${job_3_id}" }
              as: PresortOperator
            - call: "GET /commingle-batches/${batch_id}"
              payload: {}
              as: PresortOperator
              captures: { pieces_3: $.data.total_piece_count, tier_3: $.data.achieved_tier }
          assert:
            - "${pieces_1} == 499 (500 submitted - 1 undeliverable) and ${tier_1} == NONE — one piece below TIER_MIN_PIECES.BASIC 500"
            - "${pieces_2} == 2999 and ${tier_2} == BASIC — one piece below TIER_MIN_PIECES.THREE_DIGIT 3000"
            - "${pieces_3} == 3000 and ${tier_3} == THREE_DIGIT — exactly at the threshold qualifies, because the comparison is >="
            - "FIVE_DIGIT is never reached: 3000 is far below TIER_MIN_PIECES.FIVE_DIGIT 15000"

      - name: aggregation_hygiene_quality_denominator_is_submitted_not_net
        claim_type: aggregation
        grounds:
          - calculations.address_hygiene_metrics
          - entities.AddressHygieneRun.fields.net_piece_count
          - entities.AddressHygieneRun.fields.address_quality_pct
        distinguishing_aspect: "The run aggregates two different denominators and they must not be confused: net_piece_count subtracts the undeliverables (1250 - 50 = 1200) while address_quality_pct divides the CASS matches by the SUBMITTED count (1235 * 100 / 1250 = 98.80). Dividing by the net count instead would yield the impossible 102.92, and CASS/NCOA counts are ceilinged by submitted_piece_count rather than by each other."
        test_recipe:
          setup:
            - "Client HYG is ACTIVE with an ACTIVE permit account and one RECEIVED MARKETING_MAIL/LETTERS job of 1250 declared pieces."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Hygiene House", client_code: "HYG", service_fee_rate_per_thousand_cents: 1000 }
              as: BureauAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /permit-accounts"
              payload: { client_id: "${cl_id}", permit_number: "PI-600600", payment_method: "METER", annual_fee_paid_through_utc: "2027-01-31T23:59:59.000Z" }
              as: PostageManager
              captures: { pa_id: $.data.id }
            - call: "POST /mail-jobs"
              payload: { client_id: "${cl_id}", permit_account_id: "${pa_id}", mail_class: "MARKETING_MAIL", processing_category: "LETTERS", declared_piece_count: 1250, declared_weight_oz_per_piece: 1.2 }
              as: PresortOperator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1235, ncoa_move_updated_count: 40, undeliverable_removed_count: 50, move_update_age_days: 30 }
              as: PresortOperator
              captures: { run_idx: $.data.run_index, net: $.data.net_piece_count, quality: $.data.address_quality_pct, compliant: $.data.move_update_compliant }
            - call: "POST /mail-jobs/${job_id}/hygiene-runs"
              payload: { submitted_piece_count: 1250, cass_matched_count: 1250, ncoa_move_updated_count: 1250, undeliverable_removed_count: 1250, move_update_age_days: 30 }
              as: PresortOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "${run_idx} == 0 (the job's hygiene_run_count BEFORE this run), ${net} == 1200, ${quality} == 98.80 and ${compliant} == true"
            - "${quality} is 1235*100/1250 == 98.80, NOT 1235*100/1200 == 102.92: the denominator is submitted_piece_count"
            - "The mirror lands on the job: MailJob.${job_id}.accepted_piece_count == 1200, address_quality_pct == 98.80, move_update_compliant == true, hygiene_run_count == 1, status HYGIENE_CLEARED"
            - "Second run: HTTP 400 with ${err_id} == ERR_INVALID_PIECE_COUNT, because undeliverable_removed_count must be strictly less than submitted_piece_count (a net of 0 is not allowed) even though cass and ncoa may equal it"
            - "The rejected run leaves hygiene_run_count at 1 and the mirrors untouched"

      - name: input_set_filtering_service_index_counts_only_scanned_records
