  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_initial_states_on_every_created_row
        claim_type: initial_state
        grounds: [state_machines.CompetitorProductLink.initial_state, state_machines.PriceObservation.initial_state, state_machines.PriceChangeOrder.initial_state, state_machines.LabelPrintBatch.initial_state]
        distinguishing_aspect: "Four machines are asserted at birth in one chain: a link starts PROPOSED with review_round 0, an observation starts ACTIVE, a change order starts DRAFT on the status dimension and NOT_REQUIRED on the independent signage dimension (no signage_store_id supplied), and a batch starts SCHEDULED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST, product SKU-INIT-1 (own 20000, cost 8000, margin 0.20 so effective_floor 10000), store STORE-101, ACTIVE PRIMARY competitor C-A."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-INIT-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20 }
              as: PlatformAdmin
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 70, attribute_score: 70, image_score: 70 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 18000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_id: $.data.id }
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "MANUAL", requested_price_cents: 19000, effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p_ver}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", reserved_item_count: 0 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
