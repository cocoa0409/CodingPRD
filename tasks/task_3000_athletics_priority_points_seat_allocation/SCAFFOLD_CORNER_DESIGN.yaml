      - name: seat_creation_beyond_the_section_capacity_returns_capacity_exceeded
        claim_type: aggregate_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_SECTION_CAPACITY_EXCEEDED]
          - calculations.section_seat_inventory.formula
        distinguishing_aspect: |
          Each individual seat payload is perfectly valid; only the COLLECTIVE
          count breaches seat_capacity, and the check is on seat_row_count (which
          counts every Seat row) rather than on seats_available. The first seat
          must be accepted and the second refused with 409, and the refusal must
          leave the section's counters and version untouched — a naive
          post-insert check would leave seat_row_count at 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Section SEC-C created with seat_capacity 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-C", venue_code: "STADIUM-C", seat_capacity: 1, per_seat_requirement_cents: 100000, required_points_per_seat: 0.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secc_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/sections/${secc_id}/seats"
              payload: { row_label: "C", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /athletics/sections/${secc_id}/seats"
              payload: { row_label: "C", seat_number: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "First seat: HTTP 201 with Seat.${c1_id}.seat_status == \"AVAILABLE\" and section_id == \"${secc_id}\""
            - "Second seat: HTTP 409 with error.code == \"ERR_SECTION_CAPACITY_EXCEEDED\""
            - "Section.${secc_id}.seat_row_count == 1 and seats_available == 1 after both calls (the refused row was never inserted)"
            - "GET /athletics/sections/${secc_id}/seats returns total_count 1"
            - "Section.${secc_id}.version == 2 (create then one accepted seat; the refused call did not increment it)"

      - name: publishing_slots_that_do_not_fit_the_window_returns_slot_window_overflow
        claim_type: temporal_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_SLOT_WINDOW_OVERFLOW]
          - calculations.slot_window_assignment.formula
        distinguishing_aspect: |
          The overflow check is on the LAST slot's slot_end only, and it is a
          strict-exceed test: two 40-minute slots need 80 minutes and overflow a
          60-minute window, while two 30-minute slots end exactly at window_end
          and must be accepted. That boundary separates "exceeds" from "reaches".
          The rejected publication must leave the event in DRAFT with zero slots,
          proving the check runs before any SelectionSlot row is written.
