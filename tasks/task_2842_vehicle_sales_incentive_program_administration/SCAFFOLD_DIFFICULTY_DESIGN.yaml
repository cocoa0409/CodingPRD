              as_user_id: "u-controller-1"
              captures: { dealer_id: $.data.id, standing_initial: $.data.status }
            - call: "POST /incentives/programs"
              payload: { program_code: "STD-CASH", name: "Standing Gate Cash", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-09-01T00:00:00.000Z", per_unit_amount_cents: 125000, budget_cents: 40000000, stack_group: "STD", priority_rank: 111, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STD000001", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-18T00:00:00.000Z", msrp_cents: 3050000, sale_date: "2026-08-11T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_active: $.data.id }
          trigger:
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "SUSPENDED", note: "Floorplan audit in progress." }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { standing_susp: $.data.status, dealer_v_susp: $.data.version }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STD000002", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-19T00:00:00.000Z", msrp_cents: 3050000, sale_date: "2026-08-11T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { del_susp: $.data.id, del_susp_status: $.data.status }
            - call: "POST /incentives/deliveries/${del_susp}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { del_susp_validated: $.data.status }
            - call: "POST /incentives/dealers/${dealer_id}/status"
              payload: { status: "TERMINATED", note: "Franchise agreement terminated." }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { standing_term: $.data.status }
            - call: "POST /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}", vin: "VIN2842STD000003", model_code: "MX5", trim_code: "BASE", build_date: "2026-06-20T00:00:00.000Z", msrp_cents: 3050000, sale_date: "2026-08-11T00:00:00.000Z", customer_region_code: "WEST", deal_type: "CASH" }
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { pv: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_susp}", program_id: "${prog_id}", claimed_amount_cents: 125000, expected_program_version: "${pv}" }
              as: Dealer
              as_user_id: "${dealer_id}"
            - call: "POST /incentives/deliveries/${del_active}/validate"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
            - call: "GET /incentives/deliveries"
              payload: { dealer_id: "${dealer_id}" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { del_list_0_vin: "$.data[0].vin" }
          assert:
            - "${standing_initial} == ACTIVE (the default; status is a system field and is never accepted from the create payload)"
            - "${standing_susp} == SUSPENDED and ${dealer_v_susp} == 2"
            - "${del_susp_status} == REPORTED — a SUSPENDED dealer may still report, so validations[priority=17] must key on TERMINATED alone, not on 'not ACTIVE'"
            - "${del_susp_validated} == VALIDATED — a SUSPENDED dealer's delivery is still validatable, because the REPORTED_to_VALIDATED precondition is 'dealer status != TERMINATED'"
            - "${standing_term} == TERMINATED"
            - "reporting the third delivery returns HTTP 403 with error.code == ERR_DEALER_NOT_IN_GOOD_STANDING, and no RetailDelivery row is created"
            - "submitting a claim on the already-VALIDATED SUSPENDED-era delivery ALSO returns HTTP 403 ERR_DEALER_NOT_IN_GOOD_STANDING once the dealer is TERMINATED — the dependency is evaluated at write time against current dealer state, not frozen at delivery time"
            - "validating ${del_active} after termination ALSO returns HTTP 403 ERR_DEALER_NOT_IN_GOOD_STANDING, because the REPORTED_to_VALIDATED precondition reads the dealer's CURRENT standing; ${del_active} therefore stays in REPORTED forever unless the dealer is reinstated"
            - "the dealer's delivery list holds exactly 2 rows — the ACTIVE-era and SUSPENDED-era deliveries — and ${del_list_0_vin} is one of VIN2842STD000001 / VIN2842STD000002; VIN2842STD000003 appears nowhere"

      - name: objective_creation_requires_an_active_owning_program
        grounds:
          - validations.priority_11_ERR_PROGRAM_NOT_ACTIVE
          - state_machines.IncentiveProgram.DRAFT_to_PENDING_APPROVAL
          - state_machines.IncentiveProgram.PENDING_APPROVAL_to_ACTIVE
          - calculations.objective_units_proposal
          - entities.DealerObjective.parent
        distinguishing_aspect: |
          A third entity pair (DealerObjective, IncentiveProgram) exercised across THREE program
          states rather than two: DRAFT and PENDING_APPROVAL both refuse the child creation with
          the same error, and only ACTIVE admits it. This is the hierarchical arm of the topology —
          the parent must be in the right state before the child can exist at all — as opposed to
          instance 1's sibling reference and instance 2's ownership gate.
        test_recipe:
          setup:
            - "Dealer D-880, ACTIVE, region NORTH, historical_volume_units 12, market_opportunity_bps 2500."
            - "One DEALER_STAIR_STEP program OBJ-GATE created but left in DRAFT, with one NORTH/TRK9/CASH eligibility rule and tier_schedule [{1, 8000, 40000}]."
            - "No objective exists for (OBJ-GATE, D-880) at the start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
