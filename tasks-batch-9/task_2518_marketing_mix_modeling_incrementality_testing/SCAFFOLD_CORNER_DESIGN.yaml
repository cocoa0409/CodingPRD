            - "Call 3 returns 422 with data.error_id == ERR_DATA_WINDOW_INCOMPLETE now that the temporal gate is satisfied, and GET /mmm/data-windows/${w1} shows status still OPEN, sales_period_count 3, lag_completeness_pct 75.00 and version 4."
