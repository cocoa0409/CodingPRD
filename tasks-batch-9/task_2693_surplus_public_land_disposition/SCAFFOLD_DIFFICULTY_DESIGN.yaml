            - "PreferenceOffer.${offer_id}.negotiation_status == IMPASSE"

  - rule_id: combinatorial_formula
    instances:
      - name: net_proceeds_curative_recovery_cap_binds_nested_min_max
        grounds:
          - calculations.net_proceeds_determination
          - entities.Conveyance.fields.recoverable_curative_cost_cents
          - entities.Conveyance.fields.net_proceeds_cents
          - state_machines.Conveyance.PENDING_TITLE_to_READY_TO_RECORD
          - state_machines.TitleCurativeItem.OPEN_to_CURED
        distinguishing_aspect: |
          Mode (a) - four independent inputs (sale_price_cents 108000000,
          closing_costs_cents 1249999, broker_fee_cents 1500000 and the summed
          incurred curative spend 20250000) combine NON-LINEARLY through a
          nested min(sum, round_half_up(provisional * 0.15)) so that raising
          sale_price_cents raises the recovery cap and therefore raises the
          deduction: recoverable_curative_cost_cents lands on the cap 15787500
          rather than the incurred 20250000, and net_proceeds_cents == 89462501,
          which no additive combination of the four inputs can reproduce.
        test_recipe:
          setup:
            - "One custodian Agency and one TRANSIT Agency that is not a preference entity."
            - "One Parcel with book_value_cents 70000000 carrying two TitleCurativeItem rows resolved CURED at actual_cure_cost_cents 12000000 and 8250000, so incurred curative spend is 20250000 and open_title_item_count is 0."
            - "One ACCEPTED Appraisal at appraised_value_cents 100000000, so the MARKET_FLOOR minimum is max(100000000 - 20250000, 70000000) == 79750000 and required_deposit_cents is 3987500."
            - "A SurplusDeclaration driven to OFFERING_AUTHORIZED for COMPETITIVE_SALE (the noticed transit district DECLINED, so no PreferenceOffer exists) with an EXEMPT CERTIFIED EnvironmentalReview."
            - "A published COMPETITIVE_SALE offering over [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z) with one bid of amount_cents 108000000 and deposit_amount_cents 3987500 from a funded CLEAR bidder; bidding closed and awarded at clock 2026-12-31T00:00:00Z."
            - "A Conveyance in PENDING_TITLE with closing_costs_cents 1249999 and broker_fee_cents 1500000, so provisional_net_cents is 105250001 and recovery_cap_cents is 15787500."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Transit District", agency_type: "TRANSIT", contact_email: "clerk@rtd.gov" }
              as: SystemAdministrator
              captures: { nbr_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-003", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /parcels/${parcel_id}/title-items"
              payload: { item_type: "ENCROACHMENT", description: "Neighbouring warehouse loading dock encroaches 11 feet", cure_cost_estimate_cents: 12000000 }
              as: RealPropertyOfficer
              captures: { ti_1_id: "$.data.id" }
            - call: "POST /parcels/${parcel_id}/title-items"
              payload: { item_type: "BOUNDARY_GAP", description: "Unresolved 4-foot gap along the northern boundary", cure_cost_estimate_cents: 8250000 }
              as: RealPropertyOfficer
              captures: { ti_2_id: "$.data.id" }
            - call: "POST /title-items/${ti_1_id}/resolve"
              payload: { resolution: "CURED", actual_cure_cost_cents: 12000000 }
              as: RealPropertyOfficer
            - call: "POST /title-items/${ti_2_id}/resolve"
              payload: { resolution: "CURED", actual_cure_cost_cents: 8250000 }
              as: RealPropertyOfficer
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44121", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "COST", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
