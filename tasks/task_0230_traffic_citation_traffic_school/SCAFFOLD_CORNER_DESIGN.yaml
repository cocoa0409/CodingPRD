              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "CC4LIC", full_name: "Cc Four" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "CC-4", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
