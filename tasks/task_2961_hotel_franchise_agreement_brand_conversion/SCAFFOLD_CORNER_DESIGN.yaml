          - validations[priority=41]
        distinguishing_aspect: "The termination cause selects the variant: FOR_CAUSE_QA books CONTRACTUAL_MULTIPLE, so the frozen amount is the flat 36-month multiple 1152000.36 of the 32000.01 trailing average rather than the discounted present value the MUTUAL cause would have produced, and the basis excludes the 14000.00 of reservation channel fees entirely."
