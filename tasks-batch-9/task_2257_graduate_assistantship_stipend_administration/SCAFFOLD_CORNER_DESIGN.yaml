            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-B", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true }
              as: GrantAccountant
              as_user_id: "user-ga-1"
              captures: { src_b_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { student_id: "${student_id}", department_id: "${dept_id}", term_id: "${term_id}", assistantship_type: "RESEARCH", effort_pct: 75, start_date: "2026-09-01", end_date: "2026-12-31", monthly_stipend_cents: 300000, supervisor_user_id: "user-fac-7" }
