      - name: shape_validation_outranks_state_validation_on_scope_area_creation
        claim_type: priority_conflict
        grounds:
          - validations[priority 30 ERR_INVALID_REQUEST]
          - validations[priority 40 ERR_EXAM_NOT_IN_SCOPING]
        distinguishing_aspect: |
          A locked examination violates the state gate for scope-area creation, and a negative
          population_size violates the shape gate, so a request that breaks both must answer with the
          lower-priority-number refusal. 422 ERR_INVALID_REQUEST wins over 409 ERR_EXAM_NOT_IN_SCOPING,
          and only once the shape is repaired does the state refusal surface - which is how the two
          rules are shown to be independently reachable on the identical endpoint.
