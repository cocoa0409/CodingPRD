              payload: { merchant_id: "${m_id_s}", period_start_date: "2026-04-15", period_end_date: "2026-04-15", gross_volume_cents: 2000000 }
              as: PortfolioController
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-20T00:00:00Z" }
              as: PortfolioController
            - call: "GET /merchants/${m_id_s}/reserve-accounts"
              payload: {}
              as: PortfolioController
              captures: { ra_id_s: "$.data[0].id", ra_v_s: "$.data[0].version" }
            - call: "POST /reserve-accounts/${ra_id_s}/release-requests"
              payload: { amount_cents: 50000, tranche_start_date: "2026-04-01", tranche_end_date: "2026-04-30", expected_reserve_account_version: "${ra_v_s}" }
              as: PortfolioController
            - call: "GET /reserve-accounts/${ra_id_s}"
              payload: {}
              as: PortfolioController
              captures: { ra_v_s2: "$.data.version" }
          trigger:
            - call: "POST /reserve-accounts/${ra_id_s}/release-requests"
              payload: { amount_cents: 100000, tranche_start_date: "2026-05-30", tranche_end_date: "2026-06-30", expected_reserve_account_version: "${ra_v_s2}" }
              as: PortfolioController
            - call: "POST /reserve-accounts/${ra_id_s}/release-requests"
              payload: { amount_cents: 100000, tranche_start_date: "2026-05-31", tranche_end_date: "2026-06-30", expected_reserve_account_version: "${ra_v_s2}" }
              as: PortfolioController
          assert:
            - "the first release-request trigger response status is 409"
            - "the first release-request trigger response error id is ERR_RELEASE_TRANCHE_COOLING_VIOLATION"
            - "ReserveAccount.${ra_id_s}.released_to_date_cents == 50000 after the first trigger call"
            - "the second release-request trigger response status is 201"
            - "ReserveAccount.${ra_id_s}.released_to_date_cents == 150000 after the second trigger call"
            - "ReserveAccount.${ra_id_s}.held_balance_cents == 0 after the second trigger call"
            - "ReserveAccount.${ra_id_s}.total_accrued_cents == 150000 after the second trigger call"
            - "ReserveAccount.${ra_id_s}.last_release_tranche_end_date == 2026-06-30 after the second trigger call"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_ledger_conservation_survives_a_loss_offset_overflow
        grounds:
          - calculations.settlement_reserve_hold_and_payout_waterfall
          - calculations.reserve_release_eligibility
          - entities.ReserveAccount.fields.total_accrued_cents
          - entities.ReserveAccount.fields.offset_to_date_cents
          - entities.SettlementBatch.fields.uncovered_loss_cents
        conserved_quantity: "ReserveAccount.total_accrued_cents == held_balance_cents + released_to_date_cents + offset_to_date_cents, together with the per-batch identity gross_volume_cents == net_payout_cents + reserve_hold_cents + loss_offset_from_settlement_cents"
        distinguishing_aspect: |
          Losses (120000 cents) exceed the whole settlement period (100000 cents), so the waterfall
          drains bucket 2 to 95000, drains the reserve for the remaining 5000 and books 20000 as
          uncovered. Both conservation identities must still hold exactly after two ledger appends
          and a zero net payout - an implementation that lets the reserve go negative or that leaks
          the uncovered remainder into net_payout breaks one of them.
        test_recipe:
          setup:
            - "one ACTIVE merchant, ROLLING reserve at 500 bps, funding_state NORMAL"
            - "activity 2026-07-01 with volume_cents 100000 and chargeback_amount_cents 120000"
            - "logical clock at 2026-07-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PortfolioController
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Saltmarsh Studio LLC", tax_id: "88-1110019", mcc_code: "5999", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 10000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_id_t: "$.data.id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_id_t}", full_name: "Mira Chase", ownership_pct: 100.00, country_code: "US", date_of_birth: "1990-03-13", government_id_last4: "2424" }
              as: Applicant
              as_user_id: "${app_id_t}"
              captures: { own_id_t: "$.data.id" }
            - call: "POST /merchant-applications/${app_id_t}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_id_t}"
            - call: "POST /business-verifications"
              payload: { application_id: "${app_id_t}", registry_match: true, address_match: true, tax_id_match: true, bank_account_match: true }
              as: UnderwritingOfficer
            - call: "POST /beneficial-owners/${own_id_t}/screen"
              payload: { sanctions_hit: false, pep_flag: false, id_verified: true }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_t}/advance-to-underwriting"
              payload: {}
              as: UnderwritingOfficer
              captures: { app_v_t: "$.data.version" }
            - call: "POST /credit-assessments"
              payload: { application_id: "${app_id_t}", method: "LAG_WEIGHTED", expected_application_version: "${app_v_t}" }
              as: UnderwritingOfficer
            - call: "POST /merchant-applications/${app_id_t}/decision"
              payload: { decision: "APPROVE" }
              as: RiskCommitteeApprover
            - call: "GET /merchant-applications/${app_id_t}/onboarded-merchants"
              payload: {}
              as: RiskAnalyst
              captures: { m_id_t: "$.data[0].id" }
            - call: "GET /merchants/${m_id_t}/reserve-accounts"
              payload: {}
              as: PortfolioController
              captures: { ra_id_t: "$.data[0].id" }
            - call: "POST /merchant-day-activity"
              payload: { merchant_id: "${m_id_t}", business_date: "2026-07-01", txn_count: 10, volume_cents: 100000, distinct_card_count: 10, decline_count: 0, cross_border_count: 0, refund_cents: 0, unique_bin_count: 9, chargeback_count: 2, chargeback_amount_cents: 120000, chargeback_network: "VISA" }
              as: RiskAnalyst
          trigger:
            - call: "POST /settlement-batches"
              payload: { merchant_id: "${m_id_t}", period_start_date: "2026-07-01", period_end_date: "2026-07-01", gross_volume_cents: 100000 }
              as: PortfolioController
              captures: { batch_id_t: "$.data.id" }
          assert:
            - "SettlementBatch.${batch_id_t}.reserve_hold_cents == 5000"
            - "SettlementBatch.${batch_id_t}.loss_offset_from_settlement_cents == 95000"
            - "SettlementBatch.${batch_id_t}.reserve_offset_cents == 5000"
            - "SettlementBatch.${batch_id_t}.uncovered_loss_cents == 20000"
            - "SettlementBatch.${batch_id_t}.net_payout_cents == 0"
            - "SettlementBatch.${batch_id_t}.payout_state == SCHEDULED"
            - "ReserveAccount.${ra_id_t}.total_accrued_cents == 5000"
            - "ReserveAccount.${ra_id_t}.offset_to_date_cents == 5000"
            - "ReserveAccount.${ra_id_t}.released_to_date_cents == 0"
            - "ReserveAccount.${ra_id_t}.held_balance_cents == 0"
            - "ReserveAccount.${ra_id_t}.state == ACCRUING"
            - "GET /settlement-batches/${batch_id_t}/ledger-entries returns exactly 2 entries, one HOLD of 5000 cents and one OFFSET_LOSS of 5000 cents"
            - "Merchant.${m_id_t}.pending_payout_cents == 0"

      - name: batch_reversal_restores_pending_payout_and_reserve_balance
        grounds:
          - endpoints[POST /settlement-batches/{id}/reverse]
          - state_machines.SettlementBatch.SCHEDULED_to_REVERSED
          - entities.Merchant.fields.pending_payout_cents
          - entities.Merchant.fields.lifetime_reversed_cents
          - entities.ReserveAccount.fields.released_to_date_cents
        conserved_quantity: "Merchant.pending_payout_cents returns to its exact pre-batch value (0) while ReserveAccount.held_balance_cents returns to 0 and the full 200000-cent loss is recorded in lifetime_reversed_cents"
        distinguishing_aspect: |
          A different conserved quantity from the ledger identity above: this one is the merchant's
          payable position across a compensating reversal. The reversal must unwind the 50000-cent
          hold with a BATCH_REVERSAL_RELEASE entry rather than deleting rows, subtract exactly the
          750000 net payout from pending_payout_cents, and book the 200000-cent loss - drift in any
          direction is detectable.
        test_recipe:
