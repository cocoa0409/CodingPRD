      - name: beta_promotion_one_hundredth_class_below_floor_rejected
        grounds:
          - calculations.a11y_conformance_score
          - validations[priority=12]
          - errors[ERR_A11Y_CONFORMANCE_INSUFFICIENT]
        distinguishing_aspect: |
          Same boundary, opposite side, and a DIFFERENT precision axis: the two-decimal grid of
          the weighted score. AUTOMATED defect_load 2 and MANUAL defect_load 49 give
          0.4*2 + 0.6*49 = 30.20 => 69.80, the largest representable score strictly below the
          70.00 floor (69.90 is arithmetically unreachable because 0.4a + 0.6m == 30.10 requires
          4a + 6m == 301, which is odd and so has no integer solution). The promotion MUST fail.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `chip` EXPERIMENTAL / ACTIVE"
            - "one WEB implementation with exactly two AA audits: AUTOMATED (0 critical, 0 serious, 2 moderate) => defect_load 2, and MANUAL (4 critical, 2 serious, 1 moderate) => defect_load 49"
