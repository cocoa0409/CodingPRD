  - rule_id: non_linear_state_machine
    instances:
      - name: field_rotation_full_cycle
        grounds:
          - state_machines.Field.DORMANT_to_OPEN
          - state_machines.Field.OPEN_to_PICKED_OUT
          - state_machines.Field.PICKED_OUT_to_ROTATION_REST
          - state_machines.Field.ROTATION_REST_to_DORMANT
