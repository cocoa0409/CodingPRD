  # SECTION 8 — COMPLEXITY LAYERS
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: advance_create_with_stale_member_version_returns_4XX
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.advance-create-stale-member", "errors[ERR_STALE_MEMBER_VERSION]"]
        distinguishing_aspect: "The advance sizes itself against the member's capacity snapshot, so a client that read the member before a condition change must be forced to re-read: the request is refused on the version alone while every business rule in it is satisfiable."
        test_recipe:
          setup:
            - "Harbor Savings tier 1, ACTIVE, BLANKET_LIEN, one ELIGIBLE SF_MORTGAGE (lendable 15,600,000), product FT-450 exists."
            - "The client reads the member and captures version V, then a credit officer patches the member's condition (tier 1 -> 2), which bumps the version past V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_stale: "$.data.version" }
            - call: "PATCH /fhlb/member-banks/${member_id}/condition"
              payload: { credit_rating_tier: 2 }
              as: CreditOfficer
              captures: { ver_fresh: "$.data.version" }
          trigger:
            call: "POST /fhlb/advances"
            payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 30, requested_net_proceeds_cents: 1000000, expected_member_bank_version: "${ver_stale}" }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_MEMBER_VERSION\""
            - "no Advance row is created and MemberBank.committed_advance_cents is unchanged"
            - "the identical request carrying ${ver_fresh} succeeds, proving only the version distinguished the two calls"

      - name: substitute_with_stale_member_version_returns_4XX
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.asset-substitute-stale-member", "errors[ERR_STALE_MEMBER_VERSION]"]
        distinguishing_aspect: "The second concurrency rule guards a different write endpoint on the same parent: because each eligibility decision bumps the member version, a substitution planned against an older lendable-value view must be rejected before it changes the pool."
        test_recipe:
