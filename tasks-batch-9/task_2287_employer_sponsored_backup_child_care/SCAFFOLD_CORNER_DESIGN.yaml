            - "${err_immutable} == ERR_PROVIDER_FIELD_IMMUTABLE with HTTP 409"
            - "${patched_v} == ${p1_v} + 1 and ${patched_sd} == false — re-sending the identical care_mode ${p1_mode} is a legal no-op"
            - "${p2_ns} == CREDENTIALED and ${cred_st} == REVOKED"
