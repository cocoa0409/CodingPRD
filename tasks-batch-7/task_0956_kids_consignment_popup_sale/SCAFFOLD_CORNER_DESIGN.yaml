            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "I2", category: TOYS, price_cents: 600 }, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "I3", category: TOYS, price_cents: 700 }, as: Consignor, as_user_id: "${c_id}" }
          trigger:
