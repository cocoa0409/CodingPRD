              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { e13: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e13} == ERR_OUTSIDE_LAUNCH_WINDOW"
            - "Program.${pg_id}.status == APPROVED"

      - name: lead_creation_after_the_contract_expiry_date_is_rejected
