              payload: { activity_id: "${act2}", respondent_ref: "o2-05", demographic_group: "GENERAL", census_tract: "06001402300" }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/engagement-activities/${act2}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act2_total: $.data.total_weighted_count, act2_under: $.data.underrepresented_weighted_count, act2_equity: $.data.equity_share_pct }
          trigger:
            - call: "POST /planning/engagement-activities/${act2}/cancel"
              payload: { cancellation_reason: "Outreach session voided after a data-integrity review." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act2_status: $.data.status }
          assert:
            - "before the trigger: EngagementActivity.${act2}.weighting_variant == \"OUTREACH_WEIGHTED\" with total_weighted_count == 7.0 (2.0 + 2.0 + 1.0 + 1.0 + 1.0), underrepresented_weighted_count == 5.0 (2.0 + 2.0 + 1.0) and equity_share_pct == 71.4 (5.0 / 7.0 rounded half up to one decimal)"
            - "before the trigger: PlanUpdate.${pu}.participation_weight_total == 17.0, underrepresented_weight_total == 9.0 and equity_share_pct == 52.9"
            - "after the trigger: EngagementActivity.${act2}.status == CANCELLED while its own total_weighted_count and underrepresented_weighted_count are still 7.0 and 5.0 (the row keeps its history; only the ledger excludes it)"
            - "after the trigger: PlanUpdate.${pu}.participation_weight_total == 10.0 and underrepresented_weight_total == 4.0 - byte-for-byte the pre-completion values, with no floating residue"
            - "after the trigger: PlanUpdate.${pu}.equity_share_pct == 40.0 and the invariant participation_weight_conservation holds against the single remaining COMPLETED activity ${act1}"
            - "EngagementActivity.${act1}.status == COMPLETED with total_weighted_count == 10.0 and underrepresented_weighted_count == 4.0 (untouched by the cancellation)"
            - "PlanUpdate.${pu}.compliance_posture == CAPACITY_HOLD before and after (no scenario is adopted, so the equity movement never becomes the binding hold)"

      - name: amendment_rescission_restores_element_policy_inventory
        grounds:
          - state_machines.Amendment.ADOPTED_to_RESCINDED
          - calculations.policy_count_conservation
          - state_machines.Hearing.BLOCKED_to_SCHEDULED
          - calculations.compliance_posture
        distinguishing_aspect: |
          Conserved quantity: the element policy inventory (PlanElement.policy_count) together with
          every field the adoption cascade touched. Rescinding the amendment must reverse all five
          cascade links exactly - policy_count 8 -> 6, element status restored from
          prior_element_status, the ConsistencyLink STALE -> CLEARED with staled_by_amendment_id
          cleared to null, open_consistency_link_count 1 -> 0, posture CONSISTENCY_HOLD -> CLEAR and
          the BLOCKED sibling hearing back to SCHEDULED - while the amendment row itself keeps
          policy_delta and applied_policy_count as an audit trail.
        test_recipe:
          setup:
            - "A plan taken to STATE_CERTIFIED exactly as in hearing_calendar_closed_interval_and_daily_cap_per_body, but additionally carrying a CLEARED ConsistencyLink from the TRANSPORTATION element to the LAND_USE element."
