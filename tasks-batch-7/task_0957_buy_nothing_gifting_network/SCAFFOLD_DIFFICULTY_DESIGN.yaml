          assert:
            - "claim against DRAFT post rejected: error_id == ERR_POST_NOT_OPEN (http 409)"
            - "after publish: claim succeeds, Claim.${c_id}.status == OFFERED (auto-promotion, head slot vacant)"
            - "GiftPost.${p_id}.status == RESERVED after the claim"

