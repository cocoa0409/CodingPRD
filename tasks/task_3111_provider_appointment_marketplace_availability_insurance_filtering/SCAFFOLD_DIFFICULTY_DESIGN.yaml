            - "Bookable practice/provider with appointment type copay 10000"
            - "Two OPEN slots s1 (2026-09-03T10:00) and s2 (2026-09-03T11:00)"
            - "Patient has booked both; b1 is marked NO_SHOW (strike 25), b2 is COMPLETED (+10 recovery)"
