# =============================================================================
# OEM Dealer Network & Territory Management — benchmark seed tables
# =============================================================================

scenario: |
  OEM Dealer Network & Territory Management (equipment OEM dealer network): dealer agreement & exclusive territory rules, sales target/quota & tier discount, floor-plan financing & aging audit, warranty claim submission & audit chargeback, parts stocking requirement & annual return allowance, training/certification compliance, lead routing by territory & conflict resolution, dealer performance scorecard & termination

domain_name: oem-dealer-network
api_prefix: /network

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # agreements, audits, chargebacks, termination gates
  secondary_archetype: quota_allocation      # floor-plan credit pool + annual parts-return allowance
  complexity_layers:
    - optimistic_concurrency                 # OCC on Dealer.version at agreement activation (supersede)
    - cascading_side_effects                 # terminate / chargeback cascades across 3 entity hops
    - dual_variant_calculation               # provisional vs final discount; strict vs inclusive scorecard
    - selector_policy                        # lead routing: eligibility, ranking, tie-break, fallback
  entity_topology: flat                      # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic                # claim dispute loop, lead re-route loop, dealer suspend loop
  relationship_patterns:
    - one_to_many                            # Dealer 1..N everything
    - cross_aggregate                        # UnitSale <-> FloorPlanAdvance via (dealer_id, unit_serial)
  role_model: peer_roles                     # OemNetworkAdmin / OemSalesOps / OemAuditor / DealerUser
  consistency_model: immediate               # every mutation + cascade visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK -> X.id canonical prefixes)
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Dealer business name" }
      - { name: dealer_code, type: string, source: input, description: "Unique dealer code", constraints: "unique across all dealers (ERR_DUPLICATE_DEALER_CODE)" }
      - { name: region, type: string, source: input, description: "Free-form region label" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Floor-plan credit ceiling in cents", constraints: "> 0" }
      - { name: min_stock_value_cents, type: integer, source: input, description: "Minimum parts stocking value required by agreement", constraints: ">= 0" }
      - { name: floorplan_utilization_cents, type: integer, source: computed, default: 0, description: "Sum of (advance_cents - paid_curtailments_cents) over FloorPlanAdvances in {OPEN, CURTAILED, PAST_DUE}" }
      - { name: floorplan_available_cents, type: integer, source: computed, description: "= credit_limit_cents - floorplan_utilization_cents" }
      - { name: default_loss_cents, type: integer, source: computed, default: 0, description: "Principal written off when advances transition to DEFAULTED" }
      - { name: chargeback_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding warranty chargebacks owed by dealer" }
      - { name: discount_reconciliation_cents, type: integer, source: computed, default: 0, description: "Cumulative (final - provisional) discount delta booked at target close" }
      - { name: parts_purchases_ytd_cents, type: integer, source: computed, default: 0, description: "Parts purchases in purchases_year; resets on year rollover" }
      - { name: purchases_year, type: integer, source: system, description: "Calendar year parts_purchases_ytd_cents belongs to; null until first purchase" }
      - { name: stock_observed_value_cents, type: integer, source: system, default: 0, description: "Last stock-audit observed value" }
      - { name: stock_compliant, type: boolean, source: computed, default: false, description: "= stock_observed_value_cents >= min_stock_value_cents at last stock audit" }
      - { name: tier, type: enum, source: computed, default: BRONZE, description: "BRONZE | SILVER | GOLD; recomputed at each SalesTarget close from attainment ratio" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }

  - name: DealerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: agreement_code, type: string, source: input, description: "Unique agreement code", constraints: "unique (ERR_DUPLICATE_AGREEMENT_CODE)" }
      - { name: effective_date, type: string, source: input, description: "Inclusive start date YYYY-MM-DD" }
      - { name: expiry_date, type: string, source: input, description: "Inclusive end date YYYY-MM-DD; must be > effective_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | EXPIRED | TERMINATED" }

  - name: TerritoryAssignment
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: agreement_id, type: string, source: input, description: "FK -> DealerAgreement.id; must belong to dealer_id" }
      - { name: territory_code, type: string, source: input, description: "Territory identifier covered" }
      - { name: coverage_type, type: enum, source: input, description: "EXCLUSIVE | SHARED; EXCLUSIVE rejects overlapping ACTIVE assignments on same territory_code; SHARED overlaps SHARED freely but neither may overlap EXCLUSIVE" }
      - { name: starts_on, type: string, source: input, description: "Half-open interval start YYYY-MM-DD (inclusive)" }
      - { name: ends_on, type: string, source: input, description: "Half-open interval end YYYY-MM-DD (exclusive); must be > starts_on" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: SalesTarget
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: period_year, type: integer, source: input, description: "Quota year" }
      - { name: period_quarter, type: integer, source: input, description: "Quota quarter 1..4", constraints: "1..4; unique per (dealer_id, period_year, period_quarter) -> ERR_DUPLICATE_TARGET" }
      - { name: target_units, type: integer, source: input, description: "Unit quota", constraints: "> 0" }
      - { name: achieved_units, type: integer, source: computed, default: 0, description: "Count of UnitSales for this dealer and quarter in ACCEPTED status" }
      - { name: final_discount_rate, type: number, source: system, description: "Tier rate locked at close (0.02 | 0.05 | 0.08); null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_MET | CLOSED_MISSED" }

  - name: UnitSale
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; must equal X-User-ID when role is DealerUser" }
      - { name: unit_serial, type: string, source: input, description: "Unit serial; unique per dealer among non-REJECTED/non-VOIDED sales (ERR_DUPLICATE_UNIT_SERIAL)" }
      - { name: sale_date, type: string, source: input, description: "Retail sale date YYYY-MM-DD; determines quota quarter" }
      - { name: list_price_cents, type: integer, source: input, description: "List price in cents", constraints: "> 0" }
      - { name: provisional_discount_cents, type: integer, source: computed, description: "Discount at report time using PROVISIONAL variant of tier_discount" }
      - { name: final_discount_cents, type: integer, source: system, description: "Discount locked at target close using FINAL variant; null until then" }
      - { name: status, type: enum, source: system, description: "REPORTED | ACCEPTED | REJECTED | VOIDED" }

  - name: FloorPlanAdvance
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id" }
      - { name: unit_serial, type: string, source: input, description: "Financed unit serial; unique per dealer among non-terminal advances (ERR_DUPLICATE_ADVANCE_SERIAL)" }
      - { name: advance_cents, type: integer, source: input, description: "Principal advanced", constraints: "> 0" }
      - { name: advance_date, type: string, source: system, description: "Date (logical clock) the advance was created; aging anchor" }
      - { name: paid_curtailments_cents, type: integer, source: computed, default: 0, description: "Principal repaid via /payment" }
      - { name: accrued_interest_cents, type: integer, source: computed, default: 0, description: "Interest computed by floorplan_interest_accrual at last aging audit" }
      - { name: status, type: enum, source: system, description: "OPEN | CURTAILED | PAST_DUE | PAID_OFF | DEFAULTED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; must equal X-User-ID when role is DealerUser" }
      - { name: unit_serial, type: string, source: input, description: "Unit the claim pertains to" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Parts portion", constraints: ">= 0" }
      - { name: labor_hours, type: number, source: input, description: "Labor hours claimed", constraints: ">= 0" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "= parts_cost_cents + round_half_up(labor_hours * tier labor rate at submission)" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount paid; set at pay transition" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; audit-window anchor" }
      - { name: chargeback_amount_cents, type: integer, source: system, description: "Charged-back amount (FULL or PARTIAL finding); null unless CHARGED_BACK" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | PAID | AUDIT_FLAGGED | CHARGED_BACK | DISPUTED" }

  - name: PartsReturn
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; must equal X-User-ID when role is DealerUser" }
      - { name: return_year, type: integer, source: input, description: "Allowance year; must equal current clock year (ERR_RETURN_YEAR_MISMATCH)" }
      - { name: lines, type: array, source: input, description: "Array of {part_number: string, quantity: integer > 0, unit_credit_cents: integer > 0}" }
      - { name: restock_pct_applied, type: number, source: computed, description: "0.15 when submit date is after June 30 of return_year, else 0" }
      - { name: credit_cents, type: integer, source: computed, description: "Per-line round-then-sum credit (parts_return_credit)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CREDITED | REJECTED | REVERSED" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; must equal X-User-ID when role is DealerUser" }
      - { name: cert_code, type: string, source: input, description: "Certification program code" }
      - { name: earned_on, type: string, source: input, description: "Date earned YYYY-MM-DD" }
      - { name: expires_on, type: string, source: input, description: "Expiry date YYYY-MM-DD; must be > earned_on" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | REJECTED | EXPIRED" }

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - { name: territory_code, type: string, source: input, description: "Territory the prospect sits in" }
      - { name: product_line, type: string, source: input, description: "Product line of interest" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Estimated deal size", constraints: "> 0" }
      - { name: contact_name, type: string, source: input, description: "Prospect contact" }
      - { name: routed_dealer_id, type: string, source: system, description: "FK -> Dealer.id; nullable; current routed dealer" }
      - { name: routed_assignment_id, type: string, source: system, description: "FK -> TerritoryAssignment.id; nullable; assignment used for routing" }
      - { name: declined_dealer_ids, type: array, source: system, default: [], description: "Dealer ids that declined or let the lead expire; excluded from future routing" }
      - { name: routed_at, type: datetime, source: system, description: "Logical-clock timestamp of last routing; SLA anchor" }
      - { name: status, type: enum, source: system, description: "NEW | ROUTED | DECLINED | ORPHANED | EXPIRED | ACCEPTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Dealer
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (first DealerAgreement activation for this dealer)"
        actor: system
        preconditions: ["agreement activation succeeded (>= 2 ACTIVE certifications)"]
        side_effects: ["Dealer.version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/dealers/{dealerId}/status {target: SUSPENDED} OR system (chargeback_balance_cents >= 50000 after a chargeback)"
        actor: OemNetworkAdmin | system
        preconditions: ["Dealer.status == ACTIVE (ERR_DEALER_NOT_ACTIVE)"]
        side_effects:
          - "All Leads with status ROUTED and routed_dealer_id == dealer.id -> NEW; routed_dealer_id/routed_assignment_id/routed_at cleared"
          - "Dealer.version increments"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/dealers/{dealerId}/status {target: ACTIVE}"
        actor: OemNetworkAdmin
        preconditions:
          - "Dealer.status == SUSPENDED (ERR_DEALER_NOT_SUSPENDED)"
          - "chargeback_balance_cents < 50000 (ERR_REINSTATE_BLOCKED)"
        side_effects: ["Dealer.version increments"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network/dealers/{dealerId}/terminate"
        actor: OemNetworkAdmin
        preconditions:
          - "STRICT dealer_performance_score total_score < 60 for the two most recent CLOSED SalesTarget quarters (by period_year/period_quarter); fewer than two closed quarters or either score >= 60 -> ERR_SCORECARD_THRESHOLD_NOT_MET"
        side_effects:
          - "DealerAgreement in ACTIVE -> TERMINATED (link 1)"
          - "That agreement's TerritoryAssignments in ACTIVE -> RELEASED (link 2)"
          - "Leads ROUTED via those assignments -> NEW, routing fields cleared (link 3)"
          - "Dealer.version increments"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/dealers/{dealerId}/terminate"
        actor: OemNetworkAdmin
        preconditions: ["same scorecard precondition as ACTIVE -> TERMINATED"]
        side_effects: ["same cascade as ACTIVE -> TERMINATED"]

  - entity: DealerAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /network/dealer-agreements/{agreementId}/activate"
        actor: OemNetworkAdmin
        preconditions:
          - "Agreement.status == DRAFT (ERR_AGREEMENT_NOT_IN_DRAFT)"
          - "OCC: expected_dealer_version == Dealer.version (ERR_STALE_VERSION)"
          - "Dealer.status in {ONBOARDING, ACTIVE} (ERR_DEALER_NOT_ACTIVE)"
          - ">= 2 ACTIVE Certifications for the dealer (ERR_CERTIFICATION_COMPLIANCE)"
          - "If another ACTIVE agreement for this dealer has an inclusive-overlapping [effective_date, expiry_date] (touching dates count as overlap): allowed only when supersede_existing == true, else ERR_AGREEMENT_OVERLAP"
        side_effects:
          - "Dealer.version increments by 1"
          - "Other ACTIVE overlapping agreement (when supersede_existing) -> SUPERSEDED"
          - "Dealer ONBOARDING -> ACTIVE on first activation"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another agreement activated with supersede_existing)"
        actor: system
        preconditions: []
        side_effects: ["Its ACTIVE TerritoryAssignments are NOT released; they remain bound to the superseded agreement until expiry window passes (coverage continues)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /network/dealer-agreements/{agreementId}/expire"
        actor: OemNetworkAdmin
        preconditions:
          - "Agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "current logical date > expiry_date (ERR_AGREEMENT_NOT_YET_EXPIRED)"
        side_effects: ["Its ACTIVE TerritoryAssignments -> RELEASED; Leads ROUTED via those assignments -> NEW (routing cleared)"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /network/dealer-agreements/{agreementId}/terminate"
        actor: OemNetworkAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network/dealer-agreements/{agreementId}/terminate OR dealer termination cascade"
        actor: OemNetworkAdmin | system
        preconditions: []
        side_effects: ["Its ACTIVE TerritoryAssignments -> RELEASED; Leads ROUTED via those assignments -> NEW (routing cleared)"]

  - entity: TerritoryAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /network/territory-assignments/{assignmentId}/release OR agreement terminate/expire cascade OR dealer termination cascade"
        actor: OemNetworkAdmin | system
        preconditions: ["Assignment.status == ACTIVE (ERR_ASSIGNMENT_NOT_ACTIVE)"]
        side_effects: ["Leads ROUTED with routed_assignment_id == assignment.id -> NEW; routed_dealer_id/routed_assignment_id/routed_at cleared"]

  - entity: SalesTarget
    initial_state: OPEN
    terminal_states: [CLOSED_MET, CLOSED_MISSED]
    transitions:
      - from: OPEN
        to: CLOSED_MET
        trigger: "POST /network/sales-targets/{targetId}/close"
        actor: OemSalesOps
        preconditions:
          - "Target.status == OPEN (ERR_TARGET_NOT_OPEN)"
          - "current logical date >= first day of the quarter following (period_year, period_quarter) (ERR_QUARTER_NOT_ENDED)"
          - "achieved_units >= target_units (boundary: equality counts as MET)"
        side_effects:
          - "final_discount_rate locked from final attainment ratio (tier_discount FINAL variant)"
          - "Every ACCEPTED UnitSale in the quarter: final_discount_cents computed; dealer.discount_reconciliation_cents += sum(final - provisional)"
          - "Dealer.tier recomputed from final ratio; Dealer.version increments"
      - from: OPEN
        to: CLOSED_MISSED
        trigger: "POST /network/sales-targets/{targetId}/close"
        actor: OemSalesOps
        preconditions: ["same as CLOSED_MET except achieved_units < target_units"]
        side_effects: ["same close side effects as CLOSED_MET"]

  - entity: UnitSale
    initial_state: REPORTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /network/unit-sales/{saleId}/decide {decision: ACCEPT}"
        actor: OemSalesOps
        preconditions:
          - "Sale.status == REPORTED (ERR_SALE_NOT_REPORTED)"
          - "SalesTarget for (dealer_id, sale_date quarter) exists and is OPEN (ERR_TARGET_NOT_OPEN)"
        side_effects:
          - "SalesTarget.achieved_units += 1"
          - "FloorPlanAdvance with (dealer_id, unit_serial) in {OPEN, CURTAILED, PAST_DUE} -> PAID_OFF; paid_curtailments_cents = advance_cents; Dealer.floorplan_utilization_cents -= remaining principal (retail-sale payoff cascade)"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /network/unit-sales/{saleId}/decide {decision: REJECT}"
        actor: OemSalesOps
        preconditions: ["Sale.status == REPORTED (ERR_SALE_NOT_REPORTED)"]
        side_effects: []
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /network/unit-sales/{saleId}/void"
        actor: OemSalesOps
        preconditions:
          - "Sale.status == ACCEPTED (ERR_SALE_NOT_ACCEPTED)"
          - "No FloorPlanAdvance with (dealer_id, unit_serial) in PAID_OFF whose payoff was caused by this sale (ERR_SALE_PAYOFF_LOCKED)"
        side_effects: ["SalesTarget.achieved_units -= 1"]

  - entity: FloorPlanAdvance
    initial_state: OPEN
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: OPEN
        to: CURTAILED
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (partial)"
        actor: OemNetworkAdmin
        preconditions:
          - "Advance.status in {OPEN, CURTAILED, PAST_DUE} (ERR_ADVANCE_NOT_OPEN)"
          - "amount_cents <= advance_cents - paid_curtailments_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "paid_curtailments_cents += amount_cents; Dealer.floorplan_utilization_cents -= amount_cents"
      - from: CURTAILED
        to: CURTAILED
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (partial)"
        actor: OemNetworkAdmin
        preconditions: ["same as OPEN -> CURTAILED"]
        side_effects: ["same as OPEN -> CURTAILED"]
      - from: PAST_DUE
        to: CURTAILED
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (partial)"
        actor: OemNetworkAdmin
        preconditions: ["same as OPEN -> CURTAILED"]
        side_effects: ["same as OPEN -> CURTAILED"]
      - from: OPEN
        to: PAID_OFF
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (amount == remaining) OR UnitSale acceptance payoff cascade"
        actor: OemNetworkAdmin | system
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects: ["Dealer.floorplan_utilization_cents -= remaining principal; paid_curtailments_cents = advance_cents"]
      - from: CURTAILED
        to: PAID_OFF
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (amount == remaining) OR UnitSale acceptance payoff cascade"
        actor: OemNetworkAdmin | system
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects: ["same as OPEN -> PAID_OFF"]
      - from: PAST_DUE
        to: PAID_OFF
        trigger: "POST /network/floorplan-advances/{advanceId}/payment (amount == remaining) OR UnitSale acceptance payoff cascade"
        actor: OemNetworkAdmin | system
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects: ["same as OPEN -> PAID_OFF"]
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit when age_days > 90"
        actor: OemAuditor
        preconditions: ["Advance.status in {OPEN, CURTAILED}"]
        side_effects: ["accrued_interest_cents recomputed via floorplan_interest_accrual"]
      - from: CURTAILED
        to: PAST_DUE
        trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit when age_days > 90"
        actor: OemAuditor
        preconditions: ["Advance.status in {OPEN, CURTAILED}"]
        side_effects: ["accrued_interest_cents recomputed via floorplan_interest_accrual"]
      - from: PAST_DUE
        to: DEFAULTED
        trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit when age_days > 270"
        actor: OemAuditor
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects:
          - "accrued_interest_cents recomputed"
          - "Dealer.floorplan_utilization_cents -= remaining principal; Dealer.default_loss_cents += remaining principal"
      - from: OPEN
        to: DEFAULTED
        trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit when age_days > 270"
        actor: OemAuditor
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects: ["same as PAST_DUE -> DEFAULTED"]
      - from: CURTAILED
        to: DEFAULTED
        trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit when age_days > 270"
        actor: OemAuditor
        preconditions: ["Advance.status in {OPEN, CURTAILED, PAST_DUE}"]
        side_effects: ["same as PAST_DUE -> DEFAULTED"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CHARGED_BACK]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /network/warranty-claims/{claimId}/decide {decision: APPROVE}"
        actor: OemAuditor
        preconditions: ["Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/warranty-claims/{claimId}/decide {decision: REJECT}"
        actor: OemAuditor
        preconditions: ["Claim.status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /network/warranty-claims/{claimId}/pay"
        actor: OemAuditor
        preconditions: ["Claim.status == APPROVED (ERR_CLAIM_INVALID_STATE)"]
        side_effects: ["paid_amount_cents = claim_amount_cents; paid_at = current logical clock"]
      - from: PAID
        to: AUDIT_FLAGGED
        trigger: "POST /network/warranty-claims/{claimId}/flag-audit"
        actor: OemAuditor
        preconditions:
          - "Claim.status == PAID (ERR_CLAIM_INVALID_STATE)"
          - "current logical datetime <= paid_at + 365 days (ERR_AUDIT_WINDOW_CLOSED)"
        side_effects: []
      - from: AUDIT_FLAGGED
        to: CHARGED_BACK
        trigger: "POST /network/warranty-claims/{claimId}/chargeback {finding: FULL | PARTIAL}"
        actor: OemAuditor
        preconditions: ["Claim.status == AUDIT_FLAGGED (ERR_CLAIM_INVALID_STATE)"]
        side_effects:
          - "chargeback_amount_cents = claim_amount_cents (FULL) or claim_amount_cents - parts_cost_cents (PARTIAL)"
          - "Dealer.chargeback_balance_cents += chargeback_amount_cents (link 1)"
          - "If Dealer.chargeback_balance_cents >= 50000 and Dealer.status == ACTIVE: Dealer -> SUSPENDED (link 2)"
          - "On that suspension: Leads ROUTED to the dealer -> NEW, routing fields cleared (link 3)"
      - from: CHARGED_BACK
        to: DISPUTED
        trigger: "POST /network/warranty-claims/{claimId}/dispute"
        actor: DealerUser
        preconditions:
          - "Claim.status == CHARGED_BACK (ERR_CLAIM_INVALID_STATE)"
          - "X-User-ID == claim.dealer_id (ERR_DEALER_IDENTITY_MISMATCH)"
        side_effects: []
      - from: DISPUTED
        to: PAID
        trigger: "POST /network/warranty-claims/{claimId}/resolve-dispute {outcome: UPHELD}"
        actor: OemAuditor
        preconditions: ["Claim.status == DISPUTED (ERR_CLAIM_INVALID_STATE)"]
        side_effects: ["Dealer.chargeback_balance_cents -= chargeback_amount_cents; chargeback_amount_cents reset to null"]
      - from: DISPUTED
        to: CHARGED_BACK
        trigger: "POST /network/warranty-claims/{claimId}/resolve-dispute {outcome: DENIED}"
        actor: OemAuditor
        preconditions: ["Claim.status == DISPUTED (ERR_CLAIM_INVALID_STATE)"]
        side_effects: ["no balance change (chargeback stands)"]

  - entity: PartsReturn
    initial_state: DRAFT
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/parts-returns/{returnId}/submit"
        actor: DealerUser
        preconditions:
          - "Return.status == DRAFT (ERR_RETURN_INVALID_STATE)"
          - "X-User-ID == return.dealer_id (ERR_DEALER_IDENTITY_MISMATCH)"
          - "Dealer.stock_compliant == true (ERR_STOCKING_NONCOMPLIANT)"
          - "allowance_used_cents(dealer, return_year) + credit_cents <= round_half_up(0.05 * Dealer.parts_purchases_ytd_cents) (ERR_ALLOWANCE_EXCEEDED; boundary: equality allowed)"
        side_effects: ["credit_cents and restock_pct_applied recomputed against the submit date (logical clock)"]
      - from: SUBMITTED
        to: CREDITED
        trigger: "POST /network/parts-returns/{returnId}/decide {decision: CREDIT}"
        actor: OemSalesOps
        preconditions: ["Return.status == SUBMITTED (ERR_RETURN_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/parts-returns/{returnId}/decide {decision: REJECT}"
        actor: OemSalesOps
        preconditions: ["Return.status == SUBMITTED (ERR_RETURN_INVALID_STATE)"]
        side_effects: []
      - from: CREDITED
        to: REVERSED
        trigger: "POST /network/parts-returns/{returnId}/reverse"
        actor: OemAuditor
        preconditions: ["Return.status == CREDITED (ERR_RETURN_INVALID_STATE)"]
        side_effects: ["Return excluded from allowance_used_cents (compensating release of allowance)"]

  - entity: Certification
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /network/certifications/{certificationId}/decide {decision: VERIFY}"
        actor: OemAuditor
        preconditions: ["Certification.status == PENDING_VERIFICATION (ERR_CERT_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /network/certifications/{certificationId}/decide {decision: REJECT}"
        actor: OemAuditor
        preconditions: ["Certification.status == PENDING_VERIFICATION (ERR_CERT_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /network/certifications/{certificationId}/expire"
        actor: OemAuditor
        preconditions:
          - "Certification.status == ACTIVE (ERR_CERT_INVALID_STATE)"
          - "current logical date > expires_on (ERR_CERT_NOT_YET_EXPIRED)"
        side_effects: []

  - entity: Lead
    initial_state: NEW
    terminal_states: [ACCEPTED]
    transitions:
      - from: NEW
        to: ROUTED
        trigger: "POST /network/leads/{leadId}/route"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED} (ERR_LEAD_INVALID_STATE)"]
        side_effects: ["lead_routing_selection picks dealer; routed_dealer_id/routed_assignment_id set; routed_at = current logical clock"]
      - from: NEW
        to: ORPHANED
        trigger: "POST /network/leads/{leadId}/route (empty candidate pool)"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: ["routing fields remain null"]
      - from: ORPHANED
        to: ROUTED
        trigger: "POST /network/leads/{leadId}/route"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: ["same as NEW -> ROUTED"]
      - from: DECLINED
        to: ROUTED
        trigger: "POST /network/leads/{leadId}/route"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: ["same as NEW -> ROUTED; prior decliner excluded via declined_dealer_ids"]
      - from: DECLINED
        to: ORPHANED
        trigger: "POST /network/leads/{leadId}/route (empty candidate pool)"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: []
      - from: EXPIRED
        to: ROUTED
        trigger: "POST /network/leads/{leadId}/route"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: ["same as NEW -> ROUTED; expired dealer excluded via declined_dealer_ids"]
      - from: EXPIRED
        to: ORPHANED
        trigger: "POST /network/leads/{leadId}/route (empty candidate pool)"
        actor: OemSalesOps
        preconditions: ["Lead.status in {NEW, ORPHANED, DECLINED, EXPIRED}"]
        side_effects: []
      - from: ROUTED
        to: ACCEPTED
        trigger: "POST /network/leads/{leadId}/respond {response: ACCEPT}"
        actor: DealerUser
        preconditions:
          - "Lead.status == ROUTED (ERR_LEAD_INVALID_STATE)"
          - "X-User-ID == lead.routed_dealer_id (ERR_LEAD_NOT_ROUTED_TO_DEALER)"
        side_effects: []
      - from: ROUTED
        to: DECLINED
        trigger: "POST /network/leads/{leadId}/respond {response: DECLINE}"
        actor: DealerUser
        preconditions:
          - "Lead.status == ROUTED (ERR_LEAD_INVALID_STATE)"
          - "X-User-ID == lead.routed_dealer_id (ERR_LEAD_NOT_ROUTED_TO_DEALER)"
        side_effects: ["routed_dealer_id appended to declined_dealer_ids; routed_dealer_id/routed_assignment_id/routed_at cleared"]
      - from: ROUTED
        to: EXPIRED
        trigger: "POST /network/leads/{leadId}/expire"
        actor: OemSalesOps
        preconditions:
          - "Lead.status == ROUTED (ERR_LEAD_INVALID_STATE)"
          - "current logical datetime > routed_at + 72 hours (ERR_LEAD_NOT_YET_EXPIRED)"
        side_effects: ["routed_dealer_id appended to declined_dealer_ids; routing fields cleared"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /network/dealer-agreements/{agreementId}/activate"
    occ_field: expected_dealer_version
    description: |
      Activating a DealerAgreement against a Dealer whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where another writer has just activated an agreement (which may
      legitimately supersede the prior ACTIVE agreement) and the current
      writer's view of the dealer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_discount
    trigger: "UnitSale creation (PROVISIONAL) and SalesTarget close (FINAL)"
    algorithm: tiered_pricing
    formula: |
      ratio = counted_units / target_units for the sale's (dealer, quarter) target
      rate = 0.08 if ratio >= 1.2 (GOLD); 0.05 if ratio >= 1.0 (SILVER); else 0.02 (BRONZE)
      discount_cents = round_half_up(list_price_cents * rate)
    input_set: "UnitSales of the dealer whose sale_date falls in the target's (period_year, period_quarter)"
    constants:
      TIER_GOLD_THRESHOLD: 1.2
      TIER_SILVER_THRESHOLD: 1.0
      RATE_GOLD: 0.08
      RATE_SILVER: 0.05
      RATE_BRONZE: 0.02
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at UnitSale creation"
        difference: "counted_units = achieved_units + 1 (projects this sale as accepted); computed even while target is OPEN; stored on provisional_discount_cents"
      - name: FINAL
        when: "at SalesTarget close"
        difference: "counted_units = achieved_units (ACCEPTED sales only, VOIDED excluded); applied to every ACCEPTED sale's final_discount_cents; delta (final - provisional) summed into Dealer.discount_reconciliation_cents"

  - name: dealer_performance_score
    trigger: "GET /network/dealers/{dealerId}/scorecard and Dealer termination precondition"
    algorithm: weighted_scoring
    formula: |
      sales_score    = round2(min(counted_units / target_units, 1.5) / 1.5 * 100); 0 if no target for the period
      service_score  = round2(100 - 100 * chargebacked_cents / settled_cents); 100 if settled_cents == 0
      training_score = round2(100 * min(cert_units, REQUIRED_ACTIVE_CERTS) / REQUIRED_ACTIVE_CERTS)
      parts_score    = 100 if Dealer.stock_compliant else 0
      total_score    = round2(0.40*sales + 0.25*service + 0.20*training + 0.15*parts)
      Components are rounded to 2 decimals (round_half_up) BEFORE weighting; total rounded to 2 decimals.
      settled_cents   = sum of claim_amount_cents over claims in {PAID, AUDIT_FLAGGED, CHARGED_BACK, DISPUTED}
      chargebacked STRICT   = sum of chargeback_amount_cents over CHARGED_BACK claims
      chargebacked INCLUSIVE = STRICT + sum of claim_amount_cents over {AUDIT_FLAGGED, DISPUTED} claims
    input_set: "Dealer, the SalesTarget for (period_year, period_quarter), all WarrantyClaims of the dealer, all Certifications of the dealer"
    constants:
      REQUIRED_ACTIVE_CERTS: 2
      WEIGHT_SALES: 0.40
      WEIGHT_SERVICE: 0.25
      WEIGHT_TRAINING: 0.20
      WEIGHT_PARTS: 0.15
      TERMINATION_SCORE_THRESHOLD: 60
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STRICT
        when: "termination eligibility and default scorecard read"
        difference: "counted_units = achieved_units (ACCEPTED only); cert_units = count of ACTIVE certifications"
      - name: INCLUSIVE
        when: "scorecard read with variant=INCLUSIVE"
        difference: "counted_units = achieved_units + count of REPORTED sales in the period; cert_units = ACTIVE count + 0.5 * PENDING_VERIFICATION count; chargebacked adds flagged/disputed amounts"

  - name: floorplan_interest_accrual
    trigger: "POST /network/floorplan-advances/{advanceId}/aging-audit"
    algorithm: threshold
    formula: |
      age_days = (current logical date - advance_date) in whole days; creation date is day 0
      principal = advance_cents - paid_curtailments_cents (current value, not historical)
      billable days by age bracket (days 1..FREE_DAYS are free):
        bracket1: days 91..180 at DAILY_RATE_1
        bracket2: days 181..270 at DAILY_RATE_2
        bracket3: days 271+ at DAILY_RATE_3
      accrued_interest_cents = round_half_up(principal * (RATE_1*days_in_bracket1 + RATE_2*days_in_bracket2 + RATE_3*days_in_bracket3))
    input_set: "the single FloorPlanAdvance under audit"
    constants:
      FREE_DAYS: 90
      PAST_DUE_DAYS: 90
      DEFAULT_DAYS: 270
      DAILY_RATE_1: 0.0002
      DAILY_RATE_2: 0.0004
      DAILY_RATE_3: 0.0006
    precision: "integer cents, round_half_up"

  - name: parts_return_credit
    trigger: "PartsReturn creation (preview) and submit (authoritative)"
    algorithm: aggregation
    formula: |
      restock_pct = 0.15 if submit/current logical date > June 30 of return_year else 0
      For EACH line: line_credit = round_half_up(quantity * unit_credit_cents * (1 - restock_pct))
      credit_cents = SUM of per-line rounded credits
      Rounding order is pinned: round per line first, then sum. (Sum-then-round is FORBIDDEN.)
    input_set: "the return's lines array"
    constants:
      RESTOCK_PCT: 0.15
      RESTOCK_MONTH_DAY: "06-30"
    precision: "integer cents, round_half_up per line"

  - name: parts_return_allowance
    trigger: "PartsReturn submit"
    algorithm: threshold
    formula: |
      allowance_total = round_half_up(0.05 * Dealer.parts_purchases_ytd_cents)  (purchases of return_year)
      allowance_used  = sum of credit_cents over the dealer's PartsReturns with
                        return_year == this return_year and status in {SUBMITTED, CREDITED}
      Submit allowed iff allowance_used + this.credit_cents <= allowance_total  (equality allowed)
    input_set: "Dealer's PartsReturns for return_year"
    constants:
      RETURN_ALLOWANCE_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: warranty_claim_amount
    trigger: "WarrantyClaim creation"
    algorithm: tiered_pricing
    formula: |
      labor_rate = 12000 if Dealer.tier == GOLD; 10000 if SILVER; 8500 if BRONZE (tier at submission time)
      claim_amount_cents = parts_cost_cents + round_half_up(labor_hours * labor_rate)
    input_set: "the claim being created + Dealer.tier"
    constants:
      LABOR_RATE_GOLD: 12000
      LABOR_RATE_SILVER: 10000
      LABOR_RATE_BRONZE: 8500
    precision: "integer cents, round_half_up"

  - name: lead_routing_selection
    trigger: "POST /network/leads/{leadId}/route"
    algorithm: selector
    formula: |
      eligibility: Dealer.status == ACTIVE
                   AND exists TerritoryAssignment a: a.status == ACTIVE
                       AND a.territory_code == lead.territory_code
                       AND a.dealer_id == dealer.id
                       AND a.starts_on <= current logical date < a.ends_on   (half-open)
                   AND dealer.id NOT IN lead.declined_dealer_ids
      ranking: open_lead_count ASC  (count of Leads with status ROUTED and routed_dealer_id == dealer.id)
      tie-break: dealer.created_at ASC (earliest created dealer wins)
      fallback: empty candidate pool -> Lead.status = ORPHANED (no error)
    input_set: "all Dealers, their ACTIVE TerritoryAssignments, the lead"
    constants:
      LEAD_SLA_HOURS: 72

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "Input format: required fields present, enums valid, dates parse; end date strictly after start date (agreement expiry_date > effective_date, assignment ends_on > starts_on, certification expires_on > earned_on); PartsReturn return_year == current clock year (ERR_RETURN_YEAR_MISMATCH)"
    error_id: ERR_INVALID_REQUEST | ERR_INVALID_DATE_RANGE | ERR_RETURN_YEAR_MISMATCH
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "Path ids then body-reference ids must exist (left-to-right)"
    error_id: "ERR_DEALER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_TARGET_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_ADVANCE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_LEAD_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints with resource ids"
  - priority: 5
    category: auth
    check: "Ownership/identity: DealerUser body dealer_id must equal X-User-ID; lead respond/dispute actor must be the routed/claim dealer"
    error_id: ERR_DEALER_IDENTITY_MISMATCH | ERR_LEAD_NOT_ROUTED_TO_DEALER
    http_status: 403
    applies_to: "DealerUser write endpoints"
  - priority: 6
    category: state
    check: "OCC and state preconditions: expected_dealer_version == Dealer.version (ERR_STALE_VERSION, 412); target resource in a valid from-state for the transition (ERR_DEALER_NOT_ACTIVE, ERR_DEALER_NOT_SUSPENDED, ERR_AGREEMENT_NOT_IN_DRAFT, ERR_AGREEMENT_NOT_ACTIVE, ERR_ASSIGNMENT_NOT_ACTIVE, ERR_TARGET_NOT_OPEN, ERR_SALE_NOT_REPORTED, ERR_SALE_NOT_ACCEPTED, ERR_ADVANCE_NOT_OPEN, ERR_CLAIM_INVALID_STATE, ERR_RETURN_INVALID_STATE, ERR_CERT_INVALID_STATE, ERR_LEAD_INVALID_STATE)"
    error_id: "ERR_STALE_VERSION + state errors"
    http_status: 409
    applies_to: "all state-transition and OCC-guarded endpoints"
  - priority: 7
    category: business_safety
    check: "Certification compliance: dealer must hold >= 2 ACTIVE certifications at agreement activation; scorecard precondition for termination"
    error_id: ERR_CERTIFICATION_COMPLIANCE | ERR_SCORECARD_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /network/dealer-agreements/{id}/activate; POST /network/dealers/{id}/terminate"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and overlap: dealer_code, agreement_code, (dealer,year,quarter) target, (dealer,unit_serial) sale, (dealer,unit_serial) non-terminal advance; territory half-open overlap per coverage rules; stocking compliance for return submit"
    error_id: "ERR_DUPLICATE_DEALER_CODE | ERR_DUPLICATE_AGREEMENT_CODE | ERR_DUPLICATE_TARGET | ERR_DUPLICATE_UNIT_SERIAL | ERR_DUPLICATE_ADVANCE_SERIAL | ERR_TERRITORY_OVERLAP | ERR_AGREEMENT_OVERLAP | ERR_STOCKING_NONCOMPLIANT"
    http_status: 409
    applies_to: "creation endpoints, assignment creation, agreement activation, return submit"
  - priority: 9
    category: business_temporal
    check: "Window checks: assignment within agreement dates (422); quarter ended before close; audit window 365d; cert/agreement not yet expired; lead SLA elapsed"
    error_id: "ERR_ASSIGNMENT_OUTSIDE_AGREEMENT | ERR_QUARTER_NOT_ENDED | ERR_AUDIT_WINDOW_CLOSED | ERR_CERT_NOT_YET_EXPIRED | ERR_AGREEMENT_NOT_YET_EXPIRED | ERR_LEAD_NOT_YET_EXPIRED"
    http_status: 422
    applies_to: "assignment creation, target close, claim flag-audit, expire endpoints, lead expire"
  - priority: 10
    category: business_referential
    check: "Cross-reference integrity: assignment.agreement_id must belong to assignment.dealer_id; sale void blocked when its floor-plan advance was paid off by the sale's acceptance; reinstate requires chargeback balance below threshold"
    error_id: ERR_AGREEMENT_DEALER_MISMATCH | ERR_SALE_PAYOFF_LOCKED | ERR_REINSTATE_BLOCKED
    http_status: 422
    applies_to: "assignment creation, sale void, dealer status"
  - priority: 11
    category: business_fiscal
    check: "Money limits: advance_cents <= floorplan_available_cents; payment amount <= remaining principal; allowance_used + credit <= allowance_total"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_EXCEEDS_BALANCE | ERR_ALLOWANCE_EXCEEDED
    http_status: 402
    applies_to: "floorplan create, floorplan payment, return submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/network/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [OemNetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current_utc = to_iso8601"]

  # --- Dealer ---
  - method: POST
    path: "/network/dealers"
    description: "Create dealer (ONBOARDING, tier BRONZE, all computed counters 0)"
    roles: [OemNetworkAdmin]
    code: 201
    input: [name, dealer_code, region, credit_limit_cents, min_stock_value_cents]
    output: Dealer
    side_effects: ["status = ONBOARDING", "tier = BRONZE"]
  - method: GET
    path: "/network/dealers"
    description: "List dealers"
    roles: [Any]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: "Dealer[]"
    side_effects: []
  - method: GET
    path: "/network/dealers/{dealerId}"
    description: "Get one dealer"
    roles: [Any]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/network/dealers/{dealerId}/status"
    description: "Suspend (target=SUSPENDED) or reinstate (target=ACTIVE) a dealer"
    roles: [OemNetworkAdmin]
    code: 200
    input: [target]
    output: Dealer
    side_effects: ["status transition per Dealer machine", "on SUSPENDED: ROUTED leads re-queued to NEW", "increments Dealer.version by 1"]
  - method: POST
    path: "/network/dealers/{dealerId}/terminate"
    description: "Terminate dealer (scorecard gate) with 3-level cascade"
    roles: [OemNetworkAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: ["agreement ACTIVE -> TERMINATED", "its assignments ACTIVE -> RELEASED", "leads ROUTED via them -> NEW", "increments Dealer.version by 1"]
  - method: POST
    path: "/network/dealers/{dealerId}/parts-purchases"
    description: "Record a parts purchase; resets YTD when clock year differs from purchases_year"
    roles: [OemNetworkAdmin]
    code: 200
    input: [amount_cents]
    output: Dealer
    side_effects: ["parts_purchases_ytd_cents += amount_cents (or reset to amount on year rollover)", "purchases_year = clock year", "increments Dealer.version by 1"]
  - method: POST
    path: "/network/dealers/{dealerId}/stock-audit"
    description: "Record observed parts stock value; recomputes stock_compliant"
    roles: [OemAuditor]
    code: 200
    input: [observed_stock_value_cents]
    output: Dealer
    side_effects: ["stock_observed_value_cents set", "stock_compliant = observed >= min_stock_value_cents", "increments Dealer.version by 1"]
  - method: GET
    path: "/network/dealers/{dealerId}/scorecard"
    description: "Computed dealer performance scorecard for a quarter"
    roles: [Any]
    code: 200
    input: [period_year, period_quarter, "variant?"]
    output: { period_year: integer, period_quarter: integer, variant: string, sales_score: number, service_score: number, training_score: number, parts_score: number, total_score: number }
    side_effects: []

  # --- DealerAgreement ---
  - method: POST
    path: "/network/dealer-agreements"
    description: "Create agreement (DRAFT)"
    roles: [OemNetworkAdmin]
    code: 201
    input: [dealer_id, agreement_code, effective_date, expiry_date]
    output: DealerAgreement
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/network/dealer-agreements"
    description: "List agreements"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "DealerAgreement[]"
    side_effects: []
  - method: GET
    path: "/network/dealer-agreements/{agreementId}"
    description: "Get one agreement"
    roles: [Any]
    code: 200
    input: []
    output: DealerAgreement
    side_effects: []
  - method: POST
    path: "/network/dealer-agreements/{agreementId}/activate"
    description: "Activate agreement (OCC on Dealer.version; cert compliance; inclusive-overlap vs other ACTIVE agreement unless supersede_existing)"
    roles: [OemNetworkAdmin]
    code: 200
    input: [expected_dealer_version, "supersede_existing?"]
    output: DealerAgreement
    side_effects: ["status -> ACTIVE", "other overlapping ACTIVE agreement -> SUPERSEDED when supersede_existing", "Dealer ONBOARDING -> ACTIVE on first activation", "increments Dealer.version by 1"]
  - method: POST
    path: "/network/dealer-agreements/{agreementId}/terminate"
    description: "Terminate a DRAFT or ACTIVE agreement; releases assignments and re-queues leads"
    roles: [OemNetworkAdmin]
    code: 200
    input: []
    output: DealerAgreement
    side_effects: ["status -> TERMINATED", "ACTIVE assignments -> RELEASED", "ROUTED leads via them -> NEW"]
  - method: POST
    path: "/network/dealer-agreements/{agreementId}/expire"
    description: "Expire an ACTIVE agreement once clock passes expiry_date"
    roles: [OemNetworkAdmin]
    code: 200
    input: []
    output: DealerAgreement
    side_effects: ["status -> EXPIRED", "ACTIVE assignments -> RELEASED", "ROUTED leads via them -> NEW"]

  # --- TerritoryAssignment ---
  - method: POST
    path: "/network/territory-assignments"
    description: "Create assignment (ACTIVE); half-open exclusivity by coverage_type; must sit within agreement window"
    roles: [OemNetworkAdmin]
    code: 201
    input: [dealer_id, agreement_id, territory_code, coverage_type, starts_on, ends_on]
    output: TerritoryAssignment
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/network/territory-assignments"
    description: "List assignments"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "agreement_id?", "territory_code?", "status?", "limit?", "offset?"]
    output: "TerritoryAssignment[]"
    side_effects: []
  - method: GET
    path: "/network/territory-assignments/{assignmentId}"
    description: "Get one assignment"
    roles: [Any]
    code: 200
    input: []
    output: TerritoryAssignment
    side_effects: []
  - method: POST
    path: "/network/territory-assignments/{assignmentId}/release"
    description: "Release an ACTIVE assignment; re-queues its ROUTED leads"
    roles: [OemNetworkAdmin]
    code: 200
    input: []
    output: TerritoryAssignment
    side_effects: ["status -> RELEASED", "ROUTED leads via it -> NEW"]

  # --- SalesTarget ---
  - method: POST
    path: "/network/sales-targets"
    description: "Create quarterly target (OPEN)"
    roles: [OemSalesOps]
    code: 201
    input: [dealer_id, period_year, period_quarter, target_units]
    output: SalesTarget
    side_effects: ["status = OPEN", "achieved_units = 0"]
  - method: GET
    path: "/network/sales-targets"
    description: "List targets"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "SalesTarget[]"
    side_effects: []
  - method: GET
    path: "/network/sales-targets/{targetId}"
    description: "Get one target"
    roles: [Any]
    code: 200
    input: []
    output: SalesTarget
  - method: POST
    path: "/network/sales-targets/{targetId}/close"
    description: "Close target after quarter end; locks FINAL discounts, reconciliation delta, and tier"
    roles: [OemSalesOps]
    code: 200
    input: []
    output: SalesTarget
    side_effects: ["status -> CLOSED_MET (achieved >= target) or CLOSED_MISSED", "final_discount_rate locked", "ACCEPTED sales get final_discount_cents", "Dealer.discount_reconciliation_cents += sum(final - provisional)", "Dealer.tier recomputed", "increments Dealer.version by 1"]

  # --- UnitSale ---
  - method: POST
    path: "/network/unit-sales"
    description: "Dealer reports a retail unit sale (REPORTED); provisional discount computed"
    roles: [DealerUser]
    code: 201
    input: [dealer_id, unit_serial, sale_date, list_price_cents]
    output: UnitSale
    side_effects: ["status = REPORTED", "provisional_discount_cents computed (tier_discount PROVISIONAL)"]
  - method: GET
    path: "/network/unit-sales"
    description: "List unit sales"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "UnitSale[]"
    side_effects: []
  - method: GET
    path: "/network/unit-sales/{saleId}"
    description: "Get one unit sale"
    roles: [Any]
    code: 200
    input: []
    output: UnitSale
    side_effects: []
  - method: POST
    path: "/network/unit-sales/{saleId}/decide"
    description: "Accept or reject a REPORTED sale"
    roles: [OemSalesOps]
    code: 200
    input: [decision, "reason?"]
    output: UnitSale
    side_effects: ["ACCEPT: status -> ACCEPTED, achieved_units += 1, linked floor-plan advance -> PAID_OFF with utilization release", "REJECT: status -> REJECTED"]
  - method: POST
    path: "/network/unit-sales/{saleId}/void"
    description: "Void an ACCEPTED sale (blocked when its floor-plan payoff already happened)"
    roles: [OemSalesOps]
    code: 200
    input: []
    output: UnitSale
    side_effects: ["status -> VOIDED", "achieved_units -= 1"]

  # --- FloorPlanAdvance ---
  - method: POST
    path: "/network/floorplan-advances"
    description: "Create floor-plan advance against dealer credit (OPEN)"
    roles: [OemNetworkAdmin]
    code: 201
    input: [dealer_id, unit_serial, advance_cents]
    output: FloorPlanAdvance
    side_effects: ["status = OPEN", "advance_date = current logical date", "Dealer.floorplan_utilization_cents += advance_cents"]
  - method: GET
    path: "/network/floorplan-advances"
    description: "List advances"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "FloorPlanAdvance[]"
    side_effects: []
  - method: GET
    path: "/network/floorplan-advances/{advanceId}"
    description: "Get one advance"
    roles: [Any]
    code: 200
    input: []
    output: FloorPlanAdvance
    side_effects: []
  - method: POST
    path: "/network/floorplan-advances/{advanceId}/payment"
    description: "Curtailment (partial) or payoff (amount == remaining principal)"
    roles: [OemNetworkAdmin]
    code: 200
    input: [amount_cents]
    output: FloorPlanAdvance
    side_effects: ["paid_curtailments_cents += amount_cents", "Dealer.floorplan_utilization_cents -= amount_cents", "status -> CURTAILED (partial) or PAID_OFF (full)"]
  - method: POST
    path: "/network/floorplan-advances/{advanceId}/aging-audit"
    description: "Aging audit: recompute interest; age > 90 -> PAST_DUE; age > 270 -> DEFAULTED"
    roles: [OemAuditor]
    code: 200
    input: []
    output: FloorPlanAdvance
    side_effects: ["accrued_interest_cents recomputed (floorplan_interest_accrual)", "status -> PAST_DUE or DEFAULTED per age", "DEFAULTED: utilization released, default_loss_cents += remaining"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/network/warranty-claims"
    description: "Dealer submits warranty claim (SUBMITTED); amount computed from tier labor rate"
    roles: [DealerUser]
    code: 201
    input: [dealer_id, unit_serial, parts_cost_cents, labor_hours, failure_description]
    output: WarrantyClaim
    side_effects: ["status = SUBMITTED", "claim_amount_cents computed (warranty_claim_amount)"]
  - method: GET
    path: "/network/warranty-claims"
    description: "List claims"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/network/warranty-claims/{claimId}"
    description: "Get one claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/network/warranty-claims/{claimId}/decide"
    description: "Approve or reject a SUBMITTED claim"
    roles: [OemAuditor]
    code: 200
    input: [decision, "reason?"]
    output: WarrantyClaim
    side_effects: ["APPROVE: -> APPROVED", "REJECT: -> REJECTED"]
  - method: POST
    path: "/network/warranty-claims/{claimId}/pay"
    description: "Pay an APPROVED claim"
    roles: [OemAuditor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> PAID", "paid_amount_cents = claim_amount_cents", "paid_at = current logical clock"]
  - method: POST
    path: "/network/warranty-claims/{claimId}/flag-audit"
    description: "Flag a PAID claim for audit within 365 days of payment"
    roles: [OemAuditor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> AUDIT_FLAGGED"]
  - method: POST
    path: "/network/warranty-claims/{claimId}/chargeback"
    description: "Charge back a flagged claim (FULL or PARTIAL finding); may suspend dealer at balance >= 50000"
    roles: [OemAuditor]
    code: 200
    input: [finding]
    output: WarrantyClaim
    side_effects: ["status -> CHARGED_BACK", "chargeback_amount_cents per finding", "Dealer.chargeback_balance_cents += amount", "balance >= 50000 and dealer ACTIVE -> SUSPENDED + leads re-queued"]
  - method: POST
    path: "/network/warranty-claims/{claimId}/dispute"
    description: "Dealer disputes a chargeback"
    roles: [DealerUser]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status CHARGED_BACK -> DISPUTED"]
  - method: POST
    path: "/network/warranty-claims/{claimId}/resolve-dispute"
    description: "Resolve dispute: UPHELD restores PAID and reverses balance; DENIED keeps CHARGED_BACK"
    roles: [OemAuditor]
    code: 200
    input: [outcome]
    output: WarrantyClaim
    side_effects: ["UPHELD: -> PAID, balance -= chargeback_amount_cents, chargeback_amount_cents null", "DENIED: -> CHARGED_BACK, no balance change"]

  # --- PartsReturn ---
  - method: POST
    path: "/network/parts-returns"
    description: "Dealer drafts an annual parts return (DRAFT); credit previewed"
    roles: [DealerUser]
    code: 201
    input: [dealer_id, return_year, lines]
    output: PartsReturn
    side_effects: ["status = DRAFT", "credit_cents previewed (parts_return_credit)"]
  - method: GET
    path: "/network/parts-returns"
    description: "List parts returns"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "return_year?", "status?", "limit?", "offset?"]
    output: "PartsReturn[]"
    side_effects: []
  - method: GET
    path: "/network/parts-returns/{returnId}"
    description: "Get one parts return"
    roles: [Any]
    code: 200
    input: []
    output: PartsReturn
    side_effects: []
  - method: POST
    path: "/network/parts-returns/{returnId}/submit"
    description: "Submit a DRAFT return; recomputes credit; enforces stocking + allowance"
    roles: [DealerUser]
    code: 200
    input: []
    output: PartsReturn
    side_effects: ["status -> SUBMITTED", "credit_cents and restock_pct_applied recomputed at submit date"]
  - method: POST
    path: "/network/parts-returns/{returnId}/decide"
    description: "Credit or reject a SUBMITTED return"
    roles: [OemSalesOps]
    code: 200
    input: [decision, "reason?"]
    output: PartsReturn
    side_effects: ["CREDIT: -> CREDITED", "REJECT: -> REJECTED"]
  - method: POST
    path: "/network/parts-returns/{returnId}/reverse"
    description: "Reverse a CREDITED return (compensating action; frees allowance)"
    roles: [OemAuditor]
    code: 200
    input: []
    output: PartsReturn
    side_effects: ["status CREDITED -> REVERSED", "excluded from allowance_used_cents"]

  # --- Certification ---
  - method: POST
    path: "/network/certifications"
    description: "Dealer registers a certification (PENDING_VERIFICATION)"
    roles: [DealerUser]
    code: 201
    input: [dealer_id, cert_code, earned_on, expires_on]
    output: Certification
    side_effects: ["status = PENDING_VERIFICATION"]
  - method: GET
    path: "/network/certifications"
    description: "List certifications"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []
  - method: GET
    path: "/network/certifications/{certificationId}"
    description: "Get one certification"
    roles: [Any]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: POST
    path: "/network/certifications/{certificationId}/decide"
    description: "Verify or reject a PENDING_VERIFICATION certification"
    roles: [OemAuditor]
    code: 200
    input: [decision, "reason?"]
    output: Certification
    side_effects: ["VERIFY: -> ACTIVE", "REJECT: -> REJECTED"]
  - method: POST
    path: "/network/certifications/{certificationId}/expire"
    description: "Expire an ACTIVE certification once clock passes expires_on"
    roles: [OemAuditor]
    code: 200
    input: []
    output: Certification
    side_effects: ["status -> EXPIRED"]

  # --- Lead ---
  - method: POST
    path: "/network/leads"
    description: "Create a lead (NEW)"
    roles: [OemSalesOps]
    code: 201
    input: [territory_code, product_line, estimated_value_cents, contact_name]
    output: Lead
    side_effects: ["status = NEW"]
  - method: GET
    path: "/network/leads"
    description: "List leads"
    roles: [Any]
    code: 200
    input: ["territory_code?", "status?", "routed_dealer_id?", "routed_assignment_id?", "limit?", "offset?"]
    output: "Lead[]"
    side_effects: []
  - method: GET
    path: "/network/leads/{leadId}"
    description: "Get one lead"
    roles: [Any]
    code: 200
    input: []
    output: Lead
    side_effects: []
  - method: POST
    path: "/network/leads/{leadId}/route"
    description: "Route (or re-route) a lead via lead_routing_selection; empty pool -> ORPHANED"
    roles: [OemSalesOps]
    code: 200
    input: []
    output: Lead
    side_effects: ["status -> ROUTED (dealer + assignment set, routed_at = clock) or ORPHANED"]
  - method: POST
    path: "/network/leads/{leadId}/respond"
    description: "Routed dealer accepts or declines"
    roles: [DealerUser]
    code: 200
    input: [response]
    output: Lead
    side_effects: ["ACCEPT: -> ACCEPTED", "DECLINE: -> DECLINED, dealer appended to declined_dealer_ids, routing cleared"]
  - method: POST
    path: "/network/leads/{leadId}/expire"
    description: "Expire a ROUTED lead once routed_at + 72h has passed; dealer excluded from re-route"
    roles: [OemSalesOps]
    code: 200
    input: []
    output: Lead
    side_effects: ["status -> EXPIRED", "dealer appended to declined_dealer_ids", "routing cleared"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/type, or malformed date" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "End date not strictly after start date" }
  - { id: ERR_RETURN_YEAR_MISMATCH, http: 400, condition: "PartsReturn return_year != current clock year" }
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "Dealer id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Agreement id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Territory assignment id does not exist" }
  - { id: ERR_TARGET_NOT_FOUND, http: 404, condition: "Sales target id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "Unit sale id does not exist" }
  - { id: ERR_ADVANCE_NOT_FOUND, http: 404, condition: "Floor-plan advance id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Warranty claim id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Parts return id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "Certification id does not exist" }
  - { id: ERR_LEAD_NOT_FOUND, http: 404, condition: "Lead id does not exist" }
  - { id: ERR_DEALER_IDENTITY_MISMATCH, http: 403, condition: "DealerUser body dealer_id != X-User-ID (or disputing non-own claim)" }
  - { id: ERR_LEAD_NOT_ROUTED_TO_DEALER, http: 403, condition: "Responding DealerUser is not the routed dealer" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_dealer_version != current Dealer.version at agreement activation" }
  - { id: ERR_DEALER_NOT_ACTIVE, http: 409, condition: "Operation requires Dealer.status == ACTIVE (also covers suspend from non-ACTIVE and writes on TERMINATED/ONBOARDING dealer)" }
  - { id: ERR_DEALER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires Dealer.status == SUSPENDED" }
  - { id: ERR_REINSTATE_BLOCKED, http: 409, condition: "Reinstate requires chargeback_balance_cents < 50000" }
  - { id: ERR_SCORECARD_THRESHOLD_NOT_MET, http: 409, condition: "Termination requires STRICT total_score < 60 for the two most recent closed quarters" }
  - { id: ERR_CERTIFICATION_COMPLIANCE, http: 409, condition: "Agreement activation requires >= 2 ACTIVE certifications" }
  - { id: ERR_AGREEMENT_NOT_IN_DRAFT, http: 409, condition: "Activation requires agreement in DRAFT" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires agreement ACTIVE (expire, assignment creation)" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Inclusive [effective_date, expiry_date] overlap with another ACTIVE agreement for the dealer and supersede_existing not set (touching dates count as overlap)" }
  - { id: ERR_AGREEMENT_NOT_YET_EXPIRED, http: 409, condition: "Expire requires current logical date > expiry_date" }
  - { id: ERR_AGREEMENT_DEALER_MISMATCH, http: 422, condition: "TerritoryAssignment.agreement_id does not belong to TerritoryAssignment.dealer_id" }
  - { id: ERR_TERRITORY_OVERLAP, http: 409, condition: "Half-open [starts_on, ends_on) overlap with an ACTIVE assignment on the same territory_code when either side is EXCLUSIVE (adjacency allowed)" }
  - { id: ERR_ASSIGNMENT_OUTSIDE_AGREEMENT, http: 422, condition: "Assignment window must satisfy agreement.effective_date <= starts_on and ends_on <= agreement.expiry_date" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "Release requires assignment ACTIVE" }
  - { id: ERR_DUPLICATE_DEALER_CODE, http: 409, condition: "dealer_code already exists" }
  - { id: ERR_DUPLICATE_AGREEMENT_CODE, http: 409, condition: "agreement_code already exists" }
  - { id: ERR_DUPLICATE_TARGET, http: 409, condition: "Target already exists for (dealer_id, period_year, period_quarter)" }
  - { id: ERR_TARGET_NOT_OPEN, http: 409, condition: "Target missing or not OPEN (sale create/accept, double close)" }
  - { id: ERR_QUARTER_NOT_ENDED, http: 422, condition: "Close requires current logical date >= first day of the following quarter" }
  - { id: ERR_DUPLICATE_UNIT_SERIAL, http: 409, condition: "Non-terminal sale with same (dealer_id, unit_serial) exists" }
  - { id: ERR_SALE_NOT_REPORTED, http: 409, condition: "decide requires sale REPORTED" }
  - { id: ERR_SALE_NOT_ACCEPTED, http: 409, condition: "void requires sale ACCEPTED" }
  - { id: ERR_SALE_PAYOFF_LOCKED, http: 409, condition: "Void blocked: linked floor-plan advance was paid off by this sale's acceptance" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "advance_cents > floorplan_available_cents" }
  - { id: ERR_DUPLICATE_ADVANCE_SERIAL, http: 409, condition: "Non-terminal advance with same (dealer_id, unit_serial) exists" }
  - { id: ERR_ADVANCE_NOT_OPEN, http: 409, condition: "Payment/audit requires advance in OPEN, CURTAILED, or PAST_DUE" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "amount_cents > remaining principal" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in the from-state required by the transition" }
  - { id: ERR_AUDIT_WINDOW_CLOSED, http: 422, condition: "flag-audit requires current logical datetime <= paid_at + 365 days" }
  - { id: ERR_STOCKING_NONCOMPLIANT, http: 409, condition: "Return submit requires Dealer.stock_compliant == true" }
  - { id: ERR_ALLOWANCE_EXCEEDED, http: 402, condition: "allowance_used + credit_cents > round_half_up(0.05 * parts_purchases_ytd_cents)" }
  - { id: ERR_RETURN_INVALID_STATE, http: 409, condition: "Return not in the from-state required by the transition" }
  - { id: ERR_CERT_INVALID_STATE, http: 409, condition: "Certification not in the from-state required by the transition" }
  - { id: ERR_CERT_NOT_YET_EXPIRED, http: 422, condition: "Certification expire requires current logical date > expires_on" }
  - { id: ERR_LEAD_INVALID_STATE, http: 409, condition: "Lead not in the from-state required by the transition" }
  - { id: ERR_LEAD_NOT_YET_EXPIRED, http: 422, condition: "Lead expire requires current logical datetime > routed_at + 72 hours" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OemNetworkAdmin
    description: "OEM network operations administrator: dealers, agreements, territories, floor-plan financing, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /network/dealers; POST /network/dealers/{id}/status; POST /network/dealers/{id}/terminate; POST /network/dealers/{id}/parts-purchases"
      - "POST /network/dealer-agreements; POST /network/dealer-agreements/{id}/activate|terminate|expire"
      - "POST /network/territory-assignments; POST /network/territory-assignments/{id}/release"
      - "POST /network/floorplan-advances; POST /network/floorplan-advances/{id}/payment"
      - "POST /network/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: OemSalesOps
    description: "OEM sales operations: quotas, sale review, lead routing, parts-return crediting"
    identity: opaque
    exclusive_operations:
      - "POST /network/sales-targets; POST /network/sales-targets/{id}/close"
      - "POST /network/unit-sales/{id}/decide; POST /network/unit-sales/{id}/void"
      - "POST /network/leads; POST /network/leads/{id}/route|expire"
      - "POST /network/parts-returns/{id}/decide"
    shared_operations: ["all GET endpoints"]
  - name: OemAuditor
    description: "OEM audit function: warranty claim adjudication and chargebacks, floor-plan aging audits, certification verification, stock audits, return reversals"
    identity: opaque
    exclusive_operations:
      - "POST /network/warranty-claims/{id}/decide|pay|flag-audit|chargeback|resolve-dispute"
      - "POST /network/floorplan-advances/{id}/aging-audit"
      - "POST /network/certifications/{id}/decide|expire"
      - "POST /network/dealers/{id}/stock-audit"
      - "POST /network/parts-returns/{id}/reverse"
    shared_operations: ["all GET endpoints"]
  - name: DealerUser
    description: "Dealer-side user; X-User-ID is the Dealer id"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /network/unit-sales (own dealer_id only)"
      - "POST /network/warranty-claims (own); POST /network/warranty-claims/{id}/dispute (own)"
      - "POST /network/parts-returns (own); POST /network/parts-returns/{id}/submit (own)"
      - "POST /network/certifications (own)"
      - "POST /network/leads/{id}/respond (routed dealer only)"
    shared_operations: ["all GET endpoints"]
  - name: Any
    description: "Marker role covering every authenticated caller for read endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
