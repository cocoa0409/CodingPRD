# =============================================================================
# Task 1236 — Building Materials Reuse Warehouse (Habitat ReStore style)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Building Materials Reuse Warehouse (Habitat ReStore style reuse center): donation
  acceptance criteria & deconstruction pickup scheduling, item pricing & inventory by
  category, tax receipt & appraisal guidance for donors, hazardous material screening
  (lead/asbestos) on salvage, volunteer/paid crew for deconstruction jobs, store
  merchandising & turnover of slow items, contractor account & bulk purchases,
  diversion tonnage reporting

domain_name: building-materials-reuse
api_prefix: /reuse

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links via FK fields)
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Donor full name or organization name" }
      - { name: donor_type, type: enum, source: input, description: "INDIVIDUAL | BUSINESS | CONTRACTOR" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: "" }
      - { name: address_text, type: string, source: input, description: "Mailing address for tax receipts" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "ACTIVE | INACTIVE" }
      - { name: trailing_receipt_value_cents, type: integer, source: computed, default: 0, description: "Sum of valued_total_cents over TaxReceipts in status ISSUED or SUPERSEDED with issued_at within [clock-365d, clock]; VOIDED receipts excluded" }
      - { name: recognition_tier, type: enum, source: computed, default: NONE, description: "NONE | SUPPORTER | BUILDER | CORNERSTONE — threshold derivation per donor_recognition_tier calculation", constraints: "NONE | SUPPORTER | BUILDER | CORNERSTONE" }

  - name: Category
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique category code", constraints: "unique across all categories" }
      - { name: display_name, type: string, source: input, description: "Human-readable category name" }
      - { name: pricing_model, type: enum, source: input, description: "PER_UNIT | PER_SQFT | PER_LINEAR_FT | FLAT — basis for item_list_price", constraints: "PER_UNIT | PER_SQFT | PER_LINEAR_FT | FLAT" }
      - { name: base_rate_cents, type: integer, source: input, description: "List-rate in cents per unit of pricing_model (per piece for PER_UNIT, per sqft for PER_SQFT, per linear foot for PER_LINEAR_FT, whole lot for FLAT)" }
      - { name: acceptance_status, type: enum, source: system, default: ACCEPTING, description: "ACCEPTING | PAUSED | RETIRED", constraints: "ACCEPTING | PAUSED | RETIRED" }
      - { name: hazmat_risk_flag, type: boolean, source: input, description: "True when items in this category carry lead/asbestos risk (pre-1978 paint, insulation, floor tiles)" }
      - { name: requires_appraisal_review, type: boolean, source: input, default: false, description: "True for architectural salvage / antiques where appraisal guidance is given regardless of value" }
      - { name: markdown_after_days, type: integer, source: input, description: "Days on floor before first markdown (>= comparison)" }
      - { name: markdown_step_pct, type: number, source: input, description: "Fraction of list_price removed per markdown step, e.g. 0.20" }
      - { name: markdown_interval_days, type: integer, source: input, description: "Additional days on floor required per subsequent markdown step" }
      - { name: max_markdown_steps, type: integer, source: input, description: "Maximum markdown steps; reaching it flags the item for disposition" }
      - { name: floor_price_pct, type: number, source: input, description: "Markdown floor as fraction of list_price_cents; current_price never drops below round(list_price_cents * floor_price_pct)" }
      - { name: divertible, type: boolean, source: input, default: true, description: "Whether items/batches in this category count toward diversion tonnage" }
      - { name: target_turn_days, type: integer, source: input, description: "Merchandising target: items with days_on_floor >= target_turn_days are 'slow'" }
      - { name: slow_item_disposition, type: enum, source: input, default: DONATE, description: "DONATE | RECYCLE | DISPOSE — recommended disposition once max_markdown_steps is exhausted", constraints: "DONATE | RECYCLE | DISPOSE" }

  - name: DonationOffer
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id; offering donor" }
      - { name: source_type, type: enum, source: input, description: "DROPOFF | PICKUP | DECONSTRUCTION", constraints: "DROPOFF | PICKUP | DECONSTRUCTION" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; primary category of the offered materials" }
      - { name: description_text, type: string, source: input, description: "Free-text description of offered materials" }
      - { name: estimated_quantity, type: number, source: input, description: "Offered quantity in quantity_unit; must be > 0" }
      - { name: quantity_unit, type: enum, source: input, description: "UNIT | SQFT | LINEAR_FT", constraints: "UNIT | SQFT | LINEAR_FT" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | D — A like-new, D salvage-only; D fails acceptance criteria", constraints: "A | B | C | D" }
      - { name: pre_1978_flag, type: boolean, source: input, description: "True when materials were installed/painted before 1978 (lead-paint risk)" }
      - { name: deconstruction_job_id, type: string, source: input, default: null, description: "FK -> DeconstructionJob.id; required iff source_type == DECONSTRUCTION, otherwise null" }
      - { name: status, type: enum, source: system, description: "OFFERED | UNDER_REVIEW | NEEDS_INFO | ACCEPTED | REJECTED | RECEIVED | RECEIPTED | CANCELLED", constraints: "see state_machines.DonationOffer" }
      - { name: review_notes, type: string, source: system, default: "", description: "Staff notes recorded on request-info / reject" }
      - { name: decision_reason, type: string, source: system, default: "", description: "Rejection reason recorded on reject" }
      - { name: received_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the IntakeStaff who executed receive; consumed by receipt segregation-of-duties check" }
      - { name: estimated_value_cents, type: integer, source: computed, default: 0, description: "Provisional guidance valuation computed at accept per receipt_guidance_valuation (ESTIMATED_GUIDANCE variant)" }
      - { name: final_value_cents, type: integer, source: computed, default: 0, description: "Final valued total copied from the issued TaxReceipt.valued_total_cents" }

  - name: DeconstructionJob
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Job title / site nickname" }
      - { name: site_address_text, type: string, source: input, description: "Site address" }
      - { name: donor_id, type: string, source: input, default: null, description: "FK -> Donor.id; site owner donating salvaged materials, optional" }
      - { name: quoted_fee_cents, type: integer, source: input, description: "Fixed quoted deconstruction service fee" }
      - { name: included_labor_cents, type: integer, source: input, default: 0, description: "Amount of paid-crew labor included in the quote before overage billing" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCREENING_PENDING | CLEARED | HAZMAT_HOLD | REMEDIATION_IN_PROGRESS | SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "see state_machines.DeconstructionJob" }
      - { name: lead_crew_member_id, type: string, source: system, default: null, description: "FK -> CrewMember.id; assigned at schedule" }
      - { name: vehicle_id, type: string, source: system, default: null, description: "FK -> Vehicle.id; assigned at schedule" }
      - { name: scheduled_start, type: datetime, source: system, default: null, description: "Job window start set at schedule" }
      - { name: scheduled_end, type: datetime, source: system, default: null, description: "Job window end set at schedule" }
      - { name: clearing_screening_id, type: string, source: system, default: null, description: "FK -> HazmatScreening.id; the screening whose outcome CLEARED moved the job to CLEARED" }
      - { name: estimated_diverted_weight_lbs, type: number, source: computed, default: 0, description: "Sum of estimated_weight_lbs over the job's SalvageBatches in any non-terminal-non-DISPOSED_HAZARD status (ESTIMATED tonnage variant)" }
      - { name: certified_diverted_weight_lbs, type: number, source: computed, default: 0, description: "Sum of diverted_weight_lbs over the job's SalvageBatches in status WEIGHED or SORTED (CERTIFIED tonnage variant)" }
      - { name: actual_fee_cents, type: integer, source: computed, default: 0, description: "quoted_fee_cents + max(0, paid_labor_total_cents - included_labor_cents); recomputed on every CrewAssignment completion/cancel" }

  - name: HazmatScreening
    parent: null
    common_fields: false
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> DeconstructionJob.id; screened job" }
      - { name: performed_by_crew_id, type: string, source: system, description: "FK -> CrewMember.id; set from X-User-ID of the acting HazmatTechnician" }
      - { name: screening_round, type: integer, source: system, description: "1-based count of screenings recorded for job_id, assigned in created_at order" }
      - { name: lead_result, type: enum, source: input, description: "NOT_TESTED | NEGATIVE | POSITIVE", constraints: "NOT_TESTED | NEGATIVE | POSITIVE" }
      - { name: asbestos_result, type: enum, source: input, description: "NOT_TESTED | NEGATIVE | POSITIVE", constraints: "NOT_TESTED | NEGATIVE | POSITIVE" }
      - { name: notes, type: string, source: input, default: "", description: "Technician notes" }
      - { name: outcome, type: enum, source: computed, description: "CLEARED iff lead_result==NEGATIVE and asbestos_result==NEGATIVE; FAILED iff either is POSITIVE; otherwise PENDING", constraints: "CLEARED | FAILED | PENDING" }

  - name: SalvageBatch
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> DeconstructionJob.id; source job" }
      - { name: offer_id, type: string, source: input, default: null, description: "FK -> DonationOffer.id; optional link to the DECONSTRUCTION-source offer expecting these materials" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; dominant material category" }
      - { name: status, type: enum, source: system, description: "MANIFESTED | WEIGHED | QUARANTINED | SORTED | DISPOSED_HAZARD", constraints: "see state_machines.SalvageBatch" }
      - { name: estimated_weight_lbs, type: number, source: input, description: "Crew-estimated weight at manifest" }
      - { name: scale_weight_lbs, type: number, source: system, default: 0, description: "Certified scale weight recorded at weigh (or re-weigh on REMEDIATED resolve)" }
      - { name: contamination_weight_lbs, type: number, source: system, default: 0, description: "Non-divertible contamination subtracted at weigh" }
      - { name: diverted_weight_lbs, type: number, source: computed, default: 0, description: "= scale_weight_lbs - contamination_weight_lbs; 0 until weighed" }
      - { name: weighed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the weigh transition" }
      - { name: report_period, type: string, source: computed, default: "", description: "YYYY-MM derived from weighed_at; empty until weighed" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id" }
      - { name: batch_id, type: string, source: input, default: null, description: "FK -> SalvageBatch.id; set when the item comes from a deconstruction batch" }
      - { name: offer_id, type: string, source: input, default: null, description: "FK -> DonationOffer.id; set when the item comes from a received donation offer" }
      - { name: screening_id, type: string, source: input, default: null, description: "FK -> HazmatScreening.id; required iff hazmat exposure applies and batch_id is null (batch items inherit the job screening)" }
      - { name: parent_item_id, type: string, source: system, default: null, description: "FK -> Item.id; set on remainder items created by split (self-referential lineage)" }
      - { name: description_text, type: string, source: input, description: "Item description" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | D", constraints: "A | B | C | D" }
      - { name: measure_qty, type: number, source: input, description: "Quantity in measure_unit; must be > 0; reduced on split" }
      - { name: measure_unit, type: enum, source: input, description: "UNIT | SQFT | LINEAR_FT", constraints: "UNIT | SQFT | LINEAR_FT" }
      - { name: pre_1978_flag, type: boolean, source: input, description: "Pre-1978 material flag (lead risk)" }
      - { name: estimated_weight_lbs, type: number, source: input, description: "Estimated item weight used for walk-in diversion accounting" }
      - { name: pricing_status, type: enum, source: system, description: "UNPRICED | PRICED — parallel dimension 1", constraints: "UNPRICED | PRICED" }
      - { name: sales_status, type: enum, source: system, description: "BACKROOM | ON_FLOOR | RESERVED | SOLD | DONATED_OUT | RECYCLED | DISPOSED — parallel dimension 2", constraints: "see state_machines.Item" }
      - { name: list_price_cents, type: integer, source: computed, default: 0, description: "Pricing-engine output (or manager override) from the price action" }
      - { name: current_price_cents, type: integer, source: computed, default: 0, description: "Price after markdown steps; initialized to list_price_cents" }
      - { name: markdown_step, type: integer, source: system, default: 0, description: "Number of markdown steps applied" }
      - { name: price_override_cents, type: integer, source: system, default: null, description: "Manager override captured by the price action" }
      - { name: priced_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the StoreManager who priced the item" }
      - { name: zone_id, type: string, source: system, default: null, description: "FK -> StoreZone.id; floor location while ON_FLOOR or RESERVED" }
      - { name: floor_since, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent BACKROOM -> ON_FLOOR placement" }
      - { name: days_on_floor, type: integer, source: computed, default: 0, description: "Whole days between floor_since and logical clock; 0 when not placed" }
      - { name: disposition_recommended, type: enum, source: system, default: NONE, description: "NONE | DONATE | RECYCLE | DISPOSE — set by markdown sweep when max_markdown_steps exhausted; cleared on re-price", constraints: "NONE | DONATE | RECYCLE | DISPOSE" }
      - { name: sold_via_sale_id, type: string, source: system, default: null, description: "FK -> Sale.id; sale that finalized the item as SOLD" }

  - name: StoreZone
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique zone code", constraints: "unique across all zones" }
      - { name: display_name, type: string, source: input, description: "Zone display name" }
      - { name: capacity, type: integer, source: input, description: "Maximum resident items; must be >= 1" }
      - { name: current_count, type: integer, source: computed, default: 0, description: "Count of Items with zone_id == this zone and sales_status in {ON_FLOOR, RESERVED}" }
      - { name: allowed_category_id, type: string, source: input, default: null, description: "FK -> Category.id; when set, only items of this category may be placed" }
      - { name: restock_threshold, type: integer, source: input, default: 0, description: "When current_count <= restock_threshold the zone is flagged restock_recommended" }
      - { name: restock_recommended, type: boolean, source: computed, default: false, description: "True iff current_count <= restock_threshold; recomputed on every occupancy change" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED", constraints: "OPEN | CLOSED" }

  - name: MarkdownRun
    parent: null
    common_fields: false
    fields:
      - { name: as_of_date, type: string, source: system, description: "Logical-clock date (YYYY-MM-DD) the sweep evaluated eligibility against" }
      - { name: items_evaluated, type: integer, source: computed, description: "Count of Items with pricing_status == PRICED and sales_status == ON_FLOOR at sweep time" }
      - { name: items_marked_down, type: integer, source: computed, description: "Count of items whose markdown_step increased" }
      - { name: items_flagged_disposition, type: integer, source: computed, description: "Count of items whose disposition_recommended transitioned NONE -> category.slow_item_disposition" }
      - { name: notes, type: string, source: input, default: "", description: "Operator notes" }

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Contractor company name" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | ACTIVE | SUSPENDED | CLOSED", constraints: "see state_machines.ContractorAccount" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding_balance_cents after a finalize; >= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over FINALIZED sales minus payments minus voided totals; ledger-synced" }
      - { name: trailing_volume_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this account's sales with status FINALIZED and finalized_at in [clock-365d, clock]" }
      - { name: discount_tier, type: enum, source: computed, default: STANDARD, description: "STANDARD | SILVER | GOLD — from trailing_volume_cents per contractor_discount_pct", constraints: "STANDARD | SILVER | GOLD" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Net payment terms" }
      - { name: suspension_reason, type: string, source: system, default: "", description: "Reason recorded on manual or automatic suspension" }
      - { name: approved_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the WarehouseAdmin who approved the account" }

  - name: BulkPurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> ContractorAccount.id" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; category the volume terms apply to" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount for qualifying lines, e.g. 0.12" }
      - { name: min_quantity, type: number, source: input, description: "Minimum quantity per qualifying sale (in quantity_unit) for the agreement discount to apply; > 0" }
      - { name: quantity_unit, type: enum, source: input, description: "UNIT | SQFT | LINEAR_FT", constraints: "UNIT | SQFT | LINEAR_FT" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (exclusive); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | EXPIRED | CANCELLED", constraints: "see state_machines.BulkPurchaseAgreement" }
      - { name: supersedes_agreement_id, type: string, source: input, default: null, description: "FK -> BulkPurchaseAgreement.id; the ACTIVE agreement this one replaces (must belong to same contractor+category)" }
      - { name: fulfilled_quantity, type: number, source: computed, default: 0, description: "Cumulative qualifying quantity sold under this agreement on finalized, non-voided sales" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: sale_channel, type: enum, source: input, description: "WALK_IN | CONTRACTOR_ACCOUNT", constraints: "WALK_IN | CONTRACTOR_ACCOUNT" }
      - { name: contractor_id, type: string, source: input, default: null, description: "FK -> ContractorAccount.id; required iff sale_channel == CONTRACTOR_ACCOUNT" }
      - { name: agreement_id, type: string, source: input, default: null, description: "FK -> BulkPurchaseAgreement.id; optional agreement to apply" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | VOIDED | CANCELLED", constraints: "see state_machines.Sale" }
      - { name: tier_snapshot, type: enum, source: system, default: null, description: "STANDARD | SILVER | GOLD — account discount_tier captured at sale creation; excludes the current sale (pinned evaluation order)", constraints: "STANDARD | SILVER | GOLD | null" }
      - { name: discount_pct_applied, type: number, source: computed, default: 0, description: "max(tier pct, agreement pct when eligible); computed at finalize" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of per-line rounded line_total_cents" }
      - { name: bulk_discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * discount_pct_applied)" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "round_half_up((subtotal_cents - bulk_discount_cents) * SALES_TAX_RATE)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents - bulk_discount_cents + tax_cents" }
      - { name: payment_amount_cents, type: integer, source: system, default: 0, description: "Tendered amount recorded at finalize (walk-in only)" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of finalize" }
      - { name: void_reason, type: string, source: system, default: "", description: "Reason recorded on void" }

  - name: SaleLineItem
    parent: null
    common_fields: false
    fields:
      - { name: sale_id, type: string, source: system, description: "FK -> Sale.id; owning sale" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; the reserved item" }
      - { name: quantity, type: number, source: input, default: null, description: "Purchased quantity; defaults to the item's full measure_qty; partial allowed only when item.measure_unit != UNIT" }
      - { name: unit_price_cents, type: integer, source: system, description: "Item.current_price_cents captured at line-add time" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents * quantity) — per-line rounding happens BEFORE subtotal summation (pinned order)" }

  - name: TaxReceipt
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; copied from the offer" }
      - { name: offer_id, type: string, source: input, description: "FK -> DonationOffer.id; the received offer being receipted" }
      - { name: receipt_number, type: string, source: system, description: "R-<yyyy>-<seq>; seq is the 1-based count of receipts created in the calendar year of the logical clock, in created_at order" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | VOID_REQUESTED | VOIDED | SUPERSEDED", constraints: "see state_machines.TaxReceipt" }
      - { name: valuation_method, type: enum, source: computed, default: null, description: "ESTIMATED_GUIDANCE | QUALIFIED_APPRAISAL — pinned at issue per receipt_final_valuation", constraints: "ESTIMATED_GUIDANCE | QUALIFIED_APPRAISAL | null" }
      - { name: valued_total_cents, type: integer, source: computed, default: 0, description: "Issued value: sum of linked items' list_price_cents, or appraisal_value_cents when QUALIFIED_APPRAISAL" }
      - { name: appraisal_reference, type: string, source: input, default: null, description: "Qualified-appraisal reference; required at issue/amend when valued total >= APPRAISAL_THRESHOLD_CENTS" }
      - { name: appraisal_value_cents, type: integer, source: input, default: null, description: "Appraised value; required together with appraisal_reference" }
      - { name: received_by_user_id, type: string, source: system, description: "Copied from DonationOffer.received_by_user_id at draft creation; segregation-of-duties anchor" }
      - { name: issued_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the IntakeStaff who issued; must differ from received_by_user_id" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of issue" }
      - { name: supersedes_receipt_id, type: string, source: system, default: null, description: "FK -> TaxReceipt.id; receipt this one replaces via amend (self-referential chain)" }
      - { name: void_reason, type: string, source: system, default: "", description: "Reason recorded on request-void" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: crew_type, type: enum, source: input, description: "VOLUNTEER | PAID", constraints: "VOLUNTEER | PAID" }
      - { name: hourly_rate_cents, type: integer, source: input, default: 0, description: "Paid-crew hourly rate; forced to 0 for VOLUNTEER" }
      - { name: hazmat_certified, type: boolean, source: input, default: false, description: "Holds lead/asbestos screening certification" }
      - { name: lead_certified, type: boolean, source: input, default: false, description: "Qualified to lead deconstruction jobs" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "ACTIVE | INACTIVE" }
      - { name: cumulative_job_hours, type: number, source: computed, default: 0, description: "Sum of hours_worked over COMPLETED assignments" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> DeconstructionJob.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: role_on_job, type: enum, source: input, description: "LEAD | WORKER", constraints: "LEAD | WORKER" }
      - { name: start_at, type: datetime, source: input, description: "Assignment window start (inclusive); half-open interval semantics" }
      - { name: end_at, type: datetime, source: input, description: "Assignment window end (exclusive); must be > start_at" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | NO_SHOW | CANCELLED", constraints: "see state_machines.CrewAssignment" }
      - { name: hours_worked, type: number, source: system, default: 0, description: "Hours recorded at completion" }
      - { name: labor_cost_cents, type: integer, source: computed, default: 0, description: "round_half_up(hours_worked * crew.hourly_rate_cents); 0 for VOLUNTEER" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate_code, type: string, source: input, description: "Unique vehicle plate code", constraints: "unique across all vehicles" }
      - { name: capacity_lbs, type: number, source: input, description: "Payload capacity in lbs; > 0" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | IN_MAINTENANCE | RETIRED", constraints: "AVAILABLE | IN_MAINTENANCE | RETIRED" }

  - name: PickupAppointment
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "DONATION_OFFER | DECONSTRUCTION_JOB — polymorphic subject kind", constraints: "DONATION_OFFER | DECONSTRUCTION_JOB" }
      - { name: subject_id, type: string, source: input, description: "FK -> DonationOffer.id when subject_type == DONATION_OFFER; FK -> DeconstructionJob.id when subject_type == DECONSTRUCTION_JOB" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; booked vehicle" }
      - { name: window_start, type: datetime, source: input, description: "Pickup window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Pickup window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | NO_SHOW | CANCELLED", constraints: "see state_machines.PickupAppointment" }
      - { name: fee_cents, type: integer, source: computed, default: 0, description: "PICKUP_FEE_CENTS for DONATION_OFFER subjects whose donor recognition_tier is NONE or SUPPORTER; 0 for BUILDER/CORNERSTONE donors and all DECONSTRUCTION_JOB subjects" }
      - { name: completion_notes, type: string, source: system, default: "", description: "Notes recorded on complete / mark-no-show" }

  - name: DiversionReport
    parent: null
    common_fields: true
    fields:
      - { name: period, type: string, source: input, description: "Reporting period YYYY-MM; unique across all reports", constraints: "unique; format YYYY-MM" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "OPEN | CLOSED" }
      - { name: total_diverted_lbs, type: number, source: computed, default: 0, description: "Running while OPEN; frozen at close per diversion_report_close calculation" }
      - { name: sold_lbs, type: number, source: computed, default: 0, description: "Diverted pounds whose terminal stream is retail sale" }
      - { name: donated_lbs, type: number, source: computed, default: 0, description: "Diverted pounds whose terminal stream is DONATED_OUT" }
      - { name: recycled_lbs, type: number, source: computed, default: 0, description: "Diverted pounds whose terminal stream is RECYCLED" }
      - { name: landfill_lbs, type: number, source: computed, default: 0, description: "Contamination pounds plus DISPOSED_HAZARD batch pounds plus DISPOSED item pounds in period" }
      - { name: closed_by_user_id, type: string, source: system, default: "", description: "X-User-ID of the WarehouseAdmin who closed the period" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of close" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Donor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /reuse/donors/{donorId} with status == INACTIVE"
        actor: IntakeStaff | WarehouseAdmin
        preconditions: ["no DonationOffer of this donor in status OFFERED, UNDER_REVIEW, NEEDS_INFO or ACCEPTED (ERR_INVALID_OFFER_STATE)"]
        side_effects: ["status -> INACTIVE", "version += 1"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /reuse/donors/{donorId} with status == ACTIVE"
        actor: IntakeStaff | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE", "version += 1"]

  - entity: DonationOffer
    initial_state: OFFERED
    terminal_states: [REJECTED, RECEIPTED, CANCELLED]
    transitions:
      - from: OFFERED
        to: UNDER_REVIEW
        trigger: "POST /reuse/donation-offers/{offerId}/review"
        actor: IntakeStaff
        preconditions: ["offer.status == OFFERED (ERR_INVALID_OFFER_STATE)"]
        side_effects: ["status -> UNDER_REVIEW", "version += 1"]
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /reuse/donation-offers/{offerId}/request-info"
        actor: IntakeStaff
        preconditions: ["offer.status == UNDER_REVIEW (ERR_INVALID_OFFER_STATE)"]
        side_effects: ["status -> NEEDS_INFO", "review_notes recorded", "version += 1"]
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /reuse/donation-offers/{offerId}/resubmit"
        actor: Donor | IntakeStaff
        preconditions:
          - "offer.status == NEEDS_INFO (ERR_INVALID_OFFER_STATE)"
          - "Donor actor: offer.donor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["status -> UNDER_REVIEW", "optional field updates applied", "version += 1"]
        note: "cycle UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW is unbounded"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /reuse/donation-offers/{offerId}/accept"
        actor: IntakeStaff
        preconditions:
          - "offer.status == UNDER_REVIEW (ERR_INVALID_OFFER_STATE)"
          - "category.acceptance_status == ACCEPTING (ERR_CATEGORY_NOT_ACCEPTING)"
          - "offer.condition_grade in {A, B, C} (ERR_CONDITION_BELOW_ACCEPTANCE)"
          - "if source_type == DECONSTRUCTION then offer.deconstruction_job_id references a job whose status is not CANCELLED (ERR_JOB_CANCELLED)"
        side_effects:
          - "status -> ACCEPTED"
          - "estimated_value_cents := receipt_guidance_valuation(ESTIMATED_GUIDANCE variant)"
          - "version += 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /reuse/donation-offers/{offerId}/reject"
        actor: IntakeStaff
        preconditions: ["offer.status == UNDER_REVIEW (ERR_INVALID_OFFER_STATE)"]
        side_effects: ["status -> REJECTED", "decision_reason recorded", "version += 1"]
      - from: ACCEPTED
        to: RECEIVED
        trigger: "POST /reuse/donation-offers/{offerId}/receive"
        actor: IntakeStaff
        preconditions:
          - "offer.status == ACCEPTED (ERR_OFFER_NOT_ACCEPTED)"
          - "source_type == PICKUP => exists PickupAppointment with subject_id == offer.id, subject_type == DONATION_OFFER, status == COMPLETED (ERR_OFFER_NOT_RECEIVABLE_SOURCE)"
          - "source_type == DECONSTRUCTION => linked DeconstructionJob.status == COMPLETED (ERR_OFFER_NOT_RECEIVABLE_SOURCE)"
        side_effects:
          - "status -> RECEIVED"
          - "received_by_user_id := X-User-ID of the acting IntakeStaff"
          - "version += 1"
      - from: RECEIVED
        to: RECEIPTED
        trigger: "system — POST /reuse/tax-receipts/{receiptId}/issue on a receipt whose offer_id == this offer"
        actor: system
        preconditions: ["issuing receipt transitions DRAFT -> ISSUED"]
        side_effects: ["status -> RECEIPTED", "final_value_cents := issuing receipt.valued_total_cents", "version += 1"]
      - from: RECEIPTED
        to: RECEIVED
        trigger: "system — POST /reuse/tax-receipts/{receiptId}/confirm-void on the receipt that receipted this offer"
        actor: system
        preconditions: ["confirm-void transitions VOID_REQUESTED -> VOIDED"]
        side_effects: ["status -> RECEIVED", "final_value_cents := 0", "version += 1"]
        note: "revert edge: voiding the only receipt returns the offer to RECEIVED so a corrected receipt may be drafted"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /reuse/donation-offers/{offerId}/cancel"
        actor: Donor | IntakeStaff
        preconditions: ["Donor actor: offer.donor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /reuse/donation-offers/{offerId}/cancel"
        actor: Donor | IntakeStaff
        preconditions: ["Donor actor: offer.donor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: NEEDS_INFO
        to: CANCELLED
        trigger: "POST /reuse/donation-offers/{offerId}/cancel"
        actor: Donor | IntakeStaff
        preconditions: ["Donor actor: offer.donor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /reuse/donation-offers/{offerId}/cancel"
        actor: Donor | IntakeStaff
        preconditions:
          - "Donor actor: offer.donor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
          - "no BOOKED PickupAppointment references this offer (ERR_ACTIVE_APPOINTMENT_EXISTS)"
        side_effects: ["status -> CANCELLED", "version += 1"]

  - entity: DeconstructionJob
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCREENING_PENDING
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/request-screening"
        actor: CrewCoordinator
        preconditions: ["job.status == REQUESTED (ERR_INVALID_JOB_STATE)"]
        side_effects: ["status -> SCREENING_PENDING", "version += 1"]
      - from: SCREENING_PENDING
        to: CLEARED
        trigger: "system — POST /reuse/hazmat-screenings records a screening with outcome == CLEARED"
        actor: system
        preconditions: ["job.status == SCREENING_PENDING"]
        side_effects: ["status -> CLEARED", "clearing_screening_id := new screening.id", "version += 1"]
      - from: SCREENING_PENDING
        to: HAZMAT_HOLD
        trigger: "system — POST /reuse/hazmat-screenings records a screening with outcome == FAILED"
        actor: system
        preconditions: ["job.status == SCREENING_PENDING"]
        side_effects: ["status -> HAZMAT_HOLD", "version += 1"]
      - from: HAZMAT_HOLD
        to: REMEDIATION_IN_PROGRESS
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/begin-remediation"
        actor: CrewCoordinator
        preconditions: ["job.status == HAZMAT_HOLD (ERR_JOB_NOT_IN_HAZMAT_HOLD)"]
        side_effects: ["status -> REMEDIATION_IN_PROGRESS", "version += 1"]
      - from: REMEDIATION_IN_PROGRESS
        to: SCREENING_PENDING
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/complete-remediation"
        actor: CrewCoordinator
        preconditions: ["job.status == REMEDIATION_IN_PROGRESS (ERR_JOB_NOT_REMEDIATING)"]
        side_effects: ["status -> SCREENING_PENDING", "version += 1"]
        note: "cycle SCREENING_PENDING -> HAZMAT_HOLD -> REMEDIATION_IN_PROGRESS -> SCREENING_PENDING is unbounded; each pass increments screening_round"
      - from: IN_PROGRESS
        to: HAZMAT_HOLD
        trigger: "system — POST /reuse/hazmat-screenings records a screening with outcome == FAILED while job IN_PROGRESS (post-hoc discovery)"
        actor: system
        preconditions: ["job.status == IN_PROGRESS"]
        side_effects:
          - "status -> HAZMAT_HOLD"
          - "all SalvageBatches of this job in status WEIGHED -> QUARANTINED; each quarantined batch subtracts its diverted_weight_lbs from job.certified_diverted_weight_lbs (conditional cascade + compensation)"
          - "version += 1"
      - from: CLEARED
        to: SCHEDULED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/schedule"
        actor: CrewCoordinator
        preconditions:
          - "job.status == CLEARED (ERR_JOB_NOT_CLEARED)"
          - "lead_crew_member_id != the performed_by_crew_id of job.clearing_screening_id (ERR_SCREENER_CANNOT_LEAD)"
          - "lead crew member: status == ACTIVE and lead_certified == true (ERR_CERTIFICATION_MISMATCH)"
          - "vehicle.status == AVAILABLE (ERR_VEHICLE_NOT_AVAILABLE)"
          - "scheduled_end > scheduled_start (ERR_INVALID_TIME_WINDOW)"
          - "vehicle has no conflicting occupation: no other SCHEDULED/IN_PROGRESS job on this vehicle with [scheduled_start, scheduled_end) within JOB_VEHICLE_BUFFER_MINUTES of the new window, and no BOOKED PickupAppointment on this vehicle whose [window_start, window_end) fails the same buffer (ERR_VEHICLE_TIME_OVERLAP)"
        side_effects:
          - "status -> SCHEDULED"
          - "lead_crew_member_id, vehicle_id, scheduled_start, scheduled_end assigned"
          - "version += 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/start"
        actor: CrewCoordinator | CrewLead
        preconditions:
          - "job.status == SCHEDULED (ERR_JOB_NOT_SCHEDULED)"
          - "CrewLead actor: X-User-ID == job.lead_crew_member_id (ERR_NOT_RESOURCE_OWNER)"
          - "at least one CrewAssignment with job_id == job.id and status == ASSIGNED exists (ERR_NO_CREW_ASSIGNED)"
        side_effects: ["status -> IN_PROGRESS", "version += 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/complete"
        actor: CrewCoordinator | CrewLead
        preconditions:
          - "job.status == IN_PROGRESS (ERR_JOB_NOT_IN_PROGRESS)"
          - "CrewLead actor: X-User-ID == job.lead_crew_member_id (ERR_NOT_RESOURCE_OWNER)"
          - "no SalvageBatch of this job in status QUARANTINED (ERR_QUARANTINED_BATCHES_OPEN)"
        side_effects:
          - "status -> COMPLETED"
          - "certified_diverted_weight_lbs finalized from WEIGHED/SORTED batches"
          - "version += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: SCREENING_PENDING
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: HAZMAT_HOLD
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: REMEDIATION_IN_PROGRESS
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CANCELLED", "version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "all CrewAssignments with job_id == job.id and status == ASSIGNED -> CANCELLED (cascade down)"
          - "all PickupAppointments with subject_type == DECONSTRUCTION_JOB, subject_id == job.id, status == BOOKED -> CANCELLED (cascade down)"
          - "version += 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /reuse/deconstruction-jobs/{jobId}/cancel"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: ["no SalvageBatch of this job in status WEIGHED or SORTED (ERR_JOB_HAS_WEIGHED_BATCHES)"]
        side_effects:
          - "status -> CANCELLED"
          - "all CrewAssignments with job_id == job.id and status == ASSIGNED -> CANCELLED"
          - "all PickupAppointments with subject_type == DECONSTRUCTION_JOB, subject_id == job.id, status == BOOKED -> CANCELLED"
          - "all SalvageBatches of this job in status MANIFESTED -> DISPOSED_HAZARD with contamination_weight_lbs := estimated_weight_lbs (nothing diverted)"
          - "version += 1"

  - entity: SalvageBatch
    initial_state: MANIFESTED
    terminal_states: [SORTED, DISPOSED_HAZARD]
    transitions:
      - from: MANIFESTED
        to: WEIGHED
        trigger: "POST /reuse/salvage-batches/{batchId}/weigh"
        actor: CrewLead | CrewCoordinator
        preconditions:
          - "batch.status == MANIFESTED (ERR_BATCH_NOT_WEIGHABLE)"
          - "job.status in {IN_PROGRESS, COMPLETED} (ERR_JOB_NOT_IN_PROGRESS)"
          - "scale_weight_lbs > 0 and contamination_weight_lbs >= 0 and contamination_weight_lbs <= scale_weight_lbs (ERR_INVALID_WEIGHTS)"
        side_effects:
          - "status -> WEIGHED"
          - "diverted_weight_lbs := scale_weight_lbs - contamination_weight_lbs"
          - "weighed_at := logical clock; report_period := YYYY-MM(weighed_at)"
          - "job.certified_diverted_weight_lbs += diverted_weight_lbs (ledger sync, hop 2 of weigh cascade)"
          - "OPEN DiversionReport with period == report_period recomputes running totals (hop 3 of weigh cascade)"
          - "version += 1"
      - from: WEIGHED
        to: SORTED
        trigger: "POST /reuse/salvage-batches/{batchId}/mark-sorted"
        actor: IntakeStaff | StoreManager
        preconditions: ["batch.status == WEIGHED (ERR_BATCH_NOT_WEIGHED)"]
        side_effects: ["status -> SORTED", "version += 1"]
      - from: WEIGHED
        to: QUARANTINED
        trigger: "POST /reuse/salvage-batches/{batchId}/quarantine"
        actor: HazmatTechnician | StoreManager | WarehouseAdmin
        preconditions: ["batch.status == WEIGHED (ERR_BATCH_NOT_WEIGHED)"]
        side_effects:
          - "status -> QUARANTINED"
          - "job.certified_diverted_weight_lbs -= diverted_weight_lbs (compensation)"
          - "OPEN DiversionReport with period == report_period recomputes running totals excluding this batch"
          - "version += 1"
      - from: QUARANTINED
        to: WEIGHED
        trigger: "POST /reuse/salvage-batches/{batchId}/resolve-quarantine with outcome == REMEDIATED"
        actor: HazmatTechnician | StoreManager | WarehouseAdmin
        preconditions: ["batch.status == QUARANTINED (ERR_BATCH_NOT_QUARANTINED)"]
        side_effects:
          - "status -> WEIGHED"
          - "if new_scale_weight_lbs provided: scale_weight_lbs := new_scale_weight_lbs and diverted_weight_lbs recomputed"
          - "job.certified_diverted_weight_lbs += diverted_weight_lbs (re-credit)"
          - "OPEN DiversionReport with period == report_period recomputes including this batch"
          - "version += 1"
        note: "cycle WEIGHED -> QUARANTINED -> WEIGHED is unbounded"
      - from: QUARANTINED
        to: DISPOSED_HAZARD
        trigger: "POST /reuse/salvage-batches/{batchId}/resolve-quarantine with outcome == DISPOSE_HAZARD"
        actor: HazmatTechnician | StoreManager | WarehouseAdmin
        preconditions: ["batch.status == QUARANTINED (ERR_BATCH_NOT_QUARANTINED)"]
        side_effects:
          - "status -> DISPOSED_HAZARD"
          - "diverted_weight_lbs := 0 (permanently excluded from diversion)"
          - "scale_weight_lbs routes to landfill accounting of the period report"
          - "version += 1"

  - entity: Item
    initial_state: "pricing_status: UNPRICED; sales_status: BACKROOM"
    terminal_states: ["sales_status: SOLD (reversible via sale void)", "sales_status: DONATED_OUT", "sales_status: RECYCLED", "sales_status: DISPOSED"]
    transitions:
      - from: "pricing_status == UNPRICED"
        to: "pricing_status == PRICED"
        trigger: "POST /reuse/items/{itemId}/price"
        actor: StoreManager
        preconditions: ["item.pricing_status == UNPRICED (ERR_ITEM_NOT_UNPRICED)"]
        side_effects:
          - "list_price_cents := item_list_price(item) or price_override_cents when provided"
          - "current_price_cents := list_price_cents; markdown_step := 0; disposition_recommended := NONE"
          - "priced_by_user_id := X-User-ID"
          - "version += 1"
        note: "parallel dimension 1; independent of sales_status"
      - from: "sales_status == BACKROOM"
        to: "sales_status == ON_FLOOR"
        trigger: "POST /reuse/items/{itemId}/place"
        actor: StoreManager
        preconditions:
          - "item.sales_status == BACKROOM (ERR_ITEM_NOT_BACKROOM)"
          - "item.pricing_status == PRICED (ERR_ITEM_NOT_PRICED)"
          - "zone.status == OPEN (ERR_ZONE_NOT_OPEN)"
          - "zone.allowed_category_id is null or == item.category_id (ERR_ZONE_CATEGORY_MISMATCH)"
          - "zone.current_count < zone.capacity (ERR_ZONE_AT_CAPACITY)"
        side_effects:
          - "sales_status -> ON_FLOOR; zone_id := zone; floor_since := logical clock"
          - "zone.current_count += 1; zone.restock_recommended recomputed"
          - "version += 1 (item and zone)"
      - from: "sales_status == ON_FLOOR"
        to: "sales_status == BACKROOM"
        trigger: "POST /reuse/items/{itemId}/unplace"
        actor: StoreManager
        preconditions: ["item.sales_status == ON_FLOOR (ERR_ITEM_NOT_ON_FLOOR)"]
        side_effects:
          - "sales_status -> BACKROOM; zone_id := null; floor_since := null"
          - "zone.current_count -= 1; zone.restock_recommended recomputed"
          - "version += 1 (item and zone)"
      - from: "sales_status == ON_FLOOR"
        to: "sales_status == RESERVED"
        trigger: "system — POST /reuse/sales/{saleId}/lines adds this item"
        actor: system
        preconditions: ["item.sales_status == ON_FLOOR (ERR_ITEM_NOT_AVAILABLE)", "sale.status == OPEN"]
        side_effects: ["sales_status -> RESERVED", "version += 1"]
      - from: "sales_status == RESERVED"
        to: "sales_status == ON_FLOOR"
        trigger: "system — DELETE /reuse/sale-lines/{lineId} or POST /reuse/sales/{saleId}/cancel"
        actor: system
        preconditions: ["sale.status == OPEN"]
        side_effects: ["sales_status -> ON_FLOOR (zone_id retained)", "version += 1"]
      - from: "sales_status == RESERVED"
        to: "sales_status == SOLD"
        trigger: "system — POST /reuse/sales/{saleId}/finalize"
        actor: system
        preconditions: ["sale finalize succeeds"]
        side_effects:
          - "sales_status -> SOLD; sold_via_sale_id := sale.id; zone_id := null; floor_since := null"
          - "former zone.current_count -= 1; zone.restock_recommended recomputed (cascade hop 2)"
          - "version += 1 (item and zone)"
      - from: "sales_status == SOLD"
        to: "sales_status == ON_FLOOR"
        trigger: "system — POST /reuse/sales/{saleId}/void"
        actor: system
        preconditions: ["sale void succeeds", "item.sold_via_sale_id == voided sale.id"]
        side_effects:
          - "sales_status -> ON_FLOOR; zone_id := the zone the item occupied when reserved; floor_since := void clock time"
          - "zone.current_count += 1; zone.restock_recommended recomputed (compensating invariant: finalize+void leaves zone occupancy unchanged)"
          - "version += 1 (item and zone)"
      - from: "sales_status == BACKROOM"
        to: "sales_status == DONATED_OUT | RECYCLED | DISPOSED"
        trigger: "POST /reuse/items/{itemId}/dispose"
        actor: StoreManager | WarehouseAdmin
        preconditions: ["item.sales_status == BACKROOM (ERR_ITEM_NOT_BACKROOM)"]
        side_effects: ["sales_status -> disposition enum (DONATE->DONATED_OUT, RECYCLE->RECYCLED, DISPOSE->DISPOSED)", "version += 1"]
      - from: "sales_status == ON_FLOOR"
        to: "sales_status == DONATED_OUT | RECYCLED | DISPOSED"
        trigger: "POST /reuse/items/{itemId}/dispose"
        actor: StoreManager | WarehouseAdmin
        preconditions: ["item.sales_status == ON_FLOOR (ERR_ITEM_NOT_ON_FLOOR)"]
        side_effects:
          - "sales_status -> disposition enum; zone_id := null"
          - "zone.current_count -= 1; zone.restock_recommended recomputed"
          - "version += 1 (item and zone)"

  - entity: StoreZone
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /reuse/store-zones/{zoneId} with status == CLOSED"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> CLOSED", "version += 1", "note: resident items are not evicted; placement is blocked while CLOSED"]
      - from: CLOSED
        to: OPEN
        trigger: "PATCH /reuse/store-zones/{zoneId} with status == OPEN"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> OPEN", "version += 1"]

  - entity: Category
    initial_state: ACCEPTING
    terminal_states: [RETIRED]
    transitions:
      - from: ACCEPTING
        to: PAUSED
        trigger: "PATCH /reuse/categories/{categoryId} with acceptance_status == PAUSED"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["acceptance_status -> PAUSED", "version += 1"]
      - from: PAUSED
        to: ACCEPTING
        trigger: "PATCH /reuse/categories/{categoryId} with acceptance_status == ACCEPTING"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["acceptance_status -> ACCEPTING", "version += 1"]
      - from: ACCEPTING
        to: RETIRED
        trigger: "PATCH /reuse/categories/{categoryId} with acceptance_status == RETIRED"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["acceptance_status -> RETIRED", "version += 1", "existing items continue their lifecycle; new offers/items rejected"]
      - from: PAUSED
        to: RETIRED
        trigger: "PATCH /reuse/categories/{categoryId} with acceptance_status == RETIRED"
        actor: StoreManager | WarehouseAdmin
        preconditions: []
        side_effects: ["acceptance_status -> RETIRED", "version += 1"]

  - entity: ContractorAccount
    initial_state: PENDING_APPROVAL
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /reuse/contractor-accounts/{accountId}/approve"
        actor: WarehouseAdmin
        preconditions: ["account.status == PENDING_APPROVAL (ERR_INVALID_ACCOUNT_STATE)"]
        side_effects: ["status -> ACTIVE", "approved_by_user_id := X-User-ID", "version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /reuse/contractor-accounts/{accountId}/suspend"
        actor: WarehouseAdmin
        preconditions: ["account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"]
        side_effects:
          - "status -> SUSPENDED; suspension_reason recorded"
          - "all BulkPurchaseAgreements with contractor_id == account.id and status == ACTIVE -> CANCELLED (cascade down)"
          - "version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — POST /reuse/sales/{saleId}/finalize pushes outstanding_balance_cents above credit_limit_cents"
        actor: system
        preconditions: ["account.status == ACTIVE", "post-finalize outstanding_balance_cents > credit_limit_cents"]
        side_effects:
          - "status -> SUSPENDED; suspension_reason := 'CREDIT_LIMIT_BREACH'"
          - "all BulkPurchaseAgreements with contractor_id == account.id and status == ACTIVE -> CANCELLED (cascade hop 3 of finalize chain)"
          - "version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /reuse/contractor-accounts/{accountId}/reinstate"
        actor: WarehouseAdmin
        preconditions:
          - "account.status == SUSPENDED (ERR_INVALID_ACCOUNT_STATE)"
          - "outstanding_balance_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects: ["status -> ACTIVE", "suspension_reason := ''", "version += 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /reuse/contractor-accounts/{accountId}/close"
        actor: WarehouseAdmin
        preconditions: ["outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE_NONZERO)"]
        side_effects:
          - "status -> CLOSED"
          - "all BulkPurchaseAgreements with contractor_id == account.id and status == ACTIVE -> CANCELLED"
          - "version += 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /reuse/contractor-accounts/{accountId}/close"
        actor: WarehouseAdmin
        preconditions: ["outstanding_balance_cents == 0 (ERR_OUTSTANDING_BALANCE_NONZERO)"]
        side_effects: ["status -> CLOSED", "version += 1"]

  - entity: BulkPurchaseAgreement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /reuse/bulk-agreements with supersedes_agreement_id == this agreement"
        actor: system
        preconditions: ["create-agreement OCC check passes on the parent ContractorAccount"]
        side_effects: ["status -> SUPERSEDED", "version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — logical clock advances past valid_until; evaluated on any read/use of the agreement"
        actor: system
        preconditions: ["clock >= valid_until"]
        side_effects: ["status -> EXPIRED", "version += 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /reuse/bulk-agreements/{agreementId}/cancel or account suspension/closure cascade"
        actor: WarehouseAdmin | system
        preconditions: ["agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"]
        side_effects: ["status -> CANCELLED", "version += 1"]

  - entity: Sale
    initial_state: OPEN
    terminal_states: [FINALIZED, VOIDED, CANCELLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /reuse/sales/{saleId}/finalize"
        actor: Cashier | StoreManager | Contractor
        preconditions:
          - "sale.status == OPEN (ERR_SALE_NOT_OPEN)"
          - "Contractor actor: sale.contractor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
          - "at least one SaleLineItem exists for the sale (ERR_EMPTY_SALE)"
          - "sale_channel == CONTRACTOR_ACCOUNT => account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "sale_channel == CONTRACTOR_ACCOUNT => credit gate: if credit_limit_cents == 0 and outstanding_balance_cents + total_cents > 0, reject (ERR_CREDIT_LIMIT_EXCEEDED); with credit_limit_cents > 0 the finalize posts and a resulting balance above the limit triggers the auto-suspend cascade instead of a rejection"
          - "sale_channel == WALK_IN => payment_amount_cents >= total_cents (ERR_PAYMENT_INSUFFICIENT)"
          - "agreement_id set => agreement.status == ACTIVE and valid_from <= clock < valid_until (ERR_AGREEMENT_NOT_IN_WINDOW)"
        side_effects:
          - "status -> FINALIZED; totals computed per sale_totals; finalized_at := clock"
          - "each line item: Item RESERVED -> SOLD (hop 1); each sold item's zone.current_count -= 1 and restock_recommended recomputed (hop 2)"
          - "CONTRACTOR_ACCOUNT: outstanding_balance_cents += total_cents; trailing_volume_cents += total_cents; discount_tier recomputed (hop 2)"
          - "if post-finalize outstanding_balance_cents > credit_limit_cents: account ACTIVE -> SUSPENDED with reason CREDIT_LIMIT_BREACH (hop 3) and its ACTIVE agreements -> CANCELLED (hop 4)"
          - "agreement_id set and qualifying: agreement.fulfilled_quantity += sum of qualifying line quantities"
          - "WALK_IN channel: OPEN DiversionReport for the finalize period recomputes walk-in sold_lbs"
          - "version += 1 (sale and account)"
      - from: FINALIZED
        to: VOIDED
        trigger: "POST /reuse/sales/{saleId}/void"
        actor: StoreManager | WarehouseAdmin
        preconditions: ["sale.status == FINALIZED (ERR_SALE_NOT_FINALIZED)"]
        side_effects:
          - "status -> VOIDED; void_reason recorded"
          - "each line item with sales_status == SOLD: -> ON_FLOOR, restored to its pre-reservation zone (hop 1); zone.current_count += 1 and restock_recommended recomputed (hop 2) — finalize+void leaves zone occupancy unchanged (compensating invariant)"
          - "CONTRACTOR_ACCOUNT: outstanding_balance_cents -= total_cents; trailing_volume_cents -= total_cents; discount_tier recomputed — finalize+void leaves outstanding_balance_cents unchanged (compensating invariant)"
          - "agreement fulfilled_quantity decremented by the qualifying quantities of this sale"
          - "version += 1 (sale and account)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /reuse/sales/{saleId}/cancel"
        actor: Cashier | StoreManager | Contractor
        preconditions:
          - "sale.status == OPEN (ERR_SALE_NOT_OPEN)"
          - "Contractor actor: sale.contractor_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status -> CANCELLED"
          - "each line item: Item RESERVED -> ON_FLOOR (un-reserve cascade)"
          - "version += 1"

  - entity: TaxReceipt
    initial_state: DRAFT
    terminal_states: [VOIDED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /reuse/tax-receipts/{receiptId}/issue"
        actor: IntakeStaff
        preconditions:
          - "receipt.status == DRAFT (ERR_RECEIPT_NOT_DRAFT)"
          - "offer.status == RECEIVED (ERR_INVALID_OFFER_STATE)"
          - "X-User-ID != receipt.received_by_user_id (ERR_RECEIPT_ISSUER_IS_RECEIVER)"
          - "valued total >= APPRAISAL_THRESHOLD_CENTS OR category.requires_appraisal_review => appraisal_reference and appraisal_value_cents provided (ERR_APPRAISAL_REQUIRED)"
        side_effects:
          - "status -> ISSUED; issued_by_user_id := X-User-ID; issued_at := clock"
          - "valuation_method and valued_total_cents pinned per receipt_final_valuation"
          - "offer RECEIVED -> RECEIPTED; offer.final_value_cents := valued_total_cents (cross-entity)"
          - "donor.trailing_receipt_value_cents recomputed; donor.recognition_tier recomputed (cascade hop 2)"
          - "version += 1 (receipt, offer, donor)"
      - from: ISSUED
        to: VOID_REQUESTED
        trigger: "POST /reuse/tax-receipts/{receiptId}/request-void"
        actor: IntakeStaff
        preconditions: ["receipt.status == ISSUED (ERR_RECEIPT_NOT_ISSUED)"]
        side_effects: ["status -> VOID_REQUESTED", "void_reason recorded", "version += 1"]
      - from: VOID_REQUESTED
        to: VOIDED
        trigger: "POST /reuse/tax-receipts/{receiptId}/confirm-void"
        actor: WarehouseAdmin
        preconditions: ["receipt.status == VOID_REQUESTED (ERR_RECEIPT_NOT_VOID_REQUESTED)"]
        side_effects:
          - "status -> VOIDED"
          - "offer RECEIPTED -> RECEIVED (revert); offer.final_value_cents := 0"
          - "donor.trailing_receipt_value_cents recomputed; donor.recognition_tier recomputed"
          - "version += 1 (receipt, offer, donor)"
      - from: VOID_REQUESTED
        to: ISSUED
        trigger: "POST /reuse/tax-receipts/{receiptId}/reject-void"
        actor: WarehouseAdmin
        preconditions: ["receipt.status == VOID_REQUESTED (ERR_RECEIPT_NOT_VOID_REQUESTED)"]
        side_effects: ["status -> ISSUED", "void_reason := ''", "version += 1"]
        note: "revert edge: ISSUED -> VOID_REQUESTED -> ISSUED restores the pre-request state exactly"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /reuse/tax-receipts/{receiptId}/amend"
        actor: IntakeStaff
        preconditions:
          - "receipt.status == ISSUED (ERR_RECEIPT_NOT_ISSUED)"
          - "OCC: expected_receipt_version == receipt.version (ERR_STALE_RECEIPT_VERSION)"
          - "X-User-ID != receipt.received_by_user_id (ERR_RECEIPT_ISSUER_IS_RECEIVER)"
        side_effects:
          - "this receipt -> SUPERSEDED; version += 1 (bumps the amended receipt's version)"
          - "new TaxReceipt created directly in ISSUED with supersedes_receipt_id := this receipt.id, fresh appraisal inputs applied, valued per receipt_final_valuation"
          - "donor.trailing_receipt_value_cents recomputed over the replacement chain; donor.recognition_tier recomputed"

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /reuse/crew-assignments/{assignmentId}/complete"
        actor: CrewCoordinator
        preconditions: ["assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ACTIVE)"]
        side_effects:
          - "status -> COMPLETED; hours_worked recorded; labor_cost_cents computed per crew_labor_cost"
          - "crew.cumulative_job_hours += hours_worked (ledger sync)"
          - "job.actual_fee_cents recomputed (quoted + paid-labor overage) (cascade hop 2)"
          - "version += 1 (assignment, crew, job)"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /reuse/crew-assignments/{assignmentId}/mark-no-show"
        actor: CrewCoordinator
        preconditions: ["assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ACTIVE)"]
        side_effects: ["status -> NO_SHOW", "version += 1"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /reuse/crew-assignments/{assignmentId}/cancel or job cancel cascade"
        actor: CrewCoordinator | system
        preconditions: ["assignment.status == ASSIGNED (ERR_ASSIGNMENT_NOT_ACTIVE)"]
        side_effects: ["status -> CANCELLED", "version += 1"]

  - entity: PickupAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /reuse/pickup-appointments/{appointmentId}/complete"
        actor: CrewCoordinator | IntakeStaff
        preconditions: ["appointment.status == BOOKED (ERR_APPOINTMENT_NOT_BOOKED)"]
        side_effects: ["status -> COMPLETED", "completion_notes recorded", "version += 1"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /reuse/pickup-appointments/{appointmentId}/mark-no-show"
        actor: CrewCoordinator | IntakeStaff
        preconditions: ["appointment.status == BOOKED (ERR_APPOINTMENT_NOT_BOOKED)"]
        side_effects: ["status -> NO_SHOW", "version += 1"]
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reuse/pickup-appointments/{appointmentId}/cancel or job cancel cascade"
        actor: CrewCoordinator | IntakeStaff | system
        preconditions: ["appointment.status == BOOKED (ERR_APPOINTMENT_NOT_BOOKED)"]
        side_effects: ["status -> CANCELLED", "version += 1"]

  - entity: DiversionReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /reuse/diversion-reports/{reportId}/close"
        actor: WarehouseAdmin
        preconditions:
          - "report.status == OPEN (ERR_REPORT_NOT_OPEN)"
          - "no SalvageBatch in status MANIFESTED anywhere (unweighed material has no report_period yet and cannot be attributed) (ERR_UNWEIGHED_BATCHES_IN_PERIOD)"
          - "no SalvageBatch with report_period == report.period in status QUARANTINED (ERR_QUARANTINED_BATCHES_OPEN)"
        side_effects:
          - "status -> CLOSED; closed_at := clock; closed_by_user_id := X-User-ID"
          - "total_diverted_lbs, sold_lbs, donated_lbs, recycled_lbs, landfill_lbs frozen per diversion_report_close (ops-run checkpoint; CLOSED reports never recompute)"
          - "version += 1"

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "PATCH /reuse/vehicles/{vehicleId} with status == IN_MAINTENANCE"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: ["no BOOKED PickupAppointment on this vehicle (ERR_ACTIVE_APPOINTMENT_EXISTS)"]
        side_effects: ["status -> IN_MAINTENANCE", "version += 1"]
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "PATCH /reuse/vehicles/{vehicleId} with status == AVAILABLE"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> AVAILABLE", "version += 1"]
      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "PATCH /reuse/vehicles/{vehicleId} with status == RETIRED"
        actor: CrewCoordinator | WarehouseAdmin
        preconditions: []
        side_effects: ["status -> RETIRED", "version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: bulk-agreement-create-stale-account
    parent_entity: ContractorAccount
    write_endpoint: "POST /reuse/bulk-agreements"
    occ_field: expected_account_version
    description: |
      Creating a BulkPurchaseAgreement against a ContractorAccount whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just created an agreement for the same
      contractor+category (which legitimately supersedes the prior ACTIVE
      agreement) or otherwise mutated the account, making the current writer's
      view stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
  - rule_id: receipt-amend-stale-version
    parent_entity: TaxReceipt
    write_endpoint: "POST /reuse/tax-receipts/{receiptId}/amend"
    occ_field: expected_receipt_version
    description: |
      Amending a TaxReceipt whose version has advanced since the client last
      observed it is rejected. A successful amendment supersedes the receipt and
      bumps its version; a client carrying a pre-amendment version therefore
      holds a stale view and its amendment is rejected with 412.
    error_id: ERR_STALE_RECEIPT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: item_list_price
    trigger: "POST /reuse/items/{itemId}/price"
    algorithm: tiered_pricing
    formula: |
      if price_override_cents is provided (> 0):
        list_price_cents = price_override_cents
      else:
        base = match category.pricing_model:
          FLAT        -> category.base_rate_cents
          PER_UNIT    -> category.base_rate_cents * item.measure_qty
          PER_SQFT    -> category.base_rate_cents * item.measure_qty
          PER_LINEAR_FT -> category.base_rate_cents * item.measure_qty
        condition_mult = match item.condition_grade:  A -> 1.00 | B -> 0.75 | C -> 0.50 | D -> 0.25
        hazmat_handling = 1.15 if (category.hazmat_risk_flag or item.pre_1978_flag) else 1.00
        list_price_cents = max(MIN_LIST_PRICE_CENTS,
                               round_half_up(base * condition_mult * hazmat_handling))
      current_price_cents = list_price_cents; markdown_step = 0; disposition_recommended = NONE
    input_set: "the single Item being priced + its Category"
    constants:
      MIN_LIST_PRICE_CENTS: 100
    precision: "integer cents, round_half_up"
    note: "Rule-2 mode (a): >=3 inputs (pricing_model, base_rate, measure_qty, condition_grade, hazmat exposure) with non-linear interaction (branch selection + multiplicative stack + max-clamp)"

  - name: markdown_price
    trigger: "POST /reuse/markdown-runs (sweep evaluates every Item with pricing_status == PRICED and sales_status == ON_FLOOR)"
    algorithm: decay_function
    formula: |
      eligible(item) := item.pricing_status == PRICED
                        and item.sales_status == ON_FLOOR
                        and item.disposition_recommended == NONE
                        and item.days_on_floor >= category.markdown_after_days
                                                   + item.markdown_step * category.markdown_interval_days
      for each eligible item (ascending floor_since, tie-break created_at ASC):
        if item.markdown_step < category.max_markdown_steps:
          item.markdown_step += 1
          step_price = round_half_up(item.list_price_cents * (1 - category.markdown_step_pct) ^ item.markdown_step)
          floor_price = round_half_up(item.list_price_cents * category.floor_price_pct)
          item.current_price_cents = max(floor_price, step_price)
        else:
          item.disposition_recommended = category.slow_item_disposition   (DONATE->DONATE etc.)
      run.items_evaluated / items_marked_down / items_flagged_disposition counted accordingly
    input_set: "Items pricing_status == PRICED AND sales_status == ON_FLOOR at sweep time; eligibility uses >= (an item with days_on_floor exactly == threshold IS eligible)"
    constants: {}
    precision: "integer cents, round_half_up; step exponent applied to the LIST price, not to the previous current price"
    variants:
      - name: boundary_day_included
        when: "item.days_on_floor == markdown_after_days + markdown_step * markdown_interval_days exactly"
        difference: "inclusive >= — the item is marked down on the boundary day, not the day after"

  - name: sale_totals
    trigger: "POST /reuse/sales/{saleId}/finalize"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED (nested rounding — mode (b)):
      1. per line: line_total_cents = round_half_up(unit_price_cents * quantity)     [per-line rounding FIRST]
      2. subtotal_cents = sum(line_total_cents over all lines)
      3. discount_pct_applied = contractor_discount_pct(sale)                         [see rule; tier snapshot excludes this sale]
      4. bulk_discount_cents = round_half_up(subtotal_cents * discount_pct_applied)   [round AFTER discount]
      5. tax_cents = round_half_up((subtotal_cents - bulk_discount_cents) * SALES_TAX_RATE)
      6. total_cents = subtotal_cents - bulk_discount_cents + tax_cents
      "sum-then-round" at step 1 is FORBIDDEN; any other order is non-conformant.
    input_set: "all SaleLineItems of the sale (lines are immutable once the sale is OPEN -> lines added/removed only while OPEN)"
    constants:
      SALES_TAX_RATE: 0.07
    precision: "integer cents, round_half_up at steps 1, 4, 5"

  - name: contractor_discount_pct
    trigger: "POST /reuse/sales/{saleId}/finalize (and tier_snapshot capture at POST /reuse/sales)"
    algorithm: threshold
    formula: |
      Pinned evaluation order (circular-looking dependency — mode (c)):
      1. trailing_basis = account.trailing_volume_cents EXCLUDING the current sale
         (the snapshot Sale.tier_snapshot was captured at sale creation from this basis;
         finalize MUST use sale.tier_snapshot, not a freshly recomputed tier)
      2. tier_pct = match sale.tier_snapshot: STANDARD -> 0.00 | SILVER -> 0.05 | GOLD -> 0.10
      3. agreement_pct = sale.agreement.discount_pct IF all of:
           sale.agreement_id is set; agreement.status == ACTIVE;
           agreement.valid_from <= clock < agreement.valid_until;
           sum of the sale's line quantities for items whose category_id == agreement.category_id
             >= agreement.min_quantity
         ELSE 0
      4. discount_pct_applied = max(tier_pct, agreement_pct)
      Tier thresholds (>= inclusive): trailing_basis >= GOLD_VOLUME_CENTS -> GOLD;
        trailing_basis >= SILVER_VOLUME_CENTS -> SILVER; else STANDARD.
      Tier recomputation from a finalized/voided sale applies only to FUTURE sales'
      snapshots; the current sale's discount never re-derives from its own total.
    input_set: "sale's account trailing volume at creation; the referenced agreement"
    constants:
      SILVER_VOLUME_CENTS: 2500000
      GOLD_VOLUME_CENTS: 10000000
      SILVER_PCT: 0.05
      GOLD_PCT: 0.10
    precision: "fractional percents exact; currency at integer cents"

  - name: trailing_volume_cents
    trigger: "sale finalize (add), sale void (subtract)"
    algorithm: aggregation
    formula: |
      account.trailing_volume_cents = sum(total_cents) over Sale where
        sale.contractor_id == account.id
        and sale.status == FINALIZED
        and sale.finalized_at in [clock - 365 days, clock]   (both bounds inclusive)
      discount_tier re-derives from this value on every change (>= thresholds, inclusive).
    input_set: "FINALIZED sales of the account in the inclusive trailing-365d window"
    precision: "integer cents"

  - name: receipt_guidance_valuation
    trigger: "POST /reuse/donation-offers/{offerId}/accept (ESTIMATED_GUIDANCE provisional variant)"
    algorithm: forward_looking
    formula: |
      ESTIMATED_GUIDANCE (provisional, at accept):
        base = match category.pricing_model:
          FLAT -> category.base_rate_cents
          _    -> category.base_rate_cents * offer.estimated_quantity
        condition_mult = A -> 1.00 | B -> 0.75 | C -> 0.50 | D -> 0.25
        offer.estimated_value_cents = round_half_up(base * condition_mult * THRIFT_VALUE_PCT)
    input_set: "the offer + its Category"
    constants:
      THRIFT_VALUE_PCT: 0.30
    precision: "integer cents, round_half_up"
    variants:
      - name: ESTIMATED_GUIDANCE
        when: "offer acceptance (provisional guidance for the donor)"
        difference: "uses offer.estimated_quantity and thrift-value percentage; ignores per-item pricing"
      - name: QUALIFIED_APPRAISAL
        when: "receipt issue/amend when valued total >= APPRAISAL_THRESHOLD_CENTS or category.requires_appraisal_review"
        difference: "valued_total_cents := appraisal_value_cents verbatim, ignoring the item-sum entirely — same items, different number"

  - name: receipt_final_valuation
    trigger: "POST /reuse/tax-receipts/{receiptId}/issue and /amend"
    algorithm: aggregation
    formula: |
      item_sum = sum(list_price_cents) over Items with offer_id == receipt.offer_id
                 and pricing_status == PRICED
                 and sales_status in {BACKROOM, ON_FLOOR, RESERVED, SOLD}
      if item_sum >= APPRAISAL_THRESHOLD_CENTS or offer.category.requires_appraisal_review:
        valuation_method = QUALIFIED_APPRAISAL
        require appraisal_reference and appraisal_value_cents (else ERR_APPRAISAL_REQUIRED)
        valued_total_cents = appraisal_value_cents
      else:
        valuation_method = ESTIMATED_GUIDANCE
        valued_total_cents = item_sum
      Boundary: item_sum exactly == APPRAISAL_THRESHOLD_CENTS triggers QUALIFIED_APPRAISAL (>= inclusive).
    input_set: "items linked to the offer in the listed statuses (DISPOSED/DONATED_OUT/RECYCLED excluded — goods that left the stream pre-receipt cannot be valued)"
    constants:
      APPRAISAL_THRESHOLD_CENTS: 500000
    precision: "integer cents"
    variants:
      - name: item_sum_path
        when: "below threshold and no appraisal-review category"
        difference: "valued from live item pricing"
      - name: appraisal_path
        when: "threshold crossed or appraisal-review category"
        difference: "valued verbatim from the appraisal, diverging from the item sum for identical items"

  - name: job_tonnage_estimates
    trigger: "SalvageBatch create (estimate +=) / weigh (certified +=) / quarantine (certified -=) / resolve-quarantine (certified += or stays 0) / job cancel (both frozen)"
    algorithm: aggregation
    formula: |
      ESTIMATED variant:  job.estimated_diverted_weight_lbs =
        sum(estimated_weight_lbs) over batches of the job with status in
        {MANIFESTED, WEIGHED, QUARANTINED, SORTED}   (DISPOSED_HAZARD excluded)
      CERTIFIED variant:  job.certified_diverted_weight_lbs =
        sum(diverted_weight_lbs) over batches of the job with status in {WEIGHED, SORTED}
        and category.divertible == true
      Same job, same batches: the two variants diverge whenever estimates differ from
      scale weights or contamination exists.
    input_set: "SalvageBatches of the job, status-filtered per variant"
    precision: "1 decimal pound"

  - name: diversion_report_close
    trigger: "POST /reuse/diversion-reports/{reportId}/close (also running recompute while OPEN on batch weigh/quarantine/resolve and item disposition)"
    algorithm: aggregation
    formula: |
      For period P (YYYY-MM) — batch stream:
        batch_diverted = sum(diverted_weight_lbs) over SalvageBatch with report_period == P,
                         status in {WEIGHED, SORTED}, category.divertible == true
        batch_landfill = sum(contamination_weight_lbs) over batches with report_period == P,
                         status in {WEIGHED, SORTED}
                       + sum(scale_weight_lbs) over batches with report_period == P,
                         status == DISPOSED_HAZARD
      Walk-in stream (batch_id == null items only — batch items MUST NOT be double counted):
        item weight basis w(item) = item.estimated_weight_lbs
        window: item reached its terminal sales_status within period P
          (SOLD: sale.finalized_at in P; DONATED_OUT/RECYCLED/DISPOSED: disposition date in P)
        sold_lbs     = batch_diverted_sold_share + sum(w) over walk-in items SOLD in P with category.divertible
        donated_lbs  = sum(w) over walk-in items DONATED_OUT in P with category.divertible
        recycled_lbs = sum(w) over walk-in items RECYCLED in P with category.divertible
        landfill_lbs = batch_landfill + sum(w) over walk-in items DISPOSED in P
      Batch-stream diversion is reported in bulk under sold_lbs' batch share:
        batch_diverted_sold_share = batch_diverted   (reuse-store convention: certified salvage
        tonnage is credited to the retail stream until items prove otherwise)
      total_diverted_lbs = sold_lbs + donated_lbs + recycled_lbs
      CLOSED reports are frozen: later batch/item mutations in period P do NOT change a CLOSED report.
    input_set: "batches by report_period; walk-in items by terminal-state date; CLOSED freeze"
    precision: "1 decimal pound"

  - name: crew_labor_cost
    trigger: "POST /reuse/crew-assignments/{assignmentId}/complete"
    algorithm: aggregation
    formula: |
      assignment.labor_cost_cents =
        0                                              if crew.crew_type == VOLUNTEER
        round_half_up(hours_worked * hourly_rate_cents) if crew.crew_type == PAID
      crew.cumulative_job_hours += hours_worked
      job.actual_fee_cents = job.quoted_fee_cents
        + max(0, sum(labor_cost_cents over COMPLETED paid assignments of the job)
                 - job.included_labor_cents)
    input_set: "the completed assignment; the job's COMPLETED paid CrewAssignments"
    precision: "integer cents, round_half_up"

  - name: crew_overlap_check
    trigger: "POST /reuse/crew-assignments"
    algorithm: interval_merge
    formula: |
      Half-open interval semantics [start_at, end_at) on the SAME crew_member_id:
        reject iff exists non-CANCELLED assignment a with a.crew_member_id == new.crew_member_id
          and a.start_at < new.end_at and a.end_at > new.start_at
      Adjacent windows are LEGAL: a.end_at == new.start_at does not overlap (no buffer).
    input_set: "crew member's assignments in status ASSIGNED or COMPLETED (NO_SHOW/CANCELLED excluded)"
    constants: {}
    precision: "datetime, half-open"

  - name: vehicle_buffered_overlap_check
    trigger: "POST /reuse/pickup-appointments and POST /reuse/deconstruction-jobs/{jobId}/schedule"
    algorithm: interval_merge
    formula: |
      Buffered semantics on the SAME vehicle_id — occupations are appointments (BOOKED)
      and jobs (SCHEDULED, IN_PROGRESS):
        new window [s, e) conflicts with existing occupation [s2, e2) UNLESS
          e + buffer <= s2  OR  s >= e2 + buffer        where buffer = PICKUP_BUFFER_MINUTES
      i.e. touching windows WITHOUT the 60-minute gap are REJECTED (differs from the
      half-open crew rule where touching is legal).
    input_set: "BOOKED PickupAppointments and SCHEDULED/IN_PROGRESS DeconstructionJobs on the vehicle"
    constants:
      PICKUP_BUFFER_MINUTES: 60
    precision: "datetime"

  - name: pickup_fee
    trigger: "POST /reuse/pickup-appointments"
    algorithm: threshold
    formula: |
      if subject_type == DECONSTRUCTION_JOB: fee_cents = 0
      else (DONATION_OFFER subject):
        tier = offer.donor.recognition_tier at booking time
        fee_cents = 0 if tier in {BUILDER, CORNERSTONE} else PICKUP_FEE_CENTS
    input_set: "subject offer's donor tier at booking time"
    constants:
      PICKUP_FEE_CENTS: 5000
    precision: "integer cents"

  - name: donor_recognition_tier
    trigger: "receipt issue / confirm-void / amend (any change to the donor's ISSUED-or-SUPERSEDED receipt set)"
    algorithm: threshold
    formula: |
      donor.trailing_receipt_value_cents = sum(valued_total_cents) over TaxReceipt where
        receipt.donor_id == donor.id
        and receipt.status in {ISSUED, SUPERSEDED}   (VOIDED excluded; DRAFT/VOID_REQUESTED excluded)
        and receipt.issued_at in [clock - 365 days, clock]  (both bounds inclusive)
      recognition_tier =
        CORNERSTONE if trailing >= CORNERSTONE_VALUE_CENTS
        BUILDER     if trailing >= BUILDER_VALUE_CENTS
        SUPPORTER   if trailing >= SUPPORTER_VALUE_CENTS
        NONE        otherwise
      For a SUPERSEDED receipt, only the newest receipt in its supersedes chain contributes
      (the superseding receipt shares the chain; counting both would double count).
    input_set: "donor's receipts, status-filtered, window-filtered"
    constants:
      SUPPORTER_VALUE_CENTS: 50000
      BUILDER_VALUE_CENTS: 250000
      CORNERSTONE_VALUE_CENTS: 1000000
    precision: "integer cents; >= inclusive thresholds"

  - name: zone_occupancy
    trigger: "item place / unplace / dispose-from-floor / sale finalize (per line) / sale void (per line)"
    algorithm: aggregation
    formula: |
      zone.current_count = count(Items with zone_id == zone.id
                             and sales_status in {ON_FLOOR, RESERVED})
      zone.restock_recommended = (zone.current_count <= zone.restock_threshold)
      INVARIANT (compensating): finalize followed by void returns every affected
      zone.current_count to its pre-finalize value; place followed by unplace likewise.
    input_set: "resident items in the two floor statuses"
    precision: "integer count; boundary: place rejected when current_count == capacity (>= full)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Donor may only touch own offers/receipts (donor_id == X-User-ID); Contractor only own account/sales/agreements (contractor_id == X-User-ID); HazmatTechnician records screenings only as performed_by_crew_id == X-User-ID; CrewLead acts only on jobs where lead_crew_member_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right (offerId before jobId etc.)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body-referenced FK ids exist (donor_id, category_id, item_id, zone_id, contractor_id, agreement_id, job_id, crew_member_id, vehicle_id, subject_id per subject_type, screening_id, offer_id, batch_id, supersedes_agreement_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with body FKs"
  - priority: 6
    category: state
    check: "OCC: expected_account_version == account.version (POST /reuse/bulk-agreements); expected_receipt_version == receipt.version (POST /reuse/tax-receipts/{receiptId}/amend)"
    error_id: "ERR_STALE_ACCOUNT_VERSION | ERR_STALE_RECEIPT_VERSION"
    http_status: 412
    applies_to: "POST /reuse/bulk-agreements, POST /reuse/tax-receipts/{receiptId}/amend"
  - priority: 7
    category: state
    check: "Target resource is in the required from-state for the requested transition (per-entity state errors: ERR_INVALID_OFFER_STATE, ERR_OFFER_NOT_ACCEPTED, ERR_INVALID_JOB_STATE, ERR_JOB_NOT_CLEARED, ERR_JOB_NOT_SCHEDULED, ERR_JOB_NOT_IN_PROGRESS, ERR_JOB_NOT_IN_HAZMAT_HOLD, ERR_JOB_NOT_REMEDIATING, ERR_BATCH_NOT_WEIGHABLE, ERR_BATCH_NOT_WEIGHED, ERR_BATCH_NOT_QUARANTINED, ERR_ITEM_NOT_UNPRICED, ERR_ITEM_NOT_PRICED, ERR_ITEM_NOT_BACKROOM, ERR_ITEM_NOT_ON_FLOOR, ERR_ITEM_NOT_AVAILABLE, ERR_SALE_NOT_OPEN, ERR_SALE_NOT_FINALIZED, ERR_INVALID_ACCOUNT_STATE, ERR_ACCOUNT_NOT_ACTIVE, ERR_AGREEMENT_NOT_ACTIVE, ERR_RECEIPT_NOT_DRAFT, ERR_RECEIPT_NOT_ISSUED, ERR_RECEIPT_NOT_VOID_REQUESTED, ERR_ZONE_NOT_OPEN, ERR_REPORT_NOT_OPEN, ERR_ASSIGNMENT_NOT_ACTIVE, ERR_APPOINTMENT_NOT_BOOKED, ERR_VEHICLE_NOT_AVAILABLE, ERR_INVALID_BATCH_STATE)"
    error_id: "per-entity state error ids (see §1.6)"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "Hazmat & segregation-of-duties: item intake with hazmat exposure (category.hazmat_risk_flag or pre_1978_flag) and no batch_id requires a screening_id whose outcome == CLEARED (ERR_HAZMAT_SCREENING_REQUIRED); job complete forbidden while QUARANTINED batches exist (ERR_QUARANTINED_BATCHES_OPEN); schedule lead != clearing screener (ERR_SCREENER_CANNOT_LEAD); receipt issuer != offer receiver (ERR_RECEIPT_ISSUER_IS_RECEIVER)"
    error_id: "ERR_HAZMAT_SCREENING_REQUIRED | ERR_QUARANTINED_BATCHES_OPEN | ERR_SCREENER_CANNOT_LEAD | ERR_RECEIPT_ISSUER_IS_RECEIVER"
    http_status: 422
    applies_to: "POST /reuse/items, POST /reuse/deconstruction-jobs/{jobId}/complete, POST /reuse/deconstruction-jobs/{jobId}/schedule, POST /reuse/tax-receipts/{receiptId}/issue, POST /reuse/tax-receipts/{receiptId}/amend"
  - priority: 9
    category: business_constraint
    check: "Uniqueness (category code, zone code, vehicle plate -> ERR_DUPLICATE_CODE; report period -> ERR_DUPLICATE_REPORT_PERIOD); crew half-open overlap (ERR_CREW_TIME_OVERLAP); vehicle buffered overlap (ERR_VEHICLE_TIME_OVERLAP); zone capacity (ERR_ZONE_AT_CAPACITY); zone category match (ERR_ZONE_CATEGORY_MISMATCH); capacity patch below occupancy (ERR_CAPACITY_BELOW_OCCUPANCY); certifications (lead_certified for job lead, hazmat_certified for screening technician -> ERR_CERTIFICATION_MISMATCH); offer acceptance criteria grade (ERR_CONDITION_BELOW_ACCEPTANCE); offer cancel with booked appointment (ERR_ACTIVE_APPOINTMENT_EXISTS); job cancel with weighed batches (ERR_JOB_HAS_WEIGHED_BATCHES)"
    error_id: "ERR_DUPLICATE_CODE | ERR_DUPLICATE_REPORT_PERIOD | ERR_CREW_TIME_OVERLAP | ERR_VEHICLE_TIME_OVERLAP | ERR_ZONE_AT_CAPACITY | ERR_ZONE_CATEGORY_MISMATCH | ERR_CAPACITY_BELOW_OCCUPANCY | ERR_CERTIFICATION_MISMATCH | ERR_CONDITION_BELOW_ACCEPTANCE | ERR_ACTIVE_APPOINTMENT_EXISTS | ERR_JOB_HAS_WEIGHED_BATCHES"
    http_status: 409
    applies_to: "create/transition endpoints as listed in §1.6 conditions"
  - priority: 10
    category: business_temporal
    check: "Window arithmetic: end strictly after start (ERR_INVALID_TIME_WINDOW); assignment window contained in job scheduled window (ERR_ASSIGNMENT_OUTSIDE_JOB_WINDOW); agreement use requires valid_from <= clock < valid_until (ERR_AGREEMENT_NOT_IN_WINDOW); split quantity 0 < split_qty < measure_qty (ERR_SPLIT_INVALID_QUANTITY)"
    error_id: "ERR_INVALID_TIME_WINDOW | ERR_ASSIGNMENT_OUTSIDE_JOB_WINDOW | ERR_AGREEMENT_NOT_IN_WINDOW | ERR_SPLIT_INVALID_QUANTITY"
    http_status: 400
    applies_to: "schedule, assignment create, appointment create, agreement create/use, item split"
  - priority: 11
    category: business_fiscal
    check: "Zero-credit breach at finalize (ERR_CREDIT_LIMIT_EXCEEDED); walk-in payment >= total (ERR_PAYMENT_INSUFFICIENT); payment amount <= outstanding (ERR_OVERPAYMENT); account close requires zero balance (ERR_OUTSTANDING_BALANCE_NONZERO); reinstate requires balance <= limit (ERR_CREDIT_LIMIT_EXCEEDED); receipt issue/amend at/above appraisal threshold requires appraisal fields (ERR_APPRAISAL_REQUIRED)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_PAYMENT_INSUFFICIENT | ERR_OVERPAYMENT | ERR_OUTSTANDING_BALANCE_NONZERO | ERR_APPRAISAL_REQUIRED"
    http_status: 402
    applies_to: "sale finalize, account payments/close/reinstate, receipt issue/amend"
  - priority: 12
    category: business_referential
    check: "One non-terminal (DRAFT/ISSUED/VOID_REQUESTED) receipt per offer (ERR_ACTIVE_RECEIPT_EXISTS); receipt create requires offer.status == RECEIVED and item create with offer_id requires offer.status == RECEIVED (ERR_INVALID_OFFER_STATE); item.category_id must equal offer.category_id when offer_id set (ERR_CATEGORY_MISMATCH); item.batch category must equal item.category_id when batch_id set (ERR_CATEGORY_MISMATCH); DECONSTRUCTION offer requires deconstruction_job_id and job not CANCELLED (ERR_JOB_CANCELLED); supersedes_agreement_id must reference an ACTIVE agreement of the same contractor+category (ERR_AGREEMENT_NOT_ACTIVE)"
    error_id: "ERR_ACTIVE_RECEIPT_EXISTS | ERR_INVALID_OFFER_STATE | ERR_CATEGORY_MISMATCH | ERR_JOB_CANCELLED | ERR_AGREEMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "receipt create, item create, offer create/accept, agreement create"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (donor/contractor/technician/lead mismatch)" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, unknown enum member, non-positive quantity" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "end <= start (or valid_until <= valid_from) on any windowed create" }
  # --- Not found (one per entity with path/body references) ---
  - { id: ERR_DONOR_NOT_FOUND, http: 404, condition: "donor id does not exist" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "category id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "donation offer id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "deconstruction job id does not exist" }
  - { id: ERR_SCREENING_NOT_FOUND, http: 404, condition: "hazmat screening id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "salvage batch id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "item id does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "store zone id does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "markdown run id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "contractor account id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "bulk purchase agreement id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "sale id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "sale line id does not exist" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "tax receipt id does not exist" }
  - { id: ERR_CREW_MEMBER_NOT_FOUND, http: 404, condition: "crew member id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "crew assignment id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "pickup appointment id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "diversion report id does not exist" }
  # --- State (per entity) ---
  - { id: ERR_INVALID_OFFER_STATE, http: 409, condition: "Offer transition attempted from a state where it is not defined" }
  - { id: ERR_OFFER_NOT_ACCEPTED, http: 409, condition: "receive requires offer.status == ACCEPTED" }
  - { id: ERR_OFFER_NOT_RECEIVABLE_SOURCE, http: 409, condition: "PICKUP offer lacks a COMPLETED appointment / DECONSTRUCTION offer's job is not COMPLETED" }
  - { id: ERR_INVALID_JOB_STATE, http: 409, condition: "Job transition attempted from a state where it is not defined" }
  - { id: ERR_JOB_NOT_CLEARED, http: 409, condition: "schedule requires job.status == CLEARED" }
  - { id: ERR_JOB_NOT_SCHEDULED, http: 409, condition: "start requires job.status == SCHEDULED" }
  - { id: ERR_JOB_NOT_IN_PROGRESS, http: 409, condition: "complete (or batch weigh) requires job.status == IN_PROGRESS (batch weigh also allows COMPLETED)" }
  - { id: ERR_JOB_NOT_IN_HAZMAT_HOLD, http: 409, condition: "begin-remediation requires job.status == HAZMAT_HOLD" }
  - { id: ERR_JOB_NOT_REMEDIATING, http: 409, condition: "complete-remediation requires job.status == REMEDIATION_IN_PROGRESS" }
  - { id: ERR_BATCH_NOT_WEIGHABLE, http: 409, condition: "weigh requires batch.status == MANIFESTED" }
  - { id: ERR_BATCH_NOT_WEIGHED, http: 409, condition: "quarantine / mark-sorted require batch.status == WEIGHED" }
  - { id: ERR_BATCH_NOT_QUARANTINED, http: 409, condition: "resolve-quarantine requires batch.status == QUARANTINED" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "item intake from a batch requires batch.status in {WEIGHED, SORTED}; batch create requires job SCHEDULED/IN_PROGRESS covered by ERR_INVALID_JOB_STATE" }
  - { id: ERR_ITEM_NOT_UNPRICED, http: 409, condition: "price requires pricing_status == UNPRICED" }
  - { id: ERR_ITEM_NOT_PRICED, http: 409, condition: "place requires pricing_status == PRICED" }
  - { id: ERR_ITEM_NOT_BACKROOM, http: 409, condition: "place / split / dispose-from-backroom require sales_status == BACKROOM" }
  - { id: ERR_ITEM_NOT_ON_FLOOR, http: 409, condition: "unplace / dispose-from-floor require sales_status == ON_FLOOR" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "sale line add requires item.sales_status == ON_FLOOR" }
  - { id: ERR_SALE_NOT_OPEN, http: 409, condition: "line add/remove, finalize, cancel require sale.status == OPEN" }
  - { id: ERR_SALE_NOT_FINALIZED, http: 409, condition: "void requires sale.status == FINALIZED" }
  - { id: ERR_EMPTY_SALE, http: 409, condition: "finalize requires at least one SaleLineItem" }
  - { id: ERR_INVALID_ACCOUNT_STATE, http: 409, condition: "approve/reinstate attempted from a state where it is not defined" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "operation requires account.status == ACTIVE (suspend, contractor sale open/finalize)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "agreement is not ACTIVE (cancel, supersede reference, sale attachment at open)" }
  - { id: ERR_RECEIPT_NOT_DRAFT, http: 409, condition: "issue requires receipt.status == DRAFT" }
  - { id: ERR_RECEIPT_NOT_ISSUED, http: 409, condition: "request-void / amend require receipt.status == ISSUED" }
  - { id: ERR_RECEIPT_NOT_VOID_REQUESTED, http: 409, condition: "confirm-void / reject-void require receipt.status == VOID_REQUESTED" }
  - { id: ERR_ZONE_NOT_OPEN, http: 409, condition: "place requires zone.status == OPEN" }
  - { id: ERR_REPORT_NOT_OPEN, http: 409, condition: "close requires report.status == OPEN" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "complete / cancel / mark-no-show require assignment.status == ASSIGNED" }
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "complete / cancel / mark-no-show require appointment.status == BOOKED" }
  - { id: ERR_VEHICLE_NOT_AVAILABLE, http: 409, condition: "schedule requires vehicle.status == AVAILABLE" }
  # --- Business safety ---
  - { id: ERR_HAZMAT_SCREENING_REQUIRED, http: 422, condition: "Item with hazmat exposure (risk category or pre_1978) and no batch screening inheritance lacks screening_id with outcome == CLEARED" }
  - { id: ERR_QUARANTINED_BATCHES_OPEN, http: 422, condition: "Job complete attempted while its batches are QUARANTINED, or report close attempted while period batches are QUARANTINED" }
  - { id: ERR_SCREENER_CANNOT_LEAD, http: 403, condition: "Segregation of duties: scheduled lead_crew_member_id equals the clearing screening's performed_by_crew_id" }
  - { id: ERR_RECEIPT_ISSUER_IS_RECEIVER, http: 403, condition: "Segregation of duties: issuing IntakeStaff X-User-ID equals offer.received_by_user_id" }
  # --- Business constraint ---
  - { id: ERR_CATEGORY_NOT_ACCEPTING, http: 409, condition: "Category acceptance_status != ACCEPTING at offer-accept or item-create" }
  - { id: ERR_CONDITION_BELOW_ACCEPTANCE, http: 422, condition: "Offer condition_grade == D fails acceptance criteria" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Category code / zone code / vehicle plate already exists" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "A DiversionReport already exists for period" }
  - { id: ERR_CREW_TIME_OVERLAP, http: 409, condition: "Half-open overlap with an existing ASSIGNED/COMPLETED assignment of the same crew member" }
  - { id: ERR_VEHICLE_TIME_OVERLAP, http: 409, condition: "Vehicle occupation within the 60-minute buffer of another job/appointment occupation" }
  - { id: ERR_ZONE_AT_CAPACITY, http: 409, condition: "place attempted when zone.current_count == zone.capacity (>= full)" }
  - { id: ERR_ZONE_CATEGORY_MISMATCH, http: 409, condition: "zone.allowed_category_id set and differs from item.category_id" }
  - { id: ERR_CAPACITY_BELOW_OCCUPANCY, http: 409, condition: "PATCH zone capacity < current_count" }
  - { id: ERR_CERTIFICATION_MISMATCH, http: 422, condition: "Job lead lacks lead_certified, or screening technician lacks hazmat_certified" }
  - { id: ERR_ACTIVE_APPOINTMENT_EXISTS, http: 409, condition: "Cancel/maintenance attempted while a BOOKED appointment references the offer or vehicle" }
  - { id: ERR_JOB_HAS_WEIGHED_BATCHES, http: 409, condition: "IN_PROGRESS job cancel attempted with WEIGHED/SORTED batches present" }
  - { id: ERR_NO_CREW_ASSIGNED, http: 409, condition: "Job start attempted with no ASSIGNED CrewAssignment" }
  # --- Business temporal ---
  - { id: ERR_ASSIGNMENT_OUTSIDE_JOB_WINDOW, http: 422, condition: "Assignment [start_at, end_at) not contained in job [scheduled_start, scheduled_end)" }
  - { id: ERR_AGREEMENT_NOT_IN_WINDOW, http: 422, condition: "Agreement attached or applied while clock outside [valid_from, valid_until)" }
  - { id: ERR_SPLIT_INVALID_QUANTITY, http: 422, condition: "split_qty <= 0 or >= item.measure_qty, or split of a UNIT-measured item" }
  # --- Business fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Finalize would breach a zero credit limit, or reinstate attempted while balance > limit" }
  - { id: ERR_PAYMENT_INSUFFICIENT, http: 402, condition: "WALK_IN finalize with payment_amount_cents < total_cents" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "Payment amount_cents > outstanding_balance_cents" }
  - { id: ERR_OUTSTANDING_BALANCE_NONZERO, http: 402, condition: "Account close with outstanding_balance_cents != 0" }
  - { id: ERR_APPRAISAL_REQUIRED, http: 422, condition: "Receipt issue/amend at valued total >= 500000 cents (or appraisal-review category) without appraisal_reference + appraisal_value_cents" }
  # --- Business referential ---
  - { id: ERR_ACTIVE_RECEIPT_EXISTS, http: 409, condition: "A non-terminal receipt (DRAFT/ISSUED/VOID_REQUESTED) already exists for the offer" }
  - { id: ERR_CATEGORY_MISMATCH, http: 422, condition: "Item category differs from the linked offer's or batch's category" }
  - { id: ERR_JOB_CANCELLED, http: 409, condition: "DECONSTRUCTION offer references a CANCELLED job (accept) or job id missing at create" }
  # --- OCC ---
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version != account.version on POST /reuse/bulk-agreements" }
  - { id: ERR_STALE_RECEIPT_VERSION, http: 412, condition: "expected_receipt_version != receipt.version on POST /reuse/tax-receipts/{receiptId}/amend" }

# =============================================================================
# §1.5 API Endpoint Table (flat; all paths under /reuse)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/reuse/_clock/set_current_utc"
    description: "Advance the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All days_on_floor, trailing windows, and report periods read this clock."
    roles: [WarehouseAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["BulkPurchaseAgreement EXPIRED transitions are evaluated lazily against this clock on read/use"]

  # --- Donors ---
  - method: POST
    path: "/reuse/donors"
    description: "Register a donor"
    roles: [IntakeStaff, WarehouseAdmin]
    code: 201
    input: [full_name, donor_type, email, "phone?", address_text]
    output: Donor
    side_effects: ["status ACTIVE; recognition_tier NONE; trailing_receipt_value_cents 0"]
  - method: GET
    path: "/reuse/donors"
    description: "List donors"
    roles: [IntakeStaff, WarehouseAdmin, StoreManager, CrewCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "recognition_tier?"]
    output: "Donor[]"
    side_effects: []
  - method: GET
    path: "/reuse/donors/{donorId}"
    description: "Get one donor (Donor role restricted to own record)"
    roles: [IntakeStaff, WarehouseAdmin, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: PATCH
    path: "/reuse/donors/{donorId}"
    description: "Update donor (activate/deactivate, contact details)"
    roles: [IntakeStaff, WarehouseAdmin]
    code: 200
    input: ["status?", "full_name?", "email?", "phone?", "address_text?"]
    output: Donor
    side_effects: ["status transitions ACTIVE <-> INACTIVE per state_machines.Donor"]

  # --- Categories ---
  - method: POST
    path: "/reuse/categories"
    description: "Create a category (acceptance + pricing + markdown policy)"
    roles: [StoreManager, WarehouseAdmin]
    code: 201
    input: [code, display_name, pricing_model, base_rate_cents, hazmat_risk_flag, "requires_appraisal_review?", markdown_after_days, markdown_step_pct, markdown_interval_days, max_markdown_steps, floor_price_pct, "divertible?", target_turn_days, "slow_item_disposition?"]
    output: Category
    side_effects: ["acceptance_status ACCEPTING"]
  - method: GET
    path: "/reuse/categories"
    description: "List categories"
    roles: [StoreManager, WarehouseAdmin, IntakeStaff, Cashier, Contractor, CrewCoordinator]
    code: 200
    input: ["limit?", "offset?", "acceptance_status?"]
    output: "Category[]"
    side_effects: []
  - method: GET
    path: "/reuse/categories/{categoryId}"
    description: "Get one category"
    roles: [StoreManager, WarehouseAdmin, IntakeStaff, Cashier, Contractor, CrewCoordinator]
    code: 200
    input: []
    output: Category
    side_effects: []
  - method: PATCH
    path: "/reuse/categories/{categoryId}"
    description: "Update category policy / acceptance status (ACCEPTING <-> PAUSED, -> RETIRED)"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: ["acceptance_status?", "base_rate_cents?", "markdown_after_days?", "markdown_step_pct?", "markdown_interval_days?", "max_markdown_steps?", "floor_price_pct?", "target_turn_days?", "slow_item_disposition?", "hazmat_risk_flag?"]
    output: Category
    side_effects: ["acceptance_status transitions per state_machines.Category"]

  # --- Donation offers ---
  - method: POST
    path: "/reuse/donation-offers"
    description: "Create a donation offer (Donor role: donor_id must equal X-User-ID)"
    roles: [Donor, IntakeStaff]
    code: 201
    input: [donor_id, source_type, category_id, description_text, estimated_quantity, quantity_unit, condition_grade, pre_1978_flag, "deconstruction_job_id?"]
    output: DonationOffer
    side_effects: ["status OFFERED"]
  - method: GET
    path: "/reuse/donation-offers"
    description: "List offers (Donor role sees own only)"
    roles: [IntakeStaff, StoreManager, WarehouseAdmin, Donor]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "status?", "category_id?", "deconstruction_job_id?"]
    output: "DonationOffer[]"
    side_effects: []
  - method: GET
    path: "/reuse/donation-offers/{offerId}"
    description: "Get one offer (Donor role: own only)"
    roles: [IntakeStaff, StoreManager, WarehouseAdmin, Donor]
    code: 200
    input: []
    output: DonationOffer
    side_effects: []
  - method: POST
    path: "/reuse/donation-offers/{offerId}/review"
    description: "OFFERED -> UNDER_REVIEW"
    roles: [IntakeStaff]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/request-info"
    description: "UNDER_REVIEW -> NEEDS_INFO"
    roles: [IntakeStaff]
    code: 200
    input: [review_notes]
    output: DonationOffer
    side_effects: ["status -> NEEDS_INFO"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/resubmit"
    description: "NEEDS_INFO -> UNDER_REVIEW (donor revision cycle)"
    roles: [Donor, IntakeStaff]
    code: 200
    input: ["description_text?", "estimated_quantity?", "condition_grade?"]
    output: DonationOffer
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/accept"
    description: "UNDER_REVIEW -> ACCEPTED; computes estimated_value_cents (guidance valuation)"
    roles: [IntakeStaff]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["status -> ACCEPTED", "estimated_value_cents := receipt_guidance_valuation ESTIMATED_GUIDANCE"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/reject"
    description: "UNDER_REVIEW -> REJECTED"
    roles: [IntakeStaff]
    code: 200
    input: [decision_reason]
    output: DonationOffer
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/receive"
    description: "ACCEPTED -> RECEIVED; records received_by_user_id (SoD anchor)"
    roles: [IntakeStaff]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["status -> RECEIVED", "received_by_user_id := X-User-ID"]
  - method: POST
    path: "/reuse/donation-offers/{offerId}/cancel"
    description: "OFFERED/UNDER_REVIEW/NEEDS_INFO/ACCEPTED -> CANCELLED"
    roles: [Donor, IntakeStaff]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["status -> CANCELLED"]

  # --- Deconstruction jobs ---
  - method: POST
    path: "/reuse/deconstruction-jobs"
    description: "Create a deconstruction job"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 201
    input: [title, site_address_text, "donor_id?", quoted_fee_cents, "included_labor_cents?"]
    output: DeconstructionJob
    side_effects: ["status REQUESTED"]
  - method: GET
    path: "/reuse/deconstruction-jobs"
    description: "List jobs"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician, IntakeStaff]
    code: 200
    input: ["limit?", "offset?", "status?", "donor_id?", "lead_crew_member_id?", "vehicle_id?", "clearing_screening_id?"]
    output: "DeconstructionJob[]"
    side_effects: []
  - method: GET
    path: "/reuse/deconstruction-jobs/{jobId}"
    description: "Get one job"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician, IntakeStaff]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: []
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/request-screening"
    description: "REQUESTED -> SCREENING_PENDING"
    roles: [CrewCoordinator]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> SCREENING_PENDING"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/schedule"
    description: "CLEARED -> SCHEDULED; assigns lead + vehicle + window (buffered vehicle overlap; SoD screener!=lead)"
    roles: [CrewCoordinator]
    code: 200
    input: [lead_crew_member_id, vehicle_id, scheduled_start, scheduled_end]
    output: DeconstructionJob
    side_effects: ["status -> SCHEDULED", "lead/vehicle/window assigned"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/start"
    description: "SCHEDULED -> IN_PROGRESS (requires an ASSIGNED crew assignment)"
    roles: [CrewCoordinator, CrewLead]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/complete"
    description: "IN_PROGRESS -> COMPLETED (blocked while QUARANTINED batches exist)"
    roles: [CrewCoordinator, CrewLead]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/begin-remediation"
    description: "HAZMAT_HOLD -> REMEDIATION_IN_PROGRESS"
    roles: [CrewCoordinator]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> REMEDIATION_IN_PROGRESS"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/complete-remediation"
    description: "REMEDIATION_IN_PROGRESS -> SCREENING_PENDING (re-screening cycle)"
    roles: [CrewCoordinator]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> SCREENING_PENDING"]
  - method: POST
    path: "/reuse/deconstruction-jobs/{jobId}/cancel"
    description: "Non-terminal -> CANCELLED; cascades to assignments, appointments, manifested batches"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 200
    input: []
    output: DeconstructionJob
    side_effects: ["status -> CANCELLED", "ASSIGNED assignments -> CANCELLED", "BOOKED appointments -> CANCELLED", "MANIFESTED batches -> DISPOSED_HAZARD (from IN_PROGRESS only)"]

  # --- Hazmat screenings ---
  - method: POST
    path: "/reuse/hazmat-screenings"
    description: "Record a screening (technician self; requires hazmat_certified). Drives job CLEARED / HAZMAT_HOLD transitions."
    roles: [HazmatTechnician]
    code: 201
    input: [job_id, lead_result, asbestos_result, "notes?"]
    output: HazmatScreening
    side_effects: ["performed_by_crew_id := X-User-ID", "screening_round assigned", "outcome computed", "job SCREENING_PENDING -> CLEARED | HAZMAT_HOLD; job IN_PROGRESS + FAILED -> HAZMAT_HOLD with batch quarantine cascade"]
  - method: GET
    path: "/reuse/hazmat-screenings"
    description: "List screenings"
    roles: [HazmatTechnician, CrewCoordinator, WarehouseAdmin, IntakeStaff, StoreManager]
    code: 200
    input: ["limit?", "offset?", "job_id?", "performed_by_crew_id?", "outcome?"]
    output: "HazmatScreening[]"
    side_effects: []
  - method: GET
    path: "/reuse/hazmat-screenings/{screeningId}"
    description: "Get one screening"
    roles: [HazmatTechnician, CrewCoordinator, WarehouseAdmin, IntakeStaff, StoreManager]
    code: 200
    input: []
    output: HazmatScreening
    side_effects: []

  # --- Salvage batches ---
  - method: POST
    path: "/reuse/salvage-batches"
    description: "Manifest a salvage batch under a job (job must be IN_PROGRESS or SCHEDULED)"
    roles: [CrewLead, CrewCoordinator]
    code: 201
    input: [job_id, "offer_id?", category_id, estimated_weight_lbs]
    output: SalvageBatch
    side_effects: ["status MANIFESTED", "job.estimated_diverted_weight_lbs += estimated_weight_lbs"]
  - method: GET
    path: "/reuse/salvage-batches"
    description: "List batches"
    roles: [CrewLead, CrewCoordinator, IntakeStaff, StoreManager, WarehouseAdmin]
    code: 200
    input: ["limit?", "offset?", "job_id?", "offer_id?", "category_id?", "status?", "report_period?"]
    output: "SalvageBatch[]"
    side_effects: []
  - method: GET
    path: "/reuse/salvage-batches/{batchId}"
    description: "Get one batch"
    roles: [CrewLead, CrewCoordinator, IntakeStaff, StoreManager, WarehouseAdmin]
    code: 200
    input: []
    output: SalvageBatch
    side_effects: []
  - method: POST
    path: "/reuse/salvage-batches/{batchId}/weigh"
    description: "MANIFESTED -> WEIGHED; computes diverted weight; cascades to job certified total and OPEN period report"
    roles: [CrewLead, CrewCoordinator]
    code: 200
    input: [scale_weight_lbs, "contamination_weight_lbs?"]
    output: SalvageBatch
    side_effects: ["status -> WEIGHED", "diverted_weight_lbs computed", "report_period stamped", "job.certified_diverted_weight_lbs += diverted", "OPEN DiversionReport running totals recompute"]
  - method: POST
    path: "/reuse/salvage-batches/{batchId}/quarantine"
    description: "WEIGHED -> QUARANTINED (post-hoc hazmat discovery); compensated out of certified totals"
    roles: [HazmatTechnician, StoreManager, WarehouseAdmin]
    code: 200
    input: ["notes?"]
    output: SalvageBatch
    side_effects: ["status -> QUARANTINED", "job.certified_diverted_weight_lbs -= diverted", "OPEN report excludes batch"]
  - method: POST
    path: "/reuse/salvage-batches/{batchId}/resolve-quarantine"
    description: "QUARANTINED -> WEIGHED (REMEDIATED) or -> DISPOSED_HAZARD"
    roles: [HazmatTechnician, StoreManager, WarehouseAdmin]
    code: 200
    input: [outcome, "new_scale_weight_lbs?"]
    output: SalvageBatch
    side_effects: ["status per outcome", "certified totals re-credited on REMEDIATED", "DISPOSED_HAZARD routes weight to landfill"]
  - method: POST
    path: "/reuse/salvage-batches/{batchId}/mark-sorted"
    description: "WEIGHED -> SORTED (all material processed into items)"
    roles: [IntakeStaff, StoreManager]
    code: 200
    input: []
    output: SalvageBatch
    side_effects: ["status -> SORTED"]

  # --- Items ---
  - method: POST
    path: "/reuse/items"
    description: "Intake an item (walk-in offer, batch, or unlinked stock)"
    roles: [IntakeStaff]
    code: 201
    input: [category_id, description_text, condition_grade, measure_qty, measure_unit, pre_1978_flag, estimated_weight_lbs, "offer_id?", "batch_id?", "screening_id?"]
    output: Item
    side_effects: ["pricing_status UNPRICED; sales_status BACKROOM"]
  - method: GET
    path: "/reuse/items"
    description: "List/search items (slow_only=true filters days_on_floor >= category.target_turn_days)"
    roles: [IntakeStaff, StoreManager, Cashier, WarehouseAdmin, Contractor]
    code: 200
    input: ["limit?", "offset?", "category_id?", "batch_id?", "offer_id?", "zone_id?", "sold_via_sale_id?", "parent_item_id?", "screening_id?", "sales_status?", "pricing_status?", "slow_only?"]
    output: "Item[]"
    side_effects: []
  - method: GET
    path: "/reuse/items/{itemId}"
    description: "Get one item"
    roles: [IntakeStaff, StoreManager, Cashier, WarehouseAdmin, Contractor]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: POST
    path: "/reuse/items/{itemId}/price"
    description: "UNPRICED -> PRICED; runs item_list_price or applies manager override"
    roles: [StoreManager]
    code: 200
    input: ["price_override_cents?"]
    output: Item
    side_effects: ["list_price_cents and current_price_cents set", "markdown_step 0", "disposition_recommended NONE"]
  - method: POST
    path: "/reuse/items/{itemId}/place"
    description: "BACKROOM -> ON_FLOOR into a zone (capacity/category/open checks)"
    roles: [StoreManager]
    code: 200
    input: [zone_id]
    output: Item
    side_effects: ["sales_status -> ON_FLOOR", "zone.current_count += 1", "floor_since := clock"]
  - method: POST
    path: "/reuse/items/{itemId}/unplace"
    description: "ON_FLOOR -> BACKROOM"
    roles: [StoreManager]
    code: 200
    input: []
    output: Item
    side_effects: ["sales_status -> BACKROOM", "zone.current_count -= 1"]
  - method: POST
    path: "/reuse/items/{itemId}/dispose"
    description: "BACKROOM|ON_FLOOR -> DONATED_OUT | RECYCLED | DISPOSED"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: [disposition]
    output: Item
    side_effects: ["sales_status -> disposition terminal", "zone.current_count -= 1 when ON_FLOOR", "OPEN period report walk-in stream recompute"]
  - method: POST
    path: "/reuse/items/{itemId}/split"
    description: "Split a measured item: remainder child created (parent_item_id); parent reverts to UNPRICED"
    roles: [IntakeStaff, StoreManager]
    code: 201
    input: [split_qty]
    output: Item
    side_effects: ["parent.measure_qty -= split_qty; parent.pricing_status -> UNPRICED", "new Item created with measure_qty = split_qty, parent_item_id = parent.id"]

  # --- Store zones ---
  - method: POST
    path: "/reuse/store-zones"
    description: "Create a store zone"
    roles: [StoreManager, WarehouseAdmin]
    code: 201
    input: [code, display_name, capacity, "allowed_category_id?", "restock_threshold?"]
    output: StoreZone
    side_effects: ["status OPEN; current_count 0"]
  - method: GET
    path: "/reuse/store-zones"
    description: "List zones"
    roles: [StoreManager, IntakeStaff, Cashier, WarehouseAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "allowed_category_id?"]
    output: "StoreZone[]"
    side_effects: []
  - method: GET
    path: "/reuse/store-zones/{zoneId}"
    description: "Get one zone"
    roles: [StoreManager, IntakeStaff, Cashier, WarehouseAdmin]
    code: 200
    input: []
    output: StoreZone
    side_effects: []
  - method: PATCH
    path: "/reuse/store-zones/{zoneId}"
    description: "Update zone (OPEN <-> CLOSED, capacity with occupancy floor)"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: ["status?", "capacity?", "restock_threshold?", "allowed_category_id?"]
    output: StoreZone
    side_effects: ["status toggle per state_machines.StoreZone"]

  # --- Markdown runs (merchandising ops-run) ---
  - method: POST
    path: "/reuse/markdown-runs"
    description: "Execute a markdown sweep over PRICED ON_FLOOR items per markdown_price"
    roles: [StoreManager]
    code: 201
    input: ["notes?"]
    output: MarkdownRun
    side_effects: ["eligible items markdown_step += 1 and current_price recomputed", "items at max steps flagged disposition_recommended", "run counters computed"]
  - method: GET
    path: "/reuse/markdown-runs"
    description: "List markdown runs"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "MarkdownRun[]"
    side_effects: []
  - method: GET
    path: "/reuse/markdown-runs/{runId}"
    description: "Get one markdown run"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: []
    output: MarkdownRun
    side_effects: []

  # --- Contractor accounts ---
  - method: POST
    path: "/reuse/contractor-accounts"
    description: "Create a contractor account (PENDING_APPROVAL)"
    roles: [WarehouseAdmin]
    code: 201
    input: [company_name, contact_email, credit_limit_cents, "payment_terms_days?"]
    output: ContractorAccount
    side_effects: ["status PENDING_APPROVAL"]
  - method: GET
    path: "/reuse/contractor-accounts"
    description: "List contractor accounts"
    roles: [WarehouseAdmin, StoreManager, Cashier]
    code: 200
    input: ["limit?", "offset?", "status?", "discount_tier?"]
    output: "ContractorAccount[]"
    side_effects: []
  - method: GET
    path: "/reuse/contractor-accounts/{accountId}"
    description: "Get one account (Contractor role: own only)"
    roles: [WarehouseAdmin, StoreManager, Cashier, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []
  - method: POST
    path: "/reuse/contractor-accounts/{accountId}/approve"
    description: "PENDING_APPROVAL -> ACTIVE"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/reuse/contractor-accounts/{accountId}/suspend"
    description: "ACTIVE -> SUSPENDED (manual); cancels ACTIVE agreements"
    roles: [WarehouseAdmin]
    code: 200
    input: [suspension_reason]
    output: ContractorAccount
    side_effects: ["status -> SUSPENDED", "ACTIVE agreements -> CANCELLED"]
  - method: POST
    path: "/reuse/contractor-accounts/{accountId}/reinstate"
    description: "SUSPENDED -> ACTIVE (requires balance <= credit limit)"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/reuse/contractor-accounts/{accountId}/close"
    description: "ACTIVE|SUSPENDED -> CLOSED (requires zero balance); cancels ACTIVE agreements"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status -> CLOSED", "ACTIVE agreements -> CANCELLED"]
  - method: POST
    path: "/reuse/contractor-accounts/{accountId}/payments"
    description: "Record a payment against outstanding balance"
    roles: [WarehouseAdmin]
    code: 201
    input: [amount_cents]
    output: ContractorAccount
    side_effects: ["outstanding_balance_cents -= amount_cents", "version += 1"]

  # --- Bulk purchase agreements ---
  - method: POST
    path: "/reuse/bulk-agreements"
    description: "Create a bulk agreement (OCC-guarded create-with-supersede on the account)"
    roles: [WarehouseAdmin]
    code: 201
    input: [contractor_id, category_id, discount_pct, min_quantity, quantity_unit, valid_from, valid_until, "supersedes_agreement_id?", expected_account_version]
    output: BulkPurchaseAgreement
    side_effects: ["status ACTIVE", "superseded agreement -> SUPERSEDED when supersedes_agreement_id given", "increments ContractorAccount.version by 1"]
  - method: GET
    path: "/reuse/bulk-agreements"
    description: "List agreements (Contractor role: own only via contractor_id filter == X-User-ID)"
    roles: [WarehouseAdmin, StoreManager, Contractor]
    code: 200
    input: ["limit?", "offset?", "contractor_id?", "category_id?", "status?", "supersedes_agreement_id?"]
    output: "BulkPurchaseAgreement[]"
    side_effects: []
  - method: GET
    path: "/reuse/bulk-agreements/{agreementId}"
    description: "Get one agreement (Contractor role: own only)"
    roles: [WarehouseAdmin, StoreManager, Contractor]
    code: 200
    input: []
    output: BulkPurchaseAgreement
    side_effects: []
  - method: POST
    path: "/reuse/bulk-agreements/{agreementId}/cancel"
    description: "ACTIVE -> CANCELLED"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: BulkPurchaseAgreement
    side_effects: ["status -> CANCELLED"]

  # --- Sales ---
  - method: POST
    path: "/reuse/sales"
    description: "Open a sale (walk-in or contractor-account); captures tier_snapshot excluding this sale"
    roles: [Cashier, StoreManager, Contractor]
    code: 201
    input: [sale_channel, "contractor_id?", "agreement_id?"]
    output: Sale
    side_effects: ["status OPEN", "tier_snapshot := account.discount_tier (CONTRACTOR_ACCOUNT channel)", "agreement attached must be ACTIVE"]
  - method: GET
    path: "/reuse/sales"
    description: "List sales (Contractor role: own only)"
    roles: [Cashier, StoreManager, WarehouseAdmin, Contractor]
    code: 200
    input: ["limit?", "offset?", "contractor_id?", "agreement_id?", "status?"]
    output: "Sale[]"
    side_effects: []
  - method: GET
    path: "/reuse/sales/{saleId}"
    description: "Get one sale (Contractor role: own only)"
    roles: [Cashier, StoreManager, WarehouseAdmin, Contractor]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/reuse/sales/{saleId}/lines"
    description: "Add a line: reserves an ON_FLOOR item; captures unit_price; per-line rounded total"
    roles: [Cashier, StoreManager, Contractor]
    code: 201
    input: [item_id, "quantity?"]
    output: SaleLineItem
    side_effects: ["item ON_FLOOR -> RESERVED", "line_total_cents computed (per-line rounding first)"]
  - method: GET
    path: "/reuse/sale-lines"
    description: "List sale lines (filtered by sale_id / item_id)"
    roles: [Cashier, StoreManager, WarehouseAdmin, Contractor]
    code: 200
    input: ["limit?", "offset?", "sale_id?", "item_id?"]
    output: "SaleLineItem[]"
    side_effects: []
  - method: GET
    path: "/reuse/sale-lines/{lineId}"
    description: "Get one sale line"
    roles: [Cashier, StoreManager, WarehouseAdmin, Contractor]
    code: 200
    input: []
    output: SaleLineItem
    side_effects: []
  - method: DELETE
    path: "/reuse/sale-lines/{lineId}"
    description: "Remove a line from an OPEN sale; item RESERVED -> ON_FLOOR"
    roles: [Cashier, StoreManager, Contractor]
    code: 204
    input: []
    output: null
    side_effects: ["line deleted", "item RESERVED -> ON_FLOOR"]
  - method: POST
    path: "/reuse/sales/{saleId}/finalize"
    description: "OPEN -> FINALIZED; computes totals; cascades to items, zones, account balance/standing"
    roles: [Cashier, StoreManager, Contractor]
    code: 200
    input: ["payment_amount_cents?"]
    output: Sale
    side_effects: ["totals per sale_totals", "items RESERVED -> SOLD", "zone occupancy decremented", "account outstanding/trailing updated", "auto-suspend cascade when balance > credit limit", "agreement fulfilled_quantity accrued"]
  - method: POST
    path: "/reuse/sales/{saleId}/void"
    description: "FINALIZED -> VOIDED; compensating restock + balance reversal"
    roles: [StoreManager, WarehouseAdmin]
    code: 200
    input: ["void_reason?"]
    output: Sale
    side_effects: ["items SOLD -> ON_FLOOR (zone restored)", "account outstanding/trailing reversed", "agreement fulfilled_quantity reversed"]
  - method: POST
    path: "/reuse/sales/{saleId}/cancel"
    description: "OPEN -> CANCELLED; un-reserves line items"
    roles: [Cashier, StoreManager, Contractor]
    code: 200
    input: []
    output: Sale
    side_effects: ["status -> CANCELLED", "line items' items RESERVED -> ON_FLOOR"]

  # --- Tax receipts ---
  - method: POST
    path: "/reuse/tax-receipts"
    description: "Draft a tax receipt for a RECEIVED offer (one non-terminal receipt per offer)"
    roles: [IntakeStaff]
    code: 201
    input: [offer_id]
    output: TaxReceipt
    side_effects: ["status DRAFT", "donor_id and received_by_user_id copied from offer", "receipt_number assigned"]
  - method: GET
    path: "/reuse/tax-receipts"
    description: "List receipts (Donor role: own only)"
    roles: [IntakeStaff, WarehouseAdmin, Donor]
    code: 200
    input: ["limit?", "offset?", "donor_id?", "offer_id?", "status?", "supersedes_receipt_id?"]
    output: "TaxReceipt[]"
    side_effects: []
  - method: GET
    path: "/reuse/tax-receipts/{receiptId}"
    description: "Get one receipt (Donor role: own only)"
    roles: [IntakeStaff, WarehouseAdmin, Donor]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: []
  - method: POST
    path: "/reuse/tax-receipts/{receiptId}/issue"
    description: "DRAFT -> ISSUED; final valuation; SoD issuer != receiver; appraisal threshold"
    roles: [IntakeStaff]
    code: 200
    input: ["appraisal_reference?", "appraisal_value_cents?"]
    output: TaxReceipt
    side_effects: ["status -> ISSUED", "offer -> RECEIPTED", "donor trailing value + recognition tier recomputed"]
  - method: POST
    path: "/reuse/tax-receipts/{receiptId}/request-void"
    description: "ISSUED -> VOID_REQUESTED"
    roles: [IntakeStaff]
    code: 200
    input: [void_reason]
    output: TaxReceipt
    side_effects: ["status -> VOID_REQUESTED"]
  - method: POST
    path: "/reuse/tax-receipts/{receiptId}/confirm-void"
    description: "VOID_REQUESTED -> VOIDED; offer reverts to RECEIVED; donor totals recomputed"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: ["status -> VOIDED", "offer RECEIPTED -> RECEIVED", "donor totals recomputed"]
  - method: POST
    path: "/reuse/tax-receipts/{receiptId}/reject-void"
    description: "VOID_REQUESTED -> ISSUED (revert)"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: TaxReceipt
    side_effects: ["status -> ISSUED"]
  - method: POST
    path: "/reuse/tax-receipts/{receiptId}/amend"
    description: "ISSUED -> SUPERSEDED and creates the replacement ISSUED receipt (OCC on expected_receipt_version)"
    roles: [IntakeStaff]
    code: 201
    input: [expected_receipt_version, "appraisal_reference?", "appraisal_value_cents?"]
    output: TaxReceipt
    side_effects: ["old receipt -> SUPERSEDED (version += 1)", "new receipt ISSUED with supersedes_receipt_id", "donor totals recomputed over replacement chain"]

  # --- Crew members ---
  - method: POST
    path: "/reuse/crew-members"
    description: "Register a crew member (volunteer or paid)"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 201
    input: [full_name, crew_type, "hourly_rate_cents?", "hazmat_certified?", "lead_certified?"]
    output: CrewMember
    side_effects: ["status ACTIVE; hourly_rate forced 0 for VOLUNTEER"]
  - method: GET
    path: "/reuse/crew-members"
    description: "List crew members"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician, IntakeStaff]
    code: 200
    input: ["limit?", "offset?", "status?", "crew_type?", "hazmat_certified?"]
    output: "CrewMember[]"
    side_effects: []
  - method: GET
    path: "/reuse/crew-members/{memberId}"
    description: "Get one crew member"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician, IntakeStaff]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: PATCH
    path: "/reuse/crew-members/{memberId}"
    description: "Update crew member (activate/deactivate, certifications, rate)"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 200
    input: ["status?", "hourly_rate_cents?", "hazmat_certified?", "lead_certified?"]
    output: CrewMember
    side_effects: []

  # --- Crew assignments ---
  - method: POST
    path: "/reuse/crew-assignments"
    description: "Assign crew to a job window (half-open overlap; window containment in job window)"
    roles: [CrewCoordinator]
    code: 201
    input: [job_id, crew_member_id, role_on_job, start_at, end_at]
    output: CrewAssignment
    side_effects: ["status ASSIGNED"]
  - method: GET
    path: "/reuse/crew-assignments"
    description: "List assignments"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician]
    code: 200
    input: ["limit?", "offset?", "job_id?", "crew_member_id?", "status?"]
    output: "CrewAssignment[]"
    side_effects: []
  - method: GET
    path: "/reuse/crew-assignments/{assignmentId}"
    description: "Get one assignment"
    roles: [CrewCoordinator, WarehouseAdmin, CrewLead, HazmatTechnician]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/reuse/crew-assignments/{assignmentId}/complete"
    description: "ASSIGNED -> COMPLETED; records hours; recomputes job actual fee"
    roles: [CrewCoordinator]
    code: 200
    input: [hours_worked]
    output: CrewAssignment
    side_effects: ["labor_cost_cents computed", "crew.cumulative_job_hours += hours", "job.actual_fee_cents recomputed"]
  - method: POST
    path: "/reuse/crew-assignments/{assignmentId}/cancel"
    description: "ASSIGNED -> CANCELLED"
    roles: [CrewCoordinator]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/reuse/crew-assignments/{assignmentId}/mark-no-show"
    description: "ASSIGNED -> NO_SHOW"
    roles: [CrewCoordinator]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status -> NO_SHOW"]

  # --- Vehicles ---
  - method: POST
    path: "/reuse/vehicles"
    description: "Register a fleet vehicle"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 201
    input: [plate_code, capacity_lbs]
    output: Vehicle
    side_effects: ["status AVAILABLE"]
  - method: GET
    path: "/reuse/vehicles"
    description: "List vehicles"
    roles: [CrewCoordinator, WarehouseAdmin, IntakeStaff]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/reuse/vehicles/{vehicleId}"
    description: "Get one vehicle"
    roles: [CrewCoordinator, WarehouseAdmin, IntakeStaff]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: PATCH
    path: "/reuse/vehicles/{vehicleId}"
    description: "Update vehicle status (AVAILABLE <-> IN_MAINTENANCE -> RETIRED)"
    roles: [CrewCoordinator, WarehouseAdmin]
    code: 200
    input: ["status?"]
    output: Vehicle
    side_effects: ["status transitions per state_machines.Vehicle"]

  # --- Pickup appointments ---
  - method: POST
    path: "/reuse/pickup-appointments"
    description: "Book a pickup/dropoff appointment on a vehicle (60-minute buffered overlap); fee from donor tier. Subject state gate: DONATION_OFFER subjects must be ACCEPTED (ERR_INVALID_OFFER_STATE); DECONSTRUCTION_JOB subjects must be SCHEDULED or IN_PROGRESS (ERR_INVALID_JOB_STATE); vehicle must be AVAILABLE (ERR_VEHICLE_NOT_AVAILABLE)"
    roles: [CrewCoordinator, IntakeStaff]
    code: 201
    input: [subject_type, subject_id, vehicle_id, window_start, window_end]
    output: PickupAppointment
    side_effects: ["status BOOKED", "fee_cents computed per pickup_fee"]
  - method: GET
    path: "/reuse/pickup-appointments"
    description: "List appointments"
    roles: [CrewCoordinator, IntakeStaff, WarehouseAdmin]
    code: 200
    input: ["limit?", "offset?", "vehicle_id?", "subject_id?", "status?"]
    output: "PickupAppointment[]"
    side_effects: []
  - method: GET
    path: "/reuse/pickup-appointments/{appointmentId}"
    description: "Get one appointment"
    roles: [CrewCoordinator, IntakeStaff, WarehouseAdmin]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: []
  - method: POST
    path: "/reuse/pickup-appointments/{appointmentId}/complete"
    description: "BOOKED -> COMPLETED"
    roles: [CrewCoordinator, IntakeStaff]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/reuse/pickup-appointments/{appointmentId}/cancel"
    description: "BOOKED -> CANCELLED"
    roles: [CrewCoordinator, IntakeStaff]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/reuse/pickup-appointments/{appointmentId}/mark-no-show"
    description: "BOOKED -> NO_SHOW"
    roles: [CrewCoordinator, IntakeStaff]
    code: 200
    input: []
    output: PickupAppointment
    side_effects: ["status -> NO_SHOW"]

  # --- Diversion reports ---
  - method: POST
    path: "/reuse/diversion-reports"
    description: "Open a diversion reporting period (unique period)"
    roles: [WarehouseAdmin]
    code: 201
    input: [period]
    output: DiversionReport
    side_effects: ["status OPEN; totals start at 0 and track period activity"]
  - method: GET
    path: "/reuse/diversion-reports"
    description: "List diversion reports"
    roles: [WarehouseAdmin, StoreManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DiversionReport[]"
    side_effects: []
  - method: GET
    path: "/reuse/diversion-reports/{reportId}"
    description: "Get one diversion report"
    roles: [WarehouseAdmin, StoreManager]
    code: 200
    input: []
    output: DiversionReport
    side_effects: []
  - method: POST
    path: "/reuse/diversion-reports/{reportId}/close"
    description: "OPEN -> CLOSED; freezes period totals (ops-run checkpoint)"
    roles: [WarehouseAdmin]
    code: 200
    input: []
    output: DiversionReport
    side_effects: ["status -> CLOSED", "totals frozen per diversion_report_close"]

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Donor
    description: "Donor of materials; manages own offers, views own receipts"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /reuse/donation-offers (as own donor_id)"
      - "POST /reuse/donation-offers/{offerId}/resubmit (own offers)"
    shared_operations:
      - "GET /reuse/donors/{donorId} (own record)"
      - "GET /reuse/donation-offers, GET /reuse/donation-offers/{offerId} (own)"
      - "POST /reuse/donation-offers/{offerId}/cancel (own)"
      - "GET /reuse/tax-receipts, GET /reuse/tax-receipts/{receiptId} (own)"
  - name: IntakeStaff
    description: "Donation intake and receiving staff"
    identity: opaque
    exclusive_operations:
      - "Donation offer review / request-info / accept / reject / receive"
      - "POST /reuse/items (item intake)"
      - "POST /reuse/tax-receipts, issue / request-void / amend (SoD: issuer != receiver)"
      - "POST /reuse/salvage-batches/{batchId}/mark-sorted"
    shared_operations:
      - "POST /reuse/donors, GET donors/offers/batches/items/zones/vehicles/appointments"
      - "POST /reuse/pickup-appointments and lifecycle transitions"
  - name: HazmatTechnician
    description: "Certified lead/asbestos screening technician"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /reuse/hazmat-screenings (performed_by_crew_id == X-User-ID, hazmat_certified required)"
    shared_operations:
      - "POST /reuse/salvage-batches/{batchId}/quarantine and resolve-quarantine"
      - "GET screenings/jobs/assignments/crew-members"
  - name: CrewCoordinator
    description: "Schedules deconstruction jobs, crews, vehicles, pickups"
    identity: opaque
    exclusive_operations:
      - "Deconstruction job lifecycle (request-screening, schedule, start, complete, remediation, cancel)"
      - "CrewAssignment create / complete / cancel / mark-no-show"
      - "Vehicle registry and status PATCH"
      - "CrewMember registry and PATCH"
    shared_operations:
      - "POST /reuse/salvage-batches and weigh (with CrewLead)"
      - "POST /reuse/pickup-appointments and lifecycle (with IntakeStaff)"
      - "GET jobs/screenings/batches/crew/vehicles/appointments/donors"
  - name: CrewLead
    description: "Certified working lead of a deconstruction job"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /reuse/deconstruction-jobs/{jobId}/start and /complete as the assigned lead (lead_crew_member_id == X-User-ID)"
    shared_operations:
      - "POST /reuse/salvage-batches and weigh (with CrewCoordinator)"
      - "GET jobs/screenings/batches/assignments/crew-members"
  - name: StoreManager
    description: "Runs the store: categories, pricing, markdowns, zones, dispositions"
    identity: opaque
    exclusive_operations:
      - "Category create/PATCH; StoreZone create/PATCH"
      - "Item price / place / unplace / dispose (with WarehouseAdmin) / split"
      - "POST /reuse/markdown-runs"
      - "POST /reuse/sales/{saleId}/void"
    shared_operations:
      - "POST /reuse/sales, lines, finalize, cancel (with Cashier)"
      - "GET categories/items/zones/sales/accounts/agreements/reports"
      - "quarantine/resolve-quarantine (with HazmatTechnician, WarehouseAdmin)"
  - name: Cashier
    description: "Front-counter checkout operator"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /reuse/sales (WALK_IN), lines add/remove, finalize, cancel"
      - "GET items/categories/zones/sales/accounts"
  - name: Contractor
    description: "Approved contractor buyer with account terms"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - "POST /reuse/sales with sale_channel == CONTRACTOR_ACCOUNT and contractor_id == X-User-ID"
    shared_operations:
      - "GET own account / agreements / sales; lines add/finalize/cancel on own OPEN sales"
      - "GET categories, items"
  - name: WarehouseAdmin
    description: "Operations administrator: accounts, compliance oversight, diversion reporting, clock"
    identity: opaque
    exclusive_operations:
      - "Contractor account create/approve/suspend/reinstate/close/payments"
      - "Bulk purchase agreement create/cancel"
      - "Diversion report create/close"
      - "Tax receipt confirm-void / reject-void"
      - "POST /reuse/_clock/set_current_utc"
    shared_operations:
      - "Donor create; job cancel; item dispose; quarantine/resolve-quarantine"
      - "GET all resources"
