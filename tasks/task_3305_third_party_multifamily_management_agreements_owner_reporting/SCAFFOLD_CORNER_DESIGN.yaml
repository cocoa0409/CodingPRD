            - call: "POST /mgmt/onboardings/${obic_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obic_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/properties/${pic_id}/ledger-entries"
              payload: { resident_id: "${ric_id}", kind: RENT, amount_cents: 9600000, accrual_month: "2026-09", collected_month: "2026-09" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${pic_id}/statements"
