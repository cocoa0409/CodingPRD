        distinguishing_aspect: "Rejection is the sibling fork of approval out of SUBMITTED: it stores the reason, bumps the version and lands in a terminal state, and unlike approval it raises NO permit and NO PERMIT_ISSUE_FEE invoice — the site's balance stays at zero."
        test_recipe:
          setup:
