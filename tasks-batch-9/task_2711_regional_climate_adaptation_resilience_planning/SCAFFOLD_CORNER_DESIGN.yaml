              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 0 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_harbor_id}", name: "Harbor Levee Raise", hazard_type: "FLOOD", strategy_type: "PROTECT", base_cost_cents: 42000000, service_life_years: 30, cobenefit_points: 12, feasibility_score: 0.70 }
              as: ProjectSponsor
              as_user_id: "${j_harbor_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/projects/${p1_id}/screen"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-engagement"
              payload: {}
              as: RegionalAdministrator
            - call: "POST /resilience/plan-cycles/${cycle_id}/open-endorsement-round"
              payload: {}
              as: RegionalAdministrator
              captures: { cycle_v_round: $.data.version }
            - call: "POST /resilience/plan-cycles/${cycle_id}/endorsements"
              payload: { jurisdiction_id: "${j_harbor_id}", decision: "ENDORSED" }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { e_harbor_id: $.data.id }
            - call: "POST /resilience/plan-cycles/${cycle_id}/endorsements"
              payload: { jurisdiction_id: "${j_ridge_id}", decision: "ENDORSED" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { e_ridge_id: $.data.id }
          trigger:
            - call: "GET /resilience/plan-cycles/${cycle_id}/endorsement-tally"
              payload: {}
              as: EquityOfficer
            - call: "GET /resilience/plan-cycles/${cycle_id}/endorsement-tally"
              payload: {}
              as: EquityOfficer
            - call: "GET /resilience/plan-cycles/${cycle_id}"
              payload: {}
              as: EquityOfficer
          assert:
            - "both tally reads: round_number == 1, total_active_weight == 7, supporting_weight == 7, veto_weight == 0, achieved_weight_bps == 10000, quorum_weight_bps == 6600, projected_outcome == ADOPTED"
            - "the cycle read: data.status == ENDORSEMENT_ROUND, data.revision_count == 0 and data.version equal to the captured cycle_v_round, so neither read mutated anything"
            - "GET /resilience/endorsements?plan_cycle_id=${cycle_id} still returns meta.total_count == 2 with both rows in decision ENDORSED"

      - name: clock_set_action_moves_the_logical_now_for_later_writes
        claim_type: Action endpoint
        grounds:
          - endpoints.post_clock_set_current_utc
          - concurrency_rules
        distinguishing_aspect: "Rows created before the clock call carry created_at 2026-08-01T00:00:00Z and rows created after it carry 2026-10-05T12:00:00Z, so the default logical clock is fixed rather than wall-clock driven."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction created under the default logical clock."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
          trigger:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T12:00:00Z" }
              as: RegionalAdministrator
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "GET /resilience/jurisdictions/${j_harbor_id}"
              payload: {}
              as: RegionalAdministrator
          assert:
            - "clock call: status 200 with data.current_utc == 2026-10-05T12:00:00Z"
            - "second call: status 201 with data.created_at == 2026-10-05T12:00:00Z"
            - "third call: Harbor's data.created_at is still 2026-08-01T00:00:00Z and its version is still 1, so moving the clock rewrote no existing row"

      - name: analysis_reject_action_leaves_the_project_uncertified
        claim_type: Action endpoint
        grounds:
          - endpoints.post_analysis_reject
          - validations.priority_19_ERR_ANALYSIS_NOT_DRAFT
          - validations.priority_38_ERR_BCA_NOT_CERTIFIED
        distinguishing_aspect: "Rejecting a DRAFT analysis moves it to REJECTED, a second reject returns 409 ERR_ANALYSIS_NOT_DRAFT, and the project cannot be allocated capital at all, failing with 409 ERR_BCA_NOT_CERTIFIED rather than being programmed on a rejected analysis."
