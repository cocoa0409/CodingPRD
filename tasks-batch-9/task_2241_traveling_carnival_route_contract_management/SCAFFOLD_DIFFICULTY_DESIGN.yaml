              as: LotBoss
              captures: { alloc_o1a: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Late Fall Spur", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_o1b: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_o1b}", venue_id: "${venue_o1b}", load_in_start: "2026-09-08T14:00:00Z", open_date: "2026-09-11T12:00:00Z", close_date: "2026-09-14T12:00:00Z", teardown_deadline: "2026-09-15T12:00:00Z" }
              as: RouteManager
              captures: { stop_o1b: $.data.id, sv_o1b: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_o1b}", venue_id: "${venue_o1b}", load_in_start: "2026-09-08T16:00:00Z", open_date: "2026-09-11T12:00:00Z", close_date: "2026-09-14T12:00:00Z", teardown_deadline: "2026-09-15T12:00:00Z" }
              as: RouteManager
              captures: { stop_o1c: $.data.id, sv_o1c: $.data.version }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_o1}", route_stop_id: "${stop_o1b}", expected_route_stop_version: "${sv_o1b}" }
              as: LotBoss
              captures: { overlap_error: $.data.error_id }
            - call: "POST /ride-allocations"
