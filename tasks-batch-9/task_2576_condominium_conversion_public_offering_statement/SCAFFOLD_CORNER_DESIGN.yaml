            - "after first trigger: total_count == 2, limit == 1, offset == 0, has_more == true"
            - "after first trigger: data has exactly 1 element and its id is one of \"${u101}\" / \"${u102}\""
            - "after second trigger: total_count == 2, limit == 1, offset == 1, has_more == false"
            - "after second trigger: data has exactly 1 element whose id differs from the first page's element"
            - "the union of the first two pages is exactly {\"${u101}\", \"${u102}\"} and excludes \"${u103}\""
            - "after third trigger: total_count == 1 and data[0].id == \"${u103}\""
            - "after third trigger: Unit.${u103}.declaration_status == WITHDRAWN"
            - "after fourth trigger: total_count == 3, limit == 10, offset == 0, has_more == false"
