            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-15B", full_name: "C Fifteen B", home_state: "TX" }, as: CarrierAdmin, captures: { c15b: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g15}", counselor_id: "${c15a}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam15a: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam15a}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g15}", counselor_id: "${c15b}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam15b: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g15}", counselor_id: "${c15b}", window_start: "2026-09-14T23:59:59Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam15c: $.data.id } }
          trigger:
            - { call: "POST /enrollment-campaigns/${cam15b}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns/${cam15c}/open", payload: {}, as: BenefitCounselor, captures: { err15: $.data.error_id } }
          assert:
            - "Adjacent campaign opens: EnrollmentCampaign.${cam15b}.status == OPEN (half-open intervals touching at 2026-09-15T00:00:00Z do not overlap)"
            - "One-second-overlap campaign rejected: ${err15} == ERR_CAMPAIGN_WINDOW_OVERLAP; EnrollmentCampaign.${cam15c}.status remains DRAFT"

      - name: counselor_double_booked_closed_interval_touching_conflicts
        grounds:
          - state_machines.EnrollmentCampaign.DRAFT_to_OPEN
          - errors[ERR_COUNSELOR_DOUBLE_BOOKED]
          - entities.EnrollmentCampaign.fields.counselor_id
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (the counselor's
          book of business): counselor conflict uses CLOSED intervals, so the same
          boundary-touching geometry that passes the group half-open check FAILS
          here — one counselor leading two OPEN campaigns whose windows touch at a
          single instant is rejected with ERR_COUNSELOR_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G16 ACTIVE (0/0.0, DAILY); single counselor C16 ACTIVE."
            - "Campaign CAM16A OPEN with window 2026-09-01T00:00:00Z .. 2026-09-15T00:00:00Z led by C16."
            - "Campaign CAM16B DRAFT, SAME counselor C16, window 2026-09-15T00:00:00Z .. 2026-10-01T00:00:00Z (touching, which is legal for the group rule but not for the counselor rule)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G16", group_code: "G16", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g16: $.data.id } }
            - { call: "POST /employer-groups/${g16}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-16", full_name: "C Sixteen", home_state: "TX" }, as: CarrierAdmin, captures: { c16: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g16}", counselor_id: "${c16}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam16a: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam16a}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g16}", counselor_id: "${c16}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam16b: $.data.id } }
          trigger:
            - { call: "POST /enrollment-campaigns/${cam16b}/open", payload: {}, as: BenefitCounselor, captures: { err16: $.data.error_id } }
          assert:
            - "${err16} == ERR_COUNSELOR_DOUBLE_BOOKED (closed-interval semantics: touching windows conflict for the counselor even though the group-level half-open check passes)"
            - "EnrollmentCampaign.${cam16b}.status remains DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_pay_then_void_restores_policy_lifetime_paid
        grounds:
          - state_machines.Claim.APPROVED_to_PAID
          - state_machines.Claim.PAID_to_VOIDED
          - entities.Policy.fields.lifetime_paid_cents
          - entities.Policy.fields.paid_occurrences_by_year
        distinguishing_aspect: |
          Conserved quantity = Policy.lifetime_paid_cents and the per-year
          occurrence counters (monetary ledger): pay adds payable_amount_cents and
          void of a PAID claim subtracts exactly the same amount, so the invariant
          lifetime_paid_cents == sum over non-VOIDED PAID claims holds with zero
          drift after the pay/void pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G17 ACTIVE (0/0.0, DAILY); counselor C17; campaign CAM17 OPEN 2026-09-01..2026-10-01 guaranteed_issue; series S17 ACTIVE with PUBLISHED schedule: event BURN amount 8000, max 3/year, lifetime 500000; premium 3000; wellness 5000/0; preexisting 0."
            - "Employee E17 ACTIVE; Policy P17 ISSUED under CAM17."
            - "Claim C17: BURN, 2026-09-04, claimed 2 -> reviewed (provisional 16000), documented, approved (payable 16000, 2 occurrences)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G17", group_code: "G17", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g17: $.data.id } }
            - { call: "POST /employer-groups/${g17}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-17", full_name: "C Seventeen", home_state: "TX" }, as: CarrierAdmin, captures: { c17: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "ACC-17", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { s17: $.data.id, s17_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s17}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "BURN", benefit_amount_cents: 8000, max_occurrences_per_year: 3, lifetime_max_cents: 500000 }], monthly_premium_cents: 3000, wellness_benefit_cents: 5000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch17: $.data.id } }
            - { call: "POST /benefit-schedules/${sch17}/publish", payload: { expected_series_version: "${s17_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s17}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g17}", counselor_id: "${c17}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam17: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam17}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${g17}", employee_ref: "E17", full_name: "Emp Seventeen", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e17: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam17}", employee_id: "${e17}", policy_series_id: "${s17}", premium_mode: "POST_TAX" }, as: BenefitCounselor, captures: { p17: $.data.id } }
            - { call: "POST /policies/${p17}/issue", payload: {}, as: BenefitCounselor }
            - { call: "POST /claims", payload: { policy_id: "${p17}", event_code: "BURN", service_date: "2026-09-04T00:00:00Z", diagnosis_code: "T22.001A", claimed_occurrences: 2 }, as: ClaimsAdjuster, captures: { cl17: $.data.id } }
            - { call: "POST /claims/${cl17}/review", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claim-documents", payload: { claim_id: "${cl17}", doc_type: "DIAGNOSIS_PROOF", content_ref: "ref-17" }, as: ClaimsAdjuster, captures: { doc17: $.data.id } }
            - { call: "POST /claim-documents/${doc17}/accept", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /claims/${cl17}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /claims/${cl17}/pay", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /policies/${p17}", payload: {}, as: ClaimsAdjuster, captures: { p17_paid_after: $.data.lifetime_paid_cents } }
            - { call: "POST /claims/${cl17}/void", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /policies/${p17}", payload: {}, as: ClaimsAdjuster, captures: { p17_paid_final: $.data.lifetime_paid_cents } }
          assert:
            - "After pay: ${p17_paid_after} == 16000 and Policy.${p17}.paid_occurrences_by_year[2026][BURN] == 2"
            - "After void: Claim.${cl17}.status == VOIDED and ${p17_paid_final} == 0"
            - "Policy.${p17}.paid_occurrences_by_year[2026][BURN] == 0 after void (invariant: counters equal the sum over non-VOIDED PAID claims)"

      - name: deduction_line_reverse_restores_cycle_total
        grounds:
          - state_machines.DeductionLine.POSTED_to_REVERSED
          - state_machines.PayrollCycle.OPEN_to_FINALIZED
          - entities.PayrollCycle.fields.total_posted_cents
          - errors[ERR_CYCLE_NOT_REVERSIBLE]
        distinguishing_aspect: |
          DIFFERENT conserved quantity = PayrollCycle.total_posted_cents (payroll
          ledger, not claim ledger): finalize posts N lines and the total equals
          their sum; reversing a line subtracts exactly its amount, so
          total_posted_cents == sum over POSTED lines holds before and after the
          forward/reverse pair — and once the cycle leaves FINALIZED, reversal is
          rejected with ERR_CYCLE_NOT_REVERSIBLE.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G18 ACTIVE, DAILY convention, minimums 0/0.0; counselor C18; campaign CAM18 OPEN 2026-09-01..2026-10-01 guaranteed_issue; series S18 ACTIVE with PUBLISHED schedule: premium 3000, event W amount 100, max 12, lifetime 100000; wellness 1000/0; preexisting 0."
            - "Two employees E18a/E18b ACTIVE, each with an ISSUED policy against S18."
            - "Payroll cycle CYC18 period 2026-09-01..2026-10-01 FINALIZED: two lines of 3000 each, total_posted_cents == 6000."
          setup_api_calls:
