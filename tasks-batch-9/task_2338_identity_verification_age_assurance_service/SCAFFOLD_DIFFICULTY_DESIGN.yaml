          - calculations.client_rolling_window_usage
          - entities.Client.fields.integration_state
        distinguishing_aspect: |
          Category pair business_safety (priority 24) vs business_fiscal (priority 49): the client is
          SUSPENDED and its 24-hour rolling window already holds its single allowed session, and the
          response must be ERR_CLIENT_NOT_LIVE, never ERR_CLIENT_DAILY_QUOTA_EXCEEDED.
        test_recipe:
          setup:
            - "Client Acme P2 is created LIVE with daily_session_quota 1, DELETE_ON_COMPLETE, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, min_assurance_score 60, no age gate; PUBLISHED."
            - "One session subj-r5b-1 has already been opened inside the current 24-hour window, so used == 1 == quota."
