  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_requires_call_published
        grounds:
          - state_machines.Booking.OFFERED_to_CONFIRMED
          - errors[ERR_CALL_NOT_ACCEPTING]
        distinguishing_aspect: |
          Entity pair Booking -> CastingCall: a normal (non-replacement) booking's
          accept is valid only while its CastingCall is PUBLISHED; once the call is
          LOCKED the same transition is rejected with ERR_CALL_NOT_ACCEPTING even
          though the booking itself is still OFFERED.
        test_recipe:
          setup:
            - "Production ACTIVE; union actor ELIGIBLE; call (union_slots 1, nonunion_slots 0) PUBLISHED; booking created and still OFFERED; call then LOCKED (projection satisfied by the OFFERED union booking)"
          setup_api_calls:
