            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver}" }
              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
          trigger:
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
              captures: { pen_cents: "$.data.penalty_cents", int_cents: "$.data.interest_cents" }
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_exposure: "$.data.total_exposure_cents" }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { emp_exposure: "$.data.open_exposure_cents" }
            - call: "GET /correction-cases/${case_id}/exposure-summary"
              payload: {}
              as: TaxPreparer
          assert:
            - "${int_cents} == 20000 and ${pen_cents} == 65625 straight out of the prepare response, with no follow-up read required"
            - "${case_exposure} == 335625 on the first read after prepare"
            - "${emp_exposure} == 335625 on the first read after prepare"
            - "the exposure-summary read agrees with both: gross_exposure_cents == 335625, waived_cents == 0, total_exposure_cents == 335625"
            - "CorrectionCase.${case_id}.filing_status == FILING_IN_PROGRESS in that same first read, so the cascade is not deferred"
