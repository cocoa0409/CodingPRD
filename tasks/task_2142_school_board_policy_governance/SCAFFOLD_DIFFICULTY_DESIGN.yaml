scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: public_comment_allocation_two_variants_same_speaker_cards
        grounds:
          - calculations.public_comment_minute_allocation
          - entities.Meeting.fields.public_comment_rule
          - entities.Meeting.fields.public_comment_allocation_variant
          - entities.Meeting.fields.public_comment_minutes_remaining
          - entities.PublicComment.fields.allotted_minutes
          - state_machines.Meeting.NOTICED_to_OPEN
        distinguishing_aspect: |
          Two SPECIAL meetings carrying byte-identical speaker cards (same two names, same
          requested_minutes of 1 each, same 5-minute budget) produce different allotments purely
          because Meeting.public_comment_rule differs: first_come_capped honours requested_minutes
          and yields 1/1 with 3 minutes left over, while equal_split ignores requested_minutes and
          yields 3/2 with 0 left over. The subject entity is the public-comment ledger on a Meeting,
          a wholly different entity domain from the superintendent-scoring dual variant.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "One policy with two DRAFT versions so each meeting can carry its own first-reading item."
            - "Meeting X: SPECIAL, FULL_BOARD, starts 2026-08-05T18:00:00Z, public_comment_rule FIRST_COME_CAPPED (default)."
            - "Meeting Y: SPECIAL, FULL_BOARD, starts 2026-08-06T18:00:00Z, public_comment_rule EQUAL_SPLIT."
            - "Each meeting carries exactly one POLICY_FIRST_READING item with two speaker cards, Dana Ortiz then Evan Park, each asking for 1 minute; the two cards have strictly increasing submitted_at."
            - "Both meetings are NOTICED, so both items are POSTED."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Draft one text.", summary_of_change: "Initial draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id, pol_v2: $.data.policy_version_after }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Draft two text.", summary_of_change: "Alternate draft", expected_policy_version: "${pol_v2}" }
              as: PolicyAnalyst
              captures: { pv2: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Special Meeting X", scope: "FULL_BOARD", meeting_type: "SPECIAL", scheduled_start_utc: "2026-08-05T18:00:00Z" }
              as: BoardClerk
              captures: { mx: $.data.id, mx_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${mx}", item_type: "POLICY_FIRST_READING", title: "First reading draft one", expected_meeting_version: "${mx_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { aix: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Special Meeting Y", scope: "FULL_BOARD", meeting_type: "SPECIAL", scheduled_start_utc: "2026-08-06T18:00:00Z", public_comment_rule: "EQUAL_SPLIT" }
              as: BoardClerk
              captures: { my: $.data.id, my_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${my}", item_type: "POLICY_FIRST_READING", title: "First reading draft two", expected_meeting_version: "${my_v}", policy_version_id: "${pv2}" }
              as: BoardClerk
              captures: { aiy: $.data.id }
            - call: "POST /governance/agenda-items/${aix}/public-comments"
              payload: { speaker_name: "Dana Ortiz", speaker_affiliation: "PARENT", requested_minutes: 1 }
              as: Public
              captures: { cx_dana: $.data.id }
            - call: "POST /governance/agenda-items/${aiy}/public-comments"
              payload: { speaker_name: "Dana Ortiz", speaker_affiliation: "PARENT", requested_minutes: 1 }
              as: Public
              captures: { cy_dana: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/agenda-items/${aix}/public-comments"
              payload: { speaker_name: "Evan Park", speaker_affiliation: "COMMUNITY", requested_minutes: 1 }
              as: Public
              captures: { cx_evan: $.data.id }
            - call: "POST /governance/agenda-items/${aiy}/public-comments"
              payload: { speaker_name: "Evan Park", speaker_affiliation: "COMMUNITY", requested_minutes: 1 }
              as: Public
              captures: { cy_evan: $.data.id }
            - call: "POST /governance/meetings/${mx}/notice"
              payload: {}
              as: BoardClerk
            - call: "POST /governance/meetings/${my}/notice"
              payload: {}
              as: BoardClerk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T18:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/meetings/${mx}/open"
              payload: { attending_member_ids: ["${bm1}", "${bm2}", "${bm3}"] }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T18:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/meetings/${my}/open"
              payload: { attending_member_ids: ["${bm1}", "${bm2}", "${bm3}"] }
              as: BoardPresident
              as_user_id: "${bm1}"
          assert:
            - "Meeting.${mx}.public_comment_allocation_variant == FIRST_COME_CAPPED"
            - "Meeting.${my}.public_comment_allocation_variant == EQUAL_SPLIT"
            - "PublicComment.${cx_dana}.allotted_minutes == 1"
            - "PublicComment.${cx_evan}.allotted_minutes == 1"
            - "Meeting.${mx}.public_comment_minutes_remaining == 3"
            - "PublicComment.${cy_dana}.allotted_minutes == 3"
            - "PublicComment.${cy_evan}.allotted_minutes == 2"
            - "Meeting.${my}.public_comment_minutes_remaining == 0"
            - "PublicComment.${cx_dana}.status == GRANTED and PublicComment.${cy_dana}.status == GRANTED"

      - name: superintendent_midyear_versus_summative_on_identical_ratings
        grounds:
          - calculations.evaluation_composite_score
          - entities.SuperintendentEvaluation.fields.midyear_formative_score
          - entities.SuperintendentEvaluation.fields.summative_composite_score
          - state_machines.SuperintendentEvaluation.GOALS_SET_to_MIDYEAR_REVIEW
          - state_machines.SuperintendentEvaluation.SUMMATIVE_DRAFT_to_ADOPTED
        distinguishing_aspect: |
          The same four EvaluationRating rows produce 3.50 under midyear_formative (one pooled
          unweighted mean over every rating) and 3.33 under summative_final (per-domain means,
          rubric weighting, renormalisation over the three domains that received ratings). The
          subject entity is the superintendent evaluation cycle, an entirely different entity domain
          from the public-comment minute ledger.
        test_recipe:
          setup:
            - "Four SEATED trustees, all with term_end_date 2030-12-31T00:00:00Z, so every one of them is summative-eligible."
            - "Evaluation cycle 2027 with weights 0.40 instructional / 0.30 fiscal / 0.20 community / 0.10 governance, window 2026-08-01 to 2027-06-30, advanced to GOALS_SET."
            - "Four FORMATIVE ratings: bm1 INSTRUCTIONAL_LEADERSHIP 5, bm2 INSTRUCTIONAL_LEADERSHIP 4, bm3 FISCAL_STEWARDSHIP 2, bm4 COMMUNITY_RELATIONS 3. GOVERNANCE_SUPPORT receives nothing."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Dev Rao", seat_number: 4, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Rao Legal" }
              as: BoardClerk
              captures: { bm4: $.data.id }
            - call: "POST /governance/superintendent-evaluations"
              payload: { cycle_year: 2027, window_start_date: "2026-08-01T00:00:00Z", window_end_date: "2027-06-30T00:00:00Z", midyear_checkpoint_date: "2027-01-15T00:00:00Z", goal_count: 4, weight_instructional: 0.40, weight_fiscal: 0.30, weight_community: 0.20, weight_governance: 0.10 }
              as: BoardClerk
              captures: { ev: $.data.id }
            - call: "POST /governance/superintendent-evaluations/${ev}/advance"
              payload: { action: "SET_GOALS" }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /governance/evaluation-ratings"
              payload: { evaluation_id: "${ev}", board_member_id: "${bm1}", domain: "INSTRUCTIONAL_LEADERSHIP", score: 5 }
              as: BoardMember
              as_user_id: "${bm1}"
            - call: "POST /governance/evaluation-ratings"
              payload: { evaluation_id: "${ev}", board_member_id: "${bm2}", domain: "INSTRUCTIONAL_LEADERSHIP", score: 4 }
              as: BoardMember
              as_user_id: "${bm2}"
            - call: "POST /governance/evaluation-ratings"
              payload: { evaluation_id: "${ev}", board_member_id: "${bm3}", domain: "FISCAL_STEWARDSHIP", score: 2 }
              as: BoardMember
              as_user_id: "${bm3}"
            - call: "POST /governance/evaluation-ratings"
              payload: { evaluation_id: "${ev}", board_member_id: "${bm4}", domain: "COMMUNITY_RELATIONS", score: 3 }
              as: BoardMember
              as_user_id: "${bm4}"
          trigger:
            - call: "POST /governance/superintendent-evaluations/${ev}/advance"
              payload: { action: "MIDYEAR" }
              as: BoardPresident
              as_user_id: "${bm1}"
              captures: { midyear: $.data.midyear_formative_score }
            - call: "POST /governance/superintendent-evaluations/${ev}/advance"
              payload: { action: "DRAFT_SUMMATIVE" }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /governance/superintendent-evaluations/${ev}/advance"
              payload: { action: "ADOPT" }
              as: BoardPresident
              as_user_id: "${bm1}"
              captures: { summative: $.data.summative_composite_score }
          assert:
            - "SuperintendentEvaluation.${ev}.midyear_formative_score == 3.50"
            - "SuperintendentEvaluation.${ev}.summative_composite_score == 3.33"
            - "SuperintendentEvaluation.${ev}.midyear_formative_score != SuperintendentEvaluation.${ev}.summative_composite_score"
            - "SuperintendentEvaluation.${ev}.rating_count == 4"
            - "SuperintendentEvaluation.${ev}.eligible_rater_count == 4"
            - "SuperintendentEvaluation.${ev}.status == ADOPTED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: equal_split_floor_then_remainder_sweep_rounding_order
        grounds:
          - calculations.public_comment_minute_allocation
          - entities.PublicComment.fields.allotted_minutes
          - entities.Meeting.fields.public_comment_minutes_remaining
          - state_machines.PublicComment.REQUESTED_to_GRANTED
        distinguishing_aspect: |
          Mode (b) -- nested rounding where the order decides the cents. Five budget minutes across
          three speakers must be floored FIRST (floor(5/3) = 1 each) and the integer remainder of 2
          then walked out one minute at a time in submitted_at ASC order, producing 2 / 2 / 1.
          Rounding the share instead (round_half_up(5/3) = 2 each) would hand out 6 minutes from a
          5-minute budget, and rounding down without the remainder sweep would strand 2 minutes.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "One policy with one DRAFT version."
            - "Meeting S: SPECIAL, FULL_BOARD, starts 2026-08-05T18:00:00Z, public_comment_rule EQUAL_SPLIT (explicitly chosen, since three cards is below the automatic threshold of four)."
            - "One POLICY_FIRST_READING item carrying three speaker cards -- Faye Nunez, Gil Adams, Hana Ito -- filed at strictly increasing submitted_at, each asking for 3 minutes."
            - "The meeting is NOTICED, so the item is POSTED."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-5030", title: "Student Wellness", category: "STUDENTS", legal_requirement_level: "RECOMMENDED", manual_section: "5000.30" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Wellness draft.", summary_of_change: "Initial draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Special Wellness Meeting", scope: "FULL_BOARD", meeting_type: "SPECIAL", scheduled_start_utc: "2026-08-05T18:00:00Z", public_comment_rule: "EQUAL_SPLIT" }
              as: BoardClerk
              captures: { ms: $.data.id, ms_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${ms}", item_type: "POLICY_FIRST_READING", title: "First reading BP-5030", expected_meeting_version: "${ms_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { ai: $.data.id }
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Faye Nunez", speaker_affiliation: "PARENT", requested_minutes: 3 }
              as: Public
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Gil Adams", speaker_affiliation: "STAFF", requested_minutes: 3 }
              as: Public
              captures: { c2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Hana Ito", speaker_affiliation: "COMMUNITY", requested_minutes: 3 }
              as: Public
              captures: { c3: $.data.id }
            - call: "POST /governance/meetings/${ms}/notice"
              payload: {}
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T18:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/meetings/${ms}/open"
              payload: { attending_member_ids: ["${bm1}", "${bm2}", "${bm3}"] }
              as: BoardPresident
              as_user_id: "${bm1}"
          assert:
            - "Meeting.${ms}.public_comment_allocation_variant == EQUAL_SPLIT"
            - "PublicComment.${c1}.allotted_minutes == 2"
            - "PublicComment.${c2}.allotted_minutes == 2"
            - "PublicComment.${c3}.allotted_minutes == 1"
            - "Meeting.${ms}.public_comment_minutes_remaining == 0"
            - "PublicComment.${c1}.allotted_minutes + PublicComment.${c2}.allotted_minutes + PublicComment.${c3}.allotted_minutes == 5"
            - "PublicComment.${c3}.status == GRANTED"

      - name: compliance_phase_order_publication_recertification
        grounds:
          - calculations.policy_compliance_state
          - calculations.manual_publication_snapshot
          - entities.ManualPublication.fields.compliance_gap_count
          - entities.ManualPublication.fields.certification_state
          - entities.LegalMandate.fields.days_past_deadline
          - state_machines.LegalMandate.OPEN_to_OVERDUE
        distinguishing_aspect: |
          Mode (c) -- a dependency that looks circular and is made well defined only by a pinned
          evaluation order. The published edition pinned the policy's adopted version, and the same
          edition's certification_state is then driven by that policy's compliance_state, which is
          driven by a mandate whose OVERDUE flag only the sweep may set. The scaffold pins phase 1
          (mandate refresh) then phase 2 (policy aggregate) then phase 3 (publication
          reconciliation), never re-entering an earlier phase, so one sweep call yields exactly
          OVERDUE -> NON_COMPLIANT -> LAPSED with days_past_deadline 1.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-4119, REQUIRED_BY_LAW, whose version 1 was adopted at an EMERGENCY meeting on 2026-08-02T18:00:00Z, so the policy is ADOPTED and COMPLIANT."
            - "Manual edition 2026-FALL published at that same instant with the policy pinned at version 1, compliance_gap_count 0 and certification_state CERTIFIED."
            - "The logical clock rests at 2026-08-02T18:00:00Z."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Version one text.", summary_of_change: "Initial adoption draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Emergency Board Meeting", scope: "FULL_BOARD", meeting_type: "EMERGENCY", scheduled_start_utc: "2026-08-02T18:00:00Z" }
              as: BoardClerk
              captures: { me: $.data.id, me_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${me}", item_type: "POLICY_FIRST_READING", title: "Emergency first reading BP-4119", expected_meeting_version: "${me_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { aie: $.data.id }
            - call: "POST /governance/meetings/${me}/notice"
              payload: {}
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T18:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/meetings/${me}/open"
              payload: { attending_member_ids: ["${bm1}", "${bm2}", "${bm3}"] }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /governance/agenda-items/${aie}/record-vote"
              payload: { yes_member_ids: ["${bm1}", "${bm2}", "${bm3}"], no_member_ids: [], abstain_member_ids: [] }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /governance/manual-publications"
              payload: { publication_label: "2026-FALL", as_of_date: "2026-08-02T18:00:00Z" }
              as: PolicyAnalyst
              captures: { pub: $.data.id }
            - call: "POST /governance/manual-publications/${pub}/publish"
              payload: {}
              as: PolicyAnalyst
          trigger:
            - call: "POST /governance/legal-mandates"
              payload: { notice_code: "LUS-2026-014", policy_id: "${pol}", citation: "EC 35291", issued_on: "2026-08-02T18:00:00Z", compliance_deadline: "2026-08-10T00:00:00Z", required_action: "REVISE_EXISTING" }
              as: LegalUpdateService
              captures: { man: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/compliance-sweeps"
              payload: {}
              as: BoardClerk
              captures: { swept: $.data.mandates_marked_overdue, lapsed: $.data.publications_lapsed }
          assert:
            - "LegalMandate.${man}.status == OVERDUE"
            - "LegalMandate.${man}.days_past_deadline == 1"
            - "Policy.${pol}.overdue_mandate_count == 1"
            - "Policy.${pol}.compliance_state == NON_COMPLIANT"
            - "ManualPublication.${pub}.compliance_gap_count == 1"
            - "ManualPublication.${pub}.certification_state == LAPSED"
            - "ManualPublication.${pub}.pinned_entries[0].version_no == 1"
            - "ManualPublication.${pub}.entry_count == 1"
            - "compliance-sweep response mandates_marked_overdue == 1"
            - "compliance-sweep response publications_lapsed == 1"

      - name: summative_domain_mean_rounded_before_weighting
        grounds:
          - calculations.evaluation_composite_score
          - entities.SuperintendentEvaluation.fields.summative_composite_score
          - entities.SuperintendentEvaluation.fields.weight_instructional
          - state_machines.SuperintendentEvaluation.SUMMATIVE_DRAFT_to_ADOPTED
        distinguishing_aspect: |
          Mode (a) -- a formula with four interacting inputs (four rubric weights, per-domain means,
          a presence-conditional renormalisation over only the domains that received a rating, and a
          clamp) whose branches do not compose linearly. Three INSTRUCTIONAL_LEADERSHIP scores of
          5/4/4 and one GOVERNANCE_SUPPORT score of 1 give 4.33 and 1.00 after the pinned per-domain
          rounding, weighted to 1.832 and renormalised over 0.50 to exactly 3.66; carrying the
          unrounded 4.333333 through instead lands on 3.67.
        test_recipe:
          setup:
            - "Four SEATED trustees with term_end_date 2030-12-31T00:00:00Z."
            - "Evaluation cycle 2028 with weights 0.40 / 0.30 / 0.20 / 0.10, advanced to GOALS_SET."
            - "Four FORMATIVE ratings: bm1 INSTRUCTIONAL_LEADERSHIP 5, bm2 INSTRUCTIONAL_LEADERSHIP 4, bm3 INSTRUCTIONAL_LEADERSHIP 4, bm4 GOVERNANCE_SUPPORT 1. FISCAL_STEWARDSHIP and COMMUNITY_RELATIONS receive nothing, so their combined 0.50 of weight is renormalised away."
