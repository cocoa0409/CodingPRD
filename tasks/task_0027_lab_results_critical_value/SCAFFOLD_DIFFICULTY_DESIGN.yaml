              as_user_id: "${lt_id}"
            - call: "POST /results"
              payload: { lab_order_id: "${ord_id}", specimen_id: "${sp_id}", run_id: "${run_id}", analyte_code: "K", numeric_value: 4.20, unit: "mmol/L", reference_low: 3.50, reference_high: 5.10, critical_low: 2.50, critical_high: 6.00 }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { res_id: $.data.id }
            - call: "GET /lab-orders/${ord_id}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { ord_v: $.data.version }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { rc_before: $.data.results_release_count }
          trigger:
            - call: "POST /results/${res_id}/release"
              payload: { expected_lab_order_version: "${ord_v}" }
              as: LabTech
              as_user_id: "${lt_id}"
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { rc_after_release: $.data.results_release_count }
            - call: "POST /results/${res_id}/invalidate"
              payload: {}
              as: LabDirector
              as_user_id: "${dir_id}"
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { rc_after_invalidate: $.data.results_release_count }
          assert:
            - "Patient.${pat_id}.results_release_count starting value: 0"
            - "After release: Patient.${pat_id}.results_release_count == 1 (+1)"
            - "After invalidate: Patient.${pat_id}.results_release_count == 0 (-1)"
            - "Conservation: Patient.results_release_count == count(Results where lab_order.patient_id==pat AND status==RELEASED) at every point"
