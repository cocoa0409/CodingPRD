# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Annuity 1035 Exchange & Replacement Review
# Breadth walk over the claim-extraction-guide sections. Instances already
# exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_producer_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.Producer.fields.license_number"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "license_number is required input with no default; omitting it fails request-shape validation at priority 5."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /producers", payload: { full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET-style follow-up impossible: no Producer row was created"

      - name: producer_system_field_rejected_as_invalid_request
        claim_type: system_fields
        grounds:
          - "entities.Producer.fields.status"
        distinguishing_aspect: "status is source: system; a client-supplied status is not part of POST /producers input and the strict body contract rejects it."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat", home_state_code: "CA", status: "SUSPENDED" }, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST (unknown/system field in body)"

      - name: full_case_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.ExchangeCase.fields.exchange_amount_cents"
          - "entities.ExchangeCase.fields.new_product_bonus_bps"
        distinguishing_aspect: "For FULL cases the system sets exchange_amount_cents to the contract's account value, and omitted bonus/fee inputs default to 0."
        test_recipe:
          setup: ["Producer, client, K_STD contract (value 10,000,000)"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "ExchangeCase.status == DRAFT, version == 1, submitted_at == null"
            - "ExchangeCase.exchange_amount_cents == 10000000 (system-set for FULL)"
            - "ExchangeCase.new_product_bonus_bps == 0 and new_product_annual_fee_bps == 0 (defaults)"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A well-formed UUID that matches no case yields 404, not 400."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /cases/00000000-0000-0000-0000-000000000000", payload: {}, as: CarrierAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: client_age_and_seniority_computed_at_clock
        claim_type: computed_fields
        grounds:
          - "entities.Client.fields.age_years"
          - "entities.Client.fields.is_senior"
        distinguishing_aspect: "age_years uses inclusive birthday semantics against the logical clock: dob 1961-08-01 is exactly 65 (senior) at 2026-08-01, while dob 1961-08-02 is 64 (not senior)."
        test_recipe:
          setup: ["Producer exists; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /clients", payload: { full_name: "Ann Edge", date_of_birth: "1961-08-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /clients", payload: { full_name: "Bob Edge", date_of_birth: "1961-08-02", state_code: "CA" }, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "Client(dob 1961-08-01): age_years == 65, is_senior == true"
            - "Client(dob 1961-08-02): age_years == 64, is_senior == false"

      - name: cases_list_pagination_and_status_filter
        claim_type: listing
        grounds:
          - "endpoints[GET /cases]"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Filter + paginate interaction: three DRAFT cases for one producer paginate 2+1 with has_more flipping, and the status filter narrows the same list."
        test_recipe:
          setup: ["Producer with client and three contracts CN-A/CN-B/CN-C; three DRAFT cases"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_a: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-B", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_b: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-C", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_c: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_c}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          trigger:
            - { call: "GET /cases?producer_id=${p_id}&limit=2&offset=0", payload: {}, as: SuitabilityReviewer }
            - { call: "GET /cases?producer_id=${p_id}&limit=2&offset=2", payload: {}, as: SuitabilityReviewer }
            - { call: "GET /cases?producer_id=${p_id}&status=SUBMITTED", payload: {}, as: SuitabilityReviewer }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "status=SUBMITTED filter: total_count == 1 and the item is case ${case_b}"

      - name: activity_events_filtered_by_type
        claim_type: listing
        grounds:
          - "endpoints[GET /producers/{id}/activity-events]"
          - "entities.ActivityEvent.fields.event_type"
        distinguishing_aspect: "The churn audit trail filters by event_type; a submit-only history returns one CASE_SUBMITTED and zero EXCHANGE_COMPLETED rows."
        test_recipe:
          setup: ["Producer, client, contract; one case submitted"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          trigger:
            - { call: "GET /producers/${p_id}/activity-events", payload: {}, as: ComplianceOfficer }
            - { call: "GET /producers/${p_id}/activity-events?event_type=CASE_SUBMITTED", payload: {}, as: ComplianceOfficer }
            - { call: "GET /producers/${p_id}/activity-events?event_type=EXCHANGE_COMPLETED", payload: {}, as: ComplianceOfficer }
          assert:
            - "Unfiltered: total_count == 1, event CASE_SUBMITTED with case_id == ${case_id}, event_at == 2026-08-01T00:00:00Z"
            - "event_type=CASE_SUBMITTED: total_count == 1"
            - "event_type=EXCHANGE_COMPLETED: total_count == 0"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: submit_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ExchangeCase.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Idempotency row: the same trigger twice is an error on the second attempt because the from-state no longer holds."
        test_recipe:
          setup: ["Producer, client, K_STD contract; case SUBMITTED"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Case remains SUBMITTED with version == 2 and exactly one CASE_SUBMITTED activity event"

      - name: withdraw_from_draft_leaves_no_activity
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ExchangeCase.DRAFT_to_WITHDRAWN"
          - "entities.ActivityEvent.fields.event_type"
        distinguishing_aspect: "Withdrawing a never-submitted DRAFT emits no CASE_WITHDRAWN event (the event log tracks submitted activity only)."
        test_recipe:
          setup: ["Producer, client, contract; case in DRAFT"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_id}/withdraw", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "GET /producers/${p_id}/activity-events", payload: {}, as: ComplianceOfficer }
          assert:
            - "Case status == WITHDRAWN, version == 2"
            - "Activity events total_count == 0 (no CASE_WITHDRAWN for a never-submitted case)"

      - name: rescind_before_free_look_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ExchangeCase.IN_FREE_LOOK_to_RESCINDED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Rescind is declared only from IN_FREE_LOOK; from APPROVED it is a state error (not a free-look error)."
        test_recipe:
          setup: ["FULL case APPROVED (funds not yet requested)"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv: $.data.version } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
          trigger:
            - { call: "POST /cases/${case_id}/rescind", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION (case is APPROVED, not IN_FREE_LOOK)"
            - "No EXCHANGE_RESCINDED activity event; contract still IN_FORCE"

      - name: complete_before_deadline_returns_free_look_still_active
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ExchangeCase.IN_FREE_LOOK_to_COMPLETED"
          - "errors[ERR_FREE_LOOK_STILL_ACTIVE]"
        distinguishing_aspect: "Completion requires date(now) > deadline; on the deadline date itself the window is still open and completion is refused."
        test_recipe:
          setup: ["Junior client; FULL case delivered at 2026-08-01 -> deadline 2026-08-21; clock moved to exactly 2026-08-21"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Jim Junior", date_of_birth: "1990-06-15", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv: $.data.version } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
            - { call: "POST /cases/${case_id}/request_funds", payload: {}, as: OperationsDesk, captures: { t_id: $.data.id } }
            - { call: "POST /transfers/${t_id}/mark_received", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_id}/confirm_delivery", payload: {}, as: OperationsDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /cases/${case_id}/complete", payload: {}, as: OperationsDesk, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /cases/${case_id}/complete", payload: {}, as: OperationsDesk }
          assert:
            - "Complete on 2026-08-21 (deadline date): HTTP 409 with error_id == ERR_FREE_LOOK_STILL_ACTIVE"
            - "Complete on 2026-08-22 (deadline + 1): HTTP 200, status == COMPLETED, completed_at == 2026-08-22T00:00:00Z"
            - "ExistingContract.last_exchange_completed_at == 2026-08-22T00:00:00Z"

      - name: terminal_rejected_case_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ExchangeCase"
        distinguishing_aspect: "REJECTED is terminal: subsequent submit, recommend, and approve attempts all fail with state errors."
        test_recipe:
          setup: ["Case REJECTED by the reviewer from SUITABILITY_REVIEW"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/reject", payload: { rationale: "unsuitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "retry" }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { err2: $.data.error_id } }
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "override" }, as: Principal, as_user_id: "prin-1", captures: { err3: $.data.error_id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "All three attempts on the REJECTED case: HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Case remains REJECTED; exactly one CASE_REJECTED activity event"
            - "Fresh case on the same contract submits successfully (status == SUBMITTED): the terminal rejection closed the occupation interval"

      - name: transfer_failure_compensates_case_and_contract
        claim_type: compensation
        grounds:
          - "state_machines.FundsTransfer.REQUESTED_to_FAILED"
          - "state_machines.ExchangeCase.FUNDS_REQUESTED_to_APPROVED"
          - "state_machines.ExistingContract.SURRENDER_PENDING_to_IN_FORCE"
        distinguishing_aspect: "The FAILED path is the compensation of request_funds: case falls back to APPROVED, contract back to IN_FORCE, and a second request_funds succeeds (revert loop)."
        test_recipe:
          setup: ["FULL case with funds requested (contract SURRENDER_PENDING)"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv: $.data.version } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
            - { call: "POST /cases/${case_id}/request_funds", payload: {}, as: OperationsDesk, captures: { t_1: $.data.id } }
          trigger:
            - { call: "POST /transfers/${t_1}/mark_failed", payload: {}, as: OperationsDesk }
            - { call: "GET /cases/${case_id}", payload: {}, as: OperationsDesk }
            - { call: "GET /clients/${c_id}/contracts", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_id}/request_funds", payload: {}, as: OperationsDesk, captures: { t_2: $.data.id } }
          assert:
            - "mark_failed: transfer status == FAILED"
            - "Case reverted to APPROVED; contract back to IN_FORCE with value 10000000 / basis 8000000 untouched"
            - "Second request_funds succeeds: a new REQUESTED transfer ${t_2} exists alongside FAILED ${t_1}"
            - "GET /cases/${case_id}/funds-transfers returns 2 records (FAILED and REQUESTED)"

      - name: producer_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.Producer.ACTIVE_to_SUSPENDED"
          - "state_machines.Producer.SUSPENDED_to_ACTIVE"
        distinguishing_aspect: "Manual discipline loop with audit: suspend appends PRODUCER_SUSPENDED, reinstate appends PRODUCER_REINSTATED, and reinstate's mandatory churn re-evaluation lands on ACTIVE when no case history exists."
        test_recipe:
          setup: ["Producer ACTIVE, no cases"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /producers/${p_id}/suspend", payload: {}, as: ComplianceOfficer }
            - { call: "POST /producers/${p_id}/reinstate", payload: {}, as: ComplianceOfficer }
            - { call: "GET /producers/${p_id}/activity-events", payload: {}, as: ComplianceOfficer }
          assert:
            - "After suspend: status == SUSPENDED, version == 2"
            - "After reinstate: status == ACTIVE (churn re-evaluation finds empty counters), version == 3"
            - "Activity events: PRODUCER_SUSPENDED then PRODUCER_REINSTATED, both with case_id == null"

      - name: info_request_cycle_corner
        claim_type: valid_transition
        grounds:
          - "state_machines.ExchangeCase.SUITABILITY_REVIEW_to_INFO_REQUESTED"
        excluded_because:
          difficulty_instance: case_info_request_cycle_and_fork
          rationale: "The full SUITABILITY_REVIEW -> INFO_REQUESTED -> SUITABILITY_REVIEW cycle and the fork into PENDING_PRINCIPAL/APPROVED are asserted in the named §1.8 instance."

      - name: document_revision_loop_corner
        claim_type: valid_transition
        grounds:
          - "state_machines.CaseDocument.REJECTED_to_SUBMITTED"
        excluded_because:
          difficulty_instance: document_revision_loop
          rationale: "Two full reject/resubmit cycles with revision increments asserted in the named §1.8 instance."

      - name: rescission_chain_corner
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ExchangeCase.IN_FREE_LOOK_to_RESCINDED"
        excluded_because:
          difficulty_instance: rescission_full_chain_restores_contract_and_stamps_client
          rationale: "Cascade through transfer, contract, client, and producer counters asserted hop-by-hop in the named §1.8 instance."

      - name: funds_receipt_chain_corner
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FundsTransfer.REQUESTED_to_RECEIVED"
        excluded_because:
          difficulty_instance: funds_receipt_chain_surrenders_contract
          rationale: "Transfer -> case -> contract chain asserted in the named §1.8 instance."

