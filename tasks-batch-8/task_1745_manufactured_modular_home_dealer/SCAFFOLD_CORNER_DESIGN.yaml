scaffold_corner_design:
  - section: entities
    instances:
      - name: create_home_model_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.HomeModel.fields.model_code", "errors", "ERR_VALIDATION"]
        distinguishing_aspect: "POST /api/home-models without model_code -> 400 ERR_VALIDATION; nothing persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/home-models"
              payload: { name: "No Code", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { c1_err: $.data.error_id }
          assert:
            - "response 400 with error_id ERR_VALIDATION"

      - name: home_model_default_status_applied
        claim_type: defaults
        grounds: ["entities.HomeModel.fields.status"]
        distinguishing_aspect: "status is system-sourced with default ACTIVE; creation response shows ACTIVE without any input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { c2_st: $.data.status }
          assert:
            - "HomeModel.status == ACTIVE on creation"

      - name: sales_order_computed_total_input_ignored
        claim_type: computed_fields
        grounds: ["entities.SalesOrder.fields.total_price_cents", "calculations.order_line_pricing"]
        distinguishing_aspect: "Client-forged total_price_cents in the create body is ignored; the server computes 9,137,000 for a 9,200,000 private-land home-only order (tier 1.5% -> 138,000 discount; fee capped 75,000)."
        test_recipe:
          setup: ["model, customer, and STOCK unit exist"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { c3_mdl: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { c3_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${c3_mdl}", serial_number: "SN-C3-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { c3_unit: $.data.id }
          trigger:
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${c3_cust}", home_unit_id: "${c3_unit}", placement_type: "PRIVATE_LAND", financing_type: "CHATTEL", agreed_home_price_cents: 9200000, total_price_cents: 1 }
              as: SalesConsultant
              captures: { c3_ord: $.data.id, c3_total: $.data.total_price_cents }
          assert:
            - "SalesOrder.${c3_ord}.total_price_cents == 9137000 (computed; forged 1 ignored)"
            - "SalesOrder.${c3_ord}.discount_cents == 138000 and doc_fee_cents == 75000"

      - name: get_missing_sales_order_returns_not_found
        claim_type: not_found
        grounds: ["errors", "ERR_SALES_ORDER_NOT_FOUND", "validations", "priority"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_SALES_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sales-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SalesConsultant
              captures: { c4_err: $.data.error_id }
          assert:
            - "response 404 with error_id ERR_SALES_ORDER_NOT_FOUND"

      - name: home_models_list_pagination
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults"]
        distinguishing_aspect: "3 models exist; limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the remaining 1 with has_more false."
        test_recipe:
          setup: ["three models registered"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "M-1", name: "One", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
            - call: "POST /api/home-models"
              payload: { model_code: "M-2", name: "Two", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
            - call: "POST /api/home-models"
              payload: { model_code: "M-3", name: "Three", floor_plan_type: "TRIPLE_WIDE", section_count: 3, width_ft: 42, length_ft: 66, base_price_cents: 12000000, factory_lead_time_days: 45 }
              as: DealershipAdmin
          trigger:
            - call: "GET /api/home-models?limit=2&offset=0"
              as: SalesConsultant
            - call: "GET /api/home-models?limit=2&offset=2"
              as: SalesConsultant
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: customer_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Customer"]
        distinguishing_aspect: "Client-supplied id and created_at are ignored; server mints a UUID id and stamps created_at from the logical clock default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["empty database; logical clock at default"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A", id: "00000000-0000-0000-0000-000000000000", created_at: "1999-01-01T00:00:00Z" }
              as: SalesConsultant
              captures: { c6_id: $.data.id, c6_created: $.data.created_at, c6_ver: $.data.version }
          assert:
            - "Customer.id != 00000000-0000-0000-0000-000000000000 (server-minted UUID)"
            - "Customer.created_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock, not forged value)"
            - "Customer.version == 1"

      - name: create_home_unit_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.HomeUnit.fields.unit_kind", "errors", "ERR_VALIDATION"]
        distinguishing_aspect: "unit_kind outside {STOCK, FACTORY_ORDER, TRADE_IN} -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["one model exists"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { c7_mdl: $.data.id }
          trigger:
            - call: "POST /api/home-units"
              payload: { model_id: "${c7_mdl}", serial_number: "SN-C7-1", unit_kind: "BROKEN", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { c7_err: $.data.error_id }
          assert:
            - "response 400 with error_id ERR_VALIDATION"

      - name: duplicate_serial_number_rejected
        claim_type: uniqueness
        grounds: ["entities.HomeUnit.fields.serial_number", "validations", "priority", "errors", "ERR_DUPLICATE_RESOURCE"]
        distinguishing_aspect: "Second unit with the same serial_number -> 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["one model and one unit SN-DUP-1 exist"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { c8_mdl: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${c8_mdl}", serial_number: "SN-DUP-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
          trigger:
            - call: "POST /api/home-units"
              payload: { model_id: "${c8_mdl}", serial_number: "SN-DUP-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { c8_err: $.data.error_id }
          assert:
            - "response 409 with error_id ERR_DUPLICATE_RESOURCE"

      - name: lot_fk_reverse_list
        claim_type: parent_relationships
        grounds: ["entities.Lot.fields.community_id"]
        distinguishing_aspect: "GET /api/communities/{id}/lots returns exactly the lots created under that community (FK reverse reachability)."
        test_recipe:
          setup: ["community with two lots; another community with one lot"]
          setup_api_calls:
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { c9_com_a: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Oakhurst", address: "9 Oak Ln", lot_rent_cents: 38000 }
              as: DealershipAdmin
              captures: { c9_com_b: $.data.id }
            - call: "POST /api/communities/${c9_com_a}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
            - call: "POST /api/communities/${c9_com_a}/lots"
              payload: { lot_number: "A-02", max_sections: 1, max_length_ft: 70, utilities_ready: false }
              as: DealershipAdmin
            - call: "POST /api/communities/${c9_com_b}/lots"
              payload: { lot_number: "B-01", max_sections: 1, max_length_ft: 60, utilities_ready: true }
              as: DealershipAdmin
          trigger:
            - call: "GET /api/communities/${c9_com_a}/lots"
              as: SalesConsultant
          assert:
            - "returns exactly 2 lots (A-01, A-02); lot B-01 of the other community is not included"

  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: ["state_machines.SalesOrder", "state_machines.HomeUnit", "state_machines.Lot"]
        distinguishing_aspect: "New SalesOrder starts deal_status DRAFT + payment_status UNPAID; STOCK unit starts AT_DEALER; FACTORY_ORDER unit starts AT_FACTORY; lot starts AVAILABLE."
        test_recipe:
          setup: ["model, community+lot, customer, two units (STOCK and FACTORY_ORDER) exist"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { sm1_mdl: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { sm1_com: $.data.id }
            - call: "POST /api/communities/${sm1_com}/lots"
              payload: { lot_number: "A-01", max_sections: 1, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { sm1_lot: $.data.id, sm1_lot_st: $.data.status }
            - call: "POST /api/lots/${sm1_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { sm1_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${sm1_mdl}", serial_number: "SN-SM1-A", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { sm1_unit_s: $.data.id, sm1_unit_s_st: $.data.status }
            - call: "POST /api/home-units"
              payload: { model_id: "${sm1_mdl}", serial_number: "SN-SM1-B", unit_kind: "FACTORY_ORDER", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { sm1_unit_f_st: $.data.status }
          trigger:
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${sm1_cust}", home_unit_id: "${sm1_unit_s}", placement_type: "COMMUNITY_LOT", lot_id: "${sm1_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 4200000 }
              as: SalesConsultant
              captures: { sm1_deal: $.data.deal_status, sm1_pay: $.data.payment_status }
          assert:
            - "Lot initial status == AVAILABLE (captured at creation)"
            - "HomeUnit STOCK initial status == AT_DEALER; FACTORY_ORDER initial status == AT_FACTORY"
            - "SalesOrder initial deal_status == DRAFT and payment_status == UNPAID"

      - name: confirm_already_confirmed_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.SalesOrder", "errors", "ERR_INVALID_STATE"]
        distinguishing_aspect: "Re-firing confirm on a PENDING_SITE_EVAL order -> 409 ERR_INVALID_STATE (idempotency-by-rejection; no duplicate deposit)."
        test_recipe:
          setup: ["private-land SW139 order confirmed (PENDING_SITE_EVAL)"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { sm2_mdl: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { sm2_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${sm2_mdl}", serial_number: "SN-SM2-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { sm2_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${sm2_cust}", home_unit_id: "${sm2_unit}", placement_type: "PRIVATE_LAND", financing_type: "CHATTEL", agreed_home_price_cents: 4200000 }
              as: SalesConsultant
              captures: { sm2_ord: $.data.id }
            - call: "POST /api/sales-orders/${sm2_ord}/confirm"
              payload: { deposit_cents: 212100 }
              as: SalesConsultant
          trigger:
            - call: "POST /api/sales-orders/${sm2_ord}/confirm"
              payload: { deposit_cents: 212100 }
              as: SalesConsultant
              captures: { sm2_err: $.data.error_id }
          assert:
            - "second confirm -> ERR_INVALID_STATE"
            - "SalesOrder.${sm2_ord}.deposit_cents remains 212100 and deal_status remains PENDING_SITE_EVAL"

      - name: cancel_while_financed_returns_not_cancellable
        claim_type: precondition_enforcement
        grounds: ["validations", "priority", "errors", "ERR_ORDER_NOT_CANCELLABLE"]
        distinguishing_aspect: "Order at AWAITING_DELIVERY with payment_status FINANCED: cancel -> ERR_ORDER_NOT_CANCELLABLE; no compensation fires (unit stays RESERVED, payment stays FINANCED)."
        test_recipe:
          setup: ["canonical community order fully funded (AWAITING_DELIVERY, FINANCED)"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "DW-2860", name: "Pride 2860", floor_plan_type: "DOUBLE_WIDE", section_count: 2, width_ft: 28, length_ft: 60, base_price_cents: 9500000, factory_lead_time_days: 30 }
              as: DealershipAdmin
              captures: { sm3_mdl: $.data.id }
            - call: "POST /api/communities"
              payload: { name: "Pinewood MHC", address: "12 Pine Rd", lot_rent_cents: 45000 }
              as: DealershipAdmin
              captures: { sm3_com: $.data.id }
            - call: "POST /api/communities/${sm3_com}/lots"
              payload: { lot_number: "A-01", max_sections: 2, max_length_ft: 70, utilities_ready: true }
              as: DealershipAdmin
              captures: { sm3_lot: $.data.id }
            - call: "POST /api/lots/${sm3_lot}/reserve"
              as: SalesConsultant
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { sm3_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${sm3_mdl}", serial_number: "SN-SM3-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { sm3_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${sm3_cust}", home_unit_id: "${sm3_unit}", placement_type: "COMMUNITY_LOT", lot_id: "${sm3_lot}", financing_type: "CHATTEL", agreed_home_price_cents: 9200000 }
              as: SalesConsultant
              captures: { sm3_ord: $.data.id }
            - call: "POST /api/sales-orders/${sm3_ord}/options"
              payload: { option_code: "OPT-APP", description: "Appliance package", unit_price_cents: 125050, quantity: 2 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${sm3_ord}/options"
              payload: { option_code: "OPT-EXT", description: "Exterior package", unit_price_cents: 89999, quantity: 1 }
              as: SalesConsultant
            - call: "POST /api/sales-orders/${sm3_ord}/confirm"
              payload: { deposit_cents: 473600 }
              as: SalesConsultant
              captures: { sm3_ord_v: $.data.version }
            - call: "POST /api/sales-orders/${sm3_ord}/site-evaluations"
              payload: { scheduled_date: "2026-08-05T09:00:00Z", evaluator_id: "eval-1", expected_sales_order_version: "${sm3_ord_v}" }
              as: SalesConsultant
              captures: { sm3_ev: $.data.id }
            - call: "POST /api/site-evaluations/${sm3_ev}/record-findings"
              payload: { foundation_type: "PIERS", utilities_verified: true, permit_number: "P-100", findings_result: "PASS", install_estimate_cents: 350000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
            - call: "POST /api/site-evaluations/${sm3_ev}/approve"
              as: InstallationManager
            - call: "GET /api/sales-orders/${sm3_ord}"
              as: SalesConsultant
              captures: { sm3_ord_v2: $.data.version }
            - call: "POST /api/sales-orders/${sm3_ord}/financing-applications"
              payload: { financing_type: "CHATTEL", lender_name: "Cascade Finance", term_months: 240, down_payment_cents: 473600, expected_sales_order_version: "${sm3_ord_v2}" }
              as: SalesConsultant
              captures: { sm3_app: $.data.id }
            - call: "POST /api/financing-applications/${sm3_app}/submit"
              as: SalesConsultant
            - call: "POST /api/financing-applications/${sm3_app}/decide"
              payload: { decision: "APPROVE", apr_bps: 725 }
              as: LenderAgent
            - call: "POST /api/home-units/${sm3_unit}/title-records"
              payload: { title_type: "MANUFACTURED_CERTIFICATE", state_code: "AL" }
              as: DealershipAdmin
              captures: { sm3_tr: $.data.id }
            - call: "POST /api/title-records/${sm3_tr}/issue"
              as: DealershipAdmin
            - call: "POST /api/financing-applications/${sm3_app}/fund"
              payload: { funded_amount_cents: 8998397 }
              as: LenderAgent
          trigger:
            - call: "POST /api/sales-orders/${sm3_ord}/cancel"
              as: SalesConsultant
              captures: { sm3_err: $.data.error_id }
          assert:
            - "cancel -> ERR_ORDER_NOT_CANCELLABLE"
            - "SalesOrder.${sm3_ord}.deal_status remains AWAITING_DELIVERY and payment_status remains FINANCED"
            - "HomeUnit.${sm3_unit}.status remains RESERVED"

      - name: eval_approve_bubbles_order_to_site_approved
        claim_type: side_effect_execution
        grounds: ["state_machines.SiteEvaluation.FINDINGS_RECORDED_to_APPROVED"]
        distinguishing_aspect: "Bubble-up: approving the order's latest evaluation moves the order PENDING_SITE_EVAL -> SITE_APPROVED in the same request."
        test_recipe:
          setup: ["private-land SW139 order PENDING_SITE_EVAL with a SCHEDULED evaluation"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
              as: DealershipAdmin
              captures: { sm4_mdl: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Alicia Buyer", email: "alicia@x.com", phone: "555-0100", credit_tier: "TIER_A" }
              as: SalesConsultant
              captures: { sm4_cust: $.data.id }
            - call: "POST /api/home-units"
              payload: { model_id: "${sm4_mdl}", serial_number: "SN-SM4-1", unit_kind: "STOCK", condition_grade: "NEW" }
              as: DealershipAdmin
              captures: { sm4_unit: $.data.id }
            - call: "POST /api/sales-orders"
              payload: { customer_id: "${sm4_cust}", home_unit_id: "${sm4_unit}", placement_type: "PRIVATE_LAND", financing_type: "CHATTEL", agreed_home_price_cents: 4200000 }
              as: SalesConsultant
              captures: { sm4_ord: $.data.id }
            - call: "POST /api/sales-orders/${sm4_ord}/confirm"
              payload: { deposit_cents: 212100 }
              as: SalesConsultant
              captures: { sm4_ord_v: $.data.version }
            - call: "POST /api/sales-orders/${sm4_ord}/site-evaluations"
              payload: { scheduled_date: "2026-08-05T09:00:00Z", evaluator_id: "eval-1", expected_sales_order_version: "${sm4_ord_v}" }
              as: SalesConsultant
              captures: { sm4_ev: $.data.id }
            - call: "POST /api/site-evaluations/${sm4_ev}/record-findings"
              payload: { foundation_type: "SLAB", utilities_verified: true, permit_number: "P-400", findings_result: "CONDITIONAL", install_estimate_cents: 180000 }
              as: SiteEvaluator
              as_user_id: "eval-1"
          trigger:
            - call: "POST /api/site-evaluations/${sm4_ev}/approve"
              as: InstallationManager
              captures: { sm4_ev_st: $.data.status }
            - call: "GET /api/sales-orders/${sm4_ord}"
              as: SalesConsultant
              captures: { sm4_deal: $.data.deal_status }
          assert:
            - "SiteEvaluation.${sm4_ev}.status == APPROVED (CONDITIONAL findings are approvable)"
            - "SalesOrder.${sm4_ord}.deal_status == SITE_APPROVED (bubble-up side effect)"

      - name: eval_reject_returns_order_to_draft
        claim_type: valid_transition
        grounds: ["state_machines.SiteEvaluation.FINDINGS_RECORDED_to_REJECTED"]
        distinguishing_aspect: "Branching revert: rejecting the evaluation loops the order back to DRAFT for reconfiguration; a subsequent confirm succeeds (cycle DRAFT -> PENDING_SITE_EVAL -> DRAFT -> PENDING_SITE_EVAL)."
        test_recipe:
          setup: ["private-land SW139 order PENDING_SITE_EVAL with FINDINGS_RECORDED evaluation (FAIL result)"]
          setup_api_calls:
            - call: "POST /api/home-models"
