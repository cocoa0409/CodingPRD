        claim_type: Violation → Error
        grounds:
          - entities.Order.fields.ship_to_zone
          - endpoints[POST /clients/{clientId}/orders]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          ship_to_zone is constrained 1..8; importing an order with ship_to_zone=9
          is rejected with ERR_INVALID_REQUEST (400), no order created.
