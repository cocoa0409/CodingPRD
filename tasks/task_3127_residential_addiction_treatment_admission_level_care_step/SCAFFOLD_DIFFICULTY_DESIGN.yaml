- rule_id: cross_entity_state_dependency
  instances:
  - name: admission_gated_on_authorization_days_and_clearance_effective_status
    grounds:
    - state_machines.TreatmentEpisode.clinical_status.AWAITING_ADMISSION_to_IN_TREATMENT
    - state_machines.LevelOfCareAuthorization.APPROVED_to_EXHAUSTED
    - entities.MedicalClearance.fields.effective_status
    - errors[ERR_AUTHORIZATION_DAYS_EXHAUSTED]
    distinguishing_aspect: 'The ADMIT transition''s legality is decided entirely by two OTHER entities
      with no reference to its own fields: it fires only while the LevelOfCareAuthorization''s days_remaining
      is strictly greater than 0 AND every MedicalClearance reads CLEARED, and the same episode in the
      identical state is admitted after exactly one more clearance is recorded — so the TreatmentEpisode
      ↔ {LevelOfCareAuthorization, MedicalClearance} pair is the load-bearing dependency.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z on a licensed MN facility with two beds.
      - An episode in AWAITING_ADMISSION with an APPROVED 14-day ASAM_3_5 authorization, an ACTIVE treatment
        plan, a MEDICALLY_STABLE withdrawal plan and only the MEDICAL clearance recorded.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
