      # ---- rbac corners already asserted by §1.8 (difficulty design) ----
      - name: rbac_plant_admin_void_override_after_a_warranty_agent_approval
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
          - roles.WarrantyAgent.exclusive_operations
          - roles.PlantAdmin.exclusive_operations
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "That instance already runs the full two-role override: the WarrantyAgent approves a claim against the model reserve and PlantAdmin — and only PlantAdmin — voids it, with the reserve ledger asserted before and after, so both roles' exclusive operations are positively exercised there."

      - name: rbac_logistics_planner_owns_store_and_release_storage_end_to_end
        claim_type: "Can perform all exclusive_operations and shared_operations"
        grounds:
          - roles.LogisticsPlanner.exclusive_operations
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / finished_unit_store_gated_by_warehouse_frozen_posture"
          rationale: "That instance drives POST /finished-units/{id}/store and POST /finished-units/{id}/release-storage as LogisticsPlanner across a posture change and asserts the resulting zone and posture arithmetic, which is the positive exercise of those two exclusive operations."

  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers
  # Claim rows from claim-extraction-guide.md "From Cross-Cutting Complexity
  # Layers", restricted to the layers complexity_profile actually declares:
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation.
  # The fourth declared layer, selector_policy, has no guide row of its own, so
  # it is not emitted as a layer claim here (the mould selector is exercised
  # through the endpoints and errors sections instead).
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: layer_optimistic_concurrency_every_parent_version_moves_by_exactly_one_per_write
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules
          - entities.ProductModel.fields.version
          - entities.Warehouse.fields.version
          - entities.ResinLot.fields.version
          - entities.Shipment.fields.version
          - entities.ProductionOrder.fields.version
        distinguishing_aspect: |
          All five OCC parents are audited in one run: each successful write
          advances that parent's version by exactly 1 — never 2, even when the
          write fans out a cascade — and a write refused by the role gate
          advances it by 0, so an implementation that bumps per side effect or
          bumps on failure is detected.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED in WH-CD, LOT-CD-1 AVAILABLE with 476.000 kg free, and PO-CD-1 COMPLETE."
            - "Logical clock at 2026-08-01T10:35:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
          trigger:
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pmv_a: $.data.version }
            - call: "PATCH /product-models/${pm}"
              payload: { min_cooling_minutes: 31 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pmv_b: $.data.version }
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { whv_a: $.data.version }
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "seasonal reallocation" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { whv_b: $.data.version }
            - call: "POST /finished-units/${fu2}/release-storage"
              payload: { release_reason: "seasonal reallocation" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { whv_c: $.data.version }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lv_a: $.data.version }
            - call: "POST /resin-lots/${lot}/quarantine"
              payload: { quarantine_reason: "colour drift suspected" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { lv_b: $.data.version }
            - call: "POST /resin-lots/${lot}/release-quarantine"
              payload: { release_note: "retest passed" }
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { lv_c: $.data.version }
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CD-L1", origin_warehouse_id: "${wh}", destination_zone: "Z1", carrier_code: "CARR-CD", trailer_cube_capacity_m3: 10.0000, trailer_max_payload_kg: 100.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shpl: $.data.id, sv_a: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shpl}", finished_unit_id: "${fu2}", expected_shipment_version: "${sv_a}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shpl}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sv_b: $.data.version }
            - call: "POST /production-orders"
              payload: { order_code: "PO-CD-L", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pol: $.data.id, polv_a: $.data.version }
            - call: "POST /production-orders/${pol}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { polv_b: $.data.version }
          assert:
            - "${pmv_b} == ${pmv_a} + 1 and the PATCH response reports min_cooling_minutes 31"
            - "${whv_b} == ${whv_a} + 1 even though the release-storage fired CASCADE-C (anchor promotion, committed-cube recompute and posture recompute) — one write, one version"
            - "${whv_c} == ${whv_b}: the AssemblyTechnician release-storage returned 403 ERR_ROLE_NOT_PERMITTED and consumed no version"
            - "FinishedUnit.${fu1}.logistics_status == 'UNALLOCATED' and FinishedUnit.${fu2}.logistics_status == 'STORED' after those two calls"
            - "${lv_b} == ${lv_a} + 1 and ResinLot.${lot}.status == 'QUARANTINED' after the quarantine"
            - "${lv_c} == ${lv_b} + 1 and ResinLot.${lot}.status == 'AVAILABLE' after the release, so the two CASCADE-F/CASCADE-E heads bump one version each"
            - "${sv_a} == 1 on the freshly created shipment and ${sv_b} == ${sv_a} + 1 after the single line add"
            - "${polv_a} == 1 on the DRAFT order and ${polv_b} == ${polv_a} + 1 after the release, with status 'READY_TO_SCHEDULE'"

      - name: layer_cascading_side_effects_customer_suspension_voids_open_claims_without_moving_the_reserve
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - "endpoints.POST_/customers/{customer_id}/suspend"
          - "endpoints.POST_/customers/{customer_id}/reinstate"
          - state_machines.WarrantyClaim
          - errors.ERR_CUSTOMER_NOT_ACTIVE
          - validations.priority_60
        distinguishing_aspect: |
          Suspending a customer voids its open claim as a side effect yet moves no
          money — warranty_reserve_cents and warranty_paid_cents are both
          untouched, because no payout had been booked — and reinstating the
          customer does NOT resurrect the voided claim, it only makes the next
          intake possible again.
        test_recipe:
          setup:
            - "Base plant with hulls 1 and 2 delivered to Customer CUS-CD-1 on shipment SHP-CD-1 (delivered_at 2026-08-02T09:00:00Z), guidance acknowledged at 2026-08-01T10:35:00Z."
