            - "response.data.error_id == ERR_WINDOW_BEFORE_READY"

      - name: install_crew_not_certified_for_finish_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=11]
          - entities.Crew.fields.skill_finishes
          - errors[ERR_CREW_NOT_CERTIFIED]
        distinguishing_aspect: "Assigning a crew whose skill_finishes lacks the project finish (SOLID_WOOD) -> ERR_CREW_NOT_CERTIFIED (422)."
