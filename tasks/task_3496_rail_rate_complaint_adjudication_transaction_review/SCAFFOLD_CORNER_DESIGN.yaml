            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "DISMISSED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MARKET_DOMINANCE_PRESENT and http status 409"
            - "RateComplaint.${rc1}.status == EVIDENTIARY_PHASE (unchanged)"

      - name: stale_evidence_window_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICE_FAILURE_WINDOW_EXPIRED]
        distinguishing_aspect: "Petition created 2026-11-25T00:00:00Z against evidence complaint created 2026-09-01T00:00:00Z: 85 days > 84-day freshness window, so even with the complaint ESCALATED and the carrier matching, GRANT fails ERR_SERVICE_FAILURE_WINDOW_EXPIRED (422). At exactly 84 days (2026-11-24) the same grant succeeds."
        test_recipe:
          setup:
            - "Carrier CSXT. Service complaint SC created 2026-09-01T00:00:00Z, escalated. Petition P1 created at 2026-11-25T00:00:00Z (stale) and petition P2 created at 2026-11-24T00:00:00Z (exactly 84 days) — separate shippers to avoid the duplicate-petition rule."
          setup_api_calls:
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-gal", carrier_id: "${c1}", issue_type: "DELAY", territory_code: "GULF-COAST" }
              as: Shipper
              as_user_id: "shp-gal"
              captures: { sc1: $.data.id }
            - call: "POST /stb/service-complaints/${sc1}/escalate"
              payload: { directive: "Restore service within 72 hours" }
              as: BoardAdjudicator
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-11-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/reciprocal-switching-petitions"
              payload: { shipper_id: "shp-s2", incumbent_carrier_id: "${c1}", interchange_code: "IX-KC", facility_distance_miles: 10, evidence_service_complaint_id: "${sc1}", service_start_date: "2027-01-01", service_end_date: "2027-03-01" }
              as: Shipper
              as_user_id: "shp-s2"
              captures: { p2: $.data.id }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-11-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stb/reciprocal-switching-petitions"
              payload: { shipper_id: "shp-s1", incumbent_carrier_id: "${c1}", interchange_code: "IX-KC", facility_distance_miles: 10, evidence_service_complaint_id: "${sc1}", service_start_date: "2027-01-01", service_end_date: "2027-03-01" }
              as: Shipper
              as_user_id: "shp-s1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /stb/reciprocal-switching-petitions/${p1}/decide"
              payload: { outcome: "GRANTED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
            - call: "POST /stb/reciprocal-switching-petitions/${p2}/decide"
              payload: { outcome: "GRANTED" }
              as: BoardAdjudicator
          assert:
            - "P1 (85 days): err == ERR_SERVICE_FAILURE_WINDOW_EXPIRED and http status 422; status stays FILED"
            - "P2 (exactly 84 days): granted, ReciprocalSwitchingPetition.${p2}.status == GRANTED"

      - name: merger_decide_before_comment_close_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_COMMENT_PERIOD_OPEN]
        distinguishing_aspect: "Merger created at the clock default closes comments at 2026-10-16T00:00:00Z: decide one second early fails ERR_COMMENT_PERIOD_OPEN; at exactly comment_close_at the same call succeeds (>= boundary)."
        test_recipe:
          setup:
            - "Carriers CSXT, NSOR. Merger M1 (scores 40,50,40 -> 43.00) created at 2026-09-01T00:00:00Z."
          setup_api_calls:
