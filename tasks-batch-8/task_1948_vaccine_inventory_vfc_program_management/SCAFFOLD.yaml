    output: BorrowTicket
    side_effects: []

  - method: POST
    path: "/provider-sites/{id}/borrow-tickets/{ticketId}/record-payback"
    description: "Record a (possibly partial) payback against an open ticket"
    roles: [VaccineManager]
    code: 200
    input: [payback_quantity, paying_lot_id, expected_borrow_ticket_version]
    output: BorrowTicket
    side_effects:
      - "BorrowTicket.paid_back_quantity += payback_quantity"
      - "paying_lot.quantity_on_hand -= payback_quantity  (physical doses leave the paying lot)"
      - "BorrowTicket.from_lot.quantity_on_hand += payback_quantity  (physical doses return to the lender lot)"
      - "BorrowTicket.to_lot.quantity_borrowed_in -= payback_quantity  (IOU amortized)"
      - "If paid_back_quantity == borrowed_quantity: status -> REPAID; else -> PARTIALLY_REPAID"
      - "ProviderSite.private_lending_balance recomputed"
      - "increments BorrowTicket.version by 1"

  - method: POST
    path: "/provider-sites/{id}/borrow-tickets/{ticketId}/void"
    description: "Void an OPEN ticket that has had no paybacks and whose borrowed IOU is intact"
    roles: [VaccineManager]
    code: 200
    input: []
    output: BorrowTicket
    side_effects:
      - "status -> VOIDED"
      - "Reverses the original borrow: from_lot.quantity_on_hand += borrowed_quantity; to_lot.quantity_borrowed_in -= borrowed_quantity"
      - "ProviderSite.private_lending_balance recomputed"

