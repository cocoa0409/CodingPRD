scenario: |
  Generate task harder than expert level!

  2414. Freestanding Emergency Department Operations & Disclosure Compliance (freestanding emergency department): patient-facing disclosure of emergency facility fees and network status at registration, medical screening examination obligations and stabilization requirements, transfer agreements with hospitals and ambulance memoranda of understanding, observation versus transfer decision-making without inpatient beds, on-site imaging, laboratory and pharmacy scope limits, balance-billing protections and independent dispute resolution for out-of-network claims, state licensure category and signage requirements, patient volume forecasting and physician coverage minimums
domain_name: freestanding-emergency-department-compliance
api_prefix: ""            # flat topology: /facilities, /encounters, /transfer-orders, /claims, /dispute-cases

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # flat: peer entities linked by FK (facility_id, encounter_id, claim_id); nesting in URLs
  # is used only for creation/collection reads, never as an ownership chain deeper than one level.

  state_machine_shape: cyclic
  # Encounter carries two independent state dimensions (clinical_state x disclosure_state) and a
  # clinical cycle OBSERVATION -> TRANSFER_PENDING -> OBSERVATION; DisputeCase cycles
  # OPEN_NEGOTIATION -> OFFER_PENDING -> OPEN_NEGOTIATION with a bounded round counter;
  # Facility posture is compound (derived from licensure + signage + defect counter).

  relationship_patterns:
    - one_to_many          # Facility -> Encounter / DisclosureTemplate / PayerContract / MOU / Agreement / Shift / Forecast
    - polymorphic          # ComplianceLedgerEntry.subject_type + subject_id point at several entity kinds
    - cross_aggregate      # Claim couples Encounter (clinical aggregate) with PayerContract (contract aggregate)

  role_model: segregation_of_duties
  # The user who publishes a disclosure template may not attest that facility's signage; the clerk who
  # registered an encounter may not record its emergent disclosure waiver; the compliance officer who
  # created a claim may not adjudicate it.

  consistency_model: immediate

difficulty_level: expert_plus
# 13 entities / 48 endpoints / 41 error codes / 8 calculations (3 dual-variant) / 6 state machines
# (two non-linear) / 3 OCC rules. Density target: every write endpoint touches at least two entities.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the freestanding emergency department
        constraints: 1..200 chars, non-blank
      - name: state_code
        type: string
        source: input
        description: two-letter state code whose licensure and balance-billing regime applies
        constraints: exactly 2 uppercase letters
      - name: license_category
        type: enum
        source: input
        description: state licensure category, drives required signage set
        constraints: "INDEPENDENT_FREESTANDING_ED | HOSPITAL_OUTPATIENT_DEPARTMENT_OFF_CAMPUS"
      - name: license_status
        type: enum
        source: input
        description: current licensure standing, settable through PATCH /facilities/{id}
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: signage_attestation_status
        type: enum
        source: system
        description: signage compliance standing; PENDING at creation, ATTESTED by a signage attestation, LAPSED when a posture recomputation observes logical clock >= signage_expires_at
        default: PENDING
        constraints: "PENDING | ATTESTED | LAPSED"
      - name: signage_attested_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent accepted signage attestation; null while PENDING
        default: null
      - name: signage_expires_at
        type: datetime
        source: computed
        description: signage_attested_at + SIGNAGE_VALIDITY_DAYS (365) days; null while PENDING
        default: null
      - name: signage_attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed the most recent signage attestation; used by the segregation-of-duties check
        default: null
      - name: observation_bed_count
        type: integer
        source: input
        description: licensed observation (non-inpatient) bed count
        constraints: ">= 0"
      - name: observation_beds_occupied
        type: integer
        source: computed
        description: count of Encounter rows of this facility whose observation_bed_held == true
        default: 0
      - name: imaging_scope
        type: array
        source: input
        description: on-site imaging modalities the facility is licensed to perform
        constraints: "subset of {XRAY, CT, ULTRASOUND, MRI}, may be empty"
      - name: lab_scope
        type: array
        source: input
        description: on-site laboratory assays the facility is licensed to perform
        constraints: "subset of {CBC, CHEMISTRY, TROPONIN, BLOOD_CULTURE}, may be empty"
      - name: pharmacy_scope_tier
        type: enum
        source: input
        description: pharmacy formulary scope; EMERGENCY_ONLY permits {ANALGESIC, ANTIBIOTIC}, EXTENDED additionally permits THROMBOLYTIC
        constraints: "EMERGENCY_ONLY | EXTENDED"
      - name: max_concurrent_physicians
        type: integer
        source: input
        description: aggregate cap on PhysicianShift rows with role_type == PHYSICIAN overlapping any instant
        constraints: ">= 1"
      - name: open_compliance_defect_count
        type: integer
        source: computed
        description: running count of unresolved compliance defects (disclosure refusals, disclosure defects, screening delays, insurance-based transfer declines) recorded against this facility
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: derived gate over child operations; recomputed after every facility-scoped mutation per calculations.facility_compliance_posture
        default: RESTRICTED
        constraints: "OPEN | RESTRICTED | SUSPENDED"
      - name: restricted_service_codes
        type: array
        source: computed
        description: ancillary codes blocked by the current posture - [] when OPEN, [MRI, THROMBOLYTIC] when RESTRICTED, all 11 codes when SUSPENDED
        default: "[MRI, THROMBOLYTIC]"
      - name: current_published_template_id
        type: string
        source: computed
        description: id of the single DisclosureTemplate of this facility whose status == PUBLISHED; null when no template is published
        default: null
      - name: ambulance_units_committed_total
        type: integer
        source: computed
        description: sum of AmbulanceMOU.units_committed over MOUs of this facility with status == ACTIVE
        default: 0
      - name: ambulance_units_reserved_total
        type: integer
        source: computed
        description: sum of AmbulanceMOU.units_reserved over MOUs of this facility with status == ACTIVE
        default: 0
      - name: transfer_capacity_state
        type: enum
        source: computed
        description: AVAILABLE when ambulance_units_committed_total - ambulance_units_reserved_total > 0, else SATURATED
        default: SATURATED
        constraints: "AVAILABLE | SATURATED"
      - name: coverage_deficit_flag
        type: boolean
        source: computed
        description: true when the facility's selected ACTIVE VolumeForecast has coverage_deficit_hours > 0 as of the most recent coverage evaluation
        default: false

  - name: DisclosureTemplate
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility whose registration desk presents this template
      - name: version_label
        type: string
        source: input
        description: human-readable version label, unique per facility
        constraints: 1..40 chars
      - name: supersedes_version_label
        type: string
        source: input
        description: version_label this draft is intended to replace; informational only, no referential check
        default: null
      - name: facility_fee_cents
        type: integer
        source: input
        description: disclosed emergency facility fee in cents, billed once per encounter
        constraints: ">= 0"
      - name: observation_hourly_cents
        type: integer
        source: input
        description: disclosed observation hourly rate in cents (disclosure text only; not billed by calculations)
        constraints: ">= 0"
      - name: network_status_statement
        type: enum
        source: input
        description: patient-facing network status statement printed on the disclosure
        constraints: "IN_NETWORK_WITH_SOME_PLANS | OUT_OF_NETWORK_ALL_PLANS | NETWORK_VARIES_BY_PLAN"
      - name: required_signage_elements
        type: array
        source: input
        description: signage elements this template's disclosure text depends on
        constraints: "subset of {LICENSE_CATEGORY_SIGN, FEE_DISCLOSURE_SIGN, NETWORK_STATUS_SIGN, NOT_A_URGENT_CARE_SIGN}"
      - name: status
        type: enum
        source: system
        description: lifecycle status; DRAFT at creation, PUBLISHED by publish, RETIRED when superseded by a later publish
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of publication; null while DRAFT
        default: null
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the FacilityAdministrator who published this template; compared against the signage attester by the segregation-of-duties check
        default: null

  - name: PayerContract
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility this payer relationship belongs to
      - name: payer_name
        type: string
        source: input
        description: health plan or issuer name
        constraints: 1..120 chars
      - name: network_status
        type: enum
        source: input
        description: whether the facility participates in this payer's network for emergency services
        constraints: "IN_NETWORK | OUT_OF_NETWORK"
      - name: qualifying_payment_amount_cents
        type: integer
        source: input
        description: qualifying payment amount (QPA) the plan recognizes for the emergency service bundle, in cents
        constraints: ">= 0"
      - name: in_network_coinsurance_rate
        type: number
        source: input
        description: patient coinsurance rate applied to post-deductible allowed amounts
        constraints: "0 <= rate <= 1, at most 4 decimal places"
      - name: in_network_deductible_remaining_cents
        type: integer
        source: input
        description: remaining in-network deductible in cents at the time of adjudication
        constraints: ">= 0"
      - name: state_protection_regime
        type: enum
        source: input
        description: state balance-billing regime for freestanding EDs under this contract
        constraints: "FEDERAL_NSA_ONLY | STATE_PROTECTED_FSED | STATE_EXEMPT_FSED"
      - name: effective_start_date
        type: string
        source: input
        description: inclusive first date the contract is in force (YYYY-MM-DD)
      - name: effective_end_date
        type: string
        source: input
        description: inclusive last date the contract is in force (YYYY-MM-DD)
      - name: status
        type: enum
        source: computed
        description: ACTIVE when effective_start_date <= logical-clock date <= effective_end_date, else TERMINATED; re-evaluated on every read and on every validation that references it
        default: ACTIVE
        constraints: "ACTIVE | TERMINATED"
      - name: idr_eligible
        type: boolean
        source: computed
        description: true when network_status == OUT_OF_NETWORK and state_protection_regime != STATE_EXEMPT_FSED
        default: false

  - name: PhysicianShift
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility this coverage block staffs
      - name: clinician_user_id
        type: string
        source: input
        description: opaque EmergencyPhysician operator id staffing the block; never required to equal any entity id
        constraints: 1..64 chars
      - name: role_type
        type: enum
        source: input
        description: coverage role; only PHYSICIAN blocks count toward coverage minimums and the concurrency cap
        constraints: "PHYSICIAN | ADVANCED_PRACTICE_PROVIDER"
      - name: board_certified
        type: boolean
        source: input
        description: whether the staffing clinician is board certified in emergency medicine
      - name: start_utc
        type: datetime
        source: input
        description: inclusive start of the coverage block (half-open interval start)
      - name: end_utc
        type: datetime
        source: input
        description: exclusive end of the coverage block (half-open interval end); must be > start_utc
      - name: duration_hours
        type: number
        source: computed
        description: (end_utc - start_utc) in hours, rounded half-up to 2 decimals

  - name: VolumeForecast
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility whose patient volume is forecast
      - name: period_start_date
        type: string
        source: input
        description: inclusive first date of the forecast period (YYYY-MM-DD)
      - name: period_days
        type: integer
        source: input
        description: number of days in the forecast period
        constraints: "1..90"
      - name: historical_daily_volumes
        type: array
        source: input
        description: ordered array of prior daily encounter counts, oldest first; may be empty
        constraints: "each element integer >= 0, at most 60 elements"
      - name: method
        type: enum
        source: input
        description: forecast variant selector; may be rewritten to PEAK_ADJUSTED by a posture-escalation cascade
        constraints: "TRAILING_MEAN | PEAK_ADJUSTED"
      - name: forecast_basis
        type: enum
        source: computed
        description: HISTORY when historical_daily_volumes is non-empty, FLOOR_ONLY when it is empty
        default: HISTORY
        constraints: "HISTORY | FLOOR_ONLY"
      - name: forecast_daily_volume
        type: number
        source: computed
        description: forecast daily arrival volume produced by calculations.required_physician_coverage, 2 decimals
        default: 0
      - name: required_physician_hours_per_day
        type: number
        source: computed
        description: physician coverage hours required per day, quarter-hour granularity, floored at COVERAGE_FLOOR_HOURS_PER_DAY
        default: 12
      - name: required_physician_hours_total
        type: number
        source: computed
        description: required_physician_hours_per_day * period_days, 2 decimals
        default: 0
      - name: required_board_certified_hours_total
        type: number
        source: computed
        description: required_physician_hours_total * BOARD_CERT_MIN_SHARE, rounded half-up to 2 decimals
        default: 0
      - name: scheduled_physician_hours
        type: number
        source: computed
        description: PhysicianShift hours with role_type == PHYSICIAN clipped to the forecast period, per calculations.coverage_reconciliation
        default: 0
      - name: coverage_deficit_hours
        type: number
        source: computed
        description: max(0, required_physician_hours_total - scheduled_physician_hours), 2 decimals
        default: 0
      - name: escalated_by_posture
        type: boolean
        source: computed
        description: true when a Facility posture escalation to RESTRICTED rewrote this forecast's method to PEAK_ADJUSTED
        default: false
      - name: status
        type: enum
        source: computed
        description: ACTIVE at creation; set to SUPERSEDED when a later forecast is created for the same facility_id and period_start_date
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility where the patient registered
      - name: pinned_disclosure_template_id
        type: string
        source: system
        description: FK -> DisclosureTemplate.id; the facility's PUBLISHED template at registration time, pinned for the life of the encounter
      - name: patient_reference
        type: string
        source: input
        description: opaque patient reference recorded at registration
        constraints: 1..64 chars
      - name: acuity_level
        type: integer
        source: input
        description: triage acuity, 1 = least acute .. 5 = most acute; drives ancillary allowance, ambulance level and capability tier
        constraints: "1..5"
      - name: presenting_service_line
        type: enum
        source: input
        description: clinical service line the presentation belongs to; must match a transfer agreement's service_line to transfer
        constraints: "GENERAL_MEDICAL | CARDIAC | STROKE | TRAUMA | PEDIATRIC | PSYCHIATRIC"
      - name: arrival_at
        type: datetime
        source: system
        description: logical-clock instant at registration
      - name: registered_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegistrationClerk who registered the encounter; compared against the waiver recorder by the segregation-of-duties check
      - name: clinical_state
        type: enum
        source: system
        description: clinical dimension of the encounter state, independent of disclosure_state
        default: ARRIVED
        constraints: "ARRIVED | MSE_IN_PROGRESS | MSE_COMPLETE | OBSERVATION | TRANSFER_PENDING | TRANSFERRED | DISCHARGED"
      - name: disclosure_state
        type: enum
        source: system
        description: disclosure dimension of the encounter state, independent of clinical_state
        default: DISCLOSURE_PRESENTED
        constraints: "DISCLOSURE_PRESENTED | DISCLOSURE_ACKNOWLEDGED | DISCLOSURE_REFUSED | DISCLOSURE_WAIVED_EMERGENT | DISCLOSURE_DEFECT"
      - name: disclosure_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the clerk who recorded the disclosure decision; null while DISCLOSURE_PRESENTED
        default: null
      - name: disclosed_estimate_cents
        type: integer
        source: computed
        description: good-faith estimate disclosed at registration, per calculations.disclosed_estimate
        default: 0
      - name: mse_start_deadline_at
        type: datetime
        source: computed
        description: arrival_at + MSE_START_DEADLINE_MINUTES (30) minutes
      - name: mse_started_at
        type: datetime
        source: system
        description: logical-clock instant the medical screening examination began; null before
        default: null
      - name: mse_completed_at
        type: datetime
        source: system
        description: logical-clock instant the medical screening examination completed; null before
        default: null
      - name: mse_physician_user_id
        type: string
        source: system
        description: X-User-ID of the EmergencyPhysician who began the medical screening examination
        default: null
      - name: mse_timeliness
        type: enum
        source: computed
        description: PENDING before the screening starts, then ON_TIME when mse_started_at <= mse_start_deadline_at, LATE when strictly after
        default: PENDING
        constraints: "PENDING | ON_TIME | LATE"
      - name: stabilization_status
        type: enum
        source: input
        description: stabilization finding recorded at screening completion
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | STABLE | UNSTABLE"
      - name: observation_bed_held
        type: boolean
        source: computed
        description: true from the moment the encounter enters OBSERVATION until it reaches TRANSFERRED or DISCHARGED; counted by Facility.observation_beds_occupied
        default: false
      - name: observation_started_at
        type: datetime
        source: system
        description: logical-clock instant the encounter first entered OBSERVATION
        default: null
      - name: declined_transfer_count
        type: integer
        source: computed
        description: count of TransferOrder rows of this encounter with status == DECLINED
        default: 0

  - name: AncillaryOrder
    parent: null
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: FK -> Encounter.id; the encounter the service was ordered for
      - name: category
        type: enum
        source: input
        description: ancillary service family, scope-checked against the facility's licensed scope
        constraints: "IMAGING | LABORATORY | PHARMACY"
      - name: code
        type: enum
        source: input
        description: specific service code; must belong to category and to the facility's licensed scope
        constraints: "XRAY | CT | ULTRASOUND | MRI | CBC | CHEMISTRY | TROPONIN | BLOOD_CULTURE | ANALGESIC | ANTIBIOTIC | THROMBOLYTIC"
      - name: quantity
        type: integer
        source: input
        description: number of units ordered
        constraints: ">= 1"
      - name: unit_charge_cents
        type: integer
        source: computed
        description: charge per unit pulled from ANCILLARY_UNIT_CHARGE_CENTS by code
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: unit_charge_cents * quantity
        default: 0
      - name: status
        type: enum
        source: system
        description: ORDERED at creation; RESULTED or CANCELLED through the resolve endpoint; only RESULTED lines are billed
        default: ORDERED
        constraints: "ORDERED | RESULTED | CANCELLED"

  - name: TransferAgreement
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the freestanding ED side of the agreement
      - name: destination_hospital_name
        type: string
        source: input
        description: receiving hospital name
        constraints: 1..120 chars
      - name: service_line
        type: enum
        source: input
        description: service line the receiving hospital accepts under this agreement
        constraints: "GENERAL_MEDICAL | CARDIAC | STROKE | TRAUMA | PEDIATRIC | PSYCHIATRIC"
      - name: capability_tier
        type: integer
        source: input
        description: receiving hospital capability tier, 1 = basic .. 4 = comprehensive
        constraints: "1..4"
      - name: accepts_unstable
        type: boolean
        source: input
        description: whether the receiving hospital accepts patients with stabilization_status == UNSTABLE
      - name: effective_start_date
        type: string
        source: input
        description: inclusive first date of the agreement window (YYYY-MM-DD)
      - name: effective_end_date
        type: string
        source: input
        description: inclusive last date of the agreement window (YYYY-MM-DD); must be >= effective_start_date
      - name: status
        type: enum
        source: computed
        description: PENDING while the logical-clock date is before effective_start_date, ACTIVE when effective_start_date <= logical-clock date <= effective_end_date, EXPIRED once the clock date is past effective_end_date; re-evaluated on every read and validation
        default: PENDING
        constraints: "PENDING | ACTIVE | EXPIRED"

  - name: AmbulanceMOU
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility the carrier commits units to
      - name: carrier_name
        type: string
        source: input
        description: ambulance carrier name
        constraints: 1..120 chars
      - name: level_of_care
        type: enum
        source: input
        description: highest level of care the committed units can provide
        constraints: "BLS | ALS | CRITICAL_CARE"
      - name: coverage_start_at
        type: datetime
        source: input
        description: inclusive start of the committed coverage window (half-open interval start)
      - name: coverage_end_at
        type: datetime
        source: input
        description: exclusive end of the committed coverage window (half-open interval end); must be > coverage_start_at
      - name: units_committed
        type: integer
        source: input
        description: number of transport units committed for the window
        constraints: ">= 0"
      - name: units_reserved
        type: integer
        source: computed
        description: count of TransferOrder rows referencing this MOU with status IN {REQUESTED, ACCEPTED}
        default: 0
      - name: units_available
        type: integer
        source: computed
        description: units_committed - units_reserved
        default: 0
      - name: saturation_state
        type: enum
        source: computed
        description: SATURATED when units_available == 0, else AVAILABLE
        default: AVAILABLE
        constraints: "AVAILABLE | SATURATED"
      - name: status
        type: enum
        source: computed
        description: ACTIVE when logical clock < coverage_end_at, else EXPIRED; re-evaluated on every read and validation
        default: ACTIVE
        constraints: "ACTIVE | EXPIRED"

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: FK -> Encounter.id; the encounter being transferred
      - name: transfer_agreement_id
        type: string
        source: input
        description: FK -> TransferAgreement.id; the agreement authorizing the receiving hospital
      - name: ambulance_mou_id
        type: string
        source: input
        description: FK -> AmbulanceMOU.id; the MOU whose unit is reserved for the transport
      - name: clinical_benefit_certified
        type: boolean
        source: input
        description: physician certification that the medical benefits of transfer outweigh the risks
      - name: certifying_physician_user_id
        type: string
        source: system
        description: X-User-ID of the EmergencyPhysician who created and certified the order
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the order was created; must fall inside the MOU coverage window
      - name: round_index
        type: integer
        source: computed
        description: 1 + count of DECLINED TransferOrder rows on the same encounter at creation time
        default: 1
      - name: reserved_unit_count
        type: integer
        source: system
        description: ambulance units held by this order while status IN {REQUESTED, ACCEPTED}
        default: 1
      - name: status
        type: enum
        source: system
        description: REQUESTED at creation; ACCEPTED or DECLINED by the receiving hospital; CANCELLED when superseded by a newer order on the same encounter; COMPLETED when the transport finishes
        default: REQUESTED
        constraints: "REQUESTED | ACCEPTED | DECLINED | CANCELLED | COMPLETED"
      - name: decline_reason
        type: enum
        source: input
        description: reason recorded by the receiving hospital on decline; INSURANCE is an EMTALA red flag
        default: null
        constraints: "CAPACITY | CAPABILITY | INSURANCE"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: FK -> Encounter.id; the encounter being billed, at most one claim per encounter
      - name: payer_contract_id
        type: string
        source: input
        description: FK -> PayerContract.id; the contract the claim is billed under
      - name: billed_facility_fee_cents
        type: integer
        source: computed
        description: facility_fee_cents copied from the encounter's pinned_disclosure_template_id at claim creation
        default: 0
      - name: billed_ancillary_cents
        type: integer
        source: computed
        description: sum of line_total_cents over AncillaryOrder rows of the encounter with status == RESULTED
        default: 0
      - name: billed_total_cents
        type: integer
        source: computed
        description: billed_facility_fee_cents + billed_ancillary_cents
        default: 0
      - name: protection_variant
        type: enum
        source: computed
        description: balance-billing regime resolved at claim creation per calculations.claim_settlement variants
        default: PROTECTED_NSA
        constraints: "PROTECTED_NSA | PROTECTED_STATE | UNPROTECTED"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: recognized allowed amount for the bundle; set at adjudication, replaced by an IDR award
        default: 0
      - name: plan_paid_cents
        type: integer
        source: computed
        description: allowed_amount_cents - patient cost share
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: total patient obligation including deductible, coinsurance and any permitted balance bill
        default: 0
      - name: balance_bill_amount_cents
        type: integer
        source: computed
        description: portion of patient_responsibility_cents attributable to balance billing; 0 for protected variants
        default: 0
      - name: written_off_cents
        type: integer
        source: computed
        description: billed_total_cents - allowed_amount_cents for protected variants, 0 for UNPROTECTED
        default: 0
      - name: pre_award_allowed_cents
        type: integer
        source: system
        description: snapshot of allowed_amount_cents taken immediately before an IDR award is applied; null before any award
        default: null
      - name: pre_award_plan_paid_cents
        type: integer
        source: system
        description: snapshot of plan_paid_cents taken immediately before an IDR award is applied
        default: null
      - name: pre_award_patient_responsibility_cents
        type: integer
        source: system
        description: snapshot of patient_responsibility_cents taken immediately before an IDR award is applied
        default: null
      - name: pre_award_written_off_cents
        type: integer
        source: system
        description: snapshot of written_off_cents taken immediately before an IDR award is applied
        default: null
      - name: negotiation_rounds_used
        type: integer
        source: computed
        description: round_index of the claim's DisputeCase, mirrored onto the claim
        default: 0
      - name: status
        type: enum
        source: system
        description: DRAFT at creation, ADJUDICATED after adjudication, NEGOTIATION once a dispute is open, IDR_PENDING once IDR is initiated, RESOLVED after an award
        default: DRAFT
        constraints: "DRAFT | ADJUDICATED | NEGOTIATION | IDR_PENDING | RESOLVED"

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the out-of-network claim under dispute
      - name: initiated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who opened the dispute
      - name: round_index
        type: integer
        source: computed
        description: completed open-negotiation rounds; incremented when the payer answers a facility offer
        default: 0
      - name: last_offer_cents
        type: integer
        source: system
        description: most recent facility offer in cents; null before the first offer
        default: null
      - name: last_counteroffer_cents
        type: integer
        source: system
        description: most recent payer counteroffer in cents; null before the first counteroffer
        default: null
      - name: last_offer_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who submitted the most recent offer or counteroffer
        default: null
      - name: idr_award_cents
        type: integer
        source: system
        description: certified IDR entity award in cents; null until AWARDED
        default: null
      - name: awarded_at
        type: datetime
        source: system
        description: logical-clock instant the award was entered; null until AWARDED
        default: null
      - name: status
        type: enum
        source: system
        description: OPEN_NEGOTIATION at creation; cycles to OFFER_PENDING and back on each round; IDR_INITIATED, then AWARDED, then WITHDRAWN if the award is withdrawn
        default: OPEN_NEGOTIATION
        constraints: "OPEN_NEGOTIATION | OFFER_PENDING | IDR_INITIATED | AWARDED | WITHDRAWN"

  - name: ComplianceLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: facility_id
        type: string
        source: system
        description: FK -> Facility.id; the facility the finding is recorded against
      - name: event_type
        type: enum
        source: system
        description: compliance event kind
        constraints: "DISCLOSURE_PRESENTED | DISCLOSURE_ACKNOWLEDGED | DISCLOSURE_REFUSED | DISCLOSURE_DEFECT | EMERGENT_WAIVER_RECORDED | SCREENING_DELAY | TEMPLATE_PUBLISHED | SIGNAGE_ATTESTED | POSTURE_CHANGE | TRANSFER_DECLINED_FOR_INSURANCE | BALANCE_BILL_ISSUED | IDR_INITIATED | IDR_AWARDED | IDR_AWARD_WITHDRAWN"
      - name: severity
        type: enum
        source: system
        description: finding severity
        constraints: "INFO | MINOR | MAJOR | CRITICAL"
      - name: subject_type
        type: enum
        source: system
        description: polymorphic subject kind; resolve subject_id against the entity named here
        constraints: "ENCOUNTER | TRANSFER_ORDER | CLAIM | FACILITY | DISCLOSURE_TEMPLATE"
      - name: subject_id
        type: string
        source: system
        description: polymorphic reference - id of the subject_type entity this entry describes; not a declared foreign key
      - name: detail
        type: string
        source: system
        description: single-sentence machine-generated description of the finding
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant the entry was appended
      - name: defect_counted
        type: boolean
        source: system
        description: true when this entry incremented Facility.open_compliance_defect_count

state_machines:
  - entity: Facility
    dimension: compliance_posture
    initial_state: RESTRICTED
    terminal_states: []
    note: |
      Derived posture. Recomputed synchronously at the end of every facility-scoped mutation
      (PATCH /facilities/{id}, signage attestation, template publish, and every side effect that
      changes open_compliance_defect_count). Precedence is pinned in
      calculations.facility_compliance_posture; a freshly created facility starts RESTRICTED
      because signage_attestation_status == PENDING and current_published_template_id == null.
    transitions:
      - from: RESTRICTED
        to: OPEN
        trigger: "system posture recomputation at the end of any facility-scoped mutation"
        actor: system
        preconditions:
          - "license_status == ACTIVE"
          - "signage_attestation_status == ATTESTED and logical clock < signage_expires_at"
          - "current_published_template_id != null"
          - "open_compliance_defect_count < DEFECT_RESTRICT_THRESHOLD (3)"
        side_effects:
          - "restricted_service_codes := []"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: INFO, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "Facility.version += 1; Facility.updated_at refreshed"
      - from: OPEN
        to: RESTRICTED
        trigger: "system posture recomputation at the end of any facility-scoped mutation"
        actor: system
        preconditions:
          - "license_status != SUSPENDED"
          - "at least one of: license_status == PROBATION | signage_attestation_status != ATTESTED | current_published_template_id == null | open_compliance_defect_count >= 3"
        side_effects:
          - "restricted_service_codes := [MRI, THROMBOLYTIC]"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: MINOR, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "CASCADE HOP: because posture became RESTRICTED, every VolumeForecast of this facility with status == ACTIVE and method == TRAILING_MEAN is rewritten to method := PEAK_ADJUSTED, escalated_by_posture := true, and forecast_daily_volume / required_physician_hours_per_day / required_physician_hours_total / required_board_certified_hours_total recomputed per calculations.required_physician_coverage"
          - "CASCADE HOP: because those forecast hours changed, scheduled_physician_hours and coverage_deficit_hours are recomputed per calculations.coverage_reconciliation and Facility.coverage_deficit_flag := (selected ACTIVE forecast.coverage_deficit_hours > 0)"
          - "Facility.version += 1; Facility.updated_at refreshed"
      - from: OPEN
        to: SUSPENDED
        trigger: "system posture recomputation after license_status is set to SUSPENDED"
        actor: system
        preconditions: ["license_status == SUSPENDED"]
        side_effects:
          - "restricted_service_codes := [XRAY, CT, ULTRASOUND, MRI, CBC, CHEMISTRY, TROPONIN, BLOOD_CULTURE, ANALGESIC, ANTIBIOTIC, THROMBOLYTIC]"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: MAJOR, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "Facility.version += 1"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system posture recomputation after license_status is set to SUSPENDED"
        actor: system
        preconditions: ["license_status == SUSPENDED"]
        side_effects:
          - "restricted_service_codes := all 11 ancillary codes"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: MAJOR, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "Facility.version += 1"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system posture recomputation after license_status is set to ACTIVE or PROBATION"
        actor: system
        preconditions:
          - "license_status != SUSPENDED"
          - "at least one of: license_status == PROBATION | signage_attestation_status != ATTESTED | current_published_template_id == null | open_compliance_defect_count >= 3"
        side_effects:
          - "restricted_service_codes := [MRI, THROMBOLYTIC]"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: MINOR, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "Facility.version += 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "system posture recomputation after license_status is set to ACTIVE with signage attested, a published template and defect count < 3"
        actor: system
        preconditions:
          - "license_status == ACTIVE"
          - "signage_attestation_status == ATTESTED and logical clock < signage_expires_at"
          - "current_published_template_id != null"
          - "open_compliance_defect_count < 3"
        side_effects:
          - "restricted_service_codes := []"
          - "append ComplianceLedgerEntry{event_type: POSTURE_CHANGE, severity: INFO, subject_type: FACILITY, subject_id: facility.id, defect_counted: false}"
          - "Facility.version += 1"

  - entity: DisclosureTemplate
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /disclosure-templates/{id}/publish"
        actor: FacilityAdministrator
        preconditions:
          - "template.status == DRAFT"
          - "expected_facility_version == Facility.version (OCC, concurrency_rules.template-publish-supersedes-facility)"
        side_effects:
          - "published_at := logical clock; published_by_user_id := X-User-ID"
          - "the facility's prior template with status == PUBLISHED (at most one) transitions PUBLISHED -> RETIRED"
          - "Facility.current_published_template_id := this template id; Facility.version += 1"
          - "Facility posture recomputed (may fire RESTRICTED -> OPEN when signage is attested and defect count < 3)"
      - from: PUBLISHED
        to: RETIRED
        trigger: "system, when a later DisclosureTemplate of the same facility is published"
        actor: system
        preconditions: ["another template of the same facility_id transitions DRAFT -> PUBLISHED"]
        side_effects:
          - "template.updated_at refreshed; template.version += 1"
          - "encounters already pinned to this template keep pinned_disclosure_template_id unchanged (version pinning)"

  - entity: Encounter
    dimension: clinical_state
    initial_state: ARRIVED
    terminal_states: [TRANSFERRED, DISCHARGED]
    note: |
      Non-linear: contains the cycle OBSERVATION -> TRANSFER_PENDING -> OBSERVATION (transfer declined,
      patient stays in observation because the facility has no inpatient beds) and a fork at MSE_COMPLETE
      into {OBSERVATION, TRANSFER_PENDING, DISCHARGED}. Evolves independently of the disclosure_state
      dimension declared below: no clinical transition reads disclosure_state as a precondition, because
      the medical screening examination may never be delayed by a financial disclosure step.
    transitions:
      - from: ARRIVED
        to: MSE_IN_PROGRESS
        trigger: "POST /encounters/{id}/begin-mse"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == ARRIVED"
          - "NO precondition on disclosure_state - screening must never be gated on disclosure (EMTALA)"
        side_effects:
          - "mse_started_at := logical clock; mse_physician_user_id := X-User-ID"
          - "mse_timeliness := ON_TIME when mse_started_at <= mse_start_deadline_at, else LATE (calculations.mse_timeliness)"
          - "when mse_timeliness == LATE: append ComplianceLedgerEntry{event_type: SCREENING_DELAY, severity: MAJOR, subject_type: ENCOUNTER, subject_id: encounter.id, defect_counted: true} and Facility.open_compliance_defect_count += 1"
          - "CASCADE HOP: because open_compliance_defect_count changed, Facility posture is recomputed (OPEN -> RESTRICTED once the counter reaches 3)"
      - from: MSE_IN_PROGRESS
        to: MSE_COMPLETE
        trigger: "POST /encounters/{id}/complete-mse"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == MSE_IN_PROGRESS"
          - "stabilization_status input IN {STABLE, UNSTABLE}"
        side_effects:
          - "mse_completed_at := logical clock; stabilization_status := input value"
      - from: MSE_COMPLETE
        to: OBSERVATION
        trigger: "POST /encounters/{id}/observation"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == MSE_COMPLETE"
          - "stabilization_status != NOT_ASSESSED"
          - "Facility.compliance_posture != SUSPENDED (cross-entity gate)"
          - "Facility.observation_beds_occupied < Facility.observation_bed_count"
        side_effects:
          - "observation_bed_held := true; observation_started_at := logical clock"
          - "Facility.observation_beds_occupied += 1 (ledger sync on the parent)"
      - from: MSE_COMPLETE
        to: TRANSFER_PENDING
        trigger: "POST /encounters/{id}/transfer-orders"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == MSE_COMPLETE"
          - "expected_encounter_version == Encounter.version (OCC, concurrency_rules.transfer-order-create-supersedes-encounter)"
        side_effects:
          - "a TransferOrder is created in status REQUESTED; AmbulanceMOU.units_reserved += 1"
          - "Encounter.version += 1"
      - from: OBSERVATION
        to: TRANSFER_PENDING
        trigger: "POST /encounters/{id}/transfer-orders"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == OBSERVATION"
          - "expected_encounter_version == Encounter.version"
        side_effects:
          - "a TransferOrder is created in status REQUESTED; AmbulanceMOU.units_reserved += 1"
          - "observation_bed_held stays true - the patient physically remains in the observation bed until transport completes"
          - "Encounter.version += 1"
      - from: TRANSFER_PENDING
        to: TRANSFER_PENDING
        trigger: "POST /encounters/{id}/transfer-orders (supersede: a newer order replaces the live one)"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == TRANSFER_PENDING"
          - "expected_encounter_version == Encounter.version (OCC, concurrency_rules.transfer-order-create-supersedes-encounter)"
        side_effects:
          - "the previous REQUESTED or ACCEPTED TransferOrder of this encounter transitions to CANCELLED and releases its reserved ambulance unit"
          - "the new order is created REQUESTED with reserved_unit_count 1; clinical_state stays TRANSFER_PENDING; Encounter.version incremented by 1"
          - "observation_bed_held is unchanged by the supersede"
      - from: TRANSFER_PENDING
        to: OBSERVATION
        trigger: "POST /transfer-orders/{id}/decline (system-driven return path)"
        actor: system
        preconditions:
          - "the declined order is the encounter's newest TransferOrder"
          - "observation_bed_held == true"
        side_effects:
          - "declined_transfer_count += 1"
          - "no observation capacity re-check: the bed was never released"
      - from: TRANSFER_PENDING
        to: MSE_COMPLETE
        trigger: "POST /transfer-orders/{id}/decline (system-driven return path)"
        actor: system
        preconditions:
          - "the declined order is the encounter's newest TransferOrder"
          - "observation_bed_held == false"
        side_effects:
          - "declined_transfer_count += 1"
      - from: TRANSFER_PENDING
        to: TRANSFERRED
        trigger: "POST /transfer-orders/{id}/complete"
        actor: HospitalTransferCoordinator
        preconditions:
          - "the completing TransferOrder.status == ACCEPTED and belongs to this encounter"
        side_effects:
          - "when observation_bed_held == true: observation_bed_held := false and Facility.observation_beds_occupied -= 1"
          - "AmbulanceMOU.units_reserved -= 1 for the order's MOU"
          - "when disclosure_state == DISCLOSURE_PRESENTED at disposition: disclosure_state := DISCLOSURE_DEFECT with its own cascade (see the disclosure_state machine)"
      - from: MSE_COMPLETE
        to: DISCHARGED
        trigger: "POST /encounters/{id}/discharge"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == MSE_COMPLETE"
          - "stabilization_status == STABLE - an UNSTABLE patient may not be discharged, only transferred"
        side_effects:
          - "when disclosure_state == DISCLOSURE_PRESENTED at disposition: disclosure_state := DISCLOSURE_DEFECT with its own cascade"
      - from: OBSERVATION
        to: DISCHARGED
        trigger: "POST /encounters/{id}/discharge"
        actor: EmergencyPhysician
        preconditions:
          - "clinical_state == OBSERVATION"
          - "stabilization_status == STABLE"
        side_effects:
          - "observation_bed_held := false; Facility.observation_beds_occupied -= 1"
          - "when disclosure_state == DISCLOSURE_PRESENTED at disposition: disclosure_state := DISCLOSURE_DEFECT with its own cascade"

  - entity: Encounter
    dimension: disclosure_state
    initial_state: DISCLOSURE_PRESENTED
    terminal_states: [DISCLOSURE_ACKNOWLEDGED, DISCLOSURE_REFUSED, DISCLOSURE_WAIVED_EMERGENT, DISCLOSURE_DEFECT]
    note: |
      Second, independent state dimension on the same Encounter row. Its transitions read no
      clinical_state precondition and its side effects never move clinical_state, except for the
      system-driven DISCLOSURE_PRESENTED -> DISCLOSURE_DEFECT edge which is fired BY a clinical
      disposition transition.
    transitions:
      - from: DISCLOSURE_PRESENTED
        to: DISCLOSURE_ACKNOWLEDGED
        trigger: "POST /encounters/{id}/disclosure-decision with decision == ACKNOWLEDGED"
        actor: RegistrationClerk
        preconditions:
          - "disclosure_state == DISCLOSURE_PRESENTED"
          - "no precondition on clinical_state - the decision may be recorded at any point before disposition"
        side_effects:
          - "disclosure_decided_by_user_id := X-User-ID"
      - from: DISCLOSURE_PRESENTED
        to: DISCLOSURE_REFUSED
        trigger: "POST /encounters/{id}/disclosure-decision with decision == REFUSED"
        actor: RegistrationClerk
        preconditions:
          - "disclosure_state == DISCLOSURE_PRESENTED"
        side_effects:
          - "disclosure_decided_by_user_id := X-User-ID"
          - "CASCADE HOP 2: because disclosure_state became DISCLOSURE_REFUSED, append ComplianceLedgerEntry{event_type: DISCLOSURE_REFUSED, severity: MAJOR, subject_type: ENCOUNTER, subject_id: encounter.id, defect_counted: true} and Facility.open_compliance_defect_count += 1"
          - "CASCADE HOP 3: because open_compliance_defect_count changed, Facility posture is recomputed; at counter >= 3 with license_status ACTIVE the posture moves OPEN -> RESTRICTED and restricted_service_codes := [MRI, THROMBOLYTIC]"
          - "CASCADE HOP 4: because the posture became RESTRICTED, every ACTIVE VolumeForecast with method TRAILING_MEAN is rewritten to PEAK_ADJUSTED and its required hours recomputed"
          - "CASCADE HOP 5: because those required hours changed, Facility.coverage_deficit_flag is recomputed from the selected forecast's coverage_deficit_hours"
      - from: DISCLOSURE_PRESENTED
        to: DISCLOSURE_WAIVED_EMERGENT
        trigger: "POST /encounters/{id}/disclosure-decision with decision == EMERGENT_WAIVER"
        actor: RegistrationClerk
        preconditions:
          - "disclosure_state == DISCLOSURE_PRESENTED"
          - "acuity_level >= EMERGENT_WAIVER_MIN_ACUITY (4)"
          - "X-User-ID != Encounter.registered_by_user_id (segregation of duties)"
        side_effects:
          - "disclosure_decided_by_user_id := X-User-ID"
          - "no defect is counted: an emergent waiver is a compliant outcome"
      - from: DISCLOSURE_PRESENTED
        to: DISCLOSURE_DEFECT
        trigger: "system, fired by a clinical disposition transition (TRANSFERRED or DISCHARGED) while no decision was recorded"
        actor: system
        preconditions:
          - "disclosure_state == DISCLOSURE_PRESENTED at the moment clinical_state reaches TRANSFERRED or DISCHARGED"
        side_effects:
          - "append ComplianceLedgerEntry{event_type: DISCLOSURE_DEFECT, severity: MAJOR, subject_type: ENCOUNTER, subject_id: encounter.id, defect_counted: true} and Facility.open_compliance_defect_count += 1"
          - "CASCADE HOP: because open_compliance_defect_count changed, Facility posture is recomputed"

  - entity: AncillaryOrder
    dimension: status
    initial_state: ORDERED
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: ORDERED
        to: RESULTED
        trigger: "POST /ancillary-orders/{id}/resolve with outcome == RESULTED"
        actor: EmergencyPhysician
        preconditions: ["status == ORDERED"]
        side_effects:
          - "the line becomes billable: it enters Claim.billed_ancillary_cents when the claim is created"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /ancillary-orders/{id}/resolve with outcome == CANCELLED"
        actor: EmergencyPhysician
        preconditions: ["status == ORDERED"]
        side_effects:
          - "the line is permanently excluded from Claim.billed_ancillary_cents"

  - entity: TransferOrder
    dimension: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, CANCELLED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /transfer-orders/{id}/accept"
        actor: HospitalTransferCoordinator
        preconditions:
          - "status == REQUESTED"
          - "TransferAgreement.status == ACTIVE at acceptance time"
        side_effects:
          - "the reserved ambulance unit stays reserved (units_reserved unchanged)"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /transfer-orders/{id}/decline"
        actor: HospitalTransferCoordinator
        preconditions:
          - "status == REQUESTED"
          - "decline_reason input IN {CAPACITY, CAPABILITY, INSURANCE}"
        side_effects:
          - "CASCADE HOP 2: because the order left {REQUESTED, ACCEPTED}, AmbulanceMOU.units_reserved -= 1 and units_available := units_committed - units_reserved"
          - "CASCADE HOP 3: because units_available became > 0, AmbulanceMOU.saturation_state SATURATED -> AVAILABLE"
          - "CASCADE HOP 4: because that MOU's availability changed, Facility.ambulance_units_reserved_total is recomputed and Facility.transfer_capacity_state SATURATED -> AVAILABLE"
          - "Encounter.declined_transfer_count += 1 and Encounter.clinical_state returns to OBSERVATION (bed held) or MSE_COMPLETE (no bed)"
          - "when decline_reason == INSURANCE: append ComplianceLedgerEntry{event_type: TRANSFER_DECLINED_FOR_INSURANCE, severity: CRITICAL, subject_type: TRANSFER_ORDER, subject_id: order.id, defect_counted: true}, Facility.open_compliance_defect_count += 1, and the posture recomputation cascade fires"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /transfer-orders/{id}/complete"
        actor: HospitalTransferCoordinator
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "AmbulanceMOU.units_reserved -= 1; units_available recomputed; saturation_state recomputed; Facility.ambulance_units_reserved_total and transfer_capacity_state recomputed"
          - "Encounter.clinical_state TRANSFER_PENDING -> TRANSFERRED with its own bed-release and disclosure-defect side effects"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system, when a newer TransferOrder is created for the same encounter (supersede)"
        actor: system
        preconditions:
          - "a newer TransferOrder is created on the same encounter_id while this order is REQUESTED"
        side_effects:
          - "AmbulanceMOU.units_reserved -= 1 for this order's MOU; availability and facility totals recomputed"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system, when a newer TransferOrder is created for the same encounter (supersede)"
        actor: system
        preconditions:
          - "a newer TransferOrder is created on the same encounter_id while this order is ACCEPTED"
        side_effects:
          - "AmbulanceMOU.units_reserved -= 1 for this order's MOU; availability and facility totals recomputed"

  - entity: Claim
    dimension: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate"
        actor: PayerRepresentative
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "allowed_amount_cents, plan_paid_cents, patient_responsibility_cents, balance_bill_amount_cents and written_off_cents computed per calculations.claim_settlement"
          - "invariant: billed_total_cents == plan_paid_cents + patient_responsibility_cents + written_off_cents"
      - from: ADJUDICATED
        to: NEGOTIATION
        trigger: "POST /claims/{id}/dispute-cases"
        actor: ComplianceOfficer
        preconditions:
          - "status == ADJUDICATED"
          - "PayerContract.idr_eligible == true"
        side_effects:
          - "a DisputeCase is created in status OPEN_NEGOTIATION with round_index 0"
      - from: NEGOTIATION
        to: IDR_PENDING
        trigger: "POST /dispute-cases/{id}/initiate-idr"
        actor: ComplianceOfficer
        preconditions:
          - "status == NEGOTIATION"
          - "DisputeCase.round_index >= NEGOTIATION_MAX_ROUNDS (3)"
        side_effects:
          - "negotiation_rounds_used := DisputeCase.round_index"
      - from: IDR_PENDING
        to: RESOLVED
        trigger: "POST /dispute-cases/{id}/award"
        actor: IDREntity
        preconditions:
          - "status == IDR_PENDING"
        side_effects:
          - "pre_award_* snapshot fields captured, then allowed_amount_cents := award and plan_paid_cents / patient_responsibility_cents / written_off_cents recomputed per calculations.award_application"
      - from: RESOLVED
        to: IDR_PENDING
        trigger: "POST /dispute-cases/{id}/withdraw (compensating action)"
        actor: IDREntity
        preconditions:
          - "status == RESOLVED"
        side_effects:
          - "allowed_amount_cents, plan_paid_cents, patient_responsibility_cents and written_off_cents restored from the pre_award_* snapshot; balance_bill_amount_cents recomputed; snapshot fields cleared to null"

  - entity: DisputeCase
    dimension: status
    initial_state: OPEN_NEGOTIATION
    terminal_states: [WITHDRAWN]
    note: |
      Non-linear: OPEN_NEGOTIATION -> OFFER_PENDING -> OPEN_NEGOTIATION is a true cycle bounded by
      round_index < NEGOTIATION_MAX_ROUNDS; the loop must be exhausted before IDR may be initiated.
    transitions:
      - from: OPEN_NEGOTIATION
        to: OFFER_PENDING
        trigger: "POST /dispute-cases/{id}/offers as ComplianceOfficer (facility offer)"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN_NEGOTIATION"
          - "round_index < NEGOTIATION_MAX_ROUNDS (3)"
        side_effects:
          - "last_offer_cents := amount_cents; last_offer_by_user_id := X-User-ID"
      - from: OFFER_PENDING
        to: OPEN_NEGOTIATION
        trigger: "POST /dispute-cases/{id}/offers as PayerRepresentative (counteroffer) - closes the round"
        actor: PayerRepresentative
        preconditions:
          - "status == OFFER_PENDING"
        side_effects:
          - "last_counteroffer_cents := amount_cents; last_offer_by_user_id := X-User-ID"
          - "round_index += 1; Claim.negotiation_rounds_used := round_index"
      - from: OPEN_NEGOTIATION
        to: IDR_INITIATED
        trigger: "POST /dispute-cases/{id}/initiate-idr"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN_NEGOTIATION"
          - "round_index >= NEGOTIATION_MAX_ROUNDS (3)"
          - "PayerContract.idr_eligible == true"
        side_effects:
          - "Claim.status NEGOTIATION -> IDR_PENDING"
      - from: IDR_INITIATED
        to: AWARDED
        trigger: "POST /dispute-cases/{id}/award"
        actor: IDREntity
        preconditions:
          - "status == IDR_INITIATED"
          - "min(last_offer_cents, last_counteroffer_cents) <= award_cents <= max(last_offer_cents, last_counteroffer_cents)"
        side_effects:
          - "idr_award_cents := award_cents; awarded_at := logical clock"
          - "Claim.status IDR_PENDING -> RESOLVED and the claim money fields are recomputed per calculations.award_application"
          - "append ComplianceLedgerEntry{event_type: IDR_AWARDED, severity: INFO, subject_type: CLAIM, subject_id: claim.id, defect_counted: false}"
      - from: AWARDED
        to: WITHDRAWN
        trigger: "POST /dispute-cases/{id}/withdraw"
        actor: IDREntity
        preconditions:
          - "status == AWARDED"
        side_effects:
          - "idr_award_cents := null; awarded_at := null"
          - "Claim.status RESOLVED -> IDR_PENDING and every money field restored from the pre_award_* snapshot (compensating action, no drift)"
          - "append ComplianceLedgerEntry{event_type: IDR_AWARD_WITHDRAWN, severity: MINOR, subject_type: CLAIM, subject_id: claim.id, defect_counted: false}"

concurrency_rules:
  - rule_id: template-publish-supersedes-facility
    parent_entity: Facility
    write_endpoint: "POST /disclosure-templates/{id}/publish"
    occ_field: "expected_facility_version"
    description: |
      Publishing a DisclosureTemplate against a Facility whose version has advanced since the client
      last read it is rejected with a stale-version error. Publication legitimately supersedes the
      facility's current PUBLISHED template and rewrites Facility.current_published_template_id, so a
      publisher working from a stale view of the facility would silently retire a template it never saw.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
  - rule_id: transfer-order-create-supersedes-encounter
    parent_entity: Encounter
    write_endpoint: "POST /encounters/{id}/transfer-orders"
    occ_field: "expected_encounter_version"
    description: |
      Creating a TransferOrder against an Encounter whose version has advanced since the client last
      read it is rejected with a stale-version error. A new order legitimately supersedes an existing
      REQUESTED or ACCEPTED order on the same encounter (cancelling it and releasing its ambulance
      unit), so the create must prove the caller saw the encounter's current version.
    error_id: ERR_STALE_ENCOUNTER_VERSION
    http_status: 412
  - rule_id: facility-config-patch-stale
    parent_entity: Facility
    write_endpoint: "PATCH /facilities/{id}"
    occ_field: "expected_facility_version"
    description: |
      Updating licensure status or scope limits with a version the client read before an intervening
      mutation is rejected with a stale-version error. Scope and bed edits are last-writer-visible
      overwrites of the same fields, so the writer must prove its view of the facility is current.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

calculations:
  - name: disclosed_estimate
    trigger: "POST /facilities/{id}/encounters (registration) - writes Encounter.disclosed_estimate_cents"
    algorithm: threshold
    formula: |
      # Circular-looking dependency: the administrative surcharge is a percentage selected from a tier
      # table, and the tier could be read either from the pre-surcharge subtotal or from the final
      # total. The evaluation order below is PINNED; reading the tier from the final total is WRONG.
      # Step 1 - base subtotal (surcharge NOT included):
      base_subtotal_cents = template.facility_fee_cents
                          + ACUITY_ALLOWANCE_CENTS[encounter.acuity_level]
      # Step 2 - tier selection reads base_subtotal_cents ONLY:
      if   base_subtotal_cents <  ESTIMATE_TIER_B_THRESHOLD_CENTS: rate = TIER_A_RATE
      elif base_subtotal_cents <  ESTIMATE_TIER_C_THRESHOLD_CENTS: rate = TIER_B_RATE
      else:                                                        rate = TIER_C_RATE
      # Step 3 - surcharge, rounded half-up to whole cents:
      admin_surcharge_cents = round_half_up(base_subtotal_cents * rate)
      # Step 4 - disclosed total:
      disclosed_estimate_cents = base_subtotal_cents + admin_surcharge_cents
      # Worked pin: facility_fee 115000 + acuity 4 allowance 130000 = 245000 -> tier B (0.05)
      #             -> surcharge 12250 -> estimate 257250. Note 257250 >= 250000, i.e. the total sits
      #             in tier C; selecting the rate from the total would yield 267050, which is WRONG.
    input_set: "the DisclosureTemplate pinned on the encounter (status PUBLISHED at registration) and the encounter's acuity_level; no other entity participates"
    constants:
      ACUITY_ALLOWANCE_CENTS: { 1: 15000, 2: 35000, 3: 70000, 4: 130000, 5: 220000 }
      ESTIMATE_TIER_B_THRESHOLD_CENTS: 100000
      ESTIMATE_TIER_C_THRESHOLD_CENTS: 250000
      TIER_A_RATE: 0.00
      TIER_B_RATE: 0.05
      TIER_C_RATE: 0.09
    precision: "whole cents, round_half_up applied once at Step 3"

  - name: ancillary_line_charge
    trigger: "POST /encounters/{id}/ancillary-orders"
    algorithm: threshold
    formula: |
      unit_charge_cents = ANCILLARY_UNIT_CHARGE_CENTS[order.code]
      line_total_cents  = unit_charge_cents * order.quantity
      # The code must belong to `category` (priority 3) and to the facility's licensed scope
      # (priority 19) before this table is consulted.
    input_set: "the order's own code and quantity; no other rows are read"
    constants:
      ANCILLARY_UNIT_CHARGE_CENTS:
        XRAY: 12000
        CT: 49000
        ULTRASOUND: 24000
        MRI: 145000
        CBC: 4500
        CHEMISTRY: 6200
        TROPONIN: 15500
        BLOOD_CULTURE: 11500
        ANALGESIC: 8500
        ANTIBIOTIC: 7400
        THROMBOLYTIC: 210000
      CATEGORY_CODES:
        IMAGING: [XRAY, CT, ULTRASOUND, MRI]
        LABORATORY: [CBC, CHEMISTRY, TROPONIN, BLOOD_CULTURE]
        PHARMACY: [ANALGESIC, ANTIBIOTIC, THROMBOLYTIC]
    precision: "whole cents; exact integer multiplication, no rounding"
    invariants:
      - "line_total_cents == ANCILLARY_UNIT_CHARGE_CENTS[code] * quantity for every order, in every status"
  - name: claim_settlement
    trigger: "POST /claims/{id}/adjudicate - writes Claim.allowed_amount_cents, plan_paid_cents, patient_responsibility_cents, balance_bill_amount_cents, written_off_cents"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 - the ordered line set L. The facility-fee line is ALWAYS first; ancillary lines follow
      # in AncillaryOrder.created_at ASC order (never by id).
      L = [ {kind: FACILITY_FEE, billed: claim.billed_facility_fee_cents} ]
        + [ {kind: ANCILLARY, billed: ao.line_total_cents}
            for ao in AncillaryOrder where ao.encounter_id == claim.encounter_id
                                      and ao.status == RESULTED
            order by ao.created_at ASC ]
      billed_total = sum(line.billed for line in L)          # == claim.billed_total_cents
      # Step 2 - allowed total by protection variant (see variants below):
      if variant == PROTECTED_STATE:
          allowed_total = max(contract.qualifying_payment_amount_cents,
                              round_half_up(billed_total * STATE_BENCHMARK_RATE))
      else:  # PROTECTED_NSA and UNPROTECTED both recognise the plan's QPA
          allowed_total = contract.qualifying_payment_amount_cents
      # Step 3 - proportional per-line allocation of allowed_total, ROUNDED PER LINE (half-up).
      #          The residual lands on the LAST line of L so the allocation sums exactly.
      for i in 0 .. len(L)-2:
          allowed_i = round_half_up(allowed_total * L[i].billed / billed_total)
      allowed_last = allowed_total - sum(allowed_i for i in 0 .. len(L)-2)
      # Step 4 - deductible waterfall over L in order (facility fee first):
      ded_remaining = contract.in_network_deductible_remaining_cents
      for each line i in L order:
          ded_i = min(ded_remaining, allowed_i); ded_remaining -= ded_i
      # Step 5 - coinsurance: ROUND PER LINE, THEN SUM. This order is PINNED; summing the
      #          post-deductible allowed amounts and rounding once ("sum then round") produces a
      #          different cent total and is WRONG.
      coins_i       = round_half_up((allowed_i - ded_i) * contract.in_network_coinsurance_rate)
      coins_total   = sum(coins_i)
      cost_share    = sum(ded_i) + coins_total
      # Step 6 - variant-specific settlement:
      if variant in {PROTECTED_NSA, PROTECTED_STATE}:
          patient_responsibility_cents = cost_share
          balance_bill_amount_cents    = 0
          written_off_cents            = billed_total - allowed_total
      else:  # UNPROTECTED - the facility may balance bill the unallowed remainder
          patient_responsibility_cents = cost_share + (billed_total - allowed_total)
          balance_bill_amount_cents    = billed_total - allowed_total
          written_off_cents            = 0
      plan_paid_cents = allowed_total - cost_share
      allowed_amount_cents = allowed_total
      # INVARIANT (money conservation, checked after adjudication, after an award and after a
      # withdrawal): billed_total_cents == plan_paid_cents + patient_responsibility_cents
      #                                  + written_off_cents
    input_set: |
      Exactly one facility-fee line (from the encounter's pinned DisclosureTemplate) plus every
      AncillaryOrder of the encounter with status == RESULTED, ordered by created_at ASC. ORDERED and
      CANCELLED ancillary lines are excluded. The PayerContract must have status == ACTIVE at
      adjudication time.
    constants:
      STATE_BENCHMARK_RATE: 0.80
    precision: "whole cents; round_half_up applied per line in Step 3 and per line in Step 5, never on the aggregate"
    invariants:
      - "billed_total_cents == plan_paid_cents + patient_responsibility_cents + written_off_cents"
      - "sum of per-line allowed allocations == allowed_amount_cents (residual on the last line)"
    variants:
      - name: PROTECTED_NSA
        when: "contract.network_status == IN_NETWORK, OR contract.network_status == OUT_OF_NETWORK with state_protection_regime == FEDERAL_NSA_ONLY, OR (override) encounter.disclosure_state IN {DISCLOSURE_REFUSED, DISCLOSURE_DEFECT} regardless of regime"
        difference: "allowed_total = QPA; patient owes cost sharing only; the unallowed remainder is written off and may not be balance billed"
      - name: PROTECTED_STATE
        when: "contract.network_status == OUT_OF_NETWORK and state_protection_regime == STATE_PROTECTED_FSED and encounter.disclosure_state NOT IN {DISCLOSURE_REFUSED, DISCLOSURE_DEFECT}"
        difference: "allowed_total = max(QPA, round_half_up(billed_total * 0.80)); the state benchmark can exceed the QPA, so cost sharing, plan payment and write-off all differ from PROTECTED_NSA on identical inputs"
      - name: UNPROTECTED
        when: "contract.network_status == OUT_OF_NETWORK and state_protection_regime == STATE_EXEMPT_FSED and encounter.disclosure_state IN {DISCLOSURE_ACKNOWLEDGED, DISCLOSURE_WAIVED_EMERGENT}"
        difference: "allowed_total = QPA as in PROTECTED_NSA, but the unallowed remainder becomes patient responsibility (balance bill) instead of a write-off; patient_responsibility_cents is strictly larger for identical inputs"

  - name: award_application
    trigger: "POST /dispute-cases/{id}/award and POST /dispute-cases/{id}/withdraw - rewrites the Claim money fields"
    algorithm: aggregation
    formula: |
      # AWARD (forward action):
      claim.pre_award_allowed_cents                 = claim.allowed_amount_cents
      claim.pre_award_plan_paid_cents               = claim.plan_paid_cents
      claim.pre_award_patient_responsibility_cents  = claim.patient_responsibility_cents
      claim.pre_award_written_off_cents             = claim.written_off_cents
      allowed_total = dispute.idr_award_cents
      # Re-run calculations.claim_settlement Steps 3-6 with this allowed_total and the claim's
      # existing protection_variant; the line set L and the deductible input are unchanged.
      # WITHDRAW (compensating action):
      claim.allowed_amount_cents            = claim.pre_award_allowed_cents
      claim.plan_paid_cents                 = claim.pre_award_plan_paid_cents
      claim.patient_responsibility_cents    = claim.pre_award_patient_responsibility_cents
      claim.written_off_cents               = claim.pre_award_written_off_cents
      claim.balance_bill_amount_cents       = (protection_variant == UNPROTECTED)
                                              ? claim.billed_total_cents - claim.allowed_amount_cents
                                              : 0
      claim.pre_award_* = null
      # INVARIANT: after the award and again after the withdrawal,
      #   billed_total_cents == plan_paid_cents + patient_responsibility_cents + written_off_cents
      # and after the withdrawal each of the four money fields equals its pre-award value exactly.
    input_set: "the DisputeCase in status IDR_INITIATED (award) or AWARDED (withdraw) and its claim; the ancillary line set is re-read but must not have changed because the encounter is terminal"
    constants: {}
    precision: "whole cents; the same per-line round_half_up order as calculations.claim_settlement"
    invariants:
      - "billed_total_cents == plan_paid_cents + patient_responsibility_cents + written_off_cents (before award, after award, after withdrawal)"
      - "after withdrawal: allowed_amount_cents, plan_paid_cents, patient_responsibility_cents and written_off_cents each equal their pre-award values"

  - name: required_physician_coverage
    trigger: "POST /facilities/{id}/volume-forecasts, and again whenever a Facility posture escalation rewrites VolumeForecast.method"
    algorithm: forward_looking
    formula: |
      window = last min(len(historical_daily_volumes), FORECAST_WINDOW_DAYS) elements of
               historical_daily_volumes (most recent elements, order preserved)
      if len(historical_daily_volumes) == 0:                    # EMPTY-SET BOUNDARY
          forecast_basis                   = FLOOR_ONLY
          forecast_daily_volume            = 0.00
          required_physician_hours_per_day = COVERAGE_FLOOR_HOURS_PER_DAY   # statutory floor, NOT 0
      else:
          forecast_basis = HISTORY
          window_mean = round_half_up(sum(window) / len(window), 2)
          if method == TRAILING_MEAN:
              forecast_daily_volume = window_mean
          else:  # PEAK_ADJUSTED
              forecast_daily_volume = round_half_up(PEAK_WEIGHT * max(window)
                                                  + MEAN_WEIGHT * window_mean, 2)
          raw_hours = forecast_daily_volume / PATIENTS_PER_PHYSICIAN_HOUR
          # quarter-hour ceiling, then the statutory floor wins if it is higher (3 interacting inputs:
          # forecast volume, throughput constant, statutory floor)
          required_physician_hours_per_day = max(COVERAGE_FLOOR_HOURS_PER_DAY,
                                                 ceil(raw_hours * 4) / 4)
      required_physician_hours_total       = round_half_up(required_physician_hours_per_day
                                                          * period_days, 2)
      required_board_certified_hours_total = round_half_up(required_physician_hours_total
                                                          * BOARD_CERT_MIN_SHARE, 2)
      # Worked pins for historical_daily_volumes = [22, 19, 26, 31, 18, 24, 29], period_days = 7:
      #   TRAILING_MEAN  -> window_mean 24.14, per_day 16.25, total 113.75, board-certified 85.31
      #   PEAK_ADJUSTED  -> 0.60*31 + 0.40*24.14 = 28.26, per_day 19.00, total 133.00, board 99.75
      #   []             -> FLOOR_ONLY, per_day 12.00, total 84.00, board 63.00
    input_set: "only the historical_daily_volumes array supplied on the forecast (no Encounter rows are read); the trailing window is the last 14 elements"
    constants:
      FORECAST_WINDOW_DAYS: 14
      PATIENTS_PER_PHYSICIAN_HOUR: 1.5
      COVERAGE_FLOOR_HOURS_PER_DAY: 12
      BOARD_CERT_MIN_SHARE: 0.75
      PEAK_WEIGHT: 0.60
      MEAN_WEIGHT: 0.40
    precision: "forecast_daily_volume and all hour totals to 2 decimals, round_half_up; the per-day figure is ceilinged to the quarter hour before the floor comparison"
    variants:
      - name: TRAILING_MEAN
        when: "VolumeForecast.method == TRAILING_MEAN (the default operator choice)"
        difference: "forecast_daily_volume is the plain trailing mean, producing the lower required-hours figure"
      - name: PEAK_ADJUSTED
        when: "VolumeForecast.method == PEAK_ADJUSTED, either chosen at creation or forced by a Facility posture escalation to RESTRICTED"
        difference: "forecast_daily_volume blends 60% of the window peak with 40% of the mean, producing strictly higher required hours for any window whose max exceeds its mean"

  - name: coverage_reconciliation
    trigger: "GET /facilities/{id}/coverage-summary, POST /facilities/{id}/physician-shifts, and every recomputation of VolumeForecast required hours"
    algorithm: interval_merge
    formula: |
      period_start = forecast.period_start_date at 00:00:00Z
      period_end   = period_start + forecast.period_days days      # exclusive
      candidates = PhysicianShift where facility_id == facility.id
                                    and role_type == PHYSICIAN
                                    and start_utc < period_end
                                    and end_utc   > period_start   # half-open overlap test
                   order by created_at ASC
      for each shift in candidates (in that order):
          clipped_minutes = minutes( min(shift.end_utc, period_end)
                                   - max(shift.start_utc, period_start) )
          shift_hours     = round_half_up(clipped_minutes / 60, 2)   # per-shift rounding, then summed
      scheduled_physician_hours = round_half_up(sum(shift_hours), 2)
      board_certified_hours     = round_half_up(sum(shift_hours where shift.board_certified == true), 2)
      coverage_deficit_hours    = max(0, round_half_up(required_physician_hours_total
                                                     - scheduled_physician_hours, 2))
      coverage_compliant        = (coverage_deficit_hours == 0)
                                 and (board_certified_hours >= required_board_certified_hours_total)
      facility.coverage_deficit_flag = (coverage_deficit_hours > 0)
    input_set: |
      Only PhysicianShift rows with role_type == PHYSICIAN count; ADVANCED_PRACTICE_PROVIDER rows are
      excluded from both totals. The forecast selected when no volume_forecast_id is supplied is the
      facility's VolumeForecast with status == ACTIVE ordered by period_start_date DESC, tie-broken by
      created_at ASC, limit 1; when the facility has no ACTIVE forecast the read fails with
      ERR_VOLUME_FORECAST_NOT_FOUND.
    constants: {}
    precision: "per-shift hours rounded half-up to 2 decimals BEFORE summing; the sum is rounded half-up to 2 decimals again"

  - name: facility_compliance_posture
    trigger: "end of every facility-scoped mutation: POST /facilities, PATCH /facilities/{id}, POST /facilities/{id}/signage-attestations, POST /disclosure-templates/{id}/publish, and every side effect that changes Facility.open_compliance_defect_count"
    algorithm: constraint_propagation
    formula: |
      # Step 0 - signage expiry is evaluated FIRST so the posture rules below see the fresh value:
      if signage_attestation_status == ATTESTED and logical_clock >= signage_expires_at:
          signage_attestation_status = LAPSED
      # Step 1 - precedence, first match wins:
      if license_status == SUSPENDED:                       posture = SUSPENDED
      elif license_status == PROBATION:                     posture = RESTRICTED
      elif signage_attestation_status != ATTESTED:          posture = RESTRICTED
      elif current_published_template_id == null:           posture = RESTRICTED
      elif open_compliance_defect_count >= DEFECT_RESTRICT_THRESHOLD: posture = RESTRICTED
      else:                                                 posture = OPEN
      # Step 2 - derived gate list:
      restricted_service_codes = [] if posture == OPEN
                                 else [MRI, THROMBOLYTIC] if posture == RESTRICTED
                                 else ALL_ANCILLARY_CODES
      # Step 3 - propagate: when the posture value CHANGED in this evaluation, append a
      # ComplianceLedgerEntry{event_type: POSTURE_CHANGE} and, on an OPEN -> RESTRICTED change only,
      # escalate every ACTIVE TRAILING_MEAN VolumeForecast of this facility to PEAK_ADJUSTED and
      # recompute its required hours, then recompute coverage_deficit_flag.
    input_set: "the facility row itself plus its counted ComplianceLedgerEntry rows (defect_counted == true) as summarised by open_compliance_defect_count"
    constants:
      DEFECT_RESTRICT_THRESHOLD: 3
      SIGNAGE_VALIDITY_DAYS: 365
      ALL_ANCILLARY_CODES: [XRAY, CT, ULTRASOUND, MRI, CBC, CHEMISTRY, TROPONIN, BLOOD_CULTURE, ANALGESIC, ANTIBIOTIC, THROMBOLYTIC]
      REQUIRED_SIGNAGE_BY_CATEGORY:
        INDEPENDENT_FREESTANDING_ED: [LICENSE_CATEGORY_SIGN, FEE_DISCLOSURE_SIGN, NETWORK_STATUS_SIGN, NOT_A_URGENT_CARE_SIGN]
        HOSPITAL_OUTPATIENT_DEPARTMENT_OFF_CAMPUS: [LICENSE_CATEGORY_SIGN, FEE_DISCLOSURE_SIGN, NETWORK_STATUS_SIGN]
    precision: "exact enum comparison; the defect threshold is inclusive (a count of exactly 3 restricts)"

  - name: mse_timeliness
    trigger: "POST /encounters/{id}/begin-mse - writes Encounter.mse_timeliness"
    algorithm: threshold
    formula: |
      mse_start_deadline_at = arrival_at + MSE_START_DEADLINE_MINUTES minutes   # set at registration
      if mse_started_at <= mse_start_deadline_at:  mse_timeliness = ON_TIME     # INCLUSIVE boundary
      else:                                        mse_timeliness = LATE
      # A start at exactly arrival_at + 30 minutes is ON_TIME; one second later is LATE.
      # LATE additionally appends a SCREENING_DELAY ledger entry with defect_counted true and
      # increments Facility.open_compliance_defect_count, which propagates into the posture rules.
    input_set: "the encounter's own arrival_at and the logical clock at the moment begin-mse is called"
    constants:
      MSE_START_DEADLINE_MINUTES: 30
    precision: "whole seconds; comparison is <= (inclusive) on the deadline instant"

  - name: ambulance_unit_ledger
    trigger: "POST /encounters/{id}/transfer-orders, POST /transfer-orders/{id}/accept, /decline, /complete, and the supersede cancellation"
    algorithm: aggregation
    formula: |
      for each AmbulanceMOU m of the facility:
          m.units_reserved  = count of TransferOrder t where t.ambulance_mou_id == m.id
                              and t.status IN {REQUESTED, ACCEPTED}
          m.units_available = m.units_committed - m.units_reserved
          m.saturation_state = SATURATED if m.units_available == 0 else AVAILABLE
      facility.ambulance_units_committed_total = sum(m.units_committed
                                                    for m where m.status == ACTIVE)
      facility.ambulance_units_reserved_total  = sum(m.units_reserved
                                                    for m where m.status == ACTIVE)
      facility.transfer_capacity_state = AVAILABLE
          if facility.ambulance_units_committed_total
             - facility.ambulance_units_reserved_total > 0 else SATURATED
      # INVARIANT (unit conservation over ACTIVE MOUs of a facility, must hold after every one of the
      # triggering transitions):
      #   sum(m.units_committed) == sum(m.units_reserved) + sum(m.units_available)
      # A create followed by its compensating decline (or supersede-cancel, or complete) must leave
      # sum(m.units_reserved) exactly as it was before the create.
    input_set: "TransferOrder rows in status REQUESTED or ACCEPTED only; DECLINED, CANCELLED and COMPLETED orders hold no units"
    constants: {}
    precision: "integer units; no rounding"
    invariants:
      - "sum(AmbulanceMOU.units_committed) == sum(AmbulanceMOU.units_reserved) + sum(AmbulanceMOU.units_available) over the facility's ACTIVE MOUs"
      - "AmbulanceMOU.units_reserved == count of TransferOrder rows on that MOU with status IN {REQUESTED, ACCEPTED}"

  - name: observation_bed_ledger
    trigger: "POST /encounters/{id}/observation, POST /encounters/{id}/discharge, POST /transfer-orders/{id}/complete"
    algorithm: aggregation
    formula: |
      facility.observation_beds_occupied = count of Encounter e where e.facility_id == facility.id
                                           and e.observation_bed_held == true
      # INVARIANT (bed conservation): observation_beds_occupied is always equal to that count and
      # always satisfies 0 <= observation_beds_occupied <= observation_bed_count. An admission
      # (observation) paired with its compensating release (discharge, or transfer completion) must
      # return observation_beds_occupied to its pre-admission value.
    input_set: "Encounter rows of the facility with observation_bed_held == true, regardless of clinical_state (a TRANSFER_PENDING encounter that entered observation still holds its bed)"
    constants: {}
    precision: "integer beds; no rounding"
    invariants:
      - "Facility.observation_beds_occupied == count(Encounter where facility_id == facility.id and observation_bed_held == true)"
      - "0 <= Facility.observation_beds_occupied <= Facility.observation_bed_count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body and query parameters are well formed: required fields present, enum members valid, integers >= their declared minimum, coinsurance rate within 0..1, end_utc > start_utc, effective_end_date >= effective_start_date, coverage_end_at > coverage_start_at, limit within 1..100, offset >= 0, historical_daily_volumes elements >= 0, code belongs to the stated category"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "path-referenced resources exist, validated left to right: facility, then disclosure template / payer contract / physician shift / volume forecast / transfer agreement / ambulance MOU / encounter / ancillary order / transfer order / claim / dispute case"
    error_id: ERR_FACILITY_NOT_FOUND | ERR_DISCLOSURE_TEMPLATE_NOT_FOUND | ERR_PAYER_CONTRACT_NOT_FOUND | ERR_PHYSICIAN_SHIFT_NOT_FOUND | ERR_VOLUME_FORECAST_NOT_FOUND | ERR_TRANSFER_AGREEMENT_NOT_FOUND | ERR_AMBULANCE_MOU_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_ANCILLARY_ORDER_NOT_FOUND | ERR_TRANSFER_ORDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_DISPUTE_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "body-referenced resources exist and belong to the same facility, validated in declared field order: transfer_agreement_id, then ambulance_mou_id, then payer_contract_id, then volume_forecast_id"
    error_id: ERR_TRANSFER_AGREEMENT_NOT_FOUND | ERR_AMBULANCE_MOU_NOT_FOUND | ERR_PAYER_CONTRACT_NOT_FOUND | ERR_VOLUME_FORECAST_NOT_FOUND
    http_status: 404
    applies_to: "POST /encounters/{id}/transfer-orders, POST /encounters/{id}/claims, GET /facilities/{id}/coverage-summary"
  - priority: 6
    category: state
    check: "expected_facility_version equals Facility.version / expected_encounter_version equals Encounter.version (optimistic concurrency, see concurrency_rules)"
    error_id: ERR_STALE_FACILITY_VERSION | ERR_STALE_ENCOUNTER_VERSION
    http_status: 412
    applies_to: "PATCH /facilities/{id}, POST /disclosure-templates/{id}/publish, POST /encounters/{id}/transfer-orders"
  - priority: 7
    category: state
    check: "template.status == DRAFT before publishing"
    error_id: ERR_TEMPLATE_NOT_PUBLISHABLE
    http_status: 409
    applies_to: "POST /disclosure-templates/{id}/publish"
  - priority: 8
    category: state
    check: "encounter.disclosure_state == DISCLOSURE_PRESENTED before a disclosure decision is recorded"
    error_id: ERR_DISCLOSURE_DECISION_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /encounters/{id}/disclosure-decision"
  - priority: 9
    category: state
    check: "encounter.clinical_state is a declared `from:` state for the requested clinical transition and is not terminal; covers begin-mse from a non-ARRIVED state, complete-mse from a non-MSE_IN_PROGRESS state, observation and discharge from TRANSFER_PENDING or TRANSFERRED or DISCHARGED, transfer ordering from ARRIVED or MSE_IN_PROGRESS or TRANSFERRED or DISCHARGED (transfer ordering IS allowed from MSE_COMPLETE, OBSERVATION and TRANSFER_PENDING, the last being the supersede path), and ancillary ordering on a terminal encounter"
    error_id: ERR_INVALID_ENCOUNTER_STATE
    http_status: 409
    applies_to: "POST /encounters/{id}/begin-mse, /complete-mse, /observation, /discharge, /ancillary-orders, /transfer-orders"
  - priority: 10
    category: state
    check: "ancillary order status == ORDERED before resolving; transfer order status matches the requested transition; claim status matches; dispute status matches"
    error_id: ERR_INVALID_ANCILLARY_ORDER_STATE | ERR_INVALID_TRANSFER_ORDER_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /ancillary-orders/{id}/resolve, POST /transfer-orders/{id}/accept|decline|complete, POST /claims/{id}/adjudicate, POST /encounters/{id}/claims, POST /claims/{id}/dispute-cases, POST /dispute-cases/{id}/offers|initiate-idr|award|withdraw"
  - priority: 11
    category: auth
    check: "segregation of duties: the signage attester's X-User-ID must differ from Facility.current_published_template_id's published_by_user_id, and the actor recording an EMERGENT_WAIVER disclosure decision must differ from Encounter.registered_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /facilities/{id}/signage-attestations, POST /encounters/{id}/disclosure-decision (EMERGENT_WAIVER)"
  - priority: 12
    category: business_safety
    check: "an observation admission or a transfer order requires the medical screening examination to be complete: clinical_state must not be ARRIVED or MSE_IN_PROGRESS"
    error_id: ERR_MSE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /encounters/{id}/observation, POST /encounters/{id}/transfer-orders"
  - priority: 13
    category: business_safety
    check: "clinical_benefit_certified == true on a transfer order (EMTALA physician certification)"
    error_id: ERR_TRANSFER_CERTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders"
  - priority: 14
    category: business_safety
    check: "an UNSTABLE encounter may only be transferred to an agreement with accepts_unstable == true using an MOU with level_of_care == CRITICAL_CARE, and may never be discharged"
    error_id: ERR_STABILIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders, POST /encounters/{id}/discharge"
  - priority: 15
    category: business_safety
    check: "an emergent disclosure waiver requires acuity_level >= EMERGENT_WAIVER_MIN_ACUITY (4)"
    error_id: ERR_WAIVER_NOT_EMERGENT
    http_status: 422
    applies_to: "POST /encounters/{id}/disclosure-decision (EMERGENT_WAIVER)"
  - priority: 16
    category: business_safety
    check: "facility posture gate: posture SUSPENDED blocks registration, observation admission and every ancillary order; posture RESTRICTED blocks ancillary orders whose code is in Facility.restricted_service_codes"
    error_id: ERR_FACILITY_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /facilities/{id}/encounters, POST /encounters/{id}/observation, POST /encounters/{id}/ancillary-orders"
  - priority: 17
    category: business_safety
    check: "registration requires Facility.current_published_template_id != null so a disclosure can be presented and pinned"
    error_id: ERR_NO_PUBLISHED_DISCLOSURE
    http_status: 409
    applies_to: "POST /facilities/{id}/encounters"
  - priority: 18
    category: business_safety
    check: "attested_elements must be a superset of REQUIRED_SIGNAGE_BY_CATEGORY[facility.license_category] and of the PUBLISHED template's required_signage_elements when a template is published"
    error_id: ERR_SIGNAGE_ELEMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /facilities/{id}/signage-attestations"
  - priority: 19
    category: business_constraint
    check: "the ordered code is inside the facility's licensed scope: IMAGING codes in Facility.imaging_scope, LABORATORY codes in Facility.lab_scope, PHARMACY codes permitted by Facility.pharmacy_scope_tier (EMERGENCY_ONLY permits ANALGESIC and ANTIBIOTIC; EXTENDED also permits THROMBOLYTIC)"
    error_id: ERR_OUT_OF_SCOPE_SERVICE
    http_status: 422
    applies_to: "POST /encounters/{id}/ancillary-orders"
  - priority: 20
    category: business_temporal
    check: "a new TransferAgreement must not collide with any existing agreement, whatever its computed status, for the same (facility_id, destination_hospital_name, service_line): the closed date windows [effective_start_date, effective_end_date] must be separated by at least AGREEMENT_MIN_GAP_DAYS (1) clear calendar day in whichever direction the new window sits, i.e. new.effective_start_date >= existing.effective_end_date + 2 days OR new.effective_end_date + 2 days <= existing.effective_start_date; overlapping, touching and merely adjacent (gap 0) windows are all rejected"
    error_id: ERR_AGREEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /facilities/{id}/transfer-agreements"
  - priority: 21
    category: business_temporal
    check: "a new PhysicianShift must not overlap another shift of the same clinician_user_id at the same facility using half-open [start_utc, end_utc) semantics, so a shift starting exactly at another's end_utc is accepted"
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /facilities/{id}/physician-shifts"
  - priority: 22
    category: business_temporal
    check: "the referenced TransferAgreement has status == ACTIVE (logical-clock date inside its inclusive window) at order creation and at acceptance"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders, POST /transfer-orders/{id}/accept"
  - priority: 23
    category: business_temporal
    check: "the order's requested_at falls inside the MOU's half-open coverage window [coverage_start_at, coverage_end_at); an instant exactly equal to coverage_end_at is outside"
    error_id: ERR_MOU_WINDOW_NOT_COVERING
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders"
  - priority: 24
    category: business_temporal
    check: "the referenced PayerContract has status == ACTIVE at claim creation and at adjudication"
    error_id: ERR_PAYER_CONTRACT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /encounters/{id}/claims, POST /claims/{id}/adjudicate"
  - priority: 25
    category: business_referential
    check: "agreement.service_line == encounter.presenting_service_line and agreement.capability_tier >= REQUIRED_TIER_BY_ACUITY[encounter.acuity_level] (1,1,2,3,4 for acuity 1..5)"
    error_id: ERR_TRANSFER_CAPABILITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders"
  - priority: 26
    category: business_referential
    check: "mou.level_of_care satisfies the acuity floor: acuity 4 requires ALS or CRITICAL_CARE, acuity 5 requires CRITICAL_CARE"
    error_id: ERR_MOU_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /encounters/{id}/transfer-orders"
  - priority: 27
    category: business_referential
    check: "PayerContract.idr_eligible == true before a dispute case may be opened or IDR initiated"
    error_id: ERR_IDR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /claims/{id}/dispute-cases, POST /dispute-cases/{id}/initiate-idr"
  - priority: 28
    category: business_constraint
    check: "Facility.observation_beds_occupied < Facility.observation_bed_count before an observation admission"
    error_id: ERR_OBSERVATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /encounters/{id}/observation"
  - priority: 29
    category: business_constraint
    check: "the referenced MOU has units_available >= 1 (a units_committed of 0 can never satisfy this)"
    error_id: ERR_AMBULANCE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /encounters/{id}/transfer-orders"
  - priority: 30
    category: business_constraint
    check: "aggregate coverage cap: the number of PhysicianShift rows with role_type == PHYSICIAN overlapping any instant of the new shift's half-open interval, including the new shift, must not exceed Facility.max_concurrent_physicians"
    error_id: ERR_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /facilities/{id}/physician-shifts"
  - priority: 31
    category: business_fiscal
    check: "a facility offer requires DisputeCase.round_index < NEGOTIATION_MAX_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /dispute-cases/{id}/offers"
  - priority: 32
    category: business_fiscal
    check: "IDR initiation requires DisputeCase.round_index >= NEGOTIATION_MAX_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_NOT_EXHAUSTED
    http_status: 422
    applies_to: "POST /dispute-cases/{id}/initiate-idr"
  - priority: 33
    category: business_fiscal
    check: "award_cents lies inside the inclusive band [min(last_offer_cents, last_counteroffer_cents), max(last_offer_cents, last_counteroffer_cents)]"
    error_id: ERR_AWARD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /dispute-cases/{id}/award"
  - priority: 34
    category: business_constraint
    check: "version_label is unique among the facility's DisclosureTemplate rows"
    error_id: ERR_DUPLICATE_TEMPLATE_VERSION
    http_status: 409
    applies_to: "POST /facilities/{id}/disclosure-templates"
  - priority: 35
    category: business_constraint
    check: "at most one Claim per encounter, and the encounter must have reached TRANSFERRED or DISCHARGED"
    error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /encounters/{id}/claims"

endpoints:
  - method: POST
    path: /facilities
    purpose: "Register a freestanding emergency department with its licensure category, bed count and ancillary scope"
    roles: [FacilityAdministrator]
    input: [name, state_code, license_category, "license_status?", observation_bed_count, imaging_scope, lab_scope, pharmacy_scope_tier, max_concurrent_physicians]
    output: Facility
    side_effects:
      - "signage_attestation_status = PENDING, signage_attested_at = null, signage_expires_at = null"
      - "observation_beds_occupied = 0, open_compliance_defect_count = 0, current_published_template_id = null"
      - "compliance_posture computed per calculations.facility_compliance_posture - RESTRICTED at creation because signage is PENDING and no template is published"
      - "restricted_service_codes = [MRI, THROMBOLYTIC], transfer_capacity_state = SATURATED, coverage_deficit_flag = false"
      - "version = 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: /facilities/{id}
    purpose: "Read a facility with all derived compliance, capacity and ledger-mirror fields"
    roles: [FacilityAdministrator, ComplianceOfficer, RegistrationClerk, EmergencyPhysician, PayerRepresentative]
    input: []
    output: Facility
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FACILITY_NOT_FOUND]
  - method: PATCH
    path: /facilities/{id}
    purpose: "Update mutable facility configuration under optimistic concurrency control"
    roles: [FacilityAdministrator]
    input: [expected_facility_version, "license_status?", "observation_bed_count?", "max_concurrent_physicians?", "imaging_scope?", "lab_scope?", "pharmacy_scope_tier?"]
    output: Facility
    side_effects:
      - "declared fields replaced; omitted fields untouched"
      - "compliance_posture and restricted_service_codes recomputed per calculations.facility_compliance_posture"
      - "a posture change to RESTRICTED or SUSPENDED cascades to the facility's ACTIVE VolumeForecast (method rewritten to PEAK_ADJUSTED, escalated_by_posture = true, coverage fields and coverage_deficit_flag recomputed)"
      - "ComplianceLedgerEntry appended with event_type == POSTURE_CHANGE when compliance_posture actually changes"
      - "version incremented by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_STALE_FACILITY_VERSION]
  - method: POST
    path: /facilities/{id}/signage-attestations
    purpose: "File a signage attestation covering the licensure category's required patient-facing signage elements"
    roles: [ComplianceOfficer]
    input: [attested_elements, "attestation_note?"]
    output: Facility
    side_effects:
      - "signage_attestation_status = ATTESTED, signage_attested_at = logical clock, signage_expires_at = signage_attested_at + 365 days, signage_attested_by_user_id = X-User-ID"
      - "any open SIGNAGE_DEFECT ledger entry is resolved and open_compliance_defect_count decremented once per resolved defect"
      - "compliance_posture and restricted_service_codes recomputed; a resulting posture change cascades to the ACTIVE VolumeForecast as in PATCH /facilities/{id}"
      - "ComplianceLedgerEntry appended with event_type == SIGNAGE_ATTESTED, severity == INFO, defect_counted == false"
      - "version incremented by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_SIGNAGE_ELEMENTS_INCOMPLETE]
  - method: GET
    path: /facilities/{id}/coverage-summary
    purpose: "Computed read reconciling the selected volume forecast's physician-hour requirement against scheduled coverage, plus live capacity counters"
    roles: [FacilityAdministrator, ComplianceOfficer]
    input: ["volume_forecast_id?"]
    output:
      facility_id: string
      compliance_posture: string
      selected_volume_forecast_id: string
      forecast_basis: string
      forecast_method: string
      required_physician_hours_per_day: number
      required_physician_hours_total: number
      required_board_certified_hours_total: number
      scheduled_physician_hours: number
      board_certified_hours: number
      coverage_deficit_hours: number
      coverage_compliant: boolean
      coverage_deficit_flag: boolean
      observation_bed_count: integer
      observation_beds_occupied: integer
      ambulance_units_available: integer
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FACILITY_NOT_FOUND, ERR_VOLUME_FORECAST_NOT_FOUND]
  - method: GET
    path: /facilities/{id}/compliance-ledger-entries
    purpose: "Append-only compliance ledger for the facility, oldest first"
    roles: [FacilityAdministrator, ComplianceOfficer]
    input: ["event_type?", "severity?", "limit?", "offset?"]
    output: ComplianceLedgerEntry[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND]
  - method: POST
    path: /facilities/{id}/disclosure-templates
    purpose: "Draft a patient-facing facility-fee and network-status disclosure template"
    roles: [FacilityAdministrator]
    input: [version_label, "supersedes_version_label?", facility_fee_cents, observation_hourly_cents, network_status_statement, required_signage_elements]
    output: DisclosureTemplate
    side_effects:
      - "status = DRAFT, published_at = null, published_by_user_id = null"
      - "no effect on Facility.current_published_template_id or compliance_posture"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_DUPLICATE_TEMPLATE_VERSION]
  - method: GET
    path: /facilities/{id}/disclosure-templates
    purpose: "List the facility's disclosure templates"
    roles: [FacilityAdministrator, ComplianceOfficer, RegistrationClerk]
    input: ["status?", "limit?", "offset?"]
    output: DisclosureTemplate[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND]
  - method: GET
    path: /disclosure-templates/{id}
    purpose: "Read a single disclosure template"
    roles: [FacilityAdministrator, ComplianceOfficer, RegistrationClerk]
    input: []
    output: DisclosureTemplate
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DISCLOSURE_TEMPLATE_NOT_FOUND]
  - method: POST
    path: /disclosure-templates/{id}/publish
    purpose: "Publish a draft disclosure template, retiring the previously published one, under facility-level optimistic concurrency"
    roles: [FacilityAdministrator]
    input: [expected_facility_version]
    output: DisclosureTemplate
    side_effects:
      - "status = PUBLISHED, published_at = logical clock, published_by_user_id = X-User-ID"
      - "the facility's previously PUBLISHED template transitions to RETIRED"
      - "Facility.current_published_template_id = this template id"
      - "Facility.compliance_posture and restricted_service_codes recomputed; a resulting posture change cascades to the ACTIVE VolumeForecast"
      - "ComplianceLedgerEntry appended with event_type == TEMPLATE_PUBLISHED"
      - "Facility.version incremented by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DISCLOSURE_TEMPLATE_NOT_FOUND, ERR_STALE_FACILITY_VERSION, ERR_TEMPLATE_NOT_PUBLISHABLE]
  - method: POST
    path: /facilities/{id}/payer-contracts
    purpose: "Record a payer contract with its QPA, cost-share parameters and state balance-billing regime"
    roles: [FacilityAdministrator, ComplianceOfficer]
    input: [payer_name, network_status, qualifying_payment_amount_cents, in_network_coinsurance_rate, in_network_deductible_remaining_cents, state_protection_regime, effective_start_date, effective_end_date]
    output: PayerContract
    side_effects:
      - "status computed from the logical-clock date against the inclusive effective window"
      - "idr_eligible computed from network_status and state_protection_regime"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND]
  - method: GET
    path: /facilities/{id}/payer-contracts
    purpose: "List the facility's payer contracts"
    roles: [FacilityAdministrator, ComplianceOfficer, PayerRepresentative]
    input: ["status?", "network_status?", "limit?", "offset?"]
    output: PayerContract[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND]
  - method: GET
    path: /payer-contracts/{id}
    purpose: "Read a single payer contract"
    roles: [FacilityAdministrator, ComplianceOfficer, PayerRepresentative]
    input: []
    output: PayerContract
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PAYER_CONTRACT_NOT_FOUND]
  - method: POST
    path: /facilities/{id}/physician-shifts
    purpose: "Schedule a coverage block against the facility's physician coverage minimums"
    roles: [FacilityAdministrator]
    input: [clinician_user_id, role_type, board_certified, start_utc, end_utc]
    output: PhysicianShift
    side_effects:
      - "duration_hours computed from the half-open [start_utc, end_utc) interval"
      - "the facility's ACTIVE VolumeForecast has scheduled_physician_hours, coverage_deficit_hours recomputed per calculations.coverage_reconciliation"
      - "Facility.coverage_deficit_flag recomputed; Facility.version incremented by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_FACILITY_NOT_FOUND, ERR_CLINICIAN_DOUBLE_BOOKED, ERR_COVERAGE_CAPACITY_EXCEEDED]
