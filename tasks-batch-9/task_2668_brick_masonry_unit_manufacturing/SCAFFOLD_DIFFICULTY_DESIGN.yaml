            - "${b1_composed} == COMPOSED, which satisfies priority 19 without touching the panel"
            - "${err_low} == ERR_PANEL_NOT_APPROVED with HTTP 422 - priority 22 was genuinely violated the whole time and only surfaces once 19 is clear"
            - "${pn1_approved} == APPROVED and ${pn1_expires} == 2027-01-28T00:00:00Z (2026-08-01 plus PANEL_APPROVAL_VALID_DAYS 180)"
            - "${b1_certified} == CERTIFIED once both rules are satisfied"
