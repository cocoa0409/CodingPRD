  # =====================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three instances, three DIFFERENT error-category pairs, each violable
  # by a single request:
  #   state (40)            vs business_fiscal (76)
  #   business_safety (50)  vs business_referential (62)
  #   business_temporal (56) vs business_constraint (66)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reapprove_allocated_application_returns_invalid_state_not_pool_exhausted
        grounds:
          - validations[priority=40]
          - validations[priority=76]
          - state_machines.StateBenefitApplication.SUBMITTED_to_APPROVED
          - calculations.program_pool_ledger
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PROGRAM_POOL_EXHAUSTED]
        distinguishing_aspect: |
          Category pair state (priority 40) vs business_fiscal (priority 76): a second APPROVE on an
          application already APPROVED and already holding 540000 of a 990000 pool violates BOTH rules in
          one request (540000 + 540000 = 1080000 > 990000), and the lower priority number must win, so the
          response is ERR_INVALID_STATE_TRANSITION and never ERR_PROGRAM_POOL_EXHAUSTED.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "StateProgram prog TUITION_WAIVER, fiscal_year 2026, annual_pool_cents 990000, min_rating_pct 0, requires_wartime false, max_award_cents 900000."
            - "Veteran vet with discharge VERIFIED and intake_status SCREENED."
            - "StateBenefitApplication app with tuition_credits_requested 12, already APPROVED with benefit_amount_cents 540000, so prog.allocated_cents is 540000 and a second 540000 allocation would exceed the pool."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-101", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/state-programs"
              payload: { program_code: "TUI-2026", program_name: "Veteran Dependent Tuition Waiver", program_type: "TUITION_WAIVER", fiscal_year: 2026, annual_pool_cents: 990000, min_rating_pct: 0, requires_wartime: false, max_award_cents: 900000 }
              as: SystemAdmin
              captures: { prog: $.data.id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { prog_v: $.data.version }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${prog_v}", tuition_credits_requested: 12 }
              as: IntakeClerk
              captures: { app: $.data.id }
            - call: "POST /cvso/state-benefit-applications/${app}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
          trigger:
            - call: "POST /cvso/state-benefit-applications/${app}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "${err} != ERR_PROGRAM_POOL_EXHAUSTED"
            - "HTTP status == 409"
            - "StateBenefitApplication.${app}.determination_status == APPROVED"
            - "StateBenefitApplication.${app}.benefit_amount_cents == 540000"
            - "StateProgram.${prog}.allocated_cents == 540000"

