      - name: the_same_user_cannot_screen_and_disposition_or_admit_and_waive_or_record_and_decide
        claim_type: rbac_enforcement
        grounds:
          - validations[priority=24]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "All three segregation pairs are checked on X-User-ID, not on role: the screener cannot disposition even wearing the ProgramAdmin role, the admitting case manager cannot be the one who WAIVES that admission's notification, and the specialist who recorded the mediation outcome cannot decide the case - yet each operation succeeds immediately when a second user id performs it."
