              as: FleetPlanner
              captures: { p_stop1_service: $.data.service_minutes }
            - call: "POST /fleet/trips/${trip_p_id}/stops"
              payload: { sequence: 2, stop_type: "DROP_OFF", scheduled_arrival_at: "2026-08-07T09:15:00Z", scheduled_departure_at: "2026-08-07T09:35:00Z", drive_minutes_from_prev: 240, miles_from_prev: 200, segment_loaded: true, cases: 0 }
              as: FleetPlanner
