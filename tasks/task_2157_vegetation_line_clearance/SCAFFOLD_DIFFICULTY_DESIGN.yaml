          setup:
            - "Circuit CKT-A, plan budget 5000000, two COMPLETED UNIT_PRICE spans of 2.5 miles with 200 planned units each."
            - "Span WO-X completed exactly 100 units; span WO-Y completed 99 units. No refusals."
