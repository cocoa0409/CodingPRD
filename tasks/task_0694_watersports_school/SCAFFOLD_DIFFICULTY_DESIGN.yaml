              as: SchoolAdmin
              captures: { ses: $.data.id, v0: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${ses}", enrollment_id: "${enr}", expected_session_version: "${v0}" }
              as: SchoolAdmin
              captures: { bk: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /waivers/${wv}/revoke"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /bookings/${bk}/check-in"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WAIVER_REQUIRED"

      - name: rental_checkout_blocked_by_equipment_maintenance
        grounds:
          - state_machines.RentalAgreement.status.RESERVED_to_ACTIVE
          - entities.EquipmentItem.fields.status
          - errors[ERR_EQUIPMENT_IN_MAINTENANCE]
        distinguishing_aspect: |
          Different entity pair RentalAgreement->EquipmentItem: a RESERVED rental cannot be checked
          out while the linked EquipmentItem.status == MAINTENANCE -> ERR_EQUIPMENT_IN_MAINTENANCE.
        test_recipe:
          setup:
            - "A RESERVED rental on an equipment item; the item is then toggled to MAINTENANCE before checkout; clock past starts_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Mt School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "BOARD", asset_tag: "B-1", hourly_rate_cents: 1000, deposit_cents: 0 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv0: $.data.version }
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T12:00:00Z", expected_equipment_version: "${eqv0}" }
              as: SchoolAdmin
              captures: { rent: $.data.id }
            - call: "GET /equipment/${eq}"
              payload: {}
              as: SchoolAdmin
              captures: { eqv1: $.data.version }
            - call: "POST /equipment/${eq}/maintenance"
              payload: { in_maintenance: true, expected_equipment_version: "${eqv1}" }
              as: SchoolAdmin
          trigger:
            - call: "POST /rentals/${rent}/checkout"
              payload: {}
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EQUIPMENT_IN_MAINTENANCE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_double_booking_half_open_touching_allowed
        grounds:
          - validations[priority=15]
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
          - entities.Session.fields.instructor_id
        distinguishing_aspect: |
          Half-open [start,end) interval semantics with NO buffer: a second session whose
          interval [10:00,11:00) overlaps the first [09:00,10:30) for the same instructor is
          rejected; touching at exactly 10:30 would be allowed (this one overlaps -> rejected).
        test_recipe:
          setup:
            - "Instructor has a SCHEDULED session 09:00-10:30; schedule a second 10:00-11:00 for the same instructor (overlap)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Dbl School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-10T09:00:00Z", ends_at: "2026-03-10T10:30:00Z", tide_window_start: "2026-03-10T08:00:00Z", tide_window_end: "2026-03-10T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses1: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-10T10:00:00Z", ends_at: "2026-03-10T11:00:00Z", tide_window_start: "2026-03-10T08:00:00Z", tide_window_end: "2026-03-10T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED"

      - name: equipment_rental_overlap_within_one_hour_buffer
        grounds:
          - validations[priority=16]
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
          - entities.RentalAgreement.fields.equipment_item_id
        distinguishing_aspect: |
          DIFFERENT interval semantics on a different resource: closed-interval-WITH-1h-buffer.
          An existing rental ending 12:00 reserves through 13:00; a new rental 12:30-14:00 falls
          inside the buffer and is rejected -> ERR_EQUIPMENT_UNAVAILABLE (would be allowed if
          buffer were absent and intervals merely touched).
        test_recipe:
          setup:
            - "Equipment with a non-terminal RESERVED rental 09:00-12:00; new rental 12:30-14:00 (30 min into the 1h turnaround buffer)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Eq School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "BOARD", asset_tag: "B-1", hourly_rate_cents: 1000, deposit_cents: 0 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv0: $.data.version }
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T12:00:00Z", expected_equipment_version: "${eqv0}" }
              as: SchoolAdmin
              captures: { r1: $.data.id }
            - call: "GET /equipment/${eq}"
              payload: {}
              as: SchoolAdmin
              captures: { eqv1: $.data.version }
          trigger:
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T12:30:00Z", ends_at: "2026-03-02T14:00:00Z", expected_equipment_version: "${eqv1}" }
              as: SchoolAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EQUIPMENT_UNAVAILABLE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: makeup_credit_conserved_cancel_grants_then_makeup_consumes
        grounds:
          - state_machines.Session.status.SCHEDULED_to_CANCELLED
          - state_machines.SessionBooking.status.BOOKED_to_CANCELLED
          - entities.Membership.fields.makeup_credit_balance
        distinguishing_aspect: |
          Conserved quantity = Membership.makeup_credit_balance. Forward action (school cancels a
          session, +1 credit) paired with its compensating action (booking a makeup, -1 credit)
          returns makeup_credit_balance to its starting value 0.
        test_recipe:
          setup:
            - "PREMIUM member; one session A with the member BOOKED; a second future session B with capacity for a makeup booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Mk School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /memberships"
              payload: { student_id: "${stu}", tier: "PREMIUM" }
              as: SchoolAdmin
              captures: { mem: $.data.id }
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", membership_id: "${mem}", planned_sessions: 2, party_size: 1 }
              as: SchoolAdmin
              captures: { enr: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { sesA: $.data.id, vA: $.data.version }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-12T09:00:00Z", ends_at: "2026-03-12T10:00:00Z", tide_window_start: "2026-03-12T08:00:00Z", tide_window_end: "2026-03-12T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { sesB: $.data.id, vB: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${sesA}", enrollment_id: "${enr}", expected_session_version: "${vA}" }
              as: SchoolAdmin
              captures: { bkA: $.data.id }
            - call: "POST /sessions/${sesA}/cancel"
              payload: {}
              as: SchoolAdmin
            - call: "GET /memberships/${mem}"
              payload: {}
              as: SchoolAdmin
              captures: { credit_after_cancel: $.data.makeup_credit_balance }
          trigger:
            - call: "POST /bookings"
              payload: { session_id: "${sesB}", enrollment_id: "${enr}", expected_session_version: "${vB}", use_makeup_credit: true }
              as: SchoolAdmin
              captures: { bkB: $.data.id }
            - call: "GET /memberships/${mem}"
              payload: {}
              as: SchoolAdmin
              captures: { credit_final: $.data.makeup_credit_balance }
          assert:
            - "Membership.${mem}.makeup_credit_balance == 0"
            - "SessionBooking.${bkB}.is_makeup == true"

      - name: equipment_availability_conserved_checkout_then_return
        grounds:
          - state_machines.RentalAgreement.status.RESERVED_to_ACTIVE
          - state_machines.RentalAgreement.status.ACTIVE_to_RETURNED
          - entities.EquipmentItem.fields.status
        distinguishing_aspect: |
          Different conserved quantity = EquipmentItem availability (status AVAILABLE). Forward
          action checkout (AVAILABLE->RENTED) paired with compensating return (RENTED->AVAILABLE)
          leaves EquipmentItem.status == AVAILABLE, unchanged from start.
        test_recipe:
          setup:
            - "An AVAILABLE equipment item with a RESERVED rental; clock past starts_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Av School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "BOARD", asset_tag: "B-1", hourly_rate_cents: 1000, deposit_cents: 5000 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv0: $.data.version }
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T12:00:00Z", expected_equipment_version: "${eqv0}" }
              as: SchoolAdmin
              captures: { rent: $.data.id }
            - call: "POST /rentals/${rent}/checkout"
              payload: {}
              as: SchoolAdmin
            - call: "GET /equipment/${eq}"
              payload: {}
              as: SchoolAdmin
              captures: { status_after_checkout: $.data.status }
          trigger:
            - call: "POST /rentals/${rent}/return"
              payload: {}
              as: SchoolAdmin
            - call: "GET /equipment/${eq}"
              payload: {}
              as: SchoolAdmin
              captures: { status_final: $.data.status }
          assert:
            - "EquipmentItem.${eq}.status == AVAILABLE"
            - "RentalAgreement.${rent}.status == RETURNED"
