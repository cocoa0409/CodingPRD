# =============================================================================
# Task 1749: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — §1.9
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Default logical clock 2026-08-01T00:00:00Z applies unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_program_applies_defaults
        claim_type: defaults
        grounds: [entities.InclusionProgram.fields.status, entities.InclusionProgram.fields.posture, entities.InclusionProgram.fields.unallocated_pool_cents]
        distinguishing_aspect: "Omitting optional goals yields defaults: status SETUP, posture NORMAL, goals [], unallocated_pool_cents == pool_total_cents."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 250000 }, as: DeiAdmin, captures: { pid: $.data.id, st: $.data.status, po: $.data.posture, un: $.data.unallocated_pool_cents, vv: $.data.version } }
          trigger: []
          assert:
            - "st == SETUP and po == NORMAL"
            - "un == 250000 (unallocated equals pool before any allocation)"
            - "vv == 1 (initial version)"
      - name: get_group_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND / 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/groups/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: create_group_id_input_ignored
        claim_type: system_fields
        grounds: [entities.ErgGroup]
        distinguishing_aspect: "Client-supplied id is ignored: server mints its own UUID; version starts at 1 and created_at is server-stamped."
        test_recipe:
          setup: ["program OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
          trigger:
            - { call: "POST /v1/groups", payload: { id: "11111111-1111-1111-1111-111111111111", program_id: "${pid}", name: "Id Ignore", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l21", captures: { gid: $.data.id, gv: $.data.version } }
          assert:
            - "gid != '11111111-1111-1111-1111-111111111111' (server-minted)"
            - "gv == 1 and response includes created_at and updated_at"
      - name: survey_response_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.SurveyResponse]
        distinguishing_aspect: "SurveyResponse declares common_fields: false — response body exposes id and created_at but no version/updated_at; no update endpoint exists in §1.5."
        test_recipe:
          setup: ["program OPEN; survey OPEN with window covering default clock"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/climate-surveys", payload: { program_id: "${pid}", title: "S", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-01T00:00:00Z", min_responses: 1 }, as: DeiAdmin, captures: { sv: $.data.id } }
            - { call: "POST /v1/climate-surveys/${sv}/open", payload: {}, as: DeiAdmin }
          trigger:
            - { call: "POST /v1/survey-responses", payload: { survey_id: "${sv}", belonging_score: 4, growth_score: 4, fairness_score: 4, safety_score: 4 }, as: Employee, as_user_id: "emp_r9", captures: { rid: $.data.id, score: $.data.response_score } }
          assert:
            - "response contains id and created_at but no version field"
            - "score == 4.00 (weighted score of all-4s)"
      - name: membership_computed_count_on_group
        claim_type: computed_fields
        grounds: [entities.ErgGroup.fields.active_member_count]
        distinguishing_aspect: "active_member_count is computed: after 3 joins GET group shows 3 even though no count field was ever posted."
        test_recipe:
          setup: ["program OPEN; group in CHARTER_DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Counted", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l22", captures: { g: $.data.id } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_k1" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_k2" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_k3" }, as: DeiAdmin }
          trigger:
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { mc: $.data.active_member_count } }
          assert:
            - "mc == 3"
      - name: list_groups_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count + has_more per the fixed envelope."
        test_recipe:
          setup: ["program OPEN with 2 groups"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Page One", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l23", captures: { g1: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Page Two", mission_statement: "m", category: "PROFESSIONAL" }, as: GroupLeader, as_user_id: "emp_l24", captures: { g2: $.data.id } }
          trigger:
            - { call: "GET /v1/groups", payload: { program_id: "${pid}", limit: 1, offset: 0 }, as: DeiAdmin }
            - { call: "GET /v1/groups", payload: { program_id: "${pid}", limit: 1, offset: 1 }, as: DeiAdmin }
          assert:
            - "first page: data length 1, total_count == 2, has_more == true"
            - "second page: data length 1, total_count == 2, has_more == false"

  - section: state_machines
    instances:
      - name: charter_rejected_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ErgGroup.SPONSOR_ENDORSED_to_CHARTER_REJECTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "From CHARTER_REJECTED no further transitions exist: a resubmit attempt returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["group fully reviewed then REJECTED by DeiAdmin"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp19", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Terminal Group", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l25", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l25" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "REJECT" }, as: DeiAdmin, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l25", captures: { err: $.data.error_id } }
          assert:
            - "st == CHARTER_REJECTED"
            - "err == ERR_INVALID_STATE_TRANSITION (HTTP 409); no side effects fire"
      - name: dei_approve_skips_sponsor_endorsement_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FundingRequest.ENDORSED_to_APPROVED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Approval chain cannot skip a step: dei-decision APPROVE on a SUBMITTED (not yet ENDORSED) request fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["program ALLOCATION_LOCKED; group ACTIVE with leader term; request SUBMITTED"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 500000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp20", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Chain Group", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l26", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l26" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/leadership-terms", payload: { group_id: "${g}", leader_employee_id: "emp_f01", ends_at: "2027-02-01T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/programs/${pid}/lock-allocation", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/funding-requests", payload: { group_id: "${g}", category: "EVENT", purpose: "Skip step", requested_cents: 50000, external_matching_cents: 0 }, as: GroupLeader, as_user_id: "emp_f01", captures: { fr: $.data.id } }
          trigger:
            - { call: "POST /v1/funding-requests/${fr}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (ENDORSED required before APPROVE)"
      - name: publish_on_cancelled_event_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ErgEvent.PLANNED_to_PUBLISHED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CANCELLED is terminal for the event lifecycle axis: publish afterwards fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["group ACTIVE; event PLANNED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp21", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Cancel Publish", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l27", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l27" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/venues", payload: { name: "Room Q", capacity: 30 }, as: DeiAdmin, captures: { v: $.data.id } }
            - { call: "POST /v1/events", payload: { group_id: "${g}", venue_id: "${v}", title: "Doomed", category: "SOCIAL", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", capacity: 10 }, as: DeiAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/events/${ev}/cancel", payload: {}, as: DeiAdmin }
          trigger:
            - { call: "POST /v1/events/${ev}/publish", payload: {}, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (HTTP 409)"
      - name: double_leave_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.GroupMembership.ACTIVE_to_INACTIVE, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Repeating the same leave trigger twice: the first succeeds (INACTIVE), the second fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["program OPEN; group CHARTER_DRAFT; emp_x is an ACTIVE member"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Leave Twice", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l28", captures: { g: $.data.id } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}" }, as: Employee, as_user_id: "emp_x", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /v1/memberships/${m}/leave", payload: {}, as: Employee, as_user_id: "emp_x", captures: { st1: $.data.status } }
            - { call: "POST /v1/memberships/${m}/leave", payload: {}, as: Employee, as_user_id: "emp_x", captures: { err: $.data.error_id } }
          assert:
            - "st1 == INACTIVE"
            - "second leave: err == ERR_INVALID_STATE_TRANSITION (HTTP 409)"
      - name: resign_triggers_gap_withdrawal_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.LeadershipTerm.ACTIVE_to_RESIGNED, state_machines.FundingRequest.COUNTERED_to_WITHDRAWN]
        distinguishing_aspect: "The manual-resign variant of the gap cascade (different trigger than the §1.8 clock sweep): resigning the only ACTIVE term withdraws a COUNTERED funding request."
        test_recipe:
          setup: ["program OPEN; group ACTIVE; emp_f01 ACTIVE term; funding request COUNTERED (sponsor countered at 40000)"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 500000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sp22", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { sp: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "Resign Gap", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l29", captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f01" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f02" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f03" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f04" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f05" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f06" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f07" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f08" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_f10" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${sp}", expected_group_version: "${gv}" }, as: DeiAdmin }
            - { call: "POST /v1/groups/${g}/submit-charter", payload: {}, as: GroupLeader, as_user_id: "emp_l29" }
            - { call: "POST /v1/groups/${g}/sponsor-decision", payload: { decision: "ENDORSE" }, as: ExecutiveSponsor, as_user_id: "${sp}" }
            - { call: "POST /v1/groups/${g}/dei-decision", payload: { decision: "APPROVE" }, as: DeiAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: DeiAdmin }
            - { call: "POST /v1/leadership-terms", payload: { group_id: "${g}", leader_employee_id: "emp_f01", ends_at: "2027-02-01T00:00:00Z" }, as: DeiAdmin, captures: { term: $.data.id } }
            - { call: "POST /v1/funding-requests", payload: { group_id: "${g}", category: "OTHER", purpose: "Countered then orphaned", requested_cents: 60000, external_matching_cents: 0 }, as: GroupLeader, as_user_id: "emp_f01", captures: { fr: $.data.id } }
            - { call: "POST /v1/funding-requests/${fr}/sponsor-decision", payload: { decision: "COUNTER", counter_amount_cents: 40000 }, as: ExecutiveSponsor, as_user_id: "${sp}" }
          trigger:
            - { call: "POST /v1/leadership-terms/${term}/resign", payload: {}, as: GroupLeader, as_user_id: "emp_f01", captures: { tst: $.data.status } }
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { gap: $.data.has_active_leader } }
            - { call: "GET /v1/funding-requests/${fr}", payload: {}, as: DeiAdmin, captures: { fst: $.data.status } }
          assert:
            - "tst == RESIGNED"
            - "gap == false"
            - "fst == WITHDRAWN (COUNTERED requests are cascade-withdrawn on leadership gap)"
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.ErgGroup, state_machines.FundingRequest, state_machines.MentoringEngagement, state_machines.ClimateSurvey]
        distinguishing_aspect: "New resources land in their declared initial states: group CHARTER_DRAFT, funding request SUBMITTED, engagement PROPOSED, survey DRAFT."
        test_recipe:
          setup: ["program OPEN; sponsor; group CHARTER_DRAFT"]
