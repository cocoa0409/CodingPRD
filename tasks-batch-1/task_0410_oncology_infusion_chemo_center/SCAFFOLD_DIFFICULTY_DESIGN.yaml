              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
