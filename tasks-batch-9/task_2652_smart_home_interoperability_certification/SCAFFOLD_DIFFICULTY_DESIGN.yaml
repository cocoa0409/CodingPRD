  - rule_id: priority_pair_validation_conflict
    instances:
      - name: good_standing_outranks_insufficient_credit_on_submit
        grounds:
          - validations[priority=25]
          - validations[priority=50]
          - errors[ERR_MEMBER_NOT_IN_GOOD_STANDING]
          - errors[ERR_INSUFFICIENT_CREDIT]
          - endpoints[POST /submissions/{submission_id}/submit]
        distinguishing_aspect: |
          PRIORITY PAIR A - the conflicting categories are business_safety (priority 25) against
          business_fiscal (priority 50), i.e. compliance against money, and the deciding response is a
          409. The same request violates both rules simultaneously; restoring only the compliance side
          then exposes the fiscal error underneath, which proves the ordering rather than merely
          observing one error.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with two MANDATORY LIGHTING feature sets (20 and 10 cases)."
            - "One Member who executed an IP commitment against that specification, was granted tool access, purchased only 100000 cents, and then had tool access REVOKED - so good_standing is false AND credit_balance_cents (100000) is below the pinned certification_fee_cents (150000)."
            - "One CertificationSubmission in state DRAFT with certification_fee_cents 150000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_DIM", obligation: "MANDATORY", test_case_count: 10 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 3, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF", "CORE_DIM"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:BB:CC:DD" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "REVOKE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 50000 }
              as: ProgramAdmin
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "The first submit returns 409 ERR_MEMBER_NOT_IN_GOOD_STANDING, NOT 402 ERR_INSUFFICIENT_CREDIT, even though both rules are violated"
            - "After that refusal the submission is untouched: state == DRAFT, fee_escrowed_cents == 0, and Member.${m1_id}.credit_balance_cents == 100000"
            - "After tool access is restored (good_standing == true) the second submit returns 402 ERR_INSUFFICIENT_CREDIT - the lower-priority rule was masked, not absent (100000 < 150000)"
            - "After topping up to exactly 150000 the third submit succeeds: CertificationSubmission.${sub_id}.state == SUBMITTED, fee_escrowed_cents == 150000, submitted_at == \"2026-09-01T00:00:00Z\""
            - "Member.${m1_id}.credit_balance_cents == 0, escrowed_credit_cents == 150000, credits_purchased_cents == 150000 (the ceiling case credit_balance_cents == certification_fee_cents is accepted, the check is >=)"

      - name: bench_window_conflict_outranks_lab_capacity_on_session_create
        grounds:
          - validations[priority=38]
          - validations[priority=49]
          - errors[ERR_BENCH_WINDOW_CONFLICT]
          - errors[ERR_LAB_CAPACITY_EXCEEDED]
          - calculations.laboratory_reserved_bench_minutes
          - endpoints[POST /test-sessions]
        distinguishing_aspect: |
          PRIORITY PAIR B - a DIFFERENT error-category pair: business_temporal (priority 38) against
          business_constraint (priority 49), on a different endpoint and a different entity from
          pair A. Both requests below breach the capacity ceiling identically; the only difference is
          whether the requested window also collides with an existing booking, which flips the response
          from ERR_LAB_CAPACITY_EXCEEDED to ERR_BENCH_WINDOW_CONFLICT.
        test_recipe:
