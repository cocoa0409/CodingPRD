            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T06:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 95 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { gt: $.data.id } }
          trigger:
            - { call: "POST /gradation-tests/${gt}/confirm", payload: {}, as: QCTechnician, as_user_id: "qc-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SOD_VIOLATION (http 403); GradationTest.${gt}.status stays REPORTED"

      - name: not_found_beats_state_on_weighout
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "A weigh-out against a nonexistent ticket id returns 404 ERR_NOT_FOUND, never a state error — existence (4) precedes state (5)."
        test_recipe:
          setup: ["empty DB is sufficient"]
          setup_api_calls: []
          trigger:
            - { call: "POST /scale-tickets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_NOT_FOUND (http 404)"

      - name: adjustment_below_reserved_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=11]", "errors[ERR_ADJUSTMENT_BELOW_RESERVED]"]
        distinguishing_aspect: "A negative adjustment is legal per se but rejected when it would drop on_hand_tons (100.0) below reserved_tons (30.0): the aggregate invariant wins."
        test_recipe:
          setup: ["site; spec; pile on_hand 100.0 (v2 after adjustment); order qty 30 CONFIRMED (reserved 30.0, pile v3 read back)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
