              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-171", equipment_type: "TRACTOR", model_year: 2021, inspection_due_at: "2026-09-10T00:00:00Z" }
              as: SafetyReviewer
              captures: { eq_id: $.data.id }
          trigger:
            - call: "POST /network/equipment/${eq_id}/record-inspection"
              payload: { inspected_at: "2026-09-09T23:59:59Z", result: "PASS", inspector_certificate: "CERT-TX-911" }
              as: SafetyReviewer
              captures: { eq_after_pass: $.data.inspection_status }
            - call: "POST /network/equipment/${eq_id}/record-inspection"
              payload: { inspected_at: "2026-09-10T00:00:00Z", result: "PASS", inspector_certificate: "CERT-TX-912" }
              as: SafetyReviewer
              captures: { err_late: $.data.error_id }
          assert:
            - "the first call returns 200 and Equipment.${eq_id}.status == IN_SERVICE with inspection_status CURRENT"
            - "the second call returns 409 and err_late == ERR_EQUIPMENT_INSPECTION_OVERDUE"
            - "Equipment.${eq_id}.inspection_passed_at == 2026-09-09T23:59:59Z — the late record did not overwrite it"
            - "with the clock advanced to exactly 2026-09-10T00:00:00Z a fresh unit whose inspection_passed_at is null reports inspection_status OVERDUE, while a unit inspected at 2026-09-09T23:59:59Z keeps CURRENT because inspection_passed_at < inspection_due_at"

      - name: empty_board_no_top_ranked_offer
        grounds:
          - calculations.per_load_settlement_fee_tier
          - errors.ERR_OFFER_NOT_TOP_RANKED
          - validations[priority=9]
          - entities.Load.fields.board_required
          - endpoints.POST_/network/load-offers
        distinguishing_aspect: "An empty-collection boundary rather than a numeric threshold: a POSTED load whose board carries zero OPEN offers has no top-ranked offer at all, so the board reports total_count 0, while the same load still reports board_required true — the selector policy's empty-pool case leaves the load board-eligible but unawardable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with a load POSTED to the board carrying no offers whatsoever."
          setup_api_calls:
