    claim_type: Boundary / Edge
    grounds:
    - calculations.tiered_compliance_risk_deduction
    - entities.Facility.fields.compliance_risk_points
    distinguishing_aspect: The tier multipliers are selected on strict > comparisons, so a raw score of
      exactly 15 stays in MODERATE (multiplier 1.0 -> 15) while a raw score of exactly 31 crosses into
      HI (multiplier 1.25 -> 39 after round_half_up).
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One licensed facility whose ACCREDITATION_BODY expires
        exactly one month after the epoch, with no RECOVERY_HOUSE row.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: ACCREDITATION_BODY
          granting_body: CARF
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2026-08-02T00:00:00Z'
        as: PlatformAdmin
        captures:
          mew_acc_body: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      trigger:
      - call: POST /treatment-network/facilities/${mew_fac}/facility-ops/run
        payload: {}
        as: PlatformAdmin
      assert:
      - Facility.${mew_fac}.compliance_risk_points ==45
      - Facility.${mew_fac}.facility_posture == RESTRICTED
      - 'the tier selection uses strict > comparisons: at raw 10 the multiplier is BASE 1.0, so the final
        score equals the raw score (the stated boundary of the MODERATE tier)'
      - at raw 31 the multiplier is HI 1.25 and the final score is int(round_half_up(31 * 1.25, 0)) ==
        39, not 38
