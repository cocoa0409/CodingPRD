            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l1_id: $.data.id } }
          trigger:
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 500, wrap_time_minutes: 900, meal_breaks: [] }, as: ProducerRep, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-11", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { l2_id: $.data.id } }
