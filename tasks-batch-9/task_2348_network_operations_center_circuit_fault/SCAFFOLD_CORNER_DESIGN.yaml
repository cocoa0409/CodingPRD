            - "after the second resolve Circuit.${cz_id}.fault_count_period was 2 with chronic_state CHRONIC_CANDIDATE and Carrier.${pft_id}.chronic_circuit_count was 0"
            - "Circuit.${cz_id}.fault_count_period == 3 and chronic_state == CHRONIC"
            - "Carrier.${pft_id}.chronic_circuit_count == 1"
            - "all three incidents are RESOLVED and none carries reopen_count > 0 (each alarm arrived days after the previous resolved_at, outside the 120-minute reopen window)"
            - "Circuit.${cz_id}.last_incident_at == 2026-08-07T00:00:00.000Z"

      - name: corner_vendor_review_on_clean_period_scores_one_hundred
        claim_type: correct_result
        grounds:
          - calculations.vendor_review_score
          - validations[priority=95]
          - validations[priority=96]
          - endpoints["POST /vendor-reviews"]
        distinguishing_aspect: "With no acknowledged credits, no closed tickets and no chronic circuits, every penalty term is zero and the score must be exactly 100.00 (not zero from an empty-set division), which then makes REPLACE unjustifiable and RETAIN the only defensible decision."
        test_recipe:
          setup:
            - "Carrier PFT with one circuit PFT-CKT-9001 (mrc_cents 275000) and no tickets, claims or resolved incidents at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
          trigger:
            - call: "POST /vendor-reviews"
              payload: { carrier_id: "${pft_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { vr_id: $.data.id }
            - call: "POST /vendor-reviews/${vr_id}/decide"
              payload: { decision: "REPLACE", justification: "gut feeling about this carrier" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /vendor-reviews/${vr_id}/decide"
              payload: { decision: "RETAIN", justification: "clean period, no credits and no chronic circuits" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "the review is created with credit_ratio 0.0, mttr_minutes 0.00 and chronic_circuit_count 0"
            - "VendorReview.${vr_id}.net_performance_score == 100.00 and decision == PENDING"
            - "the REPLACE attempt returns 422 with data.error_id == ERR_REPLACEMENT_NOT_JUSTIFIED and leaves decision == PENDING"
            - "the RETAIN call returns 200 with VendorReview.${vr_id}.decision == RETAIN and decided_by_user_id == vm-1"
            - "GET /carriers/${pft_id}/vendor-reviews with decision RETAIN returns total_count 1"

      - name: corner_restoration_clock_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.restoration_minutes_dual_clock
        excluded_because:
          difficulty_instance: dual_variant_calc / restoration_dual_clock_carrier_vs_noc_credit_divergence
          rationale: "Both variants, their delta and the credit each one produces are computed and compared inside the named §1.8 instance."

      - name: corner_upgrade_cost_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.upgrade_order_cost
        excluded_because:
          difficulty_instance: combinatorial_formula / upgrade_cost_tier_keyed_on_subtotal_not_total
          rationale: "The tier band selection on subtotal_cents, including the misreading that would pick the neighbouring band, is asserted with exact cents by the named §1.8 instance."

      - name: corner_incident_severity_weighted_scoring
        claim_type: weighted_scoring
        grounds:
          - calculations.incident_severity_classification
        excluded_because:
          difficulty_instance: transitive_cascade / alarm_to_circuit_to_path_posture_to_sibling_spof_to_severity
          rationale: "Every weight term (tier, path count, redundancy, spof) plus the resulting severity cutoff is asserted numerically by the named §1.8 instance."

      - name: corner_credit_claim_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.sla_credit_amount
        excluded_because:
          difficulty_instance: combinatorial_formula / sla_credit_per_path_line_rounding_before_summation
          rationale: "The per-path line set, its tier weights and the rounding position are pinned by the named §1.8 instance, which also proves the naive summation is wrong."

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_alarm_raised_in_the_future_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=22]
          - errors.ERR_TIMESTAMP_RANGE_INVALID
          - endpoints["POST /alarms"]
        distinguishing_aspect: "raised_at must not be ahead of the logical clock: a monitoring poller with a fast clock must be refused rather than allowed to seed a future-dated fault history."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001; the clock stands at 00:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
          trigger:
            - call: "POST /alarms"
              payload: { alarm_type: "PATH_LATENCY", raw_severity: "MAJOR", raised_at: "2026-08-23T00:05:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
          assert:
            - "status 422 with data.error_id == ERR_TIMESTAMP_RANGE_INVALID"
            - "GET /alarms filtered on the circuit returns total_count 0"
            - "Circuit.${cz_id}.operational_state == UP and version == 1"

      - name: corner_alarm_source_requires_exactly_one_target
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - errors.ERR_ALARM_SOURCE_INVALID
          - endpoints["POST /alarms"]
        distinguishing_aspect: "Supplying neither source is as invalid as supplying both: the exactly-one rule must fire in both shapes, and it is a 422 semantic error rather than the 400 shape error."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001 and a router device attached to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /devices"
              payload: { hostname: "chi01-rtr-1", site_code: "CHI01", device_role: "ROUTER", primary_uplink_circuit_id: "${cz_id}", monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { dv_id: $.data.id }
          trigger:
            - call: "POST /alarms"
              payload: { alarm_type: "DEVICE_UNREACHABLE", raw_severity: "CRITICAL", raised_at: "2026-08-24T00:00:00Z", source_circuit_id: "${cz_id}", source_device_id: "${dv_id}" }
              as: NocAnalyst
            - call: "POST /alarms"
              payload: { alarm_type: "DEVICE_UNREACHABLE", raw_severity: "CRITICAL", raised_at: "2026-08-24T00:00:00Z" }
              as: NocAnalyst
          assert:
            - "both attempts return 422 with data.error_id == ERR_ALARM_SOURCE_INVALID"
            - "GET /alarms returns total_count 0"
            - "Circuit.${cz_id}.operational_state == UP and Device.${dv_id}.monitoring_state == MONITORED"

      - name: corner_path_segment_target_requires_exactly_one_target
        claim_type: conditional_validation
        grounds:
          - validations[priority=50]
          - errors.ERR_SEGMENT_TARGET_INVALID
          - endpoints["POST /path-segments"]
        distinguishing_aspect: "A segment is either a circuit hop or a device hop; supplying both must be refused at priority 50 before the uniqueness check at priority 58 can claim the position."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001, a device on it, and an empty BRONZE path."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /devices"
              payload: { hostname: "chi01-rtr-1", site_code: "CHI01", device_role: "ROUTER", primary_uplink_circuit_id: "${cz_id}", monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { dv_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}", device_id: "${dv_id}" }
              as: PlatformAdmin
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, device_id: "${dv_id}" }
              as: PlatformAdmin
              captures: { sq_id: $.data.id }
          assert:
            - "the both-targets attempt returns 422 with data.error_id == ERR_SEGMENT_TARGET_INVALID"
            - "the device-only segment then succeeds with 201, PathSegment.${sq_id}.circuit_id == null and segment_state == ACTIVE"
            - "ApplicationPath.${pq_id}.active_leg_count == 1 and monitored_segment_count == 1"

      - name: corner_capacity_reading_out_of_order_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
          - errors.ERR_READING_OUT_OF_ORDER
          - endpoints["POST /circuits/{id}/capacity-readings"]
        distinguishing_aspect: "The utilization accumulator is a single running counter, so a late sample whose sample_at is not strictly greater than the stored latest must be refused (equal timestamps included) rather than silently folded in."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 at 100 Mbps and one accepted reading at 00:10 with utilization 85.00 (WATCH, consecutive 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-26T00:10:00Z", utilization_pct: 85.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-26T00:05:00Z", utilization_pct: 90.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-26T00:10:00Z", utilization_pct: 91.00, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          assert:
            - "the earlier sample returns 409 with data.error_id == ERR_READING_OUT_OF_ORDER"
            - "the equal-timestamp sample also returns 409 with data.error_id == ERR_READING_OUT_OF_ORDER (strictly greater means strictly)"
            - "GET /circuits/${cz_id}/capacity-readings returns total_count 1"
            - "Circuit.${cz_id}.consecutive_high_readings == 1 and capacity_state == WATCH"

      - name: corner_duplicate_carrier_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
          - errors.ERR_CARRIER_CODE_DUPLICATE
          - endpoints["POST /carriers"]
        distinguishing_aspect: "carrier_code is the global natural key: a second carrier with the same code must be refused even when the display name differs."
        test_recipe:
          setup:
            - "Carrier 'Plainfield Telecom' with carrier_code PFT exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          trigger:
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom Holdings", carrier_code: "PFT" }
              as: PlatformAdmin
          assert:
            - "status 409 with data.error_id == ERR_CARRIER_CODE_DUPLICATE"
            - "GET /carriers/${pft_id} still shows name Plainfield Telecom and version 1"

      - name: corner_second_open_ticket_on_same_circuit_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=60]
          - errors.ERR_DUPLICATE_OPEN_TICKET
          - endpoints["POST /carrier-tickets"]
        distinguishing_aspect: "Each individual ticket request is well formed and carries a distinct carrier_reference, but the circuit may carry only one non-closed ticket, so the collective check at priority 60 must reject the second."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001, a BRONZE single-leg path, a CRITICAL alarm at 00:00 (circuit DOWN, incident open) and one OPEN ticket PFT-TT-10 raised at 00:10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-28T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-10" }
              as: NocAnalyst
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-11" }
              as: NocAnalyst
          assert:
            - "status 409 with data.error_id == ERR_DUPLICATE_OPEN_TICKET"
            - "GET /carrier-tickets filtered on the circuit returns total_count 1 with carrier_reference PFT-TT-10"
            - "CarrierTicket.${t1_id}.state == OPEN and version is unchanged"

      - name: corner_ticket_on_healthy_circuit_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=63]
          - errors.ERR_CIRCUIT_NOT_FAULTED
          - endpoints["POST /carrier-tickets"]
        distinguishing_aspect: "Trouble tickets require evidence of a fault: with the alarm cleared the circuit is UP again, so the ticket must be refused even though its incident row still exists and is unresolved."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001 and a BRONZE single-leg path."
            - "A CRITICAL alarm at 00:00 opened an incident and was cleared at 00:05, returning the circuit to UP while the incident stays DETECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-29T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /alarms/${az_id}/clear"
              payload: { cleared_at: "2026-08-29T00:05:00Z" }
              as: NocAnalyst
          trigger:
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-12" }
              as: NocAnalyst
          assert:
            - "status 409 with data.error_id == ERR_CIRCUIT_NOT_FAULTED"
            - "Circuit.${cz_id}.operational_state == UP"
            - "Incident.${iz_id}.response_state == DETECTED (the refused ticket changed nothing)"
            - "GET /carrier-tickets filtered on the circuit returns total_count 0"

      - name: corner_confirm_restoration_before_soak_and_with_open_alarm
        claim_type: cascading_validation
        grounds:
          - validations[priority=44]
          - validations[priority=84]
          - errors.ERR_OPEN_ALARMS_PRESENT
          - errors.ERR_SOAK_WINDOW_NOT_ELAPSED
          - endpoints["POST /carrier-tickets/{id}/confirm-restoration"]
        distinguishing_aspect: "Both confirmation guards are cross-entity and ordered: the uncleared ROOT alarm at priority 44 must be reported first even though the soak window at priority 84 is also unmet, and confirmation only succeeds once both are satisfied."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001, a BRONZE single-leg path, a CRITICAL alarm at 00:00 and a ticket opened at 00:10."
            - "The carrier reported RESTORED at 01:00 while the alarm was still uncleared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-30T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-13" }
              as: NocAnalyst
              captures: { tz_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${tz_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-08-30T01:00:00Z" }
              as: CarrierLiaison
              as_user_id: "${pft_id}"
          trigger:
            - call: "POST /carrier-tickets/${tz_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /alarms/${az_id}/clear"
              payload: { cleared_at: "2026-08-30T01:00:00Z" }
              as: NocAnalyst
            - call: "POST /carrier-tickets/${tz_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T01:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${tz_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "the first confirmation returns 409 with data.error_id == ERR_OPEN_ALARMS_PRESENT (priority 44 outranks the unmet soak at priority 84)"
            - "the second confirmation, with the alarm cleared but only 0 minutes of soak elapsed, returns 409 with data.error_id == ERR_SOAK_WINDOW_NOT_ELAPSED"
            - "at 01:30 the soak window of 30 minutes is exactly met and the confirmation returns 200"
            - "CarrierTicket.${tz_id}.state == CLOSED_RESTORED, confirmed_at == 2026-08-30T01:30:00.000Z, restoration_confirmed_by_user_id == lead-1"
            - "CarrierTicket.${tz_id}.restoration_minutes_carrier_clock == 50.00 (opened_at 00:10 -> restored_at 01:00, no carrier windows) and restoration_minutes_noc_clock == 60.00 (detected_at 00:00 -> restored_at 01:00)"
            - "no AUTO_DRAFT claim was created: the 50.00-minute carrier clock is far inside the 480-minute standard target that applies to this SEV3 incident, so GET /sla-credit-claims filtered on the ticket returns total_count 0 and Carrier.${pft_id}.open_credit_exposure_cents == 0"

      - name: corner_priority_ordering_between_state_and_fiscal_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority=43]
          - validations[priority=93]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_submit_incident_not_mitigated_beats_claim_below_minimum
          rationale: "The named §1.8 instance violates both rules in one request and then isolates the lower-priority one, which is precisely the priority-ordering claim."

      - name: corner_conditional_redundancy_check_versus_overlap
        claim_type: conditional_validation
        grounds:
          - validations[priority=70]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / window_review_redundancy_risk_beats_window_overlap
          rationale: "The conditional nature of the redundancy check (it applies only when the window would strand a path) and its precedence over the overlap check are both asserted there."

      - name: corner_temporal_overlap_detection_on_windows_and_tests
        claim_type: temporal_validation
        grounds:
          - validations[priority=80]
          - validations[priority=81]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / maintenance_windows_buffered_closed_intervals_per_circuit
          rationale: "Buffered closed-interval overlap for windows and unbuffered half-open overlap for failover tests are the two §1.8 resource_temporal_overlap instances, including the touching-boundary cases."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_delete_path_segment_retires_row_and_rederives_posture
        claim_type: standard_crud
        grounds:
          - endpoints["DELETE /path-segments/{id}"]
          - calculations.path_posture_and_legs
          - entities.PathSegment.fields.segment_state
        distinguishing_aspect: "Deletion is a soft retirement: the row survives with segment_state RETIRED so historical alarms stay explicable, the parent path drops to one ACTIVE leg, and the remaining circuit's spof_flag stays false because a fully healthy one-leg path is PROTECTED rather than DEGRADED_NO_REDUNDANCY."
        test_recipe:
          setup:
            - "Carrier EWT with two MONITORED UP circuits under one GOLD ACTIVE_ACTIVE path (LEG_A and LEG_B, min_surviving_legs 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ew_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ew_id}", carrier_circuit_identifier: "EWT-CKT-2001", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${ew_id}", carrier_circuit_identifier: "EWT-CKT-2002", site_a_code: "NYC01", site_z_code: "PHL01", bandwidth_mbps: 1000, mrc_cents: 500000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Core Voice Path", service_tier: "GOLD", protection_scheme: "ACTIVE_ACTIVE", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pp_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${ca_id}" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pp_id}", leg_group: "LEG_B", sequence_index: 1, circuit_id: "${cb_id}" }
              as: PlatformAdmin
              captures: { sb_id: $.data.id }
          trigger:
            - call: "DELETE /path-segments/${sb_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /path-segments/${sb_id}"
              payload: {}
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "GET /path-segments"
              payload: { application_path_id: "${pp_id}", segment_state: "ACTIVE" }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "the delete returns 200 and the returned row has segment_state RETIRED"
            - "the follow-up GET still resolves PathSegment.${sb_id} (no 404) with segment_state RETIRED"
            - "the ACTIVE listing returns total_count 1 containing only ${sa_id}"
            - "ApplicationPath.${pp_id}.active_leg_count == 1, healthy_leg_count == 1, monitored_segment_count == 1, posture == PROTECTED"
            - "Circuit.${ca_id}.spof_flag == false and Circuit.${cb_id}.spof_flag == false"
            - "the position (LEG_B, 1) is free again: a RETIRED row does not hold it against the priority-58 uniqueness rule"

      - name: corner_ticket_escalation_to_tier_two_succeeds_with_evidence_and_dwell
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /carrier-tickets/{id}/escalate"]
          - validations[priority=67]
          - validations[priority=83]
          - state_machines.CarrierTicket
        distinguishing_aspect: "The positive escalation path: one FAIL test result satisfies the evidence rule and a 60-minute dwell exactly meets Carrier.tier_escalation_min_minutes, so the ticket advances to ESCALATED_T2 and its tier_entered_at clock restarts."
        test_recipe:
          setup:
            - "Carrier PFT (tier_escalation_min_minutes 60, escalation_tier_count 3) with MONITORED circuit PFT-CKT-9001 and a BRONZE single-leg path."
            - "Alarm at 00:00 -> incident; ticket PFT-TT-14 opened at 00:10; a FAIL LOOPBACK result recorded at 00:20 moved it to TESTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-09-01T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-14" }
              as: NocAnalyst
              captures: { tz_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${tz_id}/test-results"
              payload: { test_type: "LOOPBACK", outcome: "FAIL", notes: "loopback fails at the carrier NID" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carrier-tickets/${tz_id}/escalate"
              payload: { target_tier: 2, justification: "loopback failure unresolved after one hour at tier 1" }
              as: NocShiftLead
              as_user_id: "lead-1"
            - call: "GET /carrier-tickets/${tz_id}/test-results"
              payload: { outcome: "FAIL" }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "status 200 with CarrierTicket.${tz_id}.state == ESCALATED_T2 and tier_level == 2"
            - "the dwell was exactly 60 minutes (00:10 -> 01:10), which satisfies the inclusive priority-83 comparison"
            - "CarrierTicket.${tz_id}.tier_entered_at == 2026-09-01T01:10:00.000Z (the dwell clock restarted)"
            - "CarrierTicket.${tz_id}.fail_test_count == 1 and the FAIL listing returns total_count 1"
            - "Incident.${iz_id}.response_state == DETECTED (a carrier tier change is not an incident response step)"

      - name: corner_upgrade_order_lifecycle_completes_and_raises_bandwidth
        claim_type: conditional_action
        grounds:
          - endpoints["POST /upgrade-orders"]
          - endpoints["POST /upgrade-orders/{id}/submit"]
          - endpoints["POST /upgrade-orders/{id}/approve"]
          - endpoints["POST /upgrade-orders/{id}/state"]
          - calculations.upgrade_order_cost
        distinguishing_aspect: "Only the COMPLETED step touches the circuit: DRAFT, SUBMITTED, APPROVED and IN_PROGRESS all keep the bandwidth commitment open, and completion is what raises bandwidth_mbps, resets the utilization accumulator and releases the committed megabits."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 at 100 Mbps; one HIGH reading of 88.00 at 00:05 left it at WATCH with consecutive_high_readings 1."
            - "The circuit version observed after that reading is captured for the OCC guard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-09-02T00:05:00Z", utilization_pct: 88.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${cz_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { cz_v: $.data.version }
          trigger:
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${cz_id}", target_bandwidth_mbps: 300, expected_circuit_version: "${cz_v}", expedite: false }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { uo_id: $.data.id }
            - call: "POST /upgrade-orders/${uo_id}/submit"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "POST /upgrade-orders/${uo_id}/approve"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /upgrade-orders/${uo_id}/state"
              payload: { target_state: "IN_PROGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "POST /upgrade-orders/${uo_id}/state"
              payload: { target_state: "COMPLETED" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          assert:
            - "creation returns 201 with origin MANUAL, state DRAFT, created_by_user_id cp-1, delta_mbps 200, subtotal_cents 430000, expedite_fee_cents 0, total_cost_cents 430000"
            - "right after creation Carrier.${pft_id}.committed_upgrade_mbps == 200 and Circuit.${cz_id}.bandwidth_mbps is still 100"
            - "after submit and approve: state APPROVED, approved_by_user_id vm-1, committed_upgrade_mbps still 200"
            - "after IN_PROGRESS: committed_upgrade_mbps still 200 and Circuit.${cz_id}.bandwidth_mbps still 100"
            - "after COMPLETED: Circuit.${cz_id}.bandwidth_mbps == 300, consecutive_high_readings == 0, capacity_state == NORMAL"
            - "Carrier.${pft_id}.committed_upgrade_mbps == 0 (exactly the 200 previously added was released)"
            - "UpgradeOrder.${uo_id}.subtotal_cents is still 430000 (costs are frozen at creation and never restated)"

      - name: corner_path_availability_computed_read
        claim_type: computed_read
        grounds:
          - endpoints["GET /application-paths/{id}/availability"]
        excluded_because:
          difficulty_instance: dual_variant_calc / path_availability_intersection_vs_best_leg_basis
          rationale: "The computed read is exercised under both basis values with exact period_minutes, path_down_minutes and availability_pct by the named §1.8 instance."

  # ===========================================================================
  - section: errors
    instances:
      - name: corner_unknown_ticket_id_returns_not_found_with_error_envelope
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TICKET_NOT_FOUND
          - validations[priority=10]
          - response_envelope.error_shape
        distinguishing_aspect: "The error envelope is a first-class contract: the failure body must be response_type error with data.error_id and a meta block, and must not carry a partial CarrierTicket payload."
        test_recipe:
          setup:
            - "Carrier PFT exists; no carrier ticket has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          trigger:
            - call: "GET /carrier-tickets/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NocAnalyst
          assert:
            - "status 404 with data.error_id == ERR_TICKET_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"
            - "data contains no ticket fields (no state, no carrier_reference)"

      - name: corner_missing_x_user_id_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked before authorization and before any body parsing: a request that omits X-User-ID must be a 401 even when the role header is valid for the endpoint and the body is well formed."
        test_recipe:
          setup:
            - "Carrier PFT exists."
            - "The trigger request is sent with X-User-Role: NocAnalyst but with the X-User-ID header omitted entirely."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          trigger:
            - call: "GET /carriers/${pft_id}"
              payload: {}
              as: NocAnalyst
          assert:
            - "status 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the same request with both headers present returns 200"
            - "a request carrying X-User-Role: Auditor (not one of the six declared roles) also returns 401 ERR_UNAUTHENTICATED, not 403"

  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_noc_analyst_cannot_review_a_maintenance_window
        claim_type: role_permissions
        grounds:
          - roles.NocShiftLead.exclusive_operations
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Window approval is a shift-lead exclusive: the analyst who filed the window cannot approve it, and the refusal is a 403 that leaves the window PROPOSED."
        test_recipe:
          setup:
            - "Carrier PFT with a MONITORED circuit carrying no path segments and a PROPOSED window 02:00-03:00 filed by the analyst."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9004", site_a_code: "CHI01", site_z_code: "IND01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { circuit_id: "${cz_id}", origin: "INTERNAL_CHANGE", window_start: "2026-09-02T02:00:00Z", window_end: "2026-09-02T03:00:00Z", suppresses_monitoring: true }
              as: NocAnalyst
              captures: { wz_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${wz_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocAnalyst
            - call: "POST /maintenance-windows/${wz_id}/review"
              payload: { decision: "APPROVED", risk_acknowledged: true }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "the analyst attempt returns 403 with data.error_id == ERR_UNAUTHORIZED"
            - "MaintenanceWindow.${wz_id}.state was still PROPOSED with approved_by_user_id null after the refusal"
            - "the shift-lead attempt returns 200 with state APPROVED and approved_by_user_id lead-1"
            - "the priority-70 redundancy rule is vacuous here because the circuit carries no ACTIVE path segments"

      - name: corner_vendor_manager_cannot_open_a_carrier_ticket
        claim_type: role_permissions
        grounds:
          - roles.NocAnalyst.shared_operations
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Commercial roles are excluded from the operational write surface: the VendorManager who owns claims and vendor reviews cannot open the trouble ticket those claims depend on."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001, a BRONZE single-leg path and a CRITICAL alarm at 00:00 that put the circuit DOWN with an open incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-09-02T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:10:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-15" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-15" }
              as: NocAnalyst
              captures: { tz_id: $.data.id }
          assert:
            - "the VendorManager attempt returns 403 with data.error_id == ERR_UNAUTHORIZED"
            - "no ticket existed after the refusal: the analyst's identical body then succeeds with 201 and carrier_reference PFT-TT-15"
            - "CarrierTicket.${tz_id}.state == OPEN and opened_at == 2026-09-02T00:10:00.000Z"
            - "the VendorManager can still read it: GET /carrier-tickets/${tz_id} as VendorManager returns 200"

      - name: corner_carrier_liaison_cannot_read_another_carriers_ticket
        claim_type: role_permissions
        grounds:
          - roles.CarrierLiaison
          - validations[priority=3]
          - errors.ERR_CARRIER_SCOPE_VIOLATION
        distinguishing_aspect: "CarrierLiaison is entity-backed by Carrier, so X-User-ID is a carrier id: the liaison of a second carrier must be scoped out of the first carrier's ticket with a 403 scope violation rather than a generic authorization error."
        test_recipe:
          setup:
            - "Two carriers PFT and EWT, each with one MONITORED circuit."
            - "A CRITICAL alarm on the PFT circuit opened an incident and ticket PFT-TT-16 was raised at 00:10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /carriers"
              payload: { name: "Eastward Telecom", carrier_code: "EWT" }
              as: PlatformAdmin
              captures: { ew_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-09-02T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:10:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-16" }
              as: NocAnalyst
              captures: { tz_id: $.data.id }
          trigger:
            - call: "GET /carrier-tickets/${tz_id}"
              payload: {}
              as: CarrierLiaison
              as_user_id: "${ew_id}"
            - call: "GET /carrier-tickets/${tz_id}"
              payload: {}
              as: CarrierLiaison
              as_user_id: "${pft_id}"
          assert:
            - "the EWT liaison read returns 403 with data.error_id == ERR_CARRIER_SCOPE_VIOLATION"
            - "the PFT liaison read returns 200 with carrier_reference PFT-TT-16"
            - "the same scoping applies to writes: a carrier-update from the EWT liaison on ${tz_id} also returns 403 ERR_CARRIER_SCOPE_VIOLATION"

      - name: corner_confirming_user_cannot_also_submit_the_claim
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=88]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints["POST /sla-credit-claims/{id}/submit"]
          - complexity_profile.role_model
        distinguishing_aspect: "The user who attested the restoration cannot also file the money claim that depends on it: the check compares X-User-ID with CarrierTicket.restoration_confirmed_by_user_id across two different roles, and it runs only after the incident-mitigated gate at priority 43 is satisfied."
        test_recipe:
          setup:
            - "Carrier NLC with MONITORED circuit NLC-CKT-1001 (mrc_cents 920000) and one GOLD single-leg path (impact 50 -> SEV1, target 240)."
            - "Alarm detected 00:00; ticket opened 00:30; carrier reports RESTORED at 06:00 (carrier clock 330.00, breach 90.00 -> 2 breach hours -> 10 pct); alarm cleared 06:00."
            - "Restoration is confirmed at 06:30 by user dual-1 acting as NocShiftLead, which auto-drafts a 92000-cent DRAFT claim."
            - "The incident is walked to MITIGATED so the priority-43 gate is out of the way."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC" }
              as: PlatformAdmin
              captures: { nl_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nl_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cn_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pn_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pn_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cn_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-09-02T00:00:00Z", source_circuit_id: "${cn_id}" }
              as: NocAnalyst
              captures: { an_id: $.data.id, in_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${in_id}", circuit_id: "${cn_id}", carrier_reference: "NLC-TT-90002" }
              as: NocAnalyst
              captures: { tn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${tn_id}/carrier-update"
              payload: { update: "RESTORED", restored_at: "2026-09-02T06:00:00Z" }
              as: CarrierLiaison
              as_user_id: "${nl_id}"
            - call: "POST /alarms/${an_id}/clear"
              payload: { cleared_at: "2026-09-02T06:00:00Z" }
              as: NocAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T06:30:00Z" }
              as: PlatformAdmin
            - call: "POST /carrier-tickets/${tn_id}/confirm-restoration"
              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "dual-1"
            - call: "POST /incidents/${in_id}/response"
              payload: { target_response_state: "TRIAGED" }
              as: NocAnalyst
            - call: "POST /incidents/${in_id}/response"
              payload: { target_response_state: "MITIGATED" }
              as: NocAnalyst
            - call: "GET /sla-credit-claims"
              payload: { carrier_ticket_id: "${tn_id}" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { cl_id: "$.data[0].id" }
          trigger:
            - call: "POST /sla-credit-claims/${cl_id}/submit"
              payload: { attestation_note: "same person who signed off the restoration" }
              as: VendorManager
              as_user_id: "dual-1"
            - call: "POST /sla-credit-claims/${cl_id}/submit"
              payload: { attestation_note: "filed by the commercial desk" }
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "the dual-1 submit returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "SlaCreditClaim.${cl_id}.state was still DRAFT with submitted_at null after the refusal"
            - "the vm-1 submit returns 200 with state SUBMITTED and submitted_by_user_id vm-1"
            - "SlaCreditClaim.${cl_id}.credit_amount_cents == 92000 and basis == CARRIER_CLOCK"
            - "Carrier.${nl_id}.open_credit_exposure_cents == 92000 (the DRAFT amount was already open, so the submit delta is zero) and watchlist_state == ACTIVE (92000 is below the 100000 threshold)"

      - name: corner_upgrade_order_creator_cannot_approve_own_order
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=88]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints["POST /upgrade-orders/{id}/approve"]
        distinguishing_aspect: "The second segregation pair is on money commitment rather than restoration: approving with the creator's X-User-ID must fail even though the acting role is the correct VendorManager."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 at 100 Mbps; the circuit version is read before the order is created."
            - "cp-1 created a MANUAL order to 200 Mbps and submitted it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id, cz_v: $.data.version }
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${cz_id}", target_bandwidth_mbps: 200, expected_circuit_version: "${cz_v}" }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { uo_id: $.data.id }
            - call: "POST /upgrade-orders/${uo_id}/submit"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "POST /upgrade-orders/${uo_id}/approve"
              payload: {}
              as: VendorManager
              as_user_id: "cp-1"
            - call: "POST /upgrade-orders/${uo_id}/approve"
              payload: {}
              as: VendorManager
              as_user_id: "vm-1"
          assert:
            - "the cp-1 approval returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "UpgradeOrder.${uo_id}.state was still SUBMITTED with approved_by_user_id null after the refusal"
            - "the vm-1 approval returns 200 with state APPROVED and approved_by_user_id vm-1"
            - "UpgradeOrder.${uo_id}.created_by_user_id == cp-1, delta_mbps == 100, subtotal_cents == 340000, total_cost_cents == 340000"

      - name: corner_capacity_planner_shares_the_read_surface
        claim_type: role_permissions
        grounds:
          - roles.CapacityPlanner.shared_operations
          - endpoints["GET /circuits/{id}"]
          - endpoints["GET /circuits/{id}/capacity-readings"]
        distinguishing_aspect: "Shared read operations really are shared: the CapacityPlanner who may write readings and orders can read circuits and carriers, while the NocAnalyst who may not write readings can still read them."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 and one reading of 70.00 at 00:05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-09-02T00:05:00Z", utilization_pct: 70.00, direction: "EGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "GET /circuits/${cz_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /carriers/${pft_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${cz_id}/capacity-readings"
              payload: { direction: "EGRESS" }
              as: NocAnalyst
          assert:
            - "all three reads return 200"
            - "the reading listing returns total_count 1 with threshold_state NORMAL and utilization_pct 70.00"
            - "Circuit.${cz_id}.capacity_state == NORMAL and consecutive_high_readings == 0"

