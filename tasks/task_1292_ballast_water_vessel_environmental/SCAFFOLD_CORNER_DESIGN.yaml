      - name: sulfur_out_of_range_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_SULFUR_OUT_OF_RANGE]"]
        distinguishing_aspect: "sulfur_content_pct must be in [0, 5.0]: 5.001 -> ERR_SULFUR_OUT_OF_RANGE (422); the in-range endpoint value 5.0 itself is accepted (201)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9506 IN_PROGRESS"]
