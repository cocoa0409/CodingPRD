            - "CounterfeitCase.${k_id}.status == SETTLED_WITH_FED"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_fit_cents == 4950000 (seizure loss is permanent; settle moves no cash)"

      - name: carrier_dispatcher_depart_own_shipment
        claim_type: rbac_allow
        grounds: ["roles[CarrierDispatcher].exclusive_operations"]
        excluded_because:
          difficulty_instance: "transitive_cascade / shipment_verify_cascade_flips_reconciliation"
          rationale: "The named §1.8 instance departs and verifies as the owning CarrierDispatcher (as_user_id = carrier id) in its setup chain."

  # ------------------------------------------------- cross-cutting layers ---
  - section: cross_cutting_layers
    instances:
      - name: occ_site_patch_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[vault-site-patch-stale]", "errors[ERR_STALE_VAULT_SITE_VERSION]"]
        distinguishing_aspect: "Two sequential patches: the first advances version 1→2; the second replaying the captured stale version is rejected 412 ERR_STALE_VAULT_SITE_VERSION."
        test_recipe:
          setup: ["Site S created (version 1)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 50000000, insurance_coverage_cents: 80000000, dock_capacity: 2 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "PATCH /vault-cash/vault-sites/${s_id}"
              payload: { expected_vault_site_version: "${s_v}", vault_limit_cents: 60000000 }
              as: CashOperationsAdmin
              captures: { s_v2: $.data.version }
            - call: "PATCH /vault-cash/vault-sites/${s_id}"
              payload: { expected_vault_site_version: "${s_v}", name: "S-renamed" }
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first patch succeeds: version ${s_v2} == 2 and vault_limit_cents == 60000000"
            - "second patch with stale version rejected 412 ERR_STALE_VAULT_SITE_VERSION; name unchanged == S"

      - name: occ_forecast_publish_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[forecast-publish-stale-atm]", "errors[ERR_STALE_ATM_VERSION]"]
        distinguishing_aspect: "Publishing F1 advances the ATM version; publishing a second DRAFT forecast F2 (same atm+date) with the pre-F1 version is rejected 412 ERR_STALE_ATM_VERSION because supersede semantics make the stale view illegitimate."
        test_recipe:
          setup: ["Site S; ATM X ACTIVE (version 1); analyst A1; DRAFT forecasts F1, F2 for 2026-08-10"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-X", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { x_id: $.data.id, x_v: $.data.version }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 1000000, w3_cents: 1000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 2000000, w2_cents: 2000000, w3_cents: 2000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-forecasts/${f1_id}/publish"
              payload: { expected_atm_version: "${x_v}" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /vault-cash/atm-forecasts/${f2_id}/publish"
              payload: { expected_atm_version: "${x_v}" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "F1 publish succeeds (PUBLISHED)"
            - "F2 publish with stale ${x_v} rejected 412 ERR_STALE_ATM_VERSION; F2 remains DRAFT; F1 remains PUBLISHED (no supersede happened)"

      - name: occ_line_add_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fed-order-line-add-stale]", "errors[ERR_STALE_FED_ORDER_VERSION]"]
        distinguishing_aspect: "Line adds serialize on FedOrder.version: the second add replaying the create-time version is rejected 412 ERR_STALE_FED_ORDER_VERSION."
        test_recipe:
          setup: ["Site S; coord U1; DRAFT DEPOSIT order O (version 1)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 100, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 100, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first add succeeds (order version advances to 2, face 100,000)"
            - "second add with stale ${o_v} rejected 412 ERR_STALE_FED_ORDER_VERSION"
            - "GET /vault-cash/fed-orders/${o_id}/lines returns exactly 1 line"

      - name: version_increments_on_cascaded_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.VaultSite.fields.on_hand_fit_cents", "endpoints[POST /vault-cash/cash-ledger-entries]"]
        distinguishing_aspect: "A ledger append is a cascaded site mutation: on_hand_fit_cents updates AND VaultSite.version increments (1 → 2), while updated_at refreshes."
        test_recipe:
          setup: ["Site S fit 5,000,000 (version 1); custodian U1"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-01", signed_amount_cents: 1000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "GET /vault-cash/vault-sites/${s_id}"
              payload: {}
              as: CashOperationsAdmin
              captures: { s_v2: $.data.version, s_fit: $.data.on_hand_fit_cents }
          assert:
            - "created version ${s_v} == 1; after one ledger append version ${s_v2} == 2"
            - "on_hand_fit_cents ${s_fit} == 5001000"

  # ------------------------------------------------------- consistency model ---
  - section: consistency_model
    instances:
      - name: immediate_consistency_submit_response_final
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /vault-cash/fed-orders/{orderId}/submit]"]
        distinguishing_aspect: "Immediate consistency: the submit RESPONSE itself carries the post-transition state and fully recomputed totals — no re-read needed (face 2,000,000; fee round(2,000,000/160)=12,500; grand 2,012,500; pending_inbound applied)."
        test_recipe:
          setup: ["Site S fit 10,000,000 NORMAL; coord U1; ORDER O with one line denom 2000 x 10 (face 2,000,000)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_status: $.data.status, o_face: $.data.face_total_cents, o_fee: $.data.fee_total_cents, o_grand: $.data.grand_total_cents }
          assert:
            - "submit response: status ${o_status} == SUBMITTED"
            - "face ${o_face} == 2000000; fee ${o_fee} == 12500; grand ${o_grand} == 2012500 — all final in the same response"
            - "GET /vault-cash/vault-sites/${s_id}.pending_inbound_order_cents == 2000000 immediately after"
