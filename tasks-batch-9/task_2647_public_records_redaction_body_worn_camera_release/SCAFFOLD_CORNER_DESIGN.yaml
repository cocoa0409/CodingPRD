      - name: payment_must_be_positive_and_within_the_outstanding_deposit
        claim_type: Priority Ordering
        grounds:
          - validations.priority_31
          - validations.priority_32
          - errors.ERR_INVALID_AMOUNT
          - errors.ERR_PAYMENT_EXCEEDS_OUTSTANDING
          - calculations.ledger_conservation
        distinguishing_aspect: |
          The outstanding amount is the deposit still owed, so on a 3060-cent deposit a
          zero payment is ERR_INVALID_AMOUNT, 3061 is ERR_PAYMENT_EXCEEDS_OUTSTANDING and
          exactly 3060 settles the deposit and freezes tolled_days at 0.
        test_recipe:
          setup:
            - "A GENERAL_PUBLIC requester with one 120-minute ROUTINE recording ruled RESPONSIVE on a clarified request."
            - "One PRESUMPTIVE DVD estimate, giving subtotal_cents 6800, estimated_total_cents 6120 and deposit_required_cents 3060, so fee_status is DEPOSIT_DUE with deposit_due_at 2026-08-31T00:00:00Z."
            - "The clock stays at 2026-08-01T00:00:00Z, well before deposit_due_at, so no tolling accrues."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0648", device_serial: "AXON-0648", officer_badge: "B-1143", recorded_start_at: "2026-07-14T09:00:00Z", duration_ms: 7200000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-14T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0648", requested_date_from: "2026-07-14T00:00:00Z", requested_date_to: "2026-07-15T00:00:00Z", scope_narrative: "All BWC video for INC-2026-0648" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Two-hour continuous recording", requested_date_from: "2026-07-14T00:00:00Z", requested_date_to: "2026-07-14T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { req_version: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${req_version}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests/${req_id}/payments", payload: { amount_cents: 0, memo: "Zero payment" }, as: Requester, as_user_id: "${requester_id}", captures: { e_zero: $.data.error_id } }
            - { call: "POST /records/requests/${req_id}/payments", payload: { amount_cents: 3061, memo: "One cent over" }, as: Requester, as_user_id: "${requester_id}", captures: { e_over: $.data.error_id } }
            - { call: "POST /records/requests/${req_id}/payments", payload: { amount_cents: 3060, memo: "Deposit in full" }, as: Requester, as_user_id: "${requester_id}", captures: { entry_one: $.data.id } }
          assert:
            - "first response: HTTP 422 and ${e_zero} == ERR_INVALID_AMOUNT"
            - "second response: HTTP 422 and ${e_over} == ERR_PAYMENT_EXCEEDS_OUTSTANDING (the outstanding deposit is exactly 3060)"
            - "third response: HTTP 201, FeeLedgerEntry.${entry_one}.entry_type == DEPOSIT_PAYMENT, source_kind == DEPOSIT, amount_cents == 3060 and reverses_entry_id == null"
            - "PublicRecordsRequest.${req_id}: fee_status == DEPOSIT_PAID, deposit_paid_cents == 3060, deposit_balance_cents == 3060, deposit_required_cents == 3060"
            - "PublicRecordsRequest.${req_id}.tolled_days == 0 (the payment landed before deposit_due_at, so the floor at 0 applies) and statutory_deadline_at == 2026-08-21T00:00:00Z"
            - "GET /records/fee-ledger-entries?request_id=${req_id} returns total_count == 1 — neither refused payment wrote a row"
            - "FeeEstimate.${est_id}.status == ACTIVE and deposit_required_cents == 3060"
      - name: a_ledger_entry_can_only_be_reversed_once
        claim_type: Violation -> Error
        grounds:
          - validations.priority_33
          - errors.ERR_ENTRY_ALREADY_REVERSED
          - calculations.ledger_conservation
          - entities.FeeLedgerEntry.fields.reverses_entry_id
        distinguishing_aspect: |
          Two distinct conditions share the code: the target already has a REVERSAL
          pointing at it, and the target is itself a REVERSAL, so reversing the reversal is
          refused too and the ledger settles at exactly two rows.
        test_recipe:
          setup:
            - "The same request as the payment instance: a 3060-cent deposit posted in full, so deposit_paid_cents and deposit_balance_cents are both 3060 and fee_status is DEPOSIT_PAID."
