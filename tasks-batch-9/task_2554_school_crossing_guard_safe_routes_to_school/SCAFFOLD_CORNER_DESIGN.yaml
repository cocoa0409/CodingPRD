              as: CrossingSupervisor
              as_user_id: "sup-1"
          assert:
            - "trigger call 1 returns data.reliability_score_rolling_90d == 83.00, data.reliability_score_season_to_date == 83.00 and data.certification_status == CERTIFIED"
            - "trigger call 2 returns HTTP 201 with data.status == DISPATCH_PENDING"
            - "after trigger call 2: Guard.${g1_id}.reliability_score_rolling_90d == 73.00 and reliability_score_season_to_date == 73.00"
            - "Guard.${g1_id}.certification_status == SUSPENDED with suspension_reason == RELIABILITY_BREACH"
            - "PostAssignment.${asg1_id}.status == VACATED with vacated_reason == GUARD_SUSPENDED"
            - "Guard.${g1_id}.duty_status == UNASSIGNED and GuardPost.${post_id}.coverage_status == UNSTAFFED"
            - "GET /srts/absence-reports with post_assignment_id ${asg1_id} returns exactly 3 rows"

      - name: corner_cascading_side_effects_layer_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AbsenceReport
          - state_machines.WalkingRoute
        excluded_because:
          difficulty_instance: absence_create_depth4_cascade_to_route_advisory_hold
          rationale: |
            The §1.8 transitive cascade instance walks the full four-link chain
            (AbsenceReport -> PostAssignment -> GuardPost -> School -> WalkingRoute) and its
            compensation partner covers the reversal, so a separate breadth instance would
            duplicate it exactly.

      - name: corner_dual_variant_calculation_layer_stub
        claim_type: dual_variant_calculation
        grounds:
          - calculations.guard_reliability_score.variants
          - calculations.warrant_score.variants
        excluded_because:
          difficulty_instance: guard_reliability_rolling_vs_season_divergence
          rationale: |
            The §1.8 dual-variant instances already drive both reliability variants apart on
            identical rows (72.00 rolling vs 92.50 season) and both warrant variants apart on
            identical counts, which is exactly this layer's claim.

  - section: consistency_model
    instances:
      - name: corner_derived_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.project_benefit_cost_score
          - calculations.guard_reliability_score.variants
          - endpoints.POST_/srts/intersections/{id}/crash-records
        distinguishing_aspect: |
          Nothing in this domain lags. The crash-record POST returns the parent Intersection
          with crash_severity_points already recomputed in the same response body (8 after
          the first record, 23 after the second) — no re-read required. The two
          clock-dependent fields are the only ones re-evaluated at read time, and they are
          still immediate with respect to the clock-set request: advancing the clock to
          2026-10-31 pushes the absence's created_at (2026-08-01) outside the closed 90-day
          rolling window, so the very next read shows reliability_score_rolling_90d back at
          100.00 while reliability_score_season_to_date stays at 93.00, since that variant
          is anchored on absence_date inside the session and never ages out.
        test_recipe:
          setup:
