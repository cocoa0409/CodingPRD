  - method: POST
    path: "/numbering/blocks/{block_id}/routing-records"
    description: "Publishes routing data (LRN and switch CLLI) for a block and updates the number portability database. Guarded by optimistic concurrency on the block."
    roles: [NumberingAdministrator]
