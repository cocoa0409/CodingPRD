  # =========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: course_fire_requires_check_open_orderitem_to_check
        grounds:
          - state_machines.Course.BUILDING_to_FIRED
          - state_machines.Check.OPEN_to_PRESENTED
          - validations[priority=5]
        distinguishing_aspect: |
          Pair Course/OrderItem→Check: a BUILDING course cannot fire unless its owning Check is OPEN. Presenting the
          check (OPEN→PRESENTED) then firing a second course must fail with ERR_INVALID_STATE — Course's valid
          transition depends on Check's state.
        test_recipe:
          setup:
            - "Restaurant tax 0; clock 2026-06-02 10:00; MenuItem base 1000 ample count."
            - "A check with course-1 fired, then PRESENTED; a second course-2 created (BUILDING) with one PENDING item."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R13", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs1: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs1}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs1}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs2: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs2}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /courses/${crs2}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE  (Check is PRESENTED, not OPEN)"

      - name: seating_create_requires_table_available_seating_to_table
        grounds:
          - state_machines.DiningTable.AVAILABLE_to_SEATED
          - state_machines.Seating.OPEN_to_CLEARED
          - validations[priority=5]
        distinguishing_aspect: |
          DIFFERENT pair Seating→DiningTable: a new Seating may be created only when the DiningTable is AVAILABLE.
          With the table already SEATED (an OPEN seating on it), a second POST /seatings must fail with
          ERR_INVALID_STATE — Seating creation depends on DiningTable state.
        test_recipe:
          setup:
            - "Restaurant; clock 2026-06-03 12:00. Table capacity 4 with an OPEN seating already on it (table SEATED)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R14", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-03T12:00:00Z" }
              as: Manager
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat1: $.data.id }
          trigger:
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE  (table already SEATED, not AVAILABLE)"

  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: seating_half_open_overlap_on_table_rejects_interior_start
        grounds:
          - validations[priority=12]
          - entities.Seating.fields.seated_at
          - entities.Seating.fields.cleared_at
        distinguishing_aspect: |
          Half-open interval semantics, NO buffer, on DiningTable: a prior cleared seating occupied [minute 600,
          minute 660). A new seating whose seated_at lands at minute 630 (interior) overlaps and is rejected;
          adjacency at exactly minute 660 would be allowed. Geometry: half-open [s,e).
        test_recipe:
          setup:
            - "Restaurant min_rest_minutes irrelevant; Table capacity 4."
            - "Clock set to 2026-06-05T10:00:00Z (minute 600); a seating opened then cleared at 2026-06-05T11:00:00Z (minute 660) → interval [600,660)."
            - "Table bussed back to AVAILABLE (no waitlist), then clock moved back to 2026-06-05T10:30:00Z (minute 630)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R15", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-05T10:00:00Z" }
              as: Manager
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-05T11:00:00Z" }
              as: Manager
            - call: "POST /seatings/${seat1}/clear"
              payload: {}
              as: Host
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tv: $.data.version }
            - call: "POST /tables/${tbl}/buss"
              payload: { expected_table_version: "${tv}" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-05T10:30:00Z" }
              as: Manager
          trigger:
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_TABLE_DOUBLE_BOOKED  (seated_at minute 630 inside the prior [600,660) interval)"

      - name: staff_shift_closed_buffered_overlap_rejects_adjacency_within_rest
        grounds:
          - validations[priority=13]
          - entities.StaffShift.fields.clock_in_minute
          - entities.StaffShift.fields.clock_out_minute
          - entities.Restaurant.fields.min_rest_minutes
        distinguishing_aspect: |
          DIFFERENT interval semantics (closed interval expanded by a min_rest buffer) on a DIFFERENT resource
          (StaffMember): shift1 [600,1080] with min_rest_minutes=30 blocks a new shift starting at minute 1109
          (1080+30=1110 > 1109), which a no-buffer rule would allow — adjacency-within-rest is rejected.
        test_recipe:
          setup:
            - "Restaurant min_rest_minutes=30; one StaffMember; shift1 business_date 2026-06-05 [600,1080]."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R16", tax_rate_bps: 0, min_rest_minutes: 30 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Pat", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${sm}", business_date: "2026-06-05", clock_in_minute: 600, clock_out_minute: 1080 }
              as: Manager
          trigger:
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${sm}", business_date: "2026-06-05", clock_in_minute: 1109, clock_out_minute: 1320 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SHIFT_OVERLAP  (1080 + 30 rest = 1110 > 1109 start → buffered overlap)"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_item_conserves_menu_item_available_count
        grounds:
          - state_machines.OrderItem.FIRED_to_VOIDED
          - entities.MenuItem.fields.available_count
          - entities.MenuItem.fields.initial_available_count
        distinguishing_aspect: |
          Conserved quantity #1 — 86-count: invariant MenuItem.available_count + Σ(quantity over FIRED|SERVED|COMPED
          OrderItems of this menu item) == initial_available_count. The VOID compensating action removes the item
          from the consumed set; firing qty 3 then voiding it leaves available_count back at the initial 10 — no drift.
        test_recipe:
          setup:
            - "Restaurant; clock 2026-06-02 10:00; MenuItem base 1000 initial_available_count=10."
            - "A check fires a course with one item qty 3 (available_count 10→7), then the item is voided."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R17", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 10 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 3 }
              as: Server
              as_user_id: "${sm}"
              captures: { oi: $.data.id }
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "POST /order-items/${oi}/void"
              payload: {}
              as: Manager
          assert:
            - "MenuItem.${mi}.available_count == 10  (10 → 7 on fire → 10 on void; conserved)"
            - "MenuItem.${mi}.is_86 == false"

      - name: distribute_then_payout_conserves_tip_pool_cents
        grounds:
          - calculations.tip_pool_distribution
          - state_machines.TipPool.ACCUMULATING_to_DISTRIBUTED
          - entities.TipPool.fields.pooled_cents
          - entities.TipPool.fields.distributed_cents
          - entities.TipAllocation.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity #2 — pooled tip cents (different conserved quantity from the 86-count): invariant
          Σ(TipAllocation.amount_cents) == TipPool.distributed_cents == TipPool.pooled_cents. Distributing 10000
          across two shifts leaves zero drift even though raw shares are fractional.
        test_recipe:
          setup:
            - "Restaurant tax 0; clock 2026-06-01 20:00. Two shifts (SERVER hours_x100=800, BUSSER hours_x100=500), business_date 2026-06-01."
            - "A closed check contributes tip 10000 to the 2026-06-01 pool (distribution_mode EVEN_BY_HOURS)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R18", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-01T20:00:00Z" }
              as: Manager
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Srv", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { srv: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Bus", role: "BUSSER", tip_weight_bps: 5000 }
              as: Manager
              captures: { bus: $.data.id }
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${srv}", business_date: "2026-06-01", clock_in_minute: 600, clock_out_minute: 1080 }
              as: Manager
            - call: "POST /staff-shifts"
              payload: { restaurant_id: "${rid}", staff_id: "${bus}", business_date: "2026-06-01", clock_in_minute: 1020, clock_out_minute: 1320 }
              as: Manager
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Soda", station: "BAR", base_price_cents: 500, happy_hour_price_cents: 500, initial_available_count: 50 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${srv}", party_size: 2 }
              as: Server
              as_user_id: "${srv}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${srv}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /tip-pools"
              payload: { restaurant_id: "${rid}", business_date: "2026-06-01", distribution_mode: "EVEN_BY_HOURS" }
              as: Manager
              captures: { pool: $.data.id }
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${srv}"
            - call: "POST /payments"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", amount_cents: 500, tip_cents: 10000, method: "CARD" }
              as: Server
              as_user_id: "${srv}"
            - call: "POST /checks/${chk}/close"
              payload: {}
              as: Server
              as_user_id: "${srv}"
          trigger:
            - call: "POST /tip-pools/${pool}/distribute"
              payload: {}
              as: Manager
              captures: { dist: $.data.distributed_cents }
          assert:
            - "TipPool.${pool}.pooled_cents == 10000"
            - "TipPool.${pool}.distributed_cents == 10000  (Σ TipAllocation.amount_cents == pooled_cents, no drift)"
            - "the two TipAllocations under EVEN_BY_HOURS are 6154 and 3846 and sum to 10000"
