      - name: diligence_closure_bubbles_up_only_when_every_finding_is_terminal
        claim_type: bubble_up
        grounds:
          - state_machines.Restructuring.DILIGENCE_to_DILIGENCE_CLOSED
          - state_machines.DiligenceRequest.RESPONDED_to_CLEARED
          - endpoints.POST_/diligence-requests/{id}/clear
        distinguishing_aspect: |
          The parent transition is an aggregate over children: it fires only when
          EVERY DiligenceRequest of the deal is CLEARED or WAIVED, and only when at
          least one exists. Clearing the first of two findings must leave the deal in
          DILIGENCE; clearing the second must flip it. An implementation that closes
          diligence on each individual clearance passes a single-finding test and fails
          this one, and the two-step assertion is the only way to see the difference.
        test_recipe:
          setup:
            - "A Restructuring in DILIGENCE with two OPEN DiligenceRequests raised by dl-001"
          setup_api_calls:
            - call: "POST /organizations"
