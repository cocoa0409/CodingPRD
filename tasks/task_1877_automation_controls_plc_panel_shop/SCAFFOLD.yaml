  - method: POST
    path: "/panel-shop/change-orders/{id}/repropose"
    description: "PM re-tables a revised order (REVISED -> PROPOSED)."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder.version incremented by 1"]
  - method: POST
    path: "/panel-shop/change-orders/{id}/approve"
    description: "Customer approves with OCC on Job.version; posts to Job.approved_co_delta_cents."
    roles: [Customer]
    code: 200
    input: [expected_job_version, "supersedes_co_id?"]
    output: ChangeOrder
    side_effects: ["Job.approved_co_delta_cents += computed_delta_cents", "Job.contract_price_cents recomputed", "increments Job.version by 1", "optional supersedes_co_id target -> SUPERSEDED", "ChangeOrder.version incremented by 1"]
  - method: POST
    path: "/panel-shop/change-orders/{id}/reject"
    description: "Customer rejects."
    roles: [Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder.version incremented by 1"]
  - method: POST
    path: "/panel-shop/change-orders/{id}/withdraw"
    description: "Drafting PM withdraws."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["ChangeOrder.version incremented by 1"]
  - method: POST
    path: "/panel-shop/change-orders/{id}/rescind"
    description: "Compensating reversal of an APPROVED order (OCC on Job.version); subtracts its delta from the ledger."
    roles: [ProjectManager]
    code: 200
    input: [expected_job_version]
    output: ChangeOrder
    side_effects: ["Job.approved_co_delta_cents -= computed_delta_cents", "Job.contract_price_cents recomputed", "increments Job.version by 1", "ChangeOrder APPROVED -> SUPERSEDED", "ChangeOrder.version incremented by 1"]

  # --- warranty claims ---
  - method: POST
