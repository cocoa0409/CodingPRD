        distinguishing_aspect: "A second non-SUPERSEDED band for the same (program, family, level, geo) key fails with ERR_DUPLICATE_BAND (409)."
        test_recipe:
          setup: ["ENG family, level P1, zone US-NAT, DRAFT program; band already created once"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst }
          trigger:
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P62_5", spread_pct: 0.4000 }, as: CompAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_BAND (different spread/percentile do not change the uniqueness key)"

      - name: duplicate_policy_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_POLICY]", "validations[priority=12]"]
        distinguishing_aspect: "A second progression policy for the same (family, from_level, to_level) triple fails with ERR_DUPLICATE_POLICY (409)."
        test_recipe:
          setup: ["ENG family, levels P1/P2; policy P1->P2 already exists"]
          setup_api_calls:
