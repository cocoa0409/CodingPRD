            - *k_clock
            - call: "POST /otp/programs"
              payload: { name: "BayMark Mesa", state_code: "CA", clinic_hours_start: "06:00", clinic_hours_end: "11:00", open_days: ["MO", "TU", "WE", "TH", "FR", "SA"], max_daily_dose_slots: 3, max_daily_mg_methadone: 120.0, max_daily_mg_buprenorphine: 24.0, guest_dosing_enabled: true, dose_checkin_grace_minutes: 30 }
              as: ProgramAdministrator
