        claim_type: permission_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role denial beats everything after auth: a Nominator calling a ProgramAdmin-only endpoint gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["City program and nominating partner exist"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 5 }, as: ProgramAdmin, captures: { np: $.data.id } }
          trigger:
            - { call: "POST /api/partner-colleges", payload: { name: "Nope College" }, as: Nominator, as_user_id: "${np}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN (captured ${err})"
