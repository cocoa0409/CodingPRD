        grounds:
          - calculations.concentrator_cohort_classification
          - calculations.performance_indicator_actual
          - entities.Student.fields.concentrator_status
          - entities.PerformanceIndicator.fields.denominator_count
          - entities.PerformanceIndicator.fields.small_cohort_flag
          - entities.PerformanceIndicator.fields.preliminary_actual_pct
        distinguishing_aspect: |
          This instance's chain is CALCULATION-driven rather than transition-driven: one credit posting flips a Student
          PARTICIPANT -> CONCENTRATOR (link 1), which grows PerformanceIndicator.denominator_count from 4 to 5 (link 2),
          which flips small_cohort_flag true -> false (link 3) and rewrites preliminary_actual_pct from 25.00 to 20.00
