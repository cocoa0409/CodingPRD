  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_review_gated_by_policy_suspension_state
        grounds:
          - validations[priority=9]
          - errors.ERR_POLICY_NOT_IN_FORCE
          - state_machines.Claim.REPORTED_to_UNDER_REVIEW
          - state_machines.Policy.ACTIVE_to_SUSPENDED
          - state_machines.Policy.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Entity pair: Claim depends on Policy. A REPORTED claim — which the suspension
          cascade deliberately leaves untouched, because that cascade only gates claims
          already in UNDER_REVIEW / COVERAGE_ACCEPTED / DEFENSE_OPEN — still cannot be
          advanced to UNDER_REVIEW while its parent Policy sits in SUSPENDED, and
          becomes advanceable again the instant the policy is reinstated. The Claim's own
          fields never change, so only the parent's state can explain either outcome.
        test_recipe:
          setup:
            - "Chain P: CA (T4) / TX (T2), ACTIVE RatePlan, applicant 'Northgate Retail Group', policy ACTIVE / OPEN for [2026-08-01, 2027-08-01)."
            - "A WRONGFUL_TERMINATION / EMPLOYEE claim is reported and left in REPORTED."
            - "The UnderwritingManager then suspends the policy for non-payment, which does NOT touch the REPORTED claim."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Northgate Retail Group", total_headcount: 400, prior_year_separations: 96, jurisdiction_headcounts: [{ code: "CA", headcount: 262 }, { code: "TX", headcount: 138 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 200000000, requested_retention_cents: 5000000, third_party_coverage_requested: true, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "WRONGFUL_TERMINATION", claimant_class: "EMPLOYEE", notice_type: "DEMAND_LETTER", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 6000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { c1_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/suspend"
              payload: { suspension_reason: "Premium instalment 2 unpaid past the grace period" }
              as: UnderwritingManager
              as_user_id: "uwm-001"
          trigger:
            - call: "POST /epli/claims/${c1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { err: $.data.error_id }
            - call: "POST /epli/policies/${pol_id}/reinstate"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/claims/${c1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "the first trigger call returns error_id == ERR_POLICY_NOT_IN_FORCE with http_status 409"
            - "Policy.${pol_id}.status == SUSPENDED AND suspension_reason == 'Premium instalment 2 unpaid past the grace period' at the moment of the refusal"
            - "Claim.${c1_id}.status == REPORTED and coverage_gated == false after the refusal — the suspension cascade never touched a REPORTED claim, so only the parent policy's state blocked the transition"
            - "after reinstatement Policy.${pol_id}.status == ACTIVE AND suspension_reason == null AND suspended_at == null"
            - "the third trigger call returns http_status 200 with Claim.${c1_id}.status == UNDER_REVIEW — identical request, identical claim fields, opposite outcome"

      - name: assignment_creation_gated_by_panel_firm_suspension_state
        grounds:
          - validations[priority=9]
          - errors.ERR_PANEL_FIRM_NOT_ACTIVE
          - state_machines.DefensePanelFirm.PANEL_ACTIVE_to_PANEL_SUSPENDED
          - state_machines.DefenseAssignment.initial_state
          - endpoints["POST /epli/claims/{claim_id}/defense-assignments"]
        distinguishing_aspect: |
          Entity pair: DefenseAssignment depends on DefensePanelFirm — a different pair
          from Claim-depends-on-Policy. A CLIENT_DIRECTED assignment naming a firm that
          has been removed from the panel is refused with ERR_PANEL_FIRM_NOT_ACTIVE even
          though the firm still covers the jurisdiction and still has free capacity;
