                payload: { billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 250000, cloud_resource_id: "${res_y}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 250000, cloud_resource_id: "${res_y}" }
                as: PlatformAdmin
                as_user_id: "admin-1"
              - call: "POST /finops/cost-records"
                payload: { billing_period_start: "2026-07-01T00:00:00Z", billing_period_end: "2026-08-01T00:00:00Z", resource_kind: "COMPUTE", list_cost_cents: 299999, cloud_resource_id: "${res_y}" }
