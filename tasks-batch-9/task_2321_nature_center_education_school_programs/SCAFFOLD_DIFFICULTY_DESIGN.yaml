              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/schools"
              payload: { name: "Cedar Grove Elementary", district_code: "LEA-77", title_i_pct: 0.82, distance_miles: 12.5 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { school_id: $.data.id }
            - call: "POST /nature-center/scholarship-funds"
              payload: { funder_name: "Riverbend Foundation", fiscal_year: 2027, total_cents: 5000000, transport_sublimit_pct: 0.25 }
              as: GrantsOfficer
              as_user_id: "go-01"
              captures: { fund_id: $.data.id, fund_ver: $.data.version }
            - call: "POST /nature-center/bookings"
              payload: { school_id: "${school_id}", offering_id: "${off_id}", start_utc: "2026-09-29T14:00:00Z", end_utc: "2026-09-29T16:00:00Z", student_count: 30, chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { bk_id: $.data.id }
            - call: "POST /nature-center/aid-applications"
              payload: { booking_id: "${bk_id}", fund_id: "${fund_id}", requested_scholarship_cents: 33300, requested_transport_cents: 6500, expected_fund_version: "${fund_ver}" }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { aid_id: $.data.id }
          trigger:
            - call: "POST /nature-center/aid-applications/${aid_id}/review"
