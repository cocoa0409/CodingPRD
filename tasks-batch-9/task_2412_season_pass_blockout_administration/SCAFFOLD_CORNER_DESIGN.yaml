      - name: visit_close_action_applies_the_tier_discount_to_the_spend
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /visits/{visit_id}/close]
          - entities.Visit.fields.discount_applied_pct
          - state_machines.Visit.OPEN_to_CLOSED
        distinguishing_aspect: "Closing the visit is the action that books in-park spend: the tier's in_park_discount_pct is stamped on the visit at close time, the amount lands in the program's spend rollup, and the visit is the only place spend can be recorded."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED GOLD (in_park_discount_pct 0.15) and a STANDARD park day 2026-09-01."
            - "A processed ACTIVE GOLD pass bought PAY_IN_FULL with one OPEN visit on that day."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
