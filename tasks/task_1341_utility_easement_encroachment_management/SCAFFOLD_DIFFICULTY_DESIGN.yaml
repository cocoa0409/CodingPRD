              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers"
              payload: { landowner_name: "W", landowner_contact: "w@x.com", offered_area_sqft: 1000, severance_damages_cents: 500000 }
              as: RightOfWayAgent
              captures: { offer_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/tender"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/offers/${offer_id}/reject"
