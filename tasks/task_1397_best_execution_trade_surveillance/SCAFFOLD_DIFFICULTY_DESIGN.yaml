# =============================================================================
# §1.8 Scaffold Difficulty Design — Best Execution & Trade Surveillance
# 9 rules x 2 instances = 18 instances. Every instance is a standalone test
# from empty-DB; logical clock default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quality_benchmark_variants_diverge
        grounds:
          - calculations.calc_execution_quality
          - entities.ExecutionQualitySnapshot.fields.variant
          - endpoints["GET /surveillance/venues/{id}/execution-quality-snapshots"]
        distinguishing_aspect: |
          Same two EXECUTED orders, same venue/type/month bucket: the FAR_TOUCH
          snapshot reports total_improvement_cents 2108.00 and avg 7.0033 while the
          MIDPOINT snapshot reports -402.00 and -1.3355 — two valid benchmarks over
          identical data on the ExecutionQualitySnapshot/Order domain.
        test_recipe:
          setup:
            - "Venue NYSE ACTIVE with an ACTIVE arrangement covering 2026-08-01..2026-09-01"
            - "Order O1: BUY 100 MARKET, NBBO 10000/10010, executed 10005 at 2026-08-05T15:00:00Z"
            - "Order O2: BUY 201 MARKET, NBBO 20000/20020, executed 20012 at 2026-08-05T15:05:00Z"
            - "Two PROVISIONAL snapshots for (venue, MARKET, 2026-08), one FAR_TOUCH, one MIDPOINT"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "Q1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 10000, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o1_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o1_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "Q2", symbol: "ACME", side: "BUY", quantity: 201, order_type: "MARKET", arrival_nbbo_bid_cents: 20000, arrival_nbbo_ask_cents: 20020 }, as: OpsAdmin, captures: { o2_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o2_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T16:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o1_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-05T15:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o2_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 20012, executed_at: "2026-08-05T15:05:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap_ft: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "MIDPOINT" }, as: ComplianceAdmin, captures: { snap_mid: "$.data.id" } }
          trigger:
            - { call: "GET /surveillance/venues/${v_id}/execution-quality-snapshots", payload: { period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { ft_total: "$.data[0].total_improvement_cents", ft_avg: "$.data[0].avg_improvement_cents_per_share", ft_cnt: "$.data[0].order_count" } }
            - { call: "GET /surveillance/venues/${v_id}/execution-quality-snapshots", payload: { period_month: "2026-08", variant: "MIDPOINT" }, as: ComplianceAdmin, captures: { mid_total: "$.data[0].total_improvement_cents", mid_avg: "$.data[0].avg_improvement_cents_per_share" } }
          assert:
            - "FAR_TOUCH snapshot: order_count == 2, total_quantity == 301, total_improvement_cents == 2108.00 (5.00*100 + 8.00*201), avg_improvement_cents_per_share == 7.0033 (round_half_up(2108/301, 4dp))"
            - "MIDPOINT snapshot: total_improvement_cents == -402.00 (0.00*100 + -2.00*201), avg_improvement_cents_per_share == -1.3355 (round_half_up(-402/301, 4dp))"
            - "Same orders, same bucket: ${ft_total} != ${mid_total} — the variant pinned at creation decides the benchmark"

      - name: pfof_tier_variants_diverge
        grounds:
          - calculations.calc_pfof_accrual
          - entities.PfofDisclosure.fields.pricing_variant
          - endpoints["POST /surveillance/pfof-disclosures"]
        distinguishing_aspect: |
          Same tier table [{0:0.10},{100000:0.25}] and same monthly volume S=150000:
          the MARGINAL disclosure computes 22500 cents (100000*0.10 + 50000*0.25)
          while the RETROACTIVE disclosure computes 37500 cents (150000*0.25) —
          dual-variant logic on the PfofDisclosure/PFOF domain, distinct from the
          Order/quality benchmark domain of the sibling instance.
        test_recipe:
          setup:
            - "Venue ARCA ACTIVE with arrangement tiers [{0, 0.10}, {100000, 0.25}] covering 2026-08-01..2027-01-01"
            - "Three EXECUTED MARKET orders of 50000 shares each in August 2026 (Q3)"
            - "Three EXECUTED MARKET orders of 50000 shares each in October 2026 (Q4)"
            - "DRAFT disclosure D3 for 2026-Q3 with pricing_variant=MARGINAL; DRAFT disclosure D4 for 2026-Q4 with pricing_variant=RETROACTIVE"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "ARCA", name: "NYSE Arca", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 }, { min_monthly_shares: 100000, rate_cents_per_share: 0.25 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P1", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p1}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P2", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P3", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p3}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T13:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-12T12:30:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p2}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-12T12:35:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p3}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-12T12:40:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d3: "$.data.id" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P4", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p4: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p4}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P5", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p5: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p5}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "P6", symbol: "BETA", side: "BUY", quantity: 50000, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { p6: "$.data.id" } }
            - { call: "POST /surveillance/orders/${p6}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T13:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p4}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-10-05T12:30:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p5}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-10-05T12:35:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${p6}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-10-05T12:40:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q4", pricing_variant: "RETROACTIVE" }, as: FilingOfficer, captures: { d4: "$.data.id" } }
          trigger:
            - { call: "GET /surveillance/pfof-disclosures/${d3}", payload: {}, as: FilingOfficer, captures: { d3_total: "$.data.total_pfof_cents" } }
            - { call: "GET /surveillance/pfof-disclosures/${d4}", payload: {}, as: FilingOfficer, captures: { d4_total: "$.data.total_pfof_cents" } }
          assert:
            - "D3 (MARGINAL): venue_lines[0].total_shares == 150000, venue_lines[0].pfof_cents == 22500, total_pfof_cents == 22500"
            - "D4 (RETROACTIVE): venue_lines[0].total_shares == 150000, venue_lines[0].pfof_cents == 37500, total_pfof_cents == 37500"
            - "Identical volume and tier table: ${d3_total} == 22500 and ${d4_total} == 37500 — variant alone decides the accrual"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pfof_marginal_band_split_multi_input
        grounds:
          - calculations.calc_pfof_accrual
          - validations[priority=22]
        distinguishing_aspect: |
          Mode (a): the MARGINAL tier evaluation combines 3+ inputs — monthly share
          volume S=150000, the two-band tier table, the pricing_variant flag, and the
          arrangement's effective-window containment of each executed_at — with
          non-linear nested min/max band allocation; the pinned band split yields
          exactly 22500 cents, and any band-boundary mishandling (off-by-one share,
          wrong cap) changes the total.
        test_recipe:
          setup:
            - "Venue BATS ACTIVE, arrangement tiers [{0, 0.10}, {100000, 0.25}], window 2026-08-01..2026-09-01"
            - "Orders straddling the tier boundary: 99999 shares then 50001 more (S lands exactly 150000, one share past the boundary in the second band is not special — the split is 100000/50000)"
            - "DRAFT disclosure for 2026-Q3, MARGINAL"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "BATS", name: "Cboe BZX", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 }, { min_monthly_shares: 100000, rate_cents_per_share: 0.25 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "B1", symbol: "GAMA", side: "BUY", quantity: 99999, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /surveillance/orders/${b1}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "B2", symbol: "GAMA", side: "BUY", quantity: 50001, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { b2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${b2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T13:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${b1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-12T12:30:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${b2}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-12T12:35:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d_id: "$.data.id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
          trigger:
            - { call: "GET /surveillance/pfof-disclosures/${d_id}", payload: {}, as: FilingOfficer }
          assert:
            - "venue_lines[0].total_shares == 150000 and venue_lines[0].pfof_cents == 22500 (100000*0.10 + 50000*0.25)"
            - "total_pfof_cents == 22500 and venue_lines[0].arrangement_id == ${a_id}"
            - "Line pinned arrangement_version equals the arrangement version at submit time (create=1, activate=2): venue_lines[0].arrangement_version == 2"

      - name: front_running_score_final_rounding_only
        grounds:
          - calculations.calc_front_running_score
          - entities.SurveillanceAlert.fields.score
        distinguishing_aspect: |
          Mode (b) nested rounding: the score pins sum-then-round (single final
          round_half_up to integer). Inputs delta_seconds=2700 (time factor 12.5),
          quantities 35 vs 100 (size factor 10.5), opposite sides (side factor 0)
          sum to 23.0 -> 23, whereas the forbidden per-factor-rounding order yields
          13+11+0 = 24 — the rounding order alone decides between 23 and 24.
          Different mode than the sibling instance (which is mode (a)).
        test_recipe:
          setup:
            - "Employee EMP-201 attested CURRENT, ACTIVE"
            - "Personal trade: BUY 35 DELT, approved at 2026-08-06T14:00:00Z, execution reported at 14:00:00Z"
            - "Client order: SELL 100 DELT executed at 2026-08-06T14:45:00Z (delta exactly 2700s after the trade, inside the 3600s window)"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Rita Book", employee_ref: "EMP-201", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "DELT", side: "BUY", quantity: 35 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "EXECUTION_REPORTED", executed_price_cents: 5000, executed_at: "2026-08-06T14:00:00Z" }, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/venues", payload: { venue_code: "IEXG", name: "Investors Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "FR1", symbol: "DELT", side: "SELL", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 4990, arrival_nbbo_ask_cents: 5010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T15:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 4995, executed_at: "2026-08-06T14:45:00Z" }, as: OpsAdmin }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_order_id: "${o_id}" }, as: SurveillanceAnalyst, captures: { al_score: "$.data[0].score", al_type: "$.data[0].alert_type" } }
          assert:
            - "Exactly one FRONT_RUNNING alert exists for the order; ${al_type} == FRONT_RUNNING"
            - "score == 23 — round_half_up(12.5 + 10.5 + 0) once at the end; an implementation that rounds each factor first would report 24 and must fail"
            - "score_inputs.delta_seconds == 2700, score_inputs.same_side == false"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_dimensions_with_cycles
        grounds:
          - state_machines.SurveillanceCase
          - state_machines.SurveillanceAlert
          - calculations.calc_late_filing_fee
        distinguishing_aspect: |
          SurveillanceCase carries TWO parallel state dimensions (review_status x
          filing_status) that each contain a cycle (DISPOSITIONED->REOPENED->
          UNDER_INVESTIGATION; DRAFT->SUBMITTED->DRAFT rejection loop) AND a
          cross-dimension gate (reopen blocked while filing SUBMITTED). Distinct
          entity from the sibling instance (Employee).
        test_recipe:
          setup:
            - "Front-running alert (score 88) escalated into a case on employee EMP-301; case UNDER_INVESTIGATION"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Casey Subject", employee_ref: "EMP-301", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 100 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "EXECUTION_REPORTED", executed_price_cents: 10000, executed_at: "2026-08-03T14:30:00Z" }, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "C1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:50:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10005, executed_at: "2026-08-03T14:45:00Z" }, as: OpsAdmin }
            - { call: "GET /surveillance/surveillance-alerts", payload: { related_order_id: "${o_id}" }, as: SurveillanceAnalyst, captures: { al_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-alerts/${al_id}/transition", payload: { to_status: "ACKNOWLEDGED" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/surveillance-alerts/${al_id}/transition", payload: { to_status: "ESCALATED" }, as: SurveillanceAnalyst }
            - { call: "GET /surveillance/surveillance-cases", payload: { subject_employee_id: "${e_id}" }, as: SurveillanceAnalyst, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "UNDER_INVESTIGATION" }, as: SurveillanceAnalyst }
          trigger:
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "DISPOSITIONED", disposition: "VIOLATION_CONFIRMED" }, as: SurveillanceAnalyst }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "SUBMITTED" }, as: FilingOfficer }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "REOPENED" }, as: SurveillanceAnalyst, captures: { reopen_err: "$.data.error_id" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/filing-transition", payload: { to_status: "DRAFT" }, as: FilingOfficer }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "REOPENED" }, as: SurveillanceAnalyst, captures: { c_review: "$.data.review_status", c_filing: "$.data.filing_status" } }
            - { call: "POST /surveillance/surveillance-cases/${c_id}/review-transition", payload: { to_status: "UNDER_INVESTIGATION" }, as: SurveillanceAnalyst }
            - { call: "GET /surveillance/surveillance-alerts/${al_id}", payload: {}, as: SurveillanceAnalyst, captures: { al_status: "$.data.status", al_case: "$.data.case_id" } }
          assert:
            - "On-time filing (submitted 2026-08-03T14:50 clock, due dispositioned_at+30d): late_fee_cents == 0 after SUBMITTED"
            - "Reopen while filing SUBMITTED is rejected: ${reopen_err} == ERR_FILING_IN_FLIGHT (cross-dimension gate)"
            - "After regulator rejection (filing SUBMITTED->DRAFT cycle), reopen succeeds: ${c_review} == REOPENED and ${c_filing} == NOT_REQUIRED (draft filing voided)"
            - "Compensation: linked alert is back to ACKNOWLEDGED with case_id null (${al_status} == ACKNOWLEDGED, ${al_case} == null)"
            - "Review dimension completes its cycle: final review-transition lands UNDER_INVESTIGATION (2xx)"

      - name: employee_parallel_dimensions_gate_preclearance
        grounds:
          - state_machines.Employee
          - state_machines.PersonalTrade
          - validations[priority=11]
          - validations[priority=12]
        distinguishing_aspect: |
          Employee carries two independent parallel dimensions — the employment
          cycle (ACTIVE->ON_LEAVE->ACTIVE) and the attestation cycle
          (CURRENT->DUE->LAPSED->CURRENT) — and each dimension independently gates
          PersonalTrade approval (ERR_EMPLOYEE_NOT_ACTIVE vs ERR_ATTESTATION_LAPSED).
          Distinct entity from the sibling instance (SurveillanceCase).
        test_recipe:
          setup:
            - "Employee EMP-401 created at clock 2026-08-01T00:00:00Z with attestation_due_at 2026-09-10T00:00:00Z (CURRENT: 40 days of runway)"
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Pat Parallel", employee_ref: "EMP-401", department: "OPERATIONS", attestation_due_at: "2026-09-10T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/ops/runs", payload: {}, as: OpsAdmin, captures: { run1: "$.data.attestations_due" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/ops/runs", payload: {}, as: OpsAdmin, captures: { run2: "$.data.attestations_lapsed" } }
          trigger:
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t1: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t1}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err_lapsed: "$.data.error_id" } }
            - { call: "POST /surveillance/employees/${e_id}/attest", payload: {}, as: CoveredEmployee, as_user_id: "${e_id}", captures: { att: "$.data.attestation_status" } }
            - { call: "POST /surveillance/employees/${e_id}/employment-transition", payload: { to_status: "ON_LEAVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${t1}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err_leave: "$.data.error_id" } }
            - { call: "POST /surveillance/employees/${e_id}/employment-transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${t1}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { t_status: "$.data.status" } }
          assert:
            - "Ops run at 2026-09-01 flips attestation CURRENT->DUE: ${run1} == 1 (9 days before due date)"
            - "Ops run at 2026-09-11 flips DUE->LAPSED: ${run2} == 1"
            - "Approve while LAPSED (employment ACTIVE): ${err_lapsed} == ERR_ATTESTATION_LAPSED — attestation dimension gates"
            - "Attest cycles LAPSED->CURRENT: ${att} == CURRENT"
            - "Approve while ON_LEAVE (attestation CURRENT): ${err_leave} == ERR_EMPLOYEE_NOT_ACTIVE — employment dimension gates independently"
            - "After ACTIVE reinstatement the cycle closes: ${t_status} == APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: review_publish_terminate_cascade_depth3
        grounds:
          - state_machines.BestExReview.APPROVED_to_PUBLISHED
          - state_machines.Venue.ACTIVE_to_SUSPENDED
          - state_machines.RoutingArrangement.ACTIVE_to_SUSPENDED
          - state_machines.Order.ROUTED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive cascade from review publish: each link is caused by the
          previous one (review -> venue suspension -> arrangement suspension ->
          ROUTED order cancellation), NOT a fan-out from the publish call; the
          already-EXECUTED sibling order proves the cascade's conditional selectivity.
          Different trigger than the sibling instance (lexicon retune).
        test_recipe:
          setup:
            - "Venue XATS ACTIVE, arrangement ACTIVE, one EXECUTED MARKET order, one ROUTED LIMIT order"
            - "LOCKED FAR_TOUCH snapshot for (XATS, MARKET, 2026-08) taken before the LIMIT order was created"
            - "PUBLISHED PFOF disclosure for 2026-Q3"
            - "Review for 2026-Q3 with determination TERMINATE_ROUTING for XATS, voted to APPROVED by 3 distinct committee members"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "XATS", name: "Xeno ATS", venue_type: "ATS" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "T1", symbol: "ZETA", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o1}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-10T14:30:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d_id: "$.data.id" } }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer }
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PUBLISHED" }, as: FilingOfficer }
            - { call: "POST /surveillance/orders", payload: { client_ref: "T2", symbol: "ZETA", side: "BUY", quantity: 50, order_type: "LIMIT", limit_price_cents: 9900, arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o2: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o2}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/best-ex-reviews", payload: { quarter: "2026-Q3", snapshot_ids: [ "${snap}" ], venue_decisions: [ { venue_id: "${v_id}", determination: "TERMINATE_ROUTING" } ] }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-3", captures: { r_status: "$.data.status" } }
          trigger:
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "PUBLISHED" }, as: BestExAnalyst, as_user_id: "ba-1" }
            - { call: "GET /surveillance/venues/${v_id}", payload: {}, as: ComplianceAdmin, captures: { v_status: "$.data.status" } }
            - { call: "GET /surveillance/routing-arrangements/${a_id}", payload: {}, as: ComplianceAdmin, captures: { a_status: "$.data.status" } }
            - { call: "GET /surveillance/routing-arrangements/${a_id}/orders", payload: {}, as: ComplianceAdmin, captures: { o1_status: "$.data[0].status", o2_status: "$.data[1].status" } }
          assert:
            - "Third vote auto-approves (quorum 3): ${r_status} == APPROVED before publish"
            - "Link 1: ${v_status} == SUSPENDED after publish"
            - "Link 2 (caused by venue suspension): ${a_status} == SUSPENDED"
            - "Link 3 (caused by arrangement suspension): the ROUTED LIMIT order is CANCELLED (${o2_status} == CANCELLED)"
            - "Conditional selectivity: the EXECUTED MARKET order is untouched (${o1_status} == EXECUTED)"

      - name: lexicon_retune_rescore_escalation_cascade
        grounds:
          - state_machines.LexiconPolicy
          - state_machines.CommReviewItem
          - calculations.calc_lexicon_score
          - concurrency_rules[lexicon-patch-stale-version]
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger class (lexicon retune, not review
          publish): PATCH terms on the ACTIVE policy (link 1: QUEUED item rescored
          60 -> 100) -> item auto-ESCALATED (link 2, caused by the rescore) ->
          SurveillanceCase created on the author (link 3, caused by the escalation).
        test_recipe:
          setup:
            - "Employee EMP-501 ACTIVE/CURRENT"
            - "ACTIVE LexiconPolicy L1 v2 with terms [{guarantee,60},{insider,40}]"
            - "CommReviewItem by EMP-501 with body 'We guarantee returns' — score 60, QUEUED"
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Kim Author", employee_ref: "EMP-501", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/lexicon-policies", payload: { name: "L1", terms: [ { term: "guarantee", weight: 60 }, { term: "insider", weight: 40 } ] }, as: ComplianceAdmin, captures: { l_id: "$.data.id", l_v1: "$.data.version" } }
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v1}", to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { l_v2: "$.data.version" } }
            - { call: "POST /surveillance/comm-review-items", payload: { channel: "EMAIL", author_employee_id: "${e_id}", body_text: "We guarantee returns" }, as: OpsAdmin, captures: { ci_id: "$.data.id", ci_score: "$.data.score", ci_status: "$.data.status" } }
          trigger:
            - { call: "PATCH /surveillance/lexicon-policies/${l_id}", payload: { expected_lexicon_policy_version: "${l_v2}", terms: [ { term: "guarantee", weight: 100 } ] }, as: ComplianceAdmin, captures: { l_v3: "$.data.version" } }
            - { call: "GET /surveillance/employees/${e_id}/comm-review-items", payload: {}, as: ComplianceAdmin, captures: { ci_status2: "$.data[0].status", ci_score2: "$.data[0].score", ci_pv: "$.data[0].scored_policy_version" } }
            - { call: "GET /surveillance/surveillance-cases", payload: { source_comm_item_id: "${ci_id}" }, as: SurveillanceAnalyst, captures: { case_cnt: "$.data[0].review_status", case_from: "$.data[0].opened_from" } }
            - { call: "GET /surveillance/employees/${e_id}", payload: {}, as: ComplianceAdmin, captures: { emp_cases: "$.data.open_case_count" } }
          assert:
            - "Pre-cascade: ${ci_score} == 60 and ${ci_status} == QUEUED"
            - "Link 1: after retune the QUEUED item is rescored to ${ci_score2} == 100 under ${ci_pv} == ${l_v3}"
            - "Link 2: ${ci_status2} == ESCALATED (auto-tier at the >= 100 boundary, caused by the rescore)"
            - "Link 3: exactly one case exists with source_comm_item_id == ${ci_id}, opened_from == COMM_REVIEW, review_status == OPEN"
            - "Derived counter reconciled: ${emp_cases} == 1"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_denied_trade_decide
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - state_machines.PersonalTrade
        distinguishing_aspect: |
          Error-category pair state (p9) vs business_safety (p12): a decide-APPROVED
          call on an already-DENIED trade whose employee is attestation-LAPSED
          violates both rules; the state error ERR_INVALID_STATE must win because
          state (9) precedes business_safety (12).
        test_recipe:
          setup:
            - "Employee EMP-601 LAPSED (attestation_due_at 2026-07-01 < default clock 2026-08-01)"
            - "PersonalTrade already DENIED (denial path skips eligibility gates)"
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Lou Lapsed", employee_ref: "EMP-601", department: "TRADING", attestation_due_at: "2026-07-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id", e_att: "$.data.attestation_status" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "DENIED", denial_reason: "COMPLIANCE_HOLD" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /surveillance/personal-trades/${t_id}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Setup sanity: ${e_att} == LAPSED (initial attestation computed from clock)"
            - "Dual failure resolved by priority: ${err} == ERR_INVALID_STATE (state p9), NOT ERR_ATTESTATION_LAPSED (business_safety p12)"

      - name: venue_suspension_beats_arrangement_inactive_on_route
        grounds:
          - validations[priority=10]
          - validations[priority=21]
          - state_machines.Venue
        distinguishing_aspect: |
          Error-category pair business_safety (p10) vs business_referential (p21):
          routing an order to an arrangement whose venue is SUSPENDED and whose own
          status was cascade-suspended violates both gates; ERR_VENUE_SUSPENDED must
          win. Different category pair than the sibling instance (state vs safety).
        test_recipe:
          setup:
            - "Venue NYSE with arrangement ACTIVE; venue manually suspended (arrangement cascade-suspended); fresh order RECEIVED"
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/venues/${v_id}/transition", payload: { to_status: "SUSPENDED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "PP2", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Dual failure resolved by priority: ${err} == ERR_VENUE_SUSPENDED (business_safety p10), NOT ERR_NO_ACTIVE_ARRANGEMENT (business_referential p21)"

