            - "GET /exchange-network/deposits/${dep_m1} — deposit_status == \"BANKED\", restoration_haircut_power == 0, remaining_power == 82, rental_status == \"NOT_LISTED\""
            - "GET /exchange-network/members/${m1} — trading_power_balance == 82, unchanged"
            - "GET /exchange-network/getaway-offers?deposit_id=${dep_m1} — total_count == 0"
            - "GET /exchange-network/ledger-entries?member_id=${m1} — total_count == 2 (DUES_PAYMENT and DEPOSIT_CREDIT only; no RESTORATION_HAIRCUT row)"
            - "control at the adjacent value: the identical chain with the clock at 2027-05-17 (29 days out) yields restoration_variant PRORATED_RESTORE, restoration_haircut_power 21, remaining_power 61, cancellation_fee_cents 16400, one LISTED GetawayOffer, and M1 trading_power_balance 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    rule_summary: >-
      A write is admitted or rejected based on the state field of a DIFFERENT
      entity reached by foreign key, and the same call flips outcome as that
      other entity moves through its own state machine.
    instances:

      - name: deposit_create_blocked_by_resort_affiliation_status
        depends_on: "Resort.affiliation_status governs POST /exchange-network/deposits"
        why_hard: >-
          The deposit's own fields never change across the four attempts; only the resort's state
          does, and the mapping is not monotone. PENDING_AFFILIATION rejects, ACTIVE accepts,
          PROBATION still accepts — a probated resort keeps taking deposits precisely so it can work
          off its shortfall — and SUSPENDED rejects again. An implementation that gates on a single
          boolean "is affiliated" flag, or that treats PROBATION as a stop, fails the third attempt.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A created with units_per_size 2, demand_index 4, GOLD_CROWN and a GOLD
            band 04-01..06-30, but NOT yet affiliated, so affiliation_status is
            PENDING_AFFILIATION. Member M1 on PLUS, dues-paid through 2030-12-31. The clock stays at
            the default 2026-08-01.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { err_pending: "$.data.error_id" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_active: "$.data.id" }
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "PROBATION", reason: "obligation shortfall" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-25" }
              captures: { dep_probation: "$.data.id" }
            - call: "POST /exchange-network/resorts/${resort_a}/status-changes"
              as: NetworkOperator
              payload: { to_status: "SUSPENDED", reason: "escalated findings" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-05" }
              captures: { err_suspended: "$.data.error_id" }
          assert:
            - "attempt 1 (PENDING_AFFILIATION) — HTTP 409 with error_id ERR_RESORT_NOT_AFFILIATED and no Deposit created"
            - "attempt 2 (ACTIVE) — HTTP 201 and GET /exchange-network/deposits/${dep_active} has awarded_power == 82 and deposit_status == \"BANKED\""
            - "attempt 3 (PROBATION) — HTTP 201 and GET /exchange-network/deposits/${dep_probation} has awarded_power == 82 (lead 328 -> factor 1.20); a probated resort still accepts deposits"
            - "attempt 4 (SUSPENDED) — HTTP 409 with error_id ERR_RESORT_NOT_AFFILIATED"
            - "GET /exchange-network/deposits?resort_id=${resort_a} — total_count == 2 (only attempts 2 and 3 persisted)"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 164 (82 + 82)"
            - "GET /exchange-network/resorts/${resort_a} — affiliation_status == \"SUSPENDED\", deposits_committed_count == 2, committed_nights == 16"

      - name: quality_review_blocked_until_confirmation_completed
        depends_on: "Confirmation.status governs POST /exchange-network/resorts/{resort_id}/quality-reviews"
        why_hard: >-
          A member may only rate a resort they actually stayed at, which means the review is gated on
          a Confirmation belonging to that member reaching COMPLETED — and COMPLETED is reached only
          by a matching run whose step 4 sweep sees the clock past check_in plus the stay length.
          The review therefore requires a state transition on a third entity driven by time, not by
          any field on the review. A second trap sits on the far side: one accepted review is not
          enough for a quality_score, because MIN_REVIEWS_FOR_SCORE is 2, so quality_score stays null
          and quality_rating stays at the operator's initial GOLD_CROWN even though the composite is
          well below that band.
        test_recipe:
          setup: >-
            The canonical exchange chain through confirmation: Tier PLUS, Resort A (units_per_size 2,
            demand_index 4, GOLD_CROWN, GOLD band 04-01..06-30) affiliated at the default clock;
            M1 and M2 on PLUS; M1 banks ONE_BR 2027-06-15 for 82; M2 banks TWO_BR 2027-05-10 for 107
            and funds a DEPOSIT_FIRST ONE_BR request over 2027-06-01..2027-06-30; a run reserves
            M1's week and M2 confirms, so the confirmation is CONFIRMED with awarded check-in
            2027-06-15. The clock is still 2026-08-01, far before the stay.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "reserve M1's week" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req}" }
              captures: { conf: "$.data.id" }
            - call: "GET /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: {}
              captures: { resort_a_v: "$.data.version" }
          trigger:
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf}", cleanliness_score: 9, service_score: 8, amenities_score: 7, expected_resort_version: "${resort_a_v}" }
              captures: { err_early: "$.data.error_id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-06-22T00:00:00Z" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "completion sweep for the finished stay" }
              captures: { run2: "$.data.id" }
            - call: "GET /exchange-network/resorts/${resort_a}"
              as: NetworkOperator
              payload: {}
              captures: { resort_a_v2: "$.data.version" }
            - call: "POST /exchange-network/resorts/${resort_a}/quality-reviews"
              as: Member
              as_user_id: "${m2}"
              payload: { confirmation_id: "${conf}", cleanliness_score: 9, service_score: 8, amenities_score: 7, expected_resort_version: "${resort_a_v2}" }
              captures: { review: "$.data.id" }
          assert:
            - "first review attempt, confirmation still CONFIRMED — HTTP 409 with error_id ERR_STAY_NOT_COMPLETED and GET /exchange-network/resort-quality-reviews?resort_id=${resort_a} total_count == 0"
            - "GET /exchange-network/confirmations/${conf} after run2 — status == \"COMPLETED\" and updated_at == \"2027-06-22T00:00:00Z\" (check-in 2027-06-15 plus the 7-night stay)"
            - "GET /exchange-network/matching-runs/${run2} — completed_confirmation_count == 1"
            - "second review attempt — HTTP 201 and GET /exchange-network/resort-quality-reviews/${review} has composite_score == \"8.15\" (0.40*9 + 0.35*8 + 0.25*7 = 3.60 + 2.80 + 1.75)"
            - "GET /exchange-network/resorts/${resort_a} — review_count == 1, quality_score == null (fewer than the 2 reviews required), quality_rating == \"GOLD_CROWN\" (still the operator's initial rating)"
            - "GET /exchange-network/resort-quality-reviews?confirmation_id=${conf} — total_count == 1 (a completed stay yields at most one review)"

      - name: dispute_power_grant_blocked_by_expired_deposit
        depends_on: "Deposit.deposit_status governs POST /exchange-network/disputes/{dispute_id}/resolution"
        why_hard: >-
          An UPHELD resolution that carries granted_power_adjustment must post that grant against the
          disputed deposit, and an EXPIRED deposit can no longer receive power, so the resolution is
          rejected on the state of an entity two hops away from the dispute. The rejection must leave
          the dispute in UNDER_REVIEW — not resolve it with the grant dropped, and not move it to a
          dead end — so the analyst can immediately resolve it DENIED instead. Implementations that
          write the dispute row before validating the grant leave a half-resolved dispute behind.
        test_recipe:
          setup: >-
            Resort C (units_per_size 3, demand_index 2, required_annual_deposit_units 1, STANDARD,
            one SILVER band covering the year) affiliated at the default clock. Member M1 on PLUS,
            dues-paid through 2030-12-31, banks a STUDIO week for 2026-11-01 worth 27 that expires at
            2028-10-31T00:00:00Z. M1 opens a TRADING_POWER dispute naming that deposit and an analyst
            moves it to UNDER_REVIEW. The clock then moves to 2028-11-01 and a matching run expires
            the deposit, taking M1 back to 0 power.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Pine Hollow Lodge", region_code: "US-MI", required_annual_deposit_units: 1, initial_quality_rating: "STANDARD", units_per_size: 3, demand_index: 2 }
              captures: { resort_c: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_c}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_c}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_c}", unit_size: "STUDIO", check_in_date: "2026-11-01" }
              captures: { dep: "$.data.id" }
            - call: "POST /exchange-network/disputes"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", subject_type: "TRADING_POWER", narrative: "A studio week in shoulder season should not value at 27 points.", deposit_id: "${dep}" }
              captures: { disp: "$.data.id" }
            - call: "POST /exchange-network/disputes/${disp}/review"
              as: DisputeAnalyst
              payload: {}
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2028-11-01T00:00:00Z" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "expiry sweep" }
          trigger:
            - call: "POST /exchange-network/disputes/${disp}/resolution"
              as: DisputeAnalyst
              payload: { outcome: "UPHELD", resolution_note: "Season band was misassigned; grant 8 points.", granted_power_adjustment: 8 }
              captures: { err_expired: "$.data.error_id" }
            - call: "POST /exchange-network/disputes/${disp}/resolution"
              as: DisputeAnalyst
              payload: { outcome: "DENIED", resolution_note: "Grant impossible: the disputed deposit has expired." }
              captures: { disp_status: "$.data.status" }
          assert:
            - "GET /exchange-network/deposits/${dep} — deposit_status == \"EXPIRED\" before the trigger"
            - "first resolution attempt — HTTP 409 with error_id ERR_DEPOSIT_EXPIRED"
            - "GET /exchange-network/disputes/${disp} after the first attempt — status == \"UNDER_REVIEW\", resolution_note == null, granted_power_adjustment == 0, round_count == 0"
            - "GET /exchange-network/members/${m1} after the first attempt — trading_power_balance == 0 (no partial grant)"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=DISPUTE_POWER_GRANT — total_count == 0"
            - "second resolution attempt — HTTP 200 and GET /exchange-network/disputes/${disp} has status == \"RESOLVED_DENIED\", resolution_note set to the analyst text, granted_power_adjustment == 0 and updated_at == \"2028-11-01T00:00:00Z\""
            - "GET /exchange-network/members/${m1} after the second attempt — trading_power_balance == 0, unchanged by a DENIED resolution"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    rule_summary: >-
      Two intervals competing for the same finite resource, where the accept and
      reject cases differ only in the endpoint boundary and the interval
      arithmetic is half-open or closed depending on which resource it is.
    instances:

      - name: season_band_closed_interval_overlap_rejected_adjacent_accepted
        resource: "Resort season calendar — a resort's SeasonBand intervals are CLOSED on both ends and may not overlap"
        why_hard: >-
          Season bands are month-day intervals with inclusive ends, so 01-01..06-30 and 07-01..12-31
          are legally adjacent while 06-30..08-15 collides on its very first day. Implementations
          that treat the interval as half-open accept the colliding band; implementations that
          compare only start dates accept it too. A fourth band whose start month-day is after its
          end month-day is a malformed range, not an overlap, and must fail the earlier
          ERR_INVALID_DATE_RANGE check even though it would also overlap the GOLD band.
        test_recipe:
          setup: >-
            Resort B "Coral Bay Villas" created with units_per_size 1, demand_index 5,
            required_annual_deposit_units 1, initial_quality_rating SILVER_CROWN. No season bands
            exist yet. Clock stays at the default 2026-08-01. All four attempts are made by the
            operator against the same resort.
          setup_api_calls:
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Coral Bay Villas", region_code: "MX-QR", required_annual_deposit_units: 1, initial_quality_rating: "SILVER_CROWN", units_per_size: 1, demand_index: 5 }
              captures: { resort_b: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "PLATINUM", start_month_day: "01-01", end_month_day: "06-30" }
              captures: { band_plat: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "GOLD", start_month_day: "07-01", end_month_day: "12-31" }
              captures: { band_gold: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "SILVER", start_month_day: "06-30", end_month_day: "08-15" }
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "BRONZE", start_month_day: "09-01", end_month_day: "08-15" }
              captures: { err_range: "$.data.error_id" }
          assert:
            - "band 1 — HTTP 201 and GET /exchange-network/season-bands/${band_plat} has season_multiplier == \"1.50\" and band_code == \"PLATINUM\""
            - "band 2, adjacent on the closed boundary — HTTP 201 and GET /exchange-network/season-bands/${band_gold} has season_multiplier == \"1.25\" (07-01 immediately follows the inclusive end 06-30, so there is no overlap)"
            - "band 3, colliding on exactly one day — HTTP 409 with error_id ERR_SEASON_BAND_OVERLAP (06-30 is inside the closed PLATINUM interval and 07-01..08-15 is inside GOLD)"
            - "band 4, start after end — HTTP 422 with error_id ERR_INVALID_DATE_RANGE, not ERR_SEASON_BAND_OVERLAP; the malformed-range check is the earlier validation"
            - "GET /exchange-network/season-bands?resort_id=${resort_b} — total_count == 2 and the band_code values are PLATINUM and GOLD"
            - "a deposit for a ONE_BR week checking in 2027-06-30 resolves to band PLATINUM and one checking in 2027-07-01 resolves to band GOLD, confirming the inclusive end is owned by the earlier band"

      - name: deposit_occupancy_halfopen_buffer_capacity_conflict
        resource: "Resort unit inventory — each unit_size has units_per_size physical units, each occupied for STAY_NIGHTS + TURNOVER_BUFFER_NIGHTS = 8 nights per deposit"
        why_hard: >-
          Occupancy intervals are HALF-OPEN — [check_in, check_in + 8) — the exact opposite of the
          closed season-band intervals in the sibling instance, so the same codebase must implement
          both conventions. With units_per_size 1 a second ONE_BR week starting on the 7th night
          collides only because of the turnover buffer: 2027-03-08 is night 7 of the interval that
          began 2027-03-01 and would be legal under a bare 7-night stay. Starting one day later at
          2027-03-09 is exactly the first free night and must be accepted. Capacity is also scoped per
          unit_size, so a TWO_BR week may start on the very date the ONE_BR was refused.
        test_recipe:
          setup: >-
            Resort B "Coral Bay Villas" with units_per_size 1, demand_index 5, SILVER_CROWN and a
            PLATINUM band 01-01..06-30, affiliated at the default clock 2026-08-01. Member M1 on PLUS,
            dues-paid through 2030-12-31. Four banking attempts follow, all at the same resort and all
            inside the PLATINUM band.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Coral Bay Villas", region_code: "MX-QR", required_annual_deposit_units: 1, initial_quality_rating: "SILVER_CROWN", units_per_size: 1, demand_index: 5 }
              captures: { resort_b: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_b}", band_code: "PLATINUM", start_month_day: "01-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_b}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
          trigger:
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_b}", unit_size: "ONE_BR", check_in_date: "2027-03-01" }
              captures: { d1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_b}", unit_size: "ONE_BR", check_in_date: "2027-03-08" }
              captures: { err_conflict: "$.data.error_id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_b}", unit_size: "ONE_BR", check_in_date: "2027-03-09" }
              captures: { d3: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_b}", unit_size: "TWO_BR", check_in_date: "2027-03-08" }
              captures: { d4: "$.data.id" }
          assert:
            - "attempt 1 — HTTP 201 and GET /exchange-network/deposits/${d1} has awarded_power == 92 (45 * 1.50 * 1.20 = 81.0 -> 81, +3 = 84, lead 212 -> factor 1.10, 92.4 -> 92) and occupies [2027-03-01, 2027-03-09)"
            - "attempt 2, check-in on night 7 of the first interval — HTTP 409 with error_id ERR_UNIT_INVENTORY_CONFLICT; the turnover buffer, not the stay itself, causes the collision"
            - "attempt 3, check-in on the first free night — HTTP 201 and GET /exchange-network/deposits/${d3} has awarded_power == 92 (same 84 subtotal, lead 220 -> factor 1.10, 92.4 -> 92)"
            - "attempt 4, same refused date but a different unit_size — HTTP 201 and GET /exchange-network/deposits/${d4} has awarded_power == 122 (60 * 1.50 * 1.20 = 108.0 -> 108, +3 = 111, lead 219 -> factor 1.10, 122.1 -> 122); capacity is scoped per unit_size"
            - "GET /exchange-network/deposits?resort_id=${resort_b} — total_count == 3 (attempt 2 wrote nothing)"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 306 (92 + 92 + 122)"
            - "GET /exchange-network/resorts/${resort_b} — deposits_committed_count == 3 and committed_nights == 24"

  # ===========================================================================
  - rule_id: compensating_invariant
    rule_summary: >-
      A forward operation and its compensating reversal must return a conserved
      quantity to its exact prior value, with the append-only ledger summing to
      the same total rather than being rewritten.
    instances:

      - name: deposit_then_withdraw_conserves_trading_power
        invariant: "INV_POWER — Member.trading_power_balance equals the sum of power_delta over that member's LedgerEntry rows, and withdrawing every deposit returns the balance to 0"
        why_hard: >-
          Three deposits of different unit sizes and lead times credit 271 points in total, and each
          withdrawal must debit back exactly the number that deposit credited — not a recomputed
          value at the withdrawal instant, which would differ because the lead time has changed. The
          resort's derived committed_nights and deposits_committed_count must unwind to 0 in step with
          the withdrawals, and the ledger must gain a reversing row for each withdrawal rather than
          deleting the original credit.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, GOLD_CROWN and a GOLD band
            04-01..06-30, affiliated at the default clock 2026-08-01. Member M1 on PLUS, dues-paid
            through 2030-12-31, wallet 80100. M1 banks three weeks whose occupancy intervals do not
            collide: ONE_BR 2027-06-15 (82), ONE_BR 2027-06-25 (82) and TWO_BR 2027-05-10 (107). All
            three are BANKED and unreserved, so all three are withdrawable.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_a: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-25" }
              captures: { dep_b: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_c: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/deposits/${dep_a}/withdrawal"
              as: Member
              as_user_id: "${m1}"
              payload: {}
            - call: "POST /exchange-network/deposits/${dep_b}/withdrawal"
              as: Member
              as_user_id: "${m1}"
              payload: {}
            - call: "POST /exchange-network/deposits/${dep_c}/withdrawal"
              as: Member
              as_user_id: "${m1}"
              payload: {}
          assert:
            - "before the withdrawals, GET /exchange-network/members/${m1} — trading_power_balance == 271 (82 + 82 + 107) and GET /exchange-network/resorts/${resort_a} has deposits_committed_count == 3 and committed_nights == 24"
            - "after all three withdrawals, GET /exchange-network/members/${m1} — trading_power_balance == 0, exactly the pre-deposit value"
            - "each of GET /exchange-network/deposits/${dep_a}, ${dep_b}, ${dep_c} — deposit_status == \"WITHDRAWN\", awarded_power still 82, 82 and 107 respectively (the frozen award is never rewritten), remaining_power == 0"
            - "GET /exchange-network/ledger-entries?member_id=${m1} — total_count == 7: one DUES_PAYMENT, three DEPOSIT_CREDIT rows with power_delta +82, +82, +107, and three DEPOSIT_WITHDRAWAL_REVERSAL rows with power_delta -82, -82, -107; no row was deleted or edited"
            - "INV_POWER — the sum of power_delta across those 7 rows is 0 and equals trading_power_balance"
            - "GET /exchange-network/resorts/${resort_a} — deposits_committed_count == 0 and committed_nights == 0; INV_NIGHTS holds because no BANKED, RESERVED or USED deposit remains"
            - "GET /exchange-network/members/${m1} — wallet_credit_cents == 80100, untouched: withdrawing an unreserved deposit carries no fee"

      - name: request_create_then_cancel_conserves_wallet_cash
        invariant: "INV_CASH — Member.wallet_credit_cents equals the sum of cash_delta_cents over that member's LedgerEntry rows, and cancelling an unmatched request returns the wallet to its pre-request value"
        why_hard: >-
          The exchange charge of 23060 is assembled from four parts — a 20900 base fee, a 0 shortfall,
          a 2340 deposit-first credit and a 2000 processing fee — and the refund must return the
          single net figure, not the base fee alone and not the subtotal before the credit. The
          funding deposit must also come back to BANKED with its full 107 remaining_power, and
          active_request_count must return to 0 so the tier's max_active_requests cap is not
          permanently consumed by cancelled requests.
        test_recipe:
          setup: >-
            Tier PLUS with max_active_requests 3. Resort A (units_per_size 2, demand_index 4,
            GOLD_CROWN, GOLD band 04-01..06-30) affiliated at the default clock. Member M2 on PLUS
            pays dues of 100000 against annual_dues_cents 19900, leaving wallet 80100. M2 banks a
            TWO_BR week for 2027-05-10 worth 107 and funds a DEPOSIT_FIRST ONE_BR request over
            2027-06-01..2027-06-30 with it. No matching deposit exists at the requested unit size, so
            no run is executed and the request stays unmatched and cancellable.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
          trigger:
            - call: "POST /exchange-network/exchange-requests/${req}/cancellation"
              as: Member
              as_user_id: "${m2}"
              payload: {}
          assert:
            - "before the cancellation, GET /exchange-network/exchange-requests/${req} — funding_mode == \"DEPOSIT_FIRST\", power_budget == 117 (107 * 110 / 100 = 117.7 floored), required_power_estimate == 82, quoted_charge_cents == 23060 (subtotal 20900 base fee + 0 shortfall since the budget covers the estimate + 2500 priority surcharge = 23400; deposit-first credit 10 percent of 23400 = 2340; processing fee 2000; 23400 - 2340 + 2000 = 23060), status == \"SUBMITTED\""
            - "before the cancellation, GET /exchange-network/members/${m2} — wallet_credit_cents == 57040 (80100 - 23060) and active_request_count == 1 and trading_power_balance == 107"
            - "before the cancellation, GET /exchange-network/ledger-entries?member_id=${m2} — total_count == 3: DUES_PAYMENT with cash_delta_cents +80100, DEPOSIT_CREDIT with power_delta +107 and cash_delta_cents 0, EXCHANGE_CHARGE with cash_delta_cents -23060"
            - "after the cancellation, GET /exchange-network/members/${m2} — wallet_credit_cents == 80100, exactly the pre-request value"
            - "after the cancellation, GET /exchange-network/exchange-requests/${req} — status == \"CANCELLED\", charge_refunded_cents == 23060, quoted_charge_cents still 23060"
            - "after the cancellation, GET /exchange-network/deposits/${dep_m2} — deposit_status == \"BANKED\" and remaining_power == 107 (the funding reservation is released)"
            - "after the cancellation, GET /exchange-network/ledger-entries?member_id=${m2} — total_count == 4 with a fourth EXCHANGE_CHARGE_REFUND row carrying cash_delta_cents +23060"
            - "INV_CASH — the sum of cash_delta_cents across those 4 rows is 80100 and equals wallet_credit_cents"
            - "GET /exchange-network/members/${m2} — active_request_count == 0, so the max_active_requests cap of 3 is fully available again"
