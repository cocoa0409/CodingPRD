        distinguishing_aspect: |
          Priorities 17 (ERR_INJECTION_INTERVAL_VIOLATION) and 18
          (ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED) share the same HTTP status 409, so the
          only observable difference is the error_id. Both are violated by the 20:00
