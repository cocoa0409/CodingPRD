scaffold_difficulty_design:

  # ─────────────────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: aptc_estimated_vs_reconciled_settlement
        grounds:
          - calculations.aptc_reconciliation
          - calculations.max_aptc
          - entities.ReconciliationRecord.fields.settlement_cents
          - entities.Enrollment.fields.applied_aptc_monthly_cents
        distinguishing_aspect: |
          On the income-subsidy ledger domain: the ESTIMATED variant rolls up applied_aptc_monthly_cents
          (45000) * 12 = 540000 advanced; the RECONCILED variant recomputes allowed APTC from realized MAGI
          33000 -> 507600; settlement_cents = 32400 (household repayment). Same household, different result.
        test_recipe:
          setup:
            - "Household hh1 (size 1, rating_area RA01, coverage_year 2026), PRIMARY member annual_income_cents=3000000 -> fpl_percent 200.00."
            - "Benchmark SILVER plan in RA01/2026 gross_premium_cents=50000, is_slcsp_benchmark=true."
            - "Application determined -> max_aptc_monthly_cents=45000; enrolled electing 45000 -> applied 45000."
            - "Year-end reconciliation reports actual_annual_magi_cents=3300000 over 12 months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Pat Primary", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "app-1"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-1"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-1"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
              captures: { det_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-1"
              captures: { hh_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "app-1"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /reconciliations"
              payload: { enrollment_id: "${enr_id}", actual_annual_magi_cents: 3300000, months_enrolled: 12 }
              as: MarketplaceAdmin
              captures: { rec_id: $.data.id }
          assert:
            - "ReconciliationRecord.${rec_id}.advanced_aptc_total_cents == 540000"
            - "ReconciliationRecord.${rec_id}.allowed_aptc_total_cents == 507600"
            - "ReconciliationRecord.${rec_id}.settlement_cents == 32400"

      - name: effective_date_retroactive_vs_prospective_first_month
        grounds:
          - calculations.effective_date
          - calculations.first_month_proration
          - entities.Enrollment.fields.effective_date
          - entities.Enrollment.fields.first_month_premium_cents
          - state_machines.Enrollment.DETERMINED_to_ENROLLED
        distinguishing_aspect: |
          On the coverage-effective-date / billing domain (a different entity domain than the subsidy
          reconciliation): a BIRTH SEP yields retroactive effective_date 2026-06-16 with prorated
          first_month_premium_cents=2500 (15 of 30 days at net 5000), whereas the prospective rule
          (OEP / MARRIAGE) would yield effective 2026-07-01 and first_month_premium_cents=5000 (full month).
        test_recipe:
          setup:
            - "Household hh2 (size 1, RA01, 2026), PRIMARY income 3000000 -> max_aptc 45000."
            - "SEP application with an APPROVED BIRTH SepRequest, event_date 2026-06-16; submitted 2026-06-20."
            - "Silver plan gross 50000, elected APTC 45000 -> net 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-2"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Sam Solo", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-2"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "SEP" }
              as: Applicant
              as_user_id: "app-2"
              captures: { app_id: $.data.id }
            - call: "POST /sep-requests"
              payload: { application_id: "${app_id}", qualifying_event_type: "BIRTH", event_date: "2026-06-16" }
              as: Applicant
              as_user_id: "app-2"
              captures: { sep_id: $.data.id }
            - call: "POST /sep-requests/${sep_id}/approve"
              as: MarketplaceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-2"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-2"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
          trigger:
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-2"
              captures: { hh_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "app-2"
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.effective_date == '2026-06-16'"
            - "Enrollment.${enr_id}.net_premium_monthly_cents == 5000"
            - "Enrollment.${enr_id}.first_month_premium_cents == 2500"

  # ─────────────────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: household_magi_conditional_dependent_exclusion
        grounds:
          - calculations.household_magi
          - calculations.fpl_percent
          - entities.HouseholdMember.fields.is_countable_income
          - entities.Household.fields.household_magi_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with a conditional branch on member state. MAGI sums member incomes but
          EXCLUDES a DEPENDENT_NONFILER whose income (300000) is below FILING_THRESHOLD_CENTS (1460000);
          with PRIMARY 2800000 + excluded dependent 300000 over countable_size 2, household_magi_cents=2800000
          and fpl_percent=137.93 (not 152.71 it would be if the dependent were counted).
        test_recipe:
          setup:
            - "Household hh3 (RA01, 2026). PRIMARY income 2800000, applies_for_coverage true."
            - "DEPENDENT_NONFILER income 300000 (< filing threshold), applies_for_coverage true -> excluded from MAGI but counts toward size."
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-3"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Primary P", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 2800000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-3"
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Dep D", relationship: "DEPENDENT", tax_filing_status: "DEPENDENT_NONFILER", annual_income_cents: 300000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-3"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-3"
              captures: { magi: $.data.household_magi_cents }
          assert:
            - "Household.${hh_id}.household_magi_cents == 2800000"
            - "Household.${hh_id}.countable_size == 2"
            - "Household.${hh_id}.fpl_percent == 137.93"
            - "HouseholdMember.${dep_id}.is_countable_income == false"

      - name: first_month_proration_round_then_sum_order
        grounds:
          - calculations.first_month_proration
          - entities.Enrollment.fields.first_month_premium_cents
          - calculations.effective_date
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The pinned order is round-after-multiplying
          daily*cov_days once (per-line-then-sum). For net 5000 over a 30-day month effective on day 16
          (cov_days 15), daily 5000/30 * 15 = 2500.00 -> first_month_premium_cents = 2500; the alternative
          interpretation (round daily to cents 167 first, *15 = 2505) is explicitly rejected by the pinned order.
        test_recipe:
          setup:
            - "Reuse a BIRTH-SEP enrollment with net_premium_monthly_cents=5000 and effective_date 2026-06-16 (June has 30 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA02", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA02" }
              as: Applicant
              as_user_id: "app-4"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Pro Rate", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-4"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "SEP" }
              as: Applicant
              as_user_id: "app-4"
              captures: { app_id: $.data.id }
            - call: "POST /sep-requests"
              payload: { application_id: "${app_id}", qualifying_event_type: "BIRTH", event_date: "2026-06-16" }
              as: Applicant
              as_user_id: "app-4"
              captures: { sep_id: $.data.id }
            - call: "POST /sep-requests/${sep_id}/approve"
              as: MarketplaceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-4"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-4"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-4"
              captures: { hh_v2: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "app-4"
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.net_premium_monthly_cents == 5000"
            - "Enrollment.${enr_id}.first_month_premium_cents == 2500"

  # ─────────────────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: application_determined_reverts_to_draft_on_reopen
        grounds:
          - state_machines.Application.DETERMINED_to_DRAFT
          - state_machines.Application.SUBMITTED_to_DETERMINED
          - entities.Application.fields.submitted_at
        distinguishing_aspect: |
          Branching-with-revert on the Application entity: DETERMINED -> DRAFT (reopen) is a backward edge,
          not a linear pipeline; it deletes the EligibilityDetermination and clears submitted_at. After
          reopen, Application.status == DRAFT and its determination list is empty.
        test_recipe:
          setup:
            - "Household hh5 (RA01,2026) with PRIMARY income 3000000; benchmark SILVER plan present."
            - "Application submitted and DETERMINED (one EligibilityDetermination exists)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-5"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Re Open", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-5"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "app-5"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-5"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-5"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
          trigger:
            - call: "POST /applications/${app_id}/reopen"
              as: Applicant
              as_user_id: "app-5"
            - call: "GET /applications/${app_id}/determination"
              as: Applicant
              as_user_id: "app-5"
          assert:
            - "Application.${app_id}.status == 'DRAFT'"
            - "Application.${app_id}.submitted_at == null"
            - "GET /applications/${app_id}/determination returns an array of length 0"

      - name: enrollment_parallel_payment_and_lifecycle_dimensions
        grounds:
          - state_machines.Enrollment.AWAITING_BINDER_to_PAID
          - state_machines.Enrollment.PENDING_EFFECTUATION_to_ACTIVE
          - entities.Enrollment.fields.lifecycle_status
          - entities.Enrollment.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on the Enrollment entity (a different entity than Application): payment_status
          (AWAITING_BINDER -> PAID) and lifecycle_status (PENDING_EFFECTUATION -> ACTIVE) evolve independently;
          paying the binder advances payment_status to PAID while lifecycle_status stays PENDING_EFFECTUATION
          until effectuate is called.
        test_recipe:
          setup:
            - "An enrollment exists (hh6, RA01, 2026), lifecycle_status PENDING_EFFECTUATION, payment_status AWAITING_BINDER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-6"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Par Allel", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-6"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "app-6"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-6"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-6"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-6"
              captures: { hh_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { application_id: "${app_id}", plan_id: "${plan_id}", elected_aptc_monthly_cents: 45000, expected_household_version: "${hh_v2}" }
              as: Applicant
              as_user_id: "app-6"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/pay-binder"
              as: Applicant
              as_user_id: "app-6"
              captures: { ps: $.data.payment_status, ls: $.data.lifecycle_status }
          assert:
            - "Enrollment.${enr_id}.payment_status == 'PAID'"
            - "Enrollment.${enr_id}.lifecycle_status == 'PENDING_EFFECTUATION'"

  # ─────────────────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: member_edit_cascades_magi_then_fpl_then_version
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - calculations.household_magi
          - calculations.fpl_percent
          - entities.Household.fields.household_magi_cents
          - entities.Household.fields.fpl_percent
          - entities.Household.fields.version
        distinguishing_aspect: |
          Depth-3 cascade originating from PATCH member: editing a member's annual_income_cents (A) mutates
          Household.household_magi_cents (B); that MAGI change itself forces Household.fpl_percent to be
          recomputed (C); and that recompute is the mutation that bumps Household.version (D). Each link is
          caused by the previous, not by the original PATCH directly. Editing income 3000000 -> 4000000
          drives household_magi_cents 3000000 -> 4000000 and fpl_percent 200.00 -> 266.67.
        test_recipe:
          setup:
            - "Household hh7 (size 1, RA01, 2026) with PRIMARY income 3000000 -> magi 3000000, fpl_percent 200.00, version V."
          setup_api_calls:
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-7"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Cas Cade", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-7"
              captures: { mem_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-7"
              captures: { hh_v_before: $.data.version }
          trigger:
            - call: "PATCH /households/${hh_id}/members/${mem_id}"
              payload: { annual_income_cents: 4000000 }
              as: Applicant
              as_user_id: "app-7"
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-7"
              captures: { hh_v_after: $.data.version }
          assert:
            - "Household.${hh_id}.household_magi_cents == 4000000"
            - "Household.${hh_id}.fpl_percent == 266.67"
            - "Household.${hh_id}.version == ${hh_v_before} + 1"

      - name: reopen_deletes_determination_and_clears_submitted_at
        grounds:
          - state_machines.Application.DETERMINED_to_DRAFT
          - entities.Application.fields.submitted_at
          - entities.EligibilityDetermination.fields.application_id
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (reopen): the reopen action (A) deletes the
          EligibilityDetermination (B); the deletion in turn clears Application.submitted_at to null (C).
          Originates from POST /applications/{id}/reopen — distinct from the member-edit cascade trigger.
        test_recipe:
          setup:
            - "Household hh8 (RA01,2026), PRIMARY income 3000000; benchmark SILVER plan present; Application DETERMINED with one determination, submitted_at set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /health-plans"
              payload: { rating_area: "RA01", coverage_year: 2026, metal_tier: "SILVER", gross_premium_cents: 50000, is_slcsp_benchmark: true }
              as: MarketplaceAdmin
            - call: "POST /households"
              payload: { coverage_year: 2026, rating_area: "RA01" }
              as: Applicant
              as_user_id: "app-8"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Det Erm", relationship: "PRIMARY", tax_filing_status: "FILER", annual_income_cents: 3000000, applies_for_coverage: true }
              as: Applicant
              as_user_id: "app-8"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", enrollment_window: "OEP" }
              as: Applicant
              as_user_id: "app-8"
              captures: { app_id: $.data.id }
            - call: "GET /households/${hh_id}"
              as: Applicant
              as_user_id: "app-8"
              captures: { hh_v: $.data.version }
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_household_version: "${hh_v}" }
              as: Applicant
              as_user_id: "app-8"
            - call: "POST /applications/${app_id}/determine"
              as: MarketplaceAdmin
          trigger:
            - call: "POST /applications/${app_id}/reopen"
              as: Applicant
              as_user_id: "app-8"
            - call: "GET /applications/${app_id}/determination"
              as: Applicant
              as_user_id: "app-8"
          assert:
            - "Application.${app_id}.status == 'DRAFT'"
            - "Application.${app_id}.submitted_at == null"
