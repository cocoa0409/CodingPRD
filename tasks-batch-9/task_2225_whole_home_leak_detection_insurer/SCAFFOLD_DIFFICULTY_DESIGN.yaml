              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /properties/${p1}/irrigation-windows"
              payload: { label: "Front zone Saturday", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z", expected_max_flow_gpm: 9.0 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { iw1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
