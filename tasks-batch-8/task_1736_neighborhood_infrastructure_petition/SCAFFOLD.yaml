# =============================================================================
# SCAFFOLD.yaml — Neighborhood Infrastructure Petition & Assessment Program
# (special assessment district program)
# =============================================================================

scenario: |
  Neighborhood Infrastructure Petition & Assessment Program (special assessment district program): petition circulation & signature verification against property owners, project scoping & preliminary cost estimate, assessment methodology (per parcel/front foot) & payment options, public hearing & objection process, council approval & construction scheduling, cost overrun & final assessment true-up, payoff/installment billing over years, project completion & acceptance

domain_name: neighborhood-infrastructure-petition
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat          # all collections top-level; FK links carried in request bodies
  state_machine_shape: cyclic    # District remand loop + petition re-circulation loop; ParcelAssessment delinquency cure loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # change-order proposer may not approve their own change order
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# All money fields are integer cents. All dates/datetimes ISO 8601 UTC.
# List endpoints order deterministically as noted; `id` is never a sort key.
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District display name" }
      - { name: methodology, type: enum, source: input, description: "Assessment allocation methodology", constraints: "PER_PARCEL | FRONT_FOOT" }
      - { name: interest_method, type: enum, source: input, description: "Delinquency interest method", constraints: "SIMPLE | COMPOUND" }
      - { name: annual_interest_rate_bp, type: integer, source: input, default: 400, description: "Installment annual interest rate in basis points", constraints: "0 <= x <= 2000" }
      - { name: season_start_mmdd, type: string, source: input, description: "Construction season start, MM-DD format, inclusive" }
      - { name: season_end_mmdd, type: string, source: input, description: "Construction season end, MM-DD format, inclusive" }
      - { name: status, type: enum, source: system, description: "DRAFT | PETITIONING | SCOPING | HEARING_SCHEDULED | OBJECTION_WINDOW | COUNCIL_REVIEW | APPROVED | CONSTRUCTION | TRUE_UP | BILLING | ACCEPTED | ABANDONED", default: DRAFT }
      - { name: remand_count, type: integer, source: computed, default: 0, description: "Number of council remands executed; hard cap MAX_REMANDS=2" }
      - { name: total_frontage_ft, type: number, source: computed, default: 0, description: "Sum of frontage_ft over parcels with status ACTIVE and exempt=false; 2 decimal places" }
      - { name: eligible_parcel_count, type: integer, source: computed, default: 0, description: "Count of parcels with status ACTIVE and exempt=false" }
      - { name: protest_frontage_pct, type: number, source: computed, description: "Frontage-weighted protest percentage (2dp, round_half_up) computed at objection-window close; null until then", default: null }
      - { name: approved_estimate_id, type: string, source: system, description: "ID of the CostEstimate locked in at hearing-creation time (nullable plain reference, not a containment FK)", default: null }
      - { name: approved_change_total_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over APPROVED change orders" }
      - { name: overrun_flag, type: boolean, source: computed, default: false, description: "true when approved_change_total_cents > round(locked contract_price_cents * 0.10) (integer-cent comparison, strictly greater)" }
      - { name: final_total_cost_cents, type: integer, source: computed, description: "Locked contract_price_cents + approved_change_total_cents; set at finalize-true-up", default: null }
      - { name: levy_date, type: datetime, source: system, description: "Timestamp of council approval (assessments LEVIED)", default: null }
      - { name: payment_option_deadline, type: datetime, source: system, description: "levy_date + 30 days; payment options accepted while now <= deadline", default: null }
      - { name: paid_assessment_count, type: integer, source: computed, default: 0, description: "Count of ParcelAssessments in PAID_OFF" }
      - { name: total_assessment_count, type: integer, source: computed, default: 0, description: "Count of ParcelAssessments not in REMOVED or SUPERSEDED" }
      - { name: all_assessments_paid, type: boolean, source: computed, default: false, description: "true when total_assessment_count > 0 and paid_assessment_count == total_assessment_count" }

  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner full legal name" }
      - { name: email, type: string, source: input, description: "Owner email; globally unique (ERR_DUPLICATE_OWNER_EMAIL)" }
      - { name: mailing_address, type: string, source: input, description: "Mailing address for notices and bills" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; parcel may only be created while district is DRAFT" }
      - { name: owner_id, type: string, source: input, description: "FK -> PropertyOwner.id; owner of record" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; unique within district (ERR_DUPLICATE_PARCEL_NUMBER)" }
      - { name: frontage_ft, type: number, source: input, description: "Assessed frontage in feet, 2 decimal places, must be > 0" }
      - { name: exempt, type: boolean, source: input, default: false, description: "Exempt parcels cannot sign petitions, are excluded from eligibility denominators, and receive no assessment" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REMOVED (removed by a sustained objection)" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; one petition per district circulation cycle" }
      - { name: status, type: enum, source: system, default: CIRCULATING, description: "CIRCULATING | CLOSED_VERIFIED | CLOSED_INSUFFICIENT | VOIDED" }
      - { name: opened_at, type: datetime, source: system, description: "Server clock timestamp at creation" }
      - { name: closed_at, type: datetime, source: system, description: "Server clock timestamp at close", default: null }
      - { name: verified_signature_count, type: integer, source: computed, default: 0, description: "Count of VERIFIED signatures (decremented on withdrawal)" }
      - { name: verified_frontage_ft, type: number, source: computed, default: 0, description: "Sum of frontage_ft of parcels holding a VERIFIED signature" }
      - { name: eligible_parcel_count_snapshot, type: integer, source: computed, description: "District eligible_parcel_count captured at close", default: null }
      - { name: eligible_frontage_snapshot, type: number, source: computed, description: "District total_frontage_ft captured at close", default: null }
      - { name: support_count_pct, type: number, source: computed, description: "round(verified_signature_count / eligible_parcel_count_snapshot * 100, 2) half-up at close", default: null }
      - { name: support_frontage_pct, type: number, source: computed, description: "round(verified_frontage_ft / eligible_frontage_snapshot * 100, 2) half-up at close", default: null }

  - name: PetitionSignature
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: owner_id, type: string, source: system, description: "FK -> PropertyOwner.id; set from X-User-ID of the signing owner" }
      - { name: signed_at, type: datetime, source: system, description: "Server clock timestamp at submission" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VERIFIED | REJECTED | WITHDRAWN | VOIDED" }
      - { name: rejection_reason, type: string, source: input, description: "Clerk-supplied reason when rejected", default: null }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying clerk", default: null }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Verification timestamp" }
      - { name: withdrawn_at, type: datetime, source: system, default: null, description: "Withdrawal timestamp" }

  - name: CostEstimate
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: estimate_seq, type: integer, source: system, description: "Per-district sequence starting at 1, assigned in created_at order" }
      - { name: contract_price_cents, type: integer, source: input, description: "Engineer contract price; must be > 0" }
      - { name: contingency_cents, type: integer, source: input, description: "Contingency allowance; must be >= 0" }
      - { name: total_estimated_cost_cents, type: integer, source: computed, description: "= contract_price_cents + contingency_cents" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | SUPERSEDED" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of submitting engineer" }

  - name: PublicHearing
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: hearing_date, type: datetime, source: input, description: "Scheduled hearing instant; must be >= now + 10 days at creation" }
      - { name: venue, type: string, source: input, description: "Venue name; same venue may not host two non-terminal hearings on the same UTC calendar date" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | HELD | CLOSED | SUPERSEDED | VOIDED" }
      - { name: objection_window_end, type: datetime, source: computed, description: "= hearing_date + 15 days; objections accepted while now <= objection_window_end", default: null }

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; denormalized from the hearing's district" }
      - { name: hearing_id, type: string, source: input, description: "FK -> PublicHearing.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: owner_id, type: string, source: system, description: "FK -> PropertyOwner.id; set from X-User-ID of filing owner" }
      - { name: grounds, type: string, source: input, description: "Free-text grounds for the objection" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | SUSTAINED | OVERRULED | WITHDRAWN" }
      - { name: filed_at, type: datetime, source: system, description: "Server clock timestamp at filing" }
      - { name: reviewed_by, type: string, source: system, default: null, description: "Clerk X-User-ID at start-review" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Timestamp of sustain/overrule" }

  - name: CouncilResolution
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: motion, type: enum, source: input, description: "APPROVE | REJECT | REMAND" }
      - { name: votes_for, type: integer, source: input, description: "Votes in favor, 0..5" }
      - { name: votes_against, type: integer, source: input, description: "Votes against, 0..5; votes_for + votes_against <= 5" }
      - { name: outcome, type: enum, source: computed, description: "ADOPTED | FAILED per threshold rules (see calculations.council_vote_outcome)" }
      - { name: protest_pct_snapshot, type: number, source: computed, description: "District protest_frontage_pct captured at recording" }
      - { name: required_votes_snapshot, type: integer, source: computed, description: "3 (simple majority) or 4 (supermajority) as required at recording" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the CouncilPresident recording the resolution" }

  - name: ParcelAssessment
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id" }
      - { name: parcel_id, type: string, source: system, description: "FK -> Parcel.id" }
      - { name: preliminary_amount_cents, type: integer, source: computed, description: "Preliminary levy allocated at hearing creation; recomputed on objection-sustain reallocation" }
      - { name: final_levy_cents, type: integer, source: computed, description: "Final levy computed at finalize-true-up; null until then", default: null }
      - { name: payment_option, type: enum, source: system, default: NONE, description: "NONE | PREPAY_FULL | INSTALLMENTS" }
      - { name: term_years, type: integer, source: input, description: "Installment term: 5 or 10; required when option=INSTALLMENTS; null otherwise", default: null }
      - { name: principal_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding principal (final levy less principal paid); prepayment reduces it" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of all payment amount_cents applied to this assessment" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Refundable credit created at true-up when final levy < amount already paid" }
      - { name: total_refunded_cents, type: integer, source: computed, default: 0, description: "Sum of refunds paid out against credit_balance_cents" }
      - { name: status, type: enum, source: system, default: PRELIMINARY, description: "PRELIMINARY | SUPERSEDED | LEVIED | PREPAID | SETTLEMENT_DUE | IN_REPAYMENT | DELINQUENT | PAID_OFF | REMOVED" }
      - { name: option_selected_at, type: datetime, source: system, default: null, description: "Timestamp of payment-option selection" }

  - name: ConstructionPhase
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: name, type: string, source: input, description: "Phase name" }
      - { name: crew_name, type: string, source: input, description: "Crew identifier; same-crew phases require a >= 5 calendar-day gap" }
      - { name: start_date, type: string, source: input, description: "Start date YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "End date YYYY-MM-DD, inclusive; must be >= start_date" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated cost of the phase; must be > 0" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Actual start timestamp" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Actual completion timestamp" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: phase_id, type: string, source: input, description: "FK -> ConstructionPhase.id; optional link to the phase the overrun belongs to", default: null }
      - { name: description, type: string, source: input, description: "Scope-change description" }
      - { name: amount_cents, type: integer, source: input, description: "Cost increase; must be > 0" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | REJECTED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposing engineer (segregation of duties anchor)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving/rejecting engineer" }

  - name: InstallmentInvoice
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; denormalized from the assessment" }
      - { name: parcel_assessment_id, type: string, source: system, description: "FK -> ParcelAssessment.id" }
      - { name: kind, type: enum, source: system, description: "ANNUAL (amortization schedule) | SUPPLEMENTAL (true-up delta on prepaid assessment)" }
      - { name: year_index, type: integer, source: system, description: "1..term_years for ANNUAL; 0 for SUPPLEMENTAL" }
      - { name: issue_date, type: datetime, source: system, description: "ANNUAL: due_date - 30 days; SUPPLEMENTAL: true-up timestamp" }
      - { name: due_date, type: datetime, source: system, description: "ANNUAL: true-up timestamp + year_index * 365 days; SUPPLEMENTAL: true-up timestamp + 30 days" }
      - { name: principal_cents, type: integer, source: computed, description: "Scheduled principal component" }
      - { name: interest_cents, type: integer, source: computed, description: "Scheduled interest component (0 for SUPPLEMENTAL)" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Accrued delinquency penalty; recomputed idempotently at each billing run" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Total applied against this invoice (penalty + interest + principal)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ISSUED | PARTIALLY_PAID | PAID | DELINQUENT | VOIDED" }

  - name: Payment
    parent: null
    common_fields: false   # append-only event: id + created_at only, no version/updated_at
    fields:
      - { name: parcel_assessment_id, type: string, source: input, description: "FK -> ParcelAssessment.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; must be > 0 and <= payoff quote at receipt time" }
      - { name: method, type: enum, source: input, description: "CHECK | ACH | CARD" }
      - { name: received_at, type: datetime, source: system, description: "Server clock timestamp at posting" }
      - { name: applied_penalty_cents, type: integer, source: computed, description: "Portion applied to delinquency penalties (waterfall step 1)" }
      - { name: applied_interest_cents, type: integer, source: computed, description: "Portion applied to billed then unbilled accrued interest (waterfall steps 2 and 4)" }
      - { name: applied_principal_cents, type: integer, source: computed, description: "Portion applied to principal (waterfall steps 3 and 5)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: District
    initial_state: DRAFT
    terminal_states: [ACCEPTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: PETITIONING
        trigger: "POST /petitions"
        actor: CityClerk
        preconditions:
          - "district.status == DRAFT (ERR_DISTRICT_NOT_DRAFT)"
        side_effects:
          - "creates Petition(status=CIRCULATING, opened_at=now)"
          - "increments District.version by 1"
      - from: PETITIONING
        to: SCOPING
        trigger: "POST /petitions/{id}/close with support thresholds met"
        actor: CityClerk
        preconditions:
          - "petition.support_count_pct >= 60.00 AND petition.support_frontage_pct >= 50.00"
        side_effects:
          - "Petition -> CLOSED_VERIFIED; snapshots and percentages frozen"
          - "increments District.version by 1"
      - from: PETITIONING
        to: DRAFT
        trigger: "POST /petitions/{id}/close with support thresholds NOT met (re-circulation loop)"
        actor: CityClerk
        preconditions:
          - "support_count_pct < 60.00 OR support_frontage_pct < 50.00"
        side_effects:
          - "Petition -> CLOSED_INSUFFICIENT; snapshots and percentages frozen"
          - "district returns to DRAFT so a fresh petition may be opened"
          - "increments District.version by 1"
      - from: SCOPING
        to: HEARING_SCHEDULED
        trigger: "POST /hearings"
        actor: CityClerk
        preconditions:
          - "district.status == SCOPING (ERR_DISTRICT_NOT_IN_SCOPING)"
          - "an APPROVED CostEstimate exists for the district (ERR_NO_APPROVED_ESTIMATE)"
          - "hearing_date >= now + 10 days (ERR_HEARING_NOTICE_TOO_SHORT)"
          - "no other non-terminal hearing in the same venue on the same UTC calendar date (ERR_VENUE_DATE_CONFLICT)"
        side_effects:
          - "locks district.approved_estimate_id to the currently APPROVED estimate"
          - "runs calculations.preliminary_assessment_allocation: creates one ParcelAssessment(PRELIMINARY) per ACTIVE non-exempt parcel"
          - "creates PublicHearing(SCHEDULED, objection_window_end = hearing_date + 15 days)"
          - "increments District.version by 1"
      - from: HEARING_SCHEDULED
        to: OBJECTION_WINDOW
        trigger: "POST /hearings/{id}/record-held"
        actor: CityClerk
        preconditions:
          - "hearing.status == SCHEDULED (ERR_HEARING_NOT_SCHEDULED)"
          - "now >= hearing.hearing_date (ERR_HEARING_DATE_NOT_REACHED)"
        side_effects:
          - "PublicHearing -> HELD"
          - "increments District.version by 1"
      - from: OBJECTION_WINDOW
        to: COUNCIL_REVIEW
        trigger: "POST /districts/{id}/close-objection-window"
        actor: CityClerk
        preconditions:
          - "district.status == OBJECTION_WINDOW (ERR_DISTRICT_NOT_IN_OBJECTION_WINDOW)"
          - "now > hearing.objection_window_end (ERR_OBJECTION_WINDOW_STILL_OPEN)"
          - "no objection of this district is in FILED or UNDER_REVIEW (ERR_UNRESOLVED_OBJECTIONS)"
        side_effects:
          - "runs calculations.protest_weight_calculation; stores district.protest_frontage_pct"
          - "PublicHearing -> CLOSED"
          - "increments District.version by 1"
      - from: COUNCIL_REVIEW
        to: APPROVED
        trigger: "POST /resolutions with motion=APPROVE and outcome=ADOPTED"
        actor: CouncilPresident
        preconditions:
          - "district.status == COUNCIL_REVIEW (ERR_DISTRICT_NOT_IN_COUNCIL_REVIEW)"
          - "OCC: expected_district_version matches (ERR_STALE_VERSION)"
          - "vote rule: (protest < 50.00 AND votes_for >= 3) OR (protest >= 50.00 AND votes_for >= 4)"
        side_effects:
          - "creates CouncilResolution(outcome=ADOPTED)"
          - "all PRELIMINARY ParcelAssessments -> LEVIED; levy_date = now; payment_option_deadline = now + 30 days"
          - "increments District.version by 1"
      - from: COUNCIL_REVIEW
        to: ABANDONED
        trigger: "POST /resolutions with motion=APPROVE and outcome=FAILED, or motion=REJECT and outcome=ADOPTED"
        actor: CouncilPresident
        preconditions:
          - "district.status == COUNCIL_REVIEW (ERR_DISTRICT_NOT_IN_COUNCIL_REVIEW)"
          - "OCC: expected_district_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "creates CouncilResolution with computed outcome"
          - "all PRELIMINARY ParcelAssessments -> SUPERSEDED; PublicHearing -> VOIDED"
          - "increments District.version by 1"
      - from: COUNCIL_REVIEW
        to: SCOPING
        trigger: "POST /resolutions with motion=REMAND and outcome=ADOPTED (remand loop)"
        actor: CouncilPresident
        preconditions:
          - "district.status == COUNCIL_REVIEW (ERR_DISTRICT_NOT_IN_COUNCIL_REVIEW)"
          - "OCC: expected_district_version matches (ERR_STALE_VERSION)"
          - "votes_for >= 3"
          - "district.remand_count < 2 (ERR_REMAND_LIMIT_EXCEEDED)"
        side_effects:
          - "district.remand_count += 1"
          - "current PublicHearing(CLOSED) -> SUPERSEDED"
          - "all PRELIMINARY ParcelAssessments -> SUPERSEDED"
          - "currently APPROVED CostEstimate -> SUPERSEDED; district.approved_estimate_id -> null"
          - "increments District.version by 1"
      - from: APPROVED
        to: CONSTRUCTION
        trigger: "POST /construction-phases/{id}/start (first phase start)"
        actor: CityEngineer
        preconditions: []
        side_effects:
          - "increments District.version by 1"
      - from: CONSTRUCTION
        to: TRUE_UP
        trigger: "POST /districts/{id}/complete-construction"
        actor: CityEngineer
        preconditions:
          - "district.status == CONSTRUCTION (ERR_DISTRICT_NOT_IN_CONSTRUCTION)"
          - "at least one ConstructionPhase exists and every phase is in COMPLETED or CANCELLED with >= 1 COMPLETED (ERR_PHASES_NOT_ALL_COMPLETE)"
        side_effects:
          - "increments District.version by 1"
      - from: TRUE_UP
        to: BILLING
        trigger: "POST /districts/{id}/finalize-true-up"
        actor: FinanceOfficer
        preconditions:
          - "district.status == TRUE_UP (ERR_DISTRICT_NOT_IN_TRUE_UP)"
        side_effects:
          - "district.final_total_cost_cents = locked contract_price_cents + approved_change_total_cents (contingency excluded)"
          - "runs calculations.final_levy_allocation over ACTIVE non-exempt parcels; sets final_levy_cents on each LEVIED/PREPAID assessment"
          - "LEVIED assessments with payment_option == NONE are defaulted to INSTALLMENTS, term_years = 10"
          - "PREPAID: delta = final_levy - preliminary_amount; delta > 0 -> SETTLEMENT_DUE + SUPPLEMENTAL invoice ISSUED for delta; delta <= 0 -> PAID_OFF with credit_balance_cents = -delta when delta < 0"
          - "INSTALLMENTS: runs calculations.installment_amortization_schedule; creates term_years ANNUAL invoices (SCHEDULED); status -> IN_REPAYMENT; principal_balance_cents = final_levy_cents"
          - "increments District.version by 1"
      - from: BILLING
        to: ACCEPTED
        trigger: "POST /districts/{id}/accept"
        actor: CouncilPresident
        preconditions:
          - "district.status == BILLING (ERR_DISTRICT_NOT_ACCEPTABLE)"
          - "district.all_assessments_paid == true (ERR_ASSESSMENTS_NOT_ALL_PAID)"
        side_effects:
          - "increments District.version by 1"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /districts/{id}/abandon"
        actor: CityClerk
        preconditions: []
        side_effects: ["increments District.version by 1"]
      - from: PETITIONING
        to: ABANDONED
        trigger: "POST /districts/{id}/abandon"
        actor: CityClerk
        preconditions: []
        side_effects:
          - "CIRCULATING petition -> VOIDED; its SUBMITTED/VERIFIED signatures -> VOIDED"
          - "increments District.version by 1"
      - from: SCOPING
        to: ABANDONED
        trigger: "POST /districts/{id}/abandon"
        actor: CityClerk
        preconditions: []
        side_effects:
          - "SUBMITTED/APPROVED estimates -> SUPERSEDED"
          - "increments District.version by 1"
      - from: HEARING_SCHEDULED
        to: ABANDONED
        trigger: "POST /districts/{id}/abandon"
        actor: CityClerk
        preconditions: []
        side_effects:
          - "SCHEDULED hearing -> VOIDED; PRELIMINARY assessments -> SUPERSEDED"
          - "increments District.version by 1"
      - from: OBJECTION_WINDOW
        to: ABANDONED
        trigger: "POST /districts/{id}/abandon"
        actor: CityClerk
        preconditions:
          - "abandon requires status in {DRAFT, PETITIONING, SCOPING, HEARING_SCHEDULED, OBJECTION_WINDOW}; from any other status -> ERR_DISTRICT_NOT_ABANDONABLE"
        side_effects:
          - "HELD hearing -> VOIDED; PRELIMINARY assessments -> SUPERSEDED; FILED/UNDER_REVIEW objections -> WITHDRAWN"
          - "increments District.version by 1"

  - entity: Petition
    initial_state: CIRCULATING
    terminal_states: [CLOSED_VERIFIED, CLOSED_INSUFFICIENT, VOIDED]
    transitions:
      - from: CIRCULATING
        to: CLOSED_VERIFIED
        trigger: "POST /petitions/{id}/close"
        actor: CityClerk
        preconditions:
          - "petition.status == CIRCULATING (ERR_PETITION_NOT_CIRCULATING)"
          - "support thresholds met (see calculations.petition_support)"
        side_effects:
          - "snapshots eligible counts/frontage; computes support_count_pct and support_frontage_pct"
          - "district PETITIONING -> SCOPING"
      - from: CIRCULATING
        to: CLOSED_INSUFFICIENT
        trigger: "POST /petitions/{id}/close"
        actor: CityClerk
        preconditions:
          - "petition.status == CIRCULATING (ERR_PETITION_NOT_CIRCULATING)"
          - "support thresholds NOT met"
        side_effects:
          - "snapshots eligible counts/frontage; computes support percentages"
          - "district PETITIONING -> DRAFT"
      - from: CIRCULATING
        to: VOIDED
        trigger: "system (district abandon cascade)"
        actor: system
        preconditions: []
        side_effects: ["SUBMITTED/VERIFIED signatures -> VOIDED"]

  - entity: PetitionSignature
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, VOIDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /signatures/{id}/verify"
        actor: CityClerk
        preconditions:
          - "signature.status == SUBMITTED (ERR_SIGNATURE_NOT_VERIFIABLE)"
          - "petition.status == CIRCULATING (ERR_PETITION_NOT_CIRCULATING)"
          - "parcel.status == ACTIVE and parcel.exempt == false (ERR_INELIGIBLE_PARCEL)"
          - "signature.owner_id == parcel.owner_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "petition.verified_signature_count += 1; petition.verified_frontage_ft += parcel.frontage_ft"
          - "sets verified_by (clerk X-User-ID) and verified_at"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /signatures/{id}/reject"
        actor: CityClerk
        preconditions:
          - "signature.status == SUBMITTED (ERR_SIGNATURE_NOT_VERIFIABLE)"
          - "petition.status == CIRCULATING (ERR_PETITION_NOT_CIRCULATING)"
        side_effects: ["sets rejection_reason"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /signatures/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "acting owner is signature.owner_id (ERR_NOT_RESOURCE_OWNER)"
          - "petition.status == CIRCULATING (ERR_SIGNATURE_NOT_WITHDRAWABLE)"
        side_effects: ["sets withdrawn_at"]
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /signatures/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "acting owner is signature.owner_id (ERR_NOT_RESOURCE_OWNER)"
          - "petition.status == CIRCULATING (ERR_SIGNATURE_NOT_WITHDRAWABLE)"
        side_effects:
          - "petition.verified_signature_count -= 1; petition.verified_frontage_ft -= parcel.frontage_ft (tally conservation)"
          - "sets withdrawn_at"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system (district abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: VOIDED
        trigger: "system (district abandon cascade)"
        actor: system
        preconditions: []
        side_effects: ["petition tallies decremented (petition itself VOIDED)"]

  - entity: CostEstimate
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cost-estimates/{id}/approve"
        actor: CityEngineer
        preconditions:
          - "estimate.status == SUBMITTED (ERR_ESTIMATE_NOT_SUBMITTED)"
          - "district.status == SCOPING (ERR_DISTRICT_NOT_IN_SCOPING)"
        side_effects:
          - "any other APPROVED estimate of the district -> SUPERSEDED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer estimate is created, or district remand/abandon)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another estimate approved, or district remand/abandon)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PublicHearing
    initial_state: SCHEDULED
    terminal_states: [CLOSED, SUPERSEDED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/record-held"
        actor: CityClerk
        preconditions:
          - "hearing.status == SCHEDULED (ERR_HEARING_NOT_SCHEDULED)"
          - "now >= hearing_date (ERR_HEARING_DATE_NOT_REACHED)"
        side_effects: ["district HEARING_SCHEDULED -> OBJECTION_WINDOW"]
      - from: HELD
        to: CLOSED
        trigger: "POST /districts/{id}/close-objection-window"
        actor: CityClerk
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: SUPERSEDED
        trigger: "system (council remand)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: VOIDED
        trigger: "system (district abandon)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD
        to: VOIDED
        trigger: "system (district abandon)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Objection
    initial_state: FILED
    terminal_states: [SUSTAINED, OVERRULED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /objections/{id}/start-review"
        actor: CityClerk
        preconditions:
          - "objection.status == FILED (ERR_OBJECTION_NOT_FILED)"
        side_effects: ["sets reviewed_by"]
      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /objections/{id}/sustain"
        actor: CityClerk
        preconditions:
          - "objection.status == UNDER_REVIEW (ERR_OBJECTION_NOT_UNDER_REVIEW)"
          - "district.status == OBJECTION_WINDOW (ERR_DISTRICT_NOT_IN_OBJECTION_WINDOW)"
        side_effects:
          - "CASCADE hop 1: parcel -> REMOVED"
          - "CASCADE hop 2: the parcel's PRELIMINARY ParcelAssessment -> REMOVED"
          - "CASCADE hop 3: calculations.preliminary_assessment_allocation re-runs over remaining ACTIVE non-exempt parcels, rewriting every sibling PRELIMINARY assessment's preliminary_amount_cents; district.total_frontage_ft and eligible_parcel_count recomputed"
          - "sets adjudicated_at"
      - from: UNDER_REVIEW
        to: OVERRULED
        trigger: "POST /objections/{id}/overrule"
        actor: CityClerk
        preconditions:
          - "objection.status == UNDER_REVIEW (ERR_OBJECTION_NOT_UNDER_REVIEW)"
          - "district.status == OBJECTION_WINDOW (ERR_DISTRICT_NOT_IN_OBJECTION_WINDOW)"
        side_effects: ["sets adjudicated_at; parcel and assessment unchanged (overruled objections still count toward protest weight)"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /objections/{id}/withdraw"
        actor: PropertyOwner
        preconditions:
          - "acting owner is objection.owner_id (ERR_NOT_RESOURCE_OWNER)"
          - "objection.status == FILED (ERR_OBJECTION_NOT_FILED)"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "system (district abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system (district abandon cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ParcelAssessment
    initial_state: PRELIMINARY
    terminal_states: [PAID_OFF, REMOVED, SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: LEVIED
        trigger: "system (council APPROVE adopted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRELIMINARY
        to: SUPERSEDED
        trigger: "system (council remand, district abandon, or district rejected)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRELIMINARY
        to: REMOVED
        trigger: "system (objection sustained on its parcel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LEVIED
        to: PREPAID
        trigger: "POST /payments with prepay semantics (payment_option == PREPAY_FULL and amount == preliminary_amount_cents)"
        actor: PropertyOwner
        preconditions:
          - "assessment.status == LEVIED (ERR_ASSESSMENT_NOT_LEVIED)"
          - "assessment.payment_option == PREPAY_FULL and amount_cents == preliminary_amount_cents (ERR_INVALID_PREPAY_AMOUNT)"
          - "now <= district.payment_option_deadline (ERR_PAYMENT_OPTION_WINDOW_CLOSED)"
        side_effects:
          - "total_paid_cents += amount; principal_balance_cents = preliminary_amount_cents - amount (= 0 pending true-up)"
          - "increments ParcelAssessment.version by 1"
      - from: LEVIED
        to: IN_REPAYMENT
        trigger: "system (finalize-true-up, option INSTALLMENTS selected or defaulted)"
        actor: system
        preconditions: []
        side_effects: ["ANNUAL invoice schedule created; principal_balance_cents = final_levy_cents"]
      - from: LEVIED
        to: PREPAID
        trigger: "system (finalize-true-up, option PREPAY_FULL already paid)"
        actor: system
        preconditions: []
        side_effects: ["delta settlement applied (SETTLEMENT_DUE or PAID_OFF per delta)"]
      - from: PREPAID
        to: SETTLEMENT_DUE
        trigger: "system (finalize-true-up, final_levy > amount paid)"
        actor: system
        preconditions: []
        side_effects: ["SUPPLEMENTAL invoice ISSUED for delta; principal_balance_cents = delta"]
      - from: PREPAID
        to: PAID_OFF
        trigger: "system (finalize-true-up, final_levy <= amount paid)"
        actor: system
        preconditions: []
        side_effects:
          - "credit_balance_cents = paid - final_levy when positive"
          - "district.paid_assessment_count recomputed; all_assessments_paid recomputed"
      - from: SETTLEMENT_DUE
        to: PAID_OFF
        trigger: "POST /payments covering the supplemental invoice in full"
        actor: PropertyOwner
        preconditions: []
        side_effects:
          - "district.paid_assessment_count recomputed; all_assessments_paid recomputed"
      - from: IN_REPAYMENT
        to: DELINQUENT
        trigger: "system (billing-run finds any invoice of this assessment DELINQUENT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: IN_REPAYMENT
        trigger: "system (payment or billing-run leaves no DELINQUENT invoice — cure loop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REPAYMENT
        to: PAID_OFF
        trigger: "POST /payments reducing principal_balance to 0 with no unpaid billed amounts (payoff)"
        actor: PropertyOwner
        preconditions: []
        side_effects:
          - "future SCHEDULED invoices -> VOIDED"
          - "district.paid_assessment_count recomputed; all_assessments_paid recomputed"
      - from: DELINQUENT
        to: PAID_OFF
        trigger: "POST /payments reducing principal_balance to 0 with no unpaid billed amounts"
        actor: PropertyOwner
        preconditions: []
        side_effects:
          - "future SCHEDULED invoices -> VOIDED"
          - "district.paid_assessment_count recomputed; all_assessments_paid recomputed"

  - entity: ConstructionPhase
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /construction-phases/{id}/start"
        actor: CityEngineer
        preconditions:
          - "phase.status == PLANNED (ERR_PHASE_NOT_PLANNED)"
          - "district.status in {APPROVED, CONSTRUCTION} (ERR_DISTRICT_NOT_APPROVED_OR_UNDER_CONSTRUCTION)"
          - "now >= start_date 00:00:00Z (ERR_PHASE_START_NOT_REACHED)"
        side_effects:
          - "if district was APPROVED -> district CONSTRUCTION"
          - "sets started_at"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /construction-phases/{id}/complete"
        actor: CityEngineer
        preconditions:
          - "phase.status == IN_PROGRESS (ERR_PHASE_NOT_IN_PROGRESS)"
        side_effects: ["sets completed_at"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /construction-phases/{id}/cancel"
        actor: CityEngineer
        preconditions:
          - "phase.status == PLANNED (ERR_PHASE_NOT_PLANNED)"
        side_effects: []

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: CityEngineer
        preconditions:
          - "change_order.status == PROPOSED (ERR_CHANGE_ORDER_NOT_PROPOSED)"
          - "district.status == CONSTRUCTION (ERR_DISTRICT_NOT_IN_CONSTRUCTION)"
          - "X-User-ID != change_order.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "district.approved_change_total_cents += amount_cents"
          - "district.overrun_flag recomputed: approved_change_total_cents > round(locked contract_price_cents * 0.10) (integer cents, strictly greater)"
          - "sets decided_by_user_id; increments District.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: CityEngineer
        preconditions:
          - "change_order.status == PROPOSED (ERR_CHANGE_ORDER_NOT_PROPOSED)"
          - "district.status == CONSTRUCTION (ERR_DISTRICT_NOT_IN_CONSTRUCTION)"
        side_effects: ["sets decided_by_user_id"]

  - entity: InstallmentInvoice
    initial_state: SCHEDULED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SCHEDULED
        to: ISSUED
        trigger: "system (billing-run with now >= issue_date; SUPPLEMENTAL invoices are created directly in ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (payment waterfall applies 0 < paid < invoice total)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (payment waterfall completes the invoice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "system (payment waterfall completes the invoice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: DELINQUENT
        trigger: "system (billing-run with now > due_date + 30 days and paid_cents < total)"
        actor: system
        preconditions: []
        side_effects: ["penalty_cents recomputed per calculations.delinquency_penalty; owning assessment -> DELINQUENT"]
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "system (billing-run with now > due_date + 30 days and paid_cents < total)"
        actor: system
        preconditions: []
        side_effects: ["penalty_cents recomputed per calculations.delinquency_penalty; owning assessment -> DELINQUENT"]
      - from: DELINQUENT
        to: PAID
        trigger: "system (payment waterfall completes the invoice including penalty)"
        actor: system
        preconditions: []
        side_effects: ["if no sibling invoice remains DELINQUENT, owning assessment -> IN_REPAYMENT (cure)"]
      - from: SCHEDULED
        to: VOIDED
        trigger: "system (assessment paid off early)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-district
    parent_entity: District
    write_endpoint: "POST /cost-estimates"
    occ_field: expected_district_version
    description: |
      Creating a CostEstimate against a District whose version has advanced
      since the client last observed it is rejected. Creating an estimate
      legitimately supersedes any existing SUBMITTED estimate, so a writer
      holding a stale district view must be refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: resolution-create-stale-district
    parent_entity: District
    write_endpoint: "POST /resolutions"
    occ_field: expected_district_version
    description: |
      Recording a CouncilResolution against a District whose version has
      advanced since the client last observed it is rejected with 412,
      because each recorded resolution mutates district state (approval,
      abandonment, or remand) and a second writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payment-create-stale-assessment
    parent_entity: ParcelAssessment
    write_endpoint: "POST /payments"
    occ_field: expected_parcel_assessment_version
    description: |
      Posting a Payment against a ParcelAssessment whose version has advanced
      since the client last observed it is rejected with 412, because each
      posted payment legitimately mutates balances and invoice allocations
      and a stale view would double-apply funds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money in integer cents; percentages at 2 decimal places, round_half_up.
# =============================================================================
calculations:
  - name: petition_support
    trigger: "POST /petitions/{id}/close"
    algorithm: threshold
    formula: |
      eligible_parcels  = parcels of district with status == ACTIVE AND exempt == false
      eligible_count    = count(eligible_parcels)
      eligible_frontage = sum(frontage_ft over eligible_parcels)
      support_count_pct    = round_half_up(verified_signature_count / eligible_count * 100, 2)
      support_frontage_pct = round_half_up(verified_frontage_ft / eligible_frontage * 100, 2)
      PASS iff support_count_pct >= 60.00 AND support_frontage_pct >= 50.00
      (verified tallies count only signatures in VERIFIED at close time;
      a parcel contributes at most one verified signature because duplicate
      submission is rejected with ERR_DUPLICATE_SIGNATURE.)
      If eligible_count == 0 the petition auto-fails (CLOSED_INSUFFICIENT).
    input_set: "VERIFIED PetitionSignatures of this petition at close time; ACTIVE non-exempt parcels of the district"
    constants:
      COUNT_THRESHOLD_PCT: 60.00
      FRONTAGE_THRESHOLD_PCT: 50.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: count_weighted
        when: "always computed"
        difference: "unweighted parcel-count percentage (one parcel = one vote)"
      - name: frontage_weighted
        when: "always computed"
        difference: "frontage-weighted percentage; a district can pass count and fail frontage (or vice versa), producing a different outcome for identical signature sets"
    key_insight: "Two weighting variants of the same signature set produce different pass/fail results; BOTH must pass."

  - name: preliminary_assessment_allocation
    trigger: "POST /hearings (initial roll) and POST /objections/{id}/sustain (reallocation over remaining parcels)"
    algorithm: tiered_pricing
    formula: |
      Let T = total_estimated_cost_cents of the district's APPROVED (locked) estimate,
      and S = the set of parcels with status == ACTIVE AND exempt == false.
      Variant FRONT_FOOT:
        rate = round_half_up(T / sum(frontage_ft over S), 4)   # 4-decimal rate, cents per foot
        per parcel p: raw_p = p.frontage_ft * rate
                       amt_p = round_half_up(raw_p, 0)         # integer cents
      Variant PER_PARCEL:
        share = round_half_up(T / count(S), 0)                 # integer cents
        amt_p = share for all p
      Remainder reconciliation (BOTH variants, pinned order):
        diff_cents = T - sum(amt_p)          # may be positive or negative, |diff| small
        order parcels by frontage_ft DESC, tie-break created_at ASC
        walking that order, apply +/- 1 cent per parcel (sign of diff) until diff exhausted;
        wrap around the order if |diff| > count(S).
      Result must satisfy sum(amt_p) == T exactly.
    input_set: "ACTIVE non-exempt parcels of the district; locked estimate total"
    constants:
      RATE_PRECISION_DP: 4
    precision: "amounts in integer cents (round_half_up to 0 dp); rate at 4 decimal places BEFORE per-parcel rounding"
    variants:
      - name: front_foot
        when: "district.methodology == FRONT_FOOT"
        difference: "per-parcel amount proportional to frontage via a 4dp rate"
      - name: per_parcel
        when: "district.methodology == PER_PARCEL"
        difference: "equal share per parcel; identical cost data yields different per-parcel amounts than front_foot"
    key_insight: "Nested rounding order is pinned: round the RATE to 4dp first, then multiply, then round each parcel to cents, then reconcile the penny remainder in (frontage DESC, created_at ASC) order. Summing raw values then rounding once produces different cents and is WRONG."

  - name: protest_weight_calculation
    trigger: "POST /districts/{id}/close-objection-window"
    algorithm: threshold
    formula: |
      protest_frontage = sum(frontage_ft of parcels holding an objection with
                         status == OVERRULED at window close)
      denom = sum(frontage_ft over ACTIVE non-exempt parcels)   # sustained parcels are REMOVED and thus excluded from BOTH numerator and denominator
      protest_frontage_pct = round_half_up(protest_frontage / denom * 100, 2)
      (FILED / UNDER_REVIEW objections block the close with ERR_UNRESOLVED_OBJECTIONS;
      WITHDRAWN and SUSTAINED objections contribute 0.)
      If denom == 0 the close is rejected with ERR_UNRESOLVED_OBJECTIONS.
    input_set: "objections of the district's hearing; ACTIVE non-exempt parcels"
    constants:
      SUPERMAJORITY_TRIGGER_PCT: 50.00
    precision: "2 decimal places, round_half_up; comparison uses the rounded value"

  - name: council_vote_outcome
    trigger: "POST /resolutions"
    algorithm: threshold
    formula: |
      required_votes = 4 if protest_frontage_pct >= 50.00 else 3
      motion APPROVE: outcome = ADOPTED iff votes_for >= required_votes
      motion REJECT:  outcome = ADOPTED iff votes_for >= 3
      motion REMAND:  outcome = ADOPTED iff votes_for >= 3 AND remand_count < 2
                      (if remand_count == 2 the request fails with ERR_REMAND_LIMIT_EXCEEDED)
      ADOPTED APPROVE -> district APPROVED; FAILED APPROVE -> district ABANDONED;
      ADOPTED REJECT -> district ABANDONED; FAILED REJECT -> district stays COUNCIL_REVIEW;
      ADOPTED REMAND -> district SCOPING (remand cascade); FAILED REMAND -> stays COUNCIL_REVIEW.
    input_set: "district.protest_frontage_pct, votes_for, votes_against"
    constants:
      COUNCIL_SEATS: 5
      SIMPLE_MAJORITY: 3
      SUPERMAJORITY: 4
      MAX_REMANDS: 2

  - name: installment_amortization_schedule
    trigger: "POST /districts/{id}/finalize-true-up for each INSTALLMENTS assessment"
    algorithm: constraint_propagation
    formula: |
      Inputs: P = final_levy_cents, r = district.annual_interest_rate_bp / 10000, n = term_years.
      if r == 0:
        A = round_half_up(P / n, 0); yearly interest is 0
      else:
        A = round_half_up(P * r / (1 - (1 + r)^(-n)), 0)     # level payment, integer cents
      balance = P
      for year y in 1..n:
        interest_y = round_half_up(balance * r, 0)           # integer cents
        if y < n:  payment_y = A;            principal_y = payment_y - interest_y
        else:      principal_y = balance;    payment_y   = balance + interest_y   # final-year true-up
        balance -= principal_y
        invoice_y: kind=ANNUAL, year_index=y, due_date = trueup_at + y*365 days,
                   issue_date = due_date - 30 days, principal_cents=principal_y, interest_cents=interest_y
      Termination: balance == 0 after year n by construction (final-year absorbs rounding drift).
      Evaluation order is pinned: A is rounded ONCE from P, r, n; interest is recomputed
      each year from the running balance; the final year pays the residual balance.
    input_set: "assessments with payment_option == INSTALLMENTS at true-up"
    constants:
      DUE_INTERVAL_DAYS: 365
      ISSUE_LEAD_DAYS: 30
    precision: "integer cents, round_half_up at each pinned step"

  - name: final_levy_allocation
    trigger: "POST /districts/{id}/finalize-true-up"
    algorithm: tiered_pricing
    formula: |
      T_final = locked contract_price_cents + district.approved_change_total_cents
      (contingency_cents is EXCLUDED from the final allocation base)
      Then identical allocation procedure as preliminary_assessment_allocation
      (same methodology variant, same 4dp rate rule, same remainder order).
    input_set: "ACTIVE non-exempt parcels; locked estimate; APPROVED change orders"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_basis
        when: "preliminary roll at hearing time"
        difference: "base includes contingency_cents (estimate-based)"
      - name: final_basis
        when: "true-up after construction"
        difference: "base excludes contingency and adds approved change orders; identical parcels produce different per-parcel levies than provisional"
    key_insight: "Provisional vs final basis on the same parcel set yields different levies; the per-parcel delta drives supplemental invoices or credits."

  - name: delinquency_penalty
    trigger: "POST /districts/{id}/billing-run"
    algorithm: decay_function
    formula: |
      For each invoice with status in {ISSUED, PARTIALLY_PAID, DELINQUENT} and paid_cents < principal+interest+penalty:
        grace_end = due_date + 30 days
        if now > grace_end (strictly): invoice -> DELINQUENT
          (at exactly grace_end the invoice remains ISSUED/PARTIALLY_PAID)
        months_overdue = floor((now - grace_end) / 30 days)   # may be 0: DELINQUENT with no penalty yet
        base = principal_cents + interest_cents - paid_cents   # unpaid billed amount
        Variant SIMPLE:     penalty = months_overdue * round_half_up(base * 0.01, 0)
        Variant COMPOUND:   iterate m = 1..months_overdue: p_m = round_half_up(balance * 0.01, 0);
                            balance += p_m; penalty = sum(p_m)   # penalty capitalizes monthly
        penalty_cents is RECOMPUTED idempotently at every run from months_overdue
        (never incremented incrementally), so repeated runs at the same clock are no-ops.
        An invoice is delinquent only when now > due_date + 30 days strictly;
        at exactly due_date + 30 days it remains ISSUED/PARTIALLY_PAID.
    input_set: "ISSUED/PARTIALLY_PAID/DELINQUENT invoices of the district"
    constants:
      GRACE_DAYS: 30
      MONTH_DAYS: 30
      PENALTY_MONTHLY_RATE: 0.01
    precision: "integer cents, round_half_up per monthly step"
    variants:
      - name: simple
        when: "district.interest_method == SIMPLE"
        difference: "penalty linear in months over the original unpaid base"
      - name: compound
        when: "district.interest_method == COMPOUND"
        difference: "penalty capitalizes monthly; identical overdue balance and elapsed months produce a larger penalty than simple"

  - name: accrued_unpaid_interest
    trigger: "POST /parcel-assessments/{id}/payoff-quote and POST /payments (overpayment ceiling)"
    algorithm: chronological
    formula: |
      Interest accrues simple ACT/365 on the outstanding principal balance:
      walk principal-change events (true-up, payments) in chronological order
      (tie-break created_at ASC), per segment:
        segment_interest = round_half_up(balance_segment * rate * days_in_segment / 365, 0)
      accrued_total = sum(segments); accrued_unpaid = accrued_total - interest_already_paid
      rate = district.annual_interest_rate_bp / 10000.
      For a PREPAID/SETTLEMENT_DUE assessment (no schedule), accrued_unpaid = 0.
    input_set: "principal balance history of the assessment since true-up"
    precision: "integer cents, round_half_up per segment"

  - name: payoff_quote
    trigger: "POST /parcel-assessments/{id}/payoff-quote"
    algorithm: aggregation
    formula: |
      payoff_cents = principal_balance_cents + accrued_unpaid_interest(now) + unpaid_penalty_cents
      where unpaid_penalty_cents = sum(penalty_cents applied portion unpaid) over DELINQUENT invoices
      (penalty allocated portion of paid_cents: payments fill penalty first, so
      unpaid_penalty = sum over invoices of max(0, penalty_cents - penalty_paid_cents);
      tracked per invoice by the waterfall).
      Response also reports principal_balance_cents, billed_unpaid_cents
      (sum of unpaid principal+interest+penalty over ISSUED/PARTIALLY_PAID/DELINQUENT invoices),
      accrued_interest_cents, penalty_unpaid_cents, as_of.
    input_set: "the assessment and its non-terminal invoices"
    precision: "integer cents"

  - name: payment_waterfall
    trigger: "POST /payments"
    algorithm: waterfall_allocation
    formula: |
      Preconditions: amount > 0; amount <= payoff_quote(now) (ERR_OVERPAYMENT).
      Prepay special case: if assessment LEVIED with option PREPAY_FULL:
        require amount == preliminary_amount_cents (ERR_INVALID_PREPAY_AMOUNT);
        entire amount -> principal; assessment -> PREPAID. Stop.
      Otherwise (IN_REPAYMENT / DELINQUENT / SETTLEMENT_DUE):
        1. Billed invoices in order due_date ASC, tie-break created_at ASC;
           within each invoice: penalty -> interest -> principal.
           Invoice becomes PARTIALLY_PAID then PAID when filled; a DELINQUENT
           invoice that reaches PAID triggers the assessment cure check.
        2. Remainder -> accrued-unbilled interest (accrued_unpaid_interest).
        3. Remainder -> principal balance (prepayment).
        4. If principal_balance == 0 AND no billed-unpaid AND accrued-unpaid == 0:
           assessment -> PAID_OFF; remaining SCHEDULED invoices -> VOIDED.
      Store applied_penalty_cents / applied_interest_cents / applied_principal_cents
      on the Payment event.
    input_set: "the assessment's ISSUED/PARTIALLY_PAID/DELINQUENT invoices, accrued interest, principal balance"
    precision: "integer cents"

  - name: overrun_threshold
    trigger: "POST /change-orders/{id}/approve"
    algorithm: threshold
    formula: |
      cumulative = district.approved_change_total_cents (after adding this approval)
      cap = round_half_up(locked contract_price_cents * 0.10, 0)   # integer cents
      district.overrun_flag = (cumulative > cap)   # strictly greater; exactly at cap is NOT overrun
    input_set: "APPROVED change orders of the district; locked estimate contract price"
    constants:
      OVERRUN_CAP_RATIO: 0.10
    precision: "integer-cent comparison"

  - name: construction_schedule_validation
    trigger: "POST /construction-phases"
    algorithm: interval_merge
    formula: |
      Let new = [start_date, end_date] (inclusive calendar dates).
      (1) Season containment: every date in [start_date, end_date] must fall within
          the district season [season_start_mmdd, season_end_mmdd] of its calendar year
          (inclusive both ends; season may not wrap year-end: start_mmdd <= end_mmdd).
          Violation -> ERR_SEASON_WINDOW_VIOLATION.
      (2) Crew buffer: for each existing phase X of the same district in
          {PLANNED, IN_PROGRESS} with X.crew_name == new.crew_name:
          require new.start_date >= X.end_date + 5 days OR X.start_date >= new.end_date + 5 days.
          Violation -> ERR_PHASE_SCHEDULE_CONFLICT. (A gap of exactly 5 days passes.)
      (3) Concurrent capacity: for every calendar date d covered by new, the count of
          existing district phases in {PLANNED, IN_PROGRESS} covering d must be < 2
          (i.e., at most 2 concurrent phases including the new one).
          Violation -> ERR_CONSTRUCTION_CAPACITY_EXCEEDED.
    input_set: "phases of the district in PLANNED or IN_PROGRESS"
    constants:
      CREW_BUFFER_DAYS: 5
      MAX_CONCURRENT_PHASES: 2

  - name: venue_date_exclusion
    trigger: "POST /hearings"
    algorithm: interval_merge
    formula: |
      Whole-day disjointness: reject when any hearing with status in {SCHEDULED, HELD}
      (any district) has the same venue string AND the same UTC calendar date as the
      requested hearing_date. Adjacent dates are fine; no buffer applies.
      Violation -> ERR_VENUE_DATE_CONFLICT.
    input_set: "all non-terminal hearings"
    precision: "date granularity (UTC calendar day)"

  - name: refund_credit_payout
    trigger: "POST /parcel-assessments/{id}/refund-credit"
    algorithm: aggregation
    formula: |
      Requires credit_balance_cents > 0 and 0 < amount_cents <= credit_balance_cents
      (ERR_REFUND_EXCEEDS_CREDIT otherwise).
      credit_balance_cents -= amount_cents; total_refunded_cents += amount_cents.
      Money identity conserved: total_paid_cents - total_refunded_cents
      == final_levy_cents - credit_balance_cents at every step.
    input_set: "the assessment"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 0, category: business_constraint, check: "Request shape: required fields present, types match, enum members valid, scalar ranges enforced (frontage_ft > 0, votes 0..5 and sum <= 5, annual_interest_rate_bp in 0..2000, positive money inputs, valid date/MM-DD formats)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path ids and body FK ids exist, validated left-to-right (path first, then body fields in declared input order)", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 4, category: auth, check: "Ownership: acting PropertyOwner's X-User-ID equals the owner-of-record for the targeted resource (signature parcel owner, objection parcel owner, assessment's parcel owner, payment's assessment owner)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /signatures, POST /objections, POST /parcel-assessments/{id}/select-payment-option, POST /payments, POST /parcel-assessments/{id}/payoff-quote (owner path), POST /signatures/{id}/withdraw, POST /objections/{id}/withdraw" }
  - { priority: 5, category: auth, check: "Segregation of duties: change-order approver X-User-ID != proposed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /change-orders/{id}/approve" }
  - { priority: 6, category: business_constraint, check: "OCC: expected_<parent>_version in the request body equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /cost-estimates, POST /resolutions, POST /payments" }
  - { priority: 7, category: state, check: "Target entity state precondition of the endpoint (district phase gate, petition CIRCULATING, signature SUBMITTED, estimate SUBMITTED, hearing SCHEDULED, objection FILED/UNDER_REVIEW, assessment LEVIED/payable, phase PLANNED/IN_PROGRESS, change order PROPOSED)", error_id: "state-specific (ERR_DISTRICT_NOT_*, ERR_PETITION_NOT_CIRCULATING, ERR_SIGNATURE_NOT_*, ERR_ESTIMATE_NOT_SUBMITTED, ERR_HEARING_NOT_SCHEDULED, ERR_OBJECTION_NOT_*, ERR_ASSESSMENT_NOT_LEVIED, ERR_PHASE_NOT_*, ERR_CHANGE_ORDER_NOT_PROPOSED, ERR_UNRESOLVED_OBJECTIONS, ERR_PHASES_NOT_ALL_COMPLETE, ERR_ASSESSMENTS_NOT_ALL_PAID, ERR_REMAND_LIMIT_EXCEEDED)", http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 8, category: business_safety, check: "Statutory notice: hearing_date >= now + 10 days", error_id: ERR_HEARING_NOTICE_TOO_SHORT, http_status: 422, applies_to: "POST /hearings" }
  - { priority: 9, category: business_temporal, check: "Window/deadline rules: objection window open, payment-option window open, season containment, phase start reached, record-held not before hearing date", error_id: "ERR_OBJECTION_WINDOW_CLOSED | ERR_OBJECTION_WINDOW_STILL_OPEN | ERR_PAYMENT_OPTION_WINDOW_CLOSED | ERR_SEASON_WINDOW_VIOLATION | ERR_PHASE_START_NOT_REACHED | ERR_HEARING_DATE_NOT_REACHED", http_status: 422, applies_to: "objection create, payment-option select, prepay payment, phase create/start, record-held, close-objection-window" }
  - { priority: 10, category: business_referential, check: "Cross-references cohere: parcel belongs to the petition's/hearing's district; change-order phase belongs to the change-order's district", error_id: "ERR_PARCEL_NOT_IN_DISTRICT | ERR_PHASE_NOT_IN_DISTRICT", http_status: 422, applies_to: "POST /signatures, POST /objections, POST /change-orders" }
  - { priority: 11, category: business_constraint, check: "Uniqueness and resource conflicts: duplicate parcel number, duplicate owner email, duplicate signature per (petition, parcel), duplicate active objection per (hearing, parcel), crew buffer overlap, concurrent-phase capacity, venue same-day exclusion, active hearing exists", error_id: "ERR_DUPLICATE_PARCEL_NUMBER | ERR_DUPLICATE_OWNER_EMAIL | ERR_DUPLICATE_SIGNATURE | ERR_DUPLICATE_OBJECTION | ERR_PHASE_SCHEDULE_CONFLICT | ERR_CONSTRUCTION_CAPACITY_EXCEEDED | ERR_VENUE_DATE_CONFLICT | ERR_INELIGIBLE_PARCEL", http_status: 409, applies_to: "create endpoints" }
  - { priority: 12, category: business_fiscal, check: "Money rules last: payment amount > 0 and <= payoff quote; prepay exact amount; refund <= credit balance; change-order amount > 0; estimate prices valid; term in {5,10} when INSTALLMENTS", error_id: "ERR_INVALID_AMOUNT | ERR_OVERPAYMENT | ERR_INVALID_PREPAY_AMOUNT | ERR_REFUND_EXCEEDS_CREDIT | ERR_TERM_NOT_ALLOWED", http_status: 422, applies_to: "payments, refunds, change orders, estimates, payment-option" }

# =============================================================================
# §1.5 API Endpoint Table
# Roles: SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner
# List outputs order: parcels/assessments by parcel_number ASC; invoices by due_date ASC;
# payments/signatures/objections/petitions/estimates/resolutions/change-orders/hearings by created_at ASC.
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  # --- District ---
  - { method: POST, path: "/districts", description: "Create a special assessment district", roles: [CityClerk], code: 201, input: [name, methodology, interest_method, "annual_interest_rate_bp?", season_start_mmdd, season_end_mmdd], output: District, side_effects: ["status=DRAFT, computed counters zeroed"] }
  - { method: GET, path: "/districts", description: "List districts (paginated)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: ["limit?", "offset?", "status?"], output: "District[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}", description: "Get a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: District, side_effects: [] }
  - { method: POST, path: "/districts/{id}/abandon", description: "Abandon a district (DRAFT/PETITIONING/SCOPING/HEARING_SCHEDULED/OBJECTION_WINDOW only)", roles: [CityClerk], code: 200, input: [], output: District, side_effects: ["terminal cascade to petition/signatures/estimates/hearing/assessments/objections per state machine"] }
  - { method: POST, path: "/districts/{id}/close-objection-window", description: "Close the objection window and compute protest weight", roles: [CityClerk], code: 200, input: [], output: District, side_effects: ["protest_frontage_pct computed", "hearing -> CLOSED", "district -> COUNCIL_REVIEW"] }
  - { method: POST, path: "/districts/{id}/complete-construction", description: "Move district CONSTRUCTION -> TRUE_UP when all phases terminal", roles: [CityEngineer], code: 200, input: [], output: District, side_effects: ["district -> TRUE_UP"] }
  - { method: POST, path: "/districts/{id}/finalize-true-up", description: "Compute final levies, settle prepaid deltas, generate installment schedules", roles: [FinanceOfficer], code: 200, input: [], output: District, side_effects: ["final_levy_allocation", "default payment option INSTALLMENTS/10y for unselected LEVIED", "supplemental invoices or credits for PREPAID", "ANNUAL invoice schedules", "district -> BILLING"] }
  - { method: POST, path: "/districts/{id}/billing-run", description: "Ops-run: issue due invoices, mark delinquencies, accrue penalties, cure assessments", roles: [FinanceOfficer], code: 200, input: [], output: "{ issued_count: integer, newly_delinquent_count: integer, cured_count: integer }", side_effects: ["invoice state sweep", "penalty recompute (idempotent)", "assessment DELINQUENT/IN_REPAYMENT flips"] }
  - { method: POST, path: "/districts/{id}/accept", description: "Final acceptance when all assessments PAID_OFF", roles: [CouncilPresident], code: 200, input: [], output: District, side_effects: ["district -> ACCEPTED"] }
  - { method: GET, path: "/districts/{id}/parcels", description: "List parcels of a district (parcel_number ASC)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: ["limit?", "offset?"], output: "Parcel[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/petitions", description: "List petitions of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Petition[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/cost-estimates", description: "List cost estimates of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: "CostEstimate[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/parcel-assessments", description: "List parcel assessments of a district (parcel_number ASC)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: ["limit?", "offset?", "status?"], output: "ParcelAssessment[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/hearings", description: "List hearings of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "PublicHearing[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/objections", description: "List objections of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Objection[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/resolutions", description: "List council resolutions of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: "CouncilResolution[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/construction-phases", description: "List construction phases of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: "ConstructionPhase[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/change-orders", description: "List change orders of a district", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: "ChangeOrder[]", side_effects: [] }
  - { method: GET, path: "/districts/{id}/invoices", description: "List invoices of a district (due_date ASC)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: ["limit?", "offset?", "status?"], output: "InstallmentInvoice[]", side_effects: [] }

  # --- PropertyOwner ---
  - { method: POST, path: "/owners", description: "Register a property owner", roles: [CityClerk], code: 201, input: [full_name, email, mailing_address], output: PropertyOwner, side_effects: [] }
  - { method: GET, path: "/owners", description: "List property owners (paginated)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: ["limit?", "offset?"], output: "PropertyOwner[]", side_effects: [] }
  - { method: GET, path: "/owners/{id}", description: "Get a property owner", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: PropertyOwner, side_effects: [] }
  - { method: GET, path: "/owners/{id}/parcels", description: "List parcels owned by an owner", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Parcel[]", side_effects: [] }
  - { method: GET, path: "/owners/{id}/signatures", description: "List petition signatures made by an owner", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "PetitionSignature[]", side_effects: [] }
  - { method: GET, path: "/owners/{id}/objections", description: "List objections filed by an owner", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Objection[]", side_effects: [] }

  # --- Parcel ---
  - { method: POST, path: "/parcels", description: "Add a parcel to a DRAFT district", roles: [CityClerk], code: 201, input: [district_id, owner_id, parcel_number, frontage_ft, "exempt?"], output: Parcel, side_effects: ["district.total_frontage_ft and eligible_parcel_count recomputed", "increments District.version by 1"] }
  - { method: GET, path: "/parcels", description: "List parcels with optional filters", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: ["district_id?", "owner_id?", "limit?", "offset?"], output: "Parcel[]", side_effects: [] }
  - { method: GET, path: "/parcels/{id}", description: "Get a parcel", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: Parcel, side_effects: [] }
  - { method: GET, path: "/parcels/{id}/signatures", description: "List signatures recorded against a parcel", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "PetitionSignature[]", side_effects: [] }
  - { method: GET, path: "/parcels/{id}/assessments", description: "List assessments of a parcel", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "ParcelAssessment[]", side_effects: [] }
  - { method: GET, path: "/parcels/{id}/objections", description: "List objections filed against a parcel", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Objection[]", side_effects: [] }

  # --- Petition / Signature ---
  - { method: POST, path: "/petitions", description: "Open a petition for a DRAFT district (district -> PETITIONING)", roles: [CityClerk], code: 201, input: [district_id], output: Petition, side_effects: ["district DRAFT -> PETITIONING", "petition tallies zeroed"] }
  - { method: GET, path: "/petitions/{id}", description: "Get a petition", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: Petition, side_effects: [] }
  - { method: POST, path: "/petitions/{id}/close", description: "Close circulation and compute support; district -> SCOPING or back to DRAFT", roles: [CityClerk], code: 200, input: [], output: Petition, side_effects: ["petition_support calculation", "district transition per outcome"] }
  - { method: GET, path: "/petitions/{id}/signatures", description: "List signatures of a petition (created_at ASC)", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "PetitionSignature[]", side_effects: [] }
  - { method: POST, path: "/signatures", description: "Property owner signs a circulating petition for their own parcel", roles: [PropertyOwner], code: 201, input: [petition_id, parcel_id], output: PetitionSignature, side_effects: ["signature SUBMITTED with owner_id from X-User-ID, signed_at = now"] }
  - { method: GET, path: "/signatures/{id}", description: "Get a signature", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: PetitionSignature, side_effects: [] }
  - { method: POST, path: "/signatures/{id}/verify", description: "Clerk verifies a submitted signature", roles: [CityClerk], code: 200, input: [], output: PetitionSignature, side_effects: ["petition.verified_signature_count += 1", "petition.verified_frontage_ft += parcel.frontage_ft"] }
  - { method: POST, path: "/signatures/{id}/reject", description: "Clerk rejects a submitted signature with a reason", roles: [CityClerk], code: 200, input: [reason], output: PetitionSignature, side_effects: [] }
  - { method: POST, path: "/signatures/{id}/withdraw", description: "Owner withdraws their signature while the petition circulates", roles: [PropertyOwner], code: 200, input: [], output: PetitionSignature, side_effects: ["if VERIFIED: petition tallies decremented"] }

  # --- CostEstimate ---
  - { method: POST, path: "/cost-estimates", description: "Engineer submits a cost estimate (OCC on district; supersedes any SUBMITTED estimate)", roles: [CityEngineer], code: 201, input: [district_id, expected_district_version, contract_price_cents, contingency_cents], output: CostEstimate, side_effects: ["total_estimated_cost_cents computed", "prior SUBMITTED estimates -> SUPERSEDED", "increments District.version by 1"] }
  - { method: GET, path: "/cost-estimates/{id}", description: "Get a cost estimate", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: CostEstimate, side_effects: [] }
  - { method: POST, path: "/cost-estimates/{id}/approve", description: "Engineer approves a SUBMITTED estimate (supersedes any APPROVED one)", roles: [CityEngineer], code: 200, input: [], output: CostEstimate, side_effects: ["other APPROVED estimate -> SUPERSEDED"] }

  # --- PublicHearing ---
  - { method: POST, path: "/hearings", description: "Schedule the public hearing; locks the approved estimate and computes the preliminary assessment roll", roles: [CityClerk], code: 201, input: [district_id, hearing_date, venue], output: PublicHearing, side_effects: ["preliminary_assessment_allocation creates PRELIMINARY assessments", "district SCOPING -> HEARING_SCHEDULED", "approved_estimate_id locked"] }
  - { method: GET, path: "/hearings/{id}", description: "Get a hearing", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: PublicHearing, side_effects: [] }
  - { method: POST, path: "/hearings/{id}/record-held", description: "Record that the hearing was held; opens the 15-day objection window", roles: [CityClerk], code: 200, input: [], output: PublicHearing, side_effects: ["hearing -> HELD", "district -> OBJECTION_WINDOW"] }
  - { method: GET, path: "/hearings/{id}/objections", description: "List objections filed on a hearing", roles: [SystemAdmin, CityClerk, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Objection[]", side_effects: [] }

  # --- Objection ---
  - { method: POST, path: "/objections", description: "Owner files an objection against their parcel's assessment during the objection window", roles: [PropertyOwner], code: 201, input: [hearing_id, parcel_id, grounds], output: Objection, side_effects: ["objection FILED with owner_id from X-User-ID"] }
  - { method: GET, path: "/objections/{id}", description: "Get an objection", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: Objection, side_effects: [] }
  - { method: POST, path: "/objections/{id}/start-review", description: "Clerk takes an objection under review", roles: [CityClerk], code: 200, input: [], output: Objection, side_effects: ["objection FILED -> UNDER_REVIEW"] }
  - { method: POST, path: "/objections/{id}/sustain", description: "Clerk sustains an objection: parcel and its assessment are removed and the roll is reallocated", roles: [CityClerk], code: 200, input: [], output: Objection, side_effects: ["3-hop cascade: parcel REMOVED -> assessment REMOVED -> sibling reallocation + district totals"] }
  - { method: POST, path: "/objections/{id}/overrule", description: "Clerk overrules an objection (still counts toward protest weight)", roles: [CityClerk], code: 200, input: [], output: Objection, side_effects: [] }
  - { method: POST, path: "/objections/{id}/withdraw", description: "Owner withdraws a FILED objection", roles: [PropertyOwner], code: 200, input: [], output: Objection, side_effects: [] }

  # --- CouncilResolution ---
  - { method: POST, path: "/resolutions", description: "Record a council resolution (OCC on district); outcome computed by council_vote_outcome", roles: [CouncilPresident], code: 201, input: [district_id, expected_district_version, motion, votes_for, votes_against], output: CouncilResolution, side_effects: ["district transition per motion/outcome (APPROVED / ABANDONED / SCOPING remand / stay)", "increments District.version by 1"] }
  - { method: GET, path: "/resolutions/{id}", description: "Get a resolution", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: CouncilResolution, side_effects: [] }

  # --- ParcelAssessment ---
  - { method: GET, path: "/parcel-assessments/{id}", description: "Get a parcel assessment", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: ParcelAssessment, side_effects: [] }
  - { method: POST, path: "/parcel-assessments/{id}/select-payment-option", description: "Owner selects PREPAY_FULL or INSTALLMENTS (term 5 or 10) within 30 days of levy", roles: [PropertyOwner], code: 200, input: [option, "term_years?"], output: ParcelAssessment, side_effects: ["payment_option set", "option_selected_at = now", "increments ParcelAssessment.version by 1"] }
  - { method: POST, path: "/parcel-assessments/{id}/payoff-quote", description: "Computed read: payoff quote as of now", roles: [PropertyOwner, FinanceOfficer], code: 200, input: [], output: "{ payoff_cents: integer, principal_balance_cents: integer, billed_unpaid_cents: integer, accrued_interest_cents: integer, penalty_unpaid_cents: integer, as_of: string }", side_effects: [] }
  - { method: POST, path: "/parcel-assessments/{id}/refund-credit", description: "Finance officer pays out an overpayment credit", roles: [FinanceOfficer], code: 200, input: [amount_cents], output: ParcelAssessment, side_effects: ["credit_balance_cents -= amount", "total_refunded_cents += amount", "increments ParcelAssessment.version by 1"] }
  - { method: GET, path: "/parcel-assessments/{id}/invoices", description: "List invoices of an assessment (due_date ASC)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "InstallmentInvoice[]", side_effects: [] }
  - { method: GET, path: "/parcel-assessments/{id}/payments", description: "List payments of an assessment (created_at ASC)", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: "Payment[]", side_effects: [] }

  # --- ConstructionPhase ---
  - { method: POST, path: "/construction-phases", description: "Plan a construction phase (season containment, crew buffer, capacity checks)", roles: [CityEngineer], code: 201, input: [district_id, name, crew_name, start_date, end_date, estimated_cost_cents], output: ConstructionPhase, side_effects: [] }
  - { method: GET, path: "/construction-phases/{id}", description: "Get a construction phase", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: ConstructionPhase, side_effects: [] }
  - { method: POST, path: "/construction-phases/{id}/start", description: "Start a PLANNED phase on or after its start_date", roles: [CityEngineer], code: 200, input: [], output: ConstructionPhase, side_effects: ["phase -> IN_PROGRESS", "first start moves district APPROVED -> CONSTRUCTION"] }
  - { method: POST, path: "/construction-phases/{id}/complete", description: "Complete an IN_PROGRESS phase", roles: [CityEngineer], code: 200, input: [], output: ConstructionPhase, side_effects: ["phase -> COMPLETED"] }
  - { method: POST, path: "/construction-phases/{id}/cancel", description: "Cancel a PLANNED phase", roles: [CityEngineer], code: 200, input: [], output: ConstructionPhase, side_effects: ["phase -> CANCELLED"] }
  - { method: GET, path: "/construction-phases/{id}/change-orders", description: "List change orders linked to a phase", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: "ChangeOrder[]", side_effects: [] }

  # --- ChangeOrder ---
  - { method: POST, path: "/change-orders", description: "Engineer proposes a change order during CONSTRUCTION", roles: [CityEngineer], code: 201, input: [district_id, "phase_id?", description, amount_cents], output: ChangeOrder, side_effects: ["proposed_by_user_id = X-User-ID"] }
  - { method: GET, path: "/change-orders/{id}", description: "Get a change order", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident], code: 200, input: [], output: ChangeOrder, side_effects: [] }
  - { method: POST, path: "/change-orders/{id}/approve", description: "Approve a change order (must be a different engineer than the proposer); updates district overrun tracking", roles: [CityEngineer], code: 200, input: [], output: ChangeOrder, side_effects: ["district.approved_change_total_cents += amount_cents", "overrun_flag recomputed", "increments District.version by 1"] }
  - { method: POST, path: "/change-orders/{id}/reject", description: "Reject a change order", roles: [CityEngineer], code: 200, input: [], output: ChangeOrder, side_effects: [] }

  # --- InstallmentInvoice ---
  - { method: GET, path: "/invoices/{id}", description: "Get an invoice", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: InstallmentInvoice, side_effects: [] }

  # --- Payment ---
  - { method: POST, path: "/payments", description: "Owner posts a payment against their assessment (OCC on assessment; waterfall allocation)", roles: [PropertyOwner], code: 201, input: [parcel_assessment_id, expected_parcel_assessment_version, amount_cents, method], output: Payment, side_effects: ["payment_waterfall allocation", "invoice state updates", "assessment balance/status recompute", "district paid counters recompute", "increments ParcelAssessment.version by 1"] }
  - { method: GET, path: "/payments/{id}", description: "Get a payment event", roles: [SystemAdmin, CityClerk, CityEngineer, FinanceOfficer, CouncilPresident, PropertyOwner], code: 200, input: [], output: Payment, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Acting role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting PropertyOwner is not the owner-of-record of the targeted parcel/assessment/signature/objection" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Change-order approver X-User-ID equals proposed_by_user_id" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, invalid MM-DD or date format, frontage_ft <= 0, votes out of 0..5 range or sum > 5, annual_interest_rate_bp out of 0..2000, contract_price_cents <= 0, contingency_cents < 0, estimated_cost_cents <= 0, end_date < start_date" }
  # --- not found ---
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "district id does not exist" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "owner id does not exist" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "parcel id does not exist" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "petition id does not exist" }
  - { id: ERR_SIGNATURE_NOT_FOUND, http: 404, condition: "signature id does not exist" }
  - { id: ERR_COST_ESTIMATE_NOT_FOUND, http: 404, condition: "cost estimate id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "parcel assessment id does not exist" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing id does not exist" }
  - { id: ERR_OBJECTION_NOT_FOUND, http: 404, condition: "objection id does not exist" }
  - { id: ERR_RESOLUTION_NOT_FOUND, http: 404, condition: "resolution id does not exist" }
  - { id: ERR_PHASE_NOT_FOUND, http: 404, condition: "construction phase id does not exist" }
  - { id: ERR_CHANGE_ORDER_NOT_FOUND, http: 404, condition: "change order id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "payment id does not exist" }
  # --- state ---
  - { id: ERR_DISTRICT_NOT_DRAFT, http: 409, condition: "Operation requires district in DRAFT (petition open, parcel add)" }
  - { id: ERR_DISTRICT_NOT_IN_SCOPING, http: 409, condition: "Operation requires district in SCOPING (estimate create/approve, hearing create)" }
  - { id: ERR_NO_APPROVED_ESTIMATE, http: 409, condition: "Hearing creation requires an APPROVED cost estimate" }
  - { id: ERR_DISTRICT_NOT_IN_OBJECTION_WINDOW, http: 409, condition: "Operation requires district in OBJECTION_WINDOW (close window, adjudicate objection)" }
  - { id: ERR_DISTRICT_NOT_IN_COUNCIL_REVIEW, http: 409, condition: "Resolution recording requires district in COUNCIL_REVIEW" }
  - { id: ERR_DISTRICT_NOT_APPROVED_OR_UNDER_CONSTRUCTION, http: 409, condition: "Phase create/start requires district APPROVED or CONSTRUCTION" }
  - { id: ERR_DISTRICT_NOT_IN_CONSTRUCTION, http: 409, condition: "Operation requires district in CONSTRUCTION (complete-construction, change-order create/approve/reject)" }
  - { id: ERR_PHASES_NOT_ALL_COMPLETE, http: 409, condition: "complete-construction requires >= 1 phase and all phases COMPLETED or CANCELLED with >= 1 COMPLETED" }
  - { id: ERR_DISTRICT_NOT_IN_TRUE_UP, http: 409, condition: "finalize-true-up requires district in TRUE_UP" }
  - { id: ERR_DISTRICT_NOT_IN_BILLING, http: 409, condition: "billing-run requires district in BILLING" }
  - { id: ERR_DISTRICT_NOT_ACCEPTABLE, http: 409, condition: "accept requires district in BILLING" }
  - { id: ERR_ASSESSMENTS_NOT_ALL_PAID, http: 409, condition: "accept requires every non-removed assessment PAID_OFF" }
  - { id: ERR_DISTRICT_NOT_ABANDONABLE, http: 409, condition: "abandon requires status in {DRAFT, PETITIONING, SCOPING, HEARING_SCHEDULED, OBJECTION_WINDOW}" }
  - { id: ERR_PETITION_NOT_CIRCULATING, http: 409, condition: "Operation requires petition CIRCULATING (sign, verify, reject, withdraw, close)" }
  - { id: ERR_SIGNATURE_NOT_VERIFIABLE, http: 409, condition: "Signature must be SUBMITTED to verify or reject" }
  - { id: ERR_SIGNATURE_NOT_WITHDRAWABLE, http: 409, condition: "Signature withdrawable only while petition CIRCULATING and signature SUBMITTED or VERIFIED" }
  - { id: ERR_ESTIMATE_NOT_SUBMITTED, http: 409, condition: "Estimate must be SUBMITTED to approve" }
  - { id: ERR_HEARING_NOT_SCHEDULED, http: 409, condition: "record-held requires hearing SCHEDULED" }
  - { id: ERR_OBJECTION_NOT_FILED, http: 409, condition: "Objection must be FILED (start-review, withdraw)" }
  - { id: ERR_OBJECTION_NOT_UNDER_REVIEW, http: 409, condition: "Objection must be UNDER_REVIEW (sustain, overrule)" }
  - { id: ERR_UNRESOLVED_OBJECTIONS, http: 409, condition: "Objection window cannot close while objections remain FILED or UNDER_REVIEW; also when all parcels were removed (empty denominator)" }
  - { id: ERR_ASSESSMENT_NOT_LEVIED, http: 409, condition: "Payment or option selection requires assessment LEVIED (or payable status for payments)" }
  - { id: ERR_ASSESSMENT_OPTION_ALREADY_SELECTED, http: 409, condition: "Payment option may be selected at most once while LEVIED" }
  - { id: ERR_PHASE_NOT_PLANNED, http: 409, condition: "start/cancel requires phase PLANNED" }
  - { id: ERR_PHASE_NOT_IN_PROGRESS, http: 409, condition: "complete requires phase IN_PROGRESS" }
  - { id: ERR_CHANGE_ORDER_NOT_PROPOSED, http: 409, condition: "approve/reject requires change order PROPOSED" }
  - { id: ERR_REMAND_LIMIT_EXCEEDED, http: 409, condition: "REMAND motion when district.remand_count == 2" }
  # --- business: temporal / safety ---
  - { id: ERR_HEARING_NOTICE_TOO_SHORT, http: 422, condition: "hearing_date < now + 10 days" }
  - { id: ERR_HEARING_DATE_NOT_REACHED, http: 422, condition: "record-held before hearing_date" }
  - { id: ERR_OBJECTION_WINDOW_CLOSED, http: 422, condition: "Objection filed after objection_window_end" }
  - { id: ERR_OBJECTION_WINDOW_STILL_OPEN, http: 422, condition: "close-objection-window at or before objection_window_end" }
  - { id: ERR_PAYMENT_OPTION_WINDOW_CLOSED, http: 422, condition: "Payment-option selection or prepay payment after levy_date + 30 days" }
  - { id: ERR_SEASON_WINDOW_VIOLATION, http: 422, condition: "Phase dates not contained in the district construction season" }
  - { id: ERR_PHASE_START_NOT_REACHED, http: 422, condition: "Phase start before start_date 00:00:00Z" }
  # --- business: referential ---
  - { id: ERR_PARCEL_NOT_IN_DISTRICT, http: 422, condition: "Parcel does not belong to the petition's/hearing's district" }
  - { id: ERR_PHASE_NOT_IN_DISTRICT, http: 422, condition: "Linked phase does not belong to the change order's district" }
  # --- business: constraint ---
  - { id: ERR_DUPLICATE_PARCEL_NUMBER, http: 409, condition: "parcel_number already exists within the district" }
  - { id: ERR_DUPLICATE_OWNER_EMAIL, http: 409, condition: "email already registered" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "Parcel already has a SUBMITTED or VERIFIED signature on this petition" }
  - { id: ERR_DUPLICATE_OBJECTION, http: 409, condition: "Parcel already has a FILED or UNDER_REVIEW objection on this hearing" }
  - { id: ERR_INELIGIBLE_PARCEL, http: 409, condition: "Parcel is exempt or REMOVED (cannot sign, cannot be assessed, cannot be objected)" }
  - { id: ERR_PHASE_SCHEDULE_CONFLICT, http: 409, condition: "Same-crew phases require a >= 5 calendar-day gap" }
  - { id: ERR_CONSTRUCTION_CAPACITY_EXCEEDED, http: 409, condition: "More than 2 concurrent phases on some covered date" }
  - { id: ERR_VENUE_DATE_CONFLICT, http: 409, condition: "Same venue already hosts a non-terminal hearing on that UTC calendar date" }
  # --- business: fiscal ---
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Payment or change-order amount_cents <= 0" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "Payment amount exceeds the payoff quote at receipt time" }
  - { id: ERR_INVALID_PREPAY_AMOUNT, http: 422, condition: "PREPAY_FULL payment must equal preliminary_amount_cents exactly" }
  - { id: ERR_REFUND_EXCEEDS_CREDIT, http: 422, condition: "Refund amount <= 0 or exceeds credit_balance_cents" }
  - { id: ERR_TERM_NOT_ALLOWED, http: 422, condition: "term_years must be 5 or 10 when option=INSTALLMENTS, and must be absent for PREPAY_FULL" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Test-harness administrator; only drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: CityClerk
    description: "Municipal clerk: districts, owners, parcels, petitions, signature verification, hearings, objections, window close"
    identity: opaque
    exclusive_operations:
      - "POST /districts, POST /districts/{id}/abandon, POST /districts/{id}/close-objection-window"
      - "POST /owners, POST /parcels"
      - "POST /petitions, POST /petitions/{id}/close"
      - "POST /signatures/{id}/verify, POST /signatures/{id}/reject"
      - "POST /hearings, POST /hearings/{id}/record-held"
      - "POST /objections/{id}/start-review, /sustain, /overrule"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: CityEngineer
    description: "Municipal engineer: cost estimates, construction phases, change orders, construction completion"
    identity: opaque
    exclusive_operations:
      - "POST /cost-estimates, POST /cost-estimates/{id}/approve"
      - "POST /construction-phases, POST /construction-phases/{id}/start, /complete, /cancel"
      - "POST /change-orders, POST /change-orders/{id}/approve, /reject"
      - "POST /districts/{id}/complete-construction"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: FinanceOfficer
    description: "Finance officer: true-up, billing runs, refunds, payoff quotes"
    identity: opaque
    exclusive_operations:
      - "POST /districts/{id}/finalize-true-up, POST /districts/{id}/billing-run"
      - "POST /parcel-assessments/{id}/refund-credit"
    shared_operations:
      - "POST /parcel-assessments/{id}/payoff-quote (shared with the owning PropertyOwner)"
      - "GET endpoints (read-only)"
  - name: CouncilPresident
    description: "Council presiding officer: records resolutions and final acceptance"
    identity: opaque
    exclusive_operations:
      - "POST /resolutions"
      - "POST /districts/{id}/accept"
    shared_operations:
      - "GET endpoints (read-only)"
  - name: PropertyOwner
    description: "Property owner of record; acts only on own parcels' resources"
    identity: "entity_backed:PropertyOwner"
    exclusive_operations:
      - "POST /signatures (sign own parcel), POST /signatures/{id}/withdraw (own signature)"
      - "POST /objections (own parcel), POST /objections/{id}/withdraw (own objection)"
      - "POST /parcel-assessments/{id}/select-payment-option (own parcel's assessment)"
      - "POST /payments (own parcel's assessment)"
    shared_operations:
      - "POST /parcel-assessments/{id}/payoff-quote (own assessment; shared with FinanceOfficer)"
      - "GET endpoints (read-only)"
