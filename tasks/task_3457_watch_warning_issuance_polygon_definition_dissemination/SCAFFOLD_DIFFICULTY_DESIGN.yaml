              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${off_rt}", storm_event_id: "${storm_rt}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${fc_rt}"
              captures: { prod_rt: $.data.id, pv_rt: $.data.version }
            - call: "POST /alerts/products/${prod_rt}/issue"
              payload: { expected_product_version: "${pv_rt}" }
              as: Forecaster
              as_user_id: "${fc_rt}"
            - call: "GET /alerts/dissemination-records"
              payload: { product_id: "${prod_rt}" }
              as: Forecaster
              as_user_id: "${fc_rt}"
              captures: { rec_rt: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /_dissemination/settle"
              payload: { record_id: "${rec_rt}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { rc1: $.data.retry_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:07:00Z" }
              as: PlatformAdmin
            - call: "POST /_dissemination/settle"
              payload: { record_id: "${rec_rt}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { rc2: $.data.retry_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:09:00Z" }
              as: PlatformAdmin
            - call: "POST /_dissemination/settle"
              payload: { record_id: "${rec_rt}", outcome: "FAILED" }
              as: PlatformAdmin
              captures: { rec_final_status: $.data.status, rc3: $.data.retry_count }
          assert:
            - "after the 10:05 dispatch the record is SENT (requires_confirmation holds it short of CONFIRMED)"
            - "first FAILED settle: QUEUED with retry_count == 1; second: QUEUED with retry_count == 2 (the cycle loops)"
            - "third FAILED settle: status == DEAD and retry_count == 3 (MAX_RETRIES reached, terminal)"
            - "DisseminationRecord.${rec_rt}.sent_at is non-null and reflects the last dispatch"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: decline_cascade_reverts_product_and_cancels_sibling_requests
        grounds:
          - state_machines.CoordinationRequest.REQUESTED_to_DECLINED
          - state_machines.Product.PENDING_COORDINATION_to_DRAFT
          - state_machines.CoordinationRequest.REQUESTED_to_CANCELLED
        distinguishing_aspect: "Depth-3 cascade triggered by a decline: respond DECLINED mutates request R_AB (hop 1); that mutation reverts the Product PENDING_COORDINATION -> DRAFT (hop 2); the product's reversion cancels the still-REQUESTED sibling R_AC (hop 3) — each hop is caused by the previous mutation, not by the original call."
        test_recipe:
          setup:
            - "Offices A, B, C with HURRICANE agreements AB (timeout 15) and AC (timeout 20); zone ZA1 in A. A HURRICANE watch over ZA1 is PENDING_COORDINATION with two REQUESTED coordination requests."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KDAA", name: "Cascade A", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { d_off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KDBB", name: "Cascade B", region: "GULF", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { d_off_b: $.data.id }
