        claim_type: variant_divergence
        grounds:
          - calculations.model_submission_score
          - calculations.model_audit_score
        excluded_because:
          difficulty_instance: dual_variant_calc / model_score_submission_vs_audit_diverge
          rationale: "Submission vs audit divergence asserted in the named section 1.8 instance (86.7 vs 88.0)."

      - name: takeoff_rounding_order_stub
        claim_type: precision
        grounds:
          - calculations.quantity_extraction_total
        excluded_because:
          difficulty_instance: combinatorial_formula / takeoff_net_per_element_rounding_order
          rationale: "Per-element-then-sum rounding pinned and asserted (0.248 vs 0.247) in the named section 1.8 instance."

      - name: severity_threshold_boundary_stub
        claim_type: boundary_edge
        grounds:
          - calculations.clash_severity_classification
        excluded_because:
          difficulty_instance: boundary_precision_check / severity_classification_exact_50mm_boundary
          rationale: "The 50.0 / 50.1 / 0.0 classification boundaries are asserted in the named section 1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call without X-User-ID/X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — before role, existence, or business checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/projects/00000000-0000-0000-0000-000000000000", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even though the id is also unknown (auth before existence)"

      - name: existence_precedes_state_on_action_paths
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: "Accept on a non-existent model id returns 404 ERR_TRADE_MODEL_NOT_FOUND, not a state error — existence (priority 4) beats state (priority 6)."
        test_recipe:
          setup: ["project P"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "V2" }, as: VDCManager, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /api/trade-models/00000000-0000-0000-0000-000000000000/accept", payload: {}, as: BIMCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRADE_MODEL_NOT_FOUND (404), not ERR_MODEL_NOT_SUBMITTED"

      - name: cross_project_member_reference_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
        distinguishing_aspect: "Federated assembly referencing a trade model owned by ANOTHER project is rejected with ERR_CROSS_PROJECT_REFERENCE (422) — the model exists and is ACTIVE, so only the referential rule can fire."
        test_recipe:
          setup: ["projects A and B; model MB accepted in project B"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "V3A" }, as: VDCManager, captures: { pidA: $.data.id, pvA: $.data.version } }
            - { call: "POST /api/projects", payload: { name: "V3B" }, as: VDCManager, captures: { pidB: $.data.id } }
            - { call: "POST /api/projects/${pidB}/trade-partners", payload: { company_name: "StructCoB", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${pidB}/trade-models", payload: { trade_partner_id: "${pb}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${pb}", captures: { mb: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pidA}/federated-models", payload: { label: "FA", target_format: IFC, member_trade_model_ids: ["${mb}"], expected_project_version: "${pvA}" }, as: VDCManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CROSS_PROJECT_REFERENCE (422)"
            - "no federated model is created in project A"

      - name: duplicate_discipline_in_assembly_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY]
        distinguishing_aspect: "Two member models of the SAME discipline in one assembly are individually valid but collectively rejected with ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY (409)."
        test_recipe:
          setup: ["project P; partner P1; models M1 and M2 both STRUCTURAL"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "V4" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}", "${m2}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_DISCIPLINE_IN_ASSEMBLY (409)"

      - name: freeze_blocked_by_member_audit_below_threshold
        claim_type: conditional_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD]
          - calculations.model_audit_score
        distinguishing_aspect: "Freeze is gated on every member's audit_score >= 70.0: a model with ls 3/10, env 10/10, fin 10/10 computes audit 65.0 (despite submission 76.7), so the ASSEMBLED federated model cannot freeze -> ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD (422)."
        test_recipe:
          setup: ["project P; partner P1; low-audit model MLOW accepted (audit 65.0); F1 [MLOW] ASSEMBLED"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "V5" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 3, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { mlow: $.data.id } }
            - { call: "POST /api/trade-models/${mlow}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}", captures: { sub: $.data.submission_score } }
            - { call: "POST /api/trade-models/${mlow}/accept", payload: {}, as: BIMCoordinator, captures: { aud: $.data.audit_score } }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${mlow}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
          trigger:
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager, captures: { err: $.data.error_id } }
          assert:
            - "setup check: submission_score == 76.7 and audit_score == 65.0"
            - "freeze: error_id == ERR_MEMBER_COMPLIANCE_BELOW_THRESHOLD (422); F1 stays ASSEMBLED"

      - name: duplicate_lod_requirement_and_partner_name_rejected
        claim_type: aggregate_validation
        grounds:
          - errors[ERR_DUPLICATE_LOD_REQUIREMENT]
          - errors[ERR_DUPLICATE_TRADE_PARTNER]
        distinguishing_aspect: "Tenant-scoped uniqueness: a second LodRequirement for the same (discipline, phase) -> ERR_DUPLICATE_LOD_REQUIREMENT; a second TradePartner with the same company_name in the same project -> ERR_DUPLICATE_TRADE_PARTNER."
        test_recipe:
          setup: ["project P with one requirement and one partner already created"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "V6" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/lod-requirements", payload: { discipline: STRUCTURAL, phase: SCHEMATIC_DESIGN, min_lod: 300, clearance_requirement_mm: 25.0 }, as: VDCManager }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager }
          trigger:
            - { call: "POST /api/projects/${pid}/lod-requirements", payload: { discipline: STRUCTURAL, phase: SCHEMATIC_DESIGN, min_lod: 200, clearance_requirement_mm: 10.0 }, as: VDCManager, captures: { e1: $.data.error_id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: ELECTRICAL, hourly_rate_cents: 9000, coordination_budget_hours: 10.0, software_platform: TEKLA }, as: VDCManager, captures: { e2: $.data.error_id } }
          assert:
            - "duplicate (discipline, phase): ERR_DUPLICATE_LOD_REQUIREMENT (409)"
            - "duplicate company_name: ERR_DUPLICATE_TRADE_PARTNER (409)"

      - name: commitment_trade_mismatch_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_COMMITMENT_TRADE_MISMATCH]
        distinguishing_aspect: "A commitment whose committed_by_partner_id differs from the clash's assigned partner is rejected with ERR_COMMITMENT_TRADE_MISMATCH (422) even though both partners exist in the project."
