# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "malformed request: missing required field, bad enum, bad type" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown role or user headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, or Customer acting on another customer's resource" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store id does not exist" }
  - { id: ERR_ARTICLE_NOT_FOUND, http: 404, condition: "article id does not exist" }
  - { id: ERR_CARTON_NOT_FOUND, http: 404, condition: "carton id does not exist" }
  - { id: ERR_BIN_STOCK_NOT_FOUND, http: 404, condition: "bin-stock id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order line id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "delivery slot id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "delivery booking id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "assembly job id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "spare-part claim id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "return request id does not exist" }
  - { id: ERR_RETURN_LINE_NOT_FOUND, http: 404, condition: "return line id does not exist" }
  - { id: ERR_STANDARD_NOT_FOUND, http: 404, condition: "assembly standard id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource is in the wrong state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_BIN_STOCK, http: 409, condition: "BinStock row already exists for (store_id, carton_id)" }
  - { id: ERR_DUPLICATE_BOOKING, http: 409, condition: "order already has a non-terminal delivery booking (delivery_status != NONE)" }
  - { id: ERR_UNGRADED_LINES, http: 409, condition: "settle attempted while at least one return line has no condition_grade" }
  - { id: ERR_RESERVATION_EXPIRED, http: 409, condition: "fulfill attempted at or after expires_at; reservation transitions to EXPIRED" }
  - { id: ERR_ORDER_NOT_RETURNABLE, http: 409, condition: "receipted return references an order not in {FULFILLED, DELIVERED, CLOSED}" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "every carton of an article is short for the requested quantity (or no carton/stock rows exist)" }
  - { id: ERR_MULTI_CARTON_SHORTAGE, http: 422, condition: "multi-carton article: some cartons have sufficient stock but at least one carton is short; the full set must be picked together" }
  - { id: ERR_BOOKING_NEVER_FITS, http: 422, condition: "booking alone exceeds the slot's total capacity even when empty" }
  - { id: ERR_ACCESS_INFEASIBLE, http: 422, condition: "WALKUP_HIGH access with any carton heavier than 40 kg" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 422, condition: "assembly window collides with another non-terminal job of the same provider within the 30-minute buffer" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "assembly window_start is before now, or window_end <= window_start" }
  - { id: ERR_SLOT_IN_PAST, http: 422, condition: "delivery slot service_date is before the current date" }
  - { id: ERR_STANDARD_MISSING, http: 422, condition: "a requires_assembly line has no AssemblyStandard row" }
  - { id: ERR_RECEIPT_REQUIRED, http: 422, condition: "no-receipt return line for a customer who is not an ACTIVE family member" }
  - { id: ERR_RETURN_QTY_EXCEEDED, http: 422, condition: "receipted return qty exceeds (order line qty - returned_qty)" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "redeem_points exceeds the customer's points_balance" }
  - { id: ERR_CLAIM_LIMIT_EXCEEDED, http: 422, condition: "customer already has 3 APPROVED/SHIPPED claims in the rolling 365-day window" }
  - { id: ERR_CLAIM_VALUE_EXCEEDED, http: 422, condition: "approving would push rolling 365-day claim value above 3000 cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller placeholder (missing/blank X-User-Role and X-User-ID); every endpoint rejects it with ERR_UNAUTHENTICATED"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []

  - name: PlatformAdmin
    description: "Platform operator; manages stores, catalog, cartons, assembly standards, customers, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/stores"
      - "POST /api/articles"
      - "PATCH /api/articles/{id}"
      - "POST /api/articles/{id}/cartons"
      - "POST /api/assembly-standards"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/customers"

  - name: StoreOps
    description: "In-store operations staff; manages stock, reservations, pickup handover, returns grading, spare-part claim review"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/bin-stock and POST /api/bin-stock/{id}/adjust"
      - "POST /api/stores/{id}/run_sweep"
      - "POST /api/customers/{id}/enroll"
      - "POST /api/reservations/{id}/fulfill"
      - "POST /api/orders/{id}/pickup-complete"
      - "POST /api/returns/{id}/lines/{line_id}/grade, /settle, /reopen"
      - "POST /api/spare-part-claims/{id}/review and /ship"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/customers"
      - "POST /api/reservations/{id}/cancel"

  - name: DeliveryCoordinator
    description: "Delivery network operator; manages slots and drives bookings out for delivery"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/delivery-slots"
      - "POST /api/delivery-bookings/{id}/start and /complete"
    shared_operations:
      - "all GET endpoints"
      - "POST /api/delivery-bookings/{id}/cancel"

  - name: AssemblyProvider
    description: "Third-party assembly crew; drives job lifecycle after dispatch"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/assembly-jobs/{id}/dispatch, /start, /hold, /resume, /complete"
    shared_operations:
      - "all GET endpoints"

  - name: Customer
    description: "Shoppers; own their orders, reservations, bookings, assembly requests, claims, and returns"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/orders, /lines, /checkout, /cancel, /close"
      - "POST /api/reservations (standalone)"
      - "POST /api/orders/{id}/delivery-bookings"
      - "POST /api/orders/{id}/assembly-jobs and /api/assembly-jobs/{id}/cancel"
      - "POST /api/spare-part-claims"
      - "POST /api/returns, /lines, /submit, /dispute"
    shared_operations:
      - "all GET endpoints (own resources only)"
      - "POST /api/reservations/{id}/cancel"
      - "POST /api/delivery-bookings/{id}/cancel"
