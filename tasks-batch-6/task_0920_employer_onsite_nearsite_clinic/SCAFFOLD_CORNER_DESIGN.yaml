  - section: errors
    instances:

      - name: request_without_identity_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying neither X-User-Role nor X-User-ID is refused at rung 1 with 401 ERR_UNAUTHENTICATED before any other rung, including the role check, runs."
        test_recipe:
          setup: ["Empty database. The trigger request is sent with NO X-User-Role and NO X-User-ID header, which is why no `as:` role is declared on it."]
          setup_api_calls: []
          trigger:
            - call: "GET /employers/5f3ec0f1-1c62-4f61-9b1a-0e7c9a2d4b33"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "The response is not 404 and not 403"

      - name: participant_role_forbidden_from_creating_employers
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.ProgramAdmin
        distinguishing_aspect: "POST /employers lists only ProgramAdmin, so a Participant-role caller is refused at rung 2 with 403 ERR_FORBIDDEN_ROLE rather than reaching the payload rung."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "Sneaky Co", employer_code: "SNK", annual_total_cost_of_coverage_cents: 1200000, wellness_budget_cents: 250000 }
              as: Participant
              as_user_id: "0a55cbe4-8b0a-4a5f-9c19-2f11d7e64d10"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "No Employer is created"

