            - "one row has destination_type HUB with pickup_hub_id ${hub_id} and pounds 2.50"
            - "one row has destination_type ROUTE with delivery_zone_id ${zone_id} and pounds 2.50"
            - "both rows have status IN_TRANSIT and landing_lot_id ${lot_id}"
            - "LandingLot.${lot_id}.split_pounds_total == 5.00"
            - "LandingLot.${lot_id}.status == SPLIT"

