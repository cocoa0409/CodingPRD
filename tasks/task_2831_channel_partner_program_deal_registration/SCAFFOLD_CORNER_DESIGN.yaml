              captures: { acc_pl_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_pl_a_id}", account_id: "${acc_pl_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_pl_a_id}"
              captures: { r_pl_a_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_pl_b_id}", account_id: "${acc_pl_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 500000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_pl_b_id}"
              captures: { r_pl_b_id: $.data.id }
          trigger:
            - call: "GET /deal-registrations"
              payload: {}
              as: Partner
              as_user_id: "${p_pl_b_id}"
            - call: "GET /deal-registrations"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "the Partner listing returns total_count == 1 with the single row ${r_pl_b_id}"
            - "${r_pl_a_id} never appears in the Partner listing"
            - "the analyst listing returns total_count == 2 covering both rows"
            - "both responses carry limit == 10, offset == 0 and has_more == false"

  # =========================================================================
  # Cross-cutting complexity layers
  # (dual_variant_calculation, cascading_side_effects, optimistic_concurrency,
  #  rate_threshold_triggers)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_registration_version_blocks_a_special_pricing_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[spr-create-stale-registration]
          - errors[ERR_STALE_REGISTRATION_VERSION]
          - endpoints[POST /special-pricing-requests]
        distinguishing_aspect: "Because a fresh request legitimately supersedes the pending one, only the OCC guard can stop a blind second create: the same body replayed with the pre-create registration version returns ERR_STALE_REGISTRATION_VERSION 412, and re-reading the version makes it succeed and supersede the first request."
        test_recipe:
          setup:
            - "Clock 2026-04-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; one account; the ANALYTICS_ADDON registration APPROVED with a live window."
            - "The client reads the registration once and keeps that version; the first special-pricing create then increments DealRegistration.version by 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_oc_id: $.data.id }
            - call: "POST /partners/${p_oc_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_oc_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_oc_id}", account_id: "${acc_oc_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_oc_id}"
              captures: { r_oc_id: $.data.id }
            - call: "POST /deal-registrations/${r_oc_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_oc_id}"
            - call: "POST /deal-registrations/${r_oc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${r_oc_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "GET /deal-registrations/${r_oc_id}"
              payload: {}
              as: Partner
              as_user_id: "${p_oc_id}"
              captures: { r_oc_v1: $.data.version }
            - call: "POST /special-pricing-requests"
              payload: { registration_id: "${r_oc_id}", requested_extra_margin_pct: 0.02, justification: "first request", expected_registration_version: "${r_oc_v1}" }
              as: Partner
              as_user_id: "${p_oc_id}"
              captures: { spr_oc1_id: $.data.id }
          trigger:
            - call: "POST /special-pricing-requests"
              payload: { registration_id: "${r_oc_id}", requested_extra_margin_pct: 0.03, justification: "blind retry on a stale read", expected_registration_version: "${r_oc_v1}" }
              as: Partner
              as_user_id: "${p_oc_id}"
            - call: "GET /deal-registrations/${r_oc_id}"
              payload: {}
              as: Partner
              as_user_id: "${p_oc_id}"
              captures: { r_oc_v2: $.data.version }
            - call: "POST /special-pricing-requests"
              payload: { registration_id: "${r_oc_id}", requested_extra_margin_pct: 0.03, justification: "retry after re-reading the version", expected_registration_version: "${r_oc_v2}" }
              as: Partner
              as_user_id: "${p_oc_id}"
              captures: { spr_oc2_id: $.data.id }
          assert:
            - "the stale create returns error_id == ERR_STALE_REGISTRATION_VERSION with http_status 412"
            - "after the refusal SpecialPricingRequest.${spr_oc1_id}.status is still SUBMITTED and DealRegistration.${r_oc_id}.version is unchanged (a rejected write bumps nothing)"
            - "the fresh-version create returns 201 with SpecialPricingRequest.${spr_oc2_id}.status == SUBMITTED and requested_extra_margin_pct == 0.03"
            - "SpecialPricingRequest.${spr_oc1_id}.status == SUPERSEDED with approved_extra_margin_pct == 0.0"
            - "DealRegistration.${r_oc_id}.version was incremented exactly once per accepted special-pricing create, so ${r_oc_v2} == ${r_oc_v1} + 1"

      - name: stale_account_version_blocks_an_account_mapping_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[mapping-create-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - endpoints[POST /account-mappings]
        distinguishing_aspect: "A PROPOSED mapping may coexist with any coverage state, so nothing but the OCC guard rejects a create built on a stale coverage read: replaying the pre-create Account.version returns ERR_STALE_ACCOUNT_VERSION 412 even though the requested window is conflict-free."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one RESELLER partner and one OPEN_CHANNEL account."
            - "The client reads the account once; the first mapping create then increments Account.version by 1."
            - "The second window [2026-10-01T00:00:00.000Z, 2026-10-31T23:59:59.999Z] clears the first window's blocked band [2026-05-01T00:00:00.000Z, 2026-06-14T23:59:59.999Z], so priority 31 is satisfied and only priority 8 can fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_ao_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_ao_id: $.data.id }
            - call: "GET /accounts/${acc_ao_id}"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_ao_v1: $.data.version }
            - call: "POST /account-mappings"
              payload: { partner_id: "${p_ao_id}", account_id: "${acc_ao_id}", product_line: "ANALYTICS_ADDON", exclusivity_scope: "PRODUCT_LINE", effective_from: "2026-05-01T00:00:00.000Z", effective_until: "2026-05-31T23:59:59.999Z", expected_account_version: "${acc_ao_v1}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { map_ao1_id: $.data.id }
          trigger:
            - call: "POST /account-mappings"
              payload: { partner_id: "${p_ao_id}", account_id: "${acc_ao_id}", product_line: "ANALYTICS_ADDON", exclusivity_scope: "PRODUCT_LINE", effective_from: "2026-10-01T00:00:00.000Z", effective_until: "2026-10-31T23:59:59.999Z", expected_account_version: "${acc_ao_v1}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "GET /accounts/${acc_ao_id}"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_ao_v2: $.data.version }
            - call: "POST /account-mappings"
              payload: { partner_id: "${p_ao_id}", account_id: "${acc_ao_id}", product_line: "ANALYTICS_ADDON", exclusivity_scope: "PRODUCT_LINE", effective_from: "2026-10-01T00:00:00.000Z", effective_until: "2026-10-31T23:59:59.999Z", expected_account_version: "${acc_ao_v2}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { map_ao2_id: $.data.id }
          assert:
            - "the stale create returns error_id == ERR_STALE_ACCOUNT_VERSION with http_status 412 and writes no AccountMapping row"
            - "${acc_ao_v2} == ${acc_ao_v1} + 1 (only the accepted first create bumped the account)"
            - "the fresh-version create returns 201 with AccountMapping.${map_ao2_id}.mapping_status == PROPOSED and counter_round == 0"
            - "AccountMapping.${map_ao1_id} is untouched throughout: mapping_status == PROPOSED with effective_until == 2026-05-31T23:59:59.999Z"
            - "Account.${acc_ao_id}.coverage_state is still OPEN_CHANNEL (a proposed mapping protects nothing)"

      - name: four_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.DealRegistration.UNDER_REVIEW_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_registration_approval_to_partner_probation_depth_four
          rationale: "That instance asserts every hop of the four-level approval cascade in order, including the hop that only fires because the previous one did."

      - name: compensating_cascade_reverses_every_original_side_effect
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.MdfClaim.VALIDATED_to_REJECTED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_claim_clawback_to_marketing_probation_depth_four
          rationale: "That instance claws back a validated claim and asserts the four reversal hops down to the partner's marketing standing."

      - name: both_scoring_variants_are_computed_from_the_same_rows
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.partner_tier_scoring.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_tier_divergence_on_performance_review
          rationale: "That instance asserts both variants' stored figures and the divergent tiers they recommend and approve."

      - name: open_conflict_count_trips_probation_at_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.conflict_recommendation.constants.CONFLICT_PROBATION_THRESHOLD
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_registration_approval_to_partner_probation_depth_four
          rationale: "That instance walks open_conflict_count to CONFLICT_PROBATION_THRESHOLD and asserts the probation and entitlement demotion that fire exactly there."

  # =========================================================================
  # Consistency model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.partner_revenue_rollup
          - endpoints[POST /order-invoices/{id}/invoice]
        distinguishing_aspect: "The consistency model is immediate: the invoicing response itself already carries the new status and invoiced_at, and a GET of the partner in the very next call shows the recomputed trailing_revenue_cents with no settling delay or re-read loop."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one REGISTERED RESELLER partner; one DROP_SHIP order of list 1,000,000 priced at 0.1000 (invoice 900,000) and still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_im_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_im_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_im_id: $.data.id }
          trigger:
            - call: "POST /order-invoices/${inv_im_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "GET /partners/${p_im_id}"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "Partner.${p_im_id}.trailing_revenue_cents == 0 before the invoice call"
            - "the invoice response body already reports status == INVOICED and invoiced_at == 2026-03-01T00:00:00.000Z"
            - "the immediately following GET reports Partner.${p_im_id}.trailing_revenue_cents == 900000"
            - "no second read is needed for the figure to appear and no intermediate value is ever observable"

      - name: every_cascade_hop_is_visible_without_a_re_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_b_claim_clawback_to_marketing_probation_depth_four
          rationale: "That instance asserts all four clawback hops from the single mutating response and the reads that immediately follow it, which is the immediate-consistency claim in its strongest form."
