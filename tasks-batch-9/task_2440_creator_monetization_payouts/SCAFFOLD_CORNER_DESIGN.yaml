            - "ContentItem.${ci}.suitability_rating == 'GREEN'"
            - "Creator.${cr}.active_strike_count == 0"
            - "GET /monetization/investigations?creator_id=${cr}: total_count == 0"

      - name: policy_reviewer_cannot_read_the_money_surface
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[PolicyReviewer].scoping"
          - "roles[PolicyReviewer].shared_operations"
        distinguishing_aspect: "PolicyReviewer's read list deliberately omits statements, payouts, ledger entries and funds, so all four reads are 403 for a reviewer that can freely read the same creator's content and investigations."
        test_recipe:
