        grounds:
          - calculations.announcer_script_timing
          - errors[ERR_SPONSOR_MINUTES_UNMET]
          - entities.ParadeEvent.fields.script_finalized
        distinguishing_aspect: |
          Different metric (allocated SECONDS) on a different endpoint
          (finalize-script): the GOLD tier gate is allocated_seconds >= 120.
          Exactly 120 seconds passes; 119 seconds fails — the inclusive boundary
          is the observable.
        test_recipe:
          setup:
            - "Parade A with an ACTIVE GOLD sponsor and two APPROVED SPONSOR_READ items of 1.0 minute each (60 + 60 = 120 s); Parade B with an ACTIVE GOLD sponsor and items of 1.0 and 0.98 minutes (60 + 59 = 119 s)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Sponsor Parade A", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { pa: $.data.id } }
            - { call: "POST /parades/${pa}/sponsors", payload: { sponsor_name: "Gold A", tier: "GOLD", contribution_cents: 900000 }, as: CommitteeAdmin, captures: { spa: $.data.id } }
            - { call: "POST /sponsors/${spa}/activate", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${pa}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 1, duration_minutes: 1.0, sponsor_id: "${spa}" }, as: CommitteeAdmin, captures: { ia1: $.data.id } }
            - { call: "POST /parades/${pa}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 2, duration_minutes: 1.0, sponsor_id: "${spa}" }, as: CommitteeAdmin, captures: { ia2: $.data.id } }
            - { call: "POST /script-items/${ia1}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /script-items/${ia2}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades", payload: { name: "Sponsor Parade B", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { pb: $.data.id } }
            - { call: "POST /parades/${pb}/sponsors", payload: { sponsor_name: "Gold B", tier: "GOLD", contribution_cents: 900000 }, as: CommitteeAdmin, captures: { spb: $.data.id } }
            - { call: "POST /sponsors/${spb}/activate", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${pb}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 1, duration_minutes: 1.0, sponsor_id: "${spb}" }, as: CommitteeAdmin, captures: { ib1: $.data.id } }
            - { call: "POST /parades/${pb}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 2, duration_minutes: 0.98, sponsor_id: "${spb}" }, as: CommitteeAdmin, captures: { ib2: $.data.id, ib2_secs: $.data.duration_seconds } }
            - { call: "POST /script-items/${ib1}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /script-items/${ib2}/approve", payload: {}, as: CommitteeAdmin }
          trigger:
            - { call: "POST /parades/${pa}/finalize-script", payload: {}, as: CommitteeAdmin, captures: { fin_a: $.data.script_finalized } }
            - { call: "POST /parades/${pb}/finalize-script", payload: {}, as: CommitteeAdmin, captures: { err_b: $.data.error_id } }
          assert:
            - "Parade A finalize succeeds with script_finalized == true — exactly 120 allocated seconds meets GOLD's >= 120 gate"
            - "Parade B finalize fails with ERR_SPONSOR_MINUTES_UNMET — 60 + round_half_up(0.98 x 60) = 60 + 59 = 119 seconds is below the gate"
            - "HTTP status of the Parade B finalize == 422"

  - rule_id: cross_entity_state_dependency
