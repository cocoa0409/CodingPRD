              captures: { hi_status_after: $.data.status }
            - call: "POST /retraining-triggers/${t_lo}/disposition"
              payload: { action: "DISMISS", dismissed_reason: "known seasonal shift, inside tolerance" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { lo_status: $.data.status, lo_reason: $.data.dismissed_reason }
            - call: "GET /models/${m_id}"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
