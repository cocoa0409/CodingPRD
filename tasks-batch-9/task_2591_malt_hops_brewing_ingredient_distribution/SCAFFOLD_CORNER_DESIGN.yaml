          - validations[priority=44]
          - validations[priority=45]
          - calculations.brewer_credit_posture
        distinguishing_aspect: "ERR_CREDIT_LIMIT_EXCEEDED and ERR_BREWER_CREDIT_HOLD are different refusals: the brewer here sits at 95.38 percent, which is WATCH and NOT a hold, so priority 44 passes and the second order is refused only because priority 45 adds its freshly computed total_cents to the standing exposure."
        test_recipe:
          setup:
