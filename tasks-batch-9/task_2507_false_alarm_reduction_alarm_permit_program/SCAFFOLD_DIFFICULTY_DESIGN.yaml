  - rule_id: resource_temporal_overlap
    instances:
      - name: docket_touching_the_previous_session_end_collides_and_cancellation_frees_the_interval
        grounds:
          - calculations.docket_session_overlap
          - "validations[priority=39]"
          - state_machines.HearingDocket.OPEN_to_CANCELLED
        distinguishing_aspect: >-
          A session for the same hearing officer that starts exactly when the previous one ends leaves a
          0-minute gap and must be rejected with 409 ERR_DOCKET_SESSION_OVERLAP, yet the identical
          interval is accepted for a different officer, and it becomes accepted for the same officer
          once the earlier session is CANCELLED.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, so every session below is strictly in the future (priority 31 cannot fire)."
            - "Hearing officer ho-2507 already owns an OPEN docket on 2026-03-10 from 09:00Z to 12:00Z; hearing officer ho2-2507 owns nothing."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-10T09:00:00Z", session_end: "2026-03-10T12:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {dock_base: $.data.id}}
          trigger:
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-10T12:00:00Z", session_end: "2026-03-10T14:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {err_dock_touch: $.data.error_id}}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho2-2507", session_start: "2026-03-10T09:00:00Z", session_end: "2026-03-10T12:00:00Z", location: "Hearing Room B", capacity: 4}, as: ProgramAdministrator, captures: {dock_other_officer: $.data.id}}
            - {call: "POST /false-alarm-program/hearing-dockets/${dock_base}/cancel", payload: {cancellation_reason: "Officer reassigned to an emergency arraignment calendar."}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-10T12:00:00Z", session_end: "2026-03-10T14:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {dock_after_cancel: $.data.id}}
          assert:
            - "first trigger -> HTTP 409 with error_id == 'ERR_DOCKET_SESSION_OVERLAP' (12:00 < 12:00 + 15 min, so the buffer is violated even with a zero-length gap)"
            - "second trigger -> HTTP 201: the same 09:00-12:00 interval is legal for ho2-2507 because candidates are filtered by hearing_officer_user_id"
            - "HearingDocket.${dock_base}.status == 'CANCELLED' after the third call"
            - "fourth trigger -> HTTP 201 and HearingDocket.${dock_after_cancel}.session_start == '2026-03-10T12:00:00Z' (CANCELLED sessions are not candidates, so the interval is free)"
            - "GET /false-alarm-program/hearing-dockets?hearing_officer_user_id=ho-2507 returns total_count == 2 (one CANCELLED, one OPEN)"

      - name: docket_session_is_legal_only_from_exactly_fifteen_minutes_after_the_neighbouring_session
        grounds:
          - calculations.docket_session_overlap
          - "validations[priority=39]"
          - entities.HearingDocket.fields.session_start
        distinguishing_aspect: >-
          The buffer is strict and symmetric: for an existing 09:00-12:00 session a new session starting
          at 12:14 is rejected while 12:15 exactly is accepted, and on the other side a session ending
          at 08:46 is rejected while one ending at 08:45 exactly is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "Hearing officer ho-2507 owns one OPEN docket on 2026-03-12 from 09:00Z to 12:00Z and nothing else."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-12T09:00:00Z", session_end: "2026-03-12T12:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {dock_mid: $.data.id}}
          trigger:
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-12T12:14:00Z", session_end: "2026-03-12T13:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {err_dock_14: $.data.error_id}}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-12T12:15:00Z", session_end: "2026-03-12T14:00:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {dock_after: $.data.id}}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-12T07:00:00Z", session_end: "2026-03-12T08:46:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {err_dock_before: $.data.error_id}}
            - {call: "POST /false-alarm-program/hearing-dockets", payload: {hearing_officer_user_id: "ho-2507", session_start: "2026-03-12T07:00:00Z", session_end: "2026-03-12T08:45:00Z", location: "Hearing Room A", capacity: 4}, as: ProgramAdministrator, captures: {dock_before: $.data.id}}
          assert:
            - "first trigger -> HTTP 409 ERR_DOCKET_SESSION_OVERLAP (12:14 < 12:00 + 15 min)"
            - "second trigger -> HTTP 201: 12:15 is NOT strictly less than 12:00 + 15 min, so the back-to-back session is legal"
            - "third trigger -> HTTP 409 ERR_DOCKET_SESSION_OVERLAP (existing 09:00 < 08:46 + 15 min = 09:01, the buffer applies on the earlier side too)"
            - "fourth trigger -> HTTP 201: 09:00 is NOT strictly less than 08:45 + 15 min = 09:00"
            - "GET /false-alarm-program/hearing-dockets?hearing_officer_user_id=ho-2507 returns total_count == 3, all OPEN, with session_starts 07:00, 09:00 and 12:15"
            - "capacity is untouched by all four calls: every created docket has scheduled_appeal_count == 0 and capacity == 4"

      - name: suspension_period_with_a_touching_or_contained_interval_collides_under_closed_semantics
        grounds:
          - calculations.suspension_period_overlap
          - "validations[priority=40]"
          - entities.SuspensionOrder.fields.effective_from
        distinguishing_aspect: >-
          Unlike the docket geometry, suspension intervals are CLOSED with no buffer: a new order whose
          effective_from equals the live order's effective_through (2026-05-20) is a conflict, a fully
          contained 2026-05-01 .. 2026-05-10 interval is a conflict, but an interval ending the day
          before the live order starts (2026-04-13 .. 2026-04-19) is accepted with zero gap tolerance.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with suspension_threshold_count 2, probation_threshold_count 4, free_alarm_allowance 0, single tier [1..null: 10000], invoice_due_days 3650."
            - "One RESIDENTIAL AlarmSite with two ACTIVE ECV-callable contacts and two PERMITTED systems."
            - "The first incident is determined COUNTED on 2026-04-05 (count 1, no order) and the second on 2026-04-10, which takes the count to exactly 2 and auto-creates PROPOSED order O1 for 2026-04-20 .. 2026-05-20."
            - "The clock is then 2026-04-12, so every effective_from below is at or after the clock and at or after both incidents' occurred_at (priority 29 cannot fire), and the count of 2 keeps the basis valid (priority 49 cannot fire)."
