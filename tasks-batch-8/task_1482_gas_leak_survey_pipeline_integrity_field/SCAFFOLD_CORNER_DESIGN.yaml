              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-ENV", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { rtype: $.response_type, req_id: $.meta.api_request_id, code: $.data.segment_code }
          assert:
            - "rtype == object"
