            - "after trigger[3]: EquipmentItem.${i_rc}.insured_value_cents == 4400000 (4000000 * 11000 / 10000) and rated_premium_cents == 114103"
            - "after trigger[5]: EquipmentItem.${i_sa}.insured_value_cents == 3500000 (min of the 3500000 stated amount and the 4400000 indexed cost) and rated_premium_cents == 85239"
