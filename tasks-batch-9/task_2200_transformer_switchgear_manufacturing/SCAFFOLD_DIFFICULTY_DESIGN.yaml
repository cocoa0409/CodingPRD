            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders/${ord_id}/warranty-claims"
              payload: { claim_number: "WC-XED-2", suspect_component_id: "${comp_id}", failure_reported_at: "2028-02-29T11:59:59Z", parts_claim_cents: 100000, labor_claim_cents: 0, freight_claim_cents: 0, consequential_claim_cents: 0 }
              as: ContractAdmin
              captures: { wc_2: $.data.id }
            - call: "POST /engineered-orders/${ord_id}/warranty-claims"
              payload: { claim_number: "WC-XED-3", suspect_component_id: "${comp_id}", failure_reported_at: "2028-02-29T12:00:00Z", parts_claim_cents: 100000, labor_claim_cents: 0, freight_claim_cents: 0, consequential_claim_cents: 0 }
              as: ContractAdmin
          assert:
            - "immediately after energize (zero punch items) CommissioningJob.${job_id}.status == PUNCH_OPEN, energized_at == 2026-08-31T12:00:00Z, completion_ratio_bp == 10000 -- the empty-set boundary reports COMPLETE-looking 10000 bp yet the job does NOT auto-complete because the transition is evaluated only on PunchListItem state changes"
            - "after the three items are created: open_punch_count == 3, blocking_punch_count == 1, completion_ratio_bp == 0 (floor(0 * 10000 / 3)) -- the ratio REGRESSES from 10000 to 0"
            - "trigger call 1 -> 409 ERR_WARRANTY_WINDOW_UNAVAILABLE: no CommissioningJob on the order is COMPLETE, so calc warranty_window_expiry has no anchor even though energized_at is already set; no WarrantyClaim row is created"
            - "after rejecting pi_minor: total drops to 2 because REJECTED rows leave BOTH numerator and denominator, so completion_ratio_bp stays 0 (not 3333); open_punch_count == 2, blocking_punch_count == 1, status still PUNCH_OPEN"
            - "trigger call 3 -> 409 ERR_WARRANTY_WINDOW_UNAVAILABLE (identical payload, identical error) -- rejecting an item is not closing it"
            - "after closing pi_block: completion_ratio_bp == 5000 (floor(1 * 10000 / 2)), blocking_punch_count == 0, open_punch_count == 1, status still PUNCH_OPEN -- clearing the only BLOCKING item is not sufficient, open_punch_count == 0 is also required"
            - "trigger call 8 -> 409 ERR_WARRANTY_WINDOW_UNAVAILABLE for the third time"
            - "after closing pi_major: open_punch_count == 0 and blocking_punch_count == 0 and energized_at non-null, so CommissioningJob.${job_id} flips PUNCH_OPEN -> COMPLETE with startup_certificate_issued == true and completion_ratio_bp == 10000, and EngineeredOrder.${ord_id}.fulfillment_status is re-evaluated COMMISSIONING -> CLOSED"
            - "trigger call 13 -> 201 with the SAME payload that failed three times: WarrantyClaim.${wc_1}.status == SUBMITTED. No call in this recipe ever addressed the job or the order, so the createability of the claim is a pure function of grandchild PunchListItem states (and P34's terminal-state guard does not treat the now-CLOSED owning order as the target row of a warranty-claim create)"
            - "WC-XED-2 (failure_reported_at 2028-02-29T11:59:59Z) -> 201: expiry is anchor 2026-08-31T12:00:00Z + 18 calendar months with day-of-month 31 clamped to the last day of Feb 2028, i.e. 2028-02-29T12:00:00Z (2028 is a leap year, so the clamp lands on 29 not 28), and 11:59:59 is strictly before it"
            - "WC-XED-3 (failure_reported_at exactly 2028-02-29T12:00:00Z) -> 409 ERR_WARRANTY_WINDOW_EXPIRED: equality with the expiry instant is EXPIRED, one second apart from the accepted claim"
            - "the 18-month window (not 12) is used because product_family == POWER_TRANSFORMER"

  - rule_id: resource_temporal_overlap
    instances:

      - name: bay_window_half_open_boundary_with_changeover_buffer_inside_the_window
        grounds:
          - calculations.bay_occupation_window
          - entities.TestBay.fields.changeover_buffer_hours
          - entities.TestBay.fields.scheduled_hours_total
          - entities.FactoryAcceptanceTest.fields.window_end_at
          - validations[priority=60]
        distinguishing_aspect: |
          On a bay with changeover_buffer_hours 3 a 6-hour test starting 2026-07-01T08:00:00Z
          occupies [08:00, 17:00): a second test starting 16:59:00Z is rejected 409
          ERR_BAY_WINDOW_CONFLICT (the buffer is INSIDE the window, so a gap-model
          implementation that ends the window at 14:00 wrongly accepts it) while a second test
          starting at exactly 17:00:00Z is ACCEPTED (half-open, so a closed-interval
          implementation wrongly rejects it), and a third test whose window_end_at lands exactly
          on 08:00:00Z is accepted on the mirror edge.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T00:00:00Z."
            - "EngineeredOrder TX-OVL-0001, POWER_TRANSFORMER, rated_kv 12, driven to fulfillment_status IN_PRODUCTION."
            - "One TestBay BAY-OVL: max_kv 145, changeover_buffer_hours 3, supports_impulse false, status AVAILABLE, scheduled_hours_total 0."
            - "Three FATs on the order: fat1 6 h, fat2 6 h, fat3 2 h, all witness_required false and requires_impulse false; a fourth fat4 6 h is created later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-OVL-0001", customer_name: "Ridgeline Transmission", product_family: "POWER_TRANSFORMER", rated_kv: 12, contract_value_cents: 12000000, sold_at: "2026-02-10T00:00:00Z", promised_ship_at: "2026-11-20T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id, ord_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_id}/submittal-drawings"
              payload: { drawing_set_code: "DS-OVL-A", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_v0}" }
              as: DesignEngineer
              captures: { dwg_id: $.data.id }
            - call: "POST /submittal-drawings/${dwg_id}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg_id}/begin-review"
              payload: {}
              as: CustomerReviewer
            - call: "POST /submittal-drawings/${dwg_id}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-OVL", legal_name: "Ridgeline Coil", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "BSH-OVL", category: "HV_BUSHING", lead_time_days: 30, quantity_on_hand: 6, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id, comp_v0: $.data.version }
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 2, priority_class: 2, need_by_date: "2026-08-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /component-allocations/${alloc_id}/commit"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /engineered-orders/${ord_id}/start-production"
              payload: {}
              as: MaterialsPlanner
            - call: "POST /test-bays"
              payload: { bay_code: "BAY-OVL", max_kv: 145, changeover_buffer_hours: 3, supports_impulse: false }
              as: PlantAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 6, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat1: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 6, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat2: $.data.id }
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 2, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat3: $.data.id }
          trigger:
            - call: "POST /factory-acceptance-tests/${fat1}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T08:00:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat2}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T13:00:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat2}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T16:59:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat2}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T17:00:00Z" }
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat3}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T03:00:00Z" }
              as: TestEngineer
            - call: "GET /test-bays/${bay_id}"
              payload: {}
              as: TestEngineer
            - call: "GET /test-bays/${bay_id}/schedule"
              payload: {}
              as: TestEngineer
            - call: "POST /factory-acceptance-tests/${fat2}/abandon"
              payload: { reason: "Customer deferred stage 2 witness" }
              as: TestEngineer
            - call: "GET /test-bays/${bay_id}"
              payload: {}
              as: TestEngineer
            - call: "POST /factory-acceptance-tests"
              payload: { engineered_order_id: "${ord_id}", test_duration_hours: 6, witness_required: false, requires_impulse: false }
              as: TestEngineer
              captures: { fat4: $.data.id }
            - call: "POST /factory-acceptance-tests/${fat4}/schedule"
              payload: { test_bay_id: "${bay_id}", window_start_at: "2026-07-01T17:00:00Z" }
              as: TestEngineer
            - call: "GET /test-bays/${bay_id}"
              payload: {}
              as: TestEngineer
          assert:
            - "fat1 -> 200: status BAY_SCHEDULED, window_start_at 2026-07-01T08:00:00Z, window_end_at == 2026-07-01T17:00:00Z (6 h duration + 3 h changeover buffer carried INSIDE the window)"
            - "TestBay.${bay_id}.scheduled_hours_total == 6 after fat1 -- the buffer hours are NOT added to scheduled_hours_total even though they extend the window"
            - "fat2 @ 13:00:00Z -> 409 ERR_BAY_WINDOW_CONFLICT: plain duration overlap (13:00 < 17:00 and 08:00 < 2026-07-01T22:00)"
            - "fat2 @ 16:59:00Z -> 409 ERR_BAY_WINDOW_CONFLICT: the candidate starts one minute before fat1's window_end_at, inside the buffer tail only; an implementation that treats the buffer as a gap AFTER the window (fat1 ending 14:00) wrongly returns 200 here"
            - "fat2 @ 17:00:00Z -> 200: window_start_at == fat1.window_end_at exactly, admitted by the half-open rule; window_end_at == 2026-07-02T02:00:00Z (17:00 + 6 h + 3 h). A closed-interval or buffer-as-gap implementation wrongly returns 409"
            - "fat3 @ 03:00:00Z -> 200: window_end_at == 2026-07-01T08:00:00Z == fat1.window_start_at exactly, the mirror half-open edge (candidate.window_end_at is not < existing.window_start_at, it EQUALS it, and equality is not an overlap)"
            - "after all three successful claims TestBay.${bay_id}.scheduled_hours_total == 14 (6 + 6 + 2), and the two rejected fat2 attempts contributed 0"
            - "GET /test-bays/${bay_id}/schedule returns exactly three occupying rows (fat3, fat1, fat2) with contiguous windows 03:00-08:00, 08:00-17:00 and 17:00-02:00+1d and no gaps between them"
            - "after abandoning fat2 TestBay.${bay_id}.scheduled_hours_total == 8 (invariant bay-hour-conservation: the exact 6 h that fat2 added are removed, not a recomputed approximation)"
            - "fat4 @ 17:00:00Z -> 200: the 17:00-02:00 window is reusable because ABANDONED rows never appear in occupied(bay); scheduled_hours_total returns to 14"
            - "EngineeredOrder.${ord_id}.fulfillment_status remains IN_PRODUCTION throughout (no FAT reached PASSED, and fat4 is attempt_number 1 not a retest, so no FAT_COMPLETE -> IN_PRODUCTION revert is involved)"

      - name: witness_day_bucket_capacity_versus_travel_blackout_day_set_symmetry
