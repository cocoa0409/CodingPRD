              as: PolicyReviewer
              as_user_id: "${rev_id}"
              captures: { e_reviewer: "$.data.error_id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_a}", policy_rule_id: "${alc_id}", license_number: "ANL-NL-BR-01", issuing_country_code: "BR", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: IntegrityAnalyst
              captures: { e_analyst: "$.data.error_id" }
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_a}", policy_rule_id: "${alc_id}", license_number: "HC-NL-GB-01", issuing_country_code: "GB", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
