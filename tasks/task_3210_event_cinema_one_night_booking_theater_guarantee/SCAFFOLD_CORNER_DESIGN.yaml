            - "the withdrawal is refused with 409 — ${withdraw_err} == ERR_INVALID_STATE"
            - "the title is untouched — Title.${title_id}.status == BOOKABLE"

      - name: stale_booking_version_is_rejected_on_line_add
        claim_type: error_trigger
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[booking-line-supersede-stale-booking]
          - validations[priority=36]
        distinguishing_aspect: "ERR_STALE_VERSION fires on a strictly sequential pair: a line added with the version captured before a previous line advanced the booking is refused 412, with no overlapping requests involved."
        test_recipe:
          setup:
            - "Standard CA fixture; a DRAFT booking whose version is 2 after one line was added."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 20, expected_attendance: 40, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { stale_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 20, expected_attendance: 40, expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { fresh_state: $.data.exhibit_state, b_v3: $.data.version }
          assert:
            - "the first line advanced the booking from version ${b_v1} to ${b_v2}, so the captured value is now stale"
            - "reusing the stale version is refused with 412 — ${stale_err} == ERR_STALE_VERSION"
            - "the same request carrying the current version ${b_v2} succeeds — ${fresh_state} == PROPOSED"
            - "Booking.${b_id}.version == 3 and committed_screens_total == 40, counting only the second line"

      - name: unknown_booking_id_returns_booking_not_found
        claim_type: error_trigger
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - validations[priority=4]
          - endpoints.GET_/bookings/{id}
        distinguishing_aspect: "ERR_BOOKING_NOT_FOUND is raised on a read path as well as a write path, so the catalog's not-found errors are not write-only."
        test_recipe:
          setup:
            - *k_clock
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /event-cinema/bookings/3f1a7c22-0000-4000-8000-0000000000aa"
              payload: {}
              as: PlatformOps
              captures: { nf_err2: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "the error is entity-specific — ${nf_err2} == ERR_BOOKING_NOT_FOUND"
            - "the body carries response_type error"

  # ===========================================================================
  - section: rbac
    instances:

      - name: theater_role_cannot_submit_a_booking
        claim_type: role_denial
        grounds:
          - roles[Theater]
          - roles[Exhibitor]
          - endpoints.POST_/bookings/{id}/submit
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Submit is exclusive to Exhibitor: a Theater principal presenting its own valid id is refused 403 ERR_FORBIDDEN, demonstrating that each role owns a disjoint operation set under the segregation-of-duties model."
        test_recipe:
          setup:
            - "Standard CA fixture with a DRAFT booking carrying one proposed 60-screen line."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Theater
              as_user_id: "${th_id}"
              captures: { role_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "the theater principal is refused with 403 — ${role_err} == ERR_FORBIDDEN"
            - "the booking did not move on the refusal — Booking.${b_id}.status == DRAFT"
            - "the same request from the owning exhibitor succeeds — ${ok_status} == PENDING_APPROVAL"

      - name: exhibitor_role_cannot_approve_its_own_booking
        claim_type: role_denial
        grounds:
          - roles[Exhibitor]
          - roles[Distributor]
          - endpoints.POST_/bookings/{id}/approve
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Approval is exclusive to Distributor: the exhibitor that filed the booking cannot approve it, so the two commercial legs are held by different principals."
        test_recipe:
          setup:
            - "Standard CA fixture with a booking in PENDING_APPROVAL after submission."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { approve_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { approved: $.data.status }
          assert:
            - "the exhibitor's own approval attempt is refused — ${approve_err} == ERR_FORBIDDEN at 403"
            - "no screens moved on the refusal — GET /event-cinema/circuits/${circ_id} reports committed_screens_balance == 0"
            - "the distributor's approval succeeds — ${approved} == APPROVED"

      - name: attendance_cannot_be_reported_by_a_distributor
        claim_type: role_denial
        grounds:
          - roles[Theater]
          - endpoints.POST_/screenings/{id}/report
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Only the venue operator may file attendance: a distributor principal attempting to report a screening is refused 403, keeping the reported headcount an exhibitor-side attestation."
