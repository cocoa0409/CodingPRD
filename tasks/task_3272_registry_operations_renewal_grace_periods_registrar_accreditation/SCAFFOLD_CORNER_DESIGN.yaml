        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_IANA_NUMBER
          - errors.ERR_DUPLICATE_CASE_REFERENCE
        distinguishing_aspect: "Two distinct uniqueness constraints fire independently: a second registrar with an occupied iana_number fails ERR_DUPLICATE_IANA_NUMBER; a second court order with an occupied case_reference fails ERR_DUPLICATE_CASE_REFERENCE."
        test_recipe:
