# =============================================================================
# Task 1340 — Safety Incentive & Loss Control Program (employer)
# =============================================================================

scenario: |
  Safety Incentive & Loss Control Program (employer): hazard assessment & control implementation tracking, leading indicator (observation/near miss) program, safety committee meeting & action items, incentive design avoiding underreporting, training assignment by job hazard, contractor safety prequalification, insurance carrier loss control recommendations & closure, experience modification factor forecasting

domain_name: safety-incentive-loss-control
api_prefix: /safety

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers: [cascading_side_effects, dual_variant_calculation, ops_run_checkpoint, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SafetyProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_year, type: integer, source: input, description: "Calendar year the program covers (Jan 1 - Dec 31)" }
      - { name: scoring_variant, type: enum, source: input, description: "LEADING_ONLY | BALANCED — incentive scoring rule set; immutable once status leaves DRAFT" }
      - { name: incentive_budget_cents, type: integer, source: input, description: "Total incentive pool in cents; must be > 0 to activate" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "= incentive_budget_cents - SUM(payout_cents of awards in APPROVED or PAID); initialized to incentive_budget_cents at creation" }
      - { name: observation_target_rate, type: number, source: input, description: "Target leading-indicator rate per 200,000 exposure hours" }
      - { name: near_miss_floor_ratio, type: number, source: input, default: 0.20, description: "Minimum near_miss_count / total_observations ratio before reporting-integrity flag" }
      - { name: quorum_min, type: integer, source: input, default: 5, description: "Minimum committee-member attendees for a meeting to be HELD" }
      - { name: exposure_hours, type: integer, source: input, description: "Hours worked YTD across the workforce; updatable via sweep" }
      - { name: payroll_by_class, type: array, source: input, description: "Array of {hazard_class, payroll_cents} for LOW/MODERATE/HIGH; drives expected losses" }
      - { name: elr_by_class, type: array, source: input, description: "Array of {hazard_class, elr}; elr = expected loss dollars per $100 of payroll" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | RECONCILED" }
      - { name: posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | WATCH | RESTRICTED — recomputed by sweep from overdue controls, SLA breaches, integrity flag, overdue recommendations" }
      - { name: overdue_control_count, type: integer, source: computed, default: 0, description: "Count of ControlItems in OVERDUE on this program's hazards; refreshed by sweep" }
      - { name: sla_breach_count, type: integer, source: computed, default: 0, description: "Count of non-CLOSED hazards with sla_breached = true; refreshed by sweep" }
      - { name: integrity_flag, type: boolean, source: computed, default: false, description: "true when accepted/closed claims > 0 AND near_miss_ratio < near_miss_floor_ratio; refreshed by sweep and leading-indicators read" }
      - { name: sweep_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each sweep" }

  - name: JobRole
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Job classification title" }
      - { name: hazard_class, type: enum, source: input, description: "LOW | MODERATE | HIGH — drives training assignment and point multipliers" }
      - { name: required_course_ids, type: array, source: input, default: [], description: "FK -> TrainingCourse.id; array-valued, each element is a required course for this role" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: hazard_class, type: enum, source: input, description: "LOW | MODERATE | HIGH — the hazard tier this course mitigates" }
      - { name: validity_months, type: integer, source: input, description: "Certification validity in months from completed_at" }
      - { name: renewal_window_days, type: integer, source: input, default: 30, description: "Days before cert expiry during which re-assignment is permitted" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee name" }
      - { name: job_role_id, type: string, source: input, description: "FK -> JobRole.id" }
      - { name: hired_on, type: string, source: input, description: "ISO date of hire" }
      - { name: committee_member, type: boolean, source: input, default: false, description: "Counts toward meeting quorum when true" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: pending_required_training_count, type: integer, source: computed, default: 0, description: "Count of this employee's TrainingAssignments with required=true in ASSIGNED or EXPIRED" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id" }
      - { name: due_date, type: datetime, source: input, description: "Completion deadline; sweep flips ASSIGNED past due to EXPIRED" }
      - { name: required, type: boolean, source: computed, description: "true when course_id is in the employee's job role required_course_ids at creation" }
      - { name: source, type: enum, source: system, description: "SYSTEM_JOB_HAZARD (auto-created on employee creation) | MANUAL" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | EXPIRED | CANCELLED" }
      - { name: completed_at, type: datetime, source: input, description: "Set on complete; defaults to logical now when omitted" }
      - { name: cert_valid_until, type: datetime, source: computed, description: "= completed_at + course.validity_months; null until COMPLETED" }

  - name: Hazard
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: location, type: string, source: input, description: "Where the hazard was found" }
      - { name: description, type: string, source: input, description: "Hazard description" }
      - { name: identified_by, type: string, source: input, description: "FK -> Employee.id" }
      - { name: severity, type: integer, source: input, description: "1-5; set by assess" }
      - { name: probability, type: integer, source: input, description: "1-5; set by assess" }
      - { name: risk_score, type: integer, source: computed, description: "= severity * probability" }
      - { name: risk_band, type: enum, source: computed, description: "LOW (<=4) | MEDIUM (5-9) | HIGH (10-15) | CRITICAL (>=16)" }
      - { name: response_sla_due, type: datetime, source: computed, description: "= assessed_at + SLA days by band (CRITICAL 7, HIGH 14, MEDIUM 30, LOW 60)" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "set true by sweep when not CLOSED and response_sla_due < now" }
      - { name: overdue_control_count, type: integer, source: computed, default: 0, description: "Controls of this hazard in OVERDUE; refreshed by sweep" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSESSED | CONTROLS_PLANNED | IN_PROGRESS | PENDING_VERIFICATION | CLOSED" }

  - name: ControlItem
    parent: null
    common_fields: true
    fields:
      - { name: hazard_id, type: string, source: input, description: "FK -> Hazard.id" }
      - { name: description, type: string, source: input, description: "Control to implement" }
      - { name: implementer_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: due_date, type: datetime, source: input, description: "Implementation deadline" }
      - { name: implemented_at, type: datetime, source: input, description: "Set on implement; defaults to logical now" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying SafetyManager; must differ from implementer_id" }
      - { name: verified_at, type: datetime, source: system, description: "Set on PASS verify" }
      - { name: outcome_note, type: string, source: input, description: "Verify note (required on FAIL)" }
      - { name: status, type: enum, source: system, description: "PLANNED | OVERDUE | IMPLEMENTED | VERIFIED" }

  - name: Observation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: reporter_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: kind, type: enum, source: input, description: "OBSERVATION | NEAR_MISS" }
      - { name: description, type: string, source: input, description: "What was observed" }
      - { name: occurred_at, type: datetime, source: input, description: "When it happened; must not be in the future" }
      - { name: linked_hazard_id, type: string, source: system, description: "FK -> Hazard.id; nullable — set by triage LINK_EXISTING/CREATE_HAZARD" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | LINKED | NO_ACTION | CLOSED" }

  - name: CommitteeMeeting
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be after start" }
      - { name: location, type: string, source: input, description: "Meeting location" }
      - { name: attendee_ids, type: array, source: input, description: "Array of Employee.id values recorded at hold" }
      - { name: minutes_text, type: string, source: input, description: "Minutes body set at publish" }
      - { name: open_action_count, type: integer, source: computed, default: 0, description: "ActionItems of this meeting in ASSIGNED | COMPLETED | ESCALATED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | MINUTES_PUBLISHED | CANCELLED" }

  - name: ActionItem
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> CommitteeMeeting.id" }
      - { name: assignee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: description, type: string, source: input, description: "Action to perform" }
      - { name: due_date, type: datetime, source: input, description: "Due date; sweep escalates ASSIGNED past due" }
      - { name: hazard_id, type: string, source: input, description: "FK -> Hazard.id; nullable — optional linked hazard" }
      - { name: completed_at, type: datetime, source: input, description: "Set on complete; defaults to logical now" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying CommitteeChair; must differ from assignee_id" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | VERIFIED | ESCALATED" }

  - name: ContractorOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Contractor company name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: emr, type: number, source: input, description: "Contractor's experience modification rate" }
      - { name: trir, type: number, source: input, description: "Total recordable incident rate" }
      - { name: safety_audit_pct, type: number, source: input, description: "Safety program audit score 0-100" }
      - { name: insurance_cert_expires_on, type: string, source: input, description: "ISO date the insurance certificate expires" }
      - { name: prequal_score, type: number, source: computed, description: "Weighted score 0-100, 2dp round_half_up; computed at submit" }
      - { name: computed_decision, type: enum, source: computed, description: "APPROVE (>=80.00) | CONDITIONAL (>=65.00) | REJECT (<65.00); decide must match" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | CONDITIONAL | REJECTED | SUSPENDED | EXPIRED" }
      - { name: prequal_valid_until, type: datetime, source: computed, description: "= decide-approve timestamp + 365 days; sweep flips APPROVED past this to EXPIRED" }
      - { name: suspension_reason, type: string, source: input, description: "Set on suspend" }
      - { name: suspension_claim_id, type: string, source: input, description: "FK -> ClaimRecord.id; nullable — claim that triggered suspension" }

  - name: ClaimRecord
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; nullable" }
      - { name: contractor_org_id, type: string, source: input, description: "FK -> ContractorOrg.id; nullable — claim involving a contractor" }
      - { name: occurred_on, type: string, source: input, description: "ISO date of injury; must not be in the future" }
      - { name: kind, type: enum, source: input, description: "MEDICAL_ONLY | INDEMNITY" }
      - { name: incurred_cents, type: integer, source: input, description: "Current incurred cost; adjustable while REPORTED/ACCEPTED via accept/close inputs" }
      - { name: effective_incurred_cents, type: integer, source: computed, description: "= round_half_up(incurred_cents * 0.3) for MEDICAL_ONLY (ERA rule), else incurred_cents" }
      - { name: status, type: enum, source: system, description: "REPORTED | ACCEPTED | DENIED | CLOSED" }

  - name: LossControlRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: carrier_name, type: string, source: input, description: "Issuing insurance carrier" }
      - { name: priority, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: description, type: string, source: input, description: "Recommendation text" }
      - { name: due_date, type: datetime, source: input, description: "Carrier response deadline; sweep flips ISSUED past due to OVERDUE" }
      - { name: response_text, type: string, source: input, description: "Employer response set by respond" }
      - { name: evidence_control_id, type: string, source: input, description: "FK -> ControlItem.id; nullable — must be VERIFIED when provided" }
      - { name: responded_by, type: string, source: system, description: "X-User-ID of responder" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of carrier reviewer" }
      - { name: review_note, type: string, source: input, description: "Carrier review note" }
      - { name: status, type: enum, source: system, description: "ISSUED | OVERDUE | RESPONSE_SUBMITTED | CARRIER_REJECTED | CLOSED_ACCEPTED" }

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> SafetyProgram.id" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id" }
      - { name: points_earned, type: integer, source: computed, description: "Sum of points_awarded over the employee's IncentiveEvents in this program" }
      - { name: tier, type: enum, source: computed, description: "BRONZE 1-49 | SILVER 50-99 | GOLD 100-199 | PLATINUM >=200" }
      - { name: payout_cents, type: integer, source: computed, description: "= round_half_up(points_earned * tier_value_cents / 100) * 100; per-employee rounding to whole dollars BEFORE any aggregation" }
      - { name: void_reason, type: string, source: input, description: "Set on void" }
      - { name: status, type: enum, source: system, description: "CALCULATED | APPROVED | PAID | VOIDED" }

  - name: IncentiveEvent
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> SafetyProgram.id" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id — point recipient" }
      - { name: source_type, type: enum, source: system, description: "OBSERVATION_VALIDATED | NEAR_MISS_VALIDATED | CONTROL_VERIFIED | ACTION_VERIFIED | MEETING_ATTENDED | CLAIMS_FREE_BONUS" }
      - { name: points_base, type: integer, source: system, description: "Base points by source_type (10/20/15/10/5/50)" }
      - { name: hazard_class_multiplier, type: number, source: system, description: "Recipient job-role class multiplier: LOW 1.0, MODERATE 1.2, HIGH 1.5" }
      - { name: timeliness_multiplier, type: number, source: system, description: "1.25 when CONTROL_VERIFIED verified_at <= due_date, else 1.0; always 1.0 for other source types" }
      - { name: points_awarded, type: integer, source: computed, description: "= round_half_up(points_base * hazard_class_multiplier * timeliness_multiplier) to integer" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic reference to the source row (Observation.id | ControlItem.id | ActionItem.id | CommitteeMeeting.id)" }

  - name: EMRForecast
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SafetyProgram.id" }
      - { name: as_of, type: datetime, source: input, description: "Valuation timestamp; defaults to logical now" }
      - { name: payroll_factor, type: number, source: computed, description: "PROVISIONAL payroll annualization factor: 1.0 when as_of is after Dec 31 of program_year, else 365 / max(days_elapsed, 30)" }
      - { name: expected_losses_provisional_cents, type: integer, source: computed, description: "Expected losses on annualized payroll; per-class round_half_up to cent then sum" }
      - { name: expected_losses_final_cents, type: integer, source: computed, description: "Expected losses on recorded payroll (no annualization)" }
      - { name: weighting_w, type: number, source: computed, description: "= round_half_up(clamp((E_dollars - 20000)/180000, 0.05, 0.75), 4dp); computed on final expected losses" }
      - { name: ballast_provisional_cents, type: integer, source: computed, description: "= round_half_up(0.10 * expected_losses_provisional_cents)" }
      - { name: ballast_final_cents, type: integer, source: computed, description: "= round_half_up(0.10 * expected_losses_final_cents)" }
      - { name: actual_primary_provisional_cents, type: integer, source: computed, description: "Sum of min(effective_incurred_cents, SPLIT_POINT) over claims in REPORTED|ACCEPTED|CLOSED" }
      - { name: actual_excess_provisional_cents, type: integer, source: computed, description: "Sum of max(0, effective_incurred_cents - SPLIT_POINT) over the same provisional claim set" }
      - { name: actual_primary_final_cents, type: integer, source: computed, description: "Primary sum over claims in ACCEPTED|CLOSED only" }
      - { name: actual_excess_final_cents, type: integer, source: computed, description: "Excess sum over claims in ACCEPTED|CLOSED only" }
      - { name: emr_provisional, type: number, source: computed, description: "= (Ap_prov + W*Ae_prov + (1-W)*Ee_prov + B_prov) / (E_prov + B_prov), 2dp round_half_up" }
      - { name: emr_final, type: number, source: computed, description: "= (Ap_fin + W*Ae_fin + (1-W)*Ee_fin + B_fin) / (E_fin + B_fin), 2dp round_half_up" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SafetyProgram
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /safety/programs/{id}/activate"
        actor: EHSAdmin
        preconditions:
          - "payroll_by_class covers all three hazard classes LOW/MODERATE/HIGH with payroll_cents > 0 (ERR_PAYROLL_INCOMPLETE)"
          - "elr_by_class covers all three hazard classes"
          - "incentive_budget_cents > 0 and exposure_hours > 0 (ERR_INVALID_REQUEST)"
          - "no other SafetyProgram in ACTIVE (ERR_PROGRAM_ALREADY_ACTIVE)"
        side_effects:
          - "posture set to NORMAL"
          - "increments SafetyProgram.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /safety/programs/{id}/close"
        actor: EHSAdmin
        preconditions:
          - "no Hazard of this program in OPEN | ASSESSED | CONTROLS_PLANNED | IN_PROGRESS | PENDING_VERIFICATION (ERR_OPEN_HAZARDS_REMAIN)"
          - "no LossControlRecommendation of this program in ISSUED | OVERDUE | RESPONSE_SUBMITTED | CARRIER_REJECTED (ERR_OPEN_RECOMMENDATIONS_REMAIN)"
          - "no CommitteeMeeting of this program in SCHEDULED | HELD (ERR_OPEN_MEETINGS_REMAIN)"
        side_effects:
          - "BALANCED variant only: if zero ClaimRecords of this program in ACCEPTED | CLOSED and integrity_flag is false, create one CLAIMS_FREE_BONUS IncentiveEvent (base 50) for every employee with >= 1 existing IncentiveEvent in this program"
          - "then for every employee with >= 1 IncentiveEvent in this program, create an IncentiveAward (status CALCULATED) via calculations.award_payout"
          - "increments SafetyProgram.version by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /safety/programs/{id}/reconcile"
        actor: EHSAdmin
        preconditions:
          - "every IncentiveAward of this program is in PAID | VOIDED (ERR_UNPAID_AWARDS_REMAIN)"
        side_effects:
          - "invariant holds: remaining_budget_cents == incentive_budget_cents - SUM(payout_cents of PAID awards)"
          - "increments SafetyProgram.version by 1"

  - entity: Hazard
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ASSESSED
        trigger: "POST /safety/hazards/{id}/assess"
        actor: SafetyManager
        preconditions:
          - "severity and probability each in 1..5 (ERR_INVALID_REQUEST)"
        side_effects:
          - "computes risk_score, risk_band, response_sla_due per calculations.hazard_risk_score"
      - from: ASSESSED
        to: CONTROLS_PLANNED
        trigger: "system (automatic when the first ControlItem is created under this hazard)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTROLS_PLANNED
        to: IN_PROGRESS
        trigger: "system (automatic when any ControlItem of this hazard becomes IMPLEMENTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: PENDING_VERIFICATION
        trigger: "system (automatic when every ControlItem is in IMPLEMENTED | VERIFIED with >= 1 IMPLEMENTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_VERIFICATION
        to: CLOSED
        trigger: "system (automatic when every ControlItem of this hazard is VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "every Observation with linked_hazard_id == this hazard and status LINKED moves to CLOSED"
          - "for each such Observation, create IncentiveEvent for reporter_id: source_type OBSERVATION_VALIDATED (base 10) or NEAR_MISS_VALIDATED (base 20) by kind"
      - from: PENDING_VERIFICATION
        to: IN_PROGRESS
        trigger: "system (automatic when a verify FAIL moves a ControlItem back to PLANNED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "revision loop: failed verification reopens implementation"
      - from: CLOSED
        to: OPEN
        trigger: "POST /safety/hazards/{id}/reopen"
        actor: SafetyManager
        preconditions:
          - "program of this hazard is ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "sla_breached reset to false; severity/probability/risk fields cleared to null until re-assessed"
        note: "recurrence cycle: CLOSED hazards can reopen"

  - entity: ControlItem
    initial_state: PLANNED
    terminal_states: [VERIFIED]
    transitions:
      - from: PLANNED
        to: IMPLEMENTED
        trigger: "POST /safety/controls/{id}/implement"
        actor: Supervisor | SafetyManager
        preconditions:
          - "hazard of this control is in CONTROLS_PLANNED | IN_PROGRESS | PENDING_VERIFICATION (ERR_INVALID_STATE)"
          - "implemented_at (or logical now) must not be in the future (ERR_FUTURE_DATE_NOT_ALLOWED)"
        side_effects:
          - "hazard auto-transitions per Hazard machine (CONTROLS_PLANNED -> IN_PROGRESS, or IN_PROGRESS -> PENDING_VERIFICATION when all controls IMPLEMENTED | VERIFIED)"
      - from: OVERDUE
        to: IMPLEMENTED
        trigger: "POST /safety/controls/{id}/implement"
        actor: Supervisor | SafetyManager
        preconditions:
          - "implemented_at (or logical now) must not be in the future (ERR_FUTURE_DATE_NOT_ALLOWED)"
        side_effects:
          - "hazard auto-transitions per Hazard machine when applicable"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /safety/controls/{id}/verify with outcome PASS"
        actor: SafetyManager
        preconditions:
          - "hazard of this control is PENDING_VERIFICATION (ERR_INVALID_STATE)"
          - "verifier X-User-ID != implementer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by = X-User-ID; verified_at = logical now"
          - "create IncentiveEvent CONTROL_VERIFIED (base 15) for implementer_id; timeliness_multiplier 1.25 when verified_at <= due_date else 1.0"
          - "hazard auto-transitions to CLOSED when this was the last non-VERIFIED control (see Hazard CLOSED side effects)"
      - from: IMPLEMENTED
        to: PLANNED
        trigger: "POST /safety/controls/{id}/verify with outcome FAIL"
        actor: SafetyManager
        preconditions:
          - "hazard of this control is PENDING_VERIFICATION (ERR_INVALID_STATE)"
          - "verifier X-User-ID != implementer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome_note and new due_date are required on FAIL (ERR_INVALID_REQUEST)"
        side_effects:
          - "due_date replaced by the new due_date; implemented_at cleared"
          - "hazard auto-transitions PENDING_VERIFICATION -> IN_PROGRESS"
      - from: PLANNED
        to: OVERDUE
        trigger: "system (POST /safety/programs/{id}/sweep when due_date < logical now)"
        actor: system
        preconditions: []
        side_effects:
          - "hazard.overdue_control_count recomputed; program.overdue_control_count recomputed; program posture recomputed per calculations.program_posture"

  - entity: Observation
    initial_state: SUBMITTED
    terminal_states: [NO_ACTION, CLOSED]
    transitions:
      - from: SUBMITTED
        to: LINKED
        trigger: "POST /safety/observations/{id}/triage with action LINK_EXISTING or CREATE_HAZARD"
        actor: SafetyManager
        preconditions:
          - "triager X-User-ID != reporter_id (ERR_SEGREGATION_OF_DUTIES)"
          - "LINK_EXISTING: target hazard exists and is not CLOSED (ERR_HAZARD_NOT_OPEN)"
          - "CREATE_HAZARD: severity and probability in 1..5 (ERR_INVALID_REQUEST)"
        side_effects:
          - "LINK_EXISTING: linked_hazard_id = hazard_id"
          - "CREATE_HAZARD: creates a Hazard in ASSESSED (computes risk_score/band/sla) and sets linked_hazard_id"
      - from: SUBMITTED
        to: NO_ACTION
        trigger: "POST /safety/observations/{id}/triage with action NO_ACTION"
        actor: SafetyManager
        preconditions:
          - "triager X-User-ID != reporter_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
        note: "NO_ACTION earns no points (anti-gaming: only validated observations pay)"
      - from: LINKED
        to: CLOSED
        trigger: "system (automatic when the linked Hazard reaches CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "create IncentiveEvent OBSERVATION_VALIDATED / NEAR_MISS_VALIDATED for reporter_id"

  - entity: CommitteeMeeting
    initial_state: SCHEDULED
    terminal_states: [MINUTES_PUBLISHED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /safety/committee-meetings/{id}/hold"
        actor: CommitteeChair
        preconditions:
          - "count of DISTINCT attendee_ids that are committee_member=true Employees >= program.quorum_min (ERR_QUORUM_NOT_MET)"
          - "every attendee_id resolves to an existing Employee (ERR_NOT_FOUND)"
        side_effects:
          - "create IncentiveEvent MEETING_ATTENDED (base 5) for each distinct committee-member attendee"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /safety/committee-meetings/{id}/cancel"
        actor: CommitteeChair
        preconditions: []
        side_effects: []
      - from: HELD
        to: MINUTES_PUBLISHED
        trigger: "POST /safety/committee-meetings/{id}/publish-minutes"
        actor: CommitteeChair
        preconditions: []
        side_effects: []

  - entity: ActionItem
    initial_state: ASSIGNED
    terminal_states: [VERIFIED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /safety/action-items/{id}/complete"
        actor: Supervisor | SafetyManager | CommitteeChair
        preconditions:
          - "actor X-User-ID == assignee_id OR actor role is CommitteeChair (ERR_UNAUTHORIZED)"
        side_effects: []
      - from: ESCALATED
        to: COMPLETED
        trigger: "POST /safety/action-items/{id}/complete"
        actor: Supervisor | SafetyManager | CommitteeChair
        preconditions:
          - "actor X-User-ID == assignee_id OR actor role is CommitteeChair (ERR_UNAUTHORIZED)"
        side_effects: []
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /safety/action-items/{id}/verify with outcome PASS"
        actor: CommitteeChair
        preconditions:
          - "verifier X-User-ID != assignee_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "create IncentiveEvent ACTION_VERIFIED (base 10) for assignee_id"
          - "meeting.open_action_count -= 1"
      - from: COMPLETED
        to: ASSIGNED
        trigger: "POST /safety/action-items/{id}/verify with outcome FAIL"
        actor: CommitteeChair
        preconditions:
          - "verifier X-User-ID != assignee_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome_note and new due_date required on FAIL (ERR_INVALID_REQUEST)"
        side_effects:
          - "due_date replaced; completed_at cleared"
        note: "revision loop back to ASSIGNED"
      - from: ASSIGNED
        to: ESCALATED
        trigger: "system (POST /safety/programs/{id}/sweep when due_date < logical now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /safety/action-items/{id}/reassign"
        actor: CommitteeChair
        preconditions:
          - "new due_date required (ERR_INVALID_REQUEST)"
          - "meeting_id when given must be a HELD | MINUTES_PUBLISHED meeting of the same program (ERR_INVALID_STATE)"
        side_effects:
          - "when meeting_id changes: old meeting.open_action_count -= 1, new meeting.open_action_count += 1 (global open count conserved)"

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /safety/training-assignments/{id}/complete"
        actor: Supervisor | SafetyManager | EHSAdmin
        preconditions:
          - "employee of this assignment is ACTIVE (ERR_EMPLOYEE_INACTIVE)"
          - "completed_at (or logical now) must not be in the future (ERR_FUTURE_DATE_NOT_ALLOWED)"
        side_effects:
          - "cert_valid_until = completed_at + course.validity_months"
          - "employee.pending_required_training_count recomputed"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (POST /safety/programs/{id}/sweep when due_date < logical now)"
        actor: system
        preconditions: []
        side_effects:
          - "employee.pending_required_training_count recomputed (EXPIRED still counts as pending)"
      - from: EXPIRED
        to: ASSIGNED
        trigger: "POST /safety/training-assignments/{id}/reassign"
        actor: Supervisor | SafetyManager | EHSAdmin
        preconditions:
          - "new due_date required (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (POST /safety/employees/{id}/deactivate cancels this employee's ASSIGNED assignments)"
        actor: system
        preconditions: []
        side_effects:
          - "employee.pending_required_training_count recomputed"
      - from: EXPIRED
        to: CANCELLED
        trigger: "system (POST /safety/employees/{id}/deactivate cancels this employee's EXPIRED assignments)"
        actor: system
        preconditions: []
        side_effects:
          - "employee.pending_required_training_count recomputed"

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /safety/employees/{id}/deactivate"
        actor: EHSAdmin
        preconditions: []
        side_effects:
          - "this employee's TrainingAssignments in ASSIGNED | EXPIRED move to CANCELLED"
          - "pending_required_training_count recomputed (becomes 0)"

  - entity: ContractorOrg
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /safety/contractor-orgs/{id}/submit"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == this ContractorOrg.id (ERR_UNAUTHORIZED)"
          - "insurance_cert_expires_on (after any update in this call) is >= logical today (ERR_INSURANCE_CERT_EXPIRED)"
        side_effects:
          - "prequal_score and computed_decision recomputed per calculations.prequal_score from the post-update metrics"
      - from: CONDITIONAL
        to: UNDER_REVIEW
        trigger: "POST /safety/contractor-orgs/{id}/submit"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == this ContractorOrg.id (ERR_UNAUTHORIZED)"
          - "at least one metric field (emr, trir, safety_audit_pct, insurance_cert_expires_on) changes (ERR_INVALID_REQUEST)"
          - "insurance cert not expired (ERR_INSURANCE_CERT_EXPIRED)"
        side_effects:
          - "prequal_score and computed_decision recomputed"
        note: "remediation cycle"
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "POST /safety/contractor-orgs/{id}/submit"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == this ContractorOrg.id (ERR_UNAUTHORIZED)"
          - "insurance cert not expired (ERR_INSURANCE_CERT_EXPIRED)"
        side_effects:
          - "prequal_score and computed_decision recomputed"
        note: "re-review cycle after suspension"
      - from: EXPIRED
        to: UNDER_REVIEW
        trigger: "POST /safety/contractor-orgs/{id}/submit"
        actor: ContractorRep
        preconditions:
          - "X-User-ID == this ContractorOrg.id (ERR_UNAUTHORIZED)"
          - "insurance cert not expired (ERR_INSURANCE_CERT_EXPIRED)"
        side_effects:
          - "prequal_score and computed_decision recomputed"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /safety/contractor-orgs/{id}/decide with decision APPROVE"
        actor: SafetyManager
        preconditions:
          - "decision == computed_decision (ERR_DECISION_CONTRADICTS_SCORE)"
          - "the single ACTIVE SafetyProgram (if any) has posture != RESTRICTED (ERR_PROGRAM_RESTRICTED)"
        side_effects:
          - "prequal_valid_until = logical now + 365 days"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /safety/contractor-orgs/{id}/decide with decision CONDITIONAL"
        actor: SafetyManager
        preconditions:
          - "decision == computed_decision (ERR_DECISION_CONTRADICTS_SCORE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /safety/contractor-orgs/{id}/decide with decision REJECT"
        actor: SafetyManager
        preconditions:
          - "decision == computed_decision (ERR_DECISION_CONTRADICTS_SCORE)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /safety/contractor-orgs/{id}/suspend"
        actor: SafetyManager | EHSAdmin
        preconditions:
          - "suspension_claim_id when given must be an existing ClaimRecord whose contractor_org_id == this contractor (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (POST /safety/programs/{id}/sweep when prequal_valid_until < logical now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClaimRecord
    initial_state: REPORTED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /safety/claims/{id}/accept"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "incurred_cents replaced when the call supplies a new value; effective_incurred_cents recomputed"
      - from: REPORTED
        to: DENIED
        trigger: "POST /safety/claims/{id}/deny"
        actor: SafetyManager
        preconditions:
          - "reason required (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /safety/claims/{id}/close"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "incurred_cents replaced when final_incurred_cents supplied; effective_incurred_cents recomputed"

  - entity: LossControlRecommendation
    initial_state: ISSUED
    terminal_states: [CLOSED_ACCEPTED]
    transitions:
      - from: ISSUED
        to: OVERDUE
        trigger: "system (POST /safety/programs/{id}/sweep when due_date < logical now)"
        actor: system
        preconditions: []
        side_effects:
          - "program posture recomputed per calculations.program_posture"
      - from: ISSUED
        to: RESPONSE_SUBMITTED
        trigger: "POST /safety/loss-control-recommendations/{id}/respond"
        actor: SafetyManager
        preconditions:
          - "evidence_control_id when given must reference a VERIFIED ControlItem (ERR_CONTROL_NOT_VERIFIED)"
        side_effects:
          - "responded_by = X-User-ID"
      - from: OVERDUE
        to: RESPONSE_SUBMITTED
        trigger: "POST /safety/loss-control-recommendations/{id}/respond"
        actor: SafetyManager
        preconditions:
          - "evidence_control_id when given must reference a VERIFIED ControlItem (ERR_CONTROL_NOT_VERIFIED)"
        side_effects:
          - "responded_by = X-User-ID"
      - from: RESPONSE_SUBMITTED
        to: CLOSED_ACCEPTED
        trigger: "POST /safety/loss-control-recommendations/{id}/review-response with outcome ACCEPT"
        actor: CarrierConsultant
        preconditions: []
        side_effects:
          - "reviewed_by = X-User-ID"
      - from: RESPONSE_SUBMITTED
        to: CARRIER_REJECTED
        trigger: "POST /safety/loss-control-recommendations/{id}/review-response with outcome REJECT"
        actor: CarrierConsultant
        preconditions:
          - "review_note required on REJECT (ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewed_by = X-User-ID"
      - from: CARRIER_REJECTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /safety/loss-control-recommendations/{id}/respond"
        actor: SafetyManager
        preconditions:
          - "evidence_control_id when given must reference a VERIFIED ControlItem (ERR_CONTROL_NOT_VERIFIED)"
        side_effects:
          - "responded_by = X-User-ID"
        note: "carrier rejection loop: employer may respond again"

  - entity: IncentiveAward
    initial_state: CALCULATED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /safety/incentive-awards/{id}/approve"
        actor: EHSAdmin
        preconditions:
          - "program of this award is CLOSED (ERR_PROGRAM_NOT_CLOSED)"
          - "program.remaining_budget_cents >= payout_cents (ERR_INCENTIVE_BUDGET_EXCEEDED)"
        side_effects:
          - "program.remaining_budget_cents -= payout_cents (reservation)"
      - from: APPROVED
        to: PAID
        trigger: "POST /safety/incentive-awards/{id}/pay"
        actor: EHSAdmin
        preconditions: []
        side_effects: []
      - from: CALCULATED
        to: VOIDED
        trigger: "POST /safety/incentive-awards/{id}/void"
        actor: EHSAdmin
        preconditions:
          - "reason required (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /safety/incentive-awards/{id}/void"
        actor: EHSAdmin
        preconditions:
          - "reason required (ERR_INVALID_REQUEST)"
        side_effects:
          - "program.remaining_budget_cents += payout_cents (compensation restores the reserved amount)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: program-config-stale-update
    parent_entity: SafetyProgram
    write_endpoint: "PATCH /safety/programs/{id}/incentive-config"
    occ_field: "expected_program_version"
    description: |
      Updating a DRAFT program's incentive/payroll configuration with an
      expected_program_version older than the program's current version is
      rejected. A config writer whose view predates another committed config
      write must re-read before writing; under natural PUT semantics the
      later write would otherwise silently overwrite the earlier one.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: emr-forecast-stale-program
    parent_entity: SafetyProgram
    write_endpoint: "POST /safety/emr-forecasts"
    occ_field: "expected_program_version"
    description: |
      Creating an EMRForecast against a SafetyProgram whose version has
      advanced since the client last read it is rejected. Forecast creation
      always legitimately succeeds against the latest program state (each
      forecast is an immutable snapshot), so a stale expected version is the
      only rejection signal; success increments SafetyProgram.version by 1.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hazard_risk_score
    trigger: "on POST /safety/hazards/{id}/assess and on triage CREATE_HAZARD"
    algorithm: threshold
    formula: |
      risk_score = severity * probability
      risk_band = LOW if risk_score <= 4
                | MEDIUM if 5 <= risk_score <= 9
                | HIGH if 10 <= risk_score <= 15
                | CRITICAL if risk_score >= 16
      response_sla_due = assessed_at + SLA_DAYS[risk_band]
    input_set: "the Hazard being assessed"
    constants:
      SLA_CRITICAL_DAYS: 7
      SLA_HIGH_DAYS: 14
      SLA_MEDIUM_DAYS: 30
      SLA_LOW_DAYS: 60
    precision: "integer score; band boundaries inclusive as stated (<= 4 LOW, >= 16 CRITICAL)"

  - name: leading_indicator_rates
    trigger: "on GET /safety/programs/{id}/leading-indicators and during sweep"
    algorithm: aggregation
    formula: |
      triaged = Observations of program with status in {LINKED, NO_ACTION, CLOSED}
      total_count = count(triaged)
      nm_count = count(triaged where kind == NEAR_MISS)
      observation_rate = round_half_up(total_count * 200000 / exposure_hours, 2dp)
      near_miss_ratio = (total_count == 0) ? 0 : round_half_up(nm_count / total_count, 4dp)
      target_met = observation_rate >= observation_target_rate
      accepted_claims = count(ClaimRecords of program in {ACCEPTED, CLOSED})
      integrity_flag = (accepted_claims > 0) AND (near_miss_ratio < near_miss_floor_ratio)
    input_set: "Observations of the program with status in {LINKED, NO_ACTION, CLOSED} (SUBMITTED excluded); ClaimRecords in {ACCEPTED, CLOSED} (REPORTED and DENIED excluded)"
    constants:
      HOURS_NORMALIZATION: 200000
    precision: "rate 2dp round_half_up; ratio 4dp round_half_up; flag comparison uses the UNROUNDED ratio"

  - name: incentive_event_points
    trigger: "whenever an IncentiveEvent is created (verify PASS, hazard close cascade, meeting hold, close bonus)"
    algorithm: weighted_scoring
    formula: |
      points_awarded = round_half_up(points_base * hazard_class_multiplier * timeliness_multiplier) to integer
      hazard_class_multiplier from the RECIPIENT employee's job role: LOW 1.0 | MODERATE 1.2 | HIGH 1.5
      timeliness_multiplier = 1.25 when source_type == CONTROL_VERIFIED and verified_at <= control.due_date, else 1.0
    input_set: "the single source row producing the event; recipient's JobRole"
    constants:
      BASE_OBSERVATION_VALIDATED: 10
      BASE_NEAR_MISS_VALIDATED: 20
      BASE_CONTROL_VERIFIED: 15
      BASE_ACTION_VERIFIED: 10
      BASE_MEETING_ATTENDED: 5
      BASE_CLAIMS_FREE_BONUS: 50
      MULT_LOW: 1.0
      MULT_MODERATE: 1.2
      MULT_HIGH: 1.5
      TIME_MULT_ON_TIME: 1.25
    precision: "integer points, round_half_up applied once to the full product"
    variants:
      - name: LEADING_ONLY
        when: "program.scoring_variant == LEADING_ONLY"
        difference: "CLAIMS_FREE_BONUS events are never created; all points come from leading indicators so payouts cannot reward suppressed reporting"
      - name: BALANCED
        when: "program.scoring_variant == BALANCED"
        difference: "at program close, CLAIMS_FREE_BONUS (base 50) is added per employee with >= 1 leading event IF zero claims in ACCEPTED|CLOSED and integrity_flag is false; the bonus is withheld (never negative) when claims exist or the near-miss floor failed"

  - name: award_payout
    trigger: "on POST /safety/programs/{id}/close (after any CLAIMS_FREE_BONUS events)"
    algorithm: threshold
    formula: |
      for each employee with >= 1 IncentiveEvent in the program:
        points_earned = SUM(points_awarded of that employee's events)
        tier = BRONZE if 1 <= points_earned <= 49
             | SILVER if 50 <= points_earned <= 99
             | GOLD if 100 <= points_earned <= 199
             | PLATINUM if points_earned >= 200
        payout_cents = round_half_up(points_earned * TIER_VALUE_CENTS[tier] / 100) * 100
      ROUNDING ORDER PINNED: each employee's payout is rounded to whole dollars
      individually; totals are sums of those rounded per-employee payouts
      (never round the program-level sum).
    input_set: "all IncentiveEvents of the program being closed"
    constants:
      TIER_VALUE_BRONZE_CENTS: 150
      TIER_VALUE_SILVER_CENTS: 200
      TIER_VALUE_GOLD_CENTS: 250
      TIER_VALUE_PLATINUM_CENTS: 300
    precision: "per-employee whole-dollar rounding (round_half_up to nearest 100 cents), applied before summation"

  - name: emr_forecast
    trigger: "on POST /safety/emr-forecasts"
    algorithm: forward_looking
    formula: |
      days_elapsed = calendar days from Jan 1 of program_year to as_of
      payroll_factor = 1.0 if as_of > Dec 31 of program_year else 365 / max(days_elapsed, 30)
      E_prov_cents = SUM over classes of round_half_up(payroll_cents * payroll_factor * elr / 100)   # per-class round then sum
      E_fin_cents  = SUM over classes of round_half_up(payroll_cents * elr / 100)
      W = round_half_up(clamp((E_fin_cents/100 - 20000) / 180000, 0.05, 0.75), 4dp)
      B_prov = round_half_up(0.10 * E_prov_cents);  B_fin = round_half_up(0.10 * E_fin_cents)
      Ee_prov = round_half_up(0.55 * E_prov_cents); Ee_fin = round_half_up(0.55 * E_fin_cents)
      effective(c) = round_half_up(incurred_cents * 0.3) if c.kind == MEDICAL_ONLY else incurred_cents
      claims_prov = claims of program in {REPORTED, ACCEPTED, CLOSED}    # DENIED excluded
      claims_fin  = claims of program in {ACCEPTED, CLOSED}              # REPORTED also excluded
      Ap_X = SUM over claims_X of min(effective(c), SPLIT_POINT_CENTS)
      Ae_X = SUM over claims_X of max(0, effective(c) - SPLIT_POINT_CENTS)
      EMR_prov = round_half_up((Ap_prov + W*Ae_prov + (1-W)*Ee_prov + B_prov) / (E_prov + B_prov), 2dp)
      EMR_fin  = round_half_up((Ap_fin  + W*Ae_fin  + (1-W)*Ee_fin  + B_fin)  / (E_fin  + B_fin),  2dp)
    input_set: "SafetyProgram payroll_by_class/elr_by_class; ClaimRecords of the program filtered per variant as above; division by zero (E==0) is impossible because activation requires payroll > 0"
    constants:
      SPLIT_POINT_CENTS: 1500000
      ERA_MEDICAL_ONLY_FACTOR: 0.3
      EXCESS_RATIO: 0.55
      BALLAST_RATE: 0.10
      W_FLOOR: 0.05
      W_CAP: 0.75
      W_OFFSET_DOLLARS: 20000
      W_SPAN_DOLLARS: 180000
    precision: "all money in integer cents; per-class E rounded half-up to the cent before summation; W to 4dp; published EMR to 2dp round_half_up"
    variants:
      - name: PROVISIONAL
        when: "forecast estimate mid-program: REPORTED claims included at current incurred; payroll annualized by payroll_factor"
        difference: "uses claims_prov and E_prov/B_prov/Ee_prov; identical claim data can yield a different EMR than FINAL because the inclusion set and payroll basis differ"
      - name: FINAL
        when: "unit-statistical valuation: only ACCEPTED|CLOSED claims; recorded payroll without annualization"
        difference: "uses claims_fin and E_fin/B_fin/Ee_fin"

  - name: prequal_score
    trigger: "on POST /safety/contractor-orgs/{id}/submit (all four source states)"
    algorithm: weighted_scoring
    formula: |
      emr_component = clamp((1.25 - emr) / 1.25, 0, 1) * 100
      trir_component = clamp((8.0 - trir) / 8.0, 0, 1) * 100
      days_to_expiry = (insurance_cert_expires_on - logical_today).days
      insurance_component = 100 if days_to_expiry >= 90 | 50 if 30 <= days_to_expiry <= 89 | 0 if days_to_expiry < 30
      prequal_score = round_half_up(0.40*emr_component + 0.30*trir_component + 0.20*safety_audit_pct + 0.10*insurance_component, 2dp)
      computed_decision = APPROVE if prequal_score >= 80.00 | CONDITIONAL if prequal_score >= 65.00 | REJECT otherwise
    input_set: "the ContractorOrg's emr, trir, safety_audit_pct, insurance_cert_expires_on (post-update values of the submit call)"
    constants:
      EMR_BENCHMARK: 1.25
      TRIR_BENCHMARK: 8.0
      W_EMR: 0.40
      W_TRIR: 0.30
      W_AUDIT: 0.20
      W_INSURANCE: 0.10
      BAND_APPROVE_MIN: 80.00
      BAND_CONDITIONAL_MIN: 65.00
      INS_FULL_DAYS: 90
      INS_PARTIAL_DAYS: 30
    precision: "score 2dp round_half_up; band comparison uses the ROUNDED 2dp score with >= (80.00 approves, 79.99 does not)"

  - name: program_posture
    trigger: "on POST /safety/programs/{id}/sweep"
    algorithm: threshold
    formula: |
      sweep effects first (overdue flips, SLA breach flags), then:
      posture = RESTRICTED if overdue_control_count >= 3 OR sla_breach_count >= 1
              | WATCH if overdue_control_count >= 1 OR integrity_flag OR overdue_lcr_count >= 1
              | NORMAL otherwise
    input_set: "this program's ControlItems, Hazards, LossControlRecommendations, and integrity_flag from calculations.leading_indicator_rates"
    constants:
      RESTRICTED_OVERDUE_CONTROLS: 3
    precision: "integer counts; >= comparisons as written"

  - name: certification_window
    trigger: "on POST /safety/training-assignments"
    algorithm: interval_merge
    formula: |
      existing = COMPLETED TrainingAssignments of same employee_id + course_id
      blocked if any existing has (cert_valid_until - logical_now) > course.renewal_window_days
      allowed when the live certification's remaining days <= renewal_window_days
      (remaining exactly == renewal_window_days is ALLOWED — comparison is strict >)
    input_set: "the employee's COMPLETED TrainingAssignments for the same course"
    constants: {}
    precision: "day-granularity comparison on (cert_valid_until - now)"

  - name: quorum_check
    trigger: "on POST /safety/committee-meetings/{id}/hold"
    algorithm: threshold
    formula: |
      committee_attendees = count of DISTINCT attendee_ids whose Employee.committee_member == true
      quorum satisfied iff committee_attendees >= program.quorum_min   (exactly quorum_min passes)
    input_set: "attendee_ids of the hold call; program.quorum_min"
    constants: {}
    precision: "integer count; boundary is inclusive >="

  - name: meeting_overlap
    trigger: "on POST /safety/committee-meetings"
    algorithm: interval_merge
    formula: |
      for the same program_id, a new meeting [scheduled_start, scheduled_end) conflicts with an
      existing meeting in {SCHEDULED, HELD} iff scheduled_start < existing.scheduled_end
      AND scheduled_end > existing.scheduled_start.
      Half-open semantics: back-to-back meetings (new.start == existing.end) do NOT conflict.
    input_set: "CommitteeMeetings of the same program in {SCHEDULED, HELD}"
    constants: {}
    precision: "strict inequalities; adjacency allowed"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header is a declared role and X-User-ID header is present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is listed in the endpoint's roles; for entity-backed ownership endpoints X-User-ID must equal the owning entity id (ContractorRep submit: X-User-ID == ContractorOrg.id; action-item complete by non-chair: X-User-ID == assignee_id)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids resolve left-to-right; body-supplied FK references (program_id, job_role_id, employee_id, course_id, hazard_id, meeting_id, assignee_id, implementer_id, reporter_id, evidence_control_id, suspension_claim_id, claim party ids) must exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path or body references" }
  - { priority: 4, category: existence, check: "request body well-formed: required fields present, enums in declared sets, severity/probability in 1..5, non-negative money/counts, scheduled_end after scheduled_start, FAIL outcomes carry note + new due_date, deny/void carry reason", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 5, category: state, check: "target resource's current state permits the transition (per §1.2); program-phase gates: activate only from DRAFT (ERR_PROGRAM_NOT_DRAFT), hazard/observation/LCR creation and hazard reopen require ACTIVE program (ERR_PROGRAM_NOT_ACTIVE), award approve requires CLOSED program (ERR_PROGRAM_NOT_CLOSED), config patch requires DRAFT, contractor decide requires UNDER_REVIEW (ERR_CONTRACTOR_NOT_UNDER_REVIEW), generic violations fall back to ERR_INVALID_STATE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "at most one SafetyProgram in ACTIVE at any time", error_id: ERR_PROGRAM_ALREADY_ACTIVE, http_status: 409, applies_to: ["POST /safety/programs/{id}/activate"] }
  - { priority: 7, category: business_safety, check: "segregation of duties: control verifier != implementer; action-item verifier != assignee; observation triager != reporter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: ["POST /safety/controls/{id}/verify", "POST /safety/action-items/{id}/verify", "POST /safety/observations/{id}/triage"] }
  - { priority: 8, category: business_safety, check: "posture gate: contractor APPROVE decision blocked while the ACTIVE program's posture is RESTRICTED", error_id: ERR_PROGRAM_RESTRICTED, http_status: 422, applies_to: ["POST /safety/contractor-orgs/{id}/decide"] }
  - { priority: 9, category: business_safety, check: "contractor decide must equal computed_decision from the banded prequal_score", error_id: ERR_DECISION_CONTRADICTS_SCORE, http_status: 422, applies_to: ["POST /safety/contractor-orgs/{id}/decide"] }
  - { priority: 10, category: business_constraint, check: "meeting half-open interval must not overlap another SCHEDULED|HELD meeting of the same program (adjacency allowed)", error_id: ERR_MEETING_OVERLAP, http_status: 409, applies_to: ["POST /safety/committee-meetings"] }
  - { priority: 11, category: business_constraint, check: "no second ASSIGNED TrainingAssignment for the same employee_id + course_id", error_id: ERR_DUPLICATE_ASSIGNMENT, http_status: 409, applies_to: ["POST /safety/training-assignments"] }
  - { priority: 12, category: business_constraint, check: "certification suppression window: reject when employee holds a COMPLETED assignment for the same course whose cert_valid_until - now exceeds renewal_window_days (strictly greater blocks; equal passes)", error_id: ERR_CERTIFICATION_ACTIVE, http_status: 409, applies_to: ["POST /safety/training-assignments"] }
  - { priority: 13, category: business_temporal, check: "occurred_at / implemented_at / completed_at must not be after the logical now", error_id: ERR_FUTURE_DATE_NOT_ALLOWED, http_status: 422, applies_to: ["POST /safety/observations", "POST /safety/controls/{id}/implement", "POST /safety/training-assignments/{id}/complete", "POST /safety/claims"] }
  - { priority: 14, category: business_temporal, check: "contractor submit requires insurance_cert_expires_on >= logical today (after applying any update in the same call)", error_id: ERR_INSURANCE_CERT_EXPIRED, http_status: 422, applies_to: ["POST /safety/contractor-orgs/{id}/submit"] }
  - { priority: 15, category: business_referential, check: "linked entity state: training complete requires employee ACTIVE; observation LINK_EXISTING requires hazard not CLOSED; LCR evidence control must be VERIFIED", error_id: ERR_EMPLOYEE_INACTIVE, http_status: 422, applies_to: ["POST /safety/training-assignments/{id}/complete", "POST /safety/training-assignments"] }
  - { priority: 16, category: business_referential, check: "triage LINK_EXISTING target hazard must not be CLOSED", error_id: ERR_HAZARD_NOT_OPEN, http_status: 422, applies_to: ["POST /safety/observations/{id}/triage"] }
  - { priority: 17, category: business_referential, check: "LCR respond evidence_control_id must reference a VERIFIED ControlItem", error_id: ERR_CONTROL_NOT_VERIFIED, http_status: 422, applies_to: ["POST /safety/loss-control-recommendations/{id}/respond"] }
  - { priority: 18, category: business_referential, check: "program close blocked while any hazard is non-CLOSED", error_id: ERR_OPEN_HAZARDS_REMAIN, http_status: 422, applies_to: ["POST /safety/programs/{id}/close"] }
  - { priority: 19, category: business_referential, check: "program close blocked while any recommendation is in ISSUED|OVERDUE|RESPONSE_SUBMITTED|CARRIER_REJECTED", error_id: ERR_OPEN_RECOMMENDATIONS_REMAIN, http_status: 422, applies_to: ["POST /safety/programs/{id}/close"] }
  - { priority: 20, category: business_referential, check: "program close blocked while any meeting is SCHEDULED|HELD", error_id: ERR_OPEN_MEETINGS_REMAIN, http_status: 422, applies_to: ["POST /safety/programs/{id}/close"] }
  - { priority: 21, category: business_referential, check: "program reconcile blocked while any award is CALCULATED|APPROVED", error_id: ERR_UNPAID_AWARDS_REMAIN, http_status: 422, applies_to: ["POST /safety/programs/{id}/reconcile"] }
  - { priority: 22, category: business_referential, check: "meeting hold quorum: distinct committee-member attendees >= quorum_min", error_id: ERR_QUORUM_NOT_MET, http_status: 422, applies_to: ["POST /safety/committee-meetings/{id}/hold"] }
  - { priority: 23, category: business_fiscal, check: "award approve blocked when program.remaining_budget_cents < payout_cents", error_id: ERR_INCENTIVE_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /safety/incentive-awards/{id}/approve"] }
  - { priority: 24, category: business_fiscal, check: "program activate requires complete payroll_by_class/elr_by_class covering LOW|MODERATE|HIGH with payroll_cents > 0", error_id: ERR_PAYROLL_INCOMPLETE, http_status: 422, applies_to: ["POST /safety/programs/{id}/activate"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Sets the logical clock used by all date comparisons; server starts at exactly 2026-08-01T00:00:00Z before any call (never wall-clock)", roles: [EHSAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  - { method: POST, path: "/safety/programs", description: "Create a SafetyProgram in DRAFT", roles: [EHSAdmin], code: 201, input: [program_year, scoring_variant, incentive_budget_cents, observation_target_rate, exposure_hours, payroll_by_class, elr_by_class, "near_miss_floor_ratio?", "quorum_min?"], output: SafetyProgram, side_effects: ["remaining_budget_cents initialized to incentive_budget_cents"] }
  - { method: GET, path: "/safety/programs", description: "List programs", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: ["status?", "program_year?", "limit?", "offset?"], output: "SafetyProgram[]", side_effects: [] }
  - { method: GET, path: "/safety/programs/{id}", description: "Read one program", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: [], output: SafetyProgram, side_effects: [] }
  - { method: PATCH, path: "/safety/programs/{id}/incentive-config", description: "Update program config; DRAFT only; OCC-guarded", roles: [EHSAdmin], code: 200, input: [expected_program_version, "incentive_budget_cents?", "observation_target_rate?", "near_miss_floor_ratio?", "quorum_min?", "exposure_hours?", "payroll_by_class?", "elr_by_class?"], output: SafetyProgram, side_effects: ["increments SafetyProgram.version by 1", "remaining_budget_cents tracks incentive_budget_cents change while no awards exist"] }
  - { method: POST, path: "/safety/programs/{id}/activate", description: "DRAFT -> ACTIVE", roles: [EHSAdmin], code: 200, input: [], output: SafetyProgram, side_effects: ["posture := NORMAL", "increments SafetyProgram.version by 1"] }
  - { method: POST, path: "/safety/programs/{id}/close", description: "ACTIVE -> CLOSED; computes bonus events then awards", roles: [EHSAdmin], code: 200, input: [], output: SafetyProgram, side_effects: ["creates CLAIMS_FREE_BONUS IncentiveEvents when BALANCED and claims-free", "creates IncentiveAward rows (CALCULATED) per calculations.award_payout", "increments SafetyProgram.version by 1"] }
  - { method: POST, path: "/safety/programs/{id}/reconcile", description: "CLOSED -> RECONCILED when all awards PAID|VOIDED", roles: [EHSAdmin], code: 200, input: [], output: SafetyProgram, side_effects: ["increments SafetyProgram.version by 1"] }
  - { method: POST, path: "/safety/programs/{id}/sweep", description: "Ops-run checkpoint: flips overdue controls, escalates action items, expires assignments and contractor prequals, flags SLA breaches, recomputes posture; optionally updates exposure_hours", roles: [EHSAdmin], code: 200, input: ["exposure_hours?"], output: "{ overdue_controls: integer, escalated_actions: integer, expired_assignments: integer, overdue_recommendations: integer, expired_contractors: integer, posture: string, sweep_index: integer }", side_effects: ["ControlItem PLANNED past due -> OVERDUE", "ActionItem ASSIGNED past due -> ESCALATED", "TrainingAssignment ASSIGNED past due -> EXPIRED", "LossControlRecommendation ISSUED past due -> OVERDUE", "ContractorOrg APPROVED past prequal_valid_until -> EXPIRED", "Hazard sla_breached flags", "posture recomputed", "sweep_index += 1", "increments SafetyProgram.version by 1"] }
  - { method: GET, path: "/safety/programs/{id}/leading-indicators", description: "Computed leading-indicator rates for the program", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, CarrierConsultant], code: 200, input: [], output: "{ observation_count: integer, near_miss_count: integer, exposure_hours: integer, observation_rate: number, near_miss_ratio: number, target_met: boolean, integrity_flag: boolean }", side_effects: [] }

  - { method: POST, path: "/safety/emr-forecasts", description: "Create an immutable EMR forecast snapshot (both variants); OCC-guarded on the program", roles: [EHSAdmin, SafetyManager], code: 201, input: [program_id, expected_program_version, "as_of?"], output: EMRForecast, side_effects: ["computes calculations.emr_forecast", "increments SafetyProgram.version by 1"] }
  - { method: GET, path: "/safety/emr-forecasts", description: "List forecasts", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, CarrierConsultant], code: 200, input: ["program_id?", "limit?", "offset?"], output: "EMRForecast[]", side_effects: [] }
  - { method: GET, path: "/safety/emr-forecasts/{id}", description: "Read one forecast", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, CarrierConsultant], code: 200, input: [], output: EMRForecast, side_effects: [] }

  - { method: POST, path: "/safety/job-roles", description: "Create a job role", roles: [EHSAdmin], code: 201, input: [title, hazard_class, "required_course_ids?"], output: JobRole, side_effects: [] }
  - { method: GET, path: "/safety/job-roles", description: "List job roles", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: ["hazard_class?", "required_course_ids?", "limit?", "offset?"], output: "JobRole[]", side_effects: [] }
  - { method: GET, path: "/safety/job-roles/{id}", description: "Read one job role", roles: [EHSAdmin, SafetyManager, Supervisor, CommitteeChair, Employee, ContractorRep, CarrierConsultant], code: 200, input: [], output: JobRole, side_effects: [] }

