# =============================================================================
# SCAFFOLD.yaml — Medical Group Board & Governance (independent physician group)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Medical Group Board & Governance (independent physician group board):
  shareholder/partner track & buy-in terms, board composition & voting rules,
  compensation committee & policy approval, capital call & distribution decisions,
  partner exit/buy-out valuation, committee charter (quality/finance/compensation),
  conflict-of-interest disclosure, merger/affiliation evaluation

domain_name: medical-group-governance
api_prefix: /governance

complexity_profile:
  primary_archetype: multi-party_negotiation   # quorum, thresholds, recusal, veto-equivalents
  secondary_archetype: compliance_audit        # COI disclosure, segregation of duties, sweeps
  complexity_layers:
    - optimistic_concurrency        # OCC on GovernancePolicy.version and ExitValuation.version
    - dual_variant_calculation      # buy-out valuation; distribution allocation
    - cascading_side_effects        # exit finalize chain; COI flag chain; default sweep chain
    - rate_threshold_triggers       # quorum count, supermajority ceil boundary, distribution cap
  entity_topology: flat             # peer entities joined by FK references; no URL nesting for ownership
  state_machine_shape: cyclic       # Motion OPEN<->TABLED; ExitValuation APPRAISED<->DISPUTED; plus parallel dims on Physician, compound on CapitalCall/Distribution/Committee
  relationship_patterns:
    - one_to_many
    - self_referential              # Motion.supersedes_motion_id
    - cross_aggregate               # ExitValuation.approving_motion_id; MergerProposal.deciding_motion_id
  role_model: segregation_of_duties # sponsor != voter on COMP_POLICY; filer != reviewer on COI; chair != sponsor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# All money is integer cents. All timestamps ISO8601 UTC with ms precision.
# A logical clock governs all time reads; default 2026-08-01T00:00:00Z (see clock endpoint).
# =============================================================================
entities:
  - name: GovernancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: singleton_key, type: string, source: system, description: "Always GLOBAL; exactly one policy may exist" }
      - { name: total_shares_authorized, type: integer, source: input, description: "Total share pool; treasury_shares = authorized - outstanding" }
      - { name: board_quorum_count, type: integer, source: input, default: 5, description: "Minimum non-voided ballots required to close a motion vote" }
      - { name: supermajority_num, type: integer, source: input, default: 2, description: "Supermajority numerator" }
      - { name: supermajority_den, type: integer, source: input, default: 3, description: "Supermajority denominator" }
      - { name: voting_window_days, type: integer, source: input, default: 14, description: "Days a motion stays OPEN after opening" }
      - { name: offer_window_days, type: integer, source: input, default: 30, description: "Days a buy-in offer remains acceptable (closed interval, inclusive of deadline)" }
      - { name: buy_in_base_shareholder_cents, type: integer, source: input, default: 25000000, description: "Base buy-in price for SHAREHOLDER tier" }
      - { name: buy_in_base_partner_cents, type: integer, source: input, default: 10000000, description: "Base buy-in price for PARTNER_TRACK tier" }
      - { name: tenure_discount_pct_per_year, type: number, source: input, default: 0.02, description: "Buy-in discount per full year of tenure" }
      - { name: max_tenure_discount_pct, type: number, source: input, default: 0.20, description: "Cap on cumulative tenure discount" }
      - { name: min_buy_in_cents, type: integer, source: input, default: 5000000, description: "Floor for any buy-in final amount" }
      - { name: fiscal_year_start_month, type: integer, source: input, default: 7, description: "Fiscal year starts July 1 (month 7)" }
      - { name: late_fee_pct, type: number, source: input, default: 0.10, description: "One-time late fee fraction on a delinquent assessment" }
      - { name: delinquency_grace_days, type: integer, source: input, default: 30, description: "Days after due_date before a DELINQUENT assessment becomes DEFAULTED" }
      - { name: minority_discount_pct, type: number, source: input, default: 0.15, description: "Minority-interest discount on appraised buy-out value for VOLUNTARY/RETIREMENT exits" }
      - { name: ebitda_multiple, type: number, source: input, default: 6, description: "Practice EBITDA multiple used in provisional buy-out valuation" }
      - { name: trailing_ebitda_cents, type: integer, source: input, default: 0, description: "Last reported trailing-twelve-month practice EBITDA" }
      - { name: bonus_pool_pct, type: number, source: input, default: 0.25, description: "Fraction of net income before bonus accrued to the physician bonus pool" }
      - { name: distribution_cap_pct, type: number, source: input, default: 0.60, description: "Fraction of net income after bonus that may be distributed" }
      - { name: seniority_carve_pct, type: number, source: input, default: 0.20, description: "Share of a SENIORITY_TIERED distribution split equally among senior shareholders" }
      - { name: seniority_tier_years, type: integer, source: input, default: 5, description: "Tenure threshold for the seniority carve" }
      - { name: max_dispute_rounds, type: integer, source: input, default: 2, description: "Maximum physician disputes of a party appraisal before arbitration" }
      - { name: max_committee_members, type: integer, source: input, default: 7, description: "Maximum ACTIVE members per committee" }
      - { name: comp_policy_version, type: integer, source: system, default: 0, description: "Increments each time a COMP_POLICY motion is ADOPTED" }
      - { name: treasury_shares, type: integer, source: computed, description: "total_shares_authorized - sum of shares_held over all non-EXITED physicians" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician full name" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date; tenure computed against the logical clock" }
      - { name: specialty, type: string, source: input, description: "Clinical specialty (free text)" }
      - { name: founding_shareholder, type: boolean, source: input, default: false, description: "If true, created directly as SHAREHOLDER holding initial_shares" }
      - { name: initial_shares, type: integer, source: input, default: 0, description: "Shares issued at creation; must be >= 1 when founding_shareholder is true; debited from treasury" }
      - { name: partnership_status, type: enum, source: system, description: "ASSOCIATE | PARTNER_TRACK | SHAREHOLDER | EXITING | EXITED" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING | PROBATION | SUSPENDED — parallel state dimension to partnership_status" }
      - { name: shares_held, type: integer, source: system, description: "Current voting shares; SHAREHOLDER tier only" }
      - { name: capital_account_balance_cents, type: integer, source: computed, description: "Ledger: += assessment payments, -= paid distribution allocations, += clawbacks; may go negative" }
      - { name: ownership_pct, type: number, source: computed, description: "shares_held / total shares outstanding (non-EXITED), 6 decimal places round_half_up" }
      - { name: tenure_years, type: integer, source: computed, description: "Full 365.25-day years elapsed between hire_date and the logical clock" }

  - name: BoardSeat
    parent: null
    common_fields: true
    fields:
      - { name: seat_label, type: string, source: input, description: "Human label, e.g. SEAT-1" }
      - { name: seat_class, type: enum, source: input, description: "CLINICAL | AT_LARGE | EX_OFFICIO" }
      - { name: status, type: enum, source: system, description: "VACANT | FILLED" }
      - { name: current_holder_physician_id, type: string, source: system, description: "FK -> Physician.id; null when VACANT" }
      - { name: current_term_start, type: datetime, source: system, description: "Current holder term start (half-open interval [start, end))" }
      - { name: current_term_end, type: datetime, source: system, description: "Current holder term end (exclusive)" }
      - { name: next_holder_physician_id, type: string, source: system, description: "FK -> Physician.id; booked successor, null when none" }
      - { name: next_term_start, type: datetime, source: system, description: "Successor term start; must be >= current_term_end (adjacency allowed)" }
      - { name: next_term_end, type: datetime, source: system, description: "Successor term end (exclusive)" }

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Committee name" }
      - { name: committee_type, type: enum, source: input, description: "QUALITY | FINANCE | COMPENSATION" }
      - { name: quorum_count, type: integer, source: input, description: "Minimum ACTIVE members for the committee to transact (charter field)" }
      - { name: approval_threshold, type: enum, source: input, description: "SIMPLE_MAJORITY | SUPERMAJORITY (charter field)" }
      - { name: charter_version, type: integer, source: system, default: 1, description: "Increments when a CHARTER_AMENDMENT motion is ADOPTED against this committee" }
      - { name: members, type: array, source: system, description: "Embedded list of {physician_id, committee_role: CHAIR|MEMBER, added_at}; not a separate entity" }
      - { name: active_member_count, type: integer, source: computed, description: "Length of members list" }
      - { name: status, type: enum, source: system, description: "CHARTERED | ACTIVE | IMPAIRED | DISSOLVED — compound: derived from active_member_count vs quorum_count" }

  - name: BuyInOffer
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; offeree" }
      - { name: target_tier, type: enum, source: input, description: "PARTNER_TRACK (from ASSOCIATE) | SHAREHOLDER (from ASSOCIATE or PARTNER_TRACK)" }
      - { name: share_grant, type: integer, source: input, description: "Shares issued on completion; must be > 0 for SHAREHOLDER tier, == 0 for PARTNER_TRACK" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments, 1..5" }
      - { name: offered_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: acceptance_deadline, type: datetime, source: computed, description: "offered_at + offer_window_days; closed interval — accept allowed AT the deadline instant" }
      - { name: tenure_years_at_offer, type: integer, source: computed, description: "Snapshot of physician tenure at offer time" }
      - { name: discount_pct_applied, type: number, source: computed, description: "min(tenure_years_at_offer * tenure_discount_pct_per_year, max_tenure_discount_pct)" }
      - { name: proration_twelfths, type: integer, source: computed, description: "Twelfths of the fiscal year remaining at offered_at (July offer = 12, June offer = 1)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Buy-in price per calculation buy_in_price" }
      - { name: installment_schedule_cents, type: array, source: computed, description: "installment_count entries; equal floor split with the remainder cents on the FIRST installment" }
      - { name: paid_installment_count, type: integer, source: system, default: 0, description: "Installments paid so far" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | COMPLETED | DECLINED | EXPIRED" }

  - name: Motion
    parent: null
    common_fields: true
    fields:
      - { name: motion_type, type: enum, source: input, description: "CHARTER_AMENDMENT | COMP_POLICY | CAPITAL_CALL | DISTRIBUTION | BUYOUT_APPROVAL | MERGER" }
      - { name: sponsor_physician_id, type: string, source: input, description: "FK -> Physician.id; must be SHAREHOLDER in GOOD_STANDING" }
      - { name: committee_id, type: string, source: input, description: "FK -> Committee.id; required for CHARTER_AMENDMENT, optional otherwise" }
      - { name: supersedes_motion_id, type: string, source: input, description: "FK -> Motion.id; optional self-reference; target must be DRAFT or PROPOSED and becomes SUPERSEDED" }
      - { name: payload, type: object, source: input, description: "Type-specific params: CAPITAL_CALL {amount_cents, due_date, purpose}; DISTRIBUTION {amount_cents, method, fiscal_net_income_before_bonus_cents}; CHARTER_AMENDMENT {new_quorum_count?, new_approval_threshold?}; COMP_POLICY {new_bonus_pool_pct}; BUYOUT_APPROVAL {exit_valuation_id}; MERGER {merger_proposal_id}" }
      - { name: threshold_type, type: enum, source: computed, description: "SIMPLE_MAJORITY for CAPITAL_CALL/DISTRIBUTION/COMP_POLICY; SUPERMAJORITY for CHARTER_AMENDMENT/BUYOUT_APPROVAL/MERGER; not part of the request schema — a client-supplied threshold_type is an unknown field (ERR_INVALID_REQUEST)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | OPEN | TABLED | ADOPTED | REJECTED | WITHDRAWN | EXPIRED | SUPERSEDED" }
      - { name: eligible_voter_ids, type: array, source: system, description: "Snapshot at open: physicians with partnership_status == SHAREHOLDER and standing == GOOD_STANDING at that instant" }
      - { name: recused_physician_ids, type: array, source: system, description: "Physicians recused via FLAGGED COI disclosure related to this motion" }
      - { name: eligible_voter_count, type: integer, source: computed, description: "len(eligible_voter_ids) - len(recused_physician_ids)" }
      - { name: required_votes, type: integer, source: computed, description: "SUPERMAJORITY: ceil(supermajority_num/supermajority_den * eligible_voter_count); SIMPLE_MAJORITY: informational field 0 (outcome is votes_for > votes_against among non-abstain ballots)" }
      - { name: votes_for, type: integer, source: computed, description: "Count of non-VOIDED FOR votes" }
      - { name: votes_against, type: integer, source: computed, description: "Count of non-VOIDED AGAINST votes" }
      - { name: votes_abstain, type: integer, source: computed, description: "Count of non-VOIDED ABSTAIN votes" }
      - { name: opened_at, type: datetime, source: system, description: "Clock time when opened (reset on resume)" }
      - { name: closes_at, type: datetime, source: system, description: "opened_at + voting_window_days; ballots accepted while clock < closes_at (strict)" }

  - name: Vote
    parent: null
    common_fields: true
    fields:
      - { name: motion_id, type: string, source: system, description: "FK -> Motion.id; from path" }
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; voter, from X-User-ID header" }
      - { name: vote_choice, type: enum, source: input, description: "FOR | AGAINST | ABSTAIN" }
      - { name: status, type: enum, source: system, description: "CAST | VOIDED (voided only by the COI recusal cascade)" }
      - { name: void_reason, type: string, source: system, description: "COI_RECUSAL when voided; null otherwise" }

  - name: CapitalCall
    parent: null
    common_fields: true
    fields:
      - { name: motion_id, type: string, source: system, description: "FK -> Motion.id; created by CAPITAL_CALL motion adoption" }
      - { name: purpose, type: string, source: system, description: "From motion payload" }
      - { name: total_amount_cents, type: integer, source: system, description: "From motion payload" }
      - { name: due_date, type: datetime, source: system, description: "From motion payload; must be strictly after the clock at motion creation" }
      - { name: assessed_total_cents, type: integer, source: computed, description: "Sum of assessments created at billing" }
      - { name: collected_cents, type: integer, source: computed, description: "Sum of paid_cents across its assessments" }
      - { name: status, type: enum, source: system, description: "APPROVED | BILLED | COLLECTED | PARTIALLY_DEFAULTED — compound over child assessments" }

  - name: CapitalCallAssessment
    parent: null
    common_fields: true
    fields:
      - { name: capital_call_id, type: string, source: system, description: "FK -> CapitalCall.id" }
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; shareholder snapshot at billing" }
      - { name: shares_at_billing, type: integer, source: system, description: "Share snapshot used for the assessment" }
      - { name: assessed_cents, type: integer, source: computed, description: "floor(total * shares / total_shares) with residual pennies to largest holders (see capital_call_assessment calc)" }
      - { name: late_fee_cents, type: integer, source: system, default: 0, description: "round_half_up(assessed_cents * late_fee_pct), applied once on transition to DELINQUENT" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments" }
      - { name: total_due_cents, type: integer, source: computed, description: "assessed_cents + late_fee_cents" }
      - { name: status, type: enum, source: system, description: "BILLED | PARTIAL | PAID | DELINQUENT | DEFAULTED" }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: motion_id, type: string, source: system, description: "FK -> Motion.id; created by DISTRIBUTION motion adoption" }
      - { name: total_amount_cents, type: integer, source: system, description: "From motion payload" }
      - { name: method, type: enum, source: system, description: "PRO_RATA | SENIORITY_TIERED — from motion payload" }
      - { name: fiscal_net_income_before_bonus_cents, type: integer, source: system, description: "From motion payload; input to distributable_cap" }
      - { name: bonus_accrual_cents, type: integer, source: computed, description: "round_half_up(NIBB * bonus_pool_pct)" }
      - { name: distributable_cap_cents, type: integer, source: computed, description: "round_half_up((NIBB - bonus_accrual_cents) * distribution_cap_pct)" }
      - { name: allocations, type: array, source: system, description: "Embedded list of {physician_id, allocated_cents, status: PENDING | PAID | CLAWED_BACK | CANCELLED} computed at adoption; physician_id is a plain reference, not a lint FK" }
      - { name: status, type: enum, source: system, description: "APPROVED | PAID | VOIDED — PAID is compound (all allocations PAID)" }

  - name: ExitValuation
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; exiting shareholder" }
      - { name: trigger_type, type: enum, source: input, description: "VOLUNTARY | RETIREMENT | TERMINATION | DEATH" }
      - { name: ownership_pct_snapshot, type: number, source: computed, description: "ownership_pct at initiation (exact fraction used internally; 6dp display)" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "Book-style estimate at initiation (see buy_out_valuation, provisional variant)" }
      - { name: appraised_practice_value_cents, type: integer, source: input, description: "Whole-practice appraisal value submitted via appraise" }
      - { name: final_value_cents, type: integer, source: computed, description: "Appraisal-based buy-out (see buy_out_valuation, final variant)" }
      - { name: appraisal_final, type: boolean, source: system, default: false, description: "True once an arbitrator appraisal is recorded; blocks further disputes" }
      - { name: dispute_rounds, type: integer, source: system, default: 0, description: "Number of physician disputes raised" }
      - { name: approving_motion_id, type: string, source: system, description: "FK -> Motion.id; adopted BUYOUT_APPROVAL motion consumed at finalize" }
      - { name: payment_schedule_cents, type: array, source: computed, description: "Computed at finalize: 40% at finalization, 30% at +12 months, 30% at +24 months; each entry round_half_up, last entry absorbs rounding residue" }
      - { name: status, type: enum, source: system, description: "INITIATED | APPRAISED | DISPUTED | ARBITRATION | FINALIZED" }

  - name: COIDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: system, description: "FK -> Physician.id; filer, from X-User-ID header" }
      - { name: related_motion_id, type: string, source: input, description: "FK -> Motion.id; optional motion the conflict relates to" }
      - { name: description, type: string, source: input, description: "Nature of the conflict" }
      - { name: status, type: enum, source: system, description: "FILED | CLEARED | FLAGGED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the reviewing ComplianceOfficer" }
      - { name: review_note, type: string, source: system, description: "Optional note recorded at review" }

  - name: MergerProposal
    parent: null
    common_fields: true
    fields:
      - { name: counterparty_name, type: string, source: input, description: "Affiliation/merger counterparty" }
      - { name: exchange_ratio_x1000, type: integer, source: input, description: "Share exchange ratio * 1000 (integer to avoid float drift)" }
      - { name: cash_consideration_cents, type: integer, source: input, description: "Cash component of the offer" }
      - { name: diligence_note, type: string, source: system, description: "Optional note recorded on advance" }
      - { name: deciding_motion_id, type: string, source: system, description: "FK -> Motion.id; MERGER motion consumed at decide" }
      - { name: status, type: enum, source: system, description: "PROPOSED | DUE_DILIGENCE | NEGOTIATION | APPROVED | REJECTED | TERMINATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Physician
    note: "Two parallel state dimensions on one row: partnership_status and standing evolve independently."
    dimensions:
      - field: partnership_status
        initial_state: ASSOCIATE   # or SHAREHOLDER when founding_shareholder=true
        terminal_states: [EXITED]
        transitions:
          - { from: ASSOCIATE, to: PARTNER_TRACK, trigger: "buy-in offer COMPLETED (target_tier=PARTNER_TRACK)", actor: system, preconditions: ["offer COMPLETED"], side_effects: ["no shares issued"] }
          - { from: ASSOCIATE, to: SHAREHOLDER, trigger: "buy-in offer COMPLETED (target_tier=SHAREHOLDER)", actor: system, preconditions: ["offer COMPLETED", "treasury_shares >= share_grant"], side_effects: ["shares_held += share_grant", "treasury_shares -= share_grant"] }
          - { from: PARTNER_TRACK, to: SHAREHOLDER, trigger: "buy-in offer COMPLETED (target_tier=SHAREHOLDER)", actor: system, preconditions: ["offer COMPLETED", "treasury_shares >= share_grant"], side_effects: ["shares_held += share_grant", "treasury_shares -= share_grant"] }
          - { from: SHAREHOLDER, to: EXITING, trigger: "POST /governance/exit-valuations", actor: "Physician (self) or BoardAdmin", preconditions: ["no other non-terminal ExitValuation for this physician"], side_effects: [] }
          - { from: EXITING, to: EXITED, trigger: "POST /governance/exit-valuations/{id}/finalize", actor: BoardAdmin, preconditions: ["valuation APPRAISED", "adopted BUYOUT_APPROVAL motion linking this valuation"], side_effects: ["shares_held -> 0", "treasury_shares += returned shares", "board seat vacated/successor promoted", "committee memberships removed", "committee impairment re-check (cascade depth 3)"] }
      - field: standing
        initial_state: GOOD_STANDING
        terminal_states: []
        transitions:
          - { from: GOOD_STANDING, to: PROBATION, trigger: "POST /governance/physicians/{id}/standing", actor: BoardAdmin, preconditions: ["partnership_status != EXITED"], side_effects: [] }
          - { from: GOOD_STANDING, to: SUSPENDED, trigger: "POST /governance/physicians/{id}/standing", actor: BoardAdmin, preconditions: ["partnership_status != EXITED"], side_effects: [] }
          - { from: PROBATION, to: GOOD_STANDING, trigger: "POST /governance/physicians/{id}/standing", actor: BoardAdmin, preconditions: [], side_effects: [] }
          - { from: PROBATION, to: SUSPENDED, trigger: "POST /governance/physicians/{id}/standing", actor: BoardAdmin, preconditions: [], side_effects: [] }
          - { from: SUSPENDED, to: GOOD_STANDING, trigger: "POST /governance/physicians/{id}/standing", actor: BoardAdmin, preconditions: [], side_effects: [] }
          - { from: GOOD_STANDING, to: SUSPENDED, trigger: "system clock sweep (assessment DEFAULTED cascade)", actor: system, preconditions: [], side_effects: [] }
          - { from: PROBATION, to: SUSPENDED, trigger: "system clock sweep (assessment DEFAULTED cascade)", actor: system, preconditions: [], side_effects: [] }

  - entity: BoardSeat
    initial_state: VACANT
    terminal_states: []
    transitions:
      - from: VACANT
        to: FILLED
        trigger: "POST /governance/board-seats/{id}/appoint"
        actor: BoardAdmin
        preconditions:
          - "holder physician exists and has partnership_status == SHAREHOLDER and standing != SUSPENDED (ERR_INVALID_STATE)"
          - "term_end > term_start (ERR_TERM_WINDOW_INVALID)"
        side_effects: ["current holder and term window set", "increments BoardSeat.version by 1"]
      - from: FILLED
        to: FILLED
        trigger: "POST /governance/board-seats/{id}/appoint (successor booking)"
        actor: BoardAdmin
        preconditions:
          - "no successor currently booked (ERR_SUCCESSOR_ALREADY_BOOKED)"
          - "next_term_start >= current_term_end — half-open intervals, adjacency allowed (ERR_SEAT_TERM_OVERLAP)"
          - "term_end > term_start (ERR_TERM_WINDOW_INVALID)"
          - "successor physician SHAREHOLDER and not SUSPENDED (ERR_INVALID_STATE)"
        side_effects: ["next_* fields set", "increments BoardSeat.version by 1"]
      - from: FILLED
        to: VACANT
        trigger: "system clock sweep at clock >= current_term_end with no successor booked"
        actor: system
        preconditions: []
        side_effects: ["current holder cleared"]
      - from: FILLED
        to: FILLED
        trigger: "system clock sweep at clock >= current_term_end with a successor booked"
        actor: system
        preconditions: []
        side_effects: ["next holder promoted to current; next_* cleared"]
      - from: FILLED
        to: VACANT
        trigger: "partner exit finalize cascade (holder exits)"
        actor: system
        preconditions: []
        side_effects: ["if a successor is booked, successor is promoted instead (stays FILLED)"]
      - from: FILLED
        to: FILLED
        trigger: "partner exit finalize cascade with booked successor"
        actor: system
        preconditions: []
        side_effects: ["successor promoted"]

  - entity: Committee
    initial_state: CHARTERED
    terminal_states: [DISSOLVED]
    transitions:
      - { from: CHARTERED, to: ACTIVE, trigger: "system (member add makes active_member_count >= quorum_count)", actor: system, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: IMPAIRED, trigger: "system (member removal or exit cascade drops active_member_count < quorum_count; or adopted CHARTER_AMENDMENT raises quorum_count above active_member_count)", actor: system, preconditions: [], side_effects: [] }
      - { from: IMPAIRED, to: ACTIVE, trigger: "system (member add restores active_member_count >= quorum_count)", actor: system, preconditions: [], side_effects: [] }
      - { from: CHARTERED, to: DISSOLVED, trigger: "POST /governance/committees/{id}/dissolve", actor: BoardAdmin, preconditions: ["no motion referencing this committee in OPEN or TABLED (ERR_INVALID_STATE)"], side_effects: ["members list cleared"] }
      - { from: ACTIVE, to: DISSOLVED, trigger: "POST /governance/committees/{id}/dissolve", actor: BoardAdmin, preconditions: ["no motion referencing this committee in OPEN or TABLED (ERR_INVALID_STATE)"], side_effects: ["members list cleared"] }
      - { from: IMPAIRED, to: DISSOLVED, trigger: "POST /governance/committees/{id}/dissolve", actor: BoardAdmin, preconditions: ["no motion referencing this committee in OPEN or TABLED (ERR_INVALID_STATE)"], side_effects: ["members list cleared"] }

  - entity: BuyInOffer
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, EXPIRED]
    transitions:
      - { from: OFFERED, to: ACCEPTED, trigger: "POST /governance/buy-in-offers/{id}/respond (decision=ACCEPT)", actor: "Physician (self)", preconditions: ["offer still OFFERED (ERR_OFFER_NOT_OPEN) — the clock sweep expires offers atomically with clock-set, so a past-deadline offer is already EXPIRED"], side_effects: ["installment schedule active", "increments BuyInOffer.version by 1"] }
      - { from: OFFERED, to: DECLINED, trigger: "POST /governance/buy-in-offers/{id}/respond (decision=DECLINE)", actor: "Physician (self)", preconditions: [], side_effects: ["increments BuyInOffer.version by 1"] }
      - { from: OFFERED, to: EXPIRED, trigger: "system clock sweep at clock > acceptance_deadline (strict; AT the deadline the offer is still acceptable)", actor: system, preconditions: [], side_effects: [] }
      - { from: ACCEPTED, to: COMPLETED, trigger: "system (POST .../pay-installment brings paid_installment_count == installment_count)", actor: system, preconditions: [], side_effects: ["Physician.partnership_status advances to target_tier", "if target SHAREHOLDER: shares_held += share_grant, treasury_shares -= share_grant", "Physician.version and BuyInOffer.version increment"] }

  - entity: Motion
    initial_state: DRAFT
    terminal_states: [ADOPTED, REJECTED, WITHDRAWN, EXPIRED, SUPERSEDED]
    transitions:
      - { from: DRAFT, to: PROPOSED, trigger: "POST /governance/motions/{id}/propose", actor: "Physician (sponsor) or BoardAdmin", preconditions: ["sponsor still SHAREHOLDER and GOOD_STANDING (ERR_INVALID_STATE)"], side_effects: ["increments Motion.version by 1"] }
      - { from: PROPOSED, to: OPEN, trigger: "POST /governance/motions/{id}/open", actor: "Physician (sponsor) or BoardAdmin", preconditions: ["sponsor still SHAREHOLDER and GOOD_STANDING (ERR_INVALID_STATE)", "for CHARTER_AMENDMENT: committee status == ACTIVE (ERR_COMMITTEE_IMPAIRED)"], side_effects: ["eligible_voter_ids snapshot taken", "opened_at = clock, closes_at = clock + voting_window_days", "increments Motion.version by 1"] }
      - { from: OPEN, to: TABLED, trigger: "POST /governance/motions/{id}/table", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["voting paused; cast votes retained", "increments Motion.version by 1"] }
      - { from: TABLED, to: OPEN, trigger: "POST /governance/motions/{id}/resume", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["opened_at = clock; closes_at = clock + voting_window_days (fresh window)", "increments Motion.version by 1"] }
      - { from: OPEN, to: ADOPTED, trigger: "POST /governance/motions/{id}/close", actor: BoardAdmin, preconditions: ["non-voided ballots cast >= board_quorum_count (ERR_QUORUM_NOT_MET)", "threshold met: SUPERMAJORITY votes_for >= required_votes; SIMPLE_MAJORITY votes_for > votes_against"], side_effects: ["type-specific effects — see below", "increments Motion.version by 1"] }
      - { from: OPEN, to: REJECTED, trigger: "POST /governance/motions/{id}/close", actor: BoardAdmin, preconditions: ["non-voided ballots cast >= board_quorum_count (ERR_QUORUM_NOT_MET)", "threshold not met"], side_effects: ["increments Motion.version by 1"] }
      - { from: OPEN, to: EXPIRED, trigger: "system clock sweep at clock > closes_at", actor: system, preconditions: [], side_effects: [] }
      - { from: TABLED, to: EXPIRED, trigger: "system clock sweep at clock > closes_at", actor: system, preconditions: [], side_effects: [] }
      - { from: DRAFT, to: WITHDRAWN, trigger: "POST /governance/motions/{id}/withdraw", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["increments Motion.version by 1"] }
      - { from: PROPOSED, to: WITHDRAWN, trigger: "POST /governance/motions/{id}/withdraw", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["increments Motion.version by 1"] }
      - { from: TABLED, to: WITHDRAWN, trigger: "POST /governance/motions/{id}/withdraw", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["increments Motion.version by 1"] }
      - { from: DRAFT, to: SUPERSEDED, trigger: "POST /governance/motions with supersedes_motion_id = this motion", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["increments Motion.version by 1"] }
      - { from: PROPOSED, to: SUPERSEDED, trigger: "POST /governance/motions with supersedes_motion_id = this motion", actor: "Physician (sponsor) or BoardAdmin", preconditions: [], side_effects: ["increments Motion.version by 1"] }
    adoption_side_effects_by_type:
      CAPITAL_CALL: "Create CapitalCall(status=APPROVED, total_amount_cents/purpose/due_date from payload)."
      DISTRIBUTION: "Re-check at least one eligible shareholder exists (status == SHAREHOLDER exactly; ERR_NO_ELIGIBLE_RECIPIENTS); create Distribution(status=APPROVED) with allocations computed per distribution_allocation."
      CHARTER_AMENDMENT: "Committee quorum_count / approval_threshold updated from payload; charter_version += 1; if active_member_count < new quorum_count the committee transitions ACTIVE -> IMPAIRED."
      COMP_POLICY: "GovernancePolicy.bonus_pool_pct := payload.new_bonus_pool_pct; comp_policy_version += 1; GovernancePolicy.version += 1."
      BUYOUT_APPROVAL: "No direct effect; the adopted motion is consumed by ExitValuation finalize (payload.exit_valuation_id must match)."
      MERGER: "No direct effect; the adopted motion is consumed by MergerProposal decide (payload.merger_proposal_id must match)."

  - entity: Vote
    initial_state: CAST
    terminal_states: [VOIDED]
    transitions:
      - { from: CAST, to: VOIDED, trigger: "system (COI disclosure FLAGGED cascade on the related motion)", actor: system, preconditions: [], side_effects: ["void_reason = COI_RECUSAL", "Motion tallies recomputed excluding this vote"] }

  - entity: CapitalCall
    initial_state: APPROVED
    terminal_states: [COLLECTED, PARTIALLY_DEFAULTED]
    transitions:
      - { from: APPROVED, to: BILLED, trigger: "POST /governance/capital-calls/{id}/bill", actor: BoardAdmin, preconditions: [], side_effects: ["per-shareholder assessments created (snapshot: physicians with partnership_status == SHAREHOLDER, any standing)", "increments CapitalCall.version by 1"] }
      - { from: BILLED, to: COLLECTED, trigger: "system (every assessment reaches PAID)", actor: system, preconditions: [], side_effects: [] }
      - { from: BILLED, to: PARTIALLY_DEFAULTED, trigger: "system (>= 1 assessment DEFAULTED and every other assessment PAID or DEFAULTED)", actor: system, preconditions: [], side_effects: [] }

  - entity: CapitalCallAssessment
    initial_state: BILLED
    terminal_states: [PAID, DEFAULTED]
    transitions:
      - { from: BILLED, to: PARTIAL, trigger: "POST /governance/capital-call-assessments/{id}/pay with 0 < paid_cents < total_due_cents", actor: "Physician (self) or BoardAdmin", preconditions: [], side_effects: ["Physician.capital_account_balance_cents += amount", "CapitalCall.collected_cents recomputed"] }
      - { from: BILLED, to: PAID, trigger: "POST .../pay bringing paid_cents == total_due_cents", actor: "Physician (self) or BoardAdmin", preconditions: [], side_effects: ["capital account += amount", "call collected_cents recomputed; if all assessments PAID -> CapitalCall COLLECTED (bubble-up)"] }
      - { from: PARTIAL, to: PAID, trigger: "POST .../pay bringing paid_cents == total_due_cents", actor: "Physician (self) or BoardAdmin", preconditions: [], side_effects: ["same as BILLED -> PAID"] }
      - { from: BILLED, to: DELINQUENT, trigger: "system clock sweep at clock > due_date and not fully paid", actor: system, preconditions: [], side_effects: ["late_fee_cents = round_half_up(assessed_cents * late_fee_pct) applied once"] }
      - { from: PARTIAL, to: DELINQUENT, trigger: "system clock sweep at clock > due_date and not fully paid", actor: system, preconditions: [], side_effects: ["late fee applied once"] }
      - { from: DELINQUENT, to: PAID, trigger: "POST .../pay bringing paid_cents == total_due_cents (incl. late fee)", actor: "Physician (self) or BoardAdmin", preconditions: [], side_effects: ["capital account += amount", "call recompute / bubble-up"] }
      - { from: DELINQUENT, to: DEFAULTED, trigger: "system clock sweep at clock > due_date + delinquency_grace_days (strict; AT exactly due+grace still DELINQUENT)", actor: system, preconditions: [], side_effects: ["Physician.standing -> SUSPENDED (cascade link 2)", "if no payable assessments remain -> CapitalCall PARTIALLY_DEFAULTED (bubble-up)"] }

  - entity: Distribution
    initial_state: APPROVED
    terminal_states: [PAID, VOIDED]
    transitions:
      - { from: APPROVED, to: PAID, trigger: "system (every allocation PAID via POST .../allocations/{physician_id}/pay)", actor: system, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: VOIDED, trigger: "POST /governance/distributions/{id}/void", actor: BoardAdmin, preconditions: [], side_effects: ["PENDING allocations -> CANCELLED", "PAID allocations -> CLAWED_BACK and Physician.capital_account_balance_cents += allocated_cents (compensation)"] }
      - { from: PAID, to: VOIDED, trigger: "POST /governance/distributions/{id}/void", actor: BoardAdmin, preconditions: [], side_effects: ["all PAID allocations -> CLAWED_BACK with capital account compensation"] }

  - entity: ExitValuation
    initial_state: INITIATED
    terminal_states: [FINALIZED]
    transitions:
      - { from: INITIATED, to: APPRAISED, trigger: "POST /governance/exit-valuations/{id}/appraise", actor: BoardAdmin, preconditions: ["expected_valuation_version matches (OCC, ERR_STALE_VERSION)"], side_effects: ["final_value_cents computed (final variant)", "Physician.partnership_status SHAREHOLDER -> EXITING was set at initiation", "increments ExitValuation.version by 1"] }
      - { from: APPRAISED, to: APPRAISED, trigger: "POST .../appraise (corrected appraisal supersedes the prior one)", actor: BoardAdmin, preconditions: ["expected_valuation_version matches (OCC, ERR_STALE_VERSION)"], side_effects: ["final_value_cents recomputed", "increments ExitValuation.version by 1"] }
      - { from: DISPUTED, to: APPRAISED, trigger: "POST .../appraise (re-appraisal)", actor: BoardAdmin, preconditions: ["expected_valuation_version matches (OCC)"], side_effects: ["final_value_cents recomputed", "increments ExitValuation.version by 1"] }
      - { from: ARBITRATION, to: APPRAISED, trigger: "POST .../appraise (arbitrator value)", actor: BoardAdmin, preconditions: ["expected_valuation_version matches (OCC)"], side_effects: ["appraisal_final = true", "increments ExitValuation.version by 1"] }
      - { from: APPRAISED, to: DISPUTED, trigger: "POST /governance/exit-valuations/{id}/dispute", actor: "Physician (self)", preconditions: ["appraisal_final == false (ERR_INVALID_STATE)", "dispute_rounds < max_dispute_rounds (ERR_DISPUTE_LIMIT_REACHED)"], side_effects: ["dispute_rounds += 1", "increments ExitValuation.version by 1"] }
      - { from: DISPUTED, to: ARBITRATION, trigger: "POST /governance/exit-valuations/{id}/arbitrate", actor: BoardAdmin, preconditions: [], side_effects: ["increments ExitValuation.version by 1"] }
      - { from: APPRAISED, to: FINALIZED, trigger: "POST /governance/exit-valuations/{id}/finalize", actor: BoardAdmin, preconditions: ["motion_id references an ADOPTED BUYOUT_APPROVAL motion whose payload.exit_valuation_id == this valuation (ERR_BUYOUT_NOT_APPROVED)", "motion not already consumed by another finalize"], side_effects: ["approving_motion_id set", "payment_schedule_cents computed", "Physician EXITING -> EXITED, shares_held -> 0, treasury_shares += returned shares (cascade link 1)", "held BoardSeat vacated / successor promoted (cascade link 2)", "committee memberships removed; committees below quorum -> IMPAIRED (cascade link 3)"] }

  - entity: COIDisclosure
    initial_state: FILED
    terminal_states: [CLEARED, FLAGGED]
    transitions:
      - { from: FILED, to: CLEARED, trigger: "POST /governance/coi-disclosures/{id}/review (outcome=CLEARED)", actor: ComplianceOfficer, preconditions: [], side_effects: ["no recusal effect"] }
      - { from: FILED, to: FLAGGED, trigger: "POST /governance/coi-disclosures/{id}/review (outcome=FLAGGED)", actor: ComplianceOfficer, preconditions: [], side_effects: ["if related_motion_id set AND motion status in {OPEN, TABLED}: physician added to motion.recused_physician_ids; eligible_voter_count and required_votes recomputed (cascade link 1); any CAST vote by that physician on that motion -> VOIDED, tallies recomputed (cascade link 2)", "if the related motion is already terminal: no recusal cascade (record only)"] }

  - entity: MergerProposal
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, TERMINATED]
    transitions:
      - { from: PROPOSED, to: DUE_DILIGENCE, trigger: "POST /governance/merger-proposals/{id}/advance", actor: BoardAdmin, preconditions: [], side_effects: ["diligence_note recorded if supplied", "increments MergerProposal.version by 1"] }
      - { from: DUE_DILIGENCE, to: NEGOTIATION, trigger: "POST /governance/merger-proposals/{id}/advance", actor: BoardAdmin, preconditions: [], side_effects: ["increments MergerProposal.version by 1"] }
      - { from: NEGOTIATION, to: APPROVED, trigger: "POST /governance/merger-proposals/{id}/decide (outcome=APPROVED, motion_id)", actor: BoardAdmin, preconditions: ["motion_id references an ADOPTED MERGER motion whose payload.merger_proposal_id == this proposal (ERR_MERGER_NOT_APPROVED)"], side_effects: ["deciding_motion_id set", "increments MergerProposal.version by 1"] }
      - { from: NEGOTIATION, to: REJECTED, trigger: "POST .../decide (outcome=REJECTED, motion_id)", actor: BoardAdmin, preconditions: ["motion_id references a REJECTED MERGER motion whose payload.merger_proposal_id == this proposal (ERR_MERGER_NOT_APPROVED)"], side_effects: ["deciding_motion_id set"] }
      - { from: PROPOSED, to: TERMINATED, trigger: "POST .../decide (outcome=TERMINATE)", actor: BoardAdmin, preconditions: [], side_effects: [] }
      - { from: DUE_DILIGENCE, to: TERMINATED, trigger: "POST .../decide (outcome=TERMINATE)", actor: BoardAdmin, preconditions: [], side_effects: [] }
      - { from: NEGOTIATION, to: TERMINATED, trigger: "POST .../decide (outcome=TERMINATE)", actor: BoardAdmin, preconditions: [], side_effects: [] }

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: policy-update-stale-version
    parent_entity: GovernancePolicy
    write_endpoint: "PATCH /governance/policy"
    occ_field: expected_policy_version
    description: |
      Updating the GovernancePolicy with an expected_policy_version that no
      longer matches the policy's current version is rejected. This captures
      the case where another writer has modified the policy since the client
      last read it, so the client's edit would silently discard that update.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: valuation-appraise-stale-version
    parent_entity: ExitValuation
    write_endpoint: "POST /governance/exit-valuations/{id}/appraise"
    occ_field: expected_valuation_version
    description: |
      Recording an appraisal against an ExitValuation whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has recorded a corrected appraisal (which
      legitimately supersedes the prior value) and the current writer's view
      of the valuation is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: buy_in_price
    trigger: "POST /governance/buy-in-offers (at creation)"
    algorithm: tiered_pricing
    formula: |
      tenure_years = floor((offered_at - hire_date) / 365.25 days)
      discount_pct = min(tenure_years * tenure_discount_pct_per_year, max_tenure_discount_pct)
      tier_base = buy_in_base_shareholder_cents if target_tier == SHAREHOLDER else buy_in_base_partner_cents
      fiscal_month_index = ((month(offered_at) - fiscal_year_start_month) mod 12) + 1   # July -> 1, June -> 12
      proration_twelfths = 13 - fiscal_month_index                                      # July -> 12, June -> 1
      discounted = tier_base * (1 - discount_pct)
      prorated = round_half_up(discounted * proration_twelfths / 12)  # to whole cents
      final_amount_cents = max(prorated, min_buy_in_cents)
      installment schedule: base = floor(final_amount_cents / installment_count);
      first installment = base + (final_amount_cents - base * installment_count); rest = base.
    input_set: "The offeree Physician (hire_date) and GovernancePolicy constants at creation time"
    constants: { TENURE_DISCOUNT_PCT_PER_YEAR: 0.02, MAX_TENURE_DISCOUNT_PCT: 0.20, MIN_BUY_IN_CENTS: 5000000, BASE_SHAREHOLDER: 25000000, BASE_PARTNER: 10000000, FISCAL_YEAR_START_MONTH: 7 }
    precision: "integer cents, round_half_up at the proration step only; nested min/max order pinned as written"
    variants: []

  - name: distributable_cap
    trigger: "POST /governance/motions (motion_type=DISTRIBUTION, at creation) and re-validated at adoption"
    algorithm: constraint_propagation
    formula: |
      bonus_accrual_cents = round_half_up(fiscal_net_income_before_bonus_cents * bonus_pool_pct)
      net_after_bonus = fiscal_net_income_before_bonus_cents - bonus_accrual_cents
      distributable_cap_cents = round_half_up(net_after_bonus * distribution_cap_pct)
      require payload.amount_cents <= distributable_cap_cents (ERR_DISTRIBUTION_CAP_EXCEEDED)
      EVALUATION ORDER IS PINNED: bonus accrual is computed from pre-bonus net income FIRST,
      then the cap is applied to the remainder. Computing the cap directly on pre-bonus net
      income is a different (wrong) result.
    input_set: "Motion payload fiscal_net_income_before_bonus_cents and amount_cents; GovernancePolicy bonus_pool_pct and distribution_cap_pct"
    constants: { BONUS_POOL_PCT: 0.25, DISTRIBUTION_CAP_PCT: 0.60 }
    precision: "integer cents, round_half_up at each of the two rounding steps"
    variants: []

  - name: distribution_allocation
    trigger: "DISTRIBUTION motion adoption (close -> ADOPTED)"
    algorithm: waterfall_allocation
    formula: |
      eligible = physicians with partnership_status == SHAREHOLDER exactly AND standing != SUSPENDED
      (EXITING/EXITED excluded; NOTE the deliberate asymmetry: SUSPENDED shareholders are excluded
      from benefit distributions but are still assessed by capital calls)
      PRO_RATA variant:
        raw_i = total_amount_cents * shares_i / sum(shares over eligible)
        alloc_i = floor(raw_i)
        residual = total - sum(alloc_i); distribute residual one cent at a time to the
        top `residual` physicians ordered by shares_held DESC, tie-break Physician.created_at ASC.
      SENIORITY_TIERED variant (two stages, order pinned: carve first, pro-rata remainder second):
        carve = round_half_up(total_amount_cents * seniority_carve_pct)
        seniors = eligible with tenure_years >= seniority_tier_years
        if seniors empty: entire total allocated pro-rata as above.
        else: each senior gets floor(carve / |seniors|); carve residual pennies one each by
        Physician.created_at ASC. remainder = total - carve allocated pro-rata over ALL eligible
        (same floor + residual rule as PRO_RATA).
    input_set: "Physicians with partnership_status == SHAREHOLDER at adoption; their shares_held and created_at"
    constants: { SENIORITY_CARVE_PCT: 0.20, SENIORITY_TIER_YEARS: 5 }
    precision: "integer cents; floor per allocation, then residual pennies — NEVER round each allocation"
    variants:
      - { name: PRO_RATA, when: "motion payload method == PRO_RATA", difference: "pure share-weighted split" }
      - { name: SENIORITY_TIERED, when: "motion payload method == SENIORITY_TIERED", difference: "20% equal-split carve to senior shareholders before share-weighted remainder; same inputs produce different per-physician amounts" }

  - name: capital_call_assessment
    trigger: "POST /governance/capital-calls/{id}/bill"
    algorithm: waterfall_allocation
    formula: |
      billed_set = physicians with partnership_status == SHAREHOLDER at billing (any standing; EXITING/EXITED excluded)
      raw_i = total_amount_cents * shares_i / sum(shares over billed_set)
      assessed_i = floor(raw_i); residual pennies one each by shares_held DESC, tie-break Physician.created_at ASC.
      shares_at_billing snapshot pinned on each assessment.
    input_set: "Shareholders at billing time"
    constants: {}
    precision: "integer cents; floor + residual pennies, same convention as distribution_allocation"
    variants: []

  - name: late_fee
    trigger: "clock sweep transition BILLED/PARTIAL -> DELINQUENT"
    algorithm: threshold
    formula: "late_fee_cents = round_half_up(assessed_cents * late_fee_pct); applied exactly once (re-sweep does not compound)"
    input_set: "The assessment being swept"
    constants: { LATE_FEE_PCT: 0.10 }
    precision: "integer cents, round_half_up"
    variants: []

  - name: vote_threshold
    trigger: "POST /governance/motions/{id}/close; required_votes recomputed whenever eligible_voter_count changes (recusal cascade)"
    algorithm: threshold
    formula: |
      eligible_voter_count = len(eligible_voter_ids snapshot at open) - len(recused_physician_ids)
      SUPERMAJORITY: required_votes = ceil(supermajority_num / supermajority_den * eligible_voter_count);
        ADOPTED iff votes_for >= required_votes (equality adopts).
      SIMPLE_MAJORITY: ADOPTED iff votes_for > votes_against (strict; a tie REJECTS; ABSTAIN ballots
        count toward quorum but not toward either side).
      quorum gate: non-voided ballots cast (any choice) >= board_quorum_count, else ERR_QUORUM_NOT_MET.
    input_set: "Non-VOIDED votes on the motion; snapshot eligible voter ids; recused ids; GovernancePolicy thresholds"
    constants: { SUPERMAJORITY_NUM: 2, SUPERMAJORITY_DEN: 3, QUORUM_COUNT: 5 }
    precision: "integer ballot counts; ceil for supermajority"
    variants: []

  - name: buy_out_valuation
    trigger: "provisional: POST /governance/exit-valuations (initiation). final: POST .../appraise"
    algorithm: weighted_scoring
    formula: |
      provisional_value_cents = physician.capital_account_balance_cents
        + round_half_up(ownership_pct_snapshot * trailing_ebitda_cents * ebitda_multiple)
      final_value_cents (VOLUNTARY | RETIREMENT):
        round_half_up(appraised_practice_value_cents * ownership_pct_snapshot * (1 - minority_discount_pct))
      final_value_cents (TERMINATION | DEATH): minority discount waived ->
        round_half_up(appraised_practice_value_cents * ownership_pct_snapshot)
      ownership_pct_snapshot = shares_held / total shares outstanding, captured at initiation as an
      exact fraction (displayed at 6dp); later share changes do NOT re-open the snapshot.
      payment_schedule at finalize: [40%, 30%, 30%] of final_value_cents at +0/+12/+24 months;
      first two entries round_half_up, last entry = final - first - second (absorbs residue).
    input_set: "Exiting physician (capital account, shares), GovernancePolicy (ebitda_multiple, trailing_ebitda_cents, minority_discount_pct), appraiser input"
    constants: { EBITDA_MULTIPLE: 6, MINORITY_DISCOUNT_PCT: 0.15 }
    precision: "integer cents, round_half_up"
    variants:
      - { name: provisional, when: "at INITIATED, before any appraisal", difference: "book-style estimate: capital account + EBITDA-multiple share of practice value; no appraiser input" }
      - { name: final, when: "at APPRAISED", difference: "appraised practice value * ownership * (1 - minority discount if VOLUNTARY/RETIREMENT); the two variants produce different cents for identical physician state" }

  - name: ownership_recalc
    trigger: "any mutation of shares_held (founding creation, buy-in completion, exit finalize)"
    algorithm: aggregation
    formula: |
      total_shares_outstanding = sum(shares_held) over physicians with partnership_status != EXITED
      ownership_pct = round_half_up(shares_held / total_shares_outstanding, 6 decimal places) (0 when outstanding == 0)
      GovernancePolicy.treasury_shares = total_shares_authorized - sum(shares_held over ALL physicians incl. EXITED, whose shares_held is 0)
    input_set: "All non-EXITED physicians"
    constants: {}
    precision: "6 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles; X-User-ID required for entity-backed role Physician", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request body shape: required fields present, enum values valid, amounts positive integers, FK sub-fields required by motion_type present in payload", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role is permitted on this endpoint per the RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Ownership: a Physician caller may only act on own resources (own offers, own votes, own disclosures, own valuation, own assessments)", error_id: ERR_RESOURCE_OWNERSHIP, http_status: 403, applies_to: "Physician-role endpoints with an owned resource" }
  - { priority: 5, category: existence, check: "Path ids exist (validated left-to-right); body FK references exist (payload.exit_valuation_id, payload.merger_proposal_id, supersedes_motion_id, committee_id, related_motion_id, physician_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource in a valid state: motion OPEN for votes/table, payable assessment status, offer OFFERED/ACCEPTED as appropriate, valuation APPRAISED for finalize (ERR_VALUATION_NOT_APPRAISED), adopted BUYOUT_APPROVAL link (ERR_BUYOUT_NOT_APPROVED), adopted/rejected MERGER link (ERR_MERGER_NOT_APPROVED), committee not DISSOLVED for member ops, sponsor SHAREHOLDER+GOOD_STANDING, seat holder SHAREHOLDER and not SUSPENDED, EXITED physicians immutable, generic fallback", error_id: "ERR_INVALID_STATE | ERR_MOTION_NOT_OPEN | ERR_MOTION_TERMINAL | ERR_OFFER_NOT_OPEN | ERR_ASSESSMENT_NOT_PAYABLE | ERR_COMMITTEE_IMPAIRED (open of CHARTER_AMENDMENT) | ERR_VALUATION_NOT_APPRAISED | ERR_BUYOUT_NOT_APPROVED | ERR_MERGER_NOT_APPROVED | ERR_VOTER_INELIGIBLE | ERR_QUORUM_NOT_MET", http_status: 409, applies_to: "state-transition and state-gated endpoints" }
  - { priority: 7, category: business_safety, check: "Compliance gates on voting: voter not recused by a FLAGGED COI disclosure on this motion (ERR_VOTER_RECUSED); no unreviewed FILED disclosure by the voter related to this motion (ERR_COI_REVIEW_PENDING); segregation of duties — sponsor may not vote on own COMP_POLICY motion, and the COMPENSATION committee CHAIR may not sponsor a COMP_POLICY motion (ERR_SEGREGATION_OF_DUTIES)", error_id: "ERR_VOTER_RECUSED | ERR_COI_REVIEW_PENDING | ERR_SEGREGATION_OF_DUTIES", http_status: 409, applies_to: "POST votes; POST motions (COMP_POLICY)" }
  - { priority: 8, category: business_temporal, check: "Time gates: ballot cast only while clock < closes_at (ERR_VOTING_CLOSED); term_end > term_start (ERR_TERM_WINDOW_INVALID); CAPITAL_CALL due_date strictly after clock at motion creation (ERR_INVALID_REQUEST per priority 2)", error_id: "ERR_VOTING_CLOSED | ERR_TERM_WINDOW_INVALID", http_status: 409, applies_to: "votes, seat appoint" }
  - { priority: 9, category: business_constraint, check: "Uniqueness/overlap/cardinality: one vote per physician per motion (ERR_DUPLICATE_VOTE); seat successor window must not overlap current term, adjacency allowed (ERR_SEAT_TERM_OVERLAP); one booked successor per seat (ERR_SUCCESSOR_ALREADY_BOOKED); at most one OPEN-window offer per physician (ERR_OFFER_WINDOW_OVERLAP); committee size cap (ERR_COMMITTEE_FULL); one CHAIR per committee (ERR_CHAIR_ALREADY_ASSIGNED); no duplicate membership (ERR_DUPLICATE_MEMBERSHIP); dispute rounds cap (ERR_DISPUTE_LIMIT_REACHED); one non-terminal merger proposal (ERR_MERGER_ALREADY_ACTIVE); one GovernancePolicy singleton (ERR_POLICY_ALREADY_EXISTS); EXITING physicians blocked from new offers and sponsorship (ERR_PHYSICIAN_EXITING); DISTRIBUTION requires >= 1 eligible shareholder (ERR_NO_ELIGIBLE_RECIPIENTS); one non-terminal exit valuation per physician (ERR_EXIT_ALREADY_IN_PROGRESS)", error_id: "ERR_DUPLICATE_VOTE | ERR_SEAT_TERM_OVERLAP | ERR_SUCCESSOR_ALREADY_BOOKED | ERR_OFFER_WINDOW_OVERLAP | ERR_COMMITTEE_FULL | ERR_CHAIR_ALREADY_ASSIGNED | ERR_DUPLICATE_MEMBERSHIP | ERR_DISPUTE_LIMIT_REACHED | ERR_MERGER_ALREADY_ACTIVE | ERR_POLICY_ALREADY_EXISTS | ERR_PHYSICIAN_EXITING | ERR_NO_ELIGIBLE_RECIPIENTS | ERR_EXIT_ALREADY_IN_PROGRESS", http_status: 409, applies_to: "various" }
  - { priority: 10, category: business_fiscal, check: "Money guards last: payment amount <= remaining due (ERR_OVERPAYMENT); distribution amount <= distributable_cap_cents (ERR_DISTRIBUTION_CAP_EXCEEDED); share issuance within treasury (ERR_INSUFFICIENT_TREASURY_SHARES); installment payment must equal the scheduled installment exactly (ERR_INSTALLMENT_AMOUNT_MISMATCH)", error_id: "ERR_OVERPAYMENT | ERR_DISTRIBUTION_CAP_EXCEEDED | ERR_INSUFFICIENT_TREASURY_SHARES | ERR_INSTALLMENT_AMOUNT_MISMATCH", http_status: 409, applies_to: "payment, distribution motion, share issuance, installment endpoints" }

