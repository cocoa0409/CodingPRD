            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TEMP_HOUSING, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-31T00:00:00Z", amount_cents: 5000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { sb_ok: $.data.id, ok_nights: $.data.nights, ok_total: $.data.total_cents }
            - call: "POST /service-bookings"
              payload: { case_id: "${case_id}", kind: TEMP_HOUSING, start_date: "2026-12-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", amount_cents: 5000 }
