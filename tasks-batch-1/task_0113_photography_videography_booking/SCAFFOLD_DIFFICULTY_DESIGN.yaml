  # ===================================================================
  # Rule 5 — Validation priority conflicts across different category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_contract_not_signed
        # category pair: state (p6) vs business_constraint/contract (p9)
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.Booking.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          A booking already CONFIRMED whose contract is then re-examined: re-confirming fails the
          state precondition (p6, ERR_INVALID_STATE, 409) which outranks the contract-signed check
          (p9, ERR_CONTRACT_NOT_SIGNED) — the 409 wins. Category pair: state vs business_constraint.
        test_recipe:
          setup:
            - "PORTRAIT BASIC booking CONFIRMED (contract signed)."
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "c9@x.com", full_name: "C Nine", phone: "900" }
              as: StudioAdmin
              captures: { c9: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "p9@x.com", full_name: "P Nine", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { p9: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "Portrait Basic 9", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, requires_model_release: false, active: true }
              as: StudioAdmin
              captures: { pkg9: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${c9}", package_id: "${pkg9}", lead_photographer_id: "${p9}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${c9}"
              captures: { bk9: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk9}" }
              as: StudioAdmin
              captures: { ct9: $.data.id }
            - call: "POST /studio/contracts/${ct9}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct9}/sign"
              payload: {}
              as: Client
              as_user_id: "${c9}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk9}", start_utc: "2026-07-11T10:00:00Z", end_utc: "2026-07-11T12:00:00Z" }
              as: StudioAdmin
              captures: { sch9: $.data.id }
            - call: "POST /studio/bookings/${bk9}/confirm"
              payload: {}
              as: Client
              as_user_id: "${c9}"
          trigger:
