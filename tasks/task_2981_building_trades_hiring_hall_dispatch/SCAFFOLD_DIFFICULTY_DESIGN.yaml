            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${mid_id}", job_site: "Mill Street Riser", journeyworkers_requested: 2, apprentices_requested: 0, expected_duration_days: 30, report_at: "2026-09-28T07:00:00.000Z", hourly_rate_cents: 5100 }
              as: ContractorRep
              as_user_id: "${mid_id}"
              captures: { terminated_error: $.data.error_id }
            - call: "GET /hiring-hall/job-requests/${jr_id}"
              payload: {}
              as: Dispatcher
              captures: { jr_status_after: $.data.status, jr_from: $.data.suspended_from_status }
          assert:
            - "${mid_status0} == DELINQUENT_TRUST_FUNDS and the first intake returns 409 with ${delinquent_error} == ERR_CONTRACTOR_NOT_SIGNATORY"
            - "${mid_status1} == SIGNATORY and the identical payload now returns 201 with ${jr_status} == OPEN and ${jr_open} == 2"
            - "${mid_status2} == TERMINATED and the third intake returns 409 with ${terminated_error} == ERR_CONTRACTOR_NOT_SIGNATORY — both non-signatory states block intake"
            - "${jr_status_after} == SUSPENDED and ${jr_from} == OPEN — the already-open request is suspended by the same contractor transition, so the dependency runs both at intake time and afterwards"
      - name: referral_issue_depends_on_member_standing_state
