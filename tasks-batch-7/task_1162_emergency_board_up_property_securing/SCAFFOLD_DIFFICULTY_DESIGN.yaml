              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { ja: $.data.id }
            - call: "POST /jobs/${ja}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { asa: $.data.id }
            - call: "POST /assignments/${asa}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs/${ja}/check-in"
              payload: {}
              as: Subcontractor
              as_user_id: "${sc}"
            - call: "POST /jobs/${ja}/safety-assessments"
