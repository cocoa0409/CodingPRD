  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_quote_create_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-create-stale-repair-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on RepairOrder.version: a second quote creation carrying the pre-first-creation version is rejected 412 ERR_STALE_VERSION; refetching the version and retrying succeeds and supersedes the first quote."
        test_recipe:
          setup: ["RO in QUOTE_IN_PROGRESS; client holds version snapshot ro_v"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Lamesa", account_number: "LA-450", credit_limit_cents: 99999999, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
