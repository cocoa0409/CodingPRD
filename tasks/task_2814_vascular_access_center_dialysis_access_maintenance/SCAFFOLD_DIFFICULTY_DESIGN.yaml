# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2814 — Vascular Access Center & Dialysis Access Maintenance
# 24 instances across the nine §0.5 Difficulty Rules (minimum 2 each).
# Every literal below was computed by executing the referenced §1.3 formula.
# ---------------------------------------------------------------------------
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: triage_trend_based_vs_absolute_based_on_identical_latest_reading
        grounds:
          - calculations.referral_triage_score
          - entities.Referral.fields.triage_variant
          - entities.Referral.fields.triage_score
          - entities.Referral.fields.urgency
          - state_machines.Referral.SUBMITTED_to_TRIAGED
        distinguishing_aspect: |
          This dual variant lives in the Referral clinical-priority domain: two referrals whose
          latest surveillance reading carries byte-identical values (flow 700, VP 160, recirc 12.0)
          and identical missed_treatment_count 1 score 79/SAME_DAY under TREND_BASED and 51/NEXT_DAY
          under ABSOLUTE_BASED, because the variant is selected by how many readings exist in the
          21-day window, not by any caller input.
        test_recipe:
          setup:
            - "one facility, one patient, two IN_USE AVG accesses on that patient"
            - "access A carries two readings inside the 21-day window (2026-07-20 flow 1000 / 2026-07-28 flow 700); access B carries only the 2026-07-28 flow 700 reading"
            - "one SUBMITTED referral per access, each with missed_treatment_count 1"
            - "logical clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Riverbend Dialysis", facility_code: "RVB-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Ada Vance", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_a_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_a_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_a_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_a_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "RIGHT", site: "UPPER_ARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_b_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_b_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_b_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_b_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_a_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 1000, venous_pressure_mmhg: 120, recirculation_pct: 4.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_a_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 160, recirculation_pct: 12.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_b_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 160, recirculation_pct: 12.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_a_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "declining flow with rising venous pressure", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_a_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_b_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "single urgent bedside check only", missed_treatment_count: 1 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_b_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a_id}/triage"
              payload: {}
              as: AccessCoordinator
            - call: "POST /referrals/${ref_b_id}/triage"
              payload: {}
              as: AccessCoordinator
          assert:
            - "Referral.${ref_a_id}.triage_variant == TREND_BASED"
            - "Referral.${ref_a_id}.triage_score == 79"
            - "Referral.${ref_a_id}.urgency == SAME_DAY"
            - "Referral.${ref_b_id}.triage_variant == ABSOLUTE_BASED"
            - "Referral.${ref_b_id}.triage_score == 51"
            - "Referral.${ref_b_id}.urgency == NEXT_DAY"
            - "the 28-point gap is attributable only to variant selection: both referrals score against a latest reading of flow 700 / VP 160 / recirc 12.0 with missed_treatment_count 1"
            - "VascularAccess.${acc_a_id}.status == DYSFUNCTIONAL"
            - "VascularAccess.${acc_b_id}.status == DYSFUNCTIONAL"
            - "DialysisFacility.${fac_id}.partnership_score == 92"
            - "DialysisFacility.${fac_id}.contract_status == ACTIVE"

      - name: reimbursement_bundled_esrd_vs_fee_for_service_divergence
        grounds:
          - calculations.procedure_allowed_amount
          - entities.Procedure.fields.reimbursement_variant
          - entities.Procedure.fields.allowed_amount_cents
          - entities.ProcedureCode.fields.is_bundled
          - entities.ProcedureCode.fields.allowed_cents
        distinguishing_aspect: |
          This dual variant lives in the Procedure money domain, a different entity domain from the
          Referral triage variant: the identical three code lines (180050 ANGIOPLASTY rank 1,
          45075 ANGIOPLASTY rank 2, 90050 IMAGING rank 3, all modifier NONE) total 225101 cents
          under fee_for_service and 180050 cents under bundled_esrd, and the variant is selected by
          Patient.payer_program rather than by reading count.
        test_recipe:
          setup:
            - "one facility, one FEE_FOR_SERVICE patient, one IN_USE AVG access with one 2026-07-28 reading"
            - "one interventionalist, one credentialed sedation RN, one coder, one ANGIO_SUITE room, one BALLOON lot of 10 units"
            - "one procedure DISCHARGED on 2026-08-01 carrying three ProcedureCode lines"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Riverbend Dialysis", facility_code: "RVB-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Ada Vance", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Ines Rao", clinician_role: "INTERVENTIONALIST", npi: "1000000001", credential_expires_on: "2027-01-31" }
