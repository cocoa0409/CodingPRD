  # ===========================================================================
  # Rule 6 - Boundary-precision checks on different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reprint_tolerance_band_at_and_below_the_threshold
        grounds:
          - calculations.reprint_obligation_and_deadline
          - calculations.reprint_obligation_and_deadline.constants.TOLERANCE_FLOOR_CALORIES
          - calculations.reprint_obligation_and_deadline.constants.TOLERANCE_FRACTION
          - state_machines.MenuItem.transitions.DECLARED_to_RELABEL_REQUIRED
          - endpoints[POST /nutrition-analyses/{id}/decision]
          - endpoints[POST /menu-boards/{id}/reprint]
        distinguishing_aspect: "Numeric threshold crossing on the calorie-delta metric reached through POST /nutrition-analyses/{id}/decision: with prior_max 100 the tolerance is max(20, round_half_up(20.0)) == 20 and a delta of exactly 20 (100 -> 120) DOES require a reprint (>= at the band), while with prior_max 120 the tolerance is max(20, round_half_up(24.0)) == 24 and a delta of 10 (120 -> 110) does not."
        test_recipe:
          setup:
            - "Jurisdiction CA-VAR (extra_requirement NONE -> reprint_grace_days 30) and a COVERED Brand with 20 OPERATING units."
            - "One STANDARD MenuItem 'Side Salad' whose Recipe v1 is a single BASE component of 50 g at 200 Cal/100 g and 300 mg sodium/100 g, declaring 100 Cal and 150 mg."
            - "A PUBLISHED DisclosurePacket and one PUBLISHED PRIMARY_MENU_BOARD listing the salad; board CURRENT, brand posture COMPLIANT."
            - "Recipe v2 (60 g of the same component, declaring 120 Cal) sits in ANALYSIS_PENDING with its NutritionAnalysis SUBMITTED by analyst-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA-VAR", name: "California", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "NONE", enforcement_tier: "FEDERAL_ALIGNED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "CA-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 19, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "CA-B" }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Side Salad", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial 50 g portion" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Dressed greens", role: "BASE", grams: 50, calories_per_100g: 200, sodium_mg_per_100g: 300, added_sugar_g_per_100g: 2, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r1}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a1: $.data.id }
            - call: "POST /nutrition-analyses/${a1}/decision"
              payload: { decision: "CERTIFY", decision_note: "50 g portion certified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brands/${brand}"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { brand_v: $.data.version }
            - call: "POST /brands/${brand}/disclosure-packets"
              payload: { expected_brand_version: "${brand_v}", cross_contact_statement: "", written_info_channels: ["IN_STORE_BINDER"] }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { packet: $.data.id }
            - call: "POST /disclosure-packets/${packet}/publish"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-boards"
              payload: { establishment_id: "${est}", board_type: "PRIMARY_MENU_BOARD", succinct_statement_variant: "FEDERAL_DEFAULT" }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { board: $.data.id }
            - call: "POST /menu-boards/${board}/listings"
              payload: { menu_item_id: "${item}", sodium_warning_icon: false }
              as: MenuboardPublisher
              as_user_id: "${est}"
              captures: { listing: $.data.id }
            - call: "POST /menu-boards/${board}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { item_v2: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v2}", change_note: "Portion raised to 60 g" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /recipes/${r2}/components"
              payload: { component_name: "Dressed greens", role: "BASE", grams: 60, calories_per_100g: 200, sodium_mg_per_100g: 300, added_sugar_g_per_100g: 2, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r2}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /nutrition-analyses/${a2}/decision"
              payload: { decision: "CERTIFY", decision_note: "60 g portion certified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
            - call: "POST /menu-boards/${board}/reprint"
              payload: { reprint_note: "Reprinted at 120 Cal" }
              as: MenuboardPublisher
              as_user_id: "${est}"
            - call: "GET /menu-items/${item}"
              payload: {}
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { item_v3: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v3}", change_note: "Portion trimmed to 55 g" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r3: $.data.id }
            - call: "POST /recipes/${r3}/components"
              payload: { component_name: "Dressed greens", role: "BASE", grams: 55, calories_per_100g: 200, sodium_mg_per_100g: 300, added_sugar_g_per_100g: 2, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /recipes/${r3}/submit-for-analysis"
              payload: { method: "DATABASE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { a3: $.data.id }
            - call: "POST /nutrition-analyses/${a3}/decision"
              payload: { decision: "CERTIFY", decision_note: "55 g portion certified" }
              as: NutritionAnalyst
              as_user_id: "analyst-2"
          assert:
            - "Recipe.${r1}.computed_declared_max == 100 and Recipe.${r1}.computed_sodium_mg == 150"
            - "Recipe.${r2}.computed_base_calories == 120.00 and Recipe.${r2}.computed_declared_max == 120 and Recipe.${r2}.computed_sodium_mg == 180"
            - "after trigger[0]: MenuItem.${item}.labeling_status == RELABEL_REQUIRED - delta 20 == tolerance 20"
            - "after trigger[0]: MenuBoard.${board}.calorie_compliance_status == REPRINT_REQUIRED and MenuBoard.${board}.stale_listing_count == 1"
            - "after trigger[0]: Brand.${brand}.open_reprint_obligation_count == 1 and Brand.${brand}.compliance_posture == RESTRICTED"
            - "after trigger[1]: MenuBoard.${board}.calorie_compliance_status == CURRENT and MenuBoard.${board}.reprint_count == 1 and MenuBoardListing.${listing}.declared_max_snapshot == 120"
            - "Recipe.${r3}.computed_base_calories == 110.00 and Recipe.${r3}.computed_declared_max == 110 and Recipe.${r3}.computed_sodium_mg == 170"
            - "after trigger[6]: MenuItem.${item}.labeling_status == DECLARED - delta 10 < tolerance 24"
            - "after trigger[6]: MenuBoard.${board}.calorie_compliance_status == CURRENT and MenuBoard.${board}.stale_listing_count == 0 and MenuBoard.${board}.reprint_count == 1"
            - "after trigger[6]: MenuItem.${item}.declared_calorie_max == 110 and MenuBoardListing.${listing}.listing_status == LISTED"
            - "after trigger[6]: Brand.${brand}.open_reprint_obligation_count == 0 and Brand.${brand}.compliance_posture == COMPLIANT"
            - "Recipe.${r2}.status == SUPERSEDED and Recipe.${r3}.status == APPROVED and MenuItem.${item}.approved_recipe_version_no == 3"

      - name: zero_non_exempt_item_edge_outranks_unit_threshold
        grounds:
          - calculations.covered_establishment_determination
          - calculations.covered_establishment_determination.constants.COVERED_UNIT_THRESHOLD
          - entities.Brand.standard_item_count
          - entities.Brand.coverage_reason
          - entities.MenuItem.labeling_exempt
          - endpoints[POST /brands/{id}/coverage-determinations]
          - endpoints[GET /brands/{id}/compliance-summary]
        distinguishing_aspect: "Empty-collection / zero-count edge on the standard-item metric, reached through POST /brands/{id}/coverage-determinations (a different endpoint and a different metric from the calorie-delta band): with counted_unit_count exactly at COVERED_UNIT_THRESHOLD == 20 but an empty set of non-exempt items, the zero-item branch outranks the satisfied unit branch and reports NO_STANDARD_MENU_ITEMS, and adding one STANDARD item flips the same brand to COVERED_BY_UNIT_COUNT without any unit changing."
        test_recipe:
          setup:
            - "Jurisdiction TX-STD and a Brand with exactly 20 OPERATING units, all with operates_under_brand_name == true."
            - "The brand's only MenuItem is a DAILY_SPECIAL, which is always labeling_exempt, so the non-exempt set is empty and standard_item_count == 0."
            - "Brand.coverage_status is NOT_COVERED with coverage_reason NO_STANDARD_MENU_ITEMS and compliance_posture EXEMPT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-STD", name: "Texas", preemption_mode: "PREEMPTED", extra_requirement: "NONE", enforcement_tier: "FEDERAL_ALIGNED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 20, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "TX-B" }
              as: PlatformAdmin
              captures: { first_est: $.data.first_created_establishment_id, batch_count: $.data.created_count }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Soup of the Day", item_class: "DAILY_SPECIAL", variable_type: "NONE", first_offered_on: "2026-07-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { special: $.data.id }
          trigger:
            - call: "POST /brands/${brand}/coverage-determinations"
              payload: { basis: "OPERATING_ONLY" }
              as: PlatformAdmin
              captures: { zero_reason: $.data.coverage_reason }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-08-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { standard_item: $.data.id }
            - call: "GET /brands/${brand}/compliance-summary"
              payload: {}
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { summary_reason: $.data.coverage_reason }
          assert:
            - "MenuItem.${special}.labeling_exempt == true and MenuItem.${special}.labeling_status == NOT_REQUIRED"
            - "trigger[0] response data.counted_unit_count == 20"
            - "trigger[0] response data.standard_item_count == 0"
            - "trigger[0] response data.coverage_status == NOT_COVERED"
            - "trigger[0] response data.coverage_reason == NO_STANDARD_MENU_ITEMS"
            - "trigger[0] response data.coverage_reason != BELOW_UNIT_THRESHOLD although the unit branch was satisfied at exactly 20"
            - "Brand.${brand}.compliance_posture == EXEMPT after trigger[0]"
            - "MenuItem.${standard_item}.labeling_exempt == false"
            - "trigger[2] response data.counted_unit_count == 20 and data.standard_item_count == 1"
            - "trigger[2] response data.coverage_status == COVERED and data.coverage_reason == COVERED_BY_UNIT_COUNT"
            - "trigger[2] response data.compliance_posture == COMPLIANT"
            - "trigger[2] response data.has_published_disclosure_packet == false"

  # ===========================================================================
  # Rule 7 - Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: board_publication_gated_on_disclosure_packet_status
        grounds:
          - validations[priority=25]
          - errors[ERR_NO_PUBLISHED_PACKET]
          - state_machines.DisclosurePacket.transitions.DRAFT_to_PUBLISHED
          - state_machines.MenuBoard.publication_status.transitions.DRAFT_to_PUBLISHED
          - entities.Brand.has_published_disclosure_packet
          - endpoints[POST /disclosure-packets/{id}/publish]
        distinguishing_aspect: "Entity pair MenuBoard -> DisclosurePacket: a DRAFT board of a COVERED brand cannot reach PUBLISHED while the brand's only DisclosurePacket is still DRAFT (ERR_NO_PUBLISHED_PACKET), and the identical publish call succeeds once that packet - a row on a different aggregate - reaches PUBLISHED."
        test_recipe:
          setup:
            - "Jurisdiction CA-VAR and a COVERED Brand with 20 OPERATING units."
            - "One STANDARD MenuItem certified at 530 Cal, so the brand's allergen matrix is complete."
            - "A DisclosurePacket exists in status DRAFT and has never been published; Brand.has_published_disclosure_packet == false."
            - "A DRAFT PRIMARY_MENU_BOARD with FEDERAL_DEFAULT wording lists the certified item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "CA-VAR", name: "California", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "NONE", enforcement_tier: "FEDERAL_ALIGNED" }
              as: PlatformAdmin
