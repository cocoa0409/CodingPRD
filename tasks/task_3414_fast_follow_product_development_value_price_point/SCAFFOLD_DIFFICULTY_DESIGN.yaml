# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3414_fast_follow_product_development_value_price_point
# 20 instances across the nine §0.5 rules (>= 2 per rule).
# Anchors &k_* define the shared happy-path chain in the FIRST instance;
# later instances alias them (*k_*). All clock positions are pinned.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_settled_diverge
        grounds:
          - calculations.landed_unit_cost
          - entities.CostQuote.fields.landed_provisional_cents
          - entities.CostQuote.fields.landed_settled_cents
          - state_machines.CostQuote.ACCEPTED_to_SETTLED
        distinguishing_aspect: "Cost accounting on CostQuote: the provisional variant (tooling amortized over initial_order_qty, quoted freight) and the settled variant (amortized over actual_qty, actual freight) produce 234 vs 233 cents for the same quote — a per-unit divergence, not a recompute of the same number."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Full happy path: trend (score 70.0) SELECTED, concept at price point 1000 (target cost 260), product through FORMULATION -> SOURCING -> COMPLIANCE_GATE -> LAUNCH_READY with ACCEPTED quote Q (landed provisional 234), compliant dossier, partner ValueMart, line review DECIDED, slot COMMITTED (facings 10), plan locked DEMAND 800 units and APPROVED, clock advanced to 2026-11-01 and plan EXECUTED (product LAUNCHED, slot ACTIVE)."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_trend
              call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 4000, engagement_growth_pct: 1.0, prestige_similarity: 0.75 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { trend_id: $.data.id }
            - &k_trend_eval
              call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &k_trend_select
              call: "PATCH /trend-signals/${trend_id}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &k_concept
              call: "POST /concepts"
              payload: { trend_signal_id: "${trend_id}", name: "Lash Flash Mascara", category: "EYES", target_price_point_cents: 1000 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { concept_id: $.data.id }
            - &k_concept_select
              call: "PATCH /concepts/${concept_id}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - &k_cm
              call: "POST /manufacturers"
              payload: { name: "FastLab Cosmetics", capabilities: ["EYES", "LIPS"], base_lead_time_weeks: 4, moq_units: 500, quality_tier: "STANDARD", capacity_slots_per_quarter: 4 }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { cm_id: $.data.id }
            - &k_product
              call: "POST /products"
              payload: { concept_id: "${concept_id}", sku_name: "LASH-FLASH-01", tooling_code: "MASCARA-8ML-V1" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { product_id: $.data.id, product_v0: $.data.version }
            - &k_fp
              call: "POST /formula-projects"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", brief: "Volumizing mascara, vegan wax blend" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { fp_id: $.data.id }
            - &k_fp_sample
              call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "SAMPLE_REVIEW" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
            - &k_fp_approve
              call: "PATCH /formula-projects/${fp_id}"
              payload: { status: "APPROVED" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - &k_prod_sourcing
              call: "PATCH /products/${product_id}"
              payload: { status: "SOURCING" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { product_v: $.data.version }
            - &k_quote
              call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 200, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { quote_id: $.data.id }
            - &k_quote_eval
              call: "PATCH /cost-quotes/${quote_id}"
              payload: { status: "UNDER_EVALUATION" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - &k_quote_accept
              call: "PATCH /cost-quotes/${quote_id}"
              payload: { status: "ACCEPTED" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - &k_prod_gate
              call: "PATCH /products/${product_id}"
              payload: { status: "COMPLIANCE_GATE" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - &k_dossier
              call: "POST /compliance-dossiers"
              payload: { product_id: "${product_id}" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
              captures: { dossier_id: $.data.id }
            - &k_rev_ing
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "INGREDIENT", outcome: "CLEARED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_claim
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "CLAIM", outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_cert1
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "CERTIFICATION", outcome: "APPLIED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_cert2
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "CERTIFICATION", outcome: "AUDITING" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_cert3
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "CERTIFICATION", outcome: "CERTIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_reg1
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "REGISTRATION", outcome: "FILED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_rev_reg2
              call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "REGISTRATION", outcome: "REGISTERED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
            - &k_pack
              call: "PATCH /products/${product_id}"
              payload: { packaging_status: "PACK_READY" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - &k_prod_ready
              call: "PATCH /products/${product_id}"
              payload: { status: "LAUNCH_READY" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - &k_partner
              call: "POST /retail-partners"
              payload: { name: "ValueMart", banner_code: "VM", category_capacities: { EYES: 10, LIPS: 8 } }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { partner_id: $.data.id }
            - &k_lr
              call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner_id}", season: "2026-HO", submission_window_start: "2026-10-01T00:00:00Z", submission_window_end: "2026-10-15T00:00:00Z", review_date: "2026-10-20T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr_id: $.data.id }
            - &k_clock2
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - &k_lr_open
              call: "PATCH /line-reviews/${lr_id}"
              payload: { status: "SUBMISSION_OPEN" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr_v: $.data.version }
            - &k_slot
              call: "POST /planogram-slots"
              payload: { line_review_id: "${lr_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A1", facings: 10, occupancy_start: "2026-11-01T00:00:00Z", occupancy_end: "2027-01-31T00:00:00Z", expected_line_review_version: "${lr_v}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { slot_id: $.data.id }
            - &k_plan
              call: "POST /launch-plans"
              payload: { product_id: "${product_id}", planogram_slot_id: "${slot_id}", demand_forecast_units: 800, marketing_budget_cents: 50000, cogs_budget_cents: 200000, sample_budget_cents: 20000 }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { plan_id: $.data.id }
            - &k_clock3
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - &k_lr_reviewing
              call: "PATCH /line-reviews/${lr_id}"
              payload: { status: "REVIEWING" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - &k_clock4
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T00:00:00Z" }
              as: PlatformAdmin
            - &k_lr_decided
              call: "PATCH /line-reviews/${lr_id}"
              payload: { status: "DECIDED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - &k_slot_commit
              call: "PATCH /planogram-slots/${slot_id}"
              payload: { status: "COMMITTED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - &k_plan_lock
              call: "PATCH /launch-plans/${plan_id}"
              payload: { status: "QUANTITY_LOCKED", variant: "DEMAND" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - &k_plan_approve
              call: "PATCH /launch-plans/${plan_id}"
              payload: { status: "APPROVED" }
              as: ProductManager
              as_user_id: "pm-nadia"
            - &k_clock5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_plan_execute
              call: "PATCH /launch-plans/${plan_id}"
              payload: { status: "EXECUTED" }
              as: ProductManager
              as_user_id: "pm-nadia"
          trigger:
            - call: "PATCH /cost-quotes/${quote_id}"
              payload: { status: "SETTLED", actual_qty: 2000, actual_freight_total_cents: 70000 }
              as: SourcingLead
              as_user_id: "sl-omar"
          assert:
            - "CostQuote.${quote_id}.landed_provisional_cents == 234  (200 + ceil(10000/1000)=10 + round(40000*50/500000)=4 + round(204*0.10)=20)"
            - "CostQuote.${quote_id}.landed_settled_cents == 233  (200 + ceil(10000/2000)=5 + round(70000*50/500000)=7 + round(207*0.10)=21)"
            - "CostQuote.${quote_id}.landed_settled_cents != CostQuote.${quote_id}.landed_provisional_cents"
            - "CostQuote.${quote_id}.status == SETTLED"
            - "CostQuote.${quote_id}.pinned_formula_version == 1"

      - name: launch_qty_demand_vs_risk_adjusted_diverge
        grounds:
          - calculations.launch_quantity
          - calculations.markdown_risk
          - entities.LaunchPlan.fields.qty_demand_variant_units
          - entities.LaunchPlan.fields.qty_risk_variant_units
        distinguishing_aspect: "Inventory planning on LaunchPlan (different entity domain from cost accounting): the DEMAND variant yields 800 units while the RISK_ADJUSTED variant yields 640 for the same plan, because the trend is 4 weeks old (risk 0.20) and capacity (960) does not bind."
        test_recipe:
          setup:
            - "Logical clock 2026-10-02T00:00:00Z at plan creation. Trend discovered 2026-09-01 (4 weeks -> markdown_risk_pct 0.20). Slot facings 10 -> capacity_units 960. demand_forecast_units 800."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - *k_partner
            - *k_lr
            - *k_clock2
            - *k_lr_open
            - *k_slot
          trigger:
            - call: "POST /launch-plans"
              payload: { product_id: "${product_id}", planogram_slot_id: "${slot_id}", demand_forecast_units: 800, marketing_budget_cents: 50000, cogs_budget_cents: 200000, sample_budget_cents: 20000 }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { plan2_id: $.data.id }
          assert:
            - "LaunchPlan.${plan2_id}.capacity_units == 960  (10 facings * 12 * 8)"
            - "LaunchPlan.${plan2_id}.markdown_risk_pct == 0.2  (floor(31 days / 7) * 0.05)"
            - "LaunchPlan.${plan2_id}.qty_demand_variant_units == 800  (min(800, 960))"
            - "LaunchPlan.${plan2_id}.qty_risk_variant_units == 640  (min(floor(800 * 0.8), 960))"
            - "LaunchPlan.${plan2_id}.qty_demand_variant_units != LaunchPlan.${plan2_id}.qty_risk_variant_units"
            - "LaunchPlan.${plan2_id}.status == DRAFT and sampling_status == NONE"

  - rule_id: combinatorial_formula
    instances:
      - name: landed_cost_nested_rounding_order_pinned
        grounds:
          - calculations.landed_unit_cost
          - entities.CostQuote.fields.landed_provisional_cents
        distinguishing_aspect: "Mode (b) nested rounding: freight_per_unit rounds 9.5 -> 10 FIRST and duty is computed from the ROUNDED freight (round((205+10)*0.10) = round(21.5) = 22), giving landed 247; the forbidden sum-then-round order would give duty round(214.5*0.10) = 21 and landed 246."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING with an APPROVED formula (no quote yet)."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
          trigger:
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 205, tooling_fee_cents: 10000, freight_total_cents: 95000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { quote_r_id: $.data.id }
          assert:
            - "CostQuote.${quote_r_id}.landed_provisional_cents == 247  (205 + ceil(10000/1000)=10 + round(95000*50/500000)=round(9.5)=10 + round((205+10)*0.10)=round(21.5)=22)"
            - "CostQuote.${quote_r_id}.landed_provisional_cents != 246  (246 is the sum-then-round order the scaffold forbids)"
            - "CostQuote.${quote_r_id}.status == SUBMITTED"

      - name: launch_qty_budget_clamp_single_pass
        grounds:
          - calculations.launch_quantity
          - entities.LaunchPlan.fields.qty_locked_units
          - entities.LaunchPlan.fields.landed_locked_cents
        distinguishing_aspect: "Mode (a) with the pinned mode-(c) single-pass order: demand 2000 is nested-clamped by capacity 960 (min), then the circular-looking budget dependency (landed cost depends on qty via tooling amortization) is resolved by exactly one reduction pass — floor(200000 / landed(500)=244) = 819, no fixed-point iteration."
        test_recipe:
          setup:
            - "Logical clock 2026-10-02T00:00:00Z at plan creation. ACCEPTED quote unit 200, tooling_fee 10000, freight/unit 4, duty/unit 20; CM MOQ 500; slot facings 10 (capacity 960); cogs_budget 200000."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - *k_partner
            - *k_lr
            - *k_clock2
            - *k_lr_open
            - *k_slot
            - call: "POST /launch-plans"
              payload: { product_id: "${product_id}", planogram_slot_id: "${slot_id}", demand_forecast_units: 2000, marketing_budget_cents: 50000, cogs_budget_cents: 200000 }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { plan_c_id: $.data.id }
          trigger:
            - call: "PATCH /launch-plans/${plan_c_id}"
              payload: { status: "QUANTITY_LOCKED", variant: "DEMAND" }
              as: ProductManager
              as_user_id: "pm-nadia"
          assert:
            - "LaunchPlan.${plan_c_id}.qty_demand_variant_units == 960  (min(2000, 960) — capacity binds before budget)"
            - "960 * landed(960)=235 == 225600 > cogs_budget 200000, triggering the single-pass clamp"
            - "LaunchPlan.${plan_c_id}.qty_locked_units == 819  (floor(200000 / landed(MOQ=500)=244); 819*244=199836 <= 200000 < 820*244=200080)"
            - "LaunchPlan.${plan_c_id}.landed_locked_cents == 237  (200 + ceil(10000/819)=13 + 4 + 20)"
            - "LaunchPlan.${plan_c_id}.qty_locked_units >= 500 (MOQ floor respected after clamp)"
            - "LaunchPlan.${plan_c_id}.status == QUANTITY_LOCKED and locked_variant == DEMAND"

  - rule_id: non_linear_state_machine
    instances:
      - name: product_reformulation_cycle_reverts_quote_and_formula
        grounds:
          - state_machines.Product.COMPLIANCE_GATE_to_FORMULATION
          - state_machines.CostQuote.ACCEPTED_to_INVALIDATED
          - state_machines.FormulaProject.APPROVED_to_IN_DEVELOPMENT
        distinguishing_aspect: "CYCLIC shape on Product: COMPLIANCE_GATE -> FORMULATION loops the product backward, and the loop itself mutates two other entities (quote INVALIDATED, formula reopened at round 2) — a cycle with cross-entity compensation, on a different entity than the dossier's parallel machine."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in COMPLIANCE_GATE with ACCEPTED quote (pinned formula_version 1) and APPROVED formula project (round_count 1)."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
          trigger:
            - call: "PATCH /products/${product_id}"
              payload: { status: "FORMULATION" }
              as: ProductManager
              as_user_id: "pm-nadia"
          assert:
            - "Product.${product_id}.status == FORMULATION  (the cycle COMPLIANCE_GATE -> FORMULATION is legal)"
            - "CostQuote.${quote_id}.status == INVALIDATED  (caused by the product's reversion)"
            - "FormulaProject.${fp_id}.status == IN_DEVELOPMENT and round_count == 2  (reopened by the same reversion)"
            - "Concept.${concept_id}.status == IN_DEVELOPMENT  (unchanged — the loop does not kill the concept)"
            - "a subsequent PATCH /products/${product_id} status=SOURCING succeeds only after the formula is re-approved, proving the loop is re-enterable"

      - name: dossier_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.ComplianceDossier
          - entities.ComplianceDossier.fields.compliant
          - entities.ComplianceDossier.fields.cert_expires_at
        distinguishing_aspect: "PARALLEL state dimensions on ComplianceDossier: certification can reach CERTIFIED while ingredient/claim/registration are still pending — each dimension evolves independently, and the derived flag compliant flips true only when all four dimensions are green."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in COMPLIANCE_GATE; dossier freshly created (PENDING x PENDING x NOT_APPLIED x UNFILED)."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
          trigger:
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_rev_claim
            - call: "GET /compliance-dossiers/${dossier_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-lena"
              captures: { mid_compliant: $.data.compliant }
            - *k_rev_ing
            - call: "GET /compliance-dossiers/${dossier_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-lena"
          assert:
            - "after CERTIFIED + REGISTERED + SUBSTANTIATED with ingredient still PENDING: compliant == false (mid_compliant == false)"
            - "certification reached CERTIFIED without waiting for the other dimensions (parallelism)"
            - "ComplianceDossier.${dossier_id}.cert_expires_at == 2027-09-01T00:00:00Z  (2026-09-01 + 365 days)"
            - "after the final INGREDIENT CLEARED: ingredient_status == CLEARED, claim_status == SUBSTANTIATED, cert_status == CERTIFIED, registration_status == REGISTERED, compliant == true"

  - rule_id: transitive_cascade
    instances:
      - name: discontinuation_cascade_depth3
        grounds:
          - state_machines.DiscontinuationReview.PROPOSED_to_APPROVED
          - state_machines.Product.LAUNCHED_to_DISCONTINUED
          - state_machines.PlanogramSlot.ACTIVE_to_VACATED
          - calculations.shelf_capacity_reconciliation
        distinguishing_aspect: "Depth-3 chain triggered by the review approval: APPROVED mutates Product (LAUNCHED -> DISCONTINUED); the Product mutation vacates its ACTIVE PlanogramSlot; the slot vacancy recomputes the RetailPartner's committed/available facings (0 -> 10 available). Each link is caused by the previous link, not by the approval itself."
        test_recipe:
          setup:
            - "Product LAUNCHED (plan EXECUTED at 2026-11-01, slot ACTIVE with 10 of 10 EYES facings committed). Clock then advanced to 2027-01-05 (9 weeks after launch). Discontinuation review proposed by pm-nadia without a successor."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - *k_partner
            - *k_lr
            - *k_clock2
            - *k_lr_open
            - *k_slot
            - *k_plan
            - *k_clock3
            - *k_lr_reviewing
            - *k_clock4
            - *k_lr_decided
            - *k_slot_commit
            - *k_plan_lock
            - *k_plan_approve
            - *k_clock5
            - *k_plan_execute
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /discontinuation-reviews"
              payload: { product_id: "${product_id}", reason: "TREND_DECAY" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { dr_id: $.data.id }
          trigger:
            - call: "PATCH /discontinuation-reviews/${dr_id}"
              payload: { status: "APPROVED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
          assert:
            - "Product.${product_id}.status == DISCONTINUED  (cascade link 1)"
            - "PlanogramSlot.${slot_id}.status == VACATED  (cascade link 2, caused by the product's discontinuation)"
            - "RetailPartner.${partner_id}.committed_facings.EYES == 0 and available_facings.EYES == 10  (cascade link 3, caused by the vacancy)"
            - "LaunchPlan.${plan_id}.status == RECONCILED with markdown_units == 800  (fan-out from link 1: retail_units_available was 800)"
            - "LaunchPlan.${plan_id}.markdown_exposure_cents == 94800  (9 weeks since launch -> depth 0.50; 800 * 237 * 0.50)"
            - "Product.${product_id}.successor_product_id is null  (no successor was named)"

      - name: cert_denial_cascade_depth2
        grounds:
          - state_machines.ComplianceDossier.cert_status_AUDITING_to_DENIED
          - state_machines.Product.COMPLIANCE_GATE_to_FORMULATION
          - state_machines.CostQuote.ACCEPTED_to_INVALIDATED
          - state_machines.FormulaProject.APPROVED_to_IN_DEVELOPMENT
        distinguishing_aspect: "Depth-2 chain from a different trigger (a dossier review, not a discontinuation): cert DENIED mutates the dossier; that mutation reverts the Product to FORMULATION; the Product's reversion invalidates the ACCEPTED quote and reopens the APPROVED formula project."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in COMPLIANCE_GATE with ACCEPTED quote; dossier has ingredient CLEARED, claim SUBSTANTIATED, cert AUDITING (not yet decided), registration UNFILED."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
          trigger:
            - call: "POST /compliance-dossiers/${dossier_id}/reviews"
              payload: { dimension: "CERTIFICATION", outcome: "DENIED" }
              as: ComplianceOfficer
              as_user_id: "co-lena"
          assert:
            - "ComplianceDossier.${dossier_id}.cert_status == DENIED and compliant == false"
            - "Product.${product_id}.status == FORMULATION  (cascade link 1, caused by the denial)"
            - "CostQuote.${quote_id}.status == INVALIDATED  (cascade link 2, caused by the product reversion — it also releases the CM's 2026-Q4 capacity slot)"
            - "FormulaProject.${fp_id}.status == IN_DEVELOPMENT and round_count == 2  (cascade link 2, parallel branch)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_safety_error_on_launch_ready
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_COMPLIANCE_GATE_FAILED
        distinguishing_aspect: "Category pair state vs business_safety: a LAUNCH_READY transition attempted from SOURCING (wrong from-state) on a product whose dossier does not even exist (safety gate unsatisfied) must surface ERR_INVALID_STATE (priority 7), not ERR_COMPLIANCE_GATE_FAILED (priority 8)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING with ACCEPTED quote; NO compliance dossier exists; packaging still PACK_SOURCING."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
          trigger:
            - call: "PATCH /products/${product_id}"
              payload: { status: "LAUNCH_READY" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409 and err_state == ERR_INVALID_STATE"
            - "err_state != ERR_COMPLIANCE_GATE_FAILED  (the safety failure is masked by the higher-priority state failure)"
            - "Product.${product_id}.status is still SOURCING"

      - name: referential_error_beats_fiscal_error_on_plan_approve
        grounds:
          - validations[priority=13]
          - validations[priority=28]
          - errors.ERR_SLOT_NOT_COMMITTED
          - errors.ERR_BUDGET_EXCEEDED
        distinguishing_aspect: "Category pair business_referential vs business_fiscal (different pair than state-vs-safety): approving a plan whose slot is still PROPOSED AND whose sample_budget_cents (60000) exceeds marketing_budget_cents (50000) must surface ERR_SLOT_NOT_COMMITTED (priority 13), not ERR_BUDGET_EXCEEDED (priority 28)."
        test_recipe:
          setup:
            - "Logical clock 2026-10-02T00:00:00Z. Product LAUNCH_READY; line review SUBMISSION_OPEN; slot PROPOSED (never committed); plan created with sample_budget 60000 > marketing_budget 50000 and locked DEMAND at 800 units."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - *k_partner
            - *k_lr
            - *k_clock2
            - *k_lr_open
            - *k_slot
            - call: "POST /launch-plans"
              payload: { product_id: "${product_id}", planogram_slot_id: "${slot_id}", demand_forecast_units: 800, marketing_budget_cents: 50000, cogs_budget_cents: 200000, sample_budget_cents: 60000 }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { plan_f_id: $.data.id }
            - call: "PATCH /launch-plans/${plan_f_id}"
              payload: { status: "QUANTITY_LOCKED", variant: "DEMAND" }
              as: ProductManager
              as_user_id: "pm-nadia"
          trigger:
            - call: "PATCH /launch-plans/${plan_f_id}"
              payload: { status: "APPROVED" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_ref: $.data.error_id }
          assert:
            - "the response status is 422 and err_ref == ERR_SLOT_NOT_COMMITTED"
            - "err_ref != ERR_BUDGET_EXCEEDED  (the fiscal failure is masked by the higher-priority referential failure)"
            - "LaunchPlan.${plan_f_id}.status is still QUANTITY_LOCKED"
            - "PlanogramSlot.${slot_id}.status is still PROPOSED"

  - rule_id: boundary_precision_check
    instances:
      - name: landed_cost_exactly_at_target_accepts_one_cent_over_rejects
        grounds:
          - validations[priority=27]
          - calculations.landed_unit_cost
          - calculations.target_unit_cost
          - errors.ERR_COST_TARGET_EXCEEDED
        distinguishing_aspect: "Boundary on a money metric at PATCH /cost-quotes/{id}: the rule is landed <= target (inclusive). A quote computing exactly 260 == target accepts; a quote computing 261 rejects — one cent across the boundary flips the outcome."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Concept at price point 1000 -> target_unit_cost_cents 260. Product in SOURCING, formula APPROVED. A second CM (SecondSource Labs) exists."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - call: "POST /manufacturers"
              payload: { name: "SecondSource Labs", capabilities: ["EYES"], base_lead_time_weeks: 6, moq_units: 500, quality_tier: "STANDARD", capacity_slots_per_quarter: 4 }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { cm2_id: $.data.id }
          trigger:
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm2_id}", unit_cost_cents: 224, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v}" }
              as: ManufacturerRep
              as_user_id: "${cm2_id}"
              captures: { quote_hi_id: $.data.id }
            - call: "PATCH /cost-quotes/${quote_hi_id}"
              payload: { status: "UNDER_EVALUATION" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - call: "PATCH /cost-quotes/${quote_hi_id}"
              payload: { status: "ACCEPTED" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { err_over: $.data.error_id }
            - call: "GET /products/${product_id}"
              payload: {}
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { product_v2: $.data.version }
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm_id}", unit_cost_cents: 223, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v2}" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { quote_eq_id: $.data.id }
            - call: "PATCH /cost-quotes/${quote_eq_id}"
              payload: { status: "UNDER_EVALUATION" }
              as: SourcingLead
              as_user_id: "sl-omar"
            - call: "PATCH /cost-quotes/${quote_eq_id}"
              payload: { status: "ACCEPTED" }
              as: SourcingLead
              as_user_id: "sl-omar"
          assert:
            - "CostQuote.${quote_hi_id}.landed_provisional_cents == 261  (224 + 10 + 4 + round(228*0.10)=23) — one cent over target"
            - "accepting quote_hi returns 422 and err_over == ERR_COST_TARGET_EXCEEDED"
            - "CostQuote.${quote_eq_id}.landed_provisional_cents == 260  (223 + 10 + 4 + round(227*0.10)=23) — exactly at target"
            - "accepting quote_eq returns 200 and CostQuote.${quote_eq_id}.status == ACCEPTED  (<= is inclusive)"
            - "CostQuote.${quote_hi_id}.status == SUPERSEDED after the sibling acceptance"
            - "Product.${product_id}.status is still SOURCING"

      - name: facings_exactly_at_capacity_commits_one_over_rejects
        grounds:
          - validations[priority=26]
          - calculations.shelf_capacity_reconciliation
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: "Boundary on a count metric at PATCH /planogram-slots/{id} (different metric and endpoint than the cost boundary): committed 4 then +2 reaches exactly the EYES capacity 6 and commits; +1 more (7 > 6) rejects — equality is allowed, one over is not."
        test_recipe:
          setup:
            - "Logical clock 2026-10-02T00:00:00Z for submissions. Product LAUNCH_READY. Partner SixFace with category_capacities {EYES: 6}. One line review; three PROPOSED slots (facings 4, 2, 1 on distinct positions EYES-A1/A2/A3). Review advanced to DECIDED by 2026-10-21."
          setup_api_calls:
            - *k_clock
            - *k_trend
            - *k_trend_eval
            - *k_trend_select
            - *k_concept
            - *k_concept_select
            - *k_cm
            - *k_product
            - *k_fp
            - *k_fp_sample
            - *k_fp_approve
            - *k_prod_sourcing
            - *k_quote
            - *k_quote_eval
            - *k_quote_accept
            - *k_prod_gate
            - *k_dossier
            - *k_rev_ing
            - *k_rev_claim
            - *k_rev_cert1
            - *k_rev_cert2
            - *k_rev_cert3
            - *k_rev_reg1
            - *k_rev_reg2
            - *k_pack
            - *k_prod_ready
            - call: "POST /retail-partners"
              payload: { name: "SixFace", banner_code: "SF", category_capacities: { EYES: 6 } }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { partner6_id: $.data.id }
            - call: "POST /line-reviews"
              payload: { retail_partner_id: "${partner6_id}", season: "2026-HO", submission_window_start: "2026-10-01T00:00:00Z", submission_window_end: "2026-10-15T00:00:00Z", review_date: "2026-10-20T00:00:00Z" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr6_id: $.data.id }
            - *k_clock2
            - call: "PATCH /line-reviews/${lr6_id}"
              payload: { status: "SUBMISSION_OPEN" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr6_v: $.data.version }
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr6_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A1", facings: 4, occupancy_start: "2026-11-01T00:00:00Z", occupancy_end: "2027-01-31T00:00:00Z", expected_line_review_version: "${lr6_v}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { s1_id: $.data.id }
            - call: "GET /line-reviews/${lr6_id}"
              payload: {}
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr6_v2: $.data.version }
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr6_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A2", facings: 2, occupancy_start: "2026-11-01T00:00:00Z", occupancy_end: "2027-01-31T00:00:00Z", expected_line_review_version: "${lr6_v2}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { s2_id: $.data.id }
            - call: "GET /line-reviews/${lr6_id}"
              payload: {}
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { lr6_v3: $.data.version }
            - call: "POST /planogram-slots"
              payload: { line_review_id: "${lr6_id}", product_id: "${product_id}", category: "EYES", position_code: "EYES-A3", facings: 1, occupancy_start: "2026-11-01T00:00:00Z", occupancy_end: "2027-01-31T00:00:00Z", expected_line_review_version: "${lr6_v3}" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { s3_id: $.data.id }
            - *k_clock3
            - call: "PATCH /line-reviews/${lr6_id}"
              payload: { status: "REVIEWING" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - *k_clock4
            - call: "PATCH /line-reviews/${lr6_id}"
              payload: { status: "DECIDED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
          trigger:
            - call: "PATCH /planogram-slots/${s1_id}"
              payload: { status: "COMMITTED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - call: "PATCH /planogram-slots/${s2_id}"
              payload: { status: "COMMITTED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
            - call: "PATCH /planogram-slots/${s3_id}"
              payload: { status: "COMMITTED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { err_cap: $.data.error_id }
          assert:
            - "PlanogramSlot.${s1_id}.status == COMMITTED  (4 <= 6)"
            - "PlanogramSlot.${s2_id}.status == COMMITTED  (4 + 2 == 6 — equality commits)"
            - "committing s3 returns 422 and err_cap == ERR_CAPACITY_EXCEEDED  (6 + 1 > 6)"
            - "PlanogramSlot.${s3_id}.status is still PROPOSED"
            - "RetailPartner.${partner6_id}.committed_facings.EYES == 6 and available_facings.EYES == 0"

      - name: trend_score_exactly_at_threshold_selects
        grounds:
          - calculations.trend_momentum_score
          - state_machines.TrendSignal.EVALUATING_to_SELECTED
          - errors.ERR_TREND_SCORE_BELOW_THRESHOLD
        distinguishing_aspect: "Boundary on a score metric at PATCH /trend-signals/{id} (third distinct metric and endpoint): the threshold is >= 70.0 inclusive — a trend scoring exactly 70.0 selects, one scoring 69.7 rejects."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "EYES", mention_velocity_7d: 4000, engagement_growth_pct: 1.0, prestige_similarity: 0.75 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { t_eq: $.data.id }
            - call: "PATCH /trend-signals/${t_eq}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { score_eq: $.data.momentum_score }
            - call: "PATCH /trend-signals/${t_eq}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
            - call: "POST /trend-signals"
              payload: { source: "PRESTIGE_LAUNCH", platform: "runway", category: "LIPS", mention_velocity_7d: 4000, engagement_growth_pct: 0.98, prestige_similarity: 0.75 }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { t_lo: $.data.id }
            - call: "PATCH /trend-signals/${t_lo}"
              payload: { status: "EVALUATING" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { score_lo: $.data.momentum_score }
            - call: "PATCH /trend-signals/${t_lo}"
              payload: { status: "SELECTED" }
              as: TrendScout
              as_user_id: "ts-ivy"
              captures: { err_thr: $.data.error_id }
          assert:
            - "score_eq == 70.0  (0.5*80 + 0.3*50 + 0.2*75 = 40.0 + 15.0 + 15.0)"
            - "the first trend reaches SELECTED (70.0 >= 70.0 — threshold inclusive)"
            - "score_lo == 69.7  (40.0 + 0.3*min(0.98/2,1)*100=14.7 + 15.0)"
            - "the second trend's SELECTED attempt returns 422 and err_thr == ERR_TREND_SCORE_BELOW_THRESHOLD"
            - "TrendSignal.${t_lo}.status is still EVALUATING"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: quote_accept_requires_product_in_sourcing
        grounds:
          - state_machines.CostQuote.UNDER_EVALUATION_to_ACCEPTED
