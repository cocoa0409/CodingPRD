            - "${v0_state} == PLANNED with window 480..540"
            - "GAP 0 AFTER — ${gap0_after_error} == ERR_ROUTE_WINDOW_CONFLICT with HTTP 409: 540 < 540 + 20, so exact adjacency conflicts"
            - "GAP 15 AFTER — ${gap15_after_error} == ERR_ROUTE_WINDOW_CONFLICT: 555 < 560"
            - "GAP 15 BEFORE — ${gap15_before_error} == ERR_ROUTE_WINDOW_CONFLICT: 480 < 465 + 20, so the buffer applies on the earlier side too"
            - "GAP 20 BEFORE — ${gap20_before_state} == PLANNED: 480 < 460 + 20 is false, so a 20-minute gap is accepted"
            - "GAP 20 AFTER — ${gap20_after_state} == PLANNED: 560 < 540 + 20 is false"
            - "DIFFERENT DATE — ${other_date_state} == PLANNED for the very window that failed at gap 0 on 2026-08-10, proving the candidate set is scoped to route_id AND scheduled_date"
            - "GET /service-visits?route_id=${route_id}&scheduled_date=2026-08-10 returns total_count 3 — exactly V0, ${gap20_before_id} and ${gap20_after_id}; the three refused requests persisted nothing"
            - "GET /service-visits?route_id=${route_id} returns total_count 4 once ${other_date_id} is counted"

