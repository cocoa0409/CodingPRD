  - name: embed_survey_walks_pending_to_rejected_to_accepted_to_poured
    claim_type: valid_transition
    grounds:
    - state_machines.AnchorEmbedSurvey.PENDING_SURVEY_to_REJECTED
    - state_machines.AnchorEmbedSurvey.REJECTED_to_REJECTED
    - state_machines.AnchorEmbedSurvey.REJECTED_to_ACCEPTED
    - state_machines.AnchorEmbedSurvey.ACCEPTED_to_POURED
    - entities.AnchorEmbedSurvey.fields.survey_attempt_count
    distinguishing_aspect: 'The embed survey is the only machine with a self-loop: four consecutive POST /survey calls give
      REJECTED (deviation above tolerance), REJECTED again at exactly tolerance 25.0 (the rule is max_deviation_mm < tolerance_mm,
      so equality re-rejects), then ACCEPTED at 24.9, and survey_attempt_count reaches 3 while the state visits REJECTED
      twice.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package decided UNITIZED with one zone
      - the zone has a PENDING_SURVEY AnchorEmbedSurvey with planned_anchor_count 72 and default tolerance_mm 25.0
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /facade-packages/${pkg}/system-decision
        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: POST /installation-zones/${z1}/embed-surveys
        payload:
          embed_layout_ref: EL-05-N
          planned_anchor_count: 72
        as: StructuralContractor
        captures:
          sv1: $.data.id
      trigger:
      - call: POST /embed-surveys/${sv1}/survey
        payload:
          surveyed_anchor_count: 72
          max_deviation_mm: 31.0
        as: StructuralContractor
      - call: POST /embed-surveys/${sv1}/survey
        payload:
          surveyed_anchor_count: 72
          max_deviation_mm: 25.0
        as: StructuralContractor
      - call: POST /embed-surveys/${sv1}/survey
        payload:
          surveyed_anchor_count: 72
          max_deviation_mm: 24.9
        as: StructuralContractor
      - call: POST /embed-surveys/${sv1}/confirm-pour
        payload:
          poured_at: '2026-08-06T12:00:00Z'
        as: StructuralContractor
      assert:
      - after the 31.0 mm survey AnchorEmbedSurvey.${sv1}.state == REJECTED with survey_attempt_count == 1
      - after the 25.0 mm survey the state is still REJECTED (self-loop, not ACCEPTED) with survey_attempt_count == 2
      - after the 24.9 mm survey the state is ACCEPTED with survey_attempt_count == 3 and max_deviation_mm == 24.9
      - after confirm-pour the state is POURED with poured_at == 2026-08-06T12:00:00Z
      - AnchorEmbedSurvey.${sv1}.version incremented on each of the four writes, ending at 5
      - a survey call with surveyed_anchor_count 60 against planned 72 also yields REJECTED even with max_deviation_mm 1.0
