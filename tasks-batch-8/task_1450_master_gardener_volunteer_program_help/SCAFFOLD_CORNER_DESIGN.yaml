      - name: cycle_posture_blocks_application_and_edit
        claim_type: violation_to_error
        grounds: ["errors[ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS]", "errors[ERR_CYCLE_NOT_EDITABLE]", "validations[priority=7]"]
        distinguishing_aspect: "Once RECERTIFICATION begins, application intake fails with ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS and config edits with a fresh OCC version fail with ERR_CYCLE_NOT_EDITABLE."
        test_recipe:
          setup: ["cycle 2026 in RECERTIFICATION (clock advanced past recert_opens_at)"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc}/begin-recertification", as: ProgramCoordinator }
            - { call: "GET /program-cycles/${cyc}", as: ProgramCoordinator, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Late Comer", email: "late@example.org", county: "Harford", prior_gardening_years: 1 }, as: ProgramCoordinator, captures: { err1: $.data.error_id } }
            - { call: "PUT /program-cycles/${cyc}", payload: { expected_cycle_version: "${cv}", hour_requirement: 30.0 }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "captured err1 == ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS"
            - "captured err2 == ERR_CYCLE_NOT_EDITABLE"
            - "ProgramCycle.${cyc}.hour_requirement == 40.0   (edit dropped)"

