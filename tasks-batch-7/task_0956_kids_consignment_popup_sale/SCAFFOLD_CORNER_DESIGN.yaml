            - { call: "POST /drop-off-bookings/${bkb}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${ca}", title: "A item", category: TOYS, price_cents: 500 }, as: Consignor, as_user_id: "${ca}", captures: { item_a: $.data.id } }
