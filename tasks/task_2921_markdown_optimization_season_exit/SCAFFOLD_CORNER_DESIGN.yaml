      - name: preliminary_review_on_a_planning_season_is_rejected
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_SEASON_NOT_ACTIVE]
          - validations[priority=9]
          - endpoints[POST /seasons/{season_id}/exit-reviews]
          - state_machines.Season.initial_state
        distinguishing_aspect: |
          A PRELIMINARY review needs ACTIVE or EXIT_WINDOW, so a season still in PLANNING must fail with
          ERR_SEASON_NOT_ACTIVE at priority 9 - before the scorecard is computed, which is why a season with a
          single unsold item does not produce a divide-by-zero or a zero-margin review row.
        test_recipe:
          setup:
            - "Season SS27-FOOTWEAR was created and holds item G-7007 with 300 units received, but has never been transitioned, so it is still PLANNING"
            - "Season FW26-APPAREL is ACTIVE in the same store for contrast"
            - "The clock stands at 2026-10-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
