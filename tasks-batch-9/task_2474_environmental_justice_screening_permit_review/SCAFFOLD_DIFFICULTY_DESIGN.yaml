  - rule_id: compensating_invariant
    instances:
      - name: permitted_load_ledger_restored_after_decision_rescission
        grounds:
          - state_machines.PermitApplication.ISSUED_to_ENHANCED_REVIEW
          - state_machines.PermitDecision.ISSUED_to_RESCINDED
          - calculations.plan_reopen_extension
          - entities.ScreeningArea.fields.permitted_load_tpy
          - entities.Facility.fields.existing_load_tpy
          - entities.PermitApplication.fields.approved_net_emissions_tpy
        distinguishing_aspect: |
          The compensated invariant is the paired emissions ledger: rescission must
          decrement BOTH Facility.existing_load_tpy and ScreeningArea.permitted_load_tpy
          by exactly the 50.00 tpy that issuance added and then zero
          approved_net_emissions_tpy, while the historical
          community_benefit_total_usd 100225.00 is retained on the RESCINDED decision.
        test_recipe:
          setup:
            - "Clock 2026-10-10T09:00:00Z by the end of setup."
            - "AREA_A OVERBURDENED (74.03), baseline_load_tpy 400.00."
            - "APP_A (80.00 tpy) ENHANCED with an ACCEPTED SCREENING_LEVEL assessment (81.82) and one enforceable ADDITIONAL_CONTROL condition of 30.00 tpy, so total_mitigation_credit_tpy 30.00, approved_net_emissions_tpy 50.00, residual_impact_index 51.14."
            - "Plan CLOSED with required_comment_days 70, window 2026-08-01..2026-10-09, adequacy COMPLIANT; APP_A ISSUED by a decision with community_benefit_base_usd 95000.00, surcharge 5225.00 and total 100225.00; Facility.existing_load_tpy 50.00 and ScreeningArea.permitted_load_tpy 50.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
