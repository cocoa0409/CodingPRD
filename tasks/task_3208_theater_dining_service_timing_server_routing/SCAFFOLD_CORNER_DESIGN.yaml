  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_rejected_on_every_write
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "The authentication row outranks every business row, so an undeclared role is refused for the priority-1 reason even when the payload is also invalid."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 14", seat_capacity: 60 }
              as: PlatformAdmin
          trigger:
            - call: "POST /auditoriums"
              payload: { name: "Ghost Room", seat_capacity: 0 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "the call is refused with HTTP 400"
            - "data.error_id == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\", the undeclared-role case, and not a payload-shape error"
            - "no auditorium row is created, so the list endpoint still reports total_count == 1"

      - name: unauthorized_role_is_refused_before_any_existence_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - roles.Server.exclusive_operations
          - errors[ERR_UNAUTHORIZED_ROLE]
          - errors[ERR_SHOWTIME_NOT_FOUND]
        distinguishing_aspect: "A declared role that does not appear on the endpoint is refused for authorisation even when the id in the path also does not exist, so the authorisation half of the priority-1 row is evaluated before the existence cascade."
        test_recipe:
          setup:
            - "Auditorium A exists."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 15", seat_capacity: 60 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
          trigger:
            - call: "POST /showtimes/00000000-0000-4000-8000-000000000000/complete"
              payload: {}
              as: Server
              captures: { err_id: $.data.error_id }
          assert:
            - "the call is refused with HTTP 403"
            - "data.error_id == \"ERR_UNAUTHORIZED_ROLE\", not \"ERR_SHOWTIME_NOT_FOUND\", even though the id in the path does not exist"

      - name: cross_entity_actor_check_rejects_a_slip_from_another_section
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=15]
          - errors[ERR_NOT_ASSIGNED_SERVER]
          - entities.SectionAssignment.fields.server_id
        distinguishing_aspect: "Ownership is resolved through the assignment row rather than the header alone, so a server acting on another server's slip is refused even though both servers are legitimate actors."
        test_recipe:
          setup:
            - "Auditorium A, servers S1 and S2 both hired into A. Showtime X1 with SA1 owned by S1 and SA2 owned by S2. One ready slip on SA1."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 16", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Fries", channel: "ENTREE", price_cents: 700, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Fay", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Gil", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Heat", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${s1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${s2_id}", section_label: "RIGHT" }
              as: KitchenLead
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 7, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${s1_id}"
              captures: { slip_id: $.data.id }
          trigger:
            - call: "POST /order-slips/${slip_id}/prepare"
              payload: {}
              as: Server
              as_user_id: "${s2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the call is refused with HTTP 403"
            - "data.error_id == \"ERR_NOT_ASSIGNED_SERVER\""
            - "the slip's owning server is unchanged at ${s1_id}"

      - name: conditional_validation_only_binds_for_special_event_showtimes
        claim_type: Conditional validation
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - entities.Showtime.fields.content_type
        distinguishing_aspect: "The themed-menu and pre-show rows apply only when content_type is SPECIAL_EVENT, so an identical open-dining call on a STANDARD showtime succeeds with no programming event at all."
        test_recipe:
          setup:
            - "Auditorium A, one STANDARD showtime X1 and one SPECIAL_EVENT showtime X2, both inside their dining windows. No programming event exists."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 17", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:50:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Standard Cut", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Special Cut", start_at_utc: "2026-09-01T21:30:00Z", runtime_minutes: 60, content_type: "SPECIAL_EVENT" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id }
          trigger:
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /showtimes/${x2_id}/open-dining"
              payload: {}
              as: KitchenLead
              captures: { err_special: $.data.error_id }
          assert:
            - "the STANDARD showtime opens with HTTP 200 and data.status == \"DINING_OPEN\" even though no programming event exists"
            - "the SPECIAL_EVENT showtime is refused with data.error_id == \"ERR_THEMED_MENU_REQUIRED\""
            - "the two calls differ only in content_type, confirming the conditional binding"

      - name: temporal_validation_rejects_an_entree_after_the_deadline
        claim_type: Temporal validation
        grounds:
          - validations[priority=9]
          - errors[ERR_ENTREE_DEADLINE_PASSED]
        distinguishing_aspect: "An entree placement that is legal at one instant becomes illegal at a later instant on the same unchanged showtime, so the refusal is purely temporal."
        test_recipe:
          setup:
            - "Auditorium A, ENTREE E1, server S1, showtime X1 starts 2026-09-01T20:00:00Z runtime 60 so the deadline is 20:45. X1 open for dining."
          setup_api_calls:
