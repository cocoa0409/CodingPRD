scenario: |
  Residential Workforce Training Center Enrollment & Placement (Job Corps): applicant
  eligibility determination on age, income and barriers with admissions counselor intake,
  center assignment considering trade availability, residential capacity and geography,
  career technical training program selection with trade prerequisites and academic
  remediation, residential life management including dormitory assignment, conduct
  standards and zero tolerance policies, credential attainment tracking across high
  school equivalency, industry certifications and driver licensing, work-based learning
  placement with employer agreements and supervision, transition services with job
  placement, housing and transportation support after separation, center operator
  contracts with performance measures on graduation, placement and wages
domain_name: residential-workforce-training-center
api_prefix: "/jc"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_directive: |
    Much harder than expert level. Difficulty is carried by depth, not surface area:
    dual-variant performance math, per-graduate-then-sum rounding order, a gated
    weighted selector with deterministic tie-breaks, cyclic review/appeal loops,
    parallel enrollment state dimensions, depth-3 separation cascades, validation
    priority conflicts across distinct error-category pairs, half-open bed intervals
    vs aggregate slot ceilings, OCC-superseded writes, and a fixed logical clock
    (default 2026-09-01T00:00:00Z) driving age/window/expiry determinism.

# §1.0 Response Envelope (FIXED — verbatim)
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# §1.1 Entity-Relationship Table
# All entities carry common_fields (id, created_at, updated_at, version) unless
# noted; id is a server-minted UUID with no type prefix and is identity-only —
# it never participates in ranking, tie-break, or allocation decisions
# (created_at ASC is the only sanctioned common-field fallback).
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date, YYYY-MM-DD; age is computed against the logical clock at determination time" }
      - { name: home_region_code, type: string, source: input, description: "Applicant home region, e.g. R-NORTH; drives geo tier in center ranking" }
      - { name: desired_trade_code, type: string, source: input, description: "Requested trade, e.g. WELDING; drives center-assignment candidate gate" }
      - { name: assigned_center_id, type: string, source: system, description: "FK -> Center.id; set by the center-assignment selector, null until assigned", default: null }
      - { name: assignment_status, type: enum, source: system, description: "Assignment posture", default: NONE, constraints: "one of NONE, ASSIGNED, ENROLLED, RELEASED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the applicant this eligibility case belongs to" }
      - { name: intake_counselor_id, type: string, source: system, description: "Opaque X-User-ID of the AdmissionsCounselor who created the case; captured from the request header" }
      - { name: reviewer_id, type: string, source: system, description: "Opaque X-User-ID of the EligibilityReviewer who first began review; null until then", default: null }
      - { name: household_size, type: integer, source: input, description: "Household members counted for income limit; 1..HOUSEHOLD_SIZE_MAX(12)", constraints: "1..12 inclusive" }
      - { name: annual_income_cents, type: integer, source: input, description: "Reported annual household income in cents; >= 0", constraints: ">= 0" }
      - { name: barrier_flags, type: array, source: input, description: "Documented barrier codes; at least BARRIER_MIN_COUNT(1) required for eligibility", constraints: "members of FOSTER_CARE, HOMELESS, SINGLE_PARENT, DISABILITY, OFFENDER, LOW_BASIC_SKILLS" }
      - { name: status, type: enum, source: system, description: "Eligibility case state", default: SUBMITTED, constraints: "one of SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ELIGIBLE, INELIGIBLE" }
      - { name: determination_reasons, type: array, source: computed, description: "Empty when ELIGIBLE; otherwise subset of AGE_OUT_OF_RANGE, INCOME_EXCEEDS_LIMIT, NO_BARRIER_DOCUMENTED", default: "[]" }
      - { name: determined_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest determination; null until determined", default: null }

  - name: Center
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Center display name" }
      - { name: region_code, type: string, source: input, description: "Geographic region code matched against Applicant.home_region_code" }
      - { name: total_beds, type: integer, source: input, description: "Residential bed pool size; valid bed labels are B-01..B-NN zero-padded to 2 digits", constraints: ">= 1" }
      - { name: beds_in_use, type: integer, source: computed, description: "Count of ACTIVE DormitoryAssignment rows whose enrollment's trade program belongs to this center", default: 0 }
      - { name: beds_available, type: integer, source: computed, description: "total_beds - beds_in_use; invariant beds_in_use + beds_available == total_beds holds after every mutation", default: 0 }

  - name: TradeProgram
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; center operating this program" }
      - { name: trade_code, type: string, source: input, description: "Trade offered, e.g. WELDING, CARPENTRY, CULINARY" }
      - { name: capacity, type: integer, source: input, description: "Seat pool size; invariant enrolled_count + open_seats == capacity holds after every mutation", constraints: ">= 1" }
      - { name: required_credential_types, type: array, source: input, description: "Credential types that must be VERIFIED before TRAINING; empty means no prerequisites", default: "[]", constraints: "members of HSE, INDUSTRY_CERT, DRIVER_LICENSE" }
      - { name: supports_remediation, type: boolean, source: input, description: "When true, applicants missing prerequisites may enroll into REMEDIATION instead of being rejected", default: false }
      - { name: enrolled_count, type: integer, source: computed, description: "Enrollments at this program whose training_status is REMEDIATION or TRAINING", default: 0 }
      - { name: open_seats, type: integer, source: computed, description: "capacity - enrolled_count", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN while open_seats >= 1; auto-flips to FULL at 0 and back to OPEN when a seat frees; CLOSED only via PATCH", default: OPEN, constraints: "one of OPEN, FULL, CLOSED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; enrollee" }
      - { name: trade_program_id, type: string, source: input, description: "FK -> TradeProgram.id; program enrolled into" }
      - { name: residential_track, type: boolean, source: input, description: "True when the student boards at the center; fixes the residential_status axis" }
      - { name: training_status, type: enum, source: system, description: "Training axis of the parallel state dimensions", default: TRAINING, constraints: "one of REMEDIATION, TRAINING, COMPLETED, UNENROLLED, SEPARATED" }
      - { name: residential_status, type: enum, source: system, description: "Residential axis of the parallel state dimensions; NONRESIDENTIAL when residential_track is false", default: NONRESIDENTIAL, constraints: "one of NONRESIDENTIAL, AWAITING_BED, RESIDENT, RELEASED" }
      - { name: conduct_hold, type: boolean, source: computed, description: "True while any of this enrollment's incidents is BOARD_REVIEW or its rolling_points >= BOARD_REVIEW_THRESHOLD_POINTS(10); gates credential, WBL, dormitory and completion writes", default: false }
      - { name: exit_date, type: string, source: system, description: "Logical-clock date (YYYY-MM-DD) of the terminal training transition; null until terminal", default: null }
      - { name: exit_reason, type: string, source: system, description: "Reason captured on unenroll/separate; null otherwise", default: null }

  - name: DormitoryAssignment
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the resident enrollment" }
      - { name: bed_label, type: string, source: input, description: "Bed identifier within the enrollment's center, B-01..B-NN per Center.total_beds; omitted means server auto-selects the lowest-numbered free bed label (label ASC)", default: null }
      - { name: move_in_date, type: string, source: input, description: "Occupancy start, YYYY-MM-DD; interval is half-open [move_in_date, move_out_date)" }
      - { name: move_out_date, type: string, source: system, description: "Occupancy end (exclusive), set on checkout/termination; null while ACTIVE means open-ended", default: null }
      - { name: status, type: enum, source: system, description: "Assignment state", default: ACTIVE, constraints: "one of ACTIVE, CHECKED_OUT, TERMINATED" }

  - name: ConductIncident
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the charged enrollment" }
      - { name: infraction_code, type: enum, source: input, description: "Charged infraction", constraints: "one of CURFEW_VIOLATION, THEFT, VIOLENCE, DRUGS, WEAPONS, OTHER" }
      - { name: zero_tolerance, type: boolean, source: computed, description: "True iff infraction_code in {VIOLENCE, DRUGS, WEAPONS}; zero-tolerance incidents may not be sanctioned directly" }
      - { name: sanction_points, type: integer, source: input, description: "Points imposed by the sanction action; required 1..5 on sanction, null otherwise", default: null, constraints: "1..5 inclusive when set" }
      - { name: occurred_at, type: string, source: input, description: "Infraction date, YYYY-MM-DD; feeds the rolling 90-day points window" }
      - { name: note, type: string, source: input, description: "Free-text advisor note", default: null }
      - { name: status, type: enum, source: system, description: "Adjudication state", default: REPORTED, constraints: "one of REPORTED, INVESTIGATING, DISMISSED, SANCTIONED, BOARD_REVIEW, EXONERATED, SEPARATION_ORDERED" }

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; earning enrollment" }
      - { name: credential_type, type: enum, source: input, description: "Attainment track", constraints: "one of HSE, INDUSTRY_CERT, DRIVER_LICENSE" }
      - { name: subject_area, type: string, source: input, description: "Certification subject; required for INDUSTRY_CERT, optional otherwise", default: null }
      - { name: status, type: enum, source: system, description: "Attainment state", default: EARNED, constraints: "one of EARNED, VERIFIED, REVOKED" }
      - { name: earned_at, type: string, source: system, description: "Logical-clock date the credential was recorded" }
      - { name: verified_at, type: string, source: system, description: "Logical-clock date of verification; null until VERIFIED", default: null }

  - name: EmployerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: employer_name, type: string, source: input, description: "Employer legal name" }
      - { name: trade_code, type: string, source: input, description: "Trade the agreement covers; WBL placements must match the enrollment program's trade_code" }
      - { name: region_code, type: string, source: input, description: "Operating region" }
      - { name: slot_count, type: integer, source: input, description: "Maximum number of ACTIVE WBL placements allowed under this agreement at any instant (aggregate capacity ceiling)", constraints: ">= 1" }
      - { name: hourly_wage_floor_cents, type: integer, source: input, description: "Minimum allowed placement wage", constraints: "> 0" }
      - { name: effective_start, type: string, source: input, description: "Window start date, YYYY-MM-DD (inclusive)" }
      - { name: effective_end, type: string, source: input, description: "Window end date, YYYY-MM-DD (inclusive); agreement is EXPIRED when the logical clock date is past it" }
      - { name: status, type: enum, source: computed, description: "ACTIVE while effective_start <= clock date <= effective_end, else EXPIRED; derived on every read", constraints: "one of ACTIVE, EXPIRED" }

  - name: WBLPlacement
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; placed student" }
      - { name: employer_agreement_id, type: string, source: input, description: "FK -> EmployerAgreement.id; governing agreement" }
      - { name: supervisor_id, type: string, source: input, description: "Opaque staff id supervising the placement; one supervisor may hold at most MAX_SUPERVISION_ACTIVE(3) ACTIVE placements" }
      - { name: hourly_wage_cents, type: integer, source: input, description: "Placement wage; must be >= agreement.hourly_wage_floor_cents" }
      - { name: verified_hours_total, type: integer, source: computed, description: "Sum of recorded hours with verified=true (ACTUAL variant)", default: 0 }
      - { name: provisional_hours_total, type: integer, source: computed, description: "Sum of all recorded hours regardless of verified flag (PROVISIONAL variant)", default: 0 }
      - { name: status, type: enum, source: system, description: "Placement state", default: PROPOSED, constraints: "one of PROPOSED, ACTIVE, COMPLETED, TERMINATED" }
      - { name: start_date, type: string, source: system, description: "Logical-clock date of activation; null until ACTIVE", default: null }
      - { name: converted_to_hire, type: boolean, source: system, description: "Set by the complete action; drives JOB_PLACEMENT auto-completion on the transition plan", default: false }
      - { name: hire_wage_cents, type: integer, source: system, description: "Hire wage captured at completion; feeds job_starting_wage_cents", default: null }

  - name: TransitionPlan
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; 1:1 with the enrollment, auto-created by the complete or separate transition" }
      - { name: separation_date, type: string, source: system, description: "Logical-clock date the enrollment went terminal" }
      - { name: expires_at, type: string, source: computed, description: "separation_date + TRANSITION_WINDOW_MONTHS(12) months; service window closes after this date" }
      - { name: status, type: enum, source: computed, description: "COMPLETED once all three service tracks are in {COMPLETED, WAIVED}; else EXPIRED once the clock date passes expires_at; else ACTIVE", constraints: "one of ACTIVE, COMPLETED, EXPIRED" }
      - { name: job_placement_status, type: enum, source: system, description: "Job placement track", default: PENDING, constraints: "one of PENDING, COMPLETED, WAIVED" }
      - { name: housing_status, type: enum, source: system, description: "Housing track", default: PENDING, constraints: "one of PENDING, COMPLETED, WAIVED" }
      - { name: transportation_status, type: enum, source: system, description: "Transportation track", default: PENDING, constraints: "one of PENDING, COMPLETED, WAIVED" }
      - { name: job_starting_wage_cents, type: integer, source: system, description: "Verified starting wage at placement; set by the services endpoint or by WBL hire conversion", default: null }
      - { name: housing_stipend_cents, type: integer, source: computed, description: "HOUSING_STIPEND_CENTS(50000) once housing_status == COMPLETED, else 0", default: 0 }
      - { name: transport_allowance_cents, type: integer, source: computed, description: "Tiered allowance from transition_support_allowance once transportation_status == COMPLETED, else 0", default: 0 }

  - name: OperatorContract
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id; center whose outcomes the contract is measured on" }
      - { name: operator_name, type: string, source: input, description: "Operating company" }
      - { name: contract_code, type: string, source: input, description: "Unique contract identifier code", constraints: "unique across all contracts" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; PROBATION after a failing FINAL snapshot or manual probate; back to ACTIVE after a passing FINAL snapshot or manual reinstate; TERMINATED is terminal", default: ACTIVE, constraints: "one of ACTIVE, PROBATION, TERMINATED" }
      - { name: current_period_start, type: string, source: system, description: "Start date (inclusive) of the open review period; set to the logical-clock date at creation and to previous period_end + 1 day after each close" }
      - { name: period_sequence, type: integer, source: system, description: "1-based counter of closed+open periods; increments on each close", default: 1 }

  - name: PerformanceSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> OperatorContract.id; measured contract" }
      - { name: variant, type: enum, source: system, description: "Snapshots persisted by close-period are always FINAL; the PROVISIONAL variant is computed on demand by the preview endpoint and never persisted", constraints: "FINAL" }
      - { name: period_start, type: string, source: system, description: "Closed window start (inclusive), YYYY-MM-DD" }
      - { name: period_end, type: string, source: system, description: "Closed window end (inclusive), YYYY-MM-DD" }
      - { name: graduates_count, type: integer, source: system, description: "Cohort enrollments reaching COMPLETED inside the window" }
      - { name: leavers_count, type: integer, source: system, description: "Cohort enrollments reaching SEPARATED or UNENROLLED inside the window" }
      - { name: graduation_rate, type: number, source: system, description: "graduates / (graduates + leavers), 4 decimals round_half_up; 0.0 on empty cohort" }
      - { name: placement_rate, type: number, source: system, description: "placed graduates / graduates, 4 decimals round_half_up; 0.0 when graduates == 0" }
      - { name: avg_starting_wage_cents, type: integer, source: system, description: "round_half_up mean of placed graduates' job_starting_wage_cents; 0 when none placed" }
      - { name: payment_cents, type: integer, source: system, description: "operator_performance_payment over the FINAL cohort" }

# §1.2 State Machine Table
state_machines:
  - entity: Applicant
    dimension: assignment_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: ASSIGNED
        trigger: "POST /jc/applicants/{id}/center-assignment"
        actor: AdmissionsCounselor
        preconditions:
          - "applicant has an Application with status == ELIGIBLE"
          - "center_assignment_ranking yields a non-empty candidate pool"
        side_effects:
          - "assigned_center_id := winning center; ranked candidates returned"
          - "increments Applicant.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /jc/applicants/{id}/center-assignment"
        actor: AdmissionsCounselor
        preconditions: ["same as NONE -> ASSIGNED; the new assignment supersedes the old"]
        side_effects:
          - "assigned_center_id overwritten with the new winner"
          - "increments Applicant.version by 1"
        note: "Legitimate supersede — guarded by OCC on Applicant.version (see concurrency_rules)."
      - from: RELEASED
        to: ASSIGNED
        trigger: "POST /jc/applicants/{id}/center-assignment"
        actor: AdmissionsCounselor
        preconditions: ["same as NONE -> ASSIGNED"]
        side_effects:
          - "assigned_center_id overwritten with the new winner"
          - "increments Applicant.version by 1"
      - from: ASSIGNED
        to: ENROLLED
        trigger: "POST /jc/enrollments (side effect on the applicant)"
        actor: EnrollmentManager
        preconditions: ["enrollment create succeeds"]
        side_effects: ["assignment_status := ENROLLED"]
      - from: ENROLLED
        to: RELEASED
        trigger: "system: the applicant's Enrollment reaches a terminal training_status (COMPLETED, UNENROLLED, SEPARATED)"
        actor: system
        preconditions: []
        side_effects: ["assigned_center_id is kept for audit"]
        note: "RELEASED is a former enrollee; a later center-assignment re-arms the student (RELEASED -> ASSIGNED)."

  - entity: Application
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [ELIGIBLE]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /jc/applications/{id}/transition {action: begin_review}"
        actor: EligibilityReviewer
        preconditions:
          - "X-User-ID != intake_counselor_id (segregation of duties)"
        side_effects: ["reviewer_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /jc/applications/{id}/transition {action: request_info, info_request_note?}"
        actor: EligibilityReviewer
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /jc/applications/{id}/transition {action: provide_info, annual_income_cents?, household_size?, barrier_flags?}"
        actor: AdmissionsCounselor
        preconditions: []
        side_effects: ["any provided snapshot fields overwrite the stored values"]
        note: "Cycle edge: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat without bound."
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /jc/applications/{id}/transition {action: determine}"
        actor: EligibilityReviewer
        preconditions: ["X-User-ID != intake_counselor_id"]
        side_effects:
          - "runs calculations.eligibility_determination; reasons == [] on this path"
          - "determination_reasons := []; determined_at := clock"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /jc/applications/{id}/transition {action: determine}"
        actor: EligibilityReviewer
        preconditions: ["X-User-ID != intake_counselor_id"]
        side_effects:
          - "runs calculations.eligibility_determination; non-empty reasons stored"
          - "determined_at := clock"
      - from: INELIGIBLE
        to: UNDER_REVIEW
        trigger: "POST /jc/applications/{id}/transition {action: appeal, annual_income_cents?, household_size?, barrier_flags?}"
        actor: AdmissionsCounselor
        preconditions: []
        side_effects: ["any provided snapshot fields overwrite the stored values"]
        note: "Cycle edge: an appeal reopens the same case; determination re-runs on the updated snapshot."

  - entity: Enrollment
    dimension: training_status
    initial_state: TRAINING
    terminal_states: [COMPLETED, UNENROLLED, SEPARATED]
    transitions:
      - from: null
        to: TRAINING
        trigger: "POST /jc/enrollments"
        actor: EnrollmentManager
        preconditions:
          - "applicant.assignment_status == ASSIGNED and applicant.assigned_center_id == trade_program.center_id"
          - "trade_program.status == OPEN"
          - "every type in trade_program.required_credential_types is held VERIFIED for this applicant (a credential counts when its Credential.enrollment_id points at an Enrollment whose applicant_id is this applicant and its status == VERIFIED; a first-time applicant therefore holds none)"
        side_effects:
          - "trade_program.enrolled_count += 1; open_seats -= 1; program flips OPEN -> FULL when open_seats reaches 0"
          - "applicant.assignment_status := ENROLLED"
          - "residential_status := AWAITING_BED when residential_track else NONRESIDENTIAL"
      - from: null
        to: REMEDIATION
        trigger: "POST /jc/enrollments"
        actor: EnrollmentManager
        preconditions:
          - "applicant.assignment_status == ASSIGNED and applicant.assigned_center_id == trade_program.center_id"
          - "trade_program.status == OPEN"
          - "some required_credential_types entry is NOT held VERIFIED and trade_program.supports_remediation == true (else ERR_PREREQUISITE_NOT_MET)"
        side_effects:
          - "same seat consumption and applicant flip as the TRAINING create"
        note: "Creation lands in REMEDIATION exactly when prerequisites are missing and the program supports remediation."
      - from: REMEDIATION
        to: TRAINING
        trigger: "POST /jc/enrollments/{id}/transition {action: begin_training} OR system auto-advance when a required Credential reaches VERIFIED"
        actor: EnrollmentManager | system
        preconditions: ["every type in trade_program.required_credential_types is held VERIFIED for this enrollment"]
        side_effects: []
      - from: TRAINING
        to: COMPLETED
        trigger: "POST /jc/enrollments/{id}/transition {action: complete}"
        actor: EnrollmentManager
        preconditions:
          - "conduct_hold == false"
          - "every type in trade_program.required_credential_types is held VERIFIED"
        side_effects:
          - "exit_date := clock date; trade_program.enrolled_count -= 1; open_seats += 1; FULL -> OPEN auto-flip if it was FULL"
          - "ACTIVE DormitoryAssignment rows of this enrollment -> TERMINATED with move_out_date := clock date; Center.beds_in_use recomputed"
          - "auto-creates TransitionPlan (separation_date := clock date; when a COMPLETED WBLPlacement with converted_to_hire == true exists for this enrollment, job_placement_status initializes COMPLETED with job_starting_wage_cents := hire_wage_cents, otherwise all tracks start PENDING)"
      - from: REMEDIATION
        to: UNENROLLED
        trigger: "POST /jc/enrollments/{id}/transition {action: unenroll, reason}"
        actor: EnrollmentManager
        preconditions: []
        side_effects:
          - "exit_date := clock date; exit_reason := reason; seat release + FULL -> OPEN flip as on complete"
          - "ACTIVE DormitoryAssignment rows -> TERMINATED as on complete; no TransitionPlan is created"
      - from: TRAINING
        to: UNENROLLED
        trigger: "POST /jc/enrollments/{id}/transition {action: unenroll, reason}"
        actor: EnrollmentManager
        preconditions: []
        side_effects: ["same as REMEDIATION -> UNENROLLED"]
      - from: REMEDIATION
        to: SEPARATED
        trigger: "POST /jc/enrollments/{id}/transition {action: separate, reason} OR ConductIncident board decision separate"
        actor: EnrollmentManager | system
        preconditions: []
        side_effects:
          - "exit_date := clock date; exit_reason := reason; seat release + FULL -> OPEN flip as on complete"
          - "ACTIVE DormitoryAssignment rows -> TERMINATED as on complete"
          - "auto-creates TransitionPlan with the same hire-inheritance rule as on complete"
      - from: TRAINING
        to: SEPARATED
        trigger: "POST /jc/enrollments/{id}/transition {action: separate, reason} OR ConductIncident board decision separate"
        actor: EnrollmentManager | system
        preconditions: []
        side_effects: ["same as REMEDIATION -> SEPARATED"]

  - entity: Enrollment
    dimension: residential_status
    initial_state: NONRESIDENTIAL
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: AWAITING_BED
        trigger: "POST /jc/enrollments with residential_track == true"
        actor: EnrollmentManager
        preconditions: []
        side_effects: []
        note: "NONRESIDENTIAL when residential_track is false; the two enrollment dimensions evolve independently."
      - from: AWAITING_BED
        to: RESIDENT
        trigger: "POST /jc/dormitory-assignments (side effect on the enrollment)"
        actor: ResidentialAdvisor
        preconditions: ["dormitory assignment create succeeds"]
        side_effects: []
      - from: RESIDENT
        to: RELEASED
        trigger: "POST /jc/dormitory-assignments/{id}/checkout OR enrollment terminal transition (system)"
        actor: ResidentialAdvisor | system
        preconditions: []
        side_effects: []
      - from: AWAITING_BED
        to: RELEASED
        trigger: "enrollment terminal transition (system)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NONRESIDENTIAL
        to: RELEASED
        trigger: "enrollment terminal transition (system)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DormitoryAssignment
    dimension: status
    initial_state: ACTIVE
    terminal_states: [CHECKED_OUT, TERMINATED]
    transitions:
      - from: ACTIVE
        to: CHECKED_OUT
        trigger: "POST /jc/dormitory-assignments/{id}/checkout {move_out_date}"
        actor: ResidentialAdvisor
        preconditions: ["move_out_date >= move_in_date"]
        side_effects:
          - "move_out_date set; Center.beds_in_use recomputed (beds_available += 1)"
          - "enrollment.residential_status: RESIDENT -> RELEASED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: owning enrollment reaches a terminal training_status"
        actor: system
        preconditions: []
        side_effects:
          - "move_out_date := clock date; Center.beds_in_use recomputed"
          - "enrollment.residential_status -> RELEASED"
        note: "Conditional cascade: only ACTIVE assignments are terminated; CHECKED_OUT rows are untouched."

  - entity: ConductIncident
    dimension: status
    initial_state: REPORTED
    terminal_states: [DISMISSED, SANCTIONED, EXONERATED, SEPARATION_ORDERED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: begin_investigation}"
        actor: ResidentialAdvisor
        preconditions: []
        side_effects: []
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: dismiss, note?}"
        actor: ResidentialAdvisor
        preconditions: []
        side_effects: ["enrollment.conduct_hold recomputed"]
      - from: INVESTIGATING
        to: SANCTIONED
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: sanction, sanction_points}"
        actor: ResidentialAdvisor
        preconditions:
          - "zero_tolerance == false (else ERR_ZERO_TOLERANCE_BOARD_REQUIRED)"
          - "SANCTION_POINTS_MIN(1) <= sanction_points <= SANCTION_POINTS_MAX(5)"
        side_effects:
          - "enrollment.conduct_hold recomputed via calculations.conduct_rolling_points (rolling 90-day window)"
      - from: INVESTIGATING
        to: BOARD_REVIEW
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: refer_board}"
        actor: ResidentialAdvisor
        preconditions: []
        side_effects: ["enrollment.conduct_hold := true while any incident sits in BOARD_REVIEW"]
      - from: BOARD_REVIEW
        to: EXONERATED
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: exonerate}"
        actor: ResidentialAdvisor
        preconditions: []
        side_effects: ["enrollment.conduct_hold recomputed"]
      - from: BOARD_REVIEW
        to: SEPARATION_ORDERED
        trigger: "POST /jc/conduct-incidents/{id}/transition {action: separate}"
        actor: ResidentialAdvisor
        preconditions: []
        side_effects:
          - "link 1: owning Enrollment.training_status -> SEPARATED (exit_date := clock date, exit_reason := CONDUCT_BOARD)"
          - "link 2a: that enrollment mutation terminates its ACTIVE DormitoryAssignment rows (move_out_date := clock date)"
          - "link 2b: that enrollment mutation releases its TradeProgram seat (enrolled_count -= 1; FULL -> OPEN flip when applicable)"
          - "link 3: the dormitory termination recomputes Center.beds_in_use / beds_available"
          - "enrollment mutation also auto-creates the TransitionPlan (all tracks PENDING)"
        note: "Depth-3 transitive cascade: incident decision -> enrollment -> dormitory assignment -> center occupancy."

  - entity: Credential
    dimension: status
    initial_state: EARNED
    terminal_states: [REVOKED]
    transitions:
      - from: EARNED
        to: VERIFIED
        trigger: "POST /jc/credentials/{id}/transition {action: verify}"
        actor: CareerInstructor
        preconditions: []
        side_effects:
          - "verified_at := clock date"
          - "if the owning enrollment is REMEDIATION and every required_credential_types entry is now VERIFIED for this enrollment, enrollment auto-advances REMEDIATION -> TRAINING"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /jc/credentials/{id}/transition {action: revoke}"
        actor: CareerInstructor
        preconditions: []
        side_effects: []
        note: "Revocation does not demote an enrollment already in TRAINING; prerequisites are evaluated at gates only."

  - entity: WBLPlacement
    dimension: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /jc/wbl-placements/{id}/transition {action: activate}"
        actor: TransitionSpecialist
        preconditions:
          - "employer agreement status == ACTIVE"
          - "concurrent ACTIVE placements under the same agreement < agreement.slot_count (aggregate ceiling, else ERR_WBL_SLOT_EXCEEDED)"
          - "concurrent ACTIVE placements with the same supervisor_id < MAX_SUPERVISION_ACTIVE(3) (else ERR_SUPERVISION_OVERLOAD)"
          - "owning enrollment conduct_hold == false"
        side_effects: ["start_date := clock date"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /jc/wbl-placements/{id}/transition {action: record_hours, work_date, hours, verified?}"
        actor: TransitionSpecialist
        preconditions:
          - "work_date >= start_date and work_date <= clock date"
          - "no existing hours entry for this placement on the same work_date"
          - "1 <= hours <= MAX_DAILY_HOURS(10)"
        side_effects: ["runs calculations.wbl_hours_credit; verified_hours_total / provisional_hours_total updated"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /jc/wbl-placements/{id}/transition {action: complete, converted_to_hire?, hire_wage_cents?}"
        actor: TransitionSpecialist
        preconditions:
          - "verified_hours_total >= WBL_COMPLETION_MIN_HOURS(120)"
          - "hire_wage_cents required when converted_to_hire == true"
        side_effects:
          - "converted_to_hire / hire_wage_cents stored"
          - "frees one agreement slot and one supervision slot"
        note: "A later TransitionPlan auto-create initializes its job track from a COMPLETED placement with converted_to_hire == true (see Enrollment terminal transitions)."
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /jc/wbl-placements/{id}/transition {action: terminate, termination_reason?}"
        actor: TransitionSpecialist
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /jc/wbl-placements/{id}/transition {action: terminate, termination_reason?} OR system: owning enrollment reaches a terminal training_status"
        actor: TransitionSpecialist | system
        preconditions: []
        side_effects: ["frees one agreement slot and one supervision slot"]

  - entity: TransitionPlan
    dimension: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: any service-track flip (services endpoint or WBL hire conversion) leaves all three tracks in {COMPLETED, WAIVED}"
        actor: system
        preconditions: []
        side_effects: []
        note: "Bubble-up recompute on every track mutation; COMPLETED wins over EXPIRED when both apply."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock date passes expires_at while any track is still PENDING"
        actor: system
        preconditions: []
        side_effects: []
        note: "status is computed on read: all-tracks-done -> COMPLETED, else clock > expires_at -> EXPIRED, else ACTIVE."

  - entity: OperatorContract
    dimension: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /jc/operator-contracts/{id}/transition {action: probate} OR system: a FINAL snapshot with graduation_rate < GRADUATION_RATE_FLOOR(0.6) or (graduates_count > 0 and placement_rate < PLACEMENT_RATE_FLOOR(0.7))"
        actor: OperatorAdmin | system
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /jc/operator-contracts/{id}/transition {action: reinstate} OR system: a FINAL snapshot meeting both floors"
        actor: OperatorAdmin | system
        preconditions: []
        side_effects: []
        note: "Cycle edge: ACTIVE -> PROBATION -> ACTIVE may repeat across review periods."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /jc/operator-contracts/{id}/transition {action: terminate}"
        actor: OperatorAdmin
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /jc/operator-contracts/{id}/transition {action: terminate}"
        actor: OperatorAdmin
        preconditions: []
        side_effects: []

  - entity: TradeProgram
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: enrolled_count reaches capacity (open_seats == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system: a terminal enrollment transition frees a seat (open_seats back to >= 1)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cycle edge driven entirely by enrollment side effects."
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /jc/trade-programs/{id} {status: CLOSED}"
        actor: OperatorAdmin
        preconditions: []
        side_effects: ["no new enrollments accepted (ERR_PROGRAM_NOT_OPEN)"]
      - from: FULL
        to: CLOSED
        trigger: "PATCH /jc/trade-programs/{id} {status: CLOSED}"
        actor: OperatorAdmin
        preconditions: []
        side_effects: []

# §1.2.1 Concurrency Rules
concurrency_rules:
  - rule_id: application-create-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /jc/applications"
    occ_field: expected_applicant_version
    description: |
      Creating an Application against an Applicant whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      counselor has just filed a re-application (which legitimately supersedes the
      prior case once the previous determination is terminal) and the current
      writer's view of the applicant is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: center-assignment-stale-applicant
    parent_entity: Applicant
    write_endpoint: "POST /jc/applicants/{id}/center-assignment"
    occ_field: expected_applicant_version
    description: |
      Assigning (or re-assigning) a center against an Applicant whose version has
      advanced since the client last observed it is rejected. A re-assignment
      legitimately supersedes the previous one, so the only safeguard is the OCC
      check on the applicant's version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# §1.3 Calculation Rules Table
calculations:
  - name: eligibility_determination
    trigger: "POST /jc/applications/{id}/transition {action: determine}"
    algorithm: threshold
    formula: |
      age_years = whole years between applicant.date_of_birth and the logical clock date
                (floor: subtract 1 when the birthday has not yet occurred this year)
      income_limit_cents = INCOME_BASE_CENTS + (household_size - 1) * INCOME_PER_MEMBER_CENTS
      reasons = []
      if age_years < AGE_MIN_YEARS or age_years > AGE_MAX_YEARS: reasons += [AGE_OUT_OF_RANGE]
      if annual_income_cents > income_limit_cents:                reasons += [INCOME_EXCEEDS_LIMIT]
      if len(barrier_flags) < BARRIER_MIN_COUNT:                  reasons += [NO_BARRIER_DOCUMENTED]
      status = ELIGIBLE when reasons == [] else INELIGIBLE
      determination_reasons := reasons (order: AGE_OUT_OF_RANGE, INCOME_EXCEEDS_LIMIT, NO_BARRIER_DOCUMENTED)
    input_set: "the Application's stored snapshot fields and its Applicant.date_of_birth at determination time"
    constants:
      AGE_MIN_YEARS: 16
      AGE_MAX_YEARS: 24
      INCOME_BASE_CENTS: 1500000
      INCOME_PER_MEMBER_CENTS: 500000
      HOUSEHOLD_SIZE_MAX: 12
      BARRIER_MIN_COUNT: 1
    precision: "integer cents; exact comparisons (age bounds inclusive; income limit inclusive, i.e. income == limit is ELIGIBLE)"

  - name: center_assignment_ranking
    trigger: "POST /jc/applicants/{id}/center-assignment"
    algorithm: weighted_scoring
    formula: |
      candidates = centers C where exists TradeProgram T with T.center_id == C.id,
                   T.trade_code == applicant.desired_trade_code, T.status == OPEN,
                   T.open_seats >= 1, and (residential_track == false or C.beds_available >= 1)
      per candidate:
        trade_points    = min(max open_seats over qualifying programs at C, SEAT_SCORE_CAP)
        capacity_points = min(C.beds_available, BED_SCORE_CAP)
        geo_points      = GEO_MATCH_POINTS when C.region_code == applicant.home_region_code else 0
        score = round_half_up(TRADE_WEIGHT*trade_points + CAPACITY_WEIGHT*capacity_points
                              + GEO_WEIGHT*geo_points, 2)
      rank: score DESC, tie -> C.beds_available DESC, tie -> C.created_at ASC
      assign rank-1; empty candidate pool -> ERR_NO_ELIGIBLE_CENTER
    input_set: "all Centers and their TradeProgram rows; applicant.desired_trade_code and home_region_code"
    constants:
      TRADE_WEIGHT: 0.5
      CAPACITY_WEIGHT: 0.3
      GEO_WEIGHT: 0.2
      SEAT_SCORE_CAP: 10
      BED_SCORE_CAP: 10
      GEO_MATCH_POINTS: 10
    precision: "score to 2 decimal places, round_half_up"
    note: "Combinatorial mode (a): >= 3 inputs with non-linear interaction — hard gates (OPEN program with seats, beds for residential) multiply a capped weighted sum."

  - name: conduct_rolling_points
    trigger: "after every ConductIncident transition and on any read of Enrollment.conduct_hold"
    algorithm: chronological
    formula: |
      window_start = logical clock date - ROLLING_WINDOW_DAYS days
      rolling_points = sum(sanction_points over the enrollment's incidents with
                           status == SANCTIONED and occurred_at >= window_start)   # occurred_at inclusive
      conduct_hold = (exists incident of this enrollment with status == BOARD_REVIEW)
                     or (rolling_points >= BOARD_REVIEW_THRESHOLD_POINTS)
    input_set: "ConductIncident rows of one enrollment; SANCTIONED only; window inclusive at both ends (date comparison)"
    constants:
      ROLLING_WINDOW_DAYS: 90
      BOARD_REVIEW_THRESHOLD_POINTS: 10
      SANCTION_POINTS_MIN: 1
      SANCTION_POINTS_MAX: 5
    precision: "integer points; threshold comparison is >= (exactly 10 points activates the hold)"

  - name: dorm_occupancy_reconcile
    trigger: "on DormitoryAssignment create / checkout / system termination"
    algorithm: aggregation
    formula: |
      beds_in_use(C)   = count of DormitoryAssignment rows with status == ACTIVE whose
                         enrollment.trade_program.center_id == C.id
      beds_available(C) = C.total_beds - beds_in_use(C)
      INVARIANT: beds_in_use(C) + beds_available(C) == C.total_beds  (assign and its
                 compensating checkout/termination must leave this unchanged)
    input_set: "ACTIVE DormitoryAssignment rows only; CHECKED_OUT / TERMINATED excluded"
    constants: {}
    precision: "integer counts"

  - name: wbl_hours_credit
    trigger: "POST /jc/wbl-placements/{id}/transition {action: record_hours}"
    algorithm: chronological
    formula: |
      entries processed in work_date ASC order (work_date is unique per placement)
      ACTUAL:      verified_hours_total   = sum(hours where verified == true)
      PROVISIONAL: provisional_hours_total = sum(hours over all entries)
      completion gate: verified_hours_total >= WBL_COMPLETION_MIN_HOURS
    input_set: "hours entries of one WBLPlacement; entry uniqueness on work_date is enforced by validation"
    constants:
      MAX_DAILY_HOURS: 10
      WBL_COMPLETION_MIN_HOURS: 120
      MAX_SUPERVISION_ACTIVE: 3
    precision: "integer hours"
    variants:
      - name: ACTUAL
        when: "completion gate, performance inputs"
        difference: "counts only verified entries"
      - name: PROVISIONAL
        when: "progress reporting on the placement"
        difference: "counts verified and unverified entries; identical inputs yield a larger-or-equal total"

  - name: transition_support_allowance
    trigger: "POST /jc/transition-plans/{id}/services {service_type: TRANSPORTATION | HOUSING, outcome: COMPLETED}"
    algorithm: tiered_pricing
    formula: |
      transportation (distance_miles d, tier boundaries inclusive at the lower tier):
        d <= TRANSPORT_T1_MAX_MILES  -> TRANSPORT_T1_CENTS
        d <= TRANSPORT_T2_MAX_MILES  -> TRANSPORT_T2_CENTS
        else                          -> TRANSPORT_T3_CENTS
      housing: housing_stipend_cents = HOUSING_STIPEND_CENTS when housing_status == COMPLETED else 0
    input_set: "one TransitionPlan service record"
    constants:
      TRANSPORT_T1_MAX_MILES: 25
      TRANSPORT_T1_CENTS: 2500
      TRANSPORT_T2_MAX_MILES: 100
      TRANSPORT_T2_CENTS: 7500
      TRANSPORT_T3_CENTS: 15000
      HOUSING_STIPEND_CENTS: 50000
      TRANSITION_WINDOW_MONTHS: 12
    precision: "integer cents; tier comparisons use <= (exactly 25 miles pays 2500, exactly 100 pays 7500)"

  - name: performance_rate
    trigger: "GET /jc/operator-contracts/{id}/performance-preview (PROVISIONAL) and POST /jc/operator-contracts/{id}/close-period (FINAL)"
    algorithm: aggregation
    formula: |
      period window: [contract.current_period_start, period_end] both inclusive,
                     period_end = logical clock date at evaluation
      cohort C = enrollments E where E.trade_program.center_id == contract.center_id
                 and E.exit_date inside the window
      graduates = count(E in C with training_status == COMPLETED)
      leavers   = count(E in C with training_status in {SEPARATED, UNENROLLED})
      placed    = count of graduates whose TransitionPlan.job_placement_status == COMPLETED
      FINAL variant:
        graduation_rate = round_half_up(graduates / (graduates + leavers), 4); 0.0 when denominator == 0
      PROVISIONAL variant (preview only, never persisted):
        actives = count of enrollments at the center with training_status in {REMEDIATION, TRAINING}
        graduation_rate = round_half_up((graduates + actives) / (graduates + leavers + actives), 4);
                          0.0 when denominator == 0
      both variants:
        placement_rate = round_half_up(placed / graduates, 4); 0.0 when graduates == 0
        avg_starting_wage_cents = round_half_up(mean of placed graduates' job_starting_wage_cents, 0); 0 when placed == 0
      close-period side effects: persist PerformanceSnapshot(variant=FINAL); advance
        current_period_start := period_end + 1 day; period_sequence += 1; then apply the
        OperatorContract probation/reinstatement auto-transitions against the floors.
    input_set: "enrollments at the contract's center; exit_date inside the period window; TransitionPlan tracks of graduates"
    constants:
      GRADUATION_RATE_FLOOR: 0.6
      PLACEMENT_RATE_FLOOR: 0.7
    precision: "rates to 4 decimal places round_half_up; wage mean to whole cents round_half_up"
    variants:
      - name: FINAL
        when: "close-period persistence"
        difference: "cohort counts only terminal exits inside the window"
      - name: PROVISIONAL
        when: "on-demand preview"
        difference: "adds still-active enrollments (REMEDIATION/TRAINING) as projected graduates in numerator and denominator — identical data yields a different rate"

  - name: operator_performance_payment
    trigger: "inside performance_rate evaluation (both variants), from the placed-graduate set"
    algorithm: tiered_pricing
    formula: |
      per placed graduate g:
        wage_ratio = min(g.job_starting_wage_cents / WAGE_REFERENCE_CENTS, WAGE_RATIO_CAP)
        award_g    = round_half_up(PER_GRADUATE_BASE_CENTS * wage_ratio, 0)   # round FIRST
      payment_cents = sum(award_g)                                            # sum SECOND
      PINNED ORDER: round per-graduate to whole cents, then sum. Summing raw
      products and rounding once is a different, non-conforming result.
    input_set: "placed graduates of the evaluated cohort (TransitionPlan.job_starting_wage_cents)"
    constants:
      PER_GRADUATE_BASE_CENTS: 200000
      WAGE_REFERENCE_CENTS: 150000
      WAGE_RATIO_CAP: 2.0
    precision: "whole cents, round_half_up applied per graduate before summation"
    note: "Combinatorial mode (b): nested rounding where order changes the cents — e.g. two placed graduates at 149999 cents each pay 399998 under the pinned order but 399997 under sum-then-round."

# §1.4 Validation Rules Table (ordered by priority; first failing rule wins)
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "for review actions (begin_review, request_info, determine) the acting X-User-ID must differ from the application's intake_counselor_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /jc/applications/{id}/transition" }
  - { priority: 4, category: existence, check: "path-templated ids resolve to existing entities, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: existence, check: "request body is well-formed: required fields present, no undeclared fields, enum members valid, typed ranges respected (household_size 1..12, bed_label within B-01..B-NN, sanction_points 1..5, hours 1..10 bounds are shape-level)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 6, category: state, check: "expected_applicant_version equals the Applicant's current version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /jc/applications, POST /jc/applicants/{id}/center-assignment" }
  - { priority: 7, category: state, check: "the path-target entity of a transition endpoint (paths matching */transition) is itself terminal (ELIGIBLE application; REVOKED credential; DISMISSED/SANCTIONED/EXONERATED/SEPARATION_ORDERED incident; COMPLETED/TERMINATED placement; TERMINATED contract; CHECKED_OUT/TERMINATED assignment) — terminal lockdown is reported before any other state analysis. Non-transition action endpoints (checkout, services, close-period) report staleness through their own rules below.", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "transition endpoints (paths matching */transition)" }
  - { priority: 8, category: state, check: "target entity is in a non-terminal state from which the requested transition/action is undefined, OR a create endpoint references an entity whose state violates the operation's precondition (cross-entity state preconditions on creates report here, never as ERR_ALREADY_TERMINAL). On the transition-services endpoint this row covers only the COMPLETED-plan case — the EXPIRED-plan case is owned by priority 16, which is evaluated first for that endpoint.", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints and state-gated creates" }
  - { priority: 9, category: business_safety, check: "enrollment.conduct_hold == false before credential create, WBL placement create/activate, dormitory assignment create, and training completion", error_id: ERR_CONDUCT_HOLD, http_status: 409, applies_to: "POST /jc/credentials, POST /jc/wbl-placements, POST /jc/wbl-placements/{id}/transition, POST /jc/dormitory-assignments, POST /jc/enrollments/{id}/transition" }
  - { priority: 10, category: business_safety, check: "zero-tolerance incidents (zero_tolerance == true) may only be resolved via the board: action sanction is rejected", error_id: ERR_ZERO_TOLERANCE_BOARD_REQUIRED, http_status: 422, applies_to: "POST /jc/conduct-incidents/{id}/transition" }
  - { priority: 11, category: business_constraint, check: "applicant has no non-terminal Application (status in SUBMITTED, UNDER_REVIEW, INFO_REQUESTED) when a new Application is created", error_id: ERR_DUPLICATE_APPLICATION, http_status: 409, applies_to: "POST /jc/applications" }
  - { priority: 12, category: business_constraint, check: "prerequisite satisfaction: enrollment create requires each required_credential_types entry to be held VERIFIED (Credential.enrollment_id -> Enrollment with this applicant_id, status VERIFIED) or the program to support remediation; begin_training and complete require them VERIFIED on credentials of THIS enrollment (Credential.enrollment_id == this enrollment.id)", error_id: ERR_PREREQUISITE_NOT_MET, http_status: 422, applies_to: "POST /jc/enrollments, POST /jc/enrollments/{id}/transition" }
  - { priority: 13, category: business_constraint, check: "hours entry constraints: work_date unique per placement, work_date >= start_date, work_date <= clock date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /jc/wbl-placements/{id}/transition" }
  - { priority: 14, category: business_constraint, check: "center-assignment selector pool is non-empty", error_id: ERR_NO_ELIGIBLE_CENTER, http_status: 422, applies_to: "POST /jc/applicants/{id}/center-assignment" }
  - { priority: 15, category: business_temporal, check: "requested bed_label is free for the half-open interval [move_in_date, move_out_date): an existing ACTIVE assignment on the same center+bed conflicts iff existing.move_out_date is null or move_in_date < existing.move_out_date; adjacency (move_in_date == existing.move_out_date) is allowed", error_id: ERR_BED_OVERLAP, http_status: 409, applies_to: "POST /jc/dormitory-assignments" }
  - { priority: 16, category: business_temporal, check: "transition service recorded while the logical clock date is past plan.expires_at (the plan reads EXPIRED); on this endpoint the window check outranks the generic ACTIVE-state check of priority 8", error_id: ERR_TRANSITION_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /jc/transition-plans/{id}/services" }
  - { priority: 17, category: business_referential, check: "applicant has an ELIGIBLE application before center assignment, and assignment_status == ASSIGNED before enrollment", error_id: ERR_APPLICANT_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /jc/applicants/{id}/center-assignment, POST /jc/enrollments" }
  - { priority: 18, category: business_referential, check: "enrollment's trade program belongs to the applicant's assigned center", error_id: ERR_CENTER_MISMATCH, http_status: 422, applies_to: "POST /jc/enrollments" }
  - { priority: 19, category: business_referential, check: "trade program status == OPEN at enrollment create", error_id: ERR_PROGRAM_NOT_OPEN, http_status: 409, applies_to: "POST /jc/enrollments" }
  - { priority: 20, category: business_referential, check: "employer agreement status == ACTIVE at placement create and activate", error_id: ERR_AGREEMENT_INACTIVE, http_status: 409, applies_to: "POST /jc/wbl-placements, POST /jc/wbl-placements/{id}/transition" }
  - { priority: 21, category: business_fiscal, check: "center bed pool not exhausted: on explicit bed_label the overlap rule governs; on auto-select at least one free bed must exist", error_id: ERR_NO_BED_AVAILABLE, http_status: 422, applies_to: "POST /jc/dormitory-assignments" }
  - { priority: 22, category: business_fiscal, check: "concurrent ACTIVE placements under the agreement < slot_count at activation", error_id: ERR_WBL_SLOT_EXCEEDED, http_status: 422, applies_to: "POST /jc/wbl-placements/{id}/transition" }
  - { priority: 23, category: business_fiscal, check: "concurrent ACTIVE placements under the supervisor < MAX_SUPERVISION_ACTIVE(3) at activation", error_id: ERR_SUPERVISION_OVERLOAD, http_status: 422, applies_to: "POST /jc/wbl-placements/{id}/transition" }
  - { priority: 24, category: business_fiscal, check: "hourly_wage_cents >= agreement.hourly_wage_floor_cents at placement create", error_id: ERR_WAGE_BELOW_FLOOR, http_status: 422, applies_to: "POST /jc/wbl-placements" }
  - { priority: 25, category: business_fiscal, check: "review period is closable: logical clock date > contract.current_period_start and contract status in {ACTIVE, PROBATION}", error_id: ERR_PERIOD_NOT_CLOSABLE, http_status: 409, applies_to: "POST /jc/operator-contracts/{id}/close-period" }

# §1.5 API Endpoint Table (41 endpoints)
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Sets the server clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time.", roles: [OperatorAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["re-derives EmployerAgreement.status and TransitionPlan.status on next read"] }

  - { method: POST, path: "/jc/applicants", description: "Create an applicant (intake).", roles: [AdmissionsCounselor], code: 201, input: [full_name, date_of_birth, home_region_code, desired_trade_code], output: Applicant, side_effects: [] }
  - { method: GET, path: "/jc/applicants", description: "List applicants with filters (FK reverse-reachability for assigned_center_id).", roles: [AdmissionsCounselor, EligibilityReviewer, EnrollmentManager, OperatorAdmin], code: 200, input: ["assigned_center_id?", "assignment_status?", "limit?", "offset?"], output: "Applicant[]", side_effects: [] }
  - { method: GET, path: "/jc/applicants/{id}", description: "Fetch one applicant including assignment_status and version.", roles: [AdmissionsCounselor, EligibilityReviewer, EnrollmentManager, ResidentialAdvisor, CareerInstructor, TransitionSpecialist, OperatorAdmin], code: 200, input: [], output: Applicant, side_effects: [] }
  - { method: POST, path: "/jc/applications", description: "Open an eligibility case for an applicant (re-application supersedes a terminal prior case).", roles: [AdmissionsCounselor], code: 201, input: [applicant_id, household_size, annual_income_cents, barrier_flags, expected_applicant_version], output: Application, side_effects: ["intake_counselor_id := X-User-ID", "increments Applicant.version by 1"] }
  - { method: GET, path: "/jc/applicants/{id}/applications", description: "List an applicant's eligibility cases, newest first.", roles: [AdmissionsCounselor, EligibilityReviewer, OperatorAdmin], code: 200, input: [], output: "Application[]", side_effects: [] }
  - { method: POST, path: "/jc/applications/{id}/transition", description: "Drive the eligibility case: begin_review | request_info | provide_info | determine | appeal. determine runs eligibility_determination server-side.", roles: [AdmissionsCounselor, EligibilityReviewer], code: 200, input: [action, "annual_income_cents?", "household_size?", "barrier_flags?", "info_request_note?"], output: Application, side_effects: ["per Application state machine", "on determine: runs calculations.eligibility_determination and stores determination_reasons"] }
  - { method: POST, path: "/jc/applicants/{id}/center-assignment", description: "Run center_assignment_ranking and assign the rank-1 center (re-assignment supersedes).", roles: [AdmissionsCounselor], code: 200, input: [expected_applicant_version, residential_track], output: { assignment_status: string, assigned_center_id: string, assigned_center_score: number, ranked_candidates: array }, side_effects: ["runs calculations.center_assignment_ranking", "applicant.assigned_center_id / assignment_status updated", "increments Applicant.version by 1"] }

  - { method: POST, path: "/jc/centers", description: "Create a training center with its bed pool.", roles: [OperatorAdmin], code: 201, input: [name, region_code, total_beds], output: Center, side_effects: ["beds_in_use := 0, beds_available := total_beds"] }
  - { method: GET, path: "/jc/centers/{id}", description: "Fetch one center with computed bed fields.", roles: [OperatorAdmin, AdmissionsCounselor, EnrollmentManager, ResidentialAdvisor], code: 200, input: [], output: Center, side_effects: [] }
  - { method: GET, path: "/jc/centers/{id}/operator-contracts", description: "List operator contracts for a center.", roles: [OperatorAdmin], code: 200, input: [], output: "OperatorContract[]", side_effects: [] }
  - { method: POST, path: "/jc/trade-programs", description: "Create a trade program at a center.", roles: [OperatorAdmin], code: 201, input: [center_id, trade_code, capacity, "required_credential_types?", "supports_remediation?"], output: TradeProgram, side_effects: ["enrolled_count := 0, open_seats := capacity, status := OPEN"] }
  - { method: GET, path: "/jc/centers/{id}/trade-programs", description: "List a center's trade programs.", roles: [OperatorAdmin, AdmissionsCounselor, EnrollmentManager], code: 200, input: [], output: "TradeProgram[]", side_effects: [] }
  - { method: PATCH, path: "/jc/trade-programs/{id}", description: "Update capacity and/or status (only fields allowed; status: CLOSED closes the program).", roles: [OperatorAdmin], code: 200, input: ["capacity?", "status?"], output: TradeProgram, side_effects: ["open_seats recomputed when capacity changes; capacity < enrolled_count is rejected ERR_INVALID_REQUEST", "increments TradeProgram.version by 1"] }

  - { method: POST, path: "/jc/enrollments", description: "Enroll an assigned applicant into a trade program.", roles: [EnrollmentManager], code: 201, input: [applicant_id, trade_program_id, residential_track], output: Enrollment, side_effects: ["initial training_status TRAINING or REMEDIATION per prerequisites", "seat consumed; FULL flip at 0 open seats", "applicant.assignment_status := ENROLLED", "residential_status := AWAITING_BED when residential_track"] }
  - { method: GET, path: "/jc/enrollments", description: "List enrollments with filters.", roles: [EnrollmentManager, OperatorAdmin, TransitionSpecialist], code: 200, input: ["applicant_id?", "trade_program_id?", "center_id?", "training_status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/jc/enrollments/{id}", description: "Fetch one enrollment (both state dimensions, conduct_hold).", roles: [AdmissionsCounselor, EligibilityReviewer, EnrollmentManager, ResidentialAdvisor, CareerInstructor, TransitionSpecialist, OperatorAdmin], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/jc/enrollments/{id}/transition", description: "Training-axis actions: begin_training | complete | unenroll | separate.", roles: [EnrollmentManager], code: 200, input: [action, "reason?"], output: Enrollment, side_effects: ["per Enrollment state machines", "terminal transitions release the seat, terminate ACTIVE dormitory assignments, flip applicant.assignment_status -> RELEASED, and (complete/separate only) auto-create the TransitionPlan"] }

  - { method: POST, path: "/jc/dormitory-assignments", description: "Assign a dormitory bed to a resident enrollment; bed_label omitted auto-selects the lowest-numbered free bed.", roles: [ResidentialAdvisor], code: 201, input: [enrollment_id, move_in_date, "bed_label?"], output: DormitoryAssignment, side_effects: ["enrollment.residential_status AWAITING_BED -> RESIDENT", "Center.beds_in_use recomputed"] }
  - { method: GET, path: "/jc/enrollments/{id}/dormitory-assignments", description: "List dormitory assignments of an enrollment.", roles: [ResidentialAdvisor, EnrollmentManager], code: 200, input: [], output: "DormitoryAssignment[]", side_effects: [] }
  - { method: POST, path: "/jc/dormitory-assignments/{id}/checkout", description: "Early release of a bed (compensating action for assignment).", roles: [ResidentialAdvisor], code: 200, input: [move_out_date], output: DormitoryAssignment, side_effects: ["move_out_date set; status -> CHECKED_OUT", "Center.beds_in_use recomputed", "enrollment.residential_status RESIDENT -> RELEASED"] }

  - { method: POST, path: "/jc/conduct-incidents", description: "Report a conduct incident against an enrollment.", roles: [ResidentialAdvisor], code: 201, input: [enrollment_id, infraction_code, occurred_at, "note?"], output: ConductIncident, side_effects: ["zero_tolerance derived from infraction_code"] }
  - { method: GET, path: "/jc/enrollments/{id}/conduct-incidents", description: "List conduct incidents of an enrollment.", roles: [ResidentialAdvisor, EnrollmentManager], code: 200, input: [], output: "ConductIncident[]", side_effects: [] }
  - { method: POST, path: "/jc/conduct-incidents/{id}/transition", description: "Adjudication actions: begin_investigation | dismiss | sanction | refer_board | exonerate | separate.", roles: [ResidentialAdvisor], code: 200, input: [action, "sanction_points?", "note?"], output: ConductIncident, side_effects: ["per ConductIncident state machine; separate fires the depth-3 separation cascade", "sanction recomputes enrollment.conduct_hold"] }

  - { method: POST, path: "/jc/credentials", description: "Record an earned credential (HSE | INDUSTRY_CERT | DRIVER_LICENSE) for an enrollment.", roles: [CareerInstructor], code: 201, input: [enrollment_id, credential_type, "subject_area?"], output: Credential, side_effects: ["status := EARNED, earned_at := clock date"] }
  - { method: GET, path: "/jc/enrollments/{id}/credentials", description: "List credentials of an enrollment.", roles: [CareerInstructor, EnrollmentManager], code: 200, input: [], output: "Credential[]", side_effects: [] }
  - { method: POST, path: "/jc/credentials/{id}/transition", description: "verify | revoke a credential; verifying the last outstanding prerequisite auto-advances REMEDIATION -> TRAINING.", roles: [CareerInstructor], code: 200, input: [action], output: Credential, side_effects: ["per Credential state machine", "possible enrollment auto-advance"] }

  - { method: POST, path: "/jc/employer-agreements", description: "Create an employer agreement (slot pool + wage floor + effective window).", roles: [OperatorAdmin], code: 201, input: [employer_name, trade_code, region_code, slot_count, hourly_wage_floor_cents, effective_start, effective_end], output: EmployerAgreement, side_effects: [] }
  - { method: GET, path: "/jc/employer-agreements/{id}", description: "Fetch one agreement with its clock-derived status.", roles: [OperatorAdmin, TransitionSpecialist], code: 200, input: [], output: EmployerAgreement, side_effects: [] }
  - { method: GET, path: "/jc/employer-agreements/{id}/wbl-placements", description: "List placements under an agreement.", roles: [OperatorAdmin, TransitionSpecialist], code: 200, input: [], output: "WBLPlacement[]", side_effects: [] }

  - { method: POST, path: "/jc/wbl-placements", description: "Propose a work-based learning placement under an agreement.", roles: [TransitionSpecialist], code: 201, input: [enrollment_id, employer_agreement_id, supervisor_id, hourly_wage_cents], output: WBLPlacement, side_effects: ["status := PROPOSED"] }
  - { method: GET, path: "/jc/enrollments/{id}/wbl-placements", description: "List placements of an enrollment.", roles: [TransitionSpecialist, EnrollmentManager], code: 200, input: [], output: "WBLPlacement[]", side_effects: [] }
  - { method: POST, path: "/jc/wbl-placements/{id}/transition", description: "Placement actions: activate | record_hours | complete | terminate.", roles: [TransitionSpecialist], code: 200, input: [action, "work_date?", "hours?", "verified?", "termination_reason?", "converted_to_hire?", "hire_wage_cents?"], output: WBLPlacement, side_effects: ["per WBLPlacement state machine", "record_hours runs calculations.wbl_hours_credit", "complete with converted_to_hire fires the transition-plan bubble-up"] }

  - { method: GET, path: "/jc/enrollments/{id}/transition-plan", description: "Fetch the transition plan of an enrollment (array of 0 or 1).", roles: [TransitionSpecialist, EnrollmentManager], code: 200, input: [], output: "TransitionPlan[]", side_effects: [] }
  - { method: POST, path: "/jc/transition-plans/{id}/services", description: "Record a transition-service outcome: service_type JOB_PLACEMENT | HOUSING | TRANSPORTATION, outcome COMPLETED | WAIVED.", roles: [TransitionSpecialist], code: 200, input: [service_type, outcome, "starting_wage_cents?", "distance_miles?"], output: TransitionPlan, side_effects: ["track status updated; starting_wage_cents stored for JOB_PLACEMENT; runs calculations.transition_support_allowance for HOUSING/TRANSPORTATION", "plan auto-completes when all tracks leave PENDING"] }

  - { method: POST, path: "/jc/operator-contracts", description: "Create an operator contract for a center (starts ACTIVE, period 1 opens at the clock date).", roles: [OperatorAdmin], code: 201, input: [center_id, operator_name, contract_code], output: OperatorContract, side_effects: ["current_period_start := clock date, period_sequence := 1"] }
  - { method: GET, path: "/jc/operator-contracts/{id}", description: "Fetch one contract.", roles: [OperatorAdmin], code: 200, input: [], output: OperatorContract, side_effects: [] }
  - { method: POST, path: "/jc/operator-contracts/{id}/transition", description: "Contract actions: probate | reinstate | terminate.", roles: [OperatorAdmin], code: 200, input: [action], output: OperatorContract, side_effects: ["per OperatorContract state machine"] }
  - { method: GET, path: "/jc/operator-contracts/{id}/performance-preview", description: "On-demand PROVISIONAL performance computation over the open period (never persisted).", roles: [OperatorAdmin], code: 200, input: [], output: { variant: string, period_start: string, period_end: string, graduates_count: integer, leavers_count: integer, projected_actives_count: integer, graduation_rate: number, placement_rate: number, avg_starting_wage_cents: integer, payment_cents: integer }, side_effects: ["runs calculations.performance_rate (PROVISIONAL) and calculations.operator_performance_payment"] }
  - { method: POST, path: "/jc/operator-contracts/{id}/close-period", description: "Close the current review period: persist the FINAL snapshot, advance the period window, apply probation/reinstatement auto-transitions.", roles: [OperatorAdmin], code: 201, input: [], output: PerformanceSnapshot, side_effects: ["runs calculations.performance_rate (FINAL) and calculations.operator_performance_payment", "current_period_start := period_end + 1 day; period_sequence += 1", "contract auto-transition per floors"] }
  - { method: GET, path: "/jc/operator-contracts/{id}/performance-snapshots", description: "List persisted FINAL snapshots of a contract.", roles: [OperatorAdmin], code: 200, input: [], output: "PerformanceSnapshot[]", side_effects: [] }

# §1.6 Error Code Catalog
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or the role is not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "authenticated role is not in the endpoint's role list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "review action attempted by the same X-User-ID recorded as intake_counselor_id on the application" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path-templated id does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body: missing required field, undeclared field, invalid enum member, or field-domain violation (ranges, bed_label format/scope, hours work_date rules, PATCH capacity below enrolled_count)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_applicant_version does not match the Applicant's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition/action is not defined from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "target entity sits in a terminal state of its state machine" }
  - { id: ERR_CONDUCT_HOLD, http: 409, condition: "enrollment.conduct_hold is true: a board review is pending or rolling_points >= 10; credential, WBL, dormitory and completion writes are gated" }
  - { id: ERR_ZERO_TOLERANCE_BOARD_REQUIRED, http: 422, condition: "sanction attempted on a zero-tolerance incident (VIOLENCE, DRUGS, WEAPONS); only refer_board may proceed" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "applicant already has a non-terminal application (SUBMITTED, UNDER_REVIEW, INFO_REQUESTED)" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 422, condition: "required credential types not VERIFIED where the gate demands them (enrollment without remediation support, begin_training, complete)" }
  - { id: ERR_NO_ELIGIBLE_CENTER, http: 422, condition: "center_assignment_ranking produced an empty candidate pool" }
  - { id: ERR_BED_OVERLAP, http: 409, condition: "requested bed_label is occupied over a colliding half-open interval [move_in_date, move_out_date)" }
  - { id: ERR_TRANSITION_WINDOW_EXPIRED, http: 422, condition: "service recorded after the transition plan's expires_at (or the plan is EXPIRED)" }
  - { id: ERR_APPLICANT_NOT_ELIGIBLE, http: 409, condition: "center assignment without an ELIGIBLE application, or enrollment without assignment_status == ASSIGNED" }
  - { id: ERR_CENTER_MISMATCH, http: 422, condition: "enrollment's trade program belongs to a center other than applicant.assigned_center_id" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "trade program status is FULL or CLOSED at enrollment create" }
  - { id: ERR_AGREEMENT_INACTIVE, http: 409, condition: "employer agreement is EXPIRED (clock outside [effective_start, effective_end]) at placement create/activate" }
  - { id: ERR_NO_BED_AVAILABLE, http: 422, condition: "auto-select requested but every bed label of the center is occupied" }
  - { id: ERR_WBL_SLOT_EXCEEDED, http: 422, condition: "activation would push the agreement's concurrent ACTIVE placements past slot_count" }
  - { id: ERR_SUPERVISION_OVERLOAD, http: 422, condition: "activation would push the supervisor's concurrent ACTIVE placements past MAX_SUPERVISION_ACTIVE(3)" }
  - { id: ERR_WAGE_BELOW_FLOOR, http: 422, condition: "hourly_wage_cents below the agreement's hourly_wage_floor_cents" }
  - { id: ERR_PERIOD_NOT_CLOSABLE, http: 409, condition: "close-period when the clock date is not past current_period_start, or the contract is TERMINATED" }

# §1.7 RBAC Matrix — all roles are opaque operator identities; X-User-ID is an
# operator string not tied to any persisted entity. Segregation of duties: the
# admissions counselor who intakes an application may not review it.
roles:
  - name: AdmissionsCounselor
    description: "Front-door intake: applicants, applications, info responses, appeals, center assignment"
    identity: opaque
    exclusive_operations: ["POST /jc/applicants", "POST /jc/applications", "POST /jc/applicants/{id}/center-assignment"]
    shared_operations: ["GET /jc/applicants", "GET /jc/applicants/{id}", "GET /jc/applicants/{id}/applications", "POST /jc/applications/{id}/transition (provide_info, appeal)", "GET /jc/centers/{id}", "GET /jc/centers/{id}/trade-programs", "GET /jc/enrollments/{id}"]
  - name: EligibilityReviewer
    description: "Independent eligibility adjudication; must not be the intake counselor on the same case"
    identity: opaque
    exclusive_operations: ["POST /jc/applications/{id}/transition (begin_review, request_info, determine)"]
    shared_operations: ["GET /jc/applicants/{id}", "GET /jc/applicants/{id}/applications", "GET /jc/enrollments/{id}"]
  - name: EnrollmentManager
    description: "Program enrollment, training-axis transitions, completion and separation"
    identity: opaque
    exclusive_operations: ["POST /jc/enrollments", "POST /jc/enrollments/{id}/transition"]
    shared_operations: ["GET /jc/enrollments", "GET /jc/enrollments/{id}", "GET /jc/enrollments/{id}/dormitory-assignments", "GET /jc/enrollments/{id}/conduct-incidents", "GET /jc/enrollments/{id}/credentials", "GET /jc/enrollments/{id}/wbl-placements", "GET /jc/enrollments/{id}/transition-plan", "GET /jc/centers/{id}", "GET /jc/centers/{id}/trade-programs", "GET /jc/applicants/{id}"]
  - name: ResidentialAdvisor
    description: "Dormitory assignment, checkout, conduct reporting and adjudication"
    identity: opaque
    exclusive_operations: ["POST /jc/dormitory-assignments", "POST /jc/dormitory-assignments/{id}/checkout", "POST /jc/conduct-incidents", "POST /jc/conduct-incidents/{id}/transition"]
    shared_operations: ["GET /jc/enrollments/{id}", "GET /jc/enrollments/{id}/dormitory-assignments", "GET /jc/enrollments/{id}/conduct-incidents", "GET /jc/centers/{id}"]
  - name: CareerInstructor
    description: "Credential recording and verification"
    identity: opaque
    exclusive_operations: ["POST /jc/credentials", "POST /jc/credentials/{id}/transition"]
    shared_operations: ["GET /jc/enrollments/{id}", "GET /jc/enrollments/{id}/credentials"]
  - name: TransitionSpecialist
    description: "Work-based learning placements, hours, completion, and post-separation services"
    identity: opaque
    exclusive_operations: ["POST /jc/wbl-placements", "POST /jc/wbl-placements/{id}/transition", "POST /jc/transition-plans/{id}/services"]
    shared_operations: ["GET /jc/enrollments", "GET /jc/enrollments/{id}", "GET /jc/enrollments/{id}/wbl-placements", "GET /jc/enrollments/{id}/transition-plan", "GET /jc/employer-agreements/{id}", "GET /jc/employer-agreements/{id}/wbl-placements", "GET /jc/applicants/{id}"]
  - name: OperatorAdmin
    description: "Center/program configuration, employer agreements, operator contracts, performance review, logical clock"
    identity: opaque
    exclusive_operations: ["POST /jc/centers", "POST /jc/trade-programs", "PATCH /jc/trade-programs/{id}", "POST /jc/employer-agreements", "POST /jc/operator-contracts", "POST /jc/operator-contracts/{id}/transition", "POST /jc/operator-contracts/{id}/close-period", "POST /_clock/set_current_utc"]
    shared_operations: ["GET /jc/centers/{id}", "GET /jc/centers/{id}/trade-programs", "GET /jc/centers/{id}/operator-contracts", "GET /jc/operator-contracts/{id}", "GET /jc/operator-contracts/{id}/performance-preview", "GET /jc/operator-contracts/{id}/performance-snapshots", "GET /jc/employer-agreements/{id}", "GET /jc/employer-agreements/{id}/wbl-placements", "GET /jc/enrollments", "GET /jc/enrollments/{id}", "GET /jc/applicants/{id}", "GET /jc/applicants/{id}/applications"]
