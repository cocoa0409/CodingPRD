      - name: attribution_variant_is_selected_by_tier_and_balance
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: usage_attribution_isolated_then_inclusive_on_identical_window
          rationale: >-
            The variant-selection claim — the same window shape charging differently depending
            on tier and on whether burst_credit_balance still covers burst_calls, with the
            switch happening mid-stream on one assignment — is that dual_variant_calc instance's
            entire subject, including the divergent monthly ratio it produces.

      - name: trust_variants_diverge_on_identical_stored_data
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: trust_score_snapshot_vs_audited_diverge_on_pending_case
          rationale: >-
            The divergence claim for developer_trust_score (onboarding_snapshot ignoring pending
            case exposure while enforcement_audit charges 50% of it and penalises throttling) is
            driven by that dual_variant_calc instance, which also pins the delta between the two
            stored fields.

      - name: provisioning_propagates_its_clamps_in_the_pinned_order
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: quota_provisioning_three_factor_nested_clamp
          rationale: >-
            The constraint-propagation claim — scope factor, trust band and tier base folded
            into a floored sustained rate, then clamped by the pool, with burst derived from the
            clamped value and the allowance settled by a separate three-way min — is exactly
            that combinatorial_formula instance.

      - name: sla_credit_rounding_order_is_pinned
        claim_type: Precision
        excluded_because:
          difficulty_instance: sla_credit_rounded_per_assignment_then_summed
          rationale: >-
            The rounding-order claim for sla_service_credit (round each assignment's credit
            before summing, so the total differs from rounding the summed raw products) is that
            combinatorial_formula instance's whole point; this section's Precision instance
            instead pins the 2-decimal round_half_up in feedback scoring.

  - section: validations
    instances:
      - name: justification_one_character_short_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.priority_25_justification_insufficient
          - calculations.JUSTIFICATION_MIN_CHARS.PARTNER
          - errors.ERR_JUSTIFICATION_INSUFFICIENT
        distinguishing_aspect: >-
          The minimum is tier-dependent and is checked at submit, not at creation, so a DRAFT
          carrying a 119-character justification is stored happily and only the submit is
          refused with 422 — leaving the row in DRAFT so the developer can fix it. The same
          119 characters would have satisfied the STANDARD minimum of 40, which is why the
          error must be driven by the requested tier and not by a fixed length.
        test_recipe:
          setup:
            - "product P1 has a GA version 1.0.0; developer D1 has acknowledged docs 2 / terms 1"
            - "D1 drafts a PARTNER application whose justification_text is 119 characters, one short of the PARTNER minimum of 120"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications"
              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "PARTNER", requested_scopes: ["catalog.read"], requested_monthly_calls: 500000, justification_text: "Partner tier is required for our nightly settlement reconciliation runs across twelve regulated market venues in Europe" }
              as: Developer
