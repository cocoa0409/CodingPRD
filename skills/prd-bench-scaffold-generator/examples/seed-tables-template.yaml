# =============================================================================
# PRD Benchmark Seed Tables Template
#
# Fill in these 7 tables to derive a complete benchmark:
#   PRD → types → api-client → tests → reference implementation
#
# Usage:
#   1. Describe your scenario (scenario field)
#   2. Fill in or have AI generate the 7 seed tables
#   3. Use the prd-bench-generator skill to produce downstream artifacts
# =============================================================================

scenario: |
  [Describe your business scenario in 1-3 sentences]
  Example: A hospital shift scheduling system that manages treatment plans,
  rotations, procedures, and medical resource allocation, with budget control,
  patient safety scoring, equipment sterilization, and infection risk tracking.

domain_name: ""          # e.g.: hospital-shifts, restaurant-orders
api_prefix: ""           # e.g.: /treatment-plans, /restaurants

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ""
    parent: null           # null = top-level resource; otherwise parent entity name
    common_fields: true    # auto-include id, created_at, updated_at, version
    fields:
      - name: ""
        type: ""           # string | number | integer | boolean | enum | datetime | array
        source: input       # input = client-provided | computed = system-calculated | system = system-generated
        required: true
        description: ""
        default: null       # optional default value
        constraints: ""     # optional constraint description

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ""
    initial_state: ""
    terminal_states: []
    transitions:
      - from: ""
        to: ""
        trigger: ""         # API operation that triggers this transition
        actor: ""           # role name
        preconditions: []   # list of preconditions
        side_effects: []    # cascading state changes, calculations triggered, etc.

# =============================================================================
# Concurrency Rules (optional — define only if race-condition behavior matters)
# =============================================================================
# concurrency_rules:
#   - scenario: "Two users simultaneously create the same child resource"
#     guarantee: "At most one succeeds; second rejected"
#     error_id: ERR_DUPLICATE_CHILD
#     http_status: 409
#   - scenario: "Approve and reject happen simultaneously"
#     guarantee: "Exactly one wins; loser gets ERR_INVALID_STATE"
#     serialization: "First-writer-wins on entity status"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ""
    description: ""
    trigger: ""             # when this calculation runs
    inputs: []              # required inputs for the calculation
    algorithm: ""           # forward_looking | chronological | aggregation | threshold
    formula: |
      [pseudocode or mathematical formula]
    constants:              # numerical constants
      THRESHOLD: 0
      MULTIPLIER: 1
    precision: "2 decimal places, round_half_up"
    variants:               # variants of the same calculation (key difficulty source)
      - name: ""
        when: ""
        difference: ""

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth          # auth | existence | state | business_safety | business_fiscal
    check: ""
    error_id: ""
    http_status: 400
    applies_to: "all"       # all | [endpoint list]
    description: ""

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: ""
    description: ""
    authorized_roles: []
    success_code: 201
    request_body:
      - field: ""
        type: ""
        required: true
    response: ""            # returned entity name
    side_effects: []        # triggered calculations or state changes

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ""
    http_status: 400
    condition: ""           # trigger condition
    applies_to: []          # applicable endpoints

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ""
    description: ""
    identity: ""              # "entity_backed:<EntityName>" | "opaque" (mandatory, see SKILL.md §1.7)
    exclusive_operations: []  # operations exclusive to this role
    shared_operations: []     # operations shared with other roles

# =============================================================================
# Version Progression Design (optional)
# =============================================================================
versions:
  v1:
    type: greenfield
    scope: ""
  v2:
    type: brownfield
    additions: []
    constraint: "must pass all v1 tests"
  v3:
    type: brownfield
    additions: []
    constraint: "must pass all v1 + v2 tests"
