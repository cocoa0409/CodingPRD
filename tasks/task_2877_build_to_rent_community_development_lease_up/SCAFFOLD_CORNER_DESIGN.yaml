              payload: { community_id: "${cb}", predecessor_phase_id: "${ph_a}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-09-03T00:00:00Z", construction_window_end: "2026-12-01T00:00:00Z" }
