      - name: transfer_execution_needs_an_appraisal_then_hits_the_pool_before_the_share
        claim_type: Violation → Error
        grounds:
          - validations[priority=64]
          - validations[priority=65]
          - validations[priority=66]
          - calculations.estate_valuation_rollup
        distinguishing_aspect: |
          A TRANSFER EXECUTE with no ValuationRun at all is ERR_VALUATION_REQUIRED; once a run exists a
          transfer that fits the pool but overshoots the named beneficiary's planned share is
          ERR_BENEFICIARY_ALLOCATION_EXCEEDED; and after an ALTERNATE run shrinks the gross below the
          already-distributed amount the remaining asset's appraisal exceeds
