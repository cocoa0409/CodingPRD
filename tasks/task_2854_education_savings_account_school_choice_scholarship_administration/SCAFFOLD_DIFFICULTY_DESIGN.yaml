  - rule_id: transitive_cascade
    instances:
      - name: substantiation_suspends_account_voids_requests_and_releases_encumbrances
        grounds:
          - state_machines.MisuseCase.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - "state_machines.PurchaseRequest.APPROVAL:APPROVED_to_APPROVAL:VOID"
          - entities.Account.fields.encumbered_cents
          - entities.PurchaseRequest.fields.settlement_status
          - endpoints["POST /esa/misuse-cases/{id}/adjudication"].side_effects
        distinguishing_aspect: |
          Depth-4 chain from a single write: adjudication SUBSTANTIATED (1) suspends the Account
          with suspension_reason MISUSE_SUBSTANTIATED, (2) voids every open PurchaseRequest on
          that account across both approval and settlement dimensions, (3) releases each voided
          request's encumbrance, and (4) restores balance_cents to the pre-encumbrance 229088 -
          none of which the caller names, and each hop is observable on a different entity.
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is ACTIVE with current_quarter 1; Account ACCT1 (final_award_cents 932663) has balance_cents 229088 after the quarter-1 run."
            - "ExpenseCategory TUTORING (per_year_cap_cents 200000, requires_preapproval true, requires_service_period true) exists; Provider P1 is APPROVED for [TUTORING]."
            - "PurchaseRequest PR1 (PREAPPROVAL, 150000, service window 2026-10-01 -> 2026-11-01) was APPROVED by er-1, so ACCT1 shows balance_cents 79088 and encumbered_cents 150000."
            - "PurchaseRequest PR2 (PREAPPROVAL, 40000, service window 2026-11-02 -> 2026-12-01) is still PENDING_REVIEW and encumbers nothing."
            - "MisuseCase MC1 naming PR1 (detection_rule DUPLICATE_INVOICE, disallowed_principal_cents 150000) is UNDER_REVIEW."
