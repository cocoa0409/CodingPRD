          - "entities.BondedPeriodReport.fields.period_start"
        distinguishing_aspect: "Half-open period arithmetic: [2028-01-01, 2028-07-01) overlaps [2028-06-01, 2029-01-01) and is rejected, while [2028-07-01, 2029-01-01) merely touches the first period's end and is accepted."
        test_recipe:
          setup: ["Report R1 created for [2028-01-01, 2028-07-01). No rickhouse needed."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2028-01-01T00:00:00Z", period_end: "2028-07-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep1: $.data.id }
          trigger:
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2028-06-01T00:00:00Z", period_end: "2029-01-01T00:00:00Z" }
              as: BondedPreparer
              captures: { err_id: $.data.error_id }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2028-07-01T00:00:00Z", period_end: "2029-01-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep3: $.data.id }
          assert:
            - "err_id == ERR_REPORT_PERIOD_OVERLAP (interior overlap with R1)"
            - "the adjacent report is created (201): period_start == R1.period_end is allowed"
            - "BondedPeriodReport.${rep3}.state == OPEN"

