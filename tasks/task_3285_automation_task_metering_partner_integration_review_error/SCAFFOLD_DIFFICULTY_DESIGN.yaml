scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: dv_overage_base_vs_maximum_variant
    grounds:
    - calculations.overage_amount
    - entities.TeamAccount.fields.overage_amount_cents
    - entities.TeamAccount.fields.projected_overage_amount_cents
    distinguishing_aspect: 'For identical inputs (allowance 1, closer cost 1 USD, opening cost 3 USD, one 8-task POLLING charge) the two overage variants diverge onto two different subjects: the base variant returns 1100 cents on current-epoch cost accounting while the maximum variant returns 2500 cents on all-epoch maximum exposure, because the maximum variant re-charges every task at max(1, 3) = 3 USD/task.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 1, closer_cost_per_task_cents 1, opening_cost_per_task_cents 3, overage_enabled true
      - one activated POLLING workflow with one action
      setup_api_calls:
      - call: POST /zapier/accounts
        payload:
          name: Dv1A
          plan_code: TEAM_PRO
          task_allowance: 1
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 3
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      - call: GET /zapier/accounts/${acct_id}/usage
        as: Member
        as_user_id: ${mem_id}
        captures:
          usage: $.data
      assert:
      - 'GET /accounts/${acct_id} overage_amount_cents == 1100   # base variant: 100*7 + 50*8'
      - 'usage.projected_overage_amount_cents == 2500   # maximum variant: 300*7 + 50*8'
  - name: dv_metering_factor_polling_vs_instant_webhook
    grounds:
    - calculations.metering_factor
    - calculations.charge_task
    - entities.Workflow.fields.trigger_type
    distinguishing_aspect: 'A second dual-variant pair on a different subject, trigger-type metering: one POLLING action and one INSTANT_WEBHOOK action on the same account charge different task quantities for identical single-attempt executions (8 versus 1 whole tasks), because ceil(4 * 2) != ceil(0.25 * 1).'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 100, closer and opening cost 1, overage_enabled true
      - one activated POLLING workflow and one activated INSTANT_WEBHOOK workflow, each with one action
      setup_api_calls:
