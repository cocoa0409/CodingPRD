      - name: endpoint_create_partner_org_missing_contact_email_rejected
        claim_type: standard_crud
        grounds: ["endpoints[POST /partner-orgs]", "errors[ERR_VALIDATION]", "validations[priority=17]"]
        distinguishing_aspect: "contact_email is declared required, so omitting it is 422 ERR_VALIDATION even though every other field is present and the derived capacity_class would have been computable: no PartnerOrg row and therefore no capacity derivation may occur."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "GET /project-requests as ProgramManager returns total_count == 0, and no partner id was minted to be referenced"
      - name: endpoint_create_partner_org_wrong_type_budget_rejected
        claim_type: standard_crud
        grounds: ["endpoints[POST /partner-orgs]", "errors[ERR_VALIDATION]", calculations.partner_capacity_class]
        distinguishing_aspect: "annual_budget_usd is the sole input to partner_capacity_class, so a string \"3000000\" must be rejected rather than coerced: the classifier is never allowed to run on a non-numeric input, and the answer is 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: "3000000"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "no PartnerOrg is created, so capacity_class is never assigned MID by coercion"
      - name: endpoint_create_partner_org_unknown_sector_enum_rejected
        claim_type: standard_crud
        grounds: ["endpoints[POST /partner-orgs]", "errors[ERR_VALIDATION]", entities.PartnerOrg.sector]
        distinguishing_aspect: "sector is enum-bounded, so KNITTING is refused with 422 ERR_VALIDATION rather than stored as a free-text label; the identical body with sector EDUCATION returns 201, isolating the enum as the single cause."
        test_recipe:
          setup: ["Empty system."]
          setup_api_calls:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: KNITTING, annual_budget_usd: 3000000.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "the same body with sector EDUCATION returns HTTP 201 with capacity_class == \"MID\" and max_concurrent_engagements == 4"
      - name: endpoint_get_partner_org_unknown_id_returns_not_found
        claim_type: standard_crud
        grounds: ["endpoints[GET /partner-orgs/{id}]", "errors[ERR_PARTNER_ORG_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A read of a nonexistent id is a 404 with the typed ERR_PARTNER_ORG_NOT_FOUND envelope, not an empty 200 body: the same call against the real id is 200, so absence and emptiness are distinguishable."
        test_recipe:
          setup: ["One real partner org that is not the id being probed."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          trigger:
            - {call: "GET /partner-orgs/org-nope", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PARTNER_ORG_NOT_FOUND\""
            - "GET /partner-orgs/${partner_id} returns HTTP 200 with status == \"ACTIVE\""
            - "GET /partner-orgs/org-nope/summary is likewise HTTP 404 with ERR_PARTNER_ORG_NOT_FOUND"
      - name: endpoint_partner_satisfaction_surveys_empty_collection
