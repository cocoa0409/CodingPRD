          - state_machines.Household.ACTIVE_to_FAULT_HOLD
          - calculations.quota_cell_fill
          - calculations.market_recruitment_posture
          - entities.QuotaCell.fields.incentive_boost_active
          - entities.Market.fields.incentive_budget_reserved_cents
          - entities.Market.fields.recruitment_posture
          - endpoints[POST /meters/{meter_id}/fault-reports]
        distinguishing_aspect: |
          Depth-5 chain from a single field visit, each link caused by the previous one and by nothing
          else: fault-report makes the meter FAULTED (link 1), which leaves the household with no
          HEALTHY installed tuner so it drops to FAULT_HOLD (link 2), which decrements the cell's
          intab_count (link 3), which flips the cell back to UNDER_TARGET and re-arms the 25 percent
          incentive boost so the market re-reserves 500 cents (link 4), which re-derives the market
          roll-ups and moves recruitment_posture from CLOSED to OPEN (link 5).
        test_recipe:
          setup:
            - "Market DMA-507 with incentive budget 1000000 cents and exactly one quota cell (target 1, base incentive 2000)."
            - "One household ACTIVE in that cell with a single INSTALLED HEALTHY TV_TUNER, so intab_count is 1, fill_rate is 1.0000, quota_status is FILLED, incentive_boost_active is false, incentive_budget_reserved_cents is 0 and recruitment_posture is CLOSED."
            - "Clock left at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Eta", market_code: "DMA-507", dma_rank: 7, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m7_id: "$.data.id" }
            - call: "POST /markets/${m7_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_h_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m7_id}", quota_cell_id: "${cell_h_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hg1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hg1_id}", meter_type: "TV_TUNER", serial_no: "MT-000601" }
              as: FieldTechnician
              captures: { mtg1_id: "$.data.id" }
            - call: "POST /meters/${mtg1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hg1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /markets/${m7_id}"
              payload: {}
              as: PanelOperationsManager
              captures: { posture_before: "$.data.recruitment_posture", reserved_before: "$.data.incentive_budget_reserved_cents" }
          trigger:
            - call: "POST /meters/${mtg1_id}/fault-reports"
              payload: { fault_code: "POWER_LOSS" }
              as: FieldTechnician
              captures: { health_after: "$.data.health_status" }
          assert:
            - "${posture_before} == CLOSED and ${reserved_before} == 0"
            - "Link 1: ${health_after} == FAULTED and Meter.${mtg1_id}.last_fault_code == POWER_LOSS and .fault_count == 1"
            - "Link 2: Household.${hg1_id}.status == FAULT_HOLD and .enumeration_verdict == COMPLIANT (the verdict is not rewritten by the fault)"
            - "Link 3: QuotaCell.${cell_h_id}.intab_count == 0 and .fill_rate == 0.0000"
            - "Link 4: QuotaCell.${cell_h_id}.quota_status == UNDER_TARGET and .incentive_boost_active == true and .effective_incentive_multiplier == 1.25"
            - "Link 4: Market.${m7_id}.incentive_budget_reserved_cents == 500 - 2000 * 0.25 * 1 target household"
            - "Link 5: Market.${m7_id}.filled_cell_count == 0 and .under_target_cell_count == 1 and .quota_cell_count == 1"
            - "Link 5: Market.${m7_id}.recruitment_posture == OPEN and .posture_changed_at == 2026-08-01T00:00:00Z"
            - "Meter.${mtg1_id}.install_status == INSTALLED - the fault cascade never removes the device"

      - name: methodology_activation_cascade_rule_set_run_deliverable_hold
        grounds:
          - state_machines.MethodologyChange.NOTIFIED_to_EFFECTIVE
          - state_machines.EditRuleSet.PUBLISHED_to_SUPERSEDED
          - state_machines.ProcessingRun.OPEN_to_PENDING_REPIN
          - state_machines.ClientDeliverable.SCHEDULED_to_HELD
          - entities.ProcessingRun.fields.repin_required_reason
          - entities.ClientDeliverable.fields.hold_reason
          - entities.Client.fields.held_deliverable_count
          - validations[priority=59]
        distinguishing_aspect: |
          Depth-4 chain from a completely different trigger than the fault cascade: activation
          publishes the proposed rule set and supersedes the target rule set (link 1), the
          supersession forces every non-terminal run pinned to that rule set to PENDING_REPIN with
          reason RULE_SET_SUPERSEDED (link 2), the re-pin forces that run's non-terminal deliverables
          to HELD with hold_reason UPSTREAM_RUN_REPIN (link 3) and each hold increments the owning
          client's held_deliverable_count (link 4) - while the already PUBLISHED baseline run is
          untouched because it is terminal.
        test_recipe:
          setup:
            - "Market DMA-508 with one quota cell, a published 2026Q3 universe of 120000 households and published rule set RS-2026Q3 (ascription 60, invalid-tuning 900, outlier cap 1200, weight ratio cap 2.5, fault threshold 1440)."
