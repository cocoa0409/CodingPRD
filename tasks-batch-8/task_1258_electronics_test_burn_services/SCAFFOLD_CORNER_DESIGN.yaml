          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE"
            - "Unit.${u1}.test_status remains UNTESTED"

      - name: test_engineer_cannot_decide_review_unauthorized
        claim_type: rbac_denial
        grounds:
          - roles
          - endpoints."POST /api/lot-disposition-reviews/{review_id}/decide"
