scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_animal_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Animal, endpoints]
        distinguishing_aspect: "POST /animals with all required fields returns 201 with a server-minted id, created_at, version==1, life_status==ACTIVE, meat_clearance_status==CLEAR, and latest_weight_kg seeded to birth_weight_kg."
        test_recipe:
          setup: ["Clock 2026-04-01; one CATTLE herd."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC1", species: "CATTLE", premises_id: "PRC-1" }
              as: HerdManager
              captures: { hc1: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hc1}", ear_tag: "Z001", sex: "FEMALE", birth_date: "2026-01-01", birth_weight_kg: 38.0 }
              as: HerdManager
              captures: { z1: $.data.id, v: $.data.version, lw: $.data.latest_weight_kg }
          assert:
            - "response.status == 201"
            - "Animal.${z1}.version == 1"
            - "Animal.${z1}.life_status == ACTIVE"
            - "Animal.${z1}.meat_clearance_status == CLEAR"
            - "Animal.${z1}.latest_weight_kg == 38.0"

      - name: get_animal_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Animal, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /animals/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no animals)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "GET /animals/00000000-0000-4000-8000-000000000999"
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_animal_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Animal.fields.birth_weight_kg, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /animals omitting birth_weight_kg (required, source input, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock 2026-04-01; one herd."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC2", species: "CATTLE", premises_id: "PRC-2" }
              as: HerdManager
              captures: { hc2: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hc2}", ear_tag: "Z010", sex: "STEER", birth_date: "2026-01-01" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_animal_invalid_enum_sex_returns_422
        claim_type: Type Constraints
        grounds: [entities.Animal.fields.sex, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /animals with sex outside {MALE,FEMALE,STEER} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Clock 2026-04-01; one herd."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC3", species: "CATTLE", premises_id: "PRC-3" }
              as: HerdManager
              captures: { hc3: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hc3}", ear_tag: "Z020", sex: "BULL", birth_date: "2026-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_ear_tag_within_herd_returns_409
        claim_type: Type Constraints
        grounds: [entities.Animal.fields.ear_tag, "validations[priority=7]", "errors[ERR_DUPLICATE_IDENTIFIER]"]
        distinguishing_aspect: "A second animal with the same ear_tag in the same herd returns ERR_DUPLICATE_IDENTIFIER (409)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd with one animal ear_tag Z030."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC4", species: "CATTLE", premises_id: "PRC-4" }
              as: HerdManager
              captures: { hc4: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hc4}", ear_tag: "Z030", sex: "STEER", birth_date: "2026-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hc4}", ear_tag: "Z030", sex: "STEER", birth_date: "2026-01-01", birth_weight_kg: 41.0 }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_IDENTIFIER"

      - name: animal_id_input_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Animal, response_envelope]
        distinguishing_aspect: "A client-supplied id/version/life_status in the POST /animals body is ignored; the server mints its own id and version==1 and life_status==ACTIVE."
        test_recipe:
          setup: ["Clock 2026-04-01; one herd."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC5", species: "CATTLE", premises_id: "PRC-5" }
              as: HerdManager
              captures: { hc5: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { herd_id: "${hc5}", ear_tag: "Z040", sex: "STEER", birth_date: "2026-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { z40: $.data.id, v: $.data.version }
          assert:
            - "Animal.${z40}.version == 1"
            - "Animal.${z40}.life_status == ACTIVE"

      - name: weight_record_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WeightRecord]
        distinguishing_aspect: "WeightRecord (common_fields:false) carries only id + created_at + its declared fields; it has no version field and no update endpoint exists."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + animal born 2026-01-01 at 38 kg."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HC6", species: "CATTLE", premises_id: "PRC-6" }
              as: HerdManager
              captures: { hc6: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hc6}", ear_tag: "Z050", sex: "STEER", birth_date: "2026-01-01", birth_weight_kg: 38.0 }
              as: HerdManager
              captures: { z50: $.data.id }
          trigger:
            - call: "POST /animals/${z50}/weights"
              payload: { weighed_at: "2026-03-01", weight_kg: 100.0 }
              as: HerdManager
              captures: { wr: $.data.id }
          assert:
            - "response.status == 201"
            - "WeightRecord.${wr}.weight_kg == 100.0"

  # =========================================================================
  - section: state_machines
    instances:
      - name: reinstate_active_animal_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Animal.SUSPENDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Driving life-status to ACTIVE on an already-ACTIVE animal (no SUSPENDED->ACTIVE precondition met) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + one ACTIVE animal."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HS1", species: "CATTLE", premises_id: "PRS-1" }
              as: HerdManager
              captures: { hs1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hs1}", ear_tag: "S001", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /animals/${s1}/life-status"
              payload: { to_status: "ACTIVE" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: sell_already_sold_lot_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SaleLot.OPEN_to_SOLD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling sell on a lot already in terminal SOLD returns ERR_INVALID_STATE (409); no second cascade fires."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + 500 kg animal; AUCTION lot with one ticket sold."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HS2", species: "CATTLE", premises_id: "PRS-2" }
              as: HerdManager
              captures: { hs2: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hs2}", ear_tag: "S010", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { s10: $.data.id }
            - call: "POST /animals/${s10}/weights"
              payload: { weighed_at: "2026-03-15", weight_kg: 500.0 }
              as: HerdManager
            - call: "POST /sale-lots"
              payload: { herd_id: "${hs2}", channel: "AUCTION", pencil_shrink_pct: 0, commission_pct: 0.05 }
              as: SaleClerk
              captures: { lotS: $.data.id, lotS_v0: $.data.version }
            - call: "POST /sale-lots/${lotS}/tickets"
              payload: { animal_id: "${s10}", gross_weight_kg: 500.0, expected_sale_lot_version: "${lotS_v0}" }
              as: SaleClerk
            - call: "POST /sale-lots/${lotS}/sell"
              as: SaleClerk
          trigger:
            - call: "POST /sale-lots/${lotS}/sell"
              as: SaleClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: confirm_pregnant_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BreedingRecord.BRED_to_CONFIRMED_PREGNANT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Transitioning a breeding record to CONFIRMED_PREGNANT while still OPEN (never BRED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + FEMALE dam; breeding record OPEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HS3", species: "CATTLE", premises_id: "PRS-3" }
              as: HerdManager
              captures: { hs3: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hs3}", ear_tag: "S020", sex: "FEMALE", birth_date: "2022-01-01", birth_weight_kg: 42.0 }
              as: HerdManager
              captures: { dam3: $.data.id }
            - call: "POST /breeding-records"
              payload: { dam_animal_id: "${dam3}", bred_on: "2026-02-01" }
              as: HerdManager
              captures: { br3: $.data.id }
          trigger:
            - call: "POST /breeding-records/${br3}/transition"
              payload: { to_status: "CONFIRMED_PREGNANT" }
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: revert_non_latest_movement_returns_not_latest
        claim_type: Invalid Transitions
        grounds: [state_machines.MovementRecord.APPLIED_to_REVERTED, "validations[priority=18]", "errors[ERR_NOT_LATEST_MOVEMENT]"]
        distinguishing_aspect: "Reverting an earlier APPLIED movement when a later APPLIED movement exists for the animal returns ERR_NOT_LATEST_MOVEMENT (409)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + 454 kg animal; two PENs; two movements applied in order A then B."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HS4", species: "CATTLE", premises_id: "PRS-4" }
              as: HerdManager
              captures: { hs4: $.data.id }
            - call: "POST /pastures"
              payload: { name: "PA4", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { pa4: $.data.id }
            - call: "POST /pastures"
              payload: { name: "PB4", kind: "PEN", capacity_au: 10 }
              as: HerdManager
              captures: { pb4: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hs4}", ear_tag: "S030", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { s30: $.data.id }
            - call: "POST /animals/${s30}/weights"
              payload: { weighed_at: "2026-03-20", weight_kg: 454.0 }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${s30}", to_pasture_id: "${pa4}", effective_from: "2026-03-21T00:00:00Z" }
              as: HerdManager
              captures: { mvA: $.data.id }
            - call: "GET /animals/${s30}"
              as: HerdManager
              captures: { s30_v1: $.data.version }
            - call: "POST /movement-records/${mvA}/apply"
              payload: { expected_animal_version: "${s30_v1}" }
              as: HerdManager
            - call: "POST /movement-records"
              payload: { animal_id: "${s30}", to_pasture_id: "${pb4}", effective_from: "2026-03-22T00:00:00Z" }
              as: HerdManager
              captures: { mvB: $.data.id }
            - call: "GET /animals/${s30}"
              as: HerdManager
              captures: { s30_v2: $.data.version }
            - call: "POST /movement-records/${mvB}/apply"
              payload: { expected_animal_version: "${s30_v2}" }
              as: HerdManager
          trigger:
            - call: "POST /movement-records/${mvA}/revert"
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NOT_LATEST_MOVEMENT"

      - name: cull_withheld_animal_returns_withdrawal_not_cleared
        claim_type: Precondition Enforcement
        grounds: [state_machines.Animal.ACTIVE_to_CULLED, "validations[priority=8]", "errors[ERR_WITHDRAWAL_NOT_CLEARED]"]
        distinguishing_aspect: "Culling an animal whose meat_clearance_status==WITHHELD returns ERR_WITHDRAWAL_NOT_CLEARED (409)."
        test_recipe:
          setup: ["Clock 2026-05-01; herd + animal treated IM 28d (WITHHELD to 2026-05-29)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HS5", species: "CATTLE", premises_id: "PRS-5" }
              as: HerdManager
              captures: { hs5: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hs5}", ear_tag: "S040", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { s40: $.data.id }
            - call: "POST /drug-products"
              payload: { name: "OxyS5", category: "ANTIBIOTIC", route_withdrawals: { INJECTION_IM: 28 } }
              as: Veterinarian
              captures: { drugS5: $.data.id }
            - call: "POST /health-treatments"
              payload: { animal_id: "${s40}", drug_product_id: "${drugS5}", route: "INJECTION_IM", first_dose_on: "2026-05-01", last_dose_on: "2026-05-01" }
              as: Veterinarian
          trigger:
            - call: "POST /animals/${s40}/life-status"
              payload: { to_status: "CULLED" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_WITHDRAWAL_NOT_CLEARED"

  # =========================================================================
  - section: calculations
    instances:
      - name: ration_waterfall_allocation_grower
        claim_type: Correct Result
        grounds: [calculations.ration_waterfall_allocation, endpoints]
        distinguishing_aspect: "GROWER ration target_dmi 10.0 with CORN_SILAGE(.35,.50)/ALFALFA(.88,.30)/GRAIN(.90 filler) yields as_fed 14.286 / 3.409 / 2.222 and total_as_fed_kg 19.917 (filler absorbs the 2.0 dm remainder)."
        test_recipe:
          setup: ["Clock 2026-04-01; one GROWER ration."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FeedlotOperator
            - call: "POST /feed-rations"
              payload: { name: "GROWER", target_dmi_kg: 10.0, ingredients: [ { feedstuff: "CORN_SILAGE", dry_matter_pct: 0.35, max_inclusion_pct: 0.50, cost_per_kg_as_fed: 0.05 }, { feedstuff: "ALFALFA_HAY", dry_matter_pct: 0.88, max_inclusion_pct: 0.30, cost_per_kg_as_fed: 0.18 }, { feedstuff: "GRAIN_MIX", dry_matter_pct: 0.90, max_inclusion_pct: 1.00, cost_per_kg_as_fed: 0.22 } ] }
              as: FeedlotOperator
              captures: { ration1: $.data.id }
          trigger:
            - call: "GET /feed-rations/${ration1}/computed-ration"
              as: FeedlotOperator
              captures: { total: $.data.total_as_fed_kg }
          assert:
            - "computed_ration.total_as_fed_kg == 19.917"

      - name: withdrawal_clearance_oral_route_case
        claim_type: Correct Result
        grounds: [calculations.withdrawal_clearance_date, entities.HealthTreatment.fields.clearance_date]
        distinguishing_aspect: "An ORAL treatment of a drug whose route_withdrawals[ORAL]==14 administered 2026-05-01 sets clearance_date 2026-05-15 (distinct route case from the IM-28d covered in §1.8)."
        test_recipe:
          setup: ["Clock 2026-05-01; herd + animal; drug with ORAL=14, INJECTION_IM=28."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HK1", species: "CATTLE", premises_id: "PRK-1" }
              as: HerdManager
              captures: { hk1: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hk1}", ear_tag: "K100", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { k100: $.data.id }
            - call: "POST /drug-products"
              payload: { name: "OralWormer", category: "ANTIPARASITIC", route_withdrawals: { ORAL: 14, INJECTION_IM: 28 } }
              as: Veterinarian
              captures: { drugK1: $.data.id }
          trigger:
            - call: "POST /health-treatments"
              payload: { animal_id: "${k100}", drug_product_id: "${drugK1}", route: "ORAL", first_dose_on: "2026-05-01", last_dose_on: "2026-05-01" }
              as: Veterinarian
              captures: { ht: $.data.id, cd: $.data.clearance_date }
          assert:
            - "HealthTreatment.${ht}.clearance_date == 2026-05-15"
            - "HealthTreatment.${ht}.status == WITHDRAWAL_ACTIVE"

      - name: withdrawal_multi_dose_counts_from_last_dose
        claim_type: Correct Result
        grounds: [calculations.withdrawal_clearance_date]
        distinguishing_aspect: "A 2-dose IM(28d) course first_dose 2026-05-01 last_dose 2026-05-10 sets clearance_date 2026-06-07 (counts from last_dose_on, not first_dose_on)."
        test_recipe:
          setup: ["Clock 2026-05-10; herd + animal; drug IM=28."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HK2", species: "CATTLE", premises_id: "PRK-2" }
              as: HerdManager
              captures: { hk2: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hk2}", ear_tag: "K200", sex: "STEER", birth_date: "2024-01-01", birth_weight_kg: 40.0 }
              as: HerdManager
              captures: { k200: $.data.id }
            - call: "POST /drug-products"
              payload: { name: "OxyK2", category: "ANTIBIOTIC", route_withdrawals: { INJECTION_IM: 28 } }
              as: Veterinarian
              captures: { drugK2: $.data.id }
          trigger:
            - call: "POST /health-treatments"
              payload: { animal_id: "${k200}", drug_product_id: "${drugK2}", route: "INJECTION_IM", dose_count: 2, first_dose_on: "2026-05-01", last_dose_on: "2026-05-10" }
              as: Veterinarian
              captures: { ht: $.data.id, cd: $.data.clearance_date }
          assert:
            - "HealthTreatment.${ht}.clearance_date == 2026-06-07"

      - name: expected_calving_goat_gestation
        claim_type: Constants Applied
        grounds: [calculations.expected_calving_date, entities.BreedingRecord.fields.expected_calving_on]
        distinguishing_aspect: "A GOAT herd breeding serviced 2026-02-01 sets expected_calving_on 2026-07-01 (150-day gestation), distinct from the 283-day CATTLE case."
        test_recipe:
          setup: ["Clock 2026-04-01; GOAT herd + FEMALE dam; breeding record OPEN->BRED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "HK3", species: "GOAT", premises_id: "PRK-3" }
              as: HerdManager
              captures: { hk3: $.data.id }
            - call: "POST /animals"
              payload: { herd_id: "${hk3}", ear_tag: "K300", sex: "FEMALE", birth_date: "2023-01-01", birth_weight_kg: 4.0 }
