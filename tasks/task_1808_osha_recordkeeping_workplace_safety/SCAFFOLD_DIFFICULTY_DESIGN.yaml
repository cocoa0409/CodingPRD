              as: SafetyOfficer
            - call: "POST /safety/cases/${case_a}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-02-16", end_date: "2026-09-04" }
              as: SafetyOfficer
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
