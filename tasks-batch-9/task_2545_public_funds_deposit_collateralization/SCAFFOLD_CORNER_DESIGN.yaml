            - "CUSTODIAN signature: 200, signature_count == 2, custodian_signed_at == 2026-08-01T00:00:00Z, status still 'PENDING_SIGNATURES'"
            - "PUBLIC_UNIT signature (third and last): 200, signature_count == 3, status 'EXECUTED', executed_at == 2026-08-01T00:00:00Z — parties may sign in any order and the join fires only on the third distinct party"

