  - rule_id: resource_temporal_overlap
    instances:

      - name: daypart_slot_half_open_adjacency_allowed_but_straddle_rejected
        grounds:
          - validations.priority_21_ERR_DAYPART_SLOT_OVERLAP
          - calculations.daypart_resolution
          - concurrency_rules.daypart-slot-append-stale-bundle
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) minute-of-day windows on ContentBundle
          daypart slots. Because the end minute is exclusive, DINNER starting exactly at
          LUNCH's end minute 960 is NOT an overlap and must be accepted; a slot that straddles
          960 (SNACK [900, 1000)) must be rejected. Each append also carries the bundle OCC
          token, so the version must be re-read between appends.
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; one DRAFT ContentBundle for CL_WEST."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, ver0: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${ver0}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "GET /kiosk-ops/content-bundles/${bundle_id}"
              payload: {}
              as: ContentManager
              captures: { ver1: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${ver1}", daypart_code: "DINNER", start_minute_of_day: 960, end_minute_of_day: 1320, layout_code: "DINNER_GRID", buffer_minutes: 20, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { after_dinner_ver: $.data.version }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${after_dinner_ver}", daypart_code: "SNACK", start_minute_of_day: 900, end_minute_of_day: 1000, layout_code: "SNACK_GRID", buffer_minutes: 10, category_codes: ["SIDE"] }
              as: ContentManager
              captures: { err: $.data.error_id }
            - call: "GET /kiosk-ops/content-bundles/${bundle_id}"
              payload: {}
              as: ContentManager
              captures: { final_ver: $.data.version }
          assert:
            - "the DINNER append returns HTTP 200 or 201 — touching at minute 960 is legal because containment is half-open [660, 960)"
            - "the SNACK append returns HTTP 409 with error_id == ERR_DAYPART_SLOT_OVERLAP (it intersects LUNCH on [900, 960) and DINNER on [960, 1000))"
            - "${final_ver} == ${after_dinner_ver}: the rejected append did not bump the bundle version"
            - "ContentBundle.${bundle_id}.daypart_slots has exactly 2 entries, LUNCH and DINNER, and state is still DRAFT"

