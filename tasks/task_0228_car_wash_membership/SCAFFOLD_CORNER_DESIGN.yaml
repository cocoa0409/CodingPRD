              payload: { account_type: "INDIVIDUAL", contact_email: "ret@x.com" }
              as: AccountHolder
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "RET001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh: "$.data.id" }
          trigger:
            - call: "POST /memberships"
              payload: { account_id: "${acct}", vehicle_id: "${veh}", plan_id: "${plan_u}" }
