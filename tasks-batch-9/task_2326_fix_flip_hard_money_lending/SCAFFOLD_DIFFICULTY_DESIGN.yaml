      - name: scope_line_deapproval_reverses_the_budget_then_resizing_reprices_upward
        grounds:
          - state_machines.RehabLineItem.APPROVED_to_REVISION_REQUESTED
          - state_machines.RehabLineItem.REVISION_REQUESTED_to_PROPOSED
          - entities.LoanApplication.fields.approved_rehab_total_cents
          - entities.LoanApplication.fields.sizing_stale
          - calculations.loan_sizing_max
          - errors[ERR_SIZING_STALE]
        distinguishing_aspect: |
          The compensating de-approval of an APPROVED line must run its original side effect
          backwards: approved_rehab_total_cents falls 10,000,000 -> 6,500,000, approved_cost_cents
          returns to null while cost_cents is untouched, revision_round increments (it is never
          reset by the round trip), and sizing_stale latches true so the committee is blocked.
          The re-size then proves the reversal reached the calculation: less rehab holdback
          means a LARGER initial advance, 14,137,500 versus the original 13,195,000.
        test_recipe:
          setup:
            - "TIER_A sponsor b1; application a1 with three APPROVED lines 4,000,000 / 3,500,000 / 2,500,000"
            - "a1 has been sized once: sized_initial_advance 13,195,000, reserve 758,713, committed 23,953,713, sizing_stale false"
