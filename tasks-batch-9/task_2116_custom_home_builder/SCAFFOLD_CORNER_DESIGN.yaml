scaffold_corner_design:

  # =========================================================================
  # Section 1 - Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_201_with_computed_ledger_defaults
        claim_type: creation
        grounds:
          - entities.Project.fields.contract_sum_current
          - entities.Project.fields.budget_posture
          - endpoints[POST /projects]
        distinguishing_aspect: "A freshly created Project is PLANNING with contract_sum_current 900000.00, budget_posture WITHIN_BUDGET, every money aggregate 0.00 and version 1."
        test_recipe:
          setup:
            - "One Client exists; no project exists yet."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Project.${proj_id}.status == PLANNING"
            - "Project.${proj_id}.budget_posture == WITHIN_BUDGET"
            - "Project.${proj_id}.contract_sum_current == 900000.00"
            - "Project.${proj_id}.approved_change_order_total == 0.00"
            - "Project.${proj_id}.allowance_variance_total == 0.00"
            - "Project.${proj_id}.cost_to_date == 0.00"
            - "Project.${proj_id}.eligible_cost_pool == 0.00"
            - "Project.${proj_id}.pending_draw_amount == 0.00"
            - "Project.${proj_id}.funded_to_date == 0.00"
            - "Project.${proj_id}.retainage_held == 0.00"
            - "Project.${proj_id}.version == 1"
            - "Project.${proj_id}.id is a bare UUID with no type prefix"

      - name: get_project_with_unknown_id_returns_project_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but unknown project id returns 404 ERR_PROJECT_NOT_FOUND, not 200 with an empty body."
        test_recipe:
          setup:
            - "One Client and one Project exist, so the collection is non-empty."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: list_projects_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /projects]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three projects for one client, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One Client owns exactly three projects."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "24 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 700000.00, target_substantial_completion_date: "2027-08-31T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "31 Kestrel Ridge", contract_type: "COST_PLUS", base_contract_amount: 600000.00, builder_fee_pct: 0.15, target_substantial_completion_date: "2027-09-30T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /projects"
              payload: { client_id: "${client_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /projects"
              payload: { client_id: "${client_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "the first call returns exactly 2 rows with total_count == 3 and has_more == true"
            - "the second call returns exactly 1 row with total_count == 3 and has_more == false"
            - "response_type == \"array\" on both calls"

      - name: create_allowance_item_without_allowance_amount_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
          - entities.AllowanceItem.fields.allowance_amount
        distinguishing_aspect: "Omitting the required allowance_amount on POST /allowance-items returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "One Project in PLANNING and one PROJECT_MANAGER staff member exist."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /allowance-items with project_id == ${proj_id} returns total_count == 0"

      - name: create_subcontractor_omitting_waiver_required_applies_default_true
        claim_type: defaults
        grounds:
          - entities.Subcontractor.fields.waiver_required
          - endpoints[POST /subcontractors]
        distinguishing_aspect: "waiver_required is absent from the request and the stored row reads true, the declared default."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1 }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Subcontractor.${sub_id}.waiver_required == true"
            - "Subcontractor.${sub_id}.crew_capacity == 1"

      - name: create_selection_computes_selection_total_from_three_inputs
        claim_type: computed_fields
        grounds:
          - entities.Selection.fields.selection_total
          - calculations.allowance_variance
          - endpoints[POST /selections]
        distinguishing_aspect: "selection_total is computed as 21000.00 + 1500.00 + 1500.00 == 24000.00 from vendor_quote_amount, freight_amount and install_amount."
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with an OPEN CABINETRY allowance item of 25000.00."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "CABINETRY", allowance_amount: 25000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ai_id: $.data.id, ai_v: $.data.version }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /selections"
              payload: { allowance_item_id: "${ai_id}", vendor_name: "Northwood Millwork", vendor_quote_amount: 21000.00, freight_amount: 1500.00, install_amount: 1500.00, lead_time_days: 20, expected_allowance_item_version: "${ai_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sel_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Selection.${sel_id}.selection_total == 24000.00"
            - "Selection.${sel_id}.status == PROPOSED"
            - "AllowanceItem.${ai_id}.status == OPEN"
            - "AllowanceItem.${ai_id}.provisional_variance_amount == 0"

      - name: create_project_with_client_supplied_status_and_version_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Project.fields.status
          - entities.Project.fields.contract_sum_current
        distinguishing_aspect: "status, version and contract_sum_current are server-owned: supplying them in the create body leaves the stored row at PLANNING, version 1 and contract_sum_current 900000.00."
        test_recipe:
          setup:
            - "One Client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z", status: "FINAL_ACCEPTED", version: 77, contract_sum_current: 1.00 }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.status == PLANNING"
            - "Project.${proj_id}.version == 1"
            - "Project.${proj_id}.contract_sum_current == 900000.00"

      - name: create_defect_ticket_with_unknown_severity_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
          - entities.DefectTicket.fields.severity
        distinguishing_aspect: "severity is a closed enum; the value URGENT is not a declared member and the request is refused with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One Project in PLANNING exists with a PROJECT_MANAGER staff member."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /defect-tickets"
              payload: { project_id: "${proj_id}", phase: "PUNCH", room: "Foyer", description: "Scuffed trim", severity: "URGENT", category: "WORKMANSHIP" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /defect-tickets with project_id == ${proj_id} returns total_count == 0"

      - name: create_allowance_item_under_unknown_project_returns_project_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=60]
          - errors[ERR_PROJECT_NOT_FOUND]
          - entities.AllowanceItem.fields.project_id
        distinguishing_aspect: "A body-level FK to a non-existent Project is rejected at 404 ERR_PROJECT_NOT_FOUND rather than creating an orphan allowance item."
        test_recipe:
          setup:
            - "A PROJECT_MANAGER staff member exists but the referenced project id does not."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
          trigger:
            - call: "POST /allowance-items"
              payload: { project_id: "00000000-0000-4000-8000-000000000000", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: schedule_task_self_referential_predecessor_edge_is_readable
        claim_type: retrieval
        grounds:
          - entities.ScheduleTask.fields.predecessor_task_id
          - endpoints[GET /schedule-tasks]
        distinguishing_aspect: "The self-referential ScheduleTask -> ScheduleTask edge is discoverable through the filtered list: GET /schedule-tasks with predecessor_task_id == the root returns exactly the successor row."
        test_recipe:
          setup:
            - "Project P1 is in PLANNING with a framing root task and a plumbing successor task whose predecessor_task_id points at the root."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Blue Valve Plumbing", trade: "PLUMBING", lead_time_days: 10, crew_capacity: 2, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_plumb_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_frame_id: $.data.id }
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_plumb_id}", task_name: "Rough plumbing", planned_start: "2026-10-16T00:00:00.000Z", planned_finish: "2026-11-30T00:00:00.000Z", predecessor_task_id: "${task_frame_id}", lag_days: 0 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { task_plumb_id: $.data.id }
          trigger:
            - call: "GET /schedule-tasks"
              payload: { predecessor_task_id: "${task_frame_id}" }
              as: PlatformAdmin
          assert:
            - "the response contains exactly 1 row whose id == ${task_plumb_id}"
            - "total_count == 1"
            - "ScheduleTask.${task_plumb_id}.predecessor_task_id == ${task_frame_id}"

  # =========================================================================
  # Section 2 - State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: new_change_order_starts_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ChangeOrder.initial_state
          - entities.ChangeOrder.fields.status
        distinguishing_aspect: "A change order created through POST /change-orders is DRAFT with priced_amount null, revision_count 0 and priced_by_staff_id null."
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "FIELD_CONDITION", scope_description: "Rock encountered at footing", direct_cost: 3000.00 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
          assert:
            - "ChangeOrder.${co_id}.status == DRAFT"
            - "ChangeOrder.${co_id}.priced_amount is null"
            - "ChangeOrder.${co_id}.revision_count == 0"
            - "ChangeOrder.${co_id}.priced_by_staff_id is null"
            - "ChangeOrder.${co_id}.schedule_impact_days == 0"
            - "Project.${proj_id}.approved_change_order_total == 0.00"

      - name: submit_change_order_still_in_draft_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ChangeOrder.PRICED_to_SUBMITTED
          - validations[priority=90]
          - errors[ERR_CHANGE_ORDER_INVALID_STATE]
        distinguishing_aspect: "POST /change-orders/{id}/submit from DRAFT (no PRICED edge exists from DRAFT) returns 409 ERR_CHANGE_ORDER_INVALID_STATE and leaves the row in DRAFT."
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with one DRAFT change order that has never been priced."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /subcontractors"
              payload: { company_name: "Ridgeline Framing", trade: "FRAMING", lead_time_days: 5, crew_capacity: 1, waiver_required: true }
              as: PlatformAdmin
              captures: { sub_frame_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", address: "18 Kestrel Ridge", contract_type: "FIXED_PRICE", base_contract_amount: 900000.00, target_substantial_completion_date: "2027-06-30T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /allowance-items"
              payload: { project_id: "${proj_id}", category: "FLOORING", allowance_amount: 18000.00, selection_deadline: "2026-12-01T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /schedule-tasks"
              payload: { project_id: "${proj_id}", subcontractor_id: "${sub_frame_id}", task_name: "Frame shell", planned_start: "2026-09-01T00:00:00.000Z", planned_finish: "2026-10-15T00:00:00.000Z" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /projects/${proj_id}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "FIELD_CONDITION", scope_description: "Rock encountered at footing", direct_cost: 3000.00 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "response data.error_id == ERR_CHANGE_ORDER_INVALID_STATE"
            - "ChangeOrder.${co_id}.status == DRAFT"
            - "ChangeOrder.${co_id}.submitted_by_staff_id is null"

      - name: client_decision_on_already_rejected_change_order_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ChangeOrder.terminal_states
          - errors[ERR_CHANGE_ORDER_INVALID_STATE]
        distinguishing_aspect: "REJECTED is terminal: a second client-decision on a REJECTED change order returns 409 ERR_CHANGE_ORDER_INVALID_STATE and the project ledger stays at 900000.00."
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with a change order the client already rejected."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dana Reyes", email: "dana@example.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Pat Morgan", staff_function: "PROJECT_MANAGER" }
              as: PlatformAdmin
              captures: { pm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Elle Sato", staff_function: "ESTIMATOR" }
              as: PlatformAdmin
