        distinguishing_aspect: "The DENIED branch of the fork carries a disjoint side-effect set from APPROVED: zero cash, zero points, zero inventory movement, but hygiene_strikes goes 0 -> 1 and stays ACTIVE until the third strike."
        test_recipe:
          setup: ["A SHIPPED, CAPTURED order with one SEALED line (2 units at 2500); a REQUESTED return for 1 unit."]
