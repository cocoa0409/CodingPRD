  - section: errors
    instances:
      - name: unknown_ids_on_the_action_routes_return_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SAMPLING_PERIOD_NOT_FOUND
          - errors.ERR_ROLLOUT_NOT_FOUND
          - errors.ERR_HIGH_RISK_REVIEW_NOT_FOUND
          - errors.ERR_REBUTTAL_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: "Six entities have no single-row GET, so their existence check lives on the action route: each of these POSTs against a syntactically valid but unknown UUID must return the entity-specific 404 id rather than a generic 404, and the existence check must run before the state guard (a nonexistent rollout is NOT_FOUND, never ERR_ROLLOUT_NOT_LIVEABLE)."
        test_recipe:
          setup:
            - "An empty program — no periods, rollouts, high-risk records, rebuttals, sessions or reports exist."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /sampling-periods/11111111-1111-4111-8111-111111111111/close"
              payload: { closing_note: "x" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /protocol-rollouts/22222222-2222-4222-8222-222222222222/go-live"
              payload: { golive_note: "x" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /high-risk-reviews/33333333-3333-4333-8333-333333333333/sign-off"
              payload: { classification: "COACHING_ONLY" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /rebuttals/44444444-4444-4444-8444-444444444444/decide"
              payload: { decision: "REJECTED" }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /retraining-sessions/55555555-5555-4555-8555-555555555555/complete"
              payload: { attendance_confirmed: true }
              as: QaSupervisor
              as_user_id: "sup-1"
            - call: "POST /accreditation-reports/66666666-6666-4666-8666-666666666666/submit"
              payload: { submitted_to: "MEDICAL_DIRECTOR" }
              as: AccreditationOfficer
              as_user_id: "acc-1"
          assert:
            - "The close returns 404 with data.error_id == ERR_SAMPLING_PERIOD_NOT_FOUND"
            - "The go-live returns 404 with data.error_id == ERR_ROLLOUT_NOT_FOUND"
            - "The sign-off returns 404 with data.error_id == ERR_HIGH_RISK_REVIEW_NOT_FOUND"
            - "The decide returns 404 with data.error_id == ERR_REBUTTAL_NOT_FOUND"
            - "The complete returns 404 with data.error_id == ERR_SESSION_NOT_FOUND"
            - "The submit returns 404 with data.error_id == ERR_REPORT_NOT_FOUND"
            - "GET /audit-programs/${prog_id} shows submitted_report_count 0 — no failed call wrote anything"

      - name: duplicate_employee_code_and_call_reference_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_EMPLOYEE_CODE
          - errors.ERR_DUPLICATE_CALL_REFERENCE
          - validations.uniqueness_and_cardinality
        distinguishing_aspect: "The two uniqueness scopes differ and both must be enforced: employee_code is unique per program (the same code succeeds in a second program), while call_reference is globally unique (the same reference fails even for a different dispatcher in a different program)."
        test_recipe:
