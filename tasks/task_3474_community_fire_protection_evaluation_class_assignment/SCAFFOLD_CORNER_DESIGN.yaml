          rationale: "That instance asserts the DRAFT sheet's recomputed flow/water/adjusted values after a correction."

  # ---------------------------------------------------------------------------
  # Validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: community_create_missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A write call without X-User-Role/X-User-ID headers is rejected 401 before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/communities", payload: { name: "NoAuth", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "with auth headers absent the call returns 401 ERR_UNAUTHENTICATED"

      - name: existence_beats_state_on_missing_cycle
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=19]"]
        distinguishing_aspect: "A transition against a non-existent cycle returns 404 ERR_CYCLE_NOT_FOUND, not a state error — existence outranks state."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/evaluation-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transition", payload: { target_state: "WITHDRAWN" }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 404 ERR_CYCLE_NOT_FOUND"

      - name: flow_test_psi_ordering_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=44]", entities.FlowTest.fields.residual_psi]
        distinguishing_aspect: "residual_psi >= static_psi violates the pressure-ordering constraint (400)."
        test_recipe:
          setup: ["community in DATA_COLLECTION with hydrant"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Psi City", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "H1" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
          trigger:
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 70, residual_psi: 80, measured_flow_gpm: 1000 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 ERR_INVALID_REQUEST"

      - name: community_create_nff_below_range_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=44]", entities.WaterSupplySystem.fields.needed_fire_flow_gpm]
        distinguishing_aspect: "needed_fire_flow_gpm 100 is below the 500 floor (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ppc/communities", payload: { name: "LowFlow", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 100, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 400 ERR_INVALID_REQUEST"

      - name: duplicate_active_request_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=45]", "errors[ERR_DUPLICATE_ACTIVE_REQUEST]"]
        distinguishing_aspect: "A second non-terminal reevaluation request for the same community is rejected 409."
        test_recipe:
          setup: ["CLASSIFIED community (effective 2026-09-01), clock 2027-09-02, one SUBMITTED request"]
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "DupReq", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
