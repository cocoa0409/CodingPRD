              as: RiskApprover
              as_user_id: "${ra3_id}"
            - call: "POST /exercises/${exB_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exercises/${exB_id}/execution-transitions"
              payload: { action: "START" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exB_id}/step-executions"
              payload: { runbook_step_id: "${s1_id}", outcome: "PASSED", elapsed_seconds: 750 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exB_id}/step-executions"
              payload: { runbook_step_id: "${s2_id}", outcome: "PASSED_WITH_ISSUE", elapsed_seconds: 1230 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exB_id}/step-executions"
              payload: { runbook_step_id: "${s3_id}", outcome: "SKIPPED", elapsed_seconds: 600 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T01:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exercises/${exB_id}/execution-transitions"
              payload: { action: "COMPLETE_FAILOVER" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "Exercise.${exA_id}.achieved_rto_minutes == 34"
            - "Exercise.${exA_id}.rto_met == true"
            - "Exercise.${exB_id}.achieved_rto_minutes == 80"
            - "Exercise.${exB_id}.rto_met == false"
            - "Exercise.${exA_id}.rto_objective_minutes == 45 and Exercise.${exB_id}.rto_objective_minutes == 45"
            - "Exercise.${exA_id}.execution_started_at == 2026-09-10T02:00:00Z and Exercise.${exA_id}.failover_completed_at == 2026-09-10T03:20:00Z (an 80-minute wall span, identical to exB's)"
            - "Exercise.${exB_id}.execution_started_at == 2026-09-11T00:00:00Z and Exercise.${exB_id}.failover_completed_at == 2026-09-11T01:20:00Z"
            - "StepExecution rows for both exercises carry elapsed_minutes 13, 21 and 10, so the NET_EXECUTION sum ignores the SKIPPED row: 13 + 21 == 34"
            - "Exercise.${exB_id}.execution_state == FAILOVER_COMPLETE"

      - name: rpo_variant_replication_lag_vs_transaction_gap
        grounds:
          - calculations.achieved_rpo_minutes
          - entities.Asset.fields.replication_mode
          - entities.ReplicationObservation.fields.replication_lag_seconds
          - entities.ReplicationObservation.fields.unreplicated_txn_count
          - entities.Exercise.fields.achieved_rpo_minutes
        distinguishing_aspect: |
          The variant lives in the REPLICATION domain, not the timing domain: from one identical
          observation (replication_lag_seconds 240, unreplicated_txn_count 900, 150 txn/min) the
          REPLICATION_LAG variant reports achieved_rpo_minutes 4 while the presence of a single
          BATCH_SNAPSHOT DATA_STORE in scope switches the whole exercise to TRANSACTION_GAP and
          reports 6.
        test_recipe:
