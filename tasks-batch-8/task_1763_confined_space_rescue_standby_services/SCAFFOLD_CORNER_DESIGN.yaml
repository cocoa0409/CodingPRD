            - { call: "GET /rescue-ops/roster-entries/00000000-0000-4000-8000-000000000000", as: OperationsManager, captures: { e9: "$.data.error_id" } }
            - { call: "GET /rescue-ops/client-accounts/00000000-0000-4000-8000-000000000000", as: OperationsManager, captures: { e10: "$.data.error_id" } }
          assert:
