              captures: { ma_pep: "$.data.id" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-9
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "SATELLITE", source_call_sign: "WXSAT", expected_station_version: "${sv1}" }
              captures: { err_owner_over_stale: "$.data.error_id" }
            - call: "GET /stations/${station_id}"
