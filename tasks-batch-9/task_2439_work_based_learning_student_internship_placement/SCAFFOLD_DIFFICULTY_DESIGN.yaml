            - call: "POST /wbl/agreements"
              payload: { employer_partner_id: "${emp_id}", worksite_id: "${ws_id}", employer_signer_supervisor_id: "${sup_id}", effective_on: "2026-09-01", expires_on: "2027-06-30", insurance_rider: true }
