              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "rev-1"
          assert:
            - "the certify returns 403 ERR_SEGREGATION_OF_DUTIES"
            - "SeveranceApplication.${app_id}.status == APPROVED with allocated_units 22 and certified_by_user_id == null"
            - "GET /tdr/conservation-easements?sending_parcel_id=${parcel_id} returns total_count 0"
            - "GET /tdr/certificates?origin_sending_area_id=${sa_id} returns total_count 0"
            - "SendingArea.${sa_id}.issued_certificate_count == 0"
            - "the same certify repeated with as_user_id admin-1 returns 201 and mints the certificate"

      - name: duplicate_parcel_apn_is_rejected_across_sending_areas
        claim_type: violation_to_error
        grounds:
          - validations.priority_33_unique_apn
          - errors.ERR_DUPLICATE_PARCEL_APN
          - entities.SendingParcel.fields.apn
        distinguishing_aspect: "The APN uniqueness scope is the whole program, not the sending area: re-enrolling the same assessor parcel number under a DIFFERENT active area is still a 409, which is what stops one parcel from being granted two independent baselines."
        test_recipe:
