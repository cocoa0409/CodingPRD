            - *k_conf_read
            - *k_res12
            - *k_p26
            - *k_p26_open
            - *k_p26_cb
            - *k_p26_read
            - *k_r26
            - *k_ar26
            - *k_ar26_issue
            - *k_r26_post
          trigger:
            - call: "POST /members/${m_s_id}/withdrawal-notice"
              payload: { withdrawal_effective_fiscal_year: 2028, notice_days: 400, reason: "Exploring other affiliation" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "GET /members/${m_s_id}/exit-settlement"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_s_id}/withdrawal-notice/rescind"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "GET /members/${m_s_id}/exit-settlement"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "after the notice, Member.${m_s_id}.status == WITHDRAWAL_NOTICED and .voting_weight_bps == 0"
            - "the first exit-settlement response has notice_multiplier_bps == 20000, base_assessment_cents == 295000000, surcharge_bracket_bps == 350, surcharge_cents == 10325000, exit_settlement_total_cents == 305325000 and remaining_balance_cents == 305325000"
            - "after the rescission, Member.${m_s_id}.status == FULL_SHARE and .voting_weight_bps == 10000 and .distribution_phase_bps == 10000"
            - "the second exit-settlement response has notice_multiplier_bps == 0, base_assessment_cents == 0, surcharge_bracket_bps == 0, surcharge_cents == 0, exit_settlement_total_cents == 0 and remaining_balance_cents == 0"
            - "Member.${m_s_id}.last_full_annual_distribution_cents is still 147500000, so the rescission clears the assessment without erasing the distribution history"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:

      - name: championship_settlement_invalidates_computed_run_depth_five
        grounds:
          - calculations.championship_event_settlement
          - state_machines.ChampionshipEvent.HOSTED_to_SETTLED
          - state_machines.RevenuePool.OPEN_to_DRAFT
          - state_machines.DistributionRun.COMPUTED_to_SUPERSEDED
          - state_machines.DistributionLine.ACTIVE_to_VOIDED
          - entities.RevenuePool.fields.gross_revenue_cents
        distinguishing_aspect: |
          One settle call propagates five hops across four entity types:
          ChampionshipEvent SETTLED -> RevenuePool.gross_revenue_cents restated to
          531200000 -> RevenuePool status reverted to DRAFT -> the COMPUTED
          DistributionRun forced to SUPERSEDED -> its four DistributionLine rows VOIDED.
          Nothing in the request names the run or its lines.
        test_recipe:
          setup:
            - "The full FY2027 media fixture is in place: an OPEN pool with 500000000 gross cents, four FULL_SHARE members, four media games and North's approved bowl appearance."
            - "A PROVISIONAL distribution run has been computed against that pool and holds four ACTIVE lines."
            - "South, whose schedule compliance score is 100, has been awarded and has hosted a FY2027 basketball championship at the Northfield Dome for the window 2027-03-05T00:00:00Z to 2027-03-08T00:00:00Z, linked to that pool."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_g1
            - *k_g2
            - *k_g3
            - *k_g4
            - *k_g1_play
            - *k_g2_play
            - *k_g4_play
            - *k_ba_n
            - *k_ba_n_rev
            - *k_ba_n_app
            - *k_ba_w
            - *k_pool
            - *k_pool_open
            - *k_pool_read
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "cascade fixture" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { run_c_id: $.data.id }
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v1_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "BASKETBALL", fiscal_year: 2027, window_start: "2027-03-05T00:00:00Z", window_end: "2027-03-08T00:00:00Z" }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ce_id: $.data.id }
            - call: "POST /championship-events/${ce_id}/host"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
