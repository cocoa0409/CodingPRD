              captures: { err_wc: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_WILL_CALL_NOT_ENABLED"
            - "GET /part-orders?servicer_account_id=${acct_s_id} returns len(response.data) == 0"

  # ===========================================================================
  - section: errors
    instances:

      - name: duplicate_part_number_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority_47]
          - errors[ERR_DUPLICATE_KEY]
          - entities.Part.fields.part_number
        distinguishing_aspect: "A second POST /parts reusing part_number W10-PUMP returns 409 ERR_DUPLICATE_KEY and leaves exactly one row with that part_number, even though every other field differs."
        test_recipe:
          setup:
            - "One Part W10-PUMP MECHANICAL list 12999 already exists."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "GE", description: "Different pump entirely", category: "ELECTRICAL", list_price_cents: 999, weight_grams: 100 }
              as: PricingAdmin
              captures: { err_dup: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_KEY"
            - "GET /parts?part_number=W10-PUMP returns len(response.data) == 1"
            - "Part.${part_p1_id}.oem_code == WHIRLPOOL"
            - "Part.${part_p1_id}.list_price_cents == 12999"

      - name: inventory_adjustment_below_reserved_units_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority_46]
          - errors[ERR_INVENTORY_NEGATIVE]
          - entities.InventoryRecord.fields.reserved_units
          - endpoints.POST_/inventory-records/{id}/adjustments
        distinguishing_aspect: "With on_hand 5 and reserved 3, a -3 adjustment would leave on_hand 2 < reserved 3, so it returns 422 ERR_INVENTORY_NEGATIVE and on_hand stays 5 — while a -2 adjustment to exactly on_hand == reserved would have been legal."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true; Part P1 MECHANICAL 12999."
            - "NET_30 account with credit_limit_cents 10000000; InventoryRecord (STL, P1) on_hand 5."
            - "A WILL_CALL order for 3 units is credit-approved and allocated, so reserved_units == 3 and available_units == 2."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 5, reorder_point: 1 }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4001" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "inside limit" }
              as: CreditManager
            - call: "POST /part-orders/${order_id}/allocate"
              payload: {}
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
          trigger:
            - call: "POST /inventory-records/${inv_a_p1_id}/adjustments"
              payload: { delta_units: -3, adjustment_reason: "cycle count shrinkage" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
              captures: { err_neg: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVENTORY_NEGATIVE"
            - "InventoryRecord.${inv_a_p1_id}.on_hand_units == 5"
            - "InventoryRecord.${inv_a_p1_id}.reserved_units == 3"
            - "InventoryRecord.${inv_a_p1_id}.available_units == 2"

      - name: will_call_order_carrying_a_ship_to_zip_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority_44]
          - errors[ERR_FULFILLMENT_MODE_MISMATCH]
          - entities.PartOrder.fields.fulfillment_mode
        distinguishing_aspect: "WILL_CALL forbids ship_to_zip, so a body carrying both pickup_branch_id and ship_to_zip returns 422 ERR_FULFILLMENT_MODE_MISMATCH and no PartOrder row is created."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true; one NET_30 account."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
          trigger:
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", ship_to_zip: "63110", purchase_order_ref: "PO-4002" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { err_mode: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_FULFILLMENT_MODE_MISMATCH"
            - "GET /part-orders?servicer_account_id=${acct_s_id} returns len(response.data) == 0"

      - name: three_part_supersession_cycle_is_detected_during_resolution
        claim_type: violation_to_error
        grounds:
          - validations[priority_29]
          - errors[ERR_SUPERSESSION_CYCLE_DETECTED]
          - calculations.supersession_chain_resolution
        distinguishing_aspect: "A -> B -> C -> A is accepted link-by-link (no immediate 2-cycle, same oem_code) but a line requesting A must abort with 422 ERR_SUPERSESSION_CYCLE_DETECTED when the walk revisits A, rather than looping until MAX_SUPERSESSION_HOPS."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true."
            - "Parts P_A, P_B, P_C all oem_code WHIRLPOOL MECHANICAL (12000 / 12500 / 13000)."
            - "Links written in order: P_A -> P_B, P_B -> P_C, then P_C -> P_A, closing a three-node cycle that priority 31's immediate-2-cycle guard does not catch."
            - "NET_30 account with credit_limit_cents 10000000 and a WILL_CALL order in DRAFT."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-A", oem_code: "WHIRLPOOL", description: "Drain pump rev A", category: "MECHANICAL", list_price_cents: 12000, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_a_id: $.data.id, part_a_v1: $.data.version }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-B", oem_code: "WHIRLPOOL", description: "Drain pump rev B", category: "MECHANICAL", list_price_cents: 12500, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_b_id: $.data.id, part_b_v1: $.data.version }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-C", oem_code: "WHIRLPOOL", description: "Drain pump rev C", category: "MECHANICAL", list_price_cents: 13000, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_c_id: $.data.id, part_c_v1: $.data.version }
            - call: "POST /parts/${part_a_id}/supersession"
              payload: { superseded_by_part_id: "${part_b_id}", expected_part_version: "${part_a_v1}" }
              as: PricingAdmin
            - call: "POST /parts/${part_b_id}/supersession"
              payload: { superseded_by_part_id: "${part_c_id}", expected_part_version: "${part_b_v1}" }
              as: PricingAdmin
            - call: "POST /parts/${part_c_id}/supersession"
              payload: { superseded_by_part_id: "${part_a_id}", expected_part_version: "${part_c_v1}" }
              as: PricingAdmin
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4003" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          trigger:
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_a_id}", quantity: 1, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { err_cycle: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_SUPERSESSION_CYCLE_DETECTED"
            - "PartOrder.${order_id}.version == 1"
            - "PartOrder.${order_id}.subtotal_cents == 0"
            - "GET /order-lines?part_order_id=${order_id} returns len(response.data) == 0"

      - name: substitute_beyond_the_variance_cap_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority_41]
          - errors[ERR_SUBSTITUTE_PRICE_VARIANCE]
          - calculations.substitute_price_variance
          - state_machines.SubstituteRequest.transitions.PENDING_to_APPROVED
        distinguishing_aspect: "Approving a 20000 substitute for a 12999 obsolete part is a signed variance of 0.5386, far past SUBSTITUTE_VARIANCE_CAP_PCT 0.25, so the decision returns 422 ERR_SUBSTITUTE_PRICE_VARIANCE and the request stays PENDING with its line still SUBSTITUTE_PENDING."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true."
            - "Part P_OBS W10-OLDPUMP MECHANICAL list 12999 created with lifecycle_status OBSOLETE; Part P_SUB W10-PUMP-PREM MECHANICAL list 20000 ACTIVE, same oem_code WHIRLPOOL."
            - "NET_30 account with credit_limit_cents 10000000; a WILL_CALL order whose single line requests P_OBS lands SUBSTITUTE_PENDING with a PENDING SubstituteRequest."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
