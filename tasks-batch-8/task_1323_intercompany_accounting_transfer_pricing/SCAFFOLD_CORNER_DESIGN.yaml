          trigger:
            - { call: "POST /tp/doc_packages/${doc}/approve", payload: {}, as: TaxAnalyst, as_user_id: "ana-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "DocPackage.${doc}.status == SUBMITTED (unchanged)"

