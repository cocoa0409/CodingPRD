scenario: "desgin task harder than expert level.!!!!2184. Semi-Trailer Rental & Leasing (XTRA Lease style lessor): fleet inventory by trailer type & location, short-term rental vs full-service lease pricing, maintenance program & DOT inspection cycle, damage assessment at return & chargeback, relocation/repositioning cost, peak-season rate & availability allocation, lease-end purchase option, insurance & liability terms"
domain_name: "semi-trailer-rental-leasing"
api_prefix: "/fleet"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - selector_policy

  entity_topology: graph
  # Trailer, Agreement, AgreementUnit, RelocationOrder and DamageAssessment form a
  # cross-referencing graph rather than a tree: AgreementUnit is a junction between
  # Agreement and Trailer, RelocationOrder joins two Branch rows through one Trailer,
  # and DamageAssessment.supersedes_assessment_id is self-referential.

  state_machine_shape: parallel
  # Trailer carries two independent state dimensions on the same row:
  #   availability_status (explicit transitions) x service_status (derived, precedence-ordered).
  # Agreement (RESERVED <-> PENDING_ALLOCATION) and Chargeback (PENDING <-> DISPUTED)
  # add cycles; RelocationOrder and Agreement add branching.

  relationship_patterns:
    - one_to_many          # Branch -> Trailer, Agreement -> AgreementUnit
    - many_to_many         # Agreement <-> Trailer through AgreementUnit
    - self_referential     # DamageAssessment.supersedes_assessment_id -> DamageAssessment.id
    - cross_aggregate      # Chargeback (billing aggregate) reaches into Trailer (fleet aggregate)

  role_model: segregation_of_duties
  # The Inspector who authors a DamageAssessment may never be the ChargebackApprover
  # who approves the resulting Chargeback (compared on X-User-ID).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short yard code, unique across all branches"
        constraints: "1-16 chars; uniqueness violation -> ERR_DUPLICATE_BRANCH_CODE"
      - name: name
        type: string
        source: input
        description: "Human readable yard name"
      - name: region
        type: enum
        source: input
        description: "Geographic region of the yard"
        constraints: "one of WEST, CENTRAL, EAST"
      - name: yard_capacity
        type: integer
        source: input
        description: "Maximum number of trailers the yard may hold, used by the inbound relocation capacity rule"
        constraints: ">= 1"
      - name: peak_season_start_date
        type: string
        source: input
        description: "First calendar date (inclusive) of this branch's single peak window, ISO date YYYY-MM-DD"
      - name: peak_season_end_date
        type: string
        source: input
        description: "Last calendar date (inclusive) of this branch's single peak window, ISO date YYYY-MM-DD"
        constraints: ">= peak_season_start_date else ERR_INVALID_DATE_RANGE"
      - name: lease_reserve_pct
        type: number
        source: input
        description: "Fraction of the serviceable-available pool held back for FULL_SERVICE_LEASE demand during the peak window"
        default: 0.00
        constraints: "0.00 <= value <= 1.00"
      - name: on_hand_count
        type: integer
        source: computed
        description: "count(Trailer WHERE current_branch_id == this.id AND availability_status IN {AVAILABLE, ALLOCATED})"
      - name: serviceable_available_count
        type: integer
        source: computed
        description: "count(Trailer WHERE current_branch_id == this.id AND availability_status == AVAILABLE AND service_status == SERVICEABLE)"

  - name: TrailerType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: "Trailer specification code, unique across all trailer types"
        constraints: "one of DRY_VAN_53, REEFER_53, FLATBED_48, CHASSIS_40; uniqueness violation -> ERR_DUPLICATE_TRAILER_TYPE_CODE"
      - name: description
        type: string
        source: input
        description: "Free-text spec summary"
      - name: base_daily_rate_cents
        type: integer
        source: input
        description: "List daily rate used only when no RateCard exists; informational reference"
      - name: base_monthly_rate_cents
        type: integer
        source: input
        description: "List monthly rate; informational reference"
      - name: residual_floor_cents
        type: integer
        source: input
        description: "Hard floor for lease-end purchase option price and for net book value"
        constraints: ">= 0"
      - name: dot_inspection_interval_days
        type: integer
        source: input
        description: "Days between required federal periodic (DOT) inspections"
        default: 365
        constraints: ">= 1"
      - name: pm_interval_miles
        type: integer
        source: input
        description: "Hub miles between preventive-maintenance services"
        default: 30000
        constraints: ">= 1"
      - name: required_physical_damage_limit_cents
        type: integer
        source: input
        description: "Minimum physical-damage limit an InsuranceCertificate must carry to cover this trailer type"
        constraints: ">= 0"

  - name: Trailer
    parent: null
    common_fields: true
    fields:
      - name: unit_number
        type: string
        source: input
        description: "Fleet unit number, unique across all trailers"
        constraints: "uniqueness violation -> ERR_DUPLICATE_UNIT_NUMBER"
      - name: trailer_type_id
        type: string
        source: input
        description: "FK -> TrailerType.id; fixes rate lookup, DOT interval and PM interval"
      - name: home_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; accounting home yard, never changed by relocation"
      - name: current_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; physical yard. Initialised to home_branch_id; updated by relocation completion and by unit return"
      - name: availability_status
        type: enum
        source: system
        description: "Commercial availability dimension"
        default: AVAILABLE
        constraints: "one of AVAILABLE, ALLOCATED, ON_RENT, ON_LEASE, IN_TRANSIT, RETIRED, SOLD"
      - name: service_status
        type: enum
        source: computed
        description: "Mechanical/compliance dimension, derived with pinned precedence (see calculations.trailer_service_status)"
        constraints: "one of SERVICEABLE, PM_DUE, OOS_DAMAGE, OOS_DOT_EXPIRED"
      - name: hub_miles
        type: integer
        source: input
        description: "Hubodometer reading; updated to return_hub_miles on unit return"
        default: 0
        constraints: ">= 0"
      - name: last_pm_hub_miles
        type: integer
        source: system
        description: "Hub reading at the most recent PM_SERVICE MaintenanceEvent; initialised to hub_miles at creation"
      - name: last_dot_inspection_date
        type: string
        source: input
        description: "ISO date of the most recent passed DOT periodic inspection"
      - name: dot_expires_on
        type: string
        source: computed
        description: "last_dot_inspection_date + TrailerType.dot_inspection_interval_days, ISO date"
      - name: last_dot_passed
        type: boolean
        source: system
        description: "passed flag of the most recent DOT_INSPECTION MaintenanceEvent; true when none recorded"
        default: true
      - name: last_damage_repair_at
        type: datetime
        source: system
        description: "created_at of the most recent DAMAGE_REPAIR MaintenanceEvent; null when none. Acts as the damage-points watermark"
      - name: damage_points
        type: integer
        source: computed
        description: "sum(DamageAssessment.damage_points) over assessments on this trailer with status IN {SUBMITTED, APPROVED} and (last_damage_repair_at IS NULL OR assessment.created_at > last_damage_repair_at)"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Capitalised purchase cost, basis for straight-line depreciation"
        constraints: ">= 0"
      - name: in_service_date
        type: string
        source: input
        description: "ISO date the unit entered service; depreciation clock start"
      - name: net_book_value_cents
        type: integer
        source: computed
        description: "Depreciated book value floored at TrailerType.residual_floor_cents (see calculations.trailer_net_book_value_cents)"
      - name: retired_reason
        type: string
        source: system
        description: "Reason captured when availability_status becomes RETIRED; null otherwise"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name of the lessee"
      - name: dot_number
        type: string
        source: input
        description: "USDOT operating authority number"
      - name: credit_tier
        type: enum
        source: input
        description: "Underwriting tier driving deductible and base risk points"
        constraints: "one of A, B, C"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum tolerated outstanding_chargeback_cents at agreement activation"
        constraints: ">= 0"
      - name: outstanding_chargeback_cents
        type: integer
        source: computed
        description: "sum(Chargeback.amount_cents WHERE customer_id == this.id AND status IN {PENDING, DISPUTED, APPROVED})"

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the insured lessee"
      - name: carrier_name
        type: string
        source: input
        description: "Insurance carrier legal name"
      - name: policy_number
        type: string
        source: input
        description: "Carrier policy number"
      - name: physical_damage_limit_cents
        type: integer
        source: input
        description: "Per-occurrence physical damage limit; caps the insured portion of a damage assessment"
        constraints: ">= 0"
      - name: liability_limit_cents
        type: integer
        source: input
        description: "Per-occurrence liability limit; recorded for contract terms only"
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: "ISO date coverage begins, inclusive"
      - name: expiry_date
        type: string
        source: input
        description: "ISO date coverage ends, inclusive"
        constraints: ">= effective_date else ERR_INVALID_DATE_RANGE"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; ACTIVE at creation, lazily flipped to EXPIRED on any read once the logical clock date exceeds expiry_date"
        default: ACTIVE
        constraints: "one of ACTIVE, EXPIRED, REVOKED"
      - name: revoked_reason
        type: string
        source: system
        description: "Reason recorded when status becomes REVOKED; null otherwise"

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the yard whose pricing this card governs"
      - name: trailer_type_id
        type: string
        source: input
        description: "FK -> TrailerType.id; the equipment class this card prices"
      - name: product
        type: enum
        source: input
        description: "Product line this card prices"
        constraints: "one of SHORT_TERM_RENTAL, FULL_SERVICE_LEASE"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Off-peak daily rate per unit"
        constraints: ">= 0"
      - name: monthly_rate_cents
        type: integer
        source: input
        description: "Published monthly equivalent; recorded for contract terms only"
        constraints: ">= 0"
      - name: peak_uplift_pct
        type: number
        source: input
        description: "Multiplicative uplift applied to daily_rate_cents on calendar days inside the branch peak window"
        constraints: "0.00 <= value <= 2.00"
      - name: mileage_included_per_month
        type: integer
        source: input
        description: "Included hub miles per 30-day block, prorated by days out"
        constraints: ">= 0"
      - name: excess_mileage_rate_cents_per_mile
        type: integer
        source: input
        description: "Cents charged per hub mile beyond the prorated inclusion"
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: "ISO date the card was published; informational only, selection uses status"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while it is the current card for (branch_id, trailer_type_id, product); SUPERSEDED once a newer card replaces it"
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED"

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the lessee"
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; originating yard, also the peak-window and rate-card source"
      - name: product
        type: enum
        source: input
        description: "Product line"
        constraints: "one of SHORT_TERM_RENTAL, FULL_SERVICE_LEASE"
      - name: trailer_type_id
        type: string
        source: input
        description: "FK -> TrailerType.id; equipment class demanded"
      - name: unit_count
        type: integer
        source: input
        description: "Number of trailers the agreement must hold before it can reserve"
        constraints: ">= 1"
      - name: start_date
        type: string
        source: input
        description: "ISO date, inclusive start of the contract window"
      - name: end_date
        type: string
        source: input
        description: "ISO date, EXCLUSIVE end of the contract window"
        constraints: "> start_date else ERR_INVALID_DATE_RANGE"
      - name: term_months
        type: integer
        source: input
        description: "Contract term in months; required when product == FULL_SERVICE_LEASE, must be null/absent for SHORT_TERM_RENTAL"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, PENDING_INSURANCE, PENDING_ALLOCATION, RESERVED, ACTIVE, PENDING_SETTLEMENT, CLOSED, CANCELLED"
      - name: rate_card_id
        type: string
        source: system
        description: "FK -> RateCard.id; pinned when the agreement first reaches RESERVED and never re-resolved afterwards"
      - name: insurance_certificate_id
        type: string
        source: system
        description: "FK -> InsuranceCertificate.id; pinned by the insurance verification transition"
      - name: underwriting_risk_score
        type: integer
        source: computed
        description: "customer_risk_score under variant underwriting_snapshot, frozen at DRAFT -> PENDING_INSURANCE"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "agreement_total_cents under variant quoted_forward, written when the agreement first reaches RESERVED"
      - name: final_total_cents
        type: integer
        source: computed
        description: "agreement_total_cents under variant final_chronological, written at settlement"
      - name: allocated_unit_count
        type: integer
        source: computed
        description: "count(AgreementUnit WHERE agreement_id == this.id AND status IN {ALLOCATED, OUT, RETURNED, SETTLED})"
      - name: purchase_option_status
        type: enum
        source: system
        description: "Lease-end purchase option state"
        default: NOT_OFFERED
        constraints: "one of NOT_OFFERED, OFFERED, EXERCISED, DECLINED"
      - name: purchase_option_price_cents
        type: integer
        source: computed
        description: "Price computed at settlement when the option is offered; null otherwise"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded when status becomes CANCELLED; null otherwise"

  - name: AgreementUnit
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; owning contract"
      - name: trailer_id
        type: string
        source: input
        description: "FK -> Trailer.id; the physical unit committed to the contract"
      - name: return_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; yard that accepted the return, null until RETURNED"
      - name: status
        type: enum
        source: system
        description: "Unit lifecycle"
        default: ALLOCATED
        constraints: "one of ALLOCATED, OUT, RETURNED, SETTLED, SWAPPED_OUT, RELEASED"
      - name: planned_start_date
        type: string
        source: system
        description: "Copied from Agreement.start_date at attach time; left edge of the trailer occupancy interval"
      - name: planned_end_date
        type: string
        source: system
        description: "Copied from Agreement.end_date at attach time; EXCLUSIVE right edge of the trailer occupancy interval"
      - name: checkout_date
        type: string
        source: system
        description: "ISO date the unit physically left the yard; null until OUT"
      - name: return_date
        type: string
        source: system
        description: "ISO date the unit was accepted back, EXCLUSIVE right edge of the billed window; null until RETURNED"
      - name: checkout_hub_miles
        type: integer
        source: system
        description: "Trailer.hub_miles snapshot at checkout"
      - name: return_hub_miles
        type: integer
        source: system
        description: "Hub reading recorded at return"
      - name: peak_days
        type: integer
        source: computed
        description: "Count of calendar days d in [checkout_date, return_date) with branch.peak_season_start_date <= d <= branch.peak_season_end_date"
      - name: excess_miles
        type: integer
        source: computed
        description: "max(0, return_hub_miles - checkout_hub_miles - prorated_included_miles)"
      - name: drop_charge_cents
        type: integer
        source: computed
        description: "DROP_CHARGE_CENTS when return_branch_id != Agreement.branch_id, else 0"
      - name: line_charge_cents
        type: integer
        source: computed
        description: "Rounded per-line charge for this unit (see calculations.agreement_total_cents, variant final_chronological)"

  - name: MaintenanceEvent
    parent: Trailer
    common_fields: false
    fields:
      - name: trailer_id
        type: string
        source: input
        description: "FK -> Trailer.id; the serviced unit"
      - name: event_type
        type: enum
        source: input
        description: "Kind of shop event"
        constraints: "one of PM_SERVICE, DOT_INSPECTION, DAMAGE_REPAIR"
      - name: performed_on
        type: string
        source: input
        description: "ISO date the work was performed"
      - name: hub_miles_at_event
        type: integer
        source: input
        description: "Hub reading recorded by the shop"
        constraints: ">= 0"
      - name: cost_cents
        type: integer
        source: input
        description: "Shop cost, lessor-borne"
        constraints: ">= 0"
      - name: passed
        type: boolean
        source: input
        description: "DOT inspection outcome; required when event_type == DOT_INSPECTION, ignored otherwise"
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the caller that recorded the event"

  - name: DamageAssessment
    parent: AgreementUnit
    common_fields: true
    fields:
      - name: agreement_unit_id
        type: string
        source: input
        description: "FK -> AgreementUnit.id; the returned unit being assessed"
      - name: trailer_id
        type: string
        source: system
        description: "FK -> Trailer.id; copied from the assessed AgreementUnit"
      - name: supersedes_assessment_id
        type: string
        source: input
        description: "FK -> DamageAssessment.id; prior assessment on the same unit that this re-inspection replaces, null for a first assessment"
      - name: assessor_user_id
        type: string
        source: system
        description: "X-User-ID of the Inspector that created the assessment; compared against the approver for segregation of duties"
      - name: line_items
        type: array
        source: input
        description: "Array of objects { severity: MINOR|MODERATE|MAJOR, quantity: integer >= 1, unit_cost_cents: integer >= 0, description: string }"
        constraints: "at least 1 element"
      - name: status
        type: enum
        source: system
        description: "Assessment lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED"
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: "Severity-weighted gross damage value (see calculations.damage_liability_cents)"
      - name: insured_portion_cents
        type: integer
        source: computed
        description: "Portion absorbed by the pinned InsuranceCertificate after deductible and limit"
      - name: customer_liable_cents
        type: integer
        source: computed
        description: "assessed_amount_cents - insured_portion_cents"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "round_half_up(customer_liable_cents * ADMIN_FEE_PCT)"
      - name: damage_points
        type: integer
        source: computed
        description: "sum over line_items of SEVERITY_POINTS[severity] * quantity"

  - name: Chargeback
    parent: DamageAssessment
    common_fields: true
    fields:
      - name: damage_assessment_id
        type: string
        source: system
        description: "FK -> DamageAssessment.id; the assessment that produced this chargeback"
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; copied from the assessed unit's agreement"
      - name: amount_cents
        type: integer
        source: computed
        description: "DamageAssessment.customer_liable_cents + DamageAssessment.admin_fee_cents, frozen at creation"
      - name: status
        type: enum
        source: system
        description: "Billing lifecycle"
        default: PENDING
        constraints: "one of PENDING, DISPUTED, APPROVED, WAIVED, SETTLED, VOIDED"
      - name: approver_user_id
        type: string
        source: system
        description: "X-User-ID of the ChargebackApprover that approved or waived; null while PENDING or DISPUTED"
      - name: dispute_reason
        type: string
        source: system
        description: "Customer-supplied reason recorded on PENDING -> DISPUTED"
      - name: waiver_reason
        type: string
        source: system
        description: "Approver-supplied reason recorded on waive"
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Amount recorded when the chargeback is settled; null otherwise"

  - name: RelocationOrder
    parent: null
    common_fields: true
    fields:
      - name: trailer_id
        type: string
        source: input
        description: "FK -> Trailer.id; the unit being repositioned"
      - name: origin_branch_id
        type: string
        source: system
        description: "FK -> Branch.id; snapshot of Trailer.current_branch_id at request time"
      - name: destination_branch_id
        type: string
        source: input
        description: "FK -> Branch.id; receiving yard"
      - name: status
        type: enum
        source: system
        description: "Move lifecycle"
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, REJECTED, IN_TRANSIT, COMPLETED, CANCELLED"
      - name: planned_depart_date
        type: string
        source: input
        description: "ISO date the move is planned to leave the origin yard"
      - name: planned_arrive_date
        type: string
        source: input
        description: "ISO date the move is planned to reach the destination yard"
        constraints: ">= planned_depart_date else ERR_INVALID_DATE_RANGE"
      - name: planned_miles
        type: integer
        source: input
        description: "Planned loaded miles, basis of the estimated cost variant"
        constraints: ">= 0"
      - name: actual_miles
        type: integer
        source: system
        description: "Loaded miles reported at completion; null until COMPLETED"
      - name: deadhead_miles
        type: integer
        source: system
        description: "Empty repositioning miles reported at completion; null until COMPLETED"
      - name: actual_arrive_date
        type: string
        source: system
        description: "ISO date the move actually landed; null until COMPLETED"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "relocation_cost_cents under variant estimated_planned, written at creation"
      - name: actual_cost_cents
        type: integer
        source: computed
        description: "relocation_cost_cents under variant actual_incurred, written at completion; null otherwise"
      - name: reject_reason
        type: string
        source: system
        description: "Reason recorded on REQUESTED -> REJECTED"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded on any -> CANCELLED, including the system auto-cancel cascade"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Agreement -- branching + cyclic (RESERVED <-> PENDING_ALLOCATION)
  # ---------------------------------------------------------------------------
  - entity: Agreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_INSURANCE
        trigger: "POST /fleet/agreements/{agreement_id}/submit"
        actor: Customer | FleetAdmin
        preconditions:
          - "agreement.status == DRAFT else ERR_AGREEMENT_NOT_DRAFT"
          - "product == FULL_SERVICE_LEASE implies term_months is present and >= 1 else ERR_INVALID_REQUEST"
          - "calculations.customer_risk_score variant underwriting_snapshot <= RISK_SCORE_MAX (85) else ERR_RISK_SCORE_TOO_HIGH"
        side_effects:
          - "writes Agreement.underwriting_risk_score = customer_risk_score(variant=underwriting_snapshot) for agreement.customer_id"
          - "increments Agreement.version by 1"

      - from: PENDING_INSURANCE
        to: PENDING_ALLOCATION
        trigger: "POST /fleet/agreements/{agreement_id}/verify-insurance"
        actor: FleetAdmin | BranchManager
        preconditions:
          - "agreement.status == PENDING_INSURANCE else ERR_AGREEMENT_NOT_PENDING_INSURANCE"
          - "there exists InsuranceCertificate c with c.customer_id == agreement.customer_id AND c.status == ACTIVE AND c.effective_date <= agreement.start_date AND c.expiry_date >= agreement.end_date, else ERR_INSURANCE_INVALID"
          - "that certificate has c.physical_damage_limit_cents >= TrailerType(agreement.trailer_type_id).required_physical_damage_limit_cents else ERR_INSURANCE_LIMIT_INSUFFICIENT"
        side_effects:
          - "pins Agreement.insurance_certificate_id to the qualifying certificate with the greatest expiry_date; tie-break created_at ASC"
          - "increments Agreement.version by 1"
        note: "Cross-entity guard: Agreement's forward transition is gated by InsuranceCertificate state (Difficulty Rule 7 pair Agreement<-InsuranceCertificate)."

      - from: PENDING_ALLOCATION
        to: RESERVED
        trigger: "POST /fleet/agreements/{agreement_id}/allocate (server-side selector fills every remaining unit in one call)"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "agreement.status == PENDING_ALLOCATION else ERR_AGREEMENT_NOT_PENDING_ALLOCATION"
          - "expected_agreement_version == agreement.version else ERR_STALE_VERSION"
          - "an ACTIVE RateCard exists for (agreement.branch_id, agreement.trailer_type_id, agreement.product) else ERR_RATE_CARD_NOT_FOUND"
          - "calculations.trailer_selection candidate pool for the remaining unit demand is non-empty else ERR_NO_ELIGIBLE_TRAILER"
          - "candidate pool size >= (unit_count - allocated_unit_count) else ERR_INSUFFICIENT_AVAILABILITY"
        side_effects:
          - "creates (unit_count - allocated_unit_count) AgreementUnit rows in status ALLOCATED, one per selected trailer, with planned_start_date/planned_end_date copied from the agreement"
          - "each selected Trailer.availability_status AVAILABLE -> ALLOCATED, which recomputes Branch.on_hand_count and Branch.serviceable_available_count at Trailer.current_branch_id"
          - "pins Agreement.rate_card_id to the ACTIVE RateCard"
          - "writes Agreement.quoted_total_cents = agreement_total_cents(variant=quoted_forward)"
          - "increments Agreement.version by 1"

      - from: PENDING_ALLOCATION
        to: PENDING_ALLOCATION
        trigger: "POST /fleet/agreements/{agreement_id}/units (manual attach of one named trailer)"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "agreement.status == PENDING_ALLOCATION else ERR_AGREEMENT_NOT_PENDING_ALLOCATION"
          - "expected_agreement_version == agreement.version else ERR_STALE_VERSION"
          - "allocated_unit_count < unit_count else ERR_INSUFFICIENT_AVAILABILITY"
          - "trailer.availability_status IN {AVAILABLE, ALLOCATED} else ERR_TRAILER_NOT_AVAILABLE (forward booking of an already-committed unit is permitted; ON_RENT, ON_LEASE, IN_TRANSIT, RETIRED and SOLD are not)"
          - "trailer.service_status == SERVICEABLE else ERR_TRAILER_OUT_OF_SERVICE"
          - "trailer.dot_expires_on > agreement.end_date else ERR_DOT_INSPECTION_EXPIRED"
          - "trailer.current_branch_id == agreement.branch_id else ERR_TRAILER_BRANCH_MISMATCH"
          - "no AgreementUnit on this trailer with status IN {ALLOCATED, OUT} whose half-open occupancy interval overlaps [agreement.start_date, agreement.end_date) else ERR_TRAILER_WINDOW_CONFLICT"
        side_effects:
          - "creates one AgreementUnit in status ALLOCATED"
          - "Trailer.availability_status AVAILABLE -> ALLOCATED when the trailer was AVAILABLE; when it was already ALLOCATED by an earlier non-overlapping booking the availability dimension is left unchanged. Branch counters are recomputed either way"
          - "increments Agreement.version by 1"
        note: "Stays in PENDING_ALLOCATION until the bubble-up transition below fires."

      - from: PENDING_ALLOCATION
        to: RESERVED
        trigger: "system: bubble-up evaluated at the end of POST /fleet/agreements/{agreement_id}/units when allocated_unit_count reaches unit_count"
        actor: system
        preconditions:
          - "allocated_unit_count == unit_count"
          - "an ACTIVE RateCard exists for (agreement.branch_id, agreement.trailer_type_id, agreement.product) else ERR_RATE_CARD_NOT_FOUND"
        side_effects:
          - "pins Agreement.rate_card_id to the ACTIVE RateCard"
          - "writes Agreement.quoted_total_cents = agreement_total_cents(variant=quoted_forward)"

      - from: RESERVED
        to: PENDING_ALLOCATION
        trigger: "system: an AgreementUnit of this agreement transitioned ALLOCATED -> SWAPPED_OUT because its trailer left service"
        actor: system
        preconditions:
          - "allocated_unit_count < unit_count after the unit was swapped out"
        side_effects:
          - "Agreement.rate_card_id and Agreement.quoted_total_cents are left pinned at their existing values and are NOT re-resolved on the next RESERVED entry"
        note: "This is the cycle edge (Difficulty Rule 3): RESERVED -> PENDING_ALLOCATION -> RESERVED."

      - from: RESERVED
        to: ACTIVE
        trigger: "POST /fleet/agreements/{agreement_id}/activate"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "agreement.status == RESERVED else ERR_AGREEMENT_NOT_RESERVED"
          - "every ALLOCATED AgreementUnit of this agreement has Trailer.availability_status == ALLOCATED else ERR_TRAILER_NOT_AVAILABLE (a unit forward-booked behind another agreement that is already out cannot be checked out yet)"
          - "Customer(agreement.customer_id).outstanding_chargeback_cents <= Customer.credit_limit_cents else ERR_CREDIT_LIMIT_EXCEEDED"
          - "agreement.start_date <= checkout_date < agreement.end_date else ERR_INVALID_DATE_RANGE"
        side_effects:
          - "every AgreementUnit with status ALLOCATED -> OUT, stamping checkout_date and checkout_hub_miles = Trailer.hub_miles"
          - "each such Trailer.availability_status ALLOCATED -> ON_RENT when product == SHORT_TERM_RENTAL, ALLOCATED -> ON_LEASE when product == FULL_SERVICE_LEASE, recomputing Branch.on_hand_count at Trailer.current_branch_id"
          - "increments Agreement.version by 1"

      - from: ACTIVE
        to: PENDING_SETTLEMENT
        trigger: "system: bubble-up evaluated at the end of POST /fleet/agreement-units/{agreement_unit_id}/return when every AgreementUnit of the agreement has status RETURNED"
        actor: system
        preconditions:
          - "count(AgreementUnit WHERE agreement_id == this.id AND status == OUT) == 0"
          - "count(AgreementUnit WHERE agreement_id == this.id AND status == RETURNED) >= 1"
        side_effects:
          - "increments Agreement.version by 1"

      - from: PENDING_SETTLEMENT
        to: CLOSED
        trigger: "POST /fleet/agreements/{agreement_id}/settle"
        actor: FleetAdmin
        preconditions:
          - "agreement.status == PENDING_SETTLEMENT else ERR_AGREEMENT_NOT_SETTLEABLE"
        side_effects:
          - "writes AgreementUnit.line_charge_cents, peak_days, excess_miles and drop_charge_cents on every RETURNED unit"
          - "writes Agreement.final_total_cents = agreement_total_cents(variant=final_chronological)"
          - "every AgreementUnit RETURNED -> SETTLED"
          - "when product == FULL_SERVICE_LEASE AND unit_count == 1 AND (end_date - start_date) in days >= MIN_PURCHASE_OPTION_TERM_DAYS: purchase_option_status NOT_OFFERED -> OFFERED and Agreement.purchase_option_price_cents = purchase_option_price_cents; otherwise purchase_option_status stays NOT_OFFERED and purchase_option_price_cents stays null"
          - "increments Agreement.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fleet/agreements/{agreement_id}/cancel"
        actor: Customer | BranchManager | FleetAdmin
        preconditions:
          - "agreement.status IN {DRAFT, PENDING_INSURANCE, PENDING_ALLOCATION, RESERVED} else ERR_AGREEMENT_TERMINAL"
        side_effects:
          - "records cancel_reason"
          - "increments Agreement.version by 1"

      - from: PENDING_INSURANCE
        to: CANCELLED
        trigger: "POST /fleet/agreements/{agreement_id}/cancel"
        actor: Customer | BranchManager | FleetAdmin
        preconditions:
          - "agreement.status IN {DRAFT, PENDING_INSURANCE, PENDING_ALLOCATION, RESERVED} else ERR_AGREEMENT_TERMINAL"
        side_effects:
          - "records cancel_reason"
          - "increments Agreement.version by 1"

      - from: PENDING_ALLOCATION
        to: CANCELLED
        trigger: "POST /fleet/agreements/{agreement_id}/cancel"
        actor: Customer | BranchManager | FleetAdmin
        preconditions:
          - "agreement.status IN {DRAFT, PENDING_INSURANCE, PENDING_ALLOCATION, RESERVED} else ERR_AGREEMENT_TERMINAL"
        side_effects:
          - "every AgreementUnit with status ALLOCATED -> RELEASED"
          - "each released unit's Trailer.availability_status ALLOCATED -> AVAILABLE, recomputing Branch counters"
          - "records cancel_reason"
          - "increments Agreement.version by 1"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fleet/agreements/{agreement_id}/cancel"
        actor: Customer | BranchManager | FleetAdmin
        preconditions:
          - "agreement.status IN {DRAFT, PENDING_INSURANCE, PENDING_ALLOCATION, RESERVED} else ERR_AGREEMENT_TERMINAL"
        side_effects:
          - "every AgreementUnit with status ALLOCATED -> RELEASED"
          - "each released unit's Trailer.availability_status ALLOCATED -> AVAILABLE, recomputing Branch counters"
          - "records cancel_reason"
          - "increments Agreement.version by 1"

  # ---------------------------------------------------------------------------
  # Agreement.purchase_option_status -- parallel dimension on Agreement
  # ---------------------------------------------------------------------------
  - entity: Agreement
    dimension: purchase_option_status
    initial_state: NOT_OFFERED
    terminal_states: [EXERCISED, DECLINED]
    transitions:
      - from: NOT_OFFERED
        to: OFFERED
        trigger: "system: side effect of PENDING_SETTLEMENT -> CLOSED when the lease-term eligibility test passes"
        actor: system
        preconditions:
          - "product == FULL_SERVICE_LEASE AND unit_count == 1 AND (end_date - start_date).days >= MIN_PURCHASE_OPTION_TERM_DAYS"
        side_effects:
          - "writes Agreement.purchase_option_price_cents = calculations.purchase_option_price_cents"

      - from: OFFERED
        to: EXERCISED
        trigger: "POST /fleet/agreements/{agreement_id}/exercise-purchase-option"
        actor: Customer
        preconditions:
          - "agreement.purchase_option_status == OFFERED else ERR_PURCHASE_OPTION_NOT_OFFERED"
          - "the single AgreementUnit's Trailer.availability_status == AVAILABLE else ERR_TRAILER_NOT_AVAILABLE"
        side_effects:
          - "Trailer.availability_status AVAILABLE -> SOLD, which removes it from Branch.on_hand_count and Branch.serviceable_available_count at Trailer.current_branch_id"
          - "increments Agreement.version by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /fleet/agreements/{agreement_id}/decline-purchase-option"
        actor: Customer
        preconditions:
          - "agreement.purchase_option_status == OFFERED else ERR_PURCHASE_OPTION_NOT_OFFERED"
        side_effects:
          - "Trailer availability is untouched; the unit stays AVAILABLE in the fleet"
          - "increments Agreement.version by 1"

  # ---------------------------------------------------------------------------
  # AgreementUnit
  # ---------------------------------------------------------------------------
  - entity: AgreementUnit
    dimension: status
    initial_state: ALLOCATED
    terminal_states: [SETTLED, SWAPPED_OUT, RELEASED]
    transitions:
      - from: ALLOCATED
        to: OUT
        trigger: "system: side effect of Agreement RESERVED -> ACTIVE"
        actor: system
        preconditions:
          - "parent Agreement transitioned RESERVED -> ACTIVE"
        side_effects:
          - "stamps checkout_date and checkout_hub_miles"
          - "Trailer.availability_status ALLOCATED -> ON_RENT or ON_LEASE"

      - from: OUT
        to: RETURNED
        trigger: "POST /fleet/agreement-units/{agreement_unit_id}/return"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "unit.status == OUT else ERR_UNIT_NOT_OUT"
          - "return_date > checkout_date else ERR_INVALID_DATE_RANGE"
          - "return_hub_miles >= checkout_hub_miles else ERR_INVALID_REQUEST"
        side_effects:
          - "stamps return_branch_id, return_date, return_hub_miles"
          - "Trailer.hub_miles := return_hub_miles and Trailer.current_branch_id := return_branch_id"
          - "Trailer.availability_status ON_RENT|ON_LEASE -> AVAILABLE, recomputing Branch.on_hand_count at both the old and the new current_branch_id"
          - "recomputes Trailer.service_status (a hub-mile delta >= TrailerType.pm_interval_miles since last_pm_hub_miles yields PM_DUE)"
          - "bubble-up: when no AgreementUnit of the parent agreement is left in status OUT, the Agreement transitions ACTIVE -> PENDING_SETTLEMENT"

      - from: RETURNED
        to: SETTLED
        trigger: "system: side effect of Agreement PENDING_SETTLEMENT -> CLOSED"
        actor: system
        preconditions:
          - "parent Agreement transitioned PENDING_SETTLEMENT -> CLOSED"
        side_effects:
          - "writes peak_days, excess_miles, drop_charge_cents and line_charge_cents"

      - from: ALLOCATED
        to: SWAPPED_OUT
        trigger: "system: the unit's Trailer.service_status left SERVICEABLE (OOS_DOT_EXPIRED or OOS_DAMAGE)"
        actor: system
        preconditions:
          - "unit.status == ALLOCATED"
          - "trailer.service_status != SERVICEABLE after recomputation"
        side_effects:
          - "Trailer.availability_status ALLOCATED -> AVAILABLE, but only when no other AgreementUnit on that trailer remains in status ALLOCATED or OUT; otherwise the availability dimension is left unchanged. Branch counters are recomputed either way"
          - "when the parent Agreement is RESERVED and allocated_unit_count now falls below unit_count, the Agreement transitions RESERVED -> PENDING_ALLOCATION"
        note: "Second hop of the depth-3 cascade rooted at POST /fleet/maintenance-events."

      - from: ALLOCATED
        to: RELEASED
        trigger: "system: side effect of Agreement PENDING_ALLOCATION|RESERVED -> CANCELLED"
        actor: system
        preconditions:
          - "unit.status == ALLOCATED"
        side_effects:
          - "Trailer.availability_status ALLOCATED -> AVAILABLE, but only when no other AgreementUnit on that trailer remains in status ALLOCATED or OUT; otherwise the availability dimension is left unchanged. Branch counters are recomputed either way"

  # ---------------------------------------------------------------------------
  # Trailer, dimension 1 of 2: availability_status (explicit transitions)
  # ---------------------------------------------------------------------------
  - entity: Trailer
    dimension: availability_status
    initial_state: AVAILABLE
    terminal_states: [RETIRED, SOLD]
    transitions:
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "system: side effect of Agreement allocate or manual unit attach"
        actor: system
        preconditions:
          - "trailer.availability_status == AVAILABLE"
          - "trailer.service_status == SERVICEABLE"
        note_forward_booking: "A trailer already in ALLOCATED may accept further non-overlapping manual attachments; the availability dimension simply stays ALLOCATED. It returns to AVAILABLE only when the last ALLOCATED/OUT unit on it leaves those statuses"
        side_effects:
          - "Branch.on_hand_count unchanged, Branch.serviceable_available_count at current_branch_id decreases by 1"

      - from: ALLOCATED
        to: ON_RENT
        trigger: "system: side effect of Agreement RESERVED -> ACTIVE when product == SHORT_TERM_RENTAL"
        actor: system
        preconditions:
          - "the owning AgreementUnit moved ALLOCATED -> OUT"
        side_effects:
          - "Branch.on_hand_count at current_branch_id decreases by 1"

      - from: ALLOCATED
        to: ON_LEASE
        trigger: "system: side effect of Agreement RESERVED -> ACTIVE when product == FULL_SERVICE_LEASE"
        actor: system
        preconditions:
          - "the owning AgreementUnit moved ALLOCATED -> OUT"
        side_effects:
          - "Branch.on_hand_count at current_branch_id decreases by 1"

      - from: ALLOCATED
        to: AVAILABLE
        trigger: "system: owning AgreementUnit moved ALLOCATED -> SWAPPED_OUT or ALLOCATED -> RELEASED"
        actor: system
        preconditions:
          - "the owning AgreementUnit left status ALLOCATED without being checked out"
        side_effects:
          - "Branch.serviceable_available_count at current_branch_id is recomputed"

      - from: ON_RENT
        to: AVAILABLE
        trigger: "system: side effect of AgreementUnit OUT -> RETURNED"
        actor: system
        preconditions:
          - "the owning AgreementUnit moved OUT -> RETURNED"
        side_effects:
          - "current_branch_id := AgreementUnit.return_branch_id; hub_miles := AgreementUnit.return_hub_miles"
          - "Branch.on_hand_count at the new current_branch_id increases by 1"

      - from: ON_LEASE
        to: AVAILABLE
        trigger: "system: side effect of AgreementUnit OUT -> RETURNED"
        actor: system
        preconditions:
          - "the owning AgreementUnit moved OUT -> RETURNED"
        side_effects:
          - "current_branch_id := AgreementUnit.return_branch_id; hub_miles := AgreementUnit.return_hub_miles"
          - "Branch.on_hand_count at the new current_branch_id increases by 1"

      - from: AVAILABLE
        to: IN_TRANSIT
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/dispatch"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == APPROVED else ERR_RELOCATION_NOT_APPROVED"
          - "trailer.availability_status == AVAILABLE else ERR_TRAILER_NOT_AVAILABLE"
          - "trailer.service_status == SERVICEABLE else ERR_TRAILER_OUT_OF_SERVICE"
        side_effects:
          - "Branch.on_hand_count at origin_branch_id decreases by 1 while current_branch_id stays at the origin"
        note: "Cross-entity guard: RelocationOrder's forward transition is gated by Trailer state (Difficulty Rule 7 pair RelocationOrder<-Trailer)."

      - from: IN_TRANSIT
        to: AVAILABLE
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/complete (current_branch_id := destination) or POST /fleet/relocation-orders/{relocation_order_id}/abort (current_branch_id stays at origin)"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == IN_TRANSIT else ERR_RELOCATION_NOT_IN_TRANSIT"
        side_effects:
          - "Branch.on_hand_count at the resulting current_branch_id increases by 1"

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /fleet/trailers/{trailer_id}/retire"
        actor: FleetAdmin
        preconditions:
          - "trailer.availability_status == AVAILABLE else ERR_TRAILER_NOT_AVAILABLE"
        side_effects:
          - "records retired_reason; the unit leaves Branch.on_hand_count and every availability pool"

      - from: AVAILABLE
        to: SOLD
        trigger: "system: side effect of Agreement purchase_option_status OFFERED -> EXERCISED"
        actor: system
        preconditions:
          - "trailer.availability_status == AVAILABLE"
        side_effects:
          - "the unit leaves Branch.on_hand_count and every availability pool"

  # ---------------------------------------------------------------------------
  # Trailer, dimension 2 of 2: service_status (derived, precedence-ordered)
  # ---------------------------------------------------------------------------
  - entity: Trailer
    dimension: service_status
    initial_state: SERVICEABLE
    terminal_states: []
    transitions:
      - from: SERVICEABLE
        to: OOS_DOT_EXPIRED
        trigger: "POST /fleet/maintenance-events with event_type == DOT_INSPECTION and passed == false, or any recomputation once clock_date >= dot_expires_on"
        actor: Inspector | FleetAdmin | system
        preconditions:
          - "last_dot_passed == false OR clock_date >= dot_expires_on"
        side_effects:
          - "every AgreementUnit on this trailer with status ALLOCATED transitions ALLOCATED -> SWAPPED_OUT"
        note: "First hop of the depth-3 cascade: maintenance event -> service_status -> AgreementUnit -> Agreement."

      - from: OOS_DOT_EXPIRED
        to: SERVICEABLE
        trigger: "POST /fleet/maintenance-events with event_type == DOT_INSPECTION and passed == true"
        actor: Inspector | FleetAdmin
        preconditions:
          - "damage_points < OOS_DAMAGE_POINT_THRESHOLD"
          - "hub_miles - last_pm_hub_miles < TrailerType.pm_interval_miles"
        side_effects:
          - "last_dot_inspection_date := performed_on; dot_expires_on recomputed; last_dot_passed := true"

      - from: SERVICEABLE
        to: OOS_DAMAGE
        trigger: "system: recomputation after POST /fleet/damage-assessments/{damage_assessment_id}/submit raises damage_points"
        actor: system
        preconditions:
          - "last_dot_passed == true AND clock_date < dot_expires_on"
          - "damage_points >= OOS_DAMAGE_POINT_THRESHOLD"
        side_effects:
          - "every RelocationOrder on this trailer with status IN {REQUESTED, APPROVED} transitions to CANCELLED with cancel_reason 'TRAILER_OUT_OF_SERVICE'"
          - "every AgreementUnit on this trailer with status ALLOCATED transitions ALLOCATED -> SWAPPED_OUT"
        note: "Third hop of the depth-4 cascade rooted at damage-assessment submit."

      - from: OOS_DAMAGE
        to: SERVICEABLE
        trigger: "system: recomputation after POST /fleet/chargebacks/{chargeback_id}/waive rejects the assessment, or after POST /fleet/maintenance-events with event_type == DAMAGE_REPAIR moves the watermark"
        actor: system
        preconditions:
          - "damage_points < OOS_DAMAGE_POINT_THRESHOLD after recomputation"
          - "last_dot_passed == true AND clock_date < dot_expires_on"
          - "hub_miles - last_pm_hub_miles < TrailerType.pm_interval_miles"
        side_effects:
          - "Branch.serviceable_available_count at current_branch_id is recomputed"

      - from: SERVICEABLE
        to: PM_DUE
        trigger: "system: recomputation after AgreementUnit OUT -> RETURNED raises hub_miles"
        actor: system
        preconditions:
          - "last_dot_passed == true AND clock_date < dot_expires_on"
          - "damage_points < OOS_DAMAGE_POINT_THRESHOLD"
          - "hub_miles - last_pm_hub_miles >= TrailerType.pm_interval_miles"
        side_effects:
          - "Branch.serviceable_available_count at current_branch_id is recomputed"

      - from: PM_DUE
        to: SERVICEABLE
        trigger: "POST /fleet/maintenance-events with event_type == PM_SERVICE"
        actor: Inspector | FleetAdmin
        preconditions:
          - "last_dot_passed == true AND clock_date < dot_expires_on"
          - "damage_points < OOS_DAMAGE_POINT_THRESHOLD"
        side_effects:
          - "last_pm_hub_miles := hub_miles_at_event"

  # ---------------------------------------------------------------------------
  # InsuranceCertificate
  # ---------------------------------------------------------------------------
  - entity: InsuranceCertificate
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazily evaluated on every read of the certificate and on every reference from Agreement insurance verification"
        actor: system
        preconditions:
          - "clock_date > expiry_date"
        side_effects:
          - "certificate no longer qualifies any Agreement for PENDING_INSURANCE -> PENDING_ALLOCATION"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /fleet/insurance-certificates/{certificate_id}/revoke"
        actor: FleetAdmin
        preconditions:
          - "certificate.status == ACTIVE else ERR_CERTIFICATE_NOT_ACTIVE"
        side_effects:
          - "records revoked_reason"
          - "Agreements already pinned to this certificate keep their pinned insurance_certificate_id; only future verifications are affected"

      - from: EXPIRED
        to: REVOKED
        trigger: "POST /fleet/insurance-certificates/{certificate_id}/revoke"
        actor: FleetAdmin
        preconditions:
          - "certificate.status == ACTIVE else ERR_CERTIFICATE_NOT_ACTIVE"
        note: "Unreachable in practice: an EXPIRED certificate fails the ACTIVE precondition and returns ERR_CERTIFICATE_NOT_ACTIVE."

  # ---------------------------------------------------------------------------
  # DamageAssessment
  # ---------------------------------------------------------------------------
  - entity: DamageAssessment
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleet/damage-assessments/{damage_assessment_id}/submit"
        actor: Inspector
        preconditions:
          - "assessment.status == DRAFT else ERR_ASSESSMENT_NOT_DRAFT"
          - "the assessed AgreementUnit.status IN {RETURNED, SETTLED} else ERR_UNIT_NOT_RETURNED"
          - "when supersedes_assessment_id is set, that assessment has status == SUBMITTED else ERR_ASSESSMENT_SUPERSEDED"
        side_effects:
          - "computes assessed_amount_cents, insured_portion_cents, customer_liable_cents, admin_fee_cents and damage_points"
          - "creates one Chargeback in status PENDING with amount_cents = customer_liable_cents + admin_fee_cents"
          - "the newly PENDING chargeback raises Customer.outstanding_chargeback_cents by amount_cents"
          - "Trailer.damage_points is recomputed and rises by this assessment's damage_points"
          - "when supersedes_assessment_id is set: the superseded assessment SUBMITTED -> SUPERSEDED and its Chargeback PENDING|DISPUTED -> VOIDED"
          - "Trailer.service_status is recomputed; crossing OOS_DAMAGE_POINT_THRESHOLD moves it SERVICEABLE -> OOS_DAMAGE"

      - from: SUBMITTED
        to: APPROVED
        trigger: "system: side effect of POST /fleet/chargebacks/{chargeback_id}/approve"
        actor: system
        preconditions:
          - "the assessment's Chargeback transitioned PENDING -> APPROVED"
        side_effects:
          - "damage_points stay counted against the Trailer"

      - from: SUBMITTED
        to: REJECTED
        trigger: "system: side effect of POST /fleet/chargebacks/{chargeback_id}/waive"
        actor: system
        preconditions:
          - "the assessment's Chargeback transitioned PENDING|DISPUTED -> WAIVED"
        side_effects:
          - "Trailer.damage_points is recomputed and drops by this assessment's damage_points"
          - "Trailer.service_status is recomputed; dropping below OOS_DAMAGE_POINT_THRESHOLD moves it OOS_DAMAGE -> SERVICEABLE"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer assessment on the same AgreementUnit citing this row in supersedes_assessment_id was submitted"
        actor: system
        preconditions:
          - "assessment.status == SUBMITTED"
        side_effects:
          - "its Chargeback PENDING|DISPUTED -> VOIDED, lowering Customer.outstanding_chargeback_cents by that chargeback's amount_cents"
          - "Trailer.damage_points is recomputed and drops by this assessment's damage_points"

  # ---------------------------------------------------------------------------
  # Chargeback -- cyclic (PENDING <-> DISPUTED)
  # ---------------------------------------------------------------------------
  - entity: Chargeback
    dimension: status
    initial_state: PENDING
    terminal_states: [WAIVED, SETTLED, VOIDED]
    transitions:
      - from: PENDING
        to: DISPUTED
        trigger: "POST /fleet/chargebacks/{chargeback_id}/dispute"
        actor: Customer
        preconditions:
          - "chargeback.status == PENDING else ERR_CHARGEBACK_NOT_PENDING"
          - "X-User-ID == chargeback.customer_id else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "records dispute_reason; amount_cents stays counted in Customer.outstanding_chargeback_cents"
          - "increments Chargeback.version by 1"

      - from: DISPUTED
        to: PENDING
        trigger: "POST /fleet/chargebacks/{chargeback_id}/reopen"
        actor: ChargebackApprover
        preconditions:
          - "chargeback.status == DISPUTED else ERR_CHARGEBACK_NOT_DISPUTED"
        side_effects:
          - "clears dispute_reason; the chargeback becomes approvable or waivable again"
          - "increments Chargeback.version by 1"
        note: "This is the cycle edge (Difficulty Rule 3): PENDING -> DISPUTED -> PENDING."

      - from: PENDING
        to: APPROVED
        trigger: "POST /fleet/chargebacks/{chargeback_id}/approve"
        actor: ChargebackApprover
        preconditions:
          - "chargeback.status == PENDING else ERR_CHARGEBACK_NOT_PENDING"
          - "X-User-ID != DamageAssessment(chargeback.damage_assessment_id).assessor_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records approver_user_id"
          - "the linked DamageAssessment SUBMITTED -> APPROVED"
          - "amount_cents stays counted in Customer.outstanding_chargeback_cents"
          - "increments Chargeback.version by 1"

      - from: PENDING
        to: WAIVED
        trigger: "POST /fleet/chargebacks/{chargeback_id}/waive"
        actor: ChargebackApprover
        preconditions:
          - "chargeback.status IN {PENDING, DISPUTED} else ERR_CHARGEBACK_TERMINAL"
          - "X-User-ID != DamageAssessment(chargeback.damage_assessment_id).assessor_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records approver_user_id and waiver_reason"
          - "the linked DamageAssessment SUBMITTED -> REJECTED"
          - "Customer.outstanding_chargeback_cents drops by amount_cents"
          - "Trailer.damage_points and Trailer.service_status are recomputed"
          - "increments Chargeback.version by 1"

      - from: DISPUTED
        to: WAIVED
        trigger: "POST /fleet/chargebacks/{chargeback_id}/waive"
        actor: ChargebackApprover
        preconditions:
          - "chargeback.status IN {PENDING, DISPUTED} else ERR_CHARGEBACK_TERMINAL"
          - "X-User-ID != DamageAssessment(chargeback.damage_assessment_id).assessor_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records approver_user_id and waiver_reason"
          - "the linked DamageAssessment SUBMITTED -> REJECTED"
          - "Customer.outstanding_chargeback_cents drops by amount_cents"
          - "Trailer.damage_points and Trailer.service_status are recomputed"
          - "increments Chargeback.version by 1"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /fleet/chargebacks/{chargeback_id}/record-payment"
        actor: FleetAdmin
        preconditions:
          - "chargeback.status == APPROVED else ERR_CHARGEBACK_NOT_APPROVED"
          - "paid_amount_cents == chargeback.amount_cents else ERR_INVALID_REQUEST"
        side_effects:
          - "records paid_amount_cents; Customer.outstanding_chargeback_cents drops by amount_cents"
          - "increments Chargeback.version by 1"

      - from: PENDING
        to: VOIDED
        trigger: "system: the linked DamageAssessment was superseded by a newer assessment"
        actor: system
        preconditions:
          - "chargeback.status IN {PENDING, DISPUTED}"
        side_effects:
          - "Customer.outstanding_chargeback_cents drops by amount_cents"

      - from: DISPUTED
        to: VOIDED
        trigger: "system: the linked DamageAssessment was superseded by a newer assessment"
        actor: system
        preconditions:
          - "chargeback.status IN {PENDING, DISPUTED}"
        side_effects:
          - "Customer.outstanding_chargeback_cents drops by amount_cents"

  # ---------------------------------------------------------------------------
  # RelocationOrder -- branching
  # ---------------------------------------------------------------------------
  - entity: RelocationOrder
    dimension: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/approve"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == REQUESTED else ERR_RELOCATION_NOT_REQUESTED"
          - "when acting as BranchManager, X-User-ID == destination_branch_id else ERR_NOT_RESOURCE_OWNER"
          - "destination yard inbound capacity holds per calculations.branch_inbound_capacity else ERR_BRANCH_YARD_CAPACITY_EXCEEDED"
        side_effects:
          - "the order now occupies an inbound closed-interval window at the destination branch"
          - "increments RelocationOrder.version by 1"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/reject"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == REQUESTED else ERR_RELOCATION_NOT_REQUESTED"
        side_effects:
          - "records reject_reason; no trailer or branch counters change"
          - "increments RelocationOrder.version by 1"

      - from: APPROVED
        to: IN_TRANSIT
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/dispatch"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == APPROVED else ERR_RELOCATION_NOT_APPROVED"
          - "Trailer.availability_status == AVAILABLE else ERR_TRAILER_NOT_AVAILABLE"
          - "Trailer.service_status == SERVICEABLE else ERR_TRAILER_OUT_OF_SERVICE"
        side_effects:
          - "Trailer.availability_status AVAILABLE -> IN_TRANSIT"
          - "Branch.on_hand_count at origin_branch_id decreases by 1"
          - "increments RelocationOrder.version by 1"

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/complete"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == IN_TRANSIT else ERR_RELOCATION_NOT_IN_TRANSIT"
          - "actual_arrive_date >= planned_depart_date else ERR_INVALID_DATE_RANGE"
        side_effects:
          - "writes actual_miles, deadhead_miles, actual_arrive_date and actual_cost_cents = relocation_cost_cents(variant=actual_incurred)"
          - "Trailer.current_branch_id := destination_branch_id and Trailer.availability_status IN_TRANSIT -> AVAILABLE"
          - "Branch.on_hand_count at destination_branch_id increases by 1"
          - "increments RelocationOrder.version by 1"

      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /fleet/relocation-orders/{relocation_order_id}/abort"
        actor: BranchManager | FleetAdmin
        preconditions:
          - "relocation.status == IN_TRANSIT else ERR_RELOCATION_NOT_IN_TRANSIT"
        side_effects:
          - "records cancel_reason; actual_cost_cents stays null"
          - "Trailer.availability_status IN_TRANSIT -> AVAILABLE with current_branch_id unchanged at origin_branch_id"
          - "Branch.on_hand_count at origin_branch_id increases by 1, exactly reversing the dispatch debit"
          - "increments RelocationOrder.version by 1"
        note: "Compensating action for dispatch; conserves the global fleet-position quantity (Difficulty Rule 9)."

      - from: REQUESTED
        to: CANCELLED
        trigger: "system: the trailer's service_status left SERVICEABLE for OOS_DAMAGE"
        actor: system
        preconditions:
          - "relocation.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "records cancel_reason 'TRAILER_OUT_OF_SERVICE'"

      - from: APPROVED
        to: CANCELLED
        trigger: "system: the trailer's service_status left SERVICEABLE for OOS_DAMAGE"
        actor: system
        preconditions:
          - "relocation.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "records cancel_reason 'TRAILER_OUT_OF_SERVICE'"
          - "the order releases its inbound capacity window at the destination branch"
        note: "Fourth hop of the depth-4 cascade rooted at POST /fleet/damage-assessments/{id}/submit."

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` -- the only sanctioned
#       write-write conflict mechanism in this scaffold)
# =============================================================================
concurrency_rules:
  - rule_id: unit-attach-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /fleet/agreements/{agreement_id}/units"
    occ_field: "expected_agreement_version"
    description: |
      Attaching a trailer to an Agreement whose version has advanced since the
      caller last read it is rejected. A second attach against the same
      PENDING_ALLOCATION agreement is legitimate product behaviour while
      allocated_unit_count is still below unit_count, so no state precondition
      can catch a caller whose view of the agreement is stale; only the version
      check can.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocate-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /fleet/agreements/{agreement_id}/allocate"
    occ_field: "expected_agreement_version"
    description: |
      Running the server-side selector against an Agreement whose version has
      advanced since the caller last read it is rejected. The selector's result
      depends on how many units are already attached and on which trailers are
      still AVAILABLE; a caller holding a stale agreement view would silently
      request a different fill quantity than intended.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ratecard-create-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /fleet/rate-cards"
    occ_field: "expected_branch_version"
    description: |
      Publishing a RateCard for a Branch whose version has advanced since the
      caller last read it is rejected. Publishing a card legitimately supersedes
      the prior ACTIVE card for the same (branch, trailer type, product) triple,
      so a later publish would otherwise silently overwrite pricing the caller
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-unit
    parent_entity: AgreementUnit
    write_endpoint: "POST /fleet/agreement-units/{agreement_unit_id}/damage-assessments"
    occ_field: "expected_agreement_unit_version"
    description: |
      Opening a damage assessment against an AgreementUnit whose version has
      advanced since the caller last read it is rejected. A re-inspection that
      supersedes an earlier assessment on the same unit is legitimate product
      behaviour, so no state precondition rejects the second author; the version
      check is what tells the second Inspector their view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: agreement_total_cents
    trigger: "variant quoted_forward runs on Agreement PENDING_ALLOCATION -> RESERVED (both the allocate path and the unit-attach bubble-up path) and writes Agreement.quoted_total_cents; variant final_chronological runs on Agreement PENDING_SETTLEMENT -> CLOSED and writes Agreement.final_total_cents plus every AgreementUnit.line_charge_cents"
    algorithm: forward_looking | chronological
    input_set: |
      Both variants read exactly one RateCard: the card pinned in Agreement.rate_card_id (never re-resolved).
      Peak days always come from the Agreement's own branch (Agreement.branch_id), never from the return branch.
      quoted_forward reads only Agreement fields (start_date, end_date, unit_count) and ignores every AgreementUnit row.
      final_chronological reads only AgreementUnit rows with status == RETURNED at the moment of settlement;
      units in status SWAPPED_OUT and RELEASED are excluded and contribute nothing.
    constants:
      DROP_CHARGE_CENTS: 35000
      MILEAGE_PRORATION_DAYS: 30
    precision: "All money in integer cents. round_half_up wherever a rounding step is named; no other rounding occurs."
    formula: |
      # ---- shared helpers -------------------------------------------------
      rate      = RateCard(Agreement.rate_card_id)
      branch    = Branch(Agreement.branch_id)
      peak_rate = rate.daily_rate_cents * (1 + rate.peak_uplift_pct)
      peak_days(a, b) = count of calendar days d with a <= d < b
                        AND branch.peak_season_start_date <= d <= branch.peak_season_end_date
      # the branch peak window is ONE explicit date range, not a recurring annual pattern

      # ---- variant quoted_forward -----------------------------------------
      term_days      = (Agreement.end_date - Agreement.start_date) in days       # half-open
      pk             = peak_days(Agreement.start_date, Agreement.end_date)
      off            = term_days - pk
      per_unit_cents = round_half_up(rate.daily_rate_cents * off + peak_rate * pk)
      quoted_total_cents = per_unit_cents * Agreement.unit_count
      # forward-looking assumptions, pinned: zero excess mileage, zero drop charge,
      # every unit runs the full planned window, unit_count units are billed.

      # ---- variant final_chronological -------------------------------------
      for each AgreementUnit u with u.status == RETURNED, walked in ascending u.created_at:
          days_out       = (u.return_date - u.checkout_date) in days             # half-open, >= 1
          u.peak_days    = peak_days(u.checkout_date, u.return_date)
          off_days       = days_out - u.peak_days
          base           = rate.daily_rate_cents * off_days + peak_rate * u.peak_days
          included_miles = floor(rate.mileage_included_per_month * days_out / MILEAGE_PRORATION_DAYS)
          u.excess_miles = max(0, (u.return_hub_miles - u.checkout_hub_miles) - included_miles)
          mileage_charge = u.excess_miles * rate.excess_mileage_rate_cents_per_mile
          u.drop_charge_cents = (u.return_branch_id != Agreement.branch_id) ? DROP_CHARGE_CENTS : 0
          u.line_charge_cents = round_half_up(base + mileage_charge + u.drop_charge_cents)   # ROUND PER LINE
      final_total_cents = sum(u.line_charge_cents over those units)                          # THEN SUM
      # ROUNDING ORDER IS PINNED: round each unit line to whole cents FIRST, then sum the
      # rounded lines. Summing the unrounded lines and rounding once at the end is WRONG.
    variants:
      - name: quoted_forward
        when: "Agreement first reaches RESERVED; the number written to Agreement.quoted_total_cents"
        difference: "Prices the PLANNED window for unit_count units at the pinned card, assuming zero excess mileage and zero drop charge. Never reads AgreementUnit rows."
      - name: final_chronological
        when: "Agreement PENDING_SETTLEMENT -> CLOSED; the number written to Agreement.final_total_cents"
        difference: "Walks each RETURNED AgreementUnit's ACTUAL [checkout_date, return_date) window, adds prorated excess mileage and a one-way drop charge, rounds per line, then sums. Diverges from quoted_forward whenever a unit returns early/late, crosses a different number of peak days, exceeds its mileage inclusion, or is dropped at a foreign yard."

  - name: customer_risk_score
    trigger: "variant underwriting_snapshot runs on Agreement DRAFT -> PENDING_INSURANCE and is frozen into Agreement.underwriting_risk_score; variant renewal_review runs on GET /fleet/customers/{customer_id}/risk-review and is never persisted"
    algorithm: weighted_scoring
    input_set: |
      Both variants read Chargeback rows with customer_id == the subject Customer and DamageAssessment rows
      reachable from that customer's AgreementUnits. The two variants differ ONLY in which statuses enter the
      sums and in whether an age decay is applied.
    constants:
      BASE_BY_TIER: { A: 10, B: 25, C: 45 }
      CHARGEBACK_POINTS_PER_10000_CENTS: 2
      ASSESSMENT_POINTS_EACH: 3
      SCORE_FLOOR: 0
      SCORE_CAP: 100
      RISK_SCORE_MAX: 85
      DECAY_AGE_DAYS: 180
    precision: "Integer points. floor() on the cents-to-points conversion; floor() again after halving a decayed amount."
    formula: |
      base = BASE_BY_TIER[Customer.credit_tier]

      # ---- variant underwriting_snapshot ----------------------------------
      cb_sum  = sum(cb.amount_cents for cb where cb.customer_id == c.id AND cb.status IN {APPROVED, SETTLED})
      n_assess = count(DamageAssessment a where a's AgreementUnit belongs to an Agreement of this customer
                       AND a.status == APPROVED)
      score = base + floor(cb_sum / 10000) * CHARGEBACK_POINTS_PER_10000_CENTS
                   + n_assess * ASSESSMENT_POINTS_EACH
      underwriting_risk_score = min(SCORE_CAP, max(SCORE_FLOOR, score))

      # ---- variant renewal_review -----------------------------------------
      for each cb where cb.customer_id == c.id AND cb.status IN {PENDING, DISPUTED, APPROVED, SETTLED}:
          age_days = (clock_date - date(cb.created_at)) in days
          weighted = (age_days > DECAY_AGE_DAYS) ? floor(cb.amount_cents / 2) : cb.amount_cents
      cb_sum  = sum(weighted over those chargebacks)
      n_assess = count(DamageAssessment a where a's AgreementUnit belongs to an Agreement of this customer
                       AND a.status IN {SUBMITTED, APPROVED})
      score = base + floor(cb_sum / 10000) * CHARGEBACK_POINTS_PER_10000_CENTS
                   + n_assess * ASSESSMENT_POINTS_EACH
      renewal_risk_score = min(SCORE_CAP, max(SCORE_FLOOR, score))
    variants:
      - name: underwriting_snapshot
        when: "Agreement DRAFT -> PENDING_INSURANCE; gates the transition against RISK_SCORE_MAX"
        difference: "Counts only chargebacks the lessor has already adjudicated (APPROVED, SETTLED) and only APPROVED assessments. No age decay. Deliberately blind to unadjudicated exposure."
      - name: renewal_review
        when: "GET /fleet/customers/{customer_id}/risk-review; an advisory number for renewal desks"
        difference: "Also counts PENDING and DISPUTED chargebacks and SUBMITTED assessments, and halves the weight of any chargeback older than DECAY_AGE_DAYS. For identical data with an unadjudicated chargeback outstanding, this variant returns a strictly higher score than underwriting_snapshot."

  - name: relocation_cost_cents
    trigger: "variant estimated_planned runs on POST /fleet/relocation-orders and writes RelocationOrder.estimated_cost_cents; variant actual_incurred runs on RelocationOrder IN_TRANSIT -> COMPLETED and writes RelocationOrder.actual_cost_cents"
    algorithm: tiered_pricing
    input_set: "One RelocationOrder row. estimated_planned uses planned_miles with deadhead treated as 0; actual_incurred uses actual_miles and deadhead_miles as reported at completion."
    constants:
      BASE_DISPATCH_FEE_CENTS: 15000
      BAND1_MAX_MILES: 250
      BAND1_RATE_CENTS_PER_MILE: 260
      BAND2_MAX_MILES: 600
      BAND2_RATE_CENTS_PER_MILE: 215
      BAND3_RATE_CENTS_PER_MILE: 185
      DEADHEAD_RATE_CENTS_PER_MILE: 130
      FUEL_SURCHARGE_PCT: 0.07
      FUEL_SURCHARGE_MILE_THRESHOLD: 500
      MIN_CHARGE_CENTS: 40000
    precision: "Integer cents; round_half_up on the fuel surcharge only."
    formula: |
      band_cost(m) = BAND1_RATE * min(m, BAND1_MAX)
                   + BAND2_RATE * max(0, min(m, BAND2_MAX) - BAND1_MAX)
                   + BAND3_RATE * max(0, m - BAND2_MAX)                       # marginal, not average
      subtotal  = BASE_DISPATCH_FEE_CENTS + band_cost(miles) + deadhead * DEADHEAD_RATE_CENTS_PER_MILE
      surcharge = ((miles + deadhead) > FUEL_SURCHARGE_MILE_THRESHOLD)
                    ? round_half_up(subtotal * FUEL_SURCHARGE_PCT) : 0
      cost      = max(MIN_CHARGE_CENTS, subtotal + surcharge)
      # THREE interacting inputs (miles, deadhead, the strict > threshold on their SUM) and
      # two nested max/min layers: the marginal band waterfall inside, the MIN_CHARGE floor outside.
      # The threshold is strict: exactly 500 combined miles does NOT surcharge, 501 does.
    variants:
      - name: estimated_planned
        when: "RelocationOrder creation"
        difference: "miles = planned_miles, deadhead = 0. Written to estimated_cost_cents and never revised."
      - name: actual_incurred
        when: "RelocationOrder IN_TRANSIT -> COMPLETED"
        difference: "miles = actual_miles, deadhead = deadhead_miles. Deadhead can push the combined mileage across FUEL_SURCHARGE_MILE_THRESHOLD even when the loaded miles alone would not, so the actual cost can exceed the estimate by more than the mileage delta implies."

  - name: damage_liability_cents
    trigger: "runs on DamageAssessment DRAFT -> SUBMITTED; writes assessed_amount_cents, insured_portion_cents, customer_liable_cents, admin_fee_cents and damage_points, and fixes the created Chargeback.amount_cents"
    algorithm: waterfall_allocation
    input_set: |
      The assessment's own line_items array; Customer.credit_tier of the customer on the assessed unit's Agreement;
      and the InsuranceCertificate pinned in that Agreement.insurance_certificate_id. When
      Agreement.insurance_certificate_id is null, or that certificate's status is not ACTIVE at the moment of
      submission, the insured portion is 0 and the customer carries the entire assessed amount.
    constants:
      SEVERITY_MULTIPLIER: { MINOR: 1.00, MODERATE: 1.25, MAJOR: 1.60 }
      SEVERITY_POINTS: { MINOR: 3, MODERATE: 8, MAJOR: 15 }
      DEDUCTIBLE_BY_TIER: { A: 100000, B: 150000, C: 250000 }
      ADMIN_FEE_PCT: 0.08
    precision: "Integer cents; round_half_up per line item and once again on the admin fee."
    formula: |
      assessed_amount_cents = sum over li in line_items of
                              round_half_up(li.quantity * li.unit_cost_cents * SEVERITY_MULTIPLIER[li.severity])
      damage_points         = sum over li in line_items of SEVERITY_POINTS[li.severity] * li.quantity
      deductible            = DEDUCTIBLE_BY_TIER[Customer.credit_tier]
      cert                  = InsuranceCertificate(Agreement.insurance_certificate_id) or null
      limit                 = (cert is not null AND cert.status == ACTIVE) ? cert.physical_damage_limit_cents : 0
      insured_portion_cents = min(max(assessed_amount_cents - deductible, 0), limit)
      customer_liable_cents = assessed_amount_cents - insured_portion_cents
      admin_fee_cents       = round_half_up(customer_liable_cents * ADMIN_FEE_PCT)
      Chargeback.amount_cents = customer_liable_cents + admin_fee_cents
      # Deductible is absorbed by the customer FIRST, then the carrier pays up to its limit,
      # then anything above the limit falls back on the customer.

  - name: trailer_service_status
    trigger: "recomputed on trailer creation, on POST /fleet/maintenance-events, on AgreementUnit OUT -> RETURNED, on DamageAssessment DRAFT -> SUBMITTED, on Chargeback waive, and on every read of the Trailer"
    algorithm: constraint_propagation
    input_set: "One Trailer row plus its TrailerType, its DamageAssessments and the logical clock date."
    constants:
      OOS_DAMAGE_POINT_THRESHOLD: 25
    precision: "Enum-valued; evaluated first-match-wins in the order below."
    formula: |
      damage_points = sum(a.damage_points) over DamageAssessment a where
                        a.trailer_id == t.id
                        AND a.status IN {SUBMITTED, APPROVED}
                        AND (t.last_damage_repair_at IS NULL OR a.created_at > t.last_damage_repair_at)

      # PRECEDENCE IS PINNED - first matching clause wins, later clauses are not evaluated:
      1. OOS_DOT_EXPIRED  if t.last_dot_passed == false OR clock_date >= t.dot_expires_on
      2. OOS_DAMAGE       if damage_points >= OOS_DAMAGE_POINT_THRESHOLD
      3. PM_DUE           if t.hub_miles - t.last_pm_hub_miles >= TrailerType.pm_interval_miles
      4. SERVICEABLE      otherwise
      # The DOT boundary is INCLUSIVE: on the exact dot_expires_on date the trailer is already expired.
      # The damage boundary is INCLUSIVE: exactly OOS_DAMAGE_POINT_THRESHOLD points puts it out of service,
      # one point less does not.
      dot_expires_on = t.last_dot_inspection_date + TrailerType.dot_inspection_interval_days days

  - name: trailer_selection
    trigger: "runs on POST /fleet/agreements/{agreement_id}/allocate to choose which trailers fill the remaining unit demand"
    algorithm: topological
    input_set: "Trailer rows at the agreement's branch; the agreement's window; the branch peak window and lease_reserve_pct."
    constants: {}
    precision: "Deterministic ordering; no random input participates."
    formula: |
      need = Agreement.unit_count - Agreement.allocated_unit_count

      # (a) ELIGIBILITY FILTER - explicit predicate, no fuzzy adjectives
      eligible = { Trailer t :
            t.current_branch_id  == Agreement.branch_id
        AND t.trailer_type_id    == Agreement.trailer_type_id
        AND t.availability_status == AVAILABLE     # the auto-selector only takes idle units;
                                                    # forward booking of an ALLOCATED unit is
                                                    # reachable only through manual unit attach
        AND t.service_status      == SERVICEABLE
        AND t.dot_expires_on      >  Agreement.end_date
        AND NOT EXISTS AgreementUnit u ON t WITH u.status IN {ALLOCATED, OUT}
              AND [u.planned_start_date, u.planned_end_date) overlaps
                  [Agreement.start_date, Agreement.end_date)          # half-open overlap
      }

      # (b) RANKING EXPRESSION - lowest-utilisation unit goes out first
      ranked = eligible ORDER BY t.hub_miles ASC,
                                 t.dot_expires_on DESC,
      # (c) TIE-BREAK
                                 t.created_at ASC          # never t.id

      # (d) PEAK-SEASON LEASE RESERVE - applies only to SHORT_TERM_RENTAL and only when the
      #     agreement window intersects the branch peak window
      intersects_peak = [Agreement.start_date, Agreement.end_date) intersects
                        [branch.peak_season_start_date, branch.peak_season_end_date]
      if Agreement.product == SHORT_TERM_RENTAL AND intersects_peak:
          reserved_count = ceil(len(ranked) * branch.lease_reserve_pct)
          pool = ranked[reserved_count:]      # the TOP-ranked units are held back for lease demand
      else:
          pool = ranked

      # (e) FALLBACK when the pool cannot satisfy demand
      if len(pool) == 0:      reject with ERR_NO_ELIGIBLE_TRAILER
      if len(pool) < need:    reject with ERR_INSUFFICIENT_AVAILABILITY
      selected = pool[0:need]

  - name: branch_allocation_availability
    trigger: "runs on GET /fleet/branches/{branch_id}/availability and inside calculations.trailer_selection step (d) when POST /fleet/agreements/{agreement_id}/allocate builds its candidate pool"
    algorithm: aggregation
    input_set: |
      Trailer rows with current_branch_id == the branch and trailer_type_id == the requested type.
      Only trailers with availability_status == AVAILABLE AND service_status == SERVICEABLE enter
      serviceable_available_count; on_hand_count additionally counts trailers in ALLOCATED.
    constants: {}
    precision: "Integer counts; ceil() on the reserve so any non-zero reserve percentage holds back at least one unit."
    formula: |
      on_hand_count               = count(Trailer WHERE current_branch_id == b.id
                                          AND availability_status IN {AVAILABLE, ALLOCATED})
      serviceable_available_count = count(Trailer WHERE current_branch_id == b.id
                                          AND trailer_type_id == requested type
                                          AND availability_status == AVAILABLE
                                          AND service_status == SERVICEABLE)
      intersects_peak = [window_start_date, window_end_date) intersects
                        [b.peak_season_start_date, b.peak_season_end_date]
      if product == SHORT_TERM_RENTAL AND intersects_peak:
          lease_reserved_count  = ceil(serviceable_available_count * b.lease_reserve_pct)
      else:
          lease_reserved_count  = 0
      rental_available_count    = serviceable_available_count - lease_reserved_count
      inbound_committed_count   = count(RelocationOrder WHERE destination_branch_id == b.id
                                        AND status IN {APPROVED, IN_TRANSIT})
      # When window_start_date / window_end_date are omitted the endpoint uses the branch's own
      # peak window, so intersects_peak is true and the reserve is reported.

  - name: branch_inbound_capacity
    trigger: "runs on RelocationOrder REQUESTED -> APPROVED and on GET /fleet/branches/{branch_id}/availability"
    algorithm: interval_merge
    input_set: "RelocationOrder rows with destination_branch_id == the destination branch and status IN {APPROVED, IN_TRANSIT}, plus the destination Branch's on_hand_count and yard_capacity."
    constants:
      INBOUND_BUFFER_DAYS_BEFORE: 1
      BRANCH_DWELL_DAYS_AFTER: 3
    precision: "Whole calendar days; interval endpoints are CLOSED on both sides."
    formula: |
      inbound_window(r) = [ r.planned_arrive_date - INBOUND_BUFFER_DAYS_BEFORE days ,
                            r.planned_arrive_date + BRANCH_DWELL_DAYS_AFTER days ]     # CLOSED both ends
      committed = count of RelocationOrder r2 where
                    r2.destination_branch_id == r.destination_branch_id
                    AND r2.id != r.id
                    AND r2.status IN {APPROVED, IN_TRANSIT}
                    AND inbound_window(r2) intersects inbound_window(r)
      # CLOSED-interval intersection: two windows that merely TOUCH at a single shared
      # endpoint DO collide. This is the opposite convention from the half-open trailer
      # occupancy interval used by trailer_selection and by the manual unit-attach guard,
      # where a window ending exactly where the next begins does NOT collide.
      if Branch(dest).on_hand_count + committed + 1 > Branch(dest).yard_capacity:
          reject with ERR_BRANCH_YARD_CAPACITY_EXCEEDED

  - name: trailer_net_book_value_cents
    trigger: "recomputed on every read of the Trailer and consumed by purchase_option_price_cents"
    algorithm: decay_function
    input_set: "One Trailer row, its TrailerType and the logical clock date."
    constants:
      DEPRECIATION_RATE_PER_YEAR: 0.10
      DEPRECIATION_MONTH_DAYS: 30
    precision: "Integer cents; round_half_up on the depreciation charge."
    formula: |
      months_in_service    = floor((clock_date - t.in_service_date) in days / DEPRECIATION_MONTH_DAYS)
      depreciation_cents   = round_half_up(t.acquisition_cost_cents
                                           * DEPRECIATION_RATE_PER_YEAR
                                           * months_in_service / 12)
      net_book_value_cents = max(TrailerType.residual_floor_cents,
                                 t.acquisition_cost_cents - depreciation_cents)

  - name: purchase_option_price_cents
    trigger: "runs on Agreement PENDING_SETTLEMENT -> CLOSED when the purchase option becomes OFFERED; writes Agreement.purchase_option_price_cents"
    algorithm: constraint_propagation
    input_set: "The single AgreementUnit's Trailer (for net book value), its TrailerType (for the residual floor) and Agreement.final_total_cents (already written earlier in the same settlement transition)."
    constants:
      LEASE_CREDIT_RATE: 0.12
      MAX_CREDIT_PCT: 0.30
      MIN_PURCHASE_OPTION_TERM_DAYS: 720
    precision: "Integer cents; round_half_up on the credit, floor() on the cap."
    formula: |
      # The credit is capped by a percentage of the price, and the price is the book value
      # LESS the credit -- a circular-looking dependency. EVALUATION ORDER IS PINNED and the
      # cap is keyed on the PRE-CREDIT base price, so the value is well defined:
      STEP 1  cumulative_paid_cents = Agreement.final_total_cents
      STEP 2  uncapped_credit_cents = round_half_up(cumulative_paid_cents * LEASE_CREDIT_RATE)
      STEP 3  base_price_cents      = max(Trailer.net_book_value_cents,
                                          TrailerType.residual_floor_cents)
      STEP 4  credit_cap_cents      = floor(base_price_cents * MAX_CREDIT_PCT)
      STEP 5  applied_credit_cents  = min(uncapped_credit_cents, credit_cap_cents)
      STEP 6  purchase_option_price_cents = max(base_price_cents - applied_credit_cents,
                                                TrailerType.residual_floor_cents)
      # Computing the cap from the POST-credit price (or applying the credit before the floor)
      # yields a different, wrong number.

  - name: fleet_position_conservation
    trigger: "an invariant, re-evaluated by tests after every RelocationOrder dispatch/abort/complete pair"
    algorithm: aggregation
    input_set: "All Branch rows and all Trailer rows."
    constants: {}
    precision: "Integer counts."
    formula: |
      sum over all Branch b of b.on_hand_count
        + count(Trailer WHERE availability_status == IN_TRANSIT)
        + count(Trailer WHERE availability_status IN {ON_RENT, ON_LEASE})
      ==
      count(Trailer WHERE availability_status NOT IN {RETIRED, SOLD})
      # Dispatch debits exactly one unit from the origin branch's on_hand_count and credits
      # exactly one to the IN_TRANSIT bucket; abort reverses both. The identity must hold
      # before dispatch, while in transit, and after abort.

  - name: chargeback_balance_conservation
    trigger: "an invariant, re-evaluated by tests after every damage-assessment submit / chargeback waive pair"
    algorithm: aggregation
    input_set: "All Chargeback rows for one Customer."
    constants: {}
    precision: "Integer cents."
    formula: |
      Customer.outstanding_chargeback_cents
      == sum(cb.amount_cents WHERE cb.customer_id == c.id
                              AND cb.status IN {PENDING, DISPUTED, APPROVED})
      # Submitting an assessment adds exactly Chargeback.amount_cents to the balance;
      # waiving that chargeback subtracts exactly the same amount and additionally rolls
      # Trailer.damage_points back by the assessment's damage_points. After the forward
      # action and its compensation the balance returns to its pre-submit value with zero drift.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list in 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_TRAILER_TYPE_NOT_FOUND | ERR_TRAILER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_INSURANCE_CERTIFICATE_NOT_FOUND | ERR_RATE_CARD_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_AGREEMENT_UNIT_NOT_FOUND | ERR_DAMAGE_ASSESSMENT_NOT_FOUND | ERR_CHARGEBACK_NOT_FOUND | ERR_RELOCATION_ORDER_NOT_FOUND | ERR_MAINTENANCE_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_BRANCH_NOT_FOUND | ERR_TRAILER_TYPE_NOT_FOUND | ERR_TRAILER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_DAMAGE_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK fields in input"

  - priority: 5
    category: business_constraint
    check: "required input fields are present, enum values are members of their declared set, numeric fields respect their declared bounds, and pagination limit is within [1,100] with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 6
    category: business_temporal
    check: "declared date-ordering constraints hold: Agreement.end_date > start_date; InsuranceCertificate.expiry_date >= effective_date; Branch.peak_season_end_date >= peak_season_start_date; RelocationOrder.planned_arrive_date >= planned_depart_date; return_date > checkout_date; activate checkout_date in [start_date, end_date); complete actual_arrive_date >= planned_depart_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /fleet/agreements, POST /fleet/branches, POST /fleet/insurance-certificates, POST /fleet/relocation-orders, POST /fleet/agreements/{agreement_id}/activate, POST /fleet/agreement-units/{agreement_unit_id}/return, POST /fleet/relocation-orders/{relocation_order_id}/complete"

  - priority: 7
    category: business_referential
    check: "uniqueness of natural keys: Branch.code, TrailerType.code, Trailer.unit_number"
    error_id: "ERR_DUPLICATE_BRANCH_CODE | ERR_DUPLICATE_TRAILER_TYPE_CODE | ERR_DUPLICATE_UNIT_NUMBER"
    http_status: 409
    applies_to: "POST /fleet/branches, POST /fleet/trailer-types, POST /fleet/trailers"

  - priority: 8
    category: business_referential
    check: "ownership for entity_backed roles: a Customer caller's X-User-ID equals the target Agreement.customer_id or Chargeback.customer_id; a BranchManager caller's X-User-ID equals Agreement.branch_id on agreement actions, equals the request's return_branch_id on unit return, and equals RelocationOrder.destination_branch_id on relocation approve"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Customer-role and BranchManager-role mutations"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the ChargebackApprover's X-User-ID differs from DamageAssessment.assessor_user_id on the assessment behind the chargeback"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fleet/chargebacks/{chargeback_id}/approve, POST /fleet/chargebacks/{chargeback_id}/waive"

  - priority: 10
    category: state
    check: "expected_<parent>_version in the body equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fleet/agreements/{agreement_id}/units, POST /fleet/agreements/{agreement_id}/allocate, POST /fleet/rate-cards, POST /fleet/agreement-units/{agreement_unit_id}/damage-assessments"

  - priority: 20
    category: state
    check: "the target entity is in the from-state its transition requires (see 1.2)"
    error_id: "ERR_AGREEMENT_NOT_DRAFT | ERR_AGREEMENT_NOT_PENDING_INSURANCE | ERR_AGREEMENT_NOT_PENDING_ALLOCATION | ERR_AGREEMENT_NOT_RESERVED | ERR_AGREEMENT_NOT_SETTLEABLE | ERR_AGREEMENT_TERMINAL | ERR_UNIT_NOT_OUT | ERR_UNIT_NOT_RETURNED | ERR_ASSESSMENT_NOT_DRAFT | ERR_ASSESSMENT_SUPERSEDED | ERR_CHARGEBACK_NOT_PENDING | ERR_CHARGEBACK_NOT_DISPUTED | ERR_CHARGEBACK_NOT_APPROVED | ERR_CHARGEBACK_TERMINAL | ERR_RELOCATION_NOT_REQUESTED | ERR_RELOCATION_NOT_APPROVED | ERR_RELOCATION_NOT_IN_TRANSIT | ERR_CERTIFICATE_NOT_ACTIVE | ERR_PURCHASE_OPTION_NOT_OFFERED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 30
    category: business_safety
    check: "the named Trailer's service_status == SERVICEABLE"
    error_id: ERR_TRAILER_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/units, POST /fleet/relocation-orders, POST /fleet/relocation-orders/{relocation_order_id}/dispatch"

  - priority: 35
    category: business_safety
    check: "the named Trailer's dot_expires_on is strictly after the agreement's end_date; a trailer whose dot_expires_on equals the clock date is already expired"
    error_id: ERR_DOT_INSPECTION_EXPIRED
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/units"

  - priority: 40
    category: business_safety
    check: "a qualifying InsuranceCertificate exists for the customer covering [start_date, end_date] with status ACTIVE"
    error_id: ERR_INSURANCE_INVALID
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/verify-insurance"

  - priority: 45
    category: business_safety
    check: "the qualifying certificate's physical_damage_limit_cents >= TrailerType.required_physical_damage_limit_cents"
    error_id: ERR_INSURANCE_LIMIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/verify-insurance"

  - priority: 50
    category: business_temporal
    check: "half-open trailer occupancy: the named trailer has no AgreementUnit in status ALLOCATED or OUT whose [planned_start_date, planned_end_date) overlaps the new agreement's [start_date, end_date). Windows that merely touch (previous end == new start) do NOT collide."
    error_id: ERR_TRAILER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/units"

  - priority: 55
    category: business_temporal
    check: "closed-interval destination yard capacity per calculations.branch_inbound_capacity; windows that touch at a single shared endpoint DO collide"
    error_id: ERR_BRANCH_YARD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fleet/relocation-orders/{relocation_order_id}/approve"

  - priority: 60
    category: business_referential
    check: "on manual unit attach the trailer's current_branch_id equals Agreement.branch_id; on relocation creation the destination_branch_id differs from the trailer's current_branch_id"
    error_id: ERR_TRAILER_BRANCH_MISMATCH
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/units, POST /fleet/relocation-orders"

  - priority: 62
    category: business_constraint
    check: "on manual unit attach the trailer's availability_status is AVAILABLE or ALLOCATED (forward booking allowed); on relocation dispatch, retire, activate and purchase-option exercise it must be exactly AVAILABLE (activate requires exactly ALLOCATED). This check runs AFTER the half-open window check at priority 50, so an overlapping forward booking reports ERR_TRAILER_WINDOW_CONFLICT rather than this error."
    error_id: ERR_TRAILER_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/units, POST /fleet/agreements/{agreement_id}/activate, POST /fleet/relocation-orders/{relocation_order_id}/dispatch, POST /fleet/trailers/{trailer_id}/retire, POST /fleet/agreements/{agreement_id}/exercise-purchase-option"

  - priority: 65
    category: business_constraint
    check: "the trailer_selection candidate pool after the peak lease reserve is non-empty and large enough for the remaining demand"
    error_id: "ERR_NO_ELIGIBLE_TRAILER | ERR_INSUFFICIENT_AVAILABILITY"
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/allocate, POST /fleet/agreements/{agreement_id}/units"

  - priority: 70
    category: business_fiscal
    check: "Customer.outstanding_chargeback_cents <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /fleet/agreements/{agreement_id}/activate"

  - priority: 75
    category: business_fiscal
    check: "customer_risk_score under variant underwriting_snapshot <= RISK_SCORE_MAX (85)"
    error_id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 409
    applies_to: "POST /fleet/agreements/{agreement_id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint) ---------------------------------
  - method: POST
    path: "/fleet/_clock/set_current_utc"
    description: "Sets the server's logical clock. The server starts with the logical clock fixed at 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time; every date comparison in this API (DOT expiry, certificate expiry, depreciation months, chargeback age decay) reads this clock."
    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "recomputes Trailer.service_status and Trailer.net_book_value_cents on the next read of any trailer"
      - "recomputes InsuranceCertificate.status lazily on the next read of any certificate"

  # ---- Branch ----------------------------------------------------------------
  - method: POST
    path: "/fleet/branches"
    description: "Register a yard with its capacity and its single peak-season window"
    roles: [FleetAdmin]
    code: 201
    input: [code, name, region, yard_capacity, peak_season_start_date, peak_season_end_date, "lease_reserve_pct?"]
    output: Branch
    side_effects:
      - "on_hand_count and serviceable_available_count initialised to 0"

  - method: GET
    path: "/fleet/branches/{branch_id}"
    description: "Read one yard with its live counters"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: GET
    path: "/fleet/branches"
    description: "List yards with pagination"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["region?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []

  - method: GET
    path: "/fleet/branches/{branch_id}/availability"
    description: "Computed read: the peak-season allocation split for one trailer type at this yard"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: ["trailer_type_id?", "product?", "window_start_date?", "window_end_date?"]
    output: { branch_id: string, trailer_type_id: string, on_hand_count: integer, serviceable_available_count: integer, lease_reserved_count: integer, rental_available_count: integer, inbound_committed_count: integer }
    side_effects: []

  # ---- TrailerType -----------------------------------------------------------
  - method: POST
    path: "/fleet/trailer-types"
    description: "Register an equipment class with its DOT and PM intervals and its insurance floor"
    roles: [FleetAdmin]
    code: 201
    input: [code, description, base_daily_rate_cents, base_monthly_rate_cents, residual_floor_cents, required_physical_damage_limit_cents, "dot_inspection_interval_days?", "pm_interval_miles?"]
    output: TrailerType
    side_effects: []

  - method: GET
    path: "/fleet/trailer-types/{trailer_type_id}"
    description: "Read one equipment class"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: TrailerType
    side_effects: []

  - method: GET
    path: "/fleet/trailer-types"
    description: "List equipment classes"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: TrailerType[]
    side_effects: []

  # ---- Trailer ---------------------------------------------------------------
  - method: POST
    path: "/fleet/trailers"
    description: "Add a unit to the fleet at its home yard"
    roles: [FleetAdmin]
    code: 201
    input: [unit_number, trailer_type_id, home_branch_id, acquisition_cost_cents, in_service_date, last_dot_inspection_date, "hub_miles?"]
    output: Trailer
    side_effects:
      - "current_branch_id := home_branch_id; availability_status := AVAILABLE; last_pm_hub_miles := hub_miles; last_dot_passed := true"
      - "computes dot_expires_on, service_status (calculations.trailer_service_status) and net_book_value_cents"
      - "increments Branch.on_hand_count and Branch.serviceable_available_count at home_branch_id"

  - method: GET
    path: "/fleet/trailers/{trailer_id}"
    description: "Read one unit; service_status, damage_points and net_book_value_cents are recomputed on read"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: Trailer
    side_effects: []

  - method: GET
    path: "/fleet/trailers"
    description: "List units filtered by type, home yard, current yard and either status dimension"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["trailer_type_id?", "home_branch_id?", "current_branch_id?", "availability_status?", "service_status?", "limit?", "offset?"]
    output: Trailer[]
    side_effects: []

  - method: POST
    path: "/fleet/trailers/{trailer_id}/retire"
    description: "Permanently retire an idle unit"
    roles: [FleetAdmin]
    code: 200
    input: [reason]
    output: Trailer
    side_effects:
      - "availability_status AVAILABLE -> RETIRED; records retired_reason"
      - "decrements Branch.on_hand_count and Branch.serviceable_available_count at current_branch_id"

  # ---- Customer --------------------------------------------------------------
  - method: POST
    path: "/fleet/customers"
    description: "Register a lessee with its underwriting tier and credit limit"
    roles: [FleetAdmin]
    code: 201
    input: [legal_name, dot_number, credit_tier, credit_limit_cents]
    output: Customer
    side_effects:
      - "outstanding_chargeback_cents initialised to 0"

  - method: GET
    path: "/fleet/customers/{customer_id}"
    description: "Read one lessee with its live outstanding chargeback balance"
    roles: [FleetAdmin, BranchManager, ChargebackApprover, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/fleet/customers/{customer_id}/risk-review"
    description: "Computed read: customer_risk_score under variant renewal_review, never persisted"
    roles: [FleetAdmin, ChargebackApprover]
    code: 200
    input: []
    output: { customer_id: string, variant: string, risk_score: integer, chargeback_weight_points: integer, assessment_points: integer, base_points: integer, weighted_chargeback_cents: integer, outstanding_chargeback_cents: integer }
    side_effects: []

  # ---- InsuranceCertificate --------------------------------------------------
  - method: POST
    path: "/fleet/insurance-certificates"
    description: "File a certificate of insurance for a lessee"
    roles: [FleetAdmin, Customer]
    code: 201
    input: [customer_id, carrier_name, policy_number, physical_damage_limit_cents, liability_limit_cents, effective_date, expiry_date]
    output: InsuranceCertificate
    side_effects:
      - "status := ACTIVE"

  - method: GET
    path: "/fleet/insurance-certificates/{certificate_id}"
    description: "Read one certificate; status is lazily flipped to EXPIRED when the clock date has passed expiry_date"
    roles: [FleetAdmin, BranchManager, ChargebackApprover, Customer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects:
      - "ACTIVE -> EXPIRED when clock_date > expiry_date"

  - method: GET
    path: "/fleet/insurance-certificates"
    description: "List certificates by lessee and status"
    roles: [FleetAdmin, BranchManager, ChargebackApprover, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects:
      - "ACTIVE -> EXPIRED evaluated per row on read"

  - method: POST
    path: "/fleet/insurance-certificates/{certificate_id}/revoke"
    description: "Revoke a certificate the carrier has cancelled"
    roles: [FleetAdmin]
    code: 200
    input: [reason]
    output: InsuranceCertificate
    side_effects:
      - "status ACTIVE -> REVOKED; records revoked_reason"

  # ---- RateCard --------------------------------------------------------------
  - method: POST
    path: "/fleet/rate-cards"
    description: "Publish a rate card for a (branch, trailer type, product) triple; supersedes the prior ACTIVE card for that triple"
    roles: [FleetAdmin]
    code: 201
    input: [branch_id, trailer_type_id, product, daily_rate_cents, monthly_rate_cents, peak_uplift_pct, mileage_included_per_month, excess_mileage_rate_cents_per_mile, effective_date, expected_branch_version]
    output: RateCard
    side_effects:
      - "the prior ACTIVE card for the same triple, if any, moves ACTIVE -> SUPERSEDED"
      - "increments Branch.version by 1"

  - method: GET
    path: "/fleet/rate-cards/{rate_card_id}"
    description: "Read one rate card"
    roles: [FleetAdmin, BranchManager, Customer]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: GET
    path: "/fleet/rate-cards"
    description: "List rate cards by branch, trailer type, product and status"
    roles: [FleetAdmin, BranchManager, Customer]
    code: 200
    input: ["branch_id?", "trailer_type_id?", "product?", "status?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  # ---- Agreement -------------------------------------------------------------
  - method: POST
    path: "/fleet/agreements"
    description: "Open a draft rental or lease agreement"
    roles: [FleetAdmin, Customer]
    code: 201
    input: [customer_id, branch_id, product, trailer_type_id, unit_count, start_date, end_date, "term_months?"]
    output: Agreement
    side_effects:
      - "status := DRAFT; purchase_option_status := NOT_OFFERED; allocated_unit_count := 0"

  - method: GET
    path: "/fleet/agreements/{agreement_id}"
    description: "Read one agreement with its pinned rate card, quoted and final totals and purchase option"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: Agreement
    side_effects: []

  - method: GET
    path: "/fleet/agreements"
    description: "List agreements filtered by lessee, branch, equipment class, pinned rate card, pinned certificate and status"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["customer_id?", "branch_id?", "trailer_type_id?", "rate_card_id?", "insurance_certificate_id?", "status?", "limit?", "offset?"]
    output: Agreement[]
    side_effects: []

  - method: POST
    path: "/fleet/agreements/{agreement_id}/submit"
    description: "Submit a draft for underwriting; freezes the underwriting risk score"
    roles: [FleetAdmin, Customer]
    code: 200
    input: []
    output: Agreement
    side_effects:
      - "status DRAFT -> PENDING_INSURANCE"
      - "writes underwriting_risk_score = customer_risk_score(variant=underwriting_snapshot)"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/verify-insurance"
    description: "Verify and pin the lessee's certificate of insurance for this agreement"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: []
    output: Agreement
    side_effects:
      - "status PENDING_INSURANCE -> PENDING_ALLOCATION"
      - "pins insurance_certificate_id"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/allocate"
    description: "Run the server-side trailer selector to fill every remaining unit in one call"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [expected_agreement_version]
    output: Agreement
    side_effects:
      - "creates the remaining AgreementUnit rows in ALLOCATED per calculations.trailer_selection"
      - "each selected Trailer.availability_status AVAILABLE -> ALLOCATED; Branch.serviceable_available_count recomputed"
      - "status PENDING_ALLOCATION -> RESERVED; pins rate_card_id; writes quoted_total_cents"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/units"
    description: "Manually attach one named trailer to a PENDING_ALLOCATION agreement"
    roles: [FleetAdmin, BranchManager]
    code: 201
    input: [trailer_id, expected_agreement_version]
    output: AgreementUnit
    side_effects:
      - "creates one AgreementUnit in ALLOCATED with planned_start_date/planned_end_date copied from the agreement"
      - "Trailer.availability_status AVAILABLE -> ALLOCATED when the trailer was AVAILABLE; an already-ALLOCATED trailer keeps that value. Branch.serviceable_available_count recomputed"
      - "bubble-up: when allocated_unit_count reaches unit_count the agreement moves PENDING_ALLOCATION -> RESERVED, pins rate_card_id and writes quoted_total_cents"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/activate"
    description: "Check the reserved units out of the yard"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [checkout_date]
    output: Agreement
    side_effects:
      - "status RESERVED -> ACTIVE"
      - "every AgreementUnit ALLOCATED -> OUT with checkout_date and checkout_hub_miles stamped"
      - "every Trailer ALLOCATED -> ON_RENT or ON_LEASE; Branch.on_hand_count decremented"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/cancel"
    description: "Cancel an agreement that has not yet been activated"
    roles: [FleetAdmin, BranchManager, Customer]
    code: 200
    input: [reason]
    output: Agreement
    side_effects:
      - "status -> CANCELLED; records cancel_reason"
      - "every ALLOCATED AgreementUnit -> RELEASED and its Trailer ALLOCATED -> AVAILABLE"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/settle"
    description: "Settle a fully returned agreement; computes the final chronological total and the lease-end purchase option"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Agreement
    side_effects:
      - "writes every RETURNED AgreementUnit's peak_days, excess_miles, drop_charge_cents and line_charge_cents"
      - "writes final_total_cents = agreement_total_cents(variant=final_chronological)"
      - "every RETURNED AgreementUnit -> SETTLED"
      - "purchase_option_status NOT_OFFERED -> OFFERED with purchase_option_price_cents when the lease eligibility test passes"
      - "status PENDING_SETTLEMENT -> CLOSED; increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/exercise-purchase-option"
    description: "Lessee buys the leased unit at the computed lease-end price"
    roles: [Customer]
    code: 200
    input: []
    output: Agreement
    side_effects:
      - "purchase_option_status OFFERED -> EXERCISED"
      - "the unit's Trailer.availability_status AVAILABLE -> SOLD; Branch counters recomputed"
      - "increments Agreement.version by 1"

  - method: POST
    path: "/fleet/agreements/{agreement_id}/decline-purchase-option"
    description: "Lessee declines the lease-end purchase option and returns the unit to the rental fleet"
    roles: [Customer]
    code: 200
    input: []
    output: Agreement
    side_effects:
      - "purchase_option_status OFFERED -> DECLINED; the trailer stays AVAILABLE"
      - "increments Agreement.version by 1"

  # ---- AgreementUnit ---------------------------------------------------------
  - method: GET
    path: "/fleet/agreement-units/{agreement_unit_id}"
    description: "Read one contract unit line"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: AgreementUnit
    side_effects: []

  - method: GET
    path: "/fleet/agreement-units"
    description: "List contract unit lines filtered by agreement, trailer, return yard and status"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["agreement_id?", "trailer_id?", "return_branch_id?", "status?", "limit?", "offset?"]
    output: AgreementUnit[]
    side_effects: []

  - method: POST
    path: "/fleet/agreement-units/{agreement_unit_id}/return"
    description: "Accept a unit back into a yard, possibly a different yard than it left"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [return_branch_id, return_hub_miles, return_date]
    output: AgreementUnit
    side_effects:
      - "status OUT -> RETURNED; stamps return_branch_id, return_date, return_hub_miles"
      - "Trailer.hub_miles := return_hub_miles; Trailer.current_branch_id := return_branch_id; availability ON_RENT|ON_LEASE -> AVAILABLE"
      - "recomputes Trailer.service_status (may yield PM_DUE) and both branches' counters"
      - "bubble-up: when no unit of the agreement is left OUT, the Agreement moves ACTIVE -> PENDING_SETTLEMENT"
      - "increments AgreementUnit.version by 1"

  - method: POST
    path: "/fleet/agreement-units/{agreement_unit_id}/damage-assessments"
    description: "Open a draft damage assessment against a returned unit; supply supersedes_assessment_id for a re-inspection"
    roles: [Inspector]
    code: 201
    input: [line_items, expected_agreement_unit_version, "supersedes_assessment_id?"]
    output: DamageAssessment
    side_effects:
      - "creates a DamageAssessment in DRAFT with trailer_id copied from the unit and assessor_user_id set to the caller's X-User-ID"
      - "increments AgreementUnit.version by 1"

  # ---- MaintenanceEvent ------------------------------------------------------
  - method: POST
    path: "/fleet/maintenance-events"
    description: "Record a shop event: PM service, DOT periodic inspection, or damage repair"
    roles: [FleetAdmin, Inspector]
    code: 201
    input: [trailer_id, event_type, performed_on, hub_miles_at_event, cost_cents, "passed?"]
    output: MaintenanceEvent
    side_effects:
      - "PM_SERVICE: Trailer.last_pm_hub_miles := hub_miles_at_event"
      - "DOT_INSPECTION with passed == true: Trailer.last_dot_inspection_date := performed_on, dot_expires_on recomputed, last_dot_passed := true"
      - "DOT_INSPECTION with passed == false: Trailer.last_dot_passed := false, which forces service_status to OOS_DOT_EXPIRED, which SWAPS OUT every ALLOCATED AgreementUnit on the trailer, which in turn reverts each affected RESERVED Agreement to PENDING_ALLOCATION"
      - "DAMAGE_REPAIR: Trailer.last_damage_repair_at := this event's created_at, dropping every earlier assessment out of the damage_points sum"
      - "recomputes Trailer.service_status and both the trailer's Branch counters"

  - method: GET
    path: "/fleet/maintenance-events/{maintenance_event_id}"
    description: "Read one shop event"
    roles: [FleetAdmin, BranchManager, Inspector]
    code: 200
    input: []
    output: MaintenanceEvent
    side_effects: []

  - method: GET
    path: "/fleet/maintenance-events"
    description: "List shop events for a unit"
    roles: [FleetAdmin, BranchManager, Inspector]
    code: 200
    input: ["trailer_id?", "event_type?", "limit?", "offset?"]
    output: MaintenanceEvent[]
    side_effects: []

  # ---- DamageAssessment ------------------------------------------------------
  - method: GET
    path: "/fleet/damage-assessments/{damage_assessment_id}"
    description: "Read one damage assessment with its computed liability split"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []

  - method: GET
    path: "/fleet/damage-assessments"
    description: "List damage assessments by unit, trailer, superseded predecessor and status"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["agreement_unit_id?", "trailer_id?", "supersedes_assessment_id?", "status?", "limit?", "offset?"]
    output: DamageAssessment[]
    side_effects: []

  - method: POST
    path: "/fleet/damage-assessments/{damage_assessment_id}/submit"
    description: "Submit a draft assessment; prices it, raises a chargeback and may take the trailer out of service"
    roles: [Inspector]
    code: 200
    input: []
    output: DamageAssessment
    side_effects:
      - "status DRAFT -> SUBMITTED; computes assessed_amount_cents, insured_portion_cents, customer_liable_cents, admin_fee_cents, damage_points"
      - "creates one Chargeback in PENDING, which raises Customer.outstanding_chargeback_cents"
      - "Trailer.damage_points rises, which may move service_status SERVICEABLE -> OOS_DAMAGE, which auto-CANCELS every REQUESTED or APPROVED RelocationOrder on that trailer and SWAPS OUT every ALLOCATED AgreementUnit on it"
      - "when supersedes_assessment_id is set: the predecessor SUBMITTED -> SUPERSEDED and its chargeback -> VOIDED"
      - "increments DamageAssessment.version by 1"

  # ---- Chargeback ------------------------------------------------------------
  - method: GET
    path: "/fleet/chargebacks/{chargeback_id}"
    description: "Read one chargeback"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: []
    output: Chargeback
    side_effects: []

  - method: GET
    path: "/fleet/chargebacks"
    description: "List chargebacks by assessment, lessee and status"
    roles: [FleetAdmin, BranchManager, Inspector, ChargebackApprover, Customer]
    code: 200
    input: ["damage_assessment_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Chargeback[]
    side_effects: []

  - method: POST
    path: "/fleet/chargebacks/{chargeback_id}/approve"
    description: "Approve a chargeback; blocked when the approver authored the underlying assessment"
    roles: [ChargebackApprover]
    code: 200
    input: []
    output: Chargeback
    side_effects:
      - "status PENDING -> APPROVED; records approver_user_id"
      - "the linked DamageAssessment SUBMITTED -> APPROVED"
      - "increments Chargeback.version by 1"

  - method: POST
    path: "/fleet/chargebacks/{chargeback_id}/dispute"
    description: "Lessee disputes a pending chargeback"
    roles: [Customer]
    code: 200
    input: [dispute_reason]
    output: Chargeback
    side_effects:
      - "status PENDING -> DISPUTED; records dispute_reason; the amount stays in outstanding_chargeback_cents"
      - "increments Chargeback.version by 1"

  - method: POST
    path: "/fleet/chargebacks/{chargeback_id}/reopen"
    description: "Return a disputed chargeback to the pending queue for re-adjudication"
    roles: [ChargebackApprover]
    code: 200
    input: []
    output: Chargeback
    side_effects:
      - "status DISPUTED -> PENDING; clears dispute_reason"
      - "increments Chargeback.version by 1"

  - method: POST
    path: "/fleet/chargebacks/{chargeback_id}/waive"
    description: "Waive a chargeback; reverses the balance and rolls back the trailer's damage points"
    roles: [ChargebackApprover]
    code: 200
    input: [waiver_reason]
    output: Chargeback
    side_effects:
      - "status PENDING|DISPUTED -> WAIVED; records approver_user_id and waiver_reason"
      - "the linked DamageAssessment SUBMITTED -> REJECTED"
      - "Customer.outstanding_chargeback_cents drops by amount_cents"
      - "Trailer.damage_points and service_status recomputed; OOS_DAMAGE -> SERVICEABLE when the points fall back below the threshold"
      - "increments Chargeback.version by 1"

  - method: POST
    path: "/fleet/chargebacks/{chargeback_id}/record-payment"
    description: "Record full payment of an approved chargeback"
    roles: [FleetAdmin]
    code: 200
    input: [paid_amount_cents]
    output: Chargeback
    side_effects:
      - "status APPROVED -> SETTLED; records paid_amount_cents"
      - "Customer.outstanding_chargeback_cents drops by amount_cents"
      - "increments Chargeback.version by 1"

  # ---- RelocationOrder -------------------------------------------------------
  - method: POST
    path: "/fleet/relocation-orders"
    description: "Request repositioning of an idle unit to another yard; prices the planned move"
    roles: [FleetAdmin, BranchManager]
    code: 201
    input: [trailer_id, destination_branch_id, planned_depart_date, planned_arrive_date, planned_miles]
    output: RelocationOrder
    side_effects:
      - "status := REQUESTED; origin_branch_id := Trailer.current_branch_id"
      - "writes estimated_cost_cents = relocation_cost_cents(variant=estimated_planned)"

  - method: GET
    path: "/fleet/relocation-orders/{relocation_order_id}"
    description: "Read one repositioning order with both cost variants"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: []
    output: RelocationOrder
    side_effects: []

  - method: GET
    path: "/fleet/relocation-orders"
    description: "List repositioning orders by unit, origin yard, destination yard and status"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: ["trailer_id?", "origin_branch_id?", "destination_branch_id?", "status?", "limit?", "offset?"]
    output: RelocationOrder[]
    side_effects: []

  - method: POST
    path: "/fleet/relocation-orders/{relocation_order_id}/approve"
    description: "Receiving yard accepts the inbound move, subject to closed-interval yard capacity"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: []
    output: RelocationOrder
    side_effects:
      - "status REQUESTED -> APPROVED; the order now occupies an inbound capacity window at the destination"
      - "increments RelocationOrder.version by 1"

  - method: POST
    path: "/fleet/relocation-orders/{relocation_order_id}/reject"
    description: "Receiving yard refuses the inbound move"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [reason]
    output: RelocationOrder
    side_effects:
      - "status REQUESTED -> REJECTED; records reject_reason"
      - "increments RelocationOrder.version by 1"

  - method: POST
    path: "/fleet/relocation-orders/{relocation_order_id}/dispatch"
    description: "Put the unit on the road; debits the origin yard's on-hand count"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: []
    output: RelocationOrder
    side_effects:
      - "status APPROVED -> IN_TRANSIT"
      - "Trailer.availability_status AVAILABLE -> IN_TRANSIT with current_branch_id unchanged"
      - "Branch.on_hand_count at origin_branch_id decreases by 1"
      - "increments RelocationOrder.version by 1"

  - method: POST
    path: "/fleet/relocation-orders/{relocation_order_id}/complete"
    description: "Land the unit at the destination yard and price the actual move"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [actual_miles, deadhead_miles, actual_arrive_date]
    output: RelocationOrder
    side_effects:
      - "status IN_TRANSIT -> COMPLETED; writes actual_cost_cents = relocation_cost_cents(variant=actual_incurred)"
      - "Trailer.current_branch_id := destination_branch_id; availability IN_TRANSIT -> AVAILABLE"
      - "Branch.on_hand_count at destination_branch_id increases by 1"
      - "increments RelocationOrder.version by 1"

  - method: POST
    path: "/fleet/relocation-orders/{relocation_order_id}/abort"
    description: "Abort a move already on the road; the unit stays booked to its origin yard"
    roles: [FleetAdmin, BranchManager]
    code: 200
    input: [reason]
    output: RelocationOrder
    side_effects:
      - "status IN_TRANSIT -> CANCELLED; records cancel_reason; actual_cost_cents stays null"
      - "Trailer.availability_status IN_TRANSIT -> AVAILABLE with current_branch_id still the origin"
      - "Branch.on_hand_count at origin_branch_id increases by 1, exactly reversing the dispatch debit"
      - "increments RelocationOrder.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed caller acted on a resource that its X-User-ID does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ChargebackApprover's X-User-ID equals the assessor_user_id of the assessment behind the chargeback"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum member, out-of-range number, empty line_items, or pagination outside limit in [1,100] / offset >= 0"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "a declared date-ordering constraint is violated"
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "a referenced branch id does not exist"
  - id: ERR_TRAILER_TYPE_NOT_FOUND
    http: 404
    condition: "a referenced trailer type id does not exist"
  - id: ERR_TRAILER_NOT_FOUND
    http: 404
    condition: "a referenced trailer id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "a referenced customer id does not exist"
  - id: ERR_INSURANCE_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "a referenced insurance certificate id does not exist"
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "a referenced rate card id does not exist, or no ACTIVE card exists for the agreement's (branch, trailer type, product) triple at reservation time"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "a referenced agreement id does not exist"
  - id: ERR_AGREEMENT_UNIT_NOT_FOUND
    http: 404
    condition: "a referenced agreement unit id does not exist"
  - id: ERR_DAMAGE_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "a referenced damage assessment id does not exist, including an unresolvable supersedes_assessment_id"
  - id: ERR_CHARGEBACK_NOT_FOUND
    http: 404
    condition: "a referenced chargeback id does not exist"
  - id: ERR_RELOCATION_ORDER_NOT_FOUND
    http: 404
    condition: "a referenced relocation order id does not exist"
  - id: ERR_MAINTENANCE_EVENT_NOT_FOUND
    http: 404
    condition: "a referenced maintenance event id does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_<parent>_version input does not match the parent entity's current version"
  - id: ERR_DUPLICATE_BRANCH_CODE
    http: 409
    condition: "a branch with the same code already exists"
  - id: ERR_DUPLICATE_TRAILER_TYPE_CODE
    http: 409
    condition: "a trailer type with the same code already exists"
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "a trailer with the same unit_number already exists"
  - id: ERR_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "submit called on an agreement whose status is not DRAFT"
  - id: ERR_AGREEMENT_NOT_PENDING_INSURANCE
    http: 409
    condition: "verify-insurance called on an agreement whose status is not PENDING_INSURANCE"
  - id: ERR_AGREEMENT_NOT_PENDING_ALLOCATION
    http: 409
    condition: "allocate or unit attach called on an agreement whose status is not PENDING_ALLOCATION"
  - id: ERR_AGREEMENT_NOT_RESERVED
    http: 409
    condition: "activate called on an agreement whose status is not RESERVED"
  - id: ERR_AGREEMENT_NOT_SETTLEABLE
    http: 409
    condition: "settle called on an agreement whose status is not PENDING_SETTLEMENT"
  - id: ERR_AGREEMENT_TERMINAL
    http: 409
    condition: "cancel called on an agreement already in ACTIVE, PENDING_SETTLEMENT, CLOSED or CANCELLED"
  - id: ERR_UNIT_NOT_OUT
    http: 409
    condition: "return called on an agreement unit whose status is not OUT"
  - id: ERR_UNIT_NOT_RETURNED
    http: 409
    condition: "a damage assessment was submitted against a unit whose status is not RETURNED or SETTLED"
  - id: ERR_ASSESSMENT_NOT_DRAFT
    http: 409
    condition: "submit called on an assessment whose status is not DRAFT"
  - id: ERR_ASSESSMENT_SUPERSEDED
    http: 409
    condition: "supersedes_assessment_id points at an assessment whose status is not SUBMITTED"
  - id: ERR_CHARGEBACK_NOT_PENDING
    http: 409
    condition: "approve or dispute called on a chargeback whose status is not PENDING"
  - id: ERR_CHARGEBACK_NOT_DISPUTED
    http: 409
    condition: "reopen called on a chargeback whose status is not DISPUTED"
  - id: ERR_CHARGEBACK_NOT_APPROVED
    http: 409
    condition: "record-payment called on a chargeback whose status is not APPROVED"
  - id: ERR_CHARGEBACK_TERMINAL
    http: 409
    condition: "waive called on a chargeback already in APPROVED, WAIVED, SETTLED or VOIDED"
  - id: ERR_CERTIFICATE_NOT_ACTIVE
    http: 409
    condition: "revoke called on a certificate whose status is not ACTIVE"
  - id: ERR_RELOCATION_NOT_REQUESTED
    http: 409
    condition: "approve or reject called on a relocation order whose status is not REQUESTED"
  - id: ERR_RELOCATION_NOT_APPROVED
    http: 409
    condition: "dispatch called on a relocation order whose status is not APPROVED"
  - id: ERR_RELOCATION_NOT_IN_TRANSIT
    http: 409
    condition: "complete or abort called on a relocation order whose status is not IN_TRANSIT"
  - id: ERR_PURCHASE_OPTION_NOT_OFFERED
    http: 409
    condition: "exercise or decline called when purchase_option_status is not OFFERED"
  - id: ERR_TRAILER_OUT_OF_SERVICE
    http: 409
    condition: "the named trailer's service_status is not SERVICEABLE"
  - id: ERR_TRAILER_NOT_AVAILABLE
    http: 409
    condition: "the named trailer's availability_status is not AVAILABLE"
  - id: ERR_DOT_INSPECTION_EXPIRED
    http: 409
    condition: "the named trailer's dot_expires_on is not strictly after the agreement's end_date"
  - id: ERR_INSURANCE_INVALID
    http: 409
    condition: "no ACTIVE certificate covers the agreement window for this customer"
  - id: ERR_INSURANCE_LIMIT_INSUFFICIENT
    http: 409
    condition: "the qualifying certificate's physical_damage_limit_cents is below the trailer type's required minimum"
  - id: ERR_TRAILER_WINDOW_CONFLICT
    http: 409
    condition: "the named trailer already holds an ALLOCATED or OUT unit whose half-open occupancy window overlaps the agreement window"
  - id: ERR_BRANCH_YARD_CAPACITY_EXCEEDED
    http: 409
    condition: "approving the inbound move would push the destination yard over yard_capacity within the closed inbound window"
  - id: ERR_TRAILER_BRANCH_MISMATCH
    http: 409
    condition: "the trailer is not standing at the agreement's branch, or a relocation names the trailer's own current branch as destination"
  - id: ERR_NO_ELIGIBLE_TRAILER
    http: 409
    condition: "the trailer_selection candidate pool is empty after the eligibility filter and the peak lease reserve"
  - id: ERR_INSUFFICIENT_AVAILABILITY
    http: 409
    condition: "the candidate pool is non-empty but smaller than the remaining unit demand, or a manual attach was tried on an already fully allocated agreement"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "the lessee's outstanding_chargeback_cents exceeds its credit_limit_cents at activation"
  - id: ERR_RISK_SCORE_TOO_HIGH
    http: 409
    condition: "the underwriting_snapshot risk score exceeds RISK_SCORE_MAX (85) at submit"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Corporate fleet operations. Owns reference data, pricing publication, settlement and cash application."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/_clock/set_current_utc"
      - "POST /fleet/branches"
      - "POST /fleet/trailer-types"
      - "POST /fleet/trailers"
      - "POST /fleet/trailers/{trailer_id}/retire"
      - "POST /fleet/customers"
      - "POST /fleet/insurance-certificates/{certificate_id}/revoke"
      - "POST /fleet/rate-cards"
      - "POST /fleet/agreements/{agreement_id}/settle"
      - "POST /fleet/chargebacks/{chargeback_id}/record-payment"
    shared_operations:
      - "POST /fleet/insurance-certificates (with Customer)"
      - "POST /fleet/agreements, POST /fleet/agreements/{agreement_id}/submit, POST /fleet/agreements/{agreement_id}/cancel (with Customer)"
      - "POST /fleet/agreements/{agreement_id}/verify-insurance, /allocate, /units, /activate (with BranchManager)"
      - "POST /fleet/agreement-units/{agreement_unit_id}/return (with BranchManager)"
      - "POST /fleet/maintenance-events (with Inspector)"
      - "all RelocationOrder mutations (with BranchManager)"
      - "all GET reads"

  - name: BranchManager
    description: "Runs one yard. X-User-ID is that yard's Branch id; owns allocation, checkout, return acceptance and inbound move approval for that yard."
    identity: "entity_backed:Branch"
    exclusive_operations: []
    shared_operations:
      - "POST /fleet/agreements/{agreement_id}/verify-insurance, /allocate, /units, /activate, /cancel — only when X-User-ID == Agreement.branch_id"
      - "POST /fleet/agreement-units/{agreement_unit_id}/return — only when X-User-ID == the request's return_branch_id"
      - "POST /fleet/relocation-orders, /reject, /dispatch, /complete, /abort"
      - "POST /fleet/relocation-orders/{relocation_order_id}/approve — only when X-User-ID == RelocationOrder.destination_branch_id"
      - "GET reads on branches, trailer types, trailers, customers, certificates, rate cards, agreements, units, maintenance events, assessments, chargebacks and relocation orders"

  - name: Inspector
    description: "Shop and gate inspector. Records maintenance and DOT inspections and authors damage assessments. Structurally barred from adjudicating the money."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/agreement-units/{agreement_unit_id}/damage-assessments"
      - "POST /fleet/damage-assessments/{damage_assessment_id}/submit"
    shared_operations:
      - "POST /fleet/maintenance-events (with FleetAdmin)"
      - "GET reads on branches, trailer types, trailers, agreements, units, maintenance events, assessments and chargebacks"

  - name: ChargebackApprover
    description: "Damage-recovery desk. Adjudicates chargebacks. May never approve or waive a chargeback whose assessment it authored as Inspector (compared on X-User-ID)."
    identity: "opaque"
    exclusive_operations:
      - "POST /fleet/chargebacks/{chargeback_id}/approve"
      - "POST /fleet/chargebacks/{chargeback_id}/reopen"
      - "POST /fleet/chargebacks/{chargeback_id}/waive"
    shared_operations:
      - "GET reads on branches, trailer types, trailers, customers, certificates, agreements, units, assessments, chargebacks and the customer risk review"

  - name: Customer
    description: "Lessee. X-User-ID is that lessee's Customer id; may act only on its own agreements and chargebacks."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /fleet/chargebacks/{chargeback_id}/dispute"
      - "POST /fleet/agreements/{agreement_id}/exercise-purchase-option"
      - "POST /fleet/agreements/{agreement_id}/decline-purchase-option"
    shared_operations:
      - "POST /fleet/insurance-certificates (with FleetAdmin)"
      - "POST /fleet/agreements, /submit, /cancel (with FleetAdmin) — only when X-User-ID == Agreement.customer_id"
      - "GET reads on branches, trailer types, trailers, customers, certificates, rate cards, agreements, units, assessments and chargebacks"
