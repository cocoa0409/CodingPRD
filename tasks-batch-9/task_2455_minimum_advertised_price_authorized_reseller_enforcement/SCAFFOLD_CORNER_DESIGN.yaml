            - "Violation.${vio}.status == CURED"
            - "Violation.${vio}.resolution_reason == 'CURE_ACCEPTED'"
            - "Violation.${vio}.assessed_points == 3"
            - "EnforcementNotice.${not1}.status == SATISFIED"
            - "EnforcementNotice.${not1}.closed_reason == 'VIOLATION_CURED'"
            - "Reseller.${res}.violation_points_total == 3"

      - name: violation_noticed_to_disputed_stores_reason_without_touching_points
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.NOTICED_to_DISPUTED"]
        distinguishing_aspect: "Opening a dispute only records dispute_reason: dispute_rounds stays 0 (it advances on the REJECT decision, not on the filing) and the ledger stays at 3."
