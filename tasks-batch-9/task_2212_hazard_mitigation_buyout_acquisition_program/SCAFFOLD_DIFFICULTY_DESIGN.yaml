      - name: closing_funding_depends_on_sibling_relocation_case_reaching_settlement
        grounds:
          - validations.priority_58
          - entities.RelocationCase.fields.status
          - state_machines.RelocationCase.CLAIM_SUBMITTED_to_CLAIM_PAID
          - state_machines.ClosingRecord.SCHEDULED_to_FUNDED
          - calculations.federal_obligation
        distinguishing_aspect: |
          The blocking state sits LATERALLY: RelocationCase is a SIBLING child of the same Parcel as
          the ClosingRecord being funded, neither an ancestor (as in
          appraisal_creation_depends_on_grandparent_project_reaching_approved) nor an independent
          referenced root (as in demolition_start_depends_on_independent_contractor_aggregate_status).
          Funding is barred while the sibling case is OPENED and permitted once it reaches CLAIM_PAID,
          which in the same write adds its own 581250 to the project's federal obligation.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one OWNER_OCCUPIED parcel of acreage 0.34."
            - "The parcel's PurchaseOffer of 21400000 is ACCEPTED and a SCHEDULED ClosingRecord exists with scheduled_closing_date 2026-08-15 and settlement_cost_cents 400000."
            - "One RelocationCase in OPENED on the same parcel: OWNER_OCCUPANT, COMPARABLE_DWELLING, comparable_dwelling_price_cents 22000000, moving_expense_cents 175000."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "XENT-C", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
