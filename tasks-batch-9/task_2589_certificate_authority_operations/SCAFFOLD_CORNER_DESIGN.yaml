      - name: a_denormalised_sct_counter_is_current_on_the_next_read_and_ignores_duplicates
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ca/certificates/{id}/ct-submissions].side_effects
        distinguishing_aspect: "CtLogSubmission is an immutable append-only row whose parent counter is denormalised onto Certificate.sct_count, so this checks the harder half of an immediate model: the counter is correct on the very next read after each append, and appends that must not move it (a duplicate ACCEPTED operator, a REJECTED submission) leave the read unchanged rather than converging later. The final activation consumes the counter value written by the immediately preceding append."
        test_recipe:
          setup:
            - "One PREISSUANCE certificate under a profile requiring 2 SCTs, no CT submissions yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-profiles"
              payload: { name: "immediate-sct", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 2, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { profile_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${profile_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Immediate Sct Ltd", jurisdiction_code: "US-DE", registry_id: "REG-2060", contact_email: "ops@immediatesct.example", callback_phone: "+1-202-555-0160", credit_limit_cents: 500000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", domain_name: "www.immediatesct.example", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_id: $.data.id, token: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_id}/validate"
              payload: { challenge_token: "${token}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "Immediate Sct Signer", serial: "HSM-2060" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:30:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${profile_id}", requested_domains: ["www.immediatesct.example"], requested_validity_days: 90, csr_key_bits: 2048 }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/certificate-requests/${req_id}/issue"
              payload: { ceremony_id: "${cer_id}" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /ca/certificates/${cert_id}/ct-submissions"
              payload: { log_operator: "GOOGLE_ARGON", outcome: "ACCEPTED" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { counted_first: $.data.counted_toward_sct }
            - call: "GET /ca/certificates/${cert_id}"
              payload: {}
              as: ISSUANCE_OPERATOR
              captures: { sct_after_first: $.data.sct_count }
            - call: "POST /ca/certificates/${cert_id}/ct-submissions"
              payload: { log_operator: "GOOGLE_ARGON", outcome: "ACCEPTED" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { counted_dup: $.data.counted_toward_sct }
            - call: "GET /ca/certificates/${cert_id}"
              payload: {}
              as: ISSUANCE_OPERATOR
              captures: { sct_after_dup: $.data.sct_count }
            - call: "POST /ca/certificates/${cert_id}/ct-submissions"
              payload: { log_operator: "CLOUDFLARE_NIMBUS", outcome: "REJECTED", rejection_reason: "unknown issuer chain" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { counted_rej: $.data.counted_toward_sct }
            - call: "GET /ca/certificates/${cert_id}"
              payload: {}
              as: ISSUANCE_OPERATOR
              captures: { sct_after_rej: $.data.sct_count }
            - call: "POST /ca/certificates/${cert_id}/ct-submissions"
              payload: { log_operator: "CLOUDFLARE_NIMBUS", outcome: "ACCEPTED" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { counted_second: $.data.counted_toward_sct }
            - call: "GET /ca/certificates/${cert_id}"
              payload: {}
              as: ISSUANCE_OPERATOR
              captures: { sct_after_second: $.data.sct_count, ver_before_activate: $.data.version }
            - call: "POST /ca/certificates/${cert_id}/activate"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_3"
              captures: { activated_status: $.data.lifecycle_status }
          assert:
            - "${counted_first} == true and ${sct_after_first} == 1 on the read that immediately follows the append"
            - "${counted_dup} == false and ${sct_after_dup} == 1 (a repeat ACCEPTED operator never raises the counter, and the read does not drift upward afterwards)"
            - "${counted_rej} == false and ${sct_after_rej} == 1"
            - "${counted_second} == true and ${sct_after_second} == 2"
            - "the activation submitted straight after that read returns HTTP 200 with ${activated_status} == ISSUED, so the write path saw the same sct_count 2 the read reported (>= required_sct_count 2)"
            - "GET /ca/certificates/${cert_id} then reports version == ${ver_before_activate} + 1, and GET /ca/certificates/${cert_id}/ct-submissions lists all four submissions in sct_timestamp order with counted_toward_sct [true, false, false, true]"
