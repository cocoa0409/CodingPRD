  - rule_id: priority_pair_validation_conflict
    instances:

      - name: funding_plan_on_draft_order_prefers_consent_error_over_fiscal_error
        grounds:
          - validations.priority_52_ERR_CONSENT_NOT_RESOLVED
          - validations.priority_55_ERR_ORDER_STATE_INVALID
          - validations.priority_90_ERR_FUNDING_INSUFFICIENT
          - endpoints.POST_lsl_replacement_orders_id_funding_plan
        distinguishing_aspect: |
          Category pair: `business_referential` (priority 52) versus `business_fiscal`
          (priority 90), with a `state` rule (55) also violated in between. The order is DRAFT
          with consent NOT_REQUESTED and the water system has ZERO funding sources, so all
          three rules fire; only the lowest-numbered one may be reported. This is the pair the
          ladder deliberately inverts: the referential consent check is ordered ahead of the
          fulfillment-state check precisely so that the reported error names the missing
          consent canvass rather than the (downstream) wrong state.
        test_recipe:
          setup:
            - "WaterSystem with a PUBLISHED inventory and NO FundingSource rows at all, so calculations.funding_apportionment cannot cover a single cent."
            - "One LEAD ServiceLine and one ReplacementOrder on it left at fulfillment_state == DRAFT / consent_state == NOT_REQUESTED (no consent-request was ever issued)."
