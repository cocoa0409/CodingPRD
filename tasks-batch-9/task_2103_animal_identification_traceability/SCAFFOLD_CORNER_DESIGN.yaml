            - "${err_rb2} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "${err_rb3} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "TagLot.${lot_rb}.applied_count == 1 and Tag.${tag_rb}.device_status == APPLIED"
            - "GET /tag-lots?supplier_id=${sup_rb} returns exactly 1 row"

      - name: harvest_operator_identity_is_the_premises_itself
        claim_type: role_identity
        grounds: ["roles.HarvestFacilityOperator", "validations[priority=6]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "HarvestFacilityOperator is entity_backed:Premises, so a retire whose harvest_premises_id differs from X-User-ID is rejected with ERR_NOT_RESOURCE_OWNER at priority 6, before the referential checks at priority 14."
        test_recipe:
          setup:
            - "Producer owns P1 (COW_CALF, ACTIVE) with one animal and two HARVEST_FACILITY premises PH1 and PH2, both ACTIVE."
            - "The animal has been moved to PH1 and received there."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Operator Co", contact_email: "ops@operator.example", state_code: "NE" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_op: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_op}", pin: "NEO0001", operation_type: "COW_CALF", state_code: "NE", capacity: 10 }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { op1: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_op}", pin: "NEO0002", operation_type: "HARVEST_FACILITY", state_code: "NE", capacity: 10 }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { oph1: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_op}", pin: "NEO0003", operation_type: "HARVEST_FACILITY", state_code: "NE", capacity: 10 }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { oph2: $.data.id }
            - call: "POST /premises/${op1}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-ne-1"
            - call: "POST /premises/${oph1}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-ne-1"
            - call: "POST /premises/${oph2}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-ne-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "Y-Tex Devices", supplier_code: "YTEX" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_op: $.data.id }
            - call: "POST /device-suppliers/${sup_op}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_op_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_op}", premises_id: "${op1}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_op_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_op}"
              captures: { lot_op: $.data.id }
            - call: "POST /tag-lots/${lot_op}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-05-02", birth_premises_id: "${op1}" }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { an_op: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
            - call: "POST /movement-events"
              payload: { animal_id: "${an_op}", origin_premises_id: "${op1}", destination_premises_id: "${oph1}", departed_at: "2026-08-02T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { mv_op: $.data.id }
            - call: "POST /movement-events/${mv_op}/receive"
              payload: { arrived_at: "2026-08-02T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_op}"
            - call: "GET /tags"
              payload: { animal_id: "${an_op}" }
              as: Producer
              as_user_id: "${prod_op}"
              captures: { tag_op: "$.data[0].id" }
          trigger:
            - call: "POST /tags/${tag_op}/retire"
              payload: { harvest_premises_id: "${oph1}", harvested_at: "2026-08-02T00:00:00Z", carcass_ref: "CARC-9", tag_returned: true }
              as: HarvestFacilityOperator
              as_user_id: "${oph2}"
              captures: { err_op: $.data.error_id }
          assert:
            - "${err_op} == ERR_NOT_RESOURCE_OWNER with HTTP 403"
            - "Tag.${tag_op}.device_status == APPLIED"
            - "The same call with as_user_id ${oph1} returns 200 and Tag.${tag_op}.device_status == RETIRED"

  - section: cross_cutting_complexity_layers
    instances:

      - name: version_increments_on_every_mutation_including_cascades
        claim_type: optimistic_concurrency
        grounds: ["entities.Premises.fields.version", "entities.DeviceSupplier.fields.version", "concurrency_rules[tag-lot-create-stale-supplier]"]
        distinguishing_aspect: "Premises.version advances on its own approve AND on the cascaded animal_count change produced by a tag application elsewhere, which is exactly why an OCC caller must re-read the parent before writing."
        test_recipe:
          setup:
            - "An ACTIVE premises with a 10-device lot; the caller records the premises version right after approval."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Version Co", contact_email: "ops@version.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_vc: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_vc}", pin: "COY0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_vc}"
              captures: { pvc: $.data.id, v_create: $.data.version }
            - call: "POST /premises/${pvc}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
              captures: { v_approved: $.data.version }
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_vc: $.data.id, sv_create: $.data.version }
            - call: "POST /device-suppliers/${sup_vc}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_vc_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_vc}", premises_id: "${pvc}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_vc_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_vc}"
              captures: { lot_vc: $.data.id }
          trigger:
            - call: "POST /tag-lots/${lot_vc}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-05-03", birth_premises_id: "${pvc}" }
              as: Producer
              as_user_id: "${prod_vc}"
            - call: "GET /premises/${pvc}"
              payload: {}
              as: Producer
              as_user_id: "${prod_vc}"
              captures: { v_after_apply: $.data.version }
            - call: "GET /device-suppliers/${sup_vc}"
              payload: {}
              as: DeviceSupplierRep
              as_user_id: "${sup_vc}"
              captures: { sv_after_lot: $.data.version }
          assert:
            - "${v_create} == 1 and ${v_approved} == 2"
            - "${sv_create} == 1 and ${sup_vc_v} == 2 and ${sv_after_lot} == 3"
            - "${v_after_apply} > ${v_approved} (the cascaded animal_count change bumped the premises version)"
            - "Premises.${pvc}.animal_count == 1"

      - name: stale_expected_supplier_version_on_lot_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tag-lot-create-stale-supplier]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "The second sequential lot creation reuses the supplier version observed before the first lot and is rejected with ERR_STALE_VERSION (412), leaving issued_tag_count at the first lot's quantity."
        test_recipe:
          setup:
            - "APPROVED supplier and ACTIVE premises; the caller captures the supplier version once, at approval."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Stale Co", contact_email: "ops@stale.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_st: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_st}", pin: "COE0001", operation_type: "FEEDLOT", state_code: "CO", capacity: 500 }
              as: Producer
              as_user_id: "${prod_st}"
              captures: { pst: $.data.id }
            - call: "POST /premises/${pst}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_st: $.data.id }
            - call: "POST /device-suppliers/${sup_st}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_st_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_st}", premises_id: "${pst}", serial_start: 100000000001, serial_end: 100000000100, expected_supplier_version: "${sup_st_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_st}"
              captures: { lot_st1: $.data.id }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_st}", premises_id: "${pst}", serial_start: 100000000101, serial_end: 100000000200, expected_supplier_version: "${sup_st_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_st}"
              captures: { err_stale: $.data.error_id }
          assert:
            - "${err_stale} == ERR_STALE_VERSION"
            - "HTTP status is 412"
            - "DeviceSupplier.${sup_st}.issued_tag_count == 100"
            - "GET /tag-lots?supplier_id=${sup_st} returns exactly 1 row whose id == ${lot_st1}"

      - name: derived_field_reconciliation_on_animal_ain
        claim_type: derived_field_reconciliation
        grounds: ["entities.Animal.fields.ain"]
        excluded_because:
          difficulty_instance: dual_variant_calc / book_balance_as_issued_vs_as_sighted_diverge
          rationale: "Animal.ain re-derivation is asserted by the corner instance tag_replacement_chain_is_discoverable_through_self_referential_fk, whose replace trigger checks Animal.ain against the new device."

      - name: cascading_side_effects_depth_and_ordering
        claim_type: cascading_side_effects
        grounds: ["state_machines.MovementEvent.REPORTED_to_RECEIVED", "state_machines.Tag.APPLIED_to_RETIRED"]
        excluded_because:
          difficulty_instance: transitive_cascade / receive_cascade_movement_sighting_animal_premises_producer
          rationale: "Both multi-hop chains are asserted end to end by the two transitive_cascade difficulty instances."

  - section: consistency_model
    instances:

      - name: cascade_results_are_visible_in_the_triggering_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.POST_/tag-lots/{id}/apply-tag"]
        distinguishing_aspect: "consistency_model is immediate: the apply-tag response itself already carries the animal's projected current_premises_id and the lot and premises counters are consistent on the very next read, with no second call needed to settle them."
        test_recipe:
          setup:
            - "APPROVED supplier, ACTIVE premises and a 10-device lot with no applications."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Immediate Co", contact_email: "ops@immediate.example", state_code: "CO" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_ic: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_ic}", pin: "COD0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_ic}"
              captures: { pic: $.data.id }
            - call: "POST /premises/${pic}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_ic: $.data.id }
            - call: "POST /device-suppliers/${sup_ic}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_ic_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_ic}", premises_id: "${pic}", serial_start: 100000000001, serial_end: 100000000010, expected_supplier_version: "${sup_ic_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_ic}"
              captures: { lot_ic: $.data.id }
          trigger:
            - call: "POST /tag-lots/${lot_ic}/apply-tag"
              payload: { ain: "840100000000001", species: "BOVINE", birth_date: "2026-05-04", birth_premises_id: "${pic}" }
              as: Producer
              as_user_id: "${prod_ic}"
              captures: { an_ic: $.data.id, cur_prem: $.data.current_premises_id, life_ic: $.data.lifecycle_status }
          assert:
            - "${cur_prem} == ${pic} and ${life_ic} == ACTIVE (projection already applied in the creating response)"
            - "GET /premises/${pic} immediately after returns animal_count == 1"
            - "GET /tag-lots/${lot_ic} immediately after returns applied_count == 1, unapplied_count == 9 and status == ACTIVE"
            - "GET /producers/${prod_ic} immediately after returns enrolled_head_count == 1 and incentive_tier == TIER_1"
