          trigger:
            - call: "POST /piercing-services/consents/${cons_id}/verify"
              payload: { }
              as: IntakeAssociate
              captures: { err: "$.data.error_id" }
          assert:
            - "the response error_id == ERR_GUARDIAN_VERIFICATION_REQUIRED"
            - "ConsentRecord.${cons_id}.consent_status == PENDING"

