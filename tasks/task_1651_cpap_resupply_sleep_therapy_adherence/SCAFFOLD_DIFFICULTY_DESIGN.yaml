  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: ≥2 instances from DIFFERENT triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: adherence_finalize_to_rental_pause_depth3
        grounds:
          - state_machines.AdherenceReport.UNDER_REVIEW_to_FINALIZED
          - state_machines.Patient.ACTIVE_THERAPY_to_NON_COMPLIANT_HOLD
          - state_machines.RentalContract.BILLING_to_PAUSED_NON_COMPLIANCE
          - state_machines.ComponentSupplyPlan
        distinguishing_aspect: |
          Trigger = AdherenceReport finalize (depth 3). Hop1: report finalize
          mutates Patient.is_compliance_current. Hop2: that Patient mutation
          itself triggers Patient ACTIVE_THERAPY -> NON_COMPLIANT_HOLD. Hop3:
          that Patient transition itself triggers RentalContract BILLING ->
          PAUSED_NON_COMPLIANCE AND each ComponentSupplyPlan ACTIVE ->
          SUSPENDED_NON_COMPLIANCE. Each link is caused by the previous link,
          not by the original finalize call.
        test_recipe:
          setup:
            - "PayerPolicy p1 standard; Patient pat7 RENTAL setup complete -> ACTIVE_THERAPY; ComponentSupplyPlans ACTIVE; RentalContract rc7 in BILLING after first sweep"
            - "Bill month 1 to place rc7 firmly in BILLING"
