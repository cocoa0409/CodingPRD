          setup:
            - "Personnel: two DesignEngineers (SoD), one WeldingEngineer, one QCInspector."
            - "A PRESSURE_VESSEL job J-2885-12 in FAB_PLANNING with both design sheets APPROVED."
            - "Heat H-4471 (SA-516-70, PLATE) received at exactly 2000.00 lb, MTR reviewed ACCEPT, so quantity_issued_lb = 0.00, quantity_remaining_lb = 2000.00 and status = ACCEPTED."
            - "No part has been issued from the heat yet."
