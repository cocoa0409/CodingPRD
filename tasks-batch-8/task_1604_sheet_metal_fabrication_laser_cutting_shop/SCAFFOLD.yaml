# =============================================================================
# SCAFFOLD — Sheet-Metal Fabrication & Laser Cutting Shop
# §1.0–§1.7 (difficulty design §1.8 and corner design §1.9 live in sibling files)
# =============================================================================

scenario: |
  Sheet-Metal Fabrication & Laser Cutting Shop (SendCutSend / local fab shop):
  nest optimization & sheet yield, material grade/gauge inventory & remnant,
  quote by cut-time + bend count + finish, routing across laser/brake/weld/powder,
  outside plating vendor & lead time, first-piece inspection & flatness,
  expedite/rush surcharge, drop-off scrap credit

domain_name: sheet-metal-fab
api_prefix: /fab

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (flat topology — all FK links, no URL nesting)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Customer company name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per customer" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding approved-order total allowed; 0 = prepay only" }
      - { name: scrap_credit_balance_cents, type: integer, source: computed, default: 0, description: "Running store-credit balance from drop-off scrap; debited by scrap_credit_application at payment" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED. SUSPENDED blocks new quote submission.", constraints: "enum {ACTIVE, SUSPENDED}" }

  - name: MaterialGrade
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique grade code, e.g. AL5052, CRS1008, SS304" }
      - { name: alloy_family, type: enum, source: input, description: "ALUMINUM | CARBON_STEEL | STAINLESS", constraints: "enum {ALUMINUM, CARBON_STEEL, STAINLESS}" }
      - { name: density_g_per_cm3, type: number, source: input, description: "Density used for weight reporting (2.70 Al / 7.85 steel / 8.00 stainless)" }
      - { name: hardness_factor, type: number, source: input, description: "Cut-rate hardness multiplier: 1.00 carbon, 1.15 aluminum, 1.40 stainless" }
      - { name: base_cut_rate_cents_per_sec, type: number, source: input, description: "Laser cut base rate at thickness tier 0" }
      - { name: material_cost_cents_per_cm2, type: number, source: input, description: "Stock material cost per cm^2 of plate area" }
      - { name: scrap_rate_cents_per_cm2, type: number, source: input, description: "Scrap credit rate per credited cm^2 for this grade" }
      - { name: thickness_tiers, type: array, source: input, description: "Ordered gauge table: [{max_thickness_mm, tier_index}] ascending; tier_index drives cut-rate surcharge and bend-unit thickness class" }
      - { name: weld_compatible, type: boolean, source: input, description: "Whether WELD station accepts this grade" }
      - { name: powder_compatible, type: boolean, source: input, description: "Whether in-house POWDER station accepts this grade" }

  - name: SheetStock
    parent: null
    common_fields: true
    fields:
      - { name: grade_id, type: string, source: input, description: "FK -> MaterialGrade.id; material grade of this sheet/remnant" }
      - { name: thickness_mm, type: number, source: input, description: "Gauge thickness in mm" }
      - { name: width_mm, type: integer, source: input, description: "Sheet width" }
      - { name: height_mm, type: integer, source: input, description: "Sheet height" }
      - { name: kind, type: enum, source: system, default: FULL_SHEET, description: "FULL_SHEET (1200x2400 stock) | REMNANT (usable offcut retained in inventory)", constraints: "enum {FULL_SHEET, REMNANT}" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | CONSUMED | SCRAPPED | DROPPED_OFF", constraints: "enum {AVAILABLE, CONSUMED, SCRAPPED, DROPPED_OFF}" }
      - { name: source_order_id, type: string, source: system, description: "FK -> FabricationOrder.id; set on REMNANTs generated by nesting, null otherwise", constraints: "nullable" }

  - name: Machine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Machine name (unique)" }
      - { name: station, type: enum, source: input, description: "LASER | BRAKE | WELD | POWDER — outside plating is never a Machine", constraints: "enum {LASER, BRAKE, WELD, POWDER}" }
      - { name: shift_minutes_per_day, type: integer, source: input, description: "Bookable minutes per calendar day (e.g. 480)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DOWN — DOWN machines reject new reservations but keep existing load", constraints: "enum {ACTIVE, DOWN}" }

  - name: OutsideVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: process, type: enum, source: input, description: "PLATING | ANODIZING — outside-only finishes", constraints: "enum {PLATING, ANODIZING}" }
      - { name: lead_time_days, type: integer, source: input, description: "Standard round-trip lead time in calendar days" }
      - { name: base_cost_cents_per_part, type: integer, source: input, description: "Vendor pass-through cost per part, marked up into finish_cost" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "enum {ACTIVE, INACTIVE}" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; quote owner" }
      - { name: expedite_tier, type: enum, source: input, default: STANDARD, description: "STANDARD (x1.00) | EXPEDITE (x1.25) | RUSH (x1.50) — multiplier applied after quantity discount", constraints: "enum {STANDARD, EXPEDITE, RUSH}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PRICED -> SUBMITTED -> ACCEPTED | EXPIRED | REJECTED; SUBMITTED -> DRAFT revise loop allowed", constraints: "enum {DRAFT, PRICED, SUBMITTED, ACCEPTED, EXPIRED, REJECTED}" }
      - { name: quoted_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum over lines of quoted unit_total_cents * qty (non-nested material estimate)" }
      - { name: quoted_expedite_cents, type: integer, source: computed, default: 0, description: "Sum of per-line expedite surcharges (total - net before expedite)" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "Order-level quoted total; basis for customer credit check at acceptance" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last DRAFT/PRICED -> SUBMITTED transition" }
      - { name: expires_at, type: datetime, source: computed, description: "submitted_at + QUOTE_VALIDITY_DAYS (14); EXPIRED sweep compares against logical clock" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each SUBMITTED -> DRAFT revision" }

  - name: QuoteLine
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id" }
      - { name: grade_id, type: string, source: input, description: "FK -> MaterialGrade.id" }
      - { name: thickness_mm, type: number, source: input, description: "Gauge; selects thickness_tiers entry on the grade" }
      - { name: bbox_width_mm, type: integer, source: input, description: "Part bounding-box width (rectangular envelope used for cut math)" }
      - { name: bbox_height_mm, type: integer, source: input, description: "Part bounding-box height" }
      - { name: hole_count, type: integer, source: input, default: 0, description: "Count of circular cutouts (diameter hole_diameter_mm each)" }
      - { name: hole_diameter_mm, type: number, source: input, default: 20, description: "Hole diameter used for cut-length contribution" }
      - { name: corner_fillet_count, type: integer, source: input, default: 0, description: "Each fillet adds one pierce" }
      - { name: bend_count, type: integer, source: input, default: 0, description: "Number of press-brake bends; > 0 routes the line through BRAKE" }
      - { name: weld_inches, type: number, source: input, default: 0, description: "Weld seam inches; > 0 requires grade.weld_compatible and routes through WELD" }
      - { name: finish, type: enum, source: input, default: NONE, description: "NONE | POWDER | PLATING | ANODIZING", constraints: "enum {NONE, POWDER, PLATING, ANODIZING}" }
      - { name: qty, type: integer, source: input, description: "Quantity (>= 1)" }
      - { name: cut_seconds_est, type: number, source: computed, description: "Raw estimated laser seconds for ONE part (before per-second ceil)" }
      - { name: billed_cut_seconds, type: integer, source: computed, description: "ceil(cut_seconds_est) — whole-second billing quantum" }
      - { name: thickness_tier_index, type: integer, source: computed, description: "Resolved tier from grade.thickness_tiers for thickness_mm" }
      - { name: bend_units, type: integer, source: computed, description: "1 + thickness_class + complexity_class per bend, times bend_count" }
      - { name: finish_cost_cents, type: integer, source: computed, description: "Per-part finish cost (0 for NONE)" }
      - { name: material_cost_cents, type: integer, source: computed, description: "QUOTED variant material estimate per part (non-nested); superseded at commit" }
      - { name: line_base_cents, type: integer, source: computed, description: "cut + bend + finish + material + setup share (per part, before discounts)" }
      - { name: qty_discount_pct, type: number, source: computed, description: "Tiered discount from qty: 0 / 0.04 / 0.08 / 0.12" }
      - { name: line_total_cents, type: integer, source: computed, description: "Per-unit total after quantity discount and expedite multiplier" }
      - { name: status, type: enum, source: system, default: ESTIMATED, description: "ESTIMATED | PRICED | SUPERSEDED — line rows are re-priced wholesale on revision", constraints: "enum {ESTIMATED, PRICED, SUPERSEDED}" }

  - name: FabricationOrder
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; set at acceptance (1:1 with quote)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; denormalized from quote at acceptance" }
      - { name: expedite_tier, type: enum, source: system, description: "Snapshot of quote.expedite_tier at acceptance", constraints: "enum {STANDARD, EXPEDITE, RUSH}" }
      - { name: status, type: enum, source: system, default: NESTING, description: "NESTING -> NESTED -> IN_PRODUCTION -> AWAITING_OUTSIDE -> FINISHING -> INSPECTION -> COMPLETED | CANCELLED | ON_HOLD", constraints: "enum {NESTING, NESTED, IN_PRODUCTION, AWAITING_OUTSIDE, FINISHING, INSPECTION, COMPLETED, CANCELLED, ON_HOLD}" }
      - { name: hold_reason, type: enum, source: system, description: "CAPACITY | VENDOR_DELAY — set on entry to ON_HOLD", constraints: "enum {CAPACITY, VENDOR_DELAY}; nullable" }
      - { name: committed_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of committed per-part base * qty (nested material math)" }
      - { name: committed_total_cents, type: integer, source: computed, default: 0, description: "Order total under COMMITTED variant; invoice amount" }
      - { name: total_plate_area_cm2, type: integer, source: computed, default: 0, description: "Sum over nest sheets of chargeable part area + kerf allowance (drives committed material cost)" }
      - { name: scrap_credit_applied_cents, type: integer, source: computed, default: 0, description: "Credit drawn from customer balance at payment" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID -> PAID — parallel dimension, independent of lifecycle status", constraints: "enum {UNPAID, PAID}" }
      - { name: paid_at, type: datetime, source: system, description: "Logical timestamp of payment", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical timestamp of INSPECTION -> COMPLETED", constraints: "nullable" }
      - { name: due_date, type: datetime, source: computed, description: "Latest station due across routings + plating lead time when AWAITING_OUTSIDE" }

  - name: NestSheet
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> FabricationOrder.id" }
      - { name: sheet_stock_id, type: string, source: system, description: "FK -> SheetStock.id; stock unit consumed by this nest sheet" }
      - { name: sheet_index, type: integer, source: system, description: "0-based sheet number within the order's nest" }
      - { name: chargeable_area_cm2, type: number, source: computed, description: "Sum of part bbox areas nested on this sheet" }
      - { name: kerf_allowance_cm2, type: number, source: computed, description: "Fixed skeleton/kerf allowance charged per sheet (constant)" }
      - { name: plate_in_area_cm2, type: number, source: computed, description: "chargeable_area_cm2 + kerf_allowance_cm2 — feeds committed material cost" }
      - { name: yield_pct, type: number, source: computed, description: "chargeable_area_cm2 / plate_in_area_cm2 (4-decimal proportion, round_half_up)" }
      - { name: remnant_stock_id, type: string, source: system, description: "FK -> SheetStock.id; REMNANT row created from this sheet's offcut when eligible", constraints: "nullable" }

  - name: RoutingStep
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> FabricationOrder.id" }
      - { name: station, type: enum, source: system, description: "LASER | BRAKE | WELD | POWDER | OUTSIDE_VENDOR — routing sequence derived from line features", constraints: "enum {LASER, BRAKE, WELD, POWDER, OUTSIDE_VENDOR}" }
      - { name: seq, type: integer, source: system, description: "1-based step order; contiguous per order" }
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; assigned machine for in-house stations", constraints: "nullable for OUTSIDE_VENDOR" }
      - { name: vendor_id, type: string, source: system, description: "FK -> OutsideVendor.id; assigned vendor for OUTSIDE_VENDOR steps", constraints: "nullable for in-house stations" }
      - { name: planned_minutes, type: integer, source: computed, description: "Reserved minutes on the machine (or vendor handling minutes) for capacity accounting" }
      - { name: completing_operator_id, type: string, source: system, description: "X-User-ID of the MachineOperator who completed the step; drives segregation-of-duties at inspection", constraints: "nullable" }
      - { name: due_date, type: datetime, source: computed, description: "Scheduled due instant; order expedite tier compresses the chain" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> IN_PROGRESS -> COMPLETED | SKIPPED; rework may reset a step to PENDING", constraints: "enum {PENDING, IN_PROGRESS, COMPLETED, SKIPPED}" }

  - name: InspectionReport
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> FabricationOrder.id; report belongs to exactly one order" }
      - { name: inspector_id, type: string, source: system, description: "X-User-ID of the QCInspector who submitted; must differ from the operator who completed the last routing step (segregation of duties)" }
      - { name: flatness_deviation_mm, type: number, source: input, description: "Max measured out-of-flat deviation on first piece" }
      - { name: measured_diagonal_mm, type: integer, source: input, description: "Reference diagonal for the flatness percentage" }
      - { name: dimensional_pass, type: boolean, source: input, description: "Whether critical dimensions are in tolerance" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — FAIL iff flatness% > 0.15% or dimensional_pass false", constraints: "enum {PASS, FAIL}" }

  - name: ScrapCredit
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; credit recipient" }
      - { name: sheet_stock_id, type: string, source: input, description: "FK -> SheetStock.id; polymorphic source — a REMNANT surrendered from inventory OR a walk-in DROPPED_OFF sheet", constraints: "references SheetStock of kind REMNANT or DROPPED_OFF" }
      - { name: credited_area_cm2, type: number, source: computed, description: "min(source area, 10% of standard sheet area, 90000 cm2 per event)" }
      - { name: credit_cents, type: integer, source: computed, description: "round_half_up(credited_area_cm2 * grade.scrap_rate_cents_per_cm2)" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | APPLIED | VOID — APPLIED once drawn against an invoice", constraints: "enum {POSTED, APPLIED, VOID}" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource" }
      - { name: entity_id, type: string, source: system, description: "ID of the mutated resource" }
      - { name: event_type, type: string, source: system, description: "Transition or cascade label, e.g. QUOTE_SUBMITTED, NEST_COMPLETED, INSPECTION_FAIL_REWORK" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the caller (or 'system')" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the caller (or 'system')" }
      - { name: detail, type: object, source: system, description: "Before/after field map for the mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, REJECTED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /fab/quotes/{id}/price"
        actor: Estimator
        preconditions:
          - "Quote in DRAFT (ERR_QUOTE_NOT_OPEN)"
          - "Quote has >= 1 line in ESTIMATED or PRICED (ERR_QUOTE_EMPTY)"
          - "Every line validates: grade exists, finish/route compatibility, thickness tier resolvable (ERR_INVALID_LINE_SPEC / ERR_FINISH_NOT_COMPATIBLE / ERR_THICKNESS_TIER_UNRESOLVED)"
        side_effects:
          - "Recompute every line via quote_line_pricing (QUOTED variant) and set line.status = PRICED"
          - "Recompute quote.quoted_subtotal_cents, quoted_expedite_cents, quoted_total_cents"
          - "Append AuditEvent QUOTE_PRICED"
      - from: PRICED
        to: SUBMITTED
        trigger: "POST /fab/quotes/{id}/submit"
        actor: Estimator
        preconditions:
          - "Quote in PRICED (ERR_QUOTE_NOT_PRICED)"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "Set submitted_at = logical clock; expires_at = submitted_at + 14 days"
          - "Append AuditEvent QUOTE_SUBMITTED"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /fab/quotes/{id}/revise"
        actor: Estimator
        preconditions:
          - "Quote in SUBMITTED (ERR_QUOTE_NOT_OPEN)"
        side_effects:
          - "revision_count += 1; all lines -> ESTIMATED (stale prices discarded); submitted_at/expires_at cleared"
          - "Append AuditEvent QUOTE_REVISED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /fab/quotes/{id}/accept"
        actor: CustomerRep
        preconditions:
          - "Quote in SUBMITTED (ERR_QUOTE_NOT_OPEN)"
          - "Logical clock < quote.expires_at (ERR_QUOTE_EXPIRED)"
          - "Sum of quoted_total_cents over caller's ACCEPTED-order quotes + this quote.quoted_total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Create FabricationOrder (status NESTING, payment UNPAID) denormalizing customer + expedite tier"
          - "Run nesting (calc nest_and_yield): create NestSheet rows, consume SheetStock (AVAILABLE -> CONSUMED), create REMNANT SheetStock rows when eligible, set order.total_plate_area_cm2"
          - "Recompute order committed totals (quote_line_pricing COMMITTED variant) via order_commit_totals"
          - "Generate RoutingStep chain (calc routing_generation) with machine selector and capacity reservation (calc capacity_booking)"
          - "Append AuditEvent QUOTE_ACCEPTED + ORDER_CREATED"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (logical clock reaches expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "All lines -> SUPERSEDED"
          - "Append AuditEvent QUOTE_EXPIRED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fab/quotes/{id}/reject"
        actor: CustomerRep
        preconditions:
          - "Quote in SUBMITTED (ERR_QUOTE_NOT_OPEN)"
        side_effects:
          - "All lines -> SUPERSEDED"
          - "Append AuditEvent QUOTE_REJECTED"

  - entity: FabricationOrder
    initial_state: NESTING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: NESTING
        to: NESTED
        trigger: "system (end of accept cascade) or POST /fab/orders/{id}/renest"
        actor: system
        preconditions:
          - "At least one NestSheet produced (ERR_NEST_INFEASIBLE otherwise — accept fails atomically)"
        side_effects:
          - "committed totals recomputed (order_commit_totals)"
      - from: NESTED
        to: NESTED
        trigger: "POST /fab/orders/{id}/renest (self-loop rebuild)"
        actor: ProductionPlanner
        preconditions:
          - "Order in NESTING or NESTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "NestSheet rows discarded and rebuilt; stock released and re-selected; order_commit_totals recomputed"
      - from: NESTED
        to: IN_PRODUCTION
        trigger: "POST /fab/orders/{id}/release"
        actor: ProductionPlanner
        preconditions:
          - "Order in NESTED (ERR_ORDER_NOT_RELEASEABLE)"
          - "Every routing step's machine ACTIVE (ERR_MACHINE_DOWN)"
        side_effects:
          - "First RoutingStep (seq=1) -> IN_PROGRESS"
          - "Append AuditEvent ORDER_RELEASED"
      - from: IN_PRODUCTION
        to: AWAITING_OUTSIDE
        trigger: "system (last in-house step COMPLETED and a routing step with station OUTSIDE_VENDOR exists and is PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "OUTSIDE_VENDOR step -> IN_PROGRESS; due_date = logical clock + vendor.lead_time_days (RUSH tier: ceil(lead_time_days/2))"
          - "Append AuditEvent ORDER_SENT_OUTSIDE"
      - from: AWAITING_OUTSIDE
        to: FINISHING
        trigger: "POST /fab/orders/{id}/receive-outside"
        actor: ProductionPlanner
        preconditions:
          - "Order in AWAITING_OUTSIDE (ERR_ORDER_NOT_AWAITING_OUTSIDE)"
          - "Logical clock >= OUTSIDE_VENDOR step.due_date (ERR_VENDOR_LEAD_TIME_NOT_ELAPSED)"
        side_effects:
          - "OUTSIDE_VENDOR step -> COMPLETED; next in-house step (if any) -> IN_PROGRESS; else order -> INSPECTION"
          - "Append AuditEvent ORDER_RECEIVED_OUTSIDE"
      - from: IN_PRODUCTION
        to: FINISHING
        trigger: "system (step advance into POWDER or final WELD/BRAKE completion when no outside step exists — see routing_step_advance)"
        actor: system
        preconditions: []
        side_effects:
          - "Next PENDING step -> IN_PROGRESS"
      - from: FINISHING
        to: INSPECTION
        trigger: "system (all RoutingStep rows COMPLETED or SKIPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "Append AuditEvent ORDER_READY_FOR_INSPECTION"
      - from: INSPECTION
        to: COMPLETED
        trigger: "POST /fab/orders/{id}/inspection-reports with result PASS"
        actor: QCInspector
        preconditions:
          - "Order in INSPECTION (ERR_ORDER_NOT_IN_INSPECTION)"
          - "inspector_id != order's last completing operator (ERR_SOD_VIOLATION)"
          - "report result == PASS (flatness% <= 0.15% AND dimensional_pass) else order reworks"
        side_effects:
          - "Order -> COMPLETED; completed_at stamped"
          - "Append AuditEvent ORDER_COMPLETED"
      - from: INSPECTION
        to: IN_PRODUCTION
        trigger: "POST /fab/orders/{id}/inspection-reports with result FAIL (rework loop)"
        actor: QCInspector
        preconditions:
          - "Order in INSPECTION"
          - "report result == FAIL"
        side_effects:
          - "Routing steps for stations implicated by the failure reset COMPLETED -> PENDING (rework queue); their reserved minutes are re-booked via capacity_booking"
          - "Append AuditEvent INSPECTION_FAIL_REWORK"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "POST /fab/orders/{id}/hold"
        actor: ProductionPlanner
        preconditions:
          - "Order in IN_PRODUCTION or AWAITING_OUTSIDE or FINISHING (ERR_ORDER_NOT_HOLDABLE)"
        side_effects:
          - "hold_reason set from payload (CAPACITY | VENDOR_DELAY)"
          - "Append AuditEvent ORDER_HELD"
      - from: AWAITING_OUTSIDE
        to: ON_HOLD
        trigger: "POST /fab/orders/{id}/hold"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["hold_reason set", "Append AuditEvent ORDER_HELD"]
      - from: FINISHING
        to: ON_HOLD
        trigger: "POST /fab/orders/{id}/hold"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["hold_reason set", "Append AuditEvent ORDER_HELD"]
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /fab/orders/{id}/resume"
        actor: ProductionPlanner
        preconditions:
          - "Order in ON_HOLD (ERR_ORDER_NOT_ON_HOLD)"
        side_effects:
          - "Order returns to the status held in its last AuditEvent before ORDER_HELD (resume-target resolution)"
          - "Capacity re-validated for all PENDING/IN_PROGRESS steps (capacity_booking; may reassign machines per selector)"
          - "Append AuditEvent ORDER_RESUMED"
      - from: NESTING
        to: CANCELLED
        trigger: "POST /fab/orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "Order in NESTING or NESTED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "All NestSheet rows deleted; consumed SheetStock -> AVAILABLE; generated REMNANT rows -> SCRAPPED"
          - "Committed totals zeroed"
          - "Append AuditEvent ORDER_CANCELLED"
      - from: NESTED
        to: CANCELLED
        trigger: "POST /fab/orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "Same nest-release cascade as NESTING -> CANCELLED; capacity reservations for PENDING steps released"
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /fab/orders/{id}/payment (payment_status UNPAID -> PAID; lifecycle status unchanged)"
        actor: CustomerRep
        preconditions:
          - "Order lifecycle status == COMPLETED (ERR_INVALID_STATE)"
          - "payment_status == UNPAID (ERR_ALREADY_PAID)"
          - "payload.scrap_credit_to_apply_cents <= customer.scrap_credit_balance_cents (ERR_INSUFFICIENT_SCRAP_CREDIT)"
        side_effects:
          - "scrap_credit_applied_cents = min(requested, committed_total_cents); customer.scrap_credit_balance_cents debited; applied ScrapCredit rows POSTED -> APPLIED (FIFO by created_at)"
          - "payment_status -> PAID; paid_at stamped"
          - "Append AuditEvent ORDER_PAID"

  - entity: SheetStock
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, SCRAPPED, DROPPED_OFF]
    transitions:
      - from: AVAILABLE
        to: CONSUMED
        trigger: "system (nest_and_yield selects the sheet)"
        actor: system
        preconditions: []
        side_effects:
          - "If offcut eligible: create child REMNANT SheetStock (AVAILABLE) linked via source_order_id"
      - from: AVAILABLE
        to: SCRAPPED
        trigger: "POST /fab/sheet-stock/{id}/scrap"
        actor: InventoryClerk
        preconditions:
          - "Stock in AVAILABLE (ERR_STOCK_NOT_AVAILABLE)"
        side_effects: ["Append AuditEvent STOCK_SCRAPPED"]
      - from: AVAILABLE
        to: DROPPED_OFF
        trigger: "POST /fab/scrap-credits (customer drop-off: clerk pre-registers sheet then posts credit in one flow)"
        actor: InventoryClerk
        preconditions:
          - "Stock in AVAILABLE and registered with source_order_id null (walk-in stock)"
        side_effects:
          - "ScrapCredit POSTED; customer.scrap_credit_balance_cents credited (scrap_credit_posting)"
      - from: CONSUMED
        to: SCRAPPED
        trigger: "system (order cancel cascade for generated REMNANT rows only — consumed parents are restored to AVAILABLE instead)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoutingStep
    initial_state: PENDING
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system (order release or prior step completion — routing_step_advance)"
        actor: system
        preconditions:
          - "All lower-seq steps for the same order are COMPLETED or SKIPPED (strict serial routing)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fab/routing-steps/{id}/complete"
        actor: MachineOperator
        preconditions:
          - "Step in IN_PROGRESS (ERR_STEP_NOT_IN_PROGRESS)"
          - "Caller operator's X-User-ID is recorded as completing_operator_id (drives segregation-of-duties at inspection)"
        side_effects:
          - "routing_step_advance: next PENDING step -> IN_PROGRESS; if next is OUTSIDE_VENDOR, order -> AWAITING_OUTSIDE; if none remain, order -> INSPECTION"
          - "Machine booked load released by step.planned_minutes (capacity_booking)"
          - "Append AuditEvent STEP_COMPLETED"
      - from: IN_PROGRESS
        to: SKIPPED
        trigger: "POST /fab/routing-steps/{id}/skip"
        actor: ProductionPlanner
        preconditions:
          - "Step in IN_PROGRESS (ERR_STEP_NOT_IN_PROGRESS)"
          - "Step station != LASER (cutting is never skippable) (ERR_STEP_NOT_SKIPPABLE)"
        side_effects:
          - "Reserved minutes released; routing_step_advance fires as on completion"
      - from: COMPLETED
        to: PENDING
        trigger: "system (inspection FAIL rework loop)"
        actor: system
        preconditions: []
        side_effects:
          - "Minutes re-reserved on the same machine via capacity_booking"

  - entity: ScrapCredit
    initial_state: POSTED
    terminal_states: [APPLIED, VOID]
    transitions:
      - from: POSTED
        to: APPLIED
        trigger: "system (order payment draws credits FIFO by created_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: VOID
        trigger: "POST /fab/scrap-credits/{id}/void"
        actor: ShopManager
        preconditions:
          - "Credit in POSTED (ERR_CREDIT_NOT_VOIDABLE)"
          - "expected_customer_version matches customer.version (OCC — ERR_STALE_VERSION)"
        side_effects:
          - "customer.scrap_credit_balance_cents -= credit_cents (compensating reversal)"
          - "increments Customer.version by 1"
          - "Append AuditEvent CREDIT_VOIDED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only true races)
# =============================================================================
concurrency_rules:
  - rule_id: quote-reprice-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /fab/quotes/{id}/price"
    occ_field: "expected_quote_version"
    description: |
      Re-pricing a quote whose version has advanced since the client last
      observed it is rejected: another writer may have revised lines or the
      expedite tier, and re-pricing from a stale snapshot would silently
      discard those edits. Rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: credit-void-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /fab/scrap-credits/{id}/void"
    occ_field: "expected_customer_version"
    description: |
      Voiding a scrap credit against a Customer whose version has advanced
      since the client last read the balance is rejected: a concurrent credit
      application or a new posting may have changed scrap_credit_balance_cents,
      and the void would debit a balance the caller never observed.
      Rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_line_pricing
    trigger: "POST /fab/quotes/{id}/price (all lines), and quote accept (COMMITTED variant via order_commit_totals)"
    algorithm: tiered_pricing
    formula: |
      Per line (per single part, then per-unit total; qty multiplies at the end):
      1. tier_index = smallest index in grade.thickness_tiers with
         thickness_mm <= tiers[i].max_thickness_mm (strictly greater than the
         last tier's max => ERR_THICKNESS_TIER_UNRESOLVED).
      2. cut_length_mm = 2*(bbox_w + bbox_h) + hole_count * pi * hole_diameter_mm
         pierce_count = hole_count + corner_fillet_count + 1
         cut_seconds_est = 8.0 + 0.045 * cut_length_mm + 1.2 * pierce_count
         billed_cut_seconds = ceil(cut_seconds_est)
      3. cut_rate = grade.base_cut_rate_cents_per_sec
                    * (1 + 0.20 * tier_index) * grade.hardness_factor
         cut_cost_cents = round_half_up(billed_cut_seconds * cut_rate)
      4. bend_units = bend_count * (1 + thickness_class + complexity_class)
         thickness_class: tier_index 0 -> 1, tier_index 1 -> 2, tier_index >= 2 -> 3
         complexity_class: corner_fillet_count >= 4 -> 1 else 0
         bend_cost_cents = bend_units * 150
      5. finish_cost_cents per part:
           NONE      -> 0
           POWDER    -> qty_line * round_half_up(part_area_cm2 * 0.040)  [in-house]
           PLATING   -> qty_line * round_half_up(part_area_cm2 * 0.060)
                        + vendor.base_cost_cents_per_part * qty_line  [outside]
           ANODIZING -> qty_line * round_half_up(part_area_cm2 * 0.055)
                        + vendor.base_cost_cents_per_part * qty_line  [outside]
         where part_area_cm2 = bbox_w * bbox_h / 100; POWDER line-level rows are
         computed per line (qty multiplied inside), outside finishes add vendor cost.
      6. material_cost_cents (VARIANT — see variants below).
      7. line_base_cents = cut_cost + bend_cost + finish_cost + material_cost
                          + SETUP_FEE_PER_LINE (900)
      8. qty_discount_pct: qty >= 50 -> 0.12; qty >= 20 -> 0.08; qty >= 10 -> 0.04;
         else 0 (boundaries inclusive, evaluated top-down)
         net_cents = round_half_up(line_base_cents * (1 - qty_discount_pct))
      9. expedite multiplier on net: STANDARD 1.00 / EXPEDITE 1.25 / RUSH 1.50
         line_total_cents = round_half_up(net_cents * multiplier)
      EVALUATION ORDER IS PINNED: discount first, expedite second, quantity
      multiplied last at order aggregation (line_total_cents is PER PART).
      Order quoted_total_cents = sum over lines of line_total_cents * qty.
      All monetary rounding: integer cents, round_half_up, applied exactly where
      written — no intermediate rounding of rates or seconds.
    input_set: "QuoteLine rows of the quote in status ESTIMATED or PRICED; DRAFT/PRICED quotes only"
    constants:
      BASE_CUT_OVERHEAD_SEC: 8.0
      CUT_SPEED_SEC_PER_MM: 0.045
      PIERCE_SEC: 1.2
      TIER_RATE_STEP: 0.20
      BEND_UNIT_CENTS: 150
      POWDER_CENTS_PER_CM2: 0.040
      PLATING_CENTS_PER_CM2: 0.060
      ANODIZE_CENTS_PER_CM2: 0.055
      SETUP_FEE_PER_LINE: 900
      MIN_BILLABLE_AREA_CM2: 300
      QTY_TIERS: "50:0.12, 20:0.08, 10:0.04"
      EXPEDITE_MULT: "STANDARD:1.00, EXPEDITE:1.25, RUSH:1.50"
    precision: "integer cents, round_half_up; seconds to 3 decimals then ceil"
    variants:
      - name: quoted
        when: "At price time (quote not yet accepted)"
        difference: "material_cost_cents = round_half_up(max(part_area_cm2, MIN_BILLABLE_AREA_CM2) * grade.material_cost_cents_per_cm2) — per-part minimum-billing estimate, no nesting knowledge"
      - name: committed
        when: "At order commit (nest complete)"
        difference: "material cost is order-level: round_half_up(order.total_plate_area_cm2 * grade.material_cost_cents_per_cm2) allocated back per line proportional to that line's chargeable area (largest-remainder apportionment by line area desc, ties by line created_at ASC); usually LOWER per part than quoted because real nesting shares sheets and drops the per-part minimum"

  - name: nest_and_yield
    trigger: "quote accept cascade; POST /fab/orders/{id}/renest (NESTING orders only)"
    algorithm: constraint_propagation
    formula: |
      1. Expand each line into qty part rectangles (bbox_w x bbox_h, kerf 3 mm
         already absorbed into kerf allowance constant).
      2. Sheet selection: candidate stock = SheetStock rows with status
         AVAILABLE, grade/thickness matching the line, area >= largest part.
         Eligibility filter is explicit: status == AVAILABLE AND kind IN
         {FULL_SHEET, REMNANT}. Ranking: prefer REMNANT over FULL_SHEET; within
         kind, smallest area first; tie-break created_at ASC. id is never used.
      3. Guillotine grid pack per sheet: cols = floor(sheet_w / part_w),
         rows = floor(sheet_h / part_h); place row-major from (0,0); overflow
         spills to the next selected sheet; sheets_used increments.
      4. Per sheet: chargeable_area_cm2 = sum(placed part areas);
         kerf_allowance_cm2 = KERF_ALLOWANCE_PER_SHEET (5000);
         plate_in_area_cm2 = chargeable + kerf;
         yield_pct = round_half_up(chargeable / plate_in, 4 decimals).
      5. Remnant: candidate right_strip = (sheet_w - cols_used*part_w) x sheet_h;
         candidate top_strip = (cols_used*part_w) x (sheet_h - rows_used*part_h);
         remnant = larger-area candidate (tie -> right strip). If remnant area
         >= MIN_REMNANT_AREA_CM2 (2000): create SheetStock kind=REMNANT
         status=AVAILABLE with source_order_id = order.id and link
         NestSheet.remnant_stock_id; else offcut is scrapped (no row).
      6. order.total_plate_area_cm2 = sum(NestSheet.plate_in_area_cm2).
      Feasibility: if no eligible stock row can hold the largest part, or the
      FULL_SHEET pool plus REMNANT pool cannot fit total parts, reject accept
      with ERR_NEST_INFEASIBLE (atomic: no partial nest persists).
    input_set: "All quote lines at accept time; SheetStock status AVAILABLE matching grade+thickness"
    constants:
      STANDARD_SHEET_W_MM: 1200
      STANDARD_SHEET_H_MM: 2400
      KERF_ALLOWANCE_PER_SHEET_CM2: 5000
      MIN_REMNANT_AREA_CM2: 2000
    precision: "areas integer mm2 internally, cm2 reported to 1 decimal; yield 4 decimals round_half_up"

  - name: order_commit_totals
    trigger: "NESTING -> NESTED (accept cascade) and renest"
    algorithm: aggregation
    formula: |
      For each line: recompute cut/bend/finish exactly as quote_line_pricing
      steps 2-5 (unchanged), then material via the committed variant
      (apportionment of order-level plate cost by chargeable area, largest
      remainder, ties by line created_at ASC). Rebuild line_base, qty discount,
      expedite multiplier in the SAME pinned order as quote_line_pricing.
      order.committed_subtotal_cents = sum(line_base_cents * qty);
      order.committed_total_cents = sum(line_total_cents * qty).
      If committed_total_cents > quote.quoted_total_cents, the difference is
      absorbed by the shop (customer still pays quoted_total_cents);
      committed_total is the cost-accounting figure, quoted_total is the
      invoice figure. Both are persisted; the delta is the nesting-loss metric.
    input_set: "FabricationOrder with >= 1 NestSheet"
    constants: {}
    precision: "integer cents round_half_up"

  - name: routing_generation
    trigger: "order accept (after nest) and rework reset"
    algorithm: topological
    formula: |
      Station sequence per order is the union of line requirements in FIXED
      station order: LASER -> BRAKE (any bend_count > 0) -> WELD (any
      weld_inches > 0) -> OUTSIDE_VENDOR (finish PLATING or ANODIZING)
      -> POWDER (finish POWDER, in-house, always last). One RoutingStep per
      station present (order-level, not per-line).
      planned_minutes per step:
        LASER  = ceil(sum(billed_cut_seconds * qty) / 60) + sheets_used * 5 (load)
        BRAKE  = sum(bend_units) * 3
        WELD   = ceil(sum(weld_inches * qty) * 4)
        POWDER = 30 + ceil(sum(part_area_cm2 * qty) / 500)
        OUTSIDE_VENDOR = 0 in-house minutes (capacity-free; lead time instead)
      Machine selector per in-house station: eligibility = Machine rows with
      station == step.station AND status == ACTIVE; ranking = least booked
      minutes in the rolling horizon (capacity_booking); tie-break earliest
      created_at; empty pool -> ERR_NO_MACHINE_CAPACITY at accept.
      due_date chain: step[1].due = accept_time + SLA_DAYS[tier] (STANDARD 5d,
      EXPEDITE 3d, RUSH 1d) at LASER; each subsequent due = prior due (steps
      share the tier SLA chain; OUTSIDE_VENDOR due = its send time +
      vendor.lead_time_days, halved and rounded up for RUSH).
    input_set: "Accepted order's lines; Machine rows; OutsideVendor rows with status ACTIVE"
    constants:
      BRAKE_MIN_PER_BEND_UNIT: 3
      WELD_MIN_PER_INCH: 4
      POWDER_BASE_MIN: 30
      POWDER_AREA_DIVISOR: 500
      LASER_LOAD_MIN_PER_SHEET: 5
      SLA_DAYS: "STANDARD:5, EXPEDITE:3, RUSH:1"
    precision: "integer minutes, ceil where written"

  - name: capacity_booking
    trigger: "routing_generation, step completion/skip (release), rework reset (re-reserve), resume, renest"
    algorithm: threshold
    formula: |
      Per machine, booked load over rolling horizon H = 12 calendar days from
      logical clock: sum of planned_minutes of RoutingSteps in status PENDING or
      IN_PROGRESS whose due_date falls in [now, now + H].
      Capacity = shift_minutes_per_day * 12.
      Selector feasibility: candidate machine must satisfy
      booked + step.planned_minutes <= capacity * 0.90 (UTILIZATION_CAP).
      A machine exactly AT the cap (booked + planned == cap*0.90) IS feasible
      (<= boundary inclusive); one minute over is not.
      No eligible machine => ERR_NO_MACHINE_CAPACITY.
    input_set: "RoutingStep status in {PENDING, IN_PROGRESS} per machine"
    constants:
      HORIZON_DAYS: 12
      UTILIZATION_CAP: 0.90
    precision: "integer minutes"

  - name: expedite_surcharge
    trigger: "inside quote_line_pricing step 9 (separated for testability of the multiplier boundary)"
    algorithm: threshold
    formula: |
      multiplier = EXPEDITE_MULT[quote.expedite_tier]; applied to the
      quantity-discounted net, NEVER to the pre-discount base. RUSH also
      compresses routing SLA (routing_generation) and halves vendor lead time.
      The surcharge portion reported on the quote = line_total - net (per part).
    input_set: "Each priced line"
    constants:
      EXPEDITE_MULT: "STANDARD:1.00, EXPEDITE:1.25, RUSH:1.50"
    precision: "integer cents round_half_up"

  - name: flatness_check
    trigger: "POST /fab/orders/{id}/inspection-reports"
    algorithm: threshold
    formula: |
      flatness_pct = flatness_deviation_mm / measured_diagonal_mm (exact ratio)
      result = PASS iff flatness_pct <= 0.0015 AND dimensional_pass == true
      Boundary is INCLUSIVE: exactly 0.0015 passes; anything strictly greater fails.
    input_set: "Single InspectionReport"
    constants:
      FLATNESS_LIMIT: 0.0015
    precision: "ratio compared without rounding"

  - name: scrap_credit_posting
    trigger: "POST /fab/scrap-credits"
    algorithm: aggregation
    formula: |
      credited_area_cm2 = min(source_sheet_area_cm2,
                              0.10 * STANDARD_SHEET_AREA_CM2 (28800),
                              MAX_CREDIT_AREA_PER_EVENT (90000))
      credit_cents = round_half_up(credited_area_cm2 * grade.scrap_rate_cents_per_cm2)
      customer.scrap_credit_balance_cents += credit_cents (increments Customer.version)
      Source SheetStock: REMNANT surrendered from inventory (-> SCRAPPED) or
      walk-in sheet registered and moved AVAILABLE -> DROPPED_OFF.
    input_set: "Single ScrapCredit event"
    constants:
      STANDARD_SHEET_AREA_CM2: 28800
      CREDIT_CAP_FRACTION: 0.10
      MAX_CREDIT_AREA_PER_EVENT: 90000
    precision: "integer cents round_half_up"

  - name: scrap_credit_application
    trigger: "POST /fab/orders/{id}/payment"
    algorithm: waterfall_allocation
    formula: |
      requested = payload.scrap_credit_to_apply_cents (>= 0)
      applied = min(requested, customer.scrap_credit_balance_cents,
                    order.committed_total_cents)
      Drain POSTED ScrapCredit rows for the customer FIFO by created_at ASC
      (never by id): consume whole rows while remaining >= row.credit_cents;
      the final partially-consumed row is SPLIT — a VOID replacement row of the
      unconsumed remainder is created and the original becomes APPLIED.
      order.scrap_credit_applied_cents = applied;
      balance decremented exactly by applied (conservation: sum of APPLIED
      credit_cents + remainder VOID row == original POSTED total).
    input_set: "Customer's ScrapCredit rows in status POSTED, ordered created_at ASC"
    constants: {}
    precision: "integer cents"

  - name: quote_expiry_sweep
    trigger: "any API call when logical clock >= some SUBMITTED quote.expires_at"
    algorithm: chronological
    formula: |
      All Quote rows in SUBMITTED with expires_at <= logical clock transition
      SUBMITTED -> EXPIRED (lines -> SUPERSEDED), processed in expires_at ASC
      order, tie-break created_at ASC. The sweep runs lazily inside the request
      that observes it; AuditEvent QUOTE_EXPIRED per quote.
    input_set: "Quote status SUBMITTED with expires_at <= now"
    constants:
      QUOTE_VALIDITY_DAYS: 14
    precision: "ISO8601 instants, inclusive <= comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 2, category: existence, check: "Request body shape: required fields present, types match, no unknown fields (runs at same tier as authorization, before any FK dereference)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 3, category: existence, check: "Path ids exist (left-to-right); body FK references (grade_id, customer_id, sheet_stock_id, vendor_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource state permits the requested transition (per §1.2 preconditions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: inspection inspector_id must differ from the completing operator of the order's last completed routing step", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /fab/orders/{id}/inspection-reports" }
  - { priority: 6, category: business_safety, check: "First-piece flatness: report with flatness_pct > 0.0015 forces result FAIL and the rework loop — a PASS claim in payload cannot override computed FAIL", error_id: ERR_FLATNESS_EXCEEDED, http_status: 422, applies_to: "POST /fab/orders/{id}/inspection-reports (when payload claims pass but computed FAIL)" }
  - { priority: 7, category: business_constraint, check: "Line spec structural validity: bbox > 0, qty >= 1, hole/fillet/bend counts >= 0, finish enum member, thickness resolves to a grade tier", error_id: ERR_INVALID_LINE_SPEC, http_status: 422, applies_to: "POST /fab/quotes, POST /fab/quotes/{id}/lines, POST /fab/quotes/{id}/price" }
  - { priority: 8, category: business_constraint, check: "Finish/process compatibility: POWDER requires grade.powder_compatible; WELD routing requires grade.weld_compatible; PLATING/ANODIZING require an ACTIVE OutsideVendor of matching process", error_id: ERR_FINISH_NOT_COMPATIBLE, http_status: 422, applies_to: "POST /fab/quotes, POST /fab/quotes/{id}/lines, POST /fab/quotes/{id}/price" }
  - { priority: 9, category: business_temporal, check: "Quote acceptance only while logical clock < expires_at", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: "POST /fab/quotes/{id}/accept" }
  - { priority: 10, category: business_temporal, check: "Outside receive only after vendor lead time elapsed (logical clock >= step.due_date)", error_id: ERR_VENDOR_LEAD_TIME_NOT_ELAPSED, http_status: 409, applies_to: "POST /fab/orders/{id}/receive-outside" }
  - { priority: 11, category: business_temporal, check: "Machine window overlap: a step's [due_date - planned_minutes, due_date) occupation must not push the machine over UTILIZATION_CAP within the horizon (capacity_booking)", error_id: ERR_NO_MACHINE_CAPACITY, http_status: 409, applies_to: "POST /fab/quotes/{id}/accept, POST /fab/orders/{id}/renest, POST /fab/orders/{id}/resume" }
  - { priority: 12, category: business_referential, check: "Stock feasibility: nest can source all parts from AVAILABLE stock of matching grade/thickness", error_id: ERR_NEST_INFEASIBLE, http_status: 409, applies_to: "POST /fab/quotes/{id}/accept, POST /fab/orders/{id}/renest" }
  - { priority: 13, category: business_referential, check: "Scrap credit source sheet belongs to the customer (REMNANT.source_order's customer) or is walk-in stock; source not already CONSUMED/SCRAPPED", error_id: ERR_SCRAP_SOURCE_INVALID, http_status: 422, applies_to: "POST /fab/scrap-credits" }
  - { priority: 14, category: business_fiscal, check: "Customer credit: ACCEPTED-order quoted totals + this quote <= credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /fab/quotes/{id}/accept" }
  - { priority: 15, category: business_fiscal, check: "Scrap credit application: requested amount <= customer.scrap_credit_balance_cents", error_id: ERR_INSUFFICIENT_SCRAP_CREDIT, http_status: 402, applies_to: "POST /fab/orders/{id}/payment" }
  - { priority: 16, category: state, check: "OCC: expected_quote_version / expected_customer_version matches current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /fab/quotes/{id}/price, POST /fab/scrap-credits/{id}/void" }

# =============================================================================
# §1.5 API Endpoint Table (flat — no URL nesting)
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/fab/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z and NEVER falls back to wall-clock; expiry, vendor lead time, and SLA chains all read this clock."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["quote_expiry_sweep runs against the new clock"]

  # --- Customers ---
  - { method: POST, path: "/fab/customers", description: "Register a customer", roles: [ShopManager], code: 201, input: [company_name, email, credit_limit_cents], output: Customer, side_effects: ["scrap_credit_balance_cents = 0", "status = ACTIVE"] }
  - { method: GET, path: "/fab/customers", description: "List customers", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/fab/customers/{id}", description: "Get customer", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk, CustomerRep], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/fab/customers/{id}/suspend", description: "Suspend a customer", roles: [ShopManager], code: 200, input: [], output: Customer, side_effects: ["status -> SUSPENDED"] }

  # --- Material grades ---
  - { method: POST, path: "/fab/material-grades", description: "Define a material grade with gauge tiers", roles: [ShopManager], code: 201, input: [code, alloy_family, density_g_per_cm3, hardness_factor, base_cut_rate_cents_per_sec, material_cost_cents_per_cm2, scrap_rate_cents_per_cm2, thickness_tiers, weld_compatible, powder_compatible], output: MaterialGrade, side_effects: [] }
  - { method: GET, path: "/fab/material-grades", description: "List material grades", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk, MachineOperator, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "MaterialGrade[]", side_effects: [] }
  - { method: GET, path: "/fab/material-grades/{id}", description: "Get a material grade", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk, MachineOperator, CustomerRep], code: 200, input: [], output: MaterialGrade, side_effects: [] }

  # --- Sheet stock ---
  - { method: POST, path: "/fab/sheet-stock", description: "Receive a full sheet or register walk-in/drop-off stock", roles: [InventoryClerk], code: 201, input: [grade_id, thickness_mm, width_mm, height_mm], output: SheetStock, side_effects: ["kind = FULL_SHEET when 1200x2400 else REMNANT; status = AVAILABLE"] }
  - { method: GET, path: "/fab/sheet-stock", description: "List/filter sheet stock", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk], code: 200, input: ["limit?", "offset?", "grade_id?", "status?", "kind?", "source_order_id?"], output: "SheetStock[]", side_effects: [] }
  - { method: GET, path: "/fab/sheet-stock/{id}", description: "Get one stock row", roles: [ShopManager, Estimator, ProductionPlanner, InventoryClerk], code: 200, input: [], output: SheetStock, side_effects: [] }
  - { method: POST, path: "/fab/sheet-stock/{id}/scrap", description: "Scrap an AVAILABLE stock row", roles: [InventoryClerk], code: 200, input: [], output: SheetStock, side_effects: ["status -> SCRAPPED"] }

  # --- Machines ---
  - { method: POST, path: "/fab/machines", description: "Register a machine", roles: [ShopManager], code: 201, input: [name, station, shift_minutes_per_day], output: Machine, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/fab/machines", description: "List machines", roles: [ShopManager, Estimator, ProductionPlanner, MachineOperator], code: 200, input: ["limit?", "offset?", "station?", "status?"], output: "Machine[]", side_effects: [] }
  - { method: GET, path: "/fab/machines/{id}", description: "Get a machine", roles: [ShopManager, Estimator, ProductionPlanner, MachineOperator], code: 200, input: [], output: Machine, side_effects: [] }
  - { method: GET, path: "/fab/machines/{id}/routing-steps", description: "List routing steps assigned to a machine (work queue)", roles: [ShopManager, ProductionPlanner, MachineOperator], code: 200, input: ["limit?", "offset?", "status?"], output: "RoutingStep[]", side_effects: [] }
  - { method: POST, path: "/fab/machines/{id}/status", description: "Set machine ACTIVE/DOWN", roles: [ShopManager], code: 200, input: [status], output: Machine, side_effects: ["DOWN blocks new routing reservations"] }

  # --- Outside vendors ---
  - { method: POST, path: "/fab/outside-vendors", description: "Register an outside plating/anodizing vendor", roles: [ShopManager], code: 201, input: [name, process, lead_time_days, base_cost_cents_per_part], output: OutsideVendor, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/fab/outside-vendors", description: "List vendors", roles: [ShopManager, Estimator, ProductionPlanner], code: 200, input: ["limit?", "offset?", "process?", "status?"], output: "OutsideVendor[]", side_effects: [] }
  - { method: GET, path: "/fab/outside-vendors/{id}", description: "Get a vendor", roles: [ShopManager, Estimator, ProductionPlanner], code: 200, input: [], output: OutsideVendor, side_effects: [] }
  - { method: GET, path: "/fab/outside-vendors/{id}/routing-steps", description: "List routing steps assigned to an outside vendor", roles: [ShopManager, ProductionPlanner], code: 200, input: ["limit?", "offset?", "status?"], output: "RoutingStep[]", side_effects: [] }

  # --- Quotes & lines ---
  - { method: POST, path: "/fab/quotes", description: "Create a DRAFT quote (optionally with initial lines)", roles: [Estimator], code: 201, input: [customer_id, "expedite_tier?", "lines?"], output: Quote, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/fab/quotes", description: "List quotes", roles: [ShopManager, Estimator, ProductionPlanner, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "status?"], output: "Quote[]", side_effects: ["quote_expiry_sweep"] }
  - { method: GET, path: "/fab/quotes/{id}", description: "Get a quote", roles: [ShopManager, Estimator, ProductionPlanner, CustomerRep], code: 200, input: [], output: Quote, side_effects: ["quote_expiry_sweep"] }
  - { method: POST, path: "/fab/quotes/{id}/lines", description: "Add a line to a DRAFT quote", roles: [Estimator], code: 201, input: [grade_id, thickness_mm, bbox_width_mm, bbox_height_mm, "hole_count?", "hole_diameter_mm?", "corner_fillet_count?", "bend_count?", "weld_inches?", "finish?", qty], output: QuoteLine, side_effects: ["line status = ESTIMATED"] }
  - { method: GET, path: "/fab/quotes/{id}/lines", description: "List lines of a quote", roles: [ShopManager, Estimator, ProductionPlanner, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "QuoteLine[]", side_effects: [] }
  - { method: GET, path: "/fab/quote-lines/{id}", description: "Get one quote line", roles: [ShopManager, Estimator, ProductionPlanner, CustomerRep], code: 200, input: [], output: QuoteLine, side_effects: [] }
  - { method: GET, path: "/fab/quote-lines", description: "Filtered list of quote lines", roles: [ShopManager, Estimator, ProductionPlanner, CustomerRep], code: 200, input: ["limit?", "offset?", "quote_id?", "grade_id?", "status?"], output: "QuoteLine[]", side_effects: [] }
  - { method: POST, path: "/fab/quotes/{id}/price", description: "Price all lines (OCC-guarded)", roles: [Estimator], code: 200, input: [expected_quote_version], output: Quote, side_effects: ["quote_line_pricing QUOTED variant", "quote -> PRICED", "increments Quote.version by 1"] }
  - { method: POST, path: "/fab/quotes/{id}/submit", description: "Submit a PRICED quote", roles: [Estimator], code: 200, input: [], output: Quote, side_effects: ["status -> SUBMITTED; submitted_at/expires_at stamped"] }
  - { method: POST, path: "/fab/quotes/{id}/revise", description: "Return a SUBMITTED quote to DRAFT (revision loop)", roles: [Estimator], code: 200, input: [], output: Quote, side_effects: ["revision_count += 1; lines -> ESTIMATED"] }
  - { method: POST, path: "/fab/quotes/{id}/accept", description: "Accept a SUBMITTED quote; runs nesting, commit totals, routing, capacity", roles: [CustomerRep], code: 201, input: [], output: FabricationOrder, side_effects: ["quote -> ACCEPTED", "nest_and_yield", "order_commit_totals", "routing_generation", "capacity_booking"] }
  - { method: POST, path: "/fab/quotes/{id}/reject", description: "Reject a SUBMITTED quote", roles: [CustomerRep], code: 200, input: [], output: Quote, side_effects: ["status -> REJECTED; lines -> SUPERSEDED"] }

  # --- Orders ---
  - { method: GET, path: "/fab/orders", description: "List fabrication orders", roles: [ShopManager, Estimator, ProductionPlanner, MachineOperator, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "status?", "payment_status?", "quote_id?"], output: "FabricationOrder[]", side_effects: [] }
  - { method: GET, path: "/fab/orders/{id}", description: "Get an order", roles: [ShopManager, Estimator, ProductionPlanner, MachineOperator, CustomerRep], code: 200, input: [], output: FabricationOrder, side_effects: [] }
  - { method: POST, path: "/fab/orders/{id}/renest", description: "Re-run nesting while order is NESTING", roles: [ProductionPlanner], code: 200, input: [], output: FabricationOrder, side_effects: ["prior NestSheet rows replaced; stock released then re-consumed; order_commit_totals"] }
  - { method: POST, path: "/fab/orders/{id}/release", description: "Release a NESTED order to production", roles: [ProductionPlanner], code: 200, input: [], output: FabricationOrder, side_effects: ["status -> IN_PRODUCTION; first RoutingStep -> IN_PROGRESS"] }
  - { method: POST, path: "/fab/orders/{id}/receive-outside", description: "Receive parts back from outside vendor after lead time", roles: [ProductionPlanner], code: 200, input: [], output: FabricationOrder, side_effects: ["OUTSIDE_VENDOR step -> COMPLETED; advance"] }
  - { method: POST, path: "/fab/orders/{id}/hold", description: "Place an in-flight order ON_HOLD", roles: [ProductionPlanner], code: 200, input: [hold_reason], output: FabricationOrder, side_effects: ["status -> ON_HOLD"] }
  - { method: POST, path: "/fab/orders/{id}/resume", description: "Resume an ON_HOLD order to its pre-hold status", roles: [ProductionPlanner], code: 200, input: [], output: FabricationOrder, side_effects: ["capacity_booking revalidation"] }
  - { method: POST, path: "/fab/orders/{id}/cancel", description: "Cancel a NESTING/NESTED order and release its nest", roles: [ProductionPlanner], code: 200, input: [], output: FabricationOrder, side_effects: ["stock restored; remnants scrapped; reservations released"] }
  - { method: POST, path: "/fab/orders/{id}/inspection-reports", description: "Submit first-piece inspection (PASS completes, FAIL reworks)", roles: [QCInspector], code: 201, input: [flatness_deviation_mm, measured_diagonal_mm, dimensional_pass], output: InspectionReport, side_effects: ["flatness_check", "PASS -> order COMPLETED; FAIL -> rework loop"] }
  - { method: GET, path: "/fab/orders/{id}/inspection-reports", description: "List inspection reports for an order", roles: [ShopManager, ProductionPlanner, QCInspector], code: 200, input: ["limit?", "offset?"], output: "InspectionReport[]", side_effects: [] }
  - { method: POST, path: "/fab/orders/{id}/payment", description: "Pay a COMPLETED order, optionally drawing scrap credit", roles: [CustomerRep], code: 200, input: ["scrap_credit_to_apply_cents?"], output: FabricationOrder, side_effects: ["scrap_credit_application waterfall", "payment_status -> PAID"] }

  # --- Nest sheets & routing ---
  - { method: GET, path: "/fab/orders/{id}/nest-sheets", description: "List nest sheets of an order", roles: [ShopManager, Estimator, ProductionPlanner], code: 200, input: ["limit?", "offset?"], output: "NestSheet[]", side_effects: [] }
  - { method: GET, path: "/fab/nest-sheets", description: "Filtered list of nest sheets across orders", roles: [ShopManager, Estimator, ProductionPlanner], code: 200, input: ["limit?", "offset?", "order_id?", "sheet_stock_id?", "remnant_stock_id?"], output: "NestSheet[]", side_effects: [] }
  - { method: GET, path: "/fab/nest-sheets/{id}", description: "Get one nest sheet", roles: [ShopManager, Estimator, ProductionPlanner], code: 200, input: [], output: NestSheet, side_effects: [] }
  - { method: GET, path: "/fab/orders/{id}/routing-steps", description: "List routing steps of an order", roles: [ShopManager, ProductionPlanner, MachineOperator, QCInspector], code: 200, input: ["limit?", "offset?"], output: "RoutingStep[]", side_effects: [] }
  - { method: GET, path: "/fab/routing-steps", description: "Filtered list of routing steps", roles: [ShopManager, ProductionPlanner, MachineOperator], code: 200, input: ["limit?", "offset?", "order_id?", "machine_id?", "vendor_id?", "station?", "status?"], output: "RoutingStep[]", side_effects: [] }
  - { method: POST, path: "/fab/routing-steps/{id}/complete", description: "Complete an IN_PROGRESS step; advances routing and may move the order", roles: [MachineOperator], code: 200, input: [], output: RoutingStep, side_effects: ["routing_step_advance", "capacity release"] }
  - { method: POST, path: "/fab/routing-steps/{id}/skip", description: "Skip a non-LASER IN_PROGRESS step", roles: [ProductionPlanner], code: 200, input: [], output: RoutingStep, side_effects: ["routing_step_advance", "capacity release"] }

  # --- Scrap credits ---
  - { method: POST, path: "/fab/scrap-credits", description: "Post a scrap credit from a remnant surrender or drop-off", roles: [InventoryClerk], code: 201, input: [customer_id, sheet_stock_id], output: ScrapCredit, side_effects: ["scrap_credit_posting", "customer balance credited"] }
  - { method: GET, path: "/fab/scrap-credits", description: "List scrap credits", roles: [ShopManager, InventoryClerk, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "status?", "sheet_stock_id?"], output: "ScrapCredit[]", side_effects: [] }
  - { method: GET, path: "/fab/scrap-credits/{id}", description: "Get a scrap credit", roles: [ShopManager, InventoryClerk, CustomerRep], code: 200, input: [], output: ScrapCredit, side_effects: [] }
  - { method: POST, path: "/fab/scrap-credits/{id}/void", description: "Void a POSTED credit (OCC on customer version)", roles: [ShopManager], code: 200, input: [expected_customer_version], output: ScrapCredit, side_effects: ["balance debited back", "increments Customer.version by 1"] }

  # --- Audit ---
  - { method: GET, path: "/fab/audit-events", description: "List audit events", roles: [ShopManager], code: 200, input: ["limit?", "offset?", "entity_type?", "entity_id?", "event_type?"], output: "AuditEvent[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not a declared role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required input field missing, wrong type, or unknown field in request body" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure on a transition endpoint" }
  - { id: ERR_QUOTE_NOT_OPEN, http: 409, condition: "Price/revise/reject requires the specific source state (DRAFT or SUBMITTED)" }
  - { id: ERR_QUOTE_EMPTY, http: 409, condition: "Pricing a quote with zero lines" }
  - { id: ERR_QUOTE_NOT_PRICED, http: 409, condition: "Submit requires PRICED" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept at or after expires_at" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Submit/accept while customer SUSPENDED" }
  - { id: ERR_INVALID_LINE_SPEC, http: 422, condition: "Structural line validation failure (non-positive bbox, qty < 1, negative counts, unknown finish enum, unresolved thickness tier — ERR_THICKNESS_TIER_UNRESOLVED is the tier-specific form)" }
  - { id: ERR_THICKNESS_TIER_UNRESOLVED, http: 422, condition: "thickness_mm exceeds every tier's max_thickness_mm on the grade" }
  - { id: ERR_FINISH_NOT_COMPATIBLE, http: 422, condition: "POWDER on powder-incompatible grade, weld_inches > 0 on weld-incompatible grade, or no ACTIVE vendor for the requested outside process" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Acceptance would push customer's open quoted totals past credit_limit_cents" }
  - { id: ERR_NEST_INFEASIBLE, http: 409, condition: "No AVAILABLE stock can hold the largest part, or aggregate stock area insufficient at accept/renest" }
  - { id: ERR_NO_MACHINE_CAPACITY, http: 409, condition: "No ACTIVE machine of a required station can absorb the step within the 12-day horizon at the 0.90 utilization cap" }
  - { id: ERR_MACHINE_DOWN, http: 409, condition: "Release attempted while an assigned machine is DOWN" }
  - { id: ERR_ORDER_NOT_RELEASEABLE, http: 409, condition: "Release requires NESTED" }
  - { id: ERR_ORDER_NOT_AWAITING_OUTSIDE, http: 409, condition: "receive-outside requires AWAITING_OUTSIDE" }
  - { id: ERR_VENDOR_LEAD_TIME_NOT_ELAPSED, http: 409, condition: "receive-outside before vendor due_date on the logical clock" }
  - { id: ERR_ORDER_NOT_HOLDABLE, http: 409, condition: "hold requires IN_PRODUCTION, AWAITING_OUTSIDE, or FINISHING" }
  - { id: ERR_ORDER_NOT_ON_HOLD, http: 409, condition: "resume requires ON_HOLD" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires NESTING or NESTED" }
  - { id: ERR_ORDER_NOT_IN_INSPECTION, http: 409, condition: "inspection report requires order INSPECTION" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Inspector is the same user who completed the order's last routing step" }
  - { id: ERR_FLATNESS_EXCEEDED, http: 422, condition: "Report claims pass while computed flatness exceeds 0.15% (computed FAIL cannot be overridden)" }
  - { id: ERR_STEP_NOT_IN_PROGRESS, http: 409, condition: "complete/skip requires IN_PROGRESS" }
  - { id: ERR_STEP_NOT_SKIPPABLE, http: 409, condition: "skip on LASER step" }
  - { id: ERR_ALREADY_PAID, http: 409, condition: "payment on an order with payment_status PAID" }
  - { id: ERR_INSUFFICIENT_SCRAP_CREDIT, http: 402, condition: "Requested scrap credit application exceeds customer balance" }
  - { id: ERR_SCRAP_SOURCE_INVALID, http: 422, condition: "Scrap credit source sheet wrong kind/state or owned by another customer" }
  - { id: ERR_CREDIT_NOT_VOIDABLE, http: 409, condition: "Void requires credit status POSTED" }
  - { id: ERR_STOCK_NOT_AVAILABLE, http: 409, condition: "scrap endpoint requires stock AVAILABLE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch on guarded write" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Shop owner: master data (grades, machines, vendors), customer administration, credit voids, audit access, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /fab/customers, POST /fab/customers/{id}/suspend"
      - "POST /fab/material-grades"
      - "POST /fab/machines, POST /fab/machines/{id}/status"
      - "POST /fab/outside-vendors"
      - "POST /fab/scrap-credits/{id}/void"
      - "POST /fab/_clock/set_current_utc"
      - "GET /fab/audit-events"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: Estimator
    description: "Builds and prices quotes; owns the quote lifecycle up to submission"
    identity: opaque
    exclusive_operations:
      - "POST /fab/quotes, POST /fab/quotes/{id}/lines"
      - "POST /fab/quotes/{id}/price, /submit, /revise"
    shared_operations:
      - "GET quotes/orders/grades/stock/customers"
  - name: CustomerRep
    description: "Customer-facing representative: accepts/rejects quotes on the customer's behalf, records payments"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /fab/quotes/{id}/accept, /reject"
      - "POST /fab/orders/{id}/payment"
    shared_operations:
      - "GET quotes/orders/scrap-credits (own customer scope)"
  - name: ProductionPlanner
    description: "Runs the floor: renest, release, hold/resume, cancel, receive outside work, skip steps"
    identity: opaque
    exclusive_operations:
      - "POST /fab/orders/{id}/renest, /release, /hold, /resume, /cancel, /receive-outside"
      - "POST /fab/routing-steps/{id}/skip"
    shared_operations:
      - "GET orders/routing-steps/nest-sheets/machines/vendors"
  - name: MachineOperator
    description: "Completes assigned routing steps; identity recorded for segregation of duties"
    identity: opaque
    exclusive_operations:
      - "POST /fab/routing-steps/{id}/complete"
    shared_operations:
      - "GET routing-steps/orders/machines"
  - name: QCInspector
    description: "First-piece inspection; must not inspect own work (SoD against completing operator)"
    identity: opaque
    exclusive_operations:
      - "POST /fab/orders/{id}/inspection-reports"
    shared_operations:
      - "GET /fab/orders/{id}/inspection-reports, GET routing-steps"
  - name: InventoryClerk
    description: "Sheet stock receiving, scrapping, and scrap-credit posting"
    identity: opaque
    exclusive_operations:
      - "POST /fab/sheet-stock, POST /fab/sheet-stock/{id}/scrap"
      - "POST /fab/scrap-credits"
    shared_operations:
      - "GET sheet-stock/scrap-credits/material-grades"
