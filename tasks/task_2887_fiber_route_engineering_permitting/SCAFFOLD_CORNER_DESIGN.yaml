          assert:
            - "${subtotal} == 500000, from 16 * 31250 * 10000 / 10000 with the TELCO multiplier of exactly par"
            - "${bp} == 900, because the tier-1 test is subtotal < 500000 and 500000 is not below itself"
            - "${fee} == 45000 and ${cost} == 545000; the tier-1 rate would have produced 60000 and 560000"
            - "${days} == 47, from CLEARANCE_TRIM lead 15 plus 2 days per pole over pole_count 16"
            - "PoleAttachmentApplication.${paa_id}.status == MAKE_READY_ESTIMATED with committed == false, so Route.${route_id}.budget_committed_cents is still 0"

      - name: make_ready_days_are_capped_at_120_when_the_raw_schedule_reaches_130
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.make_ready_cost_and_schedule.constants.MAKE_READY_DAYS_CAP
          - calculations.make_ready_cost_and_schedule.constants.WORK_CLASS_LEAD_DAYS
          - complexity_profile.complexity_layers.rate_threshold_triggers
        distinguishing_aspect: "A pole replacement across 20 poles schedules 90 + 40 = 130 raw days, which the cap clips to exactly 120 while the cost side — 672750 subtotal at 900 basis points — is left uncapped."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' with budget_authorized_cents 250000000 and one walked RouteSegment (400 feet, URBAN_PAVED) carrying one grade-B ELECTRIC_UTILITY pole"
            - "one ELECTRIC_UTILITY PoleAttachmentApplication with pole_count 20, submitted and awaiting the owner's answer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-101", pole_owner: "ELECTRIC_UTILITY", condition_grade: "B", available_vertical_clearance_in: 42, existing_attachment_count: 3 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /pole-attachment-applications"
              payload: { segment_id: "${seg_id}", pole_owner: "ELECTRIC_UTILITY", pole_count: 20 }
              as: PermitCoordinator
              captures: { paa_id: $.data.id }
            - call: "POST /pole-attachment-applications/${paa_id}/submit"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /pole-attachment-applications/${paa_id}/owner-response"
              payload: { outcome: "ESTIMATED", make_ready_items: [{ pole_tag: "P-101", work_class: "POLE_REPLACEMENT", quantity: 1 }], owner_note: "one replacement, twenty poles handled" }
              as: PoleOwner
              as_user_id: "electric-1"
              captures: { subtotal: $.data.make_ready_items_subtotal_cents, bp: $.data.make_ready_admin_fee_bp, fee: $.data.make_ready_admin_fee_cents, cost: $.data.make_ready_cost_cents, days: $.data.make_ready_days }
          assert:
            - "${subtotal} == 672750, from 585000 * 11500 / 10000 for the single ELECTRIC_UTILITY line"
            - "${bp} == 900, ${fee} == 60548 (672750 * 900 / 10000 = 60547.5 rounded half up) and ${cost} == 733298"
            - "${days} == 120, the cap, not the raw 130"
            - "GET /pole-attachment-applications/${paa_id}/make-ready-items returns 1 row with lead_days 90, so the per-line lead time is stored uncapped"
            - "the cap clips only the schedule; no cost figure is reduced by it"

      - name: permit_denial_cascade_across_five_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / permit_denial_five_hop_cascade_voids_stamp_and_reopens_route
          rationale: "The named §1.8 instance walks the whole five-hop chain end to end and asserts every intermediate field, which is exactly this layer's claim."

      - name: preliminary_and_bid_ready_variants_both_produced
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / segment_cost_preliminary_versus_bid_ready_rounding_divergence
          rationale: "Both variants and the delta between them are pinned as literals by the named §1.8 instance."

  # ===========================================================================
  # 9 — consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: lock_scope_response_already_carries_the_recomputed_complexity_indexes
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /routes/{id}/lock-scope]
          - calculations.route_permitting_complexity_index
        distinguishing_aspect: "The write response itself, not a later read, contains planned_complexity_index 2500 and the seeded live_complexity_index — a follow-up GET returns byte-identical values, so nothing is recomputed lazily."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Mixed Authority Ring' (RING_CLOSURE) in PLANNING with two walked RouteSegments: 400 feet URBAN_PAVED and 600 feet RAIL_CROSSING"
            - "no PermitApplication exists yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Mixed Authority Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg1_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 2, street_name: "Rail Yard Cut", municipality_code: "MUN-014", length_feet: 600, terrain_class: "RAIL_CROSSING", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-30" }
              as: RouteEngineer
              captures: { seg2_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg1_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo1_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo1_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /walkouts"
              payload: { segment_id: "${seg2_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo2_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo2_id}", pole_tag: "P-201", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 1 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo2_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo2_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
          trigger:
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
              captures: { planned_in_write: $.data.planned_complexity_index, live_in_write: $.data.live_complexity_index, locked_in_write: $.data.scope_locked_at }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: PermitCoordinator
              captures: { planned_in_read: $.data.planned_complexity_index, live_in_read: $.data.live_complexity_index, locked_in_read: $.data.scope_locked_at }
          assert:
            - "${planned_in_write} == 2500, computed inside the write from AUTHORITY_WEIGHT 10 and 40 over segment_count 2"
            - "${planned_in_read} == ${planned_in_write}, ${live_in_read} == ${live_in_write} and ${locked_in_read} == ${locked_in_write} == 2026-08-10T00:00:00Z"
            - "the write response already reports status SCOPE_LOCKED; no second call is needed to observe the transition"
            - "RouteSegment.${seg1_id}.required_authority_type == MUNICIPAL_ROW and RouteSegment.${seg2_id}.required_authority_type == RAILROAD in the same read"

      - name: budget_ledger_is_visible_in_the_accept_make_ready_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.route_budget_ledger
          - endpoints[POST /pole-attachment-applications/{id}/accept-make-ready]
        distinguishing_aspect: "The grant's effect on a different entity is observable in the accepting response's own transaction: the route read straight afterwards shows budget_committed_cents 47600 with no settling delay."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' with budget_authorized_cents 1000000 and one walked RouteSegment (400 feet, URBAN_PAVED) carrying one grade-B TELCO pole"
            - "one TELCO PoleAttachmentApplication with pole_count 4 in MAKE_READY_ESTIMATED for 47600 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 1000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /pole-attachment-applications"
              payload: { segment_id: "${seg_id}", pole_owner: "TELCO", pole_count: 4 }
              as: PermitCoordinator
              captures: { paa_id: $.data.id }
            - call: "POST /pole-attachment-applications/${paa_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /pole-attachment-applications/${paa_id}/owner-response"
              payload: { outcome: "ESTIMATED", make_ready_items: [{ pole_tag: "P-001", work_class: "TRANSFER", quantity: 1 }], owner_note: "one transfer" }
              as: PoleOwner
              as_user_id: "telco-1"
              captures: { cost: $.data.make_ready_cost_cents }
          trigger:
            - call: "POST /pole-attachment-applications/${paa_id}/accept-make-ready"
              payload: {}
              as: PermitCoordinator
              captures: { st: $.data.status, committed_flag: $.data.committed }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: NetworkRecordsAdmin
              captures: { committed: $.data.budget_committed_cents, avail: $.data.budget_available_cents }
          assert:
            - "${cost} == 47600, from subtotal 42500 plus the 1200 basis point fee 5100"
            - "${st} == GRANTED and ${committed_flag} == true in the write response itself"
            - "${committed} == 47600 and ${avail} == 952400 on the very next read, with no intervening reconciliation call"
            - "budget_authorized_cents 1000000 == ${committed} + ${avail}"
            - "a second accept-make-ready on ${paa_id} would fail the state gate, so the ledger cannot be double-charged"
