# ---------------------------------------------------------------------------
# Conservation / consistency invariants. Each one is a named global quantity
# that a forward action plus its compensating action must leave unchanged, or
# a cross-entity identity that must hold after every mutation.
# ---------------------------------------------------------------------------
conservation_invariants:
  - id: entitlement-unit-conservation
    quantity: "included-visit entitlement units inside one BillingCycle"
    formula: "BillingCycle.entitlement_granted_units + BillingCycle.entitlement_carried_in_units - BillingCycle.entitlement_consumed_units - BillingCycle.entitlement_remaining_units == 0"
    compensating_pair: "POST /property-care/visits/{id}/complete (consumes 1 unit) paired with POST /property-care/visits/{id}/abort is impossible; the compensating action is POST /property-care/invoice-lines/{id}/void on the ENTITLEMENT_OFFSET line, which does NOT restore the unit. The identity above therefore holds at every instant regardless."
  - id: entitlement-rollover-conservation
    quantity: "entitlement units at BillingCycle close"
    formula: "at status == CLOSED: BillingCycle.entitlement_remaining_units == BillingCycle.entitlement_carried_out_units + BillingCycle.entitlement_expired_units"
    compensating_pair: "POST /property-care/billing-cycles/{id}/close followed by POST /property-care/subscriptions/{id}/billing-cycles: the next cycle's entitlement_carried_in_units equals the closed cycle's entitlement_carried_out_units exactly."
  - id: invoice-line-sum-conservation
    quantity: "Invoice gross service money"
    formula: "Invoice.subtotal_cents == (sum of InvoiceLine.amount_cents over lines with status == ACTIVE and line_type NOT IN {GUARANTEE_CREDIT}) + Invoice.storm_surcharge_cents + (sum of InvoiceLine.amount_cents over lines with status == ACTIVE and line_type == GUARANTEE_CREDIT)"
    compensating_pair: "POST /property-care/invoices/{id}/lines followed by POST /property-care/invoice-lines/{id}/void restores Invoice.subtotal_cents, Invoice.tax_cents and Invoice.total_cents to their pre-add values exactly."
  - id: key-copy-conservation
    quantity: "physical copies of one KeyAsset"
    formula: "KeyAsset.copies_total == KeyAsset.copies_on_hand + KeyAsset.copies_issued_outstanding + KeyAsset.copies_lost"
    compensating_pair: "POST /property-care/key-assets/{id}/issuances followed by POST /property-care/key-issuances/{id}/return returns copies_on_hand and copies_issued_outstanding to their pre-issuance values."
  - id: visit-billing-exclusivity
    quantity: "billing channel per completed Visit"
    formula: "for every Visit with status == COMPLETED: (Visit.entitlement_applied == true AND count of ACTIVE InvoiceLine with line_type == VISIT_OVERAGE and visit_id == Visit.id == 0) XOR (Visit.entitlement_applied == false AND count of ACTIVE InvoiceLine with line_type == VISIT_OVERAGE and visit_id == Visit.id == 1)"
    compensating_pair: "A completed Visit is never both entitlement-consuming and overage-billed, and never neither."
  - id: storm-guarantee-conservation
    quantity: "guarantee credit money issued for one StormEvent"
    formula: "sum over StormResponse of StormResponse.guarantee_credit_cents == sum over ACTIVE InvoiceLine with line_type == GUARANTEE_CREDIT of (-1 * InvoiceLine.amount_cents), taken over the invoices whose billing_cycle_id belongs to the responded properties"
    compensating_pair: "A StormResponse that reaches SECURED_LATE issues 0 and appends no GUARANTEE_CREDIT line; the owner's Invoice.total_cents is therefore exactly the no-guarantee total."
  - id: work-order-cost-conservation
    quantity: "WorkOrder money"
    formula: "WorkOrder.total_cents == WorkOrder.labour_cost_cents + WorkOrder.parts_cost_cents + WorkOrder.markup_cents + WorkOrder.storm_surcharge_cents"
    compensating_pair: "POST /property-care/work-orders/{id}/invoice creates exactly one ACTIVE InvoiceLine with line_type == WORK_ORDER whose amount_cents equals WorkOrder.total_cents; voiding it and re-invoicing reproduces the same amount."
  - id: access-grant-count-conservation
    quantity: "active access grants on one KeyAsset"
    formula: "KeyAsset.active_grant_count == count of AccessGrant with key_asset_id == KeyAsset.id and status == ACTIVE"
    compensating_pair: "POST /property-care/key-assets/{id}/rotate-code invalidates every grant whose rotation_index_at_grant < KeyAsset.code_rotation_count and re-derives active_grant_count in the same request."
  - id: turnover-absorption-neutrality
    quantity: "owner money for an absorbed watch visit"
    formula: "after POST /property-care/visits/{id}/convert-to-turnover: Visit.entitlement_applied == false AND BillingCycle.entitlement_consumed_units unchanged AND exactly one ACTIVE InvoiceLine with line_type == VISIT_OVERAGE and amount_cents == round_half_up(VISIT_BASE_FEE_SCHEDULED_CENTS * TURNOVER_ABSORPTION_CREDIT_PCT)"
    compensating_pair: "Deferring instead of converting leaves both the entitlement counter and the invoice untouched."
  - id: false-alarm-ledger-conservation
    quantity: "municipal false-alarm fee money for one Property"
    formula: "sum over ACTIVE InvoiceLine with line_type == FALSE_ALARM_FEE and property-scoped invoices of amount_cents == sum over SecurityIncident with status == FALSE_ALARM and reported_at within FALSE_ALARM_WINDOW_DAYS of SecurityIncident.false_alarm_fee_cents"
    compensating_pair: "Reclassifying an incident back out of FALSE_ALARM is not a declared transition; the ledger is therefore append-only and the identity holds after every reclassification."
  - id: proration-day-conservation
    quantity: "billable days inside one 30-day cycle"
    formula: "for a tier change: used_days + remaining_days == PRORATION_DAY_BASIS, and BillingCycle.prorated_fee_cents == round_half_up(old_fee * used_days / 30) + round_half_up(new_fee * remaining_days / 30)"
    compensating_pair: "A tier change followed by a tier change back on the same day reproduces the original plan's entitlement grant, but NOT necessarily the original prorated_fee_cents (each leg rounds independently)."

concurrency_rules:
  - rule_id: workorder-create-stale-finding
    parent_entity: Finding
    write_endpoint: "POST /property-care/findings/{id}/work-orders"
    occ_field: "expected_finding_version"
    description: |
      Creating a WorkOrder against a Finding whose version has advanced since
      the client last observed it is rejected. A newly created WorkOrder
      legitimately supersedes any prior DRAFT WorkOrder on the same Finding
      (the prior draft is voided as a side effect), so a writer holding a
      stale view of the Finding would silently discard work it never saw.
    error_id: ERR_STALE_FINDING_VERSION
    http_status: 412
  - rule_id: tier-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /property-care/subscriptions/{id}/tier-changes"
    occ_field: "expected_subscription_version"
    description: |
      Scheduling a plan tier change against a Subscription whose version has
      advanced since the client last observed it is rejected. A tier change
      legitimately supersedes any pending tier change and re-derives the open
      BillingCycle's entitlement grant, so a stale writer would overwrite an
      entitlement re-derivation it never observed.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
  - rule_id: access-grant-stale-key-asset
    parent_entity: KeyAsset
    write_endpoint: "POST /property-care/key-assets/{id}/access-grants"
    occ_field: "expected_key_asset_version"
    description: |
      Creating an AccessGrant against a KeyAsset whose version has advanced
      since the client last observed it is rejected. Grant creation on a
      LOCKBOX KeyAsset rotates the code and invalidates every grant stamped
      with an earlier rotation index, so a stale writer would hand out a code
      snapshot that the rotation has already retired.
    error_id: ERR_STALE_KEY_ASSET_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the homeowner client."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all Owner rows."
        constraints: "unique; must contain '@'"
      - name: phone
        type: string
        source: input
        description: "Contact phone number."
      - name: primary_residence_state
        type: string
        source: input
        description: "Two-letter state code of the owner's primary (non-vacation) residence."
        constraints: "exactly 2 uppercase letters"
      - name: snowbird_flag
        type: boolean
        source: input
        description: "True when the owner declares seasonal migration; enables AwayPeriod cadence scheduling."
        default: false
      - name: notification_preference
        type: enum
        source: input
        description: "Channel used for incident notification."
        default: "EMAIL"
        constraints: "one of EMAIL, SMS, BOTH"
      - name: approval_ceiling_override_cents
        type: integer
        source: input
        description: "Owner-specific work-order approval ceiling. When null, WO_OWNER_APPROVAL_CEILING_CENTS (50000) applies."
        default: null
        constraints: ">= 0 when present"
      - name: lifetime_credit_balance_cents
        type: integer
        source: computed
        description: "Sum of the absolute value of amount_cents over every ACTIVE InvoiceLine with line_type == GUARANTEE_CREDIT on invoices whose owner_id equals this Owner.id."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Owner account status."
        default: "ACTIVE"
        constraints: "one of ACTIVE, INACTIVE"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the homeowner who owns this vacation home."
      - name: label
        type: string
        source: input
        description: "Human label for the property, e.g. 'Naples Beach House'."
      - name: address_line
        type: string
        source: input
        description: "Street address of the property."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code where the property sits; matched against StormEvent.region_state_code."
        constraints: "exactly 2 uppercase letters"
      - name: travel_distance_miles
        type: number
        source: input
        description: "Road distance in miles from the concierge depot to the property; drives travel_zone."
        constraints: ">= 0"
      - name: travel_zone
        type: enum
        source: computed
        description: "Zone band derived from travel_distance_miles by calculation travel_zone_assignment."
        constraints: "one of Z1, Z2, Z3, OUT_OF_AREA"
      - name: seasonal_state
        type: enum
        source: system
        description: "Seasonal lifecycle axis. Evolves independently of occupancy_state."
        default: "OPEN"
        constraints: "one of OPEN, CLOSING, WINTERIZED, OPENING"
      - name: occupancy_state
        type: enum
        source: system
        description: "Occupancy axis. Evolves independently of seasonal_state."
        default: "VACANT"
        constraints: "one of VACANT, OWNER_IN_RESIDENCE, RENTAL_OCCUPIED, CONTRACTOR_ONSITE"
      - name: freeze_setpoint_f
        type: number
        source: input
        description: "Minimum interior temperature in Fahrenheit the property must hold; defaults to FREEZE_SETPOINT_DEFAULT_F (55)."
        default: 55
        constraints: ">= 40 and <= 80"
      - name: last_interior_temp_f
        type: number
        source: system
        description: "Most recent interior temperature reading, stamped from Visit.interior_temp_f at visit completion."
        default: null
      - name: last_temp_reading_at
        type: datetime
        source: system
        description: "Logical-clock instant of the reading that produced last_interior_temp_f."
        default: null
      - name: freeze_risk_score
        type: number
        source: computed
        description: "Weighted freeze-risk score produced by calculation freeze_risk_score; one decimal place."
        default: 0.0
      - name: risk_posture
        type: enum
        source: computed
        description: "Banded from freeze_risk_score by calculation property_risk_posture."
        default: "NORMAL"
        constraints: "one of NORMAL, ELEVATED, CRITICAL"
      - name: winterization_completeness_pct
        type: number
        source: computed
        description: "completeness_pct of the WinterizationRecord for this property with the greatest created_at; when two records share created_at the one with the greater completed_step_count wins; 0.0 when the property has no WinterizationRecord."
        default: 0.0
      - name: false_alarm_count_window
        type: integer
        source: computed
        description: "Count of SecurityIncident rows for this property with status == FALSE_ALARM and reported_at within FALSE_ALARM_WINDOW_DAYS (365) of the logical clock."
        default: 0
      - name: open_critical_finding_count
        type: integer
        source: computed
        description: "Count of Finding rows for this property with severity == CRITICAL and status IN {OPEN, TRIAGED, WORK_ORDERED, MONITORING}."
        default: 0
      - name: storm_hold_flag
        type: boolean
        source: system
        description: "True while at least one StormResponse for this property has status IN {SECURE_SWEEP_SCHEDULED, SECURED, SECURED_LATE, MISSED_DEADLINE, AWAITING_ALL_CLEAR, ASSESSMENT_DUE}."
        default: false
      - name: rental_program_enrolled
        type: boolean
        source: input
        description: "True when the property participates in short-term rental turnovers."
        default: false

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Plan tier label."
        constraints: "one of BASIC, STANDARD, PREMIUM"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly fee in cents. Reference values: BASIC 9986, STANDARD 19986, PREMIUM 34944."
        constraints: "> 0"
      - name: included_visit_units
        type: integer
        source: input
        description: "Entitlement units granted at each BillingCycle open. Reference values: BASIC 2, STANDARD 4, PREMIUM 8."
        constraints: ">= 0"
      - name: entitlement_rollover_policy
        type: enum
        source: input
        description: "Discriminator for calculation entitlement_rollover."
        default: "EXPIRE"
        constraints: "one of EXPIRE, CARRY_CAPPED"
      - name: storm_guarantee_included
        type: boolean
        source: input
        description: "True when the plan carries the storm-readiness guarantee that can earn a GUARANTEE_CREDIT line."
        default: false
      - name: covered_visit_types
        type: array
        source: input
        description: "Visit types whose completion may consume an entitlement unit under this plan; each member must also appear in ENTITLEMENT_CONSUMING_VISIT_TYPES."
        constraints: "non-empty; subset of ROUTINE_WATCH, SEASONAL_CLOSE, SEASONAL_OPEN"
      - name: status
        type: enum
        source: input
        description: "Catalogue status of the plan."
        default: "ACTIVE"
        constraints: "one of ACTIVE, RETIRED"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this subscription covers."
      - name: service_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan currently in force."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle state."
        default: "PENDING_ACTIVATION"
        constraints: "one of PENDING_ACTIVATION, ACTIVE, PAUSED, DELINQUENT, CANCELLED"
      - name: started_on
        type: datetime
        source: input
        description: "Instant the subscription term begins; the first BillingCycle's period_start."
      - name: current_cycle_id
        type: string
        source: system
        description: "Non-owning pointer to the id of the BillingCycle whose subscription_id equals this row and whose status == OPEN; null when no cycle is open."
        default: null
      - name: paused_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent pause; null when never paused."
        default: null
      - name: resumed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent resume; null when never resumed."
        default: null
      - name: cumulative_paused_days
        type: integer
        source: computed
        description: "Whole days accumulated across every completed pause interval, floor of seconds divided by 86400 per interval, summed."
        default: 0
      - name: pending_tier_change_plan_id
        type: string
        source: system
        description: "Non-owning pointer to the ServicePlan.id scheduled to take effect at the next BillingCycle open; null when none is pending."
        default: null
      - name: delinquent_since
        type: datetime
        source: system
        description: "Logical-clock instant the subscription was marked DELINQUENT."
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation."
        default: null

  - name: BillingCycle
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this cycle bills."
      - name: cycle_index
        type: integer
        source: system
        description: "One-based ordinal of this cycle within the subscription, assigned in ascending period_start order."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the billing period."
      - name: period_end
        type: datetime
        source: computed
        description: "Exclusive end of the billing period, period_start plus CYCLE_LENGTH_DAYS (30) days."
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle state."
        default: "OPEN"
        constraints: "one of OPEN, CLOSING, CLOSED"
      - name: entitlement_granted_units
        type: integer
        source: computed
        description: "Fresh grant at cycle open, equal to the in-force ServicePlan.included_visit_units."
        default: 0
      - name: entitlement_carried_in_units
        type: integer
        source: computed
        description: "Units carried in from the immediately preceding closed cycle of the same subscription."
        default: 0
      - name: entitlement_consumed_units
        type: integer
        source: computed
        description: "Units consumed by Visit completions bound to this cycle."
        default: 0
      - name: entitlement_remaining_units
        type: integer
        source: computed
        description: "entitlement_granted_units + entitlement_carried_in_units - entitlement_consumed_units."
        default: 0
      - name: entitlement_expired_units
        type: integer
        source: computed
        description: "Units destroyed at close by calculation entitlement_rollover; 0 while status != CLOSED."
        default: 0
      - name: entitlement_carried_out_units
        type: integer
        source: computed
        description: "Units surviving close by calculation entitlement_rollover; 0 while status != CLOSED."
        default: 0
      - name: prorated_fee_cents
        type: integer
        source: computed
        description: "Subscription fee actually chargeable for this cycle after pause and tier-change proration."
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of close."
        default: null

  - name: AwayPeriod
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property left unattended."
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the declaring owner, which must equal Property.owner_id."
      - name: start_at
        type: datetime
        source: input
        description: "Inclusive start of the declared absence."
      - name: end_at
        type: datetime
        source: input
        description: "Exclusive end of the declared absence."
      - name: cadence_days
        type: integer
        source: input
        description: "Requested days between routine watch visits."
        constraints: ">= CADENCE_MIN_DAYS (3) and <= CADENCE_MAX_DAYS (30)"
      - name: projected_visit_count
        type: integer
        source: computed
        description: "Forward-looking count produced by calculation cadence_projection."
        default: 0
      - name: scheduled_visit_count
        type: integer
        source: computed
        description: "Count of Visit rows with away_period_id equal to this row and status IN {SCHEDULED, EN_ROUTE, IN_PROGRESS, COMPLETED}."
        default: 0
      - name: derived_status
        type: enum
        source: computed
        description: "PLANNED when clock < start_at, IN_EFFECT when start_at <= clock < end_at, ENDED when clock >= end_at."
        constraints: "one of PLANNED, IN_EFFECT, ENDED"
      - name: cadence_revision_count
        type: integer
        source: system
        description: "Number of times cadence_days has been revised after creation."
        default: 0

  - name: ChecklistTemplate
    parent: null
    common_fields: true
    fields:
      - name: visit_type
        type: enum
        source: input
        description: "Visit type this template drives."
        constraints: "one of ROUTINE_WATCH, SEASONAL_CLOSE, SEASONAL_OPEN, TURNOVER_INSPECT, STORM_SECURE, STORM_ASSESS, ALARM_RESPONSE"
      - name: version_label
        type: string
        source: input
        description: "Author-supplied revision label, e.g. '2026.1'."
      - name: item_codes
        type: array
        source: input
        description: "Ordered list of checklist item code strings."
        constraints: "non-empty; members unique"
      - name: critical_item_codes
        type: array
        source: input
        description: "Subset of item_codes whose failure auto-creates a CRITICAL Finding."
        constraints: "subset of item_codes"
      - name: default_finding_category
        type: enum
        source: input
        description: "Finding.category stamped on every Finding auto-created from a failed critical item of this template."
        default: "OTHER"
        constraints: "one of PLUMBING, HVAC, ELECTRICAL, STRUCTURAL, SECURITY, PEST, LANDSCAPE, OTHER"
      - name: required_item_count
        type: integer
        source: computed
        description: "Length of item_codes."
      - name: status
        type: enum
        source: input
        description: "Catalogue status."
        default: "ACTIVE"
        constraints: "one of ACTIVE, RETIRED"

  - name: Visit
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property visited."
      - name: checklist_template_id
        type: string
        source: input
        description: "FK -> ChecklistTemplate.id; template whose visit_type must equal Visit.visit_type."
      - name: away_period_id
        type: string
        source: input
        description: "FK -> AwayPeriod.id; the cadence window that produced this visit, null for ad-hoc visits."
        default: null
      - name: storm_response_id
        type: string
        source: input
        description: "FK -> StormResponse.id; set only for Pipeline S visits, null otherwise."
        default: null
      - name: rental_turnover_id
        type: string
        source: input
        description: "FK -> RentalTurnover.id; set when the visit is bound to a turnover, null otherwise."
        default: null
      - name: billing_cycle_id
        type: string
        source: system
        description: "FK -> BillingCycle.id; the OPEN cycle stamped at completion, null while not completed."
        default: null
      - name: visit_type
        type: enum
        source: input
        description: "Kind of visit performed."
        constraints: "one of ROUTINE_WATCH, SEASONAL_CLOSE, SEASONAL_OPEN, TURNOVER_INSPECT, STORM_SECURE, STORM_ASSESS, ALARM_RESPONSE"
      - name: trigger_source
        type: enum
        source: input
        description: "What caused the visit; discriminator for calculation visit_base_fee."
        constraints: "one of SCHEDULED, OWNER_REQUESTED, ALARM_TRIGGERED, STORM"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Planned start instant, inclusive."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Planned end instant, exclusive; must be strictly after scheduled_start_at."
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, EN_ROUTE, IN_PROGRESS, COMPLETED, DEFERRED, CONVERTED, ABORTED"
      - name: departed_at
        type: datetime
        source: system
        description: "Logical-clock instant the tech departed."
        default: null
      - name: arrived_at
        type: datetime
        source: system
        description: "Logical-clock instant the tech arrived; drives after_hours_flag."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion."
        default: null
      - name: tech_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FieldTech who departed on this visit."
        default: null
      - name: completed_item_codes
        type: array
        source: input
        description: "Checklist item codes marked pass at completion; every member must appear in the bound template's item_codes."
        default: []
      - name: failed_item_codes
        type: array
        source: input
        description: "Checklist item codes marked fail at completion; every member must appear in the bound template's item_codes and must not also appear in completed_item_codes."
        default: []
      - name: checklist_completion_pct
        type: number
        source: computed
        description: "100 * (len(completed_item_codes) + len(failed_item_codes)) / ChecklistTemplate.required_item_count, one decimal place."
        default: 0.0
      - name: interior_temp_f
        type: number
        source: input
        description: "Interior temperature reading taken at completion; null when the visit type does not read temperature."
        default: null
      - name: entitlement_applied
        type: boolean
        source: computed
        description: "True when this completion consumed one BillingCycle entitlement unit."
        default: false
      - name: billable_amount_cents
        type: integer
        source: computed
        description: "Amount produced by calculation visit_billable_amount at completion or conversion."
        default: 0
      - name: after_hours_flag
        type: boolean
        source: computed
        description: "True when the UTC hour of arrived_at is >= AFTER_HOURS_START_HOUR_UTC (22) or < AFTER_HOURS_END_HOUR_UTC (6)."
        default: false
      - name: deferral_count
        type: integer
        source: system
        description: "Number of times this visit has been deferred."
        default: 0
      - name: defer_reason
        type: enum
        source: input
        description: "Reason recorded on the most recent deferral."
        default: null
        constraints: "one of TURNOVER_OVERLAP, OWNER_IN_RESIDENCE, WEATHER, ACCESS_BLOCKED, SUBSCRIPTION_PAUSED"

  - name: Finding
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the visit that surfaced the issue. Null on Findings synthesized by POST /property-care/key-issuances/{id}/declare-lost when the property has no COMPLETED Visit yet."
        default: null
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the visit at creation."
      - name: item_code
        type: string
        source: input
        description: "Checklist item code the finding relates to; must appear in the visit's template item_codes."
      - name: severity
        type: enum
        source: input
        description: "Assessed severity."
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: category
        type: enum
        source: input
        description: "Trade category; mapped to a Vendor.trade by FINDING_CATEGORY_TRADE_MAP."
        constraints: "one of PLUMBING, HVAC, ELECTRICAL, STRUCTURAL, SECURITY, PEST, LANDSCAPE, OTHER"
      - name: status
        type: enum
        source: system
        description: "Finding lifecycle state."
        default: "OPEN"
        constraints: "one of OPEN, TRIAGED, WORK_ORDERED, MONITORING, DISMISSED"
      - name: escalation_score
        type: number
        source: computed
        description: "Weighted score produced by calculation finding_escalation_score."
        default: 0.0
      - name: triaged_at
        type: datetime
        source: system
        description: "Logical-clock instant of triage."
        default: null
      - name: dismissed_at
        type: datetime
        source: system
        description: "Logical-clock instant of dismissal."
        default: null
      - name: monitor_recheck_count
        type: integer
        source: system
        description: "Number of times this finding has cycled MONITORING -> TRIAGED."
        default: 0
      - name: description
        type: string
        source: input
        description: "Free-text description of the issue."

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered business name."
      - name: trade
        type: enum
        source: input
        description: "Primary trade."
        constraints: "one of PLUMBING, HVAC, ELECTRICAL, GENERAL, SECURITY, LOCKSMITH, LANDSCAPE"
      - name: coi_expires_at
        type: datetime
        source: input
        description: "Certificate-of-insurance expiry instant."
      - name: license_expires_at
        type: datetime
        source: input
        description: "Trade licence expiry instant."
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Labour rate in cents per hour."
        constraints: "> 0"
      - name: rating
        type: number
        source: input
        description: "Quality rating on a 0 to 5 scale; primary ranking key for vendor selection."
        constraints: ">= 0 and <= 5"
      - name: billing_mode
        type: enum
        source: input
        description: "Discriminator for calculation vendor_markup."
        default: "MANAGED"
        constraints: "one of MANAGED, PASS_THROUGH"
      - name: status
        type: enum
        source: system
        description: "Vendor eligibility state."
        default: "ONBOARDING"
        constraints: "one of ONBOARDING, ELIGIBLE, SUSPENDED, LAPSED"
      - name: emergency_capable
        type: boolean
        source: input
        description: "True when the vendor may be selected for Pipeline S emergency dispatch."
        default: false
      - name: outstanding_key_count
        type: integer
        source: computed
        description: "Count of KeyIssuance rows for this vendor with status IN {ISSUED, OVERDUE}."
        default: 0
      - name: last_eligibility_evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the last eligibility re-derivation."
        default: null

  - name: WorkOrder
    parent: Finding
    common_fields: true
    fields:
      - name: finding_id
        type: string
        source: input
        description: "FK -> Finding.id; the finding this work order remediates."
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the finding at creation."
      - name: storm_event_id
        type: string
        source: input
        description: "FK -> StormEvent.id; set for Pipeline S work orders, null for Pipeline R."
        default: null
      - name: key_asset_id
        type: string
        source: input
        description: "FK -> KeyAsset.id; set only on work_type == REKEY work orders."
        default: null
      - name: work_type
        type: enum
        source: input
        description: "Kind of remediation."
        constraints: "one of REPAIR, REKEY, WINTERIZE_FIX, STORM_MITIGATION, CLEANING"
      - name: pipeline
        type: enum
        source: computed
        description: "STORM when storm_event_id is non-null, otherwise ROUTINE. The single discriminator that selects the approval ceiling, the surcharge branch and the key-custody prerequisite."
        constraints: "one of ROUTINE, STORM"
      - name: estimated_labour_hours
        type: number
        source: input
        description: "Estimated labour hours."
        constraints: ">= 0"
      - name: estimated_parts_cents
        type: integer
        source: input
        description: "Estimated parts cost in cents."
        constraints: ">= 0"
      - name: labour_cost_cents
        type: integer
        source: computed
        description: "Produced by calculation labour_cost."
        default: 0
      - name: parts_cost_cents
        type: integer
        source: computed
        description: "actual_parts_cents when status is COMPLETED or later, otherwise estimated_parts_cents."
        default: 0
      - name: markup_cents
        type: integer
        source: computed
        description: "Produced by calculation vendor_markup."
        default: 0
      - name: surcharge_pct_applied
        type: number
        source: computed
        description: "Storm surcharge percentage frozen at dispatch, copied from StormResponse.surcharge_pct_at_dispatch of the response whose storm_event_id and property_id match this work order; 0.0 when pipeline == ROUTINE."
        default: 0.0
      - name: storm_surcharge_cents
        type: integer
        source: computed
        description: "Produced by calculation work_order_storm_surcharge; always 0 when pipeline == ROUTINE."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Produced by calculation work_order_total."
        default: 0
      - name: approval_ceiling_cents
        type: integer
        source: computed
        description: "Produced by calculation approval_ceiling."
        default: 0
      - name: approval_required
        type: boolean
        source: computed
        description: "True when total_cents is strictly greater than approval_ceiling_cents."
        default: false
      - name: status
        type: enum
        source: system
        description: "Work-order lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, DISPATCHED, IN_PROGRESS, COMPLETED, INVOICED, VOID"
      - name: dispatch_attempt_count
        type: integer
        source: system
        description: "Number of vendor offers made; capped at WO_MAX_DISPATCH_ATTEMPTS (3)."
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approver, or the literal 'system' when auto-approved under the storm ceiling."
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creator."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason captured on rejection."
        default: null
      - name: actual_labour_hours
        type: number
        source: input
        description: "Actual labour hours captured at completion."
        default: null
      - name: actual_parts_cents
        type: integer
        source: input
        description: "Actual parts cost captured at completion."
        default: null

  - name: VendorAssignment
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the dispatched work order."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the offered vendor."
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the on-site window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the on-site window."
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state."
        default: "OFFERED"
        constraints: "one of OFFERED, ACCEPTED, DECLINED, WORKING, FINISHED, WITHDRAWN"
      - name: offered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the offer."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of acceptance."
        default: null
      - name: finished_at
        type: datetime
        source: system
        description: "Logical-clock instant work finished."
        default: null
      - name: decline_reason
        type: string
        source: input
        description: "Reason captured on decline."
        default: null
      - name: coi_valid_at_offer
        type: boolean
        source: system
        description: "Snapshot of whether Vendor.coi_expires_at was strictly after the logical clock at offer time; a later COI lapse does not retro-invalidate completed work."
        default: true
      - name: access_blocked_flag
        type: boolean
        source: system
        description: "True when no KeyIssuance could be created for this assignment because the property has no eligible KeyAsset."
        default: false

  - name: KeyAsset
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this key opens."
      - name: key_type
        type: enum
        source: input
        description: "PHYSICAL keys are handed over; LOCKBOX keys are code-based and rotate."
        constraints: "one of PHYSICAL, LOCKBOX"
      - name: label
        type: string
        source: input
        description: "Human label, e.g. 'Front door lockbox'."
      - name: copies_total
        type: integer
        source: input
        description: "Total copies the concierge holds; also the aggregate concurrency capacity for ACTIVE AccessGrant windows."
        constraints: ">= 1"
      - name: copies_on_hand
        type: integer
        source: computed
        description: "copies_total - copies_issued_outstanding - copies_lost."
      - name: copies_issued_outstanding
        type: integer
        source: computed
        description: "Sum of KeyIssuance.copies_issued over issuances with status IN {ISSUED, OVERDUE}."
        default: 0
      - name: copies_lost
        type: integer
        source: computed
        description: "Sum of KeyIssuance.copies_issued over issuances with status IN {LOST, REKEY_ORDERED}."
        default: 0
      - name: current_code
        type: string
        source: system
        description: "Current lockbox code; null for PHYSICAL keys. Rewritten on every rotation. When a rotation supplies no explicit new_code (the cascaded rotation inside access-grant creation), the next code is the integer value of the previous code plus 1 rendered as a four-character zero-padded decimal string; when the previous code is null or non-numeric the next code is the literal '0001'."
        default: null
      - name: code_rotation_count
        type: integer
        source: system
        description: "Monotonic rotation index, starting at 0 and incremented on every rotation."
        default: 0
      - name: active_grant_count
        type: integer
        source: computed
        description: "Count of AccessGrant rows for this key with status == ACTIVE."
        default: 0
      - name: rekey_pending_flag
        type: boolean
        source: system
        description: "True while a work_type == REKEY WorkOrder for this key exists with status NOT IN {COMPLETED, INVOICED, REJECTED, VOID}."
        default: false

  - name: KeyIssuance
    parent: KeyAsset
    common_fields: true
    fields:
      - name: key_asset_id
        type: string
        source: input
        description: "FK -> KeyAsset.id; the key handed out."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the holder."
      - name: vendor_assignment_id
        type: string
        source: input
        description: "FK -> VendorAssignment.id; the assignment that justified the issuance, null for standing issuances."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issuance."
      - name: return_deadline_at
        type: datetime
        source: computed
        description: "Produced by calculation key_return_deadline."
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of return."
        default: null
      - name: status
        type: enum
        source: system
        description: "Custody state."
        default: "ISSUED"
        constraints: "one of ISSUED, RETURNED, OVERDUE, RETURNED_LATE, LOST, REKEY_ORDERED"
      - name: overdue_days
        type: integer
        source: computed
        description: "Produced by calculation key_overdue_days; 0 while not past deadline."
        default: 0
      - name: copies_issued
        type: integer
        source: input
        description: "Number of physical copies handed over."
        default: 1
        constraints: ">= 1"

  - name: AccessGrant
    parent: KeyAsset
    common_fields: true
    fields:
      - name: key_asset_id
        type: string
        source: input
        description: "FK -> KeyAsset.id; the key the grant unlocks."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the grantee."
      - name: key_issuance_id
        type: string
        source: input
        description: "FK -> KeyIssuance.id; the issuance this grant accompanies, null for code-only grants."
        default: null
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the access window."
      - name: window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the access window."
      - name: code_snapshot
        type: string
        source: system
        description: "KeyAsset.current_code as of grant creation, after any rotation this creation performed."
        default: null
      - name: status
        type: enum
        source: system
        description: "Grant state."
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, EXPIRED, REVOKED, INVALIDATED"
      - name: invalidated_reason
        type: enum
        source: system
        description: "Why the grant was invalidated."
        default: null
        constraints: "one of CODE_ROTATION, KEY_LOST, ASSIGNMENT_WITHDRAWN"
      - name: rotation_index_at_grant
        type: integer
        source: system
        description: "KeyAsset.code_rotation_count as of grant creation, after any rotation this creation performed. A later rotation invalidates exactly the grants whose rotation_index_at_grant is strictly less than the new code_rotation_count."
        default: 0

  - name: WinterizationRecord
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being winterized."
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the SEASONAL_CLOSE visit that performed the steps, null when recorded off-visit."
        default: null
      - name: water_shutoff_done
        type: boolean
        source: system
        description: "WATER_SHUTOFF step recorded."
        default: false
      - name: lines_drained_done
        type: boolean
        source: system
        description: "LINES_DRAINED step recorded."
        default: false
      - name: thermostat_set_f
        type: number
        source: system
        description: "Thermostat setpoint recorded by the THERMOSTAT_SET step; the step counts as done only when this value is >= WINTERIZATION_MIN_THERMOSTAT_F (50)."
        default: null
      - name: valve_tagged_done
        type: boolean
        source: system
        description: "VALVE_TAGGED step recorded."
        default: false
      - name: antifreeze_added_done
        type: boolean
        source: system
        description: "Optional ANTIFREEZE_ADDED step recorded; does not count toward completeness."
        default: false
      - name: completed_step_count
        type: integer
        source: computed
        description: "Count of the four required steps recorded as done."
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: "100 * completed_step_count / WINTERIZATION_REQUIRED_STEP_COUNT (4), one decimal place."
        default: 0.0
      - name: status
        type: enum
        source: system
        description: "Winterization record state."
        default: "NOT_STARTED"
        constraints: "one of NOT_STARTED, PARTIAL, COMPLETE, REOPENED"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the fourth required step landed."
        default: null
      - name: reopen_reason
        type: enum
        source: input
        description: "Why the record was reopened."
        default: null
        constraints: "one of FREEZE_ALARM, SPRING_OPEN, RENTAL_TURNOVER, INSPECTION_FAIL"

  - name: RentalTurnover
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the rental property."
      - name: checkout_at
        type: datetime
        source: input
        description: "Guest checkout instant; start of the turnover window before buffer padding."
      - name: checkin_at
        type: datetime
        source: input
        description: "Next guest check-in instant; end of the turnover window before buffer padding."
      - name: clean_started_at
        type: datetime
        source: system
        description: "Logical-clock instant cleaning began."
        default: null
      - name: inspect_started_at
        type: datetime
        source: system
        description: "Logical-clock instant inspection began."
        default: null
      - name: ready_at
        type: datetime
        source: system
        description: "Logical-clock instant the unit was declared ready."
        default: null
      - name: status
        type: enum
        source: system
        description: "Turnover stage."
        default: "BOOKED"
        constraints: "one of BOOKED, CHECKOUT, CLEANING, INSPECTION, READY, CHECKIN, CANCELLED"
      - name: reclean_attempt_count
        type: integer
        source: system
        description: "Number of INSPECTION -> CLEANING loops; capped at TURNOVER_MAX_RECLEAN_ATTEMPTS (2)."
        default: 0
      - name: absorbed_visit_id
        type: string
        source: system
        description: "Non-owning pointer to the id of the Visit converted into this turnover's inspection; null when none."
        default: null
      - name: guest_reference
        type: string
        source: input
        description: "Booking reference of the outgoing guest."

  - name: MailHold
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose mail is held."
      - name: start_on
        type: datetime
        source: input
        description: "Inclusive start of the hold."
      - name: end_on
        type: datetime
        source: input
        description: "Exclusive end of the hold."
      - name: hold_days
        type: integer
        source: computed
        description: "Whole days between start_on and end_on, floor of seconds divided by 86400."
        default: 0
      - name: extension_count
        type: integer
        source: system
        description: "Number of MAIL_HOLD_EXTENSION_DAYS (15) extensions applied; capped at MAIL_HOLD_MAX_EXTENSIONS (2)."
        default: 0
      - name: package_count
        type: integer
        source: system
        description: "Packages currently accumulated and not yet collected."
        default: 0
      - name: overflow_events
        type: integer
        source: system
        description: "Number of times package_count reached PACKAGE_OVERFLOW_THRESHOLD_COUNT (6)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Mail hold state."
        default: "REQUESTED"
        constraints: "one of REQUESTED, ACTIVE, OVERFLOW, RELEASED, FORWARDED"
      - name: forwarding_address
        type: string
        source: input
        description: "Destination address used by the FORWARD disposition."
        default: null
      - name: disposition_fee_cents
        type: integer
        source: computed
        description: "Produced by calculation mail_disposition_fee."
        default: 0

  - name: SecurityIncident
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the affected property."
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the visit that detected the incident, null for externally reported alarms."
        default: null
      - name: incident_type
        type: enum
        source: input
        description: "Kind of incident."
        constraints: "one of ALARM_INTRUSION, ALARM_SMOKE, FREEZE_ALARM, WATER_LEAK, VANDALISM, UNAUTHORIZED_ACCESS"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant the incident was reported."
      - name: severity
        type: enum
        source: input
        description: "Assessed severity."
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: status
        type: enum
        source: system
        description: "Incident lifecycle state."
        default: "REPORTED"
        constraints: "one of REPORTED, ACKNOWLEDGED, INVESTIGATING, ESCALATED, RESOLVED, FALSE_ALARM"
      - name: escalation_count
        type: integer
        source: system
        description: "Number of INVESTIGATING -> ESCALATED loops."
        default: 0
      - name: false_alarm_sequence
        type: integer
        source: computed
        description: "One-based occurrence index of this incident among the property's FALSE_ALARM incidents inside FALSE_ALARM_WINDOW_DAYS (365), ordered by reported_at ASC with created_at ASC as tie-break; null while status != FALSE_ALARM."
        default: null
      - name: false_alarm_fee_cents
        type: integer
        source: computed
        description: "Produced by calculation false_alarm_fee; 0 while status != FALSE_ALARM."
        default: 0
      - name: triggered_visit_id
        type: string
        source: system
        description: "Non-owning pointer to the id of the ALARM_RESPONSE Visit this incident forced, null when none."
        default: null
      - name: resolution_note
        type: string
        source: input
        description: "Free text captured at resolution or reclassification."
        default: null

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Named storm, e.g. 'Hurricane Delta'."
      - name: region_state_code
        type: string
        source: input
        description: "Two-letter state code of the affected region; only properties whose state_code matches may receive a StormResponse."
        constraints: "exactly 2 uppercase letters"
      - name: landfall_eta_at
        type: datetime
        source: input
        description: "Forecast landfall instant; the anchor for every pre-storm deadline."
      - name: status
        type: enum
        source: system
        description: "Advisory / lifecycle state. WARNING may be downgraded back to WATCH."
        default: "FORECAST"
        constraints: "one of FORECAST, WATCH, WARNING, IMMINENT, LANDFALL, ALL_CLEAR, CLOSED"
      - name: derived_tier
        type: enum
        source: computed
        description: "Advisory tier implied by the logical clock and landfall_eta_at per calculation storm_advisory_tier; may disagree with status when an operator has downgraded."
        constraints: "one of FORECAST, WATCH, WARNING, IMMINENT"
      - name: landfall_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant landfall was recorded."
        default: null
      - name: all_clear_at
        type: datetime
        source: system
        description: "Logical-clock instant all-clear was declared; the anchor for every post-storm deadline."
        default: null
      - name: downgrade_count
        type: integer
        source: system
        description: "Number of WARNING -> WATCH downgrades."
        default: 0
      - name: response_count
        type: integer
        source: computed
        description: "Count of StormResponse rows with storm_event_id equal to this row."
        default: 0

  - name: StormResponse
    parent: StormEvent
    common_fields: true
    fields:
      - name: storm_event_id
        type: string
        source: input
        description: "FK -> StormEvent.id; the storm being responded to."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the responding property."
      - name: subscription_id
        type: string
        source: system
        description: "FK -> Subscription.id; the property's subscription with status IN {ACTIVE, PAUSED, DELINQUENT} at response creation, null when none."
        default: null
      - name: secure_sweep_deadline_at
        type: datetime
        source: computed
        description: "Produced by calculation response_deadline, PRE_STORM variant."
      - name: secure_sweep_visit_id
        type: string
        source: system
        description: "Non-owning pointer to the id of the STORM_SECURE Visit scheduled for this response, null before scheduling."
        default: null
      - name: secured_at
        type: datetime
        source: system
        description: "Logical-clock instant the secure sweep completed."
        default: null
      - name: sweep_on_time
        type: boolean
        source: computed
        description: "True when secured_at <= secure_sweep_deadline_at, inclusive at the boundary; null-equivalent false before the sweep completes."
        default: false
      - name: guarantee_credit_cents
        type: integer
        source: computed
        description: "Produced by calculation guarantee_credit_amount."
        default: 0
      - name: assessment_deadline_at
        type: datetime
        source: computed
        description: "Produced by calculation response_deadline, POST_STORM variant; null until the storm reaches ALL_CLEAR."
        default: null
      - name: assessed_at
        type: datetime
        source: system
        description: "Logical-clock instant the damage assessment was signed off."
        default: null
      - name: swept_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldTech who completed the secure sweep."
        default: null
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldTech who signed off the assessment; must differ from swept_by_user_id."
        default: null
      - name: damage_level
        type: enum
        source: input
        description: "Assessed damage level."
        default: null
        constraints: "one of NONE, MINOR, MODERATE, SEVERE"
      - name: surcharge_pct_at_dispatch
        type: number
        source: system
        description: "Storm surcharge percentage frozen from calculation storm_surcharge_pct at the instant the first Pipeline S work order for this response was dispatched."
        default: 0.0
      - name: status
        type: enum
        source: system
        description: "Storm response state."
        default: "PENDING"
        constraints: "one of PENDING, SECURE_SWEEP_SCHEDULED, SECURED, SECURED_LATE, MISSED_DEADLINE, AWAITING_ALL_CLEAR, ASSESSMENT_DUE, ASSESSED, CLOSED"

  - name: Invoice
    parent: BillingCycle
    common_fields: true
    fields:
      - name: billing_cycle_id
        type: string
        source: input
        description: "FK -> BillingCycle.id; the cycle being invoiced."
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the cycle's subscription."
      - name: owner_id
        type: string
        source: system
        description: "FK -> Owner.id; copied from the property."
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, ISSUED, PARTIALLY_PAID, PAID, DISPUTED, VOID"
      - name: storm_surcharge_pct
        type: number
        source: computed
        description: "Maximum WorkOrder.surcharge_pct_applied over the ACTIVE lines of this invoice with line_type == WORK_ORDER whose work order has pipeline == STORM; 0.0 when that set is empty."
        default: 0.0
      - name: gross_service_cents
        type: integer
        source: computed
        description: "Step 1 of calculation invoice_total."
        default: 0
      - name: entitlement_offset_cents
        type: integer
        source: computed
        description: "Step 2 of calculation invoice_total; zero or negative."
        default: 0
      - name: storm_surcharge_cents
        type: integer
        source: computed
        description: "Step 4 of calculation invoice_total."
        default: 0
      - name: guarantee_credit_cents
        type: integer
        source: computed
        description: "Step 5 of calculation invoice_total; zero or negative."
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Step 6 of calculation invoice_total."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Step 7 of calculation invoice_total, per-line rounding then sum."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Step 8 of calculation invoice_total."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Step 9 of calculation invoice_total."
        default: 0
      - name: amount_paid_cents
        type: integer
        source: system
        description: "Cumulative payments recorded against this invoice."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_cents - amount_paid_cents."
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issue; anchor for delinquency arithmetic."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant balance_due_cents first reached 0."
        default: null
      - name: dispute_count
        type: integer
        source: system
        description: "Number of ISSUED -> DISPUTED loops."
        default: 0

  - name: InvoiceLine
    parent: Invoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the parent invoice."
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the visit this line bills, null for non-visit lines."
        default: null
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this line bills, null otherwise."
        default: null
      - name: security_incident_id
        type: string
        source: input
        description: "FK -> SecurityIncident.id; the incident this line bills, null otherwise."
        default: null
      - name: mail_hold_id
        type: string
        source: input
        description: "FK -> MailHold.id; the mail hold this line bills, null otherwise."
        default: null
      - name: line_type
        type: enum
        source: input
        description: "Category that decides which step of calculation invoice_total consumes this line."
        constraints: "one of SUBSCRIPTION_FEE, VISIT_OVERAGE, TRAVEL_SURCHARGE, WORK_ORDER, FALSE_ALARM_FEE, MAIL_DISPOSITION, REKEY_FEE, ENTITLEMENT_OFFSET, GUARANTEE_CREDIT"
      - name: description
        type: string
        source: input
        description: "Human-readable line description."
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in cents; ENTITLEMENT_OFFSET and GUARANTEE_CREDIT lines are negative, every other line_type is non-negative."
      - name: taxable
        type: boolean
        source: input
        description: "True when the line participates in the per-line tax sum."
        default: true
      - name: tax_cents
        type: integer
        source: computed
        description: "round_half_up(amount_cents * TAX_RATE_PCT) when taxable is true and status == ACTIVE, otherwise 0."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Line state; VOID lines are excluded from every invoice aggregate."
        default: "ACTIVE"
        constraints: "one of ACTIVE, VOID"
      - name: sequence_index
        type: integer
        source: system
        description: "One-based append order within the invoice, assigned in ascending created_at order; pins the per-line rounding sequence."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# 17 machines. Non-linear machines (cycle, parallel axis, capped retry loop,
# bidirectional pair, branching fork): Property.seasonal, Property.occupancy,
# Subscription, Visit, Finding, WorkOrder, WinterizationRecord, RentalTurnover,
# MailHold, SecurityIncident, StormEvent, Invoice, Vendor = 13 non-linear.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Property
    axis: seasonal_state
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    note: "Runs as a closed cycle OPEN -> CLOSING -> WINTERIZED -> OPENING -> OPEN and evolves independently of the occupancy axis on the same row."
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /property-care/properties/{id}/seasonal-transitions with action == BEGIN_CLOSE"
        actor: Dispatcher
        preconditions:
          - "Property.occupancy_state == VACANT"
          - "no RentalTurnover for this property has status IN {CHECKOUT, CLEANING, INSPECTION, READY}"
        side_effects:
          - "creates a WinterizationRecord for this property with status NOT_STARTED"
          - "increments Property.version by 1"
      - from: CLOSING
        to: OPEN
        trigger: "POST /property-care/properties/{id}/seasonal-transitions with action == ABORT_CLOSE"
        actor: Dispatcher
        preconditions:
          - "the newest WinterizationRecord for this property has status IN {NOT_STARTED, PARTIAL}"
        side_effects:
          - "the newest WinterizationRecord transitions to REOPENED with reopen_reason SPRING_OPEN"
          - "Property.winterization_completeness_pct is re-derived"
          - "increments Property.version by 1"
      - from: CLOSING
        to: WINTERIZED
        trigger: "POST /property-care/properties/{id}/seasonal-transitions with action == COMPLETE_WINTERIZATION"
        actor: Dispatcher
        preconditions:
          - "the newest WinterizationRecord for this property has status == COMPLETE"
          - "Property.occupancy_state == VACANT"
        side_effects:
          - "Property.winterization_completeness_pct set to 100.0"
          - "Property.freeze_risk_score and Property.risk_posture re-derived"
          - "increments Property.version by 1"
      - from: WINTERIZED
        to: OPENING
        trigger: "POST /property-care/properties/{id}/seasonal-transitions with action == BEGIN_OPEN"
        actor: Dispatcher
        preconditions:
          - "no KeyIssuance on any KeyAsset of this property has status IN {OVERDUE, LOST}"
        side_effects:
          - "the newest WinterizationRecord transitions COMPLETE -> REOPENED with reopen_reason SPRING_OPEN"
          - "Property.winterization_completeness_pct re-derived from the reopened record"
          - "Property.freeze_risk_score and Property.risk_posture re-derived"
          - "increments Property.version by 1"
      - from: OPENING
        to: OPEN
        trigger: "POST /property-care/properties/{id}/seasonal-transitions with action == COMPLETE_OPEN"
        actor: Dispatcher
        preconditions:
          - "at least one Visit with visit_type == SEASONAL_OPEN and status == COMPLETED exists for this property with completed_at >= the newest WinterizationRecord.created_at"
        side_effects:
          - "increments Property.version by 1"

  - entity: Property
    axis: occupancy_state
    shape: parallel
    initial_state: VACANT
    terminal_states: []
    note: "Star-shaped bidirectional axis: every occupied state is entered from and returns to VACANT. Independent of seasonal_state; certain visit types are legal only in specific COMBINATIONS of the two axes."
    transitions:
      - from: VACANT
        to: OWNER_IN_RESIDENCE
        trigger: "POST /property-care/properties/{id}/occupancy-transitions with to_state == OWNER_IN_RESIDENCE"
        actor: Owner
        preconditions:
          - "Property.seasonal_state IN {OPEN, OPENING}"
        side_effects:
          - "every Visit for this property with status == SCHEDULED and visit_type == ROUTINE_WATCH transitions to DEFERRED with defer_reason OWNER_IN_RESIDENCE"
          - "increments Property.version by 1"
      - from: OWNER_IN_RESIDENCE
        to: VACANT
        trigger: "POST /property-care/properties/{id}/occupancy-transitions with to_state == VACANT"
        actor: Owner
        preconditions: []
        side_effects:
          - "Property.freeze_risk_score and Property.risk_posture re-derived (vacancy weight now applies)"
          - "increments Property.version by 1"
      - from: VACANT
        to: RENTAL_OCCUPIED
        trigger: "POST /property-care/properties/{id}/occupancy-transitions with to_state == RENTAL_OCCUPIED"
        actor: Dispatcher
        preconditions:
          - "Property.rental_program_enrolled == true"
          - "Property.seasonal_state == OPEN"
        side_effects:
          - "increments Property.version by 1"
      - from: RENTAL_OCCUPIED
        to: VACANT
        trigger: "POST /property-care/properties/{id}/occupancy-transitions with to_state == VACANT"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Property.freeze_risk_score and Property.risk_posture re-derived"
          - "increments Property.version by 1"
      - from: VACANT
        to: CONTRACTOR_ONSITE
        trigger: "POST /property-care/vendor-assignments/{id}/start-work"
        actor: Vendor
        preconditions:
          - "the assignment's work order has property_id equal to this property"
        side_effects:
          - "increments Property.version by 1"
      - from: CONTRACTOR_ONSITE
        to: VACANT
        trigger: "POST /property-care/vendor-assignments/{id}/finish-work"
        actor: Vendor
        preconditions:
          - "no other VendorAssignment for this property has status == WORKING"
        side_effects:
          - "Property.freeze_risk_score and Property.risk_posture re-derived"
          - "increments Property.version by 1"

  - entity: Subscription
    shape: cyclic
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    note: "Two independent loops: ACTIVE <-> PAUSED and ACTIVE <-> DELINQUENT."
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /property-care/subscriptions/{id}/activate"
        actor: AccountManager
        preconditions:
          - "ServicePlan.status == ACTIVE"
          - "Property.travel_zone != OUT_OF_AREA"
        side_effects:
          - "creates the first BillingCycle with cycle_index 1, period_start == Subscription.started_on, status OPEN"
          - "sets Subscription.current_cycle_id to the new cycle id"
          - "BillingCycle.entitlement_granted_units set to ServicePlan.included_visit_units; entitlement_carried_in_units 0; entitlement_remaining_units equal to the grant"
          - "BillingCycle.prorated_fee_cents set to ServicePlan.monthly_fee_cents"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /property-care/subscriptions/{id}/pause"
        actor: AccountManager
        preconditions:
          - "Subscription.current_cycle_id is non-null and that cycle has status == OPEN"
        side_effects:
          - "sets Subscription.paused_at to the logical clock"
          - "recomputes the open BillingCycle.prorated_fee_cents by calculation proration_amount, MID_CYCLE_PAUSE variant"
          - "if a DRAFT Invoice exists on that cycle, rewrites its ACTIVE SUBSCRIPTION_FEE line amount_cents to the new prorated_fee_cents"
          - "recomputes that Invoice's gross_service_cents, subtotal_cents, tax_cents and total_cents"
          - "every Visit for the property with status == SCHEDULED and scheduled_start_at inside [paused_at, cycle.period_end) transitions to DEFERRED with defer_reason SUBSCRIPTION_PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /property-care/subscriptions/{id}/resume"
        actor: AccountManager
        preconditions:
          - "Subscription.paused_at is non-null"
        side_effects:
          - "sets Subscription.resumed_at to the logical clock and adds the whole days of the closed pause interval to cumulative_paused_days"
          - "recomputes the open BillingCycle.prorated_fee_cents by calculation proration_amount, MID_CYCLE_PAUSE variant"
          - "does NOT un-defer the visits deferred by the pause; they must be rescheduled explicitly"
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /property-care/subscriptions/{id}/mark-delinquent"
        actor: AccountManager
        preconditions:
          - "at least one Invoice for this subscription's cycles has status == ISSUED, balance_due_cents > 0, and issued_at + DELINQUENCY_THRESHOLD_DAYS (21) days <= the logical clock"
        side_effects:
          - "sets Subscription.delinquent_since to the logical clock"
          - "adds late_fee_cents to every qualifying ISSUED Invoice by calculation late_fee and recomputes each Invoice.total_cents and balance_due_cents"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /property-care/subscriptions/{id}/clear-delinquency"
        actor: AccountManager
        preconditions:
          - "no Invoice for this subscription's cycles has status == ISSUED with balance_due_cents > 0"
        side_effects:
          - "clears Subscription.delinquent_since to null"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /property-care/subscriptions/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "no Visit for the property has status IN {EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "sets Subscription.cancelled_at to the logical clock"
          - "the open BillingCycle transitions OPEN -> CLOSING -> CLOSED in the same request, running calculation entitlement_rollover with carried_out forced to 0"
          - "clears Subscription.current_cycle_id to null"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /property-care/subscriptions/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "no Visit for the property has status IN {EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "sets Subscription.cancelled_at to the logical clock"
          - "the open BillingCycle transitions to CLOSED with entitlement_carried_out_units forced to 0"
      - from: DELINQUENT
        to: CANCELLED
        trigger: "POST /property-care/subscriptions/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "no Visit for the property has status IN {EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "sets Subscription.cancelled_at to the logical clock"
          - "the open BillingCycle transitions to CLOSED with entitlement_carried_out_units forced to 0"

  - entity: BillingCycle
    shape: linear
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /property-care/billing-cycles/{id}/close"
        actor: AccountManager
        preconditions:
          - "no Visit bound to this cycle has status IN {EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "freezes entitlement_consumed_units and entitlement_remaining_units"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /property-care/billing-cycles/{id}/close (same request; CLOSING is transient within the call)"
        actor: AccountManager
        preconditions:
          - "every Invoice on this cycle has status IN {ISSUED, PAID, PARTIALLY_PAID, VOID, DRAFT}"
        side_effects:
          - "runs calculation entitlement_rollover, writing entitlement_carried_out_units and entitlement_expired_units"
          - "sets closed_at to the logical clock"
          - "clears Subscription.current_cycle_id when it pointed at this cycle"

  - entity: Visit
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CONVERTED, ABORTED]
    note: "Branching with a re-entrant SCHEDULED -> DEFERRED -> SCHEDULED loop; CONVERTED and ABORTED are divergent exits with different billing side-effect sets."
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /property-care/visits/{id}/depart"
        actor: FieldTech
        preconditions:
          - "Property.seasonal_state permits Visit.visit_type per validation rungs 31 to 37"
          - "Property.occupancy_state permits Visit.visit_type per validation rungs 38 to 42"
        side_effects:
          - "sets departed_at and tech_user_id from the request headers"
      - from: EN_ROUTE
        to: IN_PROGRESS
        trigger: "POST /property-care/visits/{id}/arrive"
        actor: FieldTech
        preconditions:
          - "Visit.departed_at is non-null"
        side_effects:
          - "sets arrived_at to the logical clock"
          - "sets after_hours_flag by calculation after_hours_flag"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /property-care/visits/{id}/complete"
        actor: FieldTech
        preconditions:
          - "every code in completed_item_codes and failed_item_codes appears in the bound ChecklistTemplate.item_codes"
          - "len(completed_item_codes) + len(failed_item_codes) == ChecklistTemplate.required_item_count"
        side_effects:
          - "sets completed_at, checklist_completion_pct and billing_cycle_id (the property's subscription's OPEN cycle, null when none)"
          - "runs calculation entitlement_consumption, setting entitlement_applied and, when true, incrementing BillingCycle.entitlement_consumed_units and decrementing entitlement_remaining_units"
          - "runs calculation visit_billable_amount, writing billable_amount_cents"
          - "when interior_temp_f is non-null, stamps Property.last_interior_temp_f and Property.last_temp_reading_at, then re-derives Property.freeze_risk_score and Property.risk_posture"
          - "CASCADE HOP 2: for every code in failed_item_codes that is also in ChecklistTemplate.critical_item_codes, creates a Finding with severity CRITICAL, status OPEN, category equal to ChecklistTemplate.default_finding_category, description equal to the literal 'Auto-created from failed critical checklist item <item_code>', processed in the order the codes appear in ChecklistTemplate.item_codes"
          - "when a temperature breach is detected by calculation temp_breach_detection, creates a SecurityIncident with incident_type FREEZE_ALARM, severity HIGH, status REPORTED"
          - "when visit_type == STORM_SECURE, sets the bound StormResponse.secured_at and swept_by_user_id, runs calculation sweep_timeliness and transitions the response to SECURED or SECURED_LATE"
          - "when visit_type == SEASONAL_CLOSE and a WinterizationRecord for the property has status IN {NOT_STARTED, PARTIAL, REOPENED}, binds that record's visit_id to this visit"
      - from: SCHEDULED
        to: DEFERRED
        trigger: "POST /property-care/visits/{id}/defer"
        actor: Dispatcher
        preconditions:
          - "defer_reason is supplied and is a declared enum member"
        side_effects:
          - "increments deferral_count by 1 and records defer_reason"
          - "billable_amount_cents remains 0 and no entitlement unit is consumed"
      - from: DEFERRED
        to: SCHEDULED
        trigger: "POST /property-care/visits/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "the new scheduled window does not overlap any RentalTurnover padded window per calculation turnover_overlap_detection"
        side_effects:
          - "rewrites scheduled_start_at and scheduled_end_at; clears defer_reason to null"
      - from: SCHEDULED
        to: CONVERTED
        trigger: "POST /property-care/visits/{id}/convert-to-turnover"
        actor: Dispatcher
        preconditions:
          - "the target RentalTurnover has status IN {CLEANING, INSPECTION}"
          - "the visit's scheduled window overlaps the turnover's padded window per calculation turnover_overlap_detection"
        side_effects:
          - "sets rental_turnover_id and sets RentalTurnover.absorbed_visit_id to this visit"
          - "sets entitlement_applied false and billable_amount_cents to round_half_up(VISIT_BASE_FEE_SCHEDULED_CENTS * TURNOVER_ABSORPTION_CREDIT_PCT)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /property-care/visits/{id}/abort"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "billable_amount_cents remains 0; no entitlement unit is consumed"
      - from: EN_ROUTE
        to: ABORTED
        trigger: "POST /property-care/visits/{id}/abort"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "billable_amount_cents remains 0; no entitlement unit is consumed"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /property-care/visits/{id}/abort"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "billable_amount_cents remains 0; no entitlement unit is consumed"

  - entity: Finding
    shape: branching
    initial_state: OPEN
    terminal_states: [DISMISSED]
    note: "Fork at TRIAGED into WORK_ORDERED / MONITORING / DISMISSED, with a re-entrant MONITORING -> TRIAGED loop."
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /property-care/findings/{id}/triage"
        actor: Dispatcher
        preconditions:
          - "the parent Visit has status == COMPLETED"
        side_effects:
          - "sets triaged_at and runs calculation finding_escalation_score"
      - from: TRIAGED
        to: WORK_ORDERED
        trigger: "POST /property-care/findings/{id}/work-orders"
        actor: Dispatcher
        preconditions:
          - "expected_finding_version equals Finding.version"
        side_effects:
          - "CASCADE HOP 3: creates a WorkOrder in DRAFT and immediately submits it to PENDING_APPROVAL"
          - "any prior WorkOrder on this finding with status == DRAFT transitions to VOID"
          - "increments Finding.version by 1"
      - from: TRIAGED
        to: MONITORING
        trigger: "POST /property-care/findings/{id}/monitor"
        actor: Dispatcher
        preconditions:
          - "Finding.severity IN {LOW, MEDIUM}"
        side_effects:
          - "no work order is created"
      - from: MONITORING
        to: TRIAGED
        trigger: "POST /property-care/findings/{id}/triage"
        actor: Dispatcher
        preconditions:
          - "a later Visit for the same property with status == COMPLETED exists whose completed_at > Finding.triaged_at"
        side_effects:
          - "increments monitor_recheck_count by 1 and re-runs calculation finding_escalation_score"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /property-care/findings/{id}/dismiss"
        actor: Dispatcher
        preconditions:
          - "no WorkOrder on this finding has status NOT IN {REJECTED, VOID}"
        side_effects:
          - "sets dismissed_at and re-derives Property.open_critical_finding_count"
      - from: MONITORING
        to: DISMISSED
        trigger: "POST /property-care/findings/{id}/dismiss"
        actor: Dispatcher
        preconditions:
          - "no WorkOrder on this finding has status NOT IN {REJECTED, VOID}"
        side_effects:
          - "sets dismissed_at and re-derives Property.open_critical_finding_count"

  - entity: WorkOrder
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [INVOICED, VOID]
    note: "Two capped loops: PENDING_APPROVAL -> REJECTED -> DRAFT re-submission, and DISPATCHED -> APPROVED re-dispatch capped at WO_MAX_DISPATCH_ATTEMPTS (3)."
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /property-care/work-orders/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "the parent Finding has status == WORK_ORDERED"
        side_effects:
          - "runs calculations labour_cost, vendor_markup, work_order_storm_surcharge, work_order_total, approval_ceiling"
          - "when approval_required is false, the work order continues to APPROVED inside the same request with approved_by_user_id set to the literal 'system'"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /property-care/work-orders/{id}/approve"
        actor: Owner
        preconditions:
          - "the acting Owner's X-User-ID equals Property.owner_id"
          - "WorkOrder.pipeline == ROUTINE"
        side_effects:
          - "sets approved_by_user_id to X-User-ID"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /property-care/work-orders/{id}/approve"
        actor: StormCoordinator
        preconditions:
          - "WorkOrder.pipeline == STORM"
          - "WorkOrder.total_cents <= STORM_EMERGENCY_APPROVAL_CEILING_CENTS (250000)"
        side_effects:
          - "sets approved_by_user_id to X-User-ID; the Owner rung is not consulted at all on the storm pipeline"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /property-care/work-orders/{id}/reject"
        actor: Owner
        preconditions:
          - "rejection_reason is supplied"
        side_effects:
          - "the parent Finding transitions WORK_ORDERED -> TRIAGED"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /property-care/work-orders/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "estimated_labour_hours or estimated_parts_cents differs from the rejected values"
        side_effects:
          - "clears rejection_reason and re-runs the cost calculations"
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /property-care/work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "dispatch_attempt_count < WO_MAX_DISPATCH_ATTEMPTS (3)"
          - "the vendor selector by calculation vendor_selection returns a non-empty candidate set"
        side_effects:
          - "increments dispatch_attempt_count by 1"
          - "CASCADE HOP 4: creates a VendorAssignment with status OFFERED for the selected vendor"
          - "when pipeline == STORM, freezes StormResponse.surcharge_pct_at_dispatch and WorkOrder.surcharge_pct_applied from calculation storm_surcharge_pct"
      - from: DISPATCHED
        to: APPROVED
        trigger: "POST /property-care/vendor-assignments/{id}/decline"
        actor: Vendor
        preconditions:
          - "the declining assignment has status == OFFERED"
        side_effects:
          - "the work order returns to APPROVED so it can be re-dispatched; dispatch_attempt_count is NOT decremented"
          - "the declined vendor is added to the exclusion set consumed by calculation vendor_selection on the next dispatch"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /property-care/vendor-assignments/{id}/start-work"
        actor: Vendor
        preconditions:
          - "the assignment has status == ACCEPTED"
        side_effects:
          - "Property.occupancy_state transitions VACANT -> CONTRACTOR_ONSITE"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /property-care/work-orders/{id}/complete"
        actor: Vendor
        preconditions:
          - "the accepted VendorAssignment has status == FINISHED"
          - "actual_labour_hours and actual_parts_cents are supplied"
        side_effects:
          - "recomputes labour_cost_cents, parts_cost_cents, markup_cents, storm_surcharge_cents and total_cents from the actuals"
          - "when work_type == REKEY, clears KeyAsset.rekey_pending_flag to false; KeyAsset.copies_total and KeyAsset.copies_lost are both left unchanged, so copies_on_hand stays reduced by the lost copies"
      - from: COMPLETED
        to: INVOICED
        trigger: "POST /property-care/work-orders/{id}/invoice"
        actor: AccountManager
        preconditions:
          - "the target Invoice has status == DRAFT"
        side_effects:
          - "creates one ACTIVE InvoiceLine with line_type WORK_ORDER and amount_cents == WorkOrder.total_cents"
          - "re-derives Invoice.storm_surcharge_pct, gross_service_cents, storm_surcharge_cents, subtotal_cents, tax_cents and total_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /property-care/findings/{id}/work-orders (a newer work order supersedes this draft)"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "no invoice line is produced for a VOID work order"

  - entity: VendorAssignment
    shape: branching
    initial_state: OFFERED
    terminal_states: [DECLINED, FINISHED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /property-care/vendor-assignments/{id}/accept"
        actor: Vendor
        preconditions:
          - "Vendor.status == ELIGIBLE"
          - "no KeyIssuance for this vendor has status IN {OVERDUE, LOST}"
          - "the window does not overlap another ACCEPTED or WORKING assignment for the same vendor per calculation assignment_window_overlap"
        side_effects:
          - "sets accepted_at"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /property-care/vendor-assignments/{id}/decline"
        actor: Vendor
        preconditions: []
        side_effects:
          - "records decline_reason"
          - "the parent WorkOrder transitions DISPATCHED -> APPROVED"
          - "any KeyIssuance created for this assignment with status == ISSUED transitions to RETURNED and its AccessGrant is INVALIDATED with reason ASSIGNMENT_WITHDRAWN"
      - from: ACCEPTED
        to: WORKING
        trigger: "POST /property-care/vendor-assignments/{id}/start-work"
        actor: Vendor
        preconditions:
          - "an AccessGrant for this vendor and the property's key has status IN {PENDING, ACTIVE} and the logical clock lies inside its window, inclusive at both ends"
        side_effects:
          - "the AccessGrant transitions PENDING -> ACTIVE"
          - "the parent WorkOrder transitions DISPATCHED -> IN_PROGRESS"
          - "Property.occupancy_state transitions VACANT -> CONTRACTOR_ONSITE"
      - from: WORKING
        to: FINISHED
        trigger: "POST /property-care/vendor-assignments/{id}/finish-work"
        actor: Vendor
        preconditions: []
        side_effects:
          - "sets finished_at"
          - "Property.occupancy_state transitions CONTRACTOR_ONSITE -> VACANT when no other assignment for the property is WORKING"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /property-care/vendor-assignments/{id}/withdraw"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "every AccessGrant for this assignment's key issuance transitions to INVALIDATED with reason ASSIGNMENT_WITHDRAWN"
          - "the parent WorkOrder transitions DISPATCHED -> APPROVED"

  - entity: Vendor
    shape: cyclic
    initial_state: ONBOARDING
    terminal_states: []
    note: "Two re-entrant loops: ELIGIBLE <-> SUSPENDED (operator action) and ELIGIBLE <-> LAPSED (credential expiry and renewal)."
    transitions:
      - from: ONBOARDING
        to: ELIGIBLE
        trigger: "POST /property-care/vendors/{id}/reinstate"
        actor: Dispatcher
        preconditions:
          - "Vendor.coi_expires_at > the logical clock"
          - "Vendor.license_expires_at > the logical clock"
          - "Vendor.rating >= VENDOR_MIN_RATING (3.0)"
        side_effects:
          - "sets last_eligibility_evaluated_at"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /property-care/vendors/{id}/suspend"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "assignments already ACCEPTED or WORKING are NOT retro-invalidated; only new offers are blocked"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /property-care/vendors/{id}/reinstate"
        actor: Dispatcher
        preconditions:
          - "Vendor.coi_expires_at > the logical clock"
          - "Vendor.license_expires_at > the logical clock"
          - "Vendor.rating >= VENDOR_MIN_RATING (3.0)"
        side_effects:
          - "sets last_eligibility_evaluated_at"
      - from: ELIGIBLE
        to: LAPSED
        trigger: "POST /property-care/vendors/{id}/refresh-eligibility"
        actor: Dispatcher
        preconditions:
          - "Vendor.coi_expires_at <= the logical clock OR Vendor.license_expires_at <= the logical clock"
        side_effects:
          - "sets last_eligibility_evaluated_at; completed work is untouched"
      - from: LAPSED
        to: ELIGIBLE
        trigger: "PATCH /property-care/vendors/{id}/credentials"
        actor: Dispatcher
        preconditions:
          - "the submitted coi_expires_at and license_expires_at are both strictly after the logical clock"
        side_effects:
          - "sets last_eligibility_evaluated_at"

  - entity: KeyIssuance
    shape: branching
    initial_state: ISSUED
    terminal_states: [RETURNED, RETURNED_LATE, REKEY_ORDERED]
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: "POST /property-care/key-issuances/{id}/return"
        actor: Dispatcher
        preconditions:
          - "the logical clock is <= return_deadline_at"
        side_effects:
          - "sets returned_at; re-derives KeyAsset.copies_issued_outstanding and copies_on_hand"
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /property-care/key-issuances/{id}/mark-overdue"
        actor: Dispatcher
        preconditions:
          - "the logical clock > return_deadline_at + KEY_OVERDUE_GRACE_HOURS (6) hours"
        side_effects:
          - "runs calculation key_overdue_days"
          - "blocks any further KeyIssuance for this vendor until the issuance leaves OVERDUE"
      - from: OVERDUE
        to: RETURNED_LATE
        trigger: "POST /property-care/key-issuances/{id}/return"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "sets returned_at; re-derives KeyAsset.copies_issued_outstanding and copies_on_hand"
      - from: OVERDUE
        to: LOST
        trigger: "POST /property-care/key-issuances/{id}/declare-lost"
        actor: Dispatcher
        preconditions:
          - "overdue_days >= KEY_LOST_THRESHOLD_DAYS (7)"
        side_effects:
          - "re-derives KeyAsset.copies_lost and copies_on_hand"
          - "every AccessGrant with this key_issuance_id transitions to INVALIDATED with reason KEY_LOST"
      - from: LOST
        to: REKEY_ORDERED
        trigger: "POST /property-care/key-issuances/{id}/declare-lost (second call, or the automatic continuation inside the first)"
        actor: Dispatcher
        preconditions:
          - "KeyAsset.rekey_pending_flag == false"
        side_effects:
          - "sets KeyAsset.rekey_pending_flag true"
          - "creates a Finding with severity HIGH, category SECURITY, status TRIAGED, bound to the property's COMPLETED Visit with the greatest completed_at or with visit_id null when none exists, and a work_type == REKEY WorkOrder in PENDING_APPROVAL with estimated_labour_hours 1.0 and estimated_parts_cents == REKEY_FEE_CENTS (32500)"

  - entity: AccessGrant
    shape: branching
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED, INVALIDATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /property-care/access-grants/{id}/activate"
        actor: Dispatcher
        preconditions:
          - "the logical clock lies inside [window_start_at, window_end_at], inclusive at both ends"
          - "rotation_index_at_grant == KeyAsset.code_rotation_count"
          - "the count of ACTIVE grants on the key is strictly less than KeyAsset.copies_total"
        side_effects:
          - "increments KeyAsset.active_grant_count by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /property-care/access-grants/{id}/revoke with reason == WINDOW_ELAPSED"
        actor: Dispatcher
        preconditions:
          - "the logical clock > window_end_at"
        side_effects:
          - "decrements KeyAsset.active_grant_count by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /property-care/access-grants/{id}/revoke with reason == OPERATOR"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "decrements KeyAsset.active_grant_count by 1"
      - from: PENDING
        to: INVALIDATED
        trigger: "POST /property-care/key-assets/{id}/rotate-code or POST /property-care/key-assets/{id}/access-grants (cascade hop 8)"
        actor: system
        preconditions:
          - "rotation_index_at_grant < KeyAsset.code_rotation_count after the rotation"
        side_effects:
          - "sets invalidated_reason CODE_ROTATION"
      - from: ACTIVE
        to: INVALIDATED
        trigger: "POST /property-care/key-assets/{id}/rotate-code or POST /property-care/key-assets/{id}/access-grants (cascade hop 8)"
        actor: system
        preconditions:
          - "rotation_index_at_grant < KeyAsset.code_rotation_count after the rotation"
        side_effects:
          - "sets invalidated_reason CODE_ROTATION and decrements KeyAsset.active_grant_count by 1"

  - entity: WinterizationRecord
    shape: cyclic
    initial_state: NOT_STARTED
    terminal_states: []
    note: "Re-entrant PARTIAL -> PARTIAL loop as individual steps land, plus a COMPLETE -> REOPENED -> PARTIAL return path."
    transitions:
      - from: NOT_STARTED
        to: PARTIAL
        trigger: "POST /property-care/winterization-records/{id}/steps"
        actor: FieldTech
        preconditions:
          - "completed_step_count after applying the step is >= 1 and < WINTERIZATION_REQUIRED_STEP_COUNT (4)"
        side_effects:
          - "recomputes completed_step_count and completeness_pct; re-derives Property.winterization_completeness_pct, freeze_risk_score and risk_posture"
      - from: PARTIAL
        to: PARTIAL
        trigger: "POST /property-care/winterization-records/{id}/steps"
        actor: FieldTech
        preconditions:
          - "the submitted step is not already recorded as done"
          - "completed_step_count after applying the step is < WINTERIZATION_REQUIRED_STEP_COUNT (4)"
        side_effects:
          - "recomputes completed_step_count and completeness_pct; re-derives Property.winterization_completeness_pct, freeze_risk_score and risk_posture"
      - from: PARTIAL
        to: COMPLETE
        trigger: "POST /property-care/winterization-records/{id}/steps"
        actor: FieldTech
        preconditions:
          - "completed_step_count after applying the step equals WINTERIZATION_REQUIRED_STEP_COUNT (4)"
        side_effects:
          - "sets completed_at and completeness_pct to 100.0"
          - "re-derives Property.winterization_completeness_pct, freeze_risk_score and risk_posture"
      - from: NOT_STARTED
        to: COMPLETE
        trigger: "POST /property-care/winterization-records/{id}/steps with step_code == ALL_REQUIRED"
        actor: FieldTech
        preconditions:
          - "thermostat_f is supplied and >= WINTERIZATION_MIN_THERMOSTAT_F (50)"
        side_effects:
          - "records all four required steps at once, sets completed_at and completeness_pct 100.0"
      - from: COMPLETE
        to: REOPENED
        trigger: "POST /property-care/winterization-records/{id}/reopen"
        actor: Dispatcher
        preconditions:
          - "reopen_reason is supplied"
        side_effects:
          - "clears the four required step flags to false, clears thermostat_set_f to null and completed_at to null"
          - "recomputes completeness_pct to 0.0 and re-derives Property.winterization_completeness_pct, freeze_risk_score and risk_posture"
      - from: REOPENED
        to: PARTIAL
        trigger: "POST /property-care/winterization-records/{id}/steps"
        actor: FieldTech
        preconditions:
          - "completed_step_count after applying the step is >= 1 and < WINTERIZATION_REQUIRED_STEP_COUNT (4)"
        side_effects:
          - "recomputes completed_step_count and completeness_pct"

  - entity: RentalTurnover
    shape: cyclic
    initial_state: BOOKED
    terminal_states: [CHECKIN, CANCELLED]
    note: "Capped retry cycle INSPECTION -> CLEANING bounded by TURNOVER_MAX_RECLEAN_ATTEMPTS (2)."
    transitions:
      - from: BOOKED
        to: CHECKOUT
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == CHECKOUT"
        actor: Dispatcher
        preconditions:
          - "the logical clock >= checkout_at"
        side_effects:
          - "Property.occupancy_state transitions RENTAL_OCCUPIED -> VACANT when it was RENTAL_OCCUPIED"
      - from: CHECKOUT
        to: CLEANING
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == CLEANING"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "sets clean_started_at"
      - from: CLEANING
        to: INSPECTION
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == INSPECTION"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "sets inspect_started_at"
      - from: INSPECTION
        to: CLEANING
        trigger: "POST /property-care/rental-turnovers/{id}/fail-inspection"
        actor: FieldTech
        preconditions:
          - "reclean_attempt_count < TURNOVER_MAX_RECLEAN_ATTEMPTS (2)"
        side_effects:
          - "increments reclean_attempt_count by 1 and clears inspect_started_at to null"
      - from: INSPECTION
        to: READY
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == READY"
        actor: FieldTech
        preconditions: []
        side_effects:
          - "sets ready_at"
      - from: READY
        to: CHECKIN
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == CHECKIN"
        actor: Dispatcher
        preconditions:
          - "the logical clock >= checkin_at"
        side_effects:
          - "Property.occupancy_state transitions VACANT -> RENTAL_OCCUPIED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /property-care/rental-turnovers/{id}/advance with to_status == CANCELLED"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "any Visit with rental_turnover_id equal to this row and status == SCHEDULED keeps its schedule; only the link is cleared"

  - entity: MailHold
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [RELEASED, FORWARDED]
    note: "Re-entrant ACTIVE -> OVERFLOW -> ACTIVE loop driven by package accumulation and collection."
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /property-care/mail-holds/{id}/log-packages with package_delta == 0"
        actor: FieldTech
        preconditions:
          - "the logical clock >= start_on"
        side_effects:
          - "no fee is assessed"
      - from: ACTIVE
        to: OVERFLOW
        trigger: "POST /property-care/mail-holds/{id}/log-packages with a positive package_delta"
        actor: FieldTech
        preconditions:
          - "package_count after applying package_delta >= PACKAGE_OVERFLOW_THRESHOLD_COUNT (6)"
        side_effects:
          - "increments overflow_events by 1"
          - "no SecurityIncident and no Finding are created: overflow is a billing and scheduling signal only"
      - from: OVERFLOW
        to: ACTIVE
        trigger: "POST /property-care/mail-holds/{id}/log-packages with a negative package_delta"
        actor: FieldTech
        preconditions:
          - "package_count after applying package_delta < PACKAGE_OVERFLOW_THRESHOLD_COUNT (6)"
        side_effects:
          - "package_count is reduced by the collected amount"
      - from: ACTIVE
        to: FORWARDED
        trigger: "POST /property-care/mail-holds/{id}/forward"
        actor: Dispatcher
        preconditions:
          - "forwarding_address is non-null"
        side_effects:
          - "runs calculation mail_disposition_fee, FORWARD variant, writing disposition_fee_cents"
          - "appends an ACTIVE InvoiceLine with line_type MAIL_DISPOSITION to the property's DRAFT Invoice when one exists"
      - from: OVERFLOW
        to: FORWARDED
        trigger: "POST /property-care/mail-holds/{id}/forward"
        actor: Dispatcher
        preconditions:
          - "forwarding_address is non-null"
        side_effects:
          - "runs calculation mail_disposition_fee, FORWARD variant, writing disposition_fee_cents"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /property-care/mail-holds/{id}/release"
        actor: Dispatcher
        preconditions:
          - "package_count == 0"
        side_effects:
          - "disposition_fee_cents stays at whatever the extension ladder produced"

  - entity: SecurityIncident
    shape: cyclic
    initial_state: REPORTED
    terminal_states: [RESOLVED, FALSE_ALARM]
    note: "Re-entrant INVESTIGATING -> ESCALATED -> INVESTIGATING loop."
    transitions:
      - from: REPORTED
        to: ACKNOWLEDGED
        trigger: "POST /property-care/security-incidents/{id}/acknowledge"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "no billing effect"
      - from: ACKNOWLEDGED
        to: INVESTIGATING
        trigger: "POST /property-care/security-incidents/{id}/investigate"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "when incident_type IN {ALARM_INTRUSION, ALARM_SMOKE, FREEZE_ALARM} an ALARM_RESPONSE Visit is created with trigger_source ALARM_TRIGGERED and triggered_visit_id is set to it"
      - from: INVESTIGATING
        to: ESCALATED
        trigger: "POST /property-care/security-incidents/{id}/escalate"
        actor: Dispatcher
        preconditions:
          - "severity IN {HIGH, CRITICAL}"
        side_effects:
          - "increments escalation_count by 1"
      - from: ESCALATED
        to: INVESTIGATING
        trigger: "POST /property-care/security-incidents/{id}/investigate"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "no additional visit is created on the second and later passes"
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /property-care/security-incidents/{id}/resolve"
        actor: Dispatcher
        preconditions:
          - "resolution_note is supplied"
        side_effects:
          - "no fee is assessed"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /property-care/security-incidents/{id}/resolve"
        actor: Dispatcher
        preconditions:
          - "resolution_note is supplied"
        side_effects:
          - "no fee is assessed"
      - from: INVESTIGATING
        to: FALSE_ALARM
        trigger: "POST /property-care/security-incidents/{id}/reclassify-false-alarm"
        actor: Dispatcher
        preconditions:
          - "incident_type IN {ALARM_INTRUSION, ALARM_SMOKE, FREEZE_ALARM, UNAUTHORIZED_ACCESS}"
        side_effects:
          - "CASCADE: sets false_alarm_sequence, then runs calculation false_alarm_fee writing false_alarm_fee_cents"
          - "re-derives Property.false_alarm_count_window"
          - "appends an ACTIVE InvoiceLine with line_type FALSE_ALARM_FEE and amount_cents == false_alarm_fee_cents to the property's DRAFT Invoice when one exists and the fee is greater than 0"
          - "re-derives that Invoice's gross_service_cents, subtotal_cents, tax_cents and total_cents"
      - from: ESCALATED
        to: FALSE_ALARM
        trigger: "POST /property-care/security-incidents/{id}/reclassify-false-alarm"
        actor: Dispatcher
        preconditions:
          - "incident_type IN {ALARM_INTRUSION, ALARM_SMOKE, FREEZE_ALARM, UNAUTHORIZED_ACCESS}"
        side_effects:
          - "identical to the INVESTIGATING -> FALSE_ALARM side-effect chain"

  - entity: StormEvent
    shape: cyclic
    initial_state: FORECAST
    terminal_states: [CLOSED]
    note: "Contains the bidirectional pair WARNING <-> WATCH (an operator may downgrade a WARNING back to WATCH when the forecast track moves away) and the re-entrant pair LANDFALL <-> ALL_CLEAR (a stalled system may make a secondary landfall after the all-clear)."
    transitions:
      - from: FORECAST
        to: WATCH
        trigger: "POST /property-care/storm-events/{id}/advisory with to_status == WATCH"
        actor: StormCoordinator
        preconditions:
          - "the logical clock is strictly before landfall_eta_at"
        side_effects:
          - "no responses are created automatically"
      - from: WATCH
        to: WARNING
        trigger: "POST /property-care/storm-events/{id}/advisory with to_status == WARNING"
        actor: StormCoordinator
        preconditions:
          - "the logical clock is strictly before landfall_eta_at"
        side_effects:
          - "every StormResponse on this event with status == PENDING keeps its status; deadlines are NOT recomputed on advisory change"
      - from: WARNING
        to: WATCH
        trigger: "POST /property-care/storm-events/{id}/advisory with to_status == WATCH"
        actor: StormCoordinator
        preconditions:
          - "the logical clock is strictly before landfall_eta_at"
        side_effects:
          - "increments downgrade_count by 1"
          - "already-scheduled secure sweeps keep their deadline; the downgrade never extends a deadline"
      - from: WARNING
        to: IMMINENT
        trigger: "POST /property-care/storm-events/{id}/advisory with to_status == IMMINENT"
        actor: StormCoordinator
        preconditions:
          - "the logical clock is strictly before landfall_eta_at"
        side_effects:
          - "Pipeline S work orders created from this point may auto-approve under STORM_EMERGENCY_APPROVAL_CEILING_CENTS (250000)"
      - from: IMMINENT
        to: LANDFALL
        trigger: "POST /property-care/storm-events/{id}/landfall"
        actor: StormCoordinator
        preconditions: []
        side_effects:
          - "sets landfall_recorded_at"
          - "every StormResponse with status == SECURE_SWEEP_SCHEDULED whose secure_sweep_deadline_at < the logical clock transitions to MISSED_DEADLINE"
          - "every StormResponse with status IN {SECURED, SECURED_LATE, MISSED_DEADLINE} transitions to AWAITING_ALL_CLEAR"
      - from: LANDFALL
        to: ALL_CLEAR
        trigger: "POST /property-care/storm-events/{id}/all-clear"
        actor: StormCoordinator
        preconditions: []
        side_effects:
          - "sets all_clear_at"
          - "every StormResponse with status == AWAITING_ALL_CLEAR transitions to ASSESSMENT_DUE and receives assessment_deadline_at from calculation response_deadline, POST_STORM variant"
      - from: ALL_CLEAR
        to: LANDFALL
        trigger: "POST /property-care/storm-events/{id}/landfall (secondary landfall: a stalled system re-intensifies after the all-clear)"
        actor: StormCoordinator
        preconditions: []
        side_effects:
          - "rewrites landfall_recorded_at to the logical clock and clears all_clear_at back to null"
          - "StormResponse rows already in ASSESSMENT_DUE keep that status and keep their assessment_deadline_at; they are NOT rewound"
          - "this is the only path that leaves a StormResponse in ASSESSMENT_DUE while its parent event is not ALL_CLEAR, and it is what makes validation rung 28 (ERR_STORM_NOT_ALL_CLEAR) reachable"
      - from: ALL_CLEAR
        to: CLOSED
        trigger: "POST /property-care/storm-events/{id}/close"
        actor: StormCoordinator
        preconditions:
          - "every StormResponse on this event has status IN {ASSESSED, CLOSED}"
        side_effects:
          - "every StormResponse with status == ASSESSED transitions to CLOSED"
          - "clears Property.storm_hold_flag on every responded property that has no other open response"

  - entity: StormResponse
    shape: branching
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: SECURE_SWEEP_SCHEDULED
        trigger: "POST /property-care/storm-responses/{id}/schedule-sweep"
        actor: StormCoordinator
        preconditions:
          - "the parent StormEvent has status IN {WATCH, WARNING, IMMINENT}"
          - "Property.state_code equals StormEvent.region_state_code"
        side_effects:
          - "writes secure_sweep_deadline_at from calculation response_deadline, PRE_STORM variant, using the tier at scheduling time"
          - "creates a Visit with visit_type STORM_SECURE, trigger_source STORM, storm_response_id set, scheduled window ending at secure_sweep_deadline_at"
          - "sets secure_sweep_visit_id and Property.storm_hold_flag true"
      - from: SECURE_SWEEP_SCHEDULED
        to: SECURED
        trigger: "POST /property-care/visits/{id}/complete on the bound STORM_SECURE visit"
        actor: FieldTech
        preconditions:
          - "calculation sweep_timeliness returns true"
        side_effects:
          - "sets secured_at and swept_by_user_id"
          - "runs calculation guarantee_credit_amount, EARNED variant"
      - from: SECURE_SWEEP_SCHEDULED
        to: SECURED_LATE
        trigger: "POST /property-care/visits/{id}/complete on the bound STORM_SECURE visit"
        actor: FieldTech
        preconditions:
          - "calculation sweep_timeliness returns false"
        side_effects:
          - "sets secured_at and swept_by_user_id"
          - "runs calculation guarantee_credit_amount, FORFEITED variant, writing guarantee_credit_cents 0"
      - from: SECURE_SWEEP_SCHEDULED
        to: MISSED_DEADLINE
        trigger: "POST /property-care/storm-events/{id}/landfall"
        actor: StormCoordinator
        preconditions:
          - "secure_sweep_deadline_at < the logical clock and secured_at is null"
        side_effects:
          - "guarantee_credit_cents stays 0"
      - from: SECURED
        to: AWAITING_ALL_CLEAR
        trigger: "POST /property-care/storm-events/{id}/landfall"
        actor: StormCoordinator
        preconditions: []
        side_effects: ["no arithmetic"]
      - from: SECURED_LATE
        to: AWAITING_ALL_CLEAR
        trigger: "POST /property-care/storm-events/{id}/landfall"
        actor: StormCoordinator
        preconditions: []
        side_effects: ["no arithmetic"]
      - from: MISSED_DEADLINE
        to: AWAITING_ALL_CLEAR
        trigger: "POST /property-care/storm-events/{id}/landfall"
        actor: StormCoordinator
        preconditions: []
        side_effects: ["no arithmetic"]
      - from: AWAITING_ALL_CLEAR
        to: ASSESSMENT_DUE
        trigger: "POST /property-care/storm-events/{id}/all-clear"
        actor: StormCoordinator
        preconditions: []
        side_effects:
          - "writes assessment_deadline_at from calculation response_deadline, POST_STORM variant"
      - from: ASSESSMENT_DUE
        to: ASSESSED
        trigger: "POST /property-care/storm-responses/{id}/assessments"
        actor: FieldTech
        preconditions:
          - "expected_storm_response_version equals StormResponse.version"
          - "X-User-ID differs from swept_by_user_id (segregation of duties)"
        side_effects:
          - "sets assessed_at, assessed_by_user_id and damage_level"
          - "increments StormResponse.version by 1"
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /property-care/storm-responses/{id}/close"
        actor: StormCoordinator
        preconditions: []
        side_effects:
          - "clears Property.storm_hold_flag when no other open response exists for the property"

  - entity: Invoice
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    note: "Re-entrant ISSUED -> DISPUTED -> ISSUED loop."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /property-care/invoices/{id}/issue"
        actor: AccountManager
        preconditions:
          - "the parent BillingCycle has status IN {OPEN, CLOSING, CLOSED}"
          - "the subscription's status != CANCELLED"
          - "at least one ACTIVE InvoiceLine exists"
        side_effects:
          - "recomputes every step of calculation invoice_total and freezes the line set"
          - "sets issued_at"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /property-care/invoices/{id}/pay"
        actor: AccountManager
        preconditions:
          - "0 < amount_cents < balance_due_cents"
        side_effects:
          - "increases amount_paid_cents and recomputes balance_due_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /property-care/invoices/{id}/pay"
        actor: AccountManager
        preconditions:
          - "amount_cents >= balance_due_cents"
        side_effects:
          - "sets amount_paid_cents to total_cents, balance_due_cents to 0 and paid_at to the logical clock"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /property-care/invoices/{id}/pay"
        actor: AccountManager
        preconditions:
          - "amount_cents >= balance_due_cents"
        side_effects:
          - "sets balance_due_cents to 0 and paid_at to the logical clock"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /property-care/invoices/{id}/dispute"
        actor: Owner
        preconditions:
          - "the acting Owner's X-User-ID equals Invoice.owner_id"
        side_effects:
          - "increments dispute_count by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /property-care/invoices/{id}/resolve-dispute"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "recomputes every step of calculation invoice_total over the current ACTIVE line set"
      - from: ISSUED
        to: VOID
        trigger: "POST /property-care/invoices/{id}/void"
        actor: AccountManager
        preconditions:
          - "amount_paid_cents == 0"
        side_effects:
          - "every ACTIVE InvoiceLine transitions to VOID"
      - from: DRAFT
        to: VOID
        trigger: "POST /property-care/invoices/{id}/void"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "every ACTIVE InvoiceLine transitions to VOID"

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table  (44 rules; 10 carry a `variants:` block whose
# branches are structurally different formulas selected by a named
# discriminator, not merely different constants)
# ---------------------------------------------------------------------------
calculations:
  - name: travel_zone_assignment
    trigger: "POST /property-care/properties and PATCH /property-care/properties/{id} whenever travel_distance_miles is written"
    algorithm: threshold
    formula: |
      m = Property.travel_distance_miles
      if m <= TRAVEL_ZONE_Z1_MAX_MILES:        zone = "Z1"
      elif m <= TRAVEL_ZONE_Z2_MAX_MILES:      zone = "Z2"
      elif m <= TRAVEL_ZONE_Z3_MAX_MILES:      zone = "Z3"
      else:                                    zone = "OUT_OF_AREA"
      # Every comparison is inclusive at the upper edge: 10.0 is Z1, 10.1 is Z2,
      # 25.0 is Z2, 60.0 is Z3, 60.1 is OUT_OF_AREA.
    input_set: "the single Property row being written"
    constants:
      TRAVEL_ZONE_Z1_MAX_MILES: 10
      TRAVEL_ZONE_Z2_MAX_MILES: 25
      TRAVEL_ZONE_Z3_MAX_MILES: 60
    precision: "zone is an enum; miles compared as a decimal number with no rounding"

  - name: travel_surcharge
    trigger: "calculation visit_billable_amount, every branch"
    algorithm: tiered_pricing
    formula: |
      surcharge = { "Z1": TRAVEL_SURCHARGE_Z1_CENTS,
                    "Z2": TRAVEL_SURCHARGE_Z2_CENTS,
                    "Z3": TRAVEL_SURCHARGE_Z3_CENTS }[Property.travel_zone]
      # OUT_OF_AREA properties cannot hold an ACTIVE subscription (rung 54) and
      # therefore never reach this calculation.
    input_set: "Property.travel_zone of the visited property"
    constants:
      TRAVEL_SURCHARGE_Z1_CENTS: 0
      TRAVEL_SURCHARGE_Z2_CENTS: 1500
      TRAVEL_SURCHARGE_Z3_CENTS: 3800
    precision: "integer cents"

  - name: after_hours_flag
    trigger: "POST /property-care/visits/{id}/arrive"
    algorithm: threshold
    formula: |
      h = utc_hour(Visit.arrived_at)          # 0..23
      flag = (h >= AFTER_HOURS_START_HOUR_UTC) or (h < AFTER_HOURS_END_HOUR_UTC)
      # 21:59 -> false, 22:00 -> true, 05:59 -> true, 06:00 -> false.
    input_set: "the arriving Visit row"
    constants:
      AFTER_HOURS_START_HOUR_UTC: 22
      AFTER_HOURS_END_HOUR_UTC: 6
    precision: "boolean; the hour field only, minutes and seconds ignored"

  - name: visit_base_fee
    trigger: "calculation visit_billable_amount at POST /property-care/visits/{id}/complete"
    algorithm: threshold
    formula: |
      # DISCRIMINATOR: Visit.trigger_source
      if Visit.trigger_source == "SCHEDULED":
          base = VISIT_BASE_FEE_SCHEDULED_CENTS
          expedite = 0
      else:
          base = VISIT_BASE_FEE_UNSCHEDULED_CENTS
          expedite = OWNER_REQUEST_EXPEDITE_FEE_CENTS if Visit.trigger_source == "OWNER_REQUESTED" else 0
      return (base, expedite)
    input_set: "the completing Visit row"
    constants:
      VISIT_BASE_FEE_SCHEDULED_CENTS: 6500
      VISIT_BASE_FEE_UNSCHEDULED_CENTS: 11000
      OWNER_REQUEST_EXPEDITE_FEE_CENTS: 2500
    precision: "integer cents"
    variants:
      - name: SCHEDULED_RATE
        when: "Visit.trigger_source == SCHEDULED"
        difference: "flat 6500 with no expedite component; this is the only branch that can ever consume entitlement"
      - name: UNSCHEDULED_RATE
        when: "Visit.trigger_source IN {OWNER_REQUESTED, ALARM_TRIGGERED, STORM}"
        difference: "11000 base, plus a 2500 expedite component on OWNER_REQUESTED only; never consumes entitlement"

  - name: visit_billable_amount
    trigger: "POST /property-care/visits/{id}/complete, after calculation entitlement_consumption has decided entitlement_applied"
    algorithm: tiered_pricing
    formula: |
      (base, expedite) = visit_base_fee(Visit)
      zone_surcharge   = travel_surcharge(Property)
      # DISCRIMINATOR: Visit.entitlement_applied
      if Visit.entitlement_applied:
          # ENTITLED branch: the base fee and the expedite component are both
          # waived; the travel surcharge is NOT waived and the after-hours
          # multiplier does not apply because there is no base to multiply.
          billable = zone_surcharge
      else:
          # OVERAGE branch: the multiplier applies to the base fee ONLY, never
          # to the expedite component and never to the travel surcharge.
          multiplied = round_half_up(base * AFTER_HOURS_MULTIPLIER) if Visit.after_hours_flag else base
          billable   = multiplied + expedite + zone_surcharge
      return billable
      # Worked: SCHEDULED, Z2, not after hours, OVERAGE -> 6500 + 0 + 1500 = 8000
      # Worked: SCHEDULED, Z2, ENTITLED                 -> 1500
      # Worked: OWNER_REQUESTED, Z3, after hours        -> round(11000*1.35)=14850 + 2500 + 3800 = 21150
    input_set: "the completing Visit row and its Property"
    constants:
      AFTER_HOURS_MULTIPLIER: 1.35
    precision: "integer cents, round_half_up"
    variants:
      - name: ENTITLED
        when: "Visit.entitlement_applied == true"
        difference: "billable is the travel surcharge alone; the after-hours multiplier is structurally absent from the expression"
      - name: OVERAGE
        when: "Visit.entitlement_applied == false"
        difference: "billable multiplies the base by the after-hours factor, then adds expedite and travel surcharge as flat addends"

  - name: entitlement_consumption
    trigger: "POST /property-care/visits/{id}/complete, before calculation visit_billable_amount"
    algorithm: waterfall_allocation
    formula: |
      cycle = the BillingCycle with subscription_id == the property's subscription
              and status == OPEN; null when none
      eligible = (cycle is not null)
             and (Subscription.status == "ACTIVE")
             and (Visit.trigger_source == ENTITLEMENT_CONSUMING_TRIGGER_SOURCE)
             and (Visit.visit_type in ServicePlan.covered_visit_types)
             and (Visit.visit_type in ENTITLEMENT_CONSUMING_VISIT_TYPES)
             and (Visit.storm_response_id is null)
             and (cycle.entitlement_remaining_units >= 1)
      if eligible:
          Visit.entitlement_applied = true
          cycle.entitlement_consumed_units  += 1
          cycle.entitlement_remaining_units -= 1
      else:
          Visit.entitlement_applied = false
      # CONSUMPTION ORDER: units are consumed strictly in ascending Visit.completed_at;
      # when two visits share completed_at the one with the smaller created_at
      # consumes first. No other ordering key is consulted.
    input_set: "the OPEN BillingCycle of the visited property's subscription, plus the in-force ServicePlan"
    constants:
      ENTITLEMENT_CONSUMING_TRIGGER_SOURCE: "SCHEDULED"
      ENTITLEMENT_CONSUMING_VISIT_TYPES: ["ROUTINE_WATCH", "SEASONAL_CLOSE", "SEASONAL_OPEN"]
    precision: "integer units; the boundary is `>= 1`, so a cycle with exactly 1 remaining unit still consumes"

  - name: entitlement_rollover
    trigger: "POST /property-care/billing-cycles/{id}/close"
    algorithm: threshold
    formula: |
      remaining = cycle.entitlement_remaining_units
      # DISCRIMINATOR: the in-force ServicePlan.entitlement_rollover_policy
      if plan.entitlement_rollover_policy == "EXPIRE":
          carried_out = 0
          expired     = remaining
      else:  # CARRY_CAPPED
          carried_out = min(remaining, ENTITLEMENT_ROLLOVER_CAP_UNITS)
          expired     = remaining - carried_out
      # Cancellation forces carried_out = 0 and expired = remaining regardless
      # of policy (see Subscription ACTIVE -> CANCELLED side effects).
    input_set: "the closing BillingCycle and the ServicePlan in force at close"
    constants:
      ENTITLEMENT_ROLLOVER_CAP_UNITS: 2
    precision: "integer units"
    variants:
      - name: EXPIRE
        when: "plan.entitlement_rollover_policy == EXPIRE"
        difference: "the whole remainder is destroyed; the next cycle's carried_in is 0 regardless of size"
      - name: CARRY_CAPPED
        when: "plan.entitlement_rollover_policy == CARRY_CAPPED"
        difference: "a min() against the cap is taken first and only the excess is destroyed, so the two variants diverge whenever remaining > 0"

  - name: proration_amount
    trigger: "POST /property-care/subscriptions/{id}/pause, POST /property-care/subscriptions/{id}/resume, POST /property-care/subscriptions/{id}/tier-changes"
    algorithm: chronological
    formula: |
      # DISCRIMINATOR: the triggering endpoint family.
      if trigger is pause or resume:                       # MID_CYCLE_PAUSE
          paused_days = floor((min(clock, cycle.period_end) - Subscription.paused_at) / 86400)
          paused_days = max(0, min(paused_days, PRORATION_DAY_BASIS))
          fee = round_half_up(plan.monthly_fee_cents * (PRORATION_DAY_BASIS - paused_days) / PRORATION_DAY_BASIS)
      else:                                                # MID_CYCLE_TIER_CHANGE
          used_days      = floor((clock - cycle.period_start) / 86400)
          used_days      = max(0, min(used_days, PRORATION_DAY_BASIS))
          remaining_days = PRORATION_DAY_BASIS - used_days
          # ROUNDING ORDER IS PINNED: round EACH LEG to whole cents, THEN sum.
          # Summing first and rounding once is a different (wrong) number.
          fee = round_half_up(old_plan.monthly_fee_cents * used_days / PRORATION_DAY_BASIS) \
              + round_half_up(new_plan.monthly_fee_cents * remaining_days / PRORATION_DAY_BASIS)
      # Worked (tier change STANDARD 19986 -> PREMIUM 34944 at used_days = 7):
      #   leg1 = round_half_up(19986*7/30)  = round_half_up(4663.4)  = 4663
      #   leg2 = round_half_up(34944*23/30) = round_half_up(26790.4) = 26790
      #   fee  = 31453      (sum-then-round would give 31454 — a one-cent divergence)
    input_set: "the OPEN BillingCycle, the Subscription, and both ServicePlan rows when a tier change is involved"
    constants:
      PRORATION_DAY_BASIS: 30
    precision: "integer cents, round_half_up, applied per leg"
    variants:
      - name: MID_CYCLE_PAUSE
        when: "the trigger is pause or resume"
        difference: "a single multiplicative term over unpaused days; one rounding operation total"
      - name: MID_CYCLE_TIER_CHANGE
        when: "the trigger is a tier change"
        difference: "a two-leg sum over two different monthly fees with an independent rounding operation per leg; the two variants can differ by one cent on identical day counts"

  - name: tier_change_entitlement_rederivation
    trigger: "POST /property-care/subscriptions/{id}/tier-changes"
    algorithm: aggregation
    formula: |
      # The change takes effect on the OPEN cycle immediately.
      new_grant = new_plan.included_visit_units
      cycle.entitlement_granted_units  = new_grant
      cycle.entitlement_remaining_units = max(
          0,
          new_grant + cycle.entitlement_carried_in_units - cycle.entitlement_consumed_units)
      # ORDER IS PINNED: the grant is replaced FIRST, then remaining is
      # re-derived from the identity, and only then is the max(0, .) floor
      # applied. Applying the floor to the grant instead would keep a
      # downgrade from ever reducing remaining below the already-consumed count.
    input_set: "the OPEN BillingCycle and the new ServicePlan"
    constants: {}
    precision: "integer units; the floor at 0 is inclusive"

  - name: subscription_fee_line_amount
    trigger: "POST /property-care/billing-cycles/{id}/invoices"
    algorithm: aggregation
    formula: |
      amount = cycle.prorated_fee_cents
      # A cycle that has never been paused and never had a tier change carries
      # prorated_fee_cents == plan.monthly_fee_cents exactly.
    input_set: "the BillingCycle being invoiced"
    constants: {}
    precision: "integer cents"

  - name: freeze_risk_score
    trigger: "POST /property-care/visits/{id}/complete when interior_temp_f is non-null; POST /property-care/properties/{id}/occupancy-transitions; every WinterizationRecord step, reopen and seasonal transition"
    algorithm: weighted_scoring
    formula: |
      t = Property.last_interior_temp_f
      if t is null:
          delta_term = 0.0
      else:
          delta       = max(0.0, Property.freeze_setpoint_f - t)
          delta_term  = min(FREEZE_RISK_WEIGHT_DELTA * delta, FREEZE_RISK_DELTA_CAP)
      w = Property.winterization_completeness_pct
      wint_term = 0.0 if w >= 100.0 else FREEZE_RISK_WEIGHT_WINTERIZATION * (1.0 - w / 100.0)
      vac_term  = FREEZE_RISK_WEIGHT_VACANCY if Property.occupancy_state == "VACANT" else 0.0
      score = min(FREEZE_RISK_SCORE_MAX, round_half_up(delta_term + wint_term + vac_term, 1))
      # Worked: setpoint 55, temp 48, winterization 50.0 pct, VACANT
      #   delta = 7.0 -> delta_term = min(42.0, 60.0) = 42.0
      #   wint_term = 25.0 * 0.5 = 12.5
      #   vac_term  = 15.0
      #   score = min(100.0, 69.5) = 69.5
    input_set: "the single Property row; three independent inputs with a nested min/max and two conditional branches"
    constants:
      FREEZE_RISK_WEIGHT_DELTA: 6.0
      FREEZE_RISK_DELTA_CAP: 60.0
      FREEZE_RISK_WEIGHT_WINTERIZATION: 25.0
      FREEZE_RISK_WEIGHT_VACANCY: 15.0
      FREEZE_RISK_SCORE_MAX: 100.0
    precision: "one decimal place, round_half_up"

  - name: property_risk_posture
    trigger: "immediately after every freeze_risk_score run"
    algorithm: threshold
    formula: |
      s = Property.freeze_risk_score
      if s >= FREEZE_RISK_CRITICAL_THRESHOLD:   posture = "CRITICAL"
      elif s >= FREEZE_RISK_ELEVATED_THRESHOLD: posture = "ELEVATED"
      else:                                     posture = "NORMAL"
      # Both comparisons are `>=`: exactly 30.0 is ELEVATED, exactly 60.0 is CRITICAL.
    input_set: "the single Property row"
    constants:
      FREEZE_RISK_ELEVATED_THRESHOLD: 30.0
      FREEZE_RISK_CRITICAL_THRESHOLD: 60.0
    precision: "enum"

  - name: temp_breach_detection
    trigger: "POST /property-care/visits/{id}/complete when interior_temp_f is non-null"
    algorithm: threshold
    formula: |
      breach = Visit.interior_temp_f < (Property.freeze_setpoint_f - FREEZE_TOLERANCE_BAND_F)
      # STRICT less-than. With setpoint 55 and band 3 the trip point is 52.0:
      # 52.0 is NOT a breach, 51.9 IS a breach.
    input_set: "the completing Visit and its Property"
    constants:
      FREEZE_TOLERANCE_BAND_F: 3
    precision: "one decimal place on the reading; comparison is exact"

  - name: winterization_completeness
    trigger: "POST /property-care/winterization-records/{id}/steps and POST /property-care/winterization-records/{id}/reopen"
    algorithm: aggregation
    formula: |
      done = 0
      done += 1 if record.water_shutoff_done else 0
      done += 1 if record.lines_drained_done else 0
      done += 1 if (record.thermostat_set_f is not null
                    and record.thermostat_set_f >= WINTERIZATION_MIN_THERMOSTAT_F) else 0
      done += 1 if record.valve_tagged_done else 0
      # antifreeze_added_done is deliberately NOT counted.
      pct = round_half_up(100.0 * done / WINTERIZATION_REQUIRED_STEP_COUNT, 1)
      # A THERMOSTAT_SET step submitted with thermostat_f = 49 records the value
      # but does NOT increment `done`; 50 exactly does.
    input_set: "the single WinterizationRecord row"
    constants:
      WINTERIZATION_REQUIRED_STEP_COUNT: 4
      WINTERIZATION_MIN_THERMOSTAT_F: 50
    precision: "one decimal place; 1/4 -> 25.0, 3/4 -> 75.0"

  - name: checklist_completion_pct
    trigger: "POST /property-care/visits/{id}/complete"
    algorithm: aggregation
    formula: |
      pct = round_half_up(100.0 * (len(completed_item_codes) + len(failed_item_codes))
                          / ChecklistTemplate.required_item_count, 1)
      # Rung 63 forces the numerator to equal required_item_count, so a
      # successful completion always yields exactly 100.0.
    input_set: "the completing Visit and its bound ChecklistTemplate"
    constants: {}
    precision: "one decimal place"

  - name: finding_escalation_score
    trigger: "POST /property-care/findings/{id}/triage (both the OPEN and the MONITORING source states)"
    algorithm: weighted_scoring
    formula: |
      sev = {"LOW": 5.0, "MEDIUM": 15.0, "HIGH": 30.0, "CRITICAL": 50.0}[Finding.severity]
      recheck_term = min(FINDING_RECHECK_WEIGHT * Finding.monitor_recheck_count, FINDING_RECHECK_CAP)
      posture_term = {"NORMAL": 0.0, "ELEVATED": 10.0, "CRITICAL": 20.0}[Property.risk_posture]
      score = min(FINDING_SCORE_MAX, round_half_up(sev + recheck_term + posture_term, 1))
    input_set: "the Finding row and its Property's current risk_posture"
    constants:
      FINDING_SEVERITY_WEIGHT_LOW: 5.0
      FINDING_SEVERITY_WEIGHT_MEDIUM: 15.0
      FINDING_SEVERITY_WEIGHT_HIGH: 30.0
      FINDING_SEVERITY_WEIGHT_CRITICAL: 50.0
      FINDING_RECHECK_WEIGHT: 8.0
      FINDING_RECHECK_CAP: 24.0
      FINDING_POSTURE_WEIGHT_NORMAL: 0.0
      FINDING_POSTURE_WEIGHT_ELEVATED: 10.0
      FINDING_POSTURE_WEIGHT_CRITICAL: 20.0
      FINDING_SCORE_MAX: 100.0
    precision: "one decimal place, round_half_up"

  - name: labour_cost
    trigger: "POST /property-care/work-orders/{id}/submit and POST /property-care/work-orders/{id}/complete"
    algorithm: aggregation
    formula: |
      hours = WorkOrder.actual_labour_hours if WorkOrder.actual_labour_hours is not null
              else WorkOrder.estimated_labour_hours
      rate  = Vendor.hourly_rate_cents of the ACCEPTED / WORKING / FINISHED VendorAssignment
              on this work order, or LABOUR_RATE_DEFAULT_CENTS_PER_HOUR when no
              such assignment exists yet
      labour_cost_cents = round_half_up(hours * rate)
      # Worked: 3.5 h at 8500 -> 29750
    input_set: "the WorkOrder plus the single non-terminal VendorAssignment on it"
    constants:
      LABOUR_RATE_DEFAULT_CENTS_PER_HOUR: 8500
    precision: "integer cents, round_half_up"

  - name: vendor_markup
    trigger: "POST /property-care/work-orders/{id}/submit and POST /property-care/work-orders/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      base = WorkOrder.labour_cost_cents + WorkOrder.parts_cost_cents
      # DISCRIMINATOR 1: Vendor.billing_mode (or MANAGED when no vendor is bound yet)
      pct = VENDOR_MARKUP_PCT_MANAGED if mode == "MANAGED" else VENDOR_MARKUP_PCT_PASS_THROUGH
      # DISCRIMINATOR 2: the value tier. EVALUATION ORDER IS PINNED — the tier is
      # selected on `base` (labour + parts, BEFORE markup), never on total_cents,
      # even though the prose calls it "the work order's value tier".
      if base >= VENDOR_MARKUP_VOLUME_TIER_BASE_CENTS:
          pct = pct - VENDOR_MARKUP_VOLUME_RELIEF_PCT
      markup = min(round_half_up(base * pct), VENDOR_MARKUP_CAP_CENTS)
      # Worked: base 41750, MANAGED, below the volume tier ->
      #   round_half_up(41750 * 0.18) = round_half_up(7515.0) = 7515
      # Worked: base 120000, MANAGED, at or above the volume tier ->
      #   pct = 0.18 - 0.03 = 0.15 ; round_half_up(18000.0) = 18000
    input_set: "the WorkOrder and the bound Vendor"
    constants:
      VENDOR_MARKUP_PCT_MANAGED: 0.18
      VENDOR_MARKUP_PCT_PASS_THROUGH: 0.05
      VENDOR_MARKUP_VOLUME_RELIEF_PCT: 0.03
      VENDOR_MARKUP_VOLUME_TIER_BASE_CENTS: 100000
      VENDOR_MARKUP_CAP_CENTS: 60000
    precision: "integer cents, round_half_up, then a min() against the cap"
    variants:
      - name: MANAGED
        when: "Vendor.billing_mode == MANAGED, or no vendor is bound yet"
        difference: "18 percent of base before volume relief; the concierge carries the vendor relationship"
      - name: PASS_THROUGH
        when: "Vendor.billing_mode == PASS_THROUGH"
        difference: "5 percent of base before volume relief; on the same base the two branches differ by 13 percent of base, and the volume-relief subtraction can drive PASS_THROUGH to 2 percent while MANAGED lands at 15 percent"

  - name: storm_advisory_tier
    trigger: "read on every GET of a StormEvent and consumed by response_deadline and storm_surcharge_pct"
    algorithm: threshold
    formula: |
      h = (StormEvent.landfall_eta_at - clock) / 3600.0      # may be negative after landfall
      if h > STORM_TIER_WATCH_MAX_HOURS:      tier = "FORECAST"
      elif h > STORM_TIER_WARNING_MAX_HOURS:  tier = "WATCH"
      elif h > STORM_TIER_IMMINENT_MAX_HOURS: tier = "WARNING"
      else:                                   tier = "IMMINENT"
      # Every boundary is STRICT on the upper side: exactly 48.0 hours out is
      # WATCH (not FORECAST), exactly 24.0 is WARNING, exactly 6.0 is IMMINENT.
    input_set: "the StormEvent row and the logical clock"
    constants:
      STORM_TIER_WATCH_MAX_HOURS: 48
      STORM_TIER_WARNING_MAX_HOURS: 24
      STORM_TIER_IMMINENT_MAX_HOURS: 6
    precision: "hours as a float; enum out"

  - name: response_deadline
    trigger: "POST /property-care/storm-responses/{id}/schedule-sweep (PRE_STORM) and POST /property-care/storm-events/{id}/all-clear (POST_STORM)"
    algorithm: interval_merge
    formula: |
      # DISCRIMINATOR: the phase of the storm response.
      if phase == "PRE_STORM":
          lead = { "FORECAST": STORM_SWEEP_LEAD_HOURS_FORECAST,
                   "WATCH":    STORM_SWEEP_LEAD_HOURS_WATCH,
                   "WARNING":  STORM_SWEEP_LEAD_HOURS_WARNING,
                   "IMMINENT": STORM_SWEEP_LEAD_HOURS_IMMINENT }[storm_advisory_tier(event)]
          deadline = StormEvent.landfall_eta_at - lead hours          # ANCHOR: landfall ETA, SUBTRACT
      else:  # POST_STORM
          deadline = StormEvent.all_clear_at + STORM_ASSESSMENT_SLA_HOURS hours
                                                                      # ANCHOR: all-clear, ADD
      # The two branches use different anchor fields AND opposite directions;
      # anchoring the post-storm SLA on landfall instead of all-clear is the
      # single most tempting wrong reading and produces a deadline that is
      # earlier than the assessment could physically start.
    input_set: "the StormEvent row and the tier at the moment of scheduling"
    constants:
      STORM_SWEEP_LEAD_HOURS_FORECAST: 48
      STORM_SWEEP_LEAD_HOURS_WATCH: 36
      STORM_SWEEP_LEAD_HOURS_WARNING: 18
      STORM_SWEEP_LEAD_HOURS_IMMINENT: 2
      STORM_ASSESSMENT_SLA_HOURS: 72
    precision: "whole hours; the resulting instant keeps millisecond precision from the anchor"
    variants:
      - name: PRE_STORM
        when: "phase == PRE_STORM, at schedule-sweep time"
        difference: "landfall_eta_at MINUS a tier-selected lead; recomputed never, frozen at scheduling"
      - name: POST_STORM
        when: "phase == POST_STORM, at all-clear time"
        difference: "all_clear_at PLUS a fixed 72-hour SLA; a different anchor field, a different sign and no tier lookup at all"

  - name: sweep_timeliness
    trigger: "POST /property-care/visits/{id}/complete on a STORM_SECURE visit"
    algorithm: threshold
    formula: |
      on_time = (StormResponse.secured_at <= StormResponse.secure_sweep_deadline_at)
      # INCLUSIVE at the boundary: securing at exactly the deadline instant is
      # on time and earns the guarantee credit.
    input_set: "the bound StormResponse"
    constants: {}
    precision: "instant comparison at millisecond resolution"

  - name: guarantee_credit_amount
    trigger: "the SECURED and SECURED_LATE transitions of StormResponse"
    algorithm: threshold
    formula: |
      # DISCRIMINATOR: sweep_timeliness AND ServicePlan.storm_guarantee_included
      if sweep_on_time and plan.storm_guarantee_included:
          basis = sum(WorkOrder.storm_surcharge_cents) over WorkOrder rows with
                  storm_event_id == StormResponse.storm_event_id
                  and property_id == StormResponse.property_id
                  and status IN {COMPLETED, INVOICED}
          if basis == 0:
              credit = STORM_GUARANTEE_CREDIT_CENTS          # flat guarantee when nothing was surcharged
          else:
              credit = min(STORM_GUARANTEE_CREDIT_CENTS,
                           round_half_up(basis * STORM_GUARANTEE_CREDIT_PCT))
      else:
          credit = 0
      # Worked: on time, guarantee included, no storm work order completed -> 15000
      # Worked: on time, guarantee included, basis 40000 -> min(15000, 20000) = 15000
      # Worked: on time, guarantee included, basis 20000 -> min(15000, 10000) = 10000
      # Worked: LATE by one second -> 0
    input_set: "the StormResponse, its Property's in-force ServicePlan"
    constants:
      STORM_GUARANTEE_CREDIT_CENTS: 15000
      STORM_GUARANTEE_CREDIT_PCT: 0.50
    precision: "integer cents"
    variants:
      - name: EARNED
        when: "sweep_on_time == true AND plan.storm_guarantee_included == true"
        difference: "a min() of a flat ceiling against half the surcharge basis, with a flat-ceiling fallback when the basis is zero"
      - name: FORFEITED
        when: "sweep_on_time == false OR plan.storm_guarantee_included == false"
        difference: "the expression collapses to the literal 0 and no GUARANTEE_CREDIT line is appended at all, so the invoice total is strictly larger"

  - name: storm_surcharge_pct
    trigger: "POST /property-care/work-orders/{id}/dispatch when WorkOrder.pipeline == STORM"
    algorithm: tiered_pricing
    formula: |
      pct = { "FORECAST": STORM_SURCHARGE_PCT_FORECAST,
              "WATCH":    STORM_SURCHARGE_PCT_WATCH,
              "WARNING":  STORM_SURCHARGE_PCT_WARNING,
              "IMMINENT": STORM_SURCHARGE_PCT_IMMINENT }[storm_advisory_tier(event)]
      # Frozen onto StormResponse.surcharge_pct_at_dispatch and
      # WorkOrder.surcharge_pct_applied at the dispatch instant; a later
      # advisory downgrade never lowers an already-frozen percentage.
    input_set: "the StormEvent bound to the work order, evaluated at dispatch time"
    constants:
      STORM_SURCHARGE_PCT_FORECAST: 0.0
      STORM_SURCHARGE_PCT_WATCH: 0.10
      STORM_SURCHARGE_PCT_WARNING: 0.20
      STORM_SURCHARGE_PCT_IMMINENT: 0.35
    precision: "two decimal places as a fraction"

  - name: work_order_storm_surcharge
    trigger: "POST /property-care/work-orders/{id}/submit and POST /property-care/work-orders/{id}/complete"
    algorithm: tiered_pricing
    formula: |
      if WorkOrder.pipeline == "ROUTINE":
          surcharge = 0
      else:
          pre = WorkOrder.labour_cost_cents + WorkOrder.parts_cost_cents + WorkOrder.markup_cents
          surcharge = round_half_up(pre * WorkOrder.surcharge_pct_applied)
      # The surcharge basis INCLUDES the markup. Applying the percentage to
      # labour + parts only is the tempting wrong reading.
    input_set: "the WorkOrder row"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: work_order_total
    trigger: "POST /property-care/work-orders/{id}/submit and POST /property-care/work-orders/{id}/complete"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED and is the whole point of this rule. The
      # markup tier reads like a function of the total, and the total is a
      # function of the markup; the scaffold breaks the apparent circularity by
      # fixing this sequence:
      #   step 1  labour_cost_cents  = labour_cost(...)
      #   step 2  parts_cost_cents   = actual_parts_cents if present else estimated_parts_cents
      #   step 3  base               = labour_cost_cents + parts_cost_cents
      #   step 4  markup_cents       = vendor_markup(base)        <- tier read off `base`
      #   step 5  storm_surcharge_cents = work_order_storm_surcharge(base + markup_cents)
      #   step 6  total_cents        = base + markup_cents + storm_surcharge_cents
      # Worked ROUTINE: 3.5 h @ 8500 = 29750 labour, 12000 parts -> base 41750,
      #   markup 7515, surcharge 0, total 49265.
      # Worked STORM at IMMINENT (0.35): same base -> markup 7515, pre 49265,
      #   surcharge round_half_up(17242.75) = 17243, total 66508.
    input_set: "the WorkOrder row, its bound Vendor and its StormResponse when pipeline == STORM"
    constants: {}
    precision: "integer cents at every step; no intermediate value is carried as a float into the next step"

  - name: approval_ceiling
    trigger: "POST /property-care/work-orders/{id}/submit"
    algorithm: threshold
    formula: |
      # DISCRIMINATOR: WorkOrder.pipeline
      if WorkOrder.pipeline == "ROUTINE":
          ceiling = Owner.approval_ceiling_override_cents
                    if Owner.approval_ceiling_override_cents is not null
                    else WO_OWNER_APPROVAL_CEILING_CENTS
      else:
          ceiling = STORM_EMERGENCY_APPROVAL_CEILING_CENTS   # the Owner override is IGNORED on the storm pipeline
      approval_required = (WorkOrder.total_cents > ceiling)   # STRICT greater-than
      # Worked: total exactly 50000 with the default ceiling -> approval_required false
      #         total 50001                                   -> approval_required true
    input_set: "the WorkOrder, its Property's Owner"
    constants:
      WO_OWNER_APPROVAL_CEILING_CENTS: 50000
      STORM_EMERGENCY_APPROVAL_CEILING_CENTS: 250000
    precision: "integer cents; the comparison is strict"
    variants:
      - name: ROUTINE_CEILING
        when: "WorkOrder.pipeline == ROUTINE"
        difference: "a per-Owner override may replace the platform default, and the approver must be the Owner role"
      - name: EMERGENCY_CEILING
        when: "WorkOrder.pipeline == STORM"
        difference: "a flat platform ceiling five times larger, the Owner override is structurally not consulted, and the approver is the StormCoordinator role"

  - name: vendor_selection
    trigger: "POST /property-care/work-orders/{id}/dispatch"
    algorithm: weighted_scoring
    formula: |
      required_trade = FINDING_CATEGORY_TRADE_MAP[Finding.category]
      candidates = Vendor rows where
          status == "ELIGIBLE"
          and trade == required_trade
          and coi_expires_at     > clock
          and license_expires_at > clock
          and rating >= VENDOR_MIN_RATING
          and (emergency_capable == true) if WorkOrder.pipeline == "STORM" else True
          and vendor_id not in the exclusion set (vendors who DECLINED an offer on this work order)
          and no KeyIssuance for the vendor has status IN {OVERDUE, LOST}
      RANKING: rating DESC, then hourly_rate_cents ASC, then created_at ASC.
      TIE-BREAK: created_at ASC is the final key; `id` is never consulted.
      EMPTY POOL: no assignment is created, dispatch_attempt_count is NOT
      incremented, the work order stays APPROVED and the request fails with
      ERR_NO_ELIGIBLE_VENDOR (409).
    input_set: "every Vendor row, filtered as above"
    constants:
      VENDOR_MIN_RATING: 3.0
      FINDING_CATEGORY_TRADE_MAP:
        PLUMBING: "PLUMBING"
        HVAC: "HVAC"
        ELECTRICAL: "ELECTRICAL"
        STRUCTURAL: "GENERAL"
        SECURITY: "SECURITY"
        PEST: "GENERAL"
        LANDSCAPE: "LANDSCAPE"
        OTHER: "GENERAL"
    precision: "rating compared at one decimal place"

  - name: key_selection
    trigger: "the VendorAssignment creation inside POST /property-care/work-orders/{id}/dispatch"
    algorithm: weighted_scoring
    formula: |
      candidates = KeyAsset rows where property_id == WorkOrder.property_id
                   and rekey_pending_flag == false
                   and copies_on_hand >= 1
      RANKING: key_type LOCKBOX before PHYSICAL, then created_at ASC.
      TIE-BREAK: created_at ASC; `id` is never consulted.
      EMPTY POOL: no KeyIssuance and no AccessGrant are created and the new
      VendorAssignment is stamped access_blocked_flag = true. The dispatch
      itself still succeeds.
    input_set: "the KeyAsset rows of the work order's property"
    constants: {}
    precision: "not applicable"

  - name: key_return_deadline
    trigger: "KeyIssuance creation"
    algorithm: interval_merge
    formula: |
      window = KEY_RETURN_WINDOW_HOURS_LOCKBOX  if KeyAsset.key_type == "LOCKBOX"
               else KEY_RETURN_WINDOW_HOURS_PHYSICAL
      return_deadline_at = KeyIssuance.issued_at + window hours
    input_set: "the KeyIssuance and its KeyAsset"
    constants:
      KEY_RETURN_WINDOW_HOURS_PHYSICAL: 48
      KEY_RETURN_WINDOW_HOURS_LOCKBOX: 24
    precision: "whole hours"

  - name: key_overdue_days
    trigger: "POST /property-care/key-issuances/{id}/mark-overdue and every read of a KeyIssuance with status == OVERDUE"
    algorithm: threshold
    formula: |
      if clock <= return_deadline_at:
          days = 0
      else:
          days = ceil((clock - return_deadline_at) / 86400)
      # CEILING, not floor: one second past the deadline is already 1 overdue day.
      # The KEY_OVERDUE_GRACE_HOURS window gates the TRANSITION to OVERDUE but
      # is NOT subtracted from this day count.
    input_set: "the KeyIssuance row and the logical clock"
    constants:
      KEY_OVERDUE_GRACE_HOURS: 6
      KEY_LOST_THRESHOLD_DAYS: 7
    precision: "whole days, ceiling"

  - name: rekey_work_order_cost
    trigger: "the LOST -> REKEY_ORDERED transition of KeyIssuance"
    algorithm: aggregation
    formula: |
      estimated_parts_cents  = REKEY_FEE_CENTS
      estimated_labour_hours = 1.0
      # The resulting work order then runs the normal labour_cost / vendor_markup
      # / work_order_total chain, so its total is NOT simply REKEY_FEE_CENTS.
    input_set: "the LOST KeyIssuance and its KeyAsset"
    constants:
      REKEY_FEE_CENTS: 32500
    precision: "integer cents"

  - name: access_grant_capacity
    trigger: "POST /property-care/access-grants/{id}/activate and POST /property-care/key-assets/{id}/access-grants"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval overlap with AGGREGATE capacity — deliberately a
      # different geometry from turnover_overlap_detection.
      concurrent = count of AccessGrant rows on the same key_asset_id, EXCLUDING
                   the candidate grant itself, with
                   status IN {PENDING, ACTIVE}
                   and window_start_at <= candidate.window_end_at
                   and candidate.window_start_at <= window_end_at
      allowed = (concurrent < KeyAsset.copies_total)
      # Touching endpoints DO collide here: a grant ending at 12:00 and one
      # starting at 12:00 are concurrent.
    input_set: "every non-terminal AccessGrant on the same KeyAsset"
    constants: {}
    precision: "instant comparison at millisecond resolution"

  - name: assignment_window_overlap
    trigger: "POST /property-care/vendor-assignments/{id}/accept"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval EXCLUSIVE occupancy on the Vendor resource, no buffer,
      # capacity of exactly one.
      conflict = exists VendorAssignment other where
                 other.vendor_id == this.vendor_id
                 and other.id != this.id
                 and other.status IN {ACCEPTED, WORKING}
                 and other.window_start_at <= this.window_end_at
                 and this.window_start_at  <= other.window_end_at
    input_set: "every ACCEPTED or WORKING VendorAssignment of the same vendor"
    constants: {}
    precision: "instant comparison at millisecond resolution"

  - name: turnover_overlap_detection
    trigger: "POST /property-care/visits, POST /property-care/visits/{id}/reschedule, POST /property-care/visits/{id}/convert-to-turnover"
    algorithm: interval_merge
    formula: |
      pad   = TURNOVER_OVERLAP_BUFFER_MINUTES minutes
      t_lo  = RentalTurnover.checkout_at - pad
      t_hi  = RentalTurnover.checkin_at  + pad
      # HALF-OPEN, STRICT overlap: touching endpoints do NOT collide.
      overlap = (Visit.scheduled_start_at < t_hi) and (Visit.scheduled_end_at > t_lo)
      # A visit ending exactly at t_lo does not overlap; a visit starting
      # exactly at t_hi does not overlap.
    input_set: "every RentalTurnover of the visited property with status NOT IN {CHECKIN, CANCELLED}"
    constants:
      TURNOVER_OVERLAP_BUFFER_MINUTES: 90
    precision: "instant comparison at millisecond resolution"

  - name: turnover_branch_billing
    trigger: "POST /property-care/visits/{id}/defer with defer_reason TURNOVER_OVERLAP, and POST /property-care/visits/{id}/convert-to-turnover"
    algorithm: threshold
    formula: |
      # DISCRIMINATOR: which branch the dispatcher chose for an overlapping visit.
      if branch == "DEFERRED":
          billable_amount_cents = 0
          entitlement_applied   = false
          # the entitlement counter on the open cycle is untouched
      else:  # CONVERTED
          billable_amount_cents = round_half_up(VISIT_BASE_FEE_SCHEDULED_CENTS
                                                * TURNOVER_ABSORPTION_CREDIT_PCT)
          entitlement_applied   = false
          # -> round_half_up(6500 * 0.50) = 3250
    input_set: "the overlapping Visit and the RentalTurnover it collides with"
    constants:
      VISIT_BASE_FEE_SCHEDULED_CENTS: 6500
      TURNOVER_ABSORPTION_CREDIT_PCT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: DEFERRED
        when: "the dispatcher defers the visit"
        difference: "zero money moves and the visit stays re-schedulable; deferral_count increments"
      - name: CONVERTED
        when: "the dispatcher converts the visit into the turnover inspection"
        difference: "a half-rate absorption charge of 3250 is booked and the visit reaches the terminal CONVERTED state; entitlement is untouched in both branches, so the two differ purely in money"

  - name: cadence_projection
    trigger: "POST /property-care/away-periods and PATCH /property-care/away-periods/{id}/cadence"
    algorithm: forward_looking
    formula: |
      if this is the initial projection:
          away_days = floor((end_at - start_at) / 86400)
          projected = floor(away_days / cadence_days)
      else:  # cadence revision mid-period
          anchor        = max(clock, start_at)
          remaining_days = floor((end_at - anchor) / 86400)
          projected      = scheduled_visit_count + floor(remaining_days / new_cadence_days)
      # NON-RETROACTIVE: already-SCHEDULED visits are never cancelled or
      # re-timed by a cadence revision; they are counted into the new projection.
      # Worked: 90-day away period at cadence 14 -> floor(90/14) = 6
      # Worked: after 30 days with 2 visits already scheduled, revised to 7 ->
      #   remaining_days = 60, projected = 2 + floor(60/7) = 2 + 8 = 10
    input_set: "the AwayPeriod row and its Visit children"
    constants:
      CADENCE_MIN_DAYS: 3
      CADENCE_MAX_DAYS: 30
      AWAY_PERIOD_MAX_DAYS: 240
    precision: "whole days, floor at both levels"

  - name: mail_hold_days
    trigger: "POST /property-care/properties/{id}/mail-holds and POST /property-care/mail-holds/{id}/extend"
    algorithm: aggregation
    formula: |
      hold_days = floor((MailHold.end_on - MailHold.start_on) / 86400)
      # Each extension adds MAIL_HOLD_EXTENSION_DAYS to end_on.
      # Rung 66 rejects a create whose hold_days exceeds MAIL_HOLD_MAX_DAYS and
      # an extension whose resulting hold_days exceeds MAIL_HOLD_ABSOLUTE_MAX_DAYS.
    input_set: "the MailHold row"
    constants:
      MAIL_HOLD_MAX_DAYS: 30
      MAIL_HOLD_ABSOLUTE_MAX_DAYS: 60
      MAIL_HOLD_EXTENSION_DAYS: 15
      MAIL_HOLD_MAX_EXTENSIONS: 2
    precision: "whole days, floor"

  - name: mail_disposition_fee
    trigger: "POST /property-care/mail-holds/{id}/forward and POST /property-care/mail-holds/{id}/extend"
    algorithm: tiered_pricing
    formula: |
      # DISCRIMINATOR: the disposition chosen.
      if disposition == "FORWARD":
          fee = MAIL_FORWARD_BASE_CENTS + MAIL_FORWARD_PER_ITEM_CENTS * MailHold.package_count
      else:  # HOLD_EXTENSION
          fee = HOLD_EXTENSION_FEE_CENTS * MailHold.extension_count
      # Worked FORWARD with 6 packages: 1800 + 250*6 = 3300
      # Worked HOLD_EXTENSION after 2 extensions: 900*2 = 1800
      # The two branches read different fields entirely: one is per-package and
      # affine, the other is per-extension and purely multiplicative.
    input_set: "the MailHold row"
    constants:
      MAIL_FORWARD_BASE_CENTS: 1800
      MAIL_FORWARD_PER_ITEM_CENTS: 250
      HOLD_EXTENSION_FEE_CENTS: 900
    precision: "integer cents"
    variants:
      - name: FORWARD
        when: "the hold is forwarded"
        difference: "an affine function of package_count with a fixed base; the fee grows without bound as packages accumulate"
      - name: HOLD_EXTENSION
        when: "the hold is extended in place"
        difference: "a linear function of extension_count with no base; capped at two extensions and therefore at 1800"

  - name: package_overflow_check
    trigger: "POST /property-care/mail-holds/{id}/log-packages"
    algorithm: threshold
    formula: |
      new_count = max(0, MailHold.package_count + package_delta)
      overflow  = (new_count >= PACKAGE_OVERFLOW_THRESHOLD_COUNT)
      # `>=`, so exactly 6 packages is already an overflow.
    input_set: "the MailHold row"
    constants:
      PACKAGE_OVERFLOW_THRESHOLD_COUNT: 6
    precision: "integer count; the floor at 0 prevents a negative package_count"

  - name: false_alarm_sequence
    trigger: "the FALSE_ALARM transitions of SecurityIncident"
    algorithm: chronological
    formula: |
      peers = SecurityIncident rows with the same property_id, status == FALSE_ALARM,
              and reported_at > clock - FALSE_ALARM_WINDOW_DAYS days
      ordered by reported_at ASC, then created_at ASC          # `id` is never consulted
      sequence = 1-based index of this incident inside `peers` after it joins the set
    input_set: "the property's FALSE_ALARM incidents inside a rolling 365-day window"
    constants:
      FALSE_ALARM_WINDOW_DAYS: 365
    precision: "integer index"

  - name: false_alarm_fee
    trigger: "the FALSE_ALARM transitions of SecurityIncident, immediately after false_alarm_sequence"
    algorithm: tiered_pricing
    formula: |
      n = SecurityIncident.false_alarm_sequence
      if   n == 1: fee = FALSE_ALARM_FEE_1_CENTS
      elif n == 2: fee = FALSE_ALARM_FEE_2_CENTS
      elif n == 3: fee = FALSE_ALARM_FEE_3_CENTS
      elif n == 4: fee = FALSE_ALARM_FEE_4_CENTS
      else:        fee = FALSE_ALARM_FEE_5_PLUS_CENTS
      # THIS LADDER IS DELIBERATELY NON-MONOTONE: the municipal schedule drops
      # from 15000 at the third occurrence to 10000 at the fourth (the fourth
      # falls under a different citation class) before jumping to 25000 at the
      # fifth. Interpolating or assuming monotonicity produces the wrong fee.
    input_set: "the reclassified SecurityIncident"
    constants:
      FALSE_ALARM_FEE_1_CENTS: 0
      FALSE_ALARM_FEE_2_CENTS: 5000
      FALSE_ALARM_FEE_3_CENTS: 15000
      FALSE_ALARM_FEE_4_CENTS: 10000
      FALSE_ALARM_FEE_5_PLUS_CENTS: 25000
    precision: "integer cents"

  - name: invoice_line_tax
    trigger: "every mutation that adds, voids or rewrites an InvoiceLine"
    algorithm: aggregation
    formula: |
      tax_cents = round_half_up(amount_cents * TAX_RATE_PCT) if (taxable and status == "ACTIVE") else 0
      # ROUNDING ORDER IS PINNED: PER LINE, then summed by invoice_total.
      # Worked: two ACTIVE taxable lines of 1250 each ->
      #   per-line: round_half_up(87.5) = 88 twice -> 176
      #   sum-then-round would give round_half_up(2500*0.07) = 175.
      # Negative lines round half AWAY FROM ZERO: -1250 -> -88.
    input_set: "the single InvoiceLine row"
    constants:
      TAX_RATE_PCT: 0.07
    precision: "integer cents, round_half_up on the absolute value with the sign preserved"

  - name: invoice_total
    trigger: "every mutation that changes an Invoice's ACTIVE line set, plus POST /property-care/invoices/{id}/issue and POST /property-care/invoices/{id}/resolve-dispute"
    algorithm: waterfall_allocation
    formula: |
      L = ACTIVE InvoiceLine rows of this invoice, walked in ascending sequence_index
      step 1  gross_service_cents = sum(amount_cents for l in L
                 if l.line_type in {SUBSCRIPTION_FEE, VISIT_OVERAGE, TRAVEL_SURCHARGE,
                                    WORK_ORDER, FALSE_ALARM_FEE, MAIL_DISPOSITION, REKEY_FEE})
      step 2  entitlement_offset_cents = sum(amount_cents for l in L
                 if l.line_type == ENTITLEMENT_OFFSET)                       # <= 0
      step 3  net_service = gross_service_cents + entitlement_offset_cents
      step 4  storm_surcharge_cents = round_half_up(net_service * Invoice.storm_surcharge_pct)
              # THE ORDER MATTERS: the surcharge multiplies the NET service,
              # i.e. AFTER the entitlement offset has been subtracted. Applying
              # it to gross_service_cents instead yields a strictly larger total
              # whenever an ENTITLEMENT_OFFSET line exists.
      step 5  guarantee_credit_cents = sum(amount_cents for l in L
                 if l.line_type == GUARANTEE_CREDIT)                         # <= 0
      step 6  subtotal_cents = net_service + storm_surcharge_cents + guarantee_credit_cents
      step 7  tax_cents = sum(l.tax_cents for l in L) + round_half_up(storm_surcharge_cents * TAX_RATE_PCT)
      step 8  late_fee_cents = late_fee(...)          # 0 unless the invoice is delinquent
      step 9  total_cents = subtotal_cents + tax_cents + late_fee_cents
              balance_due_cents = total_cents - amount_paid_cents
    input_set: "the ACTIVE InvoiceLine rows of the invoice; VOID lines are excluded from every step"
    constants:
      TAX_RATE_PCT: 0.07
    precision: "integer cents at every step; step 7 sums already-rounded per-line taxes"

  - name: late_fee
    trigger: "POST /property-care/subscriptions/{id}/mark-delinquent"
    algorithm: threshold
    formula: |
      qualifies = (Invoice.status == "ISSUED"
                   and Invoice.balance_due_cents > 0
                   and Invoice.issued_at + DELINQUENCY_THRESHOLD_DAYS days <= clock)
      late_fee_cents = round_half_up(Invoice.balance_due_cents * LATE_FEE_PCT) if qualifies else 0
      # The threshold is INCLUSIVE: exactly 21 days after issue already qualifies.
      # Worked: balance 85271 at day 21 -> round_half_up(1279.065) = 1279
    input_set: "every ISSUED Invoice on the subscription's cycles"
    constants:
      DELINQUENCY_THRESHOLD_DAYS: 21
      LATE_FEE_PCT: 0.015
    precision: "integer cents, round_half_up"

  - name: invoice_storm_surcharge_pct
    trigger: "POST /property-care/work-orders/{id}/invoice and every subsequent invoice_total run"
    algorithm: aggregation
    formula: |
      pool = ACTIVE InvoiceLine rows with line_type == WORK_ORDER whose WorkOrder
             has pipeline == "STORM"
      Invoice.storm_surcharge_pct = max(WorkOrder.surcharge_pct_applied over pool)
      if pool is empty: Invoice.storm_surcharge_pct = 0.0
      # Single numeric maximum; when two work orders share the maximum the value
      # is identical so no tie-break is observable.
    input_set: "the invoice's ACTIVE WORK_ORDER lines"
    constants: {}
    precision: "two decimal places as a fraction"

  - name: visit_duration_minutes
    trigger: "GET /property-care/visits/{id} for a COMPLETED visit"
    algorithm: aggregation
    formula: |
      duration = floor((Visit.completed_at - Visit.arrived_at) / 60) when both are non-null, else 0
    input_set: "the single Visit row"
    constants: {}
    precision: "whole minutes, floor"

  - name: property_open_critical_findings
    trigger: "every Finding creation, triage, dismissal and work-order transition"
    algorithm: aggregation
    formula: |
      count = number of Finding rows with property_id == Property.id,
              severity == "CRITICAL",
              and status IN {OPEN, TRIAGED, WORK_ORDERED, MONITORING}
    input_set: "every Finding of the property"
    constants: {}
    precision: "integer count"

  - name: vendor_outstanding_keys
    trigger: "every KeyIssuance transition"
    algorithm: aggregation
    formula: |
      count = number of KeyIssuance rows with vendor_id == Vendor.id
              and status IN {ISSUED, OVERDUE}
    input_set: "every KeyIssuance of the vendor"
    constants: {}
    precision: "integer count"

  - name: key_copy_ledger
    trigger: "every KeyIssuance transition"
    algorithm: aggregation
    formula: |
      copies_issued_outstanding = sum(copies_issued for issuances with status IN {ISSUED, OVERDUE})
      copies_lost               = sum(copies_issued for issuances with status IN {LOST, REKEY_ORDERED})
      copies_on_hand            = KeyAsset.copies_total - copies_issued_outstanding - copies_lost
      # copies_on_hand may reach 0 but rung 50 forbids an issuance that would
      # drive it negative.
    input_set: "every KeyIssuance of the key asset"
    constants: {}
    precision: "integer counts"

  - name: subscription_paused_days
    trigger: "POST /property-care/subscriptions/{id}/resume"
    algorithm: chronological
    formula: |
      interval_days = floor((Subscription.resumed_at - Subscription.paused_at) / 86400)
      cumulative_paused_days += max(0, interval_days)
      # Floor per interval and then summed; summing seconds first and flooring
      # once at the end is a different number across multiple pauses.
    input_set: "the closed pause interval just ended"
    constants: {}
    precision: "whole days, floor per interval"

  - name: away_period_derived_status
    trigger: "every read of an AwayPeriod"
    algorithm: projection
    formula: |
      if clock <  AwayPeriod.start_at: status = "PLANNED"
      elif clock < AwayPeriod.end_at:  status = "IN_EFFECT"
      else:                            status = "ENDED"
      # start_at is inclusive, end_at is exclusive.
    input_set: "the AwayPeriod row and the logical clock"
    constants: {}
    precision: "enum"

  - name: storm_response_count
    trigger: "every StormResponse creation and every read of a StormEvent"
    algorithm: aggregation
    formula: |
      count = number of StormResponse rows with storm_event_id == StormEvent.id
    input_set: "every StormResponse of the storm event"
    constants: {}
    precision: "integer count"

  - name: owner_lifetime_credit
    trigger: "every GUARANTEE_CREDIT InvoiceLine creation or void"
    algorithm: aggregation
    formula: |
      total = sum(abs(amount_cents)) over ACTIVE InvoiceLine rows with
              line_type == "GUARANTEE_CREDIT" on invoices whose owner_id == Owner.id
    input_set: "every invoice of the owner"
    constants: {}
    precision: "integer cents"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table
# ONE numbered priority ladder of 68 rungs shared by BOTH pipelines. Rungs are
# evaluated in ascending `priority`; the first failing rung decides the
# response. `gate:` names the gate_precedence band the rung belongs to and the
# ladder never crosses a gate boundary out of order.
# 74 rows over 68 rungs (six rungs carry two rows because the same gate applies
# to two disjoint endpoint families with different error ids).
# ---------------------------------------------------------------------------
validations:
  # ---------------- G1 AUTH ----------------
  - priority: 1
    gate: G1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    gate: G1
    category: auth
    check: "X-User-Role names one of the eight roles declared in section 1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"

  # ---------------- G2 ROLE AND SCOPE ----------------
  - priority: 3
    gate: G2
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    gate: G2
    category: auth
    check: "when the acting role is Owner, X-User-ID equals the owner_id of the Property (or of the Invoice, AwayPeriod, WorkOrder's property) the request targets"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include Owner"
  - priority: 5
    gate: G2
    category: auth
    check: "when the acting role is Vendor, X-User-ID equals VendorAssignment.vendor_id of the targeted assignment"
    error_id: ERR_NOT_ASSIGNED_VENDOR
    http_status: 403
    applies_to: "every /vendor-assignments/{id}/* endpoint and POST /property-care/work-orders/{id}/complete"
  - priority: 6
    gate: G2
    category: auth
    check: "the X-User-ID signing a post-storm assessment differs from StormResponse.swept_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /property-care/storm-responses/{id}/assessments"

  # ---------------- G3 EXISTENCE ----------------
  - priority: 7
    gate: G3
    category: existence
    check: "the first path id resolves to an existing row of its declared entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 8
    gate: G3
    category: existence
    check: "body field owner_id resolves to an existing Owner"
    error_id: ERR_OWNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/properties, POST /property-care/away-periods"
  - priority: 9
    gate: G3
    category: existence
    check: "body field property_id resolves to an existing Property"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/subscriptions, POST /property-care/away-periods, POST /property-care/visits, POST /property-care/storm-events/{id}/responses"
  - priority: 10
    gate: G3
    category: existence
    check: "body field service_plan_id resolves to an existing ServicePlan"
    error_id: ERR_SERVICE_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/subscriptions, POST /property-care/subscriptions/{id}/tier-changes"
  - priority: 11
    gate: G3
    category: existence
    check: "body field checklist_template_id resolves to an existing ChecklistTemplate"
    error_id: ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/visits"
  - priority: 12
    gate: G3
    category: existence
    check: "body field vendor_id resolves to an existing Vendor"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/key-assets/{id}/issuances, POST /property-care/key-assets/{id}/access-grants"
  - priority: 13
    gate: G3
    category: existence
    check: "body field invoice_id (or the invoice targeted by a work-order invoicing call) resolves to an existing Invoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /property-care/work-orders/{id}/invoice, POST /property-care/invoices/{id}/lines"
  - priority: 14
    gate: G3
    category: business_referential
    check: "every optional FK supplied in the body (away_period_id, rental_turnover_id, storm_response_id, key_asset_id, key_issuance_id, visit_id, security_incident_id, mail_hold_id, work_order_id) resolves, in the order the fields are listed in the endpoint's input"
    error_id: ERR_LINKED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  # ---------------- G4 OCC ----------------
  - priority: 15
    gate: G4
    category: state
    check: "expected_finding_version equals Finding.version"
    error_id: ERR_STALE_FINDING_VERSION
    http_status: 412
    applies_to: "POST /property-care/findings/{id}/work-orders"
  - priority: 16
    gate: G4
    category: state
    check: "expected_subscription_version equals Subscription.version"
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /property-care/subscriptions/{id}/tier-changes"
  - priority: 17
    gate: G4
    category: state
    check: "expected_key_asset_version equals KeyAsset.version"
    error_id: ERR_STALE_KEY_ASSET_VERSION
    http_status: 412
    applies_to: "POST /property-care/key-assets/{id}/access-grants, POST /property-care/key-assets/{id}/rotate-code"

  # ---------------- G5 TARGET STATE ----------------
  - priority: 18
    gate: G5
    category: state
    check: "the target entity's current status is a declared `from:` state for the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a section 1.2 transition"
  - priority: 19
    gate: G5
    category: state
    check: "the target entity is not already in a terminal state for its machine"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a section 1.2 transition"
  - priority: 20
    gate: G5
    category: state
    check: "a Visit being completed has departed_at and arrived_at both non-null"
    error_id: ERR_VISIT_NOT_ARRIVED
    http_status: 409
    applies_to: "POST /property-care/visits/{id}/complete"
  - priority: 21
    gate: G5
    category: state
    check: "a Finding being triaged has a parent Visit with status == COMPLETED"
    error_id: ERR_PARENT_VISIT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /property-care/findings/{id}/triage"
  - priority: 22
    gate: G5
    category: state
    check: "a Finding moved MONITORING -> TRIAGED has a later COMPLETED Visit on the same property whose completed_at is strictly greater than Finding.triaged_at"
    error_id: ERR_NO_RECHECK_VISIT
    http_status: 409
    applies_to: "POST /property-care/findings/{id}/triage"
  - priority: 23
    gate: G5
    category: state
    check: "a Finding being dismissed has no WorkOrder whose status is outside {REJECTED, VOID}"
    error_id: ERR_FINDING_HAS_LIVE_WORK_ORDER
    http_status: 409
    applies_to: "POST /property-care/findings/{id}/dismiss"
  - priority: 24
    gate: G5
    category: state
    check: "a Finding moved TRIAGED -> MONITORING has severity IN {LOW, MEDIUM}"
    error_id: ERR_SEVERITY_TOO_HIGH_TO_MONITOR
    http_status: 409
    applies_to: "POST /property-care/findings/{id}/monitor"
  - priority: 25
    gate: G5
    category: state
    check: "a WorkOrder being dispatched has dispatch_attempt_count strictly less than WO_MAX_DISPATCH_ATTEMPTS (3)"
    error_id: ERR_DISPATCH_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch"
  - priority: 26
    gate: G5
    category: state
    check: "a RentalTurnover failing inspection has reclean_attempt_count strictly less than TURNOVER_MAX_RECLEAN_ATTEMPTS (2)"
    error_id: ERR_RECLEAN_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /property-care/rental-turnovers/{id}/fail-inspection"
  - priority: 27
    gate: G5
    category: state
    check: "a MailHold being extended has extension_count strictly less than MAIL_HOLD_MAX_EXTENSIONS (2)"
    error_id: ERR_HOLD_EXTENSIONS_EXHAUSTED
    http_status: 409
    applies_to: "POST /property-care/mail-holds/{id}/extend"
  - priority: 28
    gate: G5
    category: state
    check: "a StormResponse assessment is only accepted while the parent StormEvent has status == ALL_CLEAR"
    error_id: ERR_STORM_NOT_ALL_CLEAR
    http_status: 409
    applies_to: "POST /property-care/storm-responses/{id}/assessments"
  - priority: 29
    gate: G5
    category: state
    check: "a StormEvent being closed has every StormResponse in status IN {ASSESSED, CLOSED}"
    error_id: ERR_STORM_RESPONSES_OPEN
    http_status: 409
    applies_to: "POST /property-care/storm-events/{id}/close"
  - priority: 30
    gate: G5
    category: state
    check: "an Invoice being voided has amount_paid_cents == 0"
    error_id: ERR_INVOICE_ALREADY_PAID
    http_status: 409
    applies_to: "POST /property-care/invoices/{id}/void"
  - priority: 30
    gate: G5
    category: state
    check: "a BillingCycle being closed has no Visit bound to it with status IN {EN_ROUTE, IN_PROGRESS}"
    error_id: ERR_CYCLE_HAS_LIVE_VISIT
    http_status: 409
    applies_to: "POST /property-care/billing-cycles/{id}/close"

  # ---------------- G6 PROPERTY SEASONAL ----------------
  - priority: 31
    gate: G6
    category: business_safety
    check: "a Visit with visit_type == SEASONAL_CLOSE requires Property.seasonal_state == CLOSING"
    error_id: ERR_SEASONAL_STATE_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 32
    gate: G6
    category: business_safety
    check: "a Visit with visit_type == SEASONAL_OPEN requires Property.seasonal_state == OPENING"
    error_id: ERR_SEASONAL_STATE_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 33
    gate: G6
    category: business_safety
    check: "a Visit with visit_type == TURNOVER_INSPECT requires Property.seasonal_state == OPEN"
    error_id: ERR_SEASONAL_STATE_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 34
    gate: G6
    category: business_safety
    check: "beginning a seasonal close requires no RentalTurnover on the property with status IN {CHECKOUT, CLEANING, INSPECTION, READY}"
    error_id: ERR_TURNOVER_IN_FLIGHT
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/seasonal-transitions"
  - priority: 35
    gate: G6
    category: business_safety
    check: "completing winterization requires the property's newest WinterizationRecord to have status == COMPLETE (all four required steps recorded)"
    error_id: ERR_WINTERIZATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/seasonal-transitions"
  - priority: 36
    gate: G6
    category: business_safety
    check: "beginning a spring open requires no KeyIssuance on any KeyAsset of the property with status IN {OVERDUE, LOST}"
    error_id: ERR_KEY_CUSTODY_BLOCKS_OPEN
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/seasonal-transitions"
  - priority: 37
    gate: G6
    category: business_safety
    check: "completing a spring open requires a COMPLETED SEASONAL_OPEN Visit whose completed_at is at or after the newest WinterizationRecord.created_at"
    error_id: ERR_NO_SEASONAL_OPEN_VISIT
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/seasonal-transitions"

  # ---------------- G7 PROPERTY OCCUPANCY ----------------
  - priority: 38
    gate: G7
    category: business_safety
    check: "a Visit with visit_type == ROUTINE_WATCH requires Property.occupancy_state == VACANT"
    error_id: ERR_OCCUPANCY_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 39
    gate: G7
    category: business_safety
    check: "a Visit with visit_type == TURNOVER_INSPECT requires Property.occupancy_state IN {VACANT, CONTRACTOR_ONSITE}"
    error_id: ERR_OCCUPANCY_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 40
    gate: G7
    category: business_safety
    check: "a Visit with visit_type == STORM_SECURE requires Property.occupancy_state != RENTAL_OCCUPIED"
    error_id: ERR_OCCUPANCY_FORBIDS_VISIT
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/depart"
  - priority: 41
    gate: G7
    category: business_safety
    check: "moving occupancy to RENTAL_OCCUPIED requires Property.rental_program_enrolled == true and Property.seasonal_state == OPEN"
    error_id: ERR_RENTAL_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/occupancy-transitions"
  - priority: 42
    gate: G7
    category: business_safety
    check: "moving occupancy to OWNER_IN_RESIDENCE requires Property.seasonal_state IN {OPEN, OPENING}"
    error_id: ERR_SEASONAL_STATE_FORBIDS_OCCUPANCY
    http_status: 409
    applies_to: "POST /property-care/properties/{id}/occupancy-transitions"

  # ---------------- G8 RESOURCE ELIGIBILITY (G8a vendor, then G8b key) ----------------
  - priority: 43
    gate: G8
    category: business_constraint
    check: "G8a: the selected or targeted Vendor has status == ELIGIBLE"
    error_id: ERR_VENDOR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch, POST /property-care/vendor-assignments/{id}/accept"
  - priority: 44
    gate: G8
    category: business_safety
    check: "G8a: the Vendor's coi_expires_at is strictly after the logical clock"
    error_id: ERR_VENDOR_COI_EXPIRED
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch, POST /property-care/vendor-assignments/{id}/accept"
  - priority: 45
    gate: G8
    category: business_safety
    check: "G8a: the Vendor's license_expires_at is strictly after the logical clock"
    error_id: ERR_VENDOR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch, POST /property-care/vendor-assignments/{id}/accept"
  - priority: 46
    gate: G8
    category: business_constraint
    check: "G8a: on the STORM pipeline the selected Vendor has emergency_capable == true"
    error_id: ERR_VENDOR_NOT_EMERGENCY_CAPABLE
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch"
  - priority: 47
    gate: G8
    category: business_constraint
    check: "G8a: calculation vendor_selection returns a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_VENDOR
    http_status: 409
    applies_to: "POST /property-care/work-orders/{id}/dispatch"
  - priority: 48
    gate: G8
    category: business_constraint
    check: "G8a: the accepting Vendor has no other ACCEPTED or WORKING assignment whose closed window overlaps this one per calculation assignment_window_overlap"
    error_id: ERR_VENDOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /property-care/vendor-assignments/{id}/accept"
  - priority: 49
    gate: G8
    category: business_safety
    check: "G8b: the Vendor has no KeyIssuance with status IN {OVERDUE, LOST}"
    error_id: ERR_VENDOR_KEY_OVERDUE
    http_status: 409
    applies_to: "POST /property-care/key-assets/{id}/issuances, POST /property-care/vendor-assignments/{id}/accept"
  - priority: 50
    gate: G8
    category: business_constraint
    check: "G8b: the KeyAsset has copies_on_hand >= the requested copies_issued and rekey_pending_flag == false"
    error_id: ERR_KEY_COPIES_UNAVAILABLE
    http_status: 409
    applies_to: "POST /property-care/key-assets/{id}/issuances"
  - priority: 51
    gate: G8
    category: business_constraint
    check: "G8b: activating an AccessGrant requires the count of ACTIVE grants on the key to be strictly less than KeyAsset.copies_total per calculation access_grant_capacity"
    error_id: ERR_ACCESS_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /property-care/access-grants/{id}/activate"
  - priority: 52
    gate: G8
    category: business_safety
    check: "G8b: activating or using an AccessGrant requires rotation_index_at_grant to equal KeyAsset.code_rotation_count and the logical clock to lie inside the closed window"
    error_id: ERR_ACCESS_GRANT_INVALID
    http_status: 409
    applies_to: "POST /property-care/access-grants/{id}/activate, POST /property-care/vendor-assignments/{id}/start-work"

  # ---------------- G9 ENTITLEMENT ----------------
  - priority: 53
    gate: G9
    category: business_fiscal
    check: "the property has a Subscription with status != CANCELLED"
    error_id: ERR_NO_ACTIVE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/billing-cycles/{id}/invoices"
  - priority: 54
    gate: G9
    category: business_fiscal
    check: "the Property's travel_zone is not OUT_OF_AREA"
    error_id: ERR_PROPERTY_OUT_OF_AREA
    http_status: 409
    applies_to: "POST /property-care/subscriptions/{id}/activate, POST /property-care/visits"
  - priority: 55
    gate: G9
    category: business_fiscal
    check: "a subscription being resumed has a non-null paused_at, and a subscription being paused has an OPEN current cycle"
    error_id: ERR_NO_OPEN_CYCLE
    http_status: 409
    applies_to: "POST /property-care/subscriptions/{id}/pause, POST /property-care/subscriptions/{id}/resume"
  - priority: 56
    gate: G9
    category: business_fiscal
    check: "marking a subscription DELINQUENT requires at least one ISSUED Invoice with balance_due_cents > 0 whose issued_at plus DELINQUENCY_THRESHOLD_DAYS (21) days is at or before the logical clock"
    error_id: ERR_NOT_YET_DELINQUENT
    http_status: 409
    applies_to: "POST /property-care/subscriptions/{id}/mark-delinquent"
  - priority: 57
    gate: G9
    category: business_fiscal
    check: "clearing delinquency requires no ISSUED Invoice on the subscription's cycles with balance_due_cents > 0"
    error_id: ERR_BALANCE_STILL_OUTSTANDING
    http_status: 409
    applies_to: "POST /property-care/subscriptions/{id}/clear-delinquency"
  - priority: 58
    gate: G9
    category: business_fiscal
    check: "issuing an Invoice requires at least one ACTIVE InvoiceLine and a Subscription whose status != CANCELLED"
    error_id: ERR_INVOICE_HAS_NO_LINES
    http_status: 409
    applies_to: "POST /property-care/invoices/{id}/issue"
  - priority: 58
    gate: G9
    category: business_fiscal
    check: "a payment amount_cents is strictly greater than 0 and the invoice is not already PAID"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 409
    applies_to: "POST /property-care/invoices/{id}/pay"

  # ---------------- G10 PAYLOAD (deliberately LAST) ----------------
  - priority: 59
    gate: G10
    category: business_constraint
    check: "every field declared without a trailing question mark in the endpoint's input is present in the body"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 400
    applies_to: "all"
  - priority: 60
    gate: G10
    category: business_constraint
    check: "every supplied field has the declared JSON type"
    error_id: ERR_INVALID_FIELD_TYPE
    http_status: 400
    applies_to: "all"
  - priority: 61
    gate: G10
    category: business_constraint
    check: "every supplied enum-typed field holds a declared member of that enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "every endpoint whose input contains an enum-typed field: visit_type, trigger_source, defer_reason, severity, category, incident_type, key_type, line_type, tier, entitlement_rollover_policy, billing_mode, trade, work_type, damage_level, reopen_reason, notification_preference, to_state, to_status, action, step_code, disposition, revoke_reason. No other field routes to this error id."
  - priority: 62
    gate: G10
    category: business_constraint
    check: "every numeric field lies inside its declared range: travel_distance_miles >= 0, freeze_setpoint_f in [40, 80], rating in [0, 5], cadence_days in [CADENCE_MIN_DAYS (3), CADENCE_MAX_DAYS (30)], copies_total >= 1, copies_issued >= 1, hourly_rate_cents > 0, monthly_fee_cents > 0, included_visit_units >= 0, estimated_labour_hours >= 0, estimated_parts_cents >= 0"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 400
    applies_to: "all"
  - priority: 63
    gate: G10
    category: business_constraint
    check: "completed_item_codes and failed_item_codes are disjoint, every member appears in the bound ChecklistTemplate.item_codes, and their combined length equals ChecklistTemplate.required_item_count"
    error_id: ERR_CHECKLIST_MISMATCH
    http_status: 400
    applies_to: "POST /property-care/visits/{id}/complete"
  - priority: 64
    gate: G10
    category: business_temporal
    check: "every supplied interval is well formed: scheduled_end_at > scheduled_start_at, window_end_at > window_start_at, end_at > start_at, end_on > start_on, checkin_at > checkout_at"
    error_id: ERR_INTERVAL_MALFORMED
    http_status: 400
    applies_to: "every endpoint that accepts an interval"
  - priority: 65
    gate: G10
    category: business_temporal
    check: "a Visit's scheduled window does not overlap any padded RentalTurnover window of the same property per calculation turnover_overlap_detection"
    error_id: ERR_TURNOVER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /property-care/visits, POST /property-care/visits/{id}/reschedule"
  - priority: 66
    gate: G10
    category: business_temporal
    check: "a MailHold create has hold_days <= MAIL_HOLD_MAX_DAYS (30) and an extension keeps hold_days <= MAIL_HOLD_ABSOLUTE_MAX_DAYS (60)"
    error_id: ERR_HOLD_TOO_LONG
    http_status: 400
    applies_to: "POST /property-care/properties/{id}/mail-holds, POST /property-care/mail-holds/{id}/extend"
  - priority: 67
    gate: G10
    category: business_temporal
    check: "an AwayPeriod spans at most AWAY_PERIOD_MAX_DAYS (240) days and its owner_id equals the property's owner_id"
    error_id: ERR_AWAY_PERIOD_INVALID
    http_status: 400
    applies_to: "POST /property-care/away-periods"
  - priority: 67
    gate: G10
    category: business_referential
    check: "the bound ChecklistTemplate.visit_type equals the submitted visit_type and the template's status == ACTIVE"
    error_id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 400
    applies_to: "POST /property-care/visits"
  - priority: 68
    gate: G10
    category: business_constraint
    check: "Owner.email is unique across Owner rows and ServicePlan.covered_visit_types is a non-empty subset of ENTITLEMENT_CONSUMING_VISIT_TYPES"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: "POST /property-care/owners, POST /property-care/service-plans"
  - priority: 68
    gate: G10
    category: business_constraint
    check: "an InvoiceLine with line_type IN {ENTITLEMENT_OFFSET, GUARANTEE_CREDIT} has amount_cents <= 0 and every other line_type has amount_cents >= 0"
    error_id: ERR_LINE_SIGN_INVALID
    http_status: 400
    applies_to: "POST /property-care/invoices/{id}/lines"
  - priority: 68
    gate: G10
    category: business_constraint
    check: "a winterization step_code is a member of WINTERIZATION_REQUIRED_STEPS, WINTERIZATION_OPTIONAL_STEPS or the literal ALL_REQUIRED, and a THERMOSTAT_SET step supplies thermostat_f"
    error_id: ERR_WINTERIZATION_STEP_INVALID
    http_status: 400
    applies_to: "POST /property-care/winterization-records/{id}/steps"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# Every path is prefixed with the api_prefix /property-care. Every endpoint
# declares `gates:` — the applicable subsequence of the gate_precedence total
# order, evaluated in ascending gate number.
# ---------------------------------------------------------------------------
endpoints:
  # ---------------- system / logical clock ----------------
  - method: POST
    path: "/property-care/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly CLOCK_DEFAULT_UTC = 2026-05-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; every subsequent deadline, expiry and window comparison reads the new value"]
    gates: [G1, G2, G10]
  - method: GET
    path: "/property-care/_clock"
    description: "Reads the logical clock."
    roles: [PlatformAdmin, Auditor, AccountManager, Dispatcher, StormCoordinator]
    code: 200
    input: []
    output: "{ current_utc: string }"
    side_effects: []
    gates: [G1, G2]

  # ---------------- Owner ----------------
  - method: POST
    path: "/property-care/owners"
    description: "Registers a homeowner client."
    roles: [PlatformAdmin, AccountManager]
    code: 201
    input: [full_name, email, phone, primary_residence_state, "snowbird_flag?", "notification_preference?", "approval_ceiling_override_cents?"]
    output: Owner
    side_effects: ["status set to ACTIVE", "lifetime_credit_balance_cents set to 0"]
    gates: [G1, G2, G10]
  - method: GET
    path: "/property-care/owners"
    description: "Lists owners."
    roles: [PlatformAdmin, AccountManager, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Owner[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/owners/{id}"
    description: "Reads one owner."
    roles: [PlatformAdmin, AccountManager, Auditor, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []
    gates: [G1, G2, G3]
  - method: PATCH
    path: "/property-care/owners/{id}"
    description: "Updates mutable owner attributes, including the per-owner work-order approval ceiling."
    roles: [PlatformAdmin, AccountManager]
    code: 200
    input: ["phone?", "notification_preference?", "approval_ceiling_override_cents?", "snowbird_flag?"]
    output: Owner
    side_effects: ["increments Owner.version by 1"]
    gates: [G1, G2, G3, G10]

  # ---------------- Property ----------------
  - method: POST
    path: "/property-care/properties"
    description: "Registers a vacation home."
    roles: [PlatformAdmin, AccountManager]
    code: 201
    input: [owner_id, label, address_line, state_code, travel_distance_miles, "freeze_setpoint_f?", "rental_program_enrolled?"]
    output: Property
    side_effects: ["runs calculation travel_zone_assignment", "seasonal_state OPEN, occupancy_state VACANT", "runs calculations freeze_risk_score and property_risk_posture"]
    gates: [G1, G2, G3, G10]
  - method: GET
    path: "/property-care/properties"
    description: "Lists properties, optionally filtered by owner."
    roles: [PlatformAdmin, AccountManager, Dispatcher, FieldTech, StormCoordinator, Auditor, Owner]
    code: 200
    input: ["owner_id?", "state_code?", "seasonal_state?", "occupancy_state?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
    gates: [G1, G2]
  - method: GET
    path: "/property-care/properties/{id}"
    description: "Reads one property, including both state axes and the derived freeze-risk fields."
    roles: [PlatformAdmin, AccountManager, Dispatcher, FieldTech, StormCoordinator, Auditor, Owner, Vendor]
    code: 200
    input: []
    output: Property
    side_effects: []
    gates: [G1, G2, G3]
  - method: PATCH
    path: "/property-care/properties/{id}"
    description: "Updates mutable property attributes."
    roles: [PlatformAdmin, AccountManager, Dispatcher]
    code: 200
    input: ["label?", "travel_distance_miles?", "freeze_setpoint_f?", "rental_program_enrolled?"]
    output: Property
    side_effects: ["re-runs calculation travel_zone_assignment when travel_distance_miles is supplied", "re-runs freeze_risk_score and property_risk_posture", "increments Property.version by 1"]
    gates: [G1, G2, G3, G10]
  - method: POST
