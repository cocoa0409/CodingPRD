      - name: clock_endpoint_pins_the_logical_now_for_every_derived_timestamp
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Program.fields.launched_at
        distinguishing_aspect: "The test-driving clock is authoritative rather than advisory: a LAUNCH executed after the clock is moved to 2026-08-15 stamps launched_at with that instant, proving every temporal gate and system timestamp reads the logical clock and not wall time."
        test_recipe:
          setup:
            - "APPROVED Program ready to launch; clock moved from 2026-08-01 to 2026-08-15 immediately before the launch."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - &k_clock_aug15
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "LAUNCH" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
          assert:
            - "response status == 200"
            - "Program.${pg_id}.status == LAUNCHED"
            - "Program.${pg_id}.launched_at == '2026-08-15T09:30:00Z'"

      - name: statement_action_endpoint_dispatches_on_the_current_status
        claim_type: conditional_action
        grounds:
          - endpoints[POST /remittance-statements/{id}/actions]
        excluded_because:
          difficulty_instance: statement_dispute_branch_rejoins_at_university_approved_before_remit
          rationale: "The conditional dispatch of DISPUTE, RESOLVE, APPROVE and REMIT on one endpoint is walked end to end by the named §1.8 instance."

  - section: rbac
    instances:
      - name: provost_cannot_create_a_program
        claim_type: deny
        grounds:
          - rbac.PartnerAccountLead.exclusive_operations
          - validations[priority 3 ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Program creation is the partner's exclusive operation even though the provost outranks the partner on every approval gate — there is no hierarchical override, so the provost is refused with 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "EXECUTED Partnership with no Programs."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
          trigger:
            - call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
