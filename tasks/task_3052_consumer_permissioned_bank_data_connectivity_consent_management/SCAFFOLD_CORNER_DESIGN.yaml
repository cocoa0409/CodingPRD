              as: Consumer
              as_user_id: cons_x
              captures: { consent_id: $.data.id }
            - call: "POST /institutions/${inst_id}/connections"
              payload: { consumer_ref: "cons_x", consent_id: "${consent_id}", method: "CREDENTIALS" }
              as: Consumer
              as_user_id: cons_x
              captures: { conn_id: $.data.id }
            - call: "POST /consents/${consent_id}/revoke"
              payload: {}
              as: Consumer
