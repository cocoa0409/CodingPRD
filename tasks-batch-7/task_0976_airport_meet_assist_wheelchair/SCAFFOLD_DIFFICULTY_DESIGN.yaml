            - "AssistRequest.${req_id}.billing_status == PAID"
            - "Invoice.${inv_id}.status == PAID"

      - name: agent_status_cycle_active_suspended_active_rejoins_pool
        grounds:
          - state_machines.Agent
          - entities.Agent.fields.status
        distinguishing_aspect: |
          Agent.status is a CYCLE: ACTIVE → SUSPENDED → ACTIVE → … (not a DAG, not a tree).
          The same agent can re-enter the dispatch pool after suspension, demonstrating
          non-linear shape on a different entity than AssistRequest.
        test_recipe:
          setup:
            - "Airport PDX, one agent; agent created ACTIVE"
            - "SUSPEND the agent (with no in-flight assignments)"
            - "REINSTATE the agent"
            - "SUSPEND the agent again — second cycle succeeds"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
