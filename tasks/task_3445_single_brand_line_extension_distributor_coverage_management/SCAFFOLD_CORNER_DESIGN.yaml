        distinguishing_aspect: "net_units is floored at 0: a report with 10 sold and 25 returned stores net_units 0 (never negative), and the resulting 0 attainment flips the distributor to SANCTION with the suspension cascade."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Full launch setup; distributor APPROVED with ACTIVE assignment quota 1200."
          setup_api_calls:
