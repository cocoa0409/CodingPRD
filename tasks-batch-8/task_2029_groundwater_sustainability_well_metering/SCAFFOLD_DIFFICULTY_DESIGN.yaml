# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2029 — Groundwater Sustainability & Well Metering Program
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: forward_available_counts_pending_settled_does_not
        grounds:
          - calculations.available_water_af
          - state_machines.TransferOrder.ACCEPTED_to_SETTLED
          - validations[priority=26]
          - validations[priority=28]
        distinguishing_aspect: |
          Entity domain = WaterUserAccount extraction accounting. On identical account
          data (extracted 40.000, pending 25.000, allocation 100.000), the forward_looking
          variant subtracts the SUBMITTED report (25.000) so a 6.000-af proposal fails,
          while the settled variant used at settlement ignores pending extraction so the
          earlier 30.000-af order settles (deliverable 60.000 >= 30.000).
        test_recipe:
          setup:
            - "Seller account A: base_allocation_af 100.000, ACTIVE, current_water_year 2026 (default clock 2026-08-01)"
            - "Buyer account B: base_allocation_af 50.000, ACTIVE"
            - "A owns ACTIVE PRODUCTION well W"
            - "Report R1 (2026, month 6, 40.000 af) VERIFIED -> extracted_af_ytd 40.000"
            - "Report R2 (2026, month 7, 25.000 af) SUBMITTED -> pending_extraction_af 25.000"
            - "Transfer T1 seller A -> buyer B qty 30.000, window [2026-08-01, 2026-10-01), ACCEPTED"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller A", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_a: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer B", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_b: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_a}", well_type: "PRODUCTION", location_description: "Parcel 1" }
              as: WellOwner
              as_user_id: "${acct_a}"
              captures: { well_a: $.data.id }
            - call: "POST /wells/${well_a}/install-meter"
              payload: { meter_serial: "M-001" }
              as: WellOwner
              as_user_id: "${acct_a}"
            - call: "POST /wells/${well_a}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_a}", water_year: 2026, month: 6, reported_af: 40.000 }
              as: WellOwner
              as_user_id: "${acct_a}"
              captures: { rep_1: $.data.id }
            - call: "POST /extraction-reports/${rep_1}/verify"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_a}", water_year: 2026, month: 7, reported_af: 25.000 }
              as: WellOwner
              as_user_id: "${acct_a}"
              captures: { rep_2: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_a}", buyer_account_id: "${acct_b}", quantity_af: 30.000, unit_price_cents: 12000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_a}"
              captures: { tr_1: $.data.id }
            - call: "POST /transfer-orders/${tr_1}/accept"
              as: WellOwner
              as_user_id: "${acct_b}"
          trigger:
            - call: "POST /transfer-orders/${tr_1}/settle"
              as: WaterMaster
              captures: { tr_1_status: $.data.status }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_a}", buyer_account_id: "${acct_b}", quantity_af: 6.000, unit_price_cents: 12000, effective_start_date: "2026-11-01", effective_end_date: "2027-01-01" }
              as: WellOwner
              as_user_id: "${acct_a}"
              captures: { tr_2_err: $.data.error_id }
            - call: "GET /water-user-accounts/${acct_a}"
              as: WaterMaster
              captures: { a_out: $.data.transfer_out_af_ytd, a_reserved: $.data.transfer_reserved_af }
            - call: "GET /water-user-accounts/${acct_b}"
              as: WaterMaster
              captures: { b_credit: $.data.credit_balance_af }
          assert:
            - "TransferOrder.${tr_1}.status == SETTLED (captured ${tr_1_status} == SETTLED): settled variant delivered 100 - 40 = 60.000 >= 30.000 despite 25.000 pending"
            - "TransferOrder T2 rejected: captured ${tr_2_err} == ERR_INSUFFICIENT_AVAILABLE_WATER because forward variant gives 100 - 40 - 25 - 30 = 5.000 < 6.000"
            - "WaterUserAccount.${acct_a}.transfer_out_af_ytd == 30.000 and .transfer_reserved_af == 0.000"
            - "WaterUserAccount.${acct_b}.credit_balance_af == 30.000"

      - name: basin_condition_official_breach_differs_from_mean
        grounds:
          - calculations.basin_condition_evaluation
          - entities.BasinConditionSnapshot.fields.condition
          - entities.BasinConditionSnapshot.fields.mean_condition
        distinguishing_aspect: |
          Entity domain = basin monitoring (MonitoringReading/BasinConditionSnapshot),
          distinct from the account-extraction domain of the other instance. Identical
          readings (130, 125, 60, 55 ft; thresholds 100) yield condition == CRITICAL
          under the official threshold_breach variant (breach_pct 50.00 >= 50) but
          mean_condition == NORMAL under the rolling_mean variant (mean 92.50 < 100.00).
        test_recipe:
          setup:
            - "Agency account AG (MUNICIPAL) with 4 ACTIVE MONITORING wells, each minimum_threshold_ft 100.0"
            - "Each well has one reading measured 2026-07-15T08:00:00Z (within 90 days of default clock 2026-08-01): depths 130.0, 125.0, 60.0, 55.0"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 125.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
          trigger:
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_id: $.data.id, snap_condition: $.data.condition, snap_mean_condition: $.data.mean_condition, snap_breach_pct: $.data.breach_pct, snap_mean: $.data.rolling_mean_depth_ft }
          assert:
            - "BasinConditionSnapshot.${snap_id}.condition == CRITICAL (captured ${snap_condition}); threshold_breach: 2 of 4 wells breach -> breach_pct == 50.00 >= 50"
            - "BasinConditionSnapshot.${snap_id}.breach_pct == 50.00 (captured ${snap_breach_pct})"
            - "BasinConditionSnapshot.${snap_id}.mean_condition == NORMAL (captured ${snap_mean_condition}); rolling_mean 92.50 < 100.00"
            - "BasinConditionSnapshot.${snap_id}.rolling_mean_depth_ft == 92.50 (captured ${snap_mean})"
            - "condition != mean_condition on identical input data: the two variants diverge"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overdraft_penalty_tiered_marginal_calculation
        grounds:
          - calculations.overdraft_penalty_cents
          - state_machines.ExtractionReport.SUBMITTED_to_VERIFIED
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested min/max over
          overdraft_af vs round3(0.10 * base_allocation_af) tier boundary, tiered rate
          selection (10000 vs 25000 cents/af), conditional basin multiplier. Fixture:
          allocation 200.000, verified extraction 250.000, condition NORMAL ->
          overdraft 50.000, tier1_limit 20.000, amount = (20*10000 + 30*25000) * 1.00
          = 950000 cents exactly.
        test_recipe:
          setup:
            - "Account C: base_allocation_af 200.000, ACTIVE, current_water_year 2026, no credits, no transfers"
            - "C owns ACTIVE PRODUCTION well WC"
            - "No BasinConditionSnapshot published (official condition defaults NORMAL, multiplier 1.00)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper C", account_type: "AGRICULTURAL", base_allocation_af: 200.000 }
              as: WaterMaster
              captures: { acct_c: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_c}", well_type: "PRODUCTION", location_description: "Parcel C" }
              as: WellOwner
              as_user_id: "${acct_c}"
              captures: { well_c: $.data.id }
            - call: "POST /wells/${well_c}/install-meter"
              payload: { meter_serial: "M-C01" }
              as: WellOwner
              as_user_id: "${acct_c}"
            - call: "POST /wells/${well_c}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_c}", water_year: 2026, month: 6, reported_af: 250.000 }
              as: WellOwner
              as_user_id: "${acct_c}"
              captures: { rep_c: $.data.id }
          trigger:
            - call: "POST /extraction-reports/${rep_c}/verify"
              as: WaterMaster
            - call: "GET /penalty-assessments?account_id=${acct_c}"
              as: WaterMaster
              captures: { auto_amount: "$.data[0].amount_cents", auto_overdraft: "$.data[0].overdraft_af", auto_assessed_by: "$.data[0].assessed_by" }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_c}", reason: "OVERDRAFT", water_year: 2026, overdraft_af: 49.999 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { mismatch_err: $.data.error_id }
          assert:
            - "Auto-created PenaltyAssessment.amount_cents == 950000 (captured ${auto_amount}): min(50,20)*10000 + max(0,50-20)*25000 = 200000 + 750000, NORMAL multiplier 1.00"
            - "Auto-created PenaltyAssessment.overdraft_af == 50.000 (captured ${auto_overdraft}) and assessed_by == system (captured ${auto_assessed_by})"
            - "Manual assessment with overdraft_af 49.999 rejected: captured ${mismatch_err} == ERR_OVERDRAFT_AMOUNT_MISMATCH (computed overdraft is 50.000)"

      - name: report_fee_per_report_rounding_order
        grounds:
          - calculations.report_fee_cents
          - calculations.annual_report_aggregates
          - entities.AnnualStateReport.fields.total_pumping_fees_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-report-then-sum.
          Two reports of 1.111 af each under WATCH (multiplier 1.10): per-report fee =
          round_half_up(1.111 * 3000 * 1.10) = round_half_up(3666.3) = 3666 cents; the
          annual total is 3666 + 3666 = 7332 cents. The unpinned alternative (round the
          aggregate: round_half_up(2.222 * 3300) = 7333) differs by exactly 1 cent.
        test_recipe:
          setup:
            - "Agency account AG with 4 ACTIVE MONITORING wells (threshold 100.0) and readings 130/50/55/60 on 2026-07-15 -> breach_pct 25.00 -> WATCH when published"
            - "Snapshot created and PUBLISHED before any report verification (fee multiplier 1.10 in effect)"
            - "Account D: base_allocation_af 100.000 with ACTIVE PRODUCTION well WD"
            - "Reports RD1 (2026, month 6, 1.111 af) and RD2 (2026, month 7, 1.111 af) both VERIFIED under WATCH"
            - "Water year 2026 closed; annual report generated"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 50.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_w: $.data.id }
            - call: "POST /basin-condition-snapshots/${snap_w}/publish"
              as: WaterMaster
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper D", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_d: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_d}", well_type: "PRODUCTION", location_description: "Parcel D" }
              as: WellOwner
              as_user_id: "${acct_d}"
              captures: { well_d: $.data.id }
            - call: "POST /wells/${well_d}/install-meter"
              payload: { meter_serial: "M-D01" }
              as: WellOwner
              as_user_id: "${acct_d}"
            - call: "POST /wells/${well_d}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_d}", water_year: 2026, month: 6, reported_af: 1.111 }
              as: WellOwner
              as_user_id: "${acct_d}"
              captures: { rep_d1: $.data.id }
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_d}", water_year: 2026, month: 7, reported_af: 1.111 }
              as: WellOwner
              as_user_id: "${acct_d}"
              captures: { rep_d2: $.data.id }
            - call: "POST /extraction-reports/${rep_d1}/verify"
              as: WaterMaster
              captures: { fee_d1: $.data.fee_cents }
            - call: "POST /extraction-reports/${rep_d2}/verify"
              as: WaterMaster
              captures: { fee_d2: $.data.fee_cents }
            - call: "POST /admin/close-water-year"
              payload: { water_year: 2026 }
              as: WaterMaster
            - call: "POST /annual-state-reports"
              payload: { water_year: 2026 }
              as: WaterMaster
              captures: { annual_fees: $.data.total_pumping_fees_cents }
          assert:
            - "ExtractionReport.${rep_d1}.fee_cents == 3666 (captured ${fee_d1}): round_half_up(1.111 * 3000 * 1.10) = round_half_up(3666.3)"
            - "ExtractionReport.${rep_d2}.fee_cents == 3666 (captured ${fee_d2}): each report rounded independently"
            - "AnnualStateReport.total_pumping_fees_cents == 7332 (captured ${annual_fees}): sum of per-report rounded fees; an implementation rounding the aggregate would produce 7333"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: extraction_report_dispute_resubmit_cycle
        grounds:
          - state_machines.ExtractionReport.SUBMITTED_to_DISPUTED
          - state_machines.ExtractionReport.DISPUTED_to_SUBMITTED
          - entities.ExtractionReport.fields.amendment_count
        distinguishing_aspect: |
          Cyclic machine on ExtractionReport: SUBMITTED -> DISPUTED -> SUBMITTED is a
          revision loop (amendment_count increments; pending_extraction_af leaves and
          re-enters the pending bucket with the amended value) before terminal VERIFIED.
        test_recipe:
          setup:
            - "Account E: base_allocation_af 100.000, ACTIVE, with ACTIVE PRODUCTION well WE"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper E", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_e: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_e}", well_type: "PRODUCTION", location_description: "Parcel E" }
              as: WellOwner
              as_user_id: "${acct_e}"
              captures: { well_e: $.data.id }
            - call: "POST /wells/${well_e}/install-meter"
              payload: { meter_serial: "M-E01" }
              as: WellOwner
              as_user_id: "${acct_e}"
            - call: "POST /wells/${well_e}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_e}", water_year: 2026, month: 6, reported_af: 10.000 }
              as: WellOwner
              as_user_id: "${acct_e}"
              captures: { rep_e: $.data.id }
          trigger:
            - call: "POST /extraction-reports/${rep_e}/dispute"
              as: WaterMaster
              captures: { st_disputed: $.data.status }
            - call: "GET /water-user-accounts/${acct_e}"
              as: WaterMaster
              captures: { pend_after_dispute: $.data.pending_extraction_af }
            - call: "POST /extraction-reports/${rep_e}/resubmit"
              payload: { reported_af: 12.000 }
              as: WellOwner
              as_user_id: "${acct_e}"
              captures: { st_resub: $.data.status, amend_ct: $.data.amendment_count }
            - call: "POST /extraction-reports/${rep_e}/verify"
              as: WaterMaster
              captures: { st_final: $.data.status }
            - call: "GET /water-user-accounts/${acct_e}"
              as: WaterMaster
              captures: { extracted_final: $.data.extracted_af_ytd, pend_final: $.data.pending_extraction_af }
          assert:
            - "After dispute: status == DISPUTED (captured ${st_disputed}) and account.pending_extraction_af == 0.000 (captured ${pend_after_dispute})"
            - "After resubmit: status == SUBMITTED (captured ${st_resub}) and amendment_count == 1 (captured ${amend_ct})"
            - "After verify: status == VERIFIED (captured ${st_final}); account.extracted_af_ytd == 12.000 and pending_extraction_af == 0.000 (captured ${extracted_final}, ${pend_final}) — the amended value, not the original 10.000, lands in the ledger"

      - name: penalty_appeal_branching_divergent_side_effects
        grounds:
          - state_machines.PenaltyAssessment.APPEALED_to_UPHELD
          - state_machines.PenaltyAssessment.APPEALED_to_OVERTURNED
          - state_machines.PenaltyAssessment.APPEALED_to_REDUCED
        distinguishing_aspect: |
          Branching machine on PenaltyAssessment (a different entity than
          ExtractionReport): the three APPEALED branches have divergent side-effect
          sets — UPHELD leaves penalty_balance_cents unchanged, OVERTURNED refunds the
          full amount_cents, REDUCED refunds (amount_cents - reduced_amount_cents).
          Fixture: three LATE_REPORT assessments of 10000 cents each on one account,
          all appealed, decided one per branch -> final balance 14000.
        test_recipe:
          setup:
            - "Account F (ACTIVE); three LATE_REPORT assessments a1, a2, a3 (water_year 2026), each amount_cents 10000, assessed_by eo-1; penalty_balance_cents == 30000"
            - "All three appealed (within the 30-day window; clock at default 2026-08-01)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper F", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_f: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_f}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_1: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_f}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_2: $.data.id }
            - call: "POST /penalty-assessments"
              payload: { account_id: "${acct_f}", reason: "LATE_REPORT", water_year: 2026 }
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { pa_3: $.data.id }
            - call: "POST /penalty-assessments/${pa_1}/appeal"
              payload: { grounds: "clerical error" }
              as: WellOwner
              as_user_id: "${acct_f}"
            - call: "POST /penalty-assessments/${pa_2}/appeal"
              payload: { grounds: "clerical error" }
              as: WellOwner
              as_user_id: "${acct_f}"
            - call: "POST /penalty-assessments/${pa_3}/appeal"
              payload: { grounds: "clerical error" }
              as: WellOwner
              as_user_id: "${acct_f}"
          trigger:
            - call: "POST /penalty-assessments/${pa_1}/decide"
              payload: { outcome: "UPHELD" }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { st_1: $.data.status }
            - call: "POST /penalty-assessments/${pa_2}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { st_2: $.data.status }
            - call: "POST /penalty-assessments/${pa_3}/decide"
              payload: { outcome: "REDUCED", reduced_amount_cents: 4000 }
              as: AppealsOfficer
              as_user_id: "ao-1"
              captures: { st_3: $.data.status }
            - call: "GET /water-user-accounts/${acct_f}"
              as: WaterMaster
              captures: { bal_final: $.data.penalty_balance_cents }
          assert:
            - "PenaltyAssessment.${pa_1}.status == UPHELD (captured ${st_1}) — balance unchanged by this branch"
            - "PenaltyAssessment.${pa_2}.status == OVERTURNED (captured ${st_2}) — balance refunded full 10000"
            - "PenaltyAssessment.${pa_3}.status == REDUCED (captured ${st_3}) — balance refunded 10000 - 4000 = 6000"
            - "WaterUserAccount.${acct_f}.penalty_balance_cents == 14000 (captured ${bal_final}): 30000 - 0 - 10000 - 6000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: verify_triggers_overdraft_penalty_chain
        grounds:
          - state_machines.ExtractionReport.SUBMITTED_to_VERIFIED
          - calculations.overdraft_penalty_cents
          - entities.WaterUserAccount.fields.penalty_balance_cents
        distinguishing_aspect: |
          Depth-3 cascade originating at the verify transition: (1) verify mutates
          account ledgers (pending -> extracted); (2) the extracted mutation crosses
          the overdraft threshold, which itself (3) auto-creates a PenaltyAssessment,
          whose creation (4) debits account.penalty_balance_cents. Each link is caused
          by the previous one. Fixture: allocation 50.000, verify 60.000 af -> overdraft
          10.000, tier1_limit 5.000, amount 5*10000 + 5*25000 = 175000; a second verify
          while already in overdraft creates NO new assessment (crossing, not level).
        test_recipe:
          setup:
            - "Account G: base_allocation_af 50.000, ACTIVE, with ACTIVE PRODUCTION well WG"
            - "Report RG1 (2026, month 6, 60.000 af) SUBMITTED; report RG2 (2026, month 7, 5.000 af) SUBMITTED"
            - "No snapshot published (NORMAL, multiplier 1.00)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Pumper G", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_g: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_g}", well_type: "PRODUCTION", location_description: "Parcel G" }
              as: WellOwner
              as_user_id: "${acct_g}"
              captures: { well_g: $.data.id }
            - call: "POST /wells/${well_g}/install-meter"
              payload: { meter_serial: "M-G01" }
              as: WellOwner
              as_user_id: "${acct_g}"
            - call: "POST /wells/${well_g}/activate"
              as: WaterMaster
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_g}", water_year: 2026, month: 6, reported_af: 60.000 }
              as: WellOwner
              as_user_id: "${acct_g}"
              captures: { rep_g1: $.data.id }
            - call: "POST /extraction-reports"
              payload: { well_id: "${well_g}", water_year: 2026, month: 7, reported_af: 5.000 }
              as: WellOwner
              as_user_id: "${acct_g}"
              captures: { rep_g2: $.data.id }
          trigger:
            - call: "POST /extraction-reports/${rep_g1}/verify"
              as: WaterMaster
            - call: "GET /penalty-assessments?account_id=${acct_g}"
              as: WaterMaster
              captures: { auto_amount: "$.data[0].amount_cents", auto_reason: "$.data[0].reason", auto_assessed_by: "$.data[0].assessed_by" }
            - call: "GET /water-user-accounts/${acct_g}"
              as: WaterMaster
              captures: { g_extracted: $.data.extracted_af_ytd, g_penalty_bal: $.data.penalty_balance_cents }
            - call: "POST /extraction-reports/${rep_g2}/verify"
              as: WaterMaster
            - call: "GET /penalty-assessments?account_id=${acct_g}"
              as: WaterMaster
              captures: { first_amount_after: "$.data[0].amount_cents" }
          assert:
            - "After first verify: account.extracted_af_ytd == 60.000 (captured ${g_extracted}) — link 1"
            - "Exactly one auto PenaltyAssessment exists: GET list has exactly 1 item; [0].reason == OVERDRAFT (captured ${auto_reason}), assessed_by == system (captured ${auto_assessed_by}), amount_cents == 175000 (captured ${auto_amount}) — links 2 and 3"
            - "account.penalty_balance_cents == 175000 (captured ${g_penalty_bal}) — link 4 (the assessment creation itself debited the ledger)"
            - "Second verify (extracted 65.000, still overdrawn): no new crossing, so the list still has exactly 1 item (total_count == 1) whose amount_cents is still 175000 (captured ${first_amount_after})"

      - name: critical_publish_expires_proposals_releases_reserves
        grounds:
          - state_machines.BasinConditionSnapshot.DRAFT_to_PUBLISHED
          - state_machines.TransferOrder.PROPOSED_to_EXPIRED
          - entities.WaterUserAccount.fields.transfer_reserved_af
        distinguishing_aspect: |
          Depth-2 cascade originating at the publish transition (a different trigger
          than verify): (1) publishing a CRITICAL snapshot moves every PROPOSED
          TransferOrder to EXPIRED; (2) each expiry itself releases the seller
          reservation (transfer_reserved_af -= quantity_af). Conditional cascade:
          fires only when the newly published condition is CRITICAL.
        test_recipe:
          setup:
            - "Agency account AG with 4 ACTIVE MONITORING wells (threshold 100.0) and readings 130/125/60/55 on 2026-07-15 -> CRITICAL when published"
            - "Seller account GS: base_allocation_af 100.000; buyer account GB: 50.000"
            - "Transfer TG seller GS -> buyer GB qty 20.000, window [2026-08-01, 2026-10-01), PROPOSED; GS.transfer_reserved_af == 20.000"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 125.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller GS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_gs: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer GB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_gb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_gs}", buyer_account_id: "${acct_gb}", quantity_af: 20.000, unit_price_cents: 11000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_gs}"
              captures: { tr_g: $.data.id }
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_c: $.data.id }
          trigger:
            - call: "POST /basin-condition-snapshots/${snap_c}/publish"
              as: WaterMaster
              captures: { pub_condition: $.data.condition }
            - call: "GET /transfer-orders/${tr_g}"
              as: WaterMaster
              captures: { tr_g_status: $.data.status }
            - call: "GET /water-user-accounts/${acct_gs}"
              as: WaterMaster
              captures: { gs_reserved: $.data.transfer_reserved_af }
          assert:
            - "BasinConditionSnapshot.${snap_c}.condition == CRITICAL (captured ${pub_condition})"
            - "TransferOrder.${tr_g}.status == EXPIRED (captured ${tr_g_status}) — link 1: publish expired the PROPOSED order"
            - "WaterUserAccount.${acct_gs}.transfer_reserved_af == 0.000 (captured ${gs_reserved}) — link 2: the expiry itself released the 20.000-af reservation"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_proposed_under_critical_state_beats_safety
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - state_machines.TransferOrder.ACCEPTED_to_SETTLED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: settling a transfer that is
          still PROPOSED while the basin is CRITICAL violates both rule 10
          (ERR_INVALID_TRANSFER_STATE) and rule 14
          (ERR_BASIN_CRITICAL_TRANSFERS_SUSPENDED); the higher-priority state error
          must win.
        test_recipe:
          setup:
            - "Agency account AG with 4 ACTIVE MONITORING wells (threshold 100.0), readings 130/125/60/55 on 2026-07-15, snapshot created and PUBLISHED -> official condition CRITICAL"
            - "Seller HS (allocation 100.000) and buyer HB (50.000), both ACTIVE"
            - "Transfer TH proposed AFTER the CRITICAL publish (proposals remain allowed; only settlement is suspended): status PROPOSED"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-1", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_1: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-2", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_2: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-3", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_3: $.data.id }
            - call: "POST /wells"
              payload: { account_id: "${acct_ag}", well_type: "MONITORING", location_description: "MW-4", minimum_threshold_ft: 100.0 }
              as: WellOwner
              as_user_id: "${acct_ag}"
              captures: { mw_4: $.data.id }
            - call: "POST /wells/${mw_1}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_2}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_3}/activate"
              as: WaterMaster
            - call: "POST /wells/${mw_4}/activate"
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_1}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 130.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_2}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 125.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_3}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 60.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /monitoring-readings"
              payload: { well_id: "${mw_4}", measured_at: "2026-07-15T08:00:00Z", depth_to_water_ft: 55.0, collector_name: "Field Tech" }
              as: WaterMaster
            - call: "POST /basin-condition-snapshots"
              as: WaterMaster
              captures: { snap_c: $.data.id }
            - call: "POST /basin-condition-snapshots/${snap_c}/publish"
              as: WaterMaster
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller HS", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_hs: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer HB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_hb: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_hs}", buyer_account_id: "${acct_hb}", quantity_af: 10.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_hs}"
              captures: { tr_h: $.data.id }
          trigger:
            - call: "POST /transfer-orders/${tr_h}/settle"
              as: WaterMaster
              captures: { settle_err: $.data.error_id }
          assert:
            - "captured ${settle_err} == ERR_INVALID_TRANSFER_STATE: the state precondition (priority 10) beats the basin-safety suspension (priority 14) even though both are violated"

      - name: proposal_overlap_plus_insufficient_constraint_beats_fiscal
        grounds:
          - validations[priority=20]
          - validations[priority=26]
          - calculations.available_water_af
        distinguishing_aspect: |
          Error-category pair business_constraint vs business_fiscal (different pair
          than the other instance): a proposal whose window overlaps the buyer's
          existing inbound window AND whose quantity exceeds the seller's
          forward-looking available water must fail with ERR_TRANSFER_WINDOW_OVERLAP
          (priority 20), not ERR_INSUFFICIENT_AVAILABLE_WATER (priority 26).
        test_recipe:
          setup:
            - "Seller IS-1: allocation 100.000; buyer IB: allocation 50.000; transfer T0 IS-1 -> IB qty 5.000 window [2026-08-01, 2026-10-01) PROPOSED"
            - "Seller IS-2: allocation 10.000 (forward-looking available 10.000)"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller IS-1", account_type: "AGRICULTURAL", base_allocation_af: 100.000 }
              as: WaterMaster
              captures: { acct_s1: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Buyer IB", account_type: "AGRICULTURAL", base_allocation_af: 50.000 }
              as: WaterMaster
              captures: { acct_ib: $.data.id }
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Seller IS-2", account_type: "AGRICULTURAL", base_allocation_af: 10.000 }
              as: WaterMaster
              captures: { acct_s2: $.data.id }
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_s1}", buyer_account_id: "${acct_ib}", quantity_af: 5.000, unit_price_cents: 9000, effective_start_date: "2026-08-01", effective_end_date: "2026-10-01" }
              as: WellOwner
              as_user_id: "${acct_s1}"
              captures: { tr_0: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { seller_account_id: "${acct_s2}", buyer_account_id: "${acct_ib}", quantity_af: 20.000, unit_price_cents: 9000, effective_start_date: "2026-09-01", effective_end_date: "2026-11-01" }
              as: WellOwner
              as_user_id: "${acct_s2}"
              captures: { overlap_err: $.data.error_id }
          assert:
            - "captured ${overlap_err} == ERR_TRANSFER_WINDOW_OVERLAP: the buyer-window constraint (priority 20) beats seller fiscal sufficiency (priority 26) even though quantity 20.000 also exceeds seller available 10.000"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: breach_pct_exactly_25_yields_watch
        grounds:
          - calculations.basin_condition_evaluation
          - entities.BasinConditionSnapshot.fields.breach_pct
        distinguishing_aspect: |
          Metric = breach percentage; endpoint = POST /basin-condition-snapshots.
          Exactly 25.00% of eligible wells breaching must yield WATCH (>= 25, not > 25):
          1 of 4 wells over threshold. One well fewer would give 0.00 -> NORMAL.
        test_recipe:
          setup:
            - "Agency account AG with 4 ACTIVE MONITORING wells, each minimum_threshold_ft 100.0"
            - "Readings on 2026-07-15: 130.0 (breach), 50.0, 55.0, 60.0 (no breach) -> exactly 1 of 4"
          setup_api_calls:
            - call: "POST /water-user-accounts"
              payload: { holder_name: "Agency Monitor", account_type: "MUNICIPAL", base_allocation_af: 1000.000 }
              as: WaterMaster
              captures: { acct_ag: $.data.id }
            - call: "POST /wells"
