            - "Minutes.${mn}.content_hash == 34c66333240fcd2100d8b552e0bd9f2889acf2e762865afb0601ae651a4a2a84   # SHA-256 of 'draft v2 corrected'"

      - name: package_seal_unseal_cycle
        grounds:
          - state_machines.BoardPackage.ASSEMBLING_to_SEALED
          - state_machines.BoardPackage.SEALED_to_ASSEMBLING
