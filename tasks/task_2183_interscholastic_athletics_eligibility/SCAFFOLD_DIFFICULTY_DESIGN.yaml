          - validations[priority=57]
          - errors[ERR_OFFICIAL_DOUBLE_BOOKED]
          - entities.OfficialAssignment.fields.official_id
        distinguishing_aspect: |
          The occupied resource is the Official, and the interval semantics are half-open windows
          expanded by a SYMMETRIC 90-minute travel buffer on both ends, so a second game whose
          buffered window begins exactly when the first buffered window ends (21:30Z touching 21:30Z)
          is ADMITTED, while shifting that game one minute earlier produces a positive-measure
          intersection and is rejected.
