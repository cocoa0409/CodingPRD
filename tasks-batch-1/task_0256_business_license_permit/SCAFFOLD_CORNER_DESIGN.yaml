      - name: stale_version_on_transfer_complete_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[transfer-complete-stale-license]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / transfer_approve_requires_license_active
          rationale: "OCC stale-version is its own dedicated corner below (occ_stale_license_version_on_complete); the active-license dependency is covered in §1.8."

      - name: occ_stale_license_version_on_complete
        claim_type: violation_to_error
        grounds: ["concurrency_rules[transfer-complete-stale-license]", "validations[priority=14]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: |
          A transfer is APPROVED at License version V; the license is then renewed (version advances to
          V+1); completing the transfer with expected_license_version = the stale V -> ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["ACTIVE license, transfer APPROVED while license at version V; a renewal then bumps version so the held V is stale."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "OCC_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
