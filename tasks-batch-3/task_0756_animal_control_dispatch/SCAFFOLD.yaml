# =============================================================================
# PRD Benchmark Scaffold — Animal-Control & Field-Services Dispatch
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  Animal-Control & Field-Services Dispatch: complaint/call intake & priority,
  officer dispatch & route/territory, case (stray/bite/cruelty/dangerous-dog) &
  investigation, quarantine/hold & impound link, citation & court referral,
  rabies/bite-report to health dept, field outcome, reporting

domain_name: animal-control-dispatch
api_prefix: /dispatch

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer resources linked by foreign keys in request bodies (no ownership nesting
  # in URL paths). All collections live under the /dispatch namespace prefix.

  state_machine_shape: branching
  # Case is cyclic (investigation can reopen); QuarantineHold / Citation / Impound /
  # RabiesReport branch to divergent terminal states with different side-effect sets.

  relationship_patterns:
    - one_to_many          # Case -> InvestigationNote, Case -> Citation, Case -> Impound
    - cross_aggregate      # RabiesReport references both Case and QuarantineHold; Impound references Case and Kennel

  role_model: peer_roles
  # Dispatcher, FieldOfficer, HealthDeptLiaison own different resource types;
  # Supervisor holds administrative/override operations.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Complaint
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: reporter_name, type: string, source: input, description: "Name of the person filing the complaint/call" }
      - { name: reporter_phone, type: string, source: input, description: "Callback phone number" }
      - { name: zone, type: enum, source: input, description: "Territory zone of the incident", constraints: "one of NORTH, SOUTH, EAST, WEST, CENTRAL" }
      - { name: animal_type, type: enum, source: input, description: "Animal involved", constraints: "one of DOG, CAT, WILDLIFE, LIVESTOCK, OTHER" }
      - { name: complaint_type, type: enum, source: input, description: "Nature of the complaint", constraints: "one of STRAY, BITE, CRUELTY, DANGEROUS_DOG, NOISE, OTHER" }
      - { name: involves_vulnerable_victim, type: boolean, source: input, default: false, description: "True if a minor or elderly person is involved (raises priority)" }
      - { name: description, type: string, source: input, required: false, description: "Free-text detail" }
      - { name: severity_score, type: number, source: computed, description: "Computed intake priority score (see calculations.complaint_priority_score)" }
      - { name: priority, type: enum, source: computed, description: "P1|P2|P3 derived from severity_score", constraints: "one of P1, P2, P3" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of NEW, DISPATCHED, RESOLVED, CLOSED" }

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Officer full name" }
      - { name: badge_number, type: string, source: input, description: "Badge identifier" }
      - { name: territory_zone, type: enum, source: input, description: "Primary assigned zone", constraints: "one of NORTH, SOUTH, EAST, WEST, CENTRAL" }
      - { name: shift_start_at, type: datetime, source: input, description: "On-duty window start (ISO 8601 UTC)" }
      - { name: shift_end_at, type: datetime, source: input, description: "On-duty window end (ISO 8601 UTC)" }
      - { name: max_daily_dispatches, type: integer, source: input, default: 8, description: "Maximum number of active (PENDING/EN_ROUTE) dispatches the officer may hold at once" }
      - { name: active_dispatch_count, type: integer, source: computed, default: 0, description: "Count of this officer's Dispatch rows in status PENDING or EN_ROUTE (conserved by dispatch create/clear)" }

  - name: Kennel
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Kennel/run code" }
      - { name: facility_zone, type: enum, source: input, description: "Facility zone", constraints: "one of NORTH, SOUTH, EAST, WEST, CENTRAL" }
      - { name: occupied_slots, type: integer, source: computed, default: 0, description: "Count of Impound rows in this kennel with status HELD (conserved by impound create/release)" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; the call being serviced" }
      - { name: officer_id, type: string, source: input, description: "FK -> Officer.id; assigned field officer" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned service-window start (ISO 8601 UTC)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned service-window end (ISO 8601 UTC)" }
      - { name: eta_minutes, type: integer, source: input, required: false, description: "Estimated minutes to scene" }
      - { name: field_outcome, type: enum, source: input, description: "Outcome recorded on clear", constraints: "one of RESOLVED_ON_SCENE, ANIMAL_IMPOUNDED, CASE_OPENED, GONE_ON_ARRIVAL, REFERRED (set only on clear)" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of PENDING, EN_ROUTE, CLEARED" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; originating call" }
      - { name: assigned_officer_id, type: string, source: input, description: "FK -> Officer.id; investigating officer" }
      - { name: case_type, type: enum, source: input, description: "Case classification", constraints: "one of STRAY, BITE, CRUELTY, DANGEROUS_DOG" }
      - { name: animal_identifier, type: string, source: input, required: false, description: "Tag/microchip/description of the animal" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Case risk score (dual-variant provisional/final; see calculations.case_risk_score)" }
      - { name: outstanding_fines_total, type: number, source: computed, default: 0, description: "Sum of fine_amount over this case's Citations in status ISSUED (conserved by citation issue/pay/refer)" }
      - { name: public_health_flag, type: boolean, source: computed, default: false, description: "Set true when a linked RabiesReport is escalated to the health dept" }
      - { name: substantiated_at, type: datetime, source: system, required: false, description: "Logical-clock time at which the case was resolved SUBSTANTIATED" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of OPEN, UNDER_INVESTIGATION, SUBSTANTIATED, UNFOUNDED, CLOSED" }

  - name: InvestigationNote
    parent: Case
    common_fields: false          # append-only log: id + created_at only, immutable
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; set from the URL path" }
      - { name: note_type, type: enum, source: input, description: "Kind of note", constraints: "one of OBSERVATION, EVIDENCE, WITNESS, FOLLOWUP" }
      - { name: body, type: string, source: input, description: "Note text" }
      - { name: author_role, type: string, source: system, description: "X-User-Role of the author (opaque audit value, not an FK)" }
      - { name: author_id, type: string, source: system, description: "X-User-ID of the author (opaque audit value, not an FK)" }

  - name: QuarantineHold
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the bite/dangerous-dog case" }
      - { name: animal_identifier, type: string, source: input, required: false, description: "Animal under observation" }
      - { name: hold_type, type: enum, source: input, description: "Where the animal is held", constraints: "one of HOME_QUARANTINE, FACILITY_QUARANTINE" }
      - { name: start_at, type: datetime, source: input, description: "Observation start (ISO 8601 UTC)" }
      - { name: required_days, type: integer, source: computed, description: "Observation length: 10 for BITE, 14 for DANGEROUS_DOG (see calculations.quarantine_release_due)" }
      - { name: release_due_at, type: datetime, source: computed, description: "= start_at + required_days days" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of ACTIVE, RELEASED, ESCALATED, VOIDED" }

  - name: Impound
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case the animal belongs to" }
      - { name: kennel_id, type: string, source: input, description: "FK -> Kennel.id; physical run occupied" }
      - { name: animal_identifier, type: string, source: input, required: false, description: "Impounded animal identifier" }
      - { name: licensed, type: boolean, source: input, default: false, description: "Whether the animal is licensed (affects boarding surcharge)" }
      - { name: impounded_at, type: datetime, source: input, description: "Occupancy window start (ISO 8601 UTC)" }
      - { name: hold_until, type: datetime, source: input, description: "Occupancy window end used for kennel overlap detection (ISO 8601 UTC)" }
      - { name: boarding_fee, type: number, source: computed, default: 0, description: "Boarding fee computed on release (see calculations.impound_boarding_fee)" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of HELD, REDEEMED, ADOPTED, EUTHANIZED, RELEASED" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case that produced the violation" }
      - { name: violation_code, type: enum, source: input, description: "Violation cited", constraints: "one of UNLICENSED, LEASH, DANGEROUS, BITE, CRUELTY" }
      - { name: issued_to_name, type: string, source: input, description: "Name of the cited party" }
      - { name: issued_to_ref, type: string, source: input, description: "Stable owner reference used to detect repeat offenders" }
      - { name: base_fine, type: number, source: computed, description: "Base fine for the violation_code" }
      - { name: fine_amount, type: number, source: computed, description: "Final fine after repeat-offender escalation (dual-variant; see calculations.citation_fine)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time of issuance" }
      - { name: due_at, type: datetime, source: computed, description: "= issued_at + 30 days" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of ISSUED, PAID, COURT_REFERRED" }

  - name: RabiesReport
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; bite/dangerous-dog case" }
      - { name: quarantine_hold_id, type: string, source: input, description: "FK -> QuarantineHold.id; the observation hold this report covers" }
      - { name: animal_identifier, type: string, source: input, required: false, description: "Animal identifier" }
      - { name: victim_name, type: string, source: input, description: "Bite victim name" }
      - { name: exposure_date, type: datetime, source: input, description: "Date of exposure/bite (ISO 8601 UTC)" }
      - { name: deadline_at, type: datetime, source: computed, description: "= exposure_date + 24 hours; reporting deadline to the health dept" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock time at which the report was submitted" }
      - { name: is_late, type: boolean, source: computed, description: "True iff submitted_at > deadline_at" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of SUBMITTED, CLEARED, ESCALATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Complaint
    initial_state: NEW
    terminal_states: [CLOSED]
    transitions:
      - from: NEW
        to: DISPATCHED
        trigger: "POST /dispatch/dispatches (a Dispatch is assigned to this complaint)"
        actor: system
        preconditions: ["Complaint.status == NEW"]
        side_effects:
          - "increments Complaint.version by 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /dispatch/dispatches/{id}/clear (the servicing dispatch is cleared)"
        actor: system
        preconditions: ["the clearing Dispatch.complaint_id == this Complaint.id"]
        side_effects:
          - "increments Complaint.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /dispatch/cases/{id}/close (cascade from case closure)"
        actor: system
        preconditions: []
        side_effects: ["increments Complaint.version by 1"]
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /dispatch/cases/{id}/close (cascade from case closure)"
        actor: system
        preconditions: []
        side_effects: ["increments Complaint.version by 1"]

  - entity: Dispatch
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: EN_ROUTE
        trigger: "POST /dispatch/dispatches/{id}/accept"
        actor: FieldOfficer
        preconditions:
          - "Dispatch.status == PENDING"
          - "acting FieldOfficer's X-User-ID == Dispatch.officer_id (ERR_NOT_ASSIGNED_OFFICER)"
        side_effects: []
      - from: EN_ROUTE
        to: CLEARED
        trigger: "POST /dispatch/dispatches/{id}/clear"
        actor: FieldOfficer
        preconditions:
          - "Dispatch.status == EN_ROUTE"
          - "acting FieldOfficer's X-User-ID == Dispatch.officer_id (ERR_NOT_ASSIGNED_OFFICER)"
        side_effects:
          - "sets Dispatch.field_outcome from request"
          - "Officer.active_dispatch_count -= 1 (this dispatch leaves the active set)"
          - "linked Complaint (Dispatch.complaint_id) transitions DISPATCHED -> RESOLVED"

  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /dispatch/cases/{id}/investigate"
        actor: FieldOfficer
        preconditions:
          - "Case.status == OPEN"
          - "acting FieldOfficer's X-User-ID == Case.assigned_officer_id (Supervisor exempt) (ERR_NOT_ASSIGNED_OFFICER)"
        side_effects:
          - "sets Case.risk_score = provisional variant (calculations.case_risk_score)"
      - from: SUBSTANTIATED
        to: UNDER_INVESTIGATION
        trigger: "POST /dispatch/cases/{id}/investigate (reopen a substantiated case)"
        actor: Supervisor
        preconditions:
          - "Case.status == SUBSTANTIATED"
        note: "Cyclic: a substantiated case may be reopened for further investigation."
        side_effects:
          - "clears Case.substantiated_at (set back to null)"
          - "sets Case.risk_score = provisional variant"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /dispatch/cases/{id}/resolve (resolution=SUBSTANTIATED)"
        actor: FieldOfficer
        preconditions:
          - "Case.status == UNDER_INVESTIGATION"
          - "acting FieldOfficer's X-User-ID == Case.assigned_officer_id (Supervisor exempt)"
        side_effects:
          - "sets Case.substantiated_at = current logical clock"
          - "sets Case.risk_score = final variant (calculations.case_risk_score), +20 substantiation weight, clamped to [0,100]"
      - from: UNDER_INVESTIGATION
        to: UNFOUNDED
        trigger: "POST /dispatch/cases/{id}/resolve (resolution=UNFOUNDED)"
        actor: FieldOfficer
        preconditions:
          - "Case.status == UNDER_INVESTIGATION"
          - "acting FieldOfficer's X-User-ID == Case.assigned_officer_id (Supervisor exempt)"
        side_effects:
          - "sets Case.risk_score = 0"
          - "each ACTIVE QuarantineHold with case_id == Case.id transitions ACTIVE -> VOIDED (cascade)"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /dispatch/cases/{id}/close"
        actor: Supervisor
        preconditions:
          - "Case.status IN {SUBSTANTIATED, UNFOUNDED}"
          - "no QuarantineHold with case_id == Case.id in status ACTIVE (ERR_ACTIVE_QUARANTINE_HOLD)"
          - "no Impound with case_id == Case.id in status HELD (ERR_ACTIVE_IMPOUND)"
          - "no Citation with case_id == Case.id in status ISSUED (ERR_OUTSTANDING_CITATIONS)"
        side_effects:
          - "linked Complaint (Case.complaint_id) transitions DISPATCHED|RESOLVED -> CLOSED (cascade)"
      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /dispatch/cases/{id}/close"
        actor: Supervisor
        preconditions:
          - "Case.status IN {SUBSTANTIATED, UNFOUNDED}"
          - "no QuarantineHold with case_id == Case.id in status ACTIVE (ERR_ACTIVE_QUARANTINE_HOLD)"
          - "no Impound with case_id == Case.id in status HELD (ERR_ACTIVE_IMPOUND)"
          - "no Citation with case_id == Case.id in status ISSUED (ERR_OUTSTANDING_CITATIONS)"
        side_effects:
          - "linked Complaint (Case.complaint_id) transitions DISPATCHED|RESOLVED -> CLOSED (cascade)"

  - entity: QuarantineHold
    initial_state: ACTIVE
    terminal_states: [RELEASED, ESCALATED, VOIDED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /dispatch/quarantine-holds/{id}/release"
        actor: FieldOfficer
        preconditions:
          - "QuarantineHold.status == ACTIVE"
          - "current logical clock >= QuarantineHold.release_due_at (ERR_QUARANTINE_NOT_ELAPSED)"
        side_effects: []
      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /dispatch/quarantine-holds/{id}/escalate (animal symptomatic)"
        actor: Supervisor
        preconditions:
          - "QuarantineHold.status == ACTIVE"
        side_effects:
          - "each Impound with case_id == QuarantineHold.case_id in status HELD transitions HELD -> EUTHANIZED (cascade hop 1)"
      - from: ACTIVE
        to: VOIDED
        trigger: "system (cascade from Case UNFOUNDED resolution)"
        actor: system
        preconditions:
          - "QuarantineHold.status == ACTIVE"
        side_effects:
          - "each RabiesReport with quarantine_hold_id == QuarantineHold.id in status SUBMITTED transitions SUBMITTED -> CLEARED (cascade hop 2)"

  - entity: Impound
    initial_state: HELD
    terminal_states: [REDEEMED, ADOPTED, EUTHANIZED, RELEASED]
    transitions:
      - from: HELD
        to: REDEEMED
        trigger: "POST /dispatch/impounds/{id}/release (disposition=REDEEMED)"
        actor: FieldOfficer
        preconditions: ["Impound.status == HELD"]
        side_effects:
          - "sets Impound.boarding_fee (calculations.impound_boarding_fee)"
          - "Kennel.occupied_slots -= 1"
      - from: HELD
        to: ADOPTED
        trigger: "POST /dispatch/impounds/{id}/release (disposition=ADOPTED)"
        actor: FieldOfficer
        preconditions: ["Impound.status == HELD"]
        side_effects:
          - "sets Impound.boarding_fee (calculations.impound_boarding_fee)"
          - "Kennel.occupied_slots -= 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /dispatch/impounds/{id}/release (disposition=RELEASED)"
        actor: FieldOfficer
        preconditions: ["Impound.status == HELD"]
        side_effects:
          - "sets Impound.boarding_fee (calculations.impound_boarding_fee)"
          - "Kennel.occupied_slots -= 1"
      - from: HELD
        to: EUTHANIZED
        trigger: "POST /dispatch/impounds/{id}/release (disposition=EUTHANIZED)"
        actor: FieldOfficer
        preconditions: ["Impound.status == HELD"]
        side_effects:
          - "sets Impound.boarding_fee (calculations.impound_boarding_fee)"
          - "Kennel.occupied_slots -= 1"
      - from: HELD
        to: EUTHANIZED
        trigger: "system (cascade from QuarantineHold escalation)"
        actor: system
        preconditions: ["Impound.status == HELD"]
        side_effects:
          - "Kennel.occupied_slots -= 1"
          - "each RabiesReport with case_id == Impound.case_id in status SUBMITTED transitions SUBMITTED -> ESCALATED (cascade hop 2)"

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [PAID, COURT_REFERRED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /dispatch/citations/{id}/pay"
        actor: Dispatcher
        preconditions: ["Citation.status == ISSUED"]
        side_effects:
          - "Case.outstanding_fines_total -= Citation.fine_amount"
      - from: ISSUED
        to: COURT_REFERRED
        trigger: "POST /dispatch/citations/{id}/refer-court"
        actor: Supervisor
        preconditions: ["Citation.status == ISSUED"]
        side_effects:
          - "sets Citation court referral; Case.outstanding_fines_total -= Citation.fine_amount"

  - entity: RabiesReport
    initial_state: SUBMITTED
    terminal_states: [CLEARED, ESCALATED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /dispatch/rabies-reports/{id}/clear"
        actor: HealthDeptLiaison
        preconditions: ["RabiesReport.status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: CLEARED
        trigger: "system (cascade from QuarantineHold VOIDED)"
        actor: system
        preconditions: ["RabiesReport.status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: ESCALATED
        trigger: "system (cascade from Impound EUTHANIZED via quarantine escalation)"
        actor: system
        preconditions: ["RabiesReport.status == SUBMITTED"]
        side_effects:
          - "sets linked Case.public_health_flag = true (cascade hop 3)"
          - "Case.risk_score += 20, clamped to [0,100] (cascade hop 3)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: impound-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /dispatch/impounds"
    occ_field: "expected_case_version"
    description: |
      Creating an Impound against a Case whose version has advanced since the
      client last observed it is rejected. A Case may legitimately carry multiple
      impounds; recording an impound bumps the parent Case.version (and its
      occupied-child bookkeeping). A second create that still carries the version
      the client read before the first impound landed is therefore operating on a
      stale view of the Case and is rejected on the version check.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: complaint_priority_score
    trigger: "POST /dispatch/complaints (on creation)"
    algorithm: weighted_scoring
    formula: |
      base        = SEVERITY_BASE[complaint_type]
      animal_mult = ANIMAL_MULT[animal_type]
      # repeat count: complaints already persisted with the SAME zone AND
      # status IN {NEW, DISPATCHED}, excluding this one (no time window; count
      # is taken at the instant of insert over currently-open same-zone rows).
      repeat_bonus     = min(open_same_zone_count * 5, 20)
      vulnerable_bonus = 15 if involves_vulnerable_victim else 0
      severity_score   = round(base * animal_mult + repeat_bonus + vulnerable_bonus, 2)
      priority = P1 if severity_score >= 60
                 else P2 if severity_score >= 30
                 else P3
    input_set: "SEVERITY_BASE and ANIMAL_MULT tables below; open same-zone complaint count at insert time"
    constants:
      SEVERITY_BASE: { BITE: 50, DANGEROUS_DOG: 40, CRUELTY: 35, STRAY: 15, NOISE: 5, OTHER: 10 }
      ANIMAL_MULT:   { WILDLIFE: 1.5, DOG: 1.2, LIVESTOCK: 1.1, CAT: 1.0, OTHER: 1.0 }
      REPEAT_STEP: 5
      REPEAT_CAP: 20
      VULNERABLE_BONUS: 15
      P1_THRESHOLD: 60
      P2_THRESHOLD: 30
    precision: "2 decimal places, round_half_up"

  - name: citation_fine
    trigger: "POST /dispatch/citations (on issuance)"
    algorithm: tiered_pricing
    formula: |
      base_fine = VIOLATION_FINE[violation_code]
      # prior = count of Citations with the SAME issued_to_ref and status IN
      # {PAID, COURT_REFERRED}, taken at issue time (no time window).
      if prior >= 1:
        multiplier = 1 + min(prior, 3) * 0.5
      else:
        multiplier = 1.0
      fine_amount = round(base_fine * multiplier, 2)
    input_set: "VIOLATION_FINE table; count of resolved prior citations for issued_to_ref"
    constants:
      VIOLATION_FINE: { UNLICENSED: 50, LEASH: 75, DANGEROUS: 250, BITE: 300, CRUELTY: 500 }
      REPEAT_STEP_PCT: 0.5
      REPEAT_CAP: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "prior == 0 (first offense for issued_to_ref)"
        difference: "multiplier = 1.0; fine_amount == base_fine"
      - name: escalated
        when: "prior >= 1 (repeat offender)"
        difference: "multiplier = 1 + min(prior,3)*0.5; fine_amount strictly greater than base_fine"

  - name: case_risk_score
    trigger: "POST /dispatch/cases/{id}/investigate (provisional) and POST /dispatch/cases/{id}/resolve (final)"
    algorithm: weighted_scoring
    formula: |
      type_weight = TYPE_WEIGHT[case_type]
      sev_component = round(linked_Complaint.severity_score * 0.5, 2)
      provisional = clamp(type_weight + sev_component, 0, 100)
      # final, on SUBSTANTIATED:
      final = clamp(type_weight + sev_component + SUBSTANTIATION_BONUS, 0, 100)
      # on UNFOUNDED: risk_score = 0
    input_set: "TYPE_WEIGHT table; linked Complaint.severity_score"
    constants:
      TYPE_WEIGHT: { BITE: 40, DANGEROUS_DOG: 35, CRUELTY: 30, STRAY: 10 }
      SEV_FACTOR: 0.5
      SUBSTANTIATION_BONUS: 20
      RISK_MIN: 0
      RISK_MAX: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "set on investigate (OPEN -> UNDER_INVESTIGATION)"
        difference: "type_weight + 0.5*severity_score, no substantiation bonus"
      - name: final
        when: "set on resolve SUBSTANTIATED"
        difference: "adds SUBSTANTIATION_BONUS (+20); UNFOUNDED resolves to 0 instead"

  - name: impound_boarding_fee
    trigger: "POST /dispatch/impounds/{id}/release (owner-facing charge)"
    algorithm: aggregation
    formula: |
      # days: ceil of elapsed occupancy, minimum 1
      days = max(1, ceil((released_at - Impound.impounded_at) / 86400 seconds))
      daily_charge = days * DAILY_RATE
      intake       = INTAKE_FEE
      surcharge    = UNLICENSED_SURCHARGE if not Impound.licensed else 0
      # PINNED ROUNDING ORDER: apply tax per line, round EACH line to 2dp, THEN sum.
      # (round-per-line-then-sum, NOT sum-then-round — the two differ in cents.)
      boarding_fee = round(daily_charge * (1 + TAX_RATE), 2)
                   + round(intake       * (1 + TAX_RATE), 2)
                   + round(surcharge    * (1 + TAX_RATE), 2)
    input_set: "Impound.impounded_at, release logical-clock time, Impound.licensed"
    constants:
      DAILY_RATE: 12.50
      INTAKE_FEE: 15.00
      UNLICENSED_SURCHARGE: 22.75
      TAX_RATE: 0.075
      SECONDS_PER_DAY: 86400
    precision: "2 decimal places per line, round_half_up, summed after per-line rounding"

  - name: quarantine_release_due
    trigger: "POST /dispatch/quarantine-holds (on creation)"
    algorithm: interval_merge
    formula: |
      required_days  = 10 if linked_Case.case_type == BITE
                       else 14 if linked_Case.case_type == DANGEROUS_DOG
                       else 10
      release_due_at = QuarantineHold.start_at + required_days days
      # Release permitted only when current logical clock >= release_due_at
      # (boundary is inclusive: exactly release_due_at is releasable).
    input_set: "linked Case.case_type; QuarantineHold.start_at"
    constants:
      BITE_DAYS: 10
      DANGEROUS_DOG_DAYS: 14
    precision: "whole days; datetime comparison at second granularity"

  - name: dispatch_dashboard_summary
    trigger: "GET /dispatch/reports/summary"
    algorithm: aggregation
    formula: |
      total_complaints        = count(Complaint)                       # all statuses
      open_cases              = count(Case where status IN {OPEN, UNDER_INVESTIGATION})
      active_quarantine_holds = count(QuarantineHold where status == ACTIVE)
      total_outstanding_fines = round(sum(Citation.fine_amount where status == ISSUED), 2)
      # Empty-DB / no-match returns zeros (integers) and 0.00 (fines).
    input_set: "all Complaint/Case/QuarantineHold/Citation rows with the status filters above"
    precision: "counts are integers; total_outstanding_fines 2 decimals, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path ids and body FK ids resolve to existing resources, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: state
    check: "Ownership: a FieldOfficer acting on a Dispatch/Case must match Dispatch.officer_id / Case.assigned_officer_id (Supervisor exempt)"
    error_id: ERR_NOT_ASSIGNED_OFFICER
    http_status: 403
    applies_to: "POST /dispatch/dispatches/{id}/accept, POST /dispatch/dispatches/{id}/clear, POST /dispatch/cases/{id}/investigate, POST /dispatch/cases/{id}/resolve"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (complaint dispatchable, dispatch acceptable/clearable, case investigatable/resolvable/closable, hold/impound/citation/report in required state)"
    error_id: "ERR_INVALID_STATE / ERR_COMPLAINT_NOT_DISPATCHABLE / ERR_CITATION_ALREADY_RESOLVED"
    http_status: 409
    applies_to: "all state-changing action endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity eligibility: quarantine hold and rabies report require linked Case.case_type IN {BITE, DANGEROUS_DOG}; impound/citation require Case.status IN {UNDER_INVESTIGATION, SUBSTANTIATED}; dispatch requires Complaint.status == NEW"
    error_id: "ERR_CASE_TYPE_NOT_ELIGIBLE / ERR_CASE_NOT_ACTIONABLE / ERR_COMPLAINT_NOT_DISPATCHABLE"
    http_status: 409
    applies_to: "POST /dispatch/quarantine-holds, POST /dispatch/rabies-reports, POST /dispatch/impounds, POST /dispatch/citations, POST /dispatch/dispatches"

  - priority: 7
    category: business_safety
    check: "Case may not close while a linked QuarantineHold is ACTIVE or a linked Impound is HELD; quarantine may not release before release_due_at"
    error_id: "ERR_ACTIVE_QUARANTINE_HOLD / ERR_ACTIVE_IMPOUND / ERR_QUARANTINE_NOT_ELAPSED"
    http_status: 409
    applies_to: "POST /dispatch/cases/{id}/close, POST /dispatch/quarantine-holds/{id}/release"

  - priority: 8
    category: business_temporal
    check: "Officer service windows must not overlap within BUFFER_MINUTES of another active dispatch (buffered adjacency); kennel occupancy windows must not overlap another HELD impound (closed intervals; shared endpoints allowed)"
    error_id: "ERR_OFFICER_SCHEDULE_CONFLICT / ERR_KENNEL_OCCUPIED"
    http_status: 409
    applies_to: "POST /dispatch/dispatches, POST /dispatch/impounds"

  - priority: 9
    category: business_constraint
    check: "Officer on-duty (current clock within [shift_start_at, shift_end_at]); officer active_dispatch_count < max_daily_dispatches"
    error_id: "ERR_OFFICER_OFF_DUTY / ERR_OFFICER_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /dispatch/dispatches"

  - priority: 10
    category: business_fiscal
    check: "Case may not close while a linked Citation is in status ISSUED (unpaid/unreferred)"
    error_id: ERR_OUTSTANDING_CITATIONS
    http_status: 409
    applies_to: "POST /dispatch/cases/{id}/close"

  - priority: 11
    category: state
    check: "OCC: expected_case_version must equal current Case.version on impound create"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /dispatch/impounds"

  - priority: 12
    category: business_constraint
    check: "Required body fields present; enum values valid; datetimes parseable; numeric fields well-formed; scheduled_end_at > scheduled_start_at; hold_until > impounded_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints with a body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Complaint ----
  - method: POST
    path: "/dispatch/complaints"
    description: "Intake a complaint/call; computes severity_score and priority."
    roles: [Dispatcher, Supervisor]
    code: 201
    input: [reporter_name, reporter_phone, zone, animal_type, complaint_type, "involves_vulnerable_victim?", "description?"]
    output: Complaint
    side_effects:
      - "status=NEW; computes severity_score and priority (calculations.complaint_priority_score)"
  - method: GET
    path: "/dispatch/complaints/{id}"
    description: "Fetch a complaint."
    roles: [Dispatcher, FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  # ---- Officer ----
  - method: POST
    path: "/dispatch/officers"
    description: "Register a field officer."
    roles: [Supervisor]
    code: 201
    input: [name, badge_number, territory_zone, shift_start_at, shift_end_at, "max_daily_dispatches?"]
    output: Officer
    side_effects: ["active_dispatch_count=0"]
  - method: GET
    path: "/dispatch/officers/{id}"
    description: "Fetch an officer."
    roles: [Dispatcher, FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Officer
    side_effects: []

  # ---- Kennel ----
  - method: POST
    path: "/dispatch/kennels"
    description: "Create a kennel/run."
    roles: [Supervisor]
    code: 201
    input: [code, facility_zone]
    output: Kennel
    side_effects: ["occupied_slots=0"]
  - method: GET
    path: "/dispatch/kennels/{id}"
    description: "Fetch a kennel."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Kennel
    side_effects: []

  # ---- Dispatch ----
  - method: POST
    path: "/dispatch/dispatches"
    description: "Assign an officer to a complaint (route/territory dispatch)."
    roles: [Dispatcher, Supervisor]
    code: 201
    input: [complaint_id, officer_id, scheduled_start_at, scheduled_end_at, "eta_minutes?"]
    output: Dispatch
    side_effects:
      - "status=PENDING"
      - "linked Complaint NEW -> DISPATCHED (increments Complaint.version by 1)"
      - "Officer.active_dispatch_count += 1"
  - method: GET
    path: "/dispatch/dispatches/{id}"
    description: "Fetch a dispatch."
    roles: [Dispatcher, FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/dispatch/dispatches"
    description: "List/filter dispatches (FK reverse-reachability for complaint_id and officer_id)."
    roles: [Dispatcher, FieldOfficer, Supervisor]
    code: 200
    input: ["complaint_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: POST
    path: "/dispatch/dispatches/{id}/accept"
    description: "Assigned officer accepts and goes en route."
    roles: [FieldOfficer]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status PENDING -> EN_ROUTE"]
  - method: POST
    path: "/dispatch/dispatches/{id}/clear"
    description: "Officer clears the scene, recording a field outcome."
    roles: [FieldOfficer]
    code: 200
    input: [field_outcome]
    output: Dispatch
    side_effects:
      - "status EN_ROUTE -> CLEARED; sets field_outcome"
      - "Officer.active_dispatch_count -= 1"
      - "linked Complaint DISPATCHED -> RESOLVED"

  # ---- Case ----
  - method: POST
    path: "/dispatch/cases"
    description: "Open an investigation case from a complaint."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [complaint_id, assigned_officer_id, case_type, "animal_identifier?"]
    output: Case
    side_effects: ["status=OPEN; risk_score=0; outstanding_fines_total=0; public_health_flag=false"]
  - method: GET
    path: "/dispatch/cases/{id}"
    description: "Fetch a case."
    roles: [Dispatcher, FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/dispatch/cases"
    description: "List/filter cases (FK reverse-reachability for complaint_id and assigned_officer_id)."
    roles: [Dispatcher, FieldOfficer, Supervisor]
    code: 200
    input: ["complaint_id?", "assigned_officer_id?", "case_type?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/dispatch/cases/{id}/investigate"
    description: "Move a case into investigation (or reopen a substantiated case); sets provisional risk_score."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Case
    side_effects: ["OPEN|SUBSTANTIATED -> UNDER_INVESTIGATION; risk_score=provisional"]
  - method: POST
    path: "/dispatch/cases/{id}/resolve"
    description: "Resolve a case as SUBSTANTIATED or UNFOUNDED."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: [resolution]
    output: Case
    side_effects:
      - "UNDER_INVESTIGATION -> SUBSTANTIATED (risk_score=final, substantiated_at set) or -> UNFOUNDED (risk_score=0, ACTIVE holds cascade to VOIDED)"
  - method: POST
    path: "/dispatch/cases/{id}/close"
    description: "Close a resolved case (blocked by active holds, held impounds, or unpaid citations)."
    roles: [Supervisor]
    code: 200
    input: []
    output: Case
    side_effects: ["SUBSTANTIATED|UNFOUNDED -> CLOSED; linked Complaint -> CLOSED (cascade)"]
  - method: POST
    path: "/dispatch/cases/{id}/notes"
    description: "Append an investigation note to a case (append-only)."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [note_type, body]
    output: InvestigationNote
    side_effects: ["sets case_id from path; author_role/author_id from headers"]
  - method: GET
    path: "/dispatch/cases/{id}/notes"
    description: "List investigation notes for a case (FK reverse-reachability for InvestigationNote.case_id)."
    roles: [FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: ["limit?", "offset?"]
    output: InvestigationNote[]
    side_effects: []

  # ---- QuarantineHold ----
  - method: POST
    path: "/dispatch/quarantine-holds"
    description: "Place a bite/dangerous-dog animal under quarantine observation."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [case_id, hold_type, start_at, "animal_identifier?"]
    output: QuarantineHold
    side_effects: ["status=ACTIVE; computes required_days and release_due_at"]
  - method: GET
    path: "/dispatch/quarantine-holds/{id}"
    description: "Fetch a quarantine hold."
    roles: [FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: []
    output: QuarantineHold
    side_effects: []
  - method: GET
    path: "/dispatch/quarantine-holds"
    description: "List/filter quarantine holds (FK reverse-reachability for case_id)."
    roles: [FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: QuarantineHold[]
    side_effects: []
  - method: POST
    path: "/dispatch/quarantine-holds/{id}/release"
    description: "Release a hold once the observation window has elapsed."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: []
    output: QuarantineHold
    side_effects: ["ACTIVE -> RELEASED"]
  - method: POST
    path: "/dispatch/quarantine-holds/{id}/escalate"
    description: "Escalate a symptomatic animal (triggers euthanasia + health-dept cascade)."
    roles: [Supervisor]
    code: 200
    input: []
    output: QuarantineHold
    side_effects:
      - "ACTIVE -> ESCALATED"
      - "linked HELD Impound -> EUTHANIZED (cascade), which frees the kennel and escalates the linked RabiesReport, which flags the Case for public health"

  # ---- Impound ----
  - method: POST
    path: "/dispatch/impounds"
    description: "Impound an animal into a kennel (OCC on Case.version; kennel overlap checked)."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [case_id, kennel_id, impounded_at, hold_until, expected_case_version, "animal_identifier?", "licensed?"]
    output: Impound
    side_effects:
      - "status=HELD; Kennel.occupied_slots += 1"
      - "increments Case.version by 1"
  - method: GET
    path: "/dispatch/impounds/{id}"
    description: "Fetch an impound."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Impound
    side_effects: []
  - method: GET
    path: "/dispatch/impounds"
    description: "List/filter impounds (FK reverse-reachability for case_id and kennel_id)."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: ["case_id?", "kennel_id?", "status?", "limit?", "offset?"]
    output: Impound[]
    side_effects: []
  - method: POST
    path: "/dispatch/impounds/{id}/release"
    description: "Release an impounded animal with a disposition; computes boarding_fee."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: [disposition]
    output: Impound
    side_effects: ["HELD -> {REDEEMED|ADOPTED|EUTHANIZED|RELEASED}; sets boarding_fee; Kennel.occupied_slots -= 1"]

  # ---- Citation ----
  - method: POST
    path: "/dispatch/citations"
    description: "Issue a citation; computes fine_amount with repeat-offender escalation."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [case_id, violation_code, issued_to_name, issued_to_ref]
    output: Citation
    side_effects:
      - "status=ISSUED; computes base_fine, fine_amount, issued_at, due_at"
      - "Case.outstanding_fines_total += fine_amount"
  - method: GET
    path: "/dispatch/citations/{id}"
    description: "Fetch a citation."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/dispatch/citations"
    description: "List/filter citations (FK reverse-reachability for case_id)."
    roles: [FieldOfficer, Supervisor]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: POST
    path: "/dispatch/citations/{id}/pay"
    description: "Record payment of a citation."
    roles: [Dispatcher, Supervisor]
    code: 200
    input: []
    output: Citation
    side_effects: ["ISSUED -> PAID; Case.outstanding_fines_total -= fine_amount"]
  - method: POST
    path: "/dispatch/citations/{id}/refer-court"
    description: "Refer an unpaid citation to court."
    roles: [Supervisor]
    code: 200
    input: []
    output: Citation
    side_effects: ["ISSUED -> COURT_REFERRED; Case.outstanding_fines_total -= fine_amount"]

  # ---- RabiesReport ----
  - method: POST
    path: "/dispatch/rabies-reports"
    description: "Submit a rabies/bite report to the health department."
    roles: [FieldOfficer, Supervisor]
    code: 201
    input: [case_id, quarantine_hold_id, victim_name, exposure_date, "animal_identifier?"]
    output: RabiesReport
    side_effects: ["status=SUBMITTED; sets submitted_at, deadline_at, is_late"]
  - method: GET
    path: "/dispatch/rabies-reports/{id}"
    description: "Fetch a rabies report."
    roles: [FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: []
    output: RabiesReport
    side_effects: []
  - method: GET
    path: "/dispatch/rabies-reports"
    description: "List/filter rabies reports (FK reverse-reachability for case_id and quarantine_hold_id)."
    roles: [FieldOfficer, Supervisor, HealthDeptLiaison]
    code: 200
    input: ["case_id?", "quarantine_hold_id?", "status?", "limit?", "offset?"]
    output: RabiesReport[]
    side_effects: []
  - method: POST
    path: "/dispatch/rabies-reports/{id}/clear"
    description: "Health dept clears a rabies report after negative observation."
    roles: [HealthDeptLiaison]
    code: 200
    input: []
    output: RabiesReport
    side_effects: ["SUBMITTED -> CLEARED"]

  # ---- Reporting ----
  - method: GET
    path: "/dispatch/reports/summary"
    description: "Aggregate operational dashboard (calculations.dispatch_dashboard_summary)."
    roles: [Dispatcher, Supervisor]
    code: 200
    input: []
    output: "{ total_complaints: integer, open_cases: integer, active_quarantine_holds: integer, total_outstanding_fines: number }"
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock). All deadline/window/expiry rules read this logical clock."
    roles: [Supervisor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the server logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_ASSIGNED_OFFICER, http: 403, condition: "FieldOfficer acting on a dispatch/case they are not assigned to" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id does not exist" }
  - { id: ERR_OFFICER_NOT_FOUND, http: 404, condition: "Officer id does not exist" }
  - { id: ERR_KENNEL_NOT_FOUND, http: 404, condition: "Kennel id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Case id does not exist" }
  - { id: ERR_QUARANTINE_HOLD_NOT_FOUND, http: 404, condition: "QuarantineHold id does not exist" }
  - { id: ERR_IMPOUND_NOT_FOUND, http: 404, condition: "Impound id does not exist" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "Citation id does not exist" }
  - { id: ERR_RABIES_REPORT_NOT_FOUND, http: 404, condition: "RabiesReport id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_COMPLAINT_NOT_DISPATCHABLE, http: 409, condition: "Dispatch requested for a Complaint not in status NEW" }
  - { id: ERR_CITATION_ALREADY_RESOLVED, http: 409, condition: "Pay/refer requested on a Citation not in status ISSUED" }
  - { id: ERR_CASE_TYPE_NOT_ELIGIBLE, http: 409, condition: "Quarantine/rabies operation on a Case whose case_type is not BITE or DANGEROUS_DOG" }
  - { id: ERR_CASE_NOT_ACTIONABLE, http: 409, condition: "Impound/citation/quarantine requested on a Case not in status UNDER_INVESTIGATION or SUBSTANTIATED" }
  - { id: ERR_OFFICER_OFF_DUTY, http: 409, condition: "Current logical clock is outside the officer's [shift_start_at, shift_end_at] window" }
  - { id: ERR_OFFICER_SCHEDULE_CONFLICT, http: 409, condition: "New dispatch window overlaps another active dispatch for the officer within BUFFER_MINUTES" }
  - { id: ERR_OFFICER_CAPACITY_EXCEEDED, http: 409, condition: "Officer already has max_daily_dispatches active dispatches" }
  - { id: ERR_KENNEL_OCCUPIED, http: 409, condition: "New impound window overlaps a HELD impound in the same kennel (shared endpoints allowed)" }
  - { id: ERR_QUARANTINE_NOT_ELAPSED, http: 409, condition: "Release requested before current clock reaches release_due_at" }
  - { id: ERR_ACTIVE_QUARANTINE_HOLD, http: 409, condition: "Case close blocked by an ACTIVE quarantine hold" }
  - { id: ERR_ACTIVE_IMPOUND, http: 409, condition: "Case close blocked by a HELD impound" }
  - { id: ERR_OUTSTANDING_CITATIONS, http: 409, condition: "Case close blocked by an ISSUED citation" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version on impound create does not match current Case.version" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, invalid enum, unparseable datetime, or window with end <= start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Call-taker: intakes complaints, assigns officers to complaints, records citation payments, reads dashboard."
    identity: opaque
    exclusive_operations:
      - "POST /dispatch/complaints (intake)"
      - "POST /dispatch/dispatches (assign officer)"
    shared_operations:
      - "POST /dispatch/citations/{id}/pay (with Supervisor)"
      - "GET /dispatch/reports/summary (with Supervisor)"
      - "GET reads on complaints, officers, dispatches, cases"

  - name: FieldOfficer
    description: "Field agent: accepts/clears own dispatches, opens/investigates/resolves assigned cases, adds notes, places holds, impounds animals, issues citations, submits rabies reports."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /dispatch/dispatches/{id}/accept (own dispatch)"
      - "POST /dispatch/dispatches/{id}/clear (own dispatch)"
    shared_operations:
      - "POST /dispatch/cases, /investigate, /resolve, /notes (with Supervisor)"
      - "POST /dispatch/quarantine-holds and /release (with Supervisor)"
      - "POST /dispatch/impounds and /release (with Supervisor)"
      - "POST /dispatch/citations (with Supervisor)"
      - "POST /dispatch/rabies-reports (with Supervisor)"

  - name: Supervisor
    description: "Administrative override: creates officers/kennels, reopens/closes cases, escalates quarantine, refers citations to court, sets the logical clock, reads dashboard. Exempt from FieldOfficer ownership checks."
    identity: opaque
    exclusive_operations:
      - "POST /dispatch/officers"
      - "POST /dispatch/kennels"
      - "POST /dispatch/cases/{id}/close"
      - "POST /dispatch/cases/{id}/investigate (reopen SUBSTANTIATED)"
      - "POST /dispatch/quarantine-holds/{id}/escalate"
      - "POST /dispatch/citations/{id}/refer-court"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all FieldOfficer case/hold/impound/citation/rabies operations (ownership-exempt)"
      - "POST /dispatch/citations/{id}/pay (with Dispatcher)"
      - "GET /dispatch/reports/summary (with Dispatcher)"

  - name: HealthDeptLiaison
    description: "Health-department contact: reads and clears rabies reports."
    identity: opaque
    exclusive_operations:
      - "POST /dispatch/rabies-reports/{id}/clear"
    shared_operations:
      - "GET reads on rabies-reports, quarantine-holds, cases, complaints, notes"
