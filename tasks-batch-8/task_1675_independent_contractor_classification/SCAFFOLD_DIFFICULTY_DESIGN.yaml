# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >=2 instances = 19 instances.
# Every setup_api_calls / trigger chain replays cleanly against SCAFFOLD.yaml
# §1.2 / §1.4 / §1.5 / §1.6 from empty-DB.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_classification_abc_vs_common_law_same_answers
        grounds:
          - calculations.classification_test_application
          - entities.ClassificationDetermination.fields.outcome
          - entities.Jurisdiction.fields.test_type
        distinguishing_aspect: |
          Entity domain = ClassificationDetermination. Identical questionnaire
          answers produce EMPLOYEE_RISK under ABC_TEST (one failed prong flips
          the all-or-nothing test) but CONTRACTOR under COMMON_LAW_WEIGHTED
          (weighted score 0.25 < 0.60 threshold) — two valid test algorithms,
          two different outcomes for the same input data.
        test_recipe:
          setup:
            - "Two jurisdictions: US-CA (ABC_TEST) and US-TX (COMMON_LAW_WEIGHTED, threshold 0.60)"
            - "One contractor; two engagements (one per jurisdiction) with byte-identical questionnaire answers: CONTROL_METHOD=YES (employee-indicative), all other factors contractor-favorable"
            - "Both engagements reach CLASSIFIED via determinations"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Delta Design LLC", entity_type: "LLC", ein: "12-0001675", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_ca}", title: "CA engagement", scope_description: "Design work", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_ca: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "TX engagement", scope_description: "Design work", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_tx: $.data.id }
            - call: "POST /api/engagements/${eng_ca}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "YES" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "POST /api/engagements/${eng_tx}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "YES" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_ca}"
              as: PlatformAdmin
              captures: { eng_ca_v: $.data.version }
            - call: "GET /api/engagements/${eng_tx}"
              as: PlatformAdmin
              captures: { eng_tx_v: $.data.version }
          trigger:
            - call: "POST /api/engagements/${eng_ca}/determinations"
              payload: { expected_engagement_version: "${eng_ca_v}" }
              as: ClassificationAnalyst
              captures: { det_ca_outcome: $.data.outcome, det_ca_failed: $.data.failed_prongs }
            - call: "POST /api/engagements/${eng_tx}/determinations"
              payload: { expected_engagement_version: "${eng_tx_v}" }
              as: ClassificationAnalyst
              captures: { det_tx_outcome: $.data.outcome, det_tx_score: $.data.score }
          assert:
            - "ClassificationDetermination(${eng_ca}).outcome == EMPLOYEE_RISK (ABC prong A failed by CONTROL_METHOD=YES)"
            - "ClassificationDetermination(${eng_ca}).failed_prongs == 1"
            - "ClassificationDetermination(${eng_tx}).outcome == CONTRACTOR (weighted score 0.25 < 0.60)"
            - "ClassificationDetermination(${eng_tx}).score == 0.25"
            - "Same answers array drove both results; the variant selected by jurisdiction.test_type alone flipped the outcome"

      - name: dvc_risk_score_provisional_vs_final_same_audit
        grounds:
          - calculations.reclassification_risk_score
          - entities.RiskAudit.fields.provisional_risk_score
          - entities.RiskAudit.fields.final_risk_score
        distinguishing_aspect: |
          Entity domain = RiskAudit (distinct from ClassificationDetermination in
          dvc_classification_abc_vs_common_law_same_answers). The same contractor/
          engagement data yields provisional 12.0 (LOW) at creation but final 58.6
          (HIGH) at finalize, because the final variant discounts the provisional
          to 30% weight and replays fieldwork events — provisional vs final are
          two valid algorithms over the same subject with different results.
        test_recipe:
          setup:
            - "Contractor + COMMON_LAW engagement (start 2026-02-01), questionnaire all-favorable, determination CONTRACTOR; scope_creep_index == 0 (no amendments, no overrun, supervision NONE)"
            - "Clock at startup default 2026-08-01T00:00:00Z => 6 full months since start"
            - "Audit opened on the engagement, then finalized with fieldwork events: 3x SUPERVISION_OBSERVED + 1x EQUIPMENT_PROVIDED"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Provisional vs Final LLC", entity_type: "LLC", ein: "12-0001676", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Risk audit target", scope_description: "Consulting", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/audits"
              payload: { contractor_id: "${con_id}", engagement_id: "${eng_id}", audit_type: "FIELDWORK" }
              as: ComplianceOfficer
              captures: { audit_id: $.data.id, prov_score: $.data.provisional_risk_score, prov_level: $.data.risk_level }
          trigger:
            - call: "POST /api/audits/${audit_id}/finalize"
              payload: { fieldwork_events: [ { event_type: "SUPERVISION_OBSERVED" }, { event_type: "SUPERVISION_OBSERVED" }, { event_type: "SUPERVISION_OBSERVED" }, { event_type: "EQUIPMENT_PROVIDED" } ], findings_summary: "Close supervision observed on site" }
              as: ComplianceOfficer
              captures: { final_score: $.data.final_risk_score, final_level: $.data.risk_level }
          assert:
            - "RiskAudit(${audit_id}).provisional_risk_score == 12.0 (0.5*0 + 0 + 0 + 2*min(6,12))"
            - "provisional risk_level == LOW (12.0 < 25)"
            - "RiskAudit(${audit_id}).final_risk_score == 58.6 (0.3*12.0 + 3*15 + 1*10)"
            - "final risk_level == HIGH (50 <= 58.6 < 75) => Contractor(${con_id}).standing_status == WATCH"
            - "Identical contractor/engagement base data; variant switch (provisional -> final) alone moved the level LOW -> HIGH"

  - rule_id: combinatorial_formula
    instances:
      - name: cf_scope_creep_multi_input_nonlinear
        grounds:
          - calculations.scope_creep_index
          - entities.Engagement.fields.scope_creep_index
          - entities.Engagement.fields.scope_creep_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested min() caps on
          amendment count, rate variance, and days overrun, a conditional
          supervision multiplier, and a state-dependent SUSPENDED floor. Fixture:
          A=2 amendments, R=0.15 rate variance, D=10 days overrun, S=NONE,
          status ACTIVE => raw = min(2,5)*12 + min(0.15,0.50)*200 + min(10,90)
          = 24 + 30 + 10 = 64 => index 64, tier HIGH.
        test_recipe:
          setup:
            - "ACTIVE STANDARD engagement (COMMON_LAW, all-favorable answers), contract executed at rate_cents 10000 (2026-02-01 to 2027-06-30), engagement end_date 2026-11-05"
            - "Two amendments applied: rate 10000 -> 11000 -> 11500"
            - "Clock advanced to 2026-11-15T00:00:00Z (10 days past engagement end_date)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Creep Metrics LLC", entity_type: "LLC", ein: "12-0001677", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Scope creep subject", scope_description: "Phased delivery", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-11-05", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/submit-approval"
              payload: {}
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/approve"
              payload: {}
              as: HRApprover
              as_user_id: "hr-001"
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/engagements/${eng_id}/contracts"
              payload: { start_date: "2026-02-01", end_date: "2027-06-30", rate_cents: 10000, rate_unit: "HOURLY" }
              as: EngagementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contracts/${ctr_id}/execute"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/activate"
              payload: {}
              as: EngagementManager
            - call: "GET /api/contracts/${ctr_id}"
              as: PlatformAdmin
              captures: { ctr_v0: $.data.version }
            - call: "POST /api/contracts/${ctr_id}/amendments"
              payload: { expected_contract_version: "${ctr_v0}", scope_change_summary: "Add integration work package", new_rate_cents: 11000 }
              as: EngagementManager
              captures: { am1: $.data.id }
            - call: "POST /api/amendments/${am1}/approve"
              payload: { decision: "APPROVED" }
              as: LegalApprover
            - call: "GET /api/contracts/${ctr_id}"
              as: PlatformAdmin
              captures: { ctr_v1: $.data.version }
            - call: "POST /api/contracts/${ctr_id}/amendments"
              payload: { expected_contract_version: "${ctr_v1}", scope_change_summary: "Add maintenance window work", new_rate_cents: 11500 }
              as: EngagementManager
              captures: { am2: $.data.id }
            - call: "POST /api/amendments/${am2}/approve"
              payload: { decision: "APPROVED" }
              as: LegalApprover
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { creep_idx: $.data.scope_creep_index, creep_tier: $.data.scope_creep_tier }
          assert:
            - "Engagement(${eng_id}).scope_creep_index == 64 (min(2,5)*12 + min(0.15,0.50)*200 + min(10,90) = 24+30+10, no supervision multiplier, no suspension floor)"
            - "Engagement(${eng_id}).scope_creep_tier == HIGH (50 <= 64 < 75)"
            - "Contract(${ctr_id}).rate_cents == 11500 after both applied amendments"

      - name: cf_lookback_per_quarter_rounding_order
        grounds:
          - calculations.conversion_lookback_compensation
          - entities.ConversionCase.fields.w2_equivalent_total_cents
          - entities.ConversionCase.fields.lookback_delta_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — employer cost rounded to
          whole cents per quarter, benefits computed on the ROUNDED employer cost
          and rounded again per quarter, then summed. Pinned order yields
          5610815 cents on fixture [1000300, 1000400, 1005200, 1003400];
          sum-then-round yields 5610814 (1 cent less) — the scaffold pins
          round-per-quarter-then-sum.
        test_recipe:
          setup:
            - "ACTIVE STANDARD engagement (COMMON_LAW chain to ACTIVE as in cf_scope_creep but no amendments, engagement end 2026-12-31, clock at default 2026-08-01)"
            - "ConversionCase created with lookback_quarters service_fee_cents [1000300, 1000400, 1005200, 1003400]"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Rounding Case LLC", entity_type: "LLC", ein: "12-0001678", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Conversion rounding subject", scope_description: "Advisory", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/submit-review"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/submit-approval"
              payload: {}
              as: ClassificationAnalyst
            - call: "POST /api/engagements/${eng_id}/approve"
              payload: {}
              as: HRApprover
              as_user_id: "hr-001"
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/engagements/${eng_id}/contracts"
              payload: { start_date: "2026-02-01", end_date: "2026-12-31", rate_cents: 10000, rate_unit: "HOURLY" }
              as: EngagementManager
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contracts/${ctr_id}/execute"
              payload: {}
              as: EngagementManager
            - call: "POST /api/engagements/${eng_id}/activate"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /api/engagements/${eng_id}/conversions"
              payload: { lookback_quarters: [ { quarter_label: "2025Q3", service_fee_cents: 1000300 }, { quarter_label: "2025Q4", service_fee_cents: 1000400 }, { quarter_label: "2026Q1", service_fee_cents: 1005200 }, { quarter_label: "2026Q2", service_fee_cents: 1003400 } ] }
              as: ComplianceOfficer
              captures: { conv_id: $.data.id, w2_total: $.data.w2_equivalent_total_cents, delta: $.data.lookback_delta_cents }
          assert:
            - "ConversionCase(${conv_id}).w2_equivalent_total_cents == 5610815 (per-quarter rounded: 1399870 + 1400010 + 1406727 + 1404208)"
            - "ConversionCase(${conv_id}).lookback_delta_cents == 1601515 (5610815 - 4009300)"
            - "Sum-then-round would produce 5610814; the implementation MUST round per quarter then sum"

      - name: cf_exposure_pinned_evaluation_order
        grounds:
          - calculations.agency_exposure_estimate
          - entities.AgencyInquiry.fields.exposure_estimate_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation
          order — the penalty tier is keyed on the PRE-penalty base and interest
          compounds on (base + penalty), never on the running total. Fixture:
          base 5000000 (< 10000000 => rate 0.10) => penalty 500000; interest
          (5000000+500000)*0.05*2 = 550000; exposure 6050000.
        test_recipe:
          setup:
            - "Jurisdiction + contractor + engagement (DRAFT is sufficient; inquiry registration has no engagement-status gate)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Exposure Subject LLC", entity_type: "LLC", ein: "12-0001679", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_ca}", title: "Inquiry target", scope_description: "Field services", agreed_rate_cents: 9000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /api/engagements/${eng_id}/inquiries"
              payload: { agency_type: "STATE_EDD", received_at: "2026-07-15T00:00:00Z", response_deadline: "2026-09-15T00:00:00Z", back_payments_cents: 5000000, quarters_outstanding: 2 }
              as: AgencyLiaison
              captures: { inq_id: $.data.id, exposure: $.data.exposure_estimate_cents }
          assert:
            - "AgencyInquiry(${inq_id}).exposure_estimate_cents == 6050000 (base 5000000 + penalty 500000 + interest 550000)"
            - "Penalty tier keyed on pre-penalty base (5000000 < 10000000 => 0.10), NOT on base+penalty (5500000 still < limit, so order-independence of the tier here is excluded by construction)"
            - "Interest computed on (base + penalty) = 5500000 * 0.05 * 2 = 550000, never on itself"

  - rule_id: non_linear_state_machine
    instances:
      - name: nsm_contractor_parallel_dimensions
        grounds:
          - state_machines.Contractor
          - entities.Contractor.fields.verification_status
          - entities.Contractor.fields.standing_status
        distinguishing_aspect: |
          Entity = Contractor: parallel state dimensions on one entity —
          verification_status and standing_status evolve independently. Proof:
          a CRITICAL audit finalize moves standing GOOD_STANDING ->
          SUSPENDED_STANDING while verification stays VERIFICATION_FAILED; a
          later re-verification flips verification to VERIFIED while standing
          remains SUSPENDED_STANDING.
        test_recipe:
          setup:
            - "Contractor created (UNVERIFIED x GOOD_STANDING); a FAILED verification decision; an engagement (CLASSIFIED, CONTRACTOR) feeding a FIELDWORK audit finalized CRITICAL"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Parallel Dims LLC", entity_type: "LLC", ein: "12-0001680", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "FAILED" }
              as: ComplianceOfficer
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Parallel dims target", scope_description: "Ops support", agreed_rate_cents: 9000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
