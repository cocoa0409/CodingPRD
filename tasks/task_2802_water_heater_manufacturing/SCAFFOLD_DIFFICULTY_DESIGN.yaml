          setup:
            - "Lots TL-001 (planned 120), TL-002 (planned 60) and TL-003 (planned 40) were all lined from fired batch GLB-001."
            - "TL-001 already failed a holiday inspection, so it is LINING_REJECTED and the batch's rejected_lot_count is 1."
            - "TL-003 passed both inspections, so it is LINING_VERIFIED with wip_quantity 40 and scrapped_quantity 0."
            - "TL-002 is LINED with wip_quantity 60, rework_count 0 and no inspection records."
            - "BATCH_QUARANTINE_THRESHOLD is 2, so exactly one more rejection quarantines the batch."
