              captures: { bl1_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends/${bl1_id}/execute"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${avail} == 2000.00 and ${st0} == SCHEDULED — scheduling never inspected the volume"
            - "${err_id} == ERR_INSUFFICIENT_TANK_CAPACITY with HTTP 422"
            - "DenaturantBlend.${bl1_id}.status stays SCHEDULED with output_gallons null and executed_at null"
            - "ProductTank.${t101_id}.current_gallons == 500000.00, ProductTank.${t201_id}.current_gallons == 500000.00, ProductTank.${t302_id}.current_gallons == 0.00"

  - section: rbac
    instances:
      - name: exclusive_operations_refuse_every_other_role
        claim_type: exclusive_operation_denied
        grounds:
          - roles.ScaleOperator.exclusive_operations
          - roles.RiskManager.exclusive_operations
          - roles.PlantManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Authorization is decided before any state or payload validation: a
          GrainBuyer grading a load, a ProcessOperator opening a hedge, a
          ComplianceOfficer reviewing a project and a LogisticsCoordinator
          posting market marks all return ERR_UNAUTHORIZED 403 — the
          ComplianceOfficer call in particular returns 403 and not the
          ERR_INVALID_PROJECT_STATE that a permitted caller would have hit on
          the same DRAFT project.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED with load TK-0001 booked and ungraded; carbon project CP-1 is DRAFT."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/carbon-projects"
              payload: { project_code: "CP-1", project_name: "Combined heat and power retrofit", project_type: "CHP", claimed_reduction_g_per_mj: 8.000, certification_tier: "FULL" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { cp1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { e_grade: $.data.error_id }
            - call: "POST /ethanol-ops/hedge-positions"
              payload: { position_code: "HP-9", commodity: "ETHANOL", direction: "SHORT", contracts: 10, entry_price: 182.00, contract_month: "2026-10" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { e_hedge: $.data.error_id }
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/review"
              payload: { determination: "CERTIFY", verified_reduction_g_per_mj: 8.000 }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { e_review: $.data.error_id }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 450.0, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 320.0, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 45.00 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { e_marks: $.data.error_id }
          assert:
            - "${e_grade} == ERR_UNAUTHORIZED with HTTP 403 and CornDelivery.${d1_id}.grading_status still PENDING_GRADE"
            - "${e_hedge} == ERR_UNAUTHORIZED with HTTP 403 and GET /ethanol-ops/hedge-positions returns 0 rows"
            - "${e_review} == ERR_UNAUTHORIZED with HTTP 403, not ERR_INVALID_PROJECT_STATE — the 403 precedes the 409"
            - "${e_marks} == ERR_UNAUTHORIZED with HTTP 403 and Plant.${plant_id}.mark_corn_cents_per_bushel stays null"

      - name: the_grader_may_not_settle_its_own_load
        claim_type: segregation_of_duties
        grounds:
          - roles.GrainAccountant
          - validations[priority=18]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Segregation is keyed on X-User-ID, not on the role: the very same
          GrainAccountant endpoint returns ERR_SEGREGATION_OF_DUTIES 403 when
          the header carries scale-01 (the user who graded the load) and
          succeeds for acct-01 on the identical request body.
        test_recipe:
          setup:
            - "Plant exists; load TK-0001 on a PRICED contract has been graded by user scale-01 and is awaiting settlement."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { gb_user: $.data.graded_by_user_id }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "scale-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${gb_user} == scale-01 — the grader's user id was stamped on the delivery"
            - "${err_id} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "CornDelivery.${d1_id}.grading_status stays GRADED, settled_at null, Plant.${plant_id}.corn_inventory_bushels == 0.00"
            - "Re-issuing the identical settle call as GrainAccountant with X-User-ID acct-01 returns 200 with net_dry_bushels 940.00 and settlement_amount_cents 413600"

      - name: shared_operations_work_for_every_holder_of_the_shared_right
        claim_type: shared_operation_allowed
        grounds:
          - roles.PlantManager.shared_operations
          - roles.RiskManager.shared_operations
          - roles.GrainBuyer.shared_operations
          - endpoints[POST /plants/{id}/market-marks]
        distinguishing_aspect: |
          The mark-posting right is genuinely shared: PlantManager posts the
          October marks and RiskManager overwrites them for November on the same
          plant, and a third role that only holds the read right, GrainBuyer,
          reads the crush margin afterwards — none of the three sees a 403.
        test_recipe:
          setup:
            - "A plant with no marks posted."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 450.0, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 320.0, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 45.00 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { m1: $.data.marks_effective_month, e1: $.data.mark_ethanol_cents_per_gallon }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-11", mark_corn_cents_per_bushel: 440.0, mark_ethanol_cents_per_gallon: 176.50, mark_natgas_cents_per_mmbtu: 315.0, mark_soybean_meal_usd_per_ton: 335.00, mark_sbo_cents_per_lb: 46.00 }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { m2: $.data.marks_effective_month, e2: $.data.mark_ethanol_cents_per_gallon, v2: $.data.version }
            - call: "GET /ethanol-ops/plants/${plant_id}/crush-margin"
              payload: {}
              as: GrainBuyer
              as_user_id: "gb-01"
          assert:
            - "${m1} == 2026-10 with ${e1} == 178.00 after the PlantManager post"
            - "${m2} == 2026-11 with ${e2} == 176.50 — the RiskManager post overwrote the marks in place"
            - "${v2} == 3 (one bump per market-marks write on the plant created at version 1)"
            - "The GrainBuyer crush-margin read returns HTTP 200 with success true and a mark_to_market block, not a 403; nothing is captured from it because CrushMarginView is a projection rather than a stored entity"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_destination_tank_version_rejected_then_fresh_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[blend-schedule-stale-tank]
          - errors[ERR_STALE_TANK_VERSION]
          - entities.DenaturantBlend.fields.expected_destination_tank_version
        distinguishing_aspect: |
          A hold and a release bump the destination tank from version 1 to 3
          without changing a single gallon, so a caller holding the version-1
          snapshot is refused with ERR_STALE_TANK_VERSION 412 and the identical
          body succeeds once it carries version 3 — proof the check is on
          version equality, not on whether the tank looks usable.
        test_recipe:
          setup:
            - "Plant exists; T-101 (ETHANOL_200_PROOF) and T-201 (DENATURANT) hold 500000.00 gallons each; T-301 (DENATURED_E100) is empty and has been held OFF_SPEC and released, so its version is 3."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, v_stale: $.data.version }
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/hold"
              payload: { hold_reason: "OFF_SPEC" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { v_held: $.data.version, svc_held: $.data.service_status }
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/release"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { v_fresh: $.data.version, svc_rel: $.data.service_status }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${v_stale}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${v_fresh}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id, bl1_status: $.data.status }
          assert:
            - "${v_stale} == 1, ${v_held} == 2 with ${svc_held} == ON_HOLD, ${v_fresh} == 3 with ${svc_rel} == IN_SERVICE"
            - "${err_id} == ERR_STALE_TANK_VERSION with HTTP 412 and no DenaturantBlend row exists at that point"
            - "The retry with ${v_fresh} returns 201 with ${bl1_status} == SCHEDULED and occupancy_end 2026-09-04T12:00:00Z"
            - "ProductTank.${t301_id}.version == 3 after the accepted schedule — scheduling a blend does not itself bump the destination version"

      - name: stale_loading_track_version_rejected_then_fresh_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-schedule-stale-track]
          - errors[ERR_STALE_TRACK_VERSION]
          - entities.LoadingTrack.fields.committed_railcars
        distinguishing_aspect: |
          The first accepted shipment moves the track from version 1 to 2, so a
          second caller still holding version 1 is refused with
          ERR_STALE_TRACK_VERSION 412 even though 100 of the 110 spots are free;
          re-read at version 2 the same shipment is accepted and
          committed_railcars reaches 20.
        test_recipe:
          setup:
            - "Plant exists; T-301 (DENATURED_E100) holds 400000.00 gallons; track TRK-A has 110 spots and version 1; SH-1 for 10 railcars has already been scheduled on it."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, v_stale: $.data.version, c0: $.data.committed_railcars }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-1", track_id: "${trk_id}", expected_track_version: "${v_stale}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Terminal", railcar_count: 10, gallons_per_railcar: 2659.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { v_fresh: $.data.version, c1: $.data.committed_railcars }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-2", track_id: "${trk_id}", expected_track_version: "${v_stale}", source_tank_id: "${t301_id}", destination_terminal: "Peoria Terminal", railcar_count: 10, gallons_per_railcar: 2659.00, window_start: "2026-09-04T12:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 180.00 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-2", track_id: "${trk_id}", expected_track_version: "${v_fresh}", source_tank_id: "${t301_id}", destination_terminal: "Peoria Terminal", railcar_count: 10, gallons_per_railcar: 2659.00, window_start: "2026-09-04T12:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 180.00 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh2_id: $.data.id, planned2: $.data.planned_gallons }
          assert:
            - "${v_stale} == 1 with ${c0} == 0, and ${v_fresh} == 2 with ${c1} == 10 after SH-1 was accepted"
            - "${err_id} == ERR_STALE_TRACK_VERSION with HTTP 412, not ERR_TRACK_CAPACITY_EXCEEDED — 100 spots were still free"
            - "The retry with ${v_fresh} returns 201 with ${planned2} == 26590.00"
            - "LoadingTrack.${trk_id}.committed_railcars == 20 and version == 3 — one bump per accepted shipment, none for the rejected attempt"

      - name: third_return_for_revision_is_refused_at_the_cumulative_limit
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.CarbonProject.transitions.SUBMITTED_to_RETURNED_FOR_REVISION
          - validations[priority=53]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          The revision counter is cumulative and never resets on resubmission:
          returns one and two are accepted (revision_count 1 then 2) and the
          third RETURN on a legitimately SUBMITTED project is refused with
          ERR_REVISION_LIMIT_REACHED 422, while CERTIFY on that same submission
          still works.
        test_recipe:
          setup:
            - "Plant exists; carbon project CP-1 has been submitted, returned, resubmitted, returned again and resubmitted, so it is SUBMITTED with revision_count 2."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, baseline_ci_g_per_mj: 58.000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id, ci0: $.data.ci_score_g_per_mj }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/carbon-projects"
              payload: { project_code: "CP-1", project_name: "Combined heat and power retrofit", project_type: "CHP", claimed_reduction_g_per_mj: 8.000, certification_tier: "FULL" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { cp1_id: $.data.id, rc0: $.data.revision_count }
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/submit"
              payload: { verification_body: "Prairie Verification Services" }
              as: ComplianceOfficer
              as_user_id: "co-01"
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/review"
              payload: { determination: "RETURN", review_note: "Metering plan incomplete." }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { rc1: $.data.revision_count, vs1: $.data.verification_status }
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/submit"
              payload: { verification_body: "Prairie Verification Services" }
              as: ComplianceOfficer
              as_user_id: "co-01"
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/review"
              payload: { determination: "RETURN", review_note: "Baseline still unsupported." }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { rc2: $.data.revision_count, vs2: $.data.verification_status }
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/submit"
              payload: { verification_body: "Prairie Verification Services" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { vs3: $.data.verification_status, rc3: $.data.revision_count }
          trigger:
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/review"
              payload: { determination: "RETURN", review_note: "Third attempt at a return." }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${rc0} == 0, ${rc1} == 1 with ${vs1} == RETURNED_FOR_REVISION, ${rc2} == 2 with ${vs2} == RETURNED_FOR_REVISION"
            - "${vs3} == SUBMITTED and ${rc3} == 2 — resubmission does not reset the counter"
            - "${err_id} == ERR_REVISION_LIMIT_REACHED with HTTP 422, not ERR_INVALID_PROJECT_STATE"
            - "CarbonProject.${cp1_id}.verification_status stays SUBMITTED and revision_count stays 2"
            - "${ci0} == 58.000 and Plant.${plant_id}.ci_score_g_per_mj is still 58.000 — nothing has been certified"
            - "A CERTIFY review on the same submission is accepted, taking the project to CERTIFIED with credited_reduction_g_per_mj 8.000 and Plant.${plant_id}.ci_score_g_per_mj 50.000"

      - name: multi_level_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: cascading_side_effect_chain / mechanical_tank_hold_cancels_shipment_which_releases_track_railcars
          rationale: "That instance drives the full tank-hold to shipment-cancel to track-capacity chain and asserts every level, which is the cascade claim for this layer."

      - name: compensating_transition_reverses_every_original_side_effect
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: reversal_invariant_restoration / shipment_cancel_restores_total_denatured_gallons_invariant
          rationale: "That instance cancels a loaded shipment and reconciles the tank, track and plant ledgers back to their pre-load values, which is the compensation claim."

      - name: both_calculation_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calculation_divergence / crush_margin_mark_to_market_vs_realized_diverge_on_same_month
          rationale: "That instance asserts both crush margin variants and their delta on identical data, which is the dual-variant claim for this layer."

      - name: cumulative_intervention_threshold_tested_at_its_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: cyclic_state_machine_with_bounded_loop / fermentation_health_watch_intervention_cycle_third_intervention_blocked
          rationale: "That instance walks the health-watch cycle to the second intervention and asserts the third is refused, which is the cumulative-threshold boundary claim."

  - section: consistency_model
    instances:
      - name: settlement_aggregates_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.plant_inventory_and_coverage
          - calculations.corn_delivery_settlement
        distinguishing_aspect: |
          Nothing lags: the settle response itself already carries
          net_dry_bushels 940.00 and settlement_amount_cents 413600, and the
          contract, plant and delivery reads taken immediately afterwards agree
          with it to the cent and to the bushel — no denormalised field needs a
          second read to catch up.
        test_recipe:
          setup:
            - "Plant exists with a 200000.00 bushel PRICED contract; load TK-0001 has been graded by scale-01 and is awaiting settlement."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id, inv0: $.data.corn_inventory_bushels, cov0: $.data.open_contract_coverage_bushels, pp0: $.data.procurement_posture }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { pstat: $.data.pricing_status, fut: $.data.futures_price_cents_per_bushel }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { gs: $.data.grading_status }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { nd: $.data.net_dry_bushels, amt: $.data.settlement_amount_cents, st: $.data.grading_status }
            - call: "GET /ethanol-ops/corn-contracts/${c1_id}"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { cdel: $.data.bushels_delivered, cstatus: $.data.status }
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { inv1: $.data.corn_inventory_bushels, cov1: $.data.open_contract_coverage_bushels, pp1: $.data.procurement_posture }
          assert:
            - "${inv0} == 0.00, ${cov0} == 0.00, ${pp0} == SHORT on the untouched plant, and ${pstat} == PRICED with ${fut} == 458.0"
            - "${gs} == GRADED before settlement and ${st} == SETTLED in the settle response itself"
            - "${nd} == 940.00 and ${amt} == 413600 in the same settle response, with no second read needed, over net_price_cents_per_bushel 440.00 (futures 458.0 plus basis -18.0, no discounts at these grades)"
            - "${cdel} == 940.00 and ${cstatus} == PARTIALLY_FILLED"
            - "${inv1} == 940.00, ${cov1} == 199060.00 and ${pp1} == ADEQUATE — the aggregate crossed the 5000 bushel coverage floor on the first read"
