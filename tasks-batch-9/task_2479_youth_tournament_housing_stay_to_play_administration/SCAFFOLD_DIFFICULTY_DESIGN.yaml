            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 6, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block1_id: "$.data.id" }
          trigger:
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "KING", block_size_rooms: 5, arrival_date: "2026-09-12", departure_date: "2026-09-15", release_deadline: "2026-08-25" }
              as: HousingManager
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "KING", block_size_rooms: 5, arrival_date: "2026-09-13", departure_date: "2026-09-15", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block2_id: "$.data.id" }
          assert:
            - "first response.status == 409"
            - "first response.error.error_id == ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED"
            - "RoomBlock.${block1_id}.block_size_rooms == 6"
            - "RoomBlock.${block1_id}.status == OPEN"
            - "RoomBlock.${block2_id}.block_size_rooms == 5"
            - "RoomBlock.${block2_id}.arrival_date == 2026-09-13"
            - "RoomBlock.${block2_id}.departure_date == 2026-09-15"
            - "RoomBlock.${block2_id}.status == OPEN"
            - "RoomBlock.${block2_id}.rooms_available == 5"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: room_inventory_conservation_confirm_then_cancel
        grounds:
          - calculations.invariant_room_inventory_conservation
          - calculations.block_rooms_committed
          - state_machines.RoomBlock (OPEN -> RESTRICTED and RESTRICTED -> OPEN)
          - state_machines.Booking (CONFIRMED -> CANCELLED)
        distinguishing_aspect: |
          Conserved quantity is PHYSICAL ROOM COUNT in a block: while the block is live,
          rooms_committed + rooms_available must equal block_size_rooms and rooms_released_unsold
          must stay 0. The confirm consumes all 5 rooms and drives the block to RESTRICTED; the
          compensating cancel must restore rooms_committed to 0, rooms_available to 5 and
          utilization_pct to 0.0, and must walk the block back RESTRICTED -> OPEN together with
          the contract posture and the tournament pressure. The cancel is priced at exactly the
          45-day free tier so no penalty cents mask an inventory leak.
        test_recipe:
          setup:
            - "Tournament 2026-09-15 to 2026-09-18 (night_count 3), posture OPEN, booking_deadline 2026-09-10T00:00:00Z."
            - "Exactly one EXECUTED HotelContract with exactly one 5-room block over 2026-09-15 to 2026-09-18."
            - "One registration with 13 players and 3 staff, and a ROOMING_LIST_SUBMITTED booking for all 5 rooms (projected_room_nights 15)."
            - "The logical clock stays at its default 2026-08-01T00:00:00Z, exactly 45 days before check-in, so the cancel is free."
          setup_api_calls:
            - call: "POST /housing/tournaments"
