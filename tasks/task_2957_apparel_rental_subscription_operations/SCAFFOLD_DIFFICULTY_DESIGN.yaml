          - "1.3 calculation turn_revenue_attribution"
        distinguishing_aspect: >-
          avg_margin_per_turn_cents is pinned to one evaluation order: divide each unit's own margin by its own
          chargeable turn count, round_half_up each per-unit quotient, then average the rounded quotients with a final
          round_half_up. On this fixture that order yields -20556 while the two plausible alternatives yield visibly
          different integers: aggregating first (total margin -61667 over 3 chargeable turns) gives -61667 per turn
          (an error of 41111), and truncating toward zero instead of rounding half up gives -20555. The three
          candidate answers are distinct, so the assertion falsifies any implementation that reorders the division,
          the rounding or the averaging.
