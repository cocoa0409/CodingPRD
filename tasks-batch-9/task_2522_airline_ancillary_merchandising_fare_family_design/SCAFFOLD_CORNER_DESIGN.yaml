              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC533", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "PARCH1", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_ota_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_ota_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/disclosure"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_ota_id}"
