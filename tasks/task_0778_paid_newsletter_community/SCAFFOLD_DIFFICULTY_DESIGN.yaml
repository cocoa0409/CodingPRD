# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Paid-Newsletter & Membership Community — Expert
# 9 rule_ids × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: proration_provisional_remaining_days_on_subscription
        grounds:
          - calculations.subscription_proration
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: "Change-tier proration bills remaining_days_forward (24 of 30 → factor 0.8), so the PRORATION_UPGRADE invoice amount_due_cents == 1200; the alternate elapsed-days reading (6/30 → 300) is wrong. Dual-variant on the SUBSCRIPTION domain."
        test_recipe:
          setup:
            - "Publication (fee_bps 1000); PLUS tier (rank 1, 1000, trial 0); PRO tier (rank 2, 2500, trial 0)"
            - "Verified member with an ACTIVE PLUS subscription; period 2026-03-01..2026-03-31; clock advanced to 2026-03-07 before change-tier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Plus", tier_rank: 1, monthly_price_cents: 1000, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { plus_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m1@x.com", display_name: "M1" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${plus_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { init_inv_id: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${init_inv_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/change-tier"
              payload: { new_tier_id: "${pro_tier_id}", expected_subscription_version: "${sub_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { pro_inv_id: "$.data[1].id" }
          assert:
            - "The PRORATION_UPGRADE Invoice for ${sub_id} has amount_due_cents == 1200"
            - "The PRORATION_UPGRADE Invoice reason == PRORATION_UPGRADE"
            - "Subscription.${sub_id}.current_tier_rank == 2"

      - name: publication_mrr_forward_vs_recognized_chronological
        grounds:
          - calculations.publication_revenue
          - entities.Publication.fields.mrr_cents
          - entities.Publication.fields.recognized_revenue_cents
        distinguishing_aspect: "One ACTIVE PRO sub (paid) plus one TRIALING PLUS sub (unpaid) give mrr_cents == 3500 (forward, counts trial at full price) but recognized_revenue_cents == 2250 (chronological, only collected creator_net). Dual-variant on the PUBLICATION domain."
        test_recipe:
          setup:
            - "Publication fee_bps 1000; PRO tier (2500, trial 0); PLUS tier (1000, trial 14)"
            - "Member A: ACTIVE PRO subscription (initial invoice paid → net 2250). Member B: TRIALING PLUS subscription (initial invoice OPEN)"
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Plus", tier_rank: 1, monthly_price_cents: 1000, trial_days: 14 }
              as: Creator
              as_user_id: "creator_1"
              captures: { plus_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "a@x.com", display_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id, tok_a: $.data.verification_token }
            - call: "POST /members/${a_id}/verify"
              payload: { verification_token: "${tok_a}" }
              as: Anonymous
            - call: "POST /members/${a_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { sub_a: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_a}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_a}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "b@x.com", display_name: "B" }
              as: Anonymous
              captures: { b_id: $.data.id, tok_b: $.data.verification_token }
            - call: "POST /members/${b_id}/verify"
              payload: { verification_token: "${tok_b}" }
              as: Anonymous
            - call: "POST /members/${b_id}/subscriptions"
              payload: { tier_id: "${plus_tier_id}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { sub_b: $.data.id }
          trigger:
            - call: "GET /publications/${pub_id}/analytics"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { mrr: $.data.mrr_cents, rec: $.data.recognized_revenue_cents }
          assert:
            - "Publication.${pub_id}.mrr_cents == 3500"
            - "Publication.${pub_id}.recognized_revenue_cents == 2250"
            - "Publication.${pub_id}.active_member_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: winback_invoice_nested_max_discount_mode_a
        grounds:
          - calculations.invoice_amount_due
          - calculations.win_back_discount
          - state_machines.Subscription.CANCELED_to_ACTIVE
        distinguishing_aspect: "Mode (a): WIN_BACK invoice amount_due_cents = round_half_up(max(0, base 2500 - discount 500) * 1.0) == 2000 with discount_cents == 500, exercising the conditional discount branch and nested max. Distinct mode from the rounding-order instance."
        test_recipe:
          setup:
            - "Publication fee_bps 1000; PRO tier (2500, trial 0); member with an ACTIVE PRO subscription then CANCELED (within win-back window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/reactivate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { wb_inv: "$.data[1].id" }
          assert:
            - "The WIN_BACK Invoice for ${sub_id} has discount_cents == 500"
            - "The WIN_BACK Invoice for ${sub_id} has amount_due_cents == 2000"
            - "Subscription.${sub_id}.is_win_back == true"

      - name: payout_balance_per_invoice_fee_rounding_mode_b
        grounds:
          - calculations.platform_fee_and_creator_net
          - entities.Publication.fields.payout_balance_cents
          - entities.Invoice.fields.creator_net_cents
        distinguishing_aspect: "Mode (b): two 1005-cent invoices at 1000 bps round the fee PER INVOICE (round_half_up(100.5)=101 → net 904 each) so payout_balance_cents == 1808; the sum-then-fee order (round(201.0)=201 → 1809) is rejected. Distinct mode from the nested-max win-back instance."
        test_recipe:
          setup:
            - "Publication fee_bps 1000; two tiers both priced 1005 (rank 1 and rank 2, trial 0); two members each with an ACTIVE subscription whose INITIAL invoice (1005) is PAID"
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "T1", tier_rank: 1, monthly_price_cents: 1005, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { t1: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "T2", tier_rank: 2, monthly_price_cents: 1005, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { t2: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "a@x.com", display_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id, tok_a: $.data.verification_token }
            - call: "POST /members/${a_id}/verify"
              payload: { verification_token: "${tok_a}" }
              as: Anonymous
            - call: "POST /members/${a_id}/subscriptions"
              payload: { tier_id: "${t1}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { sub_a: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_a}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_a}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "b@x.com", display_name: "B" }
              as: Anonymous
              captures: { b_id: $.data.id, tok_b: $.data.verification_token }
            - call: "POST /members/${b_id}/verify"
              payload: { verification_token: "${tok_b}" }
              as: Anonymous
            - call: "POST /members/${b_id}/subscriptions"
              payload: { tier_id: "${t2}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { sub_b: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_b}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_b}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { bal: $.data.payout_balance_cents }
          assert:
            - "Publication.${pub_id}.payout_balance_cents == 1808"
            - "Publication.${pub_id}.lifetime_net_cents == 1808"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_winback_cycle_canceled_back_to_active
        grounds:
          - state_machines.Subscription.CANCELED_to_ACTIVE
          - state_machines.Subscription.ACTIVE_to_CANCELED
          - entities.Subscription.fields.reactivation_count
        distinguishing_aspect: "Subscription cycles ACTIVE→CANCELED→ACTIVE via win-back reactivation (a cycle, not a linear pipeline); reactivation_count == 1 after the loop. On the Subscription entity."
        test_recipe:
          setup:
            - "Publication; PRO tier (2500, trial 0); member with ACTIVE PRO subscription, then CANCELED within win-back window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/reactivate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.reactivation_count == 1"
            - "Subscription.${sub_id}.is_win_back == true"

      - name: comment_moderation_fork_pending_to_held_to_approved
        grounds:
          - state_machines.Comment.PENDING_to_HELD
          - state_machines.Comment.HELD_to_APPROVED
          - entities.Post.fields.approved_comment_count
        distinguishing_aspect: "Comment forks PENDING→HELD (one of three PENDING outcomes) then HELD→APPROVED — a branching machine; Post.approved_comment_count == 1 only after final APPROVE. On the Comment entity (different entity from Subscription)."
        test_recipe:
          setup:
            - "Publication; FREE tier (rank 0, 0, trial 0); PUBLISHED post (min_tier_rank 0); member with ACTIVE free subscription who posts a PENDING comment"
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { free_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${free_tier_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /publications/${pub_id}/posts"
              payload: { title: "Hello", body: "World", content_type: "POST", min_tier_rank: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { post_id: $.data.id }
            - call: "POST /posts/${post_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
            - call: "POST /posts/${post_id}/comments"
              payload: { body: "nice" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmt_id: $.data.id }
          trigger:
            - call: "POST /comments/${cmt_id}/moderate"
              payload: { decision: "HOLD" }
              as: Creator
              as_user_id: "creator_1"
            - call: "POST /comments/${cmt_id}/moderate"
              payload: { decision: "APPROVE" }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Comment.${cmt_id}.status == APPROVED"
            - "Post.${post_id}.approved_comment_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: subscription_cancel_cascades_seat_release_and_waitlist_promote
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELED
          - state_machines.EventRegistration.REGISTERED_to_CANCELED
          - state_machines.EventRegistration.WAITLISTED_to_REGISTERED
          - entities.Event.fields.registered_count
        distinguishing_aspect: "Depth-3 chain triggered by subscription cancel: Subscription.CANCELED → member A's REGISTERED registration → CANCELED → Event seat freed → earliest WAITLISTED (B) promoted to REGISTERED. registered_count stays 1, waitlist_count 0."
        test_recipe:
          setup:
            - "Publication; PRO tier; future Event (capacity 1, allow_waitlist true, starts 2026-04-01). Member A ACTIVE PRO sub REGISTERED; Member B ACTIVE PRO sub WAITLISTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_tier_id: $.data.id }
            - call: "POST /publications/${pub_id}/events"
              payload: { title: "Webinar", starts_at: "2026-04-01T10:00:00Z", ends_at: "2026-04-01T11:00:00Z", registration_closes_at: "2026-03-31T00:00:00Z", capacity: 1, min_tier_rank: 0, allow_waitlist: true }
              as: Creator
              as_user_id: "creator_1"
              captures: { ev_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "a@x.com", display_name: "A" }
              as: Anonymous
              captures: { a_id: $.data.id, tok_a: $.data.verification_token }
            - call: "POST /members/${a_id}/verify"
              payload: { verification_token: "${tok_a}" }
              as: Anonymous
            - call: "POST /members/${a_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${a_id}"
              captures: { sub_a: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_a}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_a}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /events/${ev_id}/registrations"
              payload: {}
              as: Member
              as_user_id: "${a_id}"
              captures: { reg_a: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "b@x.com", display_name: "B" }
              as: Anonymous
              captures: { b_id: $.data.id, tok_b: $.data.verification_token }
            - call: "POST /members/${b_id}/verify"
              payload: { verification_token: "${tok_b}" }
              as: Anonymous
            - call: "POST /members/${b_id}/subscriptions"
              payload: { tier_id: "${pro_tier_id}" }
              as: Member
              as_user_id: "${b_id}"
              captures: { sub_b: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_b}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_b}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /events/${ev_id}/registrations"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { reg_b: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_a}/cancel"
              payload: {}
              as: Member
              as_user_id: "${a_id}"
          assert:
            - "EventRegistration.${reg_a}.status == CANCELED"
            - "EventRegistration.${reg_b}.status == REGISTERED"
            - "Event.${ev_id}.registered_count == 1"
            - "Event.${ev_id}.waitlist_count == 0"
            - "Event.${ev_id}.available_slots == 0"

      - name: email_bounce_cascades_bounce_count_to_deliverability_suspend
        grounds:
          - state_machines.Publication.HEALTHY_to_SUSPENDED
          - calculations.bounce_rate_posture
          - entities.Publication.fields.deliverability_status
        distinguishing_aspect: "Depth-2 chain triggered by an email bounce: /_email/bounce → Publication.bounce_count 0→1 → bounce_rate recompute (1/2 == 0.50) → deliverability_status → SUSPENDED. Different trigger from subscription cancel."
        test_recipe:
          setup:
            - "Publication; FREE tier (rank 0); two VERIFIED members each with ACTIVE free subscription; one NEWSLETTER post SENT to both (sent_count 2)"
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "Pub", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
