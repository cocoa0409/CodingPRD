scenario: |
  Millwork & Door Manufacturing Plant (architectural millwork plant): order configuration (species/profile/hardware prep), shop drawing & submittal approval, machining program & moulder setup, finishing & sheen matching, fire-rating & label control, hardware prep template vs installer, jobsite delivery by opening schedule, punch-list rework

domain_name: millwork-door-plant
api_prefix: /millwork

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - version_pinning_on_approval
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: site_address, type: string, source: input, description: "Jobsite delivery address" }
      - { name: contract_code, type: string, source: input, description: "Customer contract code; unique across all projects", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | ARCHIVED" }

  - name: HardwareTemplate
    parent: null
    common_fields: true
    fields:
      - { name: template_code, type: string, source: input, description: "Manufacturer template code; unique", constraints: "unique" }
      - { name: manufacturer, type: string, source: input, description: "Hardware manufacturer name" }
      - { name: fire_rated_compatible, type: boolean, source: input, description: "Whether this template may be used on fire-rated openings" }

  - name: MoulderMachine
    parent: null
    common_fields: true
    fields:
      - { name: machine_code, type: string, source: input, description: "Shop machine code; unique", constraints: "unique" }
      - { name: supported_species, type: array, source: input, description: "Species codes this machine's tooling can run: subset of OAK|MAPLE|CHERRY|WALNUT|PAINT_GRADE" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the machine accepts new setup slots" }

  - name: SprayBooth
    parent: null
    common_fields: true
    fields:
      - { name: booth_code, type: string, source: input, description: "Booth code; unique", constraints: "unique" }
      - { name: capacity, type: integer, source: input, default: 2, description: "Maximum number of curing batches whose cure windows may overlap" }

  - name: FireLabelRoll
    parent: null
    common_fields: true
    fields:
      - { name: label_series, type: enum, source: input, description: "UL_20MIN | UL_45MIN | UL_90MIN — must match opening fire rating" }
      - { name: serial_capacity, type: integer, source: input, description: "Total serialized labels on the roll" }
      - { name: serials_issued, type: integer, source: computed, default: 0, description: "Serials currently outstanding in ISSUED allocations" }
      - { name: serials_applied, type: integer, source: computed, default: 0, description: "Serials in APPLIED or VERIFIED allocations" }
      - { name: serials_spoiled, type: integer, source: computed, default: 0, description: "Serials destroyed by voided allocations (never returned)" }
      - { name: serials_available, type: integer, source: computed, description: "= serial_capacity - serials_issued - serials_applied - serials_spoiled" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | RETIRED" }

  - name: MillworkOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project" }
      - { name: order_code, type: string, source: input, description: "Order code; unique within project", constraints: "unique within project_id" }
      - { name: species, type: enum, source: input, description: "OAK | MAPLE | CHERRY | WALNUT | PAINT_GRADE" }
      - { name: profile_code, type: string, source: input, description: "Sticking/profile code for the moulder knives" }
      - { name: finish_system, type: enum, source: input, description: "CLEAR_COAT | STAIN | PAINT" }
      - { name: sheen_target, type: enum, source: input, description: "MATTE | SATIN | SEMI_GLOSS | HIGH_GLOSS" }
      - { name: hardware_prep_mode, type: enum, source: input, description: "TEMPLATE_PREP (plant mortises per template) | INSTALLER_PREP (field prep by installer)" }
      - { name: hardware_template_id, type: string, source: input, description: "FK -> HardwareTemplate.id; required when hardware_prep_mode == TEMPLATE_PREP", constraints: "required iff TEMPLATE_PREP" }
      - { name: fire_rating_required, type: enum, source: input, description: "NONE | MIN_20 | MIN_45 | MIN_90 — maximum rating any opening may carry" }
      - { name: config_locked, type: boolean, source: system, default: false, description: "True once a shop drawing is APPROVED; config edits blocked while locked" }
      - { name: budget_quote_cents, type: integer, source: computed, description: "Provisional BUDGET-variant price computed at CONFIGURE" }
      - { name: merchandise_total_cents, type: integer, source: computed, description: "CONTRACT-variant merchandise total (sum of per-line rounded line totals) at drawing approval" }
      - { name: freight_fee_cents, type: integer, source: computed, description: "Freight tier fee keyed on merchandise_total_cents at drawing approval" }
      - { name: contract_price_cents, type: integer, source: computed, description: "= merchandise_total_cents + freight_fee_cents at drawing approval" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIGURED | SUBMITTED | APPROVED | IN_PRODUCTION | FINISHING | READY_TO_SHIP | SHIPPED | CLOSED | CANCELLED" }

  - name: Opening
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MillworkOrder.id; owning order" }
      - { name: opening_no, type: string, source: input, description: "Architectural opening number; unique within order", constraints: "unique within order_id" }
      - { name: width_in, type: number, source: input, description: "Opening width in inches" }
      - { name: height_in, type: number, source: input, description: "Opening height in inches" }
      - { name: leaf_count, type: integer, source: input, default: 1, description: "Number of door leaves hanging in this opening" }
      - { name: fire_rating, type: enum, source: input, description: "NONE | MIN_20 | MIN_45 | MIN_90; rank must be <= order.fire_rating_required rank" }
      - { name: required_on_site_date, type: string, source: input, description: "ISO date the opening must be on the jobsite" }
      - { name: fab_status, type: enum, source: system, description: "Fabrication axis: QUEUED | MACHINED | FINISHED | LABELED | STAGED | REWORK | CANCELLED" }
      - { name: ship_status, type: enum, source: system, description: "Delivery axis: UNSCHEDULED | SCHEDULED | SHIPPED | DELIVERED | PUNCH_LISTED | ACCEPTED | CANCELLED" }
      - { name: assigned_trip_id, type: string, source: system, description: "FK -> DeliveryTrip.id; set on assign, cleared on unassign/cancel", constraints: "nullable" }

  - name: ShopDrawing
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MillworkOrder.id; order this submittal covers" }
      - { name: revision_no, type: integer, source: system, description: "1-based revision counter per order, server-assigned" }
      - { name: pinned_species, type: string, source: system, description: "Snapshot of order.species at creation (version pinning)" }
      - { name: pinned_profile_code, type: string, source: system, description: "Snapshot of order.profile_code at creation" }
      - { name: pinned_sheen_target, type: string, source: system, description: "Snapshot of order.sheen_target at creation" }
      - { name: pinned_fire_rating_required, type: string, source: system, description: "Snapshot of order.fire_rating_required at creation" }
      - { name: pinned_hardware_prep_mode, type: string, source: system, description: "Snapshot of order.hardware_prep_mode at creation" }
      - { name: supersedes_drawing_id, type: string, source: system, description: "FK -> ShopDrawing.id; previous revision of the same order, null on revision 1", constraints: "nullable" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID captured at SUBMIT", constraints: "nullable" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the Architect reviewer", constraints: "nullable" }
      - { name: review_note, type: string, source: system, description: "Review note supplied on APPROVED/REJECTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED | VOID" }

  - name: MachiningProgram
    parent: null
    common_fields: true
    fields:
      - { name: drawing_id, type: string, source: input, description: "FK -> ShopDrawing.id; approved drawing this program machines" }
      - { name: order_id, type: string, source: input, description: "FK -> MillworkOrder.id; must equal drawing.order_id" }
      - { name: program_code, type: string, source: system, description: "Server-generated program code" }
      - { name: estimated_minutes, type: integer, source: input, description: "Estimated machining minutes" }
      - { name: status, type: enum, source: system, description: "CREATED | SETUP_BOOKED | PROVEN | RELEASED | VOIDED" }

  - name: MoulderSetupSlot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MachiningProgram.id; program being set up" }
      - { name: machine_id, type: string, source: input, description: "FK -> MoulderMachine.id; machine reserved" }
      - { name: species, type: string, source: system, description: "Copied from the program's order species at booking (drives changeover buffer)" }
      - { name: start_hour, type: integer, source: input, description: "Shop-hour index, inclusive" }
      - { name: end_hour, type: integer, source: input, description: "Shop-hour index, exclusive; must be > start_hour" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED" }

  - name: FinishingBatch
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> MillworkOrder.id; order being finished" }
      - { name: booth_id, type: string, source: input, description: "FK -> SprayBooth.id; booth occupied during cure window" }
      - { name: finish_family, type: string, source: system, description: "Copied from order.finish_system mapped to family: PAINT -> PAINT, CLEAR_COAT/STAIN -> CLEAR_STAIN" }
      - { name: cure_start_hour, type: integer, source: input, description: "Cure window start, inclusive" }
      - { name: cure_end_hour, type: integer, source: input, description: "Cure window end, exclusive; end - start >= 4" }
      - { name: sheen_target_gu, type: integer, source: system, description: "Gloss-unit target mapped from order.sheen_target: MATTE 15, SATIN 35, SEMI_GLOSS 60, HIGH_GLOSS 85" }
      - { name: sheen_measured_gu, type: number, source: input, description: "Measured gloss units submitted at measure", constraints: "nullable until measured" }
      - { name: delta_gu, type: number, source: computed, description: "= abs(sheen_measured_gu - sheen_target_gu) at measure", constraints: "nullable until measured" }
      - { name: is_rework_batch, type: boolean, source: input, default: false, description: "True when this batch refinishes REWORK openings" }
      - { name: status, type: enum, source: system, description: "MIXED | SPRAYED | CURED | PASSED | FAILED" }

  - name: LabelAllocation
    parent: null
    common_fields: true
    fields:
      - { name: opening_id, type: string, source: input, description: "FK -> Opening.id; rated opening receiving labels" }
      - { name: roll_id, type: string, source: input, description: "FK -> FireLabelRoll.id; roll serials are drawn from" }
      - { name: serial_count, type: integer, source: system, description: "= opening.leaf_count at issuance (one label per leaf)" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of issuing LabelAuthority" }
      - { name: applied_by, type: string, source: system, description: "X-User-ID of applying ProductionLead", constraints: "nullable" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of verifying QAInspector", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ISSUED | APPLIED | VERIFIED | VOIDED" }

  - name: DeliveryTrip
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; jobsite this trip serves" }
      - { name: trip_code, type: string, source: input, description: "Trip code" }
      - { name: truck_capacity_leaves, type: integer, source: input, description: "Maximum leaves the truck can carry" }
      - { name: departure_date, type: string, source: input, description: "ISO departure date" }
      - { name: site_arrival_date, type: string, source: input, description: "ISO jobsite arrival date; must be >= departure_date" }
      - { name: leaves_committed, type: integer, source: computed, default: 0, description: "= sum of leaf_count over assigned openings with ship_status == SCHEDULED" }
      - { name: projected_fill_pct, type: number, source: computed, description: "Forward-looking fill: (leaves_committed + leaves of project openings with fab_status == STAGED and ship_status == UNSCHEDULED) / truck_capacity_leaves * 100, 1 decimal round_half_up" }
      - { name: realized_fill_pct, type: number, source: computed, description: "Settled fill: leaves_committed / truck_capacity_leaves * 100 at DEPARTED, 1 decimal round_half_up", constraints: "nullable until DEPARTED" }
      - { name: status, type: enum, source: system, description: "PLANNED | DEPARTED | DELIVERED | CLOSED | CANCELLED" }

  - name: PunchItem
    parent: null
    common_fields: true
    fields:
      - { name: opening_id, type: string, source: input, description: "FK -> Opening.id; delivered opening with the deficiency" }
      - { name: category, type: enum, source: input, description: "FINISH_DEFECT | HARDWARE_MISALIGNMENT | TRANSIT_DAMAGE | LABEL_MISSING" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of reporter" }
      - { name: rework_batch_id, type: string, source: system, description: "FK -> FinishingBatch.id; linked rework batch for FINISH_DEFECT items", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | REWORK_AUTHORIZED | IN_REWORK | RESOLVED | VERIFIED | REJECTED_INVALID" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "PUT /millwork/projects/{id}/status {target_status: COMPLETED}"
        actor: PlantManager
        preconditions:
          - "Every MillworkOrder of the project is in CLOSED or CANCELLED (ERR_ORDERS_NOT_TERMINAL)"
        side_effects: []
      - from: COMPLETED
        to: ARCHIVED
        trigger: "PUT /millwork/projects/{id}/status {target_status: ARCHIVED}"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ARCHIVED
        trigger: "PUT /millwork/projects/{id}/status {target_status: ARCHIVED}"
        actor: PlantManager
        preconditions: []
        side_effects: []
        note: "undeclared from->to pairs reject with ERR_INVALID_PROJECT_STATUS_TRANSITION; terminal states accept no transition"

  - entity: MillworkOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIGURED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CONFIGURED}"
        actor: Estimator
        preconditions:
          - "At least one Opening with fab_status != CANCELLED exists (ERR_NO_OPENINGS)"
          - "hardware_prep_mode == TEMPLATE_PREP requires hardware_template_id present (ERR_TEMPLATE_REQUIRED)"
          - "fire_rating_required != NONE requires hardware_prep_mode == TEMPLATE_PREP (ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP)"
          - "fire_rating_required != NONE requires linked HardwareTemplate.fire_rated_compatible == true (ERR_TEMPLATE_NOT_FIRE_RATED)"
        side_effects:
          - "Compute budget_quote_cents via order_pricing BUDGET variant"
      - from: CONFIGURED
        to: SUBMITTED
        trigger: "system cascade: ShopDrawing DRAFT->SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CONFIGURED
        trigger: "system cascade: ShopDrawing SUBMITTED->REJECTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "system cascade: ShopDrawing SUBMITTED->APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "config_locked = true"
          - "Compute merchandise_total_cents, freight_fee_cents, contract_price_cents via order_pricing CONTRACT variant + invoice_line_rounding + freight_fee_schedule"
      - from: APPROVED
        to: CONFIGURED
        trigger: "POST /millwork/orders/{id}/change-order"
        actor: Estimator
        preconditions:
          - "No MachiningProgram in RELEASED status exists for the order's current APPROVED (non-SUPERSEDED) drawing (ERR_PRODUCTION_ALREADY_RELEASED)"
        side_effects:
          - "Current APPROVED ShopDrawing -> SUPERSEDED"
          - "That drawing's MachiningPrograms in CREATED, SETUP_BOOKED or PROVEN -> VOIDED"
          - "Those programs' MoulderSetupSlots in BOOKED -> CANCELLED"
          - "config_locked = false"
      - from: APPROVED
        to: IN_PRODUCTION
        trigger: "PUT /millwork/orders/{id}/status {target_status: IN_PRODUCTION}"
        actor: ProductionLead
        preconditions:
          - "At least one MachiningProgram in RELEASED status exists whose drawing is the order's current APPROVED drawing (ERR_NO_RELEASED_PROGRAM)"
        side_effects: []
      - from: IN_PRODUCTION
        to: FINISHING
        trigger: "PUT /millwork/orders/{id}/status {target_status: FINISHING}"
        actor: ProductionLead
        preconditions:
          - "Every non-CANCELLED Opening has fab_status in {MACHINED, FINISHED, LABELED, STAGED} (ERR_OPENINGS_NOT_MACHINED)"
        side_effects: []
      - from: FINISHING
        to: READY_TO_SHIP
        trigger: "PUT /millwork/orders/{id}/status {target_status: READY_TO_SHIP}"
        actor: ProductionLead
        preconditions:
          - "Every non-CANCELLED Opening has fab_status == STAGED (ERR_OPENINGS_NOT_STAGED)"
        side_effects: []
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "PUT /millwork/orders/{id}/status {target_status: SHIPPED}"
        actor: ShippingCoordinator
        preconditions:
          - "Every non-CANCELLED Opening has ship_status in {SHIPPED, DELIVERED, PUNCH_LISTED, ACCEPTED} (ERR_OPENINGS_NOT_SHIPPED)"
        side_effects: []
      - from: SHIPPED
        to: CLOSED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CLOSED}"
        actor: PlantManager
        preconditions:
          - "Every non-CANCELLED Opening has ship_status == ACCEPTED (ERR_OPENINGS_NOT_ACCEPTED)"
          - "No PunchItem of any opening of the order is in {REPORTED, TRIAGED, REWORK_AUTHORIZED, IN_REWORK, RESOLVED} (ERR_OPEN_PUNCH_ITEMS)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CANCELLED}"
        actor: Estimator
        preconditions:
          - "Current status in {DRAFT, CONFIGURED, SUBMITTED, APPROVED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Openings in non-terminal states -> CANCELLED on both axes; assigned openings detached (assigned_trip_id cleared) and their trips recompute leaves_committed"
          - "ShopDrawings in {DRAFT, SUBMITTED} -> VOID; APPROVED drawing -> SUPERSEDED"
          - "MachiningPrograms in {CREATED, SETUP_BOOKED, PROVEN, RELEASED} -> VOIDED; their BOOKED slots -> CANCELLED"
          - "LabelAllocations of the order's openings in {ISSUED, APPLIED} -> VOIDED; roll serials move to serials_spoiled"
      - from: CONFIGURED
        to: CANCELLED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CANCELLED}"
        actor: Estimator
        preconditions:
          - "Current status in {DRAFT, CONFIGURED, SUBMITTED, APPROVED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: ["same cascade as DRAFT->CANCELLED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CANCELLED}"
        actor: Estimator
        preconditions:
          - "Current status in {DRAFT, CONFIGURED, SUBMITTED, APPROVED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: ["same cascade as DRAFT->CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "PUT /millwork/orders/{id}/status {target_status: CANCELLED}"
        actor: Estimator
        preconditions:
          - "Current status in {DRAFT, CONFIGURED, SUBMITTED, APPROVED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: ["same cascade as DRAFT->CANCELLED"]

  - entity: Opening
    initial_state: "QUEUED (fab axis) / UNSCHEDULED (ship axis) — two parallel state dimensions on one entity"
    terminal_states: ["fab: CANCELLED", "ship: ACCEPTED, CANCELLED"]
    transitions:
      - from: "fab QUEUED"
        to: "fab MACHINED"
        trigger: "PUT /millwork/openings/{id}/status {target_fab_status: MACHINED}"
        actor: ProductionLead
        preconditions:
          - "Order.status == IN_PRODUCTION (ERR_ORDER_NOT_IN_PRODUCTION)"
        side_effects: []
      - from: "fab MACHINED"
        to: "fab FINISHED"
        trigger: "system cascade: a FinishingBatch of the same order transitions to PASSED"
        actor: system
        preconditions: []
        side_effects: []
        note: "Batch PASSED moves every opening of the order in {MACHINED, REWORK} to FINISHED"
      - from: "fab REWORK"
        to: "fab FINISHED"
        trigger: "system cascade: rework FinishingBatch PASSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fab FINISHED"
        to: "fab LABELED"
        trigger: "system cascade: LabelAllocation ISSUED->APPLIED on this opening"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fab FINISHED"
        to: "fab STAGED"
        trigger: "PUT /millwork/openings/{id}/status {target_fab_status: STAGED}"
        actor: ProductionLead
        preconditions:
          - "fire_rating == NONE (rated openings must pass through LABELED; ERR_LABELING_REQUIRED)"
        side_effects: []
      - from: "fab LABELED"
        to: "fab STAGED"
        trigger: "PUT /millwork/openings/{id}/status {target_fab_status: STAGED}"
        actor: ProductionLead
        preconditions:
          - "An allocation on this opening has status == VERIFIED (ERR_LABEL_NOT_VERIFIED)"
        side_effects: []
      - from: "fab FINISHED"
        to: "fab REWORK"
        trigger: "system cascade: PunchItem TRIAGED->REWORK_AUTHORIZED on this opening"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fab LABELED"
        to: "fab REWORK"
        trigger: "system cascade: PunchItem TRIAGED->REWORK_AUTHORIZED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fab STAGED"
        to: "fab REWORK"
        trigger: "system cascade: PunchItem TRIAGED->REWORK_AUTHORIZED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ship UNSCHEDULED"
        to: "ship SCHEDULED"
        trigger: "system cascade: POST /millwork/delivery-trips/{id}/assign"
        actor: system
        preconditions: []
        side_effects: ["assigned_trip_id set"]
      - from: "ship SCHEDULED"
        to: "ship UNSCHEDULED"
        trigger: "system cascade: POST /millwork/delivery-trips/{id}/unassign or trip CANCELLED"
        actor: system
        preconditions: []
        side_effects: ["assigned_trip_id cleared"]
      - from: "ship SCHEDULED"
        to: "ship SHIPPED"
        trigger: "system cascade: DeliveryTrip PLANNED->DEPARTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ship SHIPPED"
        to: "ship DELIVERED"
        trigger: "system cascade: DeliveryTrip DEPARTED->DELIVERED"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ship DELIVERED"
        to: "ship PUNCH_LISTED"
        trigger: "system cascade: first PunchItem REPORTED on this opening"
        actor: system
        preconditions: []
        side_effects: []
      - from: "ship DELIVERED"
        to: "ship ACCEPTED"
        trigger: "POST /millwork/openings/{id}/accept"
        actor: QAInspector
        preconditions:
          - "No PunchItem on this opening in {REPORTED, TRIAGED, REWORK_AUTHORIZED, IN_REWORK, RESOLVED} (ERR_OPEN_PUNCH_ITEMS)"
        side_effects: []
      - from: "ship PUNCH_LISTED"
        to: "ship ACCEPTED"
        trigger: "POST /millwork/openings/{id}/accept"
        actor: QAInspector
        preconditions:
          - "Every PunchItem on this opening is in {VERIFIED, REJECTED_INVALID} (ERR_OPEN_PUNCH_ITEMS)"
          - "fab_status == STAGED (rework loop fully re-staged; ERR_OPENING_NOT_RESTAGED)"
        side_effects: []
      - from: "any non-terminal fab/ship combination"
        to: "CANCELLED (both axes)"
        trigger: "system cascade: MillworkOrder -> CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShopDrawing
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PUT /millwork/shop-drawings/{id}/status {target_status: SUBMITTED}"
        actor: Estimator
        preconditions:
          - "Order.status == CONFIGURED (ERR_ORDER_NOT_CONFIGURED)"
          - "No other drawing of the same order is in SUBMITTED (ERR_ACTIVE_DRAWING_EXISTS)"
        side_effects:
          - "submitted_by = X-User-ID"
          - "Order CONFIGURED -> SUBMITTED; increments MillworkOrder.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "PUT /millwork/shop-drawings/{id}/status {target_status: APPROVED, review_note?}"
        actor: Architect
        preconditions:
          - "X-User-ID != submitted_by (segregation of duties; ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "reviewed_by = X-User-ID; review_note recorded"
          - "Order SUBMITTED -> APPROVED; config_locked = true; CONTRACT-variant price fields computed"
          - "Previous APPROVED drawing of the same order (if any) -> SUPERSEDED; its MachiningPrograms in {CREATED, SETUP_BOOKED, PROVEN} -> VOIDED; those programs' BOOKED MoulderSetupSlots -> CANCELLED"
          - "increments MillworkOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "PUT /millwork/shop-drawings/{id}/status {target_status: REJECTED, review_note?}"
        actor: Architect
        preconditions: []
        side_effects:
          - "reviewed_by = X-User-ID; review_note recorded"
          - "Order SUBMITTED -> CONFIGURED; increments MillworkOrder.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "PUT /millwork/shop-drawings/{id}/status {target_status: VOID}"
        actor: Estimator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade: a later revision of the same order is APPROVED, or order change-order / cancel"
        actor: system
        preconditions: []
        side_effects:
          - "MachiningPrograms referencing this drawing in {CREATED, SETUP_BOOKED, PROVEN} -> VOIDED; their BOOKED slots -> CANCELLED"

  - entity: MachiningProgram
    initial_state: CREATED
    terminal_states: [VOIDED]
    transitions:
      - from: CREATED
        to: SETUP_BOOKED
        trigger: "system cascade: MoulderSetupSlot created for this program"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETUP_BOOKED
        to: CREATED
        trigger: "system cascade: its BOOKED slot is explicitly CANCELLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETUP_BOOKED
        to: PROVEN
        trigger: "system cascade: its slot BOOKED->COMPLETED (first article proven)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVEN
        to: RELEASED
        trigger: "PUT /millwork/machining-programs/{id}/status {target_status: RELEASED}"
        actor: ProductionLead
        preconditions:
          - "Referenced ShopDrawing.status == APPROVED (ERR_DRAWING_NOT_APPROVED)"
        side_effects: []
      - from: CREATED
        to: VOIDED
        trigger: "PUT /millwork/machining-programs/{id}/status {target_status: VOID} or cascade (drawing superseded / order change-order / order cancel)"
        actor: ProductionLead
        preconditions: []
        side_effects: ["BOOKED MoulderSetupSlots of this program -> CANCELLED"]
      - from: SETUP_BOOKED
        to: VOIDED
        trigger: "PUT .../status {target_status: VOID} or cascade"
        actor: ProductionLead
        preconditions: []
        side_effects: ["BOOKED MoulderSetupSlots of this program -> CANCELLED"]
      - from: PROVEN
        to: VOIDED
        trigger: "PUT .../status {target_status: VOID} or cascade"
        actor: ProductionLead
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: VOIDED
        trigger: "system cascade: order cancel only (change-order is blocked while a RELEASED program exists)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MoulderSetupSlot
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "PUT /millwork/moulder-setup-slots/{id}/status {target_status: COMPLETED}"
        actor: ProductionLead
        preconditions: []
        side_effects:
          - "Program in SETUP_BOOKED -> PROVEN"
      - from: BOOKED
        to: CANCELLED
        trigger: "PUT /millwork/moulder-setup-slots/{id}/status {target_status: CANCELLED} or cascade (program VOIDED)"
        actor: ProductionLead
        preconditions: []
        side_effects:
          - "On explicit cancel only: program SETUP_BOOKED -> CREATED (cascade cancel leaves program VOIDED)"

  - entity: FinishingBatch
    initial_state: MIXED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: MIXED
        to: SPRAYED
        trigger: "PUT /millwork/finishing-batches/{id}/status {target_status: SPRAYED}"
        actor: ProductionLead
        preconditions: []
        side_effects: []
      - from: SPRAYED
        to: CURED
        trigger: "PUT /millwork/finishing-batches/{id}/status {target_status: CURED}"
        actor: ProductionLead
        preconditions: []
        side_effects: []
      - from: CURED
        to: PASSED
        trigger: "POST /millwork/finishing-batches/{id}/measure when delta_gu <= 2.0"
        actor: QAInspector
        preconditions:
          - "status == CURED (ERR_BATCH_NOT_CURED)"
        side_effects:
          - "All openings of the order in {MACHINED, REWORK} -> FINISHED"
          - "PunchItems with rework_batch_id == this batch and status IN_REWORK -> RESOLVED"
      - from: CURED
        to: FAILED
        trigger: "POST /millwork/finishing-batches/{id}/measure when delta_gu > 2.0"
        actor: QAInspector
        preconditions:
          - "status == CURED (ERR_BATCH_NOT_CURED)"
        side_effects: []

  - entity: FireLabelRoll
    initial_state: ACTIVE
    terminal_states: [DEPLETED, RETIRED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when serials_available == 0 and serials_issued == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "PUT /millwork/fire-label-rolls/{id}/status {target_status: RETIRED}"
        actor: LabelAuthority
        preconditions:
          - "serials_issued == 0 (ERR_OUTSTANDING_SERIALS)"
        side_effects: []

  - entity: LabelAllocation
    initial_state: ISSUED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: ISSUED
        to: APPLIED
        trigger: "PUT /millwork/label-allocations/{id}/status {target_status: APPLIED}"
        actor: ProductionLead
        preconditions:
          - "Opening.fab_status == FINISHED (ERR_OPENING_NOT_FINISH_PASSED)"
          - "Roll.status == ACTIVE (ERR_ROLL_NOT_ACTIVE)"
        side_effects:
          - "applied_by = X-User-ID"
          - "Opening fab FINISHED -> LABELED"
          - "Roll.serials_issued -= serial_count; serials_applied += serial_count; increments FireLabelRoll.version by 1; roll auto-DEPLETED if available == 0 and issued == 0"
      - from: APPLIED
        to: VERIFIED
        trigger: "PUT /millwork/label-allocations/{id}/status {target_status: VERIFIED}"
        actor: QAInspector
        preconditions:
          - "X-User-ID != issued_by AND X-User-ID != applied_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "verified_by = X-User-ID"
      - from: ISSUED
        to: VOIDED
        trigger: "PUT /millwork/label-allocations/{id}/status {target_status: VOIDED}"
        actor: LabelAuthority
        preconditions: []
        side_effects:
          - "Roll.serials_issued -= serial_count; serials_spoiled += serial_count; increments FireLabelRoll.version by 1"
      - from: APPLIED
        to: VOIDED
        trigger: "system cascade: PunchItem REWORK_AUTHORIZED on the opening (label destroyed)"
        actor: system
        preconditions: []
        side_effects:
          - "Roll.serials_applied -= serial_count; serials_spoiled += serial_count; increments FireLabelRoll.version by 1"
      - from: VERIFIED
        to: VOIDED
        trigger: "system cascade: PunchItem REWORK_AUTHORIZED on the opening"
        actor: system
        preconditions: []
        side_effects:
          - "Roll.serials_applied -= serial_count; serials_spoiled += serial_count; increments FireLabelRoll.version by 1"

  - entity: DeliveryTrip
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DEPARTED
        trigger: "PUT /millwork/delivery-trips/{id}/status {target_status: DEPARTED}"
        actor: ShippingCoordinator
        preconditions:
          - "At least one opening assigned (ERR_NO_OPENINGS_ASSIGNED)"
          - "Every assigned opening has fab_status == STAGED (ERR_OPENINGS_NOT_STAGED)"
        side_effects:
          - "Assigned openings ship SCHEDULED -> SHIPPED"
          - "Compute realized_fill_pct"
      - from: DEPARTED
        to: DELIVERED
        trigger: "PUT /millwork/delivery-trips/{id}/status {target_status: DELIVERED}"
        actor: ShippingCoordinator
        preconditions: []
        side_effects:
          - "Assigned openings ship SHIPPED -> DELIVERED"
      - from: DELIVERED
        to: CLOSED
        trigger: "PUT /millwork/delivery-trips/{id}/status {target_status: CLOSED}"
        actor: ShippingCoordinator
        preconditions:
          - "Every assigned opening has ship_status == ACCEPTED (ERR_OPENINGS_NOT_ACCEPTED)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "PUT /millwork/delivery-trips/{id}/status {target_status: CANCELLED}"
        actor: ShippingCoordinator
        preconditions: []
        side_effects:
          - "Assigned openings ship SCHEDULED -> UNSCHEDULED; assigned_trip_id cleared; leaves_committed = 0"

  - entity: PunchItem
    initial_state: REPORTED
    terminal_states: [VERIFIED, REJECTED_INVALID]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "PUT /millwork/punch-items/{id}/status {target_status: TRIAGED}"
        actor: QAInspector
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: REWORK_AUTHORIZED
        trigger: "PUT /millwork/punch-items/{id}/status {target_status: REWORK_AUTHORIZED}"
        actor: PlantManager
        preconditions:
          - "severity == MAJOR (ERR_PUNCH_NOT_MAJOR)"
        side_effects:
          - "Opening fab {FINISHED, LABELED, STAGED} -> REWORK"
          - "LabelAllocations of the opening in {APPLIED, VERIFIED} -> VOIDED; their rolls move serials from serials_applied to serials_spoiled and bump FireLabelRoll.version"
      - from: REWORK_AUTHORIZED
        to: IN_REWORK
        trigger: "POST /millwork/punch-items/{id}/begin-rework"
        actor: ProductionLead
        preconditions:
          - "when rework_batch_id is supplied, its batch's order must equal the punch opening's order (ERR_REWORK_BATCH_ORDER_MISMATCH — checked first)"
          - "category == FINISH_DEFECT requires rework_batch_id naming a FinishingBatch with is_rework_batch == true and status in {MIXED, SPRAYED, CURED}; a missing batch id on a FINISH_DEFECT item, a non-rework batch, or a batch outside those statuses fails with ERR_REWORK_BATCH_NOT_USABLE"
        side_effects: []
      - from: IN_REWORK
        to: RESOLVED
        trigger: "system cascade: linked rework FinishingBatch CURED->PASSED (finish defects), or POST /millwork/punch-items/{id}/resolve (non-batch items)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /millwork/punch-items/{id}/resolve (MINOR items only; ERR_PUNCH_NOT_RESOLVABLE otherwise)"
        actor: ProductionLead
        preconditions:
          - "severity == MINOR"
        side_effects: []
      - from: RESOLVED
        to: VERIFIED
        trigger: "PUT /millwork/punch-items/{id}/status {target_status: VERIFIED}"
        actor: QAInspector
        preconditions:
          - "X-User-ID != reported_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Opening.fab_status == STAGED (rework re-staged; ERR_OPENING_NOT_RESTAGED)"
        side_effects: []
      - from: TRIAGED
        to: REJECTED_INVALID
        trigger: "PUT /millwork/punch-items/{id}/status {target_status: REJECTED_INVALID}"
        actor: QAInspector
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: drawing-create-stale-order
    parent_entity: MillworkOrder
    write_endpoint: "POST /millwork/shop-drawings"
    occ_field: "expected_order_version"
    description: |
      Creating a ShopDrawing revision against a MillworkOrder whose version has
      advanced since the client last observed it is rejected: the new revision
      pins the order's configuration, so a stale view would pin a superseded
      configuration. Stated in OCC terms: the request carries
      expected_order_version and the server rejects when it differs from the
      order's current version.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: label-issue-stale-roll
    parent_entity: FireLabelRoll
    write_endpoint: "POST /millwork/label-allocations"
    occ_field: "expected_roll_version"
    description: |
      Issuing a LabelAllocation against a FireLabelRoll whose version has
      advanced since the client last observed it is rejected: issuance draws
      serialized labels from the roll, so a stale view would draw serials
      already committed by another issuance. Stated in OCC terms: the request
      carries expected_roll_version and the server rejects when it differs
      from the roll's current version.
    error_id: ERR_STALE_ROLL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "BUDGET variant at order DRAFT->CONFIGURED; CONTRACT variant at drawing SUBMITTED->APPROVED cascade"
    algorithm: tiered_pricing
    formula: |
      Base leaf price by species (cents): OAK 42000, MAPLE 38000, CHERRY 51000,
      WALNUT 56000, PAINT_GRADE 29000.
      BUDGET variant (provisional, at CONFIGURE):
        line_cents(o) = round_half_up(o.leaf_count * base[species] * 1.12 * 1.08) + 5500
        budget_quote_cents = sum(line_cents) + BUDGET_FREIGHT_FLAT
      CONTRACT variant (at drawing APPROVE):
        line_cents(o) = round_half_up(o.leaf_count * base[species] * (1 + waste[species]) * finish_pct(total_leaves))
                        + hardware_delta + fire_rate[o.fire_rating] * o.leaf_count
        where hardware_delta = +8500 per opening when hardware_prep_mode == TEMPLATE_PREP,
              -4000 per opening when INSTALLER_PREP;
        merchandise_total_cents = sum(line_cents)   (see invoice_line_rounding for the pinned rounding order)
        contract_price_cents = merchandise_total_cents + freight_fee_cents (see freight_fee_schedule)
      Same openings input yields different totals under the two variants by construction.
    input_set: "All non-CANCELLED Openings of the order (any fab_status; they are QUEUED at CONFIGURE and unchanged at APPROVE)"
    constants:
      BUDGET_WASTE: 1.12
      BUDGET_FINISH_PCT: 1.08
      BUDGET_HARDWARE_PER_OPENING: 5500
      BUDGET_FREIGHT_FLAT: 25000
      WASTE_OAK: 0.14
      WASTE_MAPLE: 0.10
      WASTE_CHERRY: 0.18
      WASTE_WALNUT: 0.20
      WASTE_PAINT_GRADE: 0.08
      HARDWARE_TEMPLATE_CHARGE_PER_OPENING: 8500
      HARDWARE_INSTALLER_CREDIT_PER_OPENING: -4000
      FIRE_MIN_20_PER_LEAF: 6000
      FIRE_MIN_45_PER_LEAF: 9500
      FIRE_MIN_90_PER_LEAF: 14000
    precision: "integer cents, round_half_up"
    variants:
      - name: BUDGET
        when: "order CONFIGURE transition"
        difference: "flat 12% waste, flat 8% finish upcharge, flat 5500 hardware per opening, no fire surcharge, flat 25000 freight"
      - name: CONTRACT
        when: "drawing APPROVED cascade"
        difference: "per-species waste, tiered finish pct by total leaves, hardware template charge or installer credit, per-rated-leaf fire surcharge, tiered freight"

  - name: invoice_line_rounding
    trigger: "inside order_pricing CONTRACT variant (and the invoice-summary computed read)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER: round each opening's line to whole cents FIRST
      (round_half_up on the raw per-line value), THEN sum the rounded lines into
      merchandise_total_cents.
      The alternative (sum raw line values, then round once) produces different
      cents and is WRONG. Example pinned by scaffold: 11 lines of raw 64392.6
      -> per-line-then-sum = 11 * 64393 = 664323; sum-then-round = 664319.
    input_set: "All non-CANCELLED Openings of the order"
    precision: "integer cents, round_half_up per line before summation"

  - name: freight_fee_schedule
    trigger: "inside order_pricing CONTRACT variant, after merchandise_total_cents"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (resolves the circular-looking dependency
      "freight tier depends on a total that includes freight"):
        1. merchandise_total_cents (per invoice_line_rounding)
        2. freight_fee_cents keyed on merchandise_total_cents ONLY:
             merchandise < 500000                -> 25000 (flat)
             500000 <= merchandise <= 2000000    -> round_half_up(0.04 * merchandise)
             merchandise > 2000000               -> round_half_up(0.03 * merchandise)
        3. contract_price_cents = merchandise_total_cents + freight_fee_cents
      The freight tier MUST NOT be keyed on contract_price_cents.
    input_set: "merchandise_total_cents of the order"
    constants:
      FREIGHT_FLAT: 25000
      FREIGHT_MID_PCT: 0.04
      FREIGHT_HIGH_PCT: 0.03
      FREIGHT_TIER1_MAX: 500000
      FREIGHT_TIER2_MAX: 2000000
    precision: "integer cents, round_half_up"

  - name: sheen_conformance
    trigger: "POST /millwork/finishing-batches/{id}/measure"
    algorithm: threshold
    formula: |
      sheen_target_gu mapped from order.sheen_target: MATTE 15, SATIN 35, SEMI_GLOSS 60, HIGH_GLOSS 85.
      delta_gu = abs(sheen_measured_gu - sheen_target_gu)
      Batch -> PASSED iff delta_gu <= SHEEN_TOLERANCE_GU (inclusive boundary),
      else -> FAILED. delta_gu == 2.0 passes; delta_gu == 2.1 fails.
    input_set: "the measured batch (status must be CURED)"
    constants:
      SHEEN_TOLERANCE_GU: 2.0
      GU_MATTE: 15
      GU_SATIN: 35
      GU_SEMI_GLOSS: 60
      GU_HIGH_GLOSS: 85

  - name: label_serial_accounting
    trigger: "LabelAllocation issue / apply / void (including rework cascades)"
    algorithm: aggregation
    formula: |
      On ISSUE (count n = opening.leaf_count): serials_issued += n; serials_available -= n
      On APPLY:  serials_issued -= n; serials_applied += n
      On VOID from ISSUED:  serials_issued -= n; serials_spoiled += n
      On VOID from APPLIED/VERIFIED (rework cascade): serials_applied -= n; serials_spoiled += n
      CONSERVED INVARIANT (must hold after every operation, including any
      issue-then-void pair): serials_issued + serials_applied + serials_spoiled
      + serials_available == serial_capacity. Spoiled serials are NEVER returned
      to available.
    input_set: "the roll and the allocation under transition"
    precision: "integer serial counts"

  - name: slot_changeover_window
    trigger: "POST /millwork/moulder-setup-slots"
    algorithm: interval_merge
    formula: |
      Existing slots considered: same machine, status in {BOOKED, COMPLETED}.
      Intervals are half-open [start_hour, end_hour).
      OVERLAP (any species): reject when start_hour < e.end_hour AND e.start_hour < end_hour
        -> ERR_MACHINE_SLOT_OVERLAP. Adjacency (new.start == e.end or e.start == new.end) is NOT overlap.
      CHANGEOVER BUFFER: species_family(PAINT_GRADE) = PAINT; species_family(OAK|MAPLE|CHERRY|WALNUT) = STAIN.
        For a non-overlapping existing slot e with species_family(e.species) != species_family(new):
        gap = max(new.start_hour - e.end_hour, e.start_hour - new.end_hour)  (>= 0 for non-overlap)
        reject when gap < CHANGEOVER_HOURS -> ERR_CHANGEOVER_BUFFER_VIOLATION.
        gap == CHANGEOVER_HOURS is allowed; same-family adjacency needs no buffer.
    input_set: "existing slots on the target machine in {BOOKED, COMPLETED}"
    constants:
      CHANGEOVER_HOURS: 2

  - name: booth_load_window
    trigger: "POST /millwork/finishing-batches"
    algorithm: interval_merge
    formula: |
      Existing batches considered: same booth, status in {MIXED, SPRAYED, CURED}.
      Intervals are half-open [cure_start_hour, cure_end_hour); overlap test as in slot_changeover_window.
      AGGREGATE CAPACITY (differs from machine slots: booths allow sharing):
        count(overlapping existing) + 1 <= booth.capacity else ERR_BOOTH_CAPACITY_EXCEEDED.
        count == capacity - 1 is allowed (boundary inclusive).
      FAMILY PURGE: finish_family(PAINT) = PAINT, finish_family(CLEAR_COAT|STAIN) = CLEAR_STAIN.
        Any overlapping existing batch with a different finish_family -> ERR_BOOTH_PURGE_VIOLATION,
        regardless of capacity headroom. Adjacent (non-overlapping) batches of different families are allowed.
    input_set: "existing batches on the target booth in {MIXED, SPRAYED, CURED}"

  - name: trip_load_accounting
    trigger: "trip assign / unassign / cancel"
    algorithm: aggregation
    formula: |
      leaves_committed = sum(opening.leaf_count) over openings with
        assigned_trip_id == trip.id AND ship_status == SCHEDULED.
      CONSERVED INVARIANT: assign followed by unassign of the same opening
      restores leaves_committed to its prior value and the opening to
      UNSCHEDULED with assigned_trip_id == null; the pair leaves
      (leaves_committed, opening.ship_status, opening.assigned_trip_id) unchanged.
    input_set: "openings assigned to the trip"
    precision: "integer leaf counts"

  - name: trip_fill_efficiency
    trigger: "projected_fill_pct recomputed on every assign/unassign and on read; realized_fill_pct computed at PLANNED->DEPARTED"
    algorithm: forward_looking
    formula: |
      PROJECTED variant (forward-looking):
        projected_fill_pct = round_half_up( (leaves_committed
          + sum(leaf_count of openings of the same project with fab_status == STAGED
                AND ship_status == UNSCHEDULED)) / truck_capacity_leaves * 100, 1 )
      REALIZED variant (settled):
        realized_fill_pct = round_half_up( leaves_committed / truck_capacity_leaves * 100, 1 )
      For identical trip data the two variants diverge whenever staged-but-
      unscheduled openings exist in the project.
    input_set: "trip + openings of trip.project_id"
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PROJECTED
        when: "assign/unassign and GET reads while PLANNED"
        difference: "includes STAGED-and-UNSCHEDULED project openings as prospective load"
      - name: REALIZED
        when: "computed and frozen at DEPARTED"
        difference: "counts only leaves_committed actually on the truck"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role must be permitted for this (endpoint, target_status) operation; for PUT .../status endpoints the permitted role is the actor declared on the matching state-machine transition"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids and body FK ids must reference existing resources (validated left-to-right: path first, then body fields in declared input order)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"
  - priority: 3.4
    category: business_constraint
    check: "Payload well-formedness: required fields present, no unknown fields, enum values in range, start_hour < end_hour, cure window >= 4 hours, site_arrival_date >= departure_date"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_SLOT_HOURS | ERR_INVALID_CURE_WINDOW | ERR_INVALID_TRIP_DATES"
    http_status: 400
    applies_to: "all endpoints"
  - priority: 3.5
    category: state
    check: "OCC: expected_order_version / expected_roll_version must equal the parent's current version (checked before business logic)"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_ROLL_VERSION"
    http_status: 412
    applies_to: "POST /millwork/shop-drawings, POST /millwork/label-allocations"
  - priority: 4
    category: state
    check: "Target resource must be in the state required by the operation (per-entity state-machine from-states and cross-entity gates such as order IN_PRODUCTION, opening FINISHED, roll ACTIVE)"
    error_id: "per-transition ERR_* (see errors table)"
    http_status: 409
    applies_to: "state transition and guarded action endpoints"
  - priority: 5
    category: business_safety
    check: "Fire/compliance safety: rated orders require template prep with a fire-rated template; machine must support the order's species; label roll series must match opening rating; segregation-of-duties and self-approval bans; booth cross-family purge"
    error_id: "ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP | ERR_TEMPLATE_NOT_FIRE_RATED | ERR_MACHINE_SPECIES_UNSUPPORTED | ERR_LABEL_SERIES_MISMATCH | ERR_SELF_APPROVAL_FORBIDDEN | ERR_SEGREGATION_OF_DUTIES_VIOLATION | ERR_BOOTH_PURGE_VIOLATION"
    http_status: 403
    applies_to: "order configure, slot booking, label issue/verify, drawing approve, batch create, punch verify"
  - priority: 6
    category: business_constraint
    check: "Uniqueness and structural constraints: order_code per project, opening_no per order, single active drawing/allocation, slot overlap, changeover buffer, program-order match"
    error_id: "ERR_ORDER_CODE_NOT_UNIQUE | ERR_OPENING_NO_NOT_UNIQUE | ERR_ACTIVE_DRAWING_EXISTS | ERR_ACTIVE_ALLOCATION_EXISTS | ERR_MACHINE_SLOT_OVERLAP | ERR_CHANGEOVER_BUFFER_VIOLATION | ERR_PROGRAM_ORDER_MISMATCH | ERR_TEMPLATE_REQUIRED"
    http_status: 409
    applies_to: "create/book endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-aggregate coherence: opening's order must belong to trip's project; rework batch must belong to the opening's order; opening fire_rating rank must not exceed order.fire_rating_required rank"
    error_id: "ERR_TRIP_PROJECT_MISMATCH | ERR_REWORK_BATCH_ORDER_MISMATCH | ERR_OPENING_RATING_EXCEEDS_ORDER"
    http_status: 409
    applies_to: "assign, begin-rework, opening create"
  - priority: 8
    category: business_temporal
    check: "trip.site_arrival_date must be <= opening.required_on_site_date on assign"
    error_id: ERR_DELIVERY_WINDOW_MISSED
    http_status: 409
    applies_to: "POST /millwork/delivery-trips/{id}/assign"
  - priority: 9
    category: business_fiscal
    check: "Quota/capacity: roll serials_available >= opening.leaf_count; leaves_committed + leaf_count <= truck_capacity_leaves; booth overlapping-batch count < capacity"
    error_id: "ERR_INSUFFICIENT_LABEL_SERIALS | ERR_TRUCK_CAPACITY_EXCEEDED | ERR_BOOTH_CAPACITY_EXCEEDED"
    http_status: 402
    applies_to: "label issue, trip assign, batch create"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - { method: POST, path: "/millwork/projects", description: "Create a project", roles: [PlantManager], code: 201, input: [name, site_address, contract_code], output: Project, side_effects: ["status = OPEN"] }
  - { method: GET, path: "/millwork/projects", description: "List projects", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "status?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/millwork/projects/{id}", description: "Get a project", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: Project, side_effects: [] }
  - { method: PUT, path: "/millwork/projects/{id}/status", description: "Transition project status", roles: [PlantManager], code: 200, input: [target_status], output: Project, side_effects: ["Project state machine transition; increments Project.version by 1"] }

  # --- HardwareTemplate ---
  - { method: POST, path: "/millwork/hardware-templates", description: "Register a hardware prep template", roles: [PlantManager], code: 201, input: [template_code, manufacturer, fire_rated_compatible], output: HardwareTemplate, side_effects: [] }
  - { method: GET, path: "/millwork/hardware-templates", description: "List hardware templates", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "template_code?"], output: "HardwareTemplate[]", side_effects: [] }
  - { method: GET, path: "/millwork/hardware-templates/{id}", description: "Get a hardware template", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: HardwareTemplate, side_effects: [] }

  # --- MoulderMachine ---
  - { method: POST, path: "/millwork/moulder-machines", description: "Register a moulder machine", roles: [PlantManager], code: 201, input: [machine_code, supported_species, "active?"], output: MoulderMachine, side_effects: [] }
  - { method: GET, path: "/millwork/moulder-machines", description: "List moulder machines", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "machine_code?"], output: "MoulderMachine[]", side_effects: [] }
  - { method: GET, path: "/millwork/moulder-machines/{id}", description: "Get a moulder machine", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: MoulderMachine, side_effects: [] }

  # --- SprayBooth ---
  - { method: POST, path: "/millwork/spray-booths", description: "Register a spray booth", roles: [PlantManager], code: 201, input: [booth_code, "capacity?"], output: SprayBooth, side_effects: ["capacity defaults to 2"] }
  - { method: GET, path: "/millwork/spray-booths", description: "List spray booths", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "booth_code?"], output: "SprayBooth[]", side_effects: [] }
  - { method: GET, path: "/millwork/spray-booths/{id}", description: "Get a spray booth", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: SprayBooth, side_effects: [] }

  # --- FireLabelRoll ---
  - { method: POST, path: "/millwork/fire-label-rolls", description: "Register a serialized fire-label roll", roles: [PlantManager], code: 201, input: [label_series, serial_capacity], output: FireLabelRoll, side_effects: ["serials_issued/applied/spoiled = 0; serials_available = serial_capacity; status = ACTIVE"] }
  - { method: GET, path: "/millwork/fire-label-rolls", description: "List fire label rolls", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "label_series?", "status?"], output: "FireLabelRoll[]", side_effects: [] }
  - { method: GET, path: "/millwork/fire-label-rolls/{id}", description: "Get a fire label roll", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: FireLabelRoll, side_effects: [] }
  - { method: PUT, path: "/millwork/fire-label-rolls/{id}/status", description: "Retire a roll", roles: [LabelAuthority], code: 200, input: [target_status], output: FireLabelRoll, side_effects: ["ACTIVE -> RETIRED per state machine; increments FireLabelRoll.version by 1"] }

  # --- MillworkOrder ---
  - { method: POST, path: "/millwork/orders", description: "Create an order (DRAFT)", roles: [Estimator], code: 201, input: [project_id, order_code, species, profile_code, finish_system, sheen_target, hardware_prep_mode, fire_rating_required, "hardware_template_id?"], output: MillworkOrder, side_effects: ["status = DRAFT", "config_locked = false"] }
  - { method: GET, path: "/millwork/orders", description: "List orders", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "project_id?", "hardware_template_id?", "status?"], output: "MillworkOrder[]", side_effects: [] }
  - { method: GET, path: "/millwork/orders/{id}", description: "Get an order", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: MillworkOrder, side_effects: [] }
  - { method: PUT, path: "/millwork/orders/{id}", description: "Edit order configuration while unlocked", roles: [Estimator], code: 200, input: ["species?", "profile_code?", "finish_system?", "sheen_target?", "hardware_prep_mode?", "hardware_template_id?", "fire_rating_required?"], output: MillworkOrder, side_effects: ["Requires status in {DRAFT, CONFIGURED} (ERR_ORDER_CONFIG_LOCKED); increments MillworkOrder.version by 1"] }
  - { method: PUT, path: "/millwork/orders/{id}/status", description: "Transition order status (per-target actor: CONFIGURED=Estimator, IN_PRODUCTION/FINISHING/READY_TO_SHIP=ProductionLead, SHIPPED=ShippingCoordinator, CLOSED=PlantManager, CANCELLED=Estimator)", roles: [Estimator, ProductionLead, ShippingCoordinator, PlantManager], code: 200, input: [target_status], output: MillworkOrder, side_effects: ["Order state machine transition incl. cancel cascade; increments MillworkOrder.version by 1"] }
  - { method: POST, path: "/millwork/orders/{id}/change-order", description: "Revert APPROVED order to CONFIGURED, superseding the approved drawing", roles: [Estimator], code: 200, input: [], output: MillworkOrder, side_effects: ["Drawing SUPERSEDED -> programs VOIDED -> slots CANCELLED; config_locked = false; increments MillworkOrder.version by 1"] }
  - { method: GET, path: "/millwork/orders/{id}/invoice-summary", description: "Computed read: per-line totals and rolled-up invoice figures", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: { merchandise_total_cents: integer, freight_fee_cents: integer, contract_price_cents: integer, budget_quote_cents: integer, line_count: integer }, side_effects: [] }

  # --- Opening ---
  - { method: POST, path: "/millwork/openings", description: "Add an opening to an order", roles: [Estimator], code: 201, input: [order_id, opening_no, width_in, height_in, fire_rating, required_on_site_date, "leaf_count?"], output: Opening, side_effects: ["fab_status = QUEUED, ship_status = UNSCHEDULED", "leaf_count defaults to 1", "fire_rating rank must be <= order.fire_rating_required rank (ERR_OPENING_RATING_EXCEEDS_ORDER)"] }
  - { method: GET, path: "/millwork/openings", description: "List openings (ordered by created_at ASC, tie-broken by id-free server insertion order)", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "order_id?", "assigned_trip_id?", "fab_status?", "ship_status?"], output: "Opening[]", side_effects: [] }
  - { method: GET, path: "/millwork/openings/{id}", description: "Get an opening", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: Opening, side_effects: [] }
  - { method: PUT, path: "/millwork/openings/{id}/status", description: "Advance fabrication axis (MACHINED or STAGED)", roles: [ProductionLead], code: 200, input: [target_fab_status], output: Opening, side_effects: ["Opening fab transition per state machine; increments Opening.version by 1"] }
  - { method: POST, path: "/millwork/openings/{id}/accept", description: "Accept a delivered/punch-listed opening", roles: [QAInspector], code: 200, input: [], output: Opening, side_effects: ["ship DELIVERED/PUNCH_LISTED -> ACCEPTED; increments Opening.version by 1"] }

  # --- ShopDrawing ---
  - { method: POST, path: "/millwork/shop-drawings", description: "Create a DRAFT drawing revision pinning the order's current configuration (OCC on order version)", roles: [Estimator], code: 201, input: [order_id, expected_order_version], output: ShopDrawing, side_effects: ["revision_no = count of order's drawings + 1", "supersedes_drawing_id = previous revision id or null", "pinned_* snapshot fields copied from order", "status = DRAFT", "increments MillworkOrder.version by 1"] }
  - { method: GET, path: "/millwork/shop-drawings", description: "List shop drawings", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "order_id?", "supersedes_drawing_id?", "status?"], output: "ShopDrawing[]", side_effects: [] }
  - { method: GET, path: "/millwork/shop-drawings/{id}", description: "Get a shop drawing", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: ShopDrawing, side_effects: [] }
  - { method: PUT, path: "/millwork/shop-drawings/{id}/status", description: "Submit/approve/reject/void a drawing (SUBMITTED/VOID=Estimator, APPROVED/REJECTED=Architect)", roles: [Estimator, Architect], code: 200, input: [target_status, "review_note?"], output: ShopDrawing, side_effects: ["Drawing state machine transition incl. order cascades; increments ShopDrawing.version by 1"] }

  # --- MachiningProgram ---
  - { method: POST, path: "/millwork/machining-programs", description: "Create a machining program for an APPROVED drawing. Preconditions: drawing.status == APPROVED (ERR_DRAWING_NOT_APPROVED); payload order_id == drawing.order_id (ERR_PROGRAM_ORDER_MISMATCH)", roles: [ProductionLead], code: 201, input: [drawing_id, order_id, estimated_minutes], output: MachiningProgram, side_effects: ["status = CREATED", "program_code generated"] }
  - { method: GET, path: "/millwork/machining-programs", description: "List machining programs", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "drawing_id?", "order_id?", "status?"], output: "MachiningProgram[]", side_effects: [] }
  - { method: GET, path: "/millwork/machining-programs/{id}", description: "Get a machining program", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: MachiningProgram, side_effects: [] }
  - { method: PUT, path: "/millwork/machining-programs/{id}/status", description: "Release or void a program (RELEASED requires drawing APPROVED)", roles: [ProductionLead], code: 200, input: [target_status], output: MachiningProgram, side_effects: ["Program state machine transition; void cancels BOOKED slots; increments MachiningProgram.version by 1"] }

  # --- MoulderSetupSlot ---
  - { method: POST, path: "/millwork/moulder-setup-slots", description: "Book a moulder setup slot for a CREATED program (overlap + changeover rules)", roles: [ProductionLead], code: 201, input: [program_id, machine_id, start_hour, end_hour], output: MoulderSetupSlot, side_effects: ["status = BOOKED", "species copied from program's order", "program CREATED -> SETUP_BOOKED"] }
  - { method: GET, path: "/millwork/moulder-setup-slots", description: "List moulder setup slots", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "machine_id?", "program_id?", "status?"], output: "MoulderSetupSlot[]", side_effects: [] }
  - { method: GET, path: "/millwork/moulder-setup-slots/{id}", description: "Get a setup slot", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: MoulderSetupSlot, side_effects: [] }
  - { method: PUT, path: "/millwork/moulder-setup-slots/{id}/status", description: "Complete or cancel a booked slot", roles: [ProductionLead], code: 200, input: [target_status], output: MoulderSetupSlot, side_effects: ["COMPLETED promotes program to PROVEN; explicit CANCELLED reverts program to CREATED; increments MoulderSetupSlot.version by 1"] }

  # --- FinishingBatch ---
  - { method: POST, path: "/millwork/finishing-batches", description: "Create a finishing batch occupying a booth cure window", roles: [ProductionLead], code: 201, input: [order_id, booth_id, cure_start_hour, cure_end_hour, "is_rework_batch?"], output: FinishingBatch, side_effects: ["status = MIXED", "finish_family and sheen_target_gu copied from order"] }
  - { method: GET, path: "/millwork/finishing-batches", description: "List finishing batches", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "order_id?", "booth_id?", "status?"], output: "FinishingBatch[]", side_effects: [] }
  - { method: GET, path: "/millwork/finishing-batches/{id}", description: "Get a finishing batch", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: FinishingBatch, side_effects: [] }
  - { method: PUT, path: "/millwork/finishing-batches/{id}/status", description: "Advance batch (SPRAYED, CURED)", roles: [ProductionLead], code: 200, input: [target_status], output: FinishingBatch, side_effects: ["Batch state machine transition; increments FinishingBatch.version by 1"] }
  - { method: POST, path: "/millwork/finishing-batches/{id}/measure", description: "QA sheen measurement; PASSED iff delta_gu <= 2.0 else FAILED", roles: [QAInspector], code: 200, input: [sheen_measured_gu], output: FinishingBatch, side_effects: ["delta_gu computed", "PASSED: openings {MACHINED, REWORK} -> FINISHED; linked IN_REWORK punch items -> RESOLVED"] }

  # --- LabelAllocation ---
  - { method: POST, path: "/millwork/label-allocations", description: "Issue serialized labels for a rated FINISHED opening (OCC on roll version)", roles: [LabelAuthority], code: 201, input: [opening_id, roll_id, expected_roll_version], output: LabelAllocation, side_effects: ["serial_count = opening.leaf_count", "issued_by = X-User-ID", "roll serials_issued += n, serials_available -= n", "increments FireLabelRoll.version by 1", "status = ISSUED"] }
  - { method: GET, path: "/millwork/label-allocations", description: "List label allocations", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "opening_id?", "roll_id?", "status?"], output: "LabelAllocation[]", side_effects: [] }
  - { method: GET, path: "/millwork/label-allocations/{id}", description: "Get a label allocation", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: LabelAllocation, side_effects: [] }
  - { method: PUT, path: "/millwork/label-allocations/{id}/status", description: "Apply/verify/void an allocation (APPLIED=ProductionLead, VERIFIED=QAInspector, VOIDED=LabelAuthority)", roles: [ProductionLead, QAInspector, LabelAuthority], code: 200, input: [target_status], output: LabelAllocation, side_effects: ["Allocation state machine transition; roll serial accounting; increments LabelAllocation.version by 1"] }

  # --- DeliveryTrip ---
  - { method: POST, path: "/millwork/delivery-trips", description: "Plan a delivery trip", roles: [PlantManager], code: 201, input: [project_id, trip_code, truck_capacity_leaves, departure_date, site_arrival_date], output: DeliveryTrip, side_effects: ["status = PLANNED", "leaves_committed = 0"] }
  - { method: GET, path: "/millwork/delivery-trips", description: "List delivery trips", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "project_id?", "status?"], output: "DeliveryTrip[]", side_effects: [] }
  - { method: GET, path: "/millwork/delivery-trips/{id}", description: "Get a delivery trip", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: DeliveryTrip, side_effects: [] }
  - { method: POST, path: "/millwork/delivery-trips/{id}/assign", description: "Assign a STAGED opening to a PLANNED trip. Preconditions: trip PLANNED (ERR_INVALID_TRIP_STATUS_TRANSITION); opening fab_status == STAGED (ERR_OPENING_NOT_STAGED); opening ship_status == UNSCHEDULED (ERR_OPENING_ALREADY_SCHEDULED); opening order project == trip project (ERR_TRIP_PROJECT_MISMATCH); site_arrival_date <= opening.required_on_site_date (ERR_DELIVERY_WINDOW_MISSED); leaves_committed + leaf_count <= truck_capacity_leaves (ERR_TRUCK_CAPACITY_EXCEEDED)", roles: [ShippingCoordinator], code: 200, input: [opening_id], output: DeliveryTrip, side_effects: ["opening ship UNSCHEDULED -> SCHEDULED, assigned_trip_id set", "leaves_committed += leaf_count", "projected_fill_pct recomputed", "increments DeliveryTrip.version by 1"] }
  - { method: POST, path: "/millwork/delivery-trips/{id}/unassign", description: "Remove an opening from a PLANNED trip (compensates assign). Preconditions: trip PLANNED; opening.assigned_trip_id == this trip (ERR_OPENING_NOT_ON_TRIP)", roles: [ShippingCoordinator], code: 200, input: [opening_id], output: DeliveryTrip, side_effects: ["opening ship SCHEDULED -> UNSCHEDULED, assigned_trip_id cleared", "leaves_committed -= leaf_count", "increments DeliveryTrip.version by 1"] }
  - { method: PUT, path: "/millwork/delivery-trips/{id}/status", description: "Transition trip (DEPARTED/DELIVERED/CLOSED/CANCELLED)", roles: [ShippingCoordinator], code: 200, input: [target_status], output: DeliveryTrip, side_effects: ["Trip state machine transition incl. opening ship cascades; increments DeliveryTrip.version by 1"] }

  # --- PunchItem ---
  - { method: POST, path: "/millwork/punch-items", description: "Report a punch-list deficiency on a delivered opening", roles: [QAInspector, Architect], code: 201, input: [opening_id, category, severity, description], output: PunchItem, side_effects: ["status = REPORTED", "reported_by = X-User-ID", "first report moves opening ship DELIVERED -> PUNCH_LISTED"] }
  - { method: GET, path: "/millwork/punch-items", description: "List punch items", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: ["limit?", "offset?", "opening_id?", "rework_batch_id?", "status?"], output: "PunchItem[]", side_effects: [] }
  - { method: GET, path: "/millwork/punch-items/{id}", description: "Get a punch item", roles: [Any, PlantManager, Estimator, Architect, ProductionLead, LabelAuthority, QAInspector, ShippingCoordinator], code: 200, input: [], output: PunchItem, side_effects: [] }
  - { method: PUT, path: "/millwork/punch-items/{id}/status", description: "Transition punch item (TRIAGED/REJECTED_INVALID/VERIFIED=QAInspector, REWORK_AUTHORIZED=PlantManager)", roles: [QAInspector, PlantManager], code: 200, input: [target_status], output: PunchItem, side_effects: ["Punch state machine transition; REWORK_AUTHORIZED cascades opening -> REWORK and voids applied labels; increments PunchItem.version by 1"] }
  - { method: POST, path: "/millwork/punch-items/{id}/begin-rework", description: "Start rework, optionally linking a rework finishing batch (required for FINISH_DEFECT)", roles: [ProductionLead], code: 200, input: ["rework_batch_id?"], output: PunchItem, side_effects: ["status -> IN_REWORK", "rework_batch_id recorded"] }
  - { method: POST, path: "/millwork/punch-items/{id}/resolve", description: "Resolve a MINOR triaged item or a non-batch IN_REWORK item", roles: [ProductionLead], code: 200, input: [], output: PunchItem, side_effects: ["status -> RESOLVED"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation (including per-target_status actors on PUT .../status)" }
  # --- not found ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "MillworkOrder id does not exist" }
  - { id: ERR_OPENING_NOT_FOUND, http: 404, condition: "Opening id does not exist" }
  - { id: ERR_DRAWING_NOT_FOUND, http: 404, condition: "ShopDrawing id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "MachiningProgram id does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "MoulderMachine id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "MoulderSetupSlot id does not exist" }
  - { id: ERR_BOOTH_NOT_FOUND, http: 404, condition: "SprayBooth id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "FinishingBatch id does not exist" }
  - { id: ERR_ROLL_NOT_FOUND, http: 404, condition: "FireLabelRoll id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "LabelAllocation id does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "DeliveryTrip id does not exist" }
  - { id: ERR_PUNCH_NOT_FOUND, http: 404, condition: "PunchItem id does not exist" }
  - { id: ERR_TEMPLATE_NOT_FOUND, http: 404, condition: "HardwareTemplate id does not exist" }
  # --- payload ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, or invalid enum value" }
  - { id: ERR_INVALID_SLOT_HOURS, http: 400, condition: "end_hour <= start_hour on slot booking" }
  - { id: ERR_INVALID_CURE_WINDOW, http: 400, condition: "cure_end_hour - cure_start_hour < 4 on batch create" }
  - { id: ERR_INVALID_TRIP_DATES, http: 400, condition: "site_arrival_date earlier than departure_date" }
  # --- OCC ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version differs from MillworkOrder.version on drawing create" }
  - { id: ERR_STALE_ROLL_VERSION, http: 412, condition: "expected_roll_version differs from FireLabelRoll.version on label issue" }
  # --- state: generic invalid transitions ---
  - { id: ERR_INVALID_PROJECT_STATUS_TRANSITION, http: 409, condition: "Undeclared Project from->to pair (incl. any transition from ARCHIVED)" }
  - { id: ERR_INVALID_ORDER_STATUS_TRANSITION, http: 409, condition: "Undeclared MillworkOrder from->to pair (incl. from CLOSED/CANCELLED)" }
  - { id: ERR_INVALID_OPENING_STATUS_TRANSITION, http: 409, condition: "Undeclared Opening fab from->to pair (e.g. QUEUED->STAGED, any from CANCELLED)" }
  - { id: ERR_INVALID_DRAWING_STATUS_TRANSITION, http: 409, condition: "Undeclared ShopDrawing from->to pair (incl. from REJECTED/SUPERSEDED/VOID)" }
  - { id: ERR_INVALID_PROGRAM_STATUS_TRANSITION, http: 409, condition: "Undeclared MachiningProgram from->to pair (e.g. CREATED->RELEASED, any from VOIDED)" }
  - { id: ERR_INVALID_SLOT_STATUS_TRANSITION, http: 409, condition: "Undeclared MoulderSetupSlot from->to pair (incl. from COMPLETED/CANCELLED)" }
  - { id: ERR_INVALID_BATCH_STATUS_TRANSITION, http: 409, condition: "Undeclared FinishingBatch from->to pair (e.g. MIXED->CURED, any from PASSED/FAILED)" }
  - { id: ERR_INVALID_ALLOCATION_STATUS_TRANSITION, http: 409, condition: "Undeclared LabelAllocation from->to pair (e.g. ISSUED->VERIFIED, any from VERIFIED/VOIDED)" }
  - { id: ERR_INVALID_TRIP_STATUS_TRANSITION, http: 409, condition: "Undeclared DeliveryTrip from->to pair (e.g. PLANNED->DELIVERED, any from CLOSED/CANCELLED)" }
  - { id: ERR_INVALID_PUNCH_STATUS_TRANSITION, http: 409, condition: "Undeclared PunchItem from->to pair (e.g. REPORTED->VERIFIED, any from VERIFIED/REJECTED_INVALID)" }
  - { id: ERR_INVALID_ROLL_STATUS_TRANSITION, http: 409, condition: "Undeclared FireLabelRoll from->to pair (incl. from DEPLETED/RETIRED)" }
  # --- state: named gates ---
  - { id: ERR_PROJECT_NOT_OPEN, http: 409, condition: "Order/trip creation requires Project.status == OPEN" }
  - { id: ERR_ORDER_NOT_CONFIGURED, http: 409, condition: "Drawing create/submit requires order status == CONFIGURED" }
  - { id: ERR_ORDER_CONFIG_LOCKED, http: 409, condition: "PUT /orders/{id} config edit requires status in {DRAFT, CONFIGURED} (config_locked while APPROVED+)" }
  - { id: ERR_ORDER_NOT_IN_PRODUCTION, http: 409, condition: "Opening machining requires order status == IN_PRODUCTION" }
  - { id: ERR_ORDER_NOT_FINISHING, http: 409, condition: "Non-rework batch create requires order status == FINISHING" }
  - { id: ERR_NO_OPENINGS, http: 409, condition: "Order configure requires at least one non-CANCELLED opening" }
  - { id: ERR_OPENINGS_NOT_MACHINED, http: 409, condition: "FINISHING requires every opening fab in {MACHINED, FINISHED, LABELED, STAGED}" }
  - { id: ERR_OPENINGS_NOT_STAGED, http: 409, condition: "READY_TO_SHIP / trip DEPARTED requires every (assigned) opening fab == STAGED" }
  - { id: ERR_OPENINGS_NOT_SHIPPED, http: 409, condition: "Order SHIPPED requires every opening ship in {SHIPPED, DELIVERED, PUNCH_LISTED, ACCEPTED}" }
  - { id: ERR_OPENINGS_NOT_ACCEPTED, http: 409, condition: "Order CLOSED / trip CLOSED requires every opening ship == ACCEPTED" }
  - { id: ERR_OPEN_PUNCH_ITEMS, http: 409, condition: "Opening accept / order close blocked by punch items in {REPORTED, TRIAGED, REWORK_AUTHORIZED, IN_REWORK, RESOLVED}" }
  - { id: ERR_ORDERS_NOT_TERMINAL, http: 409, condition: "Project COMPLETED requires every order in {CLOSED, CANCELLED}" }
  - { id: ERR_PRODUCTION_ALREADY_RELEASED, http: 409, condition: "Change-order blocked: a RELEASED program exists for the current approved drawing" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires order status in {DRAFT, CONFIGURED, SUBMITTED, APPROVED}" }
  - { id: ERR_NO_RELEASED_PROGRAM, http: 409, condition: "IN_PRODUCTION requires a RELEASED program on the current approved drawing" }
  - { id: ERR_PROGRAM_NOT_AWAITING_SETUP, http: 409, condition: "Slot booking requires program status == CREATED" }
  - { id: ERR_BATCH_NOT_CURED, http: 409, condition: "Sheen measure requires batch status == CURED" }
  - { id: ERR_NO_REWORK_OPENINGS, http: 409, condition: "is_rework_batch batch create requires at least one opening of the order in REWORK" }
  - { id: ERR_OPENING_NOT_DELIVERED, http: 409, condition: "Punch report requires opening ship in {DELIVERED, PUNCH_LISTED}; accept requires DELIVERED or PUNCH_LISTED" }
  - { id: ERR_OPENING_NOT_STAGED, http: 409, condition: "Trip assign requires opening fab_status == STAGED" }
  - { id: ERR_OPENING_ALREADY_SCHEDULED, http: 409, condition: "Assign requires opening ship_status == UNSCHEDULED" }
  - { id: ERR_OPENING_NOT_ON_TRIP, http: 409, condition: "Unassign requires opening.assigned_trip_id == this trip" }
  - { id: ERR_NO_OPENINGS_ASSIGNED, http: 409, condition: "Trip DEPARTED requires at least one assigned opening" }
  - { id: ERR_OPENING_NOT_FINISH_PASSED, http: 409, condition: "Label issue/apply requires opening fab_status == FINISHED" }
  - { id: ERR_OPENING_NOT_RESTAGED, http: 409, condition: "Punch verify / punched accept requires opening fab_status == STAGED after rework" }
  - { id: ERR_LABELING_REQUIRED, http: 409, condition: "Rated opening cannot stage directly from FINISHED; must pass through LABELED" }
  - { id: ERR_LABEL_NOT_VERIFIED, http: 409, condition: "Staging a LABELED opening requires a VERIFIED allocation" }
  - { id: ERR_OPENING_NOT_RATED, http: 409, condition: "Label issue requires opening.fire_rating != NONE (checked before the FINISHED gate on the issue endpoint)" }
  - { id: ERR_ROLL_NOT_ACTIVE, http: 409, condition: "Label issue/apply requires roll status == ACTIVE" }
  - { id: ERR_OUTSTANDING_SERIALS, http: 409, condition: "Roll retire requires serials_issued == 0" }
  - { id: ERR_PUNCH_NOT_MAJOR, http: 409, condition: "REWORK_AUTHORIZED requires severity == MAJOR" }
  - { id: ERR_PUNCH_NOT_RESOLVABLE, http: 409, condition: "Resolve requires (TRIAGED and MINOR) or (IN_REWORK without rework_batch_id)" }
  - { id: ERR_REWORK_BATCH_NOT_USABLE, http: 409, condition: "begin-rework requires, for FINISH_DEFECT items, a rework_batch_id naming a batch with is_rework_batch == true and status in {MIXED, SPRAYED, CURED}; missing batch id on FINISH_DEFECT, non-rework batch, or terminal batch all fail here" }
  # --- safety ---
  - { id: ERR_MACHINE_SPECIES_UNSUPPORTED, http: 403, condition: "Machine.supported_species does not contain the program's order species" }
  - { id: ERR_LABEL_SERIES_MISMATCH, http: 403, condition: "Roll label_series does not match opening fire rating (MIN_20->UL_20MIN etc.)" }
  - { id: ERR_RATED_ORDER_REQUIRES_TEMPLATE_PREP, http: 403, condition: "fire_rating_required != NONE forbids INSTALLER_PREP" }
  - { id: ERR_TEMPLATE_NOT_FIRE_RATED, http: 403, condition: "Rated order's template has fire_rated_compatible == false" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Drawing approver X-User-ID equals submitted_by" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Verifier X-User-ID equals issued_by/applied_by (labels) or reported_by (punch)" }
  - { id: ERR_BOOTH_PURGE_VIOLATION, http: 403, condition: "Overlapping batches of different finish families on one booth" }
  # --- constraint ---
  - { id: ERR_ORDER_CODE_NOT_UNIQUE, http: 409, condition: "order_code already used within the project" }
  - { id: ERR_OPENING_NO_NOT_UNIQUE, http: 409, condition: "opening_no already used within the order" }
  - { id: ERR_ACTIVE_DRAWING_EXISTS, http: 409, condition: "Another drawing of the order is in {DRAFT, SUBMITTED} on create, or another is SUBMITTED on submit" }
  - { id: ERR_ACTIVE_ALLOCATION_EXISTS, http: 409, condition: "Opening already has an allocation in {ISSUED, APPLIED, VERIFIED}" }
  - { id: ERR_MACHINE_SLOT_OVERLAP, http: 409, condition: "Half-open interval overlap with an existing BOOKED/COMPLETED slot on the machine" }
  - { id: ERR_CHANGEOVER_BUFFER_VIOLATION, http: 409, condition: "Cross-species-family adjacency gap < 2 hours on the same machine" }
  - { id: ERR_PROGRAM_ORDER_MISMATCH, http: 409, condition: "program payload order_id != drawing.order_id" }
  - { id: ERR_TEMPLATE_REQUIRED, http: 409, condition: "TEMPLATE_PREP order lacks hardware_template_id at configure" }
  # --- referential ---
  - { id: ERR_TRIP_PROJECT_MISMATCH, http: 409, condition: "Opening's order belongs to a different project than the trip" }
  - { id: ERR_REWORK_BATCH_ORDER_MISMATCH, http: 409, condition: "Rework batch's order differs from the punch opening's order" }
  - { id: ERR_OPENING_RATING_EXCEEDS_ORDER, http: 409, condition: "opening fire_rating rank exceeds order.fire_rating_required rank" }
  # --- temporal ---
  - { id: ERR_DELIVERY_WINDOW_MISSED, http: 409, condition: "trip.site_arrival_date later than opening.required_on_site_date on assign" }
  # --- fiscal ---
  - { id: ERR_INSUFFICIENT_LABEL_SERIALS, http: 402, condition: "roll serials_available < opening.leaf_count on issue" }
  - { id: ERR_TRUCK_CAPACITY_EXCEEDED, http: 402, condition: "leaves_committed + opening.leaf_count > truck_capacity_leaves on assign" }
  - { id: ERR_BOOTH_CAPACITY_EXCEEDED, http: 402, condition: "overlapping batches on booth would exceed booth.capacity" }

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties model; all identities opaque)
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant general manager: owns projects, shop resources (machines, booths, label rolls, templates), trip planning, and rework authorization"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/projects; PUT /millwork/projects/{id}/status"
      - "POST /millwork/hardware-templates; POST /millwork/moulder-machines; POST /millwork/spray-booths; POST /millwork/fire-label-rolls"
      - "POST /millwork/delivery-trips"
      - "PUT /millwork/orders/{id}/status {target_status: CLOSED}"
      - "PUT /millwork/punch-items/{id}/status {target_status: REWORK_AUTHORIZED}"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Estimator
    description: "Sales/estimating: configures orders and openings, drives submittal drafting, change orders and cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/orders; PUT /millwork/orders/{id}; POST /millwork/orders/{id}/change-order"
      - "POST /millwork/openings"
      - "POST /millwork/shop-drawings"
      - "PUT /millwork/orders/{id}/status {target_status: CONFIGURED | CANCELLED}"
      - "PUT /millwork/shop-drawings/{id}/status {target_status: SUBMITTED | VOID}"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Architect
    description: "External design professional: reviews submittals; may also report punch deficiencies from the field"
    identity: opaque
    exclusive_operations:
      - "PUT /millwork/shop-drawings/{id}/status {target_status: APPROVED | REJECTED}"
    shared_operations:
      - "POST /millwork/punch-items (shared with QAInspector)"
      - "all GET endpoints (via Any)"
  - name: ProductionLead
    description: "Shop floor lead: machining programs, moulder slots, finishing batches, label application, rework execution"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/machining-programs; PUT /millwork/machining-programs/{id}/status"
      - "POST /millwork/moulder-setup-slots; PUT /millwork/moulder-setup-slots/{id}/status"
      - "POST /millwork/finishing-batches; PUT /millwork/finishing-batches/{id}/status"
      - "PUT /millwork/openings/{id}/status"
      - "PUT /millwork/orders/{id}/status {target_status: IN_PRODUCTION | FINISHING | READY_TO_SHIP}"
      - "PUT /millwork/label-allocations/{id}/status {target_status: APPLIED}"
      - "POST /millwork/punch-items/{id}/begin-rework; POST /millwork/punch-items/{id}/resolve"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: LabelAuthority
    description: "Agency-authorized label control issuer: issues and voids serialized fire labels; retires rolls"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/label-allocations"
      - "PUT /millwork/label-allocations/{id}/status {target_status: VOIDED}"
      - "PUT /millwork/fire-label-rolls/{id}/status {target_status: RETIRED}"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: QAInspector
    description: "Quality assurance: sheen measurement, label verification, punch triage/verification, opening acceptance. Must be a different user than issuer/applier (labels) and reporter (punch)"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/finishing-batches/{id}/measure"
      - "PUT /millwork/label-allocations/{id}/status {target_status: VERIFIED}"
      - "PUT /millwork/punch-items/{id}/status {target_status: TRIAGED | REJECTED_INVALID | VERIFIED}"
      - "POST /millwork/openings/{id}/accept"
    shared_operations:
      - "POST /millwork/punch-items (shared with Architect)"
      - "all GET endpoints (via Any)"
  - name: ShippingCoordinator
    description: "Logistics: trip assignment and dispatch lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /millwork/delivery-trips/{id}/assign; POST /millwork/delivery-trips/{id}/unassign"
      - "PUT /millwork/delivery-trips/{id}/status"
      - "PUT /millwork/orders/{id}/status {target_status: SHIPPED}"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Any
    description: "Read-only shared role: any authenticated principal may call GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
