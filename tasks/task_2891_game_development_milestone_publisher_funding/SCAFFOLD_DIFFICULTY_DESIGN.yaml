  - rule_id: boundary_precision_check
    instances:
      - name: gold_crash_free_threshold_at_99_49_versus_exactly_99_50
        grounds:
          - calculations.build_gate_evaluation
          - calculations.build_gate_evaluation.constants.GATE_THRESHOLDS
          - calculations.build_gate_evaluation.constants.STABILITY_SURPLUS_PCT
          - calculations.build_gate_evaluation.constants.FEATURE_RELAXATION_PCT
          - validations[priority=46]
          - entities.MilestoneBuild.fields.readiness_score
        distinguishing_aspect: |
          0.01 of a percentage point decides the request: crash_free_sessions_pct 99.49 is rejected
          with ERR_BUILD_GATE_NOT_MET and persists nothing (latest_build_number stays 0, the builds
          list stays empty), while exactly 99.50 is accepted with readiness_score 99.83. The pair
          also pins that comparisons are inclusive (>=) and that the GOLD profile never receives the
          2.00-point feature relaxation, since 99.50 is itself the crash threshold and cannot buy
          surplus slack.
        test_recipe:
          setup:
            - "Agreement Lodestar: advance_total_cents 3000000, a single GOLD milestone funded 3000000 with contractor_budget_cents 0 and two acceptance criteria, ACTIVE and IN_DEVELOPMENT."
            - "GOLD thresholds are feature 100.00, crash 99.50, content 100.00, blockers 0."
            - "No review is filed, so the agreement never reaches its COMPLETED auto-transition during this test."
