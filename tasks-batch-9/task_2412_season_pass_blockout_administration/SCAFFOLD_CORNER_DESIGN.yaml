          - errors[ERR_NOT_PASS_OWNER]
          - endpoints[GET /season-passes/{pass_id}]
          - endpoints[POST /reservations]
        distinguishing_aspect: "Ownership is checked against X-User-ID for Passholder callers only: holder B is refused both the read and the booking of holder A's pass with 403 ERR_NOT_PASS_OWNER, while a PassOfficeClerk may act on either pass."
        test_recipe:
