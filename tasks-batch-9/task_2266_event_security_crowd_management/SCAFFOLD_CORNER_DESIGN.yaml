  - name: risk_assessment_submit_transitions_draft_to_submitted
    claim_type: valid_transition
    grounds:
    - state_machines.RiskAssessment.DRAFT_to_SUBMITTED
    excluded_because:
      difficulty_instance: threat_score_preliminary_expected_vs_final_ticketed
      rationale: |
        That difficulty instance drives DRAFT -> SUBMITTED and asserts the full preliminary side-effect set (attendance_basis EXPECTED, score_basis_attendance 400, composite_threat_score 62.50, risk_tier T3, submitted_by_user_id) as the first half of its variant pair, so a separate breadth instance for the same edge would assert a strict subset of the same fields.
  - name: risk_assessment_reject_and_revise_transitions
    claim_type: valid_transition
    grounds:
    - state_machines.RiskAssessment.SUBMITTED_to_REJECTED
    - state_machines.RiskAssessment.REJECTED_to_DRAFT
    excluded_because:
      difficulty_instance: risk_assessment_reject_revise_resubmit_cycle
      rationale: |
        Both edges are exercised in sequence by that instance, which additionally pins revision_number 2, the cleared submitted_by_user_id and the cleared rejection_reason and then closes the loop back to APPROVED — strictly more than a breadth pass over the two edges.
  - name: assignment_no_show_leaves_assignment_status_confirmed
    claim_type: parallel
    grounds:
    - state_machines.PostAssignment.BRIEFED_to_NO_SHOW
    - complexity_profile.state_machine_shape
    excluded_because:
      difficulty_instance: assignment_no_show_moves_duty_dimension_only
      rationale: |
        The declared PARALLEL shape claim — duty_status moving to NO_SHOW while assignment_status stays CONFIRMED, the row dropping out of filled_guard_count, and the committed ledger deliberately NOT being released — is exactly that instance's subject, including the post/plan/event recomputation hops.
  - name: incident_le_handoff_at_critical_freezes_ingress
    claim_type: side_effect_execution
    grounds:
    - state_machines.Incident.TRIAGED_to_LE_HANDOFF
    excluded_because:
      difficulty_instance: critical_le_handoff_cascades_ingress_lanes_gate
      rationale: |
        That instance takes the LE_HANDOFF branch at CRITICAL severity and asserts all three branch-specific hops (ingress_status HOLD, every OPEN lane swept to HOLD in created_at order, gate_posture FROZEN) plus the join-branch compensation on RESOLVE.
  - name: guard_expire_sweep_voids_roster_rows
    claim_type: side_effect_execution
    grounds:
    - state_machines.Guard.VERIFIED_to_EXPIRED
    - state_machines.PostAssignment.CONFIRMED_to_VOIDED
    excluded_because:
      difficulty_instance: clock_sweep_credential_expiry_cascades_four_hops
      rationale: |
        The ops-run sweep inside POST /_clock/set_current_utc and all four of its cascade hops (PostAssignment -> Post -> StaffingPlan -> SecurityEvent) are that instance's entire subject, including the ledger release and the sweep ordering.
  - name: assignment_cancel_compensates_plan_ledger
    claim_type: side_effect_execution
    grounds:
    - state_machines.PostAssignment.CONFIRMED_to_CANCELLED
    excluded_because:
      difficulty_instance: cancel_confirmed_assignment_cascades_post_plan_event
      rationale: |
        CONFIRMED -> CANCELLED with its three cascade hops and its compensating ledger sync is asserted there with pinned cent and hour figures; the companion compensating_invariant instance budget_ledger_restored_after_confirm_then_cancel additionally proves the round trip is exact.
  - name: incident_medical_handoff_branch_transitions
    claim_type: valid_transition
    grounds:
    - state_machines.Incident.TRIAGED_to_MEDICAL_HANDOFF
    - state_machines.Incident.MEDICAL_HANDOFF_to_RESOLVED
    excluded_because:
      difficulty_instance: incident_medical_branch_vs_le_branch_divergent_side_effects
      rationale: |
        That instance drives the MEDICAL branch and the LE branch from the same TRIAGED fork in one recipe, asserting that the medical branch leaves ingress_status, lane statuses and gate_posture untouched — the breadth claim for these two edges is contained in it.
- section: calculations
  instances:
  - name: zone_max_safe_occupancy_applies_declared_constants
    claim_type: constants_applied
    grounds:
    - calculations.zone_max_safe_occupancy
    - calculations.zone_max_safe_occupancy.constants
    - entities.VenueZone.fields.max_safe_occupancy
    distinguishing_aspect: |
      The two declared constants MIN_SQM_PER_PERSON 0.65 and PERSONS_PER_EXIT_UNIT 100 can only be pinned when each one is the SOLE binding term, and the floor() on the area term can only be pinned when the division is inexact — so this fixture uses three zones whose winning term differs: 65.00 sqm makes the 0.65 constant bind at exactly 100, two exit units make the 100 constant bind at exactly 200, and 1000.00 sqm makes the floor() truncate 1538.46... to 1538.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" with gross_capacity 8000 and door_count 1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      trigger:
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZA
          zone_type: CONCOURSE
          floor_area_sqm: 65.0
          posted_capacity: 500
          exit_units: 5
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          za_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZB
          zone_type: FLOOR
          floor_area_sqm: 1000.0
          posted_capacity: 500
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zb_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZC
          zone_type: SEATED
          floor_area_sqm: 1000.0
          posted_capacity: 5000
          exit_units: 20
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zc_id: $.data.id
      assert:
      - 'zone ZA has max_safe_occupancy == 100: area_cap = floor(65.00 / 0.65) = 100 is strictly below both posted_capacity 500 and egress_cap 5 * 100 = 500'
      - 'zone ZB has max_safe_occupancy == 200: egress_cap = 2 * 100 = 200 is strictly below both posted_capacity 500 and area_cap floor(1000.00 / 0.65) = 1538'
      - 'zone ZC has max_safe_occupancy == 1538: area_cap = floor(1538.46...) = 1538 is strictly below both posted_capacity 5000 and egress_cap 20 * 100 = 2000, and the fractional part is truncated rather
        than rounded to 1538 (not 1539)'
      - each created VenueZone reports version == 1 and echoes its own floor_area_sqm, posted_capacity, exit_units and post_slot_capacity
  - name: assessment_approval_derives_supervisor_span_lane_and_cost_floor
    claim_type: constraint_propagation
    grounds:
    - calculations.required_staff_matrix
    - calculations.supervisor_span_requirement
    - calculations.screening_lane_requirement
    - calculations.minimum_staffing_cost_floor
    distinguishing_aspect: |
      supervisor_span_requirement is the only §1.3 row whose dependency LOOKS circular (supervisors are staff, staff need supervision) and whose declared resolution is a single downward pass, so the claim needs two assessments on opposite sides of the SUPERVISOR_SPAN_OF_CONTROL 5 boundary: a 16-line-guard plan takes 2 first-line supervisors and 0 second-line, while a 91-line-guard plan takes 10 first-line and a second tier of 2 — and the rejected fixed-point reading would inflate both. The same two assessments separate the exit-guard max() (door_count wins at 3 > 2, share wins at 9 > 6) and drive the two-stream screening_lane ceil.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue A "Harbor Arena" with gross_capacity 8000, door_count 3; SecurityEvent A with expected_attendance 5000, alcohol_served false, vip_present false; RiskAssessment A in DRAFT (threat GUARDED,
        protest NONE, crowd_profile GENERAL_ADMISSION, ingress_door_count 3, layout_complexity_score 2, history_incident_rate 0)
      - Venue B "Riverside Bowl" with gross_capacity 20000, door_count 6; SecurityEvent B with expected_attendance 15000, alcohol_served true, vip_present true; RiskAssessment B in DRAFT (threat ELEVATED,
        protest POSSIBLE, crowd_profile MOSH_PIT, ingress_door_count 6, layout_complexity_score 4, history_incident_rate 2)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 3
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
        as: SecurityDirector
        captures:
          venue_a: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_a}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 5000
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_a: $.data.id
      - call: POST /event-security/security-events/${event_a}/risk-assessments
        payload:
          threat_level_input: GUARDED
          protest_likelihood: NONE
          crowd_profile: GENERAL_ADMISSION
          ingress_door_count: 3
          layout_complexity_score: 2
          history_incident_rate: 0
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_a: $.data.id
      - call: POST /event-security/venues
        payload:
          name: Riverside Bowl
          gross_capacity: 20000
          door_count: 6
          egress_capacity_per_minute: 1200
          perimeter_length_m: 900
        as: SecurityDirector
        captures:
          venue_b: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_b}
          event_name: Riverside Riot
          event_type: FESTIVAL
          doors_open_at: '2026-09-19T17:00:00Z'
          event_start_at: '2026-09-19T18:30:00Z'
          event_end_at: '2026-09-19T23:00:00Z'
          expected_attendance: 15000
          alcohol_served: true
          vip_present: true
        as: SecurityDirector
        captures:
          event_b: $.data.id
      - call: POST /event-security/security-events/${event_b}/risk-assessments
        payload:
          threat_level_input: ELEVATED
          protest_likelihood: POSSIBLE
          crowd_profile: MOSH_PIT
          ingress_door_count: 6
          layout_complexity_score: 4
          history_incident_rate: 2
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_b: $.data.id
      trigger:
      - call: POST /event-security/risk-assessments/${ra_a}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: analyst-1
      - call: POST /event-security/risk-assessments/${ra_b}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: analyst-1
      assert:
      - 'RiskAssessment A: composite_threat_score == 42.75 and risk_tier == T2'
      - 'RiskAssessment A: required_perimeter_guards == 4, required_ingress_guards == 4, required_floor_guards == 5 and required_exit_guards == 3 (raw_line 12.5; the 0.10 share ceils to 2 but venue.door_count
        3 * 1 wins the max()), giving required_line_guards == 16'
      - 'RiskAssessment A: required_supervisors == 2 — ceil(16 / 10) == 2 first-line supervisors and 0 second-line because 2 is not greater than SUPERVISOR_SPAN_OF_CONTROL 5'
      - 'RiskAssessment A: required_total_staff == 18 and minimum_staffing_cost_floor_cents == 129600 (18 * 4 * 1800)'
      - 'RiskAssessment A: required_screening_lanes == 12 — surge 2750, bag 1650 over capacity 195 ceils to 9 and no-bag 1100 over capacity 455 ceils to 3, summed after the per-stream ceil'
      - 'RiskAssessment B: composite_threat_score == 97.74 (base_points 90.50 times crowd_factor 1.08, neither the CROWD_FACTOR_CAP 1.35 nor the SCORE_CEILING 100 binding) and risk_tier == T4'
      - 'RiskAssessment B: required_perimeter_guards == 27, required_ingress_guards == 23, required_floor_guards == 32 and required_exit_guards == 9 (raw_line 90; here the 0.10 share wins the max() over
        venue.door_count 6), giving required_line_guards == 91'
      - 'RiskAssessment B: required_supervisors == 12 — ceil(91 / 10) == 10 first-line supervisors, and because 10 > 5 a second tier of ceil(10 / 5) == 2 is added'
      - 'RiskAssessment B: required_total_staff == 103 and minimum_staffing_cost_floor_cents == 741600, NOT the fixed-point reading that would resolve supervisors against the total staff count'
      - 'RiskAssessment B: required_screening_lanes == 34 (bag 4950 / 195 ceils to 26, no-bag 3300 / 455 ceils to 8)'
      - both assessments have status == SUBMITTED, attendance_basis == EXPECTED and score_basis_attendance equal to their event's expected_attendance (5000 and 15000)
  - name: incident_response_minutes_at_exact_sla_budget_is_not_a_breach
    claim_type: chronological
    grounds:
    - calculations.incident_response_metrics
    - calculations.incident_response_metrics.constants
    - entities.Incident.fields.response_minutes
    - entities.Incident.fields.sla_breached
    distinguishing_aspect: |
      sla_breached is declared with a STRICT > against a per-severity budget, so the only way to pin the comparison operator is to land response_minutes exactly ON a budget: a MODERATE incident triaged at exactly 10.00 minutes must NOT be a breach while a MINOR incident at 16.00 minutes must be one, and a 20-second gap must round to 0.33 rather than truncate to 0.00 — three points that no single incident can cover.
    test_recipe:
      setup:
      - logical clock at 2026-09-12T16:30:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - StaffingPlan ACTIVATED with budget_cents 500000 and six posts S1/P1/I1/I2/F1/E1 over 2026-09-12T15:00:00Z..22:30:00Z, one guard each (required_total_staff 6)
      - 'two ScreeningLane rows on the event: BAG_CHECK (nominal 195 pph) and EXPRESS_NO_BAG (nominal 455 pph), operator_capacity 1 each, created in that order'
      - 'six VERIFIED guards at base_hourly_rate_cents 2200, all six assignments CONFIRMED and BRIEFED: committed_cost_cents 99000, committed_guard_hours 45.00, coverage_ratio 1.00, readiness_posture READY'
      - clock advanced to 2026-09-12T16:30:00Z, a_s1/a_i1/a_i2/a_e1 checked in, both lanes OPEN, SecurityEvent in DOORS_OPEN
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
