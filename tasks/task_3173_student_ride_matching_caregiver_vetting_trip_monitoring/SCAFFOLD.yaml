# =============================================================================
# PRD Benchmark Scaffold — §1.0 – §1.7
# Task: task_3173_student_ride_matching_caregiver_vetting_trip_monitoring
# Domain: student ride matching with caregiver vetting & trip monitoring
#
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) and §1.9 (SCAFFOLD_CORNER_DESIGN.yaml)
# live in sibling files by design and MUST NOT appear here.
# =============================================================================

scenario: |
  Student Ride Matching with Caregiver Vetting & Trip Monitoring (HopSkipDrive): driver qualification requiring caregiving experience, fingerprint background checks and vehicle inspection beyond standard rideshare screening, ride request intake from school districts and agencies for students in foster care, homeless situations or special education, trip scheduling for recurring school-year routes with schedule change and no-school-day handling, student identification and handoff protocols at pickup and dropoff with authorized adult verification, real-time trip monitoring with alerts to caregivers, schools and a support center, incident response when a student is not present or refuses to board, billing to districts under contracts with per-ride and per-mile rates, driver supply planning against bell schedules

domain_name: student-ride-matching
api_prefix: /student-rides

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School district legal name" }
      - { name: billing_email, type: string, source: input, description: "Accounts-payable contact for statements" }
      - { name: contract_rate_per_ride_cents, type: integer, source: input, description: "Default per-ride rate used by the provisional invoice variant" }
      - { name: contract_rate_per_mile_cents, type: integer, source: input, description: "Default per-mile rate used by the provisional invoice variant" }
      - { name: minimum_billable_cents, type: integer, source: input, description: "Per-trip floor applied by the final invoice variant", default: 0 }
      - { name: no_school_dates, type: array, source: input, description: "ISO date strings (YYYY-MM-DD) on which the district holds no classes" }
      - { name: bell_schedule_start, type: string, source: input, description: "District earliest bell time as HH:MM local, used only for supply-plan window labelling" }
      - { name: support_center_alert_enabled, type: boolean, source: input, description: "Whether HIGH severity alerts also page the support center", default: true }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_amount_cents over statements in status ISSUED", default: 0 }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Voided-or-refunded amount held as district credit, consumed by the next statement computation", default: 0 }
      - { name: account_status, type: enum, source: computed, description: "ACTIVE | SUSPENDED — gates statement issuance", default: "ACTIVE", constraints: "enum values: ACTIVE, SUSPENDED" }
      - { name: trips_scheduled_total, type: integer, source: computed, description: "Monotone count of Trips ever created for this district", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student legal name, used for PICKUP handoff matching" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date string (YYYY-MM-DD)" }
      - { name: program_type, type: enum, source: input, description: "FOSTER_CARE | HOMELESS_MCKINNEY_VENTO | SPECIAL_EDUCATION | GENERAL", constraints: "enum values: FOSTER_CARE, HOMELESS_MCKINNEY_VENTO, SPECIAL_EDUCATION, GENERAL" }
      - { name: spi_level, type: integer, source: input, description: "Service priority level 1-5; lower number ranks higher in driver matching", default: 1 }
      - { name: home_address, type: string, source: input, description: "Pickup address of record" }
      - { name: school_name, type: string, source: input, description: "School of record — the accepted SCHOOL_STAFF party name at dropoff" }
      - { name: emergency_contact_phone, type: string, source: input, description: "Caregiver phone; the only caregiver contact ever surfaced to a driver" }
      - { name: authorized_adults, type: array, source: input, description: "Array of objects {name, relationship, phone} permitted to receive the student at dropoff" }
      - { name: notify_on_pickup, type: boolean, source: input, description: "Whether caregiver is notified on pickup handoff", default: true }
      - { name: notify_on_dropoff, type: boolean, source: input, description: "Whether caregiver is notified on dropoff handoff", default: true }
      - { name: support_center_phone_masked, type: string, source: computed, description: "Digest of emergency_contact_phone with all but the last 4 digits masked — driver-facing value" }
      - { name: active_ride_request_count, type: integer, source: computed, description: "Count of this rider's RideRequests in status SUBMITTED or APPROVED", default: 0 }
      - { name: status, type: enum, source: computed, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "enum values: ACTIVE, INACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Driver legal name" }
      - { name: phone, type: string, source: input, description: "Driver contact number" }
      - { name: employer_org, type: string, source: input, description: "Caregiver agency that employs the driver" }
      - { name: caregiver_experience_months, type: integer, source: input, description: "Declared months of caregiving experience; must reach CAREGIVER_EXPERIENCE_MIN_MONTHS to clear" }
      - { name: language_codes, type: array, source: input, description: "ISO 639-1 codes the driver speaks; used as the language tie-break in driver selection" }
      - { name: vehicle_class, type: enum, source: input, description: "SEDAN | SUV | WHEELCHAIR_VAN", constraints: "enum values: SEDAN, SUV, WHEELCHAIR_VAN" }
      - { name: seat_capacity, type: integer, source: input, description: "Physical passenger seats declared at onboarding" }
      - { name: child_seat_type, type: enum, source: input, description: "NONE | BOOSTER | HARNESS | INTEGRATED", default: "NONE", constraints: "enum values: NONE, BOOSTER, HARNESS, INTEGRATED" }
      - { name: approved_seat_count, type: integer, source: computed, description: "Compliance-approved seats — see calculations.driver_approved_seat_count", default: 0 }
      - { name: compliance_expires_at, type: datetime, source: computed, description: "Earliest expiry across cleared checks and the passing inspection; null when not coverage_eligible" }
      - { name: incident_strike_count, type: integer, source: computed, description: "Count of this driver's SafetyIncidents adjudicated DRIVER_AT_FAULT", default: 0 }
      - { name: status, type: enum, source: computed, description: "PENDING | BACKGROUND_CHECK | INSPECTION | ACTIVE | SUSPENDED | INACTIVE", default: "PENDING", constraints: "enum values: PENDING, BACKGROUND_CHECK, INSPECTION, ACTIVE, SUSPENDED, INACTIVE" }

  # ---------------------------------------------------------------------------
  - name: BackgroundCheck
    parent: Driver
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; the driver this clearance belongs to" }
      - { name: check_type, type: enum, source: input, description: "FINGERPRINT_FBI | FINGERPRINT_STATE | COUNTY_COURT | SEX_OFFENDER_REGISTRY", constraints: "enum values: FINGERPRINT_FBI, FINGERPRINT_STATE, COUNTY_COURT, SEX_OFFENDER_REGISTRY" }
      - { name: reference_code, type: string, source: input, description: "Agency-issued reference for the clearance packet" }
      - { name: result, type: enum, source: computed, description: "PENDING | CLEARED | FAILED", default: "PENDING", constraints: "enum values: PENDING, CLEARED, FAILED" }
      - { name: expires_on, type: string, source: input, description: "ISO date string on which this clearance lapses (YYYY-MM-DD)" }
      - { name: cleared_after_months, type: integer, source: computed, description: "Months between created_at and the moment the result became CLEARED; null while PENDING" }

  # ---------------------------------------------------------------------------
  - name: VehicleInspection
    parent: Driver
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; the driver whose vehicle was inspected" }
      - { name: vehicle_class, type: enum, source: input, description: "SEDAN | SUV | WHEELCHAIR_VAN", constraints: "enum values: SEDAN, SUV, WHEELCHAIR_VAN" }
      - { name: seat_count, type: integer, source: input, description: "Seats counted by the inspector" }
      - { name: child_seat_type, type: enum, source: input, description: "NONE | BOOSTER | HARNESS | INTEGRATED", default: "NONE", constraints: "enum values: NONE, BOOSTER, HARNESS, INTEGRATED" }
      - { name: inspector_note, type: string, source: input, description: "Free-text note from the inspection" }
      - { name: result, type: enum, source: computed, description: "PENDING | PASSED | FAILED", default: "PENDING", constraints: "enum values: PENDING, PASSED, FAILED" }
      - { name: expires_on, type: string, source: input, description: "ISO date string on which the inspection lapses (YYYY-MM-DD)" }
      - { name: seat_credit, type: integer, source: computed, description: "Seats this inspection contributes: 0 when result is not PASSED, else seat_count" }

  # ---------------------------------------------------------------------------
  - name: Contract
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; the contracting district" }
      - { name: effective_from, type: string, source: input, description: "ISO date string, inclusive start of the contract term" }
      - { name: through_date, type: string, source: input, description: "ISO date string, inclusive end of the contract term" }
      - { name: per_ride_rate_cents, type: integer, source: input, description: "Contract per-ride rate applied to each completed trip's billable_ride_units" }
      - { name: per_mile_rate_cents, type: integer, source: input, description: "Contract per-mile rate applied to each completed trip's billable_miles" }
      - { name: minimum_billable_cents, type: integer, source: input, description: "Per-trip floor applied after per-trip rounding", default: 0 }
      - { name: billing_period, type: enum, source: input, description: "WEEKLY | SEMI_MONTHLY | MONTHLY — determines Trip.billing_period_key", constraints: "enum values: WEEKLY, SEMI_MONTHLY, MONTHLY" }
      - { name: status, type: enum, source: computed, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED", default: "DRAFT", constraints: "enum values: DRAFT, ACTIVE, SUSPENDED, EXPIRED" }

  # ---------------------------------------------------------------------------
  - name: RideRequest
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; the requesting district" }
      - { name: rider_id, type: string, source: input, description: "FK -> Rider.id; the student being transported" }
      - { name: trip_type, type: enum, source: input, description: "AM_SCHOOL | PM_SCHOOL | MIDDAY | ACTIVITY", constraints: "enum values: AM_SCHOOL, PM_SCHOOL, MIDDAY, ACTIVITY" }
      - { name: required_specialty, type: enum, source: input, description: "NONE | CAREGIVER_REQUIRED | WHEELCHAIR — the specialty a candidate driver must satisfy", default: "NONE", constraints: "enum values: NONE, CAREGIVER_REQUIRED, WHEELCHAIR" }
      - { name: window_start_at, type: datetime, source: input, description: "Earliest acceptable pickup instant (ISO 8601 UTC)" }
      - { name: window_end_at, type: datetime, source: input, description: "Latest acceptable dropoff instant (ISO 8601 UTC)" }
      - { name: max_window_minutes, type: integer, source: input, description: "Greatest permitted value of (window_end_at - window_start_at) in minutes", default: 30 }
      - { name: min_lead_time_hours, type: integer, source: input, description: "Hours between the logical clock and window_start_at required at scheduling time", default: 12 }
      - { name: pickup_address, type: string, source: input, description: "Origin address for every Trip generated from this request" }
      - { name: dropoff_address, type: string, source: input, description: "Destination address for every Trip generated from this request" }
      - { name: is_recurring, type: boolean, source: input, description: "True when the request drives a school-year recurring series", default: false }
      - { name: days_of_week, type: array, source: input, description: "Integers 1-7 (ISO weekday) on which a recurring series produces trips; empty when is_recurring is false" }
      - { name: series_effective_from, type: string, source: input, description: "ISO date string, inclusive start of the recurring series" }
      - { name: series_through_date, type: string, source: input, description: "ISO date string, inclusive end of the recurring series" }
      - { name: series_no_school_dates, type: array, source: input, description: "ISO date strings on which this series produces no trip, in addition to the district list" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the request has been returned for revision", default: 0 }
      - { name: status, type: enum, source: computed, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SCHEDULED | SERIES_SUSPENDED | REJECTED | CANCELLED", default: "DRAFT", constraints: "enum values: DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, SCHEDULED, SERIES_SUSPENDED, REJECTED, CANCELLED" }
      - { name: recurring_series_active, type: boolean, source: computed, description: "True while the series is producing trips; false when SERIES_SUSPENDED, REJECTED or CANCELLED", default: false }

  # ---------------------------------------------------------------------------
  - name: Trip
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; the district paying for the trip" }
      - { name: ride_request_id, type: string, source: system, description: "FK -> RideRequest.id; the request this trip instantiates" }
      - { name: rider_id, type: string, source: system, description: "FK -> Rider.id; copied from the ride request at creation" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; null until the selector assigns a driver", required: false }
      - { name: scheduled_date, type: string, source: input, description: "ISO date string the trip runs on (YYYY-MM-DD)" }
      - { name: window_start_at, type: datetime, source: input, description: "Pickup window open instant. A generated trip takes the ride request's time-of-day component and binds it to its own scheduled_date; planned_miles is inherited the same way" }
      - { name: window_end_at, type: datetime, source: input, description: "Dropoff window close instant, copied from the ride request" }
      - { name: pickup_address, type: string, source: system, description: "Copied from the ride request at creation" }
      - { name: dropoff_address, type: string, source: system, description: "Copied from the ride request at creation" }
      - { name: trip_state, type: enum, source: computed, description: "SCHEDULED | DRIVER_EN_ROUTE | AWAITING_STUDENT | STUDENT_ONBOARD | IN_TRANSIT | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "enum values: SCHEDULED, DRIVER_EN_ROUTE, AWAITING_STUDENT, STUDENT_ONBOARD, IN_TRANSIT, COMPLETED, CANCELLED" }
      - { name: safety_state, type: enum, source: computed, description: "NORMAL | DISCREPANCY | LOCKED — compound posture gating every trip transition", default: "NORMAL", constraints: "enum values: NORMAL, DISCREPANCY, LOCKED" }
      - { name: candidate_driver_id, type: string, source: system, description: "FK -> Driver.id; pinned by POST /student-rides/trips/{id}/dispatch-candidate and re-checked at accept time", required: false }
      - { name: claimed_by_user_id, type: string, source: system, description: "X-User-ID that accepted the trip; equals driver_id for a legal acceptance" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID that most recently captured a handoff verification" }
      - { name: verified_authorized_adult_name, type: string, source: computed, description: "Name of the party recorded on the most recent PASSED DROPOFF handoff", required: false }
      - { name: billable_ride_units, type: integer, source: computed, description: "Completed leg units: 0 while not COMPLETED, 2 when a PICKUP and a DROPOFF handoff both passed, 1 otherwise", default: 0 }
      - { name: planned_miles, type: number, source: input, description: "Route distance fixed when the trip was generated; the quote variant prices against this", default: 0 }
      - { name: billable_miles, type: number, source: input, description: "Odometer miles recorded at completion; the settlement variant prices against this", default: 0 }
      - { name: billing_period_key, type: string, source: computed, description: "Period key derived from scheduled_date under the district's ACTIVE contract.billing_period" }
      - { name: exception_code, type: enum, source: computed, description: "null | RIDER_NOT_PRESENT | RIDER_REFUSED_BOARDING | UNAUTHORIZED_DROPOFF", required: false, constraints: "enum values: null, RIDER_NOT_PRESENT, RIDER_REFUSED_BOARDING, UNAUTHORIZED_DROPOFF" }
      - { name: exception_recorded_at, type: datetime, source: system, description: "When exception_code was last stamped", required: false }
      - { name: accepted_at, type: datetime, source: system, description: "When the driver accepted the trip", required: false }
      - { name: completed_at, type: datetime, source: system, description: "When trip_state became COMPLETED", required: false }

  # ---------------------------------------------------------------------------
  - name: HandoffVerification
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; the trip this handoff belongs to" }
      - { name: leg, type: enum, source: input, description: "PICKUP | DROPOFF", constraints: "enum values: PICKUP, DROPOFF" }
      - { name: expected_party, type: enum, source: input, description: "SCHOOL_STAFF | AUTHORIZED_ADULT | PLACEMENT_WORKER", constraints: "enum values: SCHOOL_STAFF, AUTHORIZED_ADULT, PLACEMENT_WORKER" }
      - { name: verified_party_name, type: string, source: input, description: "Name of the person who received or released the student" }
      - { name: verification_method, type: enum, source: input, description: "PHOTO_ID | PIN | PHYSICAL_SIGNATURE", constraints: "enum values: PHOTO_ID, PIN, PHYSICAL_SIGNATURE" }
      - { name: verification_code, type: string, source: input, description: "Six-character code, required when verification_method is PIN" }
      - { name: authorized, type: boolean, source: computed, description: "Result of calculations.handoff_verification_authorization", default: false }
      - { name: result, type: enum, source: computed, description: "PASSED | FAILED", default: "FAILED", constraints: "enum values: PASSED, FAILED" }
      - { name: captured_at, type: datetime, source: system, description: "Server instant the handoff was recorded" }

  # ---------------------------------------------------------------------------
  - name: SafetyIncident
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; the trip on which the incident occurred" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; the driver assigned to the trip at the time of the incident" }
      - { name: category, type: enum, source: input, description: "NO_SHOW_UNVERIFIED | DRIVER_MISCONDUCT | VEHICLE_UNSAFE | HANDOFF_DISPUTE | STUDENT_DISTRESS", constraints: "enum values: NO_SHOW_UNVERIFIED, DRIVER_MISCONDUCT, VEHICLE_UNSAFE, HANDOFF_DISPUTE, STUDENT_DISTRESS" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH reported severity", constraints: "enum values: LOW, MEDIUM, HIGH" }
      - { name: reported_by_actor, type: string, source: input, description: "Free-text actor name recorded on the report" }
      - { name: summary, type: string, source: input, description: "Short description of what happened" }
      - { name: adjudication, type: enum, source: computed, description: "null | DRIVER_AT_FAULT | NO_FAULT", required: false, constraints: "enum values: null, DRIVER_AT_FAULT, NO_FAULT" }
      - { name: resolution_note, type: string, source: input, description: "Support agent's closing note", required: false }
      - { name: student_impact_score, type: integer, source: computed, description: "0-100 impact score; see calculations.safety_incident_impact_score" }
      - { name: status, type: enum, source: computed, description: "REPORTED | UNDER_REVIEW | RESOLVED | VOIDED", default: "REPORTED", constraints: "enum values: REPORTED, UNDER_REVIEW, RESOLVED, VOIDED" }

  # ---------------------------------------------------------------------------
  - name: TripAlert
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; the monitored trip this alert belongs to" }
      - { name: source_incident_id, type: string, source: system, description: "FK -> SafetyIncident.id; null for monitoring-generated alerts", required: false }
      - { name: alert_type, type: enum, source: system, description: "TRIP_DELAY | GEOFENCE_BREACH | HANDOFF_DISPUTE | STUDENT_ABSENT", constraints: "enum values: TRIP_DELAY, GEOFENCE_BREACH, HANDOFF_DISPUTE, STUDENT_ABSENT" }
      - { name: severity, type: enum, source: computed, description: "LOW | MEDIUM | HIGH — see calculations.trip_alert_severity", default: "LOW", constraints: "enum values: LOW, MEDIUM, HIGH" }
      - { name: notify_caregiver, type: boolean, source: computed, description: "True when the alert severity is MEDIUM or HIGH", default: false }
      - { name: notify_school, type: boolean, source: computed, description: "True for HANDOFF_DISPUTE or STUDENT_ABSENT alerts, or any HIGH severity alert", default: false }
      - { name: notify_support_center, type: boolean, source: computed, description: "True when severity is HIGH and the district has support_center_alert_enabled, or the driver has 3 or more strikes", default: false }
      - { name: status, type: enum, source: computed, description: "OPEN | RESOLVED", default: "OPEN", constraints: "enum values: OPEN, RESOLVED" }
      - { name: released_by_resolution, type: boolean, source: computed, description: "True when this alert was closed by a sweep of the trip's OPEN alerts rather than by a direct POST /student-rides/trip-alerts/{id}/resolve call", default: false }

  # ---------------------------------------------------------------------------
  - name: Geofence
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; the district that registered this fence" }
      - { name: label, type: string, source: input, description: "Human label, e.g. \"Lincoln Elementary campus\"" }
      - { name: center_lat, type: number, source: input, description: "Circle centre latitude" }
      - { name: center_lon, type: number, source: input, description: "Circle centre longitude" }
      - { name: radius_miles, type: number, source: input, description: "Circle radius in miles; containment is tested with no buffer" }
      - { name: registered_on, type: string, source: system, description: "ISO date string the fence took effect" }

  # ---------------------------------------------------------------------------
  - name: GeofenceCheck
    parent: Trip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; the trip whose position was tested" }
      - { name: geofence_id, type: string, source: input, description: "FK -> Geofence.id; the fence this observation was tested against" }
      - { name: observed_at, type: datetime, source: input, description: "Instant of the observed position" }
      - { name: observed_lat, type: number, source: input, description: "Observed latitude" }
      - { name: observed_lon, type: number, source: input, description: "Observed longitude" }
      - { name: inside, type: boolean, source: computed, description: "Whether the observed point fell inside the circle; see calculations.geofence_containment" }
      - { name: breach_alert_id, type: string, source: system, description: "Id of the GEOFENCE_BREACH TripAlert raised by this check, null when inside is true", required: false }

  # ---------------------------------------------------------------------------
  - name: BillingStatement
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id; the billed district" }
      - { name: contract_id, type: string, source: system, description: "Rate-provenance stamp: the id of the Contract whose rates and minimum were applied. Deliberately NOT declared as a foreign key, because a statement outlives the contract it was computed under and must stay resolvable after that contract reachability; the id is resolvable through GET /student-rides/billing-statements?contract_id=" }
      - { name: period_key, type: string, source: input, description: "Billing period key; must match Trip.billing_period_key of the trips being billed" }
      - { name: period_start, type: string, source: input, description: "ISO date string, inclusive first day of the billed period" }
      - { name: period_end, type: string, source: input, description: "ISO date string, inclusive last day of the billed period" }
      - { name: total_ride_units, type: integer, source: computed, description: "Sum of billable_ride_units over included trips", default: 0 }
      - { name: total_miles, type: number, source: computed, description: "Sum of billable_miles over included trips", default: 0 }
      - { name: total_amount_cents, type: integer, source: computed, description: "Sum of per-trip billed totals over included trips, less applied credit", default: 0 }
      - { name: applied_credit_cents, type: integer, source: computed, description: "District credit consumed by this statement", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "When the statement left OPEN", required: false }
      - { name: status, type: enum, source: computed, description: "OPEN | ISSUED | PAID | VOIDED", default: "OPEN", constraints: "enum values: OPEN, ISSUED, PAID, VOIDED" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Driver
    initial_state: PENDING
    terminal_states: [INACTIVE]
    transitions:
      - from: PENDING
        to: BACKGROUND_CHECK
        trigger: "POST /student-rides/drivers/{id}/background-checks"
        actor: DistrictAdmin
        preconditions:
          - "driver.status == PENDING"
          - "no BackgroundCheck for this driver already has check_type FINGERPRINT_FBI (ERR_DUPLICATE_CLEARANCE)"
        side_effects:
          - "driver.status = BACKGROUND_CHECK"
          - "BackgroundCheck created with result PENDING"
        note: "Driver lifecycle is a linear qualification pipeline that only ever runs forward. The gates that make it hard live elsewhere (content gating on the BackgroundCheck machine)."

      - from: BACKGROUND_CHECK
        to: INSPECTION
        trigger: "POST /student-rides/drivers/{id}/inspections"
        actor: DistrictAdmin
        preconditions:
          - "driver.status == BACKGROUND_CHECK"
          - "driver.caregiver_experience_months >= CAREGIVER_EXPERIENCE_MIN_MONTHS (ERR_CAREGIVER_EXPERIENCE_SHORT)"
          - "at least one BackgroundCheck for this driver has result CLEARED (ERR_CLEARANCE_INCOMPLETE)"
        side_effects:
          - "driver.status = INSPECTION"
          - "VehicleInspection created with result PENDING"
          - "driver.version += 1"

      - from: INSPECTION
        to: ACTIVE
        trigger: "POST /student-rides/vehicle-inspections/{id}/attest"
        actor: DistrictAdmin
        preconditions:
          - "inspection.result == PENDING"
          - "inspection.expires_on is strictly after the logical clock date (ERR_CLEARANCE_EXPIRED)"
          - "inspection.seat_count >= 1 (ERR_INSPECTION_SEAT_COUNT)"
        side_effects:
          - "inspection.result = PASSED"
          - "inspection.seat_credit = inspection.seat_count"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"
          - "driver.compliance_expires_at = calculations.driver_compliance_expiry"
          - "driver.status = ACTIVE"
        note: "Only legal from INSPECTION; a driver whose status is PENDING or BACKGROUND_CHECK is rejected with ERR_INVALID_STATE even when the inspection itself is PENDING."

      - from: INSPECTION
        to: PENDING
        trigger: "POST /student-rides/vehicle-inspections/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "inspection.result == PENDING"
          - "driver.status == INSPECTION"
        side_effects:
          - "inspection.result = FAILED"
          - "inspection.seat_credit = 0"
          - "driver.approved_seat_count = 0"
          - "driver.compliance_expires_at = null"
          - "driver.status = PENDING"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a SafetyIncident for this driver is resolved with adjudication DRIVER_AT_FAULT and the recomputed incident_strike_count reaches DRIVER_SUSPENSION_STRIKE_THRESHOLD)"
        actor: system
        preconditions:
          - "driver.incident_strike_count >= DRIVER_SUSPENSION_STRIKE_THRESHOLD"
        side_effects:
          - "driver.status = SUSPENDED"
          - "every Trip for this driver with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED (driver_id = null, claimed_by_user_id = null, accepted_at = null, candidate_driver_id = null, safety_state = LOCKED)"
          - "district.trips_scheduled_total decremented once per trip cancelled by this cascade"
        note: "Third hop of the strike cascade: SafetyIncident resolve → driver_incident_strike_count increment → driver suspension → cancellation of every unstarted trip."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /student-rides/drivers/{id}/reactivate"
        actor: DistrictAdmin
        preconditions:
          - "driver.status == SUSPENDED"
          - "driver.compliance_expires_at is strictly after the logical clock instant (ERR_CLEARANCE_EXPIRED)"
        side_effects:
          - "driver.status = ACTIVE"
          - "driver.version += 1"

      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /student-rides/drivers/{id}/deactivate"
        actor: DistrictAdmin
        preconditions:
          - "driver.status == ACTIVE"
          - "no Trip for this driver with trip_state in {AWAITING_STUDENT, STUDENT_ONBOARD, IN_TRANSIT} (ERR_DRIVER_ON_TRIP)"
        side_effects:
          - "driver.status = INACTIVE"
          - "driver.approved_seat_count = 0"

      - from: SUSPENDED
        to: INACTIVE
        trigger: "POST /student-rides/drivers/{id}/deactivate"
        actor: DistrictAdmin
        preconditions:
          - "driver.status == SUSPENDED"
          - "no Trip for this driver with trip_state in {AWAITING_STUDENT, STUDENT_ONBOARD, IN_TRANSIT}"
        side_effects:
          - "driver.status = INACTIVE"
          - "driver.approved_seat_count = 0"

  # ---------------------------------------------------------------------------
  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /student-rides/background-checks/{id}/clear"
        actor: DistrictAdmin
        preconditions:
          - "check.result == PENDING"
          - "check.expires_on is strictly after the logical clock date (ERR_CLEARANCE_EXPIRED)"
        side_effects:
          - "check.result = CLEARED"
          - "check.cleared_after_months = whole months between check.created_at and the logical clock instant"
          - "driver.compliance_expires_at = calculations.driver_compliance_expiry"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"
          - "when the driver has an existing FAILED BackgroundCheck, driver.status remains BACKGROUND_CHECK"

      - from: PENDING
        to: FAILED
        trigger: "POST /student-rides/background-checks/{id}/fail"
        actor: DistrictAdmin
        preconditions:
          - "check.result == PENDING"
        side_effects:
          - "check.result = FAILED"
          - "every other BackgroundCheck for this driver with result PENDING → result FAILED"
          - "driver.status = PENDING"
          - "driver.approved_seat_count = 0"
          - "driver.compliance_expires_at = null"
          - "every Trip for this driver with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED (driver_id = null, candidate_driver_id = null, safety_state = LOCKED)"

      - from: CLEARED
        to: FAILED
        trigger: "POST /student-rides/background-checks/{id}/fail"
        actor: DistrictAdmin
        preconditions:
          - "check.result == CLEARED"
          - "check.check_type in {FINGERPRINT_FBI, FINGERPRINT_STATE, SEX_OFFENDER_REGISTRY}"
        side_effects:
          - "check.result = FAILED"
          - "driver.status = SUSPENDED"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"
          - "every Trip for this driver with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED (driver_id = null, safety_state = LOCKED)"
        note: "Revoking an already-cleared fingerprint clearance is the only legal exit from a terminal CLEARED state; COUNTY_COURT clearances cannot be revoked here (ERR_INVALID_STATE)."

  # ---------------------------------------------------------------------------
  - entity: VehicleInspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /student-rides/vehicle-inspections/{id}/attest"
        actor: DistrictAdmin
        preconditions:
          - "inspection.result == PENDING"
          - "inspection.expires_on is strictly after the logical clock date (ERR_CLEARANCE_EXPIRED)"
          - "inspection.seat_count >= 1 (ERR_INSPECTION_SEAT_COUNT)"
          - "driver.status == INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "inspection.result = PASSED"
          - "inspection.seat_credit = inspection.seat_count"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"
          - "driver.status = ACTIVE"

      - from: PENDING
        to: FAILED
        trigger: "POST /student-rides/vehicle-inspections/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "inspection.result == PENDING"
        side_effects:
          - "inspection.result = FAILED"
          - "inspection.seat_credit = 0"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"

      - from: PASSED
        to: FAILED
        trigger: "POST /student-rides/vehicle-inspections/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "inspection.result == PASSED"
        side_effects:
          - "inspection.result = FAILED"
          - "inspection.seat_credit = 0"
          - "driver.approved_seat_count = calculations.driver_approved_seat_count"
          - "driver.status = SUSPENDED"
          - "every Trip for this driver with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED (driver_id = null, safety_state = LOCKED)"
        note: "Compensating action for attestation: reject zeroes seat_credit, so driver.approved_seat_count returns exactly to the value it held before the attest."

  # ---------------------------------------------------------------------------
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /student-rides/contracts/{id}/activate"
        actor: DistrictAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "contract.effective_from <= contract.through_date (ERR_CONTRACT_DATE_ORDER)"
          - "no other Contract for this district has status ACTIVE (ERR_CONTRACT_OVERLAP)"
        side_effects:
          - "contract.status = ACTIVE"
          - "every other Contract for this district with status DRAFT → status EXPIRED"
          - "district.account_status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /student-rides/contracts/{id}/suspend"
        actor: DistrictAdmin
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "contract.status = SUSPENDED"
          - "district.account_status = SUSPENDED"
          - "every BillingStatement for this district with status OPEN → status VOIDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /student-rides/contracts/{id}/reactivate"
        actor: DistrictAdmin
        preconditions:
          - "contract.status == SUSPENDED"
          - "the logical clock date is not after contract.through_date (ERR_CONTRACT_TERM_ENDED)"
        side_effects:
          - "contract.status = ACTIVE"
          - "district.account_status = ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic during POST /student-rides/districts/{id}/billing-runs when the logical clock date is strictly after contract.through_date)"
        note: "EXPIRED is terminal for Contract: every later reactivate, suspend or second activation attempt is refused with ERR_ALREADY_TERMINAL, which is how a terminal-lockdown probe differs from a merely wrong-state one."
        actor: system
        preconditions:
          - "contract.through_date < logical clock date"
        side_effects:
          - "contract.status = EXPIRED"
          - "district.account_status = SUSPENDED"

      - from: DRAFT
        to: EXPIRED
        trigger: "system (automatic during POST /student-rides/contracts/{id}/activate when another contract for the same district becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "contract.status = EXPIRED"

  # ---------------------------------------------------------------------------
  - entity: RideRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /student-rides/ride-requests/{id}/submit"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == DRAFT"
          - "ride_request.window_start_at < ride_request.window_end_at (ERR_WINDOW_ORDER)"
          - "(window_end_at - window_start_at) <= max_window_minutes (ERR_WINDOW_TOO_WIDE)"
        side_effects:
          - "ride_request.status = SUBMITTED"
          - "rider.active_ride_request_count = calculations.rider_active_request_count"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /student-rides/ride-requests/{id}/approve"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SUBMITTED"
          - "rider.status == ACTIVE (ERR_RIDER_INACTIVE)"
          - "when is_recurring is false: hours between the logical clock instant and ride_request.window_start_at >= min_lead_time_hours (ERR_LEAD_TIME_TOO_SHORT)"
          - "when is_recurring is true: ride_request.series_effective_from >= ACADEMIC_TERM_OPEN_DATE (ERR_OUTSIDE_SCHOOL_TERM)"
          - "when is_recurring is true: ride_request.days_of_week contains at least one integer in 1..7 (ERR_INVALID_REQUEST)"
        side_effects:
          - "ride_request.status = APPROVED"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /student-rides/ride-requests/{id}/request-revision"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SUBMITTED"
        side_effects:
          - "ride_request.status = REVISION_REQUESTED"
          - "ride_request.revision_count += 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /student-rides/ride-requests/{id}/resubmit"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == REVISION_REQUESTED"
        side_effects:
          - "ride_request.status = SUBMITTED"
        note: "Closes the revision cycle: SUBMITTED → REVISION_REQUESTED → SUBMITTED may repeat without bound, and the revision_count is the observable record of how many loops ran."

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /student-rides/ride-requests/{id}/schedule"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == APPROVED"
          - "when is_recurring is false: no Trip for this ride_request already has a scheduled_date equal to the requested scheduled_date (ERR_ALREADY_SCHEDULED)"
          - "when is_recurring is true: calculations.recurring_allocation_count > 0 (ERR_NO_SCHOOL_DAYS_IN_RANGE)"
          - "when is_recurring is true: for every included date D, calculations.recurring_dispatch_rank yields at least one candidate driver (ERR_NO_ELIGIBLE_DRIVER)"
          - "when is_recurring is true: calculations.driver_segment_overlap_check_for_series reports no excluded driver/date pair (ERR_DRIVER_WINDOW_OVERLAP)"
          - "no included date has a trip window that touches or overlaps an existing non-terminal Trip window for the same rider (ERR_RIDER_WINDOW_OVERLAP)"
        side_effects:
          - "ride_request.status = SCHEDULED"
          - "ride_request.recurring_series_active = ride_request.is_recurring"
          - "one Trip created per date produced by calculations.recurring_allocation_count, each with trip_state SCHEDULED, safety_state NORMAL, ride_request_id set, rider_id set, driver_id null"
          - "district.trips_scheduled_total += number of Trips created"
          - "every date that is not included by calculations.recurring_allocation_count produces no Trip"

      - from: SCHEDULED
        to: SERIES_SUSPENDED
        trigger: "POST /student-rides/ride-requests/{id}/suspend-series"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SCHEDULED"
          - "ride_request.is_recurring == true (ERR_NOT_RECURRING)"
          - "no Trip for this ride_request has trip_state in {STUDENT_ONBOARD, IN_TRANSIT} (ERR_TRIP_IN_PROGRESS)"
        side_effects:
          - "ride_request.status = SERIES_SUSPENDED"
          - "ride_request.recurring_series_active = false"
          - "every Trip for this ride_request with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED, candidate_driver_id = null, safety_state = NORMAL"
          - "district.trips_scheduled_total decremented once per trip cancelled by this cascade"

      - from: SERIES_SUSPENDED
        to: SCHEDULED
        trigger: "POST /student-rides/ride-requests/{id}/resume-series"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SERIES_SUSPENDED"
          - "the logical clock date is not after ride_request.series_through_date (ERR_SERIES_ENDED)"
          - "calculations.recurring_allocation_count > 0 (ERR_NO_SCHOOL_DAYS_IN_RANGE)"
        side_effects:
          - "ride_request.status = SCHEDULED"
          - "ride_request.recurring_series_active = true"
          - "one Trip created per date produced by calculations.recurring_allocation_count"
          - "district.trips_scheduled_total += number of Trips created"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /student-rides/ride-requests/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SUBMITTED"
        side_effects:
          - "ride_request.status = REJECTED"
          - "ride_request.recurring_series_active = false"
          - "rider.active_ride_request_count = calculations.rider_active_request_count"

      - from: APPROVED
        to: REJECTED
        trigger: "POST /student-rides/ride-requests/{id}/reject"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == APPROVED"
        side_effects:
          - "ride_request.status = REJECTED"
          - "ride_request.recurring_series_active = false"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /student-rides/ride-requests/{id}/cancel"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == DRAFT"
        side_effects:
          - "ride_request.status = CANCELLED"
          - "ride_request.recurring_series_active = false"

      - from: SERIES_SUSPENDED
        to: CANCELLED
        trigger: "POST /student-rides/ride-requests/{id}/cancel"
        actor: DistrictAdmin
        preconditions:
          - "ride_request.status == SERIES_SUSPENDED"
        side_effects:
          - "ride_request.status = CANCELLED"
          - "ride_request.recurring_series_active = false"

  # ---------------------------------------------------------------------------
  - entity: Trip
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      # --- trip_state dimension ---
      - from: SCHEDULED
        to: DRIVER_EN_ROUTE
        trigger: "POST /student-rides/trips/{id}/accept"
        actor: Driver
        preconditions:
          - "trip.trip_state == SCHEDULED (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
          - "trip.driver_id is null (ERR_TRIP_ALREADY_CLAIMED)"
          - "X-User-ID equals the id returned by POST /student-rides/trips/{id}/dispatch-candidate (ERR_DRIVER_NOT_SELECTED)"
        side_effects:
          - "trip.trip_state = DRIVER_EN_ROUTE"
          - "trip.driver_id = X-User-ID"
          - "trip.claimed_by_user_id = X-User-ID"
          - "trip.accepted_at = the logical clock instant"
          - "driver.version += 1"
        note: "dimension: trip_state. Candidate freshness is re-checked here because the driver roster can change between dispatch-candidate and accept."

      - from: DRIVER_EN_ROUTE
        to: AWAITING_STUDENT
        trigger: "POST /student-rides/trips/{id}/arrive"
        actor: Driver
        preconditions:
          - "trip.trip_state == DRIVER_EN_ROUTE (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
        side_effects:
          - "trip.trip_state = AWAITING_STUDENT"
        note: "dimension: trip_state"

      - from: AWAITING_STUDENT
        to: STUDENT_ONBOARD
        trigger: "POST /student-rides/trips/{id}/handoffs"
        actor: Driver
        preconditions:
          - "trip.trip_state == AWAITING_STUDENT (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
          - "handoff.leg == PICKUP (ERR_INVALID_STATE)"
          - "handoff.result == PASSED (ERR_HANDOFF_NOT_AUTHORIZED)"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
        side_effects:
          - "trip.trip_state = STUDENT_ONBOARD"
          - "trip.verified_by_user_id = X-User-ID"
          - "when rider.notify_on_pickup is true: a pickup notice is dispatched to rider.emergency_contact_phone; when false: no notice is emitted"
          - "TripAlert with alert_type STUDENT_ABSENT and source_incident_id null is created only when handoff.result is FAILED; a PASSED pickup creates no alert"
        note: "dimension: trip_state. The rider's real contact detail never reaches the driver — only rider.support_center_phone_masked is exposed."

      - from: STUDENT_ONBOARD
        to: IN_TRANSIT
        trigger: "POST /student-rides/trips/{id}/depart"
        actor: Driver
        preconditions:
          - "trip.trip_state == STUDENT_ONBOARD (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
        side_effects:
          - "trip.trip_state = IN_TRANSIT"
          - "TripAlert with alert_type GEOFENCE_BREACH and source_incident_id null is created when the logical clock instant is strictly after trip.window_end_at"
        note: "dimension: trip_state"

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /student-rides/trips/{id}/handoffs"
        actor: Driver
        preconditions:
          - "trip.trip_state == IN_TRANSIT (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
          - "handoff.leg == DROPOFF (ERR_INVALID_STATE)"
          - "handoff.result == PASSED (ERR_HANDOFF_NOT_AUTHORIZED)"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
        side_effects:
          - "trip.trip_state = COMPLETED"
          - "trip.completed_at = the logical clock instant"
          - "trip.verified_by_user_id = X-User-ID"
          - "trip.verified_authorized_adult_name = handoff.verified_party_name"
          - "trip.billable_ride_units = calculations.trip_billable_ride_units"
          - "when rider.notify_on_dropoff is true: a dropoff notice is dispatched to rider.emergency_contact_phone"
          - "when the parent RideRequest is SCHEDULED: rider.active_ride_request_count is recomputed"
        note: "dimension: trip_state"

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /student-rides/trips/{id}/handoffs"
        actor: Driver
        preconditions:
          - "trip.trip_state == IN_TRANSIT (ERR_INVALID_STATE)"
          - "handoff.leg == DROPOFF (ERR_INVALID_STATE)"
          - "handoff.result == FAILED"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
        side_effects:
          - "trip.trip_state = COMPLETED"
          - "trip.completed_at = the logical clock instant"
          - "trip.safety_state = DISCREPANCY"
          - "trip.exception_code = UNAUTHORIZED_DROPOFF"
          - "trip.exception_recorded_at = the logical clock instant"
          - "trip.billable_ride_units = calculations.trip_billable_ride_units"
          - "TripAlert with alert_type HANDOFF_DISPUTE is created"
          - "SafetyIncident with category HANDOFF_DISPUTE, severity MEDIUM, status REPORTED and driver_id = trip.driver_id is created"
          - "the second and later FAILED DROPOFF attempts on the same trip are rejected with ERR_HANDOFF_ALREADY_ATTEMPTED"
        note: "dimension: trip_state. A failing handoff is a content-gated graph problem: the dropoff may be FAILED outright, or PASSED against a party who is not on the rider's authorized_adults list. The two require different codes here."

      - from: AWAITING_STUDENT
        to: CANCELLED
        trigger: "POST /student-rides/trips/{id}/exceptions"
        actor: Driver
        preconditions:
          - "trip.trip_state == AWAITING_STUDENT (ERR_INVALID_STATE)"
          - "issue in {RIDER_NOT_PRESENT, RIDER_REFUSED_BOARDING} (ERR_INVALID_REQUEST)"
          - "X-User-ID == trip.driver_id (ERR_NOT_TRIP_DRIVER)"
          - "calculations.wait_time_block_units >= WAIT_TIME_MIN_BLOCKS (ERR_WAIT_TIME_NOT_MET)"
          - "no SafetyIncident for this trip already has category NO_SHOW_UNVERIFIED (ERR_INCIDENT_ALREADY_REPORTED)"
        side_effects:
          - "trip.trip_state = CANCELLED"
          - "trip.exception_code = issue"
          - "trip.exception_recorded_at = the logical clock instant"
          - "calculations.student_absence_grade is applied: LOW leaves trip.safety_state NORMAL, MEDIUM sets trip.safety_state DISCREPANCY, HIGH sets trip.safety_state LOCKED"
          - "SafetyIncident with category NO_SHOW_UNVERIFIED, status REPORTED, driver_id = trip.driver_id and severity = calculations.student_absence_grade is created"
          - "TripAlert with alert_type STUDENT_ABSENT is created"
          - "when calculations.student_absence_grade == HIGH: driver.incident_strike_count += 1"
          - "when driver.incident_strike_count >= DRIVER_SUSPENSION_STRIKE_THRESHOLD: the Driver ACTIVE → SUSPENDED cascade runs, cancelling every other SCHEDULED Trip for that driver"
        note: "dimension: trip_state"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /student-rides/trips/{id}/cancel"
        actor: DistrictAdmin
        preconditions:
          - "trip.trip_state == SCHEDULED (ERR_INVALID_STATE)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
        side_effects:
          - "trip.trip_state = CANCELLED"
          - "district.trips_scheduled_total -= 1"
        note: "dimension: trip_state"

      # --- safety_state dimension (posture gating every trip_state transition) ---
      - from: NORMAL
        to: DISCREPANCY
        trigger: "system (automatic when trip.exception_code is set to UNAUTHORIZED_DROPOFF, when calculations.student_absence_grade returns MEDIUM, or when a TripAlert with severity MEDIUM is created for this trip)"
        actor: system
        preconditions:
          - "trip.safety_state == NORMAL"
        side_effects:
          - "trip.safety_state = DISCREPANCY"
          - "every trip_state transition out of AWAITING_STUDENT, STUDENT_ONBOARD or IN_TRANSIT is thereafter rejected with ERR_TRIP_DISCREPANCY_LOCK"
        note: "dimension: safety_state"

      - from: NORMAL
        to: LOCKED
        trigger: "system (automatic when calculations.student_absence_grade returns HIGH, when a TripAlert with severity HIGH is created for this trip, or when an active Driver suspension cascade cancels this trip)"
        actor: system
        preconditions:
          - "trip.safety_state == NORMAL"
        side_effects:
          - "trip.safety_state = LOCKED"
        note: "dimension: safety_state"

      - from: DISCREPANCY
        to: NORMAL
        trigger: "POST /student-rides/trips/{id}/resolve-discrepancy"
        actor: SupportCenterAgent
        preconditions:
          - "trip.safety_state == DISCREPANCY"
          - "trip.trip_state == COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "trip.safety_state = NORMAL"
          - "trip.exception_code = null"
          - "trip.exception_recorded_at = null"
          - "trip.billable_ride_units retains the completion-time lockout value and is NOT recomputed"
        note: "dimension: safety_state. Clearing the exception after completion deliberately does not refund the penalised ride unit."

      - from: LOCKED
        to: NORMAL
        trigger: "POST /student-rides/trips/{id}/release-lock"
        actor: PlatformAdmin
        preconditions:
          - "trip.safety_state == LOCKED"
          - "every TripAlert for this trip has status RESOLVED (ERR_OPEN_ALERTS)"
        side_effects:
          - "trip.safety_state = NORMAL"
        note: "dimension: safety_state"

      - from: LOCKED
        to: DISCREPANCY
        trigger: "POST /student-rides/trips/{id}/resolve-discrepancy"
        actor: SupportCenterAgent
        preconditions:
          - "trip.safety_state == LOCKED"
          - "every TripAlert for this trip has status RESOLVED (ERR_OPEN_ALERTS)"
        side_effects:
          - "trip.safety_state = DISCREPANCY"
        note: "dimension: safety_state"

      # --- revert cycle on the trip_state dimension ---
      - from: CANCELLED
        to: SCHEDULED
        trigger: "POST /student-rides/trips/{id}/restore"
        actor: DistrictAdmin
        preconditions:
          - "trip.trip_state == CANCELLED (ERR_INVALID_STATE)"
          - "the parent RideRequest has status SCHEDULED (ERR_REQUEST_NOT_SCHEDULED)"
          - "trip.scheduled_date >= the logical clock date (ERR_TRIP_IN_PAST)"
          - "trip.safety_state == NORMAL (ERR_TRIP_DISCREPANCY_LOCK)"
        side_effects:
          - "trip.trip_state = SCHEDULED"
          - "trip.driver_id = null"
          - "trip.claimed_by_user_id = null"
          - "trip.accepted_at = null"
          - "trip.exception_code = null"
          - "trip.exception_recorded_at = null"
          - "district.trips_scheduled_total += 1"
        note: "dimension: trip_state. Closes the CANCELLED → SCHEDULED cycle; a trip cancelled because the rider did not board cannot be restored while its exception still grades MEDIUM or HIGH, because that leaves safety_state non-NORMAL."

  # ---------------------------------------------------------------------------
  - entity: SafetyIncident
    initial_state: REPORTED
    terminal_states: [VOIDED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /student-rides/safety-incidents/{id}/review"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "incident.status = UNDER_REVIEW"
          - "every TripAlert with source_incident_id == incident.id and status OPEN → status RESOLVED"

      - from: REPORTED
        to: RESOLVED
        trigger: "POST /student-rides/safety-incidents/{id}/resolve"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == REPORTED"
          - "resolution_note is non-empty (ERR_RESOLUTION_NOTE_REQUIRED)"
          - "adjudication == NO_FAULT (ERR_ADJUDICATION_REQUIRED)"
        side_effects:
          - "incident.status = RESOLVED"
          - "incident.adjudication = NO_FAULT"
          - "incident.student_impact_score = calculations.safety_incident_impact_score"

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /student-rides/safety-incidents/{id}/resolve"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == UNDER_REVIEW"
          - "resolution_note is non-empty (ERR_RESOLUTION_NOTE_REQUIRED)"
          - "adjudication == DRIVER_AT_FAULT (ERR_ADJUDICATION_REQUIRED)"
        side_effects:
          - "incident.status = RESOLVED"
          - "incident.adjudication = DRIVER_AT_FAULT"
          - "incident.student_impact_score = calculations.safety_incident_impact_score"
          - "driver.incident_strike_count += 1"
          - "when driver.incident_strike_count >= DRIVER_SUSPENSION_STRIKE_THRESHOLD: driver.status = SUSPENDED"
          - "when driver.status becomes SUSPENDED: every Trip for this driver with trip_state in {SCHEDULED, DRIVER_EN_ROUTE} → trip_state CANCELLED (driver_id = null, claimed_by_user_id = null, candidate_driver_id = null, safety_state = LOCKED) and district.trips_scheduled_total decremented once per trip"

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /student-rides/safety-incidents/{id}/resolve"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == UNDER_REVIEW"
          - "resolution_note is non-empty (ERR_RESOLUTION_NOTE_REQUIRED)"
          - "adjudication == NO_FAULT (ERR_ADJUDICATION_REQUIRED)"
          - "driver.incident_strike_count < DRIVER_SUSPENSION_STRIKE_THRESHOLD (ERR_SUSPENSION_REQUIRES_FAULT)"
        side_effects:
          - "incident.status = RESOLVED"
          - "incident.adjudication = NO_FAULT"
          - "incident.student_impact_score = calculations.safety_incident_impact_score"

      - from: RESOLVED
        to: UNDER_REVIEW
        trigger: "POST /student-rides/safety-incidents/{id}/reopen"
        actor: PlatformAdmin
        preconditions:
          - "incident.status == RESOLVED"
          - "incident.adjudication == DRIVER_AT_FAULT (ERR_INVALID_STATE)"
        side_effects:
          - "incident.status = UNDER_REVIEW"
          - "incident.adjudication = null"
          - "driver.incident_strike_count -= 1"
          - "when driver.incident_strike_count < DRIVER_SUSPENSION_STRIKE_THRESHOLD and driver.status == SUSPENDED: driver.status = ACTIVE"
        note: "Closes the adjudication cycle RESOLVED → UNDER_REVIEW; reopening is the compensating action for a DRIVER_AT_FAULT resolution."

      - from: REPORTED
        to: VOIDED
        trigger: "POST /student-rides/safety-incidents/{id}/void"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "incident.status = VOIDED"
          - "every TripAlert with source_incident_id == incident.id → status RESOLVED"

      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "POST /student-rides/safety-incidents/{id}/void"
        actor: SupportCenterAgent
        preconditions:
          - "incident.status == UNDER_REVIEW"
        side_effects:
          - "incident.status = VOIDED"
          - "every TripAlert with source_incident_id == incident.id → status RESOLVED"

  # ---------------------------------------------------------------------------
  - entity: TripAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /student-rides/trip-alerts/{id}/resolve"
        actor: SupportCenterAgent
        preconditions:
          - "alert.status == OPEN"
        side_effects:
          - "alert.status = RESOLVED"
          - "when no TripAlert for the parent trip remains OPEN and the parent trip.safety_state is LOCKED, the trip's safety_state becomes eligible for POST /student-rides/trips/{id}/release-lock"

      - from: RESOLVED
        to: OPEN
        trigger: "system (automatic when a new TripAlert is synthesised for the same parent trip within the same monitoring window)"
        actor: system
        preconditions:
          - "alert.status == RESOLVED"
          - "the parent trip.trip_state is not COMPLETED and not CANCELLED"
        side_effects:
          - "alert.status = OPEN"
        note: "Closes the OPEN → RESOLVED → OPEN cycle used by continuous trip monitoring. A NEW alert synthesised while an older one on the same trip is still OPEN raises the older one's severity to match, and sets released_by_resolution true on it when the batch is closed together under POST /student-rides/safety-incidents/{id}/review."

  # ---------------------------------------------------------------------------
  - entity: BillingStatement
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: ISSUED
        trigger: "POST /student-rides/billing-statements/{id}/issue"
        actor: DistrictAdmin
        preconditions:
          - "statement.status == OPEN (ERR_INVALID_STATE)"
          - "statement.total_amount_cents > 0 (ERR_EMPTY_STATEMENT)"
        side_effects:
          - "statement.status = ISSUED"
          - "statement.issued_at = the logical clock instant"
          - "district.outstanding_balance_cents += statement.total_amount_cents"
          - "district.account_status = SUSPENDED when district.outstanding_balance_cents is strictly greater than OVERDUE_THRESHOLD_CENTS (ERR_DISTRICT_OVER_LIMIT on the next issue)"

      - from: ISSUED
        to: PAID
        trigger: "POST /student-rides/billing-statements/{id}/approve-payment"
        note: "PAID is terminal: a second approve-payment, or an issue, void or approve-payment against a VOIDED statement, is refused with ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE."
        actor: DistrictAdmin
        preconditions:
          - "statement.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "statement.status = PAID"
          - "district.outstanding_balance_cents -= statement.total_amount_cents"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /student-rides/billing-statements/{id}/void"
        actor: DistrictAdmin
        preconditions:
          - "statement.status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "statement.status = VOIDED"
          - "district.outstanding_balance_cents -= statement.total_amount_cents"
          - "district.credit_balance_cents += statement.applied_credit_cents"
          - "district.outstanding_balance_cents + district.credit_balance_cents returns exactly to its pre-issue value"
        note: "Compensating action for issue. Only the credit actually consumed by the statement returns to the credit pool — returning total_amount_cents instead would drift the retained quantity."

      - from: OPEN
        to: VOIDED
        trigger: "system (automatic when the district's ACTIVE Contract transitions to SUSPENDED)"
        actor: system
        preconditions:
          - "statement.status == OPEN"
        side_effects:
          - "statement.status = VOIDED"
          - "district.credit_balance_cents += statement.applied_credit_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: ride-request-create-stale-district
    parent_entity: District
    write_endpoint: "POST /student-rides/ride-requests"
    occ_field: "expected_district_version"
    description: |
      Creating a second RideRequest for the same rider and pickup window against a
      District whose version has already advanced past the value the client last
      observed is rejected. This is the sanctioned create-with-supersede path: the
      new request legitimately supersedes the prior one under the intake policy, so
      a sequential second create would otherwise succeed; only the stale
      expected_district_version distinguishes the rejected attempt.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: billing-run-stale-district
    parent_entity: District
    write_endpoint: "POST /student-rides/districts/{id}/billing-runs"
    occ_field: "expected_district_version"
    description: |
      Running a billing run for a District whose version has advanced since the
      client last observed it is rejected. Re-running a billing run is legitimate
      product behaviour, so the second sequential call would otherwise produce a
      second statement for the period; only the stale expected_district_version
      makes the attempt rejectable.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: driver_approved_seat_count
    trigger: "any change to a Driver's BackgroundCheck or VehicleInspection rows, and on Driver creation"
    algorithm: constraint_propagation
    formula: |
      approved_seat_count = 0 if (
          driver.status not in {INSPECTION, ACTIVE, SUSPENDED}
          OR driver.caregiver_experience_months < CAREGIVER_EXPERIENCE_MIN_MONTHS
          OR count(c in driver.BackgroundCheck where c.result == CLEARED) < count(c in driver.BackgroundCheck where c.result != FAILED)
          OR count(c in driver.BackgroundCheck where c.expires_on <= logical_clock_date) > 0
          OR count(i in driver.VehicleInspection where i.result == FAILED) > 0
          OR count(i in driver.VehicleInspection where i.result == PASSED) == 0
          OR count(i in driver.VehicleInspection where i.expires_on <= logical_clock_date) > 0
          OR max({i.seat_count for PASSED inspections}) < count(non-terminal Trips for driver)
        )
        else min(driver.seat_capacity, max({i.seat_count for i in driver.VehicleInspection where i.result == PASSED}))
      # the BackgroundCheck guard is strongly additive: expiry removes a seat and
      # clearing a new check restores exactly one, so ++ and -- of approvals
      # cancel out. The VehicleInspection guard is NOT additive in the same way —
      # a FAILED inspection row zeroes the count outright, so the compensating
      # action that restores it is the LATER attestation of a fresh PENDING
      # inspection, never the un-failing of the old row.
      # the seat claim is evaluated against the driver's CURRENT non-terminal trip load,
      # so the value behaves in part like a running remaining-capacity counter and is
      # truncated by the declared capacity of the vehicle class.
    input_set: "Every BackgroundCheck with result in {CLEARED, FAILED} (PENDING rows do not gate), and every VehicleInspection with result in {PASSED, FAILED}; PENDING inspections never contribute seat credit."
    constants:
      CAREGIVER_EXPERIENCE_MIN_MONTHS: 12
      SEAT_CAPACITY_MAX: 10
    precision: "integer, no rounding"
    variants:
      - name: declared_class_cap
        when: "the driver's declared vehicle_class is used to cap the inspection-derived seat count"
        difference: "Caps the result at the seat ceiling for driver.vehicle_class (SEDAN 4, SUV 6, WHEELCHAIR_VAN 8) instead of the driver-declared seat_capacity, and ignores driver.seat_capacity entirely. A driver who declares seat_capacity 9 in an SUV reports 9 under the base rule and 6 under declared_class_cap."
      - name: on_road_only
        when: "the driver's currently non-terminal trip load is not yet subtracted"
        difference: "Computes the same min/max expression but omits the 'max(PASSED seat_count) < non-terminal trip count' veto, so it reports a positive seat count for a driver whose approved seats are already fully spoken for. Used at onboarding display time, never for dispatch eligibility."

  # ---------------------------------------------------------------------------
  - name: trip_charge_provisional_cents
    trigger: "Trip creation, and every mutation of the trip while trip_state is not COMPLETED; also recomputed when the covering Contract's rates are edited"
    algorithm: forward_looking
    formula: |
      # quote variant: priced from the PLANNED distance fixed when the trip was
      # scheduled, so the number is knowable before the vehicle moves.
      ride_component_cents = round_half_up(trip.billable_ride_units * contract.per_ride_rate_cents)
      mile_component_cents = round_half_up(trip.planned_miles * contract.per_mile_rate_cents)
      charge = ride_component_cents + mile_component_cents
      if trip.safety_state == DISCREPANCY:
          charge = charge - round_half_up(charge * QUOTE_DISCREPANCY_DISCOUNT)
      elif trip.safety_state == LOCKED:
          charge = 0
      # TWO deliberate omissions: the quote ignores contract.minimum_billable_cents
      # entirely, and it never reads trip.billable_miles. A trip quoted at 0 planned
      # miles therefore reads 0 here even though its contract carries an 800-cent floor.
    input_set: "Every Trip regardless of trip_state, including CANCELLED trips, because the quote is the record of what was promised at scheduling time."
    constants:
      QUOTE_DISCREPANCY_DISCOUNT: 0.25
    precision: "2 rounding points, round_half_up, integer cents"

  # ---------------------------------------------------------------------------
  - name: trip_charge_final_cents
    trigger: "when a Trip reaches trip_state COMPLETED, and on every subsequent mutation of billable_miles, planned_miles or safety_state"
    algorithm: chronological
    formula: |
      # settlement variant: priced from the ACTUAL odometer distance recorded at
      # completion rather than the planned distance.
      ride_component_cents = round_half_up(trip.billable_ride_units * contract.per_ride_rate_cents)
      mile_component_cents = round_half_up(trip.billable_miles * contract.per_mile_rate_cents)
      charge = ride_component_cents + mile_component_cents
      if trip.safety_state == DISCREPANCY:
          charge = charge - round_half_up(charge * QUOTE_DISCREPANCY_DISCOUNT)
      elif trip.safety_state == LOCKED:
          charge = round_half_up(charge * (1 - FINAL_LOCKED_DISCOUNT))
      charge = max(charge, contract.minimum_billable_cents)
      # the floor is applied LAST and only here, so a completed trip settles at the
      # contract floor while its quote for otherwise identical inputs reads the bare
      # per-ride rate.
    input_set: "Every Trip with trip_state == COMPLETED, including trips whose exception_code is non-null; CANCELLED trips settle at 0."
    constants:
      QUOTE_DISCREPANCY_DISCOUNT: 0.25
      FINAL_LOCKED_DISCOUNT: 0.5
    precision: "integer cents; round_half_up at each component, then the posture adjustment, then the floor"

  # ---------------------------------------------------------------------------
  - name: statement_total_cents
    trigger: "every statement computation at POST /student-rides/districts/{id}/billing-runs; also when a Trip's billable fields change inside an ISSUED period"
    algorithm: weighting
    formula: |
      # Pinned evaluation order — the credit term depends on a total that itself
      # depends on the credit term. Evaluated strictly in this order:
      #   step 1  per-trip charge  = calculations.trip_charge_final_cents for each included Trip
      #   step 2  gross_total      = sum of step-1 values, accumulated in
      #                              scheduled_date ASC, then trip completed_at ASC, then trip created_at ASC
      #   step 3  credit_available = district.credit_balance_cents
      #   step 4  applied_credit   = min(credit_available, floor(gross_total * CREDIT_APPLY_PCT))
      #   step 5  total_amount     = gross_total - applied_credit
      # step 4 is deliberately evaluated against gross_total, never against the
      # post-credit net, so the sequence total_amount = gross_total - f(gross_total)
      # is well-defined. Evaluating f against the net instead yields a smaller credit
      # and a different total for identical inputs.
      # statement.total_ride_units and total_miles are plain sums and do NOT feed this total.
    input_set: "Trips with trip_state == COMPLETED, billing_period_key == statement.period_key, and scheduled_date within [period_start, period_end] inclusive."
    constants:
      CREDIT_APPLY_PCT: 0.5
    precision: "1 rounding point at step 4 (round_half_up); integer cents"
    variants:
      - name: credit_against_net
        when: "the credit cap is applied to the net total rather than the gross total"
        difference: "Computes applied_credit = min(credit_available, floor((gross_total - credit_available) * CREDIT_APPLY_PCT)) and then subtracts it, producing a strictly smaller credit draw and a strictly larger total_amount_cents for identical inputs."

  # ---------------------------------------------------------------------------
  - name: recurring_allocation_count
    trigger: "POST /student-rides/ride-requests/{id}/schedule and POST /student-rides/ride-requests/{id}/resume-series on a recurring request"
    algorithm: interval_merge
    formula: |
      window_start = max(ride_request.series_effective_from, logical_clock_date)
      window_end   = ride_request.series_through_date
      excluded     = ride_request.series_no_school_dates UNION district.no_school_dates
      count = 0
      for each date D in [window_start, window_end] inclusive:
          if D not in excluded
             and ISO_weekday(D) in ride_request.days_of_week
             and D does not already have a Trip with ride_request_id == ride_request.id whose trip_state is not CANCELLED
             and D >= ACADEMIC_TERM_OPEN_DATE:
              count += 1
      # window_start is MAX(series_effective_from, logical_clock_date), not MIN: a series
      # with series_effective_from before the logical clock contributes nothing in the
      # past. Adopting MIN instead silently back-fills trips the district never asked for.
    input_set: "Dates only. A date is suppressed by any non-CANCELLED Trip already sitting on it, so a cancelled date becomes re-creatable and a resumed series can restore it."
    constants:
      ACADEMIC_TERM_OPEN_DATE: "2026-08-15"
    precision: "integer, no rounding"

  # ---------------------------------------------------------------------------
  - name: recurring_dispatch_rank
    trigger: "when a recurring series assigns a driver to each generated Trip, once per included date"
    algorithm: weighted_scoring
    formula: |
      # Selector. Candidate set, ranking key, tie-break and fallback are all pinned.
      #  (a) eligibility filter — candidate driver must satisfy ALL of:
      #      driver.status == ACTIVE
      #      driver.approved_seat_count >= 1
      #      driver.caregiver_experience_months >= CAREGIVER_EXPERIENCE_MIN_MONTHS
      #      driver.compliance_expires_at > selected_date_start_instant
      #      ride_request.required_specialty == NONE
      #        OR (required_specialty == CAREGIVER_REQUIRED and driver.caregiver_experience_months >= 12)
      #        OR (required_specialty == WHEELCHAIR and driver.vehicle_class == WHEELCHAIR_VAN)
      #  (b) ranking expression, ascending on the first key:
      #      sort key = ( candidate_has_seat_on_date ASC,        # 0 when the driver has no other
      #                                                          # trip whose window overlaps this date
      #                                                          1 otherwise
      #                   driver.incident_strike_count ASC,
      #                   rider.spi_level ASC )
      #  (c) tie-break when all three keys tie: driver.created_at ASC (earliest-registered wins).
      #      driver.id is NEVER consulted.
      #  (d) fallback when the candidate set is empty: the vetted_provider_fallback variant runs.
    input_set: "Active drivers only; INACTIVE, PENDING, BACKGROUND_CHECK and SUSPENDED drivers are excluded before ranking."
    constants:
      CAREGIVER_EXPERIENCE_MIN_MONTHS: 12
    precision: "integer keys only; no rounding"
    variants:
      - name: vetted_provider_fallback
        when: "the eligibility filter above returns an empty candidate set for the selected date"
        difference: "Widens the eligibility filter to driver.approved_seat_count >= 0 while still requiring driver.status == ACTIVE, then re-ranks with the same three keys plus a fourth key driver.compliance_expires_at DESC. If the widened set is also empty the scheduling call fails with ERR_NO_ELIGIBLE_DRIVER — no silent skip, no deferred queue."
      - name: weighted_score
        when: "the dispatcher requests a scored ordering instead of a lexicographic one"
        difference: "Collapses the three keys into score = 1000*candidate_has_seat_on_date + 10*driver.incident_strike_count + rider.spi_level and ranks ascending, producing a strictly larger contribution from the strike count than the lexicographic variant whenever keys disagree."

  # ---------------------------------------------------------------------------
  - name: driver_compliance_expiry
    trigger: "every background-check clear/fail and every inspection attest/reject"
    algorithm: aggregation
    formula: |
      if driver.status in {PENDING, INACTIVE} or exists c in driver.BackgroundCheck where c.result != CLEARED:
          compliance_expires_at = null
      else:
          fingerprint_expiry = min(expires_on of CLEARED BackgroundCheck rows whose check_type is a FINGERPRINT_* type)
          earliest_expiry     = min(expires_on of ALL CLEARED BackgroundCheck rows)
          inspection_expiry   = max(expires_on of PASSED VehicleInspection rows, else null)
          compliance_expires_at = min(fingerprint_expiry, inspection_expiry)
      # NOTE the asymmetry by design: fingerprint clearances fold into the min, but the
      # inspection row is chosen with MAX — the most recent passing inspection governs,
      # so re-inspecting a vehicle extends coverage instead of being pinned to the oldest
      # pass. background_check_coverage_only reports the all-check-types min instead.
    input_set: "CLEARED BackgroundCheck rows and PASSED VehicleInspection rows for this driver; PENDING and FAILED rows are excluded from the min but their presence nulls the field via the guard clause."
    constants:
      CLEARANCE_GRACE_DAYS: 0
    precision: "date, inclusive comparison against ends_on and exclusive comparison against the logical clock instant"
    variants:
      - name: background_check_coverage_only
        when: "the compliance summary endpoint is read without vehicle data"
        difference: "Returns min(expires_on of ALL CLEARED BackgroundCheck rows) and ignores VehicleInspection entirely, so it never reflects a lapsed inspection. A driver whose fingerprint expires 2027-03-01 but whose only passing inspection expired 2026-10-01 reports 2027-03-01 under this variant and 2026-10-01 under the base rule."

  # ---------------------------------------------------------------------------
  - name: handoff_verification_authorization
    trigger: "every POST /student-rides/trips/{id}/handoffs"
    algorithm: threshold
    formula: |
      # mode (a): tiered selection with a nested min/max and conditional branches.
      if handoff.leg == PICKUP:
          # at pickup the student is released TO the driver, so the releasing party is
          # checked against the rider's home placement rather than the driver roster.
          if handoff.expected_party == AUTHORIZED_ADULT:
              authorized = handoff.verified_party_name in {a.name for a in rider.authorized_adults}
              verdict = PASSED if authorized else FAILED
          elif handoff.expected_party == PLACEMENT_WORKER:
              verdict = PASSED if handoff.verification_method == PHYSICAL_SIGNATURE else FAILED
          else:
              verdict = FAILED                      # SCHOOL_STAFF is never valid at pickup
      else:  # DROPOFF
          if handoff.verified_party_name == rider.school_name:
              verdict = PASSED                      # school of record always accepts
          elif handoff.verified_party_name in {a.name for a in rider.authorized_adults}:
              if handoff.verification_method == PIN and handoff.verification_code is not exactly 6 alphanumeric characters:
                  verdict = FAILED
              else:
                  verdict = PASSED
          else:
              verdict = FAILED
      # Exact name matching after Unicode NFC normalisation and trim. Case is compared
      # case-insensitively but a near-match ("Ana Ruiz" vs "Anna Ruiz") is a FAILED
      # handoff, not a review item. The 6-character PIN length is a PIN-only rule and
      # is not applied to PHOTO_ID or PHYSICAL_SIGNATURE.
    input_set: "One handoff record against one Trip. rider.authorized_adults is an array of objects and is matched on the name member only."
    constants:
      PIN_LENGTH: 6
      MAX_HANDOFF_ATTEMPTS: 2
    precision: "exact string comparison after NFC + trim + casefold; no numeric rounding"

  # ---------------------------------------------------------------------------
  - name: geofence_containment
    trigger: "every POST /student-rides/trips/{id}/geofence-checks"
    algorithm: threshold
    formula: |
      CENTRE_DISTANCE_MILES = haversine(observed_lat, observed_lon, geofence.center_lat, geofence.center_lon)
      if CENTRE_DISTANCE_MILES <= geofence.radius_miles:
          inside = true
      else:
          inside = false
      # the comparison is inclusive at the boundary: a point exactly radius_miles
      # from the centre is INSIDE. The companion proximity probe uses a strict
      # comparison against radius_miles * PROXIMITY_FACTOR, so a point at exactly
      # the proximity radius is outside PROXIMITY yet inside GEOFENCE — the two
      # rules disagree on that single distance and neither is derived from the other.
    input_set: "One observed point against one Geofence. Radius is measured on a great-circle distance, not a planar approximation."
    constants:
      PROXIMITY_FACTOR: 1.1
    precision: "distance to 3 decimal places of a mile; boundary compared at that precision"
    variants:
      - name: proximity_check
        when: "the pre-arrival proximity probe is read instead of the fence containment test"
        difference: "Compares against geofence.radius_miles * PROXIMITY_FACTOR with a STRICT less-than, so a weaker trigger: a point at 1.05x the radius is PROXIMITY-inside but GEOFENCE-outside, and a point at exactly 1.1x the radius is PROXIMITY-outside while remaining GEOFENCE-inside."

  # ---------------------------------------------------------------------------
  - name: trip_alert_severity
    trigger: "every TripAlert creation, including alert creation triggered by a SafetyIncident"
    algorithm: threshold
    formula: |
      # mode (a): tiered selection over four inputs with cumulative-predicate interaction.
      breach_count = count(GeofenceCheck where trip_id == alert.trip_id and inside == false)
      base = LOW
      if alert.alert_type in {HANDOFF_DISPUTE, STUDENT_ABSENT}:
          base = HIGH
      elif alert.alert_type == GEOFENCE_BREACH:
          base = LOW
      elif alert.alert_type == TRIP_DELAY:
          base = LOW
      # escalate on the trip's accumulated breach history, then on driver strikes
      if breach_count >= 2:
          base = MEDIUM
      if driver.incident_strike_count >= 3:
          base = HIGH
      elif driver.incident_strike_count >= 1 and base == LOW:
          base = MEDIUM
      alert.severity = base
      alert.notify_caregiver     = alert.severity in {MEDIUM, HIGH}
      alert.notify_school        = alert.alert_type in {HANDOFF_DISPUTE, STUDENT_ABSENT} or alert.severity == HIGH
      # coordination rule: HIGH severity is the ceiling, and a trip that already
      # carries an unresolved HIGH alert never raises a SECOND HIGH alert — the new
      # alert is recorded at MEDIUM and joins the existing incident rather than
      # opening a parallel one.
      if exists other in TripAlert where other.trip_id == alert.trip_id
                                            and other.id != alert.id
                                            and other.severity == HIGH
                                            and other.status == OPEN
                                            and alert.severity == HIGH:
          alert.severity = MEDIUM
      alert.notify_support_center = (
          alert.severity == HIGH
          and (district.support_center_alert_enabled or driver.incident_strike_count >= 3)
      ) or (alert.notify_school and alert.alert_type == HANDOFF_DISPUTE)
      # the third clause is the integration clause: a HANDOFF_DISPUTE that notifies the
      # school notifies the support center even when district.support_center_alert_enabled
      # is false. Discounting it collapses the support-center routing on opt-out districts.
    input_set: "Alert type, the trip's accumulated outside-fence GeofenceCheck count, and the assigned driver's strike count at creation time. A trip with no assigned driver is scored with incident_strike_count = 0 and a trip with no geofences scores breach_count = 0."
    constants:
      STRIKE_MEDIUM_MIN: 1
      STRIKE_HIGH_MIN: 3
      BREACH_MEDIUM_MIN: 2
    precision: "integer thresholds; no rounding"

  # ---------------------------------------------------------------------------
  - name: safety_incident_impact_score
    trigger: "every SafetyIncident state change, and every read of a Trip's or Driver's incident summary"
    algorithm: weighted_scoring
    formula: |
      # mode (a): four weighted inputs, clamped.
      category_weight = {
          NO_SHOW_UNVERIFIED: 1.0,
          DRIVER_MISCONDUCT: 2.0,
          VEHICLE_UNSAFE: 2.0,
          HANDOFF_DISPUTE: 1.5,
          STUDENT_DISTRESS: 1.0
      }
      severity_weight = { LOW: 1.0, MEDIUM: 2.0, HIGH: 3.0 }
      raw = 25
            * category_weight[incident.category]
            * severity_weight[incident.severity]
            * (1 + 0.5 * driver.incident_strike_count)
            * (1 if incident.status == RESOLVED else 1.2)
      score = max(0, min(100, round_half_up(raw)))
      # the clamp is applied AFTER rounding, so the ceiling is exactly 100 and never 101.
    input_set: "All incidents regardless of status; the RESOLVED multiplier is applied on resolve and re-applied on reopen, so the score is not stable across a reopen."
    constants:
      BASE_SCORE: 25
      STRIKE_MULTIPLIER: 0.5
      OPEN_MULTIPLIER: 1.2
    precision: "1 rounding point (round_half_up), then clamped to [0, 100]"
    variants:
      - name: resolved_only
        when: "the incident summary endpoint is read"
        difference: "Omits the OPEN_MULTIPLIER entirely, scoring every incident as though it were already resolved. An open DRIVER_MISCONDUCT / HIGH incident with 1 strike scores 100 under the base rule (clamped from 108) and 90 under resolved_only."

  # ---------------------------------------------------------------------------
  - name: wait_time_block_units
    trigger: "every read of a Trip in trip_state AWAITING_STUDENT, and every POST /student-rides/trips/{id}/exceptions"
    algorithm: decay_function
    formula: |
      # mode (a): step decay with an explicit reset event and a floor.
      elapsed_minutes = floor((logical_clock_instant - trip.arrived_at) / 60 seconds)
      if elapsed_minutes < 0:
          blocks = 0
      elif elapsed_minutes <= WAIT_BLOCK_MINUTES:
          blocks = 1                                  # the inclusive boundary: exactly 12 minutes is still block 1
      else:
          blocks = 1 + floor((elapsed_minutes - WAIT_BLOCK_MINUTES) / WAIT_BLOCK_MINUTES)
      blocks = min(blocks, WAIT_BLOCK_MAX)
      # reset event: a PASSED pickup handoff clears arrived_at's relevance — once
      # trip_state leaves AWAITING_STUDENT the counter is not advanced further, and
      # returning to AWAITING_STUDENT via a restore resets it to 0.
    input_set: "Trips in trip_state AWAITING_STUDENT only. Trips in any other state always report 0."
    constants:
      WAIT_BLOCK_MINUTES: 12
      WAIT_BLOCK_MAX: 5
      WAIT_TIME_MIN_BLOCKS: 2
    precision: "integer blocks; elapsed_minutes truncated, never rounded"

  # ---------------------------------------------------------------------------
  - name: student_absence_grade
    trigger: "every POST /student-rides/trips/{id}/exceptions"
    algorithm: threshold
    formula: |
      # mode (a): tiered selection over a PROGRAM_WEIGHT table with a nested min and
      # a non-linear penalty term.
      PROGRAM_WEIGHT = {
          FOSTER_CARE: 3.0,
          HOMELESS_MCKINNEY_VENTO: 3.0,
          SPECIAL_EDUCATION: 2.0,
          GENERAL: 1.0
      }
      blocked = max(1, wait_time_block_units)
      points = PROGRAM_WEIGHT[rider.program_type] * blocked * (1 + 0.5 * rider.spi_level)
      penalty_multiplier = (
          LATE_DISPATCH_DISCOUNT if trip.driver_id is null
          else NORMAL_MULTIPLIER if logical_clock_instant <= trip.window_end_at
          else PENALTY_MULTIPLIER
      )
      points = points * penalty_multiplier
      grade = HIGH if points >= GRADE_HIGH_MIN
              else MEDIUM if points >= GRADE_MEDIUM_MIN
              else LOW
      # the zero-exception path is explicitly graded LOW and MUST NOT be escalated:
      # a trip with no exception never reaches this calculation, and a computed points
      # value of exactly 0 still grades LOW because the guard is 'points >= 3.0'.
    input_set: "Exactly one Trip per invocation. rider.program_type and rider.spi_level are read at the instant of the exception call."
    constants:
      LATE_DISPATCH_DISCOUNT: 0.5
      NORMAL_MULTIPLIER: 1.0
      PENALTY_MULTIPLIER: 1.5
      GRADE_HIGH_MIN: 8.0
      GRADE_MEDIUM_MIN: 4.0
    precision: "1 rounding point before grading (round_half_up to 1 decimal place)"
    variants:
      - name: program_weight_flat
        when: "the incident summary endpoint is read for a district-wide rollup"
        difference: "Uses PROGRAM_WEIGHT = 1.0 for every program_type, collapsing the nested max/weight interaction to points = blocked * (1 + 0.5 * rider.spi_level) * penalty_multiplier. A FOSTER_CARE rider at spi_level 1 with a 2-block wait and an on-time dispatch grades HIGH (points 9.0) under the base rule and MEDIUM (points 3.0) under program_weight_flat."

  # ---------------------------------------------------------------------------
  - name: driver_segment_overlap_check_for_series
    trigger: "POST /student-rides/ride-requests/{id}/schedule and POST /student-rides/ride-requests/{id}/resume-series; also recomputed after any Trip in the series changes state"
    algorithm: interval_merge
    formula: |
      # half-open intervals: a candidate Trip occupies [window_start_at, window_end_at)
      onwards = [t for t in Trips where t.driver_id is not null
                                and t.trip_state not in {COMPLETED, CANCELLED}]
      # adjacency rule for THIS rule: an interval starting EXACTLY at another's
      # window_end_at is NOT an overlap (gap of zero minutes is allowed).
      for each included date D in the series:
          for each candidate driver drv:
              for each t in onwards where t.driver_id == drv and t.scheduled_date == D:
                  if intervals_overlap_half_open(t.window_start_at, t.window_end_at, D.window_start, D.window_end):
                      mark (drv, D) as excluded
                      break
      # read-only: this calculation marks exclusions; the WRITE path is
      # POST /student-rides/districts/{id}/driver-availability-blocks, and dispatch
      # rejects a block that fails the same test. Do not conflate the two.
      #
      # The SAME two-window pair is evaluated twice with OPPOSITE adjacency rules:
      #   against the DRIVER resource the intervals are half-open and a candidate
      #     window starting exactly at another's end is accepted;
      #   against the RIDER resource the intervals are CLOSED and that same pair is
      #     rejected with ERR_RIDER_WINDOW_OVERLAP, because a student cannot leave
      #     one vehicle at the instant they are due in another.
      # Conflating the two geometries turns an allowed hand-off into a rejection,
      # or a genuine student double-booking into a silent pass.
    input_set: "Trips with an assigned driver in states DRIVER_EN_ROUTE, AWAITING_STUDENT, STUDENT_ONBOARD, IN_TRANSIT; SCHEDULED trips are included because they already occupy the slot."
    constants:
      SERIES_OVERLAP_BUFFER_MINUTES: 0
      AVAILABILITY_BUFFER_MINUTES: 20
    precision: "minute granularity; boundary at second precision"

  # ---------------------------------------------------------------------------
  - name: supply_planning_definition
    trigger: "every required-coverage decision: POST /student-rides/districts/{id}/billing-runs, POST /student-rides/ride-requests/{id}/schedule, POST /student-rides/trips/{id}/dispatch-candidate and GET /student-rides/districts/{id}/supply-plans"
    algorithm: constraint_propagation
    formula: |
      # the ONE published definition of which driver covers which date. Every call
      # site reads this rule; none re-derives it locally.
      covered(d, date) = (
            driver.status == ACTIVE
        and driver.caregiver_experience_months >= CAREGIVER_EXPERIENCE_MIN_MONTHS
        and driver.compliance_expires_at > date_start_instant(date)
        and exists i in driver.VehicleInspection where i.result == PASSED and i.expires_on > date
      )
      coverable_seats(d, date) = (
            driver.seat_capacity if covered(d, date) is false
            else max(driver.approved_seat_count, 1)
      )
      # NOTE the second branch: once a driver is covered for the date the roster
      # claims at least one coverable seat even when approved_seat_count has been
      # driven to 0 by the trip-load veto inside calculations.driver_approved_seat_count.
      # Replacing max(..., 1) with driver.approved_seat_count silently drops a
      # covered driver out of the supply roster on every busy day.
    input_set: "Every driver of the district, evaluated once per date in the horizon."
    constants:
      CAREGIVER_EXPERIENCE_MIN_MONTHS: 12
    precision: "integer seat counts; date comparisons day-granular"

  # ---------------------------------------------------------------------------
  - name: driver_supply_plan
    trigger: "read at POST /student-rides/districts/{id}/supply-plans, and recomputed on every Driver or Trip mutation affecting the district"
    algorithm: aggregation
    formula: |
      # Pinned positive-definition predicates. Do not use the bare words 'available'
      # or 'active' anywhere in the implementation of this rule.
      #   covered_on_date = exists a driver d with:
      #        d.status == ACTIVE
      #        d.approved_seat_count >= 1
      #        d.caregiver_experience_months >= CAREGIVER_EXPERIENCE_MIN_MONTHS
      #        d.compliance_expires_at > date_start_instant
      #        exists i in d.VehicleInspection where i.result == PASSED and i.expires_on > date
      # the roster above is the same predicate calculations.supply_planning_definition
      # publishes, and it is deliberately NOT re-derived from d.approved_seat_count:
      # a driver whose seats are all committed still covers the date.
      #   shift_capacity_on_date = sum over covered_on_date drivers of calculations.supply_planning_definition.coverable_seats(d, date)
      #   seats_committed_on_date = count of Trips with scheduled_date == date
      #                             and trip_state not in {COMPLETED, CANCELLED}
      #   seat_deficit = max(0, seats_committed_on_date - shift_capacity_on_date)
      #   alerts_sent    = sum over covered_on_date drivers of (1 if driver.incident_strike_count >= 1 else 0)
      #   supply_ratio = seats_committed_on_date / shift_capacity_on_date, or null when
      #                  shift_capacity_on_date == 0
      # two candidate definitions of a short date, issued side by side and NOT
      # reconciled with each other — they diverge whenever the ratio is low but every
      # committed seat still fits inside capacity (e.g. 3 committed of 5 capacity):
      #   understaffed_dates  = [date where supply_ratio is not null and supply_ratio < SUPPLY_STAFFED_RATIO]
      #   seat_deficit_dates  = [date where seat_deficit > 0]
    input_set: "All dates in the plan horizon (inclusive). Trips in COMPLETED and CANCELLED do not consume seats."
    constants:
      SUPPLY_STAFFED_RATIO: 0.8
    precision: "supply_ratio to 4 decimal places, round_half_up; seat counts integer"
    variants:
      - name: seated_demand_only
        when: "the plan is requested with demand limited to already-assigned trips"
        difference: "Counts seats_committed_on_date over Trips where driver_id is not null only, so unassigned SCHEDULED trips vanish from demand and seat_deficit can read 0 on a date that the base rule reports as short by the count of unassigned trips."

  # ---------------------------------------------------------------------------
  - name: rider_active_request_count
    trigger: "every RideRequest state change, and every Trip creation or cancellation for this rider"
    algorithm: aggregation
    formula: |
      active_ride_request_count = count(RideRequest where rider_id == rider.id
                                         and status in {SUBMITTED, APPROVED})
      # SCHEDULED requests are NOT counted: a request that has produced trips is
      # tracked by its trips instead. Counting SCHEDULED as well would double-count
      # a series that already has a live trip on the same date.
    input_set: "RideRequests only. Trip rows never contribute."
    constants: {}
    precision: "integer, no rounding"

  # ---------------------------------------------------------------------------
  - name: driver_incident_strike_count
    trigger: "every SafetyIncident resolution with adjudication DRIVER_AT_FAULT, every reopen of such a resolution, and every student_absence_grade that returns HIGH"
    algorithm: aggregation
    formula: |
      driver.incident_strike_count = count(SafetyIncident where driver_id == driver.id
                                           and adjudication == DRIVER_AT_FAULT)
                                     + count(Trip where driver_id == driver.id
                                             and exception_code in {RIDER_NOT_PRESENT, RIDER_REFUSED_BOARDING}
                                             and safety_state == LOCKED)
      # the second term is the HIGH-absence term and is NOT a SafetyIncident row: the
      # NO_SHOW_UNVERIFIED incident created by POST /student-rides/trips/{id}/exceptions carries
      # adjudication null until a support agent resolves it, and only the LOCKED
      # (HIGH) absences add a strike on the spot.
    input_set: "All SafetyIncident rows for the driver regardless of status, plus LOCKED non-completion Trips."
    constants:
      DRIVER_SUSPENSION_STRIKE_THRESHOLD: 3
    precision: "integer, no rounding"

  # ---------------------------------------------------------------------------
  - name: district_trips_scheduled_total
    trigger: "every Trip creation, cancellation and restoration for this district"
    algorithm: aggregation
    formula: |
      district.trips_scheduled_total = count(Trip where district_id == district.id
                                            and trip_state != CANCELLED)
      # the field tracks the district's LIVE scheduled load: cancellation decrements
      # it and restore increments it, so it equals the non-CANCELLED Trip row count
      # and NOT the total row count. A suspend-then-resume series therefore reads the
      # same value as an untouched series while holding twice as many Trip rows.
    input_set: "All Trip rows for the district, every trip_state."
    constants: {}
    precision: "integer, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /student-rides/districts"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed roles additionally require X-User-ID to equal the id of a persisted instance of the backing entity, and driver-scoped actions require X-User-ID to equal trip.driver_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints except POST /student-rides/districts"

  - priority: 3
    category: existence
    check: "Referenced resource ids exist, resolved left-to-right along the path: district, then child collection, then the addressed child"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_safety
    check: "Trip posture gate — trip.safety_state must be NORMAL for any trip_state transition"
    error_id: ERR_TRIP_DISCREPANCY_LOCK
    http_status: 409
    applies_to: "POST /student-rides/trips/{id}/accept, /arrive, /depart, /handoffs, /exceptions, /cancel, /restore"

  - priority: 5
    category: business_safety
    check: "The candidate driver pinned by dispatch-candidate must still satisfy the full eligibility filter at accept time (status ACTIVE, caregiver_experience_months >= 12, compliance_expires_at after the trip window start, approved_seat_count >= 1, specialty match)"
    error_id: ERR_DRIVER_INELIGIBLE
    http_status: 409
    applies_to: "POST /student-rides/trips/{id}/accept, POST /student-rides/ride-requests/{id}/schedule"

  - priority: 6
    category: business_safety
    check: "A SafetyIncident created by a FAILED tracking event must be adjudicated and resolved before the trip can leave a locked posture; no Trip may be released while any of its TripAlert rows is OPEN"
    error_id: ERR_OPEN_ALERTS
    http_status: 409
    applies_to: "POST /student-rides/trips/{id}/release-lock"

  - priority: 7
    category: business_temporal
    check: "Pickup windows submitted on a RideRequest must be strictly ordered and no wider than max_window_minutes; a non-recurring request must sit at least min_lead_time_hours past the logical clock"
    error_id: ERR_WINDOW_TOO_WIDE
    http_status: 422
    applies_to: "POST /student-rides/ride-requests/{id}/submit, POST /student-rides/ride-requests/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Interval collisions, each against its own resource geometry: (a) a driver availability block must not overlap a Trip window already assigned to that driver — half-open intervals, so a zero-minute gap is allowed; (b) a trip window for the same rider must not touch or overlap an existing non-terminal trip window for that rider — closed intervals, so a zero-minute gap is a collision"
    error_id: ERR_DRIVER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /student-rides/districts/{id}/driver-availability-blocks, POST /student-rides/ride-requests/{id}/schedule"

  - priority: 9
    category: state
    check: "Target resource must be in the required source state for the requested operation; when the resource has already reached a TERMINAL_STATES member for the dimension in question the same check reports ERR_ALREADY_TERMINAL instead, so a terminal-lockdown probe can be told apart from an ordinary wrong-state probe"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 10
    category: business_referential
    check: "Referenced sibling resources must exist and be usable: the rider must be ACTIVE, the covering Contract must be ACTIVE for the billed period, the parent RideRequest must be SCHEDULED before a Trip may be restored"
    error_id: ERR_RIDER_INACTIVE
    http_status: 409
    applies_to: "POST /student-rides/ride-requests/{id}/approve, POST /student-rides/districts/{id}/billing-runs, POST /student-rides/trips/{id}/restore"

  - priority: 11
    category: business_constraint
    check: "Uniqueness and cardinality constraints: exactly one ACTIVE Contract per district; no duplicate scheduled trip for the same ride request and date; no second PICKUP handoff on a trip; no second FAILED DROPOFF handoff on a trip"
    error_id: ERR_DUPLICATE_HANDOFF
    http_status: 409
    applies_to: "POST /student-rides/contracts/{id}/activate, POST /student-rides/ride-requests/{id}/schedule, POST /student-rides/trips/{id}/handoffs"

  - priority: 12
    category: business_fiscal
    check: "A BillingStatement may only cover Trip rows whose billing_period_key matches the statement's period_key exactly"
    error_id: ERR_PERIOD_MISMATCH
    http_status: 409
    applies_to: "POST /student-rides/billing-statements/{id}/issue"

# =============================================================================
# §1.5 API Endpoint Table
#
# URL convention. api_prefix "/student-rides" is the single scope root; every
# entity collection is addressed at the two-segment level
# "/student-rides/<collection>/{id}", and every reverse-reachability read is a
# three-segment sub-resource under the parent
# ("/student-rides/<parent-collection>/{id}/<child-segment>"). Driver is a
# platform-global roster, so no per-district driver sub-tree exists and the
# driver-side reverse reads hang off the flat "/student-rides/drivers/{id}"
# side. Only the test-driving endpoints under "/_<name>" sit outside the scope
# root. The billing statement's rate-provenance field is resolvable by the
# filtered-list form on GET /student-rides/billing-statements with
# "contract_id?".
# =============================================================================
endpoints:

  # --- District ---
  - method: POST
    path: "/student-rides/districts"
    description: "Create a District (self-registration; the only unauthenticated endpoint)"
    roles: [Anonymous]
    code: 201
    input: [name, billing_email, contract_rate_per_ride_cents, contract_rate_per_mile_cents, "minimum_billable_cents?", "no_school_dates?", "bell_schedule_start?", "support_center_alert_enabled?"]
    output: District
    side_effects:
      - "outstanding_balance_cents=0, credit_balance_cents=0, account_status=ACTIVE, trips_scheduled_total=0"
      - "increments District.version by 1"

  - method: GET
    path: "/student-rides/districts/{id}"
    description: "Get a District"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/riders"
    description: "List a District's Riders (reverse reachability for Rider.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Rider[]"
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/ride-requests"
    description: "List a District's RideRequests (reverse reachability for RideRequest.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "RideRequest[]"
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/contracts"
    description: "List a District's Contracts (reverse reachability for Contract.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Contract[]"
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/trips"
    description: "List a District's Trips (reverse reachability for Trip.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/billing-statements"
    description: "List a District's BillingStatements (reverse reachability for BillingStatement.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "BillingStatement[]"
    side_effects: []

  - method: POST
    path: "/student-rides/districts/{id}/billing-runs"
    description: "Compute a BillingStatement for a period from the district's completed trips"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [expected_district_version, period_key, period_start, period_end]
    output: BillingStatement
    side_effects:
      - "BillingStatement created with status OPEN; total_amount_cents = calculations.statement_total_cents; total_ride_units and total_miles are plain sums over the included trips"
      - "district.credit_balance_cents -= applied_credit_cents (the applied credit is reserved, not spent)"
      - "every ACTIVE Contract for this district whose through_date is before the logical clock date → status EXPIRED, and district.account_status = SUSPENDED"
      - "increments District.version by 1"

  - method: GET
    path: "/student-rides/districts/{id}/supply-plans"
    description: "Read the driver supply plan against bell schedules and committed seats"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: ["horizon_start?", "horizon_end?"]
    output: { per_date: "object", shift_capacity_on_date: "object", seats_committed_on_date: "object", seat_deficit: "object", supply_ratio: "object", understaffed_dates: "string[]", seat_deficit_dates: "string[]" }
    side_effects:
      - "read-only; drives calculations.driver_supply_plan"

  - method: POST
    path: "/student-rides/districts/{id}/driver-availability-blocks"
    description: "Block a driver's availability on a district route segment"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [driver_id, block_start_at, block_end_at, reason]
    output: "RideRequest[]"
    side_effects:
      - "Rejects when the half-open block interval overlaps any Trip window already assigned to that driver (ERR_DRIVER_WINDOW_OVERLAP); adjacency with a zero-minute gap is accepted"
      - "returns the RideRequests affected by the block"

  - method: POST
    path: "/student-rides/districts/{id}/driver-supply-runs"
    description: "Re-derive the district's covered-driver roster and committed-seat counts for the horizon"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [horizon_start, horizon_end]
    output: "Trip[]"
    side_effects:
      - "returns the district's Trips inside the horizon; the recomputed plan is read back through GET /student-rides/districts/{id}/supply-plans"

  - method: POST
    path: "/student-rides/districts/{id}/credit-adjustments"
    description: "Apply a service-credit adjustment to a district's credit pool"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [amount_cents, reason]
    output: District
    side_effects:
      - "district.credit_balance_cents += amount_cents; increments District.version by 1"

  # --- Rider ---
  - method: POST
    path: "/student-rides/riders"
    description: "Register a Rider"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [district_id, full_name, date_of_birth, program_type, "spi_level?", home_address, school_name, emergency_contact_phone, "authorized_adults?", "notify_on_pickup?", "notify_on_dropoff?"]
    output: Rider
    side_effects:
      - "status=ACTIVE, active_ride_request_count=0, support_center_phone_masked derived from emergency_contact_phone"
      - "increments Rider.version by 1"

  - method: GET
    path: "/student-rides/riders/{id}"
    description: "Get a Rider. For X-User-Role Driver the response masks emergency_contact_phone down to rider.support_center_phone_masked"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: GET
    path: "/student-rides/riders/{id}/ride-requests"
    description: "List a Rider's RideRequests (reverse reachability for RideRequest.rider_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "RideRequest[]"
    side_effects: []

  - method: GET
    path: "/student-rides/riders/{id}/trips"
    description: "List a Rider's Trips (reverse reachability for Trip.rider_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: PUT
    path: "/student-rides/riders/{id}"
    description: "Update Rider placement details"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: ["home_address?", "school_name?", "emergency_contact_phone?", "authorized_adults?", "notify_on_pickup?", "notify_on_dropoff?", "spi_level?"]
    output: Rider
    side_effects:
      - "increments Rider.version by 1"

  # --- Driver ---
  - method: POST
    path: "/student-rides/drivers"
    description: "Onboard a Driver"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [full_name, phone, employer_org, caregiver_experience_months, language_codes, vehicle_class, seat_capacity, "child_seat_type?"]
    output: Driver
    side_effects:
      - "status=PENDING, approved_seat_count=0, compliance_expires_at=null, incident_strike_count=0"
      - "increments Driver.version by 1"

  - method: GET
    path: "/student-rides/drivers/{id}"
    description: "Get a Driver — the read-back for approved_seat_count and compliance_expires_at"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/student-rides/drivers/{id}/background-checks"
    description: "Open a background check for a driver and move the driver into BACKGROUND_CHECK"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [check_type, reference_code, expires_on]
    output: BackgroundCheck
    side_effects:
      - "driver.status = BACKGROUND_CHECK"
      - "BackgroundCheck created with result PENDING, cleared_after_months=null"
      - "increments Driver.version by 1"

  - method: GET
    path: "/student-rides/drivers/{id}/background-checks"
    description: "List a driver's BackgroundChecks (reverse reachability for BackgroundCheck.driver_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []

  - method: POST
    path: "/student-rides/drivers/{id}/inspections"
    description: "Record a vehicle inspection and move the driver into INSPECTION"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [vehicle_class, seat_count, "child_seat_type?", inspector_note, expires_on]
    output: VehicleInspection
    side_effects:
      - "driver.status = INSPECTION"
      - "VehicleInspection created with result PENDING, seat_credit=0"
      - "increments Driver.version by 1"

  - method: GET
    path: "/student-rides/drivers/{id}/inspections"
    description: "List a driver's VehicleInspections (reverse reachability for VehicleInspection.driver_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "VehicleInspection[]"
    side_effects: []

  - method: GET
    path: "/student-rides/drivers/{id}/trips"
    description: "List a driver's Trips (reverse reachability for Trip.driver_id and Trip.candidate_driver_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: GET
    path: "/student-rides/drivers/{id}/safety-incidents"
    description: "List a driver's SafetyIncidents (reverse reachability for SafetyIncident.driver_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "SafetyIncident[]"
    side_effects: []

  - method: POST
    path: "/student-rides/drivers/{id}/reactivate"
    description: "Reactivate a suspended driver"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Driver
    side_effects:
      - "driver.status = ACTIVE"
      - "increments Driver.version by 1"

  - method: POST
    path: "/student-rides/drivers/{id}/deactivate"
    description: "Deactivate a driver"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Driver
    side_effects:
      - "driver.status = INACTIVE, approved_seat_count = 0"
      - "increments Driver.version by 1"

  # --- BackgroundCheck ---
  - method: POST
    path: "/student-rides/background-checks/{id}/clear"
    description: "Mark a background check CLEARED"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects:
      - "check.result = CLEARED, cleared_after_months computed"
      - "driver.approved_seat_count and driver.compliance_expires_at recomputed; increments Driver.version by 1"

  - method: POST
    path: "/student-rides/background-checks/{id}/fail"
    description: "Mark a background check FAILED, including revocation of an already-CLEARED fingerprint clearance"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects:
      - "check.result = FAILED; every other PENDING check for the driver also becomes FAILED"
      - "driver.status = PENDING for a PENDING→FAILED check, SUSPENDED for a CLEARED→FAILED fingerprint revocation"
      - "every Trip for this driver with trip_state SCHEDULED is cancelled; increments Driver.version by 1"

  # --- VehicleInspection ---
  - method: POST
    path: "/student-rides/vehicle-inspections/{id}/attest"
    description: "Attest a pending inspection as PASSED and activate the driver"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: VehicleInspection
    side_effects:
      - "inspection.result = PASSED, seat_credit = seat_count"
      - "driver.approved_seat_count and driver.compliance_expires_at recomputed; driver.status = ACTIVE; increments Driver.version by 1"

  - method: POST
    path: "/student-rides/vehicle-inspections/{id}/reject"
    description: "Reject an inspection — the compensating action for attestation"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: VehicleInspection
    side_effects:
      - "inspection.result = FAILED, seat_credit = 0"
      - "driver.approved_seat_count returns to its pre-attest value at the whole-fleet level; increments Driver.version by 1"

  # --- Contract ---
  - method: POST
    path: "/student-rides/contracts"
    description: "Draft a Contract for a District"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [district_id, effective_from, through_date, per_ride_rate_cents, per_mile_rate_cents, "minimum_billable_cents?", billing_period]
    output: Contract
    side_effects:
      - "status=DRAFT; increments Contract.version by 1"

  - method: GET
    path: "/student-rides/contracts/{id}"
    description: "Get a Contract"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/student-rides/contracts/{id}/activate"
    description: "Activate a contract; any other draft contract for the district expires"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "contract.status = ACTIVE; every other DRAFT contract for the district becomes EXPIRED; district.account_status = ACTIVE"
      - "increments Contract.version by 1"

  - method: POST
    path: "/student-rides/contracts/{id}/suspend"
    description: "Suspend a contract and freeze the district's billing"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "contract.status = SUSPENDED; district.account_status = SUSPENDED"
      - "every OPEN BillingStatement for the district becomes VOIDED; increments Contract.version by 1"

  - method: POST
    path: "/student-rides/contracts/{id}/reactivate"
    description: "Reactivate a suspended contract"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "contract.status = ACTIVE; district.account_status = ACTIVE; increments Contract.version by 1"

  # --- RideRequest ---
  - method: POST
    path: "/student-rides/ride-requests"
    description: "Open a ride request for a student"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [expected_district_version, district_id, rider_id, trip_type, "required_specialty?", window_start_at, window_end_at, "max_window_minutes?", "min_lead_time_hours?", pickup_address, dropoff_address, "planned_miles?", "is_recurring?", "days_of_week?", "series_effective_from?", "series_through_date?", "series_no_school_dates?"]
    output: RideRequest
    side_effects:
      - "status=DRAFT, revision_count=0, recurring_series_active=false"
      - "increments District.version by 1"

  - method: GET
    path: "/student-rides/ride-requests/{id}"
    description: "Get a RideRequest"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: []
    output: RideRequest
    side_effects: []

  - method: GET
    path: "/student-rides/ride-requests/{id}/trips"
    description: "List a RideRequest's Trips (reverse reachability for Trip.ride_request_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Trip[]"
    side_effects: []

  - method: POST
    path: "/student-rides/ride-requests/{id}/submit"
    description: "Submit a draft ride request for review"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = SUBMITTED; rider.active_ride_request_count recomputed; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/request-revision"
    description: "Return a submitted request for revision"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [revision_note]
    output: RideRequest
    side_effects:
      - "status = REVISION_REQUESTED; revision_count += 1; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/resubmit"
    description: "Resubmit a request returned for revision"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = SUBMITTED; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/approve"
    description: "Approve a submitted ride request, enforcing term and lead-time gates"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = APPROVED; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/reject"
    description: "Reject a submitted or approved ride request"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [reason]
    output: RideRequest
    side_effects:
      - "status = REJECTED; recurring_series_active = false; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/schedule"
    description: "Schedule a request, generating trips for a recurring series"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: ["scheduled_date?"]
    output: "Trip[]"
    side_effects:
      - "status = SCHEDULED; recurring_series_active = is_recurring"
      - "one Trip created per included date; district.trips_scheduled_total += created count"
      - "increments RideRequest.version by 1 and District.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/suspend-series"
    description: "Suspend a recurring series and cancel its unstarted trips"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = SERIES_SUSPENDED; recurring_series_active = false"
      - "every SCHEDULED Trip for this request is cancelled; district.trips_scheduled_total decremented once per trip; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/resume-series"
    description: "Resume a suspended recurring series"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = SCHEDULED; recurring_series_active = true"
      - "one Trip created per included date; district.trips_scheduled_total += created count; increments RideRequest.version by 1"

  - method: POST
    path: "/student-rides/ride-requests/{id}/cancel"
    description: "Cancel a draft or suspended-series request"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RideRequest
    side_effects:
      - "status = CANCELLED; recurring_series_active = false; rider.active_ride_request_count recomputed; increments RideRequest.version by 1"

  # --- Trip ---
  - method: POST
    path: "/student-rides/trips"
    description: "Create a single-date trip directly against a scheduled ride request"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [expected_district_version, ride_request_id, scheduled_date, window_start_at, window_end_at, "planned_miles?"]
    output: Trip
    side_effects:
      - "trip_state=SCHEDULED, safety_state=NORMAL, billable_ride_units=0, billable_miles=0"
      - "billing_period_key derived from scheduled_date under the district's ACTIVE contract"
      - "district.trips_scheduled_total += 1 and District.version += 1"

  - method: GET
    path: "/student-rides/trips/{id}"
    description: "Get a Trip — the read-back for billable_ride_units, exception_code and safety_state"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: []
    output: Trip
    side_effects: []

  - method: GET
    path: "/student-rides/trips/{id}/alerts"
    description: "List a Trip's TripAlerts (reverse reachability for TripAlert.trip_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "TripAlert[]"
    side_effects: []

  - method: GET
    path: "/student-rides/trips/{id}/handoffs"
    description: "List a Trip's HandoffVerifications (reverse reachability for HandoffVerification.trip_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "HandoffVerification[]"
    side_effects: []

  - method: GET
    path: "/student-rides/trips/{id}/safety-incidents"
    description: "List a Trip's SafetyIncidents (reverse reachability for SafetyIncident.trip_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "SafetyIncident[]"
    side_effects: []

  - method: POST
    path: "/student-rides/trips/{id}/dispatch-candidate"
    description: "Pin the eligible driver this trip is offered to (the selector read)"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "trip.candidate_driver_id = the driver chosen by calculations.recurring_dispatch_rank for this trip's date and rider"
      - "rejects with ERR_NO_ELIGIBLE_DRIVER when the candidate set is empty; increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/accept"
    description: "Driver accepts the pinned dispatch"
    roles: [Driver, DistrictAdmin]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "trip_state = DRIVER_EN_ROUTE; driver_id, claimed_by_user_id set to X-User-ID; accepted_at stamped"
      - "increments Trip.version by 1 and Driver.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/arrive"
    description: "Driver arrives at the pickup point"
    roles: [Driver]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "trip_state = AWAITING_STUDENT; increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/handoffs"
    description: "Record a pickup or dropoff handoff verification"
    roles: [Driver]
    code: 201
    input: [leg, expected_party, verified_party_name, verification_method, "verification_code?", "billable_miles?"]
    output: HandoffVerification
    side_effects:
      - "handoff.result from calculations.handoff_verification_authorization"
      - "PICKUP + PASSED moves trip_state to STUDENT_ONBOARD; DROPOFF + PASSED moves IN_TRANSIT to COMPLETED"
      - "DROPOFF + FAILED still completes the trip, sets exception_code UNAUTHORIZED_DROPOFF, raises a HANDOFF_DISPUTE incident, and reduces billable_ride_units to 1"
      - "increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/depart"
    description: "Driver departs with the student on board"
    roles: [Driver]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "trip_state = IN_TRANSIT; raises a GEOFENCE_BREACH alert when the logical clock instant is past window_end_at"
      - "increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/exceptions"
    description: "Report a student who is not present or refuses to board"
    roles: [Driver]
    code: 201
    input: [issue, note]
    output: Trip
    side_effects:
      - "trip_state = CANCELLED; exception_code = issue; exception_recorded_at stamped"
      - "safety_state from calculations.student_absence_grade (LOW keeps NORMAL, MEDIUM sets DISCREPANCY, HIGH sets LOCKED)"
      - "creates a NO_SHOW_UNVERIFIED SafetyIncident and a STUDENT_ABSENT TripAlert, and consumes a strike when the grade is HIGH"
      - "increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/cancel"
    description: "Cancel a scheduled trip"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Trip
    side_effects:
      - "trip_state = CANCELLED; district.trips_scheduled_total -= 1 and District.version += 1"
      - "increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/restore"
    description: "Restore a cancelled trip — the compensating action for cancellation"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "trip_state = SCHEDULED; driver_id, claimed_by_user_id, candidate_driver_id and accepted_at cleared"
      - "district.trips_scheduled_total += 1 and District.version += 1; increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/resolve-discrepancy"
    description: "Clear a trip's discrepancy posture after the incident is adjudicated"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "safety_state DISCREPANCY becomes NORMAL; LOCKED becomes DISCREPANCY; exception_code and exception_recorded_at cleared"
      - "billable_ride_units is not recomputed, so the penalised ride unit is not refunded"
      - "increments Trip.version by 1"

  - method: POST
    path: "/student-rides/trips/{id}/release-lock"
    description: "Release a locked trip once every alert is resolved"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Trip
    side_effects:
      - "safety_state = NORMAL; increments Trip.version by 1"

  # --- SafetyIncident ---
  - method: GET
    path: "/student-rides/safety-incidents/{id}"
    description: "Get a SafetyIncident — the read-back for adjudication and student_impact_score"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: []
    output: SafetyIncident
    side_effects: []

  - method: GET
    path: "/student-rides/safety-incidents/{id}/alerts"
    description: "List a SafetyIncident's linked TripAlerts (reverse reachability for TripAlert.source_incident_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "TripAlert[]"
    side_effects: []

  - method: POST
    path: "/student-rides/safety-incidents/{id}/review"
    description: "Move an incident under review and resolve its linked alerts"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: []
    output: SafetyIncident
    side_effects:
      - "status = UNDER_REVIEW; every linked TripAlert becomes RESOLVED; increments SafetyIncident.version by 1"

  - method: POST
    path: "/student-rides/safety-incidents/{id}/resolve"
    description: "Resolve an incident with an adjudication"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: [resolution_note, adjudication]
    output: SafetyIncident
    side_effects:
      - "status = RESOLVED; student_impact_score from calculations.safety_incident_impact_score"
      - "adjudication DRIVER_AT_FAULT increments driver.incident_strike_count, may suspend the driver, and may cancel that driver's SCHEDULED trips"
      - "increments SafetyIncident.version by 1"

  - method: POST
    path: "/student-rides/safety-incidents/{id}/reopen"
    description: "Reopen a resolved at-fault incident — the compensating action for resolution"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: SafetyIncident
    side_effects:
      - "status = UNDER_REVIEW; adjudication cleared; driver.incident_strike_count -= 1"
      - "driver.status returns to ACTIVE when the recomputed strike count falls below the suspension threshold"
      - "increments SafetyIncident.version by 1"

  - method: POST
    path: "/student-rides/safety-incidents/{id}/void"
    description: "Void a reported or under-review incident"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: [reason]
    output: SafetyIncident
    side_effects:
      - "status = VOIDED; linked TripAlerts become RESOLVED; increments SafetyIncident.version by 1"

  # --- TripAlert ---
  - method: POST
    path: "/student-rides/trip-alerts/{id}/resolve"
    description: "Resolve an open trip alert"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: []
    output: TripAlert
    side_effects:
      - "status = RESOLVED; increments TripAlert.version by 1"

  # --- Geofence ---
  - method: POST
    path: "/student-rides/geofences"
    description: "Register a district geofence"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 201
    input: [district_id, label, center_lat, center_lon, radius_miles]
    output: Geofence
    side_effects:
      - "increments Geofence.version by 1"

  - method: GET
    path: "/student-rides/geofences/{id}"
    description: "Get a Geofence"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: []
    output: Geofence
    side_effects: []

  - method: GET
    path: "/student-rides/geofences/{id}/checks"
    description: "List a Geofence's GeofenceChecks (reverse reachability for GeofenceCheck.geofence_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "GeofenceCheck[]"
    side_effects: []

  - method: GET
    path: "/student-rides/districts/{id}/geofences"
    description: "List a District's Geofences (reverse reachability for Geofence.district_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Geofence[]"
    side_effects: []

  - method: GET
    path: "/student-rides/trips/{id}/geofence-checks"
    description: "List a Trip's GeofenceChecks (reverse reachability for GeofenceCheck.trip_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "GeofenceCheck[]"
    side_effects: []

  - method: POST
    path: "/student-rides/trips/{id}/geofence-checks"
    description: "Check a trip's position trace against the district's geofences"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 201
    input: [observed_at, observed_lat, observed_lon]
    output: "GeofenceCheck[]"
    side_effects:
      - "one GeofenceCheck is created per Geofence belonging to the trip's district, each carrying whether the observed point fell inside that circle: a FULL containment test with no buffer, so a point exactly radius_miles from the centre counts as INSIDE"
      - "a GeofenceCheck whose inside is false on a trip whose trip_state is IN_TRANSIT creates a GEOFENCE_BREACH TripAlert, which then takes its severity from calculations.trip_alert_severity"
      - "increments GeofenceCheck.version by 1 per check created"

  # --- BillingStatement ---
  - method: GET
    path: "/student-rides/billing-statements"
    description: "List BillingStatements, optionally filtered by contract (reverse reachability for BillingStatement.contract_id)"
    roles: [DistrictAdmin, PlatformAdmin, SupportCenterAgent]
    code: 200
    input: ["contract_id?", "district_id?", "status?", "limit?", "offset?"]
    output: "BillingStatement[]"
    side_effects: []

  - method: POST
    path: "/student-rides/billing-statements/{id}/issue"
    description: "Issue a computed statement to the district"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects:
      - "status = ISSUED; issued_at stamped; district.outstanding_balance_cents += total_amount_cents"
      - "suspends district.account_status once the outstanding balance passes OVERDUE_THRESHOLD_CENTS"
      - "increments BillingStatement.version by 1 and District.version by 1"

  - method: POST
    path: "/student-rides/billing-statements/{id}/approve-payment"
    description: "Record payment of an issued statement"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [paid_amount_cents]
    output: BillingStatement
    side_effects:
      - "status = PAID; district.outstanding_balance_cents -= total_amount_cents"
      - "increments BillingStatement.version by 1 and District.version by 1"

  - method: POST
    path: "/student-rides/billing-statements/{id}/void"
    description: "Void an issued statement — the compensating action for issue"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects:
      - "status = VOIDED; district.outstanding_balance_cents -= total_amount_cents"
      - "district.credit_balance_cents += applied_credit_cents"
      - "increments BillingStatement.version by 1 and District.version by 1"

  # --- Monitoring clock and support-centre operations ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z: before any call the clock reads that fixed instant and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: []

  - method: POST
    path: "/_support-center/monitor-sweep"
    description: "Run a monitoring sweep that synthesises TRIP_DELAY and GEOFENCE_BREACH alerts for trips whose window has closed without the corresponding handoff"
    roles: [SupportCenterAgent, PlatformAdmin]
    code: 200
    input: [trip_id]
    output: Trip
    side_effects:
      - "creates TripAlert rows with source_incident_id null and severity from calculations.trip_alert_severity"
      - "a HIGH alert leaves the trip LOCKED, after which every trip_state transition is rejected with ERR_TRIP_DISCREPANCY_LOCK"
      - "increments Trip.version by 1"

  - method: POST
    path: "/_events/emit"
    description: "Emit a system event (school-closure notice, bell-schedule change) that fans out to the district's recurring series"
    roles: [DistrictAdmin, PlatformAdmin]
    code: 200
    input: [event_type, effective_date, district_id]
    output: District
    side_effects:
      - "event_type NO_SCHOOL_DAY appends effective_date to district.no_school_dates"
      - "every RideRequest in that district with status SCHEDULED and recurring_series_active true immediately cancels the Trips whose scheduled_date equals effective_date"
      - "district.trips_scheduled_total decremented once per cancelled trip; increments District.version by 1"
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, unknown field, missing required field, or an unrecognised enum member"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no known role"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not permitted for this operation, or X-User-ID does not identify the owning entity"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist or sits outside the addressed district"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in the source state this operation requires"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Operation attempted on a resource that has already reached a terminal state for the dimension in question"

  - id: ERR_TRIP_DISCREPANCY_LOCK
    http: 409
    condition: "Trip posture is DISCREPANCY or LOCKED; the requested trip_state transition is refused"

  - id: ERR_TRIP_ALREADY_CLAIMED
    http: 409
    condition: "Trip already carries a driver_id and cannot be claimed a second time"

  - id: ERR_DRIVER_NOT_SELECTED
    http: 403
    condition: "X-User-ID is not the driver pinned by POST /student-rides/trips/{id}/dispatch-candidate"

  - id: ERR_NOT_TRIP_DRIVER
    http: 403
    condition: "X-User-ID is not the driver assigned to this trip, for a driver-scoped action"

  - id: ERR_DRIVER_INELIGIBLE
    http: 409
    condition: "Pinned candidate driver no longer satisfies the full eligibility filter for this trip"

  - id: ERR_DRIVER_ON_TRIP
    http: 409
    condition: "Driver has a trip in AWAITING_STUDENT, STUDENT_ONBOARD or IN_TRANSIT and cannot be deactivated"

  - id: ERR_CAREGIVER_EXPERIENCE_SHORT
    http: 422
    condition: "driver.caregiver_experience_months is below CAREGIVER_EXPERIENCE_MIN_MONTHS"

  - id: ERR_CLEARANCE_INCOMPLETE
    http: 409
    condition: "Driver is moved toward INSPECTION or activation with no CLEARED background check on file"

  - id: ERR_CLEARANCE_EXPIRED
    http: 422
    condition: "Reference date on the check or inspection is not strictly after the logical clock date"

  - id: ERR_DUPLICATE_CLEARANCE
    http: 409
    condition: "The driver already holds a FINGERPRINT_FBI background check"

  - id: ERR_INSPECTION_SEAT_COUNT
    http: 422
    condition: "Inspection seat_count is below 1 and therefore cannot support any student"

  - id: ERR_DRIVER_WINDOW_OVERLAP
    http: 409
    condition: "Availability block or series trip window overlaps an interval already occupied by that driver, under half-open semantics with zero-minute gaps allowed"

  - id: ERR_RIDER_WINDOW_OVERLAP
    http: 409
    condition: "A trip window for the same rider touches or overlaps an existing non-terminal trip window: for a student the adjacency rule is CLOSED, so a window ending exactly when another begins still collides"

  - id: ERR_NO_ELIGIBLE_DRIVER
    http: 409
    condition: "The candidate set is empty under both the base and widened eligibility filters for a required date"

  - id: ERR_NO_SCHOOL_DAYS_IN_RANGE
    http: 409
    condition: "A recurring series produces zero included dates over its window"

  - id: ERR_NOT_RECURRING
    http: 409
    condition: "Series operation attempted on a ride request whose is_recurring is false"

  - id: ERR_TRIP_IN_PROGRESS
    http: 409
    condition: "Series suspension attempted while one of its trips is STUDENT_ONBOARD or IN_TRANSIT"

  - id: ERR_OUTSIDE_SCHOOL_TERM
    http: 409
    condition: "Recurring series effective_from precedes ACADEMIC_TERM_OPEN_DATE"

  - id: ERR_SERIES_ENDED
    http: 409
    condition: "Series resume attempted after the series through_date has passed"

  - id: ERR_WINDOW_TOO_WIDE
    http: 422
    condition: "Ride request window span exceeds max_window_minutes, or window_start_at is not strictly before window_end_at"

  - id: ERR_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "Non-recurring request is approved with less than min_lead_time_hours before its pickup window"

  - id: ERR_ALREADY_SCHEDULED
    http: 409
    condition: "A trip already exists for the same ride request and scheduled date"

  - id: ERR_REQUEST_NOT_SCHEDULED
    http: 409
    condition: "Trip restore attempted while the parent ride request is not in SCHEDULED"

  - id: ERR_TRIP_IN_PAST
    http: 409
    condition: "Trip restore attempted for a scheduled date before the logical clock date"

  - id: ERR_RIDER_INACTIVE
    http: 409
    condition: "Ride request approval attempted for a rider whose status is not ACTIVE"

  - id: ERR_HANDOFF_NOT_AUTHORIZED
    http: 403
    condition: "The named party is not the school of record and does not appear in rider.authorized_adults, or the PIN fails the six-character rule"

  - id: ERR_HANDOFF_ALREADY_ATTEMPTED
    http: 409
    condition: "A pickup handoff already exists on this trip, or a dropoff handoff has already been recorded as FAILED"

  - id: ERR_WAIT_TIME_NOT_MET
    http: 409
    condition: "Student-absent exception reported before the wait time reaches WAIT_TIME_MIN_BLOCKS"

  - id: ERR_INCIDENT_ALREADY_REPORTED
    http: 409
    condition: "A NO_SHOW_UNVERIFIED incident is already recorded for this trip"

  - id: ERR_OPEN_ALERTS
    http: 409
    condition: "Trip lock release refused while any of the trip's alerts remains OPEN"

  - id: ERR_ADJUDICATION_REQUIRED
    http: 422
    condition: "Incident resolution sent without an adjudication, or with an adjudication the source state forbids"

  - id: ERR_RESOLUTION_NOTE_REQUIRED
    http: 422
    condition: "Incident resolution attempted with an empty resolution_note"

  - id: ERR_SUSPENSION_REQUIRES_FAULT
    http: 409
    condition: "Suspension would be lifted by a NO_FAULT resolution that is not the incident responsible for it"

  - id: ERR_EMPTY_STATEMENT
    http: 409
    condition: "Statement issue attempted while total_amount_cents is zero"

  - id: ERR_PERIOD_MISMATCH
    http: 409
    condition: "Statement issue attempted with a period_key that does not match the billed trips' billing_period_key"

  - id: ERR_DISTRICT_OVER_LIMIT
    http: 402
    condition: "District account_status is SUSPENDED, or outstanding_balance_cents exceeds OVERDUE_THRESHOLD_CENTS, blocking further statement issuance"

  - id: ERR_CONTRACT_OVERLAP
    http: 409
    condition: "A second contract for the same district would become ACTIVE"

  - id: ERR_CONTRACT_DATE_ORDER
    http: 422
    condition: "Contract effective_from is not on or before through_date"

  - id: ERR_CONTRACT_TERM_ENDED
    http: 409
    condition: "Contract reactivation attempted after through_date has passed"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version — see §1.2.1"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Anonymous
    description: "Unauthenticated caller. Exists solely so that district self-registration is reachable without credentials; holds no other permission."
    identity: opaque
    exclusive_operations:
      - "POST /student-rides/districts — self-register a district"
    shared_operations: []

  - name: DistrictAdmin
    description: "Agent of a school district or placing agency. Owns intake, contracting, scheduling, billing and fleet roster management. The Role with by far the widest surface."
    identity: opaque
    exclusive_operations:
      - "POST /student-rides/districts/{id}/billing-runs — compute a statement"
      - "POST /student-rides/districts/{id}/driver-availability-blocks — block driver availability"
      - "POST /student-rides/districts/{id}/driver-supply-runs — re-derive the covered roster"
      - "POST /student-rides/contracts/{id}/activate — activate a contract"
      - "POST /student-rides/contracts/{id}/suspend — suspend a contract"
      - "POST /student-rides/contracts/{id}/reactivate — reactivate a contract"
      - "POST /student-rides/ride-requests/{id}/approve — approve intake"
      - "POST /student-rides/ride-requests/{id}/request-revision — return for revision"
      - "POST /student-rides/ride-requests/{id}/resubmit — resubmit after revision"
      - "POST /student-rides/ride-requests/{id}/schedule — schedule and generate trips"
      - "POST /student-rides/ride-requests/{id}/suspend-series — suspend a recurring series"
      - "POST /student-rides/ride-requests/{id}/resume-series — resume a recurring series"
      - "POST /student-rides/ride-requests/{id}/cancel — cancel a request"
      - "POST /student-rides/trips/{id}/cancel — cancel a trip"
      - "POST /student-rides/trips/{id}/restore — restore a cancelled trip"
      - "POST /student-rides/billing-statements/{id}/issue — issue a statement"
      - "POST /student-rides/billing-statements/{id}/approve-payment — record payment"
      - "POST /student-rides/billing-statements/{id}/void — void a statement"
    shared_operations:
      - "POST /student-rides/riders, PUT /student-rides/riders/{id} — place and update students (shared with PlatformAdmin)"
      - "POST /student-rides/drivers, POST /student-rides/drivers/{id}/background-checks, POST /student-rides/drivers/{id}/inspections — roster and vetting (shared with PlatformAdmin)"
      - "POST /student-rides/drivers/{id}/reactivate, POST /student-rides/drivers/{id}/deactivate (shared with PlatformAdmin)"
      - "POST /student-rides/background-checks/{id}/clear, POST /student-rides/background-checks/{id}/fail (shared with PlatformAdmin)"
      - "POST /student-rides/vehicle-inspections/{id}/attest, POST /student-rides/vehicle-inspections/{id}/reject (shared with PlatformAdmin)"
      - "POST /student-rides/ride-requests, POST /student-rides/ride-requests/{id}/submit, POST /student-rides/ride-requests/{id}/reject (shared with PlatformAdmin)"
      - "POST /student-rides/contracts, POST /student-rides/trips, POST /student-rides/trips/{id}/dispatch-candidate (shared with PlatformAdmin)"
      - "GET /student-rides/districts/{id}, GET /student-rides/districts/{id}/riders, GET /student-rides/districts/{id}/ride-requests, GET /student-rides/districts/{id}/contracts, GET /student-rides/districts/{id}/trips, GET /student-rides/districts/{id}/billing-statements, GET /student-rides/districts/{id}/supply-plans (shared with PlatformAdmin and SupportCenterAgent)"

  - name: Driver
    description: "Vetted caregiver driver executing a dispatched trip. Sees only the masked student contact detail and may act only on trips assigned to them."
    identity: entity_backed:Driver
    exclusive_operations:
      - "POST /student-rides/trips/{id}/arrive — arrive at pickup"
      - "POST /student-rides/trips/{id}/depart — depart with the student on board"
      - "POST /student-rides/trips/{id}/handoffs — record a handoff verification"
      - "POST /student-rides/trips/{id}/exceptions — report a student not present or refusing to board"
    shared_operations:
      - "POST /student-rides/trips/{id}/accept — accept the pinned dispatch (shared with DistrictAdmin acting on the driver's behalf)"
      - "GET /student-rides/trips/{id} — read the assigned trip (shared with DistrictAdmin and SupportCenterAgent)"
      - "GET /student-rides/trips/{id}/alerts, GET /student-rides/trips/{id}/handoffs, GET /student-rides/trips/{id}/safety-incidents (shared with DistrictAdmin and SupportCenterAgent)"
      - "GET /student-rides/riders/{id} — read the rider on an assigned trip, with emergency_contact_phone masked to support_center_phone_masked (shared with DistrictAdmin and SupportCenterAgent)"
      - "GET /student-rides/drivers/{id} — read own driver record (shared with DistrictAdmin and SupportCenterAgent)"
      - "GET /student-rides/drivers/{id}/trips — list own assigned trips (shared with DistrictAdmin and SupportCenterAgent)"

  - name: SupportCenterAgent
    description: "Twenty-four-hour safety desk. Owns incident adjudication and alert resolution; cannot touch contracts, billing or the driver roster."
    identity: opaque
    exclusive_operations:
      - "POST /student-rides/safety-incidents/{id}/review — open an incident review"
      - "POST /student-rides/safety-incidents/{id}/resolve — adjudicate an incident"
      - "POST /student-rides/safety-incidents/{id}/void — void an incident"
      - "POST /student-rides/trips/{id}/resolve-discrepancy — clear a discrepancy posture"
      - "POST /student-rides/trip-alerts/{id}/resolve — resolve a trip alert"
    shared_operations:
      - "GET /student-rides/districts/{id}, GET /student-rides/districts/{id}/riders, GET /student-rides/districts/{id}/ride-requests, GET /student-rides/districts/{id}/trips (shared with PlatformAdmin)"
      - "GET /student-rides/riders, GET /student-rides/riders/{id} (shared with DistrictAdmin and PlatformAdmin)"
      - "GET /student-rides/drivers, GET /student-rides/drivers/{id}, GET /student-rides/drivers/{id}/background-checks, GET /student-rides/drivers/{id}/inspections, GET /student-rides/drivers/{id}/trips, GET /student-rides/drivers/{id}/safety-incidents (shared with DistrictAdmin and PlatformAdmin)"
      - "GET /student-rides/trips/{id}, GET /student-rides/trips/{id}/alerts, GET /student-rides/trips/{id}/handoffs, GET /student-rides/trips/{id}/safety-incidents (shared with DistrictAdmin and Driver)"

  - name: PlatformAdmin
    description: "Platform operator. Superset role for oversight, clock control, lock release and fleet-wide corrections."
    identity: opaque
    exclusive_operations:
      - "POST /student-rides/trips/{id}/release-lock — release a locked trip"
      - "POST /student-rides/safety-incidents/{id}/reopen — reopen an adjudicated incident"
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /_support-center/monitor-sweep — run a monitoring sweep"
      - "POST /_events/emit — emit a system event"
    shared_operations:
      - "Every operation listed under DistrictAdmin's exclusive and shared operations"
      - "POST /student-rides/trips/{id}/resolve-discrepancy (shared with SupportCenterAgent)"
      - "GET /student-rides/districts/{id}/supply-plans (shared with DistrictAdmin)"
