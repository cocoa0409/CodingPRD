# =============================================================================
# 1.9 Scaffold Corner Design
#
# One instance per applicable row of references/claim-extraction-guide.md,
# walked against §1.1-§1.7 of SCAFFOLD.yaml. Rows whose whole point is already
# carried by a §1.8 difficulty instance appear as `excluded_because` stubs that
# name that instance, so the corner suite never re-tests a difficulty fixture.
#
# Fixture conventions used throughout:
#   * the logical clock is pinned with POST /energy-ops/_clock/set_current_utc
#     before anything else; every created_at / window comparison reads it
#   * a "commissioned store" fixture is: create store -> create standard for the
#     store's (climate_zone, store_format, season) -> publish -> commission with
#     expected_store_version -> activate.  After activation the store is
#     bms_status ACTIVE, energy_posture NORMAL, version 3
#   * StoreManager / BmsGateway calls always carry as_user_id equal to the id of
#     the store they act on (both roles are entity_backed:Store, §1.7)
#   * every asserted money / rate / score literal below is pre-computed with
#     Decimal ROUND_HALF_UP following the round-each-step order declared in §1.3
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_creation_returns_full_declared_representation
        claim_type: creation
        grounds: "§1.1 Store (all 22 fields); §1.5 POST /energy-ops/stores (input list, output Store)"
        distinguishing_aspect: |
          Creation with EVERY optional input supplied, so no default can mask a
          missing field: the response must carry all four input-sourced optional
          fields at the values sent AND every system/computed field at its
          declared creation value, with version 1 and created_at stamped from
          the logical clock rather than wall time.
        test_recipe:
          setup: "clock pinned; no other rows exist"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/stores"
            payload:
              code: "STR-C1"
              climate_zone: "MIXED"
              store_format: "SUPERCENTER"
              floor_area_sqft: 120000
              blended_rate_usd_per_kwh: 0.1250
              override_budget_kwh_month: 800.00
              lighting_on_time_local: "06:00"
              lighting_off_time_local: "22:30"
              daylight_harvest_enabled: false
              occupancy_control_enabled: false
            as: PlatformAdmin
            captures: { store_id: "$.data.id" }
          assert: |
            201. response_type == "object"; meta.api_request_id and
            meta.api_request_timestamp present.
            data.code == "STR-C1"; climate_zone == "MIXED";
            store_format == "SUPERCENTER"; floor_area_sqft == 120000;
            blended_rate_usd_per_kwh == 0.1250;
            override_budget_kwh_month == 800.00;
            lighting_on_time_local == "06:00";
            lighting_off_time_local == "22:30";
            daylight_harvest_enabled is false; occupancy_control_enabled is false.
            System/computed fields: bms_status == "NOT_DEPLOYED";
            active_standard_id is null; energy_posture == "NORMAL";
            override_kwh_used_month == 0.0; verified_savings_kwh_ytd == 0.0;
            portfolio_realization_rate == 0.85; eui_kbtu_per_sqft is null;
            benchmark_percentile is null; benchmark_outlier_flag is false;
            alarm_case_count == 0; urgent_work_order_count == 0.
            Common fields: id non-empty; version == 1;
            created_at == "2026-08-01T00:00:00Z"; updated_at == created_at.

      - name: store_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds: "§1.1 Store defaults (blended_rate_usd_per_kwh 0.11, override_budget_kwh_month 500.0, lighting_on_time_local 05:30, lighting_off_time_local 23:00, daylight_harvest_enabled true, occupancy_control_enabled true, portfolio_realization_rate 0.85)"
        distinguishing_aspect: |
          The mirror image of the creation instance: only the four required
          inputs are sent. Every omitted optional field must fall back to the
          §1.1 default, including the two clock-of-day strings and the two
          control flags, which default to true - an implementation that treats
          "absent" as false fails here.
        test_recipe:
          setup: "clock pinned"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            call: "POST /energy-ops/stores"
            payload: { code: "STR-C2", climate_zone: "COLD", store_format: "EXPRESS", floor_area_sqft: 18000 }
            as: PlatformAdmin
            captures: { store_id: "$.data.id" }
          assert: |
            201. blended_rate_usd_per_kwh == 0.11;
            override_budget_kwh_month == 500.0;
            lighting_on_time_local == "05:30";
            lighting_off_time_local == "23:00";
            daylight_harvest_enabled is true; occupancy_control_enabled is true;
            portfolio_realization_rate == 0.85; override_kwh_used_month == 0.0;
            verified_savings_kwh_ytd == 0.0; energy_posture == "NORMAL";
            bms_status == "NOT_DEPLOYED"; version == 1.

      - name: store_system_fields_are_server_owned_and_advance_on_write
        claim_type: system_fields
        grounds: "§1.1 Store.bms_status / active_standard_id / energy_posture (source system|computed); §1.2 state_machines.Store transitions bms_commission_initial, bms_activate"
        distinguishing_aspect: |
          System fields are asserted to be UNWRITABLE at creation (the client
          sends bms_status ACTIVE, active_standard_id and version 9 in the
          create body and they are ignored) and then asserted to advance only
          through their declared transitions: version 1 -> 2 on commissioning,
          2 -> 3 on activation, with updated_at re-stamped from the clock each
          time while created_at stays frozen.
        test_recipe:
          setup: "clock pinned at 2026-08-01T00:00:00Z, advanced to 2026-08-02T00:00:00Z before commissioning so updated_at is distinguishable from created_at"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-C3", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
              captures: { store_v2: "$.data.version" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/bms-activation"
            payload: {}
            as: EnergyManager
          assert: |
            After setup call 2 the store had bms_status == "NOT_DEPLOYED",
            active_standard_id null and version == 1 (store_v1 == 1),
            created_at == "2026-08-01T00:00:00Z".
            Injection variant of the SAME create call: repeating it with
            `bms_status: "ACTIVE"`, `active_standard_id: "std_injected"`,
            `version: 9`, `created_at: "2020-01-01T00:00:00Z"` and
            `id: "str_injected"` ADDED to the body (a distinct code, e.g.
            "STR-C3B") returns 201 with a server-generated id, bms_status
            "NOT_DEPLOYED", active_standard_id null, version 1 and created_at
            "2026-08-01T00:00:00Z" - the system-owned keys are ignored, not
            echoed and not rejected.
            After commissioning store_v2 == 2, bms_status == "COMMISSIONING",
            active_standard_id == ${std_id},
            updated_at == "2026-08-02T00:00:00Z" while
            created_at is still "2026-08-01T00:00:00Z".
            Trigger: 200; bms_status == "ACTIVE"; version == 3;
            energy_posture == "NORMAL"; updated_at == "2026-08-02T00:00:00Z".

      - name: store_listing_filters_combine_with_offset_window
        claim_type: listing
        grounds: "§1.5 GET /energy-ops/stores (input climate_zone?, store_format?, energy_posture?, bms_status?, active_standard_id?, benchmark_outlier_flag?, limit?, offset?); §1.0 pagination_fields and pagination_defaults"
        distinguishing_aspect: |
          Two filters are ANDed and then a one-row page is taken from offset 1,
          so total_count must report the FILTERED cardinality (2) rather than the
          table cardinality (3) while has_more reports false for the last page -
          the two mistakes (count before filtering, has_more computed from the
          unfiltered total) are both caught.
        test_recipe:
          setup: "three stores: two MIXED/EXPRESS, one COLD/EXPRESS, created in that order"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-L1", climate_zone: "MIXED", store_format: "EXPRESS", floor_area_sqft: 12000 }
              as: PlatformAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-L2", climate_zone: "MIXED", store_format: "EXPRESS", floor_area_sqft: 14000 }
              as: PlatformAdmin
              captures: { s2: "$.data.id" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-L3", climate_zone: "COLD", store_format: "EXPRESS", floor_area_sqft: 16000 }
              as: PlatformAdmin
              captures: { s3: "$.data.id" }
          trigger:
            call: "GET /energy-ops/stores?climate_zone=MIXED&store_format=EXPRESS&limit=1&offset=1"
            payload: {}
            as: EnergyAnalyst
          assert: |
            200. response_type == "array"; exactly 1 element, and that element is
            the store whose id == ${s2} (code "STR-L2"), i.e. the second row of
            the filtered set in creation order.
            total_count == 2 (the COLD store is excluded); limit == 1;
            offset == 1; has_more is false.
            A second read GET /energy-ops/stores (no query) returns 3 elements
            with total_count == 3, limit == 10, offset == 0, has_more false,
            proving the defaults of §1.0 pagination_defaults.

      - name: refrigeration_case_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: "§1.1 RefrigerationCase; §1.5 POST /energy-ops/stores/{id}/refrigeration-cases, GET /energy-ops/refrigeration-cases/{id}"
        distinguishing_aspect: |
          Read-back of a child created under a store path: the GET must return
          the same row with store_id resolved from the CREATION PATH (it is a
          system field, never a body field) and with the monitoring dimension at
          its initial value, so a handler that echoes the request body instead of
          the persisted row is caught.
        test_recipe:
          setup: "commissioned store (bms ACTIVE) + one refrigeration case"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-R1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-R1", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 4200.00 }
              as: PlatformAdmin
              captures: { case_id: "$.data.id" }
          trigger:
            call: "GET /energy-ops/refrigeration-cases/${case_id}"
            payload: {}
            as: FoodSafetyOfficer
          assert: |
            200. data.id == ${case_id}; store_id == ${store_id};
            case_code == "CASE-R1"; case_type == "MEDIUM_TEMP";
            product_class == "DAIRY"; alarm_high_f == 41.0; alarm_low_f == 28.0;
            product_value_usd == 4200.00; monitoring_state == "ARMED";
            consecutive_breach_count == 0; last_reading_temp_f is null;
            last_reading_iso is null; version == 1;
            created_at == "2026-08-01T00:00:00Z".

      - name: excursion_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: "§1.4 priority 46 (the excursion id in the path resolves) -> ERR_EXCURSION_NOT_FOUND; §1.6 ERR_EXCURSION_NOT_FOUND (404)"
        distinguishing_aspect: |
          The 404 is asserted on a well-formed but unknown id with a fully
          authorised caller, so the only possible cause is path resolution; the
          error envelope shape (response_type "error", data.error_id,
          data.message) is asserted alongside the status.
        test_recipe:
          setup: "clock pinned; no excursion rows exist at all"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            call: "GET /energy-ops/excursions/exc_00000000-0000-0000-0000-000000000000"
            payload: {}
            as: FoodSafetyOfficer
            captures: { err: "$.data.error_id" }
          assert: |
            404. response_type == "error"; data.error_id ==
            "ERR_EXCURSION_NOT_FOUND"; data.message is a non-empty string;
            meta.api_request_id present. No 500, no empty body.

      - name: utility_account_create_missing_required_rate_rejected
        claim_type: required_fields
        grounds: "§1.1 UtilityAccount required inputs (utility_name, rate_schedule_code, rate_family, demand_charge_per_kw, rate_on_peak, rate_off_peak); §1.4 priority 30 -> ERR_INVALID_REQUEST"
        distinguishing_aspect: |
          rate_off_peak is the required field omitted, and it is the one that
          LOOKS optional because its sibling candidate_rate_off_peak is
          optional and ratchet_peak_kw has a default: only the six fields
          without defaults are mandatory, and nothing is persisted on rejection.
        test_recipe:
          setup: "one store"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-RQ", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/stores/${store_id}/utility-accounts"
            payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450 }
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            400. data.error_id == "ERR_INVALID_REQUEST".
            A follow-up GET /energy-ops/stores/${store_id}/utility-accounts
            returns 0 elements with total_count == 0: the rejected create
            persisted nothing.

      - name: setpoint_standard_enum_and_range_constraints_rejected
        claim_type: type_constraints
        grounds: "§1.1 SetpointStandard.season (one of SUMMER | WINTER), cooling_setpoint_f (60.0..85.0), heating_setpoint_f (55.0..78.0, must be < cooling_setpoint_f); §1.4 priority 30 -> ERR_INVALID_REQUEST"
        distinguishing_aspect: |
          Three different type/range failures on one entity, each rejected by
          the SAME priority-30 rule: an undeclared enum member, a numeric range
          violation, and the cross-field ordering constraint
          heating_setpoint_f < cooling_setpoint_f (asserted at EQUALITY, which
          §1.4 priority 30 declares a rejection, not just at heating > cooling).
        test_recipe:
          setup: "clock pinned; no standards exist"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SPRING", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 92.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { err_range: "$.data.error_id" }
          trigger:
            call: "POST /energy-ops/setpoint-standards"
            payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 72.0, heating_setpoint_f: 72.0, deadband_f: 2.0, lighting_lux_target: 750 }
            as: EnergyManager
            captures: { err_order: "$.data.error_id" }
          assert: |
            Setup call 2 (season "SPRING"): 400, ERR_INVALID_REQUEST.
            Setup call 3 (cooling_setpoint_f 92.0 > 85.0): 400,
            ERR_INVALID_REQUEST.
            Trigger (heating_setpoint_f == cooling_setpoint_f == 72.0): 400,
            ERR_INVALID_REQUEST - equality is a violation of "must be <".
            GET /energy-ops/setpoint-standards returns 0 elements: none of the
            three rejected drafts was persisted.

      - name: demand_interval_is_an_immutable_event_row
        claim_type: immutability
        grounds: "§1.1 DemandInterval (common_fields: false, kind: event); §1.5 endpoint table (the only DemandInterval endpoints are POST .../demand-intervals and GET .../demand-intervals - no update, no delete, no by-id read)"
        distinguishing_aspect: |
          The one entity in §1.1 with common_fields: false. Two claims are
          asserted together: the persisted row carries NO version and NO
          updated_at (only the five declared fields plus the system
          utility_account_id and created_at), and §1.5 exposes no mutating
          endpoint for it - a second POST of the same interval_start_iso is
          accepted as an additional immutable event row rather than an update,
          leaving the earlier row byte-identical.
        test_recipe:
          setup: "store + TOU_DEMAND utility account"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-IM", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Statewide Power", rate_schedule_code: "GS-3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 900.0, is_on_peak: true } ] }
              as: EnergyAnalyst
          trigger:
            call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
            payload: { intervals: [ { interval_start_iso: "2026-06-15T14:00:00Z", kw_demand: 950.0, is_on_peak: true } ] }
            as: EnergyAnalyst
          assert: |
            201 (array output). Each returned element has exactly the fields
            utility_account_id, interval_start_iso, kw_demand, is_on_peak,
            is_dr_event_day (+ created_at); NO "version" key and NO
            "updated_at" key appear on any DemandInterval element.
            GET /energy-ops/utility-accounts/${acct_id}/demand-intervals now
            returns 2 elements with total_count == 2, the first still
            kw_demand == 900.0 (untouched by the second POST) and the second
            kw_demand == 950.0; both is_dr_event_day false (the declared
            default). The §1.5 table declares no PATCH/PUT/DELETE for
            DemandInterval, so no update path exists to test.

      - name: refrigeration_case_requires_an_existing_parent_store
        claim_type: parent_relationships
        grounds: "§1.1 RefrigerationCase.parent == Store and store_id source: system ('taken from the creation path'); §1.4 priority 40 -> ERR_STORE_NOT_FOUND"
        distinguishing_aspect: |
          The parent id lives in the PATH, not the body, so the failure mode is
          path resolution and it must be reported as the store's 404
          (ERR_STORE_NOT_FOUND) rather than a generic 400 or the child's own
          404 - and it must outrank the BMS-not-commissioned rule of priority
          92, which would also be violated by a nonexistent store.
        test_recipe:
          setup: "clock pinned; one real store exists so the failure is specific to the unknown id"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-PR", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            call: "POST /energy-ops/stores/str_00000000-0000-0000-0000-000000000000/refrigeration-cases"
            payload: { case_code: "CASE-PR", case_type: "LOW_TEMP", product_class: "FROZEN", alarm_high_f: 5.0, alarm_low_f: -10.0, product_value_usd: 9000.00 }
            as: PlatformAdmin
            captures: { err: "$.data.error_id" }
          assert: |
            404. data.error_id == "ERR_STORE_NOT_FOUND" (NOT
            ERR_BMS_NOT_COMMISSIONED, which priority 92 would raise for a store
            that resolved but was NOT_DEPLOYED, and NOT ERR_CASE_NOT_FOUND).
            GET /energy-ops/stores/${store_id}/refrigeration-cases returns 0
            elements.

      - name: hybrid_topology_children_resolve_under_their_own_store_only
        claim_type: parent_relationships
        grounds: "§1.0 complexity_profile.entity_topology hybrid ('cross-cutting associations validated across the hierarchy'); §1.1 UtilityAccount.store_id, RefrigerationCase.store_id, LightingOverride.store_id, FaultDiagnostic.store_id, RetrofitProject.store_id; §1.5 the five GET /energy-ops/stores/{id}/... collection endpoints"
        distinguishing_aspect: |
          Two stores are populated with a child of the same four families each,
          and each store's five collection endpoints must return exactly its own
          children. This is the hybrid-topology row: the hub (Store) fans out to
          four different child families whose rows are otherwise
          indistinguishable, so a missing store_id filter on any one collection
          endpoint is caught here rather than in a state test.
        test_recipe:
          setup: |
            two commissioned stores A and B (both MIXED/SUPERCENTER, sharing one
            published standard); A gets a case, an account, an override and a
            fault; B gets a case and a retrofit project.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
