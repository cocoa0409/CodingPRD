            - "error_id == ERR_OPEN_NEGOTIATION_ACTIVE (business_temporal), not ERR_INVALID_STATE"
            - "OpenNegotiation.${on_l_id}.status remains ACTIVE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: idr_submission_at_exact_expiry_instant_is_allowed
        grounds:
          - entities.OpenNegotiation.fields.expires_at
          - validations[priority=7]
          - calculations.sla_tracking
        distinguishing_aspect: |
          Numeric temporal boundary: at logical time exactly equal to
          expires_at (2026-10-22T10:00:00Z) the open negotiation is EXPIRED and
          IDR submission succeeds; one second earlier (2026-10-22T09:59:59Z) it
          is rejected ERR_OPEN_NEGOTIATION_ACTIVE — the boundary is inclusive of
          expiry (>=), not exclusive.
        test_recipe:
          setup:
            - "Claim M: nsa_flag true, PRICED (33000 fixture)."
            - "ON2 initiated 2026-09-10T10:00:00Z, expires_at 2026-10-22T10:00:00Z."
            - "Two IDR attempts: one at 09:59:59 (rejected), one at exactly 10:00:00 (accepted)."
