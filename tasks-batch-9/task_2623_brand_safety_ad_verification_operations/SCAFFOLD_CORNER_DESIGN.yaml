              as_user_id: "${adv_id}"
              captures: { camp_v2: $.data.version }
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", batch_ids: ["${batch_2}"], expected_campaign_version: "${camp_v2}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_2: $.data.id }
          assert:
            - "Setup: certifying the two quarantining batches leaves Campaign.${camp_id}.coverage_status UNKNOWN (no CERTIFIED batch) and its version at ${camp_v1}, which is at least ${camp_v0}"
            - "Trigger 1: HTTP 201; RefundClaim.${claim_1}.claim_state == SUBMITTED and Campaign.${camp_id}.open_claim_count == 1 and version == ${camp_v1} + 1"
            - "Trigger 2 (same token, a different and perfectly claimable batch): HTTP 412 and ${e_stale} == ERR_STALE_CAMPAIGN_VERSION - the refusal is about the campaign token, not about batch 2"
            - "After trigger 2: MeasurementBatch.${batch_2}.settlement_status is still UNBILLED and open_claim_count is still 1"
            - "Trigger 3: ${camp_v2} == ${camp_v1} + 1"
            - "Trigger 4 with the refreshed token: HTTP 201; RefundClaim.${claim_2}.claim_state == SUBMITTED, MeasurementBatch.${batch_2}.settlement_status == CLAIMED, open_claim_count == 2 and version == ${camp_v1} + 2"

      - name: four_hop_quarantine_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: third_quarantine_restricts_publisher_stales_list_and_segment
          rationale: |
            The cascading_side_effects layer has two four-hop chains and both are
            already built at depth: certify -> publisher RESTRICTED -> ALLOW list
            STALE -> segment STALE by
            third_quarantine_restricts_publisher_stales_list_and_segment, and
            audit DEFICIENT -> batch DECERTIFIED -> campaign counters and
            UNDER_REMEDIATION -> segment STALE by
            methodology_suspension_decertifies_batch_remediates_campaign_stales_segment.
            Both assert every hop's fields and both control the ordering, so a
            breadth instance here would only re-walk the same chain.

      - name: dual_variant_suitability_and_claim_bases
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: suitability_tier_prebid_rollup_vs_postbid_page_level
          rationale: |
            Both declared dual-variant calculations are exercised at depth: the
            page_suitability_tier variants (pre_bid_domain_rollup vs
            post_bid_page_level) by suitability_tier_prebid_rollup_vs_postbid_page_level,
            and the claim_impression_basis variants (gross at intake vs net at
            approval) by claim_impression_basis_gross_at_intake_vs_net_at_approval,
            which also reconciles the delta into the credit ledgers. Each of those
            instances runs both variants over identical data and asserts the
            divergence, which is exactly the claim this row asks for.

      - name: approval_pins_the_basis_it_recomputes
        claim_type: version_pinning_on_approval
        excluded_because:
          difficulty_instance: claim_impression_basis_gross_at_intake_vs_net_at_approval
          rationale: |
            version_pinning_on_approval is the rule that a claim's fiscal figures
            are recomputed and FROZEN at approval rather than carried from
            intake. The §1.8 instance approves a claim whose net basis differs
            from its provisional gross basis, asserts the pinned
            credited_impressions / net_credit_cents / admin_fee_cents on the
            approved record, and then shows a later rescore leaving those pinned
            figures untouched. Nothing is left for a breadth instance.

  # From Consistency Model
  - section: consistency_model
    instances:
      - name: certify_publishes_every_derived_counter_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /measurement-batches/{id}/certify]
          - calculations.publisher_quality_index
        distinguishing_aspect: |
          The declared consistency model is immediate, so there is no window in
          which a derived counter may lag: the certify response itself carries the
          batch's final scoring_status, and reads issued immediately afterwards -
          publisher, campaign and the computed scorecard - must already agree with
          it. An implementation that recomputes the scorecard lazily, or that
          updates Publisher.quarantined_batch_count on the next write, passes an
          eventual-consistency test and fails this one.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one classified SAFE page; one SCORED batch measured 10000 / measurable 6000 / in_view 6000 -> coverage_rate 0.6000, below the pinned floor 0.7, so certify must quarantine it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/news" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 6000, in_view_impressions: 6000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
            - call: "POST /measurement-batches/${batch_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { scored_coverage: $.data.coverage_rate }
          trigger:
            - call: "POST /measurement-batches/${batch_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { certify_status: $.data.scoring_status }
            - call: "GET /publishers/${pub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { quarantined: $.data.quarantined_batch_count, certified: $.data.certified_batch_count }
            - call: "GET /publishers/${pub_id}/scorecard"
              payload: {}
              as: PlatformAdmin
              captures: { adjudicated: $.data.adjudicated_batch_count, index: $.data.quality_index, band: $.data.tier_band }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { coverage_status: $.data.coverage_status }
          assert:
            - "Setup: ${scored_coverage} == 0.6000 and the batch is SCORED, not yet counted anywhere"
            - "Trigger 1: HTTP 200 and ${certify_status} == QUARANTINED - the response itself is already final, no second read is needed to learn the outcome"
            - "Trigger 2, issued immediately after: ${quarantined} == 1 and ${certified} == 0 - the publisher counters are updated inside the certify request, not lazily"
            - "Trigger 3: ${adjudicated} == 1 - the QUARANTINED batch is adjudicated evidence the instant it is certified, so it is inside the scorecard's source set; ${index} == 97.00 (raw = 100 - ivt_rate_avg 0.0000 * 100 * 2.0 - max(0, 0.7 - viewability_rate_avg 1.0000) * 100 * 1.5 - 0 mfa pages * 5 - 1 quarantined batch * 3 + overturn_rate 0.0000 * 10 = 97, clamped into [0.00, 100.00] and rounded half-up to 97.00) and ${band} == PREFERRED because 97.00 >= 85.00"
            - "Trigger 4: ${coverage_status} == UNKNOWN because certified_measured_impressions is still 0 - the quarantined batch is excluded from the campaign rollup in the same instant it is created"
            - "Repeating triggers 2-4 returns byte-identical bodies: the reads are pure projections of state that was already committed by trigger 1"
