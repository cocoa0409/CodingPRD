# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Master Gardener Volunteer Program & Help Desk
# 9 rules, 25 instances total
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: service_hours_provisional_vs_official_project_cap
        grounds:
          - calculations.credit_totals
          - calculations.project_credit_cap
          - entities.RecertificationRecord.fields.provisional_service_hours
          - entities.RecertificationRecord.fields.official_service_hours
        distinguishing_aspect: |
          Dual-variant calculation on the VOLUNTEER HOURS domain: identical
          CreditEntry rows yield provisional_service_hours == 31.0 (PENDING
          included, no project cap) but official_service_hours == 22.5
          (APPROVED only, project hours truncated at the 12.5 cap).
        test_recipe:
          setup:
            - "Cycle 2026 OPEN (hour_requirement 40.0); volunteer Alice ACTIVE with a PENDING RecertificationRecord"
            - "Project estimated_hours_per_volunteer 10.0 -> cap 12.5, APPROVED"
            - "Entries: OTHER 10.0 APPROVED; PROJECT 8.0 (2026-08-06) APPROVED; PROJECT 8.0 (2026-08-07) APPROVED (second capped to 4.5); OTHER 5.0 left PENDING"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: ["Harford"] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /projects", payload: { cycle_id: "${cyc}", organizer_volunteer_id: "${vol}", title: "Pollinator Garden", description: "Install pollinator beds", estimated_hours_per_volunteer: 10.0 }, as: Volunteer, as_user_id: "${vol}", captures: { proj: "$.data.id" } }
            - { call: "POST /projects/${proj}/submit", as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /projects/${proj}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 10.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: "$.data.id" } }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "PROJECT", activity_date: "2026-08-06", hours: 8.0, source_type: "PROJECT", source_id: "${proj}" }, as: Volunteer, as_user_id: "${vol}", captures: { e2: "$.data.id" } }
            - { call: "POST /credit-entries/${e2}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "PROJECT", activity_date: "2026-08-07", hours: 8.0, source_type: "PROJECT", source_id: "${proj}" }, as: Volunteer, as_user_id: "${vol}", captures: { e3: "$.data.id" } }
            - { call: "POST /credit-entries/${e3}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-08", hours: 5.0 }, as: Volunteer, as_user_id: "${vol}" }
          trigger:
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { rec_official: "$.data.official_service_hours", rec_provisional: "$.data.provisional_service_hours" } }
          assert:
            - "RecertificationRecord.${rec}.provisional_service_hours == 31.0"
            - "RecertificationRecord.${rec}.official_service_hours == 22.5"
            - "RecertificationRecord.${rec}.provisional_service_hours != RecertificationRecord.${rec}.official_service_hours"

      - name: specialist_score_rolling_vs_lifetime
        grounds:
          - calculations.specialist_performance_score
          - entities.Specialist.fields.rolling_score
          - entities.Specialist.fields.lifetime_score
        distinguishing_aspect: |
          Dual-variant calculation on the SPECIALIST PERFORMANCE domain
          (different domain from hours): the same resolution history yields
          rolling_score == 100 (trailing-90-day window from the 2026-11-20 clock
          excludes the August late answer and return) but lifetime_score == 92
          (100 - 5*1 late - 3*1 returned over all time).
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE and staffed on help-desk shifts 2026-08-05, 2026-08-06, 2026-11-20 (all 09:00-12:00)"
            - "Specialist S (PEST, capacity 3): referral R1 answered LATE at 2026-08-07T10:00:01Z; R2 RETURNED 2026-08-06; R3 answered on time 2026-11-20T11:00:00Z"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /specialists", payload: { name: "Dr. Pest", specialty: "PEST", max_concurrent_referrals: 3 }, as: ProgramCoordinator, captures: { spec: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh1: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-06T09:00:00Z", end_time: "2026-08-06T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh2: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-11-20T09:00:00Z", end_time: "2026-11-20T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh3: "$.data.id" } }
            - { call: "POST /shifts/${sh1}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /shifts/${sh2}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh1}/inquiries", payload: { volunteer_id: "${vol}", subject: "Cucumber beetles", contact_name: "Resident One", details: "Striped beetles on cucurbits" }, as: Volunteer, as_user_id: "${vol}", captures: { inq1: "$.data.id" } }
            - { call: "POST /inquiries/${inq1}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
            - { call: "POST /inquiries/${inq1}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref1: "$.data.id" } }
            - { call: "POST /diagnosis-referrals/${ref1}/start-review", as: Specialist, as_user_id: "${spec}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh2}/inquiries", payload: { volunteer_id: "${vol}", subject: "Aphids on kale", contact_name: "Resident Two", details: "Gray aphid cluster" }, as: Volunteer, as_user_id: "${vol}", captures: { inq2: "$.data.id" } }
            - { call: "POST /inquiries/${inq2}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
            - { call: "POST /inquiries/${inq2}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref2: "$.data.id" } }
            - { call: "POST /diagnosis-referrals/${ref2}/start-review", as: Specialist, as_user_id: "${spec}" }
            - { call: "POST /diagnosis-referrals/${ref2}/return", payload: { return_reason: "needs lab culture" }, as: Specialist, as_user_id: "${spec}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T10:00:01Z" }, as: ProgramCoordinator }
            - { call: "POST /diagnosis-referrals/${ref1}/answer", payload: { diagnosis_text: "Cucumber beetle; use row cover" }, as: Specialist, as_user_id: "${spec}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T08:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh3}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh3}/inquiries", payload: { volunteer_id: "${vol}", subject: "Boxwood psyllid", contact_name: "Resident Three", details: "Cupped leaves" }, as: Volunteer, as_user_id: "${vol}", captures: { inq3: "$.data.id" } }
            - { call: "POST /inquiries/${inq3}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
            - { call: "POST /inquiries/${inq3}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref3: "$.data.id" } }
            - { call: "POST /diagnosis-referrals/${ref3}/start-review", as: Specialist, as_user_id: "${spec}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-20T11:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /diagnosis-referrals/${ref3}/answer", payload: { diagnosis_text: "Boxwood psyllid; prune tips" }, as: Specialist, as_user_id: "${spec}" }
          trigger:
            - { call: "GET /specialists/${spec}", as: ProgramCoordinator }
          assert:
            - "Specialist.${spec}.answered_count == 2"
            - "Specialist.${spec}.late_referral_count == 1"
            - "Specialist.${spec}.returned_count == 1"
            - "Specialist.${spec}.rolling_score == 100"
            - "Specialist.${spec}.lifetime_score == 92"
            - "Specialist.${spec}.rolling_score != Specialist.${spec}.lifetime_score"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all three)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: composite_score_tiered_bonus_and_cap
        grounds:
          - calculations.application_composite_score
          - entities.Application.fields.composite_score
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: weighted essay/
          interview, tiered experience bonus (years 7 -> +5, years 12 -> +8),
          conditional county bonus (+4), and the hard min(100, ...) cap. The
          second application would compute 112.0 without the cap; the cap pins
          it to exactly 100.0.
        test_recipe:
          setup:
            - "Cycle 2026 DRAFT-then-OPEN with priority_counties [Harford]"
            - "A1: county Harford, prior_gardening_years 7; A2: county Harford, prior_gardening_years 12"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: ["Harford"] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app1: "$.data.id" } }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Carol Cedar", email: "carol@example.org", county: "Harford", prior_gardening_years: 12 }, as: ProgramCoordinator, captures: { app2: "$.data.id" } }
          trigger:
            - { call: "POST /applications/${app1}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/score", payload: { essay_score: 100, interview_score: 100 }, as: ProgramCoordinator }
          assert:
            - "Application.${app1}.composite_score == 95.0   (0.4*80 + 0.6*90 + 5 + 4)"
            - "Application.${app2}.composite_score == 100.0  (112.0 raw, capped)"
            - "Application.${app1}.status == SCORED"

      - name: shift_credit_per_entry_rounding
        grounds:
          - calculations.shift_credit_hours
          - calculations.credit_totals
          - entities.ShiftSignup.fields.completed_entry_id
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: each completed shift is
          quarter-rounded individually (100 min -> 1.75, 70 min -> 1.25) and
          totals SUM the rounded entries (3.00). The rejected sum-then-round
          order would produce 2.75 on the same data, so 3.00 is only reachable
          with per-entry-first rounding.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE"
            - "Shift S1 2026-08-10 09:00-10:40 (100 min) and S2 2026-08-10 11:00-12:10 (70 min), same location Desk A, both COMPLETED with the volunteer's signups COMPLETED and both minted entries APPROVED"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T09:00:00Z", end_time: "2026-08-10T10:40:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh1: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-10T11:00:00Z", end_time: "2026-08-10T12:10:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh2: "$.data.id" } }
            - { call: "POST /shifts/${sh1}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { su1: "$.data.id" } }
            - { call: "POST /shifts/${sh2}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { su2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:10:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh1}/complete", as: ProgramCoordinator }
            - { call: "POST /shifts/${sh2}/complete", as: ProgramCoordinator }
            - { call: "POST /shift-signups/${su1}/complete", as: ProgramCoordinator, captures: { ce1: "$.data.completed_entry_id" } }
            - { call: "POST /shift-signups/${su2}/complete", as: ProgramCoordinator, captures: { ce2: "$.data.completed_entry_id" } }
            - { call: "POST /credit-entries/${ce1}/approve", as: ProgramCoordinator }
            - { call: "POST /credit-entries/${ce2}/approve", as: ProgramCoordinator }
          trigger:
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator }
          assert:
            - "CreditEntry.${ce1}.hours == 1.75"
            - "CreditEntry.${ce2}.hours == 1.25"
            - "RecertificationRecord.${rec}.official_service_hours == 3.0"
            - "RecertificationRecord.${rec}.official_service_hours != 2.75   (sum-then-round value is wrong)"

      - name: recognition_tier_pinned_evaluation_order
        grounds:
          - calculations.recognition_tier_and_points
          - entities.Volunteer.fields.recognition_tier
          - entities.Volunteer.fields.recognition_points
          - entities.Volunteer.fields.lifetime_base_hours
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          tier reads the UNMULTIPLIED base (38.0 + 2.0 outreach = 40.0 -> GOLD
          at the >= 40.0 boundary), then the GOLD bonus applies only to points
          (40.5). Evaluating bonus-first would report base 40.5 and points 41.0;
          both wrong values are reachable by reordering, so the pinned order is
          falsifiable.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE"
            - "Approved SERVICE/OTHER entries 12.0 + 12.0 + 12.0 + 2.0 (= 38.0) and one approved OUTREACH entry of 2.0"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-05", hours: 12.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e1: "$.data.id" } }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-06", hours: 12.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e2: "$.data.id" } }
            - { call: "POST /credit-entries/${e2}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-07", hours: 12.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e3: "$.data.id" } }
            - { call: "POST /credit-entries/${e3}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OTHER", activity_date: "2026-08-08", hours: 2.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e4: "$.data.id" } }
            - { call: "POST /credit-entries/${e4}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "OUTREACH", activity_date: "2026-08-09", hours: 2.0 }, as: Volunteer, as_user_id: "${vol}", captures: { e5: "$.data.id" } }
            - { call: "POST /credit-entries/${e5}/approve", as: ProgramCoordinator }
          trigger:
            - { call: "GET /volunteers/${vol}", as: ProgramCoordinator }
          assert:
            - "Volunteer.${vol}.lifetime_base_hours == 40.0"
            - "Volunteer.${vol}.recognition_tier == GOLD"
            - "Volunteer.${vol}.recognition_points == 40.5"
            - "Volunteer.${vol}.recognition_points != 41.0   (bonus-first order is wrong)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_active_inactive_reactivation_cycle
        grounds:
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - state_machines.Volunteer.INACTIVE_to_ACTIVE
          - state_machines.Volunteer.INACTIVE_to_EXITED
        distinguishing_aspect: |
          Cyclic machine on VOLUNTEER: ACTIVE -> INACTIVE (shortfall close) ->
          ACTIVE (reactivation) -> INACTIVE (second consecutive shortfall) ->
          EXITED (terminal at strike 2). A linear machine cannot express the
          return to ACTIVE or the counter-dependent terminal exit.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE with zero approved hours; recert window opens 2026-11-01"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc1: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc1}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc1}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc1}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc1}/begin-recertification", as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc1}/close", as: ProgramCoordinator }
            - { call: "GET /volunteers/${vol}", as: ProgramCoordinator, captures: { mid_status: "$.data.status" } }
            - { call: "POST /program-cycles", payload: { year_label: "2027", start_date: "2027-01-01", end_date: "2027-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2027-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc2: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc2}/open", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/reactivate", as: ProgramCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc2}/begin-recertification", as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc2}/close", as: ProgramCoordinator }
          assert:
            - "Volunteer.${vol} status was INACTIVE after first close (captured mid_status == INACTIVE)"
            - "Volunteer.${vol}.status == EXITED after second consecutive shortfall"
            - "Volunteer.${vol}.consecutive_shortfall_cycles == 2"
            - "RecertificationRecord for (vol, ${cyc1}).status == SHORTFALL and for (vol, ${cyc2}).status == SHORTFALL"

      - name: project_revision_resubmission_loop
        grounds:
          - state_machines.CommunityProject.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.CommunityProject.REVISION_REQUESTED_to_UNDER_REVIEW
          - state_machines.CommunityProject.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on COMMUNITYPROJECT (different entity than Volunteer):
          UNDER_REVIEW -> REVISION_REQUESTED -> (amend + submit) ->
          UNDER_REVIEW -> APPROVED; the loop can repeat and the version counter
          proves every lap (final version 6 after six mutations).
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE; project DRAFT with estimated_hours_per_volunteer 10.0"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /projects", payload: { cycle_id: "${cyc}", organizer_volunteer_id: "${vol}", title: "Pollinator Garden", description: "v1 scope", estimated_hours_per_volunteer: 10.0 }, as: Volunteer, as_user_id: "${vol}", captures: { proj: "$.data.id" } }
          trigger:
            - { call: "POST /projects/${proj}/submit", as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /projects/${proj}/request-revision", payload: { feedback: "tighten scope" }, as: ProgramCoordinator }
            - { call: "GET /projects/${proj}", as: ProgramCoordinator, captures: { proj_v: "$.data.version" } }
            - { call: "PUT /projects/${proj}", payload: { expected_project_version: "${proj_v}", title: "Pollinator Garden (revised)", description: "v2 scope" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /projects/${proj}/submit", as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /projects/${proj}/approve", as: ProgramCoordinator, as_user_id: "coord-a" }
          assert:
            - "CommunityProject.${proj}.status == APPROVED"
            - "CommunityProject.${proj}.title == Pollinator Garden (revised)"
            - "CommunityProject.${proj}.max_creditable_hours_per_volunteer == 12.5"
            - "CommunityProject.${proj}.version == 6   (create 1, submit 2, revision 3, amend 4, resubmit 5, approve 6)"
            - "CommunityProject.${proj}.approved_by_user_id == coord-a"

      - name: referral_return_reassign_loop
        grounds:
          - state_machines.DiagnosisReferral.IN_REVIEW_to_RETURNED
          - state_machines.DiagnosisReferral.RETURNED_to_OPEN
          - calculations.specialist_assignment_selector
        distinguishing_aspect: |
          Cyclic machine on DIAGNOSISREFERRAL (different entity than Volunteer
          and CommunityProject): OPEN -> IN_REVIEW -> RETURNED -> OPEN ->
          IN_REVIEW -> ANSWERED; the reassign hop must exclude the returning
          specialist (S1) from the candidate pool, so S2 is selected.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE staffed on help-desk shift 2026-08-05 09:00-12:00"
            - "Specialists S1 (PEST, cap 2, created first) and S2 (PEST, cap 2)"
            - "Inquiry TRIAGED with category PEST; referral auto-assigned to S1"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "POST /specialists", payload: { name: "Dr. Pest One", specialty: "PEST", max_concurrent_referrals: 2 }, as: ProgramCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /specialists", payload: { name: "Dr. Pest Two", specialty: "PEST", max_concurrent_referrals: 2 }, as: ProgramCoordinator, captures: { s2: "$.data.id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-08-05T09:00:00Z", end_time: "2026-08-05T12:00:00Z", capacity: 2 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /shifts/${sh}/inquiries", payload: { volunteer_id: "${vol}", subject: "Cucumber beetles", contact_name: "Resident One", details: "Striped beetles" }, as: Volunteer, as_user_id: "${vol}", captures: { inq: "$.data.id" } }
            - { call: "POST /inquiries/${inq}/triage", payload: { category: "PEST" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /inquiries/${inq}/referrals", payload: {}, as: ProgramCoordinator, captures: { ref: "$.data.id", first_spec: "$.data.specialist_id", due0: "$.data.due_at" } }
            - { call: "POST /diagnosis-referrals/${ref}/start-review", as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /diagnosis-referrals/${ref}/return", payload: { return_reason: "needs soil context" }, as: Specialist, as_user_id: "${s1}" }
            - { call: "POST /diagnosis-referrals/${ref}/reassign", payload: {}, as: ProgramCoordinator, captures: { second_spec: "$.data.specialist_id", due1: "$.data.due_at" } }
            - { call: "POST /diagnosis-referrals/${ref}/start-review", as: Specialist, as_user_id: "${s2}" }
            - { call: "POST /diagnosis-referrals/${ref}/answer", payload: { diagnosis_text: "Cucumber beetle; row cover" }, as: Specialist, as_user_id: "${s2}" }
          assert:
            - "captured first_spec == ${s1}   (tie on open_referral_count 0/0 breaks by created_at ASC)"
            - "captured second_spec == ${s2}   (last_specialist_id excluded from reassign pool)"
            - "DiagnosisReferral.${ref}.status == ANSWERED"
            - "DiagnosisReferral.${ref}.reassignment_count == 1"
            - "DiagnosisReferral.${ref}.answered_by_specialist_id == ${s2}"
            - "Inquiry.${inq}.status == CLOSED and resolution == SPECIALIST_DIAGNOSIS"
            - "Specialist.${s1}.returned_count == 1 and open_referral_count == 0"
            - "Specialist.${s2}.answered_count == 1 and open_referral_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth 4 and depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cycle_close_shortfall_four_hop_cascade
        grounds:
          - state_machines.ProgramCycle.RECERTIFICATION_to_CLOSED
          - state_machines.Volunteer.ACTIVE_to_INACTIVE
          - state_machines.ShiftSignup.SIGNED_UP_to_CANCELLED
          - state_machines.Shift.FULL_to_OPEN
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /program-cycles/{id}/close:
          cycle close -> record SHORTFALL -> volunteer ACTIVE->INACTIVE ->
          signup CANCELLED (deactivation cascade) -> shift FULL->OPEN with
          filled_count 1->0. Each hop is caused by the previous hop, not by the
          original call: the shift mutation only happens because the signup
          was cancelled, which only happens because the volunteer deactivated.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE with zero approved hours (certain SHORTFALL)"
            - "Shift 2026-12-05 09:00-12:00 capacity 1 with the volunteer SIGNED_UP -> shift FULL"
            - "Clock advanced to 2026-11-02 (>= recert_opens_at) and begin-recertification done"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /shifts", payload: { cycle_id: "${cyc}", kind: "HELP_DESK", location: "Desk A", start_time: "2026-12-05T09:00:00Z", end_time: "2026-12-05T12:00:00Z", capacity: 1 }, as: ProgramCoordinator, captures: { sh: "$.data.id" } }
            - { call: "POST /shifts/${sh}/signups", payload: { volunteer_id: "${vol}" }, as: Volunteer, as_user_id: "${vol}", captures: { su: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program-cycles/${cyc}/begin-recertification", as: ProgramCoordinator }
          trigger:
            - { call: "POST /program-cycles/${cyc}/close", as: ProgramCoordinator }
          assert:
            - "ProgramCycle.${cyc}.status == CLOSED"
            - "RecertificationRecord.${rec}.status == SHORTFALL"
            - "Volunteer.${vol}.status == INACTIVE and consecutive_shortfall_cycles == 1"
            - "ShiftSignup.${su}.status == CANCELLED   (hop 3: deactivation cascade, not the close call itself)"
            - "Shift.${sh}.status == OPEN and filled_count == 0   (hop 4: FULL->OPEN revert fired by the signup cancellation)"

      - name: project_close_voids_pending_entries
        grounds:
          - state_machines.CommunityProject.APPROVED_to_CLOSED
          - state_machines.CreditEntry.PENDING_to_VOIDED
          - calculations.credit_totals
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /projects/{id}/close):
          project close -> PENDING project-sourced entries VOIDED -> affected
          volunteers' record totals recompute (provisional drops 10.0 -> 6.0
          while official stays 6.0). The record recompute only happens because
          the entry voiding happened.
        test_recipe:
          setup:
            - "Cycle 2026 OPEN; volunteer ACTIVE with PENDING record"
            - "Project APPROVED by coord-a (estimated 10.0 -> cap 12.5)"
            - "Entries: PROJECT 6.0 APPROVED; PROJECT 4.0 PENDING -> provisional 10.0, official 6.0"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: "$.data.id" } }
            - { call: "POST /program-cycles/${cyc}/open", as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Alice Arbor", email: "alice@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app: "$.data.id" } }
            - { call: "POST /applications/${app}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app}/decide", payload: { decision: "ACCEPT" }, as: ProgramCoordinator }
            - { call: "GET /volunteers?application_id=${app}", as: ProgramCoordinator, captures: { vol: "$.data[0].id" } }
            - { call: "POST /training-enrollments", payload: { cycle_id: "${cyc}", volunteer_id: "${vol}" }, as: ProgramCoordinator, captures: { enr: "$.data.id" } }
            - { call: "POST /training-enrollments/${enr}/progress", payload: { modules_completed: 5, quiz_average: 85.0 }, as: ProgramCoordinator }
            - { call: "POST /training-enrollments/${enr}/complete", as: ProgramCoordinator }
            - { call: "GET /recertification-records?volunteer_id=${vol}&cycle_id=${cyc}", as: ProgramCoordinator, captures: { rec: "$.data[0].id" } }
            - { call: "POST /projects", payload: { cycle_id: "${cyc}", organizer_volunteer_id: "${vol}", title: "Tool Library", description: "Shed inventory", estimated_hours_per_volunteer: 10.0 }, as: Volunteer, as_user_id: "${vol}", captures: { proj: "$.data.id" } }
            - { call: "POST /projects/${proj}/submit", as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /projects/${proj}/approve", as: ProgramCoordinator, as_user_id: "coord-a" }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "PROJECT", activity_date: "2026-08-06", hours: 6.0, source_type: "PROJECT", source_id: "${proj}" }, as: Volunteer, as_user_id: "${vol}", captures: { e1: "$.data.id" } }
            - { call: "POST /credit-entries/${e1}/approve", as: ProgramCoordinator }
            - { call: "POST /volunteers/${vol}/credit-entries", payload: { cycle_id: "${cyc}", entry_kind: "SERVICE", activity_type: "PROJECT", activity_date: "2026-08-07", hours: 4.0, source_type: "PROJECT", source_id: "${proj}" }, as: Volunteer, as_user_id: "${vol}", captures: { e2: "$.data.id" } }
            - { call: "POST /recertification-records/${rec}/evaluate", as: ProgramCoordinator, captures: { pre_prov: "$.data.provisional_service_hours" } }
          trigger:
            - { call: "POST /projects/${proj}/close", as: ProgramCoordinator, as_user_id: "coord-b" }
            - { call: "GET /recertification-records/${rec}", as: ProgramCoordinator }
          assert:
            - "captured pre_prov == 10.0 before close"
            - "CommunityProject.${proj}.status == CLOSED"
            - "CreditEntry.${e2}.status == VOIDED   (hop 1)"
            - "CreditEntry.${e1}.status == APPROVED   (approved entries untouched)"
            - "RecertificationRecord.${rec}.provisional_service_hours == 6.0   (hop 2 recompute)"
            - "RecertificationRecord.${rec}.official_service_hours == 6.0"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (three different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: volunteer_state_beats_temporal_window
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (state, business_temporal): on POST /volunteers/{id}/credit-entries
          the volunteer is INACTIVE (priority 8) AND activity_date 2025-06-01 is
          outside the target cycle window (priority 11); the response must be
          ERR_VOLUNTEER_NOT_ACTIVE, proving state runs before temporal.
        test_recipe:
          setup:
            - "Cycle 2026 closed with the volunteer SHORTFALL -> volunteer INACTIVE"
            - "Cycle 2027 OPEN (posture check passes, isolating the state/temporal pair)"
          setup_api_calls:
