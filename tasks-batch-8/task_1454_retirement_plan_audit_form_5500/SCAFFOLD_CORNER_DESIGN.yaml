              payload: { expected_filing_version: "${fil_v_draft}", amendment_reason: "stale view" }
              as: TPASpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_STALE_FILING_VERSION\""
            - "HTTP status == 412"
            - "Form5500Filing.${fil}.status == \"ACCEPTED\""

      - name: posture_recovers_after_finding_verified_closed
        claim_type: derived_field_reconciliation
        grounds: [calculations.posture_rule]
        distinguishing_aspect: "Posture is re-derived on every mutation: BLOCKED while a HIGH finding is open, back to ON_TRACK once the correction chain reaches VERIFIED_CLOSED."
        test_recipe:
          setup: ["engagement 703 small plan; manual HIGH finding; full correction chain executed and verified; finding verified closed"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "703", plan_name: "Posture Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: true, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 500000, opening_balance_cents: 100000 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "NONDISCRIMINATION_FAILURE", severity: "HIGH", description: "ADP failure" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "CORRECTIVE_DISTRIBUTION", principal_cents: 5000, planned_execution_date: "2026-03-01", participant_id: "${p1}" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
            - call: "POST /plan-audit/corrective-actions/${ca}/approve"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: System
            - call: "POST /plan-audit/corrective-actions/${ca}/execute"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions/${ca}/verify"
              payload: {}
              as: PlanAuditor
          trigger:
            - call: "POST /plan-audit/findings/${f1}/verify_close"
              payload: {}
              as: PlanAuditor
            - call: "GET /plan-audit/engagements/${eng}"
              payload: {}
              as: Any
          assert:
            - "AuditFinding.${f1}.status == \"VERIFIED_CLOSED\""
            - "Engagement.${eng}.posture == \"ON_TRACK\""
            - "Participant.${p1}.account_balance_cents == 95000"

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.participant_count_determination, calculations.lost_earnings_on_late_deposit]
        excluded_because:
          difficulty_instance: dual_variant_calc / participant_count_standard_vs_80120_election
          rationale: "Both variants exercised with pinned literals in §1.8 (both domains)."

      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.LateContributionAssessment.ASSESSED_to_CONFIRMED, state_machines.NondiscriminationTestResult.COMPUTED_to_FINAL]
        excluded_because:
          difficulty_instance: transitive_cascade / late_deposit_confirm_cascade
          rationale: "Depth-4 cascades from two different triggers asserted end-to-end in §1.8."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_response_immediately_reflects_side_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Contribution]
        distinguishing_aspect: "The match response itself carries the updated contribution AND a subsequent GET of the statement in the same request sequence shows recomputed matched/unreconciled figures — no lag, no recompute endpoint needed."
        test_recipe:
          setup: ["engagement 801; participant; statement reporting 250000c; contribution of 250000c deposited in-period"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "801", plan_name: "Immediate Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 250000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-01-01", period_end: "2025-12-31", custodian: "National Trust Co", certification: "UNCERTIFIED", reported_deposit_total_cents: 250000 }
              as: SponsorAdmin
              captures: { ts: $.data.id }
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-20", amount_cents: 250000 }
              as: SponsorAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions/${c1}/match"
              payload: { trust_statement_id: "${ts}" }
              as: SponsorAdmin
            - call: "GET /plan-audit/trust-statements/${ts}"
              payload: {}
              as: Any
          assert:
            - "match response: Contribution.${c1}.match_status == \"MATCHED\" and trust_statement_id == ${ts}"
            - "TrustStatement.${ts}.matched_contribution_cents == 250000"
            - "TrustStatement.${ts}.unreconciled_deposit_cents == 0"
            - "Participant.${p1}.account_balance_cents == 250000"
