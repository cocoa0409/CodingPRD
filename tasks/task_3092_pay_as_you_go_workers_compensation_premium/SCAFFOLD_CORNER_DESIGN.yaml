              as: PayrollProvider
              captures: { cd_idm_rep: $.data.id }
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_idm_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "idm-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { cd_idm_replay: $.data.id }
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_idm_pol}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "idm-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 200000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 2}] }
