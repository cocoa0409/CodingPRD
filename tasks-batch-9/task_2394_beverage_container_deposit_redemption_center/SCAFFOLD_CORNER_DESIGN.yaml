              as: DistributorAgent
              as_user_id: "${dist_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "SUBMIT" }
              as: DistributorAgent
              as_user_id: "${dist_id}"
            - call: "POST /beverage-products/${prod_id}/registration-actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redemption-visits"
              payload: { site_type: "CENTER", channel: "HAND_COUNT", center_id: "${center_id}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { visit_id: $.data.id, visit_v1: $.data.version }
          trigger:
            - call: "POST /redemption-visits/${visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 10, out_of_state_marked_quantity: 6, contaminated_quantity: 5, expected_visit_version: "${visit_v1}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { e_bad: $.data.error_id }
            - call: "POST /redemption-visits/${visit_id}/lots"
              payload: { product_id: "${prod_id}", presented_quantity: 10, out_of_state_marked_quantity: 6, contaminated_quantity: 4, expected_visit_version: "${visit_v1}" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { lot_id: $.data.id }
          assert:
            - "the first trigger response has status 422 and $.data.error_id == ERR_LOT_QUANTITY_INCONSISTENT"
            - "after the first trigger RedemptionVisit.${visit_id}.count_status == OPEN and version == ${visit_v1}"
            - "the second trigger response has status 201 with ContainerLot.${lot_id}.accepted_quantity == 0 and reject_reason == MIXED"
            - "RedemptionVisit.${visit_id}.presented_total == 10, out_of_state_marked_total == 6, raw_accepted_count == 0"

