      - name: compliance_sweep_is_a_no_op_bulk_action_when_nothing_is_due
        claim_type: bulk_action
        grounds:
          - endpoints.POST_tdr__ops_compliance-sweep
          - state_machines.MonitoringInspection.CURE_PENDING_to_ESCALATED
          - entities.MonitoringInspection.fields.status
        distinguishing_aspect: "The sweep is a whole-program bulk action with no request body and a null output, so its only observable behaviour is what it changes. Run against a program whose single inspection is COMPLIANT (already CLOSED, no cure_deadline at all), it must change nothing and still return 200 — a naive implementation that escalates every non-CURED inspection, or that trips over a null cure_deadline, fails here."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST; parcel APN-001 severed for 22 units and certified -> easement recorded"
            - "one COMPLIANT inspection recorded on 2026-08-10 (status CLOSED, severity 0.00, cure_deadline null)"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
