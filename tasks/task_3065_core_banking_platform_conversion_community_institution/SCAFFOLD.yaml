    input: [project_id, title, severity, "linked_system_id?"]
    output: Defect
    side_effects: ["status OPEN", "opened_at := clock now", "sla_deadline per severity"]
  - method: GET
    path: "/api/v1/defects"
    description: "List defects"
    roles: [ProjectManager, OperationsLead, VendorTriageLead, FinanceController]
    code: 200
    input: [project_id, "status?", "severity?", "linked_system_id?", "limit?", "offset?"]
    output: "Defect[]"
    side_effects: []
  - method: GET
    path: "/api/v1/defects/{did}"
    description: "Get a defect"
    roles: [ProjectManager, OperationsLead, VendorTriageLead, FinanceController]
    code: 200
    input: []
    output: Defect
    side_effects: []
  - method: POST
    path: "/api/v1/defects/{did}/triage"
    description: "Triage an OPEN defect (segregation of duties: reporter cannot triage)"
    roles: [VendorTriageLead]
    code: 200
    input: []
    output: Defect
    side_effects: ["status -> TRIAGED", "triage_priority computed"]
  - method: POST
    path: "/api/v1/defects/{did}/start-fix"
    description: "Move a triaged defect into fix"
    roles: [VendorTriageLead]
    code: 200
    input: []
    output: Defect
    side_effects: ["status -> IN_FIX"]
  - method: POST
    path: "/api/v1/defects/{did}/reject-fix"
    description: "Reject the fix; defect returns to OPEN retaining its triage_priority"
    roles: [VendorTriageLead]
    code: 200
