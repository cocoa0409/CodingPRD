# =============================================================================
# PRD Benchmark Seed Tables — Powersports Dealer & Service
# Difficulty tier: Expert (§0.4)
# =============================================================================

scenario: |
  338. Powersports Dealer & Service (motorcycle/ATV): unit inventory (VIN) & floor
  plan, sales & financing, trade-in, service RO & flat-rate, parts/accessories,
  seasonal prep & storage, warranty/recall, test-ride waiver

domain_name: powersports-dealer-service
api_prefix: ""   # flat topology: all entities are top-level peer collections at the API root

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FK fields in request/response bodies; no nested URL
  # ownership chains. Every FK is discoverable via a filtered-list GET.

  state_machine_shape: parallel
  # Deal carries a cyclic re-quote loop; RepairOrder carries two independent
  # state dimensions (work_status x billing_status); FloorPlanLoan and
  # StorageAgreement add linear-with-revert lifecycles.

  relationship_patterns:
    - one_to_many        # Deal -> ServiceLine? no; Customer -> Deal; RepairOrder -> ServiceLine
    - cross_aggregate    # Deal references Unit + TradeIn + FloorPlanLoan across aggregates
    - polymorphic        # WarrantyClaim.subject_kind references Unit (sale) or RepairOrder (recall labor)

  role_model: peer_roles
  # SalesManager, ServiceAdvisor, PartsClerk, FinanceManager each own distinct
  # resource types; DealerPrincipal has override authority on fiscal gates.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per dealer" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  # ---------------------------------------------------------------------------
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: vin, type: string, source: input, description: "17-char VIN; unique across all Units", constraints: "length == 17, uppercase alphanumeric" }
      - { name: category, type: enum, source: input, description: "MOTORCYCLE | ATV | UTV | PWC | SNOWMOBILE" }
      - { name: model_year, type: integer, source: input, description: "4-digit model year", constraints: ">= 2000" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents", constraints: ">= 0" }
      - { name: dealer_cost_cents, type: integer, source: input, description: "Dealer invoice cost in cents (floor-plan advance basis)", constraints: ">= 0" }
      - { name: acquisition_kind, type: enum, source: input, default: "NEW_FLOORED", description: "NEW_FLOORED (floor-plan financed) | TRADE_IN (entered via accepted trade) | CASH_OWNED" }
      - { name: status, type: enum, source: system, description: "Inventory lifecycle: IN_TRANSIT | IN_STOCK | ON_HOLD | SOLD | DELIVERED", constraints: "set by Unit state machine" }
      - { name: floor_plan_loan_id, type: string, source: system, description: "FK -> FloorPlanLoan.id; set when a floor plan is opened for this NEW_FLOORED unit, else null" }
      - { name: held_by_deal_id, type: string, source: system, description: "FK -> Deal.id; set while status==ON_HOLD, cleared on deal decline/cancel" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  # ---------------------------------------------------------------------------
  - name: FloorPlanLoan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the floored unit (1:1)" }
      - { name: original_advance_cents, type: integer, source: system, description: "Principal advanced at open == Unit.dealer_cost_cents", constraints: ">= 0" }
      - { name: principal_outstanding_cents, type: integer, source: computed, description: "original_advance_cents - sum(curtailment principal applied)", constraints: ">= 0" }
      - { name: cumulative_curtailment_cents, type: integer, source: computed, description: "Sum of principal applied across all POSTED curtailments" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Interest accrued per accrual variant; see calc floor_plan_interest" }
      - { name: opened_on, type: datetime, source: input, description: "Floor-plan open date (interest accrues from here)" }
      - { name: apr_bps, type: integer, source: input, description: "Annual rate in basis points (e.g., 900 = 9.00%)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CURTAILMENT_DUE | PAID_OFF", constraints: "set by FloorPlanLoan state machine" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  # ---------------------------------------------------------------------------
  - name: Curtailment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: floor_plan_loan_id, type: string, source: input, description: "FK -> FloorPlanLoan.id; the loan curtailed" }
      - { name: principal_cents, type: integer, source: input, description: "Principal paydown amount in cents", constraints: "> 0" }
      - { name: reason, type: enum, source: input, default: "SCHEDULED", description: "SCHEDULED (90-day due) | SALE_PAYOFF (full payoff on delivery) | VOLUNTARY" }
      - { name: status, type: enum, source: system, description: "POSTED only; Curtailments are append-only ledger records, always POSTED on create (no reversal flow exists)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; chronological application order key for the declining-interest segment walk (created_at ASC)" }

  # ---------------------------------------------------------------------------
  - name: Deal
