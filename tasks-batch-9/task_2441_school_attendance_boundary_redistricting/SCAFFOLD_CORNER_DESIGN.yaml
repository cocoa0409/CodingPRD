  - name: version_increments_on_every_write_and_never_on_a_read
    claim_type: optimistic_concurrency
    grounds:
    - entities.BoundaryStudy.common_fields
    - entities.School.common_fields
    - entities.AreaAdjacency.common_fields
    - endpoints[PATCH /redistricting/schools/{id}]
    - endpoints[POST /redistricting/studies/{id}/lock-data]
    distinguishing_aspect: 'The version counter is the substrate the three concurrency rules stand on, so it is pinned directly: a study is created at 1 and reaches 2 only through lock-data, reads in between change nothing, a school moves 1 to 2 on a PATCH, and AreaAdjacency - declared with common_fields false - exposes no version field at all.'
    test_recipe:
      setup:
      - The database is empty; the Riverbend study is created with two ACTIVE schools, three planning areas and two authored adjacencies, all in SETUP.
      - The seed inventory satisfies every lock-data precondition, so the lock will succeed and is the only mutation of the study in this test.
      - Cedar Elementary has not been modified since creation, so its version is 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
