              payload: { attestation_note: "Round 1 package" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/return-for-info"
              payload: { info_request_note: "Provide audited call report" }
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Round 2 package with call report" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/return-for-info"
              payload: { info_request_note: "Provide liquidity attestation" }
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Round 3 package with liquidity attestation" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/return-for-info"
              payload: { info_request_note: "Provide collateral custody letter" }
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Round 4 package" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
              captures: { round_limit_error: $.data.error_id }
          assert:
            - "After the first attest: QualificationReview.${qr_id}.status == ATTESTED, round_count == 1, attested_by_user_id == compliance-1"
            - "After begin-review: QualificationReview.${qr_id}.status == UNDER_REVIEW and Depository.${dep_id}.approval_status == UNDER_REVIEW"
            - "After return-for-info: QualificationReview.${qr_id}.status == RETURNED_FOR_INFO and attested_by_user_id == null"
            - "After the second attest: status == ATTESTED and round_count == 2"
            - "After the third attest: status == ATTESTED and round_count == 3"
            - "The fourth attest returns HTTP 409 with ${round_limit_error} == ERR_ROUND_LIMIT_REACHED; round_count stays 3 and status stays RETURNED_FOR_INFO"
            - "Depository.${dep_id}.approval_status is still UNDER_REVIEW (the loop cannot silently approve the bank)"
            - "The same cycle traversed with attester == officer-1 would instead return ERR_SEGREGATION_OF_DUTIES, so the loop is not a way around the two-person rule"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: depository_suspension_depth4_cascade_to_runoff_forecast
        grounds:
          - state_machines.Depository.APPROVED_to_SUSPENDED
          - state_machines.DepositAccount.FUNDED_to_RESTRICTED
          - state_machines.RunoffForecast.OPEN_to_STALE
          - entities.PublicUnit.fields.exposure_status
          - entities.RunoffForecast.fields.requires_reforecast
        distinguishing_aspect: |
          One POST /depositories/{id}/suspend propagates four hops — Depository.approval_status SUSPENDED
          -> DepositAccount.funding_status RESTRICTED with restricted_reason DEPOSITORY_SUSPENDED ->
