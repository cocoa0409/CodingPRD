      - name: a_request_missing_the_x_user_id_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[1].ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
          - endpoints[GET /shore-excursions/ports/{portId}]
        distinguishing_aspect: |
          Identity resolution precedes everything, so a read of a port that really exists still
          returns 401 when the caller sends no X-User-ID header - it does not fall through to 200
          or to a 404.
        test_recipe:
          setup:
            - "One port COZ exists and is readable by every role."
            - "The trigger request deliberately omits the X-User-ID header, which is why the call carries no as_user_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
          trigger:
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: ShoreExcursionDesk
              captures: { err_id: $.data.error_id }
          assert:
            - "the read returns HTTP 401"
            - "data.error_id == ERR_UNAUTHENTICATED"
            - "the response body contains no Port fields"

