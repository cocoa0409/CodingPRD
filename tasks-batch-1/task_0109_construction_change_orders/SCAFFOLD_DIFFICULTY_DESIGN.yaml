  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_segregation_on_certify
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: >
          Category pair state (priority 5) vs business_safety (priority 6): a
          certify on an app that is still DRAFT AND carried by its own submitter
          violates both; the lower-priority state check wins, returning
          ERR_INVALID_STATE, not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Project + SOV created; PayApplication 1 created DRAFT with one line; never submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "PrioP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE  (state priority 5 beats business_safety segregation priority 6, even though X-User-ID gc-1 equals the would-be submitter)"

      - name: overbilling_beats_balance_unrelated_pair
        grounds:
          - validations[priority=12]
          - validations[priority=7]
          - errors[ERR_OVERBILLING]
          - errors[ERR_NONSEQUENTIAL_APPLICATION]
        distinguishing_aspect: >
          A different error-category pair: business_temporal sequencing
          (priority 7, evaluated at pay-app CREATE) vs business_fiscal
          overbilling (priority 12, evaluated at SUBMIT). The two checks fire on
          different endpoints in the lifecycle; this instance asserts the submit
          path returns business_fiscal ERR_OVERBILLING when a line overbills,
          distinct from the create-path temporal error.
        test_recipe:
          setup:
            - "Project + SOV 001 sched 600000 created; PayApplication 1 created (ev 1) with a single line billing 600001 this period (overbills by 1)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "OverP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 600001, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
          trigger:
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_OVERBILLING  (business_fiscal; 600001 > 600000 scheduled)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overbilling_boundary_equal_ok_plus_one_fails
        grounds:
          - validations[priority=12]
          - entities.SovLine.fields.scheduled_value_cents
          - state_machines.PayApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: >
          Numeric threshold metric on POST /pay-applications/{id}/submit:
