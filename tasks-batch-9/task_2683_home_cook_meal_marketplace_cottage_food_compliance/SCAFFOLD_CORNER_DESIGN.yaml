          - validations[priority=20].ERR_ORDER_NOT_REFUNDABLE
          - validations[priority=47].ERR_REFUND_EXCEEDS_REMAINING
          - state_machines.Order.payment_status.CAPTURED_to_REFUNDED
        distinguishing_aspect: >
          The refundability rule (20) is evaluated before the amount rule (47), so an over-sized refund
          against an un-captured order reports ERR_ORDER_NOT_REFUNDABLE. The amount rule owns both of
          its bounds, and a refund of exactly the remaining amount is admitted and flips the payment
          dimension to the terminal REFUNDED, after which the order is refundable no longer.
