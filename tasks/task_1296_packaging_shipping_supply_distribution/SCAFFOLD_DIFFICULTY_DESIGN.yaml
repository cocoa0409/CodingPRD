  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: ship_freight_recompute_receivable_chain
        grounds:
          - state_machines.Order.STOCK_RESERVED_to_SHIPPED
          - calculations.calc_freight_and_oversize
          - calculations.calc_open_receivable
        distinguishing_aspect: |
          Depth-3 cascade from the SHIP trigger: ship (A) mutates lines and
          forces the final freight recompute on the Order (B), whose changed
          grand_total_cents itself forces a recomputation of the Account's
          open_receivable_cents (C) — the account mutation is caused by the
          order mutation, not directly by ship.
        test_recipe:
          setup:
            - "Warehouse ATL zone 2; CORPORATE account; stock product class 70 (density 20), 10 lbs/unit, inventory 500; order ship_zone 5 line qty 100 submitted (STOCK_RESERVED, provisional freight 163680, receivable 263680)"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 500 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 100 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_before: $.data.open_receivable_cents }
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/ship"
              payload: {}
              as: WarehouseOps
              captures: { freight_after: $.data.freight_estimate_cents, grand_after: $.data.grand_total_cents }
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_after: $.data.open_receivable_cents }
            - call: "GET /packaging-distribution/inventory"
              payload: {}
              as: WarehouseOps
              captures: { inv_onhand: "$.data[0].on_hand_qty", inv_reserved: "$.data[0].reserved_qty" }
          assert:
            - "Account.open_receivable_cents == 263680 before ship (captured ${rec_before}: grand 100000 + 163680 provisional)"
            - "Order.freight_estimate_cents == 148800 after ship (captured ${freight_after}: final variant drops 1.10 uplift)"
            - "Order.grand_total_cents == 248800 after ship (captured ${grand_after})"
            - "Account.open_receivable_cents == 248800 after ship (captured ${rec_after}) — hop C reflects hop B exactly"
            - "Inventory on_hand_qty == 400 and reserved_qty == 0 after ship (captured ${inv_onhand}, ${inv_reserved})"

      - name: cancel_release_fires_restock_notification
        grounds:
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.RestockNotification.ACTIVE_to_NOTIFIED
        distinguishing_aspect: |
          Depth-3 cascade from the CANCEL trigger (different from the sibling's
          SHIP trigger): cancel (A) releases the reservation on Inventory (B),
          whose available_qty rising across reorder_point_qty itself fires the
          RestockNotification ACTIVE -> NOTIFIED (C).
        test_recipe:
          setup:
            - "Warehouse ATL; CORPORATE account; stock product with Inventory on_hand 10, reorder_point_qty 5; ACTIVE restock subscription for (account, product); order qty 6 submitted -> reserved 6, available 4 (below reorder point)"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "TP-100", name: "Packing Tape", category: "TAPE", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 10, reorder_point_qty: 5 }
              as: WarehouseOps
              captures: { inv: $.data.id }
            - call: "POST /packaging-distribution/restock-notifications"
              payload: { account_id: "${acct}", product_id: "${prod}" }
              as: Buyer
              as_user_id: "${acct}"
              captures: { notif: $.data.id }
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 6 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_status: $.data.status, ord_invoice: $.data.invoice_status }
            - call: "GET /packaging-distribution/restock-notifications/${notif}"
              payload: {}
              as: PlatformAdmin
              captures: { notif_status: $.data.status, notif_at: $.data.notified_at }
            - call: "GET /packaging-distribution/inventory/${inv}"
              payload: {}
              as: WarehouseOps
              captures: { inv_reserved: $.data.reserved_qty, inv_avail: $.data.available_qty }
            - call: "GET /packaging-distribution/accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_after: $.data.open_receivable_cents }
          assert:
            - "RestockNotification.${notif}.status == NOTIFIED (captured ${notif_status}) — fired by the reservation-release crossing 4 -> 10 >= 5"
            - "RestockNotification.${notif}.notified_at == 2026-08-03T10:00:00Z (captured ${notif_at})"
            - "Inventory.${inv}.reserved_qty == 0 and available_qty == 10 (captured ${inv_reserved}, ${inv_avail})"
            - "Order.${ord}.status == CANCELLED and invoice_status == VOID (captured ${ord_status}, ${ord_invoice})"
            - "Account.open_receivable_cents == 0 after cancel (captured ${rec_after})"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_account_outranks_missing_po
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair state-vs-business_constraint: one submit violates
          both ERR_ACCOUNT_SUSPENDED (p5, state) and ERR_PO_REQUIRED (p7,
          business_constraint); the state error must win. Pair differs from the
          sibling instance's state-vs-business_fiscal.
        test_recipe:
          setup:
            - "CORPORATE account po_required=true, SUSPENDED; stock product inventory 100; DRAFT order with one line and NO po_number"
          setup_api_calls:
            - call: "POST /packaging-distribution/warehouses"
              payload: { code: "ATL", name: "Atlanta DC", zone: 2, ship_cutoff_time: "15:00", timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { wh_atl: $.data.id }
            - call: "POST /packaging-distribution/accounts"
              payload: { company_name: "Acme Corp", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL", po_required: true }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /packaging-distribution/products"
              payload: { sku: "BX-100", name: "12x12x12 Box", category: "BOXES", base_price_cents: 1000, uom: "EACH", case_qty: 1, pallet_qty: 500, weight_lbs_per_unit: 10, density_pcf: 20 }
              as: CatalogManager
              captures: { prod: $.data.id }
            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_atl}", on_hand_qty: 100 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/accounts/${acct}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /packaging-distribution/orders/${ord}/submit"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { err_1: $.data.error_id }
            - call: "POST /packaging-distribution/accounts/${acct}/reactivate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders/${ord}/submit"
