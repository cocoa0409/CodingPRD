            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { st_inuse: $.data.status } }
          trigger:
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { st_dirty: $.data.status } }
            - { call: "GET /transport/cleaning-tasks", payload: { equipment_asset_id: "${a1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct: "$.data[0].id", ct_type: "$.data[0].task_type" } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "IN_PROGRESS" }, as: HousekeepingStaff, as_user_id: "hk-1" }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { st_cleaning: $.data.status } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "AWAITING_VERIFICATION" }, as: HousekeepingStaff, as_user_id: "hk-1" }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "VERIFIED" }, as: TransportSupervisor, as_user_id: "sup-1" }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { st_final: $.data.status, st_contam: $.data.isolation_contaminated } }
          assert:
            - "asset status after PICKUP (${st_inuse}) == IN_USE"
            - "asset status after COMPLETE (${st_dirty}) == AWAITING_CLEANING and CleaningTask.task_type == STANDARD"
            - "asset status during cleaning (${st_cleaning}) == IN_CLEANING"
            - "asset status after VERIFY (${st_final}) == AVAILABLE (cycle closed) and isolation_contaminated == false"

      - name: request_decline_requeue_cycle
        grounds:
          - state_machines.TransportRequest.QUEUED_to_ASSIGNED
          - state_machines.TransportRequest.ASSIGNED_to_QUEUED
          - state_machines.DispatchOffer.PENDING_to_DECLINED
        distinguishing_aspect: |
          TransportRequest cycles QUEUED -> ASSIGNED -> QUEUED via offer-decline and transporter
          RELEASE (two distinct re-entry paths into QUEUED on the same entity) — a cyclic machine
          on TransportRequest, a different entity from EquipmentAsset.
        test_recipe:
          setup:
            - "Locations HUB, W4, IMG; edges 8/12 and 10/16; T1 and T2 both WHEELCHAIR ON_SHIFT; asset WC-001"
            - "R1 QUEUED; offer to T1 declined (T1 excluded, auto-offer to T2 created by cascade)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
