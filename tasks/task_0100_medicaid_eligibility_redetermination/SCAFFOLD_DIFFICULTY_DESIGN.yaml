              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
