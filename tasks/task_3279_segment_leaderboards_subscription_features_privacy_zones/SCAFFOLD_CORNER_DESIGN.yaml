            - "duplicate_of_id == the canonical activity id ${act_du1}"

      - name: membership_pending_to_active_on_approve
        claim_type: valid_transition
        grounds: [state_machines.ClubMembership]
        distinguishing_aspect: "APPROVAL-policy club: a join parks PENDING; the owner-admin's approve transition moves it to ACTIVE."
        test_recipe:
