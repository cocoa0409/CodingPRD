scenario: "Concrete & Paving Contractor: project scope & cubic-yard/sq-ft estimate, mix/material order & schedule, crew & equipment, weather/cure window, permit, change order, deposit/progress draw, warranty"
domain_name: concrete-paving-contractor
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - temporal_windowing
  entity_topology: hybrid
  # Project is the aggregate root; Estimate / MaterialOrder / Permit / ChangeOrder /
  # Draw / Warranty / FlatworkSegment hang off it by FK. Crew and Equipment are flat
  # peer resource pools that CrewAssignment links across the tree (cross-cutting
  # association). WeatherReading is a sub-event under MaterialOrder.
  state_machine_shape: branching
  # Project is branching with revert (DRAFT -> ESTIMATING -> {APPROVED | REJECTED},
  # APPROVED -> SCHEDULED -> POURED -> CURING -> COMPLETED, plus ON_HOLD revert loop).
  # ChangeOrder is cyclic (SUBMITTED -> UNDER_REVIEW -> {APPROVED | REJECTED | REVISION_REQUESTED -> SUBMITTED}).
  relationship_patterns:
    - one_to_many       # Project -> FlatworkSegment / ChangeOrder / Draw / MaterialOrder
    - cross_aggregate   # CrewAssignment references both Project and Crew/Equipment pools
    - many_to_many      # CrewAssignment is the junction between Project and Crew, and between Project and Equipment
  role_model: segregation_of_duties
  # Estimator drafts scope + estimate; ProjectManager approves estimate, schedules,
  # advances pour lifecycle; FinanceOfficer approves change orders and releases draws
  # (the person who approves a change order cannot be the same person who released the
  # deposit draw — segregation enforced via X-User-ID). Inspector closes permits and
  # files warranty defect claims.
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only, never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation; OCC token."
      - name: site_name
        type: string
        source: input
        description: "Job-site label."
      - name: client_name
        type: string
        source: input
        description: "Client display name."
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state."
        default: DRAFT
        constraints: "One of {DRAFT, ESTIMATING, APPROVED, REJECTED, SCHEDULED, POURED, CURING, COMPLETED, ON_HOLD}."
      - name: status_before_hold
        type: enum
        source: system
        description: "Snapshot of status captured when the project entered ON_HOLD, used to restore on resume; null otherwise."
        default: null
        constraints: "Null unless status == ON_HOLD."
      - name: base_contract_amount
        type: number
        source: computed
        description: "Snapshot of the approved Estimate.estimate_total at the APPROVE_ESTIMATE transition; 0.00 until an estimate is approved. 2 dp."
        default: 0
      - name: provisional_contract_value
        type: number
        source: computed
        description: "base_contract_amount + sum of ChangeOrder.delta_amount for change orders whose status IN {UNDER_REVIEW, APPROVED}; forward-looking variant. 2 dp."
        default: 0
      - name: committed_contract_value
        type: number
        source: computed
        description: "base_contract_amount + sum of ChangeOrder.delta_amount for change orders whose status == APPROVED, summed in created_at ASC order; chronological/committed variant. 2 dp."
        default: 0
      - name: total_drawn_amount
        type: number
        source: computed
        description: "Sum of Draw.amount for draws whose status == RELEASED. 2 dp."
        default: 0
      - name: warranty_risk_score
        type: integer
        source: computed
        description: "Quality-risk score in [0,100]; recomputed on cure-window and weather side effects and on each defect claim (see calculations.warranty_risk_score)."
        default: 0
      - name: approved_estimate_id
        type: string
        source: system
        description: "Forward pointer to the version-pinned Estimate snapshot locked at APPROVE_ESTIMATE (discover the estimate via GET /projects/{id}/estimates); null before approval. Not a parent FK."
        default: null

  - name: FlatworkSegment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: label
        type: string
        source: input
        description: "Segment label, e.g. driveway, patio."
      - name: area_sqft
        type: number
        source: input
        description: "Plan area in square feet; must be > 0."
        constraints: "> 0"
      - name: thickness_in
        type: number
        source: input
        description: "Slab thickness in inches; must be > 0."
        constraints: "> 0"
      - name: finish_grade
        type: enum
        source: input
        description: "Surface finish driving the labor finish multiplier."
        constraints: "One of {BROOM, EXPOSED_AGGREGATE, STAMPED}."
        default: BROOM
      - name: reinforcement
        type: enum
        source: input
        description: "Reinforcement type driving the per-sqft reinforcement add and warranty risk."
        constraints: "One of {NONE, MESH, REBAR}."
        default: NONE

  - name: Estimate
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: provisional_cubic_yards
        type: integer
        source: computed
        description: "Whole cubic yards from the sum-then-ceil variant (see calculations.estimate_cubic_yards)."
      - name: total_sqft
        type: number
        source: computed
        description: "Sum of area_sqft over the project's FlatworkSegments at estimate creation. 2 dp."
      - name: labor_subtotal
        type: number
        source: computed
        description: "Tiered labor cost after finish multiplier and reinforcement add, rounded to cents (see calculations.estimate_total). 2 dp."
      - name: material_subtotal
        type: number
        source: computed
        description: "provisional_cubic_yards * MIX_RATE_PER_CY, rounded to cents. 2 dp."
      - name: estimate_total
        type: number
        source: computed
        description: "round(labor_subtotal,2) + round(material_subtotal,2); the round-per-line-item-then-sum order is pinned. 2 dp."
      - name: status
        type: enum
        source: system
        description: "Estimate lifecycle."
        default: DRAFT
        constraints: "One of {DRAFT, APPROVED, SUPERSEDED}."

  - name: Permit
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: jurisdiction
        type: string
        source: input
        description: "Issuing authority name."
      - name: permit_number
        type: string
        source: input
        description: "Authority-issued permit number."
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle."
        default: APPLIED
        constraints: "One of {APPLIED, ISSUED, CLOSED, REVOKED}."

  - name: MaterialOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: mix_type
        type: enum
        source: input
        description: "Concrete mix driving cure_hours."
        constraints: "One of {STANDARD, HIGH_EARLY, FIBER}."
      - name: order_cubic_yards
        type: integer
        source: computed
        description: "Whole cubic yards from the per-segment-ceil-quarter-then-sum-then-ceil variant (see calculations.material_order_cubic_yards), snapshotted at order placement."
      - name: pour_scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC scheduled pour start instant."
      - name: pour_duration_hours
        type: number
        source: input
        description: "Planned pour duration in hours; must be > 0."
        constraints: "> 0"
      - name: pour_completed_at
        type: datetime
        source: system
        description: "Set when the pour is marked complete; null until then."
        default: null
      - name: cure_window_end
        type: datetime
        source: computed
        description: "pour_completed_at + cure_hours(mix_type); null until pour completed."
        default: null
      - name: status
        type: enum
        source: system
        description: "Material order lifecycle."
        default: ORDERED
        constraints: "One of {ORDERED, POURING, POURED, CANCELLED}."

  - name: WeatherReading
    parent: MaterialOrder
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix; identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: material_order_id
        type: string
        source: input
        description: "FK -> MaterialOrder.id; the pour this reading is appended to."
      - name: reading_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the reading applies to."
      - name: temp_f
        type: number
        source: input
        description: "Ambient temperature in Fahrenheit."
      - name: precip_pct
        type: number
        source: input
        description: "Chance/intensity of precipitation, 0..100."
        constraints: "0 <= precip_pct <= 100"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_name
        type: string
        source: input
        description: "Crew display name."
      - name: skill
        type: enum
        source: input
        description: "Primary crew skill."
        constraints: "One of {FLATWORK, FINISHING, PAVING}."
      - name: headcount
        type: integer
        source: input
        description: "Number of workers; must be >= 1."
        constraints: ">= 1"

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - name: asset_name
        type: string
        source: input
        description: "Equipment display name."
      - name: asset_type
        type: enum
        source: input
        description: "Equipment category."
        constraints: "One of {PUMP_TRUCK, POWER_TROWEL, SCREED, MIXER}."

  - name: CrewAssignment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project the crew/equipment is booked for."
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; the booked crew."
      - name: equipment_id
        type: string
        source: input
        description: "FK -> Equipment.id; the booked equipment (optional). Null when no equipment is reserved."
        default: null
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC booking window start (half-open [start, end))."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC booking window end; must be strictly after window_start."
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle."
        default: BOOKED
        constraints: "One of {BOOKED, RELEASED}."

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: description
        type: string
        source: input
        description: "What the change covers."
      - name: delta_amount
        type: number
        source: input
        description: "Signed contract delta in dollars (positive = add, negative = deduct). 2 dp."
      - name: delta_sqft
        type: number
        source: input
        description: "Signed change to total scope square footage applied to the project on approval. 2 dp."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Change-order lifecycle (cyclic via REVISION_REQUESTED)."
        default: SUBMITTED
        constraints: "One of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who submitted/last revised it; used for segregation-of-duties check against draw releases."

  - name: Draw
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: draw_type
        type: enum
        source: input
        description: "Kind of draw."
        constraints: "One of {DEPOSIT, PROGRESS, FINAL}."
      - name: amount
        type: number
        source: input
        description: "Requested draw amount in dollars; must be > 0. 2 dp."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Draw lifecycle."
        default: REQUESTED
        constraints: "One of {REQUESTED, RELEASED, VOIDED}."
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceOfficer who released it; null until RELEASED."
        default: null

  - name: Warranty
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning project."
      - name: term_months
        type: integer
        source: input
        description: "Warranty term in months; must be >= 1."
        constraints: ">= 1"
      - name: defect_claims_count
        type: integer
        source: computed
        description: "Count of defect claims filed against this warranty; starts at 0, increments on each FILE_CLAIM."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Warranty lifecycle."
        default: ACTIVE
        constraints: "One of {ACTIVE, CLAIM_OPEN, VOID}."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ESTIMATING
        trigger: "POST /projects/{id}/estimates"
        actor: Estimator
        preconditions:
          - "Project.status == DRAFT"
          - "Project has >= 1 FlatworkSegment"
        side_effects:
          - "Creates an Estimate in DRAFT; computes Estimate.total_sqft, provisional_cubic_yards, labor_subtotal, material_subtotal, estimate_total (calculations.estimate_cubic_yards, calculations.estimate_total)"
          - "Sets Project.status = ESTIMATING"
          - "increments Project.version by 1"
        note: "First estimate moves DRAFT->ESTIMATING; later estimates while ESTIMATING supersede the prior DRAFT estimate (see Estimate machine) without changing Project.status."
      - from: ESTIMATING
        to: APPROVED
        trigger: "POST /projects/{id}/approve-estimate"
        actor: ProjectManager
        preconditions:
          - "Project.status == ESTIMATING"
          - "request.expected_project_version == Project.version (OCC)"
          - "The Estimate named by estimate_id belongs to this project and is in status DRAFT"
        side_effects:
          - "Sets Estimate.status = APPROVED; supersedes any other DRAFT estimate on the project (status -> SUPERSEDED)"
          - "Sets Project.approved_estimate_id = estimate_id; Project.base_contract_amount = Estimate.estimate_total"
          - "Recomputes Project.provisional_contract_value and Project.committed_contract_value (calculations.provisional_contract_value, calculations.committed_contract_value)"
          - "Sets Project.status = APPROVED"
          - "increments Project.version by 1"
      - from: ESTIMATING
        to: REJECTED
        trigger: "POST /projects/{id}/reject"
        actor: ProjectManager
        preconditions:
          - "Project.status == ESTIMATING"
        side_effects:
          - "Sets Project.status = REJECTED (terminal)"
          - "Sets every DRAFT Estimate on the project to SUPERSEDED"
          - "increments Project.version by 1"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /projects/{id}/schedule"
        actor: ProjectManager
        preconditions:
          - "Project.status == APPROVED"
          - "Project has a Permit in status ISSUED"
          - "Project has >= 1 MaterialOrder in status ORDERED"
          - "Project has >= 1 CrewAssignment in status BOOKED"
        side_effects:
          - "Sets Project.status = SCHEDULED"
          - "increments Project.version by 1"
        note: "Cross-entity guard: schedule blocked unless permit is ISSUED AND a material order and crew booking exist."
      - from: SCHEDULED
        to: POURED
        trigger: "POST /material-orders/{id}/complete-pour"
        actor: ProjectManager
        preconditions:
          - "Project.status == SCHEDULED"
          - "MaterialOrder.status == POURING"
        side_effects:
          - "Sets MaterialOrder.pour_completed_at = request.completed_at; MaterialOrder.status = POURED"
          - "Sets MaterialOrder.cure_window_end = pour_completed_at + cure_hours(mix_type) (calculations.cure_window_end)"
          - "Sets Project.status = POURED"
          - "increments Project.version by 1; increments MaterialOrder.version by 1"
        note: "MaterialOrder POURING->POURED bubbles up to Project SCHEDULED->POURED."
      - from: POURED
        to: CURING
        trigger: "POST /projects/{id}/begin-cure"
        actor: ProjectManager
        preconditions:
          - "Project.status == POURED"
          - "The project's poured MaterialOrder has a non-null cure_window_end"
        side_effects:
          - "Sets Project.status = CURING"
          - "increments Project.version by 1"
      - from: CURING
        to: COMPLETED
        trigger: "POST /projects/{id}/complete"
        actor: ProjectManager
        preconditions:
          - "Project.status == CURING"
          - "current_utc >= MaterialOrder.cure_window_end for the poured order"
          - "Project has a Warranty in status ACTIVE"
        side_effects:
          - "Sets Project.status = COMPLETED (terminal)"
          - "Releases every CrewAssignment in BOOKED to RELEASED"
          - "increments Project.version by 1; increments each released CrewAssignment.version by 1"
        note: "Cure window must have elapsed against the system clock; completing before cure_window_end is rejected."
      - from: APPROVED
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: ProjectManager
        preconditions:
          - "Project.status IN {APPROVED, SCHEDULED}"
        side_effects:
          - "Sets Project.status_before_hold = current status; Project.status = ON_HOLD"
          - "increments Project.version by 1"
      - from: SCHEDULED
        to: ON_HOLD
        trigger: "POST /projects/{id}/hold"
        actor: ProjectManager
        preconditions:
          - "Project.status IN {APPROVED, SCHEDULED}"
        side_effects:
          - "Sets Project.status_before_hold = current status; Project.status = ON_HOLD"
          - "increments Project.version by 1"
      - from: ON_HOLD
        to: APPROVED
        trigger: "POST /projects/{id}/resume"
        actor: ProjectManager
        preconditions:
          - "Project.status == ON_HOLD"
          - "Project.status_before_hold == APPROVED"
        side_effects:
          - "Restores Project.status = status_before_hold; clears status_before_hold to null"
          - "increments Project.version by 1"
      - from: ON_HOLD
        to: SCHEDULED
        trigger: "POST /projects/{id}/resume"
        actor: ProjectManager
        preconditions:
          - "Project.status == ON_HOLD"
          - "Project.status_before_hold == SCHEDULED"
        side_effects:
          - "Restores Project.status = status_before_hold; clears status_before_hold to null"
          - "increments Project.version by 1"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /projects/{id}/approve-estimate (this estimate is estimate_id)"
        actor: ProjectManager
        preconditions:
          - "Estimate.status == DRAFT"
          - "Estimate.project_id == path project id"
        side_effects:
          - "Sets Estimate.status = APPROVED"
          - "increments Estimate.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /projects/{id}/estimates (a newer DRAFT estimate created) OR sibling estimate approved OR project rejected"
        actor: system
        preconditions:
          - "Estimate.status == DRAFT"
        side_effects:
          - "Sets Estimate.status = SUPERSEDED (terminal)"
          - "increments Estimate.version by 1"
        note: "At most one DRAFT estimate per project at a time; creating a new one supersedes the prior."

  - entity: Permit
    initial_state: APPLIED
    terminal_states: [REVOKED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: Inspector
        preconditions:
          - "Permit.status == APPLIED"
        side_effects:
          - "Sets Permit.status = ISSUED"
          - "increments Permit.version by 1"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /permits/{id}/close"
        actor: Inspector
        preconditions:
          - "Permit.status == ISSUED"
          - "Project.status == COMPLETED"
        side_effects:
          - "Sets Permit.status = CLOSED"
          - "increments Permit.version by 1"
        note: "Cross-entity guard: permit closure requires its project to be COMPLETED."
      - from: APPLIED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: Inspector
        preconditions:
          - "Permit.status IN {APPLIED, ISSUED}"
        side_effects:
          - "Sets Permit.status = REVOKED (terminal)"
          - "If the project is in status SCHEDULED, sets Project.status = ON_HOLD and snapshots status_before_hold = SCHEDULED"
          - "increments Permit.version by 1; increments Project.version by 1 when the project was forced to ON_HOLD"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: Inspector
        preconditions:
          - "Permit.status IN {APPLIED, ISSUED}"
        side_effects:
          - "Sets Permit.status = REVOKED (terminal)"
          - "If the project is in status SCHEDULED, sets Project.status = ON_HOLD and snapshots status_before_hold = SCHEDULED"
          - "increments Permit.version by 1; increments Project.version by 1 when the project was forced to ON_HOLD"

  - entity: MaterialOrder
    initial_state: ORDERED
    terminal_states: [CANCELLED]
    transitions:
      - from: ORDERED
        to: POURING
        trigger: "POST /material-orders/{id}/start-pour"
        actor: ProjectManager
        preconditions:
          - "MaterialOrder.status == ORDERED"
          - "Project.status == SCHEDULED"
          - "No WeatherReading on this order with reading_at in [pour_scheduled_start, pour_scheduled_start + pour_duration_hours) has temp_f < 40 OR temp_f > 90 OR precip_pct >= 50"
        side_effects:
          - "Sets MaterialOrder.status = POURING"
          - "increments MaterialOrder.version by 1"
        note: "Weather gate: any in-window reading out of range blocks the pour start."
      - from: POURING
        to: POURED
        trigger: "POST /material-orders/{id}/complete-pour"
        actor: ProjectManager
        preconditions:
          - "MaterialOrder.status == POURING"
        side_effects:
          - "LINK 1: Sets MaterialOrder.pour_completed_at = request.completed_at; cure_window_end = pour_completed_at + cure_hours(mix_type); MaterialOrder.status = POURED"
          - "LINK 2 (caused by LINK 1's MaterialOrder reaching POURED): bubbles up Project SCHEDULED->POURED"
          - "LINK 3 (caused by LINK 2's Project reaching POURED with a now-set cure_window_end): recomputes Project.warranty_risk_score, evaluating the cure-window contribution"
          - "increments MaterialOrder.version by 1; increments Project.version by 1"
        note: "Transitive depth-3 cascade: MaterialOrder state change -> Project state change -> Project warranty_risk_score recompute, each hop caused by the prior hop's resulting state."
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /material-orders/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "MaterialOrder.status == ORDERED"
        side_effects:
          - "Sets MaterialOrder.status = CANCELLED (terminal)"
          - "increments MaterialOrder.version by 1"

  - entity: CrewAssignment
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /crew-assignments/{id}/release OR Project COMPLETED cascade"
        actor: ProjectManager
        preconditions:
          - "CrewAssignment.status == BOOKED"
        side_effects:
          - "Sets CrewAssignment.status = RELEASED (terminal)"
          - "increments CrewAssignment.version by 1"

  - entity: ChangeOrder
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /change-orders/{id}/start-review"
        actor: FinanceOfficer
        preconditions:
          - "ChangeOrder.status == SUBMITTED"
        side_effects:
          - "Sets ChangeOrder.status = UNDER_REVIEW"
          - "Recomputes Project.provisional_contract_value (UNDER_REVIEW now enters the forward-looking sum)"
          - "increments ChangeOrder.version by 1; increments Project.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /change-orders/{id}/request-revision"
        actor: FinanceOfficer
        preconditions:
          - "ChangeOrder.status == UNDER_REVIEW"
        side_effects:
          - "Sets ChangeOrder.status = REVISION_REQUESTED"
          - "Recomputes Project.provisional_contract_value (leaves the forward-looking sum)"
          - "increments ChangeOrder.version by 1; increments Project.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/resubmit"
        actor: FinanceOfficer
        preconditions:
          - "ChangeOrder.status == REVISION_REQUESTED"
        side_effects:
          - "Sets ChangeOrder.status = SUBMITTED; updates delta_amount and delta_sqft from request; sets submitted_by_user_id = X-User-ID"
          - "increments ChangeOrder.version by 1"
        note: "Cyclic loop: revision rounds re-enter SUBMITTED for another review."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: FinanceOfficer
        preconditions:
          - "ChangeOrder.status == UNDER_REVIEW"
          - "request.expected_project_version == Project.version (OCC)"
          - "Project.status IN {APPROVED, SCHEDULED, ON_HOLD}"
          - "X-User-ID != any Draw.released_by_user_id on this project (segregation of duties)"
        side_effects:
          - "Sets ChangeOrder.status = APPROVED (terminal)"
          - "Recomputes Project.committed_contract_value (APPROVED now enters the committed sum) and provisional_contract_value"
          - "Applies delta_sqft to the project's effective scope total used by later estimates/draw caps"
          - "increments ChangeOrder.version by 1; increments Project.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: FinanceOfficer
        preconditions:
          - "ChangeOrder.status == UNDER_REVIEW"
        side_effects:
          - "Sets ChangeOrder.status = REJECTED (terminal)"
          - "Recomputes Project.provisional_contract_value (leaves the forward-looking sum)"
          - "increments ChangeOrder.version by 1; increments Project.version by 1"

  - entity: Draw
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /draws/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "Draw.status == REQUESTED"
          - "request.expected_project_version == Project.version (OCC)"
          - "Project.status IN {APPROVED, SCHEDULED, POURED, CURING}"
          - "For DEPOSIT: no other RELEASED DEPOSIT draw exists on the project"
          - "For FINAL: Project.status == CURING and every other non-VOIDED draw is RELEASED"
          - "total_drawn_amount + amount <= draw_cap (calculations.draw_cap)"
          - "X-User-ID != submitted_by_user_id of any APPROVED ChangeOrder on this project (segregation of duties)"
        side_effects:
          - "Sets Draw.status = RELEASED; Draw.released_by_user_id = X-User-ID"
          - "Recomputes Project.total_drawn_amount"
          - "increments Draw.version by 1; increments Project.version by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /draws/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "Draw.status == REQUESTED"
        side_effects:
          - "Sets Draw.status = VOIDED (terminal)"
          - "increments Draw.version by 1"

  - entity: Warranty
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: CLAIM_OPEN
        trigger: "POST /warranties/{id}/claims"
        actor: Inspector
        preconditions:
          - "Warranty.status == ACTIVE"
          - "Project.status == COMPLETED"
        side_effects:
          - "increments Warranty.defect_claims_count by 1"
          - "Sets Warranty.status = CLAIM_OPEN"
          - "Recomputes Project.warranty_risk_score (defect contribution increases)"
          - "increments Warranty.version by 1; increments Project.version by 1"
      - from: CLAIM_OPEN
        to: CLAIM_OPEN
        trigger: "POST /warranties/{id}/claims"
        actor: Inspector
        preconditions:
          - "Warranty.status == CLAIM_OPEN"
          - "Project.status == COMPLETED"
        side_effects:
          - "increments Warranty.defect_claims_count by 1"
          - "Recomputes Project.warranty_risk_score"
          - "increments Warranty.version by 1; increments Project.version by 1"
        note: "Self-loop: additional claims accumulate on an already-open warranty."
      - from: CLAIM_OPEN
        to: ACTIVE
        trigger: "POST /warranties/{id}/resolve-claim"
        actor: Inspector
        preconditions:
          - "Warranty.status == CLAIM_OPEN"
        side_effects:
          - "Sets Warranty.status = ACTIVE"
          - "increments Warranty.version by 1"
        note: "defect_claims_count is NOT decremented on resolve (claims are historical)."
      - from: ACTIVE
        to: VOID
        trigger: "POST /warranties/{id}/void"
        actor: ProjectManager
        preconditions:
          - "Warranty.status IN {ACTIVE, CLAIM_OPEN}"
        side_effects:
          - "Sets Warranty.status = VOID (terminal)"
          - "increments Warranty.version by 1"
      - from: CLAIM_OPEN
        to: VOID
        trigger: "POST /warranties/{id}/void"
        actor: ProjectManager
        preconditions:
          - "Warranty.status IN {ACTIVE, CLAIM_OPEN}"
        side_effects:
          - "Sets Warranty.status = VOID (terminal)"
          - "increments Warranty.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: change-order-approve-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders/{id}/approve"
    occ_field: "expected_project_version"
    description: |
      Approving a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. A separate approved or reviewed
      change order legitimately bumps the project's committed/provisional contract
      value (and therefore its version) between the client's read and this approve;
      the current writer's view of the project is then stale and the approve must
      be refused so the contract-value recomputation is not based on an outdated base.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: draw-release-stale-project
    parent_entity: Project
    write_endpoint: "POST /draws/{id}/release"
    occ_field: "expected_project_version"
    description: |
      Releasing a Draw against a Project whose version has advanced since the client
      last observed it is rejected. Another draw release or change-order approval
      legitimately changes total_drawn_amount or committed_contract_value (and the
      project version) between the client's read and this release; the stale view
      would let the waterfall cap be evaluated against an outdated draw total, so the
      release is refused.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: estimate_cubic_yards
    trigger: "On POST /projects/{id}/estimates (Estimate creation), DRAFT->ESTIMATING"
    algorithm: aggregation
    formula: |
      WASTE_FACTOR = 0.10
      for each FlatworkSegment s on the project:
        raw_cy(s) = s.area_sqft * (s.thickness_in / 12) / 27
        adj_cy(s) = raw_cy(s) * (1 + WASTE_FACTOR)
      # PROVISIONAL variant (sum then ceil to whole yard):
      provisional_cubic_yards = ceil( sum over s of adj_cy(s) )
      Estimate.provisional_cubic_yards = provisional_cubic_yards
      Estimate.total_sqft = round(sum over s of s.area_sqft, 2)
    input_set: "All FlatworkSegment rows whose project_id == this project, regardless of finish/reinforcement."
    constants:
      WASTE_FACTOR: 0.10
      CUBIC_FEET_PER_YARD: 27
      INCHES_PER_FOOT: 12
    precision: "intermediate float; final ceil to integer cubic yards"
    variants:
      - name: provisional_sum_then_ceil
        when: "Estimate creation (planning); used to price the estimate"
        difference: "Sum all waste-adjusted segment volumes first, then ceil the grand total to a whole yard."

  - name: material_order_cubic_yards
    trigger: "On POST /projects/{id}/material-orders (MaterialOrder placement)"
    algorithm: aggregation
    formula: |
      WASTE_FACTOR = 0.10
      for each FlatworkSegment s on the project:
        raw_cy(s) = s.area_sqft * (s.thickness_in / 12) / 27
        adj_cy(s) = raw_cy(s) * (1 + WASTE_FACTOR)
        # ORDER variant rounds EACH segment UP to the next 0.25-yd ticket increment FIRST:
        ticket_cy(s) = ceil(adj_cy(s) * 4) / 4
      order_cubic_yards = ceil( sum over s of ticket_cy(s) )
      MaterialOrder.order_cubic_yards = order_cubic_yards
    input_set: "All FlatworkSegment rows whose project_id == this project at order placement."
    constants:
      WASTE_FACTOR: 0.10
      TICKET_INCREMENT_CY: 0.25
    precision: "ceil to 0.25-yd per segment, then ceil sum to integer cubic yards"
    variants:
      - name: order_ceil_quarter_per_segment_then_sum
        when: "Material order placement (supplier truck-ticket reality)"
        difference: "Round EACH segment up to 0.25 yd BEFORE summing, then ceil the sum — the per-line-item rounding order can yield a strictly larger whole-yard total than the provisional sum-then-ceil variant on the same segments."

  - name: estimate_total
    trigger: "On POST /projects/{id}/estimates (Estimate creation), DRAFT->ESTIMATING"
    algorithm: tiered_pricing
    formula: |
      total_sqft = sum over segments of area_sqft
      # marginal tiered labor base (per-sqft, progressive across tiers):
      labor_base = 0
      remaining = total_sqft
      t1 = min(remaining, 500);  labor_base += t1 * RATE_TIER1; remaining -= t1
      if remaining > 0: t2 = min(remaining, 1000); labor_base += t2 * RATE_TIER2; remaining -= t2
      if remaining > 0: labor_base += remaining * RATE_TIER3
      # finish multiplier = MAX over the project's segments of FINISH_MULT[finish_grade]
      finish_mult = max over segments of FINISH_MULT[s.finish_grade]
      # reinforcement add = sum over segments of REINF_RATE[s.reinforcement] * s.area_sqft
      reinf_add = sum over segments of (REINF_RATE[s.reinforcement] * s.area_sqft)
      labor_subtotal = round(labor_base * finish_mult + reinf_add, 2)
      material_subtotal = round(Estimate.provisional_cubic_yards * MIX_RATE_PER_CY, 2)
      estimate_total = round(labor_subtotal, 2) + round(material_subtotal, 2)   # round-per-line-item THEN sum
    input_set: "All FlatworkSegment rows whose project_id == this project; uses provisional_cubic_yards from estimate_cubic_yards."
    constants:
      RATE_TIER1: 9.00
      RATE_TIER2: 7.50
      RATE_TIER3: 6.00
      MIX_RATE_PER_CY: 145.00
      FINISH_MULT: { BROOM: 1.00, EXPOSED_AGGREGATE: 1.20, STAMPED: 1.35 }
      REINF_RATE: { NONE: 0.00, MESH: 0.60, REBAR: 1.25 }
    precision: "2 decimal places, round_half_up; labor_subtotal and material_subtotal each rounded to cents BEFORE summation"
    variants:
      - name: line_item_round_then_sum
        when: "Always (the only pinned order)"
        difference: "labor_subtotal and material_subtotal are each rounded to 2 dp before being added; summing raw then rounding once is the wrong order and is forbidden."

  - name: provisional_contract_value
    trigger: "On Estimate approval and on any ChangeOrder transition into/out of {UNDER_REVIEW, APPROVED}"
    algorithm: forward_looking
    formula: |
      provisional_contract_value = round(
        Project.base_contract_amount
        + sum of co.delta_amount for co in ChangeOrders where co.status IN {UNDER_REVIEW, APPROVED}, 2)
    input_set: "ChangeOrders on the project whose status IN {UNDER_REVIEW, APPROVED}; SUBMITTED, REVISION_REQUESTED, REJECTED excluded."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking_includes_under_review
        when: "Optimistic planning view"
        difference: "Counts UNDER_REVIEW change orders as if they will be approved, so it can exceed the committed value while reviews are open."

  - name: committed_contract_value
    trigger: "On Estimate approval and on any ChangeOrder transition into APPROVED"
    algorithm: chronological
    formula: |
      value = Project.base_contract_amount
      for co in ChangeOrders where co.status == APPROVED, ordered by co.created_at ASC (tie-break: created_at then the earliest-created row):
        value = value + co.delta_amount
      committed_contract_value = round(value, 2)
    input_set: "Only APPROVED ChangeOrders on the project, applied in created_at ASC order."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: committed_approved_only
        when: "Billing/legal view"
        difference: "Counts only APPROVED change orders, applied chronologically; equals provisional only when no UNDER_REVIEW change orders exist."

  - name: draw_cap
    trigger: "On POST /draws/{id}/release, evaluating the waterfall cap"
    algorithm: waterfall_allocation
    formula: |
      RETAINAGE_PCT = 0.10
      if draw.draw_type == FINAL:
        cap = Project.committed_contract_value                 # final draw may reach 100%
      else:                                                    # DEPOSIT or PROGRESS
        cap = round(Project.committed_contract_value * (1 - RETAINAGE_PCT), 2)   # 90% retainage ceiling
      # release allowed iff Project.total_drawn_amount + draw.amount <= cap
    input_set: "Project.committed_contract_value and Project.total_drawn_amount at release time."
    constants:
      RETAINAGE_PCT: 0.10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: retainage_ceiling_vs_full
        when: "DEPOSIT/PROGRESS draws are capped at 90%; FINAL draw lifts the cap to 100%"
        difference: "The cap is committed*(1-retainage) for non-final draws and the full committed value for the final draw."

  - name: cure_window_end
    trigger: "On MaterialOrder POURING->POURED (complete-pour)"
    algorithm: threshold
    formula: |
      cure_hours = CURE_HOURS[mix_type]   # STANDARD=168, HIGH_EARLY=72, FIBER=168
      MaterialOrder.cure_window_end = MaterialOrder.pour_completed_at + cure_hours hours
    input_set: "The MaterialOrder's mix_type and pour_completed_at."
    constants:
      CURE_HOURS: { STANDARD: 168, HIGH_EARLY: 72, FIBER: 168 }
    precision: "datetime arithmetic in whole hours, ISO 8601 UTC"
    variants:
      - name: mix_dependent_cure
        when: "Always"
        difference: "HIGH_EARLY mixes cure in 72h vs 168h for STANDARD/FIBER; completion is gated on current_utc >= cure_window_end."

  - name: warranty_risk_score
    trigger: "On MaterialOrder POURING->POURED, on Warranty claim file/self-loop, and recomputed on read"
    algorithm: weighted_scoring
    formula: |
      score = 0
      # cure-window compromise: pour completed but cured shorter than the mix's required hours
      if MaterialOrder.pour_completed_at is not null AND
         (cure_window_end - pour_completed_at) < CURE_HOURS[mix_type] hours: score += W_CURE
      # weather pour violation: a started pour had any in-window reading out of range
      if pour started with an out-of-range WeatherReading override flag set: score += W_WEATHER
      score += W_CLAIM * (sum of Warranty.defect_claims_count over the project's warranties)
      if any FlatworkSegment on the project has reinforcement == NONE: score += W_NO_REINF
      warranty_risk_score = clamp(score, 0, 100)
    input_set: "Project's poured MaterialOrder, its WeatherReadings, the project's Warranties' defect_claims_count, and its FlatworkSegments' reinforcement."
    constants:
      W_CURE: 30
      W_WEATHER: 25
      W_CLAIM: 15
      W_NO_REINF: 10
    precision: "integer; clamped to [0,100]"
    variants:
      - name: additive_clamped
        when: "Always"
        difference: "Contributions are additive then clamped to [0,100]; a score that would exceed 100 saturates at 100, and the floor is 0."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: existence
    check: "Body foreign keys reference existing resources (project_id, crew_id, equipment_id, material_order_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create/link endpoints with FK bodies"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in declared sets; numeric ranges (area_sqft>0, thickness_in>0, amount>0, headcount>=1, term_months>=1, 0<=precip_pct<=100, window_end>window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity transition guards hold (schedule requires ISSUED permit + ORDERED material + BOOKED crew; permit close requires COMPLETED project; warranty claim requires COMPLETED project; complete requires ACTIVE warranty)"
    error_id: ERR_PRECONDITION_NOT_MET
    http_status: 409
    applies_to: "POST /projects/{id}/schedule, POST /permits/{id}/close, POST /projects/{id}/complete, POST /warranties/{id}/claims"
  - priority: 8
    category: state
    check: "OCC: expected_project_version equals current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/approve-estimate, POST /change-orders/{id}/approve, POST /draws/{id}/release"
  - priority: 9
    category: business_safety
    check: "Pour start blocked when any WeatherReading on the order with reading_at in [pour_scheduled_start, pour_scheduled_start + pour_duration_hours) has temp_f<40 OR temp_f>90 OR precip_pct>=50, unless force_override=true"
    error_id: ERR_WEATHER_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /material-orders/{id}/start-pour"
  - priority: 10
    category: business_temporal
    check: "complete is blocked until current_utc >= the poured MaterialOrder.cure_window_end"
    error_id: ERR_CURE_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /projects/{id}/complete"
  - priority: 11
    category: business_temporal
    check: "A new CrewAssignment for a crew_id whose half-open [window_start,window_end) overlaps an existing BOOKED assignment for the same crew is rejected (adjacency allowed: end==start is NOT an overlap)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /projects/{id}/crew-assignments"
  - priority: 12
    category: business_temporal
    check: "A new CrewAssignment for an equipment_id whose window, expanded by a 2-hour (EQUIPMENT_BUFFER_HOURS=2) cleandown buffer on each side, overlaps an existing BOOKED assignment for the same equipment is rejected (buffered half-open interval semantics: existing booking [s,e) is treated as occupying [s-2h, e+2h); a new window touching that buffered edge exactly is NOT an overlap, but a window inside it collides)"
    error_id: ERR_EQUIPMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /projects/{id}/crew-assignments"
  - priority: 13
    category: business_safety
    check: "FinanceOfficer approving a ChangeOrder must not equal any FinanceOfficer who released a Draw on this project; FinanceOfficer releasing a Draw must not equal the submitter of any APPROVED ChangeOrder on this project (segregation of duties)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /change-orders/{id}/approve, POST /draws/{id}/release"
  - priority: 14
    category: business_fiscal
    check: "Draw release rejected when Project.total_drawn_amount + amount > draw_cap (calculations.draw_cap)"
    error_id: ERR_DRAW_EXCEEDS_CONTRACT
    http_status: 409
    applies_to: "POST /draws/{id}/release"
  - priority: 15
    category: business_constraint
    check: "At most one RELEASED DEPOSIT draw per project; FINAL draw requires Project.status==CURING and every other non-VOIDED draw already RELEASED"
    error_id: ERR_DRAW_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /draws/{id}/release"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "Create a project in DRAFT."
    roles: [Estimator]
    code: 201
    input: [site_name, client_name]
    output: Project
    side_effects: ["status=DRAFT", "version=1"]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project (recomputes derived fields on read)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Project
    side_effects: ["recompute provisional_contract_value, committed_contract_value, total_drawn_amount, warranty_risk_score"]
  - method: GET
    path: "/projects"
    description: "List projects, paginated; optional status filter."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/estimates"
    description: "Create an estimate; moves DRAFT->ESTIMATING (or supersedes prior DRAFT estimate while ESTIMATING)."
    roles: [Estimator]
    code: 201
    input: []
    output: Estimate
    side_effects: ["compute estimate_cubic_yards, estimate_total", "Project.status=ESTIMATING", "supersede prior DRAFT estimate", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/estimates"
    description: "List estimates for a project."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Estimate[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/approve-estimate"
    description: "Approve a DRAFT estimate; ESTIMATING->APPROVED."
    roles: [ProjectManager]
    code: 200
    input: [estimate_id, expected_project_version]
    output: Project
    side_effects: ["Estimate.status=APPROVED", "Project.base_contract_amount set", "recompute contract values", "Project.status=APPROVED", "increments Project.version by 1"]
  - method: POST
    path: "/projects/{id}/reject"
    description: "Reject the project; ESTIMATING->REJECTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status=REJECTED", "supersede DRAFT estimates", "Project.version+1"]
  - method: POST
    path: "/projects/{id}/schedule"
    description: "Schedule the project; APPROVED->SCHEDULED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status=SCHEDULED", "Project.version+1"]
  - method: POST
    path: "/projects/{id}/begin-cure"
    description: "Begin cure; POURED->CURING."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status=CURING", "Project.version+1"]
  - method: POST
    path: "/projects/{id}/complete"
    description: "Complete the project; CURING->COMPLETED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.status=COMPLETED", "release BOOKED crew assignments", "Project.version+1"]
  - method: POST
    path: "/projects/{id}/hold"
    description: "Place project ON_HOLD; {APPROVED,SCHEDULED}->ON_HOLD."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status_before_hold snapshot", "Project.status=ON_HOLD", "Project.version+1"]
  - method: POST
    path: "/projects/{id}/resume"
    description: "Resume from hold; ON_HOLD->status_before_hold."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["restore status_before_hold", "clear status_before_hold", "Project.version+1"]
  # ---- FlatworkSegment ----
  - method: POST
    path: "/projects/{id}/segments"
    description: "Add a flatwork segment to a DRAFT project."
    roles: [Estimator]
    code: 201
    input: [label, area_sqft, thickness_in, "finish_grade?", "reinforcement?"]
    output: FlatworkSegment
    side_effects: ["Project.version+1"]
  - method: GET
    path: "/projects/{id}/segments"
    description: "List a project's flatwork segments (FK reverse-reachability for FlatworkSegment.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: FlatworkSegment[]
    side_effects: []
  # ---- Permit ----
  - method: POST
    path: "/projects/{id}/permits"
    description: "Apply for a permit (status APPLIED)."
    roles: [ProjectManager]
    code: 201
    input: [jurisdiction, permit_number]
    output: Permit
    side_effects: ["Project.version+1"]
  - method: GET
    path: "/projects/{id}/permits"
    description: "List a project's permits (FK reverse-reachability for Permit.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue a permit; APPLIED->ISSUED."
    roles: [Inspector]
    code: 200
    input: []
    output: Permit
    side_effects: ["Permit.version+1"]
  - method: POST
    path: "/permits/{id}/close"
    description: "Close a permit; ISSUED->CLOSED (project must be COMPLETED)."
    roles: [Inspector]
    code: 200
    input: []
    output: Permit
    side_effects: ["Permit.version+1"]
  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke a permit; {APPLIED,ISSUED}->REVOKED, may force project ON_HOLD."
    roles: [Inspector]
    code: 200
    input: []
    output: Permit
    side_effects: ["Permit.version+1", "may force Project ON_HOLD and Project.version+1"]
  # ---- MaterialOrder ----
  - method: POST
    path: "/projects/{id}/material-orders"
    description: "Place a material order; computes order_cubic_yards from segments."
    roles: [ProjectManager]
    code: 201
    input: [mix_type, pour_scheduled_start, pour_duration_hours]
    output: MaterialOrder
    side_effects: ["compute material_order_cubic_yards", "status=ORDERED", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/material-orders"
    description: "List a project's material orders (FK reverse-reachability for MaterialOrder.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: MaterialOrder[]
    side_effects: []
  - method: GET
    path: "/material-orders/{id}"
    description: "Fetch a material order."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: POST
    path: "/material-orders/{id}/start-pour"
    description: "Start the pour; ORDERED->POURING (weather gate)."
    roles: [ProjectManager]
    code: 200
    input: ["force_override?"]
    output: MaterialOrder
    side_effects: ["status=POURING", "if force_override over a bad reading: set weather-violation flag for warranty_risk_score", "MaterialOrder.version+1"]
  - method: POST
    path: "/material-orders/{id}/complete-pour"
    description: "Complete the pour; POURING->POURED, sets cure window, bubbles Project to POURED."
    roles: [ProjectManager]
    code: 200
    input: [completed_at]
    output: MaterialOrder
    side_effects: ["pour_completed_at set", "compute cure_window_end", "Project.status=POURED", "recompute warranty_risk_score", "MaterialOrder.version+1", "Project.version+1"]
  - method: POST
    path: "/material-orders/{id}/cancel"
    description: "Cancel a material order; ORDERED->CANCELLED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status=CANCELLED", "MaterialOrder.version+1"]
  # ---- WeatherReading ----
  - method: POST
    path: "/material-orders/{id}/weather-readings"
    description: "Append a weather reading to a material order."
    roles: [ProjectManager, Inspector]
    code: 201
    input: [reading_at, temp_f, precip_pct]
    output: WeatherReading
    side_effects: []
  - method: GET
    path: "/material-orders/{id}/weather-readings"
    description: "List weather readings (FK reverse-reachability for WeatherReading.material_order_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: WeatherReading[]
    side_effects: []
  # ---- Crew / Equipment pools ----
  - method: POST
    path: "/crews"
    description: "Create a crew."
    roles: [ProjectManager]
    code: 201
    input: [crew_name, skill, headcount]
    output: Crew
    side_effects: ["version=1"]
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: POST
    path: "/equipment"
    description: "Create an equipment asset."
    roles: [ProjectManager]
    code: 201
    input: [asset_name, asset_type]
    output: Equipment
    side_effects: ["version=1"]
  - method: GET
    path: "/equipment/{id}"
    description: "Fetch an equipment asset."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Equipment
    side_effects: []
  # ---- CrewAssignment ----
  - method: POST
    path: "/projects/{id}/crew-assignments"
    description: "Book crew (and optional equipment) for a window; temporal-overlap guards apply."
    roles: [ProjectManager]
    code: 201
    input: [crew_id, "equipment_id?", window_start, window_end]
    output: CrewAssignment
    side_effects: ["status=BOOKED", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/crew-assignments"
    description: "List a project's crew assignments (FK reverse-reachability for CrewAssignment.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/crew-assignments"
    description: "List crew assignments filtered by crew_id or equipment_id (FK reverse-reachability for CrewAssignment.crew_id and .equipment_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: ["crew_id?", "equipment_id?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []
  - method: GET
    path: "/crew-assignments/{id}"
    description: "Fetch a single crew assignment (establishes the crew-assignments collection segment)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []
  - method: POST
    path: "/crew-assignments/{id}/release"
    description: "Release a crew assignment; BOOKED->RELEASED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status=RELEASED", "version+1"]
  # ---- ChangeOrder ----
  - method: POST
    path: "/projects/{id}/change-orders"
    description: "Submit a change order (status SUBMITTED)."
    roles: [FinanceOfficer]
    code: 201
    input: [description, delta_amount, "delta_sqft?"]
    output: ChangeOrder
    side_effects: ["status=SUBMITTED", "submitted_by_user_id set", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List a project's change orders (FK reverse-reachability for ChangeOrder.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: ChangeOrder[]
    side_effects: []
  - method: POST
    path: "/change-orders/{id}/start-review"
    description: "Begin review; SUBMITTED->UNDER_REVIEW."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=UNDER_REVIEW", "recompute provisional_contract_value", "ChangeOrder.version+1", "Project.version+1"]
  - method: POST
    path: "/change-orders/{id}/request-revision"
    description: "Request revision; UNDER_REVIEW->REVISION_REQUESTED."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=REVISION_REQUESTED", "recompute provisional_contract_value", "ChangeOrder.version+1", "Project.version+1"]
  - method: POST
    path: "/change-orders/{id}/resubmit"
    description: "Resubmit after revision; REVISION_REQUESTED->SUBMITTED with new deltas."
    roles: [FinanceOfficer]
    code: 200
    input: [delta_amount, "delta_sqft?"]
    output: ChangeOrder
    side_effects: ["status=SUBMITTED", "update delta_amount/delta_sqft", "submitted_by_user_id set", "ChangeOrder.version+1"]
  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve; UNDER_REVIEW->APPROVED (OCC + segregation guard)."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects: ["status=APPROVED", "recompute committed_contract_value and provisional_contract_value", "apply delta_sqft to scope", "ChangeOrder.version+1", "increments Project.version by 1"]
  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject; UNDER_REVIEW->REJECTED."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status=REJECTED", "recompute provisional_contract_value", "ChangeOrder.version+1", "Project.version+1"]
  # ---- Draw ----
  - method: POST
    path: "/projects/{id}/draws"
    description: "Request a draw (status REQUESTED)."
    roles: [FinanceOfficer]
    code: 201
    input: [draw_type, amount]
    output: Draw
    side_effects: ["status=REQUESTED", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/draws"
    description: "List a project's draws (FK reverse-reachability for Draw.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Draw[]
    side_effects: []
  - method: POST
    path: "/draws/{id}/release"
    description: "Release a draw; REQUESTED->RELEASED (OCC + waterfall cap + segregation + sequence guards)."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_project_version]
    output: Draw
    side_effects: ["status=RELEASED", "released_by_user_id set", "recompute total_drawn_amount", "Draw.version+1", "increments Project.version by 1"]
  - method: POST
    path: "/draws/{id}/void"
    description: "Void a draw; REQUESTED->VOIDED."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Draw
    side_effects: ["status=VOIDED", "Draw.version+1"]
  # ---- Warranty ----
  - method: POST
    path: "/projects/{id}/warranties"
    description: "Issue a warranty (status ACTIVE) for an approved-or-later project."
    roles: [ProjectManager]
    code: 201
    input: [term_months]
    output: Warranty
    side_effects: ["status=ACTIVE", "defect_claims_count=0", "Project.version+1"]
  - method: GET
    path: "/projects/{id}/warranties"
    description: "List a project's warranties (FK reverse-reachability for Warranty.project_id)."
    roles: [Estimator, ProjectManager, FinanceOfficer, Inspector]
    code: 200
    input: []
    output: Warranty[]
    side_effects: []
  - method: POST
    path: "/warranties/{id}/claims"
    description: "File a defect claim; ACTIVE->CLAIM_OPEN or CLAIM_OPEN self-loop."
    roles: [Inspector]
    code: 200
    input: ["defect_note?"]
    output: Warranty
    side_effects: ["defect_claims_count+1", "status=CLAIM_OPEN", "recompute warranty_risk_score", "Warranty.version+1", "Project.version+1"]
  - method: POST
    path: "/warranties/{id}/resolve-claim"
    description: "Resolve an open claim; CLAIM_OPEN->ACTIVE (count not decremented)."
    roles: [Inspector]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status=ACTIVE", "Warranty.version+1"]
  - method: POST
    path: "/warranties/{id}/void"
    description: "Void a warranty; {ACTIVE,CLAIM_OPEN}->VOID."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status=VOID", "Warranty.version+1"]
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock for cure-window evaluation."
    roles: [ProjectManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets system clock used by cure-window and completion checks"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist."
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign key references a non-existent resource."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/malformed field, bad enum, or numeric-range violation."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_PRECONDITION_NOT_MET
    http: 409
    condition: "Cross-entity transition guard fails (missing ISSUED permit / material / crew on schedule; project not COMPLETED on permit-close or warranty claim; no ACTIVE warranty on complete)."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != current Project.version (OCC)."
  - id: ERR_WEATHER_OUT_OF_RANGE
    http: 409
    condition: "An in-window WeatherReading is out of range (temp<40 or >90, or precip>=50) and force_override is not set."
  - id: ERR_CURE_WINDOW_NOT_ELAPSED
    http: 409
    condition: "complete called before current_utc reaches the poured order's cure_window_end."
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "Crew booking window overlaps an existing BOOKED assignment for the same crew (half-open intervals; adjacency allowed)."
  - id: ERR_EQUIPMENT_DOUBLE_BOOKED
    http: 409
    condition: "Equipment booking window, expanded by the cleandown buffer on each side, overlaps an existing BOOKED assignment for the same equipment."
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "The acting FinanceOfficer would both approve a change order and release a draw on the same project (segregation of duties)."
  - id: ERR_DRAW_EXCEEDS_CONTRACT
    http: 409
    condition: "total_drawn_amount + amount exceeds the draw_cap."
  - id: ERR_DRAW_SEQUENCE_INVALID
    http: 409
    condition: "Second DEPOSIT release, or FINAL released while another non-VOIDED draw is still REQUESTED or before project is CURING."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Estimator
    description: "Drafts project scope (segments) and estimates."
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/segments"
      - "POST /projects/{id}/estimates"
    shared_operations:
      - "GET (all read endpoints)"
  - name: ProjectManager
    description: "Approves estimates, schedules, advances pour/cure/complete lifecycle, manages crews/equipment/material orders/holds/warranty issuance."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/approve-estimate"
      - "POST /projects/{id}/reject"
      - "POST /projects/{id}/schedule"
      - "POST /projects/{id}/begin-cure"
      - "POST /projects/{id}/complete"
      - "POST /projects/{id}/hold"
      - "POST /projects/{id}/resume"
      - "POST /projects/{id}/permits"
      - "POST /projects/{id}/material-orders"
      - "POST /material-orders/{id}/start-pour"
      - "POST /material-orders/{id}/complete-pour"
      - "POST /material-orders/{id}/cancel"
      - "POST /crews"
      - "POST /equipment"
      - "POST /projects/{id}/crew-assignments"
      - "POST /crew-assignments/{id}/release"
      - "POST /projects/{id}/warranties"
      - "POST /warranties/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /material-orders/{id}/weather-readings (with Inspector)"
      - "GET (all read endpoints)"
  - name: FinanceOfficer
    description: "Submits/reviews/approves change orders and requests/releases/voids draws; segregation of duties enforced via X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/change-orders"
      - "POST /change-orders/{id}/start-review"
      - "POST /change-orders/{id}/request-revision"
      - "POST /change-orders/{id}/resubmit"
      - "POST /change-orders/{id}/approve"
      - "POST /change-orders/{id}/reject"
      - "POST /projects/{id}/draws"
      - "POST /draws/{id}/release"
      - "POST /draws/{id}/void"
    shared_operations:
      - "GET (all read endpoints)"
  - name: Inspector
    description: "Issues/closes/revokes permits and files/resolves warranty defect claims."
    identity: opaque
    exclusive_operations:
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/close"
      - "POST /permits/{id}/revoke"
      - "POST /warranties/{id}/claims"
      - "POST /warranties/{id}/resolve-claim"
    shared_operations:
      - "POST /material-orders/{id}/weather-readings (with ProjectManager)"
      - "GET (all read endpoints)"
