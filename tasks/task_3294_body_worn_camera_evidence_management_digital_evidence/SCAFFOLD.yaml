    output: Officer
    side_effects: ["status ACTIVE -> SUSPENDED; AuditLogEntry OFFICER_SUSPENDED"]

  - method: POST
    path: "/agencies/{agencyId}/officers/{officerId}/reinstate"
    description: "Reinstate a suspended officer"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Officer
    side_effects: ["status SUSPENDED -> ACTIVE; AuditLogEntry OFFICER_REINSTATED"]

  - method: POST
    path: "/agencies/{agencyId}/officers/{officerId}/retire"
