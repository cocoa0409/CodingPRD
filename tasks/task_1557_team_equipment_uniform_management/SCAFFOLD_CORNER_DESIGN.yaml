  # =========================== endpoints ===========================
  - section: endpoints
    instances:
      - name: kit_orders_filtered_by_contract_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "entities.KitOrder.fields.supplier_contract_id"
        distinguishing_aspect: "Filtered list obeys the envelope pagination contract: limit 1 over 2 matching orders yields total_count 2, has_more true at offset 0 and false at offset 1; a second contract's order is excluded."
        test_recipe:
          setup: ["two ACTIVE contracts A and B; two orders on A, one on B; pool exists"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 50, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "PAGECO-A", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 100 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sca: $.data.id } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "PAGECO-B", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 100 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { scb: $.data.id } }
            - { call: "POST /supplier-contracts/${sca}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /supplier-contracts/${scb}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sca}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 1, unit_price_cents: 5000 }] }, as: EquipmentManager }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${sca}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 1, unit_price_cents: 5000 }] }, as: EquipmentManager }
            - { call: "POST /kit-orders", payload: { supplier_contract_id: "${scb}", lines: [{ garment_type: "GAME_JERSEY", size_code: "M", quantity: 1, unit_price_cents: 5000 }] }, as: EquipmentManager }
          trigger:
            - { call: "GET /kit-orders", payload: { supplier_contract_id: "${sca}", limit: 1, offset: 0 }, as: EquipmentManager }
            - { call: "GET /kit-orders", payload: { supplier_contract_id: "${sca}", limit: 1, offset: 1 }, as: EquipmentManager }
          assert:
            - "page 1: total_count == 2, has_more == true, exactly 1 item, and item.supplier_contract_id == ${sca}"
            - "page 2: total_count == 2, has_more == false, exactly 1 item"
            - "response envelope carries meta.api_request_id and response_type == array"

  # =========================== errors ===========================
  - section: errors
    instances:
      - name: error_envelope_shape_on_failure
        claim_type: error_triggerable
        grounds:
          - "response_envelope"
          - "errors[ERR_PLAYER_NOT_FOUND]"
        distinguishing_aspect: "Failure responses follow the fixed envelope: response_type error, data.error_id, and meta fields present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /players/00000000-0000-0000-0000-000000000000", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 404"
            - "body.response_type == error and body.data.error_id == ERR_PLAYER_NOT_FOUND"
            - "body.meta.api_request_id present and body.data.message is a non-empty string"

  # =========================== rbac ===========================
  - section: rbac
    instances:
      - name: laundry_vendor_cannot_create_player_403
        claim_type: role_denied
        grounds:
          - "roles[EquipmentManager]"
          - "roles[LaundryVendor]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "LaundryVendor has no write access to roster management: POST /players is denied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /players", payload: { full_name: "No Perm", position_group: "OFFENSE" }, as: LaundryVendor, captures: { err: $.data.error_id } }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED_ROLE"

      - name: equipment_manager_cannot_approve_disposition_403
        claim_type: role_denied
        grounds:
          - "roles[TeamAdmin]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Disposition approval is TeamAdmin-exclusive; the proposing EquipmentManager cannot self-approve."
        test_recipe:
          setup: ["pool exists; disposition case PROPOSED by the manager"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "SOCKS", size_code: "L", stock_on_hand: 3, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /disposition-cases", payload: { season_label: "2026-FALL", garment_type: "SOCKS", method: "DONATE" }, as: EquipmentManager, captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /disposition-cases/${dc}/approve", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "DispositionCase.${dc}.status remains PROPOSED"

      - name: equipment_manager_cannot_waive_claim_403
        claim_type: role_denied
        grounds:
          - "roles[TeamAdmin]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Claim waiver is TeamAdmin-exclusive (segregation from the assessing manager)."
        test_recipe:
          setup: ["claim ASSESSED on an issued helmet"]
          setup_api_calls:
            - { call: "POST /players", payload: { full_name: "Wv One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /gear-items", payload: { asset_tag: "HLM-912", item_type: "HELMET", size_spec: "HELMET-L", acquired_on: "2025-01-01", certification_expires_on: "2028-01-01T00:00:00Z" }, as: EquipmentManager, captures: { g: $.data.id } }
            - { call: "POST /gear-items/${g}/issue", payload: { player_id: "${p}" }, as: EquipmentManager }
            - { call: "POST /damage-claims", payload: { player_id: "${p}", claim_type: "DAMAGED", base_value_cents: 10000, gear_item_id: "${g}" }, as: EquipmentManager, captures: { c: $.data.id } }
            - { call: "POST /damage-claims/${c}/assess", payload: { condition_grade: "B" }, as: EquipmentManager }
          trigger:
            - { call: "POST /damage-claims/${c}/waive", payload: {}, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "http status == 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "DamageClaim.${c}.status remains ASSESSED"

      - name: team_admin_cannot_advance_laundry_403
        claim_type: role_denied
        grounds:
          - "roles[LaundryVendor]"
          - "roles[EquipmentManager]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "laundry-advance is shared by LaundryVendor and EquipmentManager only; TeamAdmin is denied, and the vendor's advance succeeds."
        test_recipe:
          setup: ["event completed with a load (laundry COLLECTING)"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 3, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /game-events", payload: { season_label: "2026-FALL", opponent_name: "A", kickoff_at: "2026-09-05T15:00:00Z", designated_kit: "HOME" }, as: EquipmentManager, captures: { ev: $.data.id } }
            - { call: "POST /game-events/${ev}/lock-kit", payload: {}, as: EquipmentManager }
            - { call: "POST /game-events/${ev}/complete", payload: { laundry_load: [{ pool_id: "${jp}", quantity: 1 }] }, as: EquipmentManager }
          trigger:
            - { call: "POST /game-events/${ev}/laundry-advance", payload: {}, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /game-events/${ev}/laundry-advance", payload: {}, as: LaundryVendor }
          assert:
            - "TeamAdmin advance rejected with http 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "LaundryVendor advance succeeds: GameEvent.${ev}.laundry_status == IN_WASH"

  # =========================== complexity_layers ===========================
  - section: complexity_layers
    instances:
      - name: occ_stock_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[pool-adjustment-stale-version]"
          - "errors[ERR_STALE_POOL_VERSION]"
        distinguishing_aspect: "A stock adjustment replaying the pre-adjustment version is rejected 412 while the pool keeps the newer value; the matching-version adjustment succeeds."
        test_recipe:
          setup: ["pool stock 10 (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /inventory-pools/${jp}/stock-adjustments", payload: { new_stock_on_hand: 8, expected_pool_version: "${pv}" }, as: EquipmentManager, captures: { pv2: $.data.version } }
            - { call: "POST /inventory-pools/${jp}/stock-adjustments", payload: { new_stock_on_hand: 6, expected_pool_version: "${pv}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "first adjustment succeeds and InventoryPool.${jp}.version == 2"
            - "second adjustment rejected with http 412 and error_id == ERR_STALE_POOL_VERSION"
            - "InventoryPool.${jp}.stock_on_hand remains 8"

      - name: occ_contract_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contract-amend-stale-version]"
          - "errors[ERR_STALE_CONTRACT_VERSION]"
        distinguishing_aspect: "An amendment carrying the pre-activation version is rejected 412; the current version amends successfully."
        test_recipe:
          setup: ["contract DRAFT (version 1 captured); activated (version 2 captured)"]
          setup_api_calls:
            - { call: "POST /supplier-contracts", payload: { vendor_name: "OCCCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 20 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id, cv: $.data.version } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin, captures: { cv2: $.data.version } }
          trigger:
            - { call: "POST /supplier-contracts/${sc}/amendments", payload: { allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 25 }], expected_supplier_contract_version: "${cv}" }, as: TeamAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /supplier-contracts/${sc}/amendments", payload: { allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 25 }], expected_supplier_contract_version: "${cv2}" }, as: TeamAdmin }
          assert:
            - "stale amendment rejected with http 412 and error_id == ERR_STALE_CONTRACT_VERSION"
            - "fresh amendment succeeds: allocation_caps GAME_JERSEY max_units == 25 and SupplierContract.${sc}.version == 3"

      - name: kit_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.KitAssignment"
          - "state_machines.KitAssignment"
        distinguishing_aspect: "Every mutation bumps version by exactly 1: create 1 -> issue 2 -> return 3."
        test_recipe:
          setup: ["pools stock 5; ACTIVE player; kit created"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Ver One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 77, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
          trigger:
            - { call: "POST /kit-assignments/${ka}/issue", payload: {}, as: EquipmentManager }
            - { call: "POST /kit-assignments/${ka}/return", payload: {}, as: EquipmentManager }
            - { call: "GET /kit-assignments/${ka}", payload: {}, as: EquipmentManager }
          assert:
            - "KitAssignment.${ka}.version == 3 (create 1, issue 2, return 3)"

      - name: stock_adjustment_triggers_auto_reorder
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.reorder_threshold_check"
          - "entities.KitOrder.fields.source"
        distinguishing_aspect: "The threshold crossing fires from a stock adjustment (not just kit reservations): dropping stock 10 -> 5 across reorder_point 6 auto-submits a reorder for (6-5-0)+5 = 6 units and commits them on the contract."
        test_recipe:
          setup: ["pool stock 10 point 6 batch 5; ACTIVE contract cap 50; pool version captured"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 6, reorder_batch_size: 5 }, as: EquipmentManager, captures: { jp: $.data.id, pv: $.data.version } }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "AUTOCO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 50 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
          trigger:
            - { call: "POST /inventory-pools/${jp}/stock-adjustments", payload: { new_stock_on_hand: 5, expected_pool_version: "${pv}" }, as: EquipmentManager }
            - { call: "GET /kit-orders", payload: { supplier_contract_id: "${sc}", source: "AUTO_REORDER" }, as: EquipmentManager }
          assert:
            - "InventoryPool.${jp}.stock_on_hand == 5 and available_quantity == 5"
            - "exactly one AUTO_REORDER order exists with lines[0].quantity == 6 and status == SUBMITTED"
            - "SupplierContract.${sc}.units_committed for GAME_JERSEY == 6"

      - name: event_complete_cascade_chain
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.GameEvent.KIT_LOCKED_to_COMPLETED"
        excluded_because:
          difficulty_instance: event_complete_laundry_reorder_contract_chain
          rationale: "Depth-3 cascade asserted there."

      - name: return_clears_reorder_block_cascade
        claim_type: cascading_side_effects
        grounds:
          - "calculations.reorder_threshold_check"
        excluded_because:
          difficulty_instance: kit_return_restock_clears_reorder_block
          rationale: "Restock -> flag-clear cascade asserted there."

  # =========================== consistency_model ===========================
  - section: consistency_model
    instances:
      - name: immediate_read_after_kit_reserve
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "calculations.pool_availability_reconciliation"
        distinguishing_aspect: "Immediate consistency: the kit-create response already shows RESERVED, and a pool read in the same logical instant reflects reserved 1 / available 4 without any reconciliation delay."
        test_recipe:
          setup: ["pools stock 5; ACTIVE player"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { jp: $.data.id } }
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_PANTS", size_code: "34", stock_on_hand: 5, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager, captures: { pp: $.data.id } }
            - { call: "POST /players", payload: { full_name: "Imm One", position_group: "OFFENSE" }, as: EquipmentManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /kit-assignments", payload: { player_id: "${p}", season_label: "2026-FALL", jersey_number: 78, jersey_pool_id: "${jp}", pants_pool_id: "${pp}" }, as: EquipmentManager, captures: { ka: $.data.id } }
            - { call: "GET /inventory-pools/${jp}", payload: {}, as: EquipmentManager }
          assert:
            - "create response: KitAssignment.${ka}.status == RESERVED in the same response"
            - "immediate read: InventoryPool.${jp}.reserved_quantity == 1 and available_quantity == 4"
