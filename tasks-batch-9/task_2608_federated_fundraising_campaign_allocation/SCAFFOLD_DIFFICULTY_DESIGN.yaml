        distinguishing_aspect: |
          A single designation line violates a business_referential rule (priority 26 - the target
          agency is still APPLICANT, so it may not receive donor designations) and a
          business_constraint rule (priority 31 - the line is 10.00, below MIN_DESIGNATION_AMOUNT
          25.00) at the same time. Both are 422s, so status code cannot disambiguate; only the
          declared priority order can. The categories crossed here (business_referential vs
          business_constraint) differ from the second instance's business_safety vs
          business_temporal pairing.
