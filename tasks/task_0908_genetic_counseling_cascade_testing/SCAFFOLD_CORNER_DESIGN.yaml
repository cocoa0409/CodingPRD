            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 40 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "PARENT", degree: 1, affected: false }, as: GeneticCounselor, as_user_id: "${cid}" }
