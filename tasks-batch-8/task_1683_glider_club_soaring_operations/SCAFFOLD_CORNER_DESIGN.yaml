      - name: member_suspend_cascades_future_reservations
        claim_type: side_effect_execution
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Manual suspend cancels the member's future BOOKED reservations but leaves RESIGNED-only surfaces (availability, roster) untouched — the cascade scope is exactly the BOOKED set."
        test_recipe:
          setup: ["member MS2 with one future BOOKED reservation RS2 (2026-09-03); clock 2026-08-31T12:00:00Z"]
          setup_api_calls:
