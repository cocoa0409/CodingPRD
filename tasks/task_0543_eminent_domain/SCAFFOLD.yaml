# =============================================================================
# PRD-bench seed tables — Eminent Domain & Right-of-Way Acquisition (Expert)
# SCAFFOLD.yaml  (§1.0–§1.7 + preamble)
# =============================================================================

scenario: |
  Eminent Domain & Right-of-Way Acquisition: parcel & ownership research,
  appraisal & just-compensation offer, negotiation & offer rounds,
  relocation-assistance benefit, condemnation filing & deposit, title/escrow &
  closing, possession & utility relocation, settlement/award tracking

domain_name: eminent-domain-row
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Parcel.version for appraisal supersede
    - cascading_side_effects        # possession → parcel → utility; finalize → parcel → project
    - dual_variant_calculation      # just-compensation basis + residential/business relocation
    - rate_threshold_triggers       # deposit >= statutory floor; good-faith round count

  entity_topology: flat             # peer entities linked by explicit foreign keys
  state_machine_shape: cyclic       # negotiation offer/counter rounds loop; parcel also parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # Escrow reads Negotiation/Condemnation agreed amounts
  role_model: peer_roles            # each role owns a distinct slice of the workflow
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Right-of-way program / project name" }
      - { name: agency_name, type: string, source: input, description: "Condemning agency name" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total acquisition budget in cents", constraints: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of Parcel.appraised_value_cents over parcels of this project whose acquisition_status IN {IN_NEGOTIATION, AGREED, IN_CONDEMNATION, POSSESSED}" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Sum of Escrow.agreed_amount_cents over this project's escrows whose status == CLOSED" }
      - { name: acquired_area_sqft, type: integer, source: computed, description: "Sum of Parcel.take_area_sqft over this project's parcels whose acquisition_status == ACQUIRED" }
      - { name: available_cents, type: integer, source: computed, description: "total_budget_cents - committed_cents - disbursed_cents" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: apn, type: string, source: input, description: "Assessor parcel number; unique within the project" }
      - { name: total_area_sqft, type: integer, source: input, description: "Total parcel area in square feet", constraints: "> 0" }
      - { name: take_area_sqft, type: integer, source: input, description: "Area being acquired; must be <= total_area_sqft", constraints: "> 0 and <= total_area_sqft" }
      - { name: take_type, type: enum, source: input, description: "FULL | PARTIAL" }
      - { name: research_status, type: enum, source: system, description: "RESEARCHING | OWNERSHIP_CLEARED — ownership-research dimension", default: RESEARCHING }
      - { name: acquisition_status, type: enum, source: system, description: "PENDING | IN_NEGOTIATION | AGREED | IN_CONDEMNATION | POSSESSED | ACQUIRED — acquisition-lifecycle dimension (independent of research_status)", default: PENDING }
      - { name: appraised_value_cents, type: integer, source: computed, description: "just_compensation_cents (offer basis) of this parcel's current FINALIZED appraisal; 0 when none", default: 0 }

  - name: OwnershipInterest
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: interest_type, type: enum, source: input, description: "FEE_OWNER | LIENHOLDER | TENANT | EASEMENT_HOLDER" }
      - { name: holder_name, type: string, source: input, description: "Name of the interest holder" }
      - { name: ownership_pct, type: number, source: input, description: "Percentage of fee ownership (0..100); only meaningful for FEE_OWNER", default: 0, constraints: "0 <= ownership_pct <= 100" }
      - { name: lien_priority, type: integer, source: input, description: "Payoff priority for LIENHOLDER; lower number is paid first", default: 0 }
      - { name: lien_balance_cents, type: integer, source: input, description: "Outstanding lien balance in cents (LIENHOLDER only)", default: 0 }
      - { name: is_occupant, type: boolean, source: input, description: "Whether this holder occupies the parcel and is relocation-eligible", default: false }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: appraiser_name, type: string, source: input, description: "Name of the appraiser of record" }
      - { name: land_value_cents, type: integer, source: input, description: "Fair-market value of the land taken, in cents", constraints: ">= 0" }
      - { name: improvements_value_cents, type: integer, source: input, description: "Value of improvements taken, in cents", constraints: ">= 0" }
      - { name: severance_damages_cents, type: integer, source: input, description: "Severance damages to the remainder, in cents", default: 0, constraints: ">= 0" }
      - { name: special_benefits_cents, type: integer, source: input, description: "Special benefits accruing to the remainder, in cents", default: 0, constraints: ">= 0" }
      - { name: just_compensation_cents, type: integer, source: computed, description: "Offer basis: land + improvements + max(0, severance - special_benefits)" }
      - { name: condemnation_basis_cents, type: integer, source: computed, description: "Condemnation deposit basis: land + improvements + severance (special benefits NOT offset)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED", default: DRAFT }

  - name: InspectionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: appraisal_id, type: string, source: input, description: "FK -> Appraisal.id" }
      - { name: appraiser_name, type: string, source: input, description: "Resource key: appointments for the same appraiser_name may not overlap" }
      - { name: start_at, type: datetime, source: input, description: "Inspection window start (ISO 8601 UTC), inclusive" }
      - { name: end_at, type: datetime, source: input, description: "Inspection window end (ISO 8601 UTC), exclusive; must be > start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED (only state)", default: SCHEDULED }

  - name: Negotiation
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: status, type: enum, source: system, description: "AGENCY_OFFERED | OWNER_COUNTERED | AGREED | IMPASSE", default: AGENCY_OFFERED }
      - { name: initial_offer_cents, type: integer, source: system, description: "Amount of the first AGENCY offer (round 1)" }
      - { name: current_amount_cents, type: integer, source: computed, description: "amount_cents of the most recent OFFER/COUNTER round" }
      - { name: round_count, type: integer, source: computed, description: "Total number of OfferRound rows for this negotiation" }
      - { name: agreed_amount_cents, type: integer, source: system, description: "Amount accepted when status becomes AGREED; 0 otherwise", default: 0 }
      - { name: prompt_bonus_cents, type: integer, source: computed, description: "Prompt-settlement bonus (see calculations); 0 unless AGREED at round_count <= 2", default: 0 }
      - { name: settlement_total_cents, type: integer, source: computed, description: "agreed_amount_cents + prompt_bonus_cents when AGREED; 0 otherwise", default: 0 }

  - name: OfferRound
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: negotiation_id, type: string, source: input, description: "FK -> Negotiation.id" }
      - { name: round_no, type: integer, source: system, description: "1-based sequence number within the negotiation" }
      - { name: party, type: enum, source: system, description: "AGENCY | OWNER — derived from the acting role" }
      - { name: action, type: enum, source: input, description: "OFFER | COUNTER | ACCEPT | REJECT" }
      - { name: amount_cents, type: integer, source: input, description: "Offered/countered amount in cents; required for OFFER and COUNTER, omitted for ACCEPT and REJECT", default: 0 }

  - name: RelocationBenefit
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: claimant_name, type: string, source: input, description: "Name of the relocating occupant" }
      - { name: occupant_type, type: enum, source: input, description: "RESIDENTIAL | BUSINESS — selects the benefit variant" }
      - { name: comparable_replacement_cost_cents, type: integer, source: input, description: "RESIDENTIAL: cost of comparable replacement dwelling", default: 0 }
      - { name: acquired_dwelling_price_cents, type: integer, source: input, description: "RESIDENTIAL: price paid for the acquired dwelling", default: 0 }
      - { name: moving_expense_cents, type: integer, source: input, description: "Documented moving expenses in cents", default: 0 }
      - { name: reestablishment_cost_cents, type: integer, source: input, description: "BUSINESS: documented reestablishment cost", default: 0 }
      - { name: benefit_amount_cents, type: integer, source: computed, description: "Computed relocation benefit (see calculations)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | PAID", default: SUBMITTED }

  - name: Condemnation
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: just_compensation_snapshot_cents, type: integer, source: system, description: "condemnation_basis_cents of the parcel's FINALIZED appraisal, captured at filing; the statutory deposit floor" }
      - { name: deposit_amount_cents, type: integer, source: system, description: "Amount deposited with the court; set by the deposit action", default: 0 }
      - { name: deposit_at, type: datetime, source: system, description: "Logical-clock time when the deposit was made" }
      - { name: possession_at, type: datetime, source: system, description: "Logical-clock time when possession was granted" }
      - { name: final_award_cents, type: integer, source: system, description: "Court-determined final award; set by the award action", default: 0 }
      - { name: statutory_interest_cents, type: integer, source: computed, description: "Interest on (final_award - deposit) from possession to award (see calculations)", default: 0 }
      - { name: settlement_total_cents, type: integer, source: computed, description: "final_award_cents + statutory_interest_cents when AWARDED; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | DEPOSIT_MADE | POSSESSED | AWARDED", default: FILED }

  - name: UtilityRelocation
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: utility_type, type: enum, source: input, description: "WATER | GAS | ELECTRIC | TELECOM | SEWER" }
      - { name: crew_name, type: string, source: system, description: "Resource key: SCHEDULED windows for the same crew_name must be >= CREW_BUFFER_MINUTES apart", default: "" }
      - { name: scheduled_start, type: datetime, source: system, description: "SCHEDULED window start (ISO 8601 UTC), inclusive" }
      - { name: scheduled_end, type: datetime, source: system, description: "SCHEDULED window end (ISO 8601 UTC), exclusive" }
      - { name: possession_cleared, type: boolean, source: system, description: "Set true when the owning Parcel reaches acquisition_status POSSESSED or ACQUIRED (cascade); gates scheduling", default: false }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | SCHEDULED | RELOCATED", default: IDENTIFIED }

  - name: Escrow
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: source, type: enum, source: input, description: "NEGOTIATED | CONDEMNATION — where agreed_amount_cents is drawn from" }
      - { name: agreed_amount_cents, type: integer, source: system, description: "For NEGOTIATED: Negotiation.settlement_total_cents; for CONDEMNATION: Condemnation.settlement_total_cents — captured at escrow creation" }
      - { name: funded_amount_cents, type: integer, source: system, description: "Amount funded into escrow; equals agreed_amount_cents on FUNDED", default: 0 }
      - { name: funded_at, type: datetime, source: system, description: "Logical-clock time when the escrow was funded" }
      - { name: disbursed_total_cents, type: integer, source: computed, description: "Sum of disbursements[].amount_cents; equals agreed_amount_cents when CLOSED, else 0" }
      - { name: disbursements, type: array, source: computed, description: "Waterfall payout rows [{payee_label, payee_kind, amount_cents}] populated on CLOSE" }
      - { name: status, type: enum, source: system, description: "OPENED | FUNDED | CLOSED | CANCELLED", default: OPENED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Parcel: parallel dimension 1 — ownership research -------------------
  - entity: Parcel
    field: research_status
    initial_state: RESEARCHING
    terminal_states: [OWNERSHIP_CLEARED]
    note: "Independent of acquisition_status; both dimensions evolve on the same Parcel row."
    transitions:
      - from: RESEARCHING
        to: OWNERSHIP_CLEARED
        trigger: "POST /parcels/{id}/clear-ownership"
        actor: RightOfWayAgent
        preconditions:
          - "Sum of ownership_pct over OwnershipInterest with interest_type == FEE_OWNER for this parcel == 100 (else ERR_OWNERSHIP_INCOMPLETE)"
        side_effects:
          - "research_status := OWNERSHIP_CLEARED"

  # ---- Parcel: parallel dimension 2 — acquisition lifecycle ----------------
  - entity: Parcel
    field: acquisition_status
    initial_state: PENDING
    terminal_states: [ACQUIRED]
    note: "Independent of research_status."
    transitions:
      - from: PENDING
        to: IN_NEGOTIATION
        trigger: "POST /parcels/{id}/negotiations (opening a negotiation)"
        actor: RightOfWayAgent
        preconditions:
          - "research_status == OWNERSHIP_CLEARED (else ERR_OWNERSHIP_NOT_CLEARED)"
          - "Parcel has a FINALIZED Appraisal (else ERR_APPRAISAL_NOT_FINALIZED)"
        side_effects:
          - "acquisition_status := IN_NEGOTIATION"
          - "Project.committed_cents recomputed (parcel now contributes appraised_value_cents)"
      - from: IN_NEGOTIATION
        to: AGREED
        trigger: "OfferRound ACCEPT that moves the Negotiation to AGREED"
        actor: system
        side_effects:
          - "acquisition_status := AGREED"
      - from: IN_NEGOTIATION
        to: IN_CONDEMNATION
        trigger: "POST /parcels/{id}/condemnations"
        actor: RightOfWayAgent
        side_effects:
          - "acquisition_status := IN_CONDEMNATION"
      - from: IN_CONDEMNATION
        to: POSSESSED
        trigger: "POST /condemnations/{id}/grant-possession"
        actor: ProgramAdmin
        side_effects:
          - "acquisition_status := POSSESSED"
          - "CASCADE: every UtilityRelocation for this parcel with possession_cleared == false has possession_cleared := true"
      - from: AGREED
        to: ACQUIRED
        trigger: "POST /escrows/{id}/close (source NEGOTIATED)"
        actor: EscrowOfficer
        side_effects:
          - "acquisition_status := ACQUIRED"
          - "Project.acquired_area_sqft increases by take_area_sqft"
          - "Project.committed_cents decreases (parcel leaves committed set); Project.disbursed_cents increases"
      - from: POSSESSED
        to: ACQUIRED
        trigger: "POST /escrows/{id}/close (source CONDEMNATION)"
        actor: EscrowOfficer
        side_effects:
          - "acquisition_status := ACQUIRED"
          - "Project.acquired_area_sqft increases by take_area_sqft"
          - "Project.committed_cents decreases; Project.disbursed_cents increases"
      - from: ACQUIRED
        to: PENDING
        trigger: "POST /escrows/{id}/rescind (compensating action)"
        actor: ProgramAdmin
        side_effects:
          - "acquisition_status := PENDING"
          - "Project.acquired_area_sqft decreases by take_area_sqft (returns to pre-close value)"
          - "Project.disbursed_cents decreases (escrow leaves CLOSED set)"

  # ---- Appraisal -----------------------------------------------------------
  - entity: Appraisal
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /appraisals/{id}/finalize"
        actor: Appraiser
        side_effects:
          - "Any other FINALIZED appraisal for the same parcel transitions FINALIZED -> SUPERSEDED"
          - "CASCADE: Parcel.appraised_value_cents := this appraisal.just_compensation_cents; that parcel change recomputes Project.committed_cents when the parcel is in a committed acquisition_status"
          - "increments Parcel.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /parcels/{id}/appraisals (a newer DRAFT appraisal is created for the parcel)"
        actor: Appraiser
        side_effects:
          - "prior DRAFT appraisal status := SUPERSEDED"

  # ---- Negotiation: CYCLIC (offer/counter rounds) --------------------------
  - entity: Negotiation
    field: status
    initial_state: AGENCY_OFFERED
    terminal_states: [AGREED, IMPASSE]
    note: "Cyclic: AGENCY_OFFERED <-> OWNER_COUNTERED alternate until ACCEPT/REJECT."
    transitions:
      - from: AGENCY_OFFERED
        to: OWNER_COUNTERED
        trigger: "POST /negotiations/{id}/rounds (action COUNTER)"
        actor: PropertyOwner
        preconditions:
          - "It is the owner's turn: status == AGENCY_OFFERED (else ERR_NOT_YOUR_TURN)"
          - "amount_cents present"
        side_effects:
          - "append OfferRound(party=OWNER, action=COUNTER, round_no=round_count+1)"
          - "status := OWNER_COUNTERED; current_amount_cents := amount_cents"
      - from: OWNER_COUNTERED
        to: AGENCY_OFFERED
        trigger: "POST /negotiations/{id}/rounds (action COUNTER or OFFER)"
        actor: RightOfWayAgent
        preconditions:
          - "It is the agency's turn: status == OWNER_COUNTERED (else ERR_NOT_YOUR_TURN)"
          - "amount_cents present"
        side_effects:
          - "append OfferRound(party=AGENCY, action=COUNTER, round_no=round_count+1)"
          - "status := AGENCY_OFFERED; current_amount_cents := amount_cents"
      - from: AGENCY_OFFERED
        to: AGREED
        trigger: "POST /negotiations/{id}/rounds (action ACCEPT)"
        actor: PropertyOwner
        preconditions:
          - "status == AGENCY_OFFERED (owner accepts the standing agency offer)"
        side_effects:
          - "append OfferRound(party=OWNER, action=ACCEPT, round_no=round_count+1)"
          - "agreed_amount_cents := current_amount_cents (standing agency amount)"
          - "compute prompt_bonus_cents and settlement_total_cents"
          - "CASCADE: Parcel.acquisition_status IN_NEGOTIATION -> AGREED"
      - from: OWNER_COUNTERED
        to: AGREED
        trigger: "POST /negotiations/{id}/rounds (action ACCEPT)"
        actor: RightOfWayAgent
        preconditions:
          - "status == OWNER_COUNTERED (agency accepts the standing owner counter)"
        side_effects:
          - "append OfferRound(party=AGENCY, action=ACCEPT, round_no=round_count+1)"
          - "agreed_amount_cents := current_amount_cents (standing owner amount)"
          - "compute prompt_bonus_cents and settlement_total_cents"
          - "CASCADE: Parcel.acquisition_status IN_NEGOTIATION -> AGREED"
      - from: AGENCY_OFFERED
        to: IMPASSE
        trigger: "POST /negotiations/{id}/rounds (action REJECT)"
        actor: PropertyOwner
        side_effects:
          - "append OfferRound(party=OWNER, action=REJECT, round_no=round_count+1)"
          - "status := IMPASSE"
      - from: OWNER_COUNTERED
        to: IMPASSE
        trigger: "POST /negotiations/{id}/rounds (action REJECT)"
        actor: RightOfWayAgent
        side_effects:
          - "append OfferRound(party=AGENCY, action=REJECT, round_no=round_count+1)"
          - "status := IMPASSE"

  # ---- RelocationBenefit ---------------------------------------------------
  - entity: RelocationBenefit
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /relocation-benefits/{id}/approve"
        actor: RightOfWayAgent
        side_effects:
          - "status := APPROVED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /relocation-benefits/{id}/deny"
        actor: RightOfWayAgent
        side_effects:
          - "status := DENIED"
      - from: APPROVED
        to: PAID
        trigger: "POST /relocation-benefits/{id}/pay"
        actor: EscrowOfficer
        side_effects:
          - "status := PAID"

  # ---- Condemnation --------------------------------------------------------
  - entity: Condemnation
    field: status
    initial_state: FILED
    terminal_states: [AWARDED]
    transitions:
      - from: FILED
        to: DEPOSIT_MADE
        trigger: "POST /condemnations/{id}/deposit"
        actor: RightOfWayAgent
        preconditions:
          - "status == FILED (else ERR_INVALID_CONDEMNATION_STATE)"
          - "deposit_amount_cents >= just_compensation_snapshot_cents (else ERR_DEPOSIT_BELOW_COMPENSATION)"
        side_effects:
          - "deposit_amount_cents := input; deposit_at := logical clock; status := DEPOSIT_MADE"
      - from: DEPOSIT_MADE
        to: POSSESSED
        trigger: "POST /condemnations/{id}/grant-possession"
        actor: ProgramAdmin
        side_effects:
          - "possession_at := logical clock; status := POSSESSED"
          - "CASCADE: Parcel.acquisition_status IN_CONDEMNATION -> POSSESSED (which in turn flips UtilityRelocation.possession_cleared)"
      - from: POSSESSED
        to: AWARDED
        trigger: "POST /condemnations/{id}/award"
        actor: ProgramAdmin
        side_effects:
          - "final_award_cents := input; compute statutory_interest_cents and settlement_total_cents; status := AWARDED"

  # ---- UtilityRelocation ---------------------------------------------------
  - entity: UtilityRelocation
    field: status
    initial_state: IDENTIFIED
    terminal_states: [RELOCATED]
    transitions:
      - from: IDENTIFIED
        to: SCHEDULED
        trigger: "POST /utility-relocations/{id}/schedule"
        actor: UtilityCoordinator
        preconditions:
          - "possession_cleared == true, i.e. Parcel.acquisition_status IN {POSSESSED, ACQUIRED} (else ERR_PARCEL_NOT_POSSESSED)"
          - "No other SCHEDULED UtilityRelocation for the same crew_name whose [scheduled_start, scheduled_end) is within CREW_BUFFER_MINUTES of this window (else ERR_CREW_UNAVAILABLE)"
        side_effects:
          - "crew_name, scheduled_start, scheduled_end := input; status := SCHEDULED"
      - from: SCHEDULED
        to: RELOCATED
        trigger: "POST /utility-relocations/{id}/complete"
        actor: UtilityCoordinator
        side_effects:
          - "status := RELOCATED"

  # ---- Escrow --------------------------------------------------------------
  - entity: Escrow
    field: status
    initial_state: OPENED
    terminal_states: [CANCELLED]
    transitions:
      - from: OPENED
        to: FUNDED
        trigger: "POST /escrows/{id}/fund"
        actor: EscrowOfficer
        preconditions:
          - "Project.available_cents >= agreed_amount_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "funded_amount_cents := agreed_amount_cents; funded_at := logical clock; status := FUNDED"
      - from: FUNDED
        to: CLOSED
        trigger: "POST /escrows/{id}/close"
        actor: EscrowOfficer
        preconditions:
          - "Sum of ownership_pct over FEE_OWNER interests of the parcel == 100 (else ERR_OWNERSHIP_INCOMPLETE)"
          - "logical clock >= funded_at + ESCROW_WAITING_PERIOD_DAYS days (else ERR_WAITING_PERIOD_ACTIVE)"
        side_effects:
          - "run disbursement_waterfall; populate disbursements[]; disbursed_total_cents := agreed_amount_cents; status := CLOSED"
          - "CASCADE: Parcel.acquisition_status -> ACQUIRED; Project.disbursed_cents and Project.acquired_area_sqft recomputed"
      - from: OPENED
        to: CANCELLED
        trigger: "POST /escrows/{id}/rescind"
        actor: ProgramAdmin
        side_effects:
          - "status := CANCELLED"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /escrows/{id}/rescind"
        actor: ProgramAdmin
        side_effects:
          - "status := CANCELLED"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /escrows/{id}/rescind (compensating action)"
        actor: ProgramAdmin
        side_effects:
          - "status := CANCELLED; disbursements[] cleared; disbursed_total_cents := 0"
          - "CASCADE: Parcel.acquisition_status ACQUIRED -> PENDING; Project.disbursed_cents decreases; Project.acquired_area_sqft decreases (both return to pre-close values)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appraisal-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /parcels/{id}/appraisals"
    occ_field: "expected_parcel_version"
    description: |
      Creating a new Appraisal against a Parcel whose version has advanced since
      the client last observed it is rejected. A new appraisal legitimately
      supersedes the parcel's prior draft/valuation and recomputes
      appraised_value_cents, so a create carrying a stale expected_parcel_version
      is working from an outdated view of the parcel and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: just_compensation
    trigger: "Appraisal create and finalize (recomputed on write)"
    algorithm: threshold
    formula: |
      offer_basis (just_compensation_cents) =
          land_value_cents
        + improvements_value_cents
        + max(0, severance_damages_cents - special_benefits_cents)
      condemnation_basis (condemnation_basis_cents) =
          land_value_cents + improvements_value_cents + severance_damages_cents
    input_set: "Fields of the single Appraisal being written"
    precision: "integer cents; no rounding required (all inputs are integer cents)"
    variants:
      - name: offer_basis
        when: "Used for the agency offer floor (Parcel.appraised_value_cents; negotiation initial-offer minimum)"
        difference: "Special benefits offset severance damages, floored at 0 for the severance term"
      - name: condemnation_basis
        when: "Used as the statutory deposit floor snapshotted at condemnation filing"
        difference: "Special benefits are NOT offset; the two bases differ by exactly min(severance_damages, special_benefits)"

  - name: relocation_benefit
    trigger: "POST /parcels/{id}/relocation-benefits (submit)"
    algorithm: threshold
    formula: |
      RESIDENTIAL:
        benefit_amount_cents =
            min(RESIDENTIAL_REPLACEMENT_CAP_CENTS,
                max(0, comparable_replacement_cost_cents - acquired_dwelling_price_cents))
          + moving_expense_cents
      BUSINESS:
        benefit_amount_cents =
            min(BUSINESS_REESTABLISHMENT_CAP_CENTS, reestablishment_cost_cents)
          + moving_expense_cents
    input_set: "Fields of the single RelocationBenefit being written; occupant_type selects the variant"
    constants:
      RESIDENTIAL_REPLACEMENT_CAP_CENTS: 3150000
      BUSINESS_REESTABLISHMENT_CAP_CENTS: 5000000
    precision: "integer cents"
    variants:
      - name: residential
        when: "occupant_type == RESIDENTIAL"
        difference: "Replacement-housing differential capped at RESIDENTIAL_REPLACEMENT_CAP_CENTS plus moving expense"
      - name: business
        when: "occupant_type == BUSINESS"
        difference: "Reestablishment cost capped at BUSINESS_REESTABLISHMENT_CAP_CENTS plus moving expense"

  - name: disbursement_waterfall
    trigger: "POST /escrows/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      pool = agreed_amount_cents
      # 1) Pay LIENHOLDER interests in ascending lien_priority (tie-break: created_at ASC).
      for lh in LIENHOLDERs sorted by (lien_priority ASC, created_at ASC):
          pay = min(pool, lh.lien_balance_cents)
          disbursement(payee_kind=LIENHOLDER, amount=pay); pool -= pay
      # 2) Split the remaining pool among FEE_OWNERs by ownership_pct.
      #    Rounding order is PINNED: compute each raw share = pool * ownership_pct / 100,
      #    round_half_up each to the cent, then set delta = pool - sum(rounded_shares)
      #    and add delta to the FEE_OWNER with the earliest created_at.
      raw[o]     = pool * o.ownership_pct / 100
      rounded[o] = round_half_up(raw[o])
      delta      = pool - sum(rounded[o])
      rounded[earliest_created_fee_owner] += delta
      disbursement(payee_kind=FEE_OWNER, amount=rounded[o]) for each o
    input_set: "OwnershipInterest rows of the parcel (LIENHOLDER + FEE_OWNER); Escrow.agreed_amount_cents"
    precision: "integer cents; round_half_up per fee-owner share, remainder to earliest-created fee owner"
    note: "Invariant: sum(disbursements[].amount_cents) == agreed_amount_cents exactly (see §1.9 conservation)."

  - name: statutory_interest_settlement
    trigger: "POST /condemnations/{id}/award"
    algorithm: aggregation
    formula: |
      days = floor((possession_to_award interval) in whole days) =
             floor((award_clock - possession_at) / 86400 seconds)
      statutory_interest_cents =
             round_half_up((final_award_cents - deposit_amount_cents)
                           * STATUTORY_DAILY_INTEREST_RATE * days)
      settlement_total_cents = final_award_cents + statutory_interest_cents
    input_set: "The single Condemnation: final_award_cents, deposit_amount_cents, possession_at, current clock"
    constants:
      STATUTORY_DAILY_INTEREST_RATE: 0.0001
    precision: "integer cents; round_half_up on the interest term"
    note: "deposit_amount_cents was validated >= just_compensation_snapshot_cents at deposit time."

  - name: prompt_settlement_bonus
    trigger: "Negotiation reaches AGREED (ACCEPT round)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking: settlement_total = agreed + bonus, and bonus is a tiered
      # percentage. Evaluation order is PINNED: the tier is keyed on agreed_amount_cents
      # (the BASE), never on settlement_total_cents.
      if round_count > PROMPT_BONUS_MAX_ROUND:
          prompt_bonus_cents = 0
      else:
          pct = PROMPT_BONUS_LOW_PCT  if agreed_amount_cents <= PROMPT_BONUS_TIER_THRESHOLD_CENTS
                else PROMPT_BONUS_HIGH_PCT
          prompt_bonus_cents = round_half_up(agreed_amount_cents * pct)
      settlement_total_cents = agreed_amount_cents + prompt_bonus_cents
    input_set: "The single Negotiation: agreed_amount_cents, round_count"
    constants:
      PROMPT_BONUS_TIER_THRESHOLD_CENTS: 25000000
      PROMPT_BONUS_LOW_PCT: 0.03
      PROMPT_BONUS_HIGH_PCT: 0.05
      PROMPT_BONUS_MAX_ROUND: 2
    precision: "integer cents; round_half_up on the bonus term"
    note: "round_count is the total OfferRound count at the moment of AGREED (including the ACCEPT round)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this operation (per §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resource ids in the path exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "PropertyOwner acting on a parcel resource must be an OwnershipInterest of that parcel (X-User-ID == OwnershipInterest.id and its parcel_id matches the path parcel)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "negotiation rounds (owner actions), relocation-benefit submit"

  - priority: 5
    category: business_constraint
    check: "Request body is well-formed: required fields present, enum values valid, numeric constraints satisfied (e.g., take_area_sqft <= total_area_sqft, end_at > start_at)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: "domain state error (ERR_INVALID_PARCEL_STATE, ERR_INVALID_APPRAISAL_STATE, ERR_INVALID_NEGOTIATION_STATE, ERR_INVALID_CONDEMNATION_STATE, ERR_INVALID_RELOCATION_STATE, ERR_INVALID_ESCROW_STATE, ERR_INVALID_UTILITY_STATE)"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "Turn ordering on negotiation rounds: owner may act only when AGENCY_OFFERED; agency only when OWNER_COUNTERED"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    applies_to: "POST /negotiations/{id}/rounds"

  - priority: 8
    category: concurrency
    check: "expected_parcel_version matches Parcel.version (OCC on appraisal create)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /parcels/{id}/appraisals"

  - priority: 9
    category: business_referential
    check: "Ownership completeness: sum of FEE_OWNER ownership_pct for the parcel == 100"
    error_id: ERR_OWNERSHIP_INCOMPLETE
    http_status: 422
    applies_to: "POST /parcels/{id}/clear-ownership, POST /escrows/{id}/close"

  - priority: 10
    category: business_constraint
    check: "Cross-entity readiness: parcel ownership cleared / appraisal finalized / good-faith negotiation attempted / occupant eligibility"
    error_id: "ERR_OWNERSHIP_NOT_CLEARED, ERR_APPRAISAL_NOT_FINALIZED, ERR_NEGOTIATION_NOT_ATTEMPTED, ERR_NOT_OCCUPANT, ERR_PARCEL_NOT_POSSESSED"
    http_status: 422
    applies_to: "negotiation open, condemnation filing, relocation submit, utility schedule"

  - priority: 11
    category: business_temporal
    check: "Temporal-overlap and waiting-period rules: appraiser appointment overlap, crew buffer overlap, escrow waiting period"
    error_id: "ERR_APPRAISER_DOUBLE_BOOKED, ERR_CREW_UNAVAILABLE, ERR_WAITING_PERIOD_ACTIVE"
    http_status: 409
    applies_to: "inspection-appointments create, utility schedule, escrow close"

  - priority: 12
    category: business_fiscal
    check: "Fiscal floors and ceilings: initial offer >= appraised value; deposit >= condemnation basis floor; escrow fund within available budget"
    error_id: "ERR_OFFER_BELOW_APPRAISED, ERR_DEPOSIT_BELOW_COMPENSATION, ERR_BUDGET_EXCEEDED"
    http_status: 402
    applies_to: "negotiation open, condemnation deposit, escrow fund"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

  # ---- Project ------------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Create a right-of-way project"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "agency_name", "total_budget_cents"]
    output: Project
    side_effects: ["committed/disbursed/acquired initialized to 0; available_cents := total_budget_cents"]
  - method: GET
    path: "/projects/{id}"
    description: "Get a project (with computed ledger fields)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects/{id}/parcels"
    description: "List parcels of a project (reverse lookup for Parcel.project_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  # ---- Parcel -------------------------------------------------------------
  - method: POST
    path: "/parcels"
    description: "Create a parcel under a project"
    roles: [RightOfWayAgent]
    code: 201
    input: ["project_id", "apn", "total_area_sqft", "take_area_sqft", "take_type"]
    output: Parcel
    side_effects: ["research_status := RESEARCHING; acquisition_status := PENDING; appraised_value_cents := 0"]
  - method: GET
    path: "/parcels/{id}"
    description: "Get a parcel"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: POST
    path: "/parcels/{id}/clear-ownership"
    description: "Mark ownership research complete for a parcel"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: Parcel
    side_effects: ["research_status := OWNERSHIP_CLEARED (requires FEE_OWNER pct sum == 100)"]

  # ---- OwnershipInterest --------------------------------------------------
  - method: POST
    path: "/parcels/{id}/ownership-interests"
    description: "Record an ownership/lien/tenancy interest on a parcel"
    roles: [RightOfWayAgent]
    code: 201
    input: ["interest_type", "holder_name", "ownership_pct?", "lien_priority?", "lien_balance_cents?", "is_occupant?"]
    output: OwnershipInterest
    side_effects: []
  - method: GET
    path: "/parcels/{id}/ownership-interests"
    description: "List ownership interests of a parcel (reverse lookup for OwnershipInterest.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: OwnershipInterest[]
    side_effects: []

  # ---- Appraisal ----------------------------------------------------------
  - method: POST
    path: "/parcels/{id}/appraisals"
    description: "Create a draft appraisal for a parcel (OCC-guarded supersede via expected_parcel_version)"
    roles: [Appraiser]
    code: 201
    input: ["appraiser_name", "land_value_cents", "improvements_value_cents", "severance_damages_cents?", "special_benefits_cents?", "expected_parcel_version"]
    output: Appraisal
    side_effects: ["status := DRAFT; compute just_compensation_cents and condemnation_basis_cents; any prior DRAFT appraisal for the parcel -> SUPERSEDED; increments Parcel.version by 1"]
  - method: GET
    path: "/appraisals/{id}"
    description: "Get an appraisal"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: GET
    path: "/parcels/{id}/appraisals"
    description: "List appraisals of a parcel (reverse lookup for Appraisal.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Appraisal[]
    side_effects: []
  - method: POST
    path: "/appraisals/{id}/finalize"
    description: "Finalize a draft appraisal"
    roles: [Appraiser]
    code: 200
    input: []
    output: Appraisal
    side_effects: ["status DRAFT -> FINALIZED; prior FINALIZED -> SUPERSEDED; Parcel.appraised_value_cents := just_compensation_cents; Project.committed_cents recomputed; increments Parcel.version by 1"]

  # ---- InspectionAppointment ----------------------------------------------
  - method: POST
    path: "/appraisals/{id}/inspection-appointments"
    description: "Schedule an appraiser inspection window (overlap-checked per appraiser_name)"
    roles: [Appraiser]
    code: 201
    input: ["appraiser_name", "start_at", "end_at"]
    output: InspectionAppointment
    side_effects: ["status := SCHEDULED (rejected if [start_at,end_at) overlaps an existing appointment for the same appraiser_name)"]
  - method: GET
    path: "/appraisals/{id}/inspection-appointments"
    description: "List inspection appointments of an appraisal (reverse lookup for InspectionAppointment.appraisal_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: InspectionAppointment[]
    side_effects: []

  # ---- Negotiation --------------------------------------------------------
  - method: POST
    path: "/parcels/{id}/negotiations"
    description: "Open a negotiation with an initial agency offer"
    roles: [RightOfWayAgent]
    code: 201
    input: ["initial_offer_cents"]
    output: Negotiation
    side_effects: ["status := AGENCY_OFFERED; append OfferRound(round_no=1, party=AGENCY, action=OFFER, amount=initial_offer_cents); Parcel.acquisition_status PENDING -> IN_NEGOTIATION; Project.committed_cents recomputed"]
  - method: GET
    path: "/negotiations/{id}"
    description: "Get a negotiation"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Negotiation
    side_effects: []
  - method: GET
    path: "/parcels/{id}/negotiations"
    description: "List negotiations of a parcel (reverse lookup for Negotiation.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Negotiation[]
    side_effects: []
  - method: POST
    path: "/negotiations/{id}/rounds"
    description: "Append an offer round (OFFER/COUNTER/ACCEPT/REJECT); turn- and role-gated"
    roles: [RightOfWayAgent, PropertyOwner]
    code: 201
    input: ["action", "amount_cents?"]
    output: OfferRound
    side_effects: ["append OfferRound; advance/terminate Negotiation per §1.2; on AGREED compute prompt_bonus_cents/settlement_total_cents and cascade Parcel.acquisition_status -> AGREED"]
  - method: GET
    path: "/negotiations/{id}/rounds"
    description: "List offer rounds of a negotiation (reverse lookup for OfferRound.negotiation_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: OfferRound[]
    side_effects: []

  # ---- Condemnation -------------------------------------------------------
  - method: POST
    path: "/parcels/{id}/condemnations"
    description: "File a condemnation action for a parcel"
    roles: [RightOfWayAgent]
    code: 201
    input: []
    output: Condemnation
    side_effects: ["requires OWNERSHIP_CLEARED, a FINALIZED appraisal, and a Negotiation with round_count >= 1 (good-faith attempt); status := FILED; just_compensation_snapshot_cents := parcel's FINALIZED condemnation_basis_cents; Parcel.acquisition_status IN_NEGOTIATION -> IN_CONDEMNATION"]
  - method: GET
    path: "/condemnations/{id}"
    description: "Get a condemnation"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Condemnation
    side_effects: []
  - method: GET
    path: "/parcels/{id}/condemnations"
    description: "List condemnations of a parcel (reverse lookup for Condemnation.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Condemnation[]
    side_effects: []
  - method: POST
    path: "/condemnations/{id}/deposit"
    description: "Deposit statutory just-compensation with the court"
    roles: [RightOfWayAgent]
    code: 200
    input: ["deposit_amount_cents"]
    output: Condemnation
    side_effects: ["requires status FILED and deposit_amount_cents >= just_compensation_snapshot_cents; status := DEPOSIT_MADE; deposit_at := clock"]
  - method: POST
    path: "/condemnations/{id}/grant-possession"
    description: "Court grants order of possession"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Condemnation
    side_effects: ["status DEPOSIT_MADE -> POSSESSED; possession_at := clock; cascade Parcel.acquisition_status -> POSSESSED, flipping UtilityRelocation.possession_cleared"]
  - method: POST
    path: "/condemnations/{id}/award"
    description: "Enter the final award; computes statutory interest and settlement total"
    roles: [ProgramAdmin]
    code: 200
    input: ["final_award_cents"]
    output: Condemnation
    side_effects: ["status POSSESSED -> AWARDED; final_award_cents := input; compute statutory_interest_cents and settlement_total_cents"]

  # ---- RelocationBenefit --------------------------------------------------
  - method: POST
    path: "/parcels/{id}/relocation-benefits"
    description: "Submit a relocation-assistance claim (occupant only)"
    roles: [PropertyOwner]
    code: 201
    input: ["claimant_name", "occupant_type", "comparable_replacement_cost_cents?", "acquired_dwelling_price_cents?", "moving_expense_cents?", "reestablishment_cost_cents?"]
    output: RelocationBenefit
    side_effects: ["requires the acting OwnershipInterest to have is_occupant == true (ERR_NOT_OCCUPANT); status := SUBMITTED; compute benefit_amount_cents"]
  - method: GET
    path: "/relocation-benefits/{id}"
    description: "Get a relocation benefit"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: RelocationBenefit
    side_effects: []
  - method: GET
    path: "/parcels/{id}/relocation-benefits"
    description: "List relocation benefits of a parcel (reverse lookup for RelocationBenefit.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: RelocationBenefit[]
    side_effects: []
  - method: POST
    path: "/relocation-benefits/{id}/approve"
    description: "Approve a submitted relocation benefit"
    roles: [RightOfWayAgent]
    code: 200
    input: []
    output: RelocationBenefit
    side_effects: ["status SUBMITTED -> APPROVED"]
  - method: POST
    path: "/relocation-benefits/{id}/deny"
    description: "Deny a submitted relocation benefit"
    roles: [RightOfWayAgent]
    code: 200
    input: ["reason"]
    output: RelocationBenefit
    side_effects: ["status SUBMITTED -> DENIED"]
  - method: POST
    path: "/relocation-benefits/{id}/pay"
    description: "Pay an approved relocation benefit"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: RelocationBenefit
    side_effects: ["status APPROVED -> PAID"]

  # ---- UtilityRelocation --------------------------------------------------
  - method: POST
    path: "/parcels/{id}/utility-relocations"
    description: "Identify a utility that must be relocated for a parcel"
    roles: [UtilityCoordinator]
    code: 201
    input: ["utility_type"]
    output: UtilityRelocation
    side_effects: ["status := IDENTIFIED; possession_cleared := (parcel already POSSESSED/ACQUIRED)"]
  - method: GET
    path: "/utility-relocations/{id}"
    description: "Get a utility relocation"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: UtilityRelocation
    side_effects: []
  - method: GET
    path: "/parcels/{id}/utility-relocations"
    description: "List utility relocations of a parcel (reverse lookup for UtilityRelocation.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: UtilityRelocation[]
    side_effects: []
  - method: POST
    path: "/utility-relocations/{id}/schedule"
    description: "Schedule a crew window (requires possession; crew-buffer overlap checked)"
    roles: [UtilityCoordinator]
    code: 200
    input: ["crew_name", "scheduled_start", "scheduled_end"]
    output: UtilityRelocation
    side_effects: ["requires possession_cleared == true; status IDENTIFIED -> SCHEDULED; crew/window set (rejected on crew buffer overlap)"]
  - method: POST
    path: "/utility-relocations/{id}/complete"
    description: "Mark a utility relocation complete"
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: UtilityRelocation
    side_effects: ["status SCHEDULED -> RELOCATED"]

  # ---- Escrow -------------------------------------------------------------
  - method: POST
    path: "/parcels/{id}/escrows"
    description: "Open escrow for an agreed or awarded acquisition"
    roles: [EscrowOfficer]
    code: 201
    input: ["source"]
    output: Escrow
    side_effects: ["source NEGOTIATED requires Negotiation AGREED; source CONDEMNATION requires Condemnation AWARDED; status := OPENED; agreed_amount_cents := source's settlement_total_cents"]
  - method: GET
    path: "/escrows/{id}"
    description: "Get an escrow (with disbursements when CLOSED)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: []
    output: Escrow
    side_effects: []
  - method: GET
    path: "/parcels/{id}/escrows"
    description: "List escrows of a parcel (reverse lookup for Escrow.parcel_id)"
    roles: [ProgramAdmin, RightOfWayAgent, Appraiser, PropertyOwner, EscrowOfficer, UtilityCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Escrow[]
    side_effects: []
  - method: POST
    path: "/escrows/{id}/fund"
    description: "Fund the escrow from project budget"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: Escrow
    side_effects: ["requires Project.available_cents >= agreed_amount_cents; status OPENED -> FUNDED; funded_amount_cents := agreed_amount_cents; funded_at := clock"]
  - method: POST
    path: "/escrows/{id}/close"
    description: "Close escrow, run the disbursement waterfall, and complete acquisition"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: Escrow
    side_effects: ["requires FEE_OWNER pct sum == 100 and clock >= funded_at + ESCROW_WAITING_PERIOD_DAYS; run disbursement_waterfall; status FUNDED -> CLOSED; cascade Parcel -> ACQUIRED; recompute Project.disbursed_cents/acquired_area_sqft"]
  - method: POST
    path: "/escrows/{id}/rescind"
    description: "Rescind an escrow (compensating action); reverses a CLOSED escrow's disbursement"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Escrow
    side_effects: ["status -> CANCELLED; if previously CLOSED: clear disbursements, cascade Parcel ACQUIRED -> PENDING, decrement Project.disbursed_cents and acquired_area_sqft back to pre-close values"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "PropertyOwner's X-User-ID is not an OwnershipInterest of the target parcel" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, or numeric constraint violation (e.g., take_area_sqft > total_area_sqft, end_at <= start_at, negative amount)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of range (limit 1..100, offset >= 0)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_parcel_version does not match current Parcel.version on appraisal create" }
  - { id: ERR_INVALID_PARCEL_STATE, http: 409, condition: "Parcel not in a research/acquisition state permitting the operation" }
  - { id: ERR_INVALID_APPRAISAL_STATE, http: 409, condition: "Appraisal not in DRAFT when finalize is attempted" }
  - { id: ERR_INVALID_NEGOTIATION_STATE, http: 409, condition: "Negotiation already terminal (AGREED/IMPASSE) when a round is attempted" }
  - { id: ERR_NOT_YOUR_TURN, http: 409, condition: "Round submitted by the party whose turn it is not" }
  - { id: ERR_INVALID_CONDEMNATION_STATE, http: 409, condition: "Condemnation not in the required state for deposit/possession/award" }
  - { id: ERR_INVALID_RELOCATION_STATE, http: 409, condition: "RelocationBenefit not in the required state for approve/deny/pay" }
  - { id: ERR_INVALID_ESCROW_STATE, http: 409, condition: "Escrow not in the required state for fund/close/rescind" }
  - { id: ERR_INVALID_UTILITY_STATE, http: 409, condition: "UtilityRelocation not in the required state for schedule/complete" }
  - { id: ERR_OWNERSHIP_INCOMPLETE, http: 422, condition: "Sum of FEE_OWNER ownership_pct for the parcel != 100" }
  - { id: ERR_OWNERSHIP_NOT_CLEARED, http: 422, condition: "Parcel.research_status != OWNERSHIP_CLEARED when a negotiation is opened" }
  - { id: ERR_APPRAISAL_NOT_FINALIZED, http: 422, condition: "Parcel has no FINALIZED appraisal when required (negotiation open, condemnation filing)" }
  - { id: ERR_NEGOTIATION_NOT_ATTEMPTED, http: 422, condition: "Condemnation filed with no Negotiation or a Negotiation with round_count < 1 (no good-faith offer)" }
  - { id: ERR_NOT_OCCUPANT, http: 422, condition: "Relocation claim by an OwnershipInterest whose is_occupant == false" }
  - { id: ERR_PARCEL_NOT_POSSESSED, http: 409, condition: "Utility relocation scheduled before the parcel reached POSSESSED/ACQUIRED (possession_cleared == false)" }
  - { id: ERR_APPRAISER_DOUBLE_BOOKED, http: 409, condition: "Inspection window overlaps an existing appointment for the same appraiser_name" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Crew window is within CREW_BUFFER_MINUTES of another SCHEDULED window for the same crew_name" }
  - { id: ERR_WAITING_PERIOD_ACTIVE, http: 409, condition: "Escrow close attempted before funded_at + ESCROW_WAITING_PERIOD_DAYS" }
  - { id: ERR_OFFER_BELOW_APPRAISED, http: 402, condition: "initial_offer_cents < Parcel.appraised_value_cents" }
  - { id: ERR_DEPOSIT_BELOW_COMPENSATION, http: 402, condition: "deposit_amount_cents < Condemnation.just_compensation_snapshot_cents" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Escrow fund would exceed Project.available_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program administrator / court proxy: projects, budget, judicial actions (possession, award), rescission, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /projects"
      - "POST /condemnations/{id}/grant-possession"
      - "POST /condemnations/{id}/award"
      - "POST /escrows/{id}/rescind"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"

  - name: RightOfWayAgent
    description: "Agency acquisition agent: parcel & ownership research, agency-side offers, condemnation filing and deposit, relocation review"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels"
      - "POST /parcels/{id}/clear-ownership"
      - "POST /parcels/{id}/ownership-interests"
      - "POST /parcels/{id}/negotiations"
      - "POST /parcels/{id}/condemnations"
      - "POST /condemnations/{id}/deposit"
      - "POST /relocation-benefits/{id}/approve"
      - "POST /relocation-benefits/{id}/deny"
    shared_operations:
      - "POST /negotiations/{id}/rounds (AGENCY party: COUNTER/OFFER/ACCEPT/REJECT when OWNER_COUNTERED)"
      - "all GET reads"

  - name: Appraiser
    description: "Independent appraiser: appraisals and inspection scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels/{id}/appraisals"
      - "POST /appraisals/{id}/finalize"
      - "POST /appraisals/{id}/inspection-appointments"
    shared_operations:
      - "all GET reads"

  - name: PropertyOwner
    description: "Property owner / occupant acting on their own parcel: owner-side offer rounds and relocation claims"
    identity: "entity_backed:OwnershipInterest"
    exclusive_operations:
      - "POST /parcels/{id}/relocation-benefits"
    shared_operations:
      - "POST /negotiations/{id}/rounds (OWNER party: COUNTER/ACCEPT/REJECT when AGENCY_OFFERED)"
      - "all GET reads"

  - name: EscrowOfficer
    description: "Escrow/title officer: escrow lifecycle, disbursement, relocation payout"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels/{id}/escrows"
      - "POST /escrows/{id}/fund"
      - "POST /escrows/{id}/close"
      - "POST /relocation-benefits/{id}/pay"
    shared_operations:
      - "all GET reads"

  - name: UtilityCoordinator
    description: "Utility relocation coordinator: identify, schedule, and complete utility relocations"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels/{id}/utility-relocations"
      - "POST /utility-relocations/{id}/schedule"
      - "POST /utility-relocations/{id}/complete"
    shared_operations:
      - "all GET reads"
