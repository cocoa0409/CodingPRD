        as: ProductionPlanner
      - call: POST /production-runs/${r1}/start
        as: LineOperator
        as_user_id: op_1
      - call: POST /production-runs/${r1}/complete
        payload:
          actual_units: 2000
          mix_metered_litres: 100.0
          zone_id: ${z_a}
        as: LineOperator
        as_user_id: op_1
      - call: GET /inventory-lots
        payload:
          run_id: ${r1}
        as: QAManager
        captures:
          lot1: $.data[0].id
      - call: POST /shipments
        payload:
          shipment_code: SH-P
          customer_id: ${c_dist}
        as: WarehouseLead
        captures:
          s1: $.data.id
      - call: POST /shipments/${s1}/allocations
        payload:
