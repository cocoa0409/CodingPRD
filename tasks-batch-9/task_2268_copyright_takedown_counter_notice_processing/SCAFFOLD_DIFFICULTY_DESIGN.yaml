              payload: {}
              as: TakedownAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/notices/${n2_id}/process"
              payload: {}
              as: TakedownAgent
          assert:
            - "the first process (clock 2026-08-30T00:00:00Z) returns 409 with error_id == ERR_DUPLICATE_CLAIM_WINDOW"
            - "after that refusal GET /dmca/claims?content_item_id=${item1_id} returns total_count == 1 and TakedownNotice.${n2_id}.status == VALIDATED"
            - "NoticeClaim.${claim1_id}.status == RESTORED with disabled_at == \"2026-08-01T00:00:00.000Z\" and dispute_window_days == 30"
            - "the second process (clock 2026-08-31T00:00:00Z, exactly the excluded upper bound) returns 200"
            - "TakedownNotice.${n2_id}.status == PROCESSED with matched_claim_count == 1 and unmatched_url_count == 0"
            - "GET /dmca/claims?content_item_id=${item1_id} returns total_count == 2 and $.data[1].status == DISABLED with $.data[1].disabled_at == \"2026-08-31T00:00:00.000Z\""
            - "ContentItem.${item1_id}.availability_status == DISABLED and ContentItem.${item1_id}.dispute_status == UNDER_NOTICE"
            - "Account.${acct_id}.strike_points == 10.00 (claim 1's strike was voided on restore)"
            - "Account.${acct_id}.available_content_count == 0"

      - name: ingestion_batch_rejected_when_closed_24h_window_aggregate_exceeds_quota
        grounds:
          - calculations.ingestion_window_quota
          - validations.priority_18_ERR_INGESTION_WINDOW_QUOTA_EXCEEDED
          - entities.IngestionBatch.fields.rolling_item_total
          - entities.RightsHolder.fields.daily_item_quota
        distinguishing_aspect: |
          Overlapping ingestion windows are aggregated on a CLOSED 24-hour
          interval: 300 + 200 items reaches exactly daily_item_quota 500 and is
          accepted, one more item is refused, at exactly accepted_at + 24h the
          older batch is still counted (still refused), and one second later it
          drops out so the same one-item batch is accepted with rolling_item_total
          201.
        test_recipe:
          setup:
            - "Provider ELIGIBLE (contact published, agent REGISTERED, policy PUBLISHED) so the priority-9 gate passes."
            - "RightsHolder created with daily_item_quota 500, ENROLLED and promoted to VERIFIED so the priority-14 tier check passes."
            - "One ACCEPTED IngestionBatch of 300 items with accepted_at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_v2: "$.data.version" }
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Standard repeat infringer policy." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
            - call: "POST /dmca/repeat-infringer-policies/${policy_id}/publish"
              payload: { expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example", daily_item_quota: 500 }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/rights-holders/${rh_id}/enroll"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders/${rh_id}/promote-tier"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/ingestion-batches"
              payload: { rights_holder_id: "${rh_id}", item_count: 300 }
              as: RightsHolderRep
              as_user_id: "${rh_id}"
              captures: { batch1_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T18:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/ingestion-batches"
              payload: { rights_holder_id: "${rh_id}", item_count: 200 }
              as: RightsHolderRep
              as_user_id: "${rh_id}"
              captures: { batch2_id: "$.data.id" }
            - call: "POST /dmca/ingestion-batches"
              payload: { rights_holder_id: "${rh_id}", item_count: 1 }
              as: RightsHolderRep
              as_user_id: "${rh_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/ingestion-batches"
              payload: { rights_holder_id: "${rh_id}", item_count: 1 }
              as: RightsHolderRep
              as_user_id: "${rh_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:01Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/ingestion-batches"
              payload: { rights_holder_id: "${rh_id}", item_count: 1 }
              as: RightsHolderRep
              as_user_id: "${rh_id}"
              captures: { batch3_id: "$.data.id" }
          assert:
            - "IngestionBatch.${batch1_id}.rolling_item_total == 300 and IngestionBatch.${batch1_id}.accepted_at == \"2026-08-01T00:00:00.000Z\""
            - "the 200-item batch returns 201 with IngestionBatch.${batch2_id}.rolling_item_total == 500 (equality with daily_item_quota is accepted)"
            - "the first 1-item batch (clock 2026-08-01T18:00:00Z) returns 409 with error_id == ERR_INGESTION_WINDOW_QUOTA_EXCEEDED because 501 > 500"
            - "the 1-item batch at exactly 2026-08-02T00:00:00Z also returns 409: the closed lower bound still counts batch 1 (300 + 200 + 1 == 501)"
            - "the 1-item batch at 2026-08-02T00:00:01Z returns 201 with IngestionBatch.${batch3_id}.rolling_item_total == 201"
            - "IngestionBatch.${batch3_id}.status == ACCEPTED"
            - "GET /dmca/rights-holders/${rh_id}/ingestion-batches returns total_count == 3 (the refused calls created nothing)"

  - rule_id: compensating_invariant
    instances:
      - name: notice_withdrawal_returns_strike_points_to_the_pre_process_value
        grounds:
          - state_machines.TakedownNotice.PROCESSED_to_WITHDRAWN
          - state_machines.StrikeRecord.ACTIVE_to_VOIDED
          - calculations.account_strike_points
          - entities.Account.fields.strike_points
          - endpoints.POST_/dmca/notices/{id}/withdraw
        distinguishing_aspect: |
          Withdrawal is a compensating action measured against a non-zero baseline:
          strike_points is 10.00 before the second notice is processed, 30.00 after,
          and exactly 10.00 again after withdrawal — the unrelated strike from the
          other rights holder survives untouched and the invariant
          strike_points == SUM(effective_points of ACTIVE/DECAYED strikes) holds
          before and after.
        test_recipe:
          setup:
            - "Provider fully documented with a PUBLISHED policy; clock at 2026-08-01T00:00:00Z."
            - "Account with three ContentItems, all AVAILABLE (available_content_count 3)."
            - "Meridian's notice on /v/3 is PROCESSED first, leaving one ACTIVE strike: baseline strike_points 10.00, standing ACTIVE, available_content_count 2."
            - "Orbit's notice on /v/1 and /v/2 is then PROCESSED, adding two strikes: strike_points 30.00, standing LIMITED, available_content_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_v2: "$.data.version" }
            - call: "POST /dmca/repeat-infringer-policies"
              payload: { provider_id: "${prov_id}", policy_text: "Standard repeat infringer policy." }
              as: ComplianceOfficer
              captures: { policy_id: "$.data.id" }
            - call: "POST /dmca/repeat-infringer-policies/${policy_id}/publish"
              payload: { expected_provider_version: "${prov_v2}" }
              as: ComplianceOfficer
            - call: "POST /dmca/accounts"
              payload: { provider_id: "${prov_id}", handle: "ada_lovelace", email: "ada@subscriber.example" }
              as: ComplianceOfficer
              captures: { acct_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/1", title: "Clip One", fingerprint_hash: "0123456789abcdef0123456789abcdef" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item1_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/2", title: "Clip Two", fingerprint_hash: "11111111111111111111111111111111" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item2_id: "$.data.id" }
            - call: "POST /dmca/content-items"
              payload: { account_id: "${acct_id}", content_url: "https://northstar.example/v/3", title: "Clip Three", fingerprint_hash: "22222222222222222222222222222222" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { item3_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Meridian Music Group", contact_email: "legal@meridian.example" }
              as: ComplianceOfficer
              captures: { rh_meridian_id: "$.data.id" }
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_orbit_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_meridian_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/3"], signature_present: true, work_identification: "Sound recording: Meridian Sessions", material_identification: "Full track posted at /v/3", contact_email: "legal@meridian.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_meridian_id: "$.data.id" }
            - call: "POST /dmca/notices/${n_meridian_id}/validate"
              payload: {}
              as: TakedownAgent
            - call: "POST /dmca/notices/${n_meridian_id}/process"
              payload: {}
              as: TakedownAgent
            - call: "GET /dmca/accounts/${acct_id}/strikes"
              payload: {}
              as: ComplianceOfficer
              captures: { strike_baseline_id: "$.data[0].id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_orbit_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1", "https://northstar.example/v/2"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1", material_identification: "Tracks posted at /v/1 and /v/2", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_orbit_id: "$.data.id" }
            - call: "POST /dmca/notices/${n_orbit_id}/validate"
              payload: {}
              as: TakedownAgent
            - call: "POST /dmca/notices/${n_orbit_id}/process"
              payload: {}
              as: TakedownAgent
          trigger:
            - call: "POST /dmca/notices/${n_orbit_id}/withdraw"
              payload: {}
              as: RightsHolderRep
              as_user_id: "${rh_orbit_id}"
          assert:
            - "Account.${acct_id}.strike_points == 10.00 (exactly the pre-process baseline, not 0.00 and not 30.00)"
            - "Account.${acct_id}.standing == ACTIVE"
            - "Account.${acct_id}.upload_restricted == false"
            - "Account.${acct_id}.available_content_count == 2 (Meridian's takedown is untouched)"
            - "TakedownNotice.${n_orbit_id}.status == WITHDRAWN"
            - "GET /dmca/claims?notice_id=${n_orbit_id}&status=WITHDRAWN returns total_count == 2"
            - "GET /dmca/accounts/${acct_id}/strikes?status=VOIDED returns total_count == 2"
            - "StrikeRecord.${strike_baseline_id}.status == ACTIVE and StrikeRecord.${strike_baseline_id}.effective_points == 10.00"
            - "ContentItem.${item1_id}.availability_status == RESTORED and ContentItem.${item1_id}.dispute_status == RESOLVED"
            - "ContentItem.${item2_id}.availability_status == RESTORED and ContentItem.${item2_id}.dispute_status == RESOLVED"
            - "ContentItem.${item3_id}.availability_status == DISABLED and ContentItem.${item3_id}.dispute_status == UNDER_NOTICE"
            - "GET /dmca/accounts/${acct_id}/strike-summary returns strike_points == 10.00, active_strike_count == 1 and voided_strike_count == 2 (the summary reconciles with Account.strike_points)"
            - "RightsHolder.${rh_orbit_id}.withdrawn_count == 1 and RightsHolder.${rh_orbit_id}.abuse_score == 20.00"
            - "TakedownNotice.${n_meridian_id}.status == PROCESSED"

      - name: claim_restoration_returns_available_content_count_to_the_pre_disable_value
        grounds:
          - state_machines.NoticeClaim.RESTORATION_SCHEDULED_to_RESTORED
          - state_machines.ContentItem.availability_status
          - entities.Account.fields.available_content_count
          - endpoints.POST_/dmca/claims/{id}/restore
          - calculations.restoration_window
        distinguishing_aspect: |
          Restoration compensates the disable side effect exactly: the account holds
          three items, processing drops available_content_count to 2, and restoring
          the single claim returns it to 3 while the voided strike brings
          strike_points back to 0.00 and the parent notice auto-closes — the
          derived counter must equal the count of items in {AVAILABLE, RESTORED}.
        test_recipe:
          setup:
            - "Provider fully documented with a PUBLISHED policy; clock at 2026-08-01T00:00:00Z."
            - "Account with three ContentItems, all AVAILABLE (available_content_count 3)."
            - "One notice on /v/1 is PROCESSED: claim DISABLED, available_content_count 2, strike_points 10.00."
            - "A counter-notice on that claim is validated and forwarded on 2026-08-01, so restoration_earliest_at and the claim's restoration_due_at are 2026-08-14T00:00:00Z."
            - "Clock advanced to exactly 2026-08-14T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
