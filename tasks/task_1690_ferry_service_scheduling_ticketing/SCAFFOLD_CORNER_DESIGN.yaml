              captures: { cust_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 1, has_vehicle: false }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_id: $.data.id }
            - call: "POST /ferry/bookings/${b_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: ${cust_id}
            - call: "POST /ferry/sailings/${s_id}/close-booking"
              payload: {}
              as: SchedulerAdmin
          trigger:
            - call: "POST /ferry/bookings/${b_id}/check-in"
              payload: {}
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"
            - "Booking.${b_id}.status == CONFIRMED"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_version_increments_on_fare_schedule_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fare-schedule-create-stale-route]", entities.Route.fields.version]
        distinguishing_aspect: "Route.version increments by exactly 1 per successful fare-schedule create (1 -> 2), and the create response reflects the mutation; combined with the stale-version error test this closes the OCC loop."
        test_recipe:
          setup: ["route created at version 1"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
          trigger:
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
            - call: "GET /ferry/routes/${route_id}"
              payload: {}
              as: SchedulerAdmin
              captures: { route_v_after: $.data.version }
          assert:
            - "${route_v} == 1"
            - "${route_v_after} == 2  # incremented exactly once by the create"

      - name: cascade_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Sailing.OPEN_FOR_BOOKING_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / sailing_cancel_cascade_depth3
          rationale: "The depth-3 cascade (booking refund -> queue expiry -> crew release) is asserted end-to-end in the named §1.8 instance."

      - name: logical_clock_default_is_fixed
        claim_type: scheduled_actions
        grounds: ["endpoints[POST /ferry/_clock/set_current_utc]"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: an APPROVED schedule whose window covers that instant (PEAK 2026-06-01..2026-09-01) reads EFFECTIVE without any clock call, while a later-window schedule (OFF_PEAK from 2026-09-01) stays APPROVED."
        test_recipe:
          setup: ["route; two APPROVED schedules — one PEAK window 2026-06-01..2026-08-01, one OFF_PEAK window 2026-09-01..2026-11-01; no clock calls"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "PEAK", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_peak: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_peak}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_peak}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v} + 1" }
              as: SchedulerAdmin
              captures: { fs_off: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_off}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_off}/approve"
              payload: {}
              as: SchedulerAdmin
          trigger:
            - call: "GET /ferry/fare-schedules/${fs_peak}"
              payload: {}
              as: SchedulerAdmin
              captures: { peak_status: $.data.status }
            - call: "GET /ferry/fare-schedules/${fs_off}"
              payload: {}
              as: SchedulerAdmin
              captures: { off_status: $.data.status }
          assert:
            - "PEAK schedule status == EFFECTIVE  # default clock 2026-08-01T00:00:00Z lies inside [2026-06-01, 2026-09-01) with no clock call issued"
            - "OFF_PEAK schedule status == APPROVED  # window [2026-09-01, 2026-11-01) not yet reached at the default clock"

      - name: immediate_consistency_after_booking_confirm
        claim_type: derived_field_reconciliation
        grounds: [entities.Sailing.fields.booked_passengers, entities.Sailing.fields.reserved_vehicle_feet]
        distinguishing_aspect: "consistency_model immediate: the confirm response's own read of the sailing shows updated aggregates in the same request cycle — no lag."
        test_recipe:
          setup: ["base setup; sailing OPEN; one booking RESERVED (2 pax, 18 ft vehicle)"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/vessels"
              payload: { vessel_name: "MV Kittitas", vehicle_deck_linear_feet: 200, passenger_capacity: 600, crew_class: "MEDIUM" }
              as: SchedulerAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /ferry/fare-schedules/${fs_id}/submit"
              payload: { fuel_price_index_cents: 200 }
              as: SchedulerAdmin
            - call: "POST /ferry/fare-schedules/${fs_id}/approve"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Cap A", credential_class: "CAPTAIN" }
              as: CrewPlanner
              captures: { cap_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck A", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck1_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Deck B", credential_class: "DECK" }
              as: CrewPlanner
              captures: { deck2_id: $.data.id }
            - call: "POST /ferry/crew-members"
              payload: { full_name: "Eng A", credential_class: "ENGINE" }
              as: CrewPlanner
              captures: { eng_id: $.data.id }
            - call: "POST /ferry/routes/${route_id}/sailings"
              payload: { vessel_id: "${vessel_id}", departure_time: "2026-09-01T10:00:00Z", season: "OFF_PEAK" }
              as: SchedulerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${cap_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck1_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${deck2_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/sailings/${s_id}/crew-assignments"
              payload: { crew_member_id: "${eng_id}", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: CrewPlanner
            - call: "POST /ferry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SchedulerAdmin
            - call: "POST /ferry/sailings/${s_id}/open-booking"
              payload: {}
              as: SchedulerAdmin
            - call: "POST /ferry/customers"
              payload: { full_name: "Std Pat", email: "std@x.com", fare_class: "STANDARD" }
              as: SchedulerAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /ferry/sailings/${s_id}/bookings"
              payload: { customer_id: "${cust_id}", passenger_count: 2, has_vehicle: true, vehicle_length_feet: 18 }
              as: Customer
              as_user_id: ${cust_id}
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /ferry/bookings/${b_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: ${cust_id}
            - call: "GET /ferry/sailings/${s_id}"
              payload: {}
              as: SchedulerAdmin
              captures: { pax_after: $.data.booked_passengers, feet_after: $.data.reserved_vehicle_feet }
          assert:
            - "Sailing.booked_passengers == 2 immediately after confirm"
            - "Sailing.reserved_vehicle_feet == 18 immediately after confirm"
