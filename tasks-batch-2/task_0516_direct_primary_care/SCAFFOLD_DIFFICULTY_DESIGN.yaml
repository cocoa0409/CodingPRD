scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_split_cash_vs_insurance_diverge
        grounds:
          - calculations.invoice_split
          - entities.Member.fields.has_insurance
          - entities.Invoice.fields.member_responsibility_cents
          - state_machines.Visit.BILLABLE_to_INVOICED
        distinguishing_aspect: "Identical service_lines on a completed Visit produce member_responsibility_cents=14000 when the Member has no insurance (cash/DPC variant) but 2800 when has_insurance=true (insurance coinsurance variant); the divergence lives on the Invoice/Visit billing domain."
        test_recipe:
          setup:
            - "Practice with dpc_covered_service_codes=['OFFICE_VISIT'], insurance_coinsurance_pct=0.20, monthly_fee_cents=15000."
            - "Two members on the same provider: m_cash (has_insurance=false), m_ins (has_insurance=true), both ACTIVE."
            - "Each has a COMPLETED in-person visit with identical service_lines: OFFICE_VISIT 1x12000 (DPC), XRAY 1x9000, LAB_SPECIAL 2x2500 (gross 26000, non-DPC 14000)."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC West", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"], insurance_coinsurance_pct: 0.20 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr A", npi: "1000000001" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "cash@x.com", full_name: "M Cash", plan_type: "MONTHLY", has_insurance: false }
              as: Anonymous
              captures: { m_cash_id: $.data.id }
            - call: "POST /members/${m_cash_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_cash_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_cash_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_cash_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_cash_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_cash_id: $.data.id, slot_cash_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_cash_id}", slot_id: "${slot_cash_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_cash_v}" }
              as: Member
              as_user_id: "${m_cash_id}"
              captures: { v_cash_id: $.data.id }
            - call: "POST /visits/${v_cash_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v_cash_id}/complete"
              payload: { service_lines: [ { service_code: "OFFICE_VISIT", units: 1, unit_charge_cents: 12000 }, { service_code: "XRAY", units: 1, unit_charge_cents: 9000 }, { service_code: "LAB_SPECIAL", units: 2, unit_charge_cents: 2500 } ] }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "ins@x.com", full_name: "M Ins", plan_type: "MONTHLY", has_insurance: true }
              as: Anonymous
              captures: { m_ins_id: $.data.id }
            - call: "POST /members/${m_ins_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_ins_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_ins_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_ins_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_ins_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T10:00:00Z", ends_at: "2026-06-02T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_ins_id: $.data.id, slot_ins_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_ins_id}", slot_id: "${slot_ins_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_ins_v}" }
              as: Member
              as_user_id: "${m_ins_id}"
              captures: { v_ins_id: $.data.id }
            - call: "POST /visits/${v_ins_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v_ins_id}/complete"
              payload: { service_lines: [ { service_code: "OFFICE_VISIT", units: 1, unit_charge_cents: 12000 }, { service_code: "XRAY", units: 1, unit_charge_cents: 9000 }, { service_code: "LAB_SPECIAL", units: 2, unit_charge_cents: 2500 } ] }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${v_cash_id}/invoice"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { inv_cash_id: $.data.id }
            - call: "POST /visits/${v_ins_id}/invoice"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { inv_ins_id: $.data.id }
          assert:
            - "Invoice.${inv_cash_id}.gross_charge_cents == 26000"
            - "Invoice.${inv_cash_id}.member_responsibility_cents == 14000"
            - "Invoice.${inv_cash_id}.insurance_billed_cents == 0"
            - "Invoice.${inv_ins_id}.member_responsibility_cents == 2800"
            - "Invoice.${inv_ins_id}.insurance_billed_cents == 14000"

      - name: monthly_share_individual_vs_annual_sponsored_diverge
        grounds:
          - calculations.member_monthly_share
          - entities.Membership.fields.member_share_cents
          - entities.Membership.fields.plan_type
          - entities.Employer.fields.sponsorship_pct
        distinguishing_aspect: "On the Membership dues domain, an unsponsored MONTHLY membership yields member_share_cents=15000 while an ANNUAL_PREPAID membership sponsored at 0.60 yields member_share_cents=61200, a distinct calculation subject from invoice_split."
        test_recipe:
          setup:
            - "Practice monthly_fee_cents=15000, annual_fee_discount_pct=0.15."
            - "m_solo: MONTHLY, unsponsored. m_emp: ANNUAL_PREPAID, occupying an Employer seat with sponsorship_pct=0.60."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC East", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, annual_fee_discount_pct: 0.15, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr B", npi: "1000000002" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /employers"
              payload: { practice_id: "${pr_id}", company_name: "Acme", sponsored_seat_limit: 5, sponsorship_pct: 0.60 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "solo@x.com", full_name: "M Solo", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_solo_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "emp@x.com", full_name: "M Emp", plan_type: "ANNUAL_PREPAID" }
              as: Anonymous
              captures: { m_emp_id: $.data.id }
            - call: "POST /employers/${emp_id}/seats"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { seat_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { emp_v: $.data.version }
            - call: "POST /employers/${emp_id}/seats/${seat_id}/occupy"
              payload: { member_id: "${m_emp_id}", expected_employer_version: "${emp_v}" }
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /members/${m_solo_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_solo_id: "$.data[0].id" }
            - call: "GET /members/${m_emp_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_emp_id: "$.data[0].id" }
          assert:
            - "Membership.${mem_solo_id}.member_share_cents == 15000"
            - "Membership.${mem_emp_id}.member_share_cents == 61200"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_coinsurance_sum_then_round_mode_b
        grounds:
          - calculations.invoice_split
          - entities.Invoice.fields.member_responsibility_cents
          - entities.Practice.fields.insurance_coinsurance_pct
        distinguishing_aspect: "Mode (b) nested rounding: coinsurance is applied once to the SUMMED non-DPC total then rounded (round(13335*0.20)=round(2667.0)=2667), the pinned sum-then-round order; inputs (three 4445-cent lines) make the aggregate exact so the rule's order is unambiguous and member_responsibility_cents==2667."
        test_recipe:
          setup:
            - "Practice dpc_covered_service_codes=['OFFICE_VISIT'], insurance_coinsurance_pct=0.20."
            - "Insured member m_ins, ACTIVE, with a COMPLETED visit whose three non-DPC lines are 4445 cents each (non-DPC total 13335)."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Round", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"], insurance_coinsurance_pct: 0.20 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr C", npi: "1000000003" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "round@x.com", full_name: "M Round", plan_type: "MONTHLY", has_insurance: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: { service_lines: [ { service_code: "LAB_A", units: 1, unit_charge_cents: 4445 }, { service_code: "LAB_B", units: 1, unit_charge_cents: 4445 }, { service_code: "LAB_C", units: 1, unit_charge_cents: 4445 } ] }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${v_id}/invoice"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.gross_charge_cents == 13335"
            - "Invoice.${inv_id}.insurance_billed_cents == 13335"
            - "Invoice.${inv_id}.member_responsibility_cents == 2667"

      - name: annual_sponsored_discount_before_sponsorship_mode_c
        grounds:
          - calculations.member_monthly_share
          - entities.Membership.fields.member_share_cents
          - entities.Practice.fields.annual_fee_discount_pct
          - entities.Employer.fields.sponsorship_pct
        distinguishing_aspect: "Mode (c) pinned evaluation order: the annual discount is applied and rounded to annual_total=153000 BEFORE sponsorship (round(153000*0.60)=91800), giving member_share=61200; applying sponsorship before discount would yield a different cent figure, so the order is well-defined."
        test_recipe:
          setup:
            - "Practice monthly_fee_cents=15000, annual_fee_discount_pct=0.15. Employer sponsorship_pct=0.60."
            - "m_emp ANNUAL_PREPAID, occupying an Acme seat."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Order", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, annual_fee_discount_pct: 0.15, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /employers"
              payload: { practice_id: "${pr_id}", company_name: "Acme", sponsored_seat_limit: 5, sponsorship_pct: 0.60 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "annsp@x.com", full_name: "M AnnSp", plan_type: "ANNUAL_PREPAID" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /employers/${emp_id}/seats"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { seat_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { emp_v: $.data.version }
            - call: "POST /employers/${emp_id}/seats/${seat_id}/occupy"
              payload: { member_id: "${m_id}", expected_employer_version: "${emp_v}" }
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
          assert:
            - "Membership.${mem_id}.member_share_cents == 61200"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_parallel_clinical_and_billing_dimensions
        grounds:
          - state_machines.Visit.CHECKED_IN_to_COMPLETED
          - state_machines.Visit.BILLABLE_to_INVOICED
          - entities.Visit.fields.clinical_status
          - entities.Visit.fields.billing_status
        distinguishing_aspect: "On a single Visit row, clinical_status reaches COMPLETED while billing_status independently sits at BILLABLE; the two dimensions hold non-correlated values (clinical_status==COMPLETED with billing_status==BILLABLE before any invoicing), proving parallel state axes."
        test_recipe:
          setup:
            - "ACTIVE member m with assigned PCP and a CHECKED_IN IN_PERSON visit."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Par", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr D", npi: "1000000004" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "par@x.com", full_name: "M Par", plan_type: "MONTHLY", has_insurance: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: { service_lines: [ { service_code: "XRAY", units: 1, unit_charge_cents: 9000 } ] }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { vc_clin: $.data.clinical_status, vc_bill: $.data.billing_status }
          assert:
            - "Visit.${v_id}.clinical_status == COMPLETED"
            - "Visit.${v_id}.billing_status == BILLABLE"

      - name: care_plan_active_revision_cycle
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVISION
          - state_machines.CarePlan.UNDER_REVISION_to_ACTIVE
          - entities.CarePlan.fields.revision_number
        distinguishing_aspect: "CarePlan cycles ACTIVE->UNDER_REVISION->ACTIVE on a different entity than Visit; revision_number increments to 1 only on the reopen hop, proving the back-edge fired and the machine is cyclic, not linear."
        test_recipe:
          setup:
            - "ACTIVE member m with a COMPLETED ANNUAL_PHYSICAL visit; a DRAFT CarePlan with goal_count=2 activated to ACTIVE."
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "DPC Cyc", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr E", npi: "1000000005" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "cyc@x.com", full_name: "M Cyc", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T10:00:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "ANNUAL_PHYSICAL", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: { service_lines: [] }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /care-plans"
              payload: { member_id: "${m_id}", origin_visit_id: "${v_id}", goal_count: 2 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /care-plans/${cp_id}/reopen"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cp_status: $.data.plan_status, cp_rev: $.data.revision_number }
            - call: "POST /care-plans/${cp_id}/activate"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { cp_status2: $.data.plan_status }
          assert:
            - "CarePlan.${cp_id}.revision_number == 1"
            - "CarePlan.${cp_id}.plan_status == ACTIVE"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspension_sweep_three_hop_cascade
        grounds:
          - state_machines.Member.PAST_DUE_to_SUSPENDED
          - state_machines.Visit.BOOKED_to_CANCELLED
          - entities.VisitSlot.fields.booked_count
          - entities.VisitSlot.fields.slot_state
        distinguishing_aspect: "Depth-3 cascade triggered by POST /_billing/run_suspension_sweep: sweep mutates Membership (PAST_DUE->SUSPENDED), THAT mutation cancels the member's BOOKED Visit, and THAT cancellation decrements its VisitSlot.booked_count from 1 to 0 (slot_state OPEN); each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "Practice grace_period_days=14. Member m driven to PAST_DUE at period rollover; m holds one BOOKED future visit in an IN_PERSON slot (booked_count=1)."
            - "Clock advanced past past_due_since + 14 days so the sweep suspends m."
          setup_api_calls:
            - call: "POST /practices"
