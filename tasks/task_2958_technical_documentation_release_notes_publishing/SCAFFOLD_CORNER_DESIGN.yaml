        distinguishing_aspect: "The topic violates BOTH rules at once — the train's posture is FROZEN (ratio 0.00) and the newest revision carries an open BLOCKER violation. Priority 25 must win, and retiring the term afterwards must NOT change the reported error, which rules out an implementation that happens to check terminology first."
        test_recipe:
          setup:
            - "One ACTIVE BLOCKER term 'login' and a STANDARD-tier plan item whose only revision uses the forbidden form 'logon' (open_blocker_violations 1)."
            - "The train advanced to DOC_FREEZE with one unapproved plan item, so approved_topic_ratio is 0.00 and doc_readiness_posture is FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
