  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: noise_reading_exactly_at_effective_cap_is_compliant
        grounds:
          - calculations.effective_noise_cap
          - entities.NoiseReading.fields.verdict
          - entities.NoiseReading.fields.effective_cap_db
          - entities.Permit.fields.noise_violation_count
        distinguishing_aspect: |
          Boundary on the DECIBEL metric, reached through POST /busking/noise-readings: the cap is
          inclusive, so reading_db 78 against effective_cap_db 78 is COMPLIANT and only 79 is a
          VIOLATION. A '<' implementation would wrongly flag the 78 reading and push
          noise_violation_count to 2, tipping the permit to WARNED.
        test_recipe:
          setup:
            - "Zone RP has base_noise_cap_db 78, weekend bonus 3 and evening_start_minute 1080; pitch RP-01 has noise_cap_db 82."
            - "Performer Ada holds an ACTIVE, CLEAR 2026 permit and a non-amplified 120-minute booking on RP-01 for 2026-08-12T14:00:00Z to 16:00:00Z (a Wednesday afternoon, minute-of-day 840, so no weekend bonus and no evening penalty apply: the cap is min(82, 78) = 78)."
            - "The clock has been moved to 2026-08-12T14:10:00Z."
