              captures: { run_id: "$.data.id", organ_v1: "$.data.version" }
          trigger:
            - call: "POST /offers"
              payload: { donor_organ_id: "${organ_id}", candidate_id: "${cand_id}", match_run_id: "${run_id}", expected_donor_organ_version: "${organ_v1}" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { offer_id: "$.data.id" }
            - call: "GET /donor-organs/${organ_id}"
              payload: {}
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { ooc_after_offer: "$.data.open_offer_count" }
            - call: "POST /offers/${offer_id}/decline"
              payload: { decline_reason: "CENTER_DECLINE" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "GET /donor-organs/${organ_id}"
              payload: {}
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { ooc_after_decline: "$.data.open_offer_count" }
          assert:
            - "After offer issue: DonorOrgan.${organ_id}.open_offer_count == 1"
            - "After decline: DonorOrgan.${organ_id}.open_offer_count == 0 (forward +1 and compensating -1 conserve the count)"

      - name: ci_waiting_time_conserved_across_deactivate_reactivate
        grounds:
          - calculations.waiting_time_days
          - state_machines.Candidate.ACTIVE_to_INACTIVE
          - state_machines.Candidate.INACTIVE_to_ACTIVE
          - entities.Candidate.fields.waiting_time_days
        distinguishing_aspect: |
          Conserved quantity #2 (accrued waiting-time days, a DIFFERENT quantity
          than offer count): a deactivate that pauses accrual paired with a
          same-instant reactivate that resumes it leaves waiting_time_days equal
          to a candidate who never paused — no drift across the compensating pair.
        test_recipe:
          setup:
            - "Candidate listed at 2026-06-01T00:00:00Z; clock advanced to 2026-06-11T00:00:00Z (10 continuous active days)."
            - "At 2026-06-11T00:00:00Z deactivate then immediately reactivate at the same clock value (zero-length INACTIVE gap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /transplant-centers"
              payload: { name: "C5", unos_center_code: "C005", region_code: 5, latitude: 41.8, longitude: -87.6 }
              as: UNOSAdmin
              captures: { c5_id: "$.data.id" }
            - call: "POST /candidates"
              payload: { center_id: "${c5_id}", mrn: "G2", organ_type: "LIVER", blood_type: "A", date_of_birth: "1975-01-01T00:00:00Z", height_cm: 178, weight_kg: 80, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"] }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { cand_id: "$.data.id" }
            - call: "POST /candidates/${cand_id}/clinical-scores"
              payload: { bilirubin_mg_dl: 4.0, inr: 2.0, creatinine_mg_dl: 2.0, sodium_mmol_l: 130, albumin_g_dl: 3.0, effective_at: "2026-06-01T00:00:00Z" }
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { score_id: "$.data.id" }
            - call: "POST /clinical-scores/${score_id}/finalize"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: UNOSAdmin
            - call: "POST /candidates/${cand_id}/deactivate"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/reactivate"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
          trigger:
            - call: "GET /candidates/${cand_id}"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
              captures: { wt: "$.data.waiting_time_days" }
          assert:
            - "Candidate.${cand_id}.waiting_time_days == 10 (zero-length INACTIVE gap conserves accrual; matches uninterrupted accrual)"
