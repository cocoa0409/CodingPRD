  # ---------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: budget_period_closed_interval_adjacency
        grounds:
          - calculations.temporal_window_checks
          - errors[ERR_BUDGET_PERIOD_OVERLAP]
          - entities.BudgetPeriod
        distinguishing_aspect: |
          Resource = program budget timeline; semantics = CLOSED intervals where
          a shared single day is an overlap but exact +1-day adjacency is
          disjoint: 2026-06-30..2026-12-31 collides with 2026-01-01..2026-06-30
          (shares 06-30), while 2026-07-01..2026-12-31 is accepted.
        test_recipe:
          setup:
            - "Clock 2026-05-01; program created; budget period BP1 2026-01-01..2026-06-30 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-06-30", allocated_cents: 500000 }
              as: ProgramAdministrator
              captures: { bp1: $.data.id }
          trigger:
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-06-30", period_end: "2026-12-31", allocated_cents: 500000 }
              as: ProgramAdministrator
              captures: { err_touch: $.data.error_id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-07-01", period_end: "2026-12-31", allocated_cents: 500000 }
              as: ProgramAdministrator
              captures: { bp3: $.data.id }
          assert:
            - "period sharing the single day 2026-06-30 with BP1 rejected with ERR_BUDGET_PERIOD_OVERLAP (closed intervals: shared day = overlap)"
            - "period starting 2026-07-01 (exactly BP1.end + 1 day) accepted with 201"
            - "program.total_allocated_cents == 1000000 after the two successful creations"

      - name: lot_expiry_buffer_exclusion
        grounds:
          - calculations.fefo_lot_allocation
          - errors[ERR_NO_ELIGIBLE_INVENTORY]
          - entities.InventoryLot.fields.expiry_date
        distinguishing_aspect: |
          Different resource (InventoryLot) and different interval semantics
          (buffer window, not interval-vs-interval): allocation collides with the
          forbidden window [expiry - 30d, expiry]; a lot expiring exactly on
          today + 30 (2026-05-31) is EXCLUDED (strict >), one expiring
          2026-06-01 is eligible; once the good lot drains, requests hit the
          empty pool.
        test_recipe:
          setup:
            - "Clock 2026-05-01; program + period; patient approved"
            - "lot_bad: expiry 2026-05-31 (= today + buffer 30, excluded); lot_good: expiry 2026-06-01, 5 units"
