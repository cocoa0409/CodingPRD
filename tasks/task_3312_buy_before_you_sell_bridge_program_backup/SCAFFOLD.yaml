  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every expiry, window and accrual rule. The server's startup default time is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["recompute every clock-gated expiry rule (Qualification, BackupOffer, InterimLoan delinquency)"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not in the endpoint's roles[]"
  - id: ERR_SOD_BACKUP_APPROVER
    http: 403
    condition: "the same Coordinator X-User-ID that issued a BackupOffer attempts to exercise it"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or a value fails its declared type/range constraint"
  - id: ERR_HOMEOWNER_NOT_FOUND
    http: 404
    condition: "no Homeowner matches the referenced id"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property matches the referenced id"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "no Qualification matches the referenced id"
  - id: ERR_BRIDGE_PROGRAM_NOT_FOUND
    http: 404
    condition: "no BridgeProgram matches the referenced id"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "no InterimLoan matches the referenced id"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "no BridgeAdvance, CarryingCost, RepairAdvance, BackupOffer, Listing, Agent, Referral, CoordinationTask, or Disbursement matches the referenced id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is declared"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in a terminal state and cannot transition again"
  - id: ERR_BACKUP_OFFER_EXPIRED
    http: 409
    condition: "exercise requested while BackupOffer.status != ISSUED or the logical clock has passed expires_at"
  - id: ERR_LISTING_STATE_CONFLICT
    http: 409
    condition: "Listing or BridgeProgram.occupancy_status does not permit the requested marketing step"
  - id: ERR_LOAN_ALREADY_REPAID
    http: 409
    condition: "reopen-advance requested against a loan that is not REPAID, or a reopen has already been applied"
  - id: ERR_CREDIT_SCORE_BELOW_MINIMUM
    http: 422
    condition: "Homeowner.credit_score < 620 while approving a qualification"
  - id: ERR_LTV_EXCEEDS_LIMIT
    http: 422
    condition: "InterimLoan.principal_cents exceeds 7500 bps of the NEW property's appraised value"
  - id: ERR_REGULATORY_PRICE_FLOOR
    http: 422
    condition: "BackupOffer.offer_price_cents is below the backup_offer_price_floor for the departing property"
  - id: ERR_STAKEHOLDER_REVIEW_REQUIRED
    http: 422
    condition: "a DOWN_PAYMENT advance above STAKE_HOLDER_REVIEW_CENTS is disbursed without prior stakeholder review"
  - id: ERR_NO_CAPACITY
    http: 422
    condition: "the requested advance exceeds the interim loan's outstanding draw headroom"
  - id: ERR_DUPLICATE_ACTIVE_REFERRAL
    http: 409
    condition: "a second active Referral with the same role_scope for the same BridgeProgram"
  - id: ERR_OVERLAPPING_TASK
    http: 409
    condition: "the new CoordinationTask interval overlaps a non-terminal task for the same Referral"
  - id: ERR_REPAIR_SCOPE_EXCEEDS_CAP
    http: 422
    condition: "cumulative approved repair amount for the property exceeds its repair cap"
  - id: ERR_LISTING_SLOT_OVERLAP
    http: 409
    condition: "the requested go-live overlaps another live Listing slot for the same departing property"
  - id: ERR_ADVANCE_WINDOW_CLOSED
    http: 409
    condition: "repair advance approval requested while BridgeProgram.advance_status is not FUNDING or FUNDED"
  - id: ERR_CARRYING_COST_UNPAID
    http: 422
    condition: "a final interim-loan repayment is attempted while outstanding_carrying_cost_cents > 0"
  - id: ERR_SETTLEMENT_NOT_FULL
    http: 422
    condition: "the final repayment differs from outstanding_principal_cents + accrued_interest_cents"
  - id: ERR_DISBURSEMENT_EXCEEDS_BALANCE
    http: 422
    condition: "the settlement amount exceeds combined outstanding principal and accrued interest"
  - id: ERR_APPRAISAL_STALE
    http: 422
    condition: "the property appraisal is older than APPRAISAL_VALIDITY_DAYS relative to the logical clock"
  - id: ERR_REPAIR_NOT_COMPLETE
    http: 422
    condition: "listing go-live attempted while the departing Property.repair_status != COMPLETE"
  - id: ERR_PROPERTY_KIND_MISMATCH
    http: 422
    condition: "a referenced Property's kind does not match the role it is used in"
  - id: ERR_HOMEOWNER_MISMATCH
    http: 422
    condition: "the referenced Property is not owned by the referenced Homeowner"
  - id: ERR_AGENT_NOT_QUALIFIED
    http: 422
    condition: "referral created against an Agent whose qualification_status is SUSPENDED"
  - id: ERR_LISTING_OFFER_REQUIRED
    http: 422
    condition: "close-sale attempted while Listing.offer_count == 0 or Property.listing_status != UNDER_CONTRACT"
  - id: ERR_EXERCISE_WINDOW_NOT_OPEN
    http: 422
    condition: "issue requested before the logical clock reaches BackupOffer.window_start"
  - id: ERR_LISTING_BEFORE_OCCUPANCY
    http: 422
    condition: "listing go-live attempted while BridgeProgram.occupancy_status is VACANT"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version in the request body no longer matches the parent entity's current version"

