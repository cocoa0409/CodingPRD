          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/schedule"
              payload: { inspector_id: "${insp_2}", scheduled_start_at: "2026-09-05T09:00:00Z", scheduled_end_at: "2026-09-05T11:00:00Z", expected_inspector_version: "${insp_2_v}" }
