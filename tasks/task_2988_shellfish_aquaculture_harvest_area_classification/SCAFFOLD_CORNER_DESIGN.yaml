          - errors[ERR_DISEASE_CERTIFICATE_STALE]
        distinguishing_aspect: |
          Three independent intake rules fire on the same endpoint from three different payload/parent
          combinations: a hatchery whose NCSP certificate lapsed before the shipment date, a species
          absent from that hatchery's pathogen-free list, and a disease certificate issued 41 days
          before shipping against a 30-day maximum age.
