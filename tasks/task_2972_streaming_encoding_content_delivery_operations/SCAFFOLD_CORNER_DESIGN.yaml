        distinguishing_aspect: "Two windows created US-first (September) then CA-second (August) come back in window_start_at ASC order — CA before US — and the region_code filter narrows the same list to exactly the US row, so creation order is not the list order."
        test_recipe:
          setup:
            - "One Title with a September US window created before an August CA window (different regions, so no overlap rule applies)."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-WIN-ORDER", title_name: "Window Order Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "PREMIUM" }
              as: ContentOps
              captures: { w_us: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "CA", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", license_tier: "BASIC" }
              as: ContentOps
              captures: { w_ca: $.data.id }
          trigger:
            - call: "GET /titles/${t_id}/availability-windows"
