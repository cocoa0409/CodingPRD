      - name: blend_cost_rounds_each_component_line_before_summing
        grounds:
          - calculations.blend_cost_and_density
          - entities.BlendRecipe.fields.blend_cost_per_kg
          - entities.BlendRecipe.fields.blended_density_kg_m3
        distinguishing_aspect: |
          Mode (b): the pinned order rounds every component line to 2 dp FIRST (0.44, 0.22, 0.26,
          0.73, 0.42) and then sums to 2.07, whereas summing the unrounded contributions
          (0.435 + 0.2225 + 0.255 + 0.725 + 0.42 = 2.0575) and rounding once gives 2.06 -- a
          one-cent-per-kg fork produced purely by rounding order, on the same five components
          whose density lines are all exact at 2 dp and therefore agree (927.40) under either order.
        test_recipe:
          setup:
