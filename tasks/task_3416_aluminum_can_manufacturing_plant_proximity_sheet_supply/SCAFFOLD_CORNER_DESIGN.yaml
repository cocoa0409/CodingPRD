              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
            - call: "POST /supply-agreements/${agr_id}/open-renegotiation"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /supply-agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${agr_v}", conversion_cost_cents_per_1000: 1600 }
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_UNAUTHORIZED"
            - "SupplyAgreement.${agr_id}.status stays RENEGOTIATING and conversion_cost_cents_per_1000 stays 1500"

      - name: line_scheduler_cannot_publish_metal_price_index
        claim_type: role_denial
        grounds:
          - roles.LineScheduler
          - roles.PlatformAdmin
          - endpoints.POST_/metal-price-indices
