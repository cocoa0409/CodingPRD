      - name: same_data_two_percent_complete_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.phase_earned_value.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / phase_earned_value_effort_based_vs_assessed
          rationale: "Two projects with identical timesheets are asserted to recognize 3620.00 (EFFORT_BASED) versus 50000.00 (ASSESSED)."

      - name: correct_overhead_variant_selected_per_context
        claim_type: variant_selection
        grounds:
