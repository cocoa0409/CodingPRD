        grounds:
          - entities.ChecklistItem.fields.severity
          - entities.ChecklistItem.fields.category
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Enum members outside the declared constraint list and an out-of-range pagination limit are
          all priority-4 schema failures on the same endpoint pair, so they return 400 rather than a
          domain 422; the template stays empty and no partial item is written.
        test_recipe:
          setup:
            - "One DRAFT template MPI-172 with no items yet."
          setup_api_calls:
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
          trigger:
