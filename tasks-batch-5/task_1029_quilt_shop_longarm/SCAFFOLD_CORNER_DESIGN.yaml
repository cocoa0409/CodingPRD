# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over 1.1-1.7 that 1.8 does not already cover.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ entities
  - section: entities
    instances:
      - name: member_create_returns_defaults
        claim_type: creation
        grounds: [entities.Member.fields.points_balance, entities.Member.fields.loyalty_tier]
        distinguishing_aspect: "POST /api/members with name+email returns 201; points_balance==0 and loyalty_tier==BRONZE; system id/created_at/version present, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/members"
              payload: { name: "New M", email: "new@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.points_balance == 0"
            - "Member.${m_id}.loyalty_tier == BRONZE"
            - "Member.${m_id}.version == 1"

      - name: member_create_missing_required_email_returns_validation
        claim_type: required_fields
        grounds: [entities.Member.fields.email]
        distinguishing_aspect: "POST /api/members without email -> ERR_VALIDATION (422); no member created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/members"
              payload: { name: "No Email" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: member_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/members/{id} for a non-existent id -> ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: bolt_create_default_reorder_threshold_applied
        claim_type: defaults
        grounds: [entities.FabricBolt.fields.reorder_threshold]
        distinguishing_aspect: "POST /api/fabric-bolts without reorder_threshold -> default 5 applied; status IN_STOCK for original_yards 50."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "DF-1", color: "Cream", price_per_yard: 9.50, original_yards: 50 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          assert:
            - "FabricBolt.${bolt_id}.reorder_threshold == 5"
            - "FabricBolt.${bolt_id}.status == IN_STOCK"
            - "FabricBolt.${bolt_id}.yards_remaining == 50"

      - name: loyalty_tier_silver_at_threshold
        claim_type: computed_fields
        grounds: [entities.Member.fields.loyalty_tier, calculations.member_points_balance]
        distinguishing_aspect: "loyalty_tier boundary uses >=: a single enrollment fee 100.00 earns floor(100*10)=1000 points, landing exactly at SILVER_THRESHOLD -> loyalty_tier==SILVER."
        test_recipe:
          setup: ["A member; an OPEN class fee 100.00."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Tier M", email: "tier@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Masterclass", event_type: "CLASS", instructor: "Mo", start_time: "2026-09-25T10:00:00Z", end_time: "2026-09-25T16:00:00Z", capacity: 8, fee: 100.00 }
              as: Clerk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
          assert:
            - "Member.${m_id}.points_balance == 1000"
            - "Member.${m_id}.loyalty_tier == SILVER"

      - name: loyalty_transaction_ledger_row_immutable_shape
        claim_type: immutability
        grounds: [entities.LoyaltyTransaction.fields.points, entities.LoyaltyTransaction.fields.reason]
        distinguishing_aspect: "LoyaltyTransaction is common_fields:false (no version, no update endpoint): after an enrollment fee 30.00, the member's ledger surfaces one append-only row points==300 reason ENROLLMENT_CONFIRM."
        test_recipe:
          setup: ["A member; an OPEN class fee 30.00; member enrolled."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Led M", email: "led@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Basics", event_type: "CLASS", instructor: "Bea", start_time: "2026-09-26T10:00:00Z", end_time: "2026-09-26T12:00:00Z", capacity: 8, fee: 30.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
          trigger:
            - call: "GET /api/members/${m_id}/loyalty-transactions"
              payload: {}
              as: Clerk
              captures: { p0: "$.data[0].points" }
          assert:
            - "response.data[0].points == 300"
            - "response.data[0].reason == ENROLLMENT_CONFIRM"

  # ------------------------------------------------------------ state_machines
  - section: state_machines
    instances:
      - name: complete_already_completed_job_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LongarmJob.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "COMPLETED is terminal: a second complete on a COMPLETED job -> ERR_JOB_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A member; AVAILABLE machine; a job started and completed."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Tl M", email: "tl@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "Bay2", model: "APQS" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 50, quoted_length_in: 50, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { job_id: $.data.id }
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T12:00:00Z" }
              as: Clerk
            - call: "POST /api/longarm-jobs/${job_id}/complete"
              payload: { measured_width_in: 50, measured_length_in: 50 }
              as: Clerk
          trigger:
            - call: "POST /api/longarm-jobs/${job_id}/complete"
              payload: { measured_width_in: 50, measured_length_in: 50 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_JOB_NOT_IN_PROGRESS"

      - name: start_queued_job_before_start_from_completed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LongarmJob.QUEUED_to_IN_PROGRESS]
        distinguishing_aspect: "start requires QUEUED: starting a COMPLETED job -> ERR_JOB_NOT_QUEUED (409)."
        test_recipe:
          setup: ["A member; AVAILABLE machine; a job started and completed."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Iv M", email: "iv@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/longarm-machines"
              payload: { name: "Bay3", model: "APQS" }
              as: Clerk
              captures: { mac_id: $.data.id }
            - call: "POST /api/longarm-jobs"
              payload: { member_id: "${m_id}", quoted_width_in: 40, quoted_length_in: 40, pattern_tier: "CUSTOM" }
              as: Clerk
              captures: { job_id: $.data.id }
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T12:00:00Z" }
              as: Clerk
            - call: "POST /api/longarm-jobs/${job_id}/complete"
              payload: { measured_width_in: 40, measured_length_in: 40 }
              as: Clerk
          trigger:
            - call: "POST /api/longarm-jobs/${job_id}/start"
              payload: { machine_id: "${mac_id}", scheduled_start: "2026-08-05T13:00:00Z", scheduled_end: "2026-08-05T14:00:00Z" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_JOB_NOT_QUEUED"

      - name: void_already_voided_cut_rejected
        claim_type: invalid_transition
        grounds: [entities.FabricCut.fields.status, "errors[ERR_CUT_NOT_VOIDABLE]"]
        distinguishing_aspect: "VOIDED is terminal for FabricCut: voiding an already-VOIDED cut -> ERR_CUT_NOT_VOIDABLE (409)."
        test_recipe:
          setup: ["A bolt; a cut that has been voided once."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "VV-1", color: "Navy", price_per_yard: 4.00, original_yards: 20 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 3 }
              as: Clerk
              captures: { cut_id: $.data.id }
            - call: "POST /api/fabric-cuts/${cut_id}/void"
              payload: {}
              as: Clerk
          trigger:
            - call: "POST /api/fabric-cuts/${cut_id}/void"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUT_NOT_VOIDABLE"

  # ----------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: cut_exceeding_remaining_returns_insufficient_yardage
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_YARDAGE]"]
        distinguishing_aspect: "On an IN_STOCK (non-discontinued) bolt with 20 yards, a 25-yard cut passes state but fails fiscal -> ERR_INSUFFICIENT_YARDAGE (409)."
        test_recipe:
          setup: ["An IN_STOCK bolt original_yards 20, price 6.00."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "IY-1", color: "Rose", price_per_yard: 6.00, original_yards: 20 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 25 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_YARDAGE"

      - name: non_positive_yards_returns_amount_error
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NON_POSITIVE_AMOUNT]"]
        distinguishing_aspect: "POST /api/fabric-cuts with yards_requested 0 -> ERR_NON_POSITIVE_AMOUNT (422)."
        test_recipe:
          setup: ["An IN_STOCK bolt."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "NP-1", color: "Gold", price_per_yard: 2.00, original_yards: 30 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 0 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NON_POSITIVE_AMOUNT"

      - name: class_invalid_time_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "POST /api/classes with end_time <= start_time -> ERR_INVALID_TIME_WINDOW (409)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/classes"
              payload: { title: "Bad", event_type: "CLASS", instructor: "Bad", start_time: "2026-09-30T14:00:00Z", end_time: "2026-09-30T12:00:00Z", capacity: 5, fee: 20.00 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_TIME_WINDOW"

      - name: duplicate_enrollment_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A member with a CONFIRMED enrollment in a class who enrolls again in the same class -> ERR_DUPLICATE_ENROLLMENT (409)."
        test_recipe:
          setup: ["A member enrolled in an OPEN class capacity 5."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Dup M", email: "dup@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Dup C", event_type: "CLASS", instructor: "Di", start_time: "2026-10-05T10:00:00Z", end_time: "2026-10-05T12:00:00Z", capacity: 5, fee: 20.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
          trigger:
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_ENROLLMENT"

  # ------------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: list_fabric_cuts_filtered_by_bolt
        claim_type: filtered_list
        grounds: [entities.FabricCut.fields.bolt_id]
        distinguishing_aspect: "GET /api/fabric-cuts?bolt_id=... returns the FabricCut[] for that bolt with pagination envelope; two cuts -> total_count 2."
        test_recipe:
          setup: ["A bolt with two CUT rows."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "LF-1", color: "Slate", price_per_yard: 3.00, original_yards: 40 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 2 }
              as: Clerk
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 3 }
              as: Clerk
          trigger:
            - call: "GET /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}" }
              as: Clerk
          assert:
            - "response.data is an array of length 2"
            - "response.meta pagination total_count == 2"

      - name: list_enrollments_filtered_by_member
        claim_type: filtered_list
        grounds: [entities.Enrollment.fields.member_id]
        distinguishing_aspect: "GET /api/enrollments?member_id=... returns the Enrollment[] for that member; one CONFIRMED enrollment -> length 1."
        test_recipe:
          setup: ["A member enrolled in one OPEN class."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Le M", email: "le@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/classes"
              payload: { title: "Le C", event_type: "CLASS", instructor: "Lu", start_time: "2026-10-06T10:00:00Z", end_time: "2026-10-06T12:00:00Z", capacity: 5, fee: 15.00 }
              as: Clerk
              captures: { c_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { class_event_id: "${c_id}", member_id: "${m_id}" }
              as: Clerk
          trigger:
            - call: "GET /api/enrollments"
              payload: { member_id: "${m_id}" }
              as: Clerk
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].member_id == ${m_id}"

  # ----------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: discontinue_by_clerk_returns_forbidden
        claim_type: role_denied
        grounds: [roles.Manager, state_machines.FabricBolt.IN_STOCK_to_DISCONTINUED]
        distinguishing_aspect: "discontinue is Manager-exclusive: Clerk calling POST /api/fabric-bolts/{id}/discontinue -> ERR_FORBIDDEN (403); bolt stays IN_STOCK."
        test_recipe:
          setup: ["An IN_STOCK bolt."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "RB-1", color: "Plum", price_per_yard: 5.00, original_yards: 15 }
              as: Clerk
              captures: { bolt_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-bolts/${bolt_id}/discontinue"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"
            - "FabricBolt.${bolt_id}.status == IN_STOCK"

      - name: member_cannot_create_special_order_for_another_member
        claim_type: ownership
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "entity_backed Member ownership: a Member (X-User-ID m1) posting a SpecialOrder with member_id=m2 (someone else) -> ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Two members m1 and m2."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Own1", email: "own1@x.com" }
              as: Clerk
              captures: { m1_id: $.data.id }
            - call: "POST /api/members"
              payload: { name: "Own2", email: "own2@x.com" }
              as: Clerk
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /api/special-orders"
              payload: { member_id: "${m2_id}", description: "Not mine", quantity: 1, est_unit_cost: 10.00 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

  # ------------------------------------------------------------- cross_cutting
  - section: cross_cutting
    instances:
      - name: special_order_revise_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-revise-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: after one successful revise advances version 1->2, a second revise still carrying expected_special_order_version==1 (stale) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A QUOTED special order at version 1; one successful revise makes it version 2."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { name: "Occ M", email: "occ@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /api/special-orders"
              payload: { member_id: "${m_id}", description: "Needle set", quantity: 1, est_unit_cost: 10.00 }
              as: Clerk
              captures: { so_id: $.data.id, so_v1: $.data.version }
            - call: "POST /api/special-orders/${so_id}/revise-quote"
              payload: { est_unit_cost: 12.00, quantity: 1, expected_special_order_version: "${so_v1}" }
              as: Clerk
          trigger:
            - call: "POST /api/special-orders/${so_id}/revise-quote"
              payload: { est_unit_cost: 14.00, quantity: 1, expected_special_order_version: "${so_v1}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: bolt_discontinue_cascades_kit_unavailable
        claim_type: derived_field_reconciliation
        grounds: [state_machines.FabricBolt.IN_STOCK_to_DISCONTINUED, entities.Kit.fields.status]
        distinguishing_aspect: "Cross-entity reconciliation: discontinuing a bolt that a kit's components reference flips that Kit.status AVAILABLE -> UNAVAILABLE."
        test_recipe:
          setup: ["A bolt; a kit whose single component references that bolt (status AVAILABLE)."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "KC-1", color: "Mint", price_per_yard: 5.00, original_yards: 30 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/kits"
              payload: { name: "Mint Kit", kit_type: "KIT", components: [ { bolt_id: "${bolt_id}", yards_per_kit: 2, quantity: 1 } ] }
              as: Clerk
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /api/fabric-bolts/${bolt_id}/discontinue"
              payload: {}
              as: Manager
          assert:
            - "FabricBolt.${bolt_id}.status == DISCONTINUED"
            - "Kit.${kit_id}.status == UNAVAILABLE"

  # ------------------------------------------------------------- consistency
  - section: consistency_model
    instances:
      - name: cut_immediately_reconciles_bolt_yards
        claim_type: immediate
        grounds: [calculations.bolt_yards_remaining, entities.FabricBolt.fields.yards_remaining]
        distinguishing_aspect: "immediate consistency: the cut response and an immediate GET of the bolt both show yards_remaining decremented in the same request cycle (30 - 4 = 26)."
        test_recipe:
          setup: ["A bolt original_yards 30."]
          setup_api_calls:
            - call: "POST /api/fabric-bolts"
              payload: { sku: "IM-1", color: "Coral", price_per_yard: 3.50, original_yards: 30 }
              as: Clerk
              captures: { bolt_id: $.data.id }
            - call: "POST /api/fabric-cuts"
              payload: { bolt_id: "${bolt_id}", yards_requested: 4 }
              as: Clerk
          trigger:
            - call: "GET /api/fabric-bolts/${bolt_id}"
              payload: {}
              as: Clerk
              captures: { yr: $.data.yards_remaining }
          assert:
            - "FabricBolt.${bolt_id}.yards_remaining == 26"

  # -------------------------------------------------- excluded_because stubs
  - section: calculations
    instances:
      - name: longarm_pricing_correct_result
        claim_type: correct_result
        grounds: [calculations.longarm_pricing]
        excluded_because:
          difficulty_instance: dual_variant_calc / longarm_estimate_vs_final_price
          rationale: "longarm_pricing estimate/final results are pinned as literals (168.00/172.20) in the named 1.8 instance."
      - name: kit_price_correct_result
        claim_type: correct_result
        grounds: [calculations.kit_price]
        excluded_because:
          difficulty_instance: combinatorial_formula / kit_price_round_per_component_then_sum
          rationale: "kit_price rounding order and value (14.00) asserted in the named 1.8 instance."
      - name: special_order_pricing_correct_result
        claim_type: correct_result
        grounds: [calculations.special_order_pricing]
        excluded_because:
          difficulty_instance: dual_variant_calc / special_order_quote_vs_final_total
          rationale: "quoted_price/final_total literals (45.00/59.00) asserted in the named 1.8 instance."

  - section: errors
    instances:
      - name: error_class_full_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_CLASS_FULL]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / class_capacity_last_seat_full
          rationale: "ERR_CLASS_FULL is triggered as the third-enrollment rejection in the named 1.8 instance."
      - name: error_machine_schedule_conflict_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_MACHINE_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / longarm_machine_buffer_overlap
          rationale: "ERR_MACHINE_SCHEDULE_CONFLICT triggered by the buffer-gap collision in the named 1.8 instance."
