          - entities.GrantProgram.fields.deferred_project_count
        distinguishing_aspect: |
          A different entity from the first instance, and the loop is driven entirely
          by a sibling's transition rather than by an actor call on the looping entity:
          the 35.23-scoring project reaches DEFERRED as a system cascade of a sibling
          award, then returns to SCORED as a compensation cascade of that sibling's
          withdrawal, keeping its previously computed benefit_cost_score of 35.23
          rather than re-deriving it. State is therefore not a function of the
          project's own request history, and DEFERRED is explicitly non-terminal
