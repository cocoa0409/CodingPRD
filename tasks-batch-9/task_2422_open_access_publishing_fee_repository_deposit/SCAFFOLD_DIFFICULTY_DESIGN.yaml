            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p13_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2027-07-01", article_quota: 3, discount_pct: 0.25, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p13_v}" }
              as: AgreementAdmin
              captures: { ta13_id: $.data.id, ta13_status_draft: $.data.status }
