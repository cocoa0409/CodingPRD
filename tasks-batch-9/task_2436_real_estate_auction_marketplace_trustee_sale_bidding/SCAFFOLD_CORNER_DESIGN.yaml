            - "First trigger: HTTP 422 and ${err_id} == ERR_AUDIT_MODE_REQUIRES_LOT"
            - "Second trigger: HTTP 200 with ${mode} == AUDIT"
            - "${id_w} == 0 (identity_verified_at 2026-09-10 precedes the event start 2026-09-15T17:00:00Z)"
            - "${exc} == 0 and ${dep_w} == 10 (the audit reads the CURRENT deposit ledger, which is 0)"
            - "${score} == 10 and ${elig} == true (10 < ELIGIBILITY_MAX_SCORE)"

      - name: closing_after_the_deadline_is_refused_but_fallout_is_still_allowed
