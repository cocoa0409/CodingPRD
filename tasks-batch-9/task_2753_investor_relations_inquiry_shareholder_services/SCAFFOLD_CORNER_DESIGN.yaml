  - section: validations
    instances:
      - name: duplicate_ticker_is_rejected_across_companies
        claim_type: violation_error
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_TICKER]
          - entities.Company.fields.ticker
        distinguishing_aspect: "Ticker uniqueness is global, not per legal_name: a second company created with an existing ticker is refused with ERR_DUPLICATE_TICKER (409) and no row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with ticker DUP already stored."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "DUP", legal_name: "First Duplicate Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          trigger:
            - call: "POST /companies"
              payload: { ticker: "DUP", legal_name: "Second Duplicate Corp", shares_outstanding: 2000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "GET /companies"
              payload: { ticker: "DUP" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "trigger step 1 responds HTTP 409 with $.data.error_id == ERR_DUPLICATE_TICKER"
            - "trigger step 2 returns exactly 1 row with total_count == 1 and $.data[0].id == ${co_id}"

      - name: fact_key_uniqueness_is_released_by_supersession
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_FACT_KEY]
          - state_machines.Disclosure.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: "fact_key is unique only among DRAFT and PUBLISHED rows: reusing a live key is refused with ERR_DUPLICATE_FACT_KEY, but once the original row is SUPERSEDED by a newer guidance publication the same key is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company with a PUBLISHED EPS / FY2026 guidance disclosure carrying fact_key EPS-FY2026-INITIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
