  # ===========================================================================
  # RULE 4 — Transitive cascades
  # Instance 1: depth 6, triggered by POST /transmitters/{id}/power-state.
  # Instance 2: depth 3, triggered by POST /assets/{id}/retract (a completely
  #             different transition on a different entity).
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: power_derate_cascades_six_hops_to_spot_credit
        grounds:
          - state_machines.Transmitter.FULL_POWER_to_REDUCED_POWER
          - calculations.regulatory_notification_deadline
          - calculations.multiplex_bitrate_allocation
          - calculations.channel_posture
          - state_machines.PlaylistItem.PLAYING_to_TRUNCATED
          - state_machines.PlaylistItem.SCHEDULED_to_PREEMPTED
          - calculations.spot_credit_settlement
          - calculations.spot_inventory_conservation
        distinguishing_aspect: |
          A single power-state write propagates through six causally chained hops
          that each depend on the previous one's write: (1) a PENDING
          POWER_REDUCTION RegulatoryNotification because 40 < 80, (2)
          derate_factor 0.50 shrinking effective_capacity_kbps 19500 -> 9500, (3)
          the waterfall rerun starving channel 12.3 whose 5000 kbps floor no
          longer fits, (4) that channel's posture -> SUSPENDED and air_status ->
          BARS_AND_TONE, (5) its PLAYING item -> TRUNCATED at 1200 s and its two
          SCHEDULED commercials -> PREEMPTED with SYSTEM-sourced AsRunEntry rows,
          and (6) 1000 cents of spot credit accruing on the order; cutting the
          chain at any hop leaves a different observable field wrong.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER (derate_factor 1.00) carrying MUX-A (total_capacity_kbps 20000, pilot_reserved_kbps 500), effective_capacity_kbps 19500."
