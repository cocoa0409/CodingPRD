        excluded_because:
          difficulty_instance: non_linear_state_machine / appointment_parallel_axes_pay_suspend_leaves_lifecycle_active
          rationale: "That §1.8 instance already asserts suspend-pay/resume-pay moving payroll_status while lifecycle_status stays ACTIVE, which is exactly the parallel-shape claim."

