            - "ShootBlock.${blk_two_id}.status == ROLLING"
            - "ShootBlock.${blk_two_id}.covered_head_count == 0"
            - "ShootBlock.${blk_two_id}.release_coverage_complete == false"

      - name: welfare_band_floor_exactly_five_million_crosses_rate
        grounds:
          - calculations.welfare_commitment_rollup
          - entities.Production.fields.welfare_committed_cents
          - endpoints[POST /casting/productions/{id}/welfare-protocols]
        distinguishing_aspect: |
          A third metric on a third endpoint: the welfare band floor at the protocol
          creation endpoint. A pre-surcharge subtotal of 4,999,999 selects band 0.04 and
          yields welfare_committed_cents 5,199,999, while adding a single cent of cost to
          reach exactly 5,000,000 selects band 0.07 and yields 5,350,000 — a 150,001-cent
          jump caused by a 1-cent input change.
        test_recipe:
          setup:
            - "One DOCUSOAP / CA production, so duty_of_care_tier is STANDARD (tier_factor 1.0), with welfare_budget_cents 10,000,000 and no protocols yet."
