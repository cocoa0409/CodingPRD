          setup:
            - "ConversionProject with total_unit_count 3 and an ACCEPTED EngineeringReport with a
               PASSED suitability assessment."
            - "DeclarationPackage in status PLAT_CERTIFIED with three INCLUDED Units L-1, L-2 and
               L-3 created in that order, with immutable base_percentage_interest_bp 3333, 3333 and
               3334 (base_sum exactly 10000)."
            - "No InitialBudget is adopted, so every unit_annual_assessment_cents is 0 and the probe
               isolates the basis-point allocation from the cent allocation."
            - "No purchase agreements and no closing batches exist, so the withdrawal cannot fire any
               other cascade hop."
            - "Logical clock rests at the startup default 2026-08-01T00:00:00Z."
