              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "boundary-renew", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains/${dom_id}/renew"
              payload: { years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { new_exp: $.data.expires_on }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-15T00:00:01Z" }
