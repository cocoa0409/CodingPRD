      - name: participation_fee_charges_the_marginal_rate_only_above_the_first_tier_cap
        claim_type: tiered_pricing
        grounds:
          - calculations.participation_fee
          - calculations.participation_fee.constants.TIER_1_CAP
          - entities.ParticipationInvoice.fields.tier_charge_breakdown
          - entities.Participant.fields.fee_tier
        distinguishing_aspect: |
          The waterfall boundary sits at TIER_1_CAP 24750 monthly units. A participant whose monthly volume
          is exactly 24750 pays 24750 x 1.75 = 43312.5 -> 43313 cents and is TIER_1; a participant at 24751
          pays the same 43313 for the first tier plus one unit at the marginal 1.25 rate (round_half_up(1.25)
          == 1) for 43314 total and becomes TIER_2. The average rate never applies to the whole volume.
        test_recipe:
          setup:
            - "Two participants registered with declared volumes 297000 and 297012, giving monthly volumes ceil(297000/12) == 24750 and ceil(297012/12) == 24751."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants"
              payload: { legal_name: "Vesper Ridge Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 297000, primary_contact_email: "hie@vesperridge.example" }
              as: HieAdmin
              captures: { pC3_a_id: $.data.id, pC3_a_fee: $.data.provisional_monthly_fee_cents, pC3_a_tier: $.data.fee_tier }
            - call: "POST /hie/participants"
              payload: { legal_name: "Westmarch General Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 297012, primary_contact_email: "hie@westmarch.example" }
              as: HieAdmin
              captures: { pC3_b_id: $.data.id, pC3_b_fee: $.data.provisional_monthly_fee_cents, pC3_b_tier: $.data.fee_tier }
          assert:
            - "${pC3_a_fee} == 293313"
            - "${pC3_a_tier} == TIER_1"
            - "${pC3_b_fee} == 293314"
            - "${pC3_b_tier} == TIER_2"
            - "293314 - 293313 == 1: only the single unit above the cap is charged at the marginal rate"
      - name: quality_score_rounds_half_up_at_the_third_decimal_and_honours_the_900_second_band
        claim_type: Precision
        grounds:
          - calculations.participant_quality_score
          - calculations.participant_quality_score.precision
          - endpoints.GET_hie_participants_id_scorecard
        distinguishing_aspect: |
          The weighted sum for a single sample of 8000 received / 100 rejected / 250 missing / 60 duplicate
          with p95 exactly 900 seconds is 0.30(96.875) + 0.30(98.75) + 0.15(99.25) + 0.25(85) = 94.825
          exactly. round_half_up to 2 decimals gives 94.83; truncation or banker's rounding gives 94.82.
          The p95 of exactly 900 also proves the <= 900 band boundary awards 85, not 60.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with a single ADT feed and no samples yet."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Yarrowfield Community Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@yarrowfield.example" }
              as: HieAdmin
              captures: { pC4_id: $.data.id }
