# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: state-veterans-home-admission-per-diem (task_2557)
# Every rule_id below is verbatim from SKILL.md §0.5; every instance grounds only in
# SCAFFOLD.yaml §1.1–§1.7. Every numeric assert literal was produced by executing the
# corresponding `calculations[].formula` with its `constants:` as Python.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_provisional_vs_final_divergence
        grounds:
          - calculations.resident_cost_share_monthly
          - calculations.governing_cost_share_selector
          - entities.CostShareDetermination.fields.variant
          - entities.CostShareDetermination.fields.delta_from_prior_cents
          - entities.IncomeRecord.fields.verification_status
          - state_machines.Resident.PROVISIONAL_COST_SHARE_to_FINAL_COST_SHARE
          - validations[priority=78]
        distinguishing_aspect: |
          On the resident-finance domain, the identical three IncomeRecord rows and identical home
          PNA yield monthly_cost_share_cents 141445 under PROVISIONAL and 79164 under FINAL,
          because the two variants disagree on four axes at once (UNVERIFIED income counted vs
          excluded, medical deduction 0 vs 15000, resident_day_count 27 calendar days vs 23
          RESIDENT_DAY census rows, and calendar proration applied vs not applied).
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with personal_needs_allowance_monthly_cents 9000."
            - "One CERTIFIED NURSING CareUnit with licensed_bed_count 2, out_of_service_bed_count 0, per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-05 into that unit, occupancy_status ADMITTED, billing_status PROVISIONAL_COST_SHARE, current_care_level NURSING."
            - "Three IncomeRecord rows for effective_month 2026-08: SSA 180000 VERIFIED, VA_COMPENSATION 120000 left UNVERIFIED, MILITARY_RETIREMENT 40000 VERIFIED."
            - "A closed bed-hold interval 2026-08-20 through 2026-08-23 (hospitalized 2026-08-20, readmitted 2026-08-24), so bed_hold_days_used is 4."
            - "A census run through 2026-08-31 has materialised 23 RESIDENT_DAY and 4 BED_HOLD_DAY CensusDay rows for August."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Lakeview State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Alvin Reyes", date_of_birth: "1948-03-12", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { wl_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: StateProgramAdmin
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-08-05" }
