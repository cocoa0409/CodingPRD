          programme was PAUSED after the offer was accepted AND the buyer's remaining self-funding
          headroom (500000) is far below the pre-fee net (992500). Both checks are true in the same
          request; priority 8 must win with a 409 rather than the more eye-catching 402. Resuming
          the programme then exposes the suppressed lower error, proving it was genuinely violated.
