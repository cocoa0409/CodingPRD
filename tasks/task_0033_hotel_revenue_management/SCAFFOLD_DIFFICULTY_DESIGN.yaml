# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Cross-references the nine Difficulty Rules from §0.5 of the scaffold-generator
# skill against §1.1–§1.7 declared in SCAFFOLD.yaml. ≥ 2 instances per rule_id;
# total instances >= 18.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: walkout_compensation_estimated_vs_actual_on_overbooking_policy
        grounds:
          - calculations.walkout_compensation_estimated
          - calculations.walkout_compensation_actual
          - entities.OverbookingPolicy.fields.estimated_no_show_probability_basis_points
          - entities.OverbookingPolicy.fields.walkout_compensation_cents
        distinguishing_aspect: |
          Both calculations operate on the OverbookingPolicy domain but produce different cents
          for the same date: the forward-looking estimate multiplies by no_show_probability and
          aggregates over expected_arrivals minus capacity, while the chronological actual is
          compensation_cents * nights of the single walked-out reservation — the two never coincide
          when probability < 100%, satisfying the dual-variant clause.
        test_recipe:
          setup:
            - "Create RoomType STD with base_rate_cents=20000, max_occupancy=2"
            - "Create 4 ACTIVE Rooms bound to STD"
            - "Create OverbookingPolicy(STD, 2026-06-10) with overbook_ratio=1500bp, no_show_probability=2000bp, walkout_compensation_cents=15000"
            - "Create 5 CONFIRMED Reservations spanning 2026-06-10 single night via DIRECT channel"
          trigger:
            - "GET /hotel/overbooking-policies/STD/2026-06-10/walkout-cost-estimate -> estimated_cost_cents"
            - "Advance clock to 2026-06-10T15:00; POST /hotel/reservations/{R5}/walk-out"
          assert:
            - "estimated_cost_cents == round_half_up(max(0, 5*(1-0.20) - 4) * 15000) == 0  # 5*0.8=4 expected, capacity 4 -> 0 walkouts forecast"
            - "Reservation.R5.walkout_compensation_cents == 15000  # 1 night * 15000 — not 0"
            - "estimated_cost_cents != Reservation.R5.walkout_compensation_cents"

      - name: refund_amount_vs_no_show_charge_on_reservation
        grounds:
          - calculations.refund_amount
          - calculations.no_show_charge
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          Both calculations finalize the monetary outcome of an unfulfilled Reservation against the
          same RatePlan.refund_tier_code, but live on different entity domains in their inputs and
          produce divergent cents for the same booked_total: refund_amount uses lead_time bucketing
          on Reservation.cancelled_at, no_show_charge uses tier-only flat ratios at no-show time —
          for a MODERATE rate cancelled 5 days out (>=72h<168h) you get refund=50% (charge=50%),
          but for the same booking cancelled inside 72h refund=0 (charge=100%), versus the parallel
          NO_SHOW path which always charges MODERATE=50% regardless of when the booking was made.
        test_recipe:
          setup:
            - "Create RoomType STD base_rate_cents=20000, 4 rooms, RatePlan MOD with refund_tier_code=MODERATE, modification_allowed=true"
            - "Create Channel DIRECT priority_rank=1; mapping(MOD,DIRECT)=10000bp"
            - "Set clock to 2026-06-01T10:00; create+confirm Reservation R1 (check_in=2026-06-09, check_out=2026-06-11) -> booked_total_cents=40000"
            - "Set clock to 2026-06-01T10:00; create+confirm Reservation R2 same dates -> booked_total_cents=40000"
          trigger:
            - "Advance clock to 2026-06-04T10:00 (5 days lead); POST /hotel/reservations/{R1}/cancel"
            - "Advance clock to 2026-06-10T11:00 (24h past check_in 06-09); system NO_SHOW for R2"
          assert:
            - "Reservation.R1.refund_amount_cents == 20000  # 50% of 40000 (lead 120h falls in [72,168))"
            - "Reservation.R2.no_show_charge_cents == 20000  # MODERATE tier 50% of 40000"
            - "Reservation.R1.refund_amount_cents + Reservation.R1.no_show_charge_cents != Reservation.R2.refund_amount_cents + Reservation.R2.no_show_charge_cents  # only one path executed per row"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: overbooking_ceiling_floor_then_compare_threshold
        grounds:
          - calculations.overbooking_limit_check
          - entities.OverbookingPolicy.fields.overbook_ratio_basis_points
          - entities.MaintenanceBlock
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The ceiling formula is
          physical_capacity + floor(physical_capacity * overbook_ratio_basis_points / 10000); this
          is "multiply integers, then floor, then add", NOT "ratio * total reservations rounded".
          For physical_capacity=10 and ratio=1500bp the scaffold pins ceiling=11 (10 + floor(1.5)),
          not 12 that "round-then-floor" might suggest. The boundary is strict: cumulative > ceiling
          means EXCEEDED; cumulative == ceiling is allowed.
        test_recipe:
          setup:
            - "Create RoomType STD base_rate_cents=20000; create 10 ACTIVE rooms bound to STD"
            - "Create OverbookingPolicy(STD, 2026-07-15) overbook_ratio=1500bp"
            - "Create Channel DIRECT priority_rank=1; RatePlan BAR (FLEXIBLE, modification_allowed=true); mapping(BAR,DIRECT)=10000bp"
            - "Create + confirm 11 Reservations for 2026-07-15..2026-07-16 via DIRECT (cumulative reaches 11 == ceiling, accepted)"
          trigger:
            - "POST /hotel/reservations (12th) and POST /hotel/reservations/{R12}/confirm"
          assert:
            - "11th confirm succeeded (boundary == ceiling allowed)"
            - "12th confirm fails 409 with error_id == ERR_OVERBOOKING_LIMIT_EXCEEDED  # cumulative_total 12 > ceiling 11"

      - name: refund_amount_tiered_lookup_then_single_round_then_multiply
        grounds:
          - calculations.refund_amount
          - entities.RatePlan.fields.refund_tier_code
          - entities.Reservation.fields.cancelled_at
        distinguishing_aspect: |
          Mode (a) — formula with 3 inputs (booked_total_cents, refund_tier_code, lead_time_hours)
          and non-linear interaction (tier-table lookup branches by tier value, then bucket selects
          by lead_time, then ratio is applied). The scaffold pins the order: ratio lookup -> single
          multiplication -> single round_half_up at the end. Per-night refund rounding (which would
          drift) is forbidden; the test confirms the single-rounding path produces 12001 cents on
          an odd input where per-night rounding would give 12002.
        test_recipe:
          setup:
            - "Create RoomType STD base_rate_cents=12001; 4 rooms; RatePlan FLEX (FLEXIBLE), Channel DIRECT, mapping=10000bp"
            - "Set clock 2026-08-01T10:00; create+confirm Reservation R (check_in=2026-08-10, check_out=2026-08-12) -> booked_total_cents=24002 (2 nights * 12001)"
          trigger:
            - "Set clock 2026-08-09T13:00 (lead 21h < 24h, FLEXIBLE bucket -> 5000bp = 50%)"
            - "POST /hotel/reservations/{R}/cancel"
          assert:
            - "Reservation.R.refund_amount_cents == 12001  # round_half_up(24002 * 5000 / 10000) = round(12001.0) = 12001"
            - "Note: per-night refund (round(12001*0.5)+round(12001*0.5)) = 6001+6001 = 12002 (forbidden); single rounding gives 12001"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_booking_and_payment_status
        grounds:
          - state_machines.Reservation
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.payment_status
          - entities.Reservation.fields.dispute_status
        distinguishing_aspect: |
          Reservation carries THREE parallel state dimensions on the same row: booking_status
          (PENDING/CONFIRMED/CHECKED_IN/CHECKED_OUT/CANCELLED/NO_SHOW/WALKED_OUT), payment_status
          (UNPAID/AUTHORIZED/CAPTURED/REFUNDED_PARTIAL/REFUNDED_FULL/CHARGEBACK), and dispute_status
          (NONE/OPEN/RESOLVED_GUEST/RESOLVED_HOTEL). They evolve INDEPENDENTLY: a single CHECKED_IN
          reservation can transition payment_status separately, and dispute_status changes do not
          rewind booking_status. Linear pipelines do not carry this shape.
        test_recipe:
          setup:
            - "Set up RoomType STD (1 room), RatePlan FLEX FLEXIBLE, Channel DIRECT mapping=10000bp"
            - "Set clock 2026-09-01T10:00; create+confirm Reservation R (2026-09-10..2026-09-11)"
          trigger:
            - "Set clock 2026-09-11T12:00 (24h past check_in_date); system advances R to NO_SHOW with payment_status=CAPTURED, dispute_status=NONE"
            - "POST /hotel/reservations/{R}/dispute -> dispute_status=OPEN; booking_status remains NO_SHOW"
            - "POST /hotel/reservations/{R}/resolve-dispute body={resolution: GUEST} -> dispute_status=RESOLVED_GUEST, payment_status=REFUNDED_FULL; booking_status STILL NO_SHOW"
          assert:
            - "After dispute open: Reservation.R.booking_status == NO_SHOW"
            - "After dispute open: Reservation.R.dispute_status == OPEN"
            - "After resolve: Reservation.R.payment_status == REFUNDED_FULL"
            - "After resolve: Reservation.R.booking_status == NO_SHOW  # unchanged — three dimensions are independent"

      - name: rate_override_cyclic_revision_loop
        grounds:
          - state_machines.RateOverride
          - state_machines.RateOverride.PENDING_APPROVAL_to_DRAFT
          - state_machines.RateOverride.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          RateOverride supports the cycle DRAFT -> PENDING_APPROVAL -> DRAFT (via withdraw),
          enabling iterative revision before approval. A second submit advances the same row back
          to PENDING_APPROVAL with a re-approvable status — a true cycle on a different entity than
          Reservation, satisfying the cross-entity differentiation clause.
        test_recipe:
          setup:
            - "Create RoomType STD; PlatformAdmin and a RevenueAnalyst (analyst_id=user-analyst-1)"
            - "POST /hotel/rate-overrides body={room_type_id, stay_date=2026-10-01, proposed_rate_cents=25000, recommendation_source=MANUAL_OVERRIDE} -> RO in DRAFT"
          trigger:
            - "POST /hotel/rate-overrides/{RO}/submit -> PENDING_APPROVAL"
            - "POST /hotel/rate-overrides/{RO}/withdraw -> DRAFT"
            - "POST /hotel/rate-overrides/{RO}/submit -> PENDING_APPROVAL (cycle traversed)"
          assert:
            - "Final RateOverride.RO.status == PENDING_APPROVAL"
            - "Audit trail shows two DRAFT->PENDING_APPROVAL transitions on same RO id"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: rate_override_approval_supersede_then_parity_then_audit_chain_depth_three
        grounds:
          - state_machines.RateOverride.PENDING_APPROVAL_to_APPROVED
          - calculations.rate_parity_check
          - entities.AuditLog
        distinguishing_aspect: |
          Trigger: POST /hotel/rate-overrides/{new}/approve. Hop 1: approval mutates new RO
          status DRAFT-path -> APPROVED and applied_rate_cents. Hop 2: caused by hop 1, the prior
          APPROVED RateOverride for same (room_type_id, stay_date) transitions to SUPERSEDED
          (its own state mutation, not the original action). Hop 3: caused by hop 2's now-active
          new effective_rate, rate_parity_check sweeps enabled ChannelRatePlanMappings; on
          tolerance breach it inserts AuditLog event_type=RATE_PARITY_VIOLATION_DETECTED. Each
          hop is caused by the previous, not directly by the approve call — depth >= 3.
        test_recipe:
          setup:
            - "Create RoomType STD base_rate_cents=20000; ACTIVE rooms"
            - "Create Channel OTA1 (OTA, commission=1500bp), OTA2 (OTA, commission=1500bp)"
            - "Create RatePlan BAR (room_type_id=STD); mappings BAR-OTA1 (5000bp), BAR-OTA2 (5000bp), both enabled"
            - "Create+approve RateOverride RO1 (STD, 2026-11-01, 22000) — analyst submits, manager approves"
            - "Create RateOverride RO2 (STD, 2026-11-01, 30000) DRAFT, submit -> PENDING_APPROVAL"
          trigger:
            - "POST /hotel/rate-overrides/{RO2}/approve (different X-User-ID than analyst)"
          assert:
            - "RateOverride.RO2.status == APPROVED  # hop 1"
            - "RateOverride.RO1.status == SUPERSEDED  # hop 2 caused by hop 1"
            - "AuditLog WHERE event_type == RATE_OVERRIDE_APPROVED AND subject_id == RO2 has 1 row"
            - "Note: parity check audit emitted only if tolerance breached; with both OTA channels at same commission, no breach. To force breach, alter OTA2.commission to 4000bp before approve and assert AuditLog RATE_PARITY_VIOLATION_DETECTED has 1 row (hop 3)"

      - name: maintenance_block_release_cascade_to_room_op_then_housekeeping_depth_two
        grounds:
          - state_machines.MaintenanceBlock.ACTIVE_to_RELEASED
          - state_machines.Room
          - entities.Room.fields.operational_status
          - entities.Room.fields.housekeeping_status
        distinguishing_aspect: |
          Trigger: POST /hotel/maintenance-blocks/{id}/release. Hop 1: block.status ACTIVE ->
          RELEASED. Hop 2 (caused by hop 1): if no other ACTIVE block covers the Room and Room
          was OUT_OF_ORDER, Room.operational_status flips back to IN_SERVICE; this cascade is
          itself triggered by hop 1's "no remaining covers" predicate, not by the API call.
          Within hop 2 the housekeeping dimension also flips OCCUPIED-not-applicable -> DIRTY
          (technician left dust). Depth >= 2 starting from a different trigger than rule
          instance 1 (release vs approve), satisfying the differentiation clause.
        test_recipe:
          setup:
            - "Create RoomType STD; create Room R1 (room_type=STD)"
            - "Create MaintenanceBlock MB1 (R1, 2026-12-01, 2026-12-05) -> SCHEDULED"
            - "Advance clock to 2026-12-02T10:00 -> MB1 becomes ACTIVE; R1.operational_status=OUT_OF_ORDER"
          trigger:
            - "POST /hotel/maintenance-blocks/{MB1}/release"
          assert:
            - "MaintenanceBlock.MB1.status == RELEASED  # hop 1"
            - "Room.R1.operational_status == IN_SERVICE  # hop 2 caused by hop 1"
            - "Room.R1.housekeeping_status == DIRTY  # second leg of hop 2"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_room_unavailable_on_check_in
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_ROOM_UNAVAILABLE
        distinguishing_aspect: |
          Pair = (state, business_safety). When a CHECKED_OUT Reservation receives a check-in
          call AND the requested Room is OUT_OF_ORDER, both checks would fail. The scaffold
          pins ERR_INVALID_STATE (priority 5) wins — the wrong-status error must surface before
          the room-availability error. A second check-in attempt on a CONFIRMED reservation
          with OUT_OF_ORDER Room must surface ERR_ROOM_UNAVAILABLE (priority 8) instead.
        test_recipe:
          setup:
            - "Create RoomType STD; Room R1 (STD); RatePlan FLEX FLEXIBLE; Channel DIRECT mapping=10000bp"
            - "Create+confirm+check-in+check-out Reservation Rx (so Rx.booking_status=CHECKED_OUT)"
            - "POST /hotel/rooms/{R1}/out-of-service (R1.operational_status=OUT_OF_ORDER)"
          trigger:
            - "POST /hotel/reservations/{Rx}/check-in body={room_id: R1}"
          assert:
            - "Response 409, error_id == ERR_INVALID_STATE  # NOT ERR_ROOM_UNAVAILABLE"

      - name: business_safety_vs_business_referential_room_type_mismatch_vs_reference_not_found
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors.ERR_REFERENCE_NOT_FOUND
          - errors.ERR_ROOM_TYPE_MISMATCH
        distinguishing_aspect: |
          Pair = (existence/business_referential, business_safety). When check-in references a
          non-existent room_id (existence p4) AND the reservation's room_type would also mismatch
          even if it existed, ERR_REFERENCE_NOT_FOUND wins (existence checks fire before
          safety). Differentiation: previous instance is (state, business_safety); this one is
          (existence, business_safety) — different category pair as §0.5 requires.
        test_recipe:
          setup:
            - "Create RoomType STD and DLX; Room R_dlx (DLX, ACTIVE, VACANT_CLEAN, IN_SERVICE)"
            - "Create+confirm Reservation Rx with room_type_id=STD"
          trigger:
            - "POST /hotel/reservations/{Rx}/check-in body={room_id: 'nonexistent-uuid'}"
          assert:
            - "Response 404, error_id == ERR_REFERENCE_NOT_FOUND  # NOT ERR_ROOM_TYPE_MISMATCH"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: overbooking_ceiling_strict_greater_than_boundary_on_confirm
        grounds:
          - calculations.overbooking_limit_check
          - validations[priority=16]
          - endpoints[POST /hotel/reservations/{id}/confirm]
        distinguishing_aspect: |
          Numeric threshold boundary on Reservation.confirm. cumulative_total == ceiling is
          allowed, > ceiling is rejected. With physical_capacity=4 and ratio=2500bp, ceiling =
          4 + floor(1.0) = 5. The 5th confirm succeeds (== ceiling); the 6th fails. Distinct
          metric: cumulative reservation count, vs the next instance which is an empty-set
          boundary on a different endpoint.
        test_recipe:
          setup:
            - "Create RoomType STD; 4 ACTIVE rooms"
            - "Create OverbookingPolicy(STD, 2026-12-25) ratio=2500bp -> ceiling 5"
            - "Create Channel DIRECT; RatePlan BAR FLEXIBLE; mapping(BAR,DIRECT)=10000bp"
            - "Create+confirm 4 Reservations for 2026-12-25..2026-12-26 (cumulative=4 < 5, OK)"
          trigger:
            - "Create+confirm 5th Reservation -> succeeds (cumulative==5==ceiling)"
            - "Create+confirm 6th Reservation"
          assert:
            - "5th response 200, Reservation.booking_status == CONFIRMED"
            - "6th response 409, error_id == ERR_OVERBOOKING_LIMIT_EXCEEDED  # cumulative 6 > ceiling 5"

      - name: empty_candidate_room_set_walkout_trigger_via_walk_out_endpoint
        grounds:
          - state_machines.Reservation.CONFIRMED_to_WALKED_OUT
          - endpoints[POST /hotel/reservations/{id}/walk-out]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Empty-set boundary on a different endpoint and metric. Walk-out is allowed only when
          count(Rooms with room_type_id == res.room_type_id AND housekeeping_status==VACANT_CLEAN
          AND operational_status==IN_SERVICE AND no overlapping non-cancelled MaintenanceBlock)
          == 0. With exactly one such room available, walk-out must be rejected; with zero, it
          succeeds. The boundary is on collection-cardinality (empty vs non-empty), not numeric
          threshold — different metric class than instance 1, different endpoint.
        test_recipe:
          setup:
            - "Create RoomType STD; 1 ACTIVE Room R1 (VACANT_CLEAN, IN_SERVICE)"
            - "Create OverbookingPolicy(STD, 2027-01-15) ratio=10000bp"
            - "Create Channel DIRECT; RatePlan FLEX FLEXIBLE; mapping(FLEX,DIRECT)=10000bp"
            - "Set clock to 2027-01-15T08:00; create+confirm 2 Reservations R_a, R_b for 2027-01-15..2027-01-16"
          trigger:
            - "POST /hotel/reservations/{R_a}/walk-out  # WHILE R1 still VACANT_CLEAN — candidate set non-empty"
            - "POST /hotel/reservations/{R_a}/check-in body={room_id: R1}  # consumes R1"
            - "POST /hotel/reservations/{R_b}/walk-out  # NOW candidate set is empty (R1 OCCUPIED)"
          assert:
            - "First walk-out: 409 error_id == ERR_INVALID_STATE  # boundary: 1 room available > 0, walk-out forbidden"
            - "Second walk-out: 200, Reservation.R_b.booking_status == WALKED_OUT  # boundary: 0 rooms available, walk-out permitted"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_check_in_depends_on_room_op_and_housekeeping_status
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - entities.Room.fields.operational_status
          - entities.Room.fields.housekeeping_status
        distinguishing_aspect: |
          Pair = (Reservation, Room). Reservation's CONFIRMED -> CHECKED_IN transition is gated
          on Room.operational_status == IN_SERVICE AND Room.housekeeping_status == VACANT_CLEAN
          — a cross-entity guard. Different entity pair than the next instance.
        test_recipe:
          setup:
            - "Create RoomType STD; Room R1 (STD); RatePlan FLEX FLEXIBLE; Channel DIRECT mapping=10000bp"
            - "Create+confirm Reservation Rx for today..tomorrow"
            - "POST /hotel/rooms/{R1}/out-of-service -> R1.operational_status=OUT_OF_ORDER"
          trigger:
            - "POST /hotel/reservations/{Rx}/check-in body={room_id: R1}"
          assert:
            - "Response 409, error_id == ERR_ROOM_UNAVAILABLE  # Reservation transition rejected because Room state forbids it"

      - name: reservation_confirm_depends_on_rate_plan_and_channel_mapping_state
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.RatePlan.fields.status
          - entities.ChannelRatePlanMapping.fields.enabled
          - entities.Channel.fields.status
        distinguishing_aspect: |
          Pair = (Reservation, RatePlan/Channel). Reservation's PENDING -> CONFIRMED transition
          is gated on RatePlan.status == ACTIVE AND Channel.status == ACTIVE AND
          ChannelRatePlanMapping(channel, rate_plan).enabled == true. Different entity pair from
          (Reservation, Room) above — three-way cross-aggregate guard.
        test_recipe:
          setup:
            - "Create RoomType STD; Channel CH1 (DIRECT); RatePlan RP1 (STD, FLEXIBLE)"
            - "Create ChannelRatePlanMapping(CH1, RP1) inventory_share=10000bp, enabled=false  # disabled mapping"
            - "Create Reservation R (room_type=STD, rate_plan=RP1, channel=CH1) -> PENDING"
          trigger:
            - "POST /hotel/reservations/{R}/confirm"
          assert:
            - "Response 422, error_id == ERR_RATE_PLAN_NOT_DISTRIBUTED  # channel-mapping state blocks the Reservation transition"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: maintenance_block_half_open_overlap_per_room
        grounds:
          - validations[priority=11]
          - entities.MaintenanceBlock.fields.start_date
          - entities.MaintenanceBlock.fields.end_date
          - errors.ERR_MAINTENANCE_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics: [start_date, end_date). Two MaintenanceBlocks on the
          same Room collide iff their intervals overlap; abutting blocks (block1.end_date ==
          block2.start_date) do NOT collide because end_date is exclusive. This is the
          "abutting-allowed" geometric treatment, distinct from the next instance's
          "aggregate-capacity" treatment.
        test_recipe:
          setup:
            - "Create Room R1"
            - "Create MaintenanceBlock MB1 (R1, 2027-02-01, 2027-02-05) SCHEDULED"
          trigger:
            - "POST /hotel/maintenance-blocks body={R1, 2027-02-05, 2027-02-08}  # abutting"
            - "POST /hotel/maintenance-blocks body={R1, 2027-02-04, 2027-02-06}  # 1-day overlap"
          assert:
            - "Abutting create: 201 success (no overlap because half-open)"
            - "Overlapping create: 409 error_id == ERR_MAINTENANCE_OVERLAP"

      - name: reservation_per_channel_per_night_aggregate_capacity_overlap
        grounds:
          - calculations.channel_inventory_remaining
          - validations[priority=15]
          - errors.ERR_INVENTORY_EXHAUSTED
          - entities.Reservation.fields.check_in_date
          - entities.Reservation.fields.check_out_date
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on a different resource entity (Reservation
          stay-window over RoomType-by-channel). Overlap is tested per-night across all
          CONFIRMED/CHECKED_IN reservations sharing (channel_id, rate_plan_id), where collision
          means used_by_channel >= channel_share for at least one night in [check_in,
          check_out). Boundary: floor on share allocation. This is "aggregate-capacity" — N
          reservations may simultaneously occupy the same date-range as long as count <
          channel_share — entirely different geometric treatment than instance 1's
          "abutting-allowed pair-overlap" rule.
        test_recipe:
          setup:
            - "Create RoomType STD; 4 ACTIVE rooms"
            - "Create Channel CH1 (DIRECT); RatePlan RP1; mapping(CH1,RP1) inventory_share=2500bp -> channel_share=floor(4*0.25)=1"
            - "Create+confirm Reservation R1 for 2027-03-01..2027-03-03 via CH1+RP1 (used=1, share=1)"
          trigger:
            - "Create Reservation R2 for 2027-03-02..2027-03-04 via CH1+RP1 (overlaps R1 on 2027-03-02)"
            - "POST /hotel/reservations/{R2}/confirm"
          assert:
            - "R2 confirm: 409 error_id == ERR_INVENTORY_EXHAUSTED  # used_by_channel for 2027-03-02 would become 2 > share 1"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: confirm_then_cancel_pending_preserves_zero_money_movement
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.PENDING_to_CANCELLED
          - calculations.refund_amount
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: |
          Conserved quantity: sum(payment_status_to_money(payment_status) over a Reservation
          that never reaches CONFIRMED). For a Reservation that is created PENDING and then
          immediately cancelled, the global money-moved invariant is exactly 0: refund_amount
          remains 0, payment_status remains UNPAID, no Charge is captured. Different conserved
          quantity (money movement) than the next instance (room-night occupancy count).
        test_recipe:
          setup:
            - "Create RoomType STD; RatePlan FLEX FLEXIBLE; Channel DIRECT mapping=10000bp"
            - "Create Reservation R PENDING (do NOT confirm)"
          trigger:
            - "POST /hotel/reservations/{R}/cancel"
          assert:
            - "Reservation.R.refund_amount_cents == 0"
            - "Reservation.R.no_show_charge_cents == 0"
            - "Reservation.R.walkout_compensation_cents == 0"
            - "Reservation.R.payment_status == UNPAID  # invariant: zero net money movement on PENDING->CANCELLED"

      - name: maintenance_schedule_then_cancel_preserves_room_inventory_count
        grounds:
          - state_machines.MaintenanceBlock.SCHEDULED_to_CANCELLED
          - calculations.channel_inventory_remaining
          - calculations.overbooking_limit_check
        distinguishing_aspect: |
          Conserved quantity: physical_capacity for any (room_type, date) BEFORE create-then-
          cancel of a SCHEDULED MaintenanceBlock equals physical_capacity AFTER cancel — the
          forward action (create) and compensating action (cancel) net to zero impact on
          inventory. Pinned formula: physical_capacity(rt, d) = count(Room rt, ACTIVE) -
          count(MaintenanceBlock rt's rooms, status IN {SCHEDULED, ACTIVE}, d in [start,end)).
          A CANCELLED block does NOT count, so cancel restores the prior value exactly.
          Different conserved quantity (room-night count) than instance 1 (money movement).
        test_recipe:
          setup:
            - "Create RoomType STD; 3 ACTIVE Rooms R1, R2, R3"
            - "Pre-measure: physical_capacity(STD, 2027-04-10) = 3"
          trigger:
            - "POST /hotel/maintenance-blocks {R1, 2027-04-10, 2027-04-11} -> MB SCHEDULED"
            - "Mid-measure: physical_capacity(STD, 2027-04-10) = 2"
            - "POST /hotel/maintenance-blocks/{MB}/cancel -> MB CANCELLED"
            - "Post-measure: physical_capacity(STD, 2027-04-10)"
          assert:
            - "Post-measure physical_capacity(STD, 2027-04-10) == 3  # invariant restored exactly"
            - "MB.status == CANCELLED  # compensating action recorded"
