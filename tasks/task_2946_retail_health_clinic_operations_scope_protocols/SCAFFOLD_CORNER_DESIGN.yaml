# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe) — task 2946
# Walks references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1–§1.7. Every `section:` and `claim_type:` value is taken from
# that guide; corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs naming the §1.8 instance.
# Reachability note: every setup_api_calls chain starts from an empty DB and
# uses only §1.5 endpoints; the logical clock sits at its 2026-08-01T00:00:00Z
# startup default unless a call moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_state_rule_creation_echoes_every_declared_field
        claim_type: creation
        grounds:
          - entities.StateRule
          - endpoints[POST /state-rules]
        distinguishing_aspect: "POST /state-rules with all seven required inputs returns 201 and echoes every declared field plus the four common fields, with version == 1."
        test_recipe:
          setup:
            - "Empty database; no StateRule exists for CA."
          setup_api_calls: []
          trigger:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
              captures: { sr_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "StateRule.${sr_id}.state_code == CA"
            - "StateRule.${sr_id}.chart_review_sample_pct == 40"
            - "StateRule.${sr_id}.review_deadline_hours == 72"
            - "StateRule.${sr_id}.collaborating_physician_required == true"
            - "StateRule.${sr_id}.min_independent_practice_age_months == 24"
            - "StateRule.${sr_id}.controlled_rx_allowed == false"
            - "StateRule.${sr_id}.max_supervised_clinicians_per_physician == 3"
            - "StateRule.${sr_id}.version == 1"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present; response.response_type == object"

      - name: corner_clinic_retrieval_returns_inputs_and_derived_counters
        claim_type: retrieval
        grounds:
          - entities.Clinic
          - endpoints[GET /clinics/{clinicId}]
          - state_machines.Clinic.initial_state
        distinguishing_aspect: "GET /clinics/{clinicId} on a freshly created clinic returns the stored inputs unchanged and the four derived counters at their declared defaults — open_status CLOSED, on_duty_clinician_count 0, waiting_count 0, posted_wait_minutes 0, last_realized_wait_minutes null."
        test_recipe:
          setup:
            - "One CA clinic exists with no staffing assignments and no queue entries."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CA Store 20", state_code: "CA", min_clinicians_required: 2, appointment_slots_per_hour: 3, walk_in_queue_capacity: 4 }
              as: ClinicAdmin
              captures: { c20_id: $.data.id }
          trigger:
            - call: "GET /clinics/${c20_id}"
              payload: {}
              as: ClinicAdmin
          assert:
            - "HTTP status == 200"
            - "Clinic.${c20_id}.name == CA Store 20"
            - "Clinic.${c20_id}.min_clinicians_required == 2"
            - "Clinic.${c20_id}.appointment_slots_per_hour == 3"
            - "Clinic.${c20_id}.walk_in_queue_capacity == 4"
            - "Clinic.${c20_id}.open_status == CLOSED"
            - "Clinic.${c20_id}.on_duty_clinician_count == 0"
            - "Clinic.${c20_id}.waiting_count == 0"
            - "Clinic.${c20_id}.posted_wait_minutes == 0"
            - "Clinic.${c20_id}.last_realized_wait_minutes == null"

      - name: corner_queue_entries_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /queue-entries]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three WAITING walk-ins at one clinic, GET /queue-entries?clinic_id=…&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "CA StateRule and a SORE_THROAT protocol exist; one OPEN CA clinic with capacity 5 and one ACTIVE clinician."
            - "Three adult patients are queued as walk-ins, so all three entries are WAITING."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 21", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c21_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Page", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p21_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Page", credential: "NP", license_state_code: "CA", home_clinic_id: "${c21_id}", supervising_physician_id: "${p21_id}" }
              as: ClinicAdmin
              captures: { cl21_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c21_id}", clinician_id: "${cl21_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p21_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Page One", date_of_birth: "1990-01-01" }
              as: FrontDeskAgent
              captures: { pg1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Page Two", date_of_birth: "1990-02-01" }
              as: FrontDeskAgent
              captures: { pg2_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Page Three", date_of_birth: "1990-03-01" }
              as: FrontDeskAgent
              captures: { pg3_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c21_id}", patient_id: "${pg1_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c21_id}", patient_id: "${pg2_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c21_id}", patient_id: "${pg3_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
          trigger:
            - call: "GET /queue-entries"
              payload: { clinic_id: "${c21_id}", status: "WAITING", limit: 2, offset: 0 }
              as: ClinicAdmin
              captures: { page1_total: $.meta.total_count, page1_has_more: $.meta.has_more }
            - call: "GET /queue-entries"
              payload: { clinic_id: "${c21_id}", status: "WAITING", limit: 2, offset: 2 }
              as: ClinicAdmin
              captures: { page2_total: $.meta.total_count, page2_has_more: $.meta.has_more }
          assert:
            - "HTTP status == 200 for both calls; response.response_type == array"
            - "${page1_total} == 3 and ${page1_has_more} == true"
            - "the first page carries exactly 2 QueueEntry rows"
            - "${page2_total} == 3 and ${page2_has_more} == false"
            - "the second page carries exactly 1 QueueEntry row"
            - "limit and offset are echoed as 2 and 0 on the first call and 2 and 2 on the second"

      - name: corner_visit_retrieval_with_unknown_id_returns_visit_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_VISIT_NOT_FOUND]
          - endpoints[GET /visits/{visitId}]
        distinguishing_aspect: "GET /visits/{visitId} with a well-formed but unknown UUID returns ERR_VISIT_NOT_FOUND with HTTP 404 — not 200 with a null body and not ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database; no Visit rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /visits/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "${nf_err} == ERR_VISIT_NOT_FOUND"
            - "HTTP status == 404"
            - "response.response_type == error"

      - name: corner_clinician_creation_missing_supervising_physician_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[POST /clinicians]
        distinguishing_aspect: "POST /clinicians omitting the required supervising_physician_id returns ERR_VALIDATION with HTTP 400 and persists no Clinician row, even though home_clinic_id resolves."
        test_recipe:
          setup:
            - "One CA clinic exists; no clinicians exist."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CA Store 22", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c22_id: $.data.id }
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "NP Nameless", credential: "NP", license_state_code: "CA", home_clinic_id: "${c22_id}" }
              as: ClinicAdmin
              captures: { req_err: $.data.error_id }
          assert:
            - "${req_err} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "GET /clinicians?home_clinic_id=${c22_id} returns total_count == 0"

      - name: corner_clinician_creation_omitting_float_eligible_applies_false_default
        claim_type: defaults
        grounds:
          - entities.Clinician.fields.float_eligible
          - entities.Clinician.fields.scope_hold
          - endpoints[POST /clinicians]
        distinguishing_aspect: "Omitting the optional float_eligible input yields false, and the computed scope_hold and active_assignment_count come back as false and 0 — the declared defaults, not null."
        test_recipe:
          setup:
            - "One CA clinic and one CA-licensed physician exist."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CA Store 23", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c23_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Ruth", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p23_id: $.data.id }
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "NP Default", credential: "PA", license_state_code: "CA", home_clinic_id: "${c23_id}", supervising_physician_id: "${p23_id}" }
              as: ClinicAdmin
              captures: { cl23_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Clinician.${cl23_id}.float_eligible == false"
            - "Clinician.${cl23_id}.scope_hold == false"
            - "Clinician.${cl23_id}.active_assignment_count == 0"
            - "Physician.${p23_id}.status == ACTIVE   # the omitted optional status input also defaults"

      - name: corner_patient_creation_omitting_pcp_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Patient.fields.pcp_accepts_electronic_summary
          - entities.Patient.fields.pcp_consent_on_file
          - entities.Patient.fields.payer_name
          - endpoints[POST /patients]
        distinguishing_aspect: "A patient created with only full_name and date_of_birth has payer_name, member_id, pcp_name and pcp_direct_address null, the two booleans false, and the three computed fields at [] / 0 / 0."
        test_recipe:
          setup:
            - "Empty database; no patients exist."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Minimal Mary", date_of_birth: "1994-04-04" }
              as: FrontDeskAgent
              captures: { pmin_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Patient.${pmin_id}.payer_name == null and Patient.${pmin_id}.member_id == null"
            - "Patient.${pmin_id}.pcp_name == null and Patient.${pmin_id}.pcp_direct_address == null"
            - "Patient.${pmin_id}.pcp_accepts_electronic_summary == false"
            - "Patient.${pmin_id}.pcp_consent_on_file == false"
            - "Patient.${pmin_id}.active_therapy_classes == []"
            - "Patient.${pmin_id}.active_therapy_class_count == 0"
            - "Patient.${pmin_id}.outstanding_balance_cents == 0"

      - name: corner_queue_entry_acuity_tier_is_taken_from_the_protocol
        claim_type: computed_fields
        grounds:
          - entities.QueueEntry.fields.acuity_tier
          - entities.QueueEntry.fields.priority_score
          - calculations.queue_priority_score
        distinguishing_aspect: "acuity_tier is not a client input: a walk-in for a complaint whose Protocol declares acuity_tier 3 comes back with acuity_tier 3 and priority_score 300 (3 * 100 acuity points, no appointment bonus, 0 waited minutes, adult so no age bump)."
        test_recipe:
          setup:
            - "CA StateRule exists and a RASH protocol is offered in CA with acuity_tier 3."
            - "One OPEN CA clinic with one ACTIVE clinician; one adult patient aged well between 24 and 780 months."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "RASH", min_age_months: 12, max_age_months: 1200, base_price_cents: 7500, acuity_tier: 3, red_flag_codes: ["PETECHIAE"], max_temp_c: 39.5, max_heart_rate_bpm: 130, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 24", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c24_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Sable", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p24_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Sable", credential: "NP", license_state_code: "CA", home_clinic_id: "${c24_id}", supervising_physician_id: "${p24_id}" }
              as: ClinicAdmin
              captures: { cl24_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c24_id}", clinician_id: "${cl24_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p24_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Rita Rash", date_of_birth: "1989-09-09" }
              as: FrontDeskAgent
              captures: { prash_id: $.data.id }
          trigger:
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c24_id}", patient_id: "${prash_id}", kind: "WALK_IN", complaint_code: "RASH" }
              as: FrontDeskAgent
              captures: { qrash_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "QueueEntry.${qrash_id}.acuity_tier == 3"
            - "QueueEntry.${qrash_id}.priority_score == 300"
            - "QueueEntry.${qrash_id}.status == WAITING"
            - "QueueEntry.${qrash_id}.arrived_at == 2026-08-01T00:00:00Z"
            - "QueueEntry.${qrash_id}.called_at == null and QueueEntry.${qrash_id}.realized_wait_minutes == null"
            - "QueueEntry.${qrash_id}.scheduled_at == null"

      - name: corner_patient_creation_stamps_system_identity_and_version
        claim_type: system_fields
        grounds:
          - entities.Patient
          - response_envelope.success
        distinguishing_aspect: "id, created_at, updated_at and version are system-generated on POST /patients: version == 1, created_at == updated_at == the logical clock 2026-08-01T00:00:00Z, and the id is a server-minted value the client never supplied."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Stamp Sam", date_of_birth: "1970-10-10" }
              as: ClinicAdmin
              captures: { pstamp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Patient.${pstamp_id}.version == 1"
            - "Patient.${pstamp_id}.created_at == 2026-08-01T00:00:00Z"
            - "Patient.${pstamp_id}.updated_at == 2026-08-01T00:00:00Z"
            - "Patient.${pstamp_id}.id is non-empty and appears in GET /patients/${pstamp_id}"

      - name: corner_protocol_creation_with_unknown_complaint_code_returns_validation
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.Protocol.fields.complaint_code
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "complaint_code is a closed enum: TOOTHACHE is not one of the six declared members, so POST /protocols returns ERR_VALIDATION with HTTP 400 and no Protocol row."
        test_recipe:
          setup:
            - "Empty database; no protocols exist."
          setup_api_calls: []
          trigger:
            - call: "POST /protocols"
              payload: { complaint_code: "TOOTHACHE", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: [], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "${enum_err} == ERR_VALIDATION"
            - "HTTP status == 400"
            - "GET /protocols returns total_count == 0"

      - name: corner_protocol_creation_with_max_age_not_above_min_age_returns_validation
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - entities.Protocol.fields.max_age_months
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "max_age_months must be strictly greater than min_age_months: 240 vs 240 is rejected with ERR_VALIDATION (400), and acuity_tier 4 is rejected the same way — both are declared range constraints, not business rules."
        test_recipe:
          setup:
            - "Empty database; no protocols exist."
          setup_api_calls: []
          trigger:
            - call: "POST /protocols"
              payload: { complaint_code: "UTI", min_age_months: 240, max_age_months: 240, base_price_cents: 12000, acuity_tier: 2, red_flag_codes: [], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
              captures: { range_err: $.data.error_id }
            - call: "POST /protocols"
              payload: { complaint_code: "UTI", min_age_months: 24, max_age_months: 1200, base_price_cents: 12000, acuity_tier: 4, red_flag_codes: [], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
              captures: { tier_err: $.data.error_id }
          assert:
            - "${range_err} == ERR_VALIDATION"
            - "${tier_err} == ERR_VALIDATION"
            - "HTTP status == 400 for both calls"
            - "GET /protocols returns total_count == 0"

      - name: corner_clinician_creation_with_unknown_home_clinic_returns_clinic_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_CLINIC_NOT_FOUND]
          - endpoints[POST /clinicians]
        distinguishing_aspect: "Body foreign keys are validated in declaration order: an unknown home_clinic_id returns ERR_CLINIC_NOT_FOUND (404) even though the supervising_physician_id is valid — the missing clinic is reported, not the physician."
        test_recipe:
          setup:
            - "One CA-licensed physician exists; no clinic with the probed id exists."
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Tull", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p25_id: $.data.id }
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "NP Orphan", credential: "NP", license_state_code: "CA", home_clinic_id: "00000000-0000-0000-0000-000000000000", supervising_physician_id: "${p25_id}" }
              as: ClinicAdmin
              captures: { fk_err: $.data.error_id }
          assert:
            - "${fk_err} == ERR_CLINIC_NOT_FOUND"
            - "HTTP status == 404"
            - "Physician.${p25_id}.current_supervised_count == 0"

      - name: corner_queue_entry_creation_with_unknown_patient_returns_patient_not_found
        claim_type: foreign_key_validated
        grounds:
          - validations[priority=7]
          - errors[ERR_PATIENT_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology means cross-reference integrity is enforced per body field: a queue entry naming a real clinic but an unknown patient_id returns ERR_PATIENT_NOT_FOUND (404) and leaves Clinic.waiting_count at 0."
        test_recipe:
          setup:
            - "CA StateRule and a SORE_THROAT protocol exist; one OPEN CA clinic with one ACTIVE clinician; no patient with the probed id exists."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 26", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c26_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Vane", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p26_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Vane", credential: "NP", license_state_code: "CA", home_clinic_id: "${c26_id}", supervising_physician_id: "${p26_id}" }
              as: ClinicAdmin
              captures: { cl26_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c26_id}", clinician_id: "${cl26_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p26_id}" }
              as: ClinicAdmin
          trigger:
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c26_id}", patient_id: "00000000-0000-0000-0000-000000000000", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { pfk_err: $.data.error_id }
          assert:
            - "${pfk_err} == ERR_PATIENT_NOT_FOUND"
            - "HTTP status == 404"
