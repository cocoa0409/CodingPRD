  # ==========================================================================
  # complexity_profile.complexity_layers is
  #   [rate_threshold_triggers, cascading_side_effects,
  #    dual_variant_calculation, optimistic_concurrency]
  # so exactly those four rows of the guide's layer table are walked here. The
  # two §1.2.1 concurrency_rules entries each get their own stale-version
  # instance, keyed on their declared write_endpoint and occ_field.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: hold_create_with_stale_card_version_conflicts
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.hold-create-stale-card
          - errors.ERR_STALE_CARD_VERSION
          - endpoints[POST /gift-cards/{id}/redemption-holds]
        distinguishing_aspect: "Two holds are individually affordable on a 10000 card, so nothing but the version guard can reject the second one: replaying the pre-first-hold version returns 412 ERR_STALE_CARD_VERSION, and resubmitting the identical amount against the re-read version succeeds, leaving held_amount_cents 5000."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents, no holds and no redemptions."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "OCC Card Store", region_code: "NE", address_line: "64 OCC Ave" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-OC", expected_card_count: 5 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-9401" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 10000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-94", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-94"
              captures: { cv0: $.data.version, avail0: $.data.available_balance_cents }
          trigger:
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 3000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv0}" }
              as: PosAssociate
              captures: { hold1_id: $.data.id, h1_state: $.data.state }
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 2000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv0}" }
              as: PosAssociate
              captures: { err: $.data.error_id }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-94"
              captures: { cv1: $.data.version, held1: $.data.held_amount_cents }
            - call: "POST /gift-cards/${card_id}/redemption-holds"
              payload: { amount_cents: 2000, hold_start: "2026-08-01T00:00:00Z", hold_expires_at: "2026-08-01T06:00:00Z", expected_gift_card_version: "${cv1}" }
              as: PosAssociate
              captures: { hold2_id: $.data.id, h2_state: $.data.state }
          assert:
            - "${avail0} == 10000"
            - "first trigger call: HTTP status == 201 and ${h1_state} == ACTIVE"
            - "second trigger call: HTTP status == 412 and ${err} == ERR_STALE_CARD_VERSION"
            - "${cv1} == ${cv0} + 1 — the accepted hold bumped the card once, the rejected one not at all"
            - "${held1} == 3000 — the stale attempt reserved nothing"
            - "fourth trigger call: HTTP status == 201 and ${h2_state} == ACTIVE — the identical amount is accepted once the version is current"
            - "GiftCard.${card_id}.held_amount_cents == 5000 and available_balance_cents == 5000 and current_balance_cents == 10000"
            - "GET /gift-cards/${card_id}/redemption-holds?state=ACTIVE returns total_count == 2, containing ${hold1_id} and ${hold2_id}"

      - name: period_restate_with_stale_period_version_conflicts
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.period-restate-stale-period
          - errors.ERR_STALE_PERIOD_VERSION
          - endpoints[POST /liability-periods/{id}/restate]
          - entities.LiabilityPeriod.fields.restatement_count
        distinguishing_aspect: "Restatement is a RESTATED -> RESTATED self-loop, so no state precondition can stop a replay — only the version guard can. The version observed at creation is stale after close and returns 412, and after the first restatement succeeds that same version is stale again, so a second restatement must re-read once more."
        test_recipe:
          setup:
            - "An empty card population, so every reserve figure is deterministically 0."
            - "One LiabilityPeriod 2026-08-01..2026-09-01, created and then closed."
          setup_api_calls:
            - call: "POST /liability-periods"
              payload: { label: "2026-08 occ period", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              as_user_id: "acct-95"
              captures: { period_id: $.data.id, pv0: $.data.version, p_state0: $.data.state }
            - call: "POST /liability-periods/${period_id}/close"
              payload: { close_note: "month closed" }
              as: LiabilityAccountant
              as_user_id: "acct-95"
              captures: { pv1: $.data.version, p_state1: $.data.state, prov1: $.data.provisional_reserve_cents }
          trigger:
            - call: "POST /liability-periods/${period_id}/restate"
              payload: { restatement_note: "restating from a pre-close view", expected_liability_period_version: "${pv0}" }
              as: LiabilityAccountant
              as_user_id: "acct-95"
              captures: { err1: $.data.error_id }
            - call: "POST /liability-periods/${period_id}/restate"
              payload: { restatement_note: "restating from the post-close view", expected_liability_period_version: "${pv1}" }
              as: LiabilityAccountant
              as_user_id: "acct-95"
              captures: { pv2: $.data.version, p_state2: $.data.state, final2: $.data.final_reserve_cents, rc2: $.data.restatement_count }
            - call: "POST /liability-periods/${period_id}/restate"
              payload: { restatement_note: "replaying the superseded view", expected_liability_period_version: "${pv1}" }
              as: LiabilityAccountant
