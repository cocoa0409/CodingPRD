              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_cyc: $.data.error_id }
            - call: "GET /otb/chase-cancel-decisions/dec-nope"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_dec: $.data.error_id }
