# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3162_direct_vehicle_sales_delivery_appointment_mobile_service
#
# Every instance grounds in elements declared in SCAFFOLD.yaml §1.1–§1.6.
# Every payload LITERAL was computed by executing the referenced formula.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_total_dual_variant_provisional_includes_delivery_fee
        grounds:
          - calculations.order_total_due_cents
          - entities.VehicleOrder.fields.order_total_due_cents
          - entities.VehicleOrder.fields.delivery_readiness_posture
          - state_machines.VehicleOrder.IN_TRANSIT_to_AT_DELIVERY_CENTER
        distinguishing_aspect: "Identical order data yields 4934000 cents through the provisional variant and 4931500 cents through the final variant — the 2500-cent delivery fee is added before the 2500-cent trade-in credit is subtracted, so the deliverables differ by exactly the delivery fee."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED with direct_sales_permitted true and doc_fee_cap_cents 7500; a DELIVERY_CENTER site in TX."
            - "Configuration MODEL_Y_LR_AWD base 4799000; option PAINT_WHITE 100000 (PAINT); option FSD_SUPERVISED 800000 (SOFTWARE_FEATURE, so excluded from configured_price_cents)."
            - "Buyer verified and ACTIVE; order created and placed; payment simulated SUCCEEDED; batch started; unit allocated; dispatched and arrived."
          setup_api_calls:
            - &k_clock
              call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_jur_tx
              call: "POST /v1/jurisdictions"
              payload: { state_code: "TX", direct_sales_permitted: true, gallery_only_required: false, out_of_state_delivery_required: false, cooling_off_days: 3, doc_fee_cap_cents: 7500, mobile_service_permitted: true, delivery_buffer_minutes: 60, allocation_window_days: 14, transport_lead_days: 7 }
              as: PlatformAdmin
              captures: { jur_tx_id: $.data.id }
            - &k_enact_tx
              call: "POST /v1/jurisdictions/${jur_tx_id}/enact"
              payload: {}
              as: PlatformAdmin
            - &k_center_tx
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Austin Delivery", center_kind: "DELIVERY_CENTER", state_code: "TX", bay_count: 4, home_delivery_radius_miles: 50, van_count: 3 }
              as: PlatformAdmin
              captures: { center_tx_id: $.data.id }
            - &k_cfg_y
              call: "POST /v1/vehicle-configurations"
              payload: { model_code: "MODEL_Y_LR_AWD", base_price_cents: 4799000 }
              as: PlatformAdmin
              captures: { cfg_y_id: $.data.id }
            - call: "POST /v1/vehicle-configurations/${cfg_y_id}/options"
              payload: { option_sku: "PAINT_WHITE", option_category: "PAINT", price_cents: 100000 }
              as: PlatformAdmin
              captures: { opt_paint_id: $.data.id }
            - call: "POST /v1/vehicle-configurations/${cfg_y_id}/options"
              payload: { option_sku: "FSD_SUPERVISED", option_category: "SOFTWARE_FEATURE", price_cents: 800000 }
              as: PlatformAdmin
            - &k_buyer_dv
              call: "POST /v1/buyers"
              payload: { full_name: "Dana V", email: "dana.v@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { buyer_dv_id: $.data.id }
            - &k_verify_dv
              call: "POST /v1/buyers/${buyer_dv_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - &k_order_dv
              call: "POST /v1/orders"
              payload: { buyer_id: "${buyer_dv_id}", configuration_id: "${cfg_y_id}", jurisdiction_id: "${jur_tx_id}", delivery_center_id: "${center_tx_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { order_dv_id: $.data.id, order_dv_v: $.data.version }
            - &k_place_dv
              call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_dv_v: $.data.version }
            - &k_pay_dv
              call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_dv_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - &k_lock_dv
              call: "POST /v1/orders/${order_dv_id}/lock-configuration"
              payload: { expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - &k_batch_dv
              call: "POST /v1/production-batches"
              payload: { factory_code: "AUSTIN", model_code: "MODEL_Y_LR_AWD", unit_capacity: 2, planned_completion_at: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { batch_dv_id: $.data.id }
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000101" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/orders/${order_dv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { prov_total: $.data.order_total_due_cents }
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:00:00Z", scheduled_end: "2026-09-22T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_dv_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/complete"
              payload: { acceptance_inspection_result: "CLEAN", documented_issues: [], expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { final_total: $.data.order_total_due_cents }
          assert:
            - "VehicleOrder.${order_dv_id}.configured_price_cents == 4899000 (base 4799000 + PAINT_WHITE 100000; FSD_SUPERVISED is a SOFTWARE_FEATURE option and contributes 0)"
            - "VehicleOrder.${order_dv_id}.order_total_due_cents == 4934000 immediately after arrival (provisional variant: 4899000 + 25000 order fee + 0 late fee + 7500 doc fee + 2500 delivery fee)"
            - "\"${prov_total}\" == 4934000"
            - "VehicleOrder.${order_dv_id}.order_total_due_cents == 4931500 immediately after completion (final variant subtracts the 2500-cent delivery fee)"
            - "\"${final_total}\" == 4931500"
            - "the two observed totals differ by exactly 2500 cents"

      - name: mobile_visit_cost_dual_variant_warranty_zeroes_customer_payable
        grounds:
          - calculations.mobile_service_visit_cost_cents
          - entities.MobileServiceVisit.fields.visit_cost_cents
          - entities.ServiceAppointment.fields.is_warranty_covered
          - state_machines.MobileServiceVisit.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "The same visit — 45 miles, 2.0 labor hours, 42000 cents of parts — costs 82425 cents under the cost variant but only 0 cents under the customer-payable variant, because a CRITICAL severity at 41000 miles is inside the 60000-mile warranty ceiling."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED with mobile_service_permitted true; a PARTS_HUB site in TX."
            - "A delivered vehicle with odometer_miles 41000; a CRITICAL diagnostic report with is_driveable false, so triage yields CENTER_REQUIRED and parts_required true; a service appointment opened and dispatched to a van."
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - call: "POST /v1/jurisdictions/${jur_tx_id}/enact"
              payload: {}
              as: PlatformAdmin
            - *k_center_tx
            - &k_hub_tx
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Austin Parts Hub", center_kind: "PARTS_HUB", state_code: "TX", bay_count: 1, home_delivery_radius_miles: 0, van_count: 0 }
              as: PlatformAdmin
              captures: { hub_tx_id: $.data.id }
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_dv_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/lock-configuration"
              payload: { expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - *k_batch_dv
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000102" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
              captures: { veh_dv_id: $.data.id }
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:00:00Z", scheduled_end: "2026-09-22T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_dv_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/complete"
              payload: { acceptance_inspection_result: "CLEAN", documented_issues: [], expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
            - call: "POST /v1/vehicles/${veh_dv_id}/diagnostic-reports"
              payload: { fault_code: "HVAC-0442", severity: "CRITICAL", is_driveable: false }
              as: ServiceTechnician
              captures: { rpt_dv_id: $.data.id, sa_dv_v: $.data.version }
            - call: "POST /v1/service-appointments"
              payload: { vehicle_id: "${veh_dv_id}", diagnostic_report_id: "${rpt_dv_id}", service_center_id: "${center_tx_id}", scheduled_start: "2026-09-25T14:00:00Z", scheduled_end: "2026-09-25T16:00:00Z" }
              as: ServiceTechnician
              captures: { sa_dv_id: $.data.id, sa_dv_v: $.data.version }
          trigger:
            - call: "POST /v1/mobile-service-visits"
              payload: { service_appointment_id: "${sa_dv_id}", parts_hub_id: "${hub_tx_id}", van_code: "VAN-ATX-1", visit_start: "2026-09-26T14:00:00Z", visit_end: "2026-09-26T17:00:00Z", labor_hours: 2.0, parts_cost_cents: 42000, visit_miles: 45, expected_service_appointment_version: "${sa_dv_v}" }
              as: ServiceTechnician
              captures: { visit_dv_id: $.data.id, sa_dv_v: $.data.version }
            - call: "POST /v1/mobile-service-visits/${visit_dv_id}/confirm-parts-shipment"
              payload: {}
              as: PartsCoordinator
            - call: "POST /v1/mobile-service-visits/${visit_dv_id}/start"
              payload: {}
              as: ServiceTechnician
            - call: "POST /v1/mobile-service-visits/${visit_dv_id}/complete"
              payload: {}
              as: ServiceTechnician
          assert:
            - "ServiceAppointment.${sa_dv_id}.is_warranty_covered == true (severity CRITICAL and odometer_miles 41000 is at or below the 60000-mile ceiling)"
            - "MobileServiceVisit.${visit_dv_id}.visit_cost_cents == 82425 (travel 1425 = max(0, 45 - 30) * 95, labor 39000, parts 42000)"
            - "Vehicle.${veh_dv_id}.service_hold_state == NONE after completion"
            - "the customer payable for this visit is 0 cents under the warranty variant, so visit_cost_cents 82425 and customer payable 0 are both observed for one and the same visit row"
            - "MobileServiceVisit.${visit_dv_id}.status == COMPLETED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: financing_annuity_nested_rounding_order
        grounds:
          - calculations.financing_monthly_payment_cents
          - entities.FinancingApplication.fields.amount_financed_cents
          - entities.FinancingApplication.fields.monthly_payment_cents
          - validations[priority=17]
        distinguishing_aspect: "Amount financed 4399000 cents at 590 basis points over 60 months pays 84841 cents monthly; rounding the per-period rate to 0.0005 first instead of carrying apr_bps/10000/12 exactly yields 84858, so the pinned evaluation order changes the observable integer by 17."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; a DELIVERY_CENTER in TX."
            - "Configuration MODEL_Y_LR_AWD base 4799000 with PAINT_WHITE 100000; verified ACTIVE buyer; order placed, paid, locked and arrived with a 25000 down payment financing application."
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - call: "POST /v1/jurisdictions/${jur_tx_id}/enact"
              payload: {}
              as: PlatformAdmin
            - *k_center_tx
            - *k_cfg_y
            - call: "POST /v1/vehicle-configurations/${cfg_y_id}/options"
              payload: { option_sku: "PAINT_WHITE", option_category: "PAINT", price_cents: 100000 }
              as: PlatformAdmin
            - *k_buyer_dv
            - call: "POST /v1/buyers/${buyer_dv_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - *k_order_dv
            - call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_dv_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/lock-configuration"
              payload: { expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - *k_batch_dv
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000103" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/financing-applications"
              payload: { term_months: 60, down_payment_cents: 500000, include_trade_in_credit: false }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { app_dv_id: $.data.id }
          trigger:
            - call: "POST /v1/financing-applications/${app_dv_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FinancePartner
              captures: { monthly: $.data.monthly_payment_cents, band: $.data.credit_band }
          assert:
            - "FinancingApplication.${app_dv_id}.amount_financed_cents == 4399000 (provisional total 4934000 minus down payment 500000)"
            - "\"${band}\" == NEAR_PRIME (the applicant was UNRATED, so the decision defaults the band to NEAR_PRIME)"
            - "FinancingApplication.${app_dv_id}.apr_bps == 890 (NEAR_PRIME with term_months 60 in the >= 49 bracket)"
            - "FinancingApplication.${app_dv_id}.monthly_payment_cents == 91103"
            - "\"${monthly}\" == 91103"

      - name: entitlement_bundle_cap_then_per_row_allocation
        grounds:
          - calculations.entitlement_bundle_price_cents
          - entities.SoftwareEntitlement.fields.bundle_net_cents
          - entities.SoftwareEntitlement.fields.payable_cents
          - entities.SoftwareEntitlement.fields.bundle_discount_bps
        distinguishing_aspect: "A four-row bundle with 2800000 and 1200000 cent entries pays 3800000 cents because the 1000-basis-point discount is capped at 200000 cents; discounting the rows first and then capping yields the same total but a different bundle_discount_bps (0 instead of 500), so the pinned order is observable in a second field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; a DELIVERY_CENTER in TX; a delivered vehicle carrying three ACTIVE entitlements."
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_dv_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/lock-configuration"
              payload: { expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - *k_batch_dv
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000104" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
              captures: { veh_dv_id: $.data.id }
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:00:00Z", scheduled_end: "2026-09-22T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_dv_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
            - call: "POST /v1/delivery-appointments/${appt_dv_id}/complete"
              payload: { acceptance_inspection_result: "CLEAN", documented_issues: [], expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
            - call: "POST /v1/vehicles/${veh_dv_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "AUTOPILOT_BASIC", price_cents: 300000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
            - call: "POST /v1/vehicles/${veh_dv_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "PREMIUM_CONNECTIVITY", price_cents: 100000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
            - call: "POST /v1/vehicles/${veh_dv_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "PREMIUM_AUDIO", price_cents: 100000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/vehicles/${veh_dv_id}/software-entitlements"
              payload: { feature_entries: [{ feature_code: "FSD_SUPERVISED", price_cents: 2800000 }, { feature_code: "ACCELERATION_BOOST", price_cents: 1200000 }], entitlement_source: "PURCHASE" }
              as: PlatformAdmin
              captures: { ent_first_id: "$.data[0].id", ent_second_id: "$.data[1].id" }
          assert:
            - "the response carries exactly 2 SoftwareEntitlement rows in request order"
            - "SoftwareEntitlement.${ent_first_id}.bundle_net_cents == 3800000 (raw 4000000 with the bundle discount capped at 200000)"
            - "SoftwareEntitlement.${ent_second_id}.bundle_net_cents == 3800000"
            - "SoftwareEntitlement.${ent_first_id}.bundle_discount_bps == 500 (applied_discount 200000 * 10000 / 4000000)"
            - "SoftwareEntitlement.${ent_first_id}.payable_cents == 2660000 and SoftwareEntitlement.${ent_second_id}.payable_cents == 1140000, summing to 3800000"
            - "the vehicle now reports 7 ACTIVE entitlements"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: delivery_estimate_cyclic_restore_loop
        grounds:
          - state_machines.DeliveryEstimate.SUPERSEDED_to_FIRM
          - state_machines.DeliveryEstimate.PROVISIONAL_to_SUPERSEDED
          - calculations.delivery_estimate_window
          - entities.VehicleOrder.fields.estimate_shift_days_cumulative
        distinguishing_aspect: "DeliveryEstimate is cyclic, not a pipeline: SUPERSEDED returns to FIRM and the estimator accumulator unwinds exactly by the restored estimate's shift_days, which a linear machine cannot express."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime with transport_lead_days 7; delivery center"
            - "Order placed and allocated against a batch with planned_completion_at 2026-09-08T00:00:00Z, producing estimate A with window 2026-09-15 to 2026-09-22"
            - "A second estimate B projected with basis 2026-09-21T00:00:00Z and window_days 7, superseding A"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_place_dv
            - *k_pay_dv
            - *k_lock_dv
            - *k_batch_dv
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - &k_unit_105
              call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000105" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
