  # ===========================================================================
  - section: validations
    instances:

      - name: missing_role_header_is_rejected_before_existence_checks
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_ROLE_HEADER]
          - endpoints.POST_/drugs
        distinguishing_aspect: >
          Priority 1 runs before existence, so a POST /drugs carrying no role header
          returns ERR_MISSING_ROLE_HEADER even though the body is also incomplete,
          proving the ordering rather than the individual checks.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
          trigger:
            - call: "POST /drugs"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 with error_id ERR_MISSING_ROLE_HEADER"
            - "no Drug row was created: GET /drugs returns total_count 0"

      - name: patient_role_denied_on_ops_exclusive_manufacturer_creation
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.Patient.exclusive_operations
          - roles.PharmacyOps.exclusive_operations
        distinguishing_aspect: >
          Manufacturer creation is exclusive to PharmacyOps, so a Patient caller
          receives ERR_ROLE_NOT_PERMITTED rather than an ownership error, and the
          resource is not created.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Patient P exists so the caller id is a real entity id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
