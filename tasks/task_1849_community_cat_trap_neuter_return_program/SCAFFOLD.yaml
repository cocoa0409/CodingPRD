scenario: |
  1849. Community Cat & Trap-Neuter-Return Program (municipal TNR program): colony registration & caretaker assignment, trapping appointment & clinic slot allocation, surgery, ear-tip & vaccination record, return-to-field vs adoption pathway decision, complaint intake from neighbors & mediation, kitten season capacity surge & foster network, funding/voucher program & partner clinics, colony population monitoring over time

domain_name: community-cat-tnr
api_prefix: /tnr

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing

  entity_topology: hybrid
  # Colony is the aggregate root for Cat + Complaint + PopulationSurvey;
  # ClinicDay/ClinicSlot and Voucher live in a parallel scheduling/funding
  # sub-graph cross-referenced by TrappingAppointment and SurgeryRecord.

  state_machine_shape: compound
  # Cat runs a branching lifecycle (trapped -> clinic -> surgery ->
  # {returned | adoption_pipeline}) with a foster-loop cycle for kittens;
  # Colony carries a derived posture (monitoring_status) computed from
  # child counts; TrappingAppointment has its own branching lifecycle.

  relationship_patterns:
    - one_to_many          # Colony -> Cat, Colony -> Complaint, Colony -> PopulationSurvey
    - cross_aggregate      # TrappingAppointment references Cat + ClinicSlot; SurgeryRecord references Appointment + Voucher
    - many_to_many         # ClinicDay <-> PartnerClinic is collapsed into ClinicDay carrying clinic FK; FosterHome <-> Cat via FosterPlacement

  role_model: peer_roles
  # ProgramCoordinator runs the program; Caretaker manages own colonies;
  # ClinicStaff operates clinic days; AnimalControlOfficer handles complaints;
  # FosterVolunteer hosts kittens. ProgramCoordinator is NOT a superset —
  # e.g. only ClinicStaff can record surgery outcomes.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Caretaker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the colony caretaker
      - name: phone
        type: string
        source: input
        description: Contact phone, free-form
      - name: email
        type: string
        source: input
        description: Contact email, must be unique across caretakers
        constraints: unique
      - name: certified_tnr
        type: boolean
        source: input
        description: Whether the caretaker completed the municipal TNR certification course
        default: false
      - name: status
        type: enum
        source: system
        description: Caretaker account standing
        constraints: "one of {ACTIVE, SUSPENDED}"
        default: ACTIVE

  - name: Colony
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable colony label (e.g. 'Boardwalk behind pier 9')
      - name: address
        type: string
        source: input
        description: Street address or parcel description of the colony site
      - name: caretaker_id
        type: string
        source: input
        description: "FK -> Caretaker.id; the registered primary caretaker"
      - name: registered_on
        type: datetime
        source: system
        description: Server-stamped registration date (uses logical clock)
      - name: estimated_population
        type: integer
        source: input
        description: Caretaker's initial population estimate at registration
        constraints: ">= 1"
      - name: monitoring_status
        type: enum
        source: computed
        description: "Derived posture: STABLE if sterilized_pct >= 0.75 and no OPEN complaint; WATCH if sterilized_pct >= 0.75 but an OPEN complaint exists; ACTIVE otherwise"
        constraints: "one of {ACTIVE, WATCH, STABLE}"
        default: ACTIVE
      - name: sterilized_pct
        type: number
        source: computed
        description: "Fraction of non-deceased, non-adopted resident cats whose Cat.status is in {RETURNED, COLONY_STERILIZED} over all resident cats; 0 when no resident cats"
      - name: status
        type: enum
        source: system
        description: Colony lifecycle
        constraints: "one of {REGISTERED, DISSOLVED}"
        default: REGISTERED

  - name: Cat
    parent: Colony
    common_fields: true
    fields:
      - name: colony_id
        type: string
        source: input
        description: "FK -> Colony.id; the colony this cat belongs to"
      - name: intake_tag
        type: string
        source: input
        description: Human-assigned tag (e.g. trap log number); unique per colony
        constraints: "unique within colony_id"
      - name: sex
        type: enum
        source: input
        description: Sex as assessed at intake
        constraints: "one of {MALE, FEMALE, UNKNOWN}"
      - name: approximate_age_months
        type: integer
        source: input
        description: Estimated age in whole months at intake; kittens are < 6
        constraints: ">= 0"
      - name: is_kitten
        type: boolean
        source: computed
        description: "true iff approximate_age_months < KITTEN_AGE_MONTHS (6)"
      - name: ear_tipped
        type: boolean
        source: system
        description: Set true by the surgery record; universal TNR visual marker
        default: false
      - name: vaccinated_rabies
        type: boolean
        source: system
        description: Set true by the surgery record
        default: false
      - name: status
        type: enum
        source: system
        description: Cat pipeline state
        constraints: "one of {AT_LARGE, TRAPPED, AT_CLINIC, POST_SURGERY, RETURNED, COLONY_STERILIZED, IN_FOSTER, ADOPTION_PIPELINE, ADOPTED, DECEASED}"
        default: AT_LARGE
      - name: pathway
        type: enum
        source: system
        description: "Disposition decided at POST_SURGERY: RETURN_TO_FIELD or ADOPTION; null until decided"
        constraints: "one of {RETURN_TO_FIELD, ADOPTION} or null"
        default: null

  - name: PartnerClinic
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Clinic business name
      - name: voucher_reimbursement_cents
        type: integer
        source: input
        description: Amount the program reimburses this clinic per redeemed voucher
        constraints: "> 0"
      - name: accepts_vouchers
        type: boolean
        source: input
        description: Whether this clinic honors program vouchers
        default: true
      - name: status
        type: enum
        source: system
        description: Clinic onboarding state
        constraints: "one of {ACTIVE, INACTIVE}"
        default: ACTIVE

  - name: ClinicDay
    parent: PartnerClinic
    common_fields: true
    fields:
      - name: clinic_id
        type: string
        source: input
        description: "FK -> PartnerClinic.id; clinic hosting this surgery day"
      - name: service_date
        type: datetime
        source: input
        description: Calendar date of the clinic day (time component ignored, compared as date)
      - name: base_capacity
        type: integer
        source: input
        description: Number of surgery slots on a normal day
        constraints: ">= 1"
      - name: surge_capacity
        type: integer
        source: input
        description: "Additional slots opened when kitten-season surge mode is active for the day's month; 0 when not surging"
        constraints: ">= 0"
        default: 0
      - name: booked_count
        type: integer
        source: computed
        description: Number of ClinicSlots on this day whose status is BOOKED
        default: 0
      - name: status
        type: enum
        source: system
        description: Clinic day lifecycle
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
        default: SCHEDULED

  - name: ClinicSlot
    parent: ClinicDay
    common_fields: true
    fields:
      - name: clinic_day_id
        type: string
        source: input
        description: "FK -> ClinicDay.id; the day this slot belongs to"
      - name: slot_index
        type: integer
        source: system
        description: "Ordinal of the slot within its day, assigned sequentially from 1 at creation"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Slot occupation state
        constraints: "one of {OPEN, BOOKED, USED, RELEASED}"
        default: OPEN

  - name: TrappingAppointment
    parent: null
    common_fields: true
    fields:
      - name: cat_id
        type: string
        source: input
        description: "FK -> Cat.id; cat to be trapped"
      - name: clinic_slot_id
        type: string
        source: input
        description: "FK -> ClinicSlot.id; slot reserved for the surgery"
      - name: trap_date
        type: datetime
        source: input
        description: Planned trapping date; must be strictly before the slot's clinic day
      - name: voucher_id
        type: string
        source: input
        description: "FK -> Voucher.id; optional voucher committed to this appointment; null means full-price clinic billing"
        default: null
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle
        constraints: "one of {SCHEDULED, TRAPPED, NO_SHOW, COMPLETED, CANCELLED}"
        default: SCHEDULED

  - name: SurgeryRecord
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> TrappingAppointment.id; the appointment this surgery fulfills"
      - name: surgeon_initials
        type: string
        source: input
        description: Recording surgeon's initials
      - name: ear_tipped
        type: boolean
        source: input
        description: Whether the left ear was tipped during surgery
      - name: rabies_vaccinated
        type: boolean
        source: input
        description: Whether rabies vaccine was administered
      - name: complications
        type: boolean
        source: input
        description: Whether surgical complications occurred
        default: false
      - name: outcome
        type: enum
        source: input
        description: Surgery outcome
        constraints: "one of {STERILIZED, ALREADY_STERILE, DIED_IN_SURGERY}"
      - name: performed_at
        type: datetime
        source: system
        description: Server-stamped time the record was created (logical clock)

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - name: caretaker_id
        type: string
        source: input
        description: "FK -> Caretaker.id; the caretaker this voucher was issued to"
      - name: face_value_cents
        type: integer
        source: input
        description: Nominal value of the voucher
        constraints: "> 0"
      - name: funding_source
        type: enum
        source: input
        description: Budget line the voucher draws on
        constraints: "one of {MUNICIPAL_GRANT, DONATION_FUND}"
      - name: issued_month
        type: string
        source: system
        description: "YYYY-MM of issuance, taken from the logical clock; drives the monthly issuance cap"
      - name: status
        type: enum
        source: system
        description: Voucher lifecycle
        constraints: "one of {ISSUED, COMMITTED, REDEEMED, VOIDED, EXPIRED}"
        default: ISSUED

  - name: Complaint
    parent: Colony
    common_fields: true
    fields:
      - name: colony_id
        type: string
        source: input
        description: "FK -> Colony.id; colony the complaint concerns"
      - name: complainant_name
        type: string
        source: input
        description: Neighbor filing the complaint
      - name: category
        type: enum
        source: input
        description: Complaint category
        constraints: "one of {NOISE, ODOR, PROPERTY_DAMAGE, WILDLIFE_CONFLICT, OVERPOPULATION}"
      - name: filed_at
        type: datetime
        source: system
        description: Server-stamped filing time (logical clock)
      - name: severity
        type: enum
        source: system
        description: "Derived severity: HIGH if category in {PROPERTY_DAMAGE, WILDLIFE_CONFLICT}, else STANDARD"
        constraints: "one of {STANDARD, HIGH}"
      - name: status
        type: enum
        source: system
        description: Complaint lifecycle
        constraints: "one of {OPEN, IN_MEDIATION, RESOLVED, ESCALATED}"
        default: OPEN

  - name: FosterHome
    parent: null
    common_fields: true
    fields:
      - name: volunteer_name
        type: string
        source: input
        description: Foster volunteer's name
      - name: capacity_kittens
        type: integer
        source: input
        description: Maximum number of kittens this home will host at once
        constraints: ">= 1"
      - name: current_kittens
        type: integer
        source: computed
        description: Count of FosterPlacements at this home with status ACTIVE
        default: 0
      - name: status
        type: enum
        source: system
        description: Foster home standing
        constraints: "one of {ACTIVE, PAUSED}"
        default: ACTIVE

  - name: FosterPlacement
    parent: null
    common_fields: true
    fields:
      - name: cat_id
        type: string
        source: input
        description: "FK -> Cat.id; kitten placed in foster care"
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; home hosting the kitten"
      - name: placed_at
        type: datetime
        source: system
        description: Server-stamped placement time (logical clock)
      - name: status
        type: enum
        source: system
        description: Placement lifecycle
        constraints: "one of {ACTIVE, ENDED_ADOPTION, ENDED_RETURNED}"
        default: ACTIVE

  - name: PopulationSurvey
    parent: Colony
    common_fields: false
    fields:
      - name: colony_id
        type: string
        source: input
        description: "FK -> Colony.id; colony surveyed"
      - name: surveyed_on
        type: datetime
        source: input
        description: Date the physical count took place
      - name: observed_count
        type: integer
        source: input
        description: Number of cats observed in the field
        constraints: ">= 0"
      - name: eartipped_count
        type: integer
        source: input
        description: Number of observed cats bearing an ear tip
        constraints: ">= 0 and <= observed_count"
      - name: notes
        type: string
        source: input
        description: Free-text field notes
        default: ""

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Cat
    initial_state: AT_LARGE
    terminal_states: [RETURNED, COLONY_STERILIZED, ADOPTED, DECEASED]
    transitions:
      - from: AT_LARGE
        to: TRAPPED
        trigger: "POST /tnr/appointments/{id}/mark-trapped"
        actor: Caretaker
        preconditions:
          - "appointment.status == SCHEDULED"
          - "appointment.cat_id == this cat"
          - "cat.status == AT_LARGE"
        side_effects:
          - "appointment.status -> TRAPPED"
          - "colony.sterilized_pct and colony.monitoring_status recomputed (unchanged numerically, but updated_at refreshed)"
      - from: TRAPPED
        to: AT_CLINIC
        trigger: "POST /tnr/appointments/{id}/check-in"
        actor: ClinicStaff
        preconditions:
          - "appointment.status == TRAPPED"
          - "appointment's clinic_slot.status == BOOKED"
          - "clinic day of the slot has status == SCHEDULED"
        side_effects:
          - "none on other entities"
      - from: AT_CLINIC
        to: POST_SURGERY
        trigger: "POST /tnr/surgery-records (outcome STERILIZED or ALREADY_STERILE)"
        actor: ClinicStaff
        preconditions:
          - "cat.status == AT_CLINIC"
          - "appointment.status == TRAPPED and appointment.cat_id == this cat"
          - "outcome != DIED_IN_SURGERY"
        side_effects:
          - "cat.ear_tipped = record.ear_tipped"
          - "cat.vaccinated_rabies = record.rabies_vaccinated"
          - "appointment.status -> COMPLETED"
          - "appointment's clinic_slot.status -> USED; clinic_day.booked_count decremented by 1"
          - "if appointment.voucher_id is not null: voucher.status COMMITTED -> REDEEMED and municipal reimbursement ledger entry implied by voucher.funding_source"
          - "colony.sterilized_pct recomputed; colony.monitoring_status re-derived"
      - from: AT_CLINIC
        to: DECEASED
        trigger: "POST /tnr/surgery-records (outcome DIED_IN_SURGERY)"
        actor: ClinicStaff
        preconditions:
          - "cat.status == AT_CLINIC"
          - "appointment.status == TRAPPED and appointment.cat_id == this cat"
          - "outcome == DIED_IN_SURGERY"
        side_effects:
          - "appointment.status -> COMPLETED"
          - "appointment's clinic_slot.status -> USED; clinic_day.booked_count decremented by 1"
          - "if appointment.voucher_id is not null: voucher.status COMMITTED -> VOIDED (no reimbursement on mortality)"
          - "colony.sterilized_pct recomputed; colony.monitoring_status re-derived"
      - from: POST_SURGERY
        to: RETURNED
        trigger: "POST /tnr/cats/{id}/decide-pathway (pathway RETURN_TO_FIELD)"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == POST_SURGERY"
          - "cat.ear_tipped == true"
          - "cat.vaccinated_rabies == true"
          - "no ACTIVE FosterPlacement exists for this cat"
        side_effects:
          - "cat.pathway = RETURN_TO_FIELD"
          - "colony.sterilized_pct recomputed; colony.monitoring_status re-derived (RETURNED counts as sterilized)"
      - from: POST_SURGERY
        to: IN_FOSTER
        trigger: "POST /tnr/foster-placements (kitten branch)"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == POST_SURGERY"
          - "cat.is_kitten == true"
          - "cat.ear_tipped == true and cat.vaccinated_rabies == true"
          - "target foster_home.status == ACTIVE"
          - "foster_home.current_kittens < foster_home.capacity_kittens"
        side_effects:
          - "cat.pathway = ADOPTION"
          - "foster_home.current_kittens incremented by 1"
      - from: POST_SURGERY
        to: ADOPTION_PIPELINE
        trigger: "POST /tnr/cats/{id}/decide-pathway (pathway ADOPTION, adult branch)"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == POST_SURGERY"
          - "cat.is_kitten == false"
          - "cat.ear_tipped == true and cat.vaccinated_rabies == true"
        side_effects:
          - "cat.pathway = ADOPTION"
      - from: IN_FOSTER
        to: ADOPTION_PIPELINE
        trigger: "POST /tnr/foster-placements/{id}/graduate"
        actor: FosterVolunteer
        preconditions:
          - "cat.status == IN_FOSTER"
          - "placement.status == ACTIVE"
          - "placement.foster_home_id belongs to the acting FosterVolunteer's home"
        side_effects:
          - "placement.status -> ENDED_ADOPTION"
          - "foster_home.current_kittens decremented by 1"
      - from: IN_FOSTER
        to: POST_SURGERY
        trigger: "POST /tnr/foster-placements/{id}/return-to-program"
        actor: FosterVolunteer
        preconditions:
          - "cat.status == IN_FOSTER"
          - "placement.status == ACTIVE"
          - "placement.foster_home_id belongs to the acting FosterVolunteer's home"
        side_effects:
          - "placement.status -> ENDED_RETURNED"
          - "foster_home.current_kittens decremented by 1"
          - "cat.pathway reset to null (decision re-opened)"
        note: "foster loop — a kitten can bounce back to POST_SURGERY and be re-placed"
      - from: ADOPTION_PIPELINE
        to: ADOPTED
        trigger: "POST /tnr/cats/{id}/finalize-adoption"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == ADOPTION_PIPELINE"
        side_effects:
          - "colony.sterilized_pct recomputed (ADOPTED cats leave the resident denominator); colony.monitoring_status re-derived"
      - from: ADOPTION_PIPELINE
        to: POST_SURGERY
        trigger: "POST /tnr/cats/{id}/decide-pathway (pathway RETURN_TO_FIELD)"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == ADOPTION_PIPELINE"
        side_effects:
          - "cat.pathway reset to null, then re-set to RETURN_TO_FIELD on the subsequent RETURNED transition"
        note: "adoption fall-through — an adult that fails to be adopted returns to the pathway decision point; the separate RETURN_TO_FIELD decision then applies from POST_SURGERY"
      - from: RETURNED
        to: COLONY_STERILIZED
        trigger: "POST /tnr/cats/{id}/confirm-long-term (system-verified after a PopulationSurvey observes the cat ear-tipped)"
        actor: ProgramCoordinator
        preconditions:
          - "cat.status == RETURNED"
          - "a PopulationSurvey on cat.colony_id exists with surveyed_on >= cat.updated_at of the RETURNED transition and eartipped_count >= 1"
        side_effects:
          - "colony.sterilized_pct recomputed; colony.monitoring_status re-derived"

  - entity: TrappingAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: TRAPPED
        trigger: "POST /tnr/appointments/{id}/mark-trapped"
        actor: Caretaker
        preconditions:
          - "cat.status == AT_LARGE"
          - "acting caretaker_id == colony.caretaker_id of the cat's colony"
        side_effects:
          - "cat.status AT_LARGE -> TRAPPED"
      - from: TRAPPED
        to: COMPLETED
        trigger: "POST /tnr/surgery-records"
        actor: ClinicStaff
        preconditions:
          - "cat.status == AT_CLINIC"
        side_effects:
          - "clinic_slot.status BOOKED -> USED"
          - "clinic_day.booked_count decremented by 1"
          - "voucher committed on the appointment is REDEEMED (or VOIDED when outcome == DIED_IN_SURGERY)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tnr/appointments/{id}/cancel"
        actor: Caretaker
        preconditions:
          - "appointment.status == SCHEDULED"
          - "acting caretaker_id == colony.caretaker_id of the cat's colony"
        side_effects:
          - "clinic_slot.status BOOKED -> RELEASED"
          - "clinic_day.booked_count decremented by 1"
          - "if voucher_id is not null: voucher.status COMMITTED -> ISSUED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /tnr/clinic-days/{id}/close (system sweep)"
        actor: ClinicStaff
        preconditions:
          - "clinic_day.status == SCHEDULED"
          - "appointment booked on a slot of this day still in SCHEDULED at close"
        side_effects:
          - "clinic_slot.status BOOKED -> USED (slot consumed by the no-show)"
          - "if voucher_id is not null: voucher.status COMMITTED -> ISSUED (voucher released back)"
        note: "cat remains AT_LARGE; no-show consumes the slot but releases the voucher"

  - entity: ClinicSlot
    initial_state: OPEN
    terminal_states: [USED, RELEASED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /tnr/appointments"
        actor: Caretaker
        preconditions:
          - "slot.status == OPEN"
          - "slot's clinic_day.status == SCHEDULED"
          - "slot's clinic_day has booked_count < base_capacity + surge_capacity (aggregate guard)"
        side_effects:
          - "clinic_day.booked_count incremented by 1"
      - from: BOOKED
        to: USED
        trigger: "POST /tnr/surgery-records or POST /tnr/clinic-days/{id}/close no-show sweep"
        actor: ClinicStaff
        preconditions: []
        side_effects:
          - "clinic_day.booked_count decremented by 1 when transition fires via surgery-records; unchanged on no-show sweep (already excluded from booked once day closes)"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /tnr/appointments/{id}/cancel"
        actor: Caretaker
        preconditions: []
        side_effects:
          - "clinic_day.booked_count decremented by 1"

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOIDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: COMMITTED
        trigger: "POST /tnr/appointments with voucher_id"
        actor: Caretaker
        preconditions:
          - "voucher.status == ISSUED"
          - "voucher.caretaker_id == acting caretaker"
        side_effects: []
      - from: COMMITTED
        to: REDEEMED
        trigger: "POST /tnr/surgery-records with outcome != DIED_IN_SURGERY"
        actor: ClinicStaff
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: VOIDED
        trigger: "POST /tnr/surgery-records with outcome == DIED_IN_SURGERY"
        actor: ClinicStaff
        preconditions: []
        side_effects: []
      - from: COMMITTED
        to: ISSUED
        trigger: "POST /tnr/appointments/{id}/cancel or no-show sweep"
        actor: Caretaker
        preconditions: []
        side_effects: []
        note: "voucher release cycle — ISSUED -> COMMITTED -> ISSUED may repeat"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /tnr/vouchers/expire-sweep (system)"
        actor: ProgramCoordinator
        preconditions:
          - "voucher.status == ISSUED"
          - "voucher.issued_month is at least VOUCHER_TTL_MONTHS (3) months before the current logical month"
        side_effects: []

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_MEDIATION
        trigger: "POST /tnr/complaints/{id}/start-mediation"
        actor: AnimalControlOfficer
        preconditions:
          - "complaint.status == OPEN"
        side_effects:
          - "colony.monitoring_status re-derived (OPEN complaint leaves the OPEN set)"
      - from: IN_MEDIATION
        to: RESOLVED
        trigger: "POST /tnr/complaints/{id}/resolve"
        actor: AnimalControlOfficer
        preconditions:
          - "complaint.status == IN_MEDIATION"
          - "acting officer id != complaint's mediating officer id recorded at start-mediation (segregation of duties is NOT enforced; same officer may resolve — see roles)"
        side_effects:
          - "colony.monitoring_status re-derived"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /tnr/complaints/{id}/escalate"
        actor: AnimalControlOfficer
        preconditions:
          - "complaint.status == OPEN"
          - "complaint.severity == HIGH"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /tnr/complaints/{id}/resolve"
        actor: ProgramCoordinator
        preconditions:
          - "complaint.status == ESCALATED"
        side_effects:
          - "colony.monitoring_status re-derived"
        note: "escalated complaints require coordinator sign-off to close"

  - entity: ClinicDay
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tnr/clinic-days/{id}/close"
        actor: ClinicStaff
        preconditions:
          - "clinic_day.status == SCHEDULED"
        side_effects:
          - "every BOOKED slot whose appointment is still SCHEDULED becomes USED and its appointment NO_SHOW (voucher released)"
          - "every remaining OPEN slot becomes RELEASED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tnr/clinic-days/{id}/cancel"
        actor: ClinicStaff
        preconditions:
          - "clinic_day.status == SCHEDULED"
          - "clinic_day.booked_count == 0"
        side_effects:
          - "every OPEN slot becomes RELEASED"

  - entity: FosterPlacement
    initial_state: ACTIVE
    terminal_states: [ENDED_ADOPTION, ENDED_RETURNED]
    transitions:
      - from: ACTIVE
        to: ENDED_ADOPTION
        trigger: "POST /tnr/foster-placements/{id}/graduate"
        actor: FosterVolunteer
        preconditions: ["cat.status == IN_FOSTER"]
        side_effects:
          - "cat.status IN_FOSTER -> ADOPTION_PIPELINE"
          - "foster_home.current_kittens decremented by 1"
      - from: ACTIVE
        to: ENDED_RETURNED
        trigger: "POST /tnr/foster-placements/{id}/return-to-program"
        actor: FosterVolunteer
        preconditions: ["cat.status == IN_FOSTER"]
        side_effects:
          - "cat.status IN_FOSTER -> POST_SURGERY"
          - "foster_home.current_kittens decremented by 1"
          - "cat.pathway reset to null"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-create-stale-slot-day
    parent_entity: ClinicDay
    write_endpoint: "POST /tnr/appointments"
    occ_field: "expected_clinic_day_version"
    description: |
      Creating a TrappingAppointment against a ClinicDay whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just booked or released a slot on
      the same day (advancing booked_count and the day version) and the
      current writer's capacity view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pathway-decide-stale-cat
    parent_entity: Cat
    write_endpoint: "POST /tnr/cats/{id}/decide-pathway"
    occ_field: "expected_cat_version"
    description: |
      Deciding the pathway of a Cat whose version has advanced since the
      client last observed it is rejected. This captures the case where a
      foster return or another pathway decision has just re-opened the
      decision (resetting pathway to null and bumping the version) and the
      current writer's view of the cat is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: colony_sterilization_rate
    trigger: "Recomputed on every transition that changes a resident Cat's status set membership (surgery completion, pathway RETURN_TO_FIELD decision, adoption finalize, foster return) and on every Complaint status change"
    algorithm: aggregation
    formula: |
      residents = cats of colony with status IN {AT_LARGE, TRAPPED, AT_CLINIC,
                  POST_SURGERY, RETURNED, COLONY_STERILIZED, IN_FOSTER,
                  ADOPTION_PIPELINE}
      # ADOPTED and DECEASED cats leave the resident set entirely.
      sterilized = residents with status IN {RETURNED, COLONY_STERILIZED}
      if len(residents) == 0: sterilized_pct = 0
      else: sterilized_pct = round(len(sterilized) / len(residents), 4)
      monitoring_status =
        STABLE  if sterilized_pct >= STABLE_THRESHOLD and no complaint of the
                  colony has status == OPEN
        WATCH   if sterilized_pct >= STABLE_THRESHOLD and at least one complaint
                  has status == OPEN
        ACTIVE  otherwise
    input_set: "Cats of the colony excluding ADOPTED and DECEASED; complaints of the colony with status == OPEN only (IN_MEDIATION and ESCALATED do not block STABLE)"
    constants:
      STABLE_THRESHOLD: 0.75
    precision: "4 decimal places, round_half_up"
    variants:
      - name: resident_basis
        when: "default — counts RETURNED and COLONY_STERILIZED as sterilized"
        difference: "IN_FOSTER and ADOPTION_PIPELINE cats remain in the denominator but not the numerator, depressing the rate while kittens await adoption"

  - name: voucher_reimbursement_amount
    trigger: "When a voucher transitions COMMITTED -> REDEEMED on surgery completion"
    algorithm: tiered_pricing
    formula: |
      # The program reimburses the clinic min(voucher.face_value_cents,
      # clinic.voucher_reimbursement_cents), but a municipal-grant voucher is
      # reimbursed at full capped value while a donation-fund voucher pays a
      # DONATION_COVERAGE_PCT share and the caretaker is invoiced the remainder.
      cap = clinic.voucher_reimbursement_cents
      base = min(voucher.face_value_cents, cap)
      if voucher.funding_source == MUNICIPAL_GRANT:
          reimbursement_cents = base
          caretaker_share_cents = 0
      else:  # DONATION_FUND
          reimbursement_cents = floor(base * DONATION_COVERAGE_PCT)
          caretaker_share_cents = base - reimbursement_cents
    input_set: "The redeemed voucher and the PartnerClinic of the appointment's slot's clinic day"
    constants:
      DONATION_COVERAGE_PCT: 0.80
    precision: "integer cents; floor on the donation share so reimbursement + caretaker_share == base exactly"
    variants:
      - name: municipal_full_coverage
        when: "voucher.funding_source == MUNICIPAL_GRANT"
        difference: "reimbursement_cents == base, caretaker_share_cents == 0 — same face value and clinic cap produce a different split than the donation variant"

  - name: clinic_day_effective_capacity
    trigger: "Evaluated on POST /tnr/appointments to decide whether the day's aggregate guard admits another booking"
    algorithm: threshold
    formula: |
      # Surge mode: a clinic day whose service_date month is in
      # KITTEN_SEASON_MONTHS admits surge_capacity extra slots, but only when
      # the booking cat is a kitten; adult bookings never consume surge slots.
      base = clinic_day.base_capacity
      surge = clinic_day.surge_capacity
      month = service_date month (1-12)
      kitten_season = month IN KITTEN_SEASON_MONTHS
      booked = clinic_day.booked_count
      if cat.is_kitten and kitten_season:
          allowed = booked < base + surge
      else:
          allowed = booked < base
      # Boundary: booking is admitted when booked_count EQUALS base-1 (becomes
      # base after increment); rejected when booked_count == base for adults,
      # even if surge slots sit unused.
    input_set: "The clinic day of the requested slot and the cat on the appointment"
    constants:
      KITTEN_SEASON_MONTHS: [3, 4, 5, 6, 7]
    precision: "integer comparison, strict <"
    variants:
      - name: kitten_surge_window
        when: "cat.is_kitten == true and service month in KITTEN_SEASON_MONTHS"
        difference: "effective capacity = base_capacity + surge_capacity; outside the window or for adults the surge slots are unreachable — same day, two different capacities depending on cat age and calendar month"

  - name: voucher_monthly_issuance_cap
    trigger: "Evaluated on POST /tnr/vouchers"
    algorithm: waterfall_allocation
    formula: |
      # Per caretaker per calendar month the program issues at most
      # MONTHLY_CAP_CENTS of vouchers across BOTH funding sources; municipal
      # grant requests are filled first, donation requests with the remainder.
      issued_this_month = sum(face_value_cents of caretaker's vouchers with
                            issued_month == current logical month and
                            status IN {ISSUED, COMMITTED, REDEEMED})
      # VOIDED and EXPIRED vouchers free their face value back into the
      # caretaker's monthly envelope.
      headroom = MONTHLY_CAP_CENTS - issued_this_month
      if face_value_cents > headroom: reject with ERR_MONTHLY_CAP_EXCEEDED
    input_set: "Vouchers of the acting caretaker whose issued_month equals the logical-clock YYYY-MM and whose status is ISSUED, COMMITTED, or REDEEMED"
    constants:
      MONTHLY_CAP_CENTS: 30000
    precision: "integer cents, strict >"
    variants:
      - name: exclusion_of_dead_vouchers
        when: "VOIDED / EXPIRED vouchers exist in the same month"
        difference: "dead vouchers do not consume the envelope, so a caretaker whose voucher died in surgery can re-issue within the same month up to the cap — same month, two different headrooms depending on which statuses are counted"

  - name: population_trend_delta
    trigger: "Computed on GET /tnr/colonies/{id}/population-report"
    algorithm: chronological
    formula: |
      # Surveys are processed in surveyed_on order (tie-break: created_at ASC,
      # never id). Two valid orderings produce different trend labels when
      # same-day surveys disagree, so the order is pinned here.
      surveys = colony's PopulationSurveys sorted by (surveyed_on ASC, created_at ASC)
      if len(surveys) < 2: trend = INSUFFICIENT_DATA
      else:
          first = surveys[0].observed_count
          last  = surveys[-1].observed_count
          delta_pct = (last - first) / first if first > 0 else (INF if last > 0 else 0)
          trend = DECLINING  if delta_pct <= -DECLINE_THRESHOLD
                  GROWING    if delta_pct >=  GROWTH_THRESHOLD
                  FLAT       otherwise
    input_set: "All PopulationSurveys of the colony; none are excluded by status (the entity has no status field)"
    constants:
      DECLINE_THRESHOLD: 0.20
      GROWTH_THRESHOLD: 0.20
    precision: "delta_pct compared unrounded; thresholds inclusive on both ends"
    variants:
      - name: zero_baseline
        when: "first survey observed_count == 0"
        difference: "delta is defined as +INF when last > 0 (GROWING) and 0 when last == 0 (FLAT) — division-by-zero is resolved by a pinned special case, not by skipping the survey"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id and FK id in the request body resolves to an existing record, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC expected_*_version matches the parent entity's current version, where the endpoint declares such a field"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tnr/appointments, POST /tnr/cats/{id}/decide-pathway"

  - priority: 6
    category: business_safety
    check: "Pathway RETURN_TO_FIELD or ADOPTION requires cat.ear_tipped == true AND cat.vaccinated_rabies == true (no unmarked, unvaccinated cat leaves the program)"
    error_id: ERR_NOT_RELEASE_READY
    http_status: 422
    applies_to: "POST /tnr/cats/{id}/decide-pathway, POST /tnr/foster-placements"

  - priority: 7
    category: business_safety
    check: "Foster placement requires cat.is_kitten == true — adults may not enter foster homes"
    error_id: ERR_NOT_A_KITTEN
    http_status: 422
    applies_to: "POST /tnr/foster-placements"

  - priority: 8
    category: business_referential
    check: "Acting caretaker owns the referenced resource: appointment's cat's colony.caretaker_id == X-User-ID for caretaker-scoped operations; voucher.caretaker_id == X-User-ID when committing a voucher; foster placement's home belongs to acting volunteer"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /tnr/appointments/{id}/mark-trapped, POST /tnr/appointments/{id}/cancel, POST /tnr/appointments (voucher_id), POST /tnr/foster-placements/{id}/graduate, POST /tnr/foster-placements/{id}/return-to-program"

  - priority: 9
    category: business_constraint
    check: "Colony intake_tag unique within colony; caretaker email unique; complaint escalation requires severity == HIGH; confirm-long-term requires a qualifying PopulationSurvey"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: "POST /tnr/colonies/{id}/cats, POST /tnr/caretakers"

  - priority: 10
    category: business_temporal
    check: "Appointment trap_date is strictly before the slot's clinic day service_date, and service_date is not in the past relative to the logical clock"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "POST /tnr/appointments, POST /tnr/clinic-days"

  - priority: 11
    category: business_constraint
    check: "Clinic day capacity guard per calculation clinic_day_effective_capacity (base vs base+surge depending on kitten/season)"
    error_id: ERR_CLINIC_DAY_FULL
    http_status: 409
    applies_to: "POST /tnr/appointments"

  - priority: 12
    category: business_fiscal
    check: "Voucher issuance within caretaker's monthly cap (voucher_monthly_issuance_cap); voucher must be ISSUED and owned by the acting caretaker when committed"
    error_id: ERR_MONTHLY_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /tnr/vouchers"

  - priority: 13
    category: business_fiscal
    check: "Voucher referenced on an appointment must have status == ISSUED"
    error_id: ERR_VOUCHER_NOT_USABLE
    http_status: 402
    applies_to: "POST /tnr/appointments"

  - priority: 14
    category: business_constraint
    check: "Foster home capacity: foster_home.current_kittens < foster_home.capacity_kittens and home status == ACTIVE"
    error_id: ERR_FOSTER_HOME_FULL
    http_status: 409
    applies_to: "POST /tnr/foster-placements"

  - priority: 15
    category: business_temporal
    check: "PopulationSurvey: eartipped_count <= observed_count; surveyed_on not in the future relative to the logical clock"
    error_id: ERR_SURVEY_INCONSISTENT
    http_status: 422
    applies_to: "POST /tnr/colonies/{id}/population-surveys"

  - priority: 16
    category: business_constraint
    check: "Clinic day cancellation requires booked_count == 0"
    error_id: ERR_DAY_HAS_BOOKINGS
    http_status: 409
    applies_to: "POST /tnr/clinic-days/{id}/cancel"

  - priority: 17
    category: business_constraint
    check: "Voucher expiry sweep only expires vouchers at least VOUCHER_TTL_MONTHS (3) months old"
    error_id: ERR_NOTHING_TO_EXPIRE
    http_status: 422
    applies_to: "POST /tnr/vouchers/expire-sweep"

  - priority: 18
    category: business_constraint
    check: "Colony dissolve requires every resident cat in a terminal state (RETURNED, COLONY_STERILIZED, ADOPTED, DECEASED)"
    error_id: ERR_COLONY_NOT_DISSOLVABLE
    http_status: 409
    applies_to: "POST /tnr/colonies/{id}/dissolve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving infrastructure ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all server-stamped timestamps after this call use the new logical time"]

  # --- caretakers ---
  - method: POST
    path: "/tnr/caretakers"
    description: "Register a caretaker"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, phone, email, "certified_tnr?"]
    output: Caretaker
    side_effects: []

  - method: GET
    path: "/tnr/caretakers/{id}"
    description: "Fetch a caretaker"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer]
    code: 200
    input: []
    output: Caretaker
    side_effects: []

  - method: GET
    path: "/tnr/caretakers/{id}/vouchers"
    description: "List vouchers issued to a caretaker (reverse reachability for Voucher.caretaker_id)"
    roles: [ProgramCoordinator, Caretaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Voucher[]
    side_effects: []

  # --- colonies ---
  - method: POST
    path: "/tnr/colonies"
    description: "Register a colony under a caretaker"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, address, caretaker_id, estimated_population]
    output: Colony
    side_effects: ["registered_on stamped from logical clock", "monitoring_status initialized ACTIVE"]

  - method: GET
    path: "/tnr/colonies/{id}"
    description: "Fetch a colony including computed sterilized_pct and monitoring_status"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer, ClinicStaff]
    code: 200
    input: []
    output: Colony
    side_effects: []

  - method: GET
    path: "/tnr/colonies"
    description: "List colonies with filters"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer]
    code: 200
    input: ["caretaker_id?", "monitoring_status?", "limit?", "offset?"]
    output: Colony[]
    side_effects: []

  - method: POST
    path: "/tnr/colonies/{id}/dissolve"
    description: "Dissolve a colony (all resident cats must be in terminal states)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Colony
    side_effects: ["colony.status -> DISSOLVED"]

  # --- cats ---
  - method: POST
    path: "/tnr/colonies/{id}/cats"
    description: "Add a cat to a colony"
    roles: [ProgramCoordinator, Caretaker]
    code: 201
    input: [intake_tag, sex, approximate_age_months]
    output: Cat
    side_effects: ["colony.sterilized_pct recomputed (new AT_LARGE cat enlarges denominator)"]

  - method: GET
    path: "/tnr/colonies/{id}/cats"
    description: "List cats of a colony"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer, ClinicStaff, FosterVolunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Cat[]
    side_effects: []

  - method: GET
    path: "/tnr/cats/{id}"
    description: "Fetch a cat"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer, ClinicStaff, FosterVolunteer]
    code: 200
    input: []
    output: Cat
    side_effects: []

  - method: POST
    path: "/tnr/cats/{id}/decide-pathway"
    description: "Decide POST_SURGERY disposition (RETURN_TO_FIELD or ADOPTION); also used for adoption fall-through back to POST_SURGERY. OCC-guarded on Cat.version."
    roles: [ProgramCoordinator]
    code: 200
    input: [pathway, expected_cat_version]
    output: Cat
    side_effects: ["cat transitions per §1.2 Cat POST_SURGERY / ADOPTION_PIPELINE branches", "increments Cat.version by 1", "colony.sterilized_pct and monitoring_status recomputed"]

  - method: POST
    path: "/tnr/cats/{id}/finalize-adoption"
    description: "Mark an ADOPTION_PIPELINE cat as ADOPTED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Cat
    side_effects: ["colony.sterilized_pct recomputed (cat leaves resident set)"]

  - method: POST
    path: "/tnr/cats/{id}/confirm-long-term"
    description: "Confirm a RETURNED cat as COLONY_STERILIZED after a qualifying survey"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Cat
    side_effects: ["colony.sterilized_pct recomputed"]

  # --- clinics & clinic days ---
  - method: POST
    path: "/tnr/partner-clinics"
    description: "Onboard a partner clinic"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, voucher_reimbursement_cents, "accepts_vouchers?"]
    output: PartnerClinic
    side_effects: []

  - method: GET
    path: "/tnr/partner-clinics/{id}/clinic-days"
    description: "List clinic days hosted by a clinic"
    roles: [ProgramCoordinator, ClinicStaff, Caretaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicDay[]
    side_effects: []

  - method: GET
    path: "/tnr/partner-clinics/{id}"
    description: "Fetch a partner clinic"
    roles: [ProgramCoordinator, ClinicStaff]
    code: 200
    input: []
    output: PartnerClinic
    side_effects: []

  - method: POST
    path: "/tnr/clinic-days"
    description: "Schedule a clinic day; the server creates base_capacity + surge_capacity OPEN slots with sequential slot_index"
    roles: [ClinicStaff]
    code: 201
    input: [clinic_id, service_date, base_capacity, "surge_capacity?"]
    output: ClinicDay
    side_effects: ["creates (base_capacity + surge_capacity) ClinicSlot rows with status OPEN"]

  - method: GET
    path: "/tnr/clinic-days/{id}"
    description: "Fetch a clinic day including booked_count"
    roles: [ProgramCoordinator, ClinicStaff, Caretaker]
    code: 200
    input: []
    output: ClinicDay
    side_effects: []

  - method: GET
    path: "/tnr/clinic-days/{id}/slots"
    description: "List slots of a clinic day"
    roles: [ProgramCoordinator, ClinicStaff, Caretaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClinicSlot[]
    side_effects: []

  - method: GET
    path: "/tnr/clinic-slots/{id}"
    description: "Fetch a clinic slot"
    roles: [ProgramCoordinator, ClinicStaff, Caretaker]
    code: 200
    input: []
    output: ClinicSlot
    side_effects: []

  - method: POST
    path: "/tnr/clinic-days/{id}/close"
    description: "Close a clinic day: no-show sweep + release unused slots"
    roles: [ClinicStaff]
    code: 200
    input: []
    output: ClinicDay
    side_effects: ["per §1.2 ClinicDay close and TrappingAppointment NO_SHOW", "vouchers on no-show appointments released to ISSUED"]

  - method: POST
    path: "/tnr/clinic-days/{id}/cancel"
    description: "Cancel an unbooked clinic day"
    roles: [ClinicStaff]
    code: 200
    input: []
    output: ClinicDay
    side_effects: ["all OPEN slots -> RELEASED"]

  # --- appointments ---
  - method: POST
    path: "/tnr/appointments"
    description: "Book a trapping appointment: reserves a slot and optionally commits a voucher. OCC-guarded on ClinicDay.version."
    roles: [Caretaker]
    code: 201
    input: [cat_id, clinic_slot_id, trap_date, "voucher_id?", expected_clinic_day_version]
    output: TrappingAppointment
    side_effects: ["slot OPEN -> BOOKED", "clinic_day.booked_count +1", "increments ClinicDay.version by 1", "voucher ISSUED -> COMMITTED when voucher_id given"]

  - method: GET
    path: "/tnr/appointments/{id}"
    description: "Fetch an appointment"
    roles: [ProgramCoordinator, Caretaker, ClinicStaff]
    code: 200
    input: []
    output: TrappingAppointment
    side_effects: []

  - method: GET
    path: "/tnr/cats/{id}/appointments"
    description: "List appointments for a cat (reverse reachability for TrappingAppointment.cat_id)"
    roles: [ProgramCoordinator, Caretaker, ClinicStaff]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TrappingAppointment[]
    side_effects: []

  - method: GET
    path: "/tnr/clinic-slots/{id}/appointments"
    description: "List appointments booked against a slot (reverse reachability for TrappingAppointment.clinic_slot_id)"
    roles: [ProgramCoordinator, ClinicStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: TrappingAppointment[]
    side_effects: []

  - method: GET
    path: "/tnr/vouchers/{id}/appointments"
    description: "List appointments that committed a voucher (reverse reachability for TrappingAppointment.voucher_id)"
    roles: [ProgramCoordinator, Caretaker]
    code: 200
    input: ["limit?", "offset?"]
    output: TrappingAppointment[]
    side_effects: []

  - method: POST
    path: "/tnr/appointments/{id}/mark-trapped"
    description: "Caretaker confirms the cat is trapped"
    roles: [Caretaker]
    code: 200
    input: []
    output: TrappingAppointment
    side_effects: ["cat AT_LARGE -> TRAPPED"]

  - method: POST
    path: "/tnr/appointments/{id}/check-in"
    description: "Clinic checks the trapped cat in"
    roles: [ClinicStaff]
    code: 200
    input: []
    output: TrappingAppointment
    side_effects: ["cat TRAPPED -> AT_CLINIC"]

  - method: POST
    path: "/tnr/appointments/{id}/cancel"
    description: "Caretaker cancels a scheduled appointment; slot released, voucher released"
    roles: [Caretaker]
    code: 200
    input: []
    output: TrappingAppointment
    side_effects: ["slot BOOKED -> RELEASED", "clinic_day.booked_count -1", "voucher COMMITTED -> ISSUED when present"]

  # --- surgery ---
  - method: POST
    path: "/tnr/surgery-records"
    description: "Record a surgery outcome for a checked-in appointment"
    roles: [ClinicStaff]
    code: 201
    input: [appointment_id, surgeon_initials, ear_tipped, rabies_vaccinated, "complications?", outcome]
    output: SurgeryRecord
    side_effects: ["per §1.2 Cat AT_CLINIC branch: appointment COMPLETED, slot USED, voucher REDEEMED or VOIDED, cat fields updated, colony recomputed"]

  - method: GET
    path: "/tnr/appointments/{id}/surgery-records"
    description: "List surgery records of an appointment (reverse reachability for SurgeryRecord.appointment_id)"
    roles: [ProgramCoordinator, ClinicStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: SurgeryRecord[]
    side_effects: []

  # --- vouchers ---
  - method: POST
    path: "/tnr/vouchers"
    description: "Issue a voucher to a caretaker, subject to the monthly issuance cap"
    roles: [ProgramCoordinator]
    code: 201
    input: [caretaker_id, face_value_cents, funding_source]
    output: Voucher
    side_effects: ["issued_month stamped from logical clock"]

  - method: GET
    path: "/tnr/vouchers/{id}"
    description: "Fetch a voucher"
    roles: [ProgramCoordinator, Caretaker]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: POST
    path: "/tnr/vouchers/expire-sweep"
    description: "Expire all ISSUED vouchers at least 3 months old"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Voucher[]
    side_effects: ["matching vouchers ISSUED -> EXPIRED"]

  # --- complaints ---
  - method: POST
    path: "/tnr/colonies/{id}/complaints"
    description: "File a neighbor complaint against a colony"
    roles: [AnimalControlOfficer]
    code: 201
    input: [complainant_name, category]
    output: Complaint
    side_effects: ["filed_at stamped", "severity derived from category", "colony.monitoring_status re-derived (new OPEN complaint)"]

  - method: GET
    path: "/tnr/colonies/{id}/complaints"
    description: "List complaints against a colony"
    roles: [ProgramCoordinator, AnimalControlOfficer, Caretaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/tnr/complaints/{id}/start-mediation"
    description: "Open mediation on a complaint"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["colony.monitoring_status re-derived"]

  - method: POST
    path: "/tnr/complaints/{id}/escalate"
    description: "Escalate a HIGH-severity complaint"
    roles: [AnimalControlOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/tnr/complaints/{id}/resolve"
    description: "Resolve a complaint (IN_MEDIATION by officer; ESCALATED by coordinator)"
    roles: [AnimalControlOfficer, ProgramCoordinator]
    code: 200
    input: []
    output: Complaint
    side_effects: ["colony.monitoring_status re-derived"]

  # --- foster network ---
  - method: POST
    path: "/tnr/foster-homes"
    description: "Register a foster home"
    roles: [ProgramCoordinator]
    code: 201
    input: [volunteer_name, capacity_kittens]
    output: FosterHome
    side_effects: []

  - method: GET
    path: "/tnr/foster-homes/{id}"
    description: "Fetch a foster home including current_kittens"
    roles: [ProgramCoordinator, FosterVolunteer]
    code: 200
    input: []
    output: FosterHome
    side_effects: []

  - method: GET
    path: "/tnr/foster-homes/{id}/placements"
    description: "List placements at a foster home (reverse reachability for FosterPlacement.foster_home_id)"
    roles: [ProgramCoordinator, FosterVolunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FosterPlacement[]
    side_effects: []

  - method: GET
    path: "/tnr/cats/{id}/foster-placements"
    description: "List foster placements of a cat (reverse reachability for FosterPlacement.cat_id)"
    roles: [ProgramCoordinator, FosterVolunteer, Caretaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FosterPlacement[]
    side_effects: []

  - method: POST
    path: "/tnr/foster-placements"
    description: "Place a post-surgery kitten into a foster home"
    roles: [ProgramCoordinator]
    code: 201
    input: [cat_id, foster_home_id]
    output: FosterPlacement
    side_effects: ["cat POST_SURGERY -> IN_FOSTER, pathway = ADOPTION", "foster_home.current_kittens +1"]

  - method: POST
    path: "/tnr/foster-placements/{id}/graduate"
    description: "Kitten leaves foster into the adoption pipeline"
    roles: [FosterVolunteer]
    code: 200
    input: []
    output: FosterPlacement
    side_effects: ["cat IN_FOSTER -> ADOPTION_PIPELINE", "foster_home.current_kittens -1"]

  - method: POST
    path: "/tnr/foster-placements/{id}/return-to-program"
    description: "Kitten returns from foster to the POST_SURGERY decision point"
    roles: [FosterVolunteer]
    code: 200
    input: []
    output: FosterPlacement
    side_effects: ["cat IN_FOSTER -> POST_SURGERY, pathway reset null", "foster_home.current_kittens -1"]

  # --- population monitoring ---
  - method: POST
    path: "/tnr/colonies/{id}/population-surveys"
    description: "Record a field population survey"
    roles: [ProgramCoordinator, Caretaker]
    code: 201
    input: [surveyed_on, observed_count, eartipped_count, "notes?"]
    output: PopulationSurvey
    side_effects: []

  - method: GET
    path: "/tnr/colonies/{id}/population-surveys"
    description: "List population surveys of a colony"
    roles: [ProgramCoordinator, Caretaker, AnimalControlOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PopulationSurvey[]
    side_effects: []

  - method: GET
    path: "/tnr/colonies/{id}/population-report"
    description: "Computed population trend report (population_trend_delta)"
    roles: [ProgramCoordinator, AnimalControlOfficer]
    code: 200
    input: []
    output: object
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted on this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity not in a state that permits the requested transition (e.g. cancel a COMPLETED appointment, resolve an OPEN complaint, double mark-trapped)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_clinic_day_version or expected_cat_version does not match the parent entity's current version"
  - id: ERR_NOT_RELEASE_READY
    http: 422
    condition: "Pathway decision or foster placement attempted on a cat missing ear tip or rabies vaccination"
  - id: ERR_NOT_A_KITTEN
    http: 422
    condition: "Foster placement attempted on a cat with approximate_age_months >= 6"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "Acting caretaker/volunteer does not own the referenced colony-cat, voucher, or foster home"
  - id: ERR_UNIQUENESS_VIOLATION
    http: 409
    condition: "Duplicate caretaker email or duplicate intake_tag within a colony"
  - id: ERR_TEMPORAL_CONFLICT
    http: 422
    condition: "trap_date not strictly before the slot's clinic day, or clinic day service_date in the past, or survey dated in the future"
  - id: ERR_CLINIC_DAY_FULL
    http: 409
    condition: "Clinic day booked_count at effective capacity for this booking's class (adult vs kitten-in-season)"
  - id: ERR_MONTHLY_CAP_EXCEEDED
    http: 402
    condition: "Voucher issuance would push the caretaker's live-monthly total above 30000 cents"
  - id: ERR_VOUCHER_NOT_USABLE
    http: 402
    condition: "Voucher referenced on appointment creation is not in ISSUED status (or clinic does not accept vouchers)"
  - id: ERR_FOSTER_HOME_FULL
    http: 409
    condition: "Foster home at capacity or not ACTIVE"
  - id: ERR_SURVEY_INCONSISTENT
    http: 422
    condition: "eartipped_count > observed_count on a population survey"
  - id: ERR_DAY_HAS_BOOKINGS
    http: 409
    condition: "Clinic day cancellation attempted with booked_count > 0"
  - id: ERR_NOTHING_TO_EXPIRE
    http: 422
    condition: "Expire sweep found no ISSUED voucher at least 3 months old"
  - id: ERR_COLONY_NOT_DISSOLVABLE
    http: 409
    condition: "Dissolve attempted while any resident cat is in a non-terminal state"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Municipal TNR program staff; runs registration, vouchers, pathway decisions, foster placement, and escalated complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /tnr/caretakers"
      - "POST /tnr/colonies"
      - "POST /tnr/colonies/{id}/dissolve"
      - "POST /tnr/partner-clinics"
      - "POST /tnr/vouchers"
      - "POST /tnr/vouchers/expire-sweep"
      - "POST /tnr/cats/{id}/decide-pathway"
      - "POST /tnr/cats/{id}/finalize-adoption"
      - "POST /tnr/cats/{id}/confirm-long-term"
      - "POST /tnr/foster-homes"
      - "POST /tnr/foster-placements"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /tnr/complaints/{id}/resolve (ESCALATED only)"
      - "POST /tnr/colonies/{id}/population-surveys"

  - name: Caretaker
    description: "Registered colony caretaker; books appointments, traps cats, files surveys for own colonies"
    identity: "entity_backed:Caretaker"
    exclusive_operations:
      - "POST /tnr/appointments"
      - "POST /tnr/appointments/{id}/mark-trapped"
      - "POST /tnr/appointments/{id}/cancel"
    shared_operations:
      - "GET endpoints"
      - "POST /tnr/colonies/{id}/cats"
      - "POST /tnr/colonies/{id}/population-surveys"

  - name: ClinicStaff
    description: "Partner clinic personnel; schedules clinic days, checks cats in, records surgeries, closes days"
    identity: "opaque"
    exclusive_operations:
      - "POST /tnr/clinic-days"
      - "POST /tnr/clinic-days/{id}/close"
      - "POST /tnr/clinic-days/{id}/cancel"
      - "POST /tnr/appointments/{id}/check-in"
      - "POST /tnr/surgery-records"
    shared_operations:
      - "GET endpoints"

  - name: AnimalControlOfficer
    description: "Field officer handling neighbor complaints and mediation"
    identity: "opaque"
    exclusive_operations:
      - "POST /tnr/colonies/{id}/complaints"
      - "POST /tnr/complaints/{id}/start-mediation"
      - "POST /tnr/complaints/{id}/escalate"
    shared_operations:
      - "GET endpoints"
      - "POST /tnr/complaints/{id}/resolve (IN_MEDIATION only)"

  - name: FosterVolunteer
    description: "Foster home operator; graduates or returns placed kittens"
    identity: "entity_backed:FosterHome"
    exclusive_operations:
      - "POST /tnr/foster-placements/{id}/graduate"
      - "POST /tnr/foster-placements/{id}/return-to-program"
    shared_operations:
      - "GET endpoints"
