  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_invalid_beats_business_fiscal_slot_full
        grounds:
          - validations[priority=11]
          - validations[priority=29]
        distinguishing_aspect: |
          state (priority 11) vs business_fiscal (priority 29): confirming an
          already-cancelled reservation against a full slot returns
          ERR_STATE_INVALID (the state check), NOT ERR_SLOT_FULL.
        test_recipe:
          setup:
            - "A timed-entry slot capacity 1 already full from another booking; a held reservation that was then cancelled; clock at release."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "YELL", name: "Yellowstone", utc_offset_minutes: -420, timed_entry_required: true }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-05T08:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa9@x.com", full_name: "PA9", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v9@x.com", full_name: "V9", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/timed-entry-slots"
              payload: { park_id: "${park_id}", entry_date: "2026-06-08", window_start_local: "07:00", window_end_local: "09:00", capacity: 1, release_at: "2026-06-05T07:00:00Z", entry_fee_cents: 200 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /v1/timed-entry-reservations"
              payload: { slot_id: "${slot_id}", account_id: "${v_id}", vehicle_plate: "ABC123", expected_slot_version: "${slot_v0}" }
              as: visitor
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /v1/timed-entry-reservations/${resv_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /v1/timed-entry-reservations/${resv_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STATE_INVALID"

      - name: priority_forbidden_beats_business_temporal_lottery_closed
        grounds:
          - validations[priority=2]
          - validations[priority=16]
        distinguishing_aspect: |
          auth/authorization (priority 2) vs business_temporal (priority 16):
