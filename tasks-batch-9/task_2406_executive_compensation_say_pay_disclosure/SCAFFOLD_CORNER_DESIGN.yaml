          - errors[ERR_METRIC_ALREADY_DEFINED]
          - errors[ERR_CDA_SECTION_ALREADY_EXISTS]
          - errors[ERR_SCREEN_ALREADY_EXISTS]
          - validations.priority_29_ERR_ISSUER_ALREADY_EXISTS
          - validations.priority_30_ERR_PEER_ALREADY_IN_GROUP
          - validations.priority_31_ERR_METRIC_ALREADY_DEFINED
          - validations.priority_32_ERR_CDA_SECTION_ALREADY_EXISTS
          - validations.priority_33_ERR_SCREEN_ALREADY_EXISTS
