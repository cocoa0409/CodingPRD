  - rule_id: cross_entity_state_dependency
    instances:
      - name: tier_activation_blocked_by_contractor_debarment_state
        entity_pair: [ContractAssignment, Contractor]
        grounds:
          - validations.priority_14_debarment_gate
          - state_machines.Contractor.debarment_status
          - state_machines.ContractAssignment.status
        distinguishing_aspect: |
          The legality of a transition on ContractAssignment depends on the state of a
          different aggregate, Contractor. The assignment is created while the contractor
          is still CLEAR, so the row itself is perfectly valid; only after the agency drives
          the contractor CLEAR -> PROPOSED -> DEBARRED does the INVITED -> ACTIVE transition
          become illegal. An implementation that validates the debarment gate only at
          creation time lets the activation through.
        test_recipe:
          setup:
            - "An AWARDED project in CA-ALAMEDA on an ACTIVE determination."
            - "A contractor that is CLEAR and REGISTERED at the moment its INVITED tier is created."
            - "The agency then proposes and confirms debarment for that contractor."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
