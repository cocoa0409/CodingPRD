          assert:
            - "the response status is 200 with response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "data carries the pack's declared fields (sku, certification_status, version)"

  # ===========================================================================
  - section: rbac
    instances:

      - name: researcher_cannot_create_pack_returns_forbidden
        claim_type: role_denied
        grounds:
          - roles.FieldResearcher
          - validations.priority_2
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "FieldResearcher's only write is POST /insights; the same valid pack payload from that role is a 403 ERR_FORBIDDEN, proving role gating is per-endpoint and not payload-dependent."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One platform."]
          setup_api_calls:
            - *k_clock
            - *k_platform
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-RBAC", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: FieldResearcher
              as_user_id: "fr-kim"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and the response status is 403"
            - "GET /battery-ecosystem/battery-packs shows no pack was created"

      - name: account_manager_cannot_customize_other_accounts_asset
        claim_type: role_denied
        grounds:
          - roles.AccountManager
          - validations.priority_3
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Entity-backed ownership: AccountManager identity is the AssetAccount id; customizing an asset whose account_id differs from X-User-ID is ERR_FORBIDDEN even with a correct OCC version."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, pack, accounts A and B; battery asset registered to account B."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_account_std
            - call: "POST /battery-ecosystem/asset-accounts"
              payload: { org_name: "Other Org", tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acb: $.data.id }
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${acb}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-OWN-1", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${acb}"
              captures: { a1: $.data.id, a1_v: $.data.version }
          trigger:
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/customize"
              payload: { anti_theft_lock_enabled: true, expected_tracked_asset_version: "${a1_v}" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (account ${ac} does not own asset ${a1})"
            - "TrackedAsset.${a1}.anti_theft_lock_enabled remains false"

      - name: service_agent_cannot_adjudicate_other_centers_claim
        claim_type: role_denied
        grounds:
          - roles.ServiceAgent
          - validations.priority_3
        distinguishing_aspect: "ServiceAgent identity is the ServiceCenter id: the center that was NOT auto-selected for a claim cannot adjudicate it — ERR_FORBIDDEN even though ServiceAgent is the correct role for the endpoint."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, account, battery asset. Two centers: SC-A (created first, BATTERY_SERVICE cap 5) and SC-B (BATTERY_SERVICE cap 5). The claim auto-assigns to SC-A by the created_at tie-break."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - call: "POST /battery-ecosystem/service-centers"
              payload: { code: "SC-B", region: "MW", capabilities: ["BATTERY_SERVICE"], daily_capacity: 5 }
              as: PlatformAdmin
              captures: { scb: $.data.id }
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-RBAC-2", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id, c1_center: $.data.service_center_id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${c1}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${scb}"
              captures: { err: $.data.error_id }
          assert:
            - "claim was assigned to ${sca} (== c1_center), and adjudication as ${scb} fails with error_id ERR_FORBIDDEN"
            - "WarrantyClaim.${c1}.adjudication_status remains SUBMITTED"

      - name: channel_manager_cannot_create_listing_for_other_partner
        claim_type: role_denied
        grounds:
          - roles.ChannelManager
          - validations.priority_3
        distinguishing_aspect: "ChannelManager identity is the ChannelPartner id: a listing body naming partner P sent with X-User-ID of partner Q is ERR_FORBIDDEN before the OCC check runs."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, two INDUSTRIAL partners P and Q."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_partner_ind
            - call: "POST /battery-ecosystem/channel-partners"
              payload: { name: "Other Industrial", channel_type: "INDUSTRIAL_DISTRIBUTOR", region: "NE" }
              as: PlatformAdmin
              captures: { cpq: $.data.id }
          trigger:
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12000, allocation_qty: 10, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cpq}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (X-User-ID ${cpq} does not match body channel_partner_id ${cp})"
            - "GET /listings?channel_partner_id=${cp} returns 0 rows"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: customize_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[asset-customize-stale-asset]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on TrackedAsset.version: the first customize at the captured version succeeds and bumps version to 2; replaying the same captured version is then rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no overlap needed."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform; tool with torque range [2,60]; account with a TOOL asset at version 1."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_tool_basic
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "TOOL", tool_model_id: "${tm}", serial_number: "SN-OCC-1", manufactured_at: "2026-08-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id, a1_v: $.data.version }
          trigger:
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/customize"
              payload: { custom_torque_limit_nm: 40, expected_tracked_asset_version: "${a1_v}" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1_v2: $.data.version }
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/customize"
              payload: { custom_torque_limit_nm: 45, expected_tracked_asset_version: "${a1_v}" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/tracked-assets/${a1}/customize"
              payload: { custom_torque_limit_nm: 45, expected_tracked_asset_version: "${a1_v2}" }
              as: AccountManager
              as_user_id: "${ac}"
          assert:
            - "first customize succeeds: custom_torque_limit_nm == 40 and version == 2"
            - "replay with the stale version fails with error_id ERR_STALE_VERSION and HTTP 412; torque stays 40"
            - "the same payload with the refreshed version ${a1_v2} succeeds: torque == 45"

      - name: listing_create_with_stale_partner_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[listing-create-stale-partner]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on ChannelPartner.version for the create-with-supersede write: after one listing create bumps the partner version, a second create carrying the pre-create version is rejected 412, and the same create with the refreshed version is accepted."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Platform, CERTIFIED pack, INDUSTRIAL partner at version 1."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_partner_ind
          trigger:
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 12000, allocation_qty: 10, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { l1: $.data.id, pv2: $.data.channel_partner_version }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 11500, allocation_qty: 20, expected_channel_partner_version: "${cp_v}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { err: $.data.error_id }
            - call: "POST /battery-ecosystem/listings"
              payload: { channel_partner_id: "${cp}", battery_pack_id: "${pk}", wholesale_price_cents: 11500, allocation_qty: 20, expected_channel_partner_version: "${pv2}" }
              as: ChannelManager
              as_user_id: "${cp}"
              captures: { l2: $.data.id }
          assert:
            - "first create succeeds and the response echoes channel_partner_version == 2 (the create bumped the partner)"
            - "second create with the stale partner version fails with error_id ERR_STALE_VERSION (412), no supersede happened"
            - "third create with refreshed version succeeds: DistributionListing.${l2} exists and ${l1} is ENDED via supersede"

      - name: platform_sunset_and_retire_transitions_via_clock
        claim_type: scheduled_actions
        grounds:
          - state_machines.BatteryPlatform.ACTIVE_to_SUNSETTING
          - state_machines.BatteryPlatform.SUNSETTING_to_RETIRED
          - errors.ERR_PLATFORM_RETIRED
        distinguishing_aspect: "Clock-driven lifecycle: at 2026-10-15 (past sunset_announce_date, before sunset_date) pack creation still succeeds (SUNSETTING is advisory); at 2026-12-01 (sunset_date reached) the platform is RETIRED and the identical create fails with ERR_PLATFORM_RETIRED."
        test_recipe:
          setup: ["Platform with sunset_announce_date 2026-10-01 and sunset_date 2026-12-01. Logical clock starts at the 2026-09-01 default."]
          setup_api_calls:
            - *k_clock
            - call: "POST /battery-ecosystem/battery-platforms"
              payload: { code: "MX18", interface_key: "INTERFACE_A", chemistry_family: "LION_NMC", backward_commitment_years: 10, forward_commitment_generations: 2, sunset_announce_date: "2026-10-01T00:00:00Z", sunset_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pf: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-SUN-1", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { pk: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /battery-ecosystem/battery-packs"
              payload: { platform_id: "${pf}", sku: "P-SUN-2", pack_generation: 1, cell_supplier_code: "SAM", cell_format: "C21700", rated_capacity_wh: 100, max_charge_rate_w: 200, replacement_price_cents: 20000, warranty_days: 720, free_replacement_days: 90 }
              as: ProductEngineer
              as_user_id: "pe-ana"
              captures: { err: $.data.error_id }
          assert:
            - "during SUNSETTING the pack create succeeds: BatteryPack.${pk} exists"
            - "at sunset_date the platform is RETIRED and the identical create fails with error_id ERR_PLATFORM_RETIRED"
            - "the transition is clock-driven: no platform mutation endpoint was called between the two attempts"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: adjudicate_response_shows_computed_fields_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/battery-ecosystem/warranty-claims/{id}/adjudicate
        distinguishing_aspect: "Immediate consistency: the adjudicate response itself carries the freshly computed age_days, coverage and credit_cents (92 / PRORATED / 16660) — no re-read or settle delay is needed to observe the calculation."
        test_recipe:
          setup: ["Logical clock 2026-09-01. CERTIFIED pack (price 20000, warranty 720d, free 90d); center; account with a battery asset manufactured 2026-06-01."]
          setup_api_calls:
            - *k_clock
            - *k_platform
            - *k_pack_design
            - *k_submit_pack
            - *k_certify_pack
            - *k_center_a
            - *k_account_std
            - call: "POST /battery-ecosystem/tracked-assets"
              payload: { account_id: "${ac}", subject_type: "BATTERY", battery_pack_id: "${pk}", serial_number: "SN-IMM-1", manufactured_at: "2026-06-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { a1: $.data.id }
            - call: "POST /battery-ecosystem/warranty-claims"
              payload: { tracked_asset_id: "${a1}", claim_type: "BATTERY_REPLACEMENT", fault_code: "F1", service_date: "2026-09-10" }
              as: AccountManager
              as_user_id: "${ac}"
              captures: { c1: $.data.id, c1_center: $.data.service_center_id }
          trigger:
            - call: "POST /battery-ecosystem/warranty-claims/${c1}/adjudicate"
              payload: { decision: "APPROVED" }
              as: ServiceAgent
              as_user_id: "${c1_center}"
          assert:
            - "the adjudicate response body itself shows adjudication_status == APPROVED, age_basis == MANUFACTURE, age_days == 92, coverage == PRORATED, credit_cents == 16660"
            - "the same response shows fulfillment_status == AWAITING_UNIT (cross-dimension side effect visible in the same write)"
