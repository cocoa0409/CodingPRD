# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — car-sharing
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: trip_cost_estimate_vs_final_diverge
        grounds:
          - calculations.estimated_trip_settlement
          - calculations.final_trip_settlement
          - entities.Trip.fields.estimated_total_cents
          - entities.Trip.fields.final_total_cents
          - state_machines.Trip.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: "Same Trip inputs, two algorithms on the Trip cost domain: estimate assumes on-time/no-overage (80500) while final adds actual mileage+fuel fees (100500), so final_total_cents != estimated_total_cents."
        test_recipe:
          setup:
            - "Verified guest, STANDARD plan (premium 2500/night, host_pct 0.8), LISTED vehicle (base 10000, mileage_limit 200), CONFIRMED 7-night trip checked in at odometer 10000, fuel 100%, clock at on-time return window."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host A", email: "ha@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest A", email: "ga@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-1", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 11600, fuel_level_pct: 80, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
          assert:
            - "Trip.${trip_id}.estimated_total_cents == 80500"
            - "Trip.${trip_id}.final_total_cents == 100500"
            - "Trip.${trip_id}.mileage_fee_cents == 10000"
            - "Trip.${trip_id}.fuel_fee_cents == 10000"
            - "Trip.${trip_id}.final_host_earnings_cents == 70400"

      - name: guest_risk_provisional_vs_finalized
        grounds:
          - calculations.driver_risk_score
          - entities.Guest.fields.driver_risk_score
          - entities.Guest.fields.at_fault_claim_count
          - state_machines.Claim.APPROVED_to_SETTLED
        distinguishing_aspect: "On the Guest risk domain (not Trip cost): provisional score at booking is 0 (no prior at-fault claims) while the finalized score after settling this trip's at-fault host claim is 20, so the two variants diverge."
        test_recipe:
          setup:
            - "Guest completed a 7-night trip; host filed a HOST claim for 200000 that is UNDER_REVIEW then APPROVED (settlement computed)."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host B", email: "hb@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest B", email: "gb@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-2", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 10500, fuel_level_pct: 100, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /trips/${trip_id}/complete", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /trips/${trip_id}/claims", payload: { claimant: "HOST", damage_amount_cents: 200000, description: "scratch" }, as: Host, as_user_id: "${host_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /claims/${claim_id}/start-review", payload: {}, as: PlatformAdmin }
            - { call: "POST /claims/${claim_id}/approve", payload: { resolution_note: "ok" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /claims/${claim_id}/settle", payload: {}, as: PlatformAdmin }
          assert:
            - "Guest.${guest_id}.at_fault_claim_count == 1"
            - "Guest.${guest_id}.driver_risk_score == 20"
            - "Guest.${guest_id}.driver_risk_score (provisional at booking, before completion) was 0"

  - rule_id: combinatorial_formula
    instances:
      - name: estimate_discount_rounding_order_sum_first
        grounds:
          - calculations.estimated_trip_settlement
          - entities.Trip.fields.discounted_subtotal_cents
          - entities.Vehicle.fields.weekly_discount_pct
        distinguishing_aspect: "Mode (b) nested rounding order: with base 333/night x 7 nights the scaffold pins sum-then-floor-discount = floor(2331*0.9) = 2097; per-night-then-sum would give 299*7 = 2093, so order changes cents."
        test_recipe:
          setup:
            - "Verified guest, STANDARD plan, LISTED vehicle with base_daily_price_cents=333 and weekly_discount_pct=0.1; booking a 7-night trip."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host C", email: "hc@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest C", email: "gc@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-3", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Honda", model: "Fit", year: 2021, base_daily_price_cents: 333, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 0 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
          trigger:
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          assert:
            - "Trip.${trip_id}.discounted_subtotal_cents == 2097"
            - "Trip.${trip_id}.estimated_total_cents == 19597"
            - "Trip.${trip_id}.estimated_host_earnings_cents == 1677"

      - name: claim_settlement_nested_min_max
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.covered_amount_cents
          - entities.Claim.fields.guest_deductible_cents
          - entities.Claim.fields.uncovered_cents
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Mode (a) formula with 3 inputs and nested min/max: covered=min(200000,1500000)=200000, guest_deductible=min(100000,200000)=100000, uncovered=max(0,0)=0 — a non-linear interaction distinct from the pricing rounding formula."
        test_recipe:
          setup:
            - "A CHECKED_OUT trip on a STANDARD plan (deductible 100000, coverage 1500000); host filed a claim for 200000 that is UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host D", email: "hd@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest D", email: "gd@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-4", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 10500, fuel_level_pct: 100, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /trips/${trip_id}/claims", payload: { claimant: "HOST", damage_amount_cents: 200000, description: "dent" }, as: Host, as_user_id: "${host_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /claims/${claim_id}/start-review", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /claims/${claim_id}/approve", payload: { resolution_note: "approved" }, as: PlatformAdmin }
          assert:
            - "Claim.${claim_id}.covered_amount_cents == 200000"
            - "Claim.${claim_id}.guest_deductible_cents == 100000"
            - "Claim.${claim_id}.host_recovery_cents == 200000"
            - "Claim.${claim_id}.uncovered_cents == 0"

  - rule_id: non_linear_state_machine
    instances:
      - name: trip_branching_from_requested
        grounds:
          - state_machines.Trip.REQUESTED_to_CONFIRMED
          - state_machines.Trip.REQUESTED_to_DECLINED
          - state_machines.Trip.REQUESTED_to_CANCELLED
        distinguishing_aspect: "Trip branches from REQUESTED to {CONFIRMED, DECLINED, CANCELLED} with divergent side effects: approve credits Host.pending_balance while decline releases the block and leaves pending at 0 — not a linear pipeline."
        test_recipe:
          setup:
            - "REQUESTED 7-night trip (block ACTIVE, booked_night_count 7, host pending 0 since not yet approved)."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host E", email: "he@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest E", email: "ge@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-5", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          trigger:
            - { call: "POST /trips/${trip_id}/decline", payload: {}, as: Host, as_user_id: "${host_id}" }
          assert:
            - "Trip.${trip_id}.status == DECLINED"
            - "AvailabilityBlock for trip_id ${trip_id} has status == RELEASED"
            - "Vehicle.${vehicle_id}.booked_night_count == 0"
            - "Host.${host_id}.pending_balance_cents == 0"

      - name: claim_cyclic_needs_info_loop
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW
        distinguishing_aspect: "Claim revisits UNDER_REVIEW via the NEEDS_INFO <-> UNDER_REVIEW cycle (traversed twice), a genuine loop unavailable to any linear machine."
        test_recipe:
          setup:
            - "A CHECKED_OUT trip with a host claim that has already looped UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW -> NEEDS_INFO once."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host F", email: "hf@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest F", email: "gf@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-6", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 10500, fuel_level_pct: 100, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /trips/${trip_id}/claims", payload: { claimant: "HOST", damage_amount_cents: 200000, description: "bumper" }, as: Host, as_user_id: "${host_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /claims/${claim_id}/start-review", payload: {}, as: PlatformAdmin }
            - { call: "POST /claims/${claim_id}/request-info", payload: {}, as: PlatformAdmin }
            - { call: "POST /claims/${claim_id}/provide-info", payload: { note: "photos" }, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /claims/${claim_id}/request-info", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /claims/${claim_id}/provide-info", payload: { note: "more photos" }, as: Host, as_user_id: "${host_id}" }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW"

  - rule_id: transitive_cascade
    instances:
      - name: extension_approve_cascade_depth3
        grounds:
          - state_machines.Extension.REQUESTED_to_APPROVED
          - calculations.extension_added_earnings
          - entities.Trip.fields.end_date
          - entities.AvailabilityBlock.fields.end_date
          - entities.Host.fields.pending_balance_cents
          - entities.Vehicle.fields.booked_night_count
        distinguishing_aspect: "Depth-3 chain Extension.approve -> Trip.end_date recompute -> BOOKED AvailabilityBlock.end_date grows -> {Vehicle.booked_night_count 7->9, Host.pending_balance 50400->64800}; each link caused by the prior, triggered by extension approval."
        test_recipe:
          setup:
            - "CONFIRMED 7-night trip (host pending 50400, vehicle booked_night_count 7) with a REQUESTED extension to 2026-06-10."
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host G", email: "hg@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest G", email: "gg@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-7", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", daily_mileage_limit: 200, weekly_discount_pct: 0.1, monthly_discount_pct: 0.25, odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /trips/${trip_id}/extensions", payload: { new_end_date: "2026-06-10" }, as: Guest, as_user_id: "${guest_id}", captures: { ext_id: "$.data.id" } }
          trigger:
