              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "T1", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal1_id: $.data.id }
            - call: "POST /casting/talents"
              payload: { full_name: "T2", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal2_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal1_id}", expected_breakdown_version: "${br_v}" }
