    code: 201
    input: [meal_type, served_at, meals_planned, meals_served, unit_cost_cents]
    output: ShelterOperation
    side_effects: ["feeding_line_cost computed and added to feeding_cost_cents", "meals_served_total += meals_served", "increments ShelterOperation.version by 1"]
  - method: POST
    path: "/api/v1/shelter-operations/{id}/health-services"
    description: "Record a health service event delivered at the shelter"
    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 201
    input: [client_id, encounter_type, occurred_at]
    output: ShelterOperation
    side_effects: ["health_service_count += 1 on the shelter", "health_service_count += 1 on the client's ShelterRegistration at this shelter", "increments ShelterOperation.version by 1"]

  # --- Casework / referral / assistance writes ---
  - method: POST
    path: "/api/v1/client-cases"
    description: "Open a recovery case for a client under an operation"
    roles: [NationalHQAdmin, RegionalCoordinator, Caseworker]
    code: 201
    input: [client_id, disaster_relief_operation_id, assigned_caseworker_id]
    output: ClientCase
    side_effects: ["status=INTAKE, eligibility_status=PENDING, recovery_plan_revision=1, entitlement_cents computed"]
  - method: POST
    path: "/api/v1/client-cases/{id}/verify-eligibility"
    description: "Move a case into eligibility review, or reopen a CLOSED case"
    roles: [Caseworker]
    code: 200
    input: [eligibility_status]
    output: ClientCase
    side_effects: ["status=ELIGIBILITY_REVIEW when the case was INTAKE; status=REOPENED and eligibility_status=PENDING when the case was CLOSED", "eligibility_status and eligibility_verified_by_user_id set from the payload", "entitlement_cents recomputed", "increments ClientCase.version by 1"]
  - method: POST
    path: "/api/v1/client-cases/{id}/recovery-plans"
    description: "Write a recovery plan revision, superseding the prior revision"
    roles: [Caseworker]
    code: 201
    input: [expected_client_case_version, recovery_plan_summary]
    output: ClientCase
    side_effects: ["recovery_plan_revision += 1 when the case was already in RECOVERY_PLANNING or REOPENED, else set to 1", "status=RECOVERY_PLANNING", "entitlement_cents recomputed", "increments ClientCase.version by 1"]
  - method: POST
    path: "/api/v1/client-cases/{id}/referrals"
    description: "Raise a referral to a partner agency, running the duplication-of-benefits check"
    roles: [Caseworker]
    code: 201
    input: [agency_code, assistance_type, estimated_value_cents]
    output: Referral
    side_effects: ["status=SUBMITTED", "duplication_check_result set to CLEAR or PARTIAL_OVERLAP", "ClientCase.status=REFERRED", "increments ClientCase.version by 1"]
  - method: POST
    path: "/api/v1/referrals/{id}/resolve"
    description: "Resolve a referral: ACCEPT, DECLINE, REQUEST_INFORMATION, COMPLETE or CANCEL"
    roles: [Caseworker]
    code: 200
    input: [decision]
    output: Referral
    side_effects: ["status moves per the Referral state machine", "ClientCase.status recomputed (REFERRED -> MONITORING when no Referral of the case remains SUBMITTED or ACCEPTED)", "case_closure_eligible_at recomputed", "increments Referral.version by 1"]
  - method: POST
    path: "/api/v1/client-cases/{id}/assistance-requests"
    description: "Submit an immediate assistance request against a donor fund pool"
    roles: [Caseworker, FinanceOfficer]
    code: 201
    input: [fund_pool_id, assistance_type, requested_amount_cents]
    output: AssistanceRequest
    side_effects: ["status=SUBMITTED, card_status=NOT_ISSUED", "duplication_of_benefits_offset computed into duplication_offset_cents and approved_amount_cents"]
  - method: POST
    path: "/api/v1/assistance-requests/{id}/approve"
    description: "Verify eligibility then approve the award against the donor pool"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["status=ELIGIBILITY_VERIFIED on the first call, APPROVED or DENIED on the second", "approved_by_user_id stamped from X-User-ID", "restricted_fund_balance recomputed (FundPool.committed_cents, remaining_cents, DisasterReliefOperation.restricted_fund_balance_cents)", "increments AssistanceRequest.version by 1"]
  - method: POST
    path: "/api/v1/assistance-requests/{id}/issue-card"
    description: "Issue the financial assistance card for an approved award"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["card_number_masked generated, card_status=ISSUED, issued_by_user_id stamped from X-User-ID", "redemption_window computed into redemption_deadline_at", "status=CARD_ISSUED", "restricted_fund_balance recomputed", "increments AssistanceRequest.version by 1"]
  - method: POST
    path: "/api/v1/assistance-requests/{id}/redeem-card"
    description: "Redeem an issued card, disbursing the award and booking the assistance cost"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["card_status=REDEEMED, status=DISBURSED", "a CostLedgerEntry with cost_category=FINANCIAL_ASSISTANCE, entry_type=CHARGE and amount_cents=approved_amount_cents is appended", "restricted_fund_balance recomputed", "case_closure_eligible_at recomputed", "increments AssistanceRequest.version by 1"]
  - method: POST
    path: "/api/v1/assistance-requests/{id}/reverse"
    description: "Reverse a disbursed award; the compensating entry must restore the pool balance exactly"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AssistanceRequest
    side_effects: ["status=REVERSED, card_status=VOIDED", "CASCADE (depth 3): FundPool.disbursed_cents recomputed, then FundPool.remaining_cents recomputed, then DisasterReliefOperation.restricted_fund_balance_cents recomputed and a CostLedgerEntry with entry_type=REVERSAL and amount_cents=approved_amount_cents appended", "increments AssistanceRequest.version by 1"]
  - method: POST
    path: "/api/v1/fund-pools"
    description: "Create a donor-restricted fund pool"
    roles: [NationalHQAdmin, FinanceOfficer]
    code: 201
    input: [fund_code, restriction_type, "region_id?", total_received_cents]
    output: FundPool
    side_effects: ["committed_cents=0, disbursed_cents=0, remaining_cents=total_received_cents"]
  - method: POST
    path: "/api/v1/disaster-relief-operations/{id}/cost-ledger-entries"
    description: "Book a cost or reversal entry against the operation's ledger"
    roles: [NationalHQAdmin, FinanceOfficer]
    code: 201
    input: [expected_disaster_relief_operation_version, fund_pool_id, cost_category, amount_cents, entry_type, incurred_at]
    output: CostLedgerEntry
    side_effects: ["restricted_fund_balance recomputed", "increments DisasterReliefOperation.version by 1"]

  # --- Blood collection writes ---
  - method: POST
    path: "/api/v1/blood-drives"
    description: "Schedule a blood drive; the collection window must not collide with another non-cancelled drive at the same site"
    roles: [NationalHQAdmin, BloodServicesCoordinator]
    code: 201
    input: [region_id, site_name, scheduled_start_at, scheduled_end_at, target_units]
    output: BloodDrive
    side_effects: ["status=PLANNED, collected_units=0, usable_units=0"]
  - method: POST
    path: "/api/v1/blood-drives/{id}/collections"
    description: "Record units collected during an active drive"
    roles: [NationalHQAdmin, BloodServicesCoordinator]
    code: 200
    input: [units]
    output: BloodDrive
    side_effects: ["collected_units += units (rejected when it would exceed target_units)", "usable_units recomputed as collected_units - floor(collected_units * DEFERRAL_LOSS_BPS / 10000)", "increments BloodDrive.version by 1"]
  - method: POST
    path: "/api/v1/blood-drives/{id}/cancel"
    description: "Cancel a planned or active drive"
    roles: [NationalHQAdmin, BloodServicesCoordinator]
    code: 200
    input: []
    output: BloodDrive
    side_effects: ["status=CANCELLED", "blood_continuity_index and blood_continuity_status recomputed for the region", "increments BloodDrive.version by 1"]

  # --- Test-driving endpoint ---
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock never falls back to wall-clock time; every deadline, expiry, grace period and trailing window in this scaffold is evaluated against this clock."
    roles: [NationalHQAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ to_iso8601: string }"
    side_effects: ["every clock-driven automatic transition is evaluated on the next read or write: VolunteerDeployment APPROVED -> IN_TRANSIT -> ARRIVED, ShiftAssignment SCHEDULED -> NO_SHOW and CHECKED_IN -> COMPLETED, BloodDrive PLANNED -> ACTIVE -> COMPLETED, ShelterSite -> EXPIRED, Volunteer ACTIVE -> EXPIRED, ClientCase MONITORING -> CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-Role or X-User-ID header absent or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required input field is missing, an undeclared field is supplied, or a field value has the wrong type" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed in the endpoint's roles" }

  - { id: ERR_REGION_NOT_FOUND, http: 404, condition: "regionId or a region_id body field does not resolve" }
  - { id: ERR_OPERATION_NOT_FOUND, http: 404, condition: "operationId or a disaster_relief_operation_id body field does not resolve" }
  - { id: ERR_SHELTER_SITE_NOT_FOUND, http: 404, condition: "shelterSiteId or a shelter_site_id body field does not resolve" }
  - { id: ERR_SHELTER_OPERATION_NOT_FOUND, http: 404, condition: "shelterOperationId or a shelter_operation_id body field does not resolve" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteerId or a volunteer_id body field does not resolve" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "deploymentId or a volunteer_deployment_id body field does not resolve" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "clientId or a client_id body field does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "caseId or a client_case_id body field does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referralId does not resolve" }
  - { id: ERR_FUND_POOL_NOT_FOUND, http: 404, condition: "fundPoolId or a fund_pool_id body field does not resolve" }
  - { id: ERR_BLOOD_DRIVE_NOT_FOUND, http: 404, condition: "bloodDriveId does not resolve" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "the resource is not in a state that admits the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "the resource is in a terminal state and rejects every further transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the submitted expected_<parent>_version does not equal the parent entity's current version" }
  - { id: ERR_CARD_ALREADY_ISSUED, http: 409, condition: "issue-card is called on an assistance request whose card_status is not NOT_ISSUED" }
  - { id: ERR_SHELTER_RESTRICTED, http: 409, condition: "a ShelterRegistration is attempted at a shelter whose posture is RESTRICTED" }

  - { id: ERR_VOLUNTEER_NOT_CREDENTIALED, http: 409, condition: "Volunteer.credential_status is not ACTIVE, or deployment_availability is not AVAILABLE, or role_code is not in qualified_role_codes" }
  - { id: ERR_SITE_NOT_APPROVED, http: 409, condition: "ShelterSite.agreement_status is not APPROVED when a shelter is opened" }
  - { id: ERR_INSPECTION_STALE, http: 409, condition: "the latest ShelterSite inspection is older than 365 days at the logical clock" }
  - { id: ERR_FUNCTIONAL_NEEDS_UNSUPPORTED, http: 409, condition: "a registration with functional_needs_flag true targets a site whose functional_needs_support is false" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "the same X-User-ID attempts both halves of a segregation-of-duties pair (approve then issue a card, or verify then release a reunification)" }

  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "the volunteer already holds a non-cancelled shift whose [shift_start_at, shift_end_at) interval intersects the requested one" }
  - { id: ERR_BED_OCCUPANCY_CONFLICT, http: 409, condition: "the requested dormitory bed code is held by a REGISTERED occupant, or its previous occupancy ended inside the 120-minute turnover buffer" }
  - { id: ERR_BLOOD_DRIVE_WINDOW_OVERLAP, http: 409, condition: "the requested blood drive window intersects another non-cancelled drive at the same site_name" }

  - { id: ERR_DUPLICATE_INCIDENT_CODE, http: 409, condition: "a DisasterReliefOperation with the same incident_code already exists" }
  - { id: ERR_DUPLICATE_FUND_CODE, http: 409, condition: "a FundPool with the same fund_code already exists" }
  - { id: ERR_ROTATION_TOO_LONG, http: 422, condition: "rotation_days is greater than 21" }
  - { id: ERR_ANNUAL_ROTATION_CAP, http: 422, condition: "Volunteer.rotation_days_used_ytd + rotation_days exceeds 40" }
  - { id: ERR_MAX_SHIFTS_EXCEEDED, http: 409, condition: "the parent deployment already holds 3 non-terminal shift assignments" }

  - { id: ERR_AGENCY_NOT_AUTHORIZED, http: 409, condition: "referral agency_code does not appear in the client's Region.authorized_agency_codes" }
  - { id: ERR_REGION_MISMATCH, http: 409, condition: "the ShelterSite region does not match the DisasterReliefOperation region it is activated for" }
  - { id: ERR_DEPLOYMENT_SHELTER_MISMATCH, http: 409, condition: "the deployment shelter_operation_id belongs to a different DisasterReliefOperation than the deployment disaster_relief_operation_id" }
  - { id: ERR_DUPLICATION_BLOCKED, http: 409, condition: "a non-cancelled Referral of the same agency_code and assistance_type already exists for the case" }

  - { id: ERR_ASSISTANCE_BELOW_MINIMUM, http: 409, condition: "0 < approved_amount_cents < MIN_ASSISTANCE_CENTS (5000)" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 409, condition: "approved_amount_cents is greater than FundPool.remaining_cents" }
  - { id: ERR_POOL_RESTRICTION_MISMATCH, http: 409, condition: "FundPool.restriction_type is incompatible with the assistance_type or with the client's region" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "occupied_beds would reach ShelterSite.capacity_verified_beds" }
  - { id: ERR_NO_BED_AVAILABLE, http: 409, condition: "the dormitory bed selector finds no eligible bed code" }
  - { id: ERR_NO_ELIGIBLE_VOLUNTEER, http: 409, condition: "the deployment candidate selector returns an empty pool" }
  - { id: ERR_COLLECTION_TARGET_EXCEEDED, http: 409, condition: "collected_units + units would exceed BloodDrive.target_units" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: NationalHQAdmin
    description: "National headquarters operator: system configuration, regions, fund pools, logical clock and override authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/regions"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "POST /api/v1/disaster-relief-operations"
      - "POST /api/v1/shelter-sites"
      - "POST /api/v1/volunteers"
      - "POST /api/v1/fund-pools"
      - "POST /api/v1/blood-drives"
  - name: RegionalCoordinator
    description: "Regional disaster coordinator: opens and closes shelters, approves and recalls deployments, inspects sites"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/disaster-relief-operations/{id}/advance-phase"
      - "POST /api/v1/shelter-operations/{id}/open"
      - "POST /api/v1/shelter-operations/{id}/close"
      - "POST /api/v1/volunteer-deployments/{id}/approve"
      - "POST /api/v1/volunteer-deployments/{id}/recall"
    shared_operations:
      - "POST /api/v1/shelter-sites/{id}/inspections"
      - "POST /api/v1/shelter-operations"
      - "POST /api/v1/shift-assignments"
      - "POST /api/v1/shelter-operations/{id}/registrations"
  - name: ShelterManager
    description: "Volunteer leading a shelter: registration, dormitory, feeding, health services and reunification release"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/v1/shelter-registrations/{id}/check-out"
      - "POST /api/v1/shelter-operations/{id}/feeding-services"
      - "POST /api/v1/shelter-operations/{id}/health-services"
    shared_operations:
      - "POST /api/v1/clients"
      - "POST /api/v1/shift-assignments"
      - "POST /api/v1/shelter-operations/{id}/registrations"
  - name: Volunteer
    description: "Deployed volunteer: checks into shifts and ends their own rotation"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /api/v1/shift-assignments/{id}/check-in"
      - "POST /api/v1/volunteer-deployments/{id}/end-rotation"
    shared_operations: []
  - name: Caseworker
    description: "Recovery caseworker: eligibility verification, recovery planning, referrals and assistance submission"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/client-cases/{id}/verify-eligibility"
      - "POST /api/v1/client-cases/{id}/recovery-plans"
      - "POST /api/v1/client-cases/{id}/referrals"
      - "POST /api/v1/referrals/{id}/resolve"
    shared_operations:
      - "POST /api/v1/client-cases"
      - "POST /api/v1/client-cases/{id}/assistance-requests"
  - name: FinanceOfficer
    description: "Disbursing officer: approves awards, issues and redeems cards, books cost ledger entries"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/assistance-requests/{id}/approve"
      - "POST /api/v1/assistance-requests/{id}/issue-card"
      - "POST /api/v1/assistance-requests/{id}/redeem-card"
      - "POST /api/v1/assistance-requests/{id}/reverse"
      - "POST /api/v1/disaster-relief-operations/{id}/cost-ledger-entries"
    shared_operations:
      - "POST /api/v1/fund-pools"
      - "POST /api/v1/client-cases/{id}/assistance-requests"
  - name: BloodServicesCoordinator
    description: "Blood services operator: schedules drives, records collections and cancels drives"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/blood-drives/{id}/collections"
      - "POST /api/v1/blood-drives/{id}/cancel"
    shared_operations:
      - "POST /api/v1/blood-drives"
  - name: Client
    description: "Disaster client: read-only access to their own record"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "GET /api/v1/clients/{id}"
