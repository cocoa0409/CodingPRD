        captures:
          sweep2: $.data.expired_license_ids
      - call: GET /tlo/licenses/${l1}
        payload: {}
        as: Any
        captures:
          l1_end: $.data.status
      - call: GET /tlo/licenses/${l2}
        payload: {}
        as: Any
        captures:
          l2_end: $.data.status
      assert:
      - 'First sweep: L1 EXECUTED -> ACTIVE (effective passed); L2 remains EXECUTED (effective in the future)'
      - 'Second sweep past both expirations: L1 ACTIVE -> EXPIRED; L2 EXECUTED -> EXPIRED directly (never ACTIVE)'
