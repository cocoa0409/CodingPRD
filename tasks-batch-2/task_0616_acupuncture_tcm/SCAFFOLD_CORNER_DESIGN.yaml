          setup_api_calls:
            - call: "POST /herb-items"
              payload: { herb_name: "Bai Zhu", initial_grams: 500, reorder_threshold_grams: 50 }
              as: Pharmacist
              captures: { h: $.data.id }
            - call: "POST /formulas"
              payload: { formula_name: "F-O2", line_items: [ { herb_item_id: "${h}", grams_per_dose: 10 } ] }
              as: Pharmacist
              captures: { f: $.data.id }
            - call: "POST /practitioners"
              payload: { full_name: "Dr O2", license_number: "LIC-O2" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "O2 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
