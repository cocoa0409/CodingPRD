          - endpoints.POST_/moderation/reviewers/{id}/certifications
          - errors.ERR_POLICY_VERSION_NOT_FOUND
        distinguishing_aspect: "The link endpoint needs both sides to exist: the reviewer in the path resolves, the policy version in the body does not, and the body-FK error is what surfaces — with no version bump on the reviewer."
