            - "the response is not ERR_SHIFT_OVERLAP and not 409, even though 20:00 to 23:00 sits strictly inside the existing 16:00 to 00:00 shift"
            - "the response is not ERR_RECORD_NOT_FOUND, the catalog's 404 for an unknown job_role_id, because the BARTENDER role really exists"
            - "GET /shifts?employee_id=${emp_id} still returns exactly 1 row, the ${first_shift_id} shift"

  - rule_id: boundary_precision_check
    instances:
      - name: side_work_at_exact_twenty_percent_and_thirty_minute_limits_yields_no_overage
        grounds:
          - calculations.side_work_classification
          - calculations.side_work_classification.constants.SIDE_WORK_PCT_LIMIT
          - calculations.side_work_classification.constants.SIDE_WORK_CONTINUOUS_LIMIT_MINUTES
          - entities.Shift.fields.non_tip_credit_minutes
          - entities.Shift.fields.tip_credit_eligible_minutes
          - state_machines.Shift.time_status.OPEN_to_CLOSED
        distinguishing_aspect: >-
          The metric is whole minutes and the boundary is inclusive on both limbs at once:
          floor(0.20 * 480) == 96 minutes of side work and exactly 30 continuous minutes are both
          still lawful, so non_tip_credit_minutes is 0, while 97 and 31 tip over into exactly 1
          minute because the two limbs are combined by max and not by addition. An implementation
          that used a strict comparison, or that added the two excesses, would return 1 on the first
          shift or 2 on the second.
        test_recipe:
          setup:
            - "One Texas location with tip credit claimed and one SERVER job role with side_work_eligible true."
            - "Two employees, each with notice on file, each holding one OPEN 480-minute shift on 2026-08-04; the first records side_work_minutes 96 with max_continuous_side_work_minutes 30, the second records 97 and 31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Edge Under", external_payroll_ref: "B1" }
              as: PayrollAdmin
              captures: { emp_1: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Edge Over", external_payroll_ref: "B2" }
              as: PayrollAdmin
              captures: { emp_2: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_1}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_2}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_1}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 96, max_continuous_side_work_minutes: 30 }
              as: PayrollPreparer
              captures: { shift_1: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_2}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", side_work_minutes: 97, max_continuous_side_work_minutes: 31 }
              as: PayrollPreparer
              captures: { shift_2: $.data.id }
          trigger:
