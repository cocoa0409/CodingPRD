              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 250.0, packaging_tare_kg: 50.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
