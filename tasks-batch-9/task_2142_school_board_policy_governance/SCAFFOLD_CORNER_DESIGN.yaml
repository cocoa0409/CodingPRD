              as: BoardClerk
              captures: { m: $.data.id, m_v: $.data.version }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "POLICY_FIRST_READING", title: "First reading BP-4119", expected_meeting_version: "${m_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
