      - name: occ_stale_expected_linen_item_version_on_dispatch_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[laundry-dispatch-stale-linen-item]
          - errors[ERR_STALE_LINEN_VERSION]
          - endpoints[POST /housekeeping/linen-items/{id}/soil]
        distinguishing_aspect: "The soil call is what advanced LinenItem.version, so a dispatch that is otherwise fully fundable - 6 sets out of a soiled queue of 8, well under a 300-set plant capacity - is still refused with ERR_STALE_LINEN_VERSION (412)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type and one room; a SHEET_SET linen line of 20 sets at version 1."
            - "A soil of 8 sets moves the queue and advances the linen item to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
