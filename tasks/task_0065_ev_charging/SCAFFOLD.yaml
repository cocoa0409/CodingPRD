scenario: |
  New energy vehicle charging operation: charging pile management with pile ledger (pile ID/model/power/connector type),
  pile-status (idle/in-use/fault/offline) monitoring, firmware version tracking, location-coordinate and station-affiliation,
  and pile on-shelf and off-shelf workflow; reservation and queuing with available-pile query, reservation hold time,
  no-show penalty, on-site queuing for unreserved arrivals, queue-position tracking, and queue-jumping prevention;
  charging session (timing/metering) with session-start authentication (app/RFID/plug-and-charge), real-time power and
  energy metering, charging-curve recording, abnormal-event marking (over-temperature/communication-loss), session-end
  settlement, and session-record archiving; tiered electricity pricing with time-of-use pricing (peak/flat/valley),
  service-fee separate from electricity fee, special-discount activities, member-tier pricing, and pricing-version
  effective-date control; fault reporting with user-reported fault, automatic fault detection, fault-pile isolation,
  repair-ticket dispatch, repair record, and post-repair acceptance; operator settlement with multi-operator interconnection
  (roaming) settlement, station-owner revenue share, platform service fee, refund-induced reversal, tax handling, and
  periodic payout; event-driven synchronization with payment, mapping, and grid systems; audit logging for billing
  adjustments and fault events.

domain_name: "ev-charging-operations"
api_prefix: "/stations"

complexity_profile:
  primary_archetype: "pricing_engine"
  secondary_archetype: "quota_allocation"
  complexity_layers:
    - "dual_variant_calculation"      # session settlement vs operator settlement reversal
    - "cascading_side_effects"        # fault -> isolate pile -> cancel reservations -> promote queue
    - "rate_threshold_triggers"       # ToU peak/flat/valley boundary edges
    - "scheduled_deferred_actions"    # reservation hold timer + periodic payout

  entity_topology: "hybrid"
  state_machine_shape: "branching"   # branching with revert + parallel dimensions on pile
  relationship_patterns:
    - one_to_many                    # Station -> Pile -> Session
    - many_to_many                   # Member <-> Operator via PricingPlan (roaming)
    - cross_aggregate                # Session references PricingVersion across aggregate
  role_model: "peer_roles"           # PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService
  consistency_model: "immediate"

# =============================================================================
# 1.0 Response Envelope (FIXED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Operator legal/display name"
        constraints: "1..120 chars; globally unique"
      - name: role_kind
        type: enum
        source: input
        description: "Operator function — platform-level vs site owner"
        constraints: "values: PLATFORM, STATION_OWNER, ROAMING_PARTNER"
      - name: tax_id
        type: string
        source: input
        description: "Jurisdictional tax id"
        constraints: "1..40 chars"

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Station display name"
        constraints: "1..120 chars; unique within operator_id"
      - name: operator_id
        type: string
        source: input
        description: "Foreign key to Operator (the running operator brand for this station)"
      - name: station_owner_id
        type: string
        source: input
        description: "Foreign key to Operator that owns the physical site (may differ from operator_id for roaming)"
      - name: latitude
        type: number
        source: input
        description: "WGS84 latitude in decimal degrees"
        constraints: "-90.0 <= latitude <= 90.0; max 6 fractional digits"
      - name: longitude
        type: number
        source: input
        description: "WGS84 longitude in decimal degrees"
        constraints: "-180.0 <= longitude <= 180.0; max 6 fractional digits"
      - name: revenue_share_bps
        type: integer
        source: input
        description: "Station owner's revenue share in basis points of net service fee (0..10000)"
        constraints: "0 <= revenue_share_bps <= 10000"
      - name: status
        type: enum
        source: computed
        description: "Aggregate posture of station"
        constraints: "values: ACTIVE, SUSPENDED"
        default: "ACTIVE"

  - name: Pile
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "Foreign key to Station"
      - name: model_code
        type: string
        source: input
        description: "Manufacturer model code"
        constraints: "1..64 chars"
      - name: rated_power_kw
        type: number
        source: input
        description: "Rated output power in kW"
        constraints: "0 < rated_power_kw <= 360.0; max 1 fractional digit"
      - name: connector_type
        type: enum
        source: input
        description: "Physical connector"
        constraints: "values: GBT_DC, GBT_AC, CCS2, CHADEMO"
      - name: firmware_version
        type: string
        source: input
        description: "Semver-style firmware version e.g. 1.4.2"
        constraints: "MAJOR.MINOR.PATCH, integers"
      - name: lifecycle_state
        type: enum
        source: computed
        description: "Shelf state independent of operational state"
        constraints: "values: OFF_SHELF, ON_SHELF, DECOMMISSIONED"
        default: "OFF_SHELF"
      - name: operational_state
        type: enum
        source: computed
        description: "Real-time operational state, valid only when lifecycle_state == ON_SHELF"
        constraints: "values: IDLE, IN_USE, FAULT, OFFLINE; null when OFF_SHELF or DECOMMISSIONED"
        default: null
      - name: last_heartbeat_at
        type: datetime
        source: system
        description: "Last heartbeat ISO 8601 UTC"
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "User display name"
        constraints: "1..80 chars"
      - name: home_operator_id
        type: string
        source: input
        description: "Operator the member registered with"
      - name: tier
        type: enum
        source: input
        description: "Membership tier"
        constraints: "values: BASIC, SILVER, GOLD, PLATINUM"
        default: "BASIC"
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Rolling count of no-shows used to gate future reservations"
        constraints: ">= 0"
        default: 0
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: "Prepaid wallet in integer cents"
        constraints: ">= 0"
        default: 0

  - name: PricingVersion
    parent: null
    common_fields: false       # immutable pricing snapshot (append-only)
    fields:
      - name: operator_id
        type: string
        source: input
        description: "Operator owning this pricing version"
      - name: version_label
        type: string
        source: input
        description: "Human-readable label e.g. 2026-Q2"
        constraints: "1..40 chars; unique within operator_id"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive ISO 8601 UTC start"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive ISO 8601 UTC end; must be > effective_from"
      - name: peak_rate_per_kwh_cents
        type: integer
        source: input
        description: "Peak electricity rate in integer cents per kWh"
        constraints: "> 0"
      - name: flat_rate_per_kwh_cents
        type: integer
        source: input
        description: "Flat electricity rate in integer cents per kWh"
        constraints: "> 0"
      - name: valley_rate_per_kwh_cents
        type: integer
        source: input
        description: "Valley electricity rate in integer cents per kWh"
        constraints: "> 0"
      - name: service_fee_per_kwh_cents
        type: integer
        source: input
        description: "Base service fee in integer cents per kWh, before discounts"
        constraints: ">= 0"
      - name: tax_bps
        type: integer
        source: input
        description: "Applied tax rate in basis points (e.g., 1300 = 13%)"
        constraints: "0 <= tax_bps <= 5000"
      - name: peak_windows
        type: array
        source: input
        description: "List of {start_hhmm, end_hhmm} half-open intervals defining peak hours in local time of station"
        constraints: "0..6 entries; start_hhmm < end_hhmm within same calendar day; no overlap among peak/valley windows"
      - name: valley_windows
        type: array
        source: input
        description: "List of {start_hhmm, end_hhmm} half-open intervals defining valley hours"
        constraints: "0..6 entries; non-overlapping with peak_windows"
      - name: tier_service_fee_discount_bps
        type: object
        source: input
        description: "Map from member tier to service-fee discount in basis points e.g. {BASIC:0, SILVER:500, GOLD:1000, PLATINUM:1500}"
        constraints: "keys are member tiers; values 0..5000"

  - name: PromoActivity
    parent: null
    common_fields: false
    fields:
      - name: operator_id
        type: string
        source: input
        description: "Operator running the promo"
      - name: name
        type: string
        source: input
        description: "Promo display name"
        constraints: "1..80 chars"
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive ISO 8601 UTC start"
      - name: ends_at
        type: datetime
        source: input
        description: "Exclusive ISO 8601 UTC end; must be > starts_at"
      - name: service_fee_discount_bps
        type: integer
        source: input
        description: "Discount applied on TOP of tier discount, in basis points"
        constraints: "0 <= value <= 5000"
      - name: applies_to_tiers
        type: array
        source: input
        description: "List of tiers eligible for this promo"
        constraints: "subset of {BASIC, SILVER, GOLD, PLATINUM}; at least one entry"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: pile_id
        type: string
        source: input
        description: "Targeted pile"
      - name: member_id
        type: string
        source: input
        description: "Reserving member"
      - name: hold_expires_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC; = created_at + 15 minutes"
      - name: status
        type: enum
        source: computed
        description: "Reservation lifecycle"
        constraints: "values: HELD, ACTIVATED, EXPIRED, CANCELLED"
        default: "HELD"
      - name: no_show_penalty_cents
        type: integer
        source: computed
        description: "Penalty applied on EXPIRED state; set during expiry sweep"
        default: 0

  - name: QueueEntry
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "Station the member walked up to"
      - name: member_id
        type: string
        source: input
        description: "Queueing member"
      - name: position
        type: integer
        source: computed
        description: "1-based position; recomputed on join, leave, promote"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Queue lifecycle"
        constraints: "values: WAITING, PROMOTED, ABANDONED"
        default: "WAITING"
      - name: enqueued_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; tie-break key for queue ordering"

  - name: ChargingSession
    parent: Pile
    common_fields: true
    fields:
      - name: pile_id
        type: string
        source: input
        description: "Pile delivering the session"
      - name: member_id
        type: string
        source: input
        description: "Member being authenticated"
      - name: reservation_id
        type: string
        source: input
        description: "Optional reservation that gated this session; null when started from queue"
        default: null
      - name: pricing_version_id
        type: string
        source: computed
        description: "Pinned PricingVersion at session start (version-pinning on approval)"
      - name: promo_activity_id
        type: string
        source: computed
        description: "Pinned promo (nullable) at session start"
        default: null
      - name: auth_method
        type: enum
        source: input
        description: "Authentication channel"
        constraints: "values: APP, RFID, PLUG_AND_CHARGE"
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle"
        constraints: "values: PENDING_AUTH, CHARGING, SETTLING, SETTLED, ABORTED"
        default: "PENDING_AUTH"
      - name: started_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; set on PENDING_AUTH -> CHARGING"
        default: null
      - name: ended_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; set on terminal entry"
        default: null
      - name: peak_kwh_milli
        type: integer
        source: computed
        description: "Energy delivered during peak window in milli-kWh (1 kWh = 1000)"
        default: 0
      - name: flat_kwh_milli
        type: integer
        source: computed
        description: "Energy delivered during flat window in milli-kWh"
        default: 0
      - name: valley_kwh_milli
        type: integer
        source: computed
        description: "Energy delivered during valley window in milli-kWh"
        default: 0
      - name: abnormal_events
        type: array
        source: computed
        description: "Append-only list of {type, at} events; types: OVER_TEMPERATURE, COMMUNICATION_LOSS"
        default: []
      - name: electricity_fee_cents
        type: integer
        source: computed
        description: "Pre-tax electricity portion in integer cents; set on settlement"
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Pre-tax service portion in integer cents; set on settlement"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax in integer cents; set on settlement"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "Final total charged to member in integer cents"
        default: 0

  - name: ChargingCurvePoint
    parent: ChargingSession
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: "Owning session"
      - name: sampled_at
        type: datetime
        source: input
        description: "Sample timestamp ISO 8601 UTC; strictly increasing per session"
      - name: instant_power_kw
        type: number
        source: input
        description: "Instantaneous power in kW at this sample"
        constraints: ">= 0; max 2 fractional digits"
      - name: cumulative_energy_milli
        type: integer
        source: input
        description: "Cumulative energy at this sample in milli-kWh; monotonically non-decreasing"
        constraints: ">= 0"
      - name: window_tag
        type: enum
        source: input
        description: "ToU window the sample belongs to per session.pricing_version_id"
        constraints: "values: PEAK, FLAT, VALLEY"

  - name: FaultReport
    parent: Pile
    common_fields: true
    fields:
      - name: pile_id
        type: string
        source: input
        description: "Affected pile"
      - name: reporter_kind
        type: enum
        source: input
        description: "Origin"
        constraints: "values: USER, AUTO_DETECT"
      - name: reporter_member_id
        type: string
        source: input
        description: "Required only when reporter_kind=USER"
        default: null
      - name: symptom_code
        type: string
        source: input
        description: "Free-text symptom code"
        constraints: "1..40 chars"
      - name: severity
        type: enum
        source: input
        description: "Severity classification"
        constraints: "values: MINOR, MAJOR, CRITICAL"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle"
        constraints: "values: OPEN, ISOLATED, RESOLVED"
        default: "OPEN"

  - name: RepairTicket
    parent: FaultReport
    common_fields: true
    fields:
      - name: fault_report_id
        type: string
        source: input
        description: "Owning fault"
      - name: assigned_technician_id
        type: string
        source: input
        description: "Field technician opaque id"
      - name: dispatched_at
        type: datetime
        source: system
        description: "ISO 8601 UTC set on dispatch"
        default: null
      - name: repair_notes
        type: string
        source: input
        description: "Notes recorded by technician on completion"
        constraints: "0..1000 chars"
        default: ""
      - name: status
        type: enum
        source: computed
        description: "Ticket lifecycle"
        constraints: "values: OPEN, DISPATCHED, IN_REPAIR, AWAITING_ACCEPTANCE, CLOSED, REJECTED"
        default: "OPEN"

  - name: SettlementLedgerEntry
    parent: null
    common_fields: false       # append-only ledger
    fields:
      - name: session_id
        type: string
        source: input
        description: "Source session"
      - name: operator_id
        type: string
        source: input
        description: "Recipient operator (may be roaming partner)"
      - name: counterparty_kind
        type: enum
        source: input
        description: "Which leg of settlement"
        constraints: "values: STATION_OWNER_SHARE, PLATFORM_SERVICE_FEE, ROAMING_PARTNER, TAX_AUTHORITY"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount; positive for accrual, negative for reversal"
      - name: tax_cents
        type: integer
        source: computed
        description: "Tax associated with this leg in integer cents"
        default: 0
      - name: reason
        type: enum
        source: input
        description: "Why this entry exists"
        constraints: "values: SESSION_SETTLE, REFUND_REVERSAL, PAYOUT, NO_SHOW_PENALTY"

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: "Recipient operator"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive ISO 8601 UTC start of payout period"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive ISO 8601 UTC end of payout period; must be > period_start"
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of positive SettlementLedgerEntry.amount_cents for operator in window"
        default: 0
      - name: reversal_cents
        type: integer
        source: computed
        description: "Sum of |negative| SettlementLedgerEntry.amount_cents (REFUND_REVERSAL) for operator in window"
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents - reversal_cents"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Payout lifecycle"
        constraints: "values: PENDING, ISSUED, REVERSED"
        default: "PENDING"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: "Role from X-User-Role at the time of the action"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID at the time of the action"
      - name: entity_kind
        type: string
        source: system
        description: "Affected entity name (e.g., ChargingSession, FaultReport)"
      - name: entity_id
        type: string
        source: system
        description: "Affected entity id"
      - name: event_kind
        type: enum
        source: system
        description: "Why audited"
        constraints: "values: BILLING_ADJUSTMENT, FAULT_EVENT"
      - name: payload
        type: object
        source: system
        description: "Before/after snapshot of relevant fields"
      - name: occurred_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of the audit event"

  - name: ExternalEventInbox
    parent: null
    common_fields: false
    fields:
      - name: source_system
        type: enum
        source: input
        description: "Origin external system"
        constraints: "values: PAYMENT, MAPPING, GRID"
      - name: event_type
        type: string
        source: input
        description: "Event identifier e.g. payment.refunded, mapping.location.synced, grid.tariff.alert"
        constraints: "1..80 chars"
      - name: payload
        type: object
        source: input
        description: "Event-specific JSON payload"
      - name: processed
        type: boolean
        source: computed
        description: "Set to true after dispatcher applies side-effects"
        default: false
      - name: received_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of ingest"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------ Pile (parallel dimensions: lifecycle + operational) ------------------
  - entity: Pile
    initial_state: "lifecycle=OFF_SHELF, operational=null"
    terminal_states: ["lifecycle=DECOMMISSIONED, operational=null"]
    transitions:
      - from: "lifecycle=OFF_SHELF"
        to: "lifecycle=ON_SHELF, operational=IDLE"
        trigger: "POST /piles/{id}/shelve"
        actor: "StationOwner"
        preconditions:
          - "Pile.lifecycle_state == OFF_SHELF"
          - "Pile.firmware_version matches MAJOR.MINOR.PATCH"
          - "parent Station.status == ACTIVE"
        side_effects:
          - "operational_state set to IDLE"
      - from: "lifecycle=ON_SHELF, operational IN {IDLE,IN_USE,FAULT,OFFLINE}"
        to: "lifecycle=OFF_SHELF, operational=null"
        trigger: "POST /piles/{id}/off-shelve"
        actor: "StationOwner"
        preconditions:
          - "Pile.lifecycle_state == ON_SHELF"
          - "no ChargingSession on pile with status IN {PENDING_AUTH, CHARGING, SETTLING}"
          - "no Reservation on pile with status == HELD"
        side_effects:
          - "operational_state cleared to null"
      - from: "lifecycle=OFF_SHELF"
        to: "lifecycle=DECOMMISSIONED"
        trigger: "POST /piles/{id}/decommission"
        actor: "PlatformOperator"
        preconditions:
          - "Pile.lifecycle_state == OFF_SHELF"
        side_effects: []
      - from: "operational=IDLE"
        to: "operational=IN_USE"
        trigger: "POST /sessions (auto on session entering CHARGING)"
        actor: "system"
        preconditions:
          - "Pile.lifecycle_state == ON_SHELF"
          - "Pile.operational_state == IDLE"
        side_effects:
          - "Pile.operational_state = IN_USE"
      - from: "operational=IN_USE"
        to: "operational=IDLE"
        trigger: "session terminal entry (SETTLED or ABORTED)"
        actor: "system"
        preconditions:
          - "owning ChargingSession entered SETTLED or ABORTED"
        side_effects:
          - "Pile.operational_state = IDLE"
          - "if QueueEntry with status==WAITING exists at station and pile is IDLE, oldest by enqueued_at PROMOTED — see queue_promotion side-effect chain"
      - from: "operational IN {IDLE,IN_USE}"
        to: "operational=FAULT"
        trigger: "FaultReport ISOLATED transition (system or POST /fault-reports/{id}/isolate)"
        actor: "system"
        preconditions:
          - "Pile.lifecycle_state == ON_SHELF"
        side_effects:
          - "Pile.operational_state = FAULT"
          - "cascade: every Reservation on this pile with status==HELD transitions to CANCELLED (compensating: no_show_penalty NOT applied)"
          - "cascade: every QueueEntry on the station with status==WAITING is RE-RANKED but not removed"
          - "any in-flight ChargingSession on this pile in status CHARGING transitions to ABORTED — see Session machine"
      - from: "operational=FAULT"
        to: "operational=IDLE"
        trigger: "RepairTicket CLOSED transition"
        actor: "system"
        preconditions:
          - "owning FaultReport.status == RESOLVED"
        side_effects:
          - "Pile.operational_state = IDLE"
          - "queue_promotion check fires"
      - from: "operational IN {IDLE,IN_USE,FAULT}"
        to: "operational=OFFLINE"
        trigger: "POST /_events/emit {source_system: GRID, event_type: grid.pile_offline}"
        actor: "system"
        preconditions:
          - "Pile.lifecycle_state == ON_SHELF"
        side_effects:
          - "Pile.operational_state = OFFLINE"
      - from: "operational=OFFLINE"
        to: "operational=IDLE"
        trigger: "POST /_events/emit {source_system: GRID, event_type: grid.pile_online}"
        actor: "system"
        preconditions:
          - "Pile.lifecycle_state == ON_SHELF"
        side_effects:
          - "Pile.operational_state = IDLE"

  # ------------------ Reservation (linear + cancellation) ------------------
  - entity: Reservation
    initial_state: "HELD"
    terminal_states: ["ACTIVATED", "EXPIRED", "CANCELLED"]
    transitions:
      - from: "HELD"
        to: "ACTIVATED"
        trigger: "POST /sessions (with reservation_id) entering CHARGING"
        actor: "EVDriver"
        preconditions:
          - "Reservation.status == HELD"
          - "now < Reservation.hold_expires_at"
          - "Pile.operational_state == IDLE"
        side_effects:
          - "Reservation linked to created ChargingSession"
      - from: "HELD"
        to: "EXPIRED"
        trigger: "POST /_sweep/run when now >= hold_expires_at"
        actor: "system"
        preconditions:
          - "Reservation.status == HELD"
          - "now >= Reservation.hold_expires_at"
        side_effects:
          - "Member.no_show_strikes += 1"
          - "Reservation.no_show_penalty_cents = NO_SHOW_PENALTY_CENTS"
          - "Member.wallet_balance_cents -= NO_SHOW_PENALTY_CENTS (clamped at 0, deficit recorded as SettlementLedgerEntry NO_SHOW_PENALTY)"
          - "SettlementLedgerEntry written: counterparty=PLATFORM_SERVICE_FEE, amount=+NO_SHOW_PENALTY_CENTS, reason=NO_SHOW_PENALTY"
      - from: "HELD"
        to: "CANCELLED"
        trigger: "POST /reservations/{id}/cancel OR Pile FAULT cascade"
        actor: "EVDriver | system"
        preconditions:
          - "Reservation.status == HELD"
        side_effects:
          - "no_show_strikes NOT incremented (compensating: differs from EXPIRED)"

  # ------------------ Queue (linear with abandonment) ------------------
  - entity: QueueEntry
    initial_state: "WAITING"
    terminal_states: ["PROMOTED", "ABANDONED"]
    transitions:
      - from: "WAITING"
        to: "PROMOTED"
        trigger: "system: station has IDLE pile and this entry has lowest position"
        actor: "system"
        preconditions:
          - "QueueEntry.status == WAITING"
          - "QueueEntry.position == 1"
          - "exists Pile on station with operational_state==IDLE and lifecycle_state==ON_SHELF"
        side_effects:
          - "subsequent QueueEntry rows at this station with WAITING decrement position by 1"
      - from: "WAITING"
        to: "ABANDONED"
        trigger: "POST /queue-entries/{id}/abandon"
        actor: "EVDriver"
        preconditions:
          - "QueueEntry.status == WAITING"
        side_effects:
          - "subsequent QueueEntry rows at this station with WAITING and higher position decrement position by 1"

  # ------------------ ChargingSession (branching with abort) ------------------
  - entity: ChargingSession
    initial_state: "PENDING_AUTH"
    terminal_states: ["SETTLED", "ABORTED"]
    transitions:
      - from: "PENDING_AUTH"
        to: "CHARGING"
        trigger: "POST /sessions/{id}/start"
        actor: "EVDriver"
        preconditions:
          - "ChargingSession.status == PENDING_AUTH"
          - "Pile.lifecycle_state == ON_SHELF AND Pile.operational_state == IDLE"
          - "if reservation_id set: Reservation.status==HELD AND now<hold_expires_at AND Reservation.member_id==session.member_id"
          - "if reservation_id null: QueueEntry exists at Pile.station_id for session.member_id with status==WAITING and position==1, OR no WAITING queue at station"
          - "Member.wallet_balance_cents >= MIN_AUTH_HOLD_CENTS"
        side_effects:
          - "ChargingSession.started_at = now"
          - "ChargingSession.pricing_version_id = current PricingVersion of Pile.station.operator at now (version-pinning)"
          - "ChargingSession.promo_activity_id = applicable PromoActivity at now or null"
          - "Pile.operational_state = IN_USE"
          - "if reservation_id set: Reservation -> ACTIVATED"
          - "if from queue: matching QueueEntry -> PROMOTED, others reranked"
      - from: "CHARGING"
        to: "SETTLING"
        trigger: "POST /sessions/{id}/stop"
        actor: "EVDriver | system"
        preconditions:
          - "ChargingSession.status == CHARGING"
        side_effects:
          - "ChargingSession.ended_at = now"
          - "metering windows finalized (peak_kwh_milli, flat_kwh_milli, valley_kwh_milli) from ChargingCurvePoint stream"
      - from: "SETTLING"
        to: "SETTLED"
        trigger: "system: settlement calculation completes"
        actor: "system"
        preconditions:
          - "ChargingSession.status == SETTLING"
          - "cumulative_energy_milli >= 0 on at least one ChargingCurvePoint"
        side_effects:
          - "electricity_fee_cents, service_fee_cents, tax_cents, total_cents set per calc:session_settlement"
          - "Member.wallet_balance_cents -= total_cents"
          - "SettlementLedgerEntry rows written per calc:operator_settlement (STATION_OWNER_SHARE, PLATFORM_SERVICE_FEE, ROAMING_PARTNER if applicable, TAX_AUTHORITY)"
          - "Pile.operational_state = IDLE"
          - "queue_promotion check fires at parent station"
      - from: "CHARGING"
        to: "ABORTED"
        trigger: "Pile FAULT cascade OR POST /sessions/{id}/abort"
        actor: "system | CustomerService"
        preconditions:
          - "ChargingSession.status == CHARGING"
        side_effects:
          - "ChargingSession.ended_at = now"
          - "abnormal_events appended with {type: COMMUNICATION_LOSS, at: now} when fault cascade triggered"
          - "no electricity_fee / service_fee charged; total_cents = 0"
          - "Pile.operational_state set per Pile machine (to FAULT or IDLE)"
          - "AuditLog written event_kind=FAULT_EVENT"

  # ------------------ FaultReport (linear with isolation) ------------------
  - entity: FaultReport
    initial_state: "OPEN"
    terminal_states: ["RESOLVED"]
    transitions:
      - from: "OPEN"
        to: "ISOLATED"
        trigger: "POST /fault-reports/{id}/isolate (or auto-isolate when severity==CRITICAL on create)"
        actor: "FieldTechnician | system"
        preconditions:
          - "FaultReport.status == OPEN"
        side_effects:
          - "Pile.operational_state -> FAULT (see Pile machine)"
          - "AuditLog written event_kind=FAULT_EVENT"
      - from: "ISOLATED"
        to: "RESOLVED"
        trigger: "RepairTicket CLOSED transition"
        actor: "system"
        preconditions:
          - "FaultReport.status == ISOLATED"
          - "owning RepairTicket.status == CLOSED"
        side_effects:
          - "Pile.operational_state -> IDLE (via Pile machine)"

  # ------------------ RepairTicket (branching with reject loop) ------------------
  - entity: RepairTicket
    initial_state: "OPEN"
    terminal_states: ["CLOSED"]
    transitions:
      - from: "OPEN"
        to: "DISPATCHED"
        trigger: "POST /repair-tickets/{id}/dispatch"
        actor: "PlatformOperator"
        preconditions:
          - "RepairTicket.status == OPEN"
          - "parent FaultReport.status IN {OPEN, ISOLATED}"
        side_effects:
          - "RepairTicket.dispatched_at = now"
          - "if FaultReport.status == OPEN: cascade FaultReport -> ISOLATED"
      - from: "DISPATCHED"
        to: "IN_REPAIR"
        trigger: "POST /repair-tickets/{id}/begin"
        actor: "FieldTechnician"
        preconditions:
          - "RepairTicket.status == DISPATCHED"
          - "RepairTicket.assigned_technician_id == X-User-ID"
        side_effects: []
      - from: "IN_REPAIR"
        to: "AWAITING_ACCEPTANCE"
        trigger: "POST /repair-tickets/{id}/complete"
        actor: "FieldTechnician"
        preconditions:
          - "RepairTicket.status == IN_REPAIR"
          - "RepairTicket.assigned_technician_id == X-User-ID"
        side_effects:
          - "repair_notes recorded"
      - from: "AWAITING_ACCEPTANCE"
        to: "CLOSED"
        trigger: "POST /repair-tickets/{id}/accept"
        actor: "StationOwner"
        preconditions:
          - "RepairTicket.status == AWAITING_ACCEPTANCE"
          - "X-User-ID == parent Station.station_owner_id"
        side_effects:
          - "parent FaultReport -> RESOLVED (cascade)"
          - "Pile.operational_state -> IDLE (cascade)"
      - from: "AWAITING_ACCEPTANCE"
        to: "IN_REPAIR"
        trigger: "POST /repair-tickets/{id}/reject"
        actor: "StationOwner"
        preconditions:
          - "RepairTicket.status == AWAITING_ACCEPTANCE"
          - "X-User-ID == parent Station.station_owner_id"
        side_effects:
          - "RepairTicket reopens for further work (cyclic edge)"

  # ------------------ Payout (linear with reversal) ------------------
  - entity: Payout
    initial_state: "PENDING"
    terminal_states: ["ISSUED", "REVERSED"]
    transitions:
      - from: "PENDING"
        to: "ISSUED"
        trigger: "POST /payouts/{id}/issue"
        actor: "PlatformOperator"
        preconditions:
          - "Payout.status == PENDING"
          - "net_cents >= 0"
        side_effects:
          - "SettlementLedgerEntry written reason=PAYOUT, amount=-net_cents, counterparty depends on operator role"
      - from: "ISSUED"
        to: "REVERSED"
        trigger: "POST /_events/emit {source_system:PAYMENT, event_type:payment.refunded} that retroactively reverses an included session"
        actor: "system"
        preconditions:
          - "Payout.status == ISSUED"
          - "external event references a SettlementLedgerEntry whose session.ended_at is within [period_start, period_end)"
        side_effects:
          - "SettlementLedgerEntry written reason=REFUND_REVERSAL, amount sign opposite to original entries"
          - "ChargingSession.total_cents adjusted; AuditLog written event_kind=BILLING_ADJUSTMENT"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two members reserve the same pile simultaneously"
    guarantee: "At most one Reservation in status HELD per pile; second is rejected"
    error_id: ERR_PILE_ALREADY_RESERVED
    http_status: 409
    serialization: "First-writer-wins on Reservation row insertion for pile_id"

  - scenario: "Member starts a session while reservation expires in the sweep at the same instant"
    guarantee: "Exactly one of {start succeeds with ACTIVATED, sweep marks EXPIRED} succeeds; loser sees ERR_RESERVATION_EXPIRED"
    error_id: ERR_RESERVATION_EXPIRED
    http_status: 409
    serialization: "First-writer-wins on Reservation.status"

  - scenario: "Two queue entries try to be promoted to the same idle pile"
    guarantee: "Only the entry with lowest position (oldest enqueued_at on tie) is promoted; loser remains WAITING"
    error_id: ERR_QUEUE_NOT_AT_FRONT
    http_status: 409
    serialization: "First-writer-wins on queue promotion; tie-break by enqueued_at then id ascending"

  - scenario: "Driver stops session while system aborts due to fault cascade"
    guarantee: "Exactly one terminal state. If abort wins, total_cents=0; if stop wins, settlement proceeds."
    error_id: ERR_INVALID_SESSION_STATE
    http_status: 409
    serialization: "First-writer-wins on ChargingSession.status"

  - scenario: "Refund event arrives while operator is issuing payout covering that session"
    guarantee: "If payout already ISSUED, refund creates REFUND_REVERSAL and transitions payout to REVERSED; if payout still PENDING, refund adjusts net_cents and issue is rejected"
    error_id: ERR_PAYOUT_PERIOD_DRIFT
    http_status: 409
    serialization: "First-writer-wins on Payout.status"

  - scenario: "Two PricingVersion rows for same operator with overlapping effective windows submitted simultaneously"
    guarantee: "At most one PricingVersion may cover any (operator_id, instant); second is rejected"
    error_id: ERR_PRICING_WINDOW_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on PricingVersion insertion; overlap is [effective_from, effective_to)"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: session_settlement
    trigger: "ChargingSession SETTLING -> SETTLED transition"
    algorithm: tiered_pricing
    input_set: "All ChargingCurvePoint rows for the session with sampled_at in [started_at, ended_at]; pinned PricingVersion via session.pricing_version_id; pinned PromoActivity via session.promo_activity_id"
    constants:
      ROUND_MODE: round_half_up
      MILLI_PER_KWH: 1000
    precision: "2 decimal places, integer cents"
    formula: |
      # Step A: derive per-window energy in milli-kWh using ChargingCurvePoint.window_tag
      peak_milli   = sum(diff_cumulative_energy_milli for points where window_tag == PEAK)
      flat_milli   = sum(diff_cumulative_energy_milli for points where window_tag == FLAT)
      valley_milli = sum(diff_cumulative_energy_milli for points where window_tag == VALLEY)
      total_milli  = peak_milli + flat_milli + valley_milli

      # Step B: electricity fee — round PER WINDOW then sum (rounding order pinned)
      def cents(milli, rate_per_kwh_cents):
          # cents = round_half_up( milli * rate_per_kwh_cents / 1000 )
          return round_half_up( (milli * rate_per_kwh_cents) / 1000 )
      electricity_fee_cents = cents(peak_milli,   pv.peak_rate_per_kwh_cents) \
                            + cents(flat_milli,   pv.flat_rate_per_kwh_cents) \
                            + cents(valley_milli, pv.valley_rate_per_kwh_cents)

      # Step C: service fee with tier discount STACKED on promo discount, applied as 1-(d1)*(d2)
      tier_disc_bps  = pv.tier_service_fee_discount_bps[member.tier]
      promo_disc_bps = promo.service_fee_discount_bps if (promo and member.tier in promo.applies_to_tiers) else 0
      base_service_cents = cents(total_milli, pv.service_fee_per_kwh_cents)
      effective_factor   = (10000 - tier_disc_bps) * (10000 - promo_disc_bps)   # bps^2
      service_fee_cents  = round_half_up( base_service_cents * effective_factor / 100_000_000 )

      # Step D: tax — applied on (electricity_fee_cents + service_fee_cents) ONCE
      tax_cents   = round_half_up( (electricity_fee_cents + service_fee_cents) * pv.tax_bps / 10000 )
      total_cents = electricity_fee_cents + service_fee_cents + tax_cents
    variants:
      - name: provisional_estimate
        when: "GET /sessions/{id}/estimate while status==CHARGING"
        difference: "Uses latest ChargingCurvePoint up to now() instead of ended_at; uses current PricingVersion if pricing_version_id NOT yet pinned (only happens before CHARGING starts)"

  - name: operator_settlement
    trigger: "ChargingSession SETTLING -> SETTLED, and again on refund events (reversal)"
    algorithm: waterfall_allocation
    input_set: "session.total_cents minus tax_cents, split across station_owner_share, platform_service_fee, and optional roaming_partner_share"
    constants:
      ROUND_MODE: round_half_up
      PLATFORM_BASE_FEE_BPS: 500          # platform takes 5% of net before station share
      ROAMING_PARTNER_BPS: 1500           # roaming partner gets 15% of net when applicable
    precision: "integer cents"
    formula: |
      net_cents = electricity_fee_cents + service_fee_cents     # tax routed separately

      # Step A: roaming wedge — applies ONLY when session.member.home_operator_id != station.operator_id
      roaming = (member.home_operator_id != station.operator_id)
      roaming_cents = round_half_up(net_cents * ROAMING_PARTNER_BPS / 10000) if roaming else 0

      # Step B: platform fee on remainder
      after_roaming_cents = net_cents - roaming_cents
      platform_cents = round_half_up(after_roaming_cents * PLATFORM_BASE_FEE_BPS / 10000)

      # Step C: station owner share is FIXED-FRACTION of after_platform amount per Station.revenue_share_bps
      after_platform_cents = after_roaming_cents - platform_cents
      station_owner_cents  = round_half_up(after_platform_cents * station.revenue_share_bps / 10000)

      # Step D: operator residual = after_platform - station_owner
      operator_residual_cents = after_platform_cents - station_owner_cents

      # Tax always to TAX_AUTHORITY
      tax_to_authority_cents = tax_cents
    variants:
      - name: forward_accrual
        when: "Session SETTLED, no refund yet"
        difference: "All four SettlementLedgerEntry rows written with POSITIVE amount_cents and reason=SESSION_SETTLE"
      - name: refund_reversal
        when: "External payment.refunded event references this session"
        difference: "All four SettlementLedgerEntry rows are RE-COMPUTED FROM SCRATCH (not stored deltas) using the CURRENT values of station.revenue_share_bps and constants, and written with NEGATIVE amount_cents and reason=REFUND_REVERSAL. The invariant is: sum of original + reversal rows on the session = 0 cents per counterparty_kind (compensating_invariant)."

  - name: no_show_penalty
    trigger: "POST /_sweep/run when Reservation.status==HELD and now >= hold_expires_at"
    algorithm: threshold
    input_set: "Member.no_show_strikes BEFORE increment"
    constants:
      BASE_PENALTY_CENTS: 500
      STRIKE_MULTIPLIER: 2
      MAX_PENALTY_CENTS: 5000
    precision: "integer cents"
    formula: |
      # NOTE: evaluation order pinned — strikes is read BEFORE increment
      prior_strikes = member.no_show_strikes
      raw = BASE_PENALTY_CENTS * (STRIKE_MULTIPLIER ** prior_strikes)
      no_show_penalty_cents = min(raw, MAX_PENALTY_CENTS)

  - name: queue_promotion_selection
    trigger: "Any event that frees a pile (session terminal, fault resolved, pile shelved)"
    algorithm: chronological
    input_set: "QueueEntry rows at the station with status==WAITING"
    constants: {}
    precision: "integer position"
    formula: |
      # Sort key: position ASC; tie-break by enqueued_at ASC, then id ASC
      candidate = sorted(waiting, key=lambda q: (q.position, q.enqueued_at, q.id))[0]
      candidate.status = PROMOTED
      for q in waiting where q.position > candidate.position:
          q.position -= 1
    variants: []

  - name: pile_availability_score
    trigger: "GET /piles?available_for_member=<id>"
    algorithm: weighted_scoring
    input_set: "Piles on stations with status==ACTIVE; lifecycle_state==ON_SHELF; operational_state==IDLE; no HELD Reservation"
    constants:
      DISTANCE_WEIGHT: 100
      POWER_WEIGHT: 5
      TIER_BONUS_PER_LEVEL: 25
    precision: "integer score; sort descending"
    formula: |
      # Step A: filter — exclude piles whose station has WAITING QueueEntry length > 0 (queue-jumping prevention)
      # Step B: rank
      tier_rank = {BASIC:0, SILVER:1, GOLD:2, PLATINUM:3}[member.tier]
      score = (POWER_WEIGHT * pile.rated_power_kw) + (TIER_BONUS_PER_LEVEL * tier_rank) - (DISTANCE_WEIGHT * haversine_km(member.last_location, pile.station.location))
      # Tie-break: pile.id ASC
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService}"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except /_clock/advance, /_sweep/run, /_events/emit"

  - priority: 2
    category: auth
    check: "X-User-ID header present and matches an existing entity for entity_backed roles; opaque for PlatformOperator/CustomerService"
    error_id: ERR_AUTH_INVALID
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role authorized for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All path-id resources exist (left-to-right: station, pile, session, reservation, ticket, payout)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all with path id"

  - priority: 5
    category: existence
    check: "All body foreign-key resources exist (pile_id, member_id, reservation_id, fault_report_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints"

  - priority: 6
    category: state
    check: "Resource is in a state that allows this operation (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Reservation cannot be made on a pile whose Pile.operational_state IN {FAULT, OFFLINE} or Pile.lifecycle_state != ON_SHELF"
    error_id: ERR_PILE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 8
    category: business_safety
    check: "Session start blocked when pile.operational_state != IDLE — safety takes precedence over reservation hold"
    error_id: ERR_PILE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sessions/{id}/start"

  - priority: 9
    category: business_referential
    check: "When session uses a reservation, Reservation.member_id MUST equal session.member_id AND Reservation.pile_id MUST equal session.pile_id"
    error_id: ERR_RESERVATION_MISMATCH
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{id}/start"

  - priority: 10
    category: business_temporal
    check: "Reservation hold not expired (now < hold_expires_at) at start time"
    error_id: ERR_RESERVATION_EXPIRED
    http_status: 409
    applies_to: "POST /sessions/{id}/start"

  - priority: 11
    category: business_referential
    check: "Unreserved start must show the requesting member is QueueEntry.position==1 at the station, OR there is no WAITING queue (queue-jumping prevention)"
    error_id: ERR_QUEUE_NOT_AT_FRONT
    http_status: 409
    applies_to: "POST /sessions/{id}/start when reservation_id is null"

  - priority: 12
    category: business_constraint
    check: "ChargingCurvePoint.cumulative_energy_milli must be monotonically non-decreasing per session and sampled_at strictly increasing"
    error_id: ERR_CURVE_NON_MONOTONIC
    http_status: 422
    applies_to: "POST /sessions/{id}/curve-points"

  - priority: 13
    category: business_constraint
    check: "PricingVersion windows MUST NOT overlap any other PricingVersion of the same operator (half-open [effective_from, effective_to))"
    error_id: ERR_PRICING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /pricing-versions"

  - priority: 14
    category: business_constraint
    check: "PricingVersion.peak_windows and PricingVersion.valley_windows do not overlap each other"
    error_id: ERR_TOU_WINDOWS_OVERLAP
    http_status: 422
    applies_to: "POST /pricing-versions"

  - priority: 15
    category: business_constraint
    check: "Pile cannot be off-shelved while it has any ChargingSession in {PENDING_AUTH, CHARGING, SETTLING} or Reservation in {HELD}"
    error_id: ERR_PILE_HAS_DEPENDENTS
    http_status: 409
    applies_to: "POST /piles/{id}/off-shelve"

  - priority: 16
    category: business_safety
    check: "Member.no_show_strikes < MAX_STRIKES_FOR_RESERVATION (configured at 3) — over-strike members are blocked from new reservations"
    error_id: ERR_NO_SHOW_THRESHOLD_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 17
    category: business_fiscal
    check: "Member.wallet_balance_cents >= MIN_AUTH_HOLD_CENTS (configured at 1000) at session start"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /sessions/{id}/start"

  - priority: 18
    category: business_fiscal
    check: "Station.revenue_share_bps + PLATFORM_BASE_FEE_BPS + ROAMING_PARTNER_BPS (when applicable) <= 10000 at the time of session settlement"
    error_id: ERR_SETTLEMENT_OVER_ALLOCATION
    http_status: 422
    applies_to: "session settlement (computed)"

  - priority: 19
    category: business_temporal
    check: "Payout.period_end > Payout.period_start; window is half-open [period_start, period_end)"
    error_id: ERR_INVALID_PAYOUT_WINDOW
    http_status: 422
    applies_to: "POST /payouts"

  - priority: 20
    category: business_constraint
    check: "Payout.net_cents >= 0 at time of issue (refunds may have made it negative)"
    error_id: ERR_PAYOUT_NEGATIVE_NET
    http_status: 409
    applies_to: "POST /payouts/{id}/issue"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Operators ---
  - method: POST
    path: "/operators"
    description: "Create an operator (platform/station-owner/roaming-partner)"
    roles: [PlatformOperator]
    code: 201
    input: [name, role_kind, tax_id]
    output: Operator
    side_effects: []

  - method: GET
    path: "/operators"
    description: "List operators"
    roles: [PlatformOperator, StationOwner, CustomerService]
    code: 200
    input: ["role_kind?", "limit?", "offset?"]
    output: "Operator[]"
    side_effects: []

  - method: GET
    path: "/operators/{id}"
    description: "Get operator"
    roles: [PlatformOperator, StationOwner, CustomerService]
    code: 200
    input: []
    output: Operator
    side_effects: []

  # --- Station / Pile ledger ---
  - method: POST
    path: "/stations"
    description: "Create a station (operator-scoped)"
    roles: [PlatformOperator, StationOwner]
    code: 201
    input: [name, operator_id, station_owner_id, latitude, longitude, revenue_share_bps]
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "List stations; filterable by operator_id, status"
    roles: [PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService]
    code: 200
    input: ["operator_id?", "status?", "limit?", "offset?"]
    output: "Station[]"
    side_effects: []

  - method: GET
    path: "/stations/{id}"
    description: "Get station detail"
    roles: [PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: POST
    path: "/stations/{id}/piles"
    description: "Add a pile to a station (initial lifecycle_state=OFF_SHELF)"
    roles: [StationOwner]
    code: 201
    input: [model_code, rated_power_kw, connector_type, firmware_version]
    output: Pile
    side_effects: []

  - method: POST
    path: "/piles/{id}/shelve"
    description: "Move pile lifecycle OFF_SHELF -> ON_SHELF (operational becomes IDLE)"
    roles: [StationOwner]
    code: 200
    input: ["version?"]
    output: Pile
    side_effects: ["Pile lifecycle_state=ON_SHELF, operational_state=IDLE"]

  - method: POST
    path: "/piles/{id}/off-shelve"
    description: "Move pile lifecycle ON_SHELF -> OFF_SHELF"
    roles: [StationOwner]
    code: 200
    input: ["version?"]
    output: Pile
    side_effects: ["operational_state cleared"]

  - method: POST
    path: "/piles/{id}/decommission"
    description: "Permanently retire pile (must be OFF_SHELF)"
    roles: [PlatformOperator]
    code: 200
    input: ["version?"]
    output: Pile
    side_effects: []

  - method: PATCH
    path: "/piles/{id}"
    description: "Update pile metadata (model_code, firmware_version, rated_power_kw)"
    roles: [StationOwner]
    code: 200
    input: ["model_code?", "firmware_version?", "rated_power_kw?", "version?"]
    output: Pile
    side_effects: []

  - method: GET
    path: "/piles"
    description: "List piles; available_for_member=<id> applies pile_availability_score and orders by score DESC"
    roles: [PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService]
    code: 200
    input: ["station_id?", "connector_type?", "operational_state?", "available_for_member?", "limit?", "offset?"]
    output: "Pile[]"
    side_effects: []

  - method: GET
    path: "/piles/{id}"
    description: "Get pile detail"
    roles: [PlatformOperator, StationOwner, EVDriver, FieldTechnician, CustomerService]
    code: 200
    input: []
    output: Pile
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/members"
    description: "Create a member"
    roles: [PlatformOperator, CustomerService]
    code: 201
    input: ["display_name", "home_operator_id", "tier?"]
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Get member detail (own record for EVDriver, any for staff)"
    roles: [PlatformOperator, CustomerService, EVDriver]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/wallet-credit"
    description: "Credit member wallet (test/operator action)"
    roles: [PlatformOperator, CustomerService]
    code: 200
    input: ["amount_cents", "version?"]
    output: Member
    side_effects: ["wallet_balance_cents increased"]

  # --- Pricing ---
  - method: POST
    path: "/pricing-versions"
    description: "Create a new pricing version (must not overlap existing for operator)"
    roles: [PlatformOperator]
    code: 201
    input: [operator_id, version_label, effective_from, effective_to, peak_rate_per_kwh_cents, flat_rate_per_kwh_cents, valley_rate_per_kwh_cents, service_fee_per_kwh_cents, tax_bps, peak_windows, valley_windows, tier_service_fee_discount_bps]
    output: PricingVersion
    side_effects: []

  - method: GET
    path: "/pricing-versions"
    description: "List pricing versions"
    roles: [PlatformOperator, StationOwner, CustomerService]
    code: 200
    input: ["operator_id?", "active_at?", "limit?", "offset?"]
    output: "PricingVersion[]"
    side_effects: []

  - method: POST
    path: "/promo-activities"
    description: "Create a promo activity"
    roles: [PlatformOperator]
    code: 201
    input: [operator_id, name, starts_at, ends_at, service_fee_discount_bps, applies_to_tiers]
    output: PromoActivity
    side_effects: []

  - method: GET
    path: "/promo-activities"
    description: "List promos"
    roles: [PlatformOperator, StationOwner, EVDriver]
    code: 200
    input: ["operator_id?", "active_at?", "limit?", "offset?"]
    output: "PromoActivity[]"
    side_effects: []

  # --- Reservation / Queue ---
  - method: POST
    path: "/reservations"
    description: "Create a reservation (hold for 15 minutes)"
    roles: [EVDriver]
    code: 201
    input: [pile_id]
    output: Reservation
    side_effects: ["hold_expires_at = now + 15 minutes"]

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel HELD reservation; no penalty"
    roles: [EVDriver]
    code: 200
    input: ["version?"]
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations/{id}"
    description: "Get reservation"
    roles: [EVDriver, PlatformOperator, CustomerService]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/stations/{id}/queue-entries"
    description: "Join the walk-up queue at a station"
    roles: [EVDriver]
    code: 201
    input: []
    output: QueueEntry
    side_effects: ["position assigned as max(WAITING.position)+1, or 1 if empty"]

  - method: POST
    path: "/queue-entries/{id}/abandon"
    description: "Leave the queue"
    roles: [EVDriver]
    code: 200
    input: ["version?"]
    output: QueueEntry
    side_effects: ["subsequent WAITING entries decrement position"]

  - method: GET
    path: "/stations/{id}/queue-entries"
    description: "List queue at a station"
    roles: [EVDriver, StationOwner, PlatformOperator, CustomerService]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "QueueEntry[]"
    side_effects: []

  # --- Sessions ---
  - method: POST
    path: "/sessions"
    description: "Create a session (PENDING_AUTH)"
    roles: [EVDriver]
    code: 201
    input: ["pile_id", "member_id", "auth_method", "reservation_id?"]
    output: ChargingSession
    side_effects: []

  - method: POST
    path: "/sessions/{id}/start"
    description: "Start charging (PENDING_AUTH -> CHARGING)"
    roles: [EVDriver]
    code: 200
    input: ["version?"]
    output: ChargingSession
    side_effects: ["pricing_version_id pinned; pile -> IN_USE; reservation -> ACTIVATED OR queue head -> PROMOTED"]

  - method: POST
    path: "/sessions/{id}/curve-points"
    description: "Append a charging curve sample (called by pile telemetry)"
    roles: [PlatformOperator, FieldTechnician]
    code: 201
    input: [sampled_at, instant_power_kw, cumulative_energy_milli, window_tag]
    output: ChargingCurvePoint
    side_effects: []

  - method: POST
    path: "/sessions/{id}/mark-abnormal"
    description: "Mark abnormal event (over-temp / comms loss)"
    roles: [PlatformOperator, FieldTechnician]
    code: 200
    input: [event_type]
    output: ChargingSession
    side_effects: ["abnormal_events appended"]

  - method: POST
    path: "/sessions/{id}/stop"
    description: "Stop a CHARGING session and run settlement"
    roles: [EVDriver, PlatformOperator]
    code: 200
    input: ["version?"]
    output: ChargingSession
    side_effects: ["status -> SETTLING -> SETTLED; settlement calc runs; ledger entries written; pile -> IDLE; queue promotion fires"]

  - method: POST
    path: "/sessions/{id}/abort"
    description: "Abort a CHARGING session (CustomerService override)"
    roles: [CustomerService]
    code: 200
    input: ["version?"]
    output: ChargingSession
    side_effects: ["status -> ABORTED; total_cents=0; pile may go IDLE or FAULT depending on linked fault"]

  - method: GET
    path: "/sessions/{id}"
    description: "Get session detail"
    roles: [EVDriver, PlatformOperator, CustomerService, StationOwner]
    code: 200
    input: []
    output: ChargingSession
    side_effects: []

  - method: GET
    path: "/sessions/{id}/estimate"
    description: "Provisional settlement estimate while CHARGING"
    roles: [EVDriver, PlatformOperator, CustomerService]
    code: 200
    input: []
    output: "object {electricity_fee_cents, service_fee_cents, tax_cents, total_cents}"
    side_effects: []

  - method: GET
    path: "/sessions/{id}/curve-points"
    description: "List curve points"
    roles: [EVDriver, PlatformOperator, FieldTechnician, CustomerService]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChargingCurvePoint[]"
    side_effects: []

  # --- Faults & Repairs ---
  - method: POST
    path: "/fault-reports"
    description: "Report a fault on a pile (USER or AUTO_DETECT)"
    roles: [EVDriver, FieldTechnician, PlatformOperator]
    code: 201
    input: ["pile_id", "reporter_kind", "reporter_member_id?", "symptom_code", "severity"]
    output: FaultReport
    side_effects: ["AuditLog event_kind=FAULT_EVENT; auto-isolate if severity==CRITICAL"]

  - method: POST
    path: "/fault-reports/{id}/isolate"
    description: "Manually isolate the pile"
    roles: [FieldTechnician, PlatformOperator]
    code: 200
    input: ["version?"]
    output: FaultReport
    side_effects: ["Pile.operational_state -> FAULT; cascade reservations and sessions"]

  - method: GET
    path: "/fault-reports/{id}"
    description: "Get fault report"
    roles: [FieldTechnician, PlatformOperator, StationOwner, CustomerService]
    code: 200
    input: []
    output: FaultReport
    side_effects: []

  - method: POST
    path: "/fault-reports/{id}/repair-tickets"
    description: "Open a repair ticket"
    roles: [PlatformOperator]
    code: 201
    input: [assigned_technician_id]
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/dispatch"
    description: "Dispatch ticket (OPEN -> DISPATCHED, isolates fault if not already)"
    roles: [PlatformOperator]
    code: 200
    input: ["version?"]
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/begin"
    description: "Technician begins repair (DISPATCHED -> IN_REPAIR)"
    roles: [FieldTechnician]
    code: 200
    input: ["version?"]
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/complete"
    description: "Mark repair complete (IN_REPAIR -> AWAITING_ACCEPTANCE)"
    roles: [FieldTechnician]
    code: 200
    input: ["repair_notes", "version?"]
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/repair-tickets/{id}/accept"
    description: "Station owner accepts (AWAITING_ACCEPTANCE -> CLOSED)"
    roles: [StationOwner]
    code: 200
    input: ["version?"]
    output: RepairTicket
    side_effects: ["FaultReport -> RESOLVED; Pile -> IDLE; queue promotion fires"]

  - method: POST
    path: "/repair-tickets/{id}/reject"
    description: "Station owner rejects (AWAITING_ACCEPTANCE -> IN_REPAIR)"
    roles: [StationOwner]
    code: 200
    input: ["version?"]
    output: RepairTicket
    side_effects: []

  # --- Settlement & Payout ---
  - method: GET
    path: "/sessions/{id}/ledger-entries"
    description: "List ledger entries for a session"
    roles: [PlatformOperator, StationOwner, CustomerService]
    code: 200
    input: ["limit?", "offset?"]
    output: "SettlementLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/payouts"
    description: "Create a payout draft for an operator in a window (computes net at creation)"
    roles: [PlatformOperator]
    code: 201
    input: [operator_id, period_start, period_end]
    output: Payout
    side_effects: ["net_cents computed from ledger; status=PENDING"]

  - method: POST
    path: "/payouts/{id}/issue"
    description: "Issue a PENDING payout (writes PAYOUT ledger row)"
    roles: [PlatformOperator]
    code: 200
    input: ["version?"]
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts/{id}"
    description: "Get payout"
    roles: [PlatformOperator, StationOwner]
    code: 200
    input: []
    output: Payout
    side_effects: []

  - method: GET
    path: "/payouts"
    description: "List payouts"
    roles: [PlatformOperator, StationOwner]
    code: 200
    input: ["operator_id?", "status?", "limit?", "offset?"]
    output: "Payout[]"
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-logs"
    description: "List audit logs"
    roles: [PlatformOperator, CustomerService]
    code: 200
    input: ["event_kind?", "entity_kind?", "entity_id?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test harness endpoints (testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance virtual clock by milliseconds (test-only); idempotent on absolute time"
    roles: [PlatformOperator]
    code: 200
    input: ["advance_ms? OR to_iso?"]
    output: "object {now: ISO8601}"
    side_effects: []

  - method: POST
    path: "/_sweep/run"
    description: "Run reservation expiry sweep (test-only)"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: "object {expired_reservation_ids: string[]}"
    side_effects: ["no-show penalty calc; ledger entries"]

  - method: POST
    path: "/_events/emit"
    description: "Emit an external event (PAYMENT/MAPPING/GRID); dispatcher runs synchronously"
    roles: [PlatformOperator]
    code: 200
    input: [source_system, event_type, payload]
    output: ExternalEventInbox
    side_effects: ["refund -> reversal ledger + payout reversal; grid -> pile online/offline; mapping -> station coords update"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID missing on non-test endpoint"
  - id: ERR_AUTH_INVALID
    http: 401
    condition: "Header value not recognized or does not resolve to a valid actor"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or referenced FK resource does not exist"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic version mismatch on mutation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state that allows this operation"
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "Session not in a state that allows this session operation (raced stop vs abort)"
  - id: ERR_PILE_UNAVAILABLE
    http: 409
    condition: "Pile not IDLE / not ON_SHELF; or in FAULT/OFFLINE"
  - id: ERR_PILE_HAS_DEPENDENTS
    http: 409
    condition: "Pile has active sessions or held reservations preventing off-shelve"
  - id: ERR_PILE_ALREADY_RESERVED
    http: 409
    condition: "Pile already has a HELD reservation"
  - id: ERR_RESERVATION_EXPIRED
    http: 409
    condition: "Reservation hold expired before session start"
  - id: ERR_RESERVATION_MISMATCH
    http: 422
    condition: "Reservation references different member or pile than session"
  - id: ERR_QUEUE_NOT_AT_FRONT
    http: 409
    condition: "Walk-up start attempted but member not at front of station queue"
  - id: ERR_CURVE_NON_MONOTONIC
    http: 422
    condition: "Charging curve sample violates monotonic cumulative_energy_milli or sampled_at ordering"
  - id: ERR_PRICING_WINDOW_OVERLAP
    http: 409
    condition: "New PricingVersion overlaps existing for same operator"
  - id: ERR_TOU_WINDOWS_OVERLAP
    http: 422
    condition: "peak_windows and valley_windows overlap each other"
  - id: ERR_NO_SHOW_THRESHOLD_EXCEEDED
    http: 409
    condition: "Member has reached MAX_STRIKES_FOR_RESERVATION"
  - id: ERR_INSUFFICIENT_BALANCE
    http: 402
    condition: "Member wallet below MIN_AUTH_HOLD_CENTS at session start"
  - id: ERR_SETTLEMENT_OVER_ALLOCATION
    http: 422
    condition: "Combined revenue shares would exceed 100% at settlement time"
  - id: ERR_INVALID_PAYOUT_WINDOW
    http: 422
    condition: "Payout period_end <= period_start"
  - id: ERR_PAYOUT_NEGATIVE_NET
    http: 409
    condition: "Refunds have driven net_cents below 0 prior to issue"
  - id: ERR_PAYOUT_PERIOD_DRIFT
    http: 409
    condition: "Refund event references session inside a payout window mid-issue; raced issuance"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body validation failure (shape, type, range) not covered by a more specific error"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOperator
    description: "Platform staff: manages operators, pricing, payouts, dispatches repairs, runs test harness"
    identity: "opaque"
    exclusive_operations:
      - "POST /pricing-versions"
      - "POST /promo-activities"
      - "POST /piles/{id}/decommission"
      - "POST /fault-reports/{id}/repair-tickets"
      - "POST /repair-tickets/{id}/dispatch"
      - "POST /payouts"
      - "POST /payouts/{id}/issue"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/emit"
    shared_operations:
      - "GET endpoints (station, pile, session, ledger, audit-logs, pricing-versions, promo-activities, payouts)"
      - "POST /sessions/{id}/curve-points"
      - "POST /sessions/{id}/mark-abnormal"
      - "POST /sessions/{id}/stop"
      - "POST /members"
      - "POST /members/{id}/wallet-credit"
      - "POST /fault-reports"
      - "POST /fault-reports/{id}/isolate"

  - name: StationOwner
    description: "Owns one or more stations; manages piles and accepts repairs at owned stations"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /stations/{id}/piles"
      - "POST /piles/{id}/shelve"
      - "POST /piles/{id}/off-shelve"
      - "PATCH /piles/{id}"
      - "POST /repair-tickets/{id}/accept"
      - "POST /repair-tickets/{id}/reject"
    shared_operations:
      - "POST /stations"
      - "GET endpoints scoped to owned stations"

  - name: EVDriver
    description: "End user reserving/queuing/charging"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /reservations"
      - "POST /reservations/{id}/cancel"
      - "POST /stations/{id}/queue-entries"
      - "POST /queue-entries/{id}/abandon"
      - "POST /sessions"
      - "POST /sessions/{id}/start"
      - "POST /sessions/{id}/stop"
    shared_operations:
      - "GET own member, sessions, reservations, queue-entries"
      - "GET pile listings (including availability score)"
      - "POST /fault-reports (reporter_kind=USER)"

  - name: FieldTechnician
    description: "Performs physical repairs at piles"
    identity: "opaque"
    exclusive_operations:
      - "POST /repair-tickets/{id}/begin"
      - "POST /repair-tickets/{id}/complete"
    shared_operations:
      - "POST /sessions/{id}/curve-points"
      - "POST /sessions/{id}/mark-abnormal"
      - "POST /fault-reports (reporter_kind=AUTO_DETECT)"
      - "POST /fault-reports/{id}/isolate"
      - "GET endpoints for piles/sessions/fault-reports"

  - name: CustomerService
    description: "Support staff that may override session state and credit wallets"
    identity: "opaque"
    exclusive_operations:
      - "POST /sessions/{id}/abort"
    shared_operations:
      - "POST /members"
      - "POST /members/{id}/wallet-credit"
      - "POST /sessions/{id}/stop"
      - "GET endpoints for members, sessions, fault-reports, audit-logs, ledger entries"

# =============================================================================
# Operator entity stub (used as identity for StationOwner)
# Note: kept implicit — system creates one Operator row per station_owner_id passed in.
# =============================================================================
