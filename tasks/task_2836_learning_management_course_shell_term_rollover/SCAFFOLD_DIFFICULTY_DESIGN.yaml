          trigger:
            - call: "POST /tool-placements/${placement_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { tool_state: $.data.approval_state, approved_version: $.data.approved_version, score_approved: $.data.risk_score }
            - call: "PATCH /tool-integrations/${tool_id}"
              payload: { tool_version: "1.1.0" }
              as: LmsAdmin
              captures: { tool_version_drifted: $.data.tool_version, approved_version_after_patch: $.data.approved_version, state_after_patch: $.data.approval_state }
            - call: "POST /tool-placements/${placement_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "PATCH /tool-integrations/${tool_id}"
              payload: { tool_version: "1.0.0" }
              as: LmsAdmin
              captures: { tool_version_restored: $.data.tool_version }
            - call: "POST /tool-placements/${placement_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { placement_final: $.data.placement_state, pinned_final: $.data.pinned_tool_version }
            - call: "GET /tool-integrations/${tool_id}"
              payload: {}
              as: LmsAdmin
              captures: { placements_final: $.data.active_placement_count, score_final: $.data.risk_score }
          assert:
            - "${placement_state_initial} == REQUESTED and ${pinned_initial} is null (nothing is pinned until activation)"
            - "ACTIVATE attempt 1 returns ERR_TOOL_NOT_APPROVED (409) because the parent is UNDER_REVIEW, not because anything is wrong with the placement"
            - "${tool_state} == APPROVED, ${approved_version} == \"1.0.0\" and ${score_approved} == 13.00"
            - "${tool_version_drifted} == \"1.1.0\", ${approved_version_after_patch} == \"1.0.0\" and ${state_after_patch} == APPROVED — a PATCH must NOT advance approved_version and must NOT re-open the review"
            - "ACTIVATE attempt 2 returns ERR_TOOL_VERSION_DRIFT (409) while the parent is still fully APPROVED — the gate is a string comparison between two fields of the parent"
            - "${tool_version_restored} == \"1.0.0\" and ACTIVATE attempt 3 succeeds: ${placement_final} == ACTIVE with ${pinned_final} == \"1.0.0\" copied from approved_version (not from tool_version)"
            - "${placements_final} == 1 and ${score_final} == 16.00 (13.00 + one placement's EXPOSURE_PER_PLACEMENT 3)"
            - "ToolPlacement.${placement_id}.version advanced only once across the three attempts — the two rejections are side-effect free"
            - "CourseShell.${shell_id}.publish_readiness is true again after the activation, having been false while the placement sat in REQUESTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: shell_scoped_maintenance_windows_use_half_open_intervals_so_abutment_is_legal
        grounds:
          - validations[priority=24]
          - errors[ERR_WINDOW_OVERLAP]
          - state_machines.ContinuityWindow.window_state.null_to_OPEN
          - entities.ContinuityWindow.fields.shell_id
          - entities.ContinuityWindow.fields.kind
        distinguishing_aspect: |
          The contended RESOURCE here is a CourseShell (one shell cannot be under
          two maintenance windows of the same kind at once) and the interval
          semantics are HALF-OPEN [start, end): a window that starts exactly when
          the previous one ends is legal. The companion instance contends a
          different resource entity — the AcademicTerm as a whole — under CLOSED
          interval semantics with a capacity of two, where the very same
          endpoint-touching case is a violation. The two instances therefore
          disagree on purpose about what "touching" means.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION; shell CS230-01 is OFFICIAL and PROVISIONED with no enrollments."
            - "One OPEN MAINTENANCE window already covers that shell from 2026-09-10T00:00:00Z to 2026-09-12T00:00:00Z."
            - "Every ContinuityWindow create bumps AcademicTerm.version, so the term's version is re-read immediately before each create; a REJECTED create leaves the version untouched."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              captures: { tv1: $.data.version }
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS230-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_before_w1: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "MAINTENANCE", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", expected_term_version: "${tv_before_w1}", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { w1_id: $.data.id, w1_state: $.data.window_state, w1_affected: $.data.affected_enrollment_count, w1_ext: $.data.extension_days_granted }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_after_w1: $.data.version }
          trigger:
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "MAINTENANCE", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-13T00:00:00Z", expected_term_version: "${tv_after_w1}", shell_id: "${shell_id}" }
              as: LmsAdmin
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "MAINTENANCE", window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-14T00:00:00Z", expected_term_version: "${tv_after_w1}", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { w3_id: $.data.id, w3_state: $.data.window_state }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_after_w3: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "EXTENSION", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", expected_term_version: "${tv_after_w3}", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { w4_id: $.data.id, w4_state: $.data.window_state, w4_ext: $.data.extension_days_granted }
            - call: "GET /continuity-windows"
              payload: { shell_id: "${shell_id}", window_state: "OPEN" }
              as: LmsAdmin
              captures: { first_open_kind: "$.data[0].kind" }
          assert:
            - "${w1_state} == OPEN, ${w1_affected} == 0 (shell-scoped windows snapshot shell.active_enrollment_count) and ${w1_ext} == 0 (kind MAINTENANCE)"
            - "${tv_after_w1} == ${tv_before_w1} + 1 — creating a window bumps the TERM's version, not just the window's"
            - "trigger call 1 ([09-11, 09-13) against [09-10, 09-12)) genuinely intersects and returns ERR_WINDOW_OVERLAP (409); the term's version is unchanged, which is why call 2 can reuse ${tv_after_w1}"
            - "trigger call 2 ([09-12, 09-14) starting exactly at the incumbent's end) is ACCEPTED: ${w3_state} == OPEN — half-open semantics make the shared endpoint non-overlapping"
            - "${w4_state} == OPEN — a fully covering interval of a DIFFERENT kind (EXTENSION) is accepted; the exclusion is scoped to (shell_id, kind), not to the shell alone"
            - "${w4_ext} == 2 — extension_days_granted is ceil((2026-09-12 - 2026-09-10) / 86400) = 2 for kind EXTENSION and stays 0 for the two MAINTENANCE rows"
            - "GET /continuity-windows filtered by shell_id and window_state=OPEN returns exactly 3 rows (${w1_id}, ${w3_id}, ${w4_id}) and ${first_open_kind} == MAINTENANCE (created_at ASC)"
            - "no window is created for the rejected request: a fourth row must not exist"

      - name: term_wide_outage_windows_use_closed_intervals_with_a_concurrency_cap_of_two
        grounds:
          - validations[priority=40]
          - errors[ERR_CONTINUITY_CAP_EXCEEDED]
          - state_machines.ContinuityWindow.window_state.null_to_OPEN
          - state_machines.ContinuityWindow.window_state.OPEN_to_CLOSED
        distinguishing_aspect: |
          The contended RESOURCE is the AcademicTerm's overall continuity
          capacity, not a single shell, and the semantics are CLOSED intervals
          with a cap of MAX_CONCURRENT_OUTAGE_WINDOWS (2): two overlapping OUTAGE
          windows are fine, a third that touches both is not, and a window that
          merely SHARES AN ENDPOINT counts as intersecting — the exact opposite of
          the half-open shell-scoped rule in the companion instance. It is also an
          aggregate rule: each individual window is legal on its own, and closing
          one incumbent immediately frees capacity for a previously rejected
          request.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with no shells at all, so nothing but the aggregate rule can reject a window."
            - "Two OPEN term-wide OUTAGE windows already exist and overlap each other: W1 [2026-09-10, 2026-09-20] and W2 [2026-09-15, 2026-09-25]. Two concurrent windows is exactly the cap."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              captures: { tv_before_w1: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_term_version: "${tv_before_w1}" }
              as: LmsAdmin
              captures: { w1_id: $.data.id }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_before_w2: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-25T00:00:00Z", expected_term_version: "${tv_before_w2}" }
              as: LmsAdmin
              captures: { w2_id: $.data.id, w2_state: $.data.window_state }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_at_cap: $.data.version }
          trigger:
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-18T00:00:00Z", window_end: "2026-09-28T00:00:00Z", expected_term_version: "${tv_at_cap}" }
              as: LmsAdmin
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-22T00:00:00Z", expected_term_version: "${tv_at_cap}" }
              as: LmsAdmin
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-26T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_term_version: "${tv_at_cap}" }
              as: LmsAdmin
              captures: { w5_id: $.data.id, w5_state: $.data.window_state }
            - call: "POST /continuity-windows/${w2_id}/transitions"
              payload: { action: "CLOSE" }
              as: LmsAdmin
              captures: { w2_closed: $.data.window_state }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: LmsAdmin
              captures: { tv_after_close: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-22T00:00:00Z", expected_term_version: "${tv_after_close}" }
              as: LmsAdmin
              captures: { w6_id: $.data.id, w6_state: $.data.window_state }
          assert:
            - "${w2_state} == OPEN — two mutually overlapping OUTAGE windows are legal; the cap is 2, not 1"
            - "trigger call 1 ([09-18, 09-28] intersects BOTH incumbents) returns ERR_CONTINUITY_CAP_EXCEEDED (422)"
            - "trigger call 2 ([09-20, 09-22]) also returns ERR_CONTINUITY_CAP_EXCEEDED (422): it overlaps W2 normally and touches W1 at exactly 2026-09-20T00:00:00Z, and under CLOSED intervals a shared endpoint counts. A half-open implementation would see only one intersector and wrongly accept this request — this is the discriminating case"
            - "trigger call 3 ([09-26, 09-30], strictly after W2's end) is accepted with ${w5_state} == OPEN, proving the rule is interval-scoped and not a global per-term ceiling"
            - "${w2_closed} == CLOSED and ${tv_after_close} == ${tv_at_cap} + 1 (the accepted call 3 bumped the term; CLOSE bumps only the window)"
            - "the retry of the identical [09-20, 09-22] request after W2 closed is ACCEPTED (${w6_state} == OPEN) — only OPEN windows consume capacity, so a rejection is never permanent"
            - "GET /continuity-windows filtered by term_id and window_state=OPEN returns 3 rows (${w1_id}, ${w5_id}, ${w6_id}) and W2 is excluded"
            - "no ContinuityWindow row is created by either rejected request, and AcademicTerm.${term_id}.version is bumped exactly twice across the whole trigger block"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: merge_apply_and_reverse_conserve_the_terms_active_student_headcount_at_thirteen
        grounds:
          - calculations.enrollment_seat_ledger
          - state_machines.MergeRequest.merge_state.APPROVED_to_APPLIED
          - state_machines.MergeRequest.merge_state.APPLIED_to_REVERSED
          - state_machines.CourseShell.provisioning_state.PROVISIONED_to_MERGED
          - state_machines.CourseShell.provisioning_state.MERGED_to_PROVISIONED
          - entities.MergeRequest.fields.seat_ledger_before
          - entities.MergeRequest.fields.seat_ledger_after
          - entities.AcademicTerm.fields.total_active_enrollments
        distinguishing_aspect: |
          The conserved quantity is an INTEGER HEADCOUNT — the term's
          total_active_enrollments, pinned at 13 — and it is conserved across BOTH
          directions: the APPLY relocates rows between two shells (parent 8 / child
          5 -> parent 13 / child 0) and the REVERSE puts them back, with the term
          total never moving at all. The entity carries its own audit of the
          invariant in seat_ledger_before / seat_ledger_after. The other two
          compensating instances conserve a decimal storage quantity and a decimal
          points ledger respectively, and neither has a two-sided relocation.
        setup_note: "The thirteen enrollments arrive through one SIS batch so the pre-merge distribution is created in a single reconciled operation."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION. Parent shell CS500-01 (base_seat_cap 10) and child shell CS500-02 (base_seat_cap 6) are both OFFICIAL and PROVISIONED in that term."
            - "One SIS batch adds 8 STUDENT rows to the parent and 5 to the child, so parent.active_enrollment_count == 8, child.active_enrollment_count == 5 and term.total_active_enrollments == 13."
            - "Two distinct LmsAdmin user ids exist: adm-1 submits the MergeRequest and adm-2 decides it, satisfying segregation of duties."
