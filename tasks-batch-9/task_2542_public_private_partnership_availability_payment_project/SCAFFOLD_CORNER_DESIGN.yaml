      - name: every_entity_is_readable_by_id_after_the_full_workflow
        claim_type: retrieval
        grounds:
          - endpoints[GET /ppp/concessionaires/{id}]
          - endpoints[GET /ppp/drawdown-milestones/{id}]
          - endpoints[GET /ppp/performance-reports/{id}]
          - endpoints[GET /ppp/deduction-events/{id}]
