      - name: discretionary_scope_gate_reads_a_posture_computed_earlier_in_the_same_pipeline
        claim_type: cascading_validation
        grounds: ["validations[priority=21]", "errors[ERR_SCOPE_FROZEN]", "calculations.outage_schedule_posture", "calculations.work_order_priority_score"]
        distinguishing_aspect: "The priority-21 check cannot be evaluated until two earlier results exist: the work order's own computed priority band and the outage's schedule_posture, itself derived from the critical-path walk. With a 100-hour target and a 200-hour activity the posture is RECOVERY_REQUIRED, so the DISCRETIONARY order is frozen out while the HIGH order in the same outage approves normally."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 with duration_target_hours 100 and one unlinked 200-hour activity, so projected_duration_hours is 200.00, above the 110.00 ceiling, and schedule_posture is RECOVERY_REQUIRED."
            - "WO-D: MAINTENANCE, 1 hour -> 20 + round_half_up(1 / 100 * 300, 2) = 20 + 3.00 = 23.00, band DISCRETIONARY."
            - "WO-H: MAINTENANCE, 10 hours -> 20 + min(30, 30.00) = 50.00, band HIGH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 100, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
