        grounds: ["roles.CaseManager", "roles.PlatformAdmin.exclusive_operations", "errors[ERR_UNAUTHORIZED]", "validations[priority=2]"]
        distinguishing_aspect: "Adjudication is a PlatformAdmin exclusive operation: a CaseManager calling POST /referrals/{id}/review is refused with ERR_UNAUTHORIZED 403 and the referral stays SUBMITTED."
        test_recipe:
          setup: ["One PartnerAgency, one Client and one SUBMITTED Referral."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Verity Lane Aid", county: "CENTRAL", quarterly_voucher_quota: 4 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /clients"
              payload: { agency_id: "${ag_id}", household_size: 4, county: "CENTRAL", has_infant: false }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { cl_id: "$.data.id" }
            - call: "POST /referrals"
              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
