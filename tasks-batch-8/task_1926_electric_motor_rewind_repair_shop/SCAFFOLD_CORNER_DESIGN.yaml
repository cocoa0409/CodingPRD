            - call: "POST /shops/${shop_id}/work-orders/${wv1}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${wv1}"
              as: Estimator
              captures: { wv1v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/quotes"
              payload: { expected_work_order_version: "${wv1v}" }
              as: Estimator
              captures: { qv1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/quotes/${qv1}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/quotes/${qv1}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.81, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
              captures: { tr1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 23, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.43 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wv1}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.8, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
              captures: { tr2: $.data.id }
          assert:
            - "TestRecord.${tr1}.verdict == FAIL   # 2.81 > 2.8 limit (frame 315 <= 315 -> small tier)"
            - "After the FAIL record the work order auto-loops to IN_REWIND; the fresh coil-data record moves it to BALANCING"
            - "TestRecord.${tr2}.verdict == PASS   # 2.8 <= 2.8 boundary passes"
            - "WorkOrder.${wv1}.status == FINAL_TEST after the second FINAL record"

