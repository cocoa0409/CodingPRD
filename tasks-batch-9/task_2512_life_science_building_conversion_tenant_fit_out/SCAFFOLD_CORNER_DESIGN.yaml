            - "${c1} == 0.00"
            - "${c2} == 0.00"
            - "PhasePackage.${ph_3_id}.ti_eligible_usd == 286875.00"
            - "PhasePackage.${ph_1_id}.ti_eligible_usd == 60000.00"
            - "PhasePackage.${ph_2_id}.ti_eligible_usd == 80240.00"
            - "Lease.${l_id}.ti_committed_usd == 200000.00"
            - "Lease.${l_id}.ti_uncommitted_usd == 0.00"

      - name: suitability_variant_divergence_on_identical_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.suitability_score.variants
        excluded_because:
          difficulty_instance: assessment_screening_vs_investigation_divergence
          rationale: "That §1.8 instance is exactly the divergence test: identical inputs, 78.0/SUITABLE under SCREENING versus 33.0/UNSUITABLE under INVESTIGATION, with the shared structural_credit and utility_headroom_ratio pinned."

      - name: hazmat_two_basis_divergence_on_the_same_rows
        claim_type: variant_divergence
        grounds:
          - calculations.floor_hazmat_utilization.variants
        excluded_because:
          difficulty_instance: hazmat_per_control_area_vs_aggregate_floor_basis
          rationale: "The PER_CONTROL_AREA versus AGGREGATE_FLOOR delta (94.44 % against 27.78 % on the same permit rows) is that §1.8 instance's entire subject."

      - name: provisional_to_final_authorization_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.ti_final_allowance
        excluded_because:
          difficulty_instance: ti_allowance_tier_selected_on_provisional_not_final_authorization
          rationale: "The provisional-to-final switch and the ledger values it freezes (premium 67.50, provisional 5021500.00, credit 3.00, final 204.50, authorized 4948900.00, escrow 250000.00) are asserted there."

      - name: draw_allocation_rounds_each_line_then_places_the_residual
        claim_type: precision
        grounds:
          - calculations.ti_draw_allocation
        excluded_because:
          difficulty_instance: ti_draw_per_line_rounding_then_residual_to_largest_committed
          rationale: "Per-line half-up rounding and the +0.01 residual landing on the largest committed line are pinned by that §1.8 instance with exact literals."

      - name: capacity_pool_aggregation_excludes_cancelled_reservations
        claim_type: input_set_filtering
        grounds:
          - calculations.building_capacity_pools
        excluded_because:
          difficulty_instance: reservation_cancel_restores_building_pools_without_drift
          rationale: "That §1.8 instance already shows CANCELLED reservations leaving both buckets and the pools returning to exactly 80000.00 / 1200.00."

      - name: maq_threshold_boundary_at_the_allowance
        claim_type: correct_result
        grounds:
          - calculations.floor_control_area_allowance
          - calculations.floor_hazmat_utilization
        excluded_because:
          difficulty_instance: hazmat_maq_boundary_180_00_accepted_180_01_rejected
          rationale: "The threshold algorithm's at-boundary and one-cent-over cases are asserted there; repeating them would duplicate the same two calls."

      - name: weighted_score_band_boundary_on_height_credit
        claim_type: correct_result
        grounds:
          - calculations.suitability_score.constants.HEIGHT_MARGINAL_FT
        excluded_because:
          difficulty_instance: suitability_height_boundary_12_50_scores_68_0_and_12_49_caps_to_49_0
          rationale: "The 12.50 / 12.49 band edge, including the hard-fail cap that bites only on the lower side, is that §1.8 instance's subject."

