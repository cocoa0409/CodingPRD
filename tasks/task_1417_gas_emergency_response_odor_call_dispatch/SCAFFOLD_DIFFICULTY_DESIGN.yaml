            - "RegulatoryReport.${rep_id}.incident_count == 1, determined_count == 1"
            - "RegulatoryReport.${rep_id}.compliant_count_adjusted == 1 and compliance_rate_adjusted == 1.0"
            - "RegulatoryReport.${rep_id}.compliant_count_raw == 0 and compliance_rate_raw == 0.0 (raw 4800 > 3600 — the two variants disagree on the same incident)"

      - name: zero_readings_blocks_make_safe_completion
        grounds:
          - validations[priority=7]
          - errors[ERR_ATMOSPHERIC_READING_REQUIRED]
          - state_machines.GasIncident.MAKE_SAFE_IN_PROGRESS_to_MONITORING
        distinguishing_aspect: |
          Empty-collection boundary (zero AtmosphericReadings) on a different
          metric and a different endpoint than the elapsed-threshold boundary:
          an odor-reported incident with zero readings cannot complete
