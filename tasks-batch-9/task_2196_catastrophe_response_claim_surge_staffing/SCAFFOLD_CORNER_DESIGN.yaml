          assert:
            - "HTTP 412 with data.error_id == 'ERR_STALE_EVENT_VERSION'"
            - "GET /loss-estimates?event_id=${ev} as CatastropheManager returns total_count == 0"
            - "GET /catastrophe-events/${ev} as CatastropheManager returns version == 2 and gross_loss_estimate == 0.00"

