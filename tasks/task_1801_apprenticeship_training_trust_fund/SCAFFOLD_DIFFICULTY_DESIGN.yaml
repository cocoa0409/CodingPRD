  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_vs_fiscal_purchase_approve
        grounds:
          - "validations[priority=6]"
          - "validations[priority=9]"
          - "errors[ERR_PURCHASE_NOT_REQUESTED]"
          - "errors[ERR_INSUFFICIENT_ALLOCATION_REMAINING]"
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving a DENIED purchase
          against an allocation whose remaining is 0 violates both the state gate
          and the fiscal gate; the state error ERR_PURCHASE_NOT_REQUESTED (p6)
          must win over ERR_INSUFFICIENT_ALLOCATION_REMAINING (p9).
        test_recipe:
          setup:
            - "Funded fund (received 500000). Allocation AL 10000 ACTIVE. Purchase P1 (10000) APPROVED so AL.remaining == 0. Purchase P2 (1 cent) DENIED."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 3, lines: [{ apprentice_id: "${app_id}", ojt_hours: 1000 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /contribution-reports/${rep_id}/remit"
              payload: { amount_tendered_cents: 500000 }
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 10000 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { alloc_id: $.data.id }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v: $.data.version }
            - call: "POST /funding-allocations/${alloc_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v}" }
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "POST /equipment-purchases"
              payload: { allocation_id: "${alloc_id}", description: "Conduit bender", amount_cents: 10000 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { pur1_id: $.data.id }
            - call: "POST /equipment-purchases/${pur1_id}/approve"
              payload: {}
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "POST /equipment-purchases"
              payload: { allocation_id: "${alloc_id}", description: "Wire nuts box", amount_cents: 1 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { pur2_id: $.data.id }
            - call: "POST /equipment-purchases/${pur2_id}/deny"
              payload: { reason: "not in plan" }
              as: CommitteeMember
              as_user_id: "cm-1"
          trigger:
            - call: "POST /equipment-purchases/${pur2_id}/approve"
              payload: {}
              as: CommitteeMember
              as_user_id: "cm-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PURCHASE_NOT_REQUESTED (state p6 beats fiscal p9)"
            - "FundingAllocation.${alloc_id}.remaining_cents == 0 (fiscal gate was also violated, yet not reported)"
            - "EquipmentPurchase.${pur2_id}.status == DENIED (unchanged)"

      - name: priority_sod_vs_fiscal_allocation_approve
        grounds:
          - "validations[priority=7]"
          - "validations[priority=9]"
          - "errors[ERR_SELF_APPROVAL_FORBIDDEN]"
          - "errors[ERR_INSUFFICIENT_FUND_AVAILABLE]"
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (different pair than
          the state-vs-fiscal instance): approving one's own allocation proposal
          for more than the fund's available balance violates both SoD and the
          fiscal gate; ERR_SELF_APPROVAL_FORBIDDEN (p7) must win.
        test_recipe:
          setup:
            - "Fund with zero contributions (available_cents == 0). Allocation A of 1000000 cents proposed by user admin-1."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 1000000 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { alloc_id: $.data.id }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /funding-allocations/${alloc_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v}" }
              as: CommitteeMember
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SELF_APPROVAL_FORBIDDEN (compliance p7 beats fiscal p9)"
            - "HTTP status == 403"
            - "FundingAllocation.${alloc_id}.status == PROPOSED (unchanged)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
