      - name: indicator_periods_must_tile_without_gap_or_overlap
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - entities.IndicatorReport.fields.period_start
        distinguishing_aspect: |
          Closed-interval tiling semantics on the INSTITUTION resource (different
          resource and different interval arithmetic than the buffered half-open
          reviewer windows): an overlapping period is rejected
          ERR_REPORT_PERIOD_OVERLAP, a non-adjacent period is rejected
          ERR_REPORT_PERIOD_GAP, and only the exactly-adjacent successor
          (period_start == latest period_end + 1 day) is accepted.
        test_recipe:
          setup:
            - "Institution with one indicator report covering the closed interval [2026-01-01, 2026-12-31]."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_rep1_new
          trigger:
            - call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2026-07-01", period_end: "2027-06-30" }
              as: CommissionStaff
              captures: { err_overlap: $.data.error_id }
            - call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2027-02-01", period_end: "2028-01-31" }
              as: CommissionStaff
              captures: { err_gap: $.data.error_id }
            - call: "POST /accreditation/institutions/${inst_id}/indicator-reports"
              payload: { period_start: "2027-01-01", period_end: "2027-12-31" }
              as: CommissionStaff
              captures: { rep2_status: $.data.status }
          assert:
            - "overlapping period fails with err_overlap == ERR_REPORT_PERIOD_OVERLAP (HTTP 409 — closed intervals share 2026-07-01..2026-12-31)"
            - "gapped period fails with err_gap == ERR_REPORT_PERIOD_GAP (HTTP 422 — 2027-02-01 is not 2026-12-31 + 1 day)"
            - "exactly-adjacent period succeeds: rep2_status == DUE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reviewer_load_conserved_through_decline_and_replacement
        grounds:
          - state_machines.TeamAssignment.PENDING_to_DECLINED
          - entities.Reviewer.fields.current_assignment_count
          - calculations.reviewer_selection_ranking
        distinguishing_aspect: |
          Conserved quantity = reviewer concurrent load: assembly raises
          rev_m4's current_assignment_count to exactly 1; the compensating
          DECLINE returns it to exactly 0 while the selector's replacement
          assignment keeps the team seat count conserved (4 ACTIVE seats:
          3 ACCEPTED + 1 PENDING replacement for the next-ranked candidate).
        test_recipe:
          setup:
            - "CANDIDATE institution; cycle EVALUATION_ACTIVE; team assembled with 4 PENDING assignments; a fifth eligible reviewer (Eve Reserve) registered after assembly so the replacement selector has exactly one candidate."
          setup_api_calls:
            - *a_clock
            - *a_inst_priv
            - *a_elig_new
            - *a_elig_file
            - *a_elig_ok
            - *a_cyc_new
            - *a_cyc_adv1
            - *a_arg_new
            - *a_ev_m1
            - *a_ev_m2
            - *a_ev_m3
            - *a_ev_i1
            - *a_ev_i2
            - *a_ev_i3
            - *a_ev_tq1
            - *a_ev_tq2
            - *a_ev_tq3
            - *a_ev_tq4
            - *a_ev_te1
            - *a_ev_te2
            - *a_ev_te3
            - *a_ev_rp1
            - *a_ev_rp2
            - *a_ev_rp3
            - *a_arg_sub
            - *a_cyc_adv2
            - *a_rev_chair
            - *a_rev_m2
            - *a_rev_m3
            - *a_rev_m4
            - *a_team_new
            - *a_asg_chair
            - *a_asg_m2
            - *a_asg_m3
            - *a_asg_m4
            - call: "POST /accreditation/reviewers"
              payload: { full_name: "Eve Reserve", specialty_criteria: ["CRIT_MISSION"], quality_rating: 2.50, prior_chair_count: 0 }
              as: CommissionStaff
              captures: { rev_m5_id: $.data.id }
            - call: "GET /accreditation/reviewers/${rev_m4_id}"
              payload: {}
              as: CommissionStaff
              captures: { m4_load_pre: $.data.current_assignment_count }
          trigger:
            - call: "POST /accreditation/team-assignments/${asg_m4}/respond"
