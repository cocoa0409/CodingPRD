# =============================================================================
# Shed & Accessory Structure Sales/Installation — PRD Benchmark Seed Tables
# =============================================================================

scenario: |
  Shed & Accessory Structure Sales/Installation (backyard shed dealer): model configuration & site suitability check, permit/setback determination by jurisdiction, delivery access assessment & site prep requirement, on-site build vs pre-built delivery, rent-to-own financing & payment tracking, anchoring/foundation options & code compliance, warranty & service call, removal/trade-in of old structure

domain_name: shed-accessory-structure-sales
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration      # configurable multi-step pipeline: configure -> site check -> permit -> schedule -> deliver/build -> pay
  secondary_archetype: compliance_audit          # permit/setback determination, anchor/foundation code compliance, jurisdiction rule pinning
  complexity_layers:
    - optimistic_concurrency          # OCC on Order.version and Jurisdiction.version
    - cascading_side_effects          # assessment report -> order advance -> permit determination -> order advance; permit denial -> order revert
    - derived_field_reconciliation    # Order.collected_cents / RtoContract.remaining_balance_cents recomputed from Payment rows
    - version_pinning_on_approval     # PermitApplication pins jurisdiction rule version; decisions on stale rule sets rejected
  entity_topology: flat               # peer entities joined by FKs; no nested URL ownership trees
  state_machine_shape: branching      # Order forks on delivery_mode/purchase_type and reverts on failed checks; RtoContract and ServiceTicket add cycles
  relationship_patterns:
    - one_to_many                     # Order -> SiteAssessment/PermitApplication/Payment/ServiceTicket
    - cross_aggregate                 # Payment -> RtoContract; PermitApplication -> Jurisdiction (rule version pinned)
  role_model: peer_roles              # SalesRep / PermitCoordinator / InstallCrew / FinanceManager own different resource types; Customer is a self-service actor
  consistency_model: immediate        # every side effect is visible in the triggering request's response / subsequent GETs

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Jurisdiction display name (e.g., county + state)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: county_name, type: string, source: input, description: "County name" }
      - { name: permit_threshold_sqft, type: integer, source: input, description: "Permit required when Order.area_sqft >= this threshold (inclusive)" }
      - { name: setback_front_ft, type: number, source: input, description: "Required front setback in feet" }
      - { name: setback_side_ft, type: number, source: input, description: "Required side setback in feet" }
      - { name: setback_rear_ft, type: number, source: input, description: "Required rear setback in feet" }
      - { name: max_building_height_ft, type: number, source: input, description: "Maximum accessory-structure height in feet" }
      - { name: anchoring_required, type: boolean, source: input, description: "Whether wind-code anchoring is mandatory (Order.anchor_type must not be NONE)" }
      - { name: permit_base_fee_cents, type: integer, source: input, description: "Flat permit fee component in cents" }
      - { name: permit_per_sqft_cents, type: integer, source: input, description: "Per-square-foot permit fee component in cents" }
      - { name: tax_rate_bp, type: integer, source: input, description: "Sales tax rate in basis points, applied to structure + options only" }

  - name: StructureModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model display name" }
      - { name: sku, type: string, source: input, description: "Catalog SKU" }
      - { name: min_width_ft, type: number, source: input, description: "Smallest configurable width in feet (inclusive)" }
      - { name: max_width_ft, type: number, source: input, description: "Largest configurable width in feet (inclusive)" }
      - { name: min_depth_ft, type: number, source: input, description: "Smallest configurable depth in feet (inclusive)" }
      - { name: max_depth_ft, type: number, source: input, description: "Largest configurable depth in feet (inclusive)" }
      - { name: wall_height_ft, type: number, source: input, description: "Wall height in feet" }
      - { name: supported_delivery_modes, type: array, source: input, description: "Subset of [PRE_BUILT, ON_SITE_BUILD] this model supports" }
      - { name: base_price_cents, type: integer, source: input, description: "Price in cents at base area = min_width_ft * min_depth_ft" }
      - { name: overage_rate_tier1_cents, type: integer, source: input, description: "Per-sqft cents for the first 40 sqft above base area" }
      - { name: overage_rate_tier2_cents, type: integer, source: input, description: "Per-sqft cents for area above base area + 40 sqft" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: street, type: string, source: input, description: "Site street address" }
      - { name: city, type: string, source: input, description: "Site city" }
      - { name: state_code, type: string, source: input, description: "Site state code" }
      - { name: zip, type: string, source: input, description: "Site ZIP code" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: model_id, type: string, source: input, description: "FK -> StructureModel.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governing rule set for permit/setback/anchor/tax" }
      - { name: width_ft, type: number, source: input, description: "Configured width in feet; within model min/max" }
      - { name: depth_ft, type: number, source: input, description: "Configured depth in feet; within model min/max" }
      - { name: area_sqft, type: number, source: computed, description: "= width_ft * depth_ft" }
      - { name: options, type: array, source: input, default: [], description: "Subset of [WINDOW, LOFT, RAMP, ELECTRICAL]" }
      - { name: delivery_mode, type: enum, source: input, description: "PRE_BUILT | ON_SITE_BUILD; must be in model.supported_delivery_modes" }
      - { name: foundation_type, type: enum, source: input, description: "GRAVEL_PAD | CONCRETE_SLAB | PIERS | NONE" }
      - { name: anchor_type, type: enum, source: input, description: "AUGER_STRAP | NONE; NONE rejected when jurisdiction.anchoring_required" }
      - { name: purchase_type, type: enum, source: input, description: "CASH | RTO (rent-to-own)" }
      - { name: rto_term_months, type: integer, source: input, description: "Contract term; required iff purchase_type == RTO; 12..60" , constraints: "12 <= n <= 60" }
      - { name: removal_requested, type: boolean, source: input, default: false, description: "Whether the crew removes the customer's old structure" }
      - { name: old_structure_area_sqft, type: number, source: input, description: "Old structure footprint; required iff removal_requested" }
      - { name: trade_in_appraised_cents, type: integer, source: input, description: "Appraised trade-in value of old structure in cents; optional" }
      - { name: site_prep_required, type: boolean, source: system, default: false, description: "Set when latest SiteAssessment verdict == SUITABLE_WITH_PREP" }
      - { name: site_prep_fee_cents, type: integer, source: system, default: 0, description: "Prep fee copied from SiteAssessment.prep_cost_cents when verdict == SUITABLE_WITH_PREP" }
      - { name: structure_price_cents, type: integer, source: computed, description: "Tiered model price per calculations.order_total_price" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Estimate at create/amend (CASH: subtotal+tax; RTO: contract total); see calculations.order_total_price" }
      - { name: final_total_cents, type: integer, source: computed, description: "Finalized at completion (identical formula, recomputed at COMPLETED)" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for kind IN {DEPOSIT, BALANCE} on this order" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for kind == REFUND on this order" }
      - { name: retained_cents, type: integer, source: system, default: 0, description: "Fees retained on cancellation per calculations.cancellation_refund" }
      - { name: status, type: enum, source: system, description: "DRAFT | SITE_REVIEW | PERMIT_REVIEW | READY_TO_SCHEDULE | SCHEDULED | IN_PROGRESS | COMPLETED | CLOSED | CANCELLED" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date booked for delivery/build; set by schedule" }
      - { name: crew_id, type: string, source: system, description: "Crew identifier booked for scheduled_date; set by schedule" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp at completion" }
      - { name: warranty_ends_at, type: datetime, source: system, description: "= completed_at + 12 months" }
      - { name: structure_state, type: enum, source: system, default: "NOT_INSTALLED", description: "NOT_INSTALLED | INSTALLED | REPOSSESSION_PENDING | REPOSSESSED" }

  - name: SiteAssessment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; set from path on creation" }
      - { name: assessor_id, type: string, source: input, description: "Field assessor identifier (opaque)" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of site visit; must be >= current logical date" }
      - { name: window_start_hour, type: integer, source: input, description: "Visit occupies half-open 2h window [window_start_hour, window_start_hour+2); 6 <= h <= 20" , constraints: "6 <= h <= 20" }
      - { name: status, type: enum, source: system, description: "REQUESTED | REPORTED | CANCELLED" }
      - { name: measured_access_width_in, type: integer, source: input, description: "Narrowest delivery access point in inches; filed on report" }
      - { name: measured_slope_pct, type: number, source: input, description: "Ground slope percent; filed on report" }
      - { name: setback_front_ft, type: number, source: input, description: "Measured front setback in feet; filed on report" }
      - { name: setback_side_ft, type: number, source: input, description: "Measured side setback in feet; filed on report" }
      - { name: setback_rear_ft, type: number, source: input, description: "Measured rear setback in feet; filed on report" }
      - { name: ground_prep_needed, type: boolean, source: input, description: "Whether grading/prep work is required; filed on report" }
      - { name: prep_cost_cents, type: integer, source: input, description: "Quoted prep cost in cents; required iff ground_prep_needed" }
      - { name: verdict, type: enum, source: computed, description: "SUITABLE | SUITABLE_WITH_PREP | UNSUITABLE per calculations.site_suitability_verdict" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp of report" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; copied from order at determination" }
      - { name: jurisdiction_version, type: integer, source: system, description: "Jurisdiction.version pinned at determination; decisions rejected when stale" }
      - { name: area_sqft, type: number, source: system, description: "Order.area_sqft snapshot at determination" }
      - { name: permit_required, type: boolean, source: computed, description: "= area_sqft >= jurisdiction.permit_threshold_sqft (inclusive)" }
      - { name: fee_cents, type: integer, source: computed, description: "0 when not required; else base + area*per_sqft per calculations.permit_fee" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | NOT_REQUIRED | WITHDRAWN" }
      - { name: decision_note, type: string, source: input, description: "Optional note recorded on deny" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of approve/deny" }

  - name: RtoContract
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; one contract per RTO order, created at completion" }
      - { name: term_months, type: integer, source: system, description: "Copied from Order.rto_term_months" }
      - { name: total_contract_cents, type: integer, source: computed, description: "Per calculations.order_total_price RTO variant" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Per calculations.rto_payment_schedule" }
      - { name: final_payment_cents, type: integer, source: computed, description: "Remainder-absorbing last installment per calculations.rto_payment_schedule" }
      - { name: amount_applied_cents, type: integer, source: computed, default: 0, description: "Principal applied from RTO_PAYMENT rows (excludes late-fee portion)" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "= total_contract_cents - amount_applied_cents" }
      - { name: accrued_late_fees_cents, type: integer, source: system, default: 0, description: "Outstanding unpaid late fees" }
      - { name: written_off_cents, type: integer, source: system, default: 0, description: "Principal written off at DEFAULT" }
      - { name: delinquency_episodes, type: integer, source: system, default: 0, description: "Count of ACTIVE -> DELINQUENT transitions" }
      - { name: first_due_date, type: string, source: system, description: "= date(completed_at) + 30 days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | DEFAULTED | PAID_OFF" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: rto_contract_id, type: string, source: system, description: "FK -> RtoContract.id; set iff kind == RTO_PAYMENT, else null" }
      - { name: kind, type: enum, source: system, description: "DEPOSIT (first cash payment) | BALANCE (subsequent cash) | RTO_PAYMENT | REFUND (system-created on cancel)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (positive)" }
      - { name: method, type: enum, source: input, description: "CASH | CARD | CHECK" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; replay with identical payload returns original row" }
      - { name: applied_to_late_fees_cents, type: integer, source: computed, default: 0, description: "RTO only: portion applied to accrued late fees" }
      - { name: applied_to_principal_cents, type: integer, source: computed, default: 0, description: "RTO only: portion applied to principal balance" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the recorder" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order must be COMPLETED or CLOSED" }
      - { name: issue_description, type: string, source: input, description: "Customer-reported issue" }
      - { name: status, type: enum, source: system, description: "OPEN | SCHEDULED | RESOLVED" }
      - { name: crew_id, type: string, source: system, description: "Crew booked for the visit; set by schedule" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date of service visit; set by schedule" }
      - { name: in_warranty, type: boolean, source: computed, description: "= clock time at resolve <= order.warranty_ends_at" }
      - { name: parts_cents, type: integer, source: input, default: 0, description: "Parts cost in cents declared at resolve" }
      - { name: charge_cents, type: integer, source: computed, description: "0 when in_warranty; else SERVICE_CALL_BASE_CENTS + parts_cents" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolve" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Times this ticket has been reopened" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: SITE_REVIEW
        trigger: "POST /api/orders/{id}/submit-site-check"
        actor: SalesRep
        preconditions:
          - "scheduled_date >= current logical date (ERR_DATE_IN_PAST)"
          - "no assessor window conflict: another SiteAssessment with same assessor_id, same scheduled_date, status == REQUESTED and overlapping half-open 2h window (ERR_ASSESSOR_WINDOW_CONFLICT)"
        side_effects:
          - "create SiteAssessment (status=REQUESTED) linked to this order"
          - "increments Order.version by 1"

      - from: SITE_REVIEW
        to: PERMIT_REVIEW
        trigger: "system (automatic when the order's latest SiteAssessment is REPORTED with verdict IN {SUITABLE, SUITABLE_WITH_PREP})"
        actor: system
        preconditions: []
        side_effects:
          - "create PermitApplication for this order: jurisdiction_id + jurisdiction_version copied, area_sqft snapshot, permit_required and fee_cents computed"
          - "if verdict == SUITABLE_WITH_PREP: set site_prep_required=true, site_prep_fee_cents=assessment.prep_cost_cents, recompute quoted_total_cents"
          - "increments Order.version by 1"
          - "CASCADE LINK 2 (of rule transitive_cascade / assessment_report_to_ready_cascade): this PERMIT_REVIEW entry itself creates the PermitApplication"

      - from: PERMIT_REVIEW
        to: READY_TO_SCHEDULE
        trigger: "system (automatic when the order's PermitApplication becomes APPROVED, or is created NOT_REQUIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
          - "CASCADE LINK 3 (assessment_report_to_ready_cascade): PermitApplication creation with permit_required=false itself triggers this advance"

      - from: SITE_REVIEW
        to: DRAFT
        trigger: "system (automatic when the order's latest SiteAssessment is REPORTED with verdict == UNSUITABLE)"
        actor: system
        preconditions: []
        side_effects:
          - "order returns to DRAFT for reconfiguration; a later submit-site-check creates a NEW SiteAssessment"
          - "increments Order.version by 1"

      - from: PERMIT_REVIEW
        to: DRAFT
        trigger: "system (automatic when the order's PermitApplication becomes DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE LINK 2 (permit_denial_revert_cascade): the DENIED transition on PermitApplication itself triggers this revert"
          - "order returns to DRAFT for reconfiguration"
          - "increments Order.version by 1"

      - from: READY_TO_SCHEDULE
        to: SCHEDULED
        trigger: "POST /api/orders/{id}/schedule"
        actor: SalesRep
        preconditions:
          - "purchase_type == CASH requires collected_cents >= required deposit (calculations.deposit_requirement, ERR_DEPOSIT_INSUFFICIENT); purchase_type == RTO is exempt"
          - "scheduled_date >= current logical date (ERR_DATE_IN_PAST)"
          - "no crew whole-day conflict: no other Order with same crew_id, same scheduled_date, status IN {SCHEDULED, IN_PROGRESS} (ERR_CREW_DATE_CONFLICT)"
        side_effects:
          - "set scheduled_date, crew_id"
          - "increments Order.version by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/orders/{id}/start"
        actor: InstallCrew
        preconditions:
          - "current logical date >= scheduled_date"
        side_effects:
          - "increments Order.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/orders/{id}/complete"
        actor: InstallCrew
        preconditions: []
        side_effects:
          - "set completed_at (logical clock), warranty_ends_at = completed_at + 12 months"
          - "compute final_total_cents per calculations.order_total_price"
          - "structure_state -> INSTALLED"
          - "if purchase_type == RTO: create RtoContract (status=ACTIVE) with totals per calculations.rto_payment_schedule; that creation itself closes the order (see COMPLETED -> CLOSED)"
          - "increments Order.version by 1"

      - from: COMPLETED
        to: CLOSED
        trigger: "system (automatic when purchase_type == CASH and collected_cents - refunded_cents >= final_total_cents, or when purchase_type == RTO and its RtoContract exists with status == ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Order.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: "SalesRep | Customer (owner)"
        preconditions: []
        side_effects:
          - "compute retained_cents and refund per calculations.cancellation_refund"
          - "if refund > 0: create Payment (kind=REFUND); refunded_cents updated"
          - "increments Order.version by 1"

      - from: SITE_REVIEW
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: "SalesRep | Customer (owner)"
        preconditions: []
        side_effects:
          - "compute retained_cents and refund per calculations.cancellation_refund"
          - "if refund > 0: create Payment (kind=REFUND); refunded_cents updated"
          - "CONDITIONAL CASCADE: linked SiteAssessment with status == REQUESTED -> CANCELLED (REPORTED ones untouched)"
          - "increments Order.version by 1"

      - from: PERMIT_REVIEW
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: "SalesRep | Customer (owner)"
        preconditions: []
        side_effects:
          - "compute retained_cents and refund per calculations.cancellation_refund (includes non-refundable permit fee)"
          - "if refund > 0: create Payment (kind=REFUND); refunded_cents updated"
          - "CONDITIONAL CASCADE: linked PermitApplication with status == SUBMITTED -> WITHDRAWN"
          - "increments Order.version by 1"

      - from: READY_TO_SCHEDULE
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: "SalesRep | Customer (owner)"
        preconditions: []
        side_effects:
          - "compute retained_cents and refund per calculations.cancellation_refund (admin + permit fee + restock)"
          - "if refund > 0: create Payment (kind=REFUND); refunded_cents updated"
          - "increments Order.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel"
        actor: "SalesRep | Customer (owner)"
        preconditions: []
        side_effects:
          - "compute retained_cents and refund per calculations.cancellation_refund (admin + permit fee + restock)"
          - "if refund > 0: create Payment (kind=REFUND); refunded_cents updated"
          - "crew_id/scheduled_date freed (order no longer occupies the crew day)"
          - "increments Order.version by 1"

  - entity: SiteAssessment
    initial_state: REQUESTED
    terminal_states: [REPORTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: REPORTED
        trigger: "POST /api/site-assessments/{id}/report"
        actor: InstallCrew
        preconditions:
          - "ground_prep_needed == true requires prep_cost_cents present (ERR_INVALID_REQUEST)"
        side_effects:
          - "compute verdict per calculations.site_suitability_verdict"
          - "set reported_at (logical clock)"
          - "CASCADE LINK 1 (assessment_report_to_ready_cascade): verdict IN {SUITABLE, SUITABLE_WITH_PREP} -> Order SITE_REVIEW -> PERMIT_REVIEW (creates PermitApplication); verdict == UNSUITABLE -> Order SITE_REVIEW -> DRAFT"
          - "increments SiteAssessment.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "system (cascade when parent Order is cancelled while assessment still REQUESTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, NOT_REQUIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: NOT_REQUIRED
        trigger: "system (at creation, when permit_required == false)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE LINK 3 (assessment_report_to_ready_cascade): this creation outcome itself advances the Order PERMIT_REVIEW -> READY_TO_SCHEDULE"
        note: "Created directly in NOT_REQUIRED; recorded as the jurisdiction determination artifact"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/permit-applications/{id}/approve"
        actor: PermitCoordinator
        preconditions:
          - "jurisdiction_version == current Jurisdiction.version (ERR_STALE_RULE_SET — version pinning on approval)"
        side_effects:
          - "set decided_at (logical clock)"
          - "Order PERMIT_REVIEW -> READY_TO_SCHEDULE"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/permit-applications/{id}/deny"
        actor: PermitCoordinator
        preconditions:
          - "jurisdiction_version == current Jurisdiction.version (ERR_STALE_RULE_SET)"
        side_effects:
          - "set decided_at (logical clock), record decision_note"
          - "CASCADE LINK 1 (permit_denial_revert_cascade): this DENIED transition itself reverts Order PERMIT_REVIEW -> DRAFT"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system (cascade when parent Order is cancelled from PERMIT_REVIEW)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RtoContract
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (POST /api/billing/run observes an installment past its grace window per calculations.rto_delinquency_evaluation)"
        actor: system
        preconditions: []
        side_effects:
          - "delinquency_episodes += 1"
          - "accrue one late fee: accrued_late_fees_cents += round_half_up(monthly_payment_cents * LATE_FEE_BP / 10000)"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /api/rto-contracts/{id}/payments (cure: payment covers all past-due installments AND accrued_late_fees_cents)"
        actor: "FinanceManager | Customer (owner)"
        preconditions:
          - "payment application leaves zero unpaid past-due installments and zero accrued late fees"
        side_effects:
          - "remaining_balance_cents recomputed; delinquency_episodes retained as history"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /api/rto-contracts/{id}/payments (remaining_balance_cents reaches 0)"
        actor: "FinanceManager | Customer (owner)"
        preconditions: []
        side_effects: []

      - from: DELINQUENT
        to: PAID_OFF
        trigger: "POST /api/rto-contracts/{id}/payments (remaining_balance_cents reaches 0)"
        actor: "FinanceManager | Customer (owner)"
        preconditions: []
        side_effects: []

      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (POST /api/billing/run observes days since earliest unpaid due date >= DEFAULT_AFTER_DAYS)"
        actor: system
        preconditions: []
        side_effects:
          - "written_off_cents = remaining_balance_cents; remaining_balance_cents = 0"
          - "CASCADE: Order.structure_state INSTALLED -> REPOSSESSION_PENDING"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /api/service-tickets/{id}/schedule"
        actor: SalesRep
        preconditions:
          - "scheduled_date >= current logical date (ERR_DATE_IN_PAST)"
          - "no crew whole-day conflict across Orders (status IN {SCHEDULED, IN_PROGRESS}) and ServiceTickets (status == SCHEDULED) with same crew_id and scheduled_date (ERR_CREW_DATE_CONFLICT)"
        side_effects:
          - "set crew_id, scheduled_date"
          - "increments ServiceTicket.version by 1"

      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /api/service-tickets/{id}/resolve"
        actor: InstallCrew
        preconditions: []
        side_effects:
          - "set resolved_at (logical clock); compute in_warranty and charge_cents per calculations.warranty_charge"
          - "increments ServiceTicket.version by 1"

      - from: RESOLVED
        to: OPEN
        trigger: "POST /api/service-tickets/{id}/reopen"
        actor: Customer (owner)
        preconditions:
          - "current logical time <= resolved_at + 30 days AND <= order.warranty_ends_at (else ERR_INVALID_STATE)"
        side_effects:
          - "reopen_count += 1"
          - "increments ServiceTicket.version by 1"
        note: "cyclic machine: a ticket may reopen repeatedly within the warranty window"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-amend-stale-version
    parent_entity: Order
    write_endpoint: "PUT /api/orders/{id}"
    occ_field: "expected_order_version"
    description: |
      Amending an Order whose version has advanced since the client last
      observed it is rejected. A DRAFT order stays in DRAFT after an amend, so
      a second sequential amend carrying a stale expected_order_version sees an
      otherwise-valid state and would succeed without this OCC check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: jurisdiction-update-stale-version
    parent_entity: Jurisdiction
    write_endpoint: "PUT /api/jurisdictions/{id}"
    occ_field: "expected_jurisdiction_version"
    description: |
      Updating a Jurisdiction whose version has advanced since the client last
      observed it is rejected. Rule edits do not change the Jurisdiction's own
      state, so a second sequential update carrying a stale
      expected_jurisdiction_version would otherwise succeed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_price
    trigger: "Order create, Order amend (quoted_total_cents), Order complete (final_total_cents)"
    algorithm: tiered_pricing
    formula: |
      area_sqft = width_ft * depth_ft
      base_area = model.min_width_ft * model.min_depth_ft
      overage = max(0, area_sqft - base_area)
      tier1_sqft = min(overage, 40)
      tier2_sqft = max(0, overage - 40)
      structure_price_cents = model.base_price_cents
          + tier1_sqft * model.overage_rate_tier1_cents
          + tier2_sqft * model.overage_rate_tier2_cents
      options_total_cents = sum(OPTION_PRICE_CENTS[o] for o in options)
      delivery_fee_cents = DELIVERY_PREBUILT_CENTS if delivery_mode == PRE_BUILT else DELIVERY_ONSITE_CENTS
      foundation_fee_cents =
          GRAVEL_PAD   -> area_sqft * GRAVEL_PER_SQFT_CENTS
          CONCRETE_SLAB-> max(area_sqft * SLAB_PER_SQFT_CENTS, SLAB_MIN_CENTS)
          PIERS        -> ceil(width_ft / 4) * ceil(depth_ft / 4) * PIER_EACH_CENTS
          NONE         -> 0
      anchor_fee_cents =
          AUGER_STRAP  -> (4 + 2 * floor(area_sqft / 100)) * AUGER_EACH_CENTS
          NONE         -> 0
      prep_fee_cents = site_prep_fee_cents (0 until an assessment files SUITABLE_WITH_PREP)
      removal_fee_cents = removal_requested ? (REMOVAL_BASE_CENTS + old_structure_area_sqft * REMOVAL_PER_SQFT_CENTS) : 0
      trade_in_credit_cents = min(trade_in_appraised_cents or 0, floor(structure_price_cents * TRADE_IN_CAP_BP / 10000))
      subtotal_cents = max(0, structure_price_cents + options_total_cents + delivery_fee_cents
          + foundation_fee_cents + anchor_fee_cents + prep_fee_cents + removal_fee_cents - trade_in_credit_cents)
      tax_cents = round_half_up((structure_price_cents + options_total_cents) * jurisdiction.tax_rate_bp / 10000)
      EVALUATION ORDER (pinned): compute every fee line first, round each line to whole cents
      (round_half_up), then sum into subtotal; tax computed from rounded structure+options; total last.
      CASH variant:   total_cents = subtotal_cents + tax_cents
      RTO variant:    total_cents = round_half_up(subtotal_cents * RTO_FACTOR_BP / 10000) + tax_cents
    input_set: "The single Order being priced, its StructureModel and Jurisdiction; options, delivery_mode, foundation_type, anchor_type, removal/trade-in fields, site_prep_fee_cents"
    constants:
      OPTION_PRICE_CENTS: { WINDOW: 15000, LOFT: 25000, RAMP: 10000, ELECTRICAL: 40000 }
      DELIVERY_PREBUILT_CENTS: 25000
      DELIVERY_ONSITE_CENTS: 45000
      GRAVEL_PER_SQFT_CENTS: 800
      SLAB_PER_SQFT_CENTS: 1500
      SLAB_MIN_CENTS: 200000
      PIER_EACH_CENTS: 12000
      AUGER_EACH_CENTS: 7500
      REMOVAL_BASE_CENTS: 30000
      REMOVAL_PER_SQFT_CENTS: 500
      TRADE_IN_CAP_BP: 1500
      RTO_FACTOR_BP: 16000
    precision: "whole cents, round_half_up per fee line before summation"
    variants:
      - name: cash_purchase
        when: "Order.purchase_type == CASH"
        difference: "total = subtotal + tax (no contract multiplier)"
      - name: rent_to_own
        when: "Order.purchase_type == RTO"
        difference: "total = round_half_up(subtotal * 1.6) + tax; identical inputs therefore yield a higher total than cash_purchase"

  - name: rto_payment_schedule
    trigger: "RtoContract creation (Order completion with purchase_type == RTO)"
    algorithm: aggregation
    formula: |
      monthly_payment_cents = round_half_up(total_contract_cents / term_months)
      final_payment_cents = total_contract_cents - monthly_payment_cents * (term_months - 1)
      INVARIANT: monthly_payment_cents * (term_months - 1) + final_payment_cents == total_contract_cents
      ROUNDING ORDER (pinned): round the per-month installment FIRST, then derive the final
      installment as the remainder; summing rounded months equals the contract total exactly.
      late_fee_cents (per delinquency episode) = round_half_up(monthly_payment_cents * LATE_FEE_BP / 10000)
      due dates: due_k = date(completed_at) + 30*k days for k = 1..term_months
    input_set: "The RtoContract's total_contract_cents and term_months"
    constants:
      LATE_FEE_BP: 1000
      INSTALLMENT_INTERVAL_DAYS: 30
    precision: "whole cents, round_half_up"

  - name: permit_fee
    trigger: "PermitApplication creation (Order entering PERMIT_REVIEW)"
    algorithm: threshold
    formula: |
      permit_required = (area_sqft >= jurisdiction.permit_threshold_sqft)   # boundary is INCLUSIVE
      fee_cents = 0 if not permit_required
                else jurisdiction.permit_base_fee_cents + round_half_up(area_sqft * jurisdiction.permit_per_sqft_cents)
    input_set: "The order's area_sqft and its Jurisdiction rule row"
    precision: "whole cents, round_half_up"

  - name: site_suitability_verdict
    trigger: "POST /api/site-assessments/{id}/report"
    algorithm: threshold
    formula: |
      required_access_in =
          PRE_BUILT     -> order.width_ft * 12 + ACCESS_MARGIN_PREBUILT_IN
          ON_SITE_BUILD -> ACCESS_MARGIN_ONSITE_IN
      hard_fail = (measured setback_front_ft < jurisdiction.setback_front_ft)
               OR (measured setback_side_ft  < jurisdiction.setback_side_ft)
               OR (measured setback_rear_ft  < jurisdiction.setback_rear_ft)
               OR (measured_slope_pct > MAX_SLOPE_PCT)
               OR (measured_access_width_in < required_access_in)
      needs_prep = (NOT hard_fail) AND ((measured_slope_pct > PREP_SLOPE_PCT) OR ground_prep_needed)
      verdict = UNSUITABLE if hard_fail
              else SUITABLE_WITH_PREP if needs_prep
              else SUITABLE
    input_set: "The SiteAssessment measurements, the parent Order (delivery_mode, width_ft), and the Jurisdiction setbacks"
    constants:
      ACCESS_MARGIN_PREBUILT_IN: 12
      ACCESS_MARGIN_ONSITE_IN: 36
      MAX_SLOPE_PCT: 15
      PREP_SLOPE_PCT: 8
    precision: "setback and slope comparisons are strict (<, >); access comparison is inclusive (>= passes)"
    variants:
      - name: prebuilt_delivery
        when: "Order.delivery_mode == PRE_BUILT"
        difference: "access must fit the whole building: width_ft*12 + 12 inches"
      - name: onsite_build
        when: "Order.delivery_mode == ON_SITE_BUILD"
        difference: "access only needs a 36-inch material carry-in path; identical site measurements can flip the verdict"

  - name: deposit_requirement
    trigger: "POST /api/orders/{id}/schedule (CASH orders only)"
    algorithm: threshold
    formula: |
      required_deposit_cents = round_half_up(quoted_total_cents * DEPOSIT_BP / 10000)
      scheduling requires collected_cents >= required_deposit_cents   # boundary is INCLUSIVE
    input_set: "The Order's quoted_total_cents and collected_cents"
    constants:
      DEPOSIT_BP: 2000
    precision: "whole cents, round_half_up"

  - name: cancellation_refund
    trigger: "POST /api/orders/{id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      collected = order.collected_cents at time of cancel
      buckets in priority order:
        1. admin fee:           ADMIN_FEE_CENTS
        2. permit fee:          latest PermitApplication.fee_cents when its status IN {SUBMITTED, APPROVED}
                                AND order.status at cancel IN {PERMIT_REVIEW, READY_TO_SCHEDULE, SCHEDULED}; else 0
        3. restock fee:         round_half_up(structure_price_cents * RESTOCK_BP / 10000)
                                only when order.status at cancel IN {READY_TO_SCHEDULE, SCHEDULED}; else 0
      retained_cents = min(collected, bucket1 + bucket2 + bucket3)
      refund_cents   = collected - retained_cents
      INVARIANT (cash conservation): refund_cents + retained_cents == collected_cents
    input_set: "The Order (status, structure_price_cents, collected_cents) and its latest PermitApplication"
    constants:
      ADMIN_FEE_CENTS: 5000
      RESTOCK_BP: 1000
    precision: "whole cents, round_half_up"

  - name: rto_delinquency_evaluation
    trigger: "POST /api/billing/run"
    algorithm: chronological
    formula: |
      For each RtoContract with status IN {ACTIVE, DELINQUENT} (PAID_OFF and DEFAULTED excluded),
      processed in order of first_due_date ASC, tie-break created_at ASC:
        installments_due = count of k in 1..term_months with due_k + GRACE_DAYS < current logical date
        installments_covered = floor(amount_applied_cents / monthly_payment_cents)
        if status == ACTIVE AND installments_due > installments_covered:
            -> DELINQUENT; delinquency_episodes += 1; accrue one late fee
        if status == DELINQUENT AND current logical date - due_(installments_covered + 1) >= DEFAULT_AFTER_DAYS:
            -> DEFAULTED; written_off_cents = remaining_balance_cents; remaining_balance_cents = 0;
            Order.structure_state INSTALLED -> REPOSSESSION_PENDING
      Finally, for every Order with structure_state == REPOSSESSION_PENDING:
        structure_state -> REPOSSESSED (repossession executed during the sweep)
      INVARIANT (receivable conservation): amount_applied_cents + remaining_balance_cents + written_off_cents == total_contract_cents
    input_set: "All RtoContract rows with status IN {ACTIVE, DELINQUENT}"
    constants:
      GRACE_DAYS: 7
      DEFAULT_AFTER_DAYS: 45
    precision: "date arithmetic on whole ISO dates; boundary >= is inclusive for DEFAULT_AFTER_DAYS"

  - name: warranty_charge
    trigger: "POST /api/service-tickets/{id}/resolve"
    algorithm: threshold
    formula: |
      in_warranty = (current logical time <= order.warranty_ends_at)   # boundary INCLUSIVE
      charge_cents = 0 if in_warranty else SERVICE_CALL_BASE_CENTS + parts_cents
    input_set: "The ServiceTicket (parts_cents), the parent Order (warranty_ends_at), and the logical clock"
    constants:
      SERVICE_CALL_BASE_CENTS: 15000
      REOPEN_WINDOW_DAYS: 30
    precision: "whole cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint; Customer role may only act on resources whose Order.customer_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, value types correct, enum members valid, conditional requirements met (e.g., prep_cost_cents when ground_prep_needed, rto_term_months when purchase_type == RTO, old_structure_area_sqft when removal_requested)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids exist (validated left-to-right); body FK references (customer_id, model_id, jurisdiction_id, order_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: existence
    check: "OCC: expected_order_version / expected_jurisdiction_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /api/orders/{id}, PUT /api/jurisdictions/{id}"

  - priority: 6
    category: state
    check: "Target resource is in a state that allows the transition (e.g., amend only in DRAFT; report only from REQUESTED; payments only when order status IN {SITE_REVIEW, PERMIT_REVIEW, READY_TO_SCHEDULE, SCHEDULED, IN_PROGRESS, COMPLETED}; reopen window and warranty checks)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Code compliance: jurisdiction.anchoring_required == true forbids anchor_type == NONE"
    error_id: ERR_ANCHOR_REQUIRED
    http_status: 422
    applies_to: "POST /api/orders, PUT /api/orders/{id}"

  - priority: 8
    category: business_constraint
    check: "Configured width_ft/depth_ft within model [min,max] bounds"
    error_id: ERR_CONFIG_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /api/orders, PUT /api/orders/{id}"

  - priority: 9
    category: business_constraint
    check: "delivery_mode is in model.supported_delivery_modes"
    error_id: ERR_DELIVERY_MODE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /api/orders, PUT /api/orders/{id}"

  - priority: 10
    category: business_constraint
    check: "Assessor half-open 2h window overlap: same assessor_id + scheduled_date, status == REQUESTED, [h, h+2) intersect"
    error_id: ERR_ASSESSOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /api/orders/{id}/submit-site-check"

  - priority: 11
    category: business_constraint
    check: "Crew whole-day occupancy: same crew_id + scheduled_date already taken by an Order IN {SCHEDULED, IN_PROGRESS} or ServiceTicket IN {SCHEDULED}"
    error_id: ERR_CREW_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /api/orders/{id}/schedule, POST /api/service-tickets/{id}/schedule"

  - priority: 12
    category: business_temporal
    check: "scheduled_date >= current logical date"
    error_id: ERR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /api/orders/{id}/submit-site-check, POST /api/orders/{id}/schedule, POST /api/service-tickets/{id}/schedule"

  - priority: 13
    category: business_fiscal
    check: "CASH order deposit gate at schedule: collected_cents >= round_half_up(quoted_total_cents * 0.20)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /api/orders/{id}/schedule"

  - priority: 14
    category: business_fiscal
    check: "Payment amount must not exceed remaining amount due (order final/quoted balance or contract remaining_balance + accrued late fees)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /api/orders/{id}/payments, POST /api/rto-contracts/{id}/payments"

  - priority: 15
    category: business_fiscal
    check: "Cash payments rejected for purchase_type == RTO orders (payments belong on the RtoContract); RTO payments rejected for CASH orders / PAID_OFF / DEFAULTED contracts"
    error_id: ERR_ORDER_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /api/orders/{id}/payments, POST /api/rto-contracts/{id}/payments"

  - priority: 16
    category: business_referential
    check: "Permit decision requires application.jurisdiction_version == current Jurisdiction.version (version pinning on approval)"
    error_id: ERR_STALE_RULE_SET
    http_status: 409
    applies_to: "POST /api/permit-applications/{id}/approve, POST /api/permit-applications/{id}/deny"

  - priority: 17
    category: business_referential
    check: "idempotency_key reuse with a different amount_cents or method on the same order/contract"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /api/orders/{id}/payments, POST /api/rto-contracts/{id}/payments"

  - priority: 18
    category: business_referential
    check: "ServiceTicket creation requires the referenced Order status IN {COMPLETED, CLOSED}"
    error_id: ERR_ORDER_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /api/service-tickets"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Jurisdiction ---
  - method: POST
    path: "/api/jurisdictions"
    description: "Create a jurisdiction rule set"
    roles: [PermitCoordinator]
    code: 201
    input: [name, state_code, county_name, permit_threshold_sqft, setback_front_ft, setback_side_ft, setback_rear_ft, max_building_height_ft, anchoring_required, permit_base_fee_cents, permit_per_sqft_cents, tax_rate_bp]
    output: Jurisdiction
    side_effects: ["version=1"]

  - method: GET
    path: "/api/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: PUT
    path: "/api/jurisdictions/{id}"
    description: "Update jurisdiction rules (OCC-guarded); bumps version, which stales pinned PermitApplications"
    roles: [PermitCoordinator]
    code: 200
    input: [expected_jurisdiction_version, "name?", "state_code?", "county_name?", "permit_threshold_sqft?", "setback_front_ft?", "setback_side_ft?", "setback_rear_ft?", "max_building_height_ft?", "anchoring_required?", "permit_base_fee_cents?", "permit_per_sqft_cents?", "tax_rate_bp?"]
    output: Jurisdiction
    side_effects: ["increments Jurisdiction.version by 1", "previously created PermitApplications with older jurisdiction_version become stale"]

  - method: GET
    path: "/api/jurisdictions/{id}/permit-applications"
    description: "List permit applications determined under a jurisdiction"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: PermitApplication[]
    side_effects: []

  # --- StructureModel ---
  - method: POST
    path: "/api/models"
    description: "Create a structure model (catalog)"
    roles: [SalesRep]
    code: 201
    input: [name, sku, min_width_ft, max_width_ft, min_depth_ft, max_depth_ft, wall_height_ft, supported_delivery_modes, base_price_cents, overage_rate_tier1_cents, overage_rate_tier2_cents]
    output: StructureModel
    side_effects: []

  - method: GET
    path: "/api/models/{id}"
    description: "Get a structure model"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: StructureModel
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Register a customer"
    roles: [SalesRep]
    code: 201
    input: [full_name, email, phone, street, city, state_code, zip]
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Order ---
  - method: POST
    path: "/api/orders"
    description: "Create an order in DRAFT with model configuration"
    roles: [SalesRep]
    code: 201
    input: [customer_id, model_id, jurisdiction_id, width_ft, depth_ft, delivery_mode, foundation_type, anchor_type, purchase_type, "options?", "rto_term_months?", "removal_requested?", "old_structure_area_sqft?", "trade_in_appraised_cents?"]
    output: Order
    side_effects:
      - "status=DRAFT, structure_state=NOT_INSTALLED"
      - "compute area_sqft, structure_price_cents, quoted_total_cents per calculations.order_total_price (RTO variant when purchase_type == RTO)"

  - method: GET
    path: "/api/orders/{id}"
    description: "Get an order"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/orders"
    description: "List orders with filters and pagination"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: ["customer_id?", "model_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: PUT
    path: "/api/orders/{id}"
    description: "Amend order configuration (DRAFT only, OCC-guarded)"
    roles: [SalesRep]
    code: 200
    input: [expected_order_version, "width_ft?", "depth_ft?", "options?", "delivery_mode?", "foundation_type?", "anchor_type?", "rto_term_months?", "removal_requested?", "old_structure_area_sqft?", "trade_in_appraised_cents?"]
    output: Order
    side_effects:
      - "increments Order.version by 1"
      - "recompute area_sqft, structure_price_cents, quoted_total_cents"

  - method: POST
    path: "/api/orders/{id}/submit-site-check"
    description: "Submit order for site suitability check; creates a SiteAssessment"
    roles: [SalesRep]
    code: 201
    input: [assessor_id, scheduled_date, window_start_hour]
    output: SiteAssessment
    side_effects:
      - "Order DRAFT -> SITE_REVIEW"
      - "create SiteAssessment (status=REQUESTED)"

  - method: POST
    path: "/api/orders/{id}/schedule"
    description: "Book delivery/installation date and crew"
    roles: [SalesRep]
    code: 200
    input: [scheduled_date, crew_id]
    output: Order
    side_effects:
      - "Order READY_TO_SCHEDULE -> SCHEDULED"
      - "set scheduled_date, crew_id"

  - method: POST
    path: "/api/orders/{id}/start"
    description: "Crew starts delivery/build on or after scheduled_date"
    roles: [InstallCrew]
    code: 200
    input: []
    output: Order
    side_effects: ["Order SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/api/orders/{id}/complete"
    description: "Mark installation complete; finalizes pricing, warranty, and creates the RTO contract for RTO orders"
    roles: [InstallCrew]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order IN_PROGRESS -> COMPLETED; completed_at + warranty_ends_at set; final_total_cents computed"
      - "structure_state -> INSTALLED"
      - "purchase_type == RTO: create RtoContract (ACTIVE), then Order COMPLETED -> CLOSED"

  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel an order with refund waterfall"
    roles: [SalesRep, Customer]
    code: 200
    input: ["reason?"]
    output: Order
    side_effects:
      - "Order -> CANCELLED; retained_cents per calculations.cancellation_refund"
      - "if refund > 0: create REFUND Payment; refunded_cents updated"
      - "cascade: REQUESTED SiteAssessment -> CANCELLED; SUBMITTED PermitApplication -> WITHDRAWN"

  - method: POST
    path: "/api/orders/{id}/payments"
    description: "Record a cash payment (DEPOSIT if first, else BALANCE); idempotent on idempotency_key"
    roles: [FinanceManager, Customer]
    code: 201
    input: [amount_cents, method, idempotency_key]
    output: Payment
    side_effects:
      - "create Payment (kind=DEPOSIT | BALANCE); order_id set from path, rto_contract_id=null"
      - "recompute Order.collected_cents"
      - "if Order COMPLETED and collected_cents - refunded_cents >= final_total_cents: Order COMPLETED -> CLOSED"

  - method: GET
    path: "/api/orders/{id}/payments"
    description: "List payments for an order"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/api/payments/{id}"
    description: "Get a payment"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- SiteAssessment ---
  - method: GET
    path: "/api/orders/{id}/site-assessments"
    description: "List site assessments for an order (one per submit cycle)"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: SiteAssessment[]
    side_effects: []

  - method: GET
    path: "/api/site-assessments/{id}"
    description: "Get a site assessment"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: SiteAssessment
    side_effects: []

  - method: POST
    path: "/api/site-assessments/{id}/report"
    description: "File the assessor's measurements; computes verdict and cascades to the order"
    roles: [InstallCrew]
    code: 200
    input: [measured_access_width_in, measured_slope_pct, setback_front_ft, setback_side_ft, setback_rear_ft, ground_prep_needed, "prep_cost_cents?"]
    output: SiteAssessment
    side_effects:
      - "SiteAssessment REQUESTED -> REPORTED; verdict computed"
      - "verdict SUITABLE / SUITABLE_WITH_PREP -> Order SITE_REVIEW -> PERMIT_REVIEW and PermitApplication created (NOT_REQUIRED auto-advances order to READY_TO_SCHEDULE)"
      - "verdict UNSUITABLE -> Order SITE_REVIEW -> DRAFT"

  # --- PermitApplication ---
  - method: GET
    path: "/api/orders/{id}/permit-applications"
    description: "List permit applications for an order"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: PermitApplication[]
    side_effects: []

  - method: GET
    path: "/api/permit-applications/{id}"
    description: "Get a permit application"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: POST
    path: "/api/permit-applications/{id}/approve"
    description: "Approve a submitted permit (stale rule sets rejected)"
    roles: [PermitCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects:
      - "PermitApplication SUBMITTED -> APPROVED; decided_at set"
      - "Order PERMIT_REVIEW -> READY_TO_SCHEDULE"

  - method: POST
    path: "/api/permit-applications/{id}/deny"
    description: "Deny a submitted permit; order reverts to DRAFT"
    roles: [PermitCoordinator]
    code: 200
    input: ["decision_note?"]
    output: PermitApplication
    side_effects:
      - "PermitApplication SUBMITTED -> DENIED; decided_at set"
      - "Order PERMIT_REVIEW -> DRAFT"

  # --- RtoContract ---
  - method: GET
    path: "/api/orders/{id}/rto-contract"
    description: "Get the RTO contract for an order (array of 0 or 1)"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: RtoContract[]
    side_effects: []

  - method: GET
    path: "/api/rto-contracts/{id}"
    description: "Get an RTO contract"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: RtoContract
    side_effects: []

  - method: POST
    path: "/api/rto-contracts/{id}/payments"
    description: "Record an RTO payment; waterfall late fees then principal; may cure delinquency or pay off"
    roles: [FinanceManager, Customer]
    code: 201
    input: [amount_cents, method, idempotency_key]
    output: Payment
    side_effects:
      - "create Payment (kind=RTO_PAYMENT) with applied_to_late_fees_cents / applied_to_principal_cents"
      - "recompute contract amount_applied_cents, remaining_balance_cents, accrued_late_fees_cents"
      - "if fully cures: DELINQUENT -> ACTIVE; if remaining_balance_cents == 0: -> PAID_OFF"

  - method: GET
    path: "/api/rto-contracts/{id}/payments"
    description: "List payments applied to an RTO contract"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/api/billing/run"
    description: "Run the delinquency sweep as of the logical clock (per calculations.rto_delinquency_evaluation)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: "{ contracts_marked_delinquent: integer, contracts_defaulted: integer }"
    side_effects:
      - "ACTIVE contracts past grace -> DELINQUENT (+ late fee, + delinquency_episodes)"
      - "DELINQUENT contracts past DEFAULT_AFTER_DAYS -> DEFAULTED (write-off; Order.structure_state -> REPOSSESSION_PENDING)"
      - "Orders with structure_state == REPOSSESSION_PENDING -> REPOSSESSED (repossession executed during the sweep)"

  # --- ServiceTicket ---
  - method: POST
    path: "/api/service-tickets"
    description: "Open a warranty/service ticket for a completed order"
    roles: [Customer, SalesRep]
    code: 201
    input: [order_id, issue_description]
    output: ServiceTicket
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/api/service-tickets/{id}"
    description: "Get a service ticket"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []

  - method: GET
    path: "/api/orders/{id}/service-tickets"
    description: "List service tickets for an order"
    roles: [Customer, SalesRep, PermitCoordinator, InstallCrew, FinanceManager, OperationsAdmin]
    code: 200
    input: []
    output: ServiceTicket[]
    side_effects: []

  - method: POST
    path: "/api/service-tickets/{id}/schedule"
    description: "Schedule a service visit (crew whole-day occupancy shared with orders)"
    roles: [SalesRep]
    code: 200
    input: [crew_id, scheduled_date]
    output: ServiceTicket
    side_effects: ["ServiceTicket OPEN -> SCHEDULED; set crew_id, scheduled_date"]

  - method: POST
    path: "/api/service-tickets/{id}/resolve"
    description: "Resolve a scheduled ticket; warranty determines the charge"
    roles: [InstallCrew]
    code: 200
    input: ["parts_cents?"]
    output: ServiceTicket
    side_effects: ["ServiceTicket SCHEDULED -> RESOLVED; resolved_at, in_warranty, charge_cents set"]

  - method: POST
    path: "/api/service-tickets/{id}/reopen"
    description: "Reopen a resolved ticket within the 30-day window while warranty is active"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["ServiceTicket RESOLVED -> OPEN; reopen_count += 1"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [OperationsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent date/time evaluations use it"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or Customer acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that allows the requested transition (incl. cancel of IN_PROGRESS/COMPLETED/CLOSED, reopen window expired, payment on DRAFT/CANCELLED/CLOSED order)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_STALE_RULE_SET, http: 409, condition: "Permit decision attempted on an application whose pinned jurisdiction_version is stale" }
  - { id: ERR_ANCHOR_REQUIRED, http: 422, condition: "anchor_type NONE while jurisdiction.anchoring_required is true" }
  - { id: ERR_CONFIG_OUT_OF_BOUNDS, http: 422, condition: "width_ft/depth_ft outside model min/max bounds" }
  - { id: ERR_DELIVERY_MODE_UNSUPPORTED, http: 422, condition: "delivery_mode not in model.supported_delivery_modes" }
  - { id: ERR_DATE_IN_PAST, http: 422, condition: "scheduled_date before current logical date" }
  - { id: ERR_ASSESSOR_WINDOW_CONFLICT, http: 409, condition: "Overlapping half-open 2h assessor window for same assessor and date" }
  - { id: ERR_CREW_DATE_CONFLICT, http: 409, condition: "Crew already occupies the requested whole calendar date" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "CASH order scheduling without collected_cents >= 20% of quoted_total_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds remaining amount due" }
  - { id: ERR_ORDER_NOT_PAYABLE, http: 409, condition: "Cash payment on RTO order, or RTO payment on CASH order / terminal contract" }
  - { id: ERR_ORDER_NOT_COMPLETED, http: 409, condition: "Service ticket created for an order not yet COMPLETED/CLOSED" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The buyer; self-service on own orders, payments, and service tickets"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/service-tickets/{id}/reopen — reopen own resolved ticket"
    shared_operations:
      - "POST /api/orders/{id}/cancel — cancel own order"
      - "POST /api/orders/{id}/payments — pay own order"
      - "POST /api/rto-contracts/{id}/payments — pay own contract"
      - "POST /api/service-tickets — open ticket for own completed order"
      - "GET endpoints — read own resources"

  - name: SalesRep
    description: "Dealer sales staff; owns catalog, customers, orders, and scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/models — create structure models"
      - "POST /api/customers — register customers"
      - "POST /api/orders — create orders"
      - "PUT /api/orders/{id} — amend draft orders"
      - "POST /api/orders/{id}/submit-site-check"
      - "POST /api/orders/{id}/schedule"
      - "POST /api/service-tickets/{id}/schedule"
    shared_operations:
      - "POST /api/orders/{id}/cancel"
      - "POST /api/service-tickets"
      - "GET endpoints"

  - name: PermitCoordinator
    description: "Maintains jurisdiction rule sets and decides permit applications"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/jurisdictions"
      - "PUT /api/jurisdictions/{id}"
      - "POST /api/permit-applications/{id}/approve"
      - "POST /api/permit-applications/{id}/deny"
    shared_operations:
      - "GET endpoints"

  - name: InstallCrew
    description: "Field crews; file site assessments and perform installs/service"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/site-assessments/{id}/report"
      - "POST /api/orders/{id}/start"
      - "POST /api/orders/{id}/complete"
      - "POST /api/service-tickets/{id}/resolve"
    shared_operations:
      - "GET endpoints"

  - name: FinanceManager
    description: "Records payments and runs the delinquency sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/billing/run"
    shared_operations:
      - "POST /api/orders/{id}/payments"
      - "POST /api/rto-contracts/{id}/payments"
      - "GET endpoints"

  - name: OperationsAdmin
    description: "Platform operator; drives the logical clock for deterministic time"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
