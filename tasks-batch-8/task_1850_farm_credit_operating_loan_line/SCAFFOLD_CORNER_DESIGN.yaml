          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      - call: POST /loan-accounts/${loan}/submit
        as: LoanOfficer
      - call: POST /loan-accounts/${loan}/approve
        payload:
          approved_commitment_cents: 50000000
        as: CreditCommittee
        captures:
          loan_v: $.data.version
      - call: POST /crop-budgets
        payload:
          loan_account_id: ${loan}
          season_year: 2026
          crop_type: CORN
          acres: 4000
          projected_revenue_cents: 80000000
          projected_expenses_cents: 50000000
          expected_loan_version: ${loan_v}
        as: Borrower
        as_user_id: ${bor}
        captures:
          bud: $.data.id
      - call: POST /crop-budgets/${bud}/approve
        as: LoanOfficer
      - call: POST /collateral
        payload:
          loan_account_id: ${loan}
          collateral_type: REAL_ESTATE
          description: 640 acres
          appraised_value_cents: 60000000
        as: LoanOfficer
        captures:
          col: $.data.id
      - call: POST /ucc-filings
        payload:
          collateral_id: ${col}
          filing_number: UCC-26-001
          jurisdiction: STATE_UCC_OFFICE
          filed_date: '2026-03-05T00:00:00Z'
        as: LoanOfficer
      - call: POST /insurance-policies
        payload:
          borrower_id: ${bor}
          policy_number: POL-001
          crop_type: CORN
          county: BLACKHAWK
          coverage_start: '2026-03-01T00:00:00Z'
          coverage_end: '2027-03-01T00:00:00Z'
          coverage_amount_cents: 40000000
        as: LoanOfficer
        captures:
          pol: $.data.id
      - call: POST /insurance-policies/${pol}/assign
        payload:
          loan_account_id: ${loan}
        as: LoanOfficer
      - call: POST /loan-accounts/${loan}/activate
        as: LoanOfficer
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-04-01T00:00:00Z'
        as: System
      - call: POST /draw-requests
        payload:
          loan_account_id: ${loan}
          amount_cents: 1000000
          purpose: FUEL
        as: LoanOfficer
        captures:
          drw: $.data.id
      - call: POST /draw-requests/${drw}/approve
        as: LoanOfficer
      - call: POST /draw-requests/${drw}/disburse
        as: LoanOfficer
      trigger:
      - call: POST /repayments
        payload:
          loan_account_id: ${loan}
          amount_cents: 1000000
          source: HARVEST_PROCEEDS
        as: Borrower
        as_user_id: ${bor}
        captures:
          rp: $.data.id
      - call: GET /loan-accounts/${loan}
        as: LoanOfficer
        captures:
          lst: $.data.status
      - call: POST /draw-requests
        payload:
          loan_account_id: ${loan}
          amount_cents: 500000
          purpose: SEED
        as: LoanOfficer
        captures:
          drw2: $.data.id
      - call: POST /draw-requests/${drw2}/approve
        as: LoanOfficer
        captures:
          err: $.data.error_id
      assert:
      - 'same-day exact payoff: loan status == PAID_OFF (${lst})'
      - 'draw approve on PAID_OFF loan: error_id == ERR_LOAN_NOT_ACTIVE (${err}); draw stays REQUESTED'
  - name: loan_create_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.LoanAccount
    - entities.LoanAccount
    distinguishing_aspect: A new loan starts DRAFT/CURRENT with zero balances, null commitment, version 1.
    test_recipe:
      setup:
      - borrower exists
      setup_api_calls:
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      trigger:
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          st: $.data.status
          po: $.data.payment_posture
          p: $.data.outstanding_principal_cents
          cm: $.data.approved_commitment_cents
          v: $.data.version
      assert:
      - status == DRAFT (${st}), payment_posture == CURRENT (${po})
      - outstanding_principal_cents == 0 (${p}), approved_commitment_cents == null (${cm}), version == 1 (${v})
  - name: budget_supersede_replaces_draft
    claim_type: side_effect_execution
    grounds:
    - state_machines.CropBudget.DRAFT_to_SUPERSEDED
    - concurrency_rules[budget-create-stale-loan]
    distinguishing_aspect: Creating a second DRAFT budget for the same loan supersedes the first DRAFT and bumps the loan version each time.
    test_recipe:
      setup:
      - APPROVED loan (no budget yet)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: System
      - call: POST /associations
        payload:
          name: Blackhawk FCS
          charter_number: CH-1850
        as: AssociationBoard
        captures:
          assoc: $.data.id
      - call: POST /borrowers
        payload:
          association_id: ${assoc}
          legal_name: Sunrise Farms LLC
          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
          loan: $.data.id
      - call: POST /loan-accounts/${loan}/submit
        as: LoanOfficer
      - call: POST /loan-accounts/${loan}/approve
        payload:
          approved_commitment_cents: 50000000
        as: CreditCommittee
        captures:
          v1: $.data.version
      trigger:
      - call: POST /crop-budgets
        payload:
          loan_account_id: ${loan}
          season_year: 2026
          crop_type: CORN
          acres: 900
          projected_revenue_cents: 18000000
          projected_expenses_cents: 11000000
          expected_loan_version: ${v1}
        as: Borrower
        as_user_id: ${bor}
        captures:
          b1: $.data.id
      - call: GET /loan-accounts/${loan}
        as: LoanOfficer
        captures:
          v2: $.data.version
      - call: POST /crop-budgets
        payload:
          loan_account_id: ${loan}
          season_year: 2026
          crop_type: CORN
          acres: 950
          projected_revenue_cents: 19000000
          projected_expenses_cents: 11500000
          expected_loan_version: ${v2}
        as: Borrower
        as_user_id: ${bor}
        captures:
          b2: $.data.id
      - call: GET /crop-budgets/${b1}
        as: LoanOfficer
        captures:
          b1st: $.data.status
      assert:
      - first budget SUPERSEDED (${b1st}); second budget ${b2} status DRAFT
      - loan version advanced by exactly 1 per budget create (${v2} == ${v1} + 1)
  - name: second_delinquent_review_escalates_default
    claim_type: valid_transition
    grounds:
    - state_machines.LoanAccount.payment_posture
    - entities.LoanAccount.fields.consecutive_delinquent_reviews
    distinguishing_aspect: The first delinquent review close leaves posture DELINQUENT with counter 1; the second consecutive close escalates to DEFAULT (sticky band-independent state).
