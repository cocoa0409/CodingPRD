            - { call: "GET /railroad/excursions/${ex_b}", as: Scheduler, captures: { exb_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex_b}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${exb_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex_b}", customer_email: "sam@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM", redeemed_rain_check_id: "${rc1}" }, as: StationAgent }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CANCEL" }, as: StationAgent }
          trigger:
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM", redeemed_rain_check_id: "${rc1}" }, as: StationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (booking is CANCELLED; state priority 4 beats the rain-check fiscal rule at priority 10, which would otherwise fire ERR_RAIN_CHECK_INVALID because RC1 is REDEEMED)"
            - "RainCheck.${rc1}.status remains REDEEMED"
      - name: constraint_beats_temporal_on_car_assign
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CLASS_STOCK_MISMATCH]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair business_constraint vs business_temporal (different pair from
          state/fiscal): the car-assignment violates both class/stock compatibility
          (DINING on a COACH_CAR) and the maintenance-window temporal guard (a
          SCHEDULED WO intersects the service date); constraint priority 8 wins, so
          the error is ERR_CLASS_STOCK_MISMATCH.
        test_recipe:
          setup:
            - "DRAFT excursion on 2026-10-15"
            - "COACH_CAR stock with a SCHEDULED work order whose window (2026-10-15T07:00-09:00Z) intersects the service date"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${coach}", window_start: "2026-10-15T07:00:00Z", window_end: "2026-10-15T09:00:00Z", scope: "INSPECTION" }, as: Mechanic }
            - { call: "POST /railroad/excursions", payload: { title: "Draft Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "DINING", position: 1 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CLASS_STOCK_MISMATCH (priority 8 constraint beats the priority 9 temporal maintenance conflict that also holds for this stock on 2026-10-15)"

