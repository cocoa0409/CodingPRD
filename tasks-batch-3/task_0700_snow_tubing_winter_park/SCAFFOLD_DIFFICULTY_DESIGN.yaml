scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_pricing_walkup_vs_pass_redeemed
        grounds:
          - calculations.ticket_pricing
          - entities.SessionTicket.fields.base_price_cents
          - entities.SessionTicket.fields.season_pass_id
        distinguishing_aspect: "Same adult resident rider priced two ways on the SessionTicket domain: walkup (no pass) yields 3325 cents (3500*0.95), GOLD-pass-redeemed yields 2494 cents (3500*0.75*0.95) — the pass discount factor is the divergence."
        test_recipe:
          setup:
            - "Park with resident_zip_prefixes=['9001'] exists; patron whose zip starts 9001 (resident); one GOLD pass valid now; logical clock at 2026-03-02."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Alpine", resident_zip_prefixes: ["9001"], min_snow_depth_cm: 15, max_safe_wind_kph: 50 }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Rae Resident", zip_code: "90011", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-02T10:00:00Z", ends_at: "2026-03-02T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /season-passes"
              payload: { park_id: "${park_id}", holder_patron_id: "${patron_id}", tier: "GOLD", valid_from: "2026-03-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: ParkOperator
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { walkup_ticket_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30, season_pass_id: "${pass_id}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { pass_ticket_id: $.data.id }
          assert:
            - "SessionTicket.${walkup_ticket_id}.base_price_cents == 3325"
            - "SessionTicket.${pass_ticket_id}.base_price_cents == 2494"

      - name: group_deposit_shared_floor_vs_exclusive_flat
        grounds:
          - calculations.group_deposit
          - entities.GroupReservation.fields.deposit_cents
          - entities.GroupReservation.fields.rental_type
        distinguishing_aspect: "Same party_size=2 priced two ways on the GroupReservation domain: SHARED_SEATS hits the 8000-cent floor (raw 6000), EXCLUSIVE_LANE adds the 20000 flat onto seats (6000+20000=26000) — the rental_type branch is the divergence."
        test_recipe:
          setup:
            - "Park OPEN with two OPEN lanes (so an exclusive-lane hold still leaves capacity); one SCHEDULED block; a GroupHost patron."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Glacier", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 10, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane1_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L2", rider_capacity_per_block: 10, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Hank Host", zip_code: "70000", birthdate: "1985-05-05T00:00:00Z" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-05T10:00:00Z", ends_at: "2026-03-05T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${host_id}", time_block_id: "${tb_id}", rental_type: "SHARED_SEATS", party_size: 2 }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { shared_res_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${host_id}", time_block_id: "${tb_id}", rental_type: "EXCLUSIVE_LANE", party_size: 2, lane_id: "${lane2_id}" }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { excl_res_id: $.data.id }
          trigger:
            - call: "POST /group-reservations/${shared_res_id}/hold"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GroupHost
              as_user_id: "${host_id}"
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { tb_v2: $.data.version }
            - call: "POST /group-reservations/${excl_res_id}/hold"
              payload: { expected_time_block_version: "${tb_v2}" }
              as: GroupHost
              as_user_id: "${host_id}"
          assert:
            - "GroupReservation.${shared_res_id}.deposit_cents == 8000"
            - "GroupReservation.${excl_res_id}.deposit_cents == 26000"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_pricing_nested_tier_and_stacked_discounts_mode_a
        grounds:
          - calculations.ticket_pricing
          - entities.SessionTicket.fields.base_price_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (age tier, pass tier, resident flag) with non-linear interaction — base selected by age bracket, then two multiplicative discount factors stack with a tier-conditional exclusion; senior(2000)*RESIDENT_GOLD(0.60) with resident-stack SUPPRESSED yields exactly 1200."
        test_recipe:
          setup:
            - "Resident senior (age 70) holding a RESIDENT_GOLD pass; resident 5% must NOT stack on RESIDENT_GOLD."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Summit", resident_zip_prefixes: ["8002"] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T09:00:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Sue Senior", zip_code: "80021", birthdate: "1956-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-03T10:00:00Z", ends_at: "2026-03-03T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /season-passes"
              payload: { park_id: "${park_id}", holder_patron_id: "${patron_id}", tier: "RESIDENT_GOLD", valid_from: "2026-03-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: ParkOperator
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 170, rider_age_years: 70, season_pass_id: "${pass_id}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          assert:
            - "SessionTicket.${ticket_id}.base_price_cents == 1200"
            - "SessionTicket.${ticket_id}.is_resident == true"

      - name: addon_line_total_round_per_unit_then_multiply_mode_b
        grounds:
          - calculations.addon_line_total
          - entities.AddOn.fields.line_total_cents
        distinguishing_aspect: "Mode (b): nested rounding where order matters — GOLD-pass FOOD add-on of unit 199 x4 rounds per-unit FIRST (199*0.85=169.15->169, *4=676); multiply-then-round (169.15*4=676.6->677) would give 677. Scaffold pins round-per-unit, so 676 is correct."
        test_recipe:
          setup:
            - "Patron with ACTIVE GOLD pass holds a ticket; orders a FOOD add-on unit_price_cents=199 quantity=4."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Frost", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T09:00:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Gus Gold", zip_code: "11111", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-04T10:00:00Z", ends_at: "2026-03-04T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /season-passes"
              payload: { park_id: "${park_id}", holder_patron_id: "${patron_id}", tier: "GOLD", valid_from: "2026-03-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: ParkOperator
              captures: { pass_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30, season_pass_id: "${pass_id}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { park_id: "${park_id}", ticket_id: "${ticket_id}", category: "FOOD", unit_price_cents: 199, quantity: 4 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { addon_id: $.data.id }
          assert:
            - "AddOn.${addon_id}.line_total_cents == 676"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_parallel_lifecycle_and_checkin_dimensions
        grounds:
          - state_machines.SessionTicket.RESERVED_to_CONFIRMED
          - state_machines.SessionTicket.NOT_CHECKED_IN_to_GEARED_UP
          - state_machines.SessionTicket.GEARED_UP_to_ON_LANE
          - entities.SessionTicket.fields.lifecycle_state
          - entities.SessionTicket.fields.checkin_state
        distinguishing_aspect: "SessionTicket carries two independent state axes: lifecycle_state advances RESERVED->CONFIRMED while checkin_state independently advances NOT_CHECKED_IN->GEARED_UP->ON_LANE; after gear-up the ticket holds CONFIRMED on one axis and GEARED_UP on the other at once, proving parallel dimensions on one entity."
        test_recipe:
          setup:
            - "Park OPEN, one OPEN lane cap 5, ACTIVE block, patron with ACTIVE waiver, CONFIRMED ticket, a DISPATCHED TUBE rental for it."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Drift", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Pat Patron", zip_code: "22222", birthdate: "1995-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-06T10:00:00Z", ends_at: "2026-03-06T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-06T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 31 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /equipment-rentals"
              payload: { ticket_id: "${ticket_id}", equipment_type: "TUBE", tube_size: "MEDIUM" }
              as: SafetyMarshal
          trigger:
            - call: "POST /tickets/${ticket_id}/gear-up"
              payload: {}
              as: SafetyMarshal
              captures: { lifecycle_after: $.data.lifecycle_state, checkin_after: $.data.checkin_state }
          assert:
            - "SessionTicket.${ticket_id}.lifecycle_state == CONFIRMED"
            - "SessionTicket.${ticket_id}.checkin_state == GEARED_UP"

      - name: group_reservation_held_to_draft_revision_cycle
        grounds:
          - state_machines.GroupReservation.DRAFT_to_HELD
          - state_machines.GroupReservation.HELD_to_DRAFT
          - entities.GroupReservation.fields.state
        distinguishing_aspect: "GroupReservation is cyclic on a different entity than instance 1: DRAFT->HELD->DRAFT->HELD loop is legal; the second HELD re-runs the deposit calc and re-closes the exclusive lane, proving a revert cycle rather than a linear pipeline."
        test_recipe:
          setup:
            - "Park OPEN, two OPEN lanes, SCHEDULED block, GroupHost with an EXCLUSIVE_LANE reservation."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Crest", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane1_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L2", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Hana Host", zip_code: "33333", birthdate: "1980-01-01T00:00:00Z" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-07T10:00:00Z", ends_at: "2026-03-07T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${host_id}", time_block_id: "${tb_id}", rental_type: "EXCLUSIVE_LANE", party_size: 4, lane_id: "${lane1_id}" }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { res_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /group-reservations/${res_id}/hold"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GroupHost
              as_user_id: "${host_id}"
            - call: "POST /group-reservations/${res_id}/revise"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { tb_v2: $.data.version }
          trigger:
            - call: "POST /group-reservations/${res_id}/hold"
              payload: { expected_time_block_version: "${tb_v2}" }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { state_after: $.data.state }
          assert:
            - "GroupReservation.${res_id}.state == HELD"
            - "GroupReservation.${res_id}.deposit_cents == 32000"
            - "Lane.${lane1_id}.status == CLOSED"
            - "Lane.${lane1_id}.closure_reason == GROUP_RENTAL"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: weather_closed_cascades_lane_close_ticket_expire_refund_depth3
        grounds:
          - state_machines.Park.OPEN_to_CLOSED
          - state_machines.Lane.OPEN_to_CLOSED
          - state_machines.SessionTicket.CONFIRMED_to_EXPIRED
          - entities.RefundEntry.fields.reason
        distinguishing_aspect: "Depth-3 chain from a weather reading: POST weather-log (snow<min) flips Park->CLOSED, which CLOSES each OPEN lane, which EXPIRES each CONFIRMED ticket on that lane, which itself CREATES a RefundEntry(reason=WEATHER_CLOSURE) — each hop caused by the prior hop, not the original action."
        test_recipe:
          setup:
            - "Park OPEN, one OPEN lane cap 5, ACTIVE block, a CONFIRMED ticket committed into it; clock 2026-03-08."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Avalanche", resident_zip_prefixes: [], min_snow_depth_cm: 15, max_safe_wind_kph: 50 }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-08T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Tom Tube", zip_code: "44444", birthdate: "1992-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-08T10:00:00Z", ends_at: "2026-03-08T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-08T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /parks/${park_id}/weather-logs"
              payload: { observed_at: "2026-03-08T10:35:00Z", snow_depth_cm: 5, wind_kph: 10 }
              as: ParkOperator
          assert:
            - "Park.${park_id}.operational_posture == CLOSED"
            - "Lane.${lane_id}.status == CLOSED"
            - "Lane.${lane_id}.closure_reason == WEATHER"
            - "SessionTicket.${ticket_id}.lifecycle_state == EXPIRED"
            - "GET /refund-entries?ticket_id=${ticket_id} returns exactly one RefundEntry with reason == WEATHER_CLOSURE and amount_cents == 3500"

      - name: timeblock_sweep_expires_noshow_ticket_depth2
        grounds:
          - state_machines.TimeBlock.ACTIVE_to_SWEPT
          - state_machines.SessionTicket.CONFIRMED_to_EXPIRED
          - entities.TimeBlock.fields.committed_rider_count
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger than instance 1: POST sweep flips TimeBlock ACTIVE->SWEPT, which EXPIRES each still-NOT_CHECKED_IN CONFIRMED ticket (no-show forfeit, NO refund) and decrements committed_rider_count — distinct propagation pattern (no third hop, no refund)."
        test_recipe:
          setup:
            - "Park OPEN, one OPEN lane cap 5, ACTIVE block with one CONFIRMED no-show ticket; clock 2026-03-09."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Powder", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-09T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Nora Noshow", zip_code: "55555", birthdate: "1993-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-09T10:00:00Z", ends_at: "2026-03-09T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-09T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
          trigger:
