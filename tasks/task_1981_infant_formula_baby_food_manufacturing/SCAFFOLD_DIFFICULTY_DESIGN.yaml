            - call: "POST /api/v1/allocation-plans/${plan_occ_id}/entries"
              payload:
                customer_code: "CUST-OCC-1"
                customer_name: "OCC Customer 1"
                requested_kg: 50.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_occ1_id: $.data.id }
            - call: "GET /api/v1/allocation-plans/${plan_occ_id}"
              as: SUPPLY_CHAIN_PLANNER
              captures: { plan_occ_ver_after: $.data.version }
            - call: "POST /api/v1/allocation-plans/${plan_occ_id}/entries"
              payload:
                customer_code: "CUST-OCC-2"
                customer_name: "OCC Customer 2"
                requested_kg: 50.000
              as: SUPPLY_CHAIN_PLANNER
              captures: { entry_occ2_id: $.data.id }
          trigger:
            - call: "POST /api/v1/allocation-plans/${plan_occ_id}/activate"
              payload: { expected_plan_version: "${plan_occ_ver_after}" }
              as: SUPPLY_CHAIN_PLANNER
              captures: { err_plan_occ: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412) — plan version advanced when second entry was added"
