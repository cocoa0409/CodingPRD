            - "${pair2_error} != \"ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED\""
            - "${pair2_control_error} == \"ERR_CLINICIAN_DAY_CAPACITY_EXCEEDED\" with HTTP 409"
            - "InjectionEncounter.${enc6_id}.status == DRAFT (P3's encounter at 08:00 was accepted and is what fills the window)"
            - "TreatmentPlan.${plan1_id}.injections_administered == 1"
            - "TreatmentPlan.${plan1_id}.last_encounter_id == ${enc5_id}"
            - "PriorAuthorization.${pa1_id}.injections_used == 1"

  - rule_id: boundary_precision_check
    instances:

      - name: disease_activity_cst_threshold_inclusive_at_300_um
        grounds:
          - calculations.disease_activity_classification
          - entities.ImagingStudy.fields.disease_activity
        distinguishing_aspect: |
          Inclusive threshold probed at 299 / 300 / 301 um with every fluid and
          hemorrhage flag false, so thickness is the only live term:
          299 -> QUIESCENT, 300 -> ACTIVE, 301 -> ACTIVE. An exclusive `>` reading of
          CST_ACTIVE_THRESHOLD_UM changes exactly the middle answer.
        test_recipe:
          setup:
            - "the reference-data prologue's payers, drugs, policies, patients and clinicians"
            - "logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
          trigger:
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt4_id}", eye: "OS", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 299, intraretinal_fluid: false, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 78 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { b299_id: $.data.id, b299_activity: $.data.disease_activity }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt4_id}", eye: "OS", study_datetime: "2026-08-01T01:00:00Z", central_subfield_thickness_um: 300, intraretinal_fluid: false, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 78 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { b300_id: $.data.id, b300_activity: $.data.disease_activity }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt4_id}", eye: "OS", study_datetime: "2026-08-01T02:00:00Z", central_subfield_thickness_um: 301, intraretinal_fluid: false, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 78 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { b301_id: $.data.id, b301_activity: $.data.disease_activity }
          assert:
            - "${b299_activity} == QUIESCENT"
            - "${b300_activity} == ACTIVE"
            - "${b301_activity} == ACTIVE"
            - "ImagingStudy.${b299_id}.central_subfield_thickness_um == 299"
            - "ImagingStudy.${b300_id}.interpreted_by_clinician_id == ${cl1_id}"
            - "ImagingStudy.${b301_id}.disease_activity == ACTIVE"

      - name: capacity_window_closed_at_exactly_twenty_four_hours
        grounds:
          - calculations.clinician_day_capacity
          - validations.priority_18
          - entities.Clinician.fields.max_injections_per_day
        distinguishing_aspect: |
          The 24-hour capacity window is closed at both ends and measured from the
          requested encounter_datetime, not from the clock. An encounter exactly
          86400 seconds earlier still consumes capacity (rejected), while the same
          request one second later is outside the window (accepted) — a half-open
          window flips the first answer and an inclusive-plus-epsilon window flips
          the second.
        test_recipe:
          setup:
            - "the reference-data prologue's payers, drugs, policies, patients, clinicians and lot RX-2201"
            - "clinician CL3 has max_injections_per_day 1"
            - "patients P3 and P4 both sit on the no-PA payer, each with an ACTIVE plan on Drug REF and a fresh ACTIVE study dated 2026-08-01T00:00:00Z"
            - "CL3 injects P3 at exactly 2026-08-02T09:00:00Z"
