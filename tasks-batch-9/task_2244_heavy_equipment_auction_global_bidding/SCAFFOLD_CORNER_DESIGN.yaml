          Replaying the accepted counteroffer with the same now-stale
          expected_sale_version returns 412 ERR_STALE_SALE_VERSION rather than the
          409 ERR_INVALID_STATE the CONSIGNOR_COUNTERED state would otherwise
          produce, because the version guard sits at priority 7 above the state
          guard at priority 8.
