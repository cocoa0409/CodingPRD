# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Channel Partner Program & Deal Registration
#
# Nine rule_id blocks, two differentiated instances each (18 instances).
# Every literal in every `assert:` line was computed by executing the pinned
# formula of the named calculations[] entry with Decimal / ROUND_HALF_UP.
# Every chain starts from an empty database and only uses endpoints declared
# in SCAFFOLD.yaml §1.5. The logical clock is always set explicitly first, so
# no instance depends on the 2026-08-01T00:00:00Z startup default.
# ---------------------------------------------------------------------------
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_tier_divergence_on_performance_review
        grounds:
          - calculations.partner_tier_scoring
          - calculations.certification_credit_rollup
          - calculations.partner_revenue_rollup
          - state_machines.PerformanceReview.PREPARED_to_APPROVED
          - entities.PerformanceReview.fields.provisional_score
          - entities.PerformanceReview.fields.final_score
          - entities.PerformanceReview.fields.recommended_tier
          - entities.PerformanceReview.fields.approved_tier
        distinguishing_aspect: |
          This instance is dual-variant scoring on the Partner / PerformanceReview domain: the
          PROVISIONAL variant counts every ACTIVE certification and PENDING orders, the FINAL
          variant drops certifications lapsing before period_end + 90 days and drops PENDING
          orders, so the SAME rows yield provisional_score 73.52 / recommended_tier GOLD and
          final_score 57.72 / approved_tier SILVER on one review row.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00.000Z."
            - "One DISTRIBUTOR partner with marketing_commitment_cents = 0, so marketing_attainment_pct is exactly 1.0000 and the marketing component contributes a flat 25 points to both variants."
            - "Three TECH_EXPERT certifications (4 credits each, cert_credit_total = 12); two expire 2028-06-01 and one expires 2026-03-01, which is after the clock (still ACTIVE, so PROVISIONAL counts it) but before period_end + COVERAGE_HORIZON_DAYS = 2026-05-01T23:59:59.999Z (so FINAL drops it)."
            - "One STOCKING order of list 10,000,000 already INVOICED at 2026-01-05 (invoice_amount_cents 8,650,000) and one STOCKING order of list 4,000,000 left PENDING (invoice_amount_cents 3,520,000, created_at inside the review period)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Ada Lin", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Bo Reyes", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Cy Duarte", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { cert_short_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 10000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_invoiced_id: $.data.id }
            - call: "POST /order-invoices/${inv_invoiced_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 4000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_pending_id: $.data.id }
          trigger:
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p1_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev1_id: $.data.id }
            - call: "POST /performance-reviews/${rev1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "CertificationRecord.${cert_short_id}.status == ACTIVE after the review preparation (clock 2026-01-05 is before its expires_at 2026-03-01, so the CASCADE E sweep does not touch it)"
            - "Partner.${p1_id}.cert_credit_total == 12"
            - "PerformanceReview.${rev1_id}.provisional_cert_credit == 12"
            - "PerformanceReview.${rev1_id}.provisional_revenue_cents == 12170000"
            - "PerformanceReview.${rev1_id}.provisional_score == 73.52"
            - "PerformanceReview.${rev1_id}.recommended_tier == GOLD"
            - "PerformanceReview.${rev1_id}.marketing_attainment_pct == 1.0"
            - "PerformanceReview.${rev1_id}.final_cert_credit == 8"
            - "PerformanceReview.${rev1_id}.final_revenue_cents == 8650000"
            - "PerformanceReview.${rev1_id}.final_score == 57.72"
            - "PerformanceReview.${rev1_id}.approved_tier == SILVER"
            - "PerformanceReview.${rev1_id}.status == APPROVED"
            - "Partner.${p1_id}.tier == SILVER (the FINAL variant, not the PROVISIONAL GOLD recommendation, is the only writer of Partner.tier)"
            - "OrderInvoice.${inv_pending_id}.status == PENDING and its 3520000 is included in provisional_revenue_cents but excluded from final_revenue_cents"

      - name: conflict_recommendation_variant_divergence_on_partner_vs_partner_case
        grounds:
          - calculations.conflict_recommendation
          - state_machines.DealRegistration.UNDER_REVIEW_to_APPROVED
          - state_machines.DealRegistration.SUBMITTED_to_CONFLICT_HELD
          - entities.ConflictCase.fields.recommended_resolution_registration_first
          - entities.ConflictCase.fields.recommended_resolution_coverage_first
          - entities.ConflictCase.fields.applied_variant
        distinguishing_aspect: |
          This instance is dual-variant conflict doctrine on the ConflictCase / Account /
          DealRegistration domain - not scoring on a Partner: REGISTRATION_FIRST ranks by
          submitted_at and names GRANT_SUBJECT (the subject staked its claim on 2026-02-01),
          while COVERAGE_FIRST ranks by who holds the live account protection and names
          GRANT_COUNTER, and applied_variant is REGISTRATION_FIRST because conflict_type is
          PARTNER_VS_PARTNER.
        test_recipe:
          setup:
            - "Two RESELLER partners, each holding one TECH_ASSOCIATE certification (2 credits, the CERT_CREDIT_MIN_TO_REGISTER floor) and marketing_commitment_cents = 0."
            - "One OPEN_CHANNEL account."
            - "Partner A registers ANALYTICS_ADDON on the account and submits at 2026-02-01T00:00:00.000Z (submitted_at = that instant)."
            - "Partner B registers the same product line on the same account and submits at 2026-02-02T00:00:00.000Z, then channel operations starts the review of B's registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aurora Resellers", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { pa_id: $.data.id }
            - call: "POST /partners/${pa_id}/certifications"
              payload: { engineer_name: "Dee Park", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners"
              payload: { company_name: "Borealis Resellers", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { pb_id: $.data.id }
            - call: "POST /partners/${pb_id}/certifications"
              payload: { engineer_name: "Eli Frost", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Helios Manufacturing", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pa_id}", account_id: "${acc_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 500000, expected_close_date: "2026-06-30T00:00:00.000Z" }
              as: Partner
              as_user_id: "${pa_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /deal-registrations/${ra_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-02T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pb_id}", account_id: "${acc_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 700000, expected_close_date: "2026-07-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${pb_id}"
              captures: { rb_id: $.data.id }
            - call: "POST /deal-registrations/${rb_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pb_id}"
            - call: "POST /deal-registrations/${rb_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /deal-registrations/${rb_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "GET /conflict-cases"
              payload: { subject_registration_id: "${ra_id}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { case_id: "$.data[0].id" }
          assert:
            - "ConflictCase.${case_id}.conflict_type == PARTNER_VS_PARTNER"
            - "ConflictCase.${case_id}.subject_registration_id == ${ra_id}"
            - "ConflictCase.${case_id}.counter_registration_id == ${rb_id}"
            - "ConflictCase.${case_id}.detected_at == 2026-02-02T00:00:00.000Z"
            - "ConflictCase.${case_id}.recommended_resolution_registration_first == GRANT_SUBJECT"
            - "ConflictCase.${case_id}.recommended_resolution_coverage_first == GRANT_COUNTER"
            - "ConflictCase.${case_id}.applied_variant == REGISTRATION_FIRST"
            - "ConflictCase.${case_id}.recommended_resolution == GRANT_SUBJECT"
            - "ConflictCase.${case_id}.status == OPEN and escalation_level == 0"
            - "DealRegistration.${ra_id}.submitted_at == 2026-02-01T00:00:00.000Z and DealRegistration.${rb_id}.submitted_at == 2026-02-02T00:00:00.000Z (the chronological key REGISTRATION_FIRST ranks on)"
            - "DealRegistration.${ra_id}.status == CONFLICT_HELD and closure_reason == ACCOUNT_PROTECTED_BY_OTHER_PARTNER"
            - "Account.${acc_id}.coverage_state == CHANNEL_PROTECTED and protected_partner_id == ${pb_id} (the coverage fact COVERAGE_FIRST ranks on)"
            - "Partner.${pa_id}.open_conflict_count == 1 and tier_status == COMPLIANT (1 < CONFLICT_PROBATION_THRESHOLD 2)"

  # =========================================================================
  # Rule 2 - combinatorial formulas in different modes: (c) pinned circular
  # evaluation order, and (b) per-line rounding before summation
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: channel_margin_band_pinned_to_preliminary_net
        grounds:
          - calculations.channel_margin_resolution
          - state_machines.OrderInvoice.PENDING_to_INVOICED
          - state_machines.DealRegistration.UNDER_REVIEW_to_APPROVED
          - state_machines.SpecialPricingRequest.SUBMITTED_to_APPROVED
          - entities.OrderInvoice.fields.volume_band
          - entities.OrderInvoice.fields.margin_pct
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order: volume_band is a
          function of the PRELIMINARY net (step 2/3) while invoice_amount_cents is a function of
          the FINAL margin (step 5), so with list 28,000,000 and prelim margin 0.28 the band is
          HIGH (prelim net 20,160,000 >= 20,000,000) and the ceiling clamps margin_pct to 0.3000
          giving invoice_amount_cents 19,600,000; re-deriving the band from the final net
          19,600,000 would select MID and produce margin_pct 0.2950 / invoice 19,740,000.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00.000Z throughout."
            - "One DISTRIBUTOR partner promoted to tier GOLD by an approved performance review (BASE_MARGIN_PCT 0.18, TIER_MARGIN_CEILING_PCT 0.30)."
            - "One APPROVED deal registration on a fresh account whose half-open window [2026-01-05T00:00:00.000Z, 2026-04-05T00:00:00.000Z) is live at the clock, so registration_uplift is 0.06."
            - "One APPROVED SpecialPricingRequest of 0.02 on that registration whose expires_at 2026-02-04T00:00:00.000Z is after the clock, so spr_uplift is 0.02."
            - "The order under test is a STOCKING order of a DISTRIBUTOR, so stocking_uplift is 0.02; prelim_margin_pct = 0.18 + 0.06 + 0.02 + 0.02 = 0.28."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Ada Lin", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Bo Reyes", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Cy Duarte", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 10000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_seed_id: $.data.id }
            - call: "POST /order-invoices/${inv_seed_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p1_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_gold_id: $.data.id }
            - call: "POST /performance-reviews/${rev_gold_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /accounts"
              payload: { account_name: "Vertex Aerospace", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p1_id}", account_id: "${acc_id}", product_line: "PLATFORM_SUITE", expected_amount_cents: 28000000, expected_close_date: "2026-03-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /deal-registrations/${reg_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p1_id}"
            - call: "POST /deal-registrations/${reg_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${reg_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
              captures: { reg_version: $.data.version }
            - call: "POST /special-pricing-requests"
              payload: { registration_id: "${reg_id}", requested_extra_margin_pct: 0.02, justification: "competitive displacement bid", expected_registration_version: "${reg_version}" }
              as: Partner
              as_user_id: "${p1_id}"
              captures: { spr_id: $.data.id }
            - call: "POST /special-pricing-requests/${spr_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
          trigger:
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 28000000, registration_id: "${reg_id}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_big_id: $.data.id }
          assert:
            - "Partner.${p1_id}.tier == GOLD"
            - "DealRegistration.${reg_id}.exclusivity_start_at == 2026-01-05T00:00:00.000Z and exclusivity_end_at == 2026-04-05T00:00:00.000Z and protection_days == 90"
            - "DealRegistration.${reg_id}.registration_margin_uplift_pct == 0.06"
            - "SpecialPricingRequest.${spr_id}.approved_extra_margin_pct == 0.02 and expires_at == 2026-02-04T00:00:00.000Z"
            - "OrderInvoice.${inv_big_id}.volume_band == HIGH"
            - "OrderInvoice.${inv_big_id}.margin_pct == 0.3000"
            - "OrderInvoice.${inv_big_id}.invoice_amount_cents == 19600000"
            - "OrderInvoice.${inv_big_id}.margin_value_cents == 8400000"
            - "OrderInvoice.${inv_big_id}.list_amount_cents == 28000000 == invoice_amount_cents 19600000 + margin_value_cents 8400000"
            - "OrderInvoice.${inv_big_id}.margin_pct != 0.2950 and invoice_amount_cents != 19740000 (the values a band re-derived from the final net would produce)"
            - "OrderInvoice.${inv_big_id}.status == PENDING and invoiced_at == null"

      - name: mdf_claim_per_line_rounding_before_summation
        grounds:
          - calculations.mdf_claim_approval
          - calculations.mdf_allocation_sizing
          - state_machines.MdfClaim.validation_state_SUBMITTED_to_VALIDATED
          - state_machines.MdfClaim.validation_state_SUBMITTED_to_SUBMITTED
          - entities.ProofOfPerformance.fields.matched_line_cents
          - entities.MdfClaim.fields.matched_total_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents: three verified proof lines of
          12,345 / 6,789 / 1,111 cents at MATCH_RATE_PCT[GOLD] 0.50 round per line to
          6,173 + 3,395 + 556 = matched_total_cents 10,124, whereas summing the spend first
          (20,245 * 0.50 = 10,122.5) and rounding once yields 10,123 - a one-cent divergence the
          scaffold resolves by pinning per-line rounding then summation.
        test_recipe:
          setup:
            - "The same GOLD DISTRIBUTOR partner as the previous instance, whose only invoiced order was invoiced at 2026-01-05 for 8,650,000 cents."
            - "Clock moved to 2026-02-10T00:00:00.000Z, then one MDF period [2026-02-01T00:00:00.000Z, 2026-06-30T23:59:59.999Z] opened: basis_revenue_cents 8,650,000, accrual 0.02 -> 173,000, plus MDF_BASE_GRANT_CENTS[GOLD] 100,000 -> allocated_cents 273,000."
            - "One EVENT claim of 20,000 cents against that period (committed 20,000, available 253,000) carrying three proof documents attached while the claim is SUBMITTED (the self-loop consumes no proof round), all three verified by u_ops_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p1_id: $.data.id }
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Ada Lin", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Bo Reyes", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p1_id}/certifications"
              payload: { engineer_name: "Cy Duarte", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p1_id}", order_type: "STOCKING", list_amount_cents: 10000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_seed_id: $.data.id }
            - call: "POST /order-invoices/${inv_seed_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p1_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_gold_id: $.data.id }
            - call: "POST /performance-reviews/${rev_gold_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /mdf-allocations"
              payload: { partner_id: "${p1_id}", period_start: "2026-02-01T00:00:00.000Z", period_end: "2026-06-30T23:59:59.999Z" }
              as: ChannelOpsAnalyst
