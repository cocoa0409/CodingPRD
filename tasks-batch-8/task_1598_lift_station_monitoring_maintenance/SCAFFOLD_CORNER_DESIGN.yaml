scaffold_corner_design:
  # ==========================================================================
  # Section: entities — creation, retrieval, listing, defaults, required fields
  # ==========================================================================
  - section: entities
    instances:
      - name: create_station_with_required_fields_returns_201
        claim_type: creation
        grounds: ["entities.LiftStation", "endpoints"]
        distinguishing_aspect: "POST /stations with all required fields returns 201 and the response carries the input fields plus computed defaults."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0001", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          assert:
            - "LiftStation.${st_id}.station_code == LS-0001"
            - "LiftStation.${st_id}.operational_posture == NORMAL (initial default)"
            - "LiftStation.${st_id}.version == 1"

      - name: get_station_returns_stored_data
        claim_type: retrieval
        grounds: ["entities.LiftStation"]
        distinguishing_aspect: "GET /stations/{id} returns the same field values stored at create time."
        test_recipe:
          setup: ["Station LS-0002 exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0002", service_zone: "Z9", design_capacity_gpm: 750, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 8000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "GET /lift-station-ops/stations/${st_id}"
              payload: {}
              as: OperationsSupervisor
          assert:
            - "station_code == LS-0002"
            - "service_zone == Z9"
            - "design_capacity_gpm == 750"

      - name: list_stations_pagination
        claim_type: listing
        grounds: ["entities.LiftStation", "response_envelope"]
        distinguishing_aspect: "GET /stations returns paginated envelope with limit/offset/total_count/has_more per §1.0 defaults."
        test_recipe:
          setup: ["Three stations exist"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0010", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0011", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0012", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
          trigger:
            - call: "GET /lift-station-ops/stations?limit=2&offset=0"
              payload: {}
              as: UtilityAdmin
          assert:
            - "response.meta.api_request_id present"
            - "response.data has 2 entries"
            - "response.meta or pagination reports total_count == 3 and has_more == true"

      - name: get_station_nonexistent_returns_404
        claim_type: not_found
        grounds: ["entities.LiftStation", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "GET /lift-station-ops/stations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: create_station_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.LiftStation", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /stations missing design_capacity_gpm returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0020", service_zone: "Z1", pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: alarm_ticket_is_sso_related_default_false
        claim_type: defaults
        grounds: ["entities.AlarmTicket.fields.is_sso_related"]
        distinguishing_aspect: "When is_sso_related is omitted from create payload, default false applies."
        test_recipe:
          setup: ["Station LS-0030 exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0030", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "INFO", alarm_code: "TEST", raised_at: "2026-08-01T00:00:00Z" }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, default_val: $.data.is_sso_related }
          assert:
            - "default_val == false (default applied when omitted)"

      - name: pump_status_default_in_service
        claim_type: defaults
        grounds: ["entities.Pump.fields.status"]
        distinguishing_aspect: "Omitting status on pump create defaults to IN_SERVICE."
        test_recipe:
          setup: ["Station LS-0031 exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0031", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150 }
              as: UtilityAdmin
              captures: { p_id: $.data.id, default_status: $.data.status }
          assert:
            - "default_status == IN_SERVICE"

      - name: computed_fields_input_ignored_on_station
        claim_type: computed_fields
        grounds: ["entities.LiftStation.fields.operational_posture", "entities.LiftStation.fields.firm_capacity_available_gpm"]
        distinguishing_aspect: "Client-supplied operational_posture/firm_capacity_available_gpm on POST /stations MUST be ignored (server computes them)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0040", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 5000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, post: $.data.operational_posture }
          assert:
            - "post == NORMAL (computed, not client-supplied)"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Pump.fields.status", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Pump status=BOGUS returns 400 ERR_INVALID_REQUEST (enum constraint)."
        test_recipe:
          setup: ["Station LS-0041 exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0041", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "BOGUS" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: runtime_reading_immutable_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.RuntimeReading"]
        distinguishing_aspect: "RuntimeReading has common_fields=false — no PUT/PATCH endpoint exists in §1.5; only POST and GET. This pins append-only semantics."
        test_recipe:
          setup: ["A RuntimeReading exists for some pump"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0042", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T00:00:00Z", run_hours_delta: 1.5, starts_count: 2, source: "SCADA" }
              as: UtilityAdmin
              captures: { rd_id: $.data.id }
          trigger:
            - call: "GET /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: {}
              as: UtilityAdmin
          assert:
            - "RuntimeReading list has 1 entry with id == ${rd_id}"
            - "no PUT or PATCH endpoint declared for /runtime-readings (immutability enforced by API surface)"

  # ==========================================================================
  # Section: state_machines — valid transitions, invalid transitions, terminal, side effects
  # ==========================================================================
  - section: state_machines
    instances:
      - name: alarm_ticket_full_happy_path
        claim_type: valid_transition
        grounds: ["state_machines.AlarmTicket"]
        distinguishing_aspect: "Full forward path OPEN -> ACKED -> DISPATCHED -> ON_SCENE -> CLEARED succeeds and stamps acked_at, dispatched_at, cleared_at, response_minutes."
        test_recipe:
          setup: ["Station with NORMAL posture; operator with COLLECTIONS_2; MINOR ticket"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0100", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0100", full_name: "Op", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MINOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
            - call: "GET /lift-station-ops/alarm-tickets/${tk_id}"
              payload: {}
              as: OnCallOperator
              captures: { tk_v2: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v2}" }
              as: OnCallOperator
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/arrive"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/clear"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { tk_after: $.data }
          assert:
            - "AlarmTicket.${tk_id}.status == CLEARED"
            - "AlarmTicket.${tk_id}.acked_at != null"
            - "AlarmTicket.${tk_id}.dispatched_at != null"
            - "AlarmTicket.${tk_id}.cleared_at != null"
            - "AlarmTicket.${tk_id}.response_minutes != null"

      - name: alarm_ticket_cleared_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AlarmTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once CLEARED, no further transitions allowed; cancel attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["CLEARED ticket exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0101", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0101", full_name: "Op", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MINOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
            - call: "GET /lift-station-ops/alarm-tickets/${tk_id}"
              payload: {}
              as: OnCallOperator
              captures: { tk_v2: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v2}" }
              as: OnCallOperator
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/arrive"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/clear"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/cancel"
              payload: {}
              as: OnCallOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: alarm_ticket_dispatch_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.AlarmTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatch on an OPEN (not ACKED) ticket rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN ticket"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0102", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MINOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v}" }
              as: OnCallOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: alarm_ticket_initial_state_open
        claim_type: initial_state
        grounds: ["state_machines.AlarmTicket"]
        distinguishing_aspect: "Newly created AlarmTicket has status=OPEN."
        test_recipe:
          setup: ["Station exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0103", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "INFO", alarm_code: "TEST", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { initial: $.data.status }
          assert:
            - "initial == OPEN"

      - name: generator_test_overdue_auto_transition
        claim_type: side_effect_execution
        grounds: ["state_machines.GeneratorTest", "calculations.station_posture"]
        distinguishing_aspect: "After _clock/tick with scheduled_for+24h in the past, GeneratorTest auto-transitions SCHEDULED -> OVERDUE and station posture recomputes."
        test_recipe:
          setup: ["Station with SCHEDULED generator test for 2026-08-01; clock advanced to 2026-08-03"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0104", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/generator-tests"
              payload: { scheduled_for: "2026-08-01T00:00:00Z", test_kind: "NO_LOAD", load_percent: 0 }
              as: MaintenancePlanner
              captures: { gt_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/_clock/tick"
              payload: {}
              as: UtilityAdmin
            - call: "GET /lift-station-ops/generator-tests/${gt_id}"
              payload: {}
              as: UtilityAdmin
              captures: { after: $.data.status }
          assert:
            - "after == OVERDUE"

      - name: wet_well_cleaning_overdue_via_tick
        claim_type: side_effect_execution
        grounds: ["state_machines.WetWellCleaning"]
        distinguishing_aspect: "After _clock/tick with scheduled_for+24h in the past, WetWellCleaning auto-transitions SCHEDULED -> OVERDUE."
        test_recipe:
          setup: ["Station with SCHEDULED cleaning for 2026-08-01; clock at 2026-08-03"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0105", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0105", full_name: "Lead", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-01T00:00:00Z", grease_depth_inches_pre: 4.0, crew_lead_operator_id: "${op_id}", requires_confined_space_entry: false }
              as: MaintenancePlanner
              captures: { cl_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/_clock/tick"
              payload: {}
              as: UtilityAdmin
            - call: "GET /lift-station-ops/wet-well-cleanings/${cl_id}"
              payload: {}
              as: UtilityAdmin
              captures: { after: $.data.status }
          assert:
            - "after == OVERDUE"

      - name: capital_plan_rank_assigns_priority
        claim_type: valid_transition
        grounds: ["state_machines.CapitalPlan", "state_machines.CapitalProject", "calculations.capital_project_ranking"]
        distinguishing_aspect: "DRAFT -> RANKED transition on plan assigns priority_rank to all PROPOSED projects in deterministic order (risk DESC, cost ASC, created_at ASC)."
        test_recipe:
          setup: ["Plan 2029 with three PROPOSED projects with different risk inputs"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0106", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/capital-plans"
              payload: { plan_year: 2029, budget_total_usd: 500000 }
              as: CapitalProgramManager
              captures: { plan_id: $.data.id }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "Low", estimated_cost_usd: 10000, consequence_of_failure: 2, likelihood_of_failure: 2 }
              as: CapitalProgramManager
              captures: { p_low: $.data.id }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "High", estimated_cost_usd: 10000, consequence_of_failure: 9, likelihood_of_failure: 9 }
              as: CapitalProgramManager
              captures: { p_high: $.data.id }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "Mid", estimated_cost_usd: 10000, consequence_of_failure: 5, likelihood_of_failure: 5 }
              as: CapitalProgramManager
              captures: { p_mid: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/rank"
              payload: {}
              as: CapitalProgramManager
            - call: "GET /lift-station-ops/capital-projects/${p_high}"
              payload: {}
              as: CapitalProgramManager
              captures: { high_rank: $.data.priority_rank }
            - call: "GET /lift-station-ops/capital-projects/${p_mid}"
              payload: {}
              as: CapitalProgramManager
              captures: { mid_rank: $.data.priority_rank }
            - call: "GET /lift-station-ops/capital-projects/${p_low}"
              payload: {}
              as: CapitalProgramManager
              captures: { low_rank: $.data.priority_rank }
          assert:
            - "high_rank == 1 (highest risk first)"
            - "mid_rank == 2"
            - "low_rank == 3"

      - name: unrank_reverts_ranked_to_proposed
        claim_type: valid_transition
        grounds: ["state_machines.CapitalPlan", "state_machines.CapitalProject"]
        distinguishing_aspect: "RANKED -> DRAFT on plan reverts all RANKED projects back to PROPOSED and clears priority_rank."
        test_recipe:
          setup: ["RANKED plan with two RANKED projects"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0107", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/capital-plans"
              payload: { plan_year: 2030, budget_total_usd: 500000 }
              as: CapitalProgramManager
              captures: { plan_id: $.data.id }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "A", estimated_cost_usd: 10000, consequence_of_failure: 5, likelihood_of_failure: 5 }
              as: CapitalProgramManager
              captures: { pa: $.data.id }
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/rank"
              payload: {}
              as: CapitalProgramManager
          trigger:
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/unrank"
              payload: {}
              as: CapitalProgramManager
            - call: "GET /lift-station-ops/capital-projects/${pa}"
              payload: {}
              as: CapitalProgramManager
              captures: { pa_after: $.data }
          assert:
            - "CapitalProject.${pa}.status == PROPOSED"
            - "CapitalProject.${pa}.priority_rank == null"


  # ==========================================================================
  # Section: calculations — correct result, input set filtering, constants
  # ==========================================================================
  - section: calculations
    instances:
      - name: firm_capacity_n_minus_1_computed_correctly
        claim_type: correct_result
        grounds: ["calculations.firm_capacity_n_minus_1"]
        distinguishing_aspect: "With three IN_SERVICE pumps rated 100, 200, 300, firm capacity = (100+200+300) - max(300) = 300."
        test_recipe:
          setup: ["Station with three IN_SERVICE pumps of varying ratings"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0200", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 300, status: "IN_SERVICE" }
              as: UtilityAdmin
          trigger:
            - call: "GET /lift-station-ops/stations/${st_id}"
              payload: {}
              as: UtilityAdmin
              captures: { firm: $.data.firm_capacity_available_gpm }
          assert:
            - "firm == 300 (sum 600 - largest 300)"

      - name: firm_capacity_excludes_non_in_service
        claim_type: input_set_filtering
        grounds: ["calculations.firm_capacity_n_minus_1"]
        distinguishing_aspect: "STANDBY, OUT_OF_SERVICE, and REBUILD pumps excluded from firm capacity — only IN_SERVICE counted."
        test_recipe:
          setup: ["Station with 4 pumps: 2 IN_SERVICE rated 200, 1 STANDBY rated 200, 1 OUT_OF_SERVICE rated 200"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0201", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 4, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 200, status: "STANDBY" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 4, rated_gpm: 200, status: "OUT_OF_SERVICE" }
              as: UtilityAdmin
          trigger:
            - call: "GET /lift-station-ops/stations/${st_id}"
              payload: {}
              as: UtilityAdmin
              captures: { firm: $.data.firm_capacity_available_gpm }
          assert:
            - "firm == 200 (only 2 IN_SERVICE: 400 - 200)"

      - name: report_deadline_24h_standard
        claim_type: constants_applied
        grounds: ["calculations.report_deadline"]
        distinguishing_aspect: "SsoEvent with reached_surface_water=false gets deadline = started_at + 24h."
        test_recipe:
          setup: ["Station and an SSO with started_at 2026-08-01T10:30:00Z, reached_surface_water=false"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:30:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0202", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T10:30:00Z", cause_code: "DEBRIS", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso: $.data }
          assert:
            - "SsoEvent.${sso.id}.regulator_deadline_at == 2026-08-02T10:30:00Z (started + 24h)"

      - name: report_deadline_12h_surface_water
        claim_type: constants_applied
        grounds: ["calculations.report_deadline"]
        distinguishing_aspect: "SsoEvent with reached_surface_water=true gets deadline = started_at + 12h (stricter tier)."
        test_recipe:
          setup: ["Station and an SSO with reached_surface_water=true"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:30:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0203", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T10:30:00Z", cause_code: "GREASE_BLOCKAGE", reached_surface_water: true, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso: $.data }
          assert:
            - "SsoEvent.${sso.id}.regulator_deadline_at == 2026-08-01T22:30:00Z (started + 12h, surface water tier)"

      - name: sso_volume_surface_water_multiplier
        claim_type: constants_applied
        grounds: ["calculations.sso_volume_estimate"]
        distinguishing_aspect: "SsoEvent with reached_surface_water=true applies the 1.20 multiplier on the volume estimate."
        test_recipe:
          setup: ["Station with two IN_SERVICE pumps rated 250 each; firm capacity = 250. SSO duration 60 minutes."]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0204", service_zone: "Z1", design_capacity_gpm: 500, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 250, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 250, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T00:00:00Z", cause_code: "PUMP_FAILURE", reached_surface_water: true, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { sso_id: $.data.id }
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/sso-events/${sso_id}/contain"
              payload: {}
              as: Operator
              captures: { vol: $.data.estimated_volume_gal }
          assert:
            - "vol == 18000 (60 min * 250 gpm * 1.20 = 18000)"

      - name: runtime_reading_accumulates
        claim_type: correct_result
        grounds: ["entities.Pump.fields.cumulative_runtime_hours"]
        distinguishing_aspect: "Multiple RuntimeReadings accumulate onto Pump.cumulative_runtime_hours."
        test_recipe:
          setup: ["Pump with no readings"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0205", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p_id: $.data.id }
            - call: "POST /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T01:00:00Z", run_hours_delta: 2.5, starts_count: 3, source: "SCADA" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps/${p_id}/runtime-readings"
              payload: { recorded_at: "2026-08-01T02:00:00Z", run_hours_delta: 1.5, starts_count: 2, source: "SCADA" }
              as: UtilityAdmin
            - call: "GET /lift-station-ops/pumps/${p_id}"
              payload: {}
              as: UtilityAdmin
              captures: { cum: $.data.cumulative_runtime_hours }
          assert:
            - "cum == 4.0 (2.5 + 1.5)"

  # ==========================================================================
  # Section: validations — violation_to_error, priority_ordering, etc.
  # ==========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /lift-station-ops/stations"
              payload: {}
              as: MissingRole
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: unauthorized_role_denied
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Operator (entity_backed role) attempting to create a Station (UtilityAdmin exclusive) returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0300", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: duplicate_station_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_STATION_CODE]"]
        distinguishing_aspect: "Second station with same station_code returns ERR_DUPLICATE_STATION_CODE."
        test_recipe:
          setup: ["Station LS-0301 exists"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0301", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0301", service_zone: "Z9", design_capacity_gpm: 999, pump_count: 4, has_backup_generator: true, wet_well_volume_gal: 9000 }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_STATION_CODE"

      - name: duplicate_position_index_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_POSITION]"]
        distinguishing_aspect: "Second pump at same station with same position_index returns ERR_DUPLICATE_POSITION."
        test_recipe:
          setup: ["Station LS-0302 with one pump at position 1"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
