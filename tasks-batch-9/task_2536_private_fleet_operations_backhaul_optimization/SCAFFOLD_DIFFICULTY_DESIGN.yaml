# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2536 - Private Fleet Operations & Backhaul Optimization
# Test-targeting index for the nine Difficulty Rules of SKILL.md §0.5.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file
# leaves the declared behaviour identical.
#
# Canonical fixture F1 (reused verbatim by many instances, always rebuilt from
# empty DB inside each instance's own setup_api_calls):
#   Store  S-1001  rate 600 cases/h, dock_count 2, dock 240..1320
#   Domicile DOM-CHI  target 20, fixed 12000 + overhead 4000 cents/day,
#                     dedicated 285 c/mi and 210 c/case
#   PayPlan MILE-A    78 c/mi, 2200 c/stop, 1500 c/drop-hook, 42 c/min,
#                     minimum_daily 24000, backhaul bonus 5%
#   Driver D-77, Tractor TR-501 (odo 124800, PM 25000, last 100000),
#   Trailer VAN-900 (DRY_VAN, 1800 cases)
#   Trip TRIP-1: DELIVERY 900 cases -> VENDOR_PICKUP 400 -> DROP_OFF 400
#   Derived (computed by executing §1.3 as code):
#     service 105+45+20 = 170, drive 335, break 0, duty 505
#     miles 273 (loaded 205, empty 68), peak_case_load 900
#     planned_end_at 2026-08-03T14:50:00Z
#     PLANNED_ACCRUAL gross 27194 ; FINAL_SETTLEMENT gross 28244 (actual duty 560)

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: trip_pay_planned_accrual_vs_final_settlement_diverge_by_detention
        grounds:
          - calculations.driver_trip_pay
          - entities.Trip.fields.planned_pay_cents
          - entities.Trip.fields.driver_pay_cents
          - entities.DriverPayStatement.fields.hourly_cents
          - state_machines.Trip.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          This dual variant lives on the DRIVER-PAY entity domain (Trip x
          DriverPayPlan x DriverPayStatement): PLANNED_ACCRUAL uses
          planned_duty_minutes as the duty basis and therefore has a
          structurally zero hourly component, while FINAL_SETTLEMENT uses
          actual_duty_minutes and pays 25 detention minutes, so the same trip
          yields 27194 and 28244 cents respectively - a 1050-cent divergence.
        test_recipe:
          setup:
            - "Empty DB; logical clock left at its 2026-08-01T00:00:00Z default until the trip is built."
            - "Fixture F1 fully executed: TRIP-1 planned, dispatched, all three stops completed, trip closed out with actual_drive_minutes 340 and actual_duty_minutes 560."
            - "Trip.planned_duty_minutes == 505, so detention == max(0, 560 - 505 - 30) == 25 minutes."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s1_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-77", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2019-03-04" }
              as: TransportManager
              captures: { drv_77_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-501", domicile_id: "${dom_chi_id}", odometer_miles: 124800, pm_interval_miles: 25000, pm_last_service_odometer: 100000 }
              as: MaintenanceCoordinator
              captures: { trc_501_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-900", domicile_id: "${dom_chi_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trl_900_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s1_id}", cases: 900, weight_lbs: 21000, requested_window_start: "2026-08-03T08:00:00Z", requested_window_end: "2026-08-03T12:00:00Z", temperature_mode: "DRY", priority: 2 }
              as: FleetPlanner
              captures: { ord_1_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-1", domicile_id: "${dom_chi_id}", planned_start_at: "2026-08-03T07:00:00Z" }
              as: FleetPlanner
              captures: { trip_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s1_id}", replenishment_order_id: "${ord_1_id}", scheduled_arrival_at: "2026-08-03T09:00:00Z", scheduled_departure_at: "2026-08-03T10:45:00Z", drive_minutes_from_prev: 150, miles_from_prev: 150, segment_loaded: true, cases: 900 }
              as: FleetPlanner
              captures: { stop_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 2, stop_type: "VENDOR_PICKUP", scheduled_arrival_at: "2026-08-03T12:00:00Z", scheduled_departure_at: "2026-08-03T12:45:00Z", drive_minutes_from_prev: 80, miles_from_prev: 68, segment_loaded: false, cases: 400 }
              as: FleetPlanner
              captures: { stop_2_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 3, stop_type: "DROP_OFF", scheduled_arrival_at: "2026-08-03T14:30:00Z", scheduled_departure_at: "2026-08-03T14:50:00Z", drive_minutes_from_prev: 105, miles_from_prev: 55, segment_loaded: true, cases: 400 }
              as: FleetPlanner
              captures: { stop_3_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/assignments"
              payload: { driver_id: "${drv_77_id}", tractor_id: "${trc_501_id}", trailer_id: "${trl_900_id}" }
              as: TransportManager
            - call: "POST /fleet/trips/${trip_1_id}/plan"
              payload: {}
              as: FleetPlanner
            - call: "POST /fleet/trips/${trip_1_id}/dispatch"
              payload: {}
              as: TransportManager
            - call: "POST /fleet/trip-stops/${stop_1_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_1_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_2_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_2_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_3_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_3_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trips/${trip_1_id}/complete"
              payload: { actual_drive_minutes: 340, actual_duty_minutes: 560 }
              as: TransportManager
          trigger:
            - call: "GET /fleet/trips/${trip_1_id}/pay-preview"
              payload: { variant: "PLANNED_ACCRUAL" }
              as: PayrollAnalyst
              captures: { preview_planned_gross: $.data.gross_cents, preview_planned_hourly: $.data.hourly_cents }
            - call: "GET /fleet/trips/${trip_1_id}/pay-preview"
              payload: { variant: "FINAL_SETTLEMENT" }
              as: PayrollAnalyst
              captures: { preview_final_gross: $.data.gross_cents, preview_final_hourly: $.data.hourly_cents }
          assert:
            - "${preview_planned_gross} == 27194"
            - "${preview_planned_hourly} == 0"
            - "${preview_final_gross} == 28244"
            - "${preview_final_hourly} == 1050"
            - "${preview_final_gross} - ${preview_planned_gross} == 1050"
            - "Trip.${trip_1_id}.planned_pay_cents == 27194"
            - "Trip.${trip_1_id}.driver_pay_cents == 28244"
            - "GET /fleet/pay-statements?trip_id=${trip_1_id} returns exactly 1 row with mileage_cents == 21294, activity_cents == 5900, hourly_cents == 1050, bonus_cents == 0, guarantee_makeup_cents == 0, gross_cents == 28244, variant == FINAL_SETTLEMENT"
            - "no DriverPayStatement is ever persisted with variant == PLANNED_ACCRUAL"

      - name: domicile_benchmark_fully_allocated_vs_incremental_variable_diverge
        grounds:
          - calculations.domicile_cost_benchmark
          - entities.Domicile.fields.fixed_ownership_cents_per_day
          - entities.Domicile.fields.dedicated_rate_cents_per_case
          - endpoints[GET /fleet/domiciles/{domicile_id}/cost-benchmark]
        distinguishing_aspect: |
          This dual variant lives on the DOMICILE COST-ACCOUNTING entity domain,
          not on driver pay: FULLY_ALLOCATED adds 7 x (12000 + 4000) = 112000
          cents of fixed ownership and overhead to the same 50357-cent variable
          base and reports 180 c/case and 595 c/mile, while
          INCREMENTAL_VARIABLE reports 56 c/case and 184 c/mile from the
          identical trip set - flipping the dedicated-carriage advantage from
          30 to 154 cents per case.
        test_recipe:
          setup:
            - "Fixture F1 fully executed exactly as in trip_pay_planned_accrual_vs_final_settlement_diverge_by_detention: TRIP-1 COMPLETED / ACCRUED with total_miles 273, 900 delivered cases and a single ACCRUED statement of 28244 cents."
            - "No BackhaulOffer is linked, so backhaul_credit_cents is 0."
            - "Benchmark window 2026-08-01T00:00:00Z (inclusive) to 2026-08-08T00:00:00Z (exclusive) = 7 window_days, and TRIP-1.planned_start_at 2026-08-03T07:00:00Z falls inside it."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s1_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_a_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-77", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_a_id}", seniority_date: "2019-03-04" }
              as: TransportManager
              captures: { drv_77_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-501", domicile_id: "${dom_chi_id}", odometer_miles: 124800, pm_interval_miles: 25000, pm_last_service_odometer: 100000 }
              as: MaintenanceCoordinator
              captures: { trc_501_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-900", domicile_id: "${dom_chi_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trl_900_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s1_id}", cases: 900, weight_lbs: 21000, requested_window_start: "2026-08-03T08:00:00Z", requested_window_end: "2026-08-03T12:00:00Z", temperature_mode: "DRY", priority: 2 }
              as: FleetPlanner
              captures: { ord_1_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-1", domicile_id: "${dom_chi_id}", planned_start_at: "2026-08-03T07:00:00Z" }
              as: FleetPlanner
              captures: { trip_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s1_id}", replenishment_order_id: "${ord_1_id}", scheduled_arrival_at: "2026-08-03T09:00:00Z", scheduled_departure_at: "2026-08-03T10:45:00Z", drive_minutes_from_prev: 150, miles_from_prev: 150, segment_loaded: true, cases: 900 }
              as: FleetPlanner
              captures: { stop_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 2, stop_type: "VENDOR_PICKUP", scheduled_arrival_at: "2026-08-03T12:00:00Z", scheduled_departure_at: "2026-08-03T12:45:00Z", drive_minutes_from_prev: 80, miles_from_prev: 68, segment_loaded: false, cases: 400 }
              as: FleetPlanner
              captures: { stop_2_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 3, stop_type: "DROP_OFF", scheduled_arrival_at: "2026-08-03T14:30:00Z", scheduled_departure_at: "2026-08-03T14:50:00Z", drive_minutes_from_prev: 105, miles_from_prev: 55, segment_loaded: true, cases: 400 }
              as: FleetPlanner
              captures: { stop_3_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/assignments"
              payload: { driver_id: "${drv_77_id}", tractor_id: "${trc_501_id}", trailer_id: "${trl_900_id}" }
              as: TransportManager
            - call: "POST /fleet/trips/${trip_1_id}/plan"
              payload: {}
              as: FleetPlanner
            - call: "POST /fleet/trips/${trip_1_id}/dispatch"
              payload: {}
              as: TransportManager
            - call: "POST /fleet/trip-stops/${stop_1_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_1_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_2_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_2_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_3_id}/arrive"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trip-stops/${stop_3_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_77_id}"
            - call: "POST /fleet/trips/${trip_1_id}/complete"
              payload: { actual_drive_minutes: 340, actual_duty_minutes: 560 }
              as: TransportManager
          trigger:
            - call: "GET /fleet/domiciles/${dom_chi_id}/cost-benchmark"
              payload: { variant: "FULLY_ALLOCATED", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: TransportManager
              captures: { fa_total: $.data.total_cost_cents, fa_cpc: $.data.cost_per_case_cents, fa_cpm: $.data.cost_per_mile_cents, fa_adv: $.data.advantage_cents_per_case, fa_fixed: $.data.fixed_cost_cents }
            - call: "GET /fleet/domiciles/${dom_chi_id}/cost-benchmark"
              payload: { variant: "INCREMENTAL_VARIABLE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: TransportManager
              captures: { iv_total: $.data.total_cost_cents, iv_cpc: $.data.cost_per_case_cents, iv_cpm: $.data.cost_per_mile_cents, iv_adv: $.data.advantage_cents_per_case, iv_fixed: $.data.fixed_cost_cents }
          assert:
            - "both responses report window_days == 7, trip_count == 1, total_miles == 273, total_cases == 900"
            - "both responses report driver_pay_cents == 28244, fuel_cents == 16926, maintenance_cents == 5187, backhaul_credit_cents == 0, variable_cost_cents == 50357"
            - "${fa_fixed} == 112000 and ${iv_fixed} == 112000 (the fixed pool is reported under both variants; only its inclusion in the total differs)"
            - "${fa_total} == 162357"
            - "${iv_total} == 50357"
            - "${fa_cpc} == 180 and ${fa_cpm} == 595"
            - "${iv_cpc} == 56 and ${iv_cpm} == 184"
            - "${fa_adv} == 30 and ${iv_adv} == 154"
            - "both responses report dedicated_equivalent_cents_per_case == 210"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: trip_pay_mode_a_nested_bonus_detention_and_guarantee_floor_compose
        grounds:
          - calculations.driver_trip_pay
          - entities.DriverPayStatement.fields.bonus_cents
          - entities.DriverPayStatement.fields.guarantee_makeup_cents
          - entities.DriverPayPlan.fields.minimum_daily_cents
          - entities.Trip.fields.backhaul_credit_cents
        distinguishing_aspect: |
          MODE (a) - NESTED CONDITIONAL COMPOSITION. Four independent branches
          have to compose in one pass: the backhaul bonus is a percentage of
          (mileage + activity) but deliberately EXCLUDES the hourly detention
          component; the detention component is itself a max(0, ...) over a
          grace window; and the daily guarantee is a second max(0, ...) applied
          to the ALREADY-summed and already-rounded subtotal. Computing the
          bonus on the full subtotal instead of the bonus base yields
          bonus_cents 1412 and guarantee_makeup_cents 344 instead of 1360 and
          396 - both observable as separate persisted fields even though
          gross_cents is 30000 either way.
        test_recipe:
          setup:
            - "Fixture F1 with pay plan MILE-G, which is MILE-A with minimum_daily_cents raised to 30000 so the guarantee floor actually binds."
            - "BackhaulOffer B1 (revenue 54000, 400 cases, 42 deadhead + 168 loaded miles, DRY) is accepted and linked to the trip while it is PLANNED, giving contribution_margin_cents 8310."
            - "Actual minutes 340 drive / 560 duty against planned_duty_minutes 505 give 25 detention minutes."
            - "Expected component decomposition: mileage 21294, activity 5900, hourly 1050, bonus round_half_up((21294 + 5900) * 0.05) = 1360, subtotal 29604, guarantee_makeup 30000 - 29604 = 396, gross 30000."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s1_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-CHI", region_code: "MIDWEST", tractor_capacity: 40, driver_headcount_target: 20, fixed_ownership_cents_per_day: 12000, overhead_cents_per_day: 4000, dedicated_rate_cents_per_mile: 285, dedicated_rate_cents_per_case: 210 }
              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-G", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 30000, backhaul_bonus_pct: 0.05 }
              as: PayrollAnalyst
              captures: { plan_g_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-77", domicile_id: "${dom_chi_id}", pay_plan_id: "${plan_g_id}", seniority_date: "2019-03-04" }
              as: TransportManager
              captures: { drv_77_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-501", domicile_id: "${dom_chi_id}", odometer_miles: 124800, pm_interval_miles: 25000, pm_last_service_odometer: 100000 }
              as: MaintenanceCoordinator
              captures: { trc_501_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-900", domicile_id: "${dom_chi_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trl_900_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s1_id}", cases: 900, weight_lbs: 21000, requested_window_start: "2026-08-03T08:00:00Z", requested_window_end: "2026-08-03T12:00:00Z", temperature_mode: "DRY", priority: 2 }
              as: FleetPlanner
              captures: { ord_1_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-1", domicile_id: "${dom_chi_id}", planned_start_at: "2026-08-03T07:00:00Z" }
              as: FleetPlanner
              captures: { trip_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_s1_id}", replenishment_order_id: "${ord_1_id}", scheduled_arrival_at: "2026-08-03T09:00:00Z", scheduled_departure_at: "2026-08-03T10:45:00Z", drive_minutes_from_prev: 150, miles_from_prev: 150, segment_loaded: true, cases: 900 }
              as: FleetPlanner
              captures: { stop_1_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 2, stop_type: "VENDOR_PICKUP", scheduled_arrival_at: "2026-08-03T12:00:00Z", scheduled_departure_at: "2026-08-03T12:45:00Z", drive_minutes_from_prev: 80, miles_from_prev: 68, segment_loaded: false, cases: 400 }
              as: FleetPlanner
              captures: { stop_2_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/stops"
              payload: { sequence: 3, stop_type: "DROP_OFF", scheduled_arrival_at: "2026-08-03T14:30:00Z", scheduled_departure_at: "2026-08-03T14:50:00Z", drive_minutes_from_prev: 105, miles_from_prev: 55, segment_loaded: true, cases: 400 }
              as: FleetPlanner
              captures: { stop_3_id: $.data.id }
            - call: "POST /fleet/trips/${trip_1_id}/assignments"
