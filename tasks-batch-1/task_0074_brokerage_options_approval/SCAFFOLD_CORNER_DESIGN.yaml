  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_margin_upgrade_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[margin-upgrade-approve-stale-account]"
          - "state_machines.MarginUpgrade.SUBMITTED_to_APPROVED"
        distinguishing_aspect: "Approving a margin upgrade with expected_account_version equal to current Account.version succeeds, sets Account.margin_type=REG_T, and increments Account.version by 1."
        test_recipe:
          setup: ["Account active, CASH; a SUBMITTED REG_T MarginUpgrade"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_a}", requested_margin_type: "REG_T" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu1: $.data.id }
            - call: "POST /margin-upgrades/${mu1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /margin-upgrades/${mu1}/approve"
              payload: { expected_account_version: "${v1}" }
