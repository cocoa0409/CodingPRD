  - rule_id: combinatorial_formula
    instances:
      - name: quote_season_split_weekly_runs
        grounds:
          - calculations.rental_quote
          - entities.Booking.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (a) tiered/non-linear formula with 3+ interacting inputs (size-class nightly rate,
          closed season windows, per-season weekly runs): the 15-night stay splits 4 PEAK + 11
          SHOULDER nights and only the SHOULDER side yields a floor(11/7)=1 weekly run (45500
          discount); a naive whole-stay floor(15/7)=2-run reading would price differently, so the
          per-season split pins the result at 1029500.
        test_recipe:
          setup:
            - "LUXE_56 vessel with PEAK (2026-06-01..2026-08-31, 90000) and SHOULDER (2026-09-01..2026-10-31, 65000) rates, weekly 10%"
            - "Qualified renter (VERIFIED cert expires 2027-06-30); clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /vessels"
              payload: { name: "Luxe Two", size_class: "LUXE_56", berth_count: 8, home_marina: "Wahweap", fuel_tank_capacity_gallons: 300 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /season-rates"
              payload: { size_class: "LUXE_56", season: "PEAK", start_date: "2026-06-01", end_date: "2026-08-31", nightly_rate_cents: 90000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /season-rates"
              payload: { size_class: "LUXE_56", season: "SHOULDER", start_date: "2026-09-01", end_date: "2026-10-31", nightly_rate_cents: 65000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /renters"
              payload: { full_name: "Quinn Split", email: "quinn@x.com", date_of_birth: "1990-02-14" }
              as: Renter
              captures: { r_id: $.data.id }
            - call: "POST /renters/${r_id}/certificates"
              payload: { cert_number: "C-300", issuing_authority: "STATE", issued_on: "2026-03-01", expires_on: "2027-06-30" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { c_id: $.data.id }
            - call: "POST /certificates/${c_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
          trigger:
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-08-28", end_date: "2026-09-12", party_size: 4 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { q: $.data.quoted_total_cents, nights: $.data.total_nights }
          assert:
            - "Booking.quoted_total_cents == 1029500 (subtotal 4x90000 + 11x65000 = 1075000 minus SHOULDER weekly run 7x65000x10% = 45500)"
            - "Booking.total_nights == 15"
            - "PEAK side contributes floor(4/7)=0 discounted nights — discount is 45500, not 2 runs"

      - name: settlement_refund_line_rounding_order
        grounds:
          - calculations.settlement_total
          - calculations.mechanical_prorated_refund
          - entities.Charge.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order (different mode than the sibling's tiered
          formula): MECHANICAL_REFUND rounds 1029500 x 5/15 = 343166.67 up to 343167 per line BEFORE
          the settlement sum; summing unrounded components or truncating would net -318166 instead of
          -318167, so the pinned per-line round_half_up is observable in final_settlement_cents.
        test_recipe:
          setup:
            - "LUXE_56 vessel with PEAK + SHOULDER rates; qualified renter; booking 2026-08-28 -> 2026-09-12 (quoted 1029500) CHECKED_OUT at gauge 100 with pump-out done"
            - "Clock advanced to 2026-09-07; MECHANICAL_FAILURE incident reported"
          setup_api_calls:
