          - errors.ERR_FACILITY_APPLICANT_MISMATCH
          - endpoints."POST /gfco/products"
        distinguishing_aspect: |
          Both FKs resolve, so this is not a 404: the product's applicant_id and the
          facility's applicant_id must agree, otherwise one applicant could certify a product
          made in a plant it does not control - and the threshold calculation would read
          another company's shared-equipment posture.
        test_recipe:
          setup:
