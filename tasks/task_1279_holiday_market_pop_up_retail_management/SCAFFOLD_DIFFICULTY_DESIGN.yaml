              payload: {}
              as: VendorRole
              as_user_id: "${v9_id}"
            - call: "POST /markets/${m9_id}/applications/${a9_id}/score"
              payload: { score_0_100: 80 }
              as: JuryMember
            - call: "POST /markets/${m9_id}/applications/${a9_id}/score"
