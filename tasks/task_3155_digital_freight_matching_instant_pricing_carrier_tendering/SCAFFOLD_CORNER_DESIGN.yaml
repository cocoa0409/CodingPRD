      - Load.${load_id}.tracking_status_rank == 2
  - name: status_event_append_stamps_its_source_from_the_acting_role
    claim_type: System Fields
    grounds:
    - entities.StatusEvent.fields.source
    - endpoints.POST_/v1/status-events
    distinguishing_aspect: 'StatusEvent''s source is derived from the acting role, never from the body: a Shipper-authored
      note is stamped SHIPPER_PORTAL and the same endpoint called by the carrier would stamp DRIVER_APP, so a body-supplied
      source field is ignored.'
    test_recipe:
      setup:
