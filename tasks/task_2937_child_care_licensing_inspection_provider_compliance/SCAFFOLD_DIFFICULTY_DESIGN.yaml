      - name: non_linear_license_status_two_edges_into_full
        grounds:
          - state_machines.Provider.license_status.PROVISIONAL_to_PROBATION
          - state_machines.Provider.license_status.PROBATION_to_FULL
          - state_machines.EnforcementAction.APPEALED_to_VACATED
