              as: NetworkCoordinator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /care-network/organizations"
              payload: { name: "Rogue Org", org_type: "CBO", ein: "EIN-X" }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and HTTP status == 403"

