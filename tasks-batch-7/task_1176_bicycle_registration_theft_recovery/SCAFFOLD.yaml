# =============================================================================
# Task 1176 — Bicycle Registration & Theft Recovery Program (Bike Index style)
# Scaffold seed tables (§1.0–§1.7). Difficulty target: beyond Expert band —
# dense coupling (parallel state dimensions, depth-3 cascades, dual-variant
# scoring, pinned rounding/evaluation order, dual OCC guards, dual temporal
# overlap semantics, double-entry + seat compensating invariants).
# =============================================================================

scenario: |
  1176. Bicycle Registration & Theft Recovery Program (Bike Index style registry): registration with serial number & photo, transfer of ownership & sale reporting, theft report intake & flagging in registry, recovered bike matching & owner notification, unclaimed recovered bike disposition/auction, partnership with law enforcement & shops, registration event & campus programs, database accuracy & duplicate handling

domain_name: bicycle-theft-recovery
api_prefix: /registry

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # registry integrity, disposition wait periods, segregation between program staff (Registrar) and platform operator (Admin)
  secondary_archetype: workflow_orchestration # report review loops, match->claim->return pipeline, auction disposition pipeline
  complexity_layers:
    - optimistic_concurrency                  # PATCH bicycle + POST bid guarded by OCC version
    - cascading_side_effects                  # flag cascade (report->bike->transfer->notification), claim-approve cascade (claim->match->intake->bike+report)
    - dual_variant_calculation                # match score screening vs forensic; auction estimate vs final settlement
    - rate_threshold_triggers                 # match notify threshold 7000bp, duplicate auto-flag 8500bp, storage free-days boundary
  entity_topology: flat                       # peer entities joined by FK references; all URLs flat under /registry
  state_machine_shape: cyclic                 # TheftReport UNDER_REVIEW<->NEEDS_INFO loop; Bicycle registry cycle REGISTERED->STOLEN->REGISTERED; Bicycle carries PARALLEL dimensions (registry_status x integrity_status)
  relationship_patterns:
    - one_to_many
    - cross_aggregate                         # MatchCandidate spans RecoveryIntake x TheftReport x Bicycle; LedgerEntry references 4 aggregates
  role_model: peer_roles                      # Owner / Partner / Registrar / Admin own disjoint operations; Anonymous only self-registers
  consistency_model: immediate                # all side effects atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across Owners (case-insensitive)" }
      - { name: password, type: string, source: input, description: "Login password; stored as hash, never returned" }
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }
      - { name: bikes_registered_count, type: integer, source: computed, description: "Count of Bicycle rows with current_owner_id == this Owner.id and integrity_status != MERGED" }

  - name: PartnerOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization name" }
      - { name: org_type, type: enum, source: input, description: "LAW_ENFORCEMENT | BIKE_SHOP | CAMPUS", constraints: "enum {LAW_ENFORCEMENT, BIKE_SHOP, CAMPUS}" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction / campus code, e.g. SFPD-CENTRAL" }
      - { name: contact_email, type: string, source: input, description: "Organization contact email" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | REVOKED", default: "PENDING", constraints: "enum {PENDING, ACTIVE, SUSPENDED, REVOKED}" }
      - { name: total_recoveries_count, type: integer, source: computed, description: "Count of RecoveryIntake rows with partner_org_id == this PartnerOrg.id" }
      - { name: storage_fees_earned_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents where entry_type == STORAGE_FEE, direction == CREDIT, partner_org_id == this PartnerOrg.id" }

  - name: Bicycle
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial as stamped on frame; normalized via serial_normalization" }
      - { name: serial_normalized, type: string, source: computed, description: "Canonical serial: uppercase, strip non-alphanumerics, confusable map O->0,I->1,L->1,S->5,B->8,Z->2,G->6,Q->0" }
      - { name: manufacturer, type: string, source: input, description: "Manufacturer name" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: primary_color, type: string, source: input, description: "Primary frame color" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared value in cents; drives registration_fee tier", constraints: ">= 0" }
      - { name: photo_url, type: string, source: input, description: "URL of registration photo" }
      - { name: photo_hash, type: string, source: input, description: "64-bit perceptual hash of photo, 16 lowercase hex chars", default: null }
      - { name: registration_fee_cents, type: integer, source: computed, description: "Fee charged at registration per registration_fee calculation; 0 when waiver applied" }
      - { name: waiver_code_used, type: string, source: system, description: "Waiver code consumed at registration, null when none", default: null }
      - { name: current_owner_id, type: string, source: system, description: "FK -> Owner.id; set to registering owner at creation, rewritten on transfer accept" }
      - { name: registry_status, type: enum, source: system, description: "REGISTERED | STOLEN | RECOVERED | RETURNED", default: "REGISTERED", constraints: "enum {REGISTERED, STOLEN, RECOVERED, RETURNED}" }
      - { name: integrity_status, type: enum, source: system, description: "CLEAR | DUPLICATE_SUSPECT | MERGED; independent parallel dimension from registry_status", default: "CLEAR", constraints: "enum {CLEAR, DUPLICATE_SUSPECT, MERGED}" }

  - name: OwnershipTransfer
    parent: null
    common_fields: true
    fields:
      - { name: bicycle_id, type: string, source: input, description: "FK -> Bicycle.id; bicycle being sold/transferred" }
      - { name: from_owner_id, type: string, source: system, description: "FK -> Owner.id; seller, equals the acting owner at creation" }
      - { name: to_owner_id, type: string, source: system, description: "FK -> Owner.id; buyer, resolved from to_owner_email at creation" }
      - { name: to_owner_email, type: string, source: input, description: "Buyer email; must resolve to an existing Owner" }
      - { name: sale_price_cents, type: integer, source: input, description: "Reported sale price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING_ACCEPTANCE | COMPLETED | REJECTED | CANCELLED | EXPIRED", default: "PENDING_ACCEPTANCE", constraints: "enum {PENDING_ACCEPTANCE, COMPLETED, REJECTED, CANCELLED, EXPIRED}" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + 7 days; accept allowed while now <= expires_at" }

  - name: TheftReport
    parent: null
    common_fields: true
    fields:
      - { name: bicycle_id, type: string, source: input, description: "FK -> Bicycle.id; stolen bicycle" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; reporting owner, equals acting owner" }
      - { name: occurred_at, type: datetime, source: input, description: "When the theft occurred" }
      - { name: theft_location, type: string, source: input, description: "Free-text theft location" }
      - { name: police_case_number, type: string, source: input, description: "Law-enforcement case number", default: null }
      - { name: description, type: string, source: input, description: "Circumstances narrative", default: null }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | NEEDS_INFO | FLAGGED | REJECTED | WITHDRAWN | CLOSED_RECOVERED", default: "UNDER_REVIEW", constraints: "enum {UNDER_REVIEW, NEEDS_INFO, FLAGGED, REJECTED, WITHDRAWN, CLOSED_RECOVERED}" }
      - { name: info_request_text, type: string, source: system, description: "Registrar's request-for-info text", default: null }
      - { name: response_text, type: string, source: system, description: "Owner's response text", default: null }
      - { name: flagged_at, type: datetime, source: system, description: "Logical-clock timestamp when report became FLAGGED", default: null }

  - name: RecoveryIntake
    parent: null
    common_fields: true
    fields:
      - { name: partner_org_id, type: string, source: system, description: "FK -> PartnerOrg.id; equals acting Partner's org" }
      - { name: serial_number_raw, type: string, source: input, description: "Serial as observed on recovered frame; may be partial or damaged" }
      - { name: serial_normalized, type: string, source: computed, description: "serial_normalization of serial_number_raw" }
      - { name: manufacturer, type: string, source: input, description: "Observed manufacturer", default: null }
      - { name: model, type: string, source: input, description: "Observed model", default: null }
      - { name: primary_color, type: string, source: input, description: "Observed primary color" }
      - { name: photo_url, type: string, source: input, description: "Intake photo URL", default: null }
      - { name: photo_hash, type: string, source: input, description: "64-bit perceptual hash of intake photo, 16 lowercase hex chars", default: null }
      - { name: found_at, type: datetime, source: input, description: "When the bike was found" }
      - { name: found_location, type: string, source: input, description: "Where the bike was found" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Partner's appraised value; drives storage cap and auction reserve", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "INTAKE | CLAIM_PENDING | RETURNED | UNCLAIMED | DISPOSITION_SCHEDULED | DISPOSED", default: "INTAKE", constraints: "enum {INTAKE, CLAIM_PENDING, RETURNED, UNCLAIMED, DISPOSITION_SCHEDULED, DISPOSED}" }

  - name: MatchCandidate
    parent: null
    common_fields: true
    fields:
      - { name: recovery_intake_id, type: string, source: system, description: "FK -> RecoveryIntake.id; the scanned intake" }
      - { name: theft_report_id, type: string, source: system, description: "FK -> TheftReport.id; the candidate flagged report" }
      - { name: bicycle_id, type: string, source: system, description: "FK -> Bicycle.id; denormalized from TheftReport.bicycle_id for filtering" }
      - { name: screening_score, type: integer, source: computed, description: "match_score screening variant, basis points 0..10000" }
      - { name: forensic_score, type: integer, source: computed, description: "match_score forensic variant, basis points 0..10000" }
      - { name: status, type: enum, source: system, description: "PROPOSED | NOTIFIED | CONFIRMED | DISMISSED | EXPIRED", constraints: "enum {PROPOSED, NOTIFIED, CONFIRMED, DISMISSED, EXPIRED}" }

  - name: OwnerClaim
    parent: null
    common_fields: true
    fields:
      - { name: recovery_intake_id, type: string, source: input, description: "FK -> RecoveryIntake.id; intake being claimed" }
      - { name: match_id, type: string, source: input, description: "FK -> MatchCandidate.id; must be a NOTIFIED match whose theft report belongs to the claiming owner" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; claiming owner, equals acting owner" }
      - { name: proof_text, type: string, source: input, description: "Proof of ownership narrative (receipts, photos, distinguishing marks)" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN", default: "UNDER_REVIEW", constraints: "enum {UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN}" }
      - { name: reason_text, type: string, source: system, description: "Registrar rejection reason", default: null }

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - { name: recovery_intake_id, type: string, source: input, description: "FK -> RecoveryIntake.id; exactly one non-CANCELLED auction per intake" }
      - { name: starts_at, type: datetime, source: input, description: "Bidding window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Bidding window end; bids accepted while now <= ends_at and auction OPEN" }
      - { name: reserve_price_cents, type: integer, source: computed, description: "max(1000, round_half_up(0.20 * RecoveryIntake.appraised_value_cents))" }
      - { name: estimated_storage_fee_cents, type: integer, source: computed, description: "Estimate variant: storage accrued through ends_at, capped at round_half_up(0.30 * reserve_price_cents)" }
      - { name: estimated_program_commission_cents, type: integer, source: computed, description: "Estimate variant commission over base = reserve_price_cents - estimated_storage_fee_cents" }
      - { name: estimated_partner_payout_cents, type: integer, source: computed, description: "Estimate variant: reserve_price_cents - estimated_storage_fee_cents - estimated_program_commission_cents" }
      - { name: final_storage_fee_cents, type: integer, source: computed, description: "Final variant at settle: storage accrued through actual close time, capped at round_half_up(0.30 * winning bid)", default: null }
      - { name: final_program_commission_cents, type: integer, source: computed, description: "Final variant commission over base = winning_bid - final_storage_fee_cents", default: null }
      - { name: final_partner_payout_cents, type: integer, source: computed, description: "Final variant: winning_bid - final_storage_fee_cents - final_program_commission_cents", default: null }
      - { name: winning_bid_id, type: string, source: system, description: "id of the Bid that won (reference only; equal to the Bid row with status WON after settle), null when no bids", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | SETTLED | VOIDED | CANCELLED", default: "SCHEDULED", constraints: "enum {SCHEDULED, OPEN, CLOSED, SETTLED, VOIDED, CANCELLED}" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when close executed; drives final storage accrual", default: null }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id; from path" }
      - { name: bidder_owner_id, type: string, source: system, description: "FK -> Owner.id; equals acting owner" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in cents", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUTBID | WINNING | WON | LOST | RETRACTED", default: "ACTIVE", constraints: "enum {ACTIVE, OUTBID, WINNING, WON, LOST, RETRACTED}" }

  - name: RegistryEvent
    parent: null
    common_fields: true
    fields:
      - { name: host_org_id, type: string, source: input, description: "FK -> PartnerOrg.id; must reference an ACTIVE PartnerOrg with org_type == CAMPUS" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: venue, type: string, source: input, description: "Venue free text" }
      - { name: starts_at, type: datetime, source: input, description: "Event window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Event window end (exclusive for overlap purposes)" }
      - { name: capacity, type: integer, source: input, description: "Maximum concurrent BOOKED registrations", constraints: ">= 1" }
      - { name: registered_count, type: integer, source: computed, description: "Count of EventRegistration rows with event_id == this id and status == BOOKED; invariant registered_count + available == capacity", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | COMPLETED | CANCELLED", default: "DRAFT", constraints: "enum {DRAFT, PUBLISHED, COMPLETED, CANCELLED}" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> RegistryEvent.id; from path" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; equals acting owner" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED", default: "BOOKED", constraints: "enum {BOOKED, CANCELLED}" }
      - { name: waiver_code, type: string, source: system, description: "Server-minted fee-waiver code issued with the booking" }
      - { name: waiver_used, type: boolean, source: system, description: "True once the waiver code has been consumed by a bicycle registration", default: false }

  - name: DuplicateFlag
    parent: null
    common_fields: true
    fields:
      - { name: bicycle_a_id, type: string, source: input, description: "FK -> Bicycle.id; first bicycle of the suspect pair" }
      - { name: bicycle_b_id, type: string, source: input, description: "FK -> Bicycle.id; second bicycle of the suspect pair; must differ from bicycle_a_id" }
      - { name: confidence_score, type: integer, source: computed, description: "duplicate_confidence over the pair, basis points 0..10000" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED", default: "OPEN", constraints: "enum {OPEN, CONFIRMED, DISMISSED}" }
      - { name: merged_into_bicycle_id, type: string, source: system, description: "FK -> Bicycle.id; surviving bicycle chosen at confirm", default: null }
      - { name: note, type: string, source: input, description: "Reporter note", default: null }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: entry_type, type: enum, source: system, description: "REGISTRATION_FEE | FEE_WAIVER | TRANSFER_FEE | STORAGE_FEE | AUCTION_COMMISSION | AUCTION_PARTNER_PAYOUT | AUCTION_ESCROW | REVERSAL", constraints: "enum {REGISTRATION_FEE, FEE_WAIVER, TRANSFER_FEE, STORAGE_FEE, AUCTION_COMMISSION, AUCTION_PARTNER_PAYOUT, AUCTION_ESCROW, REVERSAL}" }
      - { name: direction, type: enum, source: system, description: "DEBIT | CREDIT", constraints: "enum {DEBIT, CREDIT}" }
      - { name: account, type: enum, source: system, description: "OWNER | PARTNER_ORG | PROGRAM | ESCROW", constraints: "enum {OWNER, PARTNER_ORG, PROGRAM, ESCROW}" }
      - { name: amount_cents, type: integer, source: system, description: "Entry amount in cents", constraints: ">= 0" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; populated when account == OWNER", default: null }
      - { name: partner_org_id, type: string, source: system, description: "FK -> PartnerOrg.id; populated when account == PARTNER_ORG", default: null }
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id; populated for auction-related entries", default: null }
      - { name: bicycle_id, type: string, source: system, description: "FK -> Bicycle.id; populated for registration/transfer fee entries", default: null }
      - { name: reference_note, type: string, source: system, description: "Human-readable provenance note", default: null }

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; recipient owner" }
      - { name: kind, type: enum, source: system, description: "MATCH_FOUND | CLAIM_APPROVED | CLAIM_REJECTED | TRANSFER_COMPLETED | TRANSFER_CANCELLED_STOLEN | REPORT_FLAGGED | BID_OUTBID | AUCTION_WON", constraints: "enum {MATCH_FOUND, CLAIM_APPROVED, CLAIM_REJECTED, TRANSFER_COMPLETED, TRANSFER_CANCELLED_STOLEN, REPORT_FLAGGED, BID_OUTBID, AUCTION_WON}" }
      - { name: message, type: string, source: system, description: "Notification body" }
      - { name: related_entity_type, type: string, source: system, description: "Entity type of the related object (polymorphic label, not an FK)", default: null }
      - { name: related_entity_id, type: string, source: system, description: "id of the related object (polymorphic reference, not an FK)", default: null }
      - { name: read, type: boolean, source: system, description: "Read flag toggled by mark-read", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bicycle
    field: registry_status
    initial_state: REGISTERED
    terminal_states: []
    note: "Parallel dimension 1 of 2 on Bicycle; evolves independently of integrity_status. Cyclic: REGISTERED -> STOLEN -> REGISTERED via report withdraw."
    transitions:
      - from: REGISTERED
        to: STOLEN
        trigger: "system cascade — POST /registry/theft-reports/{id}/flag transitions a TheftReport for this bicycle to FLAGGED"
        actor: system
        preconditions:
          - "The flagged TheftReport.bicycle_id == this Bicycle.id"
        side_effects:
          - "Bicycle.version increments by 1"
          - "Every OwnershipTransfer with bicycle_id == this Bicycle.id and status == PENDING_ACCEPTANCE transitions to CANCELLED; each such transfer's version increments by 1; that cancellation itself creates a Notification(kind=TRANSFER_CANCELLED_STOLEN) to the transfer's to_owner_id"
          - "Notification(kind=REPORT_FLAGGED) created for Bicycle.current_owner_id"
      - from: STOLEN
        to: REGISTERED
        trigger: "system cascade — POST /registry/theft-reports/{id}/withdraw on the FLAGGED report for this bicycle"
        actor: system
        preconditions:
          - "The withdrawn TheftReport.bicycle_id == this Bicycle.id and report was FLAGGED"
        side_effects:
          - "Bicycle.version increments by 1"
          - "Every MatchCandidate with theft_report_id == the withdrawn report and status IN {PROPOSED, NOTIFIED} transitions to EXPIRED"
      - from: STOLEN
        to: RECOVERED
        trigger: "system cascade — claim approval chain (see OwnerClaim APPROVED) reaches this bicycle via the confirmed match"
        actor: system
        preconditions:
          - "The confirmed MatchCandidate.bicycle_id == this Bicycle.id"
        side_effects:
          - "Bicycle.version increments by 1"
      - from: RECOVERED
        to: RETURNED
        trigger: "system cascade — POST /registry/recovery-intakes/{id}/complete-return on the intake whose confirmed match references this bicycle"
        actor: system
        preconditions:
          - "RecoveryIntake.status == CLAIM_PENDING and its confirmed MatchCandidate.bicycle_id == this Bicycle.id"
        side_effects:
          - "Bicycle.version increments by 1"

  - entity: Bicycle
    field: integrity_status
    initial_state: CLEAR
    terminal_states: [MERGED]
    note: "Parallel dimension 2 of 2 on Bicycle; independent of registry_status. Cyclic CLEAR -> DUPLICATE_SUSPECT -> CLEAR on dismiss."
    transitions:
      - from: CLEAR
        to: DUPLICATE_SUSPECT
        trigger: "system auto-flag at bicycle creation or scan (duplicate_confidence >= 8500 with a non-exact normalized serial), OR POST /registry/duplicate-flags naming this bicycle"
        actor: system
        preconditions:
          - "A DuplicateFlag in OPEN status exists naming this bicycle as bicycle_a_id or bicycle_b_id"
        side_effects:
          - "Bicycle.version increments by 1"
      - from: DUPLICATE_SUSPECT
        to: CLEAR
        trigger: "system cascade — POST /registry/duplicate-flags/{id}/dismiss on the OPEN flag naming this bicycle"
        actor: system
        preconditions:
          - "DuplicateFlag.status == OPEN and flag names this bicycle"
        side_effects:
          - "Bicycle.version increments by 1"
      - from: DUPLICATE_SUSPECT
        to: MERGED
        trigger: "system cascade — POST /registry/duplicate-flags/{id}/confirm where merged_into_bicycle_id != this Bicycle.id (this bicycle is the loser)"
        actor: system
        preconditions:
          - "DuplicateFlag.status == OPEN and flag names this bicycle"
        side_effects:
          - "Bicycle.version increments by 1"
          - "Every TheftReport with bicycle_id == this Bicycle.id and status IN {UNDER_REVIEW, NEEDS_INFO} transitions to WITHDRAWN"
          - "Every OwnershipTransfer with bicycle_id == this Bicycle.id and status == PENDING_ACCEPTANCE transitions to CANCELLED"

  - entity: PartnerOrg
    field: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /registry/partner-orgs/{id}/activate"
        actor: Admin
        preconditions: ["PartnerOrg.status == PENDING"]
        side_effects: ["PartnerOrg.version increments by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registry/partner-orgs/{id}/suspend"
        actor: Admin
        preconditions: ["PartnerOrg.status == ACTIVE"]
        side_effects: ["PartnerOrg.version increments by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registry/partner-orgs/{id}/activate"
        actor: Admin
        preconditions: ["PartnerOrg.status == SUSPENDED"]
        side_effects: ["PartnerOrg.version increments by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /registry/partner-orgs/{id}/revoke"
        actor: Admin
        preconditions: ["PartnerOrg.status == ACTIVE"]
        side_effects: ["PartnerOrg.version increments by 1"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /registry/partner-orgs/{id}/revoke"
        actor: Admin
        preconditions: ["PartnerOrg.status == SUSPENDED"]
        side_effects: ["PartnerOrg.version increments by 1"]

  - entity: OwnershipTransfer
    field: status
    initial_state: PENDING_ACCEPTANCE
    terminal_states: [COMPLETED, REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_ACCEPTANCE
        to: COMPLETED
        trigger: "POST /registry/transfers/{id}/accept"
        actor: Owner
        preconditions:
          - "OwnershipTransfer.status == PENDING_ACCEPTANCE"
          - "Acting owner id == OwnershipTransfer.to_owner_id"
          - "now <= OwnershipTransfer.expires_at (else transfer auto-transitions to EXPIRED and the call fails ERR_TRANSFER_EXPIRED)"
          - "Bicycle.registry_status == REGISTERED and Bicycle.integrity_status == CLEAR"
        side_effects:
          - "Bicycle.current_owner_id := OwnershipTransfer.to_owner_id; Bicycle.version increments by 1"
          - "LedgerEntry pair: DEBIT/OWNER TRANSFER_FEE 300 to buyer + CREDIT/PROGRAM TRANSFER_FEE 300, both carrying bicycle_id"
          - "Notification(kind=TRANSFER_COMPLETED) created for from_owner_id"
          - "OwnershipTransfer.version increments by 1"
      - from: PENDING_ACCEPTANCE
        to: REJECTED
        trigger: "POST /registry/transfers/{id}/reject"
        actor: Owner
        preconditions:
          - "OwnershipTransfer.status == PENDING_ACCEPTANCE"
          - "Acting owner id == OwnershipTransfer.to_owner_id"
        side_effects: ["OwnershipTransfer.version increments by 1"]
      - from: PENDING_ACCEPTANCE
        to: CANCELLED
        trigger: "POST /registry/transfers/{id}/cancel OR system cascade (bicycle flagged STOLEN, or bicycle merged)"
        actor: Owner
        preconditions:
          - "OwnershipTransfer.status == PENDING_ACCEPTANCE"
          - "For the direct endpoint: acting owner id == OwnershipTransfer.from_owner_id; if now > expires_at the transfer instead auto-transitions to EXPIRED and the call fails ERR_TRANSFER_EXPIRED"
        side_effects:
          - "OwnershipTransfer.version increments by 1"
          - "When triggered by the stolen cascade: Notification(kind=TRANSFER_CANCELLED_STOLEN) created for to_owner_id"
      - from: PENDING_ACCEPTANCE
        to: EXPIRED
        trigger: "system lazy expiry — evaluated when accept or cancel is attempted with now > OwnershipTransfer.expires_at"
        actor: system
        preconditions:
          - "OwnershipTransfer.status == PENDING_ACCEPTANCE and now > OwnershipTransfer.expires_at"
        side_effects: ["OwnershipTransfer.version increments by 1"]

  - entity: TheftReport
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [REJECTED, WITHDRAWN, CLOSED_RECOVERED]
    note: "Cyclic review loop UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW is unbounded."
    transitions:
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /registry/theft-reports/{id}/request-info"
        actor: Registrar
        preconditions: ["TheftReport.status == UNDER_REVIEW"]
        side_effects:
          - "TheftReport.info_request_text := input info_request_text; version increments by 1"
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /registry/theft-reports/{id}/respond"
        actor: Owner
        preconditions:
          - "TheftReport.status == NEEDS_INFO"
          - "Acting owner id == TheftReport.owner_id"
        side_effects:
          - "TheftReport.response_text := input response_text; version increments by 1"
      - from: UNDER_REVIEW
        to: FLAGGED
        trigger: "POST /registry/theft-reports/{id}/flag"
        actor: Registrar
        preconditions:
          - "TheftReport.status == UNDER_REVIEW"
          - "Bicycle.integrity_status != MERGED"
        side_effects:
          - "TheftReport.flagged_at := current logical clock; version increments by 1"
          - "Bicycle.registry_status transitions REGISTERED -> STOLEN (see Bicycle registry machine; this fires its own transfer-cancellation and notification cascade)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /registry/theft-reports/{id}/reject"
        actor: Registrar
        preconditions: ["TheftReport.status == UNDER_REVIEW"]
        side_effects: ["TheftReport.version increments by 1"]
      - from: NEEDS_INFO
        to: REJECTED
        trigger: "POST /registry/theft-reports/{id}/reject"
        actor: Registrar
        preconditions: ["TheftReport.status == NEEDS_INFO"]
        side_effects: ["TheftReport.version increments by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /registry/theft-reports/{id}/withdraw"
        actor: Owner
        preconditions:
          - "TheftReport.status == UNDER_REVIEW"
          - "Acting owner id == TheftReport.owner_id"
        side_effects: ["TheftReport.version increments by 1"]
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /registry/theft-reports/{id}/withdraw"
        actor: Owner
        preconditions:
          - "TheftReport.status == NEEDS_INFO"
          - "Acting owner id == TheftReport.owner_id"
        side_effects: ["TheftReport.version increments by 1"]
      - from: FLAGGED
        to: WITHDRAWN
        trigger: "POST /registry/theft-reports/{id}/withdraw"
        actor: Owner
        preconditions:
          - "TheftReport.status == FLAGGED"
          - "Acting owner id == TheftReport.owner_id"
          - "No MatchCandidate on this report in status CONFIRMED"
        side_effects:
          - "TheftReport.version increments by 1"
          - "Bicycle.registry_status transitions STOLEN -> REGISTERED; MatchCandidates on this report in {PROPOSED, NOTIFIED} transition to EXPIRED"
      - from: FLAGGED
        to: CLOSED_RECOVERED
        trigger: "system cascade — OwnerClaim approval whose match.theft_report_id == this report"
        actor: system
        preconditions: ["The confirmed MatchCandidate.theft_report_id == this TheftReport.id"]
        side_effects: ["TheftReport.version increments by 1"]

  - entity: RecoveryIntake
    field: status
    initial_state: INTAKE
    terminal_states: [RETURNED, DISPOSED]
    transitions:
      - from: INTAKE
        to: CLAIM_PENDING
        trigger: "system cascade — POST /registry/claims/{id}/approve on a claim referencing a match of this intake"
        actor: system
        preconditions: ["The approved OwnerClaim.recovery_intake_id == this RecoveryIntake.id"]
        side_effects: ["RecoveryIntake.version increments by 1"]
      - from: CLAIM_PENDING
        to: RETURNED
        trigger: "POST /registry/recovery-intakes/{id}/complete-return"
        actor: Partner
        preconditions:
          - "RecoveryIntake.status == CLAIM_PENDING"
          - "Acting Partner's org id == RecoveryIntake.partner_org_id"
        side_effects:
          - "Bicycle.registry_status transitions RECOVERED -> RETURNED on the bicycle of the confirmed match; Bicycle.version increments by 1"
          - "RecoveryIntake.version increments by 1"
      - from: INTAKE
        to: UNCLAIMED
        trigger: "POST /registry/recovery-intakes/{id}/mark-unclaimed"
        actor: Registrar
        preconditions:
          - "RecoveryIntake.status == INTAKE"
          - "now >= RecoveryIntake.created_at + 30 days (ERR_DISPOSITION_TOO_EARLY otherwise)"
          - "No MatchCandidate with recovery_intake_id == this intake and status IN {PROPOSED, NOTIFIED} (ERR_INTAKE_HAS_ACTIVE_MATCH otherwise)"
          - "No OwnerClaim with recovery_intake_id == this intake and status == UNDER_REVIEW (ERR_CLAIM_ALREADY_EXISTS otherwise)"
        side_effects: ["RecoveryIntake.version increments by 1"]
      - from: UNCLAIMED
        to: DISPOSITION_SCHEDULED
        trigger: "system cascade — POST /registry/auctions with recovery_intake_id == this intake"
        actor: system
        preconditions: ["RecoveryIntake.status == UNCLAIMED"]
        side_effects: ["RecoveryIntake.version increments by 1"]
      - from: DISPOSITION_SCHEDULED
        to: UNCLAIMED
        trigger: "system cascade — POST /registry/auctions/{id}/cancel on this intake's auction"
        actor: system
        preconditions: ["The cancelled Auction.recovery_intake_id == this RecoveryIntake.id"]
        side_effects: ["RecoveryIntake.version increments by 1"]
      - from: DISPOSITION_SCHEDULED
        to: DISPOSED
        trigger: "system cascade — POST /registry/auctions/{id}/settle on this intake's auction"
        actor: system
        preconditions: ["The settled Auction.recovery_intake_id == this RecoveryIntake.id"]
        side_effects: ["RecoveryIntake.version increments by 1"]

  - entity: MatchCandidate
    field: status
    initial_state: PROPOSED
    terminal_states: [CONFIRMED, DISMISSED, EXPIRED]
    note: "Initial state is chosen at scan time: NOTIFIED when screening_score >= 7000, else PROPOSED."
    transitions:
      - from: PROPOSED
        to: NOTIFIED
        trigger: "system — re-scan recomputes screening_score >= 7000"
        actor: system
        preconditions: ["MatchCandidate.status == PROPOSED and recomputed screening_score >= 7000"]
        side_effects:
          - "Notification(kind=MATCH_FOUND) created for the TheftReport.owner_id of this match"
          - "MatchCandidate.version increments by 1"
      - from: PROPOSED
        to: DISMISSED
        trigger: "POST /registry/matches/{id}/dismiss"
        actor: Registrar
        preconditions: ["MatchCandidate.status == PROPOSED"]
        side_effects: ["MatchCandidate.version increments by 1"]
      - from: NOTIFIED
        to: DISMISSED
        trigger: "POST /registry/matches/{id}/dismiss"
        actor: Registrar
        preconditions: ["MatchCandidate.status == NOTIFIED"]
        side_effects: ["MatchCandidate.version increments by 1"]
      - from: NOTIFIED
        to: CONFIRMED
        trigger: "system cascade — POST /registry/claims/{id}/approve on a claim with match_id == this match"
        actor: system
        preconditions: ["MatchCandidate.status == NOTIFIED"]
        side_effects:
          - "MatchCandidate.version increments by 1"
          - "RecoveryIntake.status transitions INTAKE -> CLAIM_PENDING (its own cascade then flips Bicycle.registry_status STOLEN -> RECOVERED and TheftReport FLAGGED -> CLOSED_RECOVERED)"
          - "Every OTHER MatchCandidate on the same RecoveryIntake with status IN {PROPOSED, NOTIFIED} transitions to EXPIRED"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system cascade — underlying TheftReport withdrawn from FLAGGED, or a sibling match on the same intake CONFIRMED"
        actor: system
        preconditions: ["Cascade source transition occurred"]
        side_effects: ["MatchCandidate.version increments by 1"]
      - from: NOTIFIED
        to: EXPIRED
        trigger: "system cascade — underlying TheftReport withdrawn from FLAGGED, or a sibling match on the same intake CONFIRMED"
        actor: system
        preconditions: ["Cascade source transition occurred"]
        side_effects: ["MatchCandidate.version increments by 1"]

  - entity: OwnerClaim
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /registry/claims/{id}/approve"
        actor: Registrar
        preconditions:
          - "OwnerClaim.status == UNDER_REVIEW"
          - "RecoveryIntake.status == INTAKE (first approved claim wins; a second approval attempt fails ERR_RECOVERY_NOT_ACTIONABLE)"
          - "MatchCandidate.status == NOTIFIED"
          - "Bicycle referenced by the match has integrity_status != DUPLICATE_SUSPECT (ERR_DUPLICATE_HOLD otherwise)"
        side_effects:
          - "MatchCandidate.status NOTIFIED -> CONFIRMED (its cascade: intake INTAKE -> CLAIM_PENDING; intake cascade: Bicycle STOLEN -> RECOVERED, TheftReport FLAGGED -> CLOSED_RECOVERED; sibling matches -> EXPIRED)"
          - "Notification(kind=CLAIM_APPROVED) created for OwnerClaim.owner_id"
          - "OwnerClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /registry/claims/{id}/reject"
        actor: Registrar
        preconditions: ["OwnerClaim.status == UNDER_REVIEW"]
        side_effects:
          - "OwnerClaim.reason_text := input reason_text; version increments by 1"
          - "Notification(kind=CLAIM_REJECTED) created for OwnerClaim.owner_id"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /registry/claims/{id}/withdraw"
        actor: Owner
        preconditions:
          - "OwnerClaim.status == UNDER_REVIEW"
          - "Acting owner id == OwnerClaim.owner_id"
        side_effects: ["OwnerClaim.version increments by 1"]

  - entity: Auction
    field: status
    initial_state: SCHEDULED
    terminal_states: [SETTLED, VOIDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /registry/auctions/{id}/open"
        actor: Registrar
        preconditions:
          - "Auction.status == SCHEDULED"
          - "now >= Auction.starts_at (ERR_AUCTION_NOT_YET_OPEN otherwise)"
          - "now <= Auction.ends_at (ERR_AUCTION_WINDOW_EXPIRED otherwise)"
        side_effects: ["Auction.version increments by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /registry/auctions/{id}/close"
        actor: Registrar
        preconditions:
          - "Auction.status == OPEN"
          - "now >= Auction.ends_at (ERR_AUCTION_NOT_CLOSABLE otherwise)"
        side_effects:
          - "Auction.closed_at := current logical clock; version increments by 1"
          - "The highest-amount Bid with status == ACTIVE transitions to WINNING (tie impossible: later equal-or-lower bids were rejected by next_minimum_bid); every other ACTIVE bid transitions to OUTBID"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /registry/auctions/{id}/settle"
        actor: Registrar
        preconditions: ["Auction.status == CLOSED"]
        side_effects:
          - "When a WINNING bid exists: auction_settlement_waterfall runs with evaluation order storage -> commission -> payout; WINNING bid -> WON, all OUTBID bids -> LOST; final_storage_fee_cents / final_program_commission_cents / final_partner_payout_cents / winning_bid_id populated"
          - "Ledger entries (balanced): DEBIT/OWNER AUCTION_ESCROW winning_bid + CREDIT/ESCROW AUCTION_ESCROW winning_bid; DEBIT/ESCROW STORAGE_FEE + CREDIT/PARTNER_ORG STORAGE_FEE; DEBIT/ESCROW AUCTION_COMMISSION + CREDIT/PROGRAM AUCTION_COMMISSION; DEBIT/ESCROW AUCTION_PARTNER_PAYOUT + CREDIT/PARTNER_ORG AUCTION_PARTNER_PAYOUT"
          - "Notification(kind=AUCTION_WON) created for the winning bidder"
          - "RecoveryIntake.status DISPOSITION_SCHEDULED -> DISPOSED"
          - "When no WINNING bid exists: SETTLED with final_* fields null and winning_bid_id null; RecoveryIntake still DISPOSED; no ledger entries"
          - "Auction.version increments by 1"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /registry/auctions/{id}/void-settlement"
        actor: Registrar
        preconditions: ["Auction.status == SETTLED"]
        side_effects:
          - "For every LedgerEntry created by the settle, a mirrored REVERSAL LedgerEntry with direction swapped and equal amount_cents is appended (double-entry balance preserved)"
          - "RecoveryIntake.status remains DISPOSED (void is financial reversal only)"
          - "Auction.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /registry/auctions/{id}/cancel"
        actor: Registrar
        preconditions: ["Auction.status == SCHEDULED"]
        side_effects:
          - "RecoveryIntake.status DISPOSITION_SCHEDULED -> UNCLAIMED"
          - "Auction.version increments by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /registry/auctions/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Auction.status == OPEN"
          - "Zero Bid rows exist for this auction (ERR_AUCTION_HAS_BIDS otherwise)"
        side_effects:
          - "RecoveryIntake.status DISPOSITION_SCHEDULED -> UNCLAIMED"
          - "Auction.version increments by 1"

  - entity: Bid
    field: status
    initial_state: ACTIVE
    terminal_states: [WON, LOST, RETRACTED]
    transitions:
      - from: ACTIVE
        to: OUTBID
        trigger: "system cascade — auction close settles ranking for non-leading bids"
        actor: system
        preconditions: ["Auction transitioned OPEN -> CLOSED and this bid is NOT the max-amount ACTIVE bid"]
        side_effects:
          - "Notification(kind=BID_OUTBID) created for this bid's bidder_owner_id"
          - "Bid.version increments by 1"
      - from: ACTIVE
        to: WINNING
        trigger: "system cascade — auction close; this bid is the highest-amount ACTIVE bid"
        actor: system
        preconditions: ["Auction transitioned OPEN -> CLOSED and this bid has max amount_cents among ACTIVE bids"]
        side_effects: ["Bid.version increments by 1"]
      - from: WINNING
        to: WON
        trigger: "system cascade — auction settle"
        actor: system
        preconditions: ["Auction transitioned CLOSED -> SETTLED"]
        side_effects: ["Bid.version increments by 1"]
      - from: OUTBID
        to: LOST
        trigger: "system cascade — auction settle"
        actor: system
        preconditions: ["Auction transitioned CLOSED -> SETTLED"]
        side_effects: ["Bid.version increments by 1"]
      - from: ACTIVE
        to: RETRACTED
        trigger: "POST /registry/bids/{id}/retract"
        actor: Owner
        preconditions:
          - "Bid.status == ACTIVE"
          - "Acting owner id == Bid.bidder_owner_id"
          - "Auction.status == OPEN"
          - "This bid is NOT the highest-amount ACTIVE bid on its auction (ERR_BID_NOT_RETRACTABLE otherwise); lower-amount ACTIVE bids coexist until close"
        side_effects: ["Bid.version increments by 1"]

  - entity: RegistryEvent
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /registry/events/{id}/publish"
        actor: Admin
        preconditions:
          - "RegistryEvent.status == DRAFT"
          - "No OTHER PUBLISHED event with the same host_org_id has a half-open overlapping window: overlap iff new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at (adjacent windows touching at an endpoint do NOT overlap); ERR_EVENT_WINDOW_OVERLAP otherwise"
        side_effects: ["RegistryEvent.version increments by 1"]
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /registry/events/{id}/complete"
        actor: Admin
        preconditions:
          - "RegistryEvent.status == PUBLISHED"
          - "now >= RegistryEvent.ends_at (ERR_EVENT_ENDED, http 409, otherwise)"
        side_effects: ["RegistryEvent.version increments by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /registry/events/{id}/cancel"
        actor: Admin
        preconditions: ["RegistryEvent.status == DRAFT"]
        side_effects: ["RegistryEvent.version increments by 1"]
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /registry/events/{id}/cancel"
        actor: Admin
        preconditions: ["RegistryEvent.status == PUBLISHED"]
        side_effects:
          - "Every EventRegistration with event_id == this event and status == BOOKED transitions to CANCELLED; registered_count recomputed to 0; RegistryEvent.version increments by 1"
          - "Unused waiver codes from this event become invalid (subsequent use fails ERR_WAIVER_CODE_INVALID)"

  - entity: EventRegistration
    field: status
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /registry/event-registrations/{id}/cancel OR system cascade — host event cancelled"
        actor: Owner
        preconditions:
          - "EventRegistration.status == BOOKED"
          - "For the direct endpoint: acting owner id == EventRegistration.owner_id"
        side_effects:
          - "RegistryEvent.registered_count decrements by 1 (direct cancel) / recomputed to 0 (event-cancel cascade); RegistryEvent.version increments by 1"
          - "EventRegistration.version increments by 1"

  - entity: DuplicateFlag
    field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /registry/duplicate-flags/{id}/confirm"
        actor: Registrar
        preconditions:
          - "DuplicateFlag.status == OPEN"
          - "merged_into_bicycle_id IN {bicycle_a_id, bicycle_b_id} (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "DuplicateFlag.merged_into_bicycle_id := input; version increments by 1"
          - "Loser bicycle integrity_status DUPLICATE_SUSPECT -> MERGED (its cascade: open reports UNDER_REVIEW/NEEDS_INFO -> WITHDRAWN; pending transfers -> CANCELLED)"
          - "Survivor bicycle integrity_status DUPLICATE_SUSPECT -> CLEAR; survivor version increments by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /registry/duplicate-flags/{id}/dismiss"
        actor: Registrar
        preconditions: ["DuplicateFlag.status == OPEN"]
        side_effects:
          - "Both bicycles integrity_status DUPLICATE_SUSPECT -> CLEAR; each version increments by 1"
          - "DuplicateFlag.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: bicycle-patch-stale-version
    parent_entity: Bicycle
    write_endpoint: "PATCH /registry/bicycles/{id}"
    occ_field: "expected_bicycle_version"
    description: |
      Updating a Bicycle whose version has advanced since the client last
      observed it is rejected. Two writers editing the same bicycle record
      (e.g., color and photo updates) would otherwise silently overwrite each
      other; the loser is the request carrying a stale expected version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-place-stale-auction-version
    parent_entity: Auction
    write_endpoint: "POST /registry/auctions/{id}/bids"
    occ_field: "expected_auction_version"
    description: |
      Placing a Bid against an Auction whose version has advanced since the
      client last observed it is rejected. A newly accepted bid legitimately
      supersedes the previously leading bid (which flips to OUTBID and bumps
      the auction version), so a bidder acting on a stale auction view must
      re-read before bidding.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: serial_normalization
    trigger: "On Bicycle creation and RecoveryIntake creation, and before any duplicate or match comparison"
    algorithm: deterministic_mapping
    formula: |
      normalize(s):
        1. uppercase(s)
        2. drop every character not in [A-Z0-9]
        3. apply confusable map per character: O->0, I->1, L->1, S->5, B->8, Z->2, G->6, Q->0
      Result is the canonical comparison key. Example: "ab c-123o" -> "ABC1230".
    input_set: "serial_number (Bicycle) or serial_number_raw (RecoveryIntake)"
    constants:
      CONFUSABLE_MAP: "O->0,I->1,L->1,S->5,B->8,Z->2,G->6,Q->0"
    precision: "exact string; no rounding"

  - name: duplicate_confidence
    trigger: "At Bicycle creation (auto-scan against all existing bicycles with integrity_status != MERGED) and at manual POST /registry/duplicate-flags"
    algorithm: weighted_scoring
    formula: |
      edit_dist = levenshtein(a.serial_normalized, b.serial_normalized)
      serial_pts = 1.0 if a.serial_normalized == b.serial_normalized else max(0, 1 - edit_dist / max(len(a.serial_normalized), len(b.serial_normalized)))
      mfr_pts   = 1.0 if lower(a.manufacturer) == lower(b.manufacturer) else 0.0
      model_pts = 1.0 if lower(a.model) == lower(b.model) else 0.0
      confidence_bp = round_half_up(10000 * (0.60*serial_pts + 0.25*mfr_pts + 0.15*model_pts))
      AUTO-FLAG rule: at bicycle creation, an EXACT normalized-serial equality with an existing
      integrity_status == CLEAR bicycle is rejected outright (ERR_DUPLICATE_SERIAL_ACTIVE);
      a non-exact pair with confidence_bp >= 8500 auto-creates a DuplicateFlag (OPEN) and flips
      both bicycles to DUPLICATE_SUSPECT. The auto-created DuplicateFlag sets
      bicycle_a_id := the pre-existing bicycle and bicycle_b_id := the newly created bicycle.
    input_set: "The new/flagged bicycle vs every other Bicycle with integrity_status != MERGED; processed in created_at ASC order"
    constants:
      AUTO_FLAG_THRESHOLD_BP: 8500
      W_SERIAL: 0.60
      W_MFR: 0.25
      W_MODEL: 0.15
    precision: "integer basis points 0..10000, round_half_up"

  - name: match_score
    trigger: "POST /registry/recovery-intakes/{id}/scan — for every TheftReport with status == FLAGGED (candidate set), one MatchCandidate per (intake, report) pair is created, or its scores recomputed if the pair already has a match"
    algorithm: weighted_scoring
    formula: |
      days = max(0, floor((intake.found_at - report.occurred_at) / 86400))
      serial_pts = 1.0 if intake.serial_normalized == bicycle.serial_normalized
                   else max(0, 1 - levenshtein(intake.serial_normalized, bicycle.serial_normalized) / max(len(intake.serial_normalized), len(bicycle.serial_normalized)))
      mfr_pts   = 0.5 if intake.manufacturer is null else (1.0 if lower(intake.manufacturer) == lower(bicycle.manufacturer) else 0.0)
      color_pts = 0.5 if intake.primary_color is null else (1.0 if lower(intake.primary_color) == lower(bicycle.primary_color) else 0.0)
      photo_pts = 0.0 if intake.photo_hash is null or bicycle.photo_hash is null
                  else 1 - hamming(intake.photo_hash, bicycle.photo_hash) / 64
      temporal_pts = 1.0 if days <= 30 else max(0, 1 - (days - 30) / 335)
      screening_score = round_half_up(10000 * (0.50*serial_pts + 0.20*mfr_pts + 0.15*color_pts + 0.15*temporal_pts))
      forensic_score  = round_half_up(10000 * (0.35*serial_pts + 0.30*photo_pts + 0.15*mfr_pts + 0.10*color_pts + 0.10*temporal_pts))
      Status at scan: screening_score >= 7000 -> NOTIFIED (Notification MATCH_FOUND to report owner);
      else PROPOSED. Only screening_score drives status; forensic_score is advisory.
      Candidate scan order: report.created_at ASC.
    input_set: "The scanned RecoveryIntake x every TheftReport with status == FLAGGED (bicycle joined via report.bicycle_id); reports in any other status are EXCLUDED"
    constants:
      NOTIFY_THRESHOLD_BP: 7000
      SCREEN_W: "serial 0.50, mfr 0.20, color 0.15, temporal 0.15"
      FORENSIC_W: "serial 0.35, photo 0.30, mfr 0.15, color 0.10, temporal 0.10"
      TEMPORAL_FULL_DAYS: 30
      TEMPORAL_ZERO_DAYS: 365
    precision: "integer basis points 0..10000, round_half_up"
    variants:
      - name: screening
        when: "Computed at scan and re-scan; the ONLY score that drives MatchCandidate.status and owner notification"
        difference: "Ignores photo evidence entirely; serial-heavy weights (0.50 serial)"
      - name: forensic
        when: "Computed and stored alongside screening at scan; advisory for Registrar review"
        difference: "Adds photo_pts at weight 0.30 and down-weights serial to 0.35; identical inputs can yield a different score (e.g. photo missing: serial=1,mfr=1,color=0,temporal=1 -> screening 8500 vs forensic 6000)"

  - name: registration_fee
    trigger: "POST /registry/bicycles — computed at creation, stored on Bicycle.registration_fee_cents, and posted to the ledger"
    algorithm: tiered_pricing
    formula: |
      tier_base = 1000 if declared_value_cents < 50000
                  else 2000 if declared_value_cents <= 200000
                  else 3500                                            # declared_value_cents > 200000
      insurance_cents = round_half_up(0.08 * declared_value_cents) if insurance_opt_in else 0
      engraving_cents = 1500 if engraving_opt_in else 0
      processing_cents = round_half_up(0.03 * (tier_base + insurance_cents + engraving_cents))
      ROUNDING ORDER PINNED: each component is rounded to integer cents FIRST (per-component),
      THEN summed. (Sum-then-round of unrounded components is a different, forbidden order.)
      fee_cents = tier_base + insurance_cents + engraving_cents + processing_cents
      If a valid waiver_code is supplied: fee_cents := 0 AFTER per-component computation
      (waiver applies 100% discount), and the ledger records a zero-amount FEE_WAIVER pair.
      Ledger: DEBIT/OWNER REGISTRATION_FEE fee_cents + CREDIT/PROGRAM REGISTRATION_FEE fee_cents
      (or DEBIT/OWNER FEE_WAIVER 0 + CREDIT/PROGRAM FEE_WAIVER 0 when waived), bicycle_id set.
    input_set: "The Bicycle being registered (declared_value_cents, engraving_opt_in, insurance_opt_in, waiver_code)"
    constants:
      TIER1_LIMIT_CENTS: 50000
      TIER1_FEE_CENTS: 1000
      TIER2_LIMIT_CENTS: 200000
      TIER2_FEE_CENTS: 2000
      TIER3_FEE_CENTS: 3500
      ENGRAVING_FEE_CENTS: 1500
      INSURANCE_RATE: 0.08
      PROCESSING_RATE: 0.03
    precision: "integer cents, round_half_up per component before summation (pinned order)"

  - name: storage_fee_accrual
    trigger: "Computed inside auction_settlement_waterfall (both estimate and final variants) whenever a storage fee must be evaluated at a cutoff time"
    algorithm: chronological
    formula: |
      appraised_basis = RecoveryIntake.appraised_value_cents
      chargeable_days = max(0, floor((cutoff_utc - RecoveryIntake.created_at) / 86400) - FREE_DAYS)
      accrued_cents = chargeable_days * RATE_CENTS_PER_DAY
      cap_cents = round_half_up(CAP_PCT_OF_APPRAISED * appraised_basis)
      storage_fee = min(accrued_cents, cap_cents)
      Day boundary is exact: at exactly FREE_DAYS * 86400 seconds elapsed, chargeable_days == 0.
    input_set: "Single RecoveryIntake row; cutoff_utc is auction.ends_at (estimate) or auction.closed_at (final)"
    constants:
      FREE_DAYS: 5
      RATE_CENTS_PER_DAY: 150
      CAP_PCT_OF_APPRAISED: 0.25
    precision: "integer cents; day count via floor of whole 86400-second days"

  - name: auction_settlement_waterfall
    trigger: "Estimate variant: POST /registry/auctions (creation). Final variant: POST /registry/auctions/{id}/settle."
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency made well-defined):
        (1) gross := reserve_price_cents (estimate) OR winning bid amount_cents (final)
        (2) cutoff := ends_at (estimate) OR closed_at (final)
        (3) storage := min(storage_fee_accrual(cutoff), round_half_up(0.30 * gross))
        (4) base := gross - storage
        (5) commission := round_half_up(0.10 * min(base, 50000)) + round_half_up(0.15 * max(0, base - 50000))
            (per-tier rounding, then sum — pinned)
        (6) partner_payout := gross - storage - commission
      Estimate writes estimated_storage_fee_cents / estimated_program_commission_cents /
      estimated_partner_payout_cents at creation. Final writes final_* fields at settle.
      Because (3) depends on gross and (5) depends on (3), evaluating in any other order is
      undefined; this order is the contract.
    input_set: "The Auction row + its RecoveryIntake + (final only) the WINNING bid"
    constants:
      MIN_RESERVE_CENTS: 1000
      RESERVE_PCT_OF_APPRAISED: 0.20
      STORAGE_CAP_PCT_OF_WINNING: 0.30
      COMMISSION_TIER1_LIMIT_CENTS: 50000
      COMMISSION_TIER1_RATE: 0.10
      COMMISSION_TIER2_RATE: 0.15
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: estimate
        when: "At auction creation; projects storage through the scheduled ends_at and uses reserve as gross"
        difference: "Uses reserve_price_cents and ends_at; ignores actual bids and actual close time"
      - name: final
        when: "At settle; uses the actual winning bid and actual closed_at"
        difference: "Closing later than ends_at accrues more storage days, and the winning bid (not reserve) drives gross, so final differs from estimate (e.g. reserve 20000 / ends day-40 vs winning 30000 / closed day-43: estimated payout 13275 vs final payout 21870)"

  - name: next_minimum_bid
    trigger: "POST /registry/auctions/{id}/bids — validates amount_cents"
    algorithm: threshold
    formula: |
      If no ACTIVE bid exists on the auction: minimum = reserve_price_cents
      Else: leading = max(amount_cents over ACTIVE bids)
            increment = max(500, round_half_up(0.05 * leading))
            minimum = leading + increment
      Acceptance uses >= : amount_cents == minimum is ACCEPTED; amount_cents == minimum - 1 is rejected ERR_BID_BELOW_MINIMUM.
    input_set: "The target Auction and its ACTIVE Bid rows"
    constants:
      MIN_INCREMENT_FLOOR_CENTS: 500
      MIN_INCREMENT_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: ledger_double_entry_invariant
    trigger: "Invariant evaluated over the whole LedgerEntry table after every financial transition (registration, transfer accept, settle, void-settlement)"
    algorithm: aggregation
    formula: |
      SUM(amount_cents WHERE direction == 'CREDIT') - SUM(amount_cents WHERE direction == 'DEBIT') == 0
      over ALL LedgerEntry rows. Every business event posts a balanced DEBIT/CREDIT set;
      void-settlement posts mirrored REVERSAL entries with directions swapped, so the
      invariant holds before and after the compensating action.
    input_set: "All LedgerEntry rows, no status filter (append-only table)"
    constants: {}
    precision: "integer cents; exact equality"

  - name: event_seat_invariant
    trigger: "Invariant evaluated per RegistryEvent after every registration create/cancel and event cancel"
    algorithm: aggregation
    formula: |
      RegistryEvent.registered_count == COUNT(EventRegistration WHERE event_id == event.id AND status == 'BOOKED')
      AND 0 <= registered_count <= capacity
      Create is the forward action (count + 1); cancel is the compensating action (count - 1);
      event cancellation drives all BOOKED -> CANCELLED so count == 0.
    input_set: "Single RegistryEvent and its EventRegistration rows with status == BOOKED"
    constants: {}
    precision: "integer count; exact equality"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed; X-User-Role must be one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed identity match: Owner endpoints restricted to the acting owner's own resources (X-User-ID must equal the resource's owner FK); Partner endpoints restricted to intakes of the acting partner's org", error_id: ERR_FORBIDDEN_RESOURCE_ACCESS, http_status: 403, applies_to: "owner/partner-scoped endpoints (PATCH /registry/bicycles/{id}, POST /registry/transfers*, theft-report respond/withdraw, claim create/withdraw, bid place/retract, event registration create/cancel, notification mark-read, recovery-intake scan/complete-return, owner-scoped GETs)" }
  - { priority: 4, category: input, check: "Required fields present, types correct, enum values in range, starts_at < ends_at, capacity >= 1, declared_value_cents >= 0, sale_price_cents >= 0, amount_cents >= 1, merged_into_bicycle_id in the flag pair, match_id's recovery_intake_id equals the claim's recovery_intake_id", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Path parameters resolve left-to-right to existing rows", error_id: ERR_OWNER_NOT_FOUND, http_status: 404, applies_to: "all (per-segment: ERR_OWNER_NOT_FOUND / ERR_PARTNER_ORG_NOT_FOUND / ERR_BICYCLE_NOT_FOUND / ERR_TRANSFER_NOT_FOUND / ERR_THEFT_REPORT_NOT_FOUND / ERR_RECOVERY_INTAKE_NOT_FOUND / ERR_MATCH_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_AUCTION_NOT_FOUND / ERR_BID_NOT_FOUND / ERR_EVENT_NOT_FOUND / ERR_EVENT_REGISTRATION_NOT_FOUND / ERR_DUPLICATE_FLAG_NOT_FOUND / ERR_NOTIFICATION_NOT_FOUND)" }
  - { priority: 6, category: existence, check: "Body FK references resolve: bicycle_id, recovery_intake_id, match_id, host_org_id, to_owner_email -> Owner, bicycle_a_id, bicycle_b_id", error_id: ERR_BICYCLE_NOT_FOUND, http_status: 404, applies_to: "endpoints with body references (per field: ERR_BICYCLE_NOT_FOUND / ERR_RECOVERY_INTAKE_NOT_FOUND / ERR_MATCH_NOT_FOUND / ERR_PARTNER_ORG_NOT_FOUND / ERR_OWNER_NOT_FOUND)" }
  - { priority: 7, category: state, check: "Actor posture: acting Partner's PartnerOrg.status == ACTIVE for partner write endpoints", error_id: ERR_PARTNER_ORG_NOT_ACTIVE, http_status: 409, applies_to: "POST /registry/recovery-intakes, POST /registry/recovery-intakes/{id}/scan, POST /registry/recovery-intakes/{id}/complete-return, POST /registry/duplicate-flags" }
  - { priority: 8, category: state, check: "OCC: expected_bicycle_version == Bicycle.version / expected_auction_version == Auction.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /registry/bicycles/{id}, POST /registry/auctions/{id}/bids" }
  - { priority: 9, category: state, check: "Bicycle transferability: registry_status == REGISTERED and integrity_status != MERGED for transfer creation; integrity_status != MERGED for any business operation on the bicycle", error_id: ERR_BICYCLE_NOT_TRANSFERABLE, http_status: 409, applies_to: "POST /registry/transfers (ERR_BICYCLE_NOT_TRANSFERABLE when registry_status != REGISTERED; ERR_BICYCLE_MERGED when integrity_status == MERGED)" }
  - { priority: 10, category: state, check: "Target state-machine from-state holds for the invoked action (transfer PENDING_ACCEPTANCE, report UNDER_REVIEW/NEEDS_INFO, intake INTAKE/CLAIM_PENDING, match PROPOSED/NOTIFIED, claim UNDER_REVIEW, auction SCHEDULED/OPEN/CLOSED/SETTLED per action, bid ACTIVE, event DRAFT/PUBLISHED, flag OPEN)", error_id: ERR_TRANSFER_NOT_PENDING, http_status: 409, applies_to: "all action endpoints (per action: ERR_TRANSFER_NOT_PENDING, ERR_THEFT_REPORT_NOT_ACTIONABLE, ERR_RECOVERY_NOT_ACTIONABLE, ERR_MATCH_NOT_OPEN, ERR_CLAIM_NOT_REVIEWABLE, ERR_AUCTION_NOT_OPEN, ERR_AUCTION_NOT_CLOSABLE, ERR_AUCTION_NOT_SETTLABLE, ERR_BID_NOT_RETRACTABLE, ERR_EVENT_NOT_PUBLISHED, ERR_FLAG_NOT_OPEN)" }
  - { priority: 11, category: business_safety, check: "Duplicate hold: bicycle of the transfer / of the claim's confirmed match must not be DUPLICATE_SUSPECT", error_id: ERR_DUPLICATE_HOLD, http_status: 409, applies_to: "POST /registry/transfers, POST /registry/claims/{id}/approve" }
  - { priority: 12, category: business_constraint, check: "Uniqueness/graph constraints: exact normalized-serial collision with a CLEAR bicycle; one PENDING_ACCEPTANCE transfer per bicycle; seller != buyer; one non-terminal theft report per bicycle; event host must be org_type CAMPUS (ERR_EVENT_HOST_NOT_CAMPUS) and status ACTIVE (ERR_PARTNER_ORG_NOT_ACTIVE); event half-open window overlap per host; one non-CANCELLED auction per intake (on POST /registry/auctions this ERR_AUCTION_ALREADY_EXISTS check is evaluated BEFORE the intake-UNCLAIMED state check, so the constraint error surfaces even though the cascade has moved the intake to DISPOSITION_SCHEDULED); partner-org auction windows with 12h inflation must not collide; auction cancel requires zero bids; mark-unclaimed requires no active matches/claims; one UNDER_REVIEW claim per match; one BOOKED registration per owner per event", error_id: ERR_DUPLICATE_SERIAL_ACTIVE, http_status: 409, applies_to: "creation/action endpoints (per rule: ERR_DUPLICATE_SERIAL_ACTIVE, ERR_TRANSFER_ALREADY_PENDING, ERR_SELF_TRANSFER(422), ERR_REPORT_ALREADY_OPEN, ERR_EVENT_HOST_NOT_CAMPUS(422), ERR_EVENT_WINDOW_OVERLAP, ERR_AUCTION_ALREADY_EXISTS, ERR_AUCTION_WINDOW_CONFLICT, ERR_AUCTION_HAS_BIDS, ERR_INTAKE_HAS_ACTIVE_MATCH, ERR_CLAIM_ALREADY_EXISTS, ERR_EVENT_REGISTRATION_EXISTS)" }
  - { priority: 13, category: business_referential, check: "Waiver code resolves, is unused, its event is not CANCELLED, and now <= event.ends_at + 30 days", error_id: ERR_WAIVER_CODE_INVALID, http_status: 422, applies_to: "POST /registry/bicycles" }
  - { priority: 14, category: business_temporal, check: "Temporal windows: transfer accept/cancel while now <= expires_at; auction open within [starts_at, ends_at]; bids only while now <= ends_at; mark-unclaimed only after created_at + 30 days; event registrations only while now < ends_at", error_id: ERR_TRANSFER_EXPIRED, http_status: 409, applies_to: "POST /registry/transfers/{id}/accept|cancel (ERR_TRANSFER_EXPIRED), POST /registry/auctions/{id}/open (ERR_AUCTION_NOT_YET_OPEN / ERR_AUCTION_WINDOW_EXPIRED), POST /registry/auctions/{id}/bids (ERR_AUCTION_WINDOW_EXPIRED), POST /registry/recovery-intakes/{id}/mark-unclaimed (ERR_DISPOSITION_TOO_EARLY), POST /registry/events/{id}/registrations (ERR_EVENT_ENDED)" }
  - { priority: 15, category: business_fiscal, check: "Fiscal/quota: bid amount_cents >= next_minimum_bid; event registered_count < capacity", error_id: ERR_BID_BELOW_MINIMUM, http_status: 422, applies_to: "POST /registry/auctions/{id}/bids (ERR_BID_BELOW_MINIMUM), POST /registry/events/{id}/registrations (ERR_EVENT_CAPACITY_FULL)" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - { method: POST, path: "/registry/_clock/set_current_utc", description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time.", roles: [Admin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  # ---- Owners ----
  - { method: POST, path: "/registry/owners/register", description: "Self-register an Owner account", roles: [Anonymous], code: 201, input: [email, password, full_name, "phone?"], output: Owner, side_effects: [] }
  - { method: GET, path: "/registry/owners/{id}", description: "Read an Owner (Owner may read only itself)", roles: [Owner, Registrar, Admin], code: 200, input: [], output: Owner, side_effects: [] }
  - { method: PATCH, path: "/registry/owners/{id}", description: "Update own profile fields", roles: [Owner], code: 200, input: ["full_name?", "phone?"], output: Owner, side_effects: ["Owner.version increments by 1"] }

  # ---- Partner orgs ----
  - { method: POST, path: "/registry/partner-orgs", description: "Onboard a partner organization (law enforcement, bike shop, campus) in PENDING", roles: [Admin], code: 201, input: [name, org_type, jurisdiction_code, contact_email], output: PartnerOrg, side_effects: [] }
  - { method: GET, path: "/registry/partner-orgs", description: "List partner orgs", roles: [Registrar, Admin], code: 200, input: ["org_type?", "status?", "limit?", "offset?"], output: "PartnerOrg[]", side_effects: [] }
  - { method: GET, path: "/registry/partner-orgs/{id}", description: "Read a partner org (Partner may read only its own org)", roles: [Partner, Registrar, Admin], code: 200, input: [], output: PartnerOrg, side_effects: [] }
  - { method: POST, path: "/registry/partner-orgs/{id}/activate", description: "PENDING->ACTIVE or SUSPENDED->ACTIVE", roles: [Admin], code: 200, input: [], output: PartnerOrg, side_effects: ["PartnerOrg.status transition; version increments"] }
  - { method: POST, path: "/registry/partner-orgs/{id}/suspend", description: "ACTIVE->SUSPENDED", roles: [Admin], code: 200, input: [], output: PartnerOrg, side_effects: ["PartnerOrg.status transition; version increments"] }
  - { method: POST, path: "/registry/partner-orgs/{id}/revoke", description: "ACTIVE|SUSPENDED->REVOKED (terminal)", roles: [Admin], code: 200, input: [], output: PartnerOrg, side_effects: ["PartnerOrg.status transition; version increments"] }

  # ---- Bicycles ----
  - { method: POST, path: "/registry/bicycles", description: "Register a bicycle with serial number and photo; computes registration_fee_cents, runs duplicate auto-scan, posts ledger entries, consumes waiver_code when supplied", roles: [Owner], code: 201, input: [serial_number, manufacturer, model, primary_color, declared_value_cents, photo_url, "photo_hash?", "engraving_opt_in?", "insurance_opt_in?", "waiver_code?"], output: Bicycle, side_effects: ["serial_normalization", "registration_fee", "LedgerEntry REGISTRATION_FEE or FEE_WAIVER balanced pair", "duplicate_confidence auto-scan; possible DuplicateFlag creation + DUPLICATE_SUSPECT flips", "waiver_code marked used when applied"] }
  - { method: GET, path: "/registry/bicycles", description: "List bicycles; Owner sees only own (current_owner_id forced to self); Partner may query any (stolen-registry checks)", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["current_owner_id?", "serial_number?", "registry_status?", "integrity_status?", "limit?", "offset?"], output: "Bicycle[]", side_effects: [] }
  - { method: GET, path: "/registry/bicycles/{id}", description: "Read a bicycle; Owner only own; Partner only when registry_status == STOLEN", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: Bicycle, side_effects: [] }
  - { method: PATCH, path: "/registry/bicycles/{id}", description: "Update descriptive fields of an own bicycle; OCC-guarded", roles: [Owner], code: 200, input: [expected_bicycle_version, "model?", "primary_color?", "photo_url?", "photo_hash?"], output: Bicycle, side_effects: ["Bicycle.version increments by 1"] }

  # ---- Ownership transfers ----
  - { method: POST, path: "/registry/transfers", description: "Seller initiates an ownership transfer / sale report", roles: [Owner], code: 201, input: [bicycle_id, to_owner_email, sale_price_cents], output: OwnershipTransfer, side_effects: ["OwnershipTransfer created PENDING_ACCEPTANCE with expires_at = now + 7 days"] }
  - { method: GET, path: "/registry/transfers", description: "List transfers (Owner sees only transfers where it is from_owner or to_owner)", roles: [Owner, Registrar, Admin], code: 200, input: ["bicycle_id?", "from_owner_id?", "to_owner_id?", "status?", "limit?", "offset?"], output: "OwnershipTransfer[]", side_effects: [] }
  - { method: GET, path: "/registry/transfers/{id}", description: "Read a transfer (participant owners only)", roles: [Owner, Registrar, Admin], code: 200, input: [], output: OwnershipTransfer, side_effects: [] }
  - { method: POST, path: "/registry/transfers/{id}/accept", description: "Buyer accepts: moves ownership, posts transfer fee", roles: [Owner], code: 200, input: [], output: OwnershipTransfer, side_effects: ["Bicycle.current_owner_id := to_owner_id; Bicycle.version increments", "LedgerEntry TRANSFER_FEE 300 DEBIT buyer / CREDIT program", "Notification TRANSFER_COMPLETED to seller"] }
  - { method: POST, path: "/registry/transfers/{id}/reject", description: "Buyer rejects", roles: [Owner], code: 200, input: [], output: OwnershipTransfer, side_effects: ["OwnershipTransfer PENDING_ACCEPTANCE -> REJECTED"] }
  - { method: POST, path: "/registry/transfers/{id}/cancel", description: "Seller cancels a pending transfer", roles: [Owner], code: 200, input: [], output: OwnershipTransfer, side_effects: ["OwnershipTransfer PENDING_ACCEPTANCE -> CANCELLED"] }

  # ---- Theft reports ----
  - { method: POST, path: "/registry/theft-reports", description: "Owner files a theft report for an own bicycle (starts UNDER_REVIEW)", roles: [Owner], code: 201, input: [bicycle_id, occurred_at, theft_location, "police_case_number?", "description?"], output: TheftReport, side_effects: [] }
  - { method: GET, path: "/registry/theft-reports", description: "List theft reports; Owner sees only own; Partner sees only FLAGGED", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["bicycle_id?", "owner_id?", "status?", "limit?", "offset?"], output: "TheftReport[]", side_effects: [] }
  - { method: GET, path: "/registry/theft-reports/{id}", description: "Read a theft report; Owner only own; Partner only when FLAGGED", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: TheftReport, side_effects: [] }
  - { method: POST, path: "/registry/theft-reports/{id}/request-info", description: "Registrar requests more info: UNDER_REVIEW -> NEEDS_INFO", roles: [Registrar], code: 200, input: [info_request_text], output: TheftReport, side_effects: ["TheftReport.status transition; version increments"] }
  - { method: POST, path: "/registry/theft-reports/{id}/respond", description: "Owner responds: NEEDS_INFO -> UNDER_REVIEW (review loop)", roles: [Owner], code: 200, input: [response_text], output: TheftReport, side_effects: ["TheftReport.status transition; version increments"] }
  - { method: POST, path: "/registry/theft-reports/{id}/flag", description: "Registrar flags the report: flags the bicycle STOLEN in the registry and cascades transfer cancellations", roles: [Registrar], code: 200, input: [], output: TheftReport, side_effects: ["TheftReport UNDER_REVIEW -> FLAGGED, flagged_at stamped", "Bicycle REGISTERED -> STOLEN", "Pending transfers on the bicycle auto-CANCELLED with TRANSFER_CANCELLED_STOLEN notifications to buyers", "Notification REPORT_FLAGGED to owner"] }
  - { method: POST, path: "/registry/theft-reports/{id}/reject", description: "Registrar rejects from UNDER_REVIEW or NEEDS_INFO", roles: [Registrar], code: 200, input: [reason_text], output: TheftReport, side_effects: ["TheftReport -> REJECTED"] }
  - { method: POST, path: "/registry/theft-reports/{id}/withdraw", description: "Owner withdraws (found bike); from FLAGGED also reverts bicycle to REGISTERED and expires open matches", roles: [Owner], code: 200, input: [], output: TheftReport, side_effects: ["TheftReport -> WITHDRAWN", "When from FLAGGED: Bicycle STOLEN -> REGISTERED; matches PROPOSED/NOTIFIED -> EXPIRED"] }

  # ---- Recovery intakes ----
  - { method: POST, path: "/registry/recovery-intakes", description: "Partner intakes a recovered bike (serial may be partial/damaged)", roles: [Partner], code: 201, input: [serial_number_raw, primary_color, found_at, found_location, appraised_value_cents, "manufacturer?", "model?", "photo_url?", "photo_hash?"], output: RecoveryIntake, side_effects: ["serial_normalization on serial_number_raw"] }
  - { method: GET, path: "/registry/recovery-intakes", description: "List intakes; Partner sees only own org's", roles: [Partner, Registrar, Admin], code: 200, input: ["partner_org_id?", "status?", "limit?", "offset?"], output: "RecoveryIntake[]", side_effects: [] }
  - { method: GET, path: "/registry/recovery-intakes/{id}", description: "Read an intake; Partner only own org's", roles: [Partner, Registrar, Admin], code: 200, input: [], output: RecoveryIntake, side_effects: [] }
  - { method: POST, path: "/registry/recovery-intakes/{id}/scan", description: "Run match_score against all FLAGGED theft reports; creates/updates MatchCandidates, auto-notifies at screening_score >= 7000", roles: [Partner, Registrar], code: 200, input: [], output: "{ created_match_ids: string[], scanned_report_count: integer }", side_effects: ["match_score computed per candidate (screening + forensic stored)", "MatchCandidates created (PROPOSED or NOTIFIED) or scores recomputed", "Notification MATCH_FOUND to owners of newly NOTIFIED matches"] }
  - { method: POST, path: "/registry/recovery-intakes/{id}/mark-unclaimed", description: "Registrar marks an INTAKE unclaimed after the 30-day wait with no active matches/claims", roles: [Registrar], code: 200, input: [], output: RecoveryIntake, side_effects: ["RecoveryIntake INTAKE -> UNCLAIMED"] }
  - { method: POST, path: "/registry/recovery-intakes/{id}/complete-return", description: "Partner confirms physical handoff to the approved claimant", roles: [Partner], code: 200, input: [], output: RecoveryIntake, side_effects: ["RecoveryIntake CLAIM_PENDING -> RETURNED", "Bicycle RECOVERED -> RETURNED"] }

  # ---- Match candidates ----
  - { method: GET, path: "/registry/matches", description: "List match candidates", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["recovery_intake_id?", "theft_report_id?", "bicycle_id?", "status?", "limit?", "offset?"], output: "MatchCandidate[]", side_effects: [] }
  - { method: GET, path: "/registry/matches/{id}", description: "Read a match candidate", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: MatchCandidate, side_effects: [] }
  - { method: POST, path: "/registry/matches/{id}/dismiss", description: "Registrar dismisses a PROPOSED or NOTIFIED match", roles: [Registrar], code: 200, input: [], output: MatchCandidate, side_effects: ["MatchCandidate -> DISMISSED"] }

  # ---- Owner claims ----
  - { method: POST, path: "/registry/claims", description: "Owner claims a recovered bike via a NOTIFIED match", roles: [Owner], code: 201, input: [recovery_intake_id, match_id, proof_text], output: OwnerClaim, side_effects: ["OwnerClaim created UNDER_REVIEW"] }
  - { method: GET, path: "/registry/claims", description: "List claims; Owner sees only own", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["recovery_intake_id?", "owner_id?", "match_id?", "status?", "limit?", "offset?"], output: "OwnerClaim[]", side_effects: [] }
  - { method: GET, path: "/registry/claims/{id}", description: "Read a claim; Owner only own", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: OwnerClaim, side_effects: [] }
  - { method: POST, path: "/registry/claims/{id}/approve", description: "Registrar approves: fires the match->intake->bicycle+report cascade", roles: [Registrar], code: 200, input: [], output: OwnerClaim, side_effects: ["MatchCandidate NOTIFIED -> CONFIRMED", "RecoveryIntake INTAKE -> CLAIM_PENDING", "Bicycle STOLEN -> RECOVERED", "TheftReport FLAGGED -> CLOSED_RECOVERED", "Sibling matches -> EXPIRED", "Notification CLAIM_APPROVED"] }
  - { method: POST, path: "/registry/claims/{id}/reject", description: "Registrar rejects with reason", roles: [Registrar], code: 200, input: [reason_text], output: OwnerClaim, side_effects: ["OwnerClaim -> REJECTED", "Notification CLAIM_REJECTED"] }
  - { method: POST, path: "/registry/claims/{id}/withdraw", description: "Owner withdraws own UNDER_REVIEW claim", roles: [Owner], code: 200, input: [], output: OwnerClaim, side_effects: ["OwnerClaim -> WITHDRAWN"] }

  # ---- Auctions & bids ----
  - { method: POST, path: "/registry/auctions", description: "Registrar schedules an auction for an UNCLAIMED intake; reserve and estimate-variant settlement fields computed at creation", roles: [Registrar], code: 201, input: [recovery_intake_id, starts_at, ends_at], output: Auction, side_effects: ["reserve_price_cents computed", "auction_settlement_waterfall estimate variant stored", "RecoveryIntake UNCLAIMED -> DISPOSITION_SCHEDULED"] }
  - { method: GET, path: "/registry/auctions", description: "List auctions", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["recovery_intake_id?", "status?", "limit?", "offset?"], output: "Auction[]", side_effects: [] }
  - { method: GET, path: "/registry/auctions/{id}", description: "Read an auction", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: Auction, side_effects: [] }
  - { method: POST, path: "/registry/auctions/{id}/open", description: "Open bidding inside [starts_at, ends_at]", roles: [Registrar], code: 200, input: [], output: Auction, side_effects: ["Auction SCHEDULED -> OPEN"] }
  - { method: POST, path: "/registry/auctions/{id}/close", description: "Close bidding at/after ends_at; ranks bids (leader WINNING, rest OUTBID)", roles: [Registrar], code: 200, input: [], output: Auction, side_effects: ["Auction OPEN -> CLOSED, closed_at stamped", "Bid ranking transitions (leader WINNING, rest OUTBID with BID_OUTBID notifications)"] }
  - { method: POST, path: "/registry/auctions/{id}/settle", description: "Settle: final settlement waterfall, balanced ledger entries, intake disposed", roles: [Registrar], code: 200, input: [], output: Auction, side_effects: ["auction_settlement_waterfall final variant", "balanced LedgerEntry set", "WINNING bid -> WON, OUTBID -> LOST", "RecoveryIntake DISPOSITION_SCHEDULED -> DISPOSED", "Notification AUCTION_WON"] }
  - { method: POST, path: "/registry/auctions/{id}/void-settlement", description: "Financially reverse a settled auction via mirrored REVERSAL ledger entries (compensating action)", roles: [Registrar], code: 200, input: [], output: Auction, side_effects: ["Auction SETTLED -> VOIDED", "REVERSAL LedgerEntry per settle entry with swapped direction"] }
  - { method: POST, path: "/registry/auctions/{id}/cancel", description: "Cancel from SCHEDULED, or from OPEN only with zero bids; intake reverts to UNCLAIMED", roles: [Registrar], code: 200, input: [], output: Auction, side_effects: ["Auction -> CANCELLED", "RecoveryIntake DISPOSITION_SCHEDULED -> UNCLAIMED"] }
  - { method: POST, path: "/registry/auctions/{id}/bids", description: "Place a bid; OCC-guarded; supersedes the current leading bid", roles: [Owner], code: 201, input: [amount_cents, expected_auction_version], output: Bid, side_effects: ["next_minimum_bid check", "new Bid ACTIVE (prior bids remain ACTIVE until close)", "Auction.version increments by 1"] }
  - { method: GET, path: "/registry/bids", description: "List bids; Owner sees only own", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["auction_id?", "bidder_owner_id?", "status?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/registry/bids/{id}", description: "Read a bid; Owner only own", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/registry/bids/{id}/retract", description: "Retract own non-leading ACTIVE bid while auction OPEN", roles: [Owner], code: 200, input: [], output: Bid, side_effects: ["Bid ACTIVE -> RETRACTED"] }

  # ---- Registry events (campus programs) ----
  - { method: POST, path: "/registry/events", description: "Admin creates a registration event hosted by an ACTIVE CAMPUS partner org (starts DRAFT)", roles: [Admin], code: 201, input: [host_org_id, title, venue, starts_at, ends_at, capacity], output: RegistryEvent, side_effects: [] }
  - { method: GET, path: "/registry/events", description: "List events", roles: [Owner, Partner, Registrar, Admin], code: 200, input: ["host_org_id?", "status?", "limit?", "offset?"], output: "RegistryEvent[]", side_effects: [] }
  - { method: GET, path: "/registry/events/{id}", description: "Read an event", roles: [Owner, Partner, Registrar, Admin], code: 200, input: [], output: RegistryEvent, side_effects: [] }
  - { method: POST, path: "/registry/events/{id}/publish", description: "Publish: enforces half-open window non-overlap per host org", roles: [Admin], code: 200, input: [], output: RegistryEvent, side_effects: ["RegistryEvent DRAFT -> PUBLISHED"] }
  - { method: POST, path: "/registry/events/{id}/complete", description: "Complete a PUBLISHED event once now >= ends_at", roles: [Admin], code: 200, input: [], output: RegistryEvent, side_effects: ["RegistryEvent PUBLISHED -> COMPLETED"] }
  - { method: POST, path: "/registry/events/{id}/cancel", description: "Cancel: cascades BOOKED registrations to CANCELLED and invalidates unused waivers", roles: [Admin], code: 200, input: [], output: RegistryEvent, side_effects: ["RegistryEvent -> CANCELLED", "EventRegistrations BOOKED -> CANCELLED, registered_count recomputed", "unused waiver codes invalidated"] }
  - { method: POST, path: "/registry/events/{id}/registrations", description: "Owner books a seat at a PUBLISHED event; mints a fee-waiver code", roles: [Owner], code: 201, input: [], output: EventRegistration, side_effects: ["registered_count increments by 1; RegistryEvent.version increments by 1", "waiver_code minted"] }
  - { method: GET, path: "/registry/event-registrations", description: "List event registrations; Owner sees only own", roles: [Owner, Registrar, Admin], code: 200, input: ["event_id?", "owner_id?", "status?", "limit?", "offset?"], output: "EventRegistration[]", side_effects: [] }
  - { method: GET, path: "/registry/event-registrations/{id}", description: "Read an event registration; Owner only own", roles: [Owner, Registrar, Admin], code: 200, input: [], output: EventRegistration, side_effects: [] }
  - { method: POST, path: "/registry/event-registrations/{id}/cancel", description: "Owner cancels own BOOKED registration (compensating action of booking)", roles: [Owner], code: 200, input: [], output: EventRegistration, side_effects: ["EventRegistration BOOKED -> CANCELLED", "registered_count decrements by 1; RegistryEvent.version increments by 1"] }

  # ---- Duplicate flags (database accuracy) ----
  - { method: POST, path: "/registry/duplicate-flags", description: "Partner or Registrar manually flags a suspect duplicate pair; confidence_score computed", roles: [Partner, Registrar], code: 201, input: [bicycle_a_id, bicycle_b_id, "note?"], output: DuplicateFlag, side_effects: ["duplicate_confidence computed", "both bicycles CLEAR -> DUPLICATE_SUSPECT"] }
  - { method: GET, path: "/registry/duplicate-flags", description: "List duplicate flags", roles: [Partner, Registrar, Admin], code: 200, input: ["bicycle_a_id?", "bicycle_b_id?", "merged_into_bicycle_id?", "status?", "limit?", "offset?"], output: "DuplicateFlag[]", side_effects: [] }
  - { method: GET, path: "/registry/duplicate-flags/{id}", description: "Read a duplicate flag", roles: [Partner, Registrar, Admin], code: 200, input: [], output: DuplicateFlag, side_effects: [] }
  - { method: POST, path: "/registry/duplicate-flags/{id}/confirm", description: "Registrar confirms the duplicate: loser merges (MERGED), survivor clears", roles: [Registrar], code: 200, input: [merged_into_bicycle_id], output: DuplicateFlag, side_effects: ["DuplicateFlag OPEN -> CONFIRMED, merged_into_bicycle_id stored", "loser Bicycle DUPLICATE_SUSPECT -> MERGED with report-withdraw / transfer-cancel cascade", "survivor Bicycle DUPLICATE_SUSPECT -> CLEAR"] }
  - { method: POST, path: "/registry/duplicate-flags/{id}/dismiss", description: "Registrar dismisses: both bicycles return to CLEAR", roles: [Registrar], code: 200, input: [], output: DuplicateFlag, side_effects: ["DuplicateFlag OPEN -> DISMISSED", "both bicycles DUPLICATE_SUSPECT -> CLEAR"] }

  # ---- Ledger & notifications ----
  - { method: GET, path: "/registry/ledger-entries", description: "List append-only ledger entries", roles: [Registrar, Admin], code: 200, input: ["owner_id?", "partner_org_id?", "auction_id?", "bicycle_id?", "entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/registry/ledger-entries/{id}", description: "Read a ledger entry", roles: [Registrar, Admin], code: 200, input: [], output: LedgerEntry, side_effects: [] }
  - { method: GET, path: "/registry/notifications", description: "List notifications; Owner sees only own", roles: [Owner, Registrar, Admin], code: 200, input: ["owner_id?", "unread_only?", "limit?", "offset?"], output: "Notification[]", side_effects: [] }
  - { method: GET, path: "/registry/notifications/{id}", description: "Read a notification; Owner only own", roles: [Owner, Registrar, Admin], code: 200, input: [], output: Notification, side_effects: [] }
  - { method: POST, path: "/registry/notifications/{id}/mark-read", description: "Owner marks own notification read", roles: [Owner], code: 200, input: [], output: Notification, side_effects: ["read := true; version increments by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unknown role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN_RESOURCE_ACCESS, http: 403, condition: "Entity-backed identity mismatch: owner/partner acting on a resource it does not own" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type/enum violation, starts_at >= ends_at, capacity < 1, negative amounts, merged_into_bicycle_id not in flag pair, claim match/intake mismatch" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "Referenced owner id or to_owner_email does not resolve" }
  - { id: ERR_PARTNER_ORG_NOT_FOUND, http: 404, condition: "Referenced partner org id does not exist" }
  - { id: ERR_BICYCLE_NOT_FOUND, http: 404, condition: "Referenced bicycle id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Referenced transfer id does not exist" }
  - { id: ERR_THEFT_REPORT_NOT_FOUND, http: 404, condition: "Referenced theft report id does not exist" }
  - { id: ERR_RECOVERY_INTAKE_NOT_FOUND, http: 404, condition: "Referenced recovery intake id does not exist" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "Referenced match id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Referenced claim id does not exist" }
  - { id: ERR_AUCTION_NOT_FOUND, http: 404, condition: "Referenced auction id does not exist" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "Referenced bid id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Referenced event id does not exist" }
  - { id: ERR_EVENT_REGISTRATION_NOT_FOUND, http: 404, condition: "Referenced event registration id does not exist" }
  - { id: ERR_DUPLICATE_FLAG_NOT_FOUND, http: 404, condition: "Referenced duplicate flag id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Referenced notification id does not exist" }
  - { id: ERR_PARTNER_ORG_NOT_ACTIVE, http: 409, condition: "Acting Partner's org is not ACTIVE (PENDING/SUSPENDED/REVOKED); or event host org is not ACTIVE at event creation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_BICYCLE_NOT_TRANSFERABLE, http: 409, condition: "Bicycle registry_status != REGISTERED at transfer creation" }
  - { id: ERR_BICYCLE_MERGED, http: 409, condition: "Operation targets a bicycle whose integrity_status == MERGED" }
  - { id: ERR_TRANSFER_NOT_PENDING, http: 409, condition: "Transfer action requires status == PENDING_ACCEPTANCE" }
  - { id: ERR_THEFT_REPORT_NOT_ACTIONABLE, http: 409, condition: "Theft report action invoked from a state that does not allow it" }
  - { id: ERR_RECOVERY_NOT_ACTIONABLE, http: 409, condition: "Recovery intake action invoked from a state that does not allow it (e.g. claim approve when intake no longer INTAKE)" }
  - { id: ERR_MATCH_NOT_OPEN, http: 409, condition: "Match action requires status PROPOSED or NOTIFIED (dismiss), or NOTIFIED (claim creation)" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "Claim action requires status == UNDER_REVIEW" }
  - { id: ERR_AUCTION_NOT_OPEN, http: 409, condition: "Bid placed while Auction.status != OPEN; open invoked while Auction.status != SCHEDULED" }
  - { id: ERR_AUCTION_NOT_CLOSABLE, http: 409, condition: "Close invoked while auction not OPEN or now < ends_at" }
  - { id: ERR_AUCTION_NOT_SETTLABLE, http: 409, condition: "Settle invoked while auction not CLOSED; void invoked while not SETTLED; cancel invoked from a terminal state" }
  - { id: ERR_BID_NOT_RETRACTABLE, http: 409, condition: "Retract on a bid that is not ACTIVE, or is the leading ACTIVE bid, or whose auction is not OPEN" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "Event registration attempted on a non-PUBLISHED event; event action invoked from wrong state" }
  - { id: ERR_FLAG_NOT_OPEN, http: 409, condition: "Duplicate flag confirm/dismiss on a non-OPEN flag" }
  - { id: ERR_DUPLICATE_HOLD, http: 409, condition: "Business-safety hold: bicycle integrity_status == DUPLICATE_SUSPECT blocks transfer creation and claim approval" }
  - { id: ERR_DUPLICATE_SERIAL_ACTIVE, http: 409, condition: "Exact normalized-serial collision with an existing integrity_status == CLEAR bicycle at registration" }
  - { id: ERR_TRANSFER_ALREADY_PENDING, http: 409, condition: "A PENDING_ACCEPTANCE transfer already exists for the bicycle" }
  - { id: ERR_SELF_TRANSFER, http: 422, condition: "to_owner_email resolves to the same owner as the seller" }
  - { id: ERR_REPORT_ALREADY_OPEN, http: 409, condition: "A non-terminal theft report (UNDER_REVIEW/NEEDS_INFO/FLAGGED) already exists for the bicycle" }
  - { id: ERR_EVENT_HOST_NOT_CAMPUS, http: 422, condition: "host_org_id references a partner org whose org_type != CAMPUS" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlap with another PUBLISHED event of the same host org" }
  - { id: ERR_AUCTION_ALREADY_EXISTS, http: 409, condition: "A non-CANCELLED auction already exists for the recovery intake" }
  - { id: ERR_AUCTION_WINDOW_CONFLICT, http: 409, condition: "Inflated window [starts_at - 12h, ends_at + 12h] overlaps another non-CANCELLED auction of the same partner org" }
  - { id: ERR_AUCTION_HAS_BIDS, http: 409, condition: "Cancel of an OPEN auction that already has bids" }
  - { id: ERR_INTAKE_HAS_ACTIVE_MATCH, http: 409, condition: "mark-unclaimed while matches in PROPOSED/NOTIFIED exist for the intake" }
  - { id: ERR_CLAIM_ALREADY_EXISTS, http: 409, condition: "An UNDER_REVIEW claim already exists for the match; or mark-unclaimed while an UNDER_REVIEW claim exists on the intake" }
  - { id: ERR_EVENT_REGISTRATION_EXISTS, http: 409, condition: "A BOOKED registration already exists for this owner at this event" }
  - { id: ERR_WAIVER_CODE_INVALID, http: 422, condition: "Waiver code unknown, already used, event CANCELLED, or past ends_at + 30 days" }
  - { id: ERR_TRANSFER_EXPIRED, http: 409, condition: "accept/cancel attempted when now > transfer.expires_at (transfer auto-transitions to EXPIRED)" }
  - { id: ERR_AUCTION_NOT_YET_OPEN, http: 409, condition: "open attempted before starts_at" }
  - { id: ERR_AUCTION_WINDOW_EXPIRED, http: 409, condition: "bid or open attempted when now > ends_at" }
  - { id: ERR_DISPOSITION_TOO_EARLY, http: 409, condition: "mark-unclaimed before intake.created_at + 30 days" }
  - { id: ERR_EVENT_ENDED, http: 409, condition: "registration when now >= event.ends_at; complete attempted before ends_at" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 422, condition: "amount_cents < next_minimum_bid (strictly below; exactly equal is accepted)" }
  - { id: ERR_EVENT_CAPACITY_FULL, http: 422, condition: "registered_count == capacity at registration time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may only self-register an owner account"
    identity: opaque
    exclusive_operations: ["POST /registry/owners/register"]
    shared_operations: []

  - name: Owner
    description: "Registered bicycle owner; manages own bicycles, theft reports, transfers, claims, bids, event bookings, notifications"
    identity: "entity_backed:Owner"
    exclusive_operations: ["POST /registry/bicycles", "PATCH /registry/bicycles/{id}", "POST /registry/transfers*", "POST /registry/theft-reports (create/respond/withdraw)", "POST /registry/claims (create/withdraw)", "POST /registry/auctions/{id}/bids", "POST /registry/bids/{id}/retract", "POST /registry/events/{id}/registrations", "POST /registry/event-registrations/{id}/cancel", "POST /registry/notifications/{id}/mark-read"]
    shared_operations: ["GET reads scoped to own resources (bicycles, transfers, theft-reports, claims, bids, event-registrations, notifications, matches, auctions, events)"]

  - name: Partner
    description: "Partner organization operator (law enforcement / bike shop / campus); performs recovery intakes, match scans, handoff completion, manual duplicate flags; can search the registry and read STOLEN bicycles and FLAGGED reports"
    identity: "entity_backed:PartnerOrg"
    exclusive_operations: ["POST /registry/recovery-intakes", "POST /registry/recovery-intakes/{id}/complete-return", "POST /registry/duplicate-flags (shared with Registrar)"]
    shared_operations: ["POST /registry/recovery-intakes/{id}/scan (with Registrar)", "GET /registry/bicycles (stolen-registry checks)", "GET reads of own-org intakes, matches, claims, auctions, bids, events"]

  - name: Registrar
    description: "Program staff: reviews theft reports and claims, manages matches, duplicate flags, dispositions and auctions"
    identity: opaque
    exclusive_operations: ["POST /registry/theft-reports/{id}/request-info|flag|reject", "POST /registry/claims/{id}/approve|reject", "POST /registry/matches/{id}/dismiss", "POST /registry/recovery-intakes/{id}/mark-unclaimed", "POST /registry/auctions*", "POST /registry/duplicate-flags/{id}/confirm|dismiss"]
    shared_operations: ["POST /registry/recovery-intakes/{id}/scan (with Partner)", "GET reads across all collections"]

  - name: Admin
    description: "Platform operator: partner-org lifecycle, event lifecycle, logical clock"
    identity: opaque
    exclusive_operations: ["POST /registry/partner-orgs*", "POST /registry/events (create/publish/complete/cancel)", "POST /registry/_clock/set_current_utc"]
    shared_operations: ["GET reads across all collections"]
