            - "AllocationDecision.${alloc2_id}.channel == UNALLOCATED with reason_codes containing VOLUME_CAP_REACHED (count 1 >= cap 1 within September) and Application.${app2_id}.status == DECLINED"
            - "after the clock crosses into October, AllocationDecision.${alloc3_id}.channel == PARTNER_RETAINED on the fresh application ${app3_id} — the month-bucket window reset the count"
            - "Partner.${bank_id}.originated_this_month_count == 1 again after the October allocation"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pool_allocated_principal_conserved_across_chargeoff
        grounds:
          - state_machines.Loan.DEFAULTED_to_CHARGED_OFF
          - entities.SecuritizationPool.fields.allocated_principal_cents
        distinguishing_aspect: |
          Conserved quantity: SecuritizationPool.allocated_principal_cents equals
          the sum of principal_cents over loans CURRENTLY placed in the pool.
          Placement adds principal; the compensating charge-off of a DEFAULTED
          pool loan subtracts exactly the same principal — allocated returns to its
          pre-placement value with zero drift, while the pool's target and status
          stay untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model ACTIVE (bureau-only; bureau 575 -> score 50)."
            - "Trust T ACTIVE with pool P (target 100000000, max single 10000000); no banks/buyers exist, so allocation lands in the pool."
            - "Applicant TX clean; application DIRECT 5000000 UNDERWRITTEN -> allocated SECURITIZATION; pool allocated == 5000000."
            - "Loan advanced through 4 unpaid periods (30/60/90 -> at the 4th advance days_delinquent reaches exactly 120 and status DEFAULTED)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-B-10", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "bureau only", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m1_id: $.data.id }
            - call: "POST /platform/model-versions/${m1_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m1_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr1_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr1_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m1_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "Invariant Trust", partner_type: "SECURITIZATION_TRUST", home_state: "DE" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { t_id: $.data.id }
            - call: "POST /platform/partners/${t_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-two"
            - call: "POST /platform/securitization-pools"
              payload: { trust_partner_id: "${t_id}", pool_label: "TR-INV", target_principal_cents: 100000000, max_single_loan_cents: 10000000 }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { pool_id: $.data.id }
            - call: "POST /platform/applicants"
              payload: { full_name: "Chargeoff Chad", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id", v_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/verifications/${v_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/allocate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "GET /platform/loans"
              payload: { application_id: "${app_id}" }
              as: ServicingAgent
              as_user_id: "sa-one"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
          trigger:
            - call: "POST /platform/loans/${loan_id}/charge-off"
              payload: {}
              as: CollectionsAgent
