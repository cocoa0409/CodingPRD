  - { method: GET, path: "/deposit-accounts/{id}/rate-quote", description: "Computed effective-rate breakdown read", roles: [BranchBanker, PricingAnalyst], code: 200, input: [], output: "{ account_id: string, rate_source: string, base_rate_bp: integer, bundle_bonus_bp: integer, exception_rate_bp: integer, cap_applied: boolean, current_rate_bp: integer }", side_effects: [] }

  - { method: POST, path: "/funding-curves", description: "Publish a funding curve (cost of funds by tenor)", roles: [TreasuryOfficer], code: 201, input: [curve_date, points], output: FundingCurve, side_effects: [] }
  - { method: GET, path: "/funding-curves", description: "List funding curves", roles: [TreasuryOfficer, PricingAnalyst, PricingCommittee], code: 200, input: ["limit?", "offset?"], output: "FundingCurve[]", side_effects: [] }

  - { method: POST, path: "/relationship-bundles", description: "Create a relationship pricing bundle", roles: [OperationsAdmin], code: 201, input: [bundle_code, bonus_bp, min_combined_balance_cents, required_product_classes, eligible_product_classes], output: RelationshipBundle, side_effects: [] }
  - { method: GET, path: "/relationship-bundles", description: "List bundles", roles: [OperationsAdmin, PricingAnalyst, BranchBanker], code: 200, input: ["limit?", "offset?"], output: "RelationshipBundle[]", side_effects: [] }
