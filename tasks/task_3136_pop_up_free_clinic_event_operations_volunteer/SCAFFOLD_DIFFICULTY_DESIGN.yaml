  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_state_beats_safety_sterilization
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - state_machines.ServiceStation
        distinguishing_aspect: |
          Error-category pair state-vs-business_safety: dismantling a station
          while the event is in PLANNING (posture gate, priority 4) AND the
          station has never had sterilization clearance (safety gate, priority 7)
          MUST return ERR_EVENT_POSTURE_FORBIDS, not ERR_STERILIZATION_NOT_CLEARED.
        test_recipe:
          setup:
            - "Event ev9 in PLANNING posture (no agreement); one requires_sterilization DENTAL station still PLANNED"
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-05", name: "Jackson", host_state_code: "TN", service_date: "2026-12-12", doors_open_utc: "2026-12-12T10:00:00Z", total_patient_capacity: 100 }
              as: EventDirector
              captures: { ev9: $.data.id }
            - call: "POST /clinic-events/${ev9}/stations"
              payload: { station_label: "D-9", station_type: "DENTAL", chair_count: 1, minutes_per_patient: 30, requires_sterilization: true, service_window_open_utc: "2026-12-12T11:00:00Z", service_window_close_utc: "2026-12-12T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { st9: $.data.id }
          trigger:
            - call: "POST /clinic-events/${ev9}/stations/${st9}/dismantle"
              payload: {}
              as: LogisticsCoordinator
              captures: { err9: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_POSTURE_FORBIDS (state category priority 4 wins over business_safety priority 7; dismantle requires TEARDOWN)"

      - name: referential_beats_fiscal_on_agreement_create
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_REFERENCE_INVALID]
        distinguishing_aspect: |
          Error-category pair business_referential-vs-business_fiscal (different
          pair than state-vs-safety): creating an agreement that references a
          non-existent site_id (referential, priority 10) AND a negative
          liability_cap_cents (fiscal, priority 11) MUST return
          ERR_REFERENCE_INVALID... — but existence (priority 3) wins first, so the
          request actually surfaces ERR_NOT_FOUND; the pair exercised is
          existence-vs-fiscal with existence winning.
        test_recipe:
          setup:
            - "Event ev10 exists in PLANNING"
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-06", name: "Cookeville", host_state_code: "TN", service_date: "2026-12-19", doors_open_utc: "2026-12-19T10:00:00Z", total_patient_capacity: 100 }
              as: EventDirector
              captures: { ev10: $.data.id, ev10_v: $.data.version }
          trigger:
            - call: "POST /clinic-events/${ev10}/site-agreements"
              payload: { site_id: "00000000-0000-0000-0000-000000000000", host_org_name: "Ghost", liability_cap_cents: -5, insurance_certificate_ref: "C10", expected_event_version: "${ev10_v}" }
              as: LogisticsCoordinator
              captures: { err10: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (existence priority 3 beats fiscal priority 11 even though liability_cap_cents is also invalid)"

