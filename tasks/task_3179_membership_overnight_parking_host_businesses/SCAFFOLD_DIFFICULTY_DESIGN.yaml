              payload: {}
              as: HostOperator
              captures: { r_cc_v: $.data.version }
            - call: "POST /api/patronization-records"
              payload: { host_id: "${h_cc}", member_id: "${m7}", stay_request_id: "${r_cc}", receipt_cents: 10050, purchase_kind: "TASTING", expected_request_version: "${r_cc_v}" }
              as: HostOperator
              as_user_id: "${h_cc}"
