  - name: PlatformAdmin
    description: "Operator: captures/refunds deposits, funds financing, drives lender decision webhook and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /deposits/{id}/capture"
      - "POST /deposits/{id}/refund"
      - "POST /financing-applications/{id}/fund"
