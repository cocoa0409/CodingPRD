          - calculations.maintenance_window
          - entities.Registration.fields.next_maintenance_due_at
          - errors[ERR_MAINTENANCE_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          Interval semantics B — a primary window with a distinct adjacent grace buffer: the §8 filing
          must fall in the maintenance window on the Registration resource (anchored registered_at + 6y);
