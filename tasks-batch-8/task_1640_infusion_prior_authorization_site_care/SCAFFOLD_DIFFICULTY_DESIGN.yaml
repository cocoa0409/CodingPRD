  - rule_id: cross_entity_state_dependency
    instances:
      - name: appointment_create_requires_auth_approved
        grounds:
          - state_machines.AuthorizationRequest
          - validations[priority=6]
          - errors[ERR_AUTH_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair InfusionAppointment -> AuthorizationRequest: appointment creation is gated on the
          parent request's status being APPROVED; a DRAFT parent rejects with ERR_AUTH_NOT_APPROVED.
        test_recipe:
          setup:
            - "Policy, patient, DRAFT authorization request (never submitted), OFFICE chair"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9061", regimen_name: "XDepA", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_xa: $.data.id } }
