        distinguishing_aspect: "The same error id fires from a different comparison at order time: a VERIFIED prescription with pd_mm 72.0 cannot be glazed into a frame whose max_pd_mm is 70.0 (inclusive), yielding ERR_PD_OUT_OF_RANGE (422) before any pricing is computed."
        test_recipe:
          setup: ["Frame with PD range 54.0-70.0; VERIFIED prescription with pd_mm 72.0."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C16", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
