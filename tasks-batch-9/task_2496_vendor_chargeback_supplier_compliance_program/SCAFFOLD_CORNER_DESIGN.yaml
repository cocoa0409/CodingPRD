            - "Shipment.${s2_id}.invoice_value_cents == 200000"
            - "Shipment.${s2_id}.arrived_at == 2026-08-11T00:00:00Z"
            - "GET /compliance/purchase-orders/${po_id}/shipments?status=RECEIVED returns total_count == 2"

