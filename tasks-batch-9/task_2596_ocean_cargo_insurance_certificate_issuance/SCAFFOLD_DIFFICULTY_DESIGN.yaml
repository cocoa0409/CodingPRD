  - rule_id: resource_temporal_overlap
    instances:
      - name: surveyor_calendar_closed_interval_with_travel_buffer
        resource_entity: Surveyor
        interval_semantics: "CLOSED interval, both ends inflated by travel_buffer_minutes; touching endpoints conflict"
        grounds:
          - calculations.surveyor_window_conflict
          - calculations.surveyor_window_conflict.precision
          - validations.priority_25_ERR_SURVEYOR_WINDOW_CONFLICT
          - entities.Surveyor.fields.travel_buffer_minutes
        distinguishing_aspect: |
          The occupied resource is a Surveyor's calendar and the geometry is a
          CLOSED interval whose ends are pushed out by 45 travel minutes, so a
          request may collide with an appointment it does not literally
          intersect. Against an existing 2026-09-08T09:00:00Z..11:00:00Z
          attendance, a window starting at 11:45:00Z conflicts — the inflated end
          is exactly 11:45 and the comparison is `<=` — while 11:46:00Z is
          accepted. Capacity is irrelevant here: one appointment is enough to
          block, which is the opposite of the aggregate-capacity port ledger.
        test_recipe:
          setup:
            - "an ACTIVE Surveyor based at NLRTM, certified for S3, travel_buffer_minutes 45"
            - "two ISSUED certificates on the same policy, CERT-A and CERT-D, each with its own OPENED ClaimFile"
            - "claim 1 already holds SurveyOrder ORD-1 for 2026-09-08T09:00:00Z..11:00:00Z, so the surveyor's calendar is occupied"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
