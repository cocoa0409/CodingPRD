        distinguishing_aspect: |
          Interval semantics differ from the ratebook instance: INCLUSIVE windows
          on the wave calendar with a mandatory 7-day buffer — a start exactly
          7 days after the prior end (2026-12-22) violates; 8 days (2026-12-23)
          succeeds. Resource: ImplementationWave windows of one rate book.
