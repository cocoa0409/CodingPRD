            - "No CustodyTransfer row was created: GET /custody-transfers?evidence_item_id=${item_id} returns total_count == 1"
            - "Custodian.${lab_expired_id}.open_escort_count == 0 and EvidenceItem.${item_id}.open_transfer_count == 1"

