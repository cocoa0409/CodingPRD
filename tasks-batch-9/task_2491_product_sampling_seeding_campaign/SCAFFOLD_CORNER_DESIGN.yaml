            - "LiftAnalysis.${la2_id}.superseded == false"
            - "LiftAnalysis.${la2_id}.computed_at == 2026-08-01T00:00:00Z"

      - name: purchase_match_qualified_needs_the_confidence_floor_at_the_window_tail
        claim_type: threshold
        grounds:
          - entities.PurchaseMatch.fields.qualified
          - calculations.campaign_lift_and_diversion_penalty.constants
          - validations[priority 32]
        distinguishing_aspect: "Two boundaries in one pair of calls: match_confidence 0.8 is inclusive and qualifies, 0.7999 (the largest representable value below the floor at four decimals) does not; and both rows sit on the last legal instant of the conversion window, sampling_window_end + 30 days == 2026-10-30T00:00:00Z, which validation priority 32 accepts."
        test_recipe:
          setup:
            - "One campaign with window 2026-07-01 .. 2026-09-30 and one screened enrollment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
