              as: SSAAdmin
              captures: { sc_id: "$.data.id "}
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2014, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2015, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2016, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2017, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2018, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2019, credits_earned: 4, earnings_cents: 4800000 }
              as: SSAAdmin
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${sc_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
