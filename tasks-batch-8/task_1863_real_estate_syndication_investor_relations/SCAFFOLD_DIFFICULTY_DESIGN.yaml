            - call: "POST /syndications/${syn_id}/offerings"
              payload: { property_id: "${p2_id}", offering_name: "OffB", target_raise_cents: 10000000, min_subscription_cents: 1000000, max_non_accredited_count: 35 }
              as: SponsorOperator
              captures: { off_b: $.data.id }
          trigger:
            - call: "POST /syndications/${syn_id}/offerings/${off_a}/open"
              payload: {}
              as: SponsorOperator
            - call: "POST /syndications/${syn_id}/offerings/${off_b}/open"
              payload: {}
              as: SponsorOperator
              captures: { err_b: $.data.error_id }
          assert:
            - "Offering.${off_a}.status == OPEN (property OWNED — succeeds)"
            - "Offering.${off_b} open rejected: error_id == ERR_PROPERTY_NOT_OWNED (HTTP 409)"

      - name: transfer_approve_requires_buyer_onboarded
        grounds:
          - state_machines.TransferRequest.PENDING_TRANSFER_AGENT_to_APPROVED
          - errors[ERR_BUYER_NOT_ONBOARDED]
        distinguishing_aspect: |
          Entity pair: TransferRequest -> Subscription (the buyer's
          subscription on the same offering). Agent-approve is gated on
          to_investor having an ACCREDITATION_VERIFIED-or-later Subscription
          on the SAME offering as the from_subscription. Crosses a different
          entity pair than the Offering->Property dependency.
