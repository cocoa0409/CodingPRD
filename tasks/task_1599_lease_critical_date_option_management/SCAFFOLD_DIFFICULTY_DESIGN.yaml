  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_creation_gated_by_lease_state
        grounds:
          - state_machines.Option.AVAILABLE_to_NOTICE_SENT
          - state_machines.Lease
        distinguishing_aspect: |
          Pair Option→Lease: exercise notice creation requires the parent lease in
          {ACTIVE, EXPIRING}; a lease in DRAFT blocks the notice even when the
          option window is open — Option's valid transitions depend on Lease's
          state.
        test_recipe:
          setup:
            - "Portfolio P, AM contact; lease L left in DRAFT (never activated)"
            - "Option O window [2026-08-01, 2026-12-31]; clock 2026-09-01 (inside window)"
          setup_api_calls:
