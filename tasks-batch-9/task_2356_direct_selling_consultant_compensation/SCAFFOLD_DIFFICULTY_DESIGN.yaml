            - "CommissionStatement of ${cons_b_id} in run2 has withhold_rate_bp == 1000, withholding_cents == 0 and net_payable_cents == 500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: enrollment_three_dimensions_advance_independently_with_identity_retry_cycle
        grounds:
          - state_machines.EnrollmentApplication.DRAFT_to_DRAFT
          - state_machines.EnrollmentApplication.READY_FOR_APPROVAL_to_APPROVED
          - entities.EnrollmentApplication.fields.identity_attempt_count
          - entities.EnrollmentApplication.fields.kit_status
          - calculations.starter_kit_charge
        distinguishing_aspect: |
          Entity EnrollmentApplication: three orthogonal dimensions (agreement, identity, kit)
          plus a FAILED -> PENDING_REVIEW retry cycle, so status stays DRAFT through six
          writes and flips to READY_FOR_APPROVAL only on the write that completes the last
          dimension — the machine is neither linear nor a single chain of statuses.
        test_recipe:
          setup:
            - "PLAN-A at defaults (max_identity_attempts 2), TX 825 bp facilitator jurisdiction, KIT-STD catalogued."
            - "One DRAFT application created WITHOUT an identity document (identity_status UNVERIFIED, identity_attempt_count 0, agreement NOT_ACCEPTED, kit UNPAID)."
          setup_api_calls:
            - call: "POST /direct-selling/compensation-plans"
              payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /direct-selling/tax-jurisdictions"
              payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
