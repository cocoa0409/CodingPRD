scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_guardian_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Guardian, endpoints]
        distinguishing_aspect: "POST /guardians with email/full_name/phone/home_zip returns 201 and a Guardian with system id, created_at, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /guardians"
              payload: { email: "new@x.com", full_name: "New G", phone: "555-0", home_zip: "94101" }
              as: Anonymous
              captures: { gid: $.data.id }
          assert:
            - "response.status == 201"
            - "Guardian.${gid}.version == 1"
            - "Guardian.${gid}.full_name == 'New G'"

      - name: get_child_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Child, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /children/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A registered guardian exists; the requested child id does not."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "nf@x.com", full_name: "NF", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gnf: $.data.id }
          trigger:
            - call: "GET /children/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Guardian
              as_user_id: "${gnf}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_child_missing_required_first_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Child, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /children omitting required first_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered guardian."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "rf@x.com", full_name: "RF", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { grf: $.data.id }
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "${grf}", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${grf}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_child_default_household_size_applied
        claim_type: Defaults
        grounds: [entities.Child.fields.household_size]
        distinguishing_aspect: "Omitting household_size defaults it to 1."
        test_recipe:
          setup: ["A registered guardian."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "df@x.com", full_name: "DF", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gdf: $.data.id }
          trigger:
            - call: "POST /children"
              payload: { guardian_id: "${gdf}", first_name: "Def", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gdf}"
              captures: { cdf: $.data.id }
          assert:
            - "Child.${cdf}.household_size == 1"

      - name: child_age_computed_field_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Child.fields.age_years, calculations.compute_child_age, endpoints]
        distinguishing_aspect: "age_years is computed from birth_date vs a session's age_as_of_date via GET /children/{id}/age-eligibility; a client cannot set it directly."
        test_recipe:
          setup: ["A child born 2016-03-01; a session with age_as_of_date 2026-06-01 (child turns 10 on 2026-03-01, so age_years=10)."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "cf@x.com", full_name: "CF", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gcf: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gcf}", first_name: "Comp", birth_date: "2016-03-01" }
              as: Guardian
              as_user_id: "${gcf}"
              captures: { ccf: $.data.id }
            - call: "POST /programs"
              payload: { name: "Age Camp", program_type: "AFTERSCHOOL", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pcf: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pcf}", title: "Age", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 15000 }
              as: ProgramDirector
              captures: { scf: $.data.id }
          trigger:
            - call: "GET /children/${ccf}/age-eligibility"
              payload: { session_id: "${scf}" }
              as: Guardian
              as_user_id: "${gcf}"
              captures: { age: $.data.age_years }
          assert:
            - "Child.${ccf}.age_years == 10"

      - name: invalid_age_range_session_group_outside_program
        claim_type: Type Constraints
        grounds: [entities.Session.fields.age_group_max, "errors[ERR_INVALID_AGE_RANGE]"]
        distinguishing_aspect: "Creating a session whose age_group_max exceeds Program.max_age returns ERR_INVALID_AGE_RANGE (400)."
        test_recipe:
          setup: ["A program with max_age=10."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Range Camp", program_type: "CAMP", min_age: 5, max_age: 10 }
              as: ProgramDirector
              captures: { prr: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { program_id: "${prr}", title: "Bad", age_group_min: 8, age_group_max: 14, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_AGE_RANGE"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — it carries id/created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["A FINALIZED invoice with outstanding balance and a recorded payment."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "pm@x.com", full_name: "PM", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gpm: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gpm}", first_name: "Py", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gpm}"
              captures: { cpm: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${cpm}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${gpm}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${cpm}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gpm}"
              captures: { pmm: $.data.id }
            - call: "POST /authorization-forms/${pmm}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${cpm}", form_type: "PICKUP", authorized_pickup_names: ["PM"] }
              as: Guardian
              as_user_id: "${gpm}"
              captures: { pmp: $.data.id }
            - call: "POST /authorization-forms/${pmp}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Pay Camp", program_type: "AFTERSCHOOL", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { ppm: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${ppm}", title: "Pay", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 15000 }
              as: ProgramDirector
              captures: { spm: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${spm}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { wopm: $.data.id, wopm_v: $.data.version }
            - call: "POST /programs/${ppm}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${spm}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /enrollments"
              payload: { child_id: "${cpm}", weekly_offering_id: "${wopm}", expected_weekly_offering_version: "${wopm_v}" }
              as: Guardian
              as_user_id: "${gpm}"
              captures: { epm: $.data.id, invpm: $.data.invoice_id }
            - call: "GET /invoices/${invpm}"
              payload: {}
              as: BillingAdmin
              captures: { invpm_v: $.data.version }
            - call: "POST /invoices/${invpm}/finalize"
              payload: { expected_invoice_version: "${invpm_v}" }
              as: BillingAdmin
          trigger:
            - call: "POST /payments"
              payload: { invoice_id: "${invpm}", amount_cents: 15000, method: "CARD" }
              as: BillingAdmin
              captures: { paypm: $.data.id }
          assert:
            - "response.status == 201"
            - "Payment.${paypm}.amount_cents == 15000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_program_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Program.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a Program that is already PUBLISHED returns ERR_INVALID_STATE (409); no version bump."
        test_recipe:
          setup: ["A PUBLISHED program (had a scheduled session, then published)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Dbl Pub", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pdp: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pdp}", title: "Dp", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { sdp: $.data.id }
            - call: "POST /programs/${pdp}/publish"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /programs/${pdp}/publish"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: publish_program_with_no_session_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Program.DRAFT_to_PUBLISHED, "errors[ERR_NO_SESSION_FOR_PUBLISH]"]
        distinguishing_aspect: "Publishing a DRAFT program that has zero sessions returns ERR_NO_SESSION_FOR_PUBLISH (409)."
        test_recipe:
          setup: ["A DRAFT program with no sessions."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "No Sess", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pns: $.data.id }
          trigger:
            - call: "POST /programs/${pns}/publish"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NO_SESSION_FOR_PUBLISH"

      - name: cancel_terminal_session_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Session.OPEN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED session is terminal — a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED session that was cancelled."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Term Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { ptm: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${ptm}", title: "Tm", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { stm: $.data.id }
            - call: "POST /sessions/${stm}/cancel"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /sessions/${stm}/cancel"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_enrollment_starts_in_confirmed_when_seat_available
        claim_type: Initial State
        grounds: [state_machines.Enrollment.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "A fresh enrollment on an OPEN session with seats lands CONFIRMED (the system auto-resolves the REQUESTED fork to CONFIRMED) and creates an invoice line."
        test_recipe:
          setup: ["OPEN AFTERSCHOOL session base 15000, capacity 5; eligible fully-authorized child."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "init@x.com", full_name: "Init", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gin: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gin}", first_name: "In", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gin}"
              captures: { cin: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${cin}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${gin}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${cin}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gin}"
              captures: { inm: $.data.id }
            - call: "POST /authorization-forms/${inm}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${cin}", form_type: "PICKUP", authorized_pickup_names: ["Init"] }
              as: Guardian
              as_user_id: "${gin}"
              captures: { inp: $.data.id }
            - call: "POST /authorization-forms/${inp}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Init Camp", program_type: "AFTERSCHOOL", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pin: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pin}", title: "Init", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 15000 }
              as: ProgramDirector
              captures: { sin: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${sin}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { woin: $.data.id, woin_v: $.data.version }
            - call: "POST /programs/${pin}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${sin}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${cin}", weekly_offering_id: "${woin}", expected_weekly_offering_version: "${woin_v}" }
              as: Guardian
              as_user_id: "${gin}"
              captures: { einit: $.data.id }
          assert:
            - "response.status == 201"
            - "Enrollment.${einit}.status == CONFIRMED"
            - "Enrollment.${einit}.provisional_tuition_cents == 15000"

      - name: session_cancel_only_withdraws_non_terminal_enrollments
        claim_type: Conditional cascade
        grounds: [state_machines.Session.OPEN_to_CANCELLED, state_machines.Enrollment.CONFIRMED_to_WITHDRAWN]
        distinguishing_aspect: "Cancelling a session withdraws only the offering's CONFIRMED/WAITLISTED enrollments; an already-WITHDRAWN enrollment is left untouched and stays WITHDRAWN."
        test_recipe:
          setup: ["OPEN AFTERSCHOOL session base 15000, capacity 5; Child A withdrew earlier, Child B is CONFIRMED."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "cc@x.com", full_name: "Cc", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gcc: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gcc}", first_name: "Ax", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { cca: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${cca}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${gcc}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${cca}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ccam: $.data.id }
            - call: "POST /authorization-forms/${ccam}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${cca}", form_type: "PICKUP", authorized_pickup_names: ["Cc"] }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ccap: $.data.id }
            - call: "POST /authorization-forms/${ccap}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /children"
              payload: { guardian_id: "${gcc}", first_name: "Bx", birth_date: "2016-02-01" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ccb: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${ccb}", contact_name: "M", contact_phone: "2", relationship: "uncle" }
              as: Guardian
              as_user_id: "${gcc}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${ccb}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ccbm: $.data.id }
            - call: "POST /authorization-forms/${ccbm}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${ccb}", form_type: "PICKUP", authorized_pickup_names: ["Cc"] }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ccbp: $.data.id }
            - call: "POST /authorization-forms/${ccbp}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Cond Camp", program_type: "AFTERSCHOOL", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pcond: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pcond}", title: "Cd", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 15000 }
              as: ProgramDirector
              captures: { scond: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${scond}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { wocond: $.data.id, wocond_v: $.data.version }
            - call: "POST /programs/${pcond}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${scond}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /enrollments"
              payload: { child_id: "${cca}", weekly_offering_id: "${wocond}", expected_weekly_offering_version: "${wocond_v}" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { ecca: $.data.id }
            - call: "POST /enrollments/${ecca}/withdraw"
              payload: {}
              as: Guardian
              as_user_id: "${gcc}"
            - call: "GET /weekly-offerings/${wocond}"
              payload: {}
              as: ProgramDirector
              captures: { wocond_v2: $.data.version }
            - call: "POST /enrollments"
              payload: { child_id: "${ccb}", weekly_offering_id: "${wocond}", expected_weekly_offering_version: "${wocond_v2}" }
              as: Guardian
              as_user_id: "${gcc}"
              captures: { eccb: $.data.id }
          trigger:
            - call: "POST /sessions/${scond}/cancel"
              payload: {}
              as: ProgramDirector
            - call: "GET /enrollments/${ecca}"
              payload: {}
              as: ProgramDirector
            - call: "GET /enrollments/${eccb}"
              payload: {}
              as: ProgramDirector
          assert:
            - "Enrollment.${ecca}.status == WITHDRAWN"
            - "Enrollment.${eccb}.status == WITHDRAWN"
            - "WeeklyOffering.${wocond}.enrolled_count == 0"

      - name: auth_form_approve_then_revoke_compensation
        claim_type: Valid Transition
        grounds: [state_machines.AuthorizationForm.SUBMITTED_to_APPROVED, state_machines.AuthorizationForm.APPROVED_to_REVOKED]
        distinguishing_aspect: "An APPROVED authorization form can be revoked by its owning guardian, moving to REVOKED."
        test_recipe:
          setup: ["A child with an APPROVED MEDICAL form."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "ar@x.com", full_name: "Ar", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gar: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gar}", first_name: "Ar", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gar}"
              captures: { car: $.data.id }
            - call: "POST /authorization-forms"
              payload: { child_id: "${car}", form_type: "MEDICAL", medication_notes: "epipen" }
              as: Guardian
              as_user_id: "${gar}"
              captures: { farm: $.data.id }
            - call: "POST /authorization-forms/${farm}/approve"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /authorization-forms/${farm}/revoke"
              payload: {}
              as: Guardian
              as_user_id: "${gar}"
          assert:
            - "AuthorizationForm.${farm}.status == REVOKED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: full_scholarship_zeroes_tuition_keeps_camp_surcharge
        claim_type: Constants Applied
        grounds: [calculations.compute_line_tuition, calculations.compute_scholarship_discount]
        distinguishing_aspect: "FULL tier (1.0) zeros the scholarship-scaled base (round_half_up(20000*0)=0) but the CAMP surcharge 1500 still applies, so the line is 1500."
        test_recipe:
          setup: ["OPEN CAMP session base 20000; eligible child with APPROVED FULL scholarship."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "fs@x.com", full_name: "Fs", phone: "1", home_zip: "94101" }
              as: Anonymous
              captures: { gfs: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gfs}", first_name: "Fl", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gfs}"
              captures: { cfs: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${cfs}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${gfs}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${cfs}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gfs}"
              captures: { fsm: $.data.id }
            - call: "POST /authorization-forms/${fsm}/approve"
              payload: {}
              as: ProgramDirector
