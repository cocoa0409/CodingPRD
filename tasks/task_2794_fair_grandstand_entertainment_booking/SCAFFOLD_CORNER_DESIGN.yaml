  # ===========================================================================
  # SECTION 2 - From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: accept_cascade_stamps_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Offer.initial_state
          - state_machines.ShowBooking.initial_state
          - state_machines.ProductionAdvance.initial_state
          - state_machines.Offer.SENT_to_ACCEPTED
          - entities.RiderItem.fields.status
        distinguishing_aspect: |
          Every row born from the accept cascade lands on its declared initial state
          and on no other: the ShowBooking on DATE_HELD / SCALED_PENDING with null
          doors_time_utc and announced_at_utc, the ProductionAdvance on
          ADVANCE_PENDING with a null blocked_reason_code, the seed STAGING RiderItem
          on REQUESTED, and a freshly created Offer on DRAFT with round_count 0.
        test_recipe:
          setup:
            - "Canonical edition, stage, agent and artist."
            - "One offer sent and accepted; a second offer is created but never sent."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
