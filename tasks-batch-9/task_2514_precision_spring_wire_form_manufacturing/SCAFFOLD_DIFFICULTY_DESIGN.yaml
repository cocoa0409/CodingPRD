              as: ProcessTechnician
              captures: { batch_a_id: $.data.id }
          trigger:
            - call: "POST /heat-treat-batches"
              payload: { oven_id: "${oven_id}", run_id: "${run_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T14:00:00Z", load_kg: 80.0, target_temp_c: 425.0, peening_requested: false }
              as: ProcessTechnician
            - call: "POST /heat-treat-batches"
              payload: { oven_id: "${oven_id}", run_id: "${run_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T14:00:00Z", load_kg: 70.0, target_temp_c: 425.0, peening_requested: false }
              as: ProcessTechnician
              captures: { batch_b_id: $.data.id }
            - call: "POST /heat-treat-batches/${batch_b_id}/cancel"
              payload: {}
              as: ProcessTechnician
            - call: "POST /heat-treat-batches"
              payload: { oven_id: "${oven_id}", run_id: "${run_id}", window_start: "2026-08-05T10:01:00Z", window_end: "2026-08-05T14:00:00Z", load_kg: 80.0, target_temp_c: 425.0, peening_requested: false }
              as: ProcessTechnician
              captures: { batch_c_id: $.data.id }
          assert:
            - "the first trigger call returns 409 with error_id ERR_OVEN_CAPACITY_EXCEEDED (180.000 + 80.000 == 260.000 > 250.0, and 10:00Z touches batch A's closed end)"
            - "the second trigger call returns 201: 180.000 + 70.000 == 250.000 is exactly capacity and must pass"
            - "after the second call StressReliefOven.${oven_id}.scheduled_load_kg == 250.000"
            - "after the cancel StressReliefOven.${oven_id}.scheduled_load_kg == 180.000 and HeatTreatBatch.${batch_b_id}.batch_status == CANCELLED"
            - "the fourth trigger call returns 201: [10:01Z, 14:00Z] does not intersect batch A's [06:00Z, 10:00Z], so the occupied load for that interval is 0.000"
            - "after the fourth call StressReliefOven.${oven_id}.scheduled_load_kg == 260.000, which legally exceeds capacity_kg 250.0 because the two live batches never share an instant"
            - "HeatTreatBatch.${batch_a_id}.batch_status == SCHEDULED and HeatTreatBatch.${batch_c_id}.batch_status == SCHEDULED"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_ship_blocked_by_written_off_tooling_after_design_obsolescence
        entity_pair: "ShipmentLot -> ToolingAsset"
        grounds:
          - validations[priority=76]
          - errors.ERR_TOOLING_NOT_AMORTIZING
          - state_machines.ToolingAsset.AMORTIZING_to_WRITTEN_OFF
          - state_machines.SpringDesign.PRODUCTION_RELEASED_to_OBSOLETE
          - calculations.tooling_amortization_recovery
        distinguishing_aspect: |
          Whether a PACKED lot may ship depends on the state of an entity the request never names and that the
          ProgramManager does not control: the ToolingAsset behind the run's design. An EngineeringManager
          obsoleting the design writes the tool off, and the very next ship attempt on an identical, still PACKED
          lot must fail with ERR_TOOLING_NOT_AMORTIZING even though the lot, the run and the program are all
          untouched. The instance ships one lot first, so the only difference between success and 409 is the
          third entity's state.
        test_recipe:
          setup:
            - "A fully PPAP-approved AUTOMOTIVE_SAFETY program (committed 500000, MOQ 1000, quoted unit 24 cents) whose design D1 is PRODUCTION_RELEASED and whose 4800000-cent tool is AMORTIZING at 10 cents per piece."
            - "A COMPLETE, peened, in-control 26000-piece run with produced_pieces 25500 and two 1000-piece ALLOCATED lots drawn from it."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-AUTO-5", customer_name: "Northwind Drivetrain", application_class: "AUTOMOTIVE_SAFETY", ppap_level: 3, committed_pieces: 500000, minimum_order_quantity: 1000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.33, amortization_method: "FORECAST_BASIS" }
