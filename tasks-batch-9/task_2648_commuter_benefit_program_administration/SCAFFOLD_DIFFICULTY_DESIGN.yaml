              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "NYC-SUB-1", work_region_code: "US-NY-NYC", payroll_cycle: "SEMI_MONTHLY", hire_date: "2026-01-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-07", opens_at: "2026-06-01T00:00:00Z", cutoff_at: "2026-07-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /benefits/election-windows/${w1_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${w1_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 5000, posttax_amount_cents: 0, expected_account_version: "${acct_v1}" }
              as: ProgramAdmin
              captures: { el_july_id: $.data.id }
            - call: "POST /benefits/election-windows/${w1_id}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-20T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /benefits/election-windows/${w2_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_v2: $.data.version, avail_after_lock: $.data.available_balance_cents }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${w2_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 4000, posttax_amount_cents: 0, expected_account_version: "${acct_v2}" }
              as: ProgramAdmin
