scenario: |
  Generate task harder than expert level!

  2684. Contractor Safety Prequalification (contractor prequalification network): contractor
  registration with scope of work, hazard profile and site assignment, safety statistics
  submission including incident rates, citation history and experience modification rate with
  verification, written program and training documentation review against client-specific
  requirements, grading against client thresholds with conditional approval and improvement
  plans, insurance certificate collection with coverage verification and expiration monitoring,
  worker-level training and qualification records tied to site access, annual requalification,
  incident-triggered review and client-specific variance approvals, subcontractor cascading
  requirements and audit sampling
domain_name: contractor-safety-prequalification
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Contractor and Client are peers joined by the Prequalification junction (many-to-many);
  # SubcontractorLink is a self-referential Contractor -> Contractor edge set that must stay a
  # DAG (cycle detection + depth limit); SiteAccessGrant is a three-way junction
  # (Worker x Site x Prequalification). No single ownership tree exists.

  state_machine_shape: cyclic
  # Prequalification cycles CONDITIONAL -> UNDER_REVIEW -> CONDITIONAL (improvement-plan loop)
  # and SUSPENDED -> UNDER_REVIEW (incident-review loop); InsuranceCertificate carries two
  # independent state dimensions (verification_status x lifecycle_status) on one row;
  # SUBMITTED -> UNDER_REVIEW is a fork-join over the two parallel review dimensions.

  relationship_patterns:
    - many_to_many        # Contractor x Client via Prequalification; Worker x Site via SiteAccessGrant
    - self_referential    # SubcontractorLink.parent_contractor_id / child_contractor_id -> Contractor
    - one_to_many         # Client -> Site, Contractor -> Worker, Prequalification -> SafetyStatistic
    - cross_aggregate     # SiteAccessGrant spans the Contractor aggregate and the Client aggregate

  role_model: segregation_of_duties
  # ContractorAdmin submits, ClientSafetyManager grades and decides, VerificationAnalyst
  # independently verifies third-party data; the same VerificationAnalyst user id may not
  # verify both a contractor's safety statistics and that contractor's insurance certificates.

  consistency_model: immediate
  # Every cascade in this scaffold completes inside the triggering request. The one deliberate
  # wrinkle: InsuranceCertificate.lifecycle_status is a MATERIALIZED derived field refreshed
  # only at create / verify / requalification-run, while every gating validation recomputes it
  # fresh from the logical clock (see calculations.certificate_lifecycle_status).

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    description: "Owner/hiring company that publishes prequalification thresholds and requirements."
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the hiring client."
        constraints: "1..200 chars, unique across Clients"
      - name: industry_code
        type: string
        source: input
        description: "NAICS-style industry code of the client."
        constraints: "exactly 6 digits"
      - name: grading_policy
        type: enum
        source: input
        description: "Grade-band table selector used by calculations.grade_band_assignment."
        default: BALANCED
        constraints: "one of {STRICT, BALANCED}"
      - name: max_trir
        type: number
        source: input
        description: "Published maximum acceptable Total Recordable Incident Rate."
        default: 3.00
        constraints: "> 0, 2 decimal places"
      - name: max_dart_rate
        type: number
        source: input
        description: "Published maximum acceptable DART rate."
        default: 1.50
        constraints: "> 0, 2 decimal places"
      - name: max_emr
        type: number
        source: input
        description: "Published maximum acceptable Experience Modification Rate."
        default: 1.00
        constraints: "> 0, 2 decimal places"
      - name: max_citation_points
        type: integer
        source: input
        description: "Published maximum acceptable citation points."
        default: 6
        constraints: ">= 0"
      - name: weight_trir
        type: number
        source: input
        description: "Composite weight applied to the TRIR sub-score."
        default: 0.40
        constraints: "0 < w <= 1, 2 decimal places"
      - name: weight_dart
        type: number
        source: input
        description: "Composite weight applied to the DART sub-score."
        default: 0.25
        constraints: "0 < w <= 1, 2 decimal places"
      - name: weight_emr
        type: number
        source: input
        description: "Composite weight applied to the EMR sub-score."
        default: 0.25
        constraints: "0 < w <= 1, 2 decimal places"
      - name: weight_citation
        type: number
        source: input
        description: "Composite weight applied to the citation-points sub-score."
        default: 0.10
        constraints: "0 < w <= 1, 2 decimal places; the four weights MUST sum to exactly 1.00 else ERR_INVALID_FIELD_VALUE"
      - name: conditional_band_pct
        type: number
        source: input
        description: "Percent above an effective threshold that still permits CONDITIONAL rather than REJECTED."
        default: 20
        constraints: ">= 0 and <= 100"
      - name: requalification_interval_months
        type: integer
        source: input
        description: "Months of validity granted to an APPROVED or CONDITIONAL prequalification."
        default: 12
        constraints: "1..36"
      - name: audit_sample_rate_pct
        type: number
        source: input
        description: "Percent of eligible prequalifications drawn per audit-sampling run."
        default: 25
        constraints: ">= 0 and <= 100"
      - name: cascade_depth_limit
        type: integer
        source: input
        description: "Maximum SubcontractorLink depth this client permits below a prime contractor."
        default: 2
        constraints: "1..5"
      - name: required_coverage_types
        type: array
        source: input
        description: "Insurance coverage types every prequalified contractor must carry."
        default: ["GL", "WC"]
        constraints: "non-empty subset of {GL, WC, AUTO, UMBRELLA}, no duplicates"

  - name: Site
    parent: Client
    common_fields: true
    description: "A physical client site with its own hazard requirements and access posture."
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client that owns this site."
      - name: site_code
        type: string
        source: input
        description: "Client-local site identifier."
        constraints: "1..40 chars, unique per client_id"
      - name: required_hazard_classes
        type: array
        source: input
        description: "Hazard classes present on this site; drives the worker qualification set."
        constraints: "non-empty subset of {GENERAL, HEIGHTS, CONFINED_SPACE, ELECTRICAL, HOT_WORK, EXCAVATION}"
      - name: min_grade
        type: enum
        source: input
        description: "Lowest prequalification grade allowed to hold access at this site."
        default: C
        constraints: "one of {A, B, C}"
      - name: granted_worker_count
        type: integer
        source: computed
        description: "Materialized count of SiteAccessGrant rows on this site with status GRANTED (conserved quantity, see calculations.site_granted_worker_count)."
        default: 0
        constraints: ">= 0"
      - name: access_gate_status
        type: enum
        source: computed
        description: "Site posture derived from open incidents; gates SiteAccessGrant creation (see calculations.site_access_gate_status)."
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, LOCKED}"

  - name: Contractor
    parent: null
    common_fields: true
    description: "Firm seeking prequalification with one or more clients."
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the contractor."
        constraints: "1..200 chars, unique across Contractors"
      - name: scope_of_work
        type: array
        source: input
        description: "Trades this contractor performs."
        constraints: "non-empty subset of {GENERAL_BUILDING, ELECTRICAL_TRADE, MECHANICAL_TRADE, SCAFFOLDING, ROOFING, EARTHWORK}"
      - name: hazard_profile
        type: array
        source: input
        description: "Hazard classes this contractor is qualified to work in; drives required written programs and base hazard tier."
        constraints: "non-empty subset of {GENERAL, HEIGHTS, CONFINED_SPACE, ELECTRICAL, HOT_WORK, EXCAVATION}"
      - name: employee_count
        type: integer
        source: input
        description: "Head count reported at registration."
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Network standing of the contractor; only ACTIVE contractors may submit prequalifications."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, DEBARRED}; SUSPENDED and DEBARRED are produced by PATCH /contractors/{id}"
      - name: base_hazard_tier
        type: integer
        source: computed
        description: "1 when hazard_profile contains no high-hazard class, else 2 (see calculations.effective_client_threshold_resolution step 2)."
        default: 1
        constraints: "1 or 2"
      - name: incident_review_flag
        type: boolean
        source: computed
        description: "True while at least one IncidentReport of severity LOST_TIME or FATALITY for this contractor has review_status OPEN."
        default: false
      - name: open_severe_incident_count
        type: integer
        source: computed
        description: "Count of IncidentReport rows for this contractor with review_status OPEN and severity in {RECORDABLE, LOST_TIME, FATALITY}; drives insurance aggregate depletion."
        default: 0
        constraints: ">= 0"
      - name: open_deficiency_count
        type: integer
        source: computed
        description: "Materialized sum of deficiency_codes lengths over this contractor's CONDITIONAL prequalifications (conserved quantity, see calculations.contractor_open_deficiency_count)."
        default: 0
        constraints: ">= 0"
      - name: verified_coverage_types
        type: array
        source: computed
        description: "Coverage types for which this contractor currently holds a VERIFIED certificate whose freshly computed lifecycle_status is CURRENT or EXPIRING_SOON."
        default: []

  - name: Prequalification
    parent: null
    common_fields: true
    description: "Junction row binding one Contractor to one Client for one cycle year; carries the graded outcome."
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the applying contractor."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the grading client."
      - name: cycle_year
        type: integer
        source: input
        description: "Prequalification cycle year."
        constraints: "within [logical_clock_year - 1, logical_clock_year + 1]"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state, see state_machines.Prequalification."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, CONDITIONAL, REJECTED, SUSPENDED, EXPIRED}"
      - name: statistics_verification_status
        type: enum
        source: system
        description: "First parallel review dimension, driven by SafetyStatistic verification."
        default: NOT_SUBMITTED
        constraints: "one of {NOT_SUBMITTED, PENDING, VERIFIED, REJECTED}"
      - name: document_review_status
        type: enum
        source: system
        description: "Second parallel review dimension, driven by WrittenProgram review outcomes."
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, COMPLETE, DEFICIENT}"
      - name: provisional_composite_score
        type: number
        source: computed
        description: "Composite score under the provisional variant, written by the DRAFT -> SUBMITTED transition."
        default: null
        constraints: "null or 0.00..100.00, 2 decimal places"
      - name: final_composite_score
        type: number
        source: computed
        description: "Composite score under the final variant, written by each grading transition out of UNDER_REVIEW."
        default: null
        constraints: "null or 0.00..100.00, 2 decimal places"
      - name: grade
        type: enum
        source: computed
        description: "Letter grade derived from final_composite_score and the client's grading_policy."
        default: null
        constraints: "null or one of {A, B, C, F}"
      - name: deficiency_codes
        type: array
        source: computed
        description: "Ordered breach codes written at grading; emptied when an improvement plan is accepted. A failed audit appends AUDIT_SAMPLING last."
        default: []
        constraints: "ordered subset of [TRIR, DART, EMR, CITATION_POINTS], then COMPOSITE_C when grade is C or COMPOSITE_F when grade is F, then AUDIT_SAMPLING when a sampled audit recorded findings"
      - name: effective_thresholds
        type: object
        source: computed
        description: "Snapshot object {max_trir, max_dart_rate, max_emr, max_citation_points, tightening, hazard_tier} pinned at the last grading."
        default: null
      - name: graded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last grading transition."
        default: null
      - name: graded_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ClientSafetyManager that performed the last grading."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "graded_at plus Client.requalification_interval_months; annual requalification deadline."
        default: null
      - name: conditional_expires_at
        type: datetime
        source: computed
        description: "graded_at plus CONDITIONAL_CURE_DAYS when graded CONDITIONAL, else null."
        default: null
      - name: audit_state
        type: enum
        source: system
        description: "Audit-sampling state, see calculations.audit_sample_selection."
        default: NOT_SELECTED
        constraints: "one of {NOT_SELECTED, SELECTED, PASSED, FAILED}"
      - name: audit_selected_at
        type: datetime
        source: computed
        description: "Logical-clock instant this row was drawn by an audit-sampling run."
        default: null
      - name: audit_findings_count
        type: integer
        source: computed
        description: "Findings recorded by POST /prequalifications/{id}/audit-findings."
        default: 0
        constraints: ">= 0"

  - name: SafetyStatistic
    parent: Prequalification
    common_fields: true
    description: "One reporting year of self-reported safety statistics awaiting third-party verification."
    fields:
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the submission this statistic belongs to."
      - name: reporting_year
        type: integer
        source: input
        description: "Calendar year the figures cover."
        constraints: "within [logical_clock_year - 3, logical_clock_year]; unique per prequalification_id among rows with verification_status in {PENDING, VERIFIED}"
      - name: hours_worked
        type: integer
        source: input
        description: "Total employee hours worked in the reporting year."
        constraints: ">= 0"
      - name: recordable_incidents
        type: integer
        source: input
        description: "OSHA recordable incident count."
        constraints: ">= 0"
      - name: dart_cases
        type: integer
        source: input
        description: "Days-away/restricted/transfer case count."
        constraints: ">= 0 and <= recordable_incidents"
      - name: fatalities
        type: integer
        source: input
        description: "Fatality count."
        constraints: ">= 0 and <= recordable_incidents"
      - name: emr
        type: number
        source: input
        description: "Experience modification rate published by the carrier."
        constraints: "> 0, 2 decimal places"
      - name: citation_count_willful
        type: integer
        source: input
        description: "Willful citations in the reporting year."
        constraints: ">= 0"
      - name: citation_count_serious
        type: integer
        source: input
        description: "Serious citations in the reporting year."
        constraints: ">= 0"
      - name: citation_count_other
        type: integer
        source: input
        description: "Other-than-serious citations in the reporting year."
        constraints: ">= 0"
      - name: source_document_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded OSHA 300A / loss-run document."
        constraints: "1..120 chars"
      - name: verification_status
        type: enum
        source: system
        description: "Verification outcome, see state_machines.SafetyStatistic."
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, REJECTED}"
      - name: verified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the VerificationAnalyst that decided this row; feeds the segregation-of-duties check."
        default: null
      - name: verified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the verification decision."
        default: null
      - name: trir
        type: number
        source: computed
        description: "Total recordable incident rate, see calculations.metric_normalization step 1."
        default: null
        constraints: "null or >= 0, 4 decimal places"
      - name: dart_rate
        type: number
        source: computed
        description: "DART rate, see calculations.metric_normalization step 1."
        default: null
        constraints: "null or >= 0, 4 decimal places"
      - name: citation_points
        type: integer
        source: computed
        description: "Weighted citation points, see calculations.citation_points."
        default: null
        constraints: "null or >= 0"

  - name: WrittenProgram
    parent: Prequalification
    common_fields: true
    description: "A written safety program document submitted for client review."
    fields:
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the submission this document belongs to."
      - name: program_type
        type: enum
        source: input
        description: "Which written program this document is."
        constraints: "one of {HAZCOM, DISCIPLINE_POLICY, FALL_PROTECTION, CONFINED_SPACE, LOTO, HOT_WORK, EXCAVATION}; unique per prequalification_id"
      - name: revision_date
        type: datetime
        source: input
        description: "Publication date of the revision submitted."
        constraints: "ISO 8601 UTC, must be <= the logical clock"
      - name: document_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded document."
        constraints: "1..120 chars"
      - name: review_status
        type: enum
        source: system
        description: "Review outcome, see state_machines.WrittenProgram."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, DEFICIENT, WAIVED}"
      - name: reviewer_note
        type: string
        source: input
        description: "Free-text note captured with the review decision. Supplied only by the review/waive transition body, never accepted at creation."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ClientSafetyManager that reviewed the document."
        default: null
      - name: is_required
        type: boolean
        source: computed
        description: "True when program_type is in the required set derived from the contractor's hazard_profile (see calculations.required_program_set)."
        default: false

  - name: ImprovementPlan
    parent: Prequalification
    common_fields: true
    description: "Corrective-action plan attached to a CONDITIONAL prequalification."
    fields:
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the conditional submission being cured."
      - name: due_date
        type: datetime
        source: input
        description: "Deadline for the contractor to submit evidence."
        constraints: "ISO 8601 UTC, strictly after the logical clock and <= Prequalification.conditional_expires_at"
      - name: milestone_count
        type: integer
        source: input
        description: "Number of corrective milestones the plan contains."
        constraints: "1..20"
      - name: deficiency_codes
        type: array
        source: computed
        description: "Snapshot of Prequalification.deficiency_codes taken at plan creation."
        default: []
      - name: evidence_ref
        type: string
        source: input
        description: "Opaque reference supplied only by the improvement-plan submit transition body, never accepted at creation."
        default: null
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle, see state_machines.ImprovementPlan."
        default: OPEN
        constraints: "one of {OPEN, SUBMITTED, ACCEPTED, REJECTED, OVERDUE}"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ClientSafetyManager that accepted or rejected the plan."
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the plan reached ACCEPTED, REJECTED-as-superseded, or OVERDUE."
        default: null

  - name: InsuranceCertificate
    parent: Contractor
    common_fields: true
    description: "Certificate of insurance with two independent state dimensions (verification and lifecycle)."
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the insured contractor."
      - name: coverage_type
        type: enum
        source: input
        description: "Line of coverage evidenced by this certificate."
        constraints: "one of {GL, WC, AUTO, UMBRELLA}"
      - name: carrier_name
        type: string
        source: input
        description: "Issuing carrier."
        constraints: "1..120 chars"
      - name: each_occurrence_limit
        type: integer
        source: input
        description: "Per-occurrence limit in whole US dollars."
        constraints: ">= 0"
      - name: aggregate_limit
        type: integer
        source: input
        description: "Policy aggregate limit in whole US dollars."
        constraints: ">= each_occurrence_limit"
      - name: effective_date
        type: datetime
        source: input
        description: "Inclusive start of the coverage interval."
        constraints: "ISO 8601 UTC"
      - name: expiration_date
        type: datetime
        source: input
        description: "Exclusive end of the coverage interval (half-open [effective_date, expiration_date))."
        constraints: "ISO 8601 UTC, strictly after effective_date"
      - name: additional_insured
        type: boolean
        source: input
        description: "Whether the client is named as additional insured."
        default: false
      - name: waiver_of_subrogation
        type: boolean
        source: input
        description: "Whether a waiver of subrogation endorsement is attached."
        default: false
      - name: verification_status
        type: enum
        source: system
        description: "First state dimension, moved only by POST /insurance-certificates/{id}/verify."
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, REJECTED}"
      - name: verified_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the VerificationAnalyst that decided this certificate; feeds the segregation-of-duties check."
        default: null
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Second state dimension, materialized at create / verify / requalification-run (see calculations.certificate_lifecycle_status)."
        default: CURRENT
        constraints: "one of {NOT_YET_EFFECTIVE, CURRENT, EXPIRING_SOON, LAPSED, SUPERSEDED}"
      - name: available_aggregate
        type: integer
        source: computed
        description: "aggregate_limit minus incident depletion, see calculations.insurance_coverage_adequacy variant aggregate_depletion_basis."
        default: null

  - name: Worker
    parent: Contractor
    common_fields: false
    description: "Immutable worker record; qualifications are appended as child rows."
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the employing contractor."
      - name: full_name
        type: string
        source: input
        description: "Worker name."
        constraints: "1..120 chars"
      - name: employee_ref
        type: string
        source: input
        description: "Contractor-local employee identifier."
        constraints: "1..40 chars, unique per contractor_id"
      - name: trade_code
        type: enum
        source: input
        description: "Primary trade the worker performs."
        constraints: "one of {GENERAL_BUILDING, ELECTRICAL_TRADE, MECHANICAL_TRADE, SCAFFOLDING, ROOFING, EARTHWORK}"

  - name: WorkerQualification
    parent: Worker
    common_fields: false
    description: "Immutable training/qualification record tied to site access eligibility."
    fields:
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; the qualified worker."
      - name: qualification_code
        type: enum
        source: input
        description: "Training or qualification evidenced."
        constraints: "one of {OSHA10, OSHA30, FALL_PROTECTION_COMPETENT, CONFINED_SPACE_ENTRANT, LOTO_AUTHORIZED, HOT_WORK_PERMIT, EXCAVATION_COMPETENT}"
      - name: issued_date
        type: datetime
        source: input
        description: "Date the credential was issued."
        constraints: "ISO 8601 UTC, <= the logical clock"
      - name: expiration_date
        type: datetime
        source: input
        description: "Instant the credential stops being current; currency test is expiration_date > logical clock (strict)."
        constraints: "ISO 8601 UTC, strictly after issued_date"
      - name: training_provider
        type: string
        source: input
        description: "Provider that issued the credential."
        constraints: "1..120 chars"
      - name: evidence_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded certificate."
        constraints: "1..120 chars"

  - name: SiteAccessGrant
    parent: null
    common_fields: true
    description: "Three-way junction granting one worker access to one site under one prequalification."
    fields:
      - name: worker_id
        type: string
        source: input
        description: "FK -> Worker.id; the worker being badged."
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site being entered."
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the prequalification that authorizes the worker's employer at this site's client."
      - name: expires_at
        type: datetime
        source: input
        description: "Requested inclusive end of the access window; intervals are closed [granted_at, expires_at]."
        constraints: "ISO 8601 UTC, strictly after the logical clock"
      - name: granted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the grant was issued (inclusive start of the closed access window)."
      - name: status
        type: enum
        source: system
        description: "Grant lifecycle, see state_machines.SiteAccessGrant."
        default: GRANTED
        constraints: "one of {GRANTED, REVOKED, EXPIRED}"
      - name: revocation_reason
        type: enum
        source: input
        description: "Why the grant was revoked. Supplied only by the explicit revoke transition body (CLIENT_REVOKED); cascade revocations set it themselves and never accept it at creation."
        default: null
        constraints: "null or one of {CLIENT_REVOKED, PREQUAL_SUSPENDED, PREQUAL_EXPIRED, PREQUAL_REJECTED}"
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant of revocation; starts the ACCESS_COOLDOWN_HOURS buffer."
        default: null
      - name: qualification_snapshot
        type: array
        source: computed
        description: "Qualification codes that satisfied the site's hazard classes at grant time."
        default: []

  - name: IncidentReport
    parent: null
    common_fields: true
    description: "Client-filed incident record that triggers prequalification review."
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the contractor involved."
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; where the incident occurred."
      - name: occurred_at
        type: datetime
        source: input
        description: "Incident instant; must be within the trailing 365 days of the logical clock."
        constraints: "ISO 8601 UTC, <= logical clock and >= logical clock minus 365 days"
      - name: severity
        type: enum
        source: input
        description: "Severity class; LOST_TIME and FATALITY trigger the incident-review cascade."
        constraints: "one of {FIRST_AID, RECORDABLE, LOST_TIME, FATALITY}"
      - name: osha_reportable
        type: boolean
        source: input
        description: "Whether the event is OSHA reportable."
        default: false
      - name: description
        type: string
        source: input
        description: "Narrative of the event."
        constraints: "1..500 chars"
      - name: review_status
        type: enum
        source: system
        description: "Review lifecycle, see state_machines.IncidentReport."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: findings_note
        type: string
        source: input
        description: "Note captured only by the close-review transition body, never accepted at creation."
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the review was closed."
        default: null
      - name: triggered_suspension_count
        type: integer
        source: computed
        description: "Number of prequalifications suspended by this report's cascade."
        default: 0
        constraints: ">= 0"

  - name: Variance
    parent: Prequalification
    common_fields: true
    description: "Client-specific waiver of one graded requirement for one prequalification."
    fields:
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the submission the waiver applies to."
      - name: requirement_code
        type: enum
        source: input
        description: "Which graded requirement the variance waives."
        constraints: "one of {TRIR, DART, EMR, CITATION_POINTS, HAZARD_CLASS}; unique per prequalification_id among rows with status in {REQUESTED, APPROVED}"
      - name: requested_value
        type: number
        source: input
        description: "Ceiling the contractor asks the client to accept for requirement_code."
        constraints: "> 0"
      - name: justification
        type: string
        source: input
        description: "Contractor's written justification."
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: system
        description: "Decision state, see state_machines.Variance."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}"
      - name: expires_at
        type: datetime
        source: input
        description: "Approval expiry supplied only by the variance decision body (APPROVE), never accepted at creation; an APPROVED variance is only counted while expires_at > the logical clock."
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ClientSafetyManager that decided the request."
        default: null

  - name: SubcontractorLink
    parent: null
    common_fields: true
    description: "Self-referential Contractor -> Contractor edge cascading a client's requirements down the tier chain; the edge set must stay a DAG."
    fields:
      - name: parent_contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the contractor issuing the subcontract."
      - name: child_contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the engaged subcontractor."
      - name: prequalification_id
        type: string
        source: input
        description: "FK -> Prequalification.id; the prime prequalification whose client requirements cascade down this edge."
      - name: scope_of_work
        type: array
        source: input
        description: "Trades subcontracted on this edge."
        constraints: "non-empty subset of Contractor.scope_of_work enum, must be a subset of the child contractor's scope_of_work"
      - name: depth
        type: integer
        source: computed
        description: "1 for an edge whose parent is the prequalification's own contractor, else parent edge depth plus 1."
        constraints: ">= 1 and <= Client.cascade_depth_limit"
      - name: flow_down_status
        type: enum
        source: computed
        description: "Whether the child satisfies the cascaded client requirements (see calculations.flow_down_status)."
        default: PENDING
        constraints: "one of {PENDING, SATISFIED, DEFICIENT}"
      - name: status
        type: enum
        source: system
        description: "Edge lifecycle, see state_machines.SubcontractorLink."
        default: ACTIVE
        constraints: "one of {ACTIVE, TERMINATED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Prequalification
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    note: |
      Two PARALLEL review dimensions live on the same row and advance independently of `status`:
        statistics_verification_status = the verification_status of the GOVERNING SafetyStatistic
          (the row with the greatest reporting_year among rows whose verification_status is in
          {PENDING, VERIFIED}); NOT_SUBMITTED when no rows exist; REJECTED when rows exist but
          none is PENDING or VERIFIED.
        document_review_status = DEFICIENT if any required WrittenProgram has review_status
          DEFICIENT; else COMPLETE if every required program_type has a row with review_status in
          {ACCEPTED, WAIVED}; else NOT_STARTED while status is DRAFT; else IN_PROGRESS.
      SUBMITTED -> UNDER_REVIEW is the fork-join of those two dimensions. CONDITIONAL ->
      UNDER_REVIEW and SUSPENDED -> UNDER_REVIEW make the machine cyclic.
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /prequalifications"
        actor: ContractorAdmin
        preconditions:
          - "Contractor.status == ACTIVE"
          - "payload expected_contractor_version == Contractor.version (else ERR_STALE_VERSION)"
          - "cycle_year within [logical_clock_year - 1, logical_clock_year + 1]"
          - "no Prequalification exists for the same (contractor_id, client_id) with status in {DRAFT, SUBMITTED, UNDER_REVIEW} (else ERR_DUPLICATE_PREQUALIFICATION)"
          - "no Prequalification exists for the same (contractor_id, client_id, cycle_year) with status in {APPROVED, CONDITIONAL, SUSPENDED} (else ERR_DUPLICATE_PREQUALIFICATION)"
        side_effects:
          - "status = DRAFT, statistics_verification_status = NOT_SUBMITTED, document_review_status = NOT_STARTED, audit_state = NOT_SELECTED"
          - "SUPERSEDE: every Prequalification for the same (contractor_id, client_id) with cycle_year strictly less than the new cycle_year and status in {APPROVED, CONDITIONAL, SUSPENDED} transitions to EXPIRED (processing order cycle_year ASC, then created_at ASC), each firing its own APPROVED/CONDITIONAL/SUSPENDED -> EXPIRED side-effect chain below"
          - "increments Contractor.version by 1"
          - "recomputes Contractor.open_deficiency_count"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /prequalifications/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "Contractor.status == ACTIVE"
          - "statistics_verification_status in {PENDING, VERIFIED} (i.e. a governing SafetyStatistic exists) else ERR_STATISTICS_UNVERIFIED"
          - "every program_type in calculations.required_program_set has a WrittenProgram row on this prequalification (else ERR_REQUIRED_PROGRAM_MISSING)"
        side_effects:
          - "provisional_composite_score = calculations.composite_prequalification_score variant provisional"
          - "document_review_status recomputed (NOT_STARTED -> IN_PROGRESS unless already COMPLETE or DEFICIENT)"
          - "grade, final_composite_score, effective_thresholds remain null"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: re-evaluated at the end of POST /safety-statistics/{id}/verify and POST /written-programs/{id}/review"
        actor: system
        preconditions:
          - "statistics_verification_status == VERIFIED"
          - "document_review_status == COMPLETE"
        side_effects:
          - "status = UNDER_REVIEW; no score is written by this transition"
        note: "Fork-join: whichever of the two dimensions completes last performs this transition inside its own request."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /prequalifications/{id}/grade"
        actor: ClientSafetyManager
        preconditions:
          - "Contractor.incident_review_flag == false (else ERR_INCIDENT_REVIEW_ACTIVE)"
          - "for every coverage_type in Client.required_coverage_types the contractor holds an InsuranceCertificate with verification_status == VERIFIED and freshly computed lifecycle_status in {CURRENT, EXPIRING_SOON} (else ERR_MISSING_VERIFIED_COVERAGE)"
          - "every such certificate is adequate under calculations.insurance_coverage_adequacy variant aggregate_depletion_basis (else ERR_COVERAGE_LIMIT_INSUFFICIENT)"
          - "calculations.grading_decision yields APPROVED (grade in {A, B} and deficiency_codes empty)"
        side_effects:
          - "effective_thresholds = calculations.effective_client_threshold_resolution snapshot"
          - "final_composite_score = calculations.composite_prequalification_score variant final; grade = calculations.grade_band_assignment"
          - "deficiency_codes = [], conditional_expires_at = null"
          - "graded_at = logical clock, graded_by_user_id = X-User-ID"
          - "expires_at = graded_at plus Client.requalification_interval_months"
          - "recomputes Contractor.open_deficiency_count"
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /prequalifications/{id}/grade"
        actor: ClientSafetyManager
        preconditions:
          - "same first three preconditions as UNDER_REVIEW -> APPROVED"
          - "calculations.grading_decision yields CONDITIONAL (no hard breach, and either deficiency_codes non-empty or grade == C)"
        side_effects:
          - "effective_thresholds, final_composite_score, grade, graded_at, graded_by_user_id, expires_at written exactly as in UNDER_REVIEW -> APPROVED"
          - "deficiency_codes = calculations.grading_decision.deficiency_codes"
          - "conditional_expires_at = graded_at plus CONDITIONAL_CURE_DAYS days"
          - "increments Contractor.open_deficiency_count by len(deficiency_codes) (recomputed from calculations.contractor_open_deficiency_count)"
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /prequalifications/{id}/grade"
        actor: ClientSafetyManager
        preconditions:
          - "same first three preconditions as UNDER_REVIEW -> APPROVED"
          - "calculations.grading_decision yields REJECTED (a hard breach exists or grade == F)"
        side_effects:
          - "effective_thresholds, final_composite_score, grade, graded_at, graded_by_user_id written as above; expires_at = null, conditional_expires_at = null"
          - "deficiency_codes = calculations.grading_decision.deficiency_codes"
          - "every SiteAccessGrant with this prequalification_id and status GRANTED transitions to REVOKED with revocation_reason = PREQUAL_REJECTED (processing order created_at ASC), which decrements Site.granted_worker_count and recomputes Site.access_gate_status"
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row (becomes DEFICIENT)"
          - "recomputes Contractor.open_deficiency_count"
      - from: CONDITIONAL
        to: UNDER_REVIEW
        trigger: "system: cascade from POST /improvement-plans/{id}/decision with decision ACCEPT"
        actor: system
        preconditions:
          - "the accepted ImprovementPlan.prequalification_id is this row"
        side_effects:
          - "deficiency_codes = [], conditional_expires_at = null, grade = null, final_composite_score = null, effective_thresholds = null"
          - "recomputes Contractor.open_deficiency_count (decreases by the cleared code count)"
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row (DEFICIENT -> PENDING)"
        note: "Cycle: the row can be graded again from UNDER_REVIEW, producing a second CONDITIONAL or an APPROVED."
      - from: CONDITIONAL
        to: REJECTED
        trigger: "system: cascade from POST /clients/{id}/requalification-runs"
        actor: system
        preconditions:
          - "logical clock >= conditional_expires_at"
          - "no ImprovementPlan on this row has status ACCEPTED"
        side_effects:
          - "every ImprovementPlan on this row with status in {OPEN, SUBMITTED} transitions to OVERDUE with closed_at = logical clock; that plan transition is what carries this row to REJECTED"
          - "deficiency_codes preserved, expires_at = null"
          - "every SiteAccessGrant with this prequalification_id and status GRANTED transitions to REVOKED with revocation_reason = PREQUAL_REJECTED, decrementing Site.granted_worker_count and recomputing Site.access_gate_status"
          - "recomputes Contractor.open_deficiency_count"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system: cascade from POST /incident-reports when Contractor.incident_review_flag flips false -> true"
        actor: system
        preconditions:
          - "Contractor.incident_review_flag == true after the report was filed"
        side_effects:
          - "every SiteAccessGrant with this prequalification_id and status GRANTED transitions to REVOKED with revocation_reason = PREQUAL_SUSPENDED and revoked_at = logical clock (processing order created_at ASC)"
          - "increments IncidentReport.triggered_suspension_count by 1"
          - "recomputes Contractor.open_deficiency_count"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "system: cascade from POST /incident-reports when Contractor.incident_review_flag flips false -> true"
        actor: system
        preconditions:
          - "Contractor.incident_review_flag == true after the report was filed"
        side_effects:
          - "identical to APPROVED -> SUSPENDED, plus conditional_expires_at is preserved unchanged"
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "system: cascade from POST /incident-reports/{id}/close-review"
        actor: system
        preconditions:
          - "Contractor.incident_review_flag == false after the closure (no other OPEN report of severity LOST_TIME or FATALITY remains)"
        side_effects:
          - "grade = null, final_composite_score = null, effective_thresholds = null, deficiency_codes = [], conditional_expires_at = null, expires_at = null"
          - "recomputes Contractor.open_deficiency_count"
        note: "Cycle: the row must be re-graded; the incident now participates in calculations.effective_client_threshold_resolution step 1."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: cascade from POST /clients/{id}/requalification-runs, or SUPERSEDE from POST /prequalifications"
        actor: system
        preconditions:
          - "logical clock >= expires_at, OR a newer cycle_year Prequalification for the same (contractor_id, client_id) was just created"
        side_effects:
          - "every SiteAccessGrant with this prequalification_id and status GRANTED transitions to REVOKED with revocation_reason = PREQUAL_EXPIRED and revoked_at = logical clock (processing order created_at ASC), decrementing Site.granted_worker_count and recomputing Site.access_gate_status"
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row (becomes DEFICIENT)"
      - from: CONDITIONAL
        to: EXPIRED
        trigger: "system: cascade from POST /clients/{id}/requalification-runs, or SUPERSEDE from POST /prequalifications"
        actor: system
        preconditions:
          - "logical clock >= expires_at and logical clock < conditional_expires_at, OR a newer cycle_year Prequalification was just created"
        side_effects:
          - "identical to APPROVED -> EXPIRED, plus recomputes Contractor.open_deficiency_count (the row leaves CONDITIONAL so its codes stop counting)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: cascade from POST /clients/{id}/requalification-runs, or SUPERSEDE from POST /prequalifications"
        actor: system
        preconditions:
          - "logical clock >= expires_at, OR a newer cycle_year Prequalification was just created"
        side_effects:
          - "recomputes flow_down_status on every ACTIVE SubcontractorLink whose prequalification_id is this row (becomes DEFICIENT)"
        note: "All GRANTED grants were already revoked when the row entered SUSPENDED."

  - entity: Prequalification
    dimension: audit_state
    note: |
      SECOND PARALLEL DIMENSION on the Prequalification row. `audit_state` is independent of
      `status`: an APPROVED row and a CONDITIONAL row are equally drawable, and an audit outcome
      never moves `status`. A row that leaves {APPROVED, CONDITIONAL} keeps whatever audit_state
      it had, and is never drawn again because the draw filter requires NOT_SELECTED.
    initial_state: NOT_SELECTED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: NOT_SELECTED
        to: SELECTED
        trigger: "system: drawn by POST /clients/{id}/audit-sampling-runs"
        actor: ClientSafetyManager
        preconditions:
          - "status in {APPROVED, CONDITIONAL} and audit_state == NOT_SELECTED (rows failing this are simply not drawn; no error)"
        side_effects:
          - "audit_selected_at = logical clock"
      - from: SELECTED
        to: PASSED
        trigger: "POST /prequalifications/{id}/audit-findings with findings_count == 0"
        actor: ClientSafetyManager
        preconditions:
          - "audit_state == SELECTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "audit_findings_count = 0"
      - from: SELECTED
        to: FAILED
        trigger: "POST /prequalifications/{id}/audit-findings with findings_count >= 1"
        actor: ClientSafetyManager
        preconditions:
          - "audit_state == SELECTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "audit_findings_count = findings_count"
          - "AUDIT_SAMPLING is appended to Prequalification.deficiency_codes if absent, which recomputes Contractor.open_deficiency_count (CONSERVED QUANTITY Q2)"
          - "status is NOT changed; a failed audit is cured through an improvement plan or the next requalification run"

  - entity: SafetyStatistic
    note: "Verification of this child row is the first parallel review dimension feeding Prequalification."
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /prequalifications/{id}/safety-statistics"
        actor: ContractorAdmin
        preconditions:
          - "Prequalification.status == DRAFT (else ERR_TRANSITION_NOT_ALLOWED)"
          - "reporting_year within [logical_clock_year - 3, logical_clock_year] (else ERR_REPORTING_YEAR_OUT_OF_WINDOW)"
          - "no SafetyStatistic on this prequalification with the same reporting_year and verification_status in {PENDING, VERIFIED} (else ERR_DUPLICATE_REPORTING_YEAR)"
          - "dart_cases <= recordable_incidents AND fatalities <= recordable_incidents AND (hours_worked > 0 OR recordable_incidents == 0) (else ERR_STATISTICS_INCONSISTENT)"
        side_effects:
          - "trir, dart_rate, citation_points computed per calculations.metric_normalization step 1 and calculations.citation_points"
          - "Prequalification.statistics_verification_status recomputed (NOT_SUBMITTED -> PENDING)"
      - from: PENDING
        to: VERIFIED
        trigger: "POST /safety-statistics/{id}/verify with decision VERIFY"
        actor: VerificationAnalyst
        preconditions:
          - "verification_status == PENDING (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "verified_by_user_id = X-User-ID, verified_at = logical clock"
          - "Prequalification.statistics_verification_status recomputed -> VERIFIED"
          - "if Prequalification.status == SUBMITTED and document_review_status == COMPLETE, the SUBMITTED -> UNDER_REVIEW join fires in this request"
      - from: PENDING
        to: REJECTED
        trigger: "POST /safety-statistics/{id}/verify with decision REJECT"
        actor: VerificationAnalyst
        preconditions:
          - "verification_status == PENDING (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "verified_by_user_id = X-User-ID, verified_at = logical clock"
          - "Prequalification.statistics_verification_status recomputed (REJECTED when no PENDING or VERIFIED row remains)"
          - "the reporting_year is released: a replacement SafetyStatistic for the same year may be created while Prequalification.status == DRAFT"

  - entity: WrittenProgram
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, WAIVED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /prequalifications/{id}/written-programs"
        actor: ContractorAdmin
        preconditions:
          - "Prequalification.status in {DRAFT, SUBMITTED} (else ERR_TRANSITION_NOT_ALLOWED)"
          - "no WrittenProgram with the same program_type on this prequalification (else ERR_TRANSITION_NOT_ALLOWED)"
          - "revision_date <= logical clock (else ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "is_required computed from calculations.required_program_set"
          - "Prequalification.document_review_status recomputed"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /written-programs/{id}/review with decision ACCEPT"
        actor: ClientSafetyManager
        preconditions:
          - "review_status == SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "reviewer_note, reviewed_by_user_id written"
          - "Prequalification.document_review_status recomputed; if it becomes COMPLETE and status == SUBMITTED and statistics_verification_status == VERIFIED, the SUBMITTED -> UNDER_REVIEW join fires in this request"
      - from: SUBMITTED
        to: WAIVED
        trigger: "POST /written-programs/{id}/review with decision WAIVE"
        actor: ClientSafetyManager
        preconditions:
          - "review_status == SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "identical to SUBMITTED -> ACCEPTED; WAIVED counts as satisfied for document_review_status"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /written-programs/{id}/review with decision DEFICIENT"
        actor: ClientSafetyManager
        preconditions:
          - "review_status == SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "reviewer_note, reviewed_by_user_id written"
          - "Prequalification.document_review_status recomputed -> DEFICIENT when the row is_required"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /written-programs/{id}/resubmit"
        actor: ContractorAdmin
        preconditions:
          - "review_status == DEFICIENT (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "document_ref and revision_date replaced, reviewer_note cleared, reviewed_by_user_id cleared"
          - "Prequalification.document_review_status recomputed (DEFICIENT -> IN_PROGRESS)"
        note: "Revision loop: a deficient document can be re-tendered without creating a duplicate program_type row."

  - entity: ImprovementPlan
    initial_state: OPEN
    terminal_states: [ACCEPTED, OVERDUE]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /prequalifications/{id}/improvement-plans"
        actor: ClientSafetyManager
        preconditions:
          - "Prequalification.status == CONDITIONAL (else ERR_TRANSITION_NOT_ALLOWED)"
          - "payload expected_prequalification_version == Prequalification.version (else ERR_STALE_VERSION)"
          - "due_date > logical clock and due_date <= Prequalification.conditional_expires_at (else ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "deficiency_codes = snapshot of Prequalification.deficiency_codes"
          - "SUPERSEDE: any existing ImprovementPlan on this prequalification with status in {OPEN, SUBMITTED} transitions to REJECTED with closed_at = logical clock"
          - "increments Prequalification.version by 1"
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /improvement-plans/{id}/submit"
        actor: ContractorAdmin
        preconditions:
          - "status == OPEN (else ERR_TRANSITION_NOT_ALLOWED)"
          - "logical clock < due_date (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "evidence_ref written"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /improvement-plans/{id}/decision with decision ACCEPT"
        actor: ClientSafetyManager
        preconditions:
          - "status == SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "closed_at = logical clock, decided_by_user_id = X-User-ID"
          - "this closure carries Prequalification CONDITIONAL -> UNDER_REVIEW (see that transition), which in turn recomputes SubcontractorLink.flow_down_status"
      - from: SUBMITTED
        to: OPEN
        trigger: "POST /improvement-plans/{id}/decision with decision REJECT"
        actor: ClientSafetyManager
        preconditions:
          - "status == SUBMITTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "decided_by_user_id = X-User-ID, evidence_ref cleared; Prequalification is untouched and stays CONDITIONAL"
        note: "Revert loop: the contractor may submit fresh evidence until due_date."
      - from: OPEN
        to: OVERDUE
        trigger: "system: cascade from POST /clients/{id}/requalification-runs"
        actor: system
        preconditions:
          - "logical clock >= Prequalification.conditional_expires_at"
        side_effects:
          - "closed_at = logical clock; this transition carries Prequalification CONDITIONAL -> REJECTED"
      - from: SUBMITTED
        to: OVERDUE
        trigger: "system: cascade from POST /clients/{id}/requalification-runs"
        actor: system
        preconditions:
          - "logical clock >= Prequalification.conditional_expires_at"
        side_effects:
          - "closed_at = logical clock; this transition carries Prequalification CONDITIONAL -> REJECTED"

  - entity: InsuranceCertificate
    initial_state: PENDING
    terminal_states: [REJECTED]
    note: |
      PARALLEL DIMENSIONS on one row. Dimension 1 `verification_status` (PENDING -> VERIFIED |
      REJECTED) is moved only by a VerificationAnalyst decision. Dimension 2 `lifecycle_status`
      (NOT_YET_EFFECTIVE | CURRENT | EXPIRING_SOON | LAPSED | SUPERSEDED) is moved only by the
      logical clock through a materialization point. The two never gate each other: a PENDING
      certificate can reach LAPSED, and a VERIFIED certificate stays VERIFIED after it LAPSES.
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /contractors/{id}/insurance-certificates"
        actor: ContractorAdmin
        preconditions:
          - "expiration_date > effective_date (else ERR_INVALID_FIELD_VALUE)"
          - "aggregate_limit >= each_occurrence_limit (else ERR_INVALID_FIELD_VALUE)"
          - "no InsuranceCertificate for the same (contractor_id, coverage_type) with verification_status in {PENDING, VERIFIED} whose half-open interval [effective_date, expiration_date) intersects the new one (else ERR_COVERAGE_PERIOD_OVERLAP)"
        side_effects:
          - "verification_status = PENDING"
          - "lifecycle_status materialized per calculations.certificate_lifecycle_status"
          - "available_aggregate materialized per calculations.insurance_coverage_adequacy variant aggregate_depletion_basis"
          - "every InsuranceCertificate for the same (contractor_id, coverage_type) with verification_status == REJECTED whose interval intersects the new one gets lifecycle_status = SUPERSEDED"
          - "recomputes Contractor.verified_coverage_types"
      - from: PENDING
        to: VERIFIED
        trigger: "POST /insurance-certificates/{id}/verify with decision VERIFY"
        actor: VerificationAnalyst
        preconditions:
          - "verification_status == PENDING (else ERR_TRANSITION_NOT_ALLOWED)"
          - "no SafetyStatistic on any Prequalification of this contractor has verified_by_user_id == X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
          - "the certificate is adequate under calculations.insurance_coverage_adequacy variant per_occurrence_basis (else ERR_COVERAGE_LIMIT_INSUFFICIENT)"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "lifecycle_status re-materialized per calculations.certificate_lifecycle_status"
          - "available_aggregate re-materialized"
          - "recomputes Contractor.verified_coverage_types"
      - from: PENDING
        to: REJECTED
        trigger: "POST /insurance-certificates/{id}/verify with decision REJECT"
        actor: VerificationAnalyst
        preconditions:
          - "verification_status == PENDING (else ERR_TRANSITION_NOT_ALLOWED)"
          - "no SafetyStatistic on any Prequalification of this contractor has verified_by_user_id == X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "recomputes Contractor.verified_coverage_types (this coverage_type leaves the array)"
          - "the (contractor_id, coverage_type) interval is released, so an overlapping replacement certificate may be created"

  - entity: SiteAccessGrant
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: null
        to: GRANTED
        trigger: "POST /site-access-grants"
        actor: ContractorAdmin
        preconditions:
          - "Worker.contractor_id == Prequalification.contractor_id and Site.client_id == Prequalification.client_id (else ERR_INVALID_FIELD_VALUE)"
          - "Prequalification.status in {APPROVED, CONDITIONAL} (else ERR_PREQUAL_NOT_ACTIVE)"
          - "Site.access_gate_status != LOCKED (else ERR_SITE_GATE_LOCKED)"
          - "Site.required_hazard_classes is a subset of Contractor.hazard_profile (else ERR_HAZARD_PROFILE_MISMATCH)"
          - "the worker holds a current WorkerQualification for every code in calculations.worker_site_eligibility.required_codes (else ERR_WORKER_QUALIFICATION_EXPIRED)"
          - "no SiteAccessGrant for the same (worker_id, site_id) with status REVOKED has revoked_at plus ACCESS_COOLDOWN_HOURS strictly after the logical clock (else ERR_ACCESS_COOLDOWN_ACTIVE)"
          - "no SiteAccessGrant for the same (worker_id, site_id) with status GRANTED has a closed interval [granted_at, expires_at] intersecting the new closed interval [logical clock, expires_at] (else ERR_ACCESS_WINDOW_OVERLAP)"
          - "for every coverage_type in Client.required_coverage_types the contractor's VERIFIED certificate is adequate under calculations.insurance_coverage_adequacy variant aggregate_depletion_basis (else ERR_COVERAGE_LIMIT_INSUFFICIENT)"
          - "Prequalification.grade rank >= calculations.site_effective_min_grade rank (else ERR_GRADE_BELOW_SITE_MINIMUM)"
        side_effects:
          - "granted_at = logical clock, qualification_snapshot = calculations.worker_site_eligibility.required_codes"
          - "increments Site.granted_worker_count by 1 and recomputes Site.access_gate_status"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /site-access-grants/{id}/revoke, or system cascade from a Prequalification transition to SUSPENDED, REJECTED or EXPIRED"
        actor: ClientSafetyManager | system
        preconditions:
          - "status == GRANTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "revoked_at = logical clock; revocation_reason = CLIENT_REVOKED for the explicit endpoint, else PREQUAL_SUSPENDED / PREQUAL_REJECTED / PREQUAL_EXPIRED"
          - "decrements Site.granted_worker_count by 1 and recomputes Site.access_gate_status"
          - "starts the ACCESS_COOLDOWN_HOURS buffer for the (worker_id, site_id) pair"
      - from: GRANTED
        to: EXPIRED
        trigger: "system: cascade from POST /clients/{id}/requalification-runs"
        actor: system
        preconditions:
          - "logical clock > expires_at"
        side_effects:
          - "decrements Site.granted_worker_count by 1 and recomputes Site.access_gate_status"
          - "no cooldown buffer is started (revoked_at stays null)"

  - entity: IncidentReport
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /incident-reports"
        actor: ClientSafetyManager
        preconditions:
          - "occurred_at <= logical clock and occurred_at >= logical clock minus 365 days (else ERR_INVALID_FIELD_VALUE)"
          - "Site.client_id == X-User-ID (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "increments Contractor.open_severe_incident_count by 1 when severity in {RECORDABLE, LOST_TIME, FATALITY}, which re-materializes available_aggregate on every InsuranceCertificate of that contractor"
          - "sets Contractor.incident_review_flag = true when severity in {LOST_TIME, FATALITY}; that flip cascades every APPROVED or CONDITIONAL Prequalification of the contractor to SUSPENDED (processing order created_at ASC)"
          - "increments Contractor.version by 1"
          - "recomputes Site.access_gate_status"
      - from: OPEN
        to: CLOSED
        trigger: "POST /incident-reports/{id}/close-review"
        actor: ClientSafetyManager
        preconditions:
          - "review_status == OPEN (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "findings_note written, closed_at = logical clock"
          - "decrements Contractor.open_severe_incident_count when severity in {RECORDABLE, LOST_TIME, FATALITY}, re-materializing available_aggregate on every InsuranceCertificate of that contractor"
          - "recomputes Contractor.incident_review_flag; if it flips true -> false, every SUSPENDED Prequalification of the contractor transitions to UNDER_REVIEW (processing order created_at ASC)"
          - "increments Contractor.version by 1"
          - "recomputes Site.access_gate_status"
        note: "The closed report still counts in calculations.effective_client_threshold_resolution step 1 for 365 days."

  - entity: Variance
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /prequalifications/{id}/variances"
        actor: ContractorAdmin
        preconditions:
          - "Prequalification.status in {DRAFT, SUBMITTED, UNDER_REVIEW, CONDITIONAL} (else ERR_TRANSITION_NOT_ALLOWED)"
          - "no Variance on this prequalification with the same requirement_code and status in {REQUESTED, APPROVED} (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "status = REQUESTED; the request has no effect on grading until approved"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /variances/{id}/decision with decision APPROVE"
        actor: ClientSafetyManager
        preconditions:
          - "status == REQUESTED (else ERR_TRANSITION_NOT_ALLOWED)"
          - "expires_at supplied and strictly after the logical clock (else ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "expires_at and decided_by_user_id written; the variance now enters calculations.grading_decision as a suppressed breach while expires_at > logical clock"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /variances/{id}/decision with decision DENY"
        actor: ClientSafetyManager
        preconditions:
          - "status == REQUESTED (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "decided_by_user_id written, expires_at stays null; the requirement_code is released for a new request"

  - entity: SubcontractorLink
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /subcontractor-links"
        actor: ContractorAdmin
        preconditions:
          - "Prequalification.status in {APPROVED, CONDITIONAL} (else ERR_PREQUAL_NOT_ACTIVE)"
          - "parent_contractor_id != child_contractor_id and child_contractor_id is not an ancestor of parent_contractor_id in the ACTIVE edge set of this prequalification (else ERR_SUBCONTRACTOR_CYCLE)"
          - "computed depth <= Client.cascade_depth_limit (else ERR_CASCADE_DEPTH_EXCEEDED)"
          - "scope_of_work is a subset of the child contractor's scope_of_work (else ERR_INVALID_FIELD_VALUE)"
          - "the child contractor holds a VERIFIED InsuranceCertificate of coverage_type GL with freshly computed lifecycle_status in {CURRENT, EXPIRING_SOON} and each_occurrence_limit >= FLOW_DOWN_MIN_OCCURRENCE (else ERR_COVERAGE_LIMIT_INSUFFICIENT)"
        side_effects:
          - "depth computed per calculations.subcontractor_depth"
          - "flow_down_status computed per calculations.flow_down_status"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /subcontractor-links/{id}/terminate"
        actor: ContractorAdmin | ClientSafetyManager
        preconditions:
          - "status == ACTIVE (else ERR_TRANSITION_NOT_ALLOWED)"
          - "no ACTIVE SubcontractorLink has this link's child_contractor_id as its parent_contractor_id on the same prequalification (else ERR_TRANSITION_NOT_ALLOWED)"
        side_effects:
          - "status = TERMINATED; the edge leaves the cycle-detection and depth graphs"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: prequal-create-stale-contractor
    parent_entity: Contractor
    write_endpoint: "POST /prequalifications"
    occ_field: "expected_contractor_version"
    description: |
      Creating a Prequalification against a Contractor whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer has
      already created a newer-cycle Prequalification (which legitimately supersedes the prior
      APPROVED or CONDITIONAL row per the SUPERSEDE side effect) or filed an IncidentReport,
      so the current writer's view of the contractor is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: improvement-plan-create-stale-prequal
    parent_entity: Prequalification
    write_endpoint: "POST /prequalifications/{id}/improvement-plans"
    occ_field: "expected_prequalification_version"
    description: |
      Creating an ImprovementPlan against a Prequalification whose version has advanced since
      the manager last observed it is rejected. A plan create legitimately supersedes any OPEN
      or SUBMITTED plan on the row, so a writer holding a stale version would silently discard
      a plan it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: citation_points
    trigger: "POST /prequalifications/{id}/safety-statistics (write of SafetyStatistic.citation_points)"
    algorithm: aggregation
    formula: |
      citation_points = CITATION_WEIGHT_WILLFUL * citation_count_willful
                      + CITATION_WEIGHT_SERIOUS * citation_count_serious
                      + CITATION_WEIGHT_OTHER   * citation_count_other
      # integer arithmetic only; no rounding step exists.
    input_set: "the three citation counts on the SafetyStatistic row being created; no other row participates"
    constants:
      CITATION_WEIGHT_WILLFUL: 5
      CITATION_WEIGHT_SERIOUS: 2
      CITATION_WEIGHT_OTHER: 1
    precision: "exact integer"

  - name: metric_normalization
    trigger: "invoked by composite_prequalification_score on both the DRAFT -> SUBMITTED transition and every grading transition out of UNDER_REVIEW"
    algorithm: weighted_scoring
    formula: |
      # ---- STEP 1: raw metric values from the governing SafetyStatistic ------------------
      trir      = round_half_up(recordable_incidents * 200000 / hours_worked, 4)  if hours_worked > 0 else 0.0000
      dart_rate = round_half_up(dart_cases          * 200000 / hours_worked, 4)  if hours_worked > 0 else 0.0000
      emr       = SafetyStatistic.emr            # carrier-published, already 2 decimal places
      cit       = SafetyStatistic.citation_points  # integer

      # ---- STEP 2: per-metric sub-score against that metric's effective threshold -------
      def sub(v, thr):                      # thr > 0 always (Client constraints)
          if v <= thr:                      # INCLUSIVE at the threshold: v == thr scores exactly 50.00
              return round_half_up(100 - 50 * v / thr, 2)
          return max(0.00, round_half_up(50 - 50 * (v - thr) / thr, 2))

      sub_trir = sub(trir,      eff.max_trir)
      sub_dart = sub(dart_rate, eff.max_dart_rate)
      sub_emr  = sub(emr,       eff.max_emr)
      sub_cit  = sub(cit,       eff.max_citation_points)

      # ---- STEP 3: PINNED ROUNDING ORDER -----------------------------------------------
      # ROUND PER METRIC PRODUCT, THEN SUM. Each weighted product is rounded to 2 decimals
      # BEFORE it enters the sum, and the sum is rounded to 2 decimals afterwards. The
      # alternative order (sum the unrounded products, then round once) is FORBIDDEN and
      # produces a different cent: e.g. sub = (66.67, 66.67, 52.50, 66.67) with weights
      # (0.40, 0.25, 0.25, 0.10) yields 63.14 under the pinned order and 63.13 under
      # sum-then-round.
      p_trir = round_half_up(sub_trir * weight_trir,     2)
      p_dart = round_half_up(sub_dart * weight_dart,     2)
      p_emr  = round_half_up(sub_emr  * weight_emr,      2)
      p_cit  = round_half_up(sub_cit  * weight_citation, 2)
      subtotal = round_half_up(p_trir + p_dart + p_emr + p_cit, 2)   # summation order is the fixed
                                                                     # metric order TRIR, DART, EMR,
                                                                     # CITATION_POINTS
      return { subtotal, sub_trir, sub_dart, sub_emr, sub_cit }
    input_set: |
      Exactly one SafetyStatistic row per evaluation - the GOVERNING statistic: the row on this
      Prequalification with the greatest reporting_year among rows whose verification_status is in
      the variant's admitted set (provisional admits {PENDING, VERIFIED}, final admits {VERIFIED}
      only). reporting_year is unique within the admitted set, so no tie-break is reachable; if
      two rows ever shared a reporting_year the earlier created_at wins.
    constants:
      HOURS_BASIS: 200000
    precision: "raw metrics 4 decimal places round_half_up; sub-scores, products and subtotal 2 decimal places round_half_up"

  - name: effective_client_threshold_resolution
    trigger: "invoked once at the start of POST /prequalifications/{id}/submit (tightening forced to 1.00) and once at the start of POST /prequalifications/{id}/grade (full resolution)"
    algorithm: constraint_propagation
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED.
      # The incident set in step 1 is scoped to sites the contractor has actually been badged
      # into through a Prequalification of THIS client - and those grants only exist because a
      # Prequalification was APPROVED or CONDITIONAL. Grading mutates that very status. The
      # evaluation order below is therefore NORMATIVE: steps 1-4 are computed EXACTLY ONCE,
      # against the PRE-TRANSITION snapshot (this row is still UNDER_REVIEW while step 1 runs),
      # and MUST NOT be re-evaluated after the status/grade write in step 5.

      # ---- STEP 1: client-scoped incident severity snapshot ----------------------------
      badged_site_ids = { g.site_id
                          for g in SiteAccessGrant                      # ANY status: GRANTED, REVOKED, EXPIRED
                          if g.prequalification_id in { p.id for p in Prequalification
                                                        if p.contractor_id == this.contractor_id
                                                        and p.client_id    == this.client_id } }
      incidents = [ i for i in IncidentReport
                    if i.contractor_id == this.contractor_id            # review_status OPEN or CLOSED both count
                    and i.site_id in badged_site_ids
                    and i.occurred_at >= logical_clock - INCIDENT_LOOKBACK_DAYS days   # inclusive
                    and i.occurred_at <= logical_clock ]                                # inclusive
      severity_snapshot = max(SEVERITY_RANK[i.severity] for i in incidents) if incidents else 0

      # ---- STEP 2: hazard tier ---------------------------------------------------------
      base_tier   = 2 if len(set(contractor.hazard_profile) & set(HIGH_HAZARD_CLASSES)) >= 1 else 1
      hazard_tier = min(3, base_tier + 1) if severity_snapshot >= TIER_ESCALATION_MIN_RANK else base_tier

      # ---- STEP 3: tightening ----------------------------------------------------------
      tightening = 1.00 if variant == "provisional" else TIER_TIGHTENING[hazard_tier]
      eff.max_trir            = round_half_up(client.max_trir            * tightening, 4)
      eff.max_dart_rate       = round_half_up(client.max_dart_rate       * tightening, 4)
      eff.max_emr             = round_half_up(client.max_emr             * tightening, 4)
      eff.max_citation_points = round_half_up(client.max_citation_points * tightening, 4)

      # ---- STEP 4: variance overlay (final variant ONLY) -------------------------------
      # provisional IGNORES variances entirely.
      if variant == "final":
          for v in Variance where v.prequalification_id == this.id
                              and v.status == APPROVED
                              and v.expires_at > logical_clock          # strict; expired variances are excluded
                              and v.requirement_code in {TRIR, DART, EMR, CITATION_POINTS}:
              eff[METRIC_FIELD[v.requirement_code]] = max(eff[METRIC_FIELD[v.requirement_code]],
                                                          round_half_up(v.requested_value, 4))
          # at most one APPROVED variance per requirement_code exists (uniqueness constraint),
          # so the loop is order-independent.

      # ---- STEP 5: consumers -----------------------------------------------------------
      # metric_normalization, then grade_band_assignment, then grading_decision, then the
      # status write. Nothing after step 4 may feed back into steps 1-3.
      return { eff, hazard_tier, tightening, severity_snapshot }
    input_set: "IncidentReport rows of this contractor at badged sites of this client within the trailing 365 days, both review_status values included; APPROVED unexpired Variance rows of this prequalification"
    constants:
      HIGH_HAZARD_CLASSES: [HEIGHTS, CONFINED_SPACE, ELECTRICAL, HOT_WORK, EXCAVATION]
      SEVERITY_RANK: { FIRST_AID: 1, RECORDABLE: 2, LOST_TIME: 3, FATALITY: 4 }
      TIER_ESCALATION_MIN_RANK: 3
      TIER_TIGHTENING: { 1: 1.00, 2: 0.85, 3: 0.70 }
      INCIDENT_LOOKBACK_DAYS: 365
      METRIC_FIELD: { TRIR: max_trir, DART: max_dart_rate, EMR: max_emr, CITATION_POINTS: max_citation_points }
    precision: "effective thresholds 4 decimal places round_half_up"

  - name: composite_prequalification_score
    trigger: "DRAFT -> SUBMITTED writes provisional_composite_score; every grading transition out of UNDER_REVIEW writes final_composite_score"
    algorithm: weighted_scoring
    formula: |
      eff      = effective_client_threshold_resolution(variant)
      governing = the governing SafetyStatistic for this variant's admitted verification set
      return metric_normalization(governing, eff, client weights).subtotal
    input_set: "one Prequalification, its governing SafetyStatistic, its Client's weights and thresholds, and (final variant only) its APPROVED unexpired Variance rows"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "evaluated by POST /prequalifications/{id}/submit, written to provisional_composite_score"
        difference: |
          Admits the governing statistic from verification_status in {PENDING, VERIFIED}, forces
          tightening = 1.00 (the client's PUBLISHED thresholds, no hazard-tier tightening), and
          ignores Variance rows entirely. Never writes grade or deficiency_codes.
      - name: final
        when: "evaluated by POST /prequalifications/{id}/grade, written to final_composite_score"
        difference: |
          Admits the governing statistic from verification_status == VERIFIED only, applies
          TIER_TIGHTENING[hazard_tier] including the severity escalation of step 1-2, and overlays
          APPROVED unexpired variances. For identical stored data the two variants therefore
          diverge whenever hazard_tier > 1 or a variance is active: a tier-2 contractor whose
          governing statistic is (hours 500000, recordable 2, dart 1, emr 0.80, citation_points 1)
          against the default client scores 80.51 provisional and 77.06 final.

  - name: grade_band_assignment
    trigger: "every grading transition out of UNDER_REVIEW (writes Prequalification.grade)"
    algorithm: threshold
    formula: |
      c = final_composite_score            # already rounded to 2 decimals
      if client.grading_policy == "BALANCED":
          grade = "A" if c >= 85.00 else "B" if c >= 70.00 else "C" if c >= 55.00 else "F"
      else:  # STRICT
          grade = "A" if c >= 90.00 else "B" if c >= 78.00 else "C" if c >= 66.00 else "F"
      # every comparison is >= (inclusive at the band floor); a score exactly on a floor takes
      # the HIGHER letter.
    input_set: "the final_composite_score just computed and the Client.grading_policy enum"
    constants:
      BALANCED_BANDS: { A: 85.00, B: 70.00, C: 55.00 }
      STRICT_BANDS: { A: 90.00, B: 78.00, C: 66.00 }
      GRADE_RANK: { F: 0, C: 1, B: 2, A: 3 }
    precision: "comparisons on 2-decimal values; no further rounding"

  - name: grading_decision
    trigger: "POST /prequalifications/{id}/grade — selects which of the three UNDER_REVIEW transitions fires"
    algorithm: threshold
    formula: |
      eff  = effective_client_threshold_resolution("final")     # variance-overlaid
      band = 1 + client.conditional_band_pct / 100
      value = { TRIR: trir, DART: dart_rate, EMR: emr, CITATION_POINTS: citation_points }

      hard = [ m for m in METRIC_ORDER if value[m] >  round_half_up(eff[m] * band, 4) ]
      soft = [ m for m in METRIC_ORDER if eff[m] < value[m] <= round_half_up(eff[m] * band, 4) ]
      # both comparisons against eff[m] itself are STRICT: value == eff[m] is NOT a breach.

      grade = grade_band_assignment(final_composite_score)
      if hard or grade == "F":
          outcome          = "REJECTED"
          deficiency_codes = [m for m in METRIC_ORDER if m in hard or m in soft] + (["COMPOSITE_F"] if grade == "F" else [])
      elif soft or grade == "C":
          outcome          = "CONDITIONAL"
          deficiency_codes = list(soft) + (["COMPOSITE_C"] if grade == "C" else [])
      else:
          outcome          = "APPROVED"
          deficiency_codes = []
      # METRIC_ORDER is the emission order of deficiency_codes; COMPOSITE_* is always last.
    input_set: "the governing VERIFIED SafetyStatistic, the variance-overlaid effective thresholds, and the freshly computed final_composite_score"
    constants:
      METRIC_ORDER: [TRIR, DART, EMR, CITATION_POINTS]
    precision: "band ceiling rounded to 4 decimal places round_half_up before comparison"

  - name: insurance_coverage_adequacy
    trigger: "POST /insurance-certificates/{id}/verify (per_occurrence_basis); every grading transition out of UNDER_REVIEW and POST /site-access-grants (aggregate_depletion_basis)"
    algorithm: threshold
    formula: |
      mult = TIER_COVERAGE_MULTIPLIER[contractor.base_hazard_tier]
      # variant per_occurrence_basis
      adequate = cert.each_occurrence_limit >= round_half_up(REQUIRED_OCCURRENCE[cert.coverage_type] * mult, 0)
      # variant aggregate_depletion_basis
      available_aggregate = cert.aggregate_limit - DEPLETION_PER_OPEN_INCIDENT * contractor.open_severe_incident_count
      adequate = available_aggregate >= round_half_up(REQUIRED_AGGREGATE[cert.coverage_type] * mult, 0)
      # both comparisons are >= (a limit exactly equal to the requirement is adequate).
    input_set: |
      One InsuranceCertificate row plus Contractor.base_hazard_tier and
      Contractor.open_severe_incident_count (IncidentReport rows with review_status OPEN and
      severity in {RECORDABLE, LOST_TIME, FATALITY}). available_aggregate has a floor of nothing:
      it may go negative, and a negative value is simply inadequate.
    constants:
      REQUIRED_OCCURRENCE: { GL: 1000000, WC: 500000, AUTO: 1000000, UMBRELLA: 2000000 }
      REQUIRED_AGGREGATE: { GL: 2000000, WC: 1000000, AUTO: 1000000, UMBRELLA: 4000000 }
      TIER_COVERAGE_MULTIPLIER: { 1: 1.0, 2: 1.5 }
      DEPLETION_PER_OPEN_INCIDENT: 250000
      FLOW_DOWN_MIN_OCCURRENCE: 500000
    precision: "whole US dollars; requirement products rounded to 0 decimal places round_half_up"
    variants:
      - name: per_occurrence_basis
        when: "certificate verification (POST /insurance-certificates/{id}/verify)"
        difference: |
          Judges the certificate on each_occurrence_limit against REQUIRED_OCCURRENCE and ignores
          incident depletion completely. A GL certificate with each_occurrence_limit 1000000 and
          aggregate_limit 2000000 held by a base-tier-1 contractor is ADEQUATE here.
      - name: aggregate_depletion_basis
        when: "prequalification grading and site-access-grant creation"
        difference: |
          Judges the SAME certificate on aggregate_limit minus 250000 per open severe incident,
          against REQUIRED_AGGREGATE. The certificate above becomes INADEQUATE the moment the
          contractor has one open RECORDABLE incident: available_aggregate 1750000 < 2000000,
          so ERR_COVERAGE_LIMIT_INSUFFICIENT fires at grant time even though verification passed.

  - name: certificate_lifecycle_status
    trigger: "materialized on POST /contractors/{id}/insurance-certificates, POST /insurance-certificates/{id}/verify and POST /clients/{id}/requalification-runs; recomputed FRESH (not read) by every gating validation"
    algorithm: threshold
    formula: |
      if cert.verification_status == REJECTED and a later overlapping certificate exists:
          return "SUPERSEDED"                       # written only by the overlap side effect
      if logical_clock <  cert.effective_date:  return "NOT_YET_EFFECTIVE"
      if logical_clock >= cert.expiration_date: return "LAPSED"        # half-open interval
      days_to_expiry = floor((cert.expiration_date - logical_clock) / 86400 seconds)
      if days_to_expiry <= EXPIRING_SOON_DAYS:  return "EXPIRING_SOON" # INCLUSIVE at 30 days
      return "CURRENT"
    input_set: |
      One InsuranceCertificate row and the logical clock. MATERIALIZATION vs FRESH READ is
      normative: the stored lifecycle_status is refreshed only at the three materialization points
      above, so after a bare clock advance the stored value is deliberately stale; every gating
      validation (grading coverage check, site-access coverage check, subcontractor flow-down
      check, Contractor.verified_coverage_types) MUST recompute this function against the current
      logical clock instead of trusting the stored field.
    constants:
      EXPIRING_SOON_DAYS: 30
    precision: "whole days, floor division"

  - name: required_program_set
    trigger: "POST /prequalifications/{id}/submit precondition, WrittenProgram.is_required, and Prequalification.document_review_status recomputation"
    algorithm: aggregation
    formula: |
      required = union( PROGRAM_REQUIREMENT_MAP[h] for h in contractor.hazard_profile )
      is_required(wp) = wp.program_type in required
      document_review_status =
          "DEFICIENT"   if any wp with wp.program_type in required and wp.review_status == "DEFICIENT"
          "COMPLETE"    elif required is a subset of { wp.program_type : wp.review_status in {ACCEPTED, WAIVED} }
          "NOT_STARTED" elif prequalification.status == "DRAFT"
          "IN_PROGRESS" otherwise
    input_set: "the contractor's hazard_profile and every WrittenProgram row on the prequalification (no status filter on the row set itself)"
    constants:
      PROGRAM_REQUIREMENT_MAP:
        GENERAL: [HAZCOM, DISCIPLINE_POLICY]
        HEIGHTS: [FALL_PROTECTION]
        CONFINED_SPACE: [CONFINED_SPACE]
        ELECTRICAL: [LOTO]
        HOT_WORK: [HOT_WORK]
        EXCAVATION: [EXCAVATION]
    precision: "set membership, exact"

  - name: worker_site_eligibility
    trigger: "POST /site-access-grants precondition and SiteAccessGrant.qualification_snapshot"
    algorithm: aggregation
    formula: |
      required_codes = sorted( union( HAZARD_QUALIFICATION_MAP[h] for h in site.required_hazard_classes ) )
      current(q) = q.expiration_date > logical_clock          # STRICT: expiring exactly now is NOT current
      eligible   = every code in required_codes has some WorkerQualification q on this worker with
                   q.qualification_code == code and current(q)
      qualification_snapshot = required_codes                 # sorted ascending by enum name
    input_set: "every WorkerQualification row of the worker (the entity is immutable and append-only, so no status filter exists) and the site's required_hazard_classes"
    constants:
      HAZARD_QUALIFICATION_MAP:
        GENERAL: [OSHA10]
        HEIGHTS: [OSHA30, FALL_PROTECTION_COMPETENT]
        CONFINED_SPACE: [OSHA30, CONFINED_SPACE_ENTRANT]
        ELECTRICAL: [OSHA30, LOTO_AUTHORIZED]
        HOT_WORK: [OSHA10, HOT_WORK_PERMIT]
        EXCAVATION: [OSHA30, EXCAVATION_COMPETENT]
    precision: "set membership, exact; instant comparison at second granularity"

  - name: site_access_gate_status
    trigger: "recomputed on POST /incident-reports, POST /incident-reports/{id}/close-review, POST /site-access-grants and every SiteAccessGrant departure from GRANTED"
    algorithm: aggregation
    formula: |
      open_here = [ i for i in IncidentReport if i.site_id == site.id and i.review_status == "OPEN" ]
      if any i in open_here with i.severity in {LOST_TIME, FATALITY}: return "LOCKED"
      if any i in open_here with i.severity == "RECORDABLE":          return "RESTRICTED"
      return "OPEN"
      # FIRST_AID incidents never change the posture.
    input_set: "IncidentReport rows on this site with review_status == OPEN; all contractors count, not only the one being badged"
    constants: {}
    precision: "enum, exact"

  - name: site_effective_min_grade
    trigger: "POST /site-access-grants precondition"
    algorithm: threshold
    formula: |
      base = GRADE_RANK[site.min_grade]
      effective_rank = min(3, base + 1) if site.access_gate_status == "RESTRICTED" else base
      # LOCKED never reaches this function: the gate check rejects first with ERR_SITE_GATE_LOCKED.
      allowed = GRADE_RANK[prequalification.grade] >= effective_rank
    input_set: "the site's min_grade and freshly recomputed access_gate_status, and the prequalification's stored grade"
    constants:
      GRADE_RANK: { F: 0, C: 1, B: 2, A: 3 }
    precision: "integer rank comparison"

  - name: site_granted_worker_count
    trigger: "SiteAccessGrant creation, revocation and expiry (CONSERVED QUANTITY Q1)"
    algorithm: aggregation
    formula: |
      Site.granted_worker_count == count( g in SiteAccessGrant
                                          where g.site_id == Site.id and g.status == "GRANTED" )
      # INVARIANT: the materialized field equals this query after EVERY request. A grant followed
      # by its compensating revoke MUST return the field to its pre-grant value with zero drift;
      # a revoke never decrements below 0.
    input_set: "SiteAccessGrant rows on this site with status exactly GRANTED; REVOKED and EXPIRED rows are excluded"
    constants: {}
    precision: "exact integer"

  - name: contractor_open_deficiency_count
    trigger: "every grading transition, CONDITIONAL -> UNDER_REVIEW, CONDITIONAL -> REJECTED / EXPIRED, and Prequalification creation (CONSERVED QUANTITY Q2)"
    algorithm: aggregation
    formula: |
      Contractor.open_deficiency_count == sum( len(p.deficiency_codes)
                                               for p in Prequalification
                                               where p.contractor_id == Contractor.id
                                               and   p.status == "CONDITIONAL" )
      # INVARIANT: grading a row CONDITIONAL raises the counter by exactly len(deficiency_codes);
      # the compensating action (an ACCEPTED ImprovementPlan clearing the codes and returning the
      # row to UNDER_REVIEW) MUST return the counter to its pre-grading value with zero drift.
      # Only status == CONDITIONAL rows count: a SUSPENDED, EXPIRED or REJECTED row contributes 0
      # even while its deficiency_codes array is still populated.
    input_set: "Prequalification rows of this contractor with status exactly CONDITIONAL, across all clients"
    constants: {}
    precision: "exact integer"

  - name: subcontractor_depth
    trigger: "POST /subcontractor-links (writes SubcontractorLink.depth) and the cycle precondition"
    algorithm: topological
    formula: |
      edges = { (l.parent_contractor_id, l.child_contractor_id)
                for l in SubcontractorLink
                where l.prequalification_id == payload.prequalification_id and l.status == "ACTIVE" }
      # cycle test: reject when child == parent, or when parent is reachable FROM child in `edges`
      # (a directed walk child -> ... -> parent would close a loop).
      # depth: 1 when parent_contractor_id == prequalification.contractor_id, else
      #        1 + depth of the unique ACTIVE edge whose child_contractor_id == parent_contractor_id.
      # The edge set is a forest rooted at the prime contractor, so that parent edge is unique;
      # if no such edge exists the request is rejected with ERR_SUBCONTRACTOR_CYCLE (the parent is
      # not connected to the prime chain).
      depth = 1 if parent == prequalification.contractor_id else 1 + parent_edge.depth
    input_set: "ACTIVE SubcontractorLink rows on the same prequalification_id; TERMINATED edges are excluded from both the cycle graph and the depth chain"
    constants: {}
    precision: "exact integer"

  - name: flow_down_status
    trigger: "POST /subcontractor-links, and recomputed on every Prequalification transition of the prime row"
    algorithm: aggregation
    formula: |
      child_rows = [ p for p in Prequalification
                     where p.contractor_id == link.child_contractor_id
                     and   p.client_id     == prime.client_id ]
      if prime.status in {REJECTED, EXPIRED, SUSPENDED}:                       return "DEFICIENT"
      if any p in child_rows with p.status in {APPROVED, CONDITIONAL}:          return "SATISFIED"
      if any p in child_rows with p.status in {DRAFT, SUBMITTED, UNDER_REVIEW}: return "PENDING"
      return "DEFICIENT"
      # evaluation order is top to bottom; the first matching clause wins.
    input_set: "the prime Prequalification's status and every Prequalification of the child contractor with the same client_id"
    constants: {}
    precision: "enum, exact"

  - name: requalification_expiry_dates
    trigger: "every grading transition out of UNDER_REVIEW"
    algorithm: interval_merge
    formula: |
      graded_at              = logical_clock
      expires_at             = graded_at plus client.requalification_interval_months calendar months
                               (same day-of-month; if the target month is shorter, the last day of
                               that month)
      conditional_expires_at = graded_at plus CONDITIONAL_CURE_DAYS days, ONLY when the outcome is
                               CONDITIONAL; null otherwise
      # Requalification run comparisons: EXPIRED when logical_clock >= expires_at (inclusive),
      # CONDITIONAL -> REJECTED when logical_clock >= conditional_expires_at (inclusive).
      # The conditional cure deadline is evaluated BEFORE the annual expiry within a run.
    input_set: "the logical clock at grading time and Client.requalification_interval_months"
    constants:
      CONDITIONAL_CURE_DAYS: 90
      ACCESS_COOLDOWN_HOURS: 24
    precision: "instants at second granularity, UTC"

  - name: audit_sample_selection
    trigger: "POST /clients/{id}/audit-sampling-runs"
    algorithm: waterfall_allocation
    formula: |
      # ---- eligibility filter (explicit, no fuzzy adjectives) --------------------------
      eligible = [ p for p in Prequalification
                   where p.client_id == client.id
                   and   p.status in {APPROVED, CONDITIONAL}
                   and   p.audit_state == "NOT_SELECTED" ]
      # ---- ranking expression ---------------------------------------------------------
      #   primary   : final_composite_score ASC  (weakest scores audited first)
      #   tie-break : created_at ASC             (never id; ids are random)
      ranked = sort(eligible, key=(p.final_composite_score, p.created_at))
      # ---- draw size ------------------------------------------------------------------
      n = ceil( client.audit_sample_rate_pct / 100 * len(eligible) )
      # ---- empty-pool fallback --------------------------------------------------------
      # len(eligible) == 0 -> n == 0 -> selected_count 0 and an empty id array, HTTP 200.
      # This is NOT an error condition.
      selected = ranked[0:n]
      for p in selected: p.audit_state = "SELECTED"; p.audit_selected_at = logical_clock
      return { selected_count: len(selected), selected_prequalification_ids: [p.id for p in selected] }
    input_set: "Prequalification rows of this client with status in {APPROVED, CONDITIONAL} and audit_state == NOT_SELECTED; SELECTED, PASSED and FAILED rows are never re-drawn"
    constants: {}
    precision: "draw size uses ceiling on the exact rational product; selected_prequalification_ids is emitted in ranked order"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in priority order; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body contains every required input field of the endpoint with the declared JSON type; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 4
    category: business_constraint
    check: "every supplied value satisfies its section 1.1 constraints - enum membership, numeric range, ISO 8601 format, array subset rules, Client weight sum exactly 1.00, expiration_date > effective_date, aggregate_limit >= each_occurrence_limit, list query limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST and PATCH endpoints and all list endpoints"
  - priority: 5
    category: existence
    check: "every path id resolves, validated left to right; the specific not-found error of the leftmost missing segment is returned (ERR_CLIENT_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_PREQUALIFICATION_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_INSURANCE_CERTIFICATE_NOT_FOUND, ERR_IMPROVEMENT_PLAN_NOT_FOUND, else ERR_RECORD_NOT_FOUND)"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "every foreign key in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "POST /prequalifications, POST /site-access-grants, POST /incident-reports, POST /subcontractor-links"
  - priority: 7
    category: auth
    check: "for entity_backed roles the acting X-User-ID owns the target subtree - ContractorAdmin's X-User-ID equals the Contractor.id reached through the target row, ClientSafetyManager's X-User-ID equals the Client.id reached through the target row"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include ContractorAdmin or ClientSafetyManager"
  - priority: 8
    category: business_safety
    check: "the acting VerificationAnalyst X-User-ID does not already appear as verified_by_user_id on any SafetyStatistic of any Prequalification of this certificate's contractor (independent verification)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /insurance-certificates/{id}/verify"
  - priority: 9
    category: state
    check: "expected_contractor_version equals Contractor.version / expected_prequalification_version equals Prequalification.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /prequalifications, POST /prequalifications/{id}/improvement-plans"
  - priority: 10
    category: state
    check: "the target row is in a state that declares this transition in section 1.2 (includes terminal-state lockdown and repeat-trigger idempotency rejection)"
    error_id: ERR_TRANSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 11
    category: state
    check: "the governing Contractor.status is ACTIVE"
    error_id: ERR_CONTRACTOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /prequalifications, POST /prequalifications/{id}/submit, POST /site-access-grants, POST /subcontractor-links"
  - priority: 12
    category: state
    check: "the referenced Prequalification.status is in {APPROVED, CONDITIONAL}"
    error_id: ERR_PREQUAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /site-access-grants, POST /subcontractor-links"
  - priority: 13
    category: state
    check: "Contractor.incident_review_flag is false"
    error_id: ERR_INCIDENT_REVIEW_ACTIVE
    http_status: 409
    applies_to: "POST /prequalifications/{id}/grade, POST /prequalifications/{id}/submit"
  - priority: 14
    category: state
    check: "a governing SafetyStatistic exists (statistics_verification_status is PENDING or VERIFIED)"
    error_id: ERR_STATISTICS_UNVERIFIED
    http_status: 409
    applies_to: "POST /prequalifications/{id}/submit"
  - priority: 15
    category: business_safety
    check: "every program_type in calculations.required_program_set has a WrittenProgram row on this prequalification"
    error_id: ERR_REQUIRED_PROGRAM_MISSING
    http_status: 422
    applies_to: "POST /prequalifications/{id}/submit"
  - priority: 16
    category: business_safety
    check: "the target Site's freshly recomputed access_gate_status is not LOCKED"
    error_id: ERR_SITE_GATE_LOCKED
    http_status: 409
    applies_to: "POST /site-access-grants"
  - priority: 17
    category: business_safety
    check: "Site.required_hazard_classes is a subset of the badged worker's Contractor.hazard_profile"
    error_id: ERR_HAZARD_PROFILE_MISMATCH
    http_status: 422
    applies_to: "POST /site-access-grants"
  - priority: 18
    category: business_safety
    check: "the worker holds a WorkerQualification with expiration_date strictly after the logical clock for every code in calculations.worker_site_eligibility.required_codes"
    error_id: ERR_WORKER_QUALIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /site-access-grants"
  - priority: 19
    category: business_safety
    check: "dart_cases <= recordable_incidents, fatalities <= recordable_incidents, and hours_worked > 0 whenever recordable_incidents > 0"
    error_id: ERR_STATISTICS_INCONSISTENT
    http_status: 422
    applies_to: "POST /prequalifications/{id}/safety-statistics"
  - priority: 20
    category: business_temporal
    check: "reporting_year is within [logical_clock_year - 3, logical_clock_year] inclusive"
    error_id: ERR_REPORTING_YEAR_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /prequalifications/{id}/safety-statistics"
  - priority: 21
    category: business_constraint
    check: "no SafetyStatistic with the same reporting_year and verification_status in {PENDING, VERIFIED} exists on this prequalification (REJECTED rows release the year)"
    error_id: ERR_DUPLICATE_REPORTING_YEAR
    http_status: 409
    applies_to: "POST /prequalifications/{id}/safety-statistics"
  - priority: 22
    category: business_constraint
    check: "no Prequalification exists for the same (contractor_id, client_id) with status in {DRAFT, SUBMITTED, UNDER_REVIEW}, and none exists for the same (contractor_id, client_id, cycle_year) with status in {APPROVED, CONDITIONAL, SUSPENDED}"
    error_id: ERR_DUPLICATE_PREQUALIFICATION
    http_status: 409
    applies_to: "POST /prequalifications"
  - priority: 23
    category: business_referential
    check: "the new edge keeps the prequalification's ACTIVE SubcontractorLink graph acyclic - child_contractor_id differs from parent_contractor_id and parent_contractor_id is not reachable from child_contractor_id; the parent must also be connected to the prime contractor"
    error_id: ERR_SUBCONTRACTOR_CYCLE
    http_status: 409
    applies_to: "POST /subcontractor-links"
  - priority: 24
    category: business_referential
    check: "calculations.subcontractor_depth result is <= Client.cascade_depth_limit"
    error_id: ERR_CASCADE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /subcontractor-links"
  - priority: 25
    category: business_temporal
    check: "the new certificate's half-open interval [effective_date, expiration_date) does not intersect any existing certificate for the same (contractor_id, coverage_type) with verification_status in {PENDING, VERIFIED}; touching endpoints (new.effective_date == old.expiration_date) do NOT intersect"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /contractors/{id}/insurance-certificates"
  - priority: 26
    category: business_temporal
    check: "no SiteAccessGrant for the same (worker_id, site_id) with status REVOKED has revoked_at plus ACCESS_COOLDOWN_HOURS strictly after the logical clock; a clock exactly at revoked_at plus 24h passes"
    error_id: ERR_ACCESS_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /site-access-grants"
  - priority: 27
    category: business_temporal
    check: "the new closed interval [logical clock, expires_at] does not intersect the closed interval [granted_at, expires_at] of any GRANTED SiteAccessGrant for the same (worker_id, site_id); touching endpoints DO intersect"
    error_id: ERR_ACCESS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /site-access-grants"
  - priority: 28
    category: business_referential
    check: "for every coverage_type in Client.required_coverage_types the contractor holds an InsuranceCertificate with verification_status VERIFIED whose FRESHLY computed lifecycle_status is CURRENT or EXPIRING_SOON"
    error_id: ERR_MISSING_VERIFIED_COVERAGE
    http_status: 409
    applies_to: "POST /prequalifications/{id}/grade, POST /site-access-grants"
  - priority: 29
    category: business_fiscal
    check: "the certificate limits clear calculations.insurance_coverage_adequacy - per_occurrence_basis at verification, aggregate_depletion_basis at grading and grant creation, for a subcontractor edge, the child contractor holds a VERIFIED InsuranceCertificate with coverage_type GL whose each_occurrence_limit >= FLOW_DOWN_MIN_OCCURRENCE and whose freshly computed lifecycle_status is CURRENT or EXPIRING_SOON"
    error_id: ERR_COVERAGE_LIMIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /insurance-certificates/{id}/verify, POST /prequalifications/{id}/grade, POST /site-access-grants, POST /subcontractor-links"
  - priority: 30
    category: business_fiscal
    check: "GRADE_RANK[Prequalification.grade] >= calculations.site_effective_min_grade rank"
    error_id: ERR_GRADE_BELOW_SITE_MINIMUM
    http_status: 422
    applies_to: "POST /site-access-grants"

# =============================================================================
# 1.5 API Endpoints
#   Read surface first, then the write / transition surface.
#   Every list endpoint accepts limit? (1..100, default 50) and offset? (default 0)
#   and returns the standard envelope with pagination populated.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: /clients/{id}
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: []
    output: Client
    side_effects: []
    notes: "Thresholds, weights and policy are public to contractors so a contractor can predict its own grade."
  - method: GET
    path: /clients/{id}/sites
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: ["limit?", "offset?"]
    output: Site[]
    side_effects: []
    notes: "granted_worker_count and access_gate_status are recomputed fresh on read; the stored values are reconciled by the write path."
  - method: GET
    path: /sites/{id}
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: []
    output: Site
    side_effects: []
    notes: "access_gate_status is recomputed from the current IncidentReport set on every read."
  - method: GET
    path: /contractors/{id}
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: []
    output: Contractor
    side_effects: []
    notes: "base_hazard_tier, incident_review_flag, open_severe_incident_count, open_deficiency_count and verified_coverage_types are the materialized values maintained by the write path."
  - method: GET
    path: /contractors/{id}/insurance-certificates
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: ["coverage_type?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []
    notes: "lifecycle_status is recomputed fresh against the logical clock on every read; available_aggregate is recomputed from open incidents."
  - method: GET
    path: /contractors/{id}/workers
    roles: [NetworkAdmin, ClientSafetyManager, VerificationAnalyst, ContractorAdmin]
    input: ["trade_code?", "limit?", "offset?"]
    output: Worker[]
    side_effects: []
    notes: "Worker is immutable and has no version field."
  - method: GET
