# =============================================================================
# Section 1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction guide against SCAFFOLD.yaml sections
# 1.1-1.7. Everything section 1.8 already covers is emitted as an
# excluded_because stub. All setup_api_calls chains replay cleanly from
# empty-DB against section 1.5 endpoints.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: scenario_creation_applies_system_defaults
        claim_type: creation
        grounds: [entities.StressScenario, "endpoints[POST /liquidity/stress-scenarios]"]
        distinguishing_aspect: "Create returns 201 with system fields: status ACTIVE, run_count 0, version 1, server-minted id and created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc_st: $.data.status, sc_rc: $.data.run_count, sc_v: $.data.version }
          assert:
            - "sc_st == ACTIVE"
            - "sc_rc == 0"
            - "sc_v == 1"
            - "response data contains non-empty id and created_at"

      - name: ewi_metric_defaults_applied
        claim_type: defaults
        grounds: [entities.EwiMetric.fields.min_reading_interval_hours, entities.EwiMetric.fields.current_band]
        distinguishing_aspect: "Omitting min_reading_interval_hours yields default 0; a fresh metric starts with current_band GREEN and last_reading_at null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000 }
              as: RiskOfficer
              captures: { m: $.data.id, m_int: $.data.min_reading_interval_hours, m_band: $.data.current_band }
            - call: "GET /liquidity/ewi-metrics/${m}"
              as: RiskOfficer
              captures: { g_band: $.data.current_band }
            - call: "GET /liquidity/ewi-metrics"
              as: TreasuryAnalyst
          assert:
            - "m_int == 0"
            - "m_band == GREEN"
            - "g_band == GREEN  (GET single agrees)"
            - "ewi-metrics list contains exactly 1 entry"

      - name: asset_haircut_computed_by_class
        claim_type: computed_fields
        grounds: [entities.LiquidAsset.fields.haircut_bps]
        distinguishing_aspect: "haircut_bps is computed from asset_class constants (LEVEL_2B -> 2500); the asset starts UNENCUMBERED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2B", reference: "B1", market_value_cents: 1000000 }
              as: TreasuryOps
              captures: { a_hc: $.data.haircut_bps, a_enc: $.data.encumbrance_status }
          assert:
            - "a_hc == 2500"
            - "a_enc == UNENCUMBERED"

      - name: get_breach_not_found_returns_error_envelope
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 with the error envelope shape (response_type error, data.error_id ERR_NOT_FOUND)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /liquidity/breaches/00000000-0000-0000-0000-000000000000"
              as: RiskOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "response_type == error and HTTP status 404"

      - name: asset_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.LiquidAsset.fields.asset_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "asset_class outside {LEVEL_1, LEVEL_2A, LEVEL_2B} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_3", reference: "X", market_value_cents: 1000 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: reading_append_only_without_version
        claim_type: immutability
        grounds: [entities.MetricReading]
        distinguishing_aspect: "MetricReading has common_fields false: the creation response carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["metric M (cadence 0)"]
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m: $.data.id }
          trigger:
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 100 }
              as: TreasuryAnalyst
              captures: { r_band: $.data.band }
          assert:
            - "r_band == GREEN"
            - "reading response data has id and created_at but no version and no updated_at keys"

      - name: scenario_list_paginates
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /liquidity/stress-scenarios]"]
        distinguishing_aspect: "List endpoint honors limit/offset: 3 scenarios with limit 2 return 2 entries with total_count 3 and has_more true."
        test_recipe:
          setup: ["three ACTIVE scenarios (one per tier)"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "B", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "M", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "S", tier: "SEVERE", deposit_runoff_pct: 25, wholesale_renewal_pct: 0, level2_addon_bps: 1000, horizon_days: 30 }
              as: RiskOfficer
          trigger:
            - call: "GET /liquidity/stress-scenarios"
              payload: { limit: 2, offset: 0 }
              as: TreasuryAnalyst
          assert:
            - "response data contains exactly 2 entries"
            - "pagination block reports total_count 3 and has_more true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: finalize_finalized_run_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ProjectionRun.DRAFT_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second finalize of an already-FINALIZED run fails with ERR_INVALID_STATE (idempotency guard); no fields change."
        test_recipe:
          setup: ["MODERATE scenario ACTIVE; one CONTRACTUAL run created with matching OCC version"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Mod", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
              captures: { sc: $.data.id, sc_v: $.data.version }
            - call: "POST /liquidity/stress-scenarios/${sc}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v}" }
              as: TreasuryAnalyst
              captures: { run: $.data.id }
          trigger:
            - call: "POST /liquidity/projection-runs/${run}/finalize"
              as: TreasuryAnalyst
              captures: { st1: $.data.status }
            - call: "POST /liquidity/projection-runs/${run}/finalize"
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "st1 == FINALIZED"
            - "err == ERR_INVALID_STATE"

      - name: completed_playbook_rejects_activation
        claim_type: terminal_lockdown
        grounds: [state_machines.ContingencyPlaybook, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: activate on a COMPLETED playbook fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "BASELINE scenario; line 100000000/10000 with LEVEL_1 asset 200000000 pledged (power 100000000)"
            - "Playbook target 60000000 min NORMAL with one LINE_DRAWDOWN action est 60000000 lag 0; TESTED -> APPROVED -> ACTIVATED; action executed and settled (lag 0 due immediately at default clock); playbook COMPLETED"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 60000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/playbook-actions/${act}/execute"
              as: TreasuryOps
            - call: "POST /liquidity/playbook-actions/${act}/settle"
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks/${pb}/complete"
              as: LiquidityCommittee
              captures: { pb_st: $.data.status }
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
              captures: { err: $.data.error_id }
          assert:
            - "pb_st == COMPLETED"
            - "err == ERR_INVALID_STATE"

      - name: remediated_breach_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.LimitBreach, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REMEDIATED is terminal: acknowledge on a remediated breach fails with ERR_INVALID_STATE. Chain also exercises auto-escalation (OPEN->ESCALATED on SEVERE entry) and the ESCALATED->REMEDIATED committee branch."
        test_recipe:
          setup:
            - "Metric M (amber 1000, red 5000, cadence 0); EWI_METRIC limit ABOVE 4000 on M"
            - "Reading 6000 -> RED band, breach created OPEN, READING_AUTO posture SEVERE auto-escalates it to ESCALATED"
            - "Corrective reading 500 -> band GREEN (current value 500 <= 4000)"
            - "Committee remediates the ESCALATED breach (acknowledged_by null so SoD is vacuous) -> REMEDIATED"
          setup_api_calls:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "M", name: "m", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 1000, red_threshold: 5000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { m: $.data.id }
            - call: "POST /liquidity/board-limits"
              payload: { subject: "EWI_METRIC", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD", ewi_metric_id: "${m}" }
              as: RiskOfficer
              captures: { lim: $.data.id }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 6000 }
              as: TreasuryAnalyst
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
              captures: { br: "$.data[0].id", br_st: "$.data[0].status" }
            - call: "POST /liquidity/ewi-metrics/${m}/readings"
              payload: { observed_at: "2026-08-02T00:00:00Z", value: 500 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/breaches/${br}/remediate"
              payload: { remediation_note: "metric back within limit" }
              as: LiquidityCommittee
              captures: { br_st2: $.data.status }
          trigger:
            - call: "POST /liquidity/breaches/${br}/acknowledge"
              as: RiskOfficer
              captures: { err: $.data.error_id }
            - call: "GET /liquidity/breaches/${br}"
              as: RiskOfficer
              captures: { br_final: $.data.status }
          assert:
            - "br_st == ESCALATED  (auto-escalated on SEVERE entry, never manually acknowledged)"
            - "br_st2 == REMEDIATED"
            - "err == ERR_INVALID_STATE"
            - "br_final == REMEDIATED  (failed acknowledge left state untouched)"

      - name: settle_before_lag_then_at_boundary
        claim_type: precondition_enforcement
        grounds: [state_machines.PlaybookAction.EXECUTING_to_SETTLED, "errors[ERR_SETTLEMENT_NOT_DUE]"]
        distinguishing_aspect: "Settlement timing: settle before executed_at + settlement_lag_days fails with ERR_SETTLEMENT_NOT_DUE; at exactly the boundary (logical clock advanced 2 days) it succeeds (>= pinned)."
        test_recipe:
          setup:
            - "ACTIVE playbook (line power 100000000) with one LINE_DRAWDOWN action est 1000000, settlement_lag_days 2; action EXECUTING (executed at default logical clock 2026-08-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 1000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 1000000, settlement_lag_days: 2, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/playbook-actions/${act}/execute"
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/playbook-actions/${act}/settle"
              as: TreasuryOps
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /liquidity/playbook-actions/${act}/settle"
              as: TreasuryOps
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SETTLEMENT_NOT_DUE  (clock 2026-08-01T00:00:00Z < executed_at + 2 days)"
            - "st == SETTLED  (clock exactly at executed_at + 2 days: >= boundary allowed)"

      - name: execute_with_unsettled_prerequisite_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PlaybookAction.READY_to_EXECUTING, "errors[ERR_PREREQUISITE_ACTION_INCOMPLETE]", entities.PlaybookAction.fields.prerequisite_action_id]
        distinguishing_aspect: "Self-referential DAG: executing action2 whose prerequisite action1 is not SETTLED fails with ERR_PREREQUISITE_ACTION_INCOMPLETE even though action2 is READY; after action1 settles, action2 executes."
        test_recipe:
          setup:
            - "ACTIVE playbook (line power 100000000): action1 LINE_DRAWDOWN est 30000000 seq 1 lag 0; action2 LINE_DRAWDOWN est 20000000 seq 2 with prerequisite_action_id = action1"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 50000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 30000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { a1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 2, estimated_proceeds_cents: 20000000, settlement_lag_days: 0, line_id: "${ln}", prerequisite_action_id: "${a1}" }
              as: TreasuryAnalyst
              captures: { a2: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
              captures: { ct: $.data.result }
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
          trigger:
            - call: "POST /liquidity/playbook-actions/${a2}/execute"
              as: TreasuryOps
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/playbook-actions/${a1}/execute"
              as: TreasuryOps
            - call: "POST /liquidity/playbook-actions/${a1}/settle"
              as: TreasuryOps
              captures: { a1_st: $.data.status }
            - call: "POST /liquidity/playbook-actions/${a2}/execute"
              as: TreasuryOps
              captures: { a2_st: $.data.status }
          assert:
            - "ct == PASSED  (per-line aggregate 50000000 <= power 100000000)"
            - "err == ERR_PREREQUISITE_ACTION_INCOMPLETE"
            - "a1_st == SETTLED"
            - "a2_st == EXECUTING  (prerequisite now SETTLED)"

      - name: stand_down_with_executing_action_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ContingencyPlaybook.EXECUTING_to_STOOD_DOWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Stand-down requires no EXECUTING actions: with one action in flight it fails with ERR_INVALID_STATE; after the action settles, stand-down succeeds and the playbook lands STOOD_DOWN."
        test_recipe:
          setup:
            - "ACTIVE playbook (line power 100000000) with one LINE_DRAWDOWN action est 1000000 lag 0; action EXECUTING"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 1000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 1000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
              captures: { act: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
            - call: "POST /liquidity/contingency-playbooks/${pb}/activate"
              as: LiquidityCommittee
            - call: "POST /liquidity/playbook-actions/${act}/execute"
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/stand-down"
              as: LiquidityCommittee
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/playbook-actions/${act}/settle"
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks/${pb}/stand-down"
              as: LiquidityCommittee
              captures: { pb_st: $.data.status }
          assert:
            - "err == ERR_INVALID_STATE  (action in EXECUTING blocks stand-down)"
            - "pb_st == STOOD_DOWN  (after settle, stand-down succeeds)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: capacity_test_failure_keeps_draft_with_inline_failures
        claim_type: correct_result
        grounds: [calculations.capacity_test, state_machines.ContingencyPlaybook.DRAFT_to_TESTED]
        distinguishing_aspect: "FAILED capacity test is data, not an error: result FAILED with per-action failure detail, and the playbook remains DRAFT."
        test_recipe:
          setup:
            - "BASELINE scenario; line 100000000/10000 with NO pledges (borrowing_power 0); playbook target 60000000 with one LINE_DRAWDOWN action est 60000000"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 60000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
              captures: { res: $.data.result, tot_est: $.data.total_estimated_cents, tot_real: $.data.total_realizable_cents }
            - call: "GET /liquidity/contingency-playbooks/${pb}"
              as: RiskOfficer
              captures: { pb_st: $.data.status }
          assert:
            - "res == FAILED"
            - "tot_est == 60000000 and tot_real == 0  (cap 0 because line power is 0)"
            - "pb_st == DRAFT  (no state change on FAILED)"

      - name: survival_days_limit_breach_on_finalize
        claim_type: input_set_filtering
        grounds: [calculations.projection_cash_flow, calculations.breach_detection, entities.LimitBreach.fields.source_type]
        distinguishing_aspect: "Finalize-time breach detection: a CONTRACTUAL run whose survival_days (5) violates a SURVIVAL_DAYS BELOW 10 limit creates a LimitBreach with source_type PROJECTION_FINALIZE and detected_value 5."
        test_recipe:
          setup:
            - "MODERATE scenario (runoff 10, renewal 50, addon 500, horizon 10); funding retail 1000000000, W1 600000000 day 5, W2 400000000 day 12; LEVEL_1 asset 500000000"
            - "BoardLimit SURVIVAL_DAYS BELOW_BREACHES limit_value 10"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Mod", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
              captures: { sc: $.data.id, sc_v: $.data.version }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailPool", channel: "RETAIL_DEPOSIT", balance_cents: 1000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 600000000, matures_in_days: 5 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W2", channel: "WHOLESALE_SECURED", balance_cents: 400000000, matures_in_days: 12 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "BUF", market_value_cents: 500000000 }
              as: TreasuryOps
            - call: "POST /liquidity/board-limits"
              payload: { subject: "SURVIVAL_DAYS", direction: "BELOW_BREACHES", limit_value: 10, severity: "REGULATORY" }
              as: RiskOfficer
              captures: { lim: $.data.id }
          trigger:
            - call: "POST /liquidity/stress-scenarios/${sc}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${sc_v}" }
              as: TreasuryAnalyst
              captures: { run: $.data.id }
            - call: "POST /liquidity/projection-runs/${run}/finalize"
              as: TreasuryAnalyst
              captures: { surv: $.data.survival_days }
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
              captures: { br_val: "$.data[0].detected_value", br_src: "$.data[0].source_type" }
          assert:
            - "surv == 5"
            - "br_val == 5 and br_src == PROJECTION_FINALIZE  (5 < 10 breaches the BELOW limit)"

      - name: intraday_out_of_order_and_breach_detection
        claim_type: correct_result
        grounds: [calculations.intraday_net_position, "errors[ERR_SNAPSHOT_OUT_OF_ORDER]"]
        distinguishing_aspect: "Chronological ingestion: a snapshot earlier than the day's latest is rejected; net_position_cents is computed server-side; a net of -100000000 against a -50000000 floor creates an INTRADAY_SNAPSHOT breach."
        test_recipe:
          setup: ["BoardLimit INTRADAY_NET_POSITION BELOW_BREACHES limit_value -50000000"]
          setup_api_calls:
            - call: "POST /liquidity/board-limits"
              payload: { subject: "INTRADAY_NET_POSITION", direction: "BELOW_BREACHES", limit_value: -50000000, severity: "BOARD" }
              as: RiskOfficer
              captures: { lim: $.data.id }
          trigger:
            - call: "POST /liquidity/intraday-snapshots"
              payload: { business_date: "2026-08-01", snapshot_at: "2026-08-01T09:00:00Z", opening_balance_cents: 100000000, payments_received_cents: 0, payments_sent_cents: 20000000 }
              as: TreasuryOps
              captures: { s1_net: $.data.net_position_cents }
            - call: "POST /liquidity/intraday-snapshots"
              payload: { business_date: "2026-08-01", snapshot_at: "2026-08-01T08:30:00Z", opening_balance_cents: 100000000, payments_received_cents: 0, payments_sent_cents: 10000000 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/intraday-snapshots"
              payload: { business_date: "2026-08-01", snapshot_at: "2026-08-01T12:00:00Z", opening_balance_cents: 100000000, payments_received_cents: 0, payments_sent_cents: 200000000 }
              as: TreasuryOps
              captures: { s3_net: $.data.net_position_cents }
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
              captures: { br_val: "$.data[0].detected_value", br_src: "$.data[0].source_type" }
            - call: "GET /liquidity/intraday-snapshots"
              payload: { business_date: "2026-08-01" }
              as: TreasuryOps
          assert:
            - "s1_net == 80000000  (100000000 + 0 - 20000000; no breach: 80000000 >= -50000000)"
            - "err == ERR_SNAPSHOT_OUT_OF_ORDER  (08:30 earlier than existing 09:00 for the same business_date)"
            - "s3_net == -100000000"
            - "br_val == -100000000 and br_src == INTRADAY_SNAPSHOT  (-100000000 < -50000000)"
            - "intraday-snapshots list for business_date 2026-08-01 contains exactly 2 entries (the rejected 08:30 snapshot was not persisted)"

      - name: top_counterparty_tiebreak_by_counterparty_name
        claim_type: correct_result
        grounds: [calculations.funding_concentration]
        distinguishing_aspect: "Aggregation tie-break determinism: two counterparties with equal shares (2500 bps each) resolve top_counterparty_name lexicographically (Alpha before Beta) — never by id."
        test_recipe:
          setup: ["Funding: Beta 1000000000 wholesale_unsecured, Alpha 1000000000 wholesale_secured, Retail 2000000000 retail; no limits"]
          setup_api_calls:
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "Beta", channel: "WHOLESALE_UNSECURED", balance_cents: 1000000000, matures_in_days: 5 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "Alpha", channel: "WHOLESALE_SECURED", balance_cents: 1000000000, matures_in_days: 6 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "Retail", channel: "RETAIL_DEPOSIT", balance_cents: 2000000000 }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { top_n: $.data.top_counterparty_name, top_bps: $.data.top_counterparty_bps, bc: $.data.breaches_created }
          assert:
            - "top_bps == 2500  (floor(1000000000*10000/4000000000))"
            - "top_n == Alpha  (lexicographic tie-break on counterparty_name)"
            - "bc == 0  (no limits configured)"

      - name: breach_dedupe_suppresses_duplicate_open_breach
        claim_type: correct_result
        grounds: [calculations.breach_detection]
        distinguishing_aspect: "Dedupe rule: a second evaluation with the same still-violated limit creates no new breach while one with status in {OPEN, ACKNOWLEDGED, ESCALATED} exists."
        test_recipe:
          setup: ["Limit WHOLESALE_RELIANCE_PCT ABOVE 4000; funding retail 6000000000 + wholesale 5000000000 (share 4545 bps); first evaluation already created one OPEN breach"]
          setup_api_calls:
            - call: "POST /liquidity/board-limits"
              payload: { subject: "WHOLESALE_RELIANCE_PCT", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD" }
              as: RiskOfficer
              captures: { lim: $.data.id }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailA", channel: "RETAIL_DEPOSIT", balance_cents: 6000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 4000000000, matures_in_days: 20 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W2", channel: "WHOLESALE_SECURED", balance_cents: 1000000000, matures_in_days: 8 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { ev1_bc: $.data.breaches_created }
          trigger:
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
              captures: { ev2_bc: $.data.breaches_created, ev2_wr: $.data.wholesale_reliance_bps }
            - call: "GET /liquidity/board-limits/${lim}"
              as: RiskOfficer
              captures: { lim_val: $.data.limit_value }
          assert:
            - "ev1_bc == 1"
            - "lim_val == 4000"
            - "ev2_bc == 0 and ev2_wr == 4545  (still breached, but the OPEN breach suppresses duplicates)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request without valid X-User-Role/X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "A", market_value_cents: 1000 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "request sent without auth headers yields err == ERR_UNAUTHENTICATED and HTTP 401"

      - name: reading_on_missing_metric_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Priority 3 existence: posting a reading under a non-existent metric id fails with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/ewi-metrics/00000000-0000-0000-0000-000000000000/readings"
              payload: { observed_at: "2026-08-01T00:00:00Z", value: 100 }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: threshold_config_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_THRESHOLD_CONFIG_INVALID]"]
        distinguishing_aspect: "Direction-dependent threshold ordering: ABOVE_BREACHES with red_threshold (4000) below amber_threshold (5000) is rejected with ERR_THRESHOLD_CONFIG_INVALID (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /liquidity/ewi-metrics"
              payload: { code: "BAD", name: "bad", unit: "PCT_BPS", direction: "ABOVE_BREACHES", amber_threshold: 5000, red_threshold: 4000, min_reading_interval_hours: 0 }
              as: RiskOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_THRESHOLD_CONFIG_INVALID"

      - name: remediate_while_still_breached_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_LIMIT_STILL_BREACHED]", state_machines.LimitBreach.ACKNOWLEDGED_to_REMEDIATED]
        distinguishing_aspect: "Remediation re-evaluates the subject at remediate time: wholesale share still 4545 bps above the 4000 limit -> ERR_LIMIT_STILL_BREACHED."
        test_recipe:
          setup:
            - "Limit WHOLESALE_RELIANCE_PCT ABOVE 4000; funding retail 6000000000 + wholesale 5000000000 (4545 bps); breach created and ACKNOWLEDGED by ro_1; funding NOT diluted"
          setup_api_calls:
            - call: "POST /liquidity/board-limits"
              payload: { subject: "WHOLESALE_RELIANCE_PCT", direction: "ABOVE_BREACHES", limit_value: 4000, severity: "BOARD" }
              as: RiskOfficer
              captures: { lim: $.data.id }
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "RetailA", channel: "RETAIL_DEPOSIT", balance_cents: 6000000000 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-sources"
              payload: { counterparty_name: "W1", channel: "WHOLESALE_UNSECURED", balance_cents: 5000000000, matures_in_days: 20 }
              as: TreasuryAnalyst
            - call: "POST /liquidity/funding-evaluations"
              as: RiskOfficer
            - call: "GET /liquidity/board-limits/${lim}/breaches"
              as: RiskOfficer
              captures: { br: "$.data[0].id" }
            - call: "POST /liquidity/breaches/${br}/acknowledge"
              as: RiskOfficer
              as_user_id: ro_1
          trigger:
            - call: "POST /liquidity/breaches/${br}/remediate"
              payload: { remediation_note: "premature" }
              as: RiskOfficer
              as_user_id: ro_2
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LIMIT_STILL_BREACHED  (current value 4545 still > 4000)"

      - name: approve_by_playbook_creator_violates_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SOD_VIOLATION]", state_machines.ContingencyPlaybook.TESTED_to_APPROVED]
        distinguishing_aspect: "Segregation of duties: the analyst who created the playbook (ta_1) cannot approve it even when it is TESTED; a different officer (ro_2) can."
        test_recipe:
          setup:
            - "BASELINE scenario; line 100000000/10000 with LEVEL_1 200000000 pledged (power 100000000); playbook (creator ta_1) target 60000000 with one LINE_DRAWDOWN est 60000000; capacity-test PASSED (TESTED)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "P1", market_value_cents: 200000000 }
              as: TreasuryOps
              captures: { ap: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${ap}", line_id: "${ln}" }
              as: TreasuryOps
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 60000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
              payload: { kind: "LINE_DRAWDOWN", sequence_no: 1, estimated_proceeds_cents: 60000000, settlement_lag_days: 0, line_id: "${ln}" }
              as: TreasuryAnalyst
            - call: "POST /liquidity/contingency-playbooks/${pb}/capacity-test"
              as: RiskOfficer
          trigger:
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ta_1
              captures: { err: $.data.error_id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/approve"
              as: RiskOfficer
              as_user_id: ro_2
              captures: { st: $.data.status, appr: $.data.approved_by_user_id }
          assert:
            - "err == ERR_SOD_VIOLATION  (ta_1 created the playbook)"
            - "st == APPROVED and appr == ro_2"

      - name: scenario_retirement_guards
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_LAST_BASELINE_SCENARIO]", "errors[ERR_SCENARIO_IN_USE]", "errors[ERR_SCENARIO_RETIRED]", "errors[ERR_DUPLICATE_ACTIVE_SCENARIO]", state_machines.StressScenario.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Retirement guard cluster on StressScenario: last ACTIVE BASELINE cannot retire; a scenario with a DRAFT run cannot retire; a RETIRED scenario rejects new runs; a second ACTIVE scenario for the same tier is rejected."
        test_recipe:
          setup: ["ACTIVE scenarios B (BASELINE), M (MODERATE), S (SEVERE); S has a DRAFT projection run"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "B", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { b: $.data.id }
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "M", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
              captures: { m: $.data.id }
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "S", tier: "SEVERE", deposit_runoff_pct: 25, wholesale_renewal_pct: 0, level2_addon_bps: 1000, horizon_days: 30 }
              as: RiskOfficer
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /liquidity/stress-scenarios/${s}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${s_v}" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /liquidity/stress-scenarios/${b}/retire"
              as: RiskOfficer
              captures: { err_last: $.data.error_id }
            - call: "POST /liquidity/stress-scenarios/${s}/retire"
              as: RiskOfficer
              captures: { err_use: $.data.error_id }
            - call: "POST /liquidity/stress-scenarios/${m}/retire"
              as: RiskOfficer
              captures: { m_st: $.data.status, m_v2: $.data.version }
            - call: "POST /liquidity/stress-scenarios/${m}/projection-runs"
              payload: { model_variant: "CONTRACTUAL", as_of_date: "2026-08-01", expected_scenario_version: "${m_v2}" }
              as: TreasuryAnalyst
              captures: { err_ret: $.data.error_id }
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "B2", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { err_dup: $.data.error_id }
          assert:
            - "err_last == ERR_LAST_BASELINE_SCENARIO"
            - "err_use == ERR_SCENARIO_IN_USE  (S holds a DRAFT run)"
            - "m_st == RETIRED  (M retires cleanly: not BASELINE, no DRAFT runs)"
            - "err_ret == ERR_SCENARIO_RETIRED  (OCC version matches; retirement gate fires)"
            - "err_dup == ERR_DUPLICATE_ACTIVE_SCENARIO  (B still ACTIVE for tier BASELINE)"

      - name: repay_exceeding_drawn_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REPAY_EXCEEDS_DRAWN]"]
        distinguishing_aspect: "Fiscal guard: repaying 1 cent against a line with drawn_cents 0 fails with ERR_REPAY_EXCEEDS_DRAWN."
        test_recipe:
          setup: ["Line 10000000/10000, no draws (drawn_cents 0)"]
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "RepoCo", line_type: "REPO", total_capacity_cents: 10000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
          trigger:
            - call: "POST /liquidity/borrowing-lines/${ln}/repay"
              payload: { amount_cents: 1 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REPAY_EXCEEDS_DRAWN"

      - name: draw_above_borrowing_power_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_BORROWING_POWER]", calculations.borrowing_power]
        distinguishing_aspect: "Fiscal boundary: with power exactly 42500000, a draw of 42500001 fails with ERR_INSUFFICIENT_BORROWING_POWER."
        test_recipe:
          setup: ["Line 80000000/5000; LEVEL_2A asset 100000000 pledged (power 42500000)"]
          setup_api_calls:
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "FHLB", line_type: "FHLB", total_capacity_cents: 80000000, advance_rate_bps: 5000 }
              as: TreasuryOps
              captures: { ln: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_2A", reference: "A1", market_value_cents: 100000000 }
              as: TreasuryOps
              captures: { a1: $.data.id }
            - call: "POST /liquidity/collateral-pledges"
              payload: { asset_id: "${a1}", line_id: "${ln}" }
              as: TreasuryOps
          trigger:
            - call: "POST /liquidity/borrowing-lines/${ln}/draw"
              payload: { amount_cents: 42500001 }
              as: TreasuryOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_BORROWING_POWER  (power is exactly 42500000)"

      - name: execute_sale_of_pledged_asset_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ASSET_NOT_AVAILABLE]", state_machines.PlaybookAction.READY_to_EXECUTING]
        distinguishing_aspect: "Cross-check at execution time: an ASSET_SALE whose asset became PLEDGED after the capacity test fails with ERR_ASSET_NOT_AVAILABLE."
        test_recipe:
          setup:
            - "BASELINE scenario; two lines L1/L2 100000000/10000; LEVEL_1 asset 50000000 UNENCUMBERED at capacity-test time"
            - "Playbook target 40000000 with ASSET_SALE action est 40000000 on the asset; TESTED -> APPROVED"
            - "Asset then pledged to L1 (encumbrance now PLEDGED); playbook ACTIVATED (action READY)"
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/borrowing-lines"
              payload: { provider_name: "Fed", line_type: "FED_DISCOUNT_WINDOW", total_capacity_cents: 100000000, advance_rate_bps: 10000 }
              as: TreasuryOps
              captures: { l1: $.data.id }
            - call: "POST /liquidity/liquid-assets"
              payload: { asset_class: "LEVEL_1", reference: "S1", market_value_cents: 50000000 }
              as: TreasuryOps
              captures: { as1: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 40000000 }
              as: TreasuryAnalyst
              as_user_id: ta_1
              captures: { pb: $.data.id }
            - call: "POST /liquidity/contingency-playbooks/${pb}/actions"
