        distinguishing_aspect: "Departing after a permit's travel_window_end fails with ERR_OUTSIDE_TRAVEL_WINDOW, and the lazy evaluation flips every overdue GRANTED permit to EXPIRED as an observable side effect of the failed depart."
        test_recipe:
          setup: ["Load 96000 lbs, 150 wide, states [CA], fully CLEARED; both permits granted with window 2026-08-10..2026-08-11; clock set to 2026-08-12T10:00Z (past both windows, inside curfew hours)"]
