  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by employee or plan tier (reverse-reachability for Enrollment.employee_id, Enrollment.plan_tier_id, Enrollment.source_life_event_id, Enrollment.superseded_by_enrollment_id)"
    roles: [BenefitsAdmin, PayrollOfficer, ComplianceOfficer, DependentVerifier]
    code: 200
    input: ["employee_id?", "plan_tier_id?", "source_life_event_id?", "superseded_by_enrollment_id?", "status?", "benefit_type?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate a DRAFT enrollment (DRAFT->ACTIVE); OCC on the owning employee"
    roles: [BenefitsAdmin]
    code: 200
    input: [expected_employee_version]
    output: Enrollment
    side_effects: ["recompute monthly_employee_cost_cents + per_paycheck_deduction_cents", "emit CarrierFeedRecord ADD", "increments Enrollment.version by 1", "increments Employee.version by 1"]

  - method: POST
    path: "/enrollments/{id}/submit-eoi"
    description: "Submit an over-GI VOLUNTARY_LIFE enrollment for EOI (DRAFT->PENDING_EOI); creates EOIRequest"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["create EOIRequest PENDING with excess_coverage_cents", "increments Enrollment.version by 1"]

  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel a DRAFT enrollment (DRAFT->CANCELLED)"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["increments Enrollment.version by 1"]

  - method: POST
