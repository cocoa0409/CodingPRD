              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o4_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o5_id}/background-result"
              payload: { dimension: "FINGERPRINT", outcome: "CLEARED" }
              as: CharteringExaminer
            - call: "POST /de-novo/organizers/${o5_id}/background-result"
              payload: { dimension: "CREDIT", outcome: "CLEARED" }
              as: CharteringExaminer
