      - name: corridor_screen_select_screen_loop_reruns_the_whole_recomputation
        claim_type: cyclic_loop_back
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Corridor[SELECTED -> SCREENED]
          - state_machines.Corridor[SCREENED -> SELECTED]
          - calculations.corridor_priority_score
        distinguishing_aspect: "state_machine_shape is cyclic: a corridor can be re-screened out of SELECTED and re-selected, and each lap of the loop re-runs the full recomputation and flips priority_score_variant, so the loop is genuinely re-entrant rather than a one-way ratchet."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, annual_volume_change_pct 20.0) has one READY never-retimed member i1 and no RetimingProject at all, so the SELECTED -> SCREENED re-screen is permitted."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
          trigger:
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { lap1_status: $.data.selection_status, lap1_variant: $.data.priority_score_variant, lap1_score: $.data.priority_score, lap1_v: $.data.version }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "First programming pass" }
              as: SignalOpsAdmin
              captures: { lap2_status: $.data.selection_status, lap2_variant: $.data.priority_score_variant, lap2_score: $.data.priority_score, lap2_v: $.data.version }
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { lap3_status: $.data.selection_status, lap3_variant: $.data.priority_score_variant, lap3_score: $.data.priority_score, lap3_v: $.data.version }
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "DEFER", rationale: "Push to next cycle after all" }
              as: SignalOpsAdmin
              captures: { lap4_status: $.data.selection_status, lap4_variant: $.data.priority_score_variant, lap4_v: $.data.version }
          assert:
            - "${lap1_status} == SCREENED, ${lap2_status} == SELECTED, ${lap3_status} == SCREENED, ${lap4_status} == DEFERRED — the machine loops back through SCREENED twice"
            - "${lap1_variant} == SCREENING, ${lap2_variant} == PROGRAMMING, ${lap3_variant} == SCREENING, ${lap4_variant} == PROGRAMMING"
            - "${lap1_score} == 91.25, ${lap2_score} == 91.25 and ${lap3_score} == 91.25 — with the single member READY and never retimed, both variants see the same member set, so the loop is value-stable while the variant label still flips"
            - "${lap1_v} == ${c1_v0} + 1, ${lap2_v} == ${lap1_v} + 1, ${lap3_v} == ${lap2_v} + 1, ${lap4_v} == ${lap3_v} + 1 — every lap is a real write"
            - "screened_at is rewritten on ${lap3_v} (a transition INTO SCREENED) but not on the selection-decision laps"

