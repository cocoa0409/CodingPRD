            - "WarehouseZone.${zone_nut_id}.lockout_start_at == 2026-08-04T06:00:00Z"
            - "WarehouseZone.${zone_nut_id}.lockout_end_at == 2026-08-06T06:00:00Z"

  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_route_stop_windows_half_open_plus_thirty_minute_buffer
        grounds:
          - validations[priority=19]
          - entities.DeliveryRoute.fields.service_buffer_minutes
          - entities.RouteStop.fields.window_start_at
          - calculations.route_load_waterfall
          - concurrency_rules[route-stop-create-stale-route]
        distinguishing_aspect: |
          Resource = DeliveryRoute (the trailer), semantics = HALF-OPEN windows
          [window_start_at, window_end_at) PLUS a positive separation buffer. A second stop starting
          exactly at 10:00:00Z, the first stop's end instant, does NOT overlap under half-open
          semantics yet is still rejected because the 0-minute gap is below service_buffer_minutes
          30; moving it to 10:30:00Z makes the gap exactly 30 minutes and is accepted. Both the
          touching-endpoint case and the exact-buffer case are pinned, and the rejected call must
          leave DeliveryRoute.version unchanged so the same expected_route_version is reusable.
