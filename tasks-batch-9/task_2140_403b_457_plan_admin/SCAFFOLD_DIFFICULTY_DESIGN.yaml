scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: deferral_room_gross_basis_versus_verified_basis
        grounds:
          - calculations.deferral_limit_aggregate_402g
          - calculations.catchup_capacity_403b
          - entities.InformationSharingAgreement.fields.data_stale
          - entities.VendorAccount.fields.ytd_elective_deferrals_cents
          - endpoints[GET /plan-admin/participants/{id}/contribution-limit-summary]
          - validations[priority=37]
          - errors[ERR_402G_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Operates on the Participant/VendorAccount deferral-aggregation domain: for one
          identical set of contracts the gross_basis variant reports room_gross_cents ==
          1750000 while the verified_basis variant reports room_verified_cents == 2550000,
          and enforcement of ERR_402G_LIMIT_EXCEEDED is decided on the gross figure, so an
          election of 1800000 cents is rejected even though the verified figure would allow it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan for plan year 2026 and reported_participant_count 250."
            - "Two providers, each holding an ACTIVE information sharing agreement with the plan; the first provider's data feed reaches 2026-07-31 (fresh, 1 day old) and the second's reaches 2026-05-01 (stale, 92 days old against a 45-day tolerance)."
            - "One participant born 1968-03-15 (attained_age_at_year_end 58) with 20 years of service and cumulative_special_catchup_used_cents 0."
            - "Contract A at the fresh provider: prior_years_elective_deferrals_cents 4000000, ytd_elective_deferrals_cents 1000000."
            - "Contract B at the stale provider: prior_years_elective_deferrals_cents 3000000, ytd_elective_deferrals_cents 800000."
            - "A valid 2026 universal availability notice and an ELIGIBLE eligibility determination exist so an election can be decided."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Cedar Custodial", vendor_code: "CDR", contact_email: "ops@cedar.example" }
              as: SystemOperator
              captures: { v2_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p403_id}", vendor_id: "${v1_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa1_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa1_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa1_id}/data-feed"
              payload: { data_current_through_date: "2026-07-31" }
              as: VendorRepresentative
              as_user_id: "${v1_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p403_id}", vendor_id: "${v2_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa2_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa2_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa2_id}/data-feed"
              payload: { data_current_through_date: "2026-05-01" }
              as: VendorRepresentative
              as_user_id: "${v2_id}"
            - call: "POST /plan-admin/plans/${p403_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "EMAIL", recipient_count: 250, describes_effective_opportunity: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1968-03-15", hire_date: "2006-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 20 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000, prior_years_elective_deferrals_cents: 4000000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a1_id: $.data.id }
            - call: "GET /plan-admin/vendor-accounts/${a1_id}"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${v1_id}"
              captures: { a1_v: $.data.version }
            - call: "POST /plan-admin/vendor-accounts/${a1_id}/balance-report"
              payload: { expected_vendor_account_version: "${a1_v}", as_of_date: "2026-07-31", accumulated_benefit_cents: 5000000, outstanding_loan_balance_cents: 0, highest_outstanding_loan_12mo_cents: 0, ytd_elective_deferrals_cents: 1000000 }
              as: VendorRepresentative
              as_user_id: "${v1_id}"
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v2_id}", contract_number: "CDR-0001", accumulated_benefit_cents: 3000000, vested_percentage_bps: 10000, prior_years_elective_deferrals_cents: 3000000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a2_id: $.data.id }
            - call: "GET /plan-admin/vendor-accounts/${a2_id}"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${v2_id}"
              captures: { a2_v: $.data.version }
            - call: "POST /plan-admin/vendor-accounts/${a2_id}/balance-report"
              payload: { expected_vendor_account_version: "${a2_v}", as_of_date: "2026-05-01", accumulated_benefit_cents: 3000000, outstanding_loan_balance_cents: 0, highest_outstanding_loan_12mo_cents: 0, ytd_elective_deferrals_cents: 800000 }
              as: VendorRepresentative
              as_user_id: "${v2_id}"
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${pa_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /plan-admin/participants/${pa_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_v: $.data.version }
            - call: "POST /plan-admin/contribution-elections"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_account_id: "${a1_id}", annual_deferral_amount_cents: 1800000, effective_from: "2026-09-01", effective_through: "2026-12-31", expected_participant_version: "${pa_v}", catchup_election: "AGE_50_AND_SERVICE_15_YEAR" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { el_id: $.data.id }
          trigger:
            - call: "GET /plan-admin/participants/${pa_id}/contribution-limit-summary"
              payload: { plan_id: "${p403_id}" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /plan-admin/contribution-elections/${el_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "contribution-limit-summary.basic_limit_cents == 2450000"
            - "contribution-limit-summary.service_15yr_catchup_capacity_cents == 300000"
            - "contribution-limit-summary.age50_catchup_capacity_cents == 800000"
            - "contribution-limit-summary.total_limit_cents == 3550000"
            - "contribution-limit-summary.lifetime_elective_deferrals_cents == 8800000"
            - "contribution-limit-summary.ytd_gross_cents == 1800000"
            - "contribution-limit-summary.ytd_verified_cents == 1000000"
            - "contribution-limit-summary.room_gross_cents == 1750000"
            - "contribution-limit-summary.room_verified_cents == 2550000"
            - "room_verified_cents - room_gross_cents == 800000, exactly the deferral total sitting behind the stale contract"
            - "POST /plan-admin/contribution-elections/${el_id}/decision responds 422 with data.error_id == ERR_402G_LIMIT_EXCEEDED"
            - "ContributionElection.${el_id}.state == SUBMITTED (the rejected approval left the row untouched)"
            - "Participant.${pa_id}.cumulative_special_catchup_used_cents == 0"

      - name: distribution_max_hardship_grossup_versus_unforeseeable_emergency_net
        grounds:
          - calculations.distribution_max_approvable
          - state_machines.ParticipantRequest.UNDER_REVIEW_to_APPROVED
          - entities.ParticipantRequest.fields.max_approvable_cents
          - validations[priority=41]
          - errors[ERR_DISTRIBUTION_EXCEEDS_NEED]
        distinguishing_aspect: |
          Operates on the ParticipantRequest distribution domain, a different entity domain
          from the deferral-aggregation instance: with stated_need_cents 2000000,
          estimated_taxes_cents 600000 and 1000000 cents of available relief, the
          hardship_gross_up variant yields max_approvable_cents == 2600000 and approves a
          2600000-cent request, while the unforeseeable_emergency_net variant yields
          max_approvable_cents == 1600000 and rejects the identical request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan and an ACTIVE PLAN_457B plan, both for plan year 2026."
            - "One provider holding an ACTIVE, non-stale information sharing agreement with each of the two plans."
            - "One participant holding a fully vested contract worth 5000000 cents under each plan."
            - "A HARDSHIP request against the 403(b) contract and an UNFORESEEABLE_EMERGENCY request against the 457(b) contract, both carrying requested_amount_cents 2600000, stated_need_cents 2000000, estimated_taxes_cents 600000, insurance_reimbursement_available_cents 500000, liquidatable_assets_cents 300000 and deferral_cessation_relief_cents 200000."
            - "Both requests are UNDER_REVIEW, opened by compliance officer co-1."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 457(b)", plan_type: "PLAN_457B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p457_id: $.data.id }
            - call: "POST /plan-admin/plans/${p457_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p403_id}", vendor_id: "${v1_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa403_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa403_id}/data-feed"
              payload: { data_current_through_date: "2026-07-31" }
              as: VendorRepresentative
              as_user_id: "${v1_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p457_id}", vendor_id: "${v1_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa457_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa457_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa457_id}/data-feed"
              payload: { data_current_through_date: "2026-07-31" }
              as: VendorRepresentative
              as_user_id: "${v1_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0403", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a403_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p457_id}", vendor_id: "${v1_id}", contract_number: "NLA-0457", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a457_id: $.data.id }
            - call: "POST /plan-admin/participant-requests"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_account_id: "${a403_id}", request_type: "HARDSHIP", requested_amount_cents: 2600000, stated_need_cents: 2000000, estimated_taxes_cents: 600000, safe_harbor_reason: "MEDICAL_EXPENSES", insurance_reimbursement_available_cents: 500000, liquidatable_assets_cents: 300000, deferral_cessation_relief_cents: 200000 }
              as: Participant
              as_user_id: "${pa_id}"
              captures: { req_hs_id: $.data.id }
            - call: "POST /plan-admin/participant-requests"
              payload: { participant_id: "${pa_id}", plan_id: "${p457_id}", vendor_account_id: "${a457_id}", request_type: "UNFORESEEABLE_EMERGENCY", requested_amount_cents: 2600000, stated_need_cents: 2000000, estimated_taxes_cents: 600000, emergency_reason: "EXTRAORDINARY_MEDICAL", insurance_reimbursement_available_cents: 500000, liquidatable_assets_cents: 300000, deferral_cessation_relief_cents: 200000 }
              as: Participant
              as_user_id: "${pa_id}"
              captures: { req_ue_id: $.data.id }
            - call: "POST /plan-admin/participant-requests/${req_hs_id}/decision"
              payload: { decision: "BEGIN_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /plan-admin/participant-requests/${req_ue_id}/decision"
              payload: { decision: "BEGIN_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /plan-admin/participant-requests/${req_hs_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /plan-admin/participant-requests/${req_ue_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "ParticipantRequest.${req_hs_id}.state == APPROVED"
            - "ParticipantRequest.${req_hs_id}.max_approvable_cents == 2600000"
            - "ParticipantRequest.${req_hs_id}.approved_amount_cents == 2600000"
            - "POST /plan-admin/participant-requests/${req_ue_id}/decision responds 422 with data.error_id == ERR_DISTRIBUTION_EXCEEDS_NEED"
            - "ParticipantRequest.${req_ue_id}.state == UNDER_REVIEW"
            - "ParticipantRequest.${req_ue_id}.approved_amount_cents is null"
            - "the two variants differ by exactly 1000000 cents on identical inputs: 2600000 for hardship_gross_up against 1600000 for unforeseeable_emergency_net"

      - name: exchange_versus_transfer_admissibility_divergence
        grounds:
          - calculations.exchange_transfer_admissibility
          - validations[priority=26]
          - validations[priority=28]
          - errors[ERR_EXCHANGE_VENDOR_NOT_APPROVED]
          - entities.TransferExchangeRequest.fields.request_kind
        distinguishing_aspect: |
          Operates on the TransferExchangeRequest movement domain, a third entity domain:
          for the identical participant, identical source contract, identical receiving
          provider and identical amount_cents 5000000, the contract_exchange variant is
          rejected with ERR_EXCHANGE_VENDOR_NOT_APPROVED because that provider's agreement
          with the plan is TERMINATED, while the plan_to_plan_transfer variant is created
          successfully because a transfer requires no information sharing agreement at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PUBLIC_SCHOOL employer maintaining two ACTIVE PLAN_403B plans for plan year 2026."
            - "Provider one holds an ACTIVE, non-stale agreement with the first plan; provider two's agreement with the first plan has been TERMINATED and it holds no agreement with the second plan."
            - "One participant with a 5000000-cent contract at provider one under the first plan, a 1000000-cent contract at provider two under the first plan, and a 0-cent contract at provider two under the second plan."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Cedar Custodial", vendor_code: "CDR", contact_email: "ops@cedar.example" }
              as: SystemOperator
              captures: { v2_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend Legacy 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403alt_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403alt_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p403_id}", vendor_id: "${v1_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa1_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa1_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa1_id}/data-feed"
              payload: { data_current_through_date: "2026-07-31" }
              as: VendorRepresentative
              as_user_id: "${v1_id}"
            - call: "POST /plan-admin/information-sharing-agreements"
              payload: { plan_id: "${p403_id}", vendor_id: "${v2_id}", effective_from: "2026-01-01", effective_through: "2026-12-31" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { isa2_id: $.data.id }
            - call: "POST /plan-admin/information-sharing-agreements/${isa2_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/information-sharing-agreements/${isa2_id}/status"
              payload: { to_status: "TERMINATED" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-0001", accumulated_benefit_cents: 5000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${pa_id}", plan_id: "${p403_id}", vendor_id: "${v2_id}", contract_number: "CDR-0001", accumulated_benefit_cents: 1000000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
