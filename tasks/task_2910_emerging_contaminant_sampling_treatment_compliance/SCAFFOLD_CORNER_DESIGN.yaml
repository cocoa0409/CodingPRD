          assert:
            - "The manifest against the RUNNING pilot returns HTTP 422 with error_id ERR_PILOT_NOT_COMPLETED"
            - "The effluent 60.00 completion returns HTTP 422 with error_id ERR_EFFLUENT_EXCEEDS_INFLUENT and PilotTest.${gac_id}.status is still RUNNING"
            - "The valid completion returns HTTP 200 with status COMPLETED, removal_pct 96.30 and unmanifested_media_kg 800.00"
            - "The repeat completion returns HTTP 422 with error_id ERR_PILOT_STATE_INVALID and the stored measurements are unchanged"
            - "The IX_RESIN manifest returns HTTP 422 with error_id ERR_MEDIA_TYPE_MISMATCH"
            - "The 900.00 kg manifest returns HTTP 422 with error_id ERR_MASS_EXCEEDS_SPENT_MEDIA"
            - "PilotTest.${gac_id}.unmanifested_media_kg is still 800.00 after all three refused manifests"
            - "The 800.00 kg manifest returns HTTP 201 with status DRAFT, and PilotTest.${gac_id}.unmanifested_media_kg becomes 0.00"
            - "The ship of the DRAFT manifest returns HTTP 422 with error_id ERR_MANIFEST_STATE_INVALID"
            - "ResidualsManifest.${m_id}.disposal_method is still null and TreatmentEvaluation.${eval_id}.residuals_spent_cents is still 0"

      - name: the_evaluation_decision_needs_the_state_before_it_needs_the_evidence
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVALUATION_STATE_INVALID]
          - errors[ERR_INSUFFICIENT_PILOT_EVIDENCE]
          - validations[priority=26]
          - validations[priority=95]
          - constants.MIN_COMPLETED_PILOTS
        distinguishing_aspect: "A SCREENING evaluation with zero pilots fails the state gate rather than the evidence gate, which is the ordering trap: the evidence count is also zero, so an implementation that checks MIN_COMPLETED_PILOTS first returns ERR_INSUFFICIENT_PILOT_EVIDENCE on the very same request."
        test_recipe:
          setup:
            - "A voluntary evaluation on EPTDS-01 is opened and left in SCREENING with no pilots at all."
            - "MIN_COMPLETED_PILOTS is 2, so a single completed pilot is never enough evidence for a SELECT."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
          trigger:
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "Premature selection attempt" }
              as: TreatmentEngineer
              captures: { e_state: "$.data.error_id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "Only one technology was piloted" }
              as: TreatmentEngineer
              captures: { e_evidence: "$.data.error_id" }
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "ABANDON", decision_note: "Neither budget nor schedule supports a second pilot" }
              as: TreatmentEngineer
          assert:
            - "The SCREENING SELECT returns HTTP 422 with error_id ERR_EVALUATION_STATE_INVALID"
            - "The SCREENING SELECT does NOT return ERR_INSUFFICIENT_PILOT_EVIDENCE even though zero pilots are completed"
            - "TreatmentEvaluation.${eval_id}.status is still SCREENING and EntryPoint.${ep_id}.treatment_status is still NONE"
            - "Creating the first pilot moves TreatmentEvaluation.${eval_id}.status to PILOTING and EntryPoint.${ep_id}.treatment_status to PILOT"
            - "PilotTest.${gac_id}.removal_pct == 96.30, which clears MIN_REMOVAL_PCT, so only the count is deficient"
            - "The one-pilot SELECT returns HTTP 422 with error_id ERR_INSUFFICIENT_PILOT_EVIDENCE"
            - "TreatmentEvaluation.${eval_id}.selected_technology is still null and no CapitalProject exists for the evaluation"
            - "The ABANDON returns HTTP 200 with status REJECTED_ALL and EntryPoint.${ep_id}.treatment_status back to NONE"

      - name: the_funding_and_construction_money_guards_are_rejected_in_ladder_order
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FUNDING_NOT_SECURED]
          - errors[ERR_PROJECT_STATE_INVALID]
          - errors[ERR_AWARD_EXCEEDS_REQUEST]
          - errors[ERR_AWARD_EXCEEDS_PROJECT_COST]
          - errors[ERR_APPLICATION_STATE_INVALID]
          - validations[priority=32]
          - validations[priority=64]
          - validations[priority=110]
          - validations[priority=111]
        distinguishing_aspect: "The two award ceilings are probed separately — 500,000,000 against a 400,000,000 request breaches the per-application ceiling, while a second 400,000,000 award against an already-awarded 400,000,000 breaches the 680,000,000 project ceiling — so an implementation that only compares against one of them passes exactly half of this instance."
        test_recipe:
          setup:
            - "The canonical GAC selection on EPTDS-01 yields a CapitalProject at capital 680,000,000, funding_status NOT_APPLIED and construction_status PLANNED."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
