              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { rep40_id: "$.data.id", rep40_score: "$.data.technical_score", rep40_verdict: "$.data.verdict" }
            - call: "POST /assets"
              payload: { house_number: "HN-W39", title: "Marginal Master 39", source: "FILE_DELIVERY", expected_duration_seconds: 100, delivery_deadline_utc: "2026-08-05T00:00:00Z", required_resolution_class: "SD_480I", captions_required: false }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { asset_w39_id: "$.data.id" }
            - call: "POST /assets/${asset_w39_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 106, video_codec: "H264", delivered_resolution_class: "SD_480I", frame_rate: 29.97, audio_loudness_lkfs: -30.0, audio_channel_config: "STEREO_2_0", caption_present: false }
              as: QCTechnician
              as_user_id: "${qc_id}"
              captures: { asset_w39_v: "$.data.version" }
            - call: "POST /assets/${asset_w39_id}/qc-reports"
              payload: { expected_asset_version: "${asset_w39_v}", inspected_by_operator_id: "${qc_id}", basis: "INGEST", defect_codes: ["LOUDNESS_OUT_OF_SPEC", "BLACK_FRAMES", "VIDEO_ARTIFACT"], measured_duration_seconds: 106 }
              as: QCTechnician
