  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_exactly_at_extreme_band_minimum
        grounds:
          - calculations.watercraft_risk_band
          - calculations.watercraft_risk_score
          - entities.InspectionRecord.fields.risk_band
          - entities.InspectionRecord.fields.quarantine_warranted
          - endpoints.POST_/inspection-records/{id}/screening
        distinguishing_aspect: |
          The metric is the risk score against BAND_EXTREME_MIN, and the test
          lands on it exactly: 40 (HIGH water body) + 15 (SUSPECT) + 25 (residual
          base 20 plus floor(550/100) = 5 capped at 15) - 5 (one whole day of
          standing time from 30 hours) = 75. Because the band boundary is
          half-open on the low side, 75 is EXTREME and not HIGH, which is what
          flips quarantine_warranted true on a merely SUSPECT water body. The
          neighbouring value is reached by changing only standing_water_ml to 450,
          giving 74 and HIGH - one point apart, opposite gate outcomes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00Z."
            - "WaterBody 'Fort Peck' risk_tier HIGH, infestation_status SUSPECT."
            - "Station 'Fort Peck Access' OPEN with hours covering the arrival; Inspector 'Ada Field' ACTIVE LEVEL_1."
            - "Watercraft MT-9001, vessel_type OPEN_HULL so vessel_factor is exactly 1.00, last_water_body_id Fort Peck and last_removed_at 2026-08-04T03:00:00Z - exactly 30 hours before the arrival, i.e. one whole 24-hour day of credit."
            - "InspectionRecord created with arrived_at 2026-08-05T09:00:00Z and still INITIATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Fort Peck", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "HIGH", infestation_status: "SUSPECT" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Fort Peck Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-9001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18, last_water_body_id: "${wb_id}", last_removed_at: "2026-08-04T03:00:00Z" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_v}", residual_water_present: true, standing_water_ml: 550, prior_water_body_id: "${wb_id}" }
              as: Inspector
              as_user_id: "${insp_a}"
          assert:
            - "InspectionRecord.${rec_id}.risk_score == 75"
            - "InspectionRecord.${rec_id}.dry_credit_points == 5 (floor(30 / 24) * 5)"
            - "InspectionRecord.${rec_id}.risk_band == EXTREME (75 is at BAND_EXTREME_MIN, which is inclusive)"
            - "InspectionRecord.${rec_id}.decon_mandatory == true and quarantine_warranted == true"
            - "InspectionRecord.${rec_id}.advisory_risk_score == 75 (the screening call happens at the arrival instant, so the screening_basis standing time is also 30 hours)"
            - "InspectionRecord.${rec_id}.inspection_status == SCREENED"
            - "control: re-screening the same record with standing_water_ml 450 and the vessel's incremented expected_watercraft_version yields risk_score 74, risk_band HIGH and quarantine_warranted false, with decon_mandatory still true"

      - name: treatment_factors_exactly_at_their_high_thresholds
        grounds:
          - calculations.decon_treatment_effectiveness
          - calculations.decon_required_dry_hours
          - validations.priority_19_ERR_TREATMENT_BELOW_MINIMUM
          - endpoints.POST_/decon-orders/{id}/treatment
        distinguishing_aspect: |
          Three independent thresholds are hit exactly in one call: water_temp_f
          exactly HIGH_TREATMENT_TEMP_F 140 gives temp_factor 1.0 rather than 0.5,
          pressure_psi exactly HIGH_TREATMENT_PSI 3000 gives psi_factor 1.0 rather
          than 0.6, and dwell_seconds exactly REQUIRED_DWELL_SECONDS[HIGH] 120
          gives dwell_factor exactly 1.0 without tripping the sub-minimum
          validation. Effectiveness is therefore exactly 100.00 and the dry credit
          is floor(72 * 1.0 * 0.75) = 54, leaving required_dry_hours 18. Dropping
          the temperature by a single degree to 139 - still legal, since
          MIN_TREATMENT_TEMP_F is 120 - halves the score to 50.00 and moves the
          obligation to 45 hours, so the two neighbours differ in the derived
          block, not in the accept/reject decision.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T09:00:00Z."
            - "Station 'Hebgen Access' OPEN, hot_water_capable true, decon_bay_count 1."
            - "Inspector 'Bo Tech' ACTIVE DECON_CERTIFIED."
            - "InspectionRecord screened at risk_score 65 (HIGH) and dispositioned DECON; DeconOrder ORDERED with band_at_order HIGH, base_dry_hours 72 and attempt_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Hebgen Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH", infestation_status: "CLEAN" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Hebgen Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", mandatory_inspection: true, decon_bay_count: 1, hot_water_capable: true, seal_stock_initial_count: 2 }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
