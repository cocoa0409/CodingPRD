  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # instance 1 = pair (8.02 derived-posture gate | 15 capacity/quota)
  #              ERR_UNIT_POSTURE_BLOCKS_OPERATION 409 beats
  #              ERR_INDUCTION_CAPACITY_EXCEEDED 409
  # instance 2 = pair (12 actor-attachment | 14.1 clinical-timestamp range)
  #              ERR_PERFORMER_NOT_ON_CASE 422 beats
  #              ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE 400
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: divert_posture_at_8_02_outranks_exceeded_day_bed_minute_budget_at_15_on_induction_hold
        grounds:
          - validations[priority 8.02]
          - validations[priority 15]
          - errors[ERR_UNIT_POSTURE_BLOCKS_OPERATION]
          - errors[ERR_INDUCTION_CAPACITY_EXCEEDED]
          - calculations.unit_posture_derivation
          - calculations.induction_capacity_projection
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
        distinguishing_aspect: |
          One /hold-capacity call violates two rules at once and the ladder is
          decidable only by priority number, not by plausibility: the unit is in
          DIVERT (priority 8.02) AND the day's budget cannot absorb the booking
          (priority 15, checked LAST of all). The correct answer is
          409 ERR_UNIT_POSTURE_BLOCKS_OPERATION. The two rules are also
          entangled, which is what makes a naive implementation pick the wrong
          one: it is the DIVERT posture that raises turnover_buffer_minutes from
          45 to 75, and it is that 75 that pushes projected_occupancy_minutes to
          600 + 75 = 675 past the 600-minute day budget. An implementation that
          evaluates capacity eagerly (because it computed the projection first in
          order to know what to reserve) reports
          ERR_INDUCTION_CAPACITY_EXCEEDED; one that checks the budget with the
          OPEN-posture buffer computes 645, still over 600, and reports the same
          wrong error; and one that resolves the posture gate only after
          reserving minutes leaves the day's held total non-zero after a
          rejected call. Note also that DIVERT arises here from
          coverage_deficit_units >= 8.0, NOT from an empty bed list — LDR-01 and
          LDR-02 are both AVAILABLE, so no bed-lifecycle rule (8.07) and no bed
          interval rule (13.3) can pre-empt the pair.
        test_recipe:
          setup: |
