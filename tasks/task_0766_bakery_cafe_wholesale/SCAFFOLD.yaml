scenario: "Bakery Café & Wholesale Bread: retail POS & daily-bake par/markdown, wholesale/restaurant standing order & route, pre-order (holiday) & catering, allergen & shelf-life/date, subscription (bread club), inventory & reconciliation, custom-cake linkage, delivery"
domain_name: bakery-cafe-wholesale
api_prefix: ""   # top-level peer resources rooted at "/"; no shared collection prefix

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Quota / allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid          # BakePlan>Line and Route>Stop trees + flat cross-aggregate FKs on DeliveryOrder
  state_machine_shape: parallel    # DeliveryOrder evolves payment_status x fulfillment_status independently
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock-keeping unit; unique per product"
        constraints: "unique, non-empty"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: category
        type: enum
        source: input
        description: "Product family"
        constraints: "one of BREAD, PASTRY, CAKE, SANDWICH, OTHER"
      - name: allergens
        type: array
        source: input
        description: "Declared allergens present in this product"
        default: "[]"
        constraints: "each value one of GLUTEN, DAIRY, EGG, NUT, SOY, SESAME"
      - name: shelf_life_hours
        type: integer
        source: input
        description: "Hours from production until best_by"
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "Retail list price in cents; also the wholesale list-price basis and waste-valuation basis"
        constraints: ">= 0"
      - name: is_custom
        type: boolean
        source: input
        description: "True for custom-cake / made-to-order products"
        default: "false"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; DISCONTINUED products cannot be added to new orders/lines"
        default: "ACTIVE"
        constraints: "one of ACTIVE, DISCONTINUED"

  - name: Oven
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Oven label"
      - name: capacity_trays
        type: integer
        source: input
        description: "Nominal tray capacity (informational)"
        constraints: ">= 1"
      - name: clean_buffer_minutes
        type: integer
        source: input
        description: "Mandatory cooldown/cleaning gap required between two consecutive bake slots on this oven"
        default: "15"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: "ACTIVE"
        constraints: "one of ACTIVE, RETIRED"

  - name: BakePlan
    parent: null
    common_fields: true
    fields:
      - name: production_date
        type: datetime
        source: input
        description: "The calendar day (00:00Z) this plan bakes for"
      - name: notes
        type: string
        source: input
        description: "Free-text planning notes"
        default: "null"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle"
        default: "DRAFT"
        constraints: "one of DRAFT, COMMITTED, BAKED, RECONCILED, CLOSED"
      - name: total_theoretical_waste_units
        type: integer
        source: computed
        description: "Sum over lines of PAR_BASED waste (see reconciliation_waste, variant PAR_BASED); set at reconcile"
        default: "0"
      - name: total_actual_waste_units
        type: integer
        source: computed
        description: "Sum over lines of SALES_BASED waste (see reconciliation_waste, variant SALES_BASED); set at reconcile"
        default: "0"
      - name: total_waste_value_cents
        type: integer
        source: computed
        description: "Sum over lines of SALES_BASED waste units * product.base_price_cents; set at reconcile"
        default: "0"

  - name: BakePlanLine
    parent: BakePlan
    common_fields: true
    fields:
      - name: bake_plan_id
        type: string
        source: system
        description: "FK -> BakePlan.id; set from path on creation"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this line plans"
      - name: par_qty
        type: integer
        source: input
        description: "Planned bake quantity (the par); the finite pool reserved against by wholesale/pre-orders"
        constraints: ">= 1"
      - name: reserved_qty
        type: integer
        source: computed
        description: "Sum of qty of DeliveryOrders on this line with fulfillment_status in {PENDING, PACKED, OUT_FOR_DELIVERY, DELIVERED} (i.e. not CANCELLED)"
        default: "0"
      - name: available_qty
        type: integer
        source: computed
        description: "par_qty - reserved_qty; retail-available remainder of the par pool"
        default: "0"
      - name: baked_qty
        type: integer
        source: computed
        description: "Sum of BakeLot.baked_qty for lots on this line"
        default: "0"
      - name: sold_qty
        type: integer
        source: computed
        description: "Sum of RetailSale.qty across this line's BakeLots"
        default: "0"
      - name: delivered_qty
        type: integer
        source: computed
        description: "Sum of qty of this line's DeliveryOrders with fulfillment_status == DELIVERED"
        default: "0"
      - name: theoretical_waste_units
        type: integer
        source: computed
        description: "PAR_BASED waste for this line; set at reconcile"
        default: "0"
      - name: actual_waste_units
        type: integer
        source: computed
        description: "SALES_BASED waste for this line; set at reconcile"
        default: "0"

  - name: BakeLot
    parent: null
    common_fields: true
    fields:
      - name: bake_plan_line_id
        type: string
        source: input
        description: "FK -> BakePlanLine.id; the planned line this physical lot fulfills"
      - name: oven_id
        type: string
        source: input
        description: "FK -> Oven.id; oven occupied by this lot's bake slot"
      - name: baked_qty
        type: integer
        source: input
        description: "Physical units produced in this lot"
        constraints: ">= 1"
      - name: remaining_qty
        type: integer
        source: computed
        description: "baked_qty minus retail units sold from this lot (floor stock); wholesale delivery does not draw this field"
        default: "0"
      - name: produced_at
        type: datetime
        source: input
        description: "Instant the lot came out of the oven; best_by is derived from this"
      - name: best_by
        type: datetime
        source: computed
        description: "produced_at + product.shelf_life_hours"
      - name: slot_start
        type: datetime
        source: input
        description: "Oven-occupancy start instant"
      - name: slot_end
        type: datetime
        source: input
        description: "Oven-occupancy end instant; must be after slot_start"
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle"
        default: "FRESH"
        constraints: "one of FRESH, MARKED_DOWN, SOLD_OUT, EXPIRED"
      - name: markdown_price_cents
        type: integer
        source: computed
        description: "Discounted unit price set by the markdown action; null until first markdown"
        default: "null"
      - name: current_unit_price_cents
        type: integer
        source: computed
        description: "markdown_price_cents when status==MARKED_DOWN, else product.base_price_cents"
        default: "0"

  - name: RetailSale
    parent: null
    common_fields: false
    fields:
      - name: bake_lot_id
        type: string
        source: input
        description: "FK -> BakeLot.id; lot sold at the POS"
      - name: qty
        type: integer
        source: input
        description: "Units sold in this transaction"
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Snapshot of the lot's current_unit_price_cents at sale time"
      - name: total_cents
        type: integer
        source: computed
        description: "qty * unit_price_cents"
      - name: sold_at
        type: datetime
        source: computed
        description: "Logical clock instant at which the sale was recorded"

  - name: WholesaleAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Restaurant / wholesale customer name"
      - name: contract_tier
        type: enum
        source: input
        description: "Pricing tier that selects the wholesale discount"
        default: "STANDARD"
        constraints: "one of STANDARD, PREMIUM, BULK"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum outstanding credit_balance_cents allowed before new charges are refused"
        constraints: ">= 0"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Outstanding owed; sum over the account's DeliveryOrders that are DELIVERED-and-not-voided of (line_total_cents - amount_paid_cents)"
        default: "0"
      - name: allergen_restrictions
        type: array
        source: input
        description: "Allergens this account refuses; ordering a product whose allergens intersect this set is rejected"
        default: "[]"
        constraints: "each value one of GLUTEN, DAIRY, EGG, NUT, SOY, SESAME"
      - name: status
        type: enum
        source: system
        description: "Account lifecycle; SUSPENDED blocks fulfillment, CLOSED cascades cancellations"
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED, CLOSED"

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - name: wholesale_account_id
        type: string
        source: input
        description: "FK -> WholesaleAccount.id; the recurring customer"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product delivered on the recurring schedule"
      - name: qty_per_delivery
        type: integer
        source: input
        description: "Units per scheduled delivery"
        constraints: ">= 1"
      - name: weekday_mask
        type: array
        source: input
        description: "Weekdays this standing order delivers"
        constraints: "non-empty; each value one of MON, TUE, WED, THU, FRI, SAT, SUN"
      - name: cutoff_hours
        type: integer
        source: input
        description: "Lead-time cutoff; a generated DeliveryOrder for a delivery_date must be created at least this many hours before delivery_date"
        default: "24"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Recurring-template lifecycle"
        default: "ACTIVE"
        constraints: "one of ACTIVE, PAUSED, CANCELLED"

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: wholesale_account_id
        type: string
        source: input
        description: "FK -> WholesaleAccount.id; the billed account"
      - name: standing_order_id
        type: string
        source: input
        description: "FK -> StandingOrder.id; null for ad-hoc one-off orders"
        default: "null"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product ordered"
      - name: bake_plan_line_id
        type: string
        source: input
        description: "FK -> BakePlanLine.id; par pool this order reserves from (its product_id must equal this order's product_id)"
      - name: delivery_date
        type: datetime
        source: input
        description: "Requested delivery instant"
      - name: qty
        type: integer
        source: input
        description: "Units ordered; reserved from the line's par pool"
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Contract-tier discounted unit price (see wholesale_line_price, variant CONTRACT)"
      - name: line_total_cents
        type: integer
        source: computed
        description: "round_half_up(qty * base_price_cents * (1 - contract_discount)); the CONTRACT invoice amount for this order"
      - name: list_total_cents
        type: integer
        source: computed
        description: "qty * product.base_price_cents; the LIST variant amount (no discount)"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative payments applied to this order"
        default: "0"
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension (independent of fulfillment_status)"
        default: "UNPAID"
        constraints: "one of UNPAID, PARTIALLY_PAID, PAID"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Fulfillment dimension (independent of payment_status)"
        default: "PENDING"
        constraints: "one of PENDING, PACKED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED"

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - name: route_date
        type: datetime
        source: input
        description: "Calendar day (00:00Z) the route runs"
      - name: driver_name
        type: string
        source: input
        description: "Assigned driver label"
      - name: window_start
        type: datetime
        source: input
        description: "Earliest instant the route operates; every stop window must fall within [window_start, window_end)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of route operating window; must be after window_start"
      - name: status
        type: enum
        source: system
        description: "Route lifecycle"
        default: "PLANNED"
        constraints: "one of PLANNED, DISPATCHED, COMPLETED, CANCELLED"
      - name: stop_count
        type: integer
        source: computed
        description: "Count of this route's RouteStops with status != CANCELLED"
        default: "0"
      - name: total_load_qty
        type: integer
        source: computed
        description: "Sum of DeliveryOrder.qty over this route's RouteStops with status != CANCELLED"
        default: "0"

  - name: RouteStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: system
        description: "FK -> DeliveryRoute.id; set from path on creation"
      - name: delivery_order_id
        type: string
        source: input
        description: "FK -> DeliveryOrder.id; the order delivered at this stop (at most one non-cancelled stop per order)"
      - name: sequence
        type: integer
        source: input
        description: "Visit order on the route"
        constraints: ">= 1"
      - name: arrival_window_start
        type: datetime
        source: input
        description: "Promised arrival window start (inclusive)"
      - name: arrival_window_end
        type: datetime
        source: input
        description: "Promised arrival window end (exclusive); must be after arrival_window_start"
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle"
        default: "PENDING"
        constraints: "one of PENDING, DELIVERED, CANCELLED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{id}/discontinue"
        actor: Manager
        preconditions: ["product.status == ACTIVE"]
        side_effects: ["product.status = DISCONTINUED (new BakePlanLines/StandingOrders/DeliveryOrders referencing it are rejected ERR_PRODUCT_DISCONTINUED)"]

  - entity: BakePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /bake-plans/{id}/commit"
        actor: Manager
        preconditions: ["plan.status == DRAFT", "plan has >= 1 BakePlanLine"]
        side_effects: ["plan.status = COMMITTED (par pools frozen for the day)"]
      - from: COMMITTED
        to: BAKED
        trigger: "POST /bake-lots (first lot on any of this plan's lines) — system side effect"
        actor: system
        preconditions: ["plan.status == COMMITTED"]
        side_effects: ["plan.status = BAKED on first BakeLot created against a line of this plan"]
      - from: BAKED
        to: RECONCILED
        trigger: "POST /bake-plans/{id}/reconcile"
        actor: Manager
        preconditions: ["plan.status == BAKED"]
        side_effects:
          - "run reconciliation_waste for every line: set line.theoretical_waste_units (PAR_BASED) and line.actual_waste_units (SALES_BASED)"
          - "set plan.total_theoretical_waste_units, plan.total_actual_waste_units, plan.total_waste_value_cents"
      - from: RECONCILED
        to: CLOSED
        trigger: "POST /bake-plans/{id}/close"
        actor: Manager
        preconditions: ["plan.status == RECONCILED"]
        side_effects:
          - "plan.status = CLOSED"
          - "cascade: every BakeLot of this plan still in {FRESH, MARKED_DOWN} transitions to EXPIRED"

  - entity: BakeLot
    initial_state: FRESH
    terminal_states: [SOLD_OUT, EXPIRED]
    transitions:
      - from: FRESH
        to: MARKED_DOWN
        trigger: "POST /bake-lots/{id}/markdown"
        actor: Baker
        preconditions:
          - "lot.status == FRESH"
          - "hours_to_expiry (best_by - now) <= MARKDOWN_WINDOW_HOURS"
          - "hours_to_expiry > 0"
          - "request expected_bake_lot_version == lot.version (OCC)"
        side_effects:
          - "compute markdown_price (sets lot.markdown_price_cents, lot.current_unit_price_cents)"
          - "lot.status = MARKED_DOWN"
          - "increments BakeLot.version by 1"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "POST /bake-lots/{id}/markdown (re-markdown as expiry nears)"
        actor: Baker
        preconditions:
          - "lot.status == MARKED_DOWN"
          - "hours_to_expiry (best_by - now) <= MARKDOWN_WINDOW_HOURS"
          - "hours_to_expiry > 0"
          - "request expected_bake_lot_version == lot.version (OCC) — a re-markdown legitimately supersedes the prior markdown price"
        side_effects:
          - "recompute markdown_price (updates lot.markdown_price_cents, lot.current_unit_price_cents)"
          - "increments BakeLot.version by 1"
      - from: FRESH
        to: SOLD_OUT
        trigger: "POST /retail-sales draining remaining_qty to 0 — system side effect"
        actor: system
        preconditions: ["lot.status == FRESH", "sale drives remaining_qty to 0"]
        side_effects: ["lot.status = SOLD_OUT"]
      - from: MARKED_DOWN
        to: SOLD_OUT
        trigger: "POST /retail-sales draining remaining_qty to 0 — system side effect"
        actor: system
        preconditions: ["lot.status == MARKED_DOWN", "sale drives remaining_qty to 0"]
        side_effects: ["lot.status = SOLD_OUT"]
      - from: FRESH
        to: EXPIRED
        trigger: "POST /bake-lots/{id}/expire OR plan close cascade"
        actor: Baker
        preconditions: ["lot.status == FRESH"]
        side_effects: ["lot.status = EXPIRED (removes floor stock)"]
      - from: MARKED_DOWN
        to: EXPIRED
        trigger: "POST /bake-lots/{id}/expire OR plan close cascade"
        actor: Baker
        preconditions: ["lot.status == MARKED_DOWN"]
        side_effects: ["lot.status = EXPIRED"]

  - entity: WholesaleAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wholesale-accounts/{id}/suspend"
        actor: Manager
        preconditions: ["account.status == ACTIVE"]
        side_effects: ["account.status = SUSPENDED (blocks DeliveryOrder pack: cross-entity precondition)"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wholesale-accounts/{id}/close"
        actor: Manager
        preconditions: ["account.status == ACTIVE", "account.credit_balance_cents == 0"]
        side_effects:
          - "account.status = CLOSED"
          - "cascade link 1: every StandingOrder of this account in {ACTIVE, PAUSED} transitions to CANCELLED"
          - "cascade link 2: each such StandingOrder's DeliveryOrders in {PENDING, PACKED, OUT_FOR_DELIVERY} transition to CANCELLED (which release par per DeliveryOrder cancel side effects)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /wholesale-accounts/{id}/close"
        actor: Manager
        preconditions: ["account.status == SUSPENDED", "account.credit_balance_cents == 0"]
        side_effects:
          - "account.status = CLOSED"
          - "cascade link 1: every StandingOrder of this account in {ACTIVE, PAUSED} transitions to CANCELLED"
          - "cascade link 2: each such StandingOrder's non-cancelled non-delivered DeliveryOrders transition to CANCELLED"

  - entity: StandingOrder
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /standing-orders/{id}/pause"
        actor: Manager
        preconditions: ["standing_order.status == ACTIVE"]
        side_effects: ["standing_order.status = PAUSED (no new DeliveryOrders may cite it)"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /standing-orders/{id}/resume"
        actor: Manager
        preconditions: ["standing_order.status == PAUSED"]
        side_effects: ["standing_order.status = ACTIVE"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /standing-orders/{id}/cancel"
        actor: Manager
        preconditions: ["standing_order.status == ACTIVE"]
        side_effects:
          - "standing_order.status = CANCELLED"
          - "cascade link 1: every DeliveryOrder citing this standing_order with fulfillment_status in {PENDING, PACKED, OUT_FOR_DELIVERY} transitions to CANCELLED"
          - "cascade link 2 (via each order cancel): release par on the order's BakePlanLine (reserved_qty -= qty) AND that order's RouteStop (if any, status != CANCELLED) transitions to CANCELLED"
          - "cascade link 3 (via each stop cancel): the stop's DeliveryRoute recomputes stop_count and total_load_qty"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /standing-orders/{id}/cancel"
        actor: Manager
        preconditions: ["standing_order.status == PAUSED"]
        side_effects:
          - "standing_order.status = CANCELLED"
          - "cascade identical to ACTIVE->CANCELLED"

  - entity: DeliveryOrder
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: PACKED
        trigger: "POST /delivery-orders/{id}/pack"
        actor: Manager
        preconditions:
          - "order.fulfillment_status == PENDING"
          - "cross-entity: order's WholesaleAccount.status == ACTIVE (SUSPENDED/CLOSED reject ERR_ACCOUNT_SUSPENDED)"
        side_effects: ["order.fulfillment_status = PACKED"]
        note: "[FULFILLMENT dimension]"
      - from: PACKED
        to: OUT_FOR_DELIVERY
        trigger: "POST /delivery-routes/{id}/dispatch dispatching a route whose stop covers this order — system side effect"
        actor: system
        preconditions: ["order.fulfillment_status == PACKED"]
        side_effects: ["order.fulfillment_status = OUT_FOR_DELIVERY"]
        note: "[FULFILLMENT dimension]"
      - from: PACKED
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/deliver (direct/counter delivery without a route)"
        actor: Manager
        preconditions:
          - "order.fulfillment_status == PACKED"
          - "fiscal: account.credit_balance_cents + (line_total_cents - amount_paid_cents) <= account.credit_limit_cents"
        side_effects:
          - "order.fulfillment_status = DELIVERED"
          - "account.credit_balance_cents += (order.line_total_cents - order.amount_paid_cents) (account_credit_balance)"
          - "line.delivered_qty += order.qty at next reconcile input"
        note: "[FULFILLMENT dimension]"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/deliver OR POST /route-stops/{id}/complete — system side effect"
        actor: Driver
        preconditions: ["order.fulfillment_status == OUT_FOR_DELIVERY"]
        side_effects:
          - "order.fulfillment_status = DELIVERED"
          - "account.credit_balance_cents += (order.line_total_cents - order.amount_paid_cents) (account_credit_balance)"
          - "line.delivered_qty += order.qty at next reconcile input"
        note: "[FULFILLMENT dimension]"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel OR cascade from StandingOrder/Account"
        actor: Manager
        preconditions: ["order.fulfillment_status in {PENDING, PACKED, OUT_FOR_DELIVERY}"]
        side_effects:
          - "order.fulfillment_status = CANCELLED"
          - "release par: order's BakePlanLine.reserved_qty -= order.qty (available_qty recomputed)"
          - "any RouteStop for this order with status != CANCELLED transitions to CANCELLED; its route recomputes stop_count/total_load_qty"
        note: "[FULFILLMENT dimension]"
      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel (void a delivered order)"
        actor: Manager
        preconditions: ["order.fulfillment_status == DELIVERED"]
        side_effects:
          - "order.fulfillment_status = CANCELLED"
          - "compensation: account.credit_balance_cents -= (order.line_total_cents - order.amount_paid_cents) (reverses the charge booked on deliver; credit invariant preserved)"
          - "release par: order's BakePlanLine.reserved_qty -= order.qty"
        note: "[FULFILLMENT dimension] compensating action"
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /delivery-orders/{id}/payments with 0 < amount_cents < outstanding"
        actor: Manager
        preconditions: ["order.payment_status == UNPAID", "order.fulfillment_status != CANCELLED"]
        side_effects:
          - "order.amount_paid_cents += amount_cents"
          - "order.payment_status = PARTIALLY_PAID"
          - "if order already DELIVERED: account.credit_balance_cents -= amount_cents"
        note: "[PAYMENT dimension] independent of fulfillment_status"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /delivery-orders/{id}/payments settling the remainder"
        actor: Manager
        preconditions: ["order.payment_status == PARTIALLY_PAID", "amount_cents == line_total_cents - amount_paid_cents"]
        side_effects:
          - "order.amount_paid_cents = line_total_cents"
          - "order.payment_status = PAID"
          - "if order already DELIVERED: account.credit_balance_cents -= amount_cents"
        note: "[PAYMENT dimension]"
      - from: UNPAID
        to: PAID
        trigger: "POST /delivery-orders/{id}/payments with amount_cents == line_total_cents"
        actor: Manager
        preconditions: ["order.payment_status == UNPAID", "amount_cents == line_total_cents"]
        side_effects:
          - "order.amount_paid_cents = line_total_cents"
          - "order.payment_status = PAID"
          - "if order already DELIVERED: account.credit_balance_cents -= amount_cents"
        note: "[PAYMENT dimension]"

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /delivery-routes/{id}/dispatch"
        actor: Manager
        preconditions: ["route.status == PLANNED", "route.stop_count >= 1"]
        side_effects:
          - "route.status = DISPATCHED"
          - "each stop's DeliveryOrder in fulfillment_status PACKED -> OUT_FOR_DELIVERY"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /delivery-routes/{id}/dispatch is idempotency-guarded; completion when all stops terminal — system side effect"
        actor: system
        preconditions: ["route.status == DISPATCHED", "every non-cancelled RouteStop is DELIVERED"]
        side_effects: ["route.status = COMPLETED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /delivery-routes/{id}/cancel (route abandoned before dispatch)"
        actor: Manager
        preconditions: ["route.status == PLANNED"]
        side_effects: ["route.status = CANCELLED", "all its RouteStops in {PENDING} transition to CANCELLED"]
        note: "provided for CANCELLED enum closure"

  - entity: RouteStop
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /route-stops/{id}/complete"
        actor: Driver
        preconditions:
          - "stop.status == PENDING"
          - "cross-entity: stop's DeliveryRoute.status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
        side_effects:
          - "stop.status = DELIVERED"
          - "stop's DeliveryOrder OUT_FOR_DELIVERY -> DELIVERED (books credit per account_credit_balance)"
          - "if all non-cancelled stops of the route are DELIVERED: route -> COMPLETED"
      - from: PENDING
        to: CANCELLED
        trigger: "cascade from DeliveryOrder cancel OR route cancel"
        actor: system
        preconditions: ["stop.status == PENDING"]
        side_effects: ["stop.status = CANCELLED", "route recomputes stop_count/total_load_qty"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: markdown-supersede-stale-lot
    parent_entity: BakeLot
    write_endpoint: "POST /bake-lots/{id}/markdown"
    occ_field: "expected_bake_lot_version"
    description: |
      Recording a markdown against a BakeLot whose version has advanced since the
      client last observed it is rejected. A markdown legitimately supersedes any
      prior markdown price on the same lot (re-markdown from MARKED_DOWN is a valid
      transition), so a second markdown carrying a now-stale expected_bake_lot_version
      is not blocked by any state precondition; the stale-version check is what
      distinguishes the writer whose view predates the prior markdown.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: markdown_price
    trigger: "POST /bake-lots/{id}/markdown"
    algorithm: tiered_threshold
    formula: |
      now = logical clock
      h_hours = (best_by - now) in hours   # may be fractional
      # eligibility (see validations): reject if h_hours > MARKDOWN_WINDOW_HOURS or h_hours <= 0
      if h_hours > MID_TIER_HOURS:   base_discount = MID_DISCOUNT     # MID_TIER_HOURS < h <= MARKDOWN_WINDOW_HOURS
      else:                          base_discount = LATE_DISCOUNT    # 0 < h <= MID_TIER_HOURS
      remaining_ratio = remaining_qty / baked_qty     # baked_qty >= 1 always
      surplus = SURPLUS_BONUS if remaining_ratio >= SURPLUS_RATIO else 0
      discount = min(MAX_DISCOUNT, base_discount + surplus)
      markdown_price_cents = round_half_up(base_price_cents * (1 - discount))
    input_set: "single BakeLot; base_price_cents from its Product; remaining_qty/baked_qty from the lot"
    constants:
      MARKDOWN_WINDOW_HOURS: 8
      MID_TIER_HOURS: 4
      MID_DISCOUNT: 0.25
      LATE_DISCOUNT: 0.50
      SURPLUS_RATIO: 0.5
      SURPLUS_BONUS: 0.15
      MAX_DISCOUNT: 0.60
    precision: "integer cents, round_half_up; boundaries: h==8 uses MID_DISCOUNT (h>4), h==4 uses LATE_DISCOUNT (not h>4), ratio==0.5 applies SURPLUS_BONUS (>=)"
    variants:
      - name: FIRST_MARKDOWN
        when: "lot.status == FRESH"
        difference: "sets status MARKED_DOWN"
      - name: RE_MARKDOWN
        when: "lot.status == MARKED_DOWN"
        difference: "recomputes on the same discount tiers as h_hours shrinks; supersedes prior markdown_price_cents"

  - name: reconciliation_waste
    trigger: "POST /bake-plans/{id}/reconcile"
    algorithm: aggregation
    formula: |
      for each BakePlanLine of the plan:
        baked = sum(BakeLot.baked_qty for lots on the line)          # any lot status
        sold = line.sold_qty                                         # retail units sold
        delivered = sum(order.qty for the line's DeliveryOrders with fulfillment_status == DELIVERED)
        # VARIANT PAR_BASED (forward-looking target):
        theoretical_waste_units = max(0, baked - par_qty)
        # VARIANT SALES_BASED (chronological actual):
        actual_waste_units = max(0, baked - sold - delivered)
        line.theoretical_waste_units = theoretical_waste_units
        line.actual_waste_units      = actual_waste_units
      plan.total_theoretical_waste_units = sum(line.theoretical_waste_units)
      plan.total_actual_waste_units      = sum(line.actual_waste_units)
      plan.total_waste_value_cents       = sum(line.actual_waste_units * line.product.base_price_cents)
    input_set: "all BakePlanLines of the plan; DELIVERED DeliveryOrders only for delivered; all RetailSales for sold (via line.sold_qty)"
    constants: {}
    precision: "integer units and integer cents; waste floored at 0"
    variants:
      - name: PAR_BASED
        when: "computing theoretical_waste_units (the plan's target/benchmark)"
        difference: "waste = overbake above par = max(0, baked - par_qty); ignores actual sell-through"
      - name: SALES_BASED
        when: "computing actual_waste_units (the official end-of-day waste)"
        difference: "waste = baked minus units actually sold and delivered = max(0, baked - sold - delivered); the two variants diverge whenever baked != par or sell-through != (baked - overbake)"

  - name: wholesale_line_price
    trigger: "POST /delivery-orders"
    algorithm: tiered_pricing
    formula: |
      base = product.base_price_cents
      discount = { STANDARD: STANDARD_DISCOUNT, PREMIUM: PREMIUM_DISCOUNT, BULK: BULK_DISCOUNT }[account.contract_tier]
      if qty >= BULK_MIN_QTY: discount = max(discount, BULK_DISCOUNT)   # volume floor
      # CONTRACT variant (the booked amount):
      unit_price_cents = round_half_up(base * (1 - discount))
      line_total_cents = round_half_up(qty * base * (1 - discount))    # PIN: multiply exact discounted amount by qty, then round ONCE
      # LIST variant (undiscounted reference):
      list_total_cents = qty * base
    input_set: "single DeliveryOrder; base from its Product; discount from its WholesaleAccount.contract_tier"
    constants:
      STANDARD_DISCOUNT: 0.10
      PREMIUM_DISCOUNT: 0.15
      BULK_DISCOUNT: 0.20
      BULK_MIN_QTY: 24
    precision: "integer cents, round_half_up; line_total rounds once after multiplying qty by the exact discounted unit amount"
    variants:
      - name: CONTRACT
        when: "always used for line_total_cents / unit_price_cents (what the account is billed)"
        difference: "applies the tier discount; line_total_cents = round_half_up(qty*base*(1-discount))"
      - name: LIST
        when: "reference figure exposed as list_total_cents and in the statement"
        difference: "no discount; list_total_cents = qty*base; diverges from CONTRACT by the discount whenever discount > 0"

  - name: account_invoice_total
    trigger: "GET /wholesale-accounts/{id}/statement"
    algorithm: aggregation
    formula: |
      orders = DeliveryOrders where wholesale_account_id == account.id
               AND delivery_date == requested delivery_date
               AND fulfillment_status == DELIVERED
      # PIN (rounding order): each order.line_total_cents is ALREADY rounded to whole cents per
      # wholesale_line_price (round-per-line). The statement SUMS those pre-rounded line totals.
      # It does NOT re-derive by summing exact discounted amounts and rounding once at the end.
      invoice_total_cents = sum(order.line_total_cents for order in orders)
      list_total_cents    = sum(order.list_total_cents for order in orders)
      order_count         = count(orders)
    input_set: "the account's DELIVERED DeliveryOrders for the given delivery_date"
    constants: {}
    precision: "integer cents; round-per-line-then-sum is the pinned order (differs from sum-exact-then-round when per-line fractional cents round in the same direction)"

  - name: par_reservation
    trigger: "POST /delivery-orders (reserve) and DeliveryOrder cancel (release)"
    algorithm: aggregation
    formula: |
      line.reserved_qty  = sum(o.qty for o in line's DeliveryOrders if o.fulfillment_status != CANCELLED)
      line.available_qty = line.par_qty - line.reserved_qty
      # INVARIANT: line.reserved_qty + line.available_qty == line.par_qty at all times
    input_set: "a BakePlanLine's non-cancelled DeliveryOrders"
    constants: {}
    precision: "integer units; available_qty must never go negative (guarded by ERR_INSUFFICIENT_PAR at create)"

  - name: account_credit_balance
    trigger: "DeliveryOrder deliver / void / payment"
    algorithm: aggregation
    formula: |
      account.credit_balance_cents =
        sum( (o.line_total_cents - o.amount_paid_cents)
             for o in account's DeliveryOrders
             if o.fulfillment_status == DELIVERED )
      # forward action deliver: += (line_total - amount_paid)
      # compensation void (DELIVERED->CANCELLED): -= (line_total - amount_paid)
      # payment on a DELIVERED order: -= amount_cents
      # INVARIANT: deliver-then-void restores credit_balance_cents to its pre-deliver value
    input_set: "the account's DELIVERED (not voided) DeliveryOrders"
    constants: {}
    precision: "integer cents; never negative"

  - name: route_load
    trigger: "RouteStop create / cancel; DeliveryOrder cancel"
    algorithm: aggregation
    formula: |
      route.stop_count     = count(s for s in route's RouteStops if s.status != CANCELLED)
      route.total_load_qty = sum(s.delivery_order.qty for s in route's RouteStops if s.status != CANCELLED)
    input_set: "a DeliveryRoute's non-cancelled RouteStops"
    constants: {}
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint (RBAC); entity_backed WholesaleClient acts only on resources it owns (X-User-ID == wholesale_account_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right in the path then body FKs in declared order"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 4
    category: state
    check: "markdown/sale target lot is not EXPIRED"
    error_id: ERR_LOT_EXPIRED
    http_status: 409
    applies_to: "POST /bake-lots/{id}/markdown, POST /retail-sales"
  - priority: 4
    category: state
    check: "pack requires the order's WholesaleAccount.status == ACTIVE (cross-entity state dependency)"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/pack"
  - priority: 4
    category: state
    check: "route-stop complete requires the stop's DeliveryRoute.status == DISPATCHED (cross-entity state dependency)"
    error_id: ERR_ROUTE_NOT_DISPATCHED
    http_status: 409
    applies_to: "POST /route-stops/{id}/complete"
  - priority: 5
    category: business_safety
    check: "ordered product's allergens do not intersect the WholesaleAccount.allergen_restrictions set"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /delivery-orders, POST /standing-orders"
  - priority: 6
    category: business_referential
    check: "referenced Product.status == ACTIVE (not DISCONTINUED)"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /bake-plans/{id}/lines, POST /standing-orders, POST /delivery-orders"
  - priority: 6
    category: business_referential
    check: "the DeliveryOrder's bake_plan_line_id.product_id equals its product_id; a cited standing_order_id belongs to the same wholesale_account_id and is ACTIVE"
    error_id: ERR_ACCOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /delivery-orders"
  - priority: 7
    category: business_constraint
    check: "reserving qty must not drive the line's available_qty negative (qty <= available_qty)"
    error_id: ERR_INSUFFICIENT_PAR
    http_status: 409
    applies_to: "POST /delivery-orders"
  - priority: 7
    category: business_constraint
    check: "retail sale qty must not exceed the lot's remaining_qty"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /retail-sales"
  - priority: 7
    category: business_constraint
    check: "a new BakeLot's [slot_start, slot_end] plus the oven's clean_buffer_minutes must not collide with another lot on the same oven (closed-interval + buffer)"
    error_id: ERR_OVEN_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /bake-lots"
  - priority: 7
    category: business_constraint
    check: "a new RouteStop's [arrival_window_start, arrival_window_end) must not overlap another non-cancelled stop on the same route (half-open, adjacency allowed)"
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /delivery-routes/{id}/stops"
  - priority: 7
    category: business_constraint
    check: "at most one non-cancelled RouteStop may reference a given DeliveryOrder"
    error_id: ERR_DUPLICATE_STOP
    http_status: 409
    applies_to: "POST /delivery-routes/{id}/stops"
  - priority: 8
    category: business_temporal
    check: "for an order citing a StandingOrder, the current clock must be >= cutoff_hours before delivery_date; window/slot fields must satisfy end > start"
    error_id: ERR_PAST_CUTOFF
    http_status: 422
    applies_to: "POST /delivery-orders"
  - priority: 8
    category: business_temporal
    check: "interval end must be strictly after start (slot_end>slot_start, window_end>window_start, arrival_window_end>arrival_window_start); a stop window must fall within its route window"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /bake-lots, POST /delivery-routes, POST /delivery-routes/{id}/stops"
  - priority: 8
    category: business_temporal
    check: "markdown target lot's hours_to_expiry must be <= MARKDOWN_WINDOW_HOURS and > 0"
    error_id: ERR_MARKDOWN_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /bake-lots/{id}/markdown"
  - priority: 9
    category: business_fiscal
    check: "booking a charge must not push credit_balance_cents above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/deliver"
  - priority: 10
    category: state
    check: "OCC: expected_bake_lot_version must equal the current BakeLot.version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /bake-lots/{id}/markdown"
  - priority: 3
    category: existence
    check: "request body present and required fields non-null with correct type/enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/products"
    description: "Create a product"
    roles: [Manager]
    code: 201
    input: [sku, name, category, base_price_cents, shelf_life_hours, "allergens?", "is_custom?"]
    output: Product
    side_effects: ["Product created with status ACTIVE"]
  - method: GET
    path: "/products"
    description: "List products"
    roles: [Manager, Baker, Cashier, Driver, WholesaleClient]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [Manager, Baker, Cashier, Driver, WholesaleClient]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{id}/discontinue"
    description: "Discontinue a product"
    roles: [Manager]
    code: 200
    input: []
    output: Product
    side_effects: ["Product.status ACTIVE -> DISCONTINUED"]

  - method: POST
    path: "/ovens"
    description: "Create an oven"
    roles: [Manager]
    code: 201
    input: [name, capacity_trays, "clean_buffer_minutes?"]
    output: Oven
    side_effects: []
  - method: GET
    path: "/ovens"
    description: "List ovens"
    roles: [Manager, Baker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Oven[]
    side_effects: []

  - method: POST
    path: "/bake-plans"
    description: "Create a daily bake plan (DRAFT)"
    roles: [Manager]
    code: 201
    input: [production_date, "notes?"]
    output: BakePlan
    side_effects: ["BakePlan created DRAFT"]
  - method: GET
    path: "/bake-plans/{id}"
    description: "Get a bake plan (with waste totals)"
    roles: [Manager, Baker]
    code: 200
    input: []
    output: BakePlan
    side_effects: []
  - method: POST
    path: "/bake-plans/{id}/lines"
    description: "Add a par line to a DRAFT plan"
    roles: [Manager]
    code: 201
    input: [product_id, par_qty]
    output: BakePlanLine
    side_effects: ["BakePlanLine created with bake_plan_id from path; available_qty=par_qty"]
  - method: GET
    path: "/bake-plans/{id}/lines"
    description: "List a plan's par lines (reverse-reachability for BakePlanLine.bake_plan_id)"
    roles: [Manager, Baker]
    code: 200
    input: ["limit?", "offset?"]
    output: BakePlanLine[]
    side_effects: []
  - method: POST
    path: "/bake-plans/{id}/commit"
    description: "Commit a plan (DRAFT -> COMMITTED)"
    roles: [Manager]
    code: 200
    input: []
    output: BakePlan
    side_effects: ["BakePlan.status -> COMMITTED"]
  - method: POST
    path: "/bake-plans/{id}/reconcile"
    description: "Reconcile a plan (BAKED -> RECONCILED); computes theoretical/actual waste"
    roles: [Manager]
    code: 200
    input: []
    output: BakePlan
    side_effects: ["reconciliation_waste run per line", "plan waste totals set", "status -> RECONCILED"]
  - method: POST
    path: "/bake-plans/{id}/close"
    description: "Close a reconciled plan (RECONCILED -> CLOSED); cascades lot expiry"
    roles: [Manager]
    code: 200
    input: []
    output: BakePlan
    side_effects: ["status -> CLOSED", "cascade: FRESH/MARKED_DOWN lots of this plan -> EXPIRED"]

  - method: GET
    path: "/bake-plan-lines/{id}"
    description: "Get a par line (reserved/available/waste fields)"
    roles: [Manager, Baker]
    code: 200
    input: []
    output: BakePlanLine
    side_effects: []
  - method: GET
    path: "/bake-plan-lines"
    description: "List par lines (reverse-reachability for BakePlanLine.product_id)"
    roles: [Manager, Baker]
    code: 200
    input: ["bake_plan_id?", "product_id?", "limit?", "offset?"]
    output: BakePlanLine[]
    side_effects: []

  - method: POST
    path: "/bake-lots"
    description: "Record a baked lot; occupies an oven slot; may move plan to BAKED"
    roles: [Manager, Baker]
    code: 201
    input: [bake_plan_line_id, oven_id, baked_qty, produced_at, slot_start, slot_end]
    output: BakeLot
    side_effects:
      - "oven-slot conflict check (closed interval + clean_buffer_minutes)"
      - "best_by = produced_at + product.shelf_life_hours; remaining_qty = baked_qty; status FRESH"
      - "line.baked_qty recomputed; if plan.status==COMMITTED then plan -> BAKED"
  - method: GET
    path: "/bake-lots/{id}"
    description: "Get a bake lot"
    roles: [Manager, Baker, Cashier]
    code: 200
    input: []
    output: BakeLot
    side_effects: []
  - method: GET
    path: "/bake-lots"
    description: "List bake lots (reverse-reachability for bake_plan_line_id and oven_id)"
    roles: [Manager, Baker, Cashier]
    code: 200
    input: ["bake_plan_line_id?", "oven_id?", "status?", "limit?", "offset?"]
    output: BakeLot[]
    side_effects: []
  - method: GET
    path: "/bake-lots/{id}/retail-sales"
    description: "List a lot's POS sales (reverse-reachability for RetailSale.bake_lot_id)"
    roles: [Manager, Baker, Cashier]
    code: 200
    input: ["limit?", "offset?"]
    output: RetailSale[]
    side_effects: []
  - method: POST
    path: "/bake-lots/{id}/markdown"
    description: "Mark a lot down (FRESH->MARKED_DOWN or re-markdown); OCC-guarded"
    roles: [Manager, Baker]
    code: 200
    input: [expected_bake_lot_version, "reason?"]
    output: BakeLot
    side_effects:
      - "eligibility: hours_to_expiry in (0, MARKDOWN_WINDOW_HOURS]"
      - "markdown_price computed; status MARKED_DOWN"
      - "increments BakeLot.version by 1"
  - method: POST
    path: "/bake-lots/{id}/expire"
    description: "Expire a lot (FRESH/MARKED_DOWN -> EXPIRED)"
    roles: [Manager, Baker]
    code: 200
    input: []
    output: BakeLot
    side_effects: ["status -> EXPIRED"]

  - method: POST
    path: "/retail-sales"
    description: "Record a POS sale; draws lot floor stock"
    roles: [Cashier, Manager]
    code: 201
    input: [bake_lot_id, qty]
    output: RetailSale
    side_effects:
      - "unit_price_cents = lot.current_unit_price_cents; total_cents = qty*unit_price_cents; sold_at = clock"
      - "lot.remaining_qty -= qty; line.sold_qty += qty; if remaining_qty==0 then lot -> SOLD_OUT"

  - method: POST
    path: "/wholesale-accounts"
    description: "Create a wholesale account"
    roles: [Manager]
    code: 201
    input: [name, credit_limit_cents, "contract_tier?", "allergen_restrictions?"]
    output: WholesaleAccount
    side_effects: ["account created ACTIVE, credit_balance_cents=0"]
  - method: GET
    path: "/wholesale-accounts/{id}"
    description: "Get an account (WholesaleClient only its own)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: []
  - method: POST
    path: "/wholesale-accounts/{id}/suspend"
    description: "Suspend an account (ACTIVE -> SUSPENDED)"
    roles: [Manager]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/wholesale-accounts/{id}/close"
    description: "Close an account (requires credit_balance_cents==0); cascades standing-order/order cancellation"
    roles: [Manager]
    code: 200
    input: []
    output: WholesaleAccount
    side_effects:
      - "status -> CLOSED"
      - "cascade: ACTIVE/PAUSED StandingOrders -> CANCELLED; their PENDING/PACKED/OUT_FOR_DELIVERY DeliveryOrders -> CANCELLED (release par)"
  - method: GET
    path: "/wholesale-accounts/{id}/statement"
    description: "Computed daily invoice for an account (account_invoice_total)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: [delivery_date, "limit?", "offset?"]
    output: "{ invoice_total_cents: integer, list_total_cents: integer, order_count: integer }"
    side_effects: []

  - method: POST
    path: "/standing-orders"
    description: "Create a recurring standing order"
    roles: [Manager]
    code: 201
    input: [wholesale_account_id, product_id, qty_per_delivery, weekday_mask, "cutoff_hours?"]
    output: StandingOrder
    side_effects: ["StandingOrder created ACTIVE"]
  - method: GET
    path: "/standing-orders/{id}"
    description: "Get a standing order"
    roles: [Manager, WholesaleClient]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []
  - method: GET
    path: "/standing-orders"
    description: "List standing orders (reverse-reachability for wholesale_account_id and product_id)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: ["wholesale_account_id?", "product_id?", "status?", "limit?", "offset?"]
    output: StandingOrder[]
    side_effects: []
  - method: POST
    path: "/standing-orders/{id}/pause"
    description: "Pause a standing order (ACTIVE -> PAUSED)"
    roles: [Manager]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/standing-orders/{id}/resume"
    description: "Resume a standing order (PAUSED -> ACTIVE)"
    roles: [Manager]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/standing-orders/{id}/cancel"
    description: "Cancel a standing order; cascades to its open DeliveryOrders, their stops, and route loads"
    roles: [Manager]
    code: 200
    input: []
    output: StandingOrder
    side_effects:
      - "status -> CANCELLED"
      - "cascade: open DeliveryOrders -> CANCELLED -> release par + cancel their RouteStops -> route recomputes load"

  - method: POST
    path: "/delivery-orders"
    description: "Create a wholesale delivery order; reserves par; prices via contract tier"
    roles: [Manager, WholesaleClient]
    code: 201
    input: [wholesale_account_id, product_id, bake_plan_line_id, delivery_date, qty, "standing_order_id?"]
    output: DeliveryOrder
    side_effects:
      - "wholesale_line_price computes unit_price_cents/line_total_cents/list_total_cents"
      - "reserve par: line.reserved_qty += qty; available_qty recomputed"
      - "payment_status UNPAID, fulfillment_status PENDING"
  - method: GET
    path: "/delivery-orders/{id}"
    description: "Get a delivery order (WholesaleClient only its own)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders (reverse-reachability for wholesale_account_id, standing_order_id, bake_plan_line_id, product_id)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: ["wholesale_account_id?", "standing_order_id?", "bake_plan_line_id?", "product_id?", "delivery_date?", "fulfillment_status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: []
  - method: POST
    path: "/delivery-orders/{id}/pack"
    description: "Pack an order (PENDING -> PACKED); requires account ACTIVE"
    roles: [Manager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> PACKED"]
  - method: POST
    path: "/delivery-orders/{id}/deliver"
    description: "Mark an order delivered (OUT_FOR_DELIVERY -> DELIVERED); books credit"
    roles: [Manager, Driver]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> DELIVERED", "account.credit_balance_cents += (line_total-amount_paid)"]
  - method: POST
    path: "/delivery-orders/{id}/payments"
    description: "Apply a payment (payment dimension)"
    roles: [Manager, WholesaleClient]
    code: 200
    input: [amount_cents]
    output: DeliveryOrder
    side_effects: ["amount_paid_cents += amount_cents; payment_status advances; if DELIVERED then credit_balance_cents -= amount_cents"]
  - method: POST
    path: "/delivery-orders/{id}/cancel"
    description: "Cancel/void an order; releases par; reverses credit if it was DELIVERED"
    roles: [Manager]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["fulfillment_status -> CANCELLED", "release par", "if was DELIVERED: credit_balance_cents -= (line_total-amount_paid)", "cancel its RouteStop; route recomputes load"]

  - method: POST
    path: "/delivery-routes"
    description: "Create a delivery route (PLANNED)"
    roles: [Manager]
    code: 201
    input: [route_date, driver_name, window_start, window_end]
    output: DeliveryRoute
    side_effects: ["route created PLANNED"]
  - method: GET
    path: "/delivery-routes/{id}"
    description: "Get a route (load totals)"
    roles: [Manager, Driver]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: POST
    path: "/delivery-routes/{id}/dispatch"
    description: "Dispatch a route (PLANNED -> DISPATCHED); moves packed orders OUT_FOR_DELIVERY"
    roles: [Manager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status -> DISPATCHED", "each stop's PACKED order -> OUT_FOR_DELIVERY"]
  - method: POST
    path: "/delivery-routes/{id}/cancel"
    description: "Cancel a PLANNED route; cancels its PENDING stops"
    roles: [Manager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status -> CANCELLED", "PENDING stops -> CANCELLED"]
  - method: POST
    path: "/delivery-routes/{id}/stops"
    description: "Add a stop to a route; half-open window overlap check"
    roles: [Manager]
    code: 201
    input: [delivery_order_id, sequence, arrival_window_start, arrival_window_end]
    output: RouteStop
    side_effects: ["RouteStop created PENDING with route_id from path", "route recomputes stop_count/total_load_qty"]

  - method: GET
    path: "/delivery-routes/{id}/stops"
    description: "List a route's stops (reverse-reachability for RouteStop.route_id)"
    roles: [Manager, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/route-stops/{id}"
    description: "Get a route stop"
    roles: [Manager, Driver]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List route stops (reverse-reachability for RouteStop.delivery_order_id)"
    roles: [Manager, Driver]
    code: 200
    input: ["route_id?", "delivery_order_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/route-stops/{id}/complete"
    description: "Complete a stop (PENDING -> DELIVERED); requires route DISPATCHED; delivers its order"
    roles: [Manager, Driver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["stop -> DELIVERED", "order OUT_FOR_DELIVERY -> DELIVERED (books credit)", "if all stops delivered: route -> COMPLETED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or WholesaleClient acting on a resource it does not own"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or invalid enum value"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id does not resolve"
  - id: ERR_OVEN_NOT_FOUND
    http: 404
    condition: "oven id does not resolve"
  - id: ERR_BAKE_PLAN_NOT_FOUND
    http: 404
    condition: "bake plan id does not resolve"
  - id: ERR_BAKE_PLAN_LINE_NOT_FOUND
    http: 404
    condition: "bake plan line id does not resolve"
  - id: ERR_BAKE_LOT_NOT_FOUND
    http: 404
    condition: "bake lot id does not resolve"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "wholesale account id does not resolve"
  - id: ERR_STANDING_ORDER_NOT_FOUND
    http: 404
    condition: "standing order id does not resolve"
  - id: ERR_DELIVERY_ORDER_NOT_FOUND
    http: 404
    condition: "delivery order id does not resolve"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "delivery route id does not resolve"
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "route stop id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_LOT_EXPIRED
    http: 409
    condition: "markdown or sale attempted on an EXPIRED lot"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 409
    condition: "pack attempted while the order's account is not ACTIVE (SUSPENDED/CLOSED)"
  - id: ERR_ROUTE_NOT_DISPATCHED
    http: 409
    condition: "stop complete attempted while its route is not DISPATCHED"
  - id: ERR_ALLERGEN_CONFLICT
    http: 422
    condition: "ordered product's allergens intersect the account's allergen_restrictions"
  - id: ERR_PRODUCT_DISCONTINUED
    http: 409
    condition: "referenced product is DISCONTINUED"
  - id: ERR_ACCOUNT_MISMATCH
    http: 409
    condition: "bake_plan_line product != order product, or standing_order not owned-by/ACTIVE for the account"
  - id: ERR_INSUFFICIENT_PAR
    http: 409
    condition: "reservation qty exceeds the line's available_qty"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "retail sale qty exceeds the lot's remaining_qty"
  - id: ERR_OVEN_SLOT_CONFLICT
    http: 409
    condition: "bake slot collides with another lot on the same oven within clean_buffer_minutes"
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "route stop arrival window overlaps another non-cancelled stop on the route"
  - id: ERR_DUPLICATE_STOP
    http: 409
    condition: "a non-cancelled stop already references this delivery order"
  - id: ERR_PAST_CUTOFF
    http: 422
    condition: "order for a standing order created after its cutoff window before delivery_date"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "interval end not strictly after start, or stop window outside route window"
  - id: ERR_MARKDOWN_NOT_ELIGIBLE
    http: 422
    condition: "lot hours_to_expiry > MARKDOWN_WINDOW_HOURS or <= 0"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "booking a charge would push credit_balance_cents above credit_limit_cents"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_bake_lot_version != current BakeLot.version (OCC)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Bakery operations manager; superset operator over plans, accounts, routes, pricing, clock"
    identity: "opaque"
    exclusive_operations:
      - "create/discontinue products, create ovens"
      - "create/commit/reconcile/close bake plans and add par lines"
      - "create/suspend/close wholesale accounts"
      - "create/pause/resume/cancel standing orders"
      - "pack/cancel delivery orders, apply payments"
      - "create/dispatch delivery routes, add stops"
      - "set logical clock"
    shared_operations:
      - "create delivery orders (with WholesaleClient)"
      - "create retail sales (with Cashier)"
      - "markdown/expire bake lots (with Baker)"
      - "deliver orders and complete stops (with Driver)"
      - "read endpoints"
  - name: Baker
    description: "Production staff; records lots and markdowns"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "create bake lots, markdown, expire (with Manager)"
      - "read plans/lines/lots/ovens"
  - name: Cashier
    description: "POS operator; records retail sales"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "create retail sales (with Manager)"
      - "read products/lots"
  - name: Driver
    description: "Delivery driver; completes stops and delivers orders"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "deliver orders, complete route stops (with Manager)"
      - "read routes/stops"
  - name: WholesaleClient
    description: "Wholesale/restaurant customer acting as its own account"
    identity: "entity_backed:WholesaleAccount"
    exclusive_operations: []
    shared_operations:
      - "create/read its own delivery orders and apply its own payments (with Manager)"
      - "read its own account, statement, and standing orders (X-User-ID == wholesale_account_id)"
