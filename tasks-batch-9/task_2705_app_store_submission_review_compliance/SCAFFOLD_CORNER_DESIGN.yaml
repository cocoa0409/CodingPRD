            - "data.expedite_credits_remaining == 2 and data.credits_used_in_window == 0"

      - name: at_exactly_ninety_days_the_penalty_is_undecayed_and_at_ninety_one_it_halves
        claim_type: Variant Divergence
        grounds:
          - calculations.standing_score.variants.ROLLING_365
          - calculations.standing_score.variants.LIFETIME_UNDECAYED
        distinguishing_aspect: "The decay step is age_days <= 90 -> 1.0 and 90 < age_days <= 180 -> 0.5, so at 2026-10-30 (day 90) both variants still read 88.00, and one day later the rolling variant jumps to 94.00 while the lifetime variant stays pinned at 88.00."
        test_recipe:
          setup:
            - "Build 100 REJECTED at 2026-08-01T00:00:00Z with one CRITICAL reason (12 points)."
          setup_api_calls: *CH_REJECTED
