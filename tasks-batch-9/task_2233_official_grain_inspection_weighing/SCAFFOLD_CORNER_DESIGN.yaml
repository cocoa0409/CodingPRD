              payload: { service_area_id: "${area}", license_number: "L-1402", full_name: "C. Capacity", endorsements: ["WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-CAP", model: "HopperMax 100", capacity_lbs: 100000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-CAP", declared_quantity_bushels: 1100, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                drafts:
                  - { gross_lbs: 40000, tare_lbs: 15000 }
