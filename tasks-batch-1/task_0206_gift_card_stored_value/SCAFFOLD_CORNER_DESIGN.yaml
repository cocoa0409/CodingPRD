              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_NOT_CORPORATE_BUYER"

      - name: expiration_not_allowed_jurisdiction_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=12]"
          - "state_machines.GiftCard.ACTIVE_to_EXPIRED"
          - "errors[ERR_EXPIRATION_NOT_ALLOWED]"
        distinguishing_aspect: "A CA StateRule with expiration_allowed=false: assess-dormancy on a long-dormant CA card → ERR_EXPIRATION_NOT_ALLOWED (409); card stays ACTIVE."
        test_recipe:
          setup: ["CA StateRule (expiration_allowed false, dormancy_fee_allowed false, ESCHEAT); a CA card activated 2024-01-01 settled 4000; clock 2026-02-01 (well past threshold)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "CA", expiration_allowed: false, dormancy_fee_allowed: false, breakage_policy: "ESCHEAT", escheat_rate: 0.60 }
              as: ProgramAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "CA" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/cards/${card}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_EXPIRATION_NOT_ALLOWED"
            - "GiftCard.${card}.lifecycle_status == ACTIVE"

      - name: dormancy_not_due_before_threshold_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=12]"
          - "calculations.dormancy_assessment"
          - "errors[ERR_DORMANCY_NOT_DUE]"
        distinguishing_aspect: "A card only 3 months inactive (threshold 12) → assess-dormancy returns ERR_DORMANCY_NOT_DUE (409)."
        test_recipe:
          setup: ["FL StateRule (expiration_allowed true, threshold 12); card activated 2025-11-01 settled 4000; clock 2026-02-01 (3 months)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "FL", expiration_allowed: true, dormancy_fee_allowed: false, breakage_policy: "RECOGNIZE", dormancy_threshold_months: 12 }
              as: ProgramAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/cards/${card}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_DORMANCY_NOT_DUE"

      - name: flagged_card_redeem_without_fraud_actor_returns_review
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=10]"
          - "state_machines.Redemption.DRAFT_to_SETTLED"
          - "errors[ERR_CARD_RISK_REVIEW]"
        distinguishing_aspect: "Settling a redemption over a FLAGGED card as StoreAssociate (not FraudAnalyst) → ERR_CARD_RISK_REVIEW (409)."
        test_recipe:
          setup: ["an ACTIVE FLAGGED card settled 5000; a DRAFT redemption for 1000 over [card]"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/cards/${card}/flag"
              payload: {}
              as: FraudAnalyst
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_CARD_RISK_REVIEW"

      - name: error_insufficient_balance_already_covered
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_INVALID_REDEMPTION]"
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_card_order_redemption_draft_rejected
          rationale: "Empty card_id_order → ERR_INVALID_REDEMPTION is asserted by the named §1.8 boundary instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: open_replacement_on_already_replaced_card_rejected
        claim_type: Conditional action
        grounds:
          - "validations[priority=11]"
          - "state_machines.ReplacementRequest.OPEN_to_APPROVED"
          - "errors[ERR_CARD_ALREADY_REPLACED]"
        distinguishing_aspect: "After a replacement on a card is APPROVED (old card VOIDED with replaced_by_card_id set), opening a NEW replacement against that same old card → ERR_CARD_ALREADY_REPLACED (409)."
        test_recipe:
          setup: ["an ACTIVE card settled 3000; an OPEN replacement on it that is then approved (card VOIDED, replaced_by_card_id set)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
              captures: { old: $.data.id }
            - call: "POST /v1/cards/${old}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
              captures: { ov: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "FRAUD" }
              as: FraudAnalyst
              captures: { rep1: $.data.id }
            - call: "POST /v1/replacements/${rep1}/approve"
              payload: { expected_old_card_version: "${ov}" }
              as: FraudAnalyst
          trigger:
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "LOST" }
              as: FraudAnalyst
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_CARD_ALREADY_REPLACED"

      - name: legs_discoverable_by_card_filter
        claim_type: Computed read
        grounds:
          - "endpoints"
          - "entities.RedemptionLeg.fields.card_id"
        distinguishing_aspect: "After a split-tender settle, GET /v1/redemption-legs?card_id finds the per-card leg (reverse-reachability for cascade-created legs)."
        test_recipe:
          setup: ["a SETTLED redemption of 1000 over a single card A (A had 3000)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { a: $.data.id }
            - call: "POST /v1/cards/${a}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${a}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
          trigger:
            - call: "GET /v1/redemption-legs"
              payload: { card_id: "${a}" }
              as: StoreAssociate
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].leg_amount_cents == 1000"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_stale_version_on_settle_after_amend
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[redemption-settle-stale-redemption]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Client reads redemption.version=1, amends via PATCH (version→2), then settles carrying the stale expected_redemption_version=1 → ERR_STALE_VERSION (412); no debit posts."
        test_recipe:
          setup: ["an ACTIVE card settled 5000; a DRAFT redemption for 1000 over [card] at version 1"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv0: $.data.version }
            - call: "PATCH /v1/redemptions/${red}"
              payload: { requested_amount_cents: 2000 }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv0}" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 412"
            - "${eid} == ERR_STALE_VERSION"
            - "GiftCard.${card}.settled_balance_cents == 5000"

      - name: error_stale_old_card_version_on_replacement_approve
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[replacement-approve-stale-card]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Client captures old_card.version after activation, then reloads the card (version advances), then approves carrying the stale expected_old_card_version → ERR_STALE_VERSION (412); old card not voided."
        test_recipe:
          setup: ["an ACTIVE card settled 3000 at version V; an OPEN replacement on it; the card is then reloaded so its version advances past V"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
              captures: { old: $.data.id }
            - call: "POST /v1/cards/${old}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
              captures: { ov: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "FRAUD" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
            - call: "POST /v1/cards/${old}/reload"
              payload: { amount_cents: 1000 }
              as: StoreAssociate
          trigger:
            - call: "POST /v1/replacements/${rep}/approve"
              payload: { expected_old_card_version: "${ov}" }
              as: FraudAnalyst
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 412"
            - "${eid} == ERR_STALE_VERSION"
            - "GiftCard.${old}.lifecycle_status == ACTIVE"

  # ===========================================================================
  - section: rbac
    instances:
      - name: store_associate_cannot_approve_replacement
        claim_type: peer_roles
        grounds:
          - "roles"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /v1/replacements/{id}/approve as StoreAssociate (FraudAnalyst-exclusive) → ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["an ACTIVE card settled 3000 with an OPEN replacement"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme" }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
              captures: { old: $.data.id }
            - call: "POST /v1/cards/${old}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
              captures: { ov: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "FRAUD" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /v1/replacements/${rep}/approve"
              payload: { expected_old_card_version: "${ov}" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 403"
            - "${eid} == ERR_FORBIDDEN"

      - name: customer_cannot_approve_own_refund
        claim_type: peer_roles
        grounds:
          - "roles"
          - "state_machines.RefundRequest.PENDING_to_APPLIED"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "POST /v1/refunds/{id}/approve as Customer (ProgramAdmin-exclusive) → ERR_FORBIDDEN (403); no REFUND credit posts."
        test_recipe:
          setup: ["an ACTIVE card owned by a customer; a PENDING RefundRequest of 1000 opened by that customer"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c@x.com", full_name: "C", residence_state_code: "FL" }
              as: ProgramAdmin
              captures: { cust: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/refunds"
              payload: { card_id: "${card}", requested_refund_cents: 1000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /v1/refunds/${ref}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 403"
            - "${eid} == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "entities.Redemption.fields.status"
          - "endpoints"
        distinguishing_aspect: "A DRAFT redemption created at version 1; a PATCH amend advances it to version 2 (version increments by 1 on each mutation)."
        test_recipe:
          setup: ["an ACTIVE card; a DRAFT redemption at version 1"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id }
          trigger:
            - call: "PATCH /v1/redemptions/${red}"
              payload: { requested_amount_cents: 1500 }
              as: StoreAssociate
            - call: "GET /v1/redemptions/${red}"
              payload: {}
              as: StoreAssociate
          assert:
            - "Redemption.${red}.version == 2"
            - "Redemption.${red}.requested_amount_cents == 1500"

      - name: hold_expiry_releases_value_after_clock_advance
        claim_type: scheduled_actions
        grounds:
          - "state_machines.AuthorizationHold.ACTIVE_to_EXPIRED"
          - "entities.AuthorizationHold.fields.expires_at"
        distinguishing_aspect: "With hold_ttl_seconds 900, after the clock advances past expires_at a release call finalizes the hold as EXPIRED and restores available_balance_cents."
        test_recipe:
          setup: ["program hold_ttl_seconds 900; an ACTIVE card settled 5000 with one ACTIVE hold of 2000 created at 2026-06-01T00:00:00Z; clock advanced to 2026-06-01T01:00:00Z (past expiry)"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000, hold_ttl_seconds: 900 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 2000 }
              as: StoreAssociate
              captures: { hold: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/holds/${hold}/release"
              payload: {}
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "AuthorizationHold.${hold}.status == EXPIRED"
            - "GiftCard.${card}.pending_hold_cents == 0"
            - "GiftCard.${card}.available_balance_cents == 5000"

      - name: cascade_full_refund_already_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.RefundRequest.PENDING_to_APPLIED"
        excluded_because:
          difficulty_instance: compensating_invariant / full_refund_reversal_restores_card_balances
          rationale: "The multi-leg REVERSAL cascade and Redemption SETTLED→VOIDED are asserted end-to-end by the named §1.8 invariant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: redemption_settle_balances_visible_same_response
        claim_type: immediate
        grounds:
          - "state_machines.Redemption.DRAFT_to_SETTLED"
          - "entities.GiftCard.fields.settled_balance_cents"
        distinguishing_aspect: "Immediate consistency: the GET on a card right after a settle reflects the debited balance with no lag (settle of 1000 on a 3000 card → 2000)."
        test_recipe:
          setup: ["an ACTIVE card settled 3000; a DRAFT redemption for 1000 over [card]"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${card}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "GiftCard.${card}.settled_balance_cents == 2000"
            - "GiftCard.${card}.lifecycle_status == ACTIVE"
