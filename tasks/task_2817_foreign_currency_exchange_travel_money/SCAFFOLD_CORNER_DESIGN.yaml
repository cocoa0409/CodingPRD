        distinguishing_aspect: "Both declared reserve-and-supersede writes guard a DIFFERENT parent, and the version they guard is bumped by writes that look unrelated: stocking a position invalidates a rate-card token, and applying then releasing a compliance hold invalidates a buyback token twice over. A stale token is a 412 that performs no supersession at all."
