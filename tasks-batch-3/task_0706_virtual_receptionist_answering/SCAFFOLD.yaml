# =============================================================================
# Virtual Receptionist & Answering Service — Seed Tables (Expert tier)
# =============================================================================

scenario: |
  Virtual Receptionist & Answering Service (Ruby/Smith.ai style): client account &
  call-script/routing, live-answer & message/lead capture, appointment booking &
  calendar integration, after-hours & overflow, per-minute/per-call plan & overage,
  bilingual & escalation, spam screening, CRM handoff & reporting

domain_name: virtual-receptionist
api_prefix: /va

# -----------------------------------------------------------------------------
# Complexity Profile (§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy

  entity_topology: flat
  # All entities are peer collections under the /va namespace prefix; relationships
  # are expressed with foreign-key fields in the body, never via nested URL paths.

  state_machine_shape: parallel
  # Call carries two independent state axes (handling_status x billing_status);
  # Appointment is cyclic (RESCHEDULE loops back to CONFIRMED); ClientAccount is
  # posture/compound-driven from billing aggregates.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic   # Appointment.origin_call_id is an optional cross-aggregate link to Call

  role_model: peer_roles
  # AccountOwner owns its account's scripts/calendars/billing; Receptionist live-answers
  # and captures; PlatformAdmin operates plans, accounts, the clock and screening config.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- ServicePlan : pricing configuration, immutable -----------------------
  - name: ServicePlan
    parent: null
    common_fields: false      # only id + created_at; plans are immutable price cards
    fields:
      - { name: name, type: string, source: input, description: "Plan display name" }
      - { name: billing_model, type: enum, source: input, description: "PER_MINUTE | PER_CALL", constraints: "PER_MINUTE bills rounded duration; PER_CALL bills a flat unit per answered call" }
      - { name: included_minutes, type: integer, source: input, description: "Monthly minute allowance (PER_MINUTE plans); 0 for PER_CALL plans", default: 0, constraints: ">= 0" }
      - { name: included_calls, type: integer, source: input, description: "Monthly answered-call allowance (PER_CALL plans); 0 for PER_MINUTE plans", default: 0, constraints: ">= 0" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat monthly subscription fee in cents", constraints: ">= 0" }
      - { name: overage_rate_cents, type: integer, source: input, description: "Cents per overage unit (per minute for PER_MINUTE, per call for PER_CALL) within tier 1", constraints: ">= 0" }
      - { name: overage_tier2_threshold, type: integer, source: input, description: "Overage-unit count at/above which the tier-2 marginal rate applies", default: 100, constraints: ">= 1" }
      - { name: overage_tier2_rate_cents, type: integer, source: input, description: "Cents per overage unit at or beyond overage_tier2_threshold", constraints: ">= 0" }
      - { name: hard_cap_overage_cents, type: integer, source: input, description: "Account suspends when period overage_charge_cents would meet or exceed this ceiling", constraints: ">= 1" }
      - { name: minute_rounding, type: enum, source: input, description: "Per-call duration rounding for PER_MINUTE billing: CEIL_MINUTE rounds each call's seconds up to whole minutes", default: "CEIL_MINUTE", constraints: "CEIL_MINUTE only in v1" }

  # --- ClientAccount : the customer tenant; posture driven by billing --------
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Client business name" }
      - { name: plan_id, type: string, source: input, description: "FK -> ServicePlan.id; subscribed plan, pinned at account creation" }
      - { name: default_language, type: enum, source: input, description: "EN | ES; preferred answer language", default: "EN" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | SUSPENDED; lifecycle posture", default: "ACTIVE", constraints: "ACTIVE | DELINQUENT | SUSPENDED" }
      - { name: current_period_id, type: string, source: computed, description: "FK -> BillingPeriod.id; the OPEN billing period accumulating usage" }
      - { name: open_call_count, type: integer, source: computed, description: "Count of own Calls whose handling_status NOT IN {COMPLETED, ABANDONED, SCREENED_OUT}", default: 0 }
      - { name: lifetime_calls_answered, type: integer, source: computed, description: "Cumulative count of own Calls that ever reached handling_status IN_PROGRESS", default: 0 }

  # --- CallScript : routing/after-hours configuration for an account ---------
  - name: CallScript
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: greeting_en, type: string, source: input, description: "English greeting text" }
      - { name: greeting_es, type: string, source: input, description: "Spanish greeting text", default: "" }
      - { name: business_open_minute, type: integer, source: input, description: "Minutes-after-UTC-midnight when business hours open (inclusive)", constraints: "0..1439" }
      - { name: business_close_minute, type: integer, source: input, description: "Minutes-after-UTC-midnight when business hours close (exclusive); calls received at or after this are after-hours", constraints: "1..1440, > business_open_minute" }
      - { name: after_hours_action, type: enum, source: input, description: "VOICEMAIL | OVERFLOW; what to do for after-hours inbound", default: "VOICEMAIL", constraints: "VOICEMAIL | OVERFLOW" }
      - { name: overflow_action, type: enum, source: input, description: "QUEUE | VOICEMAIL; what to do when no receptionist is AVAILABLE during business hours", default: "QUEUE", constraints: "QUEUE | VOICEMAIL" }
      - { name: escalation_threshold_seconds, type: integer, source: input, description: "In-progress calls running at/over this many seconds become escalation-eligible", default: 600, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED; only PUBLISHED scripts route live calls", default: "DRAFT", constraints: "DRAFT | PUBLISHED | RETIRED" }

  # --- SpamRule : screening configuration for an account --------------------
  - name: SpamRule
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: blocked_area_codes, type: array, source: input, description: "Array of 3-char area-code strings auto-screened on inbound", default: [] }
      - { name: spam_score_threshold, type: integer, source: input, description: "Provisional spam_score at/above which a call is SCREENED_OUT before answer", default: 70, constraints: "0..100" }
      - { name: anonymous_penalty, type: integer, source: input, description: "Spam-score points added when caller_id is absent", default: 40, constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED; only ACTIVE rules screen", default: "ACTIVE", constraints: "ACTIVE | DISABLED" }

  # --- Receptionist : live-answer agent (shared pool, top-level) -------------
  - name: Receptionist
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Agent name" }
      - { name: languages, type: array, source: input, description: "Subset of [EN, ES] the agent can answer in", constraints: "non-empty; values in {EN, ES}" }
      - { name: max_concurrent_calls, type: integer, source: input, description: "Capacity ceiling on simultaneous IN_PROGRESS calls", default: 1, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "OFFLINE | AVAILABLE | BUSY; routing eligibility", default: "OFFLINE", constraints: "OFFLINE | AVAILABLE | BUSY" }
      - { name: active_call_count, type: integer, source: computed, description: "Count of own Calls in handling_status IN_PROGRESS", default: 0 }

  # --- AvailabilityWindow : a receptionist's coverage interval ---------------
  - name: AvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: receptionist_id, type: string, source: input, description: "FK -> Receptionist.id; owning agent" }
      - { name: start_minute, type: integer, source: input, description: "Coverage start as minutes-after-UTC-midnight (inclusive)", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Coverage end as minutes-after-UTC-midnight (inclusive endpoint); a window is the closed interval [start_minute, end_minute]", constraints: "1..1440, > start_minute" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED", default: "ACTIVE", constraints: "ACTIVE | CANCELLED" }

  # --- CalendarSlot : bookable appointment resource for an account ----------
  - name: CalendarSlot
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of bookable day-window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of bookable day-window (exclusive)", constraints: "> window_start" }
      - { name: buffer_minutes, type: integer, source: input, description: "Mandatory clear gap required between two appointments in this slot", default: 0, constraints: ">= 0" }
      - { name: capacity, type: integer, source: input, description: "Maximum non-cancelled appointments this slot may hold", default: 1, constraints: ">= 1" }
      - { name: booked_count, type: integer, source: computed, description: "Count of own Appointments in status IN {REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED, COMPLETED}", default: 0 }
      - { name: available_count, type: integer, source: computed, description: "= capacity - booked_count; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED slots reject new bookings", default: "OPEN", constraints: "OPEN | CLOSED" }

  # --- Call : the inbound call lifecycle (parallel state axes) ---------------
  - name: Call
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: script_id, type: string, source: system, description: "FK -> CallScript.id; PUBLISHED script resolved at intake" }
      - { name: caller_id, type: string, source: input, description: "Caller phone number, or empty string if withheld/anonymous", default: "" }
      - { name: requested_language, type: enum, source: input, description: "EN | ES; language the caller requests", default: "EN" }
      - { name: received_minute, type: integer, source: system, description: "Logical-clock minutes-after-UTC-midnight at intake; drives after-hours classification" }
      - { name: is_after_hours, type: boolean, source: computed, description: "True when received_minute is outside [script.business_open_minute, script.business_close_minute)", default: false }
      - { name: spam_score, type: integer, source: computed, description: "Screening score 0..100; provisional at intake, finalized at WRAP_UP", default: 0 }
      - { name: answered_by_receptionist_id, type: string, source: computed, description: "FK -> Receptionist.id; agent who answered, null until ANSWERED" }
      - { name: handling_status, type: enum, source: system, description: "RINGING | ANSWERED | IN_PROGRESS | WRAP_UP | COMPLETED | OVERFLOW | SCREENED_OUT | ABANDONED", default: "RINGING", constraints: "RINGING | ANSWERED | IN_PROGRESS | WRAP_UP | COMPLETED | OVERFLOW | SCREENED_OUT | ABANDONED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | BILLED | DISPUTED | ADJUSTED; independent of handling_status", default: "UNBILLED", constraints: "UNBILLED | BILLED | DISPUTED | ADJUSTED" }
      - { name: start_second, type: integer, source: system, description: "Logical-clock epoch-seconds when handling_status entered IN_PROGRESS", default: 0 }
      - { name: end_second, type: integer, source: system, description: "Logical-clock epoch-seconds when handling_status entered WRAP_UP", default: 0 }
      - { name: duration_seconds, type: integer, source: computed, description: "= max(0, end_second - start_second); 0 until WRAP_UP", default: 0 }
      - { name: billed_units, type: integer, source: computed, description: "Rounded billable units (minutes for PER_MINUTE, 1 for PER_CALL) charged to the period", default: 0 }
      - { name: charge_cents, type: integer, source: computed, description: "Cents charged for this call after rounding and overage tiering", default: 0 }

  # --- Message : message / lead captured during or after a call -------------
  - name: Message
    parent: null
    common_fields: true
    fields:
      - { name: call_id, type: string, source: input, description: "FK -> Call.id; parent call" }
      - { name: caller_name, type: string, source: input, description: "Captured caller name" }
      - { name: callback_number, type: string, source: input, description: "Captured callback number" }
      - { name: body, type: string, source: input, description: "Message / lead detail text" }
      - { name: is_lead, type: boolean, source: input, description: "True if this is a qualified sales lead", default: false }
      - { name: status, type: enum, source: system, description: "NEW | HANDED_OFF; flips when pushed to CRM", default: "NEW", constraints: "NEW | HANDED_OFF" }

  # --- Escalation : append-only escalation event on a call ------------------
  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - { name: call_id, type: string, source: input, description: "FK -> Call.id; the escalated call" }
      - { name: reason, type: enum, source: input, description: "LONG_RUNNING | CALLER_REQUEST | LANGUAGE; why it escalated", constraints: "LONG_RUNNING | CALLER_REQUEST | LANGUAGE" }
      - { name: escalated_to_receptionist_id, type: string, source: computed, description: "FK -> Receptionist.id; selected senior agent, null if deferred to queue" }
      - { name: status, type: enum, source: system, description: "QUEUED | ASSIGNED | RESOLVED", default: "QUEUED", constraints: "QUEUED | ASSIGNED | RESOLVED" }

  # --- CrmHandoff : append-only CRM push event for a call -------------------
  - name: CrmHandoff
    parent: null
    common_fields: true
    fields:
      - { name: call_id, type: string, source: input, description: "FK -> Call.id; the call whose captures are pushed" }
      - { name: crm_target, type: enum, source: input, description: "SALESFORCE | HUBSPOT | ZOHO; destination CRM", constraints: "SALESFORCE | HUBSPOT | ZOHO" }
      - { name: messages_pushed, type: integer, source: computed, description: "Count of the call's Messages flipped to HANDED_OFF by this handoff", default: 0 }
      - { name: status, type: enum, source: system, description: "PUSHED | FAILED", default: "PUSHED", constraints: "PUSHED | FAILED" }

  # --- Appointment : booking against a calendar slot ------------------------
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: slot_id, type: string, source: input, description: "FK -> CalendarSlot.id; the slot booked into" }
      - { name: origin_call_id, type: string, source: input, description: "FK -> Call.id; the call that produced this booking, null for direct bookings", default: "" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC appointment start; occupies half-open interval [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC appointment end (exclusive)", constraints: "> start_at" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | RESCHEDULE_REQUESTED | COMPLETED | CANCELLED | NO_SHOW", default: "REQUESTED", constraints: "REQUESTED | CONFIRMED | RESCHEDULE_REQUESTED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of times this appointment looped through RESCHEDULE_REQUESTED", default: 0 }

  # --- BillingPeriod : per-account usage and overage ledger -----------------
  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ClientAccount.id; owning account" }
      - { name: plan_id, type: string, source: system, description: "FK -> ServicePlan.id; plan snapshot pinned when the period opened" }
      - { name: period_index, type: integer, source: system, description: "Monotonic per-account period number, starts at 0", default: 0 }
      - { name: included_units, type: integer, source: system, description: "Allowance pinned from plan: included_minutes for PER_MINUTE, included_calls for PER_CALL" }
      - { name: consumed_units, type: integer, source: computed, description: "Sum of billed_units across the period's BILLED/ADJUSTED calls", default: 0 }
      - { name: overage_units, type: integer, source: computed, description: "= max(0, consumed_units - included_units)", default: 0 }
      - { name: overage_charge_cents, type: integer, source: computed, description: "Tiered overage charge for the period; provisional while OPEN, final at CLOSED", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | PENDING_CLOSE | CLOSED; only one OPEN period per account at a time", default: "OPEN", constraints: "OPEN | PENDING_CLOSE | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Call: handling axis (non-linear: branch + parallel with billing) -----
  - entity: Call
    field: handling_status
    initial_state: RINGING
    terminal_states: [COMPLETED, SCREENED_OUT, ABANDONED]
    transitions:
      - from: RINGING
        to: SCREENED_OUT
        trigger: "system, evaluated inside POST /va/calls intake"
        actor: system
        preconditions:
          - "An ACTIVE SpamRule exists for account_id AND (caller_id area code IN blocked_area_codes OR provisional spam_score >= SpamRule.spam_score_threshold)"
        side_effects:
          - "spam_score set to provisional value (spam_score_provisional calculation)"
          - "billing_status stays UNBILLED; call is never charged"
        note: "Spam path is terminal; no receptionist consumed."
      - from: RINGING
        to: ANSWERED
        trigger: "POST /va/calls/{callId}/answer"
        actor: Receptionist
        preconditions:
          - "is_after_hours == false"
          - "ClientAccount.status == ACTIVE"
          - "handling_status == RINGING and not screened out"
          - "selected Receptionist.status == AVAILABLE and active_call_count < max_concurrent_calls"
          - "selected Receptionist.languages contains Call.requested_language"
        side_effects:
          - "answered_by_receptionist_id set to the selected receptionist (answer_routing selector)"
          - "Receptionist.active_call_count unchanged (incremented on IN_PROGRESS)"
      - from: RINGING
        to: OVERFLOW
        trigger: "POST /va/calls/{callId}/answer when no eligible receptionist, or system at intake for after-hours"
        actor: Receptionist
        preconditions:
          - "is_after_hours == true (CallScript.after_hours_action == OVERFLOW) OR (business hours AND no Receptionist eligible per answer_routing selector empty-pool fallback)"
        side_effects:
          - "answered_by_receptionist_id stays null"
          - "ClientAccount.open_call_count unchanged (call remains open)"
        note: "OVERFLOW calls await voicemail/queue; not billed unless later answered."
      - from: RINGING
        to: ABANDONED
        trigger: "POST /va/calls/{callId}/abandon"
        actor: system
        preconditions:
          - "handling_status == RINGING"
        side_effects:
          - "ClientAccount.open_call_count decrements"
      - from: OVERFLOW
        to: ANSWERED
        trigger: "POST /va/calls/{callId}/answer"
        actor: Receptionist
        preconditions:
          - "ClientAccount.status == ACTIVE"
          - "selected Receptionist.status == AVAILABLE and active_call_count < max_concurrent_calls"
          - "selected Receptionist.languages contains Call.requested_language"
        side_effects:
          - "answered_by_receptionist_id set to selected receptionist"
      - from: ANSWERED
        to: IN_PROGRESS
        trigger: "POST /va/calls/{callId}/start"
        actor: Receptionist
        preconditions:
          - "answered_by_receptionist_id is set"
        side_effects:
          - "start_second set to logical clock epoch-seconds"
          - "answering Receptionist.active_call_count increments by 1"
          - "Receptionist.status set to BUSY when active_call_count reaches max_concurrent_calls"
          - "ClientAccount.lifetime_calls_answered increments by 1"
      - from: IN_PROGRESS
        to: WRAP_UP
        trigger: "POST /va/calls/{callId}/wrap"
        actor: Receptionist
        preconditions:
          - "handling_status == IN_PROGRESS"
        side_effects:
          - "end_second set to logical clock epoch-seconds; duration_seconds recomputed"
          - "spam_score finalized (spam_score_final calculation)"
          - "answering Receptionist.active_call_count decrements by 1; Receptionist.status set to AVAILABLE if it was BUSY"
      - from: WRAP_UP
        to: COMPLETED
        trigger: "POST /va/calls/{callId}/complete"
        actor: Receptionist
        preconditions:
          - "handling_status == WRAP_UP"
          - "billing_status == UNBILLED"
        side_effects:
          - "billed_units and charge_cents computed (call_charge calculation) against the account's OPEN BillingPeriod"
          - "billing_status flips UNBILLED -> BILLED"
          - "BillingPeriod.consumed_units += billed_units; overage_units and overage_charge_cents recomputed (billing_overage final variant)"
          - "ClientAccount.open_call_count decrements"
          - "CASCADE: if BillingPeriod.overage_charge_cents >= plan.hard_cap_overage_cents -> ClientAccount.status SUSPENDED (see ClientAccount machine); else if overage_units > 0 -> ClientAccount.status DELINQUENT"

  # --- Call: billing axis (parallel dimension; revert via dispute) ----------
  - entity: Call
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [ADJUSTED]
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "side effect of handling COMPLETED"
        actor: system
        preconditions:
          - "handling_status transition WRAP_UP -> COMPLETED succeeded"
        side_effects:
          - "charge_cents and billed_units frozen onto the call; consumed onto BillingPeriod"
      - from: BILLED
        to: DISPUTED
        trigger: "POST /va/calls/{callId}/dispute"
        actor: AccountOwner
        preconditions:
          - "billing_status == BILLED"
          - "the call's BillingPeriod.status == OPEN"
        side_effects:
          - "no ledger change yet; call flagged for adjustment review"
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /va/calls/{callId}/adjust"
        actor: PlatformAdmin
        preconditions:
          - "billing_status == DISPUTED"
          - "expected_call_version matches Call.version"
        side_effects:
          - "billed_units set to adjusted_units; charge_cents recomputed at adjusted units"
          - "COMPENSATION: BillingPeriod.consumed_units -= (old billed_units - adjusted_units); overage_units, overage_charge_cents recomputed so the minutes-ledger invariant holds"
          - "CASCADE: if recomputed overage_charge_cents < plan.hard_cap_overage_cents AND > 0 -> ClientAccount may revert SUSPENDED -> DELINQUENT (reinstate); if overage_units == 0 -> ClientAccount.status ACTIVE"

  # --- Appointment: cyclic (RESCHEDULE loops back to CONFIRMED) --------------
  - entity: Appointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /va/appointments/{appointmentId}/confirm"
        actor: AccountOwner
        preconditions:
          - "ClientAccount.status IN {ACTIVE, DELINQUENT}"
          - "CalendarSlot.status == OPEN"
        side_effects:
          - "no slot count change (slot already reserved at REQUESTED)"
      - from: CONFIRMED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /va/appointments/{appointmentId}/reschedule"
        actor: AccountOwner
        preconditions:
          - "reschedule_count < 3"
          - "new [start_at, end_at) does not overlap any other non-cancelled appointment in the slot honoring buffer_minutes (slot_overlap rule)"
        side_effects:
          - "start_at, end_at updated to the new interval; reschedule_count increments by 1"
      - from: RESCHEDULE_REQUESTED
        to: CONFIRMED
        trigger: "POST /va/appointments/{appointmentId}/confirm"
        actor: AccountOwner
        preconditions:
          - "ClientAccount.status IN {ACTIVE, DELINQUENT}"
        side_effects:
          - "appointment re-confirmed at the new interval"
        note: "Cycle: CONFIRMED -> RESCHEDULE_REQUESTED -> CONFIRMED, bounded by reschedule_count < 3."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /va/appointments/{appointmentId}/complete"
        actor: AccountOwner
        preconditions:
          - "handling clock has reached end_at (logical clock epoch >= end_at)"
        side_effects:
          - "slot booked_count unchanged (COMPLETED still counts as booked); available_count unchanged"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /va/appointments/{appointmentId}/no-show"
        actor: AccountOwner
        preconditions:
          - "logical clock epoch >= end_at"
        side_effects:
          - "CalendarSlot.booked_count decrements by 1; available_count recomputed (slot frees up)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /va/appointments/{appointmentId}/cancel"
        actor: AccountOwner
        preconditions: []
        side_effects:
          - "CASCADE: CalendarSlot.booked_count decrements by 1; available_count = capacity - booked_count recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /va/appointments/{appointmentId}/cancel"
        actor: AccountOwner
        preconditions: []
        side_effects:
          - "CASCADE: CalendarSlot.booked_count decrements by 1; available_count recomputed"
      - from: RESCHEDULE_REQUESTED
        to: CANCELLED
        trigger: "POST /va/appointments/{appointmentId}/cancel"
        actor: AccountOwner
        preconditions: []
        side_effects:
          - "CASCADE: CalendarSlot.booked_count decrements by 1; available_count recomputed"

  # --- ClientAccount: posture/compound, with reinstate cycle ----------------
  - entity: ClientAccount
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system, bubbled up from a Call COMPLETED that creates overage"
        actor: system
        preconditions:
          - "OPEN BillingPeriod.overage_units > 0"
          - "OPEN BillingPeriod.overage_charge_cents < plan.hard_cap_overage_cents"
        side_effects:
          - "new bookings still allowed; live answering continues"
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "system, bubbled up from a Call COMPLETED crossing the hard cap"
        actor: system
        preconditions:
          - "OPEN BillingPeriod.overage_charge_cents >= plan.hard_cap_overage_cents"
        side_effects:
          - "CASCADE: every own Appointment in {REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED} flips to CANCELLED; each cancellation decrements its CalendarSlot.booked_count and recomputes available_count"
          - "new answer/booking operations rejected with ERR_ACCOUNT_SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, bubbled up from a Call COMPLETED crossing the hard cap directly"
        actor: system
        preconditions:
          - "OPEN BillingPeriod.overage_charge_cents >= plan.hard_cap_overage_cents"
        side_effects:
          - "CASCADE: every own Appointment in {REQUESTED, CONFIRMED, RESCHEDULE_REQUESTED} flips to CANCELLED with slot recompute"
      - from: SUSPENDED
        to: DELINQUENT
        trigger: "system, bubbled up from a Call adjust that drops overage below the hard cap"
        actor: system
        preconditions:
          - "OPEN BillingPeriod.overage_charge_cents < plan.hard_cap_overage_cents AND overage_units > 0"
        side_effects:
          - "answering resumes; previously cancelled appointments are NOT restored"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system, bubbled up from a Call adjust that clears all overage"
        actor: system
        preconditions:
          - "OPEN BillingPeriod.overage_units == 0"
        side_effects: []

  # --- BillingPeriod: linear close-out --------------------------------------
  - entity: BillingPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PENDING_CLOSE
        trigger: "POST /va/billing-periods/{periodId}/close"
        actor: PlatformAdmin
        preconditions:
          - "BillingPeriod.status == OPEN"
          - "no own Call in billing_status == DISPUTED"
          - "expected_period_version matches BillingPeriod.version"
        side_effects:
          - "overage_charge_cents finalized (billing_overage final variant); no new usage accepted"
      - from: PENDING_CLOSE
        to: CLOSED
        trigger: "POST /va/billing-periods/{periodId}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "BillingPeriod.status == PENDING_CLOSE"
        side_effects:
          - "a fresh OPEN BillingPeriod is created with period_index+1; ClientAccount.current_period_id repointed to it"
          - "if the closed period had overage_units == 0, ClientAccount.status set to ACTIVE"

  # --- Receptionist: availability axis --------------------------------------
  - entity: Receptionist
    field: status
    initial_state: OFFLINE
    terminal_states: []
    transitions:
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /va/receptionists/{receptionistId}/go-online"
        actor: Receptionist
        preconditions:
          - "Receptionist has at least one ACTIVE AvailabilityWindow"
        side_effects: []
      - from: AVAILABLE
        to: BUSY
        trigger: "system, side effect of a Call entering IN_PROGRESS"
        actor: system
        preconditions:
          - "active_call_count reaches max_concurrent_calls"
        side_effects: []
      - from: BUSY
        to: AVAILABLE
        trigger: "system, side effect of a Call leaving IN_PROGRESS (WRAP_UP)"
        actor: system
        preconditions:
          - "active_call_count < max_concurrent_calls"
        side_effects: []
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /va/receptionists/{receptionistId}/go-offline"
        actor: Receptionist
        preconditions:
          - "active_call_count == 0"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appointment-book-stale-slot
    parent_entity: CalendarSlot
    write_endpoint: "POST /va/appointments"
    occ_field: "expected_slot_version"
    description: |
      Booking a new Appointment against a CalendarSlot whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another booking has just been created against the same slot (legitimately
      consuming one of its capacity units and bumping the slot's version), so the
      current writer's view of remaining capacity is stale.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

  - rule_id: adjust-stale-call
    parent_entity: Call
    write_endpoint: "POST /va/calls/{callId}/adjust"
    occ_field: "expected_call_version"
    description: |
      Adjusting a DISPUTED Call whose version has advanced since the client last
      observed it is rejected. The call's version legitimately advances when its
      billing ledger or handling fields are mutated, so an adjust carrying a prior
      version is operating on a stale view and is refused.
    error_id: ERR_STALE_CALL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- (1) per-call charge: nested rounding, order pinned (Rule 2 mode b) ----
  - name: call_charge
    trigger: "Call WRAP_UP -> COMPLETED transition"
    algorithm: tiered_pricing
    formula: |
      # billed_units depends on the plan's billing_model.
      if plan.billing_model == PER_CALL:
          billed_units = 1
      else:  # PER_MINUTE
          # ROUNDING ORDER IS PINNED: round THIS call's seconds up to whole minutes
          # FIRST (per-call), then add to the period. Never sum raw seconds across
          # calls and round once. ceil(0 seconds) == 0 (zero-duration call bills 0).
          billed_units = ceil(duration_seconds / 60)   # CEIL_MINUTE

      # The marginal overage charge contributed by THIS call is the difference in
      # the period's tiered overage charge before vs after adding billed_units.
      prev_overage = billing_overage(period, period.consumed_units)
      new_overage  = billing_overage(period, period.consumed_units + billed_units)
      charge_cents = max(0, new_overage - prev_overage)
    input_set: "This single Call's duration_seconds and the account's OPEN BillingPeriod consumed_units snapshot immediately before this call is billed."
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "integer cents; minute rounding is CEIL (round up) per call before summation"
    variants:
      - name: per_minute
        when: "plan.billing_model == PER_MINUTE"
        difference: "billed_units = ceil(duration_seconds/60); a 0-second call bills 0 units"
      - name: per_call
        when: "plan.billing_model == PER_CALL"
        difference: "billed_units = 1 regardless of duration; included_calls allowance applies"

  # --- (2) billing overage: dual-variant provisional vs final (Rule 1) -------
  #         + tiered marginal rate with nested min/max (Rule 2 mode a) --------
  - name: billing_overage
    trigger: "Call COMPLETED (final), Call DISPUTE/adjust (final recompute), and on read of an OPEN BillingPeriod (provisional)"
    algorithm: tiered_pricing
    formula: |
      # Two-tier marginal overage on overage_units = max(0, consumed - included).
      # Inputs: consumed_units, included_units, overage_tier2_threshold (T2),
      #         overage_rate_cents (R1), overage_tier2_rate_cents (R2).  (>= 3 inputs,
      #         nested min/max + conditional tier selection = combinatorial mode a.)
      overage_units = max(0, consumed_units - included_units)
      tier1_units = min(overage_units, T2 - 1)            # units strictly below threshold
      tier2_units = max(0, overage_units - (T2 - 1))      # units at/above threshold
      overage_charge_cents = tier1_units * R1 + tier2_units * R2
    input_set: |
      consumed_units differs by variant:
        - provisional: includes billed_units from BILLED and ADJUSTED calls PLUS an
          estimate for every own Call currently in handling_status IN_PROGRESS or
          WRAP_UP (estimated billed_units = ceil(elapsed_seconds/60) for PER_MINUTE,
          1 for PER_CALL). Forward-looking inclusion of in-flight calls.
        - final: includes billed_units ONLY from calls whose billing_status is BILLED
          or ADJUSTED. In-flight calls are excluded.
    constants:
      DEFAULT_TIER2_THRESHOLD: 100
    precision: "integer cents; no fractional cents; tier boundary uses >= on the unit index"
    variants:
      - name: provisional
        when: "BillingPeriod.status == OPEN and read via GET /va/billing-periods/{periodId} or the overage summary"
        difference: "consumed_units adds an estimate for IN_PROGRESS/WRAP_UP calls; this is an upper-bound preview that may exceed the final charge"
      - name: final
        when: "Call COMPLETED side effect, Call adjust side effect, or BillingPeriod close"
        difference: "consumed_units counts only BILLED/ADJUSTED calls; this is the authoritative charge persisted on the period"

  # --- (3) spam score: weighted scoring, dual-variant (Rule 1, diff domain) --
  - name: spam_score
    trigger: "Call intake (provisional, gates SCREENED_OUT) and Call WRAP_UP (final)"
    algorithm: weighted_scoring
    formula: |
      # base from caller identity + behavior signals.
      score = 0
      if caller_id == "" : score += anonymous_penalty           # SpamRule.anonymous_penalty
      if caller_id area_code IN SpamRule.blocked_area_codes : score += 50
      score = min(100, score)
    input_set: "The matched ACTIVE SpamRule for the account, the Call's caller_id, and (final variant only) whether the call ever reached IN_PROGRESS."
    constants:
      BLOCKED_AREA_CODE_POINTS: 50
      SCORE_CEILING: 100
    precision: "integer 0..100, clamped"
    variants:
      - name: provisional
        when: "computed at intake, before any answer; compared to SpamRule.spam_score_threshold to decide SCREENED_OUT"
        difference: "uses only static signals (anonymous + blocked area code)"
      - name: final
        when: "computed at WRAP_UP"
        difference: "if the call reached IN_PROGRESS (a human engaged), subtract 30 points (floor 0) because human engagement is evidence the call was legitimate"

  # --- (4) answer_routing: selector policy (Rule for selector determinism) ---
  - name: answer_routing
    trigger: "POST /va/calls/{callId}/answer"
    algorithm: weighted_scoring
    formula: |
      # Candidate set: Receptionists with
      #   status == AVAILABLE
      #   AND active_call_count < max_concurrent_calls
      #   AND Call.requested_language IN languages
      # Rank (ascending): primary key = active_call_count ASC (least loaded first);
      #   tie-break 1 = max_concurrent_calls DESC (more headroom first);
      #   tie-break 2 = created_at ASC (oldest receptionist first).
      # Pick the first. Empty candidate set => OVERFLOW fallback (no error).
      selected = first(sort(candidates, by=[active_call_count ASC,
                                            max_concurrent_calls DESC,
                                            created_at ASC]))
    input_set: "All Receptionists (shared pool, not account-scoped), filtered by the eligibility predicate above."
    constants: {}
    precision: "deterministic ordering; created_at ASC final tie-break, never id"
    variants:
      - name: business_hours
        when: "Call.is_after_hours == false"
        difference: "empty candidate set => Call -> OVERFLOW with overflow_action semantics"
      - name: escalation
        when: "selecting a senior agent for an Escalation"
        difference: "candidate set additionally requires Receptionist.max_concurrent_calls >= 2 (senior); empty set => Escalation stays QUEUED"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource id (path + FK body fields) exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity_backed user owns the targeted resource (AccountOwner X-User-ID == resource.account_id; Receptionist X-User-ID == Call.answered_by_receptionist_id where ownership applies)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 5
    category: state
    check: "Optimistic-concurrency: expected_<parent>_version equals current parent version"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /va/appointments, POST /va/calls/{callId}/adjust, POST /va/billing-periods/{periodId}/close"

  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "Acting account is not SUSPENDED for answer/booking/confirm operations"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /va/calls/{callId}/answer, POST /va/appointments, POST /va/appointments/{appointmentId}/confirm"

  - priority: 8
    category: business_safety
    check: "Call cannot be answered after-hours unless CallScript.after_hours_action permits; after-hours calls route to OVERFLOW/VOICEMAIL"
    error_id: ERR_AFTER_HOURS_BLOCKED
    http_status: 409
    applies_to: "POST /va/calls/{callId}/answer"

  - priority: 9
    category: business_constraint
    check: "Selected receptionist must speak Call.requested_language and have capacity (active_call_count < max_concurrent_calls)"
    error_id: ERR_NO_LANGUAGE_MATCH
    http_status: 409
    applies_to: "POST /va/calls/{callId}/answer"

  - priority: 10
    category: business_temporal
    check: "Appointment interval [start_at, end_at) must not overlap another non-cancelled appointment in the slot, honoring buffer_minutes"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /va/appointments, POST /va/appointments/{appointmentId}/reschedule"

  - priority: 11
    category: business_temporal
    check: "An AvailabilityWindow [start_minute, end_minute] must not overlap an existing ACTIVE window for the same receptionist (adjacency end==start is allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /va/receptionists/{receptionistId}/availability-windows"

  - priority: 12
    category: business_constraint
    check: "CalendarSlot must be OPEN and have available_count > 0 to accept a new booking"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /va/appointments"

  - priority: 13
    category: business_constraint
    check: "Appointment reschedule_count must be < 3"
    error_id: ERR_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /va/appointments/{appointmentId}/reschedule"

  - priority: 14
    category: business_fiscal
    check: "A BillingPeriod with any DISPUTED call cannot be closed"
    error_id: ERR_OPEN_DISPUTE
    http_status: 409
    applies_to: "POST /va/billing-periods/{periodId}/close"

  - priority: 15
    category: business_constraint
    check: "Only a PUBLISHED CallScript may route an inbound call; intake fails if the account has no PUBLISHED script"
    error_id: ERR_NO_PUBLISHED_SCRIPT
    http_status: 409
    applies_to: "POST /va/calls"

  - priority: 16
    category: existence
    check: "Required body fields present and enum/range valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/va/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-03-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time. The clock drives received_minute, start_second/end_second, after-hours classification, and appointment completion eligibility."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, epoch_seconds: integer, minute_of_day: integer }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- ServicePlan ----------------------------------------------------------
  - method: POST
    path: "/va/service-plans"
    description: "Create an immutable service plan (price card)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_model, base_fee_cents, overage_rate_cents, overage_tier2_rate_cents, hard_cap_overage_cents, "included_minutes?", "included_calls?", "overage_tier2_threshold?", "minute_rounding?"]
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/va/service-plans/{planId}"
    description: "Get a service plan"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/va/service-plans"
    description: "List service plans"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: ServicePlan[]
    side_effects: []

  # --- ClientAccount --------------------------------------------------------
  - method: POST
    path: "/va/accounts"
    description: "Create a client account; opens its first BillingPeriod (period_index 0)"
    roles: [PlatformAdmin]
    code: 201
    input: [business_name, plan_id, "default_language?"]
    output: ClientAccount
    side_effects:
      - "status=ACTIVE; an OPEN BillingPeriod is created and current_period_id set; included_units pinned from plan"
  - method: GET
    path: "/va/accounts/{accountId}"
    description: "Get a client account with computed posture and counts"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: GET
    path: "/va/accounts"
    description: "List client accounts; filterable by plan_id and current_period_id"
    roles: [PlatformAdmin]
    code: 200
    input: ["plan_id?", "current_period_id?", "status?", "limit?", "offset?"]
    output: ClientAccount[]
    side_effects: []

  # --- CallScript -----------------------------------------------------------
  - method: POST
    path: "/va/call-scripts"
    description: "Create a DRAFT call script for an account"
    roles: [AccountOwner]
    code: 201
    input: [account_id, greeting_en, business_open_minute, business_close_minute, "greeting_es?", "after_hours_action?", "overflow_action?", "escalation_threshold_seconds?"]
    output: CallScript
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/va/call-scripts/{scriptId}"
    description: "Get a call script"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: CallScript
    side_effects: []
  - method: GET
    path: "/va/call-scripts"
    description: "List call scripts; filterable by account_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: CallScript[]
    side_effects: []
  - method: POST
    path: "/va/call-scripts/{scriptId}/publish"
    description: "Publish a DRAFT script (RETIRES any previously PUBLISHED script for the same account)"
    roles: [AccountOwner]
    code: 200
    input: []
    output: CallScript
    side_effects: ["status DRAFT->PUBLISHED; the account's prior PUBLISHED script -> RETIRED"]

  # --- SpamRule -------------------------------------------------------------
  - method: POST
    path: "/va/spam-rules"
    description: "Create a screening rule for an account"
    roles: [AccountOwner, PlatformAdmin]
    code: 201
    input: [account_id, "blocked_area_codes?", "spam_score_threshold?", "anonymous_penalty?"]
    output: SpamRule
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/va/spam-rules/{spamRuleId}"
    description: "Get a spam rule"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: SpamRule
    side_effects: []
  - method: GET
    path: "/va/spam-rules"
    description: "List spam rules; filterable by account_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: SpamRule[]
    side_effects: []

  # --- Receptionist ---------------------------------------------------------
  - method: POST
    path: "/va/receptionists"
    description: "Create a receptionist (shared agent pool)"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, languages, "max_concurrent_calls?"]
    output: Receptionist
    side_effects: ["status=OFFLINE"]
  - method: GET
    path: "/va/receptionists/{receptionistId}"
    description: "Get a receptionist"
    roles: [PlatformAdmin, Receptionist, AccountOwner]
    code: 200
    input: []
    output: Receptionist
    side_effects: []
  - method: GET
    path: "/va/receptionists"
    description: "List receptionists; filterable by status"
    roles: [PlatformAdmin, Receptionist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Receptionist[]
    side_effects: []
  - method: POST
    path: "/va/receptionists/{receptionistId}/go-online"
    description: "Transition receptionist OFFLINE -> AVAILABLE"
    roles: [Receptionist]
    code: 200
    input: []
    output: Receptionist
    side_effects: ["status OFFLINE->AVAILABLE (requires >=1 ACTIVE AvailabilityWindow)"]
  - method: POST
    path: "/va/receptionists/{receptionistId}/go-offline"
    description: "Transition receptionist AVAILABLE -> OFFLINE"
    roles: [Receptionist]
    code: 200
    input: []
    output: Receptionist
    side_effects: ["status AVAILABLE->OFFLINE (requires active_call_count==0)"]

  # --- AvailabilityWindow ---------------------------------------------------
  - method: POST
    path: "/va/receptionists/{receptionistId}/availability-windows"
    description: "Add a coverage window for a receptionist"
    roles: [Receptionist, PlatformAdmin]
    code: 201
    input: [start_minute, end_minute]
    output: AvailabilityWindow
    side_effects: ["status=ACTIVE; rejected if it overlaps an existing ACTIVE window (adjacency allowed)"]
  - method: GET
    path: "/va/availability-windows/{windowId}"
    description: "Get an availability window"
    roles: [PlatformAdmin, Receptionist]
    code: 200
    input: []
    output: AvailabilityWindow
    side_effects: []
  - method: GET
    path: "/va/availability-windows"
    description: "List availability windows; filterable by receptionist_id"
    roles: [PlatformAdmin, Receptionist]
    code: 200
    input: ["receptionist_id?", "limit?", "offset?"]
    output: AvailabilityWindow[]
    side_effects: []

  # --- CalendarSlot ---------------------------------------------------------
  - method: POST
    path: "/va/calendar-slots"
    description: "Create a bookable calendar slot for an account"
    roles: [AccountOwner]
    code: 201
    input: [account_id, window_start, window_end, "buffer_minutes?", "capacity?"]
    output: CalendarSlot
    side_effects: ["status=OPEN; booked_count=0; available_count=capacity"]
  - method: GET
    path: "/va/calendar-slots/{slotId}"
    description: "Get a calendar slot with computed booked/available counts"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: CalendarSlot
    side_effects: []
  - method: GET
    path: "/va/calendar-slots"
    description: "List calendar slots; filterable by account_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: CalendarSlot[]
    side_effects: []
  - method: POST
    path: "/va/calendar-slots/{slotId}/close"
    description: "Close a slot to new bookings"
    roles: [AccountOwner]
    code: 200
    input: []
    output: CalendarSlot
    side_effects: ["status OPEN->CLOSED"]

  # --- Call -----------------------------------------------------------------
  - method: POST
    path: "/va/calls"
    description: "Receive an inbound call; resolves the account's PUBLISHED script, classifies after-hours, runs provisional spam screening, sets RINGING or SCREENED_OUT/OVERFLOW"
    roles: [PlatformAdmin, Receptionist]
    code: 201
    input: [account_id, "caller_id?", "requested_language?"]
    output: Call
    side_effects:
      - "script_id resolved from the account's PUBLISHED CallScript; received_minute stamped; is_after_hours computed"
      - "provisional spam_score computed; SCREENED_OUT if blocked or score>=threshold"
      - "after-hours with after_hours_action OVERFLOW => handling_status OVERFLOW; otherwise RINGING"
      - "ClientAccount.open_call_count increments unless SCREENED_OUT"
  - method: GET
    path: "/va/calls/{callId}"
    description: "Get a call with computed duration, billing and spam fields"
    roles: [PlatformAdmin, AccountOwner, Receptionist]
    code: 200
    input: []
    output: Call
    side_effects: []
  - method: GET
    path: "/va/calls"
    description: "List calls; filterable by account_id, script_id and answered_by_receptionist_id"
    roles: [PlatformAdmin, AccountOwner, Receptionist]
    code: 200
    input: ["account_id?", "script_id?", "answered_by_receptionist_id?", "handling_status?", "billing_status?", "limit?", "offset?"]
    output: Call[]
    side_effects: []
  - method: POST
    path: "/va/calls/{callId}/answer"
    description: "Answer a RINGING/OVERFLOW call; selects a receptionist via answer_routing selector"
    roles: [Receptionist]
    code: 200
    input: []
    output: Call
    side_effects:
      - "answer_routing selects eligible receptionist; handling_status -> ANSWERED, answered_by_receptionist_id set"
      - "empty candidate set during business hours => handling_status OVERFLOW (no error)"
  - method: POST
    path: "/va/calls/{callId}/start"
    description: "Begin the live conversation; ANSWERED -> IN_PROGRESS"
    roles: [Receptionist]
    code: 200
    input: []
    output: Call
    side_effects:
      - "start_second stamped; Receptionist.active_call_count++ and status->BUSY at capacity"
      - "ClientAccount.lifetime_calls_answered++"
  - method: POST
    path: "/va/calls/{callId}/wrap"
    description: "End the conversation; IN_PROGRESS -> WRAP_UP"
    roles: [Receptionist]
    code: 200
    input: []
    output: Call
    side_effects:
      - "end_second stamped; duration_seconds recomputed; final spam_score computed"
      - "Receptionist.active_call_count-- and status->AVAILABLE if it was BUSY"
  - method: POST
    path: "/va/calls/{callId}/complete"
    description: "Finalize and bill the call; WRAP_UP -> COMPLETED, billing UNBILLED -> BILLED"
    roles: [Receptionist]
    code: 200
    input: []
    output: Call
    side_effects:
      - "call_charge computes billed_units and charge_cents; billing_overage(final) recomputed on the OPEN period"
      - "BillingPeriod.consumed_units += billed_units; overage cascade may set ClientAccount DELINQUENT or SUSPENDED"
      - "ClientAccount.open_call_count--"
  - method: POST
    path: "/va/calls/{callId}/abandon"
    description: "Mark a RINGING call ABANDONED"
    roles: [Receptionist, PlatformAdmin]
    code: 200
    input: []
    output: Call
    side_effects: ["handling_status RINGING->ABANDONED; ClientAccount.open_call_count--"]
  - method: POST
    path: "/va/calls/{callId}/dispute"
    description: "Account owner disputes a BILLED call; billing BILLED -> DISPUTED"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Call
    side_effects: ["billing_status BILLED->DISPUTED (only while the period is OPEN)"]
  - method: POST
    path: "/va/calls/{callId}/adjust"
    description: "Platform admin adjusts a DISPUTED call's billable units; billing DISPUTED -> ADJUSTED"
    roles: [PlatformAdmin]
    code: 200
    input: [adjusted_units, expected_call_version]
    output: Call
    side_effects:
      - "billed_units=adjusted_units; charge_cents recomputed; BillingPeriod consumed/overage recomputed (compensation invariant)"
      - "ClientAccount posture may revert SUSPENDED->DELINQUENT or ->ACTIVE; increments Call.version by 1"
  - method: POST
    path: "/va/calls/{callId}/escalate"
    description: "Escalate an IN_PROGRESS call; creates an Escalation and selects a senior agent"
    roles: [Receptionist]
    code: 201
    input: [reason]
    output: Escalation
    side_effects:
      - "Escalation created; answer_routing(escalation) selects a senior agent or leaves it QUEUED"

  # --- Message --------------------------------------------------------------
  - method: POST
    path: "/va/messages"
    description: "Capture a message / lead for a call"
    roles: [Receptionist]
    code: 201
    input: [call_id, caller_name, callback_number, body, "is_lead?"]
    output: Message
    side_effects: ["status=NEW"]
  - method: GET
    path: "/va/messages/{messageId}"
    description: "Get a captured message"
    roles: [PlatformAdmin, AccountOwner, Receptionist]
    code: 200
    input: []
    output: Message
    side_effects: []
  - method: GET
    path: "/va/messages"
    description: "List captured messages; filterable by call_id"
    roles: [PlatformAdmin, AccountOwner, Receptionist]
    code: 200
    input: ["call_id?", "status?", "limit?", "offset?"]
    output: Message[]
    side_effects: []

  # --- Escalation -----------------------------------------------------------
  - method: GET
    path: "/va/escalations/{escalationId}"
    description: "Get an escalation event"
    roles: [PlatformAdmin, Receptionist, AccountOwner]
    code: 200
    input: []
    output: Escalation
    side_effects: []
  - method: GET
    path: "/va/escalations"
    description: "List escalations; filterable by call_id and escalated_to_receptionist_id"
    roles: [PlatformAdmin, Receptionist, AccountOwner]
    code: 200
    input: ["call_id?", "escalated_to_receptionist_id?", "status?", "limit?", "offset?"]
    output: Escalation[]
    side_effects: []
  - method: POST
    path: "/va/escalations/{escalationId}/resolve"
    description: "Resolve an escalation; ASSIGNED/QUEUED -> RESOLVED"
    roles: [Receptionist]
    code: 200
    input: []
    output: Escalation
    side_effects: ["status -> RESOLVED"]

  # --- CrmHandoff -----------------------------------------------------------
  - method: POST
    path: "/va/crm-handoffs"
    description: "Push a completed call's captured messages to a CRM; flips its NEW messages to HANDED_OFF"
    roles: [AccountOwner]
    code: 201
    input: [call_id, crm_target]
    output: CrmHandoff
    side_effects:
      - "every NEW Message on the call flips to HANDED_OFF; messages_pushed counts them; status=PUSHED"
  - method: GET
    path: "/va/crm-handoffs/{handoffId}"
    description: "Get a CRM handoff record"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: CrmHandoff
    side_effects: []
  - method: GET
    path: "/va/crm-handoffs"
    description: "List CRM handoffs; filterable by call_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["call_id?", "limit?", "offset?"]
    output: CrmHandoff[]
    side_effects: []

  # --- Appointment ----------------------------------------------------------
  - method: POST
    path: "/va/appointments"
    description: "Book an appointment into a slot; OCC-guarded on the slot version"
    roles: [AccountOwner, Receptionist]
    code: 201
    input: [account_id, slot_id, start_at, end_at, expected_slot_version, "origin_call_id?"]
    output: Appointment
    side_effects:
      - "status=REQUESTED; CalendarSlot.booked_count++ and available_count recomputed; increments CalendarSlot.version by 1"
  - method: GET
    path: "/va/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/va/appointments"
    description: "List appointments; filterable by account_id, slot_id and origin_call_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_id?", "slot_id?", "origin_call_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/va/appointments/{appointmentId}/confirm"
    description: "Confirm a REQUESTED or RESCHEDULE_REQUESTED appointment"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/va/appointments/{appointmentId}/reschedule"
    description: "Move a CONFIRMED appointment to a new interval; CONFIRMED -> RESCHEDULE_REQUESTED"
    roles: [AccountOwner]
    code: 200
    input: [start_at, end_at]
    output: Appointment
    side_effects: ["start_at/end_at updated; reschedule_count++; overlap re-checked"]
  - method: POST
    path: "/va/appointments/{appointmentId}/complete"
    description: "Mark a CONFIRMED appointment COMPLETED (after end_at)"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/va/appointments/{appointmentId}/no-show"
    description: "Mark a CONFIRMED appointment NO_SHOW (after end_at); frees the slot"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> NO_SHOW; CalendarSlot.booked_count--; available_count recomputed"]
  - method: POST
    path: "/va/appointments/{appointmentId}/cancel"
    description: "Cancel an appointment; frees the slot"
    roles: [AccountOwner]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED; CalendarSlot.booked_count--; available_count recomputed"]

  # --- BillingPeriod --------------------------------------------------------
  - method: GET
    path: "/va/billing-periods/{periodId}"
    description: "Get a billing period; OPEN periods report the provisional overage variant"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: []
  - method: GET
    path: "/va/billing-periods"
    description: "List billing periods; filterable by account_id and plan_id"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: ["account_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []
  - method: GET
    path: "/va/billing-periods/{periodId}/overage-summary"
    description: "Computed read: provisional overage breakdown (tier1/tier2 units and cents) for an OPEN period"
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: "{ consumed_units: integer, overage_units: integer, tier1_units: integer, tier2_units: integer, overage_charge_cents: integer, variant: string }"
    side_effects: []
  - method: POST
    path: "/va/billing-periods/{periodId}/close"
    description: "Begin closing a period; OPEN -> PENDING_CLOSE; finalizes overage"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_period_version]
    output: BillingPeriod
    side_effects: ["overage_charge_cents finalized (final variant); rejected if any call is DISPUTED; increments BillingPeriod.version by 1"]
  - method: POST
    path: "/va/billing-periods/{periodId}/finalize"
    description: "Finalize a closing period; PENDING_CLOSE -> CLOSED; opens the next period"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["status -> CLOSED; a fresh OPEN BillingPeriod (period_index+1) is created and current_period_id repointed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed user is not the owner of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, or out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_SLOT_VERSION, http: 412, condition: "expected_slot_version does not match CalendarSlot.version on booking" }
  - { id: ERR_STALE_CALL_VERSION, http: 412, condition: "expected_call_version does not match Call.version on adjust" }
  - { id: ERR_STALE_PERIOD_VERSION, http: 412, condition: "expected_period_version does not match BillingPeriod.version on close" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Operation rejected because the account is SUSPENDED" }
  - { id: ERR_AFTER_HOURS_BLOCKED, http: 409, condition: "Attempt to answer an after-hours call that is not routable" }
  - { id: ERR_NO_LANGUAGE_MATCH, http: 409, condition: "No eligible receptionist speaks the requested language with capacity" }
  - { id: ERR_NO_RECEPTIONIST_AVAILABLE, http: 409, condition: "Answer attempted but candidate pool is empty during business hours and overflow is unavailable" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Appointment interval overlaps another non-cancelled appointment in the slot (buffer-aware)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Availability window overlaps an existing ACTIVE window for the receptionist" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "CalendarSlot is CLOSED or available_count == 0" }
  - { id: ERR_RESCHEDULE_LIMIT, http: 409, condition: "Appointment has already been rescheduled 3 times" }
  - { id: ERR_OPEN_DISPUTE, http: 409, condition: "Billing period has a DISPUTED call and cannot be closed" }
  - { id: ERR_NO_PUBLISHED_SCRIPT, http: 409, condition: "Account has no PUBLISHED CallScript at call intake" }
  - { id: ERR_NO_AVAILABILITY_WINDOW, http: 409, condition: "Receptionist tried to go online with no ACTIVE availability window" }
  - { id: ERR_RECEPTIONIST_BUSY, http: 409, condition: "Receptionist tried to go offline with active calls in progress" }
  - { id: ERR_PLAN_MISCONFIGURED, http: 422, condition: "Plan billing_model PER_MINUTE with included_calls>0 (or PER_CALL with included_minutes>0), or hard_cap_overage_cents < 1" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "Usage or dispute targeted a non-OPEN billing period" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator: manages plans, accounts, receptionists, the logical clock, billing close-out and dispute adjustments"
    identity: "opaque"
    exclusive_operations:
      - "POST /va/_clock/set_current_utc"
      - "POST /va/service-plans"
      - "POST /va/accounts"
      - "POST /va/receptionists"
      - "POST /va/calls/{callId}/adjust"
      - "POST /va/billing-periods/{periodId}/close"
      - "POST /va/billing-periods/{periodId}/finalize"
    shared_operations:
      - "POST /va/calls (test intake)"
      - "POST /va/spam-rules"
      - "GET reads across accounts, calls, billing, receptionists, appointments"

  - name: AccountOwner
    description: "The client business: owns its scripts, spam rules, calendar slots, appointments, billing and CRM handoffs"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /va/call-scripts"
      - "POST /va/call-scripts/{scriptId}/publish"
      - "POST /va/calendar-slots"
      - "POST /va/calendar-slots/{slotId}/close"
      - "POST /va/appointments/{appointmentId}/confirm"
      - "POST /va/appointments/{appointmentId}/reschedule"
      - "POST /va/appointments/{appointmentId}/complete"
      - "POST /va/appointments/{appointmentId}/no-show"
      - "POST /va/appointments/{appointmentId}/cancel"
      - "POST /va/calls/{callId}/dispute"
      - "POST /va/crm-handoffs"
    shared_operations:
      - "POST /va/spam-rules"
      - "POST /va/appointments"
      - "GET reads scoped to own account"

  - name: Receptionist
    description: "Live-answer agent: receives, answers, runs, wraps, completes, abandons and escalates calls; captures messages"
    identity: "entity_backed:Receptionist"
    exclusive_operations:
      - "POST /va/receptionists/{receptionistId}/go-online"
      - "POST /va/receptionists/{receptionistId}/go-offline"
      - "POST /va/calls/{callId}/answer"
      - "POST /va/calls/{callId}/start"
      - "POST /va/calls/{callId}/wrap"
      - "POST /va/calls/{callId}/complete"
      - "POST /va/calls/{callId}/escalate"
      - "POST /va/escalations/{escalationId}/resolve"
      - "POST /va/messages"
    shared_operations:
      - "POST /va/calls (intake)"
      - "POST /va/calls/{callId}/abandon"
      - "POST /va/appointments"
      - "POST /va/receptionists/{receptionistId}/availability-windows"
      - "GET reads on calls, receptionists, escalations, messages"
