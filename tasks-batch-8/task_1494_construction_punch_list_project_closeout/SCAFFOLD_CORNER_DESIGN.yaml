            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv1: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "REDUCTION", expected_project_version: "${pv1}" }, as: GCProjectManager, captures: { r1: $.data.id } }
