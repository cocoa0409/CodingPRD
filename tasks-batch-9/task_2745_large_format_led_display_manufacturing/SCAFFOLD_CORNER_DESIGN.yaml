              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Too Close Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 2.4, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /projects"
              payload: { customer_name: "Exactly Far Enough Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 2.5, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          assert:
            - "trigger call 1 -> 422 with ${err} == 'ERR_VIEWING_DISTANCE_TOO_SHORT'"
            - "trigger call 2 -> 201: DisplayProject.${pj}.min_viewing_distance_m == 2.5   # exact equality passes"
            - "DisplayModel.${dm}.recommended_min_viewing_distance_m == 2.5"

      - name: roadside_project_without_redundancy_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_REDUNDANCY_REQUIRED_FOR_ROADSIDE
        distinguishing_aspect: |
          The rule is conditional on ONE enum value: redundancy_mode NONE is
          perfectly legal for STADIUM and RETAIL and illegal only for ROADSIDE, so
          the check must be keyed on install_environment rather than applied
          globally. The same body that fails as ROADSIDE succeeds as STADIUM.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
