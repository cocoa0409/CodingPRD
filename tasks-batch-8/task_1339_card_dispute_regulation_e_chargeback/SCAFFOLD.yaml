# =============================================================================
# Scaffold: Card Dispute & Regulation E Chargeback (issuer)
# =============================================================================

scenario: |
  Card Dispute & Regulation E Chargeback (issuer): dispute intake & provisional
  credit timing rules, error resolution investigation window by transaction type,
  chargeback reason code selection & network deadlines, merchant representment
  review & second presentment, arbitration/pre-compliance decision & cost, fraud
  vs non-fraud classification & liability shift, provisional credit reversal
  notification, loss recognition & recovery

domain_name: card-dispute-reg-e-chargeback
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CardAccount
    parent: null
    common_fields: true
    fields:
      - { name: cardholder_name, type: string, source: input, description: "Cardholder legal name" }
      - { name: initial_balance_cents, type: integer, source: input, default: 0, description: "Opening ledger balance in cents" }
      - { name: opened_at, type: datetime, source: system, description: "Set to logical clock time at creation; drives new-account rule (<=30 days)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED (RESTRICTED while any non-terminal fraud dispute exists)" }
      - { name: balance_cents, type: integer, source: system, description: "Ledger balance; debited/credited by provisional credit grant/reverse/reinstate/true-up" }
      - { name: provisional_outstanding_cents, type: integer, source: computed, description: "Sum of amount_cents over ProvisionalCredits in GRANTED or REINSTATED for this account" }

  - name: CardTransaction
    parent: null
    common_fields: true
    fields:
      - { name: card_account_id, type: string, source: input, description: "FK -> CardAccount.id; owning account" }
      - { name: merchant_name, type: string, source: input, description: "Merchant descriptor" }
      - { name: amount_cents, type: integer, source: input, description: "Posted amount in cents (> 0)" }
      - { name: transaction_type, type: enum, source: input, description: "POS_PIN | POS_SIGNATURE | ATM_WITHDRAWAL | ECOMMERCE | RECURRING" }
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD" }
      - { name: posted_at, type: datetime, source: input, description: "Posting timestamp (client-supplied for backdated seeding)" }
      - { name: status, type: enum, source: system, description: "POSTED | DISPUTED | CHARGED_BACK | RE_PRESENTED | SETTLED" }

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - { name: card_transaction_id, type: string, source: input, description: "FK -> CardTransaction.id; disputed transaction" }
      - { name: card_account_id, type: string, source: system, description: "FK -> CardAccount.id; copied from the transaction at intake" }
      - { name: intake_agent_id, type: string, source: system, description: "X-User-ID of the IntakeAgent who filed; null when filed by Cardholder" }
      - { name: error_type, type: enum, source: input, description: "UNAUTHORIZED | INCORRECT_AMOUNT | DUPLICATE_CHARGE | SERVICE_NOT_RECEIVED | CANCELLED_RECURRING" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Amount claimed; must be > 0 and <= transaction amount_cents" }
      - { name: claimed_report_delay_days, type: integer, source: input, description: "Cardholder-claimed calendar days between posted_at and report; drives provisional liability tier" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at intake; all Reg E deadlines anchor here" }
      - { name: is_fraud_claim, type: boolean, source: system, description: "Set by classify/reclassify; drives liability shift and investigation window" }
      - { name: verified_report_delay_days, type: integer, source: system, description: "Investigator-verified report delay; drives final liability tier" }
      - { name: provisional_holdback_cents, type: integer, source: computed, description: "Cardholder-borne holdback withheld from provisional credit (fraud tiers; 0 for non-fraud)" }
      - { name: provisional_credit_due_at, type: datetime, source: computed, description: "received_at + 10 business days (20 if new account), end-of-day 23:59:59Z, inclusive" }
      - { name: investigation_window_days, type: integer, source: computed, description: "90 if fraud / POS_PIN / POS_SIGNATURE / new account; else 45" }
      - { name: investigation_deadline_at, type: datetime, source: computed, description: "received_at + investigation_window_days calendar days, end-of-day 23:59:59Z, inclusive" }
      - { name: final_liability_cents, type: integer, source: computed, description: "Final cardholder-borne amount from verified tier at resolution" }
      - { name: cardholder_keeps_cents, type: integer, source: computed, description: "Finalized credit the cardholder retains (0 until resolution)" }
      - { name: outstanding_loss_cents, type: integer, source: computed, description: "sum(LOSS_RECOGNIZED) - sum(RECOVERY_RECEIVED) over LossRecovery entries" }
      - { name: status, type: enum, source: system, description: "RECEIVED | CLASSIFIED | CHARGEBACK_FILED | REPRESENTMENT_REVIEW | REVERSAL_PENDING | RESOLVED_CARDHOLDER_FAVOR | RESOLVED_MERCHANT_FAVOR | WITHDRAWN" }

  - name: ProvisionalCredit
    parent: null
    common_fields: true
    fields:
      - { name: dispute_case_id, type: string, source: system, description: "FK -> DisputeCase.id; case this credit funds" }
      - { name: amount_cents, type: integer, source: computed, description: "claim_amount_cents - provisional_holdback_cents at grant time" }
      - { name: final_amount_cents, type: integer, source: system, description: "Set at finalization after verified-liability true-up; null while open" }
      - { name: granted_at, type: datetime, source: system, description: "Logical clock time at grant" }
      - { name: granted_late, type: boolean, source: computed, description: "true if granted_at > dispute.provisional_credit_due_at" }
      - { name: reversed_at, type: datetime, source: system, description: "Logical clock time of last reversal; null if never reversed" }
      - { name: status, type: enum, source: system, description: "GRANTED | REVERSED | REINSTATED | FINALIZED" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: dispute_case_id, type: string, source: input, description: "FK -> DisputeCase.id; case being pursued via network" }
      - { name: card_transaction_id, type: string, source: system, description: "FK -> CardTransaction.id; copied from the case" }
      - { name: reason_code, type: enum, source: input, description: "V10_4 | V10_5 | V13_1 | V13_3 | M4837 | M4870 | M4853 | M4855; must match network and fraud classification" }
      - { name: amount_cents, type: integer, source: input, description: "Chargeback amount; defaults to claim_amount_cents when omitted" }
      - { name: network, type: enum, source: system, description: "Copied from transaction: VISA | MASTERCARD" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock time at filing" }
      - { name: network_filing_deadline_at, type: datetime, source: computed, description: "transaction posted_at + NETWORK_FILING_DAYS[network] (VISA 120, MASTERCARD 90), end-of-day inclusive" }
      - { name: response_window_end_at, type: datetime, source: computed, description: "filed_at + MERCHANT_RESPONSE_DAYS (30), end-of-day inclusive; half-open occupancy [filed_at, response_window_end_at)" }
      - { name: fees_total_cents, type: integer, source: computed, description: "FILING_FEE + per-stage escalation fee actually entered (per-stage round_half_up, then sum)" }
      - { name: stage_entered, type: enum, source: system, description: "NONE | PRE_COMPLIANCE | ARBITRATION; which escalation variant was chosen" }
      - { name: outcome, type: enum, source: system, description: "WON | LOST | WITHDRAWN | null while open" }
      - { name: status, type: enum, source: system, description: "FILED | REPRESENTED | SECOND_PRESENTED | CLOSED_WON | CLOSED_LOST | CANCELLED | WITHDRAWN" }

  - name: Representment
    parent: null
    common_fields: true
    fields:
      - { name: chargeback_id, type: string, source: system, description: "FK -> Chargeback.id; chargeback being contested" }
      - { name: merchant_ref, type: string, source: input, description: "Merchant reference for the representment package" }
      - { name: evidence_documents, type: array, source: input, description: "Non-empty list of {doc_type, reference}; empty array rejected with ERR_EVIDENCE_REQUIRED" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at registration" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | REJECTED" }

  - name: Notification
    parent: null
    common_fields: false
    fields:
      - { name: dispute_case_id, type: string, source: system, description: "FK -> DisputeCase.id; case the letter concerns" }
      - { name: type, type: enum, source: system, description: "PROVISIONAL_CREDIT_ADVICE | REVERSAL_NOTICE | RESOLUTION_LETTER" }
      - { name: sent_at, type: datetime, source: system, description: "Logical clock time at creation; letters are SENT at creation" }
      - { name: detail, type: string, source: system, description: "Human-readable body summary" }

  - name: LossRecovery
    parent: null
    common_fields: false
    fields:
      - { name: dispute_case_id, type: string, source: system, description: "FK -> DisputeCase.id; case the ledger entry belongs to" }
      - { name: type, type: enum, source: system, description: "LOSS_RECOGNIZED | RECOVERY_RECEIVED" }
      - { name: amount_cents, type: integer, source: input, description: "Entry amount (> 0); auto entries are system-computed" }
      - { name: source, type: enum, source: system, description: "AUTO (cascade-created) | MANUAL (FinanceOfficer entry)" }
      - { name: memo, type: string, source: input, description: "Optional note for manual entries", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CardAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system cascade on POST /disputes/{id}/classify or /reclassify with is_fraud_claim=true"
        actor: system
        preconditions: ["No other non-terminal fraud dispute already restricting (idempotent)"]
        side_effects: ["POST /card-transactions for this account now fails with ERR_ACCOUNT_RESTRICTED"]
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system cascade on dispute resolution/withdrawal/reclassify when no remaining non-terminal fraud DisputeCase references this account"
        actor: system
        preconditions: ["count(DisputeCase where card_account_id = account.id AND is_fraud_claim = true AND status IN {RECEIVED, CLASSIFIED, CHARGEBACK_FILED, REPRESENTMENT_REVIEW, REVERSAL_PENDING}) == 0"]
        side_effects: []

  - entity: CardTransaction
    initial_state: POSTED
    terminal_states: [SETTLED]
    transitions:
      - from: POSTED
        to: DISPUTED
        trigger: POST /disputes
        actor: Cardholder | IntakeAgent
        preconditions:
          - "No non-terminal DisputeCase references this transaction (else ERR_DUPLICATE_ACTIVE_DISPUTE)"
        side_effects: ["DisputeCase created in RECEIVED with received_at = logical clock"]
      - from: DISPUTED
        to: CHARGED_BACK
        trigger: POST /chargebacks
        actor: ChargebackAnalyst
        preconditions: ["DisputeCase.status == CLASSIFIED"]
        side_effects: ["DisputeCase CLASSIFIED -> CHARGEBACK_FILED"]
      - from: CHARGED_BACK
        to: RE_PRESENTED
        trigger: POST /chargebacks/{id}/representments
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["DisputeCase CHARGEBACK_FILED -> REPRESENTMENT_REVIEW"]
      - from: RE_PRESENTED
        to: CHARGED_BACK
        trigger: POST /chargebacks/{id}/review-representment with decision=REJECT (second presentment)
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["DisputeCase REPRESENTMENT_REVIEW -> CHARGEBACK_FILED"]
      - from: DISPUTED
        to: SETTLED
        trigger: "system cascade on DisputeCase reaching RESOLVED_CARDHOLDER_FAVOR / RESOLVED_MERCHANT_FAVOR / WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHARGED_BACK
        to: SETTLED
        trigger: "system cascade on DisputeCase terminal resolution"
        actor: system
        preconditions: []
        side_effects: []
      - from: RE_PRESENTED
        to: SETTLED
        trigger: "system cascade on DisputeCase terminal resolution"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHARGED_BACK
        to: DISPUTED
        trigger: POST /chargebacks/{id}/withdraw
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["DisputeCase CHARGEBACK_FILED -> CLASSIFIED (refile path)"]

  - entity: DisputeCase
    initial_state: RECEIVED
    terminal_states: [RESOLVED_CARDHOLDER_FAVOR, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: CLASSIFIED
        trigger: POST /disputes/{id}/classify
        actor: DisputeInvestigator
        preconditions: []
        side_effects:
          - "Set is_fraud_claim, verified_report_delay_days"
          - "Recompute provisional_holdback_cents (claimed tier still used for credit; verified tier stored for final)"
          - "Compute investigation_window_days and investigation_deadline_at"
          - "If is_fraud_claim: CardAccount ACTIVE -> RESTRICTED"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: POST /disputes/{id}/reclassify
        actor: DisputeInvestigator
        preconditions: ["expected_dispute_version == current version (else ERR_STALE_VERSION)"]
        side_effects:
          - "Recompute fraud flag, verified delay, investigation_window_days, investigation_deadline_at, provisional_holdback_cents"
          - "If fraud flag flipped true: CardAccount -> RESTRICTED; if flipped false and no other open fraud cases: CardAccount -> ACTIVE"
          - "increments DisputeCase.version by 1"
      - from: CLASSIFIED
        to: CHARGEBACK_FILED
        trigger: POST /chargebacks
        actor: ChargebackAnalyst
        preconditions:
          - "now <= network_filing_deadline_at (posted_at + NETWORK_FILING_DAYS[network], end-of-day inclusive; else ERR_NETWORK_DEADLINE_PASSED)"
          - "No other Chargeback on same transaction with now in [filed_at, response_window_end_at) (else ERR_NETWORK_WINDOW_ACTIVE)"
          - "reason_code matches network and is_fraud_claim (else ERR_REASON_CODE_MISMATCH)"
        side_effects:
          - "Chargeback created FILED with filed_at = clock, fees_total_cents = FILING_FEE_CENTS, stage_fees accrued"
          - "CardTransaction DISPUTED -> CHARGED_BACK"
      - from: CHARGEBACK_FILED
        to: REPRESENTMENT_REVIEW
        trigger: POST /chargebacks/{id}/representments
        actor: ChargebackAnalyst
        preconditions: ["Chargeback.status == FILED", "evidence_documents non-empty (else ERR_EVIDENCE_REQUIRED)"]
        side_effects:
          - "Representment created PENDING_REVIEW"
          - "CardTransaction CHARGED_BACK -> RE_PRESENTED"
      - from: REPRESENTMENT_REVIEW
        to: CHARGEBACK_FILED
        trigger: POST /chargebacks/{id}/review-representment with decision=REJECT (second presentment)
        actor: ChargebackAnalyst
        preconditions: []
        side_effects:
          - "Representment PENDING_REVIEW -> REJECTED"
          - "Chargeback REPRESENTED -> SECOND_PRESENTED"
          - "CardTransaction RE_PRESENTED -> CHARGED_BACK"
      - from: REPRESENTMENT_REVIEW
        to: REVERSAL_PENDING
        trigger: "system cascade on review-representment decision=ACCEPT (chargeback CLOSED_LOST) when a ProvisionalCredit is GRANTED or REINSTATED"
        actor: system
        preconditions: []
        side_effects:
          - "Notification REVERSAL_NOTICE created (sent_at = clock)"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = chargeback fees_total_cents + finalized credit principal borne by issuer (0 if credit not FINALIZED)"
      - from: REPRESENTMENT_REVIEW
        to: RESOLVED_MERCHANT_FAVOR
        trigger: "system cascade on review-representment decision=ACCEPT when no ProvisionalCredit is open"
        actor: system
        preconditions: []
        side_effects:
          - "Notification RESOLUTION_LETTER created"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = chargeback fees_total_cents"
          - "CardTransaction -> SETTLED"
      - from: CHARGEBACK_FILED
        to: REVERSAL_PENDING
        trigger: "system cascade on escalate outcome LOST or WITHDRAWN when a ProvisionalCredit is GRANTED or REINSTATED"
        actor: system
        preconditions: []
        side_effects:
          - "Notification REVERSAL_NOTICE created (sent_at = clock)"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = fees_total_cents (+ finalized principal if credit FINALIZED)"
      - from: CHARGEBACK_FILED
        to: RESOLVED_CARDHOLDER_FAVOR
        trigger: "system cascade on escalate outcome WON"
        actor: system
        preconditions: []
        side_effects:
          - "Final credit F = claim_amount_cents - final_liability_cents; open ProvisionalCredit -> FINALIZED with true-up (final_amount_cents = F)"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = F + chargeback fees_total_cents (created only when > 0)"
          - "LossRecovery RECOVERY_RECEIVED auto-entry = chargeback amount_cents"
          - "cardholder_keeps_cents = F"
          - "Notification RESOLUTION_LETTER created"
          - "CardTransaction -> SETTLED"
          - "CardAccount RESTRICTED -> ACTIVE if no other open fraud cases"
      - from: CHARGEBACK_FILED
        to: RESOLVED_MERCHANT_FAVOR
        trigger: "system cascade on escalate outcome LOST/WITHDRAWN when no ProvisionalCredit is open"
        actor: system
        preconditions: []
        side_effects:
          - "Notification RESOLUTION_LETTER created"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = fees_total_cents"
          - "CardTransaction -> SETTLED"
      - from: CHARGEBACK_FILED
        to: CLASSIFIED
        trigger: POST /chargebacks/{id}/withdraw (chargeback CANCELLED, refile path)
        actor: ChargebackAnalyst
        preconditions: ["Chargeback.status == FILED"]
        side_effects:
          - "CardTransaction CHARGED_BACK -> DISPUTED"
          - "Filing fee remains accrued on the CANCELLED chargeback record"
      - from: CLASSIFIED
        to: RESOLVED_CARDHOLDER_FAVOR
        trigger: POST /disputes/{id}/resolve with outcome=ERROR_CONFIRMED
        actor: DisputeInvestigator
        preconditions:
          - "If now > provisional_credit_due_at and no ProvisionalCredit exists in GRANTED/REINSTATED/FINALIZED: ERR_PROVISIONAL_CREDIT_REQUIRED"
          - "SoD: X-User-ID != intake_agent_id when intake_agent_id is set (else ERR_SOD_VIOLATION)"
        side_effects:
          - "final_liability_cents from verified tier; final credit F = claim_amount_cents - final_liability_cents"
          - "If credit open: true-up account balance by (F - current amount), credit -> FINALIZED with final_amount_cents = F"
          - "If no credit existed: create ProvisionalCredit directly FINALIZED with final_amount_cents = F; balance += F"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = F (created only when F > 0); cardholder_keeps_cents = F"
          - "Notification RESOLUTION_LETTER created"
          - "CardTransaction -> SETTLED"
          - "CardAccount RESTRICTED -> ACTIVE if no other open fraud cases"
      - from: CLASSIFIED
        to: REVERSAL_PENDING
        trigger: POST /disputes/{id}/resolve with outcome=NO_ERROR and an open ProvisionalCredit
        actor: DisputeInvestigator
        preconditions:
          - "now <= investigation_deadline_at (else ERR_INVESTIGATION_WINDOW_EXPIRED)"
          - "SoD: X-User-ID != intake_agent_id when set (else ERR_SOD_VIOLATION)"
        side_effects:
          - "Notification REVERSAL_NOTICE created (sent_at = clock)"
      - from: CLASSIFIED
        to: RESOLVED_MERCHANT_FAVOR
        trigger: POST /disputes/{id}/resolve with outcome=NO_ERROR and no open ProvisionalCredit
        actor: DisputeInvestigator
        preconditions:
          - "If now > provisional_credit_due_at and no credit ever granted: ERR_PROVISIONAL_CREDIT_REQUIRED"
          - "now <= investigation_deadline_at (else ERR_INVESTIGATION_WINDOW_EXPIRED)"
          - "SoD: X-User-ID != intake_agent_id when set (else ERR_SOD_VIOLATION)"
        side_effects:
          - "Notification RESOLUTION_LETTER created"
          - "CardTransaction -> SETTLED"
      - from: REVERSAL_PENDING
        to: RESOLVED_MERCHANT_FAVOR
        trigger: "system cascade on POST /provisional-credits/{id}/reverse completing the open credit's reversal"
        actor: system
        preconditions: []
        side_effects:
          - "Notification RESOLUTION_LETTER created"
          - "CardTransaction -> SETTLED"
          - "CardAccount RESTRICTED -> ACTIVE if no other open fraud cases"
      - from: RESOLVED_MERCHANT_FAVOR
        to: RESOLVED_CARDHOLDER_FAVOR
        trigger: "system cascade on POST /provisional-credits/{id}/reinstate (erroneous-reversal correction loop)"
        actor: system
        preconditions: []
        side_effects:
          - "LossRecovery LOSS_RECOGNIZED auto-entry = reinstated amount_cents (issuer now bears principal)"
          - "Notification RESOLUTION_LETTER created"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: POST /disputes/{id}/withdraw
        actor: Cardholder | IntakeAgent
        preconditions: ["Cardholder actor: transaction's card_account_id == X-User-ID"]
        side_effects: ["CardTransaction DISPUTED -> SETTLED", "CardAccount restore if applicable"]
      - from: CLASSIFIED
        to: WITHDRAWN
        trigger: POST /disputes/{id}/withdraw
        actor: Cardholder | IntakeAgent
        preconditions: []
        side_effects:
          - "If ProvisionalCredit GRANTED/REINSTATED: auto-reverse immediately (balance -= amount, outstanding -= amount, credit -> REVERSED) — cardholder-initiated withdrawal waives the 3-business-day notice"
          - "CardTransaction -> SETTLED"
          - "CardAccount RESTRICTED -> ACTIVE if no other open fraud cases"

  - entity: ProvisionalCredit
    initial_state: GRANTED
    terminal_states: [FINALIZED]
    transitions:
      - from: GRANTED
        to: FINALIZED
        trigger: "POST /disputes/{id}/resolve outcome=ERROR_CONFIRMED OR system cascade on chargeback CLOSED_WON"
        actor: DisputeInvestigator | system
        preconditions: []
        side_effects:
          - "final_amount_cents set (resolve: claim - final_liability; CLOSED_WON: current amount)"
          - "True-up CardAccount.balance_cents by (final_amount - amount) on resolve"
          - "CardAccount.provisional_outstanding_cents -= current amount"
      - from: GRANTED
        to: REVERSED
        trigger: "POST /provisional-credits/{id}/reverse OR auto on dispute withdraw"
        actor: FinanceOfficer | system
        preconditions:
          - "Manual reverse: DisputeCase.status == REVERSAL_PENDING"
          - "Manual reverse: a REVERSAL_NOTICE Notification with business_days_between(sent_at, now) >= 3 exists (else ERR_REVERSAL_NOTICE_PENDING)"
        side_effects:
          - "CardAccount.balance_cents -= amount_cents; provisional_outstanding_cents -= amount_cents"
          - "reversed_at = clock"
          - "system cascade: DisputeCase REVERSAL_PENDING -> RESOLVED_MERCHANT_FAVOR (+ RESOLUTION_LETTER, transaction SETTLED, account restore)"
      - from: REVERSED
        to: REINSTATED
        trigger: POST /provisional-credits/{id}/reinstate
        actor: FinanceOfficer
        preconditions: ["DisputeCase.status == RESOLVED_MERCHANT_FAVOR"]
        side_effects:
          - "CardAccount.balance_cents += amount_cents; provisional_outstanding_cents += amount_cents"
          - "system cascade: DisputeCase RESOLVED_MERCHANT_FAVOR -> RESOLVED_CARDHOLDER_FAVOR (+ LOSS_RECOGNIZED auto-entry = amount_cents)"
      - from: REINSTATED
        to: REVERSED
        trigger: POST /provisional-credits/{id}/reverse
        actor: FinanceOfficer
        preconditions: ["DisputeCase.status == REVERSAL_PENDING", "REVERSAL_NOTICE cooling satisfied"]
        side_effects: ["CardAccount.balance_cents -= amount_cents; provisional_outstanding_cents -= amount_cents"]
      - from: REINSTATED
        to: FINALIZED
        trigger: "POST /disputes/{id}/resolve outcome=ERROR_CONFIRMED (after re-opened investigation) or chargeback CLOSED_WON"
        actor: DisputeInvestigator | system
        preconditions: []
        side_effects: ["Same true-up semantics as GRANTED -> FINALIZED"]

  - entity: Chargeback
    initial_state: FILED
    terminal_states: [CLOSED_WON, CLOSED_LOST, CANCELLED, WITHDRAWN]
    transitions:
      - from: FILED
        to: REPRESENTED
        trigger: POST /chargebacks/{id}/representments
        actor: ChargebackAnalyst
        preconditions: ["evidence_documents non-empty (else ERR_EVIDENCE_REQUIRED)"]
        side_effects: ["Representment PENDING_REVIEW created", "CardTransaction CHARGED_BACK -> RE_PRESENTED", "DisputeCase CHARGEBACK_FILED -> REPRESENTMENT_REVIEW"]
      - from: REPRESENTED
        to: SECOND_PRESENTED
        trigger: POST /chargebacks/{id}/review-representment with decision=REJECT
        actor: ChargebackAnalyst
        preconditions: ["A Representment in PENDING_REVIEW exists"]
        side_effects: ["Representment -> REJECTED", "CardTransaction RE_PRESENTED -> CHARGED_BACK", "DisputeCase REPRESENTMENT_REVIEW -> CHARGEBACK_FILED"]
      - from: REPRESENTED
        to: CLOSED_LOST
        trigger: POST /chargebacks/{id}/review-representment with decision=ACCEPT
        actor: ChargebackAnalyst
        preconditions: []
        side_effects:
          - "Representment -> ACCEPTED; outcome = LOST"
          - "DisputeCase -> REVERSAL_PENDING (credit open) or RESOLVED_MERCHANT_FAVOR (no open credit) with REVERSAL_NOTICE/RESOLUTION_LETTER"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = fees_total_cents + finalized principal borne by issuer"
      - from: SECOND_PRESENTED
        to: CLOSED_WON
        trigger: POST /chargebacks/{id}/escalate with outcome=WON
        actor: ChargebackAnalyst
        preconditions: ["stage IN {PRE_COMPLIANCE, ARBITRATION}"]
        side_effects:
          - "fees_total_cents += stage fee (per-stage round_half_up); stage_entered set"
          - "Final credit F = case claim_amount_cents - final_liability_cents; open ProvisionalCredit -> FINALIZED (final_amount_cents = F, balance true-up)"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = F + fees_total_cents (when > 0); RECOVERY_RECEIVED auto-entry = amount_cents"
          - "DisputeCase -> RESOLVED_CARDHOLDER_FAVOR; transaction SETTLED; RESOLUTION_LETTER; account restore if applicable"
      - from: SECOND_PRESENTED
        to: CLOSED_LOST
        trigger: POST /chargebacks/{id}/escalate with outcome=LOST
        actor: ChargebackAnalyst
        preconditions: []
        side_effects:
          - "fees_total_cents += stage fee; stage_entered set; outcome = LOST"
          - "LossRecovery LOSS_RECOGNIZED auto-entry = fees_total_cents + finalized principal if any"
          - "DisputeCase -> REVERSAL_PENDING or RESOLVED_MERCHANT_FAVOR per open credit"
      - from: SECOND_PRESENTED
        to: WITHDRAWN
        trigger: POST /chargebacks/{id}/escalate with outcome=WITHDRAWN
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["Same loss cascade as LOST (withdrawal at arbitration concedes the case)"]
      - from: FILED
        to: CANCELLED
        trigger: POST /chargebacks/{id}/withdraw
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["CardTransaction CHARGED_BACK -> DISPUTED", "DisputeCase CHARGEBACK_FILED -> CLASSIFIED (refile permitted once response window lapses)"]

  - entity: Representment
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: POST /chargebacks/{id}/review-representment with decision=ACCEPT
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["Chargeback REPRESENTED -> CLOSED_LOST cascade"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: POST /chargebacks/{id}/review-representment with decision=REJECT
        actor: ChargebackAnalyst
        preconditions: []
        side_effects: ["Chargeback REPRESENTED -> SECOND_PRESENTED cascade"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dispute-reclassify-stale-version
    parent_entity: DisputeCase
    write_endpoint: "POST /disputes/{id}/reclassify"
    occ_field: expected_dispute_version
    description: |
      Reclassifying a DisputeCase whose version has advanced since the client
      last observed it is rejected. Reclassification is legitimate repeatedly
      while the case is CLASSIFIED, so a second sequential request carrying a
      stale expected_dispute_version would otherwise silently overwrite a
      colleague's updated fraud classification; OCC on DisputeCase.version
      rejects it deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: consumer_liability_holdback
    trigger: "dispute intake (provisional variant, from claimed_report_delay_days) and classify/reclassify/resolve (final variant, from verified_report_delay_days)"
    algorithm: threshold
    formula: |
      if not is_fraud_claim: holdback = 0
      else:
        delay = claimed_report_delay_days (provisional) | verified_report_delay_days (final)
        if delay <= TIER1_MAX_DELAY_DAYS:  cap = TIER1_CAP_CENTS
        elif delay <= TIER2_MAX_DELAY_DAYS: cap = TIER2_CAP_CENTS
        else:                                cap = claim_amount_cents
        holdback = min(cap, claim_amount_cents)
      provisional_holdback_cents uses claimed delay; final_liability_cents uses verified delay.
    input_set: "the DisputeCase under classification/resolution"
    constants:
      TIER1_MAX_DELAY_DAYS: 2
      TIER2_MAX_DELAY_DAYS: 60
      TIER1_CAP_CENTS: 5000
      TIER2_CAP_CENTS: 50000
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "at intake / provisional credit grant; uses claimed_report_delay_days"
        difference: "produces provisional_holdback_cents withheld from the grant; may diverge from final when the investigator verifies a different delay tier"
      - name: final
        when: "at classify/reclassify/resolve; uses verified_report_delay_days"
        difference: "produces final_liability_cents; final credit = claim_amount_cents - final_liability_cents, trued up against the provisional grant"

  - name: provisional_credit_amount
    trigger: "POST /disputes/{id}/grant-provisional-credit"
    algorithm: aggregation
    formula: |
      amount_cents = max(0, claim_amount_cents - provisional_holdback_cents)
      granted_late = (clock now > dispute.provisional_credit_due_at)
    input_set: "the DisputeCase in CLASSIFIED status"
    constants: {}
    precision: "integer cents"

  - name: investigation_window
    trigger: "POST /disputes/{id}/classify and /reclassify"
    algorithm: threshold
    formula: |
      account_is_new = (transaction.posted_at - account.opened_at) <= NEW_ACCOUNT_MAX_AGE_DAYS days
      if is_fraud_claim: window = 90
      elif transaction_type IN {POS_PIN, POS_SIGNATURE}: window = 90
      elif account_is_new: window = 90
      else: window = 45
      investigation_window_days = window
      investigation_deadline_at = date(received_at) + window calendar days at 23:59:59Z (inclusive)
    input_set: "DisputeCase + its CardTransaction + its CardAccount"
    constants:
      WINDOW_STANDARD_DAYS: 45
      WINDOW_EXTENDED_DAYS: 90
      NEW_ACCOUNT_MAX_AGE_DAYS: 30
    precision: "calendar days; deadline inclusive at end-of-day UTC"

  - name: provisional_credit_deadline
    trigger: "dispute intake (compute), resolve/grant (enforce)"
    algorithm: chronological
    formula: |
      account_is_new = (transaction.posted_at - account.opened_at) <= NEW_ACCOUNT_MAX_AGE_DAYS days
      n_bd = BD_NEW_ACCOUNT if account_is_new else BD_STANDARD
      provisional_credit_due_at = add_business_days(date(received_at), n_bd) at 23:59:59Z (inclusive)
      add_business_days counts Mon-Fri only, starting the day AFTER received_at.
      Compliance rule: resolve/grant observe that credit must exist once now > due_at.
    input_set: "DisputeCase + its CardAccount"
    constants:
      BD_STANDARD: 10
      BD_NEW_ACCOUNT: 20
      NEW_ACCOUNT_MAX_AGE_DAYS: 30
    precision: "business days excluding Saturdays and Sundays; no holiday calendar"

  - name: case_network_fees
    trigger: "POST /chargebacks (filing fee) and POST /chargebacks/{id}/escalate (stage fee)"
    algorithm: tiered_pricing
    formula: |
      filing_fee_cents = FILING_FEE_CENTS                                    # accrued at filing
      stage_fee_cents(stage):
        PRE_COMPLIANCE: round_half_up(PRE_COMP_BASE_CENTS + PRE_COMP_PCT * amount_cents)
        ARBITRATION:    round_half_up(ARB_BASE_CENTS + ARB_PCT * amount_cents)
      fees_total_cents = filing_fee_cents + stage_fee_cents(stage_entered)   # NONE: filing only
      Rounding order is PINNED: each stage fee is rounded half-up to whole cents
      individually, THEN summed. Never sum the fractional components first.
    input_set: "the Chargeback being filed/escalated"
    constants:
      FILING_FEE_CENTS: 2500
      PRE_COMP_BASE_CENTS: 10000
      PRE_COMP_PCT: 0.008
      ARB_BASE_CENTS: 25000
      ARB_PCT: 0.015
    precision: "2 decimal places, round_half_up per stage, then integer-cent sum"
    variants:
      - name: pre_compliance
        when: "escalate with stage=PRE_COMPLIANCE"
        difference: "cheaper stage fee; total = filing + pre-compliance fee"
      - name: arbitration
        when: "escalate with stage=ARBITRATION"
        difference: "more expensive stage fee; identical amount_cents yields a strictly larger fees_total_cents than pre_compliance"

  - name: recovery_waterfall
    trigger: "chargeback terminal outcome (auto entries) and POST /disputes/{id}/loss-recoveries (manual entries)"
    algorithm: waterfall_allocation
    formula: |
      outstanding_loss_cents(case) = sum(LOSS_RECOGNIZED.amount_cents) - sum(RECOVERY_RECEIVED.amount_cents)
      Auto LOSS_RECOGNIZED at CLOSED_LOST/CANCELLED-ARB WITHDRAWN = chargeback.fees_total_cents
        + (finalized credit principal if the issuer bears it, else 0)
      Auto LOSS_RECOGNIZED at resolve(ERROR_CONFIRMED) or reinstate = finalized/reinstated principal F
      Auto LOSS_RECOGNIZED at CLOSED_WON = F + fees_total_cents, paired with
      Auto RECOVERY_RECEIVED at CLOSED_WON = chargeback.amount_cents
      Manual RECOVERY_RECEIVED must satisfy amount_cents <= outstanding_loss_cents
        (else ERR_LOSS_EXCEEDS_OUTSTANDING); amount == outstanding is permitted.
      Manual LOSS_RECOGNIZED requires case in a RESOLVED_* status.
      Claim conservation (asserted at resolution):
        cardholder_keeps_cents + final_liability_cents == claim_amount_cents
    input_set: "all LossRecovery entries for the case, in created_at order"
    constants: {}
    precision: "integer cents; bucket order pinned: fees bucket first within the auto LOSS entry composition, then principal"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_AUTH
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, enum members valid, integer amounts > 0, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body
  - priority: 4
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: auth
    check: "Cardholder ownership: X-User-ID equals the card_account_id that owns the target resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /disputes, POST /disputes/{id}/withdraw, GET endpoints when role=Cardholder"
  - priority: 6
    category: state
    check: "Entity state preconditions: transaction POSTED for intake (DISPUTED with a non-terminal case -> ERR_DUPLICATE_ACTIVE_DISPUTE; otherwise not POSTED -> ERR_INVALID_STATE); account ACTIVE for transaction seeding (else ERR_ACCOUNT_RESTRICTED); case/chargeback/credit in the from-state required by each transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 6
    category: state
    check: "Duplicate active dispute: CardTransaction already referenced by a DisputeCase in a non-terminal status"
    error_id: ERR_DUPLICATE_ACTIVE_DISPUTE
    http_status: 409
    applies_to: POST /disputes
  - priority: 6
    category: state
    check: "Account RESTRICTED blocks new posted transactions"
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: POST /card-transactions
  - priority: 7
    category: state
    check: "OCC: expected_dispute_version equals current DisputeCase.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: POST /disputes/{id}/reclassify
  - priority: 8
    category: business_safety
    check: "Segregation of duties: resolving investigator's X-User-ID must differ from the case's intake_agent_id when intake was performed by an IntakeAgent"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: POST /disputes/{id}/resolve
  - priority: 9
    category: business_temporal
    check: "Provisional credit compliance: resolving past provisional_credit_due_at without any credit granted is forbidden"
    error_id: ERR_PROVISIONAL_CREDIT_REQUIRED
    http_status: 422
    applies_to: POST /disputes/{id}/resolve
  - priority: 9
    category: business_temporal
    check: "Investigation window: NO_ERROR resolution requires now <= investigation_deadline_at (inclusive end-of-day)"
    error_id: ERR_INVESTIGATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: POST /disputes/{id}/resolve
  - priority: 9
    category: business_temporal
    check: "Network filing deadline: chargeback filing requires now <= network_filing_deadline_at (posted_at + NETWORK_FILING_DAYS[network], inclusive)"
    error_id: ERR_NETWORK_DEADLINE_PASSED
    http_status: 422
    applies_to: POST /chargebacks
  - priority: 9
    category: business_temporal
    check: "Reversal notice cooling: manual credit reversal requires a REVERSAL_NOTICE whose sent_at is >= 3 business days before now"
    error_id: ERR_REVERSAL_NOTICE_PENDING
    http_status: 422
    applies_to: POST /provisional-credits/{id}/reverse
  - priority: 10
    category: business_constraint
    check: "Network response window occupancy: no other Chargeback on the same CardTransaction with now in [filed_at, response_window_end_at)"
    error_id: ERR_NETWORK_WINDOW_ACTIVE
    http_status: 409
    applies_to: POST /chargebacks
  - priority: 10
    category: business_constraint
    check: "Reason code matches the transaction's network and the case's fraud classification (fraud: V10_4/V10_5/M4837/M4870; non-fraud: V13_1/V13_3/M4853/M4855)"
    error_id: ERR_REASON_CODE_MISMATCH
    http_status: 422
    applies_to: POST /chargebacks
  - priority: 10
    category: business_constraint
    check: "Representment requires at least one evidence document (empty array rejected)"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: POST /chargebacks/{id}/representments
  - priority: 11
    category: business_fiscal
    check: "claim_amount_cents <= CardTransaction.amount_cents"
    error_id: ERR_CLAIM_EXCEEDS_TRANSACTION
    http_status: 422
    applies_to: POST /disputes
  - priority: 11
    category: business_fiscal
    check: "Manual RECOVERY_RECEIVED amount_cents <= outstanding_loss_cents (equal is permitted)"
    error_id: ERR_LOSS_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: POST /disputes/{id}/loss-recoveries

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /card-accounts
    description: "Open a card account (opened_at = logical clock at creation)"
    roles: [BankAdmin]
    code: 201
    input: [cardholder_name, "initial_balance_cents?"]
    output: CardAccount
    side_effects: ["status = ACTIVE", "balance_cents = initial_balance_cents (default 0)"]
  - method: GET
    path: /card-accounts/{id}
    description: "Read one card account with derived balances"
    roles: [BankAdmin, Cardholder, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: []
    output: CardAccount
    side_effects: []
  - method: GET
    path: /card-accounts/{id}/transactions
    description: "List transactions posted to an account"
    roles: [BankAdmin, Cardholder, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CardTransaction[]
    side_effects: []
  - method: POST
    path: /card-transactions
    description: "Seed a posted card transaction (posted_at supplied for backdating)"
    roles: [BankAdmin]
    code: 201
    input: [card_account_id, merchant_name, amount_cents, transaction_type, network, posted_at]
    output: CardTransaction
    side_effects: ["status = POSTED", "rejected with ERR_ACCOUNT_RESTRICTED when account RESTRICTED"]
  - method: POST
    path: /disputes
    description: "Dispute intake; computes received_at, provisional_credit_due_at, provisional holdback"
    roles: [Cardholder, IntakeAgent]
    code: 201
    input: [card_transaction_id, error_type, claim_amount_cents, claimed_report_delay_days]
    output: DisputeCase
    side_effects:
      - "DisputeCase created RECEIVED; intake_agent_id = X-User-ID when filed by IntakeAgent else null"
      - "CardTransaction POSTED -> DISPUTED"
      - "provisional_credit_due_at computed (10/20 business days)"
      - "provisional_holdback_cents computed from claimed delay tier (fraud keyed off error_type == UNAUTHORIZED until classify overrides)"
  - method: GET
    path: /disputes/{id}
    description: "Read one dispute case with computed deadline and liability fields"
    roles: [BankAdmin, Cardholder, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []
  - method: GET
    path: /disputes
    description: "List/filter dispute cases"
    roles: [BankAdmin, Cardholder, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["card_account_id?", "card_transaction_id?", "status?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []
  - method: POST
    path: /disputes/{id}/classify
    description: "Classify fraud vs non-fraud; sets verified delay, investigation window; fraud restricts account"
    roles: [DisputeInvestigator]
    code: 200
    input: [is_fraud_claim, verified_report_delay_days]
    output: DisputeCase
    side_effects: ["RECEIVED -> CLASSIFIED", "investigation_window_days/deadline computed", "fraud: CardAccount -> RESTRICTED", "increments DisputeCase.version by 1"]
  - method: POST
    path: /disputes/{id}/reclassify
    description: "Re-classify under OCC; CLASSIFIED -> CLASSIFIED self-loop with version check"
    roles: [DisputeInvestigator]
    code: 200
    input: [is_fraud_claim, verified_report_delay_days, expected_dispute_version]
    output: DisputeCase
    side_effects: ["recomputes window/holdback/deadline", "account RESTRICTED/ACTIVE flip as needed", "increments DisputeCase.version by 1"]
  - method: POST
    path: /disputes/{id}/grant-provisional-credit
    description: "Grant provisional credit = claim - provisional holdback; creates PROVISIONAL_CREDIT_ADVICE"
    roles: [IntakeAgent]
    code: 201
    input: []
    output: ProvisionalCredit
    side_effects:
      - "ProvisionalCredit created GRANTED; granted_late computed against provisional_credit_due_at"
      - "CardAccount.balance_cents += amount; provisional_outstanding_cents += amount"
      - "Notification PROVISIONAL_CREDIT_ADVICE created"
      - "rejected if a credit in GRANTED/REINSTATED already exists (ERR_INVALID_STATE)"
  - method: POST
    path: /disputes/{id}/resolve
    description: "Resolve investigation: ERROR_CONFIRMED finalizes credit with true-up; NO_ERROR starts reversal flow"
    roles: [DisputeInvestigator]
    code: 200
    input: [outcome]
    output: DisputeCase
    side_effects: ["per §1.2 DisputeCase resolve transitions; creates RESOLUTION_LETTER or REVERSAL_NOTICE", "increments DisputeCase.version by 1"]
  - method: POST
    path: /disputes/{id}/withdraw
    description: "Cardholder withdrawal from RECEIVED/CLASSIFIED; auto-reverses open credit without notice wait"
    roles: [Cardholder, IntakeAgent]
    code: 200
    input: []
    output: DisputeCase
    side_effects: ["-> WITHDRAWN", "open credit -> REVERSED with balance/outstanding adjust", "transaction -> SETTLED", "increments DisputeCase.version by 1"]
  - method: POST
    path: /chargebacks
    description: "File a network chargeback for a CLASSIFIED case; reason code and deadline enforced"
    roles: [ChargebackAnalyst]
    code: 201
    input: [dispute_case_id, reason_code, "amount_cents?"]
    output: Chargeback
    side_effects: ["Chargeback FILED with filing fee accrued", "DisputeCase CLASSIFIED -> CHARGEBACK_FILED", "CardTransaction DISPUTED -> CHARGED_BACK"]
  - method: GET
    path: /chargebacks/{id}
    description: "Read one chargeback including fees and stage"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: []
    output: Chargeback
    side_effects: []
  - method: GET
    path: /chargebacks
    description: "List/filter chargebacks by transaction or status"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["card_transaction_id?", "status?", "limit?", "offset?"]
    output: Chargeback[]
    side_effects: []
  - method: GET
    path: /disputes/{id}/chargebacks
    description: "List chargebacks filed for a case"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Chargeback[]
    side_effects: []
  - method: POST
    path: /chargebacks/{id}/representments
    description: "Register a merchant representment with evidence (chargeback must be FILED)"
    roles: [ChargebackAnalyst]
    code: 201
    input: [merchant_ref, evidence_documents]
    output: Representment
    side_effects: ["Chargeback FILED -> REPRESENTED", "DisputeCase -> REPRESENTMENT_REVIEW", "CardTransaction -> RE_PRESENTED"]
  - method: GET
    path: /chargebacks/{id}/representments
    description: "List representments registered against a chargeback"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Representment[]
    side_effects: []
  - method: POST
    path: /chargebacks/{id}/review-representment
    description: "ACCEPT closes lost (issuer concedes); REJECT issues second presentment"
    roles: [ChargebackAnalyst]
    code: 200
    input: [decision]
    output: Chargeback
    side_effects: ["per §1.2 Chargeback/Representment review transitions and cascades"]
  - method: POST
    path: /chargebacks/{id}/escalate
    description: "From SECOND_PRESENTED: choose PRE_COMPLIANCE or ARBITRATION with terminal outcome; accrues stage fee"
    roles: [ChargebackAnalyst]
    code: 200
    input: [stage, outcome]
    output: Chargeback
    side_effects: ["stage fee accrued per case_network_fees", "terminal outcome cascades to case, credit, transaction, loss ledger"]
  - method: POST
    path: /chargebacks/{id}/withdraw
    description: "Cancel a FILED chargeback; returns case to CLASSIFIED for possible refile"
    roles: [ChargebackAnalyst]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["FILED -> CANCELLED", "DisputeCase CHARGEBACK_FILED -> CLASSIFIED", "CardTransaction CHARGED_BACK -> DISPUTED"]
  - method: POST
    path: /provisional-credits/{id}/reverse
    description: "FinanceOfficer reversal after 3-business-day REVERSAL_NOTICE cooling; cascades case to RESOLVED_MERCHANT_FAVOR"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ProvisionalCredit
    side_effects: ["per §1.2 ProvisionalCredit reversal chain (balance, outstanding, case, notification, account restore)"]
  - method: POST
    path: /provisional-credits/{id}/reinstate
    description: "Reinstate an erroneously reversed credit; case flips to RESOLVED_CARDHOLDER_FAVOR with LOSS auto-entry"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ProvisionalCredit
    side_effects: ["REVERSED -> REINSTATED", "balance/outstanding += amount", "case RESOLVED_MERCHANT_FAVOR -> RESOLVED_CARDHOLDER_FAVOR", "LossRecovery LOSS_RECOGNIZED auto-entry = amount"]
  - method: GET
    path: /disputes/{id}/provisional-credits
    description: "List provisional credits for a case (0 or 1 under the one-open-credit rule; history retained)"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ProvisionalCredit[]
    side_effects: []
  - method: GET
    path: /disputes/{id}/notifications
    description: "List notification letters generated for a case"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["type?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []
  - method: POST
    path: /disputes/{id}/loss-recoveries
    description: "Manual loss recognition or recovery entry against a RESOLVED_* case"
    roles: [FinanceOfficer]
    code: 201
    input: [type, amount_cents, "memo?"]
    output: LossRecovery
    side_effects: ["outstanding_loss_cents recomputed; RECOVERY_RECEIVED bounded by outstanding (ERR_LOSS_EXCEEDS_OUTSTANDING)"]
  - method: GET
    path: /disputes/{id}/loss-recoveries
    description: "List loss/recovery ledger entries for a case"
    roles: [BankAdmin, IntakeAgent, DisputeInvestigator, ChargebackAnalyst, FinanceOfficer]
    code: 200
    input: ["type?", "limit?", "offset?"]
    output: LossRecovery[]
    side_effects: []
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [BankAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all deadline/business-day computations use this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 400, condition: "X-User-ID or X-User-Role header missing/unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or Cardholder does not own the account" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive amount, or unknown body field" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state permitted for the requested transition" }
  - { id: ERR_DUPLICATE_ACTIVE_DISPUTE, http: 409, condition: "CardTransaction already referenced by a non-terminal DisputeCase" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "POST /card-transactions against a RESTRICTED account" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_dispute_version does not match current DisputeCase.version" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Resolving investigator is the same X-User-ID as the intake agent" }
  - { id: ERR_PROVISIONAL_CREDIT_REQUIRED, http: 422, condition: "Resolve attempted after provisional_credit_due_at with no credit ever granted" }
  - { id: ERR_INVESTIGATION_WINDOW_EXPIRED, http: 422, condition: "NO_ERROR resolution attempted after investigation_deadline_at" }
  - { id: ERR_NETWORK_DEADLINE_PASSED, http: 422, condition: "Chargeback filing attempted after network_filing_deadline_at" }
  - { id: ERR_REVERSAL_NOTICE_PENDING, http: 422, condition: "Manual credit reversal before 3 business days elapsed since REVERSAL_NOTICE" }
  - { id: ERR_NETWORK_WINDOW_ACTIVE, http: 409, condition: "Another chargeback on the same transaction occupies its [filed_at, response_window_end_at) window" }
  - { id: ERR_REASON_CODE_MISMATCH, http: 422, condition: "Reason code does not match transaction network or fraud classification" }
  - { id: ERR_EVIDENCE_REQUIRED, http: 422, condition: "Representment submitted with an empty evidence_documents array" }
  - { id: ERR_CLAIM_EXCEEDS_TRANSACTION, http: 422, condition: "claim_amount_cents exceeds the transaction's amount_cents" }
  - { id: ERR_LOSS_EXCEEDS_OUTSTANDING, http: 422, condition: "Manual RECOVERY_RECEIVED exceeds outstanding_loss_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Cardholder
    description: "Account owner filing and tracking disputes on their own card account"
    identity: "entity_backed:CardAccount"
    exclusive_operations: []
    shared_operations: ["POST /disputes (own account only)", "POST /disputes/{id}/withdraw (own)", "GET own account/transactions/disputes"]
  - name: IntakeAgent
    description: "Dispute intake specialist; opens cases and grants provisional credit"
    identity: "opaque"
    exclusive_operations: ["POST /disputes/{id}/grant-provisional-credit"]
    shared_operations: ["POST /disputes", "POST /disputes/{id}/withdraw", "GET reads"]
  - name: DisputeInvestigator
    description: "Reg E investigator; classifies fraud, reclassifies under OCC, resolves cases; cannot resolve a case they personally intook (SoD)"
    identity: "opaque"
    exclusive_operations: ["POST /disputes/{id}/classify", "POST /disputes/{id}/reclassify", "POST /disputes/{id}/resolve"]
    shared_operations: ["GET reads"]
  - name: ChargebackAnalyst
    description: "Network chargeback specialist; files chargebacks, handles representments, second presentment, and escalation"
    identity: "opaque"
    exclusive_operations: ["POST /chargebacks", "POST /chargebacks/{id}/representments", "POST /chargebacks/{id}/review-representment", "POST /chargebacks/{id}/escalate", "POST /chargebacks/{id}/withdraw"]
    shared_operations: ["GET reads"]
  - name: FinanceOfficer
    description: "Finance operations; executes provisional credit reversals/reinstatements and loss/recovery ledger entries"
    identity: "opaque"
    exclusive_operations: ["POST /provisional-credits/{id}/reverse", "POST /provisional-credits/{id}/reinstate", "POST /disputes/{id}/loss-recoveries"]
    shared_operations: ["GET reads"]
  - name: BankAdmin
    description: "Back-office administrator; seeds accounts and transactions, controls the logical clock"
    identity: "opaque"
    exclusive_operations: ["POST /card-accounts", "POST /card-transactions", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads"]
