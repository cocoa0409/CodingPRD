              as: PlatformAdmin
              captures: { selL: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BL", residency_state_code: "FL", tax_id_last4: "0302" }
              as: PlatformAdmin
              captures: { buyL: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USLOOP123456", make: "Hinckley", model: "Talaria", year_built: 2017, length_overall_ft: 43.0, documentation_mode: "USCG", uscg_official_no: "7778889", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesL: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkL}", listing_agent_id: "${laL}", seller_id: "${selL}", vessel_id: "${vesL}", agreement_type: "CENTRAL", list_price_cents: 400000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laL}"
              captures: { lstL: $.data.id }
            - call: "POST /yacht/listings/${lstL}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laL}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstL}", buyer_id: "${buyL}", selling_agent_id: "${saL}", offer_price_cents: 400000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saL}"
              captures: { offL: $.data.id, offL_v: $.data.version }
            - call: "POST /yacht/offers/${offL}/accept"
              payload: { expected_offer_version: "${offL_v}" }
              as: ListingAgent
              as_user_id: "${laL}"
            - call: "GET /yacht/offers/${offL}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saL}"
              captures: { l0: "$.data[0].id", l1: "$.data[1].id", l2: "$.data[2].id" }
            - call: "POST /yacht/contingencies/${l0}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saL}"
            - call: "POST /yacht/contingencies/${l1}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saL}"
            - call: "POST /yacht/contingencies/${l2}/waive"
              payload: {}
              as: SellingAgent
              as_user_id: "${saL}"
            - call: "POST /yacht/closing-statements"
              payload: { offer_id: "${offL}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: ClosingOfficer
              captures: { csL: $.data.id }
            - call: "GET /yacht/offers/${offL}"
              payload: {}
              as: ClosingOfficer
              captures: { offL_vnow: $.data.version }
            - call: "POST /yacht/closing-statements/${csL}/build"
              payload: { expected_offer_version: "${offL_vnow}" }
