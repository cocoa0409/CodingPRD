              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-D2" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX320", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:00:00Z", arr_utc: "2026-11-03T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
            - call: "POST /flight-legs/${leg_id}/booking-snapshot"
              payload: { booked_first: 0, booked_business: 0, booked_economy: 10 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg_id}", trigger_kind: "RETIME", change_magnitude_minutes: 45 }
