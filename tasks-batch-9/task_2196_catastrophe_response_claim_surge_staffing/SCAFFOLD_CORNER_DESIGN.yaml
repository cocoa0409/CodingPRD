              as_user_id: "ce-001"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce-001"
            - call: "GET /claims/${cl}"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce-001"
              captures: { clv: $.data.version }
          trigger:
            - call: "POST /claims/${cl}/reserve-entries"
              payload: { expected_claim_version: "${clv}", entry_type: "REVISION", delta_case_reserve: -2500, delta_paid: 0, memo: "Over-correction attempt" }
              as: ClaimsExaminer
              as_user_id: "ce-001"
          assert:
            - "HTTP 422 with data.error_id == 'ERR_RESERVE_WOULD_GO_NEGATIVE'."
            - "A subsequent GET /reserve-entries?claim_id=${cl} returns total_count == 1 with data[0].entry_type == 'INITIAL_CASE'."
            - "A subsequent GET /claims/${cl} returns data.case_reserve == 2000.00 and data.version == ${clv} (the rejected append bumped nothing)."
            - "A subsequent GET /catastrophe-events/${ev} returns data.case_reserve_total == 2000.00 and data.incurred_total == 2000.00."

      - name: corner_err_not_assigned_adjuster_on_foreign_start
        claim_type: error_triggerable
