      - name: contract_lifecycle_and_billing_dimensions_are_independent
        claim_type: parallel
        grounds:
          - entities.RentalContract.fields.lifecycle_status
          - entities.RentalContract.fields.billing_status
          - state_machines.RentalContract.billing_SETTLED_to_CURRENT
        excluded_because:
          difficulty_instance: contract_parallel_dimensions_advance_independently
          rationale: "The named §1.8 instance drives lifecycle_status and billing_status along independent paths on one row and asserts the full combined-state matrix, including SETTLED re-opening to CURRENT while lifecycle stays ACTIVE."

      - name: contract_auto_closes_when_both_child_dimensions_are_terminal
        claim_type: bubble_up
        grounds:
          - state_machines.RentalContract.DEMOBILIZING_to_CLOSED
          - state_machines.RentalContract.billing_to_SETTLED
          - state_machines.RemovalReconciliation.OPEN_to_FINALIZED
        excluded_because:
          difficulty_instance: contract_parallel_dimensions_advance_independently
          rationale: "The same §1.8 instance asserts the auto-derived DEMOBILIZING -> CLOSED hop that fires only once billing_status is SETTLED and the RemovalReconciliation is FINALIZED, and asserts that it does not fire when only one of the two holds."

      - name: permit_review_loop_returns_to_submitted_within_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.PermitApplication.REVISION_REQUESTED_to_SUBMITTED
          - validations.priority_18_ERR_PERMIT_REVISION_LIMIT
        excluded_because:
          difficulty_instance: permit_revision_cycle_bounded_at_third_round
          rationale: "The named §1.8 instance walks the SUBMITTED -> REVISION_REQUESTED -> SUBMITTED loop twice, asserts revision_round after each pass and asserts the third request is refused with ERR_PERMIT_REVISION_LIMIT."

      - name: finalize_cascades_counts_down_to_every_product_line
        claim_type: cascade_down
        grounds:
          - state_machines.RemovalReconciliation.OPEN_to_FINALIZED
          - entities.FenceProduct.fields.lost_count
          - entities.PermitApplication.fields.status
        excluded_because:
          difficulty_instance: reconciliation_finalize_four_hop_cascade
          rationale: "The named §1.8 instance asserts the four-hop chain from finalize down through per-product deployed -> available/damaged/lost movements, the FINAL invoice and the account balance."

      - name: install_completion_syncs_the_account_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.RentalContract.PENDING_MOBILIZATION_to_ACTIVE
          - calculations.account_exposure
          - entities.CustomerAccount.fields.credit_hold_flag
        excluded_because:
          difficulty_instance: install_completion_five_hop_cascade
          rationale: "The named §1.8 instance asserts the ancestor-field sync end to end: completion -> contract ACTIVE -> MOBILIZATION invoice -> open_balance_cents -> credit_hold_flag, with the literal balance at each hop."

      - name: abort_returns_reserved_units_to_the_product_pool
        claim_type: cross_entity
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_ABORTED
          - entities.FenceProduct.fields.reserved_count
          - entities.WorkOrder.fields.reserved_unit_counts
        excluded_because:
          difficulty_instance: fleet_conservation_across_dispatch_cancel_and_abort
          rationale: "The named §1.8 instance asserts FenceProduct counter movement and the owned_count conservation identity across dispatch, cancel and abort, including the emptied reserved_unit_counts and the cleared crew_id."

      - name: void_reverses_every_side_effect_of_issuance
        claim_type: compensation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Invoice.PARTIALLY_PAID_to_VOID
          - calculations.account_exposure
        excluded_because:
          difficulty_instance: open_balance_conservation_across_issue_and_void
          rationale: "The named §1.8 instance asserts that void removes exactly the still-open amount, credits lifetime_credited_cents by the same figure, never moves amount_paid_cents and returns open_balance_cents to its pre-issuance value."

