      - name: arrangement_approve_segregation_of_duties
        claim_type: violation_to_error
        grounds: [state_machines.MusicArrangement.QUOTED_to_APPROVED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The creating user (dir-1) cannot approve their own quote; a different BandDirector user (dir-2) can."
        test_recipe:
          setup: ["program; QUOTED arrangement created by BandDirector dir-1"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "SD", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/arrangements", payload: { program_id: "${prog}", title: "SOD", arranger: "X", license_type: "STANDARD", cost_cents: 10000, rights_end: "2026-12-01T00:00:00Z" }, as: BandDirector, as_user_id: "dir-1", captures: { arr: $.data.id } }
          trigger:
            - { call: "POST /band/arrangements/${arr}/approve", payload: {}, as: BandDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
            - { call: "POST /band/arrangements/${arr}/approve", payload: {}, as: BandDirector, as_user_id: "dir-2" }
          assert:
