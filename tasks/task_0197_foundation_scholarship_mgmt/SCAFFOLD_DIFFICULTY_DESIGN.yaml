              payload: { institution_id: "I17" }
              as: DisbursementOfficer
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/settle"
              payload: {}
              as: DisbursementOfficer
          trigger:
            - call: "POST /disbursements/${disb_id}/return"
              payload: {}
              as: DisbursementOfficer
            - call: "GET /scholarship-funds/${fund_id}"
              payload: {}
              as: FoundationAdmin
              captures: { dc: $.data.disbursed_cents }
          assert:
            - "ScholarshipFund.${fund_id}.disbursed_cents == 0"
            - "Disbursement.${disb_id}.status == RETURNED"
