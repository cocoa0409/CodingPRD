  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to real wall-clock time. Every deadline, ISO-week window, training expiry and start-in-past check is evaluated against this logical clock."
    roles: [EducationDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["The logical clock moves to to_iso8601; no entity is mutated and no lazy expiry runs until the next business call that declares one"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_SCHOOL_SCOPE_VIOLATION
    http: 403
    condition: "A TeacherContact acts on a resource belonging to a SchoolPartner other than the one identified by X-User-ID"
  - id: ERR_NOT_ASSIGNED_EDUCATOR
    http: 403
    condition: "A Naturalist acts on a booking whose lead_educator_id is not the acting educator"
  - id: ERR_SOD_REVIEW_SAME_ACTOR
    http: 403
    condition: "The reviewer of a program offering is the same user id as authored_by_user_id"
  - id: ERR_SOD_ASSESS_SAME_ACTOR
    http: 403
    condition: "The assessor of a training record is the same user id as enrolled_by_user_id"
  - id: ERR_SOD_EVALUATION_SAME_ACTOR
    http: 403
    condition: "The reviewer of an evaluation report is the same user id as submitted_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum value outside the declared set, number outside the declared range, or pagination parameter outside limit 1-100 / offset >= 0"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "end_utc <= start_utc on a booking, or valid_to <= valid_from on a permit"
  - id: ERR_TRACK_FIELD_MISMATCH
    http: 422
    condition: "grade_band or handling_tier does not match the training track, or score omitted on a PASS assessment"
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "No ProgramOffering with the given id"
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "No CurriculumMaterial with the given id"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "No SchoolPartner with the given id"
  - id: ERR_EDUCATOR_NOT_FOUND
    http: 404
    condition: "No Educator with the given id"
  - id: ERR_TRAINING_RECORD_NOT_FOUND
    http: 404
    condition: "No TrainingRecord with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "No Permit with the given id"
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "No AnimalAmbassador with the given id"
  - id: ERR_TRAIL_SEGMENT_NOT_FOUND
    http: 404
    condition: "No TrailSegment with the given id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "No Booking with the given id"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "No ScholarshipFund with the given id"
  - id: ERR_AID_APPLICATION_NOT_FOUND
    http: 404
    condition: "No AidApplication with the given id"
  - id: ERR_MANIFEST_NOT_FOUND
    http: 404
    condition: "No EquipmentManifest with the given id"
  - id: ERR_EVALUATION_REPORT_NOT_FOUND
