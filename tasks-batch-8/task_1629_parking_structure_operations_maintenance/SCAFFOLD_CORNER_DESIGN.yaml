scaffold_corner_design:
- section: entities
  instances:
  - name: create_facility_applies_defaults
    claim_type: creation_defaults
    grounds:
    - entities.Facility.fields.levy_pct
    - entities.Facility.fields.posture
    distinguishing_aspect: Omitting levy_pct applies default 0.10; computed counters start at 0; posture starts NORMAL; version starts 1.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Defaults Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          levy: $.data.levy_pct
          post: $.data.posture
          res: $.data.capital_reserve_cents
          ver: $.data.version
      trigger: []
      assert:
      - Facility.${fac}.levy_pct == 0.10 (default applied)
      - posture == NORMAL, capital_reserve_cents == 0, deposit_liability_cents == 0, cumulative_collected_cents == 0, version == 1
      - created_at == 2026-08-01T00:00:00Z (logical clock default)
  - name: get_facility_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=5]
    distinguishing_aspect: GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /ops/facilities/00000000-0000-0000-0000-000000000000
        as: FacilityManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and HTTP status 404
  - name: facility_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    distinguishing_aspect: List with limit=2 over 3 facilities returns exactly 2 items with total_count 3 and has_more true.
    test_recipe:
      setup:
      - Three facilities exist
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Pg A
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: FacilityManager
      - call: POST /ops/facilities
        payload:
          name: Pg B
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: FacilityManager
      - call: POST /ops/facilities
        payload:
          name: Pg C
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: FacilityManager
      trigger:
      - call: GET /ops/facilities?limit=2&offset=0
        as: FacilityManager
      assert:
      - response contains exactly 2 items, total_count == 3, has_more == true (envelope pagination_fields honored)
  - name: parker_account_creation_and_retrieval
    claim_type: creation_retrieval
    grounds:
    - entities.ParkerAccount.fields.full_name
    - entities.ParkerAccount.fields.email
    distinguishing_aspect: Created parker account is retrievable by id with identical fields.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls:
      - call: POST /ops/parker-accounts
        payload:
          full_name: Rita Reader
          email: rita@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          pk: $.data.id
      trigger:
      - call: GET /ops/parker-accounts/${pk}
        as: FacilityManager
        captures:
          nm: $.data.full_name
          em: $.data.email
      assert:
      - GET returns full_name == 'Rita Reader' and email == 'rita@x.com' with a server-minted UUID id
  - name: create_rate_schedule_missing_required_returns_validation
    claim_type: required_fields
    grounds:
    - errors[ERR_VALIDATION]
    - validations[priority=7]
    distinguishing_aspect: POST /ops/rate-schedules without facility_id (a required input) yields ERR_VALIDATION 400.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /ops/rate-schedules
        payload:
          label: Broken
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and HTTP status 400
  - name: create_device_with_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.AccessDevice.fields.device_kind
    - errors[ERR_VALIDATION]
    distinguishing_aspect: device_kind outside {ENTRY_GATE, EXIT_GATE, PAY_STATION} is rejected with ERR_VALIDATION.
    test_recipe:
      setup:
      - One facility
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Enum Fac
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: FacilityManager
        captures:
          fac: $.data.id
      trigger:
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: Bad
          device_kind: FOUNTAIN
        as: FacilityManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and HTTP status 400
  - name: credential_replace_links_self_reference
    claim_type: parent_relationships
    grounds:
    - entities.Credential.fields.replaced_by_credential_id
    - state_machines.Credential.ACTIVE_to_REPLACED
    distinguishing_aspect: replace sets the old credential's replaced_by_credential_id to the successor; the reverse filtered list finds the predecessor from the successor's id.
    test_recipe:
      setup:
      - Facility with APPROVED agreement holding one ACTIVE credential c1
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: SelfRef Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/parker-accounts
        payload:
          full_name: SR One
          email: sr1@x.com
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          pk: $.data.id
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
          parker_account_id: ${pk}
          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          agr: $.data.id
      - call: POST /ops/credentials
        payload:
          agreement_id: ${agr}
          credential_type: BADGE
          deposit_cents: 5000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          c1: $.data.id
      trigger:
      - call: POST /ops/credentials/${c1}/replace
        payload:
          credential_type: TRANSPONDER
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          c2: $.data.id
      - call: GET /ops/credentials/${c1}
        as: FacilityManager
        captures:
          c1st: $.data.credential_status
          c1link: $.data.replaced_by_credential_id
      - call: GET /ops/credentials?replaced_by_credential_id=${c2}
        as: FacilityManager
      assert:
      - Credential.${c1}.credential_status == REPLACED and replaced_by_credential_id == ${c2}
      - GET /ops/credentials?replaced_by_credential_id=${c2} returns exactly [${c1}] (1-element array)
  - name: rate_schedule_supersede_self_reference
    claim_type: parent_relationships
    grounds:
    - entities.RateSchedule.fields.supersedes_schedule_id
    - state_machines.RateSchedule.PUBLISHED_to_SUPERSEDED
    distinguishing_aspect: Publishing a schedule whose supersedes_schedule_id points at the current PUBLISHED flips the old one to SUPERSEDED; reverse filtered list resolves the chain.
    test_recipe:
      setup:
      - Facility with rs1 PUBLISHED
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Sup Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: Old
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs1: $.data.id
      - call: POST /ops/rate-schedules/${rs1}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: GET /ops/facilities/${fac}
        as: FacilityManager
        captures:
          fac_v2: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: New
          grace_minutes: 20
          first_hour_cents: 600
          additional_hour_cents: 300
          daily_max_cents: 2600
          event_flat_cents: 1600
          lost_ticket_daily_cents: 2600
          effective_from: '2026-08-01T00:00:00Z'
          supersedes_schedule_id: ${rs1}
        as: FacilityManager
        captures:
          rs2: $.data.id
      trigger:
      - call: POST /ops/rate-schedules/${rs2}/publish
        payload:
          expected_facility_version: ${fac_v2}
        as: FacilityManager
      - call: GET /ops/rate-schedules/${rs1}
        as: FacilityManager
        captures:
          rs1st: $.data.schedule_status
      - call: GET /ops/rate-schedules?supersedes_schedule_id=${rs1}
        as: FacilityManager
      assert:
      - RateSchedule.${rs1}.schedule_status == SUPERSEDED after rs2 publishes
      - GET /ops/rate-schedules?supersedes_schedule_id=${rs1} returns exactly [${rs2}]
  - name: incident_mark_duplicate_self_reference
    claim_type: parent_relationships
    grounds:
    - entities.IncidentReport.fields.duplicate_of_incident_id
    - state_machines.IncidentReport.OPEN_to_CLOSED
    distinguishing_aspect: mark-duplicate closes the report and records the target; reverse filtered list finds duplicates of a given incident.
    test_recipe:
      setup:
      - Facility with two OPEN incidents
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Dup Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/incidents
        payload:
          facility_id: ${fac}
          incident_type: VANDALISM
          severity: LOW
          description: graffiti stall 3
        as: SecurityOfficer
        as_user_id: sec-1
        captures:
          i1: $.data.id
      - call: POST /ops/incidents
        payload:
          facility_id: ${fac}
          incident_type: VANDALISM
          severity: LOW
          description: graffiti stall 3 again
        as: SecurityOfficer
        as_user_id: sec-1
        captures:
          i2: $.data.id
      trigger:
      - call: POST /ops/incidents/${i2}/mark-duplicate
        payload:
          duplicate_of_incident_id: ${i1}
        as: SecurityOfficer
        as_user_id: sec-1
        captures:
          st: $.data.incident_status
      - call: GET /ops/incidents?duplicate_of_incident_id=${i1}
        as: FacilityManager
      assert:
      - IncidentReport.${i2}.incident_status == CLOSED and duplicate_of_incident_id == ${i1}
      - GET /ops/incidents?duplicate_of_incident_id=${i1} returns exactly [${i2}]
  - name: dashboard_computed_read_matches_sources
    claim_type: computed_fields
    grounds:
    - calculations.occupancy_pressure
    - entities.Facility.fields.occupied_spaces
    distinguishing_aspect: Dashboard derived fields equal the underlying row counts after three entries and one settled exit.
    test_recipe:
      setup:
      - Facility with published tariff and ONLINE gate
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Dash Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: D
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: DA-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          s1: $.data.id
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: DA-2
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: DA-3
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T11:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${s1}/pay
        payload:
          tender_type: CARD
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/parking-sessions/${s1}/exit
        as: GateDevice
        as_user_id: ${dev}
      trigger:
      - call: GET /ops/facilities/${fac}/dashboard
        as: FacilityManager
        captures:
          occ: $.data.occupied_spaces
          avail: $.data.available_transient_spaces
          cum: $.data.cumulative_collected_cents
      assert:
      - dashboard.occupied_spaces == 2 (three entries minus one exit)
      - dashboard.available_transient_spaces == 198 (200 total - 0 closed - 2 occupied)
      - dashboard.cumulative_collected_cents == 500 (one 1h CARD settle)
- section: state_machines
  instances:
  - name: facility_decommission_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Facility
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: 'DECOMMISSIONED is terminal: a later transition-posture attempt is rejected and posture does not move.'
    test_recipe:
      setup:
      - Empty facility with no sessions, agreements, projects, or events
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Term Fac
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/facilities/${fac}/transition-posture
        payload:
          target_posture: DECOMMISSIONED
        as: FacilityManager
        captures:
          post: $.data.posture
      trigger:
      - call: POST /ops/facilities/${fac}/transition-posture
        payload:
          target_posture: NORMAL
        as: FacilityManager
        captures:
          err: $.data.error_id
      assert:
      - 'First transition succeeded: posture == DECOMMISSIONED'
      - Second transition rejected with ERR_INVALID_STATE_TRANSITION; posture remains DECOMMISSIONED
  - name: parking_session_initial_state
    claim_type: initial_state
    grounds:
    - state_machines.ParkingSession
    - entities.ParkingSession.fields.fee_mode
    distinguishing_aspect: A fresh entry starts PARKED x OPEN with fee_mode STANDARD, rate_schedule_id pinned to the PUBLISHED schedule, entry_at from the logical clock.
    test_recipe:
      setup:
      - Facility with published tariff and ONLINE gate; clock at 2026-08-01T10:00:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Init Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: I
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: IN-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
          occ: $.data.occupancy_state
          bil: $.data.billing_state
          fm: $.data.fee_mode
          pinned: $.data.rate_schedule_id
          eat: $.data.entry_at
      assert:
      - occupancy_state == PARKED, billing_state == OPEN, fee_mode == STANDARD
      - rate_schedule_id == ${rs} (pinned at entry)
      - entry_at == 2026-08-01T10:00:00Z (logical clock)
  - name: session_exit_unpaid_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.ParkingSession.PARKED_to_EXITED
    - errors[ERR_EXIT_UNPAID]
    distinguishing_aspect: Exit with billing OPEN and a positive fee (500) is rejected with ERR_EXIT_UNPAID; occupancy stays PARKED.
    test_recipe:
      setup:
      - Facility with published tariff and ONLINE gate; session entered 10:00; clock 11:00 (fee 500)
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: XU Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: X
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: XU-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T11:00:00Z'
        as: FacilityManager
      trigger:
      - call: POST /ops/parking-sessions/${sess}/exit
        as: GateDevice
        as_user_id: ${dev}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_EXIT_UNPAID (billing OPEN, fee 500 > 0)
      - ParkingSession.${sess}.occupancy_state remains PARKED
  - name: session_pay_after_exit_invalid
    claim_type: invalid_transition
    grounds:
    - state_machines.ParkingSession
    - errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: pay on an EXITED session (terminal occupancy) is rejected with ERR_INVALID_STATE_TRANSITION.
    test_recipe:
      setup:
      - Settled and exited session
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: PX Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
          fac_v: $.data.version
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
          label: PX
          grace_minutes: 15
          first_hour_cents: 500
          additional_hour_cents: 300
          daily_max_cents: 2400
          event_flat_cents: 1500
          lost_ticket_daily_cents: 2400
          effective_from: '2026-08-01T00:00:00Z'
        as: FacilityManager
        captures:
          rs: $.data.id
      - call: POST /ops/rate-schedules/${rs}/publish
        payload:
          expected_facility_version: ${fac_v}
        as: FacilityManager
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      - call: POST /ops/access-devices/${dev}/heartbeat
        as: GateDevice
        as_user_id: ${dev}
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T10:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions
        payload:
          facility_id: ${fac}
          entry_device_id: ${dev}
          ticket_barcode: PX-1
        as: GateDevice
        as_user_id: ${dev}
        captures:
          sess: $.data.id
      - call: POST /ops/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T11:00:00Z'
        as: FacilityManager
      - call: POST /ops/parking-sessions/${sess}/pay
        payload:
          tender_type: CARD
        as: ParkingAttendant
        as_user_id: att-1
      - call: POST /ops/parking-sessions/${sess}/exit
        as: GateDevice
        as_user_id: ${dev}
      trigger:
      - call: POST /ops/parking-sessions/${sess}/pay
        payload:
          tender_type: CARD
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE_TRANSITION (SETTLED + EXITED is terminal for pay)
  - name: shift_force_closed_and_recon_autocreated
    claim_type: side_effect_execution
    grounds:
    - state_machines.AttendantShift.OPEN_to_FORCE_CLOSED
    - entities.ReconciliationRecord.fields.reconciliation_status
    distinguishing_aspect: Close-of-business force-closes a still-OPEN shift AND auto-creates its DRAFT reconciliation; both side effects are observable.
    test_recipe:
      setup:
      - Facility with an OPEN shift (att-1, float 10000) never closed; clock 2026-08-01T23:00:00Z
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: FC Fac
