              captures: { otc_record_id: "$.data.id" }
          assert:
            - "first call: 201 with MedicationAdministrationRecord.${rx_record_id}.compliance_flag == DOCUMENTATION_INCOMPLETE and record_status == RECORDED"
            - "second call: 201 with MedicationAdministrationRecord.${rx_witnessed_id}.compliance_flag == COMPLIANT"
            - "third call: 201 with MedicationAdministrationRecord.${otc_record_id}.compliance_flag == COMPLIANT - the incomplete flag is class-specific"
            - "Camp.${camp_id}.controlled_on_hand_units == 0 - no CONTROLLED record was written, so the ledger is untouched"

  # ------------------------------------------------------------------ 1.2 ---
  - section: state_machines
    instances:
      - name: state_license_axis_walks_every_declared_edge_and_recomputes_posture_each_step
        claim_type: Valid Transition
        grounds:
          - state_machines[Camp.state_license_status]
          - endpoints[PATCH /accreditation/camps/{campId}/state-license]
          - calculations.camp_compliance_posture
        distinguishing_aspect: "All eight license edges are exercised on two camps; each PATCH must re-derive compliance_posture and risk_index and bump Camp.version, and the accreditation_status axis must stay NOT_ACCREDITED throughout - the two axes are independent."
        test_recipe:
          setup:
            - "two DAY/YOUTH_ONLY camps staffed FIRST_AIDER_ONLY so the staffing-gap branch never contributes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "License Walk Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/camps"
              payload: { name: "Direct Active Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp2_id: "$.data.id" }
          trigger:
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "PENDING", state_license_number: "OH-CAMP-10001" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "ACTIVE" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "PROBATION" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "SUSPENDED" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "ACTIVE" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp2_id}/state-license"
              payload: { state_license_status: "ACTIVE", state_license_number: "OH-CAMP-10002" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp2_id}/state-license"
              payload: { state_license_status: "PROBATION" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp2_id}/state-license"
              payload: { state_license_status: "ACTIVE" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
          assert:
            - "NONE -> PENDING: 200, state_license_status == PENDING, state_license_number == OH-CAMP-10001, compliance_posture == RESTRICTED, risk_index == 14.00, version == 2"
            - "PENDING -> ACTIVE: state_license_status == ACTIVE, compliance_posture == OPEN, risk_index == 10.00, version == 3"
            - "ACTIVE -> PROBATION: compliance_posture == RESTRICTED, risk_index == 20.00, version == 4"
            - "PROBATION -> SUSPENDED: compliance_posture == FROZEN, health_intake_status == SUSPENDED, risk_index == 30.00, version == 5"
            - "SUSPENDED -> ACTIVE: compliance_posture == OPEN, health_intake_status == OPEN, risk_index == 10.00, version == 6"
            - "second camp NONE -> ACTIVE direct: 200, state_license_status == ACTIVE, compliance_posture == OPEN, version == 2"
            - "second camp ACTIVE -> PROBATION -> ACTIVE: postures RESTRICTED then OPEN, version 3 then 4"
            - "Camp.${camp_id}.accreditation_status == NOT_ACCREDITED after all five license writes"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines[AccreditationCycle]
          - state_machines[AccreditationVisit]
          - state_machines[VisitAssignment]
          - state_machines[Visitor]
          - state_machines[WrittenPlan]
          - state_machines[AnnualReport]
          - state_machines[StandardEvaluation.self_status]
          - state_machines[StandardEvaluation.visit_status]
        distinguishing_aspect: "Nine rows are created in one chain and each must land on its declared initial_state, including the StandardEvaluation pair DRAFT/UNSCORED which is created implicitly by cycle creation rather than by its own POST."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
