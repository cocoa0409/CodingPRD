            - "Market DMA-506 with one quota cell, a published 2026Q3 universe of 120000 households and published edit rule set RS-2026Q3 (ascription 60, invalid-tuning 900, outlier cap 1200, weight ratio cap 2.5, fault threshold 1440)."
