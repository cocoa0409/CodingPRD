      - name: entity_immutability_beneficial_use_record_cannot_be_updated
        claim_type: immutability
        grounds:
          - "entities.BeneficialUseRecord"
          - "endpoints[POST /water-rights/{id}/beneficial-use-records]"
        distinguishing_aspect: >-
          BeneficialUseRecord is the only entity declared `common_fields: false`:
          its rows carry id and created_at but NO updated_at and NO version, and
          §1.5 exposes no PATCH/PUT/DELETE for it — the evidentiary ledger is
          append-only, so a correction can only be a new row for a new year.
        test_recipe:
          setup:
            - "One WaterRight for claimant A with a single 2024 METER record."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst, captures: {bur: "$.data.id"}}
            - {call: "GET /water-rights/${wr}/beneficial-use-records", payload: {use_year_from: 2024, use_year_to: 2024}, as: WaterRightsAnalyst}
          assert:
            - "The created row exposes id, water_right_id, use_year, reported_diversion_af, irrigated_acres, verification_source, reported_by_user_id and created_at."
            - "The row exposes NO `updated_at` and NO `version` field (entities.BeneficialUseRecord declares common_fields: false)."
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path contains /beneficial-use-records — the only write is the POST used here."
            - "GET /water-rights/${wr}/beneficial-use-records with use_year_from 2024 / use_year_to 2024 returns exactly 1 row whose id equals the created id."

