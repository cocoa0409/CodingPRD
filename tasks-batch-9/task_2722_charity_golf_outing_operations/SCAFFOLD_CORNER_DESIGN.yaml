            - "${e_occupied} == 'ERR_ASSET_OCCUPIED' (HTTP 409) - the hole-3 sign carries a RESERVED allocation, and GET /outing-ops/sponsorship-assets/${sign3_id} still reads status == 'RESERVED' with remaining_capacity == 0"
            - "GET /outing-ops/outings/${o_id} reads reserved_asset_slot_count == 2 - the five refused calls left the conserved inventory counter untouched"

      - name: the_fulfillment_deadline_is_inclusive_and_yields_to_the_segregation_of_duties_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=15]
          - validations[priority=25]
          - errors.ERR_FULFILLMENT_WINDOW_ELAPSED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The deadline comparison is inclusive - APPROVE_ARTWORK sent at exactly fulfillment_due_at is accepted - and one second past the deadline the segregation-of-duties check at priority 15 still outranks the temporal check at priority 25, so the approver's own VERIFY reports 403 SEGREGATION and only a different user surfaces the 409 window error."
        test_recipe:
          setup:
            - "An OPEN outing with a SPONSOR tier priced 250000 (entitles nothing) held by one CONFIRMED registration."
            - "A HOLE_SIGN asset on hole 7 with list_price_cents 60000 and fulfillment_due_at 2026-09-10T00:00:00Z, carrying one COMMITTED upsell allocation."
            - "Two SponsorshipManager users act here: X-User-Id 'sm-approver' issued COMMIT and issues APPROVE_ARTWORK and INSTALL; X-User-Id 'sm-verifier' is the second, independent user."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/outings"
              payload: { name: "Fulfillment Deadline Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "SPON_PLAIN", kind: "SPONSOR", price_cents: 250000, player_slots: 0, gsv_cents: 0, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Ridgeline Insurance", player_count: 0 }
              as: SponsorshipManager
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 250000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/sponsorship-assets"
              payload: { outing_id: "${o_id}", asset_type: "HOLE_SIGN", label: "Hole 7 tee sign", hole_number: 7, capacity: 1, exclusive: false, list_price_cents: 60000, fulfillment_due_at: "2026-09-10T00:00:00Z" }
              as: SponsorshipManager
              captures: { as_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r_id}", sponsorship_asset_id: "${as_id}", source: "UPSELL" }
              as: SponsorshipManager
              captures: { al_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "COMMIT" }
              as: SponsorshipManager
              as_user_id: "sm-approver"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "APPROVE_ARTWORK" }
              as: SponsorshipManager
              as_user_id: "sm-approver"
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "INSTALL" }
              as: SponsorshipManager
              as_user_id: "sm-approver"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:01Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "VERIFY" }
              as: SponsorshipManager
              as_user_id: "sm-approver"
              captures: { e_sod: $.data.error_id }
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "VERIFY" }
              as: SponsorshipManager
              as_user_id: "sm-verifier"
              captures: { e_window: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T23:59:59Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "VERIFY" }
              as: SponsorshipManager
              as_user_id: "sm-verifier"
          assert:
            - "APPROVE_ARTWORK sent by 'sm-approver' at exactly the fulfillment_due_at instant is HTTP 200 with status == 'ARTWORK_APPROVED' and artwork_approved_by_user_id == 'sm-approver' - the comparison is 'at or before', not 'strictly before'"
            - "INSTALL is HTTP 200 with status == 'INSTALLED'"
            - "one second past the deadline the VERIFY sent by 'sm-approver' (the SAME user who approved the artwork) is HTTP 403 with ${e_sod} == 'ERR_SEGREGATION_OF_DUTIES', NOT ERR_FULFILLMENT_WINDOW_ELAPSED - priority 15 is evaluated before priority 25 even though both are violated"
            - "the VERIFY sent by 'sm-verifier' at the same clock instant is HTTP 409 with ${e_window} == 'ERR_FULFILLMENT_WINDOW_ELAPSED' - with the duties check satisfied the temporal check finally surfaces"
            - "after the clock is moved back one second inside the window the VERIFY by 'sm-verifier' is HTTP 200 with status == 'VERIFIED' and verified_by_user_id == 'sm-verifier'"
            - "GET /outing-ops/sponsorship-assets/${as_id} then reads fulfilled_count == 1, committed_count == 0, remaining_capacity == 0 and status == 'FULFILLED'"

      - name: a_contract_void_exactly_on_the_notice_boundary_is_refused_and_a_sold_field_outranks_it
        claim_type: Priority Ordering
        grounds:
          - validations[priority=26]
          - validations[priority=8]
          - state_machines.CourseContract.SIGNED_to_VOIDED
          - errors.ERR_CANCELLATION_NOTICE_VIOLATION
        distinguishing_aspect: "The notice test is STRICT - current_utc must be strictly before scheduled_date minus cancellation_notice_days, so the instant exactly 30 days out is refused and one second earlier is accepted - and when the outing has already sold a package the state precondition at priority 8 reports ERR_INVALID_STATE_TRANSITION instead of the notice error."
