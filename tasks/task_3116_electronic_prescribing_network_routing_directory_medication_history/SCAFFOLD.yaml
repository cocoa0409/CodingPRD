# =============================================================================
# PRD Benchmark Seed Tables — task_3116
# Electronic Prescribing Network Routing, Directory & Medication History
# =============================================================================

scenario: |
  Electronic Prescribing Network Routing, Directory & Medication History (Surescripts):
  prescriber and pharmacy directory maintenance with service levels each endpoint
  supports, prescription routing with message standards covering new orders, refill
  requests, changes and cancellations, controlled substance prescribing requiring
  identity proofing and two-factor authentication at signing, medication history
  aggregation from pharmacy fill data and payer claims with patient consent rules,
  benefit and formulary information delivered at the point of prescribing with
  real-time cost estimates, error handling for undeliverable prescriptions with
  fallback to fax or print, participant certification testing before production
  enablement, transaction fee structures across senders and receivers.

domain_name: eprescribing-network-routing
api_prefix: /network

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - conditional_feature_flags
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 11
  state_machine_count: 8
  calculation_count: 7
  validation_layers: 10
  endpoint_count: 75
  error_code_count: 48
  role_count: 6

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: NetworkParticipant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the participant organization" }
      - { name: participant_type, type: enum, source: input, description: "PRESCRIBER_CLINIC | PHARMACY | PAYER | HUB" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier, exactly 10 digits" }
      - { name: certification_status, type: enum, source: system, default: "UNCERTIFIED", description: "UNCERTIFIED | IN_CERTIFICATION | CERTIFIED | SUSPENDED" }
      - { name: certification_tests_passed, type: array, source: system, default: [], description: "Distinct certification test codes that returned PASS, ordered by first-PASS created_at" }
      - { name: volume_billing_mode, type: enum, source: input, default: "MONTHLY", description: "MONTHLY | ROLLING_90_DAY — selects the tier basis for transaction fee settlement" }
      - { name: directory_listed, type: boolean, source: computed, description: "true iff certification_status == CERTIFIED AND at least one DirectoryEndpoint with status IN {ACTIVE, DEGRADED} exists for this participant" }
      - { name: delivery_reachability, type: enum, source: computed, description: "FULL | AT_RISK | UNREACHABLE — derived enumeration returned on the participant detail read; never gates a write" }
      - { name: open_route_attempt_count, type: integer, source: computed, default: 0, description: "Count of RoutingAttempt rows whose outcome == IN_PROGRESS and whose prescription receiving participant is this participant" }
      - { name: fallback_channel, type: enum, source: input, default: "FAX", description: "FAX | PRINT — channel used when network routing cannot deliver" }
      - { name: fax_number, type: string, source: input, description: "Fallback fax destination, null when not provisioned", default: null }
      - { name: plan_copay_cents, type: integer, source: input, default: 1500, description: "PAYER only: fixed per-fill copay" }
      - { name: plan_coinsurance_pct, type: number, source: input, default: 0.2, description: "PAYER only: patient coinsurance fraction" }
      - { name: plan_deductible_cents, type: integer, source: input, default: 10000, description: "PAYER only: annual deductible" }
      - { name: plan_deductible_met_cents, type: integer, source: system, default: 0, description: "PAYER only: deductible consumed so far" }
      - { name: plan_brand_fee_cents, type: integer, source: input, default: 300, description: "PAYER only: per-fill brand / dispensing fee" }
      - { name: formulary_preferred_pct, type: number, source: input, default: 0.3, description: "PAYER only: discount off benchmark price when formulary_status == PREFERRED" }
      - { name: plan_benefit_cap_cents, type: integer, source: input, default: 50000, description: "PAYER only: ceiling on plan payment for one fill" }

  - name: DirectoryEndpoint
    parent: NetworkParticipant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> NetworkParticipant.id; owning participant" }
      - { name: service_set, type: enum, source: input, description: "NEW_RX | REFILL_RX | CHANGE_CANCEL | MED_HISTORY | BENEFIT_COST | ELIGIBILITY_FORMULARY" }
      - { name: endpoint_role, type: enum, source: input, description: "SENDER | RECEIVER | BOTH" }
      - { name: service_level, type: enum, source: input, description: "ELIGIBLE_A | ELIGIBLE_B | ELIGIBLE_C" }
      - { name: sla_response_minutes, type: integer, source: input, description: "Contracted response service level" }
      - { name: message_standard, type: enum, source: input, description: "NCPDP_SCRIPT_2017071 | NCPDP_SCRIPT_2022011" }
      - { name: effective_from, type: datetime, source: input, description: "Start of the endpoint's service interval, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "End of the endpoint's service interval, exclusive; null means open-ended", default: null }
      - { name: status, type: enum, source: system, default: "PENDING_CERT", description: "PENDING_CERT | ACTIVE | DEGRADED | DISABLED" }
      - { name: reported_attempt_count, type: integer, source: computed, default: 0, description: "Count of RoutingAttempt rows reported against this endpoint that are not IN_PROGRESS" }
      - { name: acknowledged_count, type: integer, source: computed, default: 0, description: "Count of reported RoutingAttempt rows for this endpoint whose outcome == ACKNOWLEDGED" }
      - { name: reliability_ratio, type: number, source: computed, default: 1.0, description: "Chronological variant: acknowledged_count / reported_attempt_count over the last 20 reported attempts ending with the latest" }
      - { name: reliability_ratio_ewma, type: number, source: computed, default: 1.0, description: "Exponentially weighted variant of the same outcome history, half-life 10 attempts" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: prescriber_id, type: string, source: input, description: "FK -> NetworkParticipant.id; the prescribing clinic" }
      - { name: receiving_pharmacy_id, type: string, source: input, description: "FK -> NetworkParticipant.id; the pharmacy that receives the order" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient" }
      - { name: drug_ndc, type: string, source: input, description: "11-digit National Drug Code" }
      - { name: transaction_type, type: enum, source: input, description: "NEW_RX | REFILL_REQUEST | REFILL_RESPONSE | CHANGE_REQUEST | CHANGE_RESPONSE | CANCEL_REQUEST | CANCEL_RESPONSE" }
      - { name: controlled_schedule, type: enum, source: input, description: "NON_CONTROLLED | SCHEDULE_II | SCHEDULE_III | SCHEDULE_IV | SCHEDULE_V" }
      - { name: message_standard, type: enum, source: input, description: "NCPDP_SCRIPT_2017071 | NCPDP_SCRIPT_2022011" }
      - { name: days_supply, type: integer, source: input, description: "Days of therapy dispensed" }
      - { name: quantity, type: integer, source: input, description: "Dispensed quantity in the drug's unit of measure" }
      - { name: refills_authorized, type: integer, source: input, description: "Refills authorized on the original order" }
      - { name: refills_used, type: integer, source: system, default: 0, description: "Refills already consumed on this order" }
      - { name: is_controlled, type: boolean, source: computed, description: "true iff controlled_schedule != NON_CONTROLLED" }
      - { name: clinical_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SIGNED | ROUTED | DELIVERED | UNDELIVERABLE | REJECTED | CANCELLED" }
      - { name: routing_status, type: enum, source: system, default: "NOT_ROUTED", description: "NOT_ROUTED | ROUTING | ROUTED | BACKUP_SELECTION | FALLBACK_PENDING | FALLBACK_SENT | ROUTE_FAILED" }
      - { name: significance, type: enum, source: computed, description: "STANDARD | CRITICAL — CRITICAL when controlled_schedule IN {SCHEDULE_II, SCHEDULE_III} or monitored_under_consent is true; CRITICAL orders must reach a delivery outcome (DELIVERED or FALLBACK_SENT reach) before they may settle as CANCELLED" }
      - { name: monitored_under_consent, type: boolean, source: computed, description: "true when an ACTIVE PatientConsent for this prescription's patient carries scope == MEDICATION_HISTORY" }
      - { name: routing_attempt_count, type: integer, source: system, default: 0, description: "Monotone count of RoutingAttempt rows created for this prescription" }
      - { name: routed_endpoint_id, type: string, source: computed, description: "FK -> DirectoryEndpoint.id; the endpoint nominated by the routing selector for the most recent attempt, null before the first route", default: null }
      - { name: active_routing_attempt_id, type: string, source: computed, description: "FK -> RoutingAttempt.id; the single attempt in outcome IN_PROGRESS, null when none", default: null }
      - { name: signature_audit_id, type: string, source: computed, description: "Identity-assurance reference captured from the signing session that signed this order", default: null }

  - name: SigningSession
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the order being signed" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> NetworkParticipant.id; the signing clinic" }
      - { name: opened_at, type: datetime, source: system, description: "Instant the session window opened" }
      - { name: identity_proofing_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | PASSED | FAILED" }
      - { name: two_factor_status, type: enum, source: system, default: "NOT_STARTED", description: "NOT_STARTED | PENDING | PASSED | LOCKED — a FAILED identity proofing on the same session writes FAILED here so the session cannot be re-driven without abandon" }
      - { name: otp_challenge_code, type: string, source: system, description: "6-digit challenge code issued by request-otp, null before the challenge is issued", default: null }
      - { name: otp_attempt_count, type: integer, source: system, default: 0, description: "Failed verification attempts in this session" }
      - { name: session_status, type: enum, source: system, default: "OPEN", description: "OPEN | SIGNED | ABANDONED" }
      - { name: signed_at, type: datetime, source: system, description: "Instant the order was signed, null until SIGNED", default: null }

  - name: RoutingAttempt
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the order being routed" }
      - { name: attempt_no, type: integer, source: system, description: "Monotone attempt number within the prescription, starting at 1" }
      - { name: channel, type: enum, source: input, description: "NETWORK | FAX | PRINT" }
      - { name: target_endpoint_id, type: string, source: system, description: "FK -> DirectoryEndpoint.id; endpoint selected for a NETWORK attempt; null for FAX and PRINT", default: null }
      - { name: outcome, type: enum, source: system, default: "IN_PROGRESS", description: "IN_PROGRESS | ACKNOWLEDGED | REJECTED | UNDELIVERABLE" }
      - { name: failure_code, type: string, source: system, description: "Carrier-supplied failure classifier, null unless reported", default: null }
      - { name: error_code_returned, type: string, source: system, description: "Error code echoed from the trading partner, null unless reported", default: null }
      - { name: reported_at, type: datetime, source: system, description: "Instant the outcome was reported, null while IN_PROGRESS", default: null }
      - { name: correction_entry_id, type: string, source: computed, description: "Identifier of the TransactionFeeEntry CORRECTION row created when this report superseded a prior count on the same billing cell; null when this report superseded nothing", default: null }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Patient date of birth" }
      - { name: home_state, type: string, source: input, description: "Two-letter home state code" }
      - { name: covered_plan_payer_id, type: string, source: input, description: "FK -> NetworkParticipant.id; the patient's covered payer plan", default: null }
      - { name: discard_on_revoke, type: boolean, source: input, default: false, description: "true means revoking consent retracts that patient's medication history records" }
      - { name: consent_status, type: enum, source: system, default: "NONE", description: "NONE | GRANTED | REVOKED | EXPIRED" }
      - { name: consent_version, type: integer, source: system, default: 0, description: "Incremented on every consent grant and every consent revocation" }
      - { name: history_record_count, type: integer, source: computed, default: 0, description: "Count of MedicationHistoryRecord rows for this patient with retracted_at == null" }

  - name: PatientConsent
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; the consenting patient" }
      - { name: scope, type: enum, source: input, description: "MEDICATION_HISTORY | BENEFIT_CHECK | BOTH" }
      - { name: duration_days, type: integer, source: input, description: "Validity window length in days, counted from granted_at" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REVOKED | EXPIRED — a grant whose computed expires_at is not later than the current logical clock is written straight to EXPIRED rather than ACTIVE" }
      - { name: granted_at, type: datetime, source: system, description: "Instant the consent was granted" }
      - { name: expires_at, type: datetime, source: computed, description: "granted_at + duration_days; half-open validity interval [granted_at, expires_at)" }
      - { name: revoked_at, type: datetime, source: system, description: "Instant the consent was revoked, null while ACTIVE", default: null }

  - name: MedicationHistoryBatch
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; the patient whose history is aggregated" }
      - { name: trigger_reason, type: enum, source: input, description: "PRESCRIBER_QUERY | CONSENT_GRANT | SCHEDULED_REFRESH" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | AGGREGATING | COMPLETE | FAILED" }
      - { name: subscription_generation, type: integer, source: system, default: 0, description: "Round counter incremented on every COMPLETE → AGGREGATING refresh, leaving PENDING and reaching COMPLETE" }
      - { name: consent_version_snapshot, type: integer, source: computed, description: "Patient.consent_version observed when the batch left PENDING" }
      - { name: source_record_count, type: integer, source: computed, default: 0, description: "Count of source MedicationHistoryRecord rows considered by the batch" }
      - { name: record_count, type: integer, source: computed, default: 0, description: "Count of distinct dedupe_key groups surviving deduplication" }
      - { name: superseded_count, type: integer, source: computed, default: 0, description: "Count of source records discarded as duplicates within this batch" }
      - { name: batch_cost_cents, type: integer, source: computed, default: 0, description: "Query fee charged for the batch under the medication-history fee schedule" }

  - name: MedicationHistoryRecord
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient the record belongs to" }
      - { name: source_type, type: enum, source: input, description: "PHARMACY_FILL | PAYER_CLAIM" }
      - { name: source_participant_id, type: string, source: input, description: "FK -> NetworkParticipant.id; reporting pharmacy or payer" }
      - { name: drug_ndc, type: string, source: input, description: "11-digit National Drug Code" }
      - { name: fill_date, type: datetime, source: input, description: "Fill or claim service date" }
      - { name: days_supply, type: integer, source: input, description: "Days supplied on the fill" }
      - { name: quantity, type: integer, source: input, description: "Quantity dispensed on the fill" }
      - { name: dedupe_key, type: string, source: computed, description: "patient_id + '|' + drug_ndc + '|' + YYYY-MM-DD(fill_date) + '|' + days_supply" }
      - { name: is_superseded, type: boolean, source: computed, default: false, description: "true when a higher-ranked source record won the dedupe group in the last batch that evaluated it" }
      - { name: aggregation_batch_id, type: string, source: computed, description: "FK -> MedicationHistoryBatch.id; batch that last evaluated this record", default: null }
      - { name: retracted_at, type: datetime, source: system, description: "Instant the record was retracted, null while live", default: null }

  - name: BenefitCheck
    parent: Prescription
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; the order being priced" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; the patient on the order" }
      - { name: payer_id, type: string, source: input, description: "FK -> NetworkParticipant.id; the payer whose formulary and benefit plan apply" }
      - { name: benchmark_price_cents, type: integer, source: input, description: "Network benchmark price for this NDC and quantity, as supplied on the eligibility request" }
      - { name: formulary_status, type: enum, source: system, default: "UNKNOWN", description: "UNKNOWN | PREFERRED | NON_PREFERRED | NOT_COVERED | PRIOR_AUTH_REQUIRED" }
      - { name: coverage_status, type: enum, source: system, default: "UNKNOWN", description: "UNKNOWN | ACTIVE | INACTIVE" }
      - { name: check_status, type: enum, source: system, default: "PENDING", description: "PENDING | COMPLETE | FAILED" }
      - { name: pricing_variant, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | FINAL" }
      - { name: deductible_met_snapshot_cents, type: integer, source: computed, description: "payer plan_deductible_met_cents captured when the check left PENDING" }
      - { name: estimated_patient_pay_cents, type: integer, source: computed, description: "What the patient is estimated to pay for this fill" }
      - { name: estimated_plan_pay_cents, type: integer, source: computed, description: "What the plan is estimated to pay for this fill" }

  - name: TransactionFeeEntry
    parent: NetworkParticipant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> NetworkParticipant.id; the billed participant" }
      - { name: month_key, type: string, source: input, description: "Billing month in YYYY-MM form" }
      - { name: transaction_type, type: enum, source: input, description: "NEW_RX | REFILL_RESPONSE | CHANGE_RESPONSE | CANCEL_RESPONSE | MED_HISTORY | BENEFIT_COST | ELIGIBILITY_FORMULARY" }
      - { name: direction, type: enum, source: input, description: "SENT | RECEIVED" }
      - { name: transaction_count, type: integer, source: system, description: "Number of transactions counted from the network ledger for this cell" }
      - { name: fee_tier, type: enum, source: computed, description: "FREE | STANDARD | VOLUME — the marginal tier the transaction_count settled into" }
      - { name: fee_cents, type: integer, source: computed, description: "Fee assessed for this cell under the sender or receiver schedule" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "PARTIAL | POSTED | REVERSED — PARTIAL rows are the per-report accruals created by report-acknowledged; REVERSED marks that a compensating row has been posted against this entry, and because the ledger is append-only a REVERSED row's fee_cents still sits inside period_net_total_cents where its compensating row cancels it" }
      - { name: entry_type, type: enum, source: system, default: "CHARGE", description: "CHARGE | CORRECTION | MANUAL_REVERSAL — CORRECTION rows record a superseded count from a repeated report, MANUAL_REVERSAL rows are the compensating rows created by the reverse endpoint" }
      - { name: previous_count, type: integer, source: system, description: "Chargeable count a CORRECTION row replaces, null on CHARGE rows", default: null }
      - { name: new_count, type: integer, source: system, description: "Chargeable count a CORRECTION row asserts, null on CHARGE rows", default: null }
      - { name: reversal_of_entry_id, type: string, source: system, description: "FK -> TransactionFeeEntry.id; the entry this row compensates, null for ordinary entries", default: null }
      - { name: reversal_entry_id, type: string, source: computed, description: "FK -> TransactionFeeEntry.id; the compensating row already created for this entry, null when none", default: null }
      - { name: period_net_total_cents, type: integer, source: computed, description: "Sum of fee_cents over EVERY TransactionFeeEntry row for the same (participant_id, month_key), independent of status; identical on every such row, and the quantity that a charge followed by its reversal leaves unchanged" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: NetworkParticipant
    field: certification_status
    initial_state: UNCERTIFIED
    terminal_states: []
    shape: branching_with_revert
    transitions:
      - from: UNCERTIFIED
        to: IN_CERTIFICATION
        trigger: POST /network/participants/{id}/certification/start
        actor: ParticipantAdmin
        preconditions:
          - "At least one DirectoryEndpoint row exists for this participant (ERR_CERT_NO_ENDPOINT)"
        side_effects:
          - "certification_tests_passed reset to []"
          - "participant.version += 1"
      - from: IN_CERTIFICATION
        to: IN_CERTIFICATION
        trigger: POST /network/participants/{id}/certification/tests
        actor: ParticipantAdmin
        preconditions:
          - "test_code ∈ {CONNECTIVITY, SCRIPT_NEW_RX, SCRIPT_REFILL, SCRIPT_CHANGE_CANCEL, MED_HISTORY, BENEFIT_COST, ELIGIBILITY_FORMULARY} (ERR_UNKNOWN_TEST_CODE)"
          - "outcome ∈ {PASS, FAIL} (ERR_INVALID_REQUEST)"
        side_effects:
          - "On PASS: if test_code ∉ certification_tests_passed, append it; certification_tests_passed is ordered by first-PASS created_at ASC"
          - "participant.version += 1"
        note: "Self-loop inside IN_CERTIFICATION — required because the participant must accumulate passes one test at a time"
      - from: IN_CERTIFICATION
        to: CERTIFIED
        trigger: POST /network/participants/{id}/certify
        actor: ParticipantAdmin
        preconditions:
          - "certification_tests_passed ⊇ {CONNECTIVITY, SCRIPT_NEW_RX} (ERR_CERT_TESTS_INCOMPLETE)"
          - "presence of MED_HISTORY requires presence of ELIGIBILITY_FORMULARY (ERR_CERT_TEST_PREREQUISITE)"
          - "expected_participant_version == participant.version (ERR_PARTICIPANT_STALE_VERSION)"
        side_effects:
          - "certification_status = CERTIFIED"
          - "every DirectoryEndpoint of this participant with status == PENDING_CERT → ACTIVE"
          - "participant.directory_listed recomputed; typically flips false → true"
          - "participant.version += 1"
      - from: CERTIFIED
        to: IN_CERTIFICATION
        trigger: POST /network/participants/{id}/certification/start
        actor: ParticipantAdmin
        preconditions:
          - "At least one certification test has been recorded with outcome FAIL since the last CERTIFIED stamp (ERR_CERT_NO_ENDPOINT otherwise)"
        side_effects:
          - "certification_status = IN_CERTIFICATION"
          - "every DirectoryEndpoint of this participant with status == ACTIVE → PENDING_CERT"
          - "participant.directory_listed recomputed; typically flips true → false"
          - "participant.version += 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: POST /network/participants/{id}/suspend
        actor: NetworkOperator
        preconditions: []
        side_effects:
          - "every DirectoryEndpoint of this participant → DISABLED"
          - "every Prescription with receiving_pharmacy_id == this participant and clinical_status == SIGNED and routing_status ∈ {NOT_ROUTED, BACKUP_SELECTION} → routing_status = ROUTE_FAILED"
          - "every RoutingAttempt of those prescriptions with outcome == IN_PROGRESS → outcome = UNDELIVERABLE with failure_code = NO_ROUTE / ERROR_ROUTE_NO_ENDPOINT"
          - "those prescriptions where no mandatory delivery remains → clinical_status = UNDELIVERABLE"
          - "participant.directory_listed recomputed; flips to false"
          - "participant.version += 1"
      - from: SUSPENDED
        to: IN_CERTIFICATION
        trigger: POST /network/participants/{id}/certification/start
        actor: ParticipantAdmin
        preconditions:
          - "At least one DirectoryEndpoint row exists for this participant (ERR_CERT_NO_ENDPOINT)"
        side_effects:
          - "certification_status = IN_CERTIFICATION"
          - "certification_tests_passed reset to []"
          - "participant.version += 1"

  # ---------------------------------------------------------------------------
  - entity: DirectoryEndpoint
    field: status
    initial_state: PENDING_CERT
    terminal_states: [DISABLED]
    shape: branching_with_revert
    transitions:
      - from: PENDING_CERT
        to: ACTIVE
        trigger: "system (automatic when the owning participant's certification_status becomes CERTIFIED while the endpoint's service interval is open)"
        actor: system
        preconditions: []
        side_effects:
          - "owning participant.directory_listed recomputed"
      - from: ACTIVE
        to: PENDING_CERT
        trigger: "system (automatic when the owning participant's certification_status leaves CERTIFIED for IN_CERTIFICATION)"
        actor: system
        preconditions: []
        side_effects:
          - "owning participant.directory_listed recomputed; flips true → false when this was the last endpoint in {ACTIVE, DEGRADED}"
      - from: ACTIVE
        to: DEGRADED
        trigger: POST /network/routing-attempts/{id}/report-undeliverable
        actor: NetworkOperator
        preconditions:
          - "in-flight RoutingAttempt.target_endpoint_id == this endpoint
             (ERR_ENDPOINT_NOT_ROUTED_ATTEMPT)"
          - "this transition must not make the participant's ratio of endpoints
             with status == ACTIVE fall strictly below 0.50; when it would, the
             endpoint stays ACTIVE and the operation returns the warning
             payload ERR_ENDPOINT_COVERAGE_WARNING instead of moving state
             (ERR_ENDPOINT_COVERAGE_WARNING)"
        side_effects:
          - "this endpoint's report_counters recomputed from its reported RoutingAttempt history"
          - "this endpoint's reliability_ratio and reliability_ratio_ewma recomputed"
          - "reported_attempt_count += 1 through the recompute (the reporting attempt leaves IN_PROGRESS)"
          - "owning participant.directory_listed recomputed"
        note: "Guard is a coverage invariant, not a race — a sequential retry once another endpoint is added succeeds"
      - from: DEGRADED
        to: ACTIVE
        trigger: POST /network/directory-endpoints/{id}/reactivate
        actor: ParticipantAdmin
        preconditions:
          - "owning participant.certification_status == CERTIFIED (ERR_CERT_TESTS_INCOMPLETE otherwise)"
          - "this endpoint's reliability_ratio >= 0.95 (ERR_ENDPOINT_NOT_STABLE)"
          - "the endpoint's half-open service interval [effective_from, effective_to) contains the current logical clock (ERR_ENDPOINT_OUT_OF_SERVICE_WINDOW)"
        side_effects:
          - "owning participant.directory_listed recomputed"
      - from: ACTIVE
        to: DISABLED
        trigger: POST /network/directory-endpoints/{id}/disable
        actor: NetworkOperator
        preconditions:
          - "no DirectoryEndpoint of the same participant and same service_set is in status ACTIVE after this disable (ERR_LAST_ACTIVE_ENDPOINT)"
        side_effects:
          - "owning participant.directory_listed recomputed; flips true → false when this was the last endpoint in {ACTIVE, DEGRADED}"
          - "CASCADE HOP 2 complete: participant.directory_listed == false fans out below"
          - "every Prescription with receiving_pharmacy_id == owning participant and clinical_status == SIGNED and routing_status ∈ {NOT_ROUTED, BACKUP_SELECTION} → routing_status = ROUTE_FAILED"
          - "CASCADE HOP 3 complete: each such prescription's in-flight attempt is then resolved"
          - "every RoutingAttempt whose prescription_id is one of those prescriptions and whose outcome == IN_PROGRESS → outcome = UNDELIVERABLE with failure_code = NO_ROUTE"
          - "every Prescription whose routing_status became ROUTE_FAILED and whose fallback_channel is null → clinical_status = UNDELIVERABLE"
          - "CASCADE HOP 4 complete: Prescription.clinical_status reached UNDELIVERABLE"
      - from: DEGRADED
        to: DISABLED
        trigger: POST /network/directory-endpoints/{id}/disable
        actor: NetworkOperator
        preconditions: []
        side_effects:
          - "owning participant.directory_listed recomputed"
      - from: PENDING_CERT
        to: DISABLED
        trigger: POST /network/directory-endpoints/{id}/disable
        actor: NetworkOperator
        preconditions: []
        side_effects:
          - "owning participant.directory_listed recomputed"

  # ---------------------------------------------------------------------------
  - entity: Prescription
    field: clinical_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: POST /network/prescriptions/{id}/sign
        actor: Prescriber
        preconditions:
          - "signing_session_id references a SigningSession whose prescription_id == this prescription, session_status == OPEN, identity_proofing_status == PASSED, two_factor_status == PASSED, session_status == OPEN and prescription.active_routing_attempt_id is null (ERR_INVALID_STATE)"
          - "prescription.is_controlled == true requires SigningSession.identity_proofing_status == PASSED AND two_factor_status == PASSED (ERR_IDENTITY_PROOFING_REQUIRED)"
          - "prescription.message_standard == NCPDP_SCRIPT_2017071 requires controlled_schedule ∉ {SCHEDULE_II, SCHEDULE_III, SCHEDULE_IV, SCHEDULE_V} (ERR_CONTROLLED_NOT_SUPPORTED_BY_STANDARD)"
          - "prescription.is_controlled == true requires the receiving pharmacy's DirectoryEndpoint for service_set NEW_RX to be in status ACTIVE (ERR_PHARMACY_NOT_CERTIFIED_FOR_CONTROLLED)"
        side_effects:
          - "clinical_status = SIGNED"
          - "signature_audit_id = signing_session_id"
          - "SigningSession.session_status = SIGNED and signed_at stamped"
          - "routing_status remains NOT_ROUTED; the order is routed by a separate call"
      - from: SIGNED
        to: ROUTED
        trigger: POST /network/prescriptions/{id}/route
        actor: Prescriber
        preconditions:
          - "expected_prescription_version == prescription.version (ERR_STALE_VERSION)"
          - "active_routing_attempt_id is null (ERR_ROUTE_ATTEMPT_IN_PROGRESS)"
          - "at least one DirectoryEndpoint of receiving_pharmacy_id with service_set ∈ {NEW_RX, REFILL_RX, CHANGE_CANCEL} matching transaction_type is in status ACTIVE or DEGRADED (ERR_NO_ROUTE_AVAILABLE)"
        side_effects:
          - "a RoutingAttempt is created in outcome IN_PROGRESS on the endpoint chosen by the routing selector"
          - "routed_endpoint_id = that endpoint"
          - "routing_status = ROUTING then ROUTED; clinical_status = ROUTED"
          - "prescription.version += 1"
      - from: ROUTED
        to: ROUTED
        trigger: POST /network/prescriptions/{id}/route
        actor: Prescriber
        preconditions:
          - "expected_prescription_version == prescription.version (ERR_STALE_VERSION)"
          - "active_routing_attempt_id is null (ERR_ROUTE_ATTEMPT_IN_PROGRESS)"
        side_effects:
          - "transaction_type ∈ {NEW_RX, REFILL_RESPONSE, CHANGE_RESPONSE, CANCEL_RESPONSE} requires the selected endpoint's message_standard == prescription.message_standard (ERR_MESSAGE_STANDARD_MISMATCH)"
          - "refills_used incremented when transaction_type == REFILL_RESPONSE"
          - "prescription.version += 1"
        note: "Self-loop: a refill, change or cancel response re-routes on the same prescription without leaving ROUTED"
      - from: ROUTED
        to: DELIVERED
        trigger: POST /network/routing-attempts/{id}/report-acknowledged
        actor: NetworkOperator
        preconditions:
          - "routing_status ∈ {ROUTED, BACKUP_SELECTION} (ERR_INVALID_STATE)"
          - "the reported attempt's prescription_id == this prescription (ERR_ATTEMPT_PRESCRIPTION_MISMATCH)"
        side_effects:
          - "clinical_status = DELIVERED"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
          - "routing_status = ROUTED; active_routing_attempt_id = null"
      - from: ROUTED
        to: UNDELIVERABLE
        trigger: POST /network/routing-attempts/{id}/report-undeliverable
        actor: NetworkOperator
        preconditions:
          - "the reported attempt's outcome leaves IN_PROGRESS (ERR_INVALID_STATE)"
          - "fallback_channel is not null, or the attempt's failure_code ∉ {PATIENT_UNKNOWN, BENEFIT_EXHAUSTED} (ERR_FALLBACK_NOT_PERMITTED)"
          - "the attempt's failure_code ∈ {NO_ROUTE, CF_0000, CF_0001, CF_0002, CF_0003, CF_0004, CF_0005, CF_0006, CF_0007, TRANSMISSION_TIMEOUT} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "clinical_status = UNDELIVERABLE"
          - "routing_status = ROUTE_FAILED"
      - from: ROUTED
        to: REJECTED
        trigger: POST /network/routing-attempts/{id}/report-rejected
        actor: NetworkOperator
        preconditions:
          - "the reported attempt's outcome leaves IN_PROGRESS (ERR_INVALID_STATE)"
          - "the attempt's failure_code ∈ {CF_0003, CF_0007, POST_DELIVERY} (ERR_INVALID_STATE when the failure_code is a transport classifier such as CF_0000)"
        side_effects:
          - "clinical_status = REJECTED"
          - "routing_status = ROUTE_FAILED"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
          - "the reliability recompute can move that endpoint ACTIVE → DEGRADED"
      - from: ROUTED
        to: CANCELLED
        trigger: POST /network/prescriptions/{id}/cancel
        actor: Prescriber
        preconditions:
          - "routing_status ∈ {ROUTED, BACKUP_SELECTION} (ERR_INVALID_STATE)"
          - "significance == STANDARD (ERR_CRITICAL_ORDER_DELIVERY_REQUIRED) when prescription.significance == CRITICAL"
        side_effects:
          - "clinical_status = CANCELLED"
          - "any RoutingAttempt with outcome == IN_PROGRESS → outcome = REJECTED with failure_code = PRESCRIPTION_CANCELLED"
      - from: SIGNED
        to: CANCELLED
        trigger: POST /network/prescriptions/{id}/cancel
        actor: Prescriber
        preconditions:
          - "routing_status ∈ {NOT_ROUTED, FALLBACK_PENDING} (ERR_INVALID_STATE)"
        side_effects:
          - "clinical_status = CANCELLED"
          - "routing_status = NOT_ROUTED"
      - from: DELIVERED
        to: REJECTED
        trigger: POST /network/routing-attempts/{id}/report-rejected
        actor: NetworkOperator
        preconditions:
          - "the attempt reports a post-delivery rejection for the same prescription (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "clinical_status = REJECTED"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
          - "the error-leg fee evaluation triggered below creates a compensating EntryUpdateRequest for the participant's cell"
        note: "Reachable only after delivery; the reliability recompute makes it a real revert path"

  # ---------------------------------------------------------------------------
  - entity: Prescription
    field: routing_status
    initial_state: NOT_ROUTED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: NOT_ROUTED
        to: ROUTING
        trigger: POST /network/prescriptions/{id}/route
        actor: Prescriber
        preconditions:
          - "clinical_status == SIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "a RoutingAttempt in outcome IN_PROGRESS is created; active_routing_attempt_id = that attempt"
      - from: ROUTING
        to: ROUTED
        trigger: POST /network/routing-attempts/{id}/report-acknowledged
        actor: NetworkOperator
        preconditions:
          - "clinical_status ∈ {SIGNED, ROUTED} (ERR_INVALID_STATE)"
        side_effects:
          - "routing_status = ROUTED"
          - "active_routing_attempt_id is retained — the attempt stays in flight until a terminal report arrives"
          - "does not fire a TransactionFeeEntry; accrual happens on the report in ROUTED"
      - from: ROUTED
        to: BACKUP_SELECTION
        trigger: POST /network/routing-attempts/{id}/report-undeliverable
        actor: NetworkOperator
        preconditions:
          - "the reported attempt was routed to an endpoint whose post-transition status is DEGRADED — the endpoint's own status transition is applied first and the routing_status move observes it (ERR_INVALID_STATE otherwise)"
          - "at least one other DirectoryEndpoint of the same participant and service_set is in status ACTIVE or DEGRADED and is not already excluded by this prescription's failed attempts (ERR_NO_ROUTE_AVAILABLE)"
        side_effects:
          - "the backup nomination re-points the SAME in-flight attempt at the next-ranked endpoint: target_endpoint_id is reassigned to the winner of the backup_nomination variant and target_endpoint_id = prescription.routed_endpoint_id is added to the recomputed reliability history of the endpoint that just failed"
          - "no new RoutingAttempt row is created — Prescription.active_routing_attempt_id has a 1:1 cardinality, so the attempt number and routing_attempt_count are unchanged"
          - "routing_status = BACKUP_SELECTION"
        note: "Control returns to ROUTED when report-acknowledged fires on the re-pointed attempt, and report-undeliverable can move BACKUP_SELECTION straight to ROUTE_FAILED, so ROUTED → BACKUP_SELECTION → FALLBACK_PENDING is reachable without ever passing back through ROUTED"
      - from: ROUTED
        to: FALLBACK_PENDING
        trigger: POST /network/prescriptions/{id}/route-fallback
        actor: Prescriber
        preconditions:
          - "routing_status == ROUTE_FAILED (ERR_INVALID_STATE)"
          - "fallback_channel ∈ {FAX, PRINT} and, when FAX, fax_number is present (ERR_FALLBACK_CHANNEL_UNAVAILABLE)"
          - "at least one RoutingAttempt of this prescription carries outcome ∈ {UNDELIVERABLE, REJECTED} (ERR_NO_FAILED_ATTEMPT_TO_FALL_BACK)"
        note: "ROUTED -> FALLBACK_PENDING is reachable only when routing_status was previously moved to ROUTE_FAILED and then restored to ROUTED by an acknowledged retry; the ordinary path is BACKUP_SELECTION -> FALLBACK_PENDING below"
        side_effects:
          - "routing_status = FALLBACK_PENDING; active_routing_attempt_id = null"
      - from: BACKUP_SELECTION
        to: ROUTED
        trigger: POST /network/routing-attempts/{id}/report-acknowledged
        actor: NetworkOperator
        preconditions:
          - "the reported attempt belongs to this prescription (ERR_ATTEMPT_PRESCRIPTION_MISMATCH)"
        side_effects:
          - "routing_status = ROUTED; clinical_status = DELIVERED"
      - from: BACKUP_SELECTION
        to: FALLBACK_PENDING
        trigger: POST /network/prescriptions/{id}/route-fallback
        actor: Prescriber
        preconditions:
          - "no remaining endpoint in ACTIVE or DEGRADED (ERR_NO_ROUTE_AVAILABLE)"
        side_effects:
          - "routing_status = FALLBACK_PENDING"
      - from: BACKUP_SELECTION
        to: ROUTE_FAILED
        trigger: POST /network/routing-attempts/{id}/report-undeliverable
        actor: NetworkOperator
        preconditions:
          - "the reported attempt's target_endpoint_id is the endpoint nominated by the backup selector (ERR_ATTEMPT_PRESCRIPTION_MISMATCH otherwise)"
        side_effects:
          - "routing_status = ROUTE_FAILED; active_routing_attempt_id = null"
        note: "Now ROUTE_FAILED → route-fallback → FALLBACK_PENDING → report-fallback → FALLBACK_SENT is reachable, so the cyclic machine terminates"
      - from: FALLBACK_PENDING
        to: FALLBACK_SENT
        trigger: POST /network/routing-attempts/{id}/report-fallback
        actor: NetworkOperator
        preconditions:
          - "the attempt's channel != NETWORK (ERR_INVALID_STATE)"
          - "the attempt's outcome == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "routing_status = FALLBACK_SENT and clinical_status = DELIVERED"
          - "target_endpoint_id is null for this attempt"
      - from: FALLBACK_SENT
        to: ROUTED
        trigger: POST /network/routing-attempts/{id}/report-acknowledged
        actor: NetworkOperator
        preconditions:
          - "a NETWORK attempt for this prescription reaches outcome ACKNOWLEDGED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "routing_status = ROUTED; clinical_status = DELIVERED"
        note: "Closes the cycle: FALLBACK_SENT → ROUTED → BACKUP_SELECTION → FALLBACK_SENT requires a fresh failing attempt for a second loop, so the machine can loop indefinitely"

  # ---------------------------------------------------------------------------
  - entity: SigningSession
    field: session_status
    initial_state: OPEN
    terminal_states: [SIGNED, ABANDONED]
    shape: linear
    transitions:
      - from: OPEN
        to: OPEN
        trigger: POST /network/signing-sessions/{id}/identity-proof
        actor: Prescriber
        preconditions:
          - "session_status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "identity_proofing_status = PASSED or FAILED per the supplied outcome"
          - "a FAILED outcome also writes two_factor_status = FAILED and clears otp_challenge_code, so the session cannot reach two-factor verification"
          - "a controlled order additionally sets active_routing_attempt_id == null (ERR_ROUTE_ATTEMPT_IN_PROGRESS when an attempt is in flight)"
      - from: OPEN
        to: OPEN
        trigger: POST /network/signing-sessions/{id}/request-otp
        actor: Prescriber
        preconditions:
          - "identity_proofing_status == PASSED (ERR_IDENTITY_PROOFING_REQUIRED)"
          - "two_factor_status ∉ {LOCKED} (ERR_ACCOUNT_LOCKED)"
        side_effects:
          - "otp_challenge_code issued; two_factor_status = PENDING"
      - from: OPEN
        to: OPEN
        trigger: POST /network/signing-sessions/{id}/verify-otp
        actor: Prescriber
        preconditions:
          - "two_factor_status ∈ {PENDING} (ERR_INVALID_STATE)"
          - "otp_attempt_count < 3 (ERR_ACCOUNT_LOCKED)"
        side_effects:
          - "matching code: two_factor_status = PASSED"
          - "non-matching code: otp_attempt_count += 1; when otp_attempt_count reaches 3, two_factor_status = LOCKED (ERR_OTP_INVALID / ERR_ACCOUNT_LOCKED)"
          - "otp_challenge_code cleared on a successful verification"
      - from: OPEN
        to: SIGNED
        trigger: "system (automatic when the prescription is signed)"
        actor: system
        preconditions: []
        side_effects:
          - "signed_at stamped"
      - from: OPEN
        to: ABANDONED
        trigger: POST /network/signing-sessions/{id}/abandon
        actor: Prescriber
        preconditions: []
        side_effects:
          - "otp_challenge_code cleared"

  # ---------------------------------------------------------------------------
  - entity: RoutingAttempt
    field: outcome
    initial_state: IN_PROGRESS
    terminal_states: [ACKNOWLEDGED, REJECTED, UNDELIVERABLE]
    shape: linear
    transitions:
      - from: IN_PROGRESS
        to: ACKNOWLEDGED
        trigger: POST /network/routing-attempts/{id}/report-acknowledged
        actor: NetworkOperator
        preconditions:
          - "outcome == IN_PROGRESS (ERR_INVALID_STATE)"
          - "the prescription's clinical_status ≠ CANCELLED, REJECTED, UNDELIVERABLE (ERR_INVALID_STATE)"
        side_effects:
          - "reported_at stamped for this attempt"
          - "a TransactionFeeEntry accrual is evaluated for the billing cell (prescription.prescriber_id, month_key, transaction_type, direction SENT)"
          - "when the same cell already holds a non-IN_PROGRESS attempt for this prescription, an EntryUpdateRequest superseding form is created with entry_type == CORRECTION, previous_count = the cell's chargeable count before this report, new_count = that count + 1"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
      - from: IN_PROGRESS
        to: REJECTED
        trigger: POST /network/routing-attempts/{id}/report-rejected
        actor: NetworkOperator
        preconditions:
          - "outcome == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "reported_at stamped"
          - "clinical_status = REJECTED"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
      - from: IN_PROGRESS
        to: UNDELIVERABLE
        trigger: POST /network/routing-attempts/{id}/report-undeliverable
        actor: NetworkOperator
        preconditions:
          - "outcome == IN_PROGRESS (ERR_INVALID_STATE)"
          - "the prescription's clinical_status ∉ {CANCELLED, DELIVERED} (ERR_INVALID_STATE)"
        side_effects:
          - "reported_at stamped"
          - "target DirectoryEndpoint status ACTIVE → DEGRADED subject to the coverage invariant"
          - "the attempt's target DirectoryEndpoint report counters and reliability columns are recomputed"
          - "owning participant.directory_listed recomputed"
          - "the prescription's routing_status moves per the routing_status machine"

  # ---------------------------------------------------------------------------
  - entity: MedicationHistoryBatch
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETE, FAILED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: AGGREGATING
        trigger: POST /network/medication-history/batches/{id}/aggregate
        actor: NetworkOperator
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "an ACTIVE PatientConsent with scope ∈ {MEDICATION_HISTORY, BOTH} exists for the patient (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "consent_version_snapshot = patient.consent_version"
          - "source_record_count and the per-record dedupe_key and source_type are computed over MedicationHistoryRecord rows for this patient with retracted_at == null"
          - "records whose source participant is not CERTIFIED are excluded from deduplication and counted as skipped"
          - "CASCADE HOP 1 complete: the batch leaves PENDING"
      - from: AGGREGATING
        to: COMPLETE
        trigger: "system (automatic when aggregation work for the batch finishes)"
        actor: system
        preconditions:
          - "patient.consent_version == consent_version_snapshot (ERR_CONSENT_STALE)"
        side_effects:
          - "deduplication runs per the medication_history_dedupe rule; record_count and superseded_count stamped"
          - "is_superseded and aggregation_batch_id stamped on every evaluated record"
          - "CASCADE HOP 2 complete: the record stamps force the patient aggregate below"
          - "patient.history_record_count recomputed"
          - "batch_cost_cents = 25 + 10 * source_record_count, capped per the medication-history fee schedule"
          - "CASCADE HOP 3 complete: payer deductible advance below"
          - "when the patient has a covered_plan_payer_id, that payer's plan_deductible_met_cents advances toward plan_deductible_cents"
          - "subscription_generation += 1"
      - from: COMPLETE
        to: AGGREGATING
        trigger: POST /network/medication-history/batches/{id}/aggregate
        actor: NetworkOperator
        preconditions:
          - "status == COMPLETE (ERR_INVALID_STATE)"
          - "the patient remains consenting (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "subscription_generation += 1 and a fresh dedupe pass re-evaluates the record set"
        note: "Cyclic: a completed batch can be re-aggregated in place, which is why subscription_generation is a round counter"
      - from: AGGREGATING
        to: FAILED
        trigger: "system (automatic when patient.consent_version != consent_version_snapshot at the moment aggregation would settle)"
        actor: system
        preconditions: []
        side_effects:
          - "record_count, superseded_count and batch_cost_cents remain 0"

  # ---------------------------------------------------------------------------
  - entity: TransactionFeeEntry
    field: status
    initial_state: POSTED
    terminal_states: [REVERSED]
    shape: linear
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: POST /network/transaction-fees/{id}/reverse
        actor: NetworkOperator
        preconditions:
          - "this entry's status == POSTED (ERR_INVALID_STATE) and the entry is not an unsettled PARTIAL accrual (ERR_ENTRY_NOT_REVERSIBLE)"
          - "this entry's reversal_of_entry_id is null — a compensating row cannot itself be compensated (ERR_ENTRY_NOT_REVERSIBLE)"
          - "expected_participant_version == participant.version (ERR_PARTICIPANT_STALE_VERSION)"
        side_effects:
          - "status = REVERSED — a marker only; the entry keeps its fee_cents and remains inside period_net_total_cents"
          - "a compensating TransactionFeeEntry is created with entry_type = MANUAL_REVERSAL, status POSTED, direction equal to this entry's direction, transaction_count equal to the NEGATION of this entry's transaction_count, fee_cents equal to the NEGATION of this entry's fee_cents, and reversal_of_entry_id = this entry's id"
          - "this entry's reversal_entry_id points at the compensating row"
          - "Conserved quantity #1 == period_net_total_cents: sum(fee_cents) over ALL entries for this participant and month_key is independent of status, so the +fee_cents charge and the -fee_cents compensation cancel it back to its pre-charge value"
          - "Conserved quantity #2 == period_net_count: sum(transaction_count) over ALL entries for this (participant_id, month_key, transaction_type, direction) is independent of status, so the +count charge and the -count compensation cancel it back to its pre-charge value"
          - "the participant's version += 1"

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: prescription-route-stale-version
    parent_entity: Prescription
    write_endpoint: "POST /network/prescriptions/{id}/route"
    occ_field: "expected_prescription_version"
    description: |
      A route request carrying a Prescription version older than the one the
      server currently holds is rejected before any RoutingAttempt is created.
      The version advances on the prescription's own state transitions and on
      every cascaded side effect that touches it, so a client that read the
      prescription before its last sign or report holds a stale view and its
      route request is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: participant-certify-stale-version
    parent_entity: NetworkParticipant
    write_endpoint: "POST /network/participants/{id}/certify"
    occ_field: "expected_participant_version"
    description: |
      A certification promotion carrying a NetworkParticipant version older than
      the one the server currently holds is rejected. The participant's version
      advances on every certification-test recording, every endpoint status
      cascade rolled up into directory_listed, and every fee reversal billed to
      it, so a client that read the participant before any of those holds a
      stale view and its certify request is refused.
    error_id: ERR_PARTICIPANT_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1: dual-variant on the DirectoryEndpoint domain -------------------
  - name: reliability_factor
    trigger: "any RoutingAttempt of an endpoint reaching a non-IN_PROGRESS outcome, and on read of any endpoint"
    algorithm: weighted_scoring
    formula: |
      Chronological variant (the `reliability_ratio` column — THIS is the one
      every gate uses):
        ordered = RoutingAttempt rows for this endpoint whose outcome != IN_PROGRESS,
                  ordered by (reported_at ASC, attempt_no ASC, created_at ASC)
        window  = the last 20 of `ordered` (the 20 rows with the greatest sort key)
        ack     = count(window where outcome == ACKNOWLEDGED)
        reliability_ratio = round_half_up(ack / len(window), 4)
        when len(window) == 0: reliability_ratio = 1.0

      EWMA variant (the `reliability_ratio_ewma` column — reported only):
        ewma = 1.0
        for each row of `ordered` oldest-first:
            x = 1.0 when that row's outcome == ACKNOWLEDGED else 0.0
            ewma = round_half_up(EWMA_ALPHA * x + (1 - EWMA_ALPHA) * ewma, 4)
        reliability_ratio_ewma = ewma
    input_set: "RoutingAttempt rows for the endpoint whose outcome is ACKNOWLEDGED, REJECTED or UNDELIVERABLE; IN_PROGRESS rows are excluded from both variants"
    constants:
      RELIABILITY_WINDOW_N: 20
      EWMA_ALPHA: 0.0670
      DEGRADE_BELOW: 0.90
      REACTIVATE_AT_LEAST: 0.95
    precision: "4 decimal places, round_half_up"
    variants:
      - name: chronological_window
        when: "the value reported as reliability_ratio and consumed by the degrade gate (reliability_ratio < 0.90) and the reactivate gate (reliability_ratio >= 0.95)"
        difference: "Windows by attempt count and compares the acknowledged share of the most recent 20 reported attempts"
      - name: ewma_decay
        when: "the value reported as reliability_ratio_ewma; no gate consumes it"
        difference: "Takes the exponentially weighted mean of the entire attempt history with alpha 0.0670 seeded at 1.0; for a small or mostly-failed history it reads far higher than the chronological ratio (one UNDELIVERABLE attempt alone gives 0.0000 chronological against 0.9330 EWMA)"

  # --- Rule 1: dual-variant on the BenefitCheck domain -----------------------
  - name: benefit_cost_estimate
    trigger: "POST /network/benefit-checks/{id}/complete (variant FINAL) and POST /network/benefit-checks/{id}/evaluate (variant PROVISIONAL)"
    algorithm: forward_looking
    formula: |
      Evaluation order is pinned and identical in both variants:
        STEP 1 effective_benchmark = round_half_up(benchmark_price_cents * (1 - formulary_preferred_pct), 0)
                                    when formulary_status == PREFERRED
                                    else benchmark_price_cents
        STEP 2 patient_cost_share = plan_copay_cents
                                    + round_half_up(plan_coinsurance_pct * effective_benchmark, 0)
        STEP 3 brand_fee = plan_brand_fee_cents when formulary_status == NON_PREFERRED or
                            formulary_status == PRIOR_AUTH_REQUIRED, else 0
        STEP 4 deductible_remaining = max(0, plan_deductible_cents - plan_deductible_met_cents)
        STEP 5 (THE VARIANT-DEPENDENT STEP — the deductible-credit basis):
          PROVISIONAL: credit           = min(deductible_remaining, patient_cost_share)
                       estimated_patient_pay_cents = patient_cost_share
                       estimated_plan_pay_cents    = max(0, effective_benchmark - patient_cost_share) + brand_fee
          FINAL:       credit           = min(deductible_remaining, patient_cost_share + brand_fee)
                       estimated_patient_pay_cents = patient_cost_share + brand_fee
                       estimated_plan_pay_cents    = max(0, effective_benchmark - patient_cost_share)
        STEP 6 formulary_status == PRIOR_AUTH_REQUIRED additionally caps
               estimated_plan_pay_cents at round_half_up(0.50 * effective_benchmark, 0)
        STEP 7 shared benefit cap: when estimated_plan_pay_cents > plan_benefit_cap_cents,
               estimated_plan_pay_cents = plan_benefit_cap_cents and the removed amount is
               added to estimated_patient_pay_cents
        STEP 8 an ACTIVE PatientConsent with scope in {BENEFIT_CHECK, BOTH} is required;
               without it no estimate is produced. When coverage_status == INACTIVE the
               estimate is pinned instead of computed: formulary_status = NOT_COVERED,
               estimated_plan_pay_cents = 0, estimated_patient_pay_cents = benchmark_price_cents, credit = 0
      deductible_met_snapshot_cents is captured from the payer's plan_deductible_met_cents
      in STEP 0, on the PENDING -> evaluation edge, and never re-read afterwards.
    input_set: "The BenefitCheck row, its Prescription (for quantity and days_supply), and the payer NetworkParticipant whose plan_* fields supply every plan constant"
    constants:
      PRIOR_AUTH_PLAN_SHARE_CAP: 0.50
    precision: "integer cents, round_half_up at STEP 1 and STEP 2 only"
    variants:
      - name: provisional_at_prescribe
        when: "pricing_variant == PROVISIONAL, set by POST /network/benefit-checks/{id}/evaluate and returned by GET /network/benefit-checks?prescription_id= while the check is still PENDING"
        difference: "The brand fee sits outside the deductible-credit basis, so the credit is smaller and the plan share correspondingly larger; for benchmark 8000, NON_PREFERRED formulary, copay 1500, coinsurance 0.2, deductible 10000 with 4000 met, brand fee 300, this gives patient 3100 / plan 5200"
      - name: final_at_fill
        when: "pricing_variant == FINAL, set by POST /network/benefit-checks/{id}/complete"
        difference: "The brand fee sits inside the deductible-credit basis; identical inputs give patient 3400 / plan 4900 — the split moves 300 cents from the plan to the patient while the sum stays 8300"

  # --- Rule 2(a) + selector policy: combinatorial ranking --------------------
  - name: routing_endpoint_selection
    trigger: "POST /network/prescriptions/{id}/sign, POST /network/prescriptions/{id}/route, and the BACKUP_SELECTION nomination that follows a report-undeliverable"
    algorithm: constraint_propagation
    formula: |
      candidates = DirectoryEndpoint rows where ALL of:
        participant_id == prescription.receiving_pharmacy_id
        status IN {ACTIVE, DEGRADED}
        service_set == SERVICE_SET_MAP[prescription.transaction_type]
        effective_from <= current_logical_clock < (effective_to when effective_to != null)
        prescription.is_controlled == false OR the endpoint's message_standard == NCPDP_SCRIPT_2022011
        endpoint.id != prescription.routed_endpoint_id                 (backup nomination only)
        endpoint.id NOT IN { target_endpoint_id of this prescription's RoutingAttempt rows
                             with outcome IN {UNDELIVERABLE, REJECTED} }
      rank the candidates by this strictly ordered key list (first key decides):
        1. status ordinal            ACTIVE(0) before DEGRADED(1)                 ASC
        2. standard_match            1 when message_standard == prescription.message_standard else 0  DESC
        3. service_level ordinal     ELIGIBLE_A(0), ELIGIBLE_B(1), ELIGIBLE_C(2)  ASC
        4. sla_response_minutes                                                    ASC
        5. reliability_ratio         the CHRONOLOGICAL variant, not the EWMA variant  DESC
        6. created_at                ascending; id is forbidden as a tie-break
      winner = rank[0]
      when candidates is empty: routing_status -> ROUTE_FAILED and the caller
        returns ERR_NO_ROUTE_AVAILABLE; nothing is scheduled and no fallback fires
    input_set: "DirectoryEndpoint rows of the receiving pharmacy plus every RoutingAttempt already recorded for the prescription; excludes endpoints with status PENDING_CERT or DISABLED and endpoints outside their service interval"
    constants:
      SERVICE_SET_MAP:
        NEW_RX: NEW_RX
        REFILL_REQUEST: REFILL_RX
        REFILL_RESPONSE: REFILL_RX
        CHANGE_REQUEST: CHANGE_CANCEL
        CHANGE_RESPONSE: CHANGE_CANCEL
        CANCEL_REQUEST: CHANGE_CANCEL
        CANCEL_RESPONSE: CHANGE_CANCEL
      CONTROLLED_REQUIRES_STANDARD: NCPDP_SCRIPT_2022011
      SERVICE_LEVEL_ORDINAL: { ELIGIBLE_A: 0, ELIGIBLE_B: 1, ELIGIBLE_C: 2 }
      STATUS_ORDINAL: { ACTIVE: 0, DEGRADED: 1 }
    precision: "no arithmetic; a total order over the candidate set"
    variants:
      - name: primary_nomination
        when: "the first attempt for a prescription"
        difference: "Every non-excluded candidate is eligible and the routed_endpoint_id exclusion does not apply"
      - name: backup_nomination
        when: "after a DEGRADED endpoint's attempt is reported undeliverable"
        difference: "The previously used target_endpoint_id and every endpoint already tried with outcome UNDELIVERABLE or REJECTED are excluded, so the winner is the second-best candidate or the selection fails outright"

  # --- Rule 2(b) + Rule 9: rounding order and the charged ceiling -----------
  - name: transaction_fee_settlement
    trigger: "POST /network/transaction-fees/{id}/reverse and the accrual evaluated on POST /network/routing-attempts/{id}/report-acknowledged"
    algorithm: tiered_pricing
    formula: |
      STEP 1 (variant-neutral chargeable basis):
        ANCHOR_ROWS = TransactionFeeEntry rows for the same (participant_id, month_key,
                      transaction_type, direction) whose reversal_of_entry_id IS NULL —
                      genuine charges, whether still PARTIAL or already POSTED. Compensating
                      MANUAL_REVERSAL rows are excluded because they carry a
                      reversal_of_entry_id, so a reversal never changes chargeable volume.
        total       = sum(entry.transaction_count over ANCHOR_ROWS)
        total       = min(total, MONTHLY_CHARGEABLE_CEILING)
        charged     = apply_tiers(total)
        Because `total` is clamped before tiering, every count at or above 7500
        settles at exactly apply_tiers(7500) = 60100 on the sender schedule for a
        non-history type — the ceiling absorbs the top VOLUME tier.
      STEP 2 (variant-dependent reserve):
        MONTHLY:        reserve_basis = total
                        reserve       = round_half_up(0.30 * apply_tiers(reserve_basis), 0)
                        provisional_amount = charged
                        final_amount       = charged - reserve
        ROLLING_90_DAY: projected_next_90d = round_half_up(total * 1.45, 0)
                        reserve_basis      = min(max(projected_next_90d, 0), MONTHLY_CHARGEABLE_CEILING)
                        reserve            = round_half_up(0.30 * apply_tiers(reserve_basis), 0)
                        provisional_amount = charged
                        final_amount       = charged - reserve
      apply_tiers(n) — one pinned marginal schedule, no other rounding order permitted:
        tier1 = FREE      span 0 .. FREE_UPPER
        tier2 = STANDARD  span FREE_UPPER+1 .. STANDARD_UPPER, rate R2 cents
        tier3 = VOLUME    span STANDARD_UPPER+1 .. unbounded,  rate R3 cents
        n2 = min(max(0, n - FREE_UPPER), STANDARD_UPPER - FREE_UPPER)
        n3 = max(0, n - STANDARD_UPPER)
        amount = n2 * R2 + n3 * R3
        The per-tier products are summed at integer cent granularity and the sum is
        NOT re-rounded — "round each tier then sum" and "sum then round" are the same
        operation here because every tier rate is an integer number of cents. The
        rounding ORDER that matters is STEP 1's clamp-then-tier, not a rounding step.
    input_set: "TransactionFeeEntry rows for the (participant_id, month_key, transaction_type, direction) cell whose reversal_of_entry_id IS NULL, so PARTIAL accruals, POSTED charges and CORRECTION rows all count and only the compensating MANUAL_REVERSAL rows are excluded"
    constants:
      MONTHLY_CHARGEABLE_CEILING: 7500
      SHORTFALL_RESERVE_RATE: 0.30
      ROLLING_TRAJECTORY_FACTOR: 1.45
      SENDER_SCHEDULE:
        default:  { FREE_UPPER: 200, STANDARD_UPPER: 2000, R2: 12, R3: 7 }
        MED_HISTORY: { FREE_UPPER: 100, STANDARD_UPPER: 1000, R2: 18, R3: 9 }
      RECEIVER_SCHEDULE:
        default:  { FREE_UPPER: 200, STANDARD_UPPER: 2500, R2: 8, R3: 4 }
    precision: "integer cents, round_half_up for the reserve multiplication only"
    variants:
      - name: monthly_settlement
        when: "participant.volume_billing_mode == MONTHLY"
        difference: "Reads the reserve off the same month's chargeable volume, so the reserve on a 500-count sender cell is round(0.30 * apply_tiers(500)) = 1080 and the final amount is 3600 - 1080 = 2520"
      - name: rolling_90_day_settlement
        when: "participant.volume_billing_mode == ROLLING_90_DAY"
        difference: "Projects the month at 1.45x and takes the reserve off the projected basis, so the same 500-count cell reserves round(0.30 * apply_tiers(725)) = 1890 while provisional_amount stays 3600 — the provisional amounts agree and the final amounts differ by 630 cents"

  # --- chronological aggregation --------------------------------------------
  - name: medication_history_dedupe
    trigger: "the AGGREGATING -> COMPLETE transition of a MedicationHistoryBatch"
    algorithm: chronological
    formula: |
      input rows = MedicationHistoryRecord rows where
          patient_id == batch.patient_id
          AND retracted_at == null
          AND the source_participant_id participant's certification_status == CERTIFIED
      for each row: dedupe_key = patient_id + "|" + drug_ndc + "|"
                                 + strftime(fill_date, "%Y-%m-%d") + "|" + days_supply
      partition the input rows by dedupe_key
      within each partition rank rows by this strictly ordered key list:
          1. source_priority  PHARMACY_FILL(0) before PAYER_CLAIM(1)      ASC
          2. quantity                                                      DESC
          3. fill_date                                                     DESC
          4. created_at                                                    ASC
      winner   = rank[0]  -> is_superseded = false, aggregation_batch_id = batch.id
      losers            -> is_superseded = true,  aggregation_batch_id = batch.id
      record_count     = number of partitions
      superseded_count = (number of input rows) - record_count
      source_record_count = number of input rows
      Rows whose source participant is not CERTIFIED are skipped entirely and are
      not counted, stamped, or superseded.
    input_set: "live MedicationHistoryRecord rows for the batch's patient from CERTIFIED participants; retracted rows and rows from uncertified participants are excluded"
    constants:
      SOURCE_PRIORITY: { PHARMACY_FILL: 0, PAYER_CLAIM: 1 }
    precision: "no arithmetic; partition counts are integers"
    variants:
      - name: fill_authority
        when: "a partition mixes PHARMACY_FILL and PAYER_CLAIM rows"
        difference: "The pharmacy fill wins the partition even when the payer claim carries the larger quantity, because source_priority is the first ranking key"
      - name: quantity_resolution
        when: "a partition holds only rows of one source_type"
        difference: "source_priority ties for every row, so the larger quantity wins and fill_date then created_at decide, which is the opposite outcome from a mixed partition with the same quantities"

  # --- threshold ------------------------------------------------------------
  - name: medication_history_batch_cost
    trigger: "the AGGREGATING -> COMPLETE transition of a MedicationHistoryBatch"
    algorithm: threshold
    formula: |
      batch_cost_cents = MED_HISTORY_QUERY_BASE_CENTS
                       + MED_HISTORY_QUERY_PER_RECORD_CENTS * min(source_record_count, RECORD_FEE_CAP)
    input_set: "source_record_count as stamped by the dedupe rule; a batch that reaches FAILED never runs this rule and keeps batch_cost_cents == 0"
    constants:
      MED_HISTORY_QUERY_BASE_CENTS: 25
      MED_HISTORY_QUERY_PER_RECORD_CENTS: 10
      RECORD_FEE_CAP: 40
    precision: "integer cents"
    variants:
      - name: per_record_charge
        when: "source_record_count <= 40"
        difference: "Cost grows by 10 cents per source record; 25 records cost 275"
      - name: capped_charge
        when: "source_record_count > 40"
        difference: "The per-record term saturates at 400, so 40, 41 and 500 source records all cost exactly 425"

  # --- aggregate gate -------------------------------------------------------
  - name: network_delivery_reachability
    trigger: "on read of any participant and after any DirectoryEndpoint status transition"
    algorithm: aggregation
    formula: |
      reachable = count(DirectoryEndpoint rows where participant_id == P.id
                          AND status IN {ACTIVE, DEGRADED}
                          AND effective_from <= current_logical_clock
                          AND (effective_to != null implies current_logical_clock < effective_to))
      total     = count(DirectoryEndpoint rows where participant_id == P.id)
      delivery_reachability =
          UNREACHABLE when total == 0 or reachable == 0
          AT_RISK     when reachable >= 1 and reachable / total < 0.50
          FULL        otherwise
      Reported as a derived field on the participant detail read; it does not gate
      any write. The DirectoryEndpoint degrade gate in §1.2 is a SEPARATE rule that
      uses the 0.50 ratio over ACTIVE-only endpoints, and the two must not be
      substituted for one another.
    input_set: "All DirectoryEndpoint rows of the participant regardless of service_set, including PENDING_CERT and DISABLED ones, which count toward `total` and never toward `reachable`"
    constants:
      AT_RISK_BELOW: 0.50
    precision: "integer counts; the ratio is a comparison only and is never returned"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /network/- and the /_test-driving endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this operation and X-User-ID identifies an instance of the role's backing entity when identity is entity_backed"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Each path-segment and body foreign key resolves, checked left-to-right in path order and then in the body order declared on the endpoint's input list; the pair (participant_id, npi) is unique"
    error_id: "ERR_PARTICIPANT_NOT_FOUND / ERR_PRESCRIPTION_NOT_FOUND / ERR_ENDPOINT_NOT_FOUND / ERR_ATTEMPT_NOT_FOUND / ERR_PATIENT_NOT_FOUND / ERR_CONSENT_NOT_FOUND / ERR_SIGNING_SESSION_NOT_FOUND / ERR_BENEFIT_CHECK_NOT_FOUND / ERR_FEE_ENTRY_NOT_FOUND / ERR_DUPLICATE_PARTICIPANT_NPI"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "The target resource is in a state that admits the requested operation, per the state machine that owns the field being moved"
    error_id: "ERR_INVALID_STATE / ERR_ROUTE_ATTEMPT_IN_PROGRESS / ERR_ALREADY_TERMINAL / ERR_LAST_ACTIVE_ENDPOINT"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Controlled-substance prescribing preconditions: identity proofing and two-factor authentication passed on an OPEN session, the order's message standard supports the schedule, and the receiving pharmacy holds an ACTIVE NEW_RX endpoint"
    error_id: "ERR_IDENTITY_PROOFING_REQUIRED / ERR_CONTROLLED_NOT_SUPPORTED_BY_STANDARD / ERR_PHARMACY_NOT_CERTIFIED_FOR_CONTROLLED / ERR_ACCOUNT_LOCKED / ERR_OTP_INVALID"
    http_status: 422
    applies_to: ["POST /network/prescriptions/{id}/sign", "POST /network/signing-sessions/{id}/request-otp", "POST /network/signing-sessions/{id}/verify-otp", "POST /network/signing-sessions/{id}/abandon"]

  - priority: 6
    category: business_referential
    check: "Participant certification preconditions for the production-enablement gate: the required test set is not complete, a conditional test's prerequisite test is absent, or the undertaking has no directory endpoint to certify"
    error_id: "ERR_CERT_TESTS_INCOMPLETE / ERR_CERT_TEST_PREREQUISITE / ERR_UNKNOWN_TEST_CODE / ERR_CERT_NO_ENDPOINT"
    http_status: 422
    applies_to: ["POST /network/participants/{id}/certify", "POST /network/participants/{id}/certification/start", "POST /network/participants/{id}/certification/tests"]

  - priority: 7
    category: business_constraint
    check: "Routing-selector constraint satisfaction: message-standard agreement for refill, change and cancel responses, and the route/fallback attempt guards"
    error_id: "ERR_MESSAGE_STANDARD_MISMATCH / ERR_NO_ROUTE_AVAILABLE / ERR_FALLBACK_NOT_PERMITTED / ERR_FALLBACK_CHANNEL_UNAVAILABLE / ERR_NO_FAILED_ATTEMPT_TO_FALL_BACK / ERR_FALLBACK_HOP_LIMIT_EXCEEDED / ERR_ATTEMPT_PRESCRIPTION_MISMATCH / ERR_ENDPOINT_NOT_ROUTED_ATTEMPT / ERR_ENDPOINT_NOT_STABLE / ERR_ENDPOINT_COVERAGE_WARNING"
    http_status: 422
    applies_to: ["POST /network/prescriptions/{id}/sign", "POST /network/prescriptions/{id}/route", "POST /network/prescriptions/{id}/route-fallback", "POST /network/routing-attempts/{id}/report-undeliverable", "POST /network/routing-attempts/{id}/report-rejected", "POST /network/routing-attempts/{id}/report-fallback", "POST /network/directory-endpoints/{id}/reactivate"]

  - priority: 8
    category: business_temporal
    check: "The half-open service interval [effective_from, effective_to) of every DirectoryEndpoint must contain the current logical clock at both write and selection time; overlapping intervals for the same participant, service_set, endpoint_role and message_standard are rejected"
    error_id: "ERR_ENDPOINT_OUT_OF_SERVICE_WINDOW / ERR_ENDPOINT_INTERVAL_OVERLAP"
    http_status: 422
    applies_to: ["POST /network/participants/{id}/endpoints", "GET /network/directory-endpoints", "POST /network/prescriptions/{id}/route", "POST /network/prescriptions/{id}/sign"]

  - priority: 9
    category: business_fiscal
    check: "Transaction-fee reversal legality is evaluated before any conservation arithmetic: a compensating row may only compensate a POSTED row that is itself an ordinary charge"
    error_id: ERR_ENTRY_NOT_REVERSIBLE
    http_status: 422
    applies_to: ["POST /network/transaction-fees/{id}/reverse"]

  - priority: 10
    category: business_fiscal
    check: "Consent validity windows for one patient whose status is ACTIVE must not overlap; a grant whose half-open window [granted_at, granted_at + duration_days) intersects an existing ACTIVE window for the same scope is rejected"
    error_id: ERR_CONSENT_INTERVAL_OVERLAP
    http_status: 422
    applies_to: ["POST /network/patients/{id}/consents"]

# =============================================================================
# Response Envelope (§1.0 — FIXED, EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- NetworkParticipant ----------------------------------------------------
  - method: POST
    path: "/network/participants"
    description: "Register a network participant (prescriber clinic, pharmacy, payer). plan_* fields are accepted on any participant and are only meaningful for participant_type PAYER."
    roles: [ParticipantAdmin, NetworkOperator]
    code: 201
    input: [name, participant_type, npi, "volume_billing_mode?", "fallback_channel?", "fax_number?", "plan_copay_cents?", "plan_coinsurance_pct?", "plan_deductible_cents?", "plan_deductible_met_cents?", "plan_brand_fee_cents?", "formulary_preferred_pct?", "plan_benefit_cap_cents?"]

    output: NetworkParticipant
    side_effects:
      - "certification_status=UNCERTIFIED, certification_tests_passed=[], directory_listed=false, open_route_attempt_count=0"
      - "plan_deductible_met_cents=0"
  - method: GET
    path: "/network/participants"
    description: "List participants"
    roles: [NetworkOperator, ParticipantAdmin, Prescriber, Pharmacy, HubOperator, PatientService]
    code: 200
    input: ["participant_type?", "certification_status?", "npi?", "limit?", "offset?"]

    output: NetworkParticipant[]
    side_effects: []
  - method: GET
    path: "/network/participants/{id}"
    description: "Get one participant, including the derived directory_listed and delivery_reachability"
    roles: [NetworkOperator, ParticipantAdmin, Prescriber, Pharmacy, HubOperator, PatientService]
    code: 200
    input: []

    output: NetworkParticipant
    side_effects: []
  - method: POST
    path: "/network/participants/{id}/certification/start"
    description: "Open or reopen the participant's certification test window"
    roles: [ParticipantAdmin]
    code: 200
    input: []

    output: NetworkParticipant
    side_effects:
      - "certification_status → IN_CERTIFICATION"
      - "certification_tests_passed reset to []"
      - "every DirectoryEndpoint of this participant with status ACTIVE → PENDING_CERT"
      - "directory_listed recomputed"
      - "participant.version += 1"
  - method: POST
    path: "/network/participants/{id}/certification/tests"
    description: "Record the outcome of one certification test"
    roles: [ParticipantAdmin]
    code: 200
    input: [test_code, outcome]

    output: NetworkParticipant
    side_effects:
      - "On PASS: test_code appended to certification_tests_passed when not already present"
      - "participant.version += 1"
  - method: POST
    path: "/network/participants/{id}/certify"
    description: "Promote the participant to CERTIFIED and enable its pending directory endpoints"
    roles: [ParticipantAdmin]
    code: 200
    input: [expected_participant_version]

    output: NetworkParticipant
    side_effects:
      - "certification_status → CERTIFIED"
      - "every DirectoryEndpoint of this participant with status PENDING_CERT → ACTIVE"
      - "directory_listed recomputed"
      - "increments NetworkParticipant.version by 1"
  - method: POST
    path: "/network/participants/{id}/suspend"
    description: "Suspend the participant and disable all of its directory endpoints"
    roles: [NetworkOperator]
    code: 200
    input: []

    output: NetworkParticipant
    side_effects:
      - "certification_status → SUSPENDED"
      - "every DirectoryEndpoint of this participant → DISABLED"
      - "SIGNED prescriptions of this participant with routing_status in {NOT_ROUTED, BACKUP_SELECTION} → ROUTE_FAILED"
      - "their IN_PROGRESS RoutingAttempts → UNDELIVERABLE with failure_code=NO_ROUTE"
      - "prescriptions left with no mandatory delivery remaining → clinical_status=UNDELIVERABLE"
      - "directory_listed recomputed"
      - "participant.version += 1"
  - method: GET
    path: "/network/participants/{id}/delivery-reachability"
    description: "Computed reachability report for the participant's directory endpoints"
    roles: [NetworkOperator, ParticipantAdmin, HubOperator]
    code: 200
    input: []

    output: { participant_id: string, reachable_endpoint_count: integer, total_endpoint_count: integer, delivery_reachability: string }
    side_effects:
      - "recomputes network_delivery_reachability"
  - method: GET
    path: "/network/participants/{id}/endpoints"
    description: "List the directory endpoints owned by a participant"
    roles: [NetworkOperator, ParticipantAdmin, Prescriber, Pharmacy, HubOperator, PatientService]
    code: 200
    input: []

    output: DirectoryEndpoint[]
    side_effects: []
  - method: GET
    path: "/network/participants/{id}/patients"
    description: "The patients covered by a payer participant's plan"
    roles: [NetworkOperator, ParticipantAdmin, Prescriber, PatientService]
    code: 200
    input: ["limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/network/participants/{id}/fee-entries"
    description: "List the transaction fee entries billed to a participant"
    roles: [NetworkOperator, ParticipantAdmin]
    code: 200
    input: ["month_key?", "limit?", "offset?"]

    output: TransactionFeeEntry[]
    side_effects: []

  # --- DirectoryEndpoint -----------------------------------------------------
  - method: POST
    path: "/network/participants/{id}/endpoints"
    description: "Register a directory endpoint and the service levels it supports"
    roles: [ParticipantAdmin, NetworkOperator]
    code: 201
    input: [service_set, endpoint_role, service_level, sla_response_minutes, message_standard, effective_from, "effective_to?"]

    output: DirectoryEndpoint
    side_effects:
      - "status=PENDING_CERT"
      - "reported_attempt_count=0, acknowledged_count=0, reliability_ratio=1.0, reliability_ratio_ewma=1.0"
      - "participant.directory_listed recomputed"
  - method: GET
