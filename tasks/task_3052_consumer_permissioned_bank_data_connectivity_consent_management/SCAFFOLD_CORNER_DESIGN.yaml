              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /recipients/${rec_id}/tier_assignments"
              payload: { tier_id: "${tier_id}" }
              as: PlatformAdmin
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v1: $.data.version }
            - call: "POST /recipients/${rec_id}/consents"
              payload: { consumer_ref: "cons_ad", data_scopes: ["BALANCE"], expires_at: "2026-12-31T00:00:00Z", expected_recipient_version: "${rec_id_v1}" }
              as: Consumer
              as_user_id: cons_ad
            - call: "GET /recipients/${rec_id}"
              as: PlatformAdmin
              captures: { rec_id_v2: $.data.version }
          trigger:
