        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PROGRAM_NOT_ACTIVE]"]
        distinguishing_aspect: "Any program-scoped write (variant creation here) while the program is SETUP fails priority 6 before licensing or constraint checks."
