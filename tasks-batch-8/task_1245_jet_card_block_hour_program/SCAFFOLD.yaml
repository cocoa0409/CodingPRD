    description: "Confirm a quoted trip"
    roles: [Member]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["trip_status → CONFIRMED or DENIED with denial_reason"]

  - method: POST
    path: "/trips/{tripId}/dispatch"
    description: "Dispatch an aircraft to a confirmed trip"
    roles: [Ops]
    code: 200
    input: ["dispatched_aircraft_id"]
    output: TripRequest
    side_effects:
      - "trip_status → DISPATCHED"
      - "Create TripLeg records"
      - "Aircraft → IN_SERVICE"
      - "Compute sla_met, swap_applied"

  - method: POST
    path: "/trips/{tripId}/depart"
    description: "Mark trip as departed"
    roles: [Ops]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["trip_status → IN_FLIGHT"]

  - method: POST
    path: "/trips/{tripId}/complete"
    description: "Complete a trip with per-leg actual block minutes"
    roles: [Ops]
    code: 200
    input: ["legs"]
    output: TripRequest
    side_effects:
      - "trip_status → COMPLETED"
      - "Compute billable/debited hours per leg"
      - "Insert TRIP_DEBIT ledger entry"
      - "Update Card hours_consumed/hours_remaining"
      - "Release escrow proportionally"
      - "Create Invoice"
      - "Aircraft → AVAILABLE"

  - method: POST
    path: "/trips/{tripId}/cancel"
    description: "Cancel a trip"
    roles: [Member, Ops]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["trip_status → CANCELED"]

  - method: POST
    path: "/trips/{tripId}/no_show"
    description: "Mark dispatched trip as no-show (bills minimum)"
    roles: [Ops]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["trip_status → NO_SHOW", "Bill minimum debit", "Aircraft → AVAILABLE"]

  # --- TripLeg ---
  - method: GET
    path: "/trips/{tripId}/legs"
    description: "List legs of a trip"
    roles: [Ops, Member]
    code: 200
    input: []
    output: "TripLeg[]"
    side_effects: []

  # --- Invoice ---
  - method: GET
    path: "/trips/{tripId}/invoice"
    description: "Get the invoice for a trip (1:1, returns array of 0 or 1)"
    roles: [Ops, Member]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{invoiceId}/mark_paid"
    description: "Mark invoice as paid"
    roles: [Ops]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_status → PAID"]

  - method: POST
    path: "/invoices/{invoiceId}/dispute"
    description: "Dispute an invoice"
    roles: [Member]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_status → DISPUTED"]

  - method: POST
    path: "/invoices/{invoiceId}/write_off"
    description: "Write off an invoice"
    roles: [Ops]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_status → WRITTEN_OFF"]

  # --- Refund ---
  - method: POST
    path: "/cards/{cardId}/refunds"
    description: "Create a Refund (DRAFT)"
    roles: [Member, Ops]
    code: 201
    input: ["expected_card_version"]
    output: Refund
    side_effects:
      - "refund_status = DRAFT"
      - "OCC check on JetCard.version"
      - "Increments JetCard.version by 1"

  - method: GET
    path: "/cards/{cardId}/refunds"
    description: "List refunds for a card"
    roles: [Ops, Member]
    code: 200
    input: ["refund_status?", "limit?", "offset?"]
    output: "Refund[]"
    side_effects: []

  - method: POST
    path: "/refunds/{refundId}/submit"
    description: "Submit a refund for review"
    roles: [Member]
    code: 200
    input: []
    output: Refund
    side_effects:
      - "refund_status → SUBMITTED"
      - "Snapshot hours_at_request"
      - "Compute gross/penalty/net refund"

  - method: POST
    path: "/refunds/{refundId}/approve"
    description: "Approve a submitted refund"
    roles: [Ops]
    code: 200
    input: []
    output: Refund
    side_effects: ["refund_status → APPROVED"]

  - method: POST
    path: "/refunds/{refundId}/deny"
    description: "Deny a refund"
    roles: [Ops]
    code: 200
    input: ["denial_reason"]
    output: Refund
    side_effects: ["refund_status → DENIED"]

  - method: POST
    path: "/refunds/{refundId}/settle"
    description: "Settle an approved refund"
    roles: [Ops]
    code: 200
    input: []
    output: Refund
    side_effects:
      - "refund_status → SETTLED"
      - "Cascade: Card → REFUNDED"
      - "EscrowAccount updated"

  # --- Fractional Upgrade ---
  - method: POST
    path: "/cards/{cardId}/fractional_upgrades"
    description: "Convert remaining card hours to fractional share"
    roles: [Member, Ops]
    code: 201
    input: ["expected_card_version"]
    output: FractionalUpgrade
    side_effects:
      - "OCC check on JetCard.version"
      - "Insert UPGRADE_DEBIT ledger entry"
      - "Increments JetCard.version by 1"

  - method: GET
    path: "/cards/{cardId}/fractional_upgrades"
    description: "List fractional upgrades for a card"
    roles: [Ops, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "FractionalUpgrade[]"
    side_effects: []

  # --- Escrow ---
  - method: GET
    path: "/cards/{cardId}/escrow"
    description: "Get escrow account for a card (1:1, returns array of 0 or 1)"
    roles: [Ops, Member]
    code: 200
    input: []
    output: "EscrowAccount[]"
    side_effects: []

  # --- Ops Run (system sweep) ---
  - method: POST
    path: "/ops/run"
    description: "Advance ops epoch: run expiration sweep, posture recalculation"
    roles: [Ops]
    code: 200
    input: []
    output: "object"
    side_effects:
      - "Cards with now >= expires_at transition to EXPIRED or CLOSED"
      - "Insert EXPIRATION_DEBIT ledger entries"

  # --- Test-driving endpoints (last-resort, /_ namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server starts at 2026-05-01T00:00:00Z by default; this endpoint MUST be used to advance time for any deadline/expiry/window rule."
    roles: [Ops]
    code: 200
    input: ["to_iso8601"]
    output: "object"
    side_effects: ["Sets logical clock; subsequent reads of `now` use this value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not authorized for endpoint per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced FK (program_id, etc.) does not resolve" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Operation requires JetCard.card_status == ACTIVE" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires Member.member_status == ACTIVE" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity in wrong from-state for invoked transition" }
  - { id: ERR_OPEN_TRIPS_EXIST, http: 409, condition: "Refund submit blocked by open trip on card" }
  - { id: ERR_BLACKOUT_PERIOD, http: 422, condition: "requested_departure_utc intersects BlackoutWindow for requested category" }
  - { id: ERR_SLA_WINDOW_MISSED, http: 422, condition: "Dispatch time exceeds availability_window_hours from requested departure" }
  - { id: ERR_NO_AIRCRAFT_AVAILABLE, http: 422, condition: "No aircraft in AVAILABLE status with compatible category" }
  - { id: ERR_PAX_EXCEEDS_CAPACITY, http: 422, condition: "pax_count > chosen aircraft seats" }
  - { id: ERR_INSUFFICIENT_HOURS, http: 402, condition: "Card.hours_remaining < TripRequest.quoted_hours at confirm" }
  - { id: ERR_INSUFFICIENT_HOURS_FOR_UPGRADE, http: 402, condition: "Card.hours_remaining below 1/16-share threshold for upgrade" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_card_version mismatch on JetCard" }
  - { id: ERR_INVALID_RETURN_TIME, http: 422, condition: "ROUND_TRIP requested_return_utc not strictly after requested_departure_utc" }
  - { id: ERR_EXPIRATION_SWEEP_INCOMPLETE, http: 409, condition: "Card expiration transition blocked by incomplete ledger debit" }
  - { id: ERR_NOTHING_TO_REFUND, http: 422, condition: "Refund submit on card with zero hours_remaining" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation, missing required field, or malformed value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Ops
    description: "Operations/admin role; full control over all resources"
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/peak_windows"
      - "POST /programs/{id}/blackout_windows"
      - "POST /members"
      - "POST /members/{id}/suspend"
      - "POST /members/{id}/cards"
      - "POST /cards/{id}/activate"
      - "POST /cards/{id}/suspend"
      - "POST /cards/{id}/resume"
      - "POST /aircraft"
      - "POST /trips/{id}/dispatch"
      - "POST /trips/{id}/depart"
      - "POST /trips/{id}/complete"
      - "POST /trips/{id}/no_show"
      - "POST /invoices/{id}/mark_paid"
      - "POST /invoices/{id}/write_off"
      - "POST /refunds/{id}/approve"
      - "POST /refunds/{id}/deny"
      - "POST /refunds/{id}/settle"
      - "POST /ops/run"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET any resource"
      - "POST /cards/{id}/trips"
      - "POST /trips/{id}/cancel"
      - "POST /cards/{id}/refunds"
      - "POST /cards/{id}/fractional_upgrades"

  - name: Member
    description: "Jet-card holding member; manages own cards and trips"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /trips/{id}/confirm"
      - "POST /refunds/{id}/submit"
      - "POST /invoices/{id}/dispute"
    shared_operations:
      - "GET own cards, trips, invoices, refunds, ledger, escrow"
      - "POST /cards/{id}/trips"
      - "POST /trips/{id}/cancel"
      - "POST /cards/{id}/refunds"
      - "POST /cards/{id}/fractional_upgrades"

  - name: Anonymous
    description: "Unauthenticated; may only read program catalog"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /programs"
      - "GET /programs/{id}"
      - "GET /programs/{id}/peak_windows"
      - "GET /programs/{id}/blackout_windows"
