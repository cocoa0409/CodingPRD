        grounds: ["concurrency_rules[show-booking-stale-seat]", "errors[ERR_STALE_SHOW_VERSION]"]
        distinguishing_aspect: "A second POST /show-bookings carrying the pre-first-hold show version (expected_show_version one less than live) is rejected with ERR_STALE_SHOW_VERSION (412)."
        test_recipe:
          setup: ["An OPEN show capacity 40; one hold already created (advancing the show version)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome JJ", venue_type: "DOME", seated_capacity: 40 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
