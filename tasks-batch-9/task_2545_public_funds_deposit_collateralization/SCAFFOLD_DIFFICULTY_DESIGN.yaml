              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_id: $.data.id }
          assert:
            - "ATTEMPT 1 (Depository.approval_status == DRAFT): 409 with error_id ERR_DEPOSITORY_NOT_APPROVED"
            - "After begin-review Depository.${dep_id}.approval_status == UNDER_REVIEW and QualificationReview.${qr_id}.status == UNDER_REVIEW"
            - "ATTEMPT 2 (Depository.approval_status == UNDER_REVIEW, attested package): 409 with error_id ERR_DEPOSITORY_NOT_APPROVED — an in-flight review does not unlock deposit-taking"
            - "After decide Depository.${dep_id}.approval_status == APPROVED, approved_pledge_capacity_cents == 400000000000 and approved_at == 2026-08-01T00:00:00Z"
            - "ATTEMPT 3 (identical payload, Depository APPROVED): 201 with funding_status PENDING_FUNDING, collateral_status UNSECURED, ledger_balance_cents 0"
