            - "${b_status} == ACTIVE, ${b_granted} == true and ${b_window_start} == 2026-09-01T00:00:00Z"
            - "Merchant.${merchant_a}.status == IN_NEGOTIATION while Merchant.${merchant_b}.status == ACTIVE"

      - name: setup_stage_triggers_from_wrong_state_return_each_entity_own_invalid_state_code
        claim_type: invalid_transitions
        grounds:
          - validations[priority=50]
          - errors[ERR_MERCHANT_INVALID_STATE]
          - errors[ERR_AGREEMENT_INVALID_STATE]
