          - errors[ERR_EXAM_REQUIREMENT_UNMET]
          - endpoints[POST /licensing/qualifying-individuals/{id}/exam-results]
        distinguishing_aspect: |
          A third metric (exam SCORE) on a third endpoint (exam-results): score 70 is stamped
          passed = true and clears submission, score 69 is stamped passed = false and submission is
          refused with ERR_EXAM_REQUIREMENT_UNMET — while both rows still receive the same
          expires_on 2029-03-01, proving the boundary lives in the pass test and not in validity dating.
