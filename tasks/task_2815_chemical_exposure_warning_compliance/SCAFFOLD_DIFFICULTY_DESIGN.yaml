            - "after DISMISS: NoticeOfViolation.${nov_1}.status == DISMISSED, Product.${prod_1}.open_notice_count == 0, compliance_posture == CLEAR, and lifecycle_state is still MARKETED"

  # ===========================================================================
  # RULE 4 - transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: revise_safe_harbor_cascades_four_levels
        grounds:
          - state_machines.ListedChemical.LISTED_to_LISTED
          - state_machines.ExposureAssessment.FINAL_to_SUPERSEDED
          - state_machines.WarningDetermination.APPROVED_to_REVOKED
          - state_machines.WarningPlacement.IMPLEMENTED_to_NON_COMPLIANT
          - state_machines.Product.any_to_EXPOSURE_UNKNOWN
          - calculations.safe_harbor_verdict
        distinguishing_aspect: |
          A single registry write four levels away from the product moves five rows: chemical
          (revision_count 1) -> assessment (margin_ratio recomputed 0.1000, result BELOW, FINAL ->
          SUPERSEDED) -> determination (APPROVED -> REVOKED) -> placement (IMPLEMENTED ->
          NON_COMPLIANT) -> product posture (WARNING_ACTIVE -> EXPOSURE_UNKNOWN), and level 4 is
          only reachable because level 3 fired - no direct edge exists from a chemical to a
          placement.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day."
            - "Product SKU-TC1 sells only through RETAIL, has one ACTIVE component (RM-100 at declared 40.0 ppm, disclosure VERIFIED, quantity 0.25 g/unit, contact_factor 0.5), and its DERMAL uses_per_day 1.0 assessment is FINAL at daily_exposure_ug 0.500 with margin_ratio 1.0 and result AT_OR_ABOVE_SAFE_HARBOR."
            - "Its WarningDetermination is APPROVED with required_channels [LABEL] and one IMPLEMENTED LABEL placement, so covered_channel_count is 1 and compliance_posture is WARNING_ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-TC1", product_name: "Yoga Block", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
