          trigger:
            - call: "POST /acreage-reports"
              payload: { unit_id: "${unit_id}", planted_acres: 100, prevented_acres: 0, planting_date: "2026-05-12T00:00:00Z", expected_unit_version: "${unit_v1}" }
              as: Agent
