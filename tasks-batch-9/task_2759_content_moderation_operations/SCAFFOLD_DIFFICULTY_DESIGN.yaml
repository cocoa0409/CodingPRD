          - entities.ModerationCase.fields.escalation_tier
        distinguishing_aspect: |
          The single ASSIGNED state forks on two different triggers into disjoint side-effect sets:
          escalate releases the reviewer and refunds the case exposure charge while rewriting
          sla_due_at to clock + 30 minutes, whereas decide keeps the exposure charge forever,
          decrements the queue's open_case_count and writes the strike ledger.
