              as: AuditorGeneral
              as_user_id: "auditor-01"
          assert:
            - "HTTP 200"
            - "AuditEngagement.${audit_id}.status == WITHDRAWN"
            - "GrossReceiptsReport.${rpt1_id}.status == ACCEPTED and restated_receipts_cents == null"
            - "GrossReceiptsReport.${rpt2_id}.status == ACCEPTED and restated_receipts_cents == null"
            - "GrossReceiptsReport.${rpt3_id}.status == ACCEPTED and restated_receipts_cents == null"
