# =============================================================================
# task_0071 SaaS subscription billing — Scaffold Difficulty Design
# (Test Targeting Index — §1.8 of the scaffold-generator skill)
#
# Every `rule_id` below maps verbatim to a §0.5 rule in SKILL.md.
# Every `grounds:` entry resolves to an element declared in SCAFFOLD.yaml §1.1–§1.6.
# `assert:` lines that reference computed numeric values cite literals that were
# evaluated by hand against the relevant calculations[].formula and constants:.
# =============================================================================

scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_upgrade_vs_downgrade_on_subscription
        grounds:
          - calculations.proration_amount
          - state_machines.Subscription.ACTIVE_to_ACTIVE_upgrade
          - state_machines.Subscription.ACTIVE_to_ACTIVE_downgrade_immediate_refund
          - entities.SubscriptionChange.fields.prorated_charge_cents
          - entities.SubscriptionChange.fields.change_type
        distinguishing_aspect: |
          Two variants on entity domain Subscription/SubscriptionChange:
          UPGRADE_FORWARD_LOOKING (sign positive, looks only at the remaining_days delta)
          and DOWNGRADE_CHRONOLOGICAL_REFUND (sign negative, reconciles already-charged
          full-cycle baseline at OLD rate and refunds the forward portion). The two
          variants emit different SubscriptionChange.prorated_charge_cents for identical
          inputs because the SIGN convention is pinned per variant.
        test_recipe:
          setup:
            - "PlatformAdmin creates PackageVersion P_LO {package_code=BASIC, version_number=1, package_type=TIERED, base_price_cents=3000, currency=USD, billing_cycle=MONTHLY, pricing_model=PREPAID, effective_from=2030-01-01T00:00:00Z}"
            - "PlatformAdmin creates PackageVersion P_HI {package_code=PRO, version_number=1, package_type=TIERED, base_price_cents=6000, currency=USD, billing_cycle=MONTHLY, pricing_model=PREPAID, effective_from=2030-01-01T00:00:00Z}"
            - "PlatformAdmin creates Jurisdiction {jurisdiction_code=US-CA, tax_rate_bps=0, rounding_mode=TOTAL}"
            - "PlatformAdmin creates Tenant T {currency=USD, jurisdiction_code=US-CA}"
            - "TenantAdmin creates Subscription S on T with package_code=BASIC then converts trial → cycle [2030-01-01, 2030-01-31)"
            - "POST /_clock/advance to bring now to 2030-01-11T00:00:00Z (10 days elapsed of 30-day cycle)"
          trigger:
            - "POST /tenants/{T.id}/subscriptions/{S.id}/upgrade {target_package_code=PRO}"
            - "POST /_clock/advance to bring now to 2030-01-11T00:00:01Z (no-op same-day)"
            - "POST /tenants/{T.id}/subscriptions/{S.id}/downgrade {target_package_code=BASIC, mode=IMMEDIATE_REFUND}"
          assert:
            - "First SubscriptionChange.change_type == 'UPGRADE' AND prorated_charge_cents == 2000"
            - "Second SubscriptionChange.change_type == 'DOWNGRADE_IMMEDIATE_REFUND' AND prorated_charge_cents == -2000"
            - "A CreditNote with origin=REFUND_DOWNGRADE and amount_cents=2000 was created after the downgrade"
            - "Same numeric formula inputs (per_day delta * remaining_days) but different signs/different SubscriptionChange rows confirm dual-variant semantics"

      - name: tax_per_line_vs_total_on_invoice
        grounds:
          - calculations.tax_calculation
          - calculations.bill_total_calc
          - entities.Jurisdiction.fields.rounding_mode
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: |
          Two variants on entity domain Invoice/Jurisdiction: rounding_mode=PER_LINE
          rounds each line's tax then sums; rounding_mode=TOTAL sums lines then rounds
          tax once. For identical line items (100 + 100 + 100 cents at tax_rate_bps=1050)
          the two variants yield Invoice.tax_cents=33 vs 32 — different cents from the
          same prose. Distinct domain from Rule 1 instance #1 (Subscription vs Invoice).
        test_recipe:
          setup:
            - "PlatformAdmin creates Jurisdiction J_PL {jurisdiction_code=DE-PL, tax_rate_bps=1050, rounding_mode=PER_LINE}"
            - "PlatformAdmin creates Jurisdiction J_TT {jurisdiction_code=DE-TT, tax_rate_bps=1050, rounding_mode=TOTAL}"
            - "PlatformAdmin creates PackageVersion P {base_price_cents=300, ...PREPAID MONTHLY, tiered_brackets:[]}; addons that produce three lines of 100 cents each (e.g., 3 addons at 100 cents) — chosen so subtotal=300 with three lines of 100 each"
            - "Two Tenants T_PL (jurisdiction=DE-PL), T_TT (jurisdiction=DE-TT)"
            - "Subscriptions S_PL on T_PL and S_TT on T_TT, both converted; each receives DRAFT prepaid Invoice I_PL, I_TT"
          trigger:
            - "POST /tenants/{T_PL.id}/invoices/{I_PL.id}/issue"
            - "POST /tenants/{T_TT.id}/invoices/{I_TT.id}/issue"
          assert:
            - "I_PL.tax_cents == 33"
            - "I_TT.tax_cents == 32"
            - "I_PL.subtotal_cents == I_TT.subtotal_cents == 300"
            - "I_PL.total_cents != I_TT.total_cents (differs by exactly 1 cent)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hybrid_package_tiered_plus_overage_plus_addons_mode_a
        grounds:
          - calculations.bill_total_calc
          - entities.PackageVersion.fields.tiered_brackets
          - entities.PackageVersion.fields.overage_rates
          - entities.PackageVersion.fields.addons
          - entities.PackageVersion.fields.included_quotas
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction:
          bill_total_calc multiplexes base + tiered_brackets + overage_rates + addons
          + discount + credit, with conditional branches on PackageVersion.package_type
          (TIERED/USAGE_BASED/HYBRID) and PackageVersion.pricing_model (PREPAID vs
          POSTPAID skips base). Nested min(remaining, bracket_capacity) across
          ordered brackets is non-linear. Inputs: ≥5.
        test_recipe:
          setup:
            - "PackageVersion P_HYB {package_type=HYBRID, base_price_cents=5000, pricing_model=PREPAID, billing_cycle=MONTHLY, currency=USD, included_quotas:{API_CALL:1000}, tiered_brackets:[{metric:API_CALL, upper_bound:5000, unit_price_cents:1},{metric:API_CALL, upper_bound:null, unit_price_cents:2}], overage_rates:{}, addons:[{code:SLA, monthly_price_cents:500}]}"
            - "Jurisdiction {tax_rate_bps:0, rounding_mode:TOTAL}"
            - "Tenant + converted Subscription with selected_addons=[SLA]"
            - "Ingest 6000 API_CALL UsageRecords (one record quantity=6000) into current cycle"
          trigger:
            - "POST /tenants/{tenant_id}/invoices/{draft_id}/issue (or read the auto-issued cycle invoice)"
          assert:
            - "Invoice.subtotal_cents == 11500"      # 5000 base + (4000*1 + 1000*2)=6000 tiered + 500 addon
            - "Invoice.tax_cents == 0"
            - "Invoice.total_cents == 11500"
            - "Invoice.line_items contains a base line, two tiered lines (one per bracket actually consumed), and one addon line"

      - name: tax_rounding_order_mode_b
        grounds:
          - calculations.tax_calculation
          - calculations.bill_total_calc
          - entities.Jurisdiction.fields.rounding_mode
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters: PER_LINE rounds before summing;
          TOTAL sums before rounding. The scaffold pins the order via
          Jurisdiction.rounding_mode. For identical inputs (three 100-cent lines @
          10.5% tax) the two orders produce 33 vs 32 cents. Distinct mode from
          instance #1 (mode a, non-linear-interaction).
        test_recipe:
          setup:
            - "Same setup as Rule 1 / tax_per_line_vs_total_on_invoice"
          trigger:
            - "Issue both invoices"
          assert:
            - "I_PL.tax_cents == 33   # PER_LINE: round(100*1050/10000)=11 per line × 3"
            - "I_TT.tax_cents == 32   # TOTAL: round(300*1050/10000)=round(31.5)=32 once"
            - "The cents difference proves rounding-order is the discriminator, not the inputs"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_payment_status_cyclic
        grounds:
          - state_machines.Subscription.payment_status.CURRENT_to_DUE
          - state_machines.Subscription.payment_status.DUE_to_OVERDUE_TIER1
          - state_machines.Subscription.payment_status.OVERDUE_TIER1_to_OVERDUE_TIER2
          - state_machines.Subscription.payment_status.OVERDUE_TIER2_to_OVERDUE_TIER3
          - state_machines.Subscription.payment_status.OVERDUE_TIER3_to_CURRENT
          - state_machines.Subscription.payment_status.OVERDUE_TIER1_to_CURRENT
        distinguishing_aspect: |
          Subscription.payment_status is cyclic: CURRENT → DUE → OVERDUE_TIER1 →
          OVERDUE_TIER2 → OVERDUE_TIER3 → CURRENT (payment-driven). It also forms a
          parallel dimension with Subscription.subscription_status — same entity row
          has two independent state axes evolving together. Entity domain:
          Subscription.
        test_recipe:
          setup:
            - "Tenant + Subscription S with monthly PREPAID PackageVersion"
            - "Convert trial; first PREPAID Invoice I issued with due_at = cycle_start + 7d"
          trigger:
            - "POST /_clock/advance to cycle_start + 8d so now > I.due_at"
            - "POST /_dunning/run (transitions CURRENT→DUE→OVERDUE_TIER1)"
            - "POST /_clock/advance by additional 14 days, POST /_dunning/run (TIER2)"
            - "POST /_clock/advance by additional 7 days, POST /_dunning/run (TIER3)"
            - "POST /tenants/{T.id}/invoices/{I.id}/payments with amount_cents=I.total_cents+late_fee_cents"
          assert:
            - "Subscription.payment_status traversed CURRENT → DUE → OVERDUE_TIER1 → OVERDUE_TIER2 → OVERDUE_TIER3 → CURRENT"
            - "Final Subscription.payment_status == 'CURRENT' confirms the cycle closes back to start"
            - "Subscription.subscription_status remained 'ACTIVE' or 'CANCELLED' independently throughout (parallel-dimension proof)"

      - name: tenant_restriction_level_cyclic
        grounds:
          - state_machines.Tenant.restriction_level.NONE_to_READ_ONLY
          - state_machines.Tenant.restriction_level.READ_ONLY_to_FEATURE_RESTRICTED
          - state_machines.Tenant.restriction_level.FEATURE_RESTRICTED_to_NONE
          - state_machines.Tenant.restriction_level.READ_ONLY_to_NONE
        distinguishing_aspect: |
          Tenant.restriction_level is cyclic NONE → READ_ONLY → FEATURE_RESTRICTED →
          NONE (and READ_ONLY → NONE on early payment). Different entity from
          instance #1 (Tenant vs Subscription), satisfying the "non-linear machines
          MUST belong to different entities" clause.
        test_recipe:
          setup:
            - "Tenant T with active Subscription S, first Invoice I past due, dunning tier reaching FEATURE_RESTRICTED"
            - "Drive: POST /_clock/advance past TIER1, /_dunning/run (READ_ONLY); /_clock/advance past TIER2, /_dunning/run (FEATURE_RESTRICTED)"
          trigger:
            - "POST /tenants/{T.id}/invoices/{I.id}/payments paying full amount including late_fee"
          assert:
            - "Tenant.restriction_level transitioned NONE → READ_ONLY → FEATURE_RESTRICTED → NONE"
            - "Final Tenant.restriction_level == 'NONE' AND Tenant.tenant_status remained 'ACTIVE' throughout (cycle closed without involving suspension)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dunning_run_cascade_depth_4
        grounds:
          - state_machines.Subscription.payment_status.DUE_to_OVERDUE_TIER1
          - state_machines.Subscription.payment_status.OVERDUE_TIER1_to_OVERDUE_TIER2
          - state_machines.Subscription.payment_status.OVERDUE_TIER2_to_OVERDUE_TIER3
          - state_machines.Tenant.restriction_level.NONE_to_READ_ONLY
          - state_machines.Tenant.tenant_status.ACTIVE_to_SUSPENDED
          - state_machines.Invoice.invoice_status.ISSUED_to_OVERDUE
          - calculations.late_fee_accrual
          - endpoints["/_dunning/run"]
        distinguishing_aspect: |
          Single trigger POST /_dunning/run starts a chain of caused mutations:
          (1) Subscription.payment_status DUE → OVERDUE_TIER1 caused by /_dunning/run;
          (2) that mutation causes Invoice.invoice_status ISSUED → OVERDUE;
          (3) the Invoice OVERDUE transition causes Tenant.restriction_level NONE → READ_ONLY;
          (4) repeated escalation eventually causes Tenant.tenant_status ACTIVE → SUSPENDED.
          Each link is caused by the previous, not by the root trigger. Depth ≥ 4.
        test_recipe:
          setup:
            - "Tenant T (ACTIVE), Subscription S (ACTIVE, payment_status=DUE), Invoice I (ISSUED, amount_due > 0, due_at well past)"
            - "Clock advanced past all dunning grace thresholds (TIER1, TIER2, TIER3)"
          trigger:
            - "POST /_dunning/run (single invocation chases all four tiers if grace days elapsed)"
          assert:
            - "Subscription.payment_status == 'OVERDUE_TIER3'"
            - "Invoice.invoice_status == 'OVERDUE'"
            - "Tenant.restriction_level == 'NONE' (overridden by SUSPENDED)"
            - "Tenant.tenant_status == 'SUSPENDED'"
            - "Invoice.late_fee_cents > 0 (per late_fee_accrual)"
            - "AuditLog entries with action TENANT_STATUS_CHANGE exist for the SUSPENDED transition"

      - name: payment_reactivation_cascade_depth_3
        grounds:
          - state_machines.Invoice.invoice_status.OVERDUE_to_PAID
          - state_machines.Subscription.payment_status.OVERDUE_TIER3_to_CURRENT
          - state_machines.Tenant.restriction_level.FEATURE_RESTRICTED_to_NONE
          - state_machines.Tenant.tenant_status.SUSPENDED_to_ACTIVE
          - endpoints["POST /tenants/{tenant_id}/invoices/{id}/payments"]
        distinguishing_aspect: |
          Different triggering transition (POST /payments while Tenant=SUSPENDED) than
          instance #1 (/_dunning/run). Chain: payment → Invoice OVERDUE → PAID; that
          Invoice mutation causes Subscription.payment_status OVERDUE_TIER3 → CURRENT;
          that mutation causes Tenant.tenant_status SUSPENDED → ACTIVE (reactivation).
          Depth ≥ 3. Distinct trigger family from instance #1.
        test_recipe:
          setup:
            - "Reach end of instance #1 (Tenant SUSPENDED, Subscription payment_status=OVERDUE_TIER3, Invoice OVERDUE)"
          trigger:
            - "POST /tenants/{T.id}/invoices/{I.id}/payments {amount_cents == I.total_cents + I.late_fee_cents, currency=USD, external_reference='pay-1'}"
          assert:
            - "Invoice.invoice_status == 'PAID'"
            - "Invoice.late_fee_cents == 0 (post-clearance recompute pins it back to 0)"
            - "Subscription.payment_status == 'CURRENT'"
            - "Tenant.restriction_level == 'NONE'"
            - "Tenant.tenant_status == 'ACTIVE'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_currency_mismatch
        grounds:
          - validations[priority=11]   # ERR_SUBSCRIPTION_STATUS_INVALID (category: state)
          - validations[priority=18]   # ERR_CURRENCY_MISMATCH (category: business_referential)
        distinguishing_aspect: |
          Dual-failure on POST /subscriptions/{id}/upgrade: Subscription is in CANCELLED
          state (state_invalid, priority 11) AND target PackageVersion.currency != Tenant.currency
          (business_referential, priority 18). The state check is the lower priority
          number so the state error must win. Pair: state vs business_referential.
        test_recipe:
          setup:
            - "Tenant T (USD), PackageVersion P_LO (USD, base=3000), P_HI (EUR, base=6000)"
            - "Subscription S converted then CANCELLED via DELETE /subscriptions/{S.id}"
          trigger:
            - "POST /tenants/{T.id}/subscriptions/{S.id}/upgrade {target_package_code=P_HI}"
          assert:
            - "HTTP 409 with error_id=='ERR_SUBSCRIPTION_STATUS_INVALID' (state precedence wins)"
            - "Response does NOT report ERR_CURRENCY_MISMATCH despite the currency mismatch also being present"

      - name: business_safety_vs_business_constraint_idempotency
        grounds:
          - validations[priority=13]   # ERR_TENANT_READ_ONLY (business_safety)
          - validations[priority=23]   # ERR_DUPLICATE_USAGE_IDEMPOTENCY_KEY (business_constraint)
        distinguishing_aspect: |
          Dual-failure on POST /subscriptions/{id}/usage: Tenant.restriction_level=READ_ONLY
          (business_safety, priority 13) AND the supplied (subscription_id, idempotency_key)
          duplicates an earlier UsageRecord with conflicting payload (business_constraint,
          priority 23). The safety check wins by priority. Pair: business_safety vs
          business_constraint — DIFFERENT pair from instance #1.
        test_recipe:
          setup:
            - "Tenant T pushed into restriction_level=READ_ONLY via dunning"
            - "Earlier UsageRecord persisted with idempotency_key='k1', metric=API_CALL, quantity=10"
          trigger:
            - "POST /tenants/{T.id}/subscriptions/{S.id}/usage {idempotency_key='k1', metric=API_CALL, quantity=999, event_timestamp=now, ingestion_mode=REALTIME}"
          assert:
            - "HTTP 403 with error_id=='ERR_TENANT_READ_ONLY' (safety precedence wins)"
            - "ERR_DUPLICATE_USAGE_IDEMPOTENCY_KEY is NOT reported despite the key collision"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_days_past_due_30_vs_31
        grounds:
          - calculations.late_fee_accrual
          - endpoints["/_dunning/run"]
        distinguishing_aspect: |
          Boundary on days_past_due in late_fee_accrual: `<= 30` selects 1.00% bracket;
          day 31 falls into the 2.50% bracket. Metric: days_past_due (temporal). Endpoint:
          POST /_dunning/run.
        test_recipe:
          setup:
            - "Tenant + Subscription + Invoice I with total_cents=10000, due_at=2030-01-01T00:00:00Z"
          trigger:
            - "POST /_clock/advance to 2030-01-31T00:00:00Z; POST /_dunning/run; GET Invoice I"
            - "POST /_clock/advance by +1 day to 2030-02-01T00:00:00Z; POST /_dunning/run; GET Invoice I"
          assert:
            - "After first dunning: Invoice.late_fee_cents == 100   # 30 days × tier1 1.00% of 10000"
            - "After second dunning: Invoice.late_fee_cents == 250  # 31 days × tier2 2.50% of 10000"

      - name: usage_late_arrival_window_boundary_seven_days
        grounds:
          - calculations.usage_attribution
          - validations[priority=22]
          - endpoints["POST /tenants/{tenant_id}/subscriptions/{id}/usage"]
        distinguishing_aspect: |
          Boundary on the late-arrival window. Metric: event_timestamp relative to
          (current_cycle.cycle_start - 7 days). Endpoint: POST /usage (distinct endpoint
          from instance #1). event_timestamp == cycle_start - 7 days is REJECTED (`<`
          comparison: `event_timestamp < current_cycle.cycle_start - LATE_ARRIVAL_WINDOW_DAYS`
          → reject means `>=` is allowed). Per the scaffold's rule the predicate is
          `event_timestamp < cycle_start - 7d` triggers ERR_USAGE_TOO_LATE; equality
          at cycle_start - 7d is ACCEPTED.
        test_recipe:
          setup:
            - "Tenant + Subscription with current cycle [2030-02-01T00:00:00Z, 2030-03-01T00:00:00Z)"
            - "POST /_clock/advance to 2030-02-10T00:00:00Z"
          trigger:
            - "POST /usage A: event_timestamp=2030-01-25T00:00:00Z (== cycle_start - 7d, boundary equal)"
            - "POST /usage B: event_timestamp=2030-01-24T23:59:59Z (== cycle_start - 7d - 1s, just outside)"
          assert:
            - "Request A returns 201 (boundary case `>=` cycle_start - 7d accepted; attributed_cycle_start == current_cycle.cycle_start)"
            - "Request B returns 422 with error_id=='ERR_USAGE_TOO_LATE'"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: subscription_upgrade_requires_tenant_unrestricted
        grounds:
          - state_machines.Subscription.subscription_status.ACTIVE_to_ACTIVE_upgrade
          - entities.Tenant.fields.restriction_level
          - validations[priority=13]
        distinguishing_aspect: |
          Subscription's ACTIVE→ACTIVE upgrade transition is gated by sibling entity
          Tenant's restriction_level == NONE. The Subscription transition is rejected
          ERR_TENANT_READ_ONLY when Tenant.restriction_level IN {READ_ONLY,
          FEATURE_RESTRICTED}. Entity pair: Subscription ↔ Tenant.
        test_recipe:
          setup:
            - "Tenant T pushed into restriction_level=READ_ONLY via dunning; ACTIVE Subscription S"
            - "Two PackageVersions exist so an upgrade is structurally possible"
          trigger:
            - "POST /tenants/{T.id}/subscriptions/{S.id}/upgrade {target_package_code=PRO}"
          assert:
            - "HTTP 403 with error_id=='ERR_TENANT_READ_ONLY'"
            - "Subscription.subscription_status remains 'ACTIVE' (unchanged)"
            - "Subscription.package_version_id unchanged"

      - name: invoice_issue_requires_subscription_not_cancelled
        grounds:
          - state_machines.Invoice.invoice_status.DRAFT_to_ISSUED
          - validations[priority=11]   # subscription_status_invalid blocks the chain
          - entities.Subscription.fields.subscription_status
        distinguishing_aspect: |
          Invoice's DRAFT→ISSUED transition depends on the parent Subscription not
          being CANCELLED. Distinct entity pair from instance #1: Invoice ↔ Subscription
          (vs. Subscription ↔ Tenant), satisfying "different entity pairs".
        test_recipe:
          setup:
            - "Tenant + Subscription S with a DRAFT Invoice I (e.g., from upgrade proration scenario)"
            - "DELETE /tenants/{T.id}/subscriptions/{S.id} → S.subscription_status='CANCELLED'"
          trigger:
            - "POST /tenants/{T.id}/invoices/{I.id}/issue"
          assert:
            - "HTTP 409 with error_id=='ERR_SUBSCRIPTION_STATUS_INVALID'"
            - "Invoice.invoice_status remains 'DRAFT'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: invoice_cycle_point_collision_on_cycle_start
        grounds:
          - validations[priority=25]
          - entities.Invoice.fields.cycle_start
          - entities.Invoice.fields.pricing_model
          - concurrency_rules["Issue invoice while another issuance for the same subscription cycle is racing"]
        distinguishing_aspect: |
          Interval-semantic: point-collision on the cycle anchor.
          (subscription_id, cycle_start, pricing_model) uniqueness — two attempts to
          issue an invoice for the SAME cycle anchor are rejected. Resource entity:
          Invoice. Geometric treatment: equality on cycle_start (a single point on the
          time axis, no buffer, no aggregate capacity).
        test_recipe:
          setup:
            - "Tenant + Subscription S with one ISSUED prepaid Invoice I for cycle [cs, ce)"
            - "Test harness creates a DRAFT Invoice I2 for the same (subscription_id, cs, pricing_model=PREPAID) — either via internal seed or via attempting to upgrade twice; otherwise simulate via direct POST /invoices/issue raceable path"
          trigger:
            - "POST /tenants/{T.id}/invoices/{I2.id}/issue (second issuance attempt)"
          assert:
            - "HTTP 409 with error_id=='ERR_INVOICE_CYCLE_ALREADY_ISSUED'"
            - "Only one Invoice with status IN {ISSUED, PARTIALLY_PAID, PAID, OVERDUE} exists for (S.id, cs, PREPAID)"

      - name: usage_late_arrival_window_gap_rejection
        grounds:
          - calculations.usage_attribution
          - validations[priority=22]
          - entities.UsageRecord.fields.event_timestamp
          - entities.Subscription.fields.cycle_start
        distinguishing_aspect: |
          Interval-semantic: GAP rejection on an open half-line outside the late-arrival
          window. Resource entity: UsageRecord (distinct from Invoice in instance #1).
          Geometric treatment: half-open exclusion `event_timestamp < cycle_start - 7d`
          rejected; equality at the boundary admitted. The geometry is gap-based
          (rejection happens because the record falls into a forbidden time region),
          not point-equality like instance #1.
        test_recipe:
          setup:
            - "Tenant + Subscription with current cycle [2030-02-01, 2030-03-01)"
            - "/_clock/advance to 2030-02-10"
          trigger:
            - "POST /usage with event_timestamp=2030-01-20T00:00:00Z (12 days before cycle_start, outside 7-day window)"
          assert:
            - "HTTP 422 with error_id=='ERR_USAGE_TOO_LATE'"
            - "Subscription.quota_consumed unchanged"
            - "No UsageRecord persisted for this idempotency_key"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: upgrade_then_immediate_downgrade_refund_preserves_subscription_change_sum
        grounds:
          - calculations.proration_amount
          - state_machines.Subscription.subscription_status.ACTIVE_to_ACTIVE_upgrade
          - state_machines.Subscription.subscription_status.ACTIVE_to_ACTIVE_downgrade_immediate_refund
          - entities.SubscriptionChange.fields.prorated_charge_cents
          - entities.CreditNote.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: SUM_PRORATIONS = (sum of SubscriptionChange.prorated_charge_cents
          across the round-trip) + (sum of CreditNote.amount_cents with origin=REFUND_DOWNGRADE
          attributable to the round-trip) = 0. The forward action (UPGRADE) charges +X;
          the compensating action (DOWNGRADE_IMMEDIATE_REFUND back to the original
          package on the same elapsed day) charges -X and issues a CreditNote for |X|.
          Net SubscriptionChange.prorated_charge_cents sum = 0; net cash flow from the
          tenant = 0 once credit is fully applied. Pinned formula over entity fields.
        test_recipe:
          setup:
            - "Tenant T (USD), PackageVersions P_LO (base=3000), P_HI (base=6000), MONTHLY PREPAID"
            - "Subscription S started on P_LO, converted; cycle [day0, day30); /_clock/advance to day 10"
          trigger:
            - "POST /tenants/{T.id}/subscriptions/{S.id}/upgrade {target_package_code=P_HI}"
            - "(no /_clock/advance) — POST /tenants/{T.id}/subscriptions/{S.id}/downgrade {target_package_code=P_LO, mode=IMMEDIATE_REFUND}"
          assert:
            - "SubscriptionChange[change_type=UPGRADE].prorated_charge_cents == 2000"
            - "SubscriptionChange[change_type=DOWNGRADE_IMMEDIATE_REFUND].prorated_charge_cents == -2000"
            - "Sum of the two SubscriptionChange.prorated_charge_cents == 0 (conserved quantity)"
            - "CreditNote with origin=REFUND_DOWNGRADE and amount_cents == 2000 exists"
            - "Subscription.package_version_id at end == package_version_id at start (round-trip equivalent)"

      - name: payment_then_full_payment_preserves_outstanding_balance_to_zero
        grounds:
          - calculations.tenant_outstanding_balance
          - state_machines.Invoice.invoice_status.OVERDUE_to_PAID
          - state_machines.Subscription.payment_status.OVERDUE_TIER3_to_CURRENT
          - state_machines.Tenant.tenant_status.SUSPENDED_to_ACTIVE
          - calculations.late_fee_accrual
        distinguishing_aspect: |
          Different conserved quantity from instance #1: Tenant.outstanding_balance_cents.
          The forward chain (dunning + late fee accrual) drives outstanding_balance from
          BASELINE to BASELINE + late_fee_cents. The compensating action (full payment
          including the accrued late fee) returns outstanding_balance_cents to 0 AND
          Invoice.late_fee_cents to 0 (pinned formula: post-clearance recompute).
          Conserved invariant: AFTER the full payment, outstanding_balance_cents == 0
          AND late_fee_cents == 0 — the dunning-side surcharge does not leave drift.
        test_recipe:
          setup:
            - "Reach end of Rule 4 instance #1 (Tenant SUSPENDED, Subscription payment_status=OVERDUE_TIER3, Invoice OVERDUE with late_fee_cents>0)"
            - "Capture pre_total = Invoice.total_cents AND pre_late_fee = Invoice.late_fee_cents (both >0)"
          trigger:
            - "POST /tenants/{T.id}/invoices/{I.id}/payments {amount_cents=pre_total+pre_late_fee, currency=USD, external_reference='final-pay'}"
          assert:
            - "Invoice.invoice_status == 'PAID'"
            - "Invoice.late_fee_cents == 0"
            - "Tenant.outstanding_balance_cents == 0"
            - "Subscription.payment_status == 'CURRENT'"
            - "Tenant.tenant_status == 'ACTIVE'"
            - "Sum across the whole episode: paid amount (pre_total + pre_late_fee) - (Invoice.total_cents incl. late_fee) == 0 (the conserved quantity outstanding_balance_cents lands exactly at zero, not negative)"
