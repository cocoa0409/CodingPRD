              payload: { label: "A", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cycA: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "B-touching", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-30T23:59:59Z", cycle_end: "2026-10-31T23:59:59Z", reporting_due_date: "2026-11-15T00:00:00Z" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C-disjoint", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-10-01T00:00:00Z", cycle_end: "2026-10-31T23:59:59Z", reporting_due_date: "2026-11-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cycC: $.data.id }
          assert:
            - "cycle B (starts exactly at A's cycle_end): error_id == ERR_CYCLE_WINDOW_OVERLAP, HTTP 409 — boundary touch counts under closed semantics"
            - "cycle C (starts one second after A's end): 201 created, status SETUP"

      - name: engagement_window_half_open_touch_allowed
        grounds:
          - validations[priority=17]
          - errors[ERR_ENGAGEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource VendorEngagement, HALF-OPEN semantics with scope
          intersection: an engagement whose access_start equals another's
          access_end does NOT overlap (touch allowed), a one-day true overlap
          with intersecting scope conflicts, and a window-overlapping
          engagement with disjoint cycle scope is accepted — three branches of
          the same predicate.
        test_recipe:
          setup:
            - "Program ACTIVE with two disjoint cycles C1 [2026-09-01..2026-09-30T23:59:59Z] and C2 [2026-10-01..2026-10-31T23:59:59Z]"
            - "Engagement A: scope [C1], half-open window [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Clinic", code: "CLN" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc1: $.data.id }
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C2", enrollment_start: "2026-09-01T00:00:00Z", enrollment_end: "2026-09-30T23:59:59Z", cycle_start: "2026-10-01T00:00:00Z", cycle_end: "2026-10-31T23:59:59Z", reporting_due_date: "2026-11-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc2: $.data.id }
            - call: "POST /programs/${prog}/vendor-engagements"
              payload: { vendor_name: "EvalCo", scope_program_cycle_ids: ["${cyc1}"], access_start: "2026-09-01T00:00:00Z", access_end: "2026-10-01T00:00:00Z", deliverable_due: "2026-10-10T00:00:00Z" }
              as: ProgramDirector
              captures: { engA: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/vendor-engagements"
              payload: { vendor_name: "TouchingOK", scope_program_cycle_ids: ["${cyc1}"], access_start: "2026-10-01T00:00:00Z", access_end: "2026-11-01T00:00:00Z", deliverable_due: "2026-11-10T00:00:00Z" }
              as: ProgramDirector
              captures: { engB: $.data.id }
            - call: "POST /programs/${prog}/vendor-engagements"
              payload: { vendor_name: "OverlapBad", scope_program_cycle_ids: ["${cyc1}"], access_start: "2026-09-15T00:00:00Z", access_end: "2026-11-01T00:00:00Z", deliverable_due: "2026-11-10T00:00:00Z" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /programs/${prog}/vendor-engagements"
              payload: { vendor_name: "DisjointScopeOK", scope_program_cycle_ids: ["${cyc2}"], access_start: "2026-09-15T00:00:00Z", access_end: "2026-11-01T00:00:00Z", deliverable_due: "2026-11-10T00:00:00Z" }
              as: ProgramDirector
              captures: { engD: $.data.id }
          assert:
            - "engagement B (access_start == A.access_end): 201 created — half-open touch is not an overlap"
            - "engagement C (window overlaps A by 15 days, scope intersects on C1): error_id == ERR_ENGAGEMENT_WINDOW_OVERLAP, HTTP 409"
            - "engagement D (window overlaps A but scope [C2] disjoint): 201 created"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: consent_grant_revoke_headcount_invariant
        grounds:
          - entities.ProgramCycle.fields.active_participant_count
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.Participant.ENROLLED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: active participant headcount. The grant/revoke
          pair drives active_participant_count 0 -> 1 -> 0; the compensating
          action (revoke) MUST return the cycle's count to its pre-grant value
          with zero drift.
        test_recipe:
          setup:
            - "Cycle ACTIVE; participant P-001 ENROLLED (no consent yet); active_participant_count == 0"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Foodbank", code: "FDB" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTPUT", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cnt0: $.data.active_participant_count }
          trigger:
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
              captures: { cons1: $.data.id }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cnt1: $.data.active_participant_count }
            - call: "POST /consents/${cons1}/revoke"
              payload: {}
              as: PrivacyOfficer
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cnt2: $.data.active_participant_count }
            - call: "GET /participants/${p1}"
              payload: {}
              as: PrivacyOfficer
              captures: { p_status: $.data.status }
          assert:
            - "before grant: active_participant_count == 0 (ENROLLED does not count)"
            - "after grant: active_participant_count == 1 (ENROLLED -> ACTIVE)"
            - "after revoke: active_participant_count == 0 — forward + compensating action conserve the headcount"
            - "participant.status == WITHDRAWN"

      - name: single_approved_model_invariant
        grounds:
          - state_machines.LogicModel.SUBMITTED_to_APPROVED
          - state_machines.LogicModel.APPROVED_to_SUPERSEDED
          - entities.Program.fields.current_logic_model_id
        distinguishing_aspect: |
          Conserved quantity: count of APPROVED logic models per program.
          Approving model M2 supersedes M1, so count(APPROVED) is 1 both before
          and after the second approval — the approve/supersede pair conserves
          the exactly-one-approved invariant.
        test_recipe:
          setup:
            - "Program ACTIVE; model M1 (indicator X) APPROVED; model M2 (indicator Y) SUBMITTED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "STEM", code: "STM" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "M1" }
              as: EvaluationLead
              captures: { m1: $.data.id }
            - call: "POST /logic-models/${m1}/indicators"
              payload: { code: "X", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, measurement_frequency: "MONTHLY" }
              as: EvaluationLead
              captures: { indX: $.data.id }
            - call: "POST /logic-models/${m1}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v1: $.data.version }
            - call: "POST /logic-models/${m1}/approve"
              payload: { expected_program_version: "${prog_v1}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "M2" }
              as: EvaluationLead
              captures: { m2: $.data.id }
            - call: "POST /logic-models/${m2}/indicators"
              payload: { code: "Y", level: "IMPACT", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, measurement_frequency: "END_OF_CYCLE" }
              as: EvaluationLead
            - call: "POST /logic-models/${m2}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}/logic-models"
              payload: { status: "APPROVED" }
              as: EvaluationLead
              captures: { approved_before: $.data }
          trigger:
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /logic-models/${m2}/approve"
              payload: { expected_program_version: "${prog_v2}" }
              as: EvaluationLead
            - call: "GET /programs/${prog}/logic-models"
              payload: { status: "APPROVED" }
              as: EvaluationLead
              captures: { approved_after: $.data }
            - call: "GET /logic-models/${m1}"
              payload: {}
              as: EvaluationLead
              captures: { m1_status: $.data.status }
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { cur_lm: $.data.current_logic_model_id }
            - call: "GET /indicators/${indX}"
              payload: {}
              as: EvaluationLead
              captures: { indX_status: $.data.status }
          assert:
            - "before second approval: exactly 1 APPROVED model and it is M1"
            - "after second approval: exactly 1 APPROVED model and it is M2 — count conserved at 1"
            - "M1.status == SUPERSEDED; M1's indicator X status == RETIRED (cascade)"
            - "program.current_logic_model_id == M2 id"
