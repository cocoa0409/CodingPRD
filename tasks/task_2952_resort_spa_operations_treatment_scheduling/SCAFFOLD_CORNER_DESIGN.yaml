        captures: { a1: $.data.id, a1_v: $.data.version }
      trigger:
      - call: POST /treatment-rooms
        payload: { code: "DRY-2", room_class: "DRY", capacity_guests: 1, turnover_buffer_minutes: 15, hourly_fixed_cost_cents: 2500 }
        as: ComplianceOfficer
        as_user_id: "co-1"
        captures: { err_room_co: $.data.error_id }
      - call: POST /treatment-rooms
        payload: { code: "DRY-2", room_class: "DRY", capacity_guests: 1, turnover_buffer_minutes: 15, hourly_fixed_cost_cents: 2500 }
        as: SpaCoordinator
        captures: { err_room_coord: $.data.error_id }
      - call: PATCH /treatment-rooms/${room_a}
        payload: { status: "MAINTENANCE" }
        as: SpaCoordinator
        captures: { err_patch_room: $.data.error_id }
      - call: POST /therapists
        payload: { full_name: "Sneaky Therapist", employment_type: "EMPLOYEE", commission_tier: "JUNIOR", base_hourly_cost_cents: 4000, practice_state_code: "CA" }
        as: Therapist
        as_user_id: "${th}"
        captures: { err_therapist_create: $.data.error_id }
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: SpaDirector
        as_user_id: "dir-1"
        captures: { err_screen_director: $.data.error_id }
      - call: POST /intake-forms/${in1}/override
        payload: { override_reason: "not my job" }
        as: ComplianceOfficer
        as_user_id: "co-3"
        captures: { err_override_co: $.data.error_id }
      - call: POST /appointments/${a1}/confirm
        payload: {}
        as: SpaDirector
        as_user_id: "dir-1"
        captures: { err_confirm_director: $.data.error_id }
      - call: POST /appointments/${a1}/start
        payload: {}
        as: SpaCoordinator
        captures: { err_start_coordinator: $.data.error_id }
      - call: POST /appointments/${a1}/settlements
        payload: { expected_appointment_version: "${a1_v}" }
        as: SpaCoordinator
        captures: { err_settlement_coordinator: $.data.error_id }
      - call: POST /appointments/${a1}/no-show
        payload: {}
        as: Guest
        as_user_id: "${g1}"
        captures: { err_no_show_guest: $.data.error_id }
      - call: POST /appointments/${a1}/confirm
        payload: {}
        as: SpaCoordinator
      - call: GET /appointments/${a1}
        as: SpaCoordinator
      assert:
      - "POST /treatment-rooms returns 403 ERR_ROLE_NOT_PERMITTED for ComplianceOfficer, SpaCoordinator and Therapist: it is SpaDirector-exclusive, and no DRY-2 room is ever created"
      - "PATCH /treatment-rooms/${room_a} by SpaCoordinator returns 403 and leaves status ACTIVE"
      - "POST /intake-forms/${in1}/screen by SpaDirector returns 403 ERR_ROLE_NOT_PERMITTED and not 409 ERR_INVALID_INTAKE_STATE, although the form is already SCREENED_CLEAR: the role rung at priority 2 outranks the state rung at priority 9"
      - "POST /intake-forms/${in1}/override by ComplianceOfficer returns 403, so the officer that screens can never override even with a different user id"
      - "POST /appointments/${a1}/confirm by SpaDirector returns 403: confirm is SpaCoordinator-exclusive, and the director's broad read access does not extend to front-desk transitions"
      - "POST /appointments/${a1}/start by SpaCoordinator and POST /appointments/${a1}/settlements by SpaCoordinator both return 403; the settlement probe carries a currently valid ${a1_v}, so its rejection is purely the role rung and never reaches the OCC or state rungs"
      - "POST /appointments/${a1}/no-show by Guest returns 403: the guest may cancel their own appointment but no-show is SpaCoordinator-exclusive, which is consistent with Guest.exclusive_operations being empty"
      - "the appointment was nevertheless created by the Guest role in setup, proving POST /appointments is a shared operation, and the SpaCoordinator confirm at the end returns 200 with schedule_status CONFIRMED"
      - "GET /appointments/${a1} shows every rejected probe left no trace: gratuity_cents 0, clearance_status CLEARED and version advanced only by the successful confirm"

  - name: guest_identity_scoping_on_shared_guest_endpoints
