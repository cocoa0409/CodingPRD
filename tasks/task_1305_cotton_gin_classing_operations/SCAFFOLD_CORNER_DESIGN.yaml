  # ================================================== validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "a request without X-User-ID/X-User-Role fails priority 1 with 401 before any role, existence, or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C40", legal_name: "No Auth" }
          assert:
            - "http 401, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: existence_precedes_state_for_unknown_module
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_MODULE_NOT_FOUND]"]
        distinguishing_aspect: "queue against a nonexistent module id returns 404 ERR_MODULE_NOT_FOUND — existence (priority 3) is evaluated before any state precondition (priority 4)."
        test_recipe:
          setup: ["an OPEN shift exists"]
          setup_api_calls:
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-EX" }
              as: GinOperator
              captures: { s: $.data.id }
          trigger:
            - call: "POST /gin-ops/modules/00000000-0000-0000-0000-000000000000/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "http 404, error_id == ERR_MODULE_NOT_FOUND (not a state error)"

      - name: duplicate_ticket_number_same_grower_season
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_TICKET_NUMBER]"]
        distinguishing_aspect: "(grower_id, season, ticket_number) is unique: the same ticket for the same grower and season is rejected even with a fresh module_tag."
        test_recipe:
          setup: ["grower with module T-1 in season 2026"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C41", legal_name: "Ticket Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-T1", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-T2", gross_weight_lbs: 12000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_TICKET_NUMBER, http 409; only one module with ticket T-1 exists for the grower"

      - name: duplicate_module_tag_same_season
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_MODULE_TAG]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / module_create_safety_beats_duplicate_tag"
          rationale: "that instance's second trigger asserts the duplicate-tag rejection in isolation (fm 5.0 passes safety, so the constraint error surfaces)."

      - name: same_module_tag_different_season_allowed
        claim_type: satisfaction_pass
        grounds: ["validations[priority=6]", entities.ModuleReceipt.fields.module_tag]
        distinguishing_aspect: "module_tag uniqueness is scoped per season: the same tag in season 2027 is accepted when a 2026 module already holds it."
        test_recipe:
          setup: ["grower with module MT-SEASON in 2026"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C42", legal_name: "Season Tag Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-SEASON", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
          trigger:
            - call: "POST /gin-ops/modules"
              payload: { grower_id: "${g}", season: "2027", ticket_number: "T-1", module_tag: "MT-SEASON", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m2: $.data.id }
          assert:
            - "201 created: ModuleReceipt.${m2} season 2027 (note: ticket T-1 also repeats — the (grower, season, ticket) scope permits it)"

      - name: queue_season_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SEASON_MISMATCH]"]
        distinguishing_aspect: "a 2026 module cannot queue into a 2025 shift — the referential season check fires after state and safety pass."
