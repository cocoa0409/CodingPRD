          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 630, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { res: "$.data.validation_result", reasons: "$.data.failure_reasons" }
          assert:
            - "Photo.validation_result == \"FAIL\""
            - "Photo.failure_reasons contains \"NOT_SQUARE\""

      - name: revalidate_photo_flips_fail_to_pass
        claim_type: Correct Result
        grounds:
          - calculations.photo_validation
          - endpoints["POST /photos/{id}/revalidate"]
          - entities.Photo.fields.validation_result
        distinguishing_aspect: "POST /photos/{id}/revalidate with corrected inputs (background_is_white true) recomputes a previously-FAIL photo to PASS and empties failure_reasons; the revalidate endpoint re-runs photo_validation."
        test_recipe:
          setup:
            - "A photo attached with background_is_white false (validation_result FAIL)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Reval", date_of_birth: "1990-01-01", email: "reval@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
