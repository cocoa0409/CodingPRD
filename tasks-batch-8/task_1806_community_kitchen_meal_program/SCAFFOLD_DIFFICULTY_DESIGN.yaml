              as: FoodSafetyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /kitchen/food-batches/${b2}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
              captures: { b2_status: $.data.status }
          assert:
            - "B1 rejected: $.data.error_id == ERR_BATCH_EXPIRED (now == use_by is expired; strict <)"
            - "FoodBatch.${b2}.status == INSPECTING (use_by one second later is still inspectable)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_open_gated_by_equipment_posture
        grounds:
          - state_machines.MealService.PLANNED_to_OPEN
          - entities.Site.fields.equipment_posture
          - errors[ERR_EQUIPMENT_HALTED]
        distinguishing_aspect: |
          MealService/MenuDay -> Site pair: start-production and service open are
          rejected when Site.equipment_posture == HALTED (derived from
          EquipmentAsset children: two CRITICAL assets down), and proceed when
          posture is RESTRICTED (exactly one CRITICAL down) — gating reads the
          derived aggregate, not any single asset.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site S with CRITICAL assets A1 A2; menu day D FORECAST_LOCKED with item confirmed; DINE_IN service PLANNED."
            - "Both A1 A2 DOWN_FOR_REPAIR (posture HALTED): start-production probe rejected with ERR_EQUIPMENT_HALTED. Then A1 repaired (posture RESTRICTED): start-production succeeds."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Gate Kitchen", dine_in_capacity: 50, togo_capacity_per_window: 20, delivery_radius_km: 8 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/equipment-assets"
              payload: { site_id: "${site_id}", name: "Oven 1", equipment_class: "OVEN", criticality: "CRITICAL" }
              as: KitchenManager
              captures: { a1: $.data.id }
            - call: "POST /kitchen/equipment-assets"
              payload: { site_id: "${site_id}", name: "Oven 2", equipment_class: "OVEN", criticality: "CRITICAL" }
              as: KitchenManager
              captures: { a2: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "beans", quantity_servings: 10, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 50 }
              as: KitchenManager
              captures: { batch_id: $.data.id }
            - call: "POST /kitchen/food-batches/${batch_id}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${batch_id}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-10" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Beans", planned_servings: 10, requires_equipment_class: "OVEN" }
              as: KitchenManager
              captures: { item: $.data.id }
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${batch_id}", servings: 10 }
              as: KitchenManager
            - call: "POST /kitchen/menu-items/${item}/confirm"
              payload: {}
              as: KitchenManager
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
              as: KitchenManager
              captures: { mdv: $.data.version }
            - call: "POST /kitchen/menu-days/${md}/lock-forecast"
              payload: { expected_menu_day_version: "${mdv}" }
              as: KitchenManager
            - call: "POST /kitchen/meal-services"
              payload: { menu_day_id: "${md}", service_model: "DINE_IN", window_start: "2026-08-10T11:00:00Z", window_end: "2026-08-10T13:00:00Z", capacity: 10 }
              as: KitchenManager
              captures: { svc: $.data.id }
            - call: "POST /kitchen/equipment-assets/${a1}/report-fault"
              payload: {}
              as: KitchenManager
            - call: "POST /kitchen/equipment-assets/${a2}/report-fault"
              payload: {}
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/menu-days/${md}/start-production"
              payload: {}
              as: KitchenManager
              captures: { e_halt: $.data.error_id }
            - call: "POST /kitchen/equipment-assets/${a1}/complete-repair"
              payload: { inspected: true }
              as: KitchenManager
            - call: "POST /kitchen/menu-days/${md}/start-production"
              payload: {}
              as: KitchenManager
              captures: { md_status: $.data.status }
            - call: "GET /kitchen/menu-days/${md}"
              payload: {}
              as: KitchenManager
              captures: { mdv2: $.data.version }
            - call: "POST /kitchen/meal-services/${svc}/open"
              payload: { expected_menu_day_version: "${mdv2}" }
              as: KitchenManager
              captures: { svc_status: $.data.status }
          assert:
            - "first start-production rejected: $.data.error_id == ERR_EQUIPMENT_HALTED (posture HALTED with 2 CRITICAL down)"
            - "after one repair posture == RESTRICTED and start-production succeeds (MenuDay.${md}.status == IN_PRODUCTION)"
            - "MealService.${svc}.status == OPEN (RESTRICTED posture does not gate open)"
      - name: shift_checkin_gated_by_volunteer_cert
        grounds:
          - state_machines.VolunteerShift.SCHEDULED_to_CHECKED_IN
          - errors[ERR_CERTIFICATION_INSUFFICIENT]
        distinguishing_aspect: |
          Different entity pair (VolunteerShift -> Volunteer): check-in for
          role_on_shift COOK requires the linked Volunteer's certification valid
          at the logical clock; a cert expired before the shift blocks check-in
          even though the shift itself is SCHEDULED and inside its check-in
          window.
        test_recipe:
          setup:
            - "Site S; menu day D 2026-08-11; volunteer V BASIC with certification_expires_at 2026-08-10T00:00:00Z (expired); shift role COOK 10:00-14:00 SCHEDULED; clock 2026-08-11T09:50:00Z (inside check-in window)."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Cert Kitchen", dine_in_capacity: 40, togo_capacity_per_window: 20, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Vol X", email: "vx@x.org", certification_level: "BASIC", certification_expires_at: "2026-08-10T00:00:00Z" }
              as: KitchenManager
              captures: { vol: $.data.id }
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${site_id}", volunteer_id: "${vol}", menu_day_id: "${md}", role_on_shift: "COOK", starts_at: "2026-08-11T10:00:00Z", ends_at: "2026-08-11T14:00:00Z" }
              as: KitchenManager
              captures: { sh: $.data.id }
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:50:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /kitchen/volunteer-shifts/${sh}/check-in"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_CERTIFICATION_INSUFFICIENT (cert expired before now; shift state alone would allow check-in)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_shift_halfopen_overlap
        grounds:
          - validations[priority=6]
          - entities.VolunteerShift.fields.starts_at
          - entities.VolunteerShift.fields.ends_at
          - errors[ERR_TEMPORAL_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on VolunteerShift: for volunteer V with an
          existing shift [08:00, 10:00), a new shift [10:00, 12:00) exactly
          abutting is ACCEPTED (end exclusive) while [09:59, 11:00) is rejected —
          adjacency is not a conflict under half-open semantics.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site S; menu day D 2026-08-11; volunteer V ACTIVE BASIC cert valid; existing shift [08:00, 10:00)."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Shift Kitchen", dine_in_capacity: 40, togo_capacity_per_window: 20, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/volunteers"
              payload: { full_name: "Vol H", email: "vh@x.org", certification_level: "BASIC", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: KitchenManager
              captures: { vol: $.data.id }
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${site_id}", volunteer_id: "${vol}", menu_day_id: "${md}", role_on_shift: "PREP", starts_at: "2026-08-11T08:00:00Z", ends_at: "2026-08-11T10:00:00Z" }
              as: KitchenManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${site_id}", volunteer_id: "${vol}", menu_day_id: "${md}", role_on_shift: "SERVER", starts_at: "2026-08-11T10:00:00Z", ends_at: "2026-08-11T12:00:00Z" }
              as: KitchenManager
              captures: { sh2: $.data.id }
            - call: "POST /kitchen/volunteer-shifts"
              payload: { site_id: "${site_id}", volunteer_id: "${vol}", menu_day_id: "${md}", role_on_shift: "SERVER", starts_at: "2026-08-11T09:59:00Z", ends_at: "2026-08-11T11:00:00Z" }
              as: KitchenManager
              captures: { err: $.data.error_id }
          assert:
            - "abutting shift [10:00,12:00) accepted (half-open: 10:00 is not inside [08:00,10:00))"
            - "overlapping shift [09:59,11:00) rejected: $.data.error_id == ERR_TEMPORAL_CONFLICT"
      - name: equipment_maintenance_closed_interval_buffer
        grounds:
          - state_machines.EquipmentAsset.OPERATIONAL_to_IN_MAINTENANCE
          - errors[ERR_TEMPORAL_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a different resource: maintenance
          windows for the same equipment_class at a site are CLOSED intervals
          with a 15-minute buffer — a window touching at the endpoint (12:00 vs
          12:00) conflicts, a window starting 10 minutes after the prior ends
          conflicts (inside buffer), and only a gap >= 15 minutes passes; the
          half-open abutment that shift scheduling permits is rejected here.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site S; assets A1 A2 both equipment_class OVEN; A1 IN_MAINTENANCE with window [2026-08-12T08:00Z, 2026-08-12T12:00Z]."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Maint Kitchen", dine_in_capacity: 40, togo_capacity_per_window: 20, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/equipment-assets"
              payload: { site_id: "${site_id}", name: "Oven A", equipment_class: "OVEN", criticality: "SUPPORT" }
              as: KitchenManager
              captures: { a1: $.data.id }
            - call: "POST /kitchen/equipment-assets"
              payload: { site_id: "${site_id}", name: "Oven B", equipment_class: "OVEN", criticality: "SUPPORT" }
              as: KitchenManager
              captures: { a2: $.data.id }
            - call: "POST /kitchen/equipment-assets/${a1}/schedule-maintenance"
              payload: { maint_start: "2026-08-12T08:00:00Z", maint_end: "2026-08-12T12:00:00Z" }
              as: KitchenManager
          trigger:
            - call: "POST /kitchen/equipment-assets/${a2}/schedule-maintenance"
              payload: { maint_start: "2026-08-12T12:00:00Z", maint_end: "2026-08-12T14:00:00Z" }
              as: KitchenManager
              captures: { err_touch: $.data.error_id }
            - call: "POST /kitchen/equipment-assets/${a2}/schedule-maintenance"
              payload: { maint_start: "2026-08-12T12:10:00Z", maint_end: "2026-08-12T14:00:00Z" }
              as: KitchenManager
              captures: { err_buf: $.data.error_id }
            - call: "POST /kitchen/equipment-assets/${a2}/schedule-maintenance"
              payload: { maint_start: "2026-08-12T12:15:00Z", maint_end: "2026-08-12T14:00:00Z" }
              as: KitchenManager
              captures: { ok_status: $.data.status }
          assert:
            - "touching window (12:00 vs 12:00) rejected: ERR_TEMPORAL_CONFLICT (closed-interval touch conflicts, unlike half-open shifts)"
            - "10-minute gap rejected: ERR_TEMPORAL_CONFLICT (inside 15-minute buffer)"
            - "15-minute gap accepted: EquipmentAsset.${a2}.status == IN_MAINTENANCE"

  - rule_id: compensating_invariant
    instances:
      - name: batch_servings_conservation_under_alloc_and_waste
        grounds:
          - calculations.inventory_conservation
          - entities.FoodBatch.fields.remaining_servings
        distinguishing_aspect: |
          Conserved quantity: FoodBatch servings — quantity_servings ==
          allocated + wasted(DISCARD/COMPOST) + rescue_redirected + remaining
          after every mutation; allocate 20, waste 5 (DISCARD), waste 10
          (RESCUE_REDIRECT) on a 50-serving batch leaves remaining == 15 exactly.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00Z; site S; PURCHASE batch B quantity 50 ACCEPTED; menu day D (2026-08-11) with item I planned 20."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Conservation Kitchen", dine_in_capacity: 40, togo_capacity_per_window: 20, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "PURCHASE", item_description: "potatoes", quantity_servings: 50, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-20T00:00:00Z", unit_cost_cents_per_serving: 40 }
              as: KitchenManager
              captures: { batch_id: $.data.id }
            - call: "POST /kitchen/food-batches/${batch_id}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${batch_id}/record-inspection"
              payload: { result: "PASSED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md: $.data.id }
            - call: "POST /kitchen/menu-days/${md}/menu-items"
              payload: { name: "Potato Stew", planned_servings: 20 }
              as: KitchenManager
              captures: { item: $.data.id }
          trigger:
            - call: "POST /kitchen/menu-items/${item}/allocations"
              payload: { food_batch_id: "${batch_id}", servings: 20 }
              as: KitchenManager
            - call: "POST /kitchen/waste-logs"
              payload: { menu_day_id: "${md}", food_batch_id: "${batch_id}", servings_wasted: 5, reason: "SPOILAGE", disposition: "DISCARD" }
              as: KitchenManager
            - call: "POST /kitchen/waste-logs"
              payload: { menu_day_id: "${md}", food_batch_id: "${batch_id}", servings_wasted: 10, reason: "OVERPRODUCTION", disposition: "RESCUE_REDIRECT" }
              as: KitchenManager
            - call: "GET /kitchen/food-batches/${batch_id}"
              payload: {}
              as: KitchenManager
              captures: { b_rem: $.data.remaining_servings }
          assert:
            - "FoodBatch.${batch_id}.remaining_servings == 15 (50 - 20 allocated - 5 discarded - 10 rescue_redirected)"
            - "invariant holds: quantity(50) == allocated(20) + wasted_discard_compost(5) + rescue_redirected(10) + remaining(15)"
      - name: service_capacity_returned_on_release
