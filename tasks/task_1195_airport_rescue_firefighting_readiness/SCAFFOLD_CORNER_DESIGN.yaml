      - name: err_determination_gate_error_battery
        claim_type: violation_to_error
        grounds: ["errors[ERR_AIRCRAFT_NOT_QUALIFYING]", "errors[ERR_NOT_LARGEST_QUALIFYING_AIRCRAFT]", "errors[ERR_INDEX_BELOW_REQUIRED]"]
        distinguishing_aspect: "Determination gates: non-qualifying aircraft, qualifying-but-not-longest aircraft, and new index below computed required are each rejected; the profile version is untouched by failed creates so one captured version serves all three."
        test_recipe:
          setup:
            - "Profile certificated D; B737-900 (band C, 6.0 dep, qualifying); C172 (band A, 2.0 dep, not qualifying); B767-400 (band D, 5.5 dep, qualifying and longest); fresh profile version captured"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "D" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager, captures: { ac_c: $.data.id } }
            - { call: "POST /arff/aircraft", payload: { model_name: "C172", length_ft: 27.0, avg_daily_departures: 2.0, in_scheduled_service: true }, as: AirportManager, captures: { ac_a: $.data.id } }
            - { call: "POST /arff/aircraft", payload: { model_name: "B767-400", length_ft: 180.0, avg_daily_departures: 5.5, in_scheduled_service: true }, as: AirportManager, captures: { ac_d: $.data.id } }
            - { call: "GET /arff/airport-profile", as: AirportManager, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac_a}", new_certificated_index: "D", expected_profile_version: "${pv}" }, as: AirportManager, captures: { e1: $.data.error_id } }
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac_c}", new_certificated_index: "D", expected_profile_version: "${pv}" }, as: AirportManager, captures: { e2: $.data.error_id } }
            - { call: "POST /arff/index-determinations", payload: { largest_aircraft_id: "${ac_d}", new_certificated_index: "C", expected_profile_version: "${pv}" }, as: AirportManager, captures: { e3: $.data.error_id } }
          assert:
            - "${e1} == \"ERR_AIRCRAFT_NOT_QUALIFYING\"  # C172 has 2.0 daily departures"
            - "${e2} == \"ERR_NOT_LARGEST_QUALIFYING_AIRCRAFT\"  # B767-400 (180.0 ft) is the longest qualifying"
            - "${e3} == \"ERR_INDEX_BELOW_REQUIRED\"  # required D > proposed C"

      - name: err_operations_misc_error_battery
        claim_type: violation_to_error
