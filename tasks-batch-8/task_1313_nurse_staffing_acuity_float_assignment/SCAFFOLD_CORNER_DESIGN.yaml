      - name: sitter_invalid_time_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "end_at must be strictly after start_at; an inverted window is a shape error."
