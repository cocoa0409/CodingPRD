# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Food Bank & Pantry Distribution — EXPERT band
# 9 rules x >=2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: poundage_ledger_planned_vs_distributed_diverge
        grounds:
          - calculations.distributed_poundage_ledger
          - entities.PoundageReport.fields.total_planned_lbs
          - entities.PoundageReport.fields.total_distributed_lbs
          - entities.PoundageReport.fields.shrinkage_lbs
        distinguishing_aspect: |
          On the PoundageReport (cycle domain), total_planned_lbs (forward-looking over
          PACKED+FINALIZED events) and total_distributed_lbs (chronological over FINALIZED
          events only) consume the same events yet differ: a packed-but-unfinalized event
          contributes 80 to planned but 0 to distributed, so shrinkage_lbs == 110.
        test_recipe:
          setup:
            - "Cold storage unit (REFRIGERATED, cap 5000); two PRODUCE lots reserved by an approved order."
            - "Two events finalized at 150 and 120 lbs; a third event packed (planned 80) but not finalized."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 1000, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot1_id: $.data.id, lot1_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry A", service_area: "County-1", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W23", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 380 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot1_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /distribution-events/${ev1_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "GET /poundage-reports/${cycle_id}"
              payload: {}
              as: AllocationManager
              captures: { planned: $.data.total_planned_lbs, distributed: $.data.total_distributed_lbs }
          assert:
            - "PoundageReport.total_planned_lbs == 380.00 (the order's single line of 380 reserved lbs packed once)"
            - "PoundageReport.total_distributed_lbs == 0.00 (no event finalized yet)"
            - "PoundageReport.shrinkage_lbs == 380.00"

      - name: event_planned_uses_reserved_not_requested_on_short_line
        grounds:
          - calculations.planned_event_poundage
          - entities.DistributionEvent.fields.planned_lbs
          - entities.OrderLine.fields.reserved_lbs
          - entities.OrderLine.fields.line_status
        distinguishing_aspect: |
          On the DistributionEvent (event domain, distinct from the PoundageReport cycle domain
          of the first instance), planned_lbs sums reserved_lbs (the FEFO outcome) rather than
          requested_lbs: a line requesting 300 against only 100 lbs of stock reserves 100 and is
          SHORT, so the packed planned_lbs is 100, not 300.
        test_recipe:
          setup:
            - "One PRODUCE lot of 100 lbs; an order line requests 300 lbs (short supply)."
            - "Order approved -> line reserves 100 lbs, line_status SHORT; event packed."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler2", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry B", service_area: "County-2", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W24", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 300 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { planned: $.data.planned_lbs }
          assert:
            - "DistributionEvent.planned_lbs == 100.00 (reserved, not the 300 requested)"
            - "OrderLine.reserved_lbs == 100.00 and OrderLine.line_status == SHORT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tefap_split_round_per_line_then_sum
        grounds:
          - calculations.event_tefap_split
          - entities.DistributionEvent.fields.tefap_lbs
        distinguishing_aspect: |
          Mode (b) nested rounding: event_tefap_split allocates actual_distributed_lbs across
          PACKED lines in FEFO order then rounds EACH line allocation to 2dp before summing
          tefap_lbs; the scaffold pins round-per-line-then-sum, distinct from any sum-then-round.
        test_recipe:
          setup:
            - "Order with two reserved lines: line1 DONATION PRODUCE 100 lbs (exp 2026-07-01), line2 TEFAP DRY_GOODS 50 lbs (exp 2026-08-01)."
            - "Event packed (planned 150), finalized at actual 150 lbs."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { cooler_id: $.data.id }
            - call: "POST /cold-storage-units"
              payload: { name: "DryShelf", temp_zone: "DRY", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { dry_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${cooler_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot1_id: $.data.id, lot1_v: $.data.version }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${dry_id}", food_category: "DRY_GOODS", source_type: "TEFAP", intake_lbs: 50, expiration_date: "2026-08-01T00:00:00.000Z", unit_cost_cents: 120 }
              as: FoodBankOperator
              captures: { lot2_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Pantry C", service_area: "County-3", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W25", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 100 }, { food_category: "DRY_GOODS", requested_lbs: 50 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot1_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 2, monthly_income_cents: 200000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /distribution-events/${ev_id}/finalize"
              payload: { actual_distributed_lbs: 150 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { tefap: $.data.tefap_lbs }
          assert:
            - "DistributionEvent.tefap_lbs == 50.00 (FEFO waterfall: 100 to DONATION line then 50 to TEFAP line)"
            - "DistributionEvent.status == FINALIZED"

      - name: fair_share_cap_floor_of_weighted_pool_share
        grounds:
          - calculations.fair_share_cap
          - entities.AllocationCycle.fields.total_fair_share_weight
          - entities.Agency.fields.fair_share_weight
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: fair_share_cap = floor(total_pool_lbs *
          fair_share_weight / total_fair_share_weight) minus already_drawn — three inputs with
          a floor and a state-filtered subtraction, distinct from the nested-rounding mode (b).
        test_recipe:
          setup:
            - "Two ACTIVE agencies: A weight 3, B weight 1. Cycle pool 10000, opened (total weight frozen at 4)."
            - "Agency A's cap = floor(10000 * 3/4) = 7500."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency A", service_area: "County-A", fair_share_weight: 3 }
              as: AllocationManager
              captures: { agency_a: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Agency B", service_area: "County-B", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_b: $.data.id }
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 20000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 8000, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W26", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_a}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 7500 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_a}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
              captures: { approved: $.data.approved_lbs, st: $.data.status }
          assert:
            - "AgencyOrder.status == APPROVED (7500 == cap, <= passes)"
            - "AgencyOrder.approved_lbs == 7500.00 (full reservation from the 8000-lb lot)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agency_order_recall_cycle_back_to_submitted
        grounds:
          - state_machines.AgencyOrder.SUBMITTED_to_APPROVED
          - state_machines.AgencyOrder.APPROVED_to_SUBMITTED
        distinguishing_aspect: |
          AgencyOrder exhibits a cyclic shape: APPROVED -> SUBMITTED via recall, re-enabling a
          second SUBMITTED -> APPROVED. This is a revision loop on the AgencyOrder entity,
          distinct from the DistributionEvent branching machine.
        test_recipe:
          setup:
            - "An approved order (reserved against a PRODUCE lot) with no packed/finalized events."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 500, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry D", service_area: "County-4", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W27", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 200 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
          trigger:
            - call: "POST /agency-orders/${order_id}/recall"
              payload: {}
              as: AllocationManager
              captures: { st: $.data.status, approved: $.data.approved_lbs }
          assert:
            - "AgencyOrder.status == SUBMITTED (cycled back from APPROVED)"
            - "AgencyOrder.approved_lbs == 0.00 (reservation released)"
            - "InventoryLot.${lot_id}.remaining_lbs == 500.00 (restored to full)"

      - name: distribution_event_branch_pack_vs_void
        grounds:
          - state_machines.DistributionEvent.PLANNED_to_PACKED
          - state_machines.DistributionEvent.PLANNED_to_VOIDED
          - state_machines.DistributionEvent.PACKED_to_VOIDED
        distinguishing_aspect: |
          DistributionEvent branches from PLANNED to {PACKED, VOIDED} with divergent side-effect
          sets (pack computes planned_lbs and marks lines PACKED; void leaves lines untouched),
          a branching fork on a different entity than the cyclic AgencyOrder machine.
        test_recipe:
          setup:
            - "A planned event whose order is approved and household certified."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 500, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry E", service_area: "County-5", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W28", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 200 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /distribution-events/${ev_id}/void"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { st: $.data.status, planned: $.data.planned_lbs }
          assert:
            - "DistributionEvent.status == VOIDED"
            - "DistributionEvent.planned_lbs == 0.00 (void of a PLANNED event computes nothing)"
            - "OrderLine.line_status == RESERVED (untouched by void)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_depth3_lot_order_agency_ledger
        grounds:
          - state_machines.DistributionEvent.PACKED_to_FINALIZED
          - state_machines.InventoryLot.RESERVED_to_DEPLETED
          - state_machines.AgencyOrder.APPROVED_to_FULFILLED
          - entities.Agency.fields.lifetime_distributed_lbs
        distinguishing_aspect: |
          Depth-3 chain originating from event finalize: finalize mutates the DistributionEvent
          (PACKED->FINALIZED), which depletes the reserved InventoryLot (RESERVED->DEPLETED),
          which fulfills the AgencyOrder (APPROVED->FULFILLED), which bumps Agency
          lifetime_distributed_lbs — each link caused by the prior link.
        test_recipe:
          setup:
            - "A packed event (planned 200) whose order reserved 200 lbs from a single PRODUCE lot."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 200, expiration_date: "2026-07-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /agencies"
              payload: { name: "Pantry F", service_area: "County-6", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W29", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_id}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 200 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { order_id: $.data.id }
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 1, monthly_income_cents: 100000 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id }
            - call: "POST /client-households/${hh_id}/certify"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /distribution-events"
              payload: { agency_order_id: "${order_id}", client_household_id: "${hh_id}" }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /distribution-events/${ev_id}/pack"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /distribution-events/${ev_id}/finalize"
              payload: { actual_distributed_lbs: 200 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
          assert:
            - "DistributionEvent.status == FINALIZED"
            - "InventoryLot.${lot_id}.disposition == DEPLETED"
            - "AgencyOrder.${order_id}.status == FULFILLED"
            - "Agency.${agency_id}.lifetime_distributed_lbs == 200.00"

      - name: clock_expiry_depth2_lot_then_coldstorage
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_EXPIRED
          - entities.ColdStorageUnit.fields.stored_lbs
          - calculations.cold_storage_occupancy
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (clock advance, not finalize): the shelf-life
          sweep transitions an AVAILABLE lot to EXPIRED, and that lot leaving occupancy
          recomputes the holding ColdStorageUnit.stored_lbs downward.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. One PRODUCE lot of 300 lbs expiring 2026-06-15 in a 5000-lb cooler (stored 300)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FoodBankOperator
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 5000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-06-15T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00.000Z" }
              as: FoodBankOperator
          assert:
            - "InventoryLot.${lot_id}.disposition == EXPIRED"
