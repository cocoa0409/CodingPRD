  # ---- Photo / capture & match ----
  - method: POST
    path: "/api/photos"
    description: "Capture a photo (UNMATCHED) with slate candidate fields"
    roles: [StudioPhotographer]
    code: 201
    input: [picture_day_session_id, candidate_name, candidate_grade, candidate_homeroom]
    output: Photo
    side_effects: ["status=UNMATCHED; match_confidence_score=0"]

  - method: GET
    path: "/api/photos"
    description: "List photos (filter by session, matched student, retake lineage, status)"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?", "matched_student_id?", "retake_of_photo_id?", "status?"]
    output: "Photo[]"
    side_effects: []

  - method: GET
    path: "/api/photos/{id}"
    description: "Get a photo"
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk, Guardian]
    code: 200
    input: []
    output: Photo
    side_effects: []

  - method: POST
    path: "/api/photos/{id}/match"
    description: "Auto-match a captured photo to a student (selector + threshold)"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: Photo
    side_effects: ["matched_student_id, match_confidence_score set; Student ENROLLED -> PHOTOGRAPHED; Photo UNMATCHED -> MATCHED"]

  - method: POST
    path: "/api/photos/{id}/approve"
    description: "Approve a photo for gallery/yearbook"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: Photo
    side_effects: ["Photo MATCHED/RETAKEN -> APPROVED"]

  # ---- PhotoOrder / ordering ----
  - method: POST
    path: "/api/photo-orders"
    description: "Create an order (CART) for a student"
    roles: [Guardian]
    code: 201
    input: [picture_day_session_id, student_id]
    output: PhotoOrder
    side_effects: ["status=CART; all money fields 0"]

  - method: GET
    path: "/api/photo-orders"
    description: "List orders (filter by session/student/status)"
    roles: [SchoolCoordinator, FulfillmentClerk, Guardian]
    code: 200
    input: ["limit?", "offset?", "picture_day_session_id?", "student_id?", "status?"]
    output: "PhotoOrder[]"
    side_effects: []

  - method: GET
    path: "/api/photo-orders/{id}"
    description: "Get an order"
    roles: [SchoolCoordinator, FulfillmentClerk, Guardian]
    code: 200
    input: []
    output: PhotoOrder
    side_effects: []

  - method: POST
    path: "/api/order-lines"
    description: "Add a line item to a CART order"
    roles: [Guardian]
    code: 201
    input: [photo_order_id, package_item_id, quantity]
    output: OrderLine
    side_effects: ["unit_price_cents snapshot; line_total_cents computed; order has_premium_line recomputed"]

  - method: GET
    path: "/api/order-lines"
    description: "List line items (filter by order or package item)"
    roles: [SchoolCoordinator, FulfillmentClerk, Guardian]
    code: 200
    input: ["limit?", "offset?", "photo_order_id?", "package_item_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/api/order-lines/{id}"
    description: "Get an order line"
    roles: [SchoolCoordinator, FulfillmentClerk, Guardian]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/api/photo-orders/{id}/submit"
    description: "Submit a cart order; freezes totals"
    roles: [Guardian]
    code: 200
    input: []
    output: PhotoOrder
    side_effects: ["order_total computed; status CART -> SUBMITTED"]

  - method: POST
    path: "/api/photo-orders/{id}/pay"
    description: "Record payment on a submitted order"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: PhotoOrder
    side_effects: ["status SUBMITTED -> PAID; provisional commission accrued; session total_merchandise_cents and school_commission_balance_cents updated"]

  - method: POST
    path: "/api/photo-orders/{id}/reject"
    description: "Reject a submitted order"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: PhotoOrder
    side_effects: ["status SUBMITTED -> REJECTED"]

  - method: POST
    path: "/api/photo-orders/{id}/cancel"
    description: "Cancel a CART or SUBMITTED order"
    roles: [Guardian]
    code: 200
    input: []
    output: PhotoOrder
    side_effects: ["status -> CANCELLED"]

  # ---- RetouchOrder / retouch & retake ----
  - method: POST
    path: "/api/retouch-orders"
    description: "Create a retouch or retake-day request against a photo"
    roles: [StudioPhotographer]
    code: 201
    input: [photo_id, kind, "adjustment_count?"]
    output: RetouchOrder
    side_effects: ["retouch_cost computed (gross/comp/net); status=REQUESTED; for kind=RETAKE the photo MATCHED -> RETAKE_REQUESTED"]

  - method: GET
    path: "/api/retouch-orders"
    description: "List retouch orders (filter by photo, replacement photo, or status)"
    roles: [SchoolCoordinator, StudioPhotographer]
    code: 200
    input: ["limit?", "offset?", "photo_id?", "replacement_photo_id?", "status?"]
    output: "RetouchOrder[]"
    side_effects: []

  - method: GET
    path: "/api/retouch-orders/{id}"
    description: "Get a retouch order"
    roles: [SchoolCoordinator, StudioPhotographer]
    code: 200
    input: []
    output: RetouchOrder
    side_effects: []

  - method: POST
    path: "/api/retouch-orders/{id}/approve"
    description: "Approve a retouch order (reserves credit)"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: RetouchOrder
    side_effects: ["status REQUESTED -> APPROVED; net_cost_cents reserved against retouch_credit_balance_cents"]

  - method: POST
    path: "/api/retouch-orders/{id}/complete"
    description: "Complete an approved retouch/retake"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: RetouchOrder
    side_effects: ["status APPROVED -> DONE; for RETAKE: photo RETAKE_REQUESTED -> RETAKEN, replacement Photo created, replacement_photo_id set, credit finalized"]

  - method: POST
    path: "/api/retouch-orders/{id}/reject"
    description: "Reject a requested retouch order"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: RetouchOrder
    side_effects: ["status REQUESTED -> REJECTED; for RETAKE: photo RETAKE_REQUESTED -> MATCHED"]

  - method: POST
    path: "/api/retouch-orders/{id}/cancel"
    description: "Cancel a requested/approved retouch order"
    roles: [StudioPhotographer]
    code: 200
    input: []
    output: RetouchOrder
    side_effects: ["status -> CANCELLED; if APPROVED credit released; for RETAKE: photo RETAKE_REQUESTED -> MATCHED"]

  # ---- Shipment / distribution ----
  - method: POST
    path: "/api/shipments"
    description: "Create a shipment for a PAID order"
    roles: [FulfillmentClerk]
    code: 201
    input: [photo_order_id, carrier, distribution_method, "tracking_code?"]
    output: Shipment
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/api/shipments"
    description: "List shipments (filter by order/status)"
    roles: [SchoolCoordinator, FulfillmentClerk]
    code: 200
    input: ["limit?", "offset?", "photo_order_id?", "status?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/api/shipments/{id}"
    description: "Get a shipment"
    roles: [SchoolCoordinator, FulfillmentClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: PUT
    path: "/api/shipments/{id}"
    description: "Update a PENDING shipment (e.g. set tracking_code)"
    roles: [FulfillmentClerk]
    code: 200
    input: ["carrier?", "distribution_method?", "tracking_code?"]
    output: Shipment
    side_effects: ["fields updated only while PENDING"]

  - method: POST
    path: "/api/shipments/{id}/dispatch"
    description: "Dispatch a shipment (fulfills the order)"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status PENDING -> DISPATCHED; linked order PAID -> FULFILLED"]

  - method: POST
    path: "/api/shipments/{id}/deliver"
    description: "Mark a shipment delivered"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status DISPATCHED -> DELIVERED"]

  - method: POST
    path: "/api/shipments/{id}/void"
    description: "Void a pending shipment"
    roles: [FulfillmentClerk]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status PENDING -> VOIDED"]

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SchoolCoordinator, StudioPhotographer, FulfillmentClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Guardian X-User-ID does not match the target Student's guardian_user_id" }
  # request validation
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid body field, bad enum, quantity<1, adjustment_count<0, base_price_cents<=0, end_minute<=start_minute, or duplicate sku within session" }
  # not found
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "PictureDaySession id not found" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id not found" }
  - { id: ERR_PHOTO_NOT_FOUND, http: 404, condition: "Photo id not found" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PackageItem id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "PhotoOrder id not found" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "OrderLine id not found" }
  - { id: ERR_RETOUCH_NOT_FOUND, http: 404, condition: "RetouchOrder id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id not found" }
  - { id: ERR_BACKDROP_NOT_FOUND, http: 404, condition: "Backdrop id not found" }
  - { id: ERR_PHOTOGRAPHER_NOT_FOUND, http: 404, condition: "Photographer id not found" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "CaptureSlot id not found" }
  # session posture / lifecycle
  - { id: ERR_EMPTY_ROSTER, http: 409, condition: "lock-roster with zero students" }
  - { id: ERR_EMPTY_CATALOG, http: 409, condition: "open-capture with no active PackageItem" }
  - { id: ERR_CAPTURE_INCOMPLETE, http: 409, condition: "open-gallery while some Student still ENROLLED" }
  - { id: ERR_RETAKE_PENDING, http: 409, condition: "open-gallery while a Photo is RETAKE_REQUESTED" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "close-ordering while a PhotoOrder is SUBMITTED" }
  - { id: ERR_UNSHIPPED_ORDERS, http: 409, condition: "settle while a PAID order has no non-VOIDED Shipment" }
  - { id: ERR_PAID_ORDERS_EXIST, http: 409, condition: "cancel session while a PhotoOrder is PAID/FULFILLED" }
  - { id: ERR_SESSION_NOT_CAPTURING, http: 409, condition: "capture/match/mark-absent/slot-complete while session not CAPTURE_OPEN" }
  - { id: ERR_SESSION_NOT_ORDERING, http: 409, condition: "order submit while session not GALLERY_OPEN" }
  - { id: ERR_SESSION_NOT_GALLERY, http: 409, condition: "photo approve while session not GALLERY_OPEN" }
  - { id: ERR_SESSION_NOT_RETAKEABLE, http: 409, condition: "retake creation while session not CAPTURE_OPEN/GALLERY_OPEN" }
  - { id: ERR_INVALID_SESSION_TRANSITION, http: 409, condition: "session lifecycle transition from a state that does not permit it" }
  # entity state
  - { id: ERR_STUDENT_ALREADY_PHOTOGRAPHED, http: 409, condition: "mark-absent on a non-ENROLLED student" }
  - { id: ERR_PHOTO_NOT_RETAKEABLE, http: 409, condition: "retake creation on a photo not in MATCHED" }
  - { id: ERR_PHOTO_NOT_APPROVABLE, http: 409, condition: "approve a photo not in MATCHED/RETAKEN" }
  - { id: ERR_ORDER_NOT_SUBMITTED, http: 409, condition: "pay/reject an order not in SUBMITTED" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "dispatch a shipment whose order is not PAID" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel an order not in CART/SUBMITTED" }
  - { id: ERR_ORDER_NOT_CART, http: 409, condition: "add a line to an order not in CART" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "submit an order with no lines" }
  - { id: ERR_RETOUCH_NOT_APPROVED, http: 409, condition: "complete a retouch order not in APPROVED" }
  - { id: ERR_RETOUCH_NOT_REQUESTED, http: 409, condition: "reject a retouch order not in REQUESTED" }
  - { id: ERR_RETOUCH_NOT_CANCELLABLE, http: 409, condition: "cancel a retouch order not in REQUESTED/APPROVED" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHED, http: 409, condition: "deliver a shipment not in DISPATCHED" }
  - { id: ERR_SHIPMENT_NOT_VOIDABLE, http: 409, condition: "void a shipment not in PENDING" }
  - { id: ERR_TRACKING_REQUIRED, http: 409, condition: "dispatch a shipment with no tracking_code" }
  - { id: ERR_SLOT_NOT_SCHEDULED, http: 409, condition: "complete a capture slot not in SCHEDULED" }
  - { id: ERR_SLOT_NOT_CANCELLABLE, http: 409, condition: "cancel a capture slot not in SCHEDULED" }
  # business gates
  - { id: ERR_NO_MATCH_CANDIDATE, http: 422, condition: "no ENROLLED student scores >= MATCH_AUTO_THRESHOLD" }
  - { id: ERR_GALLERY_ACCESS_DENIED, http: 403, condition: "wrong access_code or current clock >= gallery_closes_at" }
  - { id: ERR_INSUFFICIENT_RETOUCH_CREDIT, http: 402, condition: "retouch approval net_cost_cents exceeds session retouch_credit_balance_cents" }
  - { id: ERR_BACKDROP_DOUBLE_BOOKED, http: 409, condition: "capture slot overlaps a SCHEDULED slot on the same backdrop (half-open intervals)" }
  - { id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED, http: 409, condition: "capture slot within PHOTOGRAPHER_BUFFER_MIN of a SCHEDULED slot on the same photographer (buffer-inflated overlap)" }
  # concurrency
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_picture_day_session_version != PictureDaySession.version on settle" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolCoordinator
    description: "School-side owner of the session lifecycle, roster, catalog, scheduling resources, photo approval, gallery, yearbook, and settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/picture-day-sessions"
      - "POST /api/picture-day-sessions/{id}/lock-roster"
      - "POST /api/picture-day-sessions/{id}/open-gallery"
      - "POST /api/picture-day-sessions/{id}/close-ordering"
      - "POST /api/picture-day-sessions/{id}/settle"
      - "POST /api/picture-day-sessions/{id}/cancel"
      - "GET /api/picture-day-sessions/{id}/yearbook-export"
      - "POST /api/students"
      - "POST /api/packages"
      - "POST /api/backdrops"
      - "POST /api/photographers"
      - "POST /api/capture-slots"
      - "POST /api/photos/{id}/approve"
    shared_operations:
      - "GET endpoints on sessions, students, packages, photos, orders, order-lines, retouch-orders, shipments, backdrops, photographers, capture-slots"
      - "GET /api/picture-day-sessions/{id}/gallery"

  - name: StudioPhotographer
    description: "Studio-side owner of capture, matching, retouch and retake-day workflow and capture-slot execution"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/picture-day-sessions/{id}/open-capture"
      - "POST /api/students/{id}/mark-absent"
      - "POST /api/photos"
      - "POST /api/photos/{id}/match"
      - "POST /api/capture-slots/{id}/complete"
      - "POST /api/capture-slots/{id}/cancel"
      - "POST /api/retouch-orders"
      - "POST /api/retouch-orders/{id}/approve"
      - "POST /api/retouch-orders/{id}/complete"
      - "POST /api/retouch-orders/{id}/reject"
      - "POST /api/retouch-orders/{id}/cancel"
    shared_operations:
      - "GET endpoints on sessions, students, packages, photos, retouch-orders, backdrops, photographers, capture-slots"
      - "GET /api/picture-day-sessions/{id}/gallery"
      - "POST /api/_clock/set_current_utc"

  - name: FulfillmentClerk
    description: "Back-office owner of payment, shipping and distribution"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/photo-orders/{id}/pay"
      - "POST /api/photo-orders/{id}/reject"
      - "POST /api/shipments"
      - "PUT /api/shipments/{id}"
      - "POST /api/shipments/{id}/dispatch"
      - "POST /api/shipments/{id}/deliver"
      - "POST /api/shipments/{id}/void"
    shared_operations:
      - "GET endpoints on sessions, students, packages, photos, orders, order-lines, shipments, backdrops, photographers, capture-slots"
      - "GET /api/picture-day-sessions/{id}/gallery"
      - "POST /api/_clock/set_current_utc"

  - name: Guardian
    description: "Parent/guardian; places and manages orders for their own student and views the gallery"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /api/photo-orders"
      - "POST /api/order-lines"
      - "POST /api/photo-orders/{id}/submit"
      - "POST /api/photo-orders/{id}/cancel"
    shared_operations:
      - "GET /api/photo-orders, GET /api/photo-orders/{id}, GET /api/order-lines (own orders)"
      - "GET /api/picture-day-sessions/{id}/gallery"
      - "GET /api/packages, GET /api/packages/{id}"
      - "GET /api/students/{id} (own student)"
      - "GET /api/photos/{id}"
