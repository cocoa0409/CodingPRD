  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: review_blocked_when_household_proof_unverified
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_UNDER_REVIEW
          - entities.Household.fields.proof_status
          - errors[ERR_PROOF_NOT_VERIFIED]
        distinguishing_aspect: "PermitApplication.SUBMITTED->UNDER_REVIEW depends on Household.proof_status==VERIFIED; with proof UNVERIFIED the review fails with ERR_PROOF_NOT_VERIFIED — entity pair PermitApplication->Household."
        test_recipe:
          setup:
            - "Zone, household (proof still UNVERIFIED — no proof reviewed), one vehicle, one SUBMITTED application."
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "CE1 Zone", zone_code: "RPZ-CE1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id } }
