  - rule_id: non_linear_state_machine
    instances:
      - name: food_batch_quarantine_reinspection_cycle
        grounds:
          - state_machines.FoodBatch.QUARANTINED_to_INSPECTING
          - state_machines.FoodBatch.INSPECTING_to_QUARANTINED
        distinguishing_aspect: |
          FoodBatch machine is cyclic: RECEIVED -> INSPECTING -> QUARANTINED ->
          INSPECTING -> ACCEPTED; a failed inspection does not terminate the
          batch — after a SAFETY_DISCARD waste log, re-inspection can pass and
          the batch becomes allocatable with reduced remaining_servings.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00Z; site S; DONATION batch B quantity 30, use_by 2026-08-30."
            - "B has failed one inspection (QUARANTINED) and a SAFETY_DISCARD WasteLog of 10 servings recorded."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "West Kitchen", dine_in_capacity: 40, togo_capacity_per_window: 20, delivery_radius_km: 5 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /kitchen/food-batches"
              payload: { site_id: "${site_id}", source_type: "DONATION", item_description: "Canned soup", quantity_servings: 30, received_at: "2026-08-10T07:00:00Z", use_by: "2026-08-30T00:00:00Z" }
              as: KitchenManager
              captures: { batch_id: $.data.id }
            - call: "POST /kitchen/food-batches/${batch_id}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${batch_id}/record-inspection"
              payload: { result: "FAILED" }
              as: FoodSafetyOfficer
            - call: "POST /kitchen/menu-days"
              payload: { site_id: "${site_id}", service_date: "2026-08-11" }
              as: KitchenManager
              captures: { md_id: $.data.id }
            - call: "POST /kitchen/waste-logs"
              payload: { menu_day_id: "${md_id}", food_batch_id: "${batch_id}", servings_wasted: 10, reason: "SAFETY_DISCARD", disposition: "DISCARD" }
              as: FoodSafetyOfficer
          trigger:
            - call: "POST /kitchen/food-batches/${batch_id}/begin-inspection"
              payload: {}
              as: FoodSafetyOfficer
            - call: "POST /kitchen/food-batches/${batch_id}/record-inspection"
