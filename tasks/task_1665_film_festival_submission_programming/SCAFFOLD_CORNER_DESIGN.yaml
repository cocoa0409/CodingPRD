            - { call: "POST /festival/venues", payload: { edition_id: "00000000-0000-0000-0000-000000000000", name: "V", seat_capacity: 1, formats_supported: [DCP_2K] }, as: AWARDS_ADMIN, captures: { e7: $.data.error_id } }
          assert:
            - "all seven: error_id == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: rbac_shared_read_spotcheck
        claim_type: satisfaction_pass
        grounds:
          - "roles"
          - "endpoints.\"GET /festival/editions/{id}\""
        distinguishing_aspect: "All nine authenticated roles may read an edition; PUBLIC is a declared role but is NOT in the read roles and gets 403."
        test_recipe:
          setup: ["one edition exists"]
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
          trigger:
            - { call: "GET /festival/editions/${ed}", payload: {}, as: PROGRAMMER, as_user_id: "p-x", captures: { ok1: $.data.id } }
            - { call: "GET /festival/editions/${ed}", payload: {}, as: JUROR, as_user_id: "j-x", captures: { ok2: $.data.id } }
            - { call: "GET /festival/editions/${ed}", payload: {}, as: TRAVEL_COORDINATOR, captures: { ok3: $.data.id } }
            - { call: "GET /festival/editions/${ed}", payload: {}, as: PUBLIC, captures: { err: $.data.error_id } }
          assert:
            - "ok1 == ok2 == ok3 == ${ed} (shared read)"
            - "PUBLIC read denied: err == ERR_UNAUTHORIZED_ROLE"

