  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: election_window_half_open_intervals_allow_adjacency_reject_straddle
        grounds:
          - validations[priority=68]
          - errors.ERR_ELECTION_WINDOW_OVERLAP
          - endpoints.POST_/benefits/election-windows
          - entities.ElectionWindow.fields.opens_at
          - entities.ElectionWindow.fields.cutoff_at
        distinguishing_aspect: |
          RESOURCE: the employer's election calendar. INTERVAL SEMANTICS: HALF-OPEN [opens_at,
          cutoff_at), so a window that starts exactly at another window's cutoff_at is LEGAL and two
          back-to-back months can be scheduled without a gap. Only a genuine straddle (2026-07-15 ->
          2026-08-15 across the 2026-08-01 seam) is rejected. An implementation using closed
          intervals wrongly rejects the adjacent August and October windows.
        test_recipe:
          setup:
            - "Employer 'Austin Calendar Co' is ACTIVE in US-TX-AUS with program_cap_cents 5000000 and one TRANSIT_PASS category."
            - "One SCHEDULED window W1 (benefit_month 2026-07) already occupies [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z); no other window exists."
            - "The clock is at its 2026-08-01T00:00:00Z default; window creation itself is not gated on the clock."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Austin Calendar Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-07", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { w1_id: $.data.id, w1_status: $.data.status }
          trigger:
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", cutoff_at: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { w2_id: $.data.id, w2_opens: $.data.opens_at }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-09", opens_at: "2026-07-15T00:00:00Z", cutoff_at: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { straddle_error: $.data.error_id }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", cutoff_at: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { w3_id: $.data.id, w3_opens: $.data.opens_at }
          assert:
            - "${w1_status} == SCHEDULED"
            - "${w2_opens} == 2026-08-01T00:00:00Z"
            - "the adjacent August window was created with HTTP 201 even though its opens_at equals W1's cutoff_at exactly"
            - "${straddle_error} == ERR_ELECTION_WINDOW_OVERLAP"
            - "the straddling attempt returned HTTP 409 (it satisfies new.opens_at 2026-07-15 < 2026-08-01 AND new.cutoff_at 2026-08-15 > 2026-07-01)"
            - "${w3_opens} == 2026-09-01T00:00:00Z"
            - "the October-facing window abutting W2's cutoff_at was also created with HTTP 201"
            - "exactly three ElectionWindow rows exist for employer ${er_id}"

      - name: media_coverage_closed_intervals_reject_touching_endpoints
        grounds:
          - validations[priority=70]
          - errors.ERR_MEDIA_COVERAGE_OVERLAP
          - endpoints.POST_/benefits/media-orders
          - entities.MediaOrder.fields.coverage_start_at
          - entities.MediaOrder.fields.coverage_end_at
        distinguishing_aspect: |
          A DIFFERENT RESOURCE (the physical (employee, transit_media) pass, not the employer
          calendar) with the OPPOSITE interval semantics: coverage is CLOSED
          [coverage_start_at, coverage_end_at], so touching endpoints COLLIDE - a second order whose
          coverage_start_at equals the first order's coverage_end_at exactly must be rejected, and
          only moving the start one second later is accepted. This is the exact inverse of the
          adjacency verdict in instance 1, so an implementation sharing one overlap helper fails one
          of the two.
        test_recipe:
          setup:
            - "The clock is moved to 2026-07-15T00:00:00Z so the July window is still inside its cutoff."
            - "Employer 'Seattle Pass Coverage Co' is ACTIVE in US-WA-SEA with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and program_cap_cents 5000000; one TRANSIT_PASS category and one ACTIVE US-WA-SEA SMART_CARD_LOAD product at unit_price_cents 4000 exist."
