      # --- state_machines rows delegated to §1.8 ------------------------------
      - name: application_decision_and_disclosure_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.CreditApplication
          - entities.CreditApplication.fields.disclosure_status
        excluded_because:
          difficulty_instance: application_decision_and_disclosure_dimensions_evolve_independently
          rationale: "The §1.8 instance already walks both dimensions of the CreditApplication machine through every legal combination (APPROVED x NOT_DELIVERED / DELIVERED / ACKNOWLEDGED and ACTIVATED x ACKNOWLEDGED) and proves the decision dimension never moves when the disclosure dimension does."

      - name: milestone_reclaim_cycle_is_unbounded_and_counted
        claim_type: cyclic
        grounds:
          - state_machines.ProjectMilestone.REJECTED_to_CLAIMED
          - entities.ProjectMilestone.fields.rejection_count
        excluded_because:
          difficulty_instance: milestone_claim_reject_reclaim_cycle_counts_rounds
          rationale: "The §1.8 instance drives three full CLAIM -> REJECT -> CLAIM rounds, asserts rejection_count 1/2/3 and shows the loop has no termination condition, which subsumes a single-lap cyclic check."

      - name: settlement_and_denial_are_a_two_branch_fork
        claim_type: branching
        grounds:
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
          - state_machines.FundingDraw.REQUESTED_to_DENIED
        excluded_because:
          difficulty_instance: funding_draw_settle_versus_deny_fork_has_divergent_side_effect_sets
          rationale: "The §1.8 instance runs two identical draws down the SETTLE and the DENY branch and diffs the full side-effect sets (ledger, reserve, volume, project headroom), which is strictly stronger than checking that each branch is reachable."

      - name: settlement_syncs_the_loan_and_merchant_ledgers
        claim_type: ledger_sync
        grounds:
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
          - calculations.draw_settlement_economics
        excluded_because:
          difficulty_instance: draw_provisional_versus_final_settlement_divergence
          rationale: "The §1.8 instance reconciles every LEDGER SYNC field before and after settlement against the FINAL variant literals, so a separate before/after ledger reconciliation would duplicate it."

      - name: draw_reversal_compensates_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.FundingDraw.SETTLED_to_REVERSED
        excluded_because:
          difficulty_instance: draw_reversal_restores_the_funding_ledger_with_no_drift
          rationale: "The §1.8 instance reverses a settled draw and asserts principal, total_funded, funded_volume, reserve, target, coverage, project funded_pct and milestone.is_funded all return to their pre-draw literals with zero drift."

      - name: draw_creation_depends_on_the_merchants_enrollment_state
        claim_type: cross_entity
        grounds:
          - state_machines.FundingDraw.REQUESTED_to_SETTLED
          - validations[priority=14]
        excluded_because:
          difficulty_instance: draw_creation_gated_on_merchant_enrollment_state
          rationale: "The §1.8 instance sweeps draw creation across the merchant's APPROVED, SUSPENDED, reinstated-APPROVED and TERMINATED states, covering the cross-entity dependency in every direction."

