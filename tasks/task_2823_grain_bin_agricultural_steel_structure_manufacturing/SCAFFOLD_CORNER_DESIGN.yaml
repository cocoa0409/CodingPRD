          assert:
            - "the doubly-unknown assign-crew returns HTTP 404 with error_id ERR_DEALER_ORDER_NOT_FOUND - the path id is resolved before the body FK"
            - "that rejection's envelope carries response_type error and a data object holding a non-empty error_id and a non-empty message, plus a meta object carrying api_request_id and api_request_timestamp"
            - "the same unknown path id with installation_crew_id omitted entirely returns HTTP 400 with error_id ERR_INVALID_REQUEST - request shape outranks both id lookups"
