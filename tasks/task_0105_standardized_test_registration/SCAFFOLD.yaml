# =============================================================================
# task_0105_standardized_test_registration — SCAFFOLD.yaml
# Standardized Test Registration Management (SAT / ACT / AP / CLEP)
# =============================================================================

scenario: |
  Standardized Test Registration Management (SAT/ACT/AP): test center capacity,
  accommodation requests (504/IEP), Super Score score reporting, tiered refund,
  Stand-by alternates, cross-state ID verification, CLEP credit recognition.

domain_name: standardized-test-registration
api_prefix: /test-events

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - tiered_pricing               # refund amount by days-before-test tier
    - waterfall_allocation         # standby promotion priority queue
    - selector_policy              # which standby candidate gets promoted
    - scheduled_deferred_actions   # registration deadlines, no-show sweep, accommodation auto-expiry
    - derived_field_reconciliation # TestCenterCapacity seat counters vs Registration aggregates
    - version_pinning_on_approval  # AccommodationRequest pins Registration version at APPROVE

  entity_topology: hybrid
  # Hybrid: TestEvent → TestCenterCapacity (hierarchical), Candidate flat,
  # Registration is a many-to-many junction with its own lifecycle, IDVerification/ScoreReport
  # are children of Registration. AccommodationRequest references Candidate + TestEvent flatly.

  state_machine_shape: branching          # branching + cyclic + compound; primary shape branching
  # AccommodationRequest is cyclic (NEEDS_MORE_INFO loop), Registration is branching
  # (STANDBY ↔ CONFIRMED via promotion + demotion), IDVerification is cyclic (REJECTED loop).

  relationship_patterns:
    one_to_many: true               # TestEvent → TestCenterCapacity, Registration → ScoreReport
    many_to_many: true               # Candidate × TestEvent (via Registration), Candidate × TestCenter via Registration
    self_referential: false
    polymorphic: false
    cross_aggregate: true            # ScoreReport from any past Registration feeds SuperScore for any future application

  role_model: segregation_of_duties
  # Candidate self-serves registration; AccommodationsOfficer reviews 504/IEP (separate from);
  # Proctor checks in / marks no-show; Registrar handles cancellations + overrides;
  # CreditsOfficer posts CLEP credit awards. Same person cannot both submit and approve an
  # accommodation; Proctor cannot cancel or refund; Registrar cannot post credit.

  consistency_model: immediate
  # All seat-count, refund, and standby-promotion side effects complete inside the triggering
  # request or the explicit sweep endpoint — no eventual consistency.

# =============================================================================
# 1.0 Response Envelope (FIXED — DO NOT EDIT)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TestEvent
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: test_type, type: enum, source: input, description: "SAT | ACT | AP | CLEP", constraints: "immutable after creation" }
      - { name: form_code, type: string, source: input, description: "Test form code (e.g., 'SAT-2026-MAR-A'); unique per test_type" }
      - { name: subject, type: string, source: input, description: "Subject for AP/CLEP (e.g., 'AP_CALC_BC', 'CLEP_COLLEGE_ALGEBRA'); null for SAT/ACT" }
      - { name: test_date, type: datetime, source: input, description: "ISO 8601 UTC scheduled start of the test session" }
      - { name: registration_deadline, type: datetime, source: input, description: "ISO 8601 UTC last instant registrations may be created without the late_fee surcharge" }
      - { name: late_registration_deadline, type: datetime, source: input, description: "ISO 8601 UTC last instant late registrations are accepted; after this REGISTRATION_CLOSED transition fires" }
      - { name: score_release_date, type: datetime, source: input, description: "ISO 8601 UTC when SCORES_PENDING → COMPLETED auto-fires" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base registration fee in USD cents" }
      - { name: late_fee_cents, type: integer, source: input, description: "Surcharge in USD cents added when registering between registration_deadline and late_registration_deadline" }
      - { name: status, type: enum, source: system, description: "REGISTRATION_OPEN | REGISTRATION_CLOSED | SCORES_PENDING | COMPLETED", default: "REGISTRATION_OPEN" }

  - name: TestCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Test center display name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code (e.g., 'CA', 'NY'); used by cross-state ID verification rule" }
      - { name: timezone, type: string, source: input, description: "IANA timezone (e.g., 'America/Los_Angeles')" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: TestCenterCapacity
    parent: TestEvent
    common_fields: true
    fields:
      - { name: test_event_id, type: string, source: system, description: "Parent TestEvent.id" }
      - { name: test_center_id, type: string, source: input, description: "TestCenter.id; (test_event_id, test_center_id) is unique" }
      - { name: total_capacity, type: integer, source: input, description: "Total physical seats at this center for this event; must be >= accommodation_capacity" }
      - { name: accommodation_capacity, type: integer, source: input, description: "Subset of total_capacity reserved for APPROVED accommodation candidates; cannot be filled by non-accommodation registrations" }
      - { name: confirmed_seats_used, type: integer, source: computed, description: "Count of Registration where test_event_id=this AND test_center_id=this AND status IN {CONFIRMED, CHECKED_IN, COMPLETED}", default: 0 }
      - { name: accommodation_seats_used, type: integer, source: computed, description: "Subset of confirmed_seats_used where accommodation_required=true (must match COUNT of AccommodationRequest.APPROVED tied to those Registrations)", default: 0 }
      - { name: standby_seats_pending, type: integer, source: computed, description: "Count of Registration where status=STANDBY for this (event, center)", default: 0 }
      - { name: available_seats, type: integer, source: computed, description: "total_capacity - confirmed_seats_used; invariant: available_seats >= 0" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name as it appears on government ID" }
      - { name: email, type: string, source: input, description: "Unique per Candidate; used for X-User-ID resolution" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 date" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state code; compared against IDVerification.issuing_state_code for cross-state rule" }
      - { name: has_iep_or_504, type: boolean, source: input, default: false, description: "True if the candidate has a 504 plan or IEP on file from prior schools; enables accommodation eligibility" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "Candidate.id; (candidate_id, test_event_id) is unique across non-CANCELLED rows" }
      - { name: test_event_id, type: string, source: input, description: "TestEvent.id" }
      - { name: test_center_id, type: string, source: input, description: "TestCenter.id; must have a TestCenterCapacity row for this test_event_id" }
      - { name: status, type: enum, source: system, description: "STANDBY | CONFIRMED | CHECKED_IN | NO_SHOW | COMPLETED | CANCELLED", default: "STANDBY" }
      - { name: registered_at, type: datetime, source: system, description: "ISO 8601 UTC instant the Registration row was created; used as the standby priority tie-breaker" }
      - { name: registration_channel, type: enum, source: system, description: "SELF_INITIATED | OFFICIAL_CANCELLATION; SELF_INITIATED set when a Candidate cancels, OFFICIAL_CANCELLATION set when a Registrar cancels — drives tiered_refund_amount variant", default: "SELF_INITIATED" }
      - { name: accommodation_required, type: boolean, source: computed, default: false, description: "True iff there exists an AccommodationRequest with candidate_id=this.candidate_id, test_event_id=this.test_event_id, status=APPROVED" }
      - { name: base_fee_cents_charged, type: integer, source: computed, description: "Snapshot of TestEvent.base_fee_cents at registration creation" }
      - { name: late_fee_cents_charged, type: integer, source: computed, description: "TestEvent.late_fee_cents if registered_at > TestEvent.registration_deadline, else 0" }
      - { name: accommodation_fee_cents_charged, type: integer, source: computed, description: "Non-refundable accommodation processing fee added when accommodation_required becomes true; constant ACCOMMODATION_FEE_CENTS (see calculations.tiered_refund_amount.constants)", default: 0 }
      - { name: amount_charged_cents, type: integer, source: computed, description: "base_fee_cents_charged + late_fee_cents_charged + accommodation_fee_cents_charged" }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "SUM of RefundTransaction.amount_cents where registration_id=this.id; 0 until cancellation", default: 0 }
      - { name: amount_retained_cents, type: integer, source: computed, description: "amount_charged_cents - amount_refunded_cents; the compensating-invariant check for the money cascade", default: 0 }
      - { name: standby_promotion_eligibility_at, type: datetime, source: computed, description: "registered_at + STANDBY_VISIBILITY_DELAY_SECONDS; standby cannot be promoted before this instant", default: null }
      - { name: locked_accommodation_request_version, type: integer, source: computed, description: "Pinned AccommodationRequest.version captured when accommodation_required flipped true; null otherwise", default: null }

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "Candidate.id; Candidate.has_iep_or_504 MUST be true" }
      - { name: test_event_id, type: string, source: input, description: "TestEvent.id; one row per (candidate_id, test_event_id) across non-EXPIRED rows" }
      - { name: requested_accommodations, type: array, source: input, description: "Array of enum values from {EXTENDED_TIME_50, EXTENDED_TIME_100, BREAKS_EXTENDED, READER, SCRIBE, LARGE_PRINT}" }
      - { name: supporting_documents, type: array, source: input, description: "Array of document URIs / identifiers; minimum one entry required to leave SUBMITTED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | NEEDS_MORE_INFO | APPROVED | DENIED | EXPIRED", default: "SUBMITTED" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the AccommodationsOfficer who first moved status off SUBMITTED; pinned for segregation-of-duties on subsequent reviews", default: null }
      - { name: submission_deadline_at, type: datetime, source: computed, description: "TestEvent.registration_deadline - ACCOMMODATION_LEAD_DAYS; SUBMIT after this instant is rejected" }
      - { name: review_deadline_at, type: datetime, source: computed, description: "submission_deadline_at + ACCOMMODATION_REVIEW_WINDOW_DAYS; status auto-flips to EXPIRED if still in {SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO} at the no-show sweep that runs after this instant" }

  - name: IDVerification
    parent: Registration
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "Parent Registration.id; one IDVerification per Registration" }
      - { name: id_document_type, type: enum, source: input, description: "DRIVERS_LICENSE | STATE_ID | PASSPORT | SCHOOL_ID_WITH_PHOTO" }
      - { name: issuing_state_code, type: string, source: input, description: "Two-letter US state code; ignored when id_document_type=PASSPORT" }
      - { name: id_expires_on, type: datetime, source: input, description: "Document expiration date (ISO 8601 date); must be > TestEvent.test_date" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED | DOCS_SUBMITTED | CLEARED | REJECTED", default: "NOT_STARTED" }
      - { name: rejection_reason, type: string, source: system, description: "Free-text reason set when status transitions to REJECTED", default: null }
      - { name: cross_state_override_granted, type: boolean, source: system, description: "True iff a Registrar used the override endpoint after an issuing-state mismatch; trace flag for audit", default: false }

  - name: ScoreReport
    parent: Registration
    common_fields: false   # append-only: id + created_at only
    fields:
      - { name: registration_id, type: string, source: system, description: "Parent Registration.id; Registration MUST be in COMPLETED" }
      - { name: section_scores, type: object, source: input, description: "Map from section_name (string) to score (integer); keys are test_type-specific: SAT={'reading_writing','math'}, ACT={'english','math','reading','science'}, AP={'composite'}, CLEP={'composite'}" }
      - { name: total_score, type: integer, source: input, description: "Posted total/composite score; range depends on test_type (SAT 400–1600, ACT 1–36, AP 1–5, CLEP 20–80)" }
      - { name: report_type, type: enum, source: input, description: "OFFICIAL | RESCORED; if RESCORED is created, the prior OFFICIAL row for the same Registration is logically superseded (latest by created_at wins inside SuperScore selection)", default: "OFFICIAL" }

  - name: CLEPCreditAward
    parent: ScoreReport
    common_fields: false
    fields:
      - { name: score_report_id, type: string, source: system, description: "Parent ScoreReport.id; the parent TestEvent.test_type MUST be CLEP" }
      - { name: candidate_id, type: string, source: system, description: "Mirrored from Registration for query convenience" }
      - { name: credit_status, type: enum, source: system, description: "AWARDED | DENIED; AWARDED only when total_score >= ACE_RECOMMENDED_SCORE_BY_SUBJECT[ScoreReport.parent.test_event.subject]" }
      - { name: credit_units, type: integer, source: system, description: "Looked up from CLEP_CREDIT_UNITS_BY_SUBJECT[subject]; 0 when credit_status=DENIED" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of CreditsOfficer; required even on DENIED" }

  - name: RefundTransaction
    parent: Registration
    common_fields: false
    fields:
      - { name: registration_id, type: string, source: system, description: "Parent Registration.id; Registration MUST be in CANCELLED" }
      - { name: amount_cents, type: integer, source: computed, description: "Result of calculations.tiered_refund_amount evaluated at the cancellation instant; can be 0 but never negative" }
      - { name: tier_label, type: enum, source: computed, description: "FULL | PARTIAL_75 | PARTIAL_50 | NONE; the tier whose [days-before-test] window applied at cancellation" }
      - { name: refund_channel, type: enum, source: computed, description: "Mirrors Registration.registration_channel at cancellation: SELF_INITIATED | OFFICIAL_CANCELLATION" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TestEvent
    field: status
    initial_state: REGISTRATION_OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "system (POST /_clock/advance crosses TestEvent.late_registration_deadline)"
        actor: system
        preconditions:
          - "now() >= TestEvent.late_registration_deadline"
        side_effects:
          - "No new Registration may be created (ERR_REGISTRATION_CLOSED)"
          - "Existing STANDBY rows remain promotable until test_date via /_sweep/no-show-and-promote"

      - from: REGISTRATION_CLOSED
        to: REGISTRATION_OPEN
        trigger: "POST /test-events/{testEventId}/extend-deadline (Registrar override; at most once per TestEvent)"
        actor: Registrar
        preconditions:
          - "TestEvent.version field bumps by 1"
          - "Provided new_late_registration_deadline > now()"
          - "TestEvent has not previously been extended (audit invariant; tracked via a deadline_extensions_used counter set by side effect)"
        side_effects:
          - "TestEvent.late_registration_deadline := new value"
          - "Existing CANCELLED Registrations remain CANCELLED (no auto-reinstatement)"

      - from: REGISTRATION_CLOSED
        to: SCORES_PENDING
        trigger: "system (POST /_clock/advance crosses TestEvent.test_date + TEST_SESSION_HOURS)"
        actor: system
        preconditions:
          - "now() >= TestEvent.test_date + TEST_SESSION_HOURS"
          - "POST /_sweep/no-show-and-promote has been called for this TestEvent at least once after test_date"
        side_effects:
          - "All Registration.STANDBY rows on this TestEvent → CANCELLED with registration_channel=SELF_INITIATED and amount_refunded_cents := amount_charged_cents (full refund — they never sat)"
          - "All Registration.CHECKED_IN rows → COMPLETED"

      - from: SCORES_PENDING
        to: COMPLETED
        trigger: "system (POST /_clock/advance crosses TestEvent.score_release_date)"
        actor: system
        preconditions:
          - "now() >= TestEvent.score_release_date"
        side_effects:
          - "ScoreReport endpoints become writable"

  - entity: Registration
    field: status
    initial_state: STANDBY
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: STANDBY
        to: CONFIRMED
        trigger: "system (POST /test-events/{testEventId}/registrations creation when capacity is available) OR POST /_sweep/no-show-and-promote"
        actor: system
        preconditions:
          - "Either: TestCenterCapacity.available_seats > 0 at creation time, OR (sweep path) a seat freed by a sibling Registration moving to CANCELLED/NO_SHOW"
          - "If accommodation_required=true: TestCenterCapacity.accommodation_capacity - accommodation_seats_used > 0"
        side_effects:
          - "TestCenterCapacity.confirmed_seats_used += 1 (and accommodation_seats_used += 1 if accommodation_required)"
          - "TestCenterCapacity.standby_seats_pending -= 1 if this row had been STANDBY"

      - from: CONFIRMED
        to: STANDBY
        trigger: "system (AccommodationRequest.APPROVED applies retroactively but accommodation_capacity exhausted)"
        actor: system
        preconditions:
          - "AccommodationRequest for this (candidate_id, test_event_id) just transitioned to APPROVED"
          - "TestCenterCapacity.accommodation_capacity - accommodation_seats_used == 0"
        side_effects:
          - "Registration.accommodation_required := true"
          - "Registration.locked_accommodation_request_version := AccommodationRequest.version"
          - "TestCenterCapacity.confirmed_seats_used -= 1; standby_seats_pending += 1"
          - "Registration.accommodation_fee_cents_charged += ACCOMMODATION_FEE_CENTS; amount_charged_cents recomputed"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/check-in"
        actor: Proctor
        preconditions:
          - "now() is within [TestEvent.test_date - CHECK_IN_WINDOW_HOURS, TestEvent.test_date + CHECK_IN_GRACE_HOURS]"
          - "IDVerification.status = CLEARED (cross-entity dependency)"
          - "If AccommodationRequest exists for (candidate_id, test_event_id): its status MUST be APPROVED or DENIED (not pending) (cross-entity dependency)"
        side_effects:
          - "TestEvent attendance counter bumped (implicit through confirmed_seats_used invariant — no field change)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_sweep/no-show-and-promote (after test_date + CHECK_IN_GRACE_HOURS)"
        actor: system
        preconditions:
          - "now() > TestEvent.test_date + CHECK_IN_GRACE_HOURS"
          - "Registration.status = CONFIRMED"
        side_effects:
          - "TestCenterCapacity.confirmed_seats_used -= 1 (and accommodation_seats_used -= 1 if applicable)"
          - "Triggers standby_promotion_priority selector on the SAME (test_event_id, test_center_id) — chain depth 2"
          - "If sweep promotes a STANDBY row: that row → CONFIRMED, fee snapshot recomputed (no late_fee for standby promotions)"

      - from: [STANDBY, CONFIRMED]
        to: CANCELLED
        trigger: "DELETE /test-events/{testEventId}/registrations/{registrationId} (Candidate self-serve) OR POST /test-events/{testEventId}/registrations/{registrationId}/admin-cancel (Registrar)"
        actor: Candidate | Registrar
        preconditions:
          - "Registration.status IN {STANDBY, CONFIRMED}"
          - "TestEvent.status != COMPLETED"
        side_effects:
          - "registration_channel := SELF_INITIATED if Candidate path, OFFICIAL_CANCELLATION if Registrar path"
          - "calculations.tiered_refund_amount evaluated → RefundTransaction row appended (chain depth 1)"
          - "Registration.amount_refunded_cents := RefundTransaction.amount_cents; amount_retained_cents := amount_charged_cents - amount_refunded_cents"
          - "If was CONFIRMED: TestCenterCapacity.confirmed_seats_used -= 1 (and accommodation_seats_used -= 1 if accommodation_required) (chain depth 2)"
          - "If was STANDBY: TestCenterCapacity.standby_seats_pending -= 1"
          - "Standby promotion attempt fires for (test_event_id, test_center_id) using standby_promotion_priority selector (chain depth 3); promoted row STANDBY→CONFIRMED, its TestCenterCapacity.confirmed_seats_used += 1 (chain depth 4)"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (TestEvent → SCORES_PENDING transition)"
        actor: system
        preconditions: []
        side_effects:
          - "ScoreReport creation becomes legal for this Registration"

  - entity: AccommodationRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /accommodation-requests/{accommodationRequestId}/start-review"
        actor: AccommodationsOfficer
        preconditions:
          - "now() <= AccommodationRequest.review_deadline_at"
          - "supporting_documents is non-empty"
        side_effects:
          - "reviewer_user_id := X-User-ID of caller (pinned)"

      - from: UNDER_REVIEW
        to: NEEDS_MORE_INFO
        trigger: "POST /accommodation-requests/{accommodationRequestId}/request-info"
        actor: AccommodationsOfficer
        preconditions:
          - "X-User-ID == AccommodationRequest.reviewer_user_id (SOD: same officer who started review)"
        side_effects: []

      - from: NEEDS_MORE_INFO
        to: SUBMITTED
        trigger: "PATCH /accommodation-requests/{accommodationRequestId}/resubmit (Candidate adds supporting_documents)"
        actor: Candidate
        preconditions:
          - "X-User-ID == Candidate of the request"
          - "new supporting_documents entries appended (length increased)"
          - "now() <= review_deadline_at"
        side_effects: []
        note: "Cycle: SUBMITTED → UNDER_REVIEW → NEEDS_MORE_INFO → SUBMITTED → UNDER_REVIEW → APPROVED (covers the cycle requirement of rule_id non_linear_state_machine)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /accommodation-requests/{accommodationRequestId}/approve"
        actor: AccommodationsOfficer
        preconditions:
          - "X-User-ID == AccommodationRequest.reviewer_user_id"
          - "X-User-ID != X-User-ID that submitted the request (SOD enforcement: AccommodationsOfficer may not be the Candidate; enforced by role mismatch — Candidate cannot hold AccommodationsOfficer role)"
        side_effects:
          - "Triggers Registration accommodation_required flip TRUE for all Registration rows where (candidate_id, test_event_id) match (chain depth 1)"
          - "Registration.locked_accommodation_request_version := this.version"
          - "If TestCenterCapacity.accommodation_capacity - accommodation_seats_used == 0 on the matching center: CONFIRMED Registration → STANDBY (chain depth 2)"
          - "TestCenterCapacity counters reconciled (chain depth 3)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /accommodation-requests/{accommodationRequestId}/deny"
        actor: AccommodationsOfficer
        preconditions:
          - "X-User-ID == AccommodationRequest.reviewer_user_id"
        side_effects:
          - "Registration.accommodation_required stays false; check-in still legal"

      - from: [SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO]
        to: EXPIRED
        trigger: "POST /_sweep/no-show-and-promote (after review_deadline_at)"
        actor: system
        preconditions:
          - "now() > review_deadline_at"
        side_effects:
          - "Status implicitly equals DENIED for the purpose of Registration check-in rule, but flagged as EXPIRED for audit"

  - entity: IDVerification
    field: status
    initial_state: NOT_STARTED
    terminal_states: [CLEARED]
    transitions:
      - from: NOT_STARTED
        to: DOCS_SUBMITTED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/id-verification/submit"
        actor: Candidate
        preconditions:
          - "Registration.status IN {STANDBY, CONFIRMED}"
        side_effects: []

      - from: DOCS_SUBMITTED
        to: CLEARED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/id-verification/clear"
        actor: Registrar
        preconditions:
          - "id_expires_on > TestEvent.test_date"
          - "If id_document_type != PASSPORT: issuing_state_code == Candidate.home_state_code OR cross_state_override_granted=true"
        side_effects: []

      - from: DOCS_SUBMITTED
        to: REJECTED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/id-verification/reject"
        actor: Registrar
        preconditions: []
        side_effects:
          - "rejection_reason set"

      - from: REJECTED
        to: DOCS_SUBMITTED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/id-verification/submit (Candidate resubmits with new fields)"
        actor: Candidate
        preconditions:
          - "Registration.status IN {STANDBY, CONFIRMED}"
        side_effects: []
        note: "Cycle: DOCS_SUBMITTED → REJECTED → DOCS_SUBMITTED → CLEARED satisfies non_linear_state_machine for IDVerification."

  - entity: CLEPCreditAward
    field: credit_status
    initial_state: AWARDED
    terminal_states: [AWARDED, DENIED]
    transitions:
      - from: null
        to: AWARDED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/score-reports/{scoreReportId}/clep-credit"
        actor: CreditsOfficer
        preconditions:
          - "Parent TestEvent.test_type = CLEP"
          - "ScoreReport.total_score >= ACE_RECOMMENDED_SCORE_BY_SUBJECT[TestEvent.subject]"
        side_effects:
          - "credit_units := CLEP_CREDIT_UNITS_BY_SUBJECT[TestEvent.subject]"

      - from: null
        to: DENIED
        trigger: "POST /test-events/{testEventId}/registrations/{registrationId}/score-reports/{scoreReportId}/clep-credit"
        actor: CreditsOfficer
        preconditions:
          - "Parent TestEvent.test_type = CLEP"
          - "ScoreReport.total_score < ACE_RECOMMENDED_SCORE_BY_SUBJECT[TestEvent.subject]"
        side_effects:
          - "credit_units := 0"
        note: "CLEPCreditAward is immutable once posted; no further transitions."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Candidates simultaneously POST /test-events/{id}/registrations for the LAST available seat at the same (test_event, test_center)"
    guarantee: "At most one Registration becomes CONFIRMED on that seat; the second is created in STANDBY status (no error)."
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on TestCenterCapacity.confirmed_seats_used increment; loser sees ERR_CAPACITY_EXHAUSTED only when force_confirmed=true was passed; otherwise loser silently lands in STANDBY"

  - scenario: "Proctor POSTs check-in while Registrar POSTs admin-cancel on the same Registration"
    guarantee: "Exactly one wins; loser sees ERR_INVALID_REGISTRATION_STATE."
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    serialization: "First-writer-wins on Registration.status field"

  - scenario: "Two AccommodationsOfficers simultaneously POST approve and deny on the same AccommodationRequest after both started review (only the reviewer_user_id officer may act, but reviewer_user_id was just pinned to whichever of them won start-review)"
    guarantee: "Only the officer pinned as reviewer_user_id may act; the other is rejected."
    error_id: ERR_NOT_PINNED_REVIEWER
    http_status: 403
    serialization: "First-writer-wins on AccommodationRequest.reviewer_user_id at the start-review transition"

  - scenario: "Candidate self-cancels while the no-show sweep is concurrently flipping the same CONFIRMED Registration to NO_SHOW"
    guarantee: "Whichever transition lands first is final; the loser sees ERR_INVALID_REGISTRATION_STATE."
    error_id: ERR_INVALID_REGISTRATION_STATE
    http_status: 409
    serialization: "First-writer-wins on Registration.status"

  - scenario: "Two CreditsOfficers simultaneously POST a CLEPCreditAward for the same ScoreReport"
    guarantee: "Exactly one CLEPCreditAward exists per ScoreReport; second request rejected."
    error_id: ERR_CLEP_AWARD_ALREADY_POSTED
    http_status: 409
    serialization: "First-writer-wins on CLEPCreditAward creation keyed by score_report_id (unique)"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_refund_amount
    trigger: "Registration → CANCELLED transition (either path)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: Registration row R, current clock now()
      # Step 1: compute days_before_test = floor((TestEvent.test_date - now()) / 86400 seconds)
      # Step 2: pick refund_rate from the tier table by days_before_test
      #   days_before_test >= 30  → tier=FULL,        rate=1.00
      #   15 <= days_before_test < 30 → tier=PARTIAL_75, rate=0.75
      #    7 <= days_before_test < 15 → tier=PARTIAL_50, rate=0.50
      #    days_before_test < 7    → tier=NONE,        rate=0.00
      # Step 3: per-line-item refund (round_half_up to integer cents PER LINE before summing)
      #   refund_base        = round_half_up(R.base_fee_cents_charged * rate)
      #   refund_late        = round_half_up(R.late_fee_cents_charged * rate)
      #   refund_accommodation = 0   # accommodation fee is NEVER refundable
      # Step 4: candidate refund = refund_base + refund_late + refund_accommodation
      # Step 5: variant override (see variants block)
      # Step 6: final amount_cents = max(0, candidate refund); tier_label set from Step 2
    input_set: "The triggering Registration row only. AccommodationRequest status is not consulted at refund time — the accommodation fee is always retained."
    constants:
      FULL_TIER_THRESHOLD_DAYS: 30
      PARTIAL_75_TIER_THRESHOLD_DAYS: 15
      PARTIAL_50_TIER_THRESHOLD_DAYS: 7
      ACCOMMODATION_FEE_CENTS: 2500
    precision: "Cents, integer; per-line rounding round_half_up; PER-LINE rounding ORDER IS PINNED — round each line then sum, NOT sum then round (mode-b)."
    variants:
      - name: self_initiated
        when: "Registration.registration_channel = SELF_INITIATED (Candidate-driven cancellation)"
        difference: "Uses tier table above verbatim. Cancellation fee NOT additionally deducted."
      - name: official_cancellation
        when: "Registration.registration_channel = OFFICIAL_CANCELLATION (Registrar-driven cancellation due to event mis-scheduling, force majeure, ID rejection cascade, etc.)"
        difference: "Refund tier is forced to FULL regardless of days_before_test (rate=1.00 on base_fee_cents_charged AND late_fee_cents_charged). Still retains accommodation_fee_cents_charged. Tier_label still recorded as the *actual* time-tier (FULL/PARTIAL_75/PARTIAL_50/NONE) for audit — even though rate used was 1.00."

  - name: super_score_composite
    trigger: "GET /candidates/{candidateId}/super-score (read-only)"
    algorithm: weighted_scoring
    formula: |
      # Inputs: candidate_id C, test_type T (query param), reporting_mode M (query param), as_of_date A (optional, defaults to now())
      # Step 1: candidate ScoreReport pool P:
      #   - Registration.candidate_id = C
      #   - Registration.test_event_id → TestEvent.test_type = T
      #   - ScoreReport.report_type = OFFICIAL OR (report_type = RESCORED AND it is the LATEST by created_at for that registration_id)
      #   - For each registration, exactly one ScoreReport contributes (the latest by created_at)
      #   - TestEvent.test_date >= A - SUPER_SCORE_LOOKBACK_DAYS  (24 months default)
      # Step 2: variant-specific composite (see variants)
      # Step 3: scaling and rounding
      #   - SAT: total = reading_writing + math, range 400..1600, integer rounding (round_half_up).
      #   - ACT: total = round_half_up(mean(english, math, reading, science))
      #   - AP/CLEP: total = composite (no super score for AP/CLEP — returns latest sitting per test_event)
      # Step 4: empty-pool fallback
      #   - If P is empty after filtering: return {"composite": null, "sections": {}, "sittings_used": 0}  (boundary-empty edge)
    input_set: "ScoreReports whose Registration is COMPLETED AND TestEvent.status = COMPLETED AND TestEvent.test_date within SUPER_SCORE_LOOKBACK_DAYS window."
    constants:
      SUPER_SCORE_LOOKBACK_DAYS: 730   # 24 months
    precision: "Section integers (no fractional points). Composite for ACT rounded half-up to integer."
    variants:
      - name: college_board_official
        when: "M = COLLEGE_BOARD_OFFICIAL (default)"
        difference: "Per section, take MAX(section_score) across all sittings in P. Composite is the sum (SAT) or rounded mean (ACT) of those per-section maxima. NB: max(reading_writing) and max(math) may come from DIFFERENT sittings."
      - name: institutional_submission
        when: "M = INSTITUTIONAL_SUBMISSION"
        difference: "Per section, take the section_score from the SINGLE sitting whose total_score is highest. All four (ACT) / two (SAT) sections come from the SAME sitting. Different result whenever a candidate's best section in isolation is not from the same sitting as their best total."

  - name: standby_promotion_priority
    trigger: "Any Registration leaves CONFIRMED status (cancellation, no-show, demotion); also fires at POST /_sweep/no-show-and-promote"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: (test_event_id E, test_center_id C, seats_freed N, accommodation_seats_freed K with K <= N)
      # Step 1: candidate pool S = Registration rows where
      #   test_event_id = E AND test_center_id = C AND status = STANDBY
      #   AND standby_promotion_eligibility_at <= now()
      # Step 2: partition S into S_accommodation (accommodation_required=true) and S_general
      # Step 3: fill accommodation seats first (waterfall):
      #   For up to K iterations:
      #     pick top of S_accommodation by ranking key below; promote to CONFIRMED; remove from pool
      #   Any unused accommodation slots SPILL into general pool (rate K_unused added to N - K)
      # Step 4: fill remaining (N - K + spill) seats from S_general by ranking key
      # Ranking key (sort ASC = highest priority first):
      #   (a) priority_class:
      #        0 if accommodation_required=true AND iteration ∈ Step 3
      #        1 if accommodation_required=true AND iteration ∈ Step 4 (spill into general)
      #        2 if accommodation_required=false
      #   (b) registered_at ASC (earlier registration wins)
      #   (c) Candidate.id ASC (lexicographic tie-break — fully deterministic)
      # Empty-pool fallback: nothing happens, no error.
    input_set: "All STANDBY Registrations on the same (test_event_id, test_center_id) whose standby_promotion_eligibility_at <= now()."
    constants:
      STANDBY_VISIBILITY_DELAY_SECONDS: 0   # eligibility immediate at creation; field exists so PRD/tests can pin the explicit gating
    precision: "N/A (assignment problem; integer counts of seats)"

  - name: clep_credit_units
    trigger: "POST .../clep-credit"
    algorithm: threshold
    formula: |
      # Inputs: ScoreReport.total_score, TestEvent.subject
      # Step 1: lookup ACE_RECOMMENDED_SCORE_BY_SUBJECT[subject]; if subject not in map → ERR_CLEP_SUBJECT_UNRECOGNIZED
      # Step 2: if total_score >= recommended_score:
      #             credit_status = AWARDED, credit_units = CLEP_CREDIT_UNITS_BY_SUBJECT[subject]
      #         else:
      #             credit_status = DENIED, credit_units = 0
      # Boundary: total_score == recommended_score → AWARDED (>= boundary)
    input_set: "Single ScoreReport row."
    constants:
      ACE_RECOMMENDED_SCORE_BY_SUBJECT:
        CLEP_COLLEGE_ALGEBRA: 50
        CLEP_AMERICAN_GOVERNMENT: 50
        CLEP_BIOLOGY: 50
        CLEP_CHEMISTRY: 50
        CLEP_COLLEGE_COMPOSITION: 50
      CLEP_CREDIT_UNITS_BY_SUBJECT:
        CLEP_COLLEGE_ALGEBRA: 3
        CLEP_AMERICAN_GOVERNMENT: 3
        CLEP_BIOLOGY: 6
        CLEP_CHEMISTRY: 6
        CLEP_COLLEGE_COMPOSITION: 6
    precision: "Integer scores; integer credit_units."

  - name: capacity_seat_reconciliation
    trigger: "Any Registration insert / status update on (test_event_id, test_center_id)"
    algorithm: aggregation
    formula: |
      # On every Registration write tied to a given (E, C):
      #   confirmed_seats_used      = COUNT(Registration WHERE test_event_id=E AND test_center_id=C AND status IN {CONFIRMED, CHECKED_IN, COMPLETED})
      #   accommodation_seats_used  = COUNT(Registration WHERE … AND accommodation_required = true AND status IN {CONFIRMED, CHECKED_IN, COMPLETED})
      #   standby_seats_pending     = COUNT(Registration WHERE … AND status = STANDBY)
      #   available_seats           = total_capacity - confirmed_seats_used
      # Invariant (compensating): available_seats + confirmed_seats_used == total_capacity at every observable instant.
    input_set: "All Registration rows for the (test_event_id, test_center_id) being reconciled, regardless of status (filtered by formula clauses)."
    constants: {}
    precision: "Integer counts."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed (non-empty UUID for entity-backed roles, non-empty string for opaque roles)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X-User-Role must have permission for this endpoint per RBAC matrix (§1.7); for Candidate role, X-User-ID must equal the path candidate or the owning Registration's candidate_id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource IDs exist, validated left-to-right (testEventId → testCenterId → registrationId → idVerificationId/scoreReportId → clepCreditId/refundTransactionId; accommodationRequestId; candidateId)"
    error_id: "ERR_TEST_EVENT_NOT_FOUND | ERR_TEST_CENTER_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ACCOMMODATION_REQUEST_NOT_FOUND | ERR_ID_VERIFICATION_NOT_FOUND | ERR_SCORE_REPORT_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "TestEvent.status must be REGISTRATION_OPEN to create a new Registration; STANDBY creation also requires open registration."
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /test-events/{id}/registrations"

  - priority: 5
    category: state
    check: "Target Registration / AccommodationRequest / IDVerification must be in the correct state for the operation (per §1.2 state machines)"
    error_id: ERR_INVALID_REGISTRATION_STATE | ERR_INVALID_ACCOMMODATION_STATE | ERR_INVALID_ID_VERIFICATION_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Check-in requires IDVerification.status = CLEARED for the Registration (cross-entity dependency: Registration ↔ IDVerification)"
    error_id: ERR_ID_NOT_CLEARED
    http_status: 409
    applies_to: "POST .../registrations/{id}/check-in"

  - priority: 7
    category: business_referential
    check: "Check-in requires AccommodationRequest, if one exists for (candidate_id, test_event_id), to be in {APPROVED, DENIED, EXPIRED} — NOT in {SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO} (cross-entity dependency: Registration ↔ AccommodationRequest)"
    error_id: ERR_ACCOMMODATION_PENDING
    http_status: 409
    applies_to: "POST .../registrations/{id}/check-in"

  - priority: 8
    category: business_safety
    check: "Cross-state ID verification: when id_document_type != PASSPORT, IDVerification.issuing_state_code must equal Candidate.home_state_code OR cross_state_override_granted=true"
    error_id: ERR_CROSS_STATE_ID_MISMATCH
    http_status: 422
    applies_to: "POST .../id-verification/clear"

  - priority: 9
    category: business_safety
    check: "IDVerification.id_expires_on must be > TestEvent.test_date"
    error_id: ERR_ID_EXPIRED_BEFORE_TEST
    http_status: 422
    applies_to: "POST .../id-verification/clear"

  - priority: 10
    category: business_temporal
    check: "Check-in window: now() must be within [test_date - CHECK_IN_WINDOW_HOURS, test_date + CHECK_IN_GRACE_HOURS]"
    error_id: ERR_CHECK_IN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST .../registrations/{id}/check-in"

  - priority: 11
    category: business_temporal
    check: "AccommodationRequest submission MUST happen on/before submission_deadline_at (TestEvent.registration_deadline - ACCOMMODATION_LEAD_DAYS)"
    error_id: ERR_ACCOMMODATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /accommodation-requests"

  - priority: 12
    category: business_constraint
    check: "TestCenter cannot host two TestEvents on the SAME test_date in overlapping +/- TEST_SESSION_HOURS window (closed interval, no buffer)"
    error_id: ERR_TEST_CENTER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /test-events/{id}/test-center-capacities"

  - priority: 13
    category: business_constraint
    check: "A Candidate cannot have two non-CANCELLED, non-NO_SHOW Registrations whose TestEvents' [test_date, test_date+TEST_SESSION_HOURS] windows overlap when extended by CANDIDATE_COOLDOWN_HOURS on either side (closed interval WITH buffer)"
    error_id: ERR_CANDIDATE_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /test-events/{id}/registrations"

  - priority: 14
    category: business_constraint
    check: "(candidate_id, test_event_id) is unique across non-CANCELLED Registration rows"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /test-events/{id}/registrations"

  - priority: 15
    category: business_constraint
    check: "AccommodationRequest is rejected when Candidate.has_iep_or_504 = false"
    error_id: ERR_ACCOMMODATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /accommodation-requests"

  - priority: 16
    category: business_fiscal
    check: "Capacity check: when creating a Registration with force_confirmed=true, TestCenterCapacity.available_seats must be > 0; if accommodation_required would be true, accommodation pool must also have free seat"
    error_id: ERR_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /test-events/{id}/registrations (with force_confirmed=true)"

  - priority: 17
    category: business_fiscal
    check: "CLEPCreditAward requires parent TestEvent.test_type = CLEP and ScoreReport exists"
    error_id: ERR_CLEP_INVALID_CONTEXT
    http_status: 422
    applies_to: "POST .../score-reports/{id}/clep-credit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Test-driver endpoints (REQUIRED — make time-gated states reachable) ----------
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server's logical clock to the supplied ISO8601 instant; required to reach time-gated state transitions"
    roles: [Registrar]
    code: 200
    input: [to]
    output: "{ now: string }"
    side_effects:
      - "Triggers eligible TestEvent.REGISTRATION_OPEN→REGISTRATION_CLOSED, REGISTRATION_CLOSED→SCORES_PENDING, SCORES_PENDING→COMPLETED transitions for any TestEvent whose deadline the new now() crosses"

  - method: POST
    path: "/_sweep/no-show-and-promote"
    description: "Test-only and operational: run the no-show + standby-promotion + accommodation-expiry sweep for one TestEvent"
    roles: [Registrar, Proctor]
    code: 200
    input: [test_event_id]
    output: "{ no_show_count: integer, promotions: integer, expired_accommodations: integer }"
    side_effects:
      - "All CONFIRMED Registration rows on this TestEvent with no CHECKED_IN by now() > test_date + CHECK_IN_GRACE_HOURS → NO_SHOW"
      - "Per-TestCenter, standby_promotion_priority selector fills freed seats from STANDBY pool → CONFIRMED"
      - "AccommodationRequest rows whose review_deadline_at < now() and still in {SUBMITTED, UNDER_REVIEW, NEEDS_MORE_INFO} → EXPIRED"

  # ---------- TestEvent ----------
  - method: POST
    path: "/test-events"
    description: "Create a TestEvent"
    roles: [Registrar]
    code: 201
    input: [test_type, form_code, "subject?", test_date, registration_deadline, late_registration_deadline, score_release_date, base_fee_cents, late_fee_cents]
    output: TestEvent
    side_effects: ["status=REGISTRATION_OPEN"]

  - method: GET
    path: "/test-events"
    description: "List TestEvents"
    roles: [Candidate, Proctor, Registrar, AccommodationsOfficer, CreditsOfficer]
    code: 200
    input: ["limit?", "offset?", "test_type?", "status?"]
    output: "TestEvent[]"
    side_effects: []

  - method: GET
    path: "/test-events/{testEventId}"
    description: "Get a TestEvent"
    roles: [Candidate, Proctor, Registrar, AccommodationsOfficer, CreditsOfficer]
    code: 200
    input: []
    output: TestEvent
    side_effects: []

  - method: POST
    path: "/test-events/{testEventId}/extend-deadline"
    description: "Registrar override: reopen REGISTRATION_CLOSED → REGISTRATION_OPEN once"
    roles: [Registrar]
    code: 200
    input: [new_late_registration_deadline, "version?"]
    output: TestEvent
    side_effects: ["TestEvent.late_registration_deadline updated; deadline_extensions_used counter implied via state revert"]

  # ---------- TestCenter ----------
  - method: POST
    path: "/test-centers"
    description: "Create a TestCenter"
    roles: [Registrar]
    code: 201
    input: [name, address, state_code, timezone]
    output: TestCenter
    side_effects: []

  - method: GET
    path: "/test-centers"
    description: "List TestCenters"
    roles: [Candidate, Proctor, Registrar, AccommodationsOfficer, CreditsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TestCenter[]"
    side_effects: []

  - method: GET
    path: "/test-centers/{testCenterId}"
    description: "Get a TestCenter"
    roles: [Candidate, Proctor, Registrar, AccommodationsOfficer, CreditsOfficer]
    code: 200
    input: []
    output: TestCenter
    side_effects: []

  # ---------- TestCenterCapacity ----------
  - method: POST
    path: "/test-events/{testEventId}/test-center-capacities"
    description: "Allocate seats at a TestCenter for a TestEvent"
    roles: [Registrar]
    code: 201
    input: [test_center_id, total_capacity, accommodation_capacity]
    output: TestCenterCapacity
    side_effects: ["confirmed_seats_used=0, accommodation_seats_used=0, available_seats=total_capacity"]

  - method: GET
    path: "/test-events/{testEventId}/test-center-capacities"
    description: "List TestCenterCapacity rows for a TestEvent"
    roles: [Candidate, Proctor, Registrar, AccommodationsOfficer, CreditsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TestCenterCapacity[]"
    side_effects: []

  # ---------- Candidate ----------
  - method: POST
    path: "/candidates"
    description: "Create a Candidate"
    roles: [Candidate, Registrar]
    code: 201
    input: [legal_name, email, date_of_birth, home_state_code, "has_iep_or_504?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{candidateId}"
    description: "Get a Candidate"
    roles: [Candidate, Registrar, AccommodationsOfficer]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{candidateId}/super-score"
    description: "Compute and return the Super Score for the Candidate"
    roles: [Candidate, Registrar]
    code: 200
    input: [test_type, "reporting_mode?", "as_of_date?"]
    output: "{ test_type, reporting_mode, composite: integer|null, sections: object, sittings_used: integer, source_score_report_ids: string[] }"
    side_effects: ["Read-only; no writes"]

  # ---------- Registration ----------
  - method: POST
    path: "/test-events/{testEventId}/registrations"
    description: "Create a Registration (defaults to STANDBY then auto-promotes to CONFIRMED if capacity free; set force_confirmed=true to demand CONFIRMED or get ERR_CAPACITY_EXHAUSTED)"
    roles: [Candidate, Registrar]
    code: 201
    input: [candidate_id, test_center_id, "force_confirmed?"]
    output: Registration
    side_effects:
      - "Fee snapshot calculated; capacity_seat_reconciliation runs"
      - "If accommodation already APPROVED for (candidate, event): accommodation_required=true, accommodation_fee_cents_charged added"

  - method: GET
    path: "/test-events/{testEventId}/registrations/{registrationId}"
    description: "Get a Registration"
    roles: [Candidate, Proctor, Registrar]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/test-events/{testEventId}/registrations"
    description: "List Registrations for a TestEvent"
    roles: [Proctor, Registrar]
    code: 200
    input: ["limit?", "offset?", "test_center_id?", "status?"]
    output: "Registration[]"
    side_effects: []

  - method: DELETE
    path: "/test-events/{testEventId}/registrations/{registrationId}"
    description: "Candidate self-cancellation"
    roles: [Candidate]
    code: 200
    input: ["version?"]
    output: Registration
    side_effects:
      - "registration_channel=SELF_INITIATED"
      - "tiered_refund_amount → RefundTransaction appended"
      - "capacity_seat_reconciliation; standby_promotion_priority fires"

  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/admin-cancel"
    description: "Registrar cancellation (forces full refund variant)"
    roles: [Registrar]
    code: 200
    input: ["version?"]
    output: Registration
    side_effects:
      - "registration_channel=OFFICIAL_CANCELLATION"
      - "tiered_refund_amount.official_cancellation variant → RefundTransaction"
      - "capacity_seat_reconciliation; standby_promotion_priority fires"

  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/check-in"
    description: "Proctor checks in a Candidate on test day"
    roles: [Proctor]
    code: 200
    input: []
    output: Registration
    side_effects: ["Registration.status: CONFIRMED → CHECKED_IN"]

  # ---------- IDVerification ----------
  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/id-verification/submit"
    description: "Candidate submits ID documents (idempotent on resubmit after REJECTED)"
    roles: [Candidate]
    code: 201
    input: [id_document_type, "issuing_state_code?", id_expires_on]
    output: IDVerification
    side_effects: ["status transitions NOT_STARTED→DOCS_SUBMITTED or REJECTED→DOCS_SUBMITTED"]

  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/id-verification/clear"
    description: "Registrar clears the ID (passes cross-state + expiry checks)"
    roles: [Registrar]
    code: 200
    input: ["allow_cross_state_override?"]
    output: IDVerification
    side_effects: ["status → CLEARED; cross_state_override_granted=true iff override used"]

  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/id-verification/reject"
    description: "Registrar rejects the ID submission with reason"
    roles: [Registrar]
    code: 200
    input: [rejection_reason]
    output: IDVerification
    side_effects: ["status → REJECTED"]

  - method: GET
    path: "/test-events/{testEventId}/registrations/{registrationId}/id-verification"
    description: "Get IDVerification for a Registration"
    roles: [Candidate, Proctor, Registrar]
    code: 200
    input: []
    output: IDVerification
    side_effects: []

  # ---------- AccommodationRequest ----------
  - method: POST
    path: "/accommodation-requests"
    description: "Candidate submits a 504/IEP accommodation request"
    roles: [Candidate]
    code: 201
    input: [candidate_id, test_event_id, requested_accommodations, supporting_documents]
    output: AccommodationRequest
    side_effects: ["status=SUBMITTED; submission_deadline_at / review_deadline_at computed"]

  - method: POST
    path: "/accommodation-requests/{accommodationRequestId}/start-review"
    description: "AccommodationsOfficer pulls a request into UNDER_REVIEW"
    roles: [AccommodationsOfficer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["reviewer_user_id pinned to caller"]

  - method: POST
    path: "/accommodation-requests/{accommodationRequestId}/request-info"
    description: "AccommodationsOfficer demands more documents"
    roles: [AccommodationsOfficer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status → NEEDS_MORE_INFO"]

  - method: PATCH
    path: "/accommodation-requests/{accommodationRequestId}/resubmit"
    description: "Candidate appends new supporting documents and re-submits"
    roles: [Candidate]
    code: 200
    input: [supporting_documents]
    output: AccommodationRequest
    side_effects: ["status → SUBMITTED (cyclic loop entry)"]

  - method: POST
    path: "/accommodation-requests/{accommodationRequestId}/approve"
    description: "AccommodationsOfficer approves"
    roles: [AccommodationsOfficer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects:
      - "Cascade: all Registration(candidate, test_event) → accommodation_required=true, accommodation_fee_cents_charged added"
      - "Cross-entity: if accommodation pool exhausted, Registration.CONFIRMED → STANDBY (chain depth 2-3)"
      - "Registration.locked_accommodation_request_version captured"

  - method: POST
    path: "/accommodation-requests/{accommodationRequestId}/deny"
    description: "AccommodationsOfficer denies"
    roles: [AccommodationsOfficer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status → DENIED"]

  - method: GET
    path: "/accommodation-requests/{accommodationRequestId}"
    description: "Get an AccommodationRequest"
    roles: [Candidate, Registrar, AccommodationsOfficer]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []

  - method: GET
    path: "/accommodation-requests"
    description: "List AccommodationRequests (Officer queue view)"
    roles: [Registrar, AccommodationsOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "test_event_id?"]
    output: "AccommodationRequest[]"
    side_effects: []

  # ---------- ScoreReport + CLEPCreditAward ----------
  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/score-reports"
    description: "Post a ScoreReport (OFFICIAL or RESCORED) to a COMPLETED Registration"
    roles: [Registrar]
    code: 201
    input: [section_scores, total_score, "report_type?"]
    output: ScoreReport
    side_effects: ["Immutable append-only row created"]

  - method: GET
    path: "/test-events/{testEventId}/registrations/{registrationId}/score-reports"
    description: "List ScoreReports for a Registration (in created_at order)"
    roles: [Candidate, Registrar, CreditsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScoreReport[]"
    side_effects: []

  - method: POST
    path: "/test-events/{testEventId}/registrations/{registrationId}/score-reports/{scoreReportId}/clep-credit"
    description: "CreditsOfficer posts a CLEP credit decision"
    roles: [CreditsOfficer]
    code: 201
    input: []
    output: CLEPCreditAward
    side_effects: ["credit_status and credit_units computed from clep_credit_units calculation"]

  - method: GET
    path: "/candidates/{candidateId}/clep-credit-awards"
    description: "List CLEPCreditAwards for a Candidate"
    roles: [Candidate, Registrar, CreditsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CLEPCreditAward[]"
    side_effects: []

  # ---------- RefundTransaction ----------
  - method: GET
    path: "/test-events/{testEventId}/registrations/{registrationId}/refunds"
    description: "List RefundTransactions for a Registration"
    roles: [Candidate, Registrar]
    code: 200
    input: ["limit?", "offset?"]
    output: "RefundTransaction[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID/X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,               http: 403, condition: "Role lacks permission for the endpoint" }

  # --- Existence ---
  - { id: ERR_TEST_EVENT_NOT_FOUND,             http: 404, condition: "TestEvent id not in DB" }
  - { id: ERR_TEST_CENTER_NOT_FOUND,            http: 404, condition: "TestCenter id not in DB" }
  - { id: ERR_TEST_CENTER_CAPACITY_NOT_FOUND,   http: 404, condition: "TestCenterCapacity row missing for (event, center)" }
  - { id: ERR_CANDIDATE_NOT_FOUND,              http: 404, condition: "Candidate id not in DB" }
  - { id: ERR_REGISTRATION_NOT_FOUND,           http: 404, condition: "Registration id not in DB" }
  - { id: ERR_ACCOMMODATION_REQUEST_NOT_FOUND,  http: 404, condition: "AccommodationRequest id not in DB" }
  - { id: ERR_ID_VERIFICATION_NOT_FOUND,        http: 404, condition: "IDVerification missing for the Registration" }
  - { id: ERR_SCORE_REPORT_NOT_FOUND,           http: 404, condition: "ScoreReport id not in DB" }

  # --- State ---
  - { id: ERR_REGISTRATION_CLOSED,             http: 409, condition: "TestEvent.status != REGISTRATION_OPEN at Registration creation" }
  - { id: ERR_INVALID_REGISTRATION_STATE,      http: 409, condition: "Registration not in legal state for the operation" }
  - { id: ERR_INVALID_ACCOMMODATION_STATE,     http: 409, condition: "AccommodationRequest not in legal state for the transition" }
  - { id: ERR_INVALID_ID_VERIFICATION_STATE,   http: 409, condition: "IDVerification not in legal state for the operation" }
  - { id: ERR_DEADLINE_EXTENSION_EXHAUSTED,    http: 409, condition: "TestEvent already had deadline extended once" }

  # --- Concurrency / SOD ---
  - { id: ERR_NOT_PINNED_REVIEWER,             http: 403, condition: "AccommodationRequest action by an officer other than the pinned reviewer_user_id" }
  - { id: ERR_CLEP_AWARD_ALREADY_POSTED,       http: 409, condition: "CLEPCreditAward already exists for this ScoreReport" }

  # --- Business referential (cross-entity) ---
  - { id: ERR_ID_NOT_CLEARED,                  http: 409, condition: "Check-in requires IDVerification.status = CLEARED" }
  - { id: ERR_ACCOMMODATION_PENDING,           http: 409, condition: "Check-in requires AccommodationRequest in {APPROVED, DENIED, EXPIRED} not in pending states" }

  # --- Business safety ---
  - { id: ERR_CROSS_STATE_ID_MISMATCH,         http: 422, condition: "issuing_state_code != Candidate.home_state_code without override (non-PASSPORT)" }
  - { id: ERR_ID_EXPIRED_BEFORE_TEST,          http: 422, condition: "ID document expires on/before TestEvent.test_date" }

  # --- Business temporal ---
  - { id: ERR_CHECK_IN_WINDOW_CLOSED,          http: 409, condition: "now() outside [test_date - CHECK_IN_WINDOW_HOURS, test_date + CHECK_IN_GRACE_HOURS]" }
  - { id: ERR_ACCOMMODATION_DEADLINE_PASSED,   http: 422, condition: "AccommodationRequest submitted after submission_deadline_at" }
  - { id: ERR_TEST_CENTER_TIME_CONFLICT,       http: 409, condition: "TestCenter already hosts a TestEvent on the same date+time window (closed interval, no buffer)" }
  - { id: ERR_CANDIDATE_SESSION_OVERLAP,       http: 409, condition: "Candidate already registered on an overlapping TestEvent within CANDIDATE_COOLDOWN_HOURS buffer" }

  # --- Business constraint ---
  - { id: ERR_DUPLICATE_REGISTRATION,          http: 409, condition: "(candidate_id, test_event_id) already exists in non-CANCELLED status" }
  - { id: ERR_ACCOMMODATION_NOT_ELIGIBLE,      http: 422, condition: "Candidate.has_iep_or_504=false at AccommodationRequest submit" }
  - { id: ERR_DUPLICATE_ACCOMMODATION,         http: 409, condition: "Another non-EXPIRED AccommodationRequest exists for (candidate_id, test_event_id)" }

  # --- Business fiscal / quota ---
  - { id: ERR_CAPACITY_EXHAUSTED,              http: 409, condition: "force_confirmed=true requested but no available seat (or accommodation pool exhausted for accommodation candidate)" }

  # --- CLEP ---
  - { id: ERR_CLEP_INVALID_CONTEXT,            http: 422, condition: "ScoreReport's TestEvent.test_type != CLEP at CLEPCreditAward creation" }
  - { id: ERR_CLEP_SUBJECT_UNRECOGNIZED,       http: 422, condition: "TestEvent.subject not present in ACE_RECOMMENDED_SCORE_BY_SUBJECT lookup" }

  # --- Misc input ---
  - { id: ERR_INVALID_REQUEST,                 http: 400, condition: "Generic schema / type mismatch / missing required body field" }
  - { id: ERR_VERSION_CONFLICT,                http: 409, condition: "OCC version field on PATCH/PUT/DELETE does not match server's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Candidate
    description: "End-user who registers for tests and tracks their own results"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /candidates (self-create)"
      - "POST /test-events/{id}/registrations (own candidate_id only)"
      - "DELETE /test-events/{id}/registrations/{registrationId} (own only) — self-cancellation"
      - "POST .../id-verification/submit (own Registration)"
      - "POST /accommodation-requests (own candidate_id only)"
      - "PATCH /accommodation-requests/{id}/resubmit (own only)"
    shared_operations:
      - "GET /test-events, GET /test-events/{id}, GET /test-centers, GET /test-centers/{id}, GET /test-events/{id}/test-center-capacities"
      - "GET /test-events/{id}/registrations/{registrationId} (own only)"
      - "GET .../id-verification (own only)"
      - "GET /accommodation-requests/{id} (own only)"
      - "GET /candidates/{id}, GET /candidates/{id}/super-score, GET /candidates/{id}/clep-credit-awards (own only)"
      - "GET .../score-reports (own only), GET .../refunds (own only)"

  - name: Proctor
    description: "Test-day staff at a TestCenter; checks in candidates and marks no-shows"
    identity: "opaque"
    exclusive_operations:
      - "POST .../registrations/{id}/check-in"
    shared_operations:
      - "POST /_sweep/no-show-and-promote"
      - "GET /test-events, GET /test-events/{id}, GET /test-events/{id}/registrations (any), GET /test-centers, GET /test-events/{id}/test-center-capacities"

  - name: AccommodationsOfficer
    description: "Reviews 504/IEP accommodation requests; segregation of duties from Candidate and Proctor"
    identity: "opaque"
    exclusive_operations:
      - "POST /accommodation-requests/{id}/start-review"
      - "POST /accommodation-requests/{id}/request-info"
      - "POST /accommodation-requests/{id}/approve"
      - "POST /accommodation-requests/{id}/deny"
    shared_operations:
      - "GET /accommodation-requests, GET /accommodation-requests/{id}, GET /candidates/{id}, GET /test-events, GET /test-events/{id}"

  - name: Registrar
    description: "Operations admin; manages TestEvents, TestCenters, capacity, deadline overrides, official cancellations, ID clearance/rejection, ScoreReport posting"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /test-events"
      - "POST /test-events/{id}/extend-deadline"
      - "POST /test-centers"
      - "POST /test-events/{id}/test-center-capacities"
      - "POST /test-events/{id}/registrations/{id}/admin-cancel"
      - "POST .../id-verification/clear"
      - "POST .../id-verification/reject"
      - "POST .../score-reports"
    shared_operations:
      - "POST /_sweep/no-show-and-promote"
      - "POST /candidates (operator-create)"
      - "POST /test-events/{id}/registrations (on behalf of any Candidate)"
      - "GET endpoints"

  - name: CreditsOfficer
    description: "Posts CLEP credit decisions; cannot do Registrar or Proctor work (SOD)"
    identity: "opaque"
    exclusive_operations:
      - "POST .../score-reports/{id}/clep-credit"
    shared_operations:
      - "GET /candidates/{id}/clep-credit-awards, GET /test-events, GET .../score-reports"

# =============================================================================
# Constants referenced across the scaffold (informational; canonical values
# referenced by §1.2 / §1.3 / §1.4 explicitly)
# =============================================================================
# CHECK_IN_WINDOW_HOURS:      2     (hours BEFORE test_date that check-in opens)
# CHECK_IN_GRACE_HOURS:       1     (hours AFTER test_date that check-in still works)
# TEST_SESSION_HOURS:         4     (treated as the test session duration window)
# CANDIDATE_COOLDOWN_HOURS:   4     (buffer applied to candidate-overlap check)
# ACCOMMODATION_LEAD_DAYS:    14    (days before registration_deadline by which 504/IEP must be filed)
# ACCOMMODATION_REVIEW_WINDOW_DAYS: 7  (officer review SLA window)
# ACCOMMODATION_FEE_CENTS:    2500
# SUPER_SCORE_LOOKBACK_DAYS:  730
