            - "the second trigger returns 409 with data.error_id == ERR_BLACKOUT_STATE_INVALID"
            - "SpaceHold.${hold_id}.status == ACTIVE and challenge_round == 0"
            - "MaintenanceBlackout.${bl_id}.status == APPROVED"
            - "SpaceUnit.${sp_bc_id}.active_blackout_count == 1"

