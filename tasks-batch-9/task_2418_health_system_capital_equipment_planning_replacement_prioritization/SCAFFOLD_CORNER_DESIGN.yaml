          60.00 and 0.00 against plan_year_start 2027-01-01 + 730 days = 2028-12-31, while BOTH carry eos
          penalty 0.00 in asset_ruls_score because that term is measured against the logical clock
          (2026-08-01 + 365 days = 2027-08-01). The same field feeds two different reference dates.
