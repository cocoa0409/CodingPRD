          setup:
            - "A SENIOR_FREEZE grant on P1 (freeze_enabled true, relief 1000 bps, ceiling 5000000, priority_rank 20): assessed 33600000, so frozen_value_cents == portable_balance_cents == 33600000 and benefit_amount_cents == 3360000."
