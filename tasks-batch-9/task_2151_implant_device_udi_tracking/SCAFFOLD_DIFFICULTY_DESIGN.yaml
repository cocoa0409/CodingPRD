# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2151_implant_device_udi_tracking
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Actor id convention:
#   rt-01/rt-02 ReceivingTech, il-01/il-02 InventoryLead, cc-01/cc-02
#   CircClinician, co-01/co-02 ComplianceOfficer, ri-01/ri-02
#   RevenueIntegrityAnalyst. VendorRep always acts as as_user_id ${vendor_id}.
# All money literals below were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: implant_charge_provisional_list_vs_final_acquisition
        grounds:
          - calculations.implant_charge_amount
          - entities.ChargeCapture.fields.provisional_charge_cents
          - entities.ChargeCapture.fields.final_charge_cents
          - entities.ChargeCapture.fields.variance_cents
          - state_machines.ChargeCapture.POSTED_to_CORRECTION_REQUIRED
        distinguishing_aspect: |
          This dual variant lives in the PATIENT REVENUE domain (ChargeCapture on
          a SurgicalCase): PROVISIONAL bases the markup on
          CatalogItem.list_charge_cents = 1240000 (tier 4, 22%) while FINAL bases
          it on DeviceUnit.acquisition_cost_cents = 462500 (tier 3, 32%), so the
          same implant yields 1512800 and 610500 - a 902300 cent divergence that
          also flips the charge into CORRECTION_REQUIRED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Vendor ORTHO-1 with an ACTIVE consignment agreement (ON_IMPLANT, UNIT_MATCH)."
            - "CatalogItem category HIGH_COST_IMPLANT, list_charge_cents 1240000, registry_required false."
            - "Lot L-4401 expiring 2027-06-30, released from quarantine, holding one unit SN-0001 with acquisition_cost_cents 462500."
            - "That unit implanted into an IN_PROGRESS case and the record VERIFIED by a second clinician."
            - "One ChargeCapture created (quantity 1) and POSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/consignment-agreements"
              payload: { vendor_id: "${vendor_id}", agreement_code: "AGR-A", billing_trigger: "ON_IMPLANT", reconciliation_method: "UNIT_MATCH", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-12-31T23:59:59.999Z", invoice_tolerance_bps: 150 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { agr_id: "$.data.id" }
            - call: "POST /udi/consignment-agreements/${agr_id}/activate"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "HIGH_COST_IMPLANT", list_charge_cents: 1240000, charge_code: "CDM-77140", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-4401", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 462500, consignment_agreement_id: "${agr_id}", expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678905", udi_pi_serial: "SN-0001", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
            - call: "POST /udi/implant-records/${ir1_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
            - call: "POST /udi/implant-records/${ir1_id}/charges"
              payload: { quantity: 1 }
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { ch1_id: "$.data.id", prov1: "$.data.provisional_charge_cents" }
            - call: "POST /udi/charge-captures/${ch1_id}/post"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
          trigger:
            - call: "POST /udi/charge-captures/${ch1_id}/finalize"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { fin1: "$.data.final_charge_cents", var1: "$.data.variance_cents" }
          assert:
            - "ChargeCapture.${ch1_id}.provisional_charge_cents == 1512800"
            - "ChargeCapture.${ch1_id}.final_charge_cents == 610500"
            - "ChargeCapture.${ch1_id}.variance_cents == 902300"
            - "ChargeCapture.${ch1_id}.capture_variant == FINAL"
            - "ChargeCapture.${ch1_id}.status == CORRECTION_REQUIRED"
            - "SurgicalCase.${case_id}.total_posted_charge_cents == 610500"
            - "SurgicalCase.${case_id}.readiness_status == BLOCKED_CHARGE"

      - name: consignment_unit_match_vs_period_trueup_divergence
        grounds:
          - calculations.consignment_expected_total
          - entities.VendorInvoice.fields.expected_total_cents
          - entities.VendorInvoice.fields.reconciliation_variant
          - entities.ConsignmentAgreement.fields.reconciliation_method
          - state_machines.VendorInvoice.SUBMITTED_to_VARIANCE_HOLD
        distinguishing_aspect: |
          This dual variant lives in the VENDOR PAYABLES domain (VendorInvoice
          under a ConsignmentAgreement), not the patient-revenue domain of
          implant_charge_provisional_list_vs_final_acquisition: PERIOD_TRUEUP
          widens the denominator to all three units consumed in the period
          (462500 + 462500 + 500001 -> rounded average 475000) and returns
          950000 for a two-unit invoice, where UNIT_MATCH on the identical
          invoice would return 925000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE agreement AGR-B with billing_trigger ON_IMPLANT, reconciliation_method PERIOD_TRUEUP, invoice_tolerance_bps 150, period 2026-09-01T00:00:00Z .. 2026-12-31T23:59:59.999Z."
            - "One STANDARD_IMPLANT catalog item; one released lot holding three consigned units with acquisition costs 462500, 462500 and 500001."
            - "All three units implanted into a single IN_PROGRESS case, so all three are BILLABLE with frozen contract prices."
            - "The vendor has submitted invoice INV-1 for the two 462500 units at a submitted_total_cents of 925000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/consignment-agreements"
              payload: { vendor_id: "${vendor_id}", agreement_code: "AGR-B", billing_trigger: "ON_IMPLANT", reconciliation_method: "PERIOD_TRUEUP", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-12-31T23:59:59.999Z", invoice_tolerance_bps: 150 }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { agr_id: "$.data.id" }
            - call: "POST /udi/consignment-agreements/${agr_id}/activate"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678912", description: "Acetabular Liner", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77150", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-5501", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v1: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 462500, consignment_agreement_id: "${agr_id}", expected_lot_version: "${lot_v1}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "GET /udi/lots/${lot_id}"
              payload: {}
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_v2: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0002", acquisition_cost_cents: 462500, consignment_agreement_id: "${agr_id}", expected_lot_version: "${lot_v2}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u2_id: "$.data.id" }
            - call: "GET /udi/lots/${lot_id}"
              payload: {}
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_v3: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0003", acquisition_cost_cents: 500001, consignment_agreement_id: "${agr_id}", expected_lot_version: "${lot_v3}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u3_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-1", or_room_code: "OR-3", scheduled_start_utc: "2026-09-10T08:00:00Z", scheduled_end_utc: "2026-09-10T10:00:00Z", surgeon_code: "SURG-9" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v1: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678912", udi_pi_serial: "SN-0001", anatomic_site: "ACETABULUM", laterality: "LEFT", expected_case_version: "${case_v1}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v2: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u2_id}", udi_di: "00812345678912", udi_pi_serial: "SN-0002", anatomic_site: "ACETABULUM", laterality: "RIGHT", expected_case_version: "${case_v2}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir2_id: "$.data.id" }
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v3: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u3_id}", udi_di: "00812345678912", udi_pi_serial: "SN-0003", anatomic_site: "FEMUR_PROXIMAL", laterality: "LEFT", expected_case_version: "${case_v3}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir3_id: "$.data.id" }
            - call: "GET /udi/consignment-agreements/${agr_id}"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { agr_v: "$.data.version" }
            - call: "POST /udi/vendor-invoices"
              payload: { vendor_id: "${vendor_id}", consignment_agreement_id: "${agr_id}", invoice_number: "INV-1", submitted_total_cents: 925000, device_unit_ids: ["${u1_id}", "${u2_id}"], expected_agreement_version: "${agr_v}" }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: "POST /udi/vendor-invoices/${inv_id}/match"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { exp_total: "$.data.expected_total_cents", var_bps: "$.data.variance_bps" }
          assert:
            - "VendorInvoice.${inv_id}.reconciliation_variant == PERIOD_TRUEUP"
            - "VendorInvoice.${inv_id}.expected_total_cents == 950000"
            - "VendorInvoice.${inv_id}.variance_cents == -25000"
            - "VendorInvoice.${inv_id}.variance_bps == 263"
            - "VendorInvoice.${inv_id}.status == VARIANCE_HOLD"
            - "The UNIT_MATCH reading of the identical invoice is 925000, so expected_total_cents != submitted_total_cents"
            - "DeviceUnit.${u3_id}.billing_state == BILLABLE and DeviceUnit.${u3_id}.vendor_invoice_id == null"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: case_total_rounds_each_charge_line_before_summing
        grounds:
          - calculations.implant_charge_amount
          - entities.SurgicalCase.fields.total_posted_charge_cents
          - entities.ChargeCapture.fields.provisional_charge_cents
          - state_machines.ChargeCapture.DRAFT_to_POSTED
        distinguishing_aspect: |
          MODE (b) - nested rounding whose ORDER changes the answer. Two posted
          lines with list bases 60010 and 60030 both sit in the 45% tier:
          rounding each line first gives 87015 + 87044 = 174059, while summing
          the unrounded products (87014.5 + 87043.5 = 174058.0) and rounding
          once gives 174058. The scaffold pins round-per-line-then-sum, so
          SurgicalCase.total_posted_charge_cents must be 174059.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two STANDARD_IMPLANT catalog items with list_charge_cents 60010 and 60030, both registry_required false."
            - "One released lot per catalog item, each holding one owned unit."
            - "Both units implanted into one IN_PROGRESS case and both records VERIFIED."
            - "A quantity-1 charge line created for each record; the first is already POSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678929", description: "Bone Screw A", category: "STANDARD_IMPLANT", list_charge_cents: 60010, charge_code: "CDM-77161", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { catA_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678936", description: "Bone Screw B", category: "STANDARD_IMPLANT", list_charge_cents: 60030, charge_code: "CDM-77162", shelf_life_days: 1095, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { catB_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${catA_id}", lot_number: "L-A1", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lotA_id: "$.data.id", lotA_v: "$.data.version" }
            - call: "POST /udi/lots/${lotA_id}/device-units"
              payload: { udi_serial: "SNA-0001", acquisition_cost_cents: 40000, expected_lot_version: "${lotA_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { uA_id: "$.data.id" }
            - call: "POST /udi/lots/${lotA_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${catB_id}", lot_number: "L-B1", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lotB_id: "$.data.id", lotB_v: "$.data.version" }
            - call: "POST /udi/lots/${lotB_id}/device-units"
              payload: { udi_serial: "SNB-0001", acquisition_cost_cents: 40000, expected_lot_version: "${lotB_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { uB_id: "$.data.id" }
            - call: "POST /udi/lots/${lotB_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-2002", display_name: "Pat Two", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-2", or_room_code: "OR-5", scheduled_start_utc: "2026-09-11T08:00:00Z", scheduled_end_utc: "2026-09-11T10:00:00Z", surgeon_code: "SURG-4" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v1: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${uA_id}", udi_di: "00812345678929", udi_pi_serial: "SNA-0001", anatomic_site: "TIBIA", laterality: "LEFT", expected_case_version: "${case_v1}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { irA_id: "$.data.id" }
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v2: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${uB_id}", udi_di: "00812345678936", udi_pi_serial: "SNB-0001", anatomic_site: "TIBIA", laterality: "RIGHT", expected_case_version: "${case_v2}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { irB_id: "$.data.id" }
            - call: "POST /udi/implant-records/${irA_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
            - call: "POST /udi/implant-records/${irB_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
            - call: "POST /udi/implant-records/${irA_id}/charges"
              payload: { quantity: 1 }
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { chA_id: "$.data.id", provA: "$.data.provisional_charge_cents" }
            - call: "POST /udi/implant-records/${irB_id}/charges"
              payload: { quantity: 1 }
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
              captures: { chB_id: "$.data.id", provB: "$.data.provisional_charge_cents" }
            - call: "POST /udi/charge-captures/${chA_id}/post"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
          trigger:
            - call: "POST /udi/charge-captures/${chB_id}/post"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ri-01"
            - call: "GET /udi/surgical-cases/${case_id}"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_total: "$.data.total_posted_charge_cents" }
          assert:
            - "ChargeCapture.${chA_id}.provisional_charge_cents == 87015"
            - "ChargeCapture.${chB_id}.provisional_charge_cents == 87044"
            - "SurgicalCase.${case_id}.total_posted_charge_cents == 174059"
            - "SurgicalCase.${case_id}.total_posted_charge_cents != 174058"

      - name: settlement_credit_tier_keyed_on_gross_not_on_net
        grounds:
          - calculations.net_consignment_settlement
          - entities.VendorInvoice.fields.credit_applied_cents
          - entities.VendorInvoice.fields.net_payable_cents
          - state_machines.VendorInvoice.MATCHED_to_APPROVED
          - state_machines.DeviceUnit.BILLABLE_to_CREDIT_PENDING
        distinguishing_aspect: |
          MODE (c) - a circular-looking dependency with a pinned evaluation
          order, structurally different from the rounding-order instance
          case_total_rounds_each_charge_line_before_summing. gross_due_cents
          2600000 selects the 50% credit cap (1300000); the 1400000 credit pool
          is capped to 1300000 and net_payable_cents is 1300000. Re-keying the
          tier on the net (the wrong reading) would cap at 35% of 1300000 =
          455000 and yield 2145000, so the two readings are distinguishable.
        test_recipe:
