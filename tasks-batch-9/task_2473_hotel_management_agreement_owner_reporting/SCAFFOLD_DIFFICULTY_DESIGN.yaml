              payload: { franchise_requirement_ref: "BSR-2026-014", estimated_cost_cents: 1500000, remediation_start_utc: "2026-06-01T00:00:00Z", remediation_deadline_utc: "2026-08-15T00:00:00Z" }
              as: AssetManager
