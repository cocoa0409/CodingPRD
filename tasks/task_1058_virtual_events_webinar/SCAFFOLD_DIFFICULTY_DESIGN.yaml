          - entities.TicketType.fields.sold_count
          - "errors[ERR_TICKET_SOLD_OUT]"
        distinguishing_aspect: |
          NUMERIC THRESHOLD metric on POST /api/registrations: with quota 2 the second registration
          (sold_count 1 -> 2) succeeds and the third (sold_count 2 >= quota 2) is rejected, pinning
          the comparison as sold_count >= quota rather than sold_count > quota.
