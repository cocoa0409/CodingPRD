          trigger:
            - call: "POST /fundraising/orders"
              payload: { campaign_id: "${camp_id}", seller_id: "${seller_id}", buyer_name: "B", buyer_email: "b@x.com", lines: [ { product_id: "${prod_id}", quantity: 10 } ] }
              as: CampaignAdmin
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.fulfillment_status == PLACED (created 201)"
            - "GET /fundraising/products/${prod_id} -> data.reserved_qty == 10"

