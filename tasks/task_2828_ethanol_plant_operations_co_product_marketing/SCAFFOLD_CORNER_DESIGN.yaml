            - "${e_track} == ERR_TRACK_NOT_FOUND, ${e_shipment} == ERR_SHIPMENT_NOT_FOUND, ${e_sale} == ERR_SALE_NOT_FOUND"
            - "${e_rin} == ERR_RIN_BATCH_NOT_FOUND, ${e_project} == ERR_CARBON_PROJECT_NOT_FOUND"
            - "${e_hedge} == ERR_HEDGE_POSITION_NOT_FOUND, ${e_condition} == ERR_PERMIT_CONDITION_NOT_FOUND"
            - "All thirteen responses carry HTTP 404 and the §1.0 error envelope with success false"

      - name: missing_auth_headers_and_unknown_role_are_rejected_at_401
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_INVALID_ROLE]
          - response_envelope
        distinguishing_aspect: |
          Authentication is decided before authorization and before existence:
          a request with no X-User-Role header returns ERR_MISSING_AUTH_HEADERS
          401 and one carrying a role that is not among the eight declared roles
          returns ERR_INVALID_ROLE 401 — both on a real plant id, so neither can
          be confused with a 403 or a 404.
        test_recipe:
          setup:
            - "One plant exists so the target id is real; the failures must come from the headers alone."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: NONE
              as_user_id: "NONE"
              captures: { e_noauth: $.data.error_id }
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: PlantManager
              as_user_id: "NONE"
              captures: { e_nouser: $.data.error_id }
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: EthanolTsar
              as_user_id: "who-01"
              captures: { e_badrole: $.data.error_id }
          assert:
            - "as NONE means the request is sent with neither X-User-Role nor X-User-ID; as_user_id NONE alone means X-User-ID is omitted"
            - "${e_noauth} == ERR_MISSING_AUTH_HEADERS with HTTP 401"
            - "${e_nouser} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — X-User-ID is as mandatory as the role"
            - "${e_badrole} == ERR_INVALID_ROLE with HTTP 401, not ERR_UNAUTHORIZED 403"
            - "The same GET with X-User-Role PlantManager and X-User-ID pm-01 returns 200 for plant ${plant_id}"

      - name: wrong_state_actions_return_the_resource_specific_state_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_TANK_STATE]
          - errors[ERR_INVALID_SHIPMENT_BILLING_STATE]
          - errors[ERR_INVALID_PROJECT_STATE]
          - validations[priority=27]
          - validations[priority=30]
          - validations[priority=34]
        distinguishing_aspect: |
          Three different resources refuse three different out-of-state actions
          with three different 409 codes in one scenario: releasing a tank that
          was never held, invoicing a LOADED shipment whose BOL has not been
          issued, and reviewing a DRAFT carbon project.
        test_recipe:
          setup:
            - "Plant exists; T-301 is IN_SERVICE with 400000.00 gallons; shipment SH-1 is LOADED but still PENDING_BOL; carbon project CP-1 is DRAFT."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, svc: $.data.service_status }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-1", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Terminal", railcar_count: 10, gallons_per_railcar: 2659.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { lst: $.data.loading_status, bst: $.data.billing_status }
            - call: "POST /ethanol-ops/carbon-projects"
              payload: { project_code: "CP-1", project_name: "Combined heat and power retrofit", project_type: "CHP", claimed_reduction_g_per_mj: 8.000, certification_tier: "FULL" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { cp1_id: $.data.id, vs: $.data.verification_status }
          trigger:
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/release"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { e_tank: $.data.error_id }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/invoice"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { e_ship: $.data.error_id }
            - call: "POST /ethanol-ops/carbon-projects/${cp1_id}/review"
              payload: { determination: "CERTIFY", verified_reduction_g_per_mj: 8.000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { e_proj: $.data.error_id }
          assert:
            - "${svc} == IN_SERVICE, ${lst} == LOADED, ${bst} == PENDING_BOL, ${vs} == DRAFT"
            - "${e_tank} == ERR_INVALID_TANK_STATE with HTTP 409 and ProductTank.${t301_id}.service_status still IN_SERVICE"
            - "${e_ship} == ERR_INVALID_SHIPMENT_BILLING_STATE with HTTP 409, not ERR_SHIPMENT_ALREADY_INVOICED, and invoice_amount_cents stays null"
            - "${e_proj} == ERR_INVALID_PROJECT_STATE with HTTP 409 and CarbonProject.${cp1_id}.verified_reduction_g_per_mj stays null"

      - name: retirement_of_a_generated_but_unseparated_rin_batch_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_RIN_STATE]
          - validations[priority=33]
          - state_machines.RinBatch
          - calculations.rin_generation
        distinguishing_aspect: |
          A freshly generated RIN batch is not retirable: the 2732 RINs minted
          by completing a 940.00 bushel batch sit in GENERATED, and retire
          returns ERR_INVALID_RIN_STATE 409 rather than the
          ERR_SHIPMENT_NOT_INVOICED that only applies once the row is
          SEPARATED.
        test_recipe:
          setup:
            - "Plant exists with 940.00 settled bushels; batch FB-1 charged those bushels at test weight 54.0 and has been distilled and completed, minting RIN batch RB in GENERATED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
