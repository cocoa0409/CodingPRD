              captures: { p1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Promo Holder Two", email: "p2@funds.test", shares_held: 20000, nda_on_file: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { p2_id: "$.data.id" }
            - call: "POST /roadshow-events"
