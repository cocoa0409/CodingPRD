  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_lot_version_on_quality_test_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quality-test-stale-lot]
          - errors[ERR_STALE_LOT_VERSION]
          - endpoints["POST /feedstock-lots/{id}/quality-tests"]
        distinguishing_aspect: "Retesting is legitimate, so the only guard is the version: replaying the version the client read before the first test returns 412 and writes nothing, while re-reading the lot and resubmitting the same numbers succeeds."
        test_recipe:
          setup:
            - "One ACCEPTED-eligible UCO lot with one clean quality test already filed."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 500.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
          trigger:
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 6.00, moisture_pct: 1.20, insolubles_ppm: 1600, phosphorus_ppm: 25, sampled_at: "2026-08-02T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
            - call: "GET /feedstock-lots/${lot_id}"
              payload: {}
              as: QualityAnalyst
              captures: { lot_v1: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 6.00, moisture_pct: 1.20, insolubles_ppm: 1600, phosphorus_ppm: 25, sampled_at: "2026-08-02T00:00:00Z", expected_lot_version: "${lot_v1}" }
              as: QualityAnalyst
          assert:
            - "First trigger call: response.status == 412 and response.error_id == ERR_STALE_LOT_VERSION"
            - "After the refusal FeedstockLot.${lot_id}.status == TESTED, pretreatment_tier == NONE and version == ${lot_v1} (unchanged)"
            - "GET /feedstock-lots/${lot_id}/quality-tests returns total_count == 1 after the refusal"
            - "Third trigger call: response.status == 201, the lot moves to PRETREAT_REQUIRED with pretreatment_tier HEAVY and version == ${lot_v1} + 1"
            - "GET /feedstock-lots/${lot_id}/quality-tests then returns total_count == 2 with both samples retained"

      - name: stale_run_version_on_second_allocation_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-create-stale-run]
          - errors[ERR_STALE_RUN_VERSION]
          - endpoints["POST /processing-runs/{id}/allocations"]
        distinguishing_aspect: "Each allocation rewrites the run's blend, so the second allocation quoting the pre-first-allocation version is refused with 412 and the blend stays at the single-lot value until the client re-reads the version."
        test_recipe:
          setup:
            - "Two ACCEPTED UCO lots of 200.000 MT at CI 32.50 and 200.000 MT at CI 24.90 (TALLOW), HTU-1 with an ACTIVE charge, and a PLANNED run over [2026-09-01, 2026-09-06)."
