      - name: driver_patch_updates_only_the_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /drivers/{id}]
          - entities.Driver.fields.employment_status
          - complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          PATCH is field-selective and version-bumping: sending only employment_status leaves full_name
          and cdl_number untouched while version increments by exactly 1 per call, and the terminated
          driver disappears from the employment_status=ACTIVE list while remaining fetchable by id.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) with drivers d1 (Dana Reyes) and d2 (Marco Bell), both ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", cdl_number: "OH-CDL-0001", full_name: "Dana Reyes" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { d1_id: $.data.id, d1_version: $.data.version }
            - call: "POST /drivers"
              payload: { carrier_id: "${c1_id}", cdl_number: "OH-CDL-0002", full_name: "Marco Bell" }
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { d2_id: $.data.id }
          trigger:
