            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
