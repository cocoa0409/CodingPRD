      - name: ce_cure_requires_ethics_subbucket_minimum
        claim_type: boundary
        grounds:
          - calculations.ce_cycle_satisfaction
          - entities.MunicipalProfessional.fields.ce_ethics_credits
        distinguishing_aspect: "The CE cure has an independent ethics sub-bucket: 12 total credits with only 1 ethics credit leave the professional CE_DUE; topping ethics to 2 with zero additional total credits flips QUALIFIED."
        test_recipe:
          setup:
            - "A MUNICIPAL_DEALER_REP professional QUALIFIED at 2026-09-01T00:00:00Z (MSRB_52 pass, score 80); clock advanced to ce_cycle_end 2027-09-01T00:00:00Z so the epoch flips QUALIFIED -> CE_DUE."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-2003", name: "Dealer CE", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Cee", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/professionals/${prof}/ce-credits"
              payload: { credits_total: 12, ethics_credits: 1 }
              as: ExamAdmin
              captures: { q1: $.data.qualification_status, ct1: $.data.ce_credits_total, ce1: $.data.ce_ethics_credits }
            - call: "POST /msrb/professionals/${prof}/ce-credits"
              payload: { credits_total: 0, ethics_credits: 1 }
              as: ExamAdmin
              captures: { q2: $.data.qualification_status, ct2: $.data.ce_credits_total, ce2: $.data.ce_ethics_credits }
          assert:
            - "${q1} == CE_DUE"
            - "${ct1} == 12"
            - "${ce1} == 1"
            - "${q2} == QUALIFIED"
            - "${ct2} == 12"
            - "${ce2} == 2"
