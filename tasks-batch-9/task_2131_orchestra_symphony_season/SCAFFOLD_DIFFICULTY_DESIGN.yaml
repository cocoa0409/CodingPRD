# =============================================================================
# Task 2131 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2+ instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 only; deleting this file changes no declared behaviour.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: engagement_provisional_vs_final_pay_diverge
        grounds:
          - calculations.musician_service_settlement
          - state_machines.RehearsalService.DRAFT_to_PUBLISHED
          - state_machines.RehearsalService.PUBLISHED_to_COMPLETED
          - entities.MusicianEngagement.fields.provisional_pay_cents
          - entities.MusicianEngagement.fields.final_pay_cents
        distinguishing_aspect: |
          This dual variant lives in the LABOUR-SETTLEMENT domain (MusicianEngagement pay):
          publication prices the engagement from scale plus additive premiums only, while
          clock-out re-prices the identical engagement with clocked overtime, so the same
          row carries 28500 provisional and 36500 final.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING with a union agreement (scale 20000, max_service_minutes 150, overtime 400/min, doubling premium 1250bp, principal premium 2000bp)"
            - "Concert PROGRAMMED at a venue with an ORCHESTRA and a BALCONY section"
            - "Principal horn with overscale_bp 1000, engaged with doubling_count 1 on a 180-minute service that carries a 30-minute break, service PUBLISHED so provisional pay is posted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000, loyalty_discount_bp: 500 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000, max_service_minutes: 150, overtime_rate_cents_per_minute: 400, min_rest_minutes_between_services: 90, max_services_per_day: 2, doubling_premium_bp: 1250, mandatory_break_minutes: 20, principal_premium_bp: 2000 }
              as: OrchestraManager
              captures: { ua1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1, min_renewal_priority_score: 480 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4, min_renewal_priority_score: 0 }
              as: ArtisticAdmin
              captures: { sec_balc: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/musicians"
              payload: { full_name: "Ada Reed", instrument: "HORN", is_principal: true, overscale_bp: 1000 }
              as: OrchestraManager
              captures: { m1: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T14:00:00Z", scheduled_end_utc: "2026-11-04T17:00:00Z", minimum_complement: 1, break_minutes: 30 }
              as: OrchestraManager
              captures: { sv1: "$.data.id" }
            - call: "POST /orchestra/rehearsals/${sv1}/engagements"
              payload: { musician_id: "${m1}", doubling_count: 1 }
              as: OrchestraManager
              captures: { e1: "$.data.id" }
            - call: "POST /orchestra/rehearsals/${sv1}/publish"
              payload: {}
              as: OrchestraManager
          trigger:
            - call: "POST /orchestra/rehearsals/${sv1}/clock"
              payload: { actual_start_utc: "2026-11-04T14:00:00Z", actual_end_utc: "2026-11-04T17:20:00Z" }
              as: OrchestraManager
          assert:
            - "MusicianEngagement.${e1}.provisional_pay_cents == 28500"
            - "MusicianEngagement.${e1}.final_pay_cents == 36500"
            - "MusicianEngagement.${e1}.overtime_minutes == 20"
            - "MusicianEngagement.${e1}.status == SETTLED"
            - "RehearsalService.${sv1}.provisional_service_cost_cents == 28500"
            - "RehearsalService.${sv1}.final_service_cost_cents == 36500"
            - "Musician.${m1}.ytd_earnings_cents == 36500"
            - "Musician.${m1}.services_charged_ytd == 1"

      - name: subscription_new_vs_renewal_price_diverge
        grounds:
          - calculations.subscription_package_price
          - entities.SubscriptionPackage.fields.locked_unit_price_cents
          - entities.SubscriptionPackage.fields.price_cents
          - endpoints[POST /orchestra/subscriptions]
          - endpoints[POST /orchestra/subscriptions/{subscription_id}/renew]
        distinguishing_aspect: |
          This dual variant lives in the PATRON-REVENUE domain (SubscriptionPackage pricing),
          a different entity domain from the labour settlement above: for the identical
          section, seat_count and three-concert set in season 2028, the RENEWAL variant
          prices at the prior season's locked 4800 line and applies loyalty to reach 25718,
          while the NEW variant prices at 2028's 5600 line to reach 31920.
        test_recipe:
          setup:
            - "Season 2027 (base 6000) in RENEWAL_WINDOW with three PROGRAMMED concerts"
            - "Patron Iris Lund has an ACTIVE BALCONY package on those three concerts, 2 seats, so consecutive_renewal_years == 1"
            - "Season 2028 (base 7000) in RENEWAL_WINDOW with its own union agreement and three PROGRAMMED concerts at the same hall"
            - "Patron Otto Brandt is brand new with no package history"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000, loyalty_discount_bp: 500 }
              as: ArtisticAdmin
              captures: { sA: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${sA}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4, min_renewal_priority_score: 0 }
              as: ArtisticAdmin
              captures: { sec_balc: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sA}", venue_id: "${v1}", title: "A1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cA1: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sA}", venue_id: "${v1}", title: "A2", performance_start_utc: "2026-12-05T19:30:00Z", performance_end_utc: "2026-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cA2: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sA}", venue_id: "${v1}", title: "A3", performance_start_utc: "2027-01-05T19:30:00Z", performance_end_utc: "2027-01-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cA3: "$.data.id" }
            - call: "POST /orchestra/concerts/${cA1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${cA2}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${cA3}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${sA}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Iris Lund", email: "iris@patron.test", subscriber_since_year: 2018 }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
            - call: "POST /orchestra/subscriptions"
              payload: { patron_id: "${p1}", season_id: "${sA}", seat_section_id: "${sec_balc}", seat_count: 2, concert_ids: ["${cA1}", "${cA2}", "${cA3}"] }
              as: BoxOfficeAgent
              captures: { sub1: "$.data.id", sub1_price: "$.data.price_cents" }
            - call: "POST /orchestra/subscriptions/${sub1}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /orchestra/seasons"
              payload: { name: "2028 Season", fiscal_year: 2028, renewal_deadline_utc: "2027-10-01T00:00:00Z", base_ticket_price_cents: 7000, loyalty_discount_bp: 500 }
              as: ArtisticAdmin
              captures: { sB: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${sB}", scale_service_fee_cents: 21000 }
              as: OrchestraManager
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sB}", venue_id: "${v1}", title: "B1", performance_start_utc: "2027-11-05T19:30:00Z", performance_end_utc: "2027-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cB1: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sB}", venue_id: "${v1}", title: "B2", performance_start_utc: "2027-12-05T19:30:00Z", performance_end_utc: "2027-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cB2: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sB}", venue_id: "${v1}", title: "B3", performance_start_utc: "2028-01-05T19:30:00Z", performance_end_utc: "2028-01-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cB3: "$.data.id" }
            - call: "POST /orchestra/concerts/${cB1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${cB2}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${cB3}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${sB}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Otto Brandt", email: "otto@patron.test" }
              as: BoxOfficeAgent
              captures: { p2: "$.data.id" }
            - call: "GET /orchestra/subscriptions/${sub1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { sub1_v: "$.data.version" }
          trigger:
            - call: "POST /orchestra/subscriptions/${sub1}/renew"
              payload: { season_id: "${sB}", concert_ids: ["${cB1}", "${cB2}", "${cB3}"], expected_package_version: "${sub1_v}", seat_count: 2 }
              as: BoxOfficeAgent
              captures: { sub2: "$.data.id", sub2_price: "$.data.price_cents" }
            - call: "POST /orchestra/subscriptions"
              payload: { patron_id: "${p2}", season_id: "${sB}", seat_section_id: "${sec_balc}", seat_count: 2, concert_ids: ["${cB1}", "${cB2}", "${cB3}"] }
              as: BoxOfficeAgent
              captures: { sub3: "$.data.id", sub3_price: "$.data.price_cents" }
          assert:
            - "SubscriptionPackage.${sub1}.price_cents == 27360"
            - "SubscriptionPackage.${sub1}.locked_unit_price_cents == 4800"
            - "SubscriptionPackage.${sub2}.package_type == RENEWAL"
            - "SubscriptionPackage.${sub2}.prior_package_id == ${sub1}"
            - "SubscriptionPackage.${sub2}.locked_unit_price_cents == 4800"
            - "SubscriptionPackage.${sub2}.price_cents == 25718"
            - "SubscriptionPackage.${sub3}.package_type == NEW"
            - "SubscriptionPackage.${sub3}.locked_unit_price_cents == 5600"
            - "SubscriptionPackage.${sub3}.price_cents == 31920"
            - "SubscriptionPackage.${sub2}.price_cents != SubscriptionPackage.${sub3}.price_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: single_ticket_price_floor_and_ceiling_clamps_bind
        grounds:
          - calculations.single_ticket_dynamic_price
          - endpoints[GET /orchestra/concerts/{concert_id}/price-quote]
          - endpoints[POST /orchestra/ticket-orders]
          - entities.Concert.fields.section_inventory
        distinguishing_aspect: |
          Mode (a): five inputs (base price, section multiplier, fill-derived demand tier,
          donor tier, and the floor/ceiling clamp pair) interact non-linearly through nested
          min/max — the LAUREATE quote is pulled UP to the 7650 floor while the PEAK quote is
          pulled DOWN to the 10800 ceiling, so neither result equals its own unclamped value.
        test_recipe:
          setup:
            - "Season 2027 (base 6000) advanced to SINGLE_ON_SALE so the concert is PUBLIC_ONSALE"
            - "ORCHESTRA section, capacity 100, price_multiplier_bp 15000 (raw unit 9000)"
            - "Patron Lena Ostrow is LAUREATE after a 5,000,000-cent gift; patron Noel Vance is NONE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000, loyalty_discount_bp: 500 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1, min_renewal_priority_score: 480 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "SINGLE_ON_SALE" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Lena Ostrow", email: "lena@patron.test" }
              as: BoxOfficeAgent
              captures: { pL: "$.data.id" }
            - call: "POST /orchestra/patrons/${pL}/donations"
              payload: { amount_cents: 5000000 }
              as: BoxOfficeAgent
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { pN: "$.data.id" }
          trigger:
            - call: "GET /orchestra/concerts/${c1}/price-quote"
              payload: { seat_section_id: "${sec_orch}", patron_id: "${pL}", seat_count: 1 }
              as: BoxOfficeAgent
              captures: { q1_unit: "$.data.unit_price_cents", q1_band: "$.data.demand_band" }
            - call: "GET /orchestra/concerts/${c1}"
              payload: {}
              as: BoxOfficeAgent
              captures: { c1_v: "$.data.version" }
            - call: "POST /orchestra/ticket-orders"
              payload: { concert_id: "${c1}", patron_id: "${pN}", seat_section_id: "${sec_orch}", seat_count: 80, expected_concert_version: "${c1_v}" }
              as: BoxOfficeAgent
              captures: { o1: "$.data.id" }
            - call: "GET /orchestra/concerts/${c1}/price-quote"
              payload: { seat_section_id: "${sec_orch}", patron_id: "${pN}", seat_count: 2 }
              as: BoxOfficeAgent
              captures: { q2_unit: "$.data.unit_price_cents", q2_fill: "$.data.fill_bp", q2_band: "$.data.demand_band" }
          assert:
            - "${q1_band} == LOW"
            - "${q1_unit} == 7650  (LAUREATE 6885 is raised to the 8500bp floor of raw 9000)"
            - "TicketOrder.${o1}.quoted_unit_price_cents == 8100"
            - "TicketOrder.${o1}.amount_due_cents == 648000"
            - "TicketOrder.${o1}.demand_band_at_hold == LOW"
            - "${q2_fill} == 8000"
            - "${q2_band} == PEAK"
            - "${q2_unit} == 10800  (PEAK 11700 is cut to the 12000bp ceiling of raw 9000)"

      - name: package_price_per_line_rounding_order
        grounds:
          - calculations.subscription_package_price
          - entities.SubscriptionPackage.fields.locked_unit_price_cents
          - entities.SubscriptionPackage.fields.price_cents
        distinguishing_aspect: |
          Mode (b): with base 6333 and multiplier 8000bp the raw line is 5066.4, so rounding
          each of the three concert lines to 5066 before summing yields 14438 while summing
          the raw lines first and rounding once yields 14439 — the scaffold pins per-line
          rounding, and only 14438 passes.
        test_recipe:
          setup:
            - "Season 2027 with base_ticket_price_cents 6333 in RENEWAL_WINDOW"
            - "BALCONY section, price_multiplier_bp 8000, so the raw line is 5066.4 cents"
            - "Three PROGRAMMED concerts and a patron with no donation history"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6333, loyalty_discount_bp: 500 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4, min_renewal_priority_score: 0 }
              as: ArtisticAdmin
              captures: { sec_balc: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "R1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "R2", performance_start_utc: "2026-12-05T19:30:00Z", performance_end_utc: "2026-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "R3", performance_start_utc: "2027-01-05T19:30:00Z", performance_end_utc: "2027-01-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c3: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${c2}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts/${c3}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Vera Kimmel", email: "vera@patron.test" }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/subscriptions"
              payload: { patron_id: "${p1}", season_id: "${s1}", seat_section_id: "${sec_balc}", seat_count: 1, concert_ids: ["${c1}", "${c2}", "${c3}"] }
              as: BoxOfficeAgent
              captures: { sub1: "$.data.id" }
          assert:
            - "SubscriptionPackage.${sub1}.locked_unit_price_cents == 5066"
            - "SubscriptionPackage.${sub1}.price_cents == 14438"
            - "SubscriptionPackage.${sub1}.price_cents != 14439  (14439 is the sum-then-round result and is wrong)"
            - "SubscriptionPackage.${sub1}.status == PENDING_PAYMENT"

      - name: ad_invoice_discount_then_placement_fee_order
        grounds:
          - calculations.ad_invoice_total
          - state_machines.AdBooking.SUBMITTED_to_APPROVED
          - entities.AdBooking.fields.placement_fee_cents
          - entities.Season.fields.program_book_revenue_cents
        distinguishing_aspect: |
          Mode (c): invoice_total looks circular (total = discounted subtotal + placement fee,
          fee itself a percentage of a discounted figure). The pinned order — tier from the
          UNDISCOUNTED 480000, then discount to 441600, then a 2500bp fee on that discounted
          figure — yields 552000, while charging the fee on the undiscounted subtotal yields
          561600.
        test_recipe:
          setup:
            - "Season 2027 in PLANNING with program_book_revenue_cents 0"
            - "A SUBMITTED full-page back-cover ad booking with four insertions (subtotal 480000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/ad-bookings"
              payload: { season_id: "${s1}", advertiser_name: "Harborline Bank", ad_size: "FULL_PAGE", placement: "BACK_COVER", insertion_count: 4 }
