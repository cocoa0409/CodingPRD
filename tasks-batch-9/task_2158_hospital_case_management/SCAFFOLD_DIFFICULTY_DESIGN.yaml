# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances.
# Every chain starts from an empty DB; the logical clock starts at
# 2026-08-01T00:00:00Z and is only ever moved with POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: risk_score_admission_variant_versus_predischarge_variant
        grounds:
          - calculations.composite_readmission_risk_score
          - entities.Episode.fields.risk_variant_applied
          - entities.Episode.fields.barriers_ever_opened_count
          - state_machines.Episode.case_status.PLANNING_to_READY_FOR_DISCHARGE
        distinguishing_aspect: |
          Instance subject is the Patient/Episode readmission-risk domain: the very same
          clinical screening row scores 50 (HIGH) under ADMISSION_VARIANT and the episode
          scores 47 (MODERATE) under PREDISCHARGE_VARIANT, because the predischarge variant
          adds 9 points of barrier history (3 barriers x 3) and subtracts the 12-point
          institutional placement credit.
        test_recipe:
          setup:
            - "Payer 'Lakeside Choice' with coinsurance_pct 0.200 and both auth-required flags false"
            - "Patient with prior_admissions_180d 2, lives_alone false, has_pcp false"
            - "Three ACTIVE SNF providers; no NetworkContract rows exist"
            - "Episode with an ADMISSION screening submitted (scores 50 / HIGH, which auto-creates one PHYSICIAN_ORDER barrier), plus two manually recorded barriers, so barriers_ever_opened_count == 3"
            - "A Referral for SNF with projected_stay_days 30 has been broadcast, answered, and PLACED"
            - "All three barriers RESOLVED, so barrier_posture is CLEAR"
            - "Readmission bundle for band HIGH complete (pcp_followup_booked and med_reconciliation_completed both true)"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200, snf_auth_required: false, hh_auth_required: false, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-1001", full_name: "Ada Lin", date_of_birth: "1948-03-12", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: false }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A", "UNIT-B"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { name: "Birch SNF", provider_type: "SNF", quality_star_rating: 5, distance_miles_from_hospital: 22, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_b: $.data.id }
            - call: "POST /providers"
              payload: { name: "Alder SNF", provider_type: "SNF", quality_star_rating: 3, distance_miles_from_hospital: 12, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_c: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { adm_score: $.data.composite_risk_score, adm_band: $.data.risk_band }
            - call: "POST /episodes/${ep_id}/barriers"
              payload: { barrier_code: "TRANSPORT", severity: "MEDIUM", delay_reason_code: "AWAITING_TRANSPORT" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { bar2_id: $.data.id }
            - call: "POST /episodes/${ep_id}/barriers"
              payload: { barrier_code: "DME_DELIVERY", severity: "LOW", delay_reason_code: "AWAITING_DME" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { bar3_id: $.data.id }
            - call: "POST /episodes/${ep_id}/referrals"
              payload: { requested_level_of_care: "SNF", projected_stay_days: 30, needed_by: "2026-08-20T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/broadcast"
              payload: { provider_ids: ["${prov_a}", "${prov_b}", "${prov_c}"] }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v1: $.data.version }
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v1}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 32808 }
              as: PostAcuteLiaison
              as_user_id: "${prov_a}"
              captures: { off_a_id: $.data.id }
            - call: "POST /referrals/${ref_id}/document-choice"
              payload: { chosen_bed_offer_id: "${off_a_id}", patient_choice_attested: true, choice_basis: "PATIENT_PREFERENCE" }
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "GET /episodes/${ep_id}/barriers"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { bar1_id: "$.data[0].id" }
            - call: "POST /barriers/${bar1_id}/status"
              payload: { to_status: "RESOLVED" }
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /barriers/${bar2_id}/status"
              payload: { to_status: "RESOLVED" }
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /barriers/${bar3_id}/status"
              payload: { to_status: "RESOLVED" }
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /episodes/${ep_id}/readmission-bundle"
              payload: { pcp_followup_booked: true, med_reconciliation_completed: true }
              as: CaseManager
              as_user_id: "cm-alpha"
          trigger:
            - call: "POST /episodes/${ep_id}/mark-ready"
              payload: { discharge_disposition: "SNF" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { pre_score: $.data.current_risk_score, pre_band: $.data.current_risk_band }
          assert:
            - "RiskScreening.${scr_id}.composite_risk_score == 50"
            - "RiskScreening.${scr_id}.risk_band == HIGH"
            - "RiskScreening.${scr_id}.variant_applied == ADMISSION_VARIANT"
            - "Episode.${ep_id}.current_risk_score == 47"
            - "Episode.${ep_id}.current_risk_band == MODERATE"
            - "Episode.${ep_id}.risk_variant_applied == PREDISCHARGE_VARIANT"
            - "Episode.${ep_id}.barriers_ever_opened_count == 3"
            - "Episode.${ep_id}.case_status == READY_FOR_DISCHARGE"

      - name: placement_cost_network_rate_versus_billed_rate_variant
        grounds:
          - calculations.placement_cost_projection
          - entities.BedOffer.fields.rate_variant_applied
          - entities.BedOffer.fields.projected_plan_share_cents
          - entities.NetworkContract.fields.in_network
        distinguishing_aspect: |
          Instance subject is the Referral/BedOffer cost-accounting domain, a different entity
          domain from the risk-scoring dual variant: two BedOffers with byte-identical
          daily_rate_cents 32808 and projected_stay_days 30 project plan shares of 684000
          (NETWORK_RATE, contracted 30000/day) and 935032 (BILLED_RATE, 32808 x 1.25 = 41010/day).
        test_recipe:
          setup:
            - "Payer 'Meridian Health' with coinsurance_pct 0.200"
            - "Cedar SNF has an in_network NetworkContract at 30000 cents/day; Birch SNF has no contract at all"
            - "An Episode in PLANNING with a Referral for SNF, projected_stay_days 30, broadcast to all three SNF providers"
            - "Cedar SNF has already offered UNIT-A at daily_rate_cents 32808"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Health", coinsurance_pct: 0.200, snf_auth_required: false, hh_auth_required: false, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-2001", full_name: "Bo Reyes", date_of_birth: "1951-07-04", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A", "UNIT-B"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { name: "Birch SNF", provider_type: "SNF", quality_star_rating: 5, distance_miles_from_hospital: 22, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_b: $.data.id }
            - call: "POST /providers"
              payload: { name: "Alder SNF", provider_type: "SNF", quality_star_rating: 3, distance_miles_from_hospital: 12, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_c: $.data.id }
            - call: "POST /network-contracts"
              payload: { payer_id: "${payer_id}", provider_id: "${prov_a}", in_network: true, negotiated_daily_rate_cents: 30000 }
              as: PlatformAdmin
              captures: { nc_a: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "ELECTIVE", drg_code: "DRG-470", drg_gmlos_days: 3.5, attending_unit: "7E", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /episodes/${ep_id}/referrals"
              payload: { requested_level_of_care: "SNF", projected_stay_days: 30, needed_by: "2026-08-20T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/broadcast"
              payload: { provider_ids: ["${prov_a}", "${prov_b}", "${prov_c}"] }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v1: $.data.version }
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v1}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 32808 }
              as: PostAcuteLiaison
              as_user_id: "${prov_a}"
              captures: { off_a_id: $.data.id, off_a_gross: $.data.projected_gross_cents }
            - call: "GET /referrals/${ref_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v2: $.data.version }
          trigger:
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v2}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 32808 }
              as: PostAcuteLiaison
              as_user_id: "${prov_b}"
              captures: { off_b_id: $.data.id }
          assert:
            - "BedOffer.${off_a_id}.rate_variant_applied == NETWORK_RATE"
            - "BedOffer.${off_a_id}.projected_gross_cents == 855000"
            - "BedOffer.${off_a_id}.projected_patient_share_cents == 171000"
            - "BedOffer.${off_a_id}.projected_plan_share_cents == 684000"
            - "BedOffer.${off_b_id}.rate_variant_applied == BILLED_RATE"
            - "BedOffer.${off_b_id}.projected_gross_cents == 1168790"
            - "BedOffer.${off_b_id}.projected_patient_share_cents == 233758"
            - "BedOffer.${off_b_id}.projected_plan_share_cents == 935032"
            - "BedOffer.${off_a_id}.daily_rate_cents == BedOffer.${off_b_id}.daily_rate_cents == 32808"

  - rule_id: combinatorial_formula
    instances:

      - name: per_day_rounding_before_summation_on_tier_two_days
        grounds:
          - calculations.placement_cost_projection
          - entities.BedOffer.fields.projected_gross_cents
          - entities.Referral.fields.projected_stay_days
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents: with raw_daily 41010 and
          30 covered days, rounding each of the ten tier-2 days to 34859 and then summing
          yields 1168790, while summing the ten unrounded 34858.5 values first and rounding
          once yields 1168785; the scaffold pins per-day-then-sum, so 1168790 is the only
          correct answer and 1168785 is the diagnostic wrong answer.
        test_recipe:
          setup:
            - "Payer with coinsurance_pct 0.200 and no NetworkContract for Birch SNF, forcing the BILLED_RATE variant"
            - "An Episode in PLANNING whose Referral has projected_stay_days 30 (10 days past the 20-day tier-1 boundary)"
            - "Birch SNF is on the current broadcast slate"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Health", coinsurance_pct: 0.200, snf_auth_required: false, hh_auth_required: false, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-2101", full_name: "Cy Okafor", date_of_birth: "1955-01-19", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A", "UNIT-B"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /providers"
              payload: { name: "Birch SNF", provider_type: "SNF", quality_star_rating: 5, distance_miles_from_hospital: 22, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_b: $.data.id }
            - call: "POST /providers"
              payload: { name: "Alder SNF", provider_type: "SNF", quality_star_rating: 3, distance_miles_from_hospital: 12, bed_unit_codes: ["UNIT-A"] }
              as: PlatformAdmin
              captures: { prov_c: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /episodes/${ep_id}/referrals"
              payload: { requested_level_of_care: "SNF", projected_stay_days: 30, needed_by: "2026-08-20T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/broadcast"
              payload: { provider_ids: ["${prov_a}", "${prov_b}", "${prov_c}"] }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ref_v1: $.data.version }
          trigger:
            - call: "POST /referrals/${ref_id}/offers"
              payload: { expected_referral_version: "${ref_v1}", bed_unit_code: "UNIT-A", bed_available_from: "2026-08-05T00:00:00Z", hold_expires_at: "2026-08-12T00:00:00Z", daily_rate_cents: 32808 }
              as: PostAcuteLiaison
              as_user_id: "${prov_b}"
              captures: { off_b_id: $.data.id }
          assert:
            - "BedOffer.${off_b_id}.projected_gross_cents == 1168790"
            - "BedOffer.${off_b_id}.projected_gross_cents != 1168785"
            - "BedOffer.${off_b_id}.projected_patient_share_cents == 233758"
            - "BedOffer.${off_b_id}.projected_plan_share_cents == 935032"
            - "BedOffer.${off_b_id}.rate_variant_applied == BILLED_RATE"

      - name: volume_discount_tier_keyed_on_pre_discount_gross
        grounds:
          - calculations.authorization_award
          - entities.AuthorizationRequest.fields.gross_projection_cents
          - entities.AuthorizationRequest.fields.volume_discount_pct
          - state_machines.AuthorizationRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order is pinned: the
          discount tier is keyed on the PRE-discount gross 500000 (tier 1, 0.03), producing
          authorized_amount_cents 485000; re-keying the tier on the post-discount amount
          485000 would fall below VOLUME_TIER1_CENTS and yield 0.00 / 500000 instead.
        test_recipe:
          setup:
            - "Payer 'Meridian Health' with snf_auth_required true and auth_expiry_days 30"
            - "Cedar SNF has an in_network NetworkContract at exactly 25000 cents/day"
            - "An Episode in PLANNING with a SUBMITTED AuthorizationRequest for 20 SNF days"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Meridian Health", coinsurance_pct: 0.200, snf_auth_required: true, hh_auth_required: true, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-2201", full_name: "Dee Salaam", date_of_birth: "1943-11-02", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Cedar SNF", provider_type: "SNF", quality_star_rating: 4, distance_miles_from_hospital: 6, bed_unit_codes: ["UNIT-A", "UNIT-B"] }
              as: PlatformAdmin
              captures: { prov_a: $.data.id }
            - call: "POST /network-contracts"
              payload: { payer_id: "${payer_id}", provider_id: "${prov_a}", in_network: true, negotiated_daily_rate_cents: 25000 }
              as: PlatformAdmin
              captures: { nc_a: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "EMERGENT", drg_code: "DRG-190", drg_gmlos_days: 4.0, attending_unit: "3N", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr_id: $.data.id }
            - call: "POST /screenings/${scr_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
            - call: "POST /episodes/${ep_id}/authorizations"
              payload: { provider_id: "${prov_a}", level_of_care: "SNF", requested_days: 20, billed_daily_rate_cents: 32000 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /authorizations/${auth_id}/decide"
              payload: { decision: "APPROVE" }
              as: PayerRepresentative
              as_user_id: "${payer_id}"
              captures: { award: $.data.authorized_amount_cents }
          assert:
            - "AuthorizationRequest.${auth_id}.status == APPROVED"
            - "AuthorizationRequest.${auth_id}.approved_days == 20"
            - "AuthorizationRequest.${auth_id}.rate_variant_applied == NETWORK_RATE"
            - "AuthorizationRequest.${auth_id}.gross_projection_cents == 500000"
            - "AuthorizationRequest.${auth_id}.volume_discount_pct == 0.03"
            - "AuthorizationRequest.${auth_id}.authorized_amount_cents == 485000"
            - "AuthorizationRequest.${auth_id}.expires_at == 2026-08-31T00:00:00.000Z"
            - "Episode.${ep_id}.authorized_days_total == 20"

  - rule_id: non_linear_state_machine
    instances:

      - name: episode_parallel_axes_posture_moves_while_case_status_holds
        grounds:
          - state_machines.Episode.barrier_posture.CLEAR_to_ESCALATED
          - state_machines.Episode.barrier_posture.ESCALATED_to_CLEAR
          - entities.Episode.fields.barrier_posture
          - entities.Episode.fields.case_status
          - calculations.barrier_posture_rollup
        distinguishing_aspect: |
          Non-linearity type: PARALLEL state dimensions on the Episode entity — barrier_posture
          travels CLEAR → ESCALATED → CLEAR while case_status stays fixed at PLANNING for the
          entire sequence, proving the two axes on the same row evolve independently.
        test_recipe:
          setup:
            - "An Episode whose ADMISSION screening is submitted with a patient that triggers no auto-barriers (has_pcp true, lives_alone false, functional_score 8)"
            - "The episode has been moved to PLANNING by recording a readmission-bundle flag, and barrier_posture is CLEAR"
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Lakeside Choice", coinsurance_pct: 0.200, snf_auth_required: false, hh_auth_required: false, auth_expiry_days: 30 }
              as: PlatformAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-3001", full_name: "Eve Nakamura", date_of_birth: "1960-05-30", primary_payer_id: "${payer_id}", prior_admissions_180d: 2, lives_alone: false, has_pcp: true }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", admission_type: "OBSERVATION", drg_code: "DRG-871", drg_gmlos_days: 5.0, attending_unit: "2S", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep_id: $.data.id }
            - call: "POST /episodes/${ep_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
