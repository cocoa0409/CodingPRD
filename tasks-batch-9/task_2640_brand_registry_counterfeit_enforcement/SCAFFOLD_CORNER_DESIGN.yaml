# =============================================================================
# SCAFFOLD CORNER DESIGN — task_2640 Brand Registry & Counterfeit Enforcement
# §1.9 breadth index. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; every literal is precomputed from the
# §1.3 formulas and the Mon-Fri business-day calendar. Corners already asserted
# by §1.8 appear as excluded_because stubs naming the covering instance.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: brand_create_returns_every_declared_field_with_its_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Brand
          - endpoints["POST /brand-protection/brands"]
          - response_envelope.success
        distinguishing_aspect: "A brand created from an empty database must come back with status DRAFT (no enrollment has ever existed), enforcement_spend_cents 0, version 1 and the success envelope's meta/response_type/data shape."
        test_recipe:
          setup:
            - "The database is empty and the logical clock is pinned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "data.name == Acme Tools, data.owner_legal_entity == Acme Tools LLC, data.home_jurisdiction == US"
            - "data.authorized_msrp_cents == 10000 and data.enforcement_budget_cents == 500000"
            - "data.enforcement_spend_cents == 0 and data.status == DRAFT"
            - "data.version == 1 and data.id is a UUID with no type prefix"

      - name: brand_enforcement_budget_defaults_to_500000_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Brand.fields.enforcement_budget_cents
          - endpoints["POST /brand-protection/brands"]
        distinguishing_aspect: "Omitting the optional enforcement_budget_cents must apply the declared default 500000 rather than 0 or null, which is what makes the budget rule quiescent for most tests."
        test_recipe:
          setup:
            - "The database is empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
          assert:
            - "HTTP 201 and Brand.${brand_id}.enforcement_budget_cents == 500000"
            - "Brand.${brand_id}.enforcement_spend_cents == 0"

      - name: registration_get_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - entities.TrademarkRegistration
          - endpoints["GET /brand-protection/trademark-registrations/{registrationId}"]
        distinguishing_aspect: "The registration read-back must echo every input field including principal_register and the caller-supplied status REGISTERED, proving status is an input field on this entity rather than a computed one."
        test_recipe:
          setup:
            - "One brand with one REGISTERED registration in nice class 8"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "GET /brand-protection/trademark-registrations/${reg_id}"
              as: EnforcementAnalyst
          assert:
            - "HTTP 200 and data.id == ${reg_id}"
            - "data.brand_id == ${brand_id}, data.registration_number == US-4455667, data.jurisdiction == US"
            - "data.nice_class == 8, data.registration_date == 2024-03-15, data.expiry_date == 2034-03-15"
            - "data.principal_register == true and data.status == REGISTERED"
            - "data.version == 1"

      - name: listing_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /brand-protection/listings"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three listings and limit 2, the first page must report total_count 3 and has_more true, and the second page exactly one row with has_more false — the counts describe the filtered set, not the page."
        test_recipe:
          setup:
            - "One brand, one seller and three NEW listings on that brand"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0PAGE001", title_text: "ACME wrench one", image_hash: "IMGP1", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0PAGE002", title_text: "ACME wrench two", image_hash: "IMGP2", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0PAGE003", title_text: "ACME wrench three", image_hash: "IMGP3", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
          trigger:
            - call: "GET /brand-protection/listings?brand_id=${brand_id}&limit=2&offset=0"
              as: EnforcementAnalyst
            - call: "GET /brand-protection/listings?brand_id=${brand_id}&limit=2&offset=2"
              as: EnforcementAnalyst
          assert:
            - "the first page returns HTTP 200 with response_type == array, 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page returns 1 row, total_count == 3, offset == 2 and has_more == false"
            - "every returned row has monitor_status NEW and enforcement_status NONE"

      - name: seller_get_with_unknown_id_returns_seller_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /brand-protection/sellers/{sellerId}"]
          - errors[ERR_SELLER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid UUID that names no row must return ERR_SELLER_NOT_FOUND / 404 in the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "The database contains no sellers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "GET /brand-protection/sellers/00000000-0000-4000-8000-000000000000"
              as: EnforcementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_SELLER_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: listing_create_without_image_hash_returns_4XX
        claim_type: Required Fields
        grounds:
          - entities.MonitoredListing.fields.image_hash
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "image_hash carries source input with no default, so omitting it must fail with ERR_INVALID_REQUEST / 400 before any FK lookup runs, and no listing row may be created."
        test_recipe:
          setup:
            - "One brand and one seller exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0MISSING1", title_text: "ACME wrench", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /brand-protection/listings?brand_id=${brand_id} returns 0 rows"

      - name: representative_effective_to_omitted_means_open_ended
        claim_type: Defaults
        grounds:
          - entities.AuthorizedRepresentative.fields.effective_to
          - endpoints["POST /brand-protection/representatives"]
        distinguishing_aspect: "effective_to is the only optional field on the designation; omitting it must persist null and be treated as +infinity, so the designation is still effective after the clock jumps a year forward."
        test_recipe:
          setup:
            - "An ACTIVE AMZ enrollment exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
          trigger:
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "BOTH", effective_from: "2026-08-01T00:00:00Z", power_of_attorney_ref: "POA-OPEN" }
              as: BrandAdministrator
              captures: { rep_id: $.data.id }
          assert:
            - "HTTP 201 and AuthorizedRepresentative.${rep_id}.effective_to == null"
            - "AuthorizedRepresentative.${rep_id}.designation_status == DESIGNATED and revoked_at == null"
            - "AuthorizedRepresentative.${rep_id}.authority_scope == BOTH"

      - name: brand_create_ignores_client_supplied_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - global_conventions.version_semantics
          - entities.Brand.fields.enforcement_spend_cents
          - endpoints["POST /brand-protection/brands"]
        distinguishing_aspect: "id, created_at, version and the computed ledger field are server-owned: supplying them must not be honoured, so version comes back 1 and enforcement_spend_cents 0 regardless of the request body."
        test_recipe:
          setup:
            - "The database is empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000, id: "11111111-1111-4111-8111-111111111111", version: 47, created_at: "2000-01-01T00:00:00.000Z", enforcement_spend_cents: 999999, status: "ENROLLED" }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
          assert:
            - "HTTP 201 and data.id != 11111111-1111-4111-8111-111111111111"
            - "data.version == 1 and data.enforcement_spend_cents == 0"
            - "data.status == DRAFT (the supplied ENROLLED is ignored; status is derived by calculations.brand_registry_posture)"
            - "data.created_at is the pinned clock instant 2026-08-05T09:00:00Z, not 2000-01-01T00:00:00.000Z"

      - name: enrollment_create_with_unknown_marketplace_code_returns_4XX
        claim_type: Type Constraints
        grounds:
          - entities.MarketplaceEnrollment.fields.marketplace_code
          - validations[priority=3]
        distinguishing_aspect: "marketplace_code is an enum over exactly {AMZ, EBY, WLM}; a fourth value must be refused as a shape error at priority 3, ahead of the FK and OCC checks that would otherwise pass."
        test_recipe:
          setup:
            - "One brand with one REGISTERED registration exists and the brand is at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "ETSY", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Brand.${brand_id}.status == DRAFT and Brand.${brand_id}.version == 1 (nothing was persisted)"
            - "GET /brand-protection/enrollments?brand_id=${brand_id} returns 0 rows"

      - name: takedown_create_with_unknown_evidence_package_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints["POST /brand-protection/takedowns"]
          - errors[ERR_EVIDENCE_PACKAGE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "Body foreign keys are validated in the order declared by the endpoint's input list, so a takedown quoting a real enrollment and claim but a non-existent evidence_package_id must fail with ERR_EVIDENCE_PACKAGE_NOT_FOUND / 404."
        test_recipe:
          setup:
            - "An ACTIVE enrollment and a SUBSTANTIATED claim exist; no evidence package has been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 0, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 1.00, text_match_score: 1.00 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /brand-protection/claims/${claim_id}/substantiate"
              as: EnforcementAnalyst
          trigger:
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "${enr_id}", claim_id: "${claim_id}", evidence_package_id: "00000000-0000-4000-8000-0000000000ff" }
              as: EnforcementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_EVIDENCE_PACKAGE_NOT_FOUND"
            - "GET /brand-protection/takedowns?claim_id=${claim_id} returns 0 rows"
            - "InfringementClaim.${claim_id}.status == SUBSTANTIATED (unchanged)"

      - name: claim_create_with_two_bad_foreign_keys_returns_brand_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=5]
          - endpoints["POST /brand-protection/claims"]
        distinguishing_aspect: "The flat topology validates body FKs strictly in the declared input order, so when both brand_id and listing_id are unknown the response must be ERR_BRAND_NOT_FOUND — the first field in the list — and never ERR_LISTING_NOT_FOUND."
        test_recipe:
          setup:
            - "The database contains a brand, a registration and a FLAGGED listing, none of which are the ids used in the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "00000000-0000-4000-8000-0000000000aa", listing_id: "00000000-0000-4000-8000-0000000000bb", asserted_registration_id: "${reg_id}", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_BRAND_NOT_FOUND (not ERR_LISTING_NOT_FOUND)"
            - "GET /brand-protection/claims?brand_id=${brand_id} returns 0 rows"

      - name: listing_screen_scores_are_server_owned_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.MonitoredListing.fields.match_score
          - entities.MonitoredListing.fields.price_deviation_factor
          - endpoints["POST /brand-protection/listings"]
        distinguishing_aspect: "A create that tries to seed match_score, price_deviation_factor, monitor_status and violation_type must be ignored: an unscreened listing carries null scores and NEW / NONE until screen is called."
        test_recipe:
          setup:
            - "One brand and one seller exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0SEED001", title_text: "ACME wrench", image_hash: "IMGSEED", price_cents: 3000, nice_class: 8, match_score: 0.9900, price_deviation_factor: 0.1000, monitor_status: "FLAGGED", violation_type: "COUNTERFEIT", image_match_score: 0.99, text_match_score: 0.99 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
          assert:
            - "HTTP 201 and MonitoredListing.${listing_id}.monitor_status == NEW"
            - "MonitoredListing.${listing_id}.violation_type == NONE"
            - "MonitoredListing.${listing_id}.image_match_score == null and text_match_score == null"
            - "MonitoredListing.${listing_id}.match_score == null and price_deviation_factor == null"
            - "MonitoredListing.${listing_id}.version == 1"

  - section: state_machines
    instances:
      - name: registration_lapse_by_sweep_is_terminal_and_replay_changes_nothing
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TrademarkRegistration.REGISTERED_to_LAPSED
          - endpoints["POST /brand-protection/ops/run-enforcement-sweep"]
        distinguishing_aspect: "LAPSED is the registration's only terminal state: the first sweep past expiry_date reports lapsed_registration_count 1, and an immediate second sweep at the same clock must report 0 and leave version untouched."
        test_recipe:
          setup:
            - "One REGISTERED registration expiring 2026-08-20 with no enrollment asserting it, so step 1 has no enrollment cascade to run"
            - "The clock is moved to 2026-08-24T09:00:00Z, four days past expiry"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
