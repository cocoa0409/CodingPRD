  # =========================================================================
  # Rule 3 -- non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: tryin_adjust_resubmit_cycle_on_the_same_row
        grounds:
          - state_machines.TryInMilestone.PENDING_APPROVAL_to_ADJUST_REQUESTED
          - state_machines.TryInMilestone.ADJUST_REQUESTED_to_PENDING_APPROVAL
          - state_machines.TryInMilestone.PENDING_APPROVAL_to_APPROVED
          - entities.TryInMilestone.fields.adjust_count
        distinguishing_aspect: |
          CYCLE on the TryInMilestone entity: the SAME row returns to PENDING_APPROVAL
          twice through ADJUST_REQUESTED, and adjust_count is cumulative across the loop
          (2 after two passes, never reset), which is what makes the ceiling reachable.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case with one MAXILLARY arch in MILESTONE_PENDING after an ACCEPTED impression."
            - "One WAX TryInMilestone in PENDING_APPROVAL with adjust_count 0."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
