scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plan_fee_provisional_vs_final_diverge
        grounds:
          - calculations.fee_proration
          - entities.InspectionPlan.fields.provisional_fee_cents
          - entities.InspectionPlan.fields.final_fee_cents
        distinguishing_aspect: |
          Same plan inputs produce two different fees because the PROVISIONAL
          variant prorates by calendar days (139/365) while the FINAL variant
          prorates by remaining whole months (4/12): 45699 vs 40000 cents on a
          single FIRE_ALARM system installed 2026-08-15.
        test_recipe:
          setup:
            - "Contractor ACTIVE, posture GOOD_STANDING"
            - "Property P (BUSINESS) under contractor"
            - "One FIRE_ALARM ProtectedSystem with install_date 2026-08-15"
            - "One IN_SERVICE SMOKE_DETECTOR device (so the plan is non-empty)"
            - "Logical clock at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Acme Fire Protection", state_license_no: "C-1001" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "10 Ember Way", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-08-15", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id, plan_prov: $.data.provisional_fee_cents }
          trigger:
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "captured plan_prov == 45699"
            - "InspectionPlan.${plan_id}.final_fee_cents == 40000"
            - "InspectionPlan.${plan_id}.provisional_fee_cents == 45699 (retained after publish)"
            - "InspectionPlan.${plan_id}.plan_posture == SCHEDULED"
      - name: compliance_score_provisional_vs_audited_diverge
        grounds:
          - calculations.compliance_score_recompute
          - calculations.posture_derive
          - entities.Contractor.fields.compliance_score
        distinguishing_aspect: |
          On the identical contractor ledger, the PROVISIONAL variant (persisted
          on Contractor.compliance_score) yields 840 while the AUDITED variant
          (returned by audit-score) adds the on-time-event bonus +2 for the
          single on-time COMPLETED event and no license deduction, yielding 842
          — same data, different entity-domain metric than plan fees.
        test_recipe:
          setup:
            - "Contractor with: 1 overdue OPEN CRITICAL deficiency (-40), 2 overdue OPEN NONCRITICAL deficiencies (-20), 1 late SUBMITTED marshal report (-25), 1 late NOTIFIED impairment (-60), 1 ASSESSED NEGLIGENCE false alarm (-15)"
            - "1 COMPLETED on-time inspection event within trailing 90 days (for audit bonus +2)"
            - "No EXPIRED/REVOKED license records"
            - "Clock positioned 2026-08-15"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Delta Fire", state_license_no: "C-2002" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "5 Ash Ct", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-05-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-9" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Tess Torres", nicet_level: "III" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-06-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "CRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { def_crit: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "NONCRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "NONCRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "UNPLANNED", planned_start: "2026-08-03T08:00:00Z", planned_end: "2026-08-03T12:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { imp_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/impairments/${imp_id}/notify-authority"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/impairments/${imp_id}/restore"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/false-alarm-cases"
              payload: { alarm_occurred_at: "2026-08-04T03:00:00Z", cause_code: "NEGLIGENCE" }
              as: FireMarshal
              captures: { fa_id: $.data.id }
            - call: "POST /fire-compliance/false-alarm-cases/${fa_id}/assess"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: FireMarshal
            - call: "GET /fire-compliance/inspection-events/${ev_id}/marshal-reports"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { rep_id: "$.data[0].id" }
            - call: "POST /fire-compliance/marshal-reports/${rep_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/contractors/${con_id}/audit-score"
              payload: {}
              as: FireMarshal
              captures: { aud: $.data.audited_score, prov: $.data.provisional_score }
          assert:
            - "captured prov == 840"
            - "captured aud == 842 (840 + min(50, 2*1) on-time-event bonus, no license deduction)"
            - "Contractor.${con_id}.compliance_score == 840 (persisted provisional)"
            - "Contractor.${con_id}.posture == PROBATION (840 < 850)"
            - "aud != prov"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes: (b) then (a))
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: backflow_penalty_round_per_month_compounding
        grounds:
          - calculations.backflow_late_penalty
          - entities.BackflowTest.fields.unpaid_balance_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: compounding 5% monthly with round_half_up
          after EACH month yields 46305 cents after 3 months, whereas
          round-at-end would yield 40000*1.05^3 rounded once = 46305 only by
          coincidence at 3 months; the pinned order is verified at 2 months
          (44100) and 3 months (46305) against naive single-rounding drift.
        test_recipe:
          setup:
            - "Contractor, property, BACKFLOW system with BACKFLOW_ASSEMBLY device, technician with ACTIVE BACKFLOW license"
            - "BackflowTest PASS recorded, invoiced 2026-08-02; due date 2026-09-01"
            - "Clock advanced to 2026-12-02 (3 whole months past due)"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "FlowGuard", state_license_no: "C-3003" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "8 Valve St", occupancy_class: "MERCANTILE", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "BACKFLOW", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "BACKFLOW_ASSEMBLY", serial_no: "BF-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Pat Pipe", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "BACKFLOW", issued_on: "2026-01-01", expires_on: "2028-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/systems/${sys_id}/backflow-tests"
              payload: { device_id: "${dev_id}", tester_technician_id: "${tech_id}", tested_at: "2026-08-01T10:00:00Z", result: "PASS" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { bt_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/backflow-tests/${bt_id}/invoice"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/backflow-tests/${bt_id}/record-payment"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "BackflowTest.${bt_id}.status == PAID"
            - "BackflowTest.${bt_id}.unpaid_balance_cents == 0 after payment"
            - "compounded penalty observed pre-zeroing equals 46305 cents (40000 -> 42000 -> 44100 -> 46305, rounding after each month)"
      - name: permit_fee_marginal_tier_straddle
        grounds:
          - calculations.permit_fee_tiers
          - entities.ModificationPermit.fields.permit_fee_cents
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with >=3 inputs interacting
          non-linearly (valuation split across marginal brackets, minimum-fee
          floor, single end-rounding): 350000 cents valuation yields 9750
          (straddles tier1+tier2), while 100000 yields the 7500 floor, proving
          marginal (not average) rate semantics.
        test_recipe:
          setup:
            - "Contractor, property, SPRINKLER system installed 2026-01-01"
            - "Clock 2026-08-01"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "HydroShield", state_license_no: "C-4004" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "12 Main", occupancy_class: "STORAGE", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id, sys_v: $.data.version }
            - call: "POST /fire-compliance/systems/${sys_id}/modification-permits"
              payload: { project_valuation_cents: 350000, expected_system_version: "${sys_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { permit_a: $.data.id, fee_a: $.data.permit_fee_cents }
          trigger:
            - call: "GET /fire-compliance/systems/${sys_id}"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_v2: $.data.version }
            - call: "POST /fire-compliance/systems/${sys_id}/modification-permits"
              payload: { project_valuation_cents: 100000, expected_system_version: "${sys_v2}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { fee_b: $.data.permit_fee_cents }
          assert:
            - "captured fee_a == 9750"
            - "captured fee_b == 7500 (minimum floor binds: 3% of 100000 = 3000 < 7500)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deficiency_correction_rejection_cycle
        grounds:
          - state_machines.Deficiency.OPEN_to_CORRECTED
          - state_machines.Deficiency.CORRECTED_to_OPEN
          - state_machines.Deficiency.CORRECTED_to_VERIFIED
        distinguishing_aspect: |
          Deficiency exhibits a correction/rejection CYCLE
          (OPEN->CORRECTED->OPEN->CORRECTED->VERIFIED) and the late fee
          keeps accruing against the ORIGINAL deadline with no reset — the
          second correction after rejection lands a larger late fee than the
          first attestation would have.
        test_recipe:
          setup:
            - "Completed inspection event on 2026-08-03 producing a NONCRITICAL deficiency (deadline 2026-09-02)"
            - "Clock advanced so first correction attested 2026-08-10 (before deadline, fee 0), then rejected, then re-attested 2026-09-07 (5 days late)"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Cycle Test Co", state_license_no: "C-5005" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "3 Loop Rd", occupancy_class: "BUSINESS", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "FIRE_ALARM", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "PULL_STATION", serial_no: "PS-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Sam Wire", nicet_level: "II" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/inspection-events/${ev_id}/deficiencies"
              payload: { device_id: "${dev_id}", classification: "NONCRITICAL" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { def_id: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/deficiencies/${def_id}/attest-correction"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/deficiencies/${def_id}/reject-correction"
              payload: {}
              as: FireMarshal
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: FireMarshal
          trigger:
            - call: "POST /fire-compliance/deficiencies/${def_id}/attest-correction"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "Deficiency.${def_id}.status == CORRECTED"
            - "Deficiency.${def_id}.correction_deadline == 2026-09-02 (original deadline retained after cycle)"
            - "Deficiency.${def_id}.late_fee_cents == 25000 (5 days late x 5000)"
      - name: marshal_report_reject_revision_loop
        grounds:
          - state_machines.MarshalReport.SUBMITTED_to_REJECTED
          - state_machines.MarshalReport.REJECTED_to_DRAFT
          - state_machines.MarshalReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          MarshalReport expresses a revision LOOP across rows
          (SUBMITTED->REJECTED, then a revision row DRAFT->SUBMITTED->ACCEPTED),
          a cyclic machine on MarshalReport, distinct from the Deficiency
          correction cycle.
        test_recipe:
          setup:
            - "Completed event with auto-created DRAFT report; report submitted then REJECTED by marshal"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Report Loop Inc", state_license_no: "C-6006" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "9 Loop Ave", occupancy_class: "ASSEMBLY", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SPRINKLER_HEAD", serial_no: "SH-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Rita Spray", nicet_level: "III" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "SPRINKLER", issued_on: "2026-01-01", expires_on: "2027-01-01" }
              as: ContractorAdmin
