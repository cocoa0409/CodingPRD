  # ===========================================================================
  - section: rbac
    instances:
      - name: operator_cannot_verify_tests
        claim_type: role_denial
        grounds:
          - roles.QualityControlAnalyst
          - endpoints.POST_/tests/{id}/verify
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "POST /tests/{id}/verify is exclusive to QualityControlAnalyst; a ManufacturingOperator is rejected 403 ERR_FORBIDDEN_ROLE at priority 2, before the four-eyes check."
        test_recipe:
          setup:
            - "Batch in UPSTREAM with a RECORDED test."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
          trigger:
            - call: "POST /tests/${t_up}/verify"
              payload: {}
              as: ManufacturingOperator
              as_user_id: "op-9"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and ${err} == ERR_FORBIDDEN_ROLE (role denial, not ERR_FOUR_EYES_VIOLATION)"
            - "InProcessTest.${t_up}.status remains RECORDED"

      - name: process_engineer_cannot_disposition
        claim_type: role_denial
        grounds:
          - roles.QualityAssuranceReviewer
          - endpoints.POST_/batches/{id}/disposition
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Disposition is exclusive to QualityAssuranceReviewer; a ProcessEngineer is rejected 403 even on a disposition-ready batch."
        test_recipe:
          setup:
            - "Commercial batch at PENDING_DISPOSITION."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
            - *k_verify_up
            - *k_adv_down
            - *k_getb
            - *k_test_t1
            - *k_verify_t1
            - *k_getb3
            - *k_test_t2
            - *k_verify_t2
            - *k_adv_pc
            - *k_submit
          trigger:
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "Engineer attempting release" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and ${err} == ERR_FORBIDDEN_ROLE"
            - "BatchLot.${batch_id}.quality_status remains PENDING_DISPOSITION"

      - name: qa_reviewer_cannot_record_tests
        claim_type: role_denial
        grounds:
          - roles.ManufacturingOperator
          - endpoints.POST_/batches/{id}/tests
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Test recording is exclusive to ManufacturingOperator; the QA reviewer role (which dispositions the same batch) is denied, keeping record and review in different hands at the role level too."
        test_recipe:
          setup:
            - "Batch in UPSTREAM."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
          trigger:
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 85.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_v}" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and ${err} == ERR_FORBIDDEN_ROLE"
            - "GET /batches/${batch_id}/tests returns 0 rows"

      - name: campaign_create_missing_auth_headers_returns_400
        claim_type: Violation
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request sent without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER at priority 1, before role or existence checks."
