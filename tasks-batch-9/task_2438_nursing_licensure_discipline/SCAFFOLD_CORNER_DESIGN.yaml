        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.renewal-create-stale-license
          - endpoints.POST /renewal-applications
          - errors.ERR_STALE_VERSION
          - validations[priority=9]
        distinguishing_aspect: "Creating the first renewal bumps License.version, so a second create replaying the pre-supersede version is a stale-view write and is refused with 412 — while the same call carrying the refreshed version is accepted and legitimately supersedes the DRAFT predecessor. The rejection leaves the predecessor DRAFT and does not create a second row."
        test_recipe:
          setup:
            - "Nurse Dana Reed holds an ACTIVE RN licence under board OH, at version 1 immediately after issuance."
            - "Renewal R1 was created against version 1, which advanced the licence to version 2."
