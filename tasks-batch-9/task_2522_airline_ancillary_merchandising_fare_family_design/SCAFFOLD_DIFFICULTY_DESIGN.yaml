              captures: { ch_meta_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_meta_id}", expected_fare_family_version: "${f_lite_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
