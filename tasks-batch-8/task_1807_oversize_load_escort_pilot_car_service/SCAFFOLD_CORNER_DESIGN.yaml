        claim_type: side_effect_execution
        grounds: [state_machines.Job.BOOKED_to_CANCELLED, state_machines.EscortAssignment.ACCEPTED_to_RELEASED]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_settle_suspension_release_demote
          rationale: "Assignment release with cascade demotion (release_cause and SCHEDULED -> CLEARED) is asserted end-to-end by the named §1.8 instance; the JOB_CANCELLED cause variant follows the same code path."

