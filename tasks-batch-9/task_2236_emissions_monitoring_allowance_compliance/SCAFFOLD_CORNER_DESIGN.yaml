      - name: calc_known_inputs_produce_the_documented_hourly_result
        claim_type: correct_result
        grounds:
          - calculations.hourly_heat_input_and_mass
        excluded_because:
          difficulty_instance: dual_variant_heat_input_cems_vs_appendix_d_same_hour_diverges
          rationale: "That instance asserts every field of both worked-example hours (555.556 / 292.2 / 100.0 / 59.700 and 562.500 / 765.0 / 101.3 / 57.741) against literals computed from the formula."

      - name: calc_rounding_mode_and_decimal_places_are_honoured
        claim_type: precision
        grounds:
          - calculations.quarterly_report_totals
        excluded_because:
          difficulty_instance: combinatorial_report_total_so2_rounds_per_hour_before_summing
          rationale: "That instance separates per-hour rounding from raw-sum rounding (876.6 vs 876.5-class drift) and pins the 1 dp / 3 dp round_half_up contract at the report level."

      - name: calc_running_total_is_correct_after_add_and_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.quarterly_report_totals
          - calculations.monitor_data_availability_pct
        excluded_because:
          difficulty_instance: invariant_hour_classification_partition_and_heat_input_survive_flip_and_substitution
          rationale: "The report totals and the availability denominator are re-asserted after an append, after a cascade flip and after a substitution, which is the add-then-reverse aggregation claim."

      - name: calc_substitution_tier_boundaries_each_select_their_own_value
        claim_type: tiered_pricing
        grounds:
          - calculations.missing_data_substitution
        excluded_because:
          difficulty_instance: combinatorial_substitution_tier_uses_pinned_availability_evaluation_order
          rationale: "That instance drives two consecutive substitutions into T1_90TH_PERCENTILE and T4_MAX_POTENTIAL_CONCENTRATION with the availability snapshot frozen per hour, covering the tier-boundary claims."

      - name: calc_waterfall_fills_the_prior_bucket_before_the_current_one
        claim_type: waterfall_allocation
        grounds:
          - calculations.allowance_true_up_waterfall
        excluded_because:
          difficulty_instance: invariant_allowance_tonnage_conserved_across_settle_and_reverse
          rationale: "That instance asserts debited_prior_tons 7.000 before debited_current_tons 3.000 on a 10-ton surrender and closes the conservation identity at 40.000, which is the bucket-order and remainder claim."

      - name: calc_variants_diverge_on_identical_underlying_data
        claim_type: variant_divergence
        grounds:
          - calculations.hourly_heat_input_and_mass.variants
        excluded_because:
          difficulty_instance: dual_variant_heat_input_cems_vs_appendix_d_same_hour_diverges
          rationale: "The two heat-input variants are computed for the same physical hour and the 6.944 mmBtu / 472.8 lb delta is asserted explicitly."

      - name: calc_variant_selection_follows_the_declared_context
        claim_type: variant_selection
        grounds:
          - calculations.hourly_heat_input_and_mass.variants
          - validations[priority=335]
        excluded_because:
          difficulty_instance: dual_variant_appendix_d_hour_rejects_cems_measurement_fields
          rationale: "Variant selection is driven by heat_input_method, and that instance proves the wrong-variant field set is rejected with ERR_METHOD_FIELD_MISMATCH rather than silently ignored."

      - name: calc_variant_switch_reconciles_into_the_stored_ledger
        claim_type: reconciliation
        grounds:
          - calculations.relative_accuracy_and_bias
          - entities.MonitoringSystem.fields.bias_adjustment_factor
        excluded_because:
          difficulty_instance: dual_variant_rata_reference_mean_vs_applicable_standard_flips_verdict
          rationale: "Switching the relative-accuracy denominator flips the verdict and the resulting bias_adjustment_factor 1.0883 is reconciled into the next hour's SO2 mass (318.0 lb), which is the variant-switch delta claim."

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: val_applicable_standard_basis_is_reserved_for_low_emitters
        claim_type: conditional_validation
        grounds:
          - validations[priority=275]
          - errors[ERR_RA_BASIS_NOT_PERMITTED]
          - calculations.relative_accuracy_and_bias.constants.LOW_EMITTER_REFERENCE_MEAN
        distinguishing_aspect: "The APPLICABLE_STANDARD basis is refused twice for different reasons — no applicable_standard_value was recorded on the test, and a NOX_RATE test whose reference_mean 0.4000 exceeds the 0.300 low-emitter ceiling — while the REFERENCE_MEAN basis evaluates the same runs successfully."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "U1 ONLINE with an SO2 CEM and a NOX_RATE CEM"
            - "SO2 test S has 9 runs (reference_mean 0.2700) and no applicable_standard_value"
            - "NOX test N has 9 runs (reference_mean 0.4000) and applicable_standard_value 0.500"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { so2_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
