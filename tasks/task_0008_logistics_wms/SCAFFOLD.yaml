# =============================================================================
# Logistics Warehouse WMS System — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  ## 8. Logistics Warehouse WMS System

  **Extended System Functional Description:**

  Warehouse management system: inbound quality inspection with sampling rules, ASN matching, defect recording, and non-conforming goods quarantine; bin allocation with item-category zoning, weight and volume constraints, and replenishment distance optimization; wave picking with batch/zone/order-based strategies, pick path optimization, and short-pick handling; packing and shipping with carton selection, multi-carrier label generation, and shipping document printing; cycle count and full inventory with variance investigation, adjustment approval, and audit trail; lot and batch traceability with forward and backward tracking and recall scope identification; expiry alerting with FEFO picking enforcement, near-expiry warning thresholds, and disposal workflow; event-driven synchronization with ERP, TMS, and OMS systems; risk control for inventory shrinkage and abnormal operation detection.

domain_name: logistics-wms
api_prefix: /warehouses

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse name" }
      - { name: dock_position_x, type: integer, source: input, description: "X coordinate of inbound dock (origin for distance calculations)" }
      - { name: dock_position_y, type: integer, source: input, description: "Y coordinate of inbound dock" }
      - { name: putaway_strategy, type: enum, source: input, default: "DISTANCE_OPTIMIZED", description: "DISTANCE_OPTIMIZED | CAPACITY_OPTIMIZED — selects bin_putaway_selection variant" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops" }
      - { name: clock_now, type: datetime, source: system, description: "Simulated wall clock; advanced via /_clock/advance and used for expiry checks" }
      - { name: shrinkage_value_30d_cents, type: integer, source: computed, default: 0, description: "Sum of variance_value_cents for cycle counts ADJUSTED in last 30 simulated days" }
      - { name: abnormal_event_count_24h, type: integer, source: computed, default: 0, description: "Count of abnormal operation events (short-pick, variance, fail-inspect) in last 24 simulated hours" }
      - { name: recall_count_open, type: integer, source: computed, default: 0, description: "Number of currently RECALLED lots" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Aggregate risk score (see §1.3 risk_score)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from risk_score" }

  - name: Bin
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: bin_code, type: string, source: input, description: "Human-readable bin code (unique within warehouse)" }
      - { name: zone, type: enum, source: input, description: "AMBIENT | COLD | HAZMAT | RETURNS — must match Lot.category for putaway" }
      - { name: position_x, type: integer, source: input, description: "X coordinate within warehouse grid" }
      - { name: position_y, type: integer, source: input, description: "Y coordinate within warehouse grid" }
      - { name: capacity_volume_cm3, type: integer, source: input, description: "Total volume capacity (cubic centimeters)" }
      - { name: capacity_weight_g, type: integer, source: input, description: "Total weight capacity (grams)" }
      - { name: used_volume_cm3, type: integer, source: computed, default: 0, description: "Sum over Inventory rows in this bin of (qty_units × Lot.unit_volume_cm3)" }
      - { name: used_weight_g, type: integer, source: computed, default: 0, description: "Sum over Inventory rows in this bin of (qty_units × Lot.unit_weight_g)" }
      - { name: remaining_volume_cm3, type: integer, source: computed, description: "= capacity_volume_cm3 - used_volume_cm3" }
      - { name: remaining_weight_g, type: integer, source: computed, description: "= capacity_weight_g - used_weight_g" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | FROZEN — frozen while a SCHEDULED or COUNTING CycleCount targets the bin" }
      - { name: frozen_by_cycle_count_id, type: string, source: system, description: "id of CycleCount holding the freeze; null when ACTIVE" }
      - { name: distance_from_dock, type: number, source: computed, description: "= sqrt((position_x - Warehouse.dock_position_x)^2 + (position_y - Warehouse.dock_position_y)^2)" }

  - name: Lot
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: lot_code, type: string, source: input, description: "Lot code (unique within warehouse)" }
      - { name: sku, type: string, source: input, description: "SKU identifier" }
      - { name: category, type: enum, source: input, description: "AMBIENT | COLD | HAZMAT | RETURNS — must match Bin.zone for putaway" }
      - { name: unit_weight_g, type: integer, source: input, description: "Weight of one unit (grams)" }
      - { name: unit_volume_cm3, type: integer, source: input, description: "Volume of one unit (cubic centimeters)" }
      - { name: unit_value_cents, type: integer, source: input, description: "Value of one unit (cents) used for variance valuation" }
      - { name: manufacture_date, type: datetime, source: input, description: "Manufacture date (ISO 8601 UTC)" }
      - { name: expiry_date, type: datetime, source: input, description: "Expiry date (ISO 8601 UTC)" }
      - { name: received_at, type: datetime, source: system, description: "Set when first putaway from inbound completes; used by FIFO selector" }
      - { name: supplier_lot_ref, type: string, source: input, description: "External supplier reference (for traceability)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | NEAR_EXPIRY | EXPIRED | QUARANTINED | RECALLED | DISPOSED" }
      - { name: recalled_at, type: datetime, source: system, description: "Set on transition to RECALLED" }
      - { name: recall_reason, type: enum, source: input, description: "SUPPLIER_RECALL | SAFETY_ISSUE | EXPIRY_BATCH — set on RECALLED transition" }

  - name: InboundShipment
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: asn_number, type: string, source: input, description: "Advance Shipping Notice number (unique within warehouse)" }
      - { name: supplier_name, type: string, source: input, description: "Supplier name" }
      - { name: declared_total_units, type: integer, source: input, description: "Total declared units across all lines (must equal sum of InboundLine.declared_units; ASN-match check)" }
      - { name: inspection_sample_size, type: integer, source: computed, description: "Sample size per §1.3 inspection_sample_size; computed when transition ASN_RECEIVED→INSPECTING" }
      - { name: inspection_defect_count, type: integer, source: input, description: "Total defect units found in sample (provided on complete_inspection)" }
      - { name: defect_rate, type: number, source: computed, description: "= inspection_defect_count / inspection_sample_size; rounded to 4 decimals (round_half_up)" }
      - { name: status, type: enum, source: system, default: "ASN_RECEIVED", description: "ASN_RECEIVED | INSPECTING | PASSED | FAILED | PUTAWAY | QUARANTINED | CLOSED" }

  - name: InboundLine
    parent: InboundShipment
    common_fields: true
    fields:
      - { name: inbound_shipment_id, type: string, source: system, description: "Parent shipment id" }
      - { name: lot_id, type: string, source: input, description: "Target Lot id (Lot must already exist in ACTIVE state, same warehouse)" }
      - { name: declared_units, type: integer, source: input, description: "Declared unit count for this line" }
      - { name: received_units, type: integer, source: input, description: "Actual received units (set on complete_inspection)" }
      - { name: bin_id, type: string, source: system, description: "Target bin chosen by putaway selector; set on PUTAWAY transition" }
      - { name: status, type: enum, source: system, default: "PENDING_INSPECTION", description: "PENDING_INSPECTION | INSPECTED_PASS | INSPECTED_FAIL | PUTAWAY | QUARANTINED" }

  - name: Inventory
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: bin_id, type: string, source: system, description: "Bin holding the inventory (set on putaway)" }
      - { name: lot_id, type: string, source: system, description: "Lot held in this bin" }
      - { name: qty_units, type: integer, source: system, default: 0, description: "Physical units present in this (bin, lot) pair" }
      - { name: reserved_units, type: integer, source: system, default: 0, description: "Units reserved by open PickTasks (CREATED or PICKING) on this row" }
      - { name: available_units, type: integer, source: computed, description: "= qty_units - reserved_units" }

  - name: Wave
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: wave_code, type: string, source: input, description: "Human-readable wave code (unique within warehouse)" }
      - { name: strategy, type: enum, source: input, description: "BATCH | ZONE | ORDER" }
      - { name: order_ids, type: array, source: input, description: "Order ids included in the wave (ALLOCATED status only at release time)" }
      - { name: planned_unit_count, type: integer, source: computed, description: "Sum of PickTask.planned_units across the wave" }
      - { name: picked_unit_count, type: integer, source: computed, default: 0, description: "Sum of PickTask.picked_units for terminal pick tasks in the wave" }
      - { name: total_path_distance, type: number, source: computed, description: "Per §1.3 wave_pick_path_distance" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | RELEASED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: released_at, type: datetime, source: system, description: "Set on PLANNED→RELEASED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on transition to COMPLETED" }

  - name: Order
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: order_number, type: string, source: input, description: "External order number (unique within warehouse)" }
      - { name: customer_name, type: string, source: input, description: "Customer name (for shipping label)" }
      - { name: requested_lines, type: array, source: input, description: "Array of {sku, qty_units} (≥1 entry; qty_units≥1)" }
      - { name: pick_strategy, type: enum, source: input, default: "FEFO", description: "FEFO | FIFO — selector for lot allocation" }
      - { name: carrier, type: enum, source: input, description: "UPS | FEDEX | USPS — chosen at order creation" }
      - { name: status, type: enum, source: system, default: "CREATED", description: "CREATED | ALLOCATED | PICKING | PICKED | SHORT_PICKED | PACKED | SHIPPED | CANCELLED" }
      - { name: wave_id, type: string, source: system, description: "Wave the order is grouped into; set on Wave creation" }
      - { name: provisional_carton_count, type: integer, source: computed, description: "Per §1.3 carton_count_calc, variant=PROVISIONAL; set on ALLOCATED" }
      - { name: final_carton_count, type: integer, source: computed, description: "Per §1.3 carton_count_calc, variant=FINAL; set on PACKED" }
      - { name: shipping_label_id, type: string, source: system, description: "Generated on PACKED→SHIPPED" }
      - { name: tracking_number, type: string, source: system, description: "Generated on PACKED→SHIPPED, prefixed by carrier" }

  - name: PickTask
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Parent order id" }
      - { name: wave_id, type: string, source: system, description: "Wave that released this pick task" }
      - { name: bin_id, type: string, source: system, description: "Source bin (set at allocation)" }
      - { name: lot_id, type: string, source: system, description: "Source lot (set at allocation)" }
      - { name: inventory_id, type: string, source: system, description: "Inventory row reserved for this pick" }
      - { name: planned_units, type: integer, source: system, description: "Units to pick" }
      - { name: picked_units, type: integer, source: input, default: 0, description: "Units actually picked (provided on complete)" }
      - { name: sequence, type: integer, source: system, description: "Pick path order within the wave (ascending bin_code, see §1.3 wave_pick_path_distance)" }
      - { name: status, type: enum, source: system, default: "CREATED", description: "CREATED | PICKING | PICKED | SHORT_PICKED | FAILED | CANCELLED" }

  - name: CycleCount
    parent: Warehouse
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "Parent warehouse id" }
      - { name: bin_id, type: string, source: input, description: "Bin being counted (must be ACTIVE at scheduling)" }
      - { name: lot_id, type: string, source: input, description: "Lot being counted in that bin" }
      - { name: book_qty, type: integer, source: system, description: "Inventory.qty_units snapshot at scheduling time" }
      - { name: counted_qty, type: integer, source: input, description: "Counted units (provided on submit_count)" }
      - { name: variance_units, type: integer, source: computed, description: "= counted_qty - book_qty (signed)" }
      - { name: variance_value_cents, type: integer, source: computed, description: "Per §1.3 variance_valuation; rounded per cycle count then summed at warehouse level" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COUNTING | RECONCILED | VARIANCE_FOUND | ADJUSTED | DISPUTED" }
      - { name: scheduled_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submit_count caller" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approve_adjustment caller" }
      - { name: approved_at, type: datetime, source: system, description: "Set on approve_adjustment" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InboundShipment
    initial_state: ASN_RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: ASN_RECEIVED
        to: INSPECTING
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/start_inspection"
        actor: WarehouseStaff
        preconditions:
          - "ASN match: declared_total_units == sum(InboundLine.declared_units) (else ERR_ASN_MISMATCH)"
          - "All InboundLine.lot_id reference Lot rows in ACTIVE status (else ERR_LOT_NOT_ACTIVE)"
        side_effects:
          - "inspection_sample_size computed per §1.3 inspection_sample_size from declared_total_units"

      - from: INSPECTING
        to: PASSED
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/complete_inspection"
        actor: WarehouseStaff
        preconditions:
          - "inspection_defect_count is between 0 and inspection_sample_size inclusive (else ERR_INVALID_INPUT)"
          - "defect_rate <= 0.025 (PASS threshold; defect_rate computed per §1.3)"
        side_effects:
          - "Each InboundLine.status: PENDING_INSPECTION → INSPECTED_PASS"

      - from: INSPECTING
        to: FAILED
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/complete_inspection"
        actor: WarehouseStaff
        preconditions:
          - "defect_rate > 0.025"
        side_effects:
          - "Each InboundLine.status: PENDING_INSPECTION → INSPECTED_FAIL"
          - "Warehouse.abnormal_event_count_24h += 1 (single increment per failed inspection)"

      - from: FAILED
        to: INSPECTING
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/rework"
        actor: WarehouseStaff
        preconditions:
          - "Status is FAILED"
        side_effects:
          - "inspection_defect_count and defect_rate cleared (set to null)"
          - "Each InboundLine.status: INSPECTED_FAIL → PENDING_INSPECTION"

      - from: PASSED
        to: PUTAWAY
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/putaway"
        actor: WarehouseStaff
        preconditions:
          - "Each InboundLine has received_units > 0 in payload"
          - "For each line: bin_putaway_selection (§1.3) yields a non-empty candidate set (else ERR_NO_BIN_AVAILABLE for that line)"
        side_effects:
          - "For each line: chosen bin selected per §1.3 bin_putaway_selection; line.bin_id set; line.status → PUTAWAY"
          - "For each line: Inventory row upserted (bin_id, lot_id) with qty_units += received_units"
          - "Each affected Bin recomputes used_volume_cm3, used_weight_g (§1.3 bin_remaining_capacity)"
          - "For each lot first putaway: Lot.received_at = Warehouse.clock_now (only on first putaway; never overwritten)"
          - "Status → PUTAWAY"

      - from: FAILED
        to: QUARANTINED
        trigger: "POST /warehouses/{warehouseId}/inbound_shipments/{shipmentId}/quarantine"
        actor: WarehouseStaff
        preconditions:
          - "At least one bin with zone=RETURNS has remaining capacity for each line's volume and weight (else ERR_NO_BIN_AVAILABLE)"
        side_effects:
          - "For each line: chosen RETURNS-zone bin per §1.3 bin_putaway_selection (filter restricted to zone=RETURNS); line.bin_id set; line.status → QUARANTINED"
          - "Inventory upserted with qty_units += received_units"
          - "Each affected Lot.status → QUARANTINED"

      - from: PUTAWAY
        to: CLOSED
        trigger: "system (automatic during run_ops when all lines have status PUTAWAY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUARANTINED
        to: CLOSED
        trigger: "system (automatic during run_ops when all lines have status QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: CREATED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: CREATED
        to: ALLOCATED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/allocate"
        actor: WarehouseStaff
        preconditions:
          - "Warehouse.posture is OPEN or RESTRICTED (else ERR_POSTURE_FROZEN)"
          - "For each requested line: sufficient available_units across Inventory rows whose Lot.sku matches and Lot.status IN {ACTIVE, NEAR_EXPIRY} (else ERR_INSUFFICIENT_INVENTORY)"
          - "If any candidate Lot.status is RECALLED or EXPIRED, that lot is excluded; if exclusion makes inventory insufficient, ERR_INSUFFICIENT_INVENTORY"
        side_effects:
          - "PickTasks generated per §1.3 pick_lot_selection using order.pick_strategy"
          - "For each generated pick task: Inventory.reserved_units += planned_units"
          - "Order.provisional_carton_count set per §1.3 carton_count_calc (variant=PROVISIONAL)"

      - from: ALLOCATED
        to: PICKING
        trigger: "system (automatic when first PickTask of this order transitions CREATED → PICKING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PICKING
        to: PICKED
        trigger: "system (automatic when every PickTask of this order is in {PICKED, CANCELLED} and at least one is PICKED)"
        actor: system
        preconditions:
          - "No PickTask is in SHORT_PICKED or FAILED"
        side_effects: []

      - from: PICKING
        to: SHORT_PICKED
        trigger: "system (automatic when every PickTask of this order is terminal and at least one is SHORT_PICKED or FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Warehouse.abnormal_event_count_24h += 1"

      - from: SHORT_PICKED
        to: ALLOCATED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/replan"
        actor: WarehouseStaff
        preconditions:
          - "Status is SHORT_PICKED"
          - "Warehouse.posture is OPEN or RESTRICTED"
        side_effects:
          - "All terminal PickTasks are retained for audit"
          - "New PickTasks are generated for the missing units (planned_units − sum(picked_units of terminal pick tasks for that lot/sku))"
          - "Inventory.reserved_units adjusted for new pick tasks"
          - "provisional_carton_count recomputed"

      - from: PICKED
        to: PACKED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/pack"
        actor: WarehouseStaff
        preconditions:
          - "Status is PICKED"
          - "All PickTasks of this order are PICKED"
        side_effects:
          - "Order.final_carton_count set per §1.3 carton_count_calc (variant=FINAL)"

      - from: SHORT_PICKED
        to: PACKED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/pack"
        actor: WarehouseStaff
        preconditions:
          - "Request body field allow_partial == true"
          - "At least one PickTask of this order is PICKED"
        side_effects:
          - "Order.final_carton_count set per §1.3 carton_count_calc (variant=FINAL)"

      - from: PACKED
        to: SHIPPED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/ship"
        actor: WarehouseStaff
        preconditions:
          - "Status is PACKED"
          - "No Lot used by any picked PickTask of this order is in {RECALLED, EXPIRED, QUARANTINED} (else ERR_LOT_NOT_SHIPPABLE)"
        side_effects:
          - "shipping_label_id minted as 'lbl_<uuid>'"
          - "tracking_number minted as '<carrier-prefix>-<sequence>' (UPS→1Z..., FEDEX→FX..., USPS→US...)"
          - "For each PICKED PickTask: Inventory.qty_units -= picked_units AND Inventory.reserved_units -= picked_units (atomically)"

      - from: CREATED
        to: CANCELLED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/cancel"
        actor: WarehouseStaff
        preconditions: []
        side_effects: []

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/cancel"
        actor: WarehouseStaff
        preconditions: []
        side_effects:
          - "All CREATED PickTasks → CANCELLED"
          - "Inventory.reserved_units -= planned_units for each CREATED PickTask (per task)"

      - from: PICKING
        to: CANCELLED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/cancel"
        actor: WarehouseStaff
        preconditions:
          - "No PickTask is in PICKED status (else ERR_INVALID_STATE)"
        side_effects:
          - "All non-terminal PickTasks → CANCELLED"
          - "Inventory.reserved_units released"

      - from: SHORT_PICKED
        to: CANCELLED
        trigger: "POST /warehouses/{warehouseId}/orders/{orderId}/cancel"
        actor: WarehouseStaff
        preconditions: []
        side_effects:
          - "All non-terminal PickTasks → CANCELLED"
          - "Inventory.reserved_units released"

  - entity: Lot
    initial_state: ACTIVE
    terminal_states: [DISPOSED]
    transitions:
      - from: ACTIVE
        to: NEAR_EXPIRY
        trigger: "system (during /_clock/advance or run_ops when Warehouse.clock_now + 30 days >= expiry_date AND Warehouse.clock_now < expiry_date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: NEAR_EXPIRY
        to: EXPIRED
        trigger: "system (during /_clock/advance or run_ops when Warehouse.clock_now >= expiry_date)"
        actor: system
        preconditions: []
        side_effects:
          - "All CREATED PickTasks referencing this lot → FAILED"
          - "Inventory.reserved_units -= planned_units for each cancelled CREATED PickTask"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (during /_clock/advance or run_ops when Warehouse.clock_now >= expiry_date and threshold for NEAR_EXPIRY was skipped because clock advanced past expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "All CREATED PickTasks referencing this lot → FAILED"

      - from: ACTIVE
        to: QUARANTINED
        trigger: "system (cascaded from InboundShipment FAILED→QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: RECALLED
        trigger: "POST /warehouses/{warehouseId}/lots/{lotId}/recall"
        actor: WarehouseManager
        preconditions:
          - "Status is ACTIVE or NEAR_EXPIRY (else ERR_INVALID_STATE)"
        side_effects:
          - "Lot.recalled_at = Warehouse.clock_now; Lot.recall_reason set from request body"
          - "All CREATED or PICKING PickTasks referencing this lot → FAILED (cascade: PickTask→Order)"
          - "Each affected Order in PICKING transitions to SHORT_PICKED on system advance (cascade: Order→Warehouse abnormal_event_count_24h)"
          - "For each affected PickTask: Inventory.reserved_units -= planned_units"
          - "Warehouse.recall_count_open += 1"

      - from: NEAR_EXPIRY
        to: RECALLED
        trigger: "POST /warehouses/{warehouseId}/lots/{lotId}/recall"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "Same as ACTIVE→RECALLED"

      - from: EXPIRED
        to: DISPOSED
        trigger: "POST /warehouses/{warehouseId}/lots/{lotId}/dispose"
        actor: WarehouseStaff
        preconditions:
          - "Status is EXPIRED, RECALLED, or QUARANTINED"
          - "No PickTask in CREATED or PICKING references this lot"
        side_effects:
          - "Inventory rows for this lot: qty_units → 0"
          - "Each affected Bin recomputes used_volume_cm3 and used_weight_g"

      - from: RECALLED
        to: DISPOSED
        trigger: "POST /warehouses/{warehouseId}/lots/{lotId}/dispose"
        actor: WarehouseStaff
        preconditions:
          - "Status is EXPIRED, RECALLED, or QUARANTINED"
        side_effects:
          - "Same as EXPIRED→DISPOSED"
          - "Warehouse.recall_count_open -= 1"

      - from: QUARANTINED
        to: DISPOSED
        trigger: "POST /warehouses/{warehouseId}/lots/{lotId}/dispose"
        actor: WarehouseStaff
        preconditions:
          - "Status is EXPIRED, RECALLED, or QUARANTINED"
        side_effects:
          - "Same as EXPIRED→DISPOSED"

  - entity: PickTask
    initial_state: CREATED
    terminal_states: [PICKED, SHORT_PICKED, FAILED, CANCELLED]
    transitions:
      - from: CREATED
        to: PICKING
        trigger: "POST /warehouses/{warehouseId}/pick_tasks/{pickTaskId}/start"
        actor: WarehouseStaff
        preconditions:
          - "Parent Wave.status is RELEASED or IN_PROGRESS"
          - "Lot.status IN {ACTIVE, NEAR_EXPIRY} (else ERR_LOT_NOT_PICKABLE)"
          - "Bin.status is ACTIVE (else ERR_BIN_FROZEN)"
        side_effects:
          - "Parent Order: ALLOCATED → PICKING (if first); Wave: RELEASED → IN_PROGRESS (if first)"

      - from: PICKING
        to: PICKED
        trigger: "POST /warehouses/{warehouseId}/pick_tasks/{pickTaskId}/complete"
        actor: WarehouseStaff
        preconditions:
          - "Request body picked_units == planned_units"
        side_effects:
          - "PickTask.picked_units = planned_units"
          - "Wave.picked_unit_count += picked_units"

      - from: PICKING
        to: SHORT_PICKED
        trigger: "POST /warehouses/{warehouseId}/pick_tasks/{pickTaskId}/complete"
        actor: WarehouseStaff
        preconditions:
          - "Request body 0 <= picked_units < planned_units"
        side_effects:
          - "PickTask.picked_units = picked_units (from body)"
          - "Inventory.reserved_units -= (planned_units - picked_units)"
          - "Wave.picked_unit_count += picked_units"

      - from: CREATED
        to: CANCELLED
        trigger: "system (cascaded from Order cancel or Wave cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Inventory.reserved_units -= planned_units"

      - from: PICKING
        to: CANCELLED
        trigger: "system (cascaded from Order cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Inventory.reserved_units -= planned_units"

      - from: CREATED
        to: FAILED
        trigger: "system (cascaded from Lot recall/expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "Inventory.reserved_units -= planned_units"

      - from: PICKING
        to: FAILED
        trigger: "system (cascaded from Lot recall mid-pick)"
        actor: system
        preconditions: []
        side_effects:
          - "Inventory.reserved_units -= planned_units"

  - entity: Wave
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /warehouses/{warehouseId}/waves/{waveId}/release"
        actor: WarehouseStaff
        preconditions:
          - "No other Wave in {RELEASED, IN_PROGRESS} for this warehouse (else ERR_WAVE_OVERLAP)"
          - "All Wave.order_ids reference Orders in ALLOCATED status (else ERR_INVALID_STATE)"
        side_effects:
          - "Each Order's PickTasks have wave_id set"
          - "PickTask.sequence assigned per §1.3 wave_pick_path_distance (ascending bin_code, tie-break by PickTask.id)"
          - "wave.released_at = Warehouse.clock_now"
          - "wave.total_path_distance computed per §1.3 wave_pick_path_distance"

      - from: RELEASED
        to: IN_PROGRESS
        trigger: "system (automatic when first PickTask in this wave transitions CREATED→PICKING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when every PickTask in the wave is terminal — PICKED, SHORT_PICKED, FAILED, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "wave.completed_at = Warehouse.clock_now"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /warehouses/{warehouseId}/waves/{waveId}/cancel"
        actor: WarehouseStaff
        preconditions: []
        side_effects: []

  - entity: CycleCount
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, ADJUSTED, DISPUTED]
    transitions:
      - from: SCHEDULED
        to: COUNTING
        trigger: "POST /warehouses/{warehouseId}/cycle_counts/{cycleCountId}/start"
        actor: WarehouseStaff
        preconditions: []
        side_effects: []

      - from: COUNTING
        to: RECONCILED
        trigger: "POST /warehouses/{warehouseId}/cycle_counts/{cycleCountId}/submit_count"
        actor: WarehouseStaff
        preconditions:
          - "Request body counted_qty is integer >= 0"
          - "counted_qty == book_qty"
        side_effects:
          - "variance_units = 0; variance_value_cents = 0"
          - "submitted_by_user_id = X-User-ID of caller"
          - "Bin.status: FROZEN → ACTIVE; Bin.frozen_by_cycle_count_id = null"

      - from: COUNTING
        to: VARIANCE_FOUND
        trigger: "POST /warehouses/{warehouseId}/cycle_counts/{cycleCountId}/submit_count"
        actor: WarehouseStaff
        preconditions:
          - "counted_qty != book_qty"
        side_effects:
          - "variance_units = counted_qty - book_qty"
          - "variance_value_cents computed per §1.3 variance_valuation"
          - "submitted_by_user_id = X-User-ID of caller"
          - "Warehouse.abnormal_event_count_24h += 1"

      - from: VARIANCE_FOUND
        to: ADJUSTED
        trigger: "POST /warehouses/{warehouseId}/cycle_counts/{cycleCountId}/approve_adjustment"
        actor: Auditor
        preconditions:
          - "Caller X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Inventory.qty_units = counted_qty"
          - "Bin recomputes used_volume_cm3 and used_weight_g"
          - "approved_by_user_id = X-User-ID of caller; approved_at = Warehouse.clock_now"
          - "Bin.status: FROZEN → ACTIVE; frozen_by_cycle_count_id = null"
          - "Warehouse.shrinkage_value_30d_cents += variance_value_cents (only if approved within last 30 simulated days; aggregation per §1.3 risk_score)"

      - from: VARIANCE_FOUND
        to: DISPUTED
        trigger: "POST /warehouses/{warehouseId}/cycle_counts/{cycleCountId}/dispute"
        actor: WarehouseStaff
        preconditions: []
        side_effects:
          - "Inventory unchanged"
          - "Bin.status: FROZEN → ACTIVE; frozen_by_cycle_count_id = null"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two callers simultaneously call /allocate on the same order"
    guarantee: "Exactly one allocate succeeds; second is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status; loser observes status != CREATED"

  - scenario: "Two callers simultaneously schedule a CycleCount for the same (bin_id, lot_id) pair"
    guarantee: "At most one CycleCount per bin at a time; second rejected."
    error_id: ERR_BIN_FROZEN
    http_status: 409
    serialization: "First-writer-wins on Bin.frozen_by_cycle_count_id"

  - scenario: "Two callers simultaneously release different waves on the same warehouse"
    guarantee: "Exactly one wave reaches RELEASED; the other is rejected."
    error_id: ERR_WAVE_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on warehouse-level wave-exclusivity check"

  - scenario: "Two pickers simultaneously call /complete on the same PickTask"
    guarantee: "First completion wins; second is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PickTask.status"

  - scenario: "Allocate on order races with recall on a candidate lot"
    guarantee: "If recall completes first, allocate either succeeds excluding that lot OR fails ERR_INSUFFICIENT_INVENTORY; if allocate completes first, recall cascades failure to the new pick tasks."
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    serialization: "Lot.status read at allocation time defines selector candidate set"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bin_remaining_capacity
    trigger: "any change to Inventory.qty_units within a bin (putaway, ship, dispose, cycle-count adjustment)"
    algorithm: aggregation
    formula: |
      Bin.used_volume_cm3 = sum(Inventory.qty_units * Lot.unit_volume_cm3 for inv in Bin)
      Bin.used_weight_g   = sum(Inventory.qty_units * Lot.unit_weight_g  for inv in Bin)
      Bin.remaining_volume_cm3 = Bin.capacity_volume_cm3 - Bin.used_volume_cm3
      Bin.remaining_weight_g   = Bin.capacity_weight_g   - Bin.used_weight_g
    input_set: "all Inventory rows in this bin (qty_units > 0); excludes rows whose Lot is DISPOSED"
    precision: "integer cm3 and grams; computed values do not round; intermediate products are integer"

  - name: bin_putaway_selection
    trigger: "InboundShipment PASSED→PUTAWAY (one selection per InboundLine) and InboundShipment FAILED→QUARANTINED (filter restricted to zone=RETURNS)"
    algorithm: selector_policy
    formula: |
      candidate_set = { bin in warehouse :
          bin.status == ACTIVE
          AND bin.zone == lot.category               # PUTAWAY case
              (or bin.zone == 'RETURNS')             # QUARANTINE case
          AND bin.remaining_volume_cm3 >= received_units * lot.unit_volume_cm3
          AND bin.remaining_weight_g  >= received_units * lot.unit_weight_g
      }
      if candidate_set is empty: raise ERR_NO_BIN_AVAILABLE
      sort candidate_set per warehouse.putaway_strategy:
        DISTANCE_OPTIMIZED:
          primary: bin.distance_from_dock ascending
          tie-break: bin.bin_code lexicographic ascending
        CAPACITY_OPTIMIZED:
          primary: bin.remaining_volume_cm3 descending
          tie-break: bin.bin_code lexicographic ascending
      return candidate_set[0]
    input_set: "all bins in warehouse"
    precision: "distance comparisons use double precision; bin.distance_from_dock pre-rounded to 4 decimals (round_half_up)"
    variants:
      - name: DISTANCE_OPTIMIZED
        when: "Warehouse.putaway_strategy == DISTANCE_OPTIMIZED"
        difference: "Sort key is bin.distance_from_dock ascending: closer bins win. For two candidate bins of identical zone and capacity, the one with smaller distance_from_dock is chosen, even if it is fuller."
      - name: CAPACITY_OPTIMIZED
        when: "Warehouse.putaway_strategy == CAPACITY_OPTIMIZED"
        difference: "Sort key is bin.remaining_volume_cm3 descending: emptiest bins win. For two candidate bins of identical zone and reachable capacity, the one with greater remaining_volume_cm3 is chosen, even if it is farther from the dock."

  - name: pick_lot_selection
    trigger: "Order CREATED→ALLOCATED (one selection per requested line, per requested unit; consumes inventory greedily); also Order SHORT_PICKED→ALLOCATED on replan for the residual units"
    algorithm: selector_policy
    formula: |
      For each requested line (sku, qty_units):
        remaining = qty_units
        candidate_set = { inv in warehouse :
            inv.lot.sku == sku
            AND inv.lot.status IN {ACTIVE, NEAR_EXPIRY}
            AND inv.available_units > 0
        }
        sort candidate_set by:
          primary: order.pick_strategy == FEFO ? inv.lot.expiry_date ascending : inv.lot.received_at ascending
          tie-break: inv.lot.lot_code lexicographic ascending
        for inv in sorted_candidate_set:
          take = min(remaining, inv.available_units)
          create PickTask(bin_id=inv.bin_id, lot_id=inv.lot_id, planned_units=take)
          inv.reserved_units += take
          remaining -= take
          if remaining == 0: break
        if remaining > 0: raise ERR_INSUFFICIENT_INVENTORY
    input_set: "Inventory rows where lot.sku matches and lot.status IN {ACTIVE, NEAR_EXPIRY}; rows with status IN {EXPIRED, RECALLED, QUARANTINED, DISPOSED} excluded"
    variants:
      - name: FEFO
        when: "order.pick_strategy == FEFO"
        difference: "Sort key is Lot.expiry_date ascending; for two lots of same SKU with different expiries, the earlier-expiring lot is chosen first."
      - name: FIFO
        when: "order.pick_strategy == FIFO"
        difference: "Sort key is Lot.received_at ascending; for two lots of same SKU with different received_at, the earlier-received lot is chosen first; expiry_date is irrelevant."

  - name: inspection_sample_size
    trigger: "InboundShipment ASN_RECEIVED→INSPECTING"
    algorithm: tiered_pricing
    formula: |
      Let N = declared_total_units
      if N <= 50:    sample = 8
      elif N <= 150: sample = 13
      elif N <= 280: sample = 20
      elif N <= 500: sample = 32
      else:          sample = 50
      InboundShipment.inspection_sample_size = sample
    input_set: "the inbound shipment's declared_total_units"
    constants:
      AQL_PASS_THRESHOLD: 0.025

  - name: defect_rate
    trigger: "InboundShipment INSPECTING→{PASSED,FAILED}"
    algorithm: aggregation
    formula: |
      defect_rate = round(inspection_defect_count / inspection_sample_size, 4, round_half_up)
      PASS if defect_rate <= 0.025 else FAIL
    input_set: "inspection_defect_count and inspection_sample_size on the shipment"
    precision: "round_half_up to 4 decimals; threshold comparison is `<=` for PASS"

  - name: variance_valuation
    trigger: "CycleCount COUNTING→VARIANCE_FOUND sets variance_value_cents; CycleCount VARIANCE_FOUND→ADJUSTED rolls the result into Warehouse.shrinkage_value_30d_cents"
    algorithm: aggregation
    formula: |
      # Per cycle count (rounded once, in cents):
      raw_value_cents = abs(variance_units) * Lot.unit_value_cents
      variance_value_cents = round(raw_value_cents, 0, round_half_up)

      # Per warehouse (NOT round-then-sum):
      Warehouse.shrinkage_value_30d_cents =
        sum(CycleCount.variance_value_cents
            for CycleCount in this warehouse
            where status == ADJUSTED
            and approved_at >= clock_now - 30 simulated days)
      # i.e. round-per-cycle-count first, then sum the integer cents — order is fixed.
    input_set: "the cycle count's variance_units and Lot.unit_value_cents (per cycle count); for the warehouse aggregate, the multiset of CycleCount.variance_value_cents over the rolling 30-day window"
    precision: "Round each cycle count's value to integer cents (round_half_up) BEFORE summing into shrinkage_value_30d_cents. Summing raw fractional values then rounding once is incorrect."

  - name: carton_count_calc
    trigger: "Order CREATED→ALLOCATED sets provisional_carton_count; Order {PICKED|SHORT_PICKED}→PACKED sets final_carton_count"
    algorithm: forward_looking
    formula: |
      CARTON_VOLUME_CM3 = 50000
      CARTON_WEIGHT_G   = 20000
      provisional:
        total_volume = sum(line.qty_units * sku_unit_volume for line in order.requested_lines)
        total_weight = sum(line.qty_units * sku_unit_weight for line in order.requested_lines)
        # sku_unit_volume / sku_unit_weight resolved as: average over all ACTIVE/NEAR_EXPIRY lots for that sku at allocation time, weighted by Inventory.qty_units; if no inventory, lot from latest InboundLine PUTAWAY
        cartons_v = ceil(total_volume / CARTON_VOLUME_CM3)
        cartons_w = ceil(total_weight / CARTON_WEIGHT_G)
        provisional_carton_count = max(cartons_v, cartons_w, 1)
      final:
        total_volume = sum(pick.picked_units * pick.lot.unit_volume_cm3 for pick in order.pick_tasks if pick.status == PICKED)
        total_weight = sum(pick.picked_units * pick.lot.unit_weight_g  for pick in order.pick_tasks if pick.status == PICKED)
        cartons_v = ceil(total_volume / CARTON_VOLUME_CM3)
        cartons_w = ceil(total_weight / CARTON_WEIGHT_G)
        final_carton_count = max(cartons_v, cartons_w, 1)
    input_set: "see formula"
    constants:
      CARTON_VOLUME_CM3: 50000
      CARTON_WEIGHT_G: 20000
    variants:
      - name: PROVISIONAL
        when: "Order CREATED→ALLOCATED"
        difference: "Inputs are the requested_lines aggregated by SKU using SKU-weighted-average unit_volume/unit_weight; ignores which lots will actually be picked. Two orders with identical requested_lines compute identical provisional counts even if their actual pick allocations differ."
      - name: FINAL
        when: "Order {PICKED|SHORT_PICKED}→PACKED"
        difference: "Inputs are the actual PickTask.lot.unit_volume/weight for PICKED tasks only; SHORT_PICKED gaps reduce the total. Two orders with identical requested_lines but different lot assignments produce different final counts."

  - name: wave_pick_path_distance
    trigger: "Wave PLANNED→RELEASED (assigns sequence) and Wave snapshot read"
    algorithm: chronological
    formula: |
      Sort all PickTasks of the wave by:
        primary: PickTask.bin.bin_code lexicographic ascending
        tie-break: PickTask.id ascending
      Assign PickTask.sequence = 1..N in sort order.
      Compute total_path_distance:
        prev = warehouse.dock_position
        d = 0
        for each PickTask in sequence order:
          d += sqrt((bin.position_x - prev.x)^2 + (bin.position_y - prev.y)^2)
          prev = bin.position
        d += sqrt((warehouse.dock_position.x - prev.x)^2 + (warehouse.dock_position.y - prev.y)^2)   # return to dock
        wave.total_path_distance = round(d, 4, round_half_up)
    input_set: "all PickTasks in this wave"
    precision: "round_half_up to 4 decimals"

  - name: risk_score
    trigger: "any change to shrinkage_value_30d_cents, abnormal_event_count_24h, or recall_count_open"
    algorithm: weighted_scoring
    formula: |
      raw = (Warehouse.shrinkage_value_30d_cents / 100)             # 1 point per $1 of shrinkage in the last 30 simulated days
          + (Warehouse.abnormal_event_count_24h * 10)                # 10 points per abnormal event in the last 24 simulated hours
          + (Warehouse.recall_count_open * 100)                       # 100 points per currently RECALLED lot
      Warehouse.risk_score = min(round(raw, 2, round_half_up), 1000)
      if Warehouse.risk_score > 200: posture = FROZEN
      elif Warehouse.risk_score > 100: posture = RESTRICTED
      else: posture = OPEN
    input_set: "the warehouse's three rolling counters: shrinkage_value_30d_cents, abnormal_event_count_24h, recall_count_open"
    precision: "round_half_up to 2 decimals; cap at 1000.00"
    constants:
      SHRINKAGE_DENOMINATOR_CENTS: 100
      ABNORMAL_EVENT_WEIGHT: 10
      RECALL_WEIGHT: 100
      FROZEN_THRESHOLD: 200
      RESTRICTED_THRESHOLD: 100
      MAX_SCORE: 1000

  - name: near_expiry_marker
    trigger: "POST /_clock/advance and POST /warehouses/{id}/run_ops; per-lot scan"
    algorithm: threshold
    formula: |
      For each Lot in {ACTIVE, NEAR_EXPIRY}:
        days_to_expiry = floor((expiry_date - Warehouse.clock_now) / 86400_seconds)
        if days_to_expiry < 0:    Lot.status = EXPIRED       # cascade: FAIL CREATED PickTasks
        elif days_to_expiry <= 30: Lot.status = NEAR_EXPIRY  # inclusive
        else: Lot.status remains ACTIVE
    input_set: "all lots not in {EXPIRED, RECALLED, QUARANTINED, DISPOSED}"
    constants:
      NEAR_EXPIRY_DAYS: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be one of WarehouseStaff, Auditor, WarehouseManager"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-resource ids must exist within their parent scope (warehouseId, then nested ids), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Foreign-key fields in body (lot_id, bin_id, order_ids[], etc.) must reference existing entities in the same warehouse"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints that accept FK ids in body"

  - priority: 5
    category: state
    check: "Target resource must be in a state that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 6
    category: business_safety
    check: "Lot.status restrictions: cannot pick/ship/putaway lots in {RECALLED, EXPIRED, DISPOSED}; cannot ship orders whose picked lots include {RECALLED, EXPIRED, QUARANTINED}"
    error_id: ERR_LOT_NOT_PICKABLE
    http_status: 409
    applies_to: "/pick_tasks/{id}/start, /orders/{id}/ship, /inbound_shipments/{id}/start_inspection (lot must be ACTIVE for line)"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: caller of /approve_adjustment must have X-User-ID different from CycleCount.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "/cycle_counts/{id}/approve_adjustment"

  - priority: 8
    category: business_referential
    check: "Bin zone must match Lot category for putaway (PASSED→PUTAWAY); zone must be RETURNS for FAILED→QUARANTINED"
    error_id: ERR_ZONE_MISMATCH
    http_status: 409
    applies_to: "/inbound_shipments/{id}/putaway, /inbound_shipments/{id}/quarantine"

  - priority: 9
    category: business_constraint
    check: "ASN match: declared_total_units == sum(InboundLine.declared_units)"
    error_id: ERR_ASN_MISMATCH
    http_status: 409
    applies_to: "/inbound_shipments/{id}/start_inspection"

  - priority: 10
    category: business_constraint
    check: "Bin freeze: a bin with status=FROZEN cannot host putaway or be the source of pick start"
    error_id: ERR_BIN_FROZEN
    http_status: 409
    applies_to: "/inbound_shipments/{id}/putaway, /pick_tasks/{id}/start"

  - priority: 11
    category: business_constraint
    check: "Wave overlap: cannot release a Wave while another Wave is in {RELEASED, IN_PROGRESS} for the same warehouse"
    error_id: ERR_WAVE_OVERLAP
    http_status: 409
    applies_to: "/waves/{id}/release"

  - priority: 12
    category: business_capacity
    check: "Bin capacity: putaway-line received_units must fit in remaining volume AND remaining weight"
    error_id: ERR_NO_BIN_AVAILABLE
    http_status: 409
    applies_to: "/inbound_shipments/{id}/putaway, /inbound_shipments/{id}/quarantine"

  - priority: 13
    category: business_capacity
    check: "Inventory sufficiency: each requested order line must be fully satisfiable by ACTIVE+NEAR_EXPIRY lot inventory"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "/orders/{id}/allocate, /orders/{id}/replan"

  - priority: 14
    category: business_safety
    check: "Posture gate: orders cannot transition CREATED→ALLOCATED or SHORT_PICKED→ALLOCATED while Warehouse.posture == FROZEN"
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "/orders/{id}/allocate, /orders/{id}/replan"

  - priority: 15
    category: business_referential
    check: "Pick-task complete: 0 <= picked_units <= planned_units"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "/pick_tasks/{id}/complete"

  - priority: 16
    category: business_referential
    check: "Inspection complete: 0 <= inspection_defect_count <= inspection_sample_size"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "/inbound_shipments/{id}/complete_inspection"

  - priority: 17
    category: business_referential
    check: "Order pack: PICKED→PACKED requires no SHORT_PICKED or FAILED tasks; SHORT_PICKED→PACKED requires allow_partial==true"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/orders/{id}/pack"

  - priority: 18
    category: business_constraint
    check: "Lot dispose: no PickTask in {CREATED, PICKING} may reference the lot"
    error_id: ERR_LOT_HAS_OPEN_PICKS
    http_status: 409
    applies_to: "/lots/{id}/dispose"

  - priority: 19
    category: business_referential
    check: "Carrier value must be one of UPS, FEDEX, USPS"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: "/orders (POST)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Warehouse ---
  - method: POST
    path: "/warehouses"
    description: "Create a new Warehouse"
    roles: [WarehouseManager]
    code: 201
    input: [name, dock_position_x, dock_position_y, "putaway_strategy?"]
    output: Warehouse
    side_effects:
      - "putaway_strategy defaults to DISTANCE_OPTIMIZED if omitted"
      - "ops_run_index=0; clock_now is initialized to a fixed epoch (1970-01-01T00:00:00Z) and is advanced via /_clock/advance"
      - "shrinkage_value_30d_cents=0; abnormal_event_count_24h=0; recall_count_open=0; risk_score=0; posture=OPEN"

  - method: GET
    path: "/warehouses/{warehouseId}"
    description: "Get a warehouse"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/run_ops"
    description: "Run operations checkpoint: scans for NEAR_EXPIRY/EXPIRED transitions; closes shipments whose lines are all PUTAWAY or all QUARANTINED; recomputes posture"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: Warehouse
    side_effects:
      - "ops_run_index += 1"
      - "near_expiry_marker scan over all lots"
      - "InboundShipment auto-closure"
      - "abnormal_event_count_24h decays: events older than (clock_now - 86400 sec) drop from window"
      - "shrinkage_value_30d_cents recomputes (drops cycle counts approved > 30 simulated days ago)"
      - "risk_score and posture recomputed"

  # --- Bin ---
  - method: POST
    path: "/warehouses/{warehouseId}/bins"
    description: "Create a Bin"
    roles: [WarehouseManager]
    code: 201
    input: [bin_code, zone, position_x, position_y, capacity_volume_cm3, capacity_weight_g]
    output: Bin
    side_effects: ["used_volume_cm3=0; used_weight_g=0; status=ACTIVE; distance_from_dock computed"]

  - method: GET
    path: "/warehouses/{warehouseId}/bins/{binId}"
    description: "Get a bin"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: Bin
    side_effects: []

  - method: GET
    path: "/warehouses/{warehouseId}/bins"
    description: "List bins"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: ["zone?", "status?", "limit?", "offset?"]
    output: Bin[]
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/warehouses/{warehouseId}/lots"
    description: "Create a Lot"
    roles: [WarehouseManager]
    code: 201
    input: [lot_code, sku, category, unit_weight_g, unit_volume_cm3, unit_value_cents, manufacture_date, expiry_date, supplier_lot_ref]
    output: Lot
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/warehouses/{warehouseId}/lots/{lotId}"
    description: "Get a lot"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/lots/{lotId}/recall"
    description: "Recall a lot — cascades to PickTasks and Orders"
    roles: [WarehouseManager]
    code: 200
    input: [recall_reason]
    output: Lot
    side_effects:
      - "status=RECALLED; recalled_at=clock_now; recall_reason set"
      - "All CREATED|PICKING PickTasks for this lot → FAILED"
      - "Inventory.reserved_units released"
      - "recall_count_open += 1; risk_score recomputed"

  - method: POST
    path: "/warehouses/{warehouseId}/lots/{lotId}/dispose"
    description: "Dispose a lot (zeroes inventory and frees bin capacity)"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Lot
    side_effects:
      - "status=DISPOSED"
      - "Inventory.qty_units = 0 for all rows of this lot"
      - "Each affected Bin recomputes used_volume_cm3 and used_weight_g"
      - "If transitioning from RECALLED: recall_count_open -= 1; risk_score recomputed"

  # --- InboundShipment ---
  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments"
    description: "Create an InboundShipment with one or more InboundLines"
    roles: [WarehouseStaff]
    code: 201
    input: [asn_number, supplier_name, declared_total_units, "lines:[{lot_id, declared_units}]"]
    output: InboundShipment
    side_effects:
      - "status=ASN_RECEIVED"
      - "InboundLines created with status=PENDING_INSPECTION"

  - method: GET
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}"
    description: "Get an inbound shipment (includes lines)"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: InboundShipment
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}/start_inspection"
    description: "Start inspection (computes sample size; ASN match check)"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: InboundShipment
    side_effects: ["status=INSPECTING; inspection_sample_size computed"]

  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}/complete_inspection"
    description: "Submit inspection result; transitions to PASSED or FAILED based on defect_rate"
    roles: [WarehouseStaff]
    code: 200
    input: ["inspection_defect_count", "lines:[{lot_id, received_units}]"]
    output: InboundShipment
    side_effects:
      - "defect_rate computed; status → PASSED|FAILED"
      - "InboundLines updated with received_units; status=INSPECTED_PASS|INSPECTED_FAIL"
      - "If FAILED: abnormal_event_count_24h += 1; risk_score recomputed"

  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}/rework"
    description: "Send a FAILED shipment back to INSPECTING"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: InboundShipment

  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}/putaway"
    description: "Putaway PASSED shipment lines; selects bins per §1.3 bin_putaway_selection"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: InboundShipment

  - method: POST
    path: "/warehouses/{warehouseId}/inbound_shipments/{shipmentId}/quarantine"
    description: "Quarantine FAILED shipment lines into RETURNS-zone bins"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: InboundShipment

  # --- Inventory ---
  - method: GET
    path: "/warehouses/{warehouseId}/inventory"
    description: "List inventory rows"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: ["bin_id?", "lot_id?", "sku?", "limit?", "offset?"]
    output: Inventory[]
    side_effects: []

  # --- Wave ---
  - method: POST
    path: "/warehouses/{warehouseId}/waves"
    description: "Create a wave grouping ALLOCATED orders"
    roles: [WarehouseStaff]
    code: 201
    input: [wave_code, strategy, order_ids]
    output: Wave
    side_effects:
      - "status=PLANNED"
      - "Each Order.wave_id set to this wave id"
      - "planned_unit_count computed from PickTasks of those orders"

  - method: GET
    path: "/warehouses/{warehouseId}/waves/{waveId}"
    description: "Get a wave"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/waves/{waveId}/release"
    description: "Release a wave (assigns pick path; transitions to RELEASED)"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Wave

  - method: POST
    path: "/warehouses/{warehouseId}/waves/{waveId}/cancel"
    description: "Cancel a PLANNED wave"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Wave

  # --- Order ---
  - method: POST
    path: "/warehouses/{warehouseId}/orders"
    description: "Create an Order"
    roles: [WarehouseStaff]
    code: 201
    input: [order_number, customer_name, requested_lines, "pick_strategy?", carrier]
    output: Order
    side_effects: ["status=CREATED; pick_strategy defaults to FEFO if omitted"]

  - method: GET
    path: "/warehouses/{warehouseId}/orders/{orderId}"
    description: "Get an Order (includes pick_tasks summary)"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/orders/{orderId}/allocate"
    description: "Allocate inventory to the order; generates PickTasks; sets provisional_carton_count"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Order

  - method: POST
    path: "/warehouses/{warehouseId}/orders/{orderId}/cancel"
    description: "Cancel an order; releases reservations and cancels pick tasks"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Order

  - method: POST
    path: "/warehouses/{warehouseId}/orders/{orderId}/replan"
    description: "Replan a SHORT_PICKED order: regenerate pick tasks for residual units"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Order

  - method: POST
    path: "/warehouses/{warehouseId}/orders/{orderId}/pack"
    description: "Pack the order; sets final_carton_count"
    roles: [WarehouseStaff]
    code: 200
    input: ["allow_partial?"]
    output: Order

  - method: POST
    path: "/warehouses/{warehouseId}/orders/{orderId}/ship"
    description: "Ship the order; mints label; debits inventory"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: Order

  # --- PickTask ---
  - method: GET
    path: "/warehouses/{warehouseId}/pick_tasks/{pickTaskId}"
    description: "Get a pick task"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: PickTask
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/pick_tasks/{pickTaskId}/start"
    description: "Start a pick task"
    roles: [WarehouseStaff]
    code: 200
    input: []
    output: PickTask

  - method: POST
    path: "/warehouses/{warehouseId}/pick_tasks/{pickTaskId}/complete"
    description: "Complete a pick task with picked_units"
    roles: [WarehouseStaff]
    code: 200
    input: [picked_units]
    output: PickTask

  # --- CycleCount ---
  - method: POST
    path: "/warehouses/{warehouseId}/cycle_counts"
    description: "Schedule a cycle count for (bin_id, lot_id); freezes the bin"
    roles: [WarehouseStaff, Auditor]
    code: 201
    input: [bin_id, lot_id]
    output: CycleCount
    side_effects:
      - "status=SCHEDULED; book_qty snapshot of current Inventory.qty_units"
      - "Bin.status: ACTIVE → FROZEN; Bin.frozen_by_cycle_count_id = this id"

  - method: GET
    path: "/warehouses/{warehouseId}/cycle_counts/{cycleCountId}"
    description: "Get a cycle count"
    roles: [WarehouseStaff, Auditor, WarehouseManager]
    code: 200
    input: []
    output: CycleCount
    side_effects: []

  - method: POST
    path: "/warehouses/{warehouseId}/cycle_counts/{cycleCountId}/start"
    description: "Begin counting (SCHEDULED → COUNTING)"
    roles: [WarehouseStaff, Auditor]
    code: 200
    input: []
    output: CycleCount

  - method: POST
    path: "/warehouses/{warehouseId}/cycle_counts/{cycleCountId}/submit_count"
    description: "Submit counted_qty; transitions to RECONCILED or VARIANCE_FOUND"
    roles: [WarehouseStaff, Auditor]
    code: 200
    input: [counted_qty]
    output: CycleCount

  - method: POST
    path: "/warehouses/{warehouseId}/cycle_counts/{cycleCountId}/approve_adjustment"
    description: "Approve adjustment (Auditor only; segregation of duties)"
    roles: [Auditor]
    code: 200
    input: []
    output: CycleCount

  - method: POST
    path: "/warehouses/{warehouseId}/cycle_counts/{cycleCountId}/dispute"
    description: "Dispute the count without adjusting inventory"
    roles: [WarehouseStaff, Auditor]
    code: 200
    input: []
    output: CycleCount

  # --- Clock (test driver) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance simulated wall clock for the warehouse and run near-expiry/expired scans"
    roles: [WarehouseManager]
    code: 200
    input: [warehouse_id, new_time]
    output: Warehouse
    side_effects:
      - "Warehouse.clock_now = new_time"
      - "near_expiry_marker scan over all lots"
      - "Affected Lots transition; cascades to PickTasks per §1.2"
      - "abnormal_event_count_24h decays; shrinkage_value_30d_cents recomputes; risk_score recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role is not authorized for the endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id does not exist within its parent scope; or referenced FK id does not exist"

  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Request body validation failure (out-of-range integers, unknown enum, missing required field, malformed body)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that allows the requested transition"

  - id: ERR_ASN_MISMATCH
    http: 409
    condition: "InboundShipment.declared_total_units != sum(InboundLine.declared_units)"

  - id: ERR_LOT_NOT_ACTIVE
    http: 409
    condition: "An InboundLine.lot_id references a Lot whose status is not ACTIVE at start_inspection time"

  - id: ERR_ZONE_MISMATCH
    http: 409
    condition: "Bin.zone does not match Lot.category for putaway, or selected bin is not zone=RETURNS for quarantine"

  - id: ERR_NO_BIN_AVAILABLE
    http: 409
    condition: "No bin in candidate set satisfies zone, volume, weight, and ACTIVE filters"

  - id: ERR_BIN_FROZEN
    http: 409
    condition: "Operation targets a bin currently FROZEN by an open CycleCount"

  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "Available inventory in {ACTIVE, NEAR_EXPIRY} lots cannot satisfy a requested order line"

  - id: ERR_LOT_NOT_PICKABLE
    http: 409
    condition: "Pick targets a lot whose status is in {EXPIRED, QUARANTINED, RECALLED, DISPOSED}"

  - id: ERR_LOT_NOT_SHIPPABLE
    http: 409
    condition: "Order ship blocked because at least one PICKED PickTask references a lot now in {RECALLED, EXPIRED, QUARANTINED}"

  - id: ERR_LOT_HAS_OPEN_PICKS
    http: 409
    condition: "Lot dispose blocked because at least one PickTask in {CREATED, PICKING} references the lot"

  - id: ERR_POSTURE_FROZEN
    http: 409
    condition: "Allocate or replan blocked because Warehouse.posture == FROZEN"

  - id: ERR_WAVE_OVERLAP
    http: 409
    condition: "Wave release blocked because another Wave is in {RELEASED, IN_PROGRESS} for the warehouse"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Caller of approve_adjustment has the same X-User-ID as the cycle count's submitter"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: request version field does not match current entity version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WarehouseStaff
    description: "Day-to-day floor operations: inbound receiving and inspection, putaway, allocation, picking, packing, shipping, scheduling cycle counts, lot disposal."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses/{id}/inbound_shipments — create shipment"
      - "POST /warehouses/{id}/inbound_shipments/{id}/start_inspection"
      - "POST /warehouses/{id}/inbound_shipments/{id}/complete_inspection"
      - "POST /warehouses/{id}/inbound_shipments/{id}/rework"
      - "POST /warehouses/{id}/inbound_shipments/{id}/putaway"
      - "POST /warehouses/{id}/inbound_shipments/{id}/quarantine"
      - "POST /warehouses/{id}/orders — create order"
      - "POST /warehouses/{id}/orders/{id}/allocate"
      - "POST /warehouses/{id}/orders/{id}/cancel"
      - "POST /warehouses/{id}/orders/{id}/replan"
      - "POST /warehouses/{id}/orders/{id}/pack"
      - "POST /warehouses/{id}/orders/{id}/ship"
      - "POST /warehouses/{id}/pick_tasks/{id}/start"
      - "POST /warehouses/{id}/pick_tasks/{id}/complete"
      - "POST /warehouses/{id}/waves — create wave"
      - "POST /warehouses/{id}/waves/{id}/release"
      - "POST /warehouses/{id}/waves/{id}/cancel"
      - "POST /warehouses/{id}/lots/{id}/dispose"
    shared_operations:
      - "POST /warehouses/{id}/cycle_counts — create count (also Auditor)"
      - "POST /warehouses/{id}/cycle_counts/{id}/start (also Auditor)"
      - "POST /warehouses/{id}/cycle_counts/{id}/submit_count (also Auditor)"
      - "POST /warehouses/{id}/cycle_counts/{id}/dispute (also Auditor)"
      - "GET endpoints (also Auditor, WarehouseManager)"

  - name: Auditor
    description: "Independent inventory auditor responsible for adjustment approvals; bound by segregation of duties (cannot approve a count they submitted)."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses/{id}/cycle_counts/{id}/approve_adjustment"
    shared_operations:
      - "POST /warehouses/{id}/cycle_counts (also WarehouseStaff)"
      - "POST /warehouses/{id}/cycle_counts/{id}/start (also WarehouseStaff)"
      - "POST /warehouses/{id}/cycle_counts/{id}/submit_count (also WarehouseStaff)"
      - "POST /warehouses/{id}/cycle_counts/{id}/dispute (also WarehouseStaff)"
      - "GET endpoints (also WarehouseStaff, WarehouseManager)"

  - name: WarehouseManager
    description: "Privileged operator: warehouse and reference-data setup, recalls, run_ops, clock advance."
    identity: opaque
    exclusive_operations:
      - "POST /warehouses — create warehouse"
      - "POST /warehouses/{id}/run_ops"
      - "POST /warehouses/{id}/bins — create bin"
      - "POST /warehouses/{id}/lots — create lot"
      - "POST /warehouses/{id}/lots/{id}/recall"
      - "POST /_clock/advance"
    shared_operations:
      - "GET endpoints (also WarehouseStaff, Auditor)"
