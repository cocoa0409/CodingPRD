              as: ClientOps
              as_user_id: "${rb3_clb}"
              captures: { rb3_pl: $.data.id }
          trigger:
            - call: "GET /box-plans/${rb3_pl}"
              as: ClientOps
              as_user_id: "${rb3_cla}"
              captures: { rb3_err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (${rb3_err}) with HTTP 403 (ownership mismatch, not 404)"

      - name: customer_service_cannot_commit_import
        claim_type: role_exclusive_denied
        grounds:
          - roles.CustomerService
          - "endpoints.POST_/import-batches/{id}/commit"
        distinguishing_aspect: "Import commit is ClientOps-exclusive; CustomerService (who may read subscribers) is forbidden from mutating the subscriber base."
        test_recipe:
          setup: ["client + plan PL-RB4; one UPLOADED batch"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "RB4 Client", billing_email: "rb4@acme.test" }
              as: PlatformAdmin
              captures: { rb4_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${rb4_cl}", name: "RB4 Box", sku: "PL-RB4", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${rb4_cl}"
              captures: { rb4_pl: $.data.id }
            - call: "POST /box-plans/${rb4_pl}/import-batches"
              payload: { rows: [{ email: "rb4@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${rb4_cl}"
