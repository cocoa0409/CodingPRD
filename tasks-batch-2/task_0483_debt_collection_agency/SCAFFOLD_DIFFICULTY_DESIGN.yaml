# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Debt Collection Agency (FDCPA) — Expert tier
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_gross_vs_net_diverge_on_account
        grounds:
          - calculations.commission_earned
          - entities.Creditor.fields.commission_basis
          - entities.Account.fields.commission_earned_cents
        distinguishing_aspect: |
          Identical $550 collected on identical accounts yields commission_earned_cents=13750
          under a GROSS_OF_FEES creditor (per-payment 7500+6250) but 11250 under a NET_OF_FEES
          creditor ($100 expense recovered first); the dual variant lives on the Account financial domain.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "Creditor A: commission_basis=GROSS_OF_FEES, rate 2500 bps, expense_recovery_cents=10000."
            - "Creditor B: commission_basis=NET_OF_FEES, rate 2500 bps, expense_recovery_cents=10000."
            - "Account A under Creditor A and Account B under Creditor B, both principal 100000, WORKING."
            - "Two payments posted to each account: 30000 then 25000 cents (collected 55000 each)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred A", commission_basis: "GROSS_OF_FEES", commission_rate_bps: 2500, expense_recovery_cents: 10000 }
              as: Creditor
              captures: { cred_a: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cred B", commission_basis: "NET_OF_FEES", commission_rate_bps: 2500, expense_recovery_cents: 10000 }
              as: Creditor
              captures: { cred_b: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb A", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con_a: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb B", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con_b: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred_a}", consumer_id: "${con_a}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct_a: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred_b}", consumer_id: "${con_b}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_a}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct_b}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct_a}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct_b}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct_a}", amount_cents: 30000 }
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct_a}", amount_cents: 25000 }
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct_b}", amount_cents: 30000 }
              as: Collector
          trigger:
            - call: "POST /payments"
              payload: { account_id: "${acct_b}", amount_cents: 25000 }
              as: Collector
          assert:
            - "Account.${acct_a}.commission_earned_cents == 13750"
            - "Account.${acct_b}.commission_earned_cents == 11250"
            - "Account.${acct_a}.commission_earned_cents != Account.${acct_b}.commission_earned_cents"

      - name: payoff_quote_date_vs_good_through_diverge_on_arrangement
        grounds:
          - calculations.payoff_quote
          - entities.PaymentArrangement.fields.good_through
          - entities.PaymentArrangement.fields.arrangement_type
        distinguishing_aspect: |
          The SAME SETTLEMENT arrangement (base payoff 60000) returns payoff_cents=60000 for
          as_of=QUOTE_DATE but 60500 for as_of=GOOD_THROUGH (10 whole days * $0.50/day admin accrual);
          this dual variant lives on the PaymentArrangement domain, a different entity from commission.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, balance 100000."
            - "PROPOSED SETTLEMENT arrangement, offer_pct_bps=6000, good_through=2026-01-11T00:00:00Z (10 days out)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "SETTLEMENT", offer_pct_bps: 6000, good_through: "2026-01-11T00:00:00Z" }
              as: Collector
              captures: { arr: $.data.id }
          trigger:
            - call: "GET /arrangements/${arr}/payoff-quote"
              payload: { as_of: "GOOD_THROUGH" }
              as: Collector
              captures: { gt_payoff: $.data.payoff_cents }
            - call: "GET /arrangements/${arr}/payoff-quote"
              payload: { as_of: "QUOTE_DATE" }
              as: Collector
              captures: { qd_payoff: $.data.payoff_cents }
          assert:
            - "payoff-quote as_of=QUOTE_DATE returns payoff_cents == 60000"
            - "payoff-quote as_of=GOOD_THROUGH returns payoff_cents == 60500"
            - "${gt_payoff} - ${qd_payoff} == 500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_floor_three_input_nested_minmax
        grounds:
          - calculations.settlement_floor
          - validations[priority=12]
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          settlement_floor_bps is max(age_floor, balance_floor) plus a conditional +1000 verified
          bump — three inputs (age bucket, balance tier, verified-dispute flag) with nested min/max:
          an aged ($15k, age 800d) account with a VERIFIED dispute floors at 5000 bps, so a 4900-bps
          offer is rejected; this is mode (a) (nested min/max + state branch).
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, balance 1500000, charge_off 2023-09-23 (age ~830 days -> age_floor 3000), balance>=$10000 -> balance_floor 4000."
            - "One VERIFIED Dispute resolved on the account -> floor bumped to min(4000+1000,10000)=5000 bps."
            - "PROPOSED SETTLEMENT offer_pct_bps=4900 (below 5000 floor)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 1500000, charge_off_date: "2023-09-23T00:00:00Z", sol_years: 10 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "ACCURACY" }
              as: ComplianceOfficer
              captures: { disp: $.data.id }
            - call: "POST /disputes/${disp}/investigate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /disputes/${disp}/resolve"
              payload: { resolution: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "SETTLEMENT", offer_pct_bps: 4900 }
              as: Collector
              captures: { arr: $.data.id }
          trigger:
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_SETTLEMENT_BELOW_FLOOR"
            - "Account.${acct}.balance_cents == 1500000 (unchanged; accept rejected)"

      - name: commission_rounding_order_per_payment_then_sum
        grounds:
          - calculations.commission_earned
          - entities.Payment.fields.amount_cents
          - entities.Account.fields.commission_earned_cents
        distinguishing_aspect: |
          With a 3333-bps GROSS creditor and two 101-cent payments, rounding each payment's commission
          to cents THEN summing gives 34+34=68, whereas summing first (202*0.3333=67.33) then rounding
          gives 67; the scaffold pins round-per-payment-then-sum so 68 is correct (mode (b), nested rounding order).
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "Creditor: commission_basis=GROSS_OF_FEES, rate 3333 bps."
            - "WORKING account, principal 100000."
            - "Two payments of 101 cents each posted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_basis: "GROSS_OF_FEES", commission_rate_bps: 3333 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 101 }
              as: Collector
          trigger:
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 101 }
              as: Collector
          assert:
            - "Account.${acct}.commission_earned_cents == 68"
            - "Account.${acct}.commission_earned_cents != 67"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cyclic_resolve_reopen_resolve
        grounds:
          - state_machines.Dispute.RESOLVED_to_REOPENED
          - state_machines.Dispute.REOPENED_to_RESOLVED
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          A Dispute moves OPEN->INVESTIGATING->RESOLVED, then REOPENED, then RESOLVED again — a cycle
          back through RESOLVED that resets resolution to null on reopen; this non-linear (cyclic) machine
          is on the Dispute entity.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account with an ACCURACY dispute resolved VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "ACCURACY" }
              as: ComplianceOfficer
              captures: { disp: $.data.id }
            - call: "POST /disputes/${disp}/investigate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /disputes/${disp}/resolve"
              payload: { resolution: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /disputes/${disp}/reopen"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /disputes/${disp}/resolve"
              payload: { resolution: "VERIFIED" }
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "after reopen, Dispute.${disp}.status == REOPENED and resolution == null"
            - "Dispute.${disp}.status == RESOLVED after the trigger resolve"
            - "${st} == RESOLVED"

      - name: account_parallel_dimensions_work_vs_contact_status
        grounds:
          - state_machines.Account.CONTACTABLE_to_CEASED
          - entities.Account.fields.work_status
          - entities.Account.fields.contact_status
        distinguishing_aspect: |
          Recording cease-communication flips Account.contact_status CONTACTABLE->CEASED while
          work_status stays WORKING — two independent state dimensions on one Account row evolve
          separately (parallel-dimension non-linearity), a different entity from Dispute's cycle.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, contact_status CONTACTABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /accounts/${acct}/cease-communication"
              payload: {}
              as: ComplianceOfficer
              captures: { cs: $.data.contact_status, ws: $.data.work_status }
          assert:
            - "Account.${acct}.contact_status == CEASED"
            - "Account.${acct}.work_status == WORKING"
            - "${cs} == CEASED and ${ws} == WORKING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_cascades_arrangement_payment_ledger_depth3
        grounds:
          - state_machines.Account.ANY_NON_TERMINAL_to_RECALLED
          - state_machines.PaymentArrangement.ACCEPTED_to_CANCELLED
          - state_machines.Payment.POSTED_to_VOIDED
        distinguishing_aspect: |
          POST recall mutates Account->RECALLED, which cancels its ACCEPTED arrangement, which in turn
          voids that arrangement's POSTED payment, which in turn restores account.amount_collected_cents
          and balance_cents — a 3-hop chain Account->Arrangement->Payment->ledger where each link is
          caused by the previous, triggered by recall.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, principal 100000."
            - "ACCEPTED PLAN arrangement; one 30000-cent payment POSTED against it (collected 30000, balance 70000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "PLAN", installment_count: 4 }
              as: Collector
              captures: { arr: $.data.id }
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 30000, arrangement_id: "${arr}" }
              as: Collector
              captures: { pay: $.data.id }
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Creditor
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/recall"
              payload: { expected_account_version: "${v_pre}" }
              as: Creditor
          assert:
            - "Account.${acct}.work_status == RECALLED"
            - "PaymentArrangement.${arr}.status == CANCELLED"
            - "Payment.${pay}.status == VOIDED"
            - "Account.${acct}.amount_collected_cents == 0"
            - "Account.${acct}.balance_cents == 100000"

      - name: validation_dispute_holds_contact_then_blocks_attempt_depth2
        grounds:
          - state_machines.Account.CONTACTABLE_to_VALIDATION_HELD
          - validations[priority=7]
          - entities.Account.fields.contact_status
        distinguishing_aspect: |
          Raising an in-window VALIDATION dispute mutates Account.contact_status CONTACTABLE->VALIDATION_HELD,
          and that held posture in turn causes a subsequent PHONE attempt to be rejected with ERR_VALIDATION_HOLD —
          a 2-hop chain Dispute->contact_status->attempt-rejection, from a different trigger than recall.
        test_recipe:
          setup:
            - "Clock at 2026-01-05T15:00:00Z (inside validation window, daytime UTC)."
            - "Validation notice sent at 2026-01-01T00:00:00Z (deadline 2026-01-31T00:00:00Z); account CONTACTABLE, work_status VALIDATION_SENT."
            - "In-window VALIDATION dispute raised -> contact_status VALIDATION_HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T15:00:00Z" }
              as: System
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "VALIDATION" }
              as: ComplianceOfficer
              captures: { disp: $.data.id }
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-01-05T15:00:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "Account.${acct}.contact_status == VALIDATION_HELD"
            - "${err} == ERR_VALIDATION_HOLD"
            - "response status == 409"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cease_safety_beats_call_window_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_CEASE_COMMUNICATION]
        distinguishing_aspect: |
          A PHONE attempt that is BOTH outside the 8am-9pm window (priority 8, business_temporal) AND on a
          CEASED account (priority 6, business_safety) returns ERR_CEASE_COMMUNICATION, proving safety
          (priority 6) wins over temporal (priority 8) — a business_safety vs business_temporal pair.
        test_recipe:
          setup:
            - "Clock at 2026-01-02T05:00:00Z (consumer offset 0 -> local 05:00, outside call window)."
            - "WORKING account, contact_status CEASED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/cease-communication"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T05:00:00Z" }
              as: System
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-01-02T05:00:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CEASE_COMMUNICATION"
            - "${err} != ERR_OUTSIDE_CALL_WINDOW"
            - "response status == 409"

      - name: time_barred_temporal_beats_settlement_floor_fiscal
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_TIME_BARRED]
        distinguishing_aspect: |
          A SETTLEMENT accept that BOTH targets a time_barred account (priority 11, business_temporal) AND
          offers below the settlement floor (priority 12, business_fiscal) returns ERR_TIME_BARRED, proving
          temporal (11) wins over fiscal (12) — a business_temporal vs business_fiscal pair distinct from the
          first conflict's safety-vs-temporal pairing.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account, charge_off 2020-01-01, sol_years=4, sol_anchor_basis=CHARGE_OFF -> time_barred TRUE."
            - "Account balance 100000 -> balance_floor 6000; age>730 -> age_floor 3000; floor = max=6000 bps."
            - "PROPOSED SETTLEMENT offer_pct_bps=3000 (below 6000 floor AND account time-barred)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2020-01-01T00:00:00Z", sol_years: 4, sol_anchor_basis: "CHARGE_OFF" }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "SETTLEMENT", offer_pct_bps: 3000 }
              as: Collector
              captures: { arr: $.data.id }
          trigger:
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "Account.${acct}.time_barred == true"
            - "${err} == ERR_TIME_BARRED"
            - "${err} != ERR_SETTLEMENT_BELOW_FLOOR"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cadence_seventh_allowed_eighth_rejected
        grounds:
          - calculations.cadence_window_count
          - validations[priority=10]
          - entities.Account.fields.attempts_in_window_count
        distinguishing_aspect: |
          The 7th cadence-counting PHONE attempt in a trailing 7-day window succeeds (attempts_in_window_count==7);
          the 8th is rejected with ERR_CADENCE_EXCEEDED — an exact >7 numeric-threshold boundary reached through
          POST /communication-attempts.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T15:00:00Z (local daytime, offset 0)."
            - "WORKING account, contact_status CONTACTABLE, no prior conversation."
            - "Seven PHONE LOGGED attempts already posted within the trailing 7-day window at distinct daytime instants."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T15:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T08:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T09:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T10:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T11:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T12:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T13:00:00Z", outcome: "LOGGED" }
              as: Collector
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T14:00:00Z", outcome: "LOGGED" }
              as: Collector
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-03-01T14:30:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "after 7th attempt Account.${acct}.attempts_in_window_count == 7"
            - "8th attempt -> ${err} == ERR_CADENCE_EXCEEDED, response status 409"
            - "Account.${acct}.attempts_in_window_count == 7 (8th not recorded)"

      - name: validation_dispute_window_day30_inclusive_day31_excluded
        grounds:
          - entities.Account.fields.validation_deadline
          - entities.Dispute.fields.within_validation_window
          - state_machines.Account.CONTACTABLE_to_VALIDATION_HELD
        distinguishing_aspect: |
          A VALIDATION dispute raised at 2026-01-30T23:59:59Z (< deadline 2026-01-31T00:00:00Z) is
          within_validation_window=true and holds contact, but one raised at exactly 2026-01-31T00:00:00Z
          is within_validation_window=false (deadline is exclusive) and does NOT hold — a datetime-exclusive
          window boundary on a different metric/endpoint (dispute creation) than the cadence count.
        test_recipe:
          setup:
            - "Validation notice sent at 2026-01-01T00:00:00Z -> validation_deadline 2026-01-31T00:00:00Z."
            - "Account CONTACTABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "VALIDATION" }
              as: ComplianceOfficer
              captures: { within: $.data.within_validation_window }
          assert:
            - "Dispute raised at deadline instant has within_validation_window == false"
            - "Account.${acct}.contact_status == CONTACTABLE (not held; window exclusive at day 31)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: attempt_blocked_by_account_cease_status
        grounds:
