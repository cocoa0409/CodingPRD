          The single most consequential role boundary in the model: verification is what
          converts a self-report into money, so the party that filed the report must not be
          able to seal it. The denial is by role at priority 10, ahead of the ownership check
          at 15 — the concessionaire here IS the owning party, so an ownership-flavoured
          error would be wrong — and the period must stay SELF_REPORTED with no money set.
