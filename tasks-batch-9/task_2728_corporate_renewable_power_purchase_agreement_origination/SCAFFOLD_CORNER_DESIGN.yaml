              captures: { deal_v1: $.data.version }
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_v1}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_id: $.data.id }
            - call: "POST /ppa/allocations/${alloc_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_1}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/deals/${deal_id}/submit-credit"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/deals/${deal_id}/execute"
              payload: {}
              as: DealCommittee
              as_user_id: "u_committee_1"
            - call: "POST /ppa/deals/${deal_id}/settlement-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
              captures: { period_id: $.data.id, period_v_stale: $.data.version }
          trigger:
            - call: "POST /ppa/settlement-periods/${period_id}/intervals"
              payload: { hour_start: "2026-08-01T00:00:00Z", metered_mwh: 30.0000, node_price_usd_per_mwh: 25.00, hub_price_usd_per_mwh: 26.00, expected_settlement_period_version: "${period_v_stale}", curtailment_flag: false }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /ppa/settlement-periods/${period_id}/intervals"
              payload: { hour_start: "2026-08-01T01:00:00Z", metered_mwh: 28.0000, node_price_usd_per_mwh: 24.00, hub_price_usd_per_mwh: 26.00, expected_settlement_period_version: "${period_v_stale}", curtailment_flag: false }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /ppa/settlement-periods/${period_id}"
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
              captures: { period_v_fresh: $.data.version }
            - call: "POST /ppa/settlement-periods/${period_id}/intervals"
              payload: { hour_start: "2026-08-01T01:00:00Z", metered_mwh: 28.0000, node_price_usd_per_mwh: 24.00, hub_price_usd_per_mwh: 26.00, expected_settlement_period_version: "${period_v_fresh}", curtailment_flag: false }
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "the first trigger returns 201 and SettlementPeriod.${period_id}.interval_count becomes 1 with total_metered_mwh 30.0000"
            - "the second trigger returns 412 with error_id ERR_STALE_VERSION: hour 01 is a brand-new slot with no duplicate and no boundary problem, but ${period_v_stale} was minted before hour 00 landed"
            - "SettlementPeriod.${period_id}.interval_count is still 1 after the refusal and GET /ppa/settlement-periods/${period_id}/intervals returns total_count 1"
            - "${period_v_fresh} equals ${period_v_stale} plus one, and the fourth trigger returns 201 under it"
            - "SettlementPeriod.${period_id}.interval_count is finally 2 with total_metered_mwh 58.0000 = 30.0000 + 28.0000, status still OPEN, and calculated_at still null because posting intervals does not calculate"

      # ---------------------------------------------------------------------
      # The remaining three declared layers are each the whole subject of a
      # §1.8 instance; restating them here would duplicate those tests.
      # ---------------------------------------------------------------------
      - name: cascading_side_effects_verified_end_to_end_with_ordering_sensitivity
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Project.NTP_ISSUED_to_OPERATIONAL
          - state_machines.Deal.EXECUTED_to_EFFECTIVE
          - endpoints.POST_/ppa/projects/{id}/advance-milestone
        excluded_because:
          difficulty_instance: "transitive_cascade / milestone_advance_five_hop_cascade_to_effective_and_security_release"
          rationale: |
            That instance walks the full five-hop chain from one milestone advance through
            CP satisfaction, cp_completion_pct recomputation, the EXECUTED to EFFECTIVE
            transition and the DEVELOPMENT_SECURITY release, asserting each hop's observable
            separately and showing that a hop skipped in the wrong order leaves the deal in
            EXECUTED. Its sibling instance does the same for the risk-event cascade into
            SUPPORT_SHORTFALL, so both the ordering and the partial-progress cases are held.

      - name: dual_variant_calculations_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.settlement_netting
          - calculations.offtaker_credit_score
          - entities.SettlementPeriod.fields.netting_method
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_netting_hourly_versus_monthly_diverges_by_50_00"
          rationale: |
            The layer's two claims - each variant produces its own result, and the delta on
            switching is correct - are exactly that instance's construction: one interval set
            settled HOURLY and MONTHLY with a pinned divergence. Its sibling does the same
            for the STANDALONE versus GUARANTOR_SUPPORTED credit score, so both dual-variant
            calculations in §1.2 are already covered at depth.

      - name: rate_and_threshold_triggers_tested_at_their_exact_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.offtaker_credit_tier
          - calculations.credit_support_requirement
          - entities.Deal.fields.collateral_threshold_usd
        excluded_because:
          difficulty_instance: "boundary_precision_check / credit_tier_at_exact_standard_threshold_62_00"
          rationale: |
            The cumulative-threshold boundary is that instance: a score landing exactly on
            STANDARD_MIN 62.00 tiers up rather than down, with the neighbouring 61.99 case
            for contrast. The collateral-threshold side of the layer is covered by the
            calculations-section instance credit_support_requirement_rounds_up_to_a_whole_increment,
            which walks the COLLATERAL_INCREMENT_USD 250000 rounding boundary.

  # =========================================================================
  # Guide section 9: consistency model. §1.0 declares
  # consistency_model: immediate, so the single applicable row is "all changes
  # visible in same request's response" - including changes the write makes to
  # OTHER entities, which is the part an eventual-consistency implementation
  # would get wrong.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_every_write_response_and_neighbour_read_is_already_current
        claim_type: immediate
        grounds:
          - endpoints.POST_/ppa/offtakers/{id}/submit-qualification
          - endpoints.POST_/ppa/deals
          - endpoints.GET_/ppa/projects/{id}
          - entities.Offtaker.fields.credit_score
          - entities.Project.fields.contracted_mw
          - entities.Deal.fields.unallocated_mw
          - calculations.offtaker_credit_score
          - calculations.credit_support_requirement
        distinguishing_aspect: |
          No write in this API is allowed to lag: the submit-qualification response itself
          already carries all four computed scores, the deal-create response already carries
          the priced and sized credit terms, and - the part that separates immediate from
          eventual consistency - the very next read of the PARENT project already shows the
          capacity the deal just booked, with no second write and no re-trigger of any
          recompute. Every number below is asserted from the first response that could
          possibly contain it, never from a later reconciliation read.
        test_recipe:
          setup:
            - "One pricing node, one 100.000 MW SOLAR project with contracted_mw 0.000 and available_mw 100.000, and one DRAFT Northwind offtaker with all computed fields still null."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
          trigger:
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_id: $.data.id, deal_v1: $.data.version }
            - call: "GET /ppa/projects/${project_id}"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_v1}", joint_and_several: true }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_id: $.data.id }
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/allocations/${alloc_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "GET /ppa/deals/${deal_id}"
              as: Originator
              as_user_id: "u_orig_1"
          assert:
            - "the first trigger's OWN response body already carries credit_score 83.70 = round(0.55 * 84 + 0.30 * 75 + 0.15 * 100, 2), credit_score_variant STANDALONE, credit_tier PRIME, sustainability_score 100.00 = 40 + 30 + 20 + 10 and unsecured_credit_limit_usd 3000000.00 = min(25000000.00, round(60000000.00 * 0.05, 2)), with qualification_status UNDER_REVIEW - no follow-up read is needed to see any of them"
            - "the second trigger's response carries qualification_status QUALIFIED, conditions [] and decision_by_user_id u_credit_1 in the same body"
            - "the third trigger's response already carries contract_price_usd_per_mwh 22.75, price_tier LOW, expected_annual_mwh 61320.00 = round(25.000 * 8760 * 0.28, 2), exposure_usd 1395030.00 = round(61320.00 * 22.75, 2), collateral_threshold_usd 3000000.00, credit_support_required_usd 0.00 and unallocated_mw 25.000"
            - "the fourth trigger - a read of a DIFFERENT entity taken immediately after that create, with no intervening write - already reports Project.${project_id}.contracted_mw 25.000 and available_mw 75.000: the parent's derived capacity does not lag its child's creation"
            - "the sixth trigger shows Deal.${deal_id}.unallocated_mw 0.000 immediately after the PROPOSED allocation, while confirmed_allocated_mw is still 0.000"
            - "the eighth trigger shows confirmed_allocated_mw 25.000 immediately after the CONFIRM, with unallocated_mw still 0.000 and version advanced twice from ${deal_v1}"
            - "no assertion in this instance required a second read of the same entity to become true, which is what consistency_model immediate means"
