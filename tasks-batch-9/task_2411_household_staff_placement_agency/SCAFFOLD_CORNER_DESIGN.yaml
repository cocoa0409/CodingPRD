          - IDENTITY
          - CRIMINAL
          - DMV
        captures:
          bgv_id: $.data.id
      - call: POST /background-verifications/${bgv_id}/record-result
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          result: CLEARED
          findings_note: No adverse findings.
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: 5000000
          memo: Balance carried at the credit limit.
      trigger:
      - call: POST /role-requisitions/${req_id}/trial-engagements
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          engagement_type: TRIAL_DAY
          start_at: '2026-08-10T09:00:00Z'
          end_at: '2026-08-10T17:00:00Z'
          day_rate_cents: 40000
        captures:
          trial_id: $.data.id
      asserts:
      - GET /clients/${client_id} as BillingAdministrator shows outstanding_balance_cents == 5000000
      - the trigger returns 201 with status == SCHEDULED and iso_week_key == 2026-W33
      - the answer is not ERR_CLIENT_CREDIT_HOLD
      - GET /role-requisitions/${req_id} as PlacementConsultant shows status == TRIALING with active_trial_count
        == 1
  - name: the_weekly_trial_cap_counts_finished_trials_and_resets_with_the_iso_week
    claim_type: rate_threshold_triggers
    grounds: validations.candidate_weekly_trial_cap (priority 78); entities.TrialEngagement.iso_week_key;
      global_constants.CANDIDATE_WEEKLY_TRIAL_CAP 2
    excluded_because:
      difficulty_instance: weekly_trial_cap_counts_finished_rows_in_the_same_iso_week
      rationale: Queue A already fills the bucket with finished rows, refuses the third booking in the
        same ISO week and admits it in the next one.
  - name: a_milestone_ages_only_once_the_clock_passes_its_due_date
    claim_type: rate_threshold_triggers
    grounds: state_machines.FeeMilestone INVOICED -> OVERDUE (strictly after due_date); global_constants.NET_TERMS_DAYS
      14
    excluded_because:
      difficulty_instance: milestone_becomes_overdue_only_after_the_due_date_has_passed
      rationale: Queue A already sweeps the clock onto the due date and then one day past it, which is
        exactly the boundary of this trigger.
- section: consistency_model
  instances:
  - name: the_confirmation_response_already_carries_every_recomputed_value
    claim_type: immediate
    grounds: complexity_profile.consistency_model immediate; endpoints.POST /placements/{id}/confirm-start
      side_effects; calculations.placement_fee_computation variant FINAL
    distinguishing_aspect: The confirmation recomputes the fee, re-runs the milestone allocation and moves
      three other entities, and all of it must be readable in the very response that triggered it as well
      as in immediate re-reads - no deferred recomputation.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          fs_id: $.data.id
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 10000000
          schedule_pattern: FIVE_TWO
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Live-out housekeeper, five days on two off.
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Fee band resolved.
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: P. Danvers
          contact_email: pdanvers@mail.example
          primary_role_type: HOUSEKEEPER
          years_experience: 10
          live_in_willing: true
        captures:
          cand_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Whitfield Residence
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2022-01
          employment_end_month: 2022-12
          contact_email: whitfield@mail.example
        captures:
          ref1_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Marlow Estate
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2023-01
          employment_end_month: 2023-12
          contact_email: marlow@mail.example
          prior_reference_id: ${ref1_id}
        captures:
          ref2_id: $.data.id
      - call: POST /reference-checks/${ref1_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Confirmed by telephone.
      - call: POST /reference-checks/${ref2_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Confirmed by telephone.
      - call: POST /candidates/${cand_id}/background-verifications
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          provider_reference: BV-2411-01
          scope_items:
          - IDENTITY
          - CRIMINAL
          - DMV
        captures:
          bgv_id: $.data.id
      - call: POST /background-verifications/${bgv_id}/record-result
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          result: CLEARED
          findings_note: No adverse findings.
      - call: POST /role-requisitions/${req_id}/trial-engagements
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          engagement_type: TRIAL_DAY
          start_at: '2026-08-10T09:00:00Z'
          end_at: '2026-08-10T17:00:00Z'
          day_rate_cents: 40000
        captures:
          trial_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-10T17:00:00Z'
      - call: POST /trial-engagements/${trial_id}/start
        as: PlacementConsultant
        payload:
          note: Household received the candidate.
      - call: POST /trial-engagements/${trial_id}/record-outcome
        as: PlacementConsultant
        payload:
          outcome: PASSED
          outcome_note: Household verdict recorded.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v1: $.data.version
      - call: POST /role-requisitions/${req_id}/accommodation-terms
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          live_in: false
          weekly_hours: 40
          days_off_per_week: 2
          private_quarters: false
          imputed_accommodation_cents: 0
          expected_requisition_version: ${req_v1}
          note: Opening position on hours and accommodation.
        captures:
          term_id: $.data.id
      - call: POST /accommodation-terms/${term_id}/respond
        as: Client
        payload:
          response: ACCEPT
          note: Response recorded.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v2: $.data.version
      - call: POST /placements
        as: PlacementConsultant
        payload:
          requisition_id: ${req_id}
          candidate_id: ${cand_id}
          start_date: '2026-09-01'
          base_salary_cents: 6000000
          guaranteed_bonus_cents: 2000000
          accommodation_imputed_cents: 0
          overtime_allowance_cents: 2000000
          expected_requisition_version: ${req_v2}
        captures:
          plc_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-09-01T00:00:00Z'
      trigger:
      - call: POST /placements/${plc_id}/confirm-start
        as: AgencyPrincipal
        payload:
          note: Package confirmed on the start date.
      asserts:
      - the trigger response itself carries placement_status == ACTIVE, fee_variant == FINAL, fee_cents
        == 2000000, guarantee_expires_on == 2026-11-30 and version == 2
      - GET /placements/${plc_id} as AgencyPrincipal immediately afterwards returns the identical field
        values
      - GET /role-requisitions/${req_id} as PlacementConsultant immediately reads status == PLACED
      - GET /candidates/${cand_id} as VettingSpecialist immediately reads availability_status == PLACED
      - GET /clients/${client_id} as AgencyPrincipal immediately reads placement_count == 1 and non_solicitation_expires_on
        == 2028-08-31
      - GET /placements/${plc_id}/fee-milestones as BillingAdministrator immediately returns amounts 600000,
        600000 and 800000
  - name: a_negative_ledger_movement_is_visible_on_the_household_at_once
    claim_type: immediate
    grounds: complexity_profile.consistency_model immediate; calculations.client_receivable_balance (the
      balance may be negative); entities.Client.outstanding_balance_cents
    distinguishing_aspect: 'The derived household balance is not a cached counter: a credit movement is
      folded into it in the same request that appends the row, and the household reads negative immediately
      rather than after a later reconciliation.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: -250000
          memo: Credit note issued to the household.
      asserts:
      - the trigger returns 201 with signed_amount_cents == -250000 and balance_after_cents == -250000
      - GET /clients/${client_id} as BillingAdministrator immediately reads outstanding_balance_cents
        == -250000
      - GET /clients/${client_id}/ledger-entries as BillingAdministrator immediately returns total_count
        == 1 with sequence_no == 1
