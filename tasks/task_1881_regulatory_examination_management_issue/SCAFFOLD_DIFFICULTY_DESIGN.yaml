          Issue entity exhibits a CYCLE: IN_PROGRESS -> VALIDATION_SUBMITTED -> IN_PROGRESS on
          closure rejection. Multiple rounds are supported (request_round increments); this is
          not a revert-to-initial linear undo but a genuine revision loop on the Issue lifecycle.
        test_recipe:
          setup:
