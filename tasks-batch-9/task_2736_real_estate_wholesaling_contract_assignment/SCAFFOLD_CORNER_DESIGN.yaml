        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_PAGINATION_OUT_OF_RANGE]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and is rejected 400 ERR_PAGINATION_OUT_OF_RANGE rather than being silently clamped to 100, and the check runs before any filter resolution."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One wholesaler with a single seller lead, so a clamped implementation would have returned a 200 with one row."
