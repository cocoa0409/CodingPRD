            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "RESIDENT_SELF_HAUL", tree_count: 2, size_class: "SMALL" }
              as: SiteSupervisor
