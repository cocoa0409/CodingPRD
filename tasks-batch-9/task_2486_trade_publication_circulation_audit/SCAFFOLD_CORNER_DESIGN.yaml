          rationale: "The named §1.8 instance asserts both the FROZEN rejection and the restatement exemption on the same publication."

      - name: certify_with_stale_breakdown_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=42]", "errors[ERR_BREAKDOWN_STALE]"]
        excluded_because:
          difficulty_instance: transitive_cascade / hygiene_sweep_three_hop_posture_staleness_cascade
          rationale: "The named §1.8 instance ends by asserting the certify call returns ERR_BREAKDOWN_STALE after the sweep invalidated the statement."

      - name: overlapping_statement_period_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=61]", "errors[ERR_STATEMENT_PERIOD_OVERLAP]"]
        excluded_because:
