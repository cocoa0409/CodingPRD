    roles: [WarehouseManager]
    code: 201
    input: [stocking_order_id, product_id, bundles_returned, loose_sheets_returned]
    output: BundleReturn
    side_effects: ["status=PENDING_INSPECTION"]

  - method: GET
    path: "/supply/bundle-returns/{id}"
    description: "Fetch a bundle return"
    roles: [WarehouseManager, CreditManager, AccountsReceivableUser]
    code: 200
    input: []
    output: BundleReturn
    side_effects: []

  - method: GET
    path: "/supply/bundle-returns"
    description: "List returns (filterable by order / product / status)"
    roles: [WarehouseManager, CreditManager, AccountsReceivableUser]
    code: 200
    input: ["limit?", "offset?", "stocking_order_id?", "product_id?", "status?"]
    output: "BundleReturn[]"
    side_effects: []

  - method: POST
    path: "/supply/bundle-returns/{id}/accept"
    description: "Accept a return; computes restock fee and credits the account"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: BundleReturn
    side_effects: ["compute restock_fee_cents, credit_cents", "Account.ar_outstanding_cents -= credit_cents (floor 0)"]

  - method: POST
    path: "/supply/bundle-returns/{id}/reject"
    description: "Reject a return"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: BundleReturn
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/supply/_clock/set_current_utc"
    description: "Set the server's logical clock; default startup time is 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time"
    roles: [CreditManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets logical clock used by all date-dependent validations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve (or is out of tenant scope)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in the correct state for the requested transition" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED (or CLOSED); operation blocked" }
  - { id: ERR_ACCOUNT_BALANCE_OPEN, http: 409, condition: "Account close attempted with non-zero ar_outstanding_cents" }
  - { id: ERR_FRAMING_NOT_READY, http: 422, condition: "framing_pct_complete < 50 on open-stocking" }
  - { id: ERR_NO_LOCKED_TAKEOFF, http: 422, condition: "open-stocking requires at least one LOCKED takeoff on the project" }
  - { id: ERR_ORDERS_IN_FLIGHT, http: 409, condition: "Project cannot close/cancel while a StockingOrder is SCHEDULED or DISPATCHED" }
  - { id: ERR_EMPTY_TAKEOFF, http: 422, condition: "Takeoff has no ACTIVE lines on submit" }
  - { id: ERR_TAKEOFF_NOT_SUBMITTED, http: 409, condition: "Lock attempted on a takeoff not in SUBMITTED state" }
  - { id: ERR_TAKEOFF_IN_USE, http: 409, condition: "Cancel attempted on a takeoff referenced by a SCHEDULED or DISPATCHED stocking order" }
  - { id: ERR_TAKEOFF_NOT_LOCKED, http: 409, condition: "StockingOrder schedule requires the referenced takeoff to be LOCKED" }
  - { id: ERR_SPECIAL_ORDER_LEAD_TIME, http: 422, condition: "Rated board line submitted with framing_pct_complete < 30" }
  - { id: ERR_PROJECT_NOT_STOCKING_OPEN, http: 409, condition: "StockingOrder schedule requires project.status == STOCKING_OPEN" }
  - { id: ERR_TRUCK_INACTIVE, http: 422, condition: "BoomTruck.active is false" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "StockingOrder has no drops on schedule" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Total bundles exceed boom-truck bundle capacity" }
  - { id: ERR_WEIGHT_EXCEEDED, http: 422, condition: "Total weight exceeds boom-truck weight capacity" }
  - { id: ERR_SHIFT_DOUBLE_BOOKED, http: 409, condition: "(truck, date, shift) already reserved by another SCHEDULED/DISPATCHED order" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "scheduled_date earlier than today + max lead time of rated products on the order" }
  - { id: ERR_NOT_DISPATCH_DAY, http: 409, condition: "Dispatch attempted on a date other than scheduled_date" }
  - { id: ERR_ORDER_NOT_STOCKED, http: 409, condition: "BundleReturn requires source StockingOrder status == STOCKED" }
  - { id: ERR_OVER_RETURN, http: 422, condition: "Cumulative returns for a product on an order exceed delivered quantity" }
  - { id: ERR_RATED_NON_RETURNABLE, http: 422, condition: "FIRE_RATED or MOISTURE_RATED products are not returnable" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds draw remaining balance" }
  - { id: ERR_DRAW_HAS_PAYMENTS, http: 409, condition: "Void attempted on a draw with paid_cents > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_takeoff_version != current Takeoff.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CreditManager
    description: "Supply-house credit/AR officer; manages contractor accounts, product pricing is visible, can void draws"
    identity: opaque
    exclusive_operations:
      - "POST /supply/contractor-accounts"
      - "POST /supply/contractor-accounts/{id}/suspend"
      - "POST /supply/contractor-accounts/{id}/reinstate"
      - "POST /supply/contractor-accounts/{id}/close"
      - "POST /supply/draw-requests/{id}/void"
      - "POST /supply/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (read-only)"

  - name: EstimatorUser
    description: "Supply-house inside sales / estimator; builds takeoffs, adds lines, submits and locks"
    identity: opaque
    exclusive_operations:
      - "POST /supply/takeoffs"
      - "POST /supply/takeoffs/{id}/lines"
      - "DELETE /supply/takeoffs/{id}/lines/{line_id}"
      - "POST /supply/takeoffs/{id}/submit"
      - "POST /supply/takeoffs/{id}/lock"
      - "POST /supply/takeoffs/{id}/cancel"
    shared_operations:
      - "POST /supply/projects (shared with ContractorAdmin)"
      - "GET endpoints (read-only)"

  - name: DispatcherUser
    description: "Supply-house dispatcher; owns boom-truck fleet and stocking-order scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /supply/boom-trucks"
      - "PATCH /supply/boom-trucks/{id}"
      - "POST /supply/stocking-orders"
      - "POST /supply/stocking-orders/{id}/drops"
      - "POST /supply/stocking-orders/{id}/schedule"
      - "POST /supply/stocking-orders/{id}/dispatch"
      - "POST /supply/stocking-orders/{id}/cancel"
    shared_operations:
      - "GET endpoints (read-only)"

  - name: Foreman
    description: "Contractor-side foreman at the jobsite; reports framing progress, opens/closes stocking, confirms stocked"
    identity: opaque
    exclusive_operations:
      - "PATCH /supply/projects/{id}"
      - "POST /supply/projects/{id}/open-stocking"
      - "POST /supply/projects/{id}/close-stocking"
      - "POST /supply/stocking-orders/{id}/mark-stocked"
    shared_operations:
      - "GET endpoints (read-only)"

  - name: ContractorAdmin
    description: "Contractor-side admin; can create projects and cancel projects"
    identity: opaque
    exclusive_operations:
      - "POST /supply/projects/{id}/cancel"
    shared_operations:
      - "POST /supply/projects (shared with EstimatorUser)"
      - "GET endpoints (read-only)"

  - name: AccountsReceivableUser
    description: "Supply-house AR clerk; applies payments to draw requests"
    identity: opaque
    exclusive_operations:
      - "POST /supply/draw-requests/{id}/payments"
    shared_operations:
      - "GET endpoints (read-only)"

  - name: WarehouseManager
    description: "Supply-house warehouse lead; registers products, files and adjudicates returns"
    identity: opaque
    exclusive_operations:
      - "POST /supply/products"
      - "PATCH /supply/products/{id}"
      - "POST /supply/bundle-returns"
      - "POST /supply/bundle-returns/{id}/accept"
      - "POST /supply/bundle-returns/{id}/reject"
    shared_operations:
      - "GET endpoints (read-only)"
