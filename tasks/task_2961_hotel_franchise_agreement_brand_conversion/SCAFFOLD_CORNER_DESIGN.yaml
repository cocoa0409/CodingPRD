# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2961 — Hotel Franchise Agreement & Brand Conversion
#
# The nine `section:` values below are the nine sections of
# references/claim-extraction-guide.md, and every `claim_type:` is a row of that
# section's table — no invented categories. Corners already asserted by an instance in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs with no test_recipe.
# Every numeric literal in an `assert:` was computed with decimal.Decimal / ROUND_HALF_UP
# against §1.3's formula and `constants:` block; every date literal by day arithmetic from
# the logical clock the chain last set. The clock reads 2026-08-01T00:00:00Z by default.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: brand_create_returns_every_declared_field_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.Brand
          - endpoints.POST_/brands
          - response_envelope.success
        distinguishing_aspect: "POST /brands with all eight input fields returns 201, a meta/response_type/data envelope, the eight submitted values echoed and both derived counters seeded at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
          trigger:
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
          assert:
            - "HTTP 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "Brand.${brand_id}.code == SOLARIS"
            - "Brand.${brand_id}.tier == UPSCALE"
            - "Brand.${brand_id}.base_royalty_rate_pct == 5.00"
            - "Brand.${brand_id}.marketing_fund_rate_pct == 2.50"
            - "Brand.${brand_id}.protected_radius_miles == 5.00"
            - "Brand.${brand_id}.min_room_count == 80"
            - "Brand.${brand_id}.standard_term_years == 20"
            - "Brand.${brand_id}.operating_unit_count == 0"
            - "Brand.${brand_id}.open_application_count == 0"
            - "Brand.${brand_id}.id, created_at and updated_at are server-generated and non-null"

      - name: owner_read_back_matches_the_created_financial_profile
        claim_type: retrieval
        grounds:
          - endpoints.GET_/owners/{id}
          - entities.Owner
        distinguishing_aspect: "GET /owners/{id} returns the same five financial inputs and both derived capacity variants that POST /owners persisted, with no recomputation drift."
        test_recipe:
          setup:
            - "One owner registered with 6000000.00 liquid, 18000000.00 net worth, credit 760 and four existing units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "GET /owners/${owner_id}"
              payload: {}
              as: FranchiseDevelopmentManager
          assert:
            - "HTTP 200"
            - "Owner.${owner_id}.legal_name == Harbor Point Hospitality LP"
            - "Owner.${owner_id}.liquid_assets_amount == 6000000.00"
            - "Owner.${owner_id}.net_worth_amount == 18000000.00"
            - "Owner.${owner_id}.credit_score == 760"
            - "Owner.${owner_id}.existing_units_count == 4"
            - "Owner.${owner_id}.capacity_score_standalone == 96.67"
            - "Owner.${owner_id}.capacity_score_portfolio_adjusted == 100.00"
            - "Owner.${owner_id}.status == PROSPECT"
            - "Owner.${owner_id}.financial_profile_revision == 0"

      - name: list_applications_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three applications on one brand, GET /applications at limit 2 returns exactly 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup:
            - "Brand SOLARIS with three SUBMITTED applications filed by the same owner on 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_one_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Northgate Hotel", market_code: "SEANE", property_x_miles: 20.00, property_y_miles: 0.00, room_count: 140, current_affiliation: "INDEPENDENT", building_age_years: 11, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_two_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Southpark Hotel", market_code: "SEASO", property_x_miles: 40.00, property_y_miles: 0.00, room_count: 96, current_affiliation: "OUR_BRAND", building_age_years: 6, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_three_id: $.data.id }
          trigger:
            - call: "GET /applications"
              payload: { brand_id: "${brand_id}", status: "SUBMITTED", limit: 2, offset: 0 }
              as: FranchiseDevelopmentManager
            - call: "GET /applications"
              payload: { brand_id: "${brand_id}", status: "SUBMITTED", limit: 2, offset: 2 }
              as: FranchiseDevelopmentManager
          assert:
            - "The first list call returns HTTP 200 with response_type == array, exactly 2 data rows, total_count == 3 and has_more == true"
            - "The second list call returns exactly 1 data row, total_count == 3 and has_more == false"
            - "Both calls order rows by created_at ascending, so the first page holds ${app_one_id} and ${app_two_id} and the second holds ${app_three_id}"
            - "Brand.${brand_id}.open_application_count == 3"

      - name: get_agreement_with_unknown_uuid_returns_agreement_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: "A well-formed UUID that names no LicenseAgreement returns 404 ERR_AGREEMENT_NOT_FOUND, not 200 with an empty body and not 400."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
          trigger:
            - call: "GET /agreements/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: FranchiseDevelopmentManager
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_AGREEMENT_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: application_create_missing_required_room_count_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - entities.Application.fields.room_count
        distinguishing_aspect: "Omitting room_count, an input field with no default, returns 400 ERR_INVALID_REQUEST and persists no Application row."
        test_recipe:
          setup:
            - "Brand SOLARIS and one registered owner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /applications with brand_id ${brand_id} returns total_count == 0"
            - "Brand.${brand_id}.open_application_count == 0"

      - name: owner_create_defaults_status_to_prospect_and_revision_to_zero
        claim_type: defaults
        grounds:
          - entities.Owner.fields.status
          - entities.Owner.fields.financial_profile_revision
        distinguishing_aspect: "POST /owners never accepts status or financial_profile_revision as input, and the created row defaults to PROSPECT / 0 with both capacity bands already derived."
        test_recipe:
          setup:
            - "Empty database; a thin-portfolio owner is registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Cascade Thin Portfolio LLC", contact_email: "thin@cascadethin.example", liquid_assets_amount: 2400000.00, net_worth_amount: 7500000.00, credit_score: 680, existing_units_count: 3 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Owner.${owner_id}.status == PROSPECT"
            - "Owner.${owner_id}.financial_profile_revision == 0"
            - "Owner.${owner_id}.capacity_band_standalone == INSUFFICIENT"
            - "Owner.${owner_id}.capacity_band_portfolio_adjusted == INSUFFICIENT"

      - name: existing_unit_create_extra_field_status_is_ignored_input
        claim_type: system_fields
        grounds:
          - entities.ExistingUnit.fields.status
          - validations[priority=7]
          - state_machines.ExistingUnit.status
        distinguishing_aspect: "status is a system field: an unknown status key in the create body is ignored and the unit is still created OPERATING, incrementing the brand's operating_unit_count."
        test_recipe:
          setup:
            - "Brand SOLARIS with no units yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /existing-units"
              payload: { brand_id: "${brand_id}", unit_name: "Solaris Lakeside", market_code: "SEADT", x_miles: 1.20, y_miles: 1.60, room_count: 100, adr_amount: 310.00, occupancy_pct: 72.00, territory_start_date: "2016-06-01", territory_end_date: "2026-09-30", status: "TERMINATED" }
              as: BrandStandardsDirector
              captures: { unit_id: $.data.id }
          assert:
            - "HTTP 201"
            - "ExistingUnit.${unit_id}.status == OPERATING (the submitted TERMINATED value is ignored)"
            - "ExistingUnit.${unit_id}.status_reason == null"
            - "Brand.${brand_id}.operating_unit_count == 1"

      - name: brand_create_with_a_code_another_brand_holds_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=30]
          - errors.ERR_BRAND_CODE_TAKEN
        distinguishing_aspect: "Brand.code is unique across the estate: a second POST /brands carrying SOLARIS returns 409 ERR_BRAND_CODE_TAKEN and creates no second row."
        test_recipe:
          setup:
            - "One brand already published under code SOLARIS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection Reserve", tier: "LUXURY", base_royalty_rate_pct: 6.00, marketing_fund_rate_pct: 2.80, protected_radius_miles: 6.00, min_room_count: 90, standard_term_years: 15 }
              as: BrandStandardsDirector
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_BRAND_CODE_TAKEN"
            - "GET /brands/${brand_id} still reports name == Solaris Collection and tier == UPSCALE"

      - name: application_create_with_unknown_affiliation_returns_invalid_enum_error
        claim_type: type_constraints
        grounds:
          - entities.Application.fields.current_affiliation
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "current_affiliation is closed over {COMPETITOR, INDEPENDENT, OUR_BRAND}; the value BOUTIQUE returns 400 ERR_INVALID_REQUEST rather than being stored and later defaulting the conversion adjustment to 0.00."
        test_recipe:
          setup:
            - "Brand SOLARIS and one registered owner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "BOUTIQUE", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
          assert:
            - "HTTP 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "Brand.${brand_id}.open_application_count == 0"

      - name: pip_item_create_under_an_unknown_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_PIP_NOT_FOUND
          - entities.PipItem.fields.pip_id
        distinguishing_aspect: "A scope line addressed to a plan id that does not exist returns 404 ERR_PIP_NOT_FOUND; the path is validated left to right before any body rule runs."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no plan has been scoped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
          trigger:
            - call: "POST /pips/99999999-8888-7777-6666-555555555555/items"
              payload: { category: "GUESTROOM", priority: "MAJOR", description: "Guestroom soft goods", estimated_cost: 2400000.00 }
              as: BrandStandardsDirector
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_PIP_NOT_FOUND"

      - name: encroachment_claim_naming_a_unit_of_another_brand_is_rejected
        claim_type: flat
        grounds:
          - validations[priority=40]
          - errors.ERR_UNIT_NOT_OPERATING
          - entities.EncroachmentClaim.fields.existing_unit_id
        distinguishing_aspect: "Flat-topology FK integrity: the claimant unit must belong to the SAME brand as the application, so an OPERATING POLARIS hotel filing against a SOLARIS conversion returns 422 ERR_UNIT_NOT_OPERATING even though the unit exists and is operating."
        test_recipe:
          setup:
            - "Two brands: SOLARIS (the conversion brand, no units) and POLARIS with one OPERATING unit 2.00 miles from the property."
            - "A SOLARIS application UNDER_REVIEW whose impact study ran on 2026-08-05, so the claim window is open until 2026-08-26."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /brands"
              payload: { code: "POLARIS", name: "Polaris Select", tier: "MIDSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { other_brand_id: $.data.id }
            - call: "POST /existing-units"
              payload: { brand_id: "${other_brand_id}", unit_name: "Polaris Lakeside", market_code: "SEADT", x_miles: 1.20, y_miles: 1.60, room_count: 100, adr_amount: 190.00, occupancy_pct: 70.00, territory_start_date: "2016-06-01", territory_end_date: "2036-06-01" }
              as: BrandStandardsDirector
              captures: { other_unit_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: {}
              as: BrandStandardsDirector
          trigger:
            - call: "POST /applications/${app_id}/encroachment-claims"
              payload: { existing_unit_id: "${other_unit_id}", claimed_revenue_loss_pct: 8.00, narrative: "Filed by a hotel of a different brand." }
              as: BrandStandardsDirector
          assert:
            - "HTTP 422"
            - "data.error_id == ERR_UNIT_NOT_OPERATING"
            - "ExistingUnit.${other_unit_id}.status == OPERATING (the rejection is about brand mismatch, not unit state)"
            - "Application.${app_id}.preliminary_impact_score == 0.00 and Application.${app_id}.impact_unit_count_preliminary == 0 (a foreign brand's hotel is not in the input set either)"
            - "GET /encroachment-claims with application_id ${app_id} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_starts_in_submitted_state_on_both_review_axes_not_started
        claim_type: initial_state
        grounds:
          - state_machines.Application.status.initial_state
          - state_machines.Application.financial_review_status.initial_state
          - state_machines.Application.impact_study_status.initial_state
        distinguishing_aspect: "A freshly filed application sits at SUBMITTED with revision_round 0 and BOTH independent review axes at NOT_STARTED, and every review snapshot field is null rather than zero."
        test_recipe:
          setup:
            - "Brand SOLARIS and one registered owner; nothing else has happened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Application.${app_id}.status == SUBMITTED"
            - "Application.${app_id}.revision_round == 0"
            - "Application.${app_id}.financial_review_status == NOT_STARTED"
            - "Application.${app_id}.impact_study_status == NOT_STARTED"
            - "Application.${app_id}.capacity_basis == null and Application.${app_id}.capacity_score_at_review == null and Application.${app_id}.capacity_band_at_review == null"
            - "Application.${app_id}.preliminary_impact_score == null and Application.${app_id}.final_impact_score == null and Application.${app_id}.encroachment_verdict == null"
