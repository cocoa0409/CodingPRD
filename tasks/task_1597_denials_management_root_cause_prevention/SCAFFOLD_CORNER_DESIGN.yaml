      - name: specialist_cannot_approve_writeoff
        claim_type: violation_to_error
        grounds: ["roles[DenialsManager].shared_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Write-off approval is a manager/director operation: the DenialsSpecialist who created the request gets ERR_FORBIDDEN on approve (role gate precedes the SoD check)."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2503 (denied 100000) QUEUED; write-off 100000 created by spec-1"]
