  - section: complexity_layers
    instances:
      - name: optimistic_concurrency_stale_period_version_blocks_regeneration_then_the_refreshed_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.provisional-statement-stale-period
          - errors.ERR_STALE_PERIOD_VERSION
          - state_machines.BillingPeriod.PROVISIONAL_to_PROVISIONAL
        distinguishing_aspect: "Regeneration is a legal transition (PROVISIONAL -> PROVISIONAL), so nothing but the version guard can stop a replay: the first projection succeeds and bumps period.version, the byte-identical replay with the same expected_billing_period_version is refused 412 without creating or superseding a statement, and the same body with the refreshed version succeeds and supersedes the earlier projection."
        test_recipe:
          setup:
            - "ACTIVE contract C1 (MONO tier 1 @9375, no minimums) with one ACTIVE device D1 and period P1 2026-08-01 .. 2026-09-01"
            - "one ACCEPTED read of 3000 mono pages covering [2026-08-01, 2026-08-15); logical clock at 2026-08-15T00:00:00Z"
