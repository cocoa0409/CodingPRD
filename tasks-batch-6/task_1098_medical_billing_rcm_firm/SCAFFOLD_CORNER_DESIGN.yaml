              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 3000, coinsurance_pct: 0.20, copay_cents: 2000 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-c3"
            - call: "POST /rcm/patient-statements"
              payload: { claim_id: "${claim_id}" }
              as: PaymentPoster
              captures: { stmt_id: $.data.id }
            - call: "POST /rcm/patient-statements/${stmt_id}/send"
              payload: {}
              as: PaymentPoster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "POST /rcm/patient-statements/${stmt_id}/collections"
              payload: {}
              as: PaymentPoster
              captures: { st: $.data.status }
          assert:
            - "PatientStatement.${stmt_id}.status == COLLECTIONS"
            - "PatientStatement.${stmt_id}.aging_bucket == OVER_90"
  - section: validations
    instances:
      - name: scrub_claim_with_no_lines_returns_no_claim_lines
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NO_CLAIM_LINES]"]
