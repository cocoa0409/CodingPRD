  - name: consent_disclosure_action_sets_exactly_three_fields
    claim_type: action_endpoint
    grounds:
    - endpoints[POST /donor-candidates/{id}/consent-disclosure]
    - calculations.cooling_off_window
    - state_machines.DonorCandidate.advocacy.ASSIGNED_to_DISCLOSED
    distinguishing_aspect: The action carries an empty body yet writes three derived fields (disclosure_sequence,
      disclosure_at, cooling_off_ends_at) from the logical clock and the program policy, and touches nothing
      else on the row.
    test_recipe:
      setup:
      - Program NLT-01 has cooling_off_days 7; donor D-001 is directed at R-001 and has advocate A-1 ASSIGNED.
      - No evaluation has been determined yet, so both clinical dimensions are PENDING.
      - The logical clock stands at 2026-08-01T00:00:00Z, so the window closes at 2026-08-08T00:00:00Z.
