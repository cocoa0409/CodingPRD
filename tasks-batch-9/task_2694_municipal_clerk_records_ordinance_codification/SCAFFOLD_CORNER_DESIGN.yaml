            - "${e_clerk} == ERR_ROLE_NOT_PERMITTED and ${e_deputy} == ERR_ROLE_NOT_PERMITTED and ${e_editor} == ERR_ROLE_NOT_PERMITTED"
            - "Meeting.${mtg}.status is still IN_SESSION and adjourned_at == null"
            - "Motion.${mo}.status == SECONDED and outcome == PENDING"
