      difficulty_instance: dual_variant_calc / ce_calendar_window_vs_rolling_24m_divergence
      rationale: That instance runs the same four CE records through CALENDAR_WINDOW (13.0 credited hours, compliant true) and ROLLING_24M (10.0 credited hours, 0.0 ethics hours, shortfall 2.0, compliant false), including the exclusive lower bound and the per-category cap.
  - name: retail_attachment_rate_and_commission_rounding
    claim_type: Precision
    grounds:
    - calculations.retail_attachment_rate.formula
    - calculations.retail_attachment_rate.constants.RETAIL_COMMISSION_BP
    excluded_because:
      difficulty_instance: combinatorial_formula / retail_commission_per_line_rounding_then_sum
      rationale: That instance pins round-per-line-then-sum (1102, not the sum-then-round 1103) and §1.8 boundary_precision_check / retail_attach_rate_zero_denominator_and_above_one_hundred pins both the 0.00 empty-window value and the uncapped 200.00 attach rate.

- section: validations
  instances:
  - name: validation_ladder_auth_shape_path_and_body_fk_precede_business_safety
    claim_type: Priority Ordering
    grounds:
    - validations.p1_ERR_UNAUTHENTICATED.check
    - validations.p2_ERR_ROLE_NOT_PERMITTED.check
    - validations.p3_ERR_INVALID_REQUEST.check
    - validations.p4_path_not_found.applies_to
    - validations.p5_body_foreign_keys.applies_to
    - validations.p12_ERR_INTAKE_NOT_CLEARED.priority
    distinguishing_aspect: "Every call in this recipe violates two or more rules at once, so the returned error_id is decided purely by the priority ladder: an implementation that resolves path ids before shape-checking the body, or that runs the intake-safety gate before body foreign-key existence, returns a different error_id for a byte-identical request."
    test_recipe:
      setup: A minimal world with one DRY treatment type, one DRY room, one therapist that holds no licence and no certification, and one guest that has never filed an intake form. No shift blocks exist, so several business rules below priority 12 are also violated by the final probe.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /treatment-types
        payload: { code: "DRY60", name: "Signature Dry Massage", duration_minutes: 60, room_class_required: "DRY", required_skill_code: "SWEDISH", required_scope_level: "BASIC", base_price_cents: 18000, retail_product_line: "BODY", required_consent_version: "2026.1" }
        as: SpaDirector
        captures: { tt_dry: $.data.id }
      - call: POST /treatment-rooms
        payload: { code: "DRY-1", room_class: "DRY", capacity_guests: 1, turnover_buffer_minutes: 15, hourly_fixed_cost_cents: 2500 }
        as: SpaDirector
        captures: { room_dry: $.data.id }
      - call: POST /therapists
        payload: { full_name: "Unlicensed Therapist", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "CA" }
        as: SpaDirector
        captures: { th_bare: $.data.id }
      - call: POST /guests
        payload: { full_name: "No Intake Guest", resort_room_number: "1501", folio_limit_cents: 500000 }
        as: SpaCoordinator
        captures: { g_bare: $.data.id }
      trigger:
      - call: POST /appointments
        payload: { guest_id: "00000000-0000-4000-8000-0000000000ff", treatment_type_id: "${tt_dry}", room_id: "${room_dry}", therapist_id: "${th_bare}", start_at: "2026-08-10 10:00" }
        as: ""
        as_user_id: ""
        captures: { err_no_headers: $.data.error_id }
      - call: GET /reports/room-utilization
        payload: { from_at: "2026-08-20T00:00:00.000Z", to_at: "2026-08-10T00:00:00.000Z" }
        as: ComplianceOfficer
        captures: { err_wrong_role: $.data.error_id }
      - call: POST /intake-forms/00000000-0000-4000-8000-0000000000fe/consent
        payload: {}
        as: SpaCoordinator
        captures: { err_shape_before_path: $.data.error_id }
      - call: POST /appointments
        payload: { guest_id: "00000000-0000-4000-8000-0000000000ff", treatment_type_id: "${tt_dry}", room_id: "${room_dry}", therapist_id: "${th_bare}", start_at: "2026-08-10 10:00" }
        as: SpaCoordinator
        captures: { err_shape_before_fk: $.data.error_id }
      - call: POST /appointments
        payload: { guest_id: "00000000-0000-4000-8000-0000000000ff", treatment_type_id: "${tt_dry}", room_id: "${room_dry}", therapist_id: "${th_bare}", start_at: "2026-08-10T10:00:00.000Z" }
        as: SpaCoordinator
        captures: { err_fk_before_safety: $.data.error_id }
      - call: POST /appointments
        payload: { guest_id: "${g_bare}", treatment_type_id: "${tt_dry}", room_id: "${room_dry}", therapist_id: "${th_bare}", start_at: "2026-08-10T10:00:00.000Z" }
        as: SpaCoordinator
        captures: { err_safety_rung: $.data.error_id }
      assert:
      - "the header-less call returns 401 ERR_UNAUTHENTICATED even though the same request also carries an unresolvable guest_id and a malformed start_at: priority 1 outranks priorities 3 and 5"
      - "the ComplianceOfficer report call returns 403 ERR_ROLE_NOT_PERMITTED and not 422 ERR_INVALID_REPORT_WINDOW, although from_at > to_at: priority 2 outranks priority 32"
      - "the consent call on a non-existent intake form with an empty body returns 422 ERR_INVALID_REQUEST and not 404 ERR_INTAKE_FORM_NOT_FOUND: priority 3 outranks priority 4, so the body shape is judged before the path id is resolved"
      - "the SpaCoordinator booking with a malformed start_at and an unresolvable guest_id returns 422 ERR_INVALID_REQUEST: priority 3 outranks priority 5"
      - "the same booking with a well-formed but unresolvable guest_id returns 404 ERR_GUEST_NOT_FOUND, not 409 ERR_INTAKE_NOT_CLEARED: priority 5 outranks priority 12"
      - "the booking for the real guest returns 409 ERR_INTAKE_NOT_CLEARED, not ERR_LICENSE_NOT_VERIFIED (15), ERR_SCOPE_OF_PRACTICE_VIOLATION (19), ERR_OUTSIDE_SHIFT_WINDOW (23) or ERR_BOOKING_LEAD_TIME — all of which are also violated — because 12 is the lowest violated priority"
      - "no Appointment row is created by any of the six probes and Guest ${g_bare}.version is unchanged"

  - name: intake_clearance_consent_and_contraindication_are_three_distinct_rungs
    claim_type: Cross-entity validation
    grounds:
    - validations.p12_ERR_INTAKE_NOT_CLEARED.check
    - validations.p13_ERR_CONSENT_MISSING.check
    - validations.p14_ERR_CONTRAINDICATION_PRESENT.check
    - entities.Guest.fields.authoritative_intake_form_id
    - entities.Guest.fields.screened_condition_codes
    distinguishing_aspect: "Four guests differ only in how far their intake form travelled: SUBMITTED-but-unscreened fails at 12, SCREENED_CLEAR with no consent row fails at 13, SCREENED_CLEAR with consent version 2025.2 also fails at 13 (the version-equality clause, not the presence clause), and OVERRIDDEN with ACUTE_HYPERTENSION passes 12 and 13 and fails at 14 — a single collapsed 'intake not OK' check cannot produce all four error_ids."
    test_recipe:
      setup: One treatment type contraindicating ACUTE_HYPERTENSION and requiring consent version 2026.1, one DRY room, one therapist, and four guests whose intake forms are advanced to four different points of the intake machine.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /treatment-types
        payload: { code: "DRY60C", name: "Dry Massage With Screening", duration_minutes: 60, room_class_required: "DRY", required_skill_code: "SWEDISH", required_scope_level: "BASIC", base_price_cents: 18000, contraindication_codes: ["ACUTE_HYPERTENSION"], retail_product_line: "BODY", required_consent_version: "2026.1" }
