              payload: { jurisdiction_id: "${j_id}", address: "25 O", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /construction/sites/${s_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: TradeContractor
              captures: { err: $.data.error_id }
          assert:
            - "response status is 403 and err == ERR_FORBIDDEN"

  # =====================================================================
  # Section: cross-cutting layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: derived_posture_recomputed_on_demolish_required
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Site.fields.posture
          - calculations.posture_derivation
        distinguishing_aspect: "Site.posture transitions OPERATING → STOP when a LayerInspection is dispositioned DEMOLISH_REQUIRED; recomputed immediately (consistency_model: immediate)."
        test_recipe:
          setup:
            - "PrintJob PRINTING with one PENDING inspection that fails both bond and dimensional checks."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JJ", name: "J-J", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "P9", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "27 P", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/action"
              payload: { action: "POUR_FOUNDATION" }
              as: SiteManager
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${s_id}/action"
              payload: { action: "CONFIRM_CURE" }
              as: SiteManager
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { s_v: $.data.version }
            - call: "POST /construction/sites/${s_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 3.0, expected_site_version: "${s_v}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "LEVELED" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "QUALIFIED" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/material-batches"
              payload: { mix_code: "LAVACRETE_A", water_cement_ratio: 0.45, target_slump_mm: 100, measured_slump_mm: 100, pump_consistency_kg_per_min: 50 }
              as: PrintOperator
              captures: { batch_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/material-batches/${batch_id}/qualify"
              payload: {}
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/weather-observations"
              payload: { observed_at: "2026-09-04T07:30:00Z", air_temp_c: 22.0, relative_humidity_pct: 50.0, wind_speed_mps: 3.0, precipitation_mm: 0 }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "PAY_FEE", amount_cents: 99999999 }
              as: PermitCoordinator
            - call: "POST /construction/sites/${s_id}/permit-applications/${pa_id}/action"
              payload: { action: "DECIDE", decision: "APPROVE" }
              as: JurisdictionReviewer
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { s_v2: $.data.version }
            - call: "POST /construction/sites/${s_id}/print-jobs"
              payload: { plan_revision_id: "${rev_id}", printer_setup_id: "${ps_id}", scheduled_start_at: "2026-09-04T08:00:00Z", scheduled_end_at: "2026-09-04T16:00:00Z", total_layers_planned: 30, expected_site_version: "${s_v2}" }
              as: PrintOperator
              captures: { job_id: $.data.id }
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "READY_TO_PRINT" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/layer-inspections"
              payload: { layer_index_start: 1, layer_index_end: 5, bond_strength_mpa: 1.0, dimensional_deviation_mm: 10 }
              as: QualityInspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /construction/sites/${s_id}/print-jobs/${job_id}/layer-inspections/${insp_id}/disposition"
              payload: { disposition: "DEMOLISH_REQUIRED" }
              as: QualityInspector
          assert:
            - "Site.${s_id}.posture == STOP"
            - "LayerInspection.${insp_id}.disposition == DEMOLISH_REQUIRED"

      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[printer-setup-stale-site]
          - entities.Site
        distinguishing_aspect: "Site.version increments by 1 on foundation pour, on printer-setup create, and on printer-setup level; reading the site after each step returns the next integer."
        test_recipe:
          setup:
            - "Site created at version 1."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JK2", name: "J-K2", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { j_id: $.data.id }
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${j_id}", address: "29 Q", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { s_id: $.data.id, v1: $.data.version }
            - call: "POST /construction/sites/${s_id}/action"
              payload: { action: "POUR_FOUNDATION" }
              as: SiteManager
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { v2: $.data.version }
            - call: "POST /construction/sites/${s_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 3.0, expected_site_version: "${v2}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /construction/sites/${s_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "LEVELED" }
              as: PrintOperator
            - call: "GET /construction/sites/${s_id}"
              payload: {}
              as: PrintOperator
              captures: { v4: $.data.version }
          assert:
            - "v1 == 1"
            - "v2 == 2 (foundation pour increments Site.version)"
            - "v3 == 3 (printer-setup create increments Site.version)"
            - "v4 == 4 (printer-setup level increments Site.version)"
