              as: PlatformAdmin
              captures: { bravo_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced2}", program_name: "Southgate Casualty XOL 2026", line_of_business: "CASUALTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 900000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_a: $.data.id, prog_a_state0: $.data.placement_status, prog_a_reason0: $.data.withdrawal_reason }
            - call: "POST /programs"
