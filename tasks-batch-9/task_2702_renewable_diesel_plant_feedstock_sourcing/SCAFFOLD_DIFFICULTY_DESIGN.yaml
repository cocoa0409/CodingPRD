# ===========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2702 — Renewable Diesel Plant & Feedstock Sourcing
# Nine §0.5 rule_ids, 22 instances. Every number in an `assert:` line was
# computed by executing the pinned §1.3 formula and its constants.
# Default logical clock on a fresh process: 2026-08-01T00:00:00Z.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: run_yield_provisional_vs_final_on_same_charge
        grounds:
          - calculations.run_yield_split
          - calculations.catalyst_activity_decay
          - entities.ProcessingRun.fields.provisional_yield_pct
          - entities.ProcessingRun.fields.final_yield_pct
          - entities.ProcessingRun.fields.yield_variance_pct
          - state_machines.ProcessingRun.PLANNED_to_HYDROGEN_SECURED
          - state_machines.ProcessingRun.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          Production-yield domain: the PROVISIONAL variant multiplies the feedstock blend yield by
          CatalystCharge.activity_index and discounts the SAF cut by SAF_CONVERSION_PENALTY, while the
          FINAL variant reads neither — it divides operator-measured product mass by CONSUMED mass — so
          on one identical 400.000 MT UCO charge the two variants return 82.000 and 80.000.
        test_recipe:
          setup:
            - "One hydrotreating unit HTU-1 (nameplate 400.0 MT/day, max SAF share 40.00%) with an APPROVED CATALYST_CHANGE window [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) and a fresh ACTIVE catalyst charge (design_throughput_mt 60000.0, activity_index 1.0000) installed inside that window."
            - "One VERIFIED UCO supplier (two valid document types, dd_expires_at 2027-07-27T00:00:00Z) holding one ACCEPTED 500.000 MT UCO lot at CI 32.50 and 900.00 USD/MT."
            - "One PLANNED five-day run [2026-09-01T00:00:00Z, 2026-09-06T00:00:00Z) with target_saf_share_pct 10.00, carrying one RESERVED allocation of 400.000 MT, and one CONFIRMED hydrogen nomination of 2600.0 kg/day covering 2026-09-01 through 2026-09-05."
            - "Clock still at the 2026-08-01T00:00:00Z default when the run is prepared."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-a" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "CHAIN_OF_CUSTODY", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-coc-2702-a" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 500.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
            - call: "POST /feedstock-lots/${lot_id}/acceptances"
              payload: {}
              as: QualityAnalyst
            - call: "POST /hydrogen-contracts"
              payload: { vendor_name: "Praxair Gulf", daily_capacity_kg: 5000.0, price_usd_per_kg: 3.50, window_start: "2026-08-25T00:00:00Z", window_end: "2026-09-30T00:00:00Z", hydrogen_ci_gco2e_per_mj: 90.00 }
              as: FeedstockTrader
              captures: { contract_id: $.data.id }
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-06T00:00:00Z", target_saf_share_pct: 10.00 }
              as: PlantOperator
              captures: { run_id: $.data.id, rv1: $.data.version }
            - call: "POST /processing-runs/${run_id}/allocations"
              payload: { lot_id: "${lot_id}", mass_mt: 400.000, expected_run_version: "${rv1}" }
              as: FeedstockTrader
              captures: { alloc_id: $.data.id }
            - call: "POST /hydrogen-contracts/${contract_id}/nominations"
              payload: { run_id: "${run_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", kg_per_day: 2600.0 }
              as: PlantOperator
              captures: { nom_id: $.data.id }
          trigger:
            - call: "POST /processing-runs/${run_id}/hydrogen-securements"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlantOperator
            - call: "POST /processing-runs/${run_id}/starts"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlantOperator
            - call: "POST /processing-runs/${run_id}/completions"
              payload: { measured_rd_mt: 290.000, measured_saf_mt: 30.000 }
              as: PlantOperator
          assert:
            - "ProcessingRun.${run_id}.provisional_yield_pct == 82.000"
            - "ProcessingRun.${run_id}.planned_total_product_mt == 328.000"
            - "ProcessingRun.${run_id}.planned_saf_mt == 30.832"
            - "ProcessingRun.${run_id}.planned_rd_mt == 297.168"
            - "ProcessingRun.${run_id}.consumed_mass_mt == 400.000"
            - "ProcessingRun.${run_id}.final_yield_pct == 80.000"
            - "ProcessingRun.${run_id}.yield_variance_pct == -2.000"
            - "ProcessingRun.${run_id}.yield_variance_flag == false"
            - "ProcessingRun.${run_id}.status == COMPLETED"
            - "CatalystCharge.${charge_id}.status == ACTIVE"
            - "CatalystCharge.${charge_id}.cumulative_throughput_mt == 400.000"
            - "CatalystCharge.${charge_id}.activity_index == 0.9950"
            - "ProcessingRun.${run_id}.planned_rd_mt != ProcessingRun.${run_id}.measured_rd_mt"

      - name: lcfs_credit_provisional_vs_verified_at_identical_ci
        grounds:
          - calculations.lcfs_credit_quantity
          - entities.CreditBlock.fields.provisional_credits_mtco2e
          - entities.CreditBlock.fields.verified_credits_mtco2e
          - state_machines.CreditBlock.SUBMITTED_FOR_VERIFICATION_to_VERIFIED
        distinguishing_aspect: |
          Credit-accounting domain (not production yield): the PROVISIONAL and VERIFIED variants of
          lcfs_credit_quantity are fed the identical carbon intensity 41.25 and the identical 89320.0 gal
          batch, yet return 547.171 and 536.228 MTCO2e because only the VERIFIED variant applies
          VERIFICATION_DISCOUNT — a 2.00% divergence that stays inside VERIFICATION_VARIANCE_TOLERANCE
          and therefore lands the block in VERIFIED rather than ADJUSTED.
        test_recipe:
          setup:
            - "The completed run of instance run_yield_provisional_vs_final_on_same_charge (blend_ci_gco2e_per_mj 32.50, measured_rd_mt 290.000), reconciled by the compliance desk."
            - "The produced RENEWABLE_DIESEL batch (89320.0 gal) reserved to an offtaker and SHIPPED."
            - "A REGISTERED LCFS pathway on HTU-1 for feedstock_type UCO with certified_ci_gco2e_per_mj 41.25, registered by user officer-a."
            - "One DRAFT credit block minted from that batch and pathway, internally signed off by officer-b (segregation of duties) and submitted for verification."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-b" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "CHAIN_OF_CUSTODY", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-coc-2702-b" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 500.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
            - call: "POST /feedstock-lots/${lot_id}/acceptances"
              payload: {}
              as: QualityAnalyst
            - call: "POST /hydrogen-contracts"
              payload: { vendor_name: "Praxair Gulf", daily_capacity_kg: 5000.0, price_usd_per_kg: 3.50, window_start: "2026-08-25T00:00:00Z", window_end: "2026-09-30T00:00:00Z", hydrogen_ci_gco2e_per_mj: 90.00 }
              as: FeedstockTrader
              captures: { contract_id: $.data.id }
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-06T00:00:00Z", target_saf_share_pct: 10.00 }
              as: PlantOperator
              captures: { run_id: $.data.id, rv1: $.data.version }
            - call: "POST /processing-runs/${run_id}/allocations"
