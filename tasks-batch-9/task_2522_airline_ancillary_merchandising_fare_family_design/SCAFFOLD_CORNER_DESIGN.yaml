          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_BOOKING_STATE_INVALID\""
            - "GET /bookings/${bk_id} shows booking_status == \"CANCELLED\" and version == 2 (unchanged by the refused second cancel)"
            - "GET /bookings/${bk_id}/revenue-entries returns total_count == 0"

      - name: status_change_from_draft_to_suspended_returns_family_state_invalid
