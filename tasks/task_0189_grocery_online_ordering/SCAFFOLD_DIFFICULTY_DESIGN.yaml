          - entities.FulfillmentSlot.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Order -> FulfillmentSlot: an Order placement is admitted only when the referenced slot's
          status is OPEN. After the slot is CLOSED, placement is rejected ERR_SLOT_CLOSED. The Order's valid
          creation depends on a different entity's (FulfillmentSlot) state.
        test_recipe:
          setup:
            - "Store, Customer, slot cap 5, UNIT product A(349). Slot then CLOSED by StoreOps (slot.version 1 -> 2)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
