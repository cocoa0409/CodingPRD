        distinguishing_aspect: "The single in-scope criterion is tagged VISION and HEARING but the only completed run validated VISION alone, so publication of an APPROVED report is refused with ERR_DISABILITY_COVERAGE_GAP 422 even though design review passed and coverage reached 45.00."
        test_recipe:
          setup:
            - "One criterion 1.2.2 at level A tagged VISION and HEARING, in scope for a target_level AA product"
            - "One in-scope component of applicable_criteria_count 40 with design_review_state REVIEWED_PASS"
            - "One COMPLETED MANUAL SCREEN_READER run of 40 criteria validating VISION only, so coverage_pct is 45.00"
