          setup: ["CONSERVATORSHIP case ACTIVE, account funded 5,000,000, APPROVED budget admin cap 2,000,000"]
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Adm", date_of_birth: "1948-01-01", annual_income_cents: 0, liquid_estate_cents: 8000000 }
              as: CourtClerk
              captures: { pid: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "F", fiduciary_kind: "PROFESSIONAL" }
              as: CourtClerk
              captures: { fid: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${pid}", case_type: "CONSERVATORSHIP" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${cid}", nominated_fiduciary_id: "${fid}", requested_authority: "ESTATE", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet: $.data.id }
            - call: "POST /gc/petitions/${pet}/find-probable-cause"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${pet}/order-evaluation"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet}", finding: "INCAPACITATED", recommended_scope: "ESTATE" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { ev: $.data.id }
            - call: "POST /gc/evaluations/${ev}/file"
              payload: {}
              as: CourtExaminer
              as_user_id: "exam-1"
            - call: "POST /gc/petitions/${pet}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments"
              payload: { case_id: "${cid}", fiduciary_id: "${fid}" }
              as: Judge
              as_user_id: "judge-1"
              captures: { apt: $.data.id }
            - call: "GET /gc/bonds?appointment_id=${apt}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { bd: "$.data[0].id" }
            - call: "POST /gc/bonds/${bd}/post"
              payload: { posted_amount_cents: 10000000, surety_name: "Acme" }
              as: Fiduciary
              as_user_id: "${fid}"
            - call: "POST /gc/bonds/${bd}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/appointments/${apt}/qualify"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/restricted-accounts"
              payload: { case_id: "${cid}", institution_name: "First Trust" }
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { acc: $.data.id }
            - call: "POST /gc/inventories"
              payload: { case_id: "${cid}", real_property_cents: 0, liquid_assets_cents: 5000000, tangible_property_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { inv: $.data.id }
            - call: "POST /gc/inventories/${inv}/file"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid}"
            - call: "POST /gc/inventories/${inv}/approve"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/budgets"
              payload: { case_id: "${cid}", period_year: 2026, care_cap_cents: 0, medical_cap_cents: 0, admin_cap_cents: 2000000 }
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { bud: $.data.id }
            - call: "POST /gc/budgets/${bud}/submit"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid}"
            - call: "GET /gc/cases/${cid}"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
              captures: { cv1: $.data.version }
            - call: "POST /gc/budgets/${bud}/approve"
              payload: { expected_case_version: "${cv1}" }
              as: Judge
              as_user_id: "judge-1"
            - call: "GET /gc/cases/${cid}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /gc/expenditures"
              payload: { case_id: "${cid}", budget_id: "${bud}", category: "ADMIN", amount_cents: 100000, payee_name: "SmallFee", expected_case_version: "${cv2}" }
              as: Fiduciary
              as_user_id: "${fid}"
              captures: { exp: $.data.id, court: $.data.requires_court_approval, st: $.data.status }
          assert:
            - "Expenditure.${exp}.requires_court_approval == true"
            - "Expenditure.${exp}.status == PENDING_COURT"

