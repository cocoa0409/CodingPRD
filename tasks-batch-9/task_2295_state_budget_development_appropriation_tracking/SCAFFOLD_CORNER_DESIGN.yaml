          assert:
            - "the stale create returns HTTP 412 with error_id == ERR_STALE_VERSION"
            - "${req_v_fresh} is greater than ${req_v_stale}"
            - "the retry returns HTTP 201 with ExecutiveRecommendation.${rec_id}.status == PREPARED and recommended_amount_cents == 1300000000"
            - "ExecutiveRecommendation.${rec_id}.prepared_by_user_id == analyst-1 and approved_by_user_id == null"
            - "the list returns total_count == 1, so the rejected create persisted nothing"

