  # ===========================================================================
  # Rule 3 — Non-linear state-machine shapes on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rate_case_deficiency_cure_cycle
        grounds:
          - state_machines.RateCase.FILED_to_DEFICIENT
          - state_machines.RateCase.DEFICIENT_to_FILED
          - state_machines.RateCase.FILED_to_ACCEPTED
        distinguishing_aspect: |
          Entity = RateCase. The machine is cyclic: FILED -> DEFICIENT ->
          FILED -> ACCEPTED revisits FILED (a cure loop), so state alone does
          not encode progress — the second FILED visit must be reachable only
          after a DEFICIENT marker and must re-run the full submit-filing
          guard chain (entries locked, no open adjustments, RR match).
        test_recipe:
          setup:
            - "Canonical filed case (all entries LOCKED, A1 accepted at filing, RB1 SUBMITTED)"
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1897500000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "901", category: "DEPRECIATION", booked_amount_cents: 400000000 }, as: UtilityFiler, captures: { e2: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "902", category: "TAXES", booked_amount_cents: 200000000 }, as: UtilityFiler, captures: { e3: $.data.id } }
            - { call: "POST /api/v1/adjustments", payload: { rate_case_id: "${rc}", test_year_entry_id: "${e1}", amount_cents: 50000000, reason: "Annualize pension cost" }, as: UtilityFiler, as_user_id: "uf_alice", captures: { a1: $.data.id } }
            - { call: "POST /api/v1/adjustments/${a1}/verify", payload: {}, as: UtilityFiler, as_user_id: "uf_bob" }
            - { call: "POST /api/v1/test-year-entries/${e1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e1}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e2}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/test-year-entries/${e3}/lock", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-base-items", payload: { rate_case_id: "${rc}", label: "Generation plant", plant_in_service_cents: 3000000000, accumulated_depreciation_cents: 500000000, working_capital_cents: 100000000, accumulated_deferred_taxes_cents: 200000000 }, as: UtilityFiler, captures: { rb1: $.data.id } }
            - { call: "POST /api/v1/rate-base-items/${rb1}/submit", payload: {}, as: UtilityFiler }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler }
          trigger:
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "DEFICIENT", deficiency_notes: "Cost of service study incomplete" }, as: CommissionStaff, captures: { st1: $.data.status } }
            - { call: "POST /api/v1/rate-cases/${rc}/submit-filing", payload: {}, as: UtilityFiler, captures: { st2: $.data.status } }
            - { call: "POST /api/v1/rate-cases/${rc}/deficiency-review", payload: { outcome: "ACCEPTED" }, as: CommissionStaff, captures: { st3: $.data.status } }
          assert:
            - "${st1} == DEFICIENT (cycle edge FILED -> DEFICIENT taken)"
            - "${st2} == FILED (DEFICIENT -> FILED re-submission re-ran all filing guards and succeeded)"
            - "${st3} == ACCEPTED (second review concludes the loop)"
            - "Adjustment.${a1}.status == ACCEPTED throughout (the filing cascade is idempotent on already-ACCEPTED rows and is not re-applied destructively)"

      - name: settlement_proposal_assent_rescind_cycle
        grounds:
          - state_machines.SettlementProposal.UNDER_NEGOTIATION_to_ASSENTED
          - state_machines.SettlementProposal.ASSENTED_to_UNDER_NEGOTIATION
          - state_machines.SettlementSignatory.SIGNED_to_RESCINDED
        distinguishing_aspect: |
          Entity = SettlementProposal (different from RateCase). Cyclic edge
          ASSENTED -> UNDER_NEGOTIATION fires from a CHILD event (signatory
          rescind), not from a proposal-level endpoint: unanimity is a derived
          aggregate of child signatory states, and losing it mid-cycle drops
          the parent back while RateCase.assented_proposal_count is
          decremented in lockstep (1 -> 0).
        test_recipe:
          setup:
            - "Canonical case in SETTLEMENT with intervenors I1/I2; proposal SP1 circulated and fully signed (ASSENTED, assented_proposal_count == 1)"
