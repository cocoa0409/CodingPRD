        claim_type: error_triggerability
        grounds: [validations.priority_25_business_referential, errors]
        distinguishing_aspect: "A dangling reference inside the request body is reported against the missing family, not against the endpoint's own resource, so a bad link_id on an observation create yields ERR_MATCH_NOT_FOUND and a bad signage_store_id on an order create yields ERR_STORE_NOT_FOUND."
        test_recipe:
