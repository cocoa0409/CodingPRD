          - errors[ERR_BUDGET_EXCEEDED]
          - state_machines.SponsorGrant.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Cancelling a grant whose funds are partly committed (budget_available_cents < amount_cents after a completed shift) returns ERR_BUDGET_EXCEEDED (402)."
        test_recipe:
          setup: ["A fridge with a 1000-cent grant; a completed COVERAGE shift committed 1500 cents (available now negative), so the grant cannot be withdrawn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fridges"
