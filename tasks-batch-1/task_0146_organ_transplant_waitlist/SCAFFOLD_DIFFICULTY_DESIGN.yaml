          setup:
            - "Organ recovered 2026-06-01T00:00:00Z with max_cold_ischemia_hours=0.5; an offer issued at 2026-06-01T00:10:00Z (window_end 01:10 but ischemia_end 00:30, so deadline=00:30)."
