  - rule_id: transitive_cascade
    instances:
      - name: supplier_disqualification_three_hop_to_model_restriction
        grounds:
          - state_machines.Supplier.QUALIFIED_to_DISQUALIFIED
          - state_machines.ComponentLot.RELEASED_to_BLOCKED
          - state_machines.HeaterUnit.ASSEMBLED_to_HELD
          - state_machines.HeaterUnit.LABELED_to_HELD
          - state_machines.ProductModel.RELEASED_to_RESTRICTED
          - entities.ProductModel.fields.held_unit_count
          - endpoints[POST /mfg/suppliers/{id}/disqualify]
        distinguishing_aspect: >
          Depth-4 chain from ONE call: Supplier -> ComponentLot -> HeaterUnit -> ProductModel. The trigger is
          a supplier-quality action, and hop 3 is a commercial release restriction on a model the caller never
          named - reachable only by transitively following blocked lots to the units that consumed them and
          then to their model. Two negative controls pin the boundary: the SHIPPED unit is NOT held (its
          build_status is outside the hop-2 set) and the second supplier's TP lot stays RELEASED, so an
          implementation that blocks or holds indiscriminately is caught.
