  - name: wrap_dispute_amend_cycle_then_certified_to_void_compensation
    grounds:
    - '§1.2 WeeklyWrap: SUBMITTED -> DISPUTED -> AMENDED -> SUBMITTED (cycle)'
    - '§1.2 WeeklyWrap: CERTIFIED -> VOID (compensating exit)'
    - §1.1 WeeklyWrap.amendment_count, .status
    - §1.1 Production.recouped_amount_cents
