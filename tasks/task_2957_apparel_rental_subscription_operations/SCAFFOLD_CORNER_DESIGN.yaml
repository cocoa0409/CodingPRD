          assert:
            - "HTTP 200"
            - "ResaleListing.state == LISTED"
            - "ResaleListing.markdown_step == 1"
            - "ResaleListing.base_price_cents == 3264"
            - "ResaleListing.list_price_cents == 3412"
            - "ResaleListing.channel_fee_cents == 512"
            - "ResaleListing.net_recovery_cents == 2000"
