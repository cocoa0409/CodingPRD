  - rule_id: resource_temporal_overlap
    instances:
      - name: advocate_hearing_buffer_rejects_touching_windows
        grounds:
          - validations[priority=78]
          - errors.ERR_ADVOCATE_DOUBLE_BOOKED
          - state_machines.ProtectiveOrderCase.PETITION_DRAFTED_to_FILED
          - entities.ProtectiveOrderCase.fields.accompanying_advocate_id
          - endpoints[POST /protective-order-cases/{id}/file]
        distinguishing_aspect: |
          Interval semantics A - instant-valued hearing windows on the StaffMember resource, each expanded by
          TRAVEL_BUFFER_MINUTES 60 on both sides, where touching endpoints DO conflict: a 12:00-13:00Z hearing
          (buffered 11:00-14:00) is rejected against an existing 09:00-10:00Z hearing (buffered 08:00-11:00)
          because the buffers meet exactly at 11:00, while shifting the new hearing by one minute clears it.
        test_recipe:
          setup:
            - "One LegalAdvocate (Iris Vale) exists with wellness_posture OPEN."
            - "Client C-9501 (Priya Nair) exists with two ProtectiveOrderCase rows."
            - "Case R1 is FILED for a hearing on 2026-08-20T09:00:00Z to 2026-08-20T10:00:00Z with Iris Vale accompanying, so her buffered occupation is 08:00Z to 11:00Z."
            - "Case R2 is still PETITION_DRAFTED."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z, so every hearing time below is in the future."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Iris Vale", role_type: "LEGAL_ADVOCATE", max_caseload: 12 }
              as: AgencyAdmin
              captures: { legal_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-9501", legal_name: "Priya Nair", household_size: 1, minor_children_count: 0, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: AgencyAdmin
              captures: { client_id: "$.data.id" }
            - call: "POST /protective-order-cases"
              payload: { client_id: "${client_id}", order_type: "EMERGENCY_EX_PARTE" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { poc_1: "$.data.id" }
            - call: "POST /protective-order-cases/${poc_1}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-08-20T09:00:00Z", hearing_end_utc: "2026-08-20T10:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /protective-order-cases"
              payload: { client_id: "${client_id}", order_type: "FULL_ORDER" }
