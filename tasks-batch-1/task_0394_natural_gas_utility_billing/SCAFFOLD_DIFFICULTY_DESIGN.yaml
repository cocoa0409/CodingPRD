# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0394
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances. All literals pre-computed.
# Canonical RES setup (reused across instances), all literals:
#   clock 2026-02-15 (no heating season) | RES-1 (fixed 1200, dist 15, btu 1.025,
#   min_bill 0) | PGA RES 2026-02 (commodity 40, refund 5 -> eff 35)
#   meter M-001 CCF install_index 1000, set via METER_SET order, read 1100 ->
#   ccf 100 -> therms 102.5 -> actual bill: commodity 3588, dist 1538, fixed 1200,
#   amount_due 6326.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bill_actual_cost_vs_levelized_budget_billed
        grounds:
          - calculations.bill_charges
          - entities.Bill.fields.amount_due_cents
          - entities.Bill.fields.budget_billed_cents
          - state_machines.Bill.DRAFT_to_ISSUED
        distinguishing_aspect: |
          On the SAME bill, the actual_cost variant sets budget_billed_cents == amount_due_cents (6326),
          while the levelized_budget variant (account budget-enrolled, installment 8000) sets
          budget_billed_cents == 8000 != amount_due_cents == 6326 — divergence is on the Bill entity domain.
        test_recipe:
          setup:
            - "RES-1 schedule, PGA RES 2026-02, account A with SET meter M-001 reading 100 CCF -> 102.5 therms."
            - "An identical second account B enrolled in a budget plan (installment 8000) before its bill is issued."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            # --- account A (actual cost) ---
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A" }
              as: CustomerService
              captures: { acctA_id: $.data.id }
            - call: "POST /accounts/${acctA_id}/meters"
              payload: { serial_no: "MA-001", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { mA_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acctA_id}", order_type: "METER_SET", premise_meter_id: "${mA_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { soA_id: $.data.id }
            - call: "POST /service-orders/${soA_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${soA_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${mA_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rdA_id: $.data.id }
            - call: "POST /accounts/${acctA_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rdA_id}" }
              as: BillingAdmin
              captures: { billA_id: $.data.id }
            - call: "GET /accounts/${acctA_id}"
              payload: {}
              as: BillingAdmin
              captures: { acctA_v: $.data.version }
            # --- account B (budget enrolled) ---
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "B" }
              as: CustomerService
              captures: { acctB_id: $.data.id }
            - call: "POST /accounts/${acctB_id}/meters"
              payload: { serial_no: "MB-001", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { mB_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acctB_id}", order_type: "METER_SET", premise_meter_id: "${mB_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { soB_id: $.data.id }
            - call: "POST /service-orders/${soB_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${soB_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${mB_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rdB_id: $.data.id }
            - call: "GET /accounts/${acctB_id}"
              payload: {}
              as: BillingAdmin
              captures: { acctB_v0: $.data.version }
            - call: "POST /accounts/${acctB_id}/budget-plans"
              payload: { anchor_month: "2026-02", projected_annual_cents: 96000, expected_account_version: "${acctB_v0}" }
              as: BillingAdmin
            - call: "POST /accounts/${acctB_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rdB_id}" }
              as: BillingAdmin
              captures: { billB_id: $.data.id }
            - call: "GET /accounts/${acctB_id}"
              payload: {}
              as: BillingAdmin
              captures: { acctB_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acctA_id}/bills/${billA_id}/issue"
              payload: { expected_account_version: "${acctA_v}" }
              as: BillingAdmin
            - call: "POST /accounts/${acctB_id}/bills/${billB_id}/issue"
              payload: { expected_account_version: "${acctB_v}" }
              as: BillingAdmin
          assert:
            - "Bill.${billA_id}.amount_due_cents == 6326"
            - "Bill.${billA_id}.budget_billed_cents == 6326"
            - "Bill.${billB_id}.amount_due_cents == 6326"
            - "Bill.${billB_id}.budget_billed_cents == 8000"

      - name: budget_trueup_residual_sign_underpaid_vs_overpaid
        grounds:
          - calculations.budget_trueup
          - state_machines.BudgetPlan.ACTIVE_to_TRUED_UP
          - entities.BudgetPlan.fields.trueup_balance_cents
        distinguishing_aspect: |
          On the BudgetPlan entity domain, the true-up of a plan whose accrued_actual (6326) is below
          accrued_budget (8000) yields trueup_balance_cents == -1674 (overpaid credit), a different
          numeric SIGN/result than an actual-above-budget plan would yield (>0). Computed on BudgetPlan, not Bill.
        test_recipe:
          setup:
            - "Account B budget-enrolled (installment 8000), one bill issued under the plan: actual 6326, budget_billed 8000."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-1", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "B" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MB-201", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/budget-plans"
              payload: { anchor_month: "2026-02", projected_annual_cents: 96000, expected_account_version: "${acct_v0}" }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v}" }
              as: BillingAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/budget-plans/${plan_id}/true-up"
              payload: {}
              as: BillingAdmin
          assert:
            - "BudgetPlan.${plan_id}.status == TRUED_UP"
            - "BudgetPlan.${plan_id}.accrued_actual_cents == 6326"
            - "BudgetPlan.${plan_id}.accrued_budget_cents == 8000"
            - "BudgetPlan.${plan_id}.trueup_balance_cents == -1674"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bill_charges_nonlinear_min_floor_and_credit_branch
        grounds:
          - calculations.bill_charges
          - calculations.low_income_credit
          - entities.RateSchedule.fields.minimum_bill_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs (therms 102.5, eff_pga 35, dist 15, fixed 1200, minimum_bill, low-income credit)
          with non-linear interaction — a max() minimum-bill floor AND a max(0, gross - credit) credit floor
          and a branch on low_income_status. Here minimum_bill_cents=8000 raises gross 6326 to 8000.
        test_recipe:
          setup:
            - "RES schedule RES-MIN with minimum_bill_cents 8000; account, SET meter, read 100 CCF -> 102.5 therms; NOT low-income."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-MIN", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 8000 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "MIN" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MM-301", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v}" }
              as: BillingAdmin
          assert:
            - "Bill.${bill_id}.commodity_charge_cents == 3588"
            - "Bill.${bill_id}.distribution_charge_cents == 1538"
            - "Bill.${bill_id}.fixed_charge_cents == 1200"
            - "Bill.${bill_id}.low_income_credit_cents == 0"
            - "Bill.${bill_id}.amount_due_cents == 8000"

      - name: low_income_credit_round_then_cap_order
        grounds:
          - calculations.low_income_credit
          - calculations.low_income_eligibility
          - state_machines.LowIncomeCredit.SUBMITTED_to_APPROVED
          - entities.Bill.fields.low_income_credit_cents
        distinguishing_aspect: |
          MODE (b): nested rounding ORDER is pinned — credit = min(round_half_up(creditable * pct), cap).
          With creditable 5126 and TIER_1 pct 0.20: round_half_up(1025.2)=1025, then min(1025, 4000)=1025.
          Rounding occurs BEFORE the cap; reversing (cap-then-round) is a different code path.
        test_recipe:
          setup:
            - "RES account, SET meter read 100 CCF -> 102.5 therms (commodity 3588 + dist 1538 = creditable 5126), APPROVED TIER_1 low-income credit (income 1,400,000c / household 1)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-LI", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 1200, distribution_rate_cents_per_therm: 15, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-02", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 40, supplier_refund_cents_per_therm: 5 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "LI" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/low-income-credits"
              payload: { household_size: 1, annual_income_cents: 1400000 }
              as: CustomerService
              captures: { cred_id: $.data.id }
            - call: "POST /accounts/${acct_id}/low-income-credits/${cred_id}/approve"
              payload: {}
              as: CustomerService
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "ML-401", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-02-01T00:00:00.000Z" }
              as: FieldTech
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${so_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-28T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v}" }
              as: BillingAdmin
          assert:
            - "Bill.${bill_id}.low_income_credit_cents == 1025"
            - "Bill.${bill_id}.amount_due_cents == 5301"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_shutoff_reconnect_cycle
        grounds:
          - state_machines.Account.ACTIVE_to_SHUTOFF_PENDING
          - state_machines.Account.SHUTOFF_PENDING_to_DISCONNECTED
          - state_machines.Account.DISCONNECTED_to_ACTIVE
        distinguishing_aspect: |
          Account.service_status forms a CYCLE ACTIVE -> SHUTOFF_PENDING -> DISCONNECTED -> ACTIVE:
          after the full loop the account is ACTIVE again (not a one-way pipeline). This cycle is on
          the Account entity.
        test_recipe:
          setup:
            - "RES account past_due 7500 (one ISSUED bill past due-date), no emergency, no moratorium; shutoff order completed -> DISCONNECTED; balance cleared and reconnect deposit WAIVED; reconnect order completed."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-CY", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 7500, distribution_rate_cents_per_therm: 0, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-01", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 0, supplier_refund_cents_per_therm: 0 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "CY" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MC-501", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "METER_SET", premise_meter_id: "${m_id}", scheduled_date: "2026-01-01T00:00:00.000Z" }
              as: FieldTech
              captures: { mset_id: $.data.id }
            - call: "POST /service-orders/${mset_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${mset_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1000, read_date: "2026-01-31T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { rd_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-01", to_read_id: "${rd_id}" }
              as: BillingAdmin
              captures: { bill_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v1: $.data.version }
            - call: "POST /accounts/${acct_id}/bills/${bill_id}/issue"
              payload: { expected_account_version: "${acct_v1}" }
              as: BillingAdmin
            # advance clock beyond the 21-day due window so the bill is past due
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /accounts/${acct_id}/shutoff-notice"
              payload: {}
              as: CustomerService
            - call: "GET /service-orders"
              payload: { account_id: "${acct_id}" }
              as: FieldTech
              captures: { shut_id: "$.data[1].id" }
            - call: "POST /service-orders/${shut_id}/dispatch"
              payload: {}
              as: FieldTech
            - call: "POST /service-orders/${shut_id}/complete"
              payload: { completed_index: 1000 }
              as: FieldTech
            # clear balance: pay off the bill, then prepare reconnect (deposit WAIVED)
            - call: "POST /accounts/${acct_id}/payments"
              payload: { bill_id: "${bill_id}", amount_cents: 7500, posted_date: "2026-04-02T00:00:00.000Z" }
              as: CustomerService
            - call: "POST /accounts/${acct_id}/deposits"
              payload: { reason: "RECONNECT" }
              as: CustomerService
              captures: { dep_id: $.data.id }
            - call: "POST /accounts/${acct_id}/deposits/${dep_id}/collect"
              payload: {}
              as: CustomerService
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "RECONNECT", premise_meter_id: "${m_id}", scheduled_date: "2026-04-03T00:00:00.000Z" }
              as: FieldTech
              captures: { rec_id: $.data.id }
            - call: "POST /service-orders/${rec_id}/dispatch"
              payload: {}
              as: FieldTech
          trigger:
            - call: "POST /service-orders/${rec_id}/complete"
              payload: {}
              as: FieldTech
          assert:
            - "Account.${acct_id}.service_status == ACTIVE"
            - "PremiseMeter.${m_id}.status == SET"

      - name: meter_set_locked_set_cycle
        grounds:
          - state_machines.PremiseMeter.SET_to_LOCKED
          - state_machines.PremiseMeter.LOCKED_to_SET
        distinguishing_aspect: |
          PremiseMeter.status forms a CYCLE SET -> LOCKED -> SET driven by SHUTOFF then RECONNECT
          completions — a non-linear loop on the PremiseMeter entity, distinct from the Account cycle.
        test_recipe:
          setup:
            - "Same account/meter as the shutoff/reconnect flow; meter goes SET -> LOCKED (shutoff complete) -> SET (reconnect complete)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RES-CY2", customer_class: "RESIDENTIAL", fixed_customer_charge_cents: 7500, distribution_rate_cents_per_therm: 0, btu_factor: 1.025, minimum_bill_cents: 0 }
              as: BillingAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /pga-schedules"
              payload: { effective_month: "2026-01", customer_class: "RESIDENTIAL", commodity_rate_cents_per_therm: 0, supplier_refund_cents_per_therm: 0 }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "CY2" }
              as: CustomerService
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { serial_no: "MC-601", uom: "CCF", install_index: 1000 }
              as: FieldTech
              captures: { m_id: $.data.id }
