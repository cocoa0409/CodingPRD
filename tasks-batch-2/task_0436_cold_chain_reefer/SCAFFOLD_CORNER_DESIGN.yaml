            - call: "GET /shipments/${sid}"
              as: Carrier
              as_user_id: "carrier-c27"
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /shipments/${sid}/accept"
              payload: { reefer_unit_id: "${uid}", expected_shipment_version: "${sv}" }
