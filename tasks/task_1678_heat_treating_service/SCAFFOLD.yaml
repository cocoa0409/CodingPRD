# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/customer-accounts"
    description: "Create a customer account"
    roles: [CustomerServiceRep]
    code: 201
    input: [name, "liability_tier?", "credit_hold?"]
    output: CustomerAccount
    side_effects: ["liability_tier defaults STANDARD; credit_hold defaults false; outstanding_liability_exposure_cents = 0"]

  - method: GET
    path: "/customer-accounts/{customerId}"
    description: "Get a customer account"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  - method: POST
    path: "/furnace-recipes"
    description: "Create a furnace recipe (DRAFT)"
    roles: [QualityEngineer]
    code: 201
    input: [alloy_code, spec_code, soak_temp_f, soak_tolerance_f, min_soak_minutes, quench_media, required_furnace_class, max_retreats, fixture_distortion_allowance_in, hardness_min_hrc, hardness_max_hrc]
    output: FurnaceRecipe
    side_effects: ["status = DRAFT; (alloy_code, spec_code) uniqueness enforced (ERR_DUPLICATE_RECIPE)"]

  - method: GET
    path: "/furnace-recipes/{recipeId}"
    description: "Get a furnace recipe"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: FurnaceRecipe
    side_effects: []

  - method: POST
    path: "/furnace-recipes/{recipeId}/approve"
    description: "Approve a DRAFT recipe"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: FurnaceRecipe
    side_effects: ["status DRAFT -> APPROVED"]

  - method: POST
    path: "/furnaces"
    description: "Register a furnace"
    roles: [ShopScheduler]
    code: 201
    input: [furnace_code, furnace_class, max_load_weight_lb, quench_media_supported]
    output: Furnace
    side_effects: ["qualification_status = UNQUALIFIED (no pyrometry records)"]

  - method: GET
    path: "/furnaces/{furnaceId}"
    description: "Get a furnace (posture recomputed against the logical clock)"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: Furnace
    side_effects: ["recomputes qualification_status per furnace_qualification_posture"]

  - method: POST
    path: "/pyrometry-records"
    description: "Record a TUS or instrument calibration"
    roles: [CalibrationTech]
    code: 201
    input: [furnace_id, record_type, performed_at, result, "instrument_id?"]
    output: PyrometryRecord
    side_effects: ["next_due_at computed per pyrometry_next_due", "furnace posture recomputed; BUILDING loads -> HOLD when leaving QUALIFIED; HOLD loads -> BUILDING when returning to QUALIFIED"]

  - method: GET
    path: "/pyrometry-records"
    description: "List pyrometry records (filterable by furnace)"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["furnace_id?", "record_type?", "limit?", "offset?"]
    output: "PyrometryRecord[]"
    side_effects: []

  - method: GET
    path: "/pyrometry-records/{recordId}"
    description: "Get a pyrometry record"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: PyrometryRecord
    side_effects: []

  - method: POST
    path: "/work-orders"
    description: "Receive a customer material lot"
    roles: [CustomerServiceRep]
    code: 201
    input: [customer_id, recipe_id, part_quantity, received_weight_lb, declared_value_cents, processing_charge_cents, "service_lane?", "guaranteed_turnaround_hours?"]
    output: WorkOrder
    side_effects: ["received_at = logical clock", "promised_due_at computed for RUSH", "rush_surcharge_quoted_cents computed per rush_surcharge_quote", "processing_status = RECEIVED, quality_status = PENDING_TEST"]

  - method: GET
    path: "/work-orders"
    description: "List work orders (filterable; paginated)"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["customer_id?", "recipe_id?", "processing_status?", "service_lane?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{workOrderId}"
    description: "Get a work order"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{workOrderId}/ship"
    description: "Ship a processed, quality-cleared lot"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["processing_status PROCESSED -> SHIPPED", "shipped_at = logical clock", "turnaround_breached and rush_surcharge_final_cents computed"]

  - method: POST
    path: "/work-orders/{workOrderId}/cancel"
    description: "Cancel a RECEIVED or SCHEDULED work order"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["processing_status -> CANCELLED", "SCHEDULED: ACTIVE assignment -> REMOVED, load weight recompute, LoadBatch.version += 1"]

  - method: POST
    path: "/inspection-tests"
    description: "Record a hardness + distortion inspection"
    roles: [QualityEngineer]
    code: 201
    input: [work_order_id, hardness_readings, measured_distortion_in]
    output: InspectionTest
    side_effects: ["avg_hardness_hrc and result computed", "PASS: quality PENDING_TEST -> PASSED", "FAIL: quality PENDING_TEST -> FAILED and DispositionCase OPEN created", "precondition: processing_status == PROCESSED and quality_status == PENDING_TEST (ERR_WORK_ORDER_NOT_TESTABLE)"]

  - method: GET
    path: "/inspection-tests"
    description: "List inspection tests"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["work_order_id?", "result?", "limit?", "offset?"]
    output: "InspectionTest[]"
    side_effects: []

  - method: GET
    path: "/inspection-tests/{testId}"
    description: "Get an inspection test"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: InspectionTest
    side_effects: []

  - method: GET
    path: "/disposition-cases"
    description: "List disposition cases"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["work_order_id?", "inspection_test_id?", "status?", "limit?", "offset?"]
    output: "DispositionCase[]"
    side_effects: []

  - method: GET
    path: "/disposition-cases/{caseId}"
    description: "Get a disposition case"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: DispositionCase
    side_effects: []

  - method: POST
    path: "/disposition-cases/{caseId}/decide"
    description: "Decide a failed lot's disposition (segregated from the test recorder)"
    roles: [QualityEngineer]
    code: 200
    input: [decision]
    output: DispositionCase
    side_effects: ["status OPEN -> DECIDED", "per-decision cascades per state machine (RE_TREAT / SCRAP / RETURN_AS_IS)"]

  - method: GET
    path: "/liability-claims"
    description: "List liability claims"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["customer_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: "LiabilityClaim[]"
    side_effects: []

  - method: GET
    path: "/liability-claims/{claimId}"
    description: "Get a liability claim"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: []

  - method: POST
    path: "/liability-claims/{claimId}/accept"
    description: "Customer accepts the payout offer"
    roles: [Customer]
    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["status PENDING -> ACCEPTED"]

  - method: POST
    path: "/liability-claims/{claimId}/reject"
