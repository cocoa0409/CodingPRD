      - name: sod_approve_own_je_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The same X-User-ID that prepared a JE cannot approve it (segregation of duties) — ERR_SOD_VIOLATION even when all other gates pass."
