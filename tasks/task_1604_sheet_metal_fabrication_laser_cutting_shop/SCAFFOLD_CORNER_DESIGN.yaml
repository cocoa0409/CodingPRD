        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-Role fails priority-1 auth before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fab/customers"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "http 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]"]
        distinguishing_aspect: "A submit against a non-existent quote id returns 404 ERR_NOT_FOUND, never a state error — existence (3) precedes state (4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fab/quotes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit"
