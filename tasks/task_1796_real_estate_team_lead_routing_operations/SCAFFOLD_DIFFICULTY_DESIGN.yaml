# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Real Estate Team & Lead Routing Operations
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: commission_split_estimated_vs_actual_on_deal
        grounds:
          - calculations.commission_split
          - entities.Deal.fields.split_basis_type
          - state_machines.Deal.PENDING_to_APPROVED
        distinguishing_aspect: |
          Deal domain: the ESTIMATED variant (basis = agent-reported gross at
          contract time) and the ACTUAL variant (basis = leader-confirmed actual
          at approval) produce different cents for the SAME deal; the waterfall
          must recompute end-to-end on basis switch.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy, REFERRAL_PARTNER source (fee 2500 bps via partner Pat), one ACTIVE MEMBER agent C, one ONBOARDING LEADER agent L"
            - "Lead routed to C, claimed, worked to WORKING; Deal created with gross_commission_cents 1000000"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Pat Referrals", type: "REFERRAL_PARTNER", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/referral-partners", payload: { team_id: "${t}", name: "Pat", fee_bps: 2500 }, as: TeamAdmin, captures: { partner: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer One", contact_phone: "+15125550001", contact_email: "b1@x.com", expected_close_price_cents: 50000000, referral_partner_id: "${partner}" }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead}", gross_commission_cents: 1000000 }, as: Agent, as_user_id: "${c}", captures: { deal: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal}/approve", payload: { actual_gross_commission_cents: 1200000 }, as: TeamLeader, as_user_id: "${l}" }
          assert:
            - "Before approval the ESTIMATED variant gives: Deal.split_basis_cents == 1000000, referral_fee_cents == 250000, house_share_cents == 225000, agent_pool_cents == 525000, split_basis_type == ESTIMATED"
            - "After approval with actual 1200000: split_basis_type == ACTUAL, split_basis_cents == 1200000, referral_fee_cents == 300000, house_share_cents == 270000, agent_pool_cents == 630000"
            - "agent_shares == [{agent_id: ${c}, amount_cents: 630000}] (no covering split agreement)"
            - "Conservation holds on both variants: 250000+225000+525000 == 1000000 and 300000+270000+630000 == 1200000"
            - "Lead.${lead}.status == CLOSED_WON after approval"

      - name: source_roi_realized_vs_projected_on_lead_source
        grounds:
          - calculations.source_roi
          - endpoints."GET /crm/lead-sources/{sourceId}/roi"
        distinguishing_aspect: |
          LeadSource domain (distinct from the Deal domain of the sibling
          instance): REALIZED vs PROJECTED attribution bases produce different
          roi_bps for the SAME source data whenever open pipeline exists —
          440000 vs 710000 here.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; PORTAL source cost_per_lead_cents 10000, auto_route true; ACTIVE agent C; ONBOARDING LEADER L"
            - "Lead1 (expected 50000000) routed -> CLAIMED -> WORKING -> Deal gross 900000 APPROVED (CLOSED_WON)"
            - "Lead2 (expected 40000000) routed -> CLAIMED, engagement 40+30+10 = 80 points so temperature HOT, still open pipeline"
            - "Logical clock 2026-08-02T00:00:00Z so events (occurred 2026-08-01T06:00:00Z) decay fully (age < 30 days)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 10000, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer One", contact_phone: "+15125550001", contact_email: "b1@x.com", expected_close_price_cents: 50000000 }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead1}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead1}", gross_commission_cents: 900000 }, as: Agent, as_user_id: "${c}", captures: { deal1: $.data.id } }
            - { call: "POST /crm/deals/${deal1}/approve", payload: {}, as: TeamLeader, as_user_id: "${l}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer Two", contact_phone: "+15125550002", contact_email: "b2@x.com", expected_close_price_cents: 40000000 }, as: TeamAdmin, captures: { lead2: $.data.id } }
            - { call: "POST /crm/leads/${lead2}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead2}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T06:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead2}/engagement-events", payload: { type: "REPLIED", occurred_at: "2026-08-01T06:30:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead2}/engagement-events", payload: { type: "LINK_CLICK", occurred_at: "2026-08-01T07:00:00Z" }, as: TeamAdmin }
          trigger:
            - { call: "GET /crm/lead-sources/${src}/roi?basis=REALIZED", as: TeamAdmin, captures: { roi_realized: $.data.roi_bps, comm_realized: $.data.attributed_commission_cents } }
            - { call: "GET /crm/lead-sources/${src}/roi?basis=PROJECTED", as: TeamAdmin, captures: { roi_projected: $.data.roi_bps, comm_projected: $.data.attributed_commission_cents } }
          assert:
            - "REALIZED: leads_count == 2, conversions_count == 1, spend_cents == 20000, attributed_commission_cents == 900000, roi_bps == 440000"
            - "PROJECTED: attributed_commission_cents == 1440000 (900000 realized + round_half_up(40000000 * 0.03 * 0.45) = 540000 pipeline), roi_bps == 710000"
            - "roi_realized (440000) != roi_projected (710000) for identical source data"
            - "Lead.${lead2}.temperature == HOT and Lead.${lead2}.status == CLAIMED (open pipeline included only in PROJECTED)"

  - rule_id: combinatorial_formula
    instances:
      - name: performance_weighted_selector_multi_input_score
        grounds:
          - calculations.agent_selector
          - entities.RoutingPolicy.fields.tier_weight_bps
        distinguishing_aspect: |
          Mode (a): the selector score multiplies tier_weight_bps by remaining
          capacity with a conditional HOT-lead doubling branch — >= 3 inputs with
          non-linear interaction; flipping only the lead temperature flips the
          chosen agent (62500 vs 45000 COLD; 50000 vs 90000 HOT).
        test_recipe:
          setup:
            - "Team with ACTIVE PERFORMANCE_WEIGHTED policy (default tier weights BRONZE 10000 / SILVER 11000 / GOLD 12500 / PLATINUM 15000); SPHERE source auto_route false"
            - "Agent A (created first, max_active_leads 5) seeded GOLD via import-production-stats (conversions 4, avg response 600)"
            - "Agent B (max_active_leads 3) seeded PLATINUM (conversions 9, avg response 200)"
            - "Lead COLD (no events) and Lead HOT (SHOWING_ATTENDED 40 + REPLIED 30 + LINK_CLICK 10 = 80 points at full weight)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "PERFORMANCE_WEIGHTED" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 100000000, auto_route: false }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent A", license_number: "LIC-A", max_active_leads: 5 }, as: TeamAdmin, captures: { a: $.data.id } }
            - { call: "POST /crm/agents/${a}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${a}/import-production-stats", payload: { trailing_90d_conversions: 4, trailing_90d_claimed: 10, trailing_90d_offered: 12, avg_first_response_seconds: 600 }, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent B", license_number: "LIC-B", max_active_leads: 3 }, as: TeamAdmin, captures: { b: $.data.id } }
            - { call: "POST /crm/agents/${b}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents/${b}/import-production-stats", payload: { trailing_90d_conversions: 9, trailing_90d_claimed: 20, trailing_90d_offered: 22, avg_first_response_seconds: 200 }, as: TeamAdmin }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Cold Lead", contact_phone: "+15125550010", contact_email: "cold@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead_cold: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Hot Lead", contact_phone: "+15125550011", contact_email: "hot@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead_hot: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead_hot}/engagement-events", payload: { type: "SHOWING_ATTENDED", occurred_at: "2026-08-01T06:00:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead_hot}/engagement-events", payload: { type: "REPLIED", occurred_at: "2026-08-01T06:30:00Z" }, as: TeamAdmin }
            - { call: "POST /crm/leads/${lead_hot}/engagement-events", payload: { type: "LINK_CLICK", occurred_at: "2026-08-01T07:00:00Z" }, as: TeamAdmin }
          trigger:
            - { call: "POST /crm/leads/${lead_cold}/route", payload: {}, as: TeamAdmin, captures: { asg_cold_agent: $.data.agent_id, asg_cold_mode: $.data.policy_mode_snapshot } }
            - { call: "POST /crm/leads/${lead_hot}/route", payload: {}, as: TeamAdmin, captures: { asg_hot_agent: $.data.agent_id } }
          assert:
            - "COLD lead routes to Agent A (${a}): score A = 12500 * 5 = 62500 beats B = 15000 * 3 = 45000 (no HOT boost)"
            - "HOT lead routes to Agent B (${b}): A = 12500 * 4 = 50000 (one capacity consumed by the cold lead), B = 15000 * 3 * 2 = 90000 via the HOT boost branch (B has 9 >= 5 trailing conversions; A has 4 < 5 and is not boosted)"
            - "asg_cold_mode == PERFORMANCE_WEIGHTED"
            - "Agent.${a}.performance_tier == GOLD and Agent.${b}.performance_tier == PLATINUM after the imports"

      - name: commission_split_pinned_rounding_order
        grounds:
          - calculations.commission_split
          - entities.SplitAgreement.fields.a_share_bps
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round the referral fee,
          then the house share on the remainder, then agent A's share of the pool,
          with the unrounded remainder to agent B. Rounding both shares half-up
          would give B 2500 and break conservation (2501 + 2500 = 5001 > 5000);
          the pinned order gives B exactly 2499.
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; SPHERE source auto_route true cost 0; ACTIVE agents C (created first) and B2; ONBOARDING LEADER L"
            - "ACTIVE SplitAgreement C(5001 bps)/B2(4999 bps) effective from 2026-08-01T00:00:00Z open-ended"
            - "Lead routed to C, claimed, WORKING; Deal gross 7143 (no referral partner)"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Sphere", type: "SPHERE", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Partner B2", license_number: "LIC-B2", max_active_leads: 10 }, as: TeamAdmin, captures: { b2: $.data.id } }
            - { call: "POST /crm/agents/${b2}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/split-agreements", payload: { team_id: "${t}", agent_a_id: "${c}", agent_b_id: "${b2}", a_share_bps: 5001, b_share_bps: 4999, effective_from: "2026-08-01T00:00:00Z" }, as: TeamAdmin, captures: { agr: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer", contact_phone: "+15125550020", contact_email: "b@x.com", expected_close_price_cents: 30000000 }, as: TeamAdmin, captures: { lead: $.data.id } }
            - { call: "POST /crm/leads/${lead}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead}", gross_commission_cents: 7143 }, as: Agent, as_user_id: "${c}", captures: { deal: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal}/approve", payload: {}, as: TeamLeader, as_user_id: "${l}" }
          assert:
            - "referral_fee_cents == 0 (no partner); house_share_cents == 2143 (round_half_up(7143 * 0.3) = round_half_up(2142.9)); agent_pool_cents == 5000"
            - "agent_shares == [{agent_id: ${c}, amount_cents: 2501}, {agent_id: ${b2}, amount_cents: 2499}]: A = round_half_up(5000 * 5001 / 10000) = round_half_up(2500.5) = 2501; B receives the remainder 5000 - 2501 = 2499, NOT round_half_up(2499.5) = 2500"
            - "Conservation: 0 + 2143 + 2501 + 2499 == 7143 == split_basis_cents"
            - "Deal.${deal}.split_agreement_id == ${agr} (snapshot)"

      - name: referral_fee_volume_tier_excludes_current_deal
        grounds:
          - calculations.referral_fee_tier
          - entities.Deal.fields.effective_fee_bps
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — a deal's fee tier depends on
          partner calendar-year volume that itself consists of deals like this
          one. The scaffold pins the evaluation order: the current deal is
          EXCLUDED from its own tier input, so deal2 at 8,000,000 with 6,000,000
          prior volume pays 2,000,000 (2500 bps), not 2,400,000 (3000 bps).
        test_recipe:
          setup:
            - "Team with ACTIVE ROUND_ROBIN policy; REFERRAL_PARTNER source cost 0; partner Pat fee_bps 2500; ACTIVE agent C; ONBOARDING LEADER L"
            - "Deal1 basis 6,000,000 APPROVED (partner YTD volume 6,000,000 < 10,000,000 threshold)"
            - "Deal2 basis 8,000,000 PENDING; including it would push volume to 14,000,000 >= threshold"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Pat Referrals", type: "REFERRAL_PARTNER", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/referral-partners", payload: { team_id: "${t}", name: "Pat", fee_bps: 2500 }, as: TeamAdmin, captures: { partner: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Closer C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Leader L", license_number: "LIC-L", role_on_team: "LEADER", max_active_leads: 5 }, as: TeamAdmin, captures: { l: $.data.id } }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer One", contact_phone: "+15125550030", contact_email: "b1@x.com", expected_close_price_cents: 50000000, referral_partner_id: "${partner}" }, as: TeamAdmin, captures: { lead1: $.data.id } }
            - { call: "POST /crm/leads/${lead1}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead1}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead1}", gross_commission_cents: 6000000 }, as: Agent, as_user_id: "${c}", captures: { deal1: $.data.id } }
            - { call: "POST /crm/deals/${deal1}/approve", payload: {}, as: TeamLeader, as_user_id: "${l}" }
            - { call: "POST /crm/leads", payload: { team_id: "${t}", source_id: "${src}", contact_name: "Buyer Two", contact_phone: "+15125550031", contact_email: "b2@x.com", expected_close_price_cents: 50000000, referral_partner_id: "${partner}" }, as: TeamAdmin, captures: { lead2: $.data.id } }
            - { call: "POST /crm/leads/${lead2}/claim", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/leads/${lead2}/log-response", payload: {}, as: Agent, as_user_id: "${c}" }
            - { call: "POST /crm/deals", payload: { lead_id: "${lead2}", gross_commission_cents: 8000000 }, as: Agent, as_user_id: "${c}", captures: { deal2: $.data.id } }
          trigger:
            - { call: "POST /crm/deals/${deal2}/approve", payload: {}, as: TeamLeader, as_user_id: "${l}" }
          assert:
            - "Deal1: effective_fee_bps == 2500, referral_fee_cents == 1500000 (YTD volume excluding itself was 0)"
            - "Deal2: effective_fee_bps == 2500, referral_fee_cents == 2000000 — YTD volume excluding deal2 is 6,000,000 < 10,000,000; including deal2's own 8,000,000 would wrongly yield 14,000,000 >= threshold and 2,400,000"
            - "Deal1.referral_fee_cents remains 1500000 after deal2's approval (tier snapshot immutability)"
  - rule_id: non_linear_state_machine
    instances:
      - name: lead_parallel_status_and_temperature_dimensions
        grounds:
          - state_machines.Lead
          - calculations.engagement_score_and_temperature
          - entities.Lead.fields.temperature
        distinguishing_aspect: |
          Lead carries parallel state dimensions (status x temperature) on one
          row: engagement events flip temperature COLD -> HOT while status stays
          OFFERED, and claiming flips status OFFERED -> CLAIMED without touching
          temperature. Distinct entity from the sibling Agent cycle instance.
        test_recipe:
          setup:
            - "Team (defaults: speed 900s, claim 7200s) with ACTIVE ROUND_ROBIN policy; PORTAL source auto_route true; ACTIVE agent C"
            - "Lead created at default clock (2026-08-01T00:00:00Z), auto-routed to C, status OFFERED, temperature COLD, engagement_score 0"
          setup_api_calls:
            - { call: "POST /crm/teams", payload: { name: "Alpha", market: "Austin", timezone: "America/Chicago" }, as: TeamAdmin, captures: { t: $.data.id, t_v: $.data.version } }
            - { call: "POST /crm/routing-policies", payload: { team_id: "${t}", mode: "ROUND_ROBIN" }, as: TeamAdmin, captures: { pol: $.data.id } }
            - { call: "POST /crm/routing-policies/${pol}/activate", payload: { expected_team_version: "${t_v}" }, as: TeamAdmin }
            - { call: "POST /crm/lead-sources", payload: { team_id: "${t}", name: "Zillow", type: "PORTAL", cost_per_lead_cents: 0, monthly_budget_cents: 100000000 }, as: TeamAdmin, captures: { src: $.data.id } }
            - { call: "POST /crm/agents", payload: { team_id: "${t}", display_name: "Agent C", license_number: "LIC-C", max_active_leads: 10 }, as: TeamAdmin, captures: { c: $.data.id } }
            - { call: "POST /crm/agents/${c}/activate", payload: {}, as: TeamAdmin }
