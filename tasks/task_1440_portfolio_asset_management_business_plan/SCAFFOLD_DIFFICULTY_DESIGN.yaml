            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { tot_rev: $.data.total_revenue_budget_cents } }
          assert:
            - "Elapsed months keep budget 11,000,000 and actual 11,000,000 (b1==b2==b3==11000000, a1v==a2v==a3v==11000000)"
            - "b4 == 11111111 and b5 == 11111111 and b11 == 11111111 (floor months 4..11)"
            - "b12 == 11111112 (single remainder month)"
            - "Conservation: 3*11000000 (actuals) + 8*11111111 + 11111112 == 133000000 == revised_annual exactly"
            - "tot_rev == 133600000 (133,000,000 RENT + 500,000 PARKING + 100,000 OTHER_REVENUE; other categories' elapsed singles absorb their full revised amount)"
