# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task 2584 Merchandise Allocation & Replenishment
#
# Section 1.9 breadth probe. One group per section of
# references/claim-extraction-guide.md; claim_type values are taken only from
# that guide's per-section rows. Instances whose corner is already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry excluded_because and no test_recipe.
# Every instance is reachable from an empty database through setup_api_calls,
# and every asserted number is pre-computed from the formulas in SCAFFOLD.yaml.
# =============================================================================
scaffold_corner_design:
  # section 1.2 entities and section 1.3 relationships
  - section: entities
    instances:
      - name: entity_creation_returns_every_declared_field_on_201
        claim_type: creation
        grounds:
          - entities.AllocationProgram
          - entities.Store
          - entities.FixturePlan
          - entities.SizeProfile
          - entities.Item
          - entities.StorePosition
          - entities.Receipt
          - entities.PromoEvent
          - response_envelope.success
          - endpoints.POST /allocation/programs
        distinguishing_aspect: |
          Every creatable entity must answer its POST with 201 and a body that carries ALL of its declared
          fields at once - the echoed inputs, the common_fields (id, created_at, updated_at, version), the
          system fields at their declared defaults and the computed fields already evaluated. The eight
          creations here are chained in dependency order from an empty database, so a body that silently
          drops a computed field (capacity_units, core_size_count, units_unallocated) or a null-valued system
          field (locked_at, replenishment_model_override) is caught on the very first call rather than on a
          later read.
        test_recipe:
          setup:
            - "The database is empty and the logical clock is set to 2026-08-01T00:00:00Z"
            - "No entity of any kind exists before the trigger runs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
          trigger:
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH", transfer_min_ratio_bp: 18000, scorecard_basis: "SIMPLE_AVERAGE" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 3, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_id: $.data.id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }], core_size_min_share_bp: 2000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 10, size_on_hand: [{ size_code: "S", units: 3 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 12 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-7001", units_received: 20, size_received: [{ size_code: "S", units: 4 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 3 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-A", scope: "PROGRAM", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { pe_id: $.data.id }
          assert:
            - "The program POST returns 201 with all 15 AllocationProgram fields present: name FA26 Core Tops, season_code FA26, banner_code NORTH, status PLANNING, transfer_min_ratio_bp 18000, scorecard_basis SIMPLE_AVERAGE, total_units_received 0, total_units_committed 0, open_reserve_units 0, locked_at null, lock_reason null, plus id, created_at, updated_at and version == 1"
            - "The store POST returns 201 with store_code 0101, grade A, grade_index_bp 13000, cluster_code URBAN, freight_flat_usd 41.00, historical_sell_through_bp 6500 and system status ACTIVE"
            - "The fixture-plan POST returns 201 with capacity_units == 60 (3 x 4 x 5) already computed and effective_to null"
            - "The size-profile POST returns 201 with size_count == 4 and core_size_count == 3 (XL share_bp 1500 < core_size_min_share_bp 2000), and its body has NO version and NO updated_at because SizeProfile carries only id and created_at"
            - "The item POST returns 201 with replenishment_model_override null, computed replenishment_model DEMAND_DRIVEN (item_type SEASONAL), lifecycle_state ACTIVE, broken_store_count 0 and size_out_store_count 0"
            - "The activate POST returns 200 with status ACTIVE and version == 2 - the same representation shape, not a bare acknowledgement"
            - "The store-position POST returns 201 with on_hand_units 10, size_on_hand [{S:3},{M:4},{L:3}], on_order_units 0, in_transit_units 0, reserved_out_units 0, available_units 10, broken_size_count 0, assortment_status COMPLETE, stock_status IN_STOCK and consolidated_out false"
            - "The receipt POST returns 201 with units_received 20, status STAGED, units_committed 0 and units_unallocated 20"
            - "The promo-event POST returns 201 with scope PROGRAM, cluster_code null, store_id null, item_class APPAREL_TOP, lift_factor_bp 11000 and status DRAFT"
            - "Every one of the eight created rows has version == 1 (the program reaches 2 only after activate) and a non-null created_at"
            - "Every response body is wrapped in the success envelope with data as a single object, never an array"
      - name: single_read_returns_the_persisted_post_mutation_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET /allocation/programs/{programId}
          - endpoints.GET /allocation/store-positions/{positionId}
          - endpoints.GET /allocation/promo-events/{eventId}
          - entities.StorePosition.fields.stock_status
          - response_envelope.success
        distinguishing_aspect: |
          A single read is not a replay of the creation payload: it must show the state left by every
          mutation since. Two mutations run first - a PATCH that raises min_units from 8 to 12 and a schedule
          that moves the event out of DRAFT - and then all eight by-id reads are taken. The position read
          must show stock_status re-derived to LOW and version 2, the promo read SCHEDULED and version 2, and
          the program read ACTIVE and version 2, while the five untouched rows must still read version 1 with
          their computed fields intact.
        test_recipe:
          setup:
            - "Program FA26 with store 0101, a 3 x 4 x 5 shelf plan (capacity 60, pmin 12), SizeProfile TOP-4SZ with core_size_min_share_bp 2000, and SKU-1001 SEASONAL"
            - "Position 0101 holds 10 units (S 3, M 4, L 3) with min 8 / max 20 -> IN_STOCK and COMPLETE"
            - "A 20-unit receipt ASN-7002 is STAGED and a PROGRAM-scope event BTS-A is DRAFT"
            - "The program has been activated; the logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 3, facings_per_fixture: 4, units_per_facing: 5, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp_id: $.data.id }
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }], core_size_min_share_bp: 2000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 10, size_on_hand: [{ size_code: "S", units: 3 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 12 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-7002", units_received: 20, size_received: [{ size_code: "S", units: 4 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 3 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/promo-events"
              payload: { program_id: "${prog_id}", event_code: "BTS-A", scope: "PROGRAM", item_class: "APPAREL_TOP", start_date: "2026-08-05T00:00:00Z", end_date: "2026-08-10T00:00:00Z", lift_factor_bp: 11000 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { pe_id: $.data.id }
          trigger:
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { min_units: 12 }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/promo-events/${pe_id}/schedule"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "GET /allocation/programs/${prog_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/stores/${s1_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/fixture-plans/${fp_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/size-profiles/${sp_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/items/${item_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/promo-events/${pe_id}"
              payload: {}
              as: Allocator
          assert:
            - "GET store-position returns min_units 12, available_units 10, stock_status LOW (re-derived by the PATCH) and version == 2, with assortment_status still COMPLETE"
            - "GET promo-event returns status SCHEDULED and version == 2"
            - "GET program returns status ACTIVE, version == 2, total_units_received 20, total_units_committed 0 and open_reserve_units 20 - the receipt is visible in the parent aggregate"
            - "GET store returns version == 1 and status ACTIVE; GET fixture-plan returns version == 1 with capacity_units 60"
            - "GET size-profile returns size_count 4 and core_size_count 3 and exposes NO version field at all"
            - "GET item returns version == 1, replenishment_model DEMAND_DRIVEN and lifecycle_state ACTIVE"
            - "GET receipt returns status STAGED, units_committed 0, units_unallocated 20 and version == 1"
            - "All eight reads return 200 with data as a single object, and each id echoes the id minted at creation"
      - name: store_listing_pagination_and_filter_composition
        claim_type: listing
        grounds:
          - endpoints.GET /allocation/stores
          - endpoints.GET /allocation/store-positions
          - endpoints.GET /allocation/fixture-plans
          - response_envelope.pagination
          - entities.Store.fields.status
        distinguishing_aspect: |
          Filters must compose (AND, never OR) and pagination must be computed over the FILTERED set, not
          over the table. Four stores exist, three of them URBAN and one of those three in REMODEL. A
          limit-2 page over the URBAN filter must report total_count 3 and has_more true while returning 2
          rows; the offset-2 page must return the remaining 1 row with has_more false; and the two pages
          together must contain exactly the three URBAN ids with no duplicate. Adding status ACTIVE to the
          same cluster filter must drop the REMODEL store, and an unmatched cluster must yield an empty
          array with total_count 0 rather than 404.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with four stores: 0101(A,URBAN), 0102(B,URBAN), 0103(B,URBAN), 0104(A,SUBURBAN)"
            - "Store 0103 has been moved to REMODEL; the other three are ACTIVE"
            - "Shelf plans exist for 0101 (APPAREL_TOP) and 0102 (APPAREL_TOP) only"
            - "Positions exist for SKU-1001 at 0101 (empty -> BROKEN) and at 0102 (12 units -> COMPLETE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "B", grade_index_bp: 12500, cluster_code: "URBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "A", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { fp1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 8 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], min_units: 6, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 10 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 12, size_on_hand: [{ size_code: "S", units: 3 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/stores/${s3_id}/status"
              payload: { target_status: "REMODEL" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
          trigger:
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", limit: 2, offset: 0 }
              as: Allocator
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", limit: 2, offset: 2 }
              as: Allocator
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}", cluster_code: "URBAN", status: "ACTIVE" }
              as: Allocator
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}", grade: "B" }
              as: Allocator
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}" }
              as: Allocator
            - call: "GET /allocation/stores"
              payload: { program_id: "${prog_id}", cluster_code: "MOUNTAIN" }
              as: Allocator
            - call: "GET /allocation/store-positions"
              payload: { item_id: "${item_id}", assortment_status: "BROKEN" }
              as: Allocator
            - call: "GET /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP" }
              as: Allocator
          assert:
            - "URBAN limit 2 offset 0 returns exactly 2 rows with pagination.total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "URBAN limit 2 offset 2 returns exactly 1 row with total_count == 3 and has_more == false; the union of the two pages is exactly {0101, 0102, 0103} with no id appearing twice"
            - "URBAN + status ACTIVE returns exactly 2 rows, {0101, 0102}, with total_count == 2 - the filters AND together and REMODEL 0103 is excluded"
            - "grade B returns exactly 2 rows, {0102, 0103}, proving the grade filter is independent of cluster and status"
            - "program_id alone returns all 4 rows with total_count == 4, limit == 10 (the declared default) and has_more == false"
            - "cluster_code MOUNTAIN returns 200 with data == [] and total_count == 0, not 404"
            - "The position listing filtered on assortment_status BROKEN returns exactly 1 row, the empty 0101 position, matching the computed dimension rather than any stored input"
            - "The fixture-plan listing for store 0101 and class APPAREL_TOP returns exactly 1 row with total_count == 1"
            - "Every list response wraps data in an array and carries the pagination block; single-object reads never do"
      - name: not_found_probes_for_all_thirteen_path_id_families
        claim_type: not_found
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_POSITION_NOT_FOUND
          - errors.ERR_RECEIPT_NOT_FOUND
          - errors.ERR_RUN_NOT_FOUND
          - errors.ERR_LINE_NOT_FOUND
          - errors.ERR_RECOMMENDATION_NOT_FOUND
          - errors.ERR_ASSORTMENT_ACTION_NOT_FOUND
          - validations[priority:5]
          - validations[priority:6]
        distinguishing_aspect: |
          Thirteen entity families are addressable by path id and each must answer an unknown but
          well-formed uuid with its OWN 404 code - a generic ERR_NOT_FOUND, or a 200 with a null body, fails
          the claim. The same uuid is used everywhere so the discriminator is purely the route. Two body-FK
          probes then show that the priority-6 body-FK rule applies to referenced ids just as priority 5 applies to path
          ids, and that the code names the entity that was actually missing (item vs store) rather than the
          entity being created.
        test_recipe:
          setup:
            - "Program FA26 exists with store 0101, SizeProfile TOP-4SZ and SKU-1001, so the valid ids in the two body probes really do resolve"
            - "The uuid 11111111-1111-4111-8111-111111111111 is well-formed and belongs to no row of any table"
            - "No receipt, run, line, transfer, action, promo event or snapshot has ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
