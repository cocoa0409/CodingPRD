  # ===========================================================================
  # Rule 4 — transitive_cascade  (≥2 instances, depth ≥3 and depth ≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: agreement_termination_three_hop_contract_incident_cascade
        grounds:
          - state_machines.PlacementAgreement.ACTIVE_to_TERMINATED
          - state_machines.RobotSystem.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
          - state_machines.IncidentServiceRequest
          - endpoints.POST_/api/placement-agreements/{agreementId}/terminate
        distinguishing_aspect: "Depth 3, each hop triggered by the previous hop rather than by the terminate call: agreement termination decommissions the system (hop 1), the decommission causes the ACTIVE coverage contract to terminate (hop 2), and that contract termination causes the OPEN incident to resolve (hop 3)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One ACTIVE PURCHASE agreement, one commissioned IN_SERVICE system, its synthesized COMPREHENSIVE contract, and one OPEN incident filed against the system."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
