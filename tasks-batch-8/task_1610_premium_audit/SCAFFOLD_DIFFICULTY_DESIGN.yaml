  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: billing_signed_sum_matches_latest_result_adjustment
        grounds:
          - calculations.billing_adjustment
          - state_machines.BillingTransaction.ISSUED_to_CANCELLED
          - entities.BillingTransaction.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: the signed sum of a policy's non-CANCELLED billing transactions (invoices positive,
          credits negative). Forward issue (-554400 credit) plus the compensating uphold-cancellation plus the
          re-audit re-issue (-554400 credit) leaves the signed sum exactly equal to the latest ISSUED result's
          adjustment_cents — no drift across the compensate/rebill cycle.
        test_recipe:
          setup:
            - "WC policy WC-1800 (CA): VOLUNTARY_REPORT original audit ISSUED at 2026-08-15 with allocation 95000 on 8810, mod 1.20, minimum 10000 -> earned 45600, adjustment -554400, credit billing B1 554400; dispute upheld at 2026-08-20 supersedes the result and CANCELS B1; the spawned REAUDIT work order is then driven through the physical flow with identical payroll facts and issued at 2026-08-25"
          setup_api_calls:
            - { call: "POST /classification-codes", payload: { code: "8810", description: "Clerical", state_code: "CA", coverage_line: "WC", rate_per_100_cents: 40, high_hazard: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: Underwriter, captures: { cc_a: "$.data.id" } }
            - { call: "POST /policies", payload: { policy_number: "WC-1800", insured_name: "Omega", coverage_line: "WC", state_code: "CA", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-07-31T00:00:00Z", estimated_annual_premium_cents: 600000, minimum_premium_cents: 10000, payroll_estimate_dollars: 100000, experience_mod_factor: 1.20, class_code_ids: ["${cc_a}"] }, as: Underwriter, captures: { pol: "$.data.id" } }
            - { call: "POST /auditors", payload: { full_name: "Ada Auditor", territory_states: ["CA"], level: "SENIOR" }, as: AuditManager, captures: { aud: "$.data.id" } }
            - { call: "POST /audit-selection-runs", payload: {}, as: AuditManager }
            - { call: "GET /audit-work-orders", payload: { policy_id: "${pol}" }, as: AuditManager, captures: { wo: "$.data[0].id" } }
            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 95000, expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "POST /audit-work-orders/${wo}/submit-draft", payload: {}, as: Auditor, as_user_id: "${aud}", captures: { res1: "$.data.id" } }
