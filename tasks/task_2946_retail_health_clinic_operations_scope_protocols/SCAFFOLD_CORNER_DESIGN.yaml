      - name: corner_cancel_is_refused_on_a_cancelled_and_on_a_clock_completed_assignment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFFING_ASSIGNMENT_INVALID_STATE]
          - state_machines.StaffingAssignment
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Both terminal states are locked: a second cancel of a CANCELLED assignment and a cancel of an assignment the clock has driven to COMPLETED both return ERR_STAFFING_ASSIGNMENT_INVALID_STATE (409), and neither decrements on_duty_clinician_count a second time."
        test_recipe:
          setup:
            - "A CA StateRule, an OPEN CA clinic with min_clinicians_required 1 and two ACTIVE assignments running [00:00, 01:00)."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
