scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bill_estimated_vs_actual_read
        grounds:
          - calculations.consolidated_bill_total
          - entities.MeterReading.fields.read_type
          - entities.Bill.fields.read_basis
        distinguishing_aspect: |
          For the SAME water meter, a bill whose latest reading is ESTIMATED bills
          the meter.estimated_monthly_units (6000 gal -> 2890) while a later bill on
          an ACTUAL delta of 9500 gal bills 4640; the two variants diverge on Bill.
        test_recipe:
          setup:
            - "WATER rate schedule active; account with one WATER meter, estimated_monthly_units=6000."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Ada Water", service_address: "1 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER", estimated_monthly_units: 6000 }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-01-31T00:00:00Z", reading_value: 6000, read_type: "ESTIMATED" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-02-28T00:00:00Z", reading_value: 15500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b2_id: $.data.id }
          assert:
            - "Bill.${b1_id}.read_basis == ESTIMATED"
            - "Bill.${b1_id}.total_due_cents == 2890"
            - "Bill.${b2_id}.read_basis == ACTUAL"
            - "Bill.${b2_id}.total_due_cents == 4640"
            - "Bill.${b1_id}.total_due_cents != Bill.${b2_id}.total_due_cents"

      - name: leak_credit_sewer_relief_vs_tier_reprice
        grounds:
          - calculations.leak_adjustment_credit
          - state_machines.Adjustment.REQUESTED_to_APPROVED
          - entities.Adjustment.fields.relief_method
        distinguishing_aspect: |
          For identical excess of 6500 gal (9500 actual - 3000 baseline), SEWER_RELIEF
          credits 1625 while TIER_REPRICE credits 647; the dual-variant lives on
          Adjustment, a different entity domain than the Bill dual-variant above.
        test_recipe:
          setup:
            - "Two accounts, each with a WATER meter read 9500 (ACTUAL) and a generated bill (water line 4640)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Sewer A", service_address: "2 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a1_id: $.data.id }
            - call: "POST /accounts/${a1_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m1_id: $.data.id }
            - call: "POST /meters/${m1_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a1_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b1_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_holder_name: "Reprice B", service_address: "3 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a2_id: $.data.id }
            - call: "POST /accounts/${a2_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m2_id: $.data.id }
            - call: "POST /meters/${m2_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a2_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /bills/${b1_id}/adjustments"
              payload: { adjustment_type: "LEAK", relief_method: "SEWER_RELIEF", baseline_units: 3000 }
              as: AssistanceCaseworker
              as_user_id: "cw_1"
              captures: { adj1_id: $.data.id }
            - call: "POST /adjustments/${adj1_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup_1"
              captures: { credit1: $.data.credit_cents }
            - call: "POST /bills/${b2_id}/adjustments"
              payload: { adjustment_type: "LEAK", relief_method: "TIER_REPRICE", baseline_units: 3000 }
              as: AssistanceCaseworker
              as_user_id: "cw_1"
              captures: { adj2_id: $.data.id }
            - call: "POST /adjustments/${adj2_id}/approve"
              payload: {}
              as: Supervisor
              as_user_id: "sup_1"
              captures: { credit2: $.data.credit_cents }
          assert:
            - "Adjustment.${adj1_id}.credit_cents == 1625"
            - "Adjustment.${adj2_id}.credit_cents == 647"
            - "Adjustment.${adj1_id}.credit_cents != Adjustment.${adj2_id}.credit_cents"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: water_tiered_marginal_rate_with_assistance
        grounds:
          - calculations.water_tier_charge
          - calculations.consolidated_bill_total
          - entities.Account.fields.assistance_discount_pct
        distinguishing_aspect: |
          Mode (a): three inputs interact non-linearly — consumption 9500 selects two
          marginal water tiers (6000@315 + 3500@500 + 1000 fixed = 4640), then a 0.20
          assistance discount yields credit 928 and actual 3712.
        test_recipe:
          setup:
            - "Account enrolled in LIHEAP at 0.20 discount, WATER meter read 9500 ACTUAL."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Liheap Lou", service_address: "4 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/assistance"
              payload: { program: "LIHEAP", discount_pct: 0.20 }
              as: AssistanceCaseworker
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
          trigger:
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
          assert:
            - "Bill.${b_id}.pre_discount_total_cents == 4640"
            - "Bill.${b_id}.assistance_credit_cents == 928"
            - "Bill.${b_id}.actual_charges_cents == 3712"
            - "Bill.${b_id}.total_due_cents == 3712"

      - name: consolidated_bill_round_per_line_then_sum
        grounds:
          - calculations.consolidated_bill_total
          - calculations.sewer_charge
          - entities.Bill.fields.pre_discount_total_cents
        distinguishing_aspect: |
          Mode (b): water line rounds 2648.71->2649 and sewer line rounds 2108.5->2109;
          summing the two ROUNDED lines gives 4758, whereas sum-then-round of
          (2648.71 + 2108.5)=4757.21 gives 4757 — the pinned order yields 4758.
        test_recipe:
          setup:
            - "Account with WATER + SEWER meters; WATER read 5234 ACTUAL; SEWER derives from water."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /rate-schedules"
              payload: { service_type: "SEWER", unit: "FLAT", fixed_charge_cents: 800, sewer_rate_cents_per_1000: 250, sewer_cap_units: 10000, effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Round Rita", service_address: "5 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { wm_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "SEWER" }
              as: BillingSpecialist
              captures: { sm_id: $.data.id }
            - call: "POST /meters/${wm_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 5234, read_type: "ACTUAL" }
              as: MeterTech
          trigger:
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
          assert:
            - "Bill.${b_id}.pre_discount_total_cents == 4758"
            - "Bill.${b_id}.total_due_cents == 4758"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_arrangement_default_reinstate_cycle
        grounds:
          - state_machines.PaymentArrangement.ACTIVE_to_DEFAULTED
          - state_machines.PaymentArrangement.DEFAULTED_to_ACTIVE
          - entities.PaymentArrangement.fields.status
        distinguishing_aspect: |
          PaymentArrangement cycles ACTIVE -> DEFAULTED -> ACTIVE across record-missed
          then reinstate; the same row returns to ACTIVE, a cycle no linear pipeline
          allows.
        test_recipe:
          setup:
            - "Account with one ACTIVE payment arrangement (30000 over 3 installments)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Cycle Cara", service_address: "6 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id, acct_v: $.data.version }
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 30000, installment_count: 3, expected_account_version: "${acct_v}" }
              as: AssistanceCaseworker
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /payment-arrangements/${pa_id}/record-missed"
              payload: {}
              as: CollectionsOfficer
            - call: "POST /payment-arrangements/${pa_id}/reinstate"
              payload: {}
              as: AssistanceCaseworker
          assert:
            - "PaymentArrangement.${pa_id}.installment_amount_cents == 10000"
            - "PaymentArrangement.${pa_id}.status == ACTIVE"

      - name: bill_parallel_payment_and_collection_axes
        grounds:
          - state_machines.Bill.CURRENT_to_DELINQUENT
          - state_machines.Bill.UNPAID_to_PARTIAL
          - entities.Bill.fields.payment_status
          - entities.Bill.fields.collection_status
        distinguishing_aspect: |
          Bill.collection_status flips to DELINQUENT while payment_status stays UNPAID;
          a subsequent partial payment moves payment_status to PARTIAL yet leaves
          collection_status DELINQUENT — two independent axes on one row (a different
          entity than the PaymentArrangement cycle above).
        test_recipe:
          setup:
            - "Account with WATER meter read 9500, bill 4640 (due 2026-05-21); clock advanced past grace and bill marked delinquent."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Axis Al", service_address: "7 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: CollectionsOfficer
            - call: "POST /bills/${b_id}/mark-delinquent"
              payload: {}
              as: CollectionsOfficer
          trigger:
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 2000, method: "CASH" }
              as: BillingSpecialist
              captures: { pay_id: $.data.id }
          assert:
            - "Bill.${b_id}.payment_status == PARTIAL"
            - "Bill.${b_id}.collection_status == DELINQUENT"
            - "Bill.${b_id}.amount_paid_cents == 2000"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: arrangement_default_cascade_to_shutoff_depth3
        grounds:
          - state_machines.PaymentArrangement.ACTIVE_to_DEFAULTED
          - state_machines.Account.ACTIVE_to_DELINQUENT
          - state_machines.Bill.CURRENT_to_DELINQUENT
          - entities.ShutoffOrder.fields.origin
        distinguishing_aspect: |
          record-missed sets PA DEFAULTED (link1) which delinquents the Account (link2)
          which delinquents the account's open bills and auto-creates a CASCADE
          ShutoffOrder (link3) — a depth-3 chain where each hop is caused by the prior.
        test_recipe:
          setup:
            - "Account with WATER meter read 9500, one UNPAID bill (CURRENT), and one ACTIVE arrangement."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Cascade Cy", service_address: "8 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id, acct_v: $.data.version }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /accounts/${a_id}/payment-arrangements"
              payload: { total_arranged_cents: 4640, installment_count: 4, expected_account_version: "${acct_v}" }
              as: AssistanceCaseworker
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /payment-arrangements/${pa_id}/record-missed"
              payload: {}
              as: CollectionsOfficer
            - call: "GET /accounts/${a_id}/shutoff-orders"
              payload: {}
              as: CollectionsOfficer
              captures: { so_origin: "$.data[0].origin", so_status: "$.data[0].status" }
          assert:
            - "PaymentArrangement.${pa_id}.status == DEFAULTED"
            - "Account.${a_id}.status == DELINQUENT"
            - "Bill.${b_id}.collection_status == DELINQUENT"
            - "GET /accounts/${a_id}/shutoff-orders returns exactly one order with origin == CASCADE and status == SCHEDULED"

      - name: finalize_deposit_refund_cascade_depth3
        grounds:
          - state_machines.Account.ACTIVE_to_FINALED
          - state_machines.Deposit.HELD_to_APPLIED
          - calculations.deposit_settlement
        distinguishing_aspect: |
          finalize generates the final Bill 4640 (link1), which triggers deposit
          application of 4640 (link2), whose 1360 overage triggers a refund Payment
          (link3) — a distinct trigger (finalize) from the arrangement-default cascade.
        test_recipe:
          setup:
            - "Account with WATER meter read 9500 and a HELD deposit of 6000; no prior bill."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Final Fay", service_address: "9 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/deposits"
              payload: { amount_cents: 6000, reason: "NEW_SERVICE" }
              as: BillingSpecialist
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/finalize"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { fb_id: $.data.id }
          assert:
            - "Bill.${fb_id}.total_due_cents == 4640"
            - "Bill.${fb_id}.amount_paid_cents == 4640"
            - "Deposit.${d_id}.status == APPLIED"
            - "Deposit.${d_id}.applied_cents == 4640"
            - "Deposit.${d_id}.refunded_cents == 1360"
            - "Account.${a_id}.status == FINALED"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_finalized_account_payment
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          A payment of 5000 on a FINALED account (balance 0) violates BOTH state
          (ERR_ACCOUNT_NOT_ACTIVE, pri 4) and business_fiscal
          (ERR_PAYMENT_EXCEEDS_BALANCE, pri 9); the state error wins.
        test_recipe:
          setup:
            - "Account with no meters, finalized (final bill 0, status FINALED)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_name: "Done Dan", service_address: "10 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/finalize"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
          trigger:
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 5000, method: "CASH" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"
            - "http_status == 409"

      - name: state_beats_sod_on_already_approved_adjustment
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Re-approving an already-APPROVED adjustment by the ORIGINAL requester
          violates BOTH state (ERR_INVALID_STATE, pri 4) and business_safety SoD
          (ERR_SOD_VIOLATION, pri 5); the state error wins — a different category
          pair than the state/fiscal conflict above.
        test_recipe:
          setup:
            - "A bill with a GOODWILL adjustment requested by user cw_shared and already approved by supervisor sup_a."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Adj Amy", service_address: "11 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
