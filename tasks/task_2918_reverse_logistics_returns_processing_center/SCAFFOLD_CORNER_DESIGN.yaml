          assert:
            - "HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /return-lines/${rl_id} still shows condition_grade == null, disposition == null, disposition_state == RECEIVED_UNGRADED and graded_by_user_id == null, so the refused call had no side effect"
            - "The same POST /return-lines/${rl_id}/grade with condition_grade B as GradingInspector u_grader returns HTTP 200 with condition_grade == B and graded_by_user_id == u_grader"
            - "GET /return-lines/${rl_id}/fraud-checks as ReceivingClerk still returns HTTP 200, so the clerk keeps its declared read access"

