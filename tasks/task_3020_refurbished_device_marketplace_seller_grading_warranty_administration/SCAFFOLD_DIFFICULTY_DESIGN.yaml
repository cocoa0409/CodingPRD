    - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
    distinguishing_aspect: 'The conserved quantity is a cash reserve: after the replacement is upheld and its return routed, Seller.exposure_floor_cents returns to exactly the value it held before the claim existed, because the clawback is derived from the reserve the claim itself formed and never from the buyer payout.'
