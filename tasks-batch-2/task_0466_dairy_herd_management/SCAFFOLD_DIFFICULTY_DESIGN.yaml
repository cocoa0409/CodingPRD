              as: HerdManager
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${a_id}", drug_name: "Mastitis Tx", administered_at: "2026-06-09T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
              as: Veterinarian
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /herds/health-treatments/${t_id}/void"
              payload: {}
              as: Veterinarian
          assert:
            - "HealthTreatment.${t_id}.status == VOIDED"
            - "Animal.${a_id}.milk_eligible == true"

      - name: milking_shift_void_restores_parlor_interval_availability
        grounds:
          - state_machines.MilkingShift.LOGGED_to_VOIDED
          - validations[priority=10]
          - entities.MilkingShift.fields.status
        distinguishing_aspect: |
          Conserved quantity = the parlor's set of occupied (LOGGED) intervals (a DIFFERENT conserved
          quantity than milk_eligible). Forward log occupies 04:00-07:00; voiding it frees the interval so
          a later overlapping shift at 05:00-08:00 that previously would collide now succeeds — net of the
          log+void pair the parlor's occupancy over that window is unchanged.
        test_recipe:
          setup:
            - "Parlor turnaround_minutes 0; a LOGGED shift 04:00-07:00 on 2026-06-01 that is then VOIDED."
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Invariant Parlor Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/parlors"
              payload: { herd_id: "${h_id}", name: "North D-12", stall_capacity: 24, turnaround_minutes: 0 }
              as: HerdManager
              captures: { p_id: $.data.id }
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T04:00:00Z", end_at: "2026-06-01T07:00:00Z", cows_milked: 24 }
              as: ParlorTech
              captures: { shift1_id: $.data.id }
            - call: "POST /herds/milking-shifts/${shift1_id}/void"
              payload: {}
              as: ParlorTech
          trigger:
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T05:00:00Z", end_at: "2026-06-01T08:00:00Z", cows_milked: 24 }
              as: ParlorTech
              captures: { shift2_id: $.data.id }
          assert:
            - "MilkingShift.${shift1_id}.status == VOIDED"
            - "response.status == 201"
            - "MilkingShift.${shift2_id}.status == LOGGED"
