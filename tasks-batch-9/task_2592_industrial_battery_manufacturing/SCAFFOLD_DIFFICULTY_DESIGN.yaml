          assert:
            - "probe 1 SUCCEEDS (6.00 alone) and probe 2 SUCCEEDS: over [09:00, 10:00) the aggregate is exactly 6.00 + 4.00 == 10.00 == power_cap_kw, and <= accepts the cap"
            - "probe 3 is 409 ERR_CHAMBER_CAPACITY_EXCEEDED: [09:30, 09:45) sits inside the saturated interval, so 10.00 + 1.00 > 10.00 - a 15-minute test is refused by an instantaneous, not an average, constraint"
            - "probe 4 SUCCEEDS: [10:00, 12:00) is ADJACENT to ${t1_id} ([08:00, 10:00)) so the 6.00 draw does not count; only ${t2_id} overlaps and 4.00 + 5.00 == 9.00 <= 10.00"
