              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /product-batches/${rd_batch_id}/shipments"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /pathway-registrations"
              payload: { unit_id: "${unit_id}", program: "LCFS", feedstock_type: "UCO", proposed_ci_gco2e_per_mj: 41.25 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pathway_id: $.data.id }
            - call: "POST /pathway-registrations/${pathway_id}/submissions"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /pathway-registrations/${pathway_id}/review-starts"
              payload: {}
              as: IndependentVerifier
              as_user_id: "verifier-1"
            - call: "POST /pathway-registrations/${pathway_id}/review-decisions"
              payload: { decision: "REGISTER", certified_ci: 41.25 }
              as: IndependentVerifier
              as_user_id: "verifier-1"
            - call: "POST /credit-blocks"
              payload: { batch_id: "${rd_batch_id}", pathway_id: "${pathway_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { block_id: $.data.id, prov_credits: $.data.provisional_credits_mtco2e }
            - call: "POST /credit-blocks/${block_id}/internal-signoffs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /credit-blocks/${block_id}/verification-submissions"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
