# =============================================================================
# PRD Benchmark Scaffold — task_2318 Fire Department Staffing & Overtime Management
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the two
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2318. Fire Department Staffing & Overtime Management (municipal fire department): minimum staffing requirements by apparatus and station with company closure rules, shift scheduling on multi-platoon rotations with Kelly days and trade requests, leave request approval against staffing floors with seniority ordering, overtime hiring order through rosters, mandatory holdover and callback rules under labor agreements, specialty certification staffing such as paramedic, hazardous materials and technical rescue on each shift, overtime cost forecasting against budget with vacancy and injury leave drivers, fair labor standards work period calculations for fire protection employees, staffing analytics feeding academy hiring decisions

domain_name: fire-staffing-overtime
api_prefix: /fire-ops

complexity_profile:
  primary_archetype: quota_allocation          # finite staffing seats competed for, reserved by offers, committed, released
  secondary_archetype: compliance_audit        # labor-agreement + FLSA 7(k) constraints gate every hiring action
  complexity_layers:
    - optimistic_concurrency                   # OCC on DutyShift.version and Firefighter.version
    - cascading_side_effects                   # relief -> vacancy -> posture -> requeue chains
    - dual_variant_calculation                 # forecast VACANCY_DRIVEN vs RUN_RATE; FLSA scheduled vs worked basis
    - selector_policy                          # overtime hiring order + company-closure selection
    - rate_threshold_triggers                  # staffing-gap posture bands, FLSA 204h, budget 90%/100% bands

  entity_topology: flat
  # Every entity is a peer addressed at /fire-ops/<collection>/{id}; parentage is
  # expressed only through FK fields, never through nested URL ownership chains.

  state_machine_shape: cyclic
  # Vacancy OPEN<->OFFERING, TradeRequest COUNTERSIGNED->PROPOSED,
  # DutyShift HIRING<->STAFFED, LeaveRequest QUEUED<->DENIED all loop back.

  relationship_patterns:
    - one_to_many          # Station -> Apparatus / Firefighter / DutyShift / HiringRoster
    - self_referential     # Firefighter.acting_supervisor_id -> Firefighter.id
    - polymorphic          # Vacancy.driver_source_id -> LeaveRequest.id | Firefighter.id | null
    - cross_aggregate      # ShiftAssignment couples DutyShift x Firefighter x Apparatus x OvertimeOffer

  role_model: segregation_of_duties
  # StaffingOfficer hires, CompanyOfficer adjudicates, PayrollAnalyst finalizes
  # pay; a CompanyOfficer may never decide a trade or a leave batch they are a
  # party to, and the officer who staffs a shift never closes its payroll.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station name, e.g. 'Station 12'" }
      - { name: battalion_code, type: string, source: input, description: "Battalion the station reports to" }
      - { name: minimum_staffing_floor, type: integer, source: input, description: "Contractual absolute headcount floor per shift, independent of apparatus math", constraints: ">= 0" }
      - { name: fiscal_ot_budget_cents, type: integer, source: input, description: "Overtime budget for the fiscal period, in cents", constraints: ">= 0" }
      - { name: fiscal_period_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) first day of the fiscal period" }
      - { name: fiscal_period_end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) last day of the fiscal period", constraints: ">= fiscal_period_start_date" }
      - { name: ot_committed_cents, type: integer, source: computed, default: 0, description: "Encumbered but not yet paid overtime; see calculations.ot_committed_ledger" }
      - { name: ot_actual_cents, type: integer, source: computed, default: 0, description: "Overtime premium already worked and posted by duty-shift completion" }
      - { name: budget_posture, type: enum, source: computed, default: "WITHIN", description: "WITHIN | WATCH | OVER — see calculations.station_budget_posture", constraints: "WITHIN | WATCH | OVER" }

  - name: Apparatus
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the station this unit is housed at" }
      - { name: unit_designation, type: string, source: input, description: "Radio designation, e.g. 'ENGINE-12'", constraints: "unique per station_id" }
      - { name: apparatus_type, type: enum, source: input, description: "ENGINE | LADDER | RESCUE | MEDIC | HAZMAT", constraints: "ENGINE | LADDER | RESCUE | MEDIC | HAZMAT" }
      - { name: minimum_crew_size, type: integer, source: input, description: "Seats that must be staffed for the company to run", constraints: ">= 1 and <= 8" }
      - { name: required_certifications, type: array, source: input, description: "Multiset of specialty certifications the crew must carry, e.g. ['PARAMEDIC'] or ['HAZMAT_TECH','HAZMAT_TECH']; each element in PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE", default: [], constraints: "length <= minimum_crew_size" }
      - { name: closure_priority, type: integer, source: input, description: "Company-closure ranking key; the highest value among eligible companies is closed first", constraints: ">= 0" }
      - { name: closure_exempt, type: boolean, source: input, default: false, description: "true = first-due company that may never be closed by a company-closure action" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | OUT_OF_SERVICE — OUT_OF_SERVICE units are excluded from required_staffing", constraints: "IN_SERVICE | OUT_OF_SERVICE" }

  - name: Firefighter
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; home station for roster and scope checks" }
      - { name: acting_supervisor_id, type: string, source: input, default: null, description: "FK -> Firefighter.id; self-referential supervisor link used for audit trails; null for the station commander" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: rank, type: enum, source: input, description: "FIREFIGHTER | ENGINEER | LIEUTENANT | CAPTAIN", constraints: "FIREFIGHTER | ENGINEER | LIEUTENANT | CAPTAIN" }
      - { name: platoon, type: enum, source: input, description: "A | B | C | D — the multi-platoon rotation the member belongs to", constraints: "A | B | C | D" }
      - { name: seniority_rank, type: integer, source: input, description: "1 = most senior in the department; used as the leave and hiring ordering key", constraints: ">= 1, unique department-wide" }
      - { name: kelly_day_cycle_position, type: integer, source: input, description: "Which slot of the 8-slot Kelly cycle this member is off; see calculations.rotation_calendar", constraints: "1..8" }
      - { name: certifications, type: array, source: input, default: [], description: "Specialty certifications held; each element in PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Straight-time hourly rate in cents", constraints: ">= 1" }
      - { name: employment_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INJURY_LEAVE | SEPARATED", constraints: "ACTIVE | INJURY_LEAVE | SEPARATED" }
      - { name: roster_standing, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | PASSED | UNAVAILABLE — hiring-roster eligibility flag", constraints: "AVAILABLE | PASSED | UNAVAILABLE" }
      - { name: voluntary_ot_hours_charged, type: number, source: computed, default: 0, description: "Overtime hours charged against the voluntary hiring order; a declined or expired offer charges as if worked" }
      - { name: mandatory_holdover_count, type: integer, source: computed, default: 0, description: "Times this member has been held over under the mandatory-holdover article" }
      - { name: callback_count, type: integer, source: computed, default: 0, description: "Times this member has been called back from off-duty" }
      - { name: ot_pass_count, type: integer, source: computed, default: 0, description: "Consecutive declines/expiries on voluntary offers; at OT_PASS_LIMIT the member's roster_standing flips to PASSED" }
      - { name: pending_offer_count, type: integer, source: computed, default: 0, description: "Count of this member's OvertimeOffer rows in status OFFERED" }

  - name: HiringRoster
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; rosters are station-scoped" }
      - { name: roster_type, type: enum, source: input, description: "VOLUNTARY_OT | MANDATORY_HOLDOVER | CALLBACK — one roster per hiring mode", constraints: "VOLUNTARY_OT | MANDATORY_HOLDOVER | CALLBACK; unique per (station_id, roster_type, certification_scope)" }
      - { name: certification_scope, type: enum, source: input, default: "NONE", description: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE — the specialty this roster hires for; NONE is the general roster", constraints: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE" }
      - { name: dispatch_count, type: integer, source: computed, default: 0, description: "Offers dispatched from this roster" }

  - name: DutyShift
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the station being staffed" }
      - { name: shift_date, type: string, source: input, description: "ISO date (YYYY-MM-DD); duty period is [shift_date T08:00:00Z, +24h)" }
      - { name: platoon, type: enum, source: input, description: "A | B | C | D — must equal the platoon the rotation calendar puts on duty for shift_date", constraints: "A | B | C | D; unique per (station_id, shift_date)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | HIRING | STAFFED | COMPLETED", constraints: "DRAFT | HIRING | STAFFED | COMPLETED" }
      - { name: required_staffing, type: integer, source: computed, default: 0, description: "Sum of minimum_crew_size over IN_SERVICE apparatus of the station not listed in closed_apparatus_ids" }
      - { name: assigned_headcount, type: integer, source: computed, default: 0, description: "Count of ShiftAssignment rows on this shift with status SCHEDULED" }
      - { name: certification_gap_count, type: integer, source: computed, default: 0, description: "Unmet specialty seats across open companies; see calculations.certification_coverage" }
      - { name: staffing_gap, type: integer, source: computed, default: 0, description: "= max(0, required_staffing - assigned_headcount)" }
      - { name: leave_floor_headcount, type: integer, source: computed, default: 0, description: "= max(Station.minimum_staffing_floor, required_staffing - LEAVE_FLOOR_SLACK); discretionary leave may not push assigned_headcount below it" }
      - { name: staffing_posture, type: enum, source: computed, default: "FULLY_STAFFED", description: "FULLY_STAFFED | SHORT | CRITICAL — see calculations.staffing_posture", constraints: "FULLY_STAFFED | SHORT | CRITICAL" }
      - { name: closed_apparatus_ids, type: array, source: computed, default: [], description: "Apparatus ids closed for this shift by company-closure actions, in closure order" }
      - { name: open_vacancy_count, type: integer, source: computed, default: 0, description: "Count of Vacancy rows on this shift with status OPEN or OFFERING" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by every staffing-run checkpoint" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id; the shift being worked" }
      - { name: firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the member occupying the seat" }
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id; the company the seat belongs to" }
      - { name: source_offer_id, type: string, source: system, default: null, description: "FK -> OvertimeOffer.id; set when the seat was produced by an accepted or mandated offer, else null" }
      - { name: relieved_by_leave_request_id, type: string, source: system, default: null, description: "FK -> LeaveRequest.id; set when this seat was relieved by an approved leave, cleared on revoke" }
      - { name: assignment_type, type: enum, source: input, description: "REGULAR | KELLY_RELIEF | OVERTIME | HOLDOVER | CALLBACK | TRADE", constraints: "REGULAR | KELLY_RELIEF | OVERTIME | HOLDOVER | CALLBACK | TRADE" }
      - { name: seat_certification, type: enum, source: input, default: "NONE", description: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE — the specialty seat this member fills on the company", constraints: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE" }
      - { name: scheduled_hours, type: number, source: input, description: "Hours the seat is scheduled for; the occupied interval is [shift_date T08:00:00Z, +scheduled_hours)", constraints: "> 0 and <= 24" }
      - { name: actual_hours, type: number, source: system, default: null, description: "Hours actually worked; stamped equal to scheduled_hours when the duty shift completes" }
      - { name: projected_premium_cents, type: integer, source: computed, default: 0, description: "Overtime premium encumbered by this seat; 0 for REGULAR / KELLY_RELIEF / TRADE seats" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | WORKED | RELIEVED | CANCELLED", constraints: "SCHEDULED | WORKED | RELIEVED | CANCELLED" }

  - name: LeaveRequest
    parent: null
    common_fields: true
    fields:
      - { name: firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the requesting member" }
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id; the shift the leave is taken from" }
      - { name: leave_type, type: enum, source: input, description: "INJURY | SICK | KELLY_DAY | BEREAVEMENT | VACATION", constraints: "INJURY | SICK | KELLY_DAY | BEREAVEMENT | VACATION" }
      - { name: requested_hours, type: number, source: input, description: "Leave hours requested against the shift", constraints: "> 0 and <= 24" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | APPROVED | DENIED | REVOKED", constraints: "QUEUED | APPROVED | DENIED | REVOKED" }
      - { name: decision_order_index, type: integer, source: computed, default: null, description: "1-based position this request occupied in the last leave-adjudication ordering; null until adjudicated" }
      - { name: denial_reason, type: enum, source: computed, default: null, description: "null | STAFFING_FLOOR — why the last adjudication denied the request", constraints: "null | STAFFING_FLOOR" }
      - { name: backfill_vacancy_id, type: string, source: system, default: null, description: "Vacancy row created when this leave was approved; null when no seat needed backfilling" }

  - name: TradeRequest
    parent: null
    common_fields: true
    fields:
      - { name: requesting_firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the member giving the shift away" }
      - { name: counterparty_firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the member taking the shift" }
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id; the shift being traded" }
      - { name: traded_assignment_id, type: string, source: system, default: null, description: "FK -> ShiftAssignment.id; the seat re-badged to the counterparty on approval" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | COUNTERSIGNED | APPROVED | REJECTED", constraints: "PROPOSED | COUNTERSIGNED | APPROVED | REJECTED" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Times an officer returned the trade for revision (COUNTERSIGNED -> PROPOSED)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the CompanyOfficer that last decided the trade" }

  - name: Vacancy
    parent: null
    common_fields: true
    fields:
      - { name: duty_shift_id, type: string, source: input, description: "FK -> DutyShift.id; the shift with the hole" }
      - { name: apparatus_id, type: string, source: input, description: "FK -> Apparatus.id; the company with the empty seat" }
      - { name: filled_by_assignment_id, type: string, source: system, default: null, description: "FK -> ShiftAssignment.id; the seat that filled this vacancy" }
      - { name: driver, type: enum, source: system, description: "VACANT_POSITION | LEAVE | INJURY — why the seat is open", constraints: "VACANT_POSITION | LEAVE | INJURY" }
      - { name: driver_source_id, type: string, source: system, default: null, description: "Polymorphic reference to the record that created the hole: LeaveRequest.id when driver = LEAVE, Firefighter.id when driver = INJURY, null when driver = VACANT_POSITION" }
      - { name: required_certification, type: enum, source: system, default: "NONE", description: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE — specialty the filling member must hold", constraints: "NONE | PARAMEDIC | HAZMAT_TECH | TECHNICAL_RESCUE" }
      - { name: seat_index, type: integer, source: system, description: "1-based seat number within the company for this shift" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | OFFERING | FILLED | CLOSED_BY_COMPANY_CLOSURE | CANCELLED", constraints: "OPEN | OFFERING | FILLED | CLOSED_BY_COMPANY_CLOSURE | CANCELLED" }

  - name: OvertimeOffer
    parent: null
    common_fields: true
    fields:
      - { name: vacancy_id, type: string, source: input, description: "FK -> Vacancy.id; the seat being offered" }
      - { name: firefighter_id, type: string, source: system, description: "FK -> Firefighter.id; the member the hiring order selected" }
      - { name: roster_id, type: string, source: system, description: "FK -> HiringRoster.id; the roster the selection came from" }
      - { name: hiring_mode, type: enum, source: input, description: "VOLUNTARY | MANDATORY_HOLDOVER | CALLBACK", constraints: "VOLUNTARY | MANDATORY_HOLDOVER | CALLBACK" }
      - { name: offer_hours, type: number, source: computed, description: "Payable hours after the mode minimum is applied" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Encumbrance for this offer; see calculations.overtime_offer_cost" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; created_at + OFFER_RESPONSE_WINDOW_MINUTES for OFFERED rows, null for MANDATED rows" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | RESCINDED | MANDATED", constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED | RESCINDED | MANDATED" }

  - name: WorkPeriod
    parent: null
    common_fields: true
    fields:
      - { name: firefighter_id, type: string, source: input, description: "FK -> Firefighter.id; the member the FLSA 7(k) work period belongs to" }
      - { name: period_start_date, type: string, source: system, description: "ISO date; first day of the 27-day fire-protection work period" }
      - { name: period_end_date, type: string, source: system, description: "ISO date; = period_start_date + FLSA_PERIOD_DAYS - 1" }
      - { name: flsa_threshold_hours, type: number, source: system, default: 204, description: "Hours in the period beyond which the FLSA 7(k) premium accrues" }
      - { name: adjusted_scheduled_hours, type: number, source: computed, default: 0, description: "Net payroll adjustment posted against scheduled hours" }
      - { name: adjusted_worked_hours, type: number, source: computed, default: 0, description: "Net payroll adjustment posted against worked hours" }
      - { name: scheduled_hours, type: number, source: computed, default: 0, description: "Assignment scheduled hours in the period plus adjusted_scheduled_hours" }
      - { name: worked_hours, type: number, source: computed, default: 0, description: "Assignment actual hours in the period plus adjusted_worked_hours" }
      - { name: leave_hours, type: number, source: computed, default: 0, description: "Approved leave hours in the period; excluded from hours worked for FLSA purposes" }
      - { name: projected_flsa_overtime_hours, type: number, source: computed, default: 0, description: "SCHEDULED_BASIS variant output = max(0, scheduled_hours - flsa_threshold_hours)" }
      - { name: final_flsa_overtime_hours, type: number, source: computed, default: 0, description: "WORKED_BASIS variant output = max(0, worked_hours - flsa_threshold_hours)" }
      - { name: flsa_premium_cents, type: integer, source: computed, default: 0, description: "Half-time premium on the variant selected by status; see calculations.flsa_work_period_overtime" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED — OPEN periods price on SCHEDULED_BASIS, CLOSED periods on WORKED_BASIS", constraints: "OPEN | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DutyShift
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: HIRING
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/publish"
        actor: StaffingOfficer
        preconditions:
          - "duty_shift.status == DRAFT, else ERR_SHIFT_NOT_DRAFT"
        side_effects:
          - "required_staffing recomputed per calculations.required_staffing"
          - "Vacancy rows created per calculations.vacancy_generation (driver = VACANT_POSITION, status = OPEN)"
          - "open_vacancy_count, assigned_headcount, staffing_gap, certification_gap_count, leave_floor_headcount, staffing_posture recomputed"
          - "increments DutyShift.version by 1"
        note: "Taken when calculations.vacancy_generation produced at least one OPEN vacancy (open_vacancy_count > 0)."

      - from: DRAFT
        to: STAFFED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/publish"
        actor: StaffingOfficer
        preconditions:
          - "duty_shift.status == DRAFT, else ERR_SHIFT_NOT_DRAFT"
        side_effects:
          - "required_staffing, staffing_gap, certification_gap_count, leave_floor_headcount, staffing_posture recomputed"
          - "increments DutyShift.version by 1"
        note: "Branch taken when vacancy_generation produced zero vacancies (every seat already carries a SCHEDULED assignment)."

      - from: HIRING
        to: STAFFED
        trigger: "system (automatic whenever open_vacancy_count reaches 0 after any Vacancy leaves OPEN/OFFERING)"
        actor: system
        preconditions:
          - "open_vacancy_count == 0 after the triggering mutation"
        side_effects:
          - "staffing_gap, certification_gap_count, staffing_posture recomputed"
          - "increments DutyShift.version by 1"

      - from: STAFFED
        to: HIRING
        trigger: "system (automatic whenever a new Vacancy row is created on a STAFFED shift — leave approval, injury availability change, or assignment cancellation)"
        actor: system
        preconditions:
          - "open_vacancy_count >= 1 after the triggering mutation"
        side_effects:
          - "assigned_headcount, staffing_gap, certification_gap_count, staffing_posture recomputed"
          - "increments DutyShift.version by 1"
        note: "Cycle partner of HIRING -> STAFFED; a shift may oscillate any number of times before completion."

      - from: HIRING
        to: HIRING
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run"
        actor: StaffingOfficer
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
        side_effects:
          - "ops_run_index += 1"
          - "Step 1: every OvertimeOffer on this shift with status OFFERED and expires_at <= current clock -> EXPIRED (see calculations.offer_expiry_sweep)"
          - "Step 2: derived staffing fields recomputed (required_staffing, assigned_headcount, staffing_gap, certification_gap_count, leave_floor_headcount, staffing_posture, open_vacancy_count)"
          - "Step 3: if staffing_posture == FULLY_STAFFED, every LeaveRequest on this shift with status DENIED -> QUEUED (denial_reason cleared)"
          - "Step 4: Station.budget_posture recomputed"
          - "increments DutyShift.version by 1"
        note: "Ops-run checkpoint; the step order is normative because Step 1 changes what Step 2 sees and Step 2 decides whether Step 3 fires."

      - from: STAFFED
        to: STAFFED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run"
        actor: StaffingOfficer
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
        side_effects:
          - "Same four ordered steps as the HIRING self-transition; a STAFFED shift may fall back to HIRING inside Step 2 when Step 1 re-opened a vacancy"
          - "increments DutyShift.version by 1"

      - from: HIRING
        to: COMPLETED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/complete"
        actor: PayrollAnalyst
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "shift_date <= current clock date, else ERR_SHIFT_NOT_ELAPSED"
        side_effects:
          - "Every ShiftAssignment on this shift with status SCHEDULED -> WORKED with actual_hours = scheduled_hours"
          - "For each such assignment: the covering WorkPeriod's worked_hours and final_flsa_overtime_hours recomputed"
          - "Station.ot_actual_cents += sum(projected_premium_cents of the completed OVERTIME/HOLDOVER/CALLBACK seats); Station.ot_committed_cents -= the same amount"
          - "Every Vacancy on this shift with status OPEN or OFFERING -> CANCELLED; each OFFERED OvertimeOffer on those vacancies -> RESCINDED (with its own rescission side effects)"
          - "Every WorkPeriod of the involved firefighters with period_end_date <= shift_date -> CLOSED, flsa_premium_cents re-priced on the WORKED_BASIS variant, and a successor OPEN WorkPeriod created starting period_end_date + 1 day"
          - "Station.budget_posture recomputed"
          - "increments DutyShift.version by 1"

      - from: STAFFED
        to: COMPLETED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/complete"
        actor: PayrollAnalyst
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "shift_date <= current clock date, else ERR_SHIFT_NOT_ELAPSED"
        side_effects:
          - "Identical to the HIRING -> COMPLETED side-effect list"
          - "increments DutyShift.version by 1"

      - from: HIRING
        to: HIRING
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"
        actor: StaffingOfficer
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "expected_duty_shift_version == duty_shift.version, else ERR_STALE_VERSION"
          - "staffing_posture == CRITICAL, else ERR_CLOSURE_NOT_JUSTIFIED"
          - "calculations.company_closure_selector yields a company, else ERR_NO_CLOSURE_ELIGIBLE_COMPANY"
        side_effects:
          - "CASCADE HOP 1: selected Apparatus.id appended to closed_apparatus_ids; required_staffing recomputed without its minimum_crew_size"
          - "CASCADE HOP 2 (caused by hop 1): every Vacancy on this shift with apparatus_id == the closed company and status IN {OPEN, OFFERING} -> CLOSED_BY_COMPANY_CLOSURE"
          - "CASCADE HOP 3 (caused by hop 2): every OvertimeOffer with status OFFERED on those vacancies -> RESCINDED"
          - "CASCADE HOP 4 (caused by hop 3): for each rescinded offer, Station.ot_committed_cents -= offer.projected_cost_cents, offer.firefighter.pending_offer_count -= 1, then Station.budget_posture recomputed from the new committed total"
          - "SCHEDULED assignments on the closed company keep status SCHEDULED and still count in assigned_headcount (crew is administratively redistributed), but their seat_certification no longer counts toward certification coverage"
          - "staffing_gap, certification_gap_count, leave_floor_headcount, staffing_posture, open_vacancy_count recomputed; falls through to STAFFED when open_vacancy_count reaches 0"
          - "increments DutyShift.version by 1"

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [WORKED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: WORKED
        trigger: "system (duty-shift completion)"
        actor: system
        preconditions:
          - "duty_shift.status IN {HIRING, STAFFED} at the moment of completion"
        side_effects:
          - "actual_hours = scheduled_hours"
          - "covering WorkPeriod.worked_hours and final_flsa_overtime_hours recomputed"

      - from: SCHEDULED
        to: RELIEVED
        trigger: "system (leave-adjudication approves a LeaveRequest covering this seat)"
        actor: system
        preconditions:
          - "assignment.firefighter_id == leave_request.firefighter_id and assignment.duty_shift_id == leave_request.duty_shift_id"
        side_effects:
          - "relieved_by_leave_request_id = leave_request.id"
          - "covering WorkPeriod.scheduled_hours -= scheduled_hours, projected_flsa_overtime_hours and flsa_premium_cents recomputed"
          - "a Vacancy (driver = LEAVE, driver_source_id = leave_request.id, apparatus_id = this assignment's apparatus_id, required_certification = this assignment's seat_certification, seat_index = this assignment's company seat count) is created in status OPEN"

      - from: RELIEVED
        to: SCHEDULED
        trigger: "POST /fire-ops/leave-requests/{leave_request_id}/revoke"
        actor: Firefighter
        preconditions:
          - "relieved_by_leave_request_id == the revoked leave_request.id"
          - "the leave's backfill Vacancy is not FILLED, else ERR_LEAVE_ALREADY_BACKFILLED"
        side_effects:
          - "relieved_by_leave_request_id = null"
          - "covering WorkPeriod.scheduled_hours += scheduled_hours, projected_flsa_overtime_hours and flsa_premium_cents recomputed"
        note: "Compensating half of the leave-approval cascade; restores calculations.work_period_hour_ledger exactly."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"
        actor: CompanyOfficer
        preconditions:
          - "assignment.status == SCHEDULED, else ERR_ASSIGNMENT_NOT_SCHEDULED"
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
        side_effects:
          - "If projected_premium_cents > 0: Station.ot_committed_cents -= projected_premium_cents and Station.budget_posture recomputed (restores calculations.ot_committed_ledger to its pre-hire value)"
          - "covering WorkPeriod.scheduled_hours -= scheduled_hours; projected_flsa_overtime_hours and flsa_premium_cents recomputed"
          - "If the assignment filled a Vacancy (vacancy.filled_by_assignment_id == this id): that Vacancy -> OPEN with filled_by_assignment_id = null"
          - "DutyShift assigned_headcount, staffing_gap, certification_gap_count, staffing_posture, open_vacancy_count recomputed; STAFFED shift falls back to HIRING when a vacancy re-opened"

  - entity: LeaveRequest
    initial_state: QUEUED
    terminal_states: [REVOKED]
    transitions:
      - from: QUEUED
        to: APPROVED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication"
        actor: CompanyOfficer
        preconditions:
          - "leave_type IN {INJURY, SICK} (non-discretionary, approved regardless of the floor) OR assigned_headcount after all prior approvals in this batch minus 1 >= duty_shift.leave_floor_headcount"
        side_effects:
          - "decision_order_index stamped with the 1-based position from calculations.leave_adjudication_order; denial_reason = null"
          - "CASCADE HOP 1: the member's SCHEDULED ShiftAssignment on this shift (if any) -> RELIEVED"
          - "CASCADE HOP 2 (caused by hop 1): covering WorkPeriod.scheduled_hours reduced and re-priced; a Vacancy (driver = LEAVE) created in status OPEN; leave_request.backfill_vacancy_id set to it"
          - "CASCADE HOP 3 (caused by hop 2): DutyShift assigned_headcount / open_vacancy_count / staffing_gap / certification_gap_count / staffing_posture recomputed and a STAFFED shift transitions to HIRING"
          - "covering WorkPeriod.leave_hours += requested_hours"

      - from: QUEUED
        to: DENIED
        trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication"
        actor: CompanyOfficer
        preconditions:
          - "leave_type NOT IN {INJURY, SICK} and approving it would drop assigned_headcount below duty_shift.leave_floor_headcount"
        side_effects:
          - "decision_order_index stamped; denial_reason = STAFFING_FLOOR"
          - "No assignment, vacancy, work-period or budget mutation occurs"

      - from: DENIED
        to: QUEUED
        trigger: "system (staffing-run Step 3 when staffing_posture == FULLY_STAFFED)"
        actor: system
        preconditions:
          - "duty_shift.staffing_posture == FULLY_STAFFED after staffing-run Step 2"
        side_effects:
          - "denial_reason = null; decision_order_index retained until the next adjudication overwrites it"
        note: "Cycle: a denied request returns to the queue once closures or hires restore the floor, and can be denied again by a later batch."

      - from: APPROVED
        to: REVOKED
        trigger: "POST /fire-ops/leave-requests/{leave_request_id}/revoke"
        actor: Firefighter
        preconditions:
          - "leave_request.status == APPROVED, else ERR_LEAVE_NOT_REVOCABLE"
          - "X-User-ID == leave_request.firefighter_id, else ERR_NOT_RESOURCE_OWNER"
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "backfill Vacancy status != FILLED, else ERR_LEAVE_ALREADY_BACKFILLED"
        side_effects:
          - "CASCADE HOP 1: the RELIEVED ShiftAssignment carrying relieved_by_leave_request_id == this id -> SCHEDULED"
          - "CASCADE HOP 2 (caused by hop 1): covering WorkPeriod.scheduled_hours restored, projected_flsa_overtime_hours and flsa_premium_cents recomputed; WorkPeriod.leave_hours -= requested_hours"
          - "CASCADE HOP 3 (caused by hop 1): the backfill Vacancy -> CANCELLED"
          - "CASCADE HOP 4 (caused by hop 3): an OFFERED OvertimeOffer on that vacancy -> RESCINDED, Station.ot_committed_cents -= its projected_cost_cents, its firefighter's pending_offer_count -= 1, Station.budget_posture recomputed"
          - "DutyShift derived staffing fields recomputed; HIRING shift returns to STAFFED when open_vacancy_count reaches 0"

  - entity: TradeRequest
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: COUNTERSIGNED
        trigger: "POST /fire-ops/trade-requests/{trade_request_id}/countersign"
        actor: Firefighter
        preconditions:
          - "trade_request.status == PROPOSED, else ERR_TRADE_STATE_INVALID"
          - "X-User-ID == counterparty_firefighter_id, else ERR_NOT_RESOURCE_OWNER"
          - "counterparty Firefighter.employment_status == ACTIVE, else ERR_STATION_SCOPE_MISMATCH"
          - "current clock <= shift_date T08:00:00Z minus TRADE_LEAD_TIME_HOURS, else ERR_TRADE_WINDOW_CLOSED"
          - "counterparty has no SCHEDULED assignment whose interval overlaps this shift's duty period, else ERR_DOUBLE_BOOKED_SHIFT"
          - "counterparty holds the traded seat's seat_certification (or it is NONE), else ERR_CERTIFICATION_NOT_HELD"
          - "counterparty WorkPeriod.scheduled_hours + traded seat hours <= FLSA_MAX_PERIOD_HOURS, else ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED"
        side_effects: ["No staffing, ledger or work-period mutation; the trade is only a proposal until an officer decides it"]

      - from: COUNTERSIGNED
        to: APPROVED
        trigger: "POST /fire-ops/trade-requests/{trade_request_id}/decision with decision = APPROVE"
        actor: CompanyOfficer
        preconditions:
          - "trade_request.status == COUNTERSIGNED, else ERR_TRADE_STATE_INVALID"
          - "X-User-ID NOT IN {requesting_firefighter_id, counterparty_firefighter_id}, else ERR_SEGREGATION_OF_DUTIES"
          - "the requester still holds a SCHEDULED assignment on the shift, else ERR_ASSIGNMENT_NOT_SCHEDULED"
        side_effects:
          - "traded_assignment_id set; that ShiftAssignment.firefighter_id := counterparty_firefighter_id and assignment_type := TRADE"
          - "requester's covering WorkPeriod.scheduled_hours -= scheduled_hours and re-priced; counterparty's covering WorkPeriod.scheduled_hours += scheduled_hours and re-priced"
          - "projected_premium_cents set to 0 (trades are cost-neutral); if the seat previously carried a premium, Station.ot_committed_cents -= the old premium and Station.budget_posture recomputed"
          - "decided_by_user_id = X-User-ID"
          - "DutyShift derived staffing fields recomputed (assigned_headcount unchanged, certification coverage unchanged because seat_certification is preserved)"

      - from: COUNTERSIGNED
        to: REJECTED
        trigger: "POST /fire-ops/trade-requests/{trade_request_id}/decision with decision = REJECT"
        actor: CompanyOfficer
        preconditions:
          - "trade_request.status == COUNTERSIGNED, else ERR_TRADE_STATE_INVALID"
          - "X-User-ID NOT IN {requesting_firefighter_id, counterparty_firefighter_id}, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["decided_by_user_id = X-User-ID; no staffing or ledger mutation"]

      - from: COUNTERSIGNED
        to: PROPOSED
        trigger: "POST /fire-ops/trade-requests/{trade_request_id}/decision with decision = RETURN_FOR_REVISION"
        actor: CompanyOfficer
        preconditions:
          - "trade_request.status == COUNTERSIGNED, else ERR_TRADE_STATE_INVALID"
          - "X-User-ID NOT IN {requesting_firefighter_id, counterparty_firefighter_id}, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "revision_count += 1; decided_by_user_id = X-User-ID"
          - "The counterparty must countersign again before another decision is possible"
        note: "Cycle: PROPOSED -> COUNTERSIGNED -> PROPOSED may repeat without bound; each loop increments revision_count."

  - entity: Vacancy
    initial_state: OPEN
    terminal_states: [CLOSED_BY_COMPANY_CLOSURE, CANCELLED]
    transitions:
      - from: OPEN
        to: OFFERING
        trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer with hiring_mode IN {VOLUNTARY, CALLBACK}"
        actor: StaffingOfficer
        preconditions:
          - "vacancy.status == OPEN, else ERR_VACANCY_NOT_OFFERABLE"
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "apparatus_id NOT IN duty_shift.closed_apparatus_ids, else ERR_VACANCY_NOT_OFFERABLE"
          - "calculations.hiring_order_selector yields a candidate, else ERR_NO_ELIGIBLE_CANDIDATE"
          - "a HiringRoster matching the mode and certification exists, else ERR_ROSTER_NOT_CONFIGURED"
          - "Station.ot_actual_cents + Station.ot_committed_cents + projected_cost_cents <= Station.fiscal_ot_budget_cents, else ERR_OT_BUDGET_WOULD_EXCEED"
        side_effects:
          - "An OvertimeOffer is created in status OFFERED with expires_at = created_at + OFFER_RESPONSE_WINDOW_MINUTES"
          - "Station.ot_committed_cents += offer.projected_cost_cents; Station.budget_posture recomputed"
          - "selected Firefighter.pending_offer_count += 1; HiringRoster.dispatch_count += 1"

      - from: OPEN
        to: FILLED
        trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer with hiring_mode = MANDATORY_HOLDOVER"
        actor: StaffingOfficer
        preconditions:
          - "vacancy.status == OPEN, else ERR_VACANCY_NOT_OFFERABLE"
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "calculations.hiring_order_selector yields a candidate, else ERR_NO_ELIGIBLE_CANDIDATE"
          - "a HiringRoster with roster_type MANDATORY_HOLDOVER exists for the station, else ERR_ROSTER_NOT_CONFIGURED"
          - "The budget gate is NOT applied: the labor agreement compels the seat to be filled even when the encumbrance pushes Station.budget_posture to OVER"
        side_effects:
          - "An OvertimeOffer is created directly in status MANDATED with expires_at = null (the member may not decline)"
          - "A ShiftAssignment (assignment_type = HOLDOVER, seat_certification = vacancy.required_certification, scheduled_hours = offer.offer_hours, source_offer_id = offer.id) is created in status SCHEDULED"
          - "vacancy.filled_by_assignment_id set; Station.ot_committed_cents += offer.projected_cost_cents; Station.budget_posture recomputed"
          - "Firefighter.mandatory_holdover_count += 1; covering WorkPeriod.scheduled_hours += offer.offer_hours and re-priced"
          - "DutyShift derived staffing fields recomputed; shift returns to STAFFED when open_vacancy_count reaches 0"

      - from: OFFERING
        to: FILLED
        trigger: "POST /fire-ops/overtime-offers/{overtime_offer_id}/response with response = ACCEPT"
        actor: Firefighter
        preconditions:
          - "offer.status == OFFERED, else ERR_OFFER_NOT_PENDING"
          - "X-User-ID == offer.firefighter_id, else ERR_NOT_RESOURCE_OWNER"
          - "duty_shift.status IN {HIRING, STAFFED}, else ERR_SHIFT_NOT_HIRING"
          - "member still holds vacancy.required_certification, else ERR_CERTIFICATION_NOT_HELD"
          - "covering WorkPeriod.scheduled_hours + offer.offer_hours <= FLSA_MAX_PERIOD_HOURS, else ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED"
        side_effects:
          - "CASCADE HOP 1: a ShiftAssignment (assignment_type = OVERTIME for VOLUNTARY, CALLBACK for CALLBACK; source_offer_id = offer.id; projected_premium_cents = offer.projected_cost_cents) is created in status SCHEDULED and vacancy.filled_by_assignment_id set"
          - "CASCADE HOP 2 (caused by hop 1): covering WorkPeriod.scheduled_hours += offer.offer_hours; projected_flsa_overtime_hours recomputed"
          - "CASCADE HOP 3 (caused by hop 2): WorkPeriod.flsa_premium_cents re-priced on the SCHEDULED_BASIS variant"
          - "Firefighter.voluntary_ot_hours_charged += offer.offer_hours (VOLUNTARY) or callback_count += 1 (CALLBACK); ot_pass_count reset to 0; pending_offer_count -= 1"
          - "Station.ot_committed_cents is NOT re-added (the encumbrance moved from the offer to the assignment); Station.budget_posture recomputed"
          - "DutyShift derived staffing fields recomputed; shift returns to STAFFED when open_vacancy_count reaches 0"

      - from: OFFERING
        to: OPEN
        trigger: "POST /fire-ops/overtime-offers/{overtime_offer_id}/response with response = DECLINE, or staffing-run Step 1 expiry"
        actor: Firefighter | system
        preconditions:
          - "offer.status == OFFERED, else ERR_OFFER_NOT_PENDING"
          - "X-User-ID == offer.firefighter_id for the DECLINE path, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "offer -> DECLINED (member action) or EXPIRED (staffing-run sweep)"
          - "Firefighter.voluntary_ot_hours_charged += offer.offer_hours (charged as if worked, per the labor agreement); ot_pass_count += 1; pending_offer_count -= 1"
          - "If ot_pass_count >= OT_PASS_LIMIT: Firefighter.roster_standing -> PASSED (excluded from VOLUNTARY and CALLBACK candidate sets, still eligible for MANDATORY_HOLDOVER)"
          - "Station.ot_committed_cents -= offer.projected_cost_cents; Station.budget_posture recomputed"
        note: "Cycle: the vacancy returns to OPEN and can be offered again, to the next member in hiring order."

      - from: FILLED
        to: OPEN
        trigger: "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel on the filling assignment"
        actor: CompanyOfficer
        preconditions:
          - "vacancy.filled_by_assignment_id == the cancelled assignment id"
        side_effects:
          - "filled_by_assignment_id = null; DutyShift open_vacancy_count recomputed and a STAFFED shift returns to HIRING"

      - from: OPEN
        to: CLOSED_BY_COMPANY_CLOSURE
        trigger: "system (company-closure hop 2)"
        actor: system
        preconditions: ["vacancy.apparatus_id == the closed company"]
        side_effects: ["DutyShift open_vacancy_count recomputed"]

      - from: OFFERING
        to: CLOSED_BY_COMPANY_CLOSURE
        trigger: "system (company-closure hop 2)"
        actor: system
        preconditions: ["vacancy.apparatus_id == the closed company"]
        side_effects: ["The OFFERED OvertimeOffer on this vacancy -> RESCINDED (hop 3), which releases its encumbrance (hop 4)"]

      - from: OPEN
        to: CANCELLED
        trigger: "system (leave revoke of the driving LeaveRequest, injury clearance, or duty-shift completion)"
        actor: system
        preconditions: ["vacancy.status == OPEN"]
        side_effects: ["DutyShift open_vacancy_count recomputed; HIRING shift returns to STAFFED when it reaches 0"]

      - from: OFFERING
        to: CANCELLED
        trigger: "system (leave revoke of the driving LeaveRequest, injury clearance, or duty-shift completion)"
        actor: system
        preconditions: ["vacancy.status == OFFERING"]
        side_effects: ["The OFFERED OvertimeOffer -> RESCINDED and its encumbrance is released from Station.ot_committed_cents"]

  - entity: OvertimeOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, RESCINDED, MANDATED]
    transitions:
      - from: OFFERED
        to: MANDATED
        trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer with hiring_mode = MANDATORY_HOLDOVER (created and mandated in the same request)"
        actor: StaffingOfficer
        preconditions: ["hiring_mode == MANDATORY_HOLDOVER"]
        side_effects: ["expires_at = null; the HOLDOVER ShiftAssignment is created in the same operation (see Vacancy OPEN -> FILLED)"]
        note: "MANDATED rows never pass through a client-visible OFFERED state; a response call against them fails with ERR_OFFER_NOT_PENDING."

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /fire-ops/overtime-offers/{overtime_offer_id}/response with response = ACCEPT"
        actor: Firefighter
        preconditions: ["see Vacancy OFFERING -> FILLED preconditions"]
        side_effects: ["see Vacancy OFFERING -> FILLED side effects"]

      - from: OFFERED
        to: DECLINED
        trigger: "POST /fire-ops/overtime-offers/{overtime_offer_id}/response with response = DECLINE"
        actor: Firefighter
        preconditions: ["offer.status == OFFERED, else ERR_OFFER_NOT_PENDING", "X-User-ID == offer.firefighter_id, else ERR_NOT_RESOURCE_OWNER"]
        side_effects: ["see Vacancy OFFERING -> OPEN side effects"]

      - from: OFFERED
        to: EXPIRED
        trigger: "system (staffing-run Step 1: expires_at <= current clock)"
        actor: system
        preconditions: ["offer.status == OFFERED and expires_at <= current clock"]
        side_effects: ["see Vacancy OFFERING -> OPEN side effects; the pass is charged exactly as a decline"]

      - from: OFFERED
        to: RESCINDED
        trigger: "system (company closure, leave revoke, or duty-shift completion cancels the underlying vacancy)"
        actor: system
        preconditions: ["offer.status == OFFERED"]
        side_effects:
          - "Station.ot_committed_cents -= projected_cost_cents; Station.budget_posture recomputed"
          - "Firefighter.pending_offer_count -= 1; voluntary_ot_hours_charged and ot_pass_count are NOT charged (the department, not the member, withdrew)"

  - entity: WorkPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (duty-shift completion where period_end_date <= shift_date)"
        actor: system
        preconditions: ["period_end_date <= completing duty_shift.shift_date"]
        side_effects:
          - "flsa_premium_cents re-priced from the WORKED_BASIS variant (final_flsa_overtime_hours) instead of the SCHEDULED_BASIS variant"
          - "A successor WorkPeriod is created in status OPEN with period_start_date = this period_end_date + 1 day and period_end_date = period_start_date + FLSA_PERIOD_DAYS - 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-duty-shift
    parent_entity: DutyShift
    write_endpoint: "POST /fire-ops/shift-assignments"
    occ_field: "expected_duty_shift_version"
    description: |
      Creating a ShiftAssignment against a DutyShift whose version has advanced
      since the client last read it is rejected. The seat math the client based
      its request on (assigned_headcount, staffing_gap, certification coverage,
      seat capacity on the chosen company) is derived state that any other
      writer's assignment, relief, vacancy or closure has already moved; a
      request carrying a stale version is refused so the officer re-reads the
      shift before committing a body to a seat.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: company-closure-stale-duty-shift
    parent_entity: DutyShift
    write_endpoint: "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"
    occ_field: "expected_duty_shift_version"
    description: |
      A company closure computed against a stale DutyShift version is rejected.
      Closures legitimately supersede one another — a second closure on the same
      shift is a valid operation that picks the next company in closure order —
      so the operation cannot be guarded by a state precondition; the stale
      version check is what forces the officer to re-read required_staffing and
      staffing_posture before removing another company from service.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: availability-set-stale-firefighter
    parent_entity: Firefighter
    write_endpoint: "POST /fire-ops/firefighters/{firefighter_id}/availability"
    occ_field: "expected_firefighter_version"
    description: |
      Setting a member's employment_status or roster_standing against a stale
      Firefighter version is rejected. The endpoint is idempotent by product
      design (a member may be moved ACTIVE -> INJURY_LEAVE -> ACTIVE any number
      of times, and roster_standing may be reset repeatedly), so no state
      precondition rejects a repeat call; the stale version check is the only
      guard that stops an operator from overwriting an availability change made
      after their last read — including the cascaded PASSED standing an offer
      sweep just wrote.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: rotation_calendar
    description: |
      Derives which platoon is on duty and which Kelly-day slot is in force for a
      calendar date, on a four-platoon rotation with an eight-position Kelly cycle.
      Every shift-scheduling validation (platoon match, Kelly-day conflict) reads
      this function; it takes no entity state, only the date and the constants.
    trigger: "POST /fire-ops/duty-shifts (platoon check), POST /fire-ops/shift-assignments, POST /fire-ops/trade-requests/{trade_request_id}/countersign"
    inputs: [shift_date, ROTATION_EPOCH_DATE, PLATOON_ORDER, KELLY_CYCLE_LENGTH]
    algorithm: chronological
    formula: |
      elapsed = date_diff_days(shift_date, ROTATION_EPOCH_DATE)      # >= 0
      platoon_on_duty(shift_date) = PLATOON_ORDER[elapsed mod 4]
      kelly_slot(shift_date)      = ((elapsed div 4) mod KELLY_CYCLE_LENGTH) + 1
      # A member is on a Kelly day for shift_date iff
      #   platoon_on_duty(shift_date) == member.platoon
      #   AND member.kelly_day_cycle_position == kelly_slot(shift_date)
      is_kelly_day(member, shift_date) =
        (platoon_on_duty(shift_date) == member.platoon)
        and (member.kelly_day_cycle_position == kelly_slot(shift_date))
    constants:
      ROTATION_EPOCH_DATE: "2026-01-01"
      PLATOON_ORDER: ["A", "B", "C", "D"]
      KELLY_CYCLE_LENGTH: 8
    precision: "integer day arithmetic; no timezone conversion (dates are treated as UTC calendar dates)"
    worked_example: |
      2026-09-04: elapsed = 246 -> 246 mod 4 = 2 -> platoon C; (246 div 4) mod 8 = 61 mod 8 = 5 -> kelly_slot 6
      2026-09-05: elapsed = 247 -> 247 mod 4 = 3 -> platoon D; (247 div 4) mod 8 = 61 mod 8 = 5 -> kelly_slot 6
      2026-09-06: elapsed = 248 -> platoon A; (248 div 4) mod 8 = 62 mod 8 = 6 -> kelly_slot 7

  - name: required_staffing
    description: |
      Minimum bodies a shift must field, summed over the station's companies that
      are in service and not closed for that shift. Company closure is the only
      lever that lowers it.
    trigger: "duty-shift publish, staffing-run, company-closure, and any recomputation of staffing_posture"
    inputs: [Apparatus.minimum_crew_size, Apparatus.status, DutyShift.closed_apparatus_ids, Station.minimum_staffing_floor]
    algorithm: aggregation
    formula: |
      open_companies = [a for a in Apparatus
                          where a.station_id == shift.station_id
                            and a.status == 'IN_SERVICE'
                            and a.id not in shift.closed_apparatus_ids]
      required_staffing = sum(a.minimum_crew_size for a in open_companies)
    constants: {}
    precision: "integer headcount"
    worked_example: |
      Station 12 with ENGINE-12 (crew 4), TRUCK-12 (crew 4), HAZMAT-12 (crew 3)
      -> required_staffing = 11. After HAZMAT-12 is closed -> 8.

  - name: certification_coverage
    description: |
      Per-company multiset difference between the certifications an apparatus
      requires and the seat certifications actually filled on it, aggregated into
      DutyShift.certification_gap_count. Specialty staffing (paramedic, hazmat
      technician, technical rescue) is enforced per company, per shift.
    trigger: "duty-shift publish, staffing-run, company-closure, assignment create/cancel, leave approval/revoke, offer accept, trade approval"
    inputs: [Apparatus.required_certifications, ShiftAssignment.seat_certification, ShiftAssignment.status, DutyShift.closed_apparatus_ids]
    algorithm: aggregation
    formula: |
      for each open company a (see required_staffing.open_companies):
        needed_a = multiset(a.required_certifications)
        held_a   = multiset(asg.seat_certification
                            for asg in ShiftAssignment
                            where asg.duty_shift_id == shift.id
                              and asg.apparatus_id == a.id
                              and asg.status == 'SCHEDULED'
                              and asg.seat_certification != 'NONE')
        gap_a = size(needed_a - held_a)          # multiset difference, never negative
      certification_gap_count = sum(gap_a over open companies)
      # Assignments whose apparatus_id is a CLOSED company contribute to no
      # company's held multiset (their company is out of service) although they
      # still count in assigned_headcount.
    constants: {}
    precision: "integer count; multiset difference is per-value, so two required PARAMEDIC seats need two PARAMEDIC seat_certifications"

  - name: leave_floor_headcount
    description: |
      The staffing floor that leave adjudication must not breach. It is the larger
      of the station's contractual minimum and the shift's required staffing minus
      the negotiated slack, so a station with a high contractual floor cannot use
      company closures to grant more leave than the floor allows.
    trigger: "duty-shift publish, staffing-run, company-closure, leave-adjudication"
    inputs: [Station.minimum_staffing_floor, DutyShift.required_staffing, LEAVE_FLOOR_SLACK]
    algorithm: threshold
    formula: |
      leave_floor_headcount = max(station.minimum_staffing_floor,
                                  shift.required_staffing - LEAVE_FLOOR_SLACK)
    constants:
      LEAVE_FLOOR_SLACK: 2
    precision: "integer headcount"
    worked_example: |
      required_staffing 11, minimum_staffing_floor 8 -> max(8, 9) = 9
      required_staffing 8 (after a closure), minimum_staffing_floor 8 -> max(8, 6) = 8

  - name: staffing_posture
    description: |
      Three-valued posture of a shift. A certification gap is always CRITICAL
      regardless of headcount (a fully staffed engine without a paramedic cannot
      answer a medical call), which is why the certification test precedes the
      headcount test.
    trigger: "duty-shift publish, staffing-run, company-closure, and every assignment / leave / offer / trade side effect"
    inputs: [DutyShift.assigned_headcount, DutyShift.required_staffing, DutyShift.certification_gap_count, CLOSURE_TRIGGER_GAP]
    algorithm: threshold
    formula: |
      assigned_headcount = count(asg for asg in ShiftAssignment
                                 where asg.duty_shift_id == shift.id
                                   and asg.status == 'SCHEDULED')
      staffing_gap = max(0, required_staffing - assigned_headcount)
      if certification_gap_count > 0:            posture = 'CRITICAL'
      elif staffing_gap == 0:                    posture = 'FULLY_STAFFED'
      elif staffing_gap <= CLOSURE_TRIGGER_GAP:  posture = 'SHORT'
      else:                                      posture = 'CRITICAL'
    constants:
      CLOSURE_TRIGGER_GAP: 2
    precision: "integer comparisons; ordering of the four branches is normative"

  - name: vacancy_generation
    description: |
      At publish time the open seats of a shift are materialised as Vacancy rows in
      a deterministic order, and the specialty certifications still unmet are
      assigned to the earliest seats of the company that requires them.
    trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/publish"
    inputs: [Apparatus (open companies), ShiftAssignment (SCHEDULED), Apparatus.required_certifications, Apparatus.closure_priority]
    algorithm: waterfall_allocation
    formula: |
      companies = open_companies sorted by (closure_priority ASC, created_at ASC)
      for each company a in that order:
        filled_a  = count(SCHEDULED assignments on shift with apparatus_id == a.id)
        open_a    = max(0, a.minimum_crew_size - filled_a)
        unmet_a   = sorted(list(multiset(a.required_certifications) - held_a))   # value-ascending
        for seat_index in 1 .. open_a:            # 1-based within the company
          required_certification = unmet_a[seat_index - 1] if seat_index <= size(unmet_a) else 'NONE'
          create Vacancy(duty_shift_id, apparatus_id = a.id, seat_index,
                         driver = 'VACANT_POSITION', driver_source_id = a.id,
                         required_certification, status = 'OPEN')
      open_vacancy_count = count(vacancies on shift with status IN {OPEN, OFFERING})
    constants: {}
    precision: "integer seat indices; certification strings sorted lexicographically ascending so the emitted order is reproducible"
    worked_example: |
      HAZMAT-12 (crew 3, required [HAZMAT_TECH], closure_priority 20) with zero
      SCHEDULED assignments -> 3 vacancies: seat 1 = HAZMAT_TECH, seats 2 and 3 = NONE.

  - name: leave_adjudication_order
    description: |
      Batch adjudication of every QUEUED LeaveRequest on a shift. Requests are
      ordered by leave-type priority, then by seniority (most senior first), then
      by creation time. Non-discretionary types are granted regardless of the floor;
      discretionary types are granted only while the projected headcount stays at or
      above leave_floor_headcount, and each grant lowers the headcount the next
      request sees.
    trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication"
    inputs: [LeaveRequest (status QUEUED), Firefighter.seniority_rank, LeaveRequest.leave_type, DutyShift.assigned_headcount, DutyShift.leave_floor_headcount]
    algorithm: chronological
    formula: |
      LEAVE_TYPE_PRIORITY = {INJURY: 1, SICK: 2, KELLY_DAY: 3, BEREAVEMENT: 4, VACATION: 5}
      queue = QUEUED requests on this shift
              sorted by (LEAVE_TYPE_PRIORITY[leave_type] ASC,
                         firefighter.seniority_rank ASC,      # 1 == most senior
                         created_at ASC)
      running = shift.assigned_headcount
      index = 0
      for req in queue:
        index += 1
        req.decision_order_index = index
        relieves = 1 if the member holds a SCHEDULED assignment on this shift else 0
        if req.leave_type in NON_DISCRETIONARY:
            approve(req); running -= relieves
        elif running - relieves >= shift.leave_floor_headcount:
            approve(req); running -= relieves
        else:
            deny(req, denial_reason = 'STAFFING_FLOOR')
      # denials do not consume headcount, so a junior member's leave can still be
      # granted after a senior member's was denied only if the junior request is a
      # non-discretionary type; equal-priority juniors face the same floor.
    constants:
      NON_DISCRETIONARY: ["INJURY", "SICK"]
      LEAVE_TYPE_PRIORITY: { INJURY: 1, SICK: 2, KELLY_DAY: 3, BEREAVEMENT: 4, VACATION: 5 }
    precision: "integer headcount; the running counter is normative — the batch is sequential, not evaluated against the pre-batch headcount"

  - name: hiring_order_selector
    description: |
      Picks exactly one firefighter to receive an overtime offer for a vacancy. Each
      hiring mode has its own eligibility filter, its own ranking expression and its
      own roster; the labor agreement inverts the seniority tie-break for mandatory
      holdover (the least senior member is held over) relative to voluntary hiring.
    trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer"
    inputs: [hiring_mode, Vacancy.required_certification, Firefighter (station cohort), HiringRoster, DutyShift.shift_date]
    algorithm: constraint_propagation
    formula: |
      # ---- roster resolution (certification-scoped roster wins over the general one)
      wanted_type = ROSTER_TYPE_FOR_MODE[hiring_mode]
      roster = the HiringRoster with station_id == shift.station_id
                 and roster_type == wanted_type
                 and certification_scope == vacancy.required_certification
      if roster is null:
        roster = the HiringRoster with station_id == shift.station_id
                   and roster_type == wanted_type
                   and certification_scope == 'NONE'
      if roster is null: raise ERR_ROSTER_NOT_CONFIGURED

      # ---- eligibility filter (common clauses)
      base = [f for f in Firefighter
                where f.station_id == shift.station_id
                  and f.employment_status == 'ACTIVE'
                  and (vacancy.required_certification == 'NONE'
                       or vacancy.required_certification in f.certifications)
                  and f has no SCHEDULED ShiftAssignment on shift.id
                  and f has no APPROVED LeaveRequest on shift.id
                  and f.pending_offer_count == 0
                  and (work_period_of(f, shift.shift_date).adjusted_scheduled_hours
                       + effective_offer_hours) <= FLSA_MAX_PERIOD_HOURS]

      # ---- mode-specific filter + ranking
      if hiring_mode == 'VOLUNTARY':
        pool = [f for f in base where f.roster_standing == 'AVAILABLE'
                                  and not is_kelly_day(f, shift.shift_date)]
        rank = (f.voluntary_ot_hours_charged ASC, f.seniority_rank ASC, f.created_at ASC)
      elif hiring_mode == 'CALLBACK':
        pool = [f for f in base where f.roster_standing == 'AVAILABLE'
                                  and platoon_on_duty(shift.shift_date) != f.platoon]
        rank = (f.callback_count ASC, f.seniority_rank ASC, f.created_at ASC)
      elif hiring_mode == 'MANDATORY_HOLDOVER':
        pool = [f for f in base where f.roster_standing != 'UNAVAILABLE'
                                  and f.platoon == platoon_on_duty(shift.shift_date - 1 day)]
        rank = (f.mandatory_holdover_count ASC, f.seniority_rank DESC, f.created_at ASC)

      if pool is empty: raise ERR_NO_ELIGIBLE_CANDIDATE       # empty-pool fallback
      selected = first element of pool sorted by rank
    constants:
      FLSA_MAX_PERIOD_HOURS: 288
      ROSTER_TYPE_FOR_MODE: { VOLUNTARY: VOLUNTARY_OT, MANDATORY_HOLDOVER: MANDATORY_HOLDOVER, CALLBACK: CALLBACK }
    precision: "total ordering; created_at ASC is the final tie-break in every mode and id is never consulted"
    variants:
      - name: VOLUNTARY
        when: "hiring_mode == VOLUNTARY"
        difference: "PASSED standing excluded, Kelly-day members excluded, ranked by hours charged then most senior first"
      - name: CALLBACK
        when: "hiring_mode == CALLBACK"
        difference: "only off-duty platoons are eligible, ranked by callback count then most senior first"
      - name: MANDATORY_HOLDOVER
        when: "hiring_mode == MANDATORY_HOLDOVER"
        difference: "candidates are the outgoing platoon only, PASSED standing is still eligible, seniority tie-break is inverted (least senior held over)"

  - name: continuous_duty_hours
    description: |
      Merges a member's duty intervals around a candidate shift into maximal
      continuous blocks, to price the fatigue premium and to enforce the rest-period
      ceiling. Intervals are half-open [start, end); back-to-back blocks with a zero
      gap merge into one continuous tour, adjacent-with-gap blocks do not.
    trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer (pricing), POST /fire-ops/shift-assignments, POST /fire-ops/overtime-offers/{overtime_offer_id}/response"
    inputs: [ShiftAssignment (SCHEDULED) of the member, DutyShift.shift_date, SHIFT_START_HOUR, SHIFT_HOURS, prospective offer hours]
    algorithm: interval_merge
    formula: |
      # every SCHEDULED seat of the member becomes the half-open interval
      #   start = shift_date at SHIFT_START_HOUR
      #   end   = start + asg.scheduled_hours
      intervals = sorted(seat intervals of the member + the prospective interval, by start ASC)
      merged = []
      for iv in intervals:
        if merged is empty or iv.start > merged.last.end:   # strict: gap == 0 merges
            merged.append(iv)
        else:
            merged.last.end = max(merged.last.end, iv.end)
      continuous_duty_hours = duration_hours(the merged block containing the prospective interval)
      fatigue_applies = continuous_duty_hours > CONTINUOUS_DUTY_FATIGUE_HOURS
      if continuous_duty_hours > CONTINUOUS_DUTY_MAX_HOURS: raise ERR_REST_PERIOD_VIOLATION
    constants:
      SHIFT_START_HOUR: 8
      SHIFT_HOURS: 24
      CONTINUOUS_DUTY_FATIGUE_HOURS: 24
      CONTINUOUS_DUTY_MAX_HOURS: 48
    precision: "hours as integers; half-open intervals so a seat ending 2026-09-05T08:00:00Z and one starting 2026-09-05T08:00:00Z are one continuous 48-hour tour, not an overlap"
    worked_example: |
      A 24-hour seat on 2026-09-04 plus a 24-hour seat on 2026-09-05 merge to a
      48-hour block: fatigue applies (48 > 24) and the ceiling is met exactly
      (48 is not > 48), so the hire is priced with the fatigue premium and allowed.
      Adding a third consecutive 24-hour seat yields 72 -> ERR_REST_PERIOD_VIOLATION.

  - name: overtime_offer_cost
    description: |
      Prices one overtime offer. Three independent multiplicative factors compose in
      a fixed order: the certification premium and the fatigue premium are summed
      into a single percentage uplift applied to the base rate and rounded to whole
      cents FIRST, and only the rounded effective rate is multiplied by the
      guaranteed hours and the mode multiplier.
    trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer"
    inputs: [Firefighter.hourly_rate_cents, Vacancy.required_certification, hiring_mode, offer_hours, continuous_duty_hours]
    algorithm: tiered_pricing
    formula: |
      cert_pct     = CERT_PREMIUM_PCT[vacancy.required_certification]
      fatigue_pct  = FATIGUE_PREMIUM_PCT if fatigue_applies else 0
      effective_rate_cents = round_half_up(hourly_rate_cents * (100 + cert_pct + fatigue_pct) / 100)
      effective_hours      = max(offer_hours, MODE_MIN_HOURS[hiring_mode])
      projected_cost_cents = round_half_up(effective_rate_cents
                                           * effective_hours
                                           * OT_MULTIPLIER[hiring_mode])
      # The two roundings are ordered and NOT interchangeable: rounding only at the
      # end (rate * hours * multiplier * uplift) yields a different integer.
    constants:
      CERT_PREMIUM_PCT: { NONE: 0, PARAMEDIC: 12, HAZMAT_TECH: 8, TECHNICAL_RESCUE: 8 }
      FATIGUE_PREMIUM_PCT: 10
      MODE_MIN_HOURS: { VOLUNTARY: 0, MANDATORY_HOLDOVER: 2, CALLBACK: 3 }
      OT_MULTIPLIER: { VOLUNTARY: 1.5, MANDATORY_HOLDOVER: 1.5, CALLBACK: 2.0 }
    precision: "whole cents, round_half_up, applied twice in the stated order"
    worked_example: |
      hourly_rate_cents 4237, PARAMEDIC seat, no fatigue, VOLUNTARY, offer_hours 24:
        effective_rate = round_half_up(4237 * 1.12) = round_half_up(4745.44) = 4745
        projected_cost = round_half_up(4745 * 24 * 1.5) = 170820
        (rounding once at the end would give round_half_up(170835.84) = 170836)
      Same member, HAZMAT_TECH seat, 48-hour merged tour (fatigue applies), VOLUNTARY, 24 h:
        effective_rate = round_half_up(4237 * 1.18) = round_half_up(4999.66) = 5000
        projected_cost = round_half_up(5000 * 24 * 1.5) = 180000
      Same member, NONE seat, CALLBACK, offer_hours 2:
        effective_hours = max(2, 3) = 3
        projected_cost = round_half_up(4237 * 3 * 2.0) = 25422

  - name: ot_committed_ledger
    description: |
      Station.ot_committed_cents is the encumbrance ledger: money promised but not
      yet paid. Every path that promises overtime debits it and every path that
      withdraws the promise credits it back by exactly the same amount, so the
      ledger always equals the recomputed sum below.
    trigger: "offer create, offer accept/decline/expire/rescind, mandatory holdover, assignment cancel, trade approval, duty-shift complete, company closure"
    inputs: [OvertimeOffer.projected_cost_cents, OvertimeOffer.status, ShiftAssignment.projected_premium_cents, ShiftAssignment.status]
    algorithm: aggregation
    formula: |
      ot_committed_cents =
          sum(o.projected_cost_cents for o in OvertimeOffer
              where o.vacancy.duty_shift.station_id == station.id
                and o.status == 'OFFERED')
        + sum(a.projected_premium_cents for a in ShiftAssignment
              where a.duty_shift.station_id == station.id
                and a.status == 'SCHEDULED'
                and a.assignment_type in {'OVERTIME', 'HOLDOVER', 'CALLBACK'})
      # Invariant: at every observable point the stored field equals this expression.
      # Acceptance moves an amount from the first term to the second without changing
      # the total; completion moves it out of committed and into ot_actual_cents.
    constants: {}
    precision: "whole cents; no rounding occurs here, only integer addition of already-rounded amounts"

  - name: budget_gate_evaluation_order
    description: |
      The fiscal gate on voluntary and callback hiring. The three steps must run in
      this order because the gate compares a quantity that only step 1 can produce,
      and the posture recomputation in step 3 must see the committed amount that
      step 2 wrote. Mandatory holdover skips the gate entirely.
    trigger: "POST /fire-ops/vacancies/{vacancy_id}/offer"
    inputs: [projected_cost_cents, Station.ot_actual_cents, Station.ot_committed_cents, Station.fiscal_ot_budget_cents, hiring_mode]
    algorithm: threshold
    formula: |
      # STEP 1 - price the offer (requires the selected candidate, so the selector
      #          must already have run)
      cost = overtime_offer_cost(selected_candidate, vacancy, hiring_mode, offer_hours)
      # STEP 2 - gate, unless the labor agreement compels the hire
      prospective = station.ot_actual_cents + station.ot_committed_cents + cost
      if hiring_mode != 'MANDATORY_HOLDOVER' and prospective > station.fiscal_ot_budget_cents:
          raise ERR_OT_BUDGET_WOULD_EXCEED         # nothing is written
      # STEP 3 - commit, then re-derive posture from the new committed total
      station.ot_committed_cents += cost
      station.budget_posture = station_budget_posture(station)
      # A MANDATORY_HOLDOVER hire therefore can and does drive budget_posture to OVER.
    constants: {}
    precision: "whole cents; the comparison is strictly greater-than, so a hire landing exactly on the budget is allowed"

  - name: station_budget_posture
    description: "Three-band posture of a station's overtime budget consumption, from committed plus actual spend."
    trigger: "every mutation of ot_committed_cents or ot_actual_cents; GET /fire-ops/stations/{station_id}"
    inputs: [Station.ot_actual_cents, Station.ot_committed_cents, Station.fiscal_ot_budget_cents]
    algorithm: threshold
    formula: |
      consumed = ot_actual_cents + ot_committed_cents
      pct_bp   = round_half_up(consumed * 10000 / fiscal_ot_budget_cents)   # basis points
      if pct_bp <= WITHIN_BAND_BP:      budget_posture = 'WITHIN'
      elif pct_bp <= WATCH_BAND_BP:     budget_posture = 'WATCH'
      else:                             budget_posture = 'OVER'
    constants:
      WITHIN_BAND_BP: 9000
      WATCH_BAND_BP: 10000
    precision: "basis points, round_half_up; consumption of exactly 90.00% is WITHIN and exactly 100.00% is WATCH"

  - name: work_period_hour_ledger
    description: |
      WorkPeriod.scheduled_hours is a conserved quantity over the seat lifecycle:
      every operation that puts a member in a seat adds the seat's scheduled_hours
      and every operation that takes the member out of it subtracts exactly the same
      number, so an approve-then-revoke or hire-then-cancel round trip returns the
      field to its starting value with no drift.
    trigger: "assignment create/cancel, leave approve/revoke, offer accept, mandatory holdover, trade approve, duty-shift complete"
    inputs: [ShiftAssignment.scheduled_hours, ShiftAssignment.status, WorkPeriod.period_start_date, WorkPeriod.period_end_date]
    algorithm: aggregation
    formula: |
      covering_period(f, d) = the WorkPeriod with firefighter_id == f
                              and period_start_date <= d <= period_end_date
      scheduled_hours(period) = sum(a.scheduled_hours for a in ShiftAssignment
                                    where a.firefighter_id == period.firefighter_id
                                      and a.status in {'SCHEDULED', 'WORKED'}
                                      and period.period_start_date <= a.duty_shift.shift_date
                                                                   <= period.period_end_date)
      worked_hours(period)    = same sum restricted to status == 'WORKED', using actual_hours
      leave_hours(period)     = sum(l.requested_hours for APPROVED LeaveRequest in the window)
      # Invariant: the stored fields equal these expressions after every mutation.
    constants: {}
    precision: "integer hours"

  - name: flsa_work_period_overtime
    description: |
      FLSA section 7(k) overtime for fire-protection employees: hours above the
      threshold inside a 27-day work period earn the half-time premium. The same
      period is priced from two different hour bases depending on whether it is still
      open (scheduled hours, a forward-looking projection) or closed (hours actually
      worked, the payable figure).
    trigger: "assignment create/cancel, leave approve/revoke, offer accept, trade approve, hour-adjustment, duty-shift complete (period close)"
    inputs: [WorkPeriod.scheduled_hours, WorkPeriod.worked_hours, hour adjustments, Firefighter.hourly_rate_cents, WorkPeriod.status]
    algorithm: threshold
    formula: |
      adjusted_scheduled_hours = scheduled_hours + sum(adj.adjustment_hours
                                                       where adj.adjustment_basis == 'SCHEDULED')
      adjusted_worked_hours    = worked_hours    + sum(adj.adjustment_hours
                                                       where adj.adjustment_basis == 'WORKED')
      projected_flsa_overtime_hours = max(0, adjusted_scheduled_hours - FLSA_THRESHOLD_HOURS)
      final_flsa_overtime_hours     = max(0, adjusted_worked_hours    - FLSA_THRESHOLD_HOURS)
      basis_hours = projected_flsa_overtime_hours if status == 'OPEN'
                    else final_flsa_overtime_hours
      flsa_premium_cents = round_half_up(basis_hours * hourly_rate_cents * FLSA_PREMIUM_RATE)
      # Cap: any operation that would push adjusted_scheduled_hours above
      # FLSA_MAX_PERIOD_HOURS is rejected with ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED.
    constants:
      FLSA_PERIOD_DAYS: 27
      FLSA_THRESHOLD_HOURS: 204
      FLSA_MAX_PERIOD_HOURS: 288
      FLSA_PREMIUM_RATE: 0.5
    precision: "integer hours; premium in whole cents, round_half_up"
    variants:
      - name: SCHEDULED_BASIS
        when: "WorkPeriod.status == OPEN"
        difference: "prices adjusted_scheduled_hours — includes seats that are only SCHEDULED and excludes nothing for leave, so it is an upper-bound projection used for forecasting and for the cap check"
      - name: WORKED_BASIS
        when: "WorkPeriod.status == CLOSED"
        difference: "prices adjusted_worked_hours — relieved, cancelled and leave-covered seats drop out, so the payable figure is at or below the projection; the delta is written to flsa_premium_cents at close"
    worked_example: |
      adjusted_scheduled_hours 204 -> projected 0 hours, premium 0 (threshold is not exceeded)
      adjusted_scheduled_hours 228, hourly_rate_cents 4237
        -> projected 24 h, premium = round_half_up(24 * 4237 * 0.5) = 50844
      the same period closed with adjusted_worked_hours 204
        -> final 0 h, premium re-priced to 0 (delta -50844)

  - name: station_overtime_forecast
    description: |
      Forecasts the station's remaining overtime spend for the fiscal period. The
      vacancy-driven method builds the number bottom-up from the open seats and the
      injury-leave headcount; the run-rate method extrapolates realised spend
      forward. The two methods read disjoint inputs and are expected to disagree.
    trigger: "GET /fire-ops/stations/{station_id}/overtime-forecast"
    inputs: [Vacancy (OPEN/OFFERING), Firefighter.hourly_rate_cents, Firefighter.employment_status, Station.ot_actual_cents, Station.ot_committed_cents, Station.fiscal_period_start_date, Station.fiscal_period_end_date, current clock]
    algorithm: forward_looking
    formula: |
      pool = [f for f in Firefighter where f.station_id == station.id
                                      and f.employment_status != 'SEPARATED']
      if pool is empty: avg_rate_cents = 0
      else: avg_rate_cents = round_half_up(sum(f.hourly_rate_cents for f in pool) / size(pool))
      shift_base_cents = round_half_up(avg_rate_cents * SHIFT_HOURS * OT_MULTIPLIER_VOLUNTARY)

      # ---- VACANCY_DRIVEN (default)
      horizon = [v for v in Vacancy
                   where v.duty_shift.station_id == station.id
                     and v.status in {'OPEN', 'OFFERING'}
                     and v.duty_shift.shift_date >= current_date
                     and v.duty_shift.shift_date <= station.fiscal_period_end_date]
      vacancy_driver_cents = sum( round_half_up(shift_base_cents
                                   * (100 + CERT_PREMIUM_PCT[v.required_certification]) / 100)
                                 for v in horizon )                 # round per vacancy, then add
      injury_headcount = count(f in pool where f.employment_status == 'INJURY_LEAVE')
      injury_driver_cents = injury_headcount * INJURY_SHIFTS_PER_PERIOD * shift_base_cents
      forecast_cents = vacancy_driver_cents + injury_driver_cents

      # ---- RUN_RATE
      elapsed_days   = date_diff_days(current_date, station.fiscal_period_start_date) + 1
      remaining_days = max(0, date_diff_days(station.fiscal_period_end_date, current_date))
      daily_run_rate_cents = round_half_up(station.ot_actual_cents / elapsed_days)
      forecast_cents = daily_run_rate_cents * remaining_days

      # ---- shared tail
      projected_period_total_cents = station.ot_actual_cents + station.ot_committed_cents + forecast_cents
      variance_cents = station.fiscal_ot_budget_cents - projected_period_total_cents
      forecast_posture = 'WITHIN' if variance_cents >= 0 else 'OVER'
    constants:
      SHIFT_HOURS: 24
      OT_MULTIPLIER_VOLUNTARY: 1.5
      INJURY_SHIFTS_PER_PERIOD: 9
      CERT_PREMIUM_PCT: { NONE: 0, PARAMEDIC: 12, HAZMAT_TECH: 8, TECHNICAL_RESCUE: 8 }
    precision: "whole cents, round_half_up; the per-vacancy uplift is rounded before summation, never after"
    variants:
      - name: VACANCY_DRIVEN
        when: "method omitted or method == VACANCY_DRIVEN"
        difference: "bottom-up from open/offering vacancies in the remaining horizon plus an injury-leave allowance; ignores realised spend and the calendar entirely"
      - name: RUN_RATE
        when: "method == RUN_RATE"
        difference: "top-down from ot_actual_cents divided by elapsed fiscal days multiplied by remaining days; ignores vacancies, certifications and injury leave entirely"
    worked_example: |
      pool rates 4237, 3916, 4602 -> avg = round_half_up(12755/3) = round_half_up(4251.667) = 4252
      shift_base = round_half_up(4252 * 24 * 1.5) = 153072
      horizon vacancies PARAMEDIC, TECHNICAL_RESCUE, NONE:
        171441 + 165318 + 153072 = 489831
        (summing first and uplifting once would give round_half_up(153072*3.20) = 489830)
      zero members on INJURY_LEAVE -> injury_driver 0 -> forecast_cents 489831

  - name: academy_hiring_signal
    description: |
      Converts staffing pressure into a recruit-class recommendation. Chronic open
      seats and members out on injury leave both signal a body shortage; the raw
      need is converted to bodies by the four-platoon coverage factor (one position
      must be covered on every platoon).
    trigger: "GET /fire-ops/stations/{station_id}/academy-hiring-signal"
    inputs: [Vacancy (OPEN/OFFERING), Firefighter.employment_status, PLATOON_COVERAGE_FACTOR]
    algorithm: threshold
    formula: |
      open_vacancy_seats = count(v in Vacancy where v.duty_shift.station_id == station.id
                                               and v.status in {'OPEN', 'OFFERING'})
      injury_headcount   = count(f in Firefighter where f.station_id == station.id
                                                   and f.employment_status == 'INJURY_LEAVE')
      raw_need = open_vacancy_seats + injury_headcount * INJURY_BODY_WEIGHT
      recommended_recruit_count = ceil(raw_need / PLATOON_COVERAGE_FACTOR)
      if recommended_recruit_count == 0:                signal_tier = 'NONE'
      elif recommended_recruit_count <= MONITOR_MAX:    signal_tier = 'MONITOR'
      elif recommended_recruit_count <= RECRUIT_MAX:    signal_tier = 'RECRUIT'
      else:                                             signal_tier = 'SURGE'
    constants:
      PLATOON_COVERAGE_FACTOR: 4
      INJURY_BODY_WEIGHT: 2
      MONITOR_MAX: 8
      RECRUIT_MAX: 20
    precision: "integer; ceiling division, so raw_need 1 already recommends 1 recruit"
    worked_example: |
      11 open seats, 1 member on injury leave -> raw_need = 11 + 2 = 13
      -> recommended_recruit_count = ceil(13/4) = 4 -> signal_tier MONITOR
      zero open seats and zero injury leave -> raw_need 0 -> 0 recruits -> signal_tier NONE

  - name: company_closure_selector
    description: |
      Picks the single company to take out of service when a shift cannot be staffed.
      Closure order is contractual: the highest closure_priority number closes first,
      exempt companies never close, and a company already closed on this shift is not
      a candidate.
    trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"
    inputs: [Apparatus.closure_priority, Apparatus.closure_exempt, Apparatus.status, DutyShift.closed_apparatus_ids]
    algorithm: constraint_propagation
    formula: |
      pool = [a for a in Apparatus
                where a.station_id == shift.station_id
                  and a.status == 'IN_SERVICE'
                  and a.closure_exempt == false
                  and a.id not in shift.closed_apparatus_ids]
      if pool is empty: raise ERR_NO_CLOSURE_ELIGIBLE_COMPANY      # empty-pool fallback
      selected = first of pool sorted by (closure_priority DESC, minimum_crew_size DESC, created_at ASC)
    constants: {}
    precision: "total ordering; id is never consulted"
    worked_example: |
      ENGINE-12 (priority 10, exempt), TRUCK-12 (priority 30), HAZMAT-12 (priority 20)
      -> first closure selects TRUCK-12, a second closure selects HAZMAT-12, a third
      raises ERR_NO_CLOSURE_ELIGIBLE_COMPANY because ENGINE-12 is exempt.

  - name: offer_expiry_sweep
    description: |
      Step 1 of the staffing-run checkpoint. Offers whose response window has elapsed
      are expired, and — per the labor agreement — an unanswered offer is charged to
      the member exactly as if it had been declined, which is what makes repeated
      non-response push a member off the voluntary roster.
    trigger: "POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run"
    inputs: [OvertimeOffer.status, OvertimeOffer.expires_at, current clock, Firefighter.ot_pass_count]
    algorithm: chronological
    formula: |
      due = [o for o in OvertimeOffer on this shift
               where o.status == 'OFFERED' and o.expires_at <= current_clock]
            sorted by (expires_at ASC, created_at ASC)
      for o in due:
        o.status = 'EXPIRED'
        o.vacancy.status = 'OPEN'
        o.firefighter.voluntary_ot_hours_charged += o.offer_hours
        o.firefighter.ot_pass_count += 1
        o.firefighter.pending_offer_count -= 1
        if o.firefighter.ot_pass_count >= OT_PASS_LIMIT:
            o.firefighter.roster_standing = 'PASSED'
        station.ot_committed_cents -= o.projected_cost_cents
      station.budget_posture = station_budget_posture(station)
    constants:
      OFFER_RESPONSE_WINDOW_MINUTES: 120
      OT_PASS_LIMIT: 3
    precision: "expiry comparison is inclusive (expires_at <= now expires); integer counters"

  - name: apparatus_seat_capacity
    description: |
      Ceiling on bodies riding one company for one shift. A single extra rider above
      the minimum crew is permitted for training or transition; beyond that the seat
      request is rejected. The check is aggregate — each individual assignment is
      valid, only the collective exceeds the limit.
    trigger: "POST /fire-ops/shift-assignments, POST /fire-ops/overtime-offers/{overtime_offer_id}/response, POST /fire-ops/vacancies/{vacancy_id}/offer with MANDATORY_HOLDOVER"
    inputs: [Apparatus.minimum_crew_size, ShiftAssignment (SCHEDULED on that apparatus), MAX_OVERSTAFF_SEATS]
    algorithm: aggregation
    formula: |
      seat_capacity = apparatus.minimum_crew_size + MAX_OVERSTAFF_SEATS
      riding = count(asg for asg in ShiftAssignment
                     where asg.duty_shift_id == shift.id
                       and asg.apparatus_id == apparatus.id
                       and asg.status == 'SCHEDULED')
      if riding + 1 > seat_capacity: raise ERR_APPARATUS_SEAT_CAPACITY_EXCEEDED
    constants:
      MAX_OVERSTAFF_SEATS: 1
    precision: "integer count; a company with minimum_crew_size 4 accepts a 5th rider and rejects the 6th"

# =============================================================================
# §1.4 Validation Rules  (strict priority order; the FIRST violated rule wins
# and no side effect of any later rule is applied)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Runs before every other check, including path existence: a missing header on a request to a non-existent duty shift returns 401, not 404."

  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's authorized_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role gate. Precedes existence, so a Firefighter calling company-closure on a non-existent shift returns 403, not 404."

  - priority: 3
    category: validation
    check: "Request body parses, every required field is present and non-null, every field has the declared type, enums are members of their declared set, integers are within their declared bounds, dates are ISO-8601 calendar dates and datetimes are ISO-8601 UTC instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
    description: "Shape before existence: a body carrying an unparseable duty_shift_id and an invalid enum returns ERR_INVALID_REQUEST."

  - priority: 4
    category: existence
    check: "Every path parameter resolves, left to right; then every foreign key in the body resolves, in the field order declared in the endpoint's request_body"
    error_id: "ERR_STATION_NOT_FOUND | ERR_FIREFIGHTER_NOT_FOUND | ERR_DUTY_SHIFT_NOT_FOUND | ERR_VACANCY_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_LEAVE_REQUEST_NOT_FOUND | ERR_TRADE_REQUEST_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: all
    description: "Deterministic resolution order: path parameters first (left to right), then body foreign keys in declared order, so a request with two unresolvable references always reports the earlier one."

  - priority: 5
    category: authz
    check: "For member-scoped actions the caller's X-User-ID equals the owning Firefighter id — the leave request's firefighter_id, the offer's firefighter_id, the trade's requesting_firefighter_id (create) or counterparty_firefighter_id (countersign)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /fire-ops/leave-requests", "POST /fire-ops/leave-requests/{leave_request_id}/revoke", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]
    description: "Runs after existence so an owner check never leaks the existence of a resource the caller cannot see."

  - priority: 6
    category: authz
    check: "The deciding officer is neither party to the trade: X-User-ID not in {requesting_firefighter_id, counterparty_firefighter_id}"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /fire-ops/trade-requests/{trade_request_id}/decision"]
    description: "A company officer who is a party to a trade cannot decide it, even in the COUNTERSIGNED state and with a valid role header."

  - priority: 7
    category: concurrency
    check: "expected_<parent>_version equals the current parent version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure", "POST /fire-ops/firefighters/{firefighter_id}/availability"]
    description: "Precedes every state and business check, so a stale version on an already-COMPLETED shift returns 412, not 409."

  - priority: 8
    category: state
    check: "The target entity is in a state from which the requested transition exists (see §1.2)"
    error_id: "ERR_SHIFT_NOT_DRAFT | ERR_SHIFT_NOT_HIRING | ERR_SHIFT_NOT_ELAPSED | ERR_VACANCY_NOT_OFFERABLE | ERR_OFFER_NOT_PENDING | ERR_LEAVE_NOT_REVOCABLE | ERR_TRADE_STATE_INVALID | ERR_ASSIGNMENT_NOT_SCHEDULED"
    http_status: 409
    applies_to: "all transition endpoints"
    description: "One code per machine so the client can tell which entity blocked the call. ERR_SHIFT_NOT_ELAPSED is the completion-window check and is also a 409."

  - priority: 9
    category: business_referential
    check: "Cross-entity coherence of the references that resolved at priority 4: the firefighter, apparatus and duty shift all belong to the same station; the member holds the certification the seat requires; a leave request being revoked has not already been backfilled by a FILLED vacancy; a hiring roster exists for the requested mode and certification scope"
    error_id: "ERR_STATION_SCOPE_MISMATCH | ERR_CERTIFICATION_NOT_HELD | ERR_LEAVE_ALREADY_BACKFILLED | ERR_ROSTER_NOT_CONFIGURED"
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/leave-requests", "POST /fire-ops/leave-requests/{leave_request_id}/revoke", "POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign", "POST /fire-ops/vacancies/{vacancy_id}/offer", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response"]
    description: "References exist but do not fit together. Strictly above the temporal rules, so a cross-station member assigned on the wrong platoon returns ERR_STATION_SCOPE_MISMATCH."

  - priority: 10
    category: business_temporal
    check: "The seat is compatible with the rotation calendar: the member's platoon is the platoon on duty for the shift date (REGULAR and KELLY_RELIEF assignments only), and the member is not on a Kelly day for that date (any assignment type other than KELLY_RELIEF and CALLBACK)"
    error_id: "ERR_PLATOON_ROTATION_VIOLATION | ERR_KELLY_DAY_CONFLICT"
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]
    description: "Rotation arithmetic from calculations.rotation_calendar. Platoon is checked before Kelly day, so a member of the wrong platoon who is also on a Kelly day returns ERR_PLATOON_ROTATION_VIOLATION."

  - priority: 11
    category: business_temporal
    check: "The member has no other SCHEDULED assignment whose half-open duty interval overlaps this seat's interval"
    error_id: ERR_DOUBLE_BOOKED_SHIFT
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]
    description: "Pairwise interval overlap on one member. Half-open semantics: a seat ending at 08:00 and a seat starting at 08:00 do not overlap and are both allowed."

  - priority: 12
    category: business_safety
    check: "The merged continuous duty block containing the new seat does not exceed CONTINUOUS_DUTY_MAX_HOURS (see calculations.continuous_duty_hours)"
    error_id: ERR_REST_PERIOD_VIOLATION
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/vacancies/{vacancy_id}/offer"]
    description: "Runs after the overlap check because merging is only meaningful once the intervals are known not to overlap; 48 continuous hours is permitted, 72 is not."

  - priority: 13
    category: business_temporal
    check: "The trade is countersigned at least TRADE_LEAD_TIME_HOURS before the shift begins (shift_date at SHIFT_START_HOUR)"
    error_id: ERR_TRADE_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]
    description: "Lead-time gate on trades, measured against the logical clock. TRADE_LEAD_TIME_HOURS = 48; exactly 48 hours out is inside the window."

  - priority: 14
    category: business_safety
    check: "Approving discretionary leave leaves assigned_headcount at or above DutyShift.leave_floor_headcount, evaluated against the running headcount inside the adjudication batch"
    error_id: ERR_STAFFING_FLOOR_BREACH
    http_status: 422
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication", "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"]
    description: "In batch adjudication the floor breach is recorded per request as status DENIED with denial_reason STAFFING_FLOOR (the call itself succeeds); the error is raised only by the single-seat path, assignment cancellation, which would drop a FULLY_STAFFED shift below the floor."

  - priority: 15
    category: business_safety
    check: "The company has a free seat: riding count + 1 <= minimum_crew_size + MAX_OVERSTAFF_SEATS"
    error_id: ERR_APPARATUS_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/vacancies/{vacancy_id}/offer"]
    description: "Aggregate constraint: every individual seat request is valid on its own and only the collective breaches the ceiling."

  - priority: 16
    category: business_safety
    check: "adjusted_scheduled_hours of the covering work period plus the new seat's hours does not exceed FLSA_MAX_PERIOD_HOURS"
    error_id: ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests/{trade_request_id}/countersign", "POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"]
    description: "Labour ceiling inside the 27-day 7(k) work period. 288 hours exactly is allowed; 289 is refused."

  - priority: 17
    category: business_safety
    check: "The selector that the operation depends on returned a candidate: hiring_order_selector for offers, company_closure_selector for closures, and the closure is justified by a CRITICAL posture"
    error_id: "ERR_NO_ELIGIBLE_CANDIDATE | ERR_NO_CLOSURE_ELIGIBLE_COMPANY | ERR_CLOSURE_NOT_JUSTIFIED"
    http_status: 422
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer", "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"]
    description: "Empty-pool fallbacks. ERR_CLOSURE_NOT_JUSTIFIED is evaluated before the pool is built: a SHORT shift cannot close a company even when an eligible company exists."

  - priority: 18
    category: business_fiscal
    check: "ot_actual_cents + ot_committed_cents + projected_cost_cents <= Station.fiscal_ot_budget_cents, unless hiring_mode == MANDATORY_HOLDOVER"
    error_id: ERR_OT_BUDGET_WOULD_EXCEED
    http_status: 422
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer"]
    description: "Last gate of all, because it needs the priced offer and therefore the selected candidate: every safety and eligibility rule must already have passed before money is checked. Mandatory holdover bypasses it entirely."

# =============================================================================
# §1.5 API Endpoint Table
#
# Every list endpoint accepts `limit?` (default 10, min 1, max 100) and
# `offset?` (default 0) and returns the pagination fields declared in §1.0.
# Every list endpoint has a declared default ordering so that list-indexed
# reads are reproducible.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Sets the logical current UTC instant used by every temporal rule (offer
      expiry, trade lead time, shift elapsed check, forecast horizon, work-period
      windows). When this endpoint is never called the logical clock reads
      2026-08-01T00:00:00Z, which is the mandatory default for this scaffold.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: [now]
    output: { now: datetime }
    success_code: 200
    side_effects: ["No entity is mutated; subsequent requests evaluate temporal rules against the new instant"]

  # ------------------------------------------------------------------- Station
  - method: POST
    path: /fire-ops/stations
    description: "Registers a station with its contractual staffing floor and its fiscal overtime budget."
    roles: [StaffingOfficer]
    input: [name, battalion_code, minimum_staffing_floor, fiscal_ot_budget_cents, fiscal_period_start_date, fiscal_period_end_date]
    output: Station
    success_code: 201
    side_effects:
      - "ot_committed_cents = 0, ot_actual_cents = 0"
      - "budget_posture computed by calculations.station_budget_posture (WITHIN at zero consumption)"

  - method: GET
    path: /fire-ops/stations/{station_id}
    description: "Reads one station including its live encumbrance ledger and budget posture."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: Station
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/stations
    description: "Lists stations. Default ordering: battalion_code ASC, name ASC, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["battalion_code?", "budget_posture?", "limit?", "offset?"]
    output: Station[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/stations/{station_id}/overtime-forecast
    description: |
      Computed read. Forecasts remaining overtime spend for the fiscal period by
      calculations.station_overtime_forecast. `method` selects the variant and
      defaults to VACANCY_DRIVEN.
    roles: [StaffingOfficer, PayrollAnalyst]
    input: ["method?"]
    output: { station_id: string, method: string, avg_rate_cents: integer, shift_base_cents: integer, horizon_vacancy_count: integer, vacancy_driver_cents: integer, injury_headcount: integer, injury_driver_cents: integer, daily_run_rate_cents: integer, remaining_days: integer, forecast_cents: integer, projected_period_total_cents: integer, variance_cents: integer, forecast_posture: string }
    success_code: 200
    side_effects: ["Pure read; nothing is persisted. Fields belonging to the other variant are returned as 0."]

  - method: GET
    path: /fire-ops/stations/{station_id}/academy-hiring-signal
    description: "Computed read. Converts open-seat and injury-leave pressure into a recruit-class recommendation by calculations.academy_hiring_signal."
    roles: [StaffingOfficer, PayrollAnalyst]
    input: []
    output: { station_id: string, open_vacancy_seats: integer, injury_headcount: integer, raw_need: integer, recommended_recruit_count: integer, signal_tier: string }
    success_code: 200
    side_effects: ["Pure read; nothing is persisted."]

  # ----------------------------------------------------------------- Apparatus
  - method: POST
    path: /fire-ops/apparatus
    description: "Registers a company (engine, ladder, rescue, medic, hazmat unit) with its minimum crew, required specialty certifications and closure order."
    roles: [StaffingOfficer]
    input: ["station_id", "unit_designation", "apparatus_type", "minimum_crew_size", "required_certifications", "closure_priority", "closure_exempt?", "status?"]
    output: Apparatus
    success_code: 201
    side_effects: ["closure_exempt defaults to false; status defaults to IN_SERVICE"]

  - method: GET
    path: /fire-ops/apparatus/{apparatus_id}
    description: "Reads one company."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: Apparatus
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/apparatus
    description: "Lists companies, filterable by owning station. Default ordering: closure_priority ASC, unit_designation ASC, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["station_id?", "apparatus_type?", "status?", "limit?", "offset?"]
    output: Apparatus[]
    success_code: 200
    side_effects: []

  # --------------------------------------------------------------- Firefighter
  - method: POST
    path: /fire-ops/firefighters
    description: "Enrolls a member with rank, platoon, seniority, Kelly-day cycle position, certifications and hourly rate."
    roles: [StaffingOfficer]
    input: ["station_id", "full_name", "rank", "platoon", "seniority_rank", "kelly_day_cycle_position", "certifications", "hourly_rate_cents", "acting_supervisor_id?", "employment_status?"]
    output: Firefighter
    success_code: 201
    side_effects:
      - "employment_status defaults to ACTIVE, roster_standing to AVAILABLE, every counter to 0"
      - "An OPEN WorkPeriod is created for the member: period_start_date = the logical clock's calendar date, period_end_date = period_start_date + FLSA_PERIOD_DAYS - 1, flsa_threshold_hours = 204"

  - method: GET
    path: /fire-ops/firefighters/{firefighter_id}
    description: "Reads one member including the roster counters the hiring order ranks on."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: Firefighter
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/firefighters
    description: |
      Lists members. `station_id` filters by home station and `acting_supervisor_id`
      filters by the self-referential supervisor link. Default ordering:
      seniority_rank ASC, created_at ASC.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["station_id?", "acting_supervisor_id?", "platoon?", "rank?", "employment_status?", "roster_standing?", "limit?", "offset?"]
    output: Firefighter[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/firefighters/{firefighter_id}/availability
    description: |
      Sets a member's employment status and/or roster standing (injury leave,
      return to duty, roster reset). Idempotent by design and guarded only by
      optimistic concurrency (see §1.2.1 availability-set-stale-firefighter).
    roles: [StaffingOfficer]
    input: ["expected_firefighter_version", "effective_date", "employment_status?", "roster_standing?"]
    output: Firefighter
    success_code: 200
    side_effects:
      - "increments Firefighter.version by 1"
      - "Moving to INJURY_LEAVE: every SCHEDULED ShiftAssignment of the member on a shift dated on or after effective_date -> CANCELLED, a Vacancy (driver = INJURY, driver_source_id = firefighter id) is created OPEN for each vacated seat, and each affected DutyShift recomputes its staffing fields (STAFFED -> HIRING)"
      - "Moving back to ACTIVE: every OPEN Vacancy with driver = INJURY and driver_source_id = this member on a shift dated on or after effective_date -> CANCELLED"
      - "Setting roster_standing = AVAILABLE resets ot_pass_count to 0"

  # -------------------------------------------------------------- HiringRoster
  - method: POST
    path: /fire-ops/hiring-rosters
    description: "Creates a hiring roster for a station: one per hiring mode, optionally scoped to a specialty certification."
    roles: [StaffingOfficer]
    input: ["station_id", "roster_type", "certification_scope?"]
    output: HiringRoster
    success_code: 201
    side_effects: ["certification_scope defaults to NONE (the general roster for that mode); dispatch_count starts at 0"]

  - method: GET
    path: /fire-ops/hiring-rosters/{hiring_roster_id}
    description: "Reads one hiring roster."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: HiringRoster
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/hiring-rosters
    description: "Lists hiring rosters, filterable by station. Default ordering: roster_type ASC, certification_scope ASC, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["station_id?", "roster_type?", "certification_scope?", "limit?", "offset?"]
    output: HiringRoster[]
    success_code: 200
    side_effects: []

  # ----------------------------------------------------------------- DutyShift
  - method: POST
    path: /fire-ops/duty-shifts
    description: |
      Opens a duty shift in DRAFT for one station, one calendar date and one
      platoon. The platoon must be the platoon the rotation calendar puts on duty
      for that date (calculations.rotation_calendar), else ERR_PLATOON_ROTATION_VIOLATION.
    roles: [StaffingOfficer]
    input: [station_id, shift_date, platoon]
    output: DutyShift
    success_code: 201
    side_effects:
      - "status = DRAFT, ops_run_index = 0, closed_apparatus_ids = []"
      - "required_staffing and leave_floor_headcount computed; assigned_headcount 0; staffing_posture computed"

  - method: GET
    path: /fire-ops/duty-shifts/{duty_shift_id}
    description: "Reads one duty shift including every derived staffing field and the closure list."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: DutyShift
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/duty-shifts
    description: "Lists duty shifts, filterable by station. Default ordering: shift_date ASC, platoon ASC, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["station_id?", "platoon?", "status?", "shift_date?", "staffing_posture?", "limit?", "offset?"]
    output: DutyShift[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/duty-shifts/{duty_shift_id}/publish
    description: "Publishes a DRAFT shift: materialises its open seats as Vacancy rows (calculations.vacancy_generation) and moves it to HIRING, or straight to STAFFED when nothing is open."
    roles: [StaffingOfficer]
    input: []
    output: DutyShift
    success_code: 200
    side_effects:
      - "Vacancy rows created in closure_priority order with the unmet specialty certifications assigned to the earliest seats"
      - "required_staffing, open_vacancy_count, assigned_headcount, staffing_gap, certification_gap_count, leave_floor_headcount, staffing_posture recomputed"
      - "status -> HIRING (open_vacancy_count > 0) or STAFFED (== 0); increments DutyShift.version by 1"

  - method: POST
    path: /fire-ops/duty-shifts/{duty_shift_id}/staffing-run
    description: "Ops-run checkpoint. Runs the four ordered steps of the HIRING/STAFFED self-transition in §1.2: expire due offers, recompute staffing, requeue floor-denied leave when the shift is whole again, recompute budget posture."
    roles: [StaffingOfficer]
    input: []
    output: DutyShift
    success_code: 200
    side_effects:
      - "ops_run_index += 1"
      - "Due OvertimeOffers -> EXPIRED with the pass charged to the member (calculations.offer_expiry_sweep); their vacancies return to OPEN and Station.ot_committed_cents is credited back"
      - "Members reaching OT_PASS_LIMIT passes have roster_standing set to PASSED"
      - "Derived staffing fields recomputed; DENIED LeaveRequests requeued when the resulting posture is FULLY_STAFFED"
      - "Station.budget_posture recomputed; increments DutyShift.version by 1"

  - method: POST
    path: /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication
    description: |
      Adjudicates every QUEUED leave request on the shift in one batch, in the
      order given by calculations.leave_adjudication_order. Non-discretionary
      types are granted unconditionally; discretionary types are granted only
      while the running headcount stays at or above leave_floor_headcount.
    roles: [CompanyOfficer]
    input: []
    output: { duty_shift_id: string, leave_floor_headcount: integer, considered_count: integer, approved_count: integer, denied_count: integer, approved_leave_request_ids: string, denied_leave_request_ids: string, resulting_assigned_headcount: integer, resulting_staffing_posture: string, created_vacancy_count: integer }
    success_code: 200
    side_effects:
      - "Each QUEUED request -> APPROVED or DENIED with decision_order_index stamped"
      - "For every approval that relieves a seat: the ShiftAssignment -> RELIEVED, a LEAVE-driver Vacancy is created OPEN, and the member's WorkPeriod hours are reduced and re-priced"
      - "DutyShift staffing fields recomputed and a STAFFED shift moves to HIRING; increments DutyShift.version by 1"

  - method: POST
    path: /fire-ops/duty-shifts/{duty_shift_id}/company-closure
    description: |
      Takes one company out of service for this shift when the shift cannot be
      staffed. The company is chosen by calculations.company_closure_selector;
      the closure is refused unless the shift's posture is CRITICAL.
    roles: [StaffingOfficer]
    input: [expected_duty_shift_version, justification]
    output: DutyShift
    success_code: 200
    side_effects:
      - "The selected Apparatus id is appended to closed_apparatus_ids and required_staffing drops by its minimum_crew_size"
      - "Its OPEN/OFFERING vacancies -> CLOSED_BY_COMPANY_CLOSURE, their OFFERED offers -> RESCINDED, and Station.ot_committed_cents is credited back offer by offer with pending_offer_count decremented"
      - "leave_floor_headcount, staffing_gap, certification_gap_count, staffing_posture, open_vacancy_count and Station.budget_posture recomputed"
      - "increments DutyShift.version by 1"

  - method: POST
    path: /fire-ops/duty-shifts/{duty_shift_id}/complete
    description: "Closes out an elapsed shift: seats become WORKED, encumbrances become actual spend, leftover vacancies and offers are withdrawn, and any work period whose window has ended is closed and re-priced on the worked basis."
    roles: [PayrollAnalyst]
    input: []
    output: DutyShift
    success_code: 200
    side_effects:
      - "SCHEDULED assignments -> WORKED with actual_hours = scheduled_hours; work-period worked_hours and final_flsa_overtime_hours recomputed"
      - "Station.ot_actual_cents += the completed premium total and ot_committed_cents -= the same amount"
      - "Remaining OPEN/OFFERING vacancies -> CANCELLED and their OFFERED offers -> RESCINDED"
      - "Elapsed WorkPeriods -> CLOSED, flsa_premium_cents re-priced on the WORKED_BASIS variant, and a successor OPEN period created"
      - "status -> COMPLETED; increments DutyShift.version by 1"

  # ------------------------------------------------------------ ShiftAssignment
  - method: POST
    path: /fire-ops/shift-assignments
    description: |
      Seats a member on a company for a shift. Guarded by optimistic concurrency
      on the parent shift (§1.2.1 assignment-create-stale-duty-shift) and by the
      rotation, double-booking, rest-period, seat-capacity and FLSA-cap rules.
    roles: [CompanyOfficer]
    input: [duty_shift_id, firefighter_id, apparatus_id, assignment_type, seat_certification, scheduled_hours, expected_duty_shift_version]
    output: ShiftAssignment
    success_code: 201
    side_effects:
      - "status = SCHEDULED; projected_premium_cents = 0 for REGULAR, KELLY_RELIEF and TRADE seats"
      - "If the seat matches an OPEN Vacancy of the same company and certification, that vacancy -> FILLED with filled_by_assignment_id set"
      - "The covering WorkPeriod's scheduled_hours += scheduled_hours; projected_flsa_overtime_hours and flsa_premium_cents recomputed on the SCHEDULED_BASIS variant"
      - "DutyShift assigned_headcount, staffing_gap, certification_gap_count, open_vacancy_count, staffing_posture recomputed; HIRING -> STAFFED when the last vacancy closes"
      - "increments DutyShift.version by 1"

  - method: GET
    path: /fire-ops/shift-assignments/{shift_assignment_id}
    description: "Reads one seat assignment."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: ShiftAssignment
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/shift-assignments
    description: |
      Lists seat assignments. Every foreign key is a filter: `duty_shift_id`,
      `firefighter_id`, `apparatus_id`, `source_offer_id` and
      `relieved_by_leave_request_id`. Default ordering:
      duty_shift.shift_date ASC, apparatus.closure_priority ASC, created_at ASC.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["duty_shift_id?", "firefighter_id?", "apparatus_id?", "source_offer_id?", "relieved_by_leave_request_id?", "assignment_type?", "status?", "limit?", "offset?"]
    output: ShiftAssignment[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/shift-assignments/{shift_assignment_id}/cancel
    description: "Removes a member from a seat. Releases any overtime encumbrance, restores the work-period hours and re-opens the vacancy the seat had filled."
    roles: [CompanyOfficer]
    input: [reason]
    output: ShiftAssignment
    success_code: 200
    side_effects:
      - "status -> CANCELLED"
      - "Station.ot_committed_cents -= projected_premium_cents (when non-zero) and Station.budget_posture recomputed"
      - "Covering WorkPeriod.scheduled_hours -= scheduled_hours and the SCHEDULED_BASIS premium recomputed"
      - "Any Vacancy whose filled_by_assignment_id is this seat -> OPEN"
      - "DutyShift staffing fields recomputed; STAFFED -> HIRING when a vacancy re-opened; increments DutyShift.version by 1"

  # --------------------------------------------------------------- LeaveRequest
  - method: POST
    path: /fire-ops/leave-requests
    description: "A member requests leave from a shift. The request enters the adjudication queue; nothing is decided until an officer runs leave-adjudication."
    roles: [Firefighter]
    input: [firefighter_id, duty_shift_id, leave_type, requested_hours]
    output: LeaveRequest
    success_code: 201
    side_effects: ["status = QUEUED; decision_order_index and denial_reason null; no staffing field changes"]

  - method: GET
    path: /fire-ops/leave-requests/{leave_request_id}
    description: "Reads one leave request including its adjudication position and denial reason."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: LeaveRequest
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/leave-requests
    description: "Lists leave requests, filterable by requesting member and by shift. Default ordering: decision_order_index ASC NULLS LAST, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["firefighter_id?", "duty_shift_id?", "status?", "leave_type?", "limit?", "offset?"]
    output: LeaveRequest[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/leave-requests/{leave_request_id}/revoke
    description: "The member withdraws an approved leave. Refused once the backfill vacancy has been filled, because the replacement is already committed."
    roles: [Firefighter]
    input: []
    output: LeaveRequest
    success_code: 200
    side_effects:
      - "status -> REVOKED"
      - "The RELIEVED ShiftAssignment -> SCHEDULED and the covering WorkPeriod's scheduled_hours and premium are restored exactly"
      - "WorkPeriod.leave_hours -= requested_hours"
      - "The backfill Vacancy -> CANCELLED and any OFFERED offer on it -> RESCINDED with the encumbrance credited back to the station"
      - "DutyShift staffing fields recomputed; increments DutyShift.version by 1"

  # --------------------------------------------------------------- TradeRequest
  - method: POST
    path: /fire-ops/trade-requests
    description: "A member proposes to give a shift to a named counterparty. Only the requesting member may create it, and only inside the trade lead-time window."
    roles: [Firefighter]
    input: [requesting_firefighter_id, counterparty_firefighter_id, duty_shift_id]
    output: TradeRequest
    success_code: 201
    side_effects: ["status = PROPOSED, revision_count = 0; no staffing change"]

  - method: GET
    path: /fire-ops/trade-requests/{trade_request_id}
    description: "Reads one trade request."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: TradeRequest
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/trade-requests
    description: |
      Lists trade requests. Filters cover all four foreign keys:
      `requesting_firefighter_id`, `counterparty_firefighter_id`, `duty_shift_id`
      and `traded_assignment_id`. Default ordering: created_at ASC.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["requesting_firefighter_id?", "counterparty_firefighter_id?", "duty_shift_id?", "traded_assignment_id?", "status?", "limit?", "offset?"]
    output: TradeRequest[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/trade-requests/{trade_request_id}/countersign
    description: "The counterparty accepts the trade. This is where every eligibility rule on the incoming member is enforced (certification, rotation, double booking, FLSA cap, lead time)."
    roles: [Firefighter]
    input: []
    output: TradeRequest
    success_code: 200
    side_effects: ["status -> COUNTERSIGNED; no staffing, ledger or work-period change yet"]

  - method: POST
    path: /fire-ops/trade-requests/{trade_request_id}/decision
    description: "A company officer who is not a party to the trade approves it, rejects it, or returns it for revision (which sends it back to PROPOSED and increments revision_count)."
    roles: [CompanyOfficer]
    input: ["decision", "note?"]
    output: TradeRequest
    success_code: 200
    side_effects:
      - "decision = APPROVE: the seat's firefighter_id becomes the counterparty, assignment_type becomes TRADE, both members' work periods are re-hour-ed and re-priced, any premium on the seat is released from Station.ot_committed_cents"
      - "decision = REJECT: status -> REJECTED, nothing else changes"
      - "decision = RETURN_FOR_REVISION: status -> PROPOSED, revision_count += 1"
      - "decided_by_user_id = X-User-ID in all three cases"

  # -------------------------------------------------------------------- Vacancy
  - method: GET
    path: /fire-ops/vacancies/{vacancy_id}
    description: "Reads one vacancy, including which driver produced it and which seat filled it."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: Vacancy
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/vacancies
    description: |
      Lists vacancies. Filters cover the foreign keys `duty_shift_id`,
      `apparatus_id` and `filled_by_assignment_id`, plus the polymorphic
      `driver_source_id`. Default ordering: duty_shift.shift_date ASC,
      apparatus.closure_priority ASC, seat_index ASC, created_at ASC — so a
      list-indexed read of a freshly published shift is reproducible.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["duty_shift_id?", "apparatus_id?", "filled_by_assignment_id?", "driver?", "driver_source_id?", "required_certification?", "status?", "limit?", "offset?"]
    output: Vacancy[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/vacancies/{vacancy_id}/offer
    description: |
      Runs the hiring order for a vacancy in the requested mode and dispatches an
      overtime offer to the single member the selector returns. VOLUNTARY and
      CALLBACK create an OFFERED offer and leave the vacancy OFFERING; the
      MANDATORY_HOLDOVER mode creates a MANDATED offer and the resulting HOLDOVER
      seat in the same request, and is the only path that bypasses the budget gate.
    roles: [StaffingOfficer]
    input: [hiring_mode, offer_hours]
    output: OvertimeOffer
    success_code: 201
    side_effects:
      - "Candidate chosen by calculations.hiring_order_selector; price by calculations.overtime_offer_cost; gate by calculations.budget_gate_evaluation_order"
      - "Station.ot_committed_cents += projected_cost_cents; Station.budget_posture recomputed"
      - "Firefighter.pending_offer_count += 1; HiringRoster.dispatch_count += 1"
      - "VOLUNTARY / CALLBACK: offer status OFFERED with expires_at = now + OFFER_RESPONSE_WINDOW_MINUTES; vacancy -> OFFERING"
      - "MANDATORY_HOLDOVER: offer status MANDATED with expires_at null, a SCHEDULED HOLDOVER ShiftAssignment created, vacancy -> FILLED, Firefighter.mandatory_holdover_count += 1, the member's WorkPeriod hours increased and re-priced, and the DutyShift staffing fields recomputed"

  # --------------------------------------------------------------- OvertimeOffer
  - method: GET
    path: /fire-ops/overtime-offers/{overtime_offer_id}
    description: "Reads one overtime offer including the priced cost and the response deadline."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: OvertimeOffer
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/overtime-offers
    description: |
      Lists overtime offers. Filters cover the foreign keys `vacancy_id`,
      `firefighter_id` and `roster_id`. Default ordering: created_at ASC.
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["vacancy_id?", "firefighter_id?", "roster_id?", "hiring_mode?", "status?", "limit?", "offset?"]
    output: OvertimeOffer[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/overtime-offers/{overtime_offer_id}/response
    description: |
      The offered member accepts or declines. Acceptance creates the overtime seat
      and fills the vacancy; a decline charges the pass to the member exactly as an
      expiry would and returns the vacancy to OPEN for the next member in order.
    roles: [Firefighter]
    input: [response]
    output: OvertimeOffer
    success_code: 200
    side_effects:
      - "ACCEPT: offer -> ACCEPTED, a SCHEDULED OVERTIME (or CALLBACK) ShiftAssignment created carrying projected_premium_cents = projected_cost_cents, vacancy -> FILLED, work-period hours increased and re-priced, voluntary_ot_hours_charged or callback_count incremented, ot_pass_count reset to 0, pending_offer_count -= 1"
      - "DECLINE: offer -> DECLINED, vacancy -> OPEN, voluntary_ot_hours_charged charged anyway, ot_pass_count += 1 (roster_standing -> PASSED at OT_PASS_LIMIT), pending_offer_count -= 1, Station.ot_committed_cents credited back"
      - "Station.budget_posture and the DutyShift staffing fields recomputed in both cases; increments DutyShift.version by 1"

  # ------------------------------------------------------------------ WorkPeriod
  - method: GET
    path: /fire-ops/work-periods/{work_period_id}
    description: "Reads one FLSA 7(k) work period with both hour bases, both overtime figures and the premium currently in force."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: []
    output: WorkPeriod
    success_code: 200
    side_effects: []

  - method: GET
    path: /fire-ops/work-periods
    description: "Lists work periods, filterable by member. Default ordering: period_start_date ASC, created_at ASC."
    roles: [StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst]
    input: ["firefighter_id?", "status?", "limit?", "offset?"]
    output: WorkPeriod[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /fire-ops/work-periods/{work_period_id}/hour-adjustment
    description: |
      Records a payroll hour adjustment against an open work period — imported
      hours from another period, corrections, drill and training time — on either
      the scheduled or the worked basis. This is how a period is brought to the
      FLSA threshold without materialising 8.5 shifts of seats.
    roles: [PayrollAnalyst]
    input: [adjustment_hours, adjustment_basis, reason]
    output: WorkPeriod
    success_code: 200
    side_effects:
      - "adjustment_basis = SCHEDULED: adjusted_scheduled_hours += adjustment_hours, projected_flsa_overtime_hours and (while OPEN) flsa_premium_cents recomputed"
      - "adjustment_basis = WORKED: adjusted_worked_hours += adjustment_hours, final_flsa_overtime_hours and (while CLOSED) flsa_premium_cents recomputed"
      - "Rejected with ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED when the resulting adjusted_scheduled_hours would exceed FLSA_MAX_PERIOD_HOURS"

# =============================================================================
# §1.6 Error Catalog  (38 codes; every code is reachable from at least one
# endpoint listed in applies_to)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of StaffingOfficer, CompanyOfficer, Firefighter, PayrollAnalyst"
    applies_to: ["all endpoints"]

  - id: ERR_FORBIDDEN_ROLE
    http_status: 403
    condition: "X-User-Role is a declared role but is not in the endpoint's authorized roles"
    applies_to: ["all endpoints"]

  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "A member-scoped action is attempted by a caller whose X-User-ID is not the owning firefighter"
    applies_to: ["POST /fire-ops/leave-requests", "POST /fire-ops/leave-requests/{leave_request_id}/revoke", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "The officer deciding a trade is the requesting member or the counterparty"
    applies_to: ["POST /fire-ops/trade-requests/{trade_request_id}/decision"]

  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "Malformed body, missing required field, wrong type, enum value outside the declared set, integer outside its declared bounds, or malformed date/datetime"
    applies_to: ["all POST endpoints"]

  - id: ERR_STATION_NOT_FOUND
    http_status: 404
    condition: "station_id in the path or body does not resolve"
    applies_to: ["GET /fire-ops/stations/{station_id}", "GET /fire-ops/stations/{station_id}/overtime-forecast", "GET /fire-ops/stations/{station_id}/academy-hiring-signal", "POST /fire-ops/apparatus", "POST /fire-ops/firefighters", "POST /fire-ops/hiring-rosters", "POST /fire-ops/duty-shifts"]

  - id: ERR_FIREFIGHTER_NOT_FOUND
    http_status: 404
    condition: "firefighter_id, acting_supervisor_id, requesting_firefighter_id or counterparty_firefighter_id does not resolve"
    applies_to: ["GET /fire-ops/firefighters/{firefighter_id}", "POST /fire-ops/firefighters", "POST /fire-ops/firefighters/{firefighter_id}/availability", "POST /fire-ops/shift-assignments", "POST /fire-ops/leave-requests", "POST /fire-ops/trade-requests"]

  - id: ERR_DUTY_SHIFT_NOT_FOUND
    http_status: 404
    condition: "duty_shift_id in the path or body does not resolve"
    applies_to: ["GET /fire-ops/duty-shifts/{duty_shift_id}", "POST /fire-ops/duty-shifts/{duty_shift_id}/publish", "POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run", "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication", "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure", "POST /fire-ops/duty-shifts/{duty_shift_id}/complete", "POST /fire-ops/shift-assignments", "POST /fire-ops/leave-requests", "POST /fire-ops/trade-requests"]

  - id: ERR_VACANCY_NOT_FOUND
    http_status: 404
    condition: "vacancy_id in the path does not resolve"
    applies_to: ["GET /fire-ops/vacancies/{vacancy_id}", "POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_OFFER_NOT_FOUND
    http_status: 404
    condition: "overtime_offer_id in the path does not resolve"
    applies_to: ["GET /fire-ops/overtime-offers/{overtime_offer_id}", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response"]

  - id: ERR_LEAVE_REQUEST_NOT_FOUND
    http_status: 404
    condition: "leave_request_id in the path does not resolve"
    applies_to: ["GET /fire-ops/leave-requests/{leave_request_id}", "POST /fire-ops/leave-requests/{leave_request_id}/revoke"]

  - id: ERR_TRADE_REQUEST_NOT_FOUND
    http_status: 404
    condition: "trade_request_id in the path does not resolve"
    applies_to: ["GET /fire-ops/trade-requests/{trade_request_id}", "POST /fire-ops/trade-requests/{trade_request_id}/countersign", "POST /fire-ops/trade-requests/{trade_request_id}/decision"]

  - id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    condition: "An apparatus_id, hiring_roster_id, shift_assignment_id or work_period_id in the path or body does not resolve"
    applies_to: ["GET /fire-ops/apparatus/{apparatus_id}", "GET /fire-ops/hiring-rosters/{hiring_roster_id}", "GET /fire-ops/shift-assignments/{shift_assignment_id}", "GET /fire-ops/work-periods/{work_period_id}", "POST /fire-ops/shift-assignments", "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel", "POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"]

  - id: ERR_STALE_VERSION
    http_status: 412
    condition: "expected_duty_shift_version or expected_firefighter_version does not equal the current version of the named parent (see §1.2.1)"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure", "POST /fire-ops/firefighters/{firefighter_id}/availability"]

  - id: ERR_SHIFT_NOT_DRAFT
    http_status: 409
    condition: "publish called on a shift whose status is not DRAFT"
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/publish"]

  - id: ERR_SHIFT_NOT_HIRING
    http_status: 409
    condition: "An operation that requires an active shift (status HIRING or STAFFED) is attempted on a DRAFT or COMPLETED shift"
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run", "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication", "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure", "POST /fire-ops/duty-shifts/{duty_shift_id}/complete", "POST /fire-ops/shift-assignments", "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel", "POST /fire-ops/vacancies/{vacancy_id}/offer", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/leave-requests/{leave_request_id}/revoke"]

  - id: ERR_SHIFT_NOT_ELAPSED
    http_status: 409
    condition: "complete called on a shift whose shift_date is after the logical clock's calendar date"
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/complete"]

  - id: ERR_VACANCY_NOT_OFFERABLE
    http_status: 409
    condition: "offer called on a vacancy whose status is not OPEN, or whose company is in the shift's closed_apparatus_ids"
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_OFFER_NOT_PENDING
    http_status: 409
    condition: "response called on an offer whose status is not OFFERED — including MANDATED offers, which cannot be declined"
    applies_to: ["POST /fire-ops/overtime-offers/{overtime_offer_id}/response"]

  - id: ERR_LEAVE_NOT_REVOCABLE
    http_status: 409
    condition: "revoke called on a leave request whose status is not APPROVED"
    applies_to: ["POST /fire-ops/leave-requests/{leave_request_id}/revoke"]

  - id: ERR_TRADE_STATE_INVALID
    http_status: 409
    condition: "countersign called on a trade that is not PROPOSED, or decision called on a trade that is not COUNTERSIGNED"
    applies_to: ["POST /fire-ops/trade-requests/{trade_request_id}/countersign", "POST /fire-ops/trade-requests/{trade_request_id}/decision"]

  - id: ERR_ASSIGNMENT_NOT_SCHEDULED
    http_status: 409
    condition: "cancel called on a seat that is not SCHEDULED, or a trade is approved after the requester's seat left SCHEDULED"
    applies_to: ["POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel", "POST /fire-ops/trade-requests/{trade_request_id}/decision"]

  - id: ERR_STATION_SCOPE_MISMATCH
    http_status: 422
    condition: "The firefighter, apparatus and duty shift referenced by one request do not all belong to the same station, or a trade counterparty is not ACTIVE at that station"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/leave-requests", "POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_CERTIFICATION_NOT_HELD
    http_status: 422
    condition: "The member does not hold the specialty certification the seat declares (paramedic, hazmat technician or technical rescue)"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_LEAVE_ALREADY_BACKFILLED
    http_status: 422
    condition: "revoke attempted on an approved leave whose backfill vacancy has already been FILLED by a hire"
    applies_to: ["POST /fire-ops/leave-requests/{leave_request_id}/revoke"]

  - id: ERR_ROSTER_NOT_CONFIGURED
    http_status: 422
    condition: "No hiring roster exists for the station in the requested mode, either certification-scoped or general"
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_PLATOON_ROTATION_VIOLATION
    http_status: 422
    condition: "The shift's platoon is not the platoon the rotation calendar puts on duty for shift_date, or a REGULAR/KELLY_RELIEF seat is given to a member of another platoon"
    applies_to: ["POST /fire-ops/duty-shifts", "POST /fire-ops/shift-assignments", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_KELLY_DAY_CONFLICT
    http_status: 422
    condition: "A member whose Kelly-day cycle position matches the shift date's Kelly slot is seated on an assignment type other than KELLY_RELIEF or CALLBACK"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_DOUBLE_BOOKED_SHIFT
    http_status: 422
    condition: "The member already holds a SCHEDULED seat whose half-open duty interval overlaps the new seat's interval"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_TRADE_WINDOW_CLOSED
    http_status: 422
    condition: "The trade is created or countersigned fewer than TRADE_LEAD_TIME_HOURS (48) before the shift begins"
    applies_to: ["POST /fire-ops/trade-requests", "POST /fire-ops/trade-requests/{trade_request_id}/countersign"]

  - id: ERR_REST_PERIOD_VIOLATION
    http_status: 422
    condition: "The merged continuous duty block containing the new seat would exceed CONTINUOUS_DUTY_MAX_HOURS (48)"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_STAFFING_FLOOR_BREACH
    http_status: 422
    condition: "Cancelling a seat would drop assigned_headcount below the shift's leave_floor_headcount"
    applies_to: ["POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"]

  - id: ERR_APPARATUS_SEAT_CAPACITY_EXCEEDED
    http_status: 422
    condition: "The company already carries minimum_crew_size + MAX_OVERSTAFF_SEATS riders for this shift"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_FLSA_WORK_PERIOD_CAP_EXCEEDED
    http_status: 422
    condition: "The operation would push the covering work period's adjusted_scheduled_hours above FLSA_MAX_PERIOD_HOURS (288)"
    applies_to: ["POST /fire-ops/shift-assignments", "POST /fire-ops/overtime-offers/{overtime_offer_id}/response", "POST /fire-ops/trade-requests/{trade_request_id}/countersign", "POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"]

  - id: ERR_NO_ELIGIBLE_CANDIDATE
    http_status: 422
    condition: "calculations.hiring_order_selector produced an empty candidate pool for the requested hiring mode"
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer"]

  - id: ERR_NO_CLOSURE_ELIGIBLE_COMPANY
    http_status: 422
    condition: "Every company at the station is exempt, already closed for this shift, or out of service"
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"]

  - id: ERR_CLOSURE_NOT_JUSTIFIED
    http_status: 422
    condition: "company-closure attempted on a shift whose staffing_posture is not CRITICAL"
    applies_to: ["POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"]

  - id: ERR_OT_BUDGET_WOULD_EXCEED
    http_status: 422
    condition: "ot_actual_cents + ot_committed_cents + the priced offer would exceed the station's fiscal_ot_budget_cents on a VOLUNTARY or CALLBACK hire"
    applies_to: ["POST /fire-ops/vacancies/{vacancy_id}/offer"]

# =============================================================================
# §1.7 RBAC Permission Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: StaffingOfficer
    description: |
      Battalion staffing office. Owns the master data (stations, companies,
      members, rosters), opens and publishes shifts, runs the ops-run checkpoint,
      dispatches the hiring order and takes companies out of service. Cannot seat
      members directly, cannot adjudicate leave, cannot decide trades and cannot
      close out a shift for payroll.
    identity: opaque
    exclusive_operations:
      - "POST /fire-ops/stations"
      - "POST /fire-ops/apparatus"
      - "POST /fire-ops/firefighters"
      - "POST /fire-ops/firefighters/{firefighter_id}/availability"
      - "POST /fire-ops/hiring-rosters"
      - "POST /fire-ops/duty-shifts"
      - "POST /fire-ops/duty-shifts/{duty_shift_id}/publish"
      - "POST /fire-ops/duty-shifts/{duty_shift_id}/staffing-run"
      - "POST /fire-ops/duty-shifts/{duty_shift_id}/company-closure"
      - "POST /fire-ops/vacancies/{vacancy_id}/offer"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /fire-ops/stations/{station_id}/overtime-forecast (with PayrollAnalyst)"
      - "GET /fire-ops/stations/{station_id}/academy-hiring-signal (with PayrollAnalyst)"
      - "every other GET endpoint in §1.5"

  - name: CompanyOfficer
    description: |
      Company officer on duty. Seats and un-seats members, adjudicates the leave
      queue against the staffing floor, and decides trades — but only trades they
      are not a party to (segregation of duties). Cannot create master data, cannot
      dispatch the hiring order, cannot close a company and cannot complete a shift.
    identity: "entity_backed:Firefighter"
    exclusive_operations:
      - "POST /fire-ops/shift-assignments"
      - "POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"
      - "POST /fire-ops/duty-shifts/{duty_shift_id}/leave-adjudication"
      - "POST /fire-ops/trade-requests/{trade_request_id}/decision"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5 except the two station analytics reads"

  - name: Firefighter
    description: |
      Line member. Requests and revokes their own leave, proposes and countersigns
      trades, and answers their own overtime offers. Every one of these actions is
      owner-scoped to their own X-User-ID; a member can never act for another member,
      and can never adjudicate, seat, price or close anything.
    identity: "entity_backed:Firefighter"
    exclusive_operations:
      - "POST /fire-ops/leave-requests"
      - "POST /fire-ops/leave-requests/{leave_request_id}/revoke"
      - "POST /fire-ops/trade-requests"
      - "POST /fire-ops/trade-requests/{trade_request_id}/countersign"
      - "POST /fire-ops/overtime-offers/{overtime_offer_id}/response"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint in §1.5 except the two station analytics reads"

  - name: PayrollAnalyst
    description: |
      Payroll and budget analyst. Closes out elapsed shifts, records FLSA hour
      adjustments, and reads the forecasting and academy-hiring analytics. Has no
      staffing authority whatsoever: cannot create master data, cannot seat members,
      cannot adjudicate leave, cannot hire overtime and cannot close a company.
    identity: opaque
    exclusive_operations:
      - "POST /fire-ops/duty-shifts/{duty_shift_id}/complete"
      - "POST /fire-ops/work-periods/{work_period_id}/hour-adjustment"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /fire-ops/stations/{station_id}/overtime-forecast (with StaffingOfficer)"
      - "GET /fire-ops/stations/{station_id}/academy-hiring-signal (with StaffingOfficer)"
      - "every other GET endpoint in §1.5"
