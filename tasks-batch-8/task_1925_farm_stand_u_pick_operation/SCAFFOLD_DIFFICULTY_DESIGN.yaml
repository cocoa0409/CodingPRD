  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: weather_closure_four_hop_cascade
        grounds:
          - state_machines.SalesDay.OPEN_to_CLOSED_WEATHER
          - state_machines.FieldDayWindow.SCHEDULED_to_CANCELLED
          - state_machines.VisitSession.CHECKED_IN_to_CHECKED_OUT
          - state_machines.HarvestLine.PROVISIONAL_to_VOIDED
          - state_machines.AddonBooking.BOOKED_to_RELEASED
          - calculations.weather_refund
        distinguishing_aspect: |
          Depth-4 chain from POST /farm/sales-days/{id}/close-weather: SalesDay
          -> window CANCELLED(WEATHER) -> session force-CHECKED_OUT(WEATHER_FORCED)
          -> that checkout voids the PROVISIONAL line, releases the BOOKED wagon
          booking, and drives a 2400-cent refund across two CHARGE payments —
          each hop caused by the previous hop's mutation.
