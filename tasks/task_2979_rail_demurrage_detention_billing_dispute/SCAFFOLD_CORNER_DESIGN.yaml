      - name: voiding_a_charge_removes_it_from_the_invoice_rollup_inputs
        claim_type: input_set_filtering
        grounds:
          - calculations.invoice_rollup_and_status_derivation
          - state_machines.DemurrageCharge.FINAL_to_VOIDED
        distinguishing_aspect: |
          The rollup's input set is "attached and not VOIDED", so voiding one of
          two charges must reduce attached_charge_count as well as the money —
          the voided row still points at the invoice and a naive sum over
          invoice_id would keep charging for it.
