      - name: cascade_chain_reaches_household_and_consent_records
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DeletionRequest.PROPAGATING_to_VERIFIED
          - state_machines.Profile.DELETION_PENDING_to_DELETED
        excluded_because:
          difficulty_instance: vendor_ack_verifies_request_tombstones_profile_dissolves_household
          rationale: "That §1.8 instance walks the full four-level chain — vendor acknowledge bubbles the request to VERIFIED, which tombstones the profile, TOMBSTONES its consent records, VOIDS its proposed links and dissolves its household — end to end in one trigger."

      - name: rule_disable_cascade_voids_sibling_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MatchRule.ENABLED_to_DISABLED
          - state_machines.IdentityLink.PROPOSED_to_VOIDED
        excluded_because:
          difficulty_instance: reject_lowers_precision_disables_rule_voids_sibling_link
          rationale: "That §1.8 instance verifies the three-hop ordering-sensitive chain REJECT -> precision recompute -> rule DISABLED -> sibling PROPOSED link VOIDED with void_reason RULE_DISABLED."

      - name: both_confidence_variants_produce_expected_results
        claim_type: dual_variant_calculation
        grounds:
