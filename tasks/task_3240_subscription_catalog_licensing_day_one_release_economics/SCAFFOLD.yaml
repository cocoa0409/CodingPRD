# =============================================================================
# Task 3240 — Subscription Catalog Licensing & Day-One Release Economics
# Seed tables §1.0–§1.7 (SCAFFOLD.yaml)
# =============================================================================

scenario: |
  Subscription Catalog Licensing & Day-One Release Economics (Xbox Game Pass):
  third-party title licensing with fixed fee, engagement-based or hybrid
  compensation structures and term lengths, catalog rotation planning with add
  and removal dates communicated to subscribers, day-one release of first-party
  and negotiated third-party titles with revenue tradeoffs against unit sales,
  tier structure across console, computer, cloud and bundled online play with
  entitlement resolution, cloud streaming capacity planning tied to catalog
  popularity and launch spikes, member discounts on purchases of catalog titles
  with entitlement retention after removal, conversion and retention analytics
  driving licensing decisions, regional pricing and availability differences

domain_name: subscription-catalog-licensing
api_prefix: /catalog

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Temporal windowing
  complexity_layers:
    - Cascading side effects
    - Derived field reconciliation
    - Rate / threshold triggers
    - Scheduled / deferred actions
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:

  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, constraints: "non-empty, unique across Publisher.name", description: "Legal name of the studio or publisher owning the titles" }
      - { name: home_region_code, type: string, source: input, constraints: "must be one of the REGIONS keys", description: "Publisher's home region, used only for reporting" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "Publisher account state; SUSPENDED blocks new licensing deals" }
      - { name: deal_count, type: integer, source: computed, default: 0, description: "Count of LicensingDeal rows with status in {NEGOTIATING, SIGNED, LIVE, EXPIRING}; recomputed on every licensing deal state change" }
      - { name: lifetime_licensing_cost_cents, type: number, source: computed, default: 0, description: "Sum over this publisher's LicensingDeal.compensation_floor_cents for deals in status IN {SIGNED, LIVE, EXPIRING, COMPLETED}" }

  - name: Title
    parent: Publisher
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; the studio that owns the title" }
      - { name: name, type: string, source: input, constraints: "non-empty, unique per (publisher_id, name)", description: "Commercial title name" }
      - { name: platform_set, type: array, source: input, constraints: "non-empty subset of {CONSOLE, PC, CLOUD}", description: "Platforms on which the title ships natively" }
      - { name: day_one_eligible, type: boolean, source: input, default: false, description: "Whether this title is a candidate for a DAY_ONE catalog release" }
      - { name: list_price_cents, type: number, source: input, constraints: ">= 0, whole cents", description: "Global default unit sale price before regional adjustment" }
      - { name: unit_sales_30d, type: integer, source: input, default: 0, description: "Trailing 30-day unit sales baseline used by the day-one cannibalization projection" }
      - { name: weighted_engagement_score, type: number, source: computed, precision: "2 decimal places, round_half_up", description: "Popularity-weighted engagement over this title's ADDED CatalogEntry rows (see calculation weighted_engagement_score)" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | RELEASED | RETIRED", description: "Title lifecycle" }

  - name: Region
    parent: null
    common_fields: false
    fields:
      - { name: region_code, type: string, source: input, constraints: "unique", description: "Region identifier, e.g. NA, EU, JP, BR" }
      - { name: currency_code, type: string, source: input, description: "ISO 4217 currency for prices presented in this region" }
      - { name: price_multiplier, type: number, source: input, constraints: "> 0", description: "Multiplier applied to a tier's base price to derive the region's monthly price" }
      - { name: availability_ceiling_titles, type: integer, source: input, constraints: ">= 1", description: "Ceiling used both for concurrent catalog occupancy and for the region's streaming fleet size" }
      - { name: catalog_tier_floor, type: enum, source: input, constraints: "ESSENTIAL | PREMIUM | ULTIMATE", description: "Lowest tier offered in this region; tiers below the floor are unavailable" }
      - { name: capacity_required_slots, type: number, source: computed, default: 0, description: "Raw slots required by live catalog popularity plus launch spikes plus regional overhead (cloud_capacity_allocation)" }
      - { name: capacity_usable_slots, type: number, source: computed, default: 0, description: "Usable slots after any active maintenance reduction (cloud_capacity_allocation)" }
      - { name: capacity_deficit_slots, type: number, source: computed, default: 0, description: "capacity_required_slots - capacity_usable_slots; negative means headroom" }
      - { name: capacity_utilization_pct, type: number, source: computed, default: 0, description: "Utilisation percentage, two decimals, 0.00 when usable slots are zero" }
      - { name: capacity_status, type: enum, source: computed, default: WITHIN_CAPACITY, constraints: "WITHIN_CAPACITY | OVER_CAPACITY", description: "OVER_CAPACITY while capacity_required_slots is strictly greater than capacity_usable_slots" }

  - name: SubscriptionTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: enum, source: input, constraints: "ESSENTIAL | PREMIUM | ULTIMATE; unique", description: "Tier identity" }
      - { name: monthly_price_cents, type: number, source: input, constraints: ">= 0", description: "Global default monthly price before regional multiplier" }
      - { name: console_access, type: boolean, source: input, description: "Grants CONSOLE play entitlements" }
      - { name: pc_access, type: boolean, source: input, description: "Grants PC play entitlements" }
      - { name: cloud_access, type: boolean, source: input, description: "Grants CLOUD play entitlements" }
      - { name: online_play_bundle, type: boolean, source: input, description: "Grants the bundled online multiplayer entitlement" }
      - { name: member_discount_pct, type: number, source: input, constraints: "0 <= value <= 0.4", description: "Base discount applied to purchases of catalog titles by holders of this tier" }
      - { name: discount_retention_days, type: integer, source: input, constraints: ">= 0", description: "Days after a title leaves the catalog during which a member purchase retains its member discount" }
      - { name: annual_prepay_credit_ratio, type: number, source: input, constraints: ">= 0", description: "Fraction of the annual prepay credited to the first billing month" }
      - { name: current_subscriber_count, type: integer, source: computed, default: 0, description: "Count of Subscription rows for this tier in status over lifecycle IN {ACTIVE, GRACE}; denominator for retention_pct" }

  - name: LicensingDeal
    parent: Publisher
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; the counterparty of the deal" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title licensed under this deal" }
      - { name: compensation_model, type: enum, source: input, constraints: "FIXED | ENGAGEMENT | HYBRID", description: "How the publisher is paid" }
      - { name: monthly_fixed_fee_cents, type: integer, source: input, default: 0, constraints: "required and > 0 when compensation_model == FIXED", description: "Recurring fixed component paid for each whole month of the term" }
      - { name: guaranteed_compensation_cents, type: integer, source: input, default: 0, constraints: "required and > 0 when compensation_model == HYBRID", description: "Non-recoupable floor per month of the term for a hybrid deal" }
      - { name: engagement_rate_cents_per_hour, type: number, source: input, default: 0, constraints: "required and > 0 when compensation_model == ENGAGEMENT", description: "Rate applied to normalized engaged hours" }
      - { name: monthly_engagement_cap_cents, type: integer, source: input, default: 0, constraints: "required and > 0 when compensation_model IN {ENGAGEMENT, HYBRID}", description: "Per-month ceiling on the engagement component" }
      - { name: compensation_floor_cents, type: number, source: computed, default: 0, description: "Derived floor: FIXED -> monthly_fixed_fee_cents * TERM_MONTHS; ENGAGEMENT -> 0; HYBRID -> guaranteed_compensation_cents * TERM_MONTHS" }
      - { name: payable_compensation_cents, type: number, source: computed, default: 0, description: "Total compensation owed for the term under licensing_compensation, two decimals" }
      - { name: term_start_date, type: datetime, source: input, description: "Inclusive start of the licensing term, ISO 8601 UTC" }
      - { name: term_end_date, type: datetime, source: input, description: "Exclusive end of the licensing term, ISO 8601 UTC; must be after term_start_date" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SIGNED | LIVE | EXPIRING | COMPLETED", description: "Deal lifecycle" }
      - { name: signed_at, type: datetime, source: system, description: "Set when the deal is signed" }
      - { name: add_effective_date, type: datetime, source: input, description: "Planned catalog add date; must fall inside [term_start_date, term_end_date)" }
      - { name: removal_effective_date, type: datetime, source: system, description: "Set when the deal enters EXPIRING; two days before term_end_date" }
      - { name: entry_id, type: string, source: computed, description: "Id of the first CatalogEntry synthesized when the deal goes LIVE" }
      - { name: maintenances_in_window, type: integer, source: computed, default: 0, description: "Count of CatalogMaintenance rows whose window overlaps [term_start_date, term_end_date)" }

  - name: CatalogEntry
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the catalogued title" }
      - { name: deal_id, type: string, source: system, description: "FK -> LicensingDeal.id; the deal that put this title in the catalog" }
      - { name: region_code, type: string, source: input, description: "FK -> Region.id; the region this entry makes the title available in" }
      - { name: tiers, type: array, source: input, constraints: "non-empty subset of {ESSENTIAL, PREMIUM, ULTIMATE}", description: "Tiers whose subscribers may play this entry" }
      - { name: announced_add_date, type: datetime, source: input, description: "Date the addition was published to subscribers" }
      - { name: actual_add_date, type: datetime, source: system, description: "Set when the entry transitions PLANNED -> ADDED" }
      - { name: removal_date, type: datetime, source: input, description: "Half-open end of the playable interval; must be > actual_add_date once ADDED" }
      - { name: release_class, type: enum, source: input, constraints: "DAY_ONE | BACK_CATALOG | CATALOG_ADD", description: "Whether this entry is a day-one release, an evergreen back-catalog title, or a later addition" }
      - { name: popularity_index_cents, type: integer, source: input, constraints: "0 <= value <= 10000", description: "Instantaneous popularity score in centi-units (10000 == 100.00 index points) used for capacity weighting" }
      - { name: popularity_index_cents_30d_avg, type: integer, source: input, constraints: "0 <= value <= 10000", description: "Trailing 30-day average popularity score in centi-units; the sustained-window capacity variant's input" }
      - { name: removal_notice_days, type: integer, source: computed, description: "Whole days between announced_add_date and removal_date, derived at publish" }
      - { name: subscriber_impact_count, type: integer, source: computed, default: 0, description: "Count of Entitlement rows in status IN {ACTIVE, GRACE} resolving to this entry" }
      - { name: status, type: enum, source: system, default: PLANNED, constraints: "PLANNED | ADDED | REMOVING | DELISTED", description: "Catalog rotation lifecycle; the add dimension (PLANNED -> ADDED) and the use dimension (ADDED <-> REMOVING) are tracked on this one field" }

  - name: CatalogMaintenance
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "FK -> Region.id; the region whose streaming fleet is under maintenance" }
      - { name: maintenance_start, type: datetime, source: input, description: "Inclusive start of the maintenance window, ISO 8601 UTC" }
      - { name: maintenance_end, type: datetime, source: input, description: "Exclusive end of the maintenance window, ISO 8601 UTC; must be after maintenance_start" }
      - { name: capacity_reduction_pct, type: number, source: input, constraints: "0 <= value <= 1", description: "Fraction of the region's streaming slots withdrawn for the duration of the window" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | ACTIVE | COMPLETED", description: "Maintenance lifecycle; driven by the logical clock" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, constraints: "unique, non-empty", description: "Account email; the login identity" }
      - { name: display_name, type: string, source: input, description: "Subscriber-chosen display name" }
      - { name: home_region_code, type: string, source: input, description: "FK -> Region.id; region the subscriber pays in and reads availability from" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE", description: "Account lifecycle; ACTIVE is the only value the declared surface produces" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Store credit available to offset purchases" }

  - name: Subscription
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id; the owning account" }
      - { name: tier_code, type: enum, source: input, constraints: "ESSENTIAL | PREMIUM | ULTIMATE", description: "Tier the subscription was opened at; frozen at start" }
      - { name: billing_period, type: enum, source: input, constraints: "MONTHLY | ANNUAL", description: "Billing cadence" }
      - { name: prepay_amount_cents, type: number, source: input, default: 0, description: "Annual amount paid up front; zero for MONTHLY" }
      - { name: unpaid_months, type: integer, source: computed, default: 0, description: "Number of billing months whose base charge is still outstanding" }
      - { name: monthly_bill_cents, type: number, source: computed, default: 0, description: "Regional monthly price for the subscription's tier and region (regional_monthly_price)" }
      - { name: monthly_engaged_hours_avg, type: number, source: computed, default: 0, description: "Exact mean of this-month EngagementEvent.normalized_hours; the pre-rounding input to engagement_score" }
      - { name: engagement_score, type: number, source: computed, default: 0, constraints: "0 <= value <= 100", description: "Engagement score in index points, exactly two decimals" }
      - { name: billing_status, type: enum, source: system, default: PENDING, constraints: "PENDING | PAID | FAILED", description: "Payment dimension of the parallel state" }
      - { name: lifecycle_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | GRACE | CANCELLED", description: "Entitlement dimension of the parallel state" }
      - { name: cancellation_reason, type: enum, source: system, constraints: "USER_INITIATED", description: "Set only when lifecycle_status becomes CANCELLED through POST /catalog/subscriptions/{subscription_id}/cancel" }

  - name: Entitlement
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; the subscription that produced this entitlement" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title this entitlement covers" }
      - { name: region_code, type: string, source: input, description: "FK -> Region.id; the region the entitlement was resolved in" }
      - { name: entry_id, type: string, source: system, description: "FK -> CatalogEntry.id; the entry selected by the selector policy at resolve time, or null when no entry was eligible" }
      - { name: access_channels, type: array, source: computed, constraints: "subset of {CONSOLE, PC, CLOUD, ONLINE_PLAY}", description: "Channels unlocked; derived from the subscription's tier flags" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | GRACE | REVOKED", description: "Entitlement lifecycle" }
      - { name: retained_until, type: datetime, source: computed, description: "Non-null only when the entitlement survives a catalog removal; equals entry.removal_date + tier.discount_retention_days" }

  - name: EngagementEvent
    parent: Subscription
    common_fields: false
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; the session's subscription" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title played" }
      - { name: session_hours, type: number, source: input, constraints: ">= 0", description: "Raw session length in hours, before the engagement multiplier" }
      - { name: channel, type: enum, source: input, constraints: "CONSOLE | PC | CLOUD | ONLINE_PLAY", description: "How the subscriber played" }
      - { name: engagement_multiplier, type: number, source: input, constraints: "> 0", description: "Per-session weight, e.g. 1.5 for a day-one title during its launch window" }
      - { name: normalized_hours, type: number, source: computed, description: "session_hours * engagement_multiplier, 4 decimal places round_half_up, fixed at write time" }

  - name: Purchase
    parent: Subscriber
    common_fields: true
    fields:
      - { name: subscriber_id, type: string, source: input, description: "FK -> Subscriber.id; the buying account" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title bought outright" }
      - { name: entry_id, type: string, source: input, description: "FK -> CatalogEntry.id; the entry whose release_class value selects the purchase variant" }
      - { name: quantity, type: integer, source: input, default: 1, constraints: ">= 1", description: "Units bought; scales the unit-sales credit only" }
      - { name: region_code, type: string, source: input, description: "FK -> Region.id; the region the price is presented in" }
      - { name: list_price_cents_per_unit, type: number, source: computed, description: "Regional list price per unit: title.list_price_cents * region.price_multiplier" }
      - { name: discount_pct_applied, type: number, source: computed, default: 0, constraints: "0 <= value <= 0.4", precision: "2 decimal places, round_half_up", description: "Total effective discount; positive only under the retention-discount variant" }
      - { name: wallet_applied_cents, type: integer, source: computed, default: 0, description: "Wallet credit consumed by this purchase; retained on the row after a reversal so the conserved quantity can be audited" }
      - { name: wallet_restored_cents, type: integer, source: computed, default: 0, description: "Credit returned to the subscriber by the reversal; zero while the purchase is COMPLETED" }
      - { name: unit_sales_credit_cents, type: number, source: computed, default: 0, description: "Revenue credited back to the title's unit-sales ledger" }
      - { name: total_charged_cents, type: number, source: computed, description: "Amount collected from the card after any discount and wallet credit" }
      - { name: status, type: enum, source: system, default: COMPLETED, constraints: "COMPLETED | REFUNDED", description: "Purchase lifecycle" }

  - name: AvailabilityProjection
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title whose day-one tradeoff is projected" }
      - { name: region_code, type: string, source: input, description: "FK -> Region.id; the region the projection is scoped to" }
      - { name: release_class, type: enum, source: input, constraints: "DAY_ONE | BACK_CATALOG | CATALOG_ADD", description: "Class the title would be released under" }
      - { name: launch_subscriber_count, type: integer, source: input, constraints: ">= 0", description: "Subscribers expected to engage during the launch window" }
      - { name: tier_step_count, type: integer, source: input, constraints: ">= 0", description: "Number of tier steps above the release's lowest tier" }
      - { name: projected_unit_sales_units, type: integer, source: input, constraints: ">= 0", description: "Units projected to sell outright in the region over the horizon" }
      - { name: projected_subscription_value_cents, type: number, source: computed, description: "Forward-looking subscription upside of a day-one release" }
      - { name: projected_cannibalized_unit_sales_cents, type: number, source: computed, description: "Unit-sales downside of the same release" }
      - { name: projected_net_value_cents, type: number, source: computed, description: "projected_subscription_value_cents - projected_cannibalized_unit_sales_cents" }
      - { name: decision, type: enum, source: computed, constraints: "APPROVE_DAY_ONE | HOLD_FOR_CATALOG | REJECT_DAY_ONE", description: "Derived release decision from the pinned decision ladder" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | FINALIZED", description: "Projection lifecycle" }

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }# =============================================================================
# §1.2 State Machine Table (6 machines: 1 cyclic, 1 parallel-dimension, 1 revert)
# =============================================================================
state_machines:

  - entity: LicensingDeal
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /licensing-deals/{id}/sign"
        actor: CatalogAdmin
        preconditions:
          - "Publisher.status == ACTIVE"
          - "term_end_date > term_start_date"
          - "compensation_model field set matches the model: FIXED needs monthly_fixed_fee_cents > 0; ENGAGEMENT needs engagement_rate_cents_per_hour > 0 and monthly_engagement_cap_cents > 0; HYBRID needs guaranteed_compensation_cents > 0 and monthly_engagement_cap_cents > 0"
          - "expected_title_version matches Title.version (optimistic concurrency)"
        side_effects:
          - "signed_at = logical clock now"
          - "compensation_floor_cents recomputed"
          - "payable_compensation_cents recomputed"
          - "Publisher.lifetime_licensing_cost_cents recomputed"
          - "Publisher.deal_count recomputed"
          - "increments Title.version by 1"

      - from: SIGNED
        to: LIVE
        trigger: "POST /_clock/set_current_utc (clock advance reaches term_start_date)"
        actor: system
        preconditions:
          - "now >= term_start_date"
        side_effects:
          - "CatalogEntry rows may now be created and published against this deal"

      - from: LIVE
        to: EXPIRING
        trigger: "POST /_clock/set_current_utc (clock advance reaches removal_effective_date)"
        actor: system
        preconditions:
          - "now >= removal_effective_date"
          - "removal_effective_date == term_end_date - 2 days"
        side_effects:
          - "every CatalogEntry of this deal with status == ADDED flips status -> REMOVING (admin switch)"

      - from: EXPIRING
        to: LIVE
        trigger: "POST /licensing-deals/{id}/renew (term extended before term_end_date)"
        actor: CatalogAdmin
        preconditions:
          - "request renew_term_end_date > term_end_date"
          - "logical clock now < term_end_date"
        side_effects:
          - "term_end_date extended; removal_effective_date recomputed as the new term_end_date - 2 days"
          - "payable_compensation_cents recomputed against the longer term"
          - "every CatalogEntry of this deal with status == REMOVING reverts to ADDED (revert)"
          - "compensation_floor_cents recomputed against the longer term"
          - "Publisher.lifetime_licensing_cost_cents recomputed"

      - from: EXPIRING
        to: COMPLETED
        trigger: "POST /_clock/set_current_utc (clock advance reaches term_end_date)"
        actor: system
        preconditions:
          - "now >= term_end_date"
        side_effects:
          - "every CatalogEntry of this deal with status IN {ADDED, REMOVING} flips status -> DELISTED (CASCADE C1 hop 2)"
          - "CASCADE C1 hop 3: for each such entry, every Entitlement with entry_id == entry and status IN {ACTIVE, GRACE} flips status -> REVOKED, unless entry.release_class == BACK_CATALOG (RETENTION_ALWAYS_BACK_CATALOG) or now <= entry.removal_date + SubscriptionTier.discount_retention_days - 1 second (STRICT_RETENTION_EXPIRY); retained rows stay ACTIVE with retained_until = entry.removal_date + SubscriptionTier.discount_retention_days"
          - "CASCADE C1 hop 3: CatalogEntry.subscriber_impact_count recomputed for every delisted entry"
          - "Publisher.deal_count recomputed; Publisher.lifetime_licensing_cost_cents recomputed"

  - entity: CatalogEntry
    initial_state: PLANNED
    terminal_states: [DELISTED]
    note: "Cyclic rotation: ADDED -> REMOVING -> ADDED (announcement revert) and ADDED -> REMOVING -> DELISTED (termination)."
    transitions:
      - from: PLANNED
        to: ADDED
        trigger: "POST /catalog-entries/{id}/publish"
        actor: CatalogAdmin
        preconditions:
          - "LicensingDeal.status IN {SIGNED, LIVE}"
          - "Publisher.status == ACTIVE"
          - "region occupancy ceiling not exhausted: count(CatalogEntry in region_code with status IN {ADDED, REMOVING}) < Region.availability_ceiling_titles"
          - "every value in tiers is at or above Region.catalog_tier_floor"
          - "title.platform_set contains CONSOLE whenever release_class == DAY_ONE"
          - "title.platform_set contains CLOUD whenever CLOUD is present in the tier access flags of any tier in `tiers`"
        side_effects:
          - "actual_add_date = logical clock now"
          - "removal_notice_days recomputed"
          - "for each Subscription whose tier_code is in this entry's tiers and whose region_code == this entry's region_code, an Entitlement row for (subscription, title, region) is resolved and set ACTIVE; a Subscription whose tier grant is suspended (billing_status == FAILED) resolves to GRACE instead"
          - "Title.weighted_engagement_score recomputed when the title is RELEASED"
          - "Title.status becomes RELEASED if it was DRAFT"

      - from: ADDED
        to: REMOVING
        trigger: "POST /catalog-entries/{id}/announce-removal"
        actor: CatalogAdmin
        preconditions:
          - "removal_date > actual_add_date"
          - "removal_notice_days >= the class minimum (DAY_ONE 14, CATALOG_ADD 7, BACK_CATALOG 0), measured from announced_add_date to removal_date"
        side_effects:
          - "removal notice published to subscribers"
          - "subscriber_impact_count recomputed"
          - "removal_notice_announced_at = logical clock now"

      - from: REMOVING
        to: ADDED
        trigger: "POST /catalog-entries/{id}/cancel-removal"
        actor: CatalogAdmin
        preconditions:
          - "logical clock now < removal_date - 3 days (REMOVAL_REVERT_CUTOFF_DAYS, STRICT)"
        side_effects:
          - "removal notice withdrawn; removal_notice_announced_at cleared"
          - "subscriber_impact_count recomputed"

      - from: ADDED
        to: DELISTED
        trigger: "POST /catalog-entries/{id}/retire"
        actor: CatalogAdmin
        preconditions:
          - "status IN {ADDED, REMOVING}"
        side_effects:
          - "CASCADE C1 hop 2: every CatalogEntry of the same Title in region_code NA with status IN {ADDED, REMOVING} flips status -> DELISTED"
          - "CASCADE C1 hop 3: for each delisted entry, every Entitlement with entry_id == entry and status IN {ACTIVE, GRACE} flips status -> REVOKED unless the retention clause holds (BACK_CATALOG always retains; otherwise retained iff now <= entry.removal_date + SubscriptionTier.discount_retention_days - 1 second, in which case the row stays ACTIVE with retained_until set)"
          - "CASCADE C1 hop 3: CatalogEntry.subscriber_impact_count recomputed for every delisted entry"
          - "Title.weighted_engagement_score recomputed"
          - "Title.status becomes RETIRED when the title has no CatalogEntry with status IN {ADDED, REMOVING} anywhere"

      - from: PLANNED
        to: DELISTED
        trigger: "POST /catalog-entries/{id}/retire"
        actor: CatalogAdmin
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "no catalog membership was ever created, so no Entitlement side effects fire"

  - entity: Title
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /catalog-entries/{id}/publish for any entry of this title"
        actor: system
        preconditions:
          - "at least one CatalogEntry of this title reaches ADDED"
        side_effects:
          - "Title.weighted_engagement_score recomputed"

      - from: RELEASED
        to: RETIRED
        trigger: "POST /catalog-entries/{id}/retire, or the clock-driven deal COMPLETED cascade, when it leaves the title with no CatalogEntry in status IN {ADDED, REMOVING}"
        actor: CatalogAdmin
        preconditions:
          - "no CatalogEntry of this title has status IN {ADDED, REMOVING} after the cascade completes"
        side_effects:
          - "Title.weighted_engagement_score recomputed to 0.00 (no ADDED entries contribute)"
          - "the title stops participating in day-one projections"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Parallel state dimensions on one row: billing_status (PENDING -> PAID -> FAILED -> PAID) and lifecycle_status (ACTIVE -> GRACE -> ACTIVE -> CANCELLED).
      The anchor &activation_180 sits on the GRACE -> ACTIVE lifecycle transition so the cyclic dimension ACTIVE -> GRACE -> ACTIVE is machine-readable in one place."
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /subscriptions/{id}/pay"
        actor: Subscriber
        preconditions:
          - "unpaid_months > 0"
        side_effects:
          - "unpaid_months decremented by 1"
          - "when unpaid_months reaches 0 the lifecycle dimension returns to ACTIVE (see &activation_180)"

      - from: PENDING
        to: FAILED
        trigger: "POST /_clock/set_current_utc (first charge attempt fails)"
        actor: system
        preconditions:
          - "unpaid_months == 0"
        side_effects:
          - "unpaid_months set to 1"
          - "lifecycle_status flips ACTIVE -> GRACE"
          - "every Entitlement of this subscription flips ACTIVE -> GRACE"

      - from: PAID
        to: FAILED
        trigger: "POST /_clock/set_current_utc (monthly renewal charge fails)"
        actor: system
        preconditions:
          - "billing_period == MONTHLY"
          - "now reaches the next renewal instant"
        side_effects:
          - "unpaid_months incremented by 1"
          - "lifecycle_status flips ACTIVE -> GRACE"
          - "every Entitlement of this subscription flips ACTIVE -> GRACE"

      - from: FAILED
        to: PAID
        trigger: "POST /subscriptions/{id}/pay (the outstanding month is settled)"
        actor: Subscriber
        preconditions:
          - "unpaid_months > 0"
        side_effects:
          - "unpaid_months decremented by 1"
          - "when unpaid_months reaches 0 the lifecycle dimension returns to ACTIVE (see &activation_180)"

      - from: &activation_180 GRACE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/pay, resolved when unpaid_months reaches 0"
        actor: system
        preconditions:
          - "unpaid_months == 0"
          - "Subscriber.status == ACTIVE"
        side_effects:
          - "every Entitlement of this subscription flips GRACE -> ACTIVE"
          - "CLOUD access is restored on those entitlements"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions: []
        side_effects:
          - "cancellation_reason = USER_INITIATED"
          - "CASCADE C2 hop 1 -> hop 2: every Entitlement of this subscription flips status -> REVOKED, with no retention clause and no time comparison"
          - "CASCADE C2 hop 3: CatalogEntry.subscriber_impact_count recomputed for every entry those entitlements named"
          - "SubscriptionTier.current_subscriber_count recomputed for this subscription's tier"

      - from: GRACE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions: []
        side_effects:
          - "cancellation_reason = USER_INITIATED"
          - "CASCADE C2 hop 1 -> hop 2: every Entitlement of this subscription flips status -> REVOKED, with no retention clause and no time comparison"
          - "CASCADE C2 hop 3: CatalogEntry.subscriber_impact_count recomputed; SubscriptionTier.current_subscriber_count recomputed"

  - entity: Entitlement
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /catalog/catalog-entries/{entry_id}/publish (re-resolution of an entitlement that already exists)"
        actor: EntitlementService
        preconditions:
          - "the selector policy produces the same winning CatalogEntry as the stored entry_id"
        side_effects:
          - "access_channels recomputed from the subscription's tier flags"
          - "at most one Entitlement row exists per (subscription_id, title_id, region_code)"

      - from: ACTIVE
        to: GRACE
        trigger: "system (Subscription.billing_status becomes FAILED)"
        actor: system
        preconditions:
          - "Subscription.billing_status == FAILED"
        side_effects:
          - "access_channels unchanged; CLOUD access is suspended while in GRACE"

      - from: &activation_181 GRACE
        to: ACTIVE
        trigger: "system (Subscription.billing_status returns to PAID with unpaid_months == 0)"
        actor: system
        preconditions:
          - "Subscription.billing_status == PAID"
          - "Subscription.unpaid_months == 0"
        side_effects:
          - "CLOUD access restored"

      - from: ACTIVE
        to: REVOKED
        trigger: "system (resolved entry delisted, CASCADE C1 hop 3) or POST /catalog/entitlements/{entitlement_id}/revoke"
        actor: system
        preconditions:
          - "entry.status == DELISTED"
          - "the retention clause does NOT hold: entry.release_class != BACK_CATALOG and now > entry.removal_date + SubscriptionTier.discount_retention_days - 1 second"
        side_effects:
          - "entry_id kept for audit; no play access remains"
          - "CatalogEntry.subscriber_impact_count recomputed (CASCADE C1 hop 3)"

      - from: REVOKED
        to: ACTIVE
        trigger: "POST /catalog/entitlements/{entitlement_id}/restore (compensating action, CatalogAdmin)"
        actor: CatalogAdmin
        preconditions:
          - "the entitlement's entry is still readable by this subscription: entry.status IN {ADDED, REMOVING}, or entry.release_class == BACK_CATALOG, or retained_until > now"
          - "Subscription.lifecycle_status != CANCELLED"
        side_effects:
          - "status returns to ACTIVE and access_channels recomputed from the tier flags"
          - "CatalogEntry.subscriber_impact_count recomputed back to its pre-revoke value"

      - from: GRACE
        to: REVOKED
        trigger: "system (Subscription.lifecycle_status becomes CANCELLED, CASCADE C2 hop 2)"
        actor: system
        preconditions:
          - "Subscription.lifecycle_status == CANCELLED"
        side_effects:
          - "all channels closed immediately, including any retained purchase access for catalog titles"

  - entity: CatalogMaintenance
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc (clock reaches maintenance_start)"
        actor: system
        preconditions:
          - "now >= maintenance_start"
        side_effects:
          - "the region's usable streaming slots are reduced by capacity_reduction_pct while this row is ACTIVE"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /_clock/set_current_utc (clock reaches maintenance_end)"
        actor: system
        preconditions:
          - "now >= maintenance_end"
        side_effects:
          - "the region's usable streaming slots are restored"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: sign-deal-stale-title
    parent_entity: Title
    write_endpoint: "POST /catalog/licensing-deals/{deal_id}/sign"
    occ_field: "expected_title_version"
    description: |
      Signing a LicensingDeal against a Title whose version has advanced since
      the client last observed it is rejected. Signing a second, competing deal
      for the same title is legitimate product behaviour — the catalog slot goes
      to whichever signature the client based on current state — so a writer
      whose view of the title predates the other signature must re-read the
      title before signing.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table (11 calculations)
# =============================================================================
calculations:

  - name: licensing_compensation
    trigger: "recomputed whenever a LicensingDeal enters SIGNED and whenever the logical clock crosses a term month boundary"
    algorithm: tiered_pricing
    formula: |
      TERM_MONTHS = (term_end.year*12 + term_end.month) - (term_start.year*12 + term_start.month)
      month_hours[m] = sum(EngagementEvent.normalized_hours for events of the deal's title whose
                           created_at falls in calendar month m of [term_start_date, term_end_date))
      raw_monthly[m] = month_hours[m] * engagement_rate_cents_per_hour
      hour_component_monthly[m] = min(raw_monthly[m], monthly_engagement_cap_cents)
      fixed_component = monthly_fixed_fee_cents * TERM_MONTHS
      engagement_component = sum(hour_component_monthly[m] for m in 1..TERM_MONTHS)
      if compensation_model == FIXED:
          total_cents = fixed_component
      elif compensation_model == ENGAGEMENT:
          total_cents = engagement_component
      else:  # HYBRID
          share_component = engagement_component * HYBRID_ENGAGEMENT_SHARE
          floor_component = guaranteed_compensation_cents * TERM_MONTHS
          total_cents = max(fixed_component + share_component, floor_component)
      payable_cents = round_half_up(total_cents, 2)
      EVALUATION ORDER IS PINNED: fixed_component and floor_component are each formed by multiplication,
      share_component is formed on the SUMMED capped engagement component (never per month), the cap is
      applied per month BEFORE summing, and exactly one rounding happens at the very end.
    input_set: "EngagementEvent rows of the deal's title with created_at inside [term_start_date, term_end_date); events outside the term are excluded; LicensingDeal rows in status IN {SIGNED, LIVE, EXPIRING, COMPLETED} participate; DRAFT and TERMINATED deals are excluded"
    constants:
      HYBRID_ENGAGEMENT_SHARE: 0.25
      TERM_WINDOW: "half-open [term_start_date, term_end_date)"
      MONTH_BUCKETING: "calendar month of created_at; an event landing exactly on term_start_date belongs to month 1, an event landing exactly on term_end_date is excluded"
      TIE_BREAK: "monthly sums are order-insensitive; no tie-break applies"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: engagement_share_rounded_per_month
        when: "the statement/forecast view rendered to the publisher (HYBRID only)"
        difference: "the share is formed per month on the capped monthly component instead of once on the summed component — share_monthly[m] = hour_component_monthly[m] * 0.25 with no intermediate rounding, then shared_component = round_half_up(sum(share_monthly), 2); the monthly cap is therefore applied to the month's component rather than to the term total, so a single month at the cap no longer suppresses the other months' shares"

  - name: engagement_score
    trigger: "recomputed on every EngagementEvent creation and on every month rollover driven by POST /_clock/set_current_utc"
    algorithm: weighted_scoring
    formula: |
      window = [month_start, month_start + 1 calendar month) where month_start is the first instant of
               the logical clock's current calendar month in UTC
      events = EngagementEvent rows of this subscription with created_at inside `window`
      monthly_engaged_hours_avg = sum(events.normalized_hours) / count(events)   # exact, unrounded; 0 when empty
      engagement_score = min(ENGAGEMENT_SCORE_CEILING, round_half_up(monthly_engaged_hours_avg, 2))
      normalized_hours of a row is fixed at write time as round_half_up(session_hours * engagement_multiplier, 4)
      and is NEVER recomputed, even when the clock advances.
    input_set: "EngagementEvent rows with created_at inside the current calendar month, for this subscription only; rows in earlier months leave the window but are never deleted"
    constants:
      ENGAGEMENT_SCORE_CEILING: 100.00
      HOUR_PRECISION: "4 decimal places, round_half_up, applied once at event write time"
      EMPTY_WINDOW: "the mean of an empty set is 0.00, not an error"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: seven_place_half_even_carry
        when: "the analyst export, which reproduces the legacy spreadsheet column"
        difference: "the mean is first quantised to 7 decimal places with round-half-even and only then rounded to 2 places with round-half-up; the two variants disagree only when the exact mean is a two-decimal tie (e.g. 7.345), where the export column reports 7.34 and the base calculation reports 7.35"

  - name: catalog_rotation_availability
    trigger: "computed on every GET /entitlements and on every entry publish, announce-removal and retire"
    algorithm: interval_merge
    formula: |
      playable(entry, t) iff
          entry.status IN {ADDED, REMOVING}
          AND entry.region_code == viewer.region_code
          AND t >= entry.actual_add_date
          AND t <  entry.removal_date          # HALF-OPEN [actual_add_date, removal_date)
      readable(subscription, t) = union of
          { entry : entry.region_code == subscription.region_code,
                    subscription.tier_code IN entry.tiers,
                    playable(entry, t) }
          { entry : entry.status == DELISTED AND entry.release_class == BACK_CATALOG }
          { entry : exists Entitlement e with e.entry_id == entry.id
                    AND e.status == ACTIVE AND e.retained_until > t }
    input_set: "CatalogEntry rows in status IN {PLANNED, ADDED, REMOVING} plus DELISTED rows satisfying the retention or back-catalog clause; a DELISTED row whose release_class is not BACK_CATALOG leaves the set unless an ACTIVE retained Entitlement still names it — just-delisted and historically-delisted back-catalog rows are therefore treated identically"
    constants:
      INTERVAL_SEMANTICS: "half-open [actual_add_date, removal_date)"
      FORBIDDEN_INCLUSION: "an entry whose removal_date equals the evaluation instant is NOT playable in this variant"
    precision: "instant comparison at second granularity, ISO 8601 UTC"
    variants:
      - name: trailing_inclusive_calendar_view
        when: "the subscriber-facing leaving-soon shelf, which renders whole calendar days"
        difference: "removal_date is treated as INCLUSIVE (t <= removal_date), so the entry is still listed on its removal day; the two views disagree at the removal_date instant and across the whole day before it"

  - name: member_purchase_discount
    trigger: "computed at POST /purchases and re-exposed unchanged on GET /purchases/{id}"
    algorithm: combinatorial
    formula: |
      regional_list_price_cents = round_half_up(Title.list_price_cents * Region.price_multiplier, 2)
      bonus = RETENTION_DISCOUNT_BONUS (0.05) when the named CatalogEntry.release_class == BACK_CATALOG, else 0
      applied_pct = min(SubscriptionTier.member_discount_pct + bonus, MAX_MEMBER_DISCOUNT_PCT)
      discount_amount_cents = round_half_up(regional_list_price_cents * applied_pct, 2)          # ZERO under the base variant
      subtotal_cents = regional_list_price_cents - discount_amount_cents
      wallet_offset_cents = min(Subscriber.wallet_credit_cents, subtotal_cents)
      total_charged_cents = subtotal_cents - wallet_offset_cents
      unit_sales_credit_cents = total_charged_cents * Purchase.quantity
      ROUNDING ORDER IS PINNED: the discount amount is rounded first and subtracted second; the list
      price is never re-rounded after the subtraction, and the wallet subtraction is never rounded.
    input_set: "exactly one Title, exactly one Region (the buyer's home region) and exactly one CatalogEntry named by entry_id; wallet credit is read from the buying Subscriber at the instant of purchase"
    constants:
      RETENTION_DISCOUNT_BONUS: 0.05
      MAX_MEMBER_DISCOUNT_PCT: 0.40
      WALLET_APPLICATION_CAP: "wallet credit may never exceed the discounted subtotal"
      BASE_VARIANT_DISCOUNT: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: retention_discount_on_back_catalog
        when: "the purchase names a CatalogEntry whose release_class is BACK_CATALOG"
        difference: "the tier's member_discount_pct plus the 0.05 retention bonus is applied (capped at 0.40 and rounded with round_half_up at 2 places), so a BACK_CATALOG purchase is strictly cheaper than the otherwise identical CATALOG_ADD purchase; the delta is exactly round_half_up(regional_list_price_cents * (member_discount_pct + 0.05), 2)"

  - name: day_one_cannibalization
    trigger: "computed when an AvailabilityProjection is created and re-derived when it is finalized"
    algorithm: forward_looking
    formula: |
      regional_list_price_cents = round_half_up(Title.list_price_cents * Region.price_multiplier, 2)
      # ---- provisional variant (forward_looking, base) ----
      gross_cents = AvailabilityProjection.projected_unit_sales_units * regional_list_price_cents
      projected_cannibalized_unit_sales_cents = round_half_up(gross_cents * UNIT_SALES_CANNIBALIZATION_FRACTION, 2)
    input_set: "the base variant uses the projection's projected_unit_sales_units and the title's current regional list price; the final variant uses Purchase rows only"
    constants:
      UNIT_SALES_CANNIBALIZATION_FRACTION: 0.30
      PURCHASE_FILTER: "status == COMPLETED only; REFUNDED rows are excluded"
      CHRONOLOGICAL_ORDER: "Purchase.created_at ASC"
      CHRONOLOGICAL_TIE_BREAK: "two rows sharing created_at are accumulated in persisted insertion order, which is stable across re-reads"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: chronological_actual_purchases
        when: "the reconciled view produced at finalization, once real sales exist"
        difference: "the basis becomes running_cents, the accumulator of Purchase.total_charged_cents for this title and region (status COMPLETED, created_at ASC); the accumulator is multiplied once by UNIT_SALES_CANNIBALIZATION_FRACTION and rounded once at the end, so the delta against the provisional figure is exactly 0.30 * sum of the discounts and wallet credits actually granted"

  - name: day_one_subscription_value
    trigger: "computed when an AvailabilityProjection is created"
    algorithm: tiered_pricing
    formula: |
      deal = the LicensingDeal that is LIVE for this title, in the projection's region
      TERM_MONTHS = (deal.term_end.month - deal.term_start.month) counting whole calendar months
      hours_per_subscriber = Title.unit_sales_30d * HOURS_PER_LOST_SALE
      raw_hours = hours_per_subscriber * AvailabilityProjection.launch_subscriber_count
      theoretical_gross_cents = raw_hours * deal.engagement_rate_cents_per_hour
      monthly_cap_cents = deal.monthly_engagement_cap_cents
      engagement_cap_cents = monthly_cap_cents * TERM_MONTHS
      capped_engagement_cents = min(theoretical_gross_cents, engagement_cap_cents)
      net_new_cents = round_half_up(capped_engagement_cents * NET_NEW_SUBSCRIBER_FRACTION, 2)
      tier_uplift_cents = min(round_half_up(capped_engagement_cents * TIER_UPLIFT_RATE * AvailabilityProjection.tier_step_count, 2), TIER_UPLIFT_CAP_CENTS)
      projected_subscription_value_cents = net_new_cents + tier_uplift_cents
      projected_net_value_cents = projected_subscription_value_cents - projected_cannibalized_unit_sales_cents
      decision, evaluated strictly in this order:
        1. if projected_net_value_cents >= DAY_ONE_APPROVE_THRESHOLD_CENTS
              AND Title.day_one_eligible == true
              AND AvailabilityProjection.release_class == DAY_ONE        -> APPROVE_DAY_ONE
        2. elif projected_net_value_cents >= HOLD_THRESHOLD_CENTS        -> HOLD_FOR_CATALOG
        3. else                                                          -> REJECT_DAY_ONE
    input_set: "the binding deal's rate and cap, the title's unit_sales_30d, and the projection's launch_subscriber_count and tier_step_count; terms are measured in whole calendar months, so a one-day term spans one month"
    constants:
      HOURS_PER_LOST_SALE: 1.25
      NET_NEW_SUBSCRIBER_FRACTION: 0.60
      TIER_UPLIFT_RATE: 0.05
      TIER_UPLIFT_CAP_CENTS: 250000
      DAY_ONE_APPROVE_THRESHOLD_CENTS: 0
      HOLD_THRESHOLD_CENTS: -50000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: cap_on_the_share_not_the_gross
        when: "the deal-desk view used when renegotiating an existing agreement"
        difference: "the monthly cap is applied to the engagement SHARE (capped_engagement_cents * HYBRID_ENGAGEMENT_SHARE) rather than to the gross engagement, so the capped term is a quarter of the base variant's and net_new_cents is correspondingly smaller whenever the cap binds"

  - name: regional_monthly_price
    trigger: "computed at POST /catalog/subscriptions for the subscription being opened"
    algorithm: threshold
    formula: |
      effective_multiplier = Region.price_multiplier
      if Region.price_multiplier > PARITY_MULTIPLIER_THRESHOLD:
          effective_multiplier = round_half_up(Region.price_multiplier * PARITY_BLEND_FACTOR, 4)
      effective_multiplier = max(effective_multiplier, REGIONAL_MULTIPLIER_MIN)
      regional_monthly_price_cents = round_half_up(SubscriptionTier.monthly_price_cents * effective_multiplier, 2)
      The comparison is STRICT: a multiplier of exactly 1.50 uses the raw multiplier.
    input_set: "one SubscriptionTier and one Region; the tier's monthly_price_cents is the global default and is never mutated by this calculation; price_multiplier < 0.50 is rejected at POST /regions"
    constants:
      PARITY_MULTIPLIER_THRESHOLD: 1.50
      PARITY_BLEND_FACTOR: 0.90
      REGIONAL_MULTIPLIER_MIN: 0.50
    precision: "2 decimal places, round_half_up"
    variants:
      - name: blend_above_threshold_inclusive
        when: "the historical parity report, which compared with >="
        difference: "a region whose multiplier is exactly 1.50 takes the blended path, so every tier's regional price in such a region is 10% lower than the base variant's"

  - name: cloud_capacity_allocation
    trigger: "computed on GET /regions/{region_code}/capacity and on every entry publish, retire and maintenance transition"
    algorithm: threshold
    formula: |
      active = CatalogEntry rows with region_code == R and
               now >= actual_add_date AND now < removal_date          # half-open, same predicate as catalog_rotation_availability
      base_slots = sum(entry.popularity_index_cents * SLOTS_PER_INDEX_CENT for entry in active)
      launch_entries = { entry in active : now < entry.actual_add_date + LAUNCH_SPIKE_WINDOW_DAYS }
      spike_slots = sum(entry.popularity_index_cents * SLOTS_PER_INDEX_CENT * LAUNCH_SPIKE_MULTIPLIER_EXCESS for entry in launch_entries)
      raw_required_slots = base_slots + spike_slots + OVERHEAD_SLOTS_PER_REGION
      usable_slots = Region.availability_ceiling_titles * SLOTS_PER_CEILING_UNIT
      if any CatalogMaintenance row for R has maintenance_start <= now < maintenance_end:
          usable_slots = round_half_up(usable_slots * (1 - capacity_reduction_pct), 2)
      deficit_slots = raw_required_slots - usable_slots
      utilization_pct = 0.00 when usable_slots == 0 else round_half_up(raw_required_slots / usable_slots * 100, 2)
      status = OVER_CAPACITY when raw_required_slots > usable_slots else WITHIN_CAPACITY    # STRICT >
    input_set: "CatalogEntry rows satisfying the half-open active predicate for one region, plus at most one ACTIVE CatalogMaintenance row per region; PLANNED and DELISTED entries contribute zero slots"
    constants:
      SLOTS_PER_INDEX_CENT: 0.5
      LAUNCH_SPIKE_WINDOW_DAYS: 14
      LAUNCH_SPIKE_MULTIPLIER_EXCESS: 0.40
      OVERHEAD_SLOTS_PER_REGION: 200
      SLOTS_PER_CEILING_UNIT: 30
    precision: "2 decimal places, round_half_up on the utilisation and on the reduced usable slots; slot counts are exact"
    variants:
      - name: sustained_window_basis
        when: "the monthly fleet-planning view"
        difference: "the basis becomes entry.popularity_index_cents_30d_avg instead of entry.popularity_index_cents and the launch-spike term is dropped entirely, so a title inside its first 14 days inflates the base variant but not this one"

  - name: conversion_retention_index
    trigger: "computed when GET /tiers/{tier_code}/analytics is read"
    algorithm: weighted_scoring
    formula: |
      normalized_engagement = min(100.00, round_half_up(Subscription.monthly_engaged_hours_avg / ENGAGEMENT_HOURS_PER_INDEX_POINT * 100, 2))
      retention_pct = round_half_up(100 * count(Subscription rows of the tier with lifecycle_status IN {ACTIVE, GRACE})
                                        / max(1, SubscriptionTier.current_subscriber_count), 2)
      conversion_pct = round_half_up(100 * count(Subscription rows of the tier with at least one Purchase row)
                                        / max(1, SubscriptionTier.current_subscriber_count), 2)
      conversion_retention_index = round_half_up(
          RETENTION_WEIGHT * retention_pct
        + CONVERSION_WEIGHT * conversion_pct
        + ENGAGEMENT_WEIGHT * normalized_engagement, 2)
    input_set: "Subscription rows whose tier_code equals the requested tier; GRACE rows count toward retention and toward conversion alike, since the purchase predicate tests only for the existence of a Purchase row"
    constants:
      RETENTION_WEIGHT: 0.60
      CONVERSION_WEIGHT: 0.25
      ENGAGEMENT_WEIGHT: 0.15
      ENGAGEMENT_HOURS_PER_INDEX_POINT: 2.0
      TIE_BREAK: "the index is a read-only aggregate and never feeds a selector, ranking or tie-break"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: holdout_calibrated_weights
        when: "the holdout-calibrated board view"
        difference: "the weights move to 0.50 / 0.30 / 0.20 and normalized_engagement is replaced by Subscription.engagement_score, which is already ceilinged and rounded, so the two weight vectors produce different indices for the same population"

  - name: publisher_deal_rollup
    trigger: "recomputed on every LicensingDeal sign and on every clock-driven deal status change"
    algorithm: aggregation
    formula: |
      Publisher.deal_count = count(LicensingDeal rows with publisher_id == P and status IN {SIGNED, LIVE, EXPIRING})
      Publisher.lifetime_licensing_cost_cents = round_half_up(
          sum(LicensingDeal.compensation_floor_cents for rows with publisher_id == P
              and status IN {SIGNED, LIVE, EXPIRING, COMPLETED}), 2)
      LicensingDeal.compensation_floor_cents = monthly_fixed_fee_cents * TERM_MONTHS       when compensation_model == FIXED
                                            = 0                                            when compensation_model == ENGAGEMENT
                                            = guaranteed_compensation_cents * TERM_MONTHS  when compensation_model == HYBRID
    input_set: "LicensingDeal rows of one publisher; DRAFT rows are counted by neither figure; a DRAFT deal contributes nothing until it is signed"
    constants:
      DEAL_COUNT_STATUSES: [SIGNED, LIVE, EXPIRING]
      COST_STATUSES: [SIGNED, LIVE, EXPIRING, COMPLETED]
      TIE_BREAK: "sums and counts are order-insensitive; no tie-break applies"
    precision: "2 decimal places, round_half_up"

  - name: weighted_engagement_score
    trigger: "recomputed on every entry publish and every entry retire for the affected title"
    algorithm: aggregation
    formula: |
      Title.weighted_engagement_score = round_half_up(
          sum(entry.popularity_index_cents / 100 * TIER_WEIGHT[entry.tiers] for entry in entries), 2)
      entries = CatalogEntry rows of this title with status IN {ADDED, REMOVING}
      TIER_WEIGHT[entry.tiers] = max over t in entry.tiers of TIER_WEIGHTS[t],
      TIER_WEIGHTS = {ESSENTIAL: 1.00, PREMIUM: 1.50, ULTIMATE: 2.00}
    input_set: "CatalogEntry rows of one title in status IN {ADDED, REMOVING}; PLANNED and DELISTED rows contribute zero"
    constants:
      TIER_WEIGHTS: { ESSENTIAL: 1.00, PREMIUM: 1.50, ULTIMATE: 2.00 }
      TIE_BREAK: "sums are order-insensitive; the tier weight is a max, not an average, so a multi-tier entry is weighted by its highest tier only"
    precision: "2 decimal places, round_half_up"

  - name: catalog_removal_notice
    trigger: "computed at POST /catalog-entries and POST /catalog-entries/{id}/announce-removal"
    algorithm: threshold
    formula: |
      minimum_notice_days = DAY_ONE -> 14 | CATALOG_ADD -> 7 | BACK_CATALOG -> 0
      removal_notice_days = whole days between announced_add_date and removal_date,
                            computed as (removal_date - announced_add_date) in seconds / 86400, truncated
      announcement is permitted iff removal_notice_days >= minimum_notice_days   # INCLUSIVE at the boundary
      removal is permitted iff removal_date > actual_add_date                    # STRICT
      reverting an announcement is permitted iff
          now < removal_date - REMOVAL_REVERT_CUTOFF_DAYS * 86400                # STRICT
    input_set: "one CatalogEntry with its announced_add_date, actual_add_date and removal_date; evaluated separately for each CatalogEntry of a title"
    constants:
      DAY_ONE_MIN_NOTICE_DAYS: 14
      CATALOG_ADD_MIN_NOTICE_DAYS: 7
      BACK_CATALOG_MIN_NOTICE_DAYS: 0
      REMOVAL_REVERT_CUTOFF_DAYS: 3
    precision: "whole days, truncated; a 13.99-day notice fails the DAY_ONE minimum"# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number runs first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the four declared roles"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "the caller's role is permitted on this endpoint; a Subscriber may only act on resources whose subscriber_id equals its own X-User-ID"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: business_constraint
    check: "request body is well formed: every declared required input present, no undeclared field, every enum member in its declared set, every numeric field within its declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a body

  - priority: 4
    category: existence
    check: "referenced resources exist, checked path-segment ids first left-to-right, then body ids in the order the endpoint's input list declares them"
    error_id: "ERR_PUBLISHER_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_REGION_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_PROJECTION_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is declared; a second sequential request that observes the state the first request changed fails here"
    error_id: "ERR_DEAL_ALREADY_SIGNED | ERR_ENTRY_NOT_PUBLISHABLE | ERR_ENTRY_ALREADY_DELISTED | ERR_REMOVAL_ALREADY_ANNOUNCED | ERR_REMOVAL_NOT_ANNOUNCED | ERR_REMOVAL_REVERT_WINDOW_CLOSED | ERR_SUBSCRIPTION_TERMINAL | ERR_NO_UNPAID_MONTHS | ERR_ENTITLEMENT_ALREADY_REVOKED | ERR_PROJECTION_ALREADY_FINALIZED"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_temporal
    check: "window and notice rules: term window well formed and the planned add date inside it; removal date strictly after the actual add date; class minimum removal notice satisfied; announcement not reverted inside the three-day cutoff; no catalog maintenance window of the region currently covers the logical clock"
    error_id: "ERR_TERM_WINDOW_INVALID | ERR_ADD_EFFECTIVE_OUTSIDE_TERM | ERR_REMOVAL_DATE_NOT_AFTER_ADD | ERR_INSUFFICIENT_REMOVAL_NOTICE | ERR_REMOVAL_REVERT_CUTOFF | ERR_REGION_MAINTENANCE_WINDOW_ACTIVE | ERR_MAINTENANCE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /catalog/licensing-deals, POST /catalog/licensing-deals/{deal_id}/renew, POST /catalog/catalog-entries, POST /catalog/catalog-entries/{entry_id}/publish, POST /catalog/catalog-entries/{entry_id}/announce-removal, POST /catalog/catalog-entries/{entry_id}/cancel-removal, POST /catalog/regions"

  - priority: 7
    category: business_constraint
    check: "referential and eligibility rules: publisher must be ACTIVE; region must offer the requested tier; an entry's tiers must be at or above the region tier floor; a DAY_ONE entry's title must ship on CONSOLE and the title must be day-one eligible; a purchase's entry must belong to the purchased title; a subscription's tier must be offered in the subscriber's region; at most one FINALIZED DAY_ONE projection per (title, region); the compensation field set must match the declared compensation model"
    error_id: "ERR_PUBLISHER_SUSPENDED | ERR_TIER_UNSUPPORTED_IN_REGION | ERR_TIER_BELOW_REGION_FLOOR | ERR_PLATFORM_NOT_SUPPORTED | ERR_DAY_ONE_NOT_ELIGIBLE | ERR_ENTRY_TITLE_MISMATCH | ERR_NO_BINDING_DEAL | ERR_DUPLICATE_DAY_ONE_PROJECTION | ERR_COMPENSATION_MODEL_MISMATCH"
    http_status: 409
    applies_to: "POST /catalog/licensing-deals, POST /catalog/catalog-entries, POST /catalog/catalog-entries/{entry_id}/publish, POST /catalog/purchases, POST /catalog/subscriptions, POST /catalog/availability-projections, POST /catalog/availability-projections/{projection_id}/finalize"

  - priority: 8
    category: business_fiscal
    check: "quota and cap rules, evaluated last: the region's concurrent catalog occupancy must stay below Region.availability_ceiling_titles; a member discount may not exceed the 0.40 cap; the annual prepay credit may not exceed the prepay amount"
    error_id: "ERR_REGION_CATALOG_CEILING_REACHED | ERR_MEMBER_DISCOUNT_CAP_EXCEEDED | ERR_PREPAY_CREDIT_CAP_EXCEEDED"
    http_status: 409
    applies_to: "POST /catalog/catalog-entries/{entry_id}/publish, POST /catalog/tiers, POST /catalog/subscriptions"

