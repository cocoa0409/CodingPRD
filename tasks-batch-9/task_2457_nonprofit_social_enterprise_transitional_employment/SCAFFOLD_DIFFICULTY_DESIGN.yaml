# =============================================================================
# §1.8 Scaffold Difficulty Design - test targeting index for
# task_2457_nonprofit_social_enterprise_transitional_employment
#
# Nine §0.5 rule_id blocks x 2 instances = 18 instances. Every numeric assert
# below was computed by executing the §1.3 formulas (Decimal, ROUND_HALF_UP)
# against the pinned setup inputs; no assert is an estimate.
#
# Shared calendar facts used by the chains: 2026-09-07 is a Monday, so the ISO
# week Mon 2026-09-07 .. Sun 2026-09-13 holds every "same week" shift; 2026-10-01
# is a Thursday and 2026-10-02 a Friday, both inside ISO week Mon 2026-09-28 ..
# Sun 2026-10-04. The logical clock default before any set_current_utc call is
# 2026-08-01T00:00:00Z; every chain sets it explicitly anyway.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subsidy_allocation_hours_vs_revenue_split_same_ledger
        grounds:
          - calculations.subsidy_cost_allocation
          - calculations.true_cost_analysis
          - entities.SubsidyPeriod.fields.mission_share
          - entities.CostEntry.fields.allocated_mission_cents
          - endpoints[GET /subsidy-periods/{subsidyPeriodId}/true-cost-analysis]
        distinguishing_aspect: |
          This dual variant lives in the cost-accounting domain (SubsidyPeriod x CostEntry ledger):
          one identical set of four POSTED cost rows splits into mission_cost_cents 85810 under
          PROVISIONAL_HOURS (mission_share 0.2308 from trainee-hour share) and 116766 under
          FINAL_REVENUE (mission_share 0.3276 from the unfunded fraction of gross cost).
        test_recipe:
          setup:
            - "Launched business line with subsidy_cap_cents 5000000 so no suspension cascade fires."
            - "One OPEN SubsidyPeriod 2026-09-01..2026-09-30 with supervisor_hours 40.0."
            - "One enrolled participant at wage 1650 who completes a 12.000-hour shift (auto TRAINEE_WAGES SHARED 19800)."
            - "One delivered JOB_COACHING activity costing 12000 (auto COACHING MISSION 12000)."
            - "Two manual entries: SUPERVISION SHARED 300000 and MATERIALS BUSINESS 40000; gross_cost 371800."
            - "Period CLOSED at clock 2026-10-01 with allocation_basis HOURS and revenue_cents 250000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T20:00:00Z" }
              as: ProgramDirector
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 12.000 }
              as: CaseManager
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 12000 }
              as: JobCoach
              captures: { act1_id: $.data.id }
            - call: "POST /support-activities/${act1_id}/deliver"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: ProgramDirector
              captures: { sp_v2: $.data.version }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "SUPERVISION", classification: "SHARED", amount_cents: 300000, expected_subsidy_period_version: "${sp_v2}" }
              as: ProgramDirector
            - call: "GET /subsidy-periods/${sp_id}"
              payload: {}
              as: ProgramDirector
              captures: { sp_v3: $.data.version }
            - call: "POST /cost-entries"
              payload: { subsidy_period_id: "${sp_id}", category: "MATERIALS", classification: "BUSINESS", amount_cents: 40000, expected_subsidy_period_version: "${sp_v3}" }
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /subsidy-periods/${sp_id}/close"
              payload: { allocation_basis: "HOURS", revenue_cents: 250000 }
              as: ProgramDirector
          trigger:
            - call: "GET /subsidy-periods/${sp_id}/true-cost-analysis"
              payload: { allocation_basis: "HOURS" }
              as: FunderAnalyst
              captures: { hours_mission: $.data.mission_cost_cents }
            - call: "GET /subsidy-periods/${sp_id}/true-cost-analysis"
              payload: { allocation_basis: "REVENUE" }
              as: FunderAnalyst
              captures: { revenue_mission: $.data.mission_cost_cents }
          assert:
            - "HOURS read: mission_share == 0.2308, mission_cost_cents == 85810, business_operating_cost_cents == 285990"
            - "REVENUE read: mission_share == 0.3276, mission_cost_cents == 116766, business_operating_cost_cents == 255034"
            - "both reads: total_cost_cents == 371800 and true_cost_per_trainee_hour_cents == 30983.33 (trainee_hours 12.000)"
            - "subsidy_per_trainee_hour_cents == 7150.83 under HOURS and 9730.50 under REVENUE"
            - "SubsidyPeriod.${sp_id}.allocation_basis == HOURS and SubsidyPeriod.${sp_id}.mission_cost_cents == 85810 after the REVENUE what-if read (the what-if never persists)"
            - "CostEntry rows of ${sp_id}: the SHARED 300000 supervision row has allocated_mission_cents == 69240 and allocated_business_cents == 230760; the MISSION 12000 coaching row has allocated_mission_cents == 12000"

      - name: outcome_retention_cohort_vs_point_in_time_same_placement
        grounds:
          - calculations.outcome_measurement
          - entities.Placement.fields.retention_outcome
          - entities.Placement.fields.employment_status
          - endpoints[GET /business-lines/{businessLineId}/outcome-summary]
        distinguishing_aspect: |
          This dual variant lives in the funder-reporting domain (BusinessLine x Participant x Placement),
          not the cost ledger: one single ACTIVE-but-never-confirmed placement yields retention_rate
          0.0000 under COHORT_BASED (denominator counts the placement because it had a full 180 days
          inside the window, numerator requires retention_outcome == RETAINED_180) and 1.0000 under
          POINT_IN_TIME (numerator counts employment_status == ACTIVE right now).
        test_recipe:
          setup:
            - "Launched line, OPEN period 2026-09-01..2026-09-30, one participant enrolled 2026-09-07 at wage 1650."
            - "Participant completes two 12.000-hour shifts (24.000 hours), receives two delivered 90-minute JOB_COACHING activities, is certified by coach-1 and graduated by cm-1."
            - "Placement created at employer Northgate Logistics (floor 1800), hire_date 2026-10-01, starting wage 1900; wage evidence never submitted, employment never separated."
            - "Clock advanced to 2027-04-01 so hire_date + 180 days (2027-03-30) has elapsed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T20:00:00Z" }
              as: ProgramDirector
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 12.000 }
              as: CaseManager
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-08T08:00:00Z", ends_at: "2026-09-08T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws2_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws2_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T20:00:00Z" }
              as: ProgramDirector
            - call: "POST /shift-assignments/${sa2_id}/complete"
              payload: { actual_hours: 12.000 }
              as: CaseManager
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 6000 }
              as: JobCoach
              captures: { act1_id: $.data.id }
            - call: "POST /support-activities/${act1_id}/deliver"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 6000 }
              as: JobCoach
              captures: { act2_id: $.data.id }
            - call: "POST /support-activities/${act2_id}/deliver"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
            - call: "POST /participants/${p1_id}/certify-readiness"
              payload: {}
              as: JobCoach
              as_user_id: "coach-1"
            - call: "POST /participants/${p1_id}/graduate"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /employers"
              payload: { organization_name: "Northgate Logistics", industry_code: "LOG", min_starting_wage_cents_per_hour: 1800 }
              as: ProgramDirector
              captures: { emp_id: $.data.id }
            - call: "POST /placements"
              payload: { participant_id: "${p1_id}", employer_id: "${emp_id}", hire_date: "2026-10-01T00:00:00Z", starting_wage_cents_per_hour: 1900, weekly_hours: 35 }
              as: CaseManager
              captures: { pl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /business-lines/${bl_id}/outcome-summary"
              payload: { retention_measure: "COHORT_BASED", period_start: "2026-09-01T00:00:00Z", period_end: "2027-06-30T00:00:00Z" }
              as: FunderAnalyst
              captures: { cohort_rate: $.data.retention_rate }
            - call: "GET /business-lines/${bl_id}/outcome-summary"
              payload: { retention_measure: "POINT_IN_TIME", period_start: "2026-09-01T00:00:00Z", period_end: "2027-06-30T00:00:00Z" }
              as: FunderAnalyst
              captures: { pit_rate: $.data.retention_rate }
          assert:
            - "COHORT_BASED read: retention_denominator == 1, retention_numerator == 0, retention_rate == 0.0000"
            - "POINT_IN_TIME read: retention_denominator == 1, retention_numerator == 1, retention_rate == 1.0000"
            - "both reads: enrolled_count == 1, placed_count == 1, placement_rate == 1.0000"
            - "both reads: verified_placement_count == 0 and average_wage_progression_pct == null (no wage evidence was ever submitted)"
            - "Placement.${pl_id}.employment_status == ACTIVE and Placement.${pl_id}.retention_outcome == PENDING (neither read mutates the placement)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shift_labor_cost_rounds_per_assignment_then_sums
        grounds:
          - calculations.shift_labor_cost
          - entities.ShiftAssignment.fields.wage_cost_cents
          - entities.WorkShift.fields.billable_labor_cost_cents
          - state_machines.WorkShift.SCHEDULED_to_CLOSED
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the cents: two trainees on one shift give
          round(3.335*1650)=5503 and round(2.125*1725)=3666, so the pinned round-per-assignment-then-sum
          order yields billable_labor_cost_cents 9169, while the forbidden sum-then-round order yields
          9168.
        test_recipe:
          setup:
            - "Launched line with supervisor_capacity 2 and one OPEN period 2026-09-01..2026-09-30."
            - "Two participants on the line: p1 at wage 1650, p2 at wage 1725 (second enroll re-reads BusinessLine.version because the first enroll bumped it)."
            - "One 4-hour shift Mon 2026-09-07 08:00..12:00 with trainee_capacity 2, both trainees seated."
            - "Clock at 2026-09-07T12:00:00Z so both completions are allowed; actual_hours 3.335 and 2.125 are inside duration_hours 4.000 + 0.5 grace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-002", declared_barrier_codes: ["DISABILITY", "LIMITED_ENGLISH", "YOUTH_AGING_OUT"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 36 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /referrals/${ref2_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["DISABILITY", "LIMITED_ENGLISH", "YOUTH_AGING_OUT"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 36 }
              as: IntakeSpecialist
            - call: "POST /subsidy-periods"
              payload: { business_line_id: "${bl_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", supervisor_hours: 40.0 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "GET /business-lines/${bl_id}"
              payload: {}
              as: IntakeSpecialist
              captures: { bl_v2: $.data.version }
            - call: "POST /participants"
              payload: { referral_id: "${ref2_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1725, expected_business_line_version: "${bl_v2}" }
              as: IntakeSpecialist
              captures: { p2_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T12:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
              as: CaseManager
              captures: { sa1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p2_id}" }
              as: CaseManager
              captures: { sa2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T12:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /shift-assignments/${sa1_id}/complete"
              payload: { actual_hours: 3.335 }
              as: CaseManager
              captures: { cost1: $.data.wage_cost_cents }
            - call: "POST /shift-assignments/${sa2_id}/complete"
              payload: { actual_hours: 2.125 }
              as: CaseManager
              captures: { cost2: $.data.wage_cost_cents }
          assert:
            - "ShiftAssignment.${sa1_id}.wage_cost_cents == 5503 (round_half_up(3.335 * 1650) = round_half_up(5502.75))"
            - "ShiftAssignment.${sa2_id}.wage_cost_cents == 3666 (round_half_up(2.125 * 1725) = round_half_up(3665.625))"
            - "WorkShift.${ws1_id}.status == CLOSED and WorkShift.${ws1_id}.billable_labor_cost_cents == 9169, NOT 9168"
            - "the two auto-posted TRAINEE_WAGES CostEntry rows of ${sp_id} have amount_cents 5503 and 3666 (sum 9169)"
            - "SubsidyPeriod.${sp_id}.trainee_hours == 5.460 and total_cost_cents == 9169"

      - name: subsidy_draw_tier_from_presubsidy_margin_ordering
        grounds:
          - calculations.subsidy_draw
          - entities.SubsidyPeriod.fields.margin_pct
          - entities.SubsidyPeriod.fields.subsidy_rate
          - state_machines.SubsidyPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order: the subsidy tier is
          selected from the PRE-subsidy margin (revenue 250000 minus business_operating_cost_cents
          285990 gives margin_pct -0.1440 -> rate 0.90 -> draw 77229), whereas feeding the drawn
          subsidy back into the margin would give 0.1650 -> rate 0.70 -> draw 60067; the scaffold
          forbids the latter ordering.
        test_recipe:
          setup:
            - "Identical ledger to subsidy_allocation_hours_vs_revenue_split_same_ledger: gross_cost 371800, trainee_hours 12.000, supervisor_hours 40.0, subsidy_cap_cents 5000000."
            - "Period still OPEN at clock 2026-10-01 (one day after period_end 2026-09-30) with no ASSIGNED assignment left inside the interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
