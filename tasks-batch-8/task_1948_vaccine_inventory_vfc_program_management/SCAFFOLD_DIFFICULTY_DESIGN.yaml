        distinguishing_aspect: |
          VaccineOrder has a fork-join branch at APPROVED:
          APPROVED -> PARTIALLY_RECEIVED -> FULLY_RECEIVED when receipts come
          in multiple postings, or APPROVED -> FULLY_RECEIVED directly when a
          single receipt covers the entire allocation. The two paths converge
          on the same terminal state but traverse different intermediate states
          with different side-effect histories.
