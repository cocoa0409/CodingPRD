            - "required_ah == 438 - ceil(8.00 * 1000 / 24.0 / 0.80 * 1.0000 * 1.05) == ceil(437.5); the ceil is load-bearing, a plain round would answer 438 too but a truncation would answer 437."
            - "evaluated_design_count == 2 - both designs clear 24.0 V, the 1000.0 kg compartment and required_ah 438."
            - "selected_cell_design_id == \"${design_small_id}\" - capacity ASC puts the 465.0 Ah pack first and it has a feasible charger, so the 600.0 Ah pack is never reached."
            - "selected_charger_id == \"${charger_cheap_id}\" and selected_charge_hours == 7.13 (round(465.0 * 0.80 * 1.15 / 60.0, 2)) - price_cents ASC beats the 50 A model's 8.56 h even though both fit the 9.00 h window."
            - "recommended_battery_count == 4 (LEAD_ACID at one shift is 1 pack per truck) and recommended_charger_count == 2 (ceil(4 / 2))."
            - "fleet_capital_cents == 2500000 (4 * 500000 + 2 * 250000); pairing the 600.0 Ah design instead would have answered 3300000."
            - "request_state == \"MATCHED\" and GET /plants/${plant_id}/fleet-analysis still answers accepted_request_count == 0 and fleet_capital_cents == 0 because the request has not been ACCEPTED yet."

      - name: formation_energy_prices_the_nameplate_estimate_and_the_metered_actual_differently
        claim_type: Correct Result
        grounds:
          - calculations.formation_energy_charge
          - entities.FormationRun.fields.provisional_charge_cents
          - entities.FormationRun.fields.final_charge_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / formation_energy_provisional_nameplate_vs_final_metered
          rationale: "The §1.8 instance already pins both variants end to end on one run (estimated 102.00 kWh / provisional 2210 cents / reserved 255.00 g against final 2126 cents / consumed 250.00 g, including the peak and off-peak hour splits of both windows). A breadth-level Correct Result probe on the same formula would replay the identical call chain with weaker asserts."

      - name: exposure_index_uses_the_air_window_and_the_blood_window_separately
        claim_type: Correct Result
        grounds:
          - calculations.worker_exposure_index
          - endpoints[GET /workers/{id}/exposure-index].output
        excluded_because:
          difficulty_instance: dual_variant_calc / worker_exposure_air_twa_90d_vs_blood_peak_180d
          rationale: "The §1.8 instance drives the dual-variant exposure calculation with samples placed on both sides of the 90-day air window and the 180-day blood window, so it already covers the arithmetic, the window filtering and the divergence between the two variants. Repeating it here would add no independent evidence."

      - name: sampling_plan_size_follows_the_sqrt_offset_ladder
        claim_type: Constants Applied
        grounds:
          - calculations.lot_sampling_plan
          - endpoints[POST /production-lots/{id}/sampling-plans].side_effects
        excluded_because:
          difficulty_instance: combinatorial_formula / lot_sampling_plan_sqrt_offset_clamp_tier_mode_a
          rationale: "The §1.8 instance walks the whole ceil(sqrt(quantity)) ladder including the MIN/MAX clamps and every acceptance-number tier, which strictly contains any single-quantity Constants Applied probe. The plan values this section does depend on (sample_size 8 / acceptance_number 1 at quantity 50) are asserted inline by the yield and cycle-life instances above."

      - name: capacity_pass_threshold_is_evaluated_against_the_rounded_value
        claim_type: Precision
        grounds:
          - calculations.capacity_test_result
          - calculations.capacity_test_result.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_pass_threshold_is_the_rounded_value_not_the_exact_one
          rationale: "The §1.8 boundary instance already sits a measurement on either side of the rounded 441.8 Ah threshold and distinguishes it from the exact 441.75 Ah product, which is the entire content of the Precision claim for this calculation."

  # ===================================================================
  # SECTION 4 - VALIDATIONS (guide section 4)
  #   Violation -> Error, Satisfaction -> Pass and Priority Ordering over
  #   the §1.4 ladder. The two cross-entity precedence pairs that matter
  #   most (lot state vs emission budget, env hold vs bay conflict) are
  #   already exhausted by §1.8 and are stubbed.
  # ===================================================================
  - section: validations
    instances:

      - name: duplicate_code_is_rejected_globally_for_site_code_but_only_per_plant_for_bay_code
        claim_type: Violation → Error
        grounds:
          - validations[priority 9 uniqueness]
          - errors[ERR_DUPLICATE_CODE]
          - endpoints[POST /plants].errors
          - endpoints[POST /formation-bays].errors
        distinguishing_aspect: "Priority 9 declares two different uniqueness scopes in one rule: Plant.site_code is global while FormationBay.bay_code is unique per plant_id, so re-using BAY-1 inside the same plant is a 409 while re-using it in a second plant is a 201."
        test_recipe:
          setup:
            - "Two plants (PLT-RIV and PLT-EAST) and one bay BAY-1 already registered in PLT-RIV."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_a_id: "$.data.id" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Eastside Battery Works", site_code: "PLT-EAST", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 30.00, offpeak_tariff_cents_per_kwh: 18.00, lead_initial_inventory_kg: 5000.000 }
              captures: { plant_b_id: "$.data.id" }
            - call: POST /formation-bays
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", bay_code: "BAY-1", rated_power_kw: 20.00, cooldown_minutes: 45 }
              captures: { bay_a_id: "$.data.id" }
          trigger:
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works Annex", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 50000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 100.000 }
              captures: { err_site: "$.data.error_id" }
            - call: POST /formation-bays
              as: PlantAdmin
              payload: { plant_id: "${plant_a_id}", bay_code: "BAY-1", rated_power_kw: 30.00, cooldown_minutes: 30 }
              captures: { err_bay: "$.data.error_id" }
            - call: POST /formation-bays
              as: PlantAdmin
              payload: { plant_id: "${plant_b_id}", bay_code: "BAY-1", rated_power_kw: 30.00, cooldown_minutes: 30 }
              captures: { bay_b_id: "$.data.id" }
          assert:
            - "The duplicate site_code answers 409 with error_id \"ERR_DUPLICATE_CODE\" even though the plant name differs - site_code is the unique key, not name."
            - "The second BAY-1 inside ${plant_a_id} answers 409 with error_id \"ERR_DUPLICATE_CODE\"."
            - "The BAY-1 inside ${plant_b_id} answers 201 and its bay_code == \"BAY-1\" - the scope is per plant_id, so the second plant is unaffected."
            - "GET /formation-bays answers exactly two rows and both carry bay_code \"BAY-1\" with different plant_id values."

      - name: unlicensed_chemistry_and_mismatched_plate_type_are_rejected_with_distinct_errors
        claim_type: Violation → Error
        grounds:
          - validations[ERR_CHEMISTRY_NOT_LICENSED]
          - validations[ERR_PLATE_TYPE_INCOMPATIBLE]
          - errors[ERR_CHEMISTRY_NOT_LICENSED]
          - errors[ERR_PLATE_TYPE_INCOMPATIBLE]
        distinguishing_aspect: "Two independent chemistry gates that are easy to conflate: the plate-type gate is intrinsic to the design (LITHIUM_LFP demands PRISMATIC_CELL and lead_content_kg 0.000, a 422) while the licence gate is a plant property checked when the lot is opened (a 409), so a perfectly legal design can still be unusable at a given site."
        test_recipe:
          setup:
            - "A plant licensed for LEAD_ACID only, plus one APPROVED LITHIUM_LFP design (PRISMATIC_CELL, lead_content_kg 0.000)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LFP-300", chemistry: LITHIUM_LFP, plate_type: PRISMATIC_CELL, cells_per_battery: 8, cell_nominal_voltage_v: 3.20, nominal_capacity_ah: 300.0, rated_cycles: 3000, warranty_months: 60, pack_weight_kg: 400.0, lead_content_kg: 0.000, list_price_cents: 900000 }
              captures: { lfp_design_id: "$.data.id" }
            - call: POST /cell-designs/${lfp_design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${lfp_design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
          trigger:
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LFP-BAD", chemistry: LITHIUM_LFP, plate_type: TUBULAR, cells_per_battery: 8, cell_nominal_voltage_v: 3.20, nominal_capacity_ah: 300.0, rated_cycles: 3000, warranty_months: 60, pack_weight_kg: 400.0, lead_content_kg: 0.000, list_price_cents: 900000 }
              captures: { err_plate: "$.data.error_id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LFP-LEADY", chemistry: LITHIUM_LFP, plate_type: PRISMATIC_CELL, cells_per_battery: 8, cell_nominal_voltage_v: 3.20, nominal_capacity_ah: 300.0, rated_cycles: 3000, warranty_months: 60, pack_weight_kg: 400.0, lead_content_kg: 0.500, list_price_cents: 900000 }
              captures: { err_lead: "$.data.error_id" }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${lfp_design_id}", lot_code: "LOT-LFP", quantity: 12 }
              captures: { err_lic: "$.data.error_id" }
          assert:
            - "The TUBULAR lithium design answers 422 with error_id \"ERR_PLATE_TYPE_INCOMPATIBLE\"."
            - "The PRISMATIC_CELL lithium design carrying lead_content_kg 0.500 also answers 422 with error_id \"ERR_PLATE_TYPE_INCOMPATIBLE\" - the non-zero lead declaration is part of the same rule, not a separate ERR_VALIDATION."
            - "The lot against the legal APPROVED lithium design answers 409 with error_id \"ERR_CHEMISTRY_NOT_LICENSED\" because LITHIUM_LFP is absent from licensed_chemistries, NOT ERR_DESIGN_NOT_APPROVED (the design is APPROVED)."
            - "GET /cell-designs answers exactly one row (CD-LFP-300) - neither rejected design was persisted."
            - "GET /production-lots answers zero rows."

      - name: torque_and_insulation_readings_on_the_inclusive_window_edges_pass_and_certify
        claim_type: Satisfaction → Pass
        grounds:
          - state_machines.BatteryAssembly.torque_status.PENDING_to_PASS
          - state_machines.BatteryAssembly.insulation_status.PENDING_to_PASS
          - endpoints[POST /battery-assemblies/{id}/verifications].side_effects
        distinguishing_aspect: "Every boundary of the verification pair is inclusive and the torque window is asymmetric: with torque_spec_nm 20.0 the accepted band is [19.00, 22.00], so 22.0 (spec * 1.10) and 19.0 (spec * 0.95) both PASS, and measured_ir_megaohm exactly equal to ir_min_megaohm also PASSes - a strict comparison anywhere would reject a conforming assembly."
        test_recipe:
          setup:
            - "Lot LOT-T in ASSEMBLY with two assemblies ASM-T1 and ASM-T2, both module_count 6 (so connection_count must be 12), torque_spec_nm 20.0 and ir_min_megaohm 1.00."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Dana Quality", job_class: QUALITY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { qa_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-T", quantity: 12 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: PLATE_PRODUCTION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: FORMATION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: ASSEMBLY }
            - call: POST /battery-assemblies
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", serial_number: "ASM-T1", module_count: 6, case_type: STEEL_TRAY, torque_spec_nm: 20.0, ir_min_megaohm: 1.00 }
              captures: { asm_hi_id: "$.data.id" }
            - call: POST /battery-assemblies
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", serial_number: "ASM-T2", module_count: 6, case_type: STEEL_TRAY, torque_spec_nm: 20.0, ir_min_megaohm: 1.00 }
              captures: { asm_lo_id: "$.data.id" }
          trigger:
            - call: POST /battery-assemblies/${asm_hi_id}/verifications
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { verification_type: TORQUE, measured_torque_nm: 22.0, connection_count: 12 }
            - call: POST /battery-assemblies/${asm_hi_id}/verifications
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { verification_type: INSULATION_RESISTANCE, measured_ir_megaohm: 1.00, test_voltage_v: 500 }
            - call: POST /battery-assemblies/${asm_lo_id}/verifications
