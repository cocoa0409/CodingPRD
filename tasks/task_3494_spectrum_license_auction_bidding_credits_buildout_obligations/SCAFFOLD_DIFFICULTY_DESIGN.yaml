# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3494_spectrum_license_auction_bidding_credits_buildout_obligations
# 9 rules x >=2 instances = 19 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints.
# Logical clock default 2026-09-01T00:00:00Z; all fixture dates are reachable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_provisional_vs_final_net_price
        grounds:
          - calculations.settlement_pricing
          - entities.License.fields.provisional_net_price_cents
          - entities.License.fields.net_price_cents
        distinguishing_aspect: |
          License-domain dual variant: the SAME clock data (gross_clock_price 250,000,000, credit_pct 15)
          yields provisional_net_price_cents == 212,500,000 (clock-price basis) but
          net_price_cents == 218,450,000 (assignment-inclusive basis) because the
          7,000,000 assignment bid enters only the final variant.
        test_recipe:
          setup:
            - "Single-product band plan: area PEA002 population 500000, CATEGORY_A 10 MHz supply 2, 50 cents/MHz-pop (units 5,000,000; opening price 250,000,000)"
            - "One rural-qualified applicant (credit_pct 15) with eligibility 10,000,000 units wins quantity 1 in the only clock round"
            - "Assignment bid of 7,000,000 cents; assignment completed"
          setup_api_calls:
            - &c_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AuctionAdmin
            - &c_plan
              call: "POST /spectrum-auctions/band-plans"
              payload: { band_name: "3.5 GHz", frequency_start_mhz: 3550, frequency_end_mhz: 3700, technical_rules: "50W EIRP max" }
              as: AuctionAdmin
              captures: { plan_id: "$.data.id" }
            - &c_area_y
              call: "POST /spectrum-auctions/license-areas"
              payload: { band_plan_id: "${plan_id}", area_code: "PEA002", name: "Rural Y", population: 500000 }
              as: AuctionAdmin
              captures: { area_y_id: "$.data.id" }
            - &c_block_a
              call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_A", mhz_size: 10, supply_per_area: 2, price_per_mhz_pop_cents: 50 }
              as: AuctionAdmin
              captures: { block_a_id: "$.data.id" }
            - &c_publish
              call: "POST /spectrum-auctions/band-plans/${plan_id}/publish"
              payload: {}
              as: AuctionAdmin
            - &c_auction
              call: "POST /spectrum-auctions/auctions"
              payload: { band_plan_id: "${plan_id}", name: "Auction 3494", application_deadline: "2026-09-15T00:00:00Z" }
              as: AuctionAdmin
              captures: { auction_id: "$.data.id" }
            - &c_open
              call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "OPEN_APPLICATIONS" }
              as: AuctionAdmin
            - &c_applicant_rural
              call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Rural Wireless Co", claims_small_business: false, claims_rural_credit: true, own_annual_revenue_cents: 0, service_population: 200000, ownership_interests: [{ holder_name: "Sole Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { r_id: "$.data.id" }
            - &c_upfront_rural
              call: "POST /spectrum-auctions/applicants/${r_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${r_id}"
            - &c_review_rural
              call: "POST /spectrum-auctions/applicants/${r_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - &c_qualify_rural
              call: "POST /spectrum-auctions/applicants/${r_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - &c_clock_quiet
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: AuctionAdmin
            - &c_begin_quiet
              call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "BEGIN_QUIET_PERIOD" }
              as: AuctionAdmin
            - &c_start_clock
              call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "START_CLOCK" }
              as: AuctionAdmin
            - &c_get_rounds
              call: "GET /spectrum-auctions/auctions/${auction_id}/rounds"
              payload: {}
              as: AuctionAdmin
              captures: { r1_id: "$.data[0].id" }
            - &c_bid_rural_a_y
              call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${r_id}"
            - &c_close_r1
              call: "POST /spectrum-auctions/rounds/${r1_id}/close"
              payload: {}
              as: AuctionAdmin
            - &c_assignbid_rural
              call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 7000000 }
              as: Bidder
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "COMPLETE_ASSIGNMENT" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${r_id}" }
              as: AuctionAdmin
              captures: { lic_id: "$.data[0].id" }
          assert:
            - "License.${lic_id}.gross_clock_price_cents == 250000000"
            - "License.${lic_id}.assignment_bid_cents == 7000000"
            - "License.${lic_id}.gross_final_price_cents == 257000000"
            - "License.${lic_id}.provisional_net_price_cents == 212500000"
            - "License.${lic_id}.net_price_cents == 218450000"
            - "License.${lic_id}.provisional_net_price_cents != License.${lic_id}.net_price_cents"
            - "License.${lic_id}.credit_amount_cents == 38550000"
            - "License.${lic_id}.credit_pct == 15"
            - "License.${lic_id}.status == PENDING_PAYMENT and frequency_block_index == 0"

      - name: relocation_share_proportional_vs_equal_split
        grounds:
          - calculations.relocation_cost_shares
          - entities.Incumbent.fields.shares_proportional
          - entities.Incumbent.fields.shares_equal
          - entities.License.fields.relocation_share_owed_cents
        distinguishing_aspect: |
          Incumbent-domain dual variant: with relocation cost 100,000,001 cents and two ACTIVE
          licenses of units 10,000,000 and 20,000,000 in the area, the BINDING proportional
          variant allocates 33,333,333 / 66,666,668 while the dispute-reference equal-split
          variant allocates 50,000,000 / 50,000,001 — identical inputs, different amounts,
          and the 1-cent remainder lands on the larger-units license in both variants.
        test_recipe:
          setup:
            - "Area PEA001 population 1,000,000; CATEGORY_A 10 MHz supply 2 price 50 (units 10,000,000, price 500,000,000); CATEGORY_B 20 MHz supply 1 price 30 (units 20,000,000, price 600,000,000)"
            - "W1 (no credit) wins CATEGORY_A@PEA001 qty 1; W2 (no credit) wins CATEGORY_B@PEA001 qty 1; both assignment bids 0"
            - "Incumbent in PEA001 with relocation_cost_cents 100,000,001 is RELOCATING with window [2026-10-05, 2026-11-05] BEFORE settlement so the grants are not blocked"
            - "Both licenses settle fully at 2026-10-02 (ACTIVE); clock then moves to 2026-11-05 and the incumbent confirms cleared"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - &c_area_x
              call: "POST /spectrum-auctions/license-areas"
              payload: { band_plan_id: "${plan_id}", area_code: "PEA001", name: "Metro X", population: 1000000 }
              as: AuctionAdmin
              captures: { area_x_id: "$.data.id" }
            - *c_block_a
            - &c_block_b
              call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_B", mhz_size: 20, supply_per_area: 1, price_per_mhz_pop_cents: 30 }
              as: AuctionAdmin
              captures: { block_b_id: "$.data.id" }
            - *c_publish
            - *c_auction
            - *c_open
            - &c_applicant_w1
              call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Winner One LLC", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "Owner One", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { w1_id: "$.data.id" }
            - &c_upfront_w1
              call: "POST /spectrum-auctions/applicants/${w1_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${w1_id}"
            - &c_review_w1
              call: "POST /spectrum-auctions/applicants/${w1_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - &c_qualify_w1
              call: "POST /spectrum-auctions/applicants/${w1_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - &c_applicant_w2
              call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Winner Two LLC", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "Owner Two", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { w2_id: "$.data.id" }
            - &c_upfront_w2
              call: "POST /spectrum-auctions/applicants/${w2_id}/upfront-payments"
              payload: { amount_cents: 50000000000 }
              as: Bidder
              as_user_id: "${w2_id}"
            - &c_review_w2
              call: "POST /spectrum-auctions/applicants/${w2_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - &c_qualify_w2
              call: "POST /spectrum-auctions/applicants/${w2_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - &c_bid_w1_ax
              call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 1 }
              as: Bidder
              as_user_id: "${w1_id}"
            - &c_bid_w2_bx
              call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_B", quantity: 1 }
              as: Bidder
              as_user_id: "${w2_id}"
            - *c_close_r1
            - &c_assignbid_w1
              call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", amount_cents: 0 }
              as: Bidder
              as_user_id: "${w1_id}"
            - &c_assignbid_w2
              call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA001", category: "CATEGORY_B", amount_cents: 0 }
              as: Bidder
              as_user_id: "${w2_id}"
            - &c_complete
              call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "COMPLETE_ASSIGNMENT" }
              as: AuctionAdmin
            - &c_incumbent_x
              call: "POST /spectrum-auctions/incumbents"
              payload: { band_plan_id: "${plan_id}", area_id: "${area_x_id}", callsign: "KOLD940", relocation_cost_cents: 100000001 }
              as: AuctionAdmin
              captures: { inc_id: "$.data.id" }
            - &c_inc_submit
              call: "POST /spectrum-auctions/incumbents/${inc_id}/transition"
              payload: { action: "SUBMIT_PLAN" }
              as: IncumbentOperator
              as_user_id: "${inc_id}"
            - &c_inc_begin_reloc
              call: "POST /spectrum-auctions/incumbents/${inc_id}/transition"
              payload: { action: "BEGIN_RELOCATION", transition_window_start: "2026-10-05T00:00:00Z", transition_window_end: "2026-11-05T00:00:00Z" }
              as: AuctionAdmin
            - &c_lic_of_w1
              call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${w1_id}" }
              as: AuctionAdmin
              captures: { lic_a_id: "$.data[0].id" }
            - &c_lic_of_w2
              call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${w2_id}" }
              as: AuctionAdmin
              captures: { lic_b_id: "$.data[0].id" }
            - &c_clock_grantday
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: AuctionAdmin
            - &c_pay_lic_a
              call: "POST /spectrum-auctions/licenses/${lic_a_id}/settlement-payments"
              payload: { amount_cents: 500000000 }
              as: Bidder
              as_user_id: "${w1_id}"
            - &c_pay_lic_b
              call: "POST /spectrum-auctions/licenses/${lic_b_id}/settlement-payments"
              payload: { amount_cents: 600000000 }
              as: Bidder
              as_user_id: "${w2_id}"
            - &c_clock_postwindow
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: AuctionAdmin
          trigger:
            - call: "POST /spectrum-auctions/incumbents/${inc_id}/transition"
              payload: { action: "CONFIRM_CLEARED" }
              as: IncumbentOperator
              as_user_id: "${inc_id}"
          assert:
            - "Incumbent.${inc_id}.shares_proportional == [{license_id: ${lic_a_id}, amount_cents: 33333333}, {license_id: ${lic_b_id}, amount_cents: 66666668}] (order by units DESC is not required in the array; compare as a set of pairs)"
            - "Incumbent.${inc_id}.shares_equal == [{license_id: ${lic_a_id}, amount_cents: 50000000}, {license_id: ${lic_b_id}, amount_cents: 50000001}] (compare as a set of pairs)"
            - "License.${lic_a_id}.relocation_share_owed_cents == 33333333"
            - "License.${lic_b_id}.relocation_share_owed_cents == 66666668"
            - "SUM(shares_proportional amounts) == 100000001 == relocation_cost_cents (no cents lost or created)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: clock_increment_tiered_per_product
        grounds:
          - calculations.clock_price_increment
          - entities.ClockRound.fields.prices
        distinguishing_aspect: |
          Mode (a) — tiered multi-input branch: demand ratio per product selects among 15/10/5%
          increments or closure. With supply 4: demand 5 (ratio 1.25) yields exactly the +10%
          tier (1,000,000,000 -> 1,100,000,000) while demand 3 closes that product outright —
          both decisions land in the SAME new round, proving per-product independence.
        test_recipe:
          setup:
            - "Area PEA003 population 2,000,000; CATEGORY_C and CATEGORY_D both 5 MHz, supply 4, 100 cents/MHz-pop (units 10,000,000; opening price 1,000,000,000)"
            - "G1 eligible 80,000,000 units; G2 eligible 10,000,000 units; both QUALIFIED, no credits"
            - "Round 1: G1 demands C qty 4 and D qty 3; G2 demands C qty 1; round closed"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - call: "POST /spectrum-auctions/license-areas"
              payload: { band_plan_id: "${plan_id}", area_code: "PEA003", name: "Plains Z", population: 2000000 }
              as: AuctionAdmin
              captures: { area_z_id: "$.data.id" }
            - call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_C", mhz_size: 5, supply_per_area: 4, price_per_mhz_pop_cents: 100 }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_D", mhz_size: 5, supply_per_area: 4, price_per_mhz_pop_cents: 100 }
              as: AuctionAdmin
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "G1 Wireless", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "G1 Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { g1_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${g1_id}/upfront-payments"
              payload: { amount_cents: 200000000000 }
              as: Bidder
              as_user_id: "${g1_id}"
            - call: "POST /spectrum-auctions/applicants/${g1_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${g1_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "G2 Wireless", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "G2 Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { g2_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${g2_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${g2_id}"
            - call: "POST /spectrum-auctions/applicants/${g2_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${g2_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA003", category: "CATEGORY_C", quantity: 4 }
              as: Bidder
              as_user_id: "${g1_id}"
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA003", category: "CATEGORY_D", quantity: 3 }
              as: Bidder
              as_user_id: "${g1_id}"
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA003", category: "CATEGORY_C", quantity: 1 }
              as: Bidder
              as_user_id: "${g2_id}"
            - *c_close_r1
          trigger:
            - call: "POST /spectrum-auctions/auctions/${auction_id}/rounds"
              payload: {}
              as: AuctionAdmin
              captures: { r2_id: "$.data.id" }
          assert:
            - "ClockRound.${r2_id}.round_number == 2 and stage == 1"
            - "ClockRound.${r2_id}.prices has exactly 1 entry"
            - "ClockRound.${r2_id}.prices[0] == {area_code: PEA003, category: CATEGORY_C, price_cents: 1100000000} (the +10% tier: demand 5 / supply 4 = 1.25 fails 1.5 but passes 1.2)"
            - "No prices entry for CATEGORY_D (demand 3 < supply 4 closed it permanently)"
            - "Auction.${auction_id}.status == CLOCK_ACTIVE and current_round_number == 2"
            - "ClockRound.${r1_id}.aggregate_demand for CATEGORY_C == 5 and CATEGORY_D == 3"

      - name: settlement_round_per_license_then_sum
        grounds:
          - calculations.settlement_pricing
          - entities.Auction.fields.total_proceeds_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order is pinned: two licenses each gross
          250,000,001 cents at credit 35% round to 162,500,001 EACH (round_half_up of
          162,500,000.65); summing the rounded per-license nets yields total_proceeds_cents
          325,000,002 — the sum-then-round order would produce 325,000,001 and is non-conformant.
        test_recipe:
          setup:
            - "Single-product plan: PEA002 population 500,000, CATEGORY_A 10 MHz supply 2 price 50 (units 5,000,000; price 250,000,000)"
            - "Small-business applicant (credit_pct 35) eligible 10,000,000 units wins quantity 2 in the only round"
            - "Assignment bid amount 1 cent (applies per license), assignment completed"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Small Biz Co", claims_small_business: true, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "Sole Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { sb_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${sb_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${sb_id}"
            - call: "POST /spectrum-auctions/applicants/${sb_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${sb_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", quantity: 2 }
              as: Bidder
              as_user_id: "${sb_id}"
            - *c_close_r1
            - call: "POST /spectrum-auctions/auctions/${auction_id}/assignment-bids"
              payload: { area_code: "PEA002", category: "CATEGORY_A", amount_cents: 1 }
              as: Bidder
              as_user_id: "${sb_id}"
          trigger:
            - call: "POST /spectrum-auctions/auctions/${auction_id}/phase"
              payload: { action: "COMPLETE_ASSIGNMENT" }
              as: AuctionAdmin
            - call: "GET /spectrum-auctions/licenses"
              payload: { holder_applicant_id: "${sb_id}" }
              as: AuctionAdmin
              captures: { sb_lic0: "$.data[0].id", sb_lic1: "$.data[1].id" }
            - call: "GET /spectrum-auctions/auctions/${auction_id}"
              payload: {}
              as: AuctionAdmin
          assert:
            - "License.${sb_lic0}.gross_final_price_cents == 250000001 and net_price_cents == 162500001"
            - "License.${sb_lic1}.gross_final_price_cents == 250000001 and net_price_cents == 162500001"
            - "License.${sb_lic0}.frequency_block_index == 0 and License.${sb_lic1}.frequency_block_index == 1 (single winner takes consecutive indices)"
            - "Auction.${auction_id}.total_proceeds_cents == 325000002 (per-license round-then-sum; 325000001 would prove sum-then-round and fails)"
            - "Auction.${auction_id}.status == CLOSED"
            - "Auction.${auction_id}.available_supply entry for (PEA002, CATEGORY_A) has available == 0"

      - name: activity_eligibility_evaluation_order
        grounds:
          - calculations.activity_requirement
          - entities.Applicant.fields.eligibility_units
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: round-N bids are
          validated against the eligibility in force DURING round N, while the activity-based
          reduction computed at round-N close applies only from round N+1. G (eligibility
          20,000,000) bids 18,000,000 units in stage-2 round 4 — accepted because validation
          precedes reduction — and is then reduced to exactly 18,947,368 = floor(18,000,000*1000/950).
