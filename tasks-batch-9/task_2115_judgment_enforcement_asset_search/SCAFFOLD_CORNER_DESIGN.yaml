  # ===========================================================================
  - section: calculations
    instances:

      - name: payoff_replay_sorts_out_of_sequence_payments_by_received_on
        claim_type: chronological
        grounds:
          - calculations.judgment_payoff_replay
          - entities.Payment.fields.received_on
          - endpoints[GET /judgments/{judgment_id}/payoff]
        distinguishing_aspect: "Recording the 2026-06-01 payment BEFORE the 2026-03-02 payment still yields principal 3730089, interest 62338, costs 0 and total 3792427, i.e. the replay orders by received_on, not by created_at."
        test_recipe:
          setup:
            - "A CA judgment entered 2026-01-01 with 5000000 cents principal at 1000 bps and 45000 cents filing costs."
            - "Two APPLIED payments recorded in reverse chronological order: 500000 cents received 2026-06-01 recorded first, then 1000000 cents received 2026-03-02."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-3001", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 500000, received_on: "2026-06-01", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { pB: $.data.id }
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 1000000, received_on: "2026-03-02", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { pA: $.data.id, apA_costs: $.data.applied_to_costs_cents, apA_int: $.data.applied_to_interest_cents, apA_pri: $.data.applied_to_principal_cents }
          trigger:
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-08-01" }
              as: CaseManager
              captures: { p: $.data.principal_balance_cents, i: $.data.accrued_interest_cents, c: $.data.costs_balance_cents, t: $.data.total_payoff_cents, segs: $.data.segment_count }
          assert:
            - "${apA_costs} == 45000"
            - "${apA_int} == 82192"
            - "${apA_pri} == 872808"
            - "${p} == 3730089"
            - "${i} == 62338"
            - "${c} == 0"
            - "${t} == 3792427"
            - "${segs} == 3"

      - name: lien_priority_cohort_renumbers_by_created_at_when_recording_order_reverses
        claim_type: aggregation
        grounds:
          - calculations.lien_priority_rank
          - entities.CountyFiling.fields.priority_rank
        distinguishing_aspect: "Two CA-LOS-ANGELES filings recorded on the same 2026-08-01 date but in reverse creation order: the later-created filing is rank 1 immediately after it records, and recording the earlier-created filing renumbers the cohort so the earlier-created one becomes rank 1 and the other is demoted to rank 2."
        test_recipe:
          setup:
            - "Two CA judgments under one creditor, each with one SUBMITTED zero-fee CA-LOS-ANGELES abstract of judgment; filing F1 was created before filing F2."
          setup_api_calls:
            - call: "POST /creditors"
