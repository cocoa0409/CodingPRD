# =============================================================================
# PRD Benchmark Seed Tables — oncology practice network purchasing & support
# Task: task_3105_oncology_practice_network_purchasing_practice_support
# §1.0–§1.7.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml — neither key appears in this file.
# =============================================================================

scenario: |
  Oncology Practice Network Purchasing & Practice Support (McKesson/US Oncology Network): affiliated community oncology practices purchasing drugs through a network agreement with tiered pricing, buy-and-bill inventory economics where practices purchase drugs and bill payers after administration, group purchasing rebate qualification on market share and compliance reporting, pathways program adoption that steers regimen selection with adherence measurement, practice management services covering revenue cycle, staffing and technology with fee arrangements, clinical research site participation bringing trials into community practices, drug shortage allocation across the network, practice affiliation and departure with contract unwind

domain_name: oncology-practice-network-purchasing-practice-support
api_prefix: /networks

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - resource_temporal_overlap
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: OncologyNetwork
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network agreement holder name" }
      - { name: network_agreement_code, type: string, source: input, description: "GPO/network agreement identifier" }
      - { name: rebate_market_share_threshold_pct, type: number, source: input, description: "Fraction of a practice's drug spend that must flow through network contracts to qualify for the rebate (0..1)" }
      - { name: rebate_min_compliance_score, type: number, source: input, description: "Minimum weighted compliance score (0..1) for rebate qualification" }
      - { name: compliance_report_grace_days, type: integer, source: input, default: 30, description: "Days after an epoch closes during which a compliance report is still accepted" }
      - { name: shortage_allocation_method, type: enum, source: input, description: "PRO_RATA_BASELINE | PRIORITY_PATHWAY | EQUAL_SPLIT — method used when a shortage event is allocated" }
      - { name: payment_terms_days, type: integer, source: input, default: 60, description: "Network invoice terms in days (buy-and-bill resale terms)" }
      - { name: tier_market_share_boundaries, type: array, source: input, description: "Ordered tier ladder, descending: [{tier, min_trailing_12m_purchases_cents}] with TIER_3 highest" }
      - { name: allocation_epoch_index, type: integer, source: system, default: 0, description: "Ops-run epoch; advanced only by POST /networks/{id}/advance-epoch" }
      - { name: is_commercial_terms_frozen, type: boolean, source: computed, default: false, description: "True while the network is inside a frozen commercial window" }

  - name: Practice
    parent: OncologyNetwork
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: practice_name, type: string, source: input, description: "Community oncology practice legal name" }
      - { name: practice_npi, type: string, source: input, description: "Organizational NPI (10 digits)" }
      - { name: state_code, type: string, source: input, description: "Two-letter practice state" }
      - { name: drug_shortage_baseline_units, type: integer, source: input, default: 0, description: "Baseline monthly units used as the pro-rata weight for shortage allocation" }
      - { name: denial_ratio_threshold_pct, type: number, source: input, default: 0.20, description: "Denial ratio at which pricing is suspended: suspension happens only when the ratio strictly exceeds this value" }
      - { name: denied_claim_count, type: integer, source: computed, default: 0, description: "Count of this practice's PayerClaim rows in status DENIED (lifetime, not reset)" }
      - { name: settled_claim_count, type: integer, source: computed, default: 0, description: "Count of this practice's PayerClaim rows in status in {DENIED, ADJUDICATED_PAID} — the denominator of the denial ratio" }
      - { name: pathway_steering_target_pct, type: number, source: input, default: 0.75, description: "Adherence target the pathways program steers toward (0..1)" }
      - { name: affiliation_status, type: enum, source: system, description: "PROSPECTIVE | AFFILIATED | DEPARTING | DEPARTED | SUSPENDED" }
      - { name: pathway_steering_status, type: enum, source: system, description: "NOT_ADOPTED | ACTIVE | SUSPENDED — independent state axis from affiliation_status" }
      - { name: tier_level, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3, derived from trailing_12m_network_purchases_cents and the network ladder" }
      - { name: trailing_12m_network_purchases_cents, type: integer, source: computed, default: 0, description: "Gross (pre-discount) network purchases in the trailing window" }
      - { name: pathway_adherence_pct, type: number, source: computed, default: 0, description: "Share of administered treatments concordant with a PUBLISHED pathway protocol (0..1, 4 dp)" }
      - { name: unsettled_balance_cents, type: integer, source: computed, default: 0, description: "Denied-but-not-yet-recovered claim dollars plus accrued service fees owed by the practice" }
      - { name: is_rebate_qualified, type: boolean, source: computed, default: false, description: "Mirror of the current-epoch RebateQualification.is_qualified" }
      - { name: departure_effective_epoch_index, type: integer, source: computed, description: "Allocation epoch at which departure takes effect; null while not departing" }

  - name: Provider
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; employing practice" }
      - { name: full_name, type: string, source: input, description: "Physician name" }
      - { name: npi, type: string, source: input, description: "Individual NPI (10 digits)" }
      - { name: specialty, type: enum, source: input, description: "MEDICAL_ONCOLOGY | HEMATOLOGY | RADIATION_ONCOLOGY" }
      - { name: is_billing_provider, type: boolean, source: input, default: true, description: "Whether administrations by this provider are billable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: DrugProduct
    parent: OncologyNetwork
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: ndc, type: string, source: input, description: "11-digit National Drug Code, unique within the network" }
      - { name: brand_name, type: string, source: input, description: "Brand name" }
      - { name: generic_name, type: string, source: input, description: "Generic name" }
      - { name: therapeutic_class, type: enum, source: input, description: "CYTOTOXIC | IMMUNOTHERAPY | SUPPORTIVE_CARE | ORAL_TARGETED" }
      - { name: unit_type, type: enum, source: input, description: "VIAL | MG | TABLET" }
      - { name: network_base_price_cents, type: integer, source: input, description: "Network acquisition base price per unit before any practice tier discount" }
      - { name: is_shortage_candidate, type: boolean, source: input, default: false, description: "Whether this product may be placed under shortage allocation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SHORTAGE_RESTRICTED | RECALLED" }

  - name: PracticePricingAgreement
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; practice whose tier pricing this agreement sets" }
      - { name: tier_level, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3 offered by this agreement" }
      - { name: discount_pct, type: number, source: input, description: "Off-invoice discount applied to network_base_price_cents (0..0.35)" }
      - { name: routing_includes_out_of_scope, type: boolean, source: input, default: false, description: "Rebate routing term: when true, the practice's out-of-scope billed claims join the market-share denominator" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the pricing window (half-open interval [effective_from, effective_to))" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the pricing window; null means open-ended" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | ACTIVE | SUSPENDED | SUPERSEDED | REJECTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the NetworkAdmin who approved the agreement" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the agreement; the segregation-of-duties check compares it against approved_by_user_id" }
      - { name: status_changed_by, type: enum, source: system, description: "AGREEMENT_APPROVAL | DEPARTURE_UNWIND | DEPARTURE_WITHDRAWAL | DENIAL_RATIO_BREACH | MANUAL — audit tag for why the last status change happened" }
      - { name: superseded_by_agreement_id, type: string, source: computed, description: "Agreement that replaced this one; null unless SUPERSEDED" }

  - name: DrugPurchaseOrder
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; buying practice" }
      - { name: drug_product_id, type: string, source: system, description: "FK -> DrugProduct.id; ordered product" }
      - { name: shortage_allocation_id, type: string, source: system, description: "FK -> ShortageAllocation.id; allocation this order draws on; null when unallocated" }
      - { name: quantity_units, type: integer, source: input, description: "Ordered units in DrugProduct.unit_type" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Discounted unit price resolved from the practice's ACTIVE pricing agreement for the effective window" }
      - { name: extended_cost_cents, type: integer, source: computed, description: "unit_price_cents * quantity_units" }
      - { name: pricing_tier_applied, type: enum, source: computed, description: "Tier actually used to price this order (the agreement tier, not Practice.tier_level)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CONFIRMED | BACKORDERED | SHIPPED | RECEIVED | CANCELLED" }
      - { name: submitted_at, type: datetime, source: system, description: "Order submission timestamp" }
      - { name: received_at, type: datetime, source: computed, description: "Receipt timestamp; null until RECEIVED" }

  - name: InventoryLot
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; holding practice" }
      - { name: drug_product_id, type: string, source: system, description: "FK -> DrugProduct.id; product in this lot" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> DrugPurchaseOrder.id; order whose receipt created this lot" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: quantity_received, type: integer, source: input, description: "Units received into the lot" }
      - { name: quantity_remaining, type: integer, source: computed, description: "Units still available for administration" }
      - { name: wastage_units, type: integer, source: computed, description: "Units drawn from this lot but discarded (partial-vial waste drawn under the WASTE_BILLED dose plan)" }
      - { name: absorbed_cost_basis_cents, type: integer, source: computed, description: "Leftover-vial cost the practice absorbed because the WASTE_ABSORBED dose plan billed only administered drug" }
      - { name: waste_cost_basis_cents, type: integer, source: computed, description: "wastage_units * acquisition_cost_cents_per_unit — the discarded dollars carried by this lot" }
      - { name: acquisition_cost_cents_per_unit, type: integer, source: computed, description: "Landed cost per unit copied from the purchase order at receipt" }
      - { name: expires_at, type: datetime, source: input, description: "Lot expiration instant; expiry is evaluated against the logical clock" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | EXPIRED | DEPLETED" }

  - name: LotConsumption
    parent: PatientTreatment
    common_fields: true
    fields:
      - { name: treatment_id, type: string, source: system, description: "FK -> PatientTreatment.id; administration that drew the units" }
      - { name: inventory_lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot the units came from" }
      - { name: quantity_consumed, type: integer, source: system, description: "Units drawn from this lot during the administration" }
      - { name: cost_basis_cents, type: integer, source: computed, description: "quantity_consumed * lot acquisition_cost_cents_per_unit" }
      - { name: consumption_sequence, type: integer, source: computed, description: "1-based FIFO draw order within the administration" }
      - { name: is_wastage, type: boolean, source: computed, description: "True for the synthetic row that carries discarded partial-vial units" }

  - name: PatientTreatment
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; administering practice" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; administering physician" }
      - { name: drug_product_id, type: string, source: system, description: "FK -> DrugProduct.id; administered product" }
      - { name: pathway_protocol_id, type: string, source: system, description: "FK -> PathwayProtocol.id; protocol the regimen was selected under" }
      - { name: patient_reference, type: string, source: input, description: "Pseudonymous patient reference" }
      - { name: regimen_code, type: string, source: input, description: "Regimen code as selected by the prescriber" }
      - { name: payer_name, type: string, source: input, description: "Payer to be billed after administration" }
      - { name: admin_fee_cents, type: integer, source: input, default: 0, description: "Administration fee billed as line 3 of the claim" }
      - { name: policy_admin_fee_cents, type: integer, source: computed, description: "The median admin_fee_cents across the practice's ADMINISTERED treatments for this drug product; the selection is pinned by a three-key sort and is deliberately NOT this treatment's own fee" }
      - { name: administered_units, type: integer, source: input, description: "Units per dose to administer (may exceed doses available in stock)" }
      - { name: dose_count, type: integer, source: input, default: 1, description: "Number of doses in this administration; the vial-rounded draw scales with it" }
      - { name: vial_yield_units, type: integer, source: input, default: 1, description: "Units obtainable from one vial; drives wastage for VIAL products" }
      - { name: administered_at, type: datetime, source: input, description: "Instant of administration (also the FIFO cutoff for lot expiry)" }
      - { name: unmet_dose_units, type: integer, source: computed, description: "Doses requested but not stockable after applying vial rounding; 0 when demand can be met" }
      - { name: dose_allocations, type: array, source: computed, description: "Per-dose draw plan: [{vial_count, dose_units, remainder_units}] — the rounded vial demand used for stock sufficiency" }
      - { name: is_pathway_concordant, type: boolean, source: computed, description: "regimen_code ∈ pathway protocol's on_pathway_regimen_codes at administration time" }
      - { name: settlement_priority, type: integer, source: computed, description: "Claim-settlement order, 1-based, selected by a pinned three-key sort over all the practice's treatments settled in the same batch: administered_at ASC, then admin_fee_cents ASC, then created_at ASC" }
      - { name: acquisition_cost_basis_cents, type: integer, source: computed, description: "Sum of LotConsumption.cost_basis_cents for this treatment, including the wastage row" }
      - { name: wastage_cost_basis_cents, type: integer, source: computed, description: "Sum of LotConsumption.cost_basis_cents over rows with is_wastage == true" }
      - { name: wastage_units, type: integer, source: computed, description: "Units discarded from the final vial of this administration" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ADMINISTERED | BILLED | VOIDED" }

  - name: PayerClaim
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; billing practice" }
      - { name: treatment_id, type: string, source: system, description: "FK -> PatientTreatment.id; administration being billed" }
      - { name: payer_name, type: string, source: computed, description: "Payer copied from the treatment at administration" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Drug acquisition basis + wastage + administration fee, summed after per-line rounding" }
      - { name: allowed_amount_cents, type: integer, source: computed, description: "min(billed_amount_cents, payer fee-schedule amount) recorded at adjudication" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Amount the payer remits (the treatment's own policy_admin_fee_cents * 10 for a routine whole claim); supplied only on adjudication" }
      - { name: billed_admin_fee_cents, type: integer, source: computed, description: "The admin-fee line carried by this claim, unless post-settlement disclosure is in force" }
      - { name: written_off_admin_fee_cents, type: integer, source: computed, description: "Admin fee not collected; reported for the post-settlement-disclosure case" }
      - { name: denial_reason_code, type: string, source: input, description: "Payer denial code; supplied only on denial" }
      - { name: appeal_round, type: integer, source: computed, default: 0, description: "Number of appeals filed against this claim (max 2)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ADJUDICATED_PAID | DENIED | APPEALED | VOIDED" }

  - name: RebateProgram
    parent: OncologyNetwork
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: program_name, type: string, source: input, description: "Rebate program name" }
      - { name: drug_ndc_scope, type: string, source: input, description: "NDC the program covers, or the literal ALL" }
      - { name: market_share_threshold_pct, type: number, source: input, description: "Minimum share of the practice's drug spend routed through the network (0..1)" }
      - { name: rebate_pct, type: number, source: input, description: "Rebate rate applied to qualifying purchases (0..0.10)" }
      - { name: compliance_min_score, type: number, source: input, description: "Minimum weighted compliance score (0..1) for payout" }
      - { name: period_epoch_index, type: integer, source: input, description: "Allocation epoch this program instance measures; the measurement window is [network.created_at + (period-1) months, network.created_at + period months)" }
      - { name: weight_reporting_compliance, type: integer, source: input, default: 1, description: "Compliance-score weight for reporting_timeliness; a zero weight excludes the score from both numerator and denominator" }
      - { name: weight_adherence_steering, type: integer, source: input, default: 1, description: "Compliance-score weight for pathway_adherence" }
      - { name: weight_transparency, type: integer, source: input, default: 1, description: "Compliance-score weight for price_transparency" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED" }

  - name: RebateQualification
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; practice being evaluated" }
      - { name: rebate_program_id, type: string, source: system, description: "FK -> RebateProgram.id; program being evaluated" }
      - { name: period_epoch_index, type: integer, source: system, description: "Epoch copied from the program at evaluation" }
      - { name: market_share_pct, type: number, source: computed, description: "Practice's network-routed share of drug spend in the measured window" }
      - { name: compliance_score, type: number, source: computed, description: "Weighted compliance score from report timeliness, pathway adherence and price transparency" }
      - { name: is_qualified, type: boolean, source: computed, description: "market_share_pct >= program threshold AND compliance_score >= program minimum" }
      - { name: rebate_amount_cents, type: integer, source: computed, description: "Rebate payable; provisional until the epoch closes, final thereafter" }
      - { name: holdback_cents, type: integer, source: computed, description: "Rebate dollars withheld or clawed back (departure unwind, reclaim)" }
      - { name: compliance_report_submitted_at, type: datetime, source: computed, description: "Submission instant of the compliance report for this epoch; null until submitted" }
      - { name: compact_discount_credit_cents, type: integer, source: computed, description: "compact_discount_credit from the compliance score: the network's credit for this practice's share of compliant purchases, applied to rebate_amount_cents on the final variant" }
      - { name: compliance_report_verified, type: boolean, source: computed, default: false, description: "True once the network has accepted the compliance report" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | DISQUALIFIED | PAID | RECLAIMED" }

  - name: PathwayProtocol
    parent: OncologyNetwork
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: protocol_code, type: string, source: input, description: "Pathway protocol code" }
      - { name: indication, type: enum, source: input, description: "NSCLC | BREAST | COLORECTAL | LYMPHOMA" }
      - { name: on_pathway_regimen_codes, type: array, source: input, description: "Regimen codes that count as concordant (a subset of declared_regimen_codes)" }
      - { name: declared_regimen_codes, type: array, source: input, description: "The protocol's full regimen code set; a regimen outside this set is rejected outright, while one inside it but outside on_pathway_regimen_codes is accepted and flagged non-concordant" }
      - { name: off_pathway_penalty_score, type: number, source: input, description: "Compliance-score penalty per non-concordant administration (0..1)" }
      - { name: version_label, type: string, source: input, description: "Protocol version label" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }

  - name: PracticeManagementAgreement
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; practice receiving management services" }
      - { name: service_line, type: enum, source: input, description: "REVENUE_CYCLE | STAFFING | TECHNOLOGY" }
      - { name: fee_basis, type: enum, source: input, description: "PERCENT_OF_NET_COLLECTIONS | FIXED_MONTHLY | PER_FTE | PER_CLAIM" }
      - { name: fee_rate, type: number, source: input, description: "Rate for PERCENT_OF_NET_COLLECTIONS basis (0..0.15); ignored for other bases" }
      - { name: fixed_fee_cents, type: integer, source: input, default: 0, description: "Monthly fee for FIXED_MONTHLY basis" }
      - { name: per_fte_fee_cents, type: integer, source: input, default: 0, description: "Fee per FTE for PER_FTE basis" }
      - { name: fte_count, type: integer, source: input, default: 0, description: "Billable FTEs on the engagement" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive engagement start (closed interval)" }
      - { name: term_end, type: datetime, source: input, description: "Inclusive engagement end; a 30-day blackout must separate terms of the same service_line" }
      - { name: accrued_fee_cents, type: integer, source: computed, description: "Fees accrued across active term months" }
      - { name: active_month_count, type: integer, source: computed, description: "Whole months the agreement was ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: ResearchParticipation
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; community site opening the trial" }
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: study_protocol_number, type: string, source: input, description: "Sponsor protocol number" }
      - { name: study_phase, type: enum, source: input, description: "PHASE_I | PHASE_II | PHASE_III" }
      - { name: sponsor_name, type: string, source: input, description: "Trial sponsor" }
      - { name: target_enrollment, type: integer, source: input, description: "Site enrollment target" }
      - { name: enrolled_participant_count, type: integer, source: computed, default: 0, description: "Participants enrolled at this site" }
      - { name: site_status, type: enum, source: system, description: "APPLIED | FEASIBILITY_REVIEW | ACTIVATED | SUSPENDED | DEACTIVATED" }

  - name: DrugShortage
    parent: OncologyNetwork
    common_fields: true
    fields:
      - { name: network_id, type: string, source: system, description: "FK -> OncologyNetwork.id; owning network" }
      - { name: drug_product_id, type: string, source: system, description: "FK -> DrugProduct.id; constrained product" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the shortage was reported" }
      - { name: supply_available_units, type: integer, source: input, description: "Units the network can distribute in the current allocation epoch" }
      - { name: allocation_method, type: enum, source: input, description: "PRO_RATA_BASELINE | PRIORITY_PATHWAY | EQUAL_SPLIT" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Units distributed to practices by the most recent allocation run" }
      - { name: unallocated_units, type: integer, source: computed, description: "supply_available_units - allocated_units among non-revoked grants" }
      - { name: unclaimed_authorization_cents, type: integer, source: computed, default: 0, description: "Consumption authorization granted but not yet committed; the second conserved quantity of the shortage" }
      - { name: status, type: enum, source: system, description: "REPORTED | ALLOCATING | ACTIVE | RESOLVED" }

  - name: ShortageAllocation
    parent: DrugShortage
    common_fields: true
    fields:
      - { name: shortage_id, type: string, source: system, description: "FK -> DrugShortage.id; shortage event this grant belongs to" }
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; practice receiving the grant" }
      - { name: allocated_units, type: integer, source: computed, description: "Units granted to the practice by the allocation run" }
      - { name: consumption_authorization_cents, type: integer, source: input, description: "Dollar ceiling the practice may commit against this grant; consumption is measured in cents, capped by this figure, while the grant itself is denominated in units" }
      - { name: consumed_authorization_cents, type: integer, source: computed, default: 0, description: "authorization_cents already committed by confirmed orders; unit allocation and dollar consumption are both enforced against the same grant" }
      - { name: committed_units, type: integer, source: computed, default: 0, description: "Units the practice has committed through shortage purchase orders" }
      - { name: allocation_rank, type: integer, source: computed, description: "1-based rank in the allocation order (method-dependent, tie-broken by Practice.created_at ASC)" }
      - { name: expires_epoch_index, type: integer, source: computed, description: "Allocation epoch at which an uncommitted grant expires" }
      - { name: status, type: enum, source: system, description: "GRANTED | PARTIALLY_COMMITTED | FULLY_COMMITTED | EXPIRED | REVOKED" }

  - name: AffiliationContract
    parent: Practice
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; affiliated practice" }
      - { name: contract_type, type: enum, source: input, description: "FULL_AFFILIATION | MANAGEMENT_SERVICES_ONLY | PURCHASING_ONLY" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive contract start" }
      - { name: term_end, type: datetime, source: input, description: "Inclusive contract end" }
      - { name: notice_period_days, type: integer, source: input, description: "Notice required before departure takes effect" }
      - { name: pricing_agreements_unwound, type: boolean, source: computed, default: false, description: "True once all ACTIVE pricing agreements are SUPERSEDED by the unwind" }
      - { name: open_orders_closed, type: boolean, source: computed, default: false, description: "True once no non-terminal purchase order remains for the practice" }
      - { name: rebate_holdback_cents, type: integer, source: computed, default: 0, description: "Rebate dollars withheld at termination: unverified or provisional rebate amounts" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEPARTURE_NOTICE | UNWIND_IN_PROGRESS | TERMINATED" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: OncologyNetwork
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /networks/{networkId}/advance-epoch"
        actor: NetworkAdmin
        preconditions:
          - "by_epochs is a positive integer (ERR_INVALID_REQUEST)"
          - "by_epochs <= 12 (ERR_INVALID_REQUEST)"
          - "No RebateQualification in status PENDING whose period_epoch_index is at or before the target epoch (ERR_OPEN_REBATE_CLAIMS_EXIST — checked before the epoch is advanced)"
        side_effects:
          - "allocation_epoch_index += by_epochs"
          - "Each Practice with affiliation_status == DEPARTING and departure_effective_epoch_index <= allocation_epoch_index → DEPARTED (this hop is what makes epoch occurrence, not any caller, the departure trigger)"
          - "Each RebateQualification whose period_epoch_index < allocation_epoch_index and status == PENDING and compliance_report_verified == false → DISQUALIFIED"
          - "Each RebateQualification in status QUALIFIED or PAID whose period_epoch_index < the new allocation_epoch_index has rebate_amount_cents recomputed with the final variant"
          - "is_commercial_terms_frozen recomputed: true while at least one Practice of this network is DEPARTED or DEPARTING"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /networks/{networkId}/freeze-commercial-terms"
        actor: NetworkAdmin
        preconditions:
          - "is_commercial_terms_frozen == false (ERR_TERMS_ALREADY_FROZEN)"
        side_effects:
          - "is_commercial_terms_frozen = true"
          - "PracticePricingAgreement creation is rejected with ERR_TERMS_FROZEN while frozen"

  # ---------------------------------------------------------------------------
  # Parallel state dimensions: affiliation_status (lifecycle) and
  # pathway_steering_status (program) evolve independently on the same row.
  - entity: Practice
    initial_state: PROSPECTIVE
    terminal_states: [DEPARTED]
    # Two independent state axes on one row. affiliation_status reaches a
    # terminal DEPARTED, but the pathway axis is never terminal: a practice can
    # withdraw from and re-adopt the program any number of times, and the two
    # axes transition without consulting each other (a practice may be DEPARTED
    # while its pathway axis is still SUSPENDED).
    parallel_dimensions:
      - name: affiliation_status
        initial_state: PROSPECTIVE
        terminal_states: [DEPARTED]
      - name: pathway_steering_status
        initial_state: NOT_ADOPTED
        terminal_states: []
    transitions:
      - from: PROSPECTIVE
        to: AFFILIATED
        trigger: "POST /networks/practices/{practiceId}/affiliate"
        actor: NetworkAdmin
        preconditions:
          - "Practice.affiliation_status == PROSPECTIVE (ERR_PRACTICE_NOT_PROSPECTIVE)"
          - "At least one PracticePricingAgreement for this practice with status in {DRAFT, ACTIVE} (ERR_NO_PRICING_AGREEMENT)"
          - "tier_level is set directly from tier_level of the LATEST-created PricingAgreement for this practice (tie-break: latest effective_from, then the greater id lexicographically) — affiliation consumes the tier the practice was sold, it is not recomputed from purchase history"
          - "No other Practice in the same network with the same practice_npi (uniqueness is network-scoped; ERR_DUPLICATE_PRACTICE_NPI)"
        side_effects:
          - "affiliation_status = AFFILIATED"
          - "tier_level recomputed from trailing_12m_network_purchases_cents against the network ladder"
          - "Network.is_commercial_terms_frozen recomputed"

      - from: AFFILIATED
        to: SUSPENDED
        trigger: "POST /networks/practices/{practiceId}/suspend"
        actor: NetworkAdmin
        preconditions:
          - "affiliation_status == AFFILIATED (ERR_PRACTICE_NOT_AFFILIATED)"
        side_effects:
          - "affiliation_status = SUSPENDED"
          - "pathway_steering_status → SUSPENDED if it was ACTIVE (the suspension is reason-agnostic)"

      - from: SUSPENDED
        to: AFFILIATED
        trigger: "POST /networks/practices/{practiceId}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "affiliation_status == SUSPENDED (ERR_PRACTICE_NOT_SUSPENDED)"
          - "The practice's count of PracticeManagementAgreement rows in status SUSPENDED is 0 (ERR_OPEN_MANAGEMENT_SUSPENSION — a practice may not return to AFFILIATED while any management engagement is still suspended)"
        side_effects:
          - "affiliation_status = AFFILIATED"
          - "pathway_steering_status stays NOT_ADOPTED; it is NOT auto-restored"

      - from: AFFILIATED
        to: DEPARTING
        trigger: "POST /networks/practices/{practiceId}/departure-notice"
        actor: NetworkAdmin | PracticeAdmin
        preconditions:
          - "affiliation_status == AFFILIATED (ERR_PRACTICE_NOT_AFFILIATED)"
          - "An AffiliationContract in status ACTIVE exists for the practice (ERR_NO_ACTIVE_AFFILIATION_CONTRACT)"
          - "earliest-deadline rule: departure_effective_epoch_index = allocation_epoch_index + ceil(notice_period_days / 30), where notice_period_days is taken from the ACTIVE AffiliationContract with the latest term_start (tie-break: latest created_at)"

      - from: SUSPENDED
        to: DEPARTING
        trigger: "POST /networks/practices/{practiceId}/departure-notice"
        actor: NetworkAdmin
        preconditions:
          - "affiliation_status == SUSPENDED (ERR_PRACTICE_NOT_AFFILIATED)"
          - "All PracticeManagementAgreement rows for the practice are in status TERMINATED (ERR_OPEN_MANAGEMENT_AGREEMENT — checked at priority 5b, before the contract check)"
          - "An AffiliationContract in status ACTIVE exists for the practice (ERR_NO_ACTIVE_AFFILIATION_CONTRACT)"
        side_effects:
          - "affiliation_status = DEPARTING"
          - "AffiliationContract → DEPARTURE_NOTICE; its status change recomputes rebate_holdback_cents = the sum of provisional and unverified RebateQualification amounts for the practice"
          - "The recomputed holdback on the ACTIVE AffiliationContract itself flags every RebateQualification of the practice with status PENDING or QUALIFIED: holdback_cents = that qualification's rebate_amount_cents when compliance_report_verified == false, else holdback_cents = 0"
          - "Each RebateQualification flagged with holdback_cents > 0 → status RECLAIMED and is_qualified = false, and the practice's unsettled_balance_cents += the same amount"
          - "Each ShortageAllocation of this practice with status in {GRANTED, PARTIALLY_COMMITTED} → REVOKED, releasing its allocated_units back into DrugShortage.unallocated_units"
          - "Practice.is_rebate_qualified = false"
          - "Network.is_commercial_terms_frozen recomputed"

      - from: DEPARTING
        to: DEPARTED
        trigger: "system (fires inside POST /networks/{networkId}/advance-epoch when allocation_epoch_index reaches departure_effective_epoch_index)"
        actor: system
        preconditions:
          - "affiliation_status == DEPARTING and departure_effective_epoch_index <= allocation_epoch_index"
        side_effects:
          - "affiliation_status = DEPARTED"
          - "Each PracticePricingAgreement for the practice in status ACTIVE → SUPERSEDED, superseded_by_agreement_id stays null (the unwind is not a replacement)"
          - "status_changed_by = 'DEPARTURE_UNWIND' on each superseded row"
          - "pathway_steering_status → NOT_ADOPTED and pathway_adherence_pct = 0"
          - "AffiliationContract → UNWIND_IN_PROGRESS"
          - "Network.is_commercial_terms_frozen recomputed"

      - from: DEPARTING
        to: AFFILIATED
        trigger: "POST /networks/practices/{practiceId}/withdraw-departure"
        actor: NetworkAdmin | PracticeAdmin
        preconditions:
          - "affiliation_status == DEPARTING (ERR_PRACTICE_NOT_DEPARTING)"
          - "departure_effective_epoch_index > allocation_epoch_index (ERR_DEPARTURE_ALREADY_EFFECTIVE — once the epoch has arrived the departure cannot be withdrawn)"
        side_effects:
          - "affiliation_status = AFFILIATED; departure_effective_epoch_index = null"
          - "AffiliationContract → ACTIVE; its status change recomputes rebate_holdback_cents = 0"
          - "The zeroed holdback on the AffiliationContract itself flags every RebateQualification of the practice with status RECLAIMED: holdback_cents = 0, is_qualified = true, status → QUALIFIED"
          - "Each RebateQualification so restored has its amount subtracted from the practice: unsettled_balance_cents -= the restored amount"
          - "Each PracticePricingAgreement in status SUPERSEDED with superseded_by_agreement_id == null and status_changed_by == DEPARTURE_UNWIND → ACTIVE"
          - "Network.is_commercial_terms_frozen recomputed"

      - from: PROSPECTIVE
        to: DEPARTED
        trigger: "POST /networks/practices/{practiceId}/withdraw-affiliation"
        actor: NetworkAdmin
        preconditions:
          - "affiliation_status == PROSPECTIVE (ERR_PRACTICE_DEPARTURE_NOT_ALLOWED)"
          - "An AffiliationContract in status ACTIVE exists (ERR_NO_ACTIVE_AFFILIATION_CONTRACT)"
        side_effects:
          - "affiliation_status = DEPARTED"
          - "AffiliationContract → TERMINATED with rebate_holdback_cents = 0 and open_orders_closed = true"
          - "Any DrugPurchaseOrder for the practice in status in {SUBMITTED, CONFIRMED, BACKORDERED} → CANCELLED with return_to_supplier = false"

      - from: NOT_ADOPTED
        to: ACTIVE
        trigger: "POST /networks/practices/{practiceId}/pathways/adopt"
        actor: PracticeAdmin | NetworkAdmin
        preconditions:
          - "pathway_steering_status == NOT_ADOPTED (ERR_PATHWAY_ALREADY_ADOPTED)"
          - "At least one PathwayProtocol in status PUBLISHED exists for the network (ERR_NO_PUBLISHED_PROTOCOL)"
        side_effects:
          - "pathway_steering_status = ACTIVE"
          - "Every PatientTreatment of the practice in status SCHEDULED is re-evaluated: is_pathway_concordant = (regimen_code ∈ on_pathway_regimen_codes of the protocol in force at administered_at)"
          - "pathway_adherence_pct recomputed over the same re-evaluated set"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /networks/practices/{practiceId}/pathways/suspend"
        actor: NetworkAdmin
        preconditions:
          - "pathway_steering_status == ACTIVE (ERR_PATHWAY_NOT_ACTIVE)"
        side_effects:
          - "pathway_steering_status = SUSPENDED"
          - "Shortage allocations for this practice fall back to the non-pathway ordering branch of the allocation run"
          - "pathway_adherence_pct is preserved (not zeroed) while suspended"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /networks/practices/{practiceId}/pathways/adopt"
        actor: PracticeAdmin | NetworkAdmin
        preconditions:
          - "pathway_steering_status == SUSPENDED (ERR_PATHWAY_ALREADY_ADOPTED)"
        side_effects:
          - "pathway_steering_status = ACTIVE"

      - from: ACTIVE
        to: NOT_ADOPTED
        trigger: "POST /networks/practices/{practiceId}/pathways/withdraw"
        actor: PracticeAdmin | NetworkAdmin
        preconditions:
          - "pathway_steering_status == ACTIVE (ERR_PATHWAY_NOT_ACTIVE)"
        side_effects:
          - "pathway_steering_status = NOT_ADOPTED"
          - "pathway_adherence_pct = 0; historical PatientTreatment.is_pathway_concordant values are left intact"

  # ---------------------------------------------------------------------------
  # Cyclic revision loop: DRAFT → PENDING_APPROVAL → {ACTIVE | DRAFT | REJECTED}
  # with an explicit revert edge back into DRAFT.
  - entity: PracticePricingAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /networks/pricing-agreements/{agreementId}/submit"
        actor: PracticeAdmin
        preconditions:
          - "status == DRAFT (ERR_AGREEMENT_NOT_DRAFT)"
          - "Network.is_commercial_terms_frozen == false (ERR_TERMS_FROZEN — a frozen network accepts no new pricing agreements)"
          - "Practice.affiliation_status == AFFILIATED (ERR_PRACTICE_NOT_AFFILIATED)"
          - "Network.is_commercial_terms_frozen == false (ERR_TERMS_FROZEN)"
          - "No other PracticePricingAgreement for the same practice and same tier_level whose window intersects [effective_from, effective_to) in status in {PENDING_APPROVAL, ACTIVE} (ERR_PRICING_WINDOW_OVERLAP)"
          - "effective_to is null or strictly greater than effective_from (ERR_INVALID_EFFECTIVE_WINDOW)"
          - "effective_from is at or after the practice's earliest AffiliationContract.term_start (ERR_PRICING_WINDOW_BEFORE_CONTRACT)"
        side_effects:
          - "status = PENDING_APPROVAL"

      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /networks/pricing-agreements/{agreementId}/approve"
        actor: NetworkAdmin
        preconditions:
          - "status == PENDING_APPROVAL (ERR_AGREEMENT_NOT_PENDING)"
          - "approved_by_user_id != the X-User-ID that submitted the agreement (ERR_SEGREGATION_OF_DUTIES — the submitter may not approve)"
          - "The submitter recorded on the agreement is not the practice's own PracticeAdmin identity (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = ACTIVE; approved_by_user_id = X-User-ID; submitted_by_user_id keeps its value"
          - "Every other ACTIVE agreement of the practice with the same tier_level and an overlapping window → SUPERSEDED with superseded_by_agreement_id pointing at this agreement"
          - "status_changed_by = 'AGREEMENT_APPROVAL' on each superseded row"
          - "Practice.tier_level is set to this agreement's tier_level"
          - "market_share_pct recomputed against the newly effective rebate routing term for the practice's open RebateQualification rows"
          - "increments Practice.version by 1"

      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /networks/pricing-agreements/{agreementId}/return-to-draft"
        actor: NetworkAdmin
        preconditions:
          - "status == PENDING_APPROVAL (ERR_AGREEMENT_NOT_PENDING)"
        side_effects:
          - "status = DRAFT; approved_by_user_id cleared to null"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /networks/pricing-agreements/{agreementId}/reject"
        actor: NetworkAdmin
        preconditions:
          - "status == PENDING_APPROVAL (ERR_AGREEMENT_NOT_PENDING)"
        side_effects:
          - "status = REJECTED"

      - from: ACTIVE
        to: DRAFT
        trigger: "POST /networks/pricing-agreements/{agreementId}/return-to-draft"
        actor: NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_AGREEMENT_NOT_PENDING)"
          - "No DrugPurchaseOrder priced under this agreement exists in status in {CONFIRMED, SHIPPED, RECEIVED} (ERR_AGREEMENT_IN_USE)"
        side_effects:
          - "status = DRAFT"
          - "Orders already SUBMITTED under this agreement keep their pricing_tier_applied and unit_price_cents (pricing is pinned at submission)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (fired by approval of an overlapping successor, by departure unwind, or by POST /networks/pricing-agreements/{agreementId}/supersede)"
        actor: system | NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status = SUPERSEDED"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (fires inside POST /networks/payer-claims/{claimId}/deny when the practice denial ratio strictly exceeds the network threshold)"
        actor: system
        preconditions:
          - "status == ACTIVE and the practice meets the denial-ratio condition"
        side_effects:
          - "status = SUSPENDED"
          - "status_changed_by = 'DENIAL_RATIO_BREACH'"
          - "The suspension itself triggers the price-transparency term: the practice's Practice tier_level recomputes to TIER_1 while any agreement is SUSPENDED"
          - "Practice.is_commercial_terms_frozen = true"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /networks/pricing-agreements/{agreementId}/reinstate"
        actor: NetworkAdmin
        preconditions:
          - "status == SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
          - "The practice's denial ratio is at or below the network threshold (ERR_DENIAL_RATIO_STILL_BREACHED)"
        side_effects:
          - "status = ACTIVE"
          - "Practice.tier_level recomputed from trailing_12m_network_purchases_cents against the ladder"

  # ---------------------------------------------------------------------------
  # Cyclic with explicit revert edges: orders can be cancelled from any
  # non-terminal state, and a BACKORDERED order can be revived.
  - entity: DrugPurchaseOrder
    initial_state: SUBMITTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/confirm"
        actor: NetworkAdmin
        preconditions:
          - "status == SUBMITTED (ERR_ORDER_NOT_SUBMITTED)"
          - "Practice.affiliation_status == AFFILIATED; a network commercial-terms freeze is deliberately NOT a confirmation blocker (ERR_PRACTICE_NOT_AFFILIATED)"
          - "The practice's ACTIVE AffiliationContract covers the confirmation instant: term_start <= now < term_end (ERR_CONTRACT_LAPSED)"
          - "DrugProduct.status == ACTIVE (ERR_PRODUCT_NOT_ORDERABLE)"
          - "If drug_product_id is the product of an DrugShortage in status in {REPORTED, ALLOCATING, ACTIVE}, a ShortageAllocation for this practice covering quantity_units must exist (ERR_NO_SHORTAGE_ALLOCATION) and must have that many uncommitted units (ERR_ALLOCATION_OVERCOMMIT)"
        side_effects:
          - "status = CONFIRMED"
          - "If the order draws on a shortage allocation: allocation.committed_units += quantity_units; allocation.status becomes PARTIALLY_COMMITTED or FULLY_COMMITTED; the parent DrugShortage.allocated_units += quantity_units"
          - "trailing_12m_network_purchases_cents is NOT yet changed (only receipts post to the trailing-window basis)"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/cancel"
        actor: PracticeAdmin
        preconditions:
          - "status ∈ {SUBMITTED, CONFIRMED, BACKORDERED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status = CANCELLED"
          - "If the order drew on a shortage allocation: allocation.committed_units -= quantity_units and DrugShortage.allocated_units -= quantity_units, restoring DrugShortage.unallocated_units by exactly the same amount"

      - from: CONFIRMED
        to: BACKORDERED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/backorder"
        actor: NetworkAdmin
        preconditions:
          - "status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "status = BACKORDERED"
          - "The order's allocation commitment is retained while backordered; unallocated_units is NOT released"

      - from: BACKORDERED
        to: CONFIRMED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/confirm"
        actor: NetworkAdmin
        preconditions:
          - "status == BACKORDERED (ERR_ORDER_NOT_SUBMITTED)"
          - "An unallocated DrugShortage allocation for the practice still covers the quantity if the product is shortage-restricted (ERR_NO_SHORTAGE_ALLOCATION)"
        side_effects:
          - "status = CONFIRMED"

      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/ship"
        actor: NetworkAdmin
        preconditions:
          - "status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "status = SHIPPED"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/receive"
        actor: PracticeAdmin
        preconditions:
          - "status == SHIPPED (ERR_ORDER_NOT_SHIPPED)"
          - "quantity_units > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = RECEIVED; received_at = the logical clock"
          - "An InventoryLot is created under the practice with quantity_received = quantity_units, quantity_remaining = quantity_units, acquisition_cost_cents_per_unit = unit_price_cents, status AVAILABLE"
          - "Practice.trailing_12m_network_purchases_cents += extended_cost_cents"
          - "Practice.tier_level recomputed against the network ladder"
          - "If the order drew on a shortage allocation and the allocation is now fully committed, allocation.status = FULLY_COMMITTED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/cancel"
        actor: PracticeAdmin
        preconditions:
          - "status ∈ {SUBMITTED, CONFIRMED, BACKORDERED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status = CANCELLED"
          - "If the order drew on a shortage allocation: allocation.committed_units -= quantity_units and DrugShortage.allocated_units -= quantity_units"

      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /networks/drug-purchase-orders/{orderId}/cancel"
        actor: PracticeAdmin
        preconditions:
          - "status ∈ {SUBMITTED, CONFIRMED, BACKORDERED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status = CANCELLED"
          - "If the order drew on a shortage allocation: allocation.committed_units -= quantity_units and DrugShortage.allocated_units -= quantity_units"

  # ---------------------------------------------------------------------------
  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [EXPIRED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (fires inside POST /networks/patient-treatments/{treatmentId}/administer when quantity_remaining reaches 0)"
        actor: system
        preconditions:
          - "quantity_remaining == 0 after the draw"
        side_effects:
          - "status = DEPLETED"

      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /networks/inventory-lots/{lotId}/quarantine"
        actor: PracticeAdmin
        preconditions:
          - "status == AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
          - "The lot's drug product is not currently the product of an DrugShortage in status ACTIVE (ERR_LOT_QUARANTINE_BLOCKED_BY_SHORTAGE)"
        side_effects:
          - "status = QUARANTINED"
          - "The lot is removed from the candidate set for FIFO draws"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /networks/inventory-lots/{lotId}/release"
        actor: PracticeAdmin
        preconditions:
          - "status == QUARANTINED (ERR_LOT_NOT_QUARANTINED)"
          - "expires_at > the logical clock (ERR_LOT_EXPIRED)"
        side_effects:
          - "status = AVAILABLE"

      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (fires inside POST /networks/patient-treatments/{treatmentId}/administer for every available lot whose expires_at is at or before the administration instant, and inside POST /networks/inventory-lots/{lotId}/read-expiry)"
        actor: system
        preconditions:
          - "expires_at <= the evaluated instant"
        side_effects:
          - "status = EXPIRED; the lot is excluded from all future draws"

      - from: QUARANTINED
        to: EXPIRED
        trigger: "system (fires when the evaluated instant reaches expires_at while quarantined)"
        actor: system
        preconditions:
          - "expires_at <= the evaluated instant"
        side_effects:
          - "status = EXPIRED"

  # ---------------------------------------------------------------------------
  - entity: Provider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /networks/providers/{providerId}/deactivate"
        actor: PracticeAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "The provider has no PatientTreatment in status SCHEDULED (ERR_TREATMENT_NOT_SCHEDULED — a scheduled administration blocks deactivation)"
        side_effects:
          - "status = INACTIVE"
          - "The provider is excluded from the candidate set for new treatments"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /networks/providers/{providerId}/reactivate"
        actor: PracticeAdmin
        preconditions:
          - "status == INACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "status = ACTIVE"

  # ---------------------------------------------------------------------------
  - entity: DrugProduct
    initial_state: ACTIVE
    terminal_states: [RECALLED]
    transitions:
      - from: ACTIVE
        to: SHORTAGE_RESTRICTED
        trigger: "system (fires inside POST /networks/drug-shortages/{shortageId}/activate)"
        actor: system
        preconditions:
          - "the shortage event reached ACTIVE"
        side_effects:
          - "status = SHORTAGE_RESTRICTED"

      - from: SHORTAGE_RESTRICTED
        to: ACTIVE
        trigger: "system (fires inside POST /networks/drug-shortages/{shortageId}/resolve)"
        actor: system
        preconditions:
          - "no other shortage for this product remains in status in {REPORTED, ALLOCATING, ACTIVE}"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: RECALLED
        trigger: "POST /networks/drug-products/{productId}/recall"
        actor: NetworkAdmin
        preconditions:
          - "status != RECALLED (ERR_INVALID_STATE)"
          - "No shortage event for this product is in status in {REPORTED, ALLOCATING, ACTIVE} (ERR_SHORTAGE_NOT_ACTIVE — a recalled product may not carry a live shortage)"
        side_effects:
          - "status = RECALLED"
          - "Ordering is blocked: POST /networks/drug-purchase-orders and order confirmation reject with ERR_PRODUCT_NOT_ORDERABLE"

      - from: SHORTAGE_RESTRICTED
        to: RECALLED
        trigger: "POST /networks/drug-products/{productId}/recall"
        actor: NetworkAdmin
        preconditions:
          - "status != RECALLED (ERR_INVALID_STATE)"
          - "No shortage event for this product is in status in {REPORTED, ALLOCATING, ACTIVE} (ERR_SHORTAGE_NOT_ACTIVE — a recalled product may not carry a live shortage)"
        side_effects:
          - "status = RECALLED"

  # ---------------------------------------------------------------------------
  - entity: RebateProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /networks/rebate-programs/{programId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /networks/rebate-programs/{programId}/close"
        actor: NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "No RebateQualification for this program is in status PENDING (ERR_OPEN_REBATE_CLAIMS_EXIST)"
        side_effects:
          - "status = CLOSED"
          - "No further RebateQualification may be created for this program (ERR_INVALID_STATE)"

  # ---------------------------------------------------------------------------
  - entity: PatientTreatment
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /networks/patient-treatments (creation)"
        actor: PracticeAdmin
        preconditions:
          - "pathway_protocol_id must name a PathwayProtocol in status PUBLISHED for the administered product's drug class (ERR_INVALID_PROTOCOL_FOR_PRODUCT)"
        side_effects:
          - "status stays SCHEDULED; the guard is what makes a mis-classed protocol unreachable at administration"

      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /networks/patient-treatments/{treatmentId}/administer"
        actor: PracticeAdmin
        preconditions:
          - "status == SCHEDULED (ERR_TREATMENT_NOT_SCHEDULED)"
          - "Practice.affiliation_status == AFFILIATED and the practice's pathway_steering_status == ACTIVE (ERR_PRACTICE_NOT_AFFILIATED)"
          - "Provider.status == ACTIVE (ERR_PROVIDER_NOT_ACTIVE)"
          - "administered_at is the current logical clock or earlier (ERR_INVALID_ADMINISTRATION_TIME)"
          - "Stock sufficiency: the sum of quantity_remaining over the practice's InventoryLot rows for this drug_product_id with status == AVAILABLE and expires_at > administered_at is >= the dose requirement of administered_units given vial_yield_units (ERR_INSUFFICIENT_STOCK)"
          - "The inventory lots are drawn first-expiring-first-out; among lots sharing expires_at, the tie-break is created_at ASC"
        side_effects:
          - "status = ADMINISTERED"
          - "LotConsumption rows are created in FIFO order with consumption_sequence = 1..N, quantity_consumed per lot, and cost_basis_cents = quantity_consumed * acquisition_cost_cents_per_unit"
          - "The vial-rounded draw plan is recorded on dose_allocations: [{vial_count, dose_units, waste_per_dose_units}] per dose, with dose_units = dose_units_per_dose"
          - "Under the ROUND_UP dose plan the waste_per_dose_units * dose_count remainder is emitted as a final LotConsumption row with is_wastage = true, drawn from the terminal lot at the same per-unit cost basis"
          - "wastage_units = dose_count * waste_per_dose_units under ROUND_UP, and 0 under ROUND_DOWN"
          - "acquisition_cost_basis_cents = sum of LotConsumption.cost_basis_cents over all rows; wastage_cost_basis_cents = the subset with is_wastage == true"
          - "Each drawn lot: quantity_remaining -= quantity_consumed; wastage_units and waste_cost_basis_cents increase by any discarded units; if quantity_remaining == 0 the lot → DEPLETED"
          - "is_pathway_concordant = (regimen_code ∈ on_pathway_regimen_codes of the PathwayProtocol in status PUBLISHED at administered_at for this product's indication)"
          - "If is_pathway_concordant == false: the practice's compliance contribution drops — the RebateQualification of the practice for the program covering this product gains off_pathway_penalty_score x 1 non-concordant administration in its compliance_score recompute"
          - "pathway_adherence_pct recomputed over all PatientTreatment rows of the practice whose status ∈ {ADMINISTERED, BILLED}"
          - "A PayerClaim is created in status DRAFT for this treatment"
          - "on_hand_units_dual_variant recomputed: the practice's expiring and usable on-hand figures are refreshed as of administered_at and exposed by the stock report"

      - from: ADMINISTERED
        to: BILLED
        trigger: "POST /networks/payer-claims/{claimId}/submit"
        actor: RevenueCycleManager
        preconditions:
          - "status == ADMINISTERED for the parent treatment (ERR_TREATMENT_NOT_ADMINISTERED)"
          - "Claim.status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "Practice.affiliation_status == AFFILIATED (ERR_PRACTICE_NOT_AFFILIATED)"
        side_effects:
          - "Treatment.status = BILLED"
          - "Claim.status = SUBMITTED"

      - from: ADMINISTERED
        to: VOIDED
        trigger: "POST /networks/patient-treatments/{treatmentId}/void"
        actor: NetworkAdmin
        preconditions:
          - "status == ADMINISTERED (ERR_TREATMENT_NOT_ADMINISTERED)"
          - "The treatment's PayerClaim is in status in {DRAFT, DENIED} and no appeal has been filed (ERR_TREATMENT_HAS_SUBMITTED_CLAIM)"
        side_effects:
          - "status = VOIDED"
          - "The claim is voided and the drug basis is reversed: acquisition_cost_basis_cents is not re-posted to any network ledger, but the practice's wastage_units total drops by the treatment's wastage_units"
          - "pathway_adherence_pct recomputed over the remaining ADMINISTERED/BILLED rows"

      - from: BILLED
        to: VOIDED
        trigger: "POST /networks/patient-treatments/{treatmentId}/void"
        actor: NetworkAdmin
        preconditions:
          - "status == BILLED (ERR_TREATMENT_NOT_ADMINISTERED)"
          - "The treatment's PayerClaim is in status VOIDED (ERR_TREATMENT_HAS_SUBMITTED_CLAIM)"
        side_effects:
          - "status = VOIDED"

  # ---------------------------------------------------------------------------
  - entity: PayerClaim
    initial_state: DRAFT
    terminal_states: [ADJUDICATED_PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /networks/payer-claims/{claimId}/submit"
        actor: RevenueCycleManager
        preconditions:
          - "status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "billed_amount_cents > 0 (ERR_CLAIM_NOTHING_TO_BILL)"
          - "Claim.payer_name is non-empty and matches the treatment's payer evidence (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = SUBMITTED; billed_amount_cents is computed and pinned at submission using the per-line-rounded assembly"

      - from: SUBMITTED
        to: ADJUDICATED_PAID
        trigger: "POST /networks/payer-claims/{claimId}/adjudicate"
        actor: RevenueCycleManager
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "paid_amount_cents > 0 (ERR_INVALID_REQUEST)"
          - "paid_amount_cents <= billed_amount_cents (ERR_PAYER_OVERPAYMENT)"
        side_effects:
          - "status = ADJUDICATED_PAID"
          - "allowed_amount_cents = min(billed_amount_cents, paid_amount_cents + the claim's write-off, i.e. the payer fee-schedule amount pinned at billing)"
          - "paid_amount_cents is stored as remitted"
          - "allowed_amount_cents is posted to the practice's net-collections basis used by management-fee accrual"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /networks/payer-claims/{claimId}/deny"
        actor: PayerAdjudicator
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "denial_reason_code is a member of the declared denial code set (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = DENIED; denial_reason_code stored"
          - "The practice's unsettled_balance_cents += billed_amount_cents"
          - "Practice denial-ratio recompute: if (count of PayerClaim for the practice with status == DENIED) / (count with status ∈ {DENIED, ADJUDICATED_PAID}) strictly exceeds the network's denial-ratio threshold of 0.20, the practice's convener suspends pricing"

      - from: DENIED
        to: APPEALED
        trigger: "POST /networks/payer-claims/{claimId}/appeal"
        actor: RevenueCycleManager
        preconditions:
          - "status == DENIED (ERR_CLAIM_NOT_DENIED)"
          - "appeal_round < 2 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "status = APPEALED; appeal_round += 1"
          - "The practice's unsettled_balance_cents -= billed_amount_cents (the denial is parked pending appeal outcome)"

      - from: APPEALED
        to: ADJUDICATED_PAID
        trigger: "POST /networks/payer-claims/{claimId}/adjudicate"
        actor: PayerAdjudicator
        preconditions:
          - "status == APPEALED (ERR_CLAIM_NOT_SUBMITTED)"
          - "paid_amount_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = ADJUDICATED_PAID"
          - "allowed_amount_cents posted to the practice's net-collections basis"

      - from: APPEALED
        to: DENIED
        trigger: "POST /networks/payer-claims/{claimId}/deny"
        actor: PayerAdjudicator
        preconditions:
          - "status == APPEALED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "status = DENIED"
          - "The practice's unsettled_balance_cents += billed_amount_cents"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /networks/payer-claims/{claimId}/void"
        actor: RevenueCycleManager
        preconditions:
          - "status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
        side_effects:
          - "status = VOIDED"

      - from: DENIED
        to: VOIDED
        trigger: "POST /networks/payer-claims/{claimId}/void"
        actor: NetworkAdmin
        preconditions:
          - "status == DENIED and appeal_round == 0 (ERR_CLAIM_NOT_VOIDABLE)"
        side_effects:
          - "status = VOIDED"
          - "The practice's unsettled_balance_cents -= billed_amount_cents"

  # ---------------------------------------------------------------------------
  - entity: RebateQualification
    initial_state: PENDING
    terminal_states: [PAID, RECLAIMED]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /networks/rebate-qualifications/{qualificationId}/report"
        actor: PracticeAdmin
        preconditions:
          - "status == PENDING (ERR_QUALIFICATION_NOT_PENDING)"
          - "compliance_report_submitted_at is null (ERR_INVALID_STATE — a report may be submitted once per epoch)"
          - "The logical clock is at most compliance_report_grace_days after the network closed the qualification's epoch, i.e. at or before the instant the epoch's month boundary plus the grace period (ERR_COMPLIANCE_REPORT_LATE)"
        side_effects:
          - "compliance_report_submitted_at = the logical clock"
          - "reporting_timeliness is scored 1.0 when the report landed on or before the epoch close and 0.5 when it landed inside the grace period"
          - "compliance_score and compact_discount_credit_cents recomputed"
          - "increments RebateQualification.version by 1"

      - from: PENDING
        to: QUALIFIED
        trigger: "POST /networks/rebate-qualifications/{qualificationId}/evaluate"
        actor: NetworkAdmin
        preconditions:
          - "status == PENDING (ERR_QUALIFICATION_NOT_PENDING)"
          - "The qualification's period_epoch_index is at or before the network's allocation_epoch_index (ERR_QUALIFICATION_PERIOD_NOT_ELAPSED)"
        side_effects:
          - "status = QUALIFIED if is_qualified == true, else DISQUALIFIED"
          - "rebate_amount_cents pinned with the final variant when the qualification's period_epoch_index is strictly before allocation_epoch_index, and with the provisional variant otherwise"

      - from: PENDING
        to: DISQUALIFIED
        trigger: "system (fires inside advance-epoch for reports still unverified past their epoch) or POST /networks/rebate-qualifications/{qualificationId}/evaluate"
        actor: system | NetworkAdmin
        preconditions:
          - "is_qualified == false, or the compliance report for the epoch was never verified"
        side_effects:
          - "status = DISQUALIFIED; rebate_amount_cents = 0"
          - "Practice.is_rebate_qualified = false"

      - from: QUALIFIED
        to: PAID
        trigger: "POST /networks/rebate-qualifications/{qualificationId}/pay"
        actor: NetworkAdmin
        preconditions:
          - "status == QUALIFIED (ERR_QUALIFICATION_NOT_QUALIFIED)"
          - "compliance_report_verified == true (ERR_COMPLIANCE_REPORT_NOT_VERIFIED)"
          - "holdback_cents == 0 (ERR_REBATE_ON_HOLDBACK)"
        side_effects:
          - "status = PAID"

      - from: QUALIFIED
        to: RECLAIMED
        trigger: "POST /networks/rebate-qualifications/{qualificationId}/reclaim"
        actor: NetworkAdmin
        preconditions:
          - "status == QUALIFIED (ERR_QUALIFICATION_NOT_QUALIFIED)"
        side_effects:
          - "status = RECLAIMED; holdback_cents = rebate_amount_cents and rebate_amount_cents = 0"
          - "The practice's unsettled_balance_cents += the reclaimed amount"
          - "Practice.is_rebate_qualified = false"

      - from: PENDING
        to: RECLAIMED
        trigger: "system (fires inside the Practice departure-notice cascade for unverified qualifications)"
        actor: system
        preconditions:
          - "compliance_report_verified == false and the practice has issued a departure notice"
        side_effects:
          - "status = RECLAIMED; holdback_cents = rebate_amount_cents and rebate_amount_cents = 0"

  # ---------------------------------------------------------------------------
  - entity: DrugShortage
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: ALLOCATING
        to: ALLOCATING
        trigger: "POST /networks/drug-shortages/{shortageId}/allocate"
        actor: NetworkAdmin
        preconditions:
          - "status == ALLOCATING (this is the documented re-run path: a shortage may be re-allocated before activation, and each re-run must remain consistent with the conservation invariant)"
        side_effects:
          - "Every ShortageAllocation of this shortage whose status is GRANTED or PARTIALLY_COMMITTED → REVOKED, releasing its allocated_units back into unallocated_units"
          - "Fresh ShortageAllocation rows are created for the currently eligible practices per the method, with allocation_rank recomputed and expires_epoch_index = allocation_epoch_index + 1"
          - "allocated_units set to the sum of the fresh grants; unallocated_units = supply_available_units - allocated_units"
          - "invariant A of shortage_allocation_conservation re-verified after the re-run"

      - from: REPORTED
        to: ALLOCATING
        trigger: "POST /networks/drug-shortages/{shortageId}/allocate"
        actor: NetworkAdmin
        preconditions:
          - "status == REPORTED (ERR_SHORTAGE_NOT_REPORTED)"
          - "supply_available_units > 0 (ERR_THRESHOLD_NOT_MET — a zero-supply shortage cannot be allocated)"
          - "At least one Practice in the network with affiliation_status == AFFILIATED (ERR_NO_ELIGIBLE_PRACTICES)"
        side_effects:
          - "status = ALLOCATING"
          - "ShortageAllocation rows are created for the eligible practices, one per practice, with allocation_rank per the method's ordering and expires_epoch_index = allocation_epoch_index + 1"
          - "The sum of the created allocated_units is exactly supply_available_units (remainder assigned by the method's documented tie-break)"
          - "DrugShortage.allocated_units is set to that sum and unallocated_units to supply_available_units - allocated_units == 0"

      - from: ALLOCATING
        to: ACTIVE
        trigger: "POST /networks/drug-shortages/{shortageId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "status == ALLOCATING (ERR_SHORTAGE_NOT_ALLOCATING)"
          - "The sum of allocated_units across this shortage's ShortageAllocation rows equals supply_available_units (ERR_ALLOCATION_INCOMPLETE)"
        side_effects:
          - "status = ACTIVE"
          - "DrugProduct.status → SHORTAGE_RESTRICTED"

      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /networks/drug-shortages/{shortageId}/resolve"
        actor: NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_SHORTAGE_NOT_ACTIVE)"
        side_effects:
          - "status = RESOLVED"
          - "DrugProduct.status → ACTIVE when no other DrugShortage for the same product remains in status in {REPORTED, ALLOCATING, ACTIVE}"
          - "Each ShortageAllocation of this shortage with status in {GRANTED, PARTIALLY_COMMITTED} → EXPIRED, releasing its uncommitted units"

  # ---------------------------------------------------------------------------
  - entity: ShortageAllocation
    initial_state: GRANTED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: GRANTED
        to: PARTIALLY_COMMITTED
        trigger: "system (fires when a shortage purchase order is confirmed against this allocation)"
        actor: system
        preconditions:
          - "0 < committed_units < allocated_units"
        side_effects:
          - "status = PARTIALLY_COMMITTED"

      - from: GRANTED
        to: FULLY_COMMITTED
        trigger: "system (fires when a shortage purchase order is confirmed against this allocation)"
        actor: system
        preconditions:
          - "committed_units == allocated_units"
        side_effects:
          - "status = FULLY_COMMITTED"

      - from: PARTIALLY_COMMITTED
        to: FULLY_COMMITTED
        trigger: "system (fires when a further shortage purchase order is confirmed)"
        actor: system
        preconditions:
          - "committed_units == allocated_units"
        side_effects:
          - "status = FULLY_COMMITTED"

      - from: PARTIALLY_COMMITTED
        to: GRANTED
        trigger: "system (fires when a shortage purchase order is cancelled)"
        actor: system
        preconditions:
          - "committed_units == 0"
        side_effects:
          - "status = GRANTED"

      - from: GRANTED
        to: EXPIRED
        trigger: "system (fires when the network advances to an epoch at or beyond expires_epoch_index)"
        actor: system
        preconditions:
          - "allocation_epoch_index >= expires_epoch_index and committed_units < allocated_units"
        side_effects:
          - "status = EXPIRED"
          - "The uncommitted units (allocated_units - committed_units) are released: DrugShortage.unallocated_units += that difference"

      - from: PARTIALLY_COMMITTED
        to: EXPIRED
        trigger: "system (fires when the network advances to an epoch at or beyond expires_epoch_index)"
        actor: system
        preconditions:
          - "allocation_epoch_index >= expires_epoch_index"
        side_effects:
          - "status = EXPIRED"
          - "The uncommitted units are released: DrugShortage.unallocated_units += (allocated_units - committed_units)"

      - from: GRANTED
        to: REVOKED
        trigger: "system (fires inside the Practice departure cascade when the practice reaches DEPARTED)"
        actor: system
        preconditions:
          - "the grant's practice has reached DEPARTED"
        side_effects:
          - "status = REVOKED"
          - "DrugShortage.unallocated_units += allocated_units (the full grant, committed or not)"

  # ---------------------------------------------------------------------------
  - entity: PracticeManagementAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /networks/practice-management-agreements/{agreementId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "status == DRAFT (ERR_MANAGEMENT_AGREEMENT_NOT_DRAFT)"
          - "Practice.affiliation_status ∈ {AFFILIATED, SUSPENDED} (ERR_PRACTICE_NOT_AFFILIATED)"
          - "No other PracticeManagementAgreement for the same practice and same service_line whose closed term [term_start, term_end] leaves less than 30 days of blackout before this agreement's term_start (ERR_MANAGEMENT_TERM_OVERLAP)"
          - "term_end >= term_start (ERR_INVALID_MANAGEMENT_TERM)"
          - "service_line == REVENUE_CYCLE requires fee_basis == PERCENT_OF_NET_COLLECTIONS (ERR_INVALID_FEE_BASIS)"
        side_effects:
          - "status = ACTIVE; active_month_count pinned as the whole months between term_start and the earlier of term_end and the logical clock"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /networks/practice-management-agreements/{agreementId}/suspend"
        actor: NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_MANAGEMENT_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status = SUSPENDED; accrued_fee_cents is frozen and stops accruing"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /networks/practice-management-agreements/{agreementId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "status == SUSPENDED (ERR_MANAGEMENT_AGREEMENT_NOT_DRAFT)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /networks/practice-management-agreements/{agreementId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "status ∈ {ACTIVE, SUSPENDED} (ERR_MANAGEMENT_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status = TERMINATED"
          - "The practice's unsettled_balance_cents += the agreement's accrued_fee_cents (the fee liability survives termination)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /networks/practice-management-agreements/{agreementId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "status ∈ {ACTIVE, SUSPENDED} (ERR_MANAGEMENT_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "status = TERMINATED"
          - "The practice's unsettled_balance_cents += the agreement's accrued_fee_cents"

  # ---------------------------------------------------------------------------
  - entity: ResearchParticipation
    initial_state: APPLIED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: APPLIED
        to: FEASIBILITY_REVIEW
        trigger: "POST /networks/research-participations/{participationId}/begin-feasibility"
        actor: NetworkAdmin
        preconditions:
          - "site_status == APPLIED (ERR_SITE_NOT_APPLIED)"
          - "Practice.affiliation_status == AFFILIATED and the practice's pathway_steering_status == ACTIVE (ERR_PRACTICE_NOT_AFFILIATED)"
        side_effects:
          - "site_status = FEASIBILITY_REVIEW"

      - from: FEASIBILITY_REVIEW
        to: ACTIVATED
        trigger: "POST /networks/research-participations/{participationId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "site_status == FEASIBILITY_REVIEW (ERR_SITE_NOT_IN_FEASIBILITY)"
          - "The practice's count of ResearchParticipation rows in status ACTIVATED is 0 (ERR_SITE_ALREADY_ACTIVE_TRIAL — one active trial per community site)"
        side_effects:
          - "site_status = ACTIVATED; enrolled_participant_count = 0"

      - from: ACTIVATED
        to: FEASIBILITY_REVIEW
        trigger: "POST /networks/research-participations/{participationId}/suspend"
        actor: NetworkAdmin
        preconditions:
          - "site_status == ACTIVATED (ERR_SITE_NOT_ACTIVATED)"
        side_effects:
          - "site_status = SUSPENDED"
          - "A research hold is placed: the practice's AffiliationContract gains a research flag so its rebate compliance contribution stays at its value on the day of suspension"

      - from: SUSPENDED
        to: ACTIVATED
        trigger: "POST /networks/research-participations/{participationId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "site_status == SUSPENDED (ERR_SITE_NOT_IN_FEASIBILITY)"
        side_effects:
          - "site_status = ACTIVATED"

      - from: ACTIVATED
        to: DEACTIVATED
        trigger: "POST /networks/research-participations/{participationId}/deactivate"
        actor: NetworkAdmin
        preconditions:
          - "site_status ∈ {ACTIVATED, SUSPENDED} (ERR_SITE_NOT_ACTIVATED)"
        side_effects:
          - "site_status = DEACTIVATED; enrolled_participant_count is frozen"

      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /networks/research-participations/{participationId}/deactivate"
        actor: NetworkAdmin
        preconditions:
          - "site_status ∈ {ACTIVATED, SUSPENDED} (ERR_SITE_NOT_ACTIVATED)"
        side_effects:
          - "site_status = DEACTIVATED"

  # ---------------------------------------------------------------------------
  - entity: PathwayProtocol
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "PUT /networks/pathway-protocols/{protocolId}"
        actor: NetworkAdmin
        preconditions:
          - "status == DRAFT (ERR_PROTOCOL_NOT_DRAFT)"
          - "on_pathway_regimen_codes is a non-empty array (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = PUBLISHED"
          - "Every Practice in the network with pathway_steering_status == ACTIVE has pathway_adherence_pct recomputed against this protocol's regimen set"

      - from: PUBLISHED
        to: RETIRED
        trigger: "PUT /networks/pathway-protocols/{protocolId}"
        actor: NetworkAdmin
        preconditions:
          - "status == PUBLISHED (ERR_PROTOCOL_NOT_PUBLISHED)"
        side_effects:
          - "status = RETIRED; the protocol no longer steers new administrations, and historical concordance flags are left intact"

  # ---------------------------------------------------------------------------
  - entity: AffiliationContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /networks/affiliation-contracts/{contractId}/activate"
        actor: NetworkAdmin
        preconditions:
          - "status == DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "Practice.affiliation_status ∈ {PROSPECTIVE, AFFILIATED} (ERR_PRACTICE_NOT_AFFILIATABLE)"
          - "term_end >= term_start (ERR_INVALID_CONTRACT_TERM)"
          - "notice_period_days >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "status = ACTIVE"
          - "Practice.affiliation_status → AFFILIATED when it was PROSPECTIVE"

      - from: ACTIVE
        to: DEPARTURE_NOTICE
        trigger: "system (fires when the practice issues a departure notice)"
        actor: system
        preconditions:
          - "the practice's affiliation_status became DEPARTING"
        side_effects:
          - "status = DEPARTURE_NOTICE"
          - "rebate_holdback_cents recomputed as declared in the Practice cascade"

      - from: DEPARTURE_NOTICE
        to: ACTIVE
        trigger: "system (fires when the practice withdraws its departure notice)"
        actor: system
        preconditions:
          - "the practice's affiliation_status returned to AFFILIATED"
        side_effects:
          - "status = ACTIVE; rebate_holdback_cents = 0"

      - from: DEPARTURE_NOTICE
        to: UNWIND_IN_PROGRESS
        trigger: "system (fires when the practice reaches DEPARTED)"
        actor: system
        preconditions:
          - "the practice's affiliation_status reached DEPARTED"
        side_effects:
          - "status = UNWIND_IN_PROGRESS"
          - "pricing_agreements_unwound = true once every PracticePricingAgreement of the practice is SUPERSEDED"

      - from: UNWIND_IN_PROGRESS
        to: TERMINATED
        trigger: "POST /networks/affiliation-contracts/{contractId}/complete-unwind"
        actor: NetworkAdmin
        preconditions:
          - "status == UNWIND_IN_PROGRESS (ERR_CONTRACT_NOT_UNWINDING)"
          - "No DrugPurchaseOrder for the practice is in status in {SUBMITTED, CONFIRMED, BACKORDERED, SHIPPED} (ERR_OPEN_ORDERS_EXIST)"
          - "No PracticeManagementAgreement for the practice is in status in {DRAFT, ACTIVE, SUSPENDED} (ERR_OPEN_MANAGEMENT_AGREEMENT)"
          - "No ResearchParticipation for the practice is in status in {APPLIED, FEASIBILITY_REVIEW, ACTIVATED, SUSPENDED} (ERR_OPEN_RESEARCH_SITE)"
        side_effects:
          - "status = TERMINATED"
          - "RebateQualification rows of the practice with status RECLAIMED are swept: holdback_cents stays as recorded, and any QUALIFIED row with a zero holdback is left intact"
          - "The affiliation contract's rebate_holdback_cents is reported as the net withheld amount and the practice's affiliation is unbound from the network"
          - "Every ShortageAllocation of the practice still in status in {GRANTED, PARTIALLY_COMMITTED} → REVOKED, releasing its allocated_units back into DrugShortage.unallocated_units"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /networks/affiliation-contracts/{contractId}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Practice.affiliation_status == PROSPECTIVE (ERR_CONTRACT_NOT_TERMINABLE_WHILE_AFFILIATED)"
        side_effects:
          - "status = TERMINATED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: pricing-agreement-submit-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /networks/pricing-agreements/{agreementId}/submit"
    occ_field: "expected_practice_version"
    description: |
      Submitting a PracticePricingAgreement against a Practice whose version has
      advanced since the client last read it is rejected. This captures the real
      case where the practice's tier_level was just recomputed by a receipt
      (which legitimately re-prices the next agreement) and the submitting
      client's view of the practice is therefore stale.
    error_id: ERR_VERSION_MISMATCH
    http_status: 412

  - rule_id: claim-submit-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /networks/payer-claims/{claimId}/submit"
    occ_field: "expected_practice_version"
    description: |
      Submitting a PayerClaim while carrying a Practice version older than the
      current one is rejected. A concurrent receipt or denial settlement
      legitimately advances the practice's version — and with it the
      unsettled_balance_cents basis the claim's write-off tiers are read
      from — so the stale view must not be billed.
    error_id: ERR_VERSION_MISMATCH
    http_status: 412

  - rule_id: treatment-administer-stale-practice
    parent_entity: Practice
    write_endpoint: "POST /networks/patient-treatments/{treatmentId}/administer"
    occ_field: "expected_practice_version"
    description: |
      Administering a PatientTreatment while carrying a Practice version older
      than the current one is rejected. A concurrent receipt or claim
      settlement legitimately advances the practice's version — and with it the
      adherence and stock-basis fields the administration reads — so the stale
      view must not be drawn against.
    error_id: ERR_VERSION_MISMATCH
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: practice_observed_unit_price_cents
    trigger: "POST /networks/drug-purchase-orders (at submission), and whenever a pricing agreement becomes ACTIVE"
    algorithm: tiered_pricing
    formula: |
      Resolve the single PracticePricingAgreement row for this practice that is
      in status ACTIVE and whose half-open window covers the order's effective
      instant: effective_from <= submitted_at < effective_to, where effective_to
      == null means open-ended. When several ACTIVE agreements cover the
      instant, the one with the LATEST effective_from wins; if effective_from
      also ties, the LATEST created_at wins; if created_at also ties, the
      GREATER id lexicographically wins. `id` is used here only as a final
      determinism tie-break over an exact-duplicate set, never as a primary key.

      practice_observed_unit_price_cents =
          round_half_up(network_base_price_cents * (1 - discount_pct))

      pricing_tier_applied = the resolved agreement's tier_level (which is the
      practice's CURRENT tier, i.e. Practice.tier_level, made concrete in the
      agreement row).

      Variant `agreement_discount` applies when an active agreement resolves.
      The FROZEN variant applies when Network.is_commercial_terms_frozen == true:
      the agreement row keeps its ACTIVE status but the price is the list price
      and the INTENDED discount is deliberately not credited — a frozen window
      does not rewrite the agreement's status, it changes the price.

    input_set: "DrugPurchaseOrder rows in status in {SUBMITTED, CONFIRMED, BACKORDERED, SHIPPED, RECEIVED}; CANCELLED rows are excluded from every pricing report"
    constants:
      MAX_DISCOUNT_PCT: 0.35
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: agreement_discount
        when: "an ACTIVE pricing agreement window covers the order's effective instant"
        difference: "unit price is the discounted price; pricing_tier_applied records the agreement tier"
      - name: list_price_fallback
        when: "no ACTIVE pricing agreement covers the order's effective instant"
        difference: "unit price equals network_base_price_cents with no discount; this variant is what makes provisional and final network spend diverge"
      - name: frozen_terms_list_price
        when: "the order instants sit inside a frozen commercial-terms window"
        difference: "the same list price as the fallback path but reached through the active, frozen agreement — the agreement stays ACTIVE while the discount is not credited"

  - name: network_spend_provisional_and_final
    trigger: "POST /networks/{networkId}/reporting/rebate-share (computed on every read)"
    algorithm: dual_variant_aggregation
    formula: |
      The measured window is a half-open interval on received_at:
      [window_start_at, window_end_at), evaluated against the logical clock.

      PROVISIONAL variant (what the network credits while the period is open):
      provisional_network_spend_cents =
          sum over DrugPurchaseOrder rows with
              drug_product_id == the program's product scope
              (or ALL rows when rebate_program.drug_ndc_scope == "ALL")
              AND received_at in the window AND status in {SHIPPED, RECEIVED}
          of extended_cost_cents.

      FINAL variant (what survives reconciliation once the period closes):
      final_network_spend_cents =
          the same sum over the same rows, but with EVERY order whose
          pricing_tier_applied came from the list_price_fallback variant
          EXCLUDED from the credited spend — dollars that were not routed at
          agreed contract pricing earn no rebate once the period is closed.

      Both variants are computed from the SAME order rows over the SAME
      window; they diverge exactly for orders priced by the fallback variant.
      The final variant is the one that feeds RebateQualification.rebate_amount_cents
      once the epoch has closed; the provisional variant feeds it while open.

    input_set: "DrugPurchaseOrder rows for the practice and the program's product scope whose received_at falls in the measured window; SUBMITTED/CONFIRMED/BACKORDERED orders are excluded because they have not posted to the trailing-window basis"
    constants:
      WINDOW_SEMANTICS: "half-open [window_start_at, window_end_at)"
    precision: "integer cents, round_half_up"

  - name: practice_compliance_score
    trigger: "POST /networks/rebate-qualifications — creation; and every administrative change to the practice's rebate data (weight set change, price-disclosure revocation), all resolved together at evaluation time"
    algorithm: weighted_scoring
    formula: |
      COMPLIANCE_SCORE = weighted_mean(score_key_i -> score_i, weight_key_i -> weight_i)

      The score_key -> score registry is ENUMERATED (three keys):
          reporting_timeliness ->
              1.0 if the epoch's compliance report was submitted on or before
                  the epoch closed
              0.5 if it was submitted after the close but within
                  compliance_report_grace_days
              0.0 if it was never submitted
          pathway_adherence    -> Practice.pathway_adherence_pct
          price_transparency   -> 1.0 when every PracticePricingAgreement of
                                  the practice is ACTIVE, 0.0 when at least one
                                  is SUSPENDED

      The weight_key -> weight registry is ENUMERATED (three keys):
          weight_reporting_compliance -> network-supplied, default 1
          weight_adherence_steering   -> network-supplied, default 1
          weight_transparency         -> network-supplied, default 1

      WEIGHTED MEAN = ( reporting_timeliness * weight_reporting_compliance
                      + pathway_adherence  * weight_adherence_steering
                      + price_transparency * weight_transparency )
                    / ( weight_reporting_compliance
                      + weight_adherence_steering
                      + weight_transparency )
      A zero weight for a score_key EXCLUDES that score from both the numerator
      and the denominator.

      compact_discount_credit = round_half_up(compliance_score
                              * COMPACT_DISCOUNT_RATE * 10000)

      is_qualified compares compliance_score >= compliance_min_score with an
      INCLUSIVE bound, so a practice scoring exactly the minimum still qualifies
      and its compact_discount_credit is a whole number.

    input_set: "One score per registered score_key; unregistered keys never contribute"
    constants:
      DEFAULT_WEIGHT: 1
      COMPACT_DISCOUNT_RATE: 0.0
      BOUNDARY: "compliance_score >= compliance_min_score is inclusive"
    precision: "ratio to 4 decimal places, round_half_up; compact_discount_credit is integer cents"
    variants:
      - name: default_weighting
        when: "the network supplies no weight overrides"
        difference: "all three score_keys carry weight 1, so the weighted mean is the plain mean"
      - name: adherence_heavy_weighting
        when: "weight_adherence_steering is raised and weight_transparency is set to 0"
        difference: "price_transparency leaves both numerator and denominator, so a practice with a SUSPENDED agreement can still reach a higher score than under default weighting"

  - name: practice_denial_ratio
    trigger: "POST /networks/payer-claims/{claimId}/deny (numbered in the header and again per claim)"
    algorithm: threshold
    formula: |
      denominator = the practice's count of PayerClaim rows with
          status in {DENIED, ADJUDICATED_PAID}          (SETTLED = 2)
      numerator   = the practice's count of PayerClaim rows with
          status == DENIED                              (DENIED  = 1)

      denial_ratio = numerator / denominator, evaluated as exact rational
      arithmetic (no intermediate rounding).

      The convener suspends pricing only when denial_ratio STRICTLY EXCEEDS
      0.20. The boundary is a strict >, not >=:
          ratio == 0.20  → no suspension
          ratio == 0.25  → suspension
      With a lifetime numerator of 1, the suspension first fires at
      denominator 4 (1/4 = 0.25), and NOT at denominator 5 (1/5 = 0.20).

    input_set: "PayerClaim rows of the practice; VOIDED, DRAFT, SUBMITTED and APPEALED rows are excluded from both numerator and denominator"
    constants:
      DENIAL_RATIO_THRESHOLD: 0.20
      BOUNDARY: "strict > ; equality does not trigger"
    precision: "evaluated as exact rational; reported to 4 decimal places, round_half_up"
    variants:
      - name: lifetime_ratio
        when: "the default reading — every settled claim the practice has ever had"
        difference: "numerator and denominator are lifetime totals, unaffected by epoch advances"

  - name: rebate_qualification_amount
    trigger: "POST /networks/rebate-qualifications (creation), POST /networks/rebate-qualifications/{qualificationId}/evaluate, and every epoch advance"
    algorithm: dual_variant_threshold
    formula: |
      Step 1 — qualify:
        is_qualified = (market_share_pct >= market_share_threshold_pct)
                       AND (compliance_score >= compliance_min_score)
        Both comparisons are >= (inclusive).

      Step 2 — pick the variant by period position:
        provisional variant when period_epoch_index >= allocation_epoch_index
        final variant       when period_epoch_index <  allocation_epoch_index

      Step 3a — provisional variant:
        rebate_amount_cents =
            min(provisional_network_spend_cents * rebate_pct,
                REBATE_CAP_PER_PRACTICE_CENTS)
        evaluated line-by-line and then summed (see the two rounding orders
        below), floored to whole cents.

      Step 3b — final variant:
        rebate_amount_cents = the provisional figure MINUS every
        list_price_fallback dollar that was credited provisionally and later
        disallowed, MINUS the practice's compact_discount_credit_cents:
            final = provisional_amount
                    - fallback_spend_cents * rebate_pct
                    - compact_discount_credit_cents
        (DUAL_VARIANT_RECONCILIATION_FEE_CENTS is 0 in this agreement, so it
        contributes nothing today; it remains a declared term of the formula.)
        If that subtraction would drive the amount below 0, the amount is 0
        and status becomes DISQUALIFIED.

      Two valid rounding orders explicitly exist for Step 3a, and the scaffold
      pins ORDER B:
        ORDER A (round-per-order-then-sum, and what a naive implementation does):
            provisional = sum over orders of round(extended_cost_cents * rebate_pct)
        ORDER B (sum-then-round, and the pinned reading):
            provisional = round( sum over orders of extended_cost_cents * rebate_pct )
        With three orders of 12345, 10000 and 5000 cents at rebate_pct 0.0177:
            ORDER A = 219 + 177 + 89 = 485
            ORDER B = round(27345 * 0.0177) = round(484.0065) = 484
        The two orders differ on identical inputs; ORDER B is authoritative.

    input_set: "RebateQualification rows for the practice and program; only orders in the measured window contribute to the spend base"
    constants:
      REBATE_CAP_PER_PRACTICE_CENTS: 2500000
      DUAL_VARIANT_RECONCILIATION_FEE_CENTS: 0
      MARKET_SHARE_BOUNDARY: "inclusive >=; equality qualifies"
      COMPLIANCE_BOUNDARY: "inclusive >=; equality qualifies"
      ROUNDING_ORDER: "B — sum then round"
    precision: "integer cents, round_half_up, cap applied after rounding"
    variants:
      - name: provisional_variant
        when: "period_epoch_index >= the network's current allocation_epoch_index"
        difference: "credits the full provisional network spend including list-price-fallback dollars"
      - name: final_variant
        when: "period_epoch_index < the network's current allocation_epoch_index"
        difference: "strips fallback-variant dollars back out and applies the reconciliation fee, so it is <= the provisional figure for identical inputs"

  - name: rebate_routing_market_share
    trigger: "POST /networks/pricing-agreements/{agreementId}/approve (the rebate routing term is read from the agreement)"
    algorithm: dual_variant_aggregation
    formula: |
      market_share_pct = routing_denominator == 0 ? 0
                         : total_network_spend_cents / routing_denominator

      routing_denominator BASE = the practice's total drug spend, defined as
          sum of extended_cost_cents over every DrugPurchaseOrder of the
          practice in status in {SHIPPED, RECEIVED} in the measured window,
          INCLUDING orders whose drug_product_id falls outside the rebate
          program's NDC scope.

      Variant `scope_excluded` applies when the practice's ACTIVE pricing
      agreement carries the rebate routing term (routing_includes_out_of_scope
      == true): the denominator ADDITIONALLY includes the practice's
      ADJUDICATED_PAID PayerClaim billed amounts in the window — dollar volume
      the practice bought and billed but did not route through the network
      contract. This makes the denominator larger and the resulting share smaller.

      Variant `scope_included_only` applies otherwise: the denominator is drug
      purchases alone.

      Both variants are legitimate measurements of "share of drug spend routed
      through the network"; a practice can be above the threshold under one and
      below it under the other on identical data.

    input_set: "DrugPurchaseOrder rows in status {SHIPPED, RECEIVED} in the window, plus ADJUDICATED_PAID PayerClaim rows in the window for the scope_excluded variant"
    constants:
      ZERO_DENOMINATOR_RESULT: 0
    precision: "ratio to 4 decimal places, round_half_up"

  - name: on_hand_units_dual_variant
    trigger: "POST /networks/patient-treatments/{treatmentId}/administer (stock sufficiency check), GET /networks/practices/{practiceId}/stock-report"
    algorithm: dual_variant_aggregation
    formula: |
      Both variants filter InventoryLot rows to
          practice_id == the practice, drug_product_id == the product,
          status == AVAILABLE.
      They differ on the expiry filter and therefore disagree at the boundary.

      EXPIRING variant (what is physically on the shelf):
          sum(quantity_remaining) over lots (no expiry filter at all)
          — a lot whose expires_at has already passed still counts.

      USABLE variant (what may be drawn for a treatment administered at instant t):
          sum(quantity_remaining) over lots with expires_at > t
          — strict >, because a lot expiring at exactly t is NOT usable.

      With 40 units on a lot expiring at 2026-09-10T00:00:00Z and the logical
      clock at that same instant:
          expiring_on_hand_units  = 40
          usable_on_hand_units    = 0
      The dual variant is observable at the endpoint: the stock report returns
      both figures for the same practice at the same instant.

    input_set: "InventoryLot rows with status == AVAILABLE (QUARANTINED, EXPIRED and DEPLETED lots are excluded from both variants)"
    constants:
      EXPIRY_BOUNDARY: "usable requires expires_at > administered_at (strict); a lot expiring exactly at the instant is unusable"
    precision: "integer units"

  - name: lot_fifo_consumption_plan
    trigger: "POST /networks/patient-treatments/{treatmentId}/administer"
    algorithm: chronological
    formula: |
      Step 1 — candidate set: InventoryLot rows for
          practice_id, drug_product_id, status == AVAILABLE, expires_at > administered_at.

      Step 2 — FIFO order (pinned; two keys, never `id`):
          sort candidates by expires_at ASC, then by created_at ASC.

      Step 3 — vial count and the dose-plan variant. Only VIAL unit_type products
      carry a remainder. The vial count is identical under both plans, because a
      vial cannot be half-opened:
          vial_count        = ceil(administered_units / vial_yield_units)
          dose_units_per_dose = vial_count * vial_yield_units
          remainder_units   = dose_count * (dose_units_per_dose - administered_units)
          total_draw_units  = dose_count * dose_units_per_dose

      The remainder is PART of total_draw_units, never additional to it, so both
      plans draw exactly the same units from the same lots in the same FIFO
      order and leave identical lot balances and an identical
      acquisition_cost_basis_cents. What the plans disagree about is WHO ends up
      paying for remainder_units:
          P1 WASTE_BILLED (the default dose plan):
              the remainder is emitted as a wastage LotConsumption row with
              is_wastage = true; the treatment carries it in wastage_units and
              wastage_cost_basis_cents, and the claim bills it as line 2.
          P2 WASTE_ABSORBED:
              the remainder is drawn from the same vials but is neither billed
              nor carried as treatment wastage: wastage_units = 0 and
              wastage_cost_basis_cents = 0. The dollars land on the lot as
              InventoryLot.absorbed_cost_cents and never appear on a claim, so
              the practice's recovery is lower by exactly the remainder cost.
      The two plans are both valid readings of the same administration, and the
      divergence is observable on the treatment, the lot and the claim alike.

      Step 4 — draw: walk the FIFO order and take min(remaining_need,
      lot.quantity_remaining) from each lot, emitting one LotConsumption row
      per lot with consumption_sequence = 1..N and
      cost_basis_cents = quantity_consumed * lot.acquisition_cost_cents_per_unit.
      The wastage draw is emitted as the LAST row from the terminal lot with
      is_wastage = true and the same per-unit cost basis.

    input_set: "InventoryLot rows in status AVAILABLE with expires_at strictly after the administration instant"
    constants:
      FIFO_KEYS: "expires_at ASC, then created_at ASC"
      TIE_BREAK: "created_at ASC — `id` is never used as a FIFO tie-break"
    precision: "integer units; costs in integer cents, round_half_up"

  - name: claim_billed_amount
    trigger: "POST /networks/payer-claims/{claimId}/submit"
    algorithm: assembly
    formula: |
      billed_amount_cents is built from the completed administration's three
      cost lines and the PINNED rounding order is round-once-at-the-end over
      the exact component sum, not round-per-component-then-sum:
          line_1_patient_units = round_half_up(lot.draw_unit_cost
                                 * dose_count * administered_units)
          line_2_wastage       = round_half_up(lot.draw_unit_cost
                                 * treatment.wastage_units)
          line_3_admin_fee     = policy_admin_fee_cents   (a whole number)
          billed_amount_cents  = round_half_up(line_1 + line_2 + line_3)

      Under P1 WASTE_BILLED the claim recovers line_1 + line_2 + line_3, which
      equals treatment.acquisition_cost_basis_cents + line_3. Under P2
      WASTE_ABSORBED line_2 is 0, wastage_units is 0, and the claim recovers
      line_1 + line_3 — exactly treatment.wastage_cost_basis_cents less than the
      P1 claim on the same administration, with the shortfall visible as
      InventoryLot.absorbed_cost_cents. The rate (`lot.draw_unit_cost`) is the
      quantity-weighted average acquisition cost per unit across every
      InventoryLot of the practice for the drug, so it coarsens as more lots
      accumulate in the trailing window and is NOT a lookup of the single lot
      that supplied the dose.

      The dual variant is the admin-fee line, whose selection is pinned by a
      three-key sort over the practice's treatments:
          policy_admin_fee_cents = admin_fee_cents of the ADMINISTERED
              treatment for this drug product ranked by
                  administered_at ASC, then admin_fee_cents ASC, then created_at ASC
              at the ordinal index round_half_up(0.41 * count)  (0-based < 0.5*n)
      For a uniform fee schedule (every treatment at 4800) policy_admin_fee_cents
      is 4800. When the practice's fee schedule is revised mid-batch — five
      treatments at 4800 followed by five at 6000 — the pinned stratified pick
      lands on rank 5 in a ten-row batch, so policy_admin_fee_cents is 4800:
      the pre-revision fee schedule survives the change for this claim. The
      competing reading — price the claim at the MOST RECENT fee schedule in
      the batch — prices the same claim at 6000, so professional fees land
      differently by accident of timing.

      The dual variant is the write-off headroom menu pinned on the claim:
          write_off_tier = W1: 10% of billed_amount_cents
                         | W2: 25% of billed_amount_cents
      allowed_amount_cents = min(billed_amount_cents, payer_remit + write_off).
      Only W2 may be used while the practice's unsettled_balance_cents exceeds
      the practice's own cap, so the two tiers are reachable on the same claim
      shape and the rounding order matters at the boundary: a 10% write-off on
      1000001 rounds to 100000, not 100000.1.

    input_set: "PatientTreatment rows in status ADMINISTERED whose PayerClaim is in status DRAFT"
    constants:
      WRITE_OFF_W1_PCT: 0.10
      WRITE_OFF_W2_PCT: 0.25
      ROUNDING_ORDER: "round once at the end over the exact component sum"
    precision: "integer cents, round_half_up"
    variants:
      - name: tier_w1
        when: "the practice's unsettled_balance_cents is at or below the practice's write-off cap"
        difference: "10% write-off headroom; allowed_amount_cents is correspondingly higher"
      - name: tier_w2
        when: "the practice's unsettled_balance_cents exceeds the practice's write-off cap"
        difference: "25% write-off headroom; the same billed amount yields a lower allowed_amount_cents"
      - name: full_claim_remittance
        when: "the practice's pricing agreement does not carry the post-settlement disclosure term"
        difference: "billed_admin_fee_cents == policy_admin_fee_cents and paid_amount_cents covers all three lines"
      - name: post_settlement_disclosure
        when: "the practice's pricing agreement carries the post-settlement disclosure term (routing_includes_out_of_scope == false with a disclosure rider)"
        difference: "the fee line is reconstructed after settlement: billed_admin_fee_cents == 0, paid_amount_cents must equal treatment.acquisition_cost_basis_cents exactly, and written_off_admin_fee_cents == policy_admin_fee_cents — the same administration therefore settles at a different figure"

  - name: management_fee_accrual
    trigger: "POST /networks/practice-management-agreements/{agreementId}/activate and GET /networks/practice-management-agreements/{agreementId}/statement"
    algorithm: tiered_pricing
    formula: |
      Months: count whole calendar months from term_start to min(term_end, the
      logical clock), inclusive of the month containing term_start. A term
      spanning 2026-01-01 to 2026-06-30 is 6 months.

      Monthly fee by fee_basis:
        FIXED_MONTHLY           -> fixed_fee_cents
        PER_FTE                 -> fte_count * per_fte_fee_cents
        PER_CLAIM               -> the practice's count of PatientTreatment rows
                                 in status in {ADMINISTERED, BILLED} whose
                                 administered_at falls inside the term
                                 * per_claim_fee_cents
        PERCENT_OF_NET_COLLECTIONS ->
            net_collections_cents = sum of allowed_amount_cents over the
                practice's PayerClaim rows in status ADJUDICATED_PAID whose
                adjudicated month falls inside the term, INCLUDING appealed
                claims whose first denial is inside the term (the appeal
                resolves the SAME claim, so it is counted once)
            monthly = round_half_up(net_collections_cents * fee_rate)

      accrued_fee_cents = monthly * months.
      The fairness carve-out is pinned: a PERCENT_OF_NET_COLLECTIONS month
      whose computed fee is below the fairness floor uses the floor when the
      practice is NOT revenue-cycle-opaque, and uses the literal computed fee
      when the practice is revenue-cycle-opaque (access_scope EXCLUDED).

      Rates are read from the agreement tier: TIER_3 agreements get the
      full rate, TIER_1 agreements get rate_adj = rate * 0.75 (a lower rate),
      and TIER_2 agreements take the rate as written. Fee rates are never
      negative; a negative fee_rate is rejected.

    input_set: "PayerClaim rows in status ADJUDICATED_PAID; DENIED, VOIDED and DRAFT rows contribute nothing"
    constants:
      FAIRNESS_FLOOR_CENTS: 50000
      TIER_RATE_ADJ_ADJUSTMENT: 0.75
      MONTH_SEMANTICS: "whole calendar months, inclusive of the term_start month"
    precision: "integer cents, round_half_up, applied per month before summing"
    variants:
      - name: tier_3_rate
        when: "the agreement's tier_level is TIER_3"
        difference: "full rate"
      - name: tier_1_rate
        when: "the agreement's tier_level is TIER_1"
        difference: "rate * 0.75; on net collections of 1000000 this is 7500 rather than 10000"

  - name: shortage_allocation_units
    trigger: "POST /networks/drug-shortages/{shortageId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Method menu (the network's shortage_allocation_method picks one; the
      same product may be allocated under either method on different shortages):

      M1 PRO_RATA_BASELINE: weight_i = practice.drug_shortage_baseline_units
                             (AFFILIATED practices only).
          Quota_i = round_half_up(supply_available_units * weight_i / sum(weights))
          remainder = supply_available_units - sum(Quota_i)
          if remainder > 0: distribute one unit at a time to practices in order
              of decreasing fractional part of the raw weight, ties broken by
              Practice.created_at ASC
          if remainder < 0: claw one unit at a time from practices in order of
              INCREASING integral part of the raw weight, ties broken by
              Practice.created_at DESC
          allocated_i = Quota_i adjusted by the remainder pass.

      M2 PRIORITY_PATHWAY: sort order is pinned and two-keyed —
          (1) pathway_adherence_pct DESC
          (2) Practice.created_at ASC
          Fill each practice up to its own baseline demand
          (drug_shortage_baseline_units), bounded by the remaining supply; when
          the remaining supply cannot cover a practice's baseline demand it is
          exhausted by that practice and every later practice in the order
          takes the floors that remain, which may be zero units. Practices are
          only re-ordered, never re-weighted: a practice with adherence exactly
          equal to the network target still ranks strictly above a practice
          whose adherence is below the target.

      M3 EQUAL_SPLIT: even division; the remainder is distributed one unit per
          practice in Practice.created_at ASC order.

      In all three methods the created ShortageAllocation rows must sum to
      exactly supply_available_units (see the allocation conservation
      invariant, which is asserted separately).

    input_set: "Practice rows with affiliation_status == AFFILIATED; PROSPECTIVE, DEPARTING, DEPARTED and SUSPENDED practices receive no grant"
    constants:
      ALLOCATION_REMAINDER_ORDER: "fractional part DESC, then Practice.created_at ASC"
      EQUAL_SPLIT_REMAINDER_ORDER: "Practice.created_at ASC"
    precision: "integer units"
    variants:
      - name: pro_rata_baseline
        when: "shortage_allocation_method == PRO_RATA_BASELINE"
        difference: "weights by baseline units; a practice with 0 baseline receives 0 units"
      - name: priority_pathway
        when: "shortage_allocation_method == PRIORITY_PATHWAY"
        difference: "orders by adherence rather than weighting; a high-adherence small practice can out-rank a large low-adherence one"

  - name: shortage_allocation_conservation
    trigger: "system invariant asserted at every allocation run and at every grant revocation"
    algorithm: waterfall_allocation
    formula: |
      Named global quantity: NETWORK_SHORTAGE_SUPPLY_UNITS.

      Invariant A (grant/revoke):
          sum over ShortageAllocation rows of a shortage of
              (status == REVOKED ? 0 : allocated_units)
          + DrugShortage.unallocated_units
          == DrugShortage.supply_available_units

      Invariant B (commit/release), the second conserved quantity —
      COMMITTED_SUPPLY_UNITS:
          sum over ShortageAllocation rows of committed_units
          + sum over DrugPurchaseOrder rows of this product in status in
            {SUBMITTED, CONFIRMED, BACKORDERED} of quantity_units
          == DrugShortage.allocated_units

      Invariant C (allocation run):
          after allocate, the sum of created ShortageAllocation.allocated_units
          == supply_available_units and unallocated_units == 0.

      The forward action and its compensating action are pairs here:
      REVOKE(allocated_units += to unallocated) / RESTORE(allocated_units -=
      from unallocated) both leave Invariant A holding, and
      CONFIRM(committed += q) / CANCEL(committed -= q) leave Invariant B holding.
      A departure cascade that runs end-to-end but leaves either sum drifting
      fails this rule.

    input_set: "All ShortageAllocation rows of the shortage, plus the shortage's own counters"
    constants: {}
    precision: "integer units"

  - name: wastage_units_per_administration
    trigger: "POST /networks/patient-treatments/{treatmentId}/administer"
    algorithm: threshold
    formula: |
      For unit_type == VIAL products, with remainder_units as defined above:
          under P1 WASTE_BILLED (the default):  wastage_units = remainder_units
          under P2 WASTE_ABSORBED:             wastage_units = 0

      Boundaries, stated as literals (vial_yield_units == 100 in each):
          administered_units == 0                → ERR_INVALID_REQUEST; no draw, no wastage
          administered_units == 100              → remainder 0, so wastage 0 under BOTH plans
          administered_units == 250              → P1 wastage 50 per dose; P2 wastage 0
          administered_units == 99               → P1 wastage 1 per dose; P2 wastage 0
          dose_count == 3 with administered_units == 250
                                                 → P1 wastage 150, not 50
          a non-VIAL unit_type                   → wastage 0 under both plans

    input_set: "PatientTreatment rows in status SCHEDULED being administered"
    constants:
      WASTE_BOUNDARY: "waste_per_dose_units = ceil(administered_units / vial_yield_units) * vial_yield_units - administered_units under P2"
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and both map to a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role must be permitted for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right along the path"
    error_id: "ERR_NETWORK_NOT_FOUND | ERR_PRACTICE_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_TREATMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_PROTOCOL_NOT_FOUND | ERR_MANAGEMENT_AGREEMENT_NOT_FOUND | ERR_PARTICIPATION_NOT_FOUND | ERR_SHORTAGE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: concurrency
    check: "When the request body carries expected_<parent>_version, it must equal the parent's current version; the check runs BEFORE any business logic"
    error_id: ERR_VERSION_MISMATCH
    http_status: 412
    applies_to: "POST /networks/pricing-agreements/{id}/submit, POST /networks/patient-treatments/{id}/administer, POST /networks/payer-claims/{id}/submit"

  - priority: 4
    category: business_temporal
    check: "Pricing window conflict: no other agreement of the same practice and tier may hold an overlapping [effective_from, effective_to) window while in status in {PENDING_APPROVAL, ACTIVE}"
    error_id: ERR_PRICING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /practice-pricing-agreements/{id}/submit"
    note: "Checked at priority 4, BEFORE the state and affiliation checks below — each practice+tier window must be occupied by at most one pending or active agreement."

  - priority: 5
    category: business_temporal
    check: "Management term conflict: a new agreement for the same practice and service_line must start at least 30 days after the previous agreement's term_end (closed-inclusive terms, so adjacency is a conflict)"
    error_id: ERR_MANAGEMENT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /practice-management-agreements/{id}/activate"

  - priority: 5.5
    category: business_temporal
    check: "A pricing agreement's effective_from may not precede the practice's earliest AffiliationContract.term_start, and a DrugPurchaseOrder may only be confirmed while the practice's ACTIVE contract covers the confirmation instant"
    error_id: "ERR_PRICING_WINDOW_BEFORE_CONTRACT | ERR_CONTRACT_LAPSED"
    http_status: 409
    applies_to: "POST /practice-pricing-agreements/{id}/submit, POST /drug-purchase-orders/{id}/confirm"

  - priority: 6
    category: state
    check: "The target resource must be in the state the transition requires"
    error_id: "ERR_PRACTICE_NOT_PROSPECTIVE | ERR_PRACTICE_NOT_AFFILIATED | ERR_PRACTICE_NOT_SUSPENDED | ERR_PRACTICE_NOT_DEPARTING | ERR_PRACTICE_DEPARTURE_NOT_ALLOWED | ERR_AGREEMENT_NOT_DRAFT | ERR_AGREEMENT_NOT_PENDING | ERR_AGREEMENT_NOT_ACTIVE | ERR_AGREEMENT_NOT_SUSPENDED | ERR_ORDER_NOT_SUBMITTED | ERR_ORDER_NOT_CONFIRMED | ERR_ORDER_NOT_SHIPPED | ERR_ORDER_NOT_CANCELLABLE | ERR_LOT_NOT_AVAILABLE | ERR_LOT_NOT_QUARANTINED | ERR_TREATMENT_NOT_SCHEDULED | ERR_TREATMENT_NOT_ADMINISTERED | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_DENIED | ERR_CLAIM_NOT_VOIDABLE | ERR_QUALIFICATION_NOT_PENDING | ERR_QUALIFICATION_NOT_QUALIFIED | ERR_SHORTAGE_NOT_REPORTED | ERR_SHORTAGE_NOT_ALLOCATING | ERR_SHORTAGE_NOT_ACTIVE | ERR_MANAGEMENT_AGREEMENT_NOT_DRAFT | ERR_MANAGEMENT_AGREEMENT_NOT_ACTIVE | ERR_SITE_NOT_APPLIED | ERR_SITE_NOT_IN_FEASIBILITY | ERR_SITE_NOT_ACTIVATED | ERR_PROTOCOL_NOT_DRAFT | ERR_PROTOCOL_NOT_PUBLISHED | ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_CONTRACT_NOT_UNWINDING | ERR_PATHWAY_NOT_ACTIVE | ERR_PATHWAY_ALREADY_ADOPTED | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Non-oncology regimen guard: the selected regimen_code must belong to the pathway protocol's indication set for the product being administered; a regimen outside the protocol's declared regimen codes is rejected outright rather than flagged non-concordant"
    error_id: ERR_OFF_PATHWAY_REGIMEN_REJECTED
    http_status: 422
    applies_to: "POST /patient-treatments/{id}/administer"
    note: "Distinct from concordance: a regimen in the protocol's code set but not in on_pathway_regimen_codes is accepted and flagged non-concordant. Only a regimen outside the protocol entirely is rejected here."

  - priority: 8
    category: business_safety
    check: "Stock sufficiency: usable on-hand units for the product must cover the vial-rounded demand at the administration instant"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /patient-treatments/{id}/administer"

  - priority: 9
    category: business_constraint
    check: "Collection-shortage consumption cap: a purchase order may not be placed or confirmed when its dollar value would drive a shortage allocation's uncommitted consumption authorization below zero"
    error_id: ERR_ALLOCATION_OVERCOMMIT
    http_status: 409
    applies_to: "POST /networks/drug-purchase-orders, POST /networks/drug-purchase-orders/{id}/confirm"

  - priority: 9.5
    category: business_constraint
    check: "Shortage-restricted ordering: a purchase order naming a product that is currently shortage-restricted must name a ShortageAllocation grant for the practice that covers the quantity and the dollar value"
    error_id: ERR_NO_SHORTAGE_ALLOCATION
    http_status: 409
    applies_to: "POST /networks/drug-purchase-orders"

  - priority: 9.75
    category: business_constraint
    check: "Denial-ratio breach: a settlement that pushes the practice's denial ratio strictly above its threshold suspends the practice's ACTIVE pricing agreements, and a reinstate is refused while the ratio is still breached"
    error_id: ERR_DENIAL_RATIO_STILL_BREACHED
    http_status: 409
    applies_to: "POST /networks/payer-claims/{claimId}/deny (suspension), POST /networks/pricing-agreements/{agreementId}/reinstate (refusal)"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the network user who submits a pricing agreement may not be the user who approves it, and a practice's own PracticeAdmin identity may not approve its own agreement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /practice-pricing-agreements/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Rebate holdback: a rebate may only be paid when its compliance report is verified and its holdback is zero"
    error_id: "ERR_COMPLIANCE_REPORT_NOT_VERIFIED | ERR_REBATE_ON_HOLDBACK"
    http_status: 409
    applies_to: "POST /rebate-qualifications/{id}/pay"

  - priority: 12
    category: business_fiscal
    check: "Payer overpayment: a remittance may not exceed the billed amount"
    error_id: ERR_PAYER_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payer-claims/{id}/adjudicate"

  - priority: 13
    category: business_constraint
    check: "Commercial-terms freeze: no new pricing agreement may be created or submitted while the network is frozen"
    error_id: ERR_TERMS_FROZEN
    http_status: 403
    applies_to: "POST /practice-pricing-agreements, POST /practice-pricing-agreements/{id}/submit"

  - priority: 14
    category: business_constraint
    check: "A shortage event cannot be allocated when the network holds zero eligible affiliated practices, or when the report carries no supply"
    error_id: "ERR_NO_ELIGIBLE_PRACTICES | ERR_THRESHOLD_NOT_MET"
    http_status: 409
    applies_to: "POST /drug-shortages/{id}/allocate"

  - priority: 15
    category: business_referential
    check: "Cross-entity referential integrity: a body-supplied foreign key must resolve inside the same network, and where a body key names a practice it must match the path practice"
    error_id: "ERR_INVALID_REQUEST | ERR_CROSS_NETWORK_REFERENCE | ERR_PRACTICE_MISMATCH"
    http_status: 400
    applies_to: "POST endpoints with body foreign keys"

  - priority: 16
    category: existence
    check: "Required input fields present, well-typed, and enum members closed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"# =============================================================================
# §1.5 API Endpoint Table  (api_prefix: /networks)
# =============================================================================
endpoints:

  # --- Clock (test-driving) --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and before any call to this endpoint the clock reads that instant and MUST NOT fall back to real wall-clock time; every default fixture date sits at or after it."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock moves to current_utc"]

  # --- Networks -------------------------------------------------------------
  - method: POST
    path: "/networks"
    description: "Create a network agreement holder"
    roles: [NetworkAdmin]
    code: 201
    input: [name, network_agreement_code, shortage_allocation_method, tier_market_share_boundaries]
    output: OncologyNetwork
    side_effects:
      - "allocation_epoch_index initialized to 0"
      - "is_commercial_terms_frozen = false"
      - "tier_market_share_boundaries stored as the ordered descending tier ladder"

  - method: GET
    path: "/networks"
    description: "List networks"
    roles: [NetworkAdmin, PracticeAdmin, RevenueCycleManager, PayerAdjudicator, NetworkAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: "OncologyNetwork[]"
    side_effects: []

  - method: GET
    path: "/networks/{networkId}"
    description: "Get one network"
    roles: [NetworkAdmin, PracticeAdmin, RevenueCycleManager, PayerAdjudicator, NetworkAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: OncologyNetwork
    side_effects: []

  - method: POST
    path: "/networks/{networkId}/advance-epoch"
    description: "Ops-run checkpoint: advance the allocation epoch"
    roles: [NetworkAdmin]
    code: 200
    input: [by_epochs]
    output: OncologyNetwork
    side_effects:
      - "allocation_epoch_index += by_epochs"
      - "Practices whose departure_effective_epoch_index has arrived transition to DEPARTED and run their departure cascade"
      - "RebateQualification rows with status PENDING, a period at or before the new epoch and compliance_report_verified == false → DISQUALIFIED"
      - "ShortageAllocation rows whose expires_epoch_index has arrived → EXPIRED, releasing uncommitted units"
      - "is_commercial_terms_frozen recomputed"
      - "increments OncologyNetwork.version by 1"

  - method: POST
    path: "/networks/{networkId}/freeze-commercial-terms"
    description: "Freeze commercial terms for the network"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: OncologyNetwork
    side_effects: ["is_commercial_terms_frozen = true", "increments OncologyNetwork.version by 1"]

  - method: POST
    path: "/networks/{networkId}/unfreeze-commercial-terms"
    description: "Lift the commercial-terms freeze"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: OncologyNetwork
    side_effects: ["is_commercial_terms_frozen = false", "increments OncologyNetwork.version by 1"]

  - method: GET
    path: "/networks/{networkId}/reporting/rebate-share"
    description: "Provisional-vs-final network spend report for one practice and rebate program over a window"
    roles: [NetworkAdmin, NetworkAnalyst, PlatformAdmin]
    code: 200
    input: ["practice_id?", "rebate_program_id?", "window_start_at?", "window_end_at?"]
    output: { practice_id: string, provisional_network_spend_cents: integer, final_network_spend_cents: integer, routing_denominator_cents: integer, market_share_pct: number, denial_ratio: number }
    side_effects: []

  # --- Practices ------------------------------------------------------------
  - method: POST
    path: "/networks/{networkId}/practices"
    description: "Create a prospective practice"
    roles: [NetworkAdmin]
    code: 201
    input: [practice_name, practice_npi, state_code, drug_shortage_baseline_units, pathway_steering_target_pct, denial_ratio_threshold_pct]
    output: Practice
    side_effects:
      - "affiliation_status = PROSPECTIVE"
      - "pathway_steering_status = NOT_ADOPTED"
      - "tier_level = TIER_1; trailing_12m_network_purchases_cents = 0"
      - "unsettled_balance_cents = 0; is_rebate_qualified = false"

  - method: GET
    path: "/networks/practices"
    description: "List practices, filtered"
    roles: [NetworkAdmin, PracticeAdmin, RevenueCycleManager, PayerAdjudicator, NetworkAnalyst, PlatformAdmin]
    code: 200
    input: ["network_id?", "practice_npi?", "affiliation_status?", "state_code?", "tier_level?"]
    output: "Practice[]"
    side_effects: []

  - method: GET
    path: "/networks/practices/{practiceId}"
    description: "Get one practice"
    roles: [NetworkAdmin, PracticeAdmin, RevenueCycleManager, PayerAdjudicator, NetworkAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: []

  - method: POST
    path: "/networks/practices/{practiceId}/affiliate"
    description: "Move a prospective practice to AFFILIATED"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "affiliation_status = AFFILIATED"
      - "tier_level recomputed from trailing_12m_network_purchases_cents against the network ladder"
      - "Network.is_commercial_terms_frozen recomputed"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/suspend"
    description: "Suspend an affiliated practice"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "affiliation_status = SUSPENDED"
      - "pathway_steering_status → SUSPENDED when it was ACTIVE"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/reinstate"
    description: "Return a suspended practice to AFFILIATED"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: ["affiliation_status = AFFILIATED", "increments Practice.version by 1"]

  - method: POST
    path: "/networks/practices/{practiceId}/departure-notice"
    description: "Issue a departure notice"
    roles: [NetworkAdmin, PracticeAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "affiliation_status = DEPARTING; departure_effective_epoch_index = allocation_epoch_index + ceil(notice_period_days / 30)"
      - "AffiliationContract → DEPARTURE_NOTICE and its rebate holdback recomputed"
      - "Unverified or provisional RebateQualification rows → RECLAIMED with a matching unsettled_balance_cents increase"
      - "Practice.is_rebate_qualified = false"
      - "Network.is_commercial_terms_frozen recomputed"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/withdraw-departure"
    description: "Withdraw a departure notice before it takes effect"
    roles: [NetworkAdmin, PracticeAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "affiliation_status = AFFILIATED; departure_effective_epoch_index = null"
      - "AffiliationContract → ACTIVE with holdback zeroed"
      - "RECLAIMED RebateQualification rows restored to QUALIFIED with holdback zeroed, and the practice's unsettled_balance_cents reduced by the restored amount"
      - "Revoked ShortageAllocation rows restored to GRANTED and their units re-deducted from unallocated_units"
      - "SUPERSEDED pricing agreements tagged DEPARTURE_UNWIND restored to ACTIVE"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/withdraw-affiliation"
    description: "Withdraw a prospective practice's affiliation"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "affiliation_status = DEPARTED"
      - "AffiliationContract → TERMINATED"
      - "Non-terminal DrugPurchaseOrder rows → CANCELLED"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/pathways/adopt"
    description: "Adopt (or resume) the pathways program"
    roles: [PracticeAdmin, NetworkAdmin]
    code: 200
    input: []
    output: Practice
    side_effects:
      - "pathway_steering_status = ACTIVE"
      - "SCHEDULED PatientTreatment rows re-evaluated for concordance"
      - "pathway_adherence_pct recomputed"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/practices/{practiceId}/pathways/suspend"
    description: "Suspend the pathways program"
    roles: [NetworkAdmin]
    code: 200
    input: []
