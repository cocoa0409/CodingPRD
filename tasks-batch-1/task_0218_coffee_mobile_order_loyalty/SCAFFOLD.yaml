# =============================================================================
# Coffee Shop Mobile Order & Loyalty (Starbucks style) — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: "Coffee Shop Mobile Order & Loyalty (Starbucks style): menu/modifier customization, store/pickup-time selection, order-ahead queue, stored-value reload & auto-reload, stars/rewards earn-redeem, free-item/birthday reward, mobile pay, refund"

domain_name: coffee-mobile-order-loyalty
api_prefix: ""

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Member, Store, MenuItem, Order, StoredValueCard...) linked by
  # FK references; ledgers (StarLedgerEntry, WalletTransaction) are append-only
  # event logs whose replay derives balances.

  state_machine_shape: parallel
  # Order carries two independent state axes: fulfillment_status (the pickup
  # queue lifecycle) AND payment_status (the money lifecycle). RewardGrant runs
  # a cyclic ISSUED -> RESERVED -> ISSUED loop (reserve on order, release on
  # cancel). StoredValueCard auto-reload is a threshold-driven cascade.

  relationship_patterns:
    - one_to_many        # Member 1:N Order, Order 1:N OrderLine, Store 1:N PickupSlot
    - cross_aggregate    # Order references Store + Member + PickupSlot + StoredValueCard

  role_model: peer_roles
  # Member owns own resources (orders, card, rewards); StoreOperator manages a
  # store's queue and issues refunds; PlatformAdmin manages catalog and clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across members" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: birth_month_day, type: string, source: input, description: "Birthday as MM-DD (year-agnostic), e.g. '03-14'" }
      - { name: star_balance, type: integer, source: computed, description: "Derived from StarLedgerEntry replay: sum of delta_stars for this member; never negative" }
      - { name: lifetime_stars, type: integer, source: computed, description: "Sum of positive delta_stars (EARN entries only) over member lifetime; drives tier" }
      - { name: tier, type: enum, source: computed, description: "GREEN | GOLD — GOLD when lifetime_stars >= GOLD_THRESHOLD, constraints: GREEN|GOLD" }
      - { name: last_birthday_reward_year, type: integer, source: system, default: null, description: "Calendar year the most recent birthday reward was granted, or null" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED, constraints: ACTIVE|CLOSED" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: timezone, type: string, source: input, description: "IANA tz id used to resolve pickup windows, e.g. 'America/Los_Angeles'" }
      - { name: slot_capacity, type: integer, source: input, description: "Max orders accepted per pickup slot window; constraints: >= 1" }
      - { name: prep_minutes, type: integer, source: input, description: "Minimum lead time in minutes between now and earliest selectable pickup slot; constraints: >= 0" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PAUSED — PAUSED blocks new order placement; constraints: OPEN|PAUSED" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; menu items are scoped to one store" }
      - { name: name, type: string, source: input, description: "Beverage/food name" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in cents before modifiers; constraints: >= 0" }
      - { name: category, type: enum, source: input, description: "BEVERAGE | FOOD; constraints: BEVERAGE|FOOD" }
      - { name: reward_eligible, type: boolean, source: input, default: true, description: "Whether a FREE_ITEM/BIRTHDAY reward may be applied to lines of this item" }
      - { name: available, type: boolean, source: system, default: true, description: "False when withdrawn from sale; unavailable items reject new order lines" }

  - name: ModifierOption
    parent: null
    common_fields: true
    fields:
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; modifier belongs to one menu item" }
      - { name: group_code, type: enum, source: input, description: "SIZE | MILK | SHOT | SYRUP; constraints: SIZE|MILK|SHOT|SYRUP" }
      - { name: name, type: string, source: input, description: "Modifier option label, e.g. 'Grande', 'Oat Milk', 'Extra Shot'" }
      - { name: price_delta_cents, type: integer, source: input, description: "Per-unit price change in cents added to the line; may be 0 or positive" }
      - { name: max_quantity, type: integer, source: input, default: 1, description: "Max times this option may be chosen on one line; constraints: >= 1" }

  - name: StoredValueCard
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; one card per member" }
      - { name: balance_cents, type: integer, source: computed, description: "Derived from WalletTransaction replay: sum of amount_cents for this card; never negative" }
      - { name: auto_reload_enabled, type: boolean, source: input, default: false, description: "When true, a low balance at order pay time triggers an auto-reload" }
      - { name: auto_reload_threshold_cents, type: integer, source: input, default: 1000, description: "Balance at or below which auto-reload fires; constraints: >= 0" }
      - { name: auto_reload_amount_cents, type: integer, source: input, default: 2500, description: "Amount added per auto-reload event; constraints: >= 500" }

  - name: WalletTransaction
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> StoredValueCard.id; card this ledger entry belongs to" }
      - { name: kind, type: enum, source: system, description: "RELOAD | AUTO_RELOAD | ORDER_SPEND | REFUND; constraints: RELOAD|AUTO_RELOAD|ORDER_SPEND|REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed delta to card balance: RELOAD/AUTO_RELOAD/REFUND positive, ORDER_SPEND negative" }
      - { name: order_id, type: string, source: system, default: null, description: "FK -> Order.id; set for ORDER_SPEND/REFUND entries, null for reloads" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the order" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: pickup_slot_id, type: string, source: input, description: "FK -> PickupSlot.id; reserved pickup window" }
      - { name: applied_reward_id, type: string, source: input, default: null, description: "FK -> RewardGrant.id; optional reward redeemed on this order" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents across non-discounted lines plus discounted lines at full price" }
      - { name: reward_discount_cents, type: integer, source: computed, description: "Cents removed by applied_reward (the cheapest eligible line's price, capped), 0 when no reward" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on (subtotal - reward_discount) at TAX_RATE_BPS, see calc order_total" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - reward_discount_cents + tax_cents; amount charged at pay" }
      - { name: stars_earned, type: integer, source: computed, description: "Stars granted when payment captured; depends on tier and pay method, see calc stars_earned" }
      - { name: fulfillment_status, type: enum, source: system, default: CART, description: "CART | PLACED | IN_PREP | READY | PICKED_UP | CANCELLED; constraints: CART|PLACED|IN_PREP|READY|PICKED_UP|CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | PAID | REFUNDED; constraints: UNPAID|PAID|REFUNDED" }
      - { name: pay_method, type: enum, source: system, default: null, description: "STORED_VALUE | EXTERNAL_CARD; set at pay time; constraints: STORED_VALUE|EXTERNAL_CARD" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; parent order (must be in CART)" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id; the chosen beverage/food" }
      - { name: quantity, type: integer, source: input, description: "Count of this configured drink; constraints: >= 1" }
      - { name: modifiers, type: array, source: input, description: "List of { modifier_option_id, count } selections applied per unit" }
      - { name: unit_price_cents, type: integer, source: computed, description: "base_price_cents + sum(option.price_delta_cents * count) over modifiers" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: is_reward_redeemed, type: boolean, source: computed, default: false, description: "True when the applied reward discounted this line; only one line per order can be true" }

  - name: PickupSlot
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store offering the window" }
      - { name: window_start, type: datetime, source: input, description: "ISO 8601 UTC start of the pickup window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO 8601 UTC end of the pickup window (exclusive)" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of Orders in {PLACED, IN_PREP, READY} holding this slot; must not exceed Store.slot_capacity" }

  - name: RewardGrant
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the reward" }
      - { name: kind, type: enum, source: system, description: "FREE_ITEM | BIRTHDAY; constraints: FREE_ITEM|BIRTHDAY" }
      - { name: star_cost, type: integer, source: system, description: "Stars consumed to mint this reward; FREE_ITEM = REDEEM_STAR_COST, BIRTHDAY = 0" }
      - { name: max_discount_cents, type: integer, source: system, description: "Upper bound on the discount this reward may apply to a line" }
      - { name: expires_at, type: datetime, source: system, description: "ISO 8601 UTC expiry; reward not applicable at/after this instant" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | RESERVED | REDEEMED | EXPIRED; constraints: ISSUED|RESERVED|REDEEMED|EXPIRED" }
      - { name: reserved_by_order_id, type: string, source: system, default: null, description: "FK -> Order.id; order currently holding this reward, null when ISSUED/EXPIRED" }

  - name: StarLedgerEntry
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member whose star balance this entry adjusts" }
      - { name: kind, type: enum, source: system, description: "EARN | REDEEM | REVERSAL; constraints: EARN|REDEEM|REVERSAL" }
      - { name: delta_stars, type: integer, source: system, description: "Signed star change: EARN positive, REDEEM negative, REVERSAL undoes a prior EARN (negative)" }
      - { name: order_id, type: string, source: system, default: null, description: "FK -> Order.id; the order that earned/reversed stars, null for REDEEM-on-reward-mint" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the PAID order being refunded" }
      - { name: amount_cents, type: integer, source: computed, description: "Refund amount; equals Order.total_cents (full refund only)" }
      - { name: destination, type: enum, source: input, description: "STORED_VALUE | ORIGINAL_METHOD; where money returns; constraints: STORED_VALUE|ORIGINAL_METHOD" }
      - { name: stars_reversed, type: integer, source: computed, description: "Stars clawed back; equals the order's stars_earned" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: fulfillment axis (the pickup queue) ----
  - entity: Order
    field: fulfillment_status
    initial_state: CART
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: CART
        to: PLACED
        trigger: "POST /members/{member_id}/orders/{order_id}/place"
        actor: Member
        preconditions:
          - "Order.fulfillment_status == CART"
          - "Order.payment_status == PAID (payment must be captured before the order enters the queue)"
          - "Store.status == OPEN"
          - "PickupSlot.reserved_count < Store.slot_capacity (capacity check evaluated at place time)"
          - "Order has >= 1 OrderLine"
        side_effects:
          - "PickupSlot.reserved_count recomputed (this order now counts toward the slot)"
          - "If applied_reward_id set: RewardGrant.status RESERVED -> REDEEMED (consumed)"
        note: "Payment is captured first (see payment axis); placing only enters the prep queue."

      - from: PLACED
        to: IN_PREP
        trigger: "POST /stores/{store_id}/orders/{order_id}/start-prep"
        actor: StoreOperator
        preconditions:
          - "Order.fulfillment_status == PLACED"
          - "Store.status == OPEN"
        side_effects: []

      - from: IN_PREP
        to: READY
        trigger: "POST /stores/{store_id}/orders/{order_id}/ready"
        actor: StoreOperator
        preconditions:
          - "Order.fulfillment_status == IN_PREP"
        side_effects: []

      - from: READY
        to: PICKED_UP
        trigger: "POST /stores/{store_id}/orders/{order_id}/complete"
        actor: StoreOperator
        preconditions:
          - "Order.fulfillment_status == READY"
        side_effects:
          - "PickupSlot.reserved_count recomputed (order leaves the {PLACED,IN_PREP,READY} set)"

      - from: PLACED
        to: CANCELLED
        trigger: "POST /members/{member_id}/orders/{order_id}/cancel"
        actor: "Member or StoreOperator"
        preconditions:
          - "Order.fulfillment_status == PLACED (cancel only before prep starts)"
        side_effects:
          - "Order.payment_status PAID -> REFUNDED via cascade (a Refund to STORED_VALUE is auto-created; see Refund creation transition)"
          - "RewardGrant if applied: REDEEMED -> ISSUED restored (reserved_by_order_id cleared, see RewardGrant axis)"
          - "PickupSlot.reserved_count recomputed (order leaves the reserved set)"
          - "StarLedgerEntry REVERSAL appended for the order's stars_earned (member.star_balance decreases)"
        note: "Depth-3 cancel cascade: cancel(Order) -> Refund auto-create -> WalletTransaction(REFUND) appended -> StoredValueCard.balance_cents recomputed."

  # ---- Order: payment axis (the money) — parallel dimension ----
  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /members/{member_id}/orders/{order_id}/pay"
        actor: Member
        preconditions:
          - "Order.payment_status == UNPAID"
          - "Order.fulfillment_status == CART"
          - "Order has >= 1 OrderLine"
          - "If applied_reward_id set: RewardGrant.status == ISSUED, RewardGrant.expires_at > now, reward owned by Order.member_id"
          - "pay_method in {STORED_VALUE, EXTERNAL_CARD} supplied in request"
          - "If pay_method == STORED_VALUE: after any auto-reload, StoredValueCard.balance_cents >= Order.total_cents"
        side_effects:
          - "subtotal_cents, reward_discount_cents, tax_cents, total_cents finalized (calc order_total)"
          - "If pay_method == STORED_VALUE and auto_reload_enabled and balance_cents <= auto_reload_threshold_cents and balance_cents < total_cents: auto-reload fires -> WalletTransaction(AUTO_RELOAD) appended -> balance recomputed"
          - "If pay_method == STORED_VALUE: WalletTransaction(ORDER_SPEND, -total_cents) appended -> StoredValueCard.balance_cents recomputed"
          - "If applied_reward_id set: RewardGrant.status ISSUED -> RESERVED, reserved_by_order_id = order.id"
          - "stars_earned computed and StarLedgerEntry(EARN, +stars_earned) appended -> Member.star_balance and lifetime_stars recomputed -> Member.tier re-derived"
          - "Order.pay_method set"
        note: "Depth-3 pay cascade: pay(Order) -> StarLedgerEntry(EARN) appended -> Member.lifetime_stars recomputed -> Member.tier re-derived (GREEN->GOLD when crossing GOLD_THRESHOLD)."

      - from: PAID
        to: REFUNDED
        trigger: "POST /members/{member_id}/orders/{order_id}/cancel  OR  POST /stores/{store_id}/orders/{order_id}/refund"
        actor: "Member, StoreOperator, or system"
        preconditions:
          - "Order.payment_status == PAID"
        side_effects:
          - "A Refund is created (full amount = total_cents); see Refund state machine for the money/stars cascade"
        note: "Reached either by member cancel of a PLACED order or by an operator refund of an in-flight order."

  # ---- RewardGrant: cyclic reserve/release loop ----
  - entity: RewardGrant
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: ISSUED
        to: RESERVED
        trigger: "POST /members/{member_id}/orders/{order_id}/pay (order carries applied_reward_id)"
        actor: Member
        preconditions:
          - "RewardGrant.status == ISSUED"
          - "RewardGrant.expires_at > now"
          - "RewardGrant.member_id == Order.member_id"
          - "Order has >= 1 OrderLine whose MenuItem.reward_eligible == true"
        side_effects:
          - "reserved_by_order_id = order.id"
        note: "Reserved at pay time; consumed at place time."

      - from: RESERVED
        to: REDEEMED
        trigger: "POST /members/{member_id}/orders/{order_id}/place"
        actor: Member
        preconditions:
          - "RewardGrant.status == RESERVED"
          - "RewardGrant.reserved_by_order_id == Order.id"
        side_effects: []
        note: "Terminal consumption — reward cannot be reused."

      - from: RESERVED
        to: ISSUED
        trigger: "POST /members/{member_id}/orders/{order_id}/cancel (order was PLACED) OR system on refund of an order that reserved-then-redeemed"
        actor: "Member, StoreOperator, or system"
        preconditions:
          - "RewardGrant.reserved_by_order_id == Order.id"
          - "RewardGrant.expires_at > now (still within validity; otherwise -> EXPIRED)"
        side_effects:
          - "reserved_by_order_id cleared to null"
        note: "Cyclic edge: a reserved/redeemed reward returns to ISSUED so the member can reuse it (revision loop)."

      - from: RESERVED
        to: EXPIRED
        trigger: "POST /members/{member_id}/orders/{order_id}/cancel when RewardGrant.expires_at <= now"
        actor: system
        preconditions:
          - "RewardGrant.reserved_by_order_id == Order.id"
          - "RewardGrant.expires_at <= now"
        side_effects:
          - "reserved_by_order_id cleared to null"

      - from: ISSUED
        to: EXPIRED
        trigger: "system at pay/place time when expires_at <= now (lazy expiry)"
        actor: system
        preconditions:
          - "RewardGrant.status == ISSUED"
          - "RewardGrant.expires_at <= now"
        side_effects: []

  # ---- Refund: the compensating money/stars action ----
  - entity: Refund
    initial_state: SETTLED
    terminal_states: [SETTLED]
    transitions:
      - from: "(none)"
        to: SETTLED
        trigger: "POST /stores/{store_id}/orders/{order_id}/refund OR cascade from order cancel"
        actor: "StoreOperator or system"
        preconditions:
          - "Order.payment_status == PAID"
          - "Order.fulfillment_status != PICKED_UP (a completed pickup cannot be refunded)"
        side_effects:
          - "amount_cents = Order.total_cents (full refund)"
          - "Order.payment_status PAID -> REFUNDED"
          - "If destination == STORED_VALUE OR original pay was STORED_VALUE: WalletTransaction(REFUND, +total_cents) appended -> StoredValueCard.balance_cents recomputed"
          - "stars_reversed = Order.stars_earned; StarLedgerEntry(REVERSAL, -stars_earned) appended -> Member.star_balance and lifetime_stars recomputed -> Member.tier re-derived"
          - "If Order had a redeemed RewardGrant: RewardGrant.status -> ISSUED if expires_at > now else EXPIRED (reward restored, reserved_by_order_id cleared)"
          - "Order.fulfillment_status -> CANCELLED if not already terminal"
        note: "Compensating action. Conserved-quantity invariant: card balance after pay-then-refund equals pre-pay balance; member star_balance after earn-then-reversal equals pre-pay star_balance."

  # ---- Member: account lifecycle ----
  - entity: Member
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /members/{member_id}/close"
        actor: "Member or PlatformAdmin"
        preconditions:
          - "Member.status == ACTIVE"
          - "No Order owned by member is in {PLACED, IN_PREP, READY} (no in-flight orders)"
        side_effects:
          - "All ISSUED RewardGrants for the member -> EXPIRED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pay-stale-card-version
    parent_entity: StoredValueCard
    write_endpoint: "POST /members/{member_id}/orders/{order_id}/pay"
    occ_field: "expected_card_version"
    description: |
      Paying an order with pay_method STORED_VALUE against a card whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has already drawn the card down (an
      ORDER_SPEND or a manual RELOAD changed the balance and bumped the card's
      version), so the paying client's view of available balance is stale and a
      fresh balance check is required before committing the spend.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reserve-slot-stale-version
    parent_entity: PickupSlot
    write_endpoint: "POST /members/{member_id}/orders/{order_id}/place"
    occ_field: "expected_slot_version"
    description: |
      Placing an order into a pickup slot whose version has advanced since the
      client last observed it is rejected. Another writer has already placed (or
      cancelled) an order against the same slot, changing reserved_count and
      bumping the slot's version, so the placing client's view of remaining
      capacity is stale and must be re-read before committing the reservation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_pricing
    trigger: "OrderLine create/update under POST/PUT /orders/{order_id}/lines"
    algorithm: aggregation
    formula: |
      unit_price_cents = MenuItem.base_price_cents
                       + sum over each modifier selection of
                           (ModifierOption.price_delta_cents * selection.count)
      line_total_cents = unit_price_cents * quantity
    input_set: "All modifier selections on the line; each option must belong to the line's menu_item."
    constants: {}
    precision: "Integer cents; no rounding (all inputs integer cents)."

  - name: order_total
    trigger: "POST /members/{member_id}/orders/{order_id}/pay (finalized at pay time)"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking: tax depends on reward_discount,
      reward_discount depends on per-line totals):
      1. subtotal_cents = sum of OrderLine.line_total_cents over ALL lines (full price, no discount yet)
      2. reward_discount_cents:
           if applied_reward_id is null: 0
           else: let elig = lines whose MenuItem.reward_eligible == true
                 if elig is empty: reward rejected (ERR_REWARD_NOT_APPLICABLE)
                 cheapest = the eligible line with the smallest unit_price_cents;
                   tie-break: smallest created_at; the discounted UNIT is one unit of that line
                 reward_discount_cents = min(cheapest.unit_price_cents, RewardGrant.max_discount_cents)
      3. taxable_base = subtotal_cents - reward_discount_cents
      4. tax_cents = round_half_up( taxable_base * TAX_RATE_BPS / 10000 )   # rounded ONCE on the post-discount base
      5. total_cents = subtotal_cents - reward_discount_cents + tax_cents
    input_set: "All OrderLines of the order; the applied RewardGrant if any."
    constants:
      TAX_RATE_BPS: 875          # 8.75% expressed in basis points
    precision: "tax_cents rounded once at step 4, round_half_up, to integer cents. Round AFTER applying discount, never per-line."
    variants:
      - name: no_reward
        when: "applied_reward_id is null"
        difference: "reward_discount_cents = 0; tax computed on full subtotal."
      - name: reward_capped
        when: "RewardGrant.max_discount_cents < cheapest eligible unit_price_cents"
        difference: "discount is capped at max_discount_cents (member pays the remainder of that unit), not the full line price."

  - name: stars_earned
    trigger: "POST /members/{member_id}/orders/{order_id}/pay (on PAID transition)"
    algorithm: threshold
    formula: |
      base_rate = (Member.tier == GOLD) ? GOLD_STARS_PER_DOLLAR : GREEN_STARS_PER_DOLLAR
      method_bonus = (pay_method == STORED_VALUE) ? STORED_VALUE_BONUS_PER_DOLLAR : 0
      eligible_dollars = floor( (total_cents - tax_cents) / 100 )   # stars accrue on pre-tax spend only
      stars_earned = eligible_dollars * (base_rate + method_bonus)
    input_set: "The order's finalized total_cents and tax_cents; the member's tier at pay time; the chosen pay_method."
    constants:
      GREEN_STARS_PER_DOLLAR: 1
      GOLD_STARS_PER_DOLLAR: 2
      STORED_VALUE_BONUS_PER_DOLLAR: 1
    precision: "Integer stars; eligible_dollars uses floor (a $4.99 pre-tax spend earns on $4)."
    variants:
      - name: green_external
        when: "tier == GREEN and pay_method == EXTERNAL_CARD"
        difference: "1 star per eligible pre-tax dollar."
      - name: gold_stored_value
        when: "tier == GOLD and pay_method == STORED_VALUE"
        difference: "3 stars per eligible pre-tax dollar (2 base + 1 stored-value bonus)."

  - name: member_star_balance
    trigger: "Any StarLedgerEntry append (EARN/REDEEM/REVERSAL); read on Member GET"
    algorithm: projection
    formula: |
      star_balance   = sum of delta_stars over ALL StarLedgerEntry rows for the member (any kind)
      lifetime_stars = sum of delta_stars over StarLedgerEntry rows with kind == EARN only
                       (REDEEM and REVERSAL do NOT reduce lifetime_stars; lifetime is monotone non-decreasing)
      tier           = (lifetime_stars >= GOLD_THRESHOLD) ? GOLD : GREEN
    input_set: "All StarLedgerEntry rows for the member, replayed in created_at order."
    constants:
      GOLD_THRESHOLD: 200
      REDEEM_STAR_COST: 150       # stars consumed to mint a FREE_ITEM reward
      FREE_ITEM_MAX_DISCOUNT_CENTS: 700   # max_discount on a minted FREE_ITEM reward
      FREE_ITEM_TTL_DAYS: 60      # FREE_ITEM RewardGrant.expires_at = mint_time + 60 days
      BIRTHDAY_MAX_DISCOUNT_CENTS: 700    # max_discount on a BIRTHDAY reward
      BIRTHDAY_TTL_DAYS: 30       # BIRTHDAY RewardGrant.expires_at = grant_time + 30 days
    precision: "Integer stars; star_balance MUST NOT go negative — a REDEEM that would underflow is rejected (ERR_INSUFFICIENT_STARS)."
    variants:
      - name: balance_vs_lifetime
        when: "a REVERSAL or REDEEM is appended"
        difference: "star_balance decreases but lifetime_stars is unaffected, so a refund can drop a member below 0 spendable while keeping GOLD tier."

  - name: card_balance
    trigger: "Any WalletTransaction append (RELOAD/AUTO_RELOAD/ORDER_SPEND/REFUND); read on StoredValueCard GET"
    algorithm: projection
    formula: |
      balance_cents = sum of amount_cents over ALL WalletTransaction rows for the card,
                      replayed in created_at order (ORDER_SPEND negative, others positive)
    input_set: "All WalletTransaction rows for the card."
    constants: {}
    precision: "Integer cents; balance_cents MUST NOT go negative — an ORDER_SPEND that would underflow is rejected (ERR_INSUFFICIENT_BALANCE) unless auto-reload first lifts the balance."

  - name: slot_reserved_count
    trigger: "Order place/cancel/complete; read on PickupSlot GET"
    algorithm: aggregation
    formula: |
      reserved_count = count of Orders where
        order.pickup_slot_id == slot.id AND order.fulfillment_status IN {PLACED, IN_PREP, READY}
      Capacity check at place time: reserved_count (BEFORE this order) < Store.slot_capacity
    input_set: "Orders referencing this slot whose fulfillment_status is in the reserved set."
    constants: {}
    precision: "Integer count. Boundary: an order may be PLACED iff strictly fewer than slot_capacity orders already hold the slot (reserved_count < slot_capacity, i.e. the slot_capacity-th order succeeds, the (slot_capacity+1)-th fails)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7; entity_backed roles must own the targeted resource (X-User-ID matches the resource owner FK)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Every FK referenced in the body (store_id, menu_item_id, pickup_slot_id, applied_reward_id, modifier_option_id) exists"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST/PUT order lines, POST pay"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource in correct state for the transition (fulfillment_status / payment_status / RewardGrant.status / Member.status preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "Store.status == OPEN when placing an order or starting prep"
    error_id: ERR_STORE_PAUSED
    http_status: 409
    applies_to: "POST place, POST start-prep"

  - priority: 8
    category: business_constraint
    check: "Selected pickup slot belongs to the order's store and window_start - now >= Store.prep_minutes (slot not too soon / not in the past)"
    error_id: ERR_SLOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /orders, POST place"

  - priority: 8b
    category: business_temporal
    check: "A new PickupSlot's half-open window [window_start, window_end) must not overlap any existing PickupSlot on the same store; touching at an endpoint (a.end == b.start) is allowed (half-open, no overlap)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /stores/{store_id}/pickup-slots"

  - priority: 9
    category: business_referential
    check: "Applied reward is owned by the member, ISSUED, not expired, and the order has >= 1 reward_eligible line"
    error_id: ERR_REWARD_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST pay"

  - priority: 10
    category: business_constraint
    check: "Stars sufficient to mint a FREE_ITEM reward (star_balance >= REDEEM_STAR_COST)"
    error_id: ERR_INSUFFICIENT_STARS
    http_status: 409
    applies_to: "POST /members/{member_id}/rewards/redeem"

  - priority: 11
    category: business_temporal
    check: "Pickup slot has remaining capacity at place time (reserved_count < Store.slot_capacity)"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST place"

  - priority: 12
    category: business_fiscal
    check: "For STORED_VALUE pay: card balance (after any auto-reload) covers total_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST pay"

  - priority: 13
    category: concurrency
    check: "OCC: expected_<parent>_version matches the parent's current version (card on pay, slot on place)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST pay, POST place"

  - priority: 14
    category: business_constraint
    check: "Birthday reward may be granted at most once per calendar year, only within the member's birthday month, and only one ISSUED BIRTHDAY reward at a time"
    error_id: ERR_BIRTHDAY_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /members/{member_id}/rewards/birthday"

  - priority: 15
    category: business_constraint
    check: "Refund target order is PAID and not PICKED_UP"
    error_id: ERR_REFUND_NOT_ALLOWED
    http_status: 409
    applies_to: "POST refund, POST cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Members ----
  - method: POST
    path: "/members"
    description: "Register a member; mints an empty StoredValueCard"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, birth_month_day]
    output: Member
    side_effects: ["StoredValueCard auto-created for the member (balance 0)", "star_balance/lifetime_stars 0, tier GREEN, status ACTIVE"]

  - method: GET
    path: "/members/{member_id}"
    description: "Get a member with computed star_balance, lifetime_stars, tier"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{member_id}/close"
    description: "Close a member account"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Member.status -> CLOSED", "All ISSUED RewardGrants -> EXPIRED"]

  - method: GET
    path: "/members/{id}/card"
    description: "Get the member's StoredValueCard (reverse-reachability for StoredValueCard.member_id); array of 0..1"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: StoredValueCard[]
    side_effects: []

  - method: PATCH
    path: "/members/{member_id}/card"
    description: "Update auto-reload config on the member's card"
    roles: [Member]
    code: 200
    input: ["auto_reload_enabled?", "auto_reload_threshold_cents?", "auto_reload_amount_cents?"]
    output: StoredValueCard
    side_effects: ["StoredValueCard.version increments by 1"]

  - method: POST
    path: "/members/{member_id}/card/reload"
    description: "Manually reload stored value onto the card"
    roles: [Member]
    code: 201
    input: [amount_cents]
    output: WalletTransaction
    side_effects: ["WalletTransaction(RELOAD, +amount_cents) appended", "StoredValueCard.balance_cents recomputed", "StoredValueCard.version increments by 1"]

  - method: GET
    path: "/wallet-transactions"
    description: "List wallet transactions, filterable by card (reverse-reachability for WalletTransaction.card_id) or order (reverse-reachability for WalletTransaction.order_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["card_id?", "order_id?", "limit?", "offset?"]
    output: WalletTransaction[]
    side_effects: []

  - method: GET
    path: "/wallet-transactions/{wallet_transaction_id}"
    description: "Get a single wallet transaction"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: WalletTransaction
    side_effects: []

  # ---- Stars & Rewards ----
  - method: GET
    path: "/star-ledger-entries"
    description: "List star ledger entries, filterable by member (reverse-reachability for StarLedgerEntry.member_id) or order (reverse-reachability for StarLedgerEntry.order_id)"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "order_id?", "limit?", "offset?"]
    output: StarLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/star-ledger-entries/{star_ledger_entry_id}"
    description: "Get a single star ledger entry"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: StarLedgerEntry
    side_effects: []

  - method: POST
    path: "/members/{member_id}/rewards/redeem"
    description: "Redeem stars to mint a FREE_ITEM reward"
    roles: [Member]
    code: 201
    input: []
    output: RewardGrant
    side_effects: ["StarLedgerEntry(REDEEM, -REDEEM_STAR_COST) appended", "Member.star_balance recomputed", "RewardGrant(FREE_ITEM, ISSUED) created with star_cost REDEEM_STAR_COST, max_discount_cents FREE_ITEM_MAX_DISCOUNT_CENTS (700), expires_at = now + FREE_ITEM_TTL_DAYS (60 days)"]

  - method: POST
    path: "/members/{member_id}/rewards/birthday"
    description: "Claim the annual birthday reward (within birthday month, once per calendar year)"
    roles: [Member]
    code: 201
    input: []
    output: RewardGrant
    side_effects: ["RewardGrant(BIRTHDAY, ISSUED, star_cost 0) created with max_discount_cents BIRTHDAY_MAX_DISCOUNT_CENTS (700), expires_at = now + BIRTHDAY_TTL_DAYS (30 days)", "Member.last_birthday_reward_year set to current year"]

  - method: GET
    path: "/rewards"
    description: "List reward grants, filterable by member (reverse-reachability for RewardGrant.member_id), reserving order (reverse-reachability for RewardGrant.reserved_by_order_id), and status"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "reserved_by_order_id?", "status?", "limit?", "offset?"]
    output: RewardGrant[]
    side_effects: []

  - method: GET
    path: "/rewards/{reward_id}"
    description: "Get a single reward grant"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: RewardGrant
    side_effects: []

  # ---- Stores & Catalog ----
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [PlatformAdmin]
    code: 201
    input: [name, timezone, slot_capacity, prep_minutes]
    output: Store
    side_effects: ["status initialized OPEN"]

  - method: GET
    path: "/stores/{store_id}"
    description: "Get a store"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/stores/{store_id}/pause"
    description: "Pause or resume a store (toggle OPEN/PAUSED)"
    roles: [StoreOperator, PlatformAdmin]
    code: 200
    input: [paused]
    output: Store
    side_effects: ["Store.status set to PAUSED (paused=true) or OPEN (paused=false)"]

  - method: POST
    path: "/stores/{store_id}/menu-items"
    description: "Add a menu item to a store"
    roles: [PlatformAdmin]
    code: 201
    input: [name, base_price_cents, category, "reward_eligible?"]
    output: MenuItem
    side_effects: ["available initialized true"]

  - method: GET
    path: "/stores/{id}/menu-items"
    description: "List a store's menu items (reverse-reachability for MenuItem.store_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["available?", "limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  - method: GET
    path: "/menu-items/{menu_item_id}"
    description: "Get a single menu item"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  - method: POST
    path: "/menu-items/{menu_item_id}/modifiers"
    description: "Add a modifier option to a menu item"
    roles: [PlatformAdmin]
    code: 201
    input: [group_code, name, price_delta_cents, "max_quantity?"]
    output: ModifierOption
    side_effects: []

  - method: GET
    path: "/menu-items/{id}/modifiers"
    description: "List a menu item's modifier options (reverse-reachability for ModifierOption.menu_item_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ModifierOption[]
    side_effects: []

  - method: POST
    path: "/stores/{store_id}/pickup-slots"
    description: "Create a pickup-time window for a store (rejects windows overlapping an existing slot on the store)"
    roles: [PlatformAdmin, StoreOperator]
    code: 201
    input: [window_start, window_end]
    output: PickupSlot
    side_effects: ["reserved_count initialized 0", "rejects with ERR_SLOT_OVERLAP if [window_start, window_end) overlaps an existing slot on the store (half-open; endpoint-touching allowed)"]

  - method: GET
    path: "/stores/{id}/pickup-slots"
    description: "List a store's pickup slots (reverse-reachability for PickupSlot.store_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PickupSlot[]
    side_effects: []

  - method: GET
    path: "/pickup-slots/{pickup_slot_id}"
    description: "Get a single pickup slot with computed reserved_count"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: PickupSlot
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/members/{member_id}/orders"
    description: "Create a CART order against a store + pickup slot"
    roles: [Member]
    code: 201
    input: [store_id, pickup_slot_id, "applied_reward_id?"]
    output: Order
    side_effects: ["fulfillment_status CART, payment_status UNPAID; computed money fields 0 until pay"]

  - method: GET
    path: "/orders/{order_id}"
    description: "Get an order with computed totals and both status axes (top-level single-resource read)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/members/{member_id}/orders/{order_id}"
    description: "Get an order scoped under its owning member (ownership-checked convenience read)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders, filterable by member (reverse-reachability for Order.member_id), store (Order.store_id), pickup_slot (Order.pickup_slot_id), and applied_reward (Order.applied_reward_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["member_id?", "store_id?", "pickup_slot_id?", "applied_reward_id?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/members/{member_id}/orders/{order_id}/lines"
    description: "Add a configured line (menu item + modifiers + quantity) to a CART order"
    roles: [Member]
    code: 201
    input: [menu_item_id, quantity, "modifiers?"]
    output: OrderLine
    side_effects: ["unit_price_cents, line_total_cents computed (calc line_pricing)"]

  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order (reverse-reachability for OrderLine.order_id) and menu item (reverse-reachability for OrderLine.menu_item_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["order_id?", "menu_item_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/order-lines/{order_line_id}"
    description: "Get a single order line"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/members/{member_id}/orders/{order_id}/pay"
    description: "Capture payment for a CART order (finalizes totals, earns stars, reserves reward, may auto-reload)"
    roles: [Member]
    code: 200
    input: [pay_method, "expected_card_version?"]
    output: Order
    side_effects:
      - "calc order_total finalizes subtotal_cents, reward_discount_cents, tax_cents, total_cents"
      - "If pay_method STORED_VALUE and auto-reload conditions met: WalletTransaction(AUTO_RELOAD) appended, card balance recomputed, StoredValueCard.version increments by 1"
      - "If pay_method STORED_VALUE: WalletTransaction(ORDER_SPEND, -total_cents) appended, card balance recomputed, StoredValueCard.version increments by 1"
      - "payment_status UNPAID -> PAID; pay_method set"
      - "stars_earned computed; StarLedgerEntry(EARN) appended; Member star_balance/lifetime_stars/tier recomputed"
      - "If applied_reward_id set: RewardGrant ISSUED -> RESERVED, reserved_by_order_id set"

  - method: POST
    path: "/members/{member_id}/orders/{order_id}/place"
    description: "Place a PAID order into the store's pickup queue (reserves slot capacity, consumes reward)"
    roles: [Member]
    code: 200
    input: ["expected_slot_version"]
    output: Order
    side_effects:
      - "fulfillment_status CART -> PLACED"
      - "PickupSlot.reserved_count recomputed; PickupSlot.version increments by 1"
      - "If applied_reward_id set: RewardGrant RESERVED -> REDEEMED"

  - method: POST
    path: "/members/{member_id}/orders/{order_id}/cancel"
    description: "Member cancels a PLACED order before prep; triggers full refund + star reversal + reward restore"
    roles: [Member, StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status PLACED -> CANCELLED"
      - "Refund auto-created (destination STORED_VALUE); Order.payment_status PAID -> REFUNDED"
      - "WalletTransaction(REFUND, +total_cents) appended; card balance recomputed; StoredValueCard.version increments by 1"
      - "StarLedgerEntry(REVERSAL, -stars_earned) appended; Member star_balance/lifetime_stars/tier recomputed"
      - "Redeemed RewardGrant restored to ISSUED (or EXPIRED if past expiry); reserved_by_order_id cleared"
      - "PickupSlot.reserved_count recomputed; PickupSlot.version increments by 1"

  # ---- Store-side order ops ----
  - method: POST
    path: "/stores/{store_id}/orders/{order_id}/start-prep"
    description: "Operator starts preparing a PLACED order"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status PLACED -> IN_PREP"]

  - method: POST
    path: "/stores/{store_id}/orders/{order_id}/ready"
    description: "Operator marks an order READY for pickup"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status IN_PREP -> READY"]

  - method: POST
    path: "/stores/{store_id}/orders/{order_id}/complete"
    description: "Operator completes pickup"
    roles: [StoreOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status READY -> PICKED_UP", "PickupSlot.reserved_count recomputed; PickupSlot.version increments by 1"]

  - method: POST
    path: "/stores/{store_id}/orders/{order_id}/refund"
    description: "Operator issues a full refund on a PAID, not-yet-picked-up order"
    roles: [StoreOperator, PlatformAdmin]
    code: 201
    input: [destination]
    output: Refund
    side_effects:
      - "Refund(SETTLED) created; amount_cents = Order.total_cents"
      - "Order.payment_status PAID -> REFUNDED; Order.fulfillment_status -> CANCELLED if non-terminal"
      - "WalletTransaction(REFUND) appended when destination STORED_VALUE or original pay was STORED_VALUE; card balance recomputed; StoredValueCard.version increments by 1"
      - "StarLedgerEntry(REVERSAL, -stars_earned) appended; Member star_balance/lifetime_stars/tier recomputed"
      - "Redeemed RewardGrant restored to ISSUED/EXPIRED; PickupSlot.reserved_count recomputed; PickupSlot.version increments by 1"

  - method: GET
    path: "/refunds"
    description: "List refunds, filterable by order (reverse-reachability for Refund.order_id)"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  - method: GET
    path: "/refunds/{refund_id}"
    description: "Get a single refund"
    roles: [Member, StoreOperator, PlatformAdmin]
    code: 200
    input: []
    output: Refund
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC instant (test-driving; controls birthday/expiry/slot-lead checks)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock pinned to the supplied instant for all subsequent now() reads"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource id in the path does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A FK referenced in the request body does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, negative integer where non-negative required, or modifier option not belonging to the line's menu item" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STORE_PAUSED, http: 409, condition: "Store is PAUSED and cannot accept the place/start-prep operation" }
  - { id: ERR_SLOT_UNAVAILABLE, http: 409, condition: "Pickup slot does not belong to the order's store, is in the past, or violates the store's prep_minutes lead time" }
  - { id: ERR_SLOT_FULL, http: 409, condition: "Pickup slot already holds slot_capacity reserved orders at place time" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "New pickup slot's half-open window overlaps an existing slot on the same store" }
  - { id: ERR_REWARD_NOT_APPLICABLE, http: 409, condition: "Applied reward is not owned by the member, not ISSUED, expired, or no order line is reward_eligible" }
  - { id: ERR_INSUFFICIENT_STARS, http: 409, condition: "star_balance below REDEEM_STAR_COST when minting a FREE_ITEM reward" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "STORED_VALUE pay where card balance (after any auto-reload) is below total_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_card_version (pay) or expected_slot_version (place) does not match the parent's current version" }
  - { id: ERR_BIRTHDAY_ALREADY_CLAIMED, http: 409, condition: "Birthday reward already claimed this calendar year, claimed outside birthday month, or an ISSUED BIRTHDAY reward already exists" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "Refund target order is not PAID, or has already been PICKED_UP" }
  - { id: ERR_VALIDATION, http: 422, condition: "Pagination params out of range (limit > 100 or < 1, negative offset)" }
  - { id: ERR_DUPLICATE_CARD, http: 409, condition: "Attempt to create a second StoredValueCard for a member (cards are auto-created at registration)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register a new member"
    identity: opaque
    exclusive_operations:
      - "POST /members — register"
    shared_operations: []

  - name: Member
    description: "A registered customer acting on their own account, card, rewards, and orders"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "PATCH /members/{member_id}/card — edit own auto-reload config"
      - "POST /members/{member_id}/card/reload — reload own card"
      - "POST /members/{member_id}/rewards/redeem — redeem stars for own reward"
      - "POST /members/{member_id}/rewards/birthday — claim own birthday reward"
      - "POST /members/{member_id}/orders — create own order"
      - "POST /members/{member_id}/orders/{order_id}/lines — add line to own order"
      - "POST /members/{member_id}/orders/{order_id}/pay — pay own order"
      - "POST /members/{member_id}/orders/{order_id}/place — place own order"
    shared_operations:
      - "GET own member/card/orders/lines/rewards/ledgers"
      - "POST /members/{member_id}/orders/{order_id}/cancel — shared with StoreOperator"
      - "POST /members/{member_id}/close — shared with PlatformAdmin"

  - name: StoreOperator
    description: "Barista/store staff managing a store's pickup queue and issuing refunds"
    identity: opaque
    exclusive_operations:
      - "POST /stores/{store_id}/orders/{order_id}/start-prep"
      - "POST /stores/{store_id}/orders/{order_id}/ready"
      - "POST /stores/{store_id}/orders/{order_id}/complete"
    shared_operations:
      - "POST /stores/{store_id}/pause — shared with PlatformAdmin"
      - "POST /stores/{store_id}/pickup-slots — shared with PlatformAdmin"
      - "POST /stores/{store_id}/orders/{order_id}/refund — shared with PlatformAdmin"
      - "POST /members/{member_id}/orders/{order_id}/cancel — shared with Member"
      - "GET stores/menu-items/modifiers/pickup-slots/orders/lines/refunds"

  - name: PlatformAdmin
    description: "Operator managing catalog, stores, refunds, member closure, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /stores — create store"
      - "POST /stores/{store_id}/menu-items — add menu item"
      - "POST /menu-items/{menu_item_id}/modifiers — add modifier"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "POST /stores/{store_id}/pause — shared with StoreOperator"
      - "POST /stores/{store_id}/pickup-slots — shared with StoreOperator"
      - "POST /stores/{store_id}/orders/{order_id}/refund — shared with StoreOperator"
      - "POST /members/{member_id}/close — shared with Member"
      - "GET all read endpoints"
