# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Utility Capital Project & Work-Order Costing
# Every instance drives empty-DB -> precondition using only §1.5 endpoints.
# Operator ids (opaque roles): admin-1, eng-1, eng-2, sup-1, sup-2, ctrl-1,
# ctrl-2, clerk-1, rates-1. Default logical clock: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: WorkOrder CWIP
  # accrual vs FixedAssetUnit depreciation basis)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: afudc_half_vs_full_month_base
        grounds:
          - calculations.afudc_accrual
          - entities.CapitalProgram.fields.afudc_method
          - entities.AFUDCEntry.fields.method
        distinguishing_aspect: |
          Same charges (200,000c, zero begin balance, 1%/month composite) accrue 1,000c
          under HALF_MONTH and 2,000c under FULL_MONTH — the variant lives on the
          WorkOrder/CWIP domain and is selected by CapitalProgram.afudc_method.
        test_recipe:
          setup:
            - "Two programs identical except afudc_method (HALF_MONTH vs FULL_MONTH), each with an authorized, started CAPITAL work order holding a single 200,000c MATERIAL charge at 0% overhead; period 2026-08 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-H", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_h: $.data.id } }
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-F", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: FULL_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_f: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_h}", order_type: CAPITAL, title: "Feeder rebuild H", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_h: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo_h}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_h_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo_h}" }, as: Controller, captures: { est_h: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est_h}/approve", payload: { expected_work_order_version: "${wo_h_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_h}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_h}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo_h}", cost_type: MATERIAL, base_amount_cents: 200000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_f}", order_type: CAPITAL, title: "Feeder rebuild F", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_f: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo_f}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_f_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo_f}" }, as: Controller, captures: { est_f: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est_f}/approve", payload: { expected_work_order_version: "${wo_f_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_f}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_f}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo_f}", cost_type: MATERIAL, base_amount_cents: 200000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo_h}", accounting_period_id: "${per1}" }, as: Auditor, captures: { af_h_amt: "$.data[0].amount_cents", af_h_base: "$.data[0].base_cents", af_h_method: "$.data[0].method" } }
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo_f}", accounting_period_id: "${per1}" }, as: Auditor, captures: { af_f_amt: "$.data[0].amount_cents", af_f_base: "$.data[0].base_cents" } }
            - { call: "GET /ucp/work-orders/${wo_h}", payload: {}, as: Auditor, captures: { wo_h_cwip: $.data.cwip_cents } }
            - { call: "GET /ucp/work-orders/${wo_f}", payload: {}, as: Auditor, captures: { wo_f_cwip: $.data.cwip_cents } }
          assert:
            - "AFUDCEntry(HALF).amount_cents ${af_h_amt} == 1000 and base_cents ${af_h_base} == 100000 and method ${af_h_method} == HALF_MONTH"
            - "AFUDCEntry(FULL).amount_cents ${af_f_amt} == 2000 and base_cents ${af_f_base} == 200000"
            - "WorkOrder(${wo_h}).cwip_cents ${wo_h_cwip} == 201000"
            - "WorkOrder(${wo_f}).cwip_cents ${wo_f_cwip} == 202000"
            - "Identical inputs diverge exactly 2x: ${af_f_amt} == 2 * ${af_h_amt}"

      - name: depreciation_net_vs_gross_ciac_basis
        grounds:
          - calculations.depreciation_charge
          - calculations.unitization_allocation
          - entities.CapitalProgram.fields.ciac_method
        distinguishing_aspect: |
          Same physical asset (1 transformer, 120,000c CWIP, 20,000c CIAC, 12%/yr) depreciates
          on a 100,000c NET basis (500c in-service month, no contra credit) versus a 120,000c
          GROSS basis (600c in-service month plus a 100c CIAC contra credit) — the variant lives
          on the FixedAssetUnit/depreciation domain, a different domain than AFUDC accrual.
        test_recipe:
          setup:
            - "Program NET (ciac_method NET_OF_CIAC) and program GRS (GROSS_WITH_CONTRA); each has a CAPITAL work order with 120,000c of charges and a RECEIVED 20,000c CIAC; catalog TRANSFORMER std 50,000c @12%/yr; period 2026-08 open; both work orders completed in-service 2026-08-20 and closed out with one TRANSFORMER line"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-NET", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_n: $.data.id } }
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-GRS", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: GROSS_WITH_CONTRA }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_g: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_n}", order_type: CAPITAL, title: "Substation NET", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_n: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo_n}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_n_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo_n}" }, as: Controller, captures: { est_n: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est_n}/approve", payload: { expected_work_order_version: "${wo_n_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_n}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_n}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo_n}", cost_type: MATERIAL, base_amount_cents: 120000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo_n}", pledged_cents: 20000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ciac_n: $.data.id } }
            - { call: "POST /ucp/ciac-agreements/${ciac_n}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
            - { call: "POST /ucp/work-orders/${wo_n}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_n}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_g}", order_type: CAPITAL, title: "Substation GROSS", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_g: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo_g}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_g_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo_g}" }, as: Controller, captures: { est_g: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est_g}/approve", payload: { expected_work_order_version: "${wo_g_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_g}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_g}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo_g}", cost_type: MATERIAL, base_amount_cents: 120000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/ciac-agreements", payload: { work_order_id: "${wo_g}", pledged_cents: 20000, pledge_expiry_at: "2026-12-31T00:00:00Z" }, as: RateAnalyst, as_user_id: rates-1, captures: { ciac_g: $.data.id } }
            - { call: "POST /ucp/ciac-agreements/${ciac_g}/receive", payload: {}, as: RateAnalyst, as_user_id: rates-1 }
            - { call: "POST /ucp/work-orders/${wo_g}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo_g}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo_n}" }, as: Auditor, captures: { unit_n: "$.data[0].id", alloc_n: "$.data[0].allocated_cost_cents" } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo_g}" }, as: Auditor, captures: { unit_g: "$.data[0].id", alloc_g: "$.data[0].allocated_cost_cents" } }
            - { call: "GET /ucp/depreciation-entries", payload: { fixed_asset_unit_id: "${unit_n}", accounting_period_id: "${per1}" }, as: Auditor, captures: { dep_n: "$.data[0].amount_cents", cred_n: "$.data[0].ciac_contra_credit_cents" } }
            - { call: "GET /ucp/depreciation-entries", payload: { fixed_asset_unit_id: "${unit_g}", accounting_period_id: "${per1}" }, as: Auditor, captures: { dep_g: "$.data[0].amount_cents", cred_g: "$.data[0].ciac_contra_credit_cents" } }
            - { call: "GET /ucp/capital-programs/${prog_g}", payload: {}, as: Auditor, captures: { contra_g: $.data.ciac_contra_balance_cents } }
          assert:
            - "NET unit allocated_cost_cents ${alloc_n} == 100000 (gross 120000 minus CIAC 20000)"
            - "GROSS unit allocated_cost_cents ${alloc_g} == 120000 (CIAC not netted)"
            - "NET in-service-month depreciation ${dep_n} == 500 with contra credit ${cred_n} == 0"
            - "GROSS in-service-month depreciation ${dep_g} == 600 with contra credit ${cred_g} == 100"
            - "Program GROSS ciac_contra_balance_cents ${contra_g} == 19900 (20000 applied minus 100 credit)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three different modes: (c) circular-order
  # AFUDC base, (b) pinned rounding order in unitization, (a) multi-input
  # conditional depreciation)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: afudc_circular_base_order
        grounds:
          - calculations.afudc_accrual
          - entities.AFUDCEntry.fields.base_cents
        distinguishing_aspect: |
          Mode (c): the AFUDC base circularly depends on CWIP which itself contains prior
          AFUDC — the pinned order (begin balance excludes this period's own accrual but
          includes prior periods') makes period 1 accrue 1,000c and period 2 accrue 2,010c
          (base 201,000c) with zero period-2 charges; any other evaluation order changes the numbers.
        test_recipe:
          setup:
            - "HALF_MONTH program, 1%/month composite; CAPITAL work order (estimate 9,000,000c) started with a single 200,000c MATERIAL charge in period 2026-08; no charges in 2026-09"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-CIRC", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Loop feeder", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 200000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per2}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo}", accounting_period_id: "${per1}" }, as: Auditor, captures: { p1_amt: "$.data[0].amount_cents", p1_base: "$.data[0].base_cents" } }
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo}", accounting_period_id: "${per2}" }, as: Auditor, captures: { p2_amt: "$.data[0].amount_cents", p2_base: "$.data[0].base_cents" } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_cwip: $.data.cwip_cents, wo_afudc: $.data.afudc_total_cents } }
          assert:
            - "Period-1 entry: base ${p1_base} == 100000 (0 + 0.5*200000), amount ${p1_amt} == 1000"
            - "Period-2 entry: base ${p2_base} == 201000 (prior AFUDC 1000 compounds into begin balance), amount ${p2_amt} == 2010 with zero period-2 charges"
            - "WorkOrder.cwip_cents ${wo_cwip} == 203010 and afudc_total_cents ${wo_afudc} == 3010"

      - name: unitization_largest_remainder_waterfall
        grounds:
          - calculations.unitization_allocation
          - entities.FixedAssetUnit.fields.allocated_cost_cents
        distinguishing_aspect: |
          Mode (b): per-line round-half-up produces 50,002/20,001/30,001 (sum 100,004) which
          overshoots the 100,003c total by 1c; the pinned remainder waterfall pushes -1c to the
          greatest-target line (TRANSFORMER), yielding 50,001/20,001/30,001 — computing the
          allocation any other way (sum-then-round, or remainder to first line) changes the cents.
        test_recipe:
          setup:
            - "NET_OF_CIAC program; catalog TRANSFORMER 50,000c, POLE 10,000c, CONDUCTOR 6,000c; CAPITAL work order (estimate 500,000c) with exactly 100,003c of 0%-overhead MATERIAL charges, completed 2026-08-20"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-UNIT", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: POLE, standard_cost_cents: 10000, annual_depreciation_rate_pct: 4.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_p: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: CONDUCTOR, standard_cost_cents: 6000, annual_depreciation_rate_pct: 3.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_c: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Feeder extension", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 100003, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 }, { unit_catalog_id: "${cat_p}", quantity: 2 }, { unit_catalog_id: "${cat_c}", quantity: 5 } ] }, as: Controller, as_user_id: ctrl-1, captures: { wo_cap: $.data.capitalizable_total_cents, wo_status: $.data.status } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { a0: "$.data[0].allocated_cost_cents", a1: "$.data[1].allocated_cost_cents", a2: "$.data[2].allocated_cost_cents", l0: "$.data[0].line_no", l1: "$.data[1].line_no", l2: "$.data[2].line_no" } }
          assert:
            - "WorkOrder.capitalizable_total_cents ${wo_cap} == 100003 and status ${wo_status} == CLOSED"
            - "Line 0 (TRANSFORMER x1, target 50000) allocated ${a0} == 50001 after absorbing the -1c remainder"
            - "Line 1 (POLE x2, target 20000) allocated ${a1} == 20001"
            - "Line 2 (CONDUCTOR x5, target 30000) allocated ${a2} == 30001"
            - "Sum conservation: ${a0} + ${a1} + ${a2} == 100003"

      - name: depreciation_half_month_factors
        grounds:
          - calculations.depreciation_charge
          - state_machines.FixedAssetUnit.IN_SERVICE_to_RETIRED
        distinguishing_aspect: |
          Mode (a): the per-period amount is a conditional function of >=3 inputs (allocated
          cost, catalog rate, and the period's position relative to in-service/retirement
          periods): 600c in the in-service month, 1,200c in a full month, 600c in the
          retirement month, and the retirement NBV write-off of 117,600c.
        test_recipe:
          setup:
            - "NET_OF_CIAC program; TRANSFORMER catalog 12%/yr; CAPITAL work order closed out with one unit at 120,000c, in-service period 2026-08; period 2026-09 closed for a full month; unit retired 2026-10-10 during open period 2026-10"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-DEP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Transformer swap", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 120000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per2}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 10, start_date: "2026-10-01", end_date: "2026-10-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per3: $.data.id } }
            - { call: "GET /ucp/fixed-asset-units", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { unit: "$.data[0].id" } }
            - { call: "POST /ucp/fixed-asset-units/${unit}/retire", payload: { retirement_date: "2026-10-10" }, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per3}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/depreciation-entries", payload: { fixed_asset_unit_id: "${unit}", accounting_period_id: "${per1}" }, as: Auditor, captures: { d1: "$.data[0].amount_cents" } }
            - { call: "GET /ucp/depreciation-entries", payload: { fixed_asset_unit_id: "${unit}", accounting_period_id: "${per2}" }, as: Auditor, captures: { d2: "$.data[0].amount_cents" } }
            - { call: "GET /ucp/depreciation-entries", payload: { fixed_asset_unit_id: "${unit}", accounting_period_id: "${per3}" }, as: Auditor, captures: { d3: "$.data[0].amount_cents" } }
            - { call: "GET /ucp/fixed-asset-units/${unit}", payload: {}, as: Auditor, captures: { acc: $.data.accumulated_depreciation_cents, nbv: $.data.retirement_nbv_cents, ustatus: $.data.status } }
          assert:
            - "In-service month (factor 0.5): ${d1} == 600"
            - "Full month (factor 1.0): ${d2} == 1200"
            - "Retirement month (factor 0.5): ${d3} == 600"
            - "FixedAssetUnit.accumulated_depreciation_cents ${acc} == 2400"
            - "FixedAssetUnit.retirement_nbv_cents ${nbv} == 117600 and status ${ustatus} == RETIRED"
  # ===========================================================================
  # Rule 3 — non_linear_state_machine (WorkOrder revision/suspension cycles vs
  # AccountingPeriod close/reopen cycle — different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_return_resubmit_and_suspend_resume_cycles
        grounds:
          - state_machines.WorkOrder.SUBMITTED_to_RETURNED
          - state_machines.WorkOrder.RETURNED_to_SUBMITTED
          - state_machines.WorkOrder.IN_PROGRESS_to_SUSPENDED
          - state_machines.WorkOrder.SUSPENDED_to_IN_PROGRESS
        distinguishing_aspect: |
          WorkOrder is cyclic in two independent loops (SUBMITTED->RETURNED->SUBMITTED and
          IN_PROGRESS->SUSPENDED->IN_PROGRESS): authorize is rejected from RETURNED with
          ERR_INVALID_STATE, succeeds after resubmission, and a suspend/resume round-trip
          returns the order to IN_PROGRESS with budget still committed.
        test_recipe:
          setup:
            - "Program with ample budget; work order (estimate 400,000c) created and submitted once; no periods needed (no charges)"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-CYC", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Pole replacement", initial_estimated_cost_cents: 400000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/return", payload: { reason: "scope unclear" }, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st_returned: $.data.status } }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { err_auth: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { st_resub: $.data.status, wo_v_resub: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v_resub}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st_auth: $.data.status } }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/suspend", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st_susp: $.data.status } }
            - { call: "POST /ucp/work-orders/${wo}/resume", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { st_res: $.data.status } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed: $.data.committed_amount_cents } }
          assert:
            - "After return: status ${st_returned} == RETURNED"
            - "Authorize from RETURNED rejected: error_id ${err_auth} == ERR_INVALID_STATE"
            - "Resubmission loop: status ${st_resub} == SUBMITTED"
            - "Authorize after resubmit: status ${st_auth} == AUTHORIZED"
            - "Suspend/resume loop: ${st_susp} == SUSPENDED then ${st_res} == IN_PROGRESS"
            - "Budget stayed committed through the loops: committed_amount_cents ${committed} == 400000"

      - name: accounting_period_close_reopen_reclose_cycle
        grounds:
          - state_machines.AccountingPeriod.CLOSED_to_REOPENED
          - state_machines.AccountingPeriod.REOPENED_to_CLOSED
          - calculations.afudc_accrual
        distinguishing_aspect: |
          AccountingPeriod cycles CLOSED->REOPENED->CLOSED: the first close accrues a 1,000c
          AFUDC entry, the reopen compensates it (entry REVERSED, CWIP back to 200,000c), and
          the re-close recomputes a fresh 1,000c entry — a cyclic machine with compensation,
          on a different entity than WorkOrder.
        test_recipe:
          setup:
            - "HALF_MONTH program (1%/month composite); CAPITAL work order (estimate 9,000,000c) authorized and started with a 200,000c MATERIAL charge in period 2026-08"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-RCP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Cable replacement", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 200000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_after_close: $.data.cwip_cents } }
            - { call: "POST /ucp/accounting-periods/${per1}/reopen", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { st_reopened: $.data.status } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_after_reopen: $.data.cwip_cents } }
            - { call: "GET /ucp/afudc-entries", payload: { work_order_id: "${wo}", accounting_period_id: "${per1}" }, as: Auditor, captures: { e0_status: "$.data[0].status", e0_amt: "$.data[0].amount_cents" } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { st_reclosed: $.data.status } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_after_reclose: $.data.cwip_cents } }
          assert:
            - "First close: cwip ${cwip_after_close} == 201000"
            - "Reopen: status ${st_reopened} == REOPENED and cwip ${cwip_after_reopen} == 200000 (compensated)"
            - "Re-close: status ${st_reclosed} == CLOSED and cwip ${cwip_after_reclose} == 201000 (recomputed identically — no new charges)"
            - "Original AFUDC entry after reopen: status ${e0_status} == REVERSED, amount ${e0_amt} == 1000"

  # ===========================================================================
  # Rule 4 — transitive_cascade (estimate approval chain vs period-close
  # amortization chain — different triggering transitions)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: estimate_approval_supersede_budget_posture_cascade
        grounds:
          - state_machines.Estimate.PROPOSED_to_APPROVED
          - state_machines.Estimate.APPROVED_to_SUPERSEDED
          - calculations.program_budget_accounting
          - calculations.variance_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain from POST /ucp/estimates/{id}/approve: (1) the approval SUPERSEDES the
          prior estimate, (2) the supersede updates WorkOrder.approved_estimate_cents and the
          program's committed budget 10,000->12,000, (3) the new approved amount re-derives
          variance_posture RE_ESTIMATE_REQUIRED->WITHIN_TOLERANCE, which unblocks charging —
          each link caused by the previous link, not by the request directly.
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized at 10,000c estimate and started; MATERIAL 0% charges of 10,000c + 1,001c bring actual_direct to 11,001c, flipping variance_posture to RE_ESTIMATE_REQUIRED (charging now blocked); period 2026-08 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-CAS", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Meter swap", initial_estimated_cost_cents: 10000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est1: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est1}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1001, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v_pre: $.data.version, posture_pre: $.data.variance_posture } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed_pre: $.data.committed_amount_cents } }
          trigger:
            - { call: "POST /ucp/estimates", payload: { work_order_id: "${wo}", estimated_cost_cents: 12000, expected_work_order_version: "${wo_v_pre}", notes: "field conditions" }, as: ProjectEngineer, as_user_id: eng-1, captures: { est2: $.data.id } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_v_pre2: $.data.version } }
            - { call: "POST /ucp/estimates/${est2}/approve", payload: { expected_work_order_version: "${wo_v_pre2}" }, as: Controller, as_user_id: ctrl-1, captures: { est2_tier: $.data.routing_tier, est2_super: $.data.supersedes_estimate_id } }
            - { call: "GET /ucp/estimates/${est1}", payload: {}, as: Auditor, captures: { est1_status: $.data.status } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { wo_approved: $.data.approved_estimate_cents, posture_post: $.data.variance_posture } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed_post: $.data.committed_amount_cents } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 500, charge_date: "2026-08-07" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg_total: $.data.total_cents } }
          assert:
            - "Precondition held: posture ${posture_pre} == RE_ESTIMATE_REQUIRED, committed ${committed_pre} == 10000"
            - "Link 1: prior estimate ${est1} status ${est1_status} == SUPERSEDED; new estimate supersedes_estimate_id ${est2_super} == ${est1}"
            - "Link 2: approved_estimate_cents ${wo_approved} == 12000; program committed ${committed_post} == 12000 (delta +2000)"
            - "Link 2b: routing_tier ${est2_tier} == CONTROLLER (20% delta >= 10%)"
            - "Link 3: variance_posture ${posture_post} == WITHIN_TOLERANCE (11001*100 <= 12000*110)"
            - "Unblocked: follow-up charge posts with total_cents ${chg_total} == 500"

      - name: period_close_amortization_completion_cascade
        grounds:
          - state_machines.AccountingPeriod.OPEN_to_CLOSED
          - state_machines.RegulatoryAsset.APPROVED_to_AMORTIZING
          - state_machines.RegulatoryAsset.AMORTIZING_to_FULLY_AMORTIZED
          - calculations.amortization_schedule
        distinguishing_aspect: |
          Depth-3 chain from POST /ucp/accounting-periods/{id}/close (a different trigger than
          estimate approval): (1) the close posts an AmortizationEntry, (2) the entry decrements
          RegulatoryAsset.remaining_cents, (3) the balance hitting 0 flips the asset to
          FULLY_AMORTIZED — with the final 3,334c entry absorbing the rounding remainder of
          10,000c over 3 months.
        test_recipe:
          setup:
            - "RegulatoryAsset of 10,000c over 3 months, APPROVED; three adjacent periods 2026-08/09/10 to close in sequence; no work orders exist"
          setup_api_calls:
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Storm cost deferral", original_cents: 10000, amortization_months: 3 }, as: RateAnalyst, as_user_id: rates-1, captures: { ra: $.data.id } }
            - { call: "POST /ucp/regulatory-assets/${ra}/approve", payload: {}, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/regulatory-assets/${ra}", payload: {}, as: Auditor, captures: { rem1: $.data.remaining_cents, st1: $.data.status } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per2}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/regulatory-assets/${ra}", payload: {}, as: Auditor, captures: { rem2: $.data.remaining_cents, st2: $.data.status } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 10, start_date: "2026-10-01", end_date: "2026-10-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per3: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per3}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "GET /ucp/regulatory-assets/${ra}", payload: {}, as: Auditor, captures: { rem3: $.data.remaining_cents, st3: $.data.status } }
            - { call: "GET /ucp/amortization-entries", payload: { regulatory_asset_id: "${ra}", accounting_period_id: "${per3}" }, as: Auditor, captures: { amt3: "$.data[0].amount_cents" } }
          assert:
            - "After close 1: remaining ${rem1} == 6667, status ${st1} == AMORTIZING (entry 3333)"
            - "After close 2: remaining ${rem2} == 3334, status ${st2} == AMORTIZING"
            - "After close 3: final entry ${amt3} == 3334 (rounding remainder plug), remaining ${rem3} == 0, status ${st3} == FULLY_AMORTIZED"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (state-vs-fiscal and
  # temporal-vs-fiscal — different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: charge_state_error_beats_variance_hold
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_VARIANCE_HOLD]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a charge posted to a COMPLETED work order
          whose variance_posture is still RE_ESTIMATE_REQUIRED violates both priority 7 and
          priority 11 — the state error ERR_INVALID_STATE must win over ERR_VARIANCE_HOLD.
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized/started at 10,000c; charges 10,000c + 1,001c (MATERIAL 0%) push actual_direct to 11,001c so posture is RE_ESTIMATE_REQUIRED; then completed with in_service_date 2026-08-20 (completion does not clear the posture)"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-PP1", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Regulator install", initial_estimated_cost_cents: 10000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1001, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { st: $.data.status, posture: $.data.variance_posture } }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 100, charge_date: "2026-08-21" }, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
          assert:
            - "Dual-failure precondition: status ${st} == COMPLETED and posture ${posture} == RE_ESTIMATE_REQUIRED"
            - "The state-category error wins: error_id ${err} == ERR_INVALID_STATE (not ERR_VARIANCE_HOLD)"

      - name: charge_period_error_beats_variance_hold
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_PERIOD_CLOSED]
          - errors[ERR_VARIANCE_HOLD]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal (a different pair than
          state-vs-fiscal): a charge whose charge_date falls in a CLOSED period, posted while
          the work order's variance_posture is RE_ESTIMATE_REQUIRED, must return
          ERR_PERIOD_CLOSED (priority 9), not ERR_VARIANCE_HOLD (priority 11).
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized/started at 10,000c; charges 10,000c + 1,001c in period 2026-08 flip posture to RE_ESTIMATE_REQUIRED; period 2026-08 then closed (AFUDC accrues 55c, which does not enter the variance base); period 2026-09 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-PP2", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Service upgrade", initial_estimated_cost_cents: 10000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1001, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { posture: $.data.variance_posture } }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 100, charge_date: "2026-08-15" }, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
          assert:
            - "Dual-failure precondition: posture ${posture} == RE_ESTIMATE_REQUIRED and charge_date 2026-08-15 is in a CLOSED period"
            - "The temporal error wins: error_id ${err} == ERR_PERIOD_CLOSED (not ERR_VARIANCE_HOLD)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (numeric threshold on charge posting vs
  # empty-set on closeout — different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: variance_threshold_exact_110_percent
        grounds:
          - calculations.variance_posture_derivation
          - errors[ERR_VARIANCE_HOLD]
        distinguishing_aspect: |
          Numeric boundary on POST /ucp/cost-charges: at exactly 110.00% of the approved
          estimate (11,000c vs 10,000c) the strictly-greater rule keeps the posture
          WITHIN_TOLERANCE and the charge succeeds; one cent more (11,001c) is still postable
          (the crossing charge is allowed) but flips the posture so the NEXT charge fails
          with ERR_VARIANCE_HOLD.
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized/started at 10,000c; MATERIAL 0% overhead; period 2026-08 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-BND", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Boundary order", initial_estimated_cost_cents: 10000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 11000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg1_total: $.data.total_cents } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { posture_at_110: $.data.variance_posture, actual_at_110: $.data.actual_direct_cents } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg2_total: $.data.total_cents } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { posture_over: $.data.variance_posture, actual_over: $.data.actual_direct_cents } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 1, charge_date: "2026-08-07" }, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
          assert:
            - "Exactly 110.00% posts: total ${chg1_total} == 11000 and posture ${posture_at_110} == WITHIN_TOLERANCE (actual ${actual_at_110} == 11000)"
            - "The 1-cent crossing charge also posts: total ${chg2_total} == 1; actual now ${actual_over} == 11001"
            - "Posture flipped only after the crossing charge: ${posture_over} == RE_ESTIMATE_REQUIRED"
            - "The next charge is blocked: error_id ${err} == ERR_VARIANCE_HOLD"

      - name: closeout_empty_unitization_set
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_CLOSED
          - errors[ERR_UNITIZATION_EMPTY]
        distinguishing_aspect: |
          Empty-set boundary on POST /ucp/work-orders/{id}/closeout (a different endpoint and
          a different metric than the 110% numeric threshold): a CAPITAL work order with zero
          unitization lines is rejected ERR_UNITIZATION_EMPTY, while a single line passes the
          set-cardinality gate.
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized/started/completed (in-service 2026-08-20) with zero charges (actual 0, underrun never blocks); TRANSFORMER catalog row exists; period 2026-08 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-EMP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Empty unitization order", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [] }, as: Controller, as_user_id: ctrl-1, captures: { err_empty: $.data.error_id } }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status, cap: $.data.capitalizable_total_cents } }
          assert:
            - "Empty lines rejected: error_id ${err_empty} == ERR_UNITIZATION_EMPTY (and the work order is still COMPLETED)"
            - "One line passes the cardinality gate: status ${st} == CLOSED with capitalizable_total_cents ${cap} == 0"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (WorkOrder->CapitalProgram,
  # CostCharge->AccountingPeriod, WorkOrder->RegulatoryAsset: three pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_create_blocked_on_closed_program
        grounds:
          - errors[ERR_PROGRAM_CLOSED]
          - state_machines.CapitalProgram.OPEN_to_CLOSED
        distinguishing_aspect: |
          Pair WorkOrder->CapitalProgram: POST /ucp/work-orders is rejected with
          ERR_PROGRAM_CLOSED when the referenced program is CLOSED, and accepted while the
          same class of program is OPEN — the work order's creatability is gated by the
          parent program's lifecycle state.
        test_recipe:
          setup:
            - "Two programs: CAP-OPEN left OPEN, CAP-SHUT closed immediately (no work orders, so close is legal)"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-OPEN", fiscal_year: 2026, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_open: $.data.id } }
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-SHUT", fiscal_year: 2025, authorized_amount_cents: 5000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog_shut: $.data.id } }
            - { call: "POST /ucp/capital-programs/${prog_shut}/close", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { shut_status: $.data.status } }
          trigger:
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_shut}", order_type: CAPITAL, title: "Late order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog_open}", order_type: CAPITAL, title: "Good order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_ok: $.data.id, wo_ok_status: $.data.status } }
          assert:
            - "Program close succeeded: status ${shut_status} == CLOSED"
            - "Create against CLOSED program rejected: error_id ${err} == ERR_PROGRAM_CLOSED"
            - "Create against OPEN program succeeds: status ${wo_ok_status} == DRAFT"

      - name: charge_posting_gated_by_period_state
        grounds:
          - errors[ERR_PERIOD_CLOSED]
          - entities.CostCharge.fields.accounting_period_id
        distinguishing_aspect: |
          Pair CostCharge->AccountingPeriod (different pair than WorkOrder->CapitalProgram):
          the same charge posts while the covering period is OPEN and is rejected with
          ERR_PERIOD_CLOSED once that period flips to CLOSED — a cross-entity state gate,
          with the charge resolving its accounting_period_id from charge_date.
        test_recipe:
          setup:
            - "CAPITAL work order authorized and started (estimate 9,000,000c); MATERIAL 0% overhead; period 2026-08 open"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-XEP", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Period gating order", initial_estimated_cost_cents: 9000000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 5000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg_open: $.data.id, chg_open_period: $.data.accounting_period_id } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 7000, charge_date: "2026-08-20" }, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 7000, charge_date: "2026-09-02" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg2_period: $.data.accounting_period_id } }
          assert:
            - "While OPEN the charge posted into ${chg_open_period} == ${per1}"
            - "After close the same work order rejects a charge dated in the CLOSED period: error_id ${err} == ERR_PERIOD_CLOSED"
            - "A charge dated in the new OPEN period succeeds and resolves ${chg2_period} == ${per2}"

      - name: closeout_gated_by_regulatory_asset_state
        grounds:
          - calculations.closeout_variance_gate
          - state_machines.RegulatoryAsset.PROPOSED_to_APPROVED
          - errors[ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE]
        distinguishing_aspect: |
          Pair WorkOrder->RegulatoryAsset (a third pair): a closeout with a 16,000c overrun
          (tolerance 15,000c, coverage_needed 1,000c) fails with
          ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE while the linked 1,000c deferral is merely
          PROPOSED, and succeeds once that RegulatoryAsset flips to APPROVED — the boundary
          coverage amount 1,000c exactly equals coverage_needed and equality passes.
        test_recipe:
          setup:
            - "CAPITAL work order approved/authorized/started at 100,000c estimate; charges 10,000c then 106,000c (the crossing charge is allowed) bring actual_direct to 116,000c; completed 2026-08-20; RegulatoryAsset of exactly 1,000c sourced to this work order is PROPOSED; TRANSFORMER catalog row exists"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-XRA", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/unit-catalog", payload: { asset_class: TRANSFORMER, standard_cost_cents: 50000, annual_depreciation_rate_pct: 12.0 }, as: SystemAdmin, as_user_id: admin-1, captures: { cat_t: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Overrun order", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 10000, charge_date: "2026-08-05" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 106000, charge_date: "2026-08-06" }, as: FieldClerk, as_user_id: clerk-1 }
            - { call: "POST /ucp/work-orders/${wo}/complete", payload: { in_service_date: "2026-08-20" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Excess cost deferral", original_cents: 1000, amortization_months: 12, source_work_order_id: "${wo}" }, as: RateAnalyst, as_user_id: rates-1, captures: { ra: $.data.id } }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/regulatory-assets/${ra}/approve", payload: {}, as: Controller, as_user_id: ctrl-1 }
            - { call: "POST /ucp/work-orders/${wo}/closeout", payload: { unitization_lines: [ { unit_catalog_id: "${cat_t}", quantity: 1 } ] }, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status, cap: $.data.capitalizable_total_cents } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { capitalized: $.data.capitalized_actual_cents } }
          assert:
            - "PROPOSED coverage does not count: first closeout fails with error_id ${err} == ERR_CLOSEOUT_VARIANCE_EXCEEDS_TOLERANCE"
            - "After APPROVED (coverage 1000 >= needed 1000, equality passes): status ${st} == CLOSED"
            - "capitalizable_total_cents ${cap} == 116000 and program capitalized_actual_cents ${capitalized} == 116000"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (half-open gaps-allowed schedules vs
  # strictly-adjacent gap-forbidden periods — different interval semantics,
  # different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overhead_schedule_half_open_overlap_rules
        grounds:
          - errors[ERR_OVERHEAD_SCHEDULE_OVERLAP]
          - entities.OverheadSchedule.fields.effective_from
        distinguishing_aspect: |
          Half-open [from, to) semantics on OverheadSchedule: touching bounds
          (new.from == existing.to) are NOT an overlap, gaps are allowed, and an interior
          intersection on the same (cost_type, order_type) is rejected with
          ERR_OVERHEAD_SCHEDULE_OVERLAP while a different cost_type on identical dates is fine.
        test_recipe:
          setup:
            - "Empty overhead schedule table"
          setup_api_calls:
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: LABOR, order_type: CAPITAL, rate_pct: 15.0, effective_from: "2026-01-01", effective_to: "2026-07-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: LABOR, order_type: CAPITAL, rate_pct: 16.0, effective_from: "2026-07-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { s2: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: LABOR, order_type: CAPITAL, rate_pct: 14.0, effective_from: "2026-06-01", effective_to: "2026-08-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: EQUIPMENT, order_type: CAPITAL, rate_pct: 14.0, effective_from: "2026-06-01", effective_to: "2026-08-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { s3: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 5.0, effective_from: "2026-01-01", effective_to: "2026-03-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { s4: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 6.0, effective_from: "2026-06-01" }, as: SystemAdmin, as_user_id: admin-1, captures: { s5: $.data.id } }
          assert:
            - "Touching bound accepted: ${s2} created (2026-07-01 == prior effective_to, half-open => no overlap)"
            - "Interior intersection rejected: error_id ${err_overlap} == ERR_OVERHEAD_SCHEDULE_OVERLAP"
            - "Same dates on a different cost_type accepted: ${s3} created"
            - "Gaps allowed: MATERIAL rows ${s4} and ${s5} coexist with a 2026-03-01..2026-06-01 gap"

      - name: accounting_period_strict_adjacency_rules
        grounds:
          - errors[ERR_PERIOD_NOT_ADJACENT]
          - entities.AccountingPeriod.fields.start_date
        distinguishing_aspect: |
          Strict closed-interval adjacency on AccountingPeriod (a different resource and
          different semantics than half-open schedules): after the first period closes, a
          successor starting 2026-09-02 (one-day gap) and one starting 2026-08-15 (overlap)
          both fail ERR_PERIOD_NOT_ADJACENT; only start_date == latest end_date + 1 day
          (2026-09-01) is accepted — gaps are forbidden, not merely non-overlapping.
        test_recipe:
          setup:
            - "Period 2026-08 created and immediately closed (no activity)"
          setup_api_calls:
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-02", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { err_gap: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-08-15", end_date: "2026-09-15" }, as: SystemAdmin, as_user_id: admin-1, captures: { err_olap: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id, per2_status: $.data.status } }
          assert:
            - "Gap rejected: error_id ${err_gap} == ERR_PERIOD_NOT_ADJACENT"
            - "Overlap rejected: error_id ${err_olap} == ERR_PERIOD_NOT_ADJACENT"
            - "Exact adjacency accepted: period ${per2} created with status ${per2_status} == OPEN"

  # ===========================================================================
  # Rule 9 — compensating_invariant (work-order CWIP vs program committed
  # budget — different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: charge_reversal_conserves_cwip
        grounds:
          - calculations.cwip_aggregation
          - state_machines.CostCharge.POSTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: WorkOrder.actual_direct_cents (and cwip_cents). Posting a
          30,000c charge and then reversing it restores the balance to exactly its pre-charge
          value 0 — the ORIGINAL row flips to REVERSED while its REVERSAL row carries
          -30,000c into the CURRENT open period, so the pair nets to zero with no drift.
        test_recipe:
          setup:
            - "CAPITAL work order authorized and started (estimate 500,000c); MATERIAL 0% overhead; period 2026-08 open; logical clock at the default 2026-08-01"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-INV1", fiscal_year: 2026, authorized_amount_cents: 100000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/overhead-schedules", payload: { cost_type: MATERIAL, order_type: CAPITAL, rate_pct: 0.0, effective_from: "2026-01-01" }, as: SystemAdmin, as_user_id: admin-1 }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 8, start_date: "2026-08-01", end_date: "2026-08-31" }, as: SystemAdmin, as_user_id: admin-1, captures: { per1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Invariant order", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_before: $.data.cwip_cents, direct_before: $.data.actual_direct_cents } }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 30000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg: $.data.id } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_mid: $.data.cwip_cents } }
          trigger:
            - { call: "POST /ucp/cost-charges/${chg}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { rev_total: $.data.total_cents, rev_kind: $.data.kind, rev_period: $.data.accounting_period_id, rev_link: $.data.reverses_charge_id } }
            - { call: "GET /ucp/cost-charges/${chg}", payload: {}, as: Auditor, captures: { orig_status: $.data.status } }
            - { call: "GET /ucp/work-orders/${wo}", payload: {}, as: Auditor, captures: { cwip_after: $.data.cwip_cents, direct_after: $.data.actual_direct_cents } }
          assert:
            - "Pre-charge balance ${cwip_before} == 0; after posting ${cwip_mid} == 30000"
            - "Reversal row: kind ${rev_kind} == REVERSAL, total ${rev_total} == -30000, reverses ${rev_link} == ${chg}, posted into current period ${rev_period} == ${per1}"
            - "Original charge status ${orig_status} == REVERSED"
            - "INVARIANT: actual_direct_cents ${direct_after} == ${direct_before} == 0 and cwip_cents ${cwip_after} == ${cwip_before} == 0 (no drift)"

      - name: authorize_cancel_conserves_committed_budget
        grounds:
          - calculations.program_budget_accounting
          - state_machines.WorkOrder.SUBMITTED_to_AUTHORIZED
          - state_machines.WorkOrder.AUTHORIZED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: CapitalProgram.committed_amount_cents (a different quantity than
          CWIP). Authorizing a 400,000c work order moves committed 0 -> 400,000 and cancelling
          it (no charges) returns committed to exactly 0 and available to the full 500,000c —
          the authorize/cancel pair leaves the program budget unchanged.
        test_recipe:
          setup:
            - "Program with 500,000c authorized; work order with approved 400,000c estimate, submitted"
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-INV2", fiscal_year: 2026, authorized_amount_cents: 500000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Budget invariant order", initial_estimated_cost_cents: 400000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Controller, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed_pre: $.data.committed_amount_cents, avail_pre: $.data.available_amount_cents } }
          trigger:
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed_mid: $.data.committed_amount_cents, avail_mid: $.data.available_amount_cents } }
            - { call: "POST /ucp/work-orders/${wo}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1, captures: { wo_status: $.data.status } }
            - { call: "GET /ucp/capital-programs/${prog}", payload: {}, as: Auditor, captures: { committed_post: $.data.committed_amount_cents, avail_post: $.data.available_amount_cents } }
          assert:
            - "Pre-authorize: committed ${committed_pre} == 0, available ${avail_pre} == 500000"
            - "Authorized: committed ${committed_mid} == 400000, available ${avail_mid} == 100000"
            - "Cancel from AUTHORIZED with zero CWIP needs no disposition and succeeds: status ${wo_status} == CANCELLED"
            - "INVARIANT: committed ${committed_post} == ${committed_pre} == 0 and available ${avail_post} == ${avail_pre} == 500000"
