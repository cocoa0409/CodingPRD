      - name: corner_parallel_claim_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines[Claim].state_field[adjustment_status]
          - state_machines[Claim].state_field[salvage_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: claim_parallel_adjustment_and_salvage_dimensions
          rationale: "That §1.8 instance already drives both Claim dimensions through the full independent-then-joined sequence (NOTIFIED/NONE -> RESERVED/TENDERED -> RESERVED/SOLD -> SETTLED/SOLD) and asserts the combined state plus the salvage credit at each hop. A separate corner test would replay the identical call sequence with weaker assertions."
      - name: corner_endorsement_negotiation_cycle_terminates
        claim_type: cyclic
        grounds:
          - state_machines[Endorsement].transitions[QUOTED->SUBMITTED]
          - entities.Endorsement.fields.quote_round
          - errors[ERR_QUOTE_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: endorsement_quote_referral_cycle_with_round_ceiling
          rationale: "That §1.8 instance walks the SUBMITTED -> QUOTED -> SUBMITTED back-edge to the MAX_QUOTE_ROUNDS ceiling, asserts quote_round at every hop, asserts the re-quote after a mid-cycle value change and asserts the 422 on the fourth round. The loop-termination corner is exactly what it tests."
      - name: corner_warranty_breach_cascades_down_to_claims
        claim_type: cascade_down
        grounds:
          - state_machines[AircraftSchedule].transitions[COMPLIANT->BREACHED].side_effects
          - state_machines[Claim].transitions[RESERVED->COVERAGE_REFERRED]
        excluded_because:
          difficulty_instance: warranty_breach_cascade_schedule_to_claim_to_outstanding_reserve
          rationale: "That §1.8 instance is the three-hop breach cascade (warranty_status -> coverage_status -> claim adjustment_status -> policy.outstanding_reserve_cents) and pins the retained reserve_cents alongside the dropped aggregate. A corner variant would assert a strict subset of the same hops."
      - name: corner_settlement_reconciles_the_policy_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines[Claim].transitions[RESERVED->SETTLED].side_effects
          - calculations.policy_written_premium
        excluded_because:
          difficulty_instance: settlement_cascade_claim_to_schedule_to_ledger_to_policy_totals
          rationale: "That §1.8 instance already reconciles paid_hull_cents, outstanding_reserve_cents and written_premium_cents against the SETTLEMENT_RETURN row before and after settlement, which is the whole ledger-sync claim."
      - name: corner_endorsement_void_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines[Endorsement].transitions[BOUND->VOID].side_effects
          - calculations.policy_written_premium
        excluded_because:
          difficulty_instance: endorsement_void_restores_policy_written_premium_exactly
          rationale: "That §1.8 instance is the compensating-invariant test for this exact edge: it asserts the exact negation in the ledger, the schedule returning to REMOVED, and written_premium_cents landing on its pre-bind value with no short-rate drift."
      - name: corner_hours_verification_adjusts_dependent_schedules
        claim_type: cross_entity
        grounds:
          - state_machines[AircraftSchedule].transitions[COMPLIANT->BREACHED]
          - endpoints[POST /aviation/pilots/{id}/hours-verifications]
        excluded_because:
          difficulty_instance: pilot_qualification_logged_hours_vs_verified_hours
          rationale: "That §1.8 instance drives the Pilot -> AircraftSchedule cross-entity side effect end to end: it asserts the verified-basis re-score, the warranty_basis switch, the re-rate and the resulting warranty_status on every schedule naming that pilot."
