        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_CASE_EMPLOYEE_MISMATCH]", "entities.WorkRestriction.fields.exposure_case_id"]
        distinguishing_aspect: "A restriction created for employee B carrying employee A's exposure_case_id fails ERR_CASE_EMPLOYEE_MISMATCH (422)."
        test_recipe:
          setup: ["Employees EA (with a MEDIUM case) and EB"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-V8A", full_name: "Case Owner", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_a: $.data.id }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-V8B", full_name: "Other Emp", job_category: "TECH", department: "LAB", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_b: $.data.id }
            - call: "POST /employee-health/employees/${emp_a}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_a: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_b}/work-restrictions"
              payload: { restriction_type: "MODIFIED_DUTY", start_date: "2026-08-02T00:00:00Z", exposure_case_id: "${case_a}" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_EMPLOYEE_MISMATCH (422); no WorkRestriction persisted for ${emp_b}"

      - name: contact_date_before_infectious_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CONTACT_DATE_OUT_OF_RANGE]", "calculations.contact_monitoring_window"]
        distinguishing_aspect: "contact_date 2026-07-01 precedes infectious_start 2026-07-30 (onset 2026-08-01 - 2 days for COVID) -> ERR_CONTACT_DATE_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["COVID event (onset 2026-08-01T00:00:00Z) in TRACING; contact employee exists; clock 2026-08-05T00:00:00Z"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-V9X", full_name: "Evt Idx", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { ix_id: $.data.id }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-V9C", full_name: "Early Contact", job_category: "TECH", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { ec_id: $.data.id }
            - call: "POST /employee-health/communicable-events"
              payload: { index_employee_id: "${ix_id}", disease: "COVID", onset_date: "2026-08-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /employee-health/communicable-events/${ev_id}/advance"
              payload: { to_state: "TRACING" }
              as: SafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /employee-health/communicable-events/${ev_id}/contacts"
              payload: { contact_employee_id: "${ec_id}", contact_date: "2026-07-01T00:00:00Z" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTACT_DATE_OUT_OF_RANGE (422); no contact persisted"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "Setting the logical clock to 2026-07-01 (before the 2026-08-01T00:00:00Z default) fails ERR_CLOCK_REGRESSION (422); the clock is monotonic."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLOCK_REGRESSION (422); subsequent reads still see 2026-08-01T00:00:00Z"

      - name: invalid_enum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_ENUM]", "entities.Employee.fields.job_category"]
        distinguishing_aspect: "job_category 'SUPER_NURSE' is not a declared enum member -> ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["Empty DB"]
