      - name: repeated_registration_decision_on_registered_proctor_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Proctor.PENDING_to_REGISTERED
          - validations[priority=12]
          - errors.ERR_PROCTOR_STATE_INVALID
        distinguishing_aspect: |
          The registration decision is a one-shot transition out of PENDING, not an idempotent upsert:
          replaying APPROVE on an already REGISTERED proctor returns ERR_PROCTOR_STATE_INVALID rather
          than a second 200, and replaying REJECT is refused for the same reason. The proctor's
          registration_status and version must be identical before and after the rejected replay.
