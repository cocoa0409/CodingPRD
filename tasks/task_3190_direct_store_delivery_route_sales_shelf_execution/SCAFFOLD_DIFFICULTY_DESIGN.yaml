          - state_machines.StaleCredit.PENDING_APPROVAL_to_REJECTED
          - entities.RouteSettlement.fields.chronological_expected_cents
        distinguishing_aspect: |
          Conserved quantity = ledger CENTS (different type from physical
          cases): chronological_expected_cents + credits_cents ==
          gross_delivered_cents must hold after every mutation, and a credit
          create-then-reject pair (forward action + compensating rejection)
          must leave credits_cents exactly unchanged.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store FULL_RETAIL cap 100000. Product P at 500 cents."
            - "Route day: lot A 90 cases exp 2026-09-20, lot B 10 cases exp 2026-09-06; started; orders 30 (15000) and 20 at 10% discount (9000) delivered; 5-case credit approved (2500); settlement opened."
            - "A second credit of 2 cases (1000) is PENDING_APPROVAL."
