        grounds:
          - response_envelope
        distinguishing_aspect: "limit/offset windowing over a filtered lot list: page 1 (limit 2 of 3) reports has_more true and total_count 3; offset 2 returns the final item with has_more false."
        test_recipe:
          setup: ["ACTIVE community; phase with 3 lots"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Page Place", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 5 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "P1" }
              as: DeclarantExecutive
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "P2" }
              as: DeclarantExecutive
            - call: "POST /mpc/lots"
              payload: { phase_id: "${p1_id}", parcel_number: "P3" }
              as: DeclarantExecutive
