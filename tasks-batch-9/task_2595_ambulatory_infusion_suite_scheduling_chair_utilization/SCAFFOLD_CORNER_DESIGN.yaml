  # ===========================================================================
  - section: calculations
    instances:

      - name: template_build_snapshot_adds_the_high_tier_surcharge_and_doubles_the_stagger_offset
        claim_type: correct_result
        grounds:
          - calculations.template_build
          - calculations.template_build.constants.HIGH_TIER_ACUITY_SURCHARGE
          - calculations.template_build.constants.HIGH_ACUITY_STAGGER_THRESHOLD
          - endpoints[POST /appointment-templates]
        distinguishing_aspect: |
          Three templates over two drugs pin both branches of the stagger rule at the
          threshold: with the center's stagger_grid_minutes at 20, a MID template on a
          2-point drug snapshots acuity 2 and offset 20; the HIGH template on the same
          drug snapshots acuity 3 (2 + the surcharge) and offset 20 because 3 is below
          the threshold of 4; the HIGH template on a 3-point drug snapshots acuity 4 and
          offset 40 because the threshold comparison is >=. The offset is the center's
          grid multiplied, never a hard-coded 15 or 30.
        test_recipe:
          setup:
            - "One center with stagger_grid_minutes 20 (so a doubled offset is 40, distinguishable from any constant)."
            - "Drug LOW-ACUITY with acuity_points 2 and drug HIGH-ACUITY with acuity_points 3; both share the timing profile 120/90/30/60/30."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 20, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr_low: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Rituximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 3, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr_high: $.data.id }
