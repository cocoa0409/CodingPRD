              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_ibr}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_bvd}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/health-tests/${ht_tri}/result"
              payload: { result: "NEGATIVE" }
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/sires/${c_id}/collection-clearance"
              payload: {}
              as: StaffVeterinarian
              as_user_id: "vet-1"
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${c_id}", facility_id: "${fac_id}", start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-01T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { bk_id: "$.data.id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/collection-bookings/${bk_id}/complete"
              payload: { volume_ml: 6.0, concentration_m_per_ml: 1200, motility_pct: 70.0 }
              as: FacilityManager
              as_user_id: "${fac_id}"
