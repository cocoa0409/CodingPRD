      - name: origin_pools_exclude_ornamentation_and_trim_nodes
        claim_type: correct_result
        grounds:
          - calculations.origin_country_determination
          - entities.MaterialInput.fields.is_ornamentation
          - entities.OriginDetermination.fields.graph_node_count
        distinguishing_aspect: "An ornamentation TRIM node in FR is excluded from graph_node_count and from BOTH pools, and TRIM's stage rank 0 keeps it out of the transformation pool even when non-ornamentation - so the transformation winner is CN on 6.00 of value while the yarn-forward winner is PK on 520 g, decided over completely different node sets."
        test_recipe:
          setup:
            - "Market US is registered; style NL-ORN-1 carries FIBER IN (2.00 / 500 g), YARN PK (3.00 / 520 g), FABRIC CN (6.00 / 950 g) and one ORNAMENTATION TRIM node in FR (4.00 / 30 g)."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-ORN-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "PK", value_added_usd: 3.00, weight_grams: 520.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FABRIC", country_code: "CN", value_added_usd: 6.00, weight_grams: 950.0, is_ornamentation: false, parent_input_id: "${n2_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "TRIM", country_code: "FR", value_added_usd: 4.00, weight_grams: 30.0, is_ornamentation: true }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { od_id: $.data.id, nodes: $.data.graph_node_count, st: $.data.st_country, yf: $.data.yf_country, div: $.data.divergent, det: $.data.determined_country }
            - call: "POST /labeling/origin-determinations/${od_id}/issue"
              payload: { method: "YARN_FORWARD" }
              as: ComplianceAdmin
              captures: { det_after: $.data.determined_country, method_after: $.data.method_pinned }
          assert:
            - "${nodes} == 3 - the ornamentation TRIM node is excluded from the count"
            - "${st} == \"CN\" (6.00 beats PK's 3.00; the FR trim's 4.00 never enters the transformation pool) and ${yf} == \"PK\" (520 g of yarn, no FIBER fallback needed)"
            - "${div} == true and ${det} == null while the determination is still DRAFT"
            - "${det_after} == \"PK\" and ${method_after} == \"YARN_FORWARD\""
            - "Style.origin_state == \"ORIGIN_ISSUED\" and GET /labeling/material-inputs?style_id=${style_id} returns total_count == 4 (the trim row is stored, merely not scored)"

      - name: origin_variants_diverge_on_one_supply_graph
        claim_type: variant_divergence
        grounds:
          - calculations.origin_country_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / origin_substantial_transformation_versus_yarn_forward_on_one_graph
          rationale: "The named §1.8 instance issues both variants over one identical five-node graph and asserts the two different determined_country values plus divergent == true."

      - name: penalty_basis_variant_is_selected_by_posture
        claim_type: variant_selection
        grounds:
          - calculations.marking_penalty_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / marking_penalty_ad_valorem_versus_statutory_per_unit_on_one_entry
          rationale: "Variant selection is exactly the subject of the named §1.8 instance: the basis is pinned by posture_at_review, not by taking the larger of the two computed figures."

      - name: mitigation_delta_is_reconciled_into_the_brand_ledger
        claim_type: reconciliation
        grounds:
          - calculations.penalty_mitigation
          - calculations.brand_penalty_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / full_prompt_correction_returns_the_penalty_ledger_to_its_pre_review_value
          rationale: "The named §1.8 instance asserts the ledger before the review, after the assessment and after the mitigation delta is applied."

      - name: fiber_tolerance_threshold_boundary
        claim_type: correct_result
        grounds:
          - calculations.fiber_tolerance_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / fiber_tolerance_comparison_is_inclusive_at_the_exact_market_tolerance
          rationale: "The threshold-algorithm boundary triple (below, exactly at, one tenth above the market tolerance) is asserted in full by the named §1.8 instance."

  - section: validations
    instances:
      - name: fiber_declaration_summing_to_one_hundred_point_one_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=78]
          - errors.ERR_FIBER_PERCENT_SUM
        distinguishing_aspect: "The sum is checked at exactly 100.0 after one-decimal rounding, so 60.0 + 37.1 + 3.0 = 100.1 is refused even though it is within a tenth - and nothing is persisted, so the brand's style list stays empty."
        test_recipe:
          setup:
            - "One brand exists and market US is registered."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-SUM-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.1, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and ${err} == \"ERR_FIBER_PERCENT_SUM\""
            - "GET /labeling/brands/${brand_id}/styles returns total_count == 0"

      - name: fiber_declaration_replacement_on_an_untested_style_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=78]
          - state_machines[entity=Style].transitions.FIBER_DECLARED_to_FIBER_DECLARED
          - concurrency_rules[fiber-declaration-replace-stale-style]
          - endpoints[PUT /labeling/styles/{id}/fiber-declaration]
        distinguishing_aspect: "A style created with no declaration accepts its first replacement when the OCC version matches: the declaration and the rendered text are replaced, the substantiation dimension STAYS at FIBER_DECLARED (the self edge fires rather than a move), and version advances 1 -> 2."
        test_recipe:
          setup:
            - "One brand owns style NL-BARE-1, created without declared_fibers, so it holds [] at version 1."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-BARE-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 300.0 }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id, sv1: $.data.version, text_before: $.data.effective_fiber_content_text }
          trigger:
            - call: "PUT /labeling/styles/${style_id}/fiber-declaration"
              payload: { declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }], expected_style_version: "${sv1}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sub_after: $.data.substantiation_state, text_after: $.data.effective_fiber_content_text, ver_after: $.data.version, readiness_after: $.data.label_readiness }
          assert:
            - "${sv1} == 1 and ${text_before} == \"\""
            - "HTTP 200, ${sub_after} == \"FIBER_DECLARED\" and ${ver_after} == 2"
            - "${text_after} == \"60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER\""
            - "${readiness_after} == \"BLOCKED\" (a declaration alone substantiates nothing)"
            - "GET /labeling/styles/${style_id}/lab-tests returns total_count == 0"

      - name: origin_determination_on_a_trim_only_graph_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=87]
          - errors.ERR_ORIGIN_GRAPH_INSUFFICIENT
          - calculations.origin_country_determination
        distinguishing_aspect: "A single non-ornamentation TRIM node satisfies neither pool - TRIM is outside {YARN, FABRIC, CUT_AND_SEW} for the transformation side and outside {YARN} with no FIBER to fall back on - so the determination is refused at priority 87 and the style's origin dimension must stay at ORIGIN_UNDETERMINED."
        test_recipe:
          setup:
            - "Market US is registered; style NL-TRIM-1 carries exactly one non-ornamentation TRIM node in FR."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-TRIM-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 300.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "TRIM", country_code: "FR", value_added_usd: 4.00, weight_grams: 30.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { err: $.data.error_id }
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { org_after: $.data.origin_state, ver_after: $.data.version }
          assert:
            - "HTTP 422 and ${err} == \"ERR_ORIGIN_GRAPH_INSUFFICIENT\""
            - "${org_after} == \"ORIGIN_UNDETERMINED\" and ${ver_after} == ${sv1} (no version bump on a refused create)"
            - "GET /labeling/styles/${style_id}/origin-determinations returns total_count == 0"

      - name: fiber_results_summing_below_the_coherence_band_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=88]
          - errors.ERR_LAB_RESULT_INCOHERENT
        distinguishing_aspect: "Measured percentages summing to 98.5 fall outside the closed [99.0, 101.0] band, so the result is refused before any tolerance comparison runs - the bench stays BENCH_RESERVED and the style stays FIBER_TEST_PENDING, so the lab can post a corrected result on the same row."
        test_recipe:
          setup:
            - "Market US is registered; style NL-4410 declares 60.0 COTTON / 37.0 POLYESTER / 3.0 ELASTANE and has a BENCH_RESERVED FIBER_CONTENT test."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z" }
              as: AccreditedLab
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 1.5 }] }
              as: AccreditedLab
              captures: { err: $.data.error_id }
            - call: "GET /labeling/lab-tests/${t1_id}"
              payload: {}
              as: AccreditedLab
              captures: { state_after: $.data.state, delta_after: $.data.result_delta_pp_max, measured_after: $.data.measured_fibers }
            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
              captures: { state_second: $.data.state, delta_second: $.data.result_delta_pp_max }
          assert:
            - "HTTP 422 and ${err} == \"ERR_LAB_RESULT_INCOHERENT\""
            - "${state_after} == \"BENCH_RESERVED\", ${delta_after} == null and ${measured_after} == null - the refused post writes nothing"
            - "Style.substantiation_state == \"FIBER_TEST_PENDING\" after the refusal"
            - "${state_second} == \"PASSED\" and ${delta_second} == 3.0 - the corrected post is accepted on the same row"

      - name: unknown_style_in_the_path_answers_before_a_malformed_body
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=35]
          - errors.ERR_STYLE_NOT_FOUND
        distinguishing_aspect: "The request violates priority 20 (unknown style in the path) AND priority 35 (stage GARMENT is not a declared enum member); the answer must be ERR_STYLE_NOT_FOUND at 404, because path existence outranks body shape."
        test_recipe:
          setup:
            - "One brand exists; no style has been created."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /labeling/styles/2f1a9b7c-0000-4000-8000-000000000000/material-inputs"
              payload: { stage: "GARMENT", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: ComplianceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == \"ERR_STYLE_NOT_FOUND\" (not ERR_INVALID_REQUEST)"

      - name: audit_window_that_ends_before_it_starts_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors.ERR_INVALID_EFFECTIVE_WINDOW
        distinguishing_aspect: "Priority 72 governs both the label publish window and the audit window: audit_window_to must be STRICTLY after audit_window_from, so a reversed pair is refused and no ComplianceAudit row is created."
        test_recipe:
          setup:
            - "One brand exists."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
