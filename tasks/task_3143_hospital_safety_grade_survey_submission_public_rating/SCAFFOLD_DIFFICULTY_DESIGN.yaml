              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/verify"
              payload: { verification_response: "ACCEPT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests"
              payload: { survey_id: "${sp0_id}", subset_selector: [{ measure_code: "o1" }], supporting_documents: [{ document_code: "HAND_HYGIENE", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "ICU_STAFFING", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "BARCODE_MED_ADMIN", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "SAFE_SURGERY_CHECKLIST", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "CAUTI_BUNDLE", issued_on: "2026-05-01T00:00:00Z" }, { document_code: "CLABSI_BUNDLE", issued_on: "2026-05-01T00:00:00Z" }] }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { rq0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests/${rq0_id}/decide"
              payload: { decision: "START_REVIEW" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/pending-methodology-changes"
              payload: { to_methodology_version_id: "${meth_mg_id}" }
              as: RatingAdmin
              captures: { chg0_id: $.data.id }
            - call: "POST /hospital-safety-rating/pending-methodology-changes/${chg0_id}/review"
              payload: { decision: "APPLY" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { chg0_status: $.data.status }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/reanalysis-requests/${rq0_id}/decide"
              payload: { decision: "GRANT" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { err_stale_ref: $.data.error_id }
          assert:
            - "PendingMethodologyChange.${chg0_id}.status == APPLIED, so the hospital is now pinned to M_MG"
            - "GET /hospital-safety-rating/reanalysis-requests/${rq0_id} reports reference_stale == true"
            - "the response status is 409 and err_stale_ref == ERR_REANALYSIS_REFERENCE_STALE"
            - "the survey's measured values are unchanged, so the refused GRANT had no side effect"
            - "the dependency is on a different entity: reverting the pin to M_B0 makes the same GRANT succeed"

      - name: preliminary_correction_requires_cycle_open_review
        grounds:
          - state_machines.Grade.SCORED_to_CORRECTED
          - state_machines.ReleaseCycle.OPEN_REVIEW_to_CORRECTION_CLOSED
          - state_machines.Employer.ACTIVE_to_ACTIVE
          - validations[priority=16]
          - errors.ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS
        distinguishing_aspect: |
          The correction's acceptance depends on the state of a DIFFERENT
          entity — the parent ReleaseCycle must still be OPEN_REVIEW — so
          CorrectionRequest→HospitalReview→ReleaseCycle is one entity pair and
          the gate is a cycle-state equality, a different pair from the
          ReanalysisRequest→Survey→Hospital pin dependency the first instance
          carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Cycle C_B0 is OPEN_REVIEW with a P0 grade; a correction is filed and left PENDING while the clock is advanced past the 2026-06-30T00:00:00Z window close."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
