scaffold_corner_design:
- section: entities
  instances:
  - name: smelter_create_missing_region_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Smelter.fields.region_code
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: region_code is source:input with no default; omitting it must fail with ERR_INVALID_REQUEST and
      no smelter is persisted.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (missing required field region_code)
  - name: potline_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Potline.fields.operating_status
    - entities.Potline.fields.curtailment_depth_pct
    distinguishing_aspect: 'Client-supplied operating_status/curtailment_depth_pct/id/version on create are ignored: the response
      shows the system-owned initial values OPERATING / 0 / server id / version 1.'
    test_recipe:
      setup:
      - Smelter with ACTIVE fixed contract covering the default clock.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      trigger:
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
          id: 00000000-1111-2222-3333-444444444444
          version: 99
          operating_status: SHUTDOWN
          curtailment_depth_pct: 100
        as: SmelterManager
        captures:
          pl: $.data.id
          st: $.data.operating_status
          dp: $.data.curtailment_depth_pct
          ver: $.data.version
      assert:
      - Potline created with operating_status == OPERATING, curtailment_depth_pct == 0, version == 1 regardless of any client-sent
        lifecycle fields
  - name: price_observation_has_no_version_field
    claim_type: immutability
    grounds:
    - entities.PriceObservation
    distinguishing_aspect: PriceObservation is common_fields:false — its create response carries id and created_at but no
      updated_at and no version, and no update endpoint exists.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINUM_LME
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 2400.0
        as: TradingAnalyst
        captures:
          ob: $.data.id
      assert:
      - response data has id and created_at but no version and no updated_at (append-only event entity)
  - name: smelter_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: GET on a well-formed but nonexistent smelter id returns ERR_NOT_FOUND with HTTP 404.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /smelter-ops/smelters/00000000-0000-0000-0000-000000000000
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND
  - name: potline_create_without_active_contract_rejected
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=22]
    - errors[ERR_NO_ACTIVE_POWER_CONTRACT]
    distinguishing_aspect: The smelter exists and the request is well-formed, but its only contract is still DRAFT — creation
      fails on the referential rule, not on shape.
    test_recipe:
      setup:
      - Smelter exists; one PowerContract created but never activated.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
      trigger:
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NO_ACTIVE_POWER_CONTRACT (no ACTIVE contract window covers the default clock 2026-09-01T00:00:00Z)
  - name: hedge_delivery_month_in_past_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.HedgePosition.fields.delivery_month
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: delivery_month 2026-08 precedes the month of the default clock (2026-09) — rejected at the temporal
      request-shape rule.
    test_recipe:
      setup:
      - Smelter exists.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      trigger:
      - call: POST /smelter-ops/hedge-positions
        payload:
          smelter_id: ${sm}
          instrument: LME_SWAP
          volume_tonnes: 1000
          strike_price_usd: 2400.0
          delivery_month: 2026-08
        as: TradingAnalyst
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (delivery_month in the past)
- section: state_machines
  instances:
  - name: potline_curtail_from_idle_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Potline
    - errors[ERR_POTLINE_INVALID_STATE]
    distinguishing_aspect: From IDLE the only declared outgoing transitions are to SHUTDOWN and RESTARTING; curtail (any depth)
      is rejected.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract; potline idled via curtail 100.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
      - call: POST /smelter-ops/potlines/${pl}/curtail
        payload:
          depth_pct: 100
        as: SmelterManager
      trigger:
      - call: POST /smelter-ops/potlines/${pl}/curtail
        payload:
          depth_pct: 50
        as: SmelterManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_POTLINE_INVALID_STATE and potline remains IDLE with curtailment_depth_pct == 100
  - name: potline_shutdown_from_operating_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Potline.IDLE_to_SHUTDOWN
    - errors[ERR_POTLINE_INVALID_STATE]
    distinguishing_aspect: SHUTDOWN is reachable only from IDLE (and only with an EXECUTED depth-100 decision); from OPERATING
      it is rejected even though shutdown is semantically 'deeper'.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract; potline OPERATING.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
      trigger:
      - call: POST /smelter-ops/potlines/${pl}/shutdown
        payload: {}
        as: SmelterManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_POTLINE_INVALID_STATE and potline remains OPERATING
  - name: decision_execute_from_economic_review_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.CurtailmentDecision
    - errors[ERR_DECISION_INVALID_STATE]
    distinguishing_aspect: Execute is declared only from APPROVED; calling it on a fresh ECONOMIC_REVIEW decision is rejected
      even though every economic gate would pass.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract, potline 500 tpd, price set, decision created (ECONOMIC_REVIEW).
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
          pv: $.data.version
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINUM_LME
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 2400.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: REGIONAL_PREMIUM
          region_code: NA_NORTHWEST
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 380.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINA_INDEX
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 340.0
        as: TradingAnalyst
      - call: POST /smelter-ops/curtailment-decisions
        payload:
          potline_id: ${pl}
          expected_potline_version: ${pv}
          trigger_type: METAL_PRICE
          depth_pct: 50
          planned_start: '2026-09-05T00:00:00Z'
          planned_end: '2026-10-05T00:00:00Z'
        as: SmelterManager
        as_user_id: mgr-1
        captures:
          dec: $.data.id
      trigger:
      - call: POST /smelter-ops/curtailment-decisions/${dec}/execute
        payload: {}
        as: SmelterManager
        as_user_id: mgr-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DECISION_INVALID_STATE; decision remains ECONOMIC_REVIEW; potline remains OPERATING
  - name: decision_reverse_after_reversed_rejected
    claim_type: terminal_lockdown
    grounds:
    - state_machines.CurtailmentDecision.EXECUTED_to_REVERSED
    - errors[ERR_DECISION_INVALID_STATE]
    distinguishing_aspect: 'REVERSED is terminal: a second reverse (and any other action) on a REVERSED decision is rejected;
      no side effects fire twice.'
    test_recipe:
      setup:
      - Full execute chain (labor notice 0, hedge 20000t, price set) completed; decision already REVERSED via one reverse
        call.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
          pv: $.data.version
      - call: POST /smelter-ops/labor-agreements
        payload:
          smelter_id: ${sm}
          union_name: USW-2026
          notice_period_days: 0
          severance_weeks_per_year: 1.5
        as: PlatformAdmin
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINUM_LME
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 2400.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: REGIONAL_PREMIUM
          region_code: NA_NORTHWEST
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 380.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: ALUMINA_INDEX
          region_code: GLOBAL
          observed_at: '2026-08-15T00:00:00Z'
          price_usd: 340.0
        as: TradingAnalyst
      - call: POST /smelter-ops/price-observations
        payload:
          instrument: POWER_SPOT
          region_code: NA_NORTHWEST
          observed_at: '2026-08-20T00:00:00Z'
          price_usd: 48.0
        as: EnergyManager
      - call: POST /smelter-ops/hedge-positions
        payload:
          smelter_id: ${sm}
          instrument: LME_SWAP
          volume_tonnes: 20000
          strike_price_usd: 2400.0
          delivery_month: 2026-09
        as: TradingAnalyst
      - call: POST /smelter-ops/curtailment-decisions
        payload:
          potline_id: ${pl}
          expected_potline_version: ${pv}
          trigger_type: METAL_PRICE
          depth_pct: 50
          planned_start: '2026-09-05T00:00:00Z'
          planned_end: '2026-10-05T00:00:00Z'
        as: SmelterManager
        as_user_id: mgr-1
        captures:
          dec: $.data.id
      - call: POST /smelter-ops/curtailment-decisions/${dec}/economic-approve
        payload: {}
        as: Controller
        as_user_id: ctrl-1
      - call: POST /smelter-ops/curtailment-decisions/${dec}/labor-approve
        payload: {}
        as: VPOperations
        as_user_id: vp-1
      - call: POST /smelter-ops/curtailment-decisions/${dec}/execute
        payload: {}
        as: SmelterManager
        as_user_id: mgr-1
      - call: POST /smelter-ops/curtailment-decisions/${dec}/reverse
        payload: {}
        as: SmelterManager
        as_user_id: mgr-1
      trigger:
      - call: POST /smelter-ops/curtailment-decisions/${dec}/reverse
        payload: {}
        as: SmelterManager
        as_user_id: mgr-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_DECISION_INVALID_STATE (REVERSED is terminal)
      - potline remains OPERATING and smelter curtailed_capacity_tpd remains 0 (no double compensation)
  - name: restart_complete_from_planned_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.RestartPlan.IN_PROGRESS_to_COMPLETED
    - errors[ERR_RESTART_PLAN_INVALID_STATE]
    distinguishing_aspect: Complete is declared only from IN_PROGRESS; completing a PLANNED plan is rejected and no cost reconciliation
      runs.
    test_recipe:
      setup:
      - Smelter with ACTIVE contract; potline idled; PLANNED restart plan (never started).
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/power-contracts
        payload:
          smelter_id: ${sm}
          supplier_name: Bonneville
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-01-01T00:00:00Z'
          components:
          - component_type: FIXED
            volume_mw: 150
            fixed_price_per_mwh: 32.0
        as: EnergyManager
        captures:
          pc: $.data.id
      - call: POST /smelter-ops/power-contracts/${pc}/activate
        payload: {}
        as: EnergyManager
      - call: POST /smelter-ops/potlines
        payload:
          smelter_id: ${sm}
          line_code: P1
          capacity_tpd: 500
          amperage_ka: 320
        as: SmelterManager
        captures:
          pl: $.data.id
      - call: POST /smelter-ops/potlines/${pl}/curtail
        payload:
          depth_pct: 100
        as: SmelterManager
      - call: POST /smelter-ops/restart-plans
        payload:
          potline_id: ${pl}
          planned_restart_at: '2026-09-05T00:00:00Z'
        as: SmelterManager
        captures:
          rp: $.data.id
      trigger:
      - call: POST /smelter-ops/restart-plans/${rp}/complete
        payload: {}
        as: SmelterManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_RESTART_PLAN_INVALID_STATE; plan remains PLANNED with actual_cost_usd == null; potline remains IDLE
  - name: permit_double_suspend_rejected
    claim_type: idempotency
    grounds:
    - state_machines.EnvironmentalPermit.ACTIVE_to_SUSPENDED
    - errors[ERR_INVALID_LIFECYCLE_STATE]
    distinguishing_aspect: Suspending an already-SUSPENDED (terminal) permit is rejected; the permit's version does not advance.
    test_recipe:
      setup:
      - Smelter with an ACTIVE SPL_DISPOSAL permit.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/environmental-permits
        payload:
          smelter_id: ${sm}
          permit_type: SPL_DISPOSAL
          valid_from: '2026-01-01T00:00:00Z'
          valid_to: '2027-06-01T00:00:00Z'
        as: EHSManager
        captures:
          perm: $.data.id
          perm_v: $.data.version
      - call: POST /smelter-ops/environmental-permits/${perm}/suspend
        payload: {}
        as: EHSManager
      trigger:
      - call: POST /smelter-ops/environmental-permits/${perm}/suspend
        payload: {}
        as: EHSManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_LIFECYCLE_STATE; permit version remains 2 (single increment from the first suspend)
  - name: hedge_double_close_rejected
    claim_type: idempotency
    grounds:
    - state_machines.HedgePosition.OPEN_to_CLOSED
    - errors[ERR_INVALID_LIFECYCLE_STATE]
    distinguishing_aspect: Closing a CLOSED hedge is rejected; realized_pnl_usd is not recomputed or duplicated.
    test_recipe:
      setup:
      - Smelter with one hedge opened then closed at 2500.00.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
      - call: POST /smelter-ops/hedge-positions
        payload:
          smelter_id: ${sm}
          instrument: LME_SWAP
          volume_tonnes: 5000
          strike_price_usd: 2400.0
          delivery_month: 2026-10
        as: TradingAnalyst
        captures:
          h1: $.data.id
      - call: POST /smelter-ops/hedge-positions/${h1}/close
        payload:
          closed_price_usd: 2500.0
        as: TradingAnalyst
      trigger:
      - call: POST /smelter-ops/hedge-positions/${h1}/close
        payload:
          closed_price_usd: 2600.0
        as: TradingAnalyst
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_LIFECYCLE_STATE
      - HedgePosition.${h1}.realized_pnl_usd remains 500000.00 ((2500-2400)*5000), closed_price_usd remains 2500.00
  - name: contract_activate_twice_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.PowerContract.DRAFT_to_ACTIVE
    - errors[ERR_INVALID_LIFECYCLE_STATE]
    distinguishing_aspect: Activate is declared only from DRAFT; re-activating an ACTIVE contract is rejected even though
      the desired end-state already holds.
    test_recipe:
      setup:
      - Smelter with one ACTIVE contract.
      setup_api_calls:
      - call: POST /smelter-ops/smelters
        payload:
          name: Riverbend
          region_code: NA_NORTHWEST
          rated_capacity_tpd: 1000
          labor_headcount: 450
        as: PlatformAdmin
        captures:
          sm: $.data.id
