            - call: "POST /inns/${inn_id}/bookings/${bk_a}/redeem-gift"
              payload: { gift_certificate_id: "${gc_a}", amount_cents: 10000, expected_gift_certificate_version: "${gc_a_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_a}"
              as: Innkeeper
              captures: { room_a_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_a}/confirm"
              payload: { expected_room_version: "${room_a_v}" }
              as: Innkeeper
            # booking B (room_b)
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_b}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-15", checkout_date: "2026-06-17", guest_count: 1 }
              as: Innkeeper
              captures: { bk_b: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 10000 }
              as: FinanceManager
              captures: { gc_b: $.data.id, gc_b_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_b}/redeem-gift"
              payload: { gift_certificate_id: "${gc_b}", amount_cents: 10000, expected_gift_certificate_version: "${gc_b_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_b}"
              as: Innkeeper
              captures: { room_b_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_b}/confirm"
              payload: { expected_room_version: "${room_b_v}" }
              as: Innkeeper
          trigger:
            # exactly 14 days before 06-15 is 06-01 -> full refund
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_a}/cancel"
              payload: {}
              as: Innkeeper
              captures: { refund_a: $.data.refund_cents }
            # 13 days before 06-15 is 06-02 -> half refund
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_b}/cancel"
              payload: {}
              as: Innkeeper
              captures: { refund_b: $.data.refund_cents }
          assert:
            - "Booking.${bk_a}.refund_cents == 10000"   # exactly 14 days -> 100%
            - "Booking.${bk_b}.refund_cents == 5000"    # 13 days -> 50%

      - name: half_open_interval_zero_gap_back_to_back_allowed
        grounds:
          - validations[priority=70]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - state_machines.Booking.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Half-open [checkin, checkout): a second booking starting on the exact checkout night
