      - name: residual_payee_empty_set_leaves_null_and_finalize_still_succeeds
        claim_type: correct_result
        grounds:
          - calculations.residual_payee_selection
          - calculations.pool_attribution
          - entities.RoyaltyPool.fields.rounding_residual_cents
        distinguishing_aspect: |
          Two unmatched lines split 70001 cents by FLOOR into 52500 + 17500 = 70000, leaving a
          1-cent residual that nobody can be elected to receive: with no APPROVED registration the
          candidate set is empty, residual_payee_holder_id stays null, and finalize must still
          succeed with the orphan cent retained on the pool rather than silently dropped or
          force-assigned.
        test_recipe:
          setup:
            - "GB/INDIVIDUAL schedule EFFECTIVE at revenue_share_bps 7000 / min 500 / floor 100 / mechanical 4000 / performance 6000 over 2026-01-01..2026-12-31."
            - "Period 2026-06 with one sealed batch carrying two GB/INDIVIDUAL lines of 150000 and 50000 plays whose titles match no work at all."
            - "A pool with subscriber_count 100 and gross_revenue_cents 100001."
          setup_api_calls:
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
