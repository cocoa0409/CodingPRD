  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: money_conserved_approve_then_cancel
        grounds:
          - state_machines.ServiceAuthorization.REQUESTED_to_APPROVED
          - state_machines.ServiceAuthorization.APPROVED_to_CANCELLED
          - calculations.case_fund_ledger
          - entities.Case.fields.budget_allocated_cents
        distinguishing_aspect: |
          Conserved quantity = dollars: budget_allocated_cents (1,000,000) == funds_available + funds_committed
          + funds_paid before and after. Approve commits agency 360000; cancel releases it; available returns
          to 1,000,000, committed 0, paid 0.
        test_recipe:
          setup:
            - "Case SERVICES_ACTIVE budget 1,000,000, income 300000 (tier 0.10). Authorization authorized 500000 comparable 100000 -> agency 360000, APPROVED."
          setup_api_calls:
            - call: "POST /vr/counselors"
              payload: { name: "C1", email: "c1@vr.gov", unit: "U1" }
              as: VRAdmin
              captures: { counselor_id: $.data.id }
            - call: "POST /vr/supervisors"
              payload: { name: "S1", email: "s1@vr.gov" }
              as: VRAdmin
              captures: { supervisor_id: $.data.id }
            - call: "POST /vr/providers"
              payload: { name: "P1", service_categories: ["TRAINING"], max_concurrent_authorizations: 5 }
