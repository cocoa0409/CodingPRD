      - name: measures_update_touches_only_supplied_fields_and_never_recomputes_a_determination
        claim_type: Action endpoint
        grounds: ["endpoints[POST /students/{student_id}/measures]", "endpoints[POST /placement-determinations]", calculations.placement_base_confidence_score]
        distinguishing_aspect: |
          Recording a better GPA does NOT re-place the student: the existing
          determination keeps its course, its confidence and its version, and only a
          NEW determination reflects the new measure — at which point the old row is
          superseded with superseded_by_id back-filled. Unsupplied measure fields are
          left alone rather than nulled, and the version bump is visible on the Student
          row itself.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 (level_rank 50) and MATH-100 (level_rank 100)."
            - "Two ACTIVE rules on disjoint GPA bands: RA TRANSCRIPT_GPA -> MATH-050 with min_hs_gpa 2.0 and max_hs_gpa 3.0, RB TRANSCRIPT_GPA -> MATH-100 with min_hs_gpa 3.0 and no upper bound."
            - "Student SM1 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z, el_status NOT_EL, no self_guided_pathway) with one determination."
          setup_api_calls:
            - call: "POST /courses"
