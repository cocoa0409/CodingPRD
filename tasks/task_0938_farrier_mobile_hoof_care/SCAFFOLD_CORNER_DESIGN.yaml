      - name: corner_occ_service_line_add_with_a_stale_appointment_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[add-service-line-stale-appointment]", "validations[priority=25]", "errors[ERR_STALE_APPOINTMENT_VERSION]"]
        distinguishing_aspect: "Adding a second batch of lines with the version captured before the first batch is rejected 412 ERR_STALE_APPOINTMENT_VERSION; the appointment keeps exactly the one line already written."
