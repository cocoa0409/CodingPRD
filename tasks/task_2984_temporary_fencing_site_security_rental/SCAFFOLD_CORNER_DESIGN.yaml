  # ---------------------------------------------------------------------------
  # Error-catalog coverage audit (all 41 §1.6 codes must be reachable).
  # Triggered by the §1.9 instances above:
  #   ERR_VALIDATION, ERR_MUNICIPALITY_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND,
  #   ERR_JOBSITE_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_CREW_NOT_FOUND,
  #   ERR_CONTRACT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_STALE_VERSION,
  #   ERR_QUOTE_STATE, ERR_CONTRACT_STATE, ERR_WORK_ORDER_STATE,
  #   ERR_RECONCILIATION_STATE, ERR_WIND_LOAD_NOT_PERMITTED,
  #   ERR_PERMIT_LEAD_TIME_NOT_MET, ERR_PERMIT_WINDOW_ELAPSED,
  #   ERR_CREW_CAPACITY_EXCEEDED, ERR_INVALID_PHASE_MOVE,
  #   ERR_BELOW_MINIMUM_TERM, ERR_PAYMENT_EXCEEDS_BALANCE.
  # Triggered by §1.8:
  #   ERR_PERMIT_NOT_APPROVED, ERR_CREW_NOT_CERTIFIED,
  #   ERR_CREW_WINDOW_CONFLICT, ERR_CLOSURE_CAPACITY_EXCEEDED,
  #   ERR_PERMIT_REVISION_LIMIT, ERR_ACCOUNT_CREDIT_HOLD.
  # Triggered by this errors section:
  #   ERR_QUOTE_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_INVOICE_NOT_FOUND,
  #   ERR_RECONCILIATION_NOT_FOUND, ERR_DUPLICATE_CODE,
  #   ERR_INVALID_ADDON_CATEGORY, ERR_INSUFFICIENT_FLEET,
  #   ERR_PANEL_COUNT_MISMATCH, ERR_INVOICE_STATE, ERR_PERMIT_STATE,
  #   ERR_BILLING_PERIOD_INVALID.
  # Triggered by the rbac section below:
  #   ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ACCOUNT_SCOPE_VIOLATION,
  #   ERR_SEGREGATION_OF_DUTIES.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: unknown_quote_permit_invoice_and_reconciliation_ids_not_found
        claim_type: triggerability
        grounds:
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_PERMIT_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - errors.ERR_RECONCILIATION_NOT_FOUND
          - validations.priority_4_ERR_QUOTE_NOT_FOUND
        distinguishing_aspect: |
          Each path parameter reports its own entity's 404 code rather than a
          generic one, and the four remaining NOT_FOUND codes in the catalog are
          reached by reading the same well-formed UUID on four different
          collections while an unrelated quote, permit, invoice and
          reconciliation all exist in the database.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Empty database apart from the clock: no quote, permit, invoice or reconciliation carries the probed id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fence-rentals/quotes/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/permits/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: MunicipalLiaison
              as_user_id: "ml-001"
            - call: "GET /fence-rentals/invoices/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "GET /fence-rentals/reconciliations/00000000-0000-4000-8000-0000000000a1"
              payload: {}
              as: YardAuditor
              as_user_id: "ya-001"
          assert:
            - "First trigger: HTTP 404 with data.error_id == \"ERR_QUOTE_NOT_FOUND\""
            - "Second trigger: HTTP 404 with data.error_id == \"ERR_PERMIT_NOT_FOUND\""
            - "Third trigger: HTTP 404 with data.error_id == \"ERR_INVOICE_NOT_FOUND\""
            - "Fourth trigger: HTTP 404 with data.error_id == \"ERR_RECONCILIATION_NOT_FOUND\""
            - "Every response carries response_type == \"error\" and the { meta, response_type, data } envelope"

      - name: duplicate_codes_and_miscategorised_products_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_INVALID_ADDON_CATEGORY
          - validations.priority_20_ERR_DUPLICATE_CODE
          - validations.priority_21_ERR_INVALID_ADDON_CATEGORY
        distinguishing_aspect: |
          Registry uniqueness and product-category integrity are separate codes
          reached from separate endpoints: a repeated jurisdiction_code and a
          repeated product code both return 409 ERR_DUPLICATE_CODE, while a quote
          that names GATE-12 as its panel product and PANEL-CL-10 as an add-on
          line returns 409 ERR_INVALID_ADDON_CATEGORY in both directions of the
          swap.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Municipality HRB-01, account A, products PANEL-CL-10 (FENCE_PANEL) and GATE-12 (GATE), jobsite J1 (SOIL)."
