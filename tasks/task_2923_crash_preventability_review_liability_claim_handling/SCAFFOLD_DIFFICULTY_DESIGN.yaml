  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: review_case_appeal_cycle_returns_to_deliberation
        grounds:
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - state_machines.ReviewCase.DECIDED_to_DELIBERATION
          - state_machines.ReviewCase.DELIBERATION_to_CLOSED_FINAL
          - state_machines.Crash.PREVENTABLE_to_UNDER_REVIEW
          - entities.ReviewCase.fields.appeal_round
          - entities.Crash.fields.appeals_exhausted
          - validations[priority=21]
          - validations[priority=25]
        distinguishing_aspect: |
          The cyclic machine here belongs to the ReviewCase entity: DECIDED
          returns to DELIBERATION on appeal, and the loop terminates by a
          counter, not by a different trigger — the second POST decide takes the
          DELIBERATION -> CLOSED_FINAL branch instead of DELIBERATION -> DECIDED
          purely because appeal_round has reached APPEAL_MAX_ROUNDS 1, and the
          extra side effect on that branch (Crash.appeals_exhausted = true) is
          what makes a third appeal impossible.
        test_recipe:
          setup:
            - "One Terminal, one Driver, one SEVERE crash on 2026-07-30T14:00:00Z with mechanical_factor true."
            - "All three SEVERE-required evidence kinds PRESERVED, so Crash.evidence_posture is COMPLETE."
            - "One ReviewCase already DECIDED by sm-001 with determination PREVENTABLE, decision_basis UNWEIGHTED_MAJORITY, committee_score 2.67 and appeal_round 0, on three non-superseded ballots scoring 4.00 PREVENTABLE, 3.00 PREVENTABLE and 1.00 NON_PREVENTABLE."
            - "Clock left at 2026-08-01T00:00:00Z, well inside the 14-day appeal window."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Elkhart Terminal", terminal_code: "ELK01", region_code: "IN", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-5001", full_name: "Sal Ibarra", cdl_number: "IN-CDL-5001", hire_date: "2015-04-13" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:10:00Z", location_text: "I-80/90 MM 92 eastbound", severity: "SEVERE", route_class: "LINEHAUL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: true, third_party_at_fault: false }
