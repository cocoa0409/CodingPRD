      - name: hra_close_year_denies_open_claims_then_forfeits_balance
        claim_type: Cross-entity
        grounds:
          - state_machines.HraAccount.OPEN_to_CLOSED
          - calculations.hra_year_end_forfeiture
          - calculations.hra_ledger_conservation
          - errors.ERR_HRA_ACCOUNT_NOT_OPEN
        distinguishing_aspect: |
          close-year is ordered: the claim cascade runs FIRST, returning the
          40000-cent hold to available_balance_cents, and only then does
          forfeiture cap the balance. Order is observable - forfeiting before
          releasing would cap 82206 to 61103 and leave a 40000 hold that
          violates conservation, whereas the pinned order caps 122206 to 61103
          and forfeits 61103. The carryover cap is a fraction of this year's
          annual_credit_cents 122206, and a follow-up claim must then be refused
          with ERR_HRA_ACCOUNT_NOT_OPEN.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN with carryover_cap_pct 0.5 and hra_credit_medicare_cents 209500."
            - "Retiree R2 (MEDICARE_ENROLLED) CERTIFIED ELIGIBLE for 2027."
            - "HraAccount for (R2, 2027) with covered_months 7: annual_credit_cents 122206, funded_cents 122206."
            - "One SUBMITTED ReimbursementClaim of QUALIFIED_MEDICAL 40000 holding 40000, so available_balance_cents is 82206 and pending_hold_cents is 40000."
            - "Logical clock at 2027-12-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
