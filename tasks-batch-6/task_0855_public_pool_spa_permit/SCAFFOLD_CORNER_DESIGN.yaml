              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T01:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 0.2, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}" }
