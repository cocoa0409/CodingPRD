            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_nj_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v2}" }, as: NexusAnalyst, captures: { reg_nj: $.data.id } }
