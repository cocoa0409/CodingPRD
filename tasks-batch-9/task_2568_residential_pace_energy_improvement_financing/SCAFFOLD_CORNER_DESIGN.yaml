      - name: duplicate_active_application_blocked_until_first_one_is_declined
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=38]
          - validations[priority=10]
          - errors[ERR_DUPLICATE_ACTIVE_APPLICATION]
        distinguishing_aspect: |
          Priority 38's exempt set is exactly {DECLINED, WITHDRAWN, ASSESSED}: a DRAFT sibling blocks a
          second application with 409, but the very same request succeeds the moment the sibling is
          DECLINED, and then supersedes_application_id may point at it. This pins that the rule keys on
          the sibling's status rather than on its existence, and that a DECLINED parcel is not
          permanently locked out of the program.
        test_recipe:
          setup:
            - "Clock 2026-08-12; parcel P1 (assessed 40000000, free and clear) with an enrolled contractor and one ACTIVE solar product."
            - "Application A1 is created and left in DRAFT, then submitted and DECLINED with decline_reason_code CLTV_LIMIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
