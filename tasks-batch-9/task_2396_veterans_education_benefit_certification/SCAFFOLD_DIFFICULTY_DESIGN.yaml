scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: covered_tuition_as_certified_vs_as_reconciled_money_divergence
        grounds:
          - calculations.covered_tuition_and_yellow_ribbon
          - calculations.mha_term_total
          - entities.EnrollmentCertification.fields.amount_basis
          - entities.EnrollmentCertification.fields.net_covered_cents
          - state_machines.EnrollmentChangeReport.REPORTED_to_RECONCILED
        distinguishing_aspect: |
          This instance pins the MONEY variant pair: on identical stored inputs the
          AS_CERTIFIED variant of covered_tuition_and_yellow_ribbon prices the whole
          assessed term (net_covered_cents == 2950000, va_tuition_cents == 2790000)
          while the AS_RECONCILED variant substitutes the prorated step S1' for an
          unmitigated COMPLETE_WITHDRAWAL and yields net_covered_cents == 214545 and
          va_tuition_cents == 214545 — a 2575455-cent divergence produced by variant
          selection alone, with no change to gross_tuition_cents or credit hours.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One SCO official and one SUPERVISORY official are ACTIVE."
            - "Program BSN-UG: full_time_credit_hours 12, campus_bah_monthly_cents 213700, APPROVED against catalog version 2026-07-01..2027-07-01."
            - "Term FA2026 2026-08-24..2026-12-11, certification_deadline 2026-09-30, academic_year 2026-2027, status OPEN."
            - "Student V-1001: CH33, benefit_level_pct 100, entitlement_days_granted 1080, delimiting_date 2030-06-30, COE VERIFIED on 2026-08-01."
            - "Certification cert1 for 12 residential credits over the full term is CERTIFIED on the AS_CERTIFIED basis: net_covered_cents 2950000, va_tuition_cents 2790000, mha_term_total_cents 776444, entitlement_days_charged 110; student entitlement_days_remaining 970."
            - "VA has disbursed 2790000 tuition and 776444 housing, so tuition_payment_posted_on is set and the student is no longer protected."
            - "Clock advanced to 2026-09-05; an unmitigated COMPLETE_WITHDRAWAL effective 2026-09-01 is REPORTED (days_late 4, TIMELY, STUDENT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VaProcessingOffice
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /programs"
              payload: { program_code: "BSN-UG", name: "Nursing BS", degree_level: "UNDERGRAD", full_time_credit_hours: 12, campus_bah_monthly_cents: 213700 }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { prog1: $.data.id }
            - call: "POST /catalog-versions"
              payload: { program_id: "${prog1}", catalog_year: "2026-2027", effective_start: "2026-07-01", effective_end: "2027-07-01", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { cat1: $.data.id }
            - call: "POST /catalog-versions/${cat1}/submit-to-saa"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "POST /catalog-versions/${cat1}/saa-decision"
              payload: { decision: "APPROVED" }
              as: StateApprovingAgent
            - call: "POST /academic-terms"
              payload: { term_code: "FA2026", academic_year: "2026-2027", term_type: "FALL", start_date: "2026-08-24", end_date: "2026-12-11", drop_deadline: "2026-09-04", certification_deadline: "2026-09-30" }
              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { term1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
            - call: "POST /veteran-students/${stu1}/verify-coe"
              payload: { coe_issued_on: "2026-07-15", verified_document_reference: "COE-2026-77120" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
            - call: "POST /enrollment-certifications"
              payload: { student_id: "${stu1}", term_id: "${term1}", program_id: "${prog1}", credit_hours_total: 12, credit_hours_online: 0, term_start_certified: "2026-08-24", term_end_certified: "2026-12-11" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { cert1: $.data.id, cert1_v: $.data.version }
            - call: "POST /tuition-fee-reports"
              payload: { certification_id: "${cert1}", gross_tuition_cents: 3000000, mandatory_fees_cents: 150000, tuition_specific_aid_cents: 200000, non_tuition_aid_cents: 0, expected_certification_version: "${cert1_v}" }
              as: BursarOfficer
            - call: "POST /enrollment-certifications/${cert1}/submit"
              payload: {}
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
            - call: "POST /enrollment-certifications/${cert1}/certify"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
            - call: "POST /enrollment-certifications/${cert1}/record-va-payment"
              payload: { tuition_amount_cents: 2790000, mha_amount_cents: 776444, posted_on: "2026-08-01" }
              as: VaProcessingOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: VaProcessingOffice
            - call: "POST /enrollment-change-reports"
              payload: { certification_id: "${cert1}", change_type: "COMPLETE_WITHDRAWAL", effective_date: "2026-09-01", mitigating_circumstances_flag: false }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { chg1: $.data.id }
          trigger:
            - call: "POST /enrollment-change-reports/${chg1}/reconcile"
              payload: {}
              as: SupervisorySCO
              as_user_id: "${sup1}"
          assert:
            - "Before the trigger EnrollmentCertification.${cert1}.amount_basis == AS_CERTIFIED with net_covered_cents == 2950000 and va_tuition_cents == 2790000"
            - "EnrollmentCertification.${cert1}.amount_basis == AS_RECONCILED"
            - "EnrollmentCertification.${cert1}.net_covered_cents == 214545"
            - "EnrollmentCertification.${cert1}.va_tuition_cents == 214545"
            - "EnrollmentCertification.${cert1}.cap_charged_cents == 214545"
            - "EnrollmentCertification.${cert1}.yr_gap_cents == 0"
            - "EnrollmentCertification.${cert1}.mha_term_total_cents == 56987"
            - "EnrollmentCertification.${cert1}.status == TERMINATED"
            - "BenefitDebt[change_report_id == ${chg1}].tuition_component_cents == 2575455"
            - "BenefitDebt[change_report_id == ${chg1}].mha_component_cents == 719457"
            - "BenefitDebt[change_report_id == ${chg1}].principal_cents == 3294912"
            - "The TuitionFeeReport for ${cert1} is untouched by reconciliation: gross_tuition_cents == 3000000 and status == REPORTED"

      - name: entitlement_days_calendar_full_term_vs_prorated_on_change
        grounds:
          - calculations.entitlement_days_charged
          - entities.EnrollmentCertification.fields.entitlement_days_charged
          - entities.VeteranStudent.fields.entitlement_days_remaining
          - state_machines.EnrollmentChangeReport.REPORTED_to_RECONCILED
        distinguishing_aspect: |
          This instance pins the ENTITLEMENT-DAY variant pair, a different quantity
          domain and a different divergence mechanism from the money pair: the
          CALENDAR_FULL_TERM variant rounds once over 110 days at tier 100 (110 days),
          whereas PRORATED_ON_CHANGE rounds each side of effective_date separately at
          its own tier (52 days at tier 100 + 35 days at tier 60 == 87), which is 21
          days more than re-running CALENDAR_FULL_TERM at the new tier would give (66).
        test_recipe:
          setup:
            - "Identical fixture to covered_tuition_as_certified_vs_as_reconciled_money_divergence through the VA payment: cert1 CERTIFIED at 12/12 credits, entitlement_days_charged 110, student entitlement_days_remaining 970, VA disbursed 2790000 + 776444."
            - "Clock advanced to 2026-10-20."
            - "A CREDIT_HOUR_REDUCTION to 7 residential credits effective 2026-10-15 is REPORTED (days_late 5, TIMELY, STUDENT)."
          setup_api_calls:
