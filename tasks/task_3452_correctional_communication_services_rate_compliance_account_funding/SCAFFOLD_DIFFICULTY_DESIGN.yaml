            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
