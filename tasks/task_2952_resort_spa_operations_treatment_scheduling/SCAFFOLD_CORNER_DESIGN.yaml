        as: SpaDirector
      assert:
      - "booking the DRY treatment into the HYDRO room returns 409 ERR_ROOM_CLASS_MISMATCH even though that room is ACTIVE and free"
      - "booking into the MAINTENANCE DRY room returns 409 ERR_ROOM_UNAVAILABLE, not ERR_ROOM_CLASS_MISMATCH: rung 21 passes on the class match and rung 22 fails on the status"
      - "booking at 06:00Z, two hours before the AVAILABLE block opens, returns 409 ERR_OUTSIDE_SHIFT_WINDOW"
      - "the 12:00Z booking in DRY-1 succeeds with 201, schedule_status REQUESTED and clearance_status CLEARED"
      - "the overlapping 12:30Z booking in the *other* DRY room returns 409 ERR_THERAPIST_DOUBLE_BOOKED and not ERR_ROOM_TURNOVER_CONFLICT: DRY-2 is empty, so only the therapist's closed interval [12:00, 13:00] intersecting [12:30, 13:30] can explain the rejection"
      - "the 2026-08-01T10:59Z booking returns 409 ERR_BOOKING_LEAD_TIME: start_at is 119 minutes after the clock, one minute short of MIN_LEAD_MINUTES, and it sits inside an AVAILABLE block so rung 23 is satisfied"
      - "GET /treatment-rooms/${room_a} reports booked_minutes_total 75 and GET /therapists/${th} reports assigned_minutes_total 60: only the single accepted booking moved the ledgers"

