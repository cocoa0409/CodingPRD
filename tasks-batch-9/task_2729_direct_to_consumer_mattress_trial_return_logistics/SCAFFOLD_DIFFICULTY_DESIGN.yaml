  - rule_id: boundary_precision_check
    instances:
      - name: break_in_window_inclusive_to_the_second_on_return_case_creation
        grounds:
          - validations[priority=17]
          - entities.TrialOrder.fields.break_in_ends_at
          - state_machines.TrialOrder.trial_status.BREAK_IN_to_TRIAL_ACTIVE
          - endpoints[POST /return-cases]
          - errors.ERR_BREAK_IN_NOT_ELAPSED
        distinguishing_aspect: |
          Temporal boundary resolved to one second on the SAME order: at
          2026-08-21T23:59:59Z the return is refused, at 2026-08-22T00:00:00Z - exactly
          break_in_ends_at - it is accepted, because the comparison is
          clock >= break_in_ends_at and not clock > break_in_ends_at. An off-by-one-second or
          strict-inequality implementation fails exactly one of the two calls.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents with break_in_nights 21 and trial_nights 100."
            - "One Customer with a DTC TrialOrder delivered at 2026-08-01T00:00:00Z, so break_in_ends_at == 2026-08-22T00:00:00Z and trial_ends_at == 2026-11-09T00:00:00Z."
            - "No return case exists yet, so the duplicate-active-return rule at priority 23 is not in play."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-MED-B", name: "Comfort Q Medium", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
