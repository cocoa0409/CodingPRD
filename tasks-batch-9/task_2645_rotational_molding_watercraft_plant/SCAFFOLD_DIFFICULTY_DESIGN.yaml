# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2645_rotational_molding_watercraft_plant
#
# Test-targeting index for the nine Difficulty Rules of SKILL.md §0.5.
# Every instance grounds ONLY in elements already declared in SCAFFOLD.yaml
# §1.1-§1.7; deleting this file leaves the scaffold's declared behaviour
# identical.
#
# Conventions used by every test_recipe below
# -------------------------------------------
#   * The logical clock starts at exactly 2026-08-01T00:00:00Z (§1.5
#     POST /_clock/set_current_utc). Wherever a lifecycle endpoint both takes
#     an explicit actual timestamp AND stamps "the logical clock", the chain
#     sets the clock first and passes the identical instant, so the two
#     readings can never disagree.
#   * Opaque roles (PlantAdmin, LogisticsPlanner, WarrantyAgent) act as the
#     fixed audit ids "admin-1" / "planner-1" / "agent-1"; §1.4 priority 1
#     requires a non-empty X-User-ID on every call, including opaque ones.
#   * Segregation of duties (§1.4 priority 57) is honoured everywhere: the
#     MOLDING_OPERATOR, the ASSEMBLY_TECH and the QUALITY_INSPECTOR are always
#     three distinct Technician rows.
#   * Every expected_*_version value is captured from a GET immediately before
#     the OCC call, because §1.2 cascades bump parent versions mid-chain
#     (contract item 3c).
#   * Production orders are created WITHOUT demand_bucket_id unless an instance
#     targets the build-ahead quota, so §1.4 priorities 69 and 74 are vacuous
#     for those chains (see calculations.build_ahead_commitment, which only
#     fires "when the producing order has a demand_bucket_id").
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Three instances on three different entity domains: Shipment freight money,
  # MoldingCycle/FinishedUnit process quality, Mold tooling selection.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: freight_quote_nested_vs_bill_gross_divergence
        grounds:
          - calculations.shipment_freight
          - calculations.shipment_cube_rollup
          - state_machines.Shipment.LOADING_to_SEALED
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - entities.Shipment.fields.quoted_freight_cents
          - entities.Shipment.fields.billed_freight_cents
          - concurrency_rules[line-create-stale-shipment]
        distinguishing_aspect: |
          The dual variant lives in the Shipment freight-money domain: variant QUOTED prices
          line_nested_cube_m3 at seal while variant BILLED prices line_gross_cube_m3 at
          delivery, so one trailer carrying the same two hulls ends with
          quoted_freight_cents 23325 and billed_freight_cents 31100 on the same row.
        test_recipe:
          setup:
            - "ProductModel PM-SHIP-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00."
            - "Mold MLD-SHIP-1 for that model, cavity_count 2 (so one demold mints two hulls), nominal_charge_kg 24.000 == 12.000 * 2, service_interval_cycles 10 so CASCADE-B never fires."
            - "OvenStation OV-1 (arm_count 2, changeover_buffer_min 15, energy_cents_per_min 100, max_size_class OVERSIZE) and CoolingBay CB-1 (concurrent_slot_capacity 2, airflow_mode FORCED_AIR), both OPERATIONAL."
            - "Four ACTIVE Technicians: RESIN_TECH with RESIN_BLENDING, MOLDING_OPERATOR, ASSEMBLY_TECH with FIXTURE_ASSEMBLY, QUALITY_INSPECTOR with WALL_GAUGE + IMPACT_RIG."
            - "Warehouse WH-SHIP, footprint_capacity_cube_m3 20.0000 with a single zone Z-A of 20.0000, posture NORMAL throughout."
            - "ResinLot LOT-SHIP: HDPE_LINEAR, melt_index 4.00, colour exactly the master code, additive UV12, regrind_pct_by_mass 10.00, cost_cents_per_kg 210, received_kg 500.000, expires_on 2027-12-31 — qualified for the model."
            - "ProductionOrder PO-SHIP (ordered_qty 2, no demand_bucket_id) released, one MoldingCycle run through to DEMOLDED, both hulls trimmed, outfitted and inspected PASS (wall_cv_pct 1.08, final_warpage_index 0.000), then both STORED in Z-A: hull 1 is the zone anchor at 2.0000 and hull 2 nests at 1.0000."
            - "Shipment SHP-1 out of WH-SHIP to destination_zone Z2, trailer_cube_capacity_m3 5.0000, trailer_max_payload_kg 200.000, with both hulls LOADED as lines 1 and 2, so nested_cube_m3 3.0000, loaded_cube_m3 4.0000, loaded_weight_kg 48.000 and cube_utilization_pct exactly 60.00."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-SHIP-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-SHIP-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-RES-1", full_name: "Rita Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-ASM-1", full_name: "Ana Assembly", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-QCI-1", full_name: "Quinn Quality", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-SHIP", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-SHIP", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - call: "POST /production-orders"
              payload: { order_code: "PO-SHIP", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/enter-cooling"
              payload: { actual_oven_end_at: "2026-08-01T10:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:35:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { fu1: "$.data[0].id", fu2: "$.data[1].id" }
            - call: "POST /finished-units/${fu1}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-0001" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /finished-units/${fu2}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu2}/outfit"
              payload: { hardware_kit_serial: "HK-0002" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v1: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v2: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-1", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-A", trailer_cube_capacity_m3: 5.0000, trailer_max_payload_kg: 200.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp: $.data.id }
            - call: "GET /shipments/${shp}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_v1: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp}", finished_unit_id: "${fu1}", expected_shipment_version: "${shp_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp}", finished_unit_id: "${fu2}", expected_shipment_version: "${shp_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /shipments/${shp}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { quoted: $.data.quoted_freight_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shp}/depart"
              payload: { departed_at: "2026-08-01T11:00:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shp}/deliver"
              payload: { delivered_at: "2026-08-02T00:00:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { billed: $.data.billed_freight_cents }
            - call: "GET /shipments/${shp}/freight-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "Shipment.${shp}.loaded_cube_m3 == 4.0000"
            - "Shipment.${shp}.nested_cube_m3 == 3.0000"
            - "Shipment.${shp}.loaded_weight_kg == 48.000"
            - "Shipment.${shp}.cube_utilization_pct == 60.00"
            - "Shipment.${shp}.density_kg_per_m3 == 16.000"
            - "ShipmentFreightSummary.discount_rate_pct == 3.00"
            - "ShipmentFreightSummary.quoted_pre_discount_cents == 21960"
            - "Shipment.${shp}.quoted_freight_cents == 23325"
            - "ShipmentFreightSummary.billed_pre_discount_cents == 29280"
            - "Shipment.${shp}.billed_freight_cents == 31100"
            - "Shipment.${shp}.billed_freight_cents - Shipment.${shp}.quoted_freight_cents == 7775"
            - "ShipmentFreightSummary.lines[0].nest_position == 1 and ShipmentFreightSummary.lines[0].line_nested_cube_m3 == 2.0000"
            - "ShipmentFreightSummary.lines[1].nest_position == 2 and ShipmentFreightSummary.lines[1].line_nested_cube_m3 == 1.0000"
            - "ShipmentFreightSummary.lines[1].chargeable_kg_nested == 120.000 and ShipmentFreightSummary.lines[1].chargeable_kg_gross == 240.000"

      - name: warpage_provisional_schedule_vs_final_actual_divergence
        grounds:
          - calculations.cycle_warpage_index
          - calculations.cycle_window_projection
          - state_machines.MoldingCycle.COOLING_to_DEMOLDED
          - state_machines.FinishedUnit.OUTFITTED_to_SELLABLE
          - entities.MoldingCycle.fields.provisional_warpage_index
          - entities.FinishedUnit.fields.final_warpage_index
        distinguishing_aspect: |
          The dual variant lives in the MoldingCycle/FinishedUnit process-quality domain (not the
          freight-money domain of freight_quote_nested_vs_bill_gross_divergence): variant
          PROVISIONAL charges the cooling term against scheduled_cooling_minutes 10 at demold and
          yields provisional_warpage_index 0.329, while variant FINAL recomputes it against
          actual_cooling_minutes 35 at inspection and yields final_warpage_index 0.120 for the
          very same shot.
        test_recipe:
          setup:
            - "ProductModel PM-WARP-KM: KAYAK/MID, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00, nominal_charge_kg 24.000, charge_tolerance_pct 5.00."
            - "Mold MLD-WARP-1, cavity_count 1, nominal_charge_kg 24.000, service_interval_cycles 10; OvenStation OV-1 (max_size_class OVERSIZE, changeover_buffer_min 15, energy_cents_per_min 100); CoolingBay CB-1 with airflow_mode FORCED_AIR (COOLING_MODE_WARPAGE_FACTOR 0.900) and concurrent_slot_capacity 2."
            - "Four ACTIVE Technicians as in the freight instance; Warehouse WH-WARP 20.0000 in one zone; qualified ResinLot LOT-WARP with received_kg 500.000."
            - "ProductionOrder PO-WARP (ordered_qty 1, no demand_bucket_id) released; one MoldingCycle scheduled with oven_temp_c 300.0 (thermal_term round(|300-288|/40,3) = 0.300), arm_rpm_major 8.40 / arm_rpm_minor 2.00 (rotation_ratio 4.200, rotation_term 0.050), scheduled_oven_minutes 60 and scheduled_cooling_minutes 10 — deliberately far below min_cooling_minutes 30, so the PROVISIONAL cooling_term is round((30-10)/30,3) = 0.667."
            - "The oven actually runs 09:00 to 10:00 and the shot actually cools until 10:35, i.e. actual_cooling_minutes 35 >= min_cooling_minutes 30, so the FINAL cooling_term is 0.000 and the demold is admitted by §1.4 priority 54."
            - "The hull is trimmed, outfitted and inspected with wall_thickness_points giving wall_cv_pct 1.08 <= wall_cv_max_pct 12.00, so the FINAL distribution_term is 0.000 and the only surviving difference between the two variants is the cooling term."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-WARP-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-WARP-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-RES-1", full_name: "Rita Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-ASM-1", full_name: "Ana Assembly", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-QCI-1", full_name: "Quinn Quality", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-WARP", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-WARP", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - call: "POST /production-orders"
              payload: { order_code: "PO-WARP", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 10, oven_temp_c: 300.0, arm_rpm_major: 8.40, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
