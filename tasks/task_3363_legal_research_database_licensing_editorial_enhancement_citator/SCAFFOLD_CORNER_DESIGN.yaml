            - call: "POST /legal-research/documents/${doc_a1}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: CITED}]}
              as: ContentIngester
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A2 v. Offset", raw_citation_string: "67 U.S. 22", decision_date: "2026-03-01"}
