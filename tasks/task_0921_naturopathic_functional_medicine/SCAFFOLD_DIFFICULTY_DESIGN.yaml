              as_user_id: "${pt_id}"
              captures: { s2: $.data.id }
            - call: "POST /intake-sections/${s2}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s3: $.data.id }
