              captures: { assignment_id: "$.data.id" }
            - call: "POST /accreditation/annual-reports"
              payload: { camp_id: "${camp_id}", report_year: 2025 }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { report_id: "$.data.id" }
          assert:
            - "AccreditationCycle.${cycle_id}.status == SELF_ASSESSMENT with decision_level == null and self_assessment_submitted_at == null"
            - "StandardEvaluation.${ev1_id}.self_status == DRAFT and visit_status == UNSCORED with self_score == null and visitor_score == null and visit_id == null"
            - "Visitor.${visitor_id}.status == ACTIVE with committed_travel_days == 0"
            - "WrittenPlan.${plan_id}.status == SUBMITTED with verified_at == null and supersedes_plan_id == null"
            - "AccreditationVisit.${visit_id}.status == DRAFT with lead_visitor_id == null, team_size == 0, required_specialist_domains == [] and scheduled_by_user_id == null"
            - "VisitAssignment.${assignment_id}.status == ASSIGNED with travel_days == 3 and AccreditationVisit.${visit_id}.lead_visitor_id == ${visitor_id} and team_size == 1"
            - "AnnualReport.${report_id}.status == DRAFT with due_date == 2026-03-01, declared_incident_count == 0, disclosed_incident_count == 0, reopen_count == 0"
            - "StandardsSet was DRAFT before publish and Camp began at NOT_ACCREDITED/NONE/OPEN"

      - name: visit_lifecycle_triggers_enforce_their_from_state_preconditions
        claim_type: Precondition Enforcement
        grounds:
          - state_machines[AccreditationVisit]
          - validations[priority 24]
          - errors[ERR_VISIT_INVALID_STATE]
        distinguishing_aspect: "start requires SCHEDULED and finalize-scoring requires IN_PROGRESS; both must reject a DRAFT visit with the same 409 before any window or team check runs, so a handler that validates the window first fails."
        test_recipe:
          setup:
            - "a DRAFT visit on a SELF_ASSESSMENT cycle with no team seated; the logical clock date sits inside the visit window so the temporal rule cannot mask the state rule"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Visit Precondition Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-VP", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id", cycle_version: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-07", expected_cycle_version: "${cycle_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Ida Bell", home_state_code: "PA", trained_through_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visitor_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${visitor_id}", team_role: "LEAD", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/visits/${visit_id}/start"
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "POST /accreditation/visits/${visit_id}/finalize-scoring"
              as: Visitor
              as_user_id: "${visitor_id}"
          assert:
            - "first call: 409 ERR_VISIT_INVALID_STATE - start demands SCHEDULED, the visit is DRAFT"
            - "second call: 409 ERR_VISIT_INVALID_STATE - finalize demands IN_PROGRESS"
            - "AccreditationVisit.${visit_id}.status is still DRAFT and scored_at == null"
            - "AccreditationCycle.${cycle_id}.status is still SELF_ASSESSMENT"
            - "no Deficiency row exists"

      - name: annual_report_submit_and_review_outside_the_current_status_are_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines[AnnualReport]
          - validations[priority 26]
          - errors[ERR_ANNUAL_REPORT_INVALID_STATE]
        distinguishing_aspect: "The AnnualReport machine admits submit only from DRAFT/REJECTED/REOPENED and review only from SUBMITTED/LATE; a review of a DRAFT row and a re-submit of a SUBMITTED row must both 409 on the same error_id."
        test_recipe:
          setup:
            - "one camp with a DRAFT 2025 annual report; the logical clock is 2026-02-01 which is on or before the 2026-03-01 due date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Report State Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/annual-reports"
              payload: { camp_id: "${camp_id}", report_year: 2025 }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { report_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/annual-reports/${report_id}/review"
              payload: { decision: "ACCEPT" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/annual-reports/${report_id}/submit"
              payload: { declared_incident_count: 0 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${report_id}/submit"
              payload: { declared_incident_count: 0 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${report_id}/review"
              payload: { decision: "ACCEPT", reviewer_note: "clean season" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/annual-reports/${report_id}/review"
              payload: { decision: "REJECT" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "first call: 409 ERR_ANNUAL_REPORT_INVALID_STATE - review demands SUBMITTED or LATE"
            - "second call: 200 with status == SUBMITTED, submitted_at == 2026-02-01T00:00:00Z and attested_by_user_id == ${camp_id}"
            - "third call: 409 ERR_ANNUAL_REPORT_INVALID_STATE - the same trigger a second time is rejected"
            - "fourth call: 200 with status == ACCEPTED"
            - "fifth call: 409 ERR_ANNUAL_REPORT_INVALID_STATE - ACCEPTED is not a review source"
            - "AnnualReport.${report_id}.reopen_count == 0 throughout"

      - name: second_publish_and_post_publish_standard_addition_are_rejected
        claim_type: Idempotency
        grounds:
          - state_machines[StandardsSet]
          - validations[priority 21]
          - errors[ERR_STANDARDS_SET_ALREADY_PUBLISHED]
        distinguishing_aspect: "Publishing is not idempotent: the second publish must 409, and the same 409 must also block adding a standard to an already-PUBLISHED edition, which is what makes the cycle's pinned edition immutable."
        test_recipe:
          setup:
            - "one DRAFT edition holding a single standard"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-IDEM", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "OM.9", title: "Late addition", domain: "OPERATIONS", mandatory: false, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "first call: 200 with status == PUBLISHED and published_at == 2026-08-01T00:00:00Z"
            - "second call: 409 ERR_STANDARDS_SET_ALREADY_PUBLISHED with published_at unchanged"
            - "third call: 409 ERR_STANDARDS_SET_ALREADY_PUBLISHED"
            - "StandardsSet.${set_id}.standard_count == 1 and mandatory_count == 1 - the late standard was not persisted"

      - name: cycle_creation_against_a_draft_edition_is_rejected_until_it_is_published
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority 22]
          - errors[ERR_STANDARDS_SET_NOT_PUBLISHED]
          - calculations.standard_applicability_determination
        distinguishing_aspect: "The edition must be PUBLISHED at pin time; the identical request succeeds after publish and only then materialises evaluations, proving the guard is on edition state and not on the request shape."
        test_recipe:
          setup:
            - "one DRAFT edition with two standards and one camp"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Draft Edition Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
