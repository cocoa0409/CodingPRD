          assert:
            - "response.data.error_id == ERR_CROSS_ENTITY_STATE"
            - "PersonalRepresentative.${rep_id}.status == NOMINATED (unchanged)"

      - name: discharge_requires_estate_closed
        grounds:
          - state_machines.PersonalRepresentative.APPOINTED_to_DISCHARGED
          - entities.Estate.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          PR discharge depends on the Estate being CLOSED (PR->Estate pair, a
          different entity pair than appoint->petition). With the estate still
          OPEN, discharge fails ERR_CROSS_ENTITY_STATE.
        test_recipe:
          setup:
            - "An OPEN estate with an APPOINTED PR (INDEPENDENT gross so no bond needed); estate not CLOSED."
          setup_api_calls:
