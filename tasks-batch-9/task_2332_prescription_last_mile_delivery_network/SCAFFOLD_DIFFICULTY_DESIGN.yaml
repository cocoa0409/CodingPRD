  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: patient_share_rounded_per_line_then_summed_not_on_subtotal
        grounds:
          - calculations.patient_gross_cost_share
          - calculations.delivery_fee_subtotal
          - entities.FeeAllocation.fields.patient_gross_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order changes the cents: three of the six fee lines land
          exactly on a half-cent at a 10% share, so round-per-line-then-sum yields
          patient_gross_share_cents 264 while sum-then-round yields 263; the scaffold pins per-line.
        test_recipe:
          setup:
            - "Commercial plan at 10% member cost share; grant pool 100000 cents, per-delivery cap 150 cents."
            - "Cold-chain CII order in zone Z1 whose fee lines are 705 / 861 / 455 / 605 / 0 / 0 cents."
            - "Clock at 2026-08-03T09:00:00Z, five hours ahead of the 14:00-16:00Z scheduled window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 100000, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z1", distance_band_miles: 6.4, base_fee_cents: 705, per_mile_cents: 123, cold_pack_fee_cents: 455, controlled_handling_fee_cents: 605, after_hours_fee_cents: 305, cold_chain_supported: true, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1970-04-12", phone_last4: "4417", address_line: "881 Alder St", zone_code: "Z1", hipaa_consent_status: "GRANTED" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /pharmacy-orders"
              payload: { pharmacy_id: "${ph1_id}", patient_id: "${pat1_id}", health_plan_id: "${hp1_id}", rx_line_count: 2, cold_chain_required: true, controlled_schedule: "CII", total_rx_value_cents: 31000 }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /pharmacy-orders/${o1_id}/mark-ready"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
            - call: "POST /delivery-windows"
              payload: { zone_id: "${z1_id}", courier_mode: "SCHEDULED", window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z", capacity_slots: 2 }
              as: NetworkOps
              captures: { w1_id: $.data.id, w1_v: $.data.version }
          trigger:
            - call: "POST /deliveries"
              payload: { order_id: "${o1_id}", window_id: "${w1_id}", expected_window_version: "${w1_v}" }
              as: PharmacyOperator
              as_user_id: "${ph1_id}"
              captures: { d1_id: $.data.id }
          assert:
            - "GET /fee-allocations?delivery_id=${d1_id} returns total_count 1 with variant PROVISIONAL and status ACTIVE"
            - "That allocation has base_line_cents 705, mileage_line_cents 861, cold_pack_line_cents 455, controlled_line_cents 605, after_hours_line_cents 0, reattempt_line_cents 0"
            - "That allocation has fee_subtotal_cents 2626 and cost_share_pct_applied 0.10"
            - "That allocation has patient_gross_share_cents == 264"
            - "That allocation has patient_gross_share_cents != 263 (the sum-then-round result of round_half_up(2626 * 0.10))"
            - "That allocation has plan_grant_cents 150, absorption_tier_cents 50, pharmacy_absorption_cents 50, patient_payable_cents 64, pharmacy_payable_cents 2412"
            - "plan_grant_cents + pharmacy_payable_cents + patient_payable_cents == 2626"

      - name: absorption_tier_pinned_to_pre_absorption_patient_net
        grounds:
          - calculations.plan_grant_commitment_and_absorption
          - entities.FeeAllocation.fields.absorption_tier_cents
          - entities.FeeAllocation.fields.pharmacy_absorption_cents
          - entities.DeliveryWindow.fields.is_after_hours
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the pharmacy
          absorption tier is keyed on the patient's PRE-absorption net of 1053 cents (tier 500), and
          re-deriving the tier from the post-absorption 553 would select tier 200 and leave the
          patient owing 853; the scaffold pins step 6 to the pre-absorption figure.
        test_recipe:
          setup:
            - "Commercial plan at 30% member cost share; grant pool 60 cents with a 60-cent per-delivery cap, so the grant can only shave 60 cents off the member share."
            - "Zone Z2 priced at base 2005, 155 cents per mile over an 8.2-mile band, after-hours 305 cents, cold chain unsupported."
            - "Standard (non-cold, non-controlled) order delivered in a 21:00-23:00Z after-hours scheduled window, giving fee lines 2005 / 1395 / 0 / 0 / 305 / 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Cascade Choice", payer_type: "COMMERCIAL", member_cost_share_pct: 0.30 }
              as: NetworkOps
              captures: { hp2_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp2_id}", benefit_year: 2026, grant_budget_cents: 60, per_delivery_cap_cents: 60 }
              as: NetworkOps
              captures: { g2_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Birch Rx", state_code: "OR", cold_chain_certified: false, controlled_license_tier: "NONE", return_window_minutes: 300 }
              as: NetworkOps
              captures: { ph2_id: $.data.id }
            - call: "POST /delivery-zones"
              payload: { zone_code: "Z2", distance_band_miles: 8.2, base_fee_cents: 2005, per_mile_cents: 155, cold_pack_fee_cents: 500, controlled_handling_fee_cents: 700, after_hours_fee_cents: 305, cold_chain_supported: false, controlled_delivery_allowed: true }
              as: NetworkOps
              captures: { z2_id: $.data.id }
            - call: "POST /patients"
