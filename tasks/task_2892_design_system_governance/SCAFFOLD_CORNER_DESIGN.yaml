            - "${e_block} == ERR_REVIEW_STAGE_MISMATCH with HTTP status 409 (BLOCK is an engineering-gate verdict only)"
            - "${state_at_eng} == ENGINEERING_REVIEW"
            - "${e_replay} == ERR_REVIEW_STAGE_MISMATCH with HTTP status 409"
            - "GET /design-system/contribution-proposals/${prop_id}/reviews returns total_count == 1 (only the accepted critique verdict was recorded)"

  - section: cross_cutting_complexity_layers
    instances:
