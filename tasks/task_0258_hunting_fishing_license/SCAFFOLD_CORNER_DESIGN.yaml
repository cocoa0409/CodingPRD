              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_RESIDENCY_RESTRICTED"

      - name: duplicate_draw_entry_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE_ENTRY]
        distinguishing_aspect: "Same applicant entering the same ACCEPTING pool twice -> second POST /draw-applications returns ERR_DUPLICATE_ENTRY 409."
        test_recipe:
          setup: ["ACCEPTING pool with one SUBMITTED application by applicant A1; clock before deadline."]
          setup_api_calls:
