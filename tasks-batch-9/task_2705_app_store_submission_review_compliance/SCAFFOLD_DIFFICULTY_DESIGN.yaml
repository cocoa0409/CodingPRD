  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: review_pool_half_open_aggregate_ceiling
        grounds:
          - calculations.review_pool_concurrency
          - constants.POOL_MAX_CONCURRENT_SLOTS
          - entities.ReviewCapacityWindow.fields.capacity_slots
          - entities.ReviewCapacityWindow.fields.slots_available
          - entities.ReviewCapacityWindow.fields.status
          - endpoints[POST /review-capacity-windows]
          - endpoints[POST /review-capacity-windows/{id}/close]
          - errors.ERR_REVIEW_POOL_OVERSUBSCRIBED
        distinguishing_aspect: |
          Overlap alone is legal and only the AGGREGATE matters: 6 + 4 = 10 intersecting slots is
          accepted at exactly POOL_MAX_CONCURRENT_SLOTS, one more slot on an interval that intersects
          both is refused at 11, a window whose starts_at equals an existing ends_at is always legal
          because the intervals are half-open, the ceiling is scoped per (platform, reviewer_pool_code)
          so POOL_B and ANDROID are unaffected, and CLOSING a window removes its slots from the
          aggregate so the previously refused window then fits.
        test_recipe:
          setup:
            - "Empty database except one OPEN ReviewCapacityWindow W1: platform IOS, pool POOL_A, [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z), capacity_slots 6"
            - "No submissions exist, so no slot is reserved or consumed anywhere"
            - "Clock at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", capacity_slots: 6 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w1_id: "$.data.id" } }
          trigger:
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", capacity_slots: 4 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w2_id: "$.data.id" } }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-18T00:00:00Z", capacity_slots: 1 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w4_id: "$.data.id" } }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_B", starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-18T00:00:00Z", capacity_slots: 10 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w5_id: "$.data.id" } }
            - { call: "POST /review-capacity-windows", payload: { platform: "ANDROID", reviewer_pool_code: "POOL_A", starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-18T00:00:00Z", capacity_slots: 10 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w6_id: "$.data.id" } }
            - { call: "POST /review-capacity-windows/${w1_id}/close", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-18T00:00:00Z", capacity_slots: 1 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { w7_id: "$.data.id" } }
          assert:
            - "W2 [08-10, 08-20) with 4 slots -> 201 (intersects W1; 6 + 4 == 10 == POOL_MAX_CONCURRENT_SLOTS, equality passes)"
            - "ReviewCapacityWindow.${w2_id}.slots_available == 4 and slots_reserved == 0 and slots_consumed == 0"
            - "W3 [08-12, 08-18) with 1 slot -> 409 ERR_REVIEW_POOL_OVERSUBSCRIBED (intersects W1 and W2; 6 + 4 + 1 == 11 > 10)"
            - "W4 [08-20, 08-25) with 5 slots -> 201 (starts_at == W2.ends_at, half-open adjacency is never intersection)"
            - "W5 POOL_B [08-12, 08-18) with 10 slots -> 201 (the ceiling is per reviewer_pool_code)"
            - "W6 ANDROID POOL_A [08-12, 08-18) with 10 slots -> 201 (the ceiling is per platform)"
            - "POST /review-capacity-windows/${w1_id}/close -> 200 and ReviewCapacityWindow.${w1_id}.status == CLOSED"
            - "W7, the identical [08-12, 08-18) 1-slot window refused earlier, -> 201 after the close (only OPEN windows count: 4 + 1 == 5 <= 10)"
            - "GET /review-capacity-windows?platform=IOS&reviewer_pool_code=POOL_A returns exactly 4 rows (W1 CLOSED, W2, W4, W7 OPEN); the refused W3 left no row"
            - "ReviewCapacityWindow.${w7_id}.capacity_slots == 1 and slots_available == 1"

      - name: rollout_closed_interval_touching_conflict
        grounds:
          - calculations.rollout_window_exclusivity
          - constants.PHASE_COUNT
          - constants.MIN_PHASE_DWELL_HOURS
          - entities.RolloutPlan.fields.scheduled_start_at
          - entities.RolloutPlan.fields.projected_end_at
          - concurrency_rules[rollout-plan-create-stale-app-record]
          - endpoints[POST /rollout-plans]
          - errors.ERR_ROLLOUT_WINDOW_CONFLICT
        distinguishing_aspect: |
          Rollout intervals are CLOSED at both ends — the exact opposite of the review pool's half-open
          treatment — so a plan starting exactly at an existing plan's projected_end_at (2026-08-09T00:00:00Z
          = 2026-08-02T00:00:00Z + 7 * 24h) must be refused while one starting one hour later is accepted,
          and an IMMEDIATE plan whose interval is the single instant [T, T] still conflicts when T touches
          a neighbour's endpoint.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE; AppRecord IOS with one PASSED PRIVACY mapping (posture OPEN)"
            - "Submission build 10 in state APPROVED (queued, claimed, approved by u-reviewer-1)"
            - "No RolloutPlan rows yet; AppRecord.distribution_state NOT_DISTRIBUTED"
            - "Clock stays at its 2026-08-01T00:00:00Z default, so every plan below stays SCHEDULED"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_priv_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_priv_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
