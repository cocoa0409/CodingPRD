          - endpoints["POST /subscriptions/{id}/modifications"].roles
          - endpoints["POST /subscription-modifications/{id}/reverse"].roles
        distinguishing_aspect: |
          Every operation listed as shared for the RetentionSpecialist works without a Subscriber
          header: the specialist opens a session, captures a reason, applies a FREQUENCY_CHANGE on
          the subscriber's behalf and reverses it, ending with frequency_weeks back at 4 and
          version 3.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A at 4-week cadence, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
