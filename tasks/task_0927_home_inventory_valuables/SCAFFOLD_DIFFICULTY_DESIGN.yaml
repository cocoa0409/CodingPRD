  - rule_id: resource_temporal_overlap
    instances:
      - name: appraisal_inspection_hold_uses_closed_interval_with_symmetric_24h_buffer
        grounds:
          - validations[priority=17]
          - errors[ERR_APPRAISAL_WINDOW_CONFLICT]
          - entities.Appraisal.fields.inspection_start_at
          - entities.Appraisal.fields.inspection_end_at
          - calculations.appraisal_credit_entitlement
        distinguishing_aspect: |
          Interval semantics here are CLOSED with a symmetric APPRAISAL_BUFFER_HOURS (24)
          widening, and the occupied resource is the Item. A second window starting 16
          hours after the first one ends still collides once widened; a window starting
          40 hours after it ends does not. Touching endpoints count as colliding.
        test_recipe:
          setup:
            - "A JEWELRY CategorySchedule with appraisal_scope JEWELRY; a PLUS household (2 included appraisal credits)."
            - "One CATALOGED JEWELRY item with serial JW-T1 and a PHOTO asset."
            - "An appraiser credentialed for JEWELRY, not linked to any member."
            - "One REQUESTED appraisal occupying [2026-06-10T09:00Z, 2026-06-10T17:00Z]; one credit remains."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vault/category-schedules"
              payload: { category: "JEWELRY", useful_life_months: 240, annual_depreciation_pct: 4.0, salvage_floor_pct: 40.0, blanket_sublimit_cents: 300000, appraisal_scope: "JEWELRY", serial_required: false }
