            - "${po_fee} == 755 (ceil at step 3 then ceil at step 4)"
            - "${po_fee} != 754 (the single-combined-rounding answer)"
            - "${po_amount} == 59585"
            - "Payout.${po_id}.method == INSTANT_DEBIT and state == PENDING and retry_count == 0 and fund_credit_cents == 0 and statement_count == 1"
            - "EarningsStatement.${s1_id}.payout_id == ${po_id}"
            - "GET /monetization/creators/${cr_id}/ledger-entries?source_entity=PAYOUT&source_id=${po_id} returns exactly two rows: PAYOUT_DEBIT amount_cents == -59585 then PAYOUT_FEE amount_cents == -755"
            - "Creator.${cr_id}.ledger_balance_cents == 0 (60340 - 59585 - 755)"
            - "Creator.${cr_id}.payout_state == PAYOUT_IN_FLIGHT"

      - name: payout_volume_tier_keyed_on_pre_fee_payable_mode_c
        mode: "c_circular_looking_pinned_evaluation_order"
        grounds:
          - calculations.payout_fee_and_amount
          - entities.Payout.fields.payable_before_fee_cents
          - entities.Payout.fields.fee_cents
          - entities.Payout.fields.amount_cents
          - entities.Creator.fields.available_balance_cents
        distinguishing_aspect: |
          Mode (c): the dependency looks circular - the volume tier selects the
          fee multiplier, the fee determines amount_cents, and amount_cents is
          the "payout size" a naive implementation would tier on. The pinned
          order resolves it: the tier is keyed on payable_before_fee_cents,
          never on amount_cents. At payable 50000 (the inclusive T2 lower
          bound) BANK_TRANSFER yields fee_cents 150 and amount_cents 49850;
