              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4038", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 134, retread_count: 3 }
              as: DealerAdmin
              captures: { casM_id: $.data.id }
            - call: "POST /casings/${casM_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
          trigger:
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casM_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T08:20:00Z" }
              as: PlantScheduler
              captures: { e1: $.data.error_id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casM_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z" }
              as: PlantScheduler
              captures: { e2: $.data.error_id }
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casM_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T08:20:00Z" }
              as: PlantScheduler
              captures: { e3: $.data.error_id }
          assert:
            - "with no policy the request returns 422 ERR_TIRE_POLICY_MISSING even though the 20-minute slot is also below MIN_JOB_MINUTES 60 — priority 19 precedes priority 25"
            - "with the policy in place and a legal 240-minute slot the request returns 422 ERR_MAX_RETREAD_COUNT_REACHED, since retread_count 3 already equals max_retread_count 3"
            - "the third request, still illegal on both counts, again reports the higher-priority ERR_MAX_RETREAD_COUNT_REACHED rather than ERR_INVALID_SLOT_DURATION"
            - "RetreadLine.${line_id}.booked_minutes == 0 and status \"AVAILABLE\" after all three refusals, and GET /retread-jobs?casing_id=${casM_id} returns total_count == 0"

      - name: manifest_eligibility_and_emptiness_error_family
        claim_type: error_triggerable
        grounds:
          - validations.priority_16_business_referential
          - validations.priority_17_business_referential
          - errors.ERR_CASING_NOT_SCRAP_ELIGIBLE
          - errors.ERR_MANIFEST_EMPTY
        distinguishing_aspect: "Scrap eligibility is a REJECTED-only gate checked at BOTH line addition and signing, and an empty manifest cannot be signed — so the two errors bracket the manifest's only path to SIGNED and neither can be bypassed by ordering the calls differently."
