scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_room_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Room, endpoints]
        distinguishing_aspect: "POST /studio/rooms with all required fields returns 201 and a Room carrying server-minted id, created_at, updated_at, version==1, and status defaulting to OPEN."
        test_recipe:
          setup: ["a studio exists"]
          setup_api_calls:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          trigger:
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Room.${room_id}.version == 1"
            - "Room.${room_id}.status == OPEN (default)"
            - "Room.${room_id}.block_hours == 8 (default applied)"
            - "Room.${room_id}.turnaround_minutes == 30 (default applied)"
      - name: get_booking_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studio/bookings/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["a studio exists; no booking with the queried id"]
          setup_api_calls:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
          trigger:
            - call: "GET /studio/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"
      - name: create_booking_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Booking, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/bookings omitting end_at (required input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["studio, room, client exist"]
          setup_api_calls:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: create_studio_applies_defaults_when_optional_omitted
        claim_type: Defaults
        grounds: [entities.Studio.fields.deposit_pct, entities.Studio.fields.overtime_multiplier]
        distinguishing_aspect: "POST /studio with only name applies deposit_pct 0.30, overtime_multiplier 1.5, overtime_grace_minutes 10, cancellation_tier_hours 48, late_cancel_fee_pct 0.50 defaults."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id, dp: $.data.deposit_pct }
          assert:
            - "Studio.${studio_id}.deposit_pct == 0.30"
            - "Studio.${studio_id}.overtime_multiplier == 1.5"
            - "Studio.${studio_id}.overtime_grace_minutes == 10"
            - "Studio.${studio_id}.cancellation_tier_hours == 48"
            - "Studio.${studio_id}.late_cancel_fee_pct == 0.50"
      - name: booking_computed_base_charge_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.base_charge_cents, calculations.base_charge]
        distinguishing_aspect: "base_charge_cents is server-computed from the room rate and duration; a BLOCK booking of 9h with block_hours 8 yields base_charge_cents == 80000 (2 blocks), independent of any client-supplied amount."
        test_recipe:
          setup: ["studio, room (block_rate 40000, block_hours 8), client"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000, block_hours: 8 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "BLOCK", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T18:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, base: $.data.base_charge_cents }
          assert:
            - "Booking.${booking_id}.base_charge_cents == 80000 (ceil(9/8)=2 blocks * 40000)"
            - "Booking.${booking_id}.deposit_due_cents == 24000 (round_half_up(80000*0.30))"
      - name: create_booking_invalid_enum_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Booking.fields.booking_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/bookings with booking_kind not in {HOURLY,BLOCK,LOCKOUT} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["studio, room, client exist"]
          setup_api_calls:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "MONTHLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: create_booking_invalid_time_range_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "POST /studio/bookings with end_at <= start_at returns ERR_INVALID_TIME_RANGE (422)."
        test_recipe:
          setup: ["studio, room, client exist"]
          setup_api_calls:
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T12:30:00Z", end_at: "2026-07-10T09:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_TIME_RANGE"
            - "HTTP status == 422"
      - name: list_bookings_pagination_envelope
        claim_type: Listing
        grounds: [entities.Booking, response_envelope]
        distinguishing_aspect: "GET /studio/bookings returns an array envelope with pagination fields total_count and has_more; limit=1 over 2 bookings returns has_more true."
        test_recipe:
          setup: ["studio, room, client; two bookings created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-11T09:00:00Z", end_at: "2026-07-11T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "GET /studio/bookings?client_id=${client_id}&limit=1&offset=0"
              payload: {}
              as: StudioManager
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"
            - "data length == 1"
      - name: create_room_with_nonexistent_studio_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Room.fields.studio_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /studio/rooms with a studio_id that does not exist returns ERR_NOT_FOUND (404) — FK existence validated."
        test_recipe:
          setup: ["empty DB (no studio with the referenced id)"]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/rooms"
              payload: { studio_id: "00000000-0000-4000-8000-000000000000", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"
      - name: overtime_record_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.OvertimeRecord]
        distinguishing_aspect: "OvertimeRecord has common_fields:false — its GET output carries id and created_at but no version field; there is no update endpoint for it."
        test_recipe:
          setup: ["a COMPLETED booking that accrued overtime (checked out 12:55, 15 billable min)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, overtime_grace_minutes: 10, overtime_multiplier: 1.5 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:05:00Z" }
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
            - call: "POST /studio/bookings/${booking_id}/check-out"
              payload: { actual_end_at: "2026-07-10T12:55:00Z" }
              as: StudioManager
          trigger:
            - call: "GET /studio/bookings/${booking_id}/overtime-records"
              payload: {}
              as: StudioManager
          assert:
            - "data length == 1"
            - "OvertimeRecord(booking ${booking_id}).overage_minutes == 15"
            - "the OvertimeRecord object has no `version` field"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: confirm_without_deposit_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a HELD booking whose settlement_status is still AWAITING_DEPOSIT (no deposit paid) returns ERR_INVALID_STATE (409); confirm requires DEPOSIT_PAID."
        test_recipe:
          setup: ["studio, room, client; HELD booking, no deposit paid"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
      - name: cancel_already_cancelled_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.HELD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED booking returns ERR_INVALID_STATE (409); CANCELLED is terminal on the schedule axis and fires no side effects."
        test_recipe:
          setup: ["studio, room, client; HELD booking already cancelled"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
      - name: cancel_confirmed_after_start_returns_cancel_too_late
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_CANCEL_TOO_LATE]"]
        distinguishing_aspect: "Cancelling a CONFIRMED booking when Clock.current_utc >= start_at returns ERR_CANCEL_TOO_LATE (409); the session has already started."
        test_recipe:
          setup: ["studio, room, client; CONFIRMED booking; clock advanced to after start_at"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60, cancellation_tier_hours: 48 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T09:30:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CANCEL_TOO_LATE"
            - "HTTP status == 409"
      - name: check_in_before_start_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.CONFIRMED_to_IN_SESSION, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Check-in while Clock.current_utc < start_at returns ERR_INVALID_STATE (409); the session cannot begin before its scheduled start."
        test_recipe:
          setup: ["studio, room, client; CONFIRMED booking; clock still before start_at"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { studio_id: "${studio_id}", name: "Room A", hourly_rate_cents: 6000, block_rate_cents: 40000 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studio/clients/register"
              payload: { studio_id: "${studio_id}", display_name: "Band", email: "band@x.com" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/bookings"
              payload: { studio_id: "${studio_id}", room_id: "${room_id}", client_id: "${client_id}", booking_kind: "HOURLY", start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /studio/bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 14400 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /studio/bookings/${booking_id}/confirm"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studio/bookings/${booking_id}/check-in"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
      - name: check_in_requires_engineer_for_gear_returns_engineer_required
        claim_type: guarded transitions
        grounds: [state_machines.Booking.CONFIRMED_to_IN_SESSION, "validations[priority=8]", "errors[ERR_ENGINEER_REQUIRED]"]
        distinguishing_aspect: "Check-in on a CONFIRMED booking that holds a RESERVED gear rental whose GearItem.requires_engineer is true but no EngineerAssignment returns ERR_ENGINEER_REQUIRED (422)."
        test_recipe:
          setup: ["studio, room, client, gear (requires_engineer true); CONFIRMED booking with that gear reserved, no engineer assigned; clock at start"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: StudioManager
            - call: "POST /studio"
              payload: { name: "Echo Labs", deposit_pct: 0.60 }
