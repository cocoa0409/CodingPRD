# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2284 - Broadband Grant Program & Challenge Process
# 20 instances across the nine §0.5 difficulty rules.
# Every numeric literal below was computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: application_cost_per_location_preliminary_vs_final
        grounds:
          - calculations.application_cost_per_location
          - entities.Application.fields.preliminary_cost_per_location_cents
          - entities.Application.fields.final_cost_per_location_cents
          - entities.Application.fields.claim_count
          - entities.Application.fields.confirmed_location_count
          - entities.LocationClaim.fields.claim_state
        distinguishing_aspect: |
          Cost accounting on an Application: the same four LocationClaim rows yield
          preliminary_cost_per_location_cents == 975002 (denominator counts all 4 claims) and
          final_cost_per_location_cents == 900002 (denominator counts only the 3 claims whose
          location is UNSERVED or UNDERSERVED), a 75000-cent divergence stamped by one submit call.
        test_recipe:
          setup:
            - "Program with default 25/3 and 100/20 thresholds, challenge window 2026-08-05..2026-09-05, application window 2026-08-05..2026-09-05, logical clock at 2026-08-10T00:00:00Z, program_state CHALLENGE_OPEN."
            - "Four locations: L1 SERVED (200/25 fiber), L2 UNDERSERVED (50/10), L3 UNSERVED (10/1), L5 UNDERSERVED (25/3)."
            - "Subgrantee QUALIFIED with capability_index 90.00; DRAFT application claiming L1 at 1200000 and L2/L3/L5 at 900002 each."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z", min_match_pct: 25.0, holdback_pct: 10.0, ehcl_threshold_cents: 2500000, ehcl_waiver_enabled: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0002", reported_down_mbps: 50, reported_up_mbps: 10, reported_latency_ms: 40, reported_technology: "CABLE", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l2_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0003", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l3_id: $.data.id }
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0005", reported_down_mbps: 25, reported_up_mbps: 3, reported_latency_ms: 60, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l5_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s1_id: $.data.id }
            - call: "POST /broadband/subgrantees/${s1_id}/begin-capability-review"
              payload: {}
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/subgrantees/${s1_id}/record-capability-determination"
              payload: { technical_raw_score: 30 }
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/applications"
              payload: { program_id: "${p_id}", subgrantee_id: "${s1_id}", match_offer_pct: 25.0, committed_down_mbps: 1000, committed_up_mbps: 1000, committed_latency_ms: 50, low_cost_plan_price_cents: 3000, participates_in_state_affordability_program: true, has_dbe_plan: true, has_union_agreement: false, local_hire_pct: 40, proposed_construction_start: "2026-10-01T00:00:00Z", proposed_construction_end: "2027-10-01T00:00:00Z" }
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l1_id}", claimed_cost_cents: 1200000 }
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { c_l1_id: $.data.id }
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l2_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l3_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l5_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
          trigger:
            - call: "POST /broadband/applications/${a1_id}/submit"
              payload: {}
              as: Subgrantee
              as_user_id: "${s1_id}"
          assert:
            - "Application.${a1_id}.claim_count == 4"
            - "Application.${a1_id}.confirmed_location_count == 3"
            - "Application.${a1_id}.total_project_cost_cents == 3900006"
            - "Application.${a1_id}.eligible_project_cost_cents == 2700006"
            - "Application.${a1_id}.preliminary_cost_per_location_cents == 975002"
            - "Application.${a1_id}.final_cost_per_location_cents == 900002"
            - "LocationClaim.${c_l1_id}.claim_state == CLAIMED_INELIGIBLE"

      - name: milestone_disbursement_pro_rata_vs_cost_reimbursement
        grounds:
          - calculations.milestone_disbursement_amount
          - entities.Milestone.fields.evidence_basis
          - entities.Milestone.fields.payable_amount_cents
          - entities.Award.fields.holdback_cap_cents
          - state_machines.Milestone.EVIDENCE_SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Disbursement accounting on a Milestone (a different entity domain from the Application
          cost variant): two milestones each covering exactly one location whose claimed cost is
          900002 yield payable_amount_cents == 675001 under PRO_RATA_BUILD (obligation share
          2025003 x 1/3) but 675002 under COST_REIMBURSEMENT (federal share 75% of 900002), a
          one-cent divergence produced purely by the variant selector.
        test_recipe:
          setup:
            - "The base program/locations/subgrantee/application fixture, submitted and scored, selected, and obligated as award AW1 with obligation_amount_cents 2025003, holdback_cap_cents 1822503 and confirmed_location_count 3."
            - "Environmental review cleared on the CATEGORICAL_EXCLUSION pathway and construction authorized, so L2/L3/L5 are UNDER_CONSTRUCTION."
            - "Milestone M1 is BUILD_PROGRESS over [L2]; milestone M2 is INVOICED_COST over [L3] with invoiced_cost_cents 900002."
