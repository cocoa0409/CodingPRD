              payload: { target_status: "DECLARATION_OPEN" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/prospects"
              payload: { draft_cycle_id: "${cycle_id}", full_name: "Avery Lane", position_group: "QB", school_code: "NRT", seasons_played: 4, scouting_grade: 92.50, position_group_scarcity_rank: 1 }
              as: LeagueDraftAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /draft-ops/prospects/${p1_id}/declaration"
              payload: { action: "DECLARE" }
              as: ProspectAgent
              as_user_id: "${p1_id}"
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "COMBINE_WEEK" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/phase"
              payload: { target_status: "ORDER_PENDING" }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/lottery"
              payload: { drawn_combination_sequence: [200, 50] }
              as: LeagueDraftAdmin
            - call: "POST /draft-ops/draft-cycles/${cycle_id}/draft-order/finalize"
              payload: {}
              as: LeagueDraftAdmin
            - call: "GET /draft-ops/draft-picks?draft_cycle_id=${cycle_id}&round_number=1&limit=10"
