  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: work_order_create_requires_glass_lot_released
        grounds:
          - validations.priority_13
          - errors.ERR_GLASS_LOT_NOT_RELEASED
          - state_machines.GlassLot.QUARANTINED_to_RELEASED
          - calculations.blank_conservation_ledger
          - concurrency_rules.work-order-create-stale-glass-lot
        distinguishing_aspect: |
          A work order's admissibility depends on a different entity's state: while the lot is still
          QUARANTINED the create call is refused with ERR_GLASS_LOT_NOT_RELEASED (409) and no blank is
          reserved, and certifying the lot (which also bumps its version to 2) makes the identical call
          succeed with reserved_blank_count 3 and available_blank_count 17.
        test_recipe:
          setup:
            - "A RELEASED design and a freshly created GlassLot GL-2540-1 in QUARANTINED with total_blank_count 20 and version 1."
            - "element_count 2 computes spare_blank_count 1 and reserved_blank_count 3."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id, g1v0: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v0}" }
              as: ProcessTechnician
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
          assert:
            - "the first trigger returns HTTP 409 with error_id ERR_GLASS_LOT_NOT_RELEASED"
            - "after the refusal: GlassLot.${g1}.reserved_blank_count == 0"
            - "after the refusal: GlassLot.${g1}.available_blank_count == 20"
            - "after the certification: GlassLot.${g1}.lot_status == RELEASED"
            - "after the certification: GlassLot.${g1}.effective_index_homogeneity_grade == H3"
            - "the last trigger returns HTTP 201"
            - "WorkOrder.${w1}.spare_blank_count == 1"
            - "WorkOrder.${w1}.reserved_blank_count == 3"
            - "WorkOrder.${w1}.process_status == BLANKS_RESERVED"
            - "WorkOrder.${w1}.blank_center_thickness_um == 6200.0"
            - "GlassLot.${g1}.reserved_blank_count == 3"
            - "GlassLot.${g1}.available_blank_count == 17"

      - name: report_sign_requires_instrument_calibrated_and_recovers_after_recalibration
        grounds:
          - validations.priority_16
          - errors.ERR_INSTRUMENT_CALIBRATION_OVERDUE
          - endpoints.POST_/optics/metrology-instruments/{id}/calibrations
          - calculations.metrology_acceptance_verdict
          - calculations.figuring_removal_convergence
        distinguishing_aspect: |
          Signing depends on the state of an entity two hops away — the run's instrument: at 92 days
          against a 90-day interval the signature is refused with ERR_INSTRUMENT_CALIBRATION_OVERDUE (409)
          and the report stays DRAFT; recording a calibration at the current clock resets
          days_since_calibration to 0 and instrument_status to CALIBRATED, after which the same signature
          is accepted, the run reaches ACCEPTED and the WorkOrder advances POLISHING -> FIGURING with
          cumulative_removal_nm 800.0 and remaining_center_thickness_um 6199.2000.
        test_recipe:
          setup:
            - "A WorkOrder in POLISHING whose 08:00-10:00 run is AWAITING_METROLOGY with material_removed_nm 800.0, and a DRAFT report recorded by mt-001 with surface_rms_waves 0.0200 (POLISHING budget 0.0750) and surface_roughness_nm_rms 0.8000 (budget 1.2000)."
            - "IF-2540-1 has calibration_interval_days 90 and last_calibrated_utc 2026-08-01T00:00:00Z; the clock is moved to 2026-11-01T00:00:00Z, 92 days later."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
