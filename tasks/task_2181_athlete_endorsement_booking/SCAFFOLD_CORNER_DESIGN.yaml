          assert:
            - "every response has HTTP status 404 and response_type == error"
            - "error_id values in order: ERR_BRAND_NOT_FOUND, ERR_TERM_SHEET_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_DELIVERABLE_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_PAYOUT_NOT_FOUND, ERR_RENEWAL_NOT_FOUND"
