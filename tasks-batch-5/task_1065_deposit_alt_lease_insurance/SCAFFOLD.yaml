scenario: "Security-Deposit Alternative & Lease Insurance (Rhino style): renter enrollment & underwriting, monthly-fee vs deposit, coverage & landlord claim, payout & subrogation/recovery, property enrollment, cancellation/move-out, state compliance, reporting"
domain_name: "deposit-alt-lease-insurance"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers: ["optimistic_concurrency", "cascading_side_effects", "dual_variant_calculation", "conditional_feature_flags"]

  entity_topology: hybrid
  # Landlord -> Property is a strict ownership tree; RenterEnrollment, Policy, PremiumInvoice, Claim,
  # Payout, SubrogationCase, RecoveryPayment are flat entities linked by FK (not URL-nested under
  # Property); StateComplianceRule is a cross-cutting configuration entity referenced by state_code
  # from Property. Mix of tree + flat cross-references = hybrid.

  state_machine_shape: cyclic
  # Dominant non-linear shapes present: Claim has a NEEDS_INFO<->UNDER_REVIEW revision cycle; Policy
  # has a LAPSED<->ACTIVE reinstatement cycle; RenterEnrollment has a fork-join branch
  # (PENDING_UNDERWRITING -> {APPROVED, MANUAL_REVIEW} -> APPROVED/DECLINED).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The ClaimsAdjuster who moves a Claim to APPROVED (reviewing_adjuster_id) may not be the same
  # opaque adjuster identity who disburses that claim's Payout.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal or business name of the landlord/property owner.
      - name: email
        type: string
        source: input
        description: Contact email; used as the login-style identifier.
        constraints: unique across Landlord
      - name: phone_number
        type: string
        source: input
        description: Contact phone number.

  - name: Property
    parent: Landlord
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; owner of this property."
      - name: address_line1
        type: string
        source: input
        description: Street address of the property.
      - name: city
        type: string
        source: input
        description: City the property sits in.
      - name: state_code
        type: enum
        source: input
        description: Two-letter US state code the property is located in; keys the applicable StateComplianceRule.
        constraints: "2-letter uppercase code, e.g. CA, NY, TX"
      - name: monthly_rent_cents
        type: integer
        source: input
        description: Contract monthly rent for the unit at this property, in cents.
        constraints: "> 0"
      - name: property_type
        type: enum
        source: input
        description: Physical type of the property.
        constraints: "one of SINGLE_FAMILY, MULTI_FAMILY, CONDO"
      - name: program_status
        type: enum
        source: system
        description: Program-enrollment lifecycle status of this property (see state_machines.Property).
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, ACTIVE, TERMINATED"
      - name: terminated_at
        type: datetime
        source: system
        description: Timestamp the property's program enrollment was last terminated; null until then.
        default: null
      - name: total_paid_claims_cents
        type: integer
        source: computed
        description: Running sum of amount_cents over all this property's non-reversed DISBURSED Payouts (see calculations.property_total_paid_claims). Updated as the final hop of the payout-disburse cascade.
        default: 0

  - name: Renter
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the prospective/current renter.
      - name: email
        type: string
        source: input
        description: Contact email; used as the login-style identifier.
        constraints: unique across Renter
      - name: phone_number
        type: string
        source: input
        description: Contact phone number.

  - name: RenterEnrollment
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property/unit the renter is applying to lease."
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; the applicant."
      - name: payment_plan
        type: enum
        source: input
        description: Fee structure the renter selected for the eventual Policy.
        constraints: "one of MONTHLY, ANNUAL_UPFRONT"
      - name: requested_coverage_limit_cents
        type: integer
        source: input
        description: Coverage limit the renter is requesting in lieu of a cash security deposit.
        constraints: "> 0"
      - name: self_reported_annual_income_cents
        type: integer
        source: input
        description: Annual income as declared by the renter at application time.
        constraints: ">= 0"
      - name: verified_annual_income_cents
        type: integer
        source: input
        description: Annual income confirmed by employer/payroll verification, if run before submission; null when unverified.
        default: null
      - name: employment_verified
        type: boolean
        source: input
        description: Whether employment/income verification was completed before underwriting submission.
        default: false
      - name: credit_proxy_score
        type: integer
        source: input
        description: Credit-bureau-proxy score supplied with the application.
        constraints: "300-850 inclusive"
      - name: prior_eviction_count
        type: integer
        source: input
        description: Number of prior evictions on the applicant's record.
        default: 0
        constraints: ">= 0"
      - name: lease_start_date
        type: datetime
        source: input
        description: Start of the lease term this enrollment is underwriting coverage for.
      - name: lease_end_date
        type: datetime
        source: input
        description: End of the lease term (exclusive) this enrollment is underwriting coverage for.
        constraints: "> lease_start_date"
      - name: risk_score_self_reported
        type: number
        source: computed
        description: "underwriting_risk_score (self_reported variant); see calculations.underwriting_risk_score."
        default: null
      - name: risk_score_verified
        type: number
        source: computed
        description: "underwriting_risk_score (verified variant); populated only when employment_verified is true and verified_annual_income_cents is set. See calculations.underwriting_risk_score."
        default: null
      - name: risk_tier
        type: enum
        source: computed
        description: Tier bucket of the officially-used risk score (risk_score_verified if present, else risk_score_self_reported).
        constraints: "one of LOW, MEDIUM, HIGH"
        default: null
      - name: status
        type: enum
        source: system
        description: Underwriting lifecycle status (see state_machines.RenterEnrollment).
        default: PENDING_UNDERWRITING
        constraints: "one of PENDING_UNDERWRITING, MANUAL_REVIEW, APPROVED, DECLINED"

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: renter_enrollment_id
        type: string
        source: system
        description: "FK -> RenterEnrollment.id; created automatically when the enrollment reaches APPROVED."
      - name: coverage_limit_cents
        type: integer
        source: system
        description: Active coverage limit; initialized from RenterEnrollment.requested_coverage_limit_cents, mutable via coverage-limit-adjustments.
      - name: payment_plan
        type: enum
        source: system
        description: Copied from RenterEnrollment.payment_plan at creation.
        constraints: "one of MONTHLY, ANNUAL_UPFRONT"
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "calculations.monthly_fee_calculation output; recomputed whenever coverage_limit_cents changes."
      - name: gross_available_coverage_cents
        type: integer
        source: computed
        description: "calculations.policy_available_coverage, gross variant."
      - name: net_available_coverage_cents
        type: integer
        source: computed
        description: "calculations.policy_available_coverage, net variant."
      - name: lease_start_date
        type: datetime
        source: system
        description: Copied from RenterEnrollment.lease_start_date at creation.
      - name: lease_end_date
        type: datetime
        source: system
        description: Copied from RenterEnrollment.lease_end_date at creation.
      - name: status
        type: enum
        source: system
        description: Policy lifecycle status (see state_machines.Policy).
        default: AWAITING_FIRST_PAYMENT
        constraints: "one of AWAITING_FIRST_PAYMENT, ACTIVE, LAPSED, CANCELLED, EXPIRED"
      - name: cancelled_at
        type: datetime
        source: system
        description: Timestamp of cancellation; null until cancelled.
        default: null

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        description: "FK -> Policy.id."
      - name: billing_period_start
        type: datetime
        source: system
        description: Start of the billing cycle this invoice covers.
      - name: billing_period_end
        type: datetime
        source: system
        description: End (exclusive) of the billing cycle this invoice covers.
      - name: amount_cents
        type: integer
        source: computed
        description: "Total invoice amount; sum of insurance_premium_cents + platform_fee_cents + state_tax_cents. See calculations.premium_installment_allocation."
      - name: insurance_premium_cents
        type: integer
        source: computed
        description: "calculations.premium_installment_allocation output component."
      - name: platform_fee_cents
        type: integer
        source: computed
        description: "calculations.premium_installment_allocation output component."
      - name: state_tax_cents
        type: integer
        source: computed
        description: "calculations.premium_installment_allocation output component."
      - name: due_date
        type: datetime
        source: system
        description: Date payment is due; billing_period_start + 10 days.
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle status (see state_machines.PremiumInvoice).
        default: ISSUED
        constraints: "one of ISSUED, PAID, OVERDUE"
      - name: paid_at
        type: datetime
        source: system
        description: Timestamp the invoice was paid; null until then.
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy the landlord is claiming against."
      - name: claim_type
        type: enum
        source: input
        description: Nature of the loss being claimed.
        constraints: "one of UNPAID_RENT, PROPERTY_DAMAGE, BOTH"
      - name: line_items
        type: array
        source: input
        description: "Itemized damage/unpaid-rent lines: [{ description: string, amount_cents: integer }]. May be empty at filing time; an empty array blocks approval (see errors.ERR_CLAIM_HAS_NO_LINE_ITEMS)."
        default: []
      - name: total_claimed_amount_cents
        type: integer
        source: computed
        description: Sum of line_items[].amount_cents.
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "calculations.claim_payout_calculation output; null until APPROVED."
        default: null
      - name: deductible_cents
        type: integer
        source: computed
        description: "calculations.claim_payout_calculation intermediate; null until APPROVED."
        default: null
      - name: status
        type: enum
        source: system
        description: Claim lifecycle status (see state_machines.Claim).
        default: UNDER_REVIEW
        constraints: "one of UNDER_REVIEW, NEEDS_INFO, APPROVED, DENIED, CLOSED"
      - name: reviewing_adjuster_id
        type: string
        source: system
        description: Opaque X-User-ID of the ClaimsAdjuster who moved this claim to APPROVED or DENIED; used by the segregation-of-duties check on Payout disbursement.
        default: null
      - name: decision_notes
        type: string
        source: input
        description: Free-text adjuster notes recorded on approve/deny/request-info.
        default: null

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> Claim.id; created automatically when the claim reaches APPROVED."
      - name: amount_cents
        type: integer
        source: system
        description: Copied from claim.approved_amount_cents at creation.
      - name: status
        type: enum
        source: system
        description: Payout lifecycle status (see state_machines.Payout).
        default: PENDING
        constraints: "one of PENDING, DISBURSED, REVERSED"
      - name: disbursing_adjuster_id
        type: string
        source: system
        description: Opaque X-User-ID of the ClaimsAdjuster who disbursed this payout; must differ from claim.reviewing_adjuster_id.
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: Timestamp of disbursement; null until then.
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Timestamp of reversal; null until then.
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: Reason supplied on reversal (e.g. fraud finding).
        default: null

  - name: SubrogationCase
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; the paid claim this recovery effort pursues from the renter."
      - name: original_demand_amount_cents
        type: integer
        source: input
        description: Amount insurer demands back from the renter.
        constraints: "> 0"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "calculations.subrogation_outstanding_balance output."
      - name: status
        type: enum
        source: system
        description: Recovery lifecycle status (see state_machines.SubrogationCase).
        default: OPEN
        constraints: "one of OPEN, DEMAND_SENT, PAID_IN_FULL, WRITTEN_OFF"
      - name: demand_sent_at
        type: datetime
        source: system
        description: Timestamp the formal demand was sent to the renter; null until then.
        default: null

  - name: RecoveryPayment
    parent: null
    common_fields: true
    fields:
      - name: subrogation_case_id
        type: string
        source: input
        description: "FK -> SubrogationCase.id."
      - name: amount_cents
        type: integer
        source: input
        description: Amount the renter paid toward the outstanding subrogation balance.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Payment status (see state_machines.RecoveryPayment).
        default: SUCCEEDED
        constraints: "one of SUCCEEDED, REVERSED"
      - name: paid_at
        type: datetime
        source: system
        description: Timestamp the payment was recorded.
      - name: reversed_at
        type: datetime
        source: system
        description: Timestamp of a chargeback/reversal; null until then.
        default: null

  - name: StateComplianceRule
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code this rule governs.
        constraints: "unique; 2-letter uppercase code"
      - name: enrollment_allowed
        type: boolean
        source: input
        description: Whether this program may enroll properties/renters located in this state at all.
        default: true
      - name: max_monthly_fee_pct_of_rent
        type: number
        source: input
        description: Regulatory ceiling on monthly_fee_cents, expressed as a fraction of Property.monthly_rent_cents.
        constraints: "0 < value <= 1"
      - name: cooling_off_buffer_days
        type: integer
        source: input
        description: Minimum number of days that must elapse between a property's program termination and its next re-activation.
        default: 30
        constraints: ">= 0"
      - name: mandatory_alternative_offering
        type: boolean
        source: input
        description: Whether landlords in this state are required to offer the deposit alternative alongside a cash deposit (informational compliance flag surfaced in reporting).
        default: true

state_machines:
  - entity: Property
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /properties/{id}/program-status {action: ACTIVATE}"
        actor: ComplianceOfficer
        preconditions: ["Property.program_status == PENDING_REVIEW"]
        side_effects: ["sets Property.program_status = ACTIVE"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /properties/{id}/program-status {action: TERMINATE}"
        actor: ComplianceOfficer
        preconditions: ["Property.program_status == ACTIVE"]
        side_effects: ["sets Property.program_status = TERMINATED", "sets Property.terminated_at = current clock time"]
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /properties/{id}/program-status {action: ACTIVATE}"
        actor: ComplianceOfficer
        preconditions:
          - "Property.program_status == TERMINATED"
          - "current clock time >= Property.terminated_at + StateComplianceRule[Property.state_code].cooling_off_buffer_days (see validations priority 12; ERR_REENROLLMENT_COOLDOWN_ACTIVE otherwise)"
        side_effects: ["sets Property.program_status = ACTIVE", "clears Property.terminated_at to null"]
        note: "Re-enrollment cycle; interval semantics differ from Policy's lease-overlap rule — this is a minimum-gap-after-a-point buffer, not an interval/interval overlap. Rule 8 instance resource_temporal_overlap.property_reenrollment_cooldown_buffer."

  - entity: RenterEnrollment
    initial_state: PENDING_UNDERWRITING
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: PENDING_UNDERWRITING
        to: APPROVED
        trigger: "POST /renter-enrollments/{id}/submit-underwriting"
        actor: Renter
        preconditions:
          - "RenterEnrollment.status == PENDING_UNDERWRITING"
          - "official risk_score (risk_score_verified if employment_verified else risk_score_self_reported) <= 35 (AUTO_APPROVE_THRESHOLD)"
          - "monthly_fee_calculation pre-clamp result for the resulting Policy <= state_cap_cents for Property.state_code, else ERR_FEE_EXCEEDS_STATE_CAP"
        side_effects:
          - "computes risk_score_self_reported, risk_score_verified (if applicable), risk_tier"
          - "creates Policy (status=AWAITING_FIRST_PAYMENT, coverage_limit_cents=requested_coverage_limit_cents, payment_plan copied, lease_start_date/lease_end_date copied, monthly_fee_cents=monthly_fee_calculation, gross/net_available_coverage_cents=coverage_limit_cents)"
          - "creates first PremiumInvoice (status=ISSUED, billing_period_start=lease_start_date, billing_period_end=lease_start_date+1 month, due_date=billing_period_start+10 days, amount/insurance_premium/platform_fee/state_tax_cents via premium_installment_allocation)"
        note: "Auto-approve branch (fork target 1 of 2)."
      - from: PENDING_UNDERWRITING
        to: MANUAL_REVIEW
        trigger: "POST /renter-enrollments/{id}/submit-underwriting"
        actor: Renter
        preconditions:
          - "RenterEnrollment.status == PENDING_UNDERWRITING"
          - "official risk_score > 35 (AUTO_APPROVE_THRESHOLD)"
        side_effects: ["computes risk_score_self_reported, risk_score_verified (if applicable), risk_tier"]
        note: "Manual-review branch (fork target 2 of 2)."
      - from: MANUAL_REVIEW
        to: APPROVED
        trigger: "POST /renter-enrollments/{id}/decide {action: APPROVE}"
        actor: UnderwritingAgent
        preconditions:
          - "RenterEnrollment.status == MANUAL_REVIEW"
          - "monthly_fee_calculation pre-clamp result for the resulting Policy <= state_cap_cents for Property.state_code, else ERR_FEE_EXCEEDS_STATE_CAP"
        side_effects:
          - "creates Policy (status=AWAITING_FIRST_PAYMENT, coverage_limit_cents=requested_coverage_limit_cents, payment_plan copied, lease_start_date/lease_end_date copied, monthly_fee_cents=monthly_fee_calculation, gross/net_available_coverage_cents=coverage_limit_cents)"
          - "creates first PremiumInvoice (status=ISSUED, billing_period_start=lease_start_date, billing_period_end=lease_start_date+1 month, due_date=billing_period_start+10 days, amount/insurance_premium/platform_fee/state_tax_cents via premium_installment_allocation)"
        note: "Join point — both fork branches converge here or at DECLINED."
      - from: MANUAL_REVIEW
        to: DECLINED
        trigger: "POST /renter-enrollments/{id}/decide {action: DECLINE}"
        actor: UnderwritingAgent
        preconditions: ["RenterEnrollment.status == MANUAL_REVIEW"]
        side_effects: ["sets RenterEnrollment.status = DECLINED; no Policy created"]

  - entity: Policy
    initial_state: AWAITING_FIRST_PAYMENT
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: AWAITING_FIRST_PAYMENT
        to: ACTIVE
        trigger: "POST /invoices/{id}/pay (paying the policy's first PremiumInvoice)"
        actor: Renter
        preconditions: ["Policy.status == AWAITING_FIRST_PAYMENT", "the invoice being paid is this Policy's first invoice"]
        side_effects: ["sets Policy.status = ACTIVE"]
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /_billing/run-cycle"
        actor: system
        preconditions: ["Policy.status == ACTIVE", "Policy has an invoice whose status transitioned ISSUED -> OVERDUE in this same sweep"]
        side_effects: ["sets Policy.status = LAPSED"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /invoices/{id}/pay (paying the OVERDUE invoice)"
        actor: Renter
        preconditions: ["Policy.status == LAPSED", "the invoice being paid is this Policy's only non-PAID invoice"]
        side_effects: ["sets Policy.status = ACTIVE"]
        note: "Reinstatement cycle. Rule 3 non_linear_state_machine instance on Policy (cyclic), paired with Claim's NEEDS_INFO<->UNDER_REVIEW cycle on a different entity."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Renter
        preconditions: ["Policy.status == ACTIVE"]
        side_effects: ["sets Policy.status = CANCELLED", "sets Policy.cancelled_at = current clock time"]
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Renter
        preconditions: ["Policy.status == LAPSED"]
        side_effects: ["sets Policy.status = CANCELLED", "sets Policy.cancelled_at = current clock time"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_billing/run-cycle"
        actor: system
        preconditions: ["Policy.status == ACTIVE", "current clock time >= Policy.lease_end_date"]
        side_effects: ["sets Policy.status = EXPIRED"]
      - from: LAPSED
        to: EXPIRED
        trigger: "POST /_billing/run-cycle"
        actor: system
        preconditions: ["Policy.status == LAPSED", "current clock time >= Policy.lease_end_date"]
        side_effects: ["sets Policy.status = EXPIRED"]

  - entity: PremiumInvoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Renter
        preconditions: ["PremiumInvoice.status == ISSUED"]
        side_effects: ["sets PremiumInvoice.status = PAID", "sets PremiumInvoice.paid_at = current clock time", "may trigger Policy AWAITING_FIRST_PAYMENT->ACTIVE or Policy LAPSED->ACTIVE (see state_machines.Policy)"]
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /_billing/run-cycle"
        actor: system
        preconditions: ["PremiumInvoice.status == ISSUED", "current clock time >= PremiumInvoice.due_date + 5 days (OVERDUE_GRACE_DAYS)"]
        side_effects: ["sets PremiumInvoice.status = OVERDUE", "may trigger Policy ACTIVE->LAPSED (see state_machines.Policy)"]
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Renter
        preconditions: ["PremiumInvoice.status == OVERDUE"]
        side_effects: ["sets PremiumInvoice.status = PAID", "sets PremiumInvoice.paid_at = current clock time", "may trigger Policy LAPSED->ACTIVE (see state_machines.Policy)"]

  - entity: Claim
    initial_state: UNDER_REVIEW
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /claims/{id}/info-transition {action: REQUEST_INFO}"
        actor: ClaimsAdjuster
        preconditions: ["Claim.status == UNDER_REVIEW"]
        side_effects: ["sets Claim.status = NEEDS_INFO", "sets Claim.decision_notes from request body"]
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/info-transition {action: SUBMIT_INFO}"
        actor: Landlord
        preconditions: ["Claim.status == NEEDS_INFO"]
        side_effects: ["sets Claim.status = UNDER_REVIEW", "appends supplied line_items (if any) to Claim.line_items and recomputes total_claimed_amount_cents"]
        note: "Revision-loop cycle. Rule 3 non_linear_state_machine instance on Claim (cyclic), paired with Policy's LAPSED<->ACTIVE cycle on a different entity."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/decide {action: APPROVE}"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "Claim.line_items is non-empty, else ERR_CLAIM_HAS_NO_LINE_ITEMS"
          - "the Claim's Policy.status is not CANCELLED, else ERR_INVALID_STATE"
          - "claim_payout_calculation's approved_amount_cents <= Policy.gross_available_coverage_cents, else ERR_COVERAGE_LIMIT_EXCEEDED"
        side_effects:
          - "computes Claim.approved_amount_cents, Claim.deductible_cents via claim_payout_calculation"
          - "sets Claim.status = APPROVED"
          - "sets Claim.reviewing_adjuster_id = caller's X-User-ID"
          - "creates Payout (status=PENDING, claim_id=Claim.id, amount_cents=Claim.approved_amount_cents)"
          - "recomputes Policy.gross_available_coverage_cents via policy_available_coverage (gross variant)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/decide {action: DENY}"
        actor: ClaimsAdjuster
        preconditions: ["Claim.status == UNDER_REVIEW"]
        side_effects: ["sets Claim.status = DENIED", "sets Claim.reviewing_adjuster_id = caller's X-User-ID", "sets Claim.decision_notes from request body"]
      - from: APPROVED
        to: CLOSED
        trigger: "POST /payouts/{id}/transition {action: DISBURSE} (system bubble-up on this claim's Payout)"
        actor: system
        preconditions: ["Claim.status == APPROVED", "Claim's Payout.status == DISBURSED"]
        side_effects: ["sets Claim.status = CLOSED"]

  - entity: Payout
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /payouts/{id}/transition {action: DISBURSE}"
        actor: ClaimsAdjuster
        preconditions:
          - "Payout.status == PENDING"
          - "caller's X-User-ID != Payout.Claim.reviewing_adjuster_id, else ERR_SOD_VIOLATION"
        side_effects:
          - "sets Payout.status = DISBURSED, Payout.disbursing_adjuster_id = caller's X-User-ID, Payout.disbursed_at = current clock time  [cascade hop 1]"
          - "recomputes Policy.net_available_coverage_cents via policy_available_coverage (net variant)  [cascade hop 2]"
          - "recomputes Property.total_paid_claims_cents via property_total_paid_claims  [cascade hop 3]"
          - "triggers Claim APPROVED -> CLOSED bubble-up (see state_machines.Claim)"
        note: "Rule 4 transitive_cascade instance A, depth 3, trigger = Payout DISBURSE."
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /payouts/{id}/transition {action: REVERSE}"
        actor: PlatformAdmin
        preconditions: ["Payout.status == DISBURSED"]
        side_effects:
          - "sets Payout.status = REVERSED, Payout.reversed_at = current clock time, Payout.reversal_reason from request body"
          - "recomputes Policy.net_available_coverage_cents via policy_available_coverage (net variant), restoring it to its pre-disbursement value"
          - "recomputes Property.total_paid_claims_cents via property_total_paid_claims, restoring it to its pre-disbursement value"
        note: "Compensating action for Rule 9 compensating_invariant instance A (conserved quantity: Policy.coverage_limit_cents == Policy.net_available_coverage_cents + sum(non-reversed DISBURSED Payout.amount_cents) for this policy)."

  - entity: SubrogationCase
    initial_state: OPEN
    terminal_states: [PAID_IN_FULL, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: DEMAND_SENT
        trigger: "POST /subrogation-cases/{id}/transition {action: SEND_DEMAND}"
        actor: ComplianceOfficer
        preconditions: ["SubrogationCase.status == OPEN"]
        side_effects: ["sets SubrogationCase.status = DEMAND_SENT", "sets SubrogationCase.demand_sent_at = current clock time"]
      - from: DEMAND_SENT
        to: PAID_IN_FULL
        trigger: "POST /subrogation-cases/{id}/recovery-payments (system bubble-up when outstanding_balance_cents reaches 0)"
        actor: system
        preconditions: ["SubrogationCase.status == DEMAND_SENT", "subrogation_outstanding_balance result == 0 after recording the payment"]
        side_effects: ["sets SubrogationCase.status = PAID_IN_FULL"]
      - from: DEMAND_SENT
        to: WRITTEN_OFF
        trigger: "POST /subrogation-cases/{id}/transition {action: WRITE_OFF}"
        actor: ComplianceOfficer
        preconditions: ["SubrogationCase.status == DEMAND_SENT"]
        side_effects: ["sets SubrogationCase.status = WRITTEN_OFF"]

  - entity: RecoveryPayment
    initial_state: SUCCEEDED
    terminal_states: [REVERSED]
    transitions:
      - from: SUCCEEDED
        to: REVERSED
        trigger: "POST /recovery-payments/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["RecoveryPayment.status == SUCCEEDED"]
        side_effects:
          - "sets RecoveryPayment.status = REVERSED, RecoveryPayment.reversed_at = current clock time"
          - "recomputes SubrogationCase.outstanding_balance_cents via subrogation_outstanding_balance, restoring the reversed amount"
          - "if SubrogationCase.status == PAID_IN_FULL, reverts SubrogationCase.status to DEMAND_SENT"
        note: "Compensating action for Rule 9 compensating_invariant instance B (conserved quantity: SubrogationCase.original_demand_amount_cents == SubrogationCase.outstanding_balance_cents + sum(non-reversed SUCCEEDED RecoveryPayment.amount_cents) for this case)."

concurrency_rules:
  - rule_id: coverage-limit-adjustment-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/coverage-limit-adjustments"
    occ_field: "expected_policy_version"
    description: |
      Adjusting a Policy's coverage_limit_cents (which recomputes monthly_fee_cents,
      gross_available_coverage_cents and net_available_coverage_cents) is rejected when the
      request's expected_policy_version does not match the Policy's current version. This
      captures the case where the client's view of the policy is stale because another writer
      (a coverage-limit adjustment, a Payout disbursement/reversal, or an invoice-driven status
      change) has already advanced the policy's version.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

calculations:
  - name: underwriting_risk_score
    trigger: "POST /renter-enrollments/{id}/submit-underwriting"
    algorithm: weighted_scoring
    formula: |
      income_to_rent_ratio = annual_income_cents / (Property.monthly_rent_cents * 12)
      income_risk = clamp(0, 100, 100 - (income_to_rent_ratio / 3.0) * 100)
      credit_risk = clamp(0, 100, (850 - credit_proxy_score) / (850 - 300) * 100)
      eviction_risk = min(100, prior_eviction_count * 40)
      risk_score = round_half_up(0.4 * income_risk + 0.4 * credit_risk + 0.2 * eviction_risk)
      # risk_tier: LOW if risk_score <= 20, MEDIUM if 21-50, HIGH if 51-100
    input_set: "The RenterEnrollment being scored and its Property.monthly_rent_cents."
    constants:
      W_INCOME: 0.4
      W_CREDIT: 0.4
      W_EVICTION: 0.2
      TARGET_INCOME_RATIO: 3.0
      AUTO_APPROVE_THRESHOLD: 35
      LOW_TIER_MAX: 20
      MEDIUM_TIER_MAX: 50
    precision: "integer risk_score, round_half_up"
    variants:
      - name: self_reported
        when: "always computed; annual_income_cents = self_reported_annual_income_cents"
        difference: "Uses the renter's self-declared income; written to risk_score_self_reported."
      - name: verified
        when: "employment_verified == true and verified_annual_income_cents is not null"
        difference: "Uses verified_annual_income_cents instead of self_reported_annual_income_cents; written to risk_score_verified. The two variants operate on identical credit_proxy_score/prior_eviction_count but a divergent income figure, so they can legitimately produce different risk_score and risk_tier values for the same application. The officially-used score (gating AUTO_APPROVE_THRESHOLD and risk_tier) is risk_score_verified when present, else risk_score_self_reported."

  - name: policy_available_coverage
    trigger: "gross variant recomputed on Claim UNDER_REVIEW->APPROVED and on Policy coverage-limit-adjustments; net variant recomputed on Payout DISBURSE, Payout REVERSE, and Policy coverage-limit-adjustments"
    algorithm: aggregation
    formula: |
      gross_available_coverage_cents = Policy.coverage_limit_cents - sum(Claim.approved_amount_cents for Claim in Policy.claims where Claim.status in {APPROVED, CLOSED})
      net_available_coverage_cents   = Policy.coverage_limit_cents - sum(Payout.amount_cents for Payout in Policy.claims[*].payouts where Payout.status == DISBURSED)
    input_set: "All Claims belonging to this Policy (gross variant) or all Payouts belonging to this Policy's Claims (net variant)."
    constants: {}
    precision: "integer cents, no rounding (inputs are already integer cents)"
    variants:
      - name: gross
        when: "always computed"
        difference: "Reserves every APPROVED-or-CLOSED claim's approved_amount_cents, whether or not its Payout has actually been disbursed yet — a forward-looking reservation of exposure."
      - name: net
        when: "always computed"
        difference: "Only deducts Payouts that have actually reached DISBURSED — a chronological, cash-actually-moved view. Diverges from gross whenever a Claim is APPROVED but its Payout is still PENDING (gross has already reserved it; net has not yet deducted it)."

  - name: monthly_fee_calculation
    trigger: "RenterEnrollment PENDING_UNDERWRITING->APPROVED or MANUAL_REVIEW->APPROVED (Policy creation), and POST /policies/{id}/coverage-limit-adjustments"
    algorithm: tiered_pricing
    formula: |
      risk_multiplier = 1.0 if risk_tier == LOW else (1.3 if risk_tier == MEDIUM else 1.6)
      pre_clamp_cents = round_half_up(BASE_RATE_PCT * coverage_limit_cents * risk_multiplier) + FLAT_ADMIN_FEE_CENTS
      state_cap_cents = floor(Property.monthly_rent_cents * StateComplianceRule[Property.state_code].max_monthly_fee_pct_of_rent)
      # Reject with ERR_FEE_EXCEEDS_STATE_CAP (not silently clamp) when pre_clamp_cents > state_cap_cents.
      monthly_fee_cents = max(MIN_FEE_CENTS, pre_clamp_cents)   # only reachable when pre_clamp_cents <= state_cap_cents
    input_set: "The Policy's coverage_limit_cents, its RenterEnrollment.risk_tier, its Property.monthly_rent_cents, and StateComplianceRule for Property.state_code."
    constants:
      BASE_RATE_PCT: 0.008
      FLAT_ADMIN_FEE_CENTS: 150
      MIN_FEE_CENTS: 1500
    precision: "integer cents, round_half_up on the risk-multiplied component only"

  - name: premium_installment_allocation
    trigger: "on creation of every PremiumInvoice (first invoice at Policy creation, subsequent invoices via POST /_billing/run-cycle)"
    algorithm: waterfall_allocation
    formula: |
      insurance_premium_cents = round_half_up(Policy.monthly_fee_cents * INSURANCE_PREMIUM_PCT)
      platform_fee_cents      = round_half_up(Policy.monthly_fee_cents * PLATFORM_FEE_PCT)
      state_tax_cents         = round_half_up(Policy.monthly_fee_cents * STATE_TAX_PCT)
      amount_cents = insurance_premium_cents + platform_fee_cents + state_tax_cents
      # Order is pinned: round EACH component to the nearest cent first, THEN sum the three
      # rounded components to get amount_cents. Do NOT compute amount_cents by rounding
      # Policy.monthly_fee_cents once — the two orders can differ by 1-2 cents whenever the
      # per-component products land on a .5-cent boundary.
    input_set: "The invoice's Policy.monthly_fee_cents at issuance time."
    constants:
      INSURANCE_PREMIUM_PCT: 0.85
      PLATFORM_FEE_PCT: 0.10
      STATE_TAX_PCT: 0.05
    precision: "integer cents; round each component independently with round_half_up, then sum (pinned order — Rule 2 combinatorial_formula mode b)"

  - name: claim_payout_calculation
    trigger: "Claim UNDER_REVIEW -> APPROVED"
    algorithm: threshold
    formula: |
      # Step 1: provisional payout, using the flat (non-tiered) deductible.
      provisional_payout_cents = max(0, min(Claim.total_claimed_amount_cents, Policy.gross_available_coverage_cents) - FLAT_DEDUCTIBLE_CENTS)
      # Step 2: the deductible tier is determined FROM the provisional payout (this is the
      # circular-looking part: the final payout depends on the deductible, and the deductible
      # tier depends on a payout figure). The scaffold pins the evaluation order explicitly:
      # provisional_payout_cents (step 1) is what decides the tier, never the final amount.
      deductible_cents = FLAT_DEDUCTIBLE_CENTS * HIGH_TIER_DEDUCTIBLE_MULTIPLIER if provisional_payout_cents >= HIGH_TIER_THRESHOLD_CENTS else FLAT_DEDUCTIBLE_CENTS
      # Step 3: final approved amount uses the tiered deductible from step 2, applied to the
      # claimed amount (not to the provisional payout), then capped at gross_available_coverage_cents.
      approved_amount_cents = max(0, min(Claim.total_claimed_amount_cents - deductible_cents, Policy.gross_available_coverage_cents))
    input_set: "The Claim's total_claimed_amount_cents and its Policy's gross_available_coverage_cents at approval time."
    constants:
      FLAT_DEDUCTIBLE_CENTS: 5000
      HIGH_TIER_THRESHOLD_CENTS: 200000
      HIGH_TIER_DEDUCTIBLE_MULTIPLIER: 1.5
    precision: "integer cents, no rounding (inputs are already integer cents; the multiplier yields an integer here by construction of the constants used in test recipes)"

  - name: subrogation_outstanding_balance
    trigger: "on SubrogationCase creation, on RecoveryPayment creation, and on RecoveryPayment reversal"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = SubrogationCase.original_demand_amount_cents - sum(RecoveryPayment.amount_cents for RecoveryPayment in SubrogationCase.recovery_payments where RecoveryPayment.status == SUCCEEDED)
    input_set: "All RecoveryPayments belonging to this SubrogationCase with status SUCCEEDED."
    constants: {}
    precision: "integer cents, no rounding"

  - name: property_total_paid_claims
    trigger: "Payout PENDING->DISBURSED and Payout DISBURSED->REVERSED"
    algorithm: aggregation
    formula: |
      total_paid_claims_cents = sum(Payout.amount_cents for Payout in Property.claims[*].payouts where Payout.status == DISBURSED)
      # Property.claims[*] means: all Claims whose Policy.renter_enrollment_id.property_id == Property.id
    input_set: "All Payouts, across all Policies/Claims, whose underlying Claim's Policy's RenterEnrollment.property_id equals this Property.id, filtered to status == DISBURSED."
    constants: {}
    precision: "integer cents, no rounding"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a role declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The caller's X-User-Role is permitted to perform this operation per the RBAC matrix (exclusive_operations/shared_operations)."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "All required input fields are present, correctly typed, and enum fields hold a declared value."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every path-param id and every body FK field (landlord_id, property_id, renter_id, policy_id, claim_id, subrogation_case_id, state_code, etc.) refers to a resource that exists, validated left-to-right in the path then top-to-bottom in the body."
    error_id: "ERR_LANDLORD_NOT_FOUND | ERR_RENTER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_RENTER_ENROLLMENT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PAYOUT_NOT_FOUND | ERR_SUBROGATION_CASE_NOT_FOUND | ERR_RECOVERY_PAYMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "The target resource(s) are in a state from which this endpoint's transition is declared in state_machines (see each transition's `from:`/`preconditions:`)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (program-status, submit-underwriting, decide, cancel, pay, info-transition, payout transition, subrogation-case transition, recovery-payment reverse)"
  - priority: 6
    category: business_safety
    check: "A StateComplianceRule exists for the target Property's state_code."
    error_id: ERR_STATE_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /renter-enrollments"
  - priority: 7
    category: business_safety
    check: "StateComplianceRule.enrollment_allowed is true for the target Property's state_code."
    error_id: ERR_STATE_ENROLLMENT_PROHIBITED
    http_status: 422
    applies_to: "POST /renter-enrollments"
  - priority: 8
    category: business_referential
    check: "The target Property's program_status is ACTIVE."
    error_id: ERR_PROPERTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /renter-enrollments"
  - priority: 9
    category: business_temporal
    check: "The new enrollment's [lease_start_date, lease_end_date) interval does not overlap (half-open) any existing non-terminal Policy's [lease_start_date, lease_end_date) interval for the same Property."
    error_id: ERR_LEASE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /renter-enrollments"
  - priority: 10
    category: business_fiscal
    check: "monthly_fee_calculation's pre_clamp_cents for the would-be Policy does not exceed state_cap_cents for the Property's state."
    error_id: ERR_FEE_EXCEEDS_STATE_CAP
    http_status: 422
    applies_to: "POST /renter-enrollments/{id}/submit-underwriting (auto-approve branch), POST /renter-enrollments/{id}/decide (action=APPROVE)"
  - priority: 11
    category: business_constraint
    check: "Claim.line_items is non-empty."
    error_id: ERR_CLAIM_HAS_NO_LINE_ITEMS
    http_status: 422
    applies_to: "POST /claims/{id}/decide (action=APPROVE)"
  - priority: 12
    category: business_fiscal
    check: "claim_payout_calculation's approved_amount_cents does not exceed the Claim's Policy.gross_available_coverage_cents."
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /claims/{id}/decide (action=APPROVE)"
  - priority: 13
    category: business_constraint
    check: "The caller's X-User-ID (ClaimsAdjuster) differs from the Payout's Claim.reviewing_adjuster_id (segregation of duties)."
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /payouts/{id}/transition (action=DISBURSE)"
  - priority: 14
    category: business_referential
    check: "The target Claim has a Payout whose status is DISBURSED."
    error_id: ERR_SUBROGATION_REQUIRES_DISBURSED_PAYOUT
    http_status: 409
    applies_to: "POST /claims/{id}/subrogation-cases"
  - priority: 15
    category: business_fiscal
    check: "RecoveryPayment.amount_cents does not exceed the target SubrogationCase's outstanding_balance_cents."
    error_id: ERR_RECOVERY_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /subrogation-cases/{id}/recovery-payments"
  - priority: 16
    category: business_temporal
    check: "Re-activating a TERMINATED Property requires current clock time >= Property.terminated_at + StateComplianceRule[Property.state_code].cooling_off_buffer_days."
    error_id: ERR_REENROLLMENT_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /properties/{id}/program-status (action=ACTIVATE, from TERMINATED)"

endpoints:
  - method: POST
    path: "/landlords"
    description: "Self-register a landlord account."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, phone_number]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/landlords/{id}"
    description: "Read a single landlord (also establishes the /landlords collection segment used by the properties reverse-reachability sub-resource GET)."
    roles: [Landlord, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/renters"
    description: "Self-register a renter account."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, phone_number]
    output: Renter
    side_effects: []
  - method: POST
    path: "/properties"
    description: "Landlord lists a property/unit for the program."
    roles: [Landlord]
    code: 201
    input: [landlord_id, address_line1, city, state_code, monthly_rent_cents, property_type]
    output: Property
    side_effects: ["sets program_status = PENDING_REVIEW", "sets total_paid_claims_cents = 0"]
  - method: GET
    path: "/properties/{id}"
    description: "Read a single property."
    roles: [Landlord, UnderwritingAgent, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/landlords/{id}/properties"
    description: "List properties owned by a landlord (FK reverse-reachability for Property.landlord_id)."
    roles: [Landlord, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/properties/{id}/program-status"
    description: "Transition a property's program enrollment (ACTIVATE from PENDING_REVIEW or TERMINATED; TERMINATE from ACTIVE)."
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: Property
    side_effects: ["see state_machines.Property"]
  - method: POST
    path: "/renter-enrollments"
    description: "Renter applies for coverage on a unit; runs the property-active, state-compliance and lease-overlap gates before creating the application."
    roles: [Renter]
    code: 201
    input: [property_id, renter_id, payment_plan, requested_coverage_limit_cents, self_reported_annual_income_cents, "verified_annual_income_cents?", "employment_verified?", credit_proxy_score, "prior_eviction_count?", lease_start_date, lease_end_date]
    output: RenterEnrollment
    side_effects: ["sets status = PENDING_UNDERWRITING"]
  - method: GET
    path: "/renter-enrollments"
    description: "Filtered list of enrollments (FK reverse-reachability for both RenterEnrollment.property_id and RenterEnrollment.renter_id, collapsed into one endpoint)."
    roles: [Renter, UnderwritingAgent, Landlord, PlatformAdmin]
    code: 200
    input: ["property_id?", "renter_id?", "limit?", "offset?"]
    output: RenterEnrollment[]
    side_effects: []
  - method: GET
    path: "/renter-enrollments/{id}"
    description: "Read a single enrollment (also establishes the /renter-enrollments collection segment used by the policy reverse-reachability sub-resource GET)."
    roles: [Renter, UnderwritingAgent, Landlord, PlatformAdmin]
    code: 200
    input: []
    output: RenterEnrollment
    side_effects: []
  - method: POST
    path: "/renter-enrollments/{id}/submit-underwriting"
    description: "Runs underwriting_risk_score and auto-routes to APPROVED or MANUAL_REVIEW."
    roles: [Renter]
    code: 200
    input: []
    output: RenterEnrollment
    side_effects: ["see state_machines.RenterEnrollment (both PENDING_UNDERWRITING transitions)"]
  - method: POST
    path: "/renter-enrollments/{id}/decide"
    description: "UnderwritingAgent approves or declines an application in MANUAL_REVIEW."
    roles: [UnderwritingAgent]
    code: 200
    input: [action, "decision_notes?"]
    output: RenterEnrollment
    side_effects: ["see state_machines.RenterEnrollment (MANUAL_REVIEW transitions)"]
  - method: GET
    path: "/renter-enrollments/{id}/policy"
    description: "Find the Policy created for this enrollment (FK reverse-reachability for Policy.renter_enrollment_id; the Policy is cascade-created by an APPROVED transition and never appears in a decide/submit-underwriting response body directly)."
    roles: [Renter, UnderwritingAgent, Landlord, PlatformAdmin]
    code: 200
    input: []
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/policies/{id}"
    description: "Read a single policy."
    roles: [Renter, UnderwritingAgent, Landlord, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{id}/cancel"
    description: "Renter cancels/moves out; cancellation is only permitted from ACTIVE or LAPSED."
    roles: [Renter]
    code: 200
    input: []
    output: Policy
    side_effects: ["see state_machines.Policy"]
  - method: POST
    path: "/policies/{id}/coverage-limit-adjustments"
    description: "UnderwritingAgent adjusts a live policy's coverage limit; OCC-protected (concurrency_rules.coverage-limit-adjustment-stale-policy)."
    roles: [UnderwritingAgent]
    code: 200
    input: [requested_coverage_limit_cents, expected_policy_version]
    output: Policy
    side_effects: ["sets coverage_limit_cents = requested_coverage_limit_cents", "recomputes monthly_fee_cents via monthly_fee_calculation (may reject with ERR_FEE_EXCEEDS_STATE_CAP)", "recomputes gross_available_coverage_cents and net_available_coverage_cents via policy_available_coverage", "increments Policy.version by 1"]
  - method: GET
    path: "/policies/{id}/invoices"
    description: "List a policy's invoices (FK reverse-reachability for PremiumInvoice.policy_id)."
    roles: [Renter, UnderwritingAgent, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PremiumInvoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Renter pays an invoice (first invoice activates the policy; an OVERDUE invoice reinstates a LAPSED policy)."
    roles: [Renter]
    code: 200
    input: []
    output: PremiumInvoice
    side_effects: ["see state_machines.PremiumInvoice and state_machines.Policy"]
  - method: POST
    path: "/_billing/run-cycle"
    description: "System billing sweep, driven by the logical clock (server startup default 2026-07-01T00:00:00Z; see /_clock/set_current_utc). For every ISSUED PremiumInvoice whose due_date + 5 days (OVERDUE_GRACE_DAYS) has passed, marks it OVERDUE and cascades its Policy ACTIVE->LAPSED. For every ACTIVE or LAPSED Policy whose current invoice is PAID and whose next billing_period_start has arrived, issues the next PremiumInvoice (premium_installment_allocation). For every ACTIVE or LAPSED Policy whose lease_end_date has passed, transitions it to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["see state_machines.PremiumInvoice and state_machines.Policy"]
  - method: POST
    path: "/policies/{id}/claims"
    description: "Landlord files a claim against a policy (line_items may be empty at filing time; approval requires at least one)."
    roles: [Landlord]
    code: 201
    input: [policy_id, claim_type, "line_items?"]
    output: Claim
    side_effects: ["sets status = UNDER_REVIEW", "computes total_claimed_amount_cents"]
  - method: GET
    path: "/claims/{id}"
    description: "Read a single claim."
    roles: [Landlord, ClaimsAdjuster, ComplianceOfficer, PlatformAdmin, Renter]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/policies/{id}/claims"
    description: "List a policy's claims (FK reverse-reachability for Claim.policy_id)."
    roles: [Landlord, ClaimsAdjuster, PlatformAdmin, Renter]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/info-transition"
    description: "ClaimsAdjuster requests more information (UNDER_REVIEW->NEEDS_INFO) or Landlord submits it back (NEEDS_INFO->UNDER_REVIEW)."
    roles: [ClaimsAdjuster, Landlord]
    code: 200
    input: [action, "decision_notes?", "line_items?"]
    output: Claim
    side_effects: ["see state_machines.Claim"]
  - method: POST
    path: "/claims/{id}/decide"
    description: "ClaimsAdjuster approves (runs claim_payout_calculation, creates a PENDING Payout) or denies a claim under review."
    roles: [ClaimsAdjuster]
    code: 200
    input: [action, "decision_notes?"]
    output: Claim
    side_effects: ["see state_machines.Claim"]
  - method: GET
    path: "/claims/{id}/payouts"
    description: "List a claim's payouts (FK reverse-reachability for Payout.claim_id; Payout is cascade-created by decide/APPROVE and never appears in that response body)."
    roles: [Landlord, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/payouts/{id}/transition"
    description: "ClaimsAdjuster disburses a PENDING payout to the landlord (segregation-of-duties checked against the claim's reviewing adjuster), or PlatformAdmin reverses a DISBURSED payout (e.g. fraud finding)."
    roles: [ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: [action, "reversal_reason?"]
    output: Payout
    side_effects: ["see state_machines.Payout"]
  - method: POST
    path: "/claims/{id}/subrogation-cases"
    description: "ComplianceOfficer opens a recovery case against the renter for an UNPAID_RENT/BOTH claim whose payout has been disbursed."
    roles: [ComplianceOfficer]
    code: 201
    input: [claim_id, original_demand_amount_cents]
    output: SubrogationCase
    side_effects: ["sets status = OPEN", "computes outstanding_balance_cents = original_demand_amount_cents"]
  - method: GET
    path: "/claims/{id}/subrogation-cases"
    description: "List a claim's subrogation cases (FK reverse-reachability for SubrogationCase.claim_id)."
    roles: [ComplianceOfficer, PlatformAdmin, Renter]
    code: 200
    input: ["limit?", "offset?"]
    output: SubrogationCase[]
    side_effects: []
  - method: GET
    path: "/subrogation-cases/{id}"
    description: "Read a single subrogation case (also establishes the /subrogation-cases collection segment used by the recovery-payments reverse-reachability sub-resource GET)."
    roles: [ComplianceOfficer, PlatformAdmin, Renter]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: []
  - method: POST
    path: "/subrogation-cases/{id}/transition"
    description: "ComplianceOfficer sends the formal demand (OPEN->DEMAND_SENT) or writes off the case (DEMAND_SENT->WRITTEN_OFF)."
    roles: [ComplianceOfficer]
    code: 200
    input: [action]
    output: SubrogationCase
    side_effects: ["see state_machines.SubrogationCase"]
  - method: POST
    path: "/subrogation-cases/{id}/recovery-payments"
    description: "Renter records a payment toward their outstanding subrogation balance; auto-closes the case to PAID_IN_FULL when the balance reaches zero."
    roles: [Renter]
    code: 201
    input: [subrogation_case_id, amount_cents]
    output: RecoveryPayment
    side_effects: ["recomputes SubrogationCase.outstanding_balance_cents via subrogation_outstanding_balance", "see state_machines.SubrogationCase (DEMAND_SENT->PAID_IN_FULL bubble-up)"]
  - method: GET
    path: "/subrogation-cases/{id}/recovery-payments"
    description: "List a case's recovery payments (FK reverse-reachability for RecoveryPayment.subrogation_case_id)."
    roles: [Renter, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RecoveryPayment[]
    side_effects: []
  - method: POST
    path: "/recovery-payments/{id}/reverse"
    description: "PlatformAdmin reverses a recovery payment (e.g. a bounced/charged-back payment)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RecoveryPayment
    side_effects: ["see state_machines.RecoveryPayment"]
  - method: POST
    path: "/state-compliance-rules"
    description: "ComplianceOfficer configures (creates) the compliance rule for a state."
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, "enrollment_allowed?", max_monthly_fee_pct_of_rent, "cooling_off_buffer_days?", "mandatory_alternative_offering?"]
    output: StateComplianceRule
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical current time, used by run-cycle and by every date/deadline check in this scaffold. Before any call, the logical clock reads the fixed default 2026-07-01T00:00:00Z (never real wall-clock time)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the server's logical current time"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role/X-User-ID headers missing or X-User-Role is not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's role is not permitted to perform this operation."
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing, mistyped, or an enum field holds an undeclared value."
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "Referenced Landlord id does not exist."
  - id: ERR_RENTER_NOT_FOUND
    http: 404
    condition: "Referenced Renter id does not exist."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "Referenced Property id does not exist."
  - id: ERR_RENTER_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced RenterEnrollment id does not exist."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "Referenced Policy id does not exist."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "Referenced PremiumInvoice id does not exist."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Referenced Claim id does not exist."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "Referenced Payout id does not exist."
  - id: ERR_SUBROGATION_CASE_NOT_FOUND
    http: 404
    condition: "Referenced SubrogationCase id does not exist."
  - id: ERR_RECOVERY_PAYMENT_NOT_FOUND
    http: 404
    condition: "Referenced RecoveryPayment id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared."
  - id: ERR_STATE_NOT_CONFIGURED
    http: 422
    condition: "No StateComplianceRule exists for the target property's state_code."
  - id: ERR_STATE_ENROLLMENT_PROHIBITED
    http: 422
    condition: "StateComplianceRule.enrollment_allowed is false for the target property's state_code."
  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    condition: "The target property's program_status is not ACTIVE."
  - id: ERR_LEASE_TERM_OVERLAP
    http: 409
    condition: "The requested lease interval overlaps an existing non-terminal Policy's lease interval on the same property."
  - id: ERR_REENROLLMENT_COOLDOWN_ACTIVE
    http: 409
    condition: "A TERMINATED property is re-activated before terminated_at + cooling_off_buffer_days has elapsed."
  - id: ERR_FEE_EXCEEDS_STATE_CAP
    http: 422
    condition: "monthly_fee_calculation's pre-clamp result exceeds the state's fee cap on rent."
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "A claim's computed approved_amount_cents would exceed the policy's gross_available_coverage_cents."
  - id: ERR_CLAIM_HAS_NO_LINE_ITEMS
    http: 422
    condition: "Claim approval attempted while Claim.line_items is empty."
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "The ClaimsAdjuster disbursing a payout is the same identity that approved/denied the underlying claim."
  - id: ERR_SUBROGATION_REQUIRES_DISBURSED_PAYOUT
    http: 409
    condition: "A SubrogationCase is opened for a claim whose Payout has not reached DISBURSED."
  - id: ERR_RECOVERY_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A RecoveryPayment's amount_cents exceeds the SubrogationCase's current outstanding_balance_cents."
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "A coverage-limit-adjustment's expected_policy_version does not match the policy's current version."

roles:
  - name: Anonymous
    description: "Unauthenticated prospect self-registering as a landlord or renter."
    identity: "opaque"
    exclusive_operations: ["POST /landlords", "POST /renters"]
    shared_operations: []
  - name: Landlord
    description: "Property owner who lists properties and files claims."
    identity: "entity_backed:Landlord"
    exclusive_operations: ["POST /properties", "POST /policies/{id}/claims"]
    shared_operations: ["GET /properties/{id}", "GET /landlords/{id}/properties", "GET /renter-enrollments", "GET /renter-enrollments/{id}/policy", "GET /policies/{id}", "GET /claims/{id}", "GET /policies/{id}/claims", "POST /claims/{id}/info-transition (action=SUBMIT_INFO)", "GET /claims/{id}/payouts"]
  - name: Renter
    description: "Prospective/current tenant who applies for coverage, pays invoices, and repays any subrogation balance."
    identity: "entity_backed:Renter"
    exclusive_operations: ["POST /renter-enrollments", "POST /renter-enrollments/{id}/submit-underwriting", "POST /policies/{id}/cancel", "POST /invoices/{id}/pay", "POST /subrogation-cases/{id}/recovery-payments"]
    shared_operations: ["GET /renter-enrollments", "GET /renter-enrollments/{id}/policy", "GET /policies/{id}", "GET /policies/{id}/invoices", "GET /claims/{id}", "GET /policies/{id}/claims", "GET /claims/{id}/subrogation-cases", "GET /subrogation-cases/{id}/recovery-payments"]
  - name: UnderwritingAgent
    description: "Opaque operator who decides manual-review applications and adjusts live coverage limits."
    identity: "opaque"
    exclusive_operations: ["POST /renter-enrollments/{id}/decide", "POST /policies/{id}/coverage-limit-adjustments"]
    shared_operations: ["GET /properties/{id}", "GET /renter-enrollments", "GET /renter-enrollments/{id}/policy", "GET /policies/{id}", "GET /policies/{id}/invoices"]
  - name: ClaimsAdjuster
    description: "Opaque operator who reviews and decides claims and disburses payouts. Segregation of duties: the adjuster identity (X-User-ID) that decided a claim may not also disburse its payout."
    identity: "opaque"
    exclusive_operations: ["POST /claims/{id}/decide", "POST /payouts/{id}/transition (action=DISBURSE)"]
    shared_operations: ["POST /claims/{id}/info-transition (action=REQUEST_INFO)", "GET /claims/{id}", "GET /policies/{id}/claims", "GET /claims/{id}/payouts", "GET /policies/{id}", "GET /policies/{id}/invoices"]
  - name: ComplianceOfficer
    description: "Opaque operator who administers property program enrollment, state compliance rules, and subrogation case lifecycle."
    identity: "opaque"
    exclusive_operations: ["POST /properties/{id}/program-status", "POST /claims/{id}/subrogation-cases", "POST /subrogation-cases/{id}/transition", "POST /state-compliance-rules"]
    shared_operations: ["GET /properties/{id}", "GET /landlords/{id}/properties", "GET /policies/{id}", "GET /claims/{id}/subrogation-cases", "GET /subrogation-cases/{id}/recovery-payments"]
  - name: PlatformAdmin
    description: "Hierarchical-override operator who runs the billing sweep, sets the logical clock, and reverses disbursed payouts and recovery payments (e.g. on a fraud finding or a chargeback)."
    identity: "opaque"
    exclusive_operations: ["POST /_billing/run-cycle", "POST /_clock/set_current_utc", "POST /recovery-payments/{id}/reverse"]
    shared_operations: ["POST /payouts/{id}/transition (action=REVERSE)", "GET /properties/{id}", "GET /landlords/{id}/properties", "GET /renter-enrollments", "GET /renter-enrollments/{id}/policy", "GET /policies/{id}", "GET /policies/{id}/invoices", "GET /claims/{id}", "GET /policies/{id}/claims", "GET /claims/{id}/payouts", "GET /claims/{id}/subrogation-cases", "GET /subrogation-cases/{id}/recovery-payments"]

