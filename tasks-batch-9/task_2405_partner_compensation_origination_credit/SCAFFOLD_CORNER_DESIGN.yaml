              captures: { pst: "$.data.status" }
            - call: "POST /comp/partners/${pd}/notice-of-departure"
              payload: { departure_effective_on: "2027-01-31" }
              as: CycleAdmin
              captures: { e_notdep: "$.data.error_id" }
            - call: "GET /comp/credit-transitions"
              payload: { departing_partner_id: "${pd}", state: "PROPOSED" }
              as: CycleAdmin
              captures: { tr: "$.data[0].id", trpct: "$.data[0].transferred_pct" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { mv2: "$.data.version" }
            - call: "POST /comp/credit-transitions/${tr}/effectuate"
              payload: { successor_partner_id: "${psu}", effective_on: "2026-12-31", expected_matter_version: "${mv2}" }
              as: CycleAdmin
              captures: { trst: "$.data.state" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { mv3: "$.data.version" }
            - call: "POST /comp/credit-transitions/${tr}/effectuate"
              payload: { successor_partner_id: "${psu}", effective_on: "2026-12-31", expected_matter_version: "${mv3}" }
              as: CycleAdmin
              captures: { e_notpend: "$.data.error_id" }
            - call: "POST /comp/credit-transitions/${tr}/void"
              payload: { void_reason: "Second thoughts about the successor.", expected_matter_version: "${mv3}" }
              as: CycleAdmin
              captures: { e_notvoid: "$.data.error_id" }
            - call: "GET /comp/partners/${pd}"
              payload: {}
              as: CycleAdmin
              captures: { pst2: "$.data.status" }
          assert:
            - "${pst} == NOTICE_GIVEN and exactly one CreditTransition was created with ${trpct} == 100.00"
            - "${e_notdep} == ERR_PARTNER_NOT_DEPARTING with HTTP 403, and Partner.${pd}.departure_effective_on is still 2026-12-31"
            - "${trst} == EFFECTIVE"
            - "${e_notpend} == ERR_TRANSITION_NOT_PENDING with HTTP 409"
            - "${e_notvoid} == ERR_TRANSITION_NOT_VOIDABLE with HTTP 409, and CreditTransition.${tr}.void_reason is null"
            - "${pst2} == DEPARTED - the automatic NOTICE_GIVEN -> DEPARTED bubble-up fired once the last PROPOSED transition cleared"
            - "GET /comp/matters/${m}/credit-allocations with credit_role ORIGINATING returns one ACTIVE row for ${psu} and one SUPERSEDED row for ${pd}"
            - "Matter.${m}.origination_pct_assigned == 100.00 - the conserved quantity survived the transfer"

      - name: missing_headers_are_refused_before_the_role_gate
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          The auth gate at priority 10 runs before the role gate at priority 20 and before
          any body parsing: an otherwise perfectly valid cycle-creation body with no
          identity headers returns ERR_UNAUTHENTICATED 401, while the same body with a
          syntactically present but unrecognised role returns ERR_ROLE_NOT_PERMITTED 403.
        test_recipe:
          setup:
            - "Empty database beyond the clock call; no cycle exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
          trigger:
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: Unauthenticated
              captures: { e1: "$.data.error_id" }
            - call: "GET /comp/cycles"
              payload: {}
              as: Unauthenticated
              captures: { e2: "$.data.error_id" }
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: ManagingPartner
              captures: { e3: "$.data.error_id" }
          assert:
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 - X-User-ID and X-User-Role are both absent"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401 on a pure read as well"
            - "${e3} == ERR_ROLE_NOT_PERMITTED with HTTP 403 - ManagingPartner is not one of the five declared roles"
            - "GET /comp/cycles as CycleAdmin returns an empty list, so none of the three refused calls created anything"

