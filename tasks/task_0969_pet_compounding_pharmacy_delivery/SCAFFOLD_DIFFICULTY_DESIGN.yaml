scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: compound_price_provisional_vs_final
        grounds:
          - calculations.compound_provisional_price
          - calculations.compound_final_price
          - entities.CompoundOrder.fields.provisional_price_cents
          - entities.CompoundOrder.fields.final_price_cents
        distinguishing_aspect: |
          Compound-order pricing domain: the same fill (qty 30, flavored, 12 kg dog)
          priced provisionally from catalog cost with sum-then-round yields 4428 cents,
          while the final price from actual consumed lots with per-line rounding and the
          waste-shrink uplift yields 4433 cents — two valid algorithms, different cents,
          on the CompoundOrder entity domain (distinct from the insurance domain instance).
        test_recipe:
          setup:
            - "Verified non-controlled prescription, qty 30, days_supply 10, 12 kg DOG without allergies, chicken flavor (250c surcharge)"
            - "Two lots: L1 20 units @110 exp 2027-01-01 (FEFO-first), L2 200 units @130 exp 2027-06-01; bench BN-D1"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen D1", email: "d1@x.com", phone: "555-01", ship_to_address: "1 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Rex", species: "DOG", weight_kg: 12, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr D1", license_number: "LIC-D1", dea_registration_number: "DEA-D1", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiD1", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 120, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /flavorings", payload: { name: "ChickenD1", allergen_tags: ["CHICKEN"], surcharge_cents: 250, compatible_species: ["DOG", "CAT"] }, as: PharmacyAdmin, captures: { flv: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspD1", dosage_form: "SUSPENSION", strength_mg_per_ml: 50, beyond_use_days: 14, base_compounding_minutes: 60 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 30, days_supply: 10, refills_authorized: 0, directions: "BID", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-D1", received_qty: 20, unit_cost_cents: 110, expiration_date: "2027-01-01" }, as: PharmacyTech, captures: { lot1: $.data.id } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L2-D1", received_qty: 200, unit_cost_cents: 130, expiration_date: "2027-06-01" }, as: PharmacyTech, captures: { lot2: $.data.id } }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-D1", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
          trigger:
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { flavoring_id: "${flv}", is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id, prov: $.data.provisional_price_cents } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-flavoring", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b", captures: { fin: $.data.final_price_cents } }
          assert:
            - "CompoundOrder.${ord}.provisional_price_cents == 4428 (round_half_up((30*120 + 250) * 1.15))"
            - "CompoundOrder.${ord}.final_price_cents == 4433 (lines round(20*110*1.03)=2266 + round(10*130*1.03)=1339; (3605+250)*1.15 = 4433.25 -> 4433)"
            - "CompoundOrder.${ord}.provisional_price_cents != CompoundOrder.${ord}.final_price_cents"
            - "CompoundOrder.${ord}.status == READY_TO_DISPATCH"

      - name: claim_estimate_vs_adjudicated
        grounds:
          - calculations.claim_estimate_and_adjudication
          - entities.InsuranceClaim.fields.estimate_cents
          - entities.InsuranceClaim.fields.approved_amount_cents
        distinguishing_aspect: |
          Insurance-claim payout domain: one claim on one order yields estimate 29350
          cents (waterfall over the provisional price 41688) at creation but 29396 cents
          (waterfall over the final price 41745) at adjudication — a dual-variant split
          on InsuranceClaim/InsurancePolicy, a different entity domain than compound pricing.
        test_recipe:
          setup:
            - "Verified prescription qty 300 (12 kg dog, chicken flavor); lots L1 200@110 exp 2027-01-01, L2 200@130 exp 2027-06-01"
            - "Policy: deductible 5000, coverage 0.8, annual limit 100000, nothing used"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen D2", email: "d2@x.com", phone: "555-02", ship_to_address: "2 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Mog", species: "DOG", weight_kg: 12, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr D2", license_number: "LIC-D2", dea_registration_number: "DEA-D2", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiD2", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 120, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /flavorings", payload: { name: "ChickenD2", allergen_tags: ["CHICKEN"], surcharge_cents: 250, compatible_species: ["DOG", "CAT"] }, as: PharmacyAdmin, captures: { flv: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspD2", dosage_form: "SUSPENSION", strength_mg_per_ml: 50, beyond_use_days: 14, base_compounding_minutes: 60 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 300, days_supply: 30, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-D2", received_qty: 200, unit_cost_cents: 110, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L2-D2", received_qty: 200, unit_cost_cents: 130, expiration_date: "2027-06-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-D2", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { flavoring_id: "${flv}", is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id, prov: $.data.provisional_price_cents } }
            - { call: "POST /insurance-policies", payload: { pet_id: "${pet}", insurer_name: "PetSure", policy_number: "POL-D2", deductible_cents: 5000, coverage_pct: 0.8, annual_limit_cents: 100000, renewal_date: "2027-01-01" }, as: Owner, as_user_id: "${own}", captures: { pol: $.data.id, polv: $.data.version } }
          trigger:
            - { call: "POST /insurance-policies/${pol}/claims", payload: { compound_order_id: "${ord}", claimed_amount_cents: 41688, expected_policy_version: "${polv}" }, as: Owner, as_user_id: "${own}", captures: { clm: $.data.id, est: $.data.estimate_cents } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-flavoring", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
            - { call: "POST /claims/${clm}/adjudicate", payload: { outcome: "APPROVE" }, as: InsuranceAdjuster, captures: { appr: $.data.approved_amount_cents } }
          assert:
            - "InsuranceClaim.${clm}.estimate_cents == 29350 (deductible 5000; round(36688*0.8) = 29350)"
            - "InsuranceClaim.${clm}.approved_amount_cents == 29396 (deductible 5000; round(36745*0.8) = 29396 over final price 41745)"
            - "InsuranceClaim.${clm}.estimate_cents != InsuranceClaim.${clm}.approved_amount_cents"
            - "InsuranceClaim.${clm}.deductible_applied_cents == 5000"

  - rule_id: combinatorial_formula
    instances:
      - name: final_price_per_line_rounding_order
        grounds:
          - calculations.compound_final_price
          - entities.Lot.fields.unit_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round_half_up THEN sum,
          so two consumed lines round(7*115*1.03)=829 and round(3*115*1.03)=355 total
          1184, while the alternative sum-then-round order would give round(1150*1.03)=1185
          — the rounding order alone decides the cent.
        test_recipe:
          setup:
            - "Verified non-controlled prescription qty 10, 2 kg dog, NO flavor; lot L1 7 units @115 exp 2027-01-01 (FEFO-first), lot L2 50 units @115 exp 2027-06-01"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen F1", email: "f1@x.com", phone: "555-11", ship_to_address: "3 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Pip", species: "DOG", weight_kg: 2, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr F1", license_number: "LIC-F1", dea_registration_number: "DEA-F1", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiF1", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 115, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspF1", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-F1", received_qty: 7, unit_cost_cents: 115, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L2-F1", received_qty: 50, unit_cost_cents: 115, expiration_date: "2027-06-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-F1", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id, prov: $.data.provisional_price_cents } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
          trigger:
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b", captures: { fin: $.data.final_price_cents } }
          assert:
            - "CompoundOrder.${ord}.provisional_price_cents == 1150"
            - "CompoundOrder.${ord}.final_price_cents == 1184 (per-line: 829 + 355)"
            - "final_price_cents != 1185 (the sum-then-round alternative is explicitly not the pinned order)"

      - name: shipping_fee_multi_input_cap
        grounds:
          - calculations.shipping_fee
          - entities.Shipment.fields.shipping_fee_cents
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: fee = min(cap, base[service] +
          cold-flag surcharge + ceil(zone_hours/24)*ice_rate) — four inputs with nested
          ceil/min; OVERNIGHT + cold-chain + Z3 computes 3600 uncapped but pins to the
          3500 cap, a different mode than the rounding-order instance.
        test_recipe:
          setup:
            - "Verified cold-chain prescription qty 10 (2 kg dog, no flavor), lot 50 @190 exp 2027-03-01, cooler CLR-F2 available, order paid by card"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen F2", email: "f2@x.com", phone: "555-12", ship_to_address: "4 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Icy", species: "DOG", weight_kg: 2, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr F2", license_number: "LIC-F2", dea_registration_number: "DEA-F2", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "InsulinF2", schedule: "NON_CONTROLLED", requires_cold_chain: true, cold_chain_min_celsius: 2, cold_chain_max_celsius: 8, unit_cost_cents: 200, default_beyond_use_days: 28 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "InjF2", dosage_form: "INJECTABLE", strength_mg_per_ml: 40, beyond_use_days: 28, base_compounding_minutes: 90 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-F2", received_qty: 50, unit_cost_cents: 190, expiration_date: "2027-03-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-F2", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /cooler-assets", payload: { cooler_code: "CLR-F2" }, as: PharmacyAdmin, captures: { cooler: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
            - { call: "POST /compound-orders/${ord}/pay", payload: { payment_method: "CARD" }, as: Owner, as_user_id: "${own}" }
          trigger:
            - { call: "POST /compound-orders/${ord}/shipments", payload: { carrier: "PetEx", service_level: "OVERNIGHT", destination_zone: "Z3", cooler_asset_id: "${cooler}" }, as: Pharmacist, captures: { shp: $.data.id, fee: $.data.shipping_fee_cents } }
          assert:
            - "Shipment.${shp}.shipping_fee_cents == 3500 (1500 + 1200 + ceil(72/24)*300 = 3600, capped at 3500)"
            - "Shipment.${shp}.cold_chain_status == COMPLIANT"
            - "Shipment.${shp}.required_temp_min_celsius == 2 and required_temp_max_celsius == 8"

  - rule_id: non_linear_state_machine
    instances:
      - name: prescription_clarification_cycle
        grounds:
          - state_machines.Prescription.VET_VERIFICATION_PENDING_to_CLARIFICATION_REQUESTED
          - state_machines.Prescription.CLARIFICATION_REQUESTED_to_VET_VERIFICATION_PENDING
          - entities.Prescription.fields.clarification_count
        distinguishing_aspect: |
          Cyclic machine on Prescription: the verification loop
          VET_VERIFICATION_PENDING -> CLARIFICATION_REQUESTED -> VET_VERIFICATION_PENDING
          runs TWICE (clarification_count reaches 2) before vet-confirm lands VERIFIED —
          a revision loop, exercised here on Prescription, a different entity than the
          CompoundOrder rework cycle instance.
        test_recipe:
          setup:
            - "One prescription submitted for vet verification; vet verified"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen N1", email: "n1@x.com", phone: "555-21", ship_to_address: "5 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Kit", species: "CAT", weight_kg: 4, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr N1", license_number: "LIC-N1", dea_registration_number: "DEA-N1", practice_state: "WA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiN1", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspN1", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 1, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
          trigger:
            - { call: "POST /prescriptions/${rx}/request-clarification", payload: { note: "dose unclear" }, as: Veterinarian, as_user_id: "${vet}" }
            - { call: "POST /prescriptions/${rx}/resubmit", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/request-clarification", payload: { note: "still unclear" }, as: Veterinarian, as_user_id: "${vet}" }
            - { call: "POST /prescriptions/${rx}/resubmit", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { st: $.data.status, cc: $.data.clarification_count } }
          assert:
            - "Prescription.${rx}.status == VERIFIED after two full clarification loops"
            - "Prescription.${rx}.clarification_count == 2"

      - name: compound_order_qa_rework_cycle
        grounds:
          - state_machines.CompoundOrder.QA_PENDING_to_REWORK
          - state_machines.CompoundOrder.REWORK_to_COMPOUNDING
          - state_machines.CompoundOrder.QA_PENDING_to_READY_TO_DISPATCH
        distinguishing_aspect: |
          Cyclic machine on CompoundOrder: QA_PENDING -> REWORK -> COMPOUNDING -> QA_PENDING
          -> READY_TO_DISPATCH with a 2-unit waste write-off during rework; the loop is on
          CompoundOrder, a different entity than the Prescription clarification cycle, and
          the reworked pass consumes only the surviving 8 reserved units (final 824).
        test_recipe:
          setup:
            - "Verified prescription qty 10 (2 kg dog, no flavor); one lot 10 units @100 exp 2027-01-01; order allocated and in QA"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen N2", email: "n2@x.com", phone: "555-22", ship_to_address: "6 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Bud", species: "DOG", weight_kg: 2, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr N2", license_number: "LIC-N2", dea_registration_number: "DEA-N2", practice_state: "WA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiN2", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
