              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_terminated: $.data.error_id }
          assert:
            - "${err_cure_ceiling} == \"ERR_CURE_PERIOD_TOO_LONG_FOR_LIFE_SAFETY\" with HTTP 422 (11 exceeds the 10-day life-safety ceiling even though 60 is the global maximum)"
            - "the 10-day notice returns 201 with cure_deadline_date == \"2026-11-10\" and liquidated_damages_cents == 300000"
            - "DefaultNotice.${notice_id}.breached_item_ids == [${item_id}] and issued_by_user_id == \"bm-001\""
            - "after the escalation: DefaultNotice.${notice_id}.status == ESCALATED_TO_TERMINATION and PipPlan.${plan_id}.status == TERMINATED"
            - "PipItem.${item_id}.status == VOIDED and Property.${prop_id}.franchise_agreement_status == TERMINATED"
            - "Property.${prop_id}.compliance_posture == TERMINATED and FranchiseeAccount.${fr_id}.standing == TERMINATED_PORTFOLIO"
            - "${err_terminated} == \"ERR_FRANCHISE_TERMINATED\" with HTTP 409 and GET /pip/plans?property_id=${prop_id} still returns total_count == 1"

      - name: exhausted_life_safety_extension_budget_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EXTENSION_CAP_EXHAUSTED]
          - validations[priority=86]
          - calculations.extension_grant_cap
        distinguishing_aspect: "CATEGORY_MAX_EXT_DAYS is a per-item budget, not a per-request cap, and it is spent at decision time: once a life-safety item has consumed all 30 days a further request may still be filed, but the brand cannot approve it because the computed grant would be zero or less."
        test_recipe:
          setup:
            - "One property with an acknowledged plan carrying one LIFE_SAFETY item of 1000000 cents due 2026-10-30, issued at the default clock."
            - "A first request for 30 days has been approved in full, moving the deadline to 2026-11-29."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Kirkbanks Hotels LLC", contact_email: "ops@kirkbanksh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Kirkbanks Riverside", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-34.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "POST /pip/extension-requests"
              payload: { item_id: "${item_id}", requested_days: 30, business_justification: "The sprinkler main tie-in requires a municipal water shutdown that the utility scheduled for November." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { er1_id: $.data.id }
            - call: "POST /pip/extension-requests/${er1_id}/decide"
              payload: { decision: "APPROVE" }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/extension-requests"
              payload: { item_id: "${item_id}", requested_days: 15, business_justification: "The utility has now moved the water shutdown window a further two weeks into December." }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { er2_id: $.data.id }
            - call: "POST /pip/extension-requests/${er2_id}/decide"
              payload: { decision: "APPROVE" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err: $.data.error_id }
            - call: "POST /pip/extension-requests/${er2_id}/decide"
              payload: { decision: "DENY", decision_note: "The category relief budget for life-safety scope is fully spent." }
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "ExtensionRequest.${er1_id}.status == APPROVED (a full grant, not APPROVED_PARTIAL) with granted_days == 30"
            - "ExtensionRequest.${er1_id}.pressure_ratio_at_decision == 0.0000 (the only item's deadline 2026-10-30 lies beyond the 60-day pressure horizon from 2026-08-01)"
            - "PipItem.${item_id}.extension_days_granted == 30 and deadline_date == \"2026-11-29\""
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id}&entry_type=EXTENSION_GRANTED returns total_count == 1"
            - "the second request is created and PipItem.${item_id}.status == DEFERRED_PENDING_EXTENSION"
            - "${err} == \"ERR_EXTENSION_CAP_EXHAUSTED\" with HTTP 409, so the cap is spent at decision time and not at filing time"
            - "after the refused approval ExtensionRequest.${er2_id}.status is still SUBMITTED and PipItem.${item_id}.deadline_date is still \"2026-11-29\""
            - "the DENY then returns 200: ExtensionRequest.${er2_id}.status == DENIED, granted_days == 0, PipItem.${item_id}.status == SCOPED and extension_days_granted stays 30"
            - "GET /pip/extension-requests?item_id=${item_id} returns total_count == 2 and the EXTENSION_GRANTED ledger still holds exactly one row"

  # =========================================================================
  # Guide section 7 — From Table 7 (RBAC), role_model peer_roles
  # =========================================================================
  - section: rbac
    instances:
      - name: missing_and_invalid_auth_headers_are_rejected
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_MISSING_ROLE]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_MISSING_USER_ID]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The four identity gates fire in priority order and are distinguishable: an absent role header (401), an unknown role name (401), an absent user id (401) and a known role that simply is not on the endpoint (403)."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying one GUEST_FACING item of 1000000 cents exists, so every probe reaches the auth ladder rather than a 404."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Lyndhurst Hotels LLC", contact_email: "ops@lyndhursth.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Lyndhurst Abbey Gate", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-35.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "GET /pip/plans/${plan_id}"
              as: "<no X-User-Role header>"
              as_user_id: "bm-001"
              captures: { err_role: $.data.error_id }
            - call: "GET /pip/plans/${plan_id}"
              as: "Auditor"
              as_user_id: "bm-001"
              captures: { err_invalid: $.data.error_id }
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "<no X-User-ID header>"
              captures: { err_user: $.data.error_id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { err_unauth: $.data.error_id }
          assert:
            - "${err_role} == \"ERR_MISSING_ROLE\" with HTTP 401"
            - "${err_invalid} == \"ERR_INVALID_ROLE\" with HTTP 401 (the role name is well-formed but outside the closed set)"
            - "${err_user} == \"ERR_MISSING_USER_ID\" with HTTP 401, so a valid role alone is not enough"
            - "${err_unauth} == \"ERR_UNAUTHORIZED\" with HTTP 403, distinguishing authorisation from authentication"
            - "PipPlan.${plan_id}.status == DRAFT and issued_at == null"

      - name: brand_and_owner_exclusive_operations_are_forbidden_to_the_other_side
        claim_type: peer_roles
        grounds:
          - roles.BrandManager.exclusive_operations
          - roles.FranchiseeOwner.exclusive_operations
          - roles.BrandInspector.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The three roles are peers, not a hierarchy: brand-exclusive scoping, owner-exclusive capital and inspector-exclusive certification each refuse the other two, while the shared read of a plan works for all three."
        test_recipe:
          setup:
            - "One property with an issued plan carrying one GUEST_FACING item of 1000000 cents, and a COMPLETION inspection scheduled for 2026-08-01 assigned to bi-007."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Mereworth Hotels LLC", contact_email: "ops@mereworthh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Mereworth Signal Yard", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-36.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/inspections"
              payload: { plan_id: "${plan_id}", inspection_type: "COMPLETION", inspector_user_id: "bi-007", scheduled_date: "2026-08-01" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { insp_id: $.data.id }
            - call: "GET /pip/plans/${plan_id}"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "RELICENSING", standards_edition: "2026.1" }
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { err_owner_scopes: $.data.error_id }
            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_brand_acknowledges: $.data.error_id }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 1182500, contingency_pct: 0.10, financing_source: "OWNER_EQUITY", expected_plan_version: "${plan_v}" }
              as: BrandInspector
              as_user_id: "bi-007"
              captures: { err_inspector_funds: $.data.error_id }
            - call: "POST /pip/inspections/${insp_id}/perform"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { err_owner_inspects: $.data.error_id }
            - call: "GET /pip/plans/${plan_id}"
              as: BrandInspector
              as_user_id: "bi-007"
          assert:
            - "${err_owner_scopes} == \"ERR_UNAUTHORIZED\" with HTTP 403 (only the brand scopes plans)"
            - "${err_brand_acknowledges} == \"ERR_UNAUTHORIZED\" with HTTP 403 (only the owner acknowledges)"
            - "${err_inspector_funds} == \"ERR_UNAUTHORIZED\" with HTTP 403 (only the owner authorises capital)"
            - "${err_owner_inspects} == \"ERR_UNAUTHORIZED\" with HTTP 403 (only an inspector performs a visit)"
            - "the shared GET returns 200 for BrandInspector, and the same read succeeds for BrandManager and FranchiseeOwner"
            - "PipPlan.${plan_id}.status == ISSUED and GET /pip/capital-budgets?plan_id=${plan_id} returns total_count == 0"
            - "BrandInspection.${insp_id}.status == SCHEDULED and performed_at == null"

      - name: second_franchisee_cannot_acknowledge_another_owners_plan
        claim_type: peer_roles
        grounds:
          - validations[priority=77]
          - errors[ERR_NOT_PROPERTY_FRANCHISEE]
