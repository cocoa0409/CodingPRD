            - call: "POST /lab-results"
              payload: { sample_id: "${s_q2_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_q2_id: "$.data.id" }
            - call: "POST /lab-results/${r_q2_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /entry-points/${ep_id}/monitoring-reduction-requests"
              payload: { target_status: "ANNUAL", justification: "Four consecutive quarters below the trigger level." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q3", collected_at: "2026-07-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-Q5" }
              as: SamplingTechnician
              captures: { s_q5_id: "$.data.id" }
            - call: "POST /samples/${s_q5_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_q5_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
