              captures: { k1_v2: $.data.version }
            - call: "POST /registry-cases/${k1}/abstractions"
              payload: { expected_case_version: "${k1_v2}", iss_abstracted: 25, gcs_arrival: 8, mechanism_code: "MVC", ed_departure_at: "2026-07-25T16:00:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { ab2: $.data.id }
          assert:
            - "the stale replay returns HTTP 412 with data.error_id == ERR_STALE_CASE_VERSION"
            - "data.error_id != ERR_CASE_NOT_ABSTRACTABLE — the ABSTRACTED case is still abstractable"
            - "GET /registry-cases/${k1}/abstractions returns exactly two records, ${ab1} and ${ab2}; the rejected replay persisted nothing"
            - "AbstractionRecord.${ab1}.review_status == SUPERSEDED and AbstractionRecord.${ab2}.review_status == SUBMITTED"
            - "the re-read version ${k1_v2} is strictly greater than the creation version ${k1_v}"
      - name: stale_cycle_version_rejects_the_remediation_packet
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.remediation-submit-stale-cycle
          - validations[priority=31]
          - errors[ERR_STALE_CYCLE_VERSION]
        distinguishing_aspect: "The remediation write carries the cycle version, not the deficiency version, so a program manager whose view predates the deficiency's own creation is refused with 412 ERR_STALE_CYCLE_VERSION while the deficiency itself is untouched and still OPEN."
        test_recipe:
          setup:
            - "one trauma center with no outreach hours, whose NATIONAL_VERIFICATION cycle readiness is 82.00 and therefore submittable"
            - "the cycle is walked to UNDER_REVIEW and one TYPE_III_MINOR deficiency is recorded, so the cycle version has advanced several times past the captured creation version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Millbrook Trauma", state_code: "IN", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-10-27T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /verification-cycles/${cyc}/submit"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "POST /verification-cycles/${cyc}/surveyor-bookings"
              payload: { surveyor_user_id: "u_surveyor_3", window_start: "2026-10-27T08:00:00Z", window_end: "2026-10-27T17:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/schedule-site-visit"
              payload: { site_visit_date: "2026-10-27T13:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/begin-review"
              payload: {}
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "POST /verification-cycles/${cyc}/deficiencies"
              payload: { criterion_code: "CD-05-9", deficiency_class: "TYPE_III_MINOR", remediation_due_at: "2026-11-27T00:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { def1: $.data.id }
          trigger:
            - call: "POST /criteria-deficiencies/${def1}/remediation"
              payload: { expected_cycle_version: "${cyc_v}", remediation_note: "policy revised and staff re-educated" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { err_id: $.data.error_id }
            - call: "GET /verification-cycles/${cyc}"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc_v2: $.data.version }
            - call: "POST /criteria-deficiencies/${def1}/remediation"
              payload: { expected_cycle_version: "${cyc_v2}", remediation_note: "policy revised and staff re-educated" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "the stale packet returns HTTP 412 with data.error_id == ERR_STALE_CYCLE_VERSION"
            - "immediately after the refusal CriteriaDeficiency.${def1}.status is still OPEN with remediation_note null"
            - "the re-read version ${cyc_v2} is strictly greater than ${cyc_v}"
            - "the retry with ${cyc_v2} returns HTTP 200 and CriteriaDeficiency.${def1}.status == REMEDIATION_SUBMITTED"
            - "VerificationCycle.${cyc}.open_type_iii_count is still 1, since REMEDIATION_SUBMITTED still counts as open"
      - name: under_triage_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / under_triage_threshold_to_cycle_block
          rationale: "The four-level chain from a triage review through the rate threshold, the posture and the cycle block is asserted there at every level."
      - name: both_readiness_variants_are_exercised
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_score_variants_diverge_on_remediation_submitted_deficiency
          rationale: "Both variants are read on one dataset there and their delta is asserted."
      - name: under_triage_rate_threshold_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / triage_rates_on_empty_case_cohort_return_zero
          rationale: "The degenerate boundary of the rate trigger (an empty denominator returning 0.00 rather than dividing by zero) is asserted there."
  - section: consistency_model
    instances:
      - name: verified_outreach_hours_are_visible_to_the_next_read_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.outreach_credit_hour_ledger
          - endpoints[POST /outreach-activities/{id}/verify]
        distinguishing_aspect: "3.60 professional-education hours quantize to 3.50 at creation while the centre ledger stays 0.00, and the very next read after verify shows outreach_credit_hours_ytd 3.50 and readiness 87.25 — no denormalised field lags behind its write."
        test_recipe:
          setup:
            - "one trauma center with outreach_credit_hours_ytd 0.00 and a NATIONAL_VERIFICATION cycle in PREP"
            - "one PROFESSIONAL_EDUCATION activity of 3.60 raw hours logged but not yet verified"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Saltmarsh Trauma", state_code: "SC", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-11-10T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /trauma-centers/${c1}/outreach-activities"
              payload: { activity_kind: "PROFESSIONAL_EDUCATION", event_date: "2026-06-18T00:00:00Z", credit_hours: 3.600, audience_count: 42 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { oa1: $.data.id }
          trigger:
            - call: "GET /trauma-centers/${c1}"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "POST /outreach-activities/${oa1}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "GET /trauma-centers/${c1}"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "GET /verification-cycles/${cyc}/readiness"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "OutreachActivity.${oa1}.weighted_credit_hours == 3.50 from the create response, because 3.60 * 1.0 quantizes down to 3.50"
            - "the read before verify shows TraumaCenter.${c1}.outreach_credit_hours_ytd == 0.00 while the activity is LOGGED"
            - "the verify response itself returns verified_status == VERIFIED with reviewed_by_user_id == u_director_1"
            - "the read immediately after verify shows outreach_credit_hours_ytd == 3.50"
            - "the readiness read immediately after verify returns outreach_penalty == 12.75 and readiness_score == 87.25"
