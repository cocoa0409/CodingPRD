        grounds:
          - state_machines.CustomFarmingContract.DRAFT_to_ACTIVE
          - endpoints[POST /contracts/{id}/activate]
          - entities.CustomFarmingContract.fields.client_signature_name
        distinguishing_aspect: "POST /contracts/{id}/activate by the owning ClientOwner moves contract_status DRAFT -> ACTIVE, stores client_signature_name Dana Ridgecrest and takes version from 2 (after one enrollment) to 3."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (12.5 acres) enrolled under DRAFT contract C1, so C1.version is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
